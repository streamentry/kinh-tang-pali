notes: |-
  **Tên tạng `Cariyāpiṭaka` — ĐO LẠI BẰNG SCRIPT, và con số của tôi khác số người điều phối nói.** Trong `content/translation/vi/project/sutta/kn/` có **27** tệp `cp`; đọc đúng khoá `<uid>:0.1` thì: **24** viết *Hạnh Tạng*, **1** (`cp34`) giữ nguyên Pāli `Cariyāpiṭaka`, **2** (`cp1`, `cp35`) không có khoá `:0.1` (hai tệp này chỉ có phần cuối, xem `cp1:…` và `cp35:…`). Người điều phối nói 23 và 1; **đo lại ra 24 + 1 + 2**, vì `cp35` tính vào nhóm thứ ba chứ không phải nhóm *Hạnh Tạng*. Đa số 24/25 là *Hạnh Tạng*, và đó cũng là nghĩa đúng của `cariya` (hạnh) + `piṭaka` (tạng), nên tôi dùng. `cp34` mới là ngoại lệ.

  **Các tên khác trong bài, đo được:** `0.2` `Yudhañjayavagga` → *Phẩm Yudhañjaya* (**10×**: cp21, cp23–25, cp27, cp28, cp30, cp32, cp33) · `0.3` `Saccapāramī 3` → *Chân Thật Ba-la-mật Thứ Ba*, dựng theo cặp `Saccapāramī 1/2/4/6` của cp27/cp28/cp30/cp32 · `0.4` `Vaṭṭapotakacariya` → *Hạnh Của Chim Cút*, theo khuôn *Hạnh Của …* (25/27 tệp `cp` có `:0.4`) và theo *Kinh Chim Cút* đã có ở `ja35:0.4` cho `Vaṭṭakajātaka`; cả `cp` lẫn `ja` đều dùng *chim Cút* cho loài `vaṭṭa`, và `sakuṇikā` ở dn3:1.14.1 cũng là *chim cút nhỏ* · `12.1` → *Hạnh của chim Cút, thứ chín.* theo đúng quy ước 23/24 dòng cuối của các tệp `cp` (chữ *của* thường; chỉ `cp34` viết hoa *Của*).

  **8/51 khoá trùng nguyên văn — dùng lại nguyên văn.** `0.1` *Hạnh Tạng* (24×) · `0.2` *Phẩm Yudhañjaya* (10×) · `1.1` `Punāparaṁ yadā homi,` → *“Lại nữa, vào thời thuở nọ* (**12×**: cp2, cp3, cp5, cp6, cp7, cp12…) — nhưng `cp28:1.1` và `cp32:1.1` viết *“Lại nữa, khi ta còn là*, tức đa số 12/14 vẫn là *vào thời thuở nọ* · `7.2` `bhīto tasitavedhito;` → *đã hoảng sợ, run rẩy cả mình;* (1×, cp19:4.2) · `10.1`–`10.3` **là ba khoá trùng y hệt `ja35:1.1`–`1.3`** (`Santi pakkhā apatanā,` / `santi pādā avañcanā;` / `Mātāpitā ca nikkhantā,`) nên tôi dùng lại nguyên văn *Có loài chim không bay, / có đôi chân không bước; / cha mẹ đã lánh mình đi,* · `10.4` `jātaveda paṭikkama'.` → *hỡi lửa cháy, hãy lui đi* (`ja35:1.4`) · `11.5` → *Về sự chân thật, không ai sánh bằng ta:* (**3×**: cp27:4.3, cp30:9.5, cp32:6.5) · `11.6` → *đây là Chân Thật Ba-la-mật của ta* (1×, cp32:6.6).

  **BẤT ĐỊNH CẦN NGƯỜI RÀ SOÁT — `10.1`–`10.3` dùng lại nguyên văn của `ja35` nhưng nghĩa khác.** Ở `ja35` (Jātaka 35) ba câu ấy đứng độc lập nên tiền lệ đọc được là mô tả chung; ở `cp29` chúng nằm trong **lời tự thú của chính chim cút**, và bản Anh đã ghim dịch ngôi một (*I have wings that do not fly!*). Tôi vẫn dùng nguyên văn `ja35` theo nguyên tắc *"Pāli trùng thì dùng lại nguyên văn"* để không để kho có hai cách, nhưng đây là điểm mà bản Anh có lý hơn. Người điều phối nên phán một lần cho cả hai bài.

  **Coverage tầng Anh: công thức cho tỉ lệ 1,00 nhưng KHÔNG đo được gì — và đây là giới hạn của phép đo, không phải của tầng.** Mọi khoá Pāli của cp29 đều là **nửa câu thơ** ngắn hơn 40 ký tự sau khi nén (dài nhất **27**), nên `substantiveSegments = 0` và `src/lib/canon/reference.ts` trả `substantive === 0 ? 1 : …` = **1,0000**. Tầng Anh có thật: `sutta/kn/cp/cp29_translation-en-sujato.json` **có trong `source/upstream-manifest.json`** (commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`), đã sync, đủ 51 khoá, 50 khoá có chữ. Nhưng vì không có Pāli có nội dung nào thì cổng coverage không đo được gì cho bài này; `triangulation` vẫn chấm 9,3 vì bản Anh đã ghim phủ đủ mọi câu kệ. Tầng `vietnamese-current` vắng tại commit đã ghim (26 tệp, toàn bộ Pháp Cú).

  **Thuật ngữ, kèm số đếm.** `jine` / `jinasevita` → *Đấng Thắng* (`cp32:5.2` *do các Đấng Thắng trước đã thực hành*) · `saccakiriya` → *lời tuyên thệ chân thật* (`cp30:7.1` *Với lời tuyên thệ chân thật này*) · `uttamaṁ` → *tối thượng* (`cp30:9.2`) · `Saccabalamavassāya` → *nương vào sức mạnh của sự chân thật* · `Āvejjetvā dhammabalaṁ` → *Được sức mạnh của Pháp khích lệ* (*khích lệ* 110 khoá) · `gimha` → *mùa hè* theo đúng 1 tiền lệ `mil7.5.9:1.2` *vào giữa mùa hè* cho `gimhasamaye` · `kāyikaṁ balaṁ` → *sức lực thân xác* (0 tiền lệ, lặp nguyên văn ở `2.4` và `6.2`) · `soḷasakarīsāni` → *mười sáu dặm* (*dặm* có 2 tiền lệ ngoài bài này: an4.190:2.6, tha-ap61:2.2 *nửa dặm*; một `karīsā` ≈ một dặm theo cách bản Anh đã ghim đọc). **0 tiền lệ cho danh sách tính tốt ở `8.1`–`8.2`:** `sīlaguṇo` → *phẩm chất giới luật* · `soceya` → *trong sạch* (*trong sạch* 208 khoá) · `anuddayā` → *lòng không ghét*; ba từ sau hợp với nghĩa, nhưng bản Anh đã ghim dịch *truth, purity, and mercy* nên `anuddayā` còn có thể là *lòng từ bi* (67 khoá) — người rà soát phán một lần, và nếu đổi thì phải đổi cả hai tệp.

  **Dấu lược: Pāli 0 `…pe…` ↔ Việt 0 `…`.** Nhặc kép y hệt Pāli: `“` mở ở `1.1`, đóng `”` ở `11.6` (giữ `ti`); nháy đơn `‘…’` của lời trong trí chính chim cút mở ở `7.1`, đóng `’` ở `10.4` — kho đã có 21 khoá kết bằng `’ti.` nên cách này không lạ. Chốt `_hvi.py` sạch: 51/51 khoá, khoá thừa 0, NFC OK.
