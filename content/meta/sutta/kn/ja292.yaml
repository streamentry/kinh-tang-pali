  điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp (6.6) vì không có
  tầng tham khảo nào.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 3 khoá chênh lệch lớn nhất (`2.1`, `3.3`, `0.4`) → khác nghĩa 0: sửa 0, giữ 3, bất định 0 mới. `2.1` `dohaḷinī`: bản mù “đang nghén”, bài “mang thai” theo `ja281:1.3`, `ja532:75.3` (2 khoá; `tha-ap551:12.1` dịch `dohaḷo` “cơn thèm nghén”); ý thèm vẫn có ở `2.2` “muốn ăn”, nên là khác sắc thái diễn đạt, không khác nghĩa. `3.3` `Bhattu apacitiṁ kummi`: hai bản cùng nghĩa (tỏ lòng tôn kính chủ). `0.4`: khác cách đặt tên. Hai bất định đã ghi từ trước (`rañño` ở `3.2`; chủ của cái mũi ở `3.4`) không nằm trong danh sách chênh lệch và lần dịch lại không giải được thêm. Rà đối kháng toàn bài 17 khoá: nháy khớp Pāli, không dấu lược, số `asīti` + `sahassa` = 80.000 giữ nguyên, xưng hô nhất quán; không phát hiện thêm lỗi. Không có bản Anh hay bản Việt độc lập khác.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
