  KHOÁ ĐÃ SỬA (10/17 khoá; 8 khoá lỗi nghĩa/ranh giới thật, 2 khoá chỉnh văn):
  - 3.1 "Trong số ấy ta là sứ giả" sai: tesaṁ là sở hữu cách chỉ tác nhân (họ phái đi), không phải
    "trong số ấy". Đã sửa theo đúng Pāli trùng ja547:324.1 (1/1 cặp trùng ngoài bài, bản Việt đã có
    "Tôi là sứ giả được họ phái đến"); đồng thời đổi ta → tôi: đây là sứ giả nói với đại vương, cùng
    quy ước ja515 và ja547.
  - 3.2 "được vua phái đến nơi ngài" sai: Pāli không có động từ phái; rañño camhi idhāgato đọc là "và đã
    đến đây, đến với vua".
  - 3.3–3.4 bản cũ nối "Vì … nên" bằng quan hệ nhân quả mà Pāli không có, và thêm "ngài" (mũi ngài).
    Đã trả về hai mệnh đề đứng cạnh nhau: bhattu apacitiṁ kummi ("tôi tỏ lòng cung kính chủ nhân",
    kummi là hiện tại ngôi một của karoti; apacitiṁ karoti đối chiếu mil5.5.10:9.1 "cung kính",
    mnd3:38.8) và nāsāya amakaraṁ vaṇaṁ ("gây ra vết thương ở mũi"; vaṇaṁ karoti đối chiếu
    ja526:46.1 "gây ra vết thương"). Không thêm chủ sở hữu của cái mũi.
  - 1.3–1.4 lệch ranh khoá: bản cũ dồn parivārito sang 1.3 ("vây quanh tám mươi nghìn bọn") và đưa
    "vua là" vào 1.4 mà Pāli không có; "bọn" cũng không có trong Pāli. Đã trả về 1.3 "bởi tám mươi
    ngàn", 1.4 "Supatta được vây quanh"; đổi nghìn → ngàn theo đa số kn/ja (130 ngàn / 15 nghìn).
  - 1.2 "đang ở trú" không thành tiếng Việt, đổi "cư ngụ". 1.1 Varanasi → Bārāṇasī và "Đại vương" →
    "tâu đại vương": Bārāṇasī 134 khoá, Varanasi 4 khoá và cả 4 đều từ cùng đợt nháp này; "tâu đại
    vương" theo ja5:1.2.
  - 2.2 "muốn được ăn" → "muốn ăn" (bhakkhitum icchati, không có bị động).
  - 2.4 "từng phần trong bữa cơm của vua" sai: paccagghaṁ là tính từ "quý giá" (đối chiếu pv15:16.2
    paccagghañca vilepanaṁ = "dầu xoa quý giá"), không phải "từng phần". Đã sửa "bữa ăn quý giá của vua".
  - 1.1, 2.1, 2.3, 0.x, 4.1 giữ nguyên (2.1 "mang thai" theo ja281/ja532).

  PĀLI TRÙNG: trong bài 0 cặp trùng nội bộ; ngoài bài 2 cặp có bản Việt (1.3 với tha-ap397:11.1, 3.1 với
  ja547:324.1); tha-ap397 dịch "Được tám mươi ngàn" vì câu đó đứng một mình với chủ ngữ khác, nên không
  ép chung. Dấu lược: không có …pe… hay (…) trong bài. Ngoặc kép mở ở 1.1 và đóng ở 3.4 khớp Pāli;
  không có nháy đơn. Số: asītiyā sahassehi = 80 × 1.000 = 80.000 = "tám mươi ngàn".

  BẤT ĐỊNH CÒN LẠI (không phải blocker, cả hai cách đọc cùng một mạch truyện). (1) rañño ở 3.2: đọc là
  vua Bārāṇasī (người được gọi mahārāja ở 1.1) hoặc là sở hữu cách "thuộc về vua [quạ]"; bản Việt giữ
  "đến với vua". (2) Chủ sở hữu cái mũi ở 3.4 không nói trong Pāli; mạch truyện gợi mũi người nghe,
  nhưng kho không có chú giải để kiểm nên không đưa "ngài" vào. Các mục cũ ở trên viện dẫn chú giải
  Jātaka để phân xử kummi/nāsāya: kho không có tệp chú giải, nên tôi KHÔNG coi đó là căn cứ đã kiểm.
