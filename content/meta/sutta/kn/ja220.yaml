notes: |-
  Tên phẩm Dukanipāta = Bộ Hai Bài Kinh theo BRIEF_VI3.md §11. Bài kệ nói về an lạc độc cư thiền định trong rừng vắng, tưởng niệm chánh pháp của bậc chân nhân. Uddāna số 10: 'Dhammadhajajātakaṁ dasamaṁ' = thứ mười; 'Bīraṇathambhavaggo sattamo' = phẩm thứ bảy.

  TẦNG THAM KHẢO — 0 khoá có Anh Sujato: edition `translation/en/sujato` tại commit đã ghim (11c9d708978cde8ba61096d8a75f7ddfb846f639) không có tệp nào cho bài này — đây là `not-published-upstream`. Không có Việt hiện hành, không có lớp lấp `english-project`. ⇒ `draft`, `triangulation` 7.5.

  Đủ khoá so với Pāli gốc, không có khoá nào thiếu hay orphan.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  Sửa lan 2026-10-13: khoá ja220:0.3 và ja220:3.2, "Bīraṇathamba" →
  "Bīraṇathambha" (thêm h). Căn cứ Pāli Bīraṇathambhavagga ở cả hai khoá và
  tên phẩm ở ja211–ja219:0.3 (9/9 bài cùng phẩm viết Bīraṇathambha).

  Lô G7 2026-10-15: kiểm lại lỗi lặp bằng Pāli đã ghim, Claude Sonnet 5.5 (Claude Code). 1.4 và 2.4
  `jhāyasi`/`jhāyāmi` ở bối cảnh `kapaṇo viya` dịch "ngồi trầm tư" theo ja283, ja429, ja477 (không
  phải thiền định). Điểm giữ nguyên, trừ semantic_fidelity +0,1 do sửa lỗi nghĩa; technical_integrity
  giữ nguyên.

  Lượt kiểm toán Jātaka chỉ có Pāli (đợt 7) 2026-10-15, Claude Sonnet 5.5 (Claude Code): đọc đủ mọi
  khoá Pāli↔Việt, tham chiếu PED. 1.1–1.2, 2.1–2.2 sửa theo Pāli: `sukhaṁ jīvitarūposi/-smi` là "trông
  như người sống sung sướng" (`-rūpa`), `raṭṭhā` là quốc độ, `vivanaṁ` là chốn rừng hoang; 5.3–5.4
