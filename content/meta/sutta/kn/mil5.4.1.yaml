notes: |-
  Dịch từ Pāli root, không có tầng Anh ở commit ghim nên triangulation thấp, bài giữ draft.
  Văn xưng theo tiền lệ cùng phẩm mil5.4.10: Thưa Đại đức Nāgasena, Tâu Đại vương.
  Đầu đề 0.2/0.3/0.4 giữ Pāli theo mil5.4.10 (Meṇḍakapañha, Sabbaññutañāṇavagga).
  acintiya không có tiền lệ, dịch bất khả tư nghì; kapittha giữ tên trái theo Pāli.
  Coordinartor chạy bốn cổng trước khi gộp: npm run validate, npm test, npm run check, npm run build.
  Lượt cải thiện 2026-10-11 (đọc đối kháng 30 khoá, sửa 19 khoá, đo tiền lệ trên toàn tầng bản dịch):
  Sửa nghĩa: 1.3 bổ sung dhamani (gân) bị bỏ sót, "bể đầu" thành "vỡ đầu" theo bhinnasīso (2/2 nơi khác); 3.1 bỏ "đánh bại và" vì Pāli chỉ có apanayitabbaṁ (loại trừ); 3.2 bỏ "đập vỡ" (pothenti chỉ là đập) và "muốn ăn" (phalakāmā chỉ là muốn có trái); 4.1 bỏ "ví như" vì Pāli là idha pana (ở đây, tiền lệ dn29), 1.6 đổi "Sao" thành "Lẽ nào" vì kiṁ na là câu hỏi tu từ (tiền lệ ja531:55.4), thay "tai họa" bằng "sự tổn hại" (upaghāta: tổn hại 25 nơi, tai họa 2 nơi), dùng "loại trừ" cho apanayituṁ cho khớp 3.1 và 3.3. Làm rõ: 1.4, 1.5, 1.6 dùng "vị ấy" cho Mahāmoggallāna để không lẫn với "ngài" là Nāgasena.
  Sửa thuật ngữ theo số đếm: "Ta" viết hoa trong lời Đức Phật (mama sāvakānaṁ: 44 nơi viết hoa, 0 nơi viết thường; 1.2 và 2.2); "bậc tối thượng" cho etadaggaṁ theo mil5.5.3 (nơi duy nhất cùng công thức, bản trước dùng "tối thắng"); acintiya thành "không thể nghĩ bàn" (12 nơi, "bất khả tư nghì" chỉ 2 nơi; 3.1, 3.3, 3.4, 3.6, 4.4, 5.4); "bình" thay "ghè" (mil3.2.3 cùng hình ảnh dập lửa dùng "bình"; 5.1); davaḍāha thành "lửa rừng" (5/5 nơi; "hỏa hoạn" 0 nơi); tejas thành "lửa" theo mil7.4.3 (5.3); aparajjhati/aparādhikatā thành "phạm lỗi" (aparādha trong mil luôn là "lỗi", 4.1 và 4.3); laguḷa thành "gậy" (tầng dùng "gậy" 5 nơi, "côn" 2 nơi, "gậy gộc" 0 nơi; "gậy gộc" mang sắc thái khẩu ngữ hơn Pāli trung tính); iddhivisaya thành "phạm vi thần thông của bậc có thần thông" theo ne6:7.6 (cùng cấu trúc iddhimantānaṁ iddhivisayā); samannāhāro thành "sự chú ý" (6/6 nơi, 5.4); "nơi nương tựa" cho paṭisaraṇa (43 nơi, "chỗ nương" 12 nơi); 5.5 thành "trẫm xin kính nhận" theo công thức sampaṭicchāmī (trong mil5.4 và mil5.5 có 16 trên 18 nơi dùng "trẫm", 30 nơi "kính nhận").
  Đính chính ghi chú cũ: acintiya thật ra có tiền lệ ("không thể nghĩ bàn", chủ yếu ở AN và kệ). Điểm đổi: semantic_fidelity 9.1 thành 9.3 (bổ sung dhamani, bỏ ba chỗ thêm nghĩa); grammar_logic 9.2 thành 9.3 (kiṁ na, idha pana, pothenti); terminology 8.8 thành 9.0 (mười hai thuật ngữ khớp số đông; còn hai chỗ tầng chia đôi chưa ép); vietnamese_clarity 9.2 thành 9.3 (phân biệt "vị ấy" và "ngài", câu 3.4 có động từ có). Giữ nguyên: source_provenance, segment_alignment, triangulation (vẫn không có bản Anh độc lập), han_viet_balance, ambiguity_integrity, technical_integrity.
  Bất định còn lại: (1) sañcuṇṇitaṭṭhimaṁsadhamanichinnaparigatto, parigatta không có nơi nào khác trong Pāli đã ghim, và chinna có thể bổ nghĩa cho dhamani hay cho toàn thân; bản dịch "xương, thịt và gân nát vụn, toàn thân đứt nát" bao cả hai cách hiểu, chưa phân xử được. (2) Kiṁ na samattho ở 1.6 hiểu là câu hỏi tu từ "lẽ nào không", chỉ có một tiền lệ. (3) adhimattaṁ balavataraṁ dịch "vượt trội và mạnh mẽ hơn", tầng phần nhiều dịch adhimatta là "mạnh" nên giữ vế "vượt trội" để không bỏ một đơn vị nghĩa. (4) kapittha giữ tên Pāli, chưa xác định tên Việt.
  Không đổi dù có nghi ngờ: cách xưng Nāgasena (tầng chia: tôn giả 160+, bạch ngài 94, thưa ngài 45, Đại đức 40), giữ "thưa Đại đức Nāgasena" theo mil5.1 và mil5.4.10 cho nhất quán trong phẩm; "Tâu Đại vương" viết hoa (cả tầng 54 nơi hoa, 314 nơi thường, nhưng trong mil5.4 là 13 và 11, và mil5.4.10 dùng hoa); công thức câu hỏi hai đầu không thêm "cũng" cho ayampi (25 trên 29 nơi không có); sakhī và sahāyakā gộp thành "bạn bè thân hữu" (tầng dịch sakhī là "bạn"); āṇaṁ pavatteti dịch "ban hành mệnh lệnh" (không có tiền lệ để đo).
  Kỹ thuật: không được chạy bốn lệnh npm run validate, npm test, npm run check, npm run build trong lượt này nên technical_integrity giữ 9.6, không tuyên bố đã qua cổng.
