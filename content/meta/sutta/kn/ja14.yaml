notes: |-
  Đối chiếu đủ ba chân: Pāli + Sujato (8/9 khoá; 2.1 kết luận theo công thức
  colophon như ja1/ja159) + tiền lệ tầng dự án. rasa → vị ngon (tiền lệ dn27:
  Ôi vị ngon); āvāsa → trú xứ (tiền lệ mn/dn: trú xứ xa vắng); Sīlavagga → Phẩm
  Giới (tiền lệ dn13: Phẩm Giới Uẩn); Sañjaya giữ tên Pāli (tiền lệ dn2/dn16/mn30);
  santhava → nơi tụ họp theo Sujato meeting places.
  Ghi nhận một chỗ lệch với Sujato: 1.3 gahananissita nghĩa là nương rừng sâu
  trong khi Sujato ghi domesticated; bản Việt theo Pāli vì Pāli là authority.
  Không có bản Việt hiện hành cho Jātaka tại commit đã ghim nên triangulation
  giữ 9.0 thay vì cao hơn.
