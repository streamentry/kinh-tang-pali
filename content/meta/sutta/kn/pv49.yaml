notes: |-
  Đủ 8/8 khoá trong all. Khung tên sách/phẩm/colophon giống pv48 nên giữ một cách dịch.
  bhoga → của cải (tiền lệ); paribhuñjati → thọ dụng (tiền lệ); saṃharati → thâu góp.
  sama/visama → chân chánh/không chân chánh (cách tạo của cải ngay thẳng và không ngay thẳng); bhāginī → phải chịu phần (người nói xưng mayaṃ đi với dạng nữ, giữ chúng tôi trung tính).

  Lượt cải thiện 2026-10-11 (đọc đối kháng 8/8 khoá, đối chiếu Pāli; 4 khoá đổi):
  - pv49:1.2 `samena visamena ca`: "chân chánh lẫn không chân chánh" → "chính đáng lẫn không chính đáng". sama/visama ở đây là phương cách làm ra của cải (đều/ngay thẳng so với bất chính), không phải sammā; "chân chánh" dễ lẫn với thuật ngữ `sammā` của dự án. Các nơi khác trong kho dịch sama/visama theo ngữ cảnh (công bằng/bất công bằng, đúng đắn, gập ghềnh) nên không có đa số để theo; chọn cách sát nghĩa phương cách. terminology 9.0 → 9.2.
  - pv49:1.1 `saṁharimhā`: "thâu góp" → "gom góp" (tiền lệ `saṁharitvā` = "gom" ở sn15.1, sn56.36; bớt âm Hán–Việt cổ, nghĩa không đổi); kéo theo 0.3 và 2.1 (khung tên) và `translationTitle`/tag cho khớp. han_viet_balance 9.3 → 9.4.
  - technical_integrity 10.0 → 9.6: không chạy được các cổng kỹ thuật trong lượt này; còn phải chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`.
  - Giữ nguyên, đã cân nhắc: "phải chịu phần khổ đau" cho `dukkhassa bhāginī` (pv26:12.4 dịch "kẻ dự phần vào khổ"; hai cách đều đúng nghĩa "kẻ có phần trong khổ", giữ vì "dự phần" nghe như điều tốt); "những kẻ khác ... chúng" cho `te aññe` (te có thể là chỉ định của "kẻ khác" hoặc tân ngữ "của cải": không phân xử được từ Pāli một mình, kết quả nghĩa như nhau, nên giữ cách đọc "những kẻ khác thọ dụng chúng"); số nhiều "chúng tôi" cho `mayaṁ ... bhāginī` (dạng nữ, không đổi nghĩa). Không có tầng tham khảo English nên triangulation giữ 7.0; bất định ở `te`, `sama/visama` còn lại nên ambiguity_integrity, semantic_fidelity giữ nguyên.
