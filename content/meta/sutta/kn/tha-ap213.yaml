notes: |-
  **Bài này.** `tha-ap213` · phẩm `Hatthivagga` (Phẩm Hatthi) · trưởng lão
  Hatthidāyaka · **25 khoá Pāli, 25 khoá đã dịch, đủ và không thừa**. Trước tôi tệp
  này chỉ có **1** khoá (`6.1`), vì lát cũ được chia bằng bộ lọc ngưỡng 40 ký tự
  của `_hvi.py`; tôi đã dựng lại **toàn bộ** từ Pāli root đã ghim.

  **Năm phép kiếm, chạy tay, mỗi phép in số** (`n39/check.py`):
  1. `set(khoá Việt) = 25`, `set(khoá Pāli) = 25`, bằng nhau: đúng; thiếu 0, thừa 0;
     thứ tự khoá bằng thứ tự Pāli: đúng.
  2. Ngoặc kép `“”`: Pāli 2 / Việt 2. Nháy đơn `‘’`: Pāli 0 / Việt 0. Số khoá lệch
     khi so **từng khoá** cho cả hai loại: **0**.
  3. Pāli trùng nguyên văn **trong chính bài này** mà Việt khác: **0 nhóm**.
  4. Pāli có `…pe…`: **0**; Pāli có `…` trần: **0**; lệch: **0**. Bài này vốn
     không có dấu lược nào — và tôi không thêm chữ ở chỗ Pāli lược.
  5. Mẫu số coverage (Pāli ≥ 40 ký tự, bỏ khối `:0`) = **1** (`tha-ap213:6.1`).
     Sujato phủ **0/1**. Ba tầng tham khảo: `english-sujato` 0 tệp trong manifest,
     `vietnamese-current` 0 tệp, `english-project` 0 tệp. **Mẫu số bằng 1 nghĩa là
     cổng coverage gần như không đo được gì** — đó là hạn chế của ngưỡng 40 ký tự
     với bài kệ ngắn, không phải bằng chứng rằng bài đã đối chiếu Anh.

  **Pāli trùng nguyên văn ở bài khác: 12 khoá, dùng lại nguyên văn 10.**
  Toàn tầng đã dò **152.959** segment, **97.528** chuỗi Pāli có bản dịch; trong đó
  **7.721** chuỗi Pāli trùng mà tầng đang có nhiều hơn một cách Việt — nên
  nguyên văn bản dịch là chỗ dựa, không phải chỗ tuyệt đối.

  **Bốn chỗ CỐ Ý không dùng lại nguyên văn**, và đây là lý do:
  - `1.2 dvipadindassa tādino;` — trùng 4 segment nhưng **3** cách Việt, và cả ba
    đều sai: 2 bản dịch `tādino` thành *đáng tôn kính*, 1 bản thêm `tathāgata`
    (Đấng Như Thật) vốn **không có** trong Pāli. Tôi dịch theo nghĩa `tā` + `tādin`:
    *bậc Lưỡng Túc, Đấng ham muốn điều ấy*.
  - `4.3 Samantapāsādikā nāma,` — đúng 1 tiền lệ, dịch *Mang tôn hiệu …*. Nhưng
    đếm `nāma` trong tầng `tha-ap` thì *tên là / tên* áp đảo (ví dụ `romaso nāma
    pabbato` → *có ngọn núi tên là Romasa* 3 lần). Tôi theo đa số: *tên là …*.

  **Thuật ngữ, đếm được (trong tầng Việt dự án):** `Therāpadāna` giữ nguyên
  **352** so với *Trưởng Lão Ký Sự* **9** (trùng 361 khoá). `Hatthivagga`: trong
  chính nhóm phẩm này (6 khoá trùng, đều là bài `tha-ap`) **Phẩm Hatthi 4** vs
  *Phẩm Bậc Voi* **2**; toàn tầng grep `Phẩm Hatthi` **15** vs `Phẩm Bậc Voi`
  **2**. Hai phép đo cùng ra đa số là *Phẩm Hatthi* ⇒ chọn nó, và **không** thêm
  chữ *bậc* vì `hatthi` chỉ là *voi*. `Paṭisambhidā catasso` → *Bốn vô ngại giải*
  **361/369**; `vimokkhāpi ca aṭṭhime` → *và tám giải thoát này* **24**;
  `Chaḷabhiññā sacchikatā` → *Sáu thắng trí đã chứng đắc* **32**;
  `kataṁ buddhassa sāsanaṁ”` → *đã làm tròn lời dạy của Đức Phật* **328**;
  `cakkavattī mahabbalā` (số nhiều, vì `4.2` là mười sáu vị) → *là các Chuyển
  Luân Vương có đại oai lực* **14**; `Catunnavutito kappe` → *Vào chín mươi tư
  kiếp trước đây* **30**; `Duggatiṁ nābhijānāmi` → *Tôi không còn biết đến đọa
  xứ nào* **60** (tôi chọn bản này vì người kể là *tôi*, không phải *ta*).
  Tiêu đề `:0.3` theo khuôn đo được trong `tha-ap`: *Bài Kệ Tuyên Ngợ Về Trưởng Lão
  …* **198** vs *Bài Kệ Tuyên Ngôn …* **65** vs *Ký Sự Về Trưởng Lão …* **88** vs
  *Bài Kệ Tuyên Ngợi …* **10**; lục kết `<Tên>therassāpadānaṁ` theo cùng khuôn:
  **174** / **63** / **36** / **10**. Vì vậy tôi dùng **Tuyên Ngợ** cho cả hai, và
  số thứ tự `thứ nhất` (đếm chung tầng: thứ nhất 53, thứ hai 56, thứ ba 51,
  thứ tư 44, thứ mười 60).

  **Hai khoá kệ tôi dịch, không có tiền lệ nguyên văn** — đọc Pāli, không đoán:
  - `Uttamatthaṁ anubhomi` (*ta đã đạt tới điều tối thượng*) và `santipadamanuttaraṁ`
    (*cảnh tịch tĩnh tối thượng không gì sánh bằng*). Tiền lệ gần nhất về hình thức:
    `snp3.9:39.3` `Uttamatthamanuppattaṁ` → *đã đạt đến mục đích tối thượng*.
  - `īsādanto urūḷhavā` (*đi bước uy nghi, thân hình cao lớn*) — dùng lại nguyên văn
    bản dịch đã có cho cùng cụm Pāli này ở `vv43`/`vv20` (2 khoá).
  - `Nāgaseṭṭho` là tên riêng ghép (nāga + seṭṭha) và xuất hiện **đúng 1 lần** trong
    toàn bộ Pāli root đã ghim; giữ nguyên dạng Pāli, không dịch nghĩa, không chú
    thích trong ngoặc.

  **Bất định đã ghi, không che.** (1) `1.2 tādino` có thể hiểu là *ham muốn* hoặc
  là *kẻ được mong muốn*; tôi chọn *ham muốn* vì `tādin` là danh từ chủ động và vì
  câu kệ ngay sau (`Nāgaseṭṭho mayā dinno`) nói hành động cho. (2) `urūḷhavā`
  có thể là *trong hàng voi* hoặc *cao lớn như voi*; tôi theo bản dịch đã có sẵn
  trong tầng cho cùng cụm. (3) `4.1 Aṭṭhasattatikappamhi` = 78; con số này kiểm
  được bằng tiền lệ cùng dạng: `Catusattatikappamhi` → *bốn mươi tám* (1) và
  `Sattasattatikappamhi` → *bảy mươi bảy* (2).

  **`6.1` và `7.1` — công thức lời-kết của chú giải, giữ nguyên bản có sẵn.**
  Pāli `Itthaṁ sudaṁ āyasmā hatthidāyako thero imā gāthāyo abhāsitthāti` có
  **2** bản dịch trong tầng: (A) *Tôi nghe như vầy: Tôn giả Trưởng lão … đã nói
  những bài kệ này* và (B) *Bạch Thế Tôn, Tôn giả Trưởng lão … đã từng nói bài kệ
  này*. Tôi giữ (A) vì (B) bỏ mất `sudaṁ`, thêm một xưng hô không có trong Pāli
  (khoá này không có `bhagavā`/`buddha`) và làm số nhiều `imā gāthāyo` thành số
  ít. Tệp của lát này nằm ngoài lát tôi nên tôi **không** sửa những bản (B).

