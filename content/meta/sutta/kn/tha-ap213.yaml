  validate|test|check|build`, nên tôi **không** tuyên bố technical gate pass.
  Bốn lệnh còn lại cho người điều phốn: `npm run validate` · `npm test` ·
  `npm run check` · `npm run build`. Phần tôi tự kiểm được: JSON hợp lệ, mọi chuỗi
  NFC, khoá trùng đúng UID và thuộc Pāli gốc, thứ tự khoá khớp Pāli, 0 orphan,
  ngoặc kép và nháy đơn khớp Pāli từng khoá, dấu lược khớp từng khoá.

  **Giải quyết draft 2026-10-12 (kiểm toán độc lập, đọc đối kháng từng khoá từ Pāli).**
  Thay thế các nhận định cũ ở mục trên về `1.2 tādino`, `1.4 urūḷhavā`, tiêu đề
  `Tuyên Ngợ`, `6.1`, `mahabbalā` và `Nāgaseṭṭho`. Khoá lỗi nghĩa thật: **8/25**
  (`1.1`, `1.2`, `1.3`, `1.4`, `2.1`, `3.3`, `6.1`, `4.4`), thêm **8** khoá chỉnh
  cách diễn đạt/nhất quán (`0.3`, `2.3`, `3.2`, `3.4`, `4.2`, `5.2`, `5.4`, `7.1`).
  - `1.2 dvipadindassa tādino`: bản cũ *Đấng ham muốn điều ấy* là sai. `tādī` là
    thuật ngữ chỉ bậc không dao động, không bị khuấy động; Sujato dịch cùng chữ ở
    `thag1.41:1.4` và `thag16.9:14.2` là *unaffected*, và tầng Việt dự án đã có
    *bậc Bất Động* ở `tha-ap536`, `tha-ap562`. Nay: *bậc chúa của loài hai chân,
    bậc bất động*.
  - `1.4 īsādanto urūḷhavā`: bản cũ *đi bước uy nghi, thân hình cao lớn* là sai
    (tiền lệ lẻ loi **1**/4 khoá cùng Pāli; ba khoá kia *ngà như cán cày, thân hình
    to khỏe*). Cụm này đi cùng nhau ở `mn61:7.1`, nơi Sujato dịch *tusks like
    draft-poles, able to draw a heavy load*. Nay: *ngà như cán cày, đủ sức gánh nặng*.
  - `1.3 Nāgaseṭṭho`: bản cũ coi là tên riêng. Là hợp từ `nāga` + `seṭṭha`, đứng
    ngay trước hai tính từ mô tả con voi (`īsādanto urūḷhavā`) nên là danh từ chung:
    *con voi ưu tú nhất*.
  - `2.1 anubhomi` là *thọ hưởng/trải nghiệm* (hiện tại), không phải *đã đạt tới*
    (sẽ là `anuppatta`). Nay *Ta đang thọ hưởng mục đích tối thượng*; `2.2`
    *cảnh giới tịch tĩnh vô thượng*.
  - `1.1`: `Siddhatthassa bhagavato` là sở hữu cách chỉ người nhận, bản cũ *Của Đức
    Thế Tôn* gây hiểu nhầm; nay *Đến Đức Thế Tôn* (tiền lệ `tha-ap100:1.1`).
    `dinno/dinnaṁ/adadiṁ` đổi *trao tặng* thành *dâng* vì người nhận là Đức Phật;
    `2.3 Nāgadānaṁ` = *tặng phẩm là con voi*, `3.4` *đây là quả của việc dâng voi*.
  - `3.3 Duggatiṁ nābhijānāmi`: bản cũ lẫn *Tôi* với *ta* ở các khoá kệ lân cận
    (`1.3`, `2.1`, `3.2`) và thêm *còn*; nay *ta không biết đến đọa xứ nào*.
    Tiền lệ đa số (102 *Tôi không còn biết…*) không dùng vì mâu thuẫn xưng hô
    trong chính bài và `nābhijānāmi` không có nghĩa *còn*.
  - `4.4 mahabbalā` = *có đại lực* (không phải *đại oai lực*; 14 tiền lệ cũ đều thêm
    *oai*). `4.2` thêm *đã có* cho `āsiṁsu`.
  - `6.1`: `Itthaṁ sudaṁ` = *Như vậy*, không phải *Tôi nghe như vầy* (`Evaṁ me
    sutaṁ`, không có trong Pāli). Công thức lỗi này là tiền lệ của **556**/562 bài
    `tha-ap` đã dịch trong tầng; chỉ **2** bài dùng *Như vậy,*. Tôi chỉ sửa bài này
    và báo đây là lỗi lan cần sửa riêng. Nay: *Như vậy, Tôn giả Trưởng lão
    Hatthidāyaka đã nói những bài kệ này.*
  - Tiêu đề `0.3`/`7.1`: *Tuyên Ngợ* là chữ hỏng/không có nghĩa tiếng Việt; theo
    chuẩn của họ `tha-ap` đổi thành *Ký Sự Về Trưởng Lão Hatthidāyaka*;
    `translationTitle` đã khớp `0.3`. `0.1 Therāpadāna` giữ nguyên theo quy ước
    tầng (352 so với 9).
  - Số: `Catunnavutito` = 4 + 90 = **94**; `Aṭṭhasattati` = 8 + 70 = **78**;
    `soḷasa` = **16**. Đúng như bản cũ; không đổi.
  - `5.2 vimokkhāpi ca aṭṭhime`: thêm *cả* cho `api`; `5.4 kataṁ`: *đã được thực
    hiện* thay *đã làm tròn* (không có nghĩa *tròn*).

