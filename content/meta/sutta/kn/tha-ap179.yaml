notes: |-
  **Bài này.** `tha-ap179` · phẩm `kumudavagga` · thứ bảy trong phẩm (`6.1` tự xác nhận) · vị trưởng lão Ekadīpiya · `6.2` xác nhận đây là phần tụng đọc thứ chín. Bài có 21 khoá Pā li; bản dịch phủ đủ 21/21.

  **Đo trước khi chọn.** Chỉ mục Pā li→Việt toàn tầng: 3545 cặp Pā li giống hệt đã dò (không tính 4 tệp của lát), 1863 cặp trùng về lời, 9 khoá khớp nguyên văn. Dùng lại nguyên văn ở `0.1` (365), `0.2` (3), `1.3` (39), `2.3` (63), `2.4` (1), `3.4` (14), `4.1` (374), `4.2` (655), `4.3` (341).

  **Năm phép kiếm, số do script in ra.**
  (1) set(khoá Việt) == set(khoá Pā li): thiếu 0, thừa 0. Có 20/21 khoá Pā li ngắn hơn 40 ký tự.
  (2) `“”` và `‘’` so từng khoá: 21 khoá đã so, 0 khoá lệch; ngoặc kép Pā li 2 / Việt 2; nháy đơn Pā li 0 / Việt 0. Pā li mở nháy ở `1.1`, đóng ở `4.3`.
  (3) Pā li trùng trong chính bài: 0 cặp, Việt khác 0 cặp.
  (4) Dấu lược: `…pe…` 1, `…` trần 0; bản dịch có 1 dấu `…`; lệch 0. `4.2` là `…pe…` và bản dịch giữ đúng một `…`.
  (5) NFC / khoá rỗng / ký tự Pā li lọt: 0 vấn đề; `Saḷala` có mặt trong chính Pā li bài này ở `1.2` dạng `saḷale`.

  **Bất định, đã ghi thay vì giấu.**
  `ekadīpa`: `dīpa` đọc được cả *ngọn đèn* lẫn *hòn đảo*. Chính bài này nghiêng hẳn về nghĩa đèn — `1.4` là `ekadīpaṁ adāsahaṁ`, đã thắp lên, và `2.4` là `dīpadānassidaṁ phalaṁ`, quả của việc trao đèn. Tôi dịch *một ngọn đèn* và giữ nghĩa đảo ở đây, không đưa vào thân kinh. Tên vị trưởng lão `Ekadīpiya` mang cùng gốc.
  `2.1 Bhave nibbattamānamhi` + `2.2 nibbatte puññasañcaye`: 6 bản đã có ở nơi khác, mỗi bản một lời, và **không bản nào giữ cả hai vế** — mỗi bản nén `bhave` thành *tái sinh* và làm mất chủ ngữ `nibbatte`. Tôi dịch sát: *Khi ở trong các cõi hữu, nó được sinh ra, sinh ra từ tích lũy công đức*. Chủ ngữ `nibbatte` là cái ngọn đèn đã thắp ở `1.4`, nên *nó* có cơ sở trong chính bài.
  `2.3 Duggatiṁ nābhijānāmi`: đây là công thức lặp **rất** dày — 454 bản đã có ở nơi khác, chia làm 15 lời. Nhóm đông nhất (124 bản) là *Ta không biết mình rơi vào khổ đau*, nhóm kế (63 bản, kể cả bản của tôi) là *Tôi không còn biết đến đọa xứ nào*. Tôi theo nhóm kế vì hai lý do đo được: một, `duggati` là *đọa xứ* — nhóm *đọa xứ* cộng lại 170 bản, nhiều hơn nhóm *khổ đau* 135; hai, `nābhijānāmi` có vế phủ định `nā`, và *không còn biết* giữ nó, còn *không biết mình* thì không. Đây là chỗ tôi **không** theo đa số, nên ghi lại để người biên tập có thể phán lại cả nhóm.
  `3.2 ito te caturo janā`: `te` là ngữ nhân xưng *ngươi*, tức nói với vị trưởng lão; tôi giữ *đến với ngươi* thay vì làm phẳng thành *có bốn người*.

  **Tên riêng giữ nguyên dạng Pā li.** `Ekadīpiya`: `5.1` dạng Nom. sg. `ekadīpiyo`, `0.3` là `Ekadīpiyattheraapadāna`, `6.1` là `Ekadīpiyattherassāpadānaṁ` — ba nơi khớp. Vị trí thứ bảy trong phẩm do `6.1` xác nhận, đúng với phẩm `kumudavagga` gồm `tha-ap173`–`tha-ap182`.

  **Chính sách `:0.3` — đo rồi mới chọn.** Giữ số khi và chỉ khi Pā li `:0.3` bắt đầu bằng số. Đo ở 427 tệp `tha-ap*.yaml`: KEEP 15 · DROP 297 · LỆCH 115; 130 bài có Pā li `:0.3` bắt đầu bằng số, trong đó chỉ 8 tệp viết số vào `translationTitle` và cả 8 khớp số Pā li với hình thức `N. `. Bài này Pā li `:0.3` = `Ekadīpiyattheraapadāna` **không bắt đầu bằng số** ⇒ **BỎ số**: `0.3` và `translationTitle` cùng là *Bài Kệ Tuyên Ngợ Về Trưởng Lão Ekadīpiya*. Trước khi sửa, `translationTitle` là *Tự Thuật Của Trưởng lão Ekadīpiya*; tôi đổi để khớp `0.3` và để chung hình thức với hai bài `tha-ap` kia của lát. `tests/unit/tha-ap-title.test.ts` không tồn tại, tôi tự đếm.

  **Tiền lệ `ti`, đo ở phạm vi gần nhất — ghi cả hai số.** Trong 427 tệp `tha-ap*.yaml`: *Bài Kệ Tuyên Ngợ Về* 191 · *Ký Sự Về* 88 · *Bài Kệ Tuyên Ngôn Về* 65 · *Kinh Kệ Của* 39 · *Truyện Kệ Của* 14 · *Tự Thuật Của* 14. Riêng tên phẩm `kumudavagga`: tầng có 3 lời khác nhau — *Phẩm Bậc Cho Sen* (`tha-ap176`), *Phẩm Hoa Sen Trắng* (`tha-ap177`), *Phẩm Kumuda* (`tha-ap182`) — không có đa số, nên tôi theo quy ước chung của tầng là giữ tên Pā li: *Phẩm Kumuda*.

  **Tầng tham khảo — đo manifest.** Tại commit 11c9d708978cde8ba61096d8a75f7ddfb846f639 thư mục con `sutta/kn/` của `english-sujato` không có `tha-ap` ⇒ 0 tệp, 0 segment Anh. `vietnamese-current` chỉ có 26 tệp, toàn bộ Pháp Cú ⇒ không có bản Thích Minh Châu. `english-project` không có tệp cho bài này. Mẫu số coverage = 1 khoá Pā li ≥ 40 ký tự (bỏ `:0`), Sujato phủ 0/1. `reference-gaps.yaml` **đã có** entry cho `tha-ap179` ⇒ không chặn `review`/`published`.

