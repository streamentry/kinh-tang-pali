notes: |-
  Đã đọc HẾT v7/p3.txt trước khi viết. 12 khoá: 4 vế kệ + tiêu đề + dòng kết.

  Tiền lệ, đếm được (mọi số đo theo khoá, đã trừ 12 bài của lát này):
  · `:0.1` giữ dạng “Therīgāthā 2.3” / “Therīgāthā 2.5” như thig2.8:0.1 và
    thig2.9:0.1 — hai bài CÙNG Phẩm Hai Bài Kinh, đã published — thay vì dạng trần
    “Therīgāthā” của thig2.1/thig2.2, vì bỏ số là mất thông tin có trong Pāli.
  · `:0.2` Dukanipāta → Bộ Hai Bài Kinh (thig2.1, thig2.2, thig2.8, thig2.9).
  · `:0.3` theo đúng dạng “Kinh Kệ Của Trưởng Lão Nữ <tên>” của bốn bài trên.
  · `:3.1` dòng kết lược `… <tên> therī ….` — chọn GIỮ đúng hai dấu lược như Pāli, theo
    thig2.8:3.1 và thig2.9:3.1, tức hai bài cùng Phẩm Hai Bài Kinh, cùng dạng lược, đã
    published. Đếm trên toàn tầng: 37 bài giữ dấu lược so với 12 bài mở rộng; trong chính
    Phẩm Hai Bài Kinh thì cả hai bài đã có đều giữ. Ghi lại ở đây vì 9 bài thig1.x khác
    đã mở rộng dòng kết theo công thức “Bạch Thế Tôn, … đã từng nói bài kệ này” —
    tức corpus đang lệch hai chiều; xin biên tập phán một lựa chọn chung, tôi không sửa
    bài ngoài lát.
  · Vế kệ giữ “”ti.” (16:6 trong tầng thig, và thig2.8:2.4/thig2.9:2.4 đều giữ), khác
    tầng mil bỏ “ti” (110:7).
  · tamokhandhaṁ padāliyā → “phá vỡ khối tối tăm”: dùng lại nguyên văn thig5.11:4.6.
    saṅghāṭi → “y ngoài” (54 khoá, 5 chỗ đúng nghĩa y phục ngoài trong tầng).
    khambha → “tảng đá” (14). pattaka → “bát”. Daṇḍamolubbha → chống gậy (10).
    rukkhamūla → gốc cây (204). gầy 32, lật ngược 14.

  Bất định:
  · thig2.3 là kệ tục ngữ, ẩn dụ nấm–chày giã. `chattaka` là nấm: “nấm” có 12 khoá trong
    tầng nhưng 8 khoá là “nấm đất” trong dn27; ở đây là nấm ăn được nên dịch “con nấm”
    (0 tiền lệ đúng cụm này, đặt mới). `musala` là chày giã: “chày” có 24 khoá trong tầng
    nhưng đều theo nghĩa đánh trừng phạt, không có cụm “chày giã” nào, đặt mới.
    `ukkhalikā me deḍḍubhaṁ vāti` đọc là “con nấm ấy dường như đã bị hấp rồi nổi phồng
    lên”, giữ nghĩa chữ của cả hai vế (ukkhalikā = hấp/luộc, deḍḍubha = phồng/nổi) và giữ
    `vāti` = “dường như”. Sujato dịch vế này “my mortar wafted like an eel”, không bám
    theo vì không có căn cứ trong Pāli cho cả ba chữ.
  · thig2.5 `bāḷhadubbalā` là ghép hai từ cùng nghĩa (bāḷha = yếu, dubbala = yếu ốt);
    dịch “yếu ốt lắm” như một vế, không lặp thành hai từ.

  Kiểm thủ công: save_vi hai lần → idempotent. Tự kiết trên TOÀN BỘ 12 khoá (chốt của
  _hvi.py không tự chạy vì mọi khoá Pāli ở hai bài này đều dưới 40 ký tự): NFC, không rỗng,
  không thừa, dấu lược khớp từng khoá (khoá :3.1 có 2 ở cả hai phía), không Pāli lọt,
  nháy kép cân (mở ở :1.1, đóng ở :2.4), không “(…)” dở. Kết quả 0 lỗi. Không chạy npm run
  validate|test|build (đợt này cấm), nên technical_integrity 9.8.

  LỖ HỔNG TẦNG THAM KHẢO, đo được: SuttaCentral có 11/12 khoá, im lặng đúng khoá `:3.1`
  (17 và 25 ký tự). Vì cả hai khoá đó ngắn hơn 40 ký tự nên không vào mẫu số coverage,
  coverage đo trên Pāli có nội dung là “không có khoá nội dung”, không cần ghi vào
  content/meta/reference-gaps.yaml. Mọi vế kệ đều có bản Anh Sujato ở commit đã ghin và
  đã đối chiếu từng vế.

