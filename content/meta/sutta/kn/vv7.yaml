  · `Pāricchattakavagga` (0.3, chỉ ở vv31): *Phẩm Cây San Hô* **1 tệp** (`vv36:0.3`), không
    có cách thứ hai. Củng cố bằng tầng tên đã ghim `vv-name:32.vv-paricchattakavagga`
    = The Chapter With the Coral Tree.
  · `Pīṭhavagga` (0.3, vv6/vv7/vv9): *Phẩm Pīṭha* **9 tệp** ⟵ giữ Pāli 2
    (`Mahārathavagga`, `Sunikkhittavagga`).
  · NGÔI KỂ xưng tự: *vậy tôi* **30 dòng / 22 tệp** ⟵ *vậy ta* 4 dòng / 4 tệp ⇒ chọn
    **vậy tôi**.
  · `mahānubhāva`: *đại oai lực* **18 dòng / 9 tệp** ⟵ *uy thế lớn lao* 12 dòng / 9 tệp ⇒
    chọn **đại oai lực**.
  · `sabbadisā disā` toàn cục: *khắp mọi phương* **45 dòng / 27 tệp** ⟵ *khắp muôn phương*
    31 dòng / 23 tệp ⟵ *khắp bốn phương* 7 dòng / 6 tệp.
    ⚠ Nhưng đo theo CHÍNH CÁI PĀLI thì đảo ngược, và đây là mấu chốt của lát này:
    `…te sabbadisā pabhāsatī”ti.` (Tôn giả hỏi, ngôi 2) → *muôn phương* **19 tệp** ⟵
    *mọi phương* 8 ⟵ *bốn phương* 5; còn `…me sabbadisā pabhāsatī”ti.` (nữ thiên đáp,
    ngôi 1) → *mọi phương* **19 tệp** ⟵ *muôn phương* 10 ⟵ *bốn phương* 2; và
    `Obhāsentī disā sabbā,` → *mọi phương* **8/8 tệp**.
    ⇒ Lát này theo **đa số theo từng PĀLI** (luật PĀLI trùng nguyên văn thì dùng lại nguyên
    văn thắng số đếm toàn cục): câu hỏi → *muôn phương*, câu đáp → *mọi phương*.
    Hệ quả trung thực: trong `vv6`/`vv7`/`vv9` cùng một ý `sabbadisā` mà hai bản dịch khác
    nhau. Cụm `vv1`+`vv3`+`vv4`+`vv10`+`vv13`+`vv14` của kho cũng y hệt (hỏi *muôn phương*,
    đáp *mọi phương*), tức đây là quy ước của cụm đông nhất chứ không phải lỗi đơn lẻ — nhưng
    người biên tập có thể muốn thống nhất lại; nếu vậy thì phải sửa **cả hai vế ở cả 44 tệp**,
    việc đó không thuộc lát này và tôi không tự ý sửa bài đã có.

  Nguồn tên kinh: đọc tầng `name/` đã ghim cùng commit để phân giải ba chữ trong tên bài —
  `vv-name:35.vv31` = Couch Mansion ⇒ `Pallaṅka` là kiều/ngai; `vv-name:8.vv6` và
  `vv-name:9.vv7` = Ship Mansion / Second Ship Mansion ⇒ `Nāvā` là **thuyền** (đúng như
  `pv28:5.2` `Nāvāya ca tvaṁ avalamba tiṭṭhasi;` đã dịch *còn ngươi thì dựa vào thuyền mà
  đứng vững*); `vv-name:11.vv9` = Lamp Mansion ⇒ `Dīpa` là **đèn**. Ba tên đó được giữ
  nguyên Pāli trong tiêu đề (`Phẩm Pīṭha`, `Cung Điện Pallaṅka`, `Cung Điện Nāvā`) theo đúng
  cách 43/44 tệp `vv` đang làm với `Vimānavatthu`; riêng `Dīpavimānavatthu` dịch là *Đèn*
  vì *đèn* là từ Việt phổ thông đúng nghĩa, còn `Pallaṅka`/`Nāvā`/`Pīṭha` thì không.
  Tầng `name/` của `sn` không có tên từng bài (2119 mục nhưng `sn14.18`/`sn12.43`/`sn12.44`
  đều để trống), nên ba bài `sn` của lát dùng tiêu đề dịch nghĩa.

  Nháy kép: đặt đúng vị trí Pāli đặt, và cân trên cả bài (đã kiểm bằng `ngoặc()` của
  `_hvi.py` cho từng khoá đã dịch). `vv1:4.4` có lỗi tiền lệ — dư một dấu `”` thành
  `…muôn phương?”.”` — tôi KHÔNG sao chép lỗi ấy; bản đa số (5 tệp) là `…muôn phương?”`
  và đã dùng nguyên văn bản ấy.

  Dấu lược: không khoá nào của `vv31`/`vv6`/`vv7`/`vv9` có `…pe…` ở Pāli, và bản Việt cũng
  không có một dấu lược nào — mỗi khoá khớp 0 = 0.

  Bất định riêng của `vv6`/`vv7` (các vế kệ ngắn này không có tiền lệ nào trong 44 tệp `vv`):
  · `5.3`–`7.4` — 0 tiền lệ cho toàn bộ khối mô tả người tỳ-kheo khát nước, dòng nước và cây
    cối quanh thuyền. Ba chỗ tôi dựa vào bản Việt `pv28` (Petavatthu), vì `vv` vay nguyên văn
    từ đó: `Pallaṅkaseṭṭhe` → *trên tòa tuyệt hay* (`pv28:2.3`), `Pahūtamalyā
    bahupuṇḍarīkā` → *gần như phủ kín bởi hoa nhài, lại đầy những bông sen* (`pv28:3.2`,
    khác chỉ dấu câu), `vālukasanthatā` → *phủ cát* (`vv39:1.2` `soṇṇavālukasanthate` →
    *nền phủ cát vàng đẹp đẽ* — chỗ này Pāli có `soṇṇa` nên mới có *vàng*; ở `vv6`/`vv7:7.2`
    Pāli chỉ có `vāluka` = cát, nên tôi KHÔNG thêm *vàng*, dù tiền lệ có). `pokkharaṇi` thì
    tầng đang chia làm hai: `pv28:3.1` dịch *Tấm sàn* còn `mn12`/`sn3.19` dịch *hồ sen*; ở
    đây `ogāhasi pokkharaṇiṁ` là *bước xuống sàn thuyền* nên tôi theo `pv28`.
  · `7.3` `Ambā ca sālā tilakā ca jambuyo` — tên cây: *xoài, sāl, tilaka, cây jambu*; `tilaka`
    và `jambu` giữ Pāli vì chúng là tên loài cây đã quen (`tha-ap252` giữ *hoa uddālaka*),
    còn `ambā` và `sālā` có từ Việt phổ thông đúng nghĩa. `Uddālakā`/`pāṭaliyo` cũng giữ Pāli:
    `tha-ap252`/`tha-ap257` đã giữ *uddālaka*/*pāṭaliya*.
  · `6.3` `Sītodakā tassa bhavanti najjo` — 0 tiền lệ; `najjo` là *tấm gương* và câu ví nước
    mát với gương, không có gì để dịch thêm.
  · `8.1` `Taṁ bhūmibhāgehi upetarūpaṁ` — 0 tiền lệ; `bhūmibhāga` là *phần đất*, `upetarūpa`
    là *mang hình dạng*. Bản nháp đầu tiên của tôi viết *Ở từng phần đất, cung điện ấy hiện
    ra với hình dạng* rồi nối tiếp *là cung điện tối thượng* thành câu đứt; đã sửa thành
    *Cung điện ấy ở từng phần đất, đều mang một hình dạng*.
  · ⚠ **NGOẠI LỆ CỐ Ý so với luật PĀLI trùng thì khớp.** `5.4` `Uṭṭhāya pātuṁ udakaṁ
    adāsiṁ.` và `6.1` `Yo ve kilantāna pipāsitānaṁ,` có PĀLI giống hệt giữa `vv6` và `vv7`,
    nhưng tôi dịch *họ* ở `vv6` (vì `5.3` PĀLI là `bhikkhū` — số nhiều) và *vị ấy* ở `vv7`
    (vì `5.3` PĀLI là `bhikkhuṁ` — số ít). Giữ *họ* ở `vv7` sẽ MÂU THUẪN với chính `vv7:5.3`
    đã dịch *một vị tỳ-kheo*; đó đúng là lỗi tự mâu thuẫn mà luật trùng-khớp sinh ra để
    chặn, nên ở đây tôi ưu tiên tính nhất quán trong từng bài. `6.3` `Sītodakā tassa bhavanti
    najjo` (`tassa` số ít ở cả hai bài) thì tôi dịch **giống nhau** là *với vị ấy*.
  · Mẫu khoá cuối: `11.1` theo `vv1:9.1` (*Cung Điện Pīṭha Thứ Nhất, thứ nhất.*) và
    `vv12:8.1` (*…, thứ mười hai.*) — PĀLI `Paṭhamanāvāvimānaṁ chaṭṭhaṁ.` có **hai** số thứ tự
    (thứ nhất trong cụm Nāvā, thứ sáu trong cả `Itthivimāna`), và tôi giữ cả hai như mẫu.

  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|
  check`. `save_vi` của `_hvi.py` đã pass cho cả 45/45 khoá của bài này (đủ khoá, không thừa,
  NFC, không trùng nguyên văn PĀLI, PĀLI không lọt vào bản Việt, số dấu lược khớp từng
  khoá, ngoặc kép cân trên cả bài), và `_rv67.py` quét lại không lỗi nào ngoài `:0.1` — vốn
  là khối tiêu đề ngắn (< 40 ký tự) mà `_hvi.py` cố ý không kiểm, và giữ nguyên PĀLI là
  **tiền lệ 43/44** trong `vv`. Người biên tập cần chạy đủ `npm run validate`, `npm test`,
  `npm run check`, `npm run build` trước khi coi `technical_integrity: 9.6` là đạt.

  Lượt cải thiện 2026-10-11 (kiểm toán đối kháng độc lập, đọc từng cặp Pāli↔Việt):
  KẾT LUẬN: bản trước chấm 9.19 là QUÁ CAO. Trong 45 khoá có 19 khoá phải sửa, trong đó 13 khoá
  sai nghĩa thật (tỷ lệ 13/45 ≈ 29% khoá sai nghĩa nghiêm trọng; 19/45 ≈ 42% khoá có lỗi gồm cả
  lỗi nhẹ). Phần "Bất định riêng" ở trên dựa vào `pv28` làm chỗ tựa là KHÔNG đáng tin: bản Việt
  của `pv28:3.1`–`3.2`, `2.2`, `4.2` chính nó sai (dịch `pokkharaṇī` là *tấm sàn*, `pahūtamalyā`
  là *hoa nhài*, `bhusa` là *nhìn từ xa*), và `vv7` đã chép lại các lỗi ấy. Các mục `6.3`
  (`najjo` là *tấm gương*), `ogāhasi pokkharaṇiṁ` là *bước xuống sàn thuyền*, `vālukasanthatā`
  là *cát chặt* ở trên được thay bằng những lựa chọn dưới đây.
  Khoá đã đổi và lý do:
  · SAI NGƯỜI NÓI / CHỦ THỂ (3 khoá): `10.2` `Manussabhūtā yamakāsi puññaṁ` — người tạo phước
    là nữ thiên đang đáp (*tôi*), bản trước viết *ngài đã tạo*; `10.3` `Tenamhi` = *tena amhi*
    ("nhờ đó TÔI là…"), bản trước viết *ngài có oai lực*; `6.1` bản trước thêm *thấy* và đổi
    chủ thể chung `yo` thành *vị ấy* (tỳ-kheo) — Pāli không có.
  · SAI CÚ PHÁP — hô cách bị đọc thành tân ngữ (2 khoá): `3.1` `devi mahānubhāve` và `10.1`
    `bhikkhu mahānubhāva` là HÔ CÁCH (*này thiên nữ có đại oai lực*, *này tỳ-kheo có đại oai
    lực*), không phải "về đại oai lực ấy". Theo `vv33:5.1`, `vv33:10.1` (đã đúng); lỗi này lặp ở
    ít nhất 15 tệp `vv` khác (xem dưới).
  · SAI TỪ VỰNG / NGHĨA (8 khoá): `1.3` `pokkharaṇiṁ` = *hồ sen* (không phải sàn thuyền; theo
    `pv24:10.5`); `1.4` `padmaṁ chindasi pāṇinā` = *dùng tay hái hoa sen* (*há ngắm* vô nghĩa);
    `6.3` `najjo` = *các dòng sông* (không phải gương); `6.4` `pahūtamalyā bahupuṇḍarīkā` =
    *nhiều hoa, nhiều sen trắng* (theo `vv84:14.2`; bỏ *hoa nhài*, *gần như phủ kín* vốn bịa);
    `7.1` `anupariyanti` = *chảy quanh* (không phải *tràn tới từ mọi phía*); `7.2`
    `vālukasanthatā` = *trải đầy cát* (theo `pv24:1.2`; bỏ *chặt*); `8.1` `bhūmibhāgehi
    upetarūpaṁ` = *đầy đủ những khoảnh đất tươi đẹp* (theo `ja524:16.1`, `ja526:21.3`, 2/2);
    `8.2` `bhusa sobhamānaṁ` = *vô cùng rực rỡ* (bỏ *thấy từ xa* vốn bịa; `bhusa` ở `ja478:10.6`,
    `ja516:13.2` = *vô cùng*, *rất*).
  · LỆCH GIỌNG / THÊM NGHĨA NHẸ (4 khoá): `1.2` *bạn* → *nàng* (Moggallāna nói với thiên nữ, và
    `2.1`, `3.2` đã dùng *nàng*) và bỏ *nữ thiên* thêm vào `nāri`; `4.2` `pucchitā` = *được…
    hỏi* (bản trước *bị… truy hỏi* thêm sắc thái thẩm vấn; theo `vv12:3.2`, `vv33:6.2`); `6.2` bỏ
    *đều* (biến mệnh đề `yo… dadāti` thành khẳng định chung nhiều chủ thể); `8.4` `puññakatā
    labhanti` là số nhiều → *Những người đã tạo phước thì đạt được*.
  · NGHI SAI NGHĨA, ĐỔI CÓ CHỦ Ý LỆCH CÔNG THỨC (2 khoá): `2.2`/`9.2` `idha mijjhati` — `mijjhati`
    là "thành tựu", không có tân ngữ *nơi này*; bản công thức 39 tệp (`pv13`–`pv16`, `vv10`…)
    viết *có được nơi này*. Tôi đổi ở `vv7` thành *thành tựu được ở nơi đây* — chắc khoảng
    80%; nếu người biên tập không chấp nhận lệch công thức thì trả về như `vv6`.
  Điểm tiêu chí đổi (từ → sang): semantic_fidelity 9.3→8.4 · grammar_logic 9.2→8.6 ·
  source_provenance 9.4→9.0 (chỗ tựa `pv28` không đáng tin) · terminology 9.2→8.7 ·
  vietnamese_clarity 9.3→8.7 · han_viet_balance 9.3→9.0 · triangulation 7.5→7.0 (các bản
  `vv`/`pv`/`ja` đối chiếu là cùng một dự án, không độc lập) · ambiguity_integrity 9.1→8.5 ·
  segment_alignment 10.0 và technical_integrity 9.6 giữ nguyên. `final_score` 9.19 → 8.75.
  Bài vẫn không có tầng tham khảo tiếng Anh/Việt ở upstream; blocker đó GIỮ NGUYÊN.
  CÒN LẠI, KHÔNG SỬA (đã đo, chỉ ghi):
  · `0.2` `Itthivimāna` → *Chuyện Cung Điện Nữ Hư Không*: `itthi` = nữ, không có `ākāsa`; nhưng
    đây là tiêu đề của 51 tệp, sửa một tệp sẽ lệch cả bộ — cần người biên tập quyết định chung.
  · `2.3`/`9.3` `bhogā ye keci manaso piyā` → *của cải nào… dễ chịu với tâm* (22 tệp): `piyā` là
    "đáng mến", `bhoga` là "thọ dụng/của cải", cách đặt *nào* nghe như câu hỏi — nhẹ, giữ theo công
    thức.
  · `4.4` `yassa kammassidaṁ phalaṁ` là mệnh đề quan hệ ("đây là quả của nghiệp nào [nàng đã
    làm]"), bản *quả báo của nghiệp này là thế* (70 tệp) làm mất chữ *yassa* — nhẹ, giữ.
  · `7.1` `Taṁ` đọc là *cung điện* (song hành với `8.1` `Taṁ… vimānaseṭṭhaṁ`); khả năng nhỏ `Taṁ`
    là người cho nước — không phân xử được bằng căn cứ trong kho.
  · `1.1` `suvaṇṇacchadanaṁ` *bọc vàng* vs *mái vàng* — `chadana` là "lớp che/mái", giữ *bọc vàng*
    theo công thức `vv6`/`vv8`.
  · NGOÀI PHẠM VI, ĐÃ LẶP LỖI Ở TỆP KHÁC: `vv6`, `vv8` có đúng các lỗi `1.3`, `1.4`, `6.3`,
    `6.4`, `7.1`, `7.2`, `8.1`, `8.2`; `vv1`–`vv4`, `vv6`, `vv9`–`vv15`, `vv18`, `vv19`, `vv23`,
    `vv54`, `vv85` còn hô cách `mahānubhāve/va` bị đọc thành tân ngữ; `vv1`…`vv15` còn
    `10.2`/`10.3` (hoặc tương đương) viết *ngài* thay *tôi* (`vv54`, `vv33` đúng); `pv28:3.1`
    `pokkharaṇī` = *tấm sàn*, `pahūtamalyā` = *hoa nhài* (`pv37:14.2` cùng lỗi).
  Cổng kỹ thuật chưa chạy trong lượt này: `npm run validate`, `npm test`, `npm run check`,
  `npm run build` — `technical_integrity` giữ 9.6.

  **Đối chiếu độc lập 2026-10-14** với bản Việt nguyên bài của Bhikkhu Indacanda (bản dịch 2011, theo ấn bản Buddha Jayanthi). Đã so từng khoá trong 45 khoá. 5 khoá bất đồng nghĩa → sửa 3, giữ 1, bất định 1. Sửa `:4.3`–`:4.4` (`Pañhaṁ puṭṭhā viyākāsi, yassa kammassidaṁ phalaṁ`): trước *Được hỏi, nàng đã giải thích rằng / quả báo của nghiệp này là thế* → sau *Được hỏi câu hỏi, nàng đã giải đáp / về nghiệp mà đây là quả báo*; `yassa` là quan hệ từ (*của nghiệp nào*), không phải chỉ định *này*, nên cách cũ biến câu hỏi thành lời khẳng định. Cách mới theo nguyên văn đa số trong tầng (`yassa kammassidaṁ phalaṁ` ở 49 khoá dịch *về nghiệp mà đây là quả báo*, so với 9 khoá còn dịch kiểu cũ; `vv12:3.4` dùng một cách khác nhưng cùng nghĩa). Sửa `:8.3` (`Tassīdha kammassa ayaṁ vipāko`): trước *Đó là quả báo của nghiệp ấy,* (mất `idha`, đổi `ayaṁ` thành *đó*) → sau *Đây là quả báo của nghiệp ấy nơi đây,*, đúng nguyên văn `vv6:8.3` và `vv8:9.3`. Giữ `:1.1` (`suvaṇṇacchadanaṁ nāvaṁ`): bản nguyên bài ghi *mái*, bản này ghi *bọc vàng*; `chadana` là vật che phủ, cả hai nằm trong nghĩa của từ, giữ. Bất định `:7.1` (`Taṁ āpagā anupariyanti sabbadā`): bản nguyên bài hiểu `taṁ` là người dâng nước ở `:6.x`, bản này hiểu là cung điện (cùng cách với `vv6:7.1`, `vv8:8.1`); `taṁ` có thể là giống đực hoặc trung, không phân xử được từ Pāli, giữ cách đã chọn. Thêm một sửa nhất quán thuật ngữ nội bộ: `:10.4` *sắc tướng* → *dung sắc* cho `vaṇṇo`, như `:2.1`, `:3.4`, `:9.1` của chính bài. Thứ tự khoá trong tệp được đưa về đúng thứ tự Pāli (trước đó xếp theo chuỗi ký tự). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đối chiếu bản nguyên bài Bhikkhu
  Indacanda, đoạn song song vv6 vv8 vv31 vv33 vv12 vv4): sửa 1 khoá: 7.3 `sālā` *sāl* → *sāla* (thống
  nhất với vv6:7.3 và cách giữ tên cây Pāli; *sāl* là dạng cụt không có tiền lệ). Giữ: 1.1 *bọc vàng*,
  8.1 *tươi đẹp* (đã phân xử ở lượt 2026-10-11 theo ja524/ja526), 10.4 *mọi phương* khác 3.4 *muôn
  phương* (công thức theo từng Pāli đã ghi ở trên). Không phát hiện thêm sai nghĩa/chủ thể/phủ định
  trong 45 khoá. Bất định giữ nguyên: 7.1 `taṁ` (cung điện hay người dâng nước). Chờ người biên tập:
  xưng hô 3.1/5.1/10.1 (Moggallāna–nữ thiên). Không có bản Anh.

