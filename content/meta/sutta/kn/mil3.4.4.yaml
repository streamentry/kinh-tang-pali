notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành cho Milindapañha. Toàn bài dịch từ Pāli root; triangulation hạ xuống 7.0.
  Tiền lệ dùng lại: Nibbānavagga → Phẩm Niết-bàn · Thero āha— → Trưởng lão nói: · Kallosi → Khéo lắm ·
  māṇava → thanh niên (191 tiền lệ, dn10) · kammadāyādā kammayonī kammabandhū kammappaṭisaraṇā và câu kèm
  hīnappaṇītatāyā dùng nguyên văn mn135:4.1 và mn135:20.1-20.3, gồm cả cách dịch thấp hèn và cao sang ·
  dīghāyukā → sống dài (an4.33, an4.70) · appābādhā → ít đau yếu (an4.70) · dubbaṇṇa → xấu xí ·
  nīcakulīna → thấp hèn, uccākulīna → quy hiển (mn135:3.7).
  Mười bốn vế so sánh, giữ nguyên cả cặp và cả thứ tự, không gộp: appāyukā sống ngắn / dīghāyukā sống dài ·
  bahvābādhā hay đau yếu / appābādhā ít đau yếu · dubbaṇṇā xấu xí / vaṇṇavanto đẹp trai · appesakkhā không
  giàu có / mahesakkhā giàu có · appabhogā ít tài sản / mahābhogā nhiều tài sản · nīcakulīnā thấp hèn /
  mahākulīnā quy hiển · duppaññā kém hiểu biết / paññavanto hiểu biết. Sáu vị cây ở khoá 2.2 dùng đúng sáu vị
  đã đặt ở mil3.4.1.
  Bất định đã ghi nhận. Kammappaṭisaraṇā tôi dịch là nương tựa nghiệp, theo mn135; kayirasana khác. Kasāvā
  ở đây và kasāyā ở mil3.4.1 là cùng một vị chát, tôi giữ nhất quán. Kinh văn Pāyā-ti nghiệp tôi dịch nguyên
  văn theo mn135 chứ không thêm chú giải nào vào thân câu.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0.
  Ngoặc kép: Pāli mở ngoặc ở 2.4 và đóng ở 2.6, kèm một dấu nháy cong lồng trong 2.6; tôi giữ nguyên cấu
  trúc đó, nên 2.4 và 2.5 nằm trong lời Trưởng lão và 2.6 là lời dẫn lại của Ngài. Nhờ vậy hai phía cân.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá. Đợt này cấm chạy npm run validate, test, check,
  build nên không tuyên bố technical gate pass; bốn lệnh đó để người điều phối chạy, technical_integrity 9.8.
