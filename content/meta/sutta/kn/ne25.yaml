notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành cho Netti. Toàn bài dịch từ Pāli root; triangulation hạ xuống 7.0.
  Tiền lệ dùng lại. Khoá 2.1 có Pāli trùng nguyên văn với bảy bài Netti khác; dùng nguyên văn Do vậy, với
  người có tâm được phòng hộ, chánh tư duy là cảnh giới, đó là bài kệ. Khung Netti (Netti, Phần Giải
  Thích, Nhóm 6, Nhóm Phương Thức X, Ở đây…, đã được vận dụng) dùng nguyên văn từ ne24, ne27, ne30, ne34.
  Tiền lệ từ vựng: Kokālika → Kokālika và Sāriputta, Moggallāna theo sn6.10:1.10-1.11 · satiārakkhena
  cetasā samannāgato → có tâm được chánh niệm hộ trì, theo an5.114:3.1 · dhammacārin → sống theo Pháp
  (ud4.8:10.3) · duggati → cõi xấu.
  Thuật ngữ đặt mới, chưa có tiền lệ nào trong tầng, tôi đặt và ghi lý do ở đây:
  Adhippāyo → mục đích chính; tầng chưa dùng chữ này ở Netti, tôi lấy theo nghĩa chữ là chủ đích, mục tiêu
  chính, không phải chỉ mục đích.
  Nirutti → sự định nghĩa; khác với paññatti mà ne30 dịch là sự định danh, tôi giữ hai chữ khác nhau.
  Catubyūha → bốn phần; tầng chưa có chữ này. Tôi chọn bốn phần thay vì bốn nhóm để tránh lặp với chữ nhóm
  đã dùng cho sampāta và hārasampāta.
  Mahāpadumaniraya → địa ngục lửa lớn Paduma; đây là biệt danh của địa ngục Avīci, tầng có Avīciniraya
  dịch là địa ngục Avīci ở iti89:5.3. Tôi giữ chữ Paduma vì đó là chữ Pāli có trong câu, không thay bằng
  tên riêng không có nguồn trong câu; nếu biên tập muốn thống nhất với Avīci thì đổi ở đây.
  Bất định đã ghi nhận. Cittaṁ padosayitvā không có chủ thể sở hữu trong câu; tôi dịch là để tâm nhiễm ô vì
  các Trưởng lão ấy, giữ nghĩa và không thêm từ nào không có nguồn.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0. Nháy kép: mỗi khoá có một cặp; cân trên cả bài.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá. Đợt này cấm chạy npm run validate, test, check,
  build nên không tuyên bố technical gate pass; bốn lệnh đó để người điều phối chạy, technical_integrity 9.8.
