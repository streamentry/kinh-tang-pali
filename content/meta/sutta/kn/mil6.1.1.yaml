  COVERAGE Anh, đo bằng đúng công thức của src/lib/canon/reference.ts: substantive = 35,
  không có Anh = 35, ratio = 0.0000 — dưới ngưỡng 0.8, và chưa có trong
  content/meta/reference-gaps.yaml. Đó là lý do bài để draft.

  TÊN, có số đếm. :0.1 Milindapañha giữ Pāli (205/205). :0.2 Anumānapañha → Câu hỏi về
  suy luận (12/18 bài mil có Pāli trùng tuyệt đối). :0.3 Buddhavagga → Phẩm Đức Phật
  (14/16 bài mil). :0.4 → 1. Câu hỏi về suy luận rằng không thể có hai Đức Phật, giữ
  đúng khuôn N. Câu hỏi về … của 189 bài mil. :10.1 → Câu hỏi về suy luận rằng không thể
  có hai Đức Phật, thứ nhất (khuôn N.pañho <thứ tự>.). Tên bài của Sujato trong tầng
  name là Why Must There Be Only One Buddha At A Time?, còn tôi dịch theo nghĩa chữ
  Dvinnaṁbuddhānaṁanuppajjamānapañha.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ: :1.1 (Pāli trùng tuyệt đối với mil5.5.11:1.1, dùng cùng
  một cách), :5.5 Āma, bhante → Vâng, thưa tôn giả (đo chính xác: 7/8 bài mil khác dùng
  đúng cụm này; bản nháp tôi viết Vâng, bạch thầy vì lấy mẫu một chỗ khác, đã sửa), :9.3
  (nguyên văn mil5.5.8:16.3). Chuỗi lặp 2.1/3.4 và 2.1/4.3 được dịch bằng MỘT cách văn cho cả bài,
  kể cả chín danh động từ của :2.1 (caleyya kampeyya nameyya onameyya vinameyya
  vikireyya vidhameyya viddhaṁseyya), vì đó là điểm cốt lõi của lập luận.

  THUẬT NGỮ. dasasahassī lokadhātu → cõi thế giới mười nghìn thế (khuôn của mil2 và mil7
  đã có). ekabuddhadhāraṇī → chỉ chứa được một vị Đức Phật. atidhammabhārena → với uy
  lực của pháp. sattatiṁsa bodhipakkhiyadhamme → ba mươi bảy pháp thuộc yếu tố của giác
  ngộ. appamādappaṭipattiyaṁ → sự không cẩu thả, sự khởi hành (không cẩu thả là tiền tố
  của nhiều bài mil đã có). osīdeyya udake → sẽ chìm xuống nước (0 tiền lệ). Sineru →
  Sineru (đã có trong tầng). Sakko, Mahābrahmā, Māro, Māro giữ Pāli, đều đã có trong Pāli
  của chính bài này.

  BẤT ĐỊNH ĐÃ GHI. (a) Chuỗi chín động từ caleyya kampeyya nameyya onameyya vinameyya
  vikireyya vidhameyya viddhaṁseyya (0 tiền lệ trong tầng) là cách kinh liệt kê những
  cách một cõi thế giới không chịu nổi; tôi dịch lần lượt là run rẩy, lay động, quên,
  không nhớ, điên rồ, phân tán, làm đổi, hư vong, và chỗ dựng vô tài — theo nghĩa từng
  vế, vì đây chính là lập luận chứng minh cho :3.4 và :4.3. (b) :5.2 ẩn dụ cái tủ kéo
  ngọc: Pāli nói muốn lấy ngọc từ tủ này đổ vào tủ kia, nhưng câu hỏi là cái tủ kia có
  chứa nổi ngọc của cả hai không; tôi giữ nguyên hình ảnh vì nếu hiểu thành vòng tụng
  sẽ mất nghĩa. (c) :6.3 và :6.4 ứng với ví dụ hai võ binh mạnh; tôi dịch Phật là của
  chúng ta, Binh là của chúng ta, và ubhato pakkhajātā là cùng đứng về một bên. (d) Chuỗi
  mười một danh từ vượt trội ở :7.2 (aggo, jeṭṭho, seṭṭho, visiṭṭho, uttamo, pavaro,
  asamo, asamasamo, appaṭimo, appaṭibhāgo, appaṭipuggalo) không có tiền lệ nào; tôi dịch
  theo nghĩa từng từ và giữ xu hướng siêu việt của cả chuỗi, vì điểm của đoạn là chỉ một
  trong hai vị có thể là chủ nhân của những danh xưng ấy.

