notes: |-
  Nguồn: Pāli đọc bằng `pali.pal('kn','vv74')`, 32 khoá, đối chiếu `source/upstream-manifest.json` chứ không suy từ tên thư mục. 98 khoá của lát n4 chia ba bài; bài này 32.
  CỔNG COVERAGE KHÔNG ĐO ĐƯỢC GÌ — đây là điểm phải nói rõ, không phải đã kiểm và đạt. Công thức lấy từ `src/lib/canon/reference.ts` (isSubstantive + englishCoverage): substantive là Pāli có prose >= 40 ký tự, bỏ block tham chiếu `:0`. Cả 32 khoá của vv74 đều dưới 40 ký tự, nên substantive = 0 và mẫu số bằng 0. Theo đúng mã nguồn thì ratio được gán 1, nhưng đó là hệ quả của mẫu số 0 chứ không phải bằng chứng có tầng tham khảo. Cổng `floor: 0.8` không đo được tỉ lệ nào cho bài này.
  Tiền lệ (đếm trên chỉ mục Pāli→Việt 150.984 khoá, không phải trên chuỗi Việt): 0.1 Vimānavatthu 53/54 để nguyên Pāli · 0.2 Chuyện Cung Điện Nam Hư Không 15/24 · 0.3 Phẩm Pāyāsi 8/9 · 1.3 2/5 · 1.4 lơ lửng 3/5 · 2.2 7/13 · 2.3 6/13 · 2.4 10/43 · 3.1 13/21 · 3.2 và 5.2 là `…` trần 646/648 · 3.3 29/41 · 4.1 3/9 · 4.4 2/3 · 4.5 3/6 · 4.6 4/8 · 5.1 28/41 · 5.3 17/41 · 8.1 Tóm lược: 337/445.
  CỐ Ý LỆCH TIỀN LỆ Ở 2.1, đã phân xử về Pāli. `Deviddhipattosi mahānubhāvo`: 5/11 bản dịch sẵn có đọc `Deviddhi` là thần lực (thiên thần lực, thiên thần thông). Bản này dịch là phần thưởng của chư thiên. Lý do: câu hỏi kế tiếp 2.2 hỏi thẳng về `puñña` (khi còn làm người ngài đã làm phước đức gì), nên `Deviddhi` ở đây là thưởng ban cho phước đức; đọc là thần lực thì câu hỏi mất hết nghĩa. Đây là blocker loại 2 về nghĩa nếu đọc ngược lại, nên ghi rõ ở đây thay vì lặp im lặng.
  Bất định 1 — cặp `vaṇṇo` / `sabbadisā pabhāsatī`. 5.1 đa số là dung sắc 28/41; 5.3 đa số là sắc tướng 17/41; 2.4 đa số là khắp muôn phương 10/43 còn 5.3 là khắp mọi phương 17/41. Cùng một mệnh đề lặp hai lần trong bài nên bản này giữ MỘT cách cho cả bài: dung sắc + khắp mọi phương. Toàn kho `sabbadisā pabhāsatī` là 39 khắp mọi phương và 38 khắp muôn phương, nên chọn bên số đông sát nhất nghĩa `sabba`. Vì vậy 5.3 lệch đa số cục bộ 17/41 — ghi ra đây để người gộp lát biết mình đã đánh đổi thế nào.
  Bất định 2 — `Uttara` ở 0.4. Pāli ghi `(Uttara) Pāyāsivimānavatthu`, tầng tên đã ghim `vv-name:82.vv74` = Uttara Pāyāsi's Mansion. Bản này dịch là Cung Điện Pāyāsi Hậu, lấy Uttara làm tước hiệu phân biệt vua Uttara Pāyāsi với người tạng Pāyāsi. 0 tiền lệ cho cả khoá này, nên đây là phán xứ của người dịch, không phải khuôn có sẵn. Cùng lý do, 6.1 dùng Cung Điện Pāyāsi theo khuôn vv10:9.1 và vv72:7.1, vv73:7.1.
  Bất định 3 — kệ tóm lược 9.1–9.4 không nêu đủ tên. Đối chiếu `:0.4` của vv65–vv74 cho tên tạng thật: vv65/66 Paṭhama+Dutiya agāriya · vv67 Phaladāyaka · vv68/69 Paṭhama+Dutiya upassayadāyaka (dâng cho tỳ-kheo Upassayadāyi) · vv70 Bhikkhādāyaka · vv71 Yavapālaka · vv72/73 Paṭhama+Dutiya Kuṇḍalī · vv74 (Uttara) Pāyāsi. Kệ nêu được 9 tên cho 10 bài: vv70 Bhikkhādāyaka không xuất hiện. Ngoài ra `Dve` ở 9.3 có thể gắn với Yavapālaka hay với Kuṇḍalino, kệ không phân định. Bản dịch giữ đúng những gì Pāli nói, không bịa số đếm cho khớp mười.
  Nhấy kép: Pāli có đúng hai cặp, mở ở 1.1 và 4.1, đóng ở 2.4 và 5.3; bản dịch giữ y hệt. Lưu ý cho người gộp: vv72 và vv73 trong kho đang LỆCH vì bỏ dấu đóng (hai `“` mà không có `”` nào); an6.14 lệch 4 `“` với 3 `”`. Không sao chép lỗi ấy.
  `…pe…` ở 3.2 và 5.2 giữ đúng một `…`, không mở rộng, theo 646/648 tiền lệ.
  Tên riêng Upassayadāyi và Yavapālaka không có trong Pāli của chính vv74 và không có trong tầng Việt; giữ dạng chuyển tự vì đúng khuôn kệ tóm lược đã dịch, xem vv17:10.1, vv28:9.1 và thag1.100:2.1. Kuṇḍalino thì dịch mô tả là Người Đeo Bông Tai, y như vv72:0.4 và vv73:0.4 đã làm, nên không sinh ra cách thứ N+1.
  technical_integrity 9.6 vì lát này không được chạy gate. Bốn lệnh gate còn lại, coordinator chạy trước khi publish: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
  Lượt cải thiện 2026-10-11 (đọc đối kháng từng khoá, đối chiếu Pāli và các bài vv cùng họ đã kiểm toán). Mục này thay thế "Bất định 2" (Uttara = tước hiệu "Hậu"), "Bất định 3" (kệ tóm lược không nêu Bhikkhādāyī) và lập luận "phần thưởng của chư thiên" ở 2.1 trong các mục cũ phía trên; các mục cũ khác giữ làm lịch sử. 20/32 khoá đổi, trong đó 7 khoá sai nghĩa thật:
  1) 2.4 "dung sắc nàng": người được hỏi là vị thiên tử, người hỏi gọi "ngài" (Vaṇṇo ca te) — đã sửa thành "của ngài". Lỗi này đúng là họ "nàng/ngươi" của cả nhóm vv.
  2) 1.1 `sabhā sudhammā` bị dịch "tòa đài ... được trang trí tốt đẹp", nuốt mất tên Sudhammā; DN18, DN19, DN21, MN50, MN83 trong kho đều dịch "hội trường/giảng đường Sudhammā". Đã sửa theo tiền lệ, 1.2 `samaggo` = hòa hợp.
  3) 3.3 `yassa kammassidaṁ phalaṁ` là mệnh đề quan hệ, bản cũ "quả báo của nghiệp này là thế" làm mất quan hệ; đã sửa thành "về nghiệp mà đây là quả báo" (khớp vv54, vv65 đã kiểm toán).
  4) 4.2 `māṇavo` bị dịch "người hầu" (thêm vai trò không có trong Pāli). DN23 trong kho (32.3, 32.23) cho thấy Uttara là māṇava phụ trách buổi bố thí của Pāyāsi, được tái sinh cõi Ba Mươi Ba; nên dịch "chàng thanh niên" (DN23 dùng "cậu thiếu niên", vv83 "chàng thanh niên").
  5) 0.4: Uttara là TÊN của vị thiên tử (cậu Uttara ở DN23), không phải tước hiệu "Hậu"; "Pāyāsi Hậu" là phát minh. Đổi thành "10. (Uttara) Chuyện Cung Điện Pāyāsi", giữ ngoặc như Pāli; translationTitle đã đổi cho khớp.
  6) 9.1 `Dve agārino` bị dịch "Hai ẩn sĩ": agārino là người tại gia (vv65 và vv66 trong kho dịch "Người Tại Gia"). Đã sửa.
  7) 9.2 bản cũ BỎ SÓT `bhikkhāya dāyī` (người dâng vật thực, tức vv70), và ghi sai trong notes rằng kệ không nêu vv70; còn `upassayadāyī` bị hiểu thành tên một vị tỳ-kheo trong khi vv68 và vv69 dịch "Người Bố Thí Chỗ Trú". Kệ giờ nêu đủ mười: hai người tại gia (vv65–66), người ban trái cây (vv67), hai người bố thí chỗ trú (vv68–69), người dâng vật thực (vv70), người giữ đồng đại mạch (vv71), hai người đeo bông tai (vv72–73), Pāyāsi (vv74); 9.3 "và hai" gắn với Kuṇḍalino như Pāli (dve ... kuṇḍalino) — hợp 2+1+2+1+1+2+1 = 10. Tên Upassayadāyi/Yavapālaka không còn để chuyển tự.
  Sửa nhẹ khác: 3.1 bỏ "vô cùng" (attamano chỉ là hoan hỷ); 2.1 `Deviddhipatto` đổi "phần thưởng của chư thiên" (diễn giải, lệch) sang "thiên thần lực" theo vv60 và vv65 đã kiểm toán, `mahānubhāvo` "đại oai lực" thống nhất với 2.3 "oai lực" (thay "đại uy danh"); 4.4 `piyā` bỏ "kính" thêm vào; 4.3 `saṁvibhāgaṁ` = chia sẻ; 4.5–4.6 cơm ăn nước uống là tân ngữ của dānaṁ, bỏ cấu trúc "với cơm ăn ... cùng tâm tịnh tín"; 1.3 "tòa thiên cung" về "cung điện" cho khớp vimāna cả bộ; 4.x "ta" đổi "tôi" cho đồng nhất với 5.x của cùng người nói (bản cũ trộn ta/tôi); 10.1 `pavuccati` (hiện tại, "được gọi tên") theo vv64 và vv85 thay "đã được kể".
  Điểm: semantic_fidelity 9.4→9.1, grammar_logic 9.4→9.1, terminology 9.3→9.1, vietnamese_clarity 9.4→9.1, han_viet_balance 9.4→9.3, ambiguity_integrity 9.2→8.9 (bản cũ chấm cao hơn thực tế vì còn bảy lỗi nghĩa nêu trên, chưa được phát hiện; điểm là của bản đã sửa, còn bất định ở dưới); các tiêu chí khác giữ. final_score 9.23→9.08.
  Bất định còn lại: (a) `Deviddhi` thần lực hay thành tựu của chư thiên (giữ "thiên thần lực" theo họ vv đã kiểm toán, không phân xử được hơn); (b) 1.4 `tiṭṭhati` dịch "lơ lửng" là suy ra, giữ theo tiền lệ vv65 và 3/5 kho, Pāli chỉ nói "đứng/hiện hữu"; (c) tên bộ "Cung Điện Nam Hư Không" (0.2, 10.1): Pāli là Purisavimāna và không có `ākāsa`; sai cả bộ ở nhiều tệp, không sửa riêng tệp này để khỏi lệch, cần sửa đồng loạt; (d) `rañño` dịch "vua" đúng chữ Pāli, trong khi DN23 dịch Pāyāsi là "tộc trưởng" (rājañña) — hai chữ khác nhau nên không đồng nhất; (e) `ahaṁ` dùng "tôi" cho vị thiên tử nói với tôn giả, không có căn cứ cứng ngoài tiền lệ vv54 và vv65; (f) 3.2 và 5.2 giữ một dấu lược `…` (Pāli bài này rút gọn, không nêu tên vị tôn giả hỏi nên bản dịch cũng không thêm).
