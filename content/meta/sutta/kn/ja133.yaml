notes: |-
  Tiền lệ: khung tiêu đề như ja131; ari → kẻ thù; mahīruha → cây; saraṇa → nơi
  nương tựa (tầng dự án đã có chỗ nương tựa); ghatāsana → ngọn lửa, suy từ 1.2
  jalate (đang cháy) và tên bài, 0 tiền lệ nên ghi mới.
  Bất định: 1.2 dakassa nghĩa đen là nước (daka), vô nghĩa khi đi với lửa cháy;
  đọc theo văn cảnh là khu rừng, có thể là biến thể chính tả của dava. 1.4 saraṇā
  là đoạt cách (từ nơi nương tựa) đi với bhayaṁ làm chủ ngữ, nên nỗi sợ đến từ
  chính nơi nương tựa chứ không phải không còn nơi nương tựa; review đối kháng đã
  sửa một bản nháp ghi sai phủ định ở đây. semantic và ambiguity hạ điểm accordingly.
  Thiếu tầng Anh nên triangulation chỉ 7.0 và bài ở draft.

  Lượt cải thiện 2026-10-13: đọc đối kháng 9 cặp Pāli↔Việt, đổi 3/9 khoá (1.1,
  1.3, 1.4), 6 khoá còn lại giữ. 1.4 `disā bhajavho`: "hãy chạy về các phương"
  → "hãy tản đi các phương", theo đúng cụm Pāli `Disā bhajatha` ở ja36:1.3 và
  ja432:7.3 (2/2 khoá cùng cụm, cùng bản Việt "tản đi các phương"); bhaj không
  có nghĩa chạy, và chủ thể là đàn chim tản ra bốn phía. 1.3 `na ajja vāso`:
  "không còn chỗ trú" → "không có chỗ trú", bỏ chữ "còn" Pāli không có; "chỗ
  trú" giữ vì đa số vāso trong tầng dịch là chỗ trú (dhp237:3, snp3.1:10.4) so
  với nơi ở (pv26, mil7.4.5:8.1, tha-ap23:7.1 và vài khoá khác). 1.1
  `khemaṁ yahiṁ`: "Nơi nào từng yên ổn" → "Nơi nào là chốn yên ổn", bỏ
  "từng" vì Pāli không có thì quá khứ. Điểm đổi: terminology 8.5 → 9.0 (hai
  tiền lệ đo được); semantic_fidelity 8.7 → 8.8 (gỡ hai chỗ thêm nghĩa nhỏ);
  technical_integrity 10.0 → 9.6 (bốn lệnh `npm run validate`, `npm test`,
  `npm run check`, `npm run build` chưa chạy trong lượt này); các điểm khác giữ.
  Bất định còn nguyên: 1.2 `dakassa` là hapax trong toàn Pāli root (khuôn
  duy nhất ja133:1.2); `daka` đứng riêng nghĩa là nước, nhưng "giữa nước" không
  hợp lửa cháy; "khu rừng" là cách đọc theo văn cảnh và tên bài, không có căn
  cứ phân xử được trong kho (không có bản Anh, không có chú giải ghim), nên
  ambiguity_integrity giữ 8.5 và triangulation giữ 7.0. Cân nháy “ ” khớp Pāli
  ở 1.1 và 1.4; không Pāli lọt sang Việt; NFC đạt.
