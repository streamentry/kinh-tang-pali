notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato của chính bài này (24/35 khoá có chữ; 11 khoá rỗng là tiêu đề và đoạn lược của chính Pāli).
  144/315 khoá của lát này có Pāli trùng nguyên văn với tầng Việt đã dịch; trong đó các khoá `Paṭhamavagga`, `Pañcakanipāto niṭṭhito.`, `… Kosiyo thero ….` đã dùng lại nguyên văn bản Việt có sẵn. Trong chính bài này: `Pañcakanipāta` → Nhóm Năm (18 lần, đa số đo được), `Paṭhamavagga` → Phẩm Thứ Nhất (87 lần), `Pañcakanipāto niṭṭhito.` → Nhóm Năm Bài Kệ chấm dứt (1 lần, `an5.308-1152`), `Tatruddānaṁ` → Tóm tắt ở đây (1 lần, `thag1.120`).
  BẤT ĐỊNH: `Saṭṭhi ca pañca gāthāyo` (7.3) để nguyên số theo Pāli — sáu mươi lăm. Đếm Pāli thực tế `thag5.1–thag5.12` thì mỗi bài đúng 5 kệ, tổng 60, khớp `saṭṭhi` nhưng không khớp `pañca`. Không tự sửa số của nguồn; cũng không nén lại.
  BẤT ĐỊNH: `visesi assa` (1.4/2.4/3.4/4.4/5.4) dịch thống nhất là hiểu pháp rồi, vị ấy được tôn vinh; `nāma ca hoti paṇḍito` ở 1.3/2.3/3.3/4.3/5.3 đổi danh xưng theo đúng từng câu Pāli (có thầy / bền vững / không phân tán / như thế / thấu hiểu ý nghĩa) — không lặp khuôn.
  Khối uddāna 6.0–7.4 là tiền lệ mới cho thể loại: trong 219 tệp `thag` đã có, không tệp nào mang khối 6.0. Cách ghép tên bám `thag1.120` (6.1–7.4 cùng cấu trúc).
  Tên bộ: coordinator nói `thag` là Kinh Tiểu Truyện và `vv` là Kinh Tập Bài Kệ, nhưng đo trên đĩa thì hai chuỗi đó có 0 lần xuất hiện trong bất kỳ tệp nào của kho (`.cache`, `content`, `src`). 0.1 giữ `Theragāthā` theo tiền lệ 208/219; các tên phẩm dùng đa số đo được trong chính tác phẩm. Nếu coordinator muốn chốt hai tên trên thì đó là thay đổi chính sách tên, không phải sửa lỗi dịch.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` do coordinator chạy; `npm run build` chỉ cần thêm cho bài `published`. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
