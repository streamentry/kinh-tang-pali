notes: |-
  Đã đọc HẾT Pāli lát qua v5/p5.txt trước khi viết. Không segment nào của lát này có …pe… nên hai phía đều 0 dấu lược. Mọi dấu nháy kép đều cân trên cả bài.

  Cấu trúc trùng ne28 và ne34 (đã có trong tầng), nên giữ nguyên một cách dịch cho cả
  bốn khối tiêu đề: Netti, Phần Giải Thích, Nhóm N, và câu hỏi Ở đây, … là gì?;
  bài kệ mở đầu lặp ở mọi sampāta; và câu chốt Nhóm phương thức … đã được vận dụng.
  Khoá 2.1 dùng NGUYÊN VĂN chuỗi đã có ở ne28:2.1 và ne34:2.1 (đã so ký tự, trùng
  khớp hoàn toàn) vì đó là cùng một bài kệ Tasmā rakkhitacittassa, sammāsaṅkappagocaro.
  Tiêu đề vibhattihārasampāta dịch là Nhóm Phương Thức Phân Biệt, đúng khuôn của ne28
  (Phương Thức Chuyển Đổi) và ne34 (Phương Thức Trợ Duyên); phân biệt có 114 tiền lệ.
  pakka → phương diện có 156 tiền lệ, và cặp kusalapakka / akusalapakka giữ đúng đối
  xứng thiện / bất thiện; niddisitabbo → cần được chỉ rõ (chỉ rõ 30, trình bày 333).
  Tiền lệ có đếm và dùng lại: rakkhitacitta → có tâm được phòng hộ, samma-sankappa →
  chánh tư duy, gocara → cảnh giới, niyutta → đã được vận dụng.
  Vế 2.2 và 2.3 giữ đúng hai vế của từng câu: mặt nào phải được chỉ bằng mặt nào, không
  gộp thành một câu và không thêm lý do.
