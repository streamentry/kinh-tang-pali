notes: |-
  BÀI NÀY GIỜ ĐÃ DỊCH TRỌN: 32/32 khoá Pāli. Lát trước chỉ giao 1 khoá (6.1) vì chốt
  `kiểm` của `_hvi.py` lọc `len(p[k]) >= 40`, mà ở tha-ap 23/24 khoá Pāli ngắn hơn 40 ký
  tự — nghĩa là chốt quét không mấy khoá nào rồi báo xanh. Lát này tự viết năm phép kiểm
  quét MỌI khoá (xem cuối notes).

  `translationTitle` BẰNG ĐÚNG giá trị `:0.3` (không thêm số thứ tự). Pāli `:0.3` =
  `Pañcaṅguliyattheraapadāna` KHÔNG bắt đầu bằng chữ số, nên theo chính sách đã đo
  (KEEP 13 · DROP 297 trên 310 tệp tha-ap có cả Pāli lẫn metadata) thì phải BỎ số. Tệp
  này trước đó ghi `Tự Thuật Của Trưởng Lão Pañcaṅguliya`; nay đổi theo đa số phạm vi
  gần nhất (đo ở 100–200: Bài Kệ Tuyên Ngôn 29 · Bài Kệ Tuyên Ngợ 21 · Ký Sự 20; ở
  150–200: Ngôn 22 · Ngợ 12) để không sinh thêm một cách thứ N+1 cho cả cuốn.

  PHE DẤU `ti`. Đo lại ở hai phạm vi: TOÀN TẦNG tha-ap có 605 khoá chứa "Tuyên Ng" →
  Ngợ 417 · Ngôn 162; phạm vi gần 100–200 có 99 khoá → Ngôn 55 · Ngợ 41; gần 150–200
  có 65 khoá → Ngôn 41 · Ngợ 21. Cả hai phạm vi gần đều nghiêng về Tuyên Ngôn, và
  `Tuyên Ngợ` là sai chính tả (nghĩa là `uddāna`), nên bài này dùng Tuyên Ngôn. Cả hai số
  đều được ghi ở đây để người điều phối gộp.

  TÊN RIÊNG giữ nguyên dạng Pāli, không dịch nghĩa. Tên đã đối chiếu HAI nơi trong
  chính bài: tiêu đề `:0.3` và lục kết `:7.1` — 14/14 khớp. Pāli ở dạng Nom. sg.
  (`…theraapadāna`, `…therassāpadānaṁ`) nên bỏ dấu hiệu Nom. như các tiền lệ cùng tập
  (`dussadāyako`→*Dussadāyako*, `atichattiyo`→*Atichattiya*). Mười tên trong uddāna
  `:10.1–:10.5` giữ nguyên vì đó là danh sách tên, đúng như tiền lệ
  (`tha-ap262:10.1` *Thomake, Kāsana, Citaka*).

  SỐ ĐẾM ĐÃ HIỆU CHỈNH, KHÔNG ĐOÁN. `catupaññāsa gāthakāti` (10.6) dịch *gồm có năm
  mươi tư bài kệ*, tức 54 — và con số này được **đo từ chính tầng**, không suy từ trực
  giác: `ekapaññāsa` → 51 (tha-ap182), `sattapaññāsa` → 57 (tha-ap322), `catuppaññāsa`
  → 54 (tha-ap222). Cả ba cùng một hệ `50 + chữ số`. Cùng lý do đó, `Dvenavute` (3.1) là
  **29** (14 tiền lệ "chín mươi hai kiếp"), `Ekūnatiṁsakappamhi` là 29, `Ekattiṁse`
  (tha-ap118:6.1) là 31 (17 tiền lệ), `Dvesattatimhito` (4.1) là 28. Lớt này không có
  `Tiṁsakappasahassamhi` nên không dính lỗi *ba mươi ngàn kiếp* (đo lại trong tầng: 5
  khoá dịch sai *ba mươi ngàn*, 1 khoá đúng *ba nghìn*).

  BẤT ĐỊNH ĐÃ GHI, KHÔNG BỊA. (1) `Pavisati gandhakuṭiṁ` (1.3): `pavisati` đọc được
  theo hai hướng — động từ "đến nơi" hoặc thói quen "săn sóc/tới lui". Chọn *Ông săn sóc
  quả thơm* vì khớp cặp kế tiếp `vihārakusalo` và khớp truyền thống trồng cây
  gandhakuṭi quanh Đại Vihāra; cách đọc kia là *Ông tới nơi có quả thơm*. (2)
  `gandhakuṭi` có **0** tiền lệ trong tầng, nên tôi dịch theo nghĩa từ cấu tạo (*quả
  thơm*) chứ không gọi tên loài cây — không có nguồn đã ghim để khẳng định loài. Cùng lý
  do, `citaka` ở tha-ap118 dịch *quả ấu*; tầng này có 2 tiêu đề dịch `Citakapūjaka`
  thành *Cúng Dường Trái Cây* (tha-ap284, tha-ap531), nên nghĩa là quả, không phải chim
  sẻ. (3) `Apasaddo ca sambuddhe` (2.3): `apasaddo` = không một tiếng động, `ca` = "cũng";
  giữ cả hai, dịch *Cũng lặng lẽ nơi bậc Toàn Giác*.

  `mādāya` (2.1) dịch theo đúng tiền lệ cùng công thức: `Piyālaphalamādāya` → *Cầm quả
  Piyāla lên* (tha-ap142, tha-ap502). `jinantika` (2.2) theo đúng một tiền lệ duy nhất:
  *bậc Thắng được kẻ thù* (tha-ap135). `narāsabho` (1.2) theo đa số 11/19: *bậc Trưởng
  Thượng thế gian, đấng Nhân Ngưu*. `Paṭisambhidā catasso` (5.1) 400/408. `Duggatiṁ
  nābhijānāmi` (3.3) chọn theo phạm vi 150–200 (32 khoá): *Tôi không còn biết đến đọa
  xứ nào* 11 và *Tôi không còn biết đến khổ xứ* 11, cộng lại 22/32 thuộc họ "không còn
  biết đến … xứ" — tôi chọn nhánh đọa xứ. `cakkavattī mahabbalo` (4.4) theo 150–200:
  *Chuyển luân vương có đại thần lực* 9/17. `sayampabho` (4.2) → *bậc xứng bậc Chúa
  Thiên*. `Tassuddānaṁ` (9.1) → *Tóm tắt phẩm này:* (20/29 toàn tầng).

  DẤU LƯỢC. `5.2` và `8.2` của bài kia giữ đúng MỘT `…` cho `…pe…` của Pāli, không
  bung văn. Ở bài này chỉ có `5.2`. Chốt `lược()` của `_hvi.py` khớp từng khoá 32/32.

  NHÁY KÉP CHẠY QUA KHOÁ. Pāli mở ở `1.1` và đóng ở `5.3`; bản Việt cũng vậy. Đây là
  điều kiện đúng của SuttaCentral, không phải lỗi cân từng khoá.

  `:0.1` = `Therāpadāna` được giữ **nguyên văn Pāli** (tiền lệ 391/400 tệp tha-ap; 9
  tệp dịch thành *Trưởng Lão Ký Sự*). Đây là tên mục của phẩm, không phải văn xuôi, nên
  giữ Pāli là đúng; hai khoá `:0.1` này là toàn bộ số khoá trong lát có bản Việt trùng
  nguyên văn Pāli, và tôi ghi rõ để biên tập không tưởng là sót.

  QUÉT CƠ HỌC (tự viết, quét mọi khoá, không lọc 40 ký tự): tập khoá Việt = tập khoá Pāli
  32/32, 0 thiếu, 0 thừa, 0 orphan; ngoặc kép cân trên cả bài; 0 lệch nháy đơn; số dấu
  lược khớp từng khoá 32/32; 0 khoá trùng nguyên văn Pāli ngoài `:0.1` đã giải thích;
  0 chữ phiên Latin; NFC 32/32; 0 lặp từ liền kề; 0 khoá `(…)`. Chốt `lọt_pāli` của
  `_hvi.py` không bắt được từ Pāli mới nào (0) — mười tên riêng trong uddāna đã có
  sẵn trong tầng. Cặp Pāli trùng nội bộ bài: **0** cặp, nên không có phép nào bị lệch.
  Tỉ số độ dài Việt/Pāli: toàn bài 0.25–2.05 (trung vị 1.33); bỏ tiêu đề, uddāna và
  khoá `…pe…` thì 0.81–2.05 (trung vị 1.42, n=19). Biên độ rộng là bình thường ở đây vì
  mỗi vế kệ Pāli chỉ 18–26 ký tự.

