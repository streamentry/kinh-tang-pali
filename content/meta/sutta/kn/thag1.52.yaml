notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Tự quét 9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu
  lược khớp (1.5 giữ hai dấu lược trần), nháy kép mở 1.1 đóng 1.4 nên cân.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 1.5.

  BA VẾ CHUNG VOI HAI BAI KHAC — TOI PHAI CHON, VA GHI RO. 1.1, 1.2 và 1.4 trùng y hệt với
  thag1.53 và thag1.54 (đã so ký tự), và tầng đang có HAI bản cho mỗi vế, mỗi bản 1 lượt:
    · Vassati devo yathā sugītaṁ: *Chư thiên mưa như đang hát ngợt,* (thag1.53) vs *Vua trời mưa
      xuống như đang hát,* (thag1.54). Tôi theo thag1.53 vì `devo` là một vị trời, không phải
      *vua trời*.
    · Channā me kuṭikā sukhā nivātā: *nhà tôi lợp mái, dễ chịu, thoáng mát;* (thag1.53) vs
      *lều tranh của tôi dễ chịu, mái đã kín;* (thag1.54). Tôi theo thag1.54 vì `channā` là
      mái lợp tranh và `nivātā` là kín gió — *thoáng mát* của thag1.53 trái nghĩa `nivātā`.
    · Atha ce patthayasi pavassa devā: *nếu các ngài muốn, thì cứ mưa* (thag1.53) vs *nếu
      ngươi muốn thì hãy mưa, các vua trời* (thag1.54). Tôi theo thag1.54 vì `patthayasi` là
      ngôi thứ hai.
    Cả ba bài vì vậy đang đọc khác nhau; tôi hạ terminology và ambiguity_integrity vì chỗ này
    chưa khép lại, và dành cho biên tập quy một lần cho cả ba.
    Tôi cũng ghi thẳng một chỗ yếu của bản mình đang theo: *các vua trời* cho `devā` là cách
    đọc yếu (chữ nghĩa là chư thiên), và *lều tranh của tôi dễ chịu* đặt vị ngữ hơi cộng. Cả hai
    tôi vẫn giữ nguyên vì ưu tiên tính nhất quán với bài đã có, đổi lại clarity chỉ 8.9.

  KHOA 1.3 LA CUA RIENG BAI NAY (`Cittaṁ susamāhitañca kāye` với `Tassaṁ viharāmi
  appamatto` của thag1.53), tôi tự dịch: *tâm ta đã điền tịnh trong thân*. `susamāhita` là
  điền tịnh; `kāye` là nơi chứa của tâm trong câu này.

  `devo` → *trời* theo tiền lệ thag2.35:1.1 (*Trời thì đang mưa*); `sugīta` → *ngọt*;
  `channā` → mái lợp tranh. Phẩm Thứ Sáu có 8 lượt ngoài lát.
