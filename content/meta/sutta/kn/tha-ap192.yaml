  ĐÂY LÀ BÀI CUỐI CÙNG CỦA `Kuṭajapupphiyavagga` TRONG BẢN ĐÃ GHIM **VÀ CŨNG LÀ BÀI DUY NHẤT TRONG LÁT
  CÓ ĐOẠN `Tassuddānaṃ`**, nên nó phải dựng cả cấu trúc uddāna. Tiền lệ đếm được:
  `Tassuddānaṃ` → “Tóm lược:” (47 lần trong tầng `kn`; đối chiếu 16 cách khác nhau như “Tóm tắt phẩm”,
  “Tóm lược phẩm ấy:”, “Kệ tóm lược phẩm này:” — đa số là “Tóm lược:”).
  `gāthā … kittitāti` → theo tha-ap382:11.6 (`gāthā ekūnasaṭṭhikā`) làm mẫu: “là những bài kệ gồm … câu.”;
  `dvāsaṭṭhi` = hai mươi hai. `Itthaṃ sudaṃ …` và `…therassāpadānaṃ N.` theo tha-ap138/tha-ap140.
  `Paṭisambhidā catasso` → “Bốn vô ngại giải” (275 nơi). `…pe…` → `…`.
  `Therāpadāna` giữ Pāli (262/262, 1 cách).

  **MÂU THUẪN SỐ LIỆU PHẨM — ĐỂ NGUYÊN PĐỊNH, KHÔNG TỰ SỬA.** `:8.1` nói bài này là thứ **mười**
  (`dasamaṃ`), và `tha-ap183` (`paṭhamoṃ`) cùng `tha-ap191` (`navamoṃ`) xác nhận phẩm chỉ có 10 vị trong bản
  đã ghim (tha-ap183–tha-ap192). Nhưng `:9.1` lại khai `Kuṭajapupphiyavaggo ekūnavīsatimo` — **thứ mười
  chín**. Đó là số thứ tự phẩm trong bản in, không khớp tập tệp mà bilara đang ghim. Theo luật “Pāli là
  authority” và “không tự sửa thứ tự hay ranh giới segment”, mình dịch **đúng như Pāli**: “thứ mười chín”, và
  ghi ở đây để người biên tập quyết. Đây là dữ kiện upstream, không phải lỗi dịch.

  TÊN CÁC VỊ TRONG UDDĪNA (`:11.1`–`:11.5`) — chỉ có 4 tên trong 10 có bản Việt đã dịch, nên phần lớn phải
  giữ Pāli, đúng như tiền lệ tha-ap382:11.1–11.5 (giữ tên Pāli kèm chú thích). `Kuṭajapupphiya` (tha-ap183
  “Bài Kệ Tuyên Ngôn Về Trưởng Lão Kuṭajapupphiya”), `Tikaṇṇipupphiya` (tha-ap190), `Bodhiupaṭṭhāka`
  (tha-ap188) đã có dạng, nên `Kuṭaja`, `Tivaṇṭi`, `Bodhi`, `Tikaṇṇika`, `Ekacintī`, `Ekacāriya`,
  `Bandhujīva`, `Isimugga` giữ Pāli. `Isimugga` là vị ẩn sĩ ăn bột nên dịch “Ẩn Sĩ Ăn Bột” cho người Việt
  hiểu; `koṭumbarikahatthiyo` là **vị dắt voi tên Koṭumbarī** (`koṭumbarī` là tên con voi / người nữ), dịch
  “vị dắt voi tên Koṭumbarī;”. `Kuṭajapupphiyavagga` → “Phẩm Hoa Kuṭaja” (tiền lệ tha-ap183; phẩm này
  đang có 3 cách: “Phẩm Hoa Kuṭaja” 2, “Phẩm Kuṭajapupphiya” 2, “Phẩm Bậc Rải Hoa Kuṭaja” 1 — chọn theo
  tha-ap183 là bài đầu phẩm).

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `Abhibhūtaṃ panijjhanti, Sabbe saṅgamma te mamaṃ` (1.1–1.2) — đoạn khó nhất. `saṅgamma` là “điều lắng dịu”
  (người làm người ta yên); câu nghĩa là người kia đã phá hủy hết những điều lắng dịu của tôi. Dịch “Ngươi
  đã hủy diệt hẳn, / mọi điều lắng dịu của ta;”. `Pariḷāho ajāyatha` (1.4) là câu cầu nguyện cho
  chúng sự bị tiêu hao ấy; dịch “cầu cho không còn sinh khởi trở lại.” và **không** thêm chủ ngữ.
  `Dhammadassissa munino` (2.3) — hai cách sở hữu liền nhau, chỉ một người; dịch “Đấng Đã Thấy Pháp, bậc
  Hiền giả” (gộp `muni` vào “bậc Hiền giả”) thay vì lặp hai danh từ làm một vế. `āgacchi mama santikaṃ`
  (2.4) → “đã ngự đến nơi tôi ở.” (`āgacchi` = đã đi tới; dùng “ngự” vì đang nói về bậc Chánh Đẳng Giác, và
  đúng y tiền lệ tha-ap271:2.4).
  `baddhacarā` (3.1) = những người đi theo; `sāvake abhiropayiṃ` (3.4) = dâng lên **một vị** đệ tử (số ít
  không xác định); dịch “dâng lên một vị đệ tử.”
  `Aṭṭhārase kappasate` (4.3) — tiền lệ có 4 cách; chọn “Vào một ngàn tám trăm kiếp trước,”.
  `aṭṭhāsuṃ dhūmaketuno` (5.2) — `dhūmaketu` là xứ Ketuma ở phương nam; dịch “ở xứ Ketuma năm trăm năm;”.
  `Sattaratanasampannā` (5.3) → “Đầy đủ bảy món báu quý giá,” (25 lần, đa số đã đếm).
  `cakkavattī mahabbalā` (5.4) số nhiều → “là những Chuyển luân vương có đại thần lực.” — Pāli giống hệt
  tha-ap136:7.4 nên dùng **đúng** câu đó.

  DẤU LƯỢC — `:6.2` là `…pe…`; bản Việt giữ **đúng một** `…`. Đã khớp từng khoá khi ghi.

  Ngoặc kép: 1.1 mở “ và 6.3 đóng ”; 7.1 trở đi ngoài nháy kép. Tự đếm lại: cân.

