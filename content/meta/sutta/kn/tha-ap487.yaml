notes: |-
  Dịch trực tiếp từ Pāli root, đủ 130/130 khoá (0.1-0.3, 1.1-31.3, 32.1, 33.1); cả ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng ở bài này. Tiền lệ chỉ lấy từ bản Việt của chính dự án: bộ `tha-ap` (8.024 chuỗi Pāli khác nhau đã dò) và phần còn lại của `kn` (34.715 chuỗi). Ba bài gần nghĩa nhất là tha-ap485 (Bhisadāyaka, cùng cấu trúc tự thuật, lời kết và nhịp nháy), tha-ap486 (cùng mô-típ Sumedha, thọ ký tương lai, `Tiṁsakappasahassamhi`) và tha-ap425 (trải tấm da thú cho Đức Phật ngồi, `Nisīdi tattha bhagavā`). Kệ mở đầu và vế hỏi tên có hai công thức song song đã dịch ở thag2.38 (`Pañca kāmaguṇe hitvā, piyarūpe manorame`) và ở vv62, pv17, vv83 (`Devatā nusi gandhabbo, adu sakko purindado`, `Ko vā tvaṁ kassa vā putto`, `kathaṁ jānemu taṁ mayaṁ`); đã dùng lại nguyên văn các vế này.
  Coverage English: mẫu số = 1 (chỉ `:32.1`, 65 ký tự, đạt ngưỡng 40 theo `source/layers.yaml`; `:33.1` dài 39 ký tự, dưới ngưỡng; 128 khoá thân bài còn lại mỗi vế kệ chỉ 16-28 ký tự), Sujato phủ 0/1. Với mẫu số 1, cổng coverage gần như không đo được gì. `content/meta/reference-gaps.yaml` chưa có entry cho uid này (tha-ap480 đến tha-ap484 đã có), cần coordinator xử lý bằng `npm run reference:gaps`; có entry cũng không cứu được `published`.
  Pāli trùng nguyên văn: 47 khoá có Pāli trùng với tầng `tha-ap`, dùng lại nguyên văn bản Việt ở 31 khoá, khác ở 16 khoá (phần lớn chỉ khác đại từ hay chữ hoa-thường: `ta`/`tôi`, `vị ấy`/`người ấy`, hoặc cách dịch chưa thống nhất của chính tiền lệ, như `Namo te purisājañña` có 4 cách). Trong phần còn lại của `kn` có thêm 31 khoá trùng, dùng lại 21, khác 10. Trong chính bài có 3 nhóm Pāli trùng nguyên văn: `Ko vā tvaṁ kassa vā putto,` ở `:5.1` `:6.3` (hai khoá dịch giống hệt), `Tiṁsakappasahassamhi,` ở `:26.3` `:28.1` (giống hệt vì cả hai là cách đếm lùi về quá khứ), và `…pe…` ở `:29.2` `:30.2` `:31.2` (đều là một dấu `…`). Hai cặp trùng chỉ khác dấu câu của Pāli (`pabbajiṁ anagāriyaṁ` `:1.4` `:25.2`; `kataṁ buddhassa sāsanaṁ` `:30.3` `:31.3`) nên Việt khác ở dấu câu và nháy theo Pāli từng khoá. Số cặp trùng trong bài mà Việt khác nghĩa: 0.
  Số Pāli: `Pañcavīse kappasate` (`:16.1`) = 25 x 100 = 2.500 kiếp, viết "hai ngàn năm trăm"; `Chabbīsatikappasate` (`:17.1`) = 26 x 100 = 2.600 kiếp, viết "hai ngàn sáu trăm" (đối chiếu tiền lệ cùng dạng `kappasate`: `Aṭṭhārase` = 1.800 viết "một ngàn tám trăm", `Tevīsatikappasate` = 2.300 viết "hai ngàn ba trăm"). `Tiṁsakappasahassamhi` (`:26.3` `:28.1`) = tiṁsa 30 (không phải 3) x sahassa 1.000 = 30.000, viết "ba mươi ngàn kiếp" theo chỉ dẫn của người biên tập; tiền lệ tha-ap79:1.1, tha-ap115:10.3 và tha-ap486 cùng viết "ba mươi ngàn". `Asītikoṭiyo` (`:1.3`) = 80 koṭi, giữ nguyên `koṭi` như tha-ap5:22.3. `Jātiyā pañcavassena` (`:25.1`) = 5 tuổi (Pāli root là `pañca`; một bản dịch Việt trên SuttaCentral viết bảy tuổi, không theo, vì Pāli root là authority). `Sahassārāni cakkāni` (`:6.1`) = 1.000 nan hoa, viết "ngàn nan hoa" theo dn17, dn26. `Paṭisambhidā catasso` (`:31.1`) = 4, `Pañca kāmaguṇe` (`:1.1`) = 5. Không có số nào khác trong bài.
  Lời thọ ký tương lai: `:16.1` `:17.1` dịch "Sau ... kiếp nữa" theo chỉ dẫn của người biên tập và theo tiền lệ tha-ap9:11.1, tha-ap11:9.1, tha-ap486:22.1. Cách đọc này là bất định (xem mục bất định bên dưới).
  `:0.3`: Pāli `:0.3` KHÔNG bắt đầu bằng số ("Candanamāliyattheraapadāna") nên không đặt số thứ tự; `translationTitle` bằng đúng `:0.3`. Phần "Bài Kệ Tuyên Ngợ Về Trưởng Lão": phạm vi gần nhất tha-ap440-540 "Tuyên Ngợ" 55, "Ký Sự" 24, "Tuyên Ngôn" 2, "Tuyên Ngợi" 1; cả tầng tha-ap "Tuyên Ngợ" 241, "Tuyên Ngôn" 132, "Ký Sự" 111, "Tuyên Ngợi" 10. Hai phạm vi cùng cho "Tuyên Ngợ" là đa số; giữ để khớp bài kề (tha-ap485, 486, 488, 490) và để biên tập phán một lượt cho cả cuốn. `:0.2` `Paṁsukūlavagga` = "Phẩm Y Phấn Tảo" (theo tha-ap486). Lời kết `:32.1` dùng nhóm "những bài kệ này" (82 khoá cùng dạng ở phạm vi tha-ap440-540; nhóm số ít "bài kệ này" bị loại).
  Đại từ: "ta" cho vị trưởng lão tự thuật xuyên suốt (phạm vi tha-ap440-540: "ta" 550 dòng, "tôi" 323 dòng; bài kề tha-ap485, 486 dùng "ta", kể cả trong lời trích). Lời Đức Phật ở `:7.1-8.4` viết hoa "Ta" để phân biệt người nói (theo tha-ap486). Trong lời hỏi tên ở `:4.3-6.6`, người được hỏi viết thường "ngài" (chưa biết là Đức Phật, theo vv62, pv17, vv83), và "chúng tôi" ở `:6.4` theo công thức vv62:2.4 vì `mayaṁ` là số nhiều; sau khi nhận ra, từ `:9.3` trở đi viết hoa "Ngài".
  Thuật ngữ (kèm số đếm): `gandhabba` "càn-thát-bà" (tầng: 9 tệp viết thường, 20 tệp viết hoa); `sakko purindado` "Sakka Đấng Phá Thành" (4 khoá công thức vv62, pv17, vv83); `pañca kāmaguṇe` "năm dục" (thag2.38; ngoài ra snp2.7 viết "năm dục lạc"; tầng "năm dục" 58 tệp so với "năm dục lạc" 9); `piyarūpe manorame` "những thứ khả ái, đáng yêu" (snp2.11, thag2.38); `lokanāyako` "bậc Dẫn Đạo Thế Gian" (theo tha-ap486, 490); `Duggatiṁ nābhijānāmi` "Ta không còn biết đến đọa xứ" (toàn tầng 58 khoá dạng này so với 137 khoá "không biết mình rơi vào khổ đau" và 92 khoá "đọa xứ nào"; phạm vi gần nhất tha-ap440-540 "Ta không còn biết đến đọa xứ" 37 so với "khổ đau" 23); `cetanāpaṇidhīhi ca` "cùng với tâm nguyện và chí hướng" (26 tiền lệ); `Pasannacitto sumano` "Với tâm tịnh tín hân hoan" (60 so với "hoan hỷ" 10; phạm vi gần 17 so với 6); `Paṭisambhidā catasso` "Bốn vô ngại giải" (495 khoá); `mahiddhiko` "có thần thông lớn" (5 so với "đại thần lực" 1); `cāturanto` "làm chủ bốn phương" (5:14.3, 18:7.3, 57:7.3); `brahmabandhu bhavissati` "người dòng Bà-la-môn" (3 so với "thân quyến của Phạm thiên" 1, ở các lời thọ ký tha-ap4, 10, 11); `vasavattī` "bậc tự tại" (iti22, iti112; ja494 dịch "có quyền tự tại"); `Sumedha`, `Vebhāra`, `Vissakamma`, `Candanamāliya` giữ Pāli; `kappa` "kiếp"; `candana` "chiên-đàn" (tha-ap135, 146, 337); `jinacamma` "tấm da thú" (theo `ajina` ở tha-ap43, 425; `jinacamma` không có tiền lệ).
  Bất định: (1) `:16.1` `:17.1` locative `kappasate` có thể là điểm thời gian ("sau ... kiếp nữa") hoặc khoảng thời gian ("trong ... kiếp"); một bản Việt trên SuttaCentral đọc là khoảng thời gian cho cả hai câu, nhưng con số `Pañcavīse` bị đọc là 250 (không khớp cấu tạo 25 x 100 của tiền lệ) và hai dòng `devaloke ramissati`, `manussattaṁ gamissati` tiếp nối nhau (25 rồi 26 trăm). Dịch theo chỉ dẫn "sau ... kiếp nữa", chưa phân xử được; vì sau đời này vị ấy đã sinh về cõi Ba mươi ba (`:22.4`) nên cách đọc khoảng thời gian cũng hợp lý. (2) `:12.1` `Sālakalyāṇikaṁ pupphaṁ` dịch "hoa sa-la tốt đẹp" theo cách đọc `kalyāṇika` là tính từ và vì `:13.2` dùng `sālapuppha`; Milindapañha có `sālakalyāṇikā` là tên một loài cây riêng (mil7.3.4), nên cũng có thể là hoa của loài ấy, chưa phân xử. (3) `:16.4` `vasavattī` dịch "bậc tự tại" theo iti22, iti112; cũng có thể là danh xưng của chủ cõi trời Tha Hóa Tự Tại, Pāli không nói rõ. (4) `:16.3` `Anūnamanasaṅkappo` dịch "với ý nguyện không hề thiếu sót"; `manasaṅkappa` có thể là ý nghĩ hay ý chí. (5) `:15.4` `gandhamālehi cūbhayaṁ` dịch "và nhờ cả hai thứ, hương thơm và tràng hoa"; `ubhayaṁ` có thể chỉ cả hai món (trái cây và hương hoa) chứ không chỉ hai thứ hương-hoa; tiền lệ tha-ap60:4.4, tha-ap70:4.4 cũng khác nhau ở `cūbhayaṁ`. (6) `:26.2` `orena nāddasaṁ ahaṁ` dịch sát chữ "ta không thấy gì ở phía gần hơn"; `ora` là phía này/gần, đối tượng bị lược, tiền lệ trong tha-ap chỉ có tha-ap180:1.1 (nghĩa khác), nên không phân xử được nghĩa chính xác. (7) `:24.3` `Mātuyā mama chandena` hiểu là "ý muốn của mẹ ta"; bản Việt trên SuttaCentral đọc là ý muốn của chính vị ấy (`mama chandena`, `mātuyā` là cách dành cho mẹ), cả hai đều hợp ngữ pháp. (8) `:24.2` `annapānañca bhojanaṁ` dịch "thức ăn, thức uống và vật thực", không có tiền lệ. (9) `:8.1` `Atīto visayaṁ tesaṁ` dịch "đã vượt khỏi phạm vi của những vị ấy"; `visaya` có thể là cảnh giới. (10) `:20.2` `brahmabandhu` dịch "người dòng Bà-la-môn" theo đa số tiền lệ; `brahmabandhu` cũng là "thân quyến của Phạm thiên". (11) `:20.5` `Abhiññāpāragū` dịch "đạt đến tận cùng của các thắng trí" theo thi-ap9:20.3. (12) `:9.1-9.2` `suṇitvāhaṁ` đặt chủ ngữ "ta" sang `:9.2` để câu Việt có dấu câu khớp Pāli; không thêm hay bớt nghĩa. (13) `:15.1` thêm chủ ngữ "Ngài" và `:18.3` thêm "Thành ấy" để câu Việt tự nhiên, vì Pāli bỏ chủ ngữ ở chỗ đã rõ từ khoá trước; không thêm nghĩa. (14) `:4.4` kết bằng dấu hỏi thay cho dấu chấm của Pāli theo công thức vv62, pv17, vv83; không đổi nghĩa.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Chỉ xác minh được: JSON hợp lệ, đủ 130/130 khoá, đúng thứ tự Pāli, không khoá thừa, mọi giá trị NFC, không khoá rỗng hay khoảng trắng thừa, dấu lược khớp Pāli từng khoá (3/3 khoá `…pe…` thành `…`), không có `(…)` ở Pāli hay Việt, nháy đơn và nháy kép khớp Pāli từng khoá (8 khoá có nháy: `:1.1` `:4.3` `:8.4` `:9.3` `:10.2` `:15.3` `:20.6` `:31.3`, nháy chạy qua ranh giới khoá), không chữ Pāli lọt vào Việt ngoài tên riêng (`Therāpadāna`, `Candanamāliya`, `Vebhāra`) và đơn vị `koṭi`. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
