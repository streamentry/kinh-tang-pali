notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng tham khảo tiếng Anh nào ở commit đã ghim cho ja448.
  Tiền lệ đếm được: `Jātaka` -> Jātaka 418/434; `Catudvāravagga` -> Phẩm Bốn Cửa 8/8; `10. Kukkuṭajātaka` -> 10. Kinh Kukkuṭa theo mẫu ja445 (7. Kinh Nigrodha) và ja446 (8. Kinh Takkala); `Kukkuṭajātakaṁ dasamaṁ.` -> Kinh Kukkuṭa thứ mười. theo mẫu ja446:11.1 (Kinh Takkala thứ tám).
  Cần NGƯỜI ĐIỀU PHỐI GỘP: `Dasakanipāta` đang có hai cách trong kho — Bộ Mười Bài Kệ 8 lần (toàn bộ 8 bài trong bộ Jātaka: ja439/442/445/446/449/451/452/453) so với Bộ Mười Bài Kinh 6 lần (toàn bộ 6 bài thag10.1-10.6). Tầng `name/` đã ghim ghi `ja-name:492` -> The Book of the Tens. Bảng tên đã chốt trong BRIEF_VI3 §11 dùng Bộ Một Bài Kinh / Bộ Hai Bài Kinh cho Ekakanipāta / Dukanipāta từ đúng bằng chứng `name/` ấy, nên kéo theo sẽ là Bộ Mười Bài Kinh. Ở đây đã theo đa số TRONG CHÍNH BỘ JĀTAKA (Bộ Mười Bài Kệ) và ghi lại để người điều phối quyết. KHÔNG tự tạo cách thứ N+1.
  BẤT ĐỊNH — đây là điểm yếu thật của bài, cần đọc kèm: (1) `Nāsmase katapāpamhi … nāsmase alikavādine / Nāsmase attatthapaññamhi …` (1.1-1.4) — `nāsmase` là `nā asmi` của gốc as = nói. Vế tân ngữ (`katapāpamhi`, `alikavādine`, `attatthapaññamhi`) không cho biết là phủ định cái gì. Bản dịch chọn cách đọc mà người đọc hiện đại hiểu được (không nói điều ác là do mình, không nói với kẻ nói lái, không nói trí tuệ vì lợi ích riêng) và ghi rõ ở đây. Ba từ này không có tiền lệ trong 1.794 bài Việt đã có. (2) `athetaṁ sabbaghātinaṁ` (5.2) dịch chứ không trốn tránh kẻ giết hại nào cả — cách đọc khác là câu đối lập trực tiếp với 5.1. (3) `kūṭamivoḍḍitaṁ vane` (11.1) dịch bị nghiền nát giữa rừng theo thể bị động; cũng có thể là mệnh từ chủ động (kẻ nghiền nát người khác trong rừng) — hai cách dẫn tới hai hình dung ngược nhau. (4) `kukkuṭo viya senakaṁ` (8.4) và `kukkuṭo viya senakā` (10.4): `senaka` ở đây là kẻ cầm xe (cùng nghĩa với `rathesabha` -> đức người cầm xe ở ja376); 8.4 là gà mổ kẻ cầm xe, 10.4 là gà thoát kẻ cầm xe — hai hình ảnh đối xứng, giữ nguyên. (5) `sukkhañjali` (3.1) dịch tay chắp lễ trắng.
  Vì bản root `pli/ms` chỉ có thơ, KHÔNG có văn xuôi cho Jātaka, nên khung truyện không thể đối chiếu ở commit đã ghim; toàn bộ bài dịng từ câu kệ, và những chỗ không chắc đã ghi ở trên thay vì bịa thêm.
  Dấu lược: Pāli ja448 không có `…pe…`; đếm lược 0 = 0.
  Chốt `_hvi.py` sạch: 49/49 khoá, khoá thừa 0, NFC OK, ngoặc kép cân và khớp đúng cấu trúc Pāli (mở ở 1.1 và 8.1, đóng ở 7.4 và 11.4). `Jātaka` ở 0.1 giữ nguyên Pāli là quy ước của bộ.
