notes: |-
  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all; file Pāli so git-hash với manifest (khớp). Đo bằng npm run store: 4 segment Pāli có nội dung (1.2, 1.3, 1.5, 1.6), English coverage 0% vì tầng en/sujato không có file cho uid này và english-project chưa publish nên không được tính; sàn 0,8 không đạt và reference-gaps.yaml chưa ghi nhận, nên bắt buộc draft.
  Khung đối đáp giữ nguyên một cách dịch với mil3.4.9, mil3.5.4, mil3.5.6, mil3.6.6, mil3.7.13: Vua nói— (Pāli mang gạch dài nên giữ gạch dài, khớp mil3.5.6 và mil3.6.6), thưa tôn giả Nāgasena, này Đại vương, và câu chốt Khéo lắm, thưa tôn giả Nāgasenā. Câu chốt đó nằm trong TIEN_LE_PHAI.md với nguyên văn bắt buộc, lấy từ mil3.5.6:2.1 và mil3.6.6:2.1. Colophon có dấu phẩy trước số thứ tự như cả 5 bài Milinda đã có.
  Vicāravagga: 0 tiền lệ trong tầng, đặt mới Phẩm Khảo Sát. Lý do: bốn phẩm Milinda đã có (Buddhavagga, Sativagga, Nibbānavagga, Arūpadhammavavatthānavagga) đều dịch tên phẩm theo nghĩa sang Hán–Việt, và tầng english-project của chính bài này đặt 0.2 là Examination, trùng nghĩa với khảo sát. Không giữ chữ Vicāra vì sẽ đưa Pāli có dấu vào bản Việt.
  saṅkhārā: 0 tiền lệ trong tầng. Câu hỏi hỏi về những saṅkhārā khởi sinh, và câu trả lời là dãy nhân quả mắt → thức → xúc chạp → thọ → tham ái → nắm giữ → hữu → sinh → già chết, nên tôi dịch là tiến trình; việc đổi từ trong tiêu đề và trong lời được giữ đồng nhất.
  Chuỗi đối chiếu có tiền lệ: sn35.147:1.4 và sn35.148:1.4 cho cặp mắt – hình sắc – nhận thức/xúc chạp của mắt (tôi dùng thức của mắt, 12 lần, và xúc chạp của mắt, 8 lần); cảm thọ 1161, tham ái 229, nắm giữ 205, hữu 2608, già và chết 61, toàn bộ khối khổ 48, khởi sinh và diệt tận đều có tiền lệ. Cả hai vế Cakkhusmiñca kho … và Cakkhusmiñca kho, mahārāja, asati … giữ trọn hai điều kiện (có mắt và có hình sắc), và 1.6 là phủ định của 1.5 nên không bỏ chữ nào. hotī ở 1.6 là enclitic chỉ định, dịch chính là.
  Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú, không có bản Hòa thượng Thích Minh Châu cho bài này; không có bản Anh Sujato đã ghim và tôi không đọc english-project nên scorecard này không tuyên bố đã đối chiếu English.
