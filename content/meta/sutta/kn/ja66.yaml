notes: |-
  **Một blocker, bài phải ở `draft`.** Không sửa bản dịch.

  **Chi tiết lỗi.** `aḷārakkhī` = `aḷāra` (trăng) + `akkhī` (mắt, giống cái). Tôi đã kiểm để loại trừ khả năng nó là tên vật: trong snapshot đã ghim `aḷāra` xuất hiện ở `ja524` và **cả 8 lần** đều là từ gọi thẳng người (*Karoma te taṁ vacanaṁ aḷāra* = "này người yêu quý, ta nói với ngươi điều này"), không có nghĩa đồ vật nào. `aḷāarakkhī` chỉ xuất hiện đúng một lần trong toàn bộ corpus đã ghim — ở chính `ja66:1.3`. Và Sujato (tầng Anh đã ghim) dịch *the moon-eyed lady*, xác nhận đây là người nữ.

  Vế kệ nói: trước đây ta có một mong ước, là **có được chiếc nhẫn có dấu ấn**; nhưng khi đã **có được người mắt trăng**, thì mong ước này sinh ra mong ước khác. Bản dịch đổi chủ thể vế thứ hai thành một chiếc nhẫn khác, làm mất toàn bộ ý **đã mong muốn thì càng mong muốn hơn** (`icchā icchaṁ vijāyathā`) — vì nếu vế trước và vế sau cùng nói về một vật thì câu tự mâu thuẫn. Đây là lỗi làm hỏng logic mệnh đề, không chỉ là lỗi từ.

  **Hai vế sau `1.4` đúng.** `icchā icchaṁ vijāyathā` → *mong ước này sinh ra mong ước khác* ✓. `Ekā icchā pure āsi` → *Trước kia có một mong ước* ✓ (`pure` = trước kia, giữ nguyên số ít).

  **`mudulakkhaṇa` ở `1.2` → *chiếc nhẫn có dấu ấn* ✓.** `mudu` = nhẫn, `lakkhaṇa` = dấu ấn. Vế này đúng và là vế mà `1.3` đã đụng phải.

  **`Itthivagga` → *Phẩm Phụ Nữ* ✓** trùng nguyên văn 8 tệp đã có (`ja61`–`ja68`); Sujato cũng dịch *Women*.

  **Ngoặc kép:** `1.1` mở `“`, `1.4` đóng `”ti.` ✓.

  **Tầng Anh** có mặt đủ **cả bốn vế** — và đây là lý do lỗi này bị bắt được: Sujato có *the moon-eyed lady* ở đúng khoá `1.3`, nên tầng tham khảo có mặt và sẽ chặn được. Khác với `ja179`/`ja183`, bài này có đủ tầng Anh để đối chiếu.
