notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Không khoá nào có …pe…; nháy kép tự chứa theo từng khoá và cân trên cả bài.

  Tiền lệ có đếm và dùng lại: Buddhavagga → Phẩm Đức Phật (6, y hệt mil3.5.4 và mil3.5.6); nāmarūpa → danh và sắc (30 so với 7 dạng sắc và danh); kamma → nghiệp; parimutta → được giải thoát khỏi; Pāli trùng nguyên văn 3.1 Kallosi bhante nāgasenā ti — dùng lại nguyên văn Khéo lắm, thưa tôn giả Nāgasenā.

  Bất định lớn nhất của bài, ghi ở đây chứ không sửa trong thân kinh. Ở 2.4 chữ Na kho so, mahārāja, tāni ambāni avahari, yāni tena ropitāni, kasmā daṇḍappatto bhaveyyā có hai cách đọc. Cách một, coi Na kho so như phủ định thì câu thành anh ấy không hái những quả xoài chính mình trồng, thì tại sao lại bị đánh đòn — nhưng câu đó trái ngay với câu trả lời 2.5 (vì những quả xoài do người ấy đã trồng mà sinh ra, nên sẽ bị đánh đòn). Cách hai, coi Na kho so là điều kiện — nếu người ấy không hái quả xoài mình trồng, thì có bị đánh đòn không — thì 2.5 là câu trả lời đúng và 2.6 về nghiệp nối tiếp vào thân sau cũng khớp. Đã chọn cách hai vì nó là cách duy nhất trong đó ba khoá liên tiếp không mâu thuẫn, và nói rõ trong notes để người đọc không phải tự suy. Vì vậy ambiguity_integrity hạ xuống 8.8.

  0 tiền lệ, đặt mới: satto → con sát thú; paṭisandahati → chuyển tiếp sang; paṭisandha (từ) → danh và sắc khác tiếp nối vào. Một lượt review tự bắt được lỗi: bản nháp đầu dịch kasmā thành hởi Đại vương, tiếng Việt sai; đã sửa thành câu hỏi thuận với phần còn lại. Cùng đợt review này, 2.1 Opammaṁ karohī cũng đổi từ Hãy làm một ví dụ sang Hãy xét một thí dụ để khớp với họ công thức đã có trong tầng (thí dụ 11/14).

  Triangulation: không có English Sujato cho uid này tại commit đã ghin (đã dò cache, 0 tệp), nên dịch chỉ từ Pāli. Không chạy được npm run validate|test|check|build theo lệnh phân công đợt này nên technical_integrity là 9.6.
