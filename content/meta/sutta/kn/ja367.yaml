notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho ja367.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 25 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Kiểm toán Jātaka chỉ có Pāli 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): đọc lại đủ khoá; sửa 2.1–2.2 và 3.1–3.2 (`ahantāraṁ` = người không giết, `aghātentaṁ` = không sai người giết; bản cũ thêm "oán hận", "xúc phạm", "không muốn hại mình"), 5.1 (`appaduṭṭha` = không có lỗi, không phải "không ô nhiễm"), 4.3 ("làm mù mắt" không có trong Pāli, `hanti` = đập trúng), 1.2 (bỏ "đứa trẻ", "độc"), bỏ "độc ác" ở 2.4, 3.4, 4.4. Còn bất định: chữ `mahantāraṁ` ở 2.1 (hiểu theo cặp `ahantāraṁ`, đối chiếu Chalmers "never striketh back"). Có 5 trên 20 dòng kệ sai nghĩa thật nên hạ semantic_fidelity và grammar_logic xuống 8,8.

  Quyết định hội đồng biên tập 2026-10-16: C1 — `0.4`, `6.1` và translationTitle (tiêu đề giữ "Kinh X", bỏ đuôi "jātaka" hoặc "Chuyện Tiền Thân"; cùng tên Pāli thì cùng tên Việt); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
