notes: |-
  Đợt 19, làn 84. Dịch từ Pāli root commit đã ghim, đủ 119/119 khoá (0.1–0.4, 1.1–27.6, 28.1), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh mà chỉ suy ra từ nội dung (xem bất định 1). Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề và colophon.**
  - `0.1` “Jātaka”, `0.2` “Bộ Hai Mươi Bài Kinh”, `0.3` “Phẩm Mātaṅga”: dùng lại nguyên văn. `0.1`: đo 501 cặp Pāli trùng, 485 giống “Jātaka”, 16 khác (“Chuyện Tiền Thân”, nhóm bài cũ); `0.2`: 16/16 giống; `0.3`: 6/6 giống (`ja497`, `ja502`, `ja504`, `ja508`, `ja509`, `ja510`).
  - `0.4` “7. Kinh Sattigumba” và `28.1` “Kinh Sattigumba, thứ bảy.”: `Sattigumba` là tên riêng (con vẹt, xem bất định 2), nên giữ phiên âm, theo khuôn “Kinh Bhallātiya” (`ja504`). Số `7.` ở `0.4` khớp `sattamaṁ` (7) ở `28.1`. Dấu phẩy trước số thứ tự ở `28.1`: đo trên các Jātaka từ `ja400` trở lên, 70 colophon có dấu phẩy, 33 không có; chọn có dấu phẩy.

  **Tiền lệ dùng lại nguyên văn.** Đã dò toàn tầng đã dịch (so Pāli sau khi nén khoảng trắng, hạ chữ hoa, bỏ dấu câu; không tính tiêu đề `0.x`): 31 khoá thân kệ của bài có Pāli trùng nguyên văn với dòng đã có bản Việt ở bài khác, tổng 42 cặp; 27 cặp giống, 15 cặp khác. Phần lớn là bài song hành `iti76` (Itivuttaka, các dòng kệ về thân cận người ác và người hiền, tức `23.1`–`27.6`, 22 dòng trùng) và dòng kệ đã gặp ở `ja494`, `ja476`, `ja440`, `ja166`, `ja384`, `ja484`, `pv25`, `dhp261`.
  - Dùng lại nguyên văn: `1.2` “bậc chiến xa đệ nhất của người Pañcāla” ← `pv25:1.2`, `pv25:8.2`; `12.3` ← `ja494:5.1`; `12.4` ← `ja494:5.2`; `16.2` ← `ja384:2.2`, `ja484:13.2`; `20.2` ← `ja440:8.2`; `21.2` ← `ja166:2.2`, `dhp261:2` (còn `an3.45:2.2` dịch “bất sát, chế ngự và điều phục”, 2 so với 1); `23.1`, `23.2`, `23.4`, `24.1`, `24.3`, `24.5`, `24.6`, `25.3`, `25.4`, `26.3`, `26.4`, `27.4`, `27.5`, `27.6` ← `iti76`; `6.1` “Sao ngươi như kẻ mất trí” ← `pv8:1.1`, `pv18:3.1` (hai bài còn lại, `pv51:1.1` “có dáng như kẻ mất trí” và `ja454:3.1` “như kẻ phát điên”, khác: 2 so với 2, chọn dạng có `ngươi` vì `6.2` gọi `Sattigumba`).
  - Khác có chủ ý (15 cặp, đã đọc từng cặp): (a) `12.5` ← `ja476:1.3` chỉ khác đại từ (“ngài” thay “ngươi”, vì người nói là Pupphaka). (b) `16.1` ← `ja236:1.1` “Khéo là một con chim, bạn hiền”: Pāli trùng nhưng nghĩa ở `ja236` khác hẳn (bài kệ khác, người nói khác); theo `ja384:2.1` và `ja484:13.1` “Thật tốt lành thay con chim này” (2 bài). (c) `24.2` ← `iti76:6.2` “kẻ xúc chạm và kẻ bị xúc chạm”: Pāli `samphuṭṭho` (bị chạm) đứng trước `samphusaṁ` (chạm), và tầng Sujato của `iti76` dịch “the one contacted and the one who contacts another”; bản Việt ở `iti76` đảo thứ tự, nên ở đây theo Pāli và Sujato: “kẻ bị xúc chạm và kẻ xúc chạm người khác”. (d) `24.4` ← `iti76:6.4` “lây nhiễm cả ống tên”: thêm “chưa nhiễm” cho `alitta`, vì `alittamupalimpati` mang nghĩa “làm nhiễm cái chưa nhiễm”. (e) `25.1`, `25.2`, `26.1`, `26.2` ← `iti76:7.1`–`8.2`: ở `iti76` mỗi dòng Pāli bị chia khác (`gói trong ngọn cỏ`, `gói trong lá`), còn ở đây hai dòng Pāli `yo naro upanayhati` (`25.2`, `26.2`) trùng nguyên văn nhau nên phải có bản Việt giống nhau; vì vậy chia lại: vật gói ở dòng 1, “người nào gói lại” ở dòng 2. Và `iti76:8.1` dịch `tagara` là “hương chiên đàn”, còn ở đây giữ “tagara” như `an3.79:7.2` (“tagara” đứng riêng, tách khỏi “đàn hương” `candana`). (f) `27.1`, `27.2` ← `iti76:9.1`, `iti76:9.2` “như người biết gói”, “biết rõ phận sự của mình”: tầng Sujato dịch `Tasmā pattapuṭasseva, ñatvā sampākamattano` là “So, knowing they’ll end up like the wrapping”, tức `sampāka` là kết cục/chín muồi, không phải “phận sự”, và `pattapuṭa` là gói lá, không phải người gói; ở đây dịch “như gói lá ấy” và “biết rõ kết cục của chính mình”. Hai khoá này của `iti76` dường như lệch Pāli; ghi nhận, không đụng tới (ngoài lát).

  **Trùng nguyên văn trong chính bài (có kết quả):** 7 nhóm Pāli trùng nguyên văn (sau khi bỏ dấu câu và dấu nháy), cả 7 đều đã dịch giống hệt nhau về chữ (0 cặp lệch): (`2.4` = `16.4`), (`4.2` = `5.2`), (`8.4` = `9.4`), (`10.2` = `15.2`), (`10.3` = `11.3`), (`11.4` = `17.2`), (`25.2` = `26.2`). Khác biệt duy nhất là dấu nháy/chấm theo Pāli từng khoá: `11.4` kết ”., còn `17.2` kết ’; (nháy đơn, vì nằm trong lời trích lồng ở `17.1`–`17.2`).

  **Số Pāli:** không có phép tính nào. `sattamaṁ` (`28.1`) = 7, khớp số `7.` ở `0.4`; `vīsati` (`0.2`) = 20 (“Hai Mươi”); `eka` ở `ekarukkha` (`18.3`) và `ekamātuka` (`18.2`) = 1 (“một cây”, “một mẹ”); `ubho` (`18.4`) = “cả hai”. Không có cụm số nào chưa phân xử được (không gặp `Tiṁsakappasahassa`).

  **Thuật ngữ và tiền lệ đã đo:**
  - `suva` (`2.4`, `12.2`, `16.4`) → “con vẹt”: trong các khoá Jātaka có `suva`/`suka` và đã dịch (42 khoá), 5 khoá chứa “vẹt”; không có dạng khác nào có số đếm đáng kể. `Sattigumba` giữ phiên âm.
  - `sārathi` (`4.2`, `5.2`, `8.2`) → “người đánh xe”: trong 9 khoá Jātaka đã dịch có `sārathi`, 7 dùng “đánh xe” (“kéo xe” 1).
  - `isi` (`19.2`) → “ẩn sĩ”: 27 khoá Jātaka đã dịch có `isi`/`isī`, “ẩn sĩ” 9 · “đạo sĩ” 8; chọn “ẩn sĩ” (như `ja490`, `tha-ap63`, `mil5.5.6`).
  - `assama` (`8.4`, `9.4`, `17.4`) → “am thất”: 9 khoá Jātaka đã dịch có `assama`, “am thất” 2 · “am” (ở dạng khác) 3; theo `ja346`, `ja490`.
  - `mahārāja` vocative → “tâu đại vương”: 33 khoá Jātaka đã dịch có `mahārāja`, “tâu đại vương” 15 · “đại vương” (mọi dạng) 30 · “bạch đại vương” 2. `rāja` đứng riêng (`13.4`, `22.1`) → “tâu vua”.
  - `luddāni` (`2.4`, `16.4`) → “tàn bạo”: theo `ja308:2.2` (“luôn làm những việc tàn bạo”); chỉ 2 khoá Jātaka đã dịch chứa `luddā-` dạng này.
  - `asanta`/`asat` → “kẻ ác”, `santa`/`sat` → “bậc hiền”: theo `iti76:9.3`–`9.6` (3 khoá “kẻ ác” trên tầng); ở Jātaka (16 khoá có `asant-`/`asataṁ`) “kẻ xấu” 7 · “bất thiện” 3, và “bậc hiền” 9 · “bậc thiện” 5 · “người lành” 4 cho `sant-`; giữ “kẻ ác”/“bậc hiền” để bốn đoạn cùng một chủ đề (`19`, `22`, `24`, `27`) nhất quán và khớp `iti76`.
  - `kuṭi` (`2.2`, `2.3`) → “túp lều”: 0 tiền lệ trong 18 khoá Jātaka có `kuṭi` (đều không dịch bằng “lều”); giữ nghĩa thông thường.
  - `corānaṁ`/`takkara` → “bọn trộm cướp” (`2.2`) và “bọn trộm” (`19.1`): `takkara` 0 tiền lệ; `cora` trong Jātaka dịch “trộm” 5 · “cướp” 3.
  - `sāhasā` (`4.4`) → “bằng bạo lực”: theo `thag16.2:18.4`; `ja440:8.1` dịch `sāhasākāra` là “hành vi bạo lực”, dùng lại cho `20.3`.
  - `kuṇḍala` → “hoa tai” (`3.2`, `5.3`): 14 khoá Jātaka đã dịch dùng “hoa tai”; `maṇikuṇḍala` → “hoa tai ngọc”; `uṇhīsa` (`3.3`) → “khăn đội đầu”: 0 tiền lệ.
  - `kodaṇḍaka` → “cung”, `satti` → “lao”, `tomara` → “giáo” (`11.1`, `11.2`): `cp11:10.2` dịch `tomara` là “giáo”; `satti` 0 tiền lệ về vũ khí (chỉ có `mukhasattī` “gươm” ở `ud6.4`); dùng “lao” để phân biệt với “giáo” của `tomara` (tầng Sujato dịch `sattī` ở `mn14:11.1` là “spears”; `tuttatomaraṁ` ở `dn21:1.5.18` là “lance and pikes”).
  - `girigabbhara` → “hang núi”: 1 khoá Jātaka đã dịch có dạng này, dịch “hang núi”.
  - `tinduka`, `piyāla`, `madhuka`, `kāsumārī` giữ phiên âm: `ja177` (“Chim Tinduka”), `tha-ap382` (“Kāsumāri…”), `ja307` (“cây tinduka”); không có tên Việt chắc chắn cho bốn loại quả này, và gán một tên thông dụng sẽ thêm nghĩa ngoài Pāli.
  - `āsana` + `udaka` + `dāyin` (`21.3`) → “những người dâng chỗ ngồi và nước”: 0 tiền lệ cho ghép `āsanūdakadāyī`; dịch từng thành tố.
  - `paramadhammika` (`16.2`) → “có giới hạnh tối thượng”: dùng lại nguyên văn `ja384:2.2` và `ja484:13.2` (2 bài); “giới hạnh” cho `dhammika` là cách dịch của hai bài ấy, không phải lựa chọn mới của bài này.
  - `matta` (`7.2`) → “say sưa”; `ummattarūpa` (`6.1`) → “như kẻ mất trí” (xem trên).
  - Cách dịch `pañcāla` (`1.2`, `10.3`, `11.3`): “Pañcāla” là tên xứ; `esa gacchati pañcālo` dịch “người Pañcāla này”, tức chính nhà vua, vì `1.2` đã gọi nhà vua là `pañcālānaṁ rathesabho`.

  **Dấu câu (khớp Pāli từng khoá).** Nháy kép `“`/`”`: Pāli 22 khoá có dấu (11 mở, 11 đóng; mở ở `3.1`, `6.1`, `7.1`, `8.1`, `9.1`, `10.1`, `12.3`, `16.1`, `18.1`, `20.1`, `22.1`; đóng ở `5.4`, `6.4`, `7.4`, `8.4`, `9.4`, `11.4`, `15.4`, `17.4`, `19.4`, `21.4`, `27.6`), Việt khớp đủ, lệch 0/119 khoá. Nháy đơn `‘`/`’`: Pāli 2/2 (`17.1` mở, `17.2` đóng), Việt 2/2, lệch 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0, nên không có gì để cân. Cấu trúc nháy: `3.1`–`5.4` lời của Sattigumba về nhà vua; `6.1`–`6.4`, `7.1`–`7.4` hai lời đáp qua lại; `8.1`–`8.4` lời nhà vua; `9.1`–`9.4` lời người đánh xe; `10.1`–`11.4` Sattigumba gọi bọn trộm; `12.3`–`15.4` lời chào của Pupphaka (không có `“` ở `12.1`–`12.2`, là phần dẫn); `16.1`–`17.4` lời nhà vua, trong đó `17.1`–`17.2` là lời trích lồng; `18.1`–`19.4` và `20.1`–`21.4` hai lời của Pupphaka, `22.1`–`27.6` lời kết. Một lỗi đã bắt khi tự kiểm: bản nháp đầu bỏ sót dấu mở nháy kép ở `10.1` và `20.1`; phép so từng khoá bắt được và đã sửa. Ở `7.4` Pāli kết ”. còn Việt kết ?” vì câu hỏi (`kiṁ nu`).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói không có trong tầng Pāli đã ghim, nên được suy từ nội dung kệ và không ghi vào thân kinh: `1`–`2` là lời dẫn; `3`–`5` một con vẹt (Sattigumba) nói với bọn trộm về nhà vua đang ngủ; `6` và `7` hai lời đáp qua lại, ngôi hai gọi `sattigumba` ở `6.2` (người nói `6` và người nói `7.1`–`7.2` chưa xác định được; cách đọc dễ nhất là một người trong bọn trộm hoặc nhà vua nói `6`, Sattigumba đáp `7`); `8` nhà vua (xưng `me`, ra lệnh cho người đánh xe); `9` người đánh xe; `10`–`11` lại là Sattigumba gọi người; `12`–`15` Pupphaka (`suvo lohitatuṇḍako`) tiếp đón; `16`–`17` nhà vua nói với Pupphaka; `18`–`27` Pupphaka. Các đại từ trong Việt (“tôi”, “ta”, “ngài”, “ngươi”, “nó”) chỉ theo ngôi thứ nhất/thứ hai của Pāli (`mayaṁ`, `me`, `ahaṁ`, `tvaṁ`, `te`), không gán danh tính.
  2. `Sattigumba` giữ phiên âm: là tên con vẹt ở `6.2` (vocative), `19.1`. `Pupphaka`, tên của con vẹt thứ hai trong truyện, không có mặt trong bản Pāli đã ghim, nên không đưa vào thân kinh.
  3. `ogaṇo` (`1.4`): dịch “tách khỏi đoàn quân” (`o-` + `gaṇa`, “rời khỏi đoàn/nhóm”); cách đọc khác “một mình, vắng đoàn”, nghĩa gần như nhau; 0 tiền lệ.
  4. `Nisīthepi raho dāni` (`5.1`): dịch “Giờ đây vắng lặng kín đáo, như giữa đêm”, đọc `pi` như `viya` (“như”); cách đọc sát chữ là “ngay cả lúc nửa đêm”, nhưng hợp với bối cảnh buổi trưa (`4.1`) kém hơn. Chưa có chú giải để xác nhận. `majjhanhike sampatike` (`4.1`): dịch “Giữa trưa, lúc này vừa tới”.
  5. `patikolamba` (`7.1`): chưa xác định được nghĩa (có thể là lời mắng); 0 tiền lệ trên toàn tầng Pāli đã ghim, giữ nguyên phiên âm. `Mātari mayhaṁ naggāya, kiṁ nu tvaṁ vijigucchase` (`7.3`–`7.4`): dịch sát chữ; ý nghĩa của “mẹ ta trần truồng” chưa rõ nếu không có khung truyện.
  6. `Ko numeva gatā sabbe` (`10.1`): dịch “Tất cả đã đi đâu hết” (đọc `ko` như câu hỏi nơi chốn); cách đọc khác “Ai đã đi cả rồi”. `mutto tesaṁ adassanā` (`10.4`): “thoát đi vì họ không thấy”; `adassanā` có thể đọc là “vì không được họ nhìn thấy” hoặc “vì họ không có mặt để thấy”, nghĩa gần như nhau.
  7. `mā vo muñcittha jīvataṁ` (`11.4`, `17.2`): dịch “chớ để hắn thoát khỏi các ngươi khi còn sống”, đọc `muñcittha` là động từ phản thân (“thoát”) và `vo` là “khỏi các ngươi”; cách đọc khác “các ngươi chớ thả hắn còn sống”, nghĩa gần như nhau.
  8. `adhitiṭṭha` (`9.3`): dịch “xin hãy lên xe”; `adhiṭṭhāti` cũng có thể là “quyết ý”, nhưng ngữ cảnh (`9.1`–`9.2` đã thắng xe) hợp nghĩa “lên (xe)”. Chữ “xe” là suy từ ngữ cảnh.
  9. `Svāgataṁ te mahārāja, atho te adurāgataṁ` (`12.3`–`12.4`): dịch theo `ja494:5.1`–`5.2`, dùng lại nguyên văn. `Tato piva` (`14.3`): “xin hãy uống từ đó”.
  10. `uñchāya` (`15.1`): dịch “đi lượm nhặt”, giữ nghĩa “nhặt lượm” (thu nhặt thức ăn lẻ tẻ) mà không thêm “thức ăn”; `gaṇhavho` (`15.3`) là mệnh lệnh số nhiều nên dịch bằng “xin hãy tự … mà lấy”.
  11. `Bhāradha` (`21.4`): giữ phiên âm; có thể là dạng gọi của `Bhārata` (tầng Sujato dịch `bhāradhā` ở `dn19:36.16` là “Bhāratas”), cũng có thể là danh xưng khác của nhà vua; 0 tiền lệ trong tầng đã dịch.
  12. `tena dhammena no vinā` (`19.4`): dịch “vì lẽ ấy mà hai chúng tôi cách biệt”; `dhamma` có thể là “đường lối/bản tính/phẩm hạnh” và `vinā` là “cách biệt/khác nhau”; chọn “lẽ ấy” để không chọn một trong ba nghĩa.
  13. `Yaṁ yañhi rāja bhajati` (`22.1`): chủ ngữ của `bhajati` là ngôi thứ ba (“người ta”), đối tượng là người được thân cận; dịch “thân cận với bất cứ ai”, không gán chủ ngữ cụ thể. `visīla` (`22.3`): 0 tiền lệ trong tầng, dịch “người không có giới”.
  14. `Pūtimacchaṁ kusaggena`/`Tagarañca palāsena` (`25.1`, `26.1`): `kusagga` dịch “ngọn cỏ kusa”, `palāsa` dịch “lá” (đối chiếu `pattāpi` ở `26.3`); `tagara` giữ phiên âm (xem trên).

