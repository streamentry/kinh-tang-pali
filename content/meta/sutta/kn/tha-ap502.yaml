    tự đặt cách thứ N+1 để làm cho đẹp. Người biên tập có thể chọn một trong hai hướng, hoặc
    chấp nhận cả hai.
    *(Đo kèm: **cục bộ trong phẩm Hoa Kiṅkaṇi** thì đa số là *Ký Sự* **6/7** — chỉ
    `tha-ap501` dùng *Tuyên Ngợ* — nhưng n = 7 nhỏ hơn nhiều lần so với 333, nên tôi theo đa
    số toàn tầng theo đúng chỉ đạo.)*

  BẤT ĐỊNH.
    · `Migaluddo` (`1.1`) là tên núi; giữ PĦLI. 0 tiền lệ.
    · `viraja` (`1.3`) dịch *viên mãn không nhiễm bụi*; `pāragu` (`1.4`) dịch *vị đã vượt qua
      tất cả các pháp*. Bản nháp đầu viết *mọi pháp ấy* — sai, vì đó là cùng một Đức Phật.
    · `sukhumacoḷakhaṇḍa` không có trong bài này; `vasūpanītā` không có tiền lệ.
    · `11.3–11.4` `Satamekañca gāthānaṁ, navakañca taduttari` — `meka` không tra được nghĩa;
      tôi đọc như số đếm (*Tám bài kệ, chín bài kệ, rồi còn hơn nữa*) vì `14.3–14.4` đếm
      bằng số (*Bốn mươi hai bài kệ, và một nghìn bốn trăm bài*). Cùng chỗ bất định như `ne2`.
    · `buddhaseṭṭhassadāsahaṁ` (`2.2`) dịch *bậc tối thượng trong hàng tối thượng, đứng đầu
      hàng Sa-môn*; 0 tiền lệ cho cụm kép này.

