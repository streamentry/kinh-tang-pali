notes: |-
  Đã đọc HẾT vc/p74.txt trước khi viết.

  TIỀN LỆ ĐÃ ĐO.
    · `:0.1` `Therāpadāna` giữ PĦLI: **324/333** tệp `tha-ap` có khoá này (9 tệp dùng
      *Trưởng Lão Ký Sự*).
    · `:0.2` `Kiṅkaṇipupphavagga` → *Phẩm Hoa Kiṅkaṇi*: **6/6** (tha-ap494–499, cùng phẩm).
    · `:8.2` theo khuôn `tha-ap142:10.1` (`Sobhitavaggo cuddasamo.` → *Phẩm Sobhita là phẩm
      thứ mười.*) ⇒ *Phẩm Hoa Kiṅkaṇi là phẩm thứ năm mươi.*
    · `:9.1` `Tassuddānaṁ` → *Tóm tắt phẩm này:* 16/25; `:12.1` `Atha vagguddānaṁ` → *Và tóm
      lược các phẩm:* 3/3.
    · Tên trưởng lão trong uddāna (`10.1–11.2`) **giữ PĦLI**, vì tầng đã dùng dạng đó:
      Metteyya 10 lần, Koraṇḍa 9, Kiṅkaṇi 15, Ghatamaṇḍa 3, Sakiṁsammajjaka 3,
      Sālapupphiya 3, Bhaddāli 2, Jagatī 2.

  MỆNH ĐỀ `0.3` — ĐO LẠI, ĐÚNG BA CÁCH, TÔI THEO ĐA SỐ.
    Đếm trên 333 tệp `tha-ap` có khoá `0.3`: họ **Tuyên Ngợ 184**, **Ký Sự 84**,
    **Tuyên Ngôn 65**. Đa số toàn tầng ⇒ `0.3` dùng *Bài Kệ Tuyên Ngợ …*. Nhưng xem mục
    *XUNG ĐỘT NỘI TẠI* bên dưới.

  TRÙNG NGUYÊN VĂN — 5 khoá, tất cả với `tha-ap142` (cùng trưởng lão, cùng câu kệ).
    `:2.1` `Piyālaphalamādāya,` → *Cầm quả Piyāla lên,*; `:3.3` `Duggatiṁ nābhijānāmi,` →
    *Ta không biết mình rơi vào khổ đau,*; `:3.4` `phaladānassidaṁ phalaṁ.` → *đây là quả
    báo của việc dâng cúng trái cây.*; `:7.1` → *Tôi nghe như vầy: Tôn giả Trưởng lão Dâng
    Quả Piyāla đã nói những bài kệ này.*; `:8.1` → *Bài Kệ Tuyên Ngôn Về Trưởng Lão Dâng
    Quả Piyāla, thứ mười.* Cả 5 khoá dùng lại **nguyên văn** bản Việt đã có.
    Ngoài ra `4.1/4.3/5.1/5.3/6.1/6.3` là công thức lặp rất nhiều; tôi theo **đa số đo
    được** chứ không theo một tiền lệ đơn lẻ: `4.1` *Các phiền não của ta đã được thiêu
    rụi,* 65/98; `4.3` *ta sống không còn lậu hoặc.* 66/98; `5.1` *Thật lành thay sự đến của
    ta,* 63/95; `5.3` *đã làm tròn lời dạy của Đức Phật.* 73/95; `6.3` *đã làm tròn lời
    dạy của Đức Phật”.* 304/333; `6.1` *Bốn vô ngại giải,* 334/334. Vì các đa số này dùng
    **ta** chứ không phải **tôi**, tôi giữ *ta* xuyên suốt khuôn kệ (trừ `:7.1` và `:8.1` là
    người kể chuyện, nên *Tôi nghe như vầy* — không mâu thuẫn).

  XUNG ĐỘT NỘI TẠI — GHI RÕ, KHÔNG TỰ GIẢI QUYẾT.
    `:0.3` theo đa số toàn tầng là *Bài Kệ **Tuyên Ngợ***, nhưng `:8.1` bị **buộc** phải là
    *Bài Kệ **Tuyên Ngôn*** vì nó trùng nguyên văn `tha-ap142:9.1`. Kết quả là cùng một bài
    có hai hệ tên ở `0.3` và `8.1`. Tôi chọn theo hai luật mà coordinator đã nêu (đa số cho
    `0.3`, dùng lại nguyên văn khi trùng) và **ghi ra đây** để người điều phối gộp; không
    tự đặt cách thứ N+1 để làm cho đẹp. Người biên tập có thể chọn một trong hai hướng, hoặc
    chấp nhận cả hai.
    *(Đo kèm: **cục bộ trong phẩm Hoa Kiṅkaṇi** thì đa số là *Ký Sự* **6/7** — chỉ
    `tha-ap501` dùng *Tuyên Ngợ* — nhưng n = 7 nhỏ hơn nhiều lần so với 333, nên tôi theo đa
    số toàn tầng theo đúng chỉ đạo.)*

  BẤT ĐỊNH.
    · `Migaluddo` (`1.1`) là tên núi; giữ PĦLI. 0 tiền lệ.
    · `viraja` (`1.3`) dịch *viên mãn không nhiễm bụi*; `pāragu` (`1.4`) dịch *vị đã vượt qua
      tất cả các pháp*. Bản nháp đầu viết *mọi pháp ấy* — sai, vì đó là cùng một Đức Phật.
    · `sukhumacoḷakhaṇḍa` không có trong bài này; `vasūpanītā` không có tiền lệ.
    · `11.3–11.4` `Satamekañca gāthānaṁ, navakañca taduttari` — `meka` không tra được nghĩa;
      tôi đọc như số đếm (*Tám bài kệ, chín bài kệ, rồi còn hơn nữa*) vì `14.3–14.4` đếm
      bằng số (*Bốn mươi hai bài kệ, và một nghìn bốn trăm bài*). Cùng chỗ bất định như `ne2`.
    · `buddhaseṭṭhassadāsahaṁ` (`2.2`) dịch *bậc tối thượng trong hàng tối thượng, đứng đầu
      hàng Sa-môn*; 0 tiền lệ cho cụm kép này.

  DẤU LƯỢC. `4.2`, `5.2`, `6.2` là `…pe…` ⇒ mỗi khoá giữ **đúng một** `…`, không mở rộng.
  3/47 khoá.

  NHÁY KÉP. PĦLI 1 mở (`1.1`) / 1 đóng (`6.3`) ⇒ bản Việt y hệt.

