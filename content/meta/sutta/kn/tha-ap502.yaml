  TRÙNG NGUYÊN VĂN — 5 khoá, tất cả với `tha-ap142` (cùng trưởng lão, cùng câu kệ).
    `:2.1` `Piyālaphalamādāya,` → *Cầm quả Piyāla lên,*; `:3.3` `Duggatiṁ nābhijānāmi,` →
    *Ta không biết mình rơi vào khổ đau,*; `:3.4` `phaladānassidaṁ phalaṁ.` → *đây là quả
    báo của việc dâng cúng trái cây.*; `:7.1` → *Tôi nghe như vầy: Tôn giả Trưởng lão Dâng
    Quả Piyāla đã nói những bài kệ này.*; `:8.1` → *Bài Kệ Tuyên Ngôn Về Trưởng Lão Dâng
    Quả Piyāla, thứ mười.* Cả 5 khoá dùng lại **nguyên văn** bản Việt đã có.
    Ngoài ra `4.1/4.3/5.1/5.3/6.1/6.3` là công thức lặp rất nhiều; tôi theo **đa số đo
    được** chứ không theo một tiền lệ đơn lẻ: `4.1` *Các phiền não của ta đã được thiêu
    rụi,* 65/98; `4.3` *ta sống không còn lậu hoặc.* 66/98; `5.1` *Thật lành thay sự đến của
    ta,* 63/95; `5.3` *đã làm tròn lời dạy của Đức Phật.* 73/95; `6.3` *đã làm tròn lời
    dạy của Đức Phật”.* 304/333; `6.1` *Bốn vô ngại giải,* 334/334. Vì các đa số này dùng
    **ta** chứ không phải **tôi**, tôi giữ *ta* xuyên suốt khuôn kệ (trừ `:7.1` và `:8.1` là
    người kể chuyện, nên *Tôi nghe như vầy* — không mâu thuẫn).

  XUNG ĐỘT NỘI TẠI — GHI RÕ, KHÔNG TỰ GIẢI QUYẾT.
    `:0.3` theo đa số toàn tầng là *Bài Kệ **Tuyên Ngợ***, nhưng `:8.1` bị **buộc** phải là
