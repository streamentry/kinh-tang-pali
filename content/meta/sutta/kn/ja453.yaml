notes: |-
  **Đo lại ba mệnh đề của lát.** `0.1` → **Jātaka** (400/416). `0.2`
  `Dasakanipāta` → *Bộ Mười Bài Kệ* (0 tiền lệ thật — xem `notes` của `ja439`). `0.3`
  `Catudvāravagga` → *Phẩm Bốn Cửa* (0 tiền lệ thật).
  Kinh tên: `maṅgala` có tiền lệ trong tầng là *điềm lành* (`Yassa maṅgalā samūhatāse`
  → *Với người mà điềm lành đã bị xoá sạch*), còn `Sumaṅgalajātaka` giữ tên Pāli. Tôi
  chọn *Kinh Đại Điềm Lành* vì `Mahā-` + `maṅgala` đọc tự nhiên với người Việt và khớp
  nghĩa *điềm lành* đã có. `11.1` theo 383 cặp đã có; `pannarasamaṁ` → *thứ mười sáu*
  nối theo `ekādasamaṁ` → *thứ mười một*.

  **Không có khoá trùng nguyên văn nào với tệp ngoài lát** — đây là bài duy nhất trong 7
  bài mà tôi không dùng lại được câu nào. Có ba cụm lặp **nội bộ** và tôi giữ nguyên văn
  cho cả ba: `…sotthānaṁ tadāhu` ở `2.4`, `3.4`, `4.4`, `5.4`, `6.4`, `7.4`, `8.4`,
  `9.4`; `thì bảo đấy là điều lành` dùng chung một cách; và `9.1`–`9.4` chỉ khác `2.4`
  ở chữ *đời sống* thay cho *các loài*.

  **Câu tôi phải tự quyết — và đây là chỗ yếu nhất của lát, nên `ambiguity_integrity`
  hạ xuống 8.9.**
  - `1.3` `So macco asmiñca paramhi loke`: `macca` = *kẻ bị làm thí tế* (tiền lệ trong
    tầng: `macco` → *chết*, `rājāmacco` → *bị hành quyết*), nhưng `asmi` tôi **không xác
    định được** — có thể là *viên đá lăn* trong nghi lễ Vrat. Tôi dịch lỏng là *là bậc cao
    nhất trong cõi*, tức **bỏ** `asmi` thay vì bịa một nghĩa. Đây là chỗ mất nghĩa có
    chủ đích; người biên tập nên tra chú giải rồi sửa nếu có cách đúng hơn.
  - `3.1` `nivātavutti`: tôi dịch *bị cả thế giới tránh xa*. Cách đọc còn lại (*kẻ sống
    chống lại cả thế giới*) cho một bài kệ **khen** người tốt thì hợp hơn về mặt logic,
    nhưng `nivāta` nghĩa là *bị đuổi*, và `sabbalokassa nivātavutti` là danh từ, nên tôi
    giữ cách đọc theo nghĩa từ.
  - `7.3` `Advejjhatā suhadayaṁ mamanti`: tôi dịch *dù không bị vây khốn, vẫn lấy lòng
    tin của mọi người*; `mamanti` = *coi như*, nên nghĩa là *vẫn lấy lòng tin mà coi
    người ấy…*. Chủ ngữ thật của mệnh đề là người vua/bào dân, tôi giữ đó.

  **Dấu lược:** 0/45 khoá có `…pe…`.

  **Không có tầng Anh.** 0/45; `ja453` không nằm trong 83 tệp `ja` đã ghim.
