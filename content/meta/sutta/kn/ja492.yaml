  **technical_integrity = 9,6:** lát này cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 30 khoá chênh lệch lớn nhất → khác nghĩa 5: sửa 1 (`11.1`: "Trước kia chúng chạy mỗi nơi một ngả" → "Trước kia, vì ta, chúng chạy mỗi nơi một ngả", vì `imassudaṁ` = `imassa` (sở hữu cách "của người này", tức người đang nói ở `10.1`–`10.4`) + tiểu từ `udaṁ`, bản cũ bỏ mất `imassa`), giữ 1 (`7.4`: bản mù "kẻ độc thân" sai, `ekakaṁ` ở đây là "một mình"), bất định 3 (`1.4` `teme adhigatā`: `te` và `adhigatā` đều giống đực số nhiều, nên "những điều ấy" có thể là chính bà con ở `1.3`; `14.3`–`14.4` `byagghe kurute vase`: chủ ngữ của `kurute` không nêu, có thể là một trong ba chủ thể ở `14.1`–`14.2`; `6.1` `uddhaggarājī`: "hàng vằn dựng cao" là cách đọc sát chữ, bản mù cũng không chắc). 25 khoá còn lại chỉ khác diễn đạt. Review đối kháng toàn bài (85 cặp): nháy, số, xưng hô, thuật ngữ và 3 cặp Pāli trùng trong bài đều nhất quán, không có lỗi khác. Không có bản Anh hay bản Việt độc lập khác.

