notes: |-
  Đợt 19, làn 63. Dịch từ Pāli root commit đã ghim, đủ 85/85 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; vì vậy người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung kệ (xem bất định 1).

  **Tiêu đề.**
  - `0.2` “Bộ Tạp Tập” và `0.3` “Phẩm Ruộng Lúa”: dùng lại nguyên văn các bài cùng bộ, cùng phẩm (`ja484`, `ja486`, `ja487`, `ja490`, `ja491`...). Cả hai là khoá Pāli trùng nguyên văn.
  - `0.4` “9. Kinh Heo Taccha”: `Taccha` là tên con heo đầu đàn, giữ phiên âm (như `Nandiyamigarāja`, `Rurumigarāja` ở `ja385:0.4`, `ja482:0.4`) vì trong kệ nó được gọi trực tiếp là `taccha` (4.3, 6.3) và `tacchaka` (8.2, 20.3). `sūkara` → “heo” theo đa số (đo trên 33 khoá chứa `sūkar…`: “heo” 18, “lợn” 7; ví dụ `ja153:0.4` “Kinh Heo”); `ja283:0.4` dịch “Lợn Rừng”, giữ “heo” cho thống nhất bài này. Số `9.` ở `0.4` và `navamaṁ` ở `21.1` đều là 9 ⇒ “thứ chín” khớp (tiếp nối `ja491` là thứ tám). `21.1` “Kinh Heo Taccha, thứ chín.” theo khuôn `ja491:18.1`.

  **Tiền lệ dùng lại nguyên văn: 9 khoá Pāli trùng nguyên văn với tầng, dùng lại 6, lệch có chủ ý 3.**
  - Dùng lại nguyên văn (6): `0.2`, `0.3` (4+ bài cùng phẩm); `3.2` “cùng với toàn thể quyến thuộc bà con;” (6/7 nơi chứa `saha sabbehi ñātibhi`: `ja359:5.2`, `ja398:7.2`, `ja399:7.2`, `ja429:9.2`, `ja430:9.2`, `ja484:14.2`; chỉ `ja455:7.4` khác “cùng tất cả người thân”); `9.2` “Phải chăng ngươi đã ban sự không sợ hãi cho mọi loài,” (= `ja491:4.2`); `11.3` “nay chúng tụ họp lại, ở chung một chỗ,” (= `ja283:2.3`); `18.2` “dù là cây cối mọc trong rừng;” (= `ja74:1.2`). Ngoài ra `9.1` “Phải chăng hôm nay ngươi đã kiêng sát sinh?” theo `ja491:4.1` (Pāli `nusajja` ↔ `nu ajja`, cùng nghĩa).
  - Lệch có chủ ý (3), đều đã đo, không phải lệch vì muốn khác: (a) `3.3` `Appossukko nirāsaṅkī` → “không bận tâm, không lo ngại,”; `ja451:8.3` đã dịch “Không chán ghét, không oán hận,” nhưng `appossukko` ở 11 nơi còn lại của tầng được dịch theo nghĩa không bận tâm / không lo / an lòng (ví dụ `snp1.3:9.3`, `ja30:1.3`, `ja388:2.3`, `ja486:9.1`; không nơi nào là “chán ghét”) và `nirāsaṅkī` (`āsaṅkā` = e ngại, ngờ vực) không có nghĩa “oán hận”; xin người điều phối cân nhắc sửa `ja451:8.3` (không thuộc lát này, không đụng). (b) `7.3` `Sabbe samaggā hutvāna` → “tất cả chúng ta, sau khi đã hòa hợp,”: `snp2.6:8.1` dịch “thì tất cả hãy đoàn kết lại,” là mệnh lệnh mở đầu một vế điều kiện, còn ở đây `hutvāna` là phân từ đi với động từ tương lai `kāhāma` (7.4) nên không dùng được nguyên văn. (c) `1.2` `pabbatāni vanāni ca;` → “qua núi non và rừng rậm;”: `dhp188:2` “núi non và rừng rậm,” là tân ngữ của “quy y”, còn ở đây là nơi chốn đi qua, cần giới từ.
  - Cặp Pāli gần trùng nhưng không trùng byte, đã đọc: `11.1`–`11.4` với `ja283:2.1`–`2.4` (`Ime sudaṁ…`, `puthū`, `duppasahajjame`). Tôi tự dịch cho khớp văn cảnh bài này (ở đây hổ nói về bầy heo), không sao chép `ja283`.

  **Trùng nguyên văn trong chính bài:** 85 khoá, 3 nhóm Pāli trùng (sau khi nén khoảng trắng và hạ chữ hoa): `4.3` = `6.3` (“So taccha sūkare hanti,”), `4.4` = `6.4` (“idhāgantvā varaṁ varaṁ”.), `7.2` = `10.2` (“balaṁ kāye samohitaṁ;”). Bản Việt của cả 3 nhóm giống hệt nhau (0 lệch). Hai nhóm đầu là cùng một lời báo tin được nhắc lại nguyên văn ở 6.3–6.4 để trả lời câu hỏi ở 5, nên giữ giống hệt là đúng.

  **Số Pāli:** không có số lượng cần tính. Số `9.` ở `0.4` và `navamaṁ` ở `21.1` đều bằng 9. Các từ `eka` ở 13.1–13.3 (`Ekova`) = “chỉ một mình”, không phải số đếm; `sambahulā` (18.1) = “đông đảo”, không phải số xác định.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `ñāti` → “bà con”: đo trên 58 khoá chứa `ñāti` (một khoá có thể chứa hơn một từ): “bà con” 20 · “quyến thuộc” 12 · “người thân” 9 · “thân quyến” 7 · “thân nhân” 6 · “họ hàng” 5 · “thân tộc” 2. Chọn “bà con” cho mọi `ñātī` ở bài này (1.3, 5.2, 10.3, 14.3, 18.1), riêng `3.2` giữ nguyên văn “quyến thuộc bà con” theo cụm cố định.
  - `byaggha` → “hổ”: đo trên 29 khoá chứa `byagg…`, “hổ” 16 · “cọp” 10.
  - `dāṭhā`, `dāṭhī` → “nanh”, “con có nanh”: tầng có 24 khoá chứa `dāṭh…`, “nanh” 7 · “răng” 4 · “ngà” 2; “nanh” cùng cách với `ja490:4.2` (`dāṭhāvudho` → “lấy nanh làm vũ khí”). `dāṭhī dāṭhīsu` (17.3) → “con thú có nanh xông vào những con có nanh”.
  - `leṇa` (4.1, 11.2) → “nơi trú ẩn”: cùng cách với `ja388:2.1` và `ja466:2.4` (“nơi trú ẩn”); `ja283:2.2` dịch “hang đất”, `tha-ap391` “hang động” cho `leṇa` nghĩa hang đá cúng dường. Đây là chỗ heo tìm chốn nương thân nên chọn “nơi trú ẩn”.
  - `seno` (13.2, 16.3) → “chim ưng”: tầng chỉ có 2 khoá `seno` / `sena` (`ja168:1.1` dịch khác hẳn, `snp1.7:20.3` là `sena` “kẻ thấp kém”, không cùng từ), nên đây gần như không có tiền lệ; chọn “chim ưng” theo nghĩa Pāli (diều hâu/ưng).
  - `jaṭila` (17.1) → “đạo sĩ”: 26/43 khoá chứa `jaṭil…` dùng “đạo sĩ”. `brāhmaṇa` (19.1) → “bà-la-môn”; hiểu là cùng một nhân vật (`jaṭilena` ở 17.1 và `Brāhmaṇañceva` ở 19.1; chỉ có hai kẻ bị heo giết ở 19.1–19.2 là bà-la-môn và hổ, 19.2 `ubho`), giữ hai danh xưng đúng như Pāli, không tự đồng nhất thành một.
  - `udumbara` (20.1) → “cây sung”: 12/13 khoá chứa `udumbar…` dùng “sung” (ví dụ `ja298:0.4` “Kinh Cây Sung”).
  - `asura` (13.1) → “a-tu-la”: 31 khoá chứa `asur…`, 24 khoá có “a-tu-la” (ví dụ `snp2.7:28.2`, `ja31:1.3`). `indo` đứng riêng (13.1, 14.1) → “Đế Thích”: 4 khoá có `Indo` đứng riêng, “Đế Thích” 2 (`snp2.7:28.2`, `ja347:2.3`), “Indra” 1 (`thag12.2:9.3`), 1 khoá dịch khác (`snp5.1:49.2`); chọn “Đế Thích” theo đa số, vì ở 13.1 Indo thắng a-tu-la đúng như tích Đế Thích. Xin người điều phối quyết một lần nếu muốn thống nhất “Indra”.
  - `kapaṇa` (9.4) → “kẻ khốn khổ”: 11/35 khoá dùng “khốn khổ”; `jhāyati` đi với `kapaṇo viya` ở `snp4.7:5.2` dịch “ủ ê”, nên `kapaṇova jhāyasi` → “ngồi ủ ê như kẻ khốn khổ”; `jhāyāmi` (10.4) → “ngồi ủ ê”, cùng nghĩa trầm tư buồn bã (không phải thiền định).
  - `migarājā` / `migādhipo` (6.1, 14.2) → “chúa loài thú”: đo 29 khoá, “chúa” 13 · “vua” 10.
  - `sāmaggī` / `samagga` → “hòa hợp”: 24 khoá chứa `samagg…` dùng “hòa hợp” (`iti19`, `ja453:6.1`, `ja486:17.4`); riêng `snp2.6:8.1` “đoàn kết” (xem trên).
  - `varaṁ varaṁ` (4.4, 6.4, 13.4) → “hết con tốt nhất lại đến con tốt nhất”: cùng ý với `ja283:1.1` “giết từng kẻ tốt đẹp nhất”.
  - `kapaṇa`, `jhāyati`, `leṇa`, `dāṭhā` không có trong `content/glossary/pali-vi.yaml` ở mức đã đo; không đụng glossary.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: 85/85 khoá khớp số lượng cả `“`, `”`, `‘`, `’`, `"` (0 lệch). Pāli có 25 cặp nháy kép (1.1/3.4, 4.1/4.4, 5.1/5.4, 6.1/6.4, 7.1/7.4, 8.1/8.4, 9.1/9.4, 10.1/12.4, 13.1/13.4, 14.1/14.4, 15.1/16.4, 17.1/17.4, 18.1/18.4, 20.4); nháy đơn: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (phép so “…pe…” chạy rỗng vì Pāli không có lược). Tính toàn vẹn NFC: 85/85 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa, chữ số chỉ có ở `0.4` (“9.”).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ nội dung kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1–3: Taccha (heo đầu đàn) nói với bà con; 4 và 6: bầy heo (4: báo có kẻ thù; 6: trả lời về hổ); 5: Taccha hỏi; 7: Taccha; 8: bầy heo; 9: Taccha nói với hổ; 10–12: hổ; 13: đạo sĩ (suy từ 17.1 `jaṭilena`, không nêu tên trong kệ 13); 14–16: hổ đáp đạo sĩ; 17–18: người kể/chư thiên (không xác định được; có thể là thần cây, vì 18.2 nói về cây cối); 19–20: người kể. Tất cả là suy luận từ nội dung, không ghi vào thân kinh.
  2. `Yadesamānā vicarimha` (1.1): đọc là “điều chúng ta đã tìm kiếm khi lang thang (qua núi non và rừng rậm)”, với `teme` = `te ime` “những điều ấy” (1.4). Cách đọc khác: `yad` là quan hệ từ chỉ nơi chốn (“nơi chúng ta đã tìm...”). Cả hai đều cho cùng ý (đã tìm được chỗ ở).
  3. `Uddhaggarājī` (6.1): hiểu `rājī` là hàng vằn/vệt, `uddhagga` là dựng lên, nên “hàng vằn dựng cao”; không có tiền lệ trong tầng (0 khoá). Cũng có thể chỉ bờm/lông dựng trên lưng. Không bàn thêm được từ tầng này.
  4. `Kumbhīlakā sakuṇakā` (15.1): `kumbhīlaka` thường là “cá sấu” nhưng ở đây đi với `uppatanti ḍayanti ca` (bay lên và bay) nên hiểu là một loài chim, giữ phiên âm “chim kumbhīlaka”; tầng có 0 khoá chứa `kumbhīlak…` nên không phân xử được từ tiền lệ.
  5. `Veyyagghiyeva sā gati` (16.4): dịch “số phận ấy chính là số phận của hổ”, hiểu `veyyagghiya` là thuộc về hổ (con hổ lẻ loi bị tách khỏi đàn gặp số phận như chim lẻ bầy bị ưng đánh). Cách đọc khác: số phận ấy “thuộc về hổ” theo nghĩa nó cũng là điều xảy ra với hổ; cùng ý nên không đổi bản dịch.
  6. `na byagghe kurute vase` (14.4): `byagghe` có thể là dạng chủ cách số ít kiểu Māgadhī (“con hổ không khiến họ lệ thuộc”) hoặc đối cách/vị cách số nhiều (“không khiến họ vào quyền của loài hổ”). Bản Việt chọn cách trung tính, “không khiến họ rơi vào quyền của loài hổ”, đúng cho cả hai.
  7. `luddena` (17.2): `luddha` có thể là “tham lam” hoặc “tàn bạo/hung ác”. Lượt cải thiện 2026-10-11 đổi sang “tàn bạo” theo tiền lệ (xem mục Lượt cải thiện); bất định về nghĩa vẫn còn, vì `āmisacakkhu` (mắt hướng về miếng thịt/mồi) cũng gợi lòng tham. `āmisa` có thể là thịt hoặc mồi nhử; chọn “miếng thịt”.
  8. `tasmā nesaṁ na patthaye` (12.4): `patthayati` = mong cầu, ao ước; dịch “không mong cầu chúng” (hổ không ham muốn tấn công chúng). Có thể hiểu hẹp hơn là “không nhắm đến chúng”; cùng hướng nghĩa.
  9. `Ekāyane` (18.4): hiểu là con đường chỉ đủ cho một lối đi (“lối độc đạo”); không có tiền lệ trong tầng (0 khoá). Cách đọc khác: “trong một lần/cùng một chỗ”.
  10. `saṅghapatto` (9.4, 13.3): hiểu là “đã đến giữa bầy/đàn”; ở 9.4 là bầy heo, ở 13.3 là bầy thú nói chung.

  **Coverage English (mục 7):** mẫu số = 0. Đo mọi khoá không phải khối `:0` (81 khoá), dài nhất sau khi nén khoảng trắng là 35 ký tự (< 40) nên 0/81 khoá có nội dung theo ngưỡng của `source/layers.yaml`; 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja492`; `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Tôi không đụng `content/meta/reference-gaps.yaml`.

  **Lượt cải thiện 2026-10-11.** Đọc đối kháng lại 85 khoá cặp Pāli↔Việt, đo lại tiền lệ trên toàn tầng (so mọi khoá Pāli của bài với toàn bộ Pāli đã ghim, kết quả 14 cặp trùng nguyên văn; bản trước chỉ ghi 9 và bỏ sót `2.1`, `2.2` trùng `ja547:552.1–2` đã dịch giống hệt, `19.3` trùng `ja547:558.3` giống hệt, và `17.2` trùng `ja519:12.2` mà bản Việt khác). Đã đổi 3/85 khoá:
  - `2.3` `Rammā cimā girīnajjo`: “những ngọn núi và dòng sông này thật đẹp” → “những dòng sông núi này thật đẹp”. Sửa chính xác (accuracy fix): `girīnajjo` là hợp từ `giri` + `najjo` (sông núi), và `rammā`, `imā` đều giống cái số nhiều, hợp với `najjo`, không hợp với `giri` giống đực; cách tách “núi và sông” bản trước vô tình đặt núi vào cùng cụm với tính từ giống cái. Cùng cách với `thag4.11:4.3` (`girinadīhi` → “dòng sông núi”); `pabbatāni` ở `1.2` đã nói “núi non” rồi nên không lặp ý. Điểm: `grammar_logic` 8.7 → 8.9.
  - `17.2` `luddenāmisacakkhunā`: “kẻ tham lam, chỉ để mắt đến miếng thịt” → “bởi kẻ tàn bạo, chỉ để mắt đến miếng thịt”. Hai sửa: (a) `luddena` và `āmisacakkhunā` là cách công cụ, cùng chỉ với `jaṭilena` ở `17.1` (người xúi giục là đạo sĩ), nên thêm “bởi” để câu không bị đọc thành đang mô tả con hổ; (b) Pāli trùng nguyên văn `ja519:12.2` đã dịch “kẻ tàn bạo, chỉ để mắt đến miếng thịt”; trong tầng, `luddha` làm tính từ chỉ người/vật hung dữ được dịch “tàn bạo/hung bạo/tàn nhẫn/hung dữ” ở `ja308:2.2`, `ja405:6.2`, `ja446:3.2`, `ja446:8.4`, `ja547:485.3`, `cp22:13.2` (6 khoá) so với “tham lam” ở `ja206:1.4`, `ja399:7.1` (hai khoá này là `luddaka`, nghĩa thợ săn), và `cp20:4.2` (“dữ dằn, tham lam”). Đây là thống nhất theo tiền lệ, không phải phân xử nghĩa: bất định `luddha` = tham/tàn bạo vẫn còn (xem bất định 7). Điểm: `terminology` 8.9 → 9.0.
  - `16.3` `Tañca seno nitāḷeti`: “con chim ưng liền đánh nó” → “con chim ưng đánh nó”. Bỏ “liền”, vì Pāli chỉ có `ca` nối câu, không có ý “lập tức”; không thêm sắc thái thời gian (không đổi điểm riêng).
  - Không đổi, dù đã nghi ngờ: `14.3`–`14.4` (“bà con đã hòa hợp, đã tụ hội, thì không khiến họ rơi vào quyền của loài hổ”): `ñātī` là đối cách, chủ thể phải là Đế Thích / chim ưng / hổ ở `14.1`–`14.2`, và bản Việt đang đặt “bà con” làm đề trước rồi dùng “họ” nhắc lại; câu hơi gượng nhưng không sai nghĩa, và cách viết lại nào cũng phải thêm chủ ngữ mà Pāli không nêu rõ (xem bất định 6), nên giữ. `1.4` (`teme` là “những điều ấy” hay “những người ấy”, tức bà con ở `1.3`): giữ, xem bất định 2.
  - Thêm bất định mới: `Taccha` / `Tacchaka` có thể không chỉ là tên riêng mà là tên gọi theo nghề (`tacchaka` cũng nghĩa là thợ mộc); bài song song `ja283` mang tiêu đề `Vaḍḍhakīsūkara` (“Lợn Rừng Thợ Mộc”). Tầng không có căn cứ để phân xử, nên giữ phiên âm “Taccha” như tên riêng ở `0.4`, `4.3`, `6.3` và “Tacchaka” (hô cách) ở `8.2`, `20.3`.
  - Các điểm còn lại không đổi: `triangulation` 7,0 (không có bản Anh độc lập; cải thiện lượt này chỉ đối chiếu với tiền lệ nội bộ nên không nâng), `semantic_fidelity` 8,9, `ambiguity_integrity` 9,0 (bất định 7 vẫn còn, thêm bất định Taccha). `final_score` 8,97 → 9,0 (trung bình số học thô 90,0/10; không lớn hơn 9,0, nên không đủ điều kiện `published`).
