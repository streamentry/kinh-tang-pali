notes: |-
  SAU KHI DÙNG LẠI NGUYÊN VĂN JA274. Sáu vế 2.3, 2.4, 3.1, 3.2, 3.3, 3.4 trùng byte-for-byte với ja274 (Lola-jātaka, cùng truyện) nên tôi dùng lại nguyên văn Việt đã có. Tôi phải ghi rõ: bản Việt ở ja274 lỏng hơn cách tôi vẫn dịch — 3.3 Na hi mānusakā bhogā được dịch thành Phúc lạc của loài người (bhogā ở ngữ cảnh chia đồ ăn nên nghĩa phù hợp hơn là phần ăn), và 3.4 subhuñjā honti pakkhinā thành chẳng phải thứ chim cốm dễ tiêu hóa, tức subhuñjā được hiểu theo nghĩa xứng đáng thay vì nghĩa thành phẫu quy. Luật Pāli trùng thì cách dịch phải khớp, nên tôi giữ nguyên văn ja274 và giao cho người biên tập xét lại cả hai bài cùng lúc — nếu sửa thì sửa ja274 trước rồi mới lan sang ja275.

  BẤT ĐỊNH CHƯA PHÂN XỬ TRỌN VẸN, ĐÃ GHI LẠI. (1) kulāvaka ở 1.4: BRIEF_VI3 §11 đã chốt Kulāvakavagga = Phẩm Tổ Chim, nên tôi dịch là con tổ chim, dù từ điển gloss kulāvaka là một loài chim nhỏ và bối cảnh câu chuyện là gà mái với quạ; tôi chọn giữ đúng chữ đã chốt của tầng thay vì tự tạo cách thứ N+1. (2) Rucirā ở 1.1: từ này vừa là tính từ (rực rỡ) vừa có thể là tên riêng của nhân vật tiền kiếp; vì tiêu đề là Rucirajātaka và các bài cùng phẩm đặt tên nhân vật theo thế (Komāraputta, Jambukhādaka), tôi dịch là cô nương Rucirā. (3) lūnosmi ở 2.4: dùng nguyên văn ja274 là xấu hổ vậy, tức ta đến thiếu phần; lời giải thích thuộc chỗ này chứ không đưa vào thân kinh.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt của kiểm cổ chỉ quét khoá Pāli từ 40 ký tự trở lên; ở bảy bài Jātaka của lát này mọi vế kệ đều ngắn hơn ngưỡng đó (vế dài nhất 35 ký tự) nên assertion về bản chất KHÔNG chạy. Tôi tự quét lại TOÀN BỘ 238 khoá của 14 bài từ tệp đã ghi trên đĩa: đủ khoá và không thừa so với Pāli (sắp theo thứ tự số), không rỗng, chuỗi NFC, số dấu lược khớp từng khoá, không có (…), không thừa dấu lược, và số dấu nháy kép so với Pāli từng khoá. Kết quả: 0 lỗi trên 238 khoá.

  DẤU LƯỢC §10. Không khoá nào trong 238 khoá của lát này chứa …pe… hay dấu lược — đã kiểm bằng script trên từng khoá. Vì vậy cả 238 bản Việt đều có 0 dấu lược, khớp Pāli. Không mở rộng, không nén, không có (…) đứng một mình.

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Tôi tự dựng chỉ mục Pāli↔Việt bằng script: nạp 5.764 tệp Pāli trong .cache/upstream/suttacentral/root/pli (bỏ *.apfs-orphan) và 4.136 tệp Việt dự án trong content/translation/vi/project/sutta — tổng 112.947 khoá Việt — ghép theo khoá, rồi quét từng khoá thân bài của lát theo nguyên văn căn thẳng và theo dạng đã chuẩn hoá dấu câu, nháy kép, hoa thường, và loại bỏ chính 14 tệp của lát để đo đúng trạng thái trước khi tôi ghi. Kết quả: 44 cặp Pāli trùng ở thân bài, 42 trùng byte-for-byte và 2 trùng sau chuẩn hoá. Trong đó 33 cặp đã có bản Việt ở bài khác, tôi DÙNG LẠI NGUYÊN VĂN ở: ja275 2.3, 2.4, 3.1, 3.2, 3.3, 3.4 ← ja274; ja294 3.1 ← sn1.1; mil3.1.11 3.2 và 3.3 ← sn10.12:5.2 và 5.3 (tôi lấy cả bộ bốn vế ở sn10.12:5.1–5.4 để bài này không tự mâu thuẫn với bài nguồn); Opammaṁ karohī ở mil3.1.11:2.1, mil3.1.14:2.1, mil3.1.15:2.1, mil3.2.2:2.1, mil3.5.10:2.1, mil3.7.16:2.1; mil3.1.14 3.1 ← mil3.1.12:3.1 và 3.5 ← mil3.1.12:3.4; Kallosi ở mil3.1.11:4.1, mil3.1.14:4.1, mil3.1.15:3.1, mil3.2.2:3.1, mil3.2.9:2.1, mil3.5.10:3.1 ← 54 tệp mil khác; mil3.2.2 2.4 ← mil3.5.9:2.3; mil3.5.10 6.1 ← mil3.4.10:5.1 và mil6.2.10:5.1; mil3.7.16 5.1 ← mil3.1.16:6.1. Mười một cặp còn lại thì chưa bản Việt nào ở bài khác có, tôi phải đặt mới: ja294 2.1 và 2.2, ja295 2.1 và 2.2 (bốn khoá này là hai cặp trùng nhau — chính bài trong lát đã trùng nhau; tôi đặt một lần rồi dùng lại nguyên văn cho cả hai bài), ja295 1.3 và 1.4 (trùng ja308:1.3 và 1.4), ja297 1.2 (trùng ja429:6.2 và ja430:6.2), ja298 1.2 (trùng sáu chỗ trong ja547), mil3.1.11 1.3 và 2.4 (trùng nhau, chỉ khác ở dấu nháy) và mil3.2.9 5.1 (trùng mil6.1.9:12.1). Ghi lại đây để lát sau dùng lại nguyên văn của tôi thay vì dịch lần hai.

  MỌI CÔNG THỨC HỘI THOẠI ĐÃ CÓ TIỀN LỆ, TÔI THEO NGUYÊN VĂN. Rājā āha— → Vua nói: (đếm trong tầng mil có 30 tệp dùng Vua nói: và 12 tệp dùng Vua nói—, tôi theo đa số; 11 tệp còn lại dùng Vua nói:—). Thero āha— → Trưởng lão nói: (3 tệp dùng dạng có dấu hai chấm và 3 tệp dùng dạng có gạch nối, hòa nhau; tôi chọn dạng có dấu hai chấm để nhất quán với Vua nói: trong chính lát này). Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā. (54 tệp mil, chỉ một cách). Opammaṁ karohī → Xin hãy xét một thí dụ ti. (đúng mil3.1.12:2.1, mil3.2.7:2.1, mil3.2.8:2.1). Bhiyyo opammaṁ karohī → Xin hãy xét một thí dụ nữa ti. (đúng mil3.1.12:3.1). Bhāsitampetaṁ, mahārāja, bhagavatā— → Điều này, này Đại vương, Đức Thế Tôn đã nói — (đúng mil3.1.12:3.4). Imasmiṁ vagge dasa pañhā và Imasmiṁ vagge soḷasa pañhā → Trong phẩm này có … câu hỏi. (đúng mil3.4.10:5.1, mil6.2.10:5.1, mil3.1.16:6.1). Rājā → vua, Mahārāja → Đại vương, bhagavā/bhagavatā → Đức Thế Tôn hoặc Đức Thật Chứng Ấy, Thero → Trưởng lão, Kāma → tình dục, sīla → đức hạnh.

  TÊN PHẨM ĐÃ CHỐT. Tikanipāta → Bộ Ba Bài Kinh (bốn bài lân cận đã có: ja276, ja291, ja292, ja293). Udapānavagga → Phẩm Nước Uống (đúng ja276 và ja279; tôi tự đếm bằng script trên Pāli gốc: 10 bài mang tên phẩm này là ja271..ja280, và ja275 nằm trong đúng khoảng đó). Kumbhavagga → Phẩm Bình Vò: tên này CHƯA có trong bảng chốt của BRIEF_VI3 §11, nên tôi theo đa số trong chính phẩm đang làm — ba bài đã có (ja291, ja292, ja293) đều dùng Phẩm Bình Vò; tôi tự đếm Kumbhavagga chiếm đúng ja291..ja300, trong đó lát này có sáu bài. Người biên tập nếu muốn chốt khác thì phải sửa cả mười bài cùng lúc. Các tên phẩm Milindapañha cũng theo đúng bầy bài lân cận: Mahāvagga → Đại Phẩm, Addhānavagga → Phẩm Khoảng Thời Gian, Buddhavagga → Phẩm Đức Phật, Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc.

  STATUS. Hai blocking error ở trên là thật và đo được (thiếu hẳn tầng Anh Sujato tại commit đã ghim; coverage dưới ngưỡng chưa được ghi nhận trong reference-gaps.yaml), nên mọi bài lát này đặt draft bất kể final_score. Tôi không nâng điểm để né blocker và cũng không hạ điểm để tỏ ra thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có tầng tham khảo nào.

  Giải quyết draft 2026-10-12. Thay thế các mục cũ nói về cách đọc 1.1, 1.4, 2.2, 2.4, 3.1–3.4 và về việc dùng lại nguyên văn ja274 (các mục ấy dựa trên bản dịch sai nên không còn đúng). Đọc đối kháng từ Pāli, có đối chiếu cặp Pāli trùng ở ja274 và ja375 (cùng đoạn kệ, cùng truyện con quạ bị vặt lông). 14 trên 17 khoá được sửa lại: 12 trên 12 khoá thân kệ (1.1–3.4) có lỗi nghĩa thật, cộng hai khoá tiêu đề và kết (0.4, 4.1) đổi tên theo. Lỗi nghĩa thật, chia loại: (1) balākā là con cò, không phải cô nương; kāyaṁ là kā ayaṁ (con ... này là ai), không phải thân; rucirā là tính từ xinh đẹp đứng với balākā, không phải tên riêng Rucirā. (2) kākanīḷasmiṁ là trong tổ quạ, bị bỏ mất ở bản cũ; kulāvaka là cái tổ (đúng như ja31:1.1 tổ chim), không phải con tổ chim và cũng không phải một loài chim; yassa cetaṁ kulāvakaṁ là mệnh đề quan hệ tổ này là của nó. Chữ Nhưng ở 1.3 là thêm nghĩa nên bỏ. (3) 2.2 dija sāmākabhojana là lời gọi hỡi loài chim ăn kê, không phải ta sinh cùng loài gà mái, ăn cùng thức ăn của gà mái (bản cũ bịa hẳn một ý không có trong Pāli); sāmāka dịch kê, khớp mnd15:69.1, ja496:11.3. (4) 2.3–2.4 akatvā vacanaṁ tuyhaṁ là vì không làm theo lời bạn (không phải chưa nghe lời); lūnosmi là bị cắt, vặt lông, không phải xấu hổ: đối chiếu ja375:3.3 vilūnaṁ sūdaputtena (bị con trai người đầu bếp vặt lông, rồi bôi bột nhão) cho thấy đúng cảnh quạ bị vặt lông trông như con cò. (5) 3.1–3.2 sīla ở đây là tính nết, không phải giới hạnh; pāpajjasī là pa-āpajjasī (lại sa vào cảnh ấy), không phải pāpa là điều ác nên cụm sa ngã vào điều ác bị bỏ. (6) 3.3–3.4 subhuñjā là dễ hưởng dùng (su- + bhuñja), không phải xứng đáng hay thứ chim cốm dễ tiêu hóa (chim cốm không có trong Pāli); pakkhinā là loài chim; bhogā dịch thứ hưởng dùng.

  Người nói (suy từ cấu trúc ba vế và đối chiếu ja375, không đưa vào thân kinh): khổ 1 là con bồ câu (Bồ-tát) trêu con quạ bị vặt lông, bôi bột trắng, ngồi trong tổ của chính nó trông như con cò; khổ 2 là con quạ; khổ 3 là con bồ câu. Tiêu đề: Rucira là tính từ xinh đẹp (cùng gốc với rucirā ở 1.1), không phải tên người; đổi Kinh Rucirā thành Kinh Xinh Đẹp, theo hướng Kinh Kẻ Tham Lam ở ja274. Tên phẩm Phẩm Nước Uống giữ theo 8 bài cùng phẩm (ja271–ja279); ja280 đang dùng Phẩm Giếng Nước, cần người biên tập thống nhất.

  Blocker đã gỡ: coverage Anh 0 trên 0 khoá Pāli có nội dung (mọi vế kệ dưới 40 ký tự, nên cổng không đo được gì, và tầng Anh Sujato không có tệp nào cho bài này). Đây là giới hạn của tầng tham khảo do tác giả cũ tự đặt thành blocker, không phải lỗi văn bản; 17 khoá của bài đều đã đọc kỹ từ Pāli, bài chỉ có 12 khoá thân kệ, rất ngắn, nên Pāli tự đứng vững. Tầng Việt hiện hành cũng không có (chỉ có Pháp Cú). Blocker giữ: thiếu hẳn bản Anh Sujato tại commit đã ghim (sự thật của upstream; waiver no-upstream-english của người biên tập xử lý). triangulation đặt 6.5, không cao hơn 8.0.

  Bất định còn lại. (a) Thì của āpajjasī ở 3.1 (hiện tại hay quá khứ) chưa phân xử chắc; bản Việt dùng lại ... lại sa vào cảnh ấy nữa để không khẳng định thì. (b) Cụm sa vào cảnh ấy giả định đối tượng của āpajjasī là cảnh bị vặt lông vừa nêu ở 2.4; Pāli không nêu rõ tân ngữ. (c) Người nói từng khổ chỉ suy từ cấu trúc và ja375. Hai bài trùng kệ là ja274 (1.1–1.4, 2.1–2.2, 3.1–3.4) và ja375 (2.1–2.4, 6.1–6.4) hiện còn mang cách dịch sai cũ (chim ưng, cô nương, sa ngã vào điều ác, chim cốm); ngoài phạm vi bài này, cần sửa cùng đợt để các bản Việt của những cặp Pāli trùng khớp nhau. technical_integrity vẫn 9.6; bốn lệnh npm run validate, npm test, npm run check và npm run build chưa chạy trong lần này.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 4 khoá chênh lệch lớn nhất (`0.3`, `0.4`, `2.4`, `4.1`) → khác nghĩa 1: sửa 0, giữ 1 (`2.4` `lūnosmi`: bản mù đọc *bị cắt xén*, bản dự án *bị vặt lông*; `lūna` là *bị cắt/tỉa*, nghĩa *vặt lông* là cách đọc theo ngữ cảnh đã phân xử ở lượt 2026-10-12 bằng Pāli trùng ở bài song song, nên giữ), bất định 0 mới; ba khoá còn lại (`0.3`, `0.4`, `4.1`) chỉ khác quy ước đặt tên (bản mù giữ nguyên Pāli *Rucira*, *Udapāna*, bản dự án dịch *Xinh Đẹp*, *Giếng Nước*), giữ. Mười ba khoá thân kệ còn lại giữa hai bản gần như trùng nghĩa, nên các cách đọc đã sửa ở lượt 2026-10-12 (*con cò*, *tổ quạ*, *loài chim ăn kê*, *tính nết*, *lại sa vào cảnh ấy*) được một bản dịch độc lập khác xác nhận. Review đối kháng toàn bài không tìm thêm lỗi thật. Không có bản Anh hay bản Việt độc lập khác.
