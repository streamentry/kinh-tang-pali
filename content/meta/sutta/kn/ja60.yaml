notes: |-
  TẦNG THAM KHẢO. Bản Anh Sujato tại commit đã ghim: có tệp
  `ja60_translation-en-sujato.json`, còn trong cache, và
  `source/upstream-manifest.json` (commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`)
  xác nhận nó nằm trong `editions` với `layerId=english-sujato`. Bốn khoá `0.1–0.4`
  có Anh đối chiếu trực tiếp; **11 khoá `1.1–4.4` Sujato để trống**. Tầng Việt hiện
  hành: **không có** — tầng `vietnamese-current` tại commit đã ghim chỉ có 26 tệp,
  toàn bộ dưới `kn/dhp/`, tra `ja60` trong cây git ra 0 tệp. Chi tiết đo đạc và hệ quả
  về `triangulation` ghi ở `ja40.yaml`; đây là đặc điểm bản chụp upstream, không
  phải thiếu sót của repo. `technical_integrity` 9.6 vì đợt này cấm chạy cổng:
  `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  CÔNG THỨC SONG SONG ĐÃ CÓ TIỀN LỆ VIỆT — BẢO TOÀN KHUNG CÂU. `ja60:1.1` và `1.2`
  trùng nguyên văn `ja59:1.1` và `ja59:1.2` (đã kiểm bằng chỉ mục Pāli ký Việt):
  cùng mở đầu `"Dhame dhame nātidhame, / atidhantañhi pāpakaṁ;`.
  `ja59` (Bherivādakajātaka, kẻ đánh trống) đã có trong tầng và dịch:
  "Hãy đánh, hãy đánh, nhưng đừng đánh quá;" rồi "đánh quá là điều xấu;".
  Vì `ja60` là **Saṅkhadhamajātaka** (kẻ thổi kèn) nên động từ phải là *thổi*, không
  phải *đánh*; nhưng **khung câu phải khớp**, và nó khớp: "Hãy thổi, hãy thổi, nhưng
  đừng thổi quá," rồi "thổi quá là điều xấu;". Hai bài lệch nhau **đúng một từ**,
  và sự lệch ấy là nghĩa, không phải tùy tiện: cùng một công thức Pāli, hai nghĩa
  động từ khác nhau theo ngữ cảnh. Tiền lệ `ja59:2.1` là "Kinh Người Đánh Trống
  thứ chín." — không dấu phẩy, khớp đa số 96 so với 33.

  VỀ `te tāto vidhamī dhaman` (`1.4`) — CÓ BẤT ĐỊNH, ĐÃ GHI, KHÔNG BỎ. `te` là tân ngữ
  số nhiều ("chúng", chỉ của cải ở vế trước); `tāto` là "cha ngươi" (Sujato dịch
  "your blowing dad"), `vidhamī` là "làm tan tành", `dhaman` là "đã thổi". Tôi theo
  Sujato ở chỗ xác định chủ ngữ là "cha", vì đó là cách đọc duy nhất làm câu đứng
  vững; đây là chỗ cần người đọc Pāli kiểm lại cùng bài, nên `ambiguity_integrity`
  hạ xuống 9.1. Đã giữ cả tân ngữ `te` bằng "chúng" — bản nháp trên đĩa lúc tôi bắt
  đầu rút gọn thành "nó" (số ít), làm lệch số.

  ỨD NGHĨA `4.1–4.4` — KHÔNG MỞ MÃ HOÁ, CỐ Ý. `Yathā icchiṁ tathāhudakā thalā` …
  là uddāna Āsīsavagga: danh sách tên-mangala của mười bài trong phẩm, không phải mười
  tên bài kinh. Bản chụp không có lớp chú giải nào giải thích, nên tôi giữ danh sách
  Pāli kèm dấu và chỉ dịch từ nối (`ca` thành "và"), theo đúng tiền lệ của `ja10`,
  `ja20`, `ja30`, `ja50`, `ja100`–`ja140`. Cuối vế dùng "— mười bài ấy." (6 lần ở JA
  ngoài lát, so với "thành ra mười bài đấy." 2 lần).
  Từ nối "và cả" trong bản nháp đã bị tôi bỏ: đếm ở JA ngoài lát này, "và cả" **không
  có** mẫu nào; "Rồi …" 5, "rồi tới" 4, "cùng …" 2, "lại nữa" 2. Tôi dùng "và" và
  "cùng", theo mẫu có sẵn.

  TIÊU ĐỀ `0.4`. `Saṅkhadhamajātaka`: `saṅkha` là vỏ ốc hay kèn, `dhama` là thổi, và
  Sujato dịch "The Horn-Blower". Tôi dịch **Kinh Kẻ Thổi Kèn**. Đếm tiền lệ ở khoá
  `0.4` của JA: 233 bài dịch tên ra tiếng Việt, 31 bài giữ Pāli. Tôi theo nhóm đa số
  vì đây là tên gọi chung, không phải tên riêng. Ngược lại `Khadiraṅgāra` (`ja40`),
  `Kuddāla` (`ja70`), `Bhīmasena` (`ja80`) là tên riêng nên giữ Pāli — cùng cách tầng
  đã làm cho `Naccajātaka`, `Sakuṇajātaka`, `Guṇa`, `Kosiyajātaka`, `Bāhiyā`.
