notes: |-
  Đã đọc HẾT p66.txt trước khi viết. `thag` **CÓ** tệp Anh đã ghim — đã kiểm trực tiếp
  `source/upstream-manifest.json` chứ không suy từ tên thư mục: tầng `english-sujato`
  (treeSha 24e81ded9d6710e16b277b6394fd57c48258da12) có 264 tệp trong `sutta/kn/thag/`, và
  đúng 264 tệp `thag10.2`, `thag10.4`, `thag10.5`, `thag10.6` có mặt; cache `.cache/
  upstream/suttacentral/translation/en/sujato/sutta/kn/thag/` cũng có đủ 4 tệp ⇒
  coverage Anh **44/45 khoá = 97,8%** (khoá `:10.5` — dòng bìa `… X thero ….` — Sujato để
  trống ở cả bốn bài). Lưu ý về cách đo: `source/layers.yaml` đặt
  `substantivePaliMinChars: 40` và `floor: 0.8`, nhưng **không** khoá Pāli của bài nào trong
  bốn bài này đạt 40 ký tự (kệ `Theragāthā` chia pāda 4 dòng, mỗi dòng 15–35 ký tự), nên
  mẫu số của phép đo chính thức bằng không; con số 97,8% ở trên là độ phủ thô trên **mọi**
  khoá của bài, để người biên tập tự phán. Dù sao thì cũng không có dấu hiệu tụt ngưỡng.
  
  MỆNH ĐỀ ĐO LẠI.
  `:0.1` giữ Pāli: đo trên **227** tệp `thag*`, **227/227** đều giữ dạng `Theragāthā [<số>]`.
  `:0.2` `Dasakanipāta` → `Bộ Mười Bài Kinh`. Đây là bài **đầu tiên** trong `thag` mang
  `Dasakanipāta` (mọi bài `thag` đã có đều thuộc `Ekakanipāta`…`Aṭṭhakanipāta`), nên không
  có tiền lệ trong `thag`. Đo hình `-nipaata` trong toàn tầng `thag`: `Ekakanipāta` →
  `Bộ Một Bài Kinh` (120), `Dukanipāta` → `Bộ Hai Bài Kinh` (49), `Tikanipāta` → `Bộ Ba Bài
  Kinh` (15), `Catukkanipāta` → `Bộ Bốn Bài Kinh` (11), `Aṭṭhakanipāta` → `Bộ Tám Bài
  Kinh` (3) — **5/8 nhóm** theo hình `Bộ <số> Bài Kinh`, và hai hàng đầu đúng hai dòng đã
  chốt trong `BRIEF_VI3` §11; hai nhóm lệch là `Pañcakanipāta` → `Nhóm Năm` (10) và
  `Chakkanipāta` → `Trưởng Lão Kệ Nhóm Sáu` (13), `Sattakanipāta` → `Bộ Bảy Bài Kệ` (3).
  Theo đa số hình ⇒ `Bộ Mười Bài Kinh`. Ngoài tầng `thag` có đúng 5 tệp khác dùng
  `Bộ Mười Bài Kệ` cho `Dasakanipāta`, nhưng **tất cả đều là `ja`** (`ja439`, `ja449`,
  `ja451`, `ja452`) — một tác phẩm khác — nên không tính là tiền lệ cho `Theragāthā`.
  `:0.3` `Paṭhamavagga` → `Phẩm Thứ Nhất`: nối theo Pāli, **67/96** bài `thag` có Pāli
  `:0.3` = `Paṭhamavagga` dùng `Phẩm Thứ Nhất`; đây cũng là hình chuẩn của
  `iti10:0.3` (95).
  `:0.4` → `Kinh Kệ Của Trưởng Lão <tên>`: đo **227/227** bài `thag` đã có đều theo hình
  này (`thag` dùng `Trưởng lão` 523 lần so với `Tôn giả` 27). Tên vị trưởng lão **giữ Pāli**,
  bỏ đuôi `theragāthā`/`attheragāthá`.
  DÒNG BÌA `… <Tên> thero ….` → `… Trưởng lão <Tên> ….` — theo đúng tiền lệ của
  `thag1.100–1.112` (`… Devasabho thero ….` → `… Trưởng lão Devasabha ….`). Hai dấu lược
  được giữ nguyên, không gộp, không thêm.
  `…pe…`: không khoá nào trong bốn bài `thag` này có `…pe…`; dấu lược chỉ xuất hiện ở
  dòng bìa `:10.5` và đã khớp đúng hai `…` như Pāli.
  
  TIỀN LỆ DÙNG LẠI. `natthi dāni punabbhavo”ti.` → `nay không còn tái sinh nữa”ti.` (6,
  `thag1.80:1.4`). `pahitattassa bhikkhuno.` (chỉ 1 tiền lệ, `snp4.16:7.4`).
  
  BẤT ĐỊNH VÀ CHỖ PHảI PHÁN, ĐÃ GHI.
  (1) **Căn chỉnh bản Anh của Sujato lệch.** Sujato đưa `If no one else is found` vào khoá
  `:1.1` (Pāli `Purato pacchato vāpi` = *phía trước, phía sau*), rồi `before or behind` vào
  `:1.2`, và `it’s extremely pleasant / to be dwelling alone in a forest grove` vào
  `:1.3–1.4`. Cả bốn câu tiếng Anh vẫn đúng nghĩa, chỉ là **lệch một câu**, nên tôi giữ thứ tự
  Pāli và dùng Sujato cho nghĩa, không dịch vòng theo thứ tự câu của Sujato. Bản Sujato của
  `thag10.2` có hiện tượng này ở nhiều khoá; đây là lý do `triangulation` không cho 9,5.
  (2) `giribbaje` (`:9.4`) — **0 tiền lệ**, và là danh xưng cổ của dãy núi (nghĩa sơn
  *núi chinh phục*). Sujato dịch `Mountainfold`, tức coi đây là tên riêng đặt. Giữ `Giribbaja`
  bằng Pāli sẽ khiến câu đọc khó; dịch thành `núi non chầu vây` thì giữ được `giri` và `baja`
  (bao quanh) nhưng là cách diễn đạt của tôi, **không phải** tiền lệ. Ghi rõ để người biên
  tập có thể chọn khác.
  (3) `mattakuñjarasevitaṁ` (`:3.2`) — dịch `nơi voi đang động dục thường lui tới`;
  `mattakuñjara` là voi đực động dục, và Sujato cũng dịch `rutting elephants`. 0 tiền lệ cho
  cụm này.
  (4) `3.1` `Yogi-pītikaraṁ rammaṁ` — Sujato dịch `Alone and self-disciplined,` (ghép cả
  `3.1` và `3.3` vào một câu và dịch sai `yogi` thành *độc tầm*). Pāli `yogī` = người tu
  hành, `pītika` = chỗ ngự; tôi theo Pāli: `Nơi bằng phẳng, chỗ nghỉ của người tu,`.
  (5) `10.1` `Sohaṁ paripuṇṇasaṅkappo` — `saṅkappo` là **ý chí**, không phải tâm tư; dịch
  `Ý chí của ta nay đã viên mãn,`. Sujato `I’ve got all I wished for` cũng theo nghĩa ý chí.
  (6) `1.1–1.2` `Purato pacchato vāpi, aparo ce na vijjati` — câu hỏi của vị trở lão với người
  đi cùng: trước sau, và cả bên cạnh, đều không có ai khác. Tôi dịch `“Phía trước, phía sau,
  hoặc / nếu không còn ai khác,` giữ `vāpi` = *hoặc* và `ce` = *nếu*.
  `technical_integrity` đặt 9.6 vì không có ai rà lại bằng con người.
