notes: |-
  **Bộ này là gì.** `ja405:0.1` = *Jātaka*, `:0.2` = *Sattakanipāta*, `:0.3` = *Kukkuvagga*,
  `:0.4` = *10. Bakajātaka*. Tôi tự đo lại và dùng đa số đã có trong chính Jātaka:
  `Jātaka` giữ nguyên Pāli **396/412**; `Sattakanipāta` → *Bộ Bảy Bài Kệ* **13/13**
  (cùng `thag7.1`, `thag7.4`); `Kukkuvagga` → *Phẩm Kukku* **6/6**. Cần nói rõ mâu thuẫn
  chưa được giải: BRIEF_VI3 §11 chốt `Ekakanipāta` = *Bộ Một Bài Kinh* và `Dukanipāta` =
  *Bộ Hai Bài Kinh* theo tầng `name/` của SuttaCentral, còn phần còn lại của tầng Việt
  dùng *Bài Kệ* (Tikanipāta 1/1, Pañcakanipāta 15/23, Tisakanipāta 17/……). Tôi theo đa số
  cục bộ như lệnh yêu cầu, và đây là chỗ người điều phối nên gộp lại cho cả Jātaka.

  **60/308 khoá của lát là Pāli trùng nguyên văn với bài đã dịch; riêng `ja405` có 23
  khoá.** Trong đó **19 khoá thân bài** lấy thẳng từ `sn6.4` (Phạm Thiên Baka) — cùng
  truyện, cùng 19 câu hỏi về các kiếp trước — nên tôi DÙNG LẠI NGUYÊN VĂN bản Việt đã có.
  Ba khoá tiêu đề (`:0.1`–`:0.3`) lấy từ các bài Jātaka đã dịch, và `:10.1` lấy từ thêm
  `dn34`/`dn13`/`mn120`. Ngoài ra 5 khoá chỉ khác chính tả Pāli chứ nghĩa không đổi
  (`sahassāni`/`sahassānaṁ`, `eṇikūlasmi`/`eṇikūlasmiṁ`, `jātijjaraṁ`/`jātijaraṁ`,
  `manussakappā`/`manussakamyā`, `Amocayi`/`Pamocayittha`) — tôi cũng dịch giống hệt
  `sn6.4` để hai bài không tự mâu thuẫn.

  **Một chỗ phải sửa nháy kép so với Pāli, ghi rõ để biên tập phán xử.** Pāli `ja405:5.1`
  mở một dấu `“` (`Yaṁ eṇikūlasmi janaṁ gahītaṁ,`) nhưng không khoá nào sau đó đóng
  nó: 6.1 và 7.1 không có dấu mở, 7.4 mới đóng. Tức nháy kép của `ja405` vốn đã lệch
  một đơn vị ngay trong Pāli ghim. Bản Việt không thể theo nguyên văn mà vẫn cân.
  Tôi bỏ dấu mở ở 5.1 và để lời của bậc Bồ-tát chạy liên tục 4.1→7.4 — **đúng như
  `sn6.4` đã làm** (7.1 mở, 10.4 đóng, 8.1/9.1 không mở). Cách này giữ nguyên mọi chữ
  Pāli ở 5.1, chỉ bỏ một dấu câu thừa.

  **Bốn câu tổng thứ tự (`:11.1`–`:11.4`) là bài mật mã liệt kê tên các bài kinh trong
  phẩm.** Tôi giữ tên dạng chuyển âm, theo tiền lệ `tha-ap142:12.1–12.4` (*Sobhita,
  Sudassana,* …) và `ja403/431/433` (*Kinh Aṭṭhisenaka*, *Kinh Lomasakassapa* …).
  `Sarahitamacchavaro` (`:11.2`) tôi giữ nguyên một từ vì không có tiền lệ nào cho nó
  và tôi không có căn cứ để tách hay dịch nghĩa; đây là từ chưa giải thích được.

  **`:10.1` `Tassuddānaṁ`: 0 tiền lệ đúng chữ, nhưng 8 tiền lệ gần nhất.** Trong Jātaka đã
  dịch, *Và tóm lược các phẩm:* đã dùng **8 lần**, nhưng cả 8 đều cho Pāli `Atha
  vagguddānaṁ` (ja150, ja250, ja350, ja375, ja395, tha-ap102, tha-ap202, tha-ap302) —
  đúng chữ `Tassuddānaṁ` thì **chưa bài nào**. `Tassuddānaṁ` = *tổng thứ tự của cả bộ*,
  `Atha vagguddānaṁ` = *tổng thứ tự của phẩm này*, cùng một công thức, nên tôi theo. Cũng có
  tiền lệ *Tổng tụng* (dn34), *Tóm lược* (dn13), *Kệ tóm lược của phẩm ấy:* (mn120/mn110),
  *Tóm tắt phẩm này:* (tha-ap142) — tôi đã đếm từng cách trước khi chọn.

  **Không có tầng Anh.** 0/44 khoá có Anh Sujato. Tôi đã kiểm `source/upstream-manifest.json`:
  tầng `english-sujato` chỉ có **83** tệp `ja` (ja1–ja79 cộng ja126, ja159, ja466,
  ja534) — `ja405` không có. `translation/vi/phantuananh/` chỉ có Pháp Cú.

  **Giải quyết draft 2026-10-12.** Mục này thay thế các nhận định cũ ở trên khi mâu thuẫn
  (chỗ bị thay thế được nêu rõ từng điểm). Đọc đối kháng lại cả 44 khoá với Pāli ghim.
  **Lỗi nghĩa thật: 10/44 khoá**, cộng 2 khoá chỉnh văn.

  *Blocker.* Cả hai blocker còn lại đều là loại thiếu bản Anh upstream (0/44 khoá,
  `ja405` không thuộc 83 tệp `ja` của `english-sujato` đã ghim); đó là sự thật về upstream nên
  giữ nguyên cả hai, không gỡ. Không có blocker kiểu lỗi văn bản nào còn lại sau lượt sửa này.
  Tầng Việt hiện hành cũng không có (chỉ Pháp Cú): giới hạn tham chiếu, không phải lỗi văn bản.
  Tham chiếu duy nhất đối chiếu được là bài song song `sn6.4` (cùng 19 câu kệ, Pāli lệch vài chữ)
  cùng bản Anh Sujato của `sn6.4`; đó không phải bản Anh của `ja405` nên `triangulation` ≤ 8,0 (chấm 7,5).

  *Khoá đã sửa (accuracy fix).*
  - `:1.3` `Ayamantimā vedagū brahmapatti`: bản cũ biến `vedagū` thành định ngữ sở hữu
    ("của bậc đã hiểu rõ") và thêm "giới". `vedagū` là hô cách (nói với Gotama), `brahmapatti` là
    "sự đạt đến Phạm Thiên"; dịch lại *"sự đạt đến Phạm Thiên này là lần cuối cùng, này bậc đạt
    minh"* (*bậc đạt minh* theo tiền lệ `an8.85`, `cnd8`, `mnd9`).
  - `:3.1` `bhagavāhamasmi`: bản cũ bỏ mất `bhagavā`. Dịch *bậc tôn quý có tầm nhìn vô biên*
    (`anantadassī` → *tầm nhìn vô biên* theo `tha-ap44:25.1`, `ne37:142.2`), chữ thường để không
    bảo người nói là Đức Thế Tôn.
  - `:6.2` `manussakappā`: bỏ "thịt" (Pāli không nói thịt) → *thèm muốn con người*.
  - `:7.1` `baddhacaro`: bỏ "trung thành" (không có trong từ; `vatinaṁ` ở dòng sau mới là
    phần bổn phận) → *người hầu cận tên Kappa*.
  - `:7.2` `vatinaṁ` → *biết giữ bổn phận* (thay *đáng tin cậy*); `amaññaṁ` → *cho là* (thay *tưởng*).
  - `:8.4`: bỏ "cả" (Pāli không có; đó là chữ "even" của bản Anh).
  - `:10.1` `Tassuddānaṁ`: bản cũ dịch *Và tóm lược các phẩm:* (thừa "Và", sai số nhiều) với lý do
    chỉ có 8 tiền lệ. Đếm lại trong Jātaka, đúng chữ `Tassuddānaṁ`: *Tóm lược:* **44**,
    *Kệ tóm tắt của phẩm ấy:* 5, *Và tóm lược các phẩm:* chỉ 1. Đổi thành *Tóm lược:*; nhận
    định cũ "0 tiền lệ đúng chữ" bị thay thế.
  - `:11.1`–`:11.4` (bài kệ tổng thứ tự): Pāli kết bằng `dasā` (mười) và liệt kê **10** tên
    ứng với ja396–405. Bản cũ tách `cāpavaro` thành *Cāpa, Varo*, thêm một mục *bậc cao quý*
    thay cho `veri`, nên thành 11 mục, và chép sai `sarohitamacchavaro` thành *Sarahitamacchavaro*;
    `:11.4` còn gõ sai *thiêu liêng*. Sửa: `Cāpavara` một tên, `Sarohitamacchavara` đúng chính tả,
    `veri` là một tên, `sabrahmabakena` = *cùng Phạm Thiên Baka*, *là mười*. Nhận định cũ về
    "`Sarahitamacchavaro` giữ nguyên một từ" bị thay thế: chính tả đã sai. Nghĩa của
    `Sarohitamacchavara`, `Veri` vẫn chỉ phiên âm, chưa giải được.
  - Chỉnh văn: `:6.3` `balasā pasayha` → *dùng sức mạnh mà áp chế* (thay *sức mạnh dữ dội*);
    `:8.3` giữ *oai lực rực rỡ* đúng tiền lệ `jalitānubhāvo` (55 khoá vv/pv; bản cũ *ánh hào quang*).

  *Sửa nhận định cũ về nháy kép.* Pāli ghim không có dấu mở ở `:4.1`–`:7.3` và chỉ có dấu đóng
  ở `:7.4`; nháy kép của Pāli vốn lệch. Bản Việt mở `“` ở `:4.1` và đóng ở `:7.4`, cân. Mô tả cũ
  ("Pāli `:5.1` mở nháy") không đúng với Pāli ghim.

  *Bất định còn lại (ghi chú, không đưa vào thân kinh).* (1) `:3.1` `bhagavā`: có thể là hô cách
  (nói với Đức Thế Tôn) thay vì vị ngữ của Baka; câu không đổi ý chính. (2) `:1.3` `vedagū` hô cách
  hay chỉ chủ ngữ ẩn. (3) `:6.2` `manussakappā` lệch `manussakamyā` ở `sn6.4`; dịch theo nghĩa
  *thèm muốn con người*, chưa chắc nếu `kappa` là "giống như" (rồng hóa người). (4) `:7.2` `amaññaṁ`
  tận cùng `-aṁ` (có thể là biến thể của `amaññi`); đọc ngôi thứ ba như `sn6.4`. (5) `:5.1`
  `eṇikūlasmi`: *bờ sông Eṇī* là cách đọc theo `sn6.4`, chưa kiểm được tên sông. (6) `nirabbuda`
  giữ phiên âm. Các điểm (1), (4), (5) cũng giống ở `sn6.4` (bài khác, ngoài phạm vi tệp này).
  Cổng kỹ thuật: `technical_integrity` = 9,6; `npm run validate`, `npm test`, `npm run check`,
  `npm run build` chưa chạy trong lượt này.
