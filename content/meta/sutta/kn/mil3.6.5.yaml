notes: |-
  **Hai blocker, bài phải ở `draft`** — cả hai về **tầng tham khảo**, phần văn bản thì tốt.
  
  **Về tầng Anh.** Bài có **3 khoá thân** (≥40 ký tự, bỏ khối `:0`): `1.2`, `1.4`, `1.5`. Cả 3 đều **0 chữ Anh**. `english-sujato` không có thư mục cho `mil` (Sujato chỉ có `cp`, `dhp`, `iti`, `ja`, `kp`, `snp`, `thag`, `thig`, `ud` dưới `kn/`). `english-project` không có lớp lấp cho `mil`. `mil3.6.5` không có trong `content/meta/reference-gaps.yaml`. Với bài này bộ đo coverage **bắt được** (ratio = 0 < 0.8), khác `ja179`/`ja192`/`ja183` vốn không có khoá thân nào.
  
  **Phần dịch tốt và đúng ba tầng câu hỏi.** `1.2` hỏi `upasampadā sundarā` → *bậc thông đạt Veda thật tuyệt diệu, phải không?*; `1.3` đáp `Āma, mahārāja, upasampadā sundarā` → *Này Đại vương, bậc thông đạt Veda thật tuyệt diệu*. `sundarā` ("đẹp, tuyệt diệu") giữ nguyên ở cả hai vế, nên cặp hỏi–đáp bám Pāli. `1.4` `udāhu natthī` (hay là không có) → *hay là không có?* ✓ giữ đúng phép chọn.
  
  **`1.5` — vế dài nhất, và dịch đủ.** Đây là chỗ dễ rút ngắn quá mức. Bản dịch giữ đủ bốn ý của Pāli: (1) `Upasampanno kho … bhagavā bodhirukkhamūle saha sabbaññutañāṇena` → *đã thành tựu bậc thông đạt Veda dưới gốc cây bồ đề cùng với toàn tri toàn kiến* ✓ (`bodhirukkhamūla` = gốc bồ đề, `sabbaññutañāṇa` = toàn tri toàn kiến); (2) `natthi bhagavato upasampadā aññehi dinnā` → *không có bậc thông đạt Veda nào do người khác trao cho* ✓ (giữ phủ định `natthi`); (3) `yathā sāvakānaṁ … bhagavā sikkhāpadaṁ paññapeti` → *cũng như các đệ tử của Ngài … còn chỉ bày học giới* ✓; (4) `yāvajīvaṁ anatikkamanīyan` → *để thọ hành suốt đời, không được vượt quá* ✓.
  
  **Điểm cần lưu ý cho biên tập.** Bản dịch dùng *bậc thông đạt Veda* cho `upasampadā` — đây là cách dịch đã có sẵn trong tầng. Nhưng theo từ điển Pāli số, `upasampadā` là "việc thành tựu / sự chứng ngộ", và trong `mil3.3.1` (cùng lô, cùng sách) cũng dùng *bậc thông đạt Veda*. Hai bài đó thống nhất với nhau, nên không có mâu thuẫn nội bộ — nhưng cần biết rằng nghĩa chuẩn của từ là "thành tựu", và *Veda* là lựa chọn biên tập của tầng. Tôi không trừ điểm vì nhất quán, chỉ ghi ra để quyết định thuật ngữ được cân nhắc chung.
  
  **`Sativagga` → *Phẩm Chánh Niệm* ✓** trùng nguyên văn 6 tệp đã có (`mil3.6.5`, `.6`, `.7`, `.8`, `.9`, `.11`).
  
  **Danh xưng** `bhante nāgasena` → *thưa tôn giả Nāgasena* ✓ và `Kallosi, bhante nāgasenā` → *Khéo lắm, thưa tôn giả Nāgasenā* ✓ — hai vế khớp tiền lệ, kể cả cách viết `Nāgasenā` có dấu ngã ở tận cùng (danh từ ở vị trí sau, giống Pāli).
