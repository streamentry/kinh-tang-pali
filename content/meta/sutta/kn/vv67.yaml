notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `vv`.
  Khối mô tả cung điện (1.1–2.5) dùng lại nguyên văn bài vv56/vv57 cho 8 khoá có Pāli trùng: `“Tòa lâu đài cao vút với những cột trụ bằng ngọc châu này,` / `Có bảy trăm lầu gác nguy nga tráng lệ,` / `cột bằng ngọc lưu ly, trải thảm rực rỡ tươi đẹp.` / `Nơi ấy ngài an tọa, ăn uống thỏa thích,` / `đàn hạc cõi trời tấu lên khúc nhạc êm dịu;` / `múa hát, vui đùa thỏa thích.`; `Samantato soḷasa yojanāni` dịch theo mẫu 4× `rộng … do-tuần khắp bốn phía xung quanh` của vv56/vv57/vv59. `Phẩm Pāyāsi` (7×), `Chuyện Cung Điện Nam Hư Không` (11×), `Vị thiên tử ấy vô cùng hoan hỷ,` (9×), `Nhờ vậy tôi có được dung sắc như thế này,` (10×) cũng dùng lại.
  `Vaṇṇo ca te sabbadisā pabhāsatī”ti.` có 19 khoá tiền lệ; chọn biến thể có `ngài` (3×) vì chủ thể ở đây là nam thiên tử, còn vv1 là nữ thiên nên dùng `nàng`. Cả hai đều lấy nguyên văn từ bài đã có, không tự viết mới.
  Bất định còn lại, ghi ở đây: `Aṭṭhaṭṭhakā` (2.3) không có tiền lệ và không có bản Anh; dịch `Cao bốn tầng` theo dạng lặp chữ chỉ số tầng, nhưng số tầng chưa được xác nhận. `Dadamujugatesu` (5.2) là cụm khó nhất của lát — `dadaṃ`, `mujā`, `gate` không có tiền lệ; dịch trung tính `điều đã cho, đã nhận, đã đem đi` theo ba dạng thức của nghiệp cho, và ghi rõ ở đây vì không thể chốt chắc. `phalaṁ alameva dātuṁ` (7.1) dịch `dâng phẩm vật trong mọi hoàn cảnh`.
  `…pe…` giữ một dấu lược.
