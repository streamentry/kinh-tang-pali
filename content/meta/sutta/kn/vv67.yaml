notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `vv`.
  Khối mô tả cung điện (1.1–2.5) dùng lại nguyên văn bài vv56/vv57 cho 8 khoá có Pāli trùng: `“Tòa lâu đài cao vút với những cột trụ bằng ngọc châu này,` / `Có bảy trăm lầu gác nguy nga tráng lệ,` / `cột bằng ngọc lưu ly, trải thảm rực rỡ tươi đẹp.` / `Nơi ấy ngài an tọa, ăn uống thỏa thích,` / `đàn hạc cõi trời tấu lên khúc nhạc êm dịu;` / `múa hát, vui đùa thỏa thích.`; `Samantato soḷasa yojanāni` dịch theo mẫu 4× `rộng … do-tuần khắp bốn phía xung quanh` của vv56/vv57/vv59. `Phẩm Pāyāsi` (7×), `Chuyện Cung Điện Nam Hư Không` (11×), `Vị thiên tử ấy vô cùng hoan hỷ,` (9×), `Nhờ vậy tôi có được dung sắc như thế này,` (10×) cũng dùng lại.
  `Vaṇṇo ca te sabbadisā pabhāsatī”ti.` có 19 khoá tiền lệ; chọn biến thể có `ngài` (3×) vì chủ thể ở đây là nam thiên tử, còn vv1 là nữ thiên nên dùng `nàng`. Cả hai đều lấy nguyên văn từ bài đã có, không tự viết mới.
  Bất định còn lại, ghi ở đây: `Aṭṭhaṭṭhakā` (2.3) không có tiền lệ và không có bản Anh; dịch `Cao bốn tầng` theo dạng lặp chữ chỉ số tầng, nhưng số tầng chưa được xác nhận. `Dadamujugatesu` (5.2) là cụm khó nhất của lát — `dadaṃ`, `mujā`, `gate` không có tiền lệ; dịch trung tính `điều đã cho, đã nhận, đã đem đi` theo ba dạng thức của nghiệp cho, và ghi rõ ở đây vì không thể chốt chắc. `phalaṁ alameva dātuṁ` (7.1) dịch `dâng phẩm vật trong mọi hoàn cảnh`.
  `…pe…` giữ một dấu lược.
  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|check`; coordinator cần chạy đủ bốn lệnh sau trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, và `npm run build`.
  Lượt cải thiện 2026-10-11 (kiểm toán độc lập, đọc đối kháng 34 khoá): bản trước có 10/34 khoá sai nghĩa thật, nên điểm 9.08 của bản trước là quá cao; đã sửa và hạ điểm. Các điểm đã đổi (từ → sang): semantic_fidelity 8.9 → 8.4, grammar_logic 9.1 → 8.6, terminology 8.9 → 8.6, triangulation 7.5 → 7.0, vietnamese_clarity 9.1 → 8.8, han_viet_balance 9.4 → 9.2, ambiguity_integrity 8.8 → 8.3; final_score 9.08 → 8.80.
  Khoá đã sửa: 2.3 `Aṭṭhaṭṭhakā` = 8×8 = sáu mươi bốn (bản cũ `Cao bốn tầng` là bịa; theo vv72/vv73/vv80 cùng Pāli, và `ps1.1:516.5` ghi `aṭṭhaṭṭhakāni catusaṭṭhi`); 2.4 `kaññā tidasacarā uḷārā` = thiên nữ cõi Tam Thập Tam cao sang (bản cũ `nữ thiên tỳ-bà diện mạo` sai vật, `kaññā` không phải đàn; dùng lại nguyên văn vv72/73/80); 5.1 bỏ `ấy` thừa; 5.2 `Dadamujugatesu` = `dadaṁ` + `ujugatesu` (sandhi nối `-m`), tức bố thí cho những bậc ngay thẳng — bản cũ `điều đã cho, đã nhận, đã đem đi` và chú thích về `mujā` là phân tích sai, không có căn cứ; 5.3 bỏ `Bởi vậy` (Pāli là `hi` nhấn, không chỉ nhân quả) và `trời đả thiên` (vô nghĩa), dùng `cõi trời Ba Mươi Ba` theo tiền lệ ja362:4.4; 5.4 `chứng đắt` (lỗi chữ, và `anubhoti` là thọ hưởng) → `thọ hưởng`; 6.1–6.2 `Tavevāhaṁ mahāmuni, adāsiṁ caturo phale` = `tava` (dâng đến ngài) + `eva` + hô cách `mahāmuni`, người nói là thiên tử (dâng bốn quả) — bản cũ `tôi đã theo hầu` là bịa và `cả bốn quả` thêm `cả`; 7.1 `phalaṁ alameva dātuṁ` = quả thật nên dâng trái cây (bản cũ `phẩm vật trong mọi hoàn cảnh` là bịa); 7.2–7.4 `sukhatthikena` / `patthayatā` / `icchatā` là ba tác nhân cách công cụ (người cầu an lạc, người ước lạc thú cõi trời, người mong vận may cõi người) — bản cũ `cho những người đau khổ` và `điều lòng người ta mong muốn` là bịa/đảo vai.
  Phân loại 10 khoá lỗi nghĩa thật (2.3, 2.4, 5.2, 5.3, 5.4, 6.1, 7.1, 7.2, 7.3, 7.4): thêm nghĩa không có trong Pāli/bịa 5 (2.3, 5.2, 6.1, 7.1, 7.2); sai vật/sai đối tượng 1 (2.4); đảo vai tác nhân (7.3, 7.4) 2; sai quan hệ/từ vô nghĩa/chữ sai 2 (5.3, 5.4). Chủ thể 6.1 đã đọc lại: hô cách `mahāmuni` là người đang nghe, không phải tân ngữ.
  Bất định còn lại: `rucakatthatā` (1.4) giữ `trải thảm rực rỡ` theo 8 khoá Pāli trùng trong họ vv, nhưng `rucaka` có thể là vàng (vv55 dịch `thảm vàng`), chưa phân xử; `ujugatesu` hiểu là những bậc ngay thẳng/chính trực; không rõ hô cách `mahāmuni` (6.1) chỉ Đức Phật hay vị nghe chuyện; `tidive` dịch `cõi trời Ba Mươi Ba` theo tiền lệ ja362. Tiêu đề phẩm `Purisavimāna` đang dịch `Nam Hư Không` (không có `ākāsa`), lặp ở cả bộ (11× trong họ), không sửa riêng một tệp. Khối tiêu đề và các khoá 1.x, 3.x, 4.x, 8.x giữ nguyên.
  Cổng kỹ thuật CHƯA chạy lại: cần `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 5 chỗ bất đồng nghĩa → sửa 0, giữ 3, bất định 2. Giữ: 6.1–6.2 Tavevāhaṁ: Pāli đã ghim là tava (đến ngài), bản nguyên bài đọc theo dạng tương tự như thế, nên giữ cách hiểu dâng bốn quả cho người nghe chuyện; 7.1 alameva dātuṁ giữ quả thật nên dâng (alaṁ với động từ nguyên mẫu là thích hợp, nên), bản nguyên bài đọc là quá đủ để; 7.4 manussasobhaggatam giữ vận may tốt đẹp của cõi người, bản nguyên bài đọc là trạng thái giàu sang. Bất định: 1.4 rucakatthatā giữ trải thảm rực rỡ theo họ vv, bản nguyên bài đọc là trải lót bằng vàng, cùng hướng với vv55, chưa phân xử được; 7.2 niccaṁ đang gắn với người luôn mong cầu an lạc, bản nguyên bài gắn với việc dâng thường xuyên, Pāli không buộc được cách nào. Bản nguyên bài xác nhận độc lập các chỗ đã sửa ở lượt 2026-10-11: 2.3 sáu mươi bốn thiên nữ (tám nhóm tám), 2.4 thiên nữ cõi Tam Thập Tam, 5.2 bố thí cho những bậc ngay thẳng, 5.4 thọ hưởng, 6.1–6.2 người nói là thiên tử dâng bốn quả, 7.2–7.4 ba tác nhân. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn (chín đoạn ứng với chín khổ), không phải mức khoá; không có bản Anh. Không có câu chữ nào của bản nguyên bài được đưa vào bản dịch; lượt này không đổi chữ nào của 34 khoá. Cổng kỹ thuật chưa chạy: npm run validate, npm test, npm run check, npm run build.
