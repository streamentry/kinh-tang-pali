notes: |-
  Đã đọc HẾT v7/p5.txt trước khi viết chữ nào. 13 khoá mỗi bài, 156 khoá cả lát, không khoá nào rỗng. Không segment nào có …pe… nên cả hai phía đều 0 dấu lược.
  Ngưỡng 40 ký tự của kiểm() không chạy ở lát này: mọi vế kệ của mười hai bài đều ngắn hơn 40 ký tự, nên cần rỗng và các assertion NFC, trùng nguyên văn Pāli, lọt_pāli, dấu lược không tự chạy. Tôi đã kiểm thủ công đủ 156 khoá bằng script riêng, không dựa vào ngưỡng: NFC, khoá đủ và không thừa, trùng nguyên văn Pāli, lọt_pāli, số dấu lược, và số dấu nháy kép theo từng khoá. Kết quả 0 lỗi trên 156 khoá.
  Cùng hệ quả đó: englishCoverageFor đo substantiveSegments = 0 trên cả 12 bài nên ratio = 1, sàn coverage 80% không kích hoạt và bài không cần entry ở content/meta/reference-gaps.yaml. Nhưng ô English trống không phải sự đồng thuận về cách dịch; Pāli ở từng vế phải tự đứng vững, và đó chính là lý do bài giữ draft.
  Một điểm phải sửa ngay trong mô tả lát: văn bản giao cho tôi gọi đây là Ekakanipāta, nhưng Pāli đã ghim ở khoá 0.2 của cả mười hai bài đều ghi Dukanipāta. Chỉ khoá 0.3 khác nhau, sáu bài đầu thuộc Santhavavagga và sáu bài sau thuộc Kalyāṇavagga. Tôi theo Pāli.
  Dấu nháy kép giữ đúng số và đúng vị trí theo Pāli từng khoá. Ở năm bài (ja166, ja167, ja168, ja169, ja171) Pāli chỉ mở một lần ở 1.1 và chỉ đóng ở 2.4 cho trọn hai bài kệ, nên tôi không thêm dấu ở 1.4 hay 2.1. Ở bảy bài còn lại mỗi bài kệ tự mở và tự đóng, tôi giữ nguyên. Không khoá nào để lại (…) dạng khoá chưa dịch.
  Khoá 0.1 giữ nguyên Jātaka nên trùng nguyên văn Pāli. Đây là quy ước đã có của tầng (ja101, ja12, ja21, ja51, ja62, ja79, ja91, ja159 đều vậy) và các khoá này ngắn hơn 40 ký tự nên chốt không kiểm. Tôi ghi ra đây để không ai tưởng là sót.
  Dukanipāta dịch là Tập Kẻ Đau Đớn theo đúng ja159, cùng collection và cùng khoá 0.2. Có hai cách khác trong chính tầng này và tôi không giấu: Itivuttaka (iti28…iti31) dịch Dukanipāta là Phẩm Hai Pháp, và bản Anh Sujato đã ghim dịch là The Book of the Twos. Cả hai đọc duka là số đếm, và lập luận về số đếm có sức mạnh: năm tập của Tăng Bộ mang tên Duka, Tika, Catu, Panca, Chakka, nên chỉ Duka có thể mang nghĩa đau đớn, bốn tên kia thì không. Tôi vẫn chọn Tập Kẻ Đau Đớn vì đó là tiền lệ đã published cho đúng khoá này trong Tăng Bộ, và phá nó ra sẽ làm bài đã publish tự mâu thuẫn. Người biên tập nên biết cả hai lựa chọn và có thể đổi cả cùng một lúc.
  Santhavavagga giữ nguyên là Phẩm Santhava. Pāli không giải nghĩa chữ này, trong tầng chưa có tiền lệ, và tầng đã dùng cách giữ romanize cho tên phẩm không dịch được (Phẩm Haṁci, Phẩm Kakaṇṭaka, Phẩm Parosata, Phẩm Asampadāna). Bản Anh Sujato đã ghim gloss phẩm này là Acquaintance nhưng tôi không dịch theo vì đó là tên sáng tác của dịch giả chứ không phải nghĩa của chữ, và không có nguồn Pāli nào giải thích Santhava.
  Tên bài lấy từ tầng name của SuttaCentral đã ghim, là tầng tham khảo duy nhất còn có cho mười hai bài này; nó có tiêu đề từng bài trong khi tầng sutta thì không. Mỗi tên tôi ghi kèm lựa chọn khác trong notes của bài đó.
  Tên: Sujato đặt tên cho Daddarajātaka là Who Sounds the Drum. Tôi dịch Kinh Ai Đánh Trống. daddara là trống, không có tiền lệ trong tầng; chốt lọt_pāli không chặn vì daddara không mang dấu Pāli.
  Bất định: saddena mahatā ở 1.1 và 1.2. Tôi dịch là Ai với tiếng lớn / đang đánh tiếng trống, đọc saddena là cách thức phát ra tiếng và mahatā là tiếng lớn. Cách đọc khác là âm thanh lớn vang ra, thì nghĩa gần. Tôi giữ cách có động từ để cặp kệ đọc được như một câu hỏi.
  Bất định: Jātimassa jigucchantā ở 2.3. jigucchanta là thấy xấu hổ, tôi dịch là thấy nhục. Chữ này còn có nghĩa là khó chịu, chán ghét. Cùng một chữ xuất hiện ở câu trả lời của học giả và ở chỗ kẻ nói, nên cả hai vế đều mang sắc thái khinh thường.
  tuṇhī ở 2.4 tôi dịch là tụ lại; chữ này là tụ họp thành đàn, không có tiền lệ. siṅgāla tôi dịch là màu vàng tro, không có tiền lệ. sīha tôi dịch là sư tử ở 1.3 và đàn sư tử ở 2.4; sīha cũng là hổ, nhưng ở 1.3 là số nhiều đồng nhất và ở 2.4 là số nhiều tụ lại, nên sư tử hợp hơn. migādhibhū và migajāta đều không có tiền lệ, đặt mới là bậc chúa các loài thú và các loài thú. adhamo là thấp kém nhất, không có tiền lệ.
  1.4 và 2.4 có dấu đóng nháy theo Pāli là dấu chấm ở 1.4 và dấu ti ở 2.4, tôi giữ nguyên.
