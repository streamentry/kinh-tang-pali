  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (bản dịch 2007, theo ấn bản Buddha Jayanthi). Bản nguyên bài gộp nhiều khối `…pe…` thành ghi chú “(nt)” và chèn chú giải trong ngoặc nên chỉ đối chiếu được ở mức đoạn và theo cấu trúc; cấu trúc khớp: cùng 10 danh sách mười thành tố ở 8.1–17.1 (đã kiểm từng mục của cả 10 danh sách bằng phép so mẫu: 0 lệch), cùng 31 mục ở 21.1–21.31, cùng tám cách chú ý/không chú ý ở 46.2, 47.2, 52.2, 53.2, cùng các số bảy giác chi, ba buổi sáng/trưa/chiều, tám phương diện. 9 chỗ khác cách đọc → sửa 0, giữ 7, bất định 2. Giữ: (1) 2.2–2.6 bản nguyên bài gắn bốn động từ `bujjhanti`, `anubujjhanti`, `paṭibujjhanti`, `sambujjhanti` với bốn bậc đạo Sơ–Tứ trong ngoặc; đó là chú giải, Pāli không nói; (2) `hetu` ở 9.1, 18.2, 19.2, 21.29, 28.5 bản nguyên bài “chủng tử”, bản này “nhân” (cùng chữ với 25.4, 33.11, 37.6); (3) mục cuối của mỗi danh sách 8.1–17.1 `…paṭisambhidāya vasībhāvappattānampi bojjhaṅgā`: bản nguyên bài đọc như một mục “ý nghĩa” song song, Pāli là sở hữu cách số nhiều `-ānampi` nên đọc “cũng là giác chi của những vị đã đạt đến…”; (4) 7.1 `buddhi` bản nguyên bài “tánh giác”, bản này “trí tuệ”; (5) 28.13 `abhinīhāra` bản nguyên bài “quyết định”, bản này “dẫn hướng”; (6) 30.7 `samaṭṭha` bản nguyên bài “tĩnh lặng”, bản này “bằng phẳng”, giữ để khớp lời giải chơi chữ `visamā kilesā … samadhammo nirodho` ở 44.2 và 50.2; (7) `asaṅkhata` ở 27.15 bản nguyên bài thêm “của Niết Bàn”, đó là chú giải. Bất định: (a) `susamāraddho` ở 40.9–41.13, 44.1–44.3, 50.1–50.3: bản nguyên bài “khởi đầu tốt đẹp và tĩnh lặng” (đọc `su` + `sama` + `āraddha`, ăn khớp lời giải ở 44.2) so với “được khéo thực hiện” của bản này, theo cùng công thức ở sn46.4:2.8; (b) `cavati` ở 40.11–53.4: “lắng xuống” (theo sn46.4:2.9–2.11 ở tầng dịch) so với “biến mất” của bản nguyên bài. Ghi nhận, không đổi: 29.29 và 29.33 Pāli ghim đều là `sambujjhanaṭṭhaṁ` trong khi các khoá liền kề theo cặp `bodhana`, có thể là dị bản hay lỗi chép của tầng Pāli, bản Việt theo Pāli nên hai khoá giống nhau; `niyyāna` (21.28, 25.3, 28.14, 33.11, 37.5) và `nekkhamma` (13.1, 18.6, 35.1) cùng dịch “xuất ly”, theo quy ước của nhóm ps (ps1.1:501.8, ps1.5:118.2) dù ps1.3 dịch `niyyāna` là “sự thoát ra”; không đổi trong một lượt đối chiếu. Không có bản Anh.
