  Tầng tham khảo: tầng english-sujato không có ps2.3 (manifest đã ghim chỉ liệt kê tệp Pāli root cho uid này; thư mục sutta/kn của Sujato chỉ có cp dhp iti ja kp snp thag thig ud, không có ps); lớp english-project của dự án chưa có tệp cho ps; vietnamese-current (phantuananh) chỉ có Pháp Cú. Đây là not-published-upstream (giới hạn của bản chụp), không phải not-synced. Coverage English theo công thức của source/layers.yaml: mẫu số 272 khoá Pāli có nội dung (từ 40 ký tự sau khi chuẩn hóa khoảng trắng, bỏ khối 0.x), tử số 0 ⇒ 0/272; 128 khoá còn lại ngắn hơn ngưỡng hoặc là khối tiêu đề. Bản tra cứu toàn văn nguyên bài ở cuối trang (không phân đoạn, alignment: none) không phải tầng store và không cấp text cho bản này. Lời của Tôn giả Sāriputta ở 40.1 đến 41.13 là công thức của sn46.4 (đã có bản Anh Sujato và bản Việt đã xuất bản); phần đó chỉ được dùng làm tiền lệ bản Việt, không tính vào coverage và không nâng triangulation. Vì vậy triangulation bị chặn ở 7,0 (≤ 8,0) và bài giữ draft; không nâng điểm để né blocker.

  Cấu trúc bài: 1 duyên khởi tại Sāvatthī, Đức Thế Tôn nêu bảy giác chi; 2 đến 7 các cách giải thích tên gọi bojjhaṅga bằng bujjhanti, anubujjhanti, paṭibujjhanti, sambujjhanti và dạng làm cho (bodhenti…), rồi các nhóm danh từ ý nghĩa tương ứng (bốn nhóm bốn và một nhóm sáu); 8 đến 17 mười nhóm mười, mỗi nhóm mang một gốc (cội rễ, nhân, duyên, thanh tịnh, không đáng chê trách, xuất ly, giải thoát, vô lậu, viễn ly, buông bỏ) qua mười dạng (chính nó, hành, thâu nhiếp, tùy tùng, viên mãn, chín muồi, vô ngại giải, đưa đến vô ngại giải, thành thạo trong vô ngại giải, những vị đã đạt thành thạo); 18 đến 20 các khoá liệt kê lại từng dạng, 20 giữ dấu lược …pe… giữa cội rễ và buông bỏ; 21 đến 34 các danh sách ý nghĩa (thâu nhiếp, nhất tâm, đối tượng, phạm vi, tánh không, song hành, làm chủ; chỉ và quán; nâng đỡ và chế ngự tâm; căn, lực, chánh cần, như ý túc; tầm, tứ, hỷ, lạc; chú ý, nhận thức; uẩn, giới, xứ; tâm; tính đồng nhất; chiếu sáng; dục và thẩm sát; bốn chân lý; ý nghĩa như thật đến thấu đạt) mà các giác chi giác ngộ; 35 đến 38 các pháp mà các giác chi giác ngộ (xuất ly đến A-la-hán quả; căn, lực, đạo, chỉ quán, minh, giải thoát; dục đến Niết-bàn); 39 đến 41 lời Tôn giả Sāriputta nói với các tỳ-kheo (sống mỗi buổi với giác chi mình muốn, ví dụ hòm y phục của vua); 42 đến 53 phần giải thích: diệt tận hiện hữu, ví dụ ngọn đèn dầu, vô lượng, được khéo thực hiện, tôi biết khi giác chi còn tồn tại và khi lắng xuống, tám phương diện cho niệm giác chi (46 và 47) và cho xả giác chi (52 và 53).

  Số Pāli, tự tính từ danh sách trong chính bài: satta, sattime, sattannaṁ (1.2, 1.3, 1.5, 40.1, 40.2, 40.5, 40.6, 41.5; 8 vị trí) = bảy, khớp bảy giác chi ở 1.4 (niệm, trạch pháp, tinh tấn, hỷ, khinh an, định, xả = 7). Aṭṭhahākārehi (45.4, 45.5, 46.1, 46.3, 47.1, 47.3, 51.4, 51.5, 52.1, 52.3, 53.1, 53.3; 12 vị trí) = tám; danh sách ở 46.2, 47.2, 52.2, 53.2 mỗi khoá đếm đủ 8 mục (4 khoá × 8 = 32 mục), nửa chú ý và nửa chưa chú ý đúng cặp đối. Katihākārehi (45.2, 45.3, 51.2, 51.3) = bao nhiêu phương diện, không có số. Chakkaṁ (7.2) = nhóm sáu: 7.1 đếm đủ 6 mục. Pañcamacatukkaṁ (6.2) = nhóm bốn thứ năm: 2.3 đến 2.6, 3.1, 4.1 đến 4.4, 5.1, 6.1 là năm nhóm bốn kế tiếp, mỗi nhóm đếm đủ 4, nhóm cuối là 6.1; đây là cách đếm của bản Việt, Pāli không nêu rõ. Dasaka (8.0): mỗi khoá 8.1 đến 17.1 đếm đủ 10 mục (10 lần bojjhaṅgā, 10 vế trong bản Việt). Không có số lớn, không có Tiṁsakappasahassa.

  Thuật ngữ và tiền lệ (số đếm trên tầng, đo bằng cách ghép Pāli trùng nguyên văn hoặc theo gốc từ; khi hai phạm vi cho đa số khác nhau thì nêu cả hai):
    - bojjhaṅga → giác chi (87 khoá ps · 47 khoá kn khác trên 220 khoá có bojjhaṅga hoặc sambodh-); pīti → hỷ giác chi và passaddhi → khinh an giác chi (10/10 khoá ps); dhammavicaya → trạch pháp giác chi (10 ps · 4 kn khác trên 15; thẩm pháp chỉ có ở an4.238 và an10.102).
    - Sāvatthinidānaṁ → Tại Sāvatthī (443 trên 463 khoá cùng Pāli; các biến thể còn lại là Duyên khởi ở/tại, Nhân duyên ở, Bối cảnh ở); Katame satta? → Thế nào là bảy? (31 trên 62 khoá cùng Pāli; Là bảy nào? 12; Bảy giác chi nào? 5 — dùng đa số; sn46: 9 trên 23); “āvuso bhikkhavo”ti → “Này các hiền giả tỳ-kheo!” (4 trên 5); “Sattime, āvuso, bojjhaṅgā → “Có bảy giác chi này, này hiền giả (sn46.4:2.1, 1 khoá).
    - Sacepi me cavati, ‘idappaccayā me cavatī’ti pajānāmi → dùng lại nguyên văn sn46.4:2.9, 2.11, 3.9 (40.11, 40.15, 41.10; 41.13 cùng câu với 2.11, thêm dấu nháy kép đóng); Tiṭṭhantañca naṁ ‘tiṭṭhatī’ti pajānāmi → Và khi nó còn tồn tại, tôi biết: ‘nó còn tồn tại’ (sn46.4); seyyathāpi … dussakaraṇḍako … pubbaṇhasamayaṁ → theo mn32:9.10, 9.11 (hòm đầy những bộ y phục nhiều màu sắc; Buổi sáng, người ấy muốn mặc bộ y phục nào thì mặc bộ ấy).
    - nekkhamma → xuất ly (57 ps · 27 kn khác trên 114; ly dục 4 ps · 9 kn khác; thoát ly 4 ps); niyyāna(ṭṭha) → xuất ly (8/8 khoá ps có niyyānaṭṭha; 9 ps · 3 kn khác trên 24 khoá niyyān-). Hai gốc Pāli khác nhau cùng ra xuất ly vì tiền lệ của cả hai đều là xuất ly; không đổi một bên để tránh lệch với 114 và 24 khoá đã có.
    - nissaraṇa → thoát ly (35 ps · 1 kn khác trên 99; xuất ly 23 ps · 23 kn khác); ālokasaññā → tưởng ánh sáng (32 ps trên 39; nhận biết ánh sáng 7 ps); dhammavavatthāna → xác định pháp (25 ps · 16 kn khác trên 50); pāmojja → hân hoan (29 ps · 4 kn khác trên 43); abyāpāda → không sân hận (51 ps · 6 kn khác trên 77); vosagga → buông bỏ (32 ps trên 37).
    - pariggaha → thâu nhiếp (28 ps; nắm giữ 12 ps, ở ps2.10, trên 69); upaṭṭhāna → thiết lập (50 ps trên 101); samuṭṭhāna → phát khởi, samodhāna → hội tụ, samosaraṇa → quy tụ, pamukha → đứng đầu, taduttara → vượt trội, sāra → cốt lõi, pariyosāna → cứu cánh, amogadha → nhập vào bất tử (ps2.7:7.21 đến 7.29 và ps3.3:13.8, cùng một danh sách).
    - ekatta → tính đồng nhất (đồng nhất 26 ps · 20 kn khác; đơn nhất 21 ps, chủ yếu ps2.10 cho ekatta đối với nānatta, trên 154); ekagga → nhất tâm (28 ps trên 80); ekoda(ṭṭha) → hợp nhất (pe7:4.9 ekodibhāva; ps2.1 dịch ekodi là nhất tâm nên đổi để khỏi trùng với ekagga); ekarasa → nhất vị (20 ps; một vị 8; đồng một vị 6 ở ps2.7 trên 48).
    - pariccāga → xả bỏ (theo danh sách 17 mục trùng ps2.1:21.3; trên 17 khoá: xả ly 6 ps · xả bỏ 4 ps · từ bỏ 2); vuṭṭhāna → xuất khỏi (8 ps · 6 kn khác trên 14); vivaṭṭana → quay đi (10 ps trên 11); animitta → vô tướng, appaṇihita → vô nguyện, suññata → tánh không (ps2.1:21.3); akampiya → bất động (40 ps trên 48; ps2.9:40.5 bất động trước vô minh); anāsava → vô lậu (6 ps; không lậu 2 ps).
    - anupassanaṭṭha → quán sát (14 ps; quán chiếu 6 ps trên 26); vīmaṁsā → thẩm sát (10 kn khác trên 57; ps3.2 dịch quán sát, 7 khoá — đổi để khỏi trùng với anupassana ở 22.2 và 36 đến 37); paṭippassaddha → lắng dịu (36 ps · 33 kn khác trên 73; an tịnh 2 ps); padahana → nỗ lực (ps2.5:10.31, ps2.7:7.6, ps3.3:13.7); paggaha → nỗ lực (ps2.1:9.2, ps2.5:3.5); padhāna → tinh cần (ne5:32.6; ps3.2:4.2 dịch nỗ lực); chanda → dục (54 ps · 21 kn khác trên 122; ý muốn 13 kn khác).
    - nirodha → diệt tận (57 ps · 43 kn khác trên 377; tịch diệt 13 ps, chủ yếu ps2.9:3.3); nirodhūpaṭṭhāti → diệt tận hiện hữu (upaṭṭhāti → hiện hữu ở ps3.7:4.1; ps có thiết lập cho danh từ upaṭṭhāna); abhiniropana → hướng tâm đến (ps2.1:9.2); pharaṇa → lan tỏa (ps2.4:2.1); paṭisaṅkhāna → suy xét (ps2.9:10.2); ajjhupekkhanā → xả hoàn toàn (cnd17:27.2); visesādhigama → chứng đắc thù thắng, uttaripaṭivedha → thông suốt cao hơn, saccābhisamaya → thấu đạt các chân lý, nirodhe patiṭṭhāpaka → an lập (ps2.9:3.3; ở đó nirodha là tịch diệt, ở đây là diệt tận cho khớp nirodha ở 30.13, 33.8 và 42 đến 53).
    - paṭisambhidā → vô ngại giải (tha-ap490:16.1, tha-ap558:34.1, ps2.10:32.3, mil7.3.4:1.3); vasībhāva → thành thạo (ps1.0:34.1; ps3.2:3.3 và mil5.3.3 dịch làm chủ — tránh trùng ādhipateyya = làm chủ); paripāka → chín muồi (mil3.2.4:2.2, mil6.3.2:14.1); parivāra → tùy tùng (9 ps); paripūraṇa → viên mãn (viên mãn 5 ps · 64 kn khác trên 118); cariya → hành.
    - pakkhandana → hướng đến, pasīdana → tịnh tín, santiṭṭhana → an trú, vimuccana → giải thoát, yānīkata → được dùng như cỗ xe, vatthukata → được làm nền tảng, anuṭṭhita → được hành trì thường xuyên, paricita → được làm cho quen thuộc, susamāraddha → được khéo thực hiện (7 ps; khéo khởi phát 7 kn khác), adhiṭṭhāna → quyết định (ps2.10:29.1; 19 ps · 6 kn khác trên 73; an lập 10 ps), jotana/patāpana → chiếu sáng/làm rực rỡ (ps2.4:19.13).
    - pariyuṭṭhāna → xâm chiếm (ps2.4:6.4); ponobhavika → đưa đến tái hữu (ne17:4.3, ne9:33.4); pamāṇa/appamāṇa → hạn lượng/vô lượng (vô lượng 33 kn khác); sama/visama → bằng phẳng/không bằng phẳng (visama → gồ ghề ở ja477:14.4, ja435:7.4); telappadīpa → đèn dầu; vaṇṇa → màu sắc; tīraṇa → thẩm định (ps1.0:21.1); bodhipakkhiya → thuộc phần giác ngộ (ne8:7.2; trợ giác ngộ ne19:8.15, ne36:7.1); buddhi → trí tuệ (thag1.75:1.2, mil6.4.2:7.1, cnd13:16.2); upavicāra → dò xét (chưa có tiền lệ trong ps, 0 khoá).
    - Các cặp tiền tố bujjhati: bujjhati → giác ngộ, anubujjhati → giác ngộ theo, paṭibujjhati → thức tỉnh, sambujjhati → giác ngộ hoàn toàn; bodhenti và các dạng sau → làm cho …; pakkhiya → thuộc phần …; jotana/ujjotana/anujotana/paṭijotana/sañjotana → chiếu sáng, chiếu sáng lên, chiếu sáng theo, chiếu sáng đáp lại, chiếu sáng hoàn toàn. Đây là cách chọn của bản Việt dựa trên nghĩa tiền tố; không có tiền lệ nguyên cặp trong tầng.

  Bất định, ghi ở đây mà không thêm vào thân kinh:
    (1) 2.3 đến 2.6, 4.1 đến 4.4 và mọi khoá dạng X-ṭṭhaṁ bujjhantīti—bojjhaṅgā: bujjhanti không có chủ ngữ trong Pāli; bản Việt thêm chúng theo ps2.8:2.2 (Chúng vượt qua thế gian nên là xuất thế gian). Chủ ngữ có thể là chính các pháp giác chi hoặc người tu theo chúng; cách đọc nào cũng không được viết vào thân kinh.
    (2) 2.5 và các dạng paṭibujjhati: chọn thức tỉnh theo nghĩa thường của động từ (thức dậy, ví dụ mil5.4.6:1.4); có thể đọc là giác ngộ từng phần hoặc đối ứng, chưa phân xử được.
    (3) cavati (40.11, 40.15, 41.10, 41.13, 45 đến 53): dùng lại lắng xuống của sn46.4 cho khớp công thức đã xuất bản; nghĩa đen của cavati là rời, mất khỏi, lệch nhẹ so với lắng xuống. Tiṭṭhati → còn tồn tại theo sn46.4.
    (4) 40.9, 40.13, 41.8, 41.11: ‘appamāṇo’ti me hoti, ‘susamāraddho’ti me hoti dịch sát chữ là đối với tôi nó là ‘vô lượng’, đối với tôi nó là ‘được khéo thực hiện’; sn46.4 dịch tôi biết, bản Pāli ở đây không có pajānāmi ở chỗ này. Ở 40.9 dấu nháy mở của Pāli đứng trước āvuso, hoti (‘āvuso, hoti, appamāṇo’), có vẻ đặt lệch; bản Việt giữ đủ hai cặp nháy đơn như Pāli nhưng đặt quanh vô lượng và được khéo thực hiện, theo vị trí ở 40.13, 41.8, 41.11.
    (5) susamāraddha: dịch được khéo thực hiện theo ps2.4 (7 khoá ps) để nhất quán; 44.2 và 50.2 giải thích bằng sama/visama (samadhammo nirodho), gợi su-sama-āraddha, nghĩa là khởi đầu một cách khéo và đều; chữ bằng phẳng ở 44.2, 50.2, 30.7 là cách bản Việt nối sama, không có tiền lệ trong ps.
    (6) 30.8 samayaṭṭha dịch ý nghĩa thời điểm theo nghĩa thường của samaya; có thể là sự hội hợp hoặc điều kiện thích hợp, chưa phân xử được từ Pāli một mình.
    (7) 28.12 gataṭṭha dịch ý nghĩa đã đi đến, bám chữ gata; chưa có tiền lệ trong tầng (0 khoá).
    (8) 8.0 Mūlamūlakādidasaka dịch Các Nhóm Mười Bắt Đầu Từ Cội Rễ; mūlamūlaka là hợp từ khó, bản Việt giữ phần mūla và ādi + dasaka; có thể hiểu là cội rễ của cội rễ.
    (9) 21.10 ekattupaṭṭhānavasena cittassa ṭhitaṭṭhaṁ dịch ý nghĩa đứng vững của tâm theo hướng thiết lập tính đồng nhất; vasena dịch theo hướng như ps2.9:19.2.
    (10) 42.2, 42.5, 43.3 nirodhūpaṭṭhāti (nirodha + upaṭṭhāti) dịch diệt tận hiện hữu; vaṇṇo ở 42.4, 48.3 dịch màu sắc (có thể là ánh sáng); 43.2, 49.2, 44.2, 50.2 pamāṇabaddhā dịch bị trói buộc vào hạn lượng; dấu chấm phẩy giữa vế phiền não và vế diệt tận là cách ngắt của bản Việt, Pāli không có dấu câu.
    (11) 29.29 và 29.33 cùng một Pāli sambujjhanaṭṭhaṁ; ở 29.33 theo trật tự (bodhana, anubodhana, paṭibodhana) dạng mong đợi là sambodhana; bản Việt dịch đúng như Pāli ghim, hai khoá giống hệt nhau. 20.6 vosaggaparipūraṭṭhaṁ thiếu ṇa so với paripūraṇaṭṭhaṁ ở 20.5; bản Việt dịch như viên mãn.
    (12) 23.3 līnassa cittassa paggahaṭṭhaṁ dịch nâng đỡ (ps1.0:38.1) thay vì nỗ lực như 21.6, 31.7, 32.9, để giữ nghĩa dành cho tâm chùng xuống; 23.4 niggaha → chế ngự (chưa có tiền lệ ps); 23.1 samādāna → thọ trì (ps2.9:30.1 dịch thọ nhận cho kammasamādāna).
    (13) 33.7, 33.9, 33.11: dấu … trần giữa các vế của Pāli được giữ đúng ba dấu … cho mỗi khoá, bản Việt đặt ở cùng chỗ; 37.12 chỉ có …pe… mà không có vế bujjhantīti—bojjhaṅgā, nên bản Việt kết bằng … và để vế kết ở 37.13.
    (14) 1.4 và 40.3: không thêm và trước xả giác chi như sn46.4:2.3 vì Pāli không có ca; dùng trạch pháp theo 10 khoá ps (thẩm pháp chỉ có ở an4.238, an10.102). 40.5 dịch đủ vocative này hiền giả (sn46.4:2.4 bỏ vocative); 41.1 dịch Seyyathāpi bằng ví như theo mn32:9.10 (sn46.4:3.1 dịch Như thế).
    (15) Hai gốc Pāli cùng ra một chữ Việt theo tiền lệ tầng: nekkhamma và niyyāna đều là xuất ly; padahana và paggaha đều là nỗ lực; vimutta, vimutti và vimokkha đều gần giải thoát; ekagga và ekoda tách bằng nhất tâm và hợp nhất; vīmaṁsā và anupassanā tách bằng thẩm sát và quán sát.
    (16) 6.2 và 7.2: hai nhãn trong ngoặc đơn dịch nguyên chữ (Nhóm bốn thứ năm, Nhóm sáu), không có tiền lệ trong tầng.

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (400 = 400), thứ tự giống Pāli; nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch; 21 khoá có dấu nháy trong Pāli); dấu lược … khớp Pāli từng khoá (0 lệch; 31 khoá có dấu lược, gồm …pe… và … trần); (…) ở 29.6 khớp Pāli (1 khoá có (…) ở cả hai bên, giữ nguyên); Pāli kết …. ở 20.14 và 47.4 (2 khoá) → bản Việt kết ….; NFC đạt; 0 khoá rỗng; không Pāli lọt sang Việt ngoài tên riêng ở khoá tiêu đề và Sāvatthī, Sāriputta; không thẻ HTML. Pāli trùng nguyên văn trong chính bài: 21 nhóm, 47 khoá, bản Việt giống hệt nhau (0 lệch). Pāli trùng nguyên văn với tầng ngoài bài: 16 khoá, 1.117 cặp đã dò, 991 cặp bản Việt giống hệt, 126 cặp khác (Katame satta?: 62 cặp khác trong 124 cặp của hai khoá 1.3 và 40.2, dùng đa số; Sāvatthinidānaṁ: 40 cặp khác trong 926 cặp của hai khoá 1.1 và 39.1; 39.4: 17 cặp khác trong 20; 1.4: 3 cặp; 39.3, 40.4, 40.5, 41.1: mỗi khoá 1 cặp; lý do ở mục thuật ngữ và bất định (14)). Các số Pāli đã tự tính và đối chiếu từng khoá. Đã in và đọc đủ 400 cặp Pāli với Việt.

