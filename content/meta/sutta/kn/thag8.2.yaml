notes: |-
  Bài này CÓ tầng Anh Sujato — đo được, không suy từ tên thư mục. translation/en/sujato/sutta/kn/thag/thag8.2_translation-en-sujato.json có trong cache và được liệt kê trong source/upstream-manifest.json. Thư mục thag của bản Anh đã ghim có 264 tệp, không phải 83. Sujato có prose ở 36/37 khoá và im lặng đúng một khoá, là 8.5.
  Coverage theo source/layers.yaml: Pāli có nội dung (thêm 40 ký tự, bỏ khối :0.x) = 0 khoá, mẫu số bằng 0 nên cổng coverage không chặn — cùng tình trạng với 217 tệp thag đang published.
  ĐỐI CHIẾU ANH: 1.1 đến 5.2 đọc cùng Sujato (Free of anger and acrimony / free of deceit, and rid of slander / does not grieve after passing away) nhưng KHÔNG để Sujato thắng Pāli. akkodha và upanāha là HAI từ riêng, nên dịch thành sân giận và oán hận chứ không gộp theo anger and acrimony — thống kê mọi khoá Pāli chứa upanāh trong tầng đã dịch: oán hận 6 lần, hiềm hận 2, thù ghét 1. rittapesuṇo dùng lại nguyên văn không nói hai lưỡi (snp4.15:7.2).
  6.1 đến 8.4 TRÙNG NGUYÊN VĂN với an4.52:5.1–7.4 (bốn dòng phước chảy tràn trong Caṅkama-vagga, cùng câu kệ) nên dùng lại y nguyên, 11 cặp. 1.3 lấy lại an8.16:3.3, 1.4 và 2.4 đến 5.4 lấy lại sn10.12:8.6, 0.3 lấy lại iti10:0.3. Tổng lát: 24 khoá có Pāli trùng, 23 dùng lại nguyên văn; khoá 7.3 cùng Pāli với an4.52:6.3 nhưng đổi chủ ngữ thành Người ta gọi người ấy để khớp số nhiều của āhu.
  0.2 Aṭṭhakanipāta: 0 tiền lệ trong tầng thag (222 tệp chỉ có nipāta 1 đến 7). Tầng name/ đã ghim cùng commit cho thag-name:258.thag-atthakanipata = The Book of the Eights, và bảng chốt BRIEF_VI3 mục 11 dùng khuôn Bộ N Bài Kinh cho đúng công thức đó (Bộ Một Bài Kinh 120 tệp, Bộ Hai Bài Kinh 49) nên chọn Bộ Tám Bài Kinh. GHI RÕ: 26 tệp thag dùng khuôn Kệ cho nipāta 5–7 (Nhóm Năm, Trưởng Lão Kệ Nhóm Sáu, Bộ Bảy Bài Kệ); nếu muốn thống nhất theo nhóm kế cận thì phải sửa cả hai phía, không sửa một phía.
  0.1: 199/222 tệp thag viết Theragāthá X.Y nên giữ đúng dạng đó. 0.3: 60/222 tệp dùng Phẩm Thứ Nhất. 0.4: đa số dùng Kinh Kệ Của Trưởng Lão X, nên theo đó; Sujato chỉ dịch Sirimitta.
  Guttadvāro ở 2.3: chọn giữ chế các căn — 2 tiền lệ đúng cụm, và tầng đã dùng căn cho indriya 28 lần; Sujato dịch sense doors always guarded nhưng thuật ngữ căn là quy ước của kho.
  BẤT ĐỊNH Adaliddo ở 7.3: taṁ là số ít còn āhu là số nhiều. Chọn Người ta gọi người ấy là không nghèo khó, giữ cả hai số; tiền lệ an4.52:6.3 dùng người ấy cũng theo cách này.
  8.5: Pāli khoá này có HAI dấu lược, đếm được 2, nên giữ đúng hai theo mẫu thag1.100:1.5.
  Tầng vietnamese-current vắng (commit đã ghim chỉ có 26 tệp Pháp Cú) và english-project không có cho bài này; cả hai không gây mất tầng tham khảo vì Sujato đã phủ mọi khoá có Pāli.
  Cổng kỹ thuật: npm run validate, npm test, npm run check do coordinator chạy; npm run build cần thêm vì bài này published. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
