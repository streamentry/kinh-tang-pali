notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của harness gần như không kiểm gì ở bài này, nên tôi tự quét toàn bộ khoá từ đĩa.** Mọi vế kệ ngắn hơn 40 ký tự nên bộ lọc `substantivePaliMinChars: 40` trong `source/layers.yaml` không thấy segment nào; tôi đọc Pāli thật của từng khoá từ `.cache/upstream/suttacentral/` theo `sourcePath` trong catalog, đối chiếu tay với bản Việt, rồi quét máy: tập khoá Việt bằng đúng tập khoá Pāli (17/17, đúng exact ID, không orphan), mọi giá trị NFC và không rỗng, ngoặc kép cong cân trên cả bài, không có `(…)`, dấu lược khớp Pāli từng khoá.
  - |-
    **Không thể tuyên bố technical gate pass.** Đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tiêu chí 10 bị chặn ở 9.6: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, NFC, ngoặc kép cân cả bài và YAML sạch. Người biên tập phải chạy lại bốn lệnh trên trước khi đổi trạng thái.
  - |-
    **Lỗi chặn: hai khoá `2.3` và `2.4` đảo nội dung.** Pāli `2.3` = `Ahi mūsikasobbhaṁva,` và `2.4` = `sevetha sayanāsanaṁ.`; bản Việt `2.3` = *hãy nằm ngủ trong tịnh xá* (theo `2.4`) và `2.4` = *giống rắn nằm cuộn trong lỗ chuột* (theo `2.3`). Người đọc bốn cột sẽ thấy Pāli đứng cạnh một câu Việt không ứng với nó, mà không có cách nào biết đó là lỗi. Đây là lý do AGENTS.md yêu cầu giữ nguyên canonical segment ID: khoá là đơn vị đối chiếu. **Tôi không sửa, vì đợt này chỉ chấm điểm.**
  - |-
    **Ba khoảng `Sukhañce jīvituṁ icche, sāmaññasmiṁ apekkhavā` lặp nguyên văn và lặp nguyên văn cách dịch** ở `1.1–1.2`, `2.1–2.2`, `3.1–3.2` — đúng như Pāli lặp, không phải lặp do dịch. Đây là điểm tốt, không phải lỗi lặp khuôn.
  - |-
    **Chỗ hơi lệch, đã ghi.** `1.3–1.4` `Saṅghikaṁ nātimaññeyya, cīvaraṁ pānabhojanaṁ`: Pāli để `Saṅghikaṁ` sửa cho cả hai danh từ `cīvaraṃ` và `pānabhojanaṃ` (y phục của Tăng đoàn, và nước uống lẫn thức ăn); bản Việt đặt *của Tăng đoàn* ở `1.4` nên nó bám vào *nước uống và thức ăn* mà không bám vào *y phục* ở `1.3`. Nghĩa vẫn đúng nhưng phạm vi tính từ lệch một chỗ.
  - |-
    **Thuật ngữ có tiền lệ.** `sāmañña` → *sa-môn* giữ nguyên Hán–Việt vì đây là từ khoá của cả Tikanipāta; `sīla` → *giới hạnh*; `Itarītarena tusseyya` → *hãy lấy làm đủ với bất cứ gì được cho* giữ được `itarītara` (cái này hay cái kia) thay vì rút gọn thành *một thứ*.
  - |-
    **Tầng Anh.** 12/13 khoá nội dung có prose Sujato, im lặng ở `3.5` dòng bảng hiệu. `englishCoverage` không đo được cho bài vì mọi vế kệ dưới 40 ký tự.
