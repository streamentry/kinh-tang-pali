notes: |-
  Bài kệ ngắn: mẫu số coverage bằng 0 theo công thức `source/layers.yaml`; đã tự quét MỌI khoá từ đĩa.
  **4 khoá có Pāli trùng nguyên văn ở bài khác; 3 cặp dùng lại NGUYÊN VĂN.** `0.1` trùng `ja183:0.1` (*Jātaka*) · `0.3` trùng byte-for-byte `ja424:0.3` (*Phẩm Kaccānivagga*).
  **`0.2` là chỗ đáng ghi nhất của lát này.** Pāli `Aṭṭhakanipāta` trùng nguyên văn với `thag8.2:0.2`, và bản Việt ở đó là *Bộ Tám Bài Kinh*. Nhưng đo trên **giá trị Pāli tuyệt đối** trong lớp `ja` cho *Aṭṭhakanipāta* là 1/1 *Bộ Tám Bài Kệ* (`ja424:0.2`), và chuỗi *Bộ Sáu Bài Kệ* (15/15) · *Bộ Bảy Bài Kệ* (11/11) · *Bộ Tám Bài Kệ* (1/1) là nhất quán. Đã theo số đo của lớp `ja`, không theo `thag` — và ghi rõ ở đây vì hai bài khác nhau, người gộp lát có thể muốn thống nhất cả tầng.
  **Tên tầng khác:** `0.1` → *Jātaka* (381/397) · `0.3` → *Phẩm Kaccānivagga* (theo ja424) · `0.4` mẫu *N. Kinh <tên Pāli>* · `mahārāja` → **vua** trong lớp `ja` (96 lần so với *đại vương* 13).
  **Bất định đã ghi, không bịa:** (1) `7.3` `Sā maṁ saṇhena mudunā` — `sā` mà đại từ thì không có tiền thân rõ ràng trong chính bài này (bài không có phần văn xuôi kể trước, chỉ có kệ), tôi dịch *nàng*; nếu là ngựa hoặc thú thì phải sửa. (2) `7.4` `khali yasmani` — `khali` là bùn, còn `yasmani` tôi chưa chắc là danh từ hay động từ, nên dịch trung tính *nơi bùn lầy* thay vì khẳng định. (3) `2.2` `bandharassakkhi` tôi đọc là *cai tù* (canh giữ tù nhân) — cũng có thể là *kẻ canh giữ*, đã ghi.
  **Khoá trùng Pāli nhưng bị loại:** `7.3` trùng `thag7.1:2.3` (*Nàng nhằng nhẹ, mềm mại nói với tôi*) — đó là `thag`, câu chuyện khác và chủ ngữ là người, không phải `sā` ở đây; đã dịch mới.
  **Lỗi bắt được ở lượt review đối kháng, đã sửa:** (1) `2.1` `asīlassa` bản nháp dịch *Kẻ vô ơ thứ hai* — sai hoàn toàn, `asīla` là không có giới; đã sửa thành *Người không có giới thứ hai*. (2) `3.4` `ghuṇo` là số nhiều (2 ngôi) nhưng bản nháp dùng *ta*; đã sửa thành *các người*.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  **Sửa lan 2026-10-13** (accuracy fix): `4.1` và `5.1` `Sā/So nūnāhaṁ ito gantvā` — bản cũ *Chắc hẳn người ấy đã đi khỏi đây* đọc `ahaṁ` (tôi) thành ngôi thứ ba; Pāli là người nói tự xưng (`sā` = nữ, `so` = nam), nên sửa thành *Vậy thì ta, đi khỏi nơi này,* theo đúng Pāli trùng `ja374:6.3` (*vậy thì ta, đi khỏi nơi này,*). `4.2` *thoát khỏi quyền lực của vua* → *thoát khỏi nơi cư trú của vua* (`nivesanā`, khớp `5.2` của chính bài). `4.4` `dumasākhaniketinī` *trên chiếc giường vỏ cây khô* → *sống trên cành cây* (`duma` cây + `sākhā` cành + `niketinī` người ở; bản cũ thêm chữ *giường* và *khô* không có trong Pāli). Chỗ còn nghi, chưa sửa vì ngoài phạm vi lượt này: `1.3` `bakarājassa` dịch *vua hươu* (`baka` là con diệc/cò), `1.5` `bhekena` dịch *ruồi* (`bheka` là ếch), `5.3` `aggodakāni` dịch *giọt sương*.

  Sửa lan 2026-10-13 (accuracy fix, lượt kiểm sửa lan): (1) `1.3` `bakarājassa`: *vua hươu* → *vua cò* (`baka` là cò/diệc, không phải hươu; tiền lệ `ja547:317.4` `bako macchamivodake` → *cò*). (2) `1.5`–`1.6` `Tyajja bhekena yāpema, okaṁ na vijahāmase`: *Bây giờ hãy rời bỏ đi cùng đám ruồi, / chúng ta sẽ không ở lại nơi này* → *Nay chúng ta sống nhờ ếch, / nhưng không rời bỏ nơi ở của mình*. Căn cứ: `bheka` là ếch (`dn24:2.10.3` `bheke` → *ếch nhái*, `ja547:337.4` `bhekavaṇṇā` → *màu ếch*), không phải ruồi; và bản cũ tự mâu thuẫn (*rời bỏ* rồi *không ở lại*) trong khi `okaṁ na vijahāmase` là *không rời bỏ nơi ở*; vì vậy phải sửa cả `1.6` để câu nhất quán. (3) `5.3` `aggodakāni`: *những giọt sương* → *nước thượng hạng* (`aggodaka` là nước hàng đầu; tiền lệ `mn99:19.6`, `mn5:15.2` *nước rửa tay thượng hạng* / *nước uống tốt nhất*). BẤT ĐỊNH: `Tyajja` đọc là `te` + `ajja` (*nay chúng ta*) — không có tiền lệ trong tầng, tầng Anh không có bản cho bài này; `aggodaka` ở `5.3` có thể là *nước đầu tiên/đầu nguồn* thay vì *thượng hạng*. Chưa đổi (ngoài mô tả sửa lan, cần rà lại): `1.4` *là tổ ấy của ta* (`pettikaṁ bhavanaṁ`), `2.x`, `6.3`–`6.4`.
