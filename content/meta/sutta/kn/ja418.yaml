notes: |-
  Bài kệ ngắn: mẫu số coverage bằng 0 theo công thức `source/layers.yaml`; đã tự quét MỌI khoá từ đĩa.
  **4 khoá có Pāli trùng nguyên văn ở bài khác; 3 cặp dùng lại NGUYÊN VĂN.** `0.1` trùng `ja183:0.1` (*Jātaka*) · `0.3` trùng byte-for-byte `ja424:0.3` (*Phẩm Kaccānivagga*).
  **`0.2` là chỗ đáng ghi nhất của lát này.** Pāli `Aṭṭhakanipāta` trùng nguyên văn với `thag8.2:0.2`, và bản Việt ở đó là *Bộ Tám Bài Kinh*. Nhưng đo trên **giá trị Pāli tuyệt đối** trong lớp `ja` cho *Aṭṭhakanipāta* là 1/1 *Bộ Tám Bài Kệ* (`ja424:0.2`), và chuỗi *Bộ Sáu Bài Kệ* (15/15) · *Bộ Bảy Bài Kệ* (11/11) · *Bộ Tám Bài Kệ* (1/1) là nhất quán. Đã theo số đo của lớp `ja`, không theo `thag` — và ghi rõ ở đây vì hai bài khác nhau, người gộp lát có thể muốn thống nhất cả tầng.
  **Tên tầng khác:** `0.1` → *Jātaka* (381/397) · `0.3` → *Phẩm Kaccānivagga* (theo ja424) · `0.4` mẫu *N. Kinh <tên Pāli>* · `mahārāja` → **vua** trong lớp `ja` (96 lần so với *đại vương* 13).
  **Bất định đã ghi, không bịa:** (1) `7.3` `Sā maṁ saṇhena mudunā` — `sā` mà đại từ thì không có tiền thân rõ ràng trong chính bài này (bài không có phần văn xuôi kể trước, chỉ có kệ), tôi dịch *nàng*; nếu là ngựa hoặc thú thì phải sửa. (2) `7.4` `khali yasmani` — `khali` là bùn, còn `yasmani` tôi chưa chắc là danh từ hay động từ, nên dịch trung tính *nơi bùn lầy* thay vì khẳng định. (3) `2.2` `bandharassakkhi` tôi đọc là *cai tù* (canh giữ tù nhân) — cũng có thể là *kẻ canh giữ*, đã ghi.
  **Khoá trùng Pāli nhưng bị loại:** `7.3` trùng `thag7.1:2.3` (*Nàng nhằng nhẹ, mềm mại nói với tôi*) — đó là `thag`, câu chuyện khác và chủ ngữ là người, không phải `sā` ở đây; đã dịch mới.
  **Lỗi bắt được ở lượt review đối kháng, đã sửa:** (1) `2.1` `asīlassa` bản nháp dịch *Kẻ vô ơ thứ hai* — sai hoàn toàn, `asīla` là không có giới; đã sửa thành *Người không có giới thứ hai*. (2) `3.4` `ghuṇo` là số nhiều (2 ngôi) nhưng bản nháp dùng *ta*; đã sửa thành *các người*.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  **Sửa lan 2026-10-13** (accuracy fix): `4.1` và `5.1` `Sā/So nūnāhaṁ ito gantvā` — bản cũ *Chắc hẳn người ấy đã đi khỏi đây* đọc `ahaṁ` (tôi) thành ngôi thứ ba; Pāli là người nói tự xưng (`sā` = nữ, `so` = nam), nên sửa thành *Vậy thì ta, đi khỏi nơi này,* theo đúng Pāli trùng `ja374:6.3` (*vậy thì ta, đi khỏi nơi này,*). `4.2` *thoát khỏi quyền lực của vua* → *thoát khỏi nơi cư trú của vua* (`nivesanā`, khớp `5.2` của chính bài). `4.4` `dumasākhaniketinī` *trên chiếc giường vỏ cây khô* → *sống trên cành cây* (`duma` cây + `sākhā` cành + `niketinī` người ở; bản cũ thêm chữ *giường* và *khô* không có trong Pāli). Chỗ còn nghi, chưa sửa vì ngoài phạm vi lượt này: `1.3` `bakarājassa` dịch *vua hươu* (`baka` là con diệc/cò), `1.5` `bhekena` dịch *ruồi* (`bheka` là ếch), `5.3` `aggodakāni` dịch *giọt sương*.

  Sửa lan 2026-10-13 (accuracy fix, lượt kiểm sửa lan): (1) `1.3` `bakarājassa`: *vua hươu* → *vua cò* (`baka` là cò/diệc, không phải hươu; tiền lệ `ja547:317.4` `bako macchamivodake` → *cò*). (2) `1.5`–`1.6` `Tyajja bhekena yāpema, okaṁ na vijahāmase`: *Bây giờ hãy rời bỏ đi cùng đám ruồi, / chúng ta sẽ không ở lại nơi này* → *Nay chúng ta sống nhờ ếch, / nhưng không rời bỏ nơi ở của mình*. Căn cứ: `bheka` là ếch (`dn24:2.10.3` `bheke` → *ếch nhái*, `ja547:337.4` `bhekavaṇṇā` → *màu ếch*), không phải ruồi; và bản cũ tự mâu thuẫn (*rời bỏ* rồi *không ở lại*) trong khi `okaṁ na vijahāmase` là *không rời bỏ nơi ở*; vì vậy phải sửa cả `1.6` để câu nhất quán. (3) `5.3` `aggodakāni`: *những giọt sương* → *nước thượng hạng* (`aggodaka` là nước hàng đầu; tiền lệ `mn99:19.6`, `mn5:15.2` *nước rửa tay thượng hạng* / *nước uống tốt nhất*). BẤT ĐỊNH: `Tyajja` đọc là `te` + `ajja` (*nay chúng ta*) — không có tiền lệ trong tầng, tầng Anh không có bản cho bài này; `aggodaka` ở `5.3` có thể là *nước đầu tiên/đầu nguồn* thay vì *thượng hạng*. Chưa đổi (ngoài mô tả sửa lan, cần rà lại): `1.4` *là tổ ấy của ta* (`pettikaṁ bhavanaṁ`), `2.x`, `6.3`–`6.4`.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 39/39 khoá. Kết luận: bản đã `published` trước đó có lỗi nghĩa nghiêm trọng ở 2.x, 3.x, 6.x, 7.x, 8.x mà điểm cũ không phản ánh; điểm cũ bị thổi phồng. Đổi 25/39 khoá (accuracy fix trừ khi ghi khác):
  (1) `1.1`–`1.2` *được gọi là ao đầy cá chằng chặt, nước nhiều* → *là chốn trũng sâu, / lắm cá, nhiều nước* (`ninna` chỗ trũng; *chằng chặt* không đúng tiếng Việt). `1.4` `pettikaṁ bhavanaṁ` *tổ ấy của ta* → *nhà của cha ông ta* (bản cũ bỏ `pettika`). `1.5` *sống nhờ ếch* → *sống bằng ếch* (`yāpema` + cách công cụ, tiền lệ `mn12:53-55.4` *sống bằng đậu xanh*).
  (2) `2.1`–`2.4` dịch lại toàn bộ: bản cũ *Người không có giới thứ hai là ai, / đã thoát khỏi tay cai tù? / Ai là người cùng họ của ta, / sẽ làm cho ta có một chiếc giường êm ái* không có căn cứ Pāli (`bhecchati` là tương lai của `bhindati` — làm vỡ; `akkhi` là mắt; `kulāvaka` là tổ, tiền lệ `sn11.6`, `ja33:0.3`; `sotthiṁ karissati` là làm cho an toàn). Nay: *Ai sẽ làm vỡ con mắt thứ hai / của Bandhara, kẻ ác đức? / Ai sẽ làm cho các con ta, tổ ta, / và chính ta được an toàn?* Ranh khoá `2.1`/`2.2` dồn lại trong cặp câu kệ để tiếng Việt đọc được.
  (3) `3.1`–`3.4`: bản cũ *đã bị đốt sạch* (Pāli không có lửa), *sự tinh hoa … các người* (`ghuṇo`, `ramatī` là số ít; `sāra` là lõi gỗ). Nay: *Toàn bộ giác gỗ đã cạn hết, / khắp mọi nơi nó có mặt; / Hết thức ăn rồi, tâu đại vương, / con mọt chẳng ưa lõi gỗ* (`pheggu` → *giác gỗ* theo `mn29:2.9` *giác cây*; `tassā` giống cái nên chỉ `pheggu`). Terminology fix `mahārāja` hô ngữ: trong lớp `ja`, *tâu đại vương* 160 · *đại vương* 14 · *hỡi vua* 1 (chính khoá này); số *vua 96 / đại vương 13* ghi ở notes cũ không tái lập được.
  (4) `5.3` `aggodakāni` *nước thượng hạng* → *nước trước tiên* (`agga` = đầu/trước; câu kế `yūthassa purato vajaṁ` đi đầu đàn).
  (5) `6.1`–`6.4` dịch lại toàn bộ: bản cũ *Hãy đưa bậc Bồ-tát ngu ngốc kia đến đây, / hỡi bạn ơi, ta có một điều lành cho ngươi* là bịa (Pāli không có Bồ-tát, không có mệnh lệnh; `ānayī` là quá khứ ngôi ba *đã mang về*; `luddo` thợ săn; `bhaddamatthu te` là lời chúc, tiền lệ `ja538:45.2` *chúc ngài an lành*). `taṁ maṁ` là người nói tự xưng, không phải *kẻ kia*. Nay: *Ta đây, say sưa vì dục lạc, / đắm nhiễm, mê mẩn trong các dục, / đã bị gã thợ săn Bharata, / người xứ Bāhika, mang về đây. Chúc ngài an lành!* (động từ dồn sang `6.4`).
  (6) `7.1` *Trong rừng tối tăm* → *Giữa bóng tối dày đặc mịt mù* (`andhakāratimisā` không có *rừng*; tiền lệ `dn27:11.1`). `7.4` *đừng đặt bước chân lên nơi bùn lầy* → *chớ để chân vấp vào đá* (`mā … khali` = `mā` + quá khứ của `khalati` vấp, cấm chỉ; `yasmani` = `y` nối âm + `asmani` vị trí cách của `asma` đá; không có *bùn*). `7.3` bỏ *đã*, theo cách nói của `thag7.1:2.3` (style-only).
  (7) `8.1`–`8.4`: bản cũ bỏ `asaṁsayaṁ` (*chắc chắn*), làm mờ ngôi thứ nhất `āvajissaṁ`, đổi xưng *ta*/*tôi* giữa bài, dịch `saṁsāra` là *vòng sanh*. Nay: *Chắc chắn, ta là người thấy sự tận diệt của sinh, / sẽ không còn trở lại nằm thai nữa; / Đây là lần nằm thai cuối cùng, sau chót, / ta đã tận luân hồi, không còn tái sinh nữa.* (`jātikhayantadassī` theo `iti46:3.2`; *nằm thai* theo `an8.11:10.4`, `snp1.2:12.4`).
  Giữ nguyên có chủ ý: `4.1`/`5.1` *Vậy thì ta* (Pāli trùng `ja374:6.3`); `4.2`/`5.2`; `4.3`–`4.4`; `5.4`; khoá `:0` và `9.1`.
  BẤT ĐỊNH còn lại (không phân xử được bằng nguồn có trong kho; bài chỉ có kệ, không có văn xuôi kể chuyện, tầng Anh và Việt hiện hành đều vắng): (a) `2.1` `dutiyaṁ` đọc là tính từ đi với `akkhi` (*con mắt thứ hai*) vì cùng giống trung đối cách; cách đọc *ai sẽ là người thứ hai/bạn đồng hành* đòi `dutiyo` nên ít khả năng hơn, nhưng chưa kiểm được bằng chú giải. (b) `bandhara`, `bharato`, `bāhiko` dịch là tên riêng/xứ; `bandhar-` chỉ xuất hiện một lần trong toàn Pāli root; `bāhiko` cũng có thể là *người ngoài/ngoại xứ* (`pe8:211.2` `bāhikā` = ở bên ngoài). (c) `1.1` `āhu` đọc là *đã là* (dạng kéo dài của `ahu`); cũng có thể là *người ta nói*. (d) `5.3` `aggodaka` có thể là *nước tốt nhất* thay vì *nước đầu tiên*. (e) `3.2` `yāva tassā gatī ahu` dịch theo nghĩa phạm vi. (f) `7.4` `asmani` không có dạng nào khác trong Pāli root để đối chiếu. Không thêm blocker cho các điểm này vì không điểm nào đổi giáo nghĩa, nhưng đã hạ `semantic_fidelity` và `ambiguity_integrity`.
  Phép kiểm: tập khoá 39/39, thứ tự khớp Pāli; nháy kép/đơn khớp Pāli từng khoá 0 lệch / 39; không có `…` (Pāli không có); NFC sạch; cặp Pāli trùng nguyên văn trong chính bài: 0 (phép rỗng — `4.1`/`5.1` và `4.2`/`5.2` khác nhau một chữ); không có số Pāli ngoài `dutiyaṁ` (thứ hai).
  Điểm: semantic_fidelity 9.1 → 8.6, grammar_logic 9.2 → 8.8, segment_alignment 10.0 → 9.6 (dồn ranh khoá ở `2.1`/`2.2`, `6.3`/`6.4`), terminology 9.1 → 9.0, vietnamese_clarity 9.2 → 9.0, han_viet_balance 9.4 → 9.2, ambiguity_integrity 9.0 → 8.6; source_provenance 9.4, triangulation 7.4 (không có bản Anh, không có bản Việt hiện hành), technical_integrity 9.6 giữ nguyên. final_score 9.14 → 8.92. Cổng kỹ thuật chưa chạy trong lượt này: npm run validate; npm test; npm run check; npm run build.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 18 khoá chênh lệch lớn nhất (6.4, 7.1, 0.4, 3.1, 3.2, 0.2, 2.2, 1.4, 6.1, 7.4, 0.3, 2.4, 4.4, 6.3, 2.1, 1.1, 5.3, 7.3) → khác nghĩa 4: sửa 0, giữ 2, bất định 2. Giữ: 3.1–3.2 (bản mù đọc «mọi thứ tàn tạ, chỉ còn giác gỗ», trái với khoá kế tiếp khīṇabhakkho «hết thức ăn» — mọt đã ăn hết giác gỗ nên bản dự án đúng mạch); 2.1–2.2 (bản mù đọc dutiyaṁ là «bạn thứ hai», nhưng dutiyaṁ đứng cùng giống, số, cách với akkhi nên là tính từ của «con mắt», còn asīlissa đi với bandharassa; chính bản mù cũng ghi không chắc). Bất định: 6.4 bāhiko (bản dự án đọc là danh xưng của gã thợ săn Bharata, cách một, đồng vị với luddo; bản mù đọc là lời gọi «hỡi kẻ ngoại hương» — hô cách của danh từ gốc -a thường là bāhika chứ không phải bāhiko, nhưng trong kệ có thể có -o, nên không loại hẳn) và 1.1 ninnamāhu (āhu «đã là» hay «người ta gọi», bản mù chọn «gọi»; đã ghi ở bất định (c) phần trước). Các khoá còn lại chỉ khác diễn đạt (7.1 «bóng tối dày đặc» / «đêm tối đen», 1.4, 6.1, 7.3, 7.4, 2.4, 4.4, 5.3 «nước trước tiên» / «nước đầu nguồn», 0.2–0.4 là tên phẩm và nhan đề theo quy ước tầng). Đọc lại toàn bài (39 khoá): nháy kép khớp Pāli, xưng hô «ta» nhất quán, không số Pāli ngoài dutiyaṁ, thuật ngữ nhất quán trong bài. Không có bản Anh hay bản Việt độc lập khác.
