notes: |-
  Tiền lệ đếm được trên tầng Việt tha-ap (Pāli trùng nguyên văn). Dòng 0.1 giữ Therāpadāna (495 so với 11 Trưởng Lão Ký Sự). 0.2 theo Phẩm Phaladāyaka, khớp tha-ap519, tha-ap520, tha-ap522 (5 so với 3 Phẩm Cúng Dường Trái Cây và 1 Phẩm Quả Dâng Cúng). 0.3 và 29.1 theo kiểu việc-làm Ký Sự Về Trưởng Lão Cúng Dường X; ở các bài kề cận tha-ap495 đến tha-ap562 là Ký Sự 23 so với Bài Kệ Tuyên Ngợ 13, còn toàn phẩm là Bài Kệ Tuyên Ngợ 213, Tuyên Ngôn 134, Ký Sự 90. Hai phạm vi cho hai đa số khác nhau; bài này theo phạm vi gần nhất (cùng phẩm, tha-ap519, tha-ap520, tha-ap531) và giữ chữ Ký Sự; cách đặt Tuyên Ngợ so với Tuyên Ngôn là vấn đề chung của cả cuốn, xin biên tập phán một lượt. :0.3 của Pāli (Sabbaphaladāyakattheraapadāna) không bắt đầu bằng số nên bản Việt không thêm số, và translationTitle bằng đúng giá trị :0.3.
  Công thức lặp: Tepi maṁ vasamanventi (bốn lần, 12.3 14.3 16.3 17.3) dịch giống nhau; phaladānassidaṁ phalaṁ dịch đây là quả báo của việc dâng cúng trái cây (17 so với 10 đó chính là quả báo của việc cúng dường hoa trái trên toàn tầng; gần nhất 7 so với 6); Yāvatā vanasaṇḍamhi (4.1 và 13.1, cùng Pāli) dịch giống nhau, theo tiền lệ Trong khắp khu rừng rậm. Pāli trùng nguyên văn trong chính bài: 5 nhóm, 0 nhóm mà Việt khác. Pāli trùng nguyên văn với tầng tha-ap: 48 trên 110 khoá; Việt dùng lại nguyên văn 41 khoá, 7 khoá khác có lý do: 1.1, 3.3, 8.4 đổi tôi thành ta cho khớp giọng ta của bài; 9.1 viết hoa chữ đầu theo Pāli; 2.3 dịch chòi lá (tha-ap283, tha-ap425) thay cho túp lều quán tư của tha-ap261; 5.2 bỏ chữ hướng đến vì Pāli không có; 11.4 xem bất định (3). Tha-ap520 và tha-ap522 kề cận dùng giọng ta.
  Công thức Kilesā jhāpitā, Svāgataṁ vata me āsi, Paṭisambhidā catasso, kataṁ buddhassa sāsanaṁ: theo tiền lệ (102 so với 24 và 17; 97 so với 24 và 7; 492 so với 8 và 3; 114 và 461 khoá), mỗi chỗ Pāli …pe… giữ đúng một …. Lời kết Itthaṁ sudaṁ … abhāsitthāti dùng nhóm số nhiều đã đo (407 khoá những bài kệ này, so với 21 khoá bài kệ này); tên ở 28.1 giữ dạng -o khớp Pāli của đúng khoá vì chưa có trên đĩa (tiền lệ tha-ap520). Duggatiṁ nābhijānāmi: phạm vi gần nhất 15 khoá Ta không còn biết đến đọa xứ, so với toàn tầng 137 Ta không biết mình rơi vào khổ đau và 92 Tôi không còn biết đến đọa xứ nào; theo gần nhất (cũng là cách dịch của tha-ap520). Satasahassito kappe (24.1): gần nhất 4 khoá kiếp trước đây, 2 kiếp nữa, 1 đại kiếp trước; toàn tầng đại kiếp trước 26, kiếp trước đây 7; theo gần nhất vì Pāli là kappe chứ không phải mahākappe. Đây là quá khứ (yaṁ phalaṁ adadiṁ tadā), không phải lời thọ ký tương lai, nên không dùng cách nói nữa.
  Số Pāli đã tự tính: dasa puttāni là mười người con (10); caturo dīpā là bốn châu (4); vimokkhe aṭṭha là tám giải thoát (8); tevijjā là ba minh (3); satasahassito kappe là một trăm ngàn kiếp trước (sata 100 nhân sahassa 1000 bằng 100.000); paṭisambhidā catasso là bốn vô ngại giải (4). Không có Tiṁsa trong bài. Không có số Pāli nào chưa phân xử được.
  Kiểm máy do tác giả chạy: tập khoá Việt bằng tập khoá Pāli (110 so với 110, đúng thứ tự); nháy đơn và nháy kép khớp Pāli từng khoá (4 khoá có nháy, 0 lệch; nháy ‘ ’ mở ở 7.1 và đóng ở 7.4 nằm trong ngoặc kép mở ở 1.1 và đóng ở 27.3, cố ý chạy qua khoá); …pe… thành đúng một … (3 khoá, 0 lệch; Pāli không có … trần); NFC, khoá rỗng, khoảng trắng thừa: 0; Pāli lọt sang Việt: chỉ tên riêng Therāpadāna, Phaladāyaka, Varuṇa, Padumuttara, khārī (tiền lệ Mang lấy gánh khārī ở tha-ap531 và tha-ap555) và Sabbaphaladāyako.
  Bất định, không đưa vào thân kinh. (1) Puṭakantaṁ (8.1): hiểu là puṭakaṁ taṁ (cái bọc ấy), nối với pattapuṭaṁ ở 5.3; pattapuṭa là bọc lá (hoặc túi đựng bát, vì patta có thể là lá hay bát), chọn bọc lá theo ngữ cảnh đựng trái cây. (2) Sahakhārimadāsahaṁ (6.2): dịch ta đã dâng cùng với gánh khārī; vật được dâng đã nêu ở 5.3 và 5.4 nên không thêm tân ngữ. (3) Issaraṁ kārayāmahaṁ (11.4): dịch ta đã làm vị chúa tể; tiền lệ tha-ap225 chỉ một khoá và dịch đã làm nên vị chúa tể; thì của kārayāmi là hiện tại nhưng nằm trong lời kể quả báo quá khứ nên dịch có đã. (4) Yāvatā me pakkhigaṇā (12.1): me dịch bằng Đối với ta, không thêm sở hữu. Ce ở 12.2 dịch nếu. (5) Osadhītiṇavāsī ca (18.1): dịch Loài sống nơi cây thuốc và cỏ, không bảo đó là chư thiên vì Pāli không nói. (6) Suvibhattaṁ (2.2): phân chia khéo léo; suppakāsitaṁ (19.2): khéo được làm sáng tỏ; hai từ không có tiền lệ trong tầng. (7) Tādino (5.2): bậc như thị theo tiền lệ hai khoá cùng Pāli; toàn tầng cho tādino nhiều cách khác nhau (bậc Vững Vàng kiên định 10, bậc như thị, đấng Như Thật, bậc Bất Động) nên chưa có đa số. (8) Pāṭihīra (5.1): phép lạ, không có tiền lệ. (9) Mantapāragū (1.2): rất thông thạo lời tụng (4 khoá, tha-ap136) so với thông suốt thần chú (3 khoá). (10) Supaṇṇā (15.1) dịch kim sí điểu, garuḷā (13.3) dịch ca-lâu-la; kumma soṇa madhukāra ḍaṁsa makasa (14) dịch rùa, chó, ong, ruồi, muỗi. (11) Bản Pāli đã ghim dùng …pe… ở ba khoá 25.2, 26.2 và 27.2, bản in khác có chép đủ; bản dịch chỉ theo Pāli đã ghim và giữ một … mỗi chỗ.
  Coverage English: mẫu số là 2 khoá (28.1 dài 68 ký tự và 29.1 dài 41 ký tự, đều là dòng kết, bỏ khối :0); 108 khoá còn lại, gồm toàn bộ thân kệ, dưới ngưỡng 40 ký tự nên nằm ngoài mẫu số và cổng không đo được gì về phần kệ. Sujato phủ 0 trên 2 khoá có nội dung và 0 trên 110 khoá (tầng english-sujato không có tha-ap thân kinh); vietnamese-current không phủ; english-project chưa có. Có đọc thêm tra cứu toàn văn Việt không phân đoạn của SuttaCentral để hiểu cú pháp, và không sao chép vì chỉ là nguồn tra cứu.
