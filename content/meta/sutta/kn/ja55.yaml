notes: |-
  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all; file Pāli và file en/sujato so git-hash với manifest và khớp. english-sujato CÓ mặt: 10/11 khoá có prose, khoá 2.1 để trống.
  Tiền lệ có đếm: Āsīsavagga → Phẩm Hy Vọng (8 tệp: ja51–ja54, ja57–ja59); colophon không dấu phẩy, khớp cả 8 tệp cùng phẩm.
  Pāli trùng nguyên văn giữa hai bài đã xử bắt buộc, không dịch lần hai: khoá 1.3 Bhāveti kusalaṁ dhammaṁ, 1.4 yogakkhemassa pattiyā, 1.5 Pāpuṇe anupubbena và 1.6 sabbasaṁyojanakkhayan trùng y hệt với ja56:1.3–1.6, nên hai bài dùng chung một cách dịch. Riêng 1.5 và 1.6 còn trùng với iti17:3.5 và iti17:3.6 (đã publish), lấy nguyên văn: sẽ tuần tự đạt đến / sự tận diệt mọi kiết sử. Việc này được đo bằng script so nguyên văn Pāli của 132 khoá lát này với 106.021 cặp Pāli↔Việt đã có trong tầng, ra 42 khoá trùng; không khoá nào của lát này còn dịch khác tiền lệ.
  Thuật ngữ: alīna là không vướng, dùng cho cả cittena (tâm) và manas (ý) nên 1.1–1.2 giữ hai chữ tâm và ý. yoga là gông trói, yogakkhema là sự an ổn (iti17:2.1 cũng dịch an ổn); vì thế 1.4 là để mong đạt sự an ổn, thoát khỏi gông trói. 0 tiền lệ: Ngũ Binh, đặt mới cho Pañcāvudha (pañca = năm, vudha = binh = vũ khí), cùng cách đặt tên theo nghĩa như Kinh Ngũ Pháp Khí của các bài khác.
  Sujato dịch yogakkhemassa là sanctuary from the yoke; tôi dịch sự an ổn, thoát khỏi gông trói để giữ cả hai nghĩa của yoga. Không có segment Pāli ≥ 40 ký tự nên sàn coverage không kích hoạt; không có bản Hòa thượng Thích Minh Châu ở commit đã ghim.
