notes: |-
  Đợt 19, làn 57. Dịch từ Pāli root commit đã ghim, đủ 77/77 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; vì vậy người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung kệ (xem bất định 1). Bài không có số lượng nào cần tính ngoài số thứ tự `3.` ở `0.4` và `tatiyaṁ` ở `19.1` (đều là 3 ⇒ “thứ ba” khớp). Pāli không có dấu lược `…` hay `(…)`, bản Việt cũng không có (0/77 và 0/77).

  **Tiêu đề.**
  - `0.2` `Pakiṇṇakanipāta` → “Bộ Tạp Tập” và `0.3` `Sālikedāravagga` → “Phẩm Ruộng Lúa”: dùng lại đúng cách đặt tên của bài anh em cùng bộ, cùng phẩm `ja490` (cùng đợt) để hai bài nhất quán; tầng có 0 tiền lệ độc lập cho hai tên này (xin người điều phối quyết một lần cho tên bộ và tên phẩm).
  - `0.4` “3. Kinh Mahāukkusa”: giữ tên Pāli của nhân vật theo khuôn “N. Kinh <tên>” (`ja474:0.4`, `ja478:0.4` “Kinh Dūta”, `ja481:0.4` “Kinh Takkāriya”). `19.1` “Kinh Mahāukkusa, thứ ba.” theo `ja474:14.1` (có dấu phẩy trước số thứ tự).

  **Tiền lệ và Pāli trùng.** Pāli trùng nguyên văn **trong chính bài**: 3 nhóm.
  - `3.3` = `8.3` = `12.1` (`Karomi te senaka etamatthaṁ`): bản Việt giống hệt nhau (“hỡi Senaka, tôi sẽ làm việc ấy cho ông,”), trừ chữ hoa đầu khoá `12.1` đứng sau dấu nháy mở. 0 lệch về nội dung.
  - `3.4` = `8.4` (`Ariyo hi ariyassa karoti kiccaṁ`): giống hệt, 0 lệch.
  - `7.3` = `11.3` (`Puttā mamaṭṭā gatimāgatosmi`): giống hệt, 0 lệch.
  Ngoài ra `1.2` và `2.3` (`Pajā mamaṁ khādituṁ patthayanti`) và `3.1` và `8.2` (`Mittaṁ sahāyañca karonti paṇḍitā`) chỉ khác dấu câu cuối khoá trong Pāli (`;` so với `,`); bản Việt giữ đúng khác biệt dấu câu đó và cùng chữ. Tổng 5 nhóm trùng sau khi nén khoảng trắng và bỏ dấu câu, 0 nhóm mà nội dung bản Việt khác nhau.

  **Tiền lệ ngoài bài.** 0 cặp Pāli trùng nguyên văn với khoá đã dịch ở nơi khác trong tầng (đã dò 73 khoá không phải tiêu đề với toàn tầng Pāli–Việt đã có, 56.544 cặp): không có khoá nào dùng lại nguyên văn. Câu gần nhất là `ja323:4.3` và `ja403:7.3` (`Ariyo hi ariyassa kathaṁ na dajjā`, “Bậc cao quý sao nỡ chối từ bậc cao quý”), khác động từ nên không trùng; tôi dùng lại chữ “bậc cao quý” cho `ariya` ở đây (3.4, 4.2, 8.4, 13.2).

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `kāle akāle` (3.2) → “đúng lúc cũng như không đúng lúc”: tầng có 1 tiền lệ (`ja331:3.1` “đúng thời hay không đúng thời”), chọn cách nói thông dụng hơn.
  - `appossukko` (9.1) → “không phải bận tâm”: tầng có 11 khoá chứa `appossukk-` (ví dụ `ja30:1.3` “Đừng lo”, `snp1.3:9.3` “Không bận tâm”); chọn “không phải bận tâm”.
  - `viheṭhayeyyuṁ` (10.4) → “quấy hại”: tầng có 10 khoá chứa `viheṭh-` (“làm hại”, “làm tổn hại”); chọn “quấy hại” cho ngữ cảnh con chim non/ác ý nhẹ hơn “làm hại”.
  - `dijo` / `dijānaṁ` (2.1, 1.4, 18.2) → “loài chim”, “con chim”: tầng có 14 khoá chứa `dij-`, đa số “chim” (ví dụ `ja333:3.3`, `snp5.19:4.1`), một số “người” vì ngữ cảnh (`ja223:2.3`); ở đây ngữ cảnh rõ là chim.
  - `vihaṅgamo` (6.2) → “loài chim bay giữa trời”: tầng 2 khoá (`snp1.12:15.1`, `ja255:1.2`), cách dịch không đồng nhất; chọn nghĩa chữ.
  - `ukkusa` / `kuraro`: cả hai đều là loài chim ó cá. `Ukkusarāja` (2.2) → “vua Ukkusa” (dùng như tên của nhân vật, nên giữ Pāli); `kuraro` (6.3) → “chim kurara” (giữ Pāli vì không có tiền lệ Việt cho tên chim, 0 khoá trong tầng; riêng `ud5.6:1.3` có `kuraraghara` là tên địa danh, khác). Hai chữ đó chỉ có thể chỉ cùng một loài/một nhân vật nhưng bản Việt giữ nguyên hai chữ Pāli, không thống nhất thành một.
  - `cilāca` (1.1, 2.4): giữ nguyên Pāli “cilāca” với nghĩa “người săn” (0 tiền lệ trong tầng); `luddā` (2.4) → “hung bạo” (tầng 4 khoá; `ja308:2.2` “tàn bạo”).
  - `ariya` (3.4, 4.2, 8.4, 13.2) → “bậc cao quý”: `ja323:4.3`, `ja403:7.3`; `ayira` (13.2) là dạng khác của `ariya`, dịch cùng chữ.
  - `satamesa dhammo` (5.4, 10.1) → “pháp của bậc thiện nhân”: 0 tiền lệ nguyên cụm; `dhammo` dịch “pháp” (khác với `ja474:4.4` chọn “lẽ”, vì ở đây là quy luật ứng xử của bậc thiện nhân).
  - `vāricara` (7.4) → “loài đi dưới nước”: 0 tiền lệ; dịch nghĩa chữ (`vāri` nước + `cara` đi).
  - `modāma` (13.4) → “vui mừng”: tầng có 9 khoá chứa `modām-` (“hoan hỷ”, “vui thích”).
  - `samaṅgibhūta` (13.4, 15.4) → “sum vầy”: tầng có 15 khoá, đa số nghĩa “đầy đủ, thành tựu” (ví dụ `ud6.2:8.3`, `ja441:9.5`); ở đây đi với “con cái” nên dịch “sum vầy”. `samagga` (17.4) → “hòa hợp”.
  - `kāmakāmī` (16.4) → “được điều mình mong muốn”: 2 khoá (`pv3:3.4` “ham muốn thế dục”, `tha-ap165:2.3` “thọ hưởng lạc thú”), nghĩa không nhất quán; chọn nghĩa chữ.
  - `yasavā` (16.3) → “có danh tiếng”: tầng 3 khoá (`tha-ap421:7.3`, `tha-ap422:7.3` “có danh tiếng”).

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 13 dấu mở (khoá `x.1` của mỗi khổ 1–13) và đóng ở `1.4`, `2.4`, `3.4`, `4.4`, `5.4`, `6.4`, `7.4`, `8.4`, `9.4`, `10.4`, `11.4`, `12.4` và `18.4` (13 dấu đóng; lời ở `13.1` kéo qua `13.4`–`17.4` không đóng nháy cho tới `18.4`); Việt đúng như vậy, lệch 0/77 khoá (đã so từng khoá cả nháy đơn `‘’` lẫn nháy kép; không có nháy đơn trong Pāli lẫn Việt). Việt đóng `12.4` bằng dấu hỏi trước nháy `?”` (Pāli kết bằng dấu chấm), vì khoá hỏi “vì sao … lại không …”.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: bản root không có văn xuôi nên suy từ nội dung kệ và từ đối chiếu tóm tắt khung truyện, không chép vào thân kinh. Nhân vật suy ra: Senaka là loài chim ưng/diều hâu (`sena`); người được cầu cứu lần lượt là chim ó cá (ukkusa/kuraro), một loài đi dưới nước (nhiều khả năng là rùa, theo `vāricara`) và một vị chúa thú (`migavīraseṭṭha`). Đọc theo ngữ cảnh: 1 là lời chim mái (vợ Senaka) giục Senaka đi cầu bạn; 2, 4, 7, 11 là lời Senaka; 3, 5 là lời chim ó cá; 6 là lời khen việc chim ó cá; 8 là lời người đi dưới nước; 9–10 là lời con và cha của người đi dưới nước (mỗi bên một khổ; xem bất định 4); 12–13 là lời chúa thú; 14–18 là lời kết về bạn bè (`15.3` đại từ `mayhaṁ` + `patī` gợi lời của chim mái; `18.4` `yathāhaṁ tvañca senakā` gợi người nói là vợ của Senaka). Đây là suy luận, không đóng khung trong bản Việt.
  2. `Ukkā cilācā bandhanti dīpe` (1.1): đọc `ukkā` là danh từ nữ số nhiều “đuốc”, `bandhanti` “buộc, kết” (cụm `ukkaṁ bandhati` “kết đuốc” là thành ngữ), `cilācā` là chủ ngữ. Cách đọc khác: `ukkā` chỉ một loài chim. Chọn nghĩa chữ ít giả định hơn.
  3. `Pajā mamaṁ khādituṁ patthayanti` (1.2, 2.3): `pajā` dịch “đám người” (nghĩa thường: sinh vật, dân chúng, con cháu); `mamaṁ` dịch “tôi”. Nếu `pajā` là “con cháu (của bọn cilāca)” thì nghĩa vẫn gần như vậy; nếu `mamaṁ` là “của tôi” (các con tôi) thì nghĩa đổi nhẹ.
  4. Khoá 9 và 10 (`tāta`): `tāta` là cách gọi thân mật giữa cha và con. Khoá 9 là con nói với cha (“Thưa cha”). Khoá 10 có thể là cha đáp con (“con ơi”, như đã dịch; `maṁ pavaḍḍhakāyaṁ` “tôi có thân hình đã lớn” hợp với người cha) hoặc chính người con nói tiếp. Chưa phân xử chắc chắn.
  5. `aḍḍharatte anāgate` (6.4): dịch “vào lúc nửa đêm, khi trời chưa sáng”. `anāgate` (“chưa đến”) không nêu rõ thứ gì chưa đến; “trời chưa sáng” là cách đọc hợp ngữ cảnh (làm việc giữa đêm), nhưng là suy ra.
  6. `Nivatthakocova sarebhihantvā` (13.3): `nivatthakoca` “người khoác giáp”, `sarebhihantvā` = `sarehi` + `abhihantvā` “đã dùng tên đánh”; Pāli không nêu đối tượng bị đánh nên bản Việt cũng không thêm. Cũng có thể hiểu `-koca` là một vật khác (một nghĩa bóng); không có tiền lệ trong tầng (0 khoá).
  7. `Kūjantamupakūjanti, lomasā hadayaṅgamaṁ` (14.3–14.4): dịch “kẻ đang kêu được kêu đáp lại bởi những kẻ lông lá, tiếng kêu thấu đến tim”. `hadayaṅgamaṁ` có thể là tính từ của `kūjantaṁ` hoặc phó từ; `lomasā` (“lông lá”) không rõ chỉ thú hay chim. Nghĩa chung rõ (bạn bè đáp lại tiếng kêu cứu) nhưng cú pháp không chắc.
  8. `patī` (15.3): dịch “chồng của tôi” (số ít, dạng kéo dài vì vần) theo ngữ cảnh gợi người nói là chim mái; nếu `patī` là số nhiều thì nghĩa thành “các chủ”, ít hợp.
  9. `Rājavatā sūravatā ca attho` (16.1): `-vatā` hiểu là “nhờ có (vua / người anh dũng)”; cách đọc khác là “của người có vua, người có bậc anh dũng”. `uggatatto` (16.3) → “uy thế lẫy lừng”: 0 tiền lệ; có thể là “tự thân (attā) được nâng cao”.
  10. `Tayīdaṁ` (4.2) = `tayi` + `idaṁ`: dịch “chính ông đã làm điều ấy”; có thể đọc `tayi` ở vị trí cách (“nơi ông, điều ấy [đã có/đã thành]”), nghĩa gần như nhau.
  11. `Ayirañca kayirātha sukhāgamāya` (13.2), `Karonti heke sakhīnaṁ sakhāro` (5.3): `sakhāro` dịch “phận sự bạn bè”; không có tiền lệ (0 khoá), nghĩa suy từ `sakhi` “bạn” + `kāra` “việc làm”.

