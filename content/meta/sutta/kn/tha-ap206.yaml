  trong `all`, tôi dịch và ghi đủ **28/28** — 27 khoá trong `keys`, còn
  `tha-ap206:7.1` đã có sẵn từ đợt trước và tôi **giữ nguyên văn**.
  **Vì sao tệp cũ chỉ có MỘT khoá — và blocker cũ đã được gỡ.** Đợt trước lát
  này được chia bằng bộ lọc `len(Pāli) >= 40`, mà ở `tha-ap` **23/24** khoá Pāli
  ngắn hơn 40 ký tự, nên bộ lọc loại hết kệ và chỉ còn `:7.1`.
  `blocking_errors` cũ ghi đúng điều đó. Lát n42 dùng `missingAll`, tôi đủ
  **28/28** khoá, nên blocker thiếu khoá **không còn**; blocker duy nhất còn lại
  là tầng Anh đã ghim không phủ `tha-ap` (nêu ở trên).
  **Nội dung riêng của bài này — đã đọc Pāli, không suy từ công thức chung.**
  Người kể là vị trưởng lão Taraṇiya, tức người đưa người qua sông. Khi Đức
  Thế Tôn — bậc Thấy Biết Chân Lý, bậc hai chân, đấng Nhân Ngưu, vây quanh bởi
  hàng đệ tử — bước đến bờ sông Hằng, dòng sông tràn ngập bờ bến, nước dâng tới
  chỗ bầu quạ; Ngài nhấc bổng đoàn Tỳ-kheo và cả Đấng Lưỡng Túc Tối Thắng.
  Vì việc cứu vớt ấy, trong một ngàn tám trăm kiếp trước đó, người kể không còn
  biết đến đọa xứ nào; tính trong mười ba nghìn kiếp thì chỉ sanh năm lần trong
  đời, đều đầy đủ bảy báu quý giá và là Chuyển Luân Vương có đại uy lực. Ở đời
  cuối cùng này người kể sinh ra trong gia đình Bà-la-môn, cùng ba vị đồng
  hành xuất gia trong giáo pháp của Bậc Đạo Sư, và chứng bốn vô ngại giải trong
  giáo pháp của Đức Phật.
  **Công thức `:7.1` — đo lại, và có một tiền lệ trùng tên rất đáng chú ý.**
  Điều kiện đo: Pāli chứa `Itthaṁ sudaṁ` **và** `abhāsitthāti`, quét toàn tầng
  `vietnamese-project/sutta/kn`. Đo lúc tôi chạy: **417** khoá dùng *…đã nói
  **những** bài kệ này*, **35** khoá dùng *…đã từng nói **bài kệ này***, cộng
  1 câu lạ (`cp35:18.1`). Brief ghi 407 / 21; tôi tin phép đo của mình và nêu rõ
  ở đây. Quan trọng hơn: `tha-ap206:7.1` **trùng nguyên văn** với
  `tha-ap272:5.1` (`Itthaṁ sudaṁ āyasmā taraṇiyo thero imā gāthāyo abhāsitthāti`
  — cùng tên trưởng lão Taraṇiya), và bản Việt ở `tha-ap272:5.1` đã là *Tôi nghe
  như vầy: Tôn giả Trưởng lão Taraṇiya đã nói những bài kệ này.* — **giống hệt**,
  nên tôi giữ nguyên văn `:7.1` sẵn có.
  **`translationTitle` phải BẰNG ĐÚNG `:0.3`, và đây là chỗ tệp cũ sai.**
  Tệp cũ ghi *Kinh Kệ Của Trưởng Lão Taraṇiya*. Đo tiền lệ ở **phạm vi gần
  nhất** (`tha-ap183`–`tha-ap212`, 27 tệp có `translationTitle`): *Bài Kệ Tuyên
  Ngôn* **11**, *Ký Sự* **5**, *Bài Kệ Tuyên Ngợ* **4**, *Kinh Kệ Của Trưởng Lão*
  **4**, *Tự Thuật Của Trưởng Lão* **3**. Cả tầng `tha-ap` (428 tệp): *Bài Kệ
  Tuyên Ngợ* **200**, *Ký Sự* **94**, *Bài Kệ Tuyên Ngôn* **72**, *Kinh Kệ Của
  Trưởng Lão* **28**, *Tự Thuật Của Trưởng Lão* **9**, *Truyện Kệ* **6**. Tôi
  theo đa số gần nhất và **bỏ** mẫu *Kinh Kệ Của Trưởng Lão*. Về *Tuyên Ngợ /
  Tuyên Ngôn*: gần nhất **Ngôn 11 vs Ngợ 4**, cả tầng nghiêng ngược (**Ngợ 200
  vs Ngôn 72**) vì nhiều lát cũ nhân bản chính tả sai *Ngợ*. Tôi theo đa số gần
  nhất (đúng chính tả) và **giao người biên tập phán một lượt cho cả cuốn** —
  hai phạm vi cho hai đa số khác nhau, không tự dọn lẻ từng tệp.
  **Chính sách số thứ tự ở `:0.3`: Pāli `:0.3` của bài này KHÔNG bắt đầu bằng số**
  (`Taraṇiyattheraapadāna`), nên bản Việt cũng không có số. Cùng phẩm có những
  tệp khác Pāli có số (`3 Kiṅkaṇipupphiya…`, `7. …Salalamāliya…`) và tôi giữ số
  ở đó; ở đây không thêm — không tệp nào thêm số ở chỗ Pāli không có.
  **`:0.1` giữ nguyên dạng Pāli, có tiền lệ đếm được.** `Therāpadāna` được giữ ở
  **376/385** tệp `tha-ap` có bản dịch. Đây là **một** khoá có Pāli giữ nguyên
  sang bản Việt, có chủ đích. `:0.2` đo riêng theo từng phẩm vì cùng một Pāli
  phải nhất quán trong phẩm: `Kaṇikārapupphiyavagga` 8 tệp ⇒ *Phẩm Hoa Kaṇikāra*
  **6** thắng *Phẩm Kaṇikārapupphiya* **1** và *Phẩm Bậc Rải Hoa Kaṇikāra* **1**.
  Tôi theo 6.
  **`:8.1` — số thứ tự đo theo chữ Pāli, không đoán.** `catutthaṁ` được dịch thành
  *thứ tư* ở **5/8** tệp (3 tệp dùng *thứ bốn*). Bài này `catutthaṁ` ⇒ *thứ
  tư*.
  **Nhịp nháy: đúng như Pāli, chạy qua khoá.** Pāli mở `“` ở `:1.1` và đóng `”`
  ở `:6.3`. Tôi **không** làm mỗi khoá tự cân: `:1.1` mang `“`, `:6.3` mang `”`,
  các khoá khác không dấu. Phép kiểm so **từng khoá** cả hai vế và cả nháy đơn
  `‘’`; 28/28 khớp.
  **Dấu lược `:6.2`.** Pāli là `…pe…` nên bản Việt giữ **đúng một** `…` và
  **không** mở rộng. Không có khoá nào dùng `…` trần, không khoá nào còn `(…)`.
  **Thuật ngữ — tiền lệ đếm được, không tự đặt.** `Atthadassī tu bhagavā` ⇒
  *Đức Thế Tôn, bậc Thấy Biết Chân Lý* (dùng lại **nguyên văn**
  `tha-ap166:1.1`); `dvipadindo narāsabho` ⇒ *bậc hai chân, đấng Nhân Ngưu*
  (dùng lại **nguyên văn** `tha-ap178:1.2`); `Purakkhato sāvakehi` ⇒ *Được bao
  quanh bởi hàng đệ tử* (nguyên văn `tha-ap164:1.3`, `tha-ap186:1.3`);
  `dvipaduttamaṁ` ⇒ *Đấng Lưỡng Túc Tối Thắng* (nguyên văn, có tiền lệ ở tầng);
  `Aṭṭhārase kappasate` ⇒ *một ngàn tám trăm kiếp* (29 tệp cùng dùng, trong đó
  `tha-ap241:2.1` dịch sai — xem mục lỗi); `yaṁ kammamakariṁ tadā` ⇒ *khi tôi
  làm nghiệp ấy* (nguyên văn, nhiều tiền lệ); `Duggatiṁ nābhijānāmi` ⇒ *Tôi
  không còn biết đến đọa xứ nào* (nguyên văn); `taraṇāya idaṁ phalaṁ` ⇒ *đó là
  quả báo của việc đưa sang sông* (cùng dòng Pāli `tha-ap272:3.4` đã có *đó là
  quả **báu** của việc đưa sang sông.* — tôi theo **đa số** của công thức
  `…idaṁ phalaṁ` trong tầng, vốn là *quả báo*; khác đúng một chữ, không phải mâu
  thuẫn, và tôi ghi ra đây để biên tập chọn một cho cả phẩm);
  `Sattaratanasampannā` ⇒ *Đầy đủ bảy món báu quý giá*;
  `cakkavattī mahabbalā` ⇒ *là Chuyển Luân Vương có đại uy lực* (gần nhất 4/7; cả
  tầng còn *đại oai lực* và *đại thần lực* — tôi theo gần nhất, vì `mahabbalā` là
  **sức mạnh**, còn *thần lực* là thần thông nên lệch nghĩa); `Paṭisambhidā
  catasso` ⇒ *Bốn vô ngại giải* (dùng chung ở **393** tệp); `kataṁ buddhassa
  sāsanaṁ` ⇒ *đã làm tròn lời dạy của Đức Phật* (gần nhất 5/5);
  `pabbajiṁ satthu sāsane` ⇒ *tôi xuất gia trong giáo pháp của Bậc Đạo Sư*
  (tương ứng với tiền lệ `pabbajiṁ jinasāsane` → *và xuất gia trong giáo pháp của
  Đấng Chiến Thắng*).
  **Hai chỗ tôi đo lại số của người khác — nêu rõ cả hai.**
  (1) `:4.1` `Teraseto kappasate`. Bản Việt duy nhất đang có trong tầng cho
  đúng dòng Pāli này là `tha-ap192:5.1`: *Trong mười bảy ngần kiếp* ⇒ **17.000**.
  Tôi dịch *Trong mười ba nghìn kiếp* ⇒ **13.000**, vì `teraseta` = 13.000 và
  hậu tố `-to` ở đây là dấu nhân nghìn — cùng kiểu đã được dịch **đúng** ở
  `tha-ap145:4.1` (`Soḷaseto` → *một nghìn sáu trăm kiếp*, tức 16.000) và ở
  `tha-ap19:7.1` (`Satasahassito kappe` → *một trăm ngàn đại kiếp*, tức
  100 × 1.000). Cùng loại lỗi số mà brief đã liệt kê với `Tiṁsakappasahassamhi`
  (3 × 1.000 bị đọc thành 30.000). Tôi **không sửa `tha-ap192`** vì ngoài lát, và
  **báo ở đây**.
  (2) `:3.1` `Aṭṭhārase kappasate` = **1.800**; 29 tệp trong tầng dùng *một ngàn
  tám trăm*, riêng `tha-ap241:2.1` dùng *tám trăm*. Tôi theo đa số.
  Ngoài ra `pañca` = 5 và `soḷasa`… không có trong bài này; `tīhi` = 3 đã kiểm ở
  `:5.3` (*cùng ba vị đồng hành*).
  **BẤT ĐỊNH — ghi rõ, không giấu, và không bịa để lấp.**
  (1) `tha-ap206:2.1`–`:2.2` `Samatitti kākapeyyā, / gaṅgā āsi duruttarā`. Tôi dịch
  *Dòng sông Hằng tràn ngập bờ bến, / nước dâng tới chỗ bầu quạ, không gì sánh
  bằng*. `kākapeyyā` là nước dâng tới mức **quạ có thể uống**, và tầng này đã dịch
  đúng ý đó ở `ud8.6:27.3` (*…đầy tràn, ngang bằng bờ, quạ có thể uống được*) —
  tôi lấy tiền lệ đó, không bịa. `duruttarā` là *khó vượt*, tôi dịch *không gì
  sánh bằng*. Ghi ở đây vì hai từ này dễ dịch sai theo nghĩa *bất khả xâm
  phạm*.
  (2) `tha-ap206:2.3` `Uttārayiṁ bhikkhusaṅghaṁ`. `uttārayi` là *cứu vớt khỏi
  chết đuối* (nghĩa gốc), tôi dịch *Ngài nhấc bổng đoàn Tỳ-kheo*; chỗ này không
  có tiền lệ trong tầng. Ghi ở đây.
  (3) `tha-ap206:4.2` `pañca sabbobhavā ahuṁ`. Tôi dịch *tôi chỉ sanh năm lần trong
  đời*; `sabbobhavā` là *mọi đời sanh của ta*, nên số **5** là tổng các đời, và câu
  khớp với `:5.1` (đời cuối cùng) và với `Aṭṭhārase kappasate` ở `:3.1` (nghìn
  tám trăm kiếp trước, tức giai đoạn này mới có năm đời). Ghi ở đây.
  (4) Tên `Taraṇiya`. Tôi **giữ dạng Pāli**, vì `:7.1` sẵn có đã viết *Tôn giả
  Trưởng lão Taraṇiya* và 33 tệp cùng công thức trong tầng đều giữ tên Pāli có
  dấu. Tầng có tiền lệ dịch **theo nghĩa** ở `tha-ap272:0.3` (*Ký Sự Về Trưởng
  Lão Đưa Qua Sông*) và `tha-ap272:3.4` (*quả báu của việc đưa sang sông*) — tôi
  theo **đa số công thức** ở cả hai chỗ (xem mục trên), còn `:0.3` theo công thức
  chung của phẩm. Tôi ghi ra đây vì hai cách (giữ tên Pāli và dịch nghĩa tên) đang
  cùng tồn tại trong tầng và cần người biên tập chọn một cho cả phẩm.
  **Câu lời-kết đã đọc lại từng cặp.** Tôi in toàn bộ 28 cặp Pāli ↔ Việt và đọc
  lại sau khi ghi; không phát hiện lỗi chủ thể, phủ định, số lượng hay lệch khoá
  nào. Riêng `pacchime ca bhave asmiṁ` tôi dịch *Trong đời cuối cùng này* —
  `pacchime` = *sau cùng*, `asmiṃ` = *này*; cùng Pāli `Pacchime ca bhave dāni` có
  **24** chỗ trong tầng nhưng **không** chỗ nào đã dịch, nên đây là lựa chọn của
  tôi, ghi ra để biên tập đo lại.
  **Lỗi bản nháp thật trong tầng mà tôi đo được và BÁO, không tự sửa** (đều ngoài
  lát n42):
  (a) `tha-ap192:5.1` `Teraseto kappasate` → *mười bảy ngàn*, xem mục trên.
  (b) `tha-ap140:4.1` `Sattarase kappasate` đang dịch *chín mươi tư kiếp trước*;
  `sattarase` = **1.700**, và chính Pāli này ở `tha-ap143:3.1` đã dịch đúng là
  *một nghìn bảy trăm kiếp*.
  (c) `tha-ap241:2.1` `Aṭṭhārase kappasate` đang dịch *Từ tám trăm kiếp trước*;
  `Aṭṭhārase` = **1.800**.
  (d) `tha-ap186:5.1` `Ito terasakappamhi` đang dịch *Cách đây mười ba kiếp về
  trước* — **thiếu nhân nghìn**: `terasakappa` = 13.000 kiếp.
  (e) `tha-ap48:4.1` `Sattatālīsito kappe` đang dịch *bốn mươi bảy kiếp*;
  `sattatālī` = 7 + 60 = **sáu mươi bảy**.
  (f) `tha-ap140:1.4` `agamaṁ buddhasantikaṁ` đang dịch *đã đến dự lễ tế của
  tôi* — thêm *của tôi*, không có trong Pāli.
