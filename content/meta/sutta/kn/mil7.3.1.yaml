notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của `_hvi.py` gần như vô dụng ở bài này**: nó chỉ quét khoá Pāli từ 40 ký tự trở lên, mà mọi vế kệ ở đây đều ngắn hơn, nên `cần` rỗng và assertion không chạy. Vì vậy tôi tự quét **toàn bộ** khoá từ đĩa: đủ khoá, đúng exact ID, NFC, không rỗng, dấu lược khớp Pāli từng khoá, ngoặc kép cân cả bài, không Pāli lọt, không `(…)`. Kết quả: **0 lỗi trên 252 khoá**.
  - |-
    **Đã tự dựng chỉ mục Pāli↔Việt toàn tầng rồi so khoá của lát, không đoán.** Nạp mọi tệp Pāli gốc trong cache (284.708 khoá) và mọi tệp Việt dự án (111.657 khoá), ghép theo khoá vì khoá là duy nhất toàn hệ thống. Lát này tìm được **4 khoá có Pāli trùng nguyên văn với bài đã có bản Việt ngoài lát (88 cặp)**, và **16 cụm Pāli trùng nguyên văn nội lát**. Mọi bản Việt đã có đều được dùng lại nguyên văn, không dịch lần hai.
  - |-
    **Review đối kháng bắt được 2 lỗi nghĩa chữ trong phần kệ.** (1) `2.1` `Yathā lābulatā nāma` bản nháp tôi viết *Cây leo tên là cây leo* — lặp vô nghĩa vì tiếng Việt không có danh xưng riêng cho loài này; sửa thành *Như cây leo tên là*, giữ được cả `Yathā` (dấu ví dụ, đối xứng với `Tatheva` ở `3.1`) lẫn `nāma`. (2) `2.3` `Ālambitvā soṇḍikāhi` bản nháp tôi thêm *bám víu* — Pāli không có; `soṇḍikā` là thân cây, sửa thành *bám lấy những thân cây*.
  - |-
    **Khung câu hỏi-ví dụ bám sát 17 tệp mil7.x đã có.** `0.2` *Câu hỏi về cách dùng dẫn với ví dụ* (17 bài) · `1.1` theo đúng khuôn của mil7.2.7 và mil7.3.9 · `1.5` dùng lại y nguyên *Trưởng lão Sāriputta, Tướng quân Pháp, đã nói:—* (mil7.3.9, mil7.5.5) · `yoginā yogāvacarena` → *người hành trì* (mil7.3.9/7.8.1) · `aṅga` → *phần* (13 bài) · `0.4` và `4.1` theo mẫu *Câu hỏi về phần của …, thứ …*
  - |-
    **Thuật ngữ mới đặt, không có tiền lệ** (grep toàn tầng = 0): `lābulatā` → *cây leo* (loài dây leo bám; `tiṇa/kaṭṭha/latā` lần lượt *bụi cỏ/cây gậy/dây leo khác*); `soṇḍikā` → *thân cây*; `arahatta` → *bậc A-la-hán* (đã có 1.245 lần dưới dạng *A-la-hán*, viết hoa chữ đầu khi có danh xưng như ở đây); `asekhaphala` → *quả của bậc không còn học* (chỉ có 2 tiền lệ *không còn học*, chưa có dạng *A-lâu-tán* nào — tôi đặt theo cách đọc được); `buddhaputta` → *bậc là con Đức Phật*.
  - |-
    **Bất định chưa phân xử.** `Vaḍḍhitabbaṁ asekkhaphale` — `asekhaphala` là quả của bậc A-lâu-tán, nhưng vế kệ còn dùng `ārammaṇaṁ ālambitvā` ở thì mệnh lệ, nên cách đọc của cả cụm là *tiến lên quả ấy*, tôi dịch theo; chưa có tài liệu nào trong kho để chốt chắc hơn.
