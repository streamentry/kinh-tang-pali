notes: |-
  Đã đọc HẾT p49.txt (40 khoá) trước khi viết. Cùng bộ đo của lát: `bhante` →
  `tôn giả` (244/428 khoá mil), `mahārāja` → `đại vương` (1100/1227). `:0.3`
  `Santhavavagga` giữ Pāli theo đa số đếm được (5/7 khoá mil); `:0.4` theo khuôn `N.
  Câu Hỏi Về …` của cả bộ, đối chiếu bài kề mil5.5.2:0.4 và mil6.3.7:0.4.
  `”ti` cuối khoá giữ nguyên (406 khoá mil).

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ: `sabhāvavacanaṁ asesavacanaṁ nissesavacanaṁ
  nippariyāyavacanaṁ` — bài kề mil5.5.2:4.5 có sẵn `đúng theo bản chất sự thật,
  không thiếu sót, không giới hạn, không suy diễn`, tôi dùng lại đúng chuỗi ấy cho
  4.8.

  BẤT ĐỊNH LỚN NHẤT CỦA LÁT, ĐÃ GHI RÕ. `santhava` / `asanthava` không có tiền lệ
  nào trong toàn tầng, và cả kệ lẫn tiêu đề đều xoay quanh nó. Bối cảnh bài
  (Nāgasena ca ngợi `vihāradāna` = bố thí cơ sở tựa, `:5.1`–`:6.2`) và ẩn dụ ở
  4.9 (`āraññako migo … nirālayo aniketo`, hươu hoang dã được tháo dây) cùng nhặt
  `tới` đặt tâm điểm: `niketā` (nơi cư ngụ) và `aniketa` (không có nơi ở) là cặp
  đối xứng, nên tôi đọc `santhava` là **đã ở ổn một nơi** và `asanthava` là **chưa ở
  ổn**; `Santhavato bhayaṁ jātaṁ` = `Người đã ở ổn một nơi thì sinh nỗi lo`,
  `Aniketamasanthavaṁ` = `Còn người không có nơi ở, chưa ở ổn`. Cách đọc thay thế
  là `quen thuộc / quen ở` — cũng hợp, nhưng làm câu 2.3–2.4 nặng nghĩa và không
  khớp với `niketā`; tôi chọn cách đọc theo Pāli. Vì tiêu đề đặt theo nghĩa này,
  `:0.4` dịch `1. Câu Hỏi Về Nơi Cư Ngụ` và `:7.1` dịch `Câu hỏi về nơi cư ngụ là
  thứ nhất`. Người biên tập nên đọc lại đoạn này.

  BẤT ĐỊNH KHÁC ĐÃ GHI. (1) `na tattha buddhaputtena ālayo karaṇīyo nikete` (6.4) —
  nghĩa đen là `người con Phật không nên lấy làm nơi ở hằn`, đi ngược với chính lời
  Đức Thế Tôn ngay trước đó (`hãy làm ra một ngôi tựa`); tôi dịch theo nghĩa đen và
  KHÔNG sửa lỗi cho tầng Pāli. (2) `samaṇānucchavaṁ samaṇasāruppaṁ
  samaṇappatirūpaṁ samaṇārahaṁ samaṇagocaraṁ samaṇappaṭipadā samaṇappaṭipatti`
  (4.8) — **0 tiền lệ** cho cả bảy mục; tôi dịch lần lượt là `đáng được bậc sa-môn
  tôn kính / là điều bậc sa-môn nên hướng tới / xứng đáng với bậc sa-môn / đáng được
  sa-môn gìn giữ / thuộc phạm vi của bậc sa-môn / là con đường tiến tu của bậc sa-môn
  / là sự thành tựu của bậc sa-môn`, giữ `sa-môn` vì mil5.5.2:6.1 đã dịch
  `samaṇadhammaṁ` là `phạm chất sa-môn`. (3) `byattasaṅketā` (6.1) — 0 tiền lệ;
  đọc là `có được sự tôn tin và đáng được kính trọng`. (4) `vihāre kāraye ramme`
  (3.2) — 0 tiền lệ; `ramme` là `rammā` (đẹp, xứng đáng), tôi dịch `xứng đáng`.

