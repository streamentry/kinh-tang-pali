notes: |-
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 2.1, 3.1 (`siṅgī`: DPD siṅgī 2 «crafty; cunning; beguiling», chú giải Itivuttaka «Siṅgīti … siṅgāratā cāturatā cāturiyaṃ parikkhattatā … samannāgatā»; «ba hoa» lặp nghĩa với `lapā` → «xảo quyệt»; `thaddhā`: DPD thaddha 2 «stubborn; obstinate», chú giải «kodhena ca mānena ca thaddhamānasā … anonatā hutvā vicaraṇakā»; «cứng cỏi» là từ khen trong tiếng Việt → «ương ngạnh»), 2.3, 4.2 (`atthaddhā` «không cứng cỏi» → «không ương ngạnh», cùng công thức), như mnd14:156.15–158.2; giữ `lapā` «nói dai», `dhīrā` «bậc trí» (không thuộc lỗi này). an4.26:1.1 dùng «gian trá, ngạo mạn, nhiều lời, mưu mô» (cùng chiều nghĩa, khác chữ); chọn theo mnd14 vì đó là đoạn Niddesa dẫn nguyên văn kinh này.
