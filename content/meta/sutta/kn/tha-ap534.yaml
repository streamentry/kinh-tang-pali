notes: |-
  Dịch từ Pāli root, 154 khoá, đủ khoá, đúng thứ tự Pāli. Tên bài (khoá 0.3) bằng đúng translationTitle: Pāli 0.3 không bắt đầu bằng số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số). Kiểu tên: Ký Sự Về Trưởng Lão X chiếm 36 so với Tuyên Ngợ 16 ở phạm vi tha-ap500 đến tha-ap600; toàn tầng tha-ap thì ngược lại: Tuyên Ngợ 255, Tuyên Ngôn 138, Ký Sự 135. Hai phạm vi cho hai đa số khác nhau; theo phạm vi gần nhất và các bài cùng phẩm (tha-ap533, 539, 541 và bài tha-ap544, 548 liền sau) thì dùng Ký Sự Về. Chữ Tuyên Ngợ không dùng vì chưa rõ gốc, vấn đề đó để biên tập phán một lượt cho cả cuốn.
  Khoá 0.2 Kaccāyanavagga dịch Phẩm Kaccāyana (4 khoá cùng Pāli đã dịch như vậy, gồm tha-ap533, 539, 541). Khoá 40.1 dùng Ký Sự Về Trưởng Lão Vakkali, thứ hai: trong các colophon dutiyaṁ đã có, thứ hai 41 so với thứ nhì 11. Khoá 39.1 theo công thức Tôi nghe như vầy ... đã nói những bài kệ này (528 khoá dùng những bài kệ này, 2 khoá dùng số ít); Pāli imā gāthāyo là số nhiều nên chọn nhóm 528.
  Số Pāli: satasahassa là sata 100 nhân sahassa 1000 bằng 100.000, dịch một trăm ngàn ở 1.1 (Ito satasahassamhi, cách đây một trăm ngàn kiếp; kappe nằm ở khoá 1.2 nên chữ kiếp được đưa lên 1.1 theo bản dịch đã có cho cùng hai dòng Pāli). Cùng Pāli Satasahassito kappe có hai nghĩa thời gian khác nhau trong bài nên hai khoá Việt khác nhau có chủ ý: 16.1 là lời thọ ký tương lai (Sau một trăm ngàn kiếp nữa, như tha-ap537, 539, 541, 543) và 35.1 là quá khứ (Vào một trăm ngàn kiếp trước đây, như tha-ap533, 531, 549). sattāhaṁ ở 9.3 là bảy ngày (satta 7 cộng aha là ngày); sattavassa ở 24.3 là bảy tuổi (7 năm); anekasataporise ở 32.2 là nhiều trăm tầm người (aneka cộng sata 100, không có số cụ thể); tāvatiṁsa dịch cõi trời Ba mươi ba theo quy ước tầng (3 cộng 30 là 33). Bài không có cụm Tiṁsakappasahassa; số tiṁsa duy nhất nằm trong tên cõi trời Tāvatiṁsa nên không có bất định số lượng nào cần phán.
  Ngôi kể: ta suốt bài, theo các bài cùng phẩm (tha-ap533, 537, 539, 541 dùng ta với 16, 26, 25, 25 chữ và 0 chữ tôi); toàn tầng nghiêng ta ở các công thức Kilesā jhāpitā mayhaṁ (ta 118, tôi 49), viharāmi anāsavo (ta 128, tôi 54) và Svāgataṁ vata me āsi (ta 113, tôi 7), còn Tadāhaṁ haṁsavatiyaṁ là tôi 4 so với ta 2 trong tầng nhưng đổi theo ngôi của bài. kataṁ buddhassa sāsanaṁ dịch không chủ ngữ (134 so với 27 khoá có tôi) và Paṭisambhidā catasso dịch Bốn vô ngại giải (518 khoá). Khoá 36.2, 37.2, 38.2 là …pe… nên giữ đúng một dấu lược …; Pāli của bài không có (…) trần.
  Pāli trùng nguyên văn trong chính bài: ba nhóm. Nhóm …pe… (36.2, 37.2, 38.2) Việt giống nhau. Nhóm Satasahassito kappe (16.1, 35.1) Việt khác nhau vì tương lai và quá khứ như trên. Nhóm khandhānaṁ udayabbayaṁ (29.2, 33.2) Việt khác nhau ở chữ về vì 29.2 là tân ngữ của passa (hãy thấy sự sinh và diệt của các uẩn) còn 33.2 bổ nghĩa cho dhammaṁ deseti; đây là cách đọc tôi chọn, hai nhóm sau cùng có thể đọc lại nếu biên tập muốn đồng nhất. So với tầng: đã dò 39 khoá Pāli trùng nguyên văn với các bài tha-ap khác; 28 khoá dùng đúng bản đa số, 11 khoá Việt khác bản đa số: 8.1, 24.4 và 33.4 (đa số tầng là tôi, đổi thành ta theo ngôi của phẩm); 15.1, 16.3 và 24.3 (chỉ khác chữ hoa đầu dòng theo Pāli); 16.1 (nữa vì là lời thọ ký, xem trên); 18.1 (hai khoá cùng Pāli trong tầng đã dịch không giống nhau, chọn Nhờ nghiệp đặc biệt ấy để không thêm chữ thiện); 21.4 (bản đa số xin hãy là nơi nương tựa của con vì người nói là chính vị đó, ở đây cha mẹ và người thân dâng đứa bé nên bỏ của con); 35.1 (xem trên); và 35.3 (tầng có 138 khoá viết rơi vào khổ đau cho duggatiṁ nābhijānāmi, lệch nghĩa; dùng đọa xứ theo bản gần nhất tha-ap531, 66 khoá).
  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 38.3; nháy đơn mở ở 11.1 và đóng ở 11.4 (lời nguyện), mở ở 13.1 và đóng ở 17.4 (lời thọ ký), mở ở 21.3 và đóng ở 21.4 (lời cha mẹ dâng con), mở ở 26.3 và đóng ở 29.4 (lời Đức Phật dạy); khớp Pāli từng khoá.
  Bất định, không đưa vào thân kinh: 1.3 Anomanāmo dịch danh xưng cao quý (anoma là không thấp kém); amito dịch vô lượng. 4.4 karuṇāmatisāgaro đọc mati là trí tuệ (biển cả của bi mẫn và trí tuệ). 7.1 sumati dịch có trí tuệ tốt đẹp; saddhādhimutto dịch có tín giải theo an1.208 (aggo saddhādhimuttānaṁ yadidaṁ vakkalī, tối thắng về tín giải) và thi-ap34:6.1. 7.2 và 7.4 là lời tán thán của Đức Padumuttara không có dấu nháy trong Pāli; mama dịch Ta viết hoa theo quy ước tầng cho lời Đức Phật. 8.3 hutvā dịch là như thế, nối với brāhmaṇatrajo ở 8.2 (cùng cấu trúc ahosiṁ brāhmaṇatrajo ở tha-ap549:6.2); nagare ở 8.2 đã được gộp vào chữ thành ở 8.1 theo bản dịch đã có cho Tadāhaṁ haṁsavatiyaṁ. 9.4 dussehi acchādayiṁ dịch dùng các tấm vải khoác lên các Ngài; tân ngữ các Ngài suy từ 9.1 và 9.2, Pāli không nêu. 10.2 anantaguṇasāgare ở vị trí cách, có thể gắn với nimuggo (chìm đắm nơi biển cả đức hạnh) hoặc với tassa; để nguyên nơi biển cả đức hạnh vô biên ở giữa để cả hai cách đọc còn mở. 11.2 ito sattamake chỉ có số thứ tự bảy, không có danh từ: dịch bảy ngày trước vì 9.3 là bảy ngày cúng dường và mil6.3.2 có ito te sattame divase; hai bài tha-ap74 và tha-ap153 dùng cùng cụm Ito sattamake kappe (kiếp), nên cách đọc kiếp không bị loại hẳn dù ngữ cảnh ở đây nghiêng về ngày; chưa phân xử được bằng tầng Anh vì không có. 13.3 Hemayaññopacitaṅgaṁ dịch thân được điểm tô bằng dây tế lễ bằng vàng: chữ yañña là tế lễ, hiểu dây tế lễ (sợi dây của Bà-la-môn) là suy ra từ ngữ cảnh người thanh niên Bà-la-môn, Pāli không nói dây; 13.2 pītamaṭṭhanivāsanaṁ dịch y phục vàng bóng mịn (nivāsana là y mặc dưới). 15.2 sabbasantāpavajjito dịch thoát khỏi mọi nhiệt não. 20.4 pisācībhayatajjitā ở số nhiều nữ nên không phải Vakkali mà là những người đã đặt ngài nằm (cha mẹ và người thân), Pāli không nêu họ nên dịch họ, và pisācī dịch nữ quỷ. 21.3 imaṁ dịch đứa bé này (Pāli chỉ nói imaṁ), suy từ 20.3 mandaṁ uttānasayanaṁ. 22.3 jālinā dịch có mạng lưới (không thêm màng ngón tay). 23.2 arakkheyyena rakkhito dịch bậc không cần ai bảo hộ, bảo hộ: hiểu arakkheyya là vị không cần được che chở; an7.58 dùng cùng gốc cho bốn điều Như Lai không cần che giấu, nên cách đọc được bảo hộ nhờ sự không cần che giấu không bị loại hẳn. 24.2 ukkaṇṭhāmi dịch chán nản theo thag1.105 và mil6.3.2. 29.3 Passa nằm ở đầu khoá 29.3 nhưng nối với khandhānaṁ udayabbayaṁ của 29.2 (hãy thấy sự sinh và diệt của các uẩn), nên 29.2 đặt tân ngữ trước và 29.3 giữ động từ; cách đọc khác là passa upakkilesānaṁ (hãy thấy các ô nhiễm). upakkilesa dịch ô nhiễm (đa số tầng dùng phiền não hoặc tùy phiền não cho nghĩa gần kilesa; dành phiền não cho kilesa ở 36.1). 25.3 và 26.1, 26.3, 29.1 rūpa dịch sắc thân cho cả bốn chỗ (Đức Phật, thân Vakkali ưa nhìn) dù 29.1 gần nghĩa uẩn sắc. 31.2 assāsayi không có tân ngữ nên không dịch ta; Vakkalīti jino vācaṁ dịch tiếng gọi Vakkali, không thêm dấu nháy vì Pāli không có. 34.2 caraṇantago dịch bậc đã đi đến tận cùng của hạnh (caraṇa là hạnh trong vijjācaraṇa); không có đối chiếu độc lập. 35.2 yaṁ kammamakariṁ tadā dịch khi ta làm thiện nghiệp ấy theo bản đa số của tầng (16 khoá), chữ thiện là cách tầng đã quen dùng cho việc cúng dường.
  Bản tra cứu toàn văn Bhikkhu Indacanda (không phân đoạn, không giấy phép máy đọc được) chỉ dùng để xác nhận cách đọc các từ khó (11.2, 13.3, 20.4, 23.2), không phải tầng đối chiếu và không chép câu chữ.
  Hệ quả giới hạn: triangulation hạ xuống 7.8 và status giữ draft.
