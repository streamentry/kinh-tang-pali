  **Nguồn.** `ja438` = `12. Daddarajātaka` — bài cuối của Bộ Chín Bài Kệ, nên mang cả
  `Navakanipātaṁ niṭṭhitaṁ` (`11.1`) và bốn câu `Tassuddānaṁ` (`12.1`–`13.4`). 47 khoá, đủ 47/47.
  Pāli ghim `root/pli/ms/sutta/kn/ja/ja438_root-pli-ms.json`, commit đã ghim
  `11c9d708978cde8ba61096d8a75f7ddfb846f639`.

  **Tên bộ, phẩm, bài.** `Navakanipāta` → *Bộ Chín Bài Kệ* (9/9 trong tầng). `Gijjhavagga` →
  *Phẩm Kền Kền* (`gijjha` = kền kền; cùng cách sửa đã làm ở ja430 trên main). `Jātaka` ở `0.1`:
  433 tệp `ja`, 417 giữ `Jātaka`. `11.1` theo `ja426:10.1`; `12.1` `Tassuddānaṁ` → *Tóm lược:*
  (áp đảo toàn tầng); `10.1` theo `ja437:10.1`.

  **Uddāna `13.1`–`13.4`.** Mười hai tên chuyển âm: Varagijjha, Samajjana, Haṁsavaro, Nidhisavhaya,
  Hārita, Pāṭaliko, Ajarāmara, Dhaṅka, Titikkha, Kuto, Pekkhana, Daddaribhīti. Đếm đúng 12, nên
  `dvādasa` ở `13.4` đọc là con số tổng (như `dasā` ở `ja160:5.4`, `dasāti` ở `ja310:7.4`), không phải
  một tên thứ mười ba. Các tên này **không** khớp tên mười hai bài `ja427`–`ja438` trong tệp ghim (chỉ
  *Gijjha* và *Daddara* trùng); không tự ghép tên nào với bài nào.

  **Giải quyết draft 2026-10-12 — thay thế các mục cũ.** Lượt kiểm toán độc lập đọc lại từ Pāli
  phát hiện bản cũ (chấm 2026-10-04) sai nghĩa ở phần lớn số khoá; bản cũ **bị thay hoàn toàn**.
  Các mục cũ sau đây không còn đúng và đã bị gỡ khỏi notes: tên phẩm *Phẩm Hươu*; khẳng định
  `6.1`–`6.2` và `9.1`–`9.2` lặp nguyên văn (chỉ `6.2` = `9.2` trùng; `6.1` là `Kānissa`, nghi vấn
  *những nghề nào*, còn `9.1` là `Tānissa`, chỉ định *đó là những nghề*); dịch `kammāyatana` là
  *nguồn gốc nghiệp*; coi `Daṇḍena` là tên riêng *Danda*; câu "người nghe thấy Daddara" ở `13.4`; mục
  ngoặc kép.

  **Khoá đổi nghĩa (lỗi nghĩa thật: 38/47 khoá — cả 36 dòng kệ `1.1`–`9.4`, cộng `0.3` và `13.4`; các khoá còn lại là tiêu đề, kết bài và tên uddāna chuyển âm).**
  - *0.3*: `Gijjhavagga` = Phẩm Kền Kền (không phải Hươu).
  - *1.1–1.4*: `akhādi` là ăn (cũ: "nuốt cái giống này"); `dinnabhatto adūsake` = kẻ được cho cơm ăn,
    trong khi chúng vô tội (cũ: "món quà biến thành ô nhiễm"); `dāṭhaṁ nipātehi` = cắm nanh (cũ: "nhắm
    hãm"); `mā te muccittha jīvato` = đừng để nó thoát khỏi ngươi khi ngươi còn sống (cũ: "khỏi miệng
    ngươi suốt đời"; `jīvato` đi với `te`, cấu trúc như `ja443:4.2`).
  - *2.1–2.4*: `ākiṇṇaluddo puriso, dhāticelaṁva makkhito` (cũ: "xông vào bãi cát, bị cọc sắt đâm") —
    đây là người đàn ông đầy tàn ác, bị vấy bẩn như tấm vải của người vú nuôi (cụm này cũng có ở
    `ja392:4.1–4.2`); `padesaṁ taṁ na passāmi, yattha dāṭhaṁ nipātaye` = không thấy chỗ nào để cắm nanh
    (cũ: "hạ được người ấy"; "nhắm hãm đánh cho trúng").
  - *3.1–3.4*: `Akataññussa posassa … neva naṁ abhirādhaye` giống `ja72:1.1–1.4` (Pāli đồng nhất). Bản
    Anh của `ja72` (Sujato — đây là **bài song song**, không phải bản của `ja438`) dịch *ungrateful,
    always looking for opportunity, even if given the whole earth, would still not be satisfied*. Dịch
    lại *không biết ơn / luôn ngó tìm kẽ hở / dù có cho cả mặt đất / không thể làm hài lòng*, và dùng
    đúng `luôn ngó tìm kẽ hở` của `ja72:1.2`. Cũ: "vô ơn… nhìn thấy lỗi… đập cả mặt đất… làm cho vị ấy hoàn
    thành" (sai nghĩa `abhirādheti`).
  - *4.1–4.4*: `Subāhu` là tên riêng hô cách (tiền lệ tên riêng ở `ja361`), `taramānarūpo` = trông vội vã
    (`ja352:1.1`), `paccāgatosi saha māṇavena` = quay trở lại cùng chàng thanh niên, `kiṁ kiccamatthaṁ
    idhamatthi tuyhaṁ` = ở đây ngươi có việc gì, mục đích gì. Cũ: "Ôi, không có hình dạng nào tốt hơn…
    ta là kẻ thế nào ở đây" (sai gần hết).
  - *5.1–5.4*: `Daddara` không phải hô cách mà là danh từ chủ ngữ của `yo te sakhā daddaro`; `sādhurūpo` =
    có phong thái hiền thiện (`ja497:14.4`, `dhp263:4`); `vadhaṁ parisaṅkāmi` = lo
    ngại bị sát hại; `sukhiṁ` = an ổn. Cũ: "Bạn hiền tử… bày mưu hãm hại hắn" (đảo chủ thể: Subāhu **lo
    cho** Daddara, không phải toan hại).
  - *6.1–6.4*: **câu hỏi**, không phải khẳng định: `Kānissa kammāyatanāni assu` = những nghề nghiệp
    của người ấy là những nghề nào; `vuttisamodhānatāya` = để gom góp sinh kế; `kaṁ paṭiññaṁ` = lời tuyên
    bố nào. Cũ: "Ngươi đã nghe những nguồn gốc nghiệp ấy, nhưng không phải vì thế…" (đảo thành câu phủ
    định).
  - *7.1–7.4*: liệt kê nghề nghiệp. `vettācāra` và `saṅkupatha` là hai lối đi tìm của cải (cùng danh
    sách đường đi vì của cải ở `mnd7:57.1`, `mil6.3.1:19.1`; cách dịch theo `pv37:11.2`/`vv84:11.2`:
    *đường dây mây*, *đường đóng cọc*); `naṭa` = kép hát; `vākura` = lưới bẫy (`thag16.4:6.2` ghi
    *lưới*); `daṇḍena yuddha` = đấu gậy; `samajja` = hội hè (`ja546:66.1`, `ja547:568.2`). Cũ: "thương lộ
    Kalinga đã tan rã… cuộc chiến với Danda" (sai gần hết).
  - *8.2*: `akkhā jitā` = thắng xúc xắc; `saṁyamo abbhatīto` = vượt quá mức tiết chế. *8.4*: `hatthā daḍḍhā
    piṇḍapaṭiggahena` = tay bị bỏng vì nhận đồ khất thực (cũ: "tay còn bị xích… siết chặt", bịa).
    *8.1* và *8.3*: xem Bất định.
  - *9.1–9.4*: `Tānissa` = đó là những nghề của người ấy; `lomapiṇḍo` = cục lông; `gāvo hatā kiṁ pana
    daddarassa` = bò đã bị giết, huống chi Daddara (cũ: "gà trống đã bị giết", `gāvo` là bò, không phải gà).

  **Phân loại blocker cũ.** (A) hai câu thiếu bản Anh upstream: **giữ nguyên** (sự thật về bản
  chụp đã ghim). (D) câu thứ ba cũ ("người nói và quan hệ giữa các nhân vật chưa phân xử được"): **đã thay**
  bằng câu mới về khổ 8, vì sau khi dịch lại từng khoá bám Pāli, câu chữ canonical không còn phụ thuộc
  vào việc xác định ai nói với ai (xem dưới); điểm chưa giải thật là hai cụm từ ở khổ 8.

  **Bất định, ghi ở đây chứ không thêm vào thân kinh.**
  (1) **Còn blocker:** `kulīkā mitamāḷhakena` (8.1) và `abbāhitaṁ pubbakaṁ aḍḍharattaṁ` (8.3). `kulīkā` chỉ
  có một lần trong Pāli ghim; `āḷhaka` là một đơn vị đong (giữ chuyển âm như `an6.54:9.4`), `mita` có thể là
  *đã đong* hoặc *ít ỏi*; `abbāhita` (kéo ra) và `pubbaka aḍḍharatta` (nửa đêm đầu) ghép được nhiều cách (ví
  dụ thức qua nửa đêm, hay rút ra giữa đêm). Chọn cách sát chữ, không đoán thêm.
  (2) **Khung truyện, không chặn:** kệ không có văn xuôi nên không biết chắc Daddara, Subāhu, "người đàn ông",
  "chàng thanh niên" là loài nào, và `puriso` có phải `māṇava` hay không (6.4 `māṇavena` có thể là *vì* hoặc
  *bởi* chàng thanh niên; dịch *vì*). Ở `ja304` Daddara là một loài rắn có nọc độc, và `dāṭha` (nanh) ở đây
  gợi cùng hướng, nhưng điều này chỉ là gợi ý, không được dùng để sửa câu chữ. Đại từ giữ đúng như Pāli: `ta`/`ngươi`,
  không gán danh tính. Ở `2.1`–`2.4` và `3.1`–`3.4` Pāli là một lời nói liền (một cặp dấu mở/đóng).
  (3) `ākiṇṇaluddo` dịch *đầy tàn ác*; `luddo` còn có thể là *thợ săn* — cách đọc kia có thể, nhưng bối cảnh
  `ja392:4.1` (người trộm củ sen) ủng hộ *tàn ác*.
  (4) `kammāyatanāni` dịch *nghề nghiệp* (không phải *nguồn gốc nghiệp*): khoá 7–8 liệt kê công việc làm ăn.

  **Ngoặc kép.** Pāli có sáu cặp “…”: `1.1`→`1.4`, `2.1`→`3.4`, `4.1`→`4.4`, `5.1`→`5.4`, `6.1`→`6.4`,
  `7.1`→`9.4`. Bản dịch khớp từng khoá. Dấu `?` đặt ở `6.4` và `9.4` (kết câu hỏi), không đổi ranh giới
  khoá. Pāli của `6.2` trùng `9.2` nguyên văn → dịch giống hệt (1/1 cặp trùng trong bài).

  **Dấu lược.** `ja438` không có khoá nào chứa `…pe…` hay `(…)`.

  **Cổng kỹ thuật.** Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` **không
  chạy** trong lượt này; `technical_integrity` đặt 9,6 và không tuyên bố cổng đã qua. Đã tự kiểm: đủ
  47/47 khoá, không khoá thừa, thứ tự khoá đúng thứ tự Pāli, NFC, ngoặc kép khớp Pāli từng khoá.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 14 khoá chênh lệch lớn nhất (cả 14 khoá khác biệt của bài) → khác nghĩa 4: sửa 0, giữ 1 (6.2 và 9.2 `vuttisamodhānatāya`: "để người đàn ông gom góp sinh kế" so với "do việc người ấy gom đủ các cách mưu sinh" của bản mù; `-tāya` của danh từ trừu tượng đọc được cả nghĩa mục đích lẫn nguyên nhân, ý "gom các nghề để mưu sinh" hai bản trùng, giữ nguyên), bất định 3 (7.3 `naṭehi ... vākurehi`: "kép hát và lưới bẫy" so với "diễn viên và vākura", `vākura` chỉ gặp một lần trong Pāli đã ghim; 8.1 `kulīkā ... mitamāḷhakena`; 8.3 `abbāhitaṁ pubbakaṁ aḍḍharattaṁ`: cả hai bản đều ghi chưa chắc, trùng với blocker đã có về khổ 8). Các chênh lệch còn lại chỉ là cách diễn đạt hoặc phiên âm: 5.2 ("bị sát hại" và "cái chết" cùng nghĩa `vadha`), 7.2 (bản mù giữ phiên âm `vettācara`, `saṅkupatha`; bản dự án dịch "đường dây mây", "đường đóng cọc", có tiền lệ ở pv37:11.2, vv84:11.2, mil6.3.1:19.1), 8.2, 8.4, 9.3, 11.1, 13.4, tiêu đề. Review đối kháng cả 47 khoá: đủ khoá và thứ tự, nháy kép khớp Pāli từng khoá (6 mở, 6 đóng), dấu lược 0 và 0 (phép chạy rỗng), không có số Pāli, tên bộ "Bộ Chín Bài Kệ" khớp 12/12 tệp Jātaka đã dịch có `Navakanipāta` ở khoá 0.2. Không đổi khoá nào. Không có bản Anh hay bản Việt độc lập khác. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài; quét có hệ thống Pāli trùng toàn kho: 2.1–2.2 ja392:4.1–4.2, sn9.14:5.1–5.2; 3.1–3.4 ja72:1.1–1.4; 4.4 ja456:6.3, ja505:7.3, ja546 ×4; 6.2 = 9.2): sửa 2 khoá — 3.4 dùng lại cách dịch đã published của cùng dòng Pāli ở ja72:1.4 (`neva` = "không bao giờ"; bản cũ "không thể" yếu hơn); 13.4 bỏ tiểu từ trích dẫn `ti` lọt vào tên "Daddaribhīti" (khoá uddāna kết bằng `…ti`), còn "Daddaribhī". Giữ: 2.1 "đầy tàn ác" cùng nghĩa ja392/sn9.14; 4.4 chỉ khác diễn đạt với ja456/ja546. Bất định giữ nguyên: `jīvato` (1.4), khổ 8 (`kulīkā … mitamāḷhakena`, `abbāhitaṁ pubbakaṁ aḍḍharattaṁ`), `vākurehi` (7.3).

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2`, `11.1` (tên nipāta "Nhóm N Kệ").

  Nghiên cứu nguồn ngoài 2026-10-16: Cowell (ed.), Jātaka, bản Anh PTS (phạm vi công cộng) qua
  dhammatalks.net/suttacentral/sc2016/sc/en/ja438.html (trang ghi tên Tittira Jātaka; Daddara là người
  bạn của sư tử, chim đa-đa trong truyện); PED tr.468 (pubbaka: "trước, xưa"), PED tr.223 (không có
  mục kulīkā); không có chú giải kệ Pāli đọc được. Đã đối chiếu mọi kệ (1.1–9.4). Cowell: kệ 1 thọ
  thần nói với con kỳ đà, kệ 2–3 kỳ đà đáp, kệ 4 sư tử hỏi Subāhu (con hổ), kệ 5 hổ đáp, kệ 6 sư tử
  hỏi, kệ 7–9 hổ kể quá khứ của người kia (buôn qua Kaliṅga, kép hát và bẫy, đấu gậy giữa hội, xúc
  xắc, bỏng tay vì giật đồ ăn nóng, thấy lông trên tóc và con bò chết). Khớp bản Việt kể cả 7.3
  (vākura là bẫy). Sửa 0 khoá. Bất định không phân xử được: 8.1 kulīkā mitamāḷhakena (Cowell diễn
  "kiếm lời nhờ đong thóc") và 8.3 abbāhitaṁ pubbakaṁ aḍḍharattaṁ (Cowell diễn "đánh nhau lúc nửa đêm,
  rửa máu"; PED không cho pubbaka nghĩa máu); 7.2 vettācaro (Cowell "đi đường gồ ghề, tay cầm gậy").
  Blocker về hai cụm ở khổ 8 giữ nguyên.
