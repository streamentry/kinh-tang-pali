notes: |-
  Dịch trọn 277/277 khoá của `Vicayahāravibhaṅga` (nhóm 2 của phần `Paṭiniddesavāra`): bốn dòng tiêu đề `0.1`–`0.4`; phần mở đầu và danh sách mười hai đối tượng khảo xét (`1`–`2`); bài kệ Pārāyana thứ nhất và lời giải về bốn từ của câu hỏi "Thế gian bị che phủ bởi gì" (`3`–`15`); bài kệ về các dòng chảy cùng phần giải (`16`–`24`); bài kệ về danh sắc cùng phần giải về sự liên kết, kiết sử, căn và như ý túc (`25`–`36`); bài kệ về bậc liễu tri pháp và hữu học cùng phần giải về năm căn, thắng tri và các cách hiểu "thiện xảo trong mọi pháp" (`37`–`53`); phần kết về cách hỏi, cách giải đáp và cách khảo xét bài kinh (`54`). Không khoá nào ngoài tập khoá Pāli. Thẻ `<b>…</b>` trong Pāli (`18.1`) không đưa sang bản Việt, đúng như toàn tầng.

  **Coverage English: không đo được.** Mẫu số = 119 khoá Pāli có nội dung (từ 40 ký tự trở lên theo `source/layers.yaml`, bỏ khối `:0`). Sujato phủ 0/119, `english-project` 0/119, `vietnamese-current` 0/119. Không có entry nào trong `reference-gaps.yaml` cứu được bài, và có entry cũng không cứu được `published`. Vì không có tầng Anh độc lập nào nên bài không được tuyên bố đã đối chiếu English; chỗ nào cần chứng cứ ngoài Pāli đều dựa vào tiền lệ tầng Việt (nêu dưới đây).

  **Tên của hướng dẫn: `hāra` → "hướng dẫn" (theo `ne4`, `ne6`–`ne19`), `vicaya` → "khảo xét".** Tiêu đề `0.4` theo mẫu "Nhóm … Hướng Dẫn" của `ne4`, `ne6`–`ne8`, `ne16` ("Nhóm Khảo Xét Hướng Dẫn"); `1.1`, `1.2`, `54.11` theo `ne6:1.1`, `ne6:17.3` ("Ở đây, nhóm … hướng dẫn là gì?", "Nhóm … hướng dẫn đã được vận dụng."). "Khảo xét" cho `vicaya`/`vicinati`/`pavicinati`: 11 khoá của `ne3`, `ne6`, `ne10`, `pe4` đã dùng ("phương thức khảo xét" ở `ne6:13.6`, `ne6:17.1`; "khảo xét kinh" ở `pe4:0.2`, `pe4:1.1`). Cố ý khác hai chỗ: `ne3:3.3`, `ne3:3.4` dịch "tra xét" (2 khoá); `ne2:1.2`, `ne2:3.1` liệt kê mười sáu hướng dẫn và dịch `vicayo` là "tích lũy" (2 khoá, không khớp nghĩa `vicinati` là xét tìm) — báo, không sửa bài kia. `ne21` dùng "khảo sát" cho `vicayahārasampāta` (8 khoá toàn tầng ne/pe). Cần người biên tập chốt một cách cho cả bộ Netti.

  **Chỗ dùng lại nguyên văn bản dịch có sẵn.** Pāli trùng từng byte với khoá đã dịch ở bài khác: 83 khoá của bài này, 896 cặp trùng toàn tầng (nguồn chính: `sn`, `mn`, `an`, `ne`, `snp`, `dn`, `cnd`); 77 khoá dùng lại nguyên văn ít nhất một bản; 263 cặp có bản Việt khác (phần lớn là câu cố định ngữ cảnh khác, như `Taṁ kissa hetu?` có 377 khoá "Vì sao vậy?" và 70 khoá "Vì sao?"). Trong chính bài có 23 nhóm Pāli trùng nguyên văn (kể cả `32.4` = `32.10`, `32.5` = `32.11`, các cặp kệ `6`/`22`, `26`/`36`, `25`/`31`, `40`/`53`), 0 nhóm mà bản Việt khác. Các nguồn dùng lại: bài kệ Ajita–Đức Thế Tôn `3`, `6`, `16`, `22`, `25`, `26`, `36` theo `ne16:2`–`10` (cũng là `snp5.2:1`–`6`); `37`, `40`, `53` theo `snp5.2:7`–`8` và `sn12.31:2.2`; `13` theo `ne9:32`; `10.2`–`10.3` theo `dhp304:2`–`3`; `15.6`, `15.7` theo `dn33:1.10.56`–`57` (đã đổi dấu chấm); `34` theo `an3.90:6`–`7`; `35.1` theo `sn51.12`, `sn51.20`, `sn51.31` (8 khoá "tâm tràn đầy quang minh rực rỡ" so với 3 khoá "quang minh" và 1 khoá "sáng lan tỏa"); `12.4` theo `ne13:1.4`; `17.1` theo `ne6:5.1`; `54.9` theo `ne4:38.2`, `ne19:13.1`, `ne35:4.1`; `19.3`, `19.4`, `19.6` theo `ne14:9` ("Tai …", "mũi …", "thân …"; `jivhā …` có 4 khoá "lưỡi …"). Sáu khoá còn lại khác mọi cặp:
  - `6.3` `vivicchā pamādā nappakāsati` dịch "Do hoài nghi và phóng dật nên không sáng tỏ", khác `ne16:3.3` ("Do xan tham và phóng dật", 1 khoá). Lý do: chính bài này ở `9.2`–`9.3` giải `vivicchati` và `vivicchā` là `vicikicchā` (nghi hoặc), nên hai lời phải khớp nhau. `ne16` không có phần giải ấy; Pāli ở `snp5.2:2.3` là `vevicchā` (xan tham), không phải `vivicchā`.
  - `47.2`, `47.4`, `47.6`, `47.8`, `47.10` chỉ khác `an5.15:1.5`–`1.17` ở dấu cuối (ở đó "—", ở đây ".") vì Pāli bài này kết câu bằng dấu chấm (5 cặp).
  Kệ `1.2` và `54.10` dịch "Điều đã được hỏi và điều đã được trả lời" theo `ne3:3.1`, vì là cùng bài kệ của Mahākaccāyana; còn `visajjanā`/`visajjeti`/`visajjitabbaṁ` (danh từ và động từ của phần giải) dịch "giải đáp" theo `ne6:5.3`, `ne17:23.4`–`23.5` (3 khoá), khác "giải quyết" ở `ne3:14.1`, `ne16:1.2`, `ne16:11.5` (3 khoá) và "trả lời" ở `ne3:3.1` (1 khoá).

  **Thuật ngữ và số đếm.** `pariyuṭṭhāna` → "sự hiển hiện" (11/13 khoá của `ne`/`pe`, `ne9`, `ne18`; `anusaya` → "tùy miên" (4/6 khoá `ne`/`pe`; toàn tầng "tùy miên" 41 và "thiên hướng" 42); `pahāna`/`pahīyati` → "từ bỏ" (toàn tầng 511 khoá "từ bỏ", 237 "đoạn trừ"; `ne`/`pe` 26 so với 27); `nīvaraṇa` → "triền cái" (200/230); `vicikicchā` → "nghi hoặc" (222) và `vivicchā` → "hoài nghi" (80 khoá "hoài nghi" cho `vicikicchā`); `vodāna`/`vuṭṭhāna` → "sự thanh tẩy"/"sự xuất khỏi" (`ne21:24.6`, `ne21:38.4`–`38.6`; "thanh tẩy" 5/8 khoá `ne`/`pe`); `saddhindriya`, `vīriyindriya`, `satindriya`, `samādhindriya`, `paññindriya` → "tín căn" (116/120), "tinh tấn căn" (50/83), "niệm căn" (76/81), "định căn" (79/85), "tuệ căn" (136/145); `saṁyojana` → "kiết sử" (434/841); `rūparāga` → "tham sắc" (13/15); `kāmacchanda` → "dục tham" (95/100); `orambhāgiya` → "hạ phần" (150/181); `ñāṇadassana` → "tri kiến" (306/394); `bhūmi` (`dassanabhūmi`, `bhāvanābhūmi`) → "nền" (`ne4:28.4`, `ne10:15.6`); `abhiññā`/`pariññā` → "thắng tri"/"liễu tri" (`ne10:5.15`, `ne10:9.10`, `ne10:26.3` dịch `pariññāya` là "liễu tri", `ne14:7.1` "hiểu cho trọn"); `paṭisaṅkhāna` → "quán xét" (`ne9:37.4`; tầng có thêm "phản tỉnh" 2 khoá); `vikkhambhana` → "trấn áp" (20/21); `kāyagatā sati` → "niệm thân" (8/13); `sukka dhamma` → "pháp trắng" (9/13); `chandasamādhippadhānasaṅkhārasamannāgata iddhipāda` → "như ý túc đi cùng định do dục và các hành tinh cần" (`đi cùng` 52 trên 107 khoá, `câu hữu` 20); `vīmaṁsāsamādhi` → "định do quán sát" (14 khoá "quán sát", 36 khoá "quán", 5 khoá "thẩm"; chọn "quán sát" để không trùng "tuệ quán" ở `38.3`). Mở đầu câu `Tattha` → "Ở đây" (142/187 khoá `ne`/`pe`; "Trong đó" 35 khoá, trong đó `ne6` dùng cho các câu không phải câu hỏi).

  **Số Pāli.** `cattāri padāni` = bốn (`4.1`, `7.1`, `17.1`; các lời giải `paṭhamaṁ`–`catutthaṁ` đủ 4 từ, `3`/`6` mỗi bài kệ có 4 câu hỏi/đáp), `eko pañho` = một (`4.1`), `tividho` = ba (`4.5`, `48.1`: kilesaloko, bhavaloko, indriyaloko), `duvidhaṁ` = hai (`15.2`: kāyikañca, cetasikañca; `48.3`), `tisso dukkhatā` = ba (`15.6`–`15.7`: dukkhadukkhatā, saṅkhāradukkhatā, vipariṇāmadukkhatā), `dve pañhā` = hai (`17.2`), `chasu āyatanesu` = sáu (`18.3`: rūpa, sadda, gandha, rasa, phoṭṭhabba, dhamma), `channetaṁ` = chaṇṇaṁ + etaṁ, của sáu (`19.1`: cakkhu, sota, ghāna, jivhā, kāya, mano), `tīṇi saccāni` = ba (`27.4`: dukkha, samudaya, magga), `dvīsu bhūmīsu` = hai (`27.5`), `tīṇi saṁyojanāni` = ba (`27.6`, `28.1`: sakkāyadiṭṭhi, vicikicchā, sīlabbataparāmāsa), `satta saṁyojanāni` = bảy (`27.6`, `28.2`: kāmacchanda, byāpāda, rūparāga, arūparāga, māna, uddhacca, avijjā), `dasa saṁyojanāni` = mười = 3 + 7 (`27.7`; `pañca … pañca` = năm hạ phần + năm thượng phần), `dve nāmāni` = hai (`29.1`), `pañcupādānakkhandhā`, `pañcindriyāni` = năm (`30.1`, `30.3`, `35.2`), `cattāri indriyāni` = bốn (`32.1`: satindriya, samādhindriya, paññindriya, vīriyindriya) và `catūsu indriyesu` (`32.2`, `46.5`), `tīṇi padāni` = ba, `tayo pañhā` = ba (`38.1`; ba câu của bài kệ), `dvīsu dhammesu` = hai (`43.2`: gedhā, dosā), `catūsu` = bốn (`47.2`–`47.10`: sotāpattiyaṅga, sammappadhāna, satipaṭṭhāna, jhāna, ariyasacca), `pañcavidhena` = năm (`49.1`: abhiññā, pariññā, pahāna, bhāvanā, sacchikiriyā), `tayo dhammā` = ba (`51.1`: pahātabbā, bhāvetabbā, sacchikātabbā), `dve cariyā` = hai (`52.2`), `catubbidhaṁ` = bốn (`52.8`: bốn abhisamaya), `nava suttante` = chín (`2.2`). Không có số lớn, không có `tiṁsa`, `sahassa`, `sata` hay thang kiếp.

  **Dấu lược và nháy.** Pāli có `…pe…` ở `19.3`, `23.1`, `32.7`, `32.8` → đúng một `…` ở mỗi khoá; Pāli có `…` trần ở `19.4`–`19.6`, `23.2`–`23.4` → đúng một `…` ở mỗi khoá; Pāli không có `(…)` và Việt không có `(…)`. Nháy khớp Pāli từng khoá: đo 4 loại dấu (`“`, `”`, `‘`, `’`) trên 277 khoá, 55 khoá có nháy ở Pāli, 0 khoá lệch. Pāli không có nháy đơn. Ở `28.1`, `28.2`, `28.6` tên căn `anaññātaññassāmītindriya` dịch bằng "căn sẽ-biết-điều-chưa-biết" (nối bằng dấu gạch nối) để không thêm nháy mà Pāli không có.

  **BẤT ĐỊNH — ghi lại, không giấu.**
  - `17.4` `batvādhivacanena` là từ chỉ có một lần trong toàn tầng Pāli (0 tiền lệ); Pāli ghim có thể là dạng lỗi của `vatvādhivacanena` hoặc một từ khác. Bản Việt giữ nguyên chữ `batvā` ("theo cách gọi batvā") thay vì đoán nghĩa; phần giải liền sau (`17.5`, `20.1`, `20.2`) cho thấy ý chung là hai câu hỏi về sự thanh tẩy và sự xuất khỏi, nhưng nghĩa chính xác của chữ này chưa phân xử được.
  - `14.1` `“evaṁ abhijappā”ti karitvā` dịch "sau khi nghĩ là “lẩm bẩm như vậy”"; `karitvā` ở đây còn có thể đọc là "xem như" hoặc "vì lẽ rằng". `abhijappā` dịch theo `jappā` ở `snp5.2:2.4` ("sự lẩm bẩm"); `āsattibahula` dịch "nhiều đắm chấp". 0 tiền lệ.
  - `4.3` `Ekavatthupariggahā` dịch "Vì cùng bao hàm một sự việc"; `4.4` `lokādhiṭṭhānaṁ` dịch "chỗ dựa của thế gian" (`adhiṭṭhāna` ở `ne3:15.4` và `ne17:0.4` là một hướng dẫn tên "áp dụng", nghĩa khác). 0 tiền lệ cho cả hai.
  - `2.3`, `30.4` `pārāyane` dịch "trong Pārāyana" (vị trí cách); `ne16:1.3` dịch "bậc Pārāyana" (1 khoá), khác về ngữ pháp — báo, không sửa.
  - `4.3`, `17.5`, `38.3` `evañhi āha` không nêu chủ ngữ, dịch "thật vậy, đã nói như sau/như vậy" mà không thêm tên người nói; `19.9`, `20.1`, `44.1` tương tự (`Tenāha`, `pucchati`, `āha` không nêu chủ ngữ).
  - `27.1` `Ayaṁ pañhe anusandhiṁ pucchati` (có `pañhe` ở vị trí cách, `ayaṁ` ở đối cách/thể trung): dịch "Ở câu hỏi này, hỏi về sự liên kết"; `anusandhi` dịch "sự liên kết" (0 tiền lệ ở tầng cho nghĩa này).
  - `27.6`, `28.2` `avijjāvasesā` dịch "vô minh là phần còn lại" (kiết sử thứ bảy sau sáu kiết sử đã nêu); có thể đọc "và các phần còn lại là vô minh". Số bảy khớp đủ bảy mục.
  - `32.5`, `32.11` `sarasaṅkappā` dịch "sự nhớ và ý định" (`sara` hiểu là sự nhớ); 0 tiền lệ. `32.6`, `32.12` `tadubhayaṁ` dịch "cả hai ấy" (hiểu là hai thành phần của `chandasamādhippadhānasaṅkhāra`: định và hành); chủ ngữ của `bhāveti` thêm "vị ấy" theo `sn51.12:2.1`.
  - `15.8` `odhaso kadāci karahaci` dịch "có lúc, thỉnh thoảng, theo từng phần" (`odhaso` hiểu như `odhiso`, "từng phần"); 0 tiền lệ.
  - `23.1` `nāviñchati` dịch "không bị lôi kéo"; 0 tiền lệ.
  - `43.2` `pariyuṭṭhānīyesu dhammesu` dịch "các pháp khiến hiển hiện" (theo nghĩa `pariyuṭṭhāna` = sự hiển hiện); 0 tiền lệ. `rajanīyesu` dịch "đáng luyến ái" theo `ud4.4:10.3`, `thag2.36` ("pháp khả ái"), nhưng đó là từ đồng nguyên.
  - `42.3` `gaṇanasaṅketena` dịch "bằng quy ước đếm số"; `tārakarūpāni` dịch "các hình sao". 0 tiền lệ cho cả hai.
  - `45.8` `aṭṭhamaka` dịch "người thứ tám"; `52.8` `bojjhaṁ` dịch "điều cần được giác ngộ", `abhisamaya` dịch "sự thông đạt"; 0 tiền lệ.
  - `54.6` Pāli liệt kê bảy mục không có từ nối; dịch thành một câu hỏi bảy mục, chưa tách thành cặp lựa chọn ("hay") vì Pāli không có chữ `vā`.
  - `49.4` `salakkhaṇa` dịch "đặc trưng riêng"; `paṭisambhidā` dịch "vô ngại trí" theo `an5.86:1.3`, `an5.95:1.3`.

