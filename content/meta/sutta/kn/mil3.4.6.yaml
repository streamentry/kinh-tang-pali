notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này tại commit đã ghim.
  Pāli trùng nguyên văn: dựng chỉ mục toàn tầng (5.764 tệp Pāli · 5.103 tệp Việt dự án · 284.708 + 142.247 segment) thì 206/294 khoá của lát có Pāli trùng nguyên văn ở nơi khác; riêng bài này 34/42 khoá trùng và 18 chỗ đã có bản Việt. Đã dùng lại nguyên văn ở các khoá có bản sẵn: `:1.2` giống hệt `mil3.4.5:1.2` → thưa tôn giả Nāgasena, các ngươi hãy nói · `:1.1` `Rājā āha—` → Vua nói: (43 chỗ) · `:2.1` `Thero āha—` → Trưởng lão nói— (11 chỗ) · `:2.7`, `:3.7`, `:4.7` và `mil6.1.7:3.4/4.2/5.2` `“Na hi, bhante”ti.` → Không phải vậy, thưa tôn giả (đa số 120 chỗ) · `:2.8`, `:3.8`, `:4.8` → Vì lý do gì? (3 chỗ) · `:2.11`, `:4.11` `Bhāsitampetaṁ, mahārāja, bhagavatā—` → Điều này, này Đại vương, Đức Thế Tôn đã nói (10 chỗ) · `:3.1`, `:4.1` `“Bhiyyo opammaṁ karohī”ti.` → Xin hãy xét một thí dụ nữa (20 chỗ) · `:5.1` `“Kallosi, bhante nāgasenā”ti.` → Khéo lắm, thưa tôn giả Nāgasenā (65 chỗ) · `:2.12`, `:4.12` `so na tāva kālaṁ karoti, yāva na taṁ pāpakammaṁ byantīhoti` theo `mn129:10.3` → không mạng chung cho đến khi ác nghiệp ấy được tận cùng.
  Ba khối `:2`, `:3`, `:4` lặp lại cùng một công thức (cá sấu/cá nhám/rùa/chim công/chim gõ → sư tử/báo/hổ/chó → bà mẹ hiền lành). Dịch cùng một cách cho ba khối, vì khác nhau ở bản dịch sẽ làm bài tự mâu thuẫn; khác biệt chỉ ở danh sách vật ăn.
  Cách gọi: đo lại trên đĩa trong chính tầng `mil` (194 tệp, 606 khoá có `bhante`) thì thưa tôn giả 292 · bạch ngài 137 · bạch tôn giả 54 · thưa ngài 48 · thưa Đại đức 42 · Đại đức 22; `mahārāja` (1.290 khoá): này Đại vương 568 · tâu đại vương 424 · Đại vương 161. Lát này theo đa số đo được: thưa tôn giả và này Đại vương, đồng thời giữ nhất quán trong cả ba bài `mil` của lát.
  Tên phẩm: `Milindapañha` giữ nguyên chữ Pāli (549 chỗ trong tầng) · `Nibbānavagga` → Phẩm Niết-bàn (9/9 chỗ đã có bản Việt, kể cả `mil3.4.5:0.2`) · `Nerayikaggiuṇhabhāvapañha` → Câu Hỏi Về Bản Chất Của Lửa Địa Ngục, đặt theo khuôn “N. Câu Hỏi Về …” của `mil3.4.5:0.3` và `mil6.1.6:0.4`.
  Thuật ngữ theo tiền lệ đếm được: `kūṭāgāra` → nhà lầu có mái chóp (an10.72, an4.193, an4.196) · `bhante` → tôn giả, `mahārāja` → Đại vương (đo ở trên) · `makara` → cá sấu, `susumārinī` → cá nhám, `kacchapinī` → rùa, `morinī` → chim công, `kapotinī` → chim gõ. `kammādhika` không có tiền lệ trong tầng; dịch theo nghĩa chữ nghĩa là người đã hết nghiệp, và giữ dạng “người ấy đã hết nghiệp” cho cả ba lần lặp vì `kammādhikatena` là tính từ bám vào chủ thể ngầm.
  Bất định đã ghi, không che: (1) `koṭṭhabbhantaragatāni` là thứ đã đi vào thành ruột, tôi dịch “đã đi vào ruột”, không suy thêm chi tiết giải phẫu nào. (2) `kakkhaḷāni` là tính từ chỉ độ cứng giòn; ở `:2.2` nó đi với `pāsāṇāni sakkharāyo` (đá, sỏi) nên tôi dịch “cứng ngầm như đá, sỏi”, còn ở `:3.2`, `:4.2` nó đi với `aṭṭhikāni`/`khajjakāni maṁsāni` (thịt khô) nên tôi dịch “khô cứng ngầm”. (3) `yonakasukhumālini` là người đàn bà đã sinh con, còn `khattiya-`, `brāhmaṇa-`, `gahapati-sukhumālini` là ba giai cấp người phụ nữ hiền lành; tôi dịch rõ từng loại thay vì gộp thành “bà hiền lành”.
  Dấu lược: bài này không có `…pe…` ở Pāli (đã kiểm 42/42 khoá), nên không có dấu lược nào để giữ và không có chỗ nào bịa dấu lược che chỗ thiếu. Dấu nháy kép: 31 cặp `“`/`”` ở Pāli, bản Việt giữ đúng 31 cặp và cân trên cả bài; các khoá 2.11, 4.11 và 3.7, 4.10 cố tình không có nháy kép vì Pāli cũng không có.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Đã tự xác minh được: JSON hợp lệ, đủ 42/42 khoá trong `all` và trùng khớp 42/42 khoá Pāli trong `root/pli/ms/sutta/kn/mil/mil3.4.6_root-pli-ms.json`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt vào bản Việt, không trùng nguyên văn Pāli ở khoá có nội dung, và YAML parse sạnh. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.