notes: |-
  `Mahākapijātaka`, bài thứ hai của `Gandhāravagga` trong `Sattakanipāta`. 35 khoá, tất cả đã dịch. TẦNG THAM KHẢO — đo, không đoán. 0/7 bài `kn` của lát này có bản Anh Sujato tại commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có `cp, dhp, iti, ja, kp, snp, thag, thig, ud` (đếm trực tiếp trên đĩa: cp 35, dhp 26, iti 11, ja 83, kp 9, snp 5, thag 264, thig 73, ud 8 tệp) — **không có `mil`**, và `ja374/376/407/412` không nằm trong 83 tệp `ja` ấy. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit đã ghim có đúng 26 tệp và tất cả đều là `dhp*` (Pháp Cú). Lớp lấp `english-project` của dự án không có uid nào trong lát. Ba tầng tham khảo đều vắng ⇒ bài dịch chỉ từ Pāli root ⇒ blocker thật, và đây là **giới hạn upstream**, không phải lỗi của người dịch. Vì vậy `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng để né blocker, và `status` là `draft` vì `scripts/validate.ts` coi tệp Anh thiếu là **error** khi status là `review` hoặc `published`.

  TÊN BÀI VÀ TÊN PHẨM — theo bầy lân cận, đếm được: `Sattakanipāta` → *Bộ Bảy Bài Kệ* (8 bài `ja` đã có); `Gandhāravagga` → *Phẩm Gandhāra* (`ja406`, `ja409`); `0.1` → *Jātaka*; `0.4`/`8.1` giữ Pāli `Mahākapi`.

  DÙNG LẠI NGUYÊN VĂN — ĐẾM ĐƯỢC 4/4 khoá có Pāli trùng: `0.1`–`0.3` từ `ja406`/`ja409`; `2.2` `yūthassa parihārako;` lấy y hệt `ja404:4.2` → *làm người gìn giữ cả bầy;*.

  NGOẶC KÉP. Pāli mở `“` ở `1.1`, đóng ở `1.4` (`”.`); mở lại ở `2.1` và ở `6.1`, nhưng dấu đóng chỉ về ở `7.6` (`”ti.`) — nguồn **không cân**. Vì vậy `6.1`–`6.4` (lời của con voi trong lời của con voi lớn) được dùng như **trích dẫn lồng nháy cong** `‘’`, và `7.6` đóng lời ngoài bằng `”ti.`; danh sách nháy kép như vậy cân trên cả bài. Ghi lại vì đây là quyết định biên tập chứ không phải có sẵn trong Pāli.

  VÀI CHỖ CỐT BÀI ĐỌC LẠI. `4.1` `Chinnabbhamiva vātena` — `abba` là **khoảng rách**, không phải *bờ mông*, nên dịch *Bị gió xé rách như một khoảng rách toác,*; bản nháp đầu tiên dịch *như đứt bờ mông* là sai, đã sửa trong review đối kháng. `4.2` `Nuṇṇo rukkhaṁ upāgamiṁ` chỉ là *bò tới gốc cây* — bản nháp đầu tiên thêm *vớt được cái bó buộc* (một hình ảnh không có trong Pāli), đã bỏ. `7.3`–`7.6` `Raññā raṭṭhassa yoggassa / balassa nigamassa ca; Sabbesaṁ sukhameṭṭhabbaṁ, khattiyena pajānatā”ti.` giữ `yoggassa` là *thuận lợi* và `pajānatā` là *để bậc Kshatriya tự biết mà làm*, không rút gọn thành *nếu ngài làm tròn* như bản nháp.

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó — BRIEF cấm `npm run validate|test|build|check` trong từng lát, nên để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6** vì mọi chốt tự động của `_hvi.kiểm` đã xanh (thiếu khoá, thừa khoá, ngoặc kép cân trên cả bài, NFC, không trùng nguyên văn Pāli, không lọt Pāli, khớp số dấu lược) và 35/35 khoá của chính bài này; chưa đủ 10.0 vì cổng `npm` và lượt rà của người chưa chạy.
