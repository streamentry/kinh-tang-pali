notes: |-
  Bản dịch chỉ từ Pāli root, đối chiếu tiền lệ tầng Việt của chính dự án (tha-ap), vì commit đã ghim không có bản Anh upstream (giới hạn upstream, không phải lỗi người dịch).
  Số Pāli: Tisatāni ca vārāni = ba trăm lần (ti 3 × sata 100 = 300); Pañcavīsatikkhattuṁ = hai mươi lăm lần (tha-ap36:8.1 đã dịch Và hai mươi lăm lần); aṭṭha vārāni = tám lần; Saṭṭhiyojana = sáu mươi do-tuần (saṭṭhi 60); tiṁsayojana = ba mươi do-tuần (tiṁsa 30, theo tha-ap342:8.4 và tha-ap501:4.4; đây là số đo theo tầng chứ chưa có tầng Anh độc lập nào kiểm chứng, nên ghi bất định); Duve bhave = hai kiếp sống (hai cảnh chư thiên và loài người, 15.4); Satasahassito = một trăm ngàn (sata 100 × sahassa 1.000 = 100.000, theo tiền lệ Kappānaṁ satasahassaṁ). Bài không có cụm Tiṁsakappasahassa.
  Bất định đã nêu, không bịa: (1) 3.2 `pitumātumatenahaṁ` — mata là ý kiến, sự đồng ý; dịch là theo sự đồng ý của cha mẹ. Hai tiền lệ duy nhất trong tầng (tha-ap427:1.2 sinh ra từ họ mẹ tôi; tha-ap495:1.2 sống bằng nghề ấy cho mẹ cha) khác nhau và đều không bám sát chữ nên không dùng lại; nên được người biên tập xem lại cả ba chỗ. (2) 6.4 `paṭikuṭiko agacchahaṁ` — dịch là tôi quay trở về; paṭikuṭika không phân xử được (tha-ap423:3.4 `paṭikuṭiṁ` đã dịch túp lều, tha-ap344:5.1 và tha-ap375:5.1 `paṭikuṭiko` dịch đường hẹp khó lội), nên hiểu theo ngữ cảnh của dòng này (sau khi đảnh lễ tám lần thì rời bảo tháp). (3) 11.1 `Sivikā hatthikhandhena` — sivikā ở chủ cách còn hatthikhandhena ở công cụ cách, dịch giữ sát chữ là kiệu ngồi, và trên cổ voi; nghĩa là đi bằng kiệu hay trên cổ voi, không chốt hơn. (4) 11.4 `saraṇaṁ sampate vanaṁ` — saraṇa hiểu là nơi nương náu, an toàn (ngữ cảnh 12.1-12.2 không thấy gốc cây hay gai nhọn); cách hiểu saraṇa là nương tựa tinh thần không loại trừ hẳn. (5) 12.4 `sayamevāpanīyare` hiểu là chúng tự mình được dời đi (gốc cây và gai nhọn tự biến mất khỏi đường đi). (6) 2.1 `visahi` dịch có thể (dám, đủ sức); 2.3 `onaddhaṁ` dịch bị phủ kín; 4.4 `acchatī` dịch đang nằm; 5.1 `Nacchannaṁ nappatirūpaṁ` dịch thật không hợp, không xứng; 5.4 `payojaye` (cầu khiến) dịch mà lại đi làm việc khác. (7) cetiya dịch là tháp và thūpa/buddhathūpa dịch là bảo tháp/bảo tháp của Đức Phật; hai chữ cùng chỉ một công trình trong bài, tiền lệ riêng cho cetiya trong tầng rất ít (mil8:6.8 tháp). (8) 4.2 `garucittaṁ upaṭṭhahiṁ` dịch tôi phụng sự với tâm kính trọng; tầng Pāli không có tiền lệ cho `garucittaṁ`. (9) 10.2 `mahābhogaṁ` dịch của cải lớn lao; tha-ap421:8.2 dịch amitaṁ dhanaṁ là tài sản vô lượng, khác chữ gốc. (10) 14.4 `piḷakabindukaṁ` dịch một nốt mụn nhỏ (tầng không có tiền lệ); 13.3 `Daddu kacchu ca` dịch theo tha-ap423:7.3 (kaṇḍu, chứng ngứa) vì kacchu cũng là chứng ngứa, ghẻ. (11) 1.1 giữ dạng genitive `Padumuttarabhagavato` là Của Đức Thế Tôn Padumuttara, nối với 1.2 và 1.3 (ngôi tháp của Ngài); tiền lệ duy nhất cho đúng dòng này (Tôn Đức Thế Tôn Padumuttara) khác chữ nên không dùng. (12) 11.3-11.4 `Yaṁ yaṁ disāhaṁ gacchāmi` không có tiền lệ trong tầng.
  Tiền lệ đã đo trong tầng: lokajeṭṭhassa tādino là bậc tối thượng thế gian, bậc Vững Vàng kiên định (10 trên 18; ba tệp gần nhất tha-ap330 Trưởng Thượng thế gian bậc Đáng Kính, tha-ap331 bậc tối thượng thế gian bậc đã thuần phục — hai phạm vi cho hai đa số hơi khác nhau, người biên tập có thể thống nhất một lượt); Tena kammena sukatena là nhờ nghiệp lành khéo làm ấy (24 trên 26); cetanāpaṇidhīhi ca là cùng với tâm nguyện và chí hướng (24 trên 28); Jahitvā mānusaṁ dehaṁ là sau khi từ bỏ thân người; tāvatiṁsamagacchahaṁ là đã đến cõi trời Ba mươi ba; Tattha me sukataṁ byamhaṁ là Ở đó, cung điện khéo tạo của tôi (tha-ap342); Saṭṭhiyojanamubbiddhaṁ, tiṁsayojanavitthataṁ là Cao sáu mươi do-tuần, rộng ba mươi do-tuần (tha-ap342); devarajjamakārayiṁ là tôi đã làm ra vương quyền nơi chư thiên; Bhavābhave saṁsaranto là Lưu chuyển qua các cõi hữu; Puññakammena saṁyutto là Nhờ gắn bó với việc làm phước thiện (2 trên 2); Kuṭṭhaṁ gaṇḍo kilāso ca, apamāro vitacchikā là Bệnh cùi, nhọt, và bạch biến, động kinh, và ghẻ lở (tha-ap423); Tiṇakaṭṭhañca valliñca là Cỏ, củi và dây leo (tha-ap339); Duve bhave saṁsarāmi là Tôi luân hồi trong hai kiếp sống; Ekāsane nisīditvā là ngồi trong một lần ngồi (3 trên 3); Satasahassito kappe là một trăm ngàn đại kiếp trước (22 trên 33) so với kiếp trước đây (6); Duggatiṁ nābhijānāmi với ngôi tôi là đọa xứ (91) so với khổ xứ (51); idaṁ phalaṁ là đây là quả báo (196 khoá) so với đó là quả báo (160), đó là quả báu (73), đây là quả của (15), nên dùng đây là quả báo của việc làm sạch; Paṭisambhidā catasso là Bốn vô ngại giải (483 trên 497); …pe… giữ một dấu lược (765 trên 786); công thức kết Itthaṁ sudaṁ dùng nhóm số nhiều những bài kệ này (407) chứ không dùng nhóm số ít (21). Pāli trùng nguyên văn trong tầng đã dò 31 khoá, dùng lại nguyên văn bản Việt cho 27 khoá, 4 khoá khác bản đã có (1.1, 3.2, 10.3, 18.4) với lý do ghi ở trên (10.3 chỉ khác chữ hoa và ngôi tôi thay ta). Trong bài có ba nhóm Pāli trùng nguyên văn (Aññampi me acchariyaṁ; buddhathūpamhi sodhite; sodhanāya idaṁ phalaṁ), dịch giống hệt nhau; không có cặp trùng nào mà Việt khác. Dấu lược: 21.2 Pāli …pe… giữ một dấu …; không có (…) trần. Nháy kép khớp Pāli từng khoá (mở ở 1.1, đóng ở 21.3), không có nháy đơn.
  Tên phiên: `:0.3` Pāli (Pabhaṅkarattheraapadāna) không bắt đầu bằng số nên không có số thứ tự, translationTitle bằng đúng giá trị `:0.3`. Cách viết Tuyên Ngôn chọn theo ba tệp cùng phẩm liền kề đã sửa chính tả (tha-ap337, tha-ap339, tha-ap342), không dùng dạng Tuyên Ngợ: đo trong phạm vi tha-ap300 đến tha-ap380 thì Tuyên Ngợ 54, Tuyên Ngôn 11, Ký Sự 9, Tuyên Ngợi 2; toàn tầng Tuyên Ngợ 240, Tuyên Ngôn 120, Ký Sự 103, Tuyên Ngợi 10 — hai phạm vi phân kỳ, người biên tập cần phán một lượt cho cả cuốn. Tên phẩm Gandhodakavagga dịch Phẩm Gandhodaka theo bảy tệp trong tầng.
