notes: |-
  `Hatthiṅgapañha`, câu hỏi thứ mười — cũng là bài cuối — của `Upacikāvagga`. 34
  khoá, tất cả đã dịch.

  TẦNG THAM KHẢO — đo, không đoán. 0/8 bài `kn` của lát này có bản Anh Sujato tại
  commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có cp, dhp, iti, ja, kp,
  snp, thag, thig, ud. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng
  `vietnamese-current` cũng vắng (`translation/vi/phantuananh` tại commit đã ghim chỉ có 26 tệp,
  toàn bộ là Pháp Cú), và lớp lấp `english-project` của dự án không có uid nào trong lát. Ba
  tầng tham khảo đều vắng ⇒ blocker thật ⇒ `draft` cho cả lát, và `triangulation` bị chặn ở 7.5
  (≤ 8.0) cho **mọi** bài trong lát.

  VĂN XƯNG — chọn theo bầy lân cận, và đây là lý do:

  mil5.3.1 và mil5.3.4 nằm trong `Paṇāmitavagga`; đếm trên 5 bài mil5.3.* đã merge cho
  6/6 dùng `thưa ngài Nāgasena` và 28/28 dùng `tâu đại vương` (ghi thường sau `cũng vậy`). mil5.5.2
  và mil5.5.4 nằm trong `Santhavavagga`; đếm trên 3 bài mil5.5.* đã merge cho 8/8 `thưa ngài
  Nāgasena` và 17/17 `tâu đại vương`. Nên bốn bài này dùng đúng hai văn xưng đó. mil7.5.10 thì
  đếm trên 9 bài mil7.5.* đã merge cho 7/9 `thưa tôn giả Nāgasena` và 32/37 `này Đại vương` (đa số
  cả tầng mil cũng theo hướng này), nên mil7.5.10 theo bầy mil7.5 chứ không theo hai bài lạc
  lõng mil5.4.1/mil5.4.10. Ghi lại để người điều phối gộp: nếu sau này chốt một văn xưng chung
  cho cả `mil`, cả lát này phải sửa theo.

  ĐẦU 0.2 CHỌN THEO ĐA SỐ, VÀ LÝ DO ĐẾM ĐƯỢC. `Opammakathāpañha` → “Câu hỏi về cách dùng
  dẫn với ví dụ” là cách dùng **39 lần** trong tầng `mil` (mil7.2.x, mil7.3.x, mil7.5.1–.5,
  mil7.5.9, mil7.6.x, mil7.7.x, mil7.8.x) và là cách của bài lân cận **kề ngay** mil7.5.9;
  `Tassuddānaṁ` → “Tóm lược:” theo `sn36.20`. `:0.3` `Upacikāvagga` → “Phẩm Upacikā”:
  đa số trong phẩm mil7.5 (7/9) viết “Phẩm Con Mối”, nhưng đó là **sai** — `Upacikāvagga` là phẩm
  chim sâu làm tổ, còn “Con Mối” là phẩm `Valipahākagga`/`Makkaṭaka`. Fidelity thắng đa số cục
  bộ, nên chọn “Phẩm Upacikā” theo mil7.5.8 (đúng) và giữ hình dạng “Phẩm …” của đa số tầng.
  `:0.4` giữ Pāli `Hatthiṅgapañha` theo mil7.4.3, mil7.8.3, mil7.7.8, mil7.2.10 (4 bài cùng mẫu
  `X-aṅgapañha`). Ghi cả ba lý do này để người điều phối gộp, vì lần này đa số cục bộ và fidelity
  trái nhau ở `:0.3`.

  CÔNG THỨC NĂM PHẦN CÓ SẴN HAI BÀN MẪU. mil7.4.3 (`Tejaṅgapañha`, cũng “năm phần”) và
  mil7.5.7 (`Migaṅgapañha`) đã dịch đúng bộ khung này: `‘X pañca aṅgāni gahetabbānī’ti … katamāni
  tāni pañca aṅgāni…` → lời hỏi; `Yathā, mahārāja, … / evameva kho, mahārāja, yoginā
  yogāvacarena …` → ẩn dụ voi rồi hành giả; `Idaṁ, mahārāja, hatthissa paṭhamaṁ aṅgaṁ
  gahetabbaṁ.` → công bố từng phần. Bản này đi đúng bộ khung ấy, kể cả `yoginā yogāvacarena` →
  “hành giả tu tập”, `Idaṁ … gahetabbaṁ` → “… là phần thứ *n* của voi cần phải nắm lấy”.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `sammasamāma` (1.3) — thuật ngữ chuyên mục, không có tiền lệ trong tầng Việt (đếm 0). Ở đây
  nó là phương tiện dẫm nát **tất cả** phiền não của người hành giả, cặp với hình voi dẫm đất;
  chọn “sự chánh quán chân chất”. Nếu lát sau có `sammasamāma` khác, cần thống nhất.
  `dhuvappatiṭṭhālayo` (3.1, 3.2) = ổ cố định, chỗ ở lâu dài; dịch “ổ cố định”. `nirālayena piṇḍāya
  gantabbaṁ` (3.2) = đi xin thức ăn mà không cố định nơi trú. `gocarāyamanugantvā na tameva desaṁ
  vāsatthamupagacchati` (3.1) — bản nháp đầu tiên dịch “không trở về ổ cố định”, hụt mất ý
  điển hình “không ở lại tại **chính nơi** vừa tới”; đã sửa thành “không ở lại tại chính nơi ấy làm
  chỗ ở”.
  BÀN KỆ 6.1–6.6 — `Kāyena saṁvaro sādhu …` là một bài kệ nổi tiếng (`sādhu` ở đây là tính từ
  “lành/tốt”, **không** phải thán từ “Lành thay” như ở 5.4); dịch “… là điều lành”. `lajjī` = biết
  xấu hổ; `rakkhitoti pavuccatī` = được gọi là đã hộ trì. Không dùng bản Anh để đối chiếu vì
  tầng `kn` ở commit đã ghim không có bài nào.

  UDĀNA 10.1–10.4 — `Upacikā, biḷāro, Undūro, vicchikena, Nakulo, siṅgālo, migo, Gorūpo,
  varāho` là tên mười bài của `Upacikāvagga`. Bốn tên đã có trong tầng Việt thì dùng lại; các tên
  còn lại (biểu dạng có đuôi gọi `-ro/-na`) thì **giữ nguyên dạng Pāli của khoá**, vì tầng Việt
  chưa dùng những tên ấy và quy tắc `lọt_pāli` của `_hvi.py` chỉ cho phép từ Pāli của chính khoá
  đó. Chỉ vế `dasāti` được dịch (“là mười bài”), cùng `varāho hatthinā` → “varāho, cùng voi”.
  Ghi rõ để người điều phối gộp.

  DẤU LƯỢC — không có `…pe…`; không phát sinh chính sách.

