notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja545_root-pli-ms.json` (801/801 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ: bốn dòng tiêu đề `0.1`–`0.4`, 193 bài kệ (`1`–`193`; phần lớn bốn dòng, riêng `4`, `6`, `29`, `37`, `40`, `104`, `107`, `119`, `120`, `121`, `153`, `178` có sáu dòng) và dòng kết bài `194.1`; phần văn xuôi khung truyện không nằm trong tầng Pāli đã ghim, nên người nói được suy từ xưng hô, nháy và mạch của chính các bài kệ. Nội dung chính (suy từ kệ): vua Aṅgati của xứ Videha, vào rằm Komudī, hỏi các đại thần Vijaya, Sunāma và tướng quân Alāta cách vui thú trong đêm; Alāta muốn xuất quân, Sunāma và Vijaya khuyên vui thú và thân cận một bậc đa văn (`1`–`15`); Alāta đề nghị đến Vườn Nai gặp Guṇa Kassapa, nhà lõa thể, vua đến hỏi thăm rồi hỏi về pháp đối với cha mẹ, thầy, vợ con, quân dân và về đường lên cõi lành, đường xuống địa ngục (`16`–`33`); Guṇa Kassapa nói thuyết định mệnh, phủ nhận quả thiện ác, đời sau và bố thí, rồi Alāta kể kiếp trước làm đồ tể Piṅgala mà nay vẫn không đọa địa ngục (`34`–`49`); nô lệ Bījaka đang giữ ngày trai giới khóc vì nghe thuyết ấy, vua khuyên chờ định mệnh và giao việc xử án cho ba người để chuyên hưởng dục lạc (`50`–`69`); sau mười bốn đêm công chúa Rucā đến hầu, nhà vua trách nàng nhịn ăn và bố thí vô ích (`70`–`85`); Rucā khuyên cha đừng thân cận kẻ ngu, nêu ví dụ thuyền quá tải và cái cân, kể bảy kiếp quá khứ của mình (thợ rèn ngoại tình, nhà giàu ở Kosambī, địa ngục Roruva, dê, khỉ, gia súc, người không nam không nữ, rồi tiên nữ ở Tāvatiṁsa) và bảy kiếp vị lai (`86`–`136`); Đại Phạm thiên Nārada Kassapa từ cõi trời xuống, được vua hỏi về đời sau, đáp là có và mô tả các cảnh địa ngục khi người không trả nợ bị đòi (`137`–`172`); vua xin chỉ đường thanh tịnh, Nārada khuyên sống đúng pháp như các vua xưa, bố thí và nêu hình ảnh cỗ xe pháp (`173`–`190`); Đức Phật nhận diện các nhân vật (`191`–`193`).
  - Tầng tham khảo:
      Tầng English của Sujato không có ja545 (manifest: ja chỉ có 83 tệp, ja1–79, ja126, ja159, ja466, ja534; đây là not-published-upstream, không phải not-synced); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` không có tệp cho bài này. Chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Tiền lệ Việt trong tầng do cùng một nhóm dịch, nên không phải đối chiếu độc lập; không dùng bản tóm lược hay bản dịch ngoài tầng đã ghim làm câu chữ hay đối chiếu. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
