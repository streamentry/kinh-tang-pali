  - Phép kiểm tra:
      1. Tập khoá Việt = tập khoá Pāli: 801/801, cùng thứ tự.
      2. Nháy kép `“”` khớp Pāli từng khoá và từng vị trí đầu/cuối khoá: 0/801 lệch (Pāli có 70 khoá mang nháy kép, 0 khoá mang nháy đơn `‘’`; Việt cũng 70 khoá mang nháy kép).
      3. Pāli trùng nguyên văn trong chính bài (45 nhóm, 136 cặp, 5 cặp khác có lý do) và với bài khác (92 khoá, 83 dùng lại, 9 khác có lý do): xem phần Pāli trùng nguyên văn.
      4. Dấu lược `…pe…`, `…` trần và `(…)`: Pāli 0/801 khoá, Việt 0/801 (phép chạy rỗng, không có gì để so).
      5. Số Pāli: xem phần trên, đã tự tính và đối chiếu.
      NFC đạt, không khoá rỗng, không khoảng trắng thừa, không dấu nháy thẳng; Pāli lọt sang tiếng Việt chỉ là tên riêng và từ giữ phiên âm có ghi chú (`Aṅgati`, `Alāta`, `Sunāma`, `Vijaya`, `Guṇa`, `Kassapa`, `Bījaka`, `Rucā`, `Nārada`, `Piṅgala`, `Sāketa`, `Bhāva`, `Vaṁsa`, `Kosambī`, `Rājagaha`, `Magadha`, `Vajjī`, `Dassana`, `Tāvatiṁsa`, `Candaka`, `Komudī`, `Sindhu`, `Sabala`, `Sāma`, `Kāḷa`, `Upakāḷa`, `Dhataraṭṭha`, `Vessāmitta`, `Aṭṭhaka`, `Yāmataggi`, `Usindara`, `Sivi`, `Devadatta`, `Bhaddaji`, `Sāriputta`, `Moggallāna`, `Sunakkhatta`, `Licchavi`, `Ānanda`, `Uruvelakassapa`, `Java`, `Inda`, `Sakka`, `Roruva`, `Vetaraṇī`, `Nandana`, `Jambudīpa`, `Bārāṇasī`, `Videha`, `Mahānāradakassapa`, `Mūgapakkha`, `Jātaka`) và các từ `kusa`, `tagara`, `santāna`, `Indi`, `bhiṇḍivāla`, `aghammiga`, `goṭaviso`, `anabbhanta`, `kuḍḍamukhī`. Đã in cặp Pāli↔Việt ra đọc toàn bài (801 cặp) và sửa sau lượt đọc: thống nhất `51.3`/`84.3`, `65.3`/`69.1` và `153.3`/`156.1` (cùng Pāli, cùng bản Việt), `126.1`–`126.2` (dùng nguyên `luôn được cung kính, tôn trọng`), `31.1` và `33.2` ("phàm nhân" theo `ja522`), `95.4` ("cõi dữ" theo đa số 9/15), `95.2`, `96.2`, `177.4` ("chúa tể cõi đất"), `146.2` ("bậc hộ trì đất"), `150.2`, `152.2` ("hào phóng"), `144.1` ("điều phục", "bố thí"), `134.3` ("điều ấy là vì lợi ích của chính mình"), `143.1`, `161.1` (bỏ "Dù", vì `pi` chỉ nhấn) và `188.1`.
      Công cụ kiểm của kho chưa chạy ở bước này, nên `technical_integrity` đặt 9.6 và không tuyên bố technical gate pass; còn phải chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
  Sửa lan 2026-10-13: khoá `ja545:104.6` — `neva pāpasakhā siyā`: *nên không kết bạn với kẻ ác* → *không nên kết bạn với kẻ ác*. Căn cứ: `siyā` là thức cầu khiển (`dhīro … neva pāpasakhā siyā` = bậc trí không nên là bạn của kẻ ác), nên là lời khuyên chứ không phải lời kể; bản cũ dùng *nên* như một liên từ chỉ kết quả (*nên không kết bạn*) làm câu thành mô tả. Tiền lệ cho `na/neva … siyā` ở thể khuyên: *không nên* ở `an8.43:7.2`, `an8.42:10.2`, `an8.45:7.2`, `snp2.14:26.2`, `ja515:38.4`; *chớ* ở `mnd15:83.3`, `snp4.15:10.4`. Cả ba khoá có Pāli trùng nguyên văn (`iti76:6.6`, `ja503:24.6`, `ja545:104.6`) nay có bản Việt giống nhau. Điểm không đổi; giữ nguyên các khoá còn lại.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự
  án; so 239 khoá chênh lệch lớn nhất (trên 801 khoá; đọc lại toàn bài từ Pāli) → khác nghĩa thật 2: sửa 2, giữ 221, bất
  định 16. Sửa: `179.3` (`iti sāyañca pāto ca`) "cả ban sáng lẫn ban đêm" → "cả buổi chiều lẫn buổi sáng", vì `sāyaṁ` là
  buổi chiều chứ không phải ban đêm (tiền lệ pv21:38.5 "cả buổi chiều lẫn buổi sáng"; Pāli trùng ở cp4:4.3 còn ghi "ban
  đêm", ngoài phạm vi bài này, đã báo); `122.4` (`accharā kāmavaṇṇinī`) "mang nhan sắc khả ái" → "có dung sắc tùy ý
  muốn", vì `kāma-` ở đây là theo ý muốn (bản mù cũng đọc "tùy ý"; vv33 có 13 khoá cùng cụm đã dịch "tùy ý muốn", so với
  4 khoá "khả ái" ở thi-ap29, ja523, vv16, chưa đồng bộ, đã báo). Giữ: phần lớn chênh lệch là cách diễn đạt hoặc bản mù
  dồn dòng sang khoá liền kề (9.1–9.2, 20.1–20.2, 67.1–67.2, 77.3–77.4, 128.1); `41.2` bản mù đọc `haññe` thành bị động
  nên sai; `71.4`, `80.4` `issara` là nhà vua, bản mù đọc giống bản dự án. Bất định (Pāli một mình không phân xử được,
  bản mù cũng chưa chắc): `24.4` `akataṁ bhūmiṁ`; `37.6` `goṭaviso` (giữ chữ Pāli); `38.4` `devavīriyo`; `64.4`
  `tadantarā`; `79.3` `kuḍḍamukhī` (giữ chữ Pāli); `83.3` `niyatetaṁ abhuttabbaṁ`; `91.4`; `99.4` và `113.2` `sātave
  rato`; `101.4` `mā hevuppathamāgamā` (lời cấm hay lời nguyện, và người được nói); `117.3` `bhinnāgate`; `118.1`
  `sātaputtā`; `181.3` `sāritakkho`; `182.3` `anabbhanto` (giữ chữ Pāli); `184.2` `kubbaro`; `185.3` `apālambo`. Review
  đối kháng toàn bài sửa thêm 2 khoá ngoài danh sách chênh lệch: `126.3` `na muccissaṁ` là thì tương lai (cùng bài dùng
  `-issaṁ` cho tương lai ở 108.4, 125.4), "con vẫn chưa thoát" → "con sẽ chưa thoát khỏi thân phận nữ"; `156.2`
  `aghammigehi`: bỏ chữ Pāli để nguyên "loài aghammiga", dịch "các thú đáng sợ" theo ja547:174.2. Số Pāli: `cullāsīti` ở
  43.1 và 45.2 dịch tám mươi tư theo nghĩa đen; truyền thống Ājīvika nêu 8.400.000 đại kiếp nhưng Pāli bài này không nói
  vậy, ghi bất định, không đổi; `dve sattarattassa` ở 70.1 là 2 × 7 = mười bốn đêm; `soḷasa` ở 129.2 là mười sáu; đã
  đếm. Dấu nháy, dấu lược, tập khoá và NFC của tệp khớp Pāli. Không có bản Anh hay bản Việt độc lập khác. Cổng kỹ thuật
  của kho (`npm run validate`, `npm test`, `npm run check`, `npm run build`) chưa chạy ở lượt này.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bài 801 khoá; đoạn song song sn1.39:3.1–3.3, mnd2:25.1–25.7, iti76:6.2, ja512:2.2, ja491:12.4, snp3.12:25.1; không có bản Việt nguyên bài độc lập, không có bản Anh): sửa 9 khoá. Sai nghĩa: `91.4` `Dummo ca yā balisā ambujova` là cách tách chữ của `dummocayā` (khó được gỡ ra) + `balisā` (xuất xứ cách: khỏi lưỡi câu), đúng khuôn `dummocayā` + xuất xứ cách ở mnd2:25.2–25.7 ("khó được giải thoát khỏi…"), nên "như kẻ khổ não, như con cá đã nuốt lưỡi câu" → "khó thoát ra, như cá khỏi lưỡi câu" (bỏ bất định `dummo` cũ); `87.1` "con chỉ nghe rằng" biến `87.2` thành nội dung điều được nghe, trong khi nội dung là `87.3`–`87.4` → "điều này con chỉ được nghe," (sn1.39:3.1 dùng "rằng" vì ở đó dòng sau mới là nội dung); `150.3` `luddaṁ taṁ bhontaṁ niraye vasantaṁ` là đối cách đi với `ko codaye`, không phải lời khẳng định vua đang ở địa ngục → "khi ngài, kẻ tàn nhẫn, ở trong địa ngục"; `121.4` `manussatte sudullabhe` là định sở cách, bản cũ thêm quan hệ nhượng bộ "dù" → "trong thân người rất khó được". Xưng hô: `143.3`, `145.3`, `147.1` vua gọi Nārada "tâu" (từ chỉ dùng với vua) → "thưa"; `142.3` Phạm thiên nói với vua "ta xin nói" → "ta nói". Văn: `95.1` "chưa đầy đủ" → "vẫn chưa đầy" (`paripūro`).
  Giữ: `153`–`172` "kẻ ấy" cho `taṁ`. Bất định mới: `taṁ` ở `153.3`, `156.1`, `158.1`, `160.3`, `161.1`, `162.1`, `163.1`, `166.1`, `167.4`, `169.1`, `170.1`, `172.1`, `172.4` cũng có thể là đại từ ngôi hai (= nhà vua), vì `153.3` lặp đúng khuôn `150.3` (`taṁ bhontaṁ niraye vasantaṁ … ko codaye`); nhưng `155.4` và `157.4` (`naraṁ dukkaṭakammakāriṁ`) nói theo ngôi ba chung, nên chưa đổi. `69.2` `bahumaññatha` có thể là quá khứ trung động ngôi ba số ít (đuôi `-ttha`, "vua chỉ xem trọng dục lạc", lời kể), nhưng Pāli đã ghim đặt nháy mở ở `69.2`, nên giữ cách đọc lời nói. Các bất định cũ khác giữ nguyên. Điểm `triangulation` giữ 7.5 vì không có bản đối chiếu độc lập nào mới.

  Quyết định hội đồng biên tập 2026-10-16: A13 — `29.6` (bỏ dấu chấm thừa sau dấu đóng lời thoại, ví dụ `?”.` thành `?”`); C3 — `0.2` (tên nipāta "Nhóm N Kệ").

  Nghiên cứu nguồn ngoài 2026-10-16: E. B. Cowell và W. H. D. Rouse (dịch), The Jātaka vol. VI (PTS 1907, phạm vi công cộng; đọc qua static.sirimangalo.org/old/jataka/6.htm). Lưu ý uid: ja545 'Mahānāradakassapa' trong bilara tương ứng Jātaka số 544 trong bản Cowell (tr. 114–126). Đã đối chiếu toàn bài (các nhóm 1–193: nhà vua Aṅgati và ba vị quan, giáo thuyết của Guṇa Kassapa, Alāta và Bījaka, công chúa Rucā kể bảy kiếp, Nārada giảng về địa ngục, danh sách các vị vua cổ, ví dụ cỗ xe); không sửa khoá nào, Cowell dịch sát và nghĩa khớp ở mọi khoá có nội dung riêng, kể cả các khoản chi tiết của ví dụ cỗ xe (181–190). Bất định giữ nguyên: 56.3 `kumbhadāsiyā kucchismiṁ` (bản dịch 'nữ tỳ đội ghè nước'; Cowell 'poor prostitute'), 182.5 `anabbhanta` (Cowell 'the name of the wheel'), 79.3 `kuḍḍamukhī` (Cowell 'impetuous one'), 22.2 `indi` (bản dịch 'gươm Indi').

  Rà từng chữ bằng DPD 2026-10-16: 801 khoá đã rà (số SuttaCentral ja545 = [544] Indacanda, Cowell 544, xác nhận bằng câu đầu `Ahu rājā videhānaṁ`; đối chiếu chú giải CST Ja 545, Cowell, Indacanda); sửa `2.2` (`anāgate` = chưa qua hết: chú giải `pariyosānaṁ appatte`, Cowell 'ere the first watch was over' → "chưa tàn"), `5.3` (`haṭṭhaṁ yoggaṁ balaṁ sabbaṁ` là tân ngữ của `sannāhayāmase`, không phải câu khẳng định), `24.4` (`akataṁ bhūmimāgate`: chú giải `akatokāsaṁ`, Cowell 'left him no room' → "không chừa chỗ trống"; gỡ bất định cũ), `37.6` (`goṭaviso`: chú giải `pacchābandho`, Cowell 'stern-rope' → "dây buộc đuôi thuyền"; gỡ bất định cũ, bỏ chữ Pāli), `38.4` (`devavīriyo` = `deva` + `avīriyo`: DPD deconstructor, chú giải `avaso avīriyo`, Cowell 'the giver is helpless and weak'; bỏ "tinh tấn là việc của trời"), `71.2` (`me` không phải đối cách; chú giải `sahāyikāyo pi me`: "các bạn gái của con cũng hãy trang điểm"), `79.3` (`kuḍḍamukhī`: DPD `kuḍḍa` 2.1 'powder', chú giải mặt thoa bột cải → "cô gái mặt thoa phấn"; Cowell 'impetuous' khác), `83.3` (`niyatetaṁ abhuttabbaṁ`: chú giải `niyativasena … abhuñjitabbaṁ`, Cowell → "việc không ăn này đã được định sẵn"; gỡ bất định cũ), `99.3`–`99.4` (`dāsova` có `iva` bị bỏ; `saggātimāno` = `sagga` + `atimāna`, chú giải `sagge atimāno`, Cowell 'like that slave Bījaka … thinking too much of heaven' → "như người nô lệ một lòng hướng về cõi trời, Bījaka, người ưa thích điều lành"), `117.3` (`bhinnāgate` là tên xứ: chú giải `bhinnāgate nāma raṭṭhe`, dị bản DPD `bheṇṇākaṭe`, Cowell 'in Bheṇṇākaṭa' → "ở xứ Bhinnāgata"), `128.1` (`santānamayaṁ`: DPD `santāna` 1 'continuity', chú giải `katasantānaṁ` → "vòng hoa nối liền thành chuỗi"; Cowell đọc là cây trời, khác), `140.2` (`byathita`: DPD `byathati` 'trembles; is afraid', chú giải `bhītacitto` → "tâm kinh sợ"), `153.2`–`153.3` (ngôi hai: chú giải `attānaṁ ākaḍḍhiyamānaṁ … passissasi`, `taṁ bhavantaṁ`, Cowell 'thou wilt see thyself dragged … as thou livest in hell', khuôn `150.3` → "chính mình", "ngài"), `182.3` (`kucchisaññamaṁ` + `abbhanto`: chú giải `mitabhojanamayena telena abbhanto`, DPD `abbhañjati` 'lubricates' → "dầu bôi trơn"; bỏ chữ Pāli), `187.4` (`yogo` = nỗ lực, DPD `yoga` 2 'effort'; ách là `yuga` ở `186.4`; chú giải, Cowell 'application'). Giữ: `54.4` `Bhāva` là tên người (chú giải `evaṁnāmako seṭṭhi`), `50.2`, `118.1`, `173.3`. Bất định: `69.2` (chú giải, Cowell, Indacanda đọc lời kể, nhưng Pāli ghim đặt nháy mở), `101.4` (chú giải, Indacanda: lời dặn cha; Cowell: nói về Bījaka), `156.1`, `158.1`, `160.3`, `161.1`, `162.1`, `163.1`, `166.1`, `167.4`, `169.1`, `170.1`, `172.1`, `172.4` (`taṁ`: chú giải đọc `taṁ bhavantaṁ` ngôi hai, Cowell và Indacanda ngôi ba; giữ "kẻ ấy", nên `153.3` và `156.1` cùng Pāli nay khác bản Việt vì `155.4` đã chuyển sang ngôi ba chung), `187.2` (`vuddhisevī`: DPD chỉ có `vuddhasevī` khớp bản Việt, chú giải và Cowell đọc `vuddhi` là tăng trưởng), `22.2`.
  Lượt hoàn thiện 2026-10-17: thống nhất thuật ngữ 1 khoá: 16.4 `acela` "một nhà lõa thể" → "một vị lõa thể" (như 192.2 `acelako` "vị lõa thể"); các nhóm khác đã đếm theo lemma (`niraya` "địa ngục", `paraloka` "đời sau", `nissanda` "kết quả", `brāhmaṇibbha` "Bà-la-môn và gia chủ", `deva` hô cách "tâu đại vương", `dibya` "cõi trời"/"thiêng liêng" theo ngữ cảnh ngày rằm) đều đã nhất quán. Thêm 8 chú thích cho người đọc (22.2 `indikhagga`, 56.3 `kumbhadāsī`, 69.2 lời kể hay lời vua theo nháy của Pāli ghim, 79.3 `kuḍḍamukhī`, 101.4 chủ ngữ của `mā āgamā`, 128.1 `santānamaya`, 156.1 `taṁ` ngôi hai/ngôi ba ở 12 khoá, 187.2 `vuddhisevī`). Ghi chú cũ đã bị thay: "Vì vậy `triangulation` 7.5 và bài giữ `draft`", "không dùng bản tóm lược hay bản dịch ngoài tầng", "Không có bản Anh hay bản Việt độc lập khác" và "Điểm `triangulation` giữ 7.5" (nay `review` với waiver `no-upstream-english`, triangulation 8.4; đã đối chiếu chú giải CST, Cowell PTS 1907, Indacanda); `24.4` "nơi đất chưa được sửa soạn", `37.6` `goṭaviso` "giữ phiên âm", `38.4` "tinh tấn là việc của trời", `83.3` bất định (đã sửa 2026-10-16 theo chú giải và DPD); `91.4` `dummo` "kẻ khổ não" (đã sửa 2026-10-15). Còn mở: `69.2`–`69.4` kiểm độc lập 2026-10-16 coi là lỗi thật (lời kể), bài vẫn giữ nháy theo Pāli ghim và nay có chú thích cho người đọc.
  Chấm lại độc lập sau rà DPD + kiểm độc lập 2026-10-17: 30 khoá ngẫu nhiên mới (seed md5('ja545score') = 2747153187, loại khoá có trong verify_ja545, các dòng SỬA/BẤT-ĐỊNH của dpd/ja545.tsv, improve_ja545.tsv) đối chiếu Pāli ghim, chú giải CST (vcomm/ja545/545.txt), DPD: LỖI-THẬT 0/30. Mẫu trước 40 khoá có 1 lỗi (69.2–69.4), CHƯA sửa, chỉ thêm chú thích. Phân xử 69.2–69.4: LỜI KỂ, không phải lời vua. Căn cứ: 69.1 `Idaṁ vatvāna vedeho` là phân từ quá khứ, cần một động từ chính có chủ ngữ Vedeha, và động từ duy nhất là `bahumaññatha` (quá khứ trung động ngôi ba số ít, như `avandatha` 139.4); cùng khuôn 65.3–65.4 `Idaṁ vatvāna vedeho, paccagā sanivesanaṁ`; 69.3–69.4 lặp đối 64.2 (trước kia bận rộn, nay không); chú giải đóng lời vua ở 68 (`vatvā kāmaratimatto ahosi`), Cowell và Indacanda đọc lời kể. Nháy mở của bản MS là dấu câu biên tập, không phải chữ Pāli; câu Việt hiện tại để 69.1 «Nói xong lời này, Vedeha,» không có vị ngữ, và mệnh lệnh «Hãy chỉ xem trọng các dục lạc» không có người nghe hợp lý. Đây là lỗi người nói/thức còn sót (3 khoá, cục bộ, không đổi giáo nghĩa) → grammar 8,7, semantic 8,9; không đặt blocker. Gộp: 1 lỗi/70 khoá ngẫu nhiên (1,4%). Nguồn: chú giải CST, Indacanda [544], Cowell PTS 1907 số 544 toàn bài, DPD → triangulation 8,7. 8 chú thích khách quan, có nguồn; nhưng 69.2 là lỗi đã phân xử được mà chỉ chú thích → 8,6. check.py OK (801/801). validate.ts pass; quality:check exit 1 do scorecard cũ lệch nội dung; test/check/build không tự chạy → 9,3. Blocker viết lại vì chuỗi cũ sai về triangulation/draft.
  Lượt chấm độc lập 2026-10-17: `69.2`–`69.4` theo cú pháp (*Idaṁ vatvāna vedeho* cần động từ chính *bahumaññatha*, cùng khuôn 65.3–65.4) và chú giải, Cowell, Indacanda là **lời kể**, không phải lời vua; Pāli ghim đặt nháy kép nên bản dịch giữ dấu, đã có chú thích. Việc bỏ nháy lệch dấu với bản ghim — để người biên tập quyết.
  Lượt thi hành đề nghị còn mở sau chấm round 2 (2026-10-17): không đổi lời kinh và chú thích. Mục còn mở duy nhất là 69.2–69.4 (lời kể hay lời nói của vua Vedeha, dấu nháy của Pāli ghim), để người biên tập quyết; các dòng Pāli trùng khác chữ trong bài (4.1/52.1, 13.4/46.4, 48.2/110.2, 147.4/148.2, 153.3/156.1) đều do người nói hoặc chủ ngữ khác, giữ.
  Thi hành quyết định biên tập 2026-10-17 (mục 1): `69.2`–`69.4` giữ dấu nháy của Pāli ghim (lời vua nói), không đổi thành lời kể; lời kinh không đổi, chú thích `69.2` thêm một câu nêu quyết định. Câu trong ghi chú cũ đã bị thay: «Việc bỏ nháy lệch dấu với bản ghim — để người biên tập quyết» và «Mục còn mở duy nhất là 69.2–69.4 …, để người biên tập quyết» (nay đã quyết). Kiểm notes: không còn mục «để người biên tập», «chờ quyết» hay «đề nghị» nào khác; các bất định còn lại (`taṁ` ngôi hai/ngôi ba ở `153`–`172`, đã có chú thích `156.1`) không thuộc văn bản quyết định, giữ.
  Thi hành đính chính quyết định 2026-10-17: 69.1–69.4 đọc là lời kể theo chính chữ ghim (bahumaññatha quá khứ, byāvaṭo không có chủ ngữ ngôi một) và chú giải CST s0514a3 (kệ 1218–1221 «Tamatthaṃ pakāsento satthā āha»; «vatvā kāmaratimatto ahosi»), Cowell, Indacanda: bỏ dấu nháy ở 69.2/69.4 (dấu câu của ấn bản), 69.1 «Nói xong lời này, Vedeha» có vị ngữ ở 69.2, 69.3 «và cũng không còn bận rộn với…» (như 64.2). Câu cũ «Việc bỏ nháy lệch dấu với bản ghim — để người biên tập quyết» và «69.2–69.4 giữ dấu nháy theo Pāli ghim» đã bị thay.
