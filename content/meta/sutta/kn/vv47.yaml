notes: |-
  Dịch từ Pāli root (vv47, 57/57 khoá).

  Cổng coverage tiếng Anh không đo được gì trên bài này: mẫu số bằng 0 (0 khoá Pāli có độ dài ≥ 40 ký tự, bỏ khối :0). Khoá dài nhất là 4.1 (31 ký tự). Toàn bộ 57 khoá đều là các câu kệ ngắn.

  Tầng tham khảo tiếng Anh và Việt hiện hành đều vắng:
  - upstream-manifest.json xác nhận edition english-sujato có 755 tệp kn nhưng 0 tệp cho vv (not-published-upstream).
  - vietnamese-current (Thích Minh Châu) tại commit đã ghim chỉ có Pháp Cú (26 tệp).
  - english-project của dự án chưa có tệp cho vv47.
  Do đó bài giữ status draft kèm blocker noEnglishEditionUpstream: Thiếu bản dịch tiếng Anh đối chiếu, và điểm triangulation đặt 7.5 (≤ 8.0).

  Năm phép kiểm tra:
  1. Tập khoá: 57/57 khoá Pāli khớp hoàn hảo với bản Việt (mẫu số 57).
  2. Dấu nháy đơn và kép: 0/57 lỗi; khớp Pāli từng khoá (mở ở 1.1, 4.1, 9.1; đóng ở 3.4, 7.4, 13.4).
  3. Nhất quán: phép kiểm chạy rỗng do bài không có cặp Pāli trùng nguyên văn nội bộ nào (0 cặp trùng).
  4. Dấu lược: bài không có dấu lược, cả hai tầng đều 0 dấu lược (0/57 lỗi).
  5. Số Pāli: 5/5 số được xác lập và tính toán chính xác: 0.4 (9 / navama), 4.3 (cattāri = 4), 8.1 (tidasa = 33), 8.3 (tāvatiṁsa = 33), 14.1 (navama = thứ chín).

  Tiền lệ và đối chiếu:
  - Vimānavatthu (0.1) giữ nguyên Pāli theo 68/69 bài trong kho.
  - Itthivimāna (0.2) dịch Chuyện Cung Điện Nữ Hư Không theo 40 bài trong kho.
  - Mañjiṭṭhakavagga (0.3) dịch Phẩm Mañjiṭṭhaka theo 8 bài cùng phẩm.
  - Tathāgate vā sambuddhe (10.3) và atha vā tassa sāvake (10.4) đối chiếu an4.4:3.3-3.4.
  - Dò toàn kho ghi nhận 219 cặp Pāli trùng, trong đó 118 cặp trùng khớp nguyên văn bản Việt.

  Các điểm bất định và lựa chọn biên tập:
  - 5.3-5.4: 'Nāssa maggaṁ avekkhissaṁ, na taggamanasā satī' — chú giải Paramatthadīpanī III giải thích đại từ assa chỉ con bò cái (gāvī) và taggamanasā chỉ tâm hướng về con bò; do tâm mải mê hướng về bảo tháp nên nàng không để ý đường đi của con bò và không có niệm về nó, dẫn đến bị húc chết.
  - kosātakī (4.1): tên loài dây leo thuộc họ bầu mướp (mướp đắng rừng, Luffa acutangula) có vị đắng không ai ưa thích, được giữ tên định danh theo văn cảnh.

  Bốn lệnh kiểm tra cổng kỹ thuật dành cho coordinator: npm run validate, npm test, npm run check, npm run build. Vì agent không chạy các lệnh này, technical_integrity được đặt 9.6.

  Lượt cải thiện 2026-10-11 (kiểm toán độc lập, đọc đối kháng 57 khoá; đổi 7 khoá):
  - 2.1 `Pītapāsādasayane`: trước "Giường nằm trong cung điện màu vàng" (hiểu thành giường đặt trong cung điện, mất màu vàng của giường); sau "Có cung điện và giường nằm màu vàng" (tiền tố pīta- chi phối cả cung điện lẫn giường; cả 2.1–2.4 là các hô cách song hành với 1.1–1.4 và `bhadde` ở 3.1). Đây là lỗi nghĩa thật. 2.4 `pītasse`: bỏ "đàn" (Pāli không có nghĩa số nhiều/bầy).
  - 4.1 `bhante`: người đáp nói với Sakka (7.1 `devinda`, 8.1 `Idaṁ sutvā tidasādhipati`), không phải một tỳ-kheo; "Thưa tôn giả" → "Thưa ngài".
  - 6.1 `avadhī`: "húc chết" → "giết" (Pāli chỉ nói giết; chi tiết húc thuộc chú giải, không thuộc lời kinh).
  - 6.4 `bhiyyo`: "thù thắng hơn" → "nhiều hơn" (bhiyyo là "hơn nữa/nhiều hơn", không có nghĩa "thù thắng").
  - 8.3 `Tāvatiṁse pasādento`: "làm cho cõi Ba Mươi Ba sinh lòng tịnh tín" → "làm cho chư thiên cõi Ba Mươi Ba tịnh tín" (người có tín tâm là chư thiên ở đó, không phải cõi).
  - 10.1: "tâm đã có lòng tịnh tín" → "tâm đã tịnh tín" (bỏ lặp).
  Điểm đổi: semantic_fidelity 9.2 → 8.9 (lỗi 2.1 và các chỗ thêm nghĩa nhỏ ở 6.1, 6.4 do bản trước tự chấm quá cao); terminology 9.2 → 9.0 (tiêu đề `Pīta` là tính từ "vàng" nhưng giữ nguyên Pāli theo tiền lệ Pabhassara/Nandana — xem dưới); vietnamese_clarity 9.2 → 9.0 (5.3 "nó" chưa có tiền ngữ khi đọc tuần tự; 1.1 treo); ambiguity_integrity 8.8 → 8.6 (thêm hai bất định chưa ghi nhận ở trên). final_score 9.14 → 9.05 (trung bình số học thô).
  Bất định còn lại: (a) 6.3 `abhisañceyyaṁ` là dạng hiếm; "hoàn tất việc cúng dường" là cách đọc theo ngữ cảnh, chưa phân xử bằng dạng song song. (b) 6.2 `apattamānasaṁ` đọc là "ý nguyện đến bảo tháp chưa thành"; có thể đọc "tâm chưa đến được bảo tháp". (c) 5.4 `taggamanasā satī` giữ nguyên bất định như đã nêu ở 5.3-5.4. (d) Phép số: `tidasa` nghĩa đen là "ba mươi" (tidasādhipati ở 8.1), dùng làm tên gọi chư thiên Tāvatiṁsa; bản dịch theo tiền lệ vv41/vv48/vv67 (Tam Thập Tam) — không phải phép tính 33 trực tiếp như ghi ở mục Năm phép kiểm. 
  Chỗ nghi ngờ nhưng không đổi: tiêu đề 0.4 và 14.1 giữ "Cung Điện Pīta" (Pīta = "vàng", tương tự ví dụ `amba` = xoài; đổi riêng một tệp sẽ lệch cả bộ); tiêu đề phẩm 0.2 `Itthivimāna` hiện dịch "Nữ Hư Không" (không có ākāsa trong Pāli, lặp ở khoảng 51 tệp vv) — không sửa riêng tệp này. Cách dịch 1.1-1.4 giữ nguyên với vv36:1.1-1.2 (cùng Pāli, cùng Việt).
  Cổng kỹ thuật vẫn do người điều phối chạy: npm run validate · npm test · npm run check · npm run build.
