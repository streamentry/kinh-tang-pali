notes:
  - >-
    Sửa lan 2026-10-13: khoá 6.2, "dù cho sự hiện hữu hay phi hiện hữu ở đời này
    hay đời sau" → "vì hữu này hay hữu khác, ở đời này hay đời sau"
    (bhavābhavāya idha vā huraṁ vā; bhavābhava dịch "hữu này hữu khác" ở mnd2,
    mnd3, mnd13, thag14.2, bv7, bv14, còn "hữu và phi hữu" chỉ ở các câu
    itibhavābhavatā và vītataṇho bhavābhave như ud2.10, iti49, iti58). Khoá 6.4,
    "sau khi quyết định và nắm giữ giữa các pháp" (khẳng định) → "không có điều
    nào được nắm giữ sau khi quyết định giữa các pháp" (yassa … natthi ở 6.1 chi
    phối cả đoạn kệ, dòng cuối lược natthi; mnd5:34.4 cùng câu Pāli và
    mnd5:38.1/38.4 giải thích natthi na santi; cùng cách dịch ở snp4.9:3.3,
    mnd9:8.3, mnd13:87.2). Hai khoá 6.2 và 6.4 nay trùng nguyên văn mnd5:34.2 và
    mnd5:34.4; 6.1 và 6.3 đã trùng mnd5:34.1 và 34.3.
  - >-
    Quyết định hội đồng biên tập 2026-10-16: B11 — snp4.5:2.2, snp4.5:3.4,
    snp4.5:7.1 (`muta` = cảm nhận (PED/DPD: sensed), không phải “nhận
    thức”/“tưởng”); B12 — snp4.5:2.2, snp4.5:3.4, snp4.5:4.2, snp4.5:8.3
    (`vata`/`sīlabbata`: bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”/“giới
    cấm”); B18 — snp4.5:7.4 (`kenīdha … vikappayeyya`: `kena` là cách công cụ,
    khớp lời giải Niddesa mnd4/mnd5).
  - >-
    Sửa lỗi nghĩa 2026-10-16: snp4.5:3.3–3.4 — sửa lệch khoá, "bhikkhu na
    nissayeyya" đứng ở 3.3 Việt nhưng thuộc 3.4 Pāli: 3.3 "Vì thế, vị tỳ-kheo
    chớ nương tựa" → "Vì thế, cái được thấy, được nghe hay được cảm nhận,"
    (`tasmā hi diṭṭhaṁ va sutaṁ mutaṁ vā`); 3.4 "vào cái được thấy, được nghe,
    được cảm nhận, hay vào giới và cấm hạnh." → "giới và cấm hạnh, vị tỳ-kheo
    chớ nương tựa." (`sīlabbataṁ bhikkhu na nissayeyya`). Nghĩa trọn câu không
    đổi (cả bốn là tân ngữ của `nissayeyya`); chia khoá theo Pāli ghim, khớp
    Sujato https://suttacentral.net/snp4.5/en/sujato.
  - >-
    Thống nhất cấp kho 2026-10-17 (diṭṭhi/ñāṇa «tri kiến», cùng mnd5): diṭṭhi
    «tri kiến» → «kiến» ở 1.1 («trong các kiến»), 4.1 («một kiến ở đời»; «về
    đời» → «ở đời» vì lokasmiṁ là vị trí cách, khớp mnd5:21.1, 26.1), 5.4 («bất
    cứ kiến nào»), 7.3 («không nắm giữ kiến»); ñāṇa «tri kiến» → «trí» ở 4.2
    («dù bằng trí») và 5.2 («ngay cả vào trí»). Lý do: «tri kiến» trong kho là
    cách dịch ñāṇadassana (≈341 khoá), trước đây 4.1–4.2 dùng cùng một chữ cho
    hai chữ Pāli khác nhau; ñāṇa đứng riêng trong Snp phẩm 4–5 là «trí»
    (snp4.9:5.1, 6.1, snp4.11:7.3, snp5.8:2.1), mnd5 giải ñāṇa ở 22.2, 29.1 là
    trí của tám thiền chứng, của năm thắng trí, tà trí và dịch dòng kệ «dù bằng
    trí»; Sujato «view», «notion». Nghĩa không đổi, không thêm chữ; các dòng dẫn
    lại trong mnd5 đổi cùng lúc. Còn lệch, ngoài phạm vi việc này:
    sīlavata/sīlabbata «giới và cấm hạnh» (2.2, 3.4, 4.2, 8.3) so với «giới luật
    (và/hay) cấm hạnh» ở mnd5; 5.2 Pāli ghim là ñāṇe (vị trí cách) còn mnd5:27.2
    là ñāṇena (công cụ), nên hai dòng khác nhau có lý do.
  - >-
    Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 2.1 (sai cách:
    `attani` là vị trí cách, bản cũ «Điều gì tự thân kẻ ấy thấy» đọc như chủ ngữ
    nhấn mạnh «chính kẻ ấy thấy» → «Điều gì nơi tự thân kẻ ấy thấy»; căn cứ lời
    giải mnd5:10.2 `yadattanī ti yaṁ attani`, chú giải Snp
    «uppannadiṭṭhisaṅkhāte attani … ānisaṃsaṃ passati», DPD attani «in oneself;
    for oneself», Sujato «for themselves»; mnd5:9.1, 10.1, 10.25, 14.1 đổi cùng
    lúc). 32 dòng kệ đã đối chiếu; nghi-giữ, không sửa: 5.4 `na pacceti` «tin
    vào» (lời giải mnd5:31.3 và chú giải: na paccāgacchati), 8.1 `kappayanti`
    «hư cấu» (mnd5 «tạo dựng»), 1.2 `jantu` đã nằm ở chữ «Kẻ» của 1.1.
