notes: |-
  Bản dịch tiếng Việt mới cho bài kinh tha-ap347 — trưởng lão Naḷāgāriko, bài thứ năm
  trong Ekapadumiyavagga. Tên bài nghĩa là vị trưởng lão dựng nhà lợp lau.

  Tiền kiếp: không xa núi Himavanta có ngọn núi tên Hārito, bậc Tự Tại tên Nārada ngự dưới
  gốc cây. Ông dựng một lều tranh phủ cỏ, dọn sạch đường kinh hành nhưng không dám tở ra với
  bậc Tự Tại. Trong mười bối kiếp ông hưởng thọ ở cõi trời và làm vương quyền nơi chư
  thiên; ông từng làm Chuyển Luân Vương với vương quốc rộng lớn đếm không hết. Ngày môn của
  ông cao vút như tháp Indalaṭṭhī và có ngàn cánh tay. Đã thọ hai thành tựu, được cội
  nguồn thiện căn cất gọi, ông xuất gia trong giáo pháp của Đức Thế Tôn Gotama, đi sâu vào
  tinh tấn, quán chứng sự vắng mặt của các hình tướng, bẻ gãy xiềng xích và sống không
  còn lậu hoặc.

  Bất định đã ghi lại, không sửa trong kinh:
  - `Indalaṭṭhī` giữ nguyên là tên tháp. Cụm này chỉ xuất hiện đúng ở bài này trong Pāli đã
    ghim và tầng Việt chưa có tiền lệ; tự đặt một tên Hán–Việt cho nó sẽ là bịa địa danh.
  - `Naḷāgāraṁ` (2.1) dịch là lều tranh: `naḷāgāra` theo sn6.14:9.4 và thag3.13:2.4 là
    nhà lợp lau, và động từ đi kèm là dựng lên.
  - `sukkamūlena codito` (6.2) dịch là được cội nguồn thiện căn cất gọi, theo tha-ap187:4.2
    với cùng công thức; tha-ap188:2.2 dịch khác nhưng ngữ cảnh khác nên không lấy.
  - `Nāgova bandhanaṁ chetvā` (7.3) dịch là như voi bẻ gãy mọi xiềng xích, theo ba cặp
    tiền lệ tha-ap376, tha-ap383, tha-ap463 với đúng công thức này; không tự sinh thêm một
    cách dịch thứ tư.
  - `Catuddasasu kappesu` (3.1) dịch là trong mười bối kiếp; chữ bối là đơn vị kiếp lớn, và
    số 14 là số kiếp thường.
  - `Hārito` (1.2) giữ nguyên là tên núi vì đó là cách đọc theo Pāli của chính khoá.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của chính tầng Việt qua `_hvi.save_vi`: đủ 36/36 khoá, cân ngoặc kép trên cả bài, đúng số dấu lược theo Pāli, NFC, không trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung bình số học thô của đúng 10 tiêu chí, tính bằng script.
