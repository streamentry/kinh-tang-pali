notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoa Pali dai nhat trong lat la 37 ky tu (thag2.46:2.4), duoi
  nguong 40 cua `kiem()`, nen `can` RONG va khong co assert nao tu chay. Toi tu quet 13/13 khoa cua tung
  bai: du het, dung segment ID, dung thu tu khoa, khong rong, NFC, dau luoc bang Pali (0 = 0 o 13 khoa
  the, 2 = 2 o khoa ket `:.5`), nhay kep can tren toan bai, khong con `(...)`, khong Pali lot (ten
  rieng duoc chua qua `pa_rieng`). Chay `save_vi` hai lan, idempotent.

  TAU THAM KHAO. Anh Sujato co 12/13 khoa; khoa trong dung la `:.5` (dong ket luoc) — dac thu cua ban
  chup, khong phai thieu sot. Canh bao o bai nay rat sat: ca 14 bai deu co `substantiveSegments = 0`
  (khoa dai nhat 37 ky tu < 40), nen MAU SO COVERAGE = 0, ti so rong, khong roi nguong 80%, va KHONG
  can entry nao trong `content/meta/reference-gaps.yaml`. Khong co tang Viet hien hanh (bilara chi co
  Phap Cu) — dac thu cua snapshot upstream.

  DUONG DAN PHAI LUC — DA DO, CHUA CHUAN HOA. `Dukanipata` xuat hien o ca 14 khoa `0.2` cua lat nay
  va la MOT trong bon xung dot dang treo trong tang. Toi di theo DA SO: 31/76 *Tau Ke Dau Dơn*;
  23 *Pham Hai Phap*; 19 *Boi Hai Bai Kinh*; 3 *Tau Hai*. Ly do chon da so: `duka` o day la so HAI
  trong day `ekak/duk/tik/catuk/panc/cha/sat/ath/das`, va tang da dich `Ekakanipata` thanh *Boi Mot Bai
  Kinh*, nen mot hinh mau trong chung pham la mot so chu khong phai tu khoang. Toi KHONG sua bai ngoai
  lat. CANH BAO: chính hai bai cua lat — thag2.1 va thag2.2 — dang dung *Boi Hai Bai Kinh*, va
  thag2.35 dung *Tau Hai*; lat nay the da so nen khoa 0.2 cua thag2.3 va thag2.4 se khac hai don
  chua giai quyet. Toi chi ghi ra day de nguoi dieu phoi gop.

  Pali trung nguyen van — DA DUNG LAI, khong dich lai. Toi cham 182 khoa cua lat voi 71.562 muc
  Pali-Viet cua ca tang (3.801 tep) va tim 36 muc Pali trung nguyen van. Cac doan dung lai nguyen van:

  - 4/13 khoa dung LAI NGUYEN VAN thag1.71:1.1–1.4 (Pali trung y het, cung 4 khoa): *Với người thấy
    ý nghĩa cực kỳ tinh tế, khó thấu hiểu,* / *với người đã lấy giới hạnh làm nền tảng nương tựa;*
    / *với người đã tu luyện giới hạnh trưởng thành,* / *Niết-bàn đối với người ấy đâu có khó
    đạt*”ti.
  - SAI PHAI DA TU BAT o 1.1–1.2. Pali 1.1 co HAI phu dinh — `Na ukkhipe` va `no ca parikkhipe pare`
    (cau 1 chi khai ba *don phu dinh mau thuận* vao 1.1, roi 2.2 *không nên gây khó dễ …* lai nham
    `parikkhipe` chung voi `okkhipe`+`eraye` cua 1.2), nen mat mot vong phu dinh. Da sua: 1.1 *“Không
    nên trục xuất người khỏi Tăng, cũng đừng làm chậm trễ họ,* / 1.2 *đừng chỉ trích người đã vượt
    bờ, đừng lập sự với họ;* — bay phu dinh dung theo Pali.
  - `ukkhipe` → *trục xuất* (hanh động `ukkhipati` = khai trừ khoi Tăng), `parikkhipe` → *làm chậm trễ*,
    `okkhipe` → *chỉ trích*, `eraye` → *lập sự*, `pāragataṁ` → *đã vượt bờ*.
  - BAT DINH — `cattavaṇṇaṁ parisāsu byāhare` (0 lan trong tang). Toi dich *đừng phô trương trong các
    đại hội*. Sujato dich *One should not praise oneself among the assemblies* — doc kieu khac;
    Pali thi `byāhare` = *theo xác, khoe ra*, `catta-vaṇṇa` = *bo mau sac* o trong cua don so.
    `sammitabhāṇi` → *nói năng có chừng mực*; `anuddhato` → *không bồn chồn* (an10.51:3.6 khop
    `anuddhato` voi *khong hung han*); `subbato` → *giữ trọn giới hạnh* (an3.57:9.2).
  - Cau 1.1–1.3 la DANH SACH CAM HO (ba phu dinh), 1.4 chuyen sang BA DANH TINH cua nguoi ly tu.
    Do la chuyen biet cua Pali; toi khong them chu *Người* de lam chu nhan.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `thag2.45:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.
