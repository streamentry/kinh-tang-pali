notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho bộ phần này.
  Đợt 16, lát f207 (agent nền thuộc upstream 'Endpoint is unavailable', phiên sập sau khi ghi đủ 57/57 khoá ở 3/4 bài) — coordinator rà lại: key-set khớp 57/57, `lược(vi)==lược(pāli)` 0 lệch theo quy ước `…pe…`=1, cân nháy kép toàn bài sau hai sửa: `vv15:12.4` bỏ `”` thừa, `vv16` thêm 4 dấu `“` mở (vị trí khớp Pāli), `pv51:4.4` gỡ `”ti.` thừa.
  Cổng kỹ thuật CHƯA chạy — coordinator cần chạy đủ bốn lệnh trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
  Lượt cải thiện 2026-10-11 (đọc đối kháng từng khoá, họ Petavatthu; thay thế nhận định "đã rà đủ" ở mục trên): đọc lại cặp Pāli↔Việt phát hiện lỗi nghĩa thật ở 39/57 khoá, chia loại — (a) đọc sai cú pháp: `pv51:1.3–1.4` (`Nissaṁsayaṁ pāpakammanto … saddāyase tuvaṁ`) cũ thành "người từng làm điều ác không hề do dự, giờ còn than thở với ai nữa ấy" → "Chắc chắn ngươi là kẻ làm ác, vì sao ngươi lại kêu la?" (theo `pv43`, cùng Pāli); `pv51:7.1–7.2` "nhát dao bằng đá mài … ta toan đập vỡ" → "cú ném đá … con đã làm vỡ sọ vị ấy" (`sālittakappahārena`, `bhindissaṁ` là việc đã xảy ra, vì quả `nigacchisaṁ` đã chín; "dao đá mài" và "toan" không có trong Pāli); (b) thêm hoặc sai nghĩa từ: `pv51:2.2` "sinh về cõi khổ xa xôi" → "kẻ khốn khổ, thuộc cõi của Yama" (`duggato yamalokiko`); `pv51:2.1` "ma" → "ngạ quỷ" (`peta`); `pv51:1.2` "con thú lồng" → "con nai hoảng loạn" (`migo bhanto`); `pv51:6.2` "mắt nhìn hiền hòa" → "có đôi mắt đẹp" (`sunettaṁ`, theo `ja531:37.3`); `pv51:6.1` "bậc Chánh Giác" → "bậc Chánh Đẳng Giác" (`sambuddha`, theo `cnd22`, `snp5.19`, `vv50`); `pv51:9.1` "Đúng lẽ công bằng" → "Đúng theo lẽ phải" (`dhammena`, bỏ chữ "công bằng" không có trong Pāli); `kūṭa` "cục sắt" → "cái búa" (cùng gốc `ayokūṭa` đã dịch "búa sắt" ở `ja530:62.2`, `ja544:157.2`; chữ "sắt" không có trong Pāli); (c) người nói: ngạ quỷ nói với Tôn giả (`bhadante`) xưng "con" xuyên suốt `pv51:2–3, 6–8` (cũ lẫn "con/tôi/ta"); người hỏi gọi "ngươi" như `pv43`; (d) Pāli trùng nguyên văn trong bài (`3.1–3.2/5.1–5.2/8.1–8.2/9.2–9.3`, `3.4/5.4/8.4/9.5`, `3.3/8.3`, `5.3/9.4`: 4 nhóm + 2 cặp) nay có Việt giống nhau, bỏ đại từ sở hữu không có trong Pāli ("sọ tôi/sọ ngươi" → "sọ"); (e) phần tóm lược: `pv51:14.2` "con nhà thợ mộc" → "con trai trưởng giả" (`seṭṭhiputta`, theo `dhp155`, `dhp397`, `tha-ap392`); `13.2` "Ucchu" → "Mía"; `13.3` "kẻ ăn dơ" → "kẻ ăn phân" (`gūtha`), "hai đứa con trai" → "hai cậu bé"; `13.4` "Gaṇapāṭali" tách thành "Nhóm, Pāṭali"; `16.1–16.4` viết lại cho đúng bốn phẩm (Uraga, Uparivagga, Cūḷa, Mahā) và bốn phần tụng đọc (`bhāṇavārato`). Điểm: semantic_fidelity 9.0→8.6, grammar_logic 9.1→9.0, terminology 9.0→8.8, vietnamese_clarity 9.1→9.0, ambiguity_integrity 9.1→8.6 (các điểm cũ bị chấm cao khi bản dịch còn nhiều lỗi nghĩa thật; điểm mới phản ánh bản đã sửa cộng bất định còn lại); các tiêu chí khác giữ nguyên; final_score 9.13→9.0. Bất định còn lại: (1) `sālittaka` ("cú ném đá") chưa phân xử được là ná/ném đá hay vật khác — chỉ có `ja107` (Sālittakajātaka) làm bối cảnh, không có bản Anh; (2) `sunettaṁ` đọc là tính từ "có đôi mắt đẹp" nhưng cũng có thể là tên riêng của vị Phật Độc Giác; không đủ căn cứ trong kho để chọn nên giữ nghĩa tính từ theo `ja531`; (3) `kūṭa` đọc là búa (không phải "đỉnh") theo ngữ cảnh đập vỡ sọ; (4) `Pāṭali` ở `13.4` là dạng rút gọn của tên chuyện `pv46` (Pāṭaliputta), giữ nguyên dạng trong Pāli. Cần lưu ý ngoài phạm vi bài này: tiêu đề `pv50` ("Con Nhà Thợ Mộc", Pāli `Seṭṭhiputta`) và `pv21:31` (cùng Pāli với `pv51:9.1`) mang lỗi tương tự.
