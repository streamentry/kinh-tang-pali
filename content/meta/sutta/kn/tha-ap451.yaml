notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `tha-ap`.
  Dùng lại nguyên văn 20/34 khoá có tiền lệ: tiêu đề `Bài Kệ Tuyên Ngợ …` (92×), `đây là quả báo của việc dâng lan can.` dùng cho cả bốn khoá 2.4/3.4/4.4/5.4, `“Đến Đức Thế Tôn Padumuttara,`, `Vào một trăm ngàn đại kiếp trước,` (5×), cụm kệ 6–8 như tha-ap384.
  Bốn khoá `vedikāya idaṁ phalaṁ.` trùng nguyên văn trong chính bài nên dùng CHUNG một cách dịch, không lặp lối diễn đạt khác nhau cho cùng một câu.
  Review đối kháng đã sửa một lỗi: `Sakaṁ cittaṁ pasādayiṁ.` ban đầu dịch bằng ngôi thứ nhất (`con`), nhưng `sakaṁ` là sở hữu của ngôi thứ ba và chủ thể của khổ 1 là Đức Thế Tôn Padumuttara, nên đã sửa thành `Ngài đã làm cho tâm mình trở nên tịnh tín.`; 1.2 cũng thêm `Ngài` cho nhất quán.
  Bất định còn lại: `Bodhiyā pādaputtame` (1.2) và khổ 2.1–2.3 (`Atoḷārāni bhaṇḍāni, katāni akatāni ca; Antalikkhā pavassanti`) không có tiền lệ; dịch theo nghĩa chữ nghĩa, giữ chủ thể ẩn (không thêm ai làm gì) để không bịa nội dung. `pavassanti` dịch `rơi từ trên xuống` — vật rơi không nêu rõ trong Pāli khoá này.
  `…pe…` giữ một dấu lược; `Bốn vô ngại giải,` và bản đóng nháy dùng lại nguyên văn.
  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|check`; coordinator cần chạy đủ bốn lệnh sau trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, và `npm run build`.
