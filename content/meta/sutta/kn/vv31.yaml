  MỆNH ĐỀ ĐO LẠI TRONG `vv` (44 tệp đã có, đếm bằng `grep` trên tầng Việt dự án) — lát
  này chọn theo đa số, và ghi lại CẢ HAI HƯỚNG kèm số như sau.
  · `Vimānavatthu` (0.1): giữ nguyên Pāli **43 tệp** ⟵ *Chuyện về cảnh giới thần* 1 tệp.
  · `Itthivimāna` (0.2): *Chuyện Cung Điện Nữ Hư Không* **20 tệp** ⟵ *Chuyện Cung Điện
    Nam Hư Không* 14 (14 tệp ấy thuộc `Purisavimāna`, không phải bài này) ⟵ *Thiên Cung Của
    Nữ Giới* 1 ⟵ giữ Pāli `Purisavimāna` 3.
  · `Pāricchattakavagga` (0.3, chỉ ở vv31): *Phẩm Cây San Hô* **1 tệp** (`vv36:0.3`), không
    có cách thứ hai. Củng cố bằng tầng tên đã ghim `vv-name:32.vv-paricchattakavagga`
    = The Chapter With the Coral Tree.
  · `Pīṭhavagga` (0.3, vv6/vv7/vv9): *Phẩm Pīṭha* **9 tệp** ⟵ giữ Pāli 2
    (`Mahārathavagga`, `Sunikkhittavagga`).
  · NGÔI KỂ xưng tự: *vậy tôi* **30 dòng / 22 tệp** ⟵ *vậy ta* 4 dòng / 4 tệp ⇒ chọn
    **vậy tôi**.
  · `mahānubhāva`: *đại oai lực* **18 dòng / 9 tệp** ⟵ *uy thế lớn lao* 12 dòng / 9 tệp ⇒
    chọn **đại oai lực**.
  · `sabbadisā disā` toàn cục: *khắp mọi phương* **45 dòng / 27 tệp** ⟵ *khắp muôn phương*
    31 dòng / 23 tệp ⟵ *khắp bốn phương* 7 dòng / 6 tệp.
    ⚠ Nhưng đo theo CHÍNH CÁI PĀLI thì đảo ngược, và đây là mấu chốt của lát này:
    `…te sabbadisā pabhāsatī”ti.` (Tôn giả hỏi, ngôi 2) → *muôn phương* **19 tệp** ⟵
    *mọi phương* 8 ⟵ *bốn phương* 5; còn `…me sabbadisā pabhāsatī”ti.` (nữ thiên đáp,
    ngôi 1) → *mọi phương* **19 tệp** ⟵ *muôn phương* 10 ⟵ *bốn phương* 2; và
    `Obhāsentī disā sabbā,` → *mọi phương* **8/8 tệp**.
    ⇒ Lát này theo **đa số theo từng PĀLI** (luật PĀLI trùng nguyên văn thì dùng lại nguyên
    văn thắng số đếm toàn cục): câu hỏi → *muôn phương*, câu đáp → *mọi phương*.
    Hệ quả trung thực: trong `vv6`/`vv7`/`vv9` cùng một ý `sabbadisā` mà hai bản dịch khác
    nhau. Cụm `vv1`+`vv3`+`vv4`+`vv10`+`vv13`+`vv14` của kho cũng y hệt (hỏi *muôn phương*,
    đáp *mọi phương*), tức đây là quy ước của cụm đông nhất chứ không phải lỗi đơn lẻ — nhưng
    người biên tập có thể muốn thống nhất lại; nếu vậy thì phải sửa **cả hai vế ở cả 44 tệp**,
    việc đó không thuộc lát này và tôi không tự ý sửa bài đã có.

  Nguồn tên kinh: đọc tầng `name/` đã ghim cùng commit để phân giải ba chữ trong tên bài —
  `vv-name:35.vv31` = Couch Mansion ⇒ `Pallaṅka` là kiều/ngai; `vv-name:8.vv6` và
  `vv-name:9.vv7` = Ship Mansion / Second Ship Mansion ⇒ `Nāvā` là **thuyền** (đúng như
  `pv28:5.2` `Nāvāya ca tvaṁ avalamba tiṭṭhasi;` đã dịch *còn ngươi thì dựa vào thuyền mà
  đứng vững*); `vv-name:11.vv9` = Lamp Mansion ⇒ `Dīpa` là **đèn**. Ba tên đó được giữ
  nguyên Pāli trong tiêu đề (`Phẩm Pīṭha`, `Cung Điện Pallaṅka`, `Cung Điện Nāvā`) theo đúng
  cách 43/44 tệp `vv` đang làm với `Vimānavatthu`; riêng `Dīpavimānavatthu` dịch là *Đèn*
  vì *đèn* là từ Việt phổ thông đúng nghĩa, còn `Pallaṅka`/`Nāvā`/`Pīṭha` thì không.
  Tầng `name/` của `sn` không có tên từng bài (2119 mục nhưng `sn14.18`/`sn12.43`/`sn12.44`
  đều để trống), nên ba bài `sn` của lát dùng tiêu đề dịch nghĩa.

  Nháy kép: đặt đúng vị trí Pāli đặt, và cân trên cả bài (đã kiểm từng khoá đã dịch). `vv1:4.4` có lỗi tiền lệ — dư một dấu `”` thành
  `…muôn phương?”.”` — tôi KHÔNG sao chép lỗi ấy; bản đa số (5 tệp) là `…muôn phương?”`
  và đã dùng nguyên văn bản ấy.

  Dấu lược: không khoá nào của `vv31`/`vv6`/`vv7`/`vv9` có `…pe…` ở Pāli, và bản Việt cũng
  không có một dấu lược nào — mỗi khoá khớp 0 = 0.

  Bất định riêng của `vv31` (các vế kệ ngắn này không có tiền lệ nào trong 44 tệp `vv` đã có):
  · `3.2` `suṇisā` — 0 tiền lệ; `suṇi` là *hiền lành, ngoan*, nhưng ba câu sau nói về thái
    độ của bà với chồng, nên tôi dịch *hiền lành* thay vì *ngoan*; hai cách đều defend được,
    không thay đổi ý.
  · `7.5` `Patimhi kalyāṇī vasānuvattinī` — 0 tiền lệ. `kalyāṇī` có thể là đối với chồng thì
    tôi đẹp đẽ, hoặc là tôi thuận tốt với chồng; tôi dịch theo cách thứ nhất rồi thêm
    `vasānuvattinī` = *tận lòng thuận theo*, nên cả hai vế đều còn mặt. `sugata` → *Thiện
    Thế* theo `iti84`/`iti107`.
  · `8.4` `Deviddhipattā … āgatā` — Pāli đổi sang sở thứ 3 giữa lúc nữ thiên đang xưng *tôi*;
    bản Việt giữ chủ ngữ *tôi* của câu trước (8.3) và để vế 8.4 không chủ thể, vì tiếng Việt
    không có dạng chuyển ngôi đó mà vẫn giữ đủ nghĩa.
  · `5.3` `Amajjapā no ca musā abhāṇiṁ` — tiền lệ **1 tệp** (`vv12:5.1`) dịch *Ta chưa từng
    hành xử thô kệ, chưa từng nói lời không thật*, nhưng `amajjapā` là *không uống chất say*
    chứ không phải *thô kệ*; `vv61` dịch đúng là *không uống chất say*. Tôi theo nghĩa đúng
    và dùng *tôi* (tiền lệ ấy dùng *Ta* vì cả bài `vv12` xưng *ta/ngươi*). Đây là điểm **cố ý
    lệch tiền lệ 1-tệp**, ghi lại để người biên tập cân.
  · `6.3` `Pāṭihāriyapakkhañca` — tiền lệ chia làm hai phe: *Cùng kỳ phép nhiệm màu*
    (2 tệp, 4 lần) và *và cả tuần lễ thần biến* (2 tệp, 2 lần; thêm 2 biến thể 1 lần).
    Chọn *Cùng kỳ phép nhiệm màu* vì `pāṭihārikapakkha` là kỳ tròn thần thông, và đó cũng là
    biến thể nhiều lần nhất.
  · `6.2` `yā ca pakkhassa aṭṭhamī` — dùng nguyên văn *Và ngày thứ tám nửa tháng;*
    (`an3.37:5.2`); riêng `vv25:6.2` dùng *và ngày mồng tám của nửa tháng* — cùng nghĩa.
  · `1.1` `Pallaṅkaseṭṭhe` — dùng cụm *trên tòa tuyệt hay* của `pv28:2.3`; `1.4`
    `Uccāvacā iddhi vikubbamānā` dùng nguyên văn `vv12:1.4` (*thi triển thần thông biến
    hóa tùy ý*); `2.2` dùng nguyên văn `vv11:2.4` (*đang múa, đang hát, đang vui chơi*)
    vì `vv11` là bài có **cùng khung** (2.1 của nó trùng nguyên văn `vv31:2.1`), còn `vv67:2.5`
    dùng cụm khác.

  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|
  check`. phép kiểm lưu bài đã pass cho cả 45/45 khoá của bài này (đủ khoá, không thừa,
  NFC, không trùng nguyên văn PĀLI, PĀLI không lọt vào bản Việt, số dấu lược khớp từng
  khoá, ngoặc kép cân trên cả bài), và lượt quét lại không lỗi nào ngoài `:0.1` — vốn
  là khối tiêu đề ngắn (< 40 ký tự) mà phép kiểm cố ý không đo, và giữ nguyên PĀLI là
  **tiền lệ 43/44** trong `vv`. Người biên tập cần chạy đủ `npm run validate`, `npm test`,
  `npm run check`, `npm run build` trước khi coi `technical_integrity: 9.6` là đạt.

  Kiểm toán độc lập 2026-10-11: đọc đối kháng lại từng khoá Pāli↔Việt của lượt 2026-10-04.
  Điểm cũ (final 9.19) quá cao: 34/45 khoá được sửa, trong đó 16 khoá sai nghĩa thật
  (phần còn lại là xưng hô, dấu câu, từ thêm vào, khoá tiêu đề). Các mục "bất định" và
  "tiền lệ" phía trên của lượt cũ có chỗ KHÔNG đúng và được thay bằng mục này:
  · `1.1` `maṇisoṇṇacitte` — cũ *tâm ý vừa hợp*: đọc `citta` thành "tâm", bỏ mất ngọc ma-ni
    và vàng. Nay *điểm tô bằng ngọc ma-ni và vàng* (cùng cách `vv36:7.1` dịch `maṇisoṇṇacittitaṁ`).
    `Pallaṅka` dịch *ghế dài*; tiêu đề vẫn giữ Pāli như các tệp `vv` khác.
  · `1.4` `Uccāvacā iddhi vikubbamānā` — cũ chép *tùy ý* và nói "nguyên văn `vv12:1.4`", nhưng
    `vv12:1.4` thật ra là *đủ loại thần thông*; `uccāvaca` = đủ loại, không có "tùy ý". Nay *đủ loại*.
  · `3.2` `suṇisā` — cũ *hiền lành* kèm lập luận "suṇi là hiền lành": lập luận ấy sai, `suṇisā`
    là **con dâu** (cùng chữ trong `vv13:5.2`, `vv14:5.2`, `vv29:4.3` và tên bài `vv13`/`vv14`).
    Nay *con dâu*. Lỗi cùng dạng còn ở `vv32:5.2` (ngoài phạm vi lượt này).
  · `3.3`, `7.5` `vasānuvattinī` — cũ *tận lòng* (không có trong Pāli); `akkodhanā` cũ *hờn dỗi*
    (sai sắc nghĩa, `akkodhanā` = không nóng giận). Nay *không nóng giận, thuận theo ý chồng*,
    khớp `vv15:5.3`. `kalyāṇī` ở 7.5 cũ *đẹp đẽ* (tự khen nhan sắc) — ở vị trí này là phẩm hạnh
    đối với chồng nên đổi *tốt lành*.
  · `3.4` — cũ *không hơi đà một chút nào*: cụm vô nghĩa, bắt nguồn từ `vv32:5.4` (cùng lỗi, ngoài
    phạm vi). `appamattā` nay *không phóng dật*.
  · `4.1` `daharā` — cũ *nhỏ bé* (đọc như trẻ con); nay *còn trẻ*. `4.2` `patimābhirādhayiṁ` —
    cũ *tôn kính chồng*; `abhirādheti` là làm vừa lòng, nay *làm vừa lòng chồng*.
  · `5.1` `Pāṇātipātā` — cũ *sát người*; `pāṇa` là sinh vật, nay *sát sinh* (như `vv15:8.1`,
    `vv37:9.1`). `5.2` cũ *thân ta* (sai ngôi, nữ thiên xưng *tôi*) và *chói lòa* (không có trong
    Pāli); nay *thân hoàn toàn thanh tịnh, sống phạm hạnh trong sạch*.
  · `5.4` `Sikkhāpadesu paripūrakārinī` — cũ *viên mãn trong các môn học*; `sikkhāpada` là học
    giới (đối chiếu `vv17:6.3`). Nay *thực hành trọn vẹn các học giới*.
  · `6.3` — cũ *Cùng kỳ phép nhiệm màu*; nay *cùng cả kỳ nửa tháng thần biến* (`pakkha` = nửa
    tháng, khớp `vv15:6.3`, `vv23:7.3`; *tuần lễ* ở `vv19`/`vv22`/`vv25`/`vv37`/`vv52` là sai
    vì `pakkha` không phải một tuần). `6.4`/`7.1`/`7.2` — câu Pāli đi liền từ `6.1` đến `7.2`
    (*… với tâm tịnh tín, sống thuận theo pháp, ngày trai giới đủ tám chi phần, tôi đã giữ với
    tâm hoan hỷ*); cũ làm `6.4` thành câu rời *tôi có tâm thành kính* và gắn *đủ tám chi phần*
    vào chủ ngữ thay vì ngày trai giới. `aṭṭhaṅgupetaṁ` là định ngữ của `uposathaṁ`.
  · `7.3`/`7.4` — cũ *phẩm cao quý … nương theo điều lành*: `phẩm` không có trong Pāli,
    `samādiyitvā` là thọ trì chứ không phải nương theo, `sukhudrayaṁ` là quả an lạc. Nay sửa theo đó.
  · `8.1`–`8.4` — cũ thêm *Nhiều* (số nhiều không có), `nên sinh ra có phẩm hạng hơn hẳn`
    (thêm nhân quả), và `abhisamparāyaṁ` (đời sau) bị đọc thành *ra đi khỏi đời này*. Nay *ở
    đời sau*; `visesabhāginī` = được phần thù thắng.
  · `9.3`, `9.4` — cũ *ngắm nhìn tôi* (`ramenti` = làm vui thích) và *rồi đã vào cung điện thần,
    ở rất lâu*: `dīghāyukiṁ` là định ngữ của `maṁ` (tôi, người trường thọ), không phải "ở lâu".
    `9.1` `manorame` cũ *dễ chịu hết sức*; nay *làm đẹp lòng* (như `vv84:19.2`).
  · Xưng hô người hỏi: `1.3`/`2.1` cũ *ngài*, các khoá còn lại *nàng*; thống nhất *nàng*
    (như `vv10`–`vv14`). Khoá `2.3` hô cách `mahānubhāve` nay *hỡi bậc có đại oai lực* (như `vv41:3.1`).
  · `0.4` bỏ *Thứ Ba* (không có trong Pāli, `3.` đã chỉ thứ tự) và đổi `translationTitle` cho khớp.
  Còn bất định / không đổi: `0.2` `Itthivimāna` vẫn *Nữ Hư Không* theo cả bộ — Pāli không có `ākāsa`
  nên đây là lỗi tiêu đề phẩm lan khoảng 51 tệp, cần sửa đồng loạt chứ không riêng bài này;
  `6.3` `pāṭihāriyapakkha` chưa xác định chính xác kỳ nào, giữ cách dịch sát chữ; `2.2` `pamodayanti`
  (dạng sai khiến, *làm cho hoan hỷ*) vẫn giữ *vui chơi* theo `vv11:2.4`. Tầng tham khảo tiếng
  Anh vẫn vắng (`triangulation` 7.5, blocker giữ nguyên). Bản sửa chưa có người thẩm định thứ hai.
  Cổng kỹ thuật vẫn CHƯA chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
