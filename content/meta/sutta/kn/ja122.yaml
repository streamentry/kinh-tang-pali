notes: |-
  Đã đọc hết Pāli qua v4/p4.txt. Tại commit đã ghim không có tệp Anh Sujato cho bài này (0/9 khoá) và tầng Việt hiện hành chỉ có Pháp Cú nên không có bản Hòa thượng Thích Minh Châu để đối chiếu — bản dịch đứng hoàn toàn trên Pāli root. Mọi segment Pāli đều dưới 40 ký tự nên không có segment nội dung theo ngưỡng coverage.
  Tiền lệ (đếm trong tầng Việt dự án): khung tiêu đề như ja1; bāla → kẻ ngu (253); yasa → danh vọng (25); hiṁsā → hại theo hại mình hại người đã ổn định; colophon Kinh ... thứ hai không phẩy.
  0 tiền lệ, đặt mới, ghi lý do: Dummedha → Kẻ Ngu Si (ghép kẻ ngu 253 và ngu si 31, đúng cấu tạo du + medha là trí xấu); anatthaṁ carati attano → tự làm hại chính mình (anattha là điều bất lợi cho mình); hiṁsāya paṭipajjatī → đi theo đường gây hại (paṭipajjati là bước vào, thực hành theo; không thêm con đường vì Pāli không có từ đường).
  Triangulation 7.5 vì chỉ có Pāli root, không có bản Anh hay bản Việt nào để đối chiếu.

  Quyết định hội đồng biên tập 2026-10-16: C1 — :0.4, :2.1, translationTitle (cùng tên Pāli cùng tên Việt); C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
