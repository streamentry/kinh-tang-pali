    + `1.2` `sammasi`: dịch "nhọc nhằn" (sammati, mệt nhọc) giữa `ghammani` (cái nóng, `mn40:13.2` "nắng nóng"); không tra được tiền lệ cho dạng này.
    + `3.2` `amalamajjhime`: "giữa dòng nước trong" (amala + majjhima); cách đọc khác "giữa vùng nước không vẩn".
    + `5.2` `byantībhūto dukhakkhamo`: dịch "đã chấm dứt, chịu nổi khổ nhọc" (byantībhūta "đã chấm dứt", khama "chịu đựng"); đối tượng của "chấm dứt" (cơn đói khát? lo âu?) không được nêu trong câu, và `dukhakkhamo` có thể là dạng hiếm khác (ví dụ "khổ diệt").
    + `6.1`–`6.6` (chuỗi `taṁ` / `ambaṁ` / `maraṇaṁ`): tôi đọc `ambaṁ` làm chủ ngữ ("xoài ấy sẽ làm tôi héo mòn rồi đem cái chết đến cho tôi"), hợp với lời nữ thần ở `17.4` ("lại mong cầu cái chết"); cách đọc khác là cái chết mang vị ấy đến nơi/cây có quả xoài ấy. Nghĩa `udadhismā mahaṇṇave` ("từ đại dương, nơi biển cả mênh mông") là cách đọc sát chữ; không rõ trái xoài trôi từ biển hay từ bờ sông.
    + `7.2` `upavasāmahaṁ`: dịch "nhịn ăn" (upavasati, giữ ngày chay, `mn83:3.3`), hợp với `5.3` (không còn thích vị gì khác) và `17.4`; cách đọc khác là "tôi trú ở đây".
    + `7.4` `puthulomāyutā puthu`: "rộng lớn, đầy loài cá vảy to" (puthuloma, āyutā "đầy"); không tra được cách đọc khác.
    + `8.2` `apalāyini`: "hỡi người không trốn chạy"; có thể chỉ là lời gọi "chớ lẩn tránh" (xin hãy ở lại và đáp).
    + `9.1` `ruppapaṭṭapalimaṭṭhīva`: "tấm bạc được chà sáng"; `girisānujā` "sinh trên sườn núi" (hổ cái); không tra được tiền lệ.
    + `11.3` `bhusālayāvutthā`: tôi đọc là `bhusālaya` + `āvutthā` ("cư ngụ nơi chốn ở rộng lớn"); nghĩa của `bhusa` ("rộng lớn" hay "dữ dội") chưa phân xử được.
    + `13.1`, `13.3` `vanatodā`, `nāgavittodā`: giữ nguyên Pāli làm tên các dòng nước, vì chưa tra được nghĩa; `13.2` `nīlavārivahindharā` dịch "mang theo nước xanh thẫm" (`dhara` "mang").
    + `14.1` `Tā ambajambulabujā…`: chủ ngữ giống cái `tā` đi với danh sách giống đực; tôi đọc là "những cây ấy" (cây xoài, jambu, mít, nīpa, thốt nốt, udumbara) đem trái đến; cách đọc khác là các dòng nước đem trái.
    + `15.4` `vasānugaṁ`: "đi theo quyền của nó" (vasa + anuga).
    + `17.3` `āceyyamāno`: "đang chất chứa" (ācināti, tích tụ); không có tân ngữ trong câu; tôi không điền (có thể là ác nghiệp, như `19.3` `na cīyatī … pāpaṁ`).
    + `18.1` `Tassa`: "về điều ấy"; cũng có thể là "về người ấy" (cùng bài, `19.3`–`19.4` dùng `tassa` cho "người ấy" và "người kia"); `18.6` `paṭṭhabhūtā`: "đã thành chỗ nương tựa" (có thể từ `patiṭṭhā` "chỗ nương"); chưa tra được dạng này.
    + `19.4` `vadhāya tassa`: "giết hại người kia"; không xác định được `tassa` là người bị giết hay chính người nói.
    + `20.2`–`20.3` `evaṁ lokyā viditā sati` và `anariyaparisambhāse`: "thế gian biết nàng là bậc hiền thiện như vậy" và "trong lời lẽ chẳng cao quý"; cách đọc `sati` (hiền thiện, giống cái) và `parisambhāsa` (lời lẽ) là cách đọc của tôi.
    + `22.4` `pakuṭṭhāyi`: "chê trách" (dạng chưa tra được; nghĩa suy từ ngữ cảnh `21.3` `asiloko`).
    + `23.1` `avisayhasāhi`: dịch như lời gọi "hỡi bậc chịu nổi điều khó chịu nổi" (avisayha + sāhin); không loại trừ đây là tên riêng.
    + `26.1`–`26.6`: tôi đọc `Taṁ … pabodhare` là "đánh thức ngài" (`taṁ` = ngài, như `25.1`), với các chủ thể ở dạng cách công cụ/chủ cách nối nhau; `vakkaṅgehi` "những con mình cong" (chưa phân xử được là ong hay loài chim khác); `diviyā` gắn với "công" (cũng có thể đứng riêng là "loài chim cõi trời"); `kolaṭṭhimadhusāḷikā` đọc là "chim kolaṭṭhi và sáo mật" (kolaṭṭhi chưa tra được).
    + `27.2` `palālakhalasannibhā`: "tựa bãi đập rơm" (palāla "rơm", khala "bãi đập"); hình ảnh so sánh chưa rõ; `27.4` `pakkatālavilambino`: "những cây thốt nốt rủ quả chín".
    + `28.x`–`30.x`: người hỏi ở `28.1`–`30.4` và vị được hỏi chưa xác định được từ Pāli của bài; tôi giữ cách xưng "ngài"/"tôi" trung tính.
    + `30.4`, `32.4` `piṭṭhimaṁsāni` "thịt lưng": nghĩa đen là "thịt ở lưng", đồng thời là tên của kẻ nói xấu sau lưng (`32.1` `piṭṭhimaṁsiko`); câu Việt chỉ giữ được liên hệ qua chữ "lưng". Chữ "mình" thêm vào ở `32.4` theo `attano` trong chính khoá, không thêm vào `30.4`.
    + `31.1` `ajjhenāni`: "việc học tụng" (ajjhena, `mn107:2.4` "học thuộc"); `paṭiggayha` "nhận lấy".
  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 141/141, cùng thứ tự.
    2. Nháy đơn `‘’` và kép `“”` khớp Pāli từng khoá: 0/141 khoá lệch (Pāli không có nháy đơn; nháy kép: 7 mở + 7 đóng, mở ở `1.1`, `2.1`, `11.1`, `19.1`, `23.1`, `28.1`, `31.1`; đóng ở `1.4`, `10.6`, `18.6`, `22.4`, `27.4`, `30.4`, `32.4`).
    3. Pāli trùng nguyên văn trong chính bài: 0 cặp (phép chạy rỗng).
    4. Dấu lược: Pāli 0/141 khoá có `…` hay `(…)`; Việt 0/141.
    5. Số Pāli: xem trên (16.000; 30; 1).
    NFC đạt, không khoá rỗng, không khoảng trắng thừa. Pāli còn trong bản Việt chỉ là tên và danh xưng không có tiền lệ Việt: `Jātaka`, `Kosikī`, và các tên cây, chim, dòng nước nêu ở Chỗ bất định (`jambu`, `nīpa`, `udumbara`, `kosamba`, `saḷala`, `kolaṭṭhi`, `vanatoda`, `nāgavittoda`).
