  - Phân loại & tiêu đề:
    + `0.1` "Jātaka"; `0.2` "Bộ Ba Mươi Bài Kinh" và `0.3` "Phẩm Mong Muốn Gì" dùng lại nguyên văn từ ja512 (cùng bộ, cùng phẩm); `0.4` "1. Kinh Mong Muốn Gì" (kiṁ + chanda = "muốn gì", theo tên Sujato "What Is Your Desire?" và theo tên phẩm đã chọn ở ja512); số 1 khớp `33.1` "thứ nhất".
    + `33.1` "Kinh Mong Muốn Gì, thứ nhất." theo dạng có dấu phẩy của ja512:32.1 ("Kinh Cái Bình, thứ hai."). Đo trên tầng: Pāli dạng `…jātakaṁ <số thứ tự>.` có 275 khoá Việt dạng ", thứ …" và 232 khoá dạng không dấu phẩy (với ja ≥ 440: 39 so với 30).
  - Lời nói và nháy kép:
    Pāli có bảy đoạn lời nói, mở/đóng đúng từng khoá theo Pāli: `1.1`–`1.4`, `2.1`–`10.6`, `11.1`–`18.6`, `19.1`–`22.4`, `23.1`–`27.4`, `28.1`–`30.4`, `31.1`–`32.4` (đóng bằng ”ti). Tầng Pāli không ghi tên người nói; tôi phân vai từ giống ngữ pháp và xưng hô trong kệ: `1.x` người hỏi vị ở bờ sông (nữ, theo `8.3` kalyāṇi và `11.3` sāhaṁ); `2.x`–`10.x` vị ở bờ sông, xưng "tôi", gọi người kia "nàng" (`kalyāṇi`, `sumajjhime`, `cārupubbaṅgi`); `11.x`–`18.x` nữ thần sông, gọi vị kia "ngài" (`brāhmaṇa`, `medhāvi`, `janādhipa`, `rājisi`); `19.x`–`22.x` vị ở bờ sông; `23.x`–`27.x` nữ thần sông (gọi `arindama`); `28.x`–`30.x` người hỏi về nghiệp quá khứ của một vị mang trang sức nhưng ăn thịt lưng mình; `31.x`–`32.x` vị ấy trả lời. Ai là người hỏi ở `28.x`–`30.x` và ai là vị bị hỏi thì Pāli một mình không xác định được (xem Chỗ bất định).
  - Pāli trùng nguyên văn:
    Dò Pāli của 141 khoá với toàn bộ Pāli đã ghim của năm bộ (284.708 khoá, trong đó 204.856 khoá đã có bản Việt trên đĩa): 12 khoá của bài có Pāli trùng nguyên văn (sau khi bỏ nháy và dấu cuối câu) với khoá ở bài khác; 9 khoá trong đó trùng với khoá đã có bản Việt. Dùng lại nguyên văn (6/9): `0.1` (Jātaka), `0.2` (ja512:0.2, thag17.1:0.2), `0.3` (ja512:0.3), `18.4` (`snp2.7:2.2`, `pv18:14.2`: "tự chế, sống khổ hạnh"), `29.1` (`ja489:7.1`: "Mười sáu ngàn phụ nữ"), `29.4` (`ja501:23.2`: "đáng kinh ngạc, làm dựng tóc gáy", chỉ khác dấu cuối câu). Khác tiền lệ có chủ ý (3/9): `1.3` so với `sn7.13:2.3` ("Tôn giả cần gì, mong gì,"), bài kia là lời của chư thiên với một tỳ-kheo, ở đây là người hỏi một ẩn sĩ giữa nắng, và cả hai chỉ khớp một nửa dòng nên tôi dịch sát từng chữ `patthayāno` "mong cầu", `esaṁ` "tìm kiếm"; `29.2` so với `pv24:6.2` ("là những người hầu hạ nàng đây;") và `pv34:2.4`, chỉ khác ngôi người nghe (ở đây "ngài"); `32.3` so với `pv34:7.3` ("như ta nay đang ăn"), chỉ khác ngôi người nói ("tôi"). 3 khoá còn lại có trùng nhưng bản Việt của bài kia chưa có trên đĩa (`8.3`, `25.1`, `27.2`).
    Trong chính bài: 0 Pāli trùng nguyên văn (141 khoá, 141 dạng khác nhau); phép này chạy rỗng, không có cặp nào để so.
  - Số Pāli:
