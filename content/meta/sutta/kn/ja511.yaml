  - Tầng tham khảo:
    Upstream commit đã ghim không có bản dịch tiếng Anh của Bhikkhu Sujato cho thân bài ja511 (tệp `ja511_translation-en-sujato.json` vắng mặt; tầng `english-sujato` chỉ có 83 tệp `ja`, không có uid này), nên đây là `not-published-upstream`, không phải `not-synced`. Bản Việt hiện hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú. Lớp lấp `english-project` của dự án không có tệp cho bài này. Ba tầng tham khảo đều vắng nên bài mang trạng thái `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7.5 (≤ 8.0). Riêng tầng `name/` của Sujato có tiêu đề (không phải thân kinh): `ja-timsanipata` "The Book of the Thirties", `ja-kimchandavagga` "What Is Your Desire?", `ja511` "What Is Your Desire?"; tôi chỉ dùng chúng để chọn tên bộ, tên phẩm và tên bài. Bài vì thế được dịch bằng Pāli, tiền lệ Việt trong kho và bối cảnh trong chính bài; không có bản English độc lập nào đối chiếu lại các chỗ khó đọc ở mục Chỗ bất định.
