notes: |-
  Đủ 11/11 khoá trong all. Đã đọc HẾT Pāli lát qua v7/p1.txt trước khi viết.
    Khuôn bốn khối tiêu đề và câu chốt y hệt ne24 và ne27–ne34 đã có; tên nhóm phương thức đặt
    theo đúng khuôn bốn khuôn đã có trong tầng (Phân Biệt · Chuyển Đổi · Thanh Tẩy · Trợ Duyên),
    và đây là khuôn thứ năm: Dấu Hiệu (lakkhaṇa, 19 chỗ) và Định Danh (paññatti).
    TIỀN LỆ BẮT BUỘC: khoá 2.1 dùng nguyên văn đã có ở ne24:2.1 / ne27:2.1 / ne32:2.1.

    `paññatti` tôi dịch là định danh xuyên suốt, để tên nhóm ở 0.4 và 1.1 và 2.6 khớp với các
    câu trong thân. Trong tầng có hai cách: định danh (1 chỗ, np4.11) và cách gọi (nhiều chỗ, chủ
    yếu trong Tạng Bộ khi nói về tên gọi thay thế của một pháp). Tôi chọn định danh vì ở đây
    paññatti là thuật ngữ kỹ thuật của Netti, không phải tên gọi tu từ; nếu đổi sang cách gọi thì
    sẽ lệch với chính tiêu đề của nhóm.

    Bất định đã ghi nhận — đây là điểm yếu thật của bài này, nên tôi hạ cả điểm.
    `padaṭṭhānapaññatti satiyā`: `satīyā` là cách công của sati, tôi dịch là ứng với chánh niệm.
    Có hai cách đọc khác: sati là CHỦ THỂ đang định danh (chánh niệm nói câu ấy), hoặc là danh
    từ (sự định danh của chánh niệm về hành chân thứ). Chữ “ứng với” là chỗ nối diễn giải của
    tôi, tôi nói rõ vì không nên giấu. Khi có bản chú giải tiếng Việt hoặc song ngữ khác thì nên
    phân xử lại cụm này.
    `nikkhepa` tôi dịch là đặt xuống (11 chỗ trong tầng) trong câu đặt xuống ở nền tảng của sự thấy
    biết; nikkhepa trong Abhidhamma còn nghĩa là ấn định, tức phép đặt định nghĩa vào một danh từ.
    `Thinamiddhābhibhū bhikkhū` tôi dịch là tỳ-kheo có mặt ở cả sự nhợt nhạt và sự nửa chừng,
    giữ abhibhū. Theo ne33:2.10, thin là sự nhợt nhạt của tâm và middha là sự lủng lằng của thân;
    tôi dịch middhā là nửa chừng vì lấy nghĩa chữ nghĩa, dù nghĩa giải thích trong ne33 là lủng
    lằng. Hai nghĩa gần nhau, tôi ghi ra thay vì chọn im lặng.
    `savasesa` → hữu dư (8 chỗ), `anavasesa` → vô dư (11 chỗ, ngược chiều đúng như mil6.2.8 đã
    dùng); `samudaya` → nguyên nhân; `duggati` → kẻ xấu; `jahe` → bỏ (thag1.15:1.1 đã dùng).
    `udayabbaya` → cả khi sinh cả khi diệt, theo ghi chú của thag1.15 cho an4.12:7.4.
    `dassanabhūmi` → nền tảng của sự thấy biết (6 chỗ trong tầng). `samatha` → định tĩnh
    (nhiều chỗ); `bhāvanā` → sự tu tập (2124 chỗ với tu tập).
    Dấu lược: cả bài không có `…pe…` nên hai phía đều 0.
    Kiểm kỹ thuật: save_vi sạch, chạy hai lần idempotent (sha256 không đổi). Vì mọi khoá Pāli của Theragāḵā ngắn hơn 40 ký tự nên cần trong kiểm() rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá: đủ 11/11 khoá; đúng ID; thứ tự khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2 ở dòng kết); nháy kép cân trên cả bài; không còn `(…)`; không có ký tự ngoài Latin. Không chạy npm run validate|test|check|build (đợt này cấm) nên technical_integrity = 9.6, không phải 10.  Không đối chiếu được tầng Việt hiện hành: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Đây là giới hạn của bản chụp upstream, đã ghi ở content/meta/reference-gaps.yaml.
