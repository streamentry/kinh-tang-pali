notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này.
  Pāli trùng nguyên văn: 24 khoá, dù lại nguyên văn 15 khoá. `:0.1` `Therāpadāna` (278/287) · `:0.2` `Jagatidāyakavagga` → “Phẩm Cúng Dường Bệ Nền” (5 nơi: tha-ap454, 455, 456, 457, 461; tha-ap458 dùng “Phẩm Jagatidāyaka” nên tôi theo đa số 5:1) · `:1.1` dùng lại nguyên văn bản đã có của chính câu kệ · `:8.1` `Paṭisambhidā catasso,` → “Bốn vô ngại giải,” (292/292, chỉ 1 cách).
  Cụm 6.1–8.4 giống hệt `tha-ap483` nên tôi dùng CHUNG một cách dịch cho cả hai bài, đồng thời bám tiền lệ đa số đếm được: `Duggatiṁ nābhijānāmi` 83/271 → “Ta không biết mình rơi vào khổ đau,” (tầng có 12 cách, tôi theo cách nhiều nhất) · `Kilesā jhāpitā mayhaṁ` 52/86 → “Các phiền não của ta đã được thiêu rụi,” · `viharāmi anāsavo` 52/80 → “ta sống không còn lậu hoặc.” · `Svāgataṁ vata me āsi` 52/84 · `kataṁ buddhassa sāsanaṁ` 58/86 (không có dấu nháy) và 258/291 (có dấu nháy) · `vimokkhāpi ca aṭṭhime` 18/28 → “và tám giải thoát này;” · `Chaḷabhiññā sacchikatā` 20/30 → “Sáu thắng trí đã chứng đắc,”. Riêng `Nāgova bandhanaṁ chetvā` chỉ có 4 cách trong 5 nơi nên tôi theo cách dẫn đầu “như thớt voi bẻ gãy mọi trói buộc,”.
  Cố ý dịch khác tiền lệ ở 4 khoá: `jagatiyā idaṁ phalaṁ.` có 1 nơi dịch thành “đó là quả báo của việc **san phẳng mặt đất**”, lệch nghĩa (`jagatiṁ kārayiṁ` = làm cho thế gian được nuôi dưỡng), nên tôi dịch “đó là quả báo của việc nuôi dưỡng thế gian.” và dùng CHUNG cho `:2.4`, `:3.4`, `:4.4`.
  Khoá kết theo đúng hai khuôn của các bài anh em đã có (tha-ap449, 451, 454, 469): `:9.1` `Itthaṁ sudaṁ …` → “Tôi nghe như vầy: Tôn giả Trưởng lão … đã nói những bài kệ này.” và `:10.1` `Xtherassāpadānaṁ paṭhamaṁ.` → “Bài Kệ Tuyên Ngợ Về Trưởng Lão …, thứ nhất.” Tên `Jagatidāyaka` giữ nguyên Pāli theo khuôn của `tha-ap454` (`Morahatthiyo`) và `tha-ap455` (`Sīhāsanabījiya`).
  Bất định: `:2.1` `Darito` (bị nhấc lên / bị khai đá) không có tiền lệ trong tầng; đọa theo cặp đối xứng với `:2.2` `rukkhato patito` (bị đẩy rớt khỏi cây) nên dịch “Dù bị nhấc lên từ núi non,”. `:3.2` `khattiyā` dịch “người đế-chủ” theo an3.12:1.1 (trong ngữ cảnh trộm cướp nên không phải “vua”). `:5.1` `Aṭṭhārase` giữ cách đếm của khuôn “kiếp” như phần lớn tầng.
  Không khoá nào trong 8 bài này có `…pe…` ở Pāli (đã kiểm 296/296 khoá), nên không có dấu lược nào để giữ, và không có chỗ nào bịa dấu lược che chỗ thiếu.
  Đo lại trên đĩa, hai con số coordinator nêu ở mục (4) của prompt KHÔNG khớp: `bhante` trong tầng `mil` dùng **“thưa tôn giả” 149 lần / 71 tệp**, “bạch ngài” chỉ 37 lần / 23 tệp, “bạch thầy” = 0 (giữ nguyên phần đúng của bạn); `mahārāja` dùng **“này Đại vương” 395 lần / 101 tệp**, còn “tâu đại vương” chỉ 169 + “tâu Đại vương” 79 = 248 lần / 32 tệp. Cả 9 bài lân cận mil3.1.12/.14 và mil7.3.1/.9 đều dùng “này Đại vương”, nên lát này theo đo được, không theo con số bạn đưa.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Tôi chỉ xác minh được: JSON hợp lệ, đủ 37/37 khoá trong `all`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt, không trùng nguyên văn Pāli, và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
