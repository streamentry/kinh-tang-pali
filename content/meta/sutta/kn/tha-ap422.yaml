notes: |-
  Dịch từ Pāli root commit 11c9d708, đủ 64/64 khoá, thứ tự và segment ID đúng như Pāli. Đối chiếu từng khoá với Pāli; không có tầng English hay Việt hiện hành nào để đối chiếu (xem blocking_errors).
  Tiêu đề: Pāli :0.3 là Mañcadāyakattheraapadāna, không bắt đầu bằng số nên Việt không thêm số thứ tự; translationTitle bằng đúng giá trị :0.3 của bản Việt. Hình thức Bài Kệ Tuyên Ngôn Về Trưởng Lão X: đo hai phạm vi. Toàn tầng tha-ap đã có Việt: Tuyên Ngợ 234, Ký Sự Về 96, Tuyên Ngôn 97, Tuyên Ngợi 10. Phạm vi gần nhất (tha-ap380 đến tha-ap460): Tuyên Ngợ 29, Ký Sự Về 13, Tuyên Ngôn 2, Tuyên Ngợi 1. Hai phạm vi cho đa số khác nhau; Tuyên Ngợ và Tuyên Ngợi là chính tả sai nên chọn Tuyên Ngôn theo chỉ đạo của lát, và biên tập nên phán một lượt cho cả cuốn. Tên thera giữ dạng Pāli Mañcadāyaka theo tha-ap360 (cùng tên, cùng cách giữ).
  0.1 giữ Therāpadāna (433 so với 11 Trưởng Lão Ký Sự; phạm vi gần nhất 45 so với 1). 0.2 Phẩm Bhaddāli (4/4 tiền lệ). 16.1 theo mẫu Phẩm X là phẩm thứ N (đa số rõ trong tầng): bācattālīsamo = bā (2) + cattālīsa (40) = 42, nên bốn mươi hai.
  Đại từ ngôi thứ nhất: dùng ta cho cả bài. Phạm vi gần nhất tha-ap380 đến tha-ap460 có 30 tệp thiên về ta so với 15 tệp thiên về tôi; toàn tầng 205 so với 218; phạm vi tha-ap410 đến tha-ap430 là 3 so với 4. Ba công thức cuối bài đều thiên về ta (Kilesā 80/116, Svāgataṁ 74/112, kataṁ buddhassa sāsanaṁ 89/113). Tệp anh em tha-ap421 dùng tôi; đây là lựa chọn có chủ ý, biên tập có thể gộp một lượt.
  Pāli trùng nguyên văn ngoài bài đã dò: 0.1 (444 cặp), 0.2 (4), 1.2 (2), 4.1 (13), 4.2 (19), 4.3 (12), 4.4 (14), 6.2 (7), 6.4 (6), 7.1 (10), 7.2 (5), 7.4 và 10.4 (2), 8.1 (2), 9.1 (2), 10.1 (106), 10.2 (27), 10.3 (382), 11.1 (116), 11.3 (116), 12.1 (112), 12.3 (113), 13.1 (444), 13.3 (443), 14.1 (2), 17.1 (37). Dùng lại dạng đa số cho 0.1, 0.2, 4.1 (nghiệp lành khéo làm ấy, 11/13), 4.2 (tâm nguyện và chí hướng, 15/19), 4.3 (10/12), 4.4 (ta đã đến cõi trời Ba mươi ba, 9/14), 10.1 (Vào chín mươi tư kiếp trước đây, 50/106), 10.2 (3 ở phạm vi gần nhất), 10.3 (Ta không biết mình rơi vào khổ đau, 134/382; phạm vi gần nhất 17), 11 đến 13, 14.1, 17.1, và 7.4/10.4 dùng lại nguyên văn tha-ap360:3.4. Trong chính bài có hai cặp Pāli trùng: mañcadānassidaṁ phalaṁ ở 7.4 và 10.4 (Việt giống hệt), và …pe… ở 11.2, 12.2, 13.2 (đều thành …). 0 cặp trùng nội bộ mà Việt khác.
  Chỗ chủ ý khác tiền lệ: 7.1 Padesarajjaṁ vipulaṁ dịch Vương quyền cai quản các vùng đất rộng lớn (như tha-ap421:7.1) thay vì Vương quốc rộng lớn ấy (9/10) vì dạng đa số bỏ mất padesa; 9.2 carimo vattate bhavo giữ vattate (tiền lệ này ở tha-ap440:8.2 chỉ viết này là đời cuối cùng, bỏ vattate); 10.3 giữ dạng đa số rơi vào khổ đau dù đọa xứ (46 ở dạng ta, 80 ở dạng tôi) sát duggati hơn, vì chưa có căn cứ đổi cả tầng.
  Thuật ngữ đếm được: āsandi là ghế dài (dn1:1.15.2, dn2:50.2, an3.63:3.10; 6 khoá Việt dùng ghế dài); pīṭha là ghế (tha-ap94), ở đây ghế ngồi; Caṇḍāla là Chiên-đà-la (15 khoá so với 5 giữ dạng Pāli); parinibbute là nhập Bát-niết-bàn (6 khoá Việt trong tha-ap, gồm tha-ap143, tha-ap379, tha-ap460, tha-ap463); lokanāyaka là bậc Dẫn Đạo thế gian (nhóm Dẫn Đạo 15 trong 46 khoá có Việt, nhiều hơn Lãnh Đạo 7, Dẫn Lộ 6, Dẫn Dắt 6); tidasa là Ba Mươi Ba theo vv82:8.3 (chúng thiên Tam Thập Tam), thống nhất với 4.4 Tāvatiṁsa.
  Số: Paññāsa = 50 (6.1 năm mươi); asīti = 80 (6.3 tám mươi); Catunnavutito = 4 + 90 = 94 (10.1 chín mươi tư; 65 khoá tầng cùng giá trị); Tāvatiṁsa = 33 (4.4); dasamaṁ = thứ mười (15.1); dvesatāni = 200 và ekā taduttari = 1 nữa (19.3 đến 19.4, tổng 201 theo bản văn). Đếm thô bốn dòng một khổ của tha-ap413 đến tha-ap422 ra 197, lệch 4 so với 201; không phân xử vì đó là con số của bản văn (uddāna), và bản dịch giữ nguyên số của Pāli.
  Bất định ghi ở đây, không thêm vào thân kinh: (1) Pāli gọi vật cúng là āsandi ở 3.1 (ghế dài) nhưng gọi quả là mañcadāna (dâng giường) ở 7.4 và 10.4; hai từ khác nhau trong chính văn bản, dịch sát từng chữ, không hòa giải. (2) Āsandipīṭhakārako ở 2.2 hiểu là kép liệt kê (người làm ghế dài và ghế ngồi); cũng có thể hiểu pīṭha thuộc loại āsandi. (3) 1.4 devamānusasakkate là vị trí cách có thể bổ nghĩa cho pāvacane (giáo pháp) hoặc cho Đức Phật; dịch bổ nghĩa cho giáo pháp vì đứng liền sau 1.3. (4) 8.2 emi ce là mệnh đề điều kiện (nếu ta đến đời làm người) nên 8.1 đến 8.4 là một câu điều kiện, không phải sự kiện đã xảy ra. (5) 2.3 kammena là việc làm nuôi sống (nghề), khác với tena kammena sukatena ở 4.1 là nghiệp lành. (6) 19.2 ciha = ca iha. Dấu ngoặc kép mở ở 1.1 và đóng ở 13.3 chạy xuyên các khoá; khớp Pāli từng khoá (2 khoá có ngoặc, 0 lệch). Pāli không có nháy đơn và không có (…) trần.
  Công thức lời kết dùng nhóm đa số Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (43 trong phạm vi gần nhất, 407 toàn tầng), không dùng nhóm đã từng nói bài kệ này.
  Kiểm tự động: khoá Việt trùng khoá Pāli (64/64, cùng thứ tự); dấu lược cân bằng từng khoá (3/3 khoá …pe… thành …); NFC sạch; 0 khoá rỗng. Cổng kỹ thuật chưa chạy (subagent bị cấm); coordinator chạy: npm run validate, npm test, npm run check, npm run build.
