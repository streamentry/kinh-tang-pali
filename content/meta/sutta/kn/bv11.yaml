notes: |-
  Đợt 19, làn 92. Dịch từ Pāli root commit đã ghim, đủ 134/134 khoá (dịch mới toàn bài), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ chín của Buddhavaṃsa theo thứ tự các Đức Phật (`34.1` `navamo` = 9, khớp `bv10:30.1` `aṭṭhamo` = 8, mục số 11 của bộ), về Đức Phật Nārada: ngồi dưới cây Mahāsoṇa, chứng giác ngộ và chuyển bánh xe, điều phục long vương Mahādoṇa, ba lần chứng ngộ và ba kỳ hội chúng, tiền thân là đạo sĩ bện tóc đi giữa hư không cúng dường chiên-đàn và được thọ ký, gia thế, xuất gia bằng đôi chân, các đệ tử và thị giả, thân lượng, hào quang, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn các bv đã dịch (20/20 tiền lệ).
  - `0.2` “11. Dòng Kế Thừa Của Đức Phật Nārada”: cùng khuôn `bv10:0.2`, `bv12:0.2`; tên viết “Nārada” (bỏ đuôi `-o` của danh cách). `34.1` `vaṁso navamo` → “Dòng kế thừa của Đức Thế Tôn Nārada là thứ chín”, cùng khuôn `bv10:30.1`, `bv12:32.1`.

  **Số Pāli, đã tự tính.** `tayo` 3 (10.1 ba kỳ hội chúng; 19.4 ba lâu đài khớp ba tên ở 19.3: Jita, Vijita, Abhirāma). `koṭisatasahassa` = 100 × 1.000 koṭi = **một trăm ngàn koṭi** (6.3, 10.3; 15 tiền lệ cùng cách). `navutikoṭisahassa` = 90 × 1.000 = **chín mươi ngàn koṭi** (8.3, 11.3). `asītikoṭisahassa` = 80 × 1.000 = **tám mươi ngàn koṭi** (9.3; 5 tiền lệ). `asītisatasahassiyo` = 80 × 100.000 = **tám triệu** (12.4; cùng cách `bv19:8.1`, `bv20:4.3` `asītisatasahassānaṁ` → “tám triệu”). `pañcābhiññā` 5 (13.4). `dasapāramī` 10 (17.4). `cuddasa` 14 (5.4). `navavassasahassa` = 9 × 1.000 = **chín ngàn năm** (19.1; 4 tiền lệ). `ticattārīsasahassa` = 3 + 40 = 43, nhân 1.000 = **bốn mươi ba ngàn** (20.1; `bv12:21.1`, `bv17:15.1`). `caturo` 4 (21.1 bốn dấu hiệu). `sattāha` = 7 ngày (21.3). `aṭṭhāsītiratana` = 8 + 80 = **88** ratana (26.1; `bv13:26.1`). `dasasahassī` = mười ngàn (thế giới) (26.4). `yojana` 1 (27.4, 28.2). `navutivassasahassa` = 90 × 1.000 = **chín mươi ngàn năm** (29.1; 4 tiền lệ). `catuyojana` = 4 do-tuần (33.4). Thang lớn nhân cả số đã tích lũy, không nhân riêng chữ số đứng trước. Không có cụm `Tiṁsakappasahassa` ở bài này; `aparimeyyito kappe` (15.3) là “vô lượng kiếp”, không phải một số.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã dịch ở bộ kn (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 56 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 542 cặp (chưa tính khoá `…pe…`, 942 cặp). Trong 56 khoá đó, 53 khoá dùng đúng nguyên văn một tiền lệ (bỏ qua khác biệt dấu câu) và 3 khoá viết khác tiền lệ: `1.3`, `2.3`, `3.2`.
  - Dùng lại đúng nguyên văn một tiền lệ: 53 khoá — `0.1`, `1.2`, `1.4`, `6.2`–`6.4`, `9.1`–`9.4`, `10.1`, `10.3`, `10.4`, `13.1`, `13.2`, `15.1`, `15.3`, `15.4`, `16.1`, `16.3`, `17.1`, `17.4`, `18.2`, `19.1`, `19.2`, `19.4`, `20.1`, `20.2`, `21.1`, `21.3`, `21.4`, `22.1`, `22.3`, `22.4`, `23.2`, `24.2`–`24.4`, `25.2`, `25.4`, `26.1`–`26.4`, `29.1`–`29.4`, `32.1`, `32.3`, `32.4`, `33.3`, `33.4`.
  - `1.3` `Nārado nāma nāmena`: tiền lệ trùng chữ duy nhất `tha-ap425:2.1` “Ta có tên là Nārada,” là lời kể ngôi thứ nhất; ở đây là câu giới thiệu Đức Phật, dùng khuôn `bv10:1.3`, `bv24:1.3` (“tên gọi là …,”).
  - `2.3` `Āmukkamālābharaṇo`: tiền lệ duy nhất `tha-ap228:4.3` “Trang hoàng đeo vòng hoa báu,” thêm “báu” mà Pāli không có; viết “Đeo vòng hoa và đồ trang sức,” (`āmukka` = đang đeo, `mālābharaṇa` = vòng hoa và trang sức).
  - `3.2` `Abhirūpo brahā suci`: tiền lệ duy nhất `snp3.1:6.2` “Diện mạo đẹp, oai nghi, thanh tịnh;” nói về một con người; ở đây là cái cây, và `brahā` đã được `bv13:2.2` dịch “cao lớn” (`brahā uju` → “cao lớn, ngay thẳng”), nên viết “xinh đẹp, cao lớn, trong sạch;”.
  - Trùng nguyên văn **trong chính bài**: 4 nhóm — (`6.3`, `10.3`) Việt giống nhau; (`8.3`, `11.3`) Việt giống nhau; (`15.2`, `22.2`) Việt giống nhau; (`10.2`, `18.4`, `23.4`) `nāradassa mahesino`: Việt khác ở `10.2` (“nơi Nārada, bậc Đại Ẩn Sĩ;”) so với `18.4`, `23.4` (“của Nārada, bậc Đại Ẩn Sĩ.”), vì vế trước khác: `10.1` “ba kỳ hội chúng … nơi” (định vị), `18.3` và `23.3` “mẹ/thị giả … của” (sở hữu), đúng khuôn `bv10:6.2` so với `bv10:16.4`, `bv10:21.4`. Cặp có Việt khác: 1 nhóm trên 4.

  **Thuật ngữ, đã đo trên tầng (kn).** `kilesa` “phiền não” (57 trên 77 khoá; “ô nhiễm” 11); `saṁsāra` “luân hồi” (32 trên 35); `narāsabho` “đấng Nhân Ngưu” (81 trên 118 khoá chứa dạng này), dùng “đấng” ở `31.4` như `bv10:9.1`; `lokanāyako` “bậc Dẫn Đạo thế gian” (104 trên 157; “Lãnh Đạo” 15, “Dẫn Dắt” 8, “Dẫn Lộ” 7); `mahāvīro` “Đại Anh Hùng”; `mahesino` “bậc Đại Ẩn Sĩ” (theo `bv10`, `bv20`); `khīṇāsavā` “đã đoạn tận lậu hoặc” (27 trên 72; các khoá còn lại viết “lậu hoặc đã tận”, “đã tận lậu hoặc”, “lậu tận”); `pāṭihera` “thần thông” (3 trên 3); `vicinati` “suy xét” (13 trên 58 khoá chứa gốc `vicin`; cả “xét” 21); `byāmappabhā` “hào quang một sải” (9 trên 10); `candana` “chiên-đàn” (21 trên 41; “đàn hương” 8, “chiên đàn” 3); `pāragū` “bờ bên kia” (10; “bờ kia” 4; “thông thạo” 11 ở các ngữ cảnh khác như Vệ-đà, chú thuật, không hợp với thắng trí), `pāramiṁ gantvā` “đạt ba-la-mật trong các thắng trí” (`bv13:17.3`, `bv20:13.3`) là cụm khác nên không áp; `ñāṇavara` “trí tối thượng” (`bv10:2.3`, 1 tiền lệ); `sabbasaṁsaya` “mọi hoài nghi” (`bv12:30.2`; 2 trên 3); `oraso` “con ruột” (19 trên 22); `adhiṭṭhahiṁ` “quyết tâm” (24 trên 72 khoá chứa gốc `adhiṭṭh`); `antalikkhacara` “đi lại giữa hư không” (“hư không” 3 trên 4); `tappetvā` “làm thỏa mãn” (2 trên 4); `dānaṁ dadāti` “bố thí” (6 trên 9); `lokanāyako` ở `15.2`, `22.2`; `jinaputta` “con của bậc Chiến Thắng” (tiền lệ ít: 10 khoá, “con của Đấng Chiến Thắng” 2, “con của bậc Chiến Thắng” 1; giữ dạng gần Pāli).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `2.1`–`2.2` `So buddho cakkavattissa, jeṭṭho dayitaoraso`: “Vị Phật ấy, của vị Chuyển Luân Vương, là con trưởng, người con ruột yêu quý”. `buddho` dùng cho nhân vật trước khi giác ngộ (cách gọi hồi tố). `cakkavatti` ở đây không trùng với tên cha ở `18.2` (Sudeva, `khattiya`); Pāli không nối hai chỗ, nên không gộp. Cách đọc khác: “cakkavatti” chỉ địa vị của người cha.
  2. `3.1` `yasavipulo`: đọc là “danh tiếng lẫy lừng” (`yasa` + `vipula`); cách đọc khác: “rộng lớn, tráng lệ”. Tầng Việt chưa có tiền lệ (0 khoá). `3.3`–`3.4` `tamajjhapatvā upanisīdi, mahāsoṇassa heṭṭhato`: `mahāsoṇa` là cây (khớp `24.4` `mahāsoṇoti vuccati`, cây Bồ-đề), nên “ở dưới cây Mahāsoṇa”.
  3. `4.4` `ukkujjamavakujjakaṁ`: không có dạng này ở bất kỳ khoá nào trong tầng Pāli đã ghim ngoài bài này (0 khoá). Dịch sát nghĩa từng thành phần (`ukkujja` = úp ngửa lên, `avakujja` = úp xuống) thành “lật ngửa lật úp”, bổ nghĩa cho `saṅkhāre` ở `4.3`. Cách đọc khác: “theo thứ tự xuôi và ngược”, hoặc “từ trên xuống dưới”. Đây là chỗ bất định lớn nhất của bài; ngữ nghĩa chưa được tầng nào kiểm chứng độc lập.
  4. `4.2` `vajirūpamaṁ`: “ví như kim cương”; `vajira` còn có nghĩa “sấm sét”; tầng dịch `vajira` là “kim cương” (`tha-ap96:2.1`) lẫn “tia sét” (`thag6.8:3.4`). Chọn “kim cương” vì đi với trí (cùng khuôn `tha-ap96:2.1` `Vajiraggasamaṁ ñāṇaṁ` → “bén nhọn như kim cương”).
  5. `5.2` `abhivāhayi`: không có tiền lệ (0 khoá); `abhivāheti` = cuốn đi, đưa đi hết; dịch “cuốn đi không sót”. `5.4` `buddhañāṇe ca cuddasa`: `cuddasa` = 14, locative `buddhañāṇe`; hiểu là mười bốn trí của Phật (`mil6.3.2:2.6` `cuddasabuddhañāṇe` → “mười bốn trí của Phật”). Cách đọc khác: “và mười bốn (điều) trong trí của Phật”. Pāli không liệt kê mười bốn trí, nên không thêm tên.
  6. `7.1`–`7.4` `Mahādoṇaṁ nāgarājaṁ vinayanto mahāmuni`: `vinayanto` là phân từ, chủ thể là `mahāmuni`; dịch ở thể bị động “vua loài rồng Mahādoṇa, khi được bậc Đại Mâu-ni điều phục” để giữ đúng vị trí tân ngữ của Pāli. `nāga` ở đây dịch “rồng” (`nāgarāja` = “vua loài rồng”); tầng dịch `nāga` là “voi” trong 54 trên 84 khoá nhưng ở ngữ cảnh ja, không có tiền lệ trong bv (0 khoá). Cách đọc khác: “voi chúa Mahādoṇa” (`bv15:6.1` có một con voi Doṇamukha được điều phục, có thể có liên quan). `pāṭihera` “thần thông”; `dassayanto sadevake` “cho thấy giữa thế gian cùng chư thiên” (`bv16:25.2` `virocetvā sadevake` → “giữa thế gian cùng chư thiên”).
  7. `8.1`–`8.4`: `devamanussānaṁ` là sở hữu cách chỉ phần (“trong số chư thiên và loài người”), `navutikoṭisahassāni` là chủ ngữ của `tariṁsu`; dịch “chín mươi ngàn koṭi đã vượt qua mọi hoài nghi”. Đoạn này không gọi tên lần chứng ngộ (thứ hai); không thêm số thứ tự vào thân kinh.
  8. `11.1`–`11.2` `buddhaguṇaṁ sanidānaṁ pakāsayi`: `buddhaguṇa` dịch “phẩm đức của Phật” (`mil6.3.2:2.6`, `mil5.5.6:6.2` “đức hạnh của Đức Phật”), `sanidānaṁ` = “cùng với duyên khởi”, giữ nguyên danh từ `nidāna` đã dùng như thuật ngữ chứ không giải thích; tầng Việt chưa có tiền lệ cho `sanidāna` ở dạng này (1 khoá, `snp4.11:9.1`, là `phassanidānaṁ`, khác). Cách đọc khác: “kèm theo nguyên nhân (của việc ấy)”.
  9. `12.1`–`12.4` `verocano nāgo`: đọc là tên một con rồng, “rồng Verocana”, `dānaṁ dadāti` dịch “dâng vật bố thí”. Pāli ghim không cho biết `verocano` là tên rồng hay voi hay một chức vị. `asītisatasahassiyo` bổ nghĩa cho `jinaputtā` (“các con của bậc Chiến Thắng”, tức các đệ tử), dịch “tám triệu” không thêm danh từ. Cách đọc khác: “tám trăm ngàn”, không ủng hộ vì `asītisatasahassa` đã được `bv19:8.1`, `bv20:4.3` dịch “tám triệu”.
  10. `13.3`–`13.4` `antalikkhacaro āsiṁ, pañcābhiññāsu pāragū`: “ta đã là người đi lại giữa hư không, đã đến bờ bên kia trong năm thắng trí”; cách đọc khác: “thông thạo năm thắng trí”.
  11. `14.1`–`14.4` `Tadāpāhaṁ asamasamaṁ … tappetvā … abhipūjayiṁ`: `asamasamaṁ` là tân ngữ chung của hai động từ; dịch “đối với bậc ngang bằng với bậc vô song, cùng Tăng đoàn, cùng tùy tùng; sau khi làm thỏa mãn bằng đồ ăn thức uống, ta đã cúng dường bằng chiên-đàn” để giữ gerund `tappetvā` ở đúng khoá. `candana` “chiên-đàn” (dạng nhiều nhất trong tầng).
  12. `15.1`–`15.4` thọ ký: `bhavissati` là thì tương lai nên `aparimeyyito kappe` dịch “Sau vô lượng kiếp nữa”, theo `bv7:12.3`, `bv8:13.3`, `bv9:14.3` và `bv10:13.3`; không dịch theo `bv28:1.1` “Vào vô lượng kiếp trước đây” (lời quá khứ). Giữ “vị ấy cũng đã thọ ký cho ta” theo `bv9:14.1` (cùng Pāli `Sopi maṁ tadā byākāsi`). `16.2` `…pe…`: đoạn lược che mất phần giữa, nên không xác định được “chúng ta” là ai ở `16.3`; giữ nguyên nháy theo Pāli từng khoá và dịch sát chữ (cùng cách `bv9`–`bv10`, `bv12`–`bv13`).
  13. `17.2` `bhiyyo hāsetva mānasaṁ`: `bhiyyo` “càng”, `hāseti` “làm cho hoan hỷ”; dịch “ta càng làm cho tâm hoan hỷ bội phần” theo khuôn `bv10:15.2`, `bv18:12.2` (`bhiyyo cittaṁ pasādayiṁ`) nhưng đổi động từ cho đúng Pāli (`hāseti` ≠ `pasādeti`). `17.3` `vataṁ uggaṁ`: “lời nguyện mãnh liệt” (`ugga` = mãnh liệt, như `uggatāpano` ở `13.2`); `bv12:14.2`–`14.3` dùng `uttariṁ vatamadhiṭṭhahiṁ`, “thêm” không có ở đây nên không viết “thêm”.
  14. `19.3` `Jito vijitābhirāmo`: đọc là ba tên “Jita, Vijita và Abhirāma” để khớp “ba lâu đài” ở `19.4` (`tayo pāsādamuttamā`). Cách đọc khác: hai tên (“Jita” và “Vijitābhirāma”), ít khớp với “ba”. `20.4` `nanduttaro`: giữ nguyên chữ đã ghim, viết “Nanduttara”.
  15. `21.2` `padasā gamanena nikkhami`: “bằng cách đi bộ” (`padasā` = bằng chân); tầng chưa có tiền lệ cho cụm này (0 khoá; `ja278:2.2` `padasā` là “dùng cả chân”). Đối lập với các bv khác (xe, kiệu, lâu đài).
  16. `22.4` `dhanañcuyyānamuttame`: đọc là `dhanañca-uyyāna` + `uttame` “ở Dhanañcuyyāna tối thượng”, giữ nguyên chữ Pāli như tên riêng, dùng lại đúng `bv10:20.4`.
  17. `23.1`–`25.4`: các cặp tên `Bhaddasālo jitamitto`, `Uttarā phaggunī`, `Uggarindo vasabho`, `Indāvarī vaṇḍī`: đọc là tên người theo vị trí trong danh sách (đệ tử, nữ đệ tử, thị giả, nữ thị giả) như `bv10:21`–`bv10:23`; `vaṇḍī` ở `25.3` viết hoa như tên (“Vaṇḍī”) dù Pāli ghim viết thường, vì đứng cặp với `Indāvarī`. `24.4` `mahāsoṇoti vuccati`: `ti` là chữ dẫn tên, “được gọi là Mahāsoṇa”, cùng khuôn `bv10:22.4`.
  18. `27.1`–`27.4` `byāmappabhā kāyā niddhāvati disodisaṁ … yojanaṁ pharate sadā`: “hào quang một sải” (9 trên 10); `niddhāvati` “tỏa ra”; `bv22:24.3` `niccharanti` → “Tỏa ra từng phương từng hướng”, dùng cùng cụm cho `disodisaṁ`.
  19. `28.1`–`28.4` `Na keci … janā; ukkāpadīpe ujjālenti, buddharaṁsīhi otthaṭā`: “không có ai, trong số người ở xung quanh một do-tuần, đốt đuốc và đèn lên; họ đã được các tia sáng của Đức Phật bao trùm”. `otthaṭā` (phân từ quá khứ) bổ nghĩa cho `janā`; Pāli không có liên từ “vì”, nên không thêm quan hệ nhân quả vào thân kinh. Tầng Việt chưa có tiền lệ cho `ukkāpadīpe` (0 khoá); `ukkā` “đuốc” (7 trên 31 khoá chứa gốc `ukkā`, còn lại là các gốc khác nghĩa như `sukkā`, `ukkāmukha`, `appossukkā`), `padīpa` “đèn”.
  20. `30.1`–`30.4` `Yathā uḷūhi gaganaṁ vicittaṁ upasobhati`: `uḷūhi` (công cụ cách số nhiều, “bởi các vì sao”) buộc với `gaganaṁ`; “bầu trời với các vì sao được tô điểm muôn màu”. `vicittaṁ` bổ nghĩa cho “được tô điểm” như phó từ (cách đọc khác: “bầu trời đa sắc”). `30.4` `arahantehi sobhati` dùng lại cách dịch `bv12:18.3` (“được tô điểm bằng các bậc A-la-hán”). Pāli đã ghim ở `bv4:35.3` có dạng gần (`Yathā gaganamuḷūhi`), nhưng bài đó chưa dịch trong tầng, nên không có tiền lệ.
  21. `31.1`–`31.4` `Saṁsārasotaṁ taraṇāya, sesake paṭipannake; Dhammasetuṁ daḷhaṁ katvā`: `taraṇāya` là cách chỉ mục đích (“để vượt qua”); `sesake paṭipannake` (“những người còn lại đang thực hành”) đọc là đối tượng hưởng lợi của mục đích đó, vì `paṭipannaka` không phải đối tượng bị vượt qua. Cách đọc khác: “cho những người đang thực hành (khi họ vượt qua) phần còn lại của dòng luân hồi”; ít khớp vì `sesake` là tính từ giống đực số ít cùng cách với `paṭipannake`. `dhammasetu` “cầu Pháp”: tầng chưa có tiền lệ (0 khoá).
  22. `32.2` `Tepi khīṇāsavā atulatejā`: `tepi` = “những vị ấy cũng”, hiểu là các đệ tử (cùng khuôn `bv8:29.2` `tepi sāvakā balappattā`); Pāli không nêu rõ “đệ tử”, nên viết “những vị ấy cũng”, không thêm danh từ. `atulateja` “uy lực không thể cân lường” (`bv10:3.1`).
  23. `33.1` `jinavasabho`: “đấng Ngưu Vương giữa các bậc Chiến Thắng”; đối ứng `narāsabho` “Nhân Ngưu” nhưng tầng chưa có tiền lệ cho `jinavasabha` (0 khoá; `vasabha` chỉ là tên riêng ở `bv22:16.3`, `tha-ap137:1.2`). Cách đọc khác: “bậc Chiến Thắng tối thượng” (`vasabha` = bậc đứng đầu), tương tự `jinavaro`.
