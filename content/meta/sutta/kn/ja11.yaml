notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoá Pāli dài nhất chỉ 30 ký tự nên `cần` rỗng và
  assertion của `kiểm()` không chạy. Tôi tự quét 11/11 khoá: đủ, đúng ID, không rỗng, NFC, dấu
  lược khớp, nháy kép mở ở 1.1 và đóng ở 1.6 nên cân, không còn (…) rỗng.

  TAU THAM KHAO: 10/11 khoá có chữ trong Anh Sujato đã ghin; khoá trống là 2.1 (dòng chốt
  Lakkhaṇamigajātakaṁ paṭhamaṁ, Sujato để trống ở MỌI bài Jātaka) và chỉ 21 ký tự nên không
  tính vào coverage thân bản. Không có bản Việt hiện hành cho Jātaka.

  KHUON TIÊU ĐỀ dùng lại nguyên văn: Jātaka (166 lượt), Bộ Một Bài Kinh (234 lượt cho
  Ekakanipāta), Phẩm Giới (11 lượt cho Sīlavagga, cả ja12–ja19), Kinh <tên> thứ nhất. `miga` →
  *nai* theo Nigrodhamigajātaka (Kinh Con Nai Nigrodha) và Kuruṅgamigajātaka (Kinh Nai Bốn Sừng).

  BA CHỖ BÁT ĐINH, GHI LAI. (1) `Hoti sīlavataṁ attho` tôi dịc *Giữ giới thì có ý nghĩa*; có thể
  đọc `attho` là *ý nghĩa/điều đáng trọng* thay vì *mục đích*, hai cách gần như ngang nhau trong
  câu kệ này. (2) `suvihīnaṁva ñātibhī` tôi dịc *như bị bỏ rơi hẳn vì sợ bà con*: `ñātibhī` là
  nguyên vẫn “vì sợ bà con”, còn `suvihīnaṁ` bị đẩy lên trước thành “bị bỏ rơi hẳn” mà không
  chỉ rõ vật bị bỏ. Trong bối cảnh kệ (Lakkhaṇa được cả nhà vây quanh, Kāḷa vì sợ bà con mà
  bỏ đạo hạnh) thì đọc này hợp lý, nhưng tôi ghi rõ vì nó là chỗ dễ sai. (3) `paṭisanthāra` tôi
  dịc *điều hoà giữa người* (0 tiền lệ cho đúng cụm này; `paṭisānti` mới là *hoà giải*, và cụm
  chữ này chưa có tiền lệ nào trong tầng).

  Tên riêng Lakkhaṇa và Kāḷa giữ nguyên dạng Pāli, không bịa tên Việt.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
