notes: |-
  Therīgāḹā: cả 12 khoá đều là vế kệ, dài nhất 24 ký tự, nên `cần` trong kiểm() RỖNG và
  các assertion của harness không tự chạy. Đã tự kiểm thủ công mọi khoá: NFC, không trùng
  nguyên văn Pāli, khớp từng dấu lược, nhấy kép cân trên cả bài, không có Pāli lọt. Kết quả
  0 lỗi. Ghi lại `save_vi` lần hai cho ra tệp y hệt từng byte (idempotent).
  Tiền lệ đã tra, có đếm: `:0.2` Dukanipāta = Bộ Hai Bài Kinh (4 bài thig2/thag2 đã có).
  `:0.1` giữ dạng Therīgāthā 2.8 như 18 bài thig1 đã có, thay vì dạng trần Therīgāthā của
  thig2.1/thig2.2 — vì số bài giữ số đông hơn và bỏ số là mất thông tin có trong Pāli.
  `:3.1` làm theo thag1.107:1.5 (… Trưởng lão … ….), giữ đúng hai dấu lược như Pāli.
  BẤT ĐỊNH 1, nghiêng về Pāli: Pāli đặt tên bài là Abhayamātutherīgāthā, tức trưởng lão nữ
  là mẹ của Abhayā, và lời tự thuật đi kèm (sabbo rāgo samūhato, ta đã mát lạnh và tịch
  diệt) cũng của người nói. Nhưng SuttaCentral đặt tiêu đề Anh là To Abhayā's Mother From
  Her Daughter, tức đổi chiều: người nói là con gái. Vì vậy `amma` dịch là mẹ, một từ đúng
  được cho cả hai chiều, và không thêm chú giải nào vào thân kinh. Cả hai cách đọc đều để
  mở cho người biên tập.
  BẤT ĐỊNH 2: `paccavekkhassu` là mệnh lệnh số hai (kính trọng), SuttaCentral đọc không
  rõ chủ thể. Chọn số hai để khớp tế tán `amma` ngay trước.
  BẤT ĐỊNH 3: `vihāra` ở đây là sống hay tu tập, không phải tựa; SuttaCentral dịch
  Meditating. Chọn Khi sống như thế vì đó là nghĩa gốc của từ.
  LỖ HỔNG TẦNG THAM KHẢO, đo được: SuttaCentral có 11/12 khoá, im lặng đúng một khoá
  `:3.1` (20 ký tự). Vì `:3.1` ngắn hơn 40 ký tự nên không vào mẫu số coverage, coverage đo
  trên Pāli có nội dung là 100%, không cần ghi vào reference-gaps.yaml. Điểm triangulation
  hạ 8.6 vì khoá `:3.1` phải tự đứng bằng Pāli.
  Không có bản Việt tham khảo: tầng vietnamese-current tại commit đã ghim chỉ có Pháp Cú,
  nên mười tiêu chí triangulation dựa trên Pāli + SuttaCentral + tiền lệ trong tầng.
  Hạ semantic_fidelity 9.3 và ambiguity_integrity 9.0 vì còn bất định về chiều người nói.
