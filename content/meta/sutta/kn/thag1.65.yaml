notes: |-
  **Trưởng lão Ukkhepakatavaccha, phẩm Phẩm Thứ Bảy.**

  **Bài khó nhất của lát, và tôi hạ điểm thẳng vì lý do thật.** Câu kệ thật giống vậy: `Ukkhepakatavacchassa, Saṅkalitaṁ bahūhi vassehi; Taṁ bhāsati gahaṭṭhānaṁ, Sunisinno uḷārapāmojjo”ti.` — hai số từ bất định (xem dưới). Tôi dịch theo cấu trúc Sujato cho nửa sau và **không** dịch chữ Sujato thêm *householders*, vì Pāli không có. `semantic_fidelity`, `grammar_logic`, `ambiguity_integrity` và `vietnamese_clarity` vì thế thấp hơn các bài kia trong cùng lát.

  **`gahaṭṭhāna` (0 tiền lệ toàn kho) — đây là bất định chưa phân xử hết.** Tôi đã quét **toàn bộ** tầng Pāli đã ghim: `gahaṭṭhāna` chỉ xuất hiện ở chính khoá này trong `thag`; các chỗ khác trong tầng là `gahaṭṭha/gahaṭṭhāna` với nghĩa *có chỗ dựa vững* (`mn1:14.2` *chưa vua xứ chưa đại thần…*, `mn16:5.5`) và `pariggahaṭṭha` (*nắm giữ*). Sujato đọc là *Sitting comfortably*. Tôi dịch *có chỗ tựa chắc* — giữ đúng nghĩa *có chỗ dựa*, và **không** biến thành lời giải thích. Cách đọc thay thế (`bhāsati gahaṭṭhānaṁ` = *nói điều ấy như một điều đã nắm chắc*) cũng có thể, nhưng không đủ căn cứ để chọn; tôi ghi ra đây để người biên tập có nơi phản xét.

  **`Saṅkalitaṁ bahūhi vassehi` tôi dịch *suy nghĩ qua nhiều năm*.** Bản nháp đầu của tôi bỏ mất chủ ngữ của `1.2`, để câu trôi; đã sửa thành *Của Ukkhepakatavaccha, suy nghĩ qua nhiều năm* để giữ quan hệ sở hữu của `-ssa`. `Sunisinno` → *ngồi ngay ngắn*; `uḷārapāmojjo` → *hân hoan rạng rỡ* (cả hai 0 tiền lệ).

  **Tên riêng giữ nguyên dạng Pāli** `Ukkhepakatavaccha` như 6 tệp thag đã làm; `0.3` = *Phẩm Thứ Bảy* có tiền lệ `thag1.66:0.3`.

  **Công thức đặt kinh theo đa số, không theo nhóm lệch.** `0.3` = phẩm, `0.4` = *Kinh Kệ Của Trưởng Lão <tên>*. Đo được: 40+ tệp thag/thig đã có dùng đúng thứ tự này (`thag1.23`, `34`, `37`, `42`, `46`, `66`, `92`, `93`, `96`–`99`, `101`–`119`), còn 13 tệp cũ (`thag1.1`–`thag1.14`, `thag2.1`, `thag2.2`, `thag2.35`, `thag6.2`) **đảo** `0.3`/`0.4` cho nhau. Tôi theo đa số, và không sửa nhóm lệch vì ngoài lát. `Ekakanipāta` → *Bộ Một Bài Kinh*; `Theragāthā 1.N` giữ **số** như `thag1.42:0.1`.

  **Dấu lược ở dòng kết `:1.5`.** Pāli khoá này là `… <tên> thero ….` — hai dấu lược — và tôi giữ đúng hai, không mở rộng. Sujato **để trống** cả `:1.5` ở cả tám bài; tầng Việt có tiền lệ giữ nguyên dạng lược này (`thag1.23`, `thag1.107`, `thag1.113`), nên tôi không sinh câu *Bạch Thế Tôn, … đã từng nói bài kệ này* như một số bài khác trong tầng đã làm. Ô Anh trống ở đây không phải sự đồng thuận.

  **Tôi không chạy `npm run validate|test|check|build`** (đợt này cấm), nên `technical_integrity` chấm 9.6 chứ không phải 10.0. Hàm `kiểm()` của `_hvi.py` chỉ quét khoá Pāli ≥ 40 ký tự nên ở cả tám bài này `cần` RỖNG và assertion không tự chạy; tôi đã tự quét MỌI khoá (đúng segment ID, NFC, trùng nguyên văn, số dấu lược, Pāli lọt, cân ngoặc kép) và in từng cặp Pāli ↔ Việt để đọc đối kháng. Tầng Việt Thích Minh Châu không có ở commit đã ghim (chỉ có Pháp Cú), nên đối chiếu là Pāli + Sujato.
