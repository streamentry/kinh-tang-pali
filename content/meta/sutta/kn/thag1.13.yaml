notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Bốn vế kệ của
  Trưởng lão Vanavaccha trong phẩm Dutiyavagga.

  **Vế cuối trùng nguyên văn `thag1.113:1.4`** (`te selā ramayanti man”ti.`) → tôi dùng **cùng một**
  bản dịch cho cả hai bài, theo BRIEF_VI3 §6 (bài học 87 khoá cùng Pāli bị dịch hai kiểu).

  **Dòng kết lược giữ HAI DẤU LƯỢC, không mở rộng** (BRIEF_VI3 §10.1): 10 bản trên đĩa mở rộng,
  5 bản giữ lược. Xem `thag1.112.yaml`. Cả hai đều giữ 2 dấu lược như Pāli.

  **Thứ tự khoá tiêu đề: theo PĀLI** (`0.3` = phẩm, `0.4` = tên bài kệ); 12 bản thag đã publish đặt
  ngược, tôi không sửa chúng.

  **Không đối chiếu được tầng Việt hiện hành** (bilara chỉ có Pháp Cú). Sujato có 8/9 khoá, trống
  đúng dòng kết lược; mọi khoá Pāli ngắn hơn 40 ký tự nên `substantiveSegments = 0`, `ratio = 1`.

  **Thuật ngữ, đếm được.** `nīla` → *xanh thẫm* (3 bản trong tầng dùng *xanh thẫm*; 0 bản dùng *xanh
  biếc*). `rucira` → *tỏa rực rỡ* (33 chỗ trong tầng Pāli). `sītavārī` → *nước mát mát* (38 bản dùng
  *nước mát*; `sītavārī` chỉ có 1 chỗ trong tầng Pāli, chính khoá này). `sucindharā` → *suối trong
  trẻo* (Sujato *streams so clear*; *trong veo* có 11 bản). `sañchannā` → *phủ kín*.

  **Bất định đã ghi — hai chỗ tôi phải chọn.** (1) `Indagopaka` chỉ có 9 chỗ trong tầng Pāli và
  **không có bản Việt nào**; Sujato dịch *ladybugs* (bọ rùa đỏ) — hẹp hơn nghĩa đen của từ, vốn chỉ là
  *một loài bọ cánh cứng*. Tôi dịch *bọ cánh cứng* để không khẳng định loài mà Pāli không chỉ đích
  danh, và ghi lại. 0 tiền lệ cho cụm này. (2) `Nīlabbhavaṇṇā rucirā` là từ chỉ xuất hiện đúng 1 lần
  trong tầng Pāli đã ghim (chính khoá này); Sujato đọc *Glistening, they look like blue stormclouds*
  — tôi không đưa *stormclouds* vào vì Pāli không có; tôi dịch đúng nghĩa *màu xanh thẫm, rực rỡ*.
  Chủ ngữ (những vách đá) chỉ hiện ra ở vế 4, đúng như Pāli.

  **Kiểm kỹ thuật.** `save_vi` sạch, chạy hai lần idempotent. Tự kiểm: đủ 9/9 khoá; đúng ID; thứ tự
  khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2); ngoặc kép cân; không chữ ngoài
  Latin; không còn `(…)`. Không chạy `npm run validate|test|check|build` (đợt này cấm) →
  `technical_integrity` = **9.6**.

  **Danh xưng giữ nguyên dạng Pāli** (Vanavaccha).
