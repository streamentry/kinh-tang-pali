  **một** sự kiện. Đo toàn tầng: *những bài kệ này* = **466** chỗ; nhóm 21 tệp dùng số ít
  thu tục đã bị gọi là lỗi ở **bốn** lát liên tiếp. Nay sửa thành *"đã nói những bài kệ
  này"* và bỏ chữ *từng*.

