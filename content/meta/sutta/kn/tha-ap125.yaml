  **ngắn hơn 40 ký tự** (mỗi vế kệ chỉ 18–26 ký tự), nên bộ lọc `len(p[k]) >= 40` của
  `_hvi.py` quét đúng **một** khoá rồi báo xanh — đó là *không kiểm gì*, không phải pass.
  Tôi tự quét **mọi** khoá, kết quả:
  (1) `set(khoá Việt) == set(khoá Pāli)` — 40/40, 0 thiếu, 0 thừa, 0 orphan;
  (2) ngoặc kép **và** nháy đơn `‘’`, cân theo thứ tự số — kép dư 0, đơn dư 0; vị trí mở
  `:1.1` và đóng `:9.3` **khớp đúng** với Pāli (nhịp nháy cố ý chạy qua khoá, không phải
  mỗi khoá tự cân); (3) `…pe…` không bị bung thành văn — mẫu 1 khoá có `…pe…`, 0 lỗi;
  (4) `…` trần không bị viết đủ — mẫu **0** khoá có `…` trần; (5) 0 khoá rỗng, 0 khoá để
  nguyên `(…)`, toàn bộ NFC.

  **Cặp Pāli trùng: đã dò 21 cặp ở bài này** (khoá có Pāli trùng nguyên văn với bài
  khác trong tầng và bên kia đã có bản Việt). **14 cặp trong đó bản Việt nơi khác khác
  nhau**; tôi đọc từng cặp. Năm cặp tôi **dùng lại nguyên văn** (`0.1`, `0.2`, `6.3`,
  `9.1`, `9.2`, `9.3`).

  **Hai chỗ tôi cố ý lệch tiền lệ, vì bản sẵn có sai.**
  - `:7.1` `Ekanavutito kappe` — 104 khoá cùng Pāli trong tầng; **đa số dịch *chín mươi
    mốt*** (91) — sai. `Eka` 1 + `navuti` 90 = **99**. Đối chiếu bằng chứng trong chính Pāli:
    `Catunnavutito kappe` (`tha-ap326:10.1`) = *chín mươi tư* ⇒ `navuti` là 90. Tôi dịch
    *"Chín mươi chín kiếp trước,"*, theo đúng hai tiền lệ đã đúng: `tha-ap240:2.1`,
    `tha-ap261:2.1`. **Đây là lỗi đã có sẵn ở ~80 tệp, không phải ở lát này** — tôi bị cấm
    sửa bài ngoài lát, nên báo để người điều phối quyết một lượt cho cả phẩm.
  - `:6.1` `Paṭiggahesi bhagavā` — 9 tiền lệ dịch *"thọ nhận"* (`tha-ap49/50/142` …). Ở đây
    Đức Thế Tôn **không nhận**, vì `7.1–7.4` nói thẳng là người kể *"không biết mình rơi vào
    khổ đau"* ⇒ chưa biết quả của món quà, tức là chưa được nhận. Tôi dịch *"Đức Thế Tôn đã
    không thọ nhận,"*. Đây là chỗ lệch tiền lệ **có tác động nghĩa thật**; nếu biên tập chọn
    hướng kia thì phải sửa cả `:7.3`.
  - `:8.1` `Ekatālīsito kappe` = **41**, khớp đúng tiền lệ `tha-ap131:5.1` (*bốn mươi mốt*).
    Chứng cứ cho `tālīsi` = 40: `Paṇṇatālīsito` (`tha-ap112:4.1`) = 45 và
    `Sattatālīsito` (`tha-ap48:4.1`) = 47, cùng cộng thêm `tālīsi` là 40.

  **Thuật ngữ, đều có tiền lệ đếm được trong tầng.** `Therāpadāna` giữ nguyên Pāli ·
  `Sereyyavagga` → *Phẩm Sereyya* (3 tiền lệ y hệt: `tha-ap126/130/131`) ·
  `Suvaṇṇavaṇṇo sambuddho` → *Đức Toàn Giác sắc vàng rực rỡ* (`tha-ap328:1.1`, cùng Pāli) ·
  `Bāttiṁsavaralakkhaṇo` → *đầy đủ ba mươi hai tướng tốt tuyệt hảo* (5 tiền lệ: `tha-ap27`,
  `80`, `81`, `92`, `328`) · `Pavanā abhinikkhanto` → *Bước ra khỏi chốn rừng sâu*
  (`tha-ap163:1.3`, cùng Pāli `Pavanā abhinikkhamma`) · `Bhikkhusaṅghapurakkhato` →
  *được chúng tỳ-kheo vây quanh* (`tha-ap215:1.2`, `tha-ap54:3.4`, `tha-ap306:2.2`) ·
  `lokajeṭṭho narāsabho` → *bậc Trưởng Thượng thế gian, đấng Nhân Ngưu* (**12** tiền lệ) ·
  `sabbaññū` → *bậc Toàn Tri* (đa số) · `mahāmuni` → *Đại Mâu-ni* (14 tiền lệ) ·
  `Mama saṅkappamaññāya` → *Nhờ thấu rõ ý định của ta* (tiền lệ y hệt `tha-ap54:5.1`,
  `tha-ap121:3.1`, `tha-ap451:4.1`) · `yaṁ dānamadadiṁ tadā` → *khi ta dâng cúng phẩm vật ấy*
  (3 tiền lệ y hệt) · `Duggatiṁ nābhijānāmi` → *Ta không biết mình rơi vào khổ đau*
  (**126** tiền lệ y hệt) · `Sattaratanasampanno` → *Đầy đủ bảy món báu quý giá* (61) ·
  `cakkavattī mahabbalo` → *là Chuyển Luân Vương có đại thần lực* (42, đa số áp đảo) ·
  `Paṭisambhidā catasso` → *Bốn vô ngại giải* (**413** chỗ) ·
  `kataṁ buddhassa sāsanaṁ` → *đã làm tròn lời dạy của Đức Phật* (545 chỗ).

  **Bốn chỗ không có tiền lệ, đã phân xử thế nào (ghi ở đây, không thêm vào thân kinh).**
  1. `:4.4` `vipassiṁ abhivādayiṁ` — `vipassī` là danh từ bậc "thấy thấu", ở đây là **danh
     hiệu** gọi Đức Phật, không phải tên vị trước. Tầng này vốn giữ `Vipassī` làm tên
     (22 chỗ, ví dụ `tha-ap131:1.2`, `tha-ap272:1.2`) nhưng không có mẫu nào cho cách gọi
     thân phục này. Tôi dịch *"tôi bái lạy bậc Thấy Triết."* — người Việt có thể đọc *Triết*
     theo nghĩa triết học; nếu biên tập thấy vướng, chỗ này là ứng viên đổi sang giữ
     nguyên `Vipassī`. Đây là bất định có tác động thật.
  2. `:3.4` `ambare anilāyane` — `ambare` có hai nghĩa trong Pāli: *xoài* và *bầu trời*.
     Bốn tiền lệ trong tầng với `haṁsarājāva ambare` đều dịch *trên bầu trời* /
     *giữa bầu trời* (`tha-ap135:2.4`, `tha-ap221:4.4`, `tha-ap425:15.4`, `tha-ap440:6.4`),
     và `tha-ap136:2.4` coi `Ambara` là tên thành. `anilāyana` là **bức bàn phòng gió**, chứ
     không phải chỗ có gió. Tôi dịch *"ngoài trời, trong chỗ tránh gió."* — đọc *vườn xoài*
     cũng bảo vệ được, nhưng không có tiền lệ nào ủng hộ.
  3. `:3.3` `Caṅkamaṁ susamārūḷho` — `susamārūḷha` không có bản dịch nào trong tầng
     (`tha-ap125:3.3` là khoá duy nhất trong toàn bộ Pāli gốc). `susamārūḷha` = trang nghiêm
     tức tối; tôi dịch *"đang đi kinh trang nghiêm tức tối,"*. Đây là **suy luận của tôi**.
  4. `:2.3–2.4` `Āhutiṁ yiṭṭhukāmo so, upanesiṁ baliṁ ahaṁ` — `āhuti` là lễ hương lửa,
     `bali` là bó lễ vật; cụm này không có tiền lệ. Tôi dịch *"Bậc khát khao lễ vật,"* /
     *"ta đem bó lễ vật đến cho Ngài."*

  **Một lỗi bản nháp tôi tự bắt được.** Bản nháp đầu tiên dùng **Bấn Đế Tôn** cho `bhagavā`.
  Đo toàn tầng: *Bấn Đế Tôn* = **0** chỗ — dạng đó **chưa từng** xuất hiện trong tầng Việt,
  và cùng lúc *Đấng Tất Tri* cho `sabbaññū` cũng = **0**. Cả hai đã đổi sang dạng có tiền lệ
  (*Đức Thế Tôn*, *bậc Toàn Tri*). Cùng một cách kiểm đó cũng loại được *Đại Nguyên Đường*
  cho `mahāmuni` (0 chỗ) trước khi tôi kịp ghi.

  **Cổng kỹ thuật CHƯA chạy — lát này bị cấm mọi lệnh `git` và `npm run`.** Bốn lệnh còn
