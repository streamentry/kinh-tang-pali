notes: |-
  Dịch từ Pāli root đã ghim (đọc qua `pali.py` vì `content/catalog/sutta/kn.json` không phải bản nào cũng khai `sourcePath`; thực tế `kn` đọc được qua đường dò cache). Ba bài trong lát: tha-ap309, tha-ap312, tha-ap321 — mỗi bài 32 khoá, tổng 96, tất cả đều đã dịch đủ.

  SỐ THỨ TỰ Ở `:0.3` — phép đo của lát này (lát này đo lại, không nhận số của lát trước).
  Pāli root có 563 bài `tha-ap`; `:0.3` CÓ số thứ tự ở 165 bài, KHÔNG có ở 398 bài. Trong 357 bài đã có bản Việt trên đĩa, đối chiếu từng bài với Pāli của chính nó: Pāli không có số thì bản Việt cũng không có ở 203/205 = 99,0%; Pāli có số thì bản Việt giữ ở 66/152 = 43,4%.
  Chiều đầu gần như tuyệt đối nên đó là phép đo có ý nghĩa; chiều sau đa số là BỎ nhưng đó là đa số thói quen, không phải đa số nguồn. Ba lát trước cùng kết luận BỎ nhưng tỉ lệ rất khác (66/275, 73/274, 127/291) — chính vì đo theo đa số bản Việt thì mẫu đổi là đổi đáp án.
  Áp dụng theo Pāli: `tha-ap309:0.3` = `Ārāmadāyakattheraapadāna` — Pāli KHÔNG có số ⇒ BỎ, số thứ tự nằm ở khoá đóng `:9.1` (`sattamaṁ` → thứ bảy, khớp đúng vị trí thứ 7 trong phẩm: phẩm Padumakesaravagga gồm tha-ap303..tha-ap312). Cùng luật áp cho tha-ap312. Với `tha-ap321:0.3` = `9 Kandalipupphiyattheraapadāna` thì Pāli CÓ số ⇒ GIỮ `9.`, vì bỏ là mất chữ có trong Pāli; số vẫn có ở khoá đóng `:9.1` (`navamaṁ` → thứ chín) nên không mất thông tin, và tính nhất quán trong phẩm vì tha-ap318:0.3 (Pāli `6 …`) cũng giữ số.

  TẦNG THAM KHẢO — 0, đo từ `source/upstream-manifest.json` chứ không suy từ tên thư mục: `english-sujato` 4291 tệp; dưới `sutta/kn/` chỉ có 9 sub-collection (cp dhp iti ja kp snp thag thig ud), không có `tha-ap`. Trong cả tầng Anh chỉ có một tệp `tha-ap` là `name/sutta/tha-ap-name_translation-en-sujato.json`, và trong 619 mục chỉ 56 mục có chữ; cả `tha-padumakesaravagga` lẫn `tha-arakkhadayakavagga` đều trống. `vietnamese-current` = 26 tệp, toàn bộ Pháp Cú. Lớp lấp `english-project` không có. ⇒ `draft`, `triangulation` 7.5.
