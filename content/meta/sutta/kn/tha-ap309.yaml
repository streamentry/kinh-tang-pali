  · Thuật ngữ `ārāma`: bài này là vườn được trồng (`ropito`), có cây bóng râm và chim, kèm `vanaṁ` ở 3.4, nên dịch "khu vườn" thay cho "vườn cảnh" (nghe như cây cảnh) và không dịch "tịnh xá/tu viện" như tiền lệ 30 khoá `ārāma` khác, vì ở đó ngữ cảnh là tăng chúng. `Ārāmadāyaka` ở tiêu đề giữ Pāli.
