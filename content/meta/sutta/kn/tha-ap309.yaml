  ĐẠI TỪ NGÔI THỨ NHẤT — đo trên 424 bài `tha-ap` đã dịch: 219 bài dùng CẢ `ta` lẫn `tôi`, 212 bài chỉ dùng `tôi`, 0 bài nào chỉ dùng `ta`; nhưng `tôi` ấy chỉ xuất hiện trong khung cố định `Tôi nghe như vầy:` (424/424). Vì vậy cả ba bài dùng `ta` cho phần kể chuyện và giữ nguyên khung `Tôi nghe như vầy:`. Hai khoá lệch tiền lệ đã nêu lý do ngay tại chỗ trong `_tvd_n1.py`: tha-ap312:2.1 (tiền lệ 1/1 dùng `tôi`) và tha-ap321:6.2 (8/32 `khi tôi dâng cúng hoa ấy;` so với 3/32 `khi ta …`, chọn `ta` để khớp khoá kề 6.3 với 119/328).

  NGOẠI LỆ CỐ Ý CHO CHỐT `lọt_pāli` — chỉ **2** tên, đo lại trên tập từ của tầng Việt đã **loại trừ** ba tệp của lát (4356 từ, 0 tệp đọc hỏng): `Ārāmadāyaka` (tha-ap309:0.3) và `Pabbhāradāyaka` (tha-ap312:0.3). Cả hai là chữ tố của chính Pāli khoá đó. 15 tên còn lại (`Kandalipupphiya`, `Kesara`, `Piyadassī`, `Sindhu`, `Susuddha`, `Therāpadāna`, …) chốt gốc **không** bắt vì đã có sẵn trong tầng, nên khai thêm chỉ là nới rộng vô ích. Các dạng `-o` (`Ārāmadāyako`, `Pabbhāradāyako`, `Kandalipupphiyo`) và các tên trong uddāna (`Kesara`, `Dhammasaññī`, `Pabbhārado`, `Buddhasaññako`) không cần khai vì chúng có mặt trong Pāli của chính khoá đang dịch, đúng cơ chế `pāli_riêng` của `_hvi.py`. Sau khi thay 2 tên bằng chỗ giữ, `kiểm` chạy lại PASS cho cả ba bài ⇒ không còn lỗi nào khác. `_hvi.py` KHÔNG bị sửa.

  BẤT ĐỊNH GHI Ở ĐÂY, KHÔNG GIẢI THÍCH TRONG THÂN KINH:
  · `tha-ap309:6.2` `sattāsuṁ mudusītalā;` — xem blocking_errors thứ ba. Bản dịch `bảy vị Mudusītalā;` chỉ khẳng định điều tối thiểu: có bảy người, từ Pāli giữ nguyên. Không dịch `mudusītalā` thành `nhiễm bọn nhão` dù `mudutalā` có 2 chứng cứ, vì đọc đó làm câu mất chủ ngữ cho 6.3–6.4.
  · `tha-ap312:3.1` `Nibbattissati so yūpo,` → `Sẽ sinh khởi cột tế lễ ấy,` theo tiền lệ duy nhất có trong kho: `yassa yūpo suvaṇṇayo` (ja264:1.2 và thag2.22:1.2) được tầng dịch là `người có cột tế lễ bằng vàng ròng;`. `yūpo` còn có nghĩa đống/cụi (đối chiếu `dhajo yūpo ca pāṇinaṁ`, bv1:24.2 và tha-ap3:80.2), nên vật được sinh khởi ở đây có thể là cột tế lễ, đống tài sản hay đống công đức; Pāli đã ghim không phân xử được.
  · `tha-ap312:1.3` `Ghaṭakañca upaṭṭhāsiṁ,` → `và ta đã hầu hạ một bình,`. `ghaṭaka` nghĩa chữ nghĩa là bình/ấm; sữa là suy ra từ bối cảnh dâng cúng, không có trong Pāli khoá này, nên không viết vào thân kinh. Với `… nāma khattiyo` (4.2) → `có vị quân tộc tên là Susuddha;` theo cụm tiền lệ `X nāma khattiyo` → `vị Sát-đế-lợi tên X` / `có vị quân tộc tên X`.
  · `tha-ap312:4.1` `Ito bāttiṁsakappamhi,` → `Từ ba mươi hai kiếp trước,`. Số 32 không phải suy đoán: `bāttiṁsa` xuất hiện 22 lần trong Pāli root và `Ārakkhadāyakavaggo bāttiṁsatimo.` (tha-ap322:7.1) được tầng dịch là `Phẩm Ārakkhadāyaka là phẩm thứ ba mươi hai.`
  · `tha-ap312:10.6` `ekapaññāsa kittitā.` → `năm mươi mối đã được tuyên ngợ.` Số 51 có hai chứng cứ cùng dạng: `ekapaññāsa gāthakāti` (tha-ap182:9.6) đã dịch `gồm có năm mươi mối bài kệ.` và `Kaṇikāravaggo ekapaññāsamo` (tha-ap512:12.1) đã dịch `Phẩm Hoa Kaṇikāra là phẩm thứ năm mươi.` Đối chiếu cả ba bài của lát, tổng số khoá Pāli của phẩm Padumakesaravagga là 580 nửa câu ≈ 145 câu kệ, **không** bằng 51 — đó là đặc điểm của bản in, và ta dịch con số Pāli đang ghi chứ không sửa nó.
  · `tha-ap312:8.1` `Padumakesaravaggo ekatiṁsatimo.` → `Phẩm Bậc Nhị Hoa Sen là phẩm thứ ba mươi mối.` theo tha-ap292:9.1 và tha-ap322:7.1 đã có.
  · `tha-ap321` `Kuñjaraṁva durāsadaṁ.` → `như con voi khó hãm dịch.` `durāsada` là hapax trong Pāli đã ghim; `kuñjara` → `con voi` theo 6 tiền lệ.
  · `tha-ap309:1.4` `upāsantesu pakkhisu.` → `Ngài ngự giữa tánh lá.` Chủ ngữ (Đức Phật) không có trong Pāli khoá này — câu 1.2–1.4 là mệnh đề tương đối không có chủ ngữ — nhưng thêm nó vào bản dịch sẽ là thêm chữ không có nguồn ở đúng chỗ đó, nên chỉ nêu bằng đại từ `Ngài` thay cho chủ ngữ rỗng.

  LỖI BẢN NHÁP BẮT ĐƯỢC TRONG REVIEW ĐỐI KHÁNG (sáu khoá, đã sửa trong `_tvd_n1.py` và ghi lại đĩa):
  1. Đại từ ngôi thứ nhất lộn xộn trong cả ba bài (`Tôi` xen với `ta`) — sửa theo số đếm ở trên.
  2. tha-ap312:2.3–2.4 đọc `với ngàn bức vách…` trong khi Pāli `Sahassakaṇḍo satabheṇḍu` là danh từ chủ ngữ, không phải từ nối `với` — sửa thành `ngàn bức vách, trăm lá hiệu / đều làm bằng vàng xanh.` và đổi dấu ở 2.2 thành `:`.
  3. tha-ap312:2.4 dịch `dhajālu` thành `cờ hiệu` trong khi 2.3 đã có `lá hiệu` — lặp; và bỏ `đều` để giữ đúng số nhiều của Pāli.

  CỔNG KỸ THUẬT CHƯA CHẠY — BRIEF cấm `npm run validate|test|build|check`, nên `technical_integrity` đặt **9.6** chứ không phải 10. Trong lát chỉ xác minh được: 96/96 khoá đủ và không orphan (`set(khoá Việt) == set(khoá Pāli)` cho cả ba bài), không khoá rỗng, mọi giá trị NFC, không khoá nào trùng nguyên văn Pāli, `…pe…` khớp từng khoá với quy tắc một dấu lược, ngoặc kép cân trên cả bài, và `kiểm` của chính tầng Việt PASS cho cả ba bài. Bốn lệnh còn lại để coordinator chạy trước khi coi tiêu chí 10 là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
