notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Pāli có nháy kép mở ở 1.4 và đóng ở 5.1, nói giữa chừng; bản Việt bỏ nháy mở lơ lửng ở 1.4 theo khuôn của mil6.2.9 và mil7.3.1 rồi làm 5.1 và 5.2 tự chứa, cân trên cả bài.

  Tiền lệ có đếm và dùng lại: Anumānapañha → Câu hỏi về suy luận (5); cetiya → tháp (81); anukampā → lòng thương tưởng theo glossary; saddhā → tín giải theo glossary; abhiññā → thắng trí theo glossary; paṭiladdha-đãi dịch là đã đạt được; saddhammo → Chánh pháp theo glossary; pubbenivāsa/…, đủ ba nhóm nguyên nhân của ba loại tướng hiện được giữ nguyên thứ tự và đủ số: chư thiên và loài người trong 2.1, nam nữ tín giải trong 3.1, rồi chốt ở 4.1.

  0 tiền lệ, đặt mới: cetiye pāṭihāra → tướng hiện ở tháp (tướng hiện có 13, hiện tướng có 1; pāṭihāra là điều kỳ diệu được dựng lên nên hiện tướng là đúng nghĩa hành động); adhiṭṭhāna → sức nguyện cầu (thiết lập có 365 tiền lệ nhưng ở đây là ý niệm nguyện trước một điều, dùng sức nguyện cầu để không nhầm với lập bàn trong Tăng); cetovasippatti → khả năng tự tại của tâm; saddahitabba → có thể gặp gỡ.

  Một lượt review tự bắt được hai lỗi nghiêm trọng ở 5.1 và 5.2. Bản nháp đầu dịch sampaṭicchāmi thành Làm thế nào thì quả vậy, tức đảo ngược nghĩa — Pāli là tôi hoàn toàn đồng ý như thế. Đồng thời 5.1 có một dấu nháy đóng không mở; đã làm lại thành cặp tự chứa. Sau đó còn một bước nữa: công thức Sādhu, bhante nāgasena, evametaṁ tathā sampaṭicchāmī ti trùng Pāli ở 42 nơi trong corpus và mil6.2.4:2.4 đã có bản Việt, nên đã dùng lại nguyên văn đã có thay cho bản nháp của tôi.

  Giữ đúng tiết độ mà Pāli nêu: 1.6 có tiṭṭhantova, tức A-la-hán còn đang đứng, nghĩa là lúc còn sống, đã dịch là ngay khi còn đứng và không lược mất. 5.1 giữ cả vế phủ định asati, tức dù là không có thật, cùng tiếp theo là bốn vế phải xác nhận: trong sạch, có thể được tin cậy, có thể đi đến, có thể gặp gỡ.

