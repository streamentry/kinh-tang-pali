notes: |-
  Dịch từ Pāli root, không có tầng Anh ở commit ghim nên triangulation thấp, bài giữ draft.
  Bốn công thức kệ chuẩn theo tiền lệ tha-ap561: phiền não thiêu rụi, lành thay sự đến,
  bốn vô ngại giải; mọi dấu …pe… giữ đúng một dấu ….
  Đại từ xưng con (kệ 1-4) và ta (kệ 5-7) theo tiền lệ từng công thức.
  Coordinartor chạy bốn cổng trước khi gộp: npm run validate, npm test, npm run check, npm run build.
  Lượt cải thiện 2026-10-11 (kiểm toán đối kháng, độc lập với lượt chấm 2026-10-04; 9 khoá đổi trên 30):
  tha-ap400:1.3 và 3.3 — Pāli saḷala bị dịch "sa-la": đó là cây sāla khác, và tha-ap407:5.3, tha-ap414:9.1
  liệt kê sāla và saḷala riêng; đổi thành giữ nguyên "saḷala" như tha-ap270:2.3 (accuracy fix, tên vật).
  4.2 — "yaṁ buddhamabhipūjayiṁ" là mệnh đề "khi …" chứ không phải danh từ hoá "việc con đã cúng dường"
  (câu cũ treo, không có vị ngữ); đổi theo 12/14 tiền lệ "khi … cúng dường lên Đức Phật", giữ "đã" cho aorist
  (accuracy + grammar fix). 2.1 — "Tāvatiṁsagato santo" dịch "Được sanh về" là thêm nghĩa tái sinh; theo
  tiền lệ "Devalokagato santo" → "Khi đã đến cõi trời" (3 khoá) đổi thành "Khi đã đến cõi Ba Mươi Ba".
  2.2 — "labhāmi" là "nhận được" (11+ tiền lệ), không phải "hưởng". 1.4 — "kārayiṁ" là sai khiến, đổi
  "đã dựng lên" thành "đã cho dựng" (2/3 tiền lệ "kārayiṁ" sai khiến → "cho xây dựng"). 4.4 — "quả báu" đổi
  "quả báo" (đa số tầng ~130 so với 13). 1.3, 1.4, 2.3, 3.3, 4.2, 4.3, 2.2 — đại từ "con" ở kệ 1-4 đổi "ta"
  để cùng một người nói không đổi xưng hô giữa bài (kệ 5-7 vốn là "ta"), khớp tha-ap556 là bản trùng Pāli
  (clarity fix). Điểm: semantic_fidelity 9.2 → 9.0, grammar_logic 9.2 → 9.1, terminology 9.0 → 8.9, ambiguity_integrity 8.9 → 8.8;
  các tiêu chí khác giữ nguyên. Hạ vì lượt trước bỏ sót ba lỗi rõ (1.3, 3.3, 4.2) cùng bốn lệch nhẹ trên
  27 khoá nội dung, dù ghi "theo tiền lệ"; bản sau sửa đã sát Pāli hơn nhưng chưa nâng điểm lên.
  Bất định còn lại: (1) 8.1 "Itthaṁ sudaṁ" dịch "Tôi nghe như vầy:" là quy ước 558/560 khoá của tầng, không
  phải nghĩa của Pāli (Pāli là "như vậy…", không có "tôi nghe"), giữ nguyên vì đây là quyết định toàn tầng;
  (2) "kārayiṁ" có thể chỉ là dạng thơ của "làm", nên "cho dựng" là cách đọc bám hình thái; (3) "caṅkamanto
  ṭhito ca" giữ "đứng lại" theo tiền lệ, nghĩa sát là "đứng". Cảnh báo ngoài phạm vi: tha-ap556:1.3, 3.3
  (Pāli salala) cũng dùng "sa-la" và đại từ trộn.
  Kiểm máy lượt này: đủ 30/30 khoá Pāli↔Việt, thứ tự khớp, nháy khớp từng khoá, dấu lược …pe… → … ở 3 khoá,
  NFC sạch, 0 Pāli lọt vào lời Việt ngoài tên riêng và saḷala; 2 nhóm Pāli trùng trong bài đều đồng nhất.
  Chưa chạy bốn cổng: npm run validate, npm test, npm run check, npm run build.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 0 khoá bất đồng nghĩa → sửa 0, giữ 0, bất định 0. Đã so cả 30 khoá với các đoạn tương ứng (9 đoạn của bản nguyên bài ứng với 4 khổ kệ, các công thức …pe… và lời kết): nghĩa khớp ở việc cho dựng mái che, nhận cung điện, được che bằng hoa saḷala, không còn biết đến đọa xứ, các công thức kệ cuối; chỉ khác ở chữ dùng (Ba Mươi Ba so với Đạo Lợi, đọa xứ so với khổ cảnh) không đổi nghĩa. Bản nguyên bài cũng đọc `kārayiṁ` là sai khiến (người nói không tự tay dựng) và `caṅkamanto ṭhito` là đi kinh hành rồi đứng, khớp với cách đọc đã ghi ở bất định (2) và (3); lời mở đầu của bản nguyên bài không có “tôi nghe”, khớp với ghi chú ở bất định (1) rằng “Tôi nghe như vầy” ở 8.1 là quy ước của tầng. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Review đối kháng bổ sung cả 30 khoá: không phát hiện lỗi mới.

  Quyết định hội đồng biên tập 2026-10-16: C6 — 1.3, 1.4, 2.2, 2.3, 3.3, 4.2, 4.3, 5.1, 5.3, 6.1 (xưng hô theo mục 9: người kể xưng "tôi").
