  Dấu lược `…pe…` giữ đúng MỘT `…` theo BRIEF_VI3 §10.1, không mở rộng.

  NGÔI THỨ NHẤT — đếm lại trên 414 bài `tha-ap`, chỉ khoá kệ `:1.`–`:7.` và đã bỏ công thức
  `Tôi nghe như vầy`: `ta` 172 · `tôi` 165 · `con` 9 · không đại từ 68. Chọn `ta` vì đa số chung
  (172 > 165) và vì hai phẩm có tiền lệ rõ đều nghiêng về `ta` (`Thomakavagga` ta 7 / tôi 2,
  `Padumakesaravagga` ta 6 / tôi 1). Ba bài trong lát này dùng chung một ngôi để tự nhất quán.

  SỐ THỨ TỰ Ở `:0.3` — ĐO LẠI, không tin bản tóm tắt trước. Trên 418 bài `tha-ap` có `:0.3` ở Pāli:
  Pāli CÓ số thứ tự ở đầu tiêu đề 127 bài, KHÔNG có 291 bài; bản Việt giữ số 68 bài, bỏ số 350 bài.
  Tức **KEEP 66 · DROP 275** tái lập đúng con số đã báo, và nếu đọc theo góc khác thì đa số vẫn là
  **BỎ** (350 bỏ so với 68 giữ). Nhưng cách đo đúng hơn cả hai là đối chiếu với Pāli: 289/291 bài
  không có số ở Pāli thì bản Việt cũng không có (99,3%), còn trong 127 bài có số thì 66 giữ và 61 bỏ.
  `tha-ap221:0.3` Pāli là `Sappidāyakattheraapadāna` — KHÔNG có số — nên số thứ tự bị bỏ khỏi `:0.3`
  và đặt vào khoá đóng `:9.1` (`navamaṁ` → *thứ chín*), đúng như `tha-ap261` và 289 bài khác.

  TÊN Ở `:0.3` VÀ TÊN PHẨM Ở `:0.2` — chọn theo đa số CỤC BỘ của phẩm để bài tự nhất quán với khoá
  đóng của chính nó. `Hatthivagga` có 8 bài trên đĩa, 3 bài có `:0.3` rỗng nên đếm trên 5 bài có nội
  dung: tiền tố *Ký Sự* 3 (tha-ap217, 219, 222) và *Bài Kệ Tuyên Ngợ* 2 (tha-ap216, 218) ⇒ chọn
  **Ký Sự**. `Hatthivagga` ở `:0.2`: *Phẩm Hatthi* 3 và *Phẩm Bậc Voi* 2 ⇒ chọn **Phẩm Hatthi**.
  Cả hai điểm này đều là đa số yếu 3–2, nên đã ghi rõ số đếm để người điều phối gộp cả phẩm một lần.
  Tên riêng giữ dạng Pāli có dấu, sẵn có 161/347 (46,4%) ở `:0.3` của tầng; riêng `Hatthivagga` thì 217
  và 219 phiên dịch tên ở `:0.3` nhưng vẫn giữ Pāli ở khoá đóng — bài này giữ Pāli ở CẢ HAI để không tự
  mâu thuẫn.

  REVIEW ĐỐI KHÁNG — bắt được 1 lỗi bản dịch thật, đã sửa: bản nháp đọc `Nisinno pāsādavare,`
  là *Tại thành xã Nisinno thuận tốt đẹp,* — sai, vì `Nisinno` trong Pāli là tính từ "ngồi", không
  phải tên thành. Đo lại trên tầng thấy 8 khoá Pāli có `Nisinno` và cả tám đều dịch là *ngồi*
  (an3.30:7.3 *ngồi ở chỗ ngồi ấy*, an4.11:11.2 *ngồi hoặc nằm*, tha-ap117:1.3 *đã ngồi giữa hội
  chúng*). Đã sửa thành *Ngồi ở chốn lâu đài tráng lệ,* — `pāsādavare` dịch theo 2 tiền lệ sẵn có
  (tha-ap126:1.1 *Ngồi trên lầu cao tráng lệ,* và tha-ap368:2.1 *Khi đang ngồi trên lâu đài tráng
  lệ,*). Bản nháp cũng viết ở `:6.2` *có danh hiệu là vậy*; đã đổi thành *mang danh hiệu là vậy* cho
  khớp cụm *mang danh hiệu* đã có ở tha-ap217:5.3.

  BẤT ĐỊNH CÒN LẠI, ghi ở đây chứ không giải thích trong thân kinh. `jutideva sanāmako;` (6.2) không
  có một tiền lệ nào trong tầng: `sanāmako` là danh từ "có danh hiệu", mà Pāli khoá này KHÔNG nêu
  tên riêng, nên dịch thành công thức *mang danh hiệu là vậy* thay vì bịa một cách tên. `mukhindriya`
  (3.2) cũng 0 tiền lệ; dịch *trí tuệ* vì `mukha-indriya` ở đây là căn trí tuệ, bỏ chữ *căn* để tránh
  gượng. `sappitelaṁ` (2.3) dịch *dầu nghệ vàng* theo nghĩa *dầu nghệ* của từ điển, khác với `sappi`
  đứng riêng trong tầng (48 khoá) vốn là *bơ* — ở đây `sappi` là củ nghệ và tên Trưởng lão là
  `Sappidāyaka`, nên hai khoá 2.3 và 5.4 giữ cùng một cách dịch. `suppasannattaṁ` (4.1),
  `pāramiṅgato` (4.2) và `anusaṁsāvayiṁ pure` (3.4) đều không có tiền lệ; dịch theo nghĩa chữ nghĩa,
  trong đó `anusaṁsāvayi` bám 1 tiền lệ tha-ap302:3.2 *khi tôi tán thưởng* và `iddhiyā` bám 331 lần
  *thần thông*.

