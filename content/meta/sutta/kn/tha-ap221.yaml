  (414× cho đúng công thức `Itthaṁ sudaṁ āyasmā … imā gāthāyo abhāsitthāti.`),
  `Bốn vô ngại giải,` (355×), `…` cho `…pe…` (627×), `đã làm tròn lời dạy của Đức Phật”.` (323×),
