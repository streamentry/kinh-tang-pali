notes: |-
  Bài này trước đây chỉ có 1/44 khoá (:11.1). Lát này viết lại đủ 44 khoá từ Pāli gốc.

  **Vì sao `draft`, không phải `published`.** Hai lý do, đều đo được từ `source/upstream-manifest.json`:
  `english-sujato` có 755 tệp của `kn` nhưng chỉ 9 sub-collection; tệp `tha-ap` duy nhất trong
  cả tầng là `name/sutta/tha-ap-name_translation-en-sujato.json`, tức tệp *tên*, không phải thân
  kinh. `vietnamese-current` có 26 tệp, toàn bộ là Pháp Cú. `english-project` không có entry.
  Điểm 9.24 không cứu được blocker.

  **Mẫu số coverage = 1, nói thẳng.** Đo theo `isSubstantive` của kho (Pāli ≥ 40 ký tự sau khi
  bỏ block `:0`): mẫu số là **1** (`tha-ap128:11.1`, 65 ký tự); Sujato phủ **0/1**. 43 khoá còn
  lại dài 18–39 ký tự nên cổng **không đo được gì**, đó khác với *đạt*. Vì vậy 43/44 khoá dịch
  từ Pāli một mình, có đối chiếu song song trong chính corpus Pāli chứ không có bản Anh nào.

  **`Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti`.** Pāli `imā gāthāyo` là số nhiều, `abhāsitthāti` là
  quá khứ của một sự kiện. Đo toàn tầng `tha-ap`: *đã nói những bài kệ này* **409**,
  *đã từng nói bài kệ này* (số ít) **12** — trong đó 12 khoá số ít là cả cụm `tha-ap122`–`133`
  do một agent viết. Khoá `:11.1` cũ của bài này thuộc nhóm 12; tôi đã sửa về nhóm 409.
  Vế mở đầu đi theo tầng: *Tôi nghe như vầy* **421/421**, không có ngoại lệ.

  **Vài khoá dịch từ Pāli trùng nguyên văn ở bài khác trong cùng corpus, không phải dịch từ trí nhớ.**
  `tha-ap484:1.1–1.4` mở đầu đúng bằng `Lakkhaṇe itihāse ca, / sanighaṇḍusakeṭubhe`;
  `snp5.1:45.2` và `cnd1:45.2` có `Sāṅghaṇḍusakeṭubhe`; công thức đầy đủ của vị brāhmaṇa học
  rộng nằm ở `dn3:1.3.1`, `dn4:5.10`, `dn5:6.10`: *ajjhāyako mantadharo tiṇṇaṁ vedānaṁ
  pāragū sanighaṇḍukeṭubhānaṁ sākkharappabhedānaṁ itihāsapañcamānaṁ padako veyyākaraṇo*.
  Từ đó tôi đọc `Lakkhaṇa`, `Itihāsa`, `Sanighaṇḍusakeṭubha` ở `:1.3–1.4` là **tên ba tác phẩm
  Vệ Đà**, và `tiṇṇaṁ vedāna pāragū` ở `:2.4` là *thành thạo ba Vệ Đà* — cùng cách đọc mà
  `snp3.7:5.1` đã dịch trong tầng này. `2.3` (`Mante ca sisse vācesiṁ`) rồi mới là *đã học thuộc
  kinh Mantra*, nên hai vế không trùng nhau.
  `abbinesiṁ sakaṁ gharaṁ` ở `:5.4` cũng có hai bản song song đã dịch: `tha-ap305:2.2`
  (*ta đã cung thỉnh Ngài về nhà mình*) và `tha-ap411:35.2` (*ta đã đã đưa Ngài về nhà mình* cho
  `Nimantetvāna sambuddhaṁ, abhinesiṁ sakaṁ gharaṁ`) — nên đây là nghĩa *đưa về nhà*, không phải
  *vào ở trong*.
  `Pañca uppalahatthāni` ở `:3.1` có tiền lệ `tha-ap47:2.1` và `tha-ap186:2.1`; tôi theo *năm bó
  hoa sen xanh* nhưng bỏ chữ `uppala` mà bản `tha-ap47` nhúng thêm vào thân kinh.

  **Thuật ngữ, đếm được trong `content/translation/vi/project/sutta/` (5.408 tệp, 157.308 khoá).**
  `:0.1` `Therāpadāna`: **409/418** khoá đã có bản dịch ở phẩm này giữ nguyên chữ Pāli, chỉ
  **9** khoá dịch thành *Trưởng Lão Ký Sự*; `:0.2` `Sereyyavagga` → *Phẩm Sereyya* **3**;
  `:0.3` và lục kết → *Bài Kệ Tuyên Ngôn Về Trưởng Lão …* — đây là phe bị chia, nên tôi nêu cả
  hai phạm vi: toàn tầng `tha-ap` *Tuyên Ngợ* **197** / *Tuyên Ngôn* **85** / *Ký Sự* **98**;
  phạm vi gần nhất `tha-ap110–145` thì **7/7/7** hoàn toàn hoà (thêm **2** *Kinh Kệ*); phạm vi
  `tha-ap90–200` thì *Tuyên Ngôn* là số đa số: **37** ở `:0.3`, **34** ở công thức lục kết. Tôi theo *Tuyên Ngôn* vì coordinator đã ghi trong brief rằng
  *Tuyên Ngợ* là sai chính tả, và để biên tập phán một lượt cho cả cuổn.
  `mahāmuni` → *Đại Mâu-ni* **18** / *Đại Muni* **8** / *Đại Ẩn Sĩ* **2** / *Đại Hiền* **1*
  (*Đại Ẩn Sĩ* phần lớn thuộc `mahesino`, không phải `mahāmuni`).
  `Duggatiṁ nābhijānāmi` → *đọa xứ* **173** (đọa xứ 73 + 45 + 20 + 12 + 11 + 9 + 4) vs *khổ đau*
  **133**; chuỗi đơn lớn nhất là *Ta không biết mình rơi vào khổ đau* **126**, tôi chọn nhóm
  đa số vì *đọa xứ* sát `duggati` hơn.
  Các cụm còn lại tôi dùng lại nguyên văn bản đã có: `Paṭisambhidā catasso` → *Bốn vô ngại
  giải* **413**; `kataṁ buddhassa sāsanaṁ”.` → *đã làm tròn lời dạy của Đức Phật”.* **380**;
  `Ekanavutito kappe` → *Vào chín mươi mốt kiếp trước,* **33**; `Sattaratanasampanno` →
  *Đầy đủ bảy món báu quý giá,* **38**; `cakkavattī mahabbalo` → *là Chuyển luân vương có đại
  thần lực.* **42**; `pasanno sehi pāṇibhi` → *với tâm tịnh tín bằng chính đôi bàn tay mình.* **7**.

  **`translationTitle` = đúng giá trị `:0.3`.** Pāli `tha-ap128:0.3` là
  `Kusumāsaniyattheraapadāna`, **không** bắt đầu bằng số, nên theo chính sách đo được
  (KEEP 119 · DROP 255 trên 374 tệp `tha-ap`) tôi **bỏ** số thứ tự: tiêu đề là
  *Bài Kệ Tuyên Ngôn Về Trưởng Lão Kusumāsaniya*, khớp khoá `:0.3` và khớp lục kết `:12.1`
  (*… thứ sáu*, vì Pāli `chaṭṭhaṁ`).

  **Bốn bất định đã ghi, không che và cũng không đoán bừa.** Cả bốn đều là chuyện từ vựng,
  không đổi nghĩa giáo lý, nên không nâng thành blocker thứ ba:
  `3.1–3.2` `uppalahatthāni` là *năm bó hoa sen* — `mil3.7.7:1.7` dùng `uppalahattha` làm đơn vị
  lễ vật, còn `thi-ap28:52.1` có `Aṭṭha uppalahatthāni`, nên tôi hiểu là *bó hoa sen*; `3.4`
  `pitumātusamāgame` là cụm duy nhất trong toàn bộ Pāli gốc, tôi đọc theo nghĩa đen là *ở bên
  cha mẹ* (cách cha mẹ hiếu theo nghĩa Bồ-tát cũng có thể nghĩ được, nhưng `:6.3` đã có
  cảnh cúng hoa dưới chân Đức Phật, nên đọc cha mẹ không lặp); `5.3` `Santharitvāna taṁ pupphaṁ`
  chỉ có thêm một chỗ nữa trong toàn corpus (`thag5.11:3.1` `Santharitvāna saṅghāṭiṁ`), tôi
  theo nghĩa *rải*; `2.4` `vedāna` tôi đọc là Vệ Đà theo công thức `dn*` đã nêu, chứ không đọc
  là *thọ tưởng* như một số bản dịch cũ.

  **Trùng Pāli, dùng lại hay viết khác.** Đã dò **3.746** cặp Pāli trùng nguyên văn có bản Việt
  ở bài khác; dùng lại nguyên văn **12** khoá, viết khác **9** khoá, và tôi đọc lại từng cặp
  khác: `1.2` (bản đã có đảo hai vế), `6.3` (bản đã có lệch sang nghĩa của `6.4`) — hai chỗ đó
  là **lỗi thật** ở bản cũ nên tôi giữ cách của mình; `1.3–1.4` giữ tên tác phẩm bằng Pāli
  thay vì diễn giải như `tha-ap3:37` đã làm; `3.1` bỏ chữ gloss `uppala`; `3.3` giữ cả `Āhutiṁ`
  mà bản cũ ở `tha-ap293:1.3` bỏ mất; `7.2` khác vì bản đã có dùng nghĩa *dâng lên* thay vì
  *nắm hai tay*; `8.4` giữ `ssidaṁ` (*niềm vui*) mà ba bản cũ bỏ. **Trong chính bài này không
  có cặp Pāli trùng nào mà Việt khác nhau: 0 nhóm.**

  **Năm phép kiểm tự chạy, in số.** Mẫu số mỗi phép đều là **44 khoá**:
  (1) `set(khoá Việt)` 44 = `set(khoá Pāli)` 44, thiếu 0, thừa 0.
  (2) dấu `“ ” ‘ ’` khớp Pāli từng khoá: 44 khoá, lệch 0. Pāli cố ý mở `“` ở `:1.1` và đóng
  `”` ở `:10.3`, tức nháy chạy qua khoá — bản Việt y hệt, không tự cân mỗi khoá.
  (3) Pāli trùng nguyên văn trong chính bài: 0 nhóm, 0 nhóm có Việt khác.
  (4) `…pe…` / `…` trần / `(…)`: 44 khoá, lệch 0; `:10.2` Pāli `…pe…` ⇒ Việt đúng một `…`.
  (5) NFC thuần 44/44; `(…)` đứng một mình 0.
  `_hvi.py` không chạy ở đây được và tôi cũng không chạy: 43/44 khoá Pāli ngắn hơn 40 ký tự
  nên bộ lọc của nó quét không mấy khoá nào rồi báo xanh — đó là *không kiểm gì*, không phải pass.

  **Cổng kỹ thuật chưa chạy.** Lát này bị cấm `npm run validate|test|check|build`, nên
  `technical_integrity` để **9,6** và không tuyên bố technical gate pass. Bốn lệnh còn lại
  thuộc cổng của người điều phối: `npm run validate` · `npm test` · `npm run check` ·
  `npm run build`.
