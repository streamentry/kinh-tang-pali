  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 3 khoá bất đồng nghĩa → sửa 0, giữ 0, bất định 3 (tha-ap128:3.2: `piṭṭhiyaṁ` — Pāli nghĩa gốc là “lưng”, bản đã ghi ở bất định; bản nguyên bài hiểu là vật để đặt hoa chứ không phải “lưng”, không phân xử được; tha-ap128:9.1: `Anantaraṁ ito kappe` — bản nguyên bài hiểu là kiếp liền kề tính ngược từ thời hiện tại, còn bản này hiểu là kiếp liền sau lần dâng hoa; tầng dùng `ito … kappe` theo nghĩa “từ nay” ở hơn 50 khoá nên cách đọc của bản nguyên bài có sức nặng, chưa đủ để đổi; tha-ap128:9.2: `varadassano` — bản nguyên bài coi là tên vua, bản này đọc tính từ; cùng bản nguyên bài, các tên “Jutindhara”, “Sudhaja”, “Vebhāra” ở tha-ap157, tha-ap155, tha-ap231 cũng được coi là tên trong khi tầng dịch tính từ, nên đây là khác biệt có hệ thống của bản nguyên bài chứ không phải bằng chứng riêng cho bài này). Bản nguyên bài khớp độc lập với các chỗ đã sửa ở lượt 2026-10-12: 1.1 (tên thành), 1.2 (ngôi thứ nhất), 2.1, 2.3 (dạy học trò), 3.3, 4.1 (Vipassī là tên), 5.3 (rải hoa), 6.1–6.3 (vật thực dâng Đức Phật), 7.1–7.4 (chủ thể ra đi là Đức Thế Tôn), 8.4, 9.4. Số 91 kiếp (8.1) khớp bản nguyên bài. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Review đối kháng bổ sung: không phát hiện lỗi mới.

