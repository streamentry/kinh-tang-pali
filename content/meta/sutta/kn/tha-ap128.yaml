  *Tuyên Ngợ* là sai chính tả, và để biên tập phán một lượt cho cả cuổn.
  `mahāmuni` → *Đại Mâu-ni* **18** / *Đại Muni* **8** / *Đại Ẩn Sĩ* **2** / *Đại Hiền* **1*
