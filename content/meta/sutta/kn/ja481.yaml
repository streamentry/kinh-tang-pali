notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja481_root-pli-ms.json` (59/59 khoá, đúng thứ tự Pāli). Bài chỉ gồm tiêu đề, 13 nhóm kệ và dòng kết; phần văn xuôi không có trong tầng Pāli đã ghim.

  - Tầng tham khảo:
    Tầng `english-sujato` tại commit đã ghim chỉ có 83 bài Jātaka và không có `ja481` (tệp `ja48` là bài khác). Tầng `english-project` của dự án chưa có bài này. Bản Việt hiện hành (`translation/vi/phantuananh/`) chỉ có Pháp Cú. Coverage English = 0 trên mẫu số 59 khoá (mọi khoá có nội dung đều không có tầng tham khảo). Vì vậy bài giữ `draft` với blocker `noEnglishEditionUpstream`, `triangulation` = 7.0 (≤ 8.0).
    Ngoài tầng ghim, người dịch chỉ xem một bản tóm lược lời kể của bản Anh Rouse (PTS 1905) để xác định người nói từng bài kệ và tên riêng (Takkāriya là nhân vật, không phải địa danh; Tuṇḍila, Kāḷikā là tên riêng). Không sao chép câu chữ và không tính vào `triangulation`.
  - Người nói (theo bối cảnh Jātaka, không do Pāli ghi trực tiếp): 1 vị tư tế (thầy của Takkāriya) tự trách; 2–6 Takkāriya đáp và nêu các ví dụ; 7 và 9 là nhà vua; 8, 10–12 là cặp kimpurisa; 13 là lời kết nói về cặp kimpurisa. Bản dịch không thêm người nói vào thân kinh.
  - Bất định (đã chọn cách ít giả định nhất, không đưa vào thân kinh):
    + 2.4 `ācera`: đọc là hô ngữ "thưa thầy" (ācariya), có tiền lệ `ja119:1.2` `anācerakule` dịch "nhà không thầy"; `yaṁ taṁ nikhaṇanti sobbhe` dịch sát "kẻ mà người ta chôn xuống hố", cú pháp ngắn gọn nên có thể hiểu khác.
    + 3.2 `kareyya saṁ bhātaraṁ kāḷikāyaṁ` và quan hệ giữa Tuṇḍila, Kāḷikā, người nói: không phân xử được chỉ bằng tầng Pāli; dịch sát chữ, không thêm tình tiết.
    + 4.2 `kuliṅga`: giữ làm tên chim, không xác định loài. 5.1 `potthaka`: dịch "tấm vải". 6.2 `avakkhipantī`: dịch "hất tung", không thêm đối tượng. 6.3 `asi`: dịch "lưỡi dao".
    + 7.2 `atthavasaṁ gatā me`: "đã rơi vào chỗ có ích cho ta".
    + 8.3 `dubbhāsitaṁ saṅkamāno kileso`: đọc `kileso` là chủ ngữ ("ô nhiễm lan sang lời nói xấu"); cách đọc "lời nói xấu lan truyền là ô nhiễm" cũng có thể.
    + 10.5–10.6 `dvinnamaññataraṁ ñatvā, mutto gaccheyya pabbataṁ`: dịch sát chữ, người được thả không xác định danh tính.
    + 11.2 `nānā janā sevitabbā`: "muôn người khác nhau đều cần được phụng sự" (cách hiểu khác: "nên gần gũi nhiều hạng người khác nhau").
    + 12.1 `paricitto aticitto`: "đầy tâm ý, dư tâm ý" (sát chữ, nghĩa chưa chắc).
    + 3.4/4.4/5.4/6.4 `bahutādisova` (4 lần, nhất quán): "thuộc loại như thế, có rất nhiều".
  - Thuật ngữ và tiền lệ: `kalampi nāgghanti` → "không đáng một phần nhỏ nào" (nhất quán `ja450:8.4`, `ja450:9.4`); `Himavanta` → "núi Himavanta" (35 so với "Tuyết Sơn" 5 trong tầng); `kileso` → "ô nhiễm"; `tuṇhī` → "im lặng"; `Pajjunna` giữ nguyên Pāli (tầng có "Pajjuna" ở cp30, bài này giữ dạng Pāli); `kimpurisa` giữ làm thuật ngữ (0 tiền lệ trong tầng). Tiêu đề: `Terasakanipāta` → "Bộ Mười Ba Bài Kinh", `Ambavagga` → "Phẩm Xoài" (nhất quán `ja475:0.2`, `ja475:0.3`).
  - Số Pāli: `sataṁ sahassāni` = sata 100 × sahassa 1000 = 100.000 → "một trăm ngàn" (8.1; nhất quán `ja405:2.3`); `caturo` = 4 (5.1); `ekañca ... ekaṁ` = 1 + 1 (7.3–7.4); `dvinnaṁ` = 2 (10.5). Không có cụm số chưa phân xử.
  - Phép kiểm tra: (1) tập khoá Việt = tập khoá Pāli, 59/59, cùng thứ tự; (2) dấu ngoặc kép “ ” khớp Pāli từng khoá (mở ở 1.1, 2.1, 3.1, 4.1, 7.1, 8.1, 9.1, 10.1, 13.1; đóng ở 1.4, 2.4, 3.4, 6.4, 7.4, 8.4, 9.4, 12.4, 13.4), không có nháy đơn trong Pāli lẫn Việt; (3) dấu lược `…`: Pāli 0, Việt 0; (4) Pāli trùng nguyên văn trong chính bài: các dòng điệp `Ayampi attho bahutādisova` (4 khoá) và Việt giống nhau; (5) NFC, không khoá rỗng, không Pāli lọt sang thân bản Việt ngoài tên riêng và thuật ngữ đã nêu.
  - Kỹ thuật: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; `technical_integrity` đặt 9.6, cần chạy các lệnh này trước khi publish.

  - Lượt cải thiện 2026-10-13: đọc đối kháng lại cả 59 khoá, đổi 9 khoá, tập khoá và thứ tự giữ nguyên.
    + 1.3 (grammar_logic 8.8 → 9.0): bản trước dịch `Takkāriye` là địa danh ("ở Takkāriya") trong khi notes của chính nó nói Takkāriya là nhân vật. Đổi thành hô cách "hỡi Takkāriya" (người đáp ở 2.4 gọi lại bằng hô cách `ācera`; tóm lược lời kể bản Anh Rouse cho thấy Takkāriya là học trò của vị tư tế). Bất định còn lại: dạng `-e` cũng đọc được là định cách, tầng Pāli đã ghim không phân xử.
    + 2.4 (grammar_logic, vietnamese_clarity): "kẻ mà người ta chôn xuống hố" là mệnh đề lửng không nối được vào câu. Đọc `yaṁ taṁ nikhaṇanti sobbhe` là "(về việc) người ta chôn ông xuống hố" (`yaṁ` liên từ, `taṁ` = ông, khớp lời khuyên tự trách ở 2.3). Cách đọc khác, `yaṁ taṁ` là đại từ quan hệ "kẻ mà…", vẫn có thể.
    + 7.2 (semantic_fidelity 8.8 → 9.0): `atthavasaṁ gatā me` bản trước dịch `vasa` thành "chỗ" ("rơi vào chỗ có ích cho ta"). Đo tiền lệ: `vasaṁ gata` ở 15/15 khoá khác trong tầng dịch đều là "quyền lực/sự chi phối/sự sai khiến/trong tay" chứ không phải "chỗ" (`ja399`, `ja436`, `ja502`, `ja531`, `ja542`, `thi-ap22`…). Đổi thành "đã rơi vào quyền lực của ta, vì lợi ích của ta". `atthavasa` là hapax trong toàn Pāli root (chỉ ở khoá này), phần "vì lợi ích của ta" là cách đọc `attha` gần nhất, không chắc tuyệt đối.
    + 1.4, 2.1 (terminology 9.0 → 9.2): `ativela-` dịch "quá lời" lệch tiền lệ "quá mức" (`ja117:1.2`, `ja331:1.2`, `ja517:5.4`, `ja520:5.2`). Đổi thành "nói quá mức"; "Kẻ phàm" → "Người phàm" (`macco`: "người phàm"/"phàm nhân" ở `snp4.1`, `ja453`, `ja522`). 5.2 `anurakkhamānā`: "giữ gìn" → "bảo vệ" (người; `kp9:7.2`, `cp16:11.1`, `ja517:28.3`).
    + 1.2: bỏ "tự" thừa ở "tự gọi rắn đến" (Pāli không có). 3.2: bỏ chủ ngữ "ông ấy" không có trong Pāli (`kareyya` không nêu chủ ngữ), thêm không gì khác. 11.2: "muôn người" → "nhiều hạng người" (`nānā` = nhiều loại khác nhau, không phải "muôn").
    + Đo mà không đổi (không lệch tiền lệ): `meṇḍa` "cừu" (trong tầng: 7 khoá có "cừu đực", 7 khoá có "cừu" hoặc "xe cừu"), `pajā` "loài người" (13) so với "chúng sinh" (15) — chọn theo ngữ cảnh `pasunāthā ayaṁ pajā`; `ñatvā` ở 10.5 vẫn "biết rõ" (cách đọc "chọn/xét một trong hai" khả dĩ nhưng không có căn cứ phân xử).
    + Không đổi điểm: `triangulation` giữ 7.0 (vẫn không có bản Anh độc lập trong tầng ghim); `ambiguity_integrity` giữ 8.5 (hapax `paricitto`/`aticitto` ở 12.1, `atthavasa` ở 7.2, `Takkāriye` ở 1.3 và `yaṁ taṁ` ở 2.4 vẫn chưa phân xử được); `technical_integrity` giữ 9.6. Hai điểm đặt kèm: `source_provenance` 9.5, `segment_alignment` 10.0 không đổi. Cổng kỹ thuật (`npm run validate`, `npm test`, `npm run check`, `npm run build`) chưa chạy trong lượt này.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 17 khoá chênh lệch lớn nhất (6.2, 7.4, 3.4, 4.4, 5.4, 6.4, 0.2, 0.4, 11.2, 12.4, 2.4, 12.1, 5.1, 10.5, 8.3, 3.2, 3.1) → khác nghĩa 5: sửa 1 (10.5: «biết rõ một trong hai chúng tôi» → «biết rõ một trong hai»; Pāli dvinnamaññataraṁ chỉ nói «một trong hai», không nói hai ai, và chữ «chúng tôi» là chi tiết bản dự án tự thêm, trái với chính ghi chú «dịch sát chữ, người được thả không xác định danh tính»), giữ 2 (8.3: bản mù đọc «lời nói xấu khi lan truyền là một ô nhiễm», nhưng saṅkamāno là chủ cách giống đực khớp với kileso chứ không khớp với dubbhāsitaṁ giống trung nên kileso mới là chủ ngữ; 6.2: bản mù thêm «đất» sau «bới tung», còn avakkhipantī trong Pāli không nêu tân ngữ nên giữ «hất tung»), bất định 2 (2.4 ācera «thưa thầy» hay tên/danh xưng, cả hai bản đều không chắc; 12.1 paricitto aticitto, cả hai bản đều không chắc). Các chênh lệch còn lại chỉ là diễn đạt (3.4, 4.4, 5.4, 6.4 bahutādisova; 7.4; 11.2 «phụng sự» / «thân cận»; 12.4; 5.1 potthaka «tấm vải» / giữ nguyên chữ Pāli, cùng ghi bất định; 3.1; 3.2; tên phẩm và nhan đề). Đọc lại toàn bài (59 khoá): nháy kép khớp Pāli từng khoá, thuật ngữ nhất quán trong bài, không có số Pāli ngoài các số đã tính ở trên. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài; đối chiếu hình thái ja518:12.4–14.6, ja370:5.3, ja277:1.3, mn108:2.1): sửa 2 khoá — 8.3 `Dubbhāsitaṁ saṅkamāno kileso` SAI NGHĨA: "ô nhiễm lan sang lời nói xấu" → "e ngại lời nói xấu là điều phiền lụy". `saṅkamāno` là phân từ trung gian của `saṅkati` (ngờ, sợ) + `-māna`, nhận tân ngữ đối cách `dubbhāsitaṁ` — đúng mẫu `mantassa bhedaṁ parisaṅkamāno` (ja518), `tassūparodhaṁ parisaṅkamāno` (ja370), `pajjotassa āsaṅkamāno` (mn108); phân từ của `saṅkamati` (chuyển sang) phải là `saṅkamamāna`. Ý kệ vì vậy là: vì e sợ nói điều xấu nên kimpurisa im lặng (8.4), không phải ô nhiễm "lan sang". 12.4 bỏ dấu chấm thừa sau "?”".
  Bất định mới: cú pháp `kileso` (chủ cách, hợp giống/cách với `saṅkamāno`) chưa chốt — có thể chỉ chính người e sợ là kẻ "khổ lụy", hoặc lời nói xấu là "phiền lụy"; câu Việt giữ ý cốt lõi (e sợ lời nói xấu) mà không chọn hẳn. Bất định cũ giữ nguyên: 1.3 `Takkāriye`, 2.4 `ācera`/`yaṁ taṁ`, 7.2 `atthavasaṁ`, 10.5, 12.1.

  Quyết định hội đồng biên tập 2026-10-16: C2 — `14.1` (dòng kết thêm dấu phẩy: "…, thứ N."); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
