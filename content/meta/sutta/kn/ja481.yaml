notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja481_root-pli-ms.json` (59/59 khoá, đúng thứ tự Pāli). Bài chỉ gồm tiêu đề, 13 nhóm kệ và dòng kết; phần văn xuôi không có trong tầng Pāli đã ghim.

  - Tầng tham khảo:
    Tầng `english-sujato` tại commit đã ghim chỉ có 83 bài Jātaka và không có `ja481` (tệp `ja48` là bài khác). Tầng `english-project` của dự án chưa có bài này. Bản Việt hiện hành (`translation/vi/phantuananh/`) chỉ có Pháp Cú. Coverage English = 0 trên mẫu số 59 khoá (mọi khoá có nội dung đều không có tầng tham khảo). Vì vậy bài giữ `draft` với blocker `noEnglishEditionUpstream`, `triangulation` = 7.0 (≤ 8.0).
    Ngoài tầng ghim, người dịch chỉ xem một bản tóm lược lời kể của bản Anh Rouse (PTS 1905) để xác định người nói từng bài kệ và tên riêng (Takkāriya là nhân vật, không phải địa danh; Tuṇḍila, Kāḷikā là tên riêng). Không sao chép câu chữ và không tính vào `triangulation`.
  - Người nói (theo bối cảnh Jātaka, không do Pāli ghi trực tiếp): 1 vị tư tế (thầy của Takkāriya) tự trách; 2–6 Takkāriya đáp và nêu các ví dụ; 7 và 9 là nhà vua; 8, 10–12 là cặp kimpurisa; 13 là lời kết nói về cặp kimpurisa. Bản dịch không thêm người nói vào thân kinh.
  - Bất định (đã chọn cách ít giả định nhất, không đưa vào thân kinh):
    + 2.4 `ācera`: đọc là hô ngữ "thưa thầy" (ācariya), có tiền lệ `ja119:1.2` `anācerakule` dịch "nhà không thầy"; `yaṁ taṁ nikhaṇanti sobbhe` dịch sát "kẻ mà người ta chôn xuống hố", cú pháp ngắn gọn nên có thể hiểu khác.
    + 3.2 `kareyya saṁ bhātaraṁ kāḷikāyaṁ` và quan hệ giữa Tuṇḍila, Kāḷikā, người nói: không phân xử được chỉ bằng tầng Pāli; dịch sát chữ, không thêm tình tiết.
    + 4.2 `kuliṅga`: giữ làm tên chim, không xác định loài. 5.1 `potthaka`: dịch "tấm vải". 6.2 `avakkhipantī`: dịch "hất tung", không thêm đối tượng. 6.3 `asi`: dịch "lưỡi dao".
    + 7.2 `atthavasaṁ gatā me`: "đã rơi vào chỗ có ích cho ta".
    + 8.3 `dubbhāsitaṁ saṅkamāno kileso`: đọc `kileso` là chủ ngữ ("ô nhiễm lan sang lời nói xấu"); cách đọc "lời nói xấu lan truyền là ô nhiễm" cũng có thể.
    + 10.5–10.6 `dvinnamaññataraṁ ñatvā, mutto gaccheyya pabbataṁ`: dịch sát chữ, người được thả không xác định danh tính.
    + 11.2 `nānā janā sevitabbā`: "muôn người khác nhau đều cần được phụng sự" (cách hiểu khác: "nên gần gũi nhiều hạng người khác nhau").
    + 12.1 `paricitto aticitto`: "đầy tâm ý, dư tâm ý" (sát chữ, nghĩa chưa chắc).
    + 3.4/4.4/5.4/6.4 `bahutādisova` (4 lần, nhất quán): "thuộc loại như thế, có rất nhiều".
  - Thuật ngữ và tiền lệ: `kalampi nāgghanti` → "không đáng một phần nhỏ nào" (nhất quán `ja450:8.4`, `ja450:9.4`); `Himavanta` → "núi Himavanta" (35 so với "Tuyết Sơn" 5 trong tầng); `kileso` → "ô nhiễm"; `tuṇhī` → "im lặng"; `Pajjunna` giữ nguyên Pāli (tầng có "Pajjuna" ở cp30, bài này giữ dạng Pāli); `kimpurisa` giữ làm thuật ngữ (0 tiền lệ trong tầng). Tiêu đề: `Terasakanipāta` → "Bộ Mười Ba Bài Kinh", `Ambavagga` → "Phẩm Xoài" (nhất quán `ja475:0.2`, `ja475:0.3`).
  - Số Pāli: `sataṁ sahassāni` = sata 100 × sahassa 1000 = 100.000 → "một trăm ngàn" (8.1; nhất quán `ja405:2.3`); `caturo` = 4 (5.1); `ekañca ... ekaṁ` = 1 + 1 (7.3–7.4); `dvinnaṁ` = 2 (10.5). Không có cụm số chưa phân xử.
  - Phép kiểm tra: (1) tập khoá Việt = tập khoá Pāli, 59/59, cùng thứ tự; (2) dấu ngoặc kép “ ” khớp Pāli từng khoá (mở ở 1.1, 2.1, 3.1, 4.1, 7.1, 8.1, 9.1, 10.1, 13.1; đóng ở 1.4, 2.4, 3.4, 6.4, 7.4, 8.4, 9.4, 12.4, 13.4), không có nháy đơn trong Pāli lẫn Việt; (3) dấu lược `…`: Pāli 0, Việt 0; (4) Pāli trùng nguyên văn trong chính bài: các dòng điệp `Ayampi attho bahutādisova` (4 khoá) và Việt giống nhau; (5) NFC, không khoá rỗng, không Pāli lọt sang thân bản Việt ngoài tên riêng và thuật ngữ đã nêu.
  - Kỹ thuật: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; `technical_integrity` đặt 9.6, cần chạy các lệnh này trước khi publish.
