  NGHIÊN CỨU TAM GIÁC. Không có tầng Anh nào để đối chiếu (xem trên), nên tôi đọc chú giải
  Jātaka từng vế để phân xử những chỗ Pāli khó, rồi vẫn tự viết lại bản Việt. Chú giải được
  dùng như TỪ ĐIỂN và để cân nhắc bối cảnh, không sao chép câu Anh nào vào thân kinh.

  BÀI NÀY LÀ ĐIỂM YẾU NHẤT CỦA LÁT, VÀ ĐIỂM ĐÓ ĐÃ HẠ ĐIỂM.
  BẤT ĐỊNH CHƯA PHÂN XỬ ĐƯỢC. `mandajā` ở `1.4` (`Hatthattamāyanti mamaṁ mandajā pure`) là
  từ mà chú giải Jātaka — vốn giải thích gần như từng chữ trong bài này — BỎ QUA KHÔNG GIẢI
  THÍCH, và từ điển Pāli trong kho không có mục nào. Tôi đọc nó là tế từ: manda là kẻ mù, kẻ
  điếc, kẻ ngơ, và -jā là con của, nên dịch ô con gái kẻ mù. Đây là suy luận của tôi, không phải
  dữ kiện văn bản; tôi ghi rõ thay vì im lặng. Ba chỗ khác cùng bài, người đọc nên biết:
  (1) `Vasimha` ở `1.2` không giải thích được là tế từ gọi ai hay tên người nói; chú giải đọc
  cả câu là Vasiṃha nói (ngôi một, `mamaṁ` = của tôi), và đọc `romaka` là tế từ gọi con chim.
  Tôi giữ Vasimha ở vị trí Pāli đặt và dịch là Vasiṃha ở trong hang đá núi, Romaka. (2)
  `dijā` ở `2.2` là chư thiên, nhưng câu chuyện nói về bầy chim bồ câu, và chú giải cũng gọi
  đó là chim. Tôi vẫn dịch chư thiên vì Pāli viết vậy, nhưng người đọc Việt sẽ thấy lạ; nếu biên
  tập muốn nhất quán với cốt truyện thì đổi thành chim. (3) `Ājīvikā` ở `3.4` là TẾ TỪ, không
  phải danh từ nguồn sống — chú giải xác nhận đây là các tế từ và nghĩa là kẻ sống nhờ
  sinh nghề nghiệp, tức tên gọi chê kiểu của kẻ tu sĩ giả. Đọc sai thành nguồn sống sẽ đảo ngược
  nghĩa cảnh, nên tôi dịch Ājīvika, chính vì thế chúng tôi mới e sợ ngươi. Chữ cuối tamuttasāmā
  chưa phân tích được trọn; chú giải giải nghĩa vế này là vì thế chúng ta mới e sợ, và tôi bám
  theo nghĩa ấy.

  VÌ SAO `romaka` LÀ TÊN BÀI. Chú giải dịch romaka là người có lông, tức cách Vasiṃha gọi
  con chim, nhưng trong cốt truyệt con chim ấy chính là vua bầy bồ câu tên Romaka, nên tôi đặt
  tên bài là Kinh Romaka, khớp với lời gọi trong kinh.

