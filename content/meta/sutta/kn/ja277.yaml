  GIẢI QUYẾT DRAFT 2026-10-12 (thay thế các mục cũ về `mandajā`, `Ājīvikā`, `dijā`, `Vasimha`, "chư thiên" và "kẻ mù" ở trên; các mục còn lại giữ nguyên làm lịch sử).
  Đọc đối kháng lại 17 khoá từ Pāli: 12 khoá thân kệ (1.1–3.4) đều đổi, 4 khoá tiêu đề và khoá kết giữ nguyên. Lỗi nghĩa thật ở 12/12 khoá thân kệ, chia theo loại: (1) đọc sai hình thái từ: `mamaṇḍajā` = mama + aṇḍajā ("loài sinh từ trứng của ta"), không phải "mandajā" "con gái kẻ mù" (bản cũ tự bịa ra một từ không có); `Vasimha` là động từ "chúng ta đã sống" (dạng 1 số nhiều), không phải tên riêng; `dijā` = loài chim (hai lần sinh), không phải chư thiên; `te dāni ... ussukā` bản cũ biến thành "chúng hương kia ... rũ xuống", vô nghĩa. (2) `Ājīvikā` ở 3.4 bản cũ đọc thành hô cách "Ājīvika" (tế từ, tu sĩ phái Ājīvika); thực tế đây là cách dùng như trạng từ "vì sinh kế", cùng nghĩa với lời trách ngầm của chim bồ câu: tâm ông đã hư hỏng với chúng tôi vì kế sinh nhai, nên chúng tôi kinh sợ ông. Bản cũ "ngươi", "tôi" của người nói đoạn 1–2 được thống nhất lại: người ẩn sĩ nói "ta"/"chúng ta", bầy chim đáp "chúng tôi"/"ông". (3) 2.4 `cirappavutthā atha vā na te ime`: bản cũ "đã lên đường từ lâu, không còn ở đây" lệch; đọc lại là hai khả năng người nói nêu: chúng đã vắng xa lâu ngày, hoặc những con này không phải là chúng. (4) 1.3 `abhinibbutattā` dịch "tâm tịch tịnh", khớp tiền lệ ud3.6:6.3 và snp2.12:2.4 trong tầng. `vakkaṅga` giữ "kẻ thân cong" theo tiền lệ 4/4 bài trong tầng (ja429, ja430, ja533, ja534), không có phản chứng.
  Người nói: 1.1–2.4 là người ẩn sĩ nói với Romaka (hô cách ở 1.2 và 2.1), 3.1–3.4 là Romaka đáp; ngoặc kép đóng ở 2.4 và mở lại ở 3.1 khớp ranh Pāli từng khoá. Pāli có `ti` đóng ở 3.4.
  BLOCKER ĐÃ GỠ: blocker thứ hai ("coverage 0/0 dưới ngưỡng 0.8, chưa có mục trong reference-gaps") do tác giả cũ tự đặt. Mẫu số = 0 (mọi vế kệ ngắn hơn 40 ký tự, khoá dài nhất là 34), nên cổng không đo được gì; thiếu bản Anh đã nằm trọn trong blocker đầu tiên (không có tệp Sujato nào cho uid này tại commit đã ghim), nên xoá blocker thứ hai không làm mất thông tin. BLOCKER GIỮ NGUYÊN: blocker đầu tiên (thiếu bản Anh upstream), là sự thật về bản chụp. Tầng `vietnamese-current` chỉ có Pháp Cú, nên không có bản Việt hiện hành để đối chiếu; đó chỉ là giới hạn tham chiếu.
  BẤT ĐỊNH CÒN LẠI (không phân xử được hoàn toàn, ghi ở đây, không đưa vào thân kinh): (a) `ājīvikā` đọc là "vì kế sinh nhai" gắn với vế 3.3 và 3.4; Pāli không nói rõ của ai, đọc theo cốt truyện là kế sinh nhai của người ẩn sĩ muốn ăn thịt chim; (b) `Vasimha` "chúng ta" gồm ẩn sĩ và bầy chim theo cách đọc ngôi 1 số nhiều; (c) `ussukā` dịch "nóng lòng", chưa tìm được dạng song song trong tầng để đo; (d) `tamuttasāma` đọc là `taṁ` + `uttasāma` ("chúng tôi kinh sợ ông"). Không có bản Anh độc lập nào, nên `triangulation` giữ 6,6 (không nâng); `ambiguity_integrity` 8,3 vì các điểm (a)–(d) vẫn là suy luận từ Pāli, không có nguồn thứ hai.
