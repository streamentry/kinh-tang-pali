notes: |-
  Dịch trọn 170 khoá trực tiếp từ Pāli root; không có bản Anh của Sujato, không có lớp english-project và không có bản Việt hiện hành cho tha-ap536 tại commit đã ghim. Đối chiếu thuật ngữ và công thức với các Ký Sự cùng phẩm (tha-ap533, tha-ap534, tha-ap537, tha-ap539), với Phật Sử bv17, bv20, bv28 (Padumuttara, Vipassī, đơn vị ratana, công thức tāresi janataṁ bahuṁ), với an1.214 (ngài Dabba về sắp đặt chỗ ở), mn24 và sn47.13 (ovādako viññāpako), tha-ap100, thi-ap11 và thi-ap29 (senāsana).
  Tiền lệ đã đo (các bài kn đã dịch: tha-ap, thi-ap, bv, vv, pv, cp): có 48 khoá mà Pāli (bỏ dấu câu và nháy) trùng nguyên văn với khoá đã dịch ở nơi khác (6.088 cặp đã dò, trong đó 602 cặp bản Việt hiện có khác bản này), 39 khoá dùng lại nguyên văn một bản đã có: Đức Chiến Thắng tên Padumuttara (13 khoá), Cách đây một trăm ngàn kiếp (2), Là bậc đầy lòng trắc ẩn từ bi (3), đầy đủ ba mươi hai tướng tốt tuyệt hảo (2), Một trăm ngàn năm và là tuổi thọ lúc bấy giờ, Ở lại trong chừng ấy thời gian (bv20), vị ấy đã đưa đông đảo mọi người vượt qua (3 khoá bv17, bv20, bv28; dùng cho cả 2.4 và 6.4), vị ấy cùng các đệ tử đã nhập Niết-bàn (3 khoá bv), sinh ra trong dòng họ Okkāka (19), Tên là Gotama theo dòng ấy (14 so với 5 dạng viết hoa), sẽ làm bậc Thầy ở thế gian (19), Nhờ nghiệp lành khéo làm ấy (23), cùng với tâm nguyện và chí hướng (26), sau khi từ bỏ thân người (15), ta đã đến cõi trời Ba mươi ba (13 dạng ta so với 7 dạng tôi), ta đã làm ra vương quyền nơi chư thiên, ta đã làm Chuyển Luân Vương, đếm không hết, vô tận, nhờ sức mạnh của nghiệp ấy (1 so với 1 dạng nhờ vào quả phước của nghiệp ấy; chọn dạng không thêm chữ quả phước), thân quyến của Phạm thiên, danh tiếng lớn lao (4 khoá: tha-ap551, thi-ap1, thi-ap37, thi-ap40, so với 1 dạng thuộc họ Brāhmaṇa), tên theo dòng họ là Kassapa (4 khoá cùng bốn tệp, so với 1 dạng khác), Vào chín mươi mốt kiếp trước (39 so với 38 dạng Từ), ta sống không còn lậu hoặc (106), Các phiền não của ta đã được thiêu rụi (100), Thật lành thay sự đến của ta (95), Bốn vô ngại giải (487), đã làm tròn lời dạy của Đức Phật (459 ở khoá có nháy kép đóng). 9 khoá khác với tiền lệ, lý do từng khoá: 7.1, 9.4, 23.4 và 39.4 chỉ đổi ngôi tôi thành ta (xem dưới); 12.1 viết Sau một trăm ngàn kiếp nữa vì là lời thọ ký hướng tương lai theo bhavissati (tiền lệ Vào một trăm ngàn đại kiếp trước là câu kể quá khứ, 29 khoá; Vào một trăm ngàn kiếp trước 5 khoá; Vào một trăm ngàn kiếp trước đây 7 khoá); 15.1 và 15.3 xem mục lỗi tiền lệ dưới đây; 17.2 bỏ chữ đã có của tiền lệ bv28 vì 17.3 đã mang động từ đã xuất hiện; 19.2 thêm chữ và (của các đệ tử, những bậc Đại Ẩn Sĩ ở bv27:5.2 thành và các đệ tử, những bậc Đại Ẩn Sĩ) vì ở đây khoá 19.1 là chỗ dành cho. Khoá 16.1 Padesarajjaṁ vipulaṁ có hai dạng ở tầng (Vương quốc rộng lớn ấy 15 khoá so với Vương quyền cai quản các vùng đất rộng lớn 8 khoá); chọn dạng sau vì giữ được padesa (vùng) và rajja (vương quyền) và vì Pāli đang đếm số lần cai quản chứ không nói một vương quốc duy nhất.
  Lỗi trong tiền lệ phát hiện và không sao chép: Satānaṁ tīṇikkhattuñca và Satānaṁ pañcakkhattuñca ở tha-ap344:7.1, 7.3, tha-ap345:3.1, 3.3 và tha-ap375:7.1, 7.3 đã dịch Cả bảy món báu quý giá và Cũng cả năm món báu quý giá (6 khoá), tha-ap459:6.3 dịch Cũng cả trăm món báu cùng năm món quý (1 khoá). Pāli là tīṇikkhattuṁ (ba lần) và pañcakkhattuṁ (năm lần) đi với satānaṁ (của trăm), không có chữ nào nghĩa là báu hay bảy; tổng 7 khoá ở 4 tệp cần người điều phối xem lại. Ở bài này viết Ba trăm lần và Năm trăm lần (3 nhân 100 là 300; 5 nhân 100 là 500).
  Số Pāli: Ratanānaṭṭhapaññāsaṁ là aṭṭha 8 cộng paññāsa 50 thành 58, dịch Cao năm mươi tám ratana, giữ nguyên đơn vị ratana như bv20:22.1 (Aṭṭhapaṇṇāsaratanaṁ, Cao năm mươi tám ratana) mà không đổi sang hattha; Vassasatasahassāni là sata 100 nhân sahassa 1.000 thành 100.000 năm; satasahassamhi và satasahassito kappe là một trăm ngàn kiếp; Ekanavutito là eka 1 cộng navuti 90 thành 91 kiếp; bāttiṁsa là 32 tướng; sattāhaṁ là bảy ngày; sattavassiko là bảy tuổi; tāvatiṁsa là Ba mươi ba (cõi trời); bhikkhavo satta là bảy tỳ-kheo, khớp với 32.1 đến 34.1: một vị trưởng lão, một vị đi theo là bậc Bất Lai, và năm vị còn lại (Dabba, Pakkusāti, Sabhiya, Bāhiya, Kumārakassapa) là bảy; catutthaṁ ở 44.1 là thứ tư. Không có cụm tiṁsakappasahassa hay số lớn nào cần phân xử. Hai số 15.1 và 15.3 (300 và 500 lần) là cách đọc satānaṁ nhân số lần, nên người biên tập xác nhận một lượt vì không có bản Anh độc lập.
  Ngôi kể dùng ta theo đa số gần nhất: các Ký Sự cùng phẩm đã dịch (tha-ap530 đến tha-ap544) là 233 khoá ta so với 55 khoá tôi; toàn tầng tha-ap thì 241 tệp nghiêng về ta so với 290 tệp nghiêng về tôi, hai phạm vi cho đa số khác nhau nên chọn theo phạm vi gần nhất. Tên phẩm Kaccāyanavagga dịch Phẩm Kaccāyana theo tha-ap533, tha-ap534, tha-ap537 và tha-ap539 (4 trong 4 tệp). :0.3 trong Pāli không có số thứ tự đầu tên nên bản Việt không thêm số; translationTitle bằng đúng giá trị :0.3. Dạng tên bài Ký Sự Về Trưởng Lão X theo đa số gần nhất (tha-ap500 đến tha-ap570: 23 so với 15 dạng Bài Kệ Tuyên Ngợ và 1 dạng Bài Kệ Tuyên Ngợi). Lời kết 43.1 dùng nhóm nói những bài kệ này (số nhiều, theo imā gāthāyo); 44.1 theo dạng Ký Sự Về Trưởng Lão X, thứ tư.
  Lời thọ ký tương lai (12.1 đến 13.4): kappe, bhavissati, hessatiyaṁ dịch theo hướng sau một trăm ngàn kiếp nữa, sẽ làm, sẽ là; 13.4 hessatiyaṁ đọc là hessati cộng ayaṁ nên dịch người này sẽ là bậc đứng đầu.
  Dấu lược: ba khoá …pe… (40.2, 41.2, 42.2) giữ đúng một …; không có (…) trần trong Pāli của bài này. Nháy: kép mở ở 1.1 và đóng ở 42.3; nháy đơn mở ở 10.3 và đóng ở 13.4, mở ở 23.1 và đóng ở 23.4, mở ở 28.1 và đóng ở 28.4, mở ở 30.2 và đóng ở 31.4; đều khớp Pāli từng khoá (170 khoá, 0 lệch). Đối chiếu 170 khoá với Pāli: đủ khoá, đúng thứ tự, 0 lệch dấu lược, NFC sạch, không khoá rỗng, không Pāli lọt sang thân Việt ngoài tên riêng. Pāli trùng nguyên văn trong chính bài: 4 nhóm gồm 6 cặp (2.4 và 6.4; 38.4 và 40.3; 40.2, 41.2 và 42.2; 41.3 và 42.3), cả 6 cặp bản Việt giống nhau (cặp 41.3 và 42.3 chỉ khác nháy kép đóng đúng như Pāli), 0 cặp lệch. Đã đọc cặp Pāli với Việt của cả 170 khoá.
  Bất định và lựa chọn cần người biên tập lưu ý: (1) 8.1 đến 8.4: paññāpentaṁ sasāvakaṁ cùng cách (đối cách) với nhau nên đọc là vị sắp đặt chỗ ở cho các tỳ-kheo cùng với các đệ tử của vị ấy, và kittayantassa là Đức Thế Tôn đang tán thán vị đó; nếu sasāvakaṁ chỉ Đức Thế Tôn cùng các đệ tử thì cần sửa; 9.1 đến 9.2 đảo thứ tự thành cho Tăng chúng và bậc Đại Ẩn Sĩ ấy để câu tiếng Việt xuôi, không đổi nghĩa (sasaṅghassa tassa mahesino). (2) 10.3 và 10.4: Yo sasaṅghamabhojesi sattāhaṁ lokanāyakaṁ dịch người nào đã cúng dường bữa ăn cho cả Tăng chúng và bậc Lãnh Đạo thế gian suốt bảy ngày (abhojesi là cho ăn); 11.1 Soyaṁ dịch chính người này. (3) 23.1 dhammakkho là hapax trong toàn lớp Pāli đã ghim; dịch con mắt Pháp theo hướng dhamma cộng akkha (con mắt) và ngữ cảnh (cạnh na passissāma, na suṇissāma); nếu hiểu theo cách khác thì cần sửa. (4) 26.3 Sadhūmā jālavaṭṭā dịch những vòng lửa bốc khói, jālavaṭṭa cũng chỉ xuất hiện một lần, dựa vào jāla (lửa, lưới) và vaṭṭa (vòng); 26.2 dhūmaketu dịch sao chổi. (5) 33.1 Nibbuto tiṇṇasaṁsāro không nêu chủ ngữ; đọc là vị trưởng lão (arahā ở 32.1) vì anāgāmī ở 32.2 và suddhāvāse ca ekako ở 33.2 là vị đi theo; nếu chủ ngữ là vị đi theo thì cần sửa. (6) 18.1 đến 18.4: suddhoti ca vijāniya dịch và ta đã biết vị ấy là bậc thanh tịnh, không thêm sắc thái nhượng bộ (dù) mà Pāli không nêu. (7) 19.1 đến 19.4: salākaṁ gahetvāna dịch sau khi nhận lấy thẻ; khīrodana (khīra sữa cộng odana cơm) dịch cơm sữa, không có tiền lệ trong tầng Việt cho từ này (Pāli chỉ xuất hiện ở tha-ap536 và vv33:73.1, vv33 chưa dịch) và khác với cháo sữa (18 khoá ở tầng, của các Pāli khác). (8) 35.2 jāto gabbheva me sato dịch ta sinh ra khi vẫn còn trong thai theo nghĩa đen; 35.3 và 35.4 (mẹ chết, được đặt lên giàn thiêu, ta rơi ra) giữ nguyên trình tự Pāli, tên Dabba theo dabbapuñjamhi ở 36.1 và 36.2. (9) 36.3 Brahmacārībalena dịch nhờ sức mạnh của bậc sống phạm hạnh, song song với 37.1 Khīrodanabalena (nhờ sức mạnh của cơm sữa); Pāli không nói rõ brahmacārī là vị nào, bản Việt cũng không nói. (10) 37.2 pañcahaṅgehupāgato dịch ta đã có đủ năm chi phần; Pāli không liệt kê năm chi phần, bản Việt không thêm. (11) 37.4 pāpehi bahucodito dịch bị những kẻ xấu ác buộc tội nhiều lần; codito có cả nghĩa khiển trách và buộc tội, chọn buộc tội theo ngữ cảnh vì có việc phỉ báng ở 37.3. (12) 4.1 đến 4.4: Evaṁ nirākulaṁ āsi không nêu chủ ngữ (trung tính), bản Việt cũng không thêm chủ ngữ; vasībhūtehi tādibhi dịch những bậc tự tại, những bậc Bất Động (tādī là bậc Bất Động ở tha-ap102 và tha-ap103, cũng có đáng tôn kính ở tha-ap109 và Như Thật ở tha-ap110). (13) 5.4 Kañcanagghiyasaṅkāso dịch rực rỡ tựa như cột trụ bằng vàng theo tiền lệ bv18:21.3, tha-ap205:1.1 và tha-ap27:1.3. (14) 22.2 atthamentamhi dịch đang tàn lụi (theo tha-ap537:19.1 đến 19.2). (15) 21.2 kutitthiye dịch những ngoại đạo tà vạy, 21.3 vineyye dịch những người có thể giáo hóa; cả hai chưa có tiền lệ. (16) senāsana dịch chỗ ở và senāsanapaññāpaka dịch vị sắp đặt chỗ ở theo an1.214 (Dabba, sắp đặt chỗ ở); toàn tầng chỗ ở có 373 lần, chỗ ngồi nằm 51 lần, chỗ nằm ngồi 5 lần, sắp đặt chỗ ở 7 lần; Senāsanadāyaka ở tha-ap100 dùng chỗ ngồi nằm. (17) 29.1 đến 29.4 và 30.1 đến 31.4 dịch Pāli đúng thứ tự: leo lên núi đá bằng thang rồi làm đổ thang, và lời khuyên của vị trưởng lão; 30.3 Saddhātidullabhā laddhā dịch đức tin cực kỳ khó có, nay đã có được; 31.1 khaṇātītā dịch những ai đã bỏ lỡ cơ hội; 31.4 mune mataṁ dịch giáo pháp của bậc Mâu-ni.
