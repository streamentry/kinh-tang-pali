  Không khoá nào của 6 bài `ja` này có `…pe…` ở Pāli (đã kiểm 246/246 khoá), nên không có dấu lược nào để giữ và không chỗ nào bịa dấu lược che chỗ thiếu.
  Pāli mở/đóng ở từng câu kệ: 1.1/1.4, 2.1/2.4, 3.1/3.4, 4.1/4.4, 5.1/5.4, 6.1/6.4, 7.1/7.4, 8.1/8.4, 9.1/9.4; bản Việt giữ đúng chín cặp đó.
  Bản này là **Haritaca**, bài thứ năm của `Gijjhavagga` trong `Navakanipāta`.
  Pāli trùng nguyên văn trong tầng đã có: 1 khoá (`:0.1`, **dùng lại nguyên văn**: 390/406 tệp ghi *Jātaka*). Ngoài ra `:8.4` `Checchaṁ rāgaṁ sabandhanaṁ` có **cùng dãy từ** với `ja433:8.4` (khác đúng dấu `”` vì lời thoại của bài này đóng ở `:8.4` còn của `ja433` đóng ở `:9.4`), nên tôi dùng **cùng một câu Việt** cho cả hai: *cắt bỏ tham dục cùng mọi ràng buộc*. `:8.3` thì **không** trùng (`Tesaṁ` của bài này vs `Tassa` của `ja433`) nên dịch khác: *Hãy tìm gốc rễ của chúng* / *của điều ấy*.
  **Đây là bài khó nhất của lát, vì không có bản Anh nào để đối chiếu và nhiều câu kệ bị hiểu sai.** Bất định đã ghi, không bịa: (1) `:5.1` `Arahā sīlasampanno` — `Arahā` có thể là tính từ “vô nhiễm/thanh tịnh” ứng với `suddho` ở câu kế, cũng có thể là tên riêng (biến thể của thần `Araha`/mặt trời, và `hārito` = “xanh/ vàng” là tên của bậc xanh trong chính bài). Tôi dịch theo nghĩa tính từ *Vô nhiễm*; nếu đó là tên riêng thì phải sửa thành tên. (2) `:2.4` `mohaneyyesu mucchito` — `mohaneyya` vừa là “dễ bị mê hoặc” vừa là “đáng chê”, nên tôi dịch *bị mê hoặc giữa những kẻ dễ bị mê hoặc*; cách đọc khác là *đang mê muội giữa những kẻ đáng chê*. (3) `:3.1`–`:3.2` `Adu paññā kimatthiyā, nipuṇā sādhucintinī` — hai vế có vẻ là một câu hỏi (“Trí tuệ thì để làm gì, bậc tinh tế suy nghĩ cẩn trọng thì để làm gì?”) nhưng Pāli không có dấu chấm; tôi nối liền và đặt dấu hỏi ở cuối vế sau. (4) `:6.1`–`:6.2` `Medhāvīnampi hiṁsanti, isiṁ dhammaguṇe rataṁ` — hai vế độc lập, không có nối từ; tôi dịch thành hai vế độc lập, không gộp thành một mệnh đề.
  Thuật ngữ theo tiền lệ đếm được: `muni` → bậc tu sĩ (khớp `khaṇa` ở `mil5.4.8`; có 21 nơi dùng *tu sĩ* trong tầng), `brāhmaṇa`/`brahme` → bà-la-môn (`ja402:1.4`, `ja356:4.3`, `ja268:2.1`), `rāga/dosa/mada/moha` → tham/sân/mạn/mê (chuỗi này đã có ở `mn7.11`), `brahmaloka` → cõi trời Phạm thiên (chuỗi *Phạm thiên* có 0 nơi nên tôi ghép từ *cõi trời Phạm thiên*, giữ đúng `brahmaloka` chứ không rút thành “thiên đàng”).
  Lỗi bắt được ở lượt review đối kháng, đã sửa: (1) `:9.4` bản nháp dịch `brahmalokūpago` là *trở thành bậc đạt tới* — “bậc đạt tới” rối và lệch nghĩa, đã sửa thành *trở thành người đạt tới*; (2) `:1.1` bản nháp viết *bậc bà-la-môn lớn* thừa chữ *bậc*, đã sửa thành *hỡi bà-la-môn lớn*.
