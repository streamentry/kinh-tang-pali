notes: |-
  **Phạm vi: đủ 186/186 khoá của cnd15, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Jatukaṇṇi (Pārāyana, câu hỏi thứ mười một), tức bài kệ `snp5.12`. Cấu trúc như `cnd6`, `cnd12`, `cnd13`, `cnd14`: dẫn từng đoạn kệ, giải từng cụm, rồi nhắc lại cả đoạn kệ (kệ in đậm ở `1`, `10`, `17`, `23`, `29`; nhắc lại trong ngoặc kép ở `9`, `16`, `22`, `28`, `33`; khối `3` là kệ trích từ `snp3.6` để giảng chữ *vīra*). Pāli có 75 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 19 khoá chứa `…pe…` (đều thành đúng một `…`), 0 khoá có `…` trần, 0 khoá có `(…)`. Pāli `4.12` viết `vīra amakāmakāmiṁ`, trong khi `1.1`, `2.1`, `4.2` viết `akāmakāmiṁ`/`akāmakāmin`: coi là biến thể chính tả của cùng một cụm, dịch như nhau.

  **Cách trình bày lemma** theo `cnd6`/`cnd12`/`cnd13`/`cnd14`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Giữ nguyên chữ Pāli ở hai chỗ vì lời giải nói về chính hình thức của từ ấy: `Iccā` ở `5.2`, `5.3` (như `cnd6:3.3`, `cnd12:2.4`–`2.5`, `cnd13:2.4`–`2.5`) và `Bhūri` ở `13.3` (`bhūri vuccati pathavī`, chữ Việt không giữ được phép giải từ). Các khoá `8.2`, `11.2` (Pāli không có `metaṁ`) viết *lời xưng hô tôn kính …* không có *đây là*; `18.11` (Pāli có `metaṁ`) viết *đây là lời xưng hô tôn kính …* đúng như `cnd6:12.2`, `cnd13:9.3`, `cnd14:16.10`.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `cnd15`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; tệp `cnd15_translation-en-sujato.json` không tồn tại, chỉ có tệp tên `cnd-name` (nhãn tác phẩm, không phải văn bản kinh). Lớp `english-project` không có `cnd15`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **65** khoá (71 nếu tính cả thẻ); Sujato phủ 0/65 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/65, `vietnamese-current` 0/65. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp5.12` (bài kệ trùng Pāli) đã được đọc để kiểm cách parse các dòng kệ, nhưng đó là bản của **bài khác** nên không tính là đối chiếu English của cnd15; chứng cứ độc lập còn lại là các bản đã dịch của `snp5.12`, `snp3.6`, `snp4.15`, `dhp367` và công thức chú giải ở `cnd6`, `cnd12`, `cnd13`, `cnd14`, `cnd20`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm) trùng với khoá đã dịch ngoài bài này: so khớp nguyên dấu câu 71 khoá, dùng lại 61, khác 10; so khớp sau khi bỏ dấu câu và chữ hoa/thường 93 khoá, dùng lại 76, khác 17. Các khoá Pāli trùng mà bản Việt khác, kèm lý do:
  - `1.3`, `6.6`, `9.3` (trùng `snp5.12:1.3` *con đã đến hỏi bậc đã vượt qua dòng lũ, không còn ham muốn, đã đến đích;*): bỏ *đã đến đích* vì Pāli không có căn cứ cho cụm ấy (`āgamaṁ` = con đã đến; lời giải `6.5` giảng `āgamhā` = chúng con đã đến, đã gặp gỡ cùng Ngài), và thêm *bậc* trước *không còn ham muốn* để ăn khớp lời giải `6.5`. Bản Anh của `snp5.12:1.3` cũng không có ý *đến đích*.
  - `3.3` (trùng `snp3.6:33.3` *vị ấy là bậc dũng mãnh, tinh cần,*): `vīriyavā` dịch *có tinh tấn* vì lời giải `2.5` mở bằng `Vīriyavāti vīro` và `cnd6:11.10` dịch `vīriyena vīriyavāti` là *có tinh tấn*. Toàn tầng 10 khoá chứa `vīriyavā`: tinh tấn 4, có tinh tấn 2, dũng mãnh 2.
  - `7.7` (trùng `dn28:3.3` *bốn như ý túc … Thánh đạo tám ngành*): dùng *thần túc*, *Thánh đạo tám chi phần* theo `cnd12:10.4`, `cnd20:6.2` (và `cnd13:17.6` *tài sản thần túc*): trong nhóm `cnd` 3/3 khoá dùng *thần túc* và 0 khoá *như ý túc*. Toàn tầng, `iddhipāda`: *như ý túc* 47, *thần túc* 28 (81 khoá); `ariyo aṭṭhaṅgiko maggo`: *tám ngành* 183, *tám chi* 14, *tám chi phần* 6.
  - `17.2`, `22.2`, `18.12` (Pāli `(jatukaṇṇīti bhagavā)` trùng `snp5.12:3.2` *(Đức Thế Tôn trả lời:)*): bản ấy bỏ hô ngữ, trong khi lời giải `18.10`–`18.12` giảng đó là tên dòng họ mà Đức Thế Tôn gọi vị Bà-la-môn; theo `cnd13:13.2`, `cnd14:16.8` viết *Này Jatukaṇṇi, Đức Thế Tôn nói*.
  - `23.2`, `25.3`, `28.2` (trùng `snp5.12:4.2` *chớ để có gì còn lại cho ngươi;*): `kiñcana` dịch *sở hữu* ở mọi chỗ trong bài, vì lời giải `21.1`, `25.1` liệt kê cùng bảy loại `kiñcana` (như `cnd13:24.2`, `cnd14:22.3`: *sở hữu do tham, …*) và chính `snp5.12:3.5` cũng dịch *chút sở hữu gì*. Toàn tầng 49 khoá chứa `kiñcana`: *sở hữu* 16, *dính mắc* 4, *gì của* 1, *còn lại* 1.
  - `29.1`, `29.2`, `33.1`, `33.2` (trùng `snp5.12:5.1`, `5.2`): hai dòng của bản ấy bị đảo thứ tự so với Pāli (Việt `5.1` dịch `vītagedhassa brāhmaṇa`, Việt `5.2` dịch `sabbaso nāmarūpasmiṁ`), nên không dùng lại theo khoá; giữ đúng thứ tự Pāli. `sabbaso` → *hoàn toàn* theo `dhp367:1` (*Vị nào hoàn toàn đối với danh sắc*) và lời giải `30.2`; `snp4.15:16.1` *Trong toàn bộ danh sắc* khác cú pháp (`yassa natthi mamāyitaṁ`).
  - `29.4`, `32.3`, `33.4` (`33.4` trùng `snp5.12:5.4` *khiến họ đi vào quyền lực của Thần chết*): dịch *do chúng mà người ấy có thể đi vào quyền lực của Thần chết* để khớp lời giải `32.1` (`yehi āsavehi … vasaṁ gaccheyya`) và chủ ngữ số ít *người ấy* của `29.3`.
  - `28.4`: khớp nguyên dấu câu với `sn8.4:6.4` (*ông sẽ sống an tịnh*), nhưng dùng `snp5.12:4.4` (*ngươi sẽ sống an tịnh*) vì cùng người nói, cùng người nghe.
  Các khoá còn lại dùng lại nguyên văn, trong đó có kệ `snp5.12:1.1`, `1.2`, `1.4`, `1.5`, `2.1`–`2.5`, `3.1`, `3.3`–`3.5`, `4.1`, `4.3`, `4.4`, `5.3` (bỏ nháy mở/đóng ở chỗ Pāli của khoá không có), và công thức chú giải từ `cnd6`, `cnd12`, `cnd13`, `cnd14`, `cnd20`: `4.3`–`4.6`, `5.2`, `5.3`, `7.3`, `7.4`, `8.6`, `14.3`, `18.7`, `18.11`, `21.4`, `30.4`, `30.6`, `34.1`, `34.2`.

  **Trong chính bài:** 24 nhóm Pāli trùng nguyên văn (34 cặp), cả 24 nhóm có bản Việt giống hệt. Đo thêm bằng cách bỏ dấu câu và chữ hoa/thường: 32 nhóm (70 cặp), 0 nhóm khác. Khoá `1`–`9`, `10`–`16`, `17`–`22`, `23`–`28`, `29`–`33` lặp kệ hai lần với cùng bản Việt; khác nhau chỉ ở dấu nháy đầu/cuối theo Pāli từng khoá.

  **Thuật ngữ, kèm số đếm (phạm vi tầng; nêu cả hai số khi phạm vi gần nhất cho đa số khác).**
  - Chuỗi `pajaha vinodehi byantīkarohi anabhāvaṁ gamehi` → *hãy từ bỏ, hãy xua tan, hãy làm chấm dứt, hãy làm cho không còn hiện hữu*, theo `cnd20:16.3`, `cnd20:28.3` (và `cnd12:18.3` *sự xua tan*, `iti110:6.2` *làm cho nó không hiện hữu*). Toàn tầng: `vinodeti` 57 khoá chứa (*trừ diệt* 27, *xua tan* 19, *diệt trừ* 10); `byantīkaroti` 51 khoá (*trừ diệt* 26, *chấm dứt* 8). Chọn theo nhóm `cnd` (Niddesa), không theo đa số toàn tầng, vì ở đây bốn động từ đứng liền nhau và cần bốn chữ khác nhau.
  - `abhibhuyya abhibhavitvā ajjhottharitvā pariyādiyitvā madditvā` → *chế ngự, khuất phục, áp đảo, làm cạn kiệt, nghiền nát* theo `cnd14:30.4` (cùng chuỗi Pāli; không có tiền lệ nào khác cho cả chuỗi). `carati viharati iriyati vatteti pāleti yapeti yāpeti` → *sống, trú, vận hành, tiếp diễn, duy trì, nuôi dưỡng, kéo dài* theo `cnd14:30.4`; riêng dòng kệ `iriyati` ở `10.1` giữ *đang du hành* vì dùng lại nguyên văn `snp5.12:2.1`.
  - Chuỗi tám/bảy mục `akāmo nikkāmo cattakāmo vantakāmo muttakāmo pahīnakāmo paṭinissaṭṭhakāmo vītarāgo vigatarāgo cattarāgo …` → *không ham muốn, không còn dục* (`nikkāmo` theo `snp5.19:1.5`, `cnd4:1.5`), *xả, nhả, thoát, đoạn, từ bỏ*, *ly tham, đã hết tham* (`vigatarāga` theo `sn22.2:9.10`: *đã hết tham*): theo chuỗi con của `cnd6:13.3` (*ly tham, xả tham, nhả tham, thoát tham, đoạn tham, từ bỏ tham*), 1 khoá cùng chuỗi con; `nicchāto nibbuto sītibhūto sukhappaṭisaṁvedī brahmabhūtena attanā` → *không còn đói khát, tịch tịnh, mát mẻ, cảm nhận an lạc, … tự thân đã trở thành Phạm* theo `mn51:5.10` và `cnd6:13.3`.
  - `ajjhosita`/`ajjhosāna` → *chấp chặt* (75 khoá chứa: *chấp thủ* 18, *bám víu* 8, *bám chấp* 8, *chấp mắc* 4, *chấp chặt* 4; nhưng công thức `abhinandati abhivadati ajjhosāya tiṭṭhati` 32 khoá: *hoan hỷ* 31, *tán thán* 15, *chấp chặt* 11; và `cnd14` dùng *chấp chặt*). `abhivadana` → *tán thán* (119 khoá chứa `abhivad-`: *tán thán* 16, *chào đón* 10, *tán dương* 10). `abhinivesa`/`abhiniviṭṭha` → *chấp trước* (30 khoá: *chấp trước* 15, *chấp thủ* 8). `parāmāsa`/`parāmaṭṭha` → *bám víu* (154 khoá: *chấp thủ* 40, *nắm giữ* 29, *cố chấp* 21, *chấp chặt* 20, *chấp trước* 18, *bám víu* 5): không theo đa số vì *chấp thủ* trùng thuật ngữ `upādāna`, *nắm giữ* đã dùng cho `gahati`, và ba từ `parāmaṭṭha`/`abhiniviṭṭha`/`ajjhosita` liền nhau cần ba chữ khác nhau. `adhimutta` → *nghiêng hẳn về* theo `cnd14` (xem bất định).
  - `kiñcana` → *sở hữu* (xem trên). `gedha` → *lòng tham* (`snp5.12:3.1`), `rāga` → *tham*: hai chữ khác nhau để giữ hai thuật ngữ khác nhau trong chuỗi `30.7`. `taṇhā` → *tham ái* (theo `cnd14`, `cnd6`).
  - `vatthukāma`/`kilesakāma` → *vật dục*/*phiền não dục* (`cnd6:11.3`–`11.5`, `cnd13:8.4`–`8.6`: 3 khoá cùng Pāli). `uddānato dve kāmā` → *nói tóm lược có hai loại dục* (3 khoá). `santipada` → *trạng thái an tịnh* (`snp5.12:1.4`); chuỗi `tāṇapadaṁ leṇapadaṁ saraṇapadaṁ abhayapadaṁ` theo `cnd12:19.1` (*trạng thái che chở, nương náu, nương tựa, không sợ hãi*); chín động từ `brūhi ācikkhāhi … pakāsehi` theo `cnd12:10.4`, `cnd20:21.3`. `nibbānaṁ amataṁ` → *Niết-bàn bất tử* (8 khoá `cnd12`, `cnd14`; `cnd20` viết *bất tử, Niết-bàn*, 2 khoá). `khemato tāṇato leṇato saraṇato saraṇībhūtato abhayato accutato amatato nibbānato` → 9 mục *an ổn, chốn che chở, nơi nương náu, nơi nương tựa, đã trở thành nơi nương tựa, không sợ hãi, không biến hoại, bất tử, Niết-bàn*. `jānitvā tulayitvā tīrayitvā vibhāvayitvā vibhūtaṁ katvā` → *đã … đã cân nhắc, đã thẩm xét, đã làm cho rõ ràng, đã làm cho sáng tỏ* theo `cnd6:5.1`, `cnd6:14.3` (15 khoá).
  - Dụ mặt trời `12.3`: `abhivihacca` → *phá tan* (`iti27:4.1`: *phá tan mọi bóng tối trong không gian*; các bản `sn`, `an` viết *xua tan*), `vidhamitvā` → *xua tan* (`mil7.4.3:5.2`). `tejī` → *chói sáng* (theo kệ `snp5.12:2.2`).
  - `sahajanetta` → *bậc tự nhiên có mắt sáng* (`snp5.12:1.4`); `netta` ở `7.10`, `7.11` → *con mắt*, `jinabhāva` → *tư cách bậc Chiến Thắng* (0 tiền lệ). `apubbaṁ acarimaṁ ekasmiṁ khaṇe` → *trong cùng một khoảnh khắc, không trước không sau* (13 khoá chứa `apubbaṁ acarimaṁ`, nghĩa khác nhau tuỳ ngữ cảnh: `mil3.2.1:3.10` *không có phần đầu lẫn phần cuối*, `mil6.1.1:1.2` *vào thời điểm này và là cuối cùng*; ở đây `ekasmiṁ khaṇe` xác định nghĩa đồng thời).
  - `sabbena sabbaṁ sabbathā sabbaṁ asesaṁ nissesaṁ` → *toàn bộ, tất cả, mọi phương diện, hết thảy, không sót, không dư* (6 chữ Pāli = 6 chữ Việt; bốn chữ đầu theo `mil3.3.3:1.7`).
  - `maccu` → *Thần chết* (`snp5.12:5.4`) và `maraṇa` → *cái chết*, `mārapakkha` → *phe Ma vương* ở `32.1`: ba mục khác nhau nên giữ ba chữ khác nhau.

  **Số Pāli, kèm phép tính.** `dve kāmā` (`4.3`, `11.3`, `18.2`) = 2: *hai loại dục*; `cattāro arūpino khandhā` (`30.3`) = 4: *bốn uẩn vô sắc*; `cattāro mahābhūtā` và `catunnaṁ mahābhūtānaṁ` (`30.4`) = 4 và 4: *bốn đại … bốn đại*; `cattāro āsavā` (`31.2`) = 4 và Pāli liệt kê 4 (dục, hữu, kiến, vô minh), Việt 4; `cattāro satipaṭṭhānā cattāro sammappadhānā cattāro iddhipādā pañcindriyāni pañca balāni satta bojjhaṅgā ariyo aṭṭhaṅgiko maggo` (`7.7`, `14.2`, `19.2`) = 4, 4, 4, 5, 5, 7, 8: *bốn niệm xứ, bốn chánh cần, bốn thần túc, năm căn, năm lực, bảy giác chi, Thánh đạo tám chi phần*; `ekena ākārena` (`7.2`) = *một cách*; `ekasmiṁ khaṇe` (`7.11`) = *một khoảnh khắc*; `ekādasamo` (`34.3`) = thứ mười một (*thứ mười một*, khớp `0.4` = 11). Đếm mục trong các chuỗi: tám danh từ `santipadaṁ … nibbānapadaṁ` ở `7.9` = 8 Việt; chín động từ ở `7.9` = 9; tám động từ ở `14.3` = 8; tám động từ `jāneyyaṁ … sacchikareyyaṁ` ở `14.4` = 8; năm mục `puṭṭhuṁ pucchituṁ yācituṁ ajjhesituṁ pasādetuṁ` ở `6.4` = 5 Việt (*để hỏi, để thưa hỏi, để cầu xin, để thỉnh cầu, để làm cho hài lòng*, sau lemma *Để hỏi*); bảy mục `akāmo … paṭinissaṭṭhakāmo` và bảy mục `vītarāgo … paṭinissaṭṭharāgo` ở `4.11`, `6.5`, `30.7` = 7 + 7 Việt; năm cách thực hành, năm mục (giới … chánh niệm tỉnh giác), bảy nhóm đạo phẩm, chín mục `khemato … nibbānato`, năm động từ `daṭṭhuṁ … vibhūtaṁ katvā` ở `19.2` = 5 + 5 + 7 + 9 + 5 Việt; chín động từ ở `24.1`, `24.3` (`sosehi … gamehi`) = 9 Việt; năm + bốn ở `25.2` = 5 + 4 Việt; sáu + bốn ở `26.2`, `26.3` = 6 + 6 + 4 Việt; tám danh từ + năm tính từ + bảy động từ ở `27.2` = 8 + 5 + 7 Việt; bảy loại `kiñcana` ở `21.1`, `25.1` = 7 Việt; năm tính từ `vīro` dạng `-ti vīro` và bảy tính từ sau ở `2.5` = 5 + 7 Việt; bốn tính từ + sáu tính từ trí tuệ ở `13.1`, `13.2` = 4 + 6 Việt. Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi`, `sahassa`; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `4.9` `kāmakāmino rāgarāgino saññāsaññino` → *những người ham muốn dục, những người nhuốm tham theo tham, những người có tưởng theo tưởng*: 0 tiền lệ cho `rāgarāgin` và `saññāsaññin`; dịch theo cấu tạo lặp của từ ghép, chưa chắc đây là nghĩa *đắm theo* hay *nhuốm bởi*.
  2. `13.1` `chatukkapañño` → *trí tuệ tồi tệ*: 0 tiền lệ, nghĩa của `chatukka` chưa phân xử được; dịch là mục thứ tư của chuỗi bốn tính từ chỉ trí kém (`parittapañño omakapañño lāmakapañño chatukkapañño`).
  3. `20.2` `adhimutta` → *nghiêng hẳn về*: theo `cnd14` (kết ở *về*, không có tân ngữ, đúng như Pāli không có tân ngữ); 0 tiền lệ chắc chắn cho nghĩa này trong chuỗi `gahitaṁ parāmaṭṭhaṁ abhiniviṭṭhaṁ ajjhositaṁ adhimuttaṁ`.
  4. `7.11` `apubbaṁ acarimaṁ` dịch *không trước không sau* (đồng thời) và `jinabhāva` dịch *tư cách bậc Chiến Thắng*: không có tiền lệ.
  5. `12.3` đoạn dụ mặt trời bị lược ở `…pe…` giữa hai khoá: `sabbaṁ abhisaṅkhārasamudayaṁ` là tân ngữ của động từ bị lược nên Việt để *toàn bộ sự tập khởi của các hành tạo tác …* không thêm *đối với* hay động từ, rồi `12.4` nối tiếp bằng *bóng tối phiền não, sự tăm tối của vô minh, sau khi xua tan*; cấu trúc này chưa chắc chắn vì phần bị lược không có trong Pāli ghim.
  6. `25.1` `pacchā vuccati anāgate saṅkhāre ārabbha rāgakiñcanaṁ …`: đọc là *về sau* được nói là *liên quan đến các hành trong vị lai*, rồi liệt kê bảy loại sở hữu; dấu chấm phẩy nối hai vế là của người dịch, Pāli không có. `26.1` cùng cấu trúc.
  7. `2.5` `pahū`, `visavī`, `alamatta` → *có khả năng, có quyền năng, đủ sức* theo `cnd13:17.8` (cùng chuỗi); 0 tiền lệ ngoài khoá ấy.
  8. `6.4` `puṭṭhuṁ` và `pucchituṁ` đều nghĩa *hỏi*: dịch *để hỏi*, *để thưa hỏi* để giữ đủ năm mục; `pasādetuṁ` → *để làm cho hài lòng* (`mn67:10.1` *làm Đức Phật vui lòng*).
  9. `6.5` `āgamhā āgatamhā …` là ngôi thứ nhất số nhiều, dịch *chúng con*, trong khi kệ `1.3` là *con* (số ít); giữ đúng ngôi của từng khoá.
  10. Lỗi ngoài lát, báo chứ không sửa: `snp5.12:5.1` và `snp5.12:5.2` bị đảo thứ tự dịch so với Pāli (Việt `5.1` = *Đối với người đã ly tham, thưa Bà-la-môn,* dịch `vītagedhassa brāhmaṇa` đứng ở Pāli `5.2`; Việt `5.2` = *đối với toàn bộ danh sắc,* dịch `sabbaso nāmarūpasmiṁ` đứng ở Pāli `5.1`). Cùng ảnh hưởng: `snp5.12:1.3` có *đã đến đích* không có căn cứ trong Pāli (xem `1.3` ở trên).

