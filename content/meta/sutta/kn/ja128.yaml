notes: |-
  Đã đọc hết Pāli qua v4/p4.txt. Tại commit đã ghim không có tệp Anh Sujato cho bài này (0/9 khoá) và tầng Việt hiện hành chỉ có Pháp Cú nên không có bản Hòa thượng Thích Minh Châu để đối chiếu — bản dịch đứng hoàn toàn trên Pāli root. Mọi segment Pāli đều dưới 40 ký tự nên không có segment nội dung theo ngưỡng coverage.
  Tiền lệ (đếm trong tầng Việt dự án): khung tiêu đề như ja1; biḷāra → mèo theo Kinh Con Mèo của bài anh em ja137 cùng đợt; dhamma → Pháp; dhaja → cờ theo lấy Pháp và làm cờ hiệu (4–26); nigūḷha → che giấu (41); pāpa → ác theo làm điều ác (57); vissāseti → khiến tin theo khiến tin (13); bhūta → chúng sinh; vata → hạnh; nāma → gọi là; colophon Kinh ... thứ tám không phẩy.
  0 tiền lệ cho hợp từ, đặt mới có lý do: Hạnh Mèo (ghép hạnh và mèo, phân biệt với Kinh Con Mèo ja137 vì đây là chuyện hạnh giả trá chứ không phải chuyện con mèo).
  Triangulation 7.5 vì chỉ có Pāli root, không có bản Anh hay bản Việt nào để đối chiếu.
