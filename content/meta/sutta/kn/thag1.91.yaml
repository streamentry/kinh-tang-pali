notes: |-
  Khung bốn khối tiêu đề giữ y hệt các bài thag1 đã có: 0.1 giữ Pāli kèm số,
  0.2 Bộ Một Bài Kinh (258 bài), 0.3 tên phẩm theo thứ tự, 0.4 Kinh Kệ Của Trưởng Lão
  với chữ Lão hoa (89 bài; bốn bài lẻ dùng lão thường). Dòng kết 1.5 giữ HAI dấu lược
  như Pāli (BRIEF_VI3 §10.1, không mở rộng), mở nháy kép ở 1.1 và đóng ở 1.4 y hệt Pāli.
  ĐÃ SỬA LỖI NGHĨA NẶNG NHẤT CỦA LÁT Ở 1.1-1.2. Bản dịch trước đây viết Hỡi người
  yêu quý, không bằng trăm lần / vàng ròng mà hôm nay tôi đã ăn. Cả hai vế đó sai, và
  notes cũ của chính bài này đã ghi lại lý do sai: cho rằng mataṁ là từ xưng hô, cho
  rằng satarasaṁ là gấp trăm lần, và cho rằng Sudhannaṁ là vàng ròng. Pāli nói
  không có chỗ nào thế. mataṁ là dạng quá khứ của mā, nghĩa là ăn; Sujato đọc đúng là
  What I consumed today. satarasaṁ là sata, trăm, cộng rasa, vị, nên là trăm vị, chứ
  không phải trăm lần; Sudhannaṁ là ngon lành, cũng không phải vàng ròng. Kinh nói về
  món ăn, nên một bản dịch đặt vàng vào đó là thêm nội dung không nguồn nào chứng thực.
  Tôi sửa thành Không gì sánh được với món ăn trăm vị / ngon lành mà hôm nay tôi đã
  nếm. Cả satarasaṁ và Sudhannaṁ chỉ xuất hiện đúng một lần trong toàn bộ Pāli đã
  ghim, tức chỉ ở chính bài này, nên không có parallel nào để đối chiếu; tôi dựa vào
  Pāli và vào Sujato.
  BẢN ANH ĐỐI CHIẾU ĐƯỢC Ở ĐÂY, VÀ NÓ ĐÚNG. Sujato dịch cả cặp kệ là What I consumed
  today is considered better than delicious grain of a hundred flavors, the Dhamma
  taught by the Buddha, Gotama of infinite vision. Câu đảo chiều và đặt mốc so sánh
  ngược ở đó, nhưng ba chữ consumed, delicious, a hundred flavors khớp Pāli từng chữ,
  nên tôi theo Sujato ở đúng ba chữ đó và tự xử lý phần đảo chiều.
  Aparimitadassī không có tiền lệ trong tầng, tôi đặt mới tầm nhìn vô hạn; vô hạn có 40
  chỗ trong tầng. desito dhammo dịch đã giảng dạy. gotamena giữ nguyên Gotama vì là tên
  Đức Phật và Pāli viết thường ở giữa câu.

  Kỹ thuật: 9/9 khoá, không rỗng, thứ tự khớp Pāli, NFC, số dấu lược bằng Pāli từng
  khoá, nháy kép cân trên cả bài, không còn (…). save_vi sạch, chạy lại hai lần
  idempotent. Vì mọi khoá Pāli của Trưởng Lão ngắn hơn 40 ký tự nên cần trong kiểm()
  rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá bằng script riêng. Không
  chạy npm run validate|test|check|build (lát này cấm) nên technical_integrity 9.5.
  Tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên không có bản Hòa thượng
  Thích Minh Châu cho Trưởng Lão; bản Anh Sujato có mặt và tôi đã đọc ở tất cả tám bài
  này. Ô English trống ở dòng kết không phải sự đồng thuận, mà là chỗ Pāli phải tự đứng
  vững.
