notes: |-
  **Một blocker, bài phải ở `draft`.** Không sửa bản dịch.
  
  **Chi tiết lỗi.** `mataṁ` (không phải `mātā` = mẹ, cũng không phải `mata` = bị giết trong mệnh lệnh `maṁ mataṁ`) là danh từ trung tính nghĩa **thịt / thức ăn**. Tôi đã đối chiếu bốn nguồn trước khi kết luận: (1) Sujato đọc `mataṁ satarasaṁ Sudhannaṁ` là *delicious grain of a hundred flavors* — tức cũng là thức ăn; (2) từ điển Pāli số: `sudhanna` = "ambrosial food, heavenly meal", tức `mataṁ Sudhannaṁ` = "thức ăn rực rỡ"; (3) vế kệ kế tiếp `yaṁ mayajja paribhuttaṁ` = "thứ tôi đã ăn hôm nay" — `paribhutta` chỉ có nghĩa "đã ăn" khi đi với danh từ thức ăn; (4) trong chính snapshot đã ghim, `mataṁ` không xuất hiện ở đâu khác trong `kn` để mở ra cách đọc thứ hai.
  
  Vế `1.1` của bản dịch là *Hỡi người yêu quý, không bằng trăm lần*. Cụm *Hỡi người yêu quý* không có tiền thân Pāli. Đây là blocker loại "bịa nội dung / đưa lời giải thích không có trong kinh vào canonical scripture", không phải chỉ là lựa chọn văn phong — vì nó **thay thế** một danh từ có nghĩa, chứ không thêm bên cạnh.
  
  **Về `Sudhannaṁ` → *vàng ròng* ở `1.2`.** Cách dịch bám nghĩa sáng (`sudha` = sáng, vàng) nhưng bỏ nghĩa thứ hai trong từ điển (`anna` = thức ăn thần thực). Tôi chấp nhận, nhưng đáng để biên tập cân nhắc; đã trừ nhẹ ở `ambiguity_integrity`.
  
  **Phần còn lại tốt.** `Aparimitadassinā gotamena` → *Gotama tầm nhìn vô hạn* ✓ (`aparimita-dassī` = người thấy không giới hạn, tức Phật). `Buddhena desito dhammo` → *đã giảng dạy* ✓.
  
  **Một điểm về thứ tự ở `1.3`–`1.4`.** Bản dịch đặt *Pháp do Đức Phật, bậc Tôn giả* trước và *Gotama tầm nhìn vô hạn* sau, tức tách vế tính sở của `Aparimitadassinā gotamena`. Pāli vốn đặt danh từ `Gotamena` ở vế trước và `Buddhena` ở vế sau. Cả hai cách đọc đều hiểu được và câu vẫn đúng nghĩa, nhưng bản dịch đã đảo thứ tự — tôi không tính là lỗi vì không mất ý nào, nhưng ghi lại cho biên tập.
  
  **Dấu lược ở `1.5`** (`… Paripuṇṇako thero ….`) giữ nguyên, dạng lõm chữ `o` theo Pāli ✓.
  
  **Tầng Anh** có mặt đủ và chính Sujato cũng báo lỗi này ngay tại khoá `1.1`.
