    - "Hallucination / thêm ý không có trong Pāli tại thag1.91:1.1: Pāli 'Na tathā mataṁ satarasaṁ, Sudhannaṁ yaṁ mayajja paribhuttaṁ' — 'mataṁ' là danh từ 'thịt / thức ăn' đứng cạnh 'Sudhannaṁ' (thức ăn rực rỡ / thần thực). Bản dịch mở đầu bằng 'Hỡi người yêu quý,' — một danh xưng gọi thẳng không có trong Pāli; vế đó không tương ứng với bất cứ từ nào. Hệ quả: semantic unit 'thịt / thức ăn' mất khỏi vế đầu. Sujato đọc cùng hướng ('than delicious grain of a hundred flavors'), tức cũng coi đây là thức ăn, không phải người được gọi."
