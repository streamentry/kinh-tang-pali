notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/tha-ap/tha-ap14_root-pli-ms.json` (61/61 khoá, đủ và đúng thứ tự Pāli). Trước lát này tệp dịch chỉ có đúng một khoá (`15.1`); 60 khoá còn lại được dịch mới từ Pāli, và khoá `15.1` được dựng lại từ Pāli theo nhóm lời kết số nhiều (xem dưới). Bài là Therāpadāna, phẩm Sīhāsaniya, ký sự thứ hai: Trưởng lão Ekatthambhika (người xin được một cây cột từ nhóm cư sĩ đang dựng gian sảnh cho Đức Phật Siddhattha, rồi tự tay dựng cột lên).

  - Tầng tham khảo và coverage English:
    Tầng `english-sujato` tại commit đã ghim không có tệp thân kinh nào của `tha-ap14`: `upstream-manifest` chỉ liệt kê tệp Pāli root của uid này; thư mục `sutta/kn/` của bản Anh chỉ có 9 thư mục con (cp, dhp, iti, ja, kp, snp, thag, thig, ud); tệp duy nhất mang tên tha-ap trong cả tầng là tệp tên (`name/`), không phải thân kinh. Tầng `english-project` chưa có tệp cho uid này; `vietnamese-current` chỉ có Pháp Cú. Coverage English: mẫu số = 1 khoá Pāli có nội dung (`15.1`, 65 ký tự; 60 khoá còn lại đều dưới ngưỡng 40 ký tự), Sujato phủ 0/1, tức 0%. Có entry của bài trong `content/meta/reference-gaps.yaml` (substantiveSegments 1, coverage 0) nhưng đó là chuyện khác và không cứu được `published`. Ba tầng tham khảo đều vắng nên bài giữ `draft` với blocker `noEnglishEditionUpstream`, `triangulation` đặt 7.5 (không quá 8.0). Không có bản English độc lập nào được đối chiếu; những chỗ khó dựa vào Pāli, ngữ cảnh bài và tiền lệ cùng phẩm.
  - Tiêu đề `:0.3`:
    Pāli `Ekatthambhikattheraapadāna` không bắt đầu bằng chữ số nên bỏ số thứ tự (đo trên tầng `tha-ap`: Pāli có số ⇒ Việt có số 134; Pāli không số ⇒ Việt không số 311; Việt thêm số khi Pāli không có: 0). `translationTitle` bằng đúng chuỗi `:0.3` ("Bài Kệ Tuyên Ngôn Về Trưởng Lão Ekatthambhika"). Phe dấu `ti`, đo hai phạm vi: toàn tầng `tha-ap` (khuôn "X Về Trưởng Lão", Pāli không số) Tuyên Ngợ 156 · Tuyên Ngôn 74 · Ký Sự 73 · Tuyên Ngợi 3; phạm vi gần nhất, cùng phẩm Sīhāsaniya, hai bài liền kề (`tha-ap13`, `tha-ap15`) cùng viết Tuyên Ngôn. Hai phạm vi cho hai đa số khác nhau; tôi chọn Tuyên Ngôn (đúng chính tả; phạm vi gần nhất) và để người biên tập phán một lượt cho cả cuốn vì 156 tệp vẫn viết Tuyên Ngợ.
    `0.1` giữ nguyên `Therāpadāna` (433 tệp cùng dạng, so với "Trưởng Lão Ký Sự" 11). `0.2` `Sīhāsaniyavagga` → "Phẩm Sīhāsaniya" (5/5 tiền lệ cùng phẩm). Dòng kết `16.1` → "Ký sự về Trưởng lão Ekatthambhika, thứ hai." theo `tha-ap13` (cùng phẩm) và đúng chữ Pāli (`apadānaṁ`, không có `gāthā`); toàn tầng "Bài Kệ … thứ N" nhiều hơn (khoảng 265 so với 87), nên đây cũng là một chỗ để người biên tập phán. `dutiyaṁ` = 2 = "thứ hai".
  - Lời kết `15.1`:
    Pāli `Itthaṁ sudaṁ āyasmā ekatthambhiko thero imā gāthāyo abhāsitthāti` có `imā gāthāyo` số nhiều và không có lời hô. Khoá này trước đó viết "đã từng nói bài kệ này" (số ít); tôi dùng nhóm đông đảo "đã nói những bài kệ này" (nhóm 407 khoá, so với nhóm 21 khoá số ít đã bị coi là lỗi ở nhiều lát trước), giữ "Tôi nghe như vầy: Tôn giả Trưởng lão …" như 41 khoá cùng công thức. Đây là khoá duy nhất có sẵn trước lát này mà tôi sửa.
  - Số Pāli, tự tính:
    `Pañcapaññāsakappamhi` (9.3) = pañca 5 + paññāsa 50 = 55 ⇒ "năm mươi lăm"; `Ekavīsatikappamhi` (11.1) = eka 1 + vīsati 20 = 21 ⇒ "hai mươi mốt"; `Catunnavutito` (13.1) = catu 4 + navuti 90 = 94 ⇒ "chín mươi bốn" viết "chín mươi tư" (đúng tiền lệ 52+ khoá cùng chuỗi); `Sattabhūmaṁ` = 7 tầng; `catasso` 4; `aṭṭhime` 8; `Chaḷabhiññā` 6; `dutiyaṁ` 2. Không gặp `Tiṁsakappasahassa` hay hapax số nào. Phép đo số tự động chạy sau khi ghi: hiệu chuẩn 9/9 OK, 241 cặp cùng đơn vị để so, 0 lệch (phép này chỉ kiểm 9 từ khoá số đã xác lập, nên 0 lệch không phủ nhận các số tính tay ở trên).
  - Tiền lệ và trùng nguyên văn:
    Dò toàn tầng Khuddaka đã dịch (50.924 cặp Pāli–Việt): 17/61 khoá của bài có Pāli trùng nguyên văn ở bài khác, tổng 2.087 cặp; 1.577 cặp có bản Việt giống hệt bản tôi viết, 510 cặp khác. Dùng lại nguyên văn đa số: `0.1` 433/444, `0.2` 5/5, `8.1` "Nhờ tâm tịnh tín ấy," 19/30, `12.1` 9/13, `12.2` 6/13, `13.1` "Vào chín mươi tư kiếp trước đây," 52/109 (kế đó "Từ chín mươi tư kiếp trước," 17 · "Vào chín mươi tư kiếp trước," 14 · "đại kiếp" 13), `14.1` 448/454, `14.2` 46/56, `14.3` 49/60, `14.4` 418/454. Các chỗ cố ý khác tiền lệ, mỗi chỗ một lý do:
    1. `13.3` `Duggatiṁ nābhijānāmi`: tầng có "Ta không biết mình rơi vào khổ đau," 136 · "Tôi không còn biết đến đọa xứ nào," 81 · "Tôi không còn biết đến khổ xứ," 51 · "Ta không còn biết đến đọa xứ," 46. Tôi chọn dạng 81 vì "mình rơi vào" không có trong Pāli và vì bài này nói "tôi" xuyên suốt; `tha-ap144:3.3` (cùng loại bài) cũng dùng dạng đó.
    2. `3.3` `Añjaliṁ paggahetvāna`: 19 cặp, bản Việt gồm "ta giơ hai tay lễ rồi," 7 · "Chắp hai tay cung kính," 2 · "Chắp đôi bàn tay cung kính," 2 · "Chắp đôi tay cung kính," 2 · "Chắp tay cung kính," 2 · các dạng lẻ khác. Tôi dùng "Chắp hai tay cung kính," (đúng dạng đã có, bỏ đại từ "ta" mà Pāli không có). "Cung kính" là nghĩa vốn có của tư thế `añjali`, không phải chi tiết mới.
    3. `7.3` `Haṭṭho haṭṭhena cittena`: 19 cặp; "Hân hoan với tâm ý tràn đầy hỷ lạc," 7 thêm "tràn đầy hỷ lạc" không có trong Pāli, nên tôi dùng "Hân hoan với tâm hoan hỷ," (5 cặp, dạng nhiều thứ nhì).
    4. `8.3` `Ubbiddhaṁ bhavanaṁ mayhaṁ`: 2 bản trùng dịch "được dựng lên"; `ubbiddha` là tính từ "cao, vút cao", và `8.4` `samuggataṁ` đã nói "nhô cao" nên tôi dịch "Nơi ở của tôi cao vút," rồi "bảy tầng, vươn cao." Bất định nhỏ, xem mục dưới.
    5. `1.2` `mahāpūgagaṇo ahu`: 2 bản trùng ("là đầu đám đông lớn", "có một đại chúng đông đảo"). `mahā-` = lớn, `gaṇa` = nhóm/đoàn; "đại chúng" quen chỉ cộng đồng xuất gia, nên tôi dùng "một đoàn thể lớn" và gọi `gaṇa` là "đoàn thể" nhất quán ở `3.2`, `3.4`, `7.1`.
    6. `9.2` `paricāremahaṁ sadā`: 1 bản trùng "luôn luôn được đàn ca chúc tụng" thêm "đàn ca chúc tụng"; Pāli là động từ ngôi thứ nhất `paricāremi` (tự vui hưởng, được phục vụ), tôi dịch "tôi luôn luôn vui thú;".
    Hai khoá cùng Pāli ngay trong bài mà Việt khác: 0 cặp; một cặp Pāli trùng và Việt cũng giống hệt: `12.4` và `13.4` (`ekatthambhassidaṁ phalaṁ.`) cùng "đây là quả báo của một cây cột." (dùng "quả báo" theo tiền lệ của tầng). `8.4` và `11.4` (`Sattabhūmaṁ samuggataṁ.`) cũng dịch giống nhau. `10.2` (`sattabhūmaṁ samuggataṁ;`) chỉ khác chữ hoa và dấu câu nên Việt chỉ khác dấu câu.
  - Thuật ngữ, đếm được:
    `khattiyo` → "Sát-đế-lợi" (20 cặp cùng cấu tạo `X nāma khattiyo`, trong đó 12 dùng "Sát-đế-lợi", 2 dùng đúng khuôn "có vị Sát-đế-lợi tên X"); `kūṭāgāra` → "lầu gác" (8/11 cặp của chuỗi `Kūṭāgārā sattasatā uḷārā,`); `ekatthambhaṁ` → "một cây cột" (và "một cột duy nhất" ở `10.4` theo `ja465:5.2` cùng chuỗi Pāli); `vimāna` → "thiên cung" (tiền lệ "tòa cung điện" 1 · "thiên cung" 1); `bhavana` → "nơi ở" (2 bản trùng chuỗi `Ubbiddhaṁ bhavanaṁ mayhaṁ,`); `brahāvana` → "đại lâm" (`brahā-` = `mahā`, tiền lệ "đại lâm" cho `mahāvana`); `upāsaka` → "cư sĩ" (đa số trong tầng, "nam cư sĩ" ở một số bài kinh khác); `tathāgata` → "bậc Như Lai" (tầng dùng "Như Lai"). `yojana`, tên riêng (Siddhattha, Yasodhara, Udena, Ekatthambhika) giữ nguyên dạng Pāli.
  - Bất định, đã chọn cách ít giả định nhất, không đưa vào thân kinh:
    + `2.2`, `4.3` `māḷa`: có nghĩa "mái che / gian sảnh dựng trên cột" (một kiểu nhà công cộng); tầng Việt đã dịch `māḷa` ở bài khác là "tấm vải" hay "thảo trường", cả hai không hợp ngữ cảnh một công trình cần cột, nên tôi chọn "gian sảnh" (trung tính), không đoán kiến trúc cụ thể. `10.3` `kūṭāgāravarūpetaṁ` và `10.4` `ekatthambhaṁ manoramaṁ` là hai thuộc tính của `bhavanaṁ` (nơi ở) ở `10.1`; cách tôi nối ("đầy đủ lầu gác tuyệt hảo", "một cột duy nhất, đẹp lòng") theo cú pháp đó.
    + `6.1` `pavecchiṁsu`: động từ hiếm (cho, trao); tôi dịch "đã trao cho tôi cây cột" theo ngữ cảnh (họ ưng thuận và giao cột); trong toàn tầng chỉ có ba khoá khác dùng gốc này (`Sammā dhāraṁ pavecchante,` hai lần và `paramannapavecchanā.`), ngữ cảnh khác hẳn nên không phân xử được bằng tiền lệ.
    + `7.2` `ahāsahaṁ` (≈ `ahāsiṁ ahaṁ`): "tôi mang (cột) đến" theo `5.3` `Āharissāmahaṁ`; nơi mang đến không nêu trong Pāli nên không thêm.
    + `7.4` `paṭhamaṁ ussapesahaṁ`: "trước tiên tôi dựng cột lên"; `paṭhamaṁ` có thể hiểu "trước hết" (trạng từ) hay "cột đầu tiên"; chọn cách ít giả định.
    + `11.2` `udeno nāma khattiyo`: Pāli không có động từ; "có vị Sát-đế-lợi tên Udena" để trung tính, ngữ cảnh `11.3` (`mayhaṁ`) cho thấy chính vị trưởng lão. Không viết "tôi là".
    + `4.2`–`5.4`: lời đáp của nhóm cư sĩ và lời nói của vị trưởng lão không có dấu ngoặc trong Pāli ở các khoá này; bản dịch cũng không thêm dấu ngoặc (nháy kép chỉ ở `1.1` và `14.4` như Pāli).
  - Phép kiểm tự viết, mẫu số rõ:
    1. Tập khoá: Việt 61 = Pāli 61, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
