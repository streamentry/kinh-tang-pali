    3. Pāli trùng nguyên văn trong chính bài: 1 cặp (`12.4`/`13.4`), Việt giống hệt, 0 cặp Việt khác.
    4. Dấu lược: Pāli không có `…pe…`, `…`, `(…)`, `….` ở bài này ⇒ 0/0, phép này không có gì để đo.
    5. Số Pāli: 8 số đã tính ở trên, đều khớp; NFC 61/61; 0 khoá rỗng; 0 khoảng trắng thừa; Pāli lọt sang Việt: chỉ `Therāpadāna` và `Sīhāsaniya` (tên bộ và tên phẩm, theo quy ước tầng). Đã in cặp Pāli↔Việt của cả 61 khoá ra đọc đối kháng.
