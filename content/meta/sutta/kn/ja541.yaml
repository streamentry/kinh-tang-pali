notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja541_root-pli-ms.json` (773/773 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ: bốn dòng tiêu đề `0.1`–`0.4`, 172 bài kệ (`1`–`172`, mỗi bài 4–7 dòng) và dòng kết bài `173.1`; ba khoá `13.1`, `85.1`, `144.1` là `(…)` trần của chính tầng Pāli (dấu lược của bản gốc, như 31/31 khoá Việt có `(…)` đã đo ở các bài khác), nên bản Việt giữ nguyên `(…)` ở đúng ba khoá ấy. Phần văn xuôi khung truyện không nằm trong tầng Pāli đã ghim; người nói được suy từ xưng hô, nháy và mạch của chính các bài kệ. Nội dung chính (suy từ kệ): vua Nimi của xứ Videha bố thí và nghĩ không biết bố thí hay phạm hạnh có quả lớn hơn (`1`–`2`); Sakka hiện ra và đáp rằng phạm hạnh bậc cao thì thanh tịnh, kể các bậc khổ hạnh và những vị vua tế lễ xưa, rồi trở về trời (`3`–`21`); Nimi kể lại cho dân chúng (`22`–`24`); Mātali, người đánh xe của chư thiên, đến mời vua lên cỗ xe cõi trời, và vua chọn đi xem cả cõi ác lẫn cõi lành (`25`–`31`); qua sông Vetaraṇī, vua thấy mười lăm cảnh địa ngục, mỗi cảnh Nimi hỏi một nghiệp ác, Mātali đáp (`32`–`84`); rồi các cung điện của người làm phước (`85`–`146`); Mātali kể các ngọn núi, cổng Citrakūṭa, hội trường Sudhammā (`147`–`164`); Sakka mời vua ở lại trời, Nimi từ chối vì phước phải do chính mình tạo, trở lại làm việc thiện giữa loài người (`165`–`172`).
  - Tầng tham khảo:
    Tầng English của Sujato không có ja541 (ja chỉ có 83 tệp: ja1–79, ja126, ja159, ja466, ja534; đây là not-published-upstream, không phải not-synced); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Tiền lệ Việt trong tầng do cùng một nhóm dịch, nên không phải đối chiếu độc lập; không dùng bản tóm lược hay bản dịch ngoài tầng đã ghim làm câu chữ hay đối chiếu. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
