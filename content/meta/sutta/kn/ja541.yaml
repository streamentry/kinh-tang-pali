    + `72.2`, `80.4` `Sakehi kammehi purakkhatassa`: `purakkhata` đọc "có chính nghiệp của mình đi trước" (tầng chưa có tiền lệ gần). `73.2` `dujaccā`: hình thái hiếm, đọc "xuất thân xấu kém" (`du` + `jacca`, đối với `ajacca` ở `19.1`); chưa phân xử được vì `76.1` `kolitthiyāyo` nói họ là phụ nữ gia tộc, hai chỗ có vẻ trái nhau. `76.3` `dittarūpā`: "sắc đẹp rực rỡ"; `76.5` `ramāpayitvā`: "làm cho vui thích" (không rõ làm cho ai).
