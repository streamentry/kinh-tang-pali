    + `86.1`–`86.4` nằm trong lời Mātali (nháy mở `84.1`, đóng `86.4`); `85.1` là `(…)` trần nên không biết lời nào bị lược. `89.1`–`89.4` `Bīraṇī`, `āmāyadāsī`: "nữ tỳ trong nhà của một bà-la-môn" (chưa có tiền lệ cho `āmāya-`); `sakimābhinandī` đọc `sakiṁ` là `sakaṁ` ("của mình"): "đón như người mẹ đón chính con mình".
