    + `15.2` `isi kālapurakkhato`: đọc `Kālapurakkhata` là tên riêng; cũng có thể là "vị ẩn sĩ được thời gian đặt ở phía trước". `16.3` `naḷaggivaṇṇā`: "màu lửa lau sậy". `17.1`–`17.2` `parūḷhakacchā tagarā, rūḷhakacchā vanā nagā`: `kaccha` đọc là bụi rậm; chưa có tiền lệ.
