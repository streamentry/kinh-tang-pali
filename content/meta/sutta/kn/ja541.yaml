  - Số Pāli:
    `dasasahassā` (`17.3`) = dasa 10 × sahassa 1000 = 10.000, dịch "mười ngàn" (vị ẩn sĩ); `sahassayuttaṁ` (`149.1`, `158.1`) = được thắng một ngàn (con ngựa), dịch "một ngàn ngựa thắng vào"; `sahassanetto` (`3.3`) là danh xưng "Ngàn Mắt" của Sakka; `satta` (`90.2`, `93.4`) = bảy (bảy cung điện, bảy tinh xá); `pañcathūpaṁ` (`86.1`) = năm tháp nhọn; `aṭṭhaṁsā` (`163.1`) = tám cạnh; `aṭṭhaṅga` (`95.4` và các khoá cùng Pāli) = tám chi phần; `cātuddasiṁ pañcadasiṁ` = ngày mười bốn, ngày mười lăm; `aṭṭhamī` = ngày thứ tám; `saṅkusatena` (`68.2`) = sata 100 × cây cọc, "hàng trăm cây cọc"; `tāvatiṁsā` (`27.4`, `163.3`, `167.5`) = Ba Mươi Ba; `catutthaṁ` (`173.1`) = thứ tư, khớp "4." ở `0.4`. Không có cụm thuộc loại `Tiṁsakappasahassa`; các cụm trên đều dịch từ cấu tạo trực tiếp.
