  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 773/773, cùng thứ tự; không khoá thừa.
    2. Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá: 0/773 lệch (Pāli có 139 khoá mang nháy kép, không có nháy đơn).
    3. Pāli trùng nguyên văn trong chính bài: 96 nhóm, 446 khoá, 2.315 cặp; Việt khác ở 7 cặp có lý do, xem trên. Pāli trùng với bài khác: 199 khoá, 1.737 cặp; Việt khác ở 580 cặp (104 khoá), phần lớn là dòng tiêu đề, "Ngài" ở bối cảnh Đức Phật, đổi đại từ hoặc nguồn khác nhau, xem trên.
    4. Dấu lược `…pe…`, `…` trần và `(…)`: Pāli có 3 khoá `(…)` (`13.1`, `85.1`, `144.1`), Việt giữ đúng 3 khoá ấy; không có `…pe…` hay `…` nào khác (0/773), nên phần so `…pe…` chạy rỗng.
    5. Số Pāli: xem trên; không có cụm chưa phân xử được.
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng, tên cây, `Uposatha` và `āḷambara` có ghi chú ở trên. Đã in cặp Pāli↔Việt ra đọc toàn bài (773 cặp) và sửa sau lượt đọc: `ta sẽ` ở `19.2` (đặt chủ ngữ cho đúng `ahaṁ`), "mồi giấu kín" → "thứ che giấu" ở `71.4` (Pāli không nói "mồi"), "đặt lên trước" → "đi trước" ở `72.2`/`80.4`, "chu đáo" → "cẩn thận" (50/147 so với 9/147), "bậc Chánh Đẳng Giác" → "Đức Chánh Đẳng Giác" (18/24), "với tâm hoàn toàn tịnh tín" → "với tâm trong sáng" (11/64 so với 9/64), "những phần nền" → "những khoảnh đất" ở `101.3`, và hai lỗi nháy ở `91.1`, `98.1` (thiếu nháy mở, bắt được bằng phép so nháy từng khoá).
