  - Chỗ bất định (không thêm vào thân kinh):
    + `4.1` `Salomahaṭṭho`, `6.5` `alomahaṭṭho`: dịch "lông tóc dựng đứng" và "đừng kinh sợ"; `alomahaṭṭho` là tính từ ("không dựng lông tóc"), nên "đừng kinh sợ" thêm sắc thái mệnh lệnh nhẹ. `5.3` `bhaddante` đọc `bhaddaṁ te` ("kính chúc ngài an lành"). `7.1` `katokāso` = "được ban cơ hội" (hỏi), không thêm chữ "hỏi" vào thân kinh.
