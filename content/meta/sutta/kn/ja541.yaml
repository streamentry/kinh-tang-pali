  - Pāli trùng nguyên văn:
    Dò Pāli của 773 khoá với toàn bộ Pāli đã ghim (mọi bộ) có bản Việt (không kể chính ja541), loại các khoá dưới 6 ký tự chuẩn hoá: 199 khoá có dạng trùng ở bài khác, tổng 1.737 cặp (1.189 cặp nếu bỏ các dòng tiêu đề `0.x`, riêng `0.1` "Jātaka" đã chiếm 540 cặp), trong đó bản Việt giống hệt (bỏ dấu câu) ở 1.157 cặp và khác ở 580 cặp (104 khoá). Có 151 khoá dùng lại nguyên văn bản dịch có sẵn, chủ yếu từ `ja494` (cùng cấu trúc Mātali–vua Vedeha: `25`–`27`, `28.2`, `165`–`170`, `172.4`), rồi `ja535`, `ja538`, `ja530`, `pv`, `vv`, `tha-ap`. Cặp mà bản Việt khác và có lý do: `1.4`/`23.2` (`cp6:1.4` "luôn mong cầu điều thiện": chữ "luôn" không có trong Pāli); `3.1` (`tha-ap403:20.1`, `tha-ap406:19.3` dịch `saṅkappa` là "ý định" ở bối cảnh khác; ở đây Nimi đang nghĩ nên "ý nghĩ", cùng với `2.4`); `9.2`–`9.4` (`ja424:7.2` dịch `khattiye upapajjati` là "sinh ra làm một vua đế-chủ": `khattiye` là vị trí cách số nhiều, "sinh vào hàng sát-đế-lợi"; `ja424:7.3` chỉ dịch nửa dòng); `22.1`–`22.2` (`mn92:20.1`, `snp3.1:6.1` khác ngữ cảnh, tầng không có đa số); `27.4` (`ja494:3.4`, `ja523:2.2` "cùng với Đế Thích": ở đây dùng "Sakka" cho thống nhất với `4.4`, `6.3`, `166.1`, vì `saindaka` chỉ là "cùng với Inda"); `35.1` và 13 khoá cùng Pāli (`bv1:79.1` thêm chữ "Ngài" vì người nói là Đức Phật; ở đây người đáp là Mātali nên không thêm); `90.1`, `143.3` (`pv24:5.5`, `pv27:23.1` thêm "Chúng" ở bối cảnh có chủ ngữ riêng); `94.4` (5 cặp, đều khác nhau, vì `padīpiya` hiếm: "chỗ ở và đèn thắp"); `94.6`/`107.4`/`115.4`/`124.4`/`133.4`/`140.4` (64 cặp: "với tâm trong sáng" 11, "với tâm hoàn toàn tịnh tín" 9, "với tâm thanh tịnh tinh khiết" 6, "với tâm trong sáng thanh tịnh" 6, còn lại rải rác; chọn dạng đa số tương đối 11/64 vì sát `vippasanna`); `95.3`/`108.3`/… (`Pāṭihāriyapakkhañca`: 9 cặp "cùng cả tuần lễ thần biến" so với 5 "cùng kỳ phép nhiệm màu", giữ dạng đa số dù `pakkha` là nửa tháng; xem bất định); `109.2`/`117.2`… (`sadā sīlesu saṁvutā`: 6 cặp "giới hạnh giữ mình trong sạch" của nhóm `vv` so với 4 cặp "luôn thu thúc trong các giới"; chọn dạng sau vì sát `saṁvuta` "thu thúc"); `147.2` (6 cặp, không có dạng đa số); `147.4` (24 cặp: "trong giáo pháp của Đức Chánh Đẳng Giác" 18; đã theo); `149.2`/`158.2` (`tha-ap5:9.2`, `tha-ap408:7.2` có chủ ngữ "tôi/ta"); `163.1` (`vv78:2.1` "tám phần mười sáu" là cách dịch lệch của `aṭṭhaṁsā`, ở đây "tám cạnh" theo `aṭṭha` 8 + `aṁsa` cạnh/góc); `167.4`, `167.5` (`sn9.6:2.4`, `sn9.6:2.3`, `ja507:1.4` khác ngữ cảnh; `ja494:7.4`–`7.5` được dùng lại); `168.3` (3 cặp "Cũng vậy, ai khóc than" khác nghĩa hẳn; `ja494:11.3` được dùng lại); `169.3` (`sn1.53:2.5` "phước do chính mình tạo nên"; dùng lại `ja494:12.3`); `170.3` (6 cặp: "bằng bố thí, bằng hạnh sống ngay thẳng" 5, "bằng bố thí, bằng hạnh lành" 1; chọn 5/6).
