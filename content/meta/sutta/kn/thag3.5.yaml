notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của harness gần như không kiểm gì ở bài này, nên tôi tự quét toàn bộ khoá từ đĩa.** Mọi vế kệ ngắn hơn 40 ký tự nên bộ lọc `substantivePaliMinChars: 40` trong `source/layers.yaml` không thấy segment nào; tôi đọc Pāli thật của từng khoá từ `.cache/upstream/suttacentral/` theo `sourcePath` trong catalog, đối chiếu tay với bản Việt, rồi quét máy: tập khoá Việt bằng đúng tập khoá Pāli (17/17, đúng exact ID, không orphan), mọi giá trị NFC và không rỗng, ngoặc kép cong cân trên cả bài, không có `(…)`, dấu lược khớp Pāli từng khoá.
  - |-
    **Không thể tuyên bố technical gate pass.** Đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tiêu chí 10 bị chặn ở 9.6: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, NFC, ngoặc kép cân cả bài và YAML sạch. Người biên tập phải chạy lại bốn lệnh trên trước khi đổi trạng thái.
  - |-
    **Lỗi chặn 1: `1.3` `Iti vissaṭṭhakammante` bị dịch sang nội dung không tồn tại.** Pāli không có *bạc*, không có *vá*, không có *bảo kê*. Tôi đã tra đúng ngữ cảnh gốc: cụm `Iti vissaṭṭhakammante` xuất hiện hai lần trong corpus Pāli đã ghim, và lần thứ hai là `dn31:14.31`, nằm giữa `Atisītaṁ atiuṇhaṁ, atisāyamidaṁ ahu;` và `atthā accenti māṇave` — tức *quá lạnh, quá nóng, muộn quá rồi; như vậy kẻ bỏ bê việc thì người ta chỉ còn được lợi ích*. Bản Việt của `dn31` trong chính dự án đã dịch đúng là *cứ bỏ bê công việc như vậy*. Bản Việt ở đây không theo Pāli và cũng không theo tiền lệ đã publish.
  - |-
    **Lỗi chặn 2: `3.3` *Bằng ngực tôi dẹp lễ ra*.** `lễ ra` không phải tiếng Việt. Vế này làm cả khoảng `3.3–3.4` mất nghĩa: chữ *thanh vắng* ở `3.4` không còn gì để đối lập vì vế trước không đọc được.
  - |-
    **Điểm tốt: bản dịch bám Pāli chứ không bám Sujato ở khoảng `3.1–3.2`, và đó là chỗ Sujato sai.** Pāli `3.1` = `Dabbaṁ kusaṁ poṭakilaṁ` và `3.2` = `usīraṁ muñjapabbajaṁ`; Sujato dịch `3.1` là *the grasses, vines, canes* và `3.3` là *the vetiver, rushes and reeds*, tức lệch danh từ. Bản Việt giữ đúng thứ tự từng câu: *Cỏ, cỏ Kusa, cỏ Poṭakila* rồi *cỏ Usīra, lau Muñja, lau Pabbaja*. Đây là trường hợp Pāli thắng, đúng nguyên tắc.
  - |-
    **Chỗ hơi lệch khác, đã ghi.** `2.3` `Karaṁ purisakiccāni` là *làm tròn việc bổn phận của một con người*; bản Việt *vẫn làm tròn việc của mình* — mất ý *con người* của `purisa-` (cũng là nghĩa của `dn31:14.35` mà dự án đã dịch giống hệt, nên đây là hệ quả của một lựa chọn trước đó, không phải lỗi mới). `3.1` `Dabbaṁ` là một loài cỏ cụ thể (cây lanh/sợi), bản Việt rút gọn thành *Cỏ*.
  - |-
    **Tầng Anh.** 12/13 khoá nội dung có prose Sujato, im lặng ở `3.5` dòng bảng hiệu. Ở `1.1–1.2` Sujato dịch gần đúng, nên lỗi ở `1.3` không phải do bản Anh kéo sai.
