notes: |-
  Đợt 19, lát 146. Dịch trọn 1783/1783 khoá từ Pāli root đã ghim, đúng thứ tự Pāli; không có khoá nào ngoài tập khoá Pāli. Bài là phần 6, phần cuối của Netti, Sāsanapaṭṭhāna (nền tảng giáo pháp): mười sáu loại bài kinh theo phần ô nhiễm, nuôi dưỡng tâm, thấu triệt, vô học và các phần kết hợp, kèm hàng chục đoạn kinh và kệ được trích làm ví dụ (Mahānāma, Isidatta và Purāṇa, Sakka và Vepacitti, Subha, Upaka, vua Pasenadi, các kệ Dhammapada, Udāna, Itivuttaka, Sutta Nipāta…), rồi chín mục thế gian và siêu thế, chân thật và tán thán, và lời kết rằng Netti đến đây là hoàn tất. Không có Sujato, không có lớp english-project, không có bản Việt hiện hành theo khoá, nên đối chiếu độc lập chỉ có Pāli root cộng tiền lệ trong chính tầng Việt: pe2 là bản song hành gần nhất (161 cặp Pāli trùng nguyên văn), cùng ne1–ne36, pe1–pe9, và các kinh được trích (dn16, dn21, dn33, mn26, mn129, mn143, sn1, sn2, sn3, sn6, sn10, sn11, sn12, sn22, sn35, sn55, an3, an4, an7, an10, ud, iti, dhp, kp, snp, thag, vv, tha-ap, ja). Bản nguyên bài ở mục Tra cứu toàn văn không cấp text theo khoá, không dùng làm nguồn đối chiếu theo khoá.

  **Coverage English (đo thật).** Mẫu số 442 khoá Pāli có nội dung (từ 40 ký tự, bỏ các khoá tiêu đề :0); Sujato phủ 0/442; english-project 0 (không có ne37 trong lớp lấp); vietnamese-current vắng. Blocker noEnglishEditionUpstream là thật, không bù được bằng điểm; triangulation đặt 7,0. Bài giữ draft theo quy ước của lát khi không có tầng tham khảo nào; chưa ghi khối waiver vì khối đó do lệnh chốt tạo ra.

  **Tiền lệ và Pāli trùng nguyên văn.** Đã dò toàn tầng Việt (khoảng 260 nghìn khoá có Pāli): 826 khoá của bài có Pāli trùng (bỏ dấu câu, bỏ chữ hoa) với khoá ngoài bài, tạo 10.505 cặp; 6.142 cặp bản Việt giống hệt, 4.363 cặp khác. Phần lớn khác biệt là công thức ngắn mà các bài khác dịch nhiều dạng (ví dụ "Katame cattāro?" có hàng chục dạng Việt), hoặc các bài kệ trích đã được nhiều lát dịch khác nhau. Trong 52 khoá dài từ 40 ký tự mà bản của bài này không phải dạng đa số, các điểm có chủ ý là: `Tattha` → "Ở đây" theo khuôn ne (xem phần thuật ngữ) thay cho "Trong đó" của pe2 (4.1, 269.1, 288.1, 307.1, 349.1, 419.1, 497.1); `292.1`–`292.2` dùng dấu nháy đơn quanh lời trích theo pe2:24 thay cho ud3.10; `341.3` không theo an7.37 vì "không thỉnh vắng mặt nào" không có căn cứ Pāli (`aṭṭhāne niyojeti` dịch "xúc giục vào điều không đáng"); `414.1`–`414.2` không theo sn11.4 và sn11.5 ("Người ta gọi là sức mạnh chỉ là sức mạnh của kẻ ngu") vì bỏ mất phủ định `abalaṁ`; `462.1`–`462.2` không theo ja510:24 vì `na hi … samavipākino` nói hai điều không cùng một quả; `450`–`451` dùng "bậc trí" và "ác hạnh về thân" thay cho "người hiền" và "tà hạnh" của mn129; `489.3` không theo an10.48 ("không bị chê trách") vì `vevaṇṇiya` không có nghĩa ấy; `278.3`, `282.2`, `399.4`, `420.4`, `464.4`, `464.8`, `505.4` là cách diễn đạt khác trên cùng nghĩa. Trong chính bài có 117 nhóm Pāli trùng nguyên văn; 116 nhóm bản Việt giống nhau, một nhóm khác có chủ ý: `68.3` và `86.1` "Với bốn pháp nào?" so với `385.2` "Với bốn chi nào?", vì vế trước nói về pháp ở hai chỗ đầu và về chi của bậc nhập lưu ở chỗ sau.

  **Thuật ngữ, kèm số đếm.** Theo phạm vi gần nhất, ghi cả hai số khi đa số khác nhau. `bhāgiya` → "thuộc phần …": ô nhiễm, nuôi dưỡng tâm, vô học (pe2); `nibbedha` → "thấu triệt" (pe2 11 khoá, ne5; toàn tầng "xuyên thấu" 13 so với "thấu triệt" 12, ne11 dùng "xuyên thấu" 4 khoá). `vāsanā` → "sự nuôi dưỡng tâm" (pe2, ne11). `vodāna` → "thanh tẩy" (ne 9 và pe 9 khoá so với "trong sạch" 5 trong ne; ne36 chọn "trong sạch" nên lát này lệch ne36, theo ne21 và pe2); `visujjhati` → "thanh tịnh" (92 khoá). `saṅkilesa` → "ô nhiễm". `kodha` → "giận" (toàn tầng "giận" 130 và "giận dữ" 177 so với "sân hận" 83, "phẫn nộ" 61; không dùng "sân hận" vì đã dành cho dosa). `avippaṭisāra` → "không hối tiếc" (58 khoá so với "không sợ hãi" 49 của an10 và "không hối hận" 9 của pe; "không sợ hãi" bỏ vì `vippaṭisāra` là hối tiếc). `kali` → "quẻ xui" theo đúng đoạn sn6.9–sn6.10 (8 khoá; toàn tầng "vận rủi" 12). `agatigamana` → "sự đi theo thiên vị" (ne10, pe9, ne36). `attā` → "tự ngã", "ngã" (ne/pe, ne36). `puggala` → "hạng người". `kāyaduccarita` → "ác hạnh về thân" (ne36, pe2; toàn tầng "ác hạnh bằng thân" 32, "ác hạnh về thân" 29, "thân ác hạnh" 22) và dạng "hành ác hạnh bằng thân" khi ở cách công cụ. `ottappa` → "kính sợ" (155 khoá so với "quý" 87, "sợ tội" 18). `puññakkhetta` → "phước điền" (72 so với "ruộng phước" 43). `iṭṭhā kantā manāpā piyarūpā kāmūpasaṁhitā rajanīyā` → "đáng ưa, đáng thích, dễ chịu, hấp dẫn, liên hệ đến dục, khơi dậy ham muốn" (24 khoá, dạng nhiều nhất trong 6 dạng). `nibbidā` → "nhàm chán" (348 so với "chán ngại" 120). `kilesabhūmi`, `indriyabhūmi` → "vùng đất của phiền não / của các căn" (ne2:12–13, pe9 6 khoá; "nền tảng" cũng 6 khoá ở pe9). `mūlapada` → "nền tảng gốc" (ne2, nhiều khoá). `paccekabuddha` → "Phật Độc Giác" (25 khoá so với "độc giác" 32 ở nhiều ngữ cảnh khác nhau). `sāmāka` → "kê". `tidasa` → "chư thiên tam thập" (9 khoá so với "tam thập tam" 11, "ba mươi ba" 8). `seṭṭhi` → "triệu phú" (42). `cattāri saccāni` → "bốn chân lý" (pe 20 khoá; ne10 dùng "bốn sự thật" 14 khoá), `ariyasacca` → "Thánh đế". `sotāpanna` → "bậc nhập lưu" (pe2; ne11 dùng "dự lưu"). `kappakoṭi` → "koṭi kiếp" (cnd14). `visajjanīya`, `avisajjanīya` → "điều có thể giải đáp", "điều không thể giải đáp"; hai chữ này không có tiền lệ trong tầng. `ārammaṇa` → "đối tượng" (sn12.38 dùng "sở duyên" cho cùng chữ trong câu `ārammaṇametaṁ hoti viññāṇassa ṭhitiyā`; lát này giữ "sở duyên" ở 274.2–276.2 và "đối tượng" ở 527–529 theo nghĩa giác quan).

  **Số Pāli (tự tính).** `soḷasa` = 16 (1.4: đếm đủ 16 mục; 2.7: bốn thành tám, tám thành mười sáu); `navavidha` = 9; `caturāsīti` = 84 (catur 4 + asīti 80); `ajja tiṁsaṁ tato kappā` = 30 (92.1, 129.1, 146.1; không có `sahassa` nên không thuộc cụm Tiṁsakappasahassa); `ekatiṁsa` = 31 (eka 1 + tiṁsa 30); `sahassaṁ kappakoṭiyo` = một ngàn koṭi kiếp; `satasahassaṁ kappe` = 100 × 1000 = một trăm ngàn kiếp; `sahassakkhattuṁ` = một ngàn lần; `bāttiṁsa` = 32 (bā 2 + tiṁsa 30); `sataṁ sahassānaṁ nirabbudānaṁ` = một trăm ngàn nirabbuda, `chattiṁsati` = 36 (cha 6 + tiṁsa 30), `pañca abbudāni` = 5; `saṭṭhivassasahassāni` = 60 × 1000 = sáu mươi ngàn năm; `chattiṁsataṇhājālinī` = 36; `dvāsaṭṭhi` = 62 (dvā 2 + saṭṭhi 60); `vīsati` = 20 (20 khārī và chuỗi hai mươi địa ngục ở 437); `chattiṁsakkhattuṁ` = 36 lần; `satta vassāni`, `satta saṁvaṭṭavivaṭṭakappe` = bảy năm, bảy kiếp hoại thành; `sattakkhattuparamaṁ` = tối đa bảy lần; `aṭṭhama` = thứ tám; `chabbīsati` = 26 (cha 6 + vīsati 20; 5 + 12 + 9 = 26 đã cộng lại); `ekūnavīsati` = 19 (20 trừ 1; 7 + 4 + 4 + 4 = 19 đã đếm ở 523.2); `dvādasa` = 12 (đã đếm 12 mục ở 522.2); `dasa kammapathā`, `dasa dhammā` = 10; `cattāri purisayugāni`, `aṭṭha purisapuggalā` = 4 đôi, 8 hạng; `dvīhatīhaṁ` = hai ba ngày. Không có số nào cần nhân thang lớn ngoài `satasahassaṁ`, `saṭṭhivassasahassāni` và `sahassaṁ kappakoṭiyo`.

  **Bất định đã ghi, không giấu.**
  - `119.3` `paddhapupphehi`: không xác định được `paddha`; giữ nguyên thành "hoa paddha"; ở `119.4` `tasseva` dịch "cúng chính cho Ngài".
  - `126.1` `sugatte`: đọc là hô cách (gọi các thiên tử có thân hình đẹp), chưa chắc.
  - `133.1`–`133.4` (`yaṁ cakkhu adantadamakassa … vidhūtalato`): dịch sát chữ; `vidhūtalato` đọc "đã rũ sạch dây leo".
  - `139.4` `hitāhitāsihi`: dịch sát chữ "những vị mong điều lợi và điều không lợi".
  - `248.3`–`248.4` `ājāniyaṁ jātibalaṁ nisedhaṁ nītaṁ`: dịch sát chữ làm các từ đồng vị của vị được kính lễ.
  - `79.1`–`80.2`: Pāli ghi cả hai địa danh ở cách vị trí; dịch theo thứ tự từ–đến như ở `78.1`, `81.1` và sn55.6.
  - `83.2`: Pāli kết bằng dấu hỏi nhưng nội dung là lời khẳng định; dịch như câu khẳng định theo sn55.6.
  - `230.1` `cārikādasamaṁ`: dịch sát chữ "lời giải đáp thứ mười về chuyến du hành", chưa tra được bài nào.
  - `301.1`–`304.1` `accantadiṭṭhaṁ`: dịch "đã được thấy tuyệt đối".
  - `312.1` `padhānāni`: dịch "sự nỗ lực" theo đúng chữ Pāli, trong khi nội dung giống an2.141 (`dānāni`).
  - `341.1` `gale pisanamajjamānena`: dịch "bị đè ép nơi cổ họng", nghĩa chưa chắc.
  - `385.4` `saha dhammiyā`: dịch "những người cùng sống theo pháp".
  - `421.1` `tena ca amaññiṁsu`: Pāli thiếu phủ định so với ud6.8 (`nāmaññiṁsu`); dịch với phủ định mang sang từ vế `na ahesuṁ`, không đổi nghĩa kết luận của khoá.
  - `420.4` `kaṭasi`: theo ud6.8 là "nghĩa địa".
  - `439.1`–`439.2` `ahaṁ taṁ amatadundubhiṁ`: Pāli thiếu động từ; dịch "Ta với tiếng trống Bất tử ấy".
  - `477.2`–`477.3` `akusalākusalehi vivajjitā`, `devate`: đọc là `akusalā kusalehi vivajjitā` ("những kẻ bất thiện, xa rời các điều thiện") và hô cách "hỡi thiên thần".
  - `489.3` `vevaṇṇiya`: dịch "trạng thái không còn giai cấp".
  - `512.4`, `514.4` `vississare`: dịch "vượt trội", chưa chắc.
  - `523.2` `mukha` (rāgamukhe ṭhito…): dịch "cửa".
  - `524.1`: năm "hạng người" là khái niệm trừu tượng (giới tự nhiên, giới do thọ trì, sự tịnh tín của tâm, chỉ, quán); dịch sát chữ.
  - `531.5` `Niyuttaṁ`: dịch "đã được hoàn tất"; `531.6` `mūlasaṅgīti`: dịch "cuộc kết tập gốc".
  - `23.1` `sukiccharūpāvatime`: dịch "quả thật sống trong cảnh vô cùng chật vật" theo ja470:1.3 và pv21:14.
  - `239.4` `pakkula`: giữ cách dịch của ud1.7 ("sự hỗn loạn của nó").
  - `434.1`: câu `Ettako bhagavā …` dịch như mệnh đề đo lường, không thêm dấu hỏi.
  - `436.9`–`437`: nối với Kokālika theo an10.89 và sn6.10.
  - `58.1`–`58.2` `nirabbuda`, `abbuda`: giữ nguyên tên, không thêm chữ "kiếp" mà Pāli không có.
  - Dấu hỏi thêm vào bản Việt ở các khoá Pāli kết bằng dấu chấm nhưng là câu hỏi (ví dụ 41.4, 117.2, 175.x, 178.x, 197.x, 425.4, 425.6, 457.4); không đổi nghĩa.

  **Phép kiểm đã chạy, kèm mẫu số.** Tập khoá Việt = tập khoá Pāli, 1783 = 1783, đúng thứ tự Pāli. Nháy kép và nháy đơn khớp Pāli từng khoá: 0 lệch trên 1783 khoá (Pāli có dấu nháy kép ở 407 khoá, nháy đơn ở 60 khoá; dấu nháy cong trong `evam’idhekacce` ở 29.4 và 109.4 là dấu nối chữ của Pāli, không tính). Dấu lược: 40 khoá Pāli có `…pe…`, mỗi khoá thành đúng một `…`; 29 khoá Pāli có `…` trần (các mục lặp đã rút gọn), giữ đúng một `…`; 2 khoá kết `….` (78.2, 80.2) và bản Việt kết ` ….`; Pāli không có `(…)` nên bản Việt không có; 0 khoá lệch. Pāli trùng nguyên văn trong chính bài: 117 nhóm, một nhóm khác có chủ ý (xem trên). Số Pāli: đã tính từng chỗ như trên, 0 lệch. Pāli lọt sang Việt: chỉ còn tên riêng và vài từ kỹ thuật giữ nguyên (paddha, māluvā, sāla, pātāla, halāhala, sāmāka, kummāsa, koṭi, khārī, gāvuta, tên các địa ngục Abbuda đến Paduma). NFC đạt; 0 khoá rỗng; 0 khoảng trắng thừa. Đã in cặp Pāli và Việt ra đọc: toàn bộ các khoá dùng lại tiền lệ và các khoá tự dịch ở phần đầu và giữa bài, phần còn lại đọc khi viết.

  Cổng kỹ thuật CHƯA chạy ở lát này. Cần chạy đủ bốn lệnh trước khi coi technical_integrity 9,6 là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Sửa lan 2026-10-13 (accuracy fix): `:531.1`–`:531.3` (Pāli y hệt `ne2:14.1`–`:14.3`): "Chín nền tảng kia là thiện, / chín nền tảng kia hợp với phần bất thiện; / Đây là những nền tảng gốc," → "Các thiện có chín nền tảng, / và các phần bất thiện được kết hợp bằng chín nền tảng; / đây quả thật là những nền tảng gốc," (bỏ "kia" thừa, đủ `kho`; dùng lại nguyên văn `ne2`). `:87.3` `appaṭivibhattaṁ`: "được chia sẻ không phân biệt" → "không giữ riêng, mà chia sẻ" (Pāli `yaṁ kho pana kiñci kule deyyadhammaṁ sabbaṁ taṁ appaṭivibhattaṁ sīlavantehi kalyāṇadhammehi` y hệt `sn55.6:18.5`, nên dùng lại cách dịch ấy; cũng khớp `an8.21:6.2`). Không đổi `:86.3`.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 377 khoá chênh lệch lớn nhất trong 1783 khoá → khác nghĩa 10 cụm: sửa 2 (`173.1`: "tôi" → "Ta", vì lời kệ `Kadāhaṁ nandaṁ passeyyaṁ` là lời của Đức Thế Tôn ở bản song hành `sn21.8:1.5`–`1.6`, nơi Đức Phật tự xưng "Ta"; `308.3`, `309.1`, `332.2`: "việc thiện, tức là các phước" → "việc thiện và các phước", vì `sukiccaṁ ceva puññāni` là cặp nối bằng `ca eva` giống dòng trước `kiccaṁ akiccameva ca`, Pāli không nói hai vế đồng nhất), giữ 4 (`489.3` `vevaṇṇiya`: "không còn giai cấp" theo an10.48, bản mù "biến sắc" sai nghĩa; `241.1` `āyantiṁ`: giữ "bà" theo cùng dòng kệ ở `ud1.8:8.1`–`8.2`, bản mù "cái" làm mất giống cái của chữ Pāli; `218.3` `Na hi no saṅgaraṁ tena`: bỏ `no` giống 12/12 nơi Pāli trùng ở tầng (mn132–134 và các bài song hành), bản mù thêm "của chúng ta" chỉ là cách diễn đạt khác; `516.1` `ekāyanaṁ`: bản mù hiểu thành "vì lợi ích và lòng thương xót" là sai), bất định 4 (`477.2` `akusalākusalehi vivajjitā`: "xa rời các điều thiện" hay "bị các bậc thiện xa lánh", cả hai bản đều không chắc; `439.2` `ahaṁ taṁ amatadundubhiṁ` thiếu động từ; `248.3` `ājāniyaṁ jātibalaṁ nisedhaṁ`; `119.3`–`119.4` `paddha`, `tasseva`). Rà soát đối kháng toàn bài (đọc lại từng cặp Pāli và Việt) tìm thêm 4 lỗi thật và đã sửa: `92.3` "Ta" → "Tôi" (cùng một bài kệ tự thuật của một vị Trưởng lão, `91.4` và `92.2` đã xưng "tôi"); `32.3` và `112.3` "mang đi" → "mang đến" (cùng công thức `yathābhataṁ nikkhitto` ở `29.2` và `109.2`; ở tầng có 151 khoá `yathābhataṁ` dịch "mang đến" so với vài khoá dịch khác); `341.1`: "bị ngăn cách, bị xua đuổi" là cách công cụ chỉ người thực hiện việc "không bỏ rơi" (`viveciyamānena paṇāmiyamānena`, không phải đối cách đi với `kalyāṇamittaṁ`), nên "dù người ấy có bị…" → "dù chính mình có bị…"; thành ngữ `gale pisanamajjamānena` vẫn chưa chắc, giữ "bị đè ép nơi cổ họng"; `522.3` danh sách "chín hạng người" chỉ đếm được tám mục vì gộp "vị Phật Độc Giác và các vị Chánh Đẳng Giác", nay tách thành hai mục theo `paccekabuddhasammāsambuddhehi` để đủ chín. Số đếm 16, 26 (5 + 12 + 9), 19, 12, 9 đã đếm lại theo từng mục, khớp. Không có bản Anh hay bản Việt độc lập khác. Cổng kỹ thuật vẫn chưa chạy ở lượt này: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
