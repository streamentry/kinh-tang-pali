notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá :2.2 — “… không run sợ vì chấp thủ, thì sự sinh khởi khổ trong tương lai—sanh, già, chết—không có” → “… không chấp thủ, không lo âu, thì trong tương lai không có sự phát sinh của sinh, già, chết và sự tập khởi của khổ” (dùng lại nguyên văn mn138:3.2 và 6 khoá khác của mn138 cùng Pāli; cũ đảo nghĩa `anupādāya aparitassato` = không chấp thủ, không lo âu, thành “run sợ vì chấp thủ”, và hiểu sai hợp thể `jātijarāmaraṇadukkhasamudayasambhava`). Quét lan :2.1 (cùng cụm `anupādāya na paritasseyya`) theo mn138:3.1; nháy kép mở ở :2.1 và đóng ở :2.2 theo Pāli.
