notes: |-
  Đủ 9/9 khóa. Rādha giữ nguyên tên riêng. aḍḍharatte anāgate (tuyệt đối)
  → nửa đêm còn chưa đến. virattā giống cái nên người nói là con mái, vế
  1.4 đổi chủ thể về người nói; gạch ngang đầu vế đánh dấu chỗ chuyển ngôi
  này, không thêm chữ ngoài Pāli.
  Hai bất định đã ghi nhận: abyayataṁ (0 tiền lệ) đọc là không ngớt (a +
  vyaya, không suy giảm); cách đọc khác là vô ích. kosiyāyana (0 tiền lệ)
  đọc là tổ chim cú (kosiya là cú); cách đọc khác là nhà của người tên
  Kosiya. Chưa phân xử được bằng từ điển nên hạ terminology và ambiguity,
  giữ draft.
  Sujato trống cả 9 khóa, không có tầng Việt hiện hành cho Jātaka → Pāli
  đơn tuyến.
