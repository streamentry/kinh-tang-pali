notes: |-
  **Phạm vi: đủ 245/245 khoá của cnd18, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Posāla (Pārāyana, câu hỏi thứ mười bốn), tức bài kệ `snp5.15`. Cấu trúc như `cnd6`, `cnd12`, `cnd13`, `cnd14`, `cnd15`, `cnd16`, `cnd20`: dẫn từng đoạn kệ, giải từng cụm, rồi nhắc lại cả đoạn kệ (kệ in đậm ở `1`, `13`, `20`, `42`; nhắc lại trong ngoặc kép ở `12`, `19`, `41`, `49`). Khác các bài anh em, bài này chen nhiều đoạn kinh được trích nguyên văn trong phần giải: công thức nhớ đời trước (`3`, `4`), `dn29` (`6`, `30`, `31`), bảy trú xứ của thức theo `an7.44` và `dn33` (`22`–`28`), tâm của người khác theo `mn12` (`33`–`38`) và `sn22.54` (`21`). Pāli có 61 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 25 khoá chứa dấu lược `…`: 21 khoá có `…pe…` (đều thành đúng một `…`), 4 khoá có `…` trần (`3.3`–`3.6`, giữ nguyên một dấu), 0 khoá có `(…)`, 0 khoá kết `….`.

  **Cách trình bày lemma** theo `cnd6`/`cnd12`/`cnd13`/`cnd14`/`cnd15`/`cnd16`/`cnd20`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Giữ nguyên chữ Pāli ở hai chỗ vì lời giải nói về chính hình thức của từ ấy: `Iccā` (`8.2`, đúng nguyên văn `cnd16:3.13`) và `Iti` (`44.3`, theo `cnd14:24.4`, `cnd16:25.12`). Tên người giữ nguyên Pāli: Posāla, Sāriputta, Cunda, Sakya. `Jātaka` giữ nguyên (đã quen ở toàn tầng). Tên các kinh ở `5.1` theo tiêu đề đã có trong kho: `dn14` Kinh Đại Bổn, `dn17` Kinh Đại Thiện Kiến Vương, `dn19` Kinh Đại Điển Tôn, `mn83` Kinh Makhādeva (Pāli ở đây là `maghadeviya`).

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `cnd18`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho `kn/cnd`. Lớp `english-project` không có `cnd18`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **111** khoá (112 nếu tính cả thẻ); Sujato phủ 0/111 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/111, `vietnamese-current` 0/111. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp5.15` (bài kệ trùng Pāli, 4 đoạn kệ của Posāla) đã được đọc để kiểm cách parse các dòng kệ (Sujato dịch `Yo atītaṁ ādisati` là *the one who reveals the past*, `anejo` là *imperturbable*, `sakka` là *the Sakyan*, `viññāṇaṭṭhitiyo` là *planes of consciousness*, `ākiñcaññasambhava` là *desire for rebirth in the dimension of nothingness*), nhưng đó là bản của **bài khác** nên không tính là đối chiếu English của cnd18. Chứng cứ độc lập còn lại là các bản đã dịch của `snp5.15`, `dn29`, `mn12`, `sn22.54`, `an7.44`, `an4.23`, `dn1`, `dn10`, `mil6.4.2` và công thức chú giải ở `cnd6`, `cnd12`, `cnd13`, `cnd14`, `cnd15`, `cnd16`, `cnd20`, `cnd21`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, bỏ khoảng trắng thừa) trùng nguyên dấu câu với khoá đã dịch ngoài bài này: 70 khoá có tiền lệ, dùng lại nguyên văn 59, khác 11; so khớp sau khi bỏ dấu câu và chữ hoa/thường: 107 khoá có tiền lệ, dùng lại nguyên văn 63, còn lại khác chủ yếu ở dấu nháy, dấu ngắt, hoặc ở khoá Pāli cho phép đổi mệnh đề (đã đối chiếu từng cặp). Nguồn dùng lại chính: `snp5.15` (các dòng kệ, 30 khoá nguyên dấu câu), `cnd16`, `cnd15`, `cnd14`, `cnd13`, `cnd12`, `cnd20`, `cnd6` (công thức chú giải), `mn12` (33–38), `an7.44` (22–28), `dn29` (6, 30, 31), `sn22.54` (21). Các khoá Pāli trùng nguyên văn mà bản Việt khác, kèm lý do:
  - `20.2`, `41.2` `(posālāti bhagavā)` (trùng `snp5.15:3.2` *(Đức Thế Tôn trả lời:)*) → *(Này Posāla, Đức Thế Tôn nói,)*, theo `cnd16:16.2`: bản `snp5.15:3.2` bỏ hô ngữ `posālā`, trong khi `29.1`–`29.4` của chính bài này giải thích hô ngữ ấy;
  - `23.1`, `24.1`, `25.1` (trùng `an7.44:2.1`/`3.1`/`4.1` và `an9.24:2.1`/`3.1`/`4.1`) → thêm *Này các tỳ-kheo,* vì Pāli có `bhikkhave` mà bản `an7.44`, `an9.24` bỏ; hai chỗ còn lại giữ nguyên văn;
  - `30.12`, `31.2`, `31.4`, `31.8` `Tasmā ‘tathāgato’ti vuccati.` (trùng `an4.23`) → *Vì vậy được gọi là ‘Như Lai’.* không mang ngoặc *(Ngài)*, vì Pāli không có ngoặc đơn (khoá Pāli không mang `(…)` hay ngoặc đơn nào);
  - `31.7` `Iti yathāvādī tathākārī…` (trùng `an4.23:4.2` *Vì Ngài nói như Ngài làm, và làm như Ngài nói,*) → *Như vậy, nói sao làm vậy, làm sao nói vậy.*, vì bản `an4.23` gộp vào mệnh đề kế, còn ở đây khoá tự kết bằng dấu chấm, và theo `dn29:29.5`–`29.6`;
  - `42.4` `Tato tattha vipassati;` (trùng `snp5.15:4.4`) → thêm *rồi*, vì bản `snp5.15:4.4` bỏ `tato`; khoá `49.4`, `46.1`, `46.4` cùng Pāli (khác chữ hoa) cũng mang *rồi*.
  Đã dò **23 nhóm Pāli trùng nguyên byte trong chính bài** (33 khoá lặp thêm): 0 nhóm có bản Việt khác. Dò thêm sau khi bỏ chữ hoa/thường và dấu câu: 32 nhóm (58 khoá lặp thêm), trong đó 16 nhóm bản Việt khác nhau, đều chỉ khác chữ hoa/thường, dấu ngắt hoặc nháy theo Pāli từng khoá (như `1.1`/`7.3`/`12.1`, `33.2`/`34.1`, `13.1`/`14.5`/`19.1`), cùng một cách dịch.

  **Thuật ngữ, kèm số đếm toàn tầng (các bài đã dịch ngoài cnd18).** `anāgata` → *vị lai* 154 khoá vs *tương lai* 87; riêng các khoá cnd có Pāli `anāgata` là 3 vs 0, bài anh em `cnd16` (`18.2`) dùng *vị lai* nên giữ. `viññāṇaṭṭhiti` → *trú xứ của thức* 19 khoá vs *sở nương tựa của thức* 1. `ākiñcaññāyatana` → *Vô sở hữu xứ* (168 lần xuất hiện vs *xứ vô sở hữu* 88); `ākāsānañcāyatana` → *Không vô biên xứ*; `viññāṇañcāyatana` → *Thức vô biên xứ*; `nevasaññānāsaññāyatana` → *Phi tưởng phi phi tưởng xứ* (153 lần vs *xứ phi tưởng phi phi tưởng* 69); `samāpatti` → *sự chứng đạt* 38 vs *sự chứng đắc* 18. `nandi` → *hoan hỷ* 133 vs *hỷ ái* 16 vs *tham hỷ* 2 (khác `sn22.54` ở `21.4`, `21.7`). `vivaṭṭa` → *mở ra* 19 vs *giãn ra* 8. `sākāraṁ sauddesaṁ` → *đặc điểm và chi tiết* 28 vs *tướng trạng và chi tiết* 13. `tathāgatabala` → *sức mạnh của Như Lai* 34 khoá (`an10.21` 12, `an6.64` 8, `ne21` 8, `an10.22` 4, `an5.11` 2) vs *năng lực* 12 (chỉ `mn12`). `parāyaṇa` → *cứu cánh* 16 khoá (`thag16.10`). `pāragū` → *bờ bên kia* 32 vs *bờ kia* 20 (trong 149 khoá có `pāragū`/`pāragato`; *Bờ Kia* ở tên phẩm chỉ là tên). `saṁsaya` → *nghi hoặc* (`snp5.15:1.3`), `vicikicchā` → *hoài nghi* (`cnd13:11.1`). `adhimutta` → *nghiêng hẳn về* theo `cnd14:2.3` (còn `ne21:30.1` *khuynh hướng về*, đổi sẽ lệch bài anh em). `abhidhamma` → *Thắng Pháp* (9 khoá, 0 khoá dùng *Vi Diệu Pháp*). `dhutaṅga` theo `mil6.4.2`: *hạnh sống trong rừng*, *hạnh chỉ ăn khất thực*, *hạnh mặc y phấn tảo*, *hạnh chỉ dùng ba y*, *hạnh khất thực tuần tự từng nhà*, *hạnh không ăn thêm sau bữa*, *hạnh không nằm*, *hạnh ngủ nơi chỗ được trải sẵn*. Các cụm dùng lại bài anh em: `tulayitvā tīrayitvā vibhāvayitvā vibhūtaṁ katvā` → *đã cân nhắc, đã thẩm xét, đã làm cho rõ ràng, đã làm cho sáng tỏ* (`cnd14:28.4`); `chinnā ucchinnā samucchinnā vūpasantā paṭippassaddhā abhabbuppattikā ñāṇagginā daḍḍhā` (`cnd16:3.3`, `cnd15:31.5`); `laggaṁ laggitaṁ palibuddhaṁ` → *bị mắc vào, bị vướng vào, bị ràng buộc* (`cnd16:26.4`).

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `3.2`: `eka` 1, `dve` 2, `tisso` 3, `catasso` 4, `pañca` 5, `dasa` 10, `vīsa` 20, `tiṁsa` 30, `cattālīsa` 40, `paññāsa` 50 → *một, hai, ba, bốn, năm, mười, hai mươi, ba mươi, bốn mươi, năm mươi đời* (10 mục, 10 `ādisati`) rồi `jātisata` 100 → *một trăm đời*; `3.3` `jātisahassa` 1000 → *một ngàn*; `3.4` `jātisatasahassa` = 100 × 1000 = 100.000 → *một trăm ngàn* (cùng cấu tạo `dn10:2.30.2`, `dn1:1.31.2`: *một trăm ngàn đời*). `5.1` `pañca jātakasatāni` = 5 × 100 = 500 → *năm trăm bài Jātaka*, và năm tác phẩm `bhāsanto` (Jātaka, Mahāpadāna, Mahāsudassana, Mahāgovinda, Maghadeva) = 5 *khi thuyết*. `7.1`: 7 mục `tathāgatabalaṁ` = 7 *sức mạnh của Như Lai*. `7.2`: 8 động từ sau `paccuppannampi ādisati` (`ācikkhati … pakāseti`) = 8 Việt. `9.7`: 5 động từ `na iñjati na calati na vedhati nappavedhati na sampavedhati` = 5 Việt; `9.10`: 9 mục `pahīno … daḍḍho` = 9 Việt. `10.1`: 7 `pāragū` = 7 *đã đến bờ bên kia*. `14.4`: `catasso arūpasamāpattiyo` = 4. `18.1`: 7 động từ `netabbo … pasādetabbo` = 7 Việt. `21.1`: `catasso` 4, `satta` 7; `22`–`28`: bảy trú xứ, `paṭhamā … sattamī` = thứ nhất … thứ bảy (7/7). `30.11`: 5 `-vādī` = 5 Việt. `31.1`: 7 phân từ `diṭṭhaṁ … anuvicaritaṁ` = 7 Việt. `32`: 5 nơi tái sinh; `33`–`38`: 6 mẫu `ekaccaṁ puggalaṁ` = 6. `39.5`: 35 mục `-ādhimutto` (5 + 7 + 4 + 3 + 8 + 4 + 4) = 35 *nghiêng hẳn về* (+1 ở cụm kết `dhimuttaṁ`). `48.2`: `sattannaṁ dhammānaṁ` = bảy pháp; `48.3`: `satta sekkhā` = bảy bậc hữu học. Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi`; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `17.2`–`17.4` `sakko`: vừa là *thuộc dòng Sakya* (đúng nghĩa với `sakyakulā pabbajito`), vừa có thể là *có khả năng* (nghĩa gần hơn ở `pahīnabhayabheravo vigatalomahaṁsotipi sakko` sau `…pe…`). Giữ *bậc Thích-ca* ở mọi chỗ, theo `snp5.15:2.5`, không thêm *có khả năng* vì Pāli khoá ấy không nói; phần nghĩa kép nên ghi ở comment/glossary.
  2. `11.2` `vahassetaṁ bhāraṁ`: dịch lời mệnh lệnh *Hãy gánh vác gánh nặng này*; chưa chắc ai nói với ai (có thể Posāla thỉnh Đức Thế Tôn nhận gánh nặng của câu hỏi). Không thêm chủ thể vào thân kinh.
  3. `17.5` `tassa ñāṇaṁ pucchāmi`: *tassa* hiểu là người đạt Vô sở hữu xứ (theo `17.6`, `18.3`, và `snp5.15:2.5` *cho người ấy*), không phải trí của Đức Thế Tôn; nếu hiểu khác thì khoá `17.5` đổi nghĩa.
  4. `32.1`, `32.3`… `idhatthaññeva jānāti`: dịch *biết ngay khi người ấy còn ở đây*; chủ thể *người ấy* suy từ `ayaṁ puggalo` và `tiṭṭhantaṁ` (`20.4`), không có đại từ trong Pāli.
  5. `15.1` `tadaṅgasamatikkamā vikkhambhanappahānena`: *do vượt qua theo từng chi phần*, *đoạn trừ do trấn áp* theo `ps3.4:6.2` (*viễn ly theo từng chi phần*, *viễn ly do trấn áp*); thuật ngữ kỹ thuật, nên có chú giải.
  6. `38.2` Pāli `viharatī` (hiện tại), khác sáu mẫu kia (`-issatī`) và khác `mn12:42.11` (`viharissatī`); giữ nghĩa hiện tại, không thêm *sẽ*.
  7. `16.5`–`16.6` cấu trúc `yaṁ … taṅkāraṇā`: dịch thành *sau khi … ; vì lý do ấy, không có gì: là …* để lộ quan hệ lý do; không thêm ý. `16.6` Pāli không có nháy quanh `natthi kiñcī` nên dùng dấu hai chấm thay nháy.
  8. `44.2` `arūparāgena taṁ kammaṁ laggaṁ laggitaṁ palibuddhaṁ`: *Nghiệp ấy do tham vô sắc mà bị mắc vào, bị vướng vào, bị ràng buộc* (cách đọc cách thể công cụ); chưa phân xử được nếu hiểu là *được gắn với tham vô sắc*.
  9. `39.3` `tadādhipateyyaṁ` → *lấy điều ấy làm chủ đạo*: 0 tiền lệ (`an9.14:11.6` *làm người chỉ huy*); `40.1` `kammagarukaṁ paṭisandhigarukaṁ` → *xem trọng nghiệp, xem trọng sự kết sinh*: 0 tiền lệ.
  10. `7.1` `yamakapāṭihīre` → *phép song thông*, `asaṅgamappaṭihatamanāvaraṇañāṇaṁ` → *trí không dính mắc, không bị ngăn ngại, không bị che chướng ở mọi nơi*, `mahākaruṇāsamāpattiyā ñāṇaṁ` → *trí về sự chứng đạt đại bi*: 0 tiền lệ cho cả ba cụm.
  11. `14.2` `diṭṭhadhammasukhavihārissa` → *người an trú lạc ngay trong hiện tại*: tầng có nhiều dạng (*hiện tại lạc trú* 19, *an trú lạc trong hiện tại* 12…); `samāpannassa … upapannassa` → *đã chứng nhập … đã sinh vào đó*.
  12. `2.3` thêm chủ ngữ *Ngài* để tách câu cho rõ (`cnd21:13.3` không thêm); `3.2`–`3.6`, `4.2` giữ động từ *nói về* ở các mục mà Pāli chỉ còn `…`/chủ thể ngầm, để mỗi mục vẫn là một mệnh đề; `3.8`/`3.9` *Ta* (ngôi nhất `amutrāsiṁ`) vs `4.4`/`4.5` *người ấy* (ngôi ba `amutrāsi`).
  13. `31.1`, `31.9` `samāraka` → *Ma vương* (theo `cnd16:20.1`), `abhisambuddhaṁ` → *đã giác ngộ trọn vẹn* cho thống nhất với `abhisambujjhi` ở `2.3`, dù `dn29:29.1` dịch *đã hiểu thấu*. `31.9` `abhibhū anabhibhūto aññadatthudaso vasavattī` theo `an4.23:5.1`.
  14. `21.5`, `21.6` `…pe…` đứng ngay sau hô ngữ `bhikkhave`: viết *Hay lấy thọ làm nơi dính mắc, này các tỳ-kheo …* để không mở rộng phần bị lược; `vedanā` ở đây viết *thọ* (theo `cnd16`), không *cảm thọ* như `sn22.54:2.2`.
  15. Lỗi ngoài lát, báo chứ không sửa: `snp5.15:3.2` bỏ hô ngữ `posālā` (cùng kiểu `snp5.13:3.2`, `snp5.12:3.2` đã báo ở `cnd15`, `cnd16`); `snp5.15:4.4` bỏ `tato`; `an7.44:2.1`, `3.1`, `4.1` và `an9.24:2.1`, `3.1`, `4.1` bỏ hô ngữ `bhikkhave`; `an4.23:2.2`, `3.2`, `4.3`, `5.2` chèn ngoặc *(Ngài)* không có trong Pāli.

