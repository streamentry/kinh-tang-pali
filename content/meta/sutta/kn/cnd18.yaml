  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 69 khoá chênh lệch lớn nhất → khác nghĩa 2 nhóm: sửa 2 nhóm (4 khoá trong danh sách 69, cộng 3 khoá cùng cụm ngoài danh sách), giữ 65, bất định 3. SỬA (1) `42.1`, `43.1`, `43.2`, `43.3`, `49.1` `ākiñcaññasambhavaṁ`: trước *sự sinh khởi từ trạng thái không có gì* → sau *nguồn sinh khởi của trạng thái không có gì*. Theo Pāli: lời giải ở `43.1`–`43.2` xác định `ākiñcaññasambhava` là `kammābhisaṅkhāro ākiñcaññāyatanasaṁvattaniko`, tức hành tạo tác của nghiệp đưa đến Vô sở hữu xứ; vậy đó là nguồn sinh ra Vô sở hữu xứ (quan hệ sở hữu cách). Cách đọc cũ *sinh khởi từ …* đảo chiều và làm lời giải ở `43.1` tự mâu thuẫn. Bản mù độc lập cũng đọc *nguồn sinh của Vô sở hữu*. Việc này giải quyết bất định 17 ở trên. Hai khoá Pāli trùng ngoài bài, `snp5.15:4.1` và `cnd2:84.1`, còn dịch theo cách cũ; cần người điều phối rà cho khớp. SỬA (2) `20.3`, `41.3` `abhijānaṁ tathāgato`: bỏ *hoàn toàn* (Pāli không có chữ ấy; cùng cụm ở `30.1`, `31.11` và `cnd2:83.3` không có; `snp5.15:3.3` còn *hoàn toàn*, ngoài lát). GIỮ: `9.8` (bản mù đảo *nghi ngờ/nghi hoặc*; Pāli `saṁsayo vuccati vicikicchā`, `saṁsaya` là nghi hoặc, `vicikicchā` là hoài nghi, khớp `1.3`, `9.12`); `1.4`/`10.3`/`12.4` `pāragū` (bản mù *đến bờ bên kia*, bản dự án *vượt qua*, cùng nghĩa và khớp `snp5.14:1.4`, `cnd17:1.4`, `cnd2:74.4`); `21.4`, `33.2`–`38.1` (câu Pāli trùng `sn22.53:1.3` và `mn12:38.1`, dùng lại nguyên văn); `3.5`–`3.7` (bản mù *hoại/thành kiếp* cùng nghĩa *kiếp co lại/mở ra*); `13.x`, `19.x`, `42.x` các vế kệ và `17.x`, `29.x`, `46.x`, `48.x`: khác diễn đạt, cùng nghĩa. BẤT ĐỊNH: (i) `9.9` `chambhitattaṁ` *sự hoảng hốt của tâm* (tầng dịch nhất quán ở `mnd15:65.3`, `cnd9:23.10`, `cnd10:15.9`, `cnd13:11.2`, nhưng `mn128:27.4` dịch *sợ hãi*; bản mù *cứng đờ* ⟦?⟧; nghĩa Pāli ở đây có thể gần *cứng đờ, tê liệt*); (ii) `15.1` `tadaṅgasamatikkamā` *theo từng chi phần* (theo `ps3.4:6.2`, nhưng `tadaṅga` cũng có thể là *chính chi phần ấy*); (iii) `44.1`–`44.2` *sự trói buộc của hoan hỷ* so với `42.2` *hoan hỷ là trói buộc*: cùng hợp từ `nandisaṁyojana` đặt quan hệ hai cách. Review đối kháng toàn bài 245 khoá: nháy kép khớp Pāli từng khoá, dấu lược `…pe…` khớp một–một, số đời `3.2` (1, 2, 3, 4, 5, 10, 20, 30, 40, 50, 100) và `3.3`–`3.4` (1.000; 100.000) đúng; không phát hiện lỗi khác. Không có bản Anh hay bản Việt độc lập khác; `triangulation` chỉ dựa trên một lần dịch lại cùng họ công cụ nên bị giữ dưới 8,0. Lượt này không chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`; không tuyên bố technical gate pass.

