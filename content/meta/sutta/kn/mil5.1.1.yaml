  (2) Nháy đơn `‘ ’` và nháy kép `“ ”` khớp Pāli từng khoá: 107 khoá × 4 loại dấu = 428 phép, 0 lệch. Pāli của bài này để nháy kép chạy qua ranh giới khoá (mở ở `1.2` đóng ở `1.4`; mở ở `2.2` đóng ở `6.1`; mở ở `8.8` đóng ở `10.2`; mở ở `11.1` không có khoá đóng riêng đến `15.2`; mở ở `15.6` đóng ở `16.2`; mở ở `16.6` đóng ở `17.1`; mở ở `17.4` đóng ở `17.6`; mở ở `17.9` đóng ở `18.1`; mở ở `18.4` đóng ở `18.5`) và bản Việt giữ đúng như vậy; nháy đơn có ở `1.3`–`1.4`, `3.1`–`3.4`, `6.5`, `8.8`, `12.2`, `13.2`, `13.7`.
