  **Số Pāli, tự tính.** `aṭṭhanavuti rogā` (`16.2`) = aṭṭha 8 + navuti 90 = 98, viết `chín mươi tám bệnh`; cấu tạo giống `Catunnavutito`/`Ekanavutito` đã xác lập (X + 90). `dasasahassī lokadhātu` = mười nghìn thế giới (`7.2`, `7.4`, `9.2`, trùng `mil5.1.7:6.3`). `tisso sampattiyo` / `tissannaṁ sampattīnaṁ` = ba sự thành tựu (`5.2`, `7.8`, `9.10`); `tividhaggi` = ba ngọn lửa (`9.8`, `9.12`). `ime pañca janā` (`18.5`) = 5 người, và `18.4` liệt kê đúng 5 tên (Ciñcamāṇavikā, Suppabuddha, Devadatta, Nandaka, Nanda). `ubhato koṭika` = có hai đầu; `paṭhamo` (`19.1`) = thứ nhất, khớp số `1.` ở `0.4`. Không có cụm số nào thuộc loại chưa phân xử được (`Tiṁsakappasahassa`) và không có số `koṭi` hay `kappa`.

  **Tiền lệ (đếm trên tầng vi hiện có, loại tệp này).**
  Pāli trùng nguyên văn với các bài khác: đã dò 107 khoá, 13 khoá có Pāli trùng ở nơi khác (`0.1`, `0.2`, `0.3`, `2.1`, `2.3`, `4.1`, `5.1`, `13.3`, `15.3`, `16.3`, `17.5`, `18.2`, `18.9`); bản Việt của 11 khoá trùng với ít nhất một bản đã có, 2 khoá khác có chủ ý: `2.3` (tầng có 5 cách dịch khác nhau của câu này, không cách nào giữ nguyên `mahārāja` cùng `pi`; chọn một câu mới theo Pāli, giữ `Tướng quân Chánh pháp` như `mil3.2.4`, `mil5.3.4`) và `18.2` (`mil5.2.4:12.2` dùng `bạch ngài`; bài này theo `mil5.1.*` dùng `thưa Đại đức`, nên giữ cấu trúc `điều ấy được nghe nói` và đổi cách xưng hô).
  `0.1` `Milindapañha` giữ nguyên (226 trong 238 khoá; còn `Mi-lan-đà Vấn Đạo` 8, `Mi-tiên Vấn Đáp` 3). `0.2` `Meṇḍakapañha`: toàn tầng để trần 32, `Phẩm Meṇḍakapañha` 8, `Câu Hỏi Nan Đề` 4; nhưng các bài `mil5.1.*` còn lại dùng `Phẩm Meṇḍakapañha` — theo phạm vi gần nhất, nên ở khoá này bản Việt khác đa số toàn tầng, có chủ ý. `0.3` `Phẩm Iddhibala` 8/8 theo `mil5.1.*`. `0.4` giữ số thứ tự `1.` như các bài `mil5.1.*` khác.
  `Thero āha—` → `Trưởng lão nói—` (17 khoá dấu gạch ngang, còn `Trưởng lão nói:` 4); `Rājā āha—` → `Vua nói—` (15 khoá dấu gạch ngang; `Đức vua nói—` 7; `Vua nói:` 50 dùng dấu hai chấm, không chọn vì Pāli ở đây kết bằng gạch ngang). `Na hi, bhante`ti → `Không phải vậy, thưa Đại đức.` theo `mil5.1.4`, `mil5.1.7`, `mil5.1.10` (4 khoá `mil5.1.*`; toàn tầng `thưa tôn giả` 45). `Taṁ kissa hetu?` → `Vì cớ sao?` (1 tiền lệ cùng Pāli: `mil5.2.7:3.6`); `Kiṅkāraṇaṁ` → `Vì cớ gì?` như `mil5.1.2`. Phần kết lời của vua ở `18.11` dùng lại đúng cụm `ngài đã đạt đến bậc tối thượng, ưu việt nhất trong những vị đứng đầu hội chúng` của `mil5.2.4:14.9` (cùng Pāli `tvaṁ gaṇivarapavaramāsajjā`).
  Thuật ngữ, đếm đối chiếu theo Pāli (không đếm chữ Việt thô):
  `sādiyati` → `chấp nhận` (3 khoá chứa gốc này trong kn: `ud6.2` 2 khoá `chấp nhận vàng bạc`, `mil6.1.3` 1 khoá `cất giữ`; chọn `chấp nhận` cho cả nghĩa nhận cúng dường, nhận củi làm nhiên liệu, nhận việc phát sinh trở lại; Pāli chỉ dùng một gốc nên bản Việt giữ một từ). `parinibbuta` → `viên tịch` (khoá chứa `parinibb` có bản Việt: trong `mil` `viên tịch` 11, `nhập Niết-bàn` 1, khác 23; toàn kn `nhập Niết-bàn` 49, `viên tịch` 13, khác 56 — hai phạm vi cho đa số khác nhau; chọn `viên tịch` theo phạm vi gần nhất `mil5.1.7`, `mil5.1.10`, và dùng `tắt` cho `nibbuta` của lửa, gió để giữ được phép so sánh lửa tắt, gió ngừng với sự viên tịch). `anupādisesāya nibbānadhātuyā` → `cõi Niết-bàn không còn dư tàn` (4/4 khoá kn: `ud5.5`, `ud8.5`, `iti112`; `mil3.5.10` dùng `Niết-bàn vô dư`). `dhātu` (xá-lợi) và `ñāṇaratana` → `báu vật` (`ratana` trong kn: `ngọc` 53, `châu báu` 24, `báu vật` 4, `bảo châu` 2; chọn `báu vật` theo tiền lệ gần nhất `mil5.1.4:9.6` cho đúng `ñāṇaratana`).
  `titthiya` → `ngoại đạo` (41 khoá). `yakkha` → `dạ-xoa` (176/176). `māṇavaka` → `thanh niên` (18 trên 24 khoá; còn `thiếu niên` 6). `dhammatā` → `pháp tánh` (6 trên 8 khoá; còn `bản tính` 2). `vīriya` → `tinh tấn` (49/50). `mettā` → `lòng từ` (10; `tâm từ` 6, `từ ái` 5, `từ bi` 3 trên 24 khoá). `tālavaṇṭa` → `quạt lá thốt nốt` (4 trên 13 khoá chứa gốc này, còn lại là `quạt`); `vidhūpana` → `quạt`. `pariḷāha` → `nhiệt não` (`iti28`, `iti29`; 18 khoá chứa gốc này). `bhava` → `cõi sống` (`mil5.1.4:9.6`). `mahāaggikkhandha` → `khối lửa lớn` (`mil5.1.5:5.1`; `mil5.1.7:6.1` dùng `đám lửa lớn`). `dasasahassī lokadhātu` → `mười nghìn thế giới` (`mil5.1.7:6.3`; `mil5.3.2:10.3` dùng `cõi thế giới mười nghìn`). `asamasama` → `ngang bằng với bậc vô song` (`bv16:22.1`, `bv17:21.1`, `bv18:22.1`). `diṭṭhijāla` → `lưới kiến` (`mil5.2.4:14.9`, `mil7.7.4:2.2`; `mil5.1.10:1.11` dùng `màn nhìn`). `appattamānasa` → `tâm chưa thành tựu` (`bv27:11.3`; `thag3.2:1.2` dùng `tâm chưa chứng ngộ`). `kusalamūla` → `căn thiện` (`iti50` dùng `căn bất thiện` cho `akusalamūla`). `apāyagamanīya` → `dẫn đến ác thú` (trên khoá chứa gốc `apāya` bản Việt: `ác thú` 12, `đọa xứ` 14; theo ghi chú ở `mil5.1.2` trên 367 khoá `ác thú` 150, `đọa xứ` 129 — hai phép đo khác nhau về đa số, chọn `ác thú` theo phép đo rộng hơn và theo `mil5.1.3:3.1`, nơi `āpāyika` → `ác thú` còn `vinipāta` → `đọa xứ`). `Chánh Đẳng Giác`, `A-la-hán`, `Đấng Chiến Thắng`, `Như Lai`, `Đức Thế Tôn`, `tâu đại vương`, `thưa Đại đức Nāgasena` theo `mil5.1.*`. `dhammasenāpati` → `Tướng quân Chánh pháp` (22 khoá chứa gốc này; `mil3.2.4`, `mil5.3.4`). `samugghāta` → `nhổ` (`mil5.1.5:1.2` `nhổ bỏ`; `ud4.1`, `iti90` `nhổ tận gốc`). `atītasatthukaṁ pāvacanaṁ` → `lời dạy nay đã mất bậc Đạo Sư`, `siyā kho panānanda tumhākaṁ evamassa` → `có thể các thầy sẽ nghĩ rằng`, `mamaccayena` → `sau khi Ta diệt độ`, theo đúng `dn16:6.1.2`–`6.1.5` (cùng công thức).

  **Bất định đã phân xử, ghi lại để biên tập xem lại.**
  (1) Khoá `1.1` `katāvakāso nipacca garuno pāde sirasi añjaliṁ katvā`: dịch `sau khi có dịp, cúi lạy dưới chân bậc đáng kính, chắp tay đặt lên đầu`. `katāvakāso` (đã tạo cơ hội, hay đã được cho phép) và cách ngắt `pāde sirasi` (đầu chạm chân, hay chỉ `añjaliṁ sirasi`) không chắc; `garu` có thể là `bậc thầy` hay `bậc đáng kính`, chọn nghĩa hẹp hơn, không giải thích thêm.
  (2) `sādiyanā` / `sādiyati` ở `lokahitassa sādiyanā pahīnā upasantā` (`7.6`, `9.6`): đọc `lokahitassa` là sở hữu cách chỉ Đức Phật (`bậc đem lại lợi ích cho thế gian`), song song với `nibbuto aggikkhandho … na sādiyati`; cách đọc `sự chấp nhận lợi ích của thế gian` cũng có thể đúng. Chưa có tiền lệ nào cho cụm này (0 khoá).
  (3) `1.4` `ekaṁse ṭhapaya`: dịch `hãy dứt khoát đặt nó về một phía`, hiểu là chốt câu hỏi hai đầu về một phía. Tiền lệ duy nhất `mil5.1.10:1.11` dịch `đặt sang một bên` — nghĩa khác (gác lại), không theo vì `ekaṁsa` ở Pāli thường là `chắc chắn, dứt khoát`; đây là cách đọc, chưa phân xử được bằng tầng Anh.
  (4) `10.4` `bheriṁ akoṭetvā saddaṁ nibbattetī`: Pāli đã ghim viết `akoṭetvā` (không đánh), trái với `ākoṭetvā` (đánh) ở `10.2` và với lập luận của cả đoạn. Dịch `đánh trống làm phát ra âm thanh` theo mạch lập luận và nghi ngờ `a-` là dạng chính tả của `ā-`; đây là chỗ Pāli đã ghim trông như một lỗi chép, không sửa Pāli, chỉ ghi lại để người biên tập quyết.
  (5) `1.4`, `4.2`, `18.11` `paravādaniggahāya` dịch `bác bỏ luận thuyết của kẻ khác`; `parāpavāda`/`paravāda` là các lập luận phản đối của đối phương. `pasādappakāsana` ở `4.2` dịch `sự bày tỏ niềm tịnh tín` (chỉ là lời tán thán chứ không phải lý lẽ bác bỏ).
  (6) `adhikāra` dịch `việc phụng sự` (hợp từ `kata + adhikāra` nghĩa `việc phụng sự đã làm`, tức việc cúng dường, phụng sự đã thực hiện nơi Đức Phật); `mil5.1.4:6.1` dịch `katādhikāra` là `công hạnh phụng sự`. Bảng tiêu đề của tầng Anh ghi bài này là `The Question on Honors Paid To the Buddha`, tức nghiêng về nghĩa `tôn vinh`; không thay từ vì Pāli nói `adhikāra` chứ không nói `pūjā`. `avañjha`/`vañjha` dịch `không luống công`/`luống công` (`pv29:6.1` `avañjhāni … kammāni` → `chẳng hề luống công`).
  (7) `5.2`, `7.8`, `9.10`, `11.1` `dhāturatana`, `ñāṇaratana`, `ārammaṇa`, `vatthu`: dịch `báu vật xá-lợi`, `báu vật trí tuệ`, `đối tượng`, `cơ sở`; chưa có tiền lệ cho `dhāturatana` (0 khoá), và `sammāpaṭipattiṁ sevantā` dịch `thực hành chánh hạnh` — chưa chắc `sevati` ở đây là `thực hành` hay `gần gũi, nương theo`. `tisso sampattiyo` dịch `ba sự thành tựu`, không thêm lời giải thích là ba thành tựu nào, vì Pāli không nêu.
  (8) `11.1` `sīlasamādhipaññāvimuttivimuttiñāṇadassanaparibhāvitaṁ`: đọc `paribhāvita` (đã được thấm nhuần) đi với `dhāturatana` ở đầu chuỗi, còn `dhammañca vinayañca anusiṭṭhañca` là các đối tượng khác của `ṭhapayitvā … satthāraṁ`; trong bản Việt cả chuỗi đứng cùng nhau trước `làm bậc Đạo Sư`, nên người đọc có thể hiểu `paribhāvita` bao cả chuỗi. Không phân xử thêm.
  (9) `12.1` `diṭṭhañcetaṁ … anāgatamaddhānaṁ`: dịch `đã thấy trước điều này trong thời vị lai`; có thể hiểu `diṭṭha` là `đã chứng kiến` (về điều đã được nêu) hơn là `đã thấy trước`, nhưng ngữ cảnh `anāgata` (thời vị lai) hợp cách đọc thứ nhất.
  (10) `12.3`: chuỗi từ chê `micchā abhūtaṁ vitathaṁ alikaṁ viruddhaṁ viparītaṁ` dịch `sai, không có thật, trái với sự thật, giả dối, đối nghịch, đảo ngược`; các từ gần nghĩa nhau nên cách chia có phần tuỳ ý (không có tiền lệ cho cả chuỗi; `viparīta` → `đảo ngược` theo `mil5.5.2`).
  (11) `18.1` `Kati nu kho te, mahārāja, manussā, ye etarahi mahāpathaviṁ paviṭṭhā, atthi te tattha savaṇaṁ`: dịch thành hai câu hỏi (số người đã chìm vào đại địa; vua có nghe nói không). `te` có thể là đại từ của `manussā` hay sở hữu cách `te` (của ngài); không đổi nghĩa chính. `paviṭṭho` dịch `chìm vào lòng đất`, hiểu là bị đất nuốt; chưa có tiền lệ cho `pathaviṁ paviṭṭho` (0 khoá). `āsādayitvā` (`17.1`) dịch `xúc phạm` (0 tiền lệ).
  (12) `18.3` Pāli kết bằng dấu hỏi nhưng câu là mệnh lệnh (`sāvehi`); dịch thành câu mệnh lệnh, kết bằng dấu chấm. `18.4` `suppabuddho ca sakko` dịch `Suppabuddha dòng Sakya`, hiểu `sakko` là người Sakya (không phải Sakka, vua cõi trời). `ciñcamāṇavikā` giữ nguyên dạng tên (`ja472:15.1`).
  (13) `8.6` `vātoti samaññā`: Pāli không đặt dấu nháy quanh `vāto` nên Việt cũng không thêm nháy, viết `cách gọi là gió`. `6.3` Pāli không có dấu hỏi nhưng câu trả lời ở `6.4` (`Không phải vậy`) cho thấy là câu hỏi; dịch thành câu hỏi.
  (14) `ābhoga` (`8.3`, `10.3`) dịch `sự lưu tâm` (0 tiền lệ); `āsādayitvā`, `kimikula` (dịch `bầy giun`), `jaṭā` (dịch `rễ con`) cũng chưa có tiền lệ.

  **Lỗi bản nháp đã bắt:** bản nháp đầu `15.4` viết `khi họ không chấp nhận … trong bụng họ` (đổi đối tượng sang người, trong khi `kimayo` sinh ở cả súc vật); đã sửa thành `những chúng sinh không chấp nhận ấy`. `15.6` bản nháp đầu viết `của xá-lợi và của đối tượng của trí` (ba chữ `của` liền nhau); đã sửa thành `đối tượng trí tuệ`. `17.2` và `18.2` bản nháp đầu viết `có nghe nói`, lệch với tiền lệ `điều ấy được nghe nói`; đã sửa để theo cấu trúc tiền lệ. Phép so Pāli trùng với bài khác bắt được hai khoá khác tiền lệ (`2.3`, `18.2`), cả hai được chủ ý giữ khác như đã ghi ở mục tiền lệ.

