notes: |-
  Đợt 19, làn 68. Dịch từ Pāli root commit đã ghim, đủ 91/91 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; vì vậy người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung kệ (xem bất định 1).

  **Tiêu đề.**
  - `0.2` “Bộ Tạp Tập” và `0.3` “Phẩm Ruộng Lúa”: dùng lại nguyên văn các bài cùng bộ, cùng phẩm (`ja484`, `ja486`, `ja492`), là khoá Pāli trùng nguyên văn.
  - `0.4` “13. Kinh Phần Ăn Khất Thực Chuyền Tay”: `Bhikkhāparamparā` = phần khất thực (`bhikkhā`) được chuyển nối tiếp (`paramparā`) qua nhiều tay (từ người này sang người khác, theo chuỗi trong kệ: người cho → bà-la-môn → đạo sĩ → tỳ-kheo). Tầng không có tiền lệ cho tên này (0 khoá); đặt tên theo nghĩa các thành tố và khuôn “Kinh <tên>” của các bài cùng phẩm (`ja490:0.4`, `ja491:0.4`, `ja492:0.4`). Số `13.` ở `0.4` và `terasamaṁ` ở `21.1` đều là 13 ⇒ “thứ mười ba” khớp. `22.1` “Bộ Tạp Tập đã hoàn tất.” theo khuôn `ja483:20.1` (“Bộ Mười Ba Bài Kinh đã hoàn tất.”); `23.1` “Tóm lược:” theo `ja483:21.1`.
  - `24.1`–`24.4` là kệ tóm lược (uddāna) tên các bài trong bộ: giữ nguyên phiên âm tên riêng như `ja483:22.1`–`22.4` giữ `Varaamba`, `Kuṭhāri`, `Sarabha`...; chỉ dịch các từ nối `atha` → “rồi”.

  **Tiền lệ dùng lại nguyên văn: đã dò 91 khoá với Pāli toàn tầng (so sau khi bỏ dấu câu và hạ chữ hoa, từ 12 ký tự trở lên): 10 khoá có Pāli trùng ở bài khác (`0.2`, `0.3`, `1.3`, `2.4`, `5.4`, `8.1`, `9.2`, `14.4`, `17.4`, `19.4`); sau khi dùng lại, bản Việt của tôi còn khác 3 khoá trong số 10 (`1.3` chỉnh nhẹ, `8.1` khác có chủ ý, `19.4` xem dưới). Đã dùng lại nguyên văn (có chỉnh dấu câu cuối theo ngữ cảnh) cho các khoá sau: `0.2`, `0.3`; `1.3` theo `thi-ap11:6.3`, `tha-ap14:10.3` (“đầy đủ lầu gác tuyệt hảo”, 2 khoá; có chỉnh thành “từng đủ đầy lầu gác tuyệt hảo” cho hợp với `1.4` “từng quen dùng giường lớn”); `2.4`, `5.4`, `14.4`, `17.4` theo `ja398:1.2`, `ja451:5.2` (“được rưới nước canh thịt tinh khiết”, 2/3 nơi cùng Pāli; `ja346:3.2` là cách khác “chan nước xúp thịt thơm ngon tinh sạch”, bỏ); `9.2` theo `dhp395:2` (“gầy gò, gân mạch lộ rõ”; `mn89:12.2` dịch `dhamanisanthatagatte` là “gân nổi khắp mình” nhưng đó là danh từ ghép khác, nên theo khoá Pāli trùng nguyên văn). Khác có chủ ý, đã đọc: `8.1` `Āraññikassa isino` trùng nguyên văn với `ja271:1.1` và `tha-ap214:1.1`, nơi bản Việt dịch “Hỡi vị sa-môn sống trong rừng” (hô cách); ở đây `isino` là sở hữu cách của chủ từ được nhắc tới (câu nối thẳng với `8.2`–`8.4`, “tôi nên dâng thức ăn”), nên không dùng được nguyên văn. Và `19.4` với `sn10.12:12.4`, `an5.36:4.2`, `snp1.10:16.4`, `iti26:4.4`, `vv56:5.4` (`yattha dinnaṁ mahapphalaṁ` cho 5 cách dịch khác nhau: “chỗ nào bố thí được quả lớn”, “nơi nào vật bố thí cho kết quả to lớn”, “nơi mà bố thí có quả lớn”, “nơi vật bố thí có quả lớn”, “nơi vật cho ấy có quả lớn”); chọn “nơi nào bố thí có quả lớn” là dạng gần nhất với `snp1.10:16.4` và `iti26:4.4`, không trùng byte với khoá nào, nhưng đúng cùng một ý.

  **Trùng nguyên văn trong chính bài:** 91 khoá, 4 nhóm Pāli trùng (sau khi nén khoảng trắng và hạ chữ hoa): `2.4`=`5.4`=`14.4`=`17.4` (“suciṁ maṁsūpasecanaṁ”, bản Việt giống hệt cả 4); `3.1`=`6.1`=`15.1` (“Taṁ tvaṁ bhattaṁ paṭiggayha”, giống hệt cả 3); `4.4`=`8.4`=`13.4` (“dātumarahāmi bhojanaṁ”, giống hệt cả 3); `3.4`=`6.4`=`15.4` (“koyaṁ dhammo namatthu te”): 3 khoá nhưng bản Việt khác có chủ ý đúng một chữ, “nơi ngươi” / “nơi ông” / “nơi ngài”, vì người được hỏi khác nhau (người đã nhường cơm cho thầy bà-la-môn, vị bà-la-môn, vị tỳ-kheo) và `te` ở mỗi khoá chỉ người khác; đây là diễn đạt khác theo ngôi, không phải lệch nội dung. Tổng: 1 nhóm (3 khoá) mà bản Việt khác, 3 nhóm giống hệt.

  **Số Pāli:** không có số lượng cần tính. Số `13.` ở `0.4` và `terasamaṁ` ở `21.1` đều bằng 13. `eko` (10.1) và `ekako` (15.2) = “một mình”, không phải số đếm.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `maṁsūpasecana` (2.4, 5.4, 14.4, 17.4): 5 khoá chứa `maṁsūpasec…` trong tầng, 2 khoá cùng Pāli với bài này (`ja398:1.2`, `ja451:5.2`) dịch “được rưới nước canh thịt tinh khiết”, dùng lại; `ja346:3.2` và `dn3:2.10.2` là cách khác.
  - `kamaṇḍalu` (17.2) → “bình nước”: 11 khoá chứa `kamaṇḍalu…` trong tầng; cùng cách với `sn7.9:1.6` (“tay phải cầm bình nước”), `an10.176:1.5`.
  - `paṅkadanta` + `rajassira` (9.4) → “răng cáu bẩn, đầu dính bụi bặm”: cùng cách với `ja469:5.2` (cùng hai từ) và `ja377:3.1`, `ja487:1.1` (“răng cáu bẩn”); `snp5.1:5.2` là “răng đầy bợn, đầu đầy bụi” (cách khác, 1 khoá).
  - `parūḷhakacchanakhaloma` (9.3) → “lông nách, móng và lông trên thân mọc dài”: tầng có 5 khoá chứa `parūḷhakaccha…` (`sn3.11:2.1`, `ud6.2:2.1`, `ja395:2.1`, `mil5.3.1:10.1`), không đồng nhất (“nách rậm, tóc rậm, móng tay dài”, “lông nách và lông móng dài”, “trụi lông, trụi lông nách, trụi móng”); chọn cách đọc theo cấu tạo `kaccha` (nách) + `nakha` (móng) + `loma` (lông), `parūḷha` (đã mọc dài) bao trùm cả ba.
  - `rathesabha` (19.2) → “bậc chiến xa đệ nhất”: cùng cách với `ja260:1.4` (“bậc chiến xa đệ nhất”); 21 khoá chứa `rathesabh…`, cách dịch không đồng nhất (`mn92:16.18` “bậc tối thượng giữa các chiến xa”, `snp2.7:21.2` “vị chúa tể xe”).
  - `isi` → “đạo sĩ” (6.2, 8.1, 9.1, 14.3, 17.3, 20.3): cùng cách với `ja492:17.1` (`jaṭila` → “đạo sĩ”, 26/43 khoá); `pv42:10.4` dịch `isi` là “đạo sĩ”.
  - `giddha` (20.1–20.3) → “tham đắm”: 35 khoá chứa `giddh…`; `sn3.7:3.2` “tham lam, mê muội” dịch `giddhā` kèm `mucchitā`; ở đây `giddhā` đứng riêng nên dùng “tham đắm”.
  - `sapariggaha` (18.2) → “còn sở hữu”: tầng có 9 khoá chứa `sapariggah…`, đa số ở `dn13` dịch “bị ràng buộc bởi sự sở hữu”; ở đây đối lập với `samamā` (“còn xem là của mình”), và `anādānassa sādāno` (13.3) → “vị không chấp thủ / kẻ còn chấp thủ”.
  - `amama` (13.2) → “không xem gì là của mình”: tầng có 1 khoá `ud3.1:4.3` dịch “vị không còn ‘của ta’”; không dùng nháy đơn vì Pāli ở 13.2 và 18.2 không có nháy đơn (phép so từng khoá).
  - `akiñcana` (16.3) → “không sở hữu gì”: 42 khoá chứa `akiñcan…`; `dn30:2.6.16` “không sở hữu gì”.
  - `bhāvitatta` (8.3) → “đã tu tập tự thân”: cùng cách với `mn56:29.39` (“bậc Thánh đã tu tập tự thân”) và `dn16:4.41.11`, 54 khoá chứa `bhāvitatt…`.
  - `akhettaññū` (6.3) → “không biết đâu là ruộng phúc để bố thí”: tầng 5 khoá (`an9.35` dịch “không biết rõ địa bàn”, nghĩa bóng khác); ở đây đi với `dānassa` (của bố thí) và kệ 19–20 nói về nơi bố thí có quả lớn, nên chọn nghĩa “ruộng” (khetta) của bố thí.
  - `kiccākicca` (4.2, 20.2) → “việc nên làm và không nên làm”; `byāvaṭo` (4.2) → “lo liệu”: tầng 14 khoá chứa `byāvaṭ…` (`dn21:1.9.4` “bận”, `ja319:2.3` “bận lòng”); ở đây là bà-la-môn cố vấn cho vua, nên “lo liệu mọi việc” hơn là “bận”.
  - `bilāli`, `takkala`, `āluka`, `lamba` (11.1–11.2): giữ phiên âm như `ja446:1.1` giữ `takkala`, `āluva` (“củ takkala”, “khoai āluva”); `bilāli` 0 khoá, `lamba` với nghĩa rau củ 0 khoá, `āluka` 0 khoá trong tầng.
  - `sāmāka` + `nīvāra` (11.3): `snp2.2:1.1` dịch `sāmāka` “kê”, `ja346:3.3` dịch `nīvāra` “lúa cỏ hoang dại”; ở đây dùng “kê sāmāka và lúa nīvāra” để giữ phiên âm cho nīvāra.
  - `badara` + `āmalaka` (12.2) → “táo ta”, “me rừng”: `an3.63:3.3` “quả táo ta”; `tha-ap284:2.1`, `tha-ap440:1.1` “trái me rừng”.
  - `bhisa` (12.1) → “ngó sen”: tầng không có khoá dùng từ này (0 khoá), chọn theo nghĩa Pāli (thân rễ non của sen).
  - `namatthu te` (3.4, 6.4, 15.4) → “đây rốt cuộc là lẽ gì nơi …”: cùng cách đọc với `ja474:4.4` (“đây rốt cuộc là lẽ gì nơi ngươi”).

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 9 cặp (1.1/3.4, 4.1/4.4, 5.1/6.4, 7.1/8.4, 9.1/10.4, 11.1/13.4, 14.1/15.4, 16.1/18.4, 19.1/20.4); Việt đúng như vậy, lệch 0/91 khoá cả `“`, `”`, `‘`, `’`, `…`, `(`, `)`, `"`. Nháy đơn: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (phép so “…pe…” chạy rỗng vì Pāli không có lược). NFC 91/91 khoá, 0 khoá rỗng, 0 khoảng trắng thừa. Chữ số chỉ có ở `0.4` (“13.”). Pāli lọt sang Việt chỉ có ở tên riêng/tên củ ở `11.1`–`11.3` và `24.1`–`24.4` (cố ý giữ phiên âm). Lỗi đã bắt khi tự kiểm: bản nháp đầu đặt nháy đơn `‘của ta’` ở `13.2` và `18.2` trong khi Pāli ở hai khoá đó không có nháy đơn; phép so từng khoá bắt được và đã đổi cách diễn đạt.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ nội dung kệ, không từ văn xuôi (không có trong tầng Pāli đã ghim). 1–3: một người đã dâng cơm cho người nhận (người nhận là người có dáng vẻ mảnh mai, từ xứ vào rừng) rồi hỏi vì sao người ấy đem cho thầy bà-la-môn; 4: người nhận đáp; 5–6: hỏi vị bà-la-môn; 7–8: vị bà-la-môn đáp; 9–10: hỏi vị đạo sĩ; 11–13: vị đạo sĩ đáp; 14–15: hỏi vị tỳ-kheo; 16–18: vị tỳ-kheo đáp; 19–20: lời kết (người hỏi). Danh tính của người hỏi 1–3 (và có phải cùng người hỏi 5–6, 9–10, 14–15 hay không) không phân xử được từ kệ, nhất là vì `5.3` nói `Rājā te bhattaṁ pādāsi` (“nhà vua đã dâng cho ông món cơm”) với `rājā` ở ngôi thứ ba. Vì vậy bản Việt dùng “ta” chỉ ở khổ 2 (khi người nói tự xưng vì “thương mến”), còn các khoá khác dùng “tôi”/“ngươi”/“ông”/“ngài” theo vị thế người được hỏi; đây là suy luận từ nội dung.
  2. `vaḍḍhamodana` (2.2): dịch “món cơm đầy đặn”. Có thể là “cơm đã được dọn đầy/nhiều phần” (`vaḍḍha`, dạng của `vaḍḍheti` = dọn thức ăn) hoặc “cơm tăng bổ”; tầng có 0 khoá chứa từ này, không phân xử được.
  3. `vicitaṁ bhattaṁ` (2.3): dịch “đã được chọn lọc” (cơm gạo `sālī` đã lặt bỏ hạt xấu); `dn3:2.10.2` có `vicitakāḷaka` “bỏ hết hạt đen”, đúng ý.
  4. `āmantanīyo` (4.3): dịch “đáng được thỉnh hỏi”; có thể là “đáng được mời” hoặc “đáng được gọi/xưng hô trân trọng”; tầng có 0 khoá chứa từ này.
  5. `gadhito` (7.2): dịch “đắm đuối nơi gia cư”; `gharesu` là số nhiều “các nhà”, hiểu là đời sống gia đình.
  6. `khaṇantālukalambāni` (11.1): tách thành `khaṇanta` (đào) + `āluka` + `lamba`; `lamba` có thể là tính từ “rủ xuống” bổ nghĩa củ/quả, nhưng không có tiền lệ trong tầng; giữ như hai tên củ.
  7. `dhunaṁ sāmākanīvāraṁ, saṅghāriyaṁ pasāriyaṁ` (11.3–11.4): `dhunaṁ` hiểu là “giũ, đập” (`dhunāti`); `saṅghāriyaṁ` “gom lại” và `pasāriyaṁ` “trải ra”; tầng có 0 khoá chứa hai từ này; cũng có thể là tên hai loại (không phải động từ), nên không thêm “phơi” hay “nấu” vào bản Việt.
  8. `Paccanīkamahaṁ maññe, yo dātāraṁ nimantaye` (18.3–18.4): dịch “tôi cho là điều trái ngược, kẻ nào lại mời chính người bố thí”; cũng có thể đọc `dātāraṁ` là “người cho (mình thức ăn)” và `nimantaye` là “mời (người ấy) ăn”; cùng một hướng nghĩa (người đang cho thì không nên bị mời).
  9. `Ete hi dātumarahanti` (18.1): dịch “Chính những người này nên cho”; `arahanti` là “xứng đáng / nên”, và ở các khoá 4.4, 8.4, 13.4 dịch “nên dâng”, đồng nhất.
