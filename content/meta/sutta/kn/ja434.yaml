notes: |-
  **Tên phẩm, tự đo lại.** `Navakanipāta` → *Bộ Chín Bài Kệ* **5/5** trong Jātaka
  (`ja431`, `ja433`, `ja435`, `ja436`, `ja437`); `Gijjhavagga` → *Phẩm Hươu* **5/5**.
  `:0.4` theo khuôn *N. Kinh Tên* đã có (ja433 *7. Kinh Lomasakassapa*, ja431 *5. Kinh
  Haritaca*). Cùng mâu thuẫn chưa giải với *Bộ … Bài Kinh* của BRIEF_VI3 §11 — xem `notes`
  của `ja405`.

  **Hai tên chim: chỗ phải đoán, và tôi ghi rõ là đoán.** `sakuṇa` = một loài chim;
  `cakkavāka` = vịt trời đỏ (tầng `name/` của SuttaCentral đặt `ja434` là *The Red-Ducks*).
  Tôi dịc *chim én* và *vịt trời*, nhưng **0 tiền lệ** trong tầng Việt cho hai từ này
  (đã grep: không có `cakkavāka` hay `sakuṇa` nào được dịch trước đây). Tên riêng trong
  tiêu đề thì giữ Pāli theo tiền lệ (*8. Kinh Cakkavāka*).

  **`:2.5` là `(…)` — Pāli vốn đã là `(…)`, không phải khoá bỏ trống.** Tôi dịch y nguyên
  `(…)`, khớp với tiền lệ `dn16` (6 chỗ) và khớp luôn dấu lược mà `_hvi.py` kiểm.

  **Ba câu khó.** `1.1` `Kāsāyavatthe` — tôi hiểu là nơi trú của bóng hạc Kāsāya (hạc
  lớn đứng trên bùn), nên dịch *Ở nơi trú của loài hạc Kāsāya*; đây là cách đọc của tôi,
  không phải điều từ điển xác nhận. `1.3` `Kaṁ aṇḍajaṁ aṇḍajā mānusesu` — tôi dịch theo
  cách hỏi về quả trứng của loài người, giữ nguyên vị ngữ hỏi của Pāli. `6.3`–`6.6` là
  lời của kẻ săn bắn nói về việc mình ăn thịt, `9.1`–`9.4` là lời dạy kết; hai đoạn
  đó tôi dịch theo lời thoại, không thêm tình tiết nào.

  **Không có tầng Anh.** 0/44; `ja434` cũng không nằm trong 83 tệp `ja` đã ghim.
  **Sửa lan 2026-10-13** (accuracy fix): `6.2` `Annāni ca loṇiyateliyāni` bản cũ *cả thứ khác nữa, cả nước bọt lẫn phân* → *cùng các món ăn nấu với muối và dầu* (`loṇiya` = muối, `teliya` = dầu; tiền lệ `ja451:4.4` `loṇiyateliyaṁ` = *món nấu với muối và dầu*; Pāli không có nghĩa nước bọt hay phân); `6.1` `maṁsāni phalāni bhuñje` *Tôi cũng ăn thịt như trái cây ấy* → *Tôi cũng ăn thịt, ăn trái cây* (hai món ăn song song, không phải so sánh). `2.2` `Anubbate cakkavāke vadanti` bản cũ *hai vịt trời ấy nói* → *được gọi là những con vịt trời trung thành* (`vadanti` là *người ta gọi*, `cakkavāke` là tân ngữ chứ không phải chủ ngữ: chính hai vịt trời đang nói ở `amhe`); `2.1` *Chúng tôi ở loài người thì sinh ra từ loài người* (Pāli không nói chuyện sinh ra) → *Giữa loài người, chúng tôi, hỡi kẻ hại người* (`manussahiṁsa` là hô cách gọi con quạ; chưa chắc về nghĩa chính xác của `hiṁsa` ở đây, giữ sát chữ); `2.3` `dijesu` *giữa loài người* → *giữa loài chim* (`dija` = sinh hai lần = chim). Chưa sửa vì ngoài phạm vi lượt này nhưng nghi ngờ: `1.3`–`1.4` (`aṇḍajaṁ aṇḍajā` là loài sinh từ trứng = chim, không phải *quả trứng do người ta sinh ra*), `6.4` `saṅgāmamukhaṁ` *khẩu đội* (là *mũi giáp trận*), và đoạn nói về `Kāsāyavatthe` ở phần ghi chú cũ phía trên đã lỗi thời.
  Sửa lan 2026-10-13 (accuracy fix, thực hiện các điểm nghi ngờ ở mục trên):
  `1.3`–`1.4` "Trong những quả trứng do người ta sinh ra, thì đó là quả nào,
  chúng khen ngợi phần gốc của nó — hãy kể ra đi, hỡi người tốt lành" → "Giữa
  loài người, hỡi những loài sinh từ trứng, loài sinh từ trứng nào / được ca
  ngợi về dòng dõi? Hãy nói điều ấy đi." Căn cứ: aṇḍaja = loài sinh từ trứng
  (không phải quả trứng; tiền lệ ja165:1.2, ja525:47.2, sn29.2 — luôn "loài
  sinh từ trứng"), mānusesu = giữa loài người, jātiṁ = dòng dõi, tadiṅgha
  brūtha = "hãy nói điều ấy đi" (iṅgha là tiểu từ thúc giục, Pāli không có
  "người tốt lành"); câu trả lời ở `2.1`–`2.2` ("giữa loài người, chúng tôi
  được gọi là những con vịt trời trung thành") khớp với cách hiểu người ta ca
  ngợi. Bất định còn lại: aṇḍajā ở `1.3` tôi đọc là hô cách (con quạ gọi hai
  vịt trời); nếu là chủ cách thì "loài sinh từ trứng ca ngợi" — nghĩa chung
  của câu hỏi không đổi. `6.4` "như kẻ hùng mạnh thắng được khẩu đội trong
  trận chiến" → "như dũng sĩ thắng được mặt trận" (saṅgāmamukhaṁ = đầu mặt
  trận, không phải khẩu đội; sūro = dũng sĩ theo ja182:1.1, ja227:1.1,
  ja517:14.2). `2.5` `(…)` giữ nguyên: Pāli có `(…)` đúng khoá này. Đoạn "Ba
  câu khó" ở phần trên về `Kāsāyavatthe` và lời "kẻ săn bắn" ở `6.3`–`6.6` là
  ghi chú cũ lỗi thời: `6.1`–`6.6` là lời con quạ nói với hai vịt trời.
