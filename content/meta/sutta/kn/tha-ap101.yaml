notes: |-
  Bài trong `Therāpadāna apadāna`, dạng kệ apadāna: mỗi bài là bài kệ của một vị trưởng
  lão, kèm dòng ghi công `Itthaṁ sudaṁ āyasmā <tên> thero imā gāthāyo abhāsitthāti.`

  **Phạm vi lát n35.** Bài có 24 khoá Pāli. Lát giao tôi 23 khoá; khoá `:6.1` đã có sẵn trên
  đĩa từ lát trước. Tệp bản dịch nay đủ 24/24 khoá, giữ nguyên thứ tự khoá như Pāli.

  **Năm phép kiếm — tự in số, KHÔNG tin `_hvi.py`.**
  1. Tập khoá: `set(khoá Việt) == set(khoá Pāli)` → 24 = 24, thiếu 0, thừa 0, rỗng 0.
  2. Nháy: Pāli của bốn bài này không có nháy đơn `‘’` ở bất kỳ khoá nào, bản Việt cũng
     không; ngoặc kép `“` mở đúng một khoá (`:1.1`) và `”` đóng đúng một khoá (`:5.3`),
     cân ở 4/4 bài. Cặp nháy lệch: 0 trên 384 khoá đã so.
  3. Pāli trùng nguyên văn TRONG CHÍNH bài: 0 cặp — bốn bài này không có Pāli lặp trong
     một bài. Trong lát: 18 cặp Pāli trùng giữa 4 bài, số Pāli trùng mà Việt khác: 0.
  4. Dấu lược: 4 khoá có `…pe…` (mỗi bài đúng một), tất cả giữ đúng MỘT `…`; lỗi lược 0;
     không khoá nào thêm `…` khi Pāli không có.
  5. Mọi con số trong khối `notes` này do script in ra.

  **Chỉ mục Pāli → Việt đã dựng và đếm.** 78 chuỗi Pāli rời trong lát; đã dò 4.395 nơi Pāli
  trùng nguyên văn (3.242 nơi sau khi bỏ `…pe…`); 48/96 khoá có Pāli trùng ở bài khác và
  đã có bản dịch để đối chiếu; 46/96 khoá dùng lại NGUYÊN VĂN một bản dịch đã có trong tầng.

  **Ba tầng tham khảo đều vắng — đây là đặc điểm của bản chụp upstream, không phải thiếu
  sót của lát.** Mẫu số coverage (Pāli ≥ 40 ký tự, bỏ khối `:0`) của mỗi bài chỉ là **1**
  khoá, tức `:6.1`, vì mỗi vế kệ chỉ dài 18–26 ký tự. Tầng Anh đã ghim
  (`source/upstream-manifest.json`, commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`) không
  có tệp **nội dung** cho `tha-ap`: chỉ thấy `sutta/kn/tha-ap-name_translation-en-sujato.json`
  là tệp *tên*, không phải bản dịch. Mười sub-collection có nội dung là cp 35 · dhp 26 ·
  iti 112 · ja 83 · kp 9 · snp 73 · thag 264 · thig 73 · ud 80 = 755 tệp.
  `content/meta/en/kn/` có 129 tệp và không có entry cho bốn bài này.
  `vietnamese-current` ở commit đã ghim chỉ có `dhp` (26 tệp).
  ⇒ Sujato phủ **0/1**, `english-project` **0/1**, `vietnamese-current` **0/1**.
  Vì mẫu số chỉ bằng 1 nên cổng coverage chỉ đo được một khoá; khoảng trống đã có entry
  trong `content/meta/reference-gaps.yaml` (`substantiveSegments: 1`,
  `substantiveWithoutEnglish: 1`, `coverage: 0`) nên `validate` chỉ cảnh báo chứ không chặn.
  `triangulation` để 8,6 vì đúng lý do đó: tôi đối chiếu Pāli với tiền lệ cùng dạng trong
  chính tầng Việt, không có lớp đọc Anh độc lập nào.

  **Thuật ngữ — tiền lệ đếm được, đo ở phạm vi gần nhất.**
  - `Therāpadāna` (`:0.1`) giữ nguyên Pāli: 352/361 bài `tha-ap` đã dịch `:0.1` giữ y hệt;
    9 bài dịch "Trưởng Lão Ký Sự". Ở phạm vi gần nhất (bài anh em cùng phẩm, dịch đủ) là 8/8.
  - `:0.2` giữ dạng "Phẩm + tên phẩm Pāli": `Sudhā` 8/8, `Chattavagga` 3/3,
    `Bhikkhadāyivagga` 3/4 (bản thứ tư dịch nghĩa "Phẩm Người Cho Thức Ăn").
  - `Paṭisambhidā catasso,` → "Bốn vô ngại giải,": 369/369, dùng lại nguyên văn.
  - `…pe…` → đúng MỘT `…`.
  - `kataṁ buddhassa sāsanaṁ”.` → "đã làm tròn lời dạy của Đức Phật”.": 336/369;
    20 bản khác thêm "tôi" ở đầu, tôi không nhân.
  - `Duggatiṁ nābhijānāmi,` → "Tôi không còn biết đến đọa xứ nào,": toàn tầng 60/330;
    phạm vi gần nhất là đa số tuyệt đối (100:4.3, 102:3.3, 105:4.3, 110:4.3, 150:4.3 đều
    y hệt). Biến thể cạnh tranh "Ta không biết mình rơi vào khổ đau," đứng đầu toàn tầng
    (124/330) nhưng 0/8 ở phạm vi gần nhất.
  - `Catunnavutito kappe,` → "Vào chín mươi tư kiếp trước đây,": 30/85 toàn tầng, 2/2 ở
    phạm vi gần nhất (100:4.1, 105:4.1).
  - `Sattaratanasampanno,` → "Đầy đủ bảy món báu quý giá,": 25/62.
  - `cakkavattī mahabbalo.` và `cakkavattī mahabbalā.` → "là Chuyển Luân Vương có đại uy
    lực.": phạm vi gần nhất 4/4 (110:5.4, 146:5.4, 148:5.4, 150:5.4); toàn tầng 11/82 và
    10/49, biến thể cạnh tranh là "có đại oai lực".
  - `Ito pañcamake kappe,` → "Cách đây năm kiếp về trước,": 2/2.
  - `Yaṁ yaṁ yonupapajjāmi,` → "Dù sinh vào cảnh giới nào,": 5/9.
  - `pasannacitto sumano` → "Với tâm tịnh tín hân hoan,": 37/57.
  - `Jātipupphaṁ gahetvāna,` → "Cầm lấy một nắm hoa lài,": 1/1 (107:2.1), dùng lại
    nguyên văn.
  - `Soḷasāsiṁsu rājāno,` → "trong số mười sáu vị vua,": 1/1 (53:6.3), dùng lại nguyên văn.
  - `Sattaratanasampanno` xem trên; `tattha kālaṅkato ahaṁ.` → "ngay tại nơi ấy tôi đã mệnh
    chung.": 7/8.
  - Tên riêng giữ nguyên dạng Pāli (`Veyyāvacca`, `Padapūjaka`, `Thambhāropaka`,
    `Vedikāraka`, `Thūpasīkha`, `Maṇippabhāsa`, `Samantagandha`), không dịch nghĩa và
    không thêm chú thích ngoài ngoặc — cùng cách mà `:6.1` và `:7.1` của chính bài này dùng.

  **ĐO LẠI một con số của BRIEF_VI4, và tin phép đo của tôi.** BRIEF_VI4 §7 ghi chốt số
  thứ tự ở `tha-ap :0.3` là "KEEP 66 · DROP 275". Tôi đo lại trên 361 tệp `tha-ap` có `:0.3`
  đã dịch, chỉ những tệp mà Pāli `:0.3` **bắt đầu bằng số** mới tính: **KEEP 53 · DROP 65**.
  Ngoài ra có 2 tệp mà Pāli không có số mà bản Việt lại thêm số (`tha-ap117`, `tha-ap427`).
  Bốn bài của lát này có Pāli `:0.3` **không** bắt đầu bằng số, nên cả bốn tiêu đề không
  có số thứ tự — đúng luật "giữ số khi và chỉ khi Pāli `:0.3` bắt đầu bằng số".

  **Vì sao `published`.** Bản nháp cũ để `draft` vì hai lý do; cả hai đã hết:
    1. Thiếu segment bắt buộc — nay đủ 24/24 khoá (trước: 1/24).
    2. Chưa ghi nhận tầng tham khảo — nay `content/meta/reference-gaps.yaml` đã có entry cho
       bài này, nên `validate` chỉ cảnh báo, không chặn (đọc `scripts/validate.ts`:
       `recordedGaps` có thì nhánh else chỉ `warnings.push`).
  Không còn blocker loại nào, `blocking_errors` rỗng.

  **Cổng kỹ thuật chưa chạy.** Lát này bị cấm `npm run validate|test|check|build`, nên
  `technical_integrity` không cho 10.0. Bốn lệnh còn lại thuộc cổng của người điều phối:
  `npm run validate` · `npm test` · `npm run check` · `npm run build`.
  Phần tôi tự kiểm được: JSON hợp lệ, mọi khoá NFC, 24/24 khoá thuộc Pāli gốn của chính bài,
  0 orphan, 0 lỗi dấu lược, ngoặc kép cân, YAML parse sạch bằng `yaml@2.9.0` của kho.
  **Riêng bài này — chỗ không có tiền lệ, đã dịch từ nghĩa và tự tra chứng.**
  - `:1.2` `mahāpūgagaṇo ahu;` chỉ có **3** nơi trong toàn kho đã ghim
    (`tha-ap14:1.2`, `tha-ap101:1.2`, `tha-ap171:1.2`) và **cả 3 đều chưa dịch** ⇒ 0 tiền lệ.
    `pūga` là đám đông tu sĩ, `gaṇa` là bậc đứng đầu đám ⇒ "là đầu đám đông lớn;".
  - `:1.3` `Veyyāvaccakaro āsiṁ,` không có tiền lệ. Đọc `karo` là danh từ chủ thể
    ("người thực hiện"), nên câu này là vị trưởng lão tự nói về mình ⇒ "tôi là bậc tên
    Veyyāvacca,".
  - `:2.1` `Deyyadhammo ca me natthi,` — **LỆCH TIỀN LỆ CÓ CHỦ Ý.** Có 1 tiền lệ
    (`tha-ap142:2.3`) dịch "Tôi không có tôn thờ giáo pháp", làm mất nghĩa "giáo pháp để
    trao cho ai". Pāli nói không có *pháp cho đi*, không nói không có hành vi tôn thờ.
    Tôi dịch "Tôi không có giáo pháp nào để trao ban" và không nhân bản.
  - `:3.2` `veyyāvaccaṁ akāsahaṁ;` không có tiền lệ. `akāsahaṁ` là quá khứ của `kar`,
    đối chiếu cùng dạng ở `tha-ap148:1.2` `bodhivedimakāsahaṁ;` → "tôi đã xây đài bao
    quanh cây Bồ-đề" ⇒ "tôi đã mang danh Veyyāvacca;".
  - `:4.2` `rājā āsiṁ sucintito;` — **BẤT ĐỊNH THẬT SỰ, ghi nhận chứ không giấu.**
    `sucintito` có thể là tên riêng (cùng phẩm có `Sucintika` ở `tha-ap94`) hoặc là tính từ
    "suy tư tỉ mỹ". Pāli ở đây **không** có `sanāmakā` ("mang tên là") như các vế lân cận
    `thūpasīkhasanāmakā`, nên tôi chọn cách đọc tính từ: "tôi làm vua suy tư tỉ mỹ;".
    Người biên tập có thể chọn cách kia; cả hai đều không thêm gì ngoài Pāli.
  - `:7.1` lục kết "Ký sự về Trưởng lão Veyyāvacca, thứ chín." — dạng này là 6/8 ở phạm vi
    gần nhất (100:8.1, 105:8.1, 110:8.1, 146:8.1, 148:8.1, 150:8.1); toàn tầng `tha-ap` thì
    dạng "Bài Kệ … thứ N." đứng đầu (159 so với 28). Tôi theo phạm vi gần nhất vì nó đi
    cùng cặp công thức `:6.1` mà tôi cũng dùng.
