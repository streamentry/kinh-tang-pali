notes: |-
  Đủ 11/11 khoá trong all. Đã đọc HẾT Pāli lát qua v7/p1.txt trước khi viết.
    Bốn khối tiêu đề và khung thoại giữ nguyên một cách dịch cho cả bốn bài mil của lát, gồm cả
    chỗ Rājā āha— → Vua nói: (đa số 10/16 bài đã có; xem kỳ giải thích ở mil3.7.12).
    Tiền lệ BẮT BUỘC dùng lại nguyên văn: khoá 2.1 là “Khéo lắm, thưa tôn giả Nāgasenā.”

    Thuật ngữ, đếm được. sukhuma/sabbasukhumo/sukhuman/thūla → tinh tế / thô (tinh tế 94 tiền lệ;
    thô là Hán–Việt quen thuộc và đúng nghĩa `thūla` là thô kệch, đối xứng với tinh tế).
    chindati/chinditabba/chinditun/chedana → cắt đứt (thag1.15:1.1 đã dùng `chinde` là cắt).
    paññāya → bằng tuệ; natthi dutiyaṁ → không có sự cắt đứt bằng tuệ thứ hai. Giữ cả hai vế:
    1.2 `sakkā` là câu hỏi phải chăng, 1.3 `Āma` là Vâng, 1.4 lại hỏi `Kiṁ pana` — ba lần hỏi
    khác nhau, không gộp.

    Thuật ngữ 0 tiền lệ, đặt mới kèm lý do. `adhivacana` → tên gọi thay thế. Trong tầng chưa có
    chữ nào dịch `adhivacana`; nghĩa gốc là cách gọi khác cho cùng một pháp, nên “tên gọi thay thế”
    nói đúng việc mà câu đang làm. Tôi không dùng cách nói theo kiểu “Pháp thì gọi là tinh tế hay
    thô” của kho, vì sẽ biến một mệnh đề thành hai và làm lệch mệnh đề đơn của Pāli.

    Bất định đã ghi nhận. `sabbasukhumo` tôi dịch là tinh tế toàn tập, còn `dhammā sabbe sukhumā`
    là không phải tất cả đều tinh tế — hai vế đối xứng, cả hai phủ định giữ nguyên. Người đọc dễ
    tưởng mâu thuẫn nếu không thấy rõ đây là chủ ý chống lại cách hiểu “Pháp thì tinh tế toàn tập”;
    tôi không thêm lời giải thích vào thân kinh, chỉ ghi ở đây.
    Dấu lược: cả bài không có `…pe…` nên hai phía đều 0.
    Kiểm kỹ thuật: save_vi sạch, chạy hai lần idempotent (sha256 không đổi). Vì mọi khoá Pāli của Theragāḵā ngắn hơn 40 ký tự nên cần trong kiểm() rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá: đủ 11/11 khoá; đúng ID; thứ tự khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2 ở dòng kết); nháy kép cân trên cả bài; không còn `(…)`; không có ký tự ngoài Latin. Không chạy npm run validate|test|check|build (đợt này cấm) nên technical_integrity = 9.6, không phải 10.  Không đối chiếu được tầng Việt hiện hành: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Đây là giới hạn của bản chụp upstream, đã ghi ở content/meta/reference-gaps.yaml.
