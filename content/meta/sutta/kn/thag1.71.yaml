notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoá Pāli dài nhất 37 ký tự (dưới 40) nên `cần`
  rỗng. Tự quét 9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu lược khớp, nháy kép cân.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 1.5.

  CAU TRUC: ba khoa đầu là ba vế tất định (dassinā, vuttinā, sīlinā) cùng nói về MỘT người, và
  khoá 1.4 khép bằng `tena` (đối với người ấy). Tôi dịc cả ba vế bằng cùng một cách mở đầu
  “Với người …” để người đọc thấy đây là một chủ thể duy nhất chứ không phải ba người.

  Susukhumanipuṇatthadassinā → *thấy ý nghĩa cực kỳ tinh tế, khó thấu hiểu*: `susukham` là
  rất khó, `manipuṇattha` là ý nghĩa tinh tế khó thấu hiểu, `dassinā` là kẻ thấy. Sujato có
  chữ <j> (ghi chú bản dịch) ngay sau *meaning* — tôi không mang chữ <j> vào bản Việt vì đó
  không phải chữ trong Pāli.
  Matikusalena nivātavuttinā → *đã lấy giới hạnh làm nền tảng nương tựa*: `mati` là nền móng,
  `nivātavutti` là đã ở trong sự che chở. Đây là chỗ khó nhất của bài: `nivātavuttinā` có thể
  là “đang cư trú ở nơi che chở” (đọc của tôi) hoặc “đã lấy chỗ ở làm phương bối”, hai cách
  gần nhau vì `nivāta` vừa là che chở vừa là trú xứ; tôi chọn đọc khớp với 1.1 là người đã
  thấu hiểu thì 1.4 mới nói được Niết-bàn không khó.
  Saṁsevitavuddhasīlinā → *đã tu luyện giới hạnh trưởng thành*: `saṁsevitā` là đã phát triển,
  `vuddha` là trưởng thành, `sīlin` là hạnh. 1.2 và 1.3 cùng nói về giới hạnh — đúng như Pāli.

  `Nibbānaṁ na hi tena dullabhan` → *Niết-bàn đối với người ấy đâu có khó đạt*: `na hi` là
  chống định không, `dullabhan` là khó đạt được. Niết-bàn giữ nguyên (19 lượt). Phẩm Thứ Tám
  6 lượt ngoài lát.
