  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `kiliṭṭhakaṁ ṭhānaṁ` (:1.3) — 0 tiền lệ trong toàn tầng. Đọc là *nơi đổ rác*
    (`kiliṭṭha` = đống rác bỏ đi). Bối cảnh khớp: Đức Phật Padumuttara ngồi ở chỗ ấy
    rồi ban món ăn cho người nghèo ngồi đó, nên đây là bài kệ quen thuộc về người cho
    món ăn vô lượng. Không có English để phân xử; ghi ở đây thay vì đoán thêm.
  · `ujubhūto samāhito` (:2.4) — 0 tiền lệ. Hai tính từ tản dạng, đọc là *đã đủ tròn
    trưởng thành, đã định tâm*; giữ cả hai, không gộp thành một.
  · `Sammā dhāraṁ pavecchante` (:3.3) — chủ ngữ là khoảng câu 3.1–3.2 (người làm ruộng
    không phải hạt), nên dịch *được chăm sóc đúng đắn*.
  · `Bhave nibbattamānamhi` (:4.3) — 4 cách đã dùng trong tầng (*Khi tái sinh trong các
    cảnh giới* / *Trong khi ngươi sanh vào các kiếp* / *‘Khi tái sinh trong các kiếp sống* /
    *Dù tái sinh trong cảnh giới nào*), trong đó một cách dùng nhầm nghĩa. Tôi theo đúng
    mệnh đề của câu 4.4 (`phalaṁ te tosayissati` — *sẽ cho ta được thu quả*) nên dịch
    *khi nó trổ ra trong ta*.
  · `sukhette ropito tayā` (:4.2) — `tayā` là số cái **nữ**, nên bản Việt giữ *"bởi bà
    ấy"*. Tiếng Việt không có giống điểm danh từ, nên đây là chỗ phải chọn có ý thức,
    không phải tự nhiên tràn ra.
  · `Saṁvuto` (:6.1) đi với chủ thể là trưởng lão kể về chính mình nên dịch *Thu thúc*
    (không phải mệnh lệnh *Hãy thu thúc* như ở `snp2.11`).

