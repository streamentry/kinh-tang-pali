  **Số Pāli (tự tính, in phép):** `cattārīsāya` (10.2, 11.1) và `cattālīsāya` (24.1, 24.2, 25.1) = 40 → “bốn mươi”; số 40 khớp đếm trực tiếp trên Pāli: 40 từ `-to` trong 11.2; 8 nhóm × 5 cặp = 40 cặp ở 12.1–19.10; 4 nhóm × 10 = 40 mục ở 20.1–23.10. `pañca-` / `pañcannaṁ` (11.2, 12.x–19.x, 25.1) = 5 → “năm uẩn”. Kệ 26: `pañcavīsati` = pañca 5 + vīsati 20 = 25 → “hai mươi lăm”; `paññāsa` = 50 → “năm mươi”; `sataṁ pañcavīsati` = sata 100 + pañcavīsati 25 = 125 → “một trăm hai mươi lăm”. Tổng 25 + 50 + 125 = 200 = 40 × 5. Đếm các mục ở 20.1–23.10 theo loại: quán khổ 25 mục (×5 uẩn = 125, khớp kệ), quán vô thường 9 mục (×5 = 45), quán vô ngã 6 mục (×5 = 30); tổng 40 mục, nhưng kệ ghi 50 vô thường và 25 vô ngã: lệch đúng 5 (tương ứng một mục × năm uẩn) giữa hai loại này; xem bất định 4. `ekaṁ samayaṁ` (1.2) = “một thời”. Không có số khác (không có `sahassa`, `navuti`, `tiṁsa…`); chữ số chỉ ở tiêu đề `0.3` (“3.9.”) và `[10]` ở 20.10 (bỏ).

