  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `anulomikā khanti`: “sự kham nhẫn thuận hợp” là lựa chọn ít giả định; cách đọc khác “sự chịu đựng thuận theo” (`an6.98`) hay “sự chấp nhận thuận theo (Pháp)”; truyền thống gọi là thuận nhẫn. Không viết “quan điểm” hay “chân lý” vào thân kinh vì Pāli không nói.
  2. `nirodho niccaṁ nibbānanti` (12.2…19.10): hai cách đọc ngữ pháp: (a) “sự diệt (của năm uẩn) là Niết-bàn [tính từ]” (đã chọn, trung tính); (b) “sự diệt là [tính từ], tức Niết-bàn”. Trong Pāli ghim, `anagho`, `apalokadhammo` giống đực (khớp `nirodho`), còn `aparappaccayaṁ`, `anābādhaṁ`, `anītikaṁ`… giống trung (khớp `nibbānaṁ`); Pāli không phân xử. Dịch trung tính “là Niết-bàn + tính từ” cho cả bốn mươi cặp.
  3. 11.2 không có động từ trong Pāli (`Pañcakkhandhe aniccato dukkhato … saṅkilesikadhammato.`); lấy `passanto` ở 12.1 làm động từ ngầm: “Năm uẩn được thấy là vô thường, là khổ, …”. Không viết thêm chủ ngữ cho 12.x–19.x (Pāli không có); dùng “thì” thay cho “vị ấy”.
  4. Số kệ 26 và phân loại 20–23 lệch nhau như đã tính (vô thường 9 mục = 45 so với kệ 50; vô ngã 6 mục = 30 so với kệ 25; khổ 25 mục = 125 khớp kệ; tổng 200 khớp). Mỗi khoá đã dịch đúng Pāli ghim; không sửa số kệ, không đổi loại của mục nào, không thêm lời giải. Chưa phân xử được mục nào bị gán lệch (không có tầng Anh, không có bản song song trong tầng).
  5. `Yāni dukkhe pavuccareti` (26.4): “là những điều được gọi là thuộc về khổ” — `dukkhe` là cách vị trí (“trong khổ”); cách đọc khác “được nói đến trong (phần) quán khổ”. Giữ “thuộc về khổ”.
  6. `Aniccatoti, aniccānupassanā.` (20.x–23.x): dịch “Là vô thường: đó là quán vô thường.”; `toti` là `-to` + `iti` (dấu trích dẫn); không dùng nháy để khỏi lệch số nháy so với Pāli từng khoá. Cách đọc khác: “‘Là vô thường’ — đó là quán vô thường”.
  7. `netaṁ ṭhānaṁ vijjati` / `ṭhānametaṁ vijjati`: dịch “xảy ra” (đa số toàn tầng) thay cho “có khả năng ấy” / “không thể có” ở các khoá rời; đây là chỗ khác tiền lệ gần nhất ở 23 khoá, ghi lại để người biên tập gộp nếu muốn dùng một dạng cho cả tầng (số đếm ở phần thuật ngữ).
  8. `mārāmisato` “mồi của Ma” / `nirāmisaṁ` “không có mồi”; `vibhavato` “vô hữu” / `avibhavaṁ` “không phải vô hữu”; `paramasuññaṁ` “trống rỗng tối thượng”; `paramatthaṁ` “mục đích tối thượng”; `sāraṁ` “cốt lõi”; `ārogyaṁ` “vô bệnh” và `abyādhi` “không có bệnh” (gần nghĩa nhau): đều ít tiền lệ (xem trên); không viết thêm lời giải vào thân kinh.
  9. `vata` (2.1…9.1) dịch “quả thật” để giữ đủ đơn vị nghĩa; `So … bhikkhu` dịch “vị tỳ-kheo ấy”.

