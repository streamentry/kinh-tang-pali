notes: |-
  Đợt 19, làn 104. Dịch từ Pāli root commit đã ghim, đủ 188/188 khoá (0.1–0.3, 1.1–1.6, 2.1–2.6, 3.1–3.5, 4.1–9.6 mỗi nhóm sáu khoá, 10.1–10.2, 11.1–11.2, 12.1–19.10, 20.1–23.10, 24.1–24.2, 25.1, 26.1–26.5); thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Phần ngoài nội bộ bộ `ps`, các đoạn có song song gần nhất là `an6.98`–`an6.101` (cùng công thức `netaṁ ṭhānaṁ vijjati` / `ṭhānametaṁ vijjati` với 9 nhóm khoá đầu bài) và `mil7.8.7:3.4`–`3.41` (cùng danh sách bốn mươi phương diện); xem phần tiền lệ.

  **Cấu trúc bài.** (1) Duyên khởi tại Sāvatthī. (2–9) Tám đoạn kinh theo khuôn: vị tỳ-kheo quán X là Y thì có đủ kham nhẫn thuận hợp / bước vào con đường chắc chắn / chứng quả: bốn đoạn phủ định (2, 4, 6, 8: quán một hành là thường, một hành là lạc, một pháp là ngã, Niết-bàn là khổ) xen với bốn đoạn khẳng định (3, 5, 7, 9: quán mọi hành là vô thường, mọi hành là khổ, mọi pháp là vô ngã, Niết-bàn là lạc). (10–11) Câu hỏi và đáp: bốn mươi phương diện. (12–19) Bốn mươi cặp: thấy năm uẩn là X thì đạt được kham nhẫn thuận hợp; thấy sự diệt của năm uẩn là Niết-bàn không-X thì bước vào con đường chắc chắn. (20–23) Phân loại mỗi phương diện vào quán vô thường / quán khổ / quán vô ngã. (24–26) Kết, câu hỏi tổng số và kệ số lượng, câu kết bài.

  **Pāli trùng nguyên văn trong chính bài (đã đếm):** 113 khoá có nội dung trên tổng 188; sau khi bỏ khoá tiêu đề `0.x` và chuẩn hoá (bỏ dấu câu, hạ chữ hoa) có 6 nhóm Pāli trùng, gồm 38 khoá: `netaṁ ṭhānaṁ vijjati` (12 khoá: 2.2, 2.4, 2.6, 4.2, 4.4, 4.6, 6.2, 6.4, 6.6, 8.2, 8.4, 8.6); `ṭhānametaṁ vijjati` (11 khoá: 3.2, 3.5, 5.2, 5.4, 5.6, 7.2, 7.4, 7.6, 9.2, 9.4, 9.6); `anulomikāya khantiyā asamannāgato sammattaniyāmaṁ okkamissatīti` (4: 2.3, 4.3, 6.3, 8.3); `sammattaniyāmaṁ anokkamamāno sotāpattiphalaṁ … sacchikarissatīti` (4: 2.5, 4.5, 6.5, 8.5); `anulomikāya khantiyā samannāgato sammattaniyāmaṁ okkamissatīti` (4: 3.3, 5.3, 7.3, 9.3); `sammattaniyāmaṁ okkamamāno sotāpattiphalaṁ … sacchikarissatīti` (3: 5.5, 7.5, 9.5). Bản Việt của 4 nhóm sau giống hệt nhau (0 lệch). Hai nhóm đầu (`netaṁ ṭhānaṁ vijjati`, `ṭhānametaṁ vijjati`) có bản Việt khác nhau đúng ở dấu cuối khoá (`;` / `.` / `”.`), vì Pāli từng khoá cũng khác ở dấu đó (ví dụ 2.2 `…vijjati;` · 2.6 `…vijjati.` · 9.6 `…vijjati”.`); lời dịch giống hệt. Khoá 3.4 không thuộc nhóm nào vì Pāli gộp `ṭhānametaṁ vijjati,` với vế chứng quả trong một khoá (khác 5.4 + 5.5). Các khoá 12.x–19.x chỉ khác nhau ở tên phương diện, đã đối chiếu từng khoá với bảng phương diện.

  **Pāli trùng nguyên văn với tầng đã dịch (đã dò):** 29 khoá Pāli của bài có chuỗi Pāli trùng (chuẩn hoá như trên) ở tầng Việt. Dùng lại 5: `1.1` “Tôi nghe như vầy.” (234/455 khoá; “Tôi nghe như vầy:” 122 · “Tôi nghe như vầy—” 37); `1.2` “Một thời, Đức Phật ở Sāvatthī, tại rừng Jeta, trong tu viện của ông Anāthapiṇḍika.” (108/222; dạng “Đức Thế Tôn trú tại Sāvatthī, trong rừng Jeta, tại tu viện của Anāthapiṇḍika” 49); `1.3` “Tại đó, Đức Phật gọi các vị tỳ-kheo:” (62/133); `1.4` “Này các tỳ-kheo!” trong nháy kép (78/105); `1.6` “Đức Phật nói:” (124/238; “nói như sau” 21). Khác có chủ ý 24: `1.5` (dạng nhiều nhất “Bạch Thế Tôn,” các vị tỳ-kheo đáp. 30/102 bỏ `bhagavato`; ở đây thêm “ấy … đáp lời Đức Phật” để giữ đủ `te … bhagavato paccassosuṁ`, theo dạng “đáp lời Đức Phật” 6 khoá và “đáp lời Đức Thế Tôn” 10 khoá); 23 khoá `netaṁ ṭhānaṁ vijjati` (12) và `ṭhānametaṁ vijjati` (11): xem phần thuật ngữ. Tiêu đề `0.1` “Paṭisambhidāmagga” dùng lại nguyên văn (15/15 khoá có tiền lệ).

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên công cụ đo):**
  - `netaṁ ṭhānaṁ vijjati` → “điều ấy không thể xảy ra”; `ṭhānametaṁ vijjati` → “điều ấy có thể xảy ra”. Trên toàn tầng, khoá chứa `netaṁ ṭhānaṁ vijjati` có bản Việt: 200 khoá, dạng cuối khoá nhiều nhất “không thể xảy ra” 71 · “không thể có” 40 · “là điều không thể có” 12 · “không thể nào xảy ra” 6 · “không có khả năng ấy” 6 · “không có cơ hội nào như vậy” 6 (phần còn lại chưa phân loại: câu dài); `ṭhānametaṁ vijjati` 98 khoá: “có thể xảy ra” 22 · “có thể có” 13 · “đúng là có cơ hội ấy” 4. Trên các khoá chỉ gồm đúng cụm này (18 + 8 khoá) tiền lệ rời rạc: “không có khả năng ấy” 10 · “điều ấy không thể có” 6 · “không thể xảy ra” 2; “có khả năng ấy” 6 · “thì biết như vậy” 2 (đoạn lược `an6.99`, `an6.100`). Chọn “xảy ra” theo đa số toàn tầng (71 và 22), vì “có khả năng ấy” ở khoá rời chỉ đứng sau một mệnh đề điều kiện của `sn47`/`sn56` mà ở đây vế trước là mệnh đề kết bằng dấu gạch; “cơ hội” (`an6.98`–`an6.101`, 6 khoá) không dùng vì nghiêng nghĩa “dịp may”. Đây là chỗ khác tiền lệ gần nhất, ghi ở bất định 7.
  - `anulomikā khanti` → “sự kham nhẫn thuận hợp”: tầng có 10 khoá chứa `anulomikāya khantiyā` ở nghĩa này: `an6.88:1.3`, `an6.88:2.3` “kham nhẫn (không) thuận hợp” (2 khoá) và `an6.98`, `an6.101` (8 khoá, cùng công thức với bài này) “sự chịu đựng thuận theo”. Chọn “kham nhẫn thuận hợp” vì “chịu đựng” nghiêng nghĩa gánh chịu đau khổ, trong khi `khanti` ở đây là sự chấp nhận hợp với Pháp (bản English của `an6.88`, `an6.98` dịch “accept views that conform with the teaching”); không thêm “quan điểm” vào thân kinh. Xem bất định 1.
  - `sammattaniyāma` → “con đường chắc chắn”: 13 khoá có bản Việt: “con đường chắc chắn” 7 (`sn25.1`, `sn25.2`, tên `an5.151`–`an5.153`) · “con đường đi thẳng tới” 4 (`an6.98`, `an6.101`) · “chánh tánh quyết định” 2 (`sn25.10`); `okkamati` → “bước vào”; `okkanto sammattaniyāmaṁ` ở `sn25` “đã bước vào con đường chắc chắn”.
  - `samanupassati` → “quán” (ở khoá 2.1–9.1); `passati` → “thấy” (ở 12.x–19.x), để giữ hai động từ khác nhau của Pāli. Toàn tầng, khoá chứa `samanupassa-`: “thấy” 195 · “quán” 128 trên 449; chọn “quán” theo `ps3.8` (`anupassati` → “quán”), `mn64:9.3`, `an9.36`. `anupassanā` → “quán” (`dn22`: “quán thân / thọ / tâm / pháp”); `aniccānupassanā` → “quán vô thường”: 59 khoá “quán vô thường” trong tầng.
  - `ākāra` → “phương diện”: theo `ps3.8` (20 · “hình thái” 6 trên 49 khoá chứa `ākārehi`). `cattārīsāya` / `cattālīsāya` → “bốn mươi”.
  - `paṭilabhati` → “đạt được”: “được” 104 · “đạt được” 48 · “có được” 23 · “nhận được” 9 trên 118 khoá chứa `paṭilabh-` (đếm chuỗi con nên chồng lấn); chọn “đạt được” để khác động từ ‘được’ trần.
  - `sacchikaroti` → “chứng ngộ” (theo `an6.98`; tầng: “chứng ngộ” 100 · “chứng đạt” 27 · “chứng đắc” 15 trên 153 khoá). Bốn quả: “quả Dự lưu, quả Nhất lai, quả Bất lai hoặc quả A-la-hán”: tầng “quả Dự lưu” 32 · “quả Nhập lưu” 15 (cả hoa thường); “quả Bất lai” 69 · “quả Bất Lưu” 4 · “quả Bất hoàn” 2; “quả A-la-hán” 55; hai khoá công thức đầy đủ dùng đúng dạng đã chọn, `an6.98` và `an6.101` dùng “Nhập lưu … Nhất Lai … Bất Lưu”.
  - `pañcakkhandha` → “năm uẩn” (13/13 khoá); `nirodho` → “sự diệt” (“diệt” 638 · “sự diệt” 100 trên 791 khoá chứa `nirodho`, đếm chuỗi con).
  - Bốn mươi phương diện (11.2, 12.1–19.9, 20.1–23.10): theo danh sách cùng bốn mươi mục ở `mil7.8.7:3.4`–`3.40` (khác thứ tự ở `anatta`): `rogato` “bệnh”, `gaṇḍato` “ung nhọt”, `sallato` “mũi tên” (`an9.36`, `sn22.122`, `sn22.123`, `mil7.8.7`; “mũi nhọn” `mn64:9.3`, `mn74:9.1`), `aghato` “khốn khổ” (`mil7.8.7`, `mn74`, `mn75`; “phiền não” `mn64`, “tai họa” `an9.36`), `ābādhato` “tật ách” (`mil7.8.7`, `sn22.123`; “tai họa” `mn64`, `mn74`; “khổ bệnh” `an9.36`), `parato` “xa lạ” (`mil7.8.7`, `mn64`, `mn74`; 19 khoá khác dịch `para` là “người khác” nhưng ngoài danh sách này), `palokato` “tan rã” (`mil7.8.7`, `an9.36`; “hoại đổ” `mn64`, `mn74`), `ītito` “tai ương”, `upaddavato` “tai nạn”, `bhayato` “đáng sợ” (5 · “hiểm họa” 5 trên 17 khoá chứa `bhayato`), `upasaggato` “tai họa”, `calato` “dao động”, `pabhaṅguto` “dễ vỡ nát”, `addhuvato` “không bền vững”, `atāṇato` / `aleṇato` / `asaraṇato` “không nơi che chở / ẩn náu / nương tựa”, `rittato` “trống vắng”, `tucchato` “hư rỗng”, `suññato` “trống rỗng”, `vipariṇāmadhammato` “phải biến đổi”, `asārakato` “không có cốt lõi”, `aghamūlato` “gốc rễ của khốn khổ”, `vibhavato` “vô hữu”, `sāsavato` “hữu lậu”, `saṅkhatato` “hữu vi”, `mārāmisato` “mồi của Ma”, `jāti/jarā/byādhi/maraṇa/soka/parideva/upāyāsa/saṅkilesikadhammato` “phải sinh / già / bệnh / chết / chịu sầu / than khóc / ưu não / ô nhiễm”. Khác `mil7.8.7` có chủ ý 2: `ādīnavato` “nguy hại” (tầng 686 khoá chứa `ādīnav-`: “nguy hại” 372 · “nguy hiểm” 126 · “tai họa” 107; `mil` dùng “nguy hiểm”); `vadhakato` “kẻ giết” (45 khoá: “kẻ giết” 24 · “kẻ sát hại” 2; `mil` dùng “kẻ sát hại”).
  - Vế khẳng định về Niết-bàn (các khoá chẵn 12.2, 12.4, …, 19.10): mỗi tính từ dịch theo cùng gốc với vế phủ định đối ứng: `niccaṁ` “thường còn”, `sukhaṁ` “lạc” (`dhp203`, `dhp204` “Niết-bàn là lạc tối thượng”), `ārogyaṁ` “vô bệnh”, `agaṇḍaṁ` / `visallaṁ` / `anagho` / `anābādhaṁ` / `anītikaṁ` / `anupaddavaṁ` / `anupasaggaṁ` “không có ung nhọt / mũi tên / khốn khổ / tật ách / tai ương / tai nạn / tai họa”, `aparappaccayaṁ` “không lệ thuộc vào người khác” (`dn14:3.12.1`, `dn14:3.16.1`, `dn14:3.20.1` “không lệ thuộc người khác”; `dn3`, `dn5` “không còn phụ thuộc người khác”), `apalokadhammo` / `avipariṇāmadhammaṁ` “không phải chịu tan rã / biến đổi”, `abhayaṁ` “không có sợ hãi”, `acalaṁ` “không dao động”, `apabhaṅgu` “không dễ vỡ nát”, `dhuvaṁ` “bền vững”, `tāṇaṁ` / `leṇaṁ` / `saraṇaṁ` “nơi che chở / ẩn náu / nương tựa”, `arittaṁ` / `atucchaṁ` “không trống vắng / hư rỗng”, `paramasuññaṁ` “trống rỗng tối thượng”, `paramatthaṁ` “mục đích tối thượng” (`an10.29:20.1`, `an10.29:20.2`, `snp5.19:40.2`; “mục tiêu tối hậu” `snp1.3`, `snp1.12`), `anādīnavaṁ` “không có nguy hại”, `sāraṁ` “cốt lõi”, `anaghamūlaṁ` “không phải gốc rễ của khốn khổ”, `avadhakaṁ` “không phải kẻ giết”, `avibhavaṁ` “không phải vô hữu”, `anāsavaṁ` “vô lậu”, `asaṅkhataṁ` “vô vi” (130/156 khoá chứa `asaṅkhat-`), `nirāmisaṁ` “không có mồi” (`āmisa` toàn tầng: “vật chất” 88 · “thế tục” 57 · “mồi” 44 trên 239; chọn “mồi” vì đối ứng `mārāmisa` “mồi của Ma”), `ajātaṁ` / `ajaraṁ` / `abyādhi` “không sinh / già / có bệnh”, `amataṁ` “bất tử” (218/231), `asokaṁ` / `aparidevaṁ` / `anupāyāsaṁ` “không sầu / than khóc / ưu não”, `asaṅkiliṭṭhaṁ` “không ô nhiễm”. Không có tiền lệ nào cho các tính từ này ở dạng định ngữ của `nibbānaṁ` (0 khoá trùng Pāli ngoài chính bài).
  - Khoá 1.x: `bhikkhavo` “Này các tỳ-kheo!”; `Bhadante` → “Bạch Thế Tôn”; `bhagavā` → “Đức Phật” theo công thức duyên khởi dùng nhiều nhất ở các bài đã dịch.
  - Tên bài: `Vipassanākathā` → “Luận Bàn Về Tuệ Quán”, theo khuôn “Luận Bàn Về …” (`ps1.1`, `ps1.6`–`ps1.8`, `ps2.5`, `ps2.8`, `ps3.3`–`ps3.6`, `ps3.8`, `ps3.10`; riêng `ps3.7` dùng “Bài Nói Về …”). `vipassanā` toàn tầng: “quán” (gồm cả “tuệ quán”) 126 · “tuệ quán” 51 · “minh sát” 18 trên 143 khoá; chọn “tuệ quán” để khỏi trùng chữ “quán” trần của `anupassanā`. Câu kết `Vipassanākathā niṭṭhitā.` → “Luận bàn về tuệ quán được hoàn tất.”, theo 9 bài (`ps1.9`, `ps2.5`, `ps2.8`, `ps3.3`–`ps3.6`, `ps3.8`, `ps3.10`) so với “đã hoàn tất” 4 bài (`ps1.0`, `ps1.6`–`ps1.8`) và “đã kết thúc” 1 bài (`ps3.7`). Khoá `0.2` Pāli là `Paññāvagga` không có chữ số: dịch “Phẩm Trí Tuệ” không số, đúng dạng `ps3.7:0.2`; sáu bài kia có Pāli `3 Paññāvagga` và viết “3. Phẩm Trí Tuệ”.
