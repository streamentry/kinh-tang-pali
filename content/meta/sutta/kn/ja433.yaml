  Tên tầng, đo trên lớp `ja` đã có sẵn: `:0.1` **Jātaka** (390/406 tệp; 16 tệp ghi *Chuyện Tiền Thân*) · `:0.3` `Kaccānivagga` → **Phẩm Kaccānivagga** (5/5 theo `ja418`, `ja420`, `ja424`) · `:0.4` mẫu *N. Kinh <tên rút gọc>* (366/400 có chữ *Kinh*; 371 tên dịch nghĩa so với 29 tên giữ Pāli) · lời kệ cuối mẫu *Kinh <tên>, thứ <thứ tự>.* (192 không phẩy / 174 có phẩy; bốn bài kề `ja409`, `ja412`, `ja418`, `ja424` đều có phẩy nên theo bốn bài kề).
  `Gijjhavagga` và `Navakanipāta` **0 tiền lệ** trong tầng (cả 12 bài `ja427`–`ja438` đều chưa dịch). Chọn **Phẩm Hươu** vì đo trên 400 phẩm đã dịch: **239 dịch nghĩa so với 161 giữ nguyên Pāli**, và các phẩm tên loài vật đều dịch (Kulāvakavagga → *Phẩm Tổ Chim* 10/10 theo `BRIEF_VI3` §11, Kokilavagga → *Phẩm Chim Tu Hú* 6/6, Varuṇavagga → *Phẩm Cây Varuṇa* 5/5); `gijjha` là hươu. Chọn **Bộ Chín Bài Kệ** vì tầng `name/` đã ghim của SuttaCentral cho `ja-name:478.ja-navakanipata` → “The Book of the Nines”, và hai nipāta kề trong lớp `ja` đều dùng dạng *Kệ* (Sattakanipāta → *Bộ Bảy Bài Kệ* 12/12, Aṭṭhakanipāta → *Bộ Tám Bài Kệ* 5/5). Ghi rõ vì dạng *Bộ N Bài Kinh* chiếm đa số toàn tầng (349 so với 48 theo tầng `name/`) và người gộp lát có thể muốn thống nhất.
  Không khoá nào của 6 bài `ja` này có `…pe…` ở Pāli (đã kiểm 246/246 khoá), nên không có dấu lược nào để giữ và không chỗ nào bịa dấu lược che chỗ thiếu.
  Pāli mở ở `:1.1` và đóng ở `:1.4`, rồi mở ở `:2.1` và đóng **ở `:5.4`** (không đóng ở `:2.4`), mở ở `:6.1` đóng ở `:7.4`, mở ở `:8.1` đóng ở `:9.4`. Bản nháp đầu đóng ngoặc ở `:2.4` và mở thêm ở `:3.1`/`:9.1`; lượt review đối kháng đã sửa cho khớp đúng bốn cặp của Pāli.
  Bản này là **Lomasakassapa**, bài thứ bảy của `Gijjhavagga` trong `Navakanipāta`.
  **Pāli trùng nguyên văn với `ja310` (Seyya-jātaka): 15 khoá; 5 khoá dùng lại NGUYÊN VĂN** — `:2.3` theo `ja310:1.3` (*Ta không muốn nhận cùng sự chê bai,*), `:3.2` theo `ja310:2.2` (*lẫn tài lộc ấy, này bà-la-môn;*), `:4.2`/`:5.2` theo `ja310:3.2` (*người không nhà xuất gia phiêu bạt;*), `:4.3` theo `ja310:3.3` (*Đời sống ấy quả thật tốt đẹp hơn,*). Trong lát này: `:4.1` = `:5.1` và `:4.2` = `:5.2` (chỉ khác chữ hoa đầu câu theo vị trí trong lời thoại) và 3 khoá tiêu đề dùng chung *Jātaka*.
  **Cố ý KHÔNG dùng lại 10 khoá trùng Pāli**, vì tiền lệ ở `ja310` sai nghĩa hoặc theo bối cảnh khác: `:2.1`–`:2.2` (`ja310` dịch *Dẫu được cõi đất bao la này* / *được đại dương bao bọc quanh mình*, làm mất `sasamuddapariyāyaṁ` = rộng ngang cõi biển); `:2.4` (`ja310` thêm *điều tối thắng* không có trong Pāli); `:3.1` (`ja310` dịch *Đáng khinh bỉ thay* và `ja309` dịch *Đáng hổ thẹn thay* — hai bài đã dịch **mâu thuẫn nhau** và cả hai đọc sai `Dhiratthu` là tính từ, trong khi `Dhiratthu` ở đây là động từ “hãy suy xét”, nên tôi dịch *Hãy suy xét sự được danh dự ấy*); `:3.3` (không bản dịch nào giữ được `vutti` = lời khen ngợi; `ja310` đọc thành *sinh kế đưa đến sa đọa*, `ja309` đọc thành *khi kế sinh nhai…*); `:3.4` (giữ nối liền với `:3.3` vì cùng một mệnh đề); `:4.1`/`:5.1` — `Api ce pattamādāya`: `pattaṁ` có thể là “đã đạt được” (đúng ngữ cảnh kệ nói về danh dự và của cải ở `:3.1`–`:3.2`) hoặc “đã cầm bình bát” như `ja310` dịch; tôi theo nghĩa *đã đạt được* vì ngữ cảnh trong chính bài; `:4.4` — `yā cādhammena esanā` nghĩa là *đời sống tìm theo Chánh pháp* nhưng `ja310` dịch thành *so với tìm cầu bằng việc phi pháp*, đảo mất ý; `:5.3` — `ahiṁsaya` là “đáng chê” nhưng `ja310` đọc thành động từ *làm hại ai*.
  **Bất định đã ghi, không bịa:** (1) `:5.4` `api rajjena taṁ varaṁ` — không có cách phân tích nào cho câu hết; `api rajjena` có thể là “dù ở trong vương quốc” hoặc “dù kẻ thù chọn”, và dù đọc thế nào thì mệnh đề `taṁ varaṁ` vẫn là *đời sống ấy là tốt nhất*. Tôi chỉ dịch phần chắc chắn và ghi thẳng chỗ không chắc. (2) `:7.3`–`:7.4` `Pitu atthā candavatī` — `candavatī` có thể là tân ngữ (khi ấy người cha sai **Candavatī** đi giết) hoặc từ ngữ gọi (Ô Candavatī, người cha ngài…). Tôi chọn cách tân ngữ vì `mil5.5.5:5.1` có `candavatiyā rājakaññāya` = vợ của vua Candavatta, và vì vế sau (`vājapeyyaṁ` = kẻ bị đưa đi giết) cần một chủ ngữ; nếu đọc từ ngữ thì phải sửa cả hai vế. Tôi giữ đúng chính tả Pāli của bài này là *Candavatī* (không thêm dấu ṇḍ như `Caṇḍavatī`) để không sinh chữ có dấu không có trong nguồn. (3) `:2.3` `Na icche saha nindāya` — `icche` là “ông ấy không muốn” nên tôi dịch theo hướng chủ ngữ (như `ja310`), dù có thể là đại từ thứ hai.
  Thuật ngữ theo tiền lệ đếm được: `isi` → bậc thiền hiền — tiền lệ rất mạnh và **chính là nhân vật này**: `mil5.5.5:7.5` dịch `lomasakassapo isi` là *bậc thiền hiền Lomasakassapa*; `rājā` → vua (`ja264:1.1`), `Inda` → Indra (`ja161:1.4`, `dhp95:2` dùng *Indra* chứ không dùng *Inda*, nên tôi theo *Indra*), `anagāra` → không nhà cửa, `brahmacariya` → phạm hạnh.
  Lỗi bắt được ở lượt review đối kháng, đã sửa: (1) ba chỗ đặt ngoặc kép không theo Pāli (đóng ở `:2.4`, mở thêm ở `:3.1` và `:9.1`) — đã sửa để lời thoại chạy đúng 2.1→5.4; (2) `:2.1`–`:2.2` bản nháp lặp chữ *biển* ba lần trong hai câu kệ — đã viết lại thành *Trái đất rộng ngang cõi biển / lại được biển bao quanh*; (3) `:6.3` bản nháp *sức mạnh của biển mạnh* lặp từ, đã sửa thành *Sức biển cũng mạnh*.
  **Sửa lan 2026-10-13** (accuracy fix; thay thế các lập luận cũ ở trên về `Dhiratthu`, `pattamādāya`, `ahiṁsayaṁ`, `yā cādhammena esanā`): `Dhiratthu` là thán từ *khốn thay* (`dhi` + `atthu`), không phải động từ *hãy suy xét*; tầng `ja` đo được *Khốn thay* ở `ja287:2.1`, `ja293:3.1`, `ja459:9.1`, `ja476:5.1` (đa số so với *Đáng khinh bỉ thay*/*Đáng hổ thẹn thay* ở `ja310`/`ja309`). `Api ce pattamādāya` là *dù mang bát* (`patta` bình bát + `ādāya`), khớp `ja287:3.1`/`ja310:3.1`, không phải *đã đạt được*; `yā cādhammena esanā` là *so với sự tìm cầu bằng cách trái pháp* (Pāli ghi `seyyo` — hơn, so sánh), không phải *tìm theo Chánh pháp*. Khoá đã đổi: `3.1` *Hãy suy xét sự được danh dự ấy* → *Khốn thay sự được danh vọng ấy*; `3.2` → *và cả sự được của cải, này bà-la-môn*; `3.3` *còn lời khen ngợi nào* → *thứ sinh kế do sa đọa* (`vutti` = sinh kế, `vinipāta` = sa đọa, theo `ja287:2.3`); `3.4` → *hoặc do hành xử trái pháp*; `4.1`/`5.1` *dù/Dù đã đạt được rồi* → *Dù mang bát*; `4.4` → *so với sự tìm cầu bằng cách trái pháp* (ranh giới 3.3–3.4 trở lại đúng một mệnh đề, không còn nối với `4.x`); `5.3` `Aññaṁ ahiṁsayaṁ loke` *trong cõi này còn điều gì khác đáng chê* → *Chẳng làm hại ai ở trên đời* (nguyên văn `ja310:4.3`); `5.4` *đời sống ấy là tốt nhất, dù ở trong vương quốc* → *điều ấy còn cao quý hơn cả ngai vàng* (nguyên văn `ja310:4.4`); `9.1`–`9.2` `Dhiratthu kāme subahūpi loke, Tapova seyyo kāmaguṇehi rāja` *Hãy suy xét… phần thưởng tốt đẹp của tham dục / các đức tính của tham dục* → *Khốn thay các dục, dù có rất nhiều ở đời, / khổ hạnh còn hơn các dục lạc, hỡi vua;* (`kāmaguṇa` → *dục lạc* theo `ja488:17.3`, `ja511:23.3`, `ja522:35.1`). Chưa sửa vì ngoài phạm vi lượt này nhưng nghi ngờ: `7.1`–`7.4` (bản cũ *vua xứ Uggatapura… bị dẫn đi để giết*, Pāli `vājapeyyaṁ ayājayi` là *khiến [người] làm lễ tế vājapeya*, không có nghĩa giết) và `9.4` (`candavatī ca hotu` bản cũ đọc là từ ngữ gọi).
  **Sửa lan 2026-10-13 (accuracy fix; thay thế phần bất định (2) ở trên và hai mục *chưa sửa* ở cuối đoạn trước):** `7.1`–`7.4` `Yathā uggatapaṁ santaṁ, isiṁ lomasakassapaṁ; pitu atthā candavatī, vājapeyyaṁ ayājayi`: `yājeti` dạng khiến có hai tân ngữ (`isiṁ lomasakassapaṁ` — vị thiền hiền, và `vājapeyyaṁ` — lễ tế); `candavatī` là chủ ngữ (danh cách) chứ không phải tân ngữ hay hô ngữ; `atthā` = *vì (lợi ích của)*; `uggatapa` = *có khổ hạnh nghiêm khắc* (không có *vua xứ Uggatapura* trong Pāli; kho Pāli đã ghim chỉ có một lần dùng từ này). Bản mới: *Như vị có khổ hạnh nghiêm khắc, / bậc thiền hiền Lomasakassapa; / vì cha mình, Candavatī / đã khiến vị ấy làm lễ tế vājapeyya.* (`vājapeyya` giữ dạng Pāli như `sn3.9:4.2`). `9.4` `Taveva raṭṭhaṁ candavatī ca hotū`: `tava eva` = *chỉ của ngươi*, `raṭṭhaṁ` và `candavatī` cùng là chủ ngữ của `hotu` → *vương quốc và cả Candavatī hãy chỉ thuộc về ngươi*; bản cũ đọc `candavatī` là hô ngữ. Không bỏ ngoặc kép (7.4 và 9.4 vẫn đóng đúng như Pāli). Bất định còn lại: người nói đoạn 6–7 và vai trò chính xác của Candavatī trong truyện không được chỗ nào trong Pāli đã ghim nói rõ; tôi chỉ dịch phần ngữ pháp bảo đảm. Điểm số giữ nguyên.
  **Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan):** đọc đối kháng đủ 41/41 khoá, in cặp Pāli↔Việt. Bản đã `published` còn **tám lỗi nghĩa nghiêm trọng**, đã sửa 18/41 khoá (accuracy fix trừ khi ghi khác): (1) `1.1` *Hắn giống hệt Indra* → *Ngươi sẽ ngang bằng Indra*: `assa` là cầu khiến/điều kiện ngôi hai (đi với `sace tvaṁ` ở `1.3`), không phải "hắn" ở thì hiện tại. (2) `1.2` thêm *mãi mãi* cho `accantaṁ` bị bỏ sót. (3) `1.3`–`1.4` *Nếu ngươi muốn làm lễ tế, / hãy tế bậc thiền hiền Lomasakassapa* → *Nếu ngươi khiến cho lễ tế được cử hành / bởi bậc thiền hiền Lomasakassapa*: `yājeyya` là dạng khiến có hai tân ngữ (`yaññaṁ` và `isiṁ`), như `ayājayi` ở `7.4`; bản cũ biến vị thiền hiền thành vật tế — đảo nghĩa cả truyện. (4) `2.4` bỏ sót hô ngữ `seyya` → *này Seyya*: cùng bài kệ ấy là kệ đầu của `ja310`, mà tiêu đề Pāli đã ghim là `Seyyajātaka`, nên `seyya` là tên người được nói tới; `2.1`–`2.2` viết lại thành *Dẫu cả cõi đất trải đến tận biển, / được đại dương bao quanh* (clarity fix — cõi đất là tân ngữ của `na icche` ở `2.3`). (5) `6.3` `velā samuddassa` *Sức biển* → *Bờ biển cả*: `velā` là bờ, theo `ja524:37.4`, `ja527:40.4`, `ja535:93.1`. (6) `6.4` `balātibalamitthiyo` bỏ mất `itthiyo` (người nữ) — chính là ý của bài kệ — và thêm *được nói là* không có trong Pāli → *người nữ còn mạnh hơn cả những gì mạnh*. (7) `8.3`–`8.4` `gavesissaṁ`, `checchaṁ` là vị lai ngôi một, bản cũ dịch thành mệnh lệnh *Hãy tìm…* → *Ta sẽ tìm gốc rễ của nó, / sẽ cắt bỏ tham dục cùng mọi ràng buộc* (giữ nguyên phần còn lại của `ja431:8.4`, Pāli trùng nguyên văn). (8) `8.2` `kaṭukaṁ` *tàn nhẫn* → *cay đắng* (tiền lệ tầng `ja`: *cay đắng* 15/22 khoá có `kaṭuk-`). Terminology fix: `kāma` thống nhất là *dục/các dục* ở `8.2`, `9.1`, `9.3` (bản cũ lẫn *tham dục*, trùng với `rāga` ở `8.4`); `9.2` thêm *chính* cho `tapova`; `7.1` *Như với vị vốn có…* (`santaṁ`; bản cũ đọc thành so sánh với vị thiền hiền), `7.4` *cử hành lễ tế* cho khớp `1.3` và `tha-ap136:1.4`; `8.1` *do lòng tham thúc đẩy*; `9.4` *cứ để thuộc về ngươi* (`tava eva`). Phép kiểm: 41/41 khoá khớp tập khoá Pāli; ngoặc kép khớp Pāli 41/41; 0 dấu lược ở cả hai bên; ba cặp Pāli trùng trong bài (`4.1`=`5.1`, `4.2`=`5.2` giống hệt; `1.4`/`7.2` chỉ khác *bởi* do cấu trúc câu `1.3`); NFC sạch. Không có số Pāli ngoài thứ tự bài (`sattamaṁ` = thứ bảy).
  Bất định còn lại: `velā` có thể đọc là *thủy triều* (chọn *bờ* theo ba tiền lệ tầng); đọc `seyya` là tên dựa vào tiêu đề `ja310`, không có câu văn xuôi nào trong Pāli đã ghim nói rõ; người nói đoạn 6–7 không được Pāli nêu. Ngoài lát này, báo, không sửa: `ja310:1.4` dịch `seyya` thành *điều tối thắng*; `ja431:8.3` cũng dịch `gavesissaṁ` thành mệnh lệnh. Điểm chấm lại cho bản hiện tại, không nâng tiêu chí nội dung nào dù đã sửa: điểm cũ 9.17 bị thổi phồng so với bản có tám lỗi trên. `terminology` 9.3 → 9.1, `vietnamese_clarity` 9.3 → 9.0, `han_viet_balance` 9.3 → 9.2, `ambiguity_integrity` 9.2 → 9.0 (các ghi chú cũ về `Dhiratthu`, `ahiṁsayaṁ`, `icche` sai và chỉ được thay ở lượt sửa lan); `semantic_fidelity` 8.8, `grammar_logic` 9.0, `triangulation` 7.6 giữ nguyên (không có bản Anh hay bản Việt hiện hành; chỉ đối chiếu được Pāli + bài song song `ja310`, `ja431`, `mil5.5.5`). Blocker vắng tầng Anh giữ nguyên. `final_score` 9.17 → 9.09. Lượt này không chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`, nên `technical_integrity` giữ 9.6.
