notes: |-
  **Trưởng lão Sopāka, phẩm Phẩm Thứ Tư.**

  **Sujato THÊM một nhân vật không có trong Pāli, tôi không thêm.** Sujato viết *Just as a mother would be good to her beloved only child* — chữ *a mother* không có trong `Yathāapi ekaputtasmiṁ, piyasmiṁ kusalī siyā`. Tôi dịch *Như với đứa trẻ duy nhất, / được yêu thương, sẽ đối xử lành*. `piyasmiṁ` (được yêu thương) là vế riêng trong Pāli; Sujato gộp vào *beloved*, tôi tách ra.

  **`kusalī` / `kusalo` tôi dịch *đối xử lành*, giữ cả dạng cái và dạng thực.** `kusalī` ở `1.2` là dạng cái, `kusalo` ở `1.4` là dạng thực, nhưng cùng một nghĩa nên tôi dùng một cách diễn đạt — khác với bài `ja33` đã có, nơi hai dạng rời nhau. `pāṇesu` → *mọi loài hữu tình* (có tiền lệ `dn30:1.10.2` *mọi loài hữu tình*); `sabbattha` → *khắp mọi nơi*.

  **Trùng tên, ghi ra để biên tập biết:** Pāli `0.4` chỉ ghi `Sopākattheragāthā` không số thứ tự, và còn Trưởng lão Sopāka thứ hai ở thag1.29. Sujato ghi *Sopāka (1st)*. Tôi giữ đúng Pāli, không tự thêm *thứ nhất* vào tiêu đề; nếu biên tập muốn phân biệt thì phải sửa cả hai bài, không sửa một.

  **Công thức đặt kinh theo đa số, không theo nhóm lệch.** `0.3` = phẩm, `0.4` = *Kinh Kệ Của Trưởng Lão <tên>*. Đo được: 40+ tệp thag/thig đã có dùng đúng thứ tự này (`thag1.23`, `34`, `37`, `42`, `46`, `66`, `92`, `93`, `96`–`99`, `101`–`119`), còn 13 tệp cũ (`thag1.1`–`thag1.14`, `thag2.1`, `thag2.2`, `thag2.35`, `thag6.2`) **đảo** `0.3`/`0.4` cho nhau. Tôi theo đa số, và không sửa nhóm lệch vì ngoài lát. `Ekakanipāta` → *Bộ Một Bài Kinh*; `Theragāthā 1.N` giữ **số** như `thag1.42:0.1`.

  **Dấu lược ở dòng kết `:1.5`.** Pāli khoá này là `… <tên> thero ….` — hai dấu lược — và tôi giữ đúng hai, không mở rộng. Sujato **để trống** cả `:1.5` ở cả tám bài; tầng Việt có tiền lệ giữ nguyên dạng lược này (`thag1.23`, `thag1.107`, `thag1.113`), nên tôi không sinh câu *Bạch Thế Tôn, … đã từng nói bài kệ này* như một số bài khác trong tầng đã làm. Ô Anh trống ở đây không phải sự đồng thuận.

  **Tôi không chạy `npm run validate|test|check|build`** (đợt này cấm), nên `technical_integrity` chấm 9.6 chứ không phải 10.0. Hàm `kiểm()` của `_hvi.py` chỉ quét khoá Pāli ≥ 40 ký tự nên ở cả tám bài này `cần` RỖNG và assertion không tự chạy; tôi đã tự quét MỌI khoá (đúng segment ID, NFC, trùng nguyên văn, số dấu lược, Pāli lọt, cân ngoặc kép) và in từng cặp Pāli ↔ Việt để đọc đối kháng. Tầng Việt Thích Minh Châu không có ở commit đã ghim (chỉ có Pháp Cú), nên đối chiếu là Pāli + Sujato.
