notes: |-
  Dịch từ Pāli root đã ghim. Tầng Anh CÓ và đã đo: source/upstream-manifest.json liệt kê sutta/kn/thig/thig8.1_translation-en-sujato.json, 37/39 khoá có chữ (im lặng 9.1 là dòng ghi tên tác giả, và 10.1 là dòng khép tập).
    Coverage theo source/layers.yaml: Pāli có nội dung = 0 khoá (mọi dòng kệ đều ngắn hơn 40 ký tự), mẫu số bằng 0 nên cổng không chặn, không cần entry reference-gaps.
    0.1 giữ Pāli `Therīgāthā 8.1` — tự tra như brief yêu cầu: 44/57 tệp thig viết đúng dạng `Therīgāthā X.Y`, 4 tệp bỏ số, 9 tệp dùng Trưởng Lão Ni Kệ. Đối xứng với thag (200/223). 0.2 cùng Aṭṭhakanipāta với thag8.1 nên dùng y như bên đó (Bộ Tám Bài Kinh). 0.3 là tên bài trong thig, theo thig3.8:0.3; Trưởng Lão Nữ đa số ở vị trí này (34 tệp so với Trưởng lão ni 23 tệp).
    PĀLI THẮNG Ở 6.1–6.4: bản Anh đã ghim SÁCH THỨ TỰ (đặt câu Đức Phật đã thuyết giảng Giáo pháp vào 6.1 và các vế tính từ đó vào 6.2–6.4), trong khi Pāli đi đúng thứ tự Akampiyaṁ atuliyaṁ, aputhujjanasevitaṁ; Buddho dhammamadesesi, tattha me nirato mano. Dịch theo Pāli. Đây là disagreement thật đã phân xử bằng Pāli, nên ambiguity_integrity 9.2.
    2.1–2.4 và 3.1–3.3 TRÙNG NGUYÊN VĂN sn5.7:2.1–2.4 và :3.1–3.3 (2 cặp mỗi khoá) nên dùng lại y nguyên: chư thiên Tam Thập Tam, Tusita, Hóa Lạc, Tha Hóa Tự Tại. 5.1 và 5.4 trùng sn5.7:4.1 và :4.4 (mỗi khoá 1 cặp) nên y nguyên; 5.2 và 5.3 KHÔNG trùng vì sn5.7 ghi padhūpito (bốc khói) và pajjālito, còn bài này là padīpito và pajjalito — dịch theo Pāli của chính mình, không theo bản Anh của sn5.7.
    4.2 `sakkāyasmiṁ purakkhatā` → ta cứ nằm dưới gánh nặng của thân kiến (purakkhatā = đứng dưới, lấy thân kiến làm gánh). 4.4 sārino → không dứt.
    7.3 `Tisso vijjā anuppattā` → ba minh đã chứng đạt: có 8 cách trong tầng, đa số là Tôi đã chứng ngộ tam-minh (7) và Ba minh đã chứng đắc (6), nhưng cả hai đều thêm chủ ngữ đầu dòng mà Pāli không có; chọn cách giữ nguyên Pāli (có 2 cặp cùng dạng). 7.4 TRÙNG 93 cặp, đa số đã làm tròn lời dạy của Đức Phật.
    8.1–8.3 trùng nguyên văn thig3.7, thig3.8, thig6.3 và sn5.3 (8.1 có 4 bản khác nhau: Ở mọi nơi, hoan hỷ đã bị quét sạch 2 lần, Sự say mê hỷ ái 1, Mọi hỷ ái 1 — chọn đa số); 8.3 có 3 bản, chọn Hãy hiểu rõ điều này, kẻ xấu xa theo thig3.8. 8.4 antaka → kẻ Kết Thúc, theo thig6.3:4.4 (Pāli ở đây có dấu chấm, khác thig3.8 có ”ti).
    9.1 có HAI dấu lược, đếm được, giữ đúng hai. 10.1 `Aṭṭhakanipāto niṭṭhito` → Bộ Tám Bài Kinh đã khép lại; thig chưa có tiền lệ cho khoá khép tập, tham theo Tập mười một phẩm của Tăng Bộ đã khép lại.
    Tầng vietnamese-current vắng, không có lớp lấp english-project. Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6. 8/8 khoá đã kiểm: ngoặc kép cân (mở 3 ở 1.1, 2.1, 3.1; đóng 3 ở 1.4, 2.6, 8.4).
