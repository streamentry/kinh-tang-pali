notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B1 — snp5.9:2.4, snp5.9:4.4 (`visattikā` = sự vướng mắc (ở đời); `tare` = có thể vượt qua).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 2): sửa 2.3 (`viditvā` "liễu tri" → "biết rõ": DPD "having known"; A5/B9 dành "liễu tri" cho họ `pariññā`; khớp cnd12:9.3); sửa 2.4 ("vị ấy có thể vượt qua" → "con có thể vượt qua": lời thỉnh của Hemaka, lời giải cnd12:13.5 `sato tareyyaṁ … vītivatteyyaṁ` ngôi 1, khớp cnd12:9.4; Sujato đọc "one"); giữ 4.1 (`aññāya` "liễu tri", như cnd12:21.1).
  Thống nhất cấp kho 2026-10-17 (B19, họ √sam): 4.3 upasantā «Họ luôn an tịnh» → «Họ luôn yên lặng» theo B19 (upasanto = «yên lặng»), khớp lời giải cnd12:24.2 (upasamitattā … upasantā) và kệ trích cnd2:56.3, cnd12:21.3, 24.1, 24.5, 26.3; tiền lệ upasanto carissasi «sống yên lặng» snp5.12:4.4.
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 3.1–3.3 (lệch ranh khoá: bản Việt theo thứ tự dòng của bản Anh nên 3.1 mang 'chandarāgavinodanaṁ', 3.2 mang 'diṭṭhasutamutaviññātesu', 3.3 mang 'piyarūpesu'; lời giải cnd12:16.2–16.5, 18.2 giải từng dòng; theo cnd2:55.1–55.3, như cnd2 notes đã báo).
