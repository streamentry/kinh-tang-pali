  ⚠ TẦNG ANH SAI Ở HAI KHOÁ — ĐÂY LÀ LÝ DO `triangulation` KHÔNG CAO. Chỉ là cảnh báo, mọi quyết
  định nghĩa dưới đây đã quay về Pāli.
  · `:1.2` `ujjuhānova pāvuse;` — bản Anh đã ghim dịch *"You're like a little bird in the
    monsoon!"*. Pāli `ujjuhānova` là **cái dù bị lật ngược** (`ujjuhā` = ngửa/lộn; `nova` = như),
    không phải chim. Tôi dịch *lật ngược như cây dù giữa mùa mưa lớn*.
  · `:2.1` `Yathā abbhāni verambho,` — bản Anh đã ghim dịch *"Just as the wind in Verambhā"*, coi
    `verambho` là tên thành. Nhưng `verambho` là số ít cách ngữ của `verambha` (mùa mưa lớn, mạnh),
    còn `Verambhā` thì số ít cách ngữ phải là `verambhā`; `abbhāni` là *đám mây*, `pāvuse` là
    *trong mùa mưa*. Tôi dịch *Y như giữa mùa mưa lớn, / gió xua tan những đám mây;*.
  ⇒ Cả hai khoá này tôi **cố ý không theo** bản Anh, vì Pāli là authority cuối cùng. Người biên
  tập nên biết đây là điểm lệch, không phải lỗi đánh máy.

  BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ — tôi đã ghi ở đây, **không** thêm vào thân kinh.
  · `1.1` `tāta` — ta từ gọi ân cần, cũng là chữ cha. Tôi dịch *tát cà* vì hai người nói chuyện
    ngang hàng (một vị tỳ-kheo trong rừng bị mời vào thành). Tầng Việt dự án có 41 khoá chứa
    `tāta` nhưng **toàn bộ** dịch *hỡi cha* và đều là chỗ con gọi cha, nên **không** dùng lại được
    ở đây; *tát cà* là cách tôi tự chọn, tiền lệ **0** trong cả tầng. Cần biên tập xác nhận.
  · `2.3` `Saññā me abhikiranti` — `saññā` ở đây có thể là *ý hướng/niềm mong muốn* hoặc là
    *sự nhận thức*; bản Anh đã ghim chọn *perception*, tôi chọn *ý hướng* vì kèm theo là
    `vivekapaṭisaññutā` (gắn bó với viễn ly), và cả vế đứng là **ý hướng của tôi bị xua tản** —
    đọc thành *nhận thức* thì câu không còn làm gì. Cả hai cách đều defend được; tôi chọn cách
    làm câu có nghĩa.
  · `3.1` `Apaṇḍaro aṇḍasambhavo` — Pāli **không** ghi chữ *quạ*; nó chỉ nói *đen, sinh ra từ trứng*
    và `:3.2` nói *kẻ ở tại bãi tha*. Tôi dịch *con quạ* ở `:3.2` để câu đóng, dựa trên
    `apaṇḍara` (đen) + `sīvathikāya` (bãi tha) và cũng như bản Anh đã ghim. Đây là **suy luận có
    căn cứ từ chính Pāli**, không phải thêm ý; nhưng tôi ghi rõ để biên tập cân.
  · `8.1` `Pariciṇṇo mayā satthā` — `satthā` đứng số ít cách ngữ, nên câu có thể đọc là *Bậc Thầy
    ấy đã được tôi phụng sự trọn vẹn* (tân ngữ) hoặc là cách gọi thẳng *Đạo sư ơi, …*. Tôi theo
    cách thứ nhất, khớp với `thag2.29:2.1` `Satthā ca pariciṇṇo me` đã dịch *Tôn giả thì tôi đã
    phụng sự*.
  · `9.4` `sabbasaṁyojanakkhayo.` — `saṃyojana` là *sợi trói/kiều chế*; tầng có cả *mọi trói buộc*
    (`thag2.28`) lẫn *mọi kiết sử* (`thag6.1`) lẫn *mọi hào kiệt* (`thag2.8`), chia đều. Tôi theo
    `thag2.28` vì `kiết sử` là từ Hán–Việt đã mang nghĩa riêng cho `saṃyojana` ở đây còn
    `thag2.8` đã dùng *hào kiệt* cho `hā*` của cùng bài.

