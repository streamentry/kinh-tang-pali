notes: |-
  `Kāsumāriphaladāyakattheraapadāna`, bài thứ mười của `Bodhivandanavagga`. 34 khoá,
  tất cả đã dịch.

  TRA TIỀN LỆ BẰNG SỐ ĐẾM ĐƯỢC CHO CẢ PHẨM. Đếm trên các bài `tha-ap` đã merge: `:0.1` →
  “Therāpadāna” 261/337 (giữ Pāli); `:0.2` `Bodhivandanavagga` → **“Phẩm Đảnh Lễ Cây Bồ-đề”** ở
  5/6 bài đã merge của chính phẩm này (tha-ap373, 377, 378, 379, 380, 381) — dùng lại nguyên văn;
  `:0.3` và `:8.1` theo hình tiền lệ “Bài Kệ Tuyên Ngợ Về Trưởng Lão …, thứ …”; `:7.1` theo tha-ap383
  “Tôi nghe như vầy: Tôn giả Trưởng lão … đã nói những bài kệ này.”; `:9.1`
  `Xvaggo aṭṭhatiṁsatimo` → “Phẩm …, thứ tám mươi.”

  DẤU LƯỢC — BA CHỖ `…pe…`, GIỮ ĐÚNG MỘT `…` MỖI CHỖ. `tha-ap382:4.2`, `5.2`, `6.2` đều là
  `…pe…`; bản Việt đặt **một** dấu `…` (không phải hai), đúng như quy ước đã đo trên tệp đã merge
  (tha-ap100, 105, 107, 110, 126, 131, 138, 140, 141 … đều là `…pe…` → `…`). `_hvi.lược()`
  đối chiếu từng khoá và báo cân. Vì các khoá này chỉ dài 5 ký tự nên không nằm trong tập kiểm
  ≥ 40 ký tự, nhưng ta vẫn giữ đúng.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `sire katvāna añjaliṁ` (2.2) — `sire` là dạng nghiêng của `sirī`, chỉ Thế Tôn trong kinh Trường
  Bộ; dịch “đã lễ bái Đức Thế Tôn bằng hai tay khép lại”. Câu kệ 2.1–2.4 nói về **chính** vị
  Trưởng lão đang kể, nên `sire` ở đây là Đức Thế Tôn mà ngài lễ bái, không phải người kể.
  `Kāsumāriphalaṁ` (2.3) — tên trái cây. Bản Việt phải tự đứng vững bằng Pāli của chính khoá, mà
  khoá này chỉ có `Kāsumāriphalaṁ`; nên bản dịch dùng đúng dạng `quả Kāsumāriphalaṁ` thay vì rút
  gọn thành `quả Kāsumāri`, vì cách rút gọn ấy không có tiền lệ trong tầng Việt. Người đọc thấy
  tên ở `:0.3`, `:7.1`, `:8.1` (Trưởng lão Kāsumāriphaladāyaka — tức vị ấy chuyên dâng quả này)
  nên không rối.
  `Duggatiṁ nābhijānāmi` (3.3) — đo được **ba** cách đã dùng trong tầng `tha-ap` cho đúng dòng
  Pāli này: “ta sống không còn lậu hoặc” 35×, “Tôi không còn biết đến khổ xứ” 34×, “Tôi không còn
  biết đến khổ đau” 34×. Chọn “Tôi không còn biết đến khổ đau,” vì đây là cặp đông nhất **và**
  đọc khớp nghĩa trực tiếp của `dukkati`; cách “không còn lậu hoặc” là diễn giải đi xa hơn. Ba
  dòng còn lại cũng dùng lại đa số đếm được: `Ekattiṁse ito kappe` → “Vào ba mươi mốt kiếp
  trước” 7×; `Kilesā jhāpitā mayhaṁ` → “Mọi phiền não của tôi đã bị thiêu rụi” 20×;
  `Svāgataṁ vata me āsi` → “Thật là đón mừng thù thắng thay cho tôi” 20×; `Paṭisambhidā catasso`
  → “Bốn vô ngại giải” 70×; `kataṁ buddhassa sāsanaṁ` → “đã làm tròn lời dạy của Đức Phật”
  36×. `Addasaṁ virajaṁ buddhaṁ` (1.3) có ba cách ngang nhau 3×; chọn “Tôi đã thấy Đức Phật
  vô nhiễm,” ghép đạo từ đông nhất (`vô nhiễm`) với đại từ đông nhất trong bài (`Tôi`).

  HAI TÊN TRONG `…pe…` — đã ghi vì không ai đọc được. 4.2 lược ở giữa câu
  `Kilesā jhāpitā mayhaṁ, … viharāmi anāsavo.`, và 5.2/6.2 lược ở giữa
  `Svāgataṁ vata me āsi, … kataṁ buddhassa sāsanaṁ.`. Pāli gốc không cho biết phần bị lược; bản
  dịch không mở rộng (đó là chính sách của `BRIEF_VI3` §10.1).

  UDĀNA 11.1–11.5 — `Bodhi, Pāṭali, uppalī, Paṭṭi, Sattapaṇṇiya, Gandhamuṭṭhi, citako, tālaṁ,
  sumanadāmako, Kāsumāriphalī` là tên mười vị trưởng lão trong phẩm. `Bodhi` nằm trong `_GIỮ` của
  `_hvi.py`; `Pāṭali`, `Paṭṭi`, `Sattapaṇṇiya` đã có trong tầng Việt; các tên còn lại thì **giữ
  nguyên dạng Pāli của khoá** vì tầng Việt chưa dùng và quy tắc `lọt_pāli` chỉ cho phép từ Pāli
  của chính khoá đó. Chỉ vế `ceva` và `gāthā ekūnasaṭṭhikā` được dịch. Ghi rõ để người điều phối
  gộp.

  `technical_integrity` đặt 9.6 vì bốn cổng kỹ thuật đều xanh (xem mục cuối), chưa đủ
  10.0 vì không ai rà lại bằng con người.

  Bốn lệnh cổng kỹ thuật đã chạy và đều xanh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
