notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng tham khảo tiếng Anh nào ở commit đã ghim cho uid này.
  Tiền lệ đếm được: `Anumānapañha` -> Câu hỏi về suy luận 12/18 (đúng cả mil6.3.7/8/9 cùng phẩm); `Vessantaravagga` -> Phẩm Vessantara 3/3; `Milindapañha` -> Milindapañha 194/205.
  Danh sách hình phạt ở 1.3 trùng nguyên văn với mn14:13.3 và mn129:4.2/29.2/29.4; DÙNG LẠI NGUYÊN VĂN bản mn129 (3 lần trong mn129 so với 1 lần ở mn14): chặt tay, chặt chân, chặt cả tay lẫn chân, cắt tai, cắt mũi, cắt cả tai lẫn mũi, nồi cháo, cạo vỏ ốc, mỏ Rāhu, tràng hoa lửa, đuốc tay, vòng bèo, y vỏ cây, hình con nai, móc thịt, vị kahāpaṇa, muối chua, vòng xà, nệm rơm, tạt dầu nóng, thả chó cắn, đóng cọc sống, chém đầu bằng kiếm.
  `adhimattaṁ balavataraṁ` -> vượt trội và mạnh mẽ hơn 4/4 (mil5.4.1). `Āma` -> Vâng 63/63 trong mil (toàn tầng: Vâng 157 so với Dạ vâng 99). `kāmesumicchācārin` -> kẻ hành dâm trong các dục. `diṭṭheva dhamme` -> ngay trong hiện tại. `anayabyasanaṁ` -> tai họa và tổn hại. `sūle` -> đóng cọc sống.
  CHÊNH LỆCH CỐ Ý VỚI mil5.2.2 (cùng lát): `Bhante nāgasena` ở đây dịch Thưa tôn giả Nāgasena — đúng cả 3 bài cùng phẩm mil6.3.7/8/9 và là đa số toàn mil (174 so với 114); mil5.2.2 dùng Bạch ngài Nāgasena theo mil5.2.1/6/7/8. Đã ghi để người điều phối gộp nếu muốn thống nhất.
  BẤT ĐỊNH ghi lại: (1) `yasmā ca kho … dāyake na vicinanti` (8.5) — bản dịch đọc là các bậc bố thí không suy xét trước câu `chúng ta sẽ trao của cải hay danh tiếng`, nên điều thiện không được chứng nghiệm ngay trong hiện tại; đây là cách đọc gắn với `diṭṭhadhammavedanīya` của MN 58, nhưng cách đọc khác cũng có thể. (2) `Vattamānakepi … bhave` (3.2) — `bhave` ở đây là cách xưng hô vua Nandi nhưng Pāli ghi trống; dịch theo `mahārāja`. (3) `kumudabhaṇḍikā` (6.2-6.4) giữ Pāli vì không có tiền lệ; `kumuda` có thể là sen trắng hoặc cây gạo/thèm — bản dịch chọn nghĩa cây lúa theo `dhaññajāti māsalūnā`. (4) `asītikabandharūpāni` (4.7) dịch xiềng xích sắt. (5) `uttarasāṭakena` (3.6) giữ tên Uttarasāṭa; `uttara` có thể là chỉ phẩm vật cao cấp hơn chứ không phải tên riêng.
  NĂM TÊN RIÊNG bị chốt `lọt_pāli` chặn (Pāli thêm hậu tố biến cách nên chuỗi không trùng từ nào trong cùng khoá): Ekasāṭa, Uttarasāṭa, Bhaddasāla, Caṇḍagutta, Caṇḍapajjota, cộng thêm thuật ngữ kumudabhaṇḍikā. Đã khai vào bộ nhớ tiến trình đúng như docstring của `_hvi.py` dặn, KHÔNG sửa `_hvi.py`; vòng lặp trong script tự kiểm rằng mỗi tên có thật trong Pāli của chính bài này (bỏ dấu, bỏ hậu tố) trước khi khai. `Sādhīno` (2.3) dùng dạng chính tả trong Pāli `sādhīno`.
