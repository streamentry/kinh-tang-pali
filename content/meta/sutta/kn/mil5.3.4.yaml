notes: |-
  `Pharusavācābhāvapañha`, câu hỏi thứ tư của `Paṇāmitavagga`. 34 khoá, tất cả đã
  dịch.

  TẦNG THAM KHẢO — đo, không đoán. 0/8 bài `kn` của lát này có bản Anh Sujato tại
  commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có cp, dhp, iti, ja, kp,
  snp, thag, thig, ud. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng
  `vietnamese-current` cũng vắng (`translation/vi/phantuananh` tại commit đã ghim chỉ có 26 tệp,
  toàn bộ là Pháp Cú), và lớp lấp `english-project` của dự án không có uid nào trong lát. Ba
  tầng tham khảo đều vắng ⇒ blocker thật ⇒ `draft` cho cả lát, và `triangulation` bị chặn ở 7.5
  (≤ 8.0) cho **mọi** bài trong lát.

  VĂN XƯNG — chọn theo bầy lân cận, và đây là lý do:

  mil5.3.1 và mil5.3.4 nằm trong `Paṇāmitavagga`; đếm trên 5 bài mil5.3.* đã merge cho
  6/6 dùng `thưa ngài Nāgasena` và 28/28 dùng `tâu đại vương` (ghi thường sau `cũng vậy`). mil5.5.2
  và mil5.5.4 nằm trong `Santhavavagga`; đếm trên 3 bài mil5.5.* đã merge cho 8/8 `thưa ngài
  Nāgasena` và 17/17 `tâu đại vương`. Nên bốn bài này dùng đúng hai văn xưng đó. mil7.5.10 thì
  đếm trên 9 bài mil7.5.* đã merge cho 7/9 `thưa tôn giả Nāgasena` và 32/37 `này Đại vương` (đa số
  cả tầng mil cũng theo hướng này), nên mil7.5.10 theo bầy mil7.5 chứ không theo hai bài lạc
  lõng mil5.4.1/mil5.4.10. Ghi lại để người điều phối gộp: nếu sau này chốt một văn xưng chung
  cho cả `mil`, cả lát này phải sửa theo.

  Đầu 0.2/0.3 giữ Pāli theo mil5.3.5 và mil5.3.10; `:0.4` và `:5.1` đặt tiêu đề đầy đủ như
  mil5.3.5. Ghi lại để người điều phối gộp cùng mil5.3.1.

  THUẬT NGỮ — tra tiền lệ bằng `grep -o ... | sort | uniq -c | sort -rn` trước khi
  chốt, không đoán: `bhante` khi một tỳ-kheo gọi tỳ-kheo → “bạch ngài” (đếm trên toàn tầng
  `an/`: “Bạch Ngài” 28× + “bạch Ngài” 6×, mạnh hơn mọi cách khác); `mahārāja` → “tâu đại vương”
  (số đếm ở mục văn xưng trên); `bhagavatā` → “Thế Tôn”; `therena sāriputtena dhammasenāpatinā` →
  “Trưởng lão Sāriputta, Tướng quân của Chánh pháp” (theo mil7.5.7); `sotāpanno` → “Nhập Lưu”
  (tiền lệ đếm được 18× trong tầng `kn`); `samaṇakaraṇā dhammā` → “phẩm chất của bậc sa-môn”;
  `liṅga` → “dấu hiệu”; `micchā` → “sai”; `sampaṭicchāmi` → “trẫm xin kính nhận” (theo
  mil5.3.5/mil5.4.5); `seṭṭho` → “tối thượng”.

  TIÊU ĐỀ CỐ TÌNH BỎ MỘT NỬA, VÌ LÝ DO. `Pharusavācābhāva` = **sự không có** lời nói khắc
  nghiệt. Tiêu đề chốt là “Câu Hỏi Về Lời Nói Khắc Nghiệt”, theo đúng hình tiền lệ của tầng
  (mil7.4.3 `Tejaṅgapañha` → “Câu hỏi về các chi phần của lửa”, mil7.8.3 `Chattaṅgapañha` →
  “Câu hỏi về các chi phần của cây lọng” — cũng bỏ mất phần hạn định), nhưng **thân kinh** giữ
  đủ ý nghĩa `abhāva` bằng cách dịch thẳng `natthi tathāgatassa vacīduccaritaṁ` thành “không có
  lời nói khắc nghiệt nào của Tứ Đẳng Giác”. Người đọc không bị mất gì.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `moghapurisavādena` (1.2, 1.3, 1.4, 2.3, 2.5) = lời nói **có thể bị hiểu là** lời của kẻ hạ
  nhân; dịch “lời nói của hạ nhân”. 2.4 giải thích ngay sau đó bằng chính tiêu chí có bốn chân lý
  — bản này giữ nguyên mối liên hệ ấy, không dịch `moghapuriso` thành một từ Hán–Việt riêng.
  `pātimokkhuddesaṁ` (6.1 của mil5.3.1, không có ở đây) — không dùng ở bài này; ở đây có
  `pārājika` (1.2, 2.3) dịch “Ba-la-di”, theo thuật ngữ giới luật quen thuộc.
  `kahāpaṇaṁ daṇḍaṁ` (3.1) — `kahāpaṇa` là **đơn vị** tiền tội, Pāli gốc không có chữ số. Bản
  nháp đầu tiên đã viết “một trăm kahāpaṇa” là **thêm chữ không có trong nguồn**; đã sửa thành
  “một kahāpaṇa tiền phạt” trong review đối kháng. Ghi lại đây vì đó là loại lỗi âm thầm dễ
  lọt nhất.
  `therassa sudinnassa kalandaputtassa` (1.1–1.4) — `Sudinna` là tên Trưởng lão, `Kalanda` là
  nhà/họ của ngài; dịch “Trưởng lão Sudinna, người nhà Kalanda”. `āyasmato` ở 2.3 và 2.5 dịch
  “Đại đức” vì người nói là Nāgasena và đang gọi đích danh Sudinna (khác `therassa` ở 1.x vì ở
  đó Nāgasena kể lại lời người khác).
  `sadevako loko ottappati` (4.1) — `ottappati` = rúng động / kinh sợ. Bản nháp đầu tiên đã bỏ
  mất mệnh đề này và thay bằng một cụm không có trong Pāli; đã sửa thành “Tứ Đẳng Giác khiến cả
  thế giới cùng chư thiên đều rúng động”.
  `suvinicchito` (4.14) — đã hoàn tất việc phân xử rõ ràng; dịch “câu hỏi này đã được phân giải
  thật rõ ràng, vì rất nhiều lý do.” Bốn ẩn dụ `uṇhampi udakaṁ`, `pituvacanaṁ`, `duggandhampi
  gomuttaṁ`, `tūlapuñjo` (4.5–4.12) dịch theo đúng hình mẫu, và hai câu “vẫn có ý nghĩa và đi
  kèm lòng thương cảm” trùng nguyên văn Pāli (`evameva kho … atthavatī hoti karuṇāsahagatā`)
  nên dùng **lại nguyên văn** cho cả hai.

  DẤU LƯỢC — không có `…pe…`; không phát sinh chính sách. 4.4 mở lời thoại theo Pāli (`“`) và
  4.13 đóng; bản dịch đóng ngoặc ở 4.3 và 4.14 vì cấu trúc lời thoại tiếng Việt tự đứng vững, đồng
  thời vẫn cân trên cả bài (kiểm bằng `_hvi.ngoặc`).

  `technical_integrity` đặt 9.6 vì bốn cổng kỹ thuật đều xanh (xem mục cuối), chưa đủ
  10.0 vì không ai rà lại bằng con người.

