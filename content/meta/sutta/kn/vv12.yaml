notes: |-
  Dịch TRỰC TIẾP từ Pāli root — không có tầng Anh đã ghim cho vv12, xem `blocking_errors`. Đối chiếu bằng song song `vv11` (cùng khung `paṭibbatā`, cùng công thức) và bằng tiền lệ ở `vv26`, `vv27`, `vv41`, `vv49`, `vv77`.
  Dùng lại nguyên văn các khoá trùng Pāli: 2.1, 2.2, 2.3, 2.4, 3.1, 3.4, 5.3, 5.4, 6.1 — tổng 9 cặp; phần lớn đều lấy từ vv26/vv27/vv41/vv49.
  BẤT ĐỊNH (tên bài): `Dutiyapatibbatā` 0 tiền lệ; theo PED `patibba` là người phụ nữ đã kết hôn, nên dịch Nữ Gả Chồng. Song song `vv11` là `Paṭhamapatibbatā`, cùng lý do.
  BẤT ĐỊNH (đại từ ở 7.1–7.4): `Akkhāmi te bhikkhu` (ta nói với ngươi, này tỳ-kheo) cho thấy người nói không phải nữ thiên đang kể, nhưng `me` ở 7.4 lại cùng giọng kể của nữ thiên (6.2–6.4 cũng dùng `me`). Cả hai cách đọc đều không khớp trọn vẹn; giữ đúng cách chia đại từ của Pāli (`te` bị nói với, `me` là của người nói) và KHÔNG tự chọn một cách hiểu trong thân kinh.
  BẤT ĐỊNH (ngôi kể 4.1–6.4): tiền lệ chia làm hai (`tôi` 10 lần cho `Tena metādiso vaṇṇo,`; `ta` 3 lần, và vv26/27/49 dùng `ta`). Chọn `ta` xuyên suốt bài để không trộn hai ngôi trong cùng một lời thoại.
  `Pīṭhavagga` (0.3) 1 tiền lệ: một agent khác đang làm `vv1` chọn đúng `Phẩm Pīṭha` — theo mẫu `Phẩm Mañjiṭṭhaka` cho `Mañjiṭṭhakavagga` mà giữ tên riêng Pāli.
  0.1 giữ `Vimānavatthu` theo tiền lệ 24/25; 0.2 `Itthivimāna` theo đa số 4/5 (Cung Điện Nữ Hư Không).
  Tên bộ: coordinator nói `vv` là Kinh Tập Bài Kệ, nhưng đo trên đĩa chuỗi đó có 0 lần xuất hiện; tầng tên của chính SuttaCentral tại commit đã ghim ghi `super-name:28.vv` = Chuyện Thiên cung. 0 tiền lệ trong kho nên theo tiền lệ tầng.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` do coordinator chạy; `npm run build` chỉ cần thêm cho bài `published`. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
  Lượt cải thiện 2026-10-11 (kiểm toán độc lập, đọc đối kháng từng cặp Pāli↔Việt): 24/35 khoá đổi, trong đó 9 khoá có lỗi nghĩa thật ở bản trước. Điểm hạ: semantic_fidelity 9.0 → 8.7, terminology 8.8 → 8.5, triangulation 7.5 → 7.0 (bản trước không có tầng Anh độc lập nên không bắt được các lỗi dưới đây), han_viet_balance 9.3 → 9.2, ambiguity_integrity 8.7 → 8.5; final_score 9.02 → 8.88.
  Sai chủ thể: 7.2 và 7.3 (`Manussabhūtā yamakāsi puññaṁ`, `Tenamhi evaṁ jalitānubhāvā`) bị đọc thành lời hỏi ngược lại tỳ-kheo ("ngươi đã tạo phước báu gì", "ngươi trở nên rực rỡ"); Pāli là nữ thiên nói về mình (`manussabhūtā` giống cái, `amhi` ngôi thứ nhất) → "tôi đã tạo phước báu nào", "tôi có oai lực rực rỡ như vậy". Bất định ghi ở notes cũ cho 7.1–7.4 là bất định giả (`te` là "với ngài", `me` là của nữ thiên; không có chỗ nào thật sự mơ hồ), nay xoá khỏi thân kinh.
  Sai/thêm nghĩa trong lời kể: 4.3 `Pāṇātipātā viratā` bị dịch "giết người và cướp của" (Pāli chỉ nói sát sinh; trộm cắp là 4.4) → "tránh xa việc sát sinh" (tiền lệ vv24, vv37, vv84). 5.1 `Amajjapā no ca musā abhāṇiṁ` bị dịch "chưa từng hành xử thô kệ, chưa từng nói lời không thật" (mất giới không uống rượu, thêm "hành xử thô kệch" không có trong Pāli) → "không uống chất say, cũng không nói dối" (tiền lệ vv31, vv61, vv84). 5.2 `Sakena sāminā ahosiṁ tuṭṭhā` bị dịch "tự làm chủ, lòng thấy đủ" (`sāmin` = chồng; đây là lý do bài tên `patibbatā`) → "hài lòng với chính chồng mình" (vv61:5.2 cùng khung, "bằng lòng với vợ mình"). 6.2 `tena me idha mijjhati` "rực rỡ ở nơi này" → "thành tựu được ở nơi đây" (`mijjhati` = thành tựu; công thức đã quyết ở vv7; 35 nơi trong họ vv). 6.3–6.4 `bhogā` "những điều mong muốn" → "của cải" (glossary `bhoga` = tài sản; tiền lệ họ vv "của cải nào hiện khởi"), `manaso piyā` → "tâm ưa thích". 1.2 `anekacittaṁ` bổ nghĩa cho cung điện, không phải "tâm tư" → "muôn vẻ đa dạng"; `āruyha` = bước lên (không phải "bước vào"). 1.4 bỏ "tùy ý" (không có trong Pāli) → "đủ loại thần thông biến hóa" (`uccāvacā`). 3.3–3.4: `yassa kammassidaṁ phalaṁ` là mệnh đề quan hệ (đây là quả của nghiệp nào), không phải khẳng định "quả báo của nghiệp này là thế" → "quả báo này là của nghiệp nào" (câu cũ có ở 85 khoá họ vv; lan, chỉ đổi ở vv12).
  Hô cách và ngôi: 1.3, 2.1, 7.1 `devi mahānubhāve` / `bhikkhu mahānubhāva` là hô cách (hô cách giữ, "này nữ thiên/này tỳ-kheo có đại oai lực"; 2.1 trước đây gắn "có uy thế lớn lao" vào "nàng đã chứng đắc" đọc như tân ngữ); thống nhất "đại oai lực" theo vv11/vv33 thay "uy thế lớn lao". Người hỏi là Tôn giả Moggallāna gọi nữ thiên là "nàng" xuyên suốt (1.3 và 1.5 "ngươi", 2.4 "ngài" lệch nhau và lệch Pāli `te`). Nữ thiên tự xưng "tôi" xuyên suốt 4.1–7.4 (thay "ta", vì 7.1 nói thẳng với tỳ-kheo; tiền lệ họ vv phần lớn "tôi" như vv11/vv26/vv33). Lưu ý: ghi chú cũ "ta" 3 lần/"tôi" 10 lần là số không đáng tin; vv61 (nam thiên) dùng "ta". 4.1 thêm lại dấu “ mở lời thoại của Pāli (bản trước thiếu).
  Còn nguyên, ghi nhận (không sửa riêng một tệp để không lệch bộ): (a) 0.2 `Itthivimāna` dịch "Nữ Hư Không" là sai (không có `ākāsa`), lặp ở khoảng 51 tệp vv; (b) 0.4/8.1 `Dutiyapatibbatā` dịch "Nữ Gả Chồng" cũng nghi sai: `patibbatā` = người vợ trung thành với chồng, vv32:9.2 trong kho dịch "vợ hiền chung thủy" và vv11:5.2 dịch "kính trọng chồng mình"; ghi chú cũ nói theo "PED patibba là người nữ đã kết hôn" không đủ căn cứ. Nên sửa cặp vv11–vv12 cùng lúc, đề xuất "Chuyện Cung Điện Người Vợ Chung Thủy (Thứ Nhất/Thứ Hai)"; (c) `cakkhumato` "Đấng Có Mắt Tuệ" thêm "Tuệ" theo tiền lệ vv26; (d) 5.3 "Với cơm ăn và nước uống cùng tâm tịnh tín" giữ nguyên theo tiền lệ vv11, hơi mơ hồ về cú pháp (`annañca pānañca` là tân ngữ của `adāsiṁ`); (e) 1.1/1.2/1.4 tương tự vv31, vv82, vv11 (lan: `anekacittaṁ`, `uccāvacā iddhi`); các tệp đó chưa sửa.
  Số đếm: 35/35 khoá, thứ tự khớp Pāli; nháy “” từng khoá khớp Pāli (35/35, 0 lệch); dấu lược `…` 0 lệch/0 khoá có; NFC 35/35; 0 cặp Pāli trùng trong bài (phép trùng nguyên văn chạy rỗng); không số Pāli cần tính; 0 Pāli lọt sang Việt (ngoài tên Moggallāna/tiêu đề). Chưa có tầng tham khảo độc lập nên triangulation ≤ 7.0.

  **Đối chiếu độc lập 2026-10-14** với bản Việt nguyên bài của Bhikkhu Indacanda (bản dịch 2011, theo ấn bản Buddha Jayanthi). Đã so từng khoá trong 35 khoá. 2 khoá bất đồng nghĩa → sửa 2, giữ 0, bất định 0. Sửa `:0.4` và `:8.1` (`Dutiyapatibbatāvimāna…`): trước *Nữ Gả Chồng Thứ Hai* → sau *Người Vợ Chung Thủy Thứ Hai*, vì `patibbatā` là người vợ một lòng với chồng, không phải *người nữ đã kết hôn*; cùng chữ ở `vv11:0.4` và `vv11:9.1` (đã là *Người Vợ Chung Thủy Thứ Nhất*), `vv32:9.2`, `an7.63:10.3`, `ja547:369.4` (*vợ thủy chung/tận tụy với chồng*), nên tên hai bài cặp đôi nay nhất quán. Cần đồng bộ `translationTitle` trong metadata với `:0.4`. 33 khoá còn lại cùng nghĩa với bản nguyên bài, gồm đúng các chỗ đã sửa ở lượt 2026-10-11: `:7.2`–`:7.3` là nữ thiên nói về chính mình, `:4.3` chỉ sát sinh, `:5.1` không uống chất say, `:5.2` hài lòng với chồng, `:6.3`–`:6.4` của cải. Bản nguyên bài độc lập đọc đại từ ở `:7.1`–`:7.4` giống cách đã chọn, nên bất định cũ về đại từ ở đó không còn. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.
