  Dịch TRỰC TIẾP từ Pāli root — không có tầng Anh đã ghim cho vv12, xem `blocking_errors`. Đối chiếu bằng song song `vv11` (cùng khung `paṭibbatā`, cùng công thức) và bằng tiền lệ ở `vv26`, `vv27`, `vv41`, `vv49`, `vv77`.
  Dùng lại nguyên văn các khoá trùng Pāli: 2.1, 2.2, 2.3, 2.4, 3.1, 3.4, 5.3, 5.4, 6.1 — tổng 9 cặp; phần lớn đều lấy từ vv26/vv27/vv41/vv49.
  BẤT ĐỊNH (tên bài): `Dutiyapatibbatā` 0 tiền lệ; theo PED `patibba` là người phụ nữ đã kết hôn, nên dịch Nữ Gả Chồng. Song song `vv11` là `Paṭhamapatibbatā`, cùng lý do.
  BẤT ĐỊNH (đại từ ở 7.1–7.4): `Akkhāmi te bhikkhu` (ta nói với ngươi, này tỳ-kheo) cho thấy người nói không phải nữ thiên đang kể, nhưng `me` ở 7.4 lại cùng giọng kể của nữ thiên (6.2–6.4 cũng dùng `me`). Cả hai cách đọc đều không khớp trọn vẹn; giữ đúng cách chia đại từ của Pāli (`te` bị nói với, `me` là của người nói) và KHÔNG tự chọn một cách hiểu trong thân kinh.
  BẤT ĐỊNH (ngôi kể 4.1–6.4): tiền lệ chia làm hai (`tôi` 10 lần cho `Tena metādiso vaṇṇo,`; `ta` 3 lần, và vv26/27/49 dùng `ta`). Chọn `ta` xuyên suốt bài để không trộn hai ngôi trong cùng một lời thoại.
  `Pīṭhavagga` (0.3) 1 tiền lệ: một agent khác đang làm `vv1` chọn đúng `Phẩm Pīṭha` — theo mẫu `Phẩm Mañjiṭṭhaka` cho `Mañjiṭṭhakavagga` mà giữ tên riêng Pāli.
  0.1 giữ `Vimānavatthu` theo tiền lệ 24/25; 0.2 `Itthivimāna` theo đa số 4/5 (Cung Điện Nữ Hư Không).
