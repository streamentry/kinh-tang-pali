  Sửa lan 2026-10-14 (cơ học, toàn tầng): ja364:6.1 — `catuttha` dịch số thứ tự “thứ bốn” → “thứ tư”
  (dạng chuẩn của số thứ tự tiếng Việt). Giữ nguyên phần còn lại của từng khoá.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): ja364:6.1 — `catuttha` dịch số thứ tự “thứ bốn” → “thứ tư”
  (dạng chuẩn của số thứ tự tiếng Việt). Giữ nguyên phần còn lại của từng khoá.

  Kiểm toán Jātaka chỉ có Pāli 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): đọc lại đủ 25 khoá; sửa 2.1–2.2 (bỏ "thổi", "trên con đom đóm" không có trong Pāli; `abhimatthaṁ` = nghiền/xát), 3.3 (bỏ "trâu"), 4.1–4.4 (`vividhehi` = nhiều phương tiện, không phải "đúng đắn"; bỏ "mục tiêu", "chí tình"), 5.1–5.2 (`senāmokkha` = tướng đầu quân, `palābha` = sự thu được; bỏ "bảo hộ", "ban phát", "khéo léo"). Còn bất định, giữ nguyên: `migo` (3.2) dịch "kẻ ngu muội", cú pháp `svassa … abhimatthaṁ` (2.1–2.2). Bài tích truyện chỉ dẫn sang Mahāummagga nên không có bản dịch cổ để đối chiếu. Điểm giữ nguyên.
