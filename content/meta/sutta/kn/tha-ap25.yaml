notes: |-
  Dịch trực tiếp từ Pāli root, đủ 117/117 khoá, đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài này không có tầng Anh đã ghim nên không có đối chiếu English độc lập; xem blocking_errors.

  Tiền lệ: dựng chỉ mục Pāli sang Việt trên toàn tầng tha-ap đã dịch trong cây làm việc (511 tệp ngoài bài này). 51/117 khoá có Pāli trùng (bỏ dấu câu, không phân biệt hoa thường) với khoá của bài khác; tổng 2.537 cặp trùng đã dò (phần lớn là 0.1 Therāpadāna 511 cặp và các khoá 28.x), 513 cặp trong đó bản Việt của tầng khác với bản ở đây. 40/51 khoá dùng đúng cách dịch chiếm đa số của tầng. 11 khoá khác đa số hoặc khác chữ, có lý do: 6.3 (tiền lệ duy nhất đổi ngôi ta sang tôi cho đúng người kể trong bài); 9.1 (2 tiền lệ hoà, chọn Khi đã đến cõi trời); 12.2 (20 cặp, 17 khác; các dạng ta đã làm ra, tôi đã làm ra, tôi làm ra đều là cùng nghĩa, chọn dạng tôi đã làm ra vương quyền nơi chư thiên theo tha-ap26 để cùng một người kể); 13.1 (3 tiền lệ ghi Lại thêm bảy mươi lăm lần nữa, thêm hai chữ lại thêm và nữa không có trong Pāli vì ca chỉ là và; theo tha-ap26 viết Và bảy mươi lăm lần); 13.3 (15 cặp Vương quốc rộng lớn ấy, 8 cặp Vương quyền cai quản các vùng đất rộng lớn; chọn dạng thứ hai vì padesarajja là quyền cai quản một vùng và Pāli không có chữ ấy, khớp tha-ap26:9.3); 14.1 (2 tiền lệ hoà, chọn Khi đời sống cuối cùng đã đến); 15.4, 20.4, 21.2 (tiền lệ ghi ta, đổi sang tôi theo người kể; xem phần người nói dưới đây); 24.3 (4 tiền lệ đều khác nhau: Khởi tâm tịnh tín, Phát khởi tịnh tín, đặt trọn lòng tin; chọn làm cho tâm tịnh tín nơi Đức Phật vì cittaṁ là tân ngữ và pasādetvā là dạng sai khiến, khớp tha-ap22:4.2 làm cho tâm mình tịnh tín); 27.3 (419 cặp trùng, 324 cặp khác; dạng chứa đọa xứ chiếm áp đảo trong các dạng cùng nghĩa, dạng Ta không biết mình rơi vào khổ đau 137 khoá không giữ vì duggati là cảnh giới xấu chứ không phải nỗi khổ nói chung, khớp tha-ap26:20.3). Trong chính bài có 5 nhóm Pāli trùng (4.1 với 22.1, 5.3 với 8.3, 9.2 với 14.2, 17.4 với 18.2, 19.1 với 27.1), cả năm Việt khớp nhau và chỉ khác dấu câu hoặc dấu nháy theo Pāli (22.1 mở nháy đơn, 18.2 kết dấu chấm phẩy).

  0.3 và 30.1: Pāli 0.3 là 3 Tisaraṇagamaniyattheraapadāna, BẮT ĐẦU bằng số thứ tự nên giữ số, hình thức N. (đo trong tầng tha-ap: các bài có Pāli 0.3 bắt đầu bằng số 150, trong đó 132 viết N. và 18 viết N không chấm; các bài Pāli 0.3 không có số 363, không bài nào thêm số), nên translationTitle bằng đúng giá trị 0.3: 3. Bài Kệ Tuyên Ngôn Về Trưởng Lão Tisaraṇagamaniya. Ba dạng chính tả đo được trên khoá 0.3 của tầng tha-ap (ngoài bài này): toàn tầng Tuyên Ngợ 242, Tuyên Ngôn 134, Ký Sự 118, Tuyên Ngợi 10, Kinh Kệ 5; phạm vi gần nhất tha-ap18 đến tha-ap40 Tuyên Ngôn 11, Tuyên Ngợ 7, Tuyên Ngợi 2. Toàn tầng cho đa số Tuyên Ngợ nhưng đó là dạng sai chính tả; phạm vi gần nhất cho Tuyên Ngôn; chọn Tuyên Ngôn theo hướng dẫn của người điều phối và khớp bài liền kề tha-ap26. Người biên tập nên phán một lượt cho cả cuốn. 30.1 kết thứ ba (tatiyaṁ = thứ 3). 0.2 Subhūtivagga dịch Phẩm Subhūti theo 7/7 tiền lệ cùng Pāli; 0.1 Therāpadāna giữ nguyên Pāli theo 500/511 tiền lệ. Công thức lời kết 29.1 theo nhóm Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (đo trong cây làm việc: 507 khoá dùng những bài kệ này, 2 khoá dùng số ít bài kệ này), không dùng nhóm số ít đã từng nói bài kệ này.

  Số Pāli, tự tính: vassasatasahassāni (7.1) = sata 100 x sahassa 1.000 = 100.000, dịch một trăm ngàn năm (khớp tha-ap26:5.1); aṭṭha hetū (9.4) = 8, và tám điều được liệt kê đủ ở 10.1 đến 11.4 (đếm: được tôn kính ở các phương 1, trí tuệ sắc bén 2, chư thiên tùy thuận 3, tài sản vô lượng 4, sắc vàng 5, dễ mến 6, không lay chuyển với bạn bè 7, danh vọng vươn cao 8); asītikkhattu (12.1) = asīti 80 + lần = tám mươi lần (tầng có asītikkhattuṁ rājā ca ở tha-ap422 và tha-ap425 dịch tám mươi lần làm vua); pañcasattatikkhattuñca (13.1) = pañca 5 + sattati 70 = 75, dịch bảy mươi lăm lần (khớp tha-ap26:9.1; tổng 4 tiền lệ cùng Pāli, 3 trong đó viết Lại thêm bảy mươi lăm lần nữa); sattame vasse (18.1) = thứ 7, dịch vào năm thứ bảy kể từ khi sinh ra; tīṇi saraṇe (5.1, 24.1) = 3; tividhaggīhi (3.2) = ba ngọn lửa; pañcasīlāni (24.2) = 5; tāvatiṁsa (8.4) = Ba mươi ba; catasso (28.1) = 4; aṭṭhime (28.2) = 8; chaḷabhiññā (28.3) = 6; tevijjo (26.1) = tam minh (3); tatiyaṁ (30.1) = thứ 3. Cụm Tiṁsakappasahassa KHÔNG có trong bài này. Phép đo số tự động của dự án chỉ kiểm 9 từ khoá đã xác lập và không có từ nào trong số đó xuất hiện ở bài này nên chạy rỗng (không đo được gì); các số trên đều tự tính tay.

  Thuật ngữ: saraṇa dịch nơi quy y (khi là vật được nương tựa: tīṇi saraṇe, saraṇaṁ me anussariṁ) và saraṇagamana dịch việc quy y (6.4, 7.3); sikkha không xuất hiện; sīla dịch giới; paṭisambhidā bốn vô ngại giải (497/510 khoá cùng Pāli ở tầng tha-ap viết Bốn vô ngại giải); chaḷabhiññā sáu thắng trí (62/73); vimokkha tám giải thoát (55/72 dạng và tám giải thoát này); devindo chúa chư thiên; cakkavattī Chuyển Luân Vương (tôi từng làm Chuyển Luân Vương, 10 tiền lệ nguyên văn); jina dịch bậc Chiến Thắng; tāvatiṁsa cõi trời Ba mươi ba; aggasāvaka đệ tử thượng thủ (tha-ap51, tha-ap77); nirūpadhi không còn sanh y (sn8.10:4.4 cùng cụm vippamuttaṁ nirūpadhiṁ; tha-ap490 có 11 khoá cùng chữ nirūpadhi); sokasalla mũi tên sầu muộn (an5.50); sotāvadhāna sự lắng tai nghe (an10.68, mn95); tevijjo iddhipattomhi và cetopariyakovido theo tiền lệ sn8.12 và sn8.9 (đạt được thần thông, thông hiểu các loại tâm); mahāvīra bậc Đại Anh Hùng (13/18 khoá tha-ap chứa mahāvīra; 5/18 viết Đại Hùng); nibbuti sự tịch tịnh (kp6, snp4.14; tầng còn có sự lắng dịu ở tha-ap459 và cp23, không giữ vì nghĩa Niết-bàn ở đây là tịch tịnh); hetu dịch điều (xem bất định 4). Người nói Pāli ahaṁ: toàn tầng tôi 2.166, ta 1.621; phạm vi gần nhất tha-ap22 đến tha-ap40 tôi 101, ta 40 (số đếm lấy từ tha-ap26); bài này dùng tôi cho người kể. Lời trích ‘…’ ở 22.1 đến 26.4 là lời nhà thọ ký tự nói với hội chúng, giữ nháy đơn đúng Pāli. Chữ hoa đầu dòng theo Pāli ở vế thứ ba của kệ được giữ ở các khoá tái dùng nguyên văn.

  BẤT ĐỊNH (không thêm vào thân kinh): (1) 26.4 saraṇo vandati satthuno: trong khuôn Sāvako te mahāvīra… vandati satthuno của sn8.8 và sn8.9 chỗ này là tên người đảnh lễ (Moggallāna, Koṇḍañña); dịch saraṇo là tên riêng Saraṇa, tức tên cá nhân của vị trưởng lão, nếu đọc saraṇo là tính từ (vị đã quy y) thì khoá này đổi chữ nhưng không đổi nghĩa giáo lý; chưa phân xử được, cần người biên tập có chuyên môn Pāli xem lại. (2) 5.4 paṭimokkhāmi duggatiṁ: paṭimokkhāmi chỉ xuất hiện đúng một lần trong toàn bộ Pāli root đã ghim (hapax); các dạng gần là pamokkhāmi (4 khoá trong ja389, ja501, ja534) nghĩa là thả ra, giải thoát; dịch tôi thoát khỏi đọa xứ ở thì hiện tại trung tính vì 5.2 gopayiṁ là quá khứ còn -āmi là hiện tại hoặc vị lai, không xác định được là kết quả đã xảy ra hay điều tâm niệm. (3) 11.2 paṭikanto bhavāmahaṁ: paṭikanto cũng là hapax toàn Pāli root; dịch dễ mến theo nghĩa agreeable của paṭikanta và vì nó đứng trong danh sách tám lợi ích; nếu nghĩa khác (lùi lại) thì khoá đổi nghĩa nhưng bối cảnh liệt kê lợi ích không ủng hộ. (4) 9.4 aṭṭha hetū: hetu dịch điều vì tám điều kế tiếp là các lợi ích (quả), không phải nhân; hetu thường là nhân, nên đây là chỗ làm phẳng thuật ngữ có chủ ý, cùng cách với tha-ap26:16.2. (5) 23.3 adhikāraṁ kareyyātha: adhikāra ở đây là sự phụng sự, thờ kính, dâng cúng (không phải quyền hành như ở mil3.2.7:2.2 và tha-ap254:1.3); dịch hãy phụng sự, chưa phân xử giữa phụng sự và dâng cúng. (6) 23.4 passayissatha nibbutiṁ: passayissatha là hapax; tha-ap394:21.4 có nibbānaṁ phassayissatha và tha-ap459:4.4 phassayissāmi nibbutiṁ (đạt đến), nên đọc là dạng của phassati và dịch các vị sẽ đạt đến sự tịch tịnh; nếu là passati (thấy) thì đổi sắc thái. (7) 3.3 etādise bhave jāte: dịch khi cõi hữu như thế đã sinh khởi, jāte đứng độc lập với bhave; không thêm gì ngoài Pāli. (8) 15.3 hasakhiḍḍasamaṅgīhaṁ: samaṅgī dịch đang (cười đùa vui chơi), không dịch mải mê vì Pāli không nêu mức độ. (9) 10.3 sabbe devānuvattanti: anuvattanti không nêu tân ngữ; dịch tất cả chư thiên đều tùy thuận, không thêm tôi. (10) 6.2 buddhassa aggasāvako: Pāli không nêu tên vị Phật nên giữ là đệ tử thượng thủ của Đức Phật, không thêm tên. (11) 18.1 jātiyā sattame vasse: dịch vào năm thứ bảy kể từ khi sinh ra, giữ cách đếm của Pāli, không đổi thành lên bảy tuổi vì năm thứ bảy có thể là sáu tuổi tròn. (12) 25.3 và 25.4: arahattaṁ vo sabbepi pāpuṇissatha chia qua hai vế kệ nên 25.3 dịch quả vị A-la-hán và 25.4 các vị đều sẽ đạt được; arahattaṁ và vo ở vế trước, pāpuṇissatha ở vế sau.

  Phép kiểm tự viết, mẫu số ghi kèm: tập khoá Việt bằng tập khoá Pāli 117/117 và đúng thứ tự; dấu nháy kép và nháy đơn khớp Pāli từng khoá 117/117 (Pāli mở nháy kép ở 1.1 và đóng ở 28.4; nháy đơn mở ở 22.1 và đóng ở 26.4); dấu lược 0/117 khoá có (không có …pe… và không có … trần nên phép kiểm dấu lược chạy rỗng); không khoá rỗng, không khoảng trắng thừa; NFC đủ; chữ số chỉ có số thứ tự ở 0.3 theo chính sách giữ số; không Pāli lọt sang tiếng Việt ngoài tên riêng (Therāpadāna, Candavatī, Sāvatthī, Nisabha, Tisaraṇagamaniya, Saraṇa). In và đọc đối kháng 117 cặp Pāli với Việt.

  Coverage English: mẫu số = 2 khoá Pāli có nội dung (tha-ap25:29.1, 68 ký tự, và tha-ap25:30.1, 41 ký tự; 115 khoá còn lại ngắn hơn ngưỡng 40 hoặc là khối :0), Sujato phủ 0/2: tầng english-sujato đã ghim chỉ có 9 sub-collection của kn và tệp tha-ap duy nhất là tệp tên, không phải thân kinh; english-project 0 entry; vietnamese-current 0 (tầng này chỉ có Pháp Cú). Mẫu số nhỏ như vậy nghĩa là cổng coverage gần như không đo được gì: đây không phải sự đồng thuận về cách dịch mà là việc không có bản Anh nào để đối chiếu. Entry trong reference-gaps.yaml, nếu có, không cứu được published.

