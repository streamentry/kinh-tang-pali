notes: |-
  **`bhante` và `mahārāja`: đo riêng cả hai số như yêu cầu, rồi chọn theo đa số.**
  Trong **chính tầng `mil`** (199 bài, 5153 khoá) đếm được: `thưa tôn giả` **215**,
  `bạch tôn giả` **37**, `bạch ngài` **38**, `thưa ngài` **17** — tức *tôn giả* thắng
  **269 vs 55**. Trong **Pāli của mil7.2.2** thì `mahārāja` **20** và `Bhante` chỉ **1**;
  nên khuôn chiếm đoạn này là *Đại vương*, còn `bhante` đứng riêng. Cả hai kết luận
  cùng chiều: `Bhante` → *thưa tôn giả*, `mahārāja` → *Đại vương*.

  **Tiền lệ mạnh nhất là hai bài cùng phẩm, cùng công thức:** `mil7.2.1` (con sóc) và
  `mil7.2.4` (con báo cái). Tôi theo từng khuôn của chúng: `“Thưa tôn giả Nāgasena,
  tôn giả đã dạy rằng ‘…’; … là phần nào cần phải nắm lấy”ti?`; `Đây, này Đại vương,
  là phần thứ nhất cần phải nắm lấy của con gà.`; `yoginā yogāvacarena` → *người
  hành trì, người thực hành*; `aṅga` → *phần*; `devātidevena` → *bậc Thiên Nhân*.

  **Sáu khoá trùng nguyên văn — dùng lại nguyên văn:** `3.4` → *Đức Thế Tôn, bậc Thiên
  Nhân, đã nói trong tập kinh—* (4 bài đã có: mil7.8.2, mil7.8.5, mil7.5.2, mil7.3.10);
  `7.6` → *Trưởng lão Sāriputta, vị đệ nhất về đạo hạnh trong việc thọ trì giáo pháp,
  cũng đã nói như vầy—*; `9.1` → *Cũng vậy, bậc là con Đức Phật,*; `6.2`–`6.4` → *tai có
  mà cứ như kẻ điếc; tuệ có mà cứ như kẻ câm; sức mạnh có mà cứ như kẻ yếu ớt.* (thag8.1).

  **Một chỗ lệch tiền lệ, tôi cố ý giữ luật trùng-khớp.** `mil7.2.1:1.5` và `mil7.2.4:1.5`
  mở cùng công thức `Bhāsitampetaṁ, mahārāja, bhagavatā devātidevena` nhưng dịch là
  *Bậc Thế Tôn, đấng Thiên Nhân*. Ở `3.4` và `7.4` Pāli trùng **tuyệt đối** với 4 bài
  khác nên tôi dùng *Đức Thế Tôn, bậc Thiên Nhân*. Kết quả là phẩm Con Sóc đang có hai
  cách cho cùng một công thức. Tôi không sửa được hai bài kia (ngoài lát), nên ghi lại
  đây để người điều phối gộp.

  **`:9.4` `Manasikāravaruttaman` là bất định thật, tôi ghi rõ.** Đọc như vị ngữ thì câu
  bộc lối về chính điều khoản vừa nói; đọc như từ xưng hô thì cặp kệ 8–9 mới liền mạch.
  Tôi chọn cách xưng hô (*hỡi bậc cao nhất về sự tác ý như lý*) vì nó làm cho cả bốn câu
  thành một đoạn dạy, và ghi cả cách kia ra đây. `yoniso manasikāro` → *sự tác ý như lý*
  (đa số trong `mil`); `cīvarakamma` → *việc may áo*, `navakamma` → *việc làm mới* (0 tiền lệ).

  **Không có tầng Anh.** 0/44; tầng `english-sujato` đã ghim **không có thư mục `mil`**
  (chỉ có `mil-name`, tức tầng tên). Đối chiếu chỉ có Pāli + tiền lệ trong tầng `mil`.
