notes: |-
  **`bhante` và `mahārāja`: đo riêng cả hai số như yêu cầu, rồi chọn theo đa số.**
  Trong **chính tầng `mil`** (199 bài, 5153 khoá) đếm được: `thưa tôn giả` **215**,
  `bạch tôn giả` **37**, `bạch ngài` **38**, `thưa ngài` **17** — tức *tôn giả* thắng
  **269 vs 55**. Trong **Pāli của mil7.2.2** thì `mahārāja` **20** và `Bhante` chỉ **1**;
  nên khuôn chiếm đoạn này là *Đại vương*, còn `bhante` đứng riêng. Cả hai kết luận
  cùng chiều: `Bhante` → *thưa tôn giả*, `mahārāja` → *Đại vương*.

  **Tiền lệ mạnh nhất là hai bài cùng phẩm, cùng công thức:** `mil7.2.1` (con sóc) và
  `mil7.2.4` (con báo cái). Tôi theo từng khuôn của chúng: `“Thưa tôn giả Nāgasena,
  tôn giả đã dạy rằng ‘…’; … là phần nào cần phải nắm lấy”ti?`; `Đây, này Đại vương,
  là phần thứ nhất cần phải nắm lấy của con gà.`; `yoginā yogāvacarena` → *người
  hành trì, người thực hành*; `aṅga` → *phần*; `devātidevena` → *bậc Thiên Nhân*.

  **Sáu khoá thân bài trùng nguyên văn (thêm 3 khoá tiêu đề), dùng lại nguyên văn:** `3.4` → *Đức Thế Tôn, bậc Thiên
  Nhân, đã nói trong tập kinh—* (4 bài đã có: mil7.8.2, mil7.8.5, mil7.5.2, mil7.3.10);
  `7.6` → *Trưởng lão Sāriputta, vị đệ nhất về đạo hạnh trong việc thọ trì giáo pháp,
  cũng đã nói như vầy—*; `9.1` → *Cũng vậy, bậc là con Đức Phật,*; `6.2`–`6.4` → *tai có
  mà cứ như kẻ điếc; tuệ có mà cứ như kẻ câm; sức mạnh có mà cứ như kẻ yếu ớt.* (thag8.1).

  **Một chỗ lệch tiền lệ, tôi cố ý giữ luật trùng-khớp.** `mil7.2.1:1.5` và `mil7.2.4:1.5`
  mở cùng công thức `Bhāsitampetaṁ, mahārāja, bhagavatā devātidevena` nhưng dịch là
  *Bậc Thế Tôn, đấng Thiên Nhân*. Ở `3.4` và `7.4` Pāli trùng **tuyệt đối** với 4 bài
  khác nên tôi dùng *Đức Thế Tôn, bậc Thiên Nhân*. Kết quả là phẩm Con Sóc đang có hai
  cách cho cùng một công thức. Tôi không sửa được hai bài kia (ngoài lát), nên ghi lại
  đây để người điều phối gộp.

  **`:9.4` `Manasikāravaruttaman` là bất định thật, tôi ghi rõ.** Đọc như vị ngữ thì câu
  bộc lối về chính điều khoản vừa nói; đọc như từ xưng hô thì cặp kệ 8–9 mới liền mạch.
  Tôi chọn cách xưng hô (*hỡi bậc cao nhất về sự tác ý như lý*) vì nó làm cho cả bốn câu
  thành một đoạn dạy, và ghi cả cách kia ra đây. `yoniso manasikāro` → *sự tác ý như lý*
  (đa số trong `mil`); `cīvarakamma` → *việc may áo*, `navakamma` → *việc làm mới* (0 tiền lệ).

  **Không có tầng Anh.** 0/44; tầng `english-sujato` đã ghim **không có thư mục `mil`**
  (chỉ có `mil-name`, tức tầng tên). Đối chiếu chỉ có Pāli + tiền lệ trong tầng `mil`.

  **Giải quyết draft 2026-10-12.** Lượt này thay thế phần lớn các nhận định dịch thuật ở trên
  (các mục nói về `Thiên Nhân`, `trong tập kinh`, `vị đệ nhất về đạo hạnh…` và "sáu khoá trùng dùng lại
  nguyên văn" không còn đúng): bản cũ có nhiều chỗ sai nghĩa thật nên hầu hết các khoá đã được dịch
  lại từ Pāli; thứ tự khoá nay theo đúng Pāli. Sửa nghĩa (accuracy fix), theo từng khoá:
  `1.3`/`2.2` — `cetiyaṅgaṇaṁ sammajjitvā` là *quét sân tháp* (bản cũ ghi "chỉnh vạt áo ngoài"),
  `sarīraṁ paṭijaggitvā` là *chăm sóc thân thể* (không phải "lắc thân thể"), `vuḍḍhānaṁ bhikkhūnaṁ
  dassanāya gantvā` là *đi yết kiến các tỳ-kheo trưởng thượng*, `suññāgāra` là *nhà trống* (tầng dùng
  *nhà trống*/*căn nhà trống* ở dn22, dn16, mn48, mn106…); `3.1`–`3.2` — `pathaviṁ khaṇitvā khaṇitvā
  ajjhohāraṁ ajjhoharati` là *bới đất lên rồi lại bới đất lên, rồi mới nuốt thức ăn* (bản cũ vô nghĩa:
  "moi gianh", "chở đỡ"); công thức `neva davāya…` đối chiếu `mn2:14.2` và `an6.58:4.5` trong tầng;
  `4.1`–`4.4` — `kantāre puttamaṁsaṁva` là *như thịt con giữa chốn hoang mạc*, `akkhassabbhañjanaṁ` là
  *dầu bôi trục xe*; `5.2` — `rajanīyesu rūpa…dhammesu` là các sắc, thanh, hương, vị, xúc, pháp *dễ gây
  tham ái* (bản cũ "pháp có sắc, có tiếng… vị ngon"), `nimitta`/`anubyañjana` là *tướng chung*/*tướng
  riêng* (56 nơi theo công thức `na nimittaggāhī`); `7.1` — `leḍḍu-daṇḍa-guḷa-muggara` là *hòn đất,
  cây gậy, cục tròn, cái vồ* và `geha` là *nhà* (bản cũ: "đất đống, que gỗ, bùn đất… làng"); `7.2` —
  `cīvarakamma` *việc y áo*, `navakamma` *việc xây dựng mới* (như `cnd23:59.3`), `vattappaṭivatta`
  *phận sự qua lại*, `uddisanta`/`uddisāpenta` *đọc tụng*/*nhờ người đọc tụng* (bản cũ "luận bàn tranh
  biện, soi xét, chỉ dạy" không có căn cứ trong Pāli); `7.4` — `gocaro sako pettiko visayo` theo
  `sn47.6:4.3` (*lãnh vực của mình, nơi quen thuộc của cha ông*); `8.1`–`8.4` — `sudanto mātaṅgo` là
  *con voi đã thuần thục* và `soṇḍaṁ` là *vòi* (bản cũ hiểu thành ngựa, "đánh mẹ", "đống phân"),
  `bhakkhābhakkhaṁ` *món ăn được và không ăn được*, `vuttikappanaṁ` *cách sinh sống*; `9.2` —
  `appamattena vā pana` là *hay người không phóng dật*; `6.5` — `attaatthe samuppanne` là *khi việc ích
  lợi của chính mình đã khởi lên* (`samuppanne` là *đã khởi lên*, không phải "đã thành tựu"). Các cụm
  dẫn `Bhāsitampetaṁ…` cũng sửa: `devātidevena` là *bậc Thiên Trung Thiên* (tầng theo cách này ở
  `mil6.4.2`, `mil7.4.4`, `vv64`, `ne37`…; "Thiên Nhân" là sai), bỏ cụm "trong tập kinh" ở `3.4` vì
  Pāli không có; `dhammasenāpati` là *Tướng quân Chánh pháp* (như `mil7.2.5:3.4`, `mil5.1.1:2.3`,
  `mil7.3.1:1.5`; cụm "vị đệ nhất về đạo hạnh trong việc thọ trì giáo pháp" là bịa, đã bỏ). Các khoá
  `6.1`–`6.4` dùng lại nguyên văn `thag8.1:8.1`–`8.4` (Pāli trùng nguyên văn).
  Tiêu đề: `gadrabha` là *con lừa*, không phải "con sóc" (`0.3` đổi thành *Phẩm Con Lừa*); `0.4` đổi
  thành *các phần* vì Pāli là `kukkuṭaṅga` với năm phần; `0.2` bỏ cách nói "cách dùng dẫn với ví dụ"
  khó hiểu. `translationTitle` khớp `0.4`.
  **Bất định còn lại, ghi lại.** (1) `9.3`–`9.4`: `Manasikāravaruttaman` kết thúc bằng `-ṁ`, là đuôi
  đối cách trung tính chứ không phải hô cách (hô cách sẽ là `-ttama`), nên đọc đồng vị với
  `jinavacanaṁ` (*lời của Đấng Chiến Thắng, tối thượng, thù thắng về sự tác ý*); cách đọc hô cách
  *hỡi bậc cao nhất…* của bản cũ nay bỏ. (2) `7.2`: `uddisāpenta` có thể là *cho người khác đọc tụng*
  hoặc *nhờ người đọc tụng cho mình*; chọn nghĩa thứ hai, bám dạng sai khiến. (3) `guḷa` dịch *cục
  tròn* (có thể là viên đất hay vật tròn khác). (4) `6.5` `attaatthe` có thể đọc *khi việc của mình
  khởi lên* hoặc *khi mục đích của mình cần*; không có bản Anh để phân xử. Không có số lượng Pāli nào
  cần tính ngoài thứ tự phần (nhất, nhì, ba, tư, năm) và `pañca` ở `1.1`, đã kiểm khớp.
  **Blocker kiểu (A) giữ nguyên:** cả hai câu về việc không có bản Anh đã ghim (Sujato không có `mil`)
  là sự thật về upstream, không phải lỗi văn bản; để công cụ của kho xử lý. Không có blocker kiểu (B)
  hay (C); không còn blocker lỗi văn bản (D) nào sau lượt dịch lại này. Tầng Việt hiện hành cũng không
  có cho bài này (giới hạn tham chiếu của snapshot, như mọi bài `kn` ngoài Pháp Cú).
  **Điểm:** `semantic_fidelity` 9.4→8.8, `grammar_logic` 9.4→9.0, `terminology` 9.5→8.8,
  `triangulation` 7.8→7.5 (không có bản Anh độc lập), `vietnamese_clarity` 9.4→9.0, `han_viet_balance`
  9.4→9.2, `ambiguity_integrity` 9.1→9.0; các tiêu chí khác giữ nguyên; `final_score` 9.32→9.05. Bốn
  lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa chạy trong lượt này
  nên `technical_integrity` giữ 9.6.
  **Việc ngoài phạm vi, báo lại:** chín bài cùng phẩm (`mil7.2.1`, `mil7.2.3`–`mil7.2.10`) đều ghi `0.3`
  là *Phẩm Con Sóc*, cần đổi thành *Phẩm Con Lừa*; `mil7.2.1:1.5`, `mil7.7.2:1.5`, `mil7.7.7:3.4`,
  `mil7.8.2:2.5` dịch `devātidevena` là *bậc/đấng Thiên Nhân*, và `mil7.8.2:2.5` thêm "trong tập kinh"
  khi Pāli không có.
