notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pe/pe2_root-pli-ms.json` (736/736 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli). Đây là nền tảng thứ hai (`Sāsanapaṭṭhānadutiyabhūmi`) của Peṭakopadesa; khoá cuối `210.1` chỉ là dòng kết chương, không ghi tên tác giả. Cấu trúc: `1.2`–`1.16` liệt kê các nhóm của `sāsanappaṭṭhāna`; `2.1`–`49.34` giải thích bốn lối kinh `saṅkilesabhāgiya`, `vāsanābhāgiya`, `nibbedhabhāgiya`, `asekkhabhāgiya` (cộng các lối ghép), trong đó `36.7`–`46.3` đi qua mười sức mạnh của Như Lai và `47.1`–`49.34` nói về ba ô nhiễm, năm căn, các bậc hữu học; `50.1`–`54.4` là bài kệ tóm lược phần đầu; `55.1`–`187.3` lần lượt giải thích các nhóm `āṇatti`, `phala`, `upāya`, `assāda`, `ādīnava`, `nissaraṇa`, `lokika`/`lokuttara`, `kamma`/`vipāka`, `niddiṭṭha`/`aniddiṭṭha`, `ñāṇa`/`neyya`, `dassana`/`bhāvanā`, `vipākadhammadhamma`, `sakavacana`/`paravacana`, `sattādhiṭṭhāna`/`dhammādhiṭṭhāna`, `thava`, `anuññāta`/`paṭikkhitta`; `188.1`–`209.4` là bài kệ tóm lược phần sau. Chỗ nào bản Việt chèn chữ trong ngoặc vuông `[…]` (12 khoá: `47.8`, `48.9`, `49.13`, `49.31`, `57.2`, `70.4`, `96.1`, `115.2`, `128.4`, `134.2`, `161.1`, `187.1`) thì chữ ấy là chữ bổ ngữ pháp Việt, Pāli không có.

  - Tầng tham khảo:
    Upstream commit đã ghim không có bản dịch tiếng Anh của Bhikkhu Sujato cho pe2: tầng `english-sujato` chỉ có chín nhánh `cp dhp iti ja kp snp thag thig ud` dưới `sutta/kn/` (755 tệp), không có thư mục `pe`; chỉ có tệp tên `pe-name_translation-en-sujato.json` (pe2 = "The Second Stage: The Pattern of the Dispensation") không kèm prose của bài. Đây là `not-published-upstream`, không phải `not-synced`. Lớp lấp `english-project` chưa có tệp nào cho `pe`. Bản Việt hiện hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú. Ba tầng tham khảo đều vắng nên bài mang trạng thái `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7.0 (≤ 8.0). Bài này dịch chỉ từ Pāli, từ tiền lệ thuật ngữ của chính tầng dự án (pe3, pe4, pe6, pe7, pe9, ne4, ne5, ne9, ne10, ne11, ne15, ne19, ne21, ne36), và từ các bài kệ, kinh Nikāya mà bài trích lại (ud2.1, ud2.2, ud3.10, ud4.4, ud5.2, ud5.4, ud7.1, ud7.3, ud7.5, ud8.5, dn16, dn33, dn34, sn1.12, sn1.13, sn1.23, sn3.5, sn3.21, sn4.16, sn35.135, sn35.241, sn48.24, snp2.13, snp5.16, thag4.8, thag16.4, mn92, an4.5, an4.191, an9.11, an9.12, ja222). Tên Sujato của pe2 dịch `paṭṭhāna` là "pattern", khác cách đọc "nền tảng" của bản này; không có prose của Sujato để xác định ý của ông, nên không đổi theo tên ấy.
  - Coverage English:
    Mẫu số = 264 khoá Pāli có nội dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`). Sujato phủ 0/264 (0/736 khoá tổng); coverage English 0%, dưới ngưỡng, nên bài chưa thể `review`/`published`; `reference-gaps.yaml` có entry cũng không cứu được `published` (ngoài phạm vi lát này, không chạm). Không có cách đọc English độc lập nào cho bài này.
  - Tiền lệ cùng bộ (`pe`, `ne`):
    `0.1` "Peṭakopadesa" dùng lại nguyên văn của `pe3:0.1`, `pe4:0.1`, `pe6:0.1`, `pe7:0.1`, `pe9:0.1`. `0.2` giữ số thứ tự "2." như `pe3:0.2` ("3."), `pe4:0.2` ("4."), `pe6:0.2` ("6."); "Nền Tảng Thứ Hai" theo `bhūmi` → "nền tảng" của các bài ấy. `sāsanappaṭṭhāna` → "nền tảng giáo pháp": cách `paṭṭhāna` → "sự thiết lập" ở `pe6:25.2` (`ṭhānaṁ paṭṭhānaṁ upaṭṭhānaṁ` → "chỗ đứng, sự thiết lập, sự hiện khởi") chỉ cho thấy nghĩa "chỗ đặt, nền"; còn cụm "nền tảng giáo pháp" khớp với bản nháp `pe5:1.10` (`tividhe ca sāsanappaṭṭhāne`) chưa hợp nhất vào nhánh chính tại lúc dịch. Người biên tập có thể đổi ở `0.2`, `1.1`, `210.1`. `178.1` dùng lại nguyên văn `pe4:7.1`; `188.1` dùng lại nguyên văn `pe3:76.1` và `pe9:54.1` (Pāli trùng, `Tatthimā uddānagāthā`); `50.1` có Pāli khác (`Tattha purimakānaṁ suttānaṁ imā uddānagāthā`) nên viết riêng. `210.1` đi cùng nhịp "tên chương, thứ tự nền tảng" của `pe3:86.1` và `pe4:13.1`, không có dòng tác giả vì Pāli không có. `Tattha katamaṁ … ?` → "Trong đó, … là gì?" theo `pe3:1.1`, `pe4:1.1`; `ne4`/`ne11` dịch "Ở đây" cùng Pāli (khác nhau ở `5.1`, `9.1`, `55.1`, `58.1`, `61.1`, `74.1`, `77.1`, `79.1`: "Trong đó" so "Ở đây", và `suttaṁ` → "kinh" so "bài nói" ở `5.1`, `9.1`). Không có tên `hāra` nào là đề mục chính trong bài; `hārasampāta` ở `49.24` dịch "sự quy tụ các hướng dẫn" theo `hāra` → "hướng dẫn" của `ne4`, `ne5` (`ne21:44.3` dịch cả cụm `vicayo hārasampāto` là "nhóm phương thức khảo sát"); `naya` ở `154.2` → "lối" theo `ne3`, `ne4`, `pe9`.
    Chỗ lệch tiền lệ có chủ ý: (a) `vāsanābhāgiya` → "thuộc phần nuôi dưỡng tâm" theo `pe4` và `ne11` (6 khoá trên 28 khoá có `vāsanā`; `ne11` đã ghi để người biên tập xét), lệch bản nháp `pe5:77.11` ("thuộc phần huân tập"); (b) `nibbedhabhāgiya` → "thuộc phần thấu triệt" theo `pe3:33.2` (`nibbedhagāminī`, `iti41:4.2`, `iti93:7.4`) và `ne5:54.6` (đúng cụm `nibbedhabhāgiya`, 1 khoá), lệch "xuyên thấu" ở `ne11` (3 khoá) và `ps3.4` (9 khoá): trên 13 khoá chứa `nibbedhabhāgiya`, "xuyên thấu" 12 và "thấu triệt" 1; chọn "thấu triệt" để cùng một chữ với `pe3`, `pe5` trong bộ `pe`; (c) `taṇhā` → "tham ái" (các kệ trùng Pāli `ud3.10`, `ne9:30`, và bộ ba `ô nhiễm của tham ái, ô nhiễm của kiến, ô nhiễm của ác hạnh` của `ne21:23.15`), lệch `pe3`/`pe9` chọn "ái" (839 so 376 "tham ái" theo ghi chú của `pe3`); (d) `paṭisambhidā` → "vô ngại trí" theo `pe7:3.13` (4 khoá `pe`, 2 khoá `ne`), lệch "vô ngại giải" (138 trên toàn tầng, 112 khoá); (e) `agatigamana` → "đi theo thiên vị" theo `ne10:13`, `pe3`, lệch `dn33` "sự thiên lệch", `an4.17` "sự đi vào phi nghĩa"; (f) `kammapatha` → "nghiệp đạo" theo `pe3` (35 khoá), lệch `ne21:24.5` "đường nghiệp"; (g) `vodāna` → "thanh tẩy" theo `ne5:17.5`, `ne21` (15 khoá), lệch `pe7:8.2` "thanh tịnh" (1 khoá; toàn tầng "thanh tịnh" 43, "thanh tẩy" 15, "thanh lọc" 12); (h) `hānabhāgiya` → "thoái giảm" theo `pe7:9.1`–`9.3`, lệch `ne21:38.3` "suy giảm"; (i) `paḷāsa` → "hơn thua" theo `pe3` (11 khoá), lệch `dn25` "khinh miệt"; (j) `nissaraṇa` → "lối thoát" ở mọi chỗ trong bài (`ne4`, 15 trên 16 khoá `ne`; toàn tầng "lối thoát" 187, "sự xuất ly" 170), kể cả `24.2`, `28.2` mà `ud3.10:6.2` dịch "xuất ly"; (k) `vitakka` → "tầm" ở `pe3`, `pe4`, `pe7` nhưng `aṭṭha mahāpurisavitakkā` (`125.2`) dùng lại nguyên văn `dn34:2.1.150` "Tám tư duy của bậc đại nhân", nên `199.4` (`vitakkā`, nhắc lại mục ấy) dùng "tư duy"; (l) `neyyo` (hạng người) → "cần được giáo đạo" (`ne4:29.6`, `35.6`, `ne36:56.5`, `58.4`, `an4.133:1.3`: 5 khoá) lệch `pe9:30.5`, `43.1` "cần được dẫn dắt" (2 khoá).
  - Pāli trùng nguyên văn:
    Dò Pāli của 736 khoá với toàn bộ Pāli đã ghim (dn, mn, sn, an, kn), so sau khi bỏ dấu câu, nháy và chữ hoa, ngưỡng 8 ký tự: 204 khoá có Pāli trùng ở bài khác mà phía kia đã có bản Việt, tổng 577 cặp; 350 cặp giống bản của bài này (sau khi bỏ dấu câu và chữ hoa), 181 khoá giống ít nhất một bản đã có, 23 khoá khác mọi bản đã có (hai khoá `19.4`, `80.4` chỉ khác ở chữ `ti` đóng của Pāli, bản Việt giống `ne9:21.4`, `ne4:7.4`). Riêng với `pe`/`ne`: 126 cặp, 112 giống. 23 khoá khác mọi bản, kèm lý do: `5.1`, `9.1`, `55.1`, `58.1`, `61.1`, `74.1`, `77.1`, `79.1` ("Trong đó" so "Ở đây", xem trên; `5.1`, `9.1` còn "kinh" so "bài nói"); `6.3` (Pāli khác ngữ cảnh `sn10.2:4.1`, "tịnh tín" theo `ne7:2.2`); `16.4` (khác `thag6.13`: ở đây `evaṁ taṁ nātivassati`, dịch theo `ud5.5:28.4`); `22.3` (Pāli số nhiều `maññanti`, `snp3.12:52.1` dịch "Vì bất cứ điều gì họ tưởng tượng"; `ud3.10:4.3` là số ít); `23.1`, `23.2` (không theo `ud3.10:5.1`–`5.2` vì bản ấy bỏ mất `aññathābhāvī`, nên ở đây `23.1` thêm "hay đổi khác" và `23.2` giữ `bhavapareto` "bị hữu chi phối"); `73.2` (`ne4:23.3` viết ‘Luôn chánh niệm’ — đó là phương tiện; ở đây Pāli dùng nháy kép và `ti` đóng, nên viết “Luôn chánh niệm”: là phương tiện, theo cách `pe3:5.1`–`5.4` ghi tên mục); `104.3`, `104.4`, `105.3` (`sn1.21:2.3` dịch lệch dòng, nên theo `thag20.1:23.3` "để từ bỏ tham dục" và `thag17.2:2.4` "tỳ-kheo hãy chánh niệm mà du hành", đổi "từ bỏ" thành "đoạn trừ" để cùng chữ `pahāna` của bài); `110.1` (giữ "này" cho `imāni`, như `pe3:44.1`; `iti64:2.1` bỏ); `124.3` (bỏ "nhưng" của `ud2.1:6.3` vì Pāli không có); `166.2` ("sầu" cho `socati` theo `ne9:16.1`, `16.3`, thay "khổ" của `sn1.12:3`); `172.3`, `172.4` (ranh giới dòng khác `ud2.2:6.3`–`6.4`, dịch theo ranh giới Pāli); `184.2` ("Ba điều nào?" thay "Ba loại nào?" của `dn11:3.9`, vì cùng một danh sách điều làm). Dùng lại nguyên văn ở các khoá còn lại, trong đó `3.1`–`3.5` (`ne9:30`, `thag4.8:3.4`), `10.1`–`10.4` (`ne15:2`), `13.1`–`13.6` (`ud4.4:10`), `19.1`–`19.4` (`ne9:21`), `22.1`–`22.2`, `22.4`, `23.3`–`23.4`, `25.1`–`26.4` (`ud3.10`), `30.1`–`30.4` (`dn16:4.43`), `56.1`–`56.4` (`ud5.4:4`), `59.1`–`59.4` (`ne4:15`), `62.1`–`62.4`, `136.1`–`136.4` (`ne4:19`), `69.1`–`69.4` (`sn1.23:2`), `72.1`–`72.4` (`snp5.16:4`), `80.1`–`80.4` (`ne4:7`), `83.1`–`83.4` (`ja222:2`), `94.3`–`94.4` (`thag16.4:19.4`, `20.4`), `108.1`–`109.4` (`pe3:10`–`11`), `127.1`–`127.4` (`mn92:16.9`–`16.12`), `130.1`–`130.4` (`pe3:33`), `133.1`–`133.4` (`ud7.3:4`), `146.2`–`146.4` (`snp2.13:7`), `157.1`–`157.4` (`ne10:11`), `160.1`, `160.3`–`160.4` (`sn1.13:2`), `165.1`–`166.4` (`sn1.12`, `ne9:14`), `169.1`–`169.3` (`ud5.2:4`), `179.1`–`179.3` (`sn3.5:3`), `186.1`–`186.4` (`pe3:43`). Trong chính bài: 19 nhóm Pāli trùng nguyên byte (ví dụ `3.1`/`51.1`, `62.1`–`62.4`/`136.1`–`136.4`, `125.1`/`125.3`); 45 nhóm sau khi bỏ nháy, dấu câu và chữ hoa; bản Việt giống nhau ở cả 45 nhóm (sau khi bỏ dấu câu và chữ hoa), 0 nhóm khác (khác duy nhất sau khi giữ chữ hoa: `6.1`/`51.3`, chỉ chữ hoa đầu khoá).
  - Thuật ngữ (đếm trên tầng Việt hiện có, cùng Pāli; ghi cả hai số khi đa số khác nhau):
    + `saṅkilesa` → "ô nhiễm" (`pe4`); `vāsanā` → "nuôi dưỡng tâm" (`pe4:10.2`, `10.6`, `12.3`, `ne11`: 6 khoá); `nibbedha` → "thấu triệt" (xem trên; toàn tầng "xuyên thấu" 16, "thấu triệt" 4 trên 25 khoá); `dassanabhāgiya` → "thuộc phần thấy biết", `bhāvanābhāgiya` → "thuộc phần tu tập", `asekkhabhāgiya` → "thuộc phần vô học" (`pe4:10.2`); `suttaṁ` → "kinh" (`pe4`; toàn tầng "kinh" 4.153 so "bài kinh" 84).
