notes: |-
  Varuṇavagga là Phẩm Cây Varuṇa theo cả 7 bài đã có. Tên bài giữ nguyên Pāli theo
  ja102, ja106. manutappatī không có tiền lệ trực tiếp cho dạng này; thig5.11:2.2 và
  thig4.13:1.2 đã dùng hối tiếc cho manutappam, và đếm cả tầng thì hối tiếc 100 chỗ so
  với hối hận 69, nên tôi dùng hối tiếc. karaṇīyāni tôi dịch những việc cần làm.
  Varuṇakaṭṭhabhañjova dịch như kẻ chặt cành cây Varuṇa; Sujato dịch like the one
  who broke a branch off the Warding Tree, tức cành, nên tôi theo Sujato ở chỗ này vì
  Pāli kaṭṭha nghĩa là gỗ hay cành đều đúng.
  NGHĨA CỦA KỆ 1.1-1.2 TÔI KHÔNG DÁM CHẮC. Pāli là Yo pubbe karaṇīyāni, pacchā so
  kātumicchati — kẻ nào trước kia làm những việc cần làm, sau đó lại muốn làm. Vế 1.1
  không có động từ nào cả, chỉ có tân ngữ, nên tôi dịc theo nghĩa động từ ngầm ở
  trước kia làm và ghi rõ điều đó. Câu này trùng nguyên văn với thag3.3:1.1-1.2 và
  thag3.15:1.1-1.2; hai bài kia CHƯA có bản Việt, nên tôi không có nguyên văn để dùng
  lại. Khi hai bài kia được dịch, ba nơi phải khớp nhau. Tôi ghi nghĩa tôi chọn ở đây
  để lát sau dùng lại.
  Kỹ thuật: 9/9 khoá, không rỗng, thứ tự khớp Pāli, NFC, nháy kép mở 1.1 đóng 1.4 y
  hệt Pāli, không dấu lược. save_vi sạch và idempotent. Không chạy npm run
  validate|test|check|build nên technical_integrity 9.5.

  Quyết định hội đồng biên tập 2026-10-16: C1 — :0.4, :2.1, translationTitle (bỏ đuôi jātaka, danh từ chung dịch nghĩa); C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
