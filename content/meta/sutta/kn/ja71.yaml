notes: |-
  Bản dịch phủ đủ 9 khoá; cấu trúc đối xứng của kệ (làm việc trước rồi muốn làm sau; vỡ cành rồi hối tiếc) được giữ nguyên.
  
  **`Varuṇakaṭṭhabhañjo` xử lý thành mô tả, thành phần danh từ** (*như kẻ chặt cành cây Varuṇa*). Đây là danh hiệu của tên trộm Asāḍha trong truyện, không phải tên. Cách dịch mô tả rõ hơn cho người chưa đọc truyện và không bịa thêm gì; Sujato cũng dịch mô tả (*like the one who broke a branch off the Warding Tree*).
  
  **Thiếu nhỹ ở `1.4`.** Pāli `sa pacchā manutappatī` — `sa` là chủ ngữ "hắn" và `manutappatī` là "bị hối tiếc giày vò". Bản dịch *về sau hối tiếc* rút gọn cả chủ ngữ và cả vẻ "bị giày vò", chỉ còn lại mệnh đề. Chủ ngữ vẫn hiểu ngầm từ `1.3` (*như kẻ…*) nên câu không hỏng, nhưng đã trừ ở `semantic_fidelity`.
  
  **`Yena yena` / `pacchā` giữ đúng chiều thời gian** (trước → sau), đây là ý cốt lõi của bài và không bị đảo.
  
  **Tên phẩm** `Varuṇavagga` → *Phẩm Cây Varuṇa* trùng nguyên văn với 9 tệp đã có (`ja71`–`ja79`); `ja74` trong cùng lô cũng dùng y hệt — cặp nhất quán tốt nhất của lô này.
  
  **Tầng Anh** có mặt đủ bốn vế và cho thêm chi tiết quan trọng: Sujato xác nhận `Varuṇavagga` là *The Warding Tree*, và `manutappatī` là *tormented by regrets* — hơi nặng hơn *hối tiếc* trong bản dịch.
