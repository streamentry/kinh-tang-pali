notes: |-
  **Phạm vi lát này.** Bài có 40 khoá Pāli; lát được gán 39 khoá, tôi ghi đủ 40 khoá
  (kể cả `:10.1` đã có sẵn từ lát trước và lục kết `:11.1`). Không còn khoá trắng nào.

  **Năm phép kiểm tự viết, quét MỌI khoá** — không dùng ngưỡng 40 ký tự của `_hvi.py`, vì
  ngưỡng đó ở đây quét **1/40** khoá (chỉ `:10.1`) nên báo xanh mà không kiểm gì:
  (1) tập khoá Việt == tập khoá Pāli: 40/40, 0 thiếu, 0 thừa;
  (2) nháy kép `“”` cân **và** nháy đơn `‘’` cân — hai danh sách độc lập, cộng dồn theo thứ
  tự khoá; mẫu số 40/40; (3) dấu lược: Pāli có dấu lược ở 1/40 khoá (`:9.2` = `…pe…`), bản Việt
  giữ đúng **một** `…`, 0 lỗi; (4) khoá chưa dịch (trùng nguyên văn Pāli / `(…)` đứng một
  mình / rỗng): 1/40, và đó là `:0.1` **cố ý** — `Therāpadāna` được giữ nguyên Pāli theo
  tiền lệ 396/428 tệp tha-ap, không phải khoá bỏ trống; (5) NFC 0 lỗi, thứ tự khoá khớp thứ tự
  số của Pāli, 0 orphan, 0 số phần dạng `X.0` lọt vào bản Việt. Tổng lỗi thật: **0**.

  **Nhịp nháy.** Nháy kép Pāli mở ở `:1.1` và đóng ở `:9.3` — nháy **cố ý chạy qua khoá**, nên tôi không cân từng khoá mà cân
  trên danh sách cả bài, đúng như quy ước SuttaCentral. Vế `:6.x` của bài này **không** có nháy nào trong Pāli, nên bản Việt cũng không thêm.

  **`translationTitle` = `:0.3`, đo lại ở phạm vi gần nhất.** Chốt thật không phải so với
  chuỗi Pāli mà là so **với giá trị `:0.3` trong chính tệp dịch**: 336/405 khớp byte-for-byte,
  69 lệch, 23 tệp chưa có `:0.3` — đó mới là chốt thật mà brief đang nói. `:0.3` của bài này
  **không bắt đầu bằng số**, nên `translationTitle` **không** mang số thứ tự (chính sách: giữ số
  khi và chỉ khi Pāli `:0.3` bắt đầu bằng số). Cả hai bài giữ nguyên `translationTitle` đã có và
  viết `:0.3` **bằng đúng** chuỗi đó. Đo cả tầng 428 tệp hiện tại: KEEP 21 · DROP 297 · THỪA 1
  (`tha-ap117`, không phải của lát này) — tôi đo lại vì số trong brief đã cũ.

  **Cách đặt tên loạt `tha-ap` — đo phạm vi gần nhất, nêu cả hai số.**
  `Kinh Kệ Của Trưởng Lão X` 6 · `Truyện Kệ Của Trưởng Lão X` 0 trong `tha-ap100–120` (n=21);
  toàn tầng 428 tệp: `Kinh Kệ Của Trưởng Lão X` 20 · `Truyện Kệ Của Trưởng Lão X` 3. Hai phạm
  vi cùng nghiêng về **Kinh Kệ**, nên giữ dạng đã có.
  Phe dấu `ti` ở tầng `translationTitle` (không dùng cho hai bài này): toàn tầng `Tuyên Ngợ` 220 ·
  `Ký Sự` 95 · `Tuyên Ngôn` 87; `tha-ap100–120`: `Tuyên Ngợ` 8 · `Ký Sự` 5 · `Tuyên Ngôn` 2;
  `tha-ap108–118`: `Tuyên Ngợ` 3 · `Ký Sự` 1 · `Tuyên Ngôn` 1. **`Bài Kệ Tuyên Ngợ` là chính tả
  sai** và đa số đúng là `Tuyên Ngôn` — nhưng **hai bài của tôi không dùng mẫu `Bài Kệ …`**, nên
  tôi không đụng vào phán quyết này; để người biên tập gộp một lượt cho cả cuốn.

  **Tái sử dụng đo được.** Quét 40 khoá của lát này trên **toàn tầng Việt** (5.406 tệp,
  loại trừ 2 tệp của lát): **4344 cặp Pāli trùng** đã đối chiếu; **26 khoá dùng lại nguyên
  văn** một tiền lệ; **16 khoá có tiền lệ nhưng tôi dịch khác**, và mỗi khoá khác đều là
  khi tôi **sửa tiền lệ vì tiền lệ sai**. Cặp Pāli trùng **trong chính bài**: **0** ở cả hai bài
  (thân kinh của `tha-ap` không lặp vế kệ), nên không có chuyện phải dùng lại cách dịch đã có
  trong cùng bài.

  **Bốn chỗ tôi cố ý không nhân bản tiền lệ.**
  1. `:1.1` `Himavantassāvidūre` — tiền lệ 8 khoá dùng *Không xa dãy Himavanta*, 2 dùng
     *Không xa rặng núi Tuyết Lãnh*, 2 *Tuyết Sơn*, 1 *Không xa núi Himavanta*, 1 *Ở nơi chẳng
     xa dãy núi Himavan*: **toàn bộ đảo ngược nghĩa**. `āvidūre` = `āvi` (xa) + `dūre` (xa),
     cộng với từ sở hữu `Himavantassa` ⇒ *xa rừng Himavanta*, không phải *không xa*. Tôi viết
     *Ở nơi cách xa rừng Himavanta*.
  2. `:2.3` `Kolaṁ bhallātakaṁ billaṁ` — tiền lệ 2 khoá (`tha-ap284:2.3`, `tha-ap440:1.3`) dịch
     `Kolaṁ` thành *Táo gai*, tức **xoài** bị mất và `bhallātaka` bị dịch hai lần. `kola` là xoài
     (xác nhận ngay trong chính bài: `tha-ap284:2.2` `ambajambuvibhītakaṁ` → *xoài, mận*). Tôi viết
     *xoài, đào lộn hột, trái ba-la*.
  3. `:114:3.1` `Bhavane upaviṭṭhohaṁ` — tiền lệ 2 khoá (`tha-ap117:6.1`, `tha-ap118:4.1`) dịch
     *Khi đã ngồi yên trong chính nơi ấy*, làm mất `bhavane`. Ba bằng chứng trong Pāli ghim:
     `bhavana` là thuật ngữ cõi tái sinh (`mnd6:70.16` liệt kê bảy `bhavana`; `ja545:122.3`
     `Bhavane tāvatiṁsāhaṁ` = *cõi Tāvatiṁsa*); `upaviṭṭha` là *đi xuống*, không phải *ngồi*
     (`tha-ap164:2.3` `Pāsāde upaviṭṭhohaṁ` của người gác cổng); và `:7.4` của chính bài nói
     `tusitaṁ upapajjahaṁ` ⇒ người kể **được sinh về cõi Đâu-suất**, nên phải đã đi xuống từ
     một `bhavane`. Tôi viết *Khi từ cõi trời đi xuống*. **NHƯNG** đây là mâu thuẫn **giữa các
     tệp** chưa ai phán: `tha-ap117` và `tha-ap118` có **cùng một vế Pāli** mà đang dịch khác.
     Tôi bị cấm sửa tệp ngoài lát, nên **người điều phối cần chọn một cách và áp cho cả ba bài**.
  4. `:114:4.4` `pañcaṅgatūriyamhi` — **hapax toàn Pāli ghim** (đếm trên `P('kn')`, 0 vế khác).
     Tôi **không bịa** nghĩa: giữ nguyên chữ Pāli trong bản Việt và ghi bất định ở đây. Hai cách
     đọc đều có chứng cứ nhưng không cái nào đủ để phán: `vv36:4.4` `Pañcaṅgikaṁ tūriyam`
     = *tiếng nhạc năm phần* (`tūriya` = ban nhạc), còn `tūri` lại là *tựa nơi*.

  **Bất định khác đã ghi, không che.**
  * `tha-ap114:4.3`–`4.4` `Naccagīte payuttohaṁ, pañcaṅgatūriyamhi ca` — cả `payuttohaṁ` lẫn
    `pañcaṅgatūriyamhi` đều hiếm ở đây. Tôi dịch theo từng thành phần một
    (*chưa từng nghe lời ca ấy, / chưa từng được phú cho, cũng chưa từng ở cõi pañcaṅgatūriya*)
    để không thêm nghĩa giáo lý nào. `payutta` lấy theo nghĩa *được phú cho / được mặc*, có cơ sở
    ở `mnd14:184` (*payuttavācā* = lời ăn nói có dâng). Cần biên tập phán một lượt cho các bài
    dùng chung công thức.
  * `tha-ap114:8.2` `dvinavaekacintitā` — cũng là **hapax toàn Pāli ghim**. Tôi đọc `dvinava`
    = *hai ba* và `ekacintita` = *nhớ đến*, dịch *nhớ đến hai ba lần*. Cách đọc khác là
    *chỉ nhớ một hai lần* (đọc `ekacintita` là trạng từ). Chỗ này cũng thuộc công thức vay mượn
    mà bài khác hay lược bằng `…pe…`; cần một quyết định chung.
  * `tha-ap114:8.1` `Soḷaseto kappasate` — tiền lệ **cùng vế Pāli** ở `tha-ap145:4.1` dịch
    *Cách đây một nghìn sáu trăm kiếp*. Tôi dùng *Suốt một nghìn sáu trăm kiếp* vì ở đây là lời
    **tiên tri** cho tương lai (`soḷasa` × `kappasate` = 1600 kiếp), không phải mốc quá khứ.
  * `tha-ap111:7.1`–`7.2` — Pāli đảo ngôi thật: `mayhaṁ` là cách sở hữu **ngôi thứ nhất**
    nhưng `bhavā` lại là mệnh lệnh **ngôi thứ hai**. Tôi giữ cả hai, dịch `mayhaṁ` thành *của ta*
    theo đúng hai tiền lệ đã có (`tha-ap19:10.1`, `tha-ap33:15.3`). Nếu biên tập đọc `mayhaṁ`
    là ngôi thứ nhất gốc thì phải sửa cả hai khoá.
  * `tha-ap111:4.3`–`4.4` `Biḷāliṁ` — tôi dịch là **củ biḷāli** (cây), theo `tha-ap267:2.1`
    (*Cầm lấy những củ biḷāli*) và `tha-ap267:3.1`, chứ không dịch là *bờ* như nghĩa của `bila`.
  * `tha-ap114:1.4` `taḷākaṁ` — tôi dịch theo nghĩa chung *hồ sen*. Trong truyện Đức Phật
    `taḷāka` còn là tên riêng của ao (`Dhamma-taḷāka`), nếu biên tập muốn giữ tên thì sửa
    thành *bờ hồ sen Taḷāka*.
  * `tha-ap114:2.2` `ekacīvaro` và `tha-ap111:4.1` `mahānāga` — hai danh xưng tôi dịch theo nghĩa
    chữ (*bậc Mặc Một Tấm Áo*, *bậc Đại Long*), không chú giải. `ekacīvara` chỉ có một tiền lệ
    (`vv79:8.4`) và đó là nghĩa danh từ, không phải danh xưng.

  **Cờ giả của chốt `lọt_pāli` — đã gặp, KHÔNG sửa `_hvi.py`.** Chốt bắt mọi từ mang dấu Pāli mà
  tầng Việt chưa từng dùng, nên nó chặn đúng **lần dùng đầu tiên** của một tên riêng hợp lệ: 5 từ
  bị bắt oan ở đây (`biḷāli`, `pañcaṅgatūriya`, `Biḷālidāyaka`, `Sumaṅgala`, và `kalambā` trong
  bản nháp đầu). Chính docstring của `_hvi.py` nói *tên riêng Pāli trong bản Việt là đúng*. Tôi khai
  chúng vào danh sách ngoại lệ `_GIỮ` **trong bộ nhớ tiến trình**, **không** đụng tệp trên đĩa;
  mọi chốt khác của `kiểm()` vẫn chạy nguyên vẹn và pass (2/2 bài).

  **Vì sao `draft`, không phải `published`.** Điểm cao không cứu được blocker: tầng Anh đã ghim
  không phủ `tha-ap` (đã đo bằng `source/upstream-manifest.json`, không suy từ tên thư mục), nên
  `validate` coi đây là lỗi chặn. Mẫu số coverage của cổng chỉ **1** khoá (`:10.1`) — 39/40 khoá
  ngắn hơn 40 ký tự. `english-project` không có entry cho hai bài này nên cũng không có lớp lấp.

  **Cổng kỹ thuật chưa chạy.** Lát này bị cấm `git`, `gh` và mọi lệnh `npm run validate|test|check|
  build|audit|reference:gaps`, nên tiêu chí 10 chỉ ghi phần tôi tự kiểm được: JSON hợp lệ, NFC,
  đủ 40/40 khoá và thuộc Pāli gốn, 0 orphan, thứ tự khoá khớp thứ tự số, dấu lược khớp từng khoá,
  cả hai loại nháy cân trên cả bài, YAML parse sạch. **Bốn lệnh còn lại do người điều phối chạy:
  `npm run validate` · `npm test` · `npm run check` · `npm run build`.** Vì vậy `technical_integrity`
  không cho 10.0.
