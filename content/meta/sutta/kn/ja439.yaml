notes: |-
  **Đo lại ba mệnh đề của lát — hai chỗ đang vỡ, tôi ghi cả hai hướng.**
  - `0.1` `Jātaka` → **Jātaka**: 400/416 tệp `ja`.
  - `0.2` `Dasakanipāta` → **0 tiền lệ thật**: trong 426 tệp `ja` chỉ có **1** lần xuất
    hiện và tệp đó để **trống**, nên không có cách nào đối chiếu. Tôi đặt *Bộ Mười Bài
    Kệ* theo chuỗi đã đo được trong chính lớp `ja` và khớp tuyệt đối trên giá trị Pāli:
    `Chakkanipāta` → *Bộ Sáu Bài Kệ* **17/17**, `Sattakanipāta` → *Bộ Bảy Bài Kệ*
    **14/14**, `Aṭṭhakanipāta` → *Bộ Tám Bài Kệ* **8/8**, `Navakanipāta` → *Bộ Chín Bài
    Kệ* **6/6**. Đây là suy luận từ chuỗi đo được, không phải tiền lệ trực tiếp —
    người biên tập nên xác nhận khi lát `Dasakanipāta` khác cũng dùng *Bộ Mười Bài Kệ*.
    *(Đo kèm cho người gộp: `Pañcakanipāta` đang vỡ ba hướng — *Nhóm Năm Bài Kệ* 15,
    *Bộ Năm Bài Kệ* 4, *Bộ Năm Kệ* 3, trống 1; đa số cục bộ là *Nhóm Năm Bài Kệ* nhưng
    chỉ 15/23. Không thuộc lát này nên tôi không đụng.)*
  - `0.3` `Catudvāravagga` → **Phẩm Bốn Cửa**: cũng **0 tiền lệ thật** — chỉ `ja450`
    trong cùng phẩm có `Catudvāravagga` ở `0.3` và tệp đó để **trống**. Tôi đặt theo
    nghĩa `catudvāra`, và ở đây thì tiền lệ khá chắc vì `catudvāra` đã có hai lần dịch
    trong tầng: `Catukkaṇṇo catudvāro` → *Bốn góc, bốn cửa* và `catudvāraṁ bhayānakaṁ` →
    *có bốn cửa, đáng sợ*. Cùng kiểu dịch phẩm theo nghĩa đã đo được rõ ở lớp `ja`
    (`Kulāvakavagga` → *Phẩm Tổ Chim* 10/10, `Kuruṅgavagga` → *Phẩm Nai Bốn Sừng* 10/10,
    `Ruhakavagga` → *Phẩm Dây Leo* 10/10).

  **Trùng nguyên văn — 6 khoá, và đây là phần tôi phải cẩn thận nhất của lát.**
  `ja439:4.3–5.4` là **cùng sáu câu kệ** đã có ở `ja369:4.1–4.6`, tôi dùng lại nguyên văn
  theo luật trùng khớp. Nhưng vì khớp **nguyên văn** mà cấu trúc dấu nháy khác, tôi
  **bỏ dấu `“` mở** ở `ja439:4.3`: trong `ja369` đoạn này là một lời thoại riêng (mở ở
  `4.1`, đóng ở `5.4`), còn trong `ja439` nó nằm **trong** lời thoại đã mở từ `2.1` và
  đóng ở `8.4`. Giữ dấu mở thêm sẽ làm ngoặc kép lệch. Đây là sửa duy nhất tôi làm so
  với bản tham chiếu, và nó không đổi nghĩa.
  Các khoá trùng còn lại: `5.1–5.4` (`ja369:4.3–4.6`), `6.1–6.3` (`ja369:5.1–5.3`),
  `6.4` = `7.4` (`ja369:5.4`, khác `”ti.` nên không trùng nguyên văn tuyệt đối nhưng là
  cùng câu kệ — tôi vẫn dùng lại nguyên văn), `9.4` (`ja435:2.4`, nguyên văn), `10.1`
  cùng công thức với `ja398:7.1`/`ja399:7.1` (`Evaṁ yakkha sukhī hohi` với `yakkha` đổi
  thành `sakka`).

  **Câu tôi phải tự quyết.** `9.2` `cakkaṁ sirasi ṭhassati;` — chủ ngữ là *bánh xe* nhưng
  `me` (của ta) lại ở trong câu kệ trước; tôi dịch *bánh xe ơi, nó đang quay trên đầu
  ta* để giữ cả hai vế. `10.1` `Atisaro paccasaro` tôi hiểu là *nhanh thì đến, chậm thì
  đến* (bánh xe tới nhanh hay chậm), 0 tiền lệ cho cụm này.

  **Dấu lược:** 0/45 khoá có `…pe…`.

  **Không có tầng Anh.** 0/45; `ja439` không nằm trong 83 tệp `ja` đã ghim.
