  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 17 khoá chênh lệch lớn nhất (cả bài 45 khoá) → khác nghĩa 11: sửa 9 (`4.3`, `4.4`, `5.2`, `5.3`, `5.4`, `6.1`, `6.2`, `6.4`, `7.4`), giữ 6 chỉ khác diễn đạt (`0.2`, `0.4`, `1.3`, `7.3`, `8.2`, `11.1`), bất định 2 (`4.2`, `10.1`); rà toàn bài thêm 3 sửa ngoài danh sách chênh lệch (`5.1`, `6.3`, `8.4`). Các sửa theo Pāli. `4.3`–`5.1` (`catubbhi aṭṭhajjhagamā`, `aṭṭhāhipi ca soḷasa`, `soḷasāhi ca bāttiṁsa`): bản trước thêm *nàng* (đối tượng không có trong Pāli) và các động từ *muốn*, *tham* (Pāli chỉ có `ajjhagamā` *đạt tới*); nay *Từ bốn, ngươi đạt tới tám, … mười sáu … ba mươi hai*. `5.2` `atricchaṁ cakkamāsado`: chủ ngữ là *ngươi* (*đã đụng phải bánh xe*), không phải *lòng tham dẫn ngươi đến*; `cakka` chỉ là *bánh xe*, *vòng xoay dao cạo*/*dao sắc*/*vòng dao* là suy từ truyện (chính notes cũ đã nhận), nay bỏ ở `5.2`, `5.4`, `6.4`, `7.4` (các khoá `2.4`, `8.4`, `9.2`, `10.3` vốn đã là *bánh xe*). `5.3` bỏ *tột cùng*. `6.1`–`6.2` bỏ *không bến bờ ngơi nghỉ* (không có trong Pāli); `icchā` → *ham muốn* (dạng phổ biến nhất trong tầng: 52 trong 112 khoá đếm được, *ước muốn* 24, *mong muốn* 21, *tham muốn* 10, *lòng tham* 5). `6.3` `anugijjhanti` mang `gijjh` *thèm khát*. `6.4`, `7.4` `te honti cakkadhārino` → *trở thành người mang bánh xe* (bỏ *phải*, *chính*, *quay trên đầu*, vì câu này không nói *trên đầu*). `8.4` `taṁ tādisaṁ … cakkaṁ`: `taṁ tādisaṁ` là đối cách chỉ người (*người như vậy*), `cakkaṁ` là chủ ngữ; bản trước đọc `tādisaṁ` bổ nghĩa cho bánh xe. Chuỗi kệ `4.3`–`6.4` trùng nguyên văn Pāli với `ja369:4.1`–`5.4`; nay bản Việt ở đây khác `ja369` vì `ja369` còn giữ cách dịch cũ (ngoài lát này). Bất định, không đoán: `4.1`–`4.2` (`laṅghiṁ`, `samuddaṁ`, `sāgaraṁ` chưa phân xử được động từ nào đi với tân ngữ nào; giữ như cũ), `6.1` `uparivisālā` (*càng lên càng rộng* là một cách đọc `upari`, chưa có tiền lệ), `10.1` `atisaro paccasaro` (chỉ một lần trong tầng Pāli), `3.1`–`3.2` (*hơn hai mươi trăm nghìn*, giữ nguyên). Thứ tự khoá trong tệp đã được sắp lại theo thứ tự Pāli (trước đó `10.x`, `11.1` đứng trước `2.1`); nội dung các khoá không đổi vì việc này. Không có bản Anh hay bản Việt độc lập khác; chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài; quét có hệ thống Pāli trùng toàn kho: 1.4 ja369:1.2, ja484:4.4, ja547:2.2; 4.3–6.3 ja104:1.1–1.5 và ja369:4.1–5.3; 9.4 vv78, vv81, ja472, ja530, ja538): sửa 3 khoá, chỉ dấu câu/khuôn — 1.4 bỏ dấu chấm thừa sau "?”"; 10.4 dời dấu chấm ra sau nháy đóng theo Pāli; 11.1 thêm dấu phẩy theo khuôn "Kinh X, thứ nhất.". Giữ: 4.3–6.3 bám Pāli (`ajjhagamā` "đạt tới", `cakka` "bánh xe"); bản Việt của cùng dòng Pāli ở ja369 ("nàng", "dao cạo", "lòng tham dẫn ngươi") và ja104 ("đo không hết vòng xoay") lệch Pāli theo đúng các lỗi lượt 2026-10-14 đã sửa ở bài này — báo người biên tập, không sửa ngoài phạm vi. 2.1 `apihitā` = `api-hita` "đã đóng" (như `pihita`), giữ "đã khóa". Bất định giữ nguyên: `appasiddhikaṁ` (4.2), `atisaro paccasaro` (10.1).
