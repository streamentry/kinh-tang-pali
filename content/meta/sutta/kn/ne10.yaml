notes: |-
  Đợt 19, lát 101. Dịch trọn 169/169 khoá từ Pāli root đã ghim; không có khoá nào ngoài tập khoá Pāli và thứ tự khoá đúng thứ tự Pāli. Bài là *Nhóm 7* (`Āvaṭṭahāravibhaṅga`) của *Phần Giải Thích* trong Netti: giải thích hướng dẫn quy căn ("trong một nền tảng ứng với, tìm các nền tảng còn lại, quay về phía đối nghịch") qua năm bài kệ trích (`Ārambhatha nikkamatha`, `Yathāpi mūle`, `Sabbapāpassa akaraṇaṁ`, `Dhammo have rakkhati`, `Tasmā rakkhitacittassa`) và đoạn đối thoại giữa Đức Thế Tôn với thôn trưởng Asibandhaka ở `:18`–`:24` (song song với `sn42.6`). Không có Sujato, không có lớp `english-project` cho bài này và không có bản Việt hiện hành theo khoá, nên đối chiếu độc lập chỉ có Pāli root cộng tiền lệ trong chính tầng Việt của dự án (các bài `ne`, `dhp183`, `dhp338`, `sn6.14`, `thag3.13`, `ud4.2`, `sn42.6`, `mn9`, `dn14`, `dn31`, `dn33`).

  **Coverage English (đo thật).** Mẫu số 94 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0.x`); Sujato phủ 0/94; `english-project` 0; `vietnamese-current` vắng. Blocker `noEnglishEditionUpstream` là thật, không bù được bằng điểm; `triangulation` đặt 7,0 vì mọi khoá chỉ có Pāli tự đứng vững cộng đối chiếu tiền lệ Việt trong tầng.

  **Tiền lệ và Pāli trùng nguyên văn.** Đã dò 169 khoá: 31 khoá có Pāli trùng nguyên văn (không phân biệt dấu nháy) với khoá đã dịch ở ngoài bài; 30 khoá dùng lại nguyên bản Việt đã có, 1 khoá khác có chủ ý. Dùng lại: `:0.1`, `:0.2` (khuôn của bộ `ne`); `:2.1`–`:2.3` từ `thag3.13:2` và `sn6.14:6` (`:2.4` lấy ý từ `thag3.13:2.4`, Pāli lệch chữ `ti`); `:10.6`, `:15.10`, `:27.5`, `:28.5` "Đây là bốn sự thật." từ `ne20:7.9`, `ne26:2.7`; `:11.1`–`:11.4` từ `ne19:4` (cùng bài kệ `dhp183`, `dn14:3.28.6`); `:16.1`–`:16.4` từ `ne9:3`, `ne4:15`, `ja447:11`, `thag4.10:1`; `:17.4`, `:24.6` từ `ne9:36.2`; `:20.3`, `:21.3`, `:22.3`, `:23.6` "Thưa không phải vậy, bạch Thế Tôn" (126 khoá, so với "Bạch Thế Tôn, không." 59 và "Không, bạch Thế Tôn." 28); `:25.1`–`:25.5` từ `ne22:2`, `ud4.2:5`; `:9.10` từ `ne20:7.6` (đổi "hai điều ấy" cho `tesaṁ` ở cả `:5.15`, `:26.3`); `:7.7` dạng của `mn38` (5 khoá, so với "sự đoạn diệt của toàn bộ uẩn khổ" 4 khoá). Khác có chủ ý: `:25.6` dịch "mọi đọa xứ" thay cho "mọi đường dữ" của `ud4.2:5.6`/`ne22:2.6` (3 khoá) để khớp `duggati` → "đọa xứ" ở `:16.4`, `:17.2`, `:26.1` và `ne35:2.6`. Câu hỏi đáp của thôn trưởng `:18.1`–`:24.3` dùng đoạn song song `sn42.6:2`–`:8` làm tiền lệ nhưng không chép nguyên vì ranh giới khoá khác (một khoá của bài này thường gộp hai–bốn khoá của `sn42.6`); đổi "lửa thiêng" thành "thờ lửa" (Pāli `aggiparicārakā` không có "thiêng"), "bình sáp" thành "bình bơ lỏng" (`sappi` = bơ lỏng, 11/34 khoá; `sn42.6:7.1` dịch "sáp"), "mảnh sáp ... mảnh vỡ" thành "sỏi và mảnh gốm vỡ" (`sakkhara` → "sỏi" 47/54 khoá), "tảng đá bẹn" thành "tảng đá rộng" (cách dịch `puthusilā` của 2 khoá khác trong tầng; "bẹn" không có nghĩa phù hợp). Pāli trùng nguyên văn ngay trong bài: 17 cặp ở 7 nhóm (`Imāni cattāri saccāni.` ×4 ở `:10.6`, `:15.10`, `:27.5`, `:28.5` = 6 cặp; `“No hetaṁ, bhante”.` ×4 ở `:20.3`, `:21.3`, `:22.3`, `:23.6` = 6 cặp; `Cattāri upādānāni, ayaṁ samudayo.` ×2 ở `:5.13`, `:26.2`; `Pañcakkhandhā dukkhaṁ.` ×2 ở `:5.14`, `:9.9`; `Ime dve dhammā bhāvanāpāripūriṁ gacchanti samatho ca vipassanā ca.` ×2 ở `:7.4`, `:10.3`; `Tenāha bhagavā “sabbapāpassa akaraṇan”ti.` ×2 ở `:13.11`, `:15.11`; `Evaṁ bhagavā āha—` ×2 ở `:17.4`, `:24.6`); bản Việt giống hệt nhau ở cả 17 cặp (0 cặp Việt khác).

  **Thuật ngữ, kèm số đếm.** `hāra` → "hướng dẫn" (bộ `ne`: 53 khoá "hướng dẫn", 21 "phương thức" trên 101 khoá có `hāra`); tên nhóm `Nhóm Quy Căn Hướng Dẫn` theo khuôn `-hāravibhaṅga` → "Nhóm X Hướng Dẫn" (`ne9`, `ne11`–`ne19`) và `:0.3` `Vibhaṅga 7` → "Nhóm 7". `āvaṭṭa` → "quy căn" (7/12 khoá có `āvaṭṭ` ở bộ `ne`: `ne2:1.2`, `ne2:3.3`, `ne3:8.4`, `ne19:2.2`, `ne26`; "vòng xoay" 2 khoá chỉ cho `nandiyāvaṭṭa`). `padaṭṭhāna` → "nền tảng ứng với" (71/90 khoá bộ `ne`; chỉ "nền tảng" 19). `samatha`/`vipassanā` → "sự định tĩnh"/"sự quán" (bộ `ne`: "định tĩnh" 12, "chỉ" 3, "sự định" 2 trên 17 khoá; "sự quán" 9, "quán" 7 trên 18 khoá; toàn tầng `samatha` "chỉ" 12, "định tĩnh" 8, "sự định" 4 trên 44 khoá). `taṇhā` → "tham ái" (theo `ne7`, `ne9`, `ne18`, `ne19`); `bhavataṇhā` → "hữu ái" (26 khoá, "ái hữu" 4); `taṇhānusaya` → "tùy miên tham ái" (`dhp338:3` dịch "ái tùy miên"); `anusaya` → "tùy miên" (36/85 khoá). `pamāda` → "phóng dật" (169/230 khoá). `upādāna` → "chấp thủ", bốn chấp thủ → "dục thủ, giới cấm thủ, kiến thủ, ngã luận thủ" (`sīlabbatupādāna` → "giới cấm thủ" 48/50; `attavādupādāna` → "ngã luận thủ" 15/19). `duggati` → "đọa xứ" (244/516 khoá; "cõi dữ" 19, "ác thú" 9, "cảnh giới xấu" 8, "đường dữ" 7); `apāya` → "cõi dữ"; chuỗi `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ` → "cõi dữ, ác thú, đọa xứ, địa ngục" (66 khoá dạng đa số, theo `sn42.6`). Như vậy `duggati` đứng riêng dịch "đọa xứ" nhưng nằm trong chuỗi bốn thì theo tầng là "ác thú"; cả hai đều là đa số ở phạm vi riêng và được giữ. `pahāna`/`pahīyati` → "đoạn trừ" theo `ne20:7.6` (công thức `dukkhassa pariññāya samudayassa pahānāya`), khác `ne19` dùng "từ bỏ" (toàn tầng `pajahati` → "từ bỏ" 145/156 khoá); `jahe` ở `:25.6` vẫn là "từ bỏ". `pariññā` → "liễu tri" (theo `ne20:7.6`). `samudaya` (đế) → "tập", `nirodha` → "diệt" (`ne4:30.2`, `ne20:7.5`); chỉ ở `:7.7` dịch "đoạn diệt" theo công thức `mn38`. `saccāni` → "sự thật" (6/7 khoá bộ `ne`). `pariyodāpeti` → "thanh lọc" (`ne19:4.3`, `dhp183:3`); `an5.221` dịch "làm sáng tỏ" cho `sutaṁ pariyodāpeti`, nghĩa khác. `nivāraṇa` → "triền cái"; `anusayasamugghāta` → "nhổ tận gốc các tùy miên" (`dn5:11.5` "nhổ tận gốc"). `dassanabhūmi`/`bhāvanābhūmi` → "nền thấy biết"/"nền tu tập" (`ne14:14.1`; `ne11:7.1` dịch "mức"). `vodāna` → "sự thanh tịnh" (27/53 khoá; "trong sạch" 17), `okāra` → "sự thấp kém" ("thấp kém" 10, "hạ liệt" 10), `nekkhamma` → "xuất ly" (119/182). `ajjhosāna` → "đắm trước" (`dn15:9`, `dn15:13`). `indriyasaṁvara` → "phòng hộ các căn" (29/61 khoá; "hộ trì" 7), `saṁvarasīla` → "giới phòng hộ" (`ne11:2.3` dịch "giới hạnh hộ trì"); `rakkhati` giữ "hộ trì" theo bài kệ `ne9:3`, `ne4:15`. Mười nghiệp đạo bất thiện: `kammapatha` → "nghiệp đạo" (`dn33:3.3.46`), `adinnādāna` → "lấy của không cho" (126/223 khoá), `kāmesumicchācāra` → "tà hạnh trong các dục" (`mn9:4.2`; `sn42.6` dịch "hành dâm trong các dục", không theo vì hẹp nghĩa hơn), `pisuṇā vācā` → "nói hai lưỡi" (119/194), `samphappalāpa` → "nói lời vô ích" và `pharusā vācā` → "nói lời ác" (theo đoạn song song `sn42.6`, `mn9`, `mn117` để cùng bài thống nhất; toàn tầng "nói phù phiếm" 65 / "lời vô ích" 37 và "thô ác" 73 / "lời ác" 50 / "ác khẩu" 49), `abhijjhā` → "tham muốn" (9/17), `abhijjhālu` → "kẻ tham lam" (38/53), `byāpannacitto` → "kẻ có tâm sân" (45; "sân hận" 40); `duccarita` → "ác hạnh" ("thân ác hạnh" 17 khoá), `vacī` → "khẩu"; `akusalamūla` → "gốc bất thiện" (17/29); `samuṭṭhāna` → "khởi lên từ" (`an10.60:7`); `micchāmagga` → "con đường sai" (`mn19:26.6`); `micchatta`/`sammatta` → "tà tánh"/"chánh tánh" (`ne11:5.3`, 1 khoá); `sāmaññaphala` → "quả sa-môn" (52/65). `agatiṁ gacchati` → "đi theo sự thiên vị" (`dn31:5.3`, `dn33:1.11.128`), `chanda` → "ưa thích" (`dn33`). `nāmakāya`/`rūpakāya` → "nhóm danh"/"nhóm sắc" (`ne7:3.5`, `ne7:3.11`). `nigama` → "thị trấn" (31/39 khoá), `Nāḷandā` giữ nguyên (31/33), `asibandhakaputto gāmaṇi` → "thôn trưởng Asibandhaka" (9 khoá). `Tenāha bhagavā` → "Bởi vậy, Đức Thế Tôn nói" và `Tenāha āyasmā mahākaccāyano` → "Bởi vậy, Tôn giả Mahākaccāyana nói" (`ne16:4.5`, `ne16:11.5`, `ne9:44.16`). `gatiyo` ở `:17.5` → "nơi đến" (`mn12:35.1`).

  **Số Pāli (tự tính).** `:0.3` Vibhaṅga 7 → "Nhóm 7"; `duvidho` ở `:5.2`, `:15.5`, `:15.6`, `:17.1`, `:17.2` = 2 (đúng hai mục mỗi nơi); `tividho`/`catubbidho`/`ekavidho` ở `:5.4` = 3, 4, 1 (1 + 3 = 4; ba mục: tìm kiếm của cải chưa có, gìn giữ của cải đã có, thụ hưởng); `cattāro arūpino khandhā` = 4 (thọ, tưởng, hành, thức); `dve upādānāni` ở `:5.10`, `:5.11`, `:26.8`, `:26.9` = 2 + 2 = `cattāri upādānāni` 4; `pañcakkhandhā` = 5; `dve dhammā` ở `:7.4`, `:7.5`, `:10.3`, `:26.10` = 2; `dve kilesā` = 2; `dve vimuttiyo` = 2 (tâm giải thoát, tuệ giải thoát); `tīṇi duccaritāni` = 3 (thân, khẩu, ý); `dasa akusalakammapathā` = 10 (đếm đủ 10 mục ở `:12.1`); `dve kammāni` = 2; `satta kāraṇāni` ở `:12.4` = 7 (3 ở `:12.2` + 3 ở `:12.3` + `samphappalāpo` 1) và `tīṇi kāraṇāni` ở `:12.8` = 3 (`:12.5`–`:12.7`), 7 + 3 = 10; `catubbidhaṁ agatiṁ` ở `:13.1` = 4 (ưa thích, sân hận, sợ hãi, si mê); `aṭṭha micchattāni` ở `:14.1` và `aṭṭha sammattāni` ở `:15.1` = 8 (đếm đủ 8 mục); `pañcindriyāni rūpīni` ở `:26.4` = 5; `cattāri sāmaññaphalāni` ở `:27.1` = 4 (đếm đủ 4 mục); `dvemā gatiyo` ở `:17.5` = 2. Không có số lớn, không có `tiṁsa`/`sahassa`.

  **Bất định (ghi lại, không thêm vào thân kinh).** (1) `:4.1` `Ayuñjantānaṁ vā sattānaṁ yoge, yuñjantānaṁ vā ārambho` — câu không có động từ; dịch giữ cấu trúc "hoặc là sự tinh cần, đối với những chúng sinh không tinh cần; hoặc là sự nỗ lực, đối với những người đang tinh cần", đọc `yoge` ứng với lời khuyên `yuñjatha` và `ārambho` ứng với `ārambhatha`; cách đọc khác là `yoge` ở vị trí cách. (2) `:2.1` `nikkamatha` → "hãy ra khỏi" theo `thag3.13:2.1` và `sn6.14` (3 khoá); trong ngữ cảnh tinh tấn (`:3.1` `vīriyassa padaṭṭhānaṁ`) có thể là "hãy xuất lực", chưa có chứng cứ độc lập để đổi. (3) `:6.1` chủ ngữ của `pariyesati` và `karoti` là danh từ `pamādo`; dịch giữ cấu trúc "phóng dật ... tìm kiếm ... thực hiện ...", đọc `tassa` là phóng dật ấy; `paṭisaṁharaṇā` → "thu nhiếp" theo `ne7:1.12`, `rakkhaṇā` → "gìn giữ" cùng gốc với `ārakkhaṇa`. (4) `:5.9` `katamena upādānena saupādānā` dịch "có chấp thủ bởi chấp thủ nào", với `taṇhāya ca avijjāya ca` là phần đáp mở đầu `:5.10`–`:5.11`. (5) `:5.15`, `:9.10`, `:26.3` `tesaṁ` → "hai điều ấy" (khổ và tập) theo `ne20:7.6`. (6) `:9.7`, `:26.1` `tāni cattāri upādānāni` → "Đó là bốn chấp thủ": chỉ bốn chấp thủ đã nêu ở `:5.10`–`:5.11`, không đồng nhất hai phiền não với bốn chấp thủ. (7) `:15.3` `atītassa maggassa bhāvanākiriyaṁ` → "sự thực hành tu tập của con đường đã qua": nghĩa của `atīta` ở đây không rõ (có thể "đã vượt qua"), tầng không có tiền lệ; `Sacittapariyodāpananti` dịch không nháy đúng như Pāli. (8) `:15.6`–`:15.9` và `:28.1`–`:28.4` Pāli không nêu chủ ngữ của `pariyodāpeti`/`rakkhati`; dịch "người ấy" ở `:15.x` và "Pháp" ở `:28.x` (chủ ngữ của bài kệ `:16.1`); `yato` → "điều từ đó", `yena` → "điều nhờ đó". (9) `:18.2` Pāli kết `”ti.` không có dấu hỏi, nhưng song song `sn42.6:2.3` là câu hỏi nên dịch "chăng?". (10) `:19.1`, `:20.1` xưng hô "tôi/anh" theo `sn42.6:3.1`, `sn42.7:1.6`; `sn42.13:2.8` dùng "Ta/ngươi" cho cùng công thức. (11) `:27.4` `tadārammaṇā ca asaṅkhatādhātu` → "các quả của phạm hạnh, và giới vô vi là đối tượng của chúng, là diệt": hiểu `tadārammaṇā` là "có chúng làm đối tượng"; cách đọc khác là hai thứ đứng ngang hàng (các quả và giới vô vi cùng là diệt). (12) `:13.1` `payogaṁ gacchantaṁ` → "đi vào hành động": tầng không có tiền lệ sát nghĩa (`payoga` ở `mil6.3.2:15` là "nỗ lực"). (13) `:17.2` `upanidhāya` → "so với"; `:24.5` `tikkhatā adhimattatā` → "sự sắc bén và độ mạnh": 0 tiền lệ. (14) `:12.7` `micchādiṭṭhi, ayaṁ micchāmaggo` giữ như Pāli; không rõ vì sao tà kiến được gọi `micchāmagga` trong khi hai khoá trước định `lobha`, `doso`. (15) `:18.1` `uyyāpenti nāma, saññāpenti nāma, saggaṁ nāma okkāmenti` → "nâng lên, tiễn đưa, hướng lên cõi trời" theo `sn42.6:2.2`; chữ `nāma` không có chỗ trong tiếng Việt. (16) `:2.4`, `:3.3` `naḷāgāraṁva kuñjaro` → "như con voi đánh bay căn nhà bằng lau sậy" theo `thag3.13:2.4`.

  **Dấu lược và nháy.** Pāli có 2 `…pe…` (ở `:21.4`, `:24.1`), không có `…` trần và không có `(…)`; Việt giữ đúng 2 dấu `…`, mỗi dấu cuối khoá. Dấu nháy khớp Pāli từng khoá: 0/169 khoá lệch (đo cả bốn loại “ ” ‘ ’); nháy kép mở không đóng ở `:18.1`, `:19.1`, `:21.1`, `:21.4`, `:23.1`, `:24.1` và nháy kép đóng không mở ở `:18.2`, `:20.2`, `:21.2`, `:23.5`, `:24.2` đúng như Pāli (lời thôn trưởng và lời Đức Thế Tôn kéo qua nhiều khoá); nháy đơn ở `:20.1`, `:21.1`, `:21.5`, `:22.1`, `:23.4`, `:23.5`, `:24.2`. Các khoá dạng `Xti` không nháy ở Pāli (`:15.3` `Sacittapariyodāpananti`, `:26.11` `brahmacariyanti`) nên Việt cũng không thêm nháy.

  Kiểm kỹ thuật: tập khoá Việt = tập khoá Pāli = 169, đúng thứ tự Pāli; không khoá rỗng; đều NFC; chữ có dấu Pāli duy nhất còn lại là tên riêng (`Mahākaccāyana`, `Nāḷandā`). Đã đọc đối kháng từng cặp Pāli–Việt. Cổng kỹ thuật CHƯA chạy — cần chạy đủ bốn lệnh trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
