    LỖI NGHĨA THẬT ĐÃ SỬA — 40/47 khoá đổi (bản cũ hầu như đọc hỏng cả bài; cốt truyện thật:
    người cha đào hố ở bãi tha ma để chôn sống cha già, con trai khuyên can).
    (1) NGƯỜI NÓI/ĐỐI TƯỢNG bị đảo. `1.4`: con hỏi cha đào hố làm gì (cũ: cha hỏi con). `2.x`:
      cha đáp rằng ông nội (`pitāmaho te`) quá yếu, ông sẽ chôn ông ấy (cũ: "cha của con thật
      là khó gặp… ta sẽ cùng con ẩn trú trong hốc"). `3.x`: con đáp "cha sẽ nhận việc như thế
      từ con khi cha già, theo phong tục tông tộc, con cũng sẽ chôn cha". `4.x`: cha mắng. `5.x`:
      con biện minh. `6.x–8.x`: LỜI CỦA CHA. `9.x–10.x`: lời con khuyên cha đuổi mẹ.
    (2) `2.1` `sudubbalo` = su + dubbala = RẤT YẾU (cũ "thật là khó gặp" là sai; 0 tiền lệ ngược
      lại, `pv23:6.2` và `ja484:11.2` đều dịch "yếu ớt"). Bất định cũ về `sudubbalo` ở mục
      BẤT ĐỊNH phía trên bị thay thế.
    (3) `2.3` `sobbhe` = hố (cũ "hốc", "ẩn trú"; `dn16:4.19` dịch "hố"); `nikhaṇissāmi` = chôn.
    (4) `3.3–3.4` `jarūpanīto` = bị đưa đến già nua (cũ "đã lễ thề" — bịa); tiền lệ `sn1.3`, `ja498`
      dịch "bị đưa đến già nua". `3.5` dùng lại nguyên văn `ja444:7.3` (cùng Pāli).
    (5) `6.1–7.2` cũ viết "làm hại mẹ/cha… lại dâng thức ăn" (hỏng cả câu đối lập). Đúng: kẻ làm
      hại cha mẹ vô tội thì xuống địa ngục (`6.4`); kẻ phụng sự cha mẹ bằng ăn uống thì lên
      cõi lành (`7.4`). `adūsake` = vô tội (tiền lệ `ja547`, `ja544`, 20+ nơi).
    (6) `4.4`, `5.x`, `8.1–8.2`: `ahitānukampī` = người mong điều bất lợi, `hitānukampī` = người
      mong điều lợi ích — theo tiền lệ `dn12:10.9–11` ("mong lợi ích"/"mong điều bất lợi").
      Bản cũ viết "phúc lành", lẫn hai vế.
    (7) `9.2`/`10.2` `sakiyā janetti` = "người mẹ ruột đã sinh ra" (`sakiya` = của chính mình;
      cũ "người thị tộc Saky" là bịa từ nhầm với Sakya). `janetti` theo `ja516:7.3`, `bv27:13.3`.
      `9.3` `niddhāpaye` = nên đuổi ra; `9.4` `aññampi` = thêm nỗi khổ khác.
    (8) `1.1–1.2` bốn thứ là CỦ ăn được: takkala, āluva, biḷāli, kaḷamba (cũ "khoai", "con ơi"
      lẫn). Dùng lại cách dịch của `tha-ap407:16`/`tha-ap3:31` (Pāli y hệt: "củ āluva và củ
      kaḷamba, củ biḷālī và củ takkala").
    (9) `6.3`/`7.3` cũ "khi thân xác xác định tan rã": theo tiền lệ `vv31:8.3` + `pv36:23.3, 24.3`
      (3/4; `pv30:11.3` là ngoại lệ có thêm "chắc chắn" không có trong Pāli) → "khi thân hoại, ở
      đời sau".
    (10) `8.3` cũ "mẹ bảo rằng mẹ đã làm điều ác" — sai người. Đúng: cha nói mình làm việc ác
      vì mẹ của con trai nói với mình (`mātarā vuccamāno`).
    (11) `10.3–10.4` cũ "dù đã được thuần phục… vẫn còn quay về điều ác" — ngược với dạng cầu khiến
      của `punarāvajātu`: xem bất định (c) bên dưới.
    Số cặp Pāli trùng nguyên văn TRONG bài: 4 (`6.1`≡`7.1`, `6.3`≡`7.3`, `9.1`≡`10.1`,
