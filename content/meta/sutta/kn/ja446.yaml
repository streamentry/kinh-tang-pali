    còn lại (`6.2/7.2`, `6.4/7.4`) khác nhau và Việt đã khác tương ứng.
    Dấu lược `…pe…`: 0/47. Nháy kép: 7 mở/7 đóng, khớp Pāli từng khoá (6.1–8.4 là một lời duy
    nhất của cha). Số Pāli: không có.

    BẤT ĐỊNH CÒN LẠI (đều ghi ở đây, không thêm vào thân kinh).
    (a) `saviṭṭha` (`6.1`, `7.1`) đọc là HÔ CÁCH TÊN RIÊNG của người con (cha gọi con), theo
      cách hiểu thông dụng trong truyền thống Jātaka; không có tiền lệ nào khác trong tầng ở
      dạng hô cách này (`ja204:1.4`, `ja210:5.2` là `saviṭṭhaka`, nghĩa khác). Nếu đây không
      phải tên riêng thì chỉ mất chữ "Saviṭṭha", nghĩa các khoá không đổi.
    (b) `8.3` `taṁ mātarā` đọc "mẹ của con" (`taṁ` ≈ `tava`); nếu `taṁ` là tiểu từ, nghĩa vẫn
      là mẹ của người con (khớp `9.1–9.2`).
    (c) `10.4` `punarāvajātu` đọc là dạng mệnh lệnh (cầu khiến) của `punarāvajati` (quay lại; cùng
      gốc `punarāvajissaṁ` ở `ja537`, `ja513`, `ja418` dịch "quay lại") — con khuyên cha đuổi mẹ,
      rồi để bà "trở lại" sau khi đã được thuần như voi cái. Đây là cách đọc bám dạng động từ
      và hình ảnh `dantā… vasūpanītā`; không có bản Anh để đối chiếu nên không thể chốt chắc 100%.
    (d) `kareṇū` = voi cái (tiền lệ `ja547:78.1`); `vasūpanītā` = bị đưa vào dưới quyền (0 tiền
      lệ trong tầng).
    (e) `accāhitaṁ` (`3.2`) = ati + ahita, "quá đỗi tai hại"; tiền lệ `ja546:216.3` dịch cả cụm
      "tàn độc ghê gớm".
    (f) `āsajja` (`4.2`) = xúc phạm, theo tiền lệ `pe2:14.1`, `thag1.25:3`.

