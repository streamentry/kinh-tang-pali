  đàn bà có ác pháp ấy trở lại", bản mù cũng không chắc về động từ, câu Pāli chưa phân xử được).
  Không có bản Anh hay bản Việt độc lập khác. Rà đối kháng toàn bài: sửa 1 (ja446:8.4 karomi là hiện
  tại, "đã làm việc tàn nhẫn như thế" → "làm việc tàn nhẫn như thế", vì ở 2.3 người cha còn đang đào
  hố và nói "hôm nay ta sẽ chôn"). Giữ "củ takkala", "củ biḷāli", "củ kaḷamba" theo ja496:11.2 và
  ja547:692.2. Nháy kép khớp Pāli từng khoá. triangulation không vượt 8,0 vì chỉ có một lần dịch lại
  cùng họ công cụ; technical_integrity vẫn 9,6, chưa chạy lại: npm run validate, npm test, npm run
  check, npm run build.
