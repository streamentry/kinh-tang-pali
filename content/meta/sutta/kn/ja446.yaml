  NHÁY KÉP — phải bám PĦLI, đếm ra 7 mở / 7 đóng.
    `1.1–2.4`, `3.1–3.6`, `4.1–4.4`, `5.1–5.4`, `6.1–8.4`, `9.1–10.4`. Lưu ý `6.1` mở nháy
    nhưng dấu đóng nằm ở `8.4`, tức câu 6–8 là **một** lời nói duy nhất; đóng sớm ở `7.4`
    là sai. Có 12 bài `ja` khác trong tầng cũng bị lệch như thế này ở PĦLI và bản Việt
    đã cân — đây là quy ước của nhóm, tôi theo y hệt.

  LỖI REVIEW ĐỐI KHÁNG ĐÃ BẮT VÀ ĐÃ SỬA (4 lỗi thật).
    (1) **`4.4` sai cực đội tính.** Bản nháp dịch `Ahitānukampī mama tvaṁsi putta` thành
      *con trai lo cho phúc lành của tôi* — đã **đải phủ định**. `ahitānukampī` = KHÔNG lo
      cho phúc lành. Đã sửa thành *con trai không lo cho phúc lành của tôi*. Vì vậy `5.1`
      cũng phải viết lại cho khớp: `Na tāhaṁ tāta ahitānukampī` là *chẳng phải mẹ là
      người không lo*, tức phủ định ngoài hành động, chứ không phải *mẹ không lo cho
      phúc lành của con*.
    (2) **`9.4` sai chủ thể.** `Aññampi te sā dukhamāvaheyya` có `sā` (số ít) ⇒ *cô ta*,
      bản nháp ghi *họ*. Đã sửa.
    (3) `3.2` `Accāhitaṁ` (= không dựng lời / không tập nói trước) bản nháp dịch *chẳng đem
      ra dựng lời* — mơ hồ; đã sửa thành *chẳng dựng lời cho chu tới* (dùng *chu tới* vì
      `ja439:3.4` đã có *hãy nói lời tuyên truyền cho chu tới*).
    (4) `6.3`/`7.3` thiếu mối thời gian của `abhisamparāyaṁ`; đã thêm *khi*.

  BẤT ĐỊNH — đã phán, ghi ở đây, không giải thích trong thân kinh.
    · `takkalā` (`1.1`) là **gà công** (chim mèo cái). 0 tiền lệ cho cụm này trong tầng; đây
      là đọc theo nghĩa `takkala` trong Jātaka.
    · `susā` (`1.3`) là **gà kýu**; `āluvā` = thỏ rừng ấu; `biḷāliyā` = gà mái; `kaḷambā` = ếch.
      Tất cả 0 tiền lệ — đặt theo nghĩa thường.
    · `sudubbalo` (`2.1`) đọc là `su` + `dubbala` = **rất khó**, nên dịch *thật là khó gặp*.
      Đây là điểm cần người biên tập xác nhận: nếu đọc *rất dễ* thì câu đổi nghĩa.
    · `Āsajja` (`4.2`) dịch *cậu đã vượt phận với tôi*; `vadase` là *cậu đang nói*, nên tôi
      ghép *cậu trai à, cậu đã vượt phận với tôi*. 0 tiền lệ.
    · `tāta` dùng hai nghĩa trong bài: mẹ gọi con (`1.4`, `2.1`) → *con ơi*; con gọi mẹ
      (`3.3`) → *mẹ ơi*. Đây là cách tôi phân giải chủ thể, không phải tiền lệ.
    · `Kāreṇūva` (`10.3`) dịch *huấn luyện*; `kareṇūva` không tra được nghĩa chắc chắn.
    · `anariyarūpā` (`9.1`, `10.1`) dịch *hạ tiện*; `sakiyā` giữ *Saky* (tầng `thag` đã có
      `Saky` 2 lần; trong `ja` chưa có tiền lệ nào cho `sakiyā`).

  MAU THUẪN CẦN NGƯỜI ĐIỀU PHỐI GỘP.
    Cùng giá trị PĦLI `Dasakanipāta`, nhưng hai tầng đang lệch nhau: tầng `ja` 5/5 dùng
