notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành cho Milindapañha. Toàn bài dịch từ Pāli root; triangulation hạ xuống 7.0.
  Tiền lệ dùng lại: Buddhavagga → Phẩm Đức Phật (4 bài đã có) · Rājā āha— → Vua nói: · Āma, mahārāja →
  Vâng, này Đại vương (10 bài) · anuttaro → vô thượng (100 tiền lệ) · mahāsamuddo → biển cả ·
  sông Hằng, Dăm, Aciravatī, Sarabhū và Mahī dùng đúng cách gọi của an10.15:10.1 ·
  ūnattaṁ vā pūrattaṁ vā paññāyati → vơi đi hay đầy lên, theo nguyên văn ud5.5:14.1 ·
  sāvake mahante parinibbute → các đệ tử của Ngài là những bậc đại đã viên tịch.
  Bất định đã ghi nhận. Duppariyogāho không có tiền lệ trong tầng; tôi dịch là khó lấn tới bờ, giữ nghĩa
  không với tới được và cạnh bờ. Appameyyo → không thể đo lường. Khoá 1.5 nói có những người biết trước biển
  cả (jāneyyuṁ te, te là họ), không phải biển cả tự biết; tôi giữ chủ ngữ là con người.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0. Nháy kép: cặp mở ở 1.5 và đóng ở 1.6; cân trên cả bài.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá. Đợt này cấm chạy npm run validate, test, check,
  build nên không tuyên bố technical gate pass; bốn lệnh đó để người điều phối chạy, technical_integrity 9.8.
