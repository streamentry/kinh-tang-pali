notes: |-
  **Phạm vi: đủ 71/71 khoá của bài, không khoá nào ngoài danh sách.** Thứ tự khoá trong tệp
  bản dịch bằng đúng thứ tự Pāli (kiểm bằng phép so danh sách, không dùng phép cân tổng).

  **Nguồn và coverage — đo theo công thức khai ở `source/layers.yaml`
  (`substantivePaliMinChars: 40`, bỏ khối `:0`), tầng Anh tra qua manifest đã ghim:**
  · Độ dài Pāli lớn nhất của bài là **26 ký tự**, toàn kệ ngắn ⇒ **mẫu số cổng = 0/71**.
    ⚠ Cổng coverage **không đo được gì** ở bài này; con số 100% hiển thị không phải bằng chứng
    Sujato dịch đủ.
  · Đo thô thay thế, trên khoá thân bài (bỏ ba khoá tiêu đề `0.1`–`0.3`): bản Anh Sujato
    đã ghim **có tệp** `thig12.1_translation-en-sujato.json` (manifest xác nhận), **66/66 khoá kệ
    `1.1`–`16.4` có chữ = 100%**; tính cả hai khoá kết `17.1` (colophon) và `18.1` thì
    **66/68 = 97,1%**; hai khoá trống đó đều ngắn và dưới ngưỡng. Ba khoá `0.x` cũng có chữ.
    Cả hai số đều ≥ 0,80, nên không cần entry `reference-gaps`.
  · Tầng `english-project` **vắng** (không có tệp cho uid này, và cũng không cần lấp vì
    không có khoá nào Sujato bỏ trống ở phần kệ). Tầng `vietnamese-current` **vắng** (tại
    commit đã ghim thư mục Việt hiện hành chỉ có Pháp Cú). Bản Việt nguyên bài của
    SuttaCentral (Bhikkhu Indacanda) chỉ là mục *Tra cứu toàn văn* ở cuối trang, không phải tầng
    store, nhưng đã đọc để đối chiếu cách đọc cú pháp. ⇒ `triangulation` **8,9**: Pāli + một
    tầng Anh đủ, không có tầng Việt phân đoạn, không có bản Anh độc lập thứ hai.
  · Bài này có hai bản kể song song trong chính kho Pāli ghim: `sn10.5` (7.1–7.4) và `ud5.4`
    (5.1–5.4) mang đúng công thức `Sace ca pāpakaṁ kammaṁ … Na te dukkhā pamutyatthi`; dùng
    làm tiền lệ trực tiếp (xem dưới).

  **Tái dùng nguyên văn — đo trên 165.642 khoá Việt dự án, dựng chỉ mục Pāli→Việt ở mức
  segment (chuẩn hoá khoảng trắng):**
  · **6/71 khoá** có Pāli trùng nguyên văn ở bài khác; tổng **7 cặp** (`12.3` có 2 cặp).
  · Dùng lại **nguyên văn** ở **2** khoá: `0.3` (`thig1.3:0.3`, *Kinh Kệ Của Trưởng Lão Nữ
    Puṇṇā*) và `2.3` (`thig1.17:1.3`, *Khi các chi thể đang run rẩy,*).
  · **5/7 cặp** bản Việt khác, đều cố ý: `16.1` (`thag3.1:3.1`) chỉ đổi ngôi kể *ta → tôi*
    (người nói ở bài này xưng *tôi* xuyên suốt `3.x`/`10.x`/`11.x`); `12.1` (`sn10.5:6.3` *Chớ làm
    điều ác,*), `12.3` (`sn10.5:7.1` *điều ác*, `ud5.4:5.1` *việc ác*) và `13.1`
    (`sn10.5:7.3`) đổi đại từ *ngươi/các ngươi → ông* vì ở đây là Puṇṇā nói với một Bà-la-môn
    nên giọng xưng hô khác với Dạ-xoa nói với Sānu. `12.1` thêm *Thì* vì Pāli đứng sau
    `Sace bhāyasi dukkhassa` (mệnh đề điều kiện).

  **Cặp Pāli trùng TRONG CHÍNH bài: 4 cặp, 0 cặp bản Việt khác** (`2.2`≡`9.2` *nên ông luôn lội
  xuống nước;* · `11.3`≡`13.3` *Nếu ông sợ khổ,* · `11.4`≡`13.4` *nếu ông không ưa khổ,* ·
  `14.2`≡`15.2` *Pháp, và Tăng đoàn của những bậc như vậy;*). Bản nháp đầu viết `2.2` khác
  `9.2`; phép so cặp trùng nội bộ bắt được và đã sửa cho khớp.

  **Năm phép kiểm (tự viết, in số kèm mẫu số):**
  · (1) `set(khoá Việt) == set(khoá Pāli)`: **71 / 71**, thiếu **0**, thừa **0**; thứ tự khoá
    khớp Pāli. Phép **có đo được**.
  · (2) Nháy kép **khớp Pāli từng khoá**: lệch **0**. Pāli có `“`/`”` ở **12 khoá** (mở `1.1`,
    `3.1`, `5.1`, `10.1`, `11.1`, `15.1`; đóng `2.4`, `4.4`, `9.4`, `10.4`, `14.4`, `16.4`);
    Việt cũng 12 khoá, cùng vị trí. Pāli **không có nháy đơn** nên Việt cũng **0** nháy đơn.
    `16.4` Pāli kết `”ti.` ⇒ Việt `.”`; các khoá Pāli kết `”.` ⇒ Việt `”.`.
  · (3) Pāli trùng nguyên văn trong bài: **4 cặp**, bản Việt khác **0** (sau sửa). Phép **có đo
    được**.
  · (4) Dấu lược: Pāli có `…` ở **1 khoá** (`17.1`, **2** dấu); Việt cũng **2**, lệch **0**. Mở
    rộng lược (Pāli không có `…` mà Việt có): **0**. `… cho đến …`: **0**. `(…)` trần: Pāli
    **0** khoá, Việt **0**. Pāli kết `….` ở `17.1` ⇒ Việt kết ` ….`.
  · (5) Số Pāli, thêm NFC, khoá rỗng, khoảng trắng: chưa NFC **0**; khoá rỗng **0**; khoảng
    trắng thừa hoặc hai dấu cách **0**; Pāli lọt sang Việt chỉ là tên riêng `Puṇṇā`/`Puṇṇikā`
    (giữ nguyên, có chủ đích). `0.1` (*Therīgāthā 12.1*) trùng nguyên văn Pāli có chủ đích, như
    các khoá `:0.1` khác trong tầng.
  · **Số Pāli** — tự tính: `Soḷasaka` = 16 ⇒ *Mười Sáu* (`0.2`, `18.1`); `tevijjo` = 3
    ⇒ *tam minh* (`16.3`); `dve`, `ekā` v.v. không xuất hiện. Công cụ đo số chuẩn của kho
    hiệu chuẩn OK nhưng **không theo dõi cụm nào có trong bài này**, nên ở đây nó không đo
    được gì; số do tôi tự tính như trên.
  · Đọc cặp Pāli↔Việt từng khoá (71/71 in ra đọc đối kháng): không có khối nào mang nội dung
    của khối bên cạnh.

  **Thuật ngữ — đo trên tầng, kèm số đếm:**
  · `Tevijjo` (`tevijj*`): *tam minh* + *tam-minh* **51** dòng, *ba minh* **11** dòng (trên 137
    dòng Pāli có `tevijj`) ⇒ *tam minh*.
  · `pāpakamma` (compound, `pāpakamm*`): *nghiệp ác* **68**, *ác nghiệp* **59**, *điều ác* **14**,
    *việc ác* **2** (155 dòng) ⇒ *nghiệp ác* (`4.2`, `4.4`, `5.4`, `7.4`, `7.6`).
  · `pāpakaṁ kammaṁ` (hai từ rời, 10 dòng): *việc ác* **6**, *điều ác* **2**, *nghiệp ác* **1**
    ⇒ *việc ác* (`12.1`, `12.3`, `12.2`). Đối xứng `kusalaṁ kammaṁ` (10 dòng): *nghiệp thiện*
    **2**, *điều thiện* **1**, *việc thiện* **1**: chọn *việc thiện* (`3.3`) để cặp với *việc ác*.
    Hai phạm vi cho đa số khác nhau (compound ⇒ *nghiệp ác*, cụm rời ⇒ *việc ác*) và tôi giữ
    đúng ranh giới ngữ pháp đó.
  · `saraṇaṁ` kèm `upemi`/`upehi` trong kệ: *nương về* **2/2** (`thig3.5:3.4`, `thig6.1:6.4`); trong
    văn xuôi `saraṇaṁ gacchāmi` dịch *quy y* nhiều hơn (đa số rõ). Kệ ⇒ *nương về*.
  · `saṅgha` (83 dòng có `saṅghañca`): *Tăng* **73** (trong đó *Tăng chúng* **59**), *Tăng đoàn*
    **7**. Phần lớn là `bhikkhusaṅgha`; ở đây là `saṅgha` của bậc `tādī` nên chọn *Tăng đoàn*
    (có tiền lệ `mn27:27.4`).
  · `tādin`: **103** dòng có `tādi*`; *như vậy* **22**, *bất động* **9**, *như thật* **8**, *như thế*
    **3** ⇒ *những bậc như vậy* (`14.2`, `15.2`).
  · `sottiyo` ⇒ *bậc tinh thông* (`mn39:22.1`, `27.1`, `27.3` đều *người tinh thông*; `snp3.6`
    *bậc học giả* **1**); `nhātako` ⇒ *bậc đã tắm sạch* (`mn39` **3**, `snp3.6` **2**).
    `vedasampanno` **0** tiền lệ trong tầng (hapax trong tầng đã dịch); dịch *đầy đủ tri thức*
    theo `vedagū` ở `mn39:22.1` (*người đã đạt tri thức*).
  · `susumāra` ⇒ *cá sấu* (`mn129:21.3`, `sn35.247:3.3`). `nāga` ⇒ *rồng* (`ja253:3.3`; Sujato
    *dragons*); tầng cũng dịch `nāga` là *voi*/*rắn*/*long tượng* ở chỗ khác, nên đây là
    lựa chọn theo ngữ cảnh nước (xem bất định). `orabbhika`/`sūkarika`/`macchika`/`migabandhaka`/
    `vajjhaghāta` ⇒ *kẻ giết cừu*/*kẻ giết heo*/*kẻ đánh cá*/*kẻ bẫy thú*/*đao phủ* theo `mn51:9.2`,
    `an4.198:5.2`, `mn82:25.24`.
  · `dukkhamappiyaṁ` ⇒ *không ưa khổ*: chỉ **1** tiền lệ (`ud5.4:4.2` *ghét khổ*, và khác `vo`/`te`);
    `appiya` = *không ưa*, nên không đẩy lên *ghét*.
  · `upeccāpi palāyato` (`13.2`) ⇒ *dù có bay lên mà chạy trốn*: **2/2** tiền lệ (`sn10.5:7.4`,
    `ud5.4:5.4`) cùng nghĩa *bay lên*. `paribāhiro` ⇒ *bị loại ra ngoài* (`sn4.25:16.4`, `18.4`
    **2** nơi).

  **BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh:**
  · `14.2`/`15.2` `tādinaṁ`: tôi gắn vào `saṅgha` (*Tăng đoàn của những bậc như vậy*), cách đọc của
    bản Việt nguyên bài; Sujato gắn vào Đức Phật (*the unaffected*). Cả hai khả dĩ về ngữ pháp;
    nghĩa giáo lý không đổi.
  · `10.3` `Dakābhisecanā bhoti`: tôi đọc là cách ablative chỉ sự tách khỏi (*Khỏi việc tắm gội bằng
    nước*), theo bản Việt nguyên bài; Sujato nối vào tấm vải (*ablution cloth*). Chủ ngữ
    `samānayi` (`10.2`) là người nghe (cô), tân ngữ là `maṁ` của `10.1`; bản Việt đặt *Tôi* ở
    `10.1` làm chủ đề và để `10.2` không lặp tân ngữ.
  · `8.4` `tena tvaṁ paribāhiro`: Pāli không nói *ngoài cái gì*; tôi **không** thêm (Sujato thêm
    *prevented from which*). Hiểu là ngoài phước vừa nhắc ở `8.3`, nhưng đó là suy luận.
  · `13.2` `upeccāpi`: bản Việt nguyên bài đọc là *cố tình*; Sujato và hai tiền lệ trong kho đọc là
    *bay lên*. Tôi theo kho (2/2).
  · `6.3` `nāgā`/`susumārā`: *rồng* và *cá sấu* là lựa chọn của tôi; `susumāra` cũng có nghĩa là
    cá heo sông (Sujato *dolphins*) và `nāga` có thể là loài rắn nước.
  · `2.1`/`9.1` `kassa`/`yassa`: *điều gì* / *điều mà*, theo Sujato và bản Việt nguyên bài, cách
    đọc *ai* ở `2.1` (`kassa` = *của ai*) không loại trừ hẳn.
  · Tên: `0.3`/`17.1` ghi **Puṇṇā**, `3.2` (hô cách) ghi **Puṇṇikā**; giữ nguyên hai dạng Pāli.
    Sujato đặt tiêu đề *Puṇṇikā*.
  · `4.3`/`5.3`/`7.5` `Dakābhisecanā`: dịch *tắm gội bằng nước* nhất quán; `nāma` ở `5.3` dịch
    *cái gọi là*.

