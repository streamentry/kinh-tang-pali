notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của `_hvi.py` gần như vô dụng ở bài này**: nó chỉ quét khoá Pāli từ 40 ký tự trở lên, mà mọi vế kệ ở đây đều ngắn hơn, nên `cần` rỗng và assertion không chạy. Vì vậy tôi tự quét **toàn bộ** khoá từ đĩa: đủ khoá, đúng exact ID, NFC, không rỗng, dấu lược khớp Pāli từng khoá, ngoặc kép cân cả bài, không Pāli lọt, không `(…)`. Kết quả: **0 lỗi trên 252 khoá**.
  - |-
    **Đã tự dựng chỉ mục Pāli↔Việt toàn tầng rồi so khoá của lát, không đoán.** Nạp mọi tệp Pāli gốc trong cache (284.708 khoá) và mọi tệp Việt dự án (111.657 khoá), ghép theo khoá vì khoá là duy nhất toàn hệ thống. Lát này tìm được **5 khoá có Pāli trùng nguyên văn với bài đã có bản Việt ngoài lát (5 cặp)**, và **16 cụm Pāli trùng nguyên văn nội lát**. Mọi bản Việt đã có đều được dùng lại nguyên văn, không dịch lần hai.
  - |-
    **Đây là bài mà `kiểm()` không bắt được gì cả**: không một vế kệ nào dài 40 ký tự, nên `cần` rỗng. Toàn bộ 18 khoá chỉ được bảo đảm bởi lượt quét tự viết.
  - |-
    **Năm vế trùng nguyên văn thig6.1, dùng lại y nguyên — đây là phần quan trọng nhất của bài.** `2.1` = thig6.1:5.1 → *Ơ, cây tên của tôi đã được nhổ ra,* · `2.2` = thig6.1:5.2 → *cây khó nhìn thấy, đã găm vào tim;* · `3.1` = thig6.1:6.1 → *Nay cây tên đã được nhổ trọn vẹn,* · `3.2` = thig6.1:6.2 → *đã tắt hẳn, đã tịch tịnh hoàn toàn;* · `3.3` = thig6.1:6.3 → *Đức Phật, Pháp và Tăng,*. Cùng một văn bản Pāli mà dịch khác nhau sẽ làm kinh tự mâu thuẫn. `2.3–2.4` tuy Pāli hơi khác (`Cāhaṁ` → `Yaṁ`, `So dhītusokaṁ` → `dhītusokaṁ`) nhưng tôi giữ nguyên cách dùng của thig6.1 để cặp vế vẫn nhìn là một lời.
  - |-
    **Review đối kháng bắt được 1 lỗi.** `1.4–1.5` bản nháp lặp *tất cả* hai vế liền (*tất cả đều mang tên ‘Hãy sống’; / tất cả đã bị thiêu*) — nhịp câu đều, đúng loại lỗi AI slop; sửa `1.5` thành *đều đã bị thiêu trong đám thiêu ấy*.
  - |-
    **Bất định.** (1) `jīvāti` là nguyện cầu *hãy sống*; tôi dịch *Hãy sống!* và giữ trong nháy cong vì đó là tiếng khóc của người mẹ chứ không phải lời thoại thật. (2) `hāḷāha` là giàn hoả thiêu, tôi dịch *đám thiêu* chứ không phải *nghĩa địa*, vì `Etamhāḷāhane daḍḍhā` nói về người vừa bị thiêu chứ không phải nơi chôn. (3) `Attānaṁ adhigaccha` — Sujato dịch *get a hold of yourself*, tôi dịch *hãy tìm lấy chính mình*, sát nghĩa *lấy lại* hơn.
  - |-
    **Bản Anh đã ghim đầy đủ cả 18 khoá.** Chỗ khác biệt đáng kể: Sujato dịch `Cullāsītisahassāni Sabbā jīvasanāmikā` thành *Eighty-four thousand people, all named ‘Live’* — ông hiểu *mang tên* đúng, tôi giữ cùng cách đọc.
