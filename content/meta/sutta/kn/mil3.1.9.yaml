notes: |-
  Lát c14. KHÔNG có Sujato tại commit đã ghim cho mil3.1.9 ⇒ `draft`, xem
  blocking_errors.

  11/31 khoá trùng nguyên văn, đã dùng lại đúng nguyên văn đã có:
  · `Milindapañha` (152), `Mahāvagga` → “Đại Phẩm” (17/17, cùng cả mil3.1.2-16).
  · `Rājā āha—` → “Vua nói:” (38 bản so với “Vua nói—” 14 và “Đức vua nói—” 6 — đã đếm, đa
    số rõ).
  · `“Opammaṁ karohī”ti.` → ““Xin hãy xét một thí dụ”ti.” (10 bản so với ““Hãy xét
    một thí dụ”.” 5 và ““Hãy xét một thí dụ”ti” 4). `“Bhiyyo opammaṁ karohī”ti.` →
    ““Xin hãy xét một thí dụ nữa”ti.” (3 bản).
  · `Bhāsitampetaṁ, mahārāja, bhagavatā—` → “Điều này, này Đại vương, Đức Thế Tôn đã nói
    —” (3 bản).
  · `“Kallosi, bhante nāgasenā”ti.` → ““Khéo lắm, thưa tôn giả Nāgasenā.”” (60 bản — đa
    số áp đảo; một lát trước đã dùng lại nguyên văn này).
  · Văn xưng theo mil đã merge: `bhante nāgasena` → “thưa tôn giả Nāgasena” (36) hoặc
    “bạch ngài Nāgasena” (18) — tôi chọn nhóm đông; `mahārāja` → “tâu đại vương” (77 viết
    hoa) / “đại vương”. Tầng mil có ít nhất 5 cách xưng hô chồng lên nhau
    (Tâu đại vương / tâu đại vương / Tâu Đại vương / này Đại vương / bạch đại đức
    Nāgasena) và đó là tầng đang phân tán; tôi ghi ở đây để người điều phối chuẩn hoá.

  Bốn thí dụ lặp (2.2-2.3, 3.2-3.3, 4.2-4.3, 5.2-5.3) có CÙNG một vế kết
  `sīlaṁ nissāya sīle patiṭṭhāya pañcindriyāni bhāveti … paññindriyan`. Theo luật của kho,
  một công thức phải dịch nhất quán, nên cả bốn vế dùng nguyên văn giống hệt nhau — tôi
  tự viết một lần rồi lặp y nguyên văn, và đã kiểm 4 vế này giống nhau từng chữ.

  Tiền lệ cho danh sách ở khoá 1.5 (dài nhất bài): `indriya` → “căn”, `bala` → “sức
  mạnh” (516 bản), `bojjhaṅga` → “giác chi” (620), `satipaṭṭhāna` → “tứ niệm xứ” (233),
  `sammappadhāna` → “chánh cần” (54), `iddhipāda` → “thần túc” (dn18:22.2 “Bốn thần
  túc”), `jhāna` → “tầng thiền”, `vimokkha` → “giải thoát”, `samāpatti` → “sở đạo”
  (mn12:16.1 “chứng đạt”). `maggaṅga` → “đạo phần” và `iddhipāda` → “căn tiến dẫn” mỗi
  cách chỉ có 1 bản (chính tệp tôi vừa ghi) — lần đầu dùng trong tầng; tôi ghi ở đây.

  Bất định đã ghi: `sabbe kusalā dhammā na parihāyantī` (1.5) — “không thoái lui” theo nghĩa
  đơn giản của `parihāyanti` (suy tàn); có thể là “không suy giảm” (đứng về phía bỏ mất
  phần) nên tôi giữ “không thoái lui”.

  Khoá 7.1-7.4 là bài kệ Đức Phật dẫn, có cùng khoá 6.1 `Sīle patiṭṭhāya naro sapañño`
  với sn1.23:2.1-2.4 và sn7.6:3.1-3.4 (cùng bốn vế, khác ở vế cuối). Tôi theo cách dịch
  đã có: “Người trí, đã đứng vững trên giới” / “thì tu tập tâm và trí tuệ” / “vị tỳ-kheo
  tinh cần, khéo léo” / và “gỡ mớ rối này” (sn1.23:2.4 “người ấy gỡ được mớ rối này”).

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
