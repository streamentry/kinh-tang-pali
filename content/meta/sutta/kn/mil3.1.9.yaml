notes: |-
  Lát c14. KHÔNG có Sujato tại commit đã ghim cho mil3.1.9 ⇒ `draft`, xem
  blocking_errors.

  11/31 khoá trùng nguyên văn, đã dùng lại đúng nguyên văn đã có:
  · `Milindapañha` (152), `Mahāvagga` → “Đại Phẩm” (17/17, cùng cả mil3.1.2-16).
  · `Rājā āha—` → “Vua nói:” (38 bản so với “Vua nói—” 14 và “Đức vua nói—” 6 — đã đếm, đa
    số rõ).
  · `“Opammaṁ karohī”ti.` → ““Xin hãy xét một thí dụ”ti.” (10 bản so với ““Hãy xét
    một thí dụ”.” 5 và ““Hãy xét một thí dụ”ti” 4). `“Bhiyyo opammaṁ karohī”ti.` →
    ““Xin hãy xét một thí dụ nữa”ti.” (3 bản).
  · `Bhāsitampetaṁ, mahārāja, bhagavatā—` → “Điều này, này Đại vương, Đức Thế Tôn đã nói
    —” (3 bản).
  · `“Kallosi, bhante nāgasenā”ti.` → ““Khéo lắm, thưa tôn giả Nāgasenā.”” (60 bản — đa
    số áp đảo; một lát trước đã dùng lại nguyên văn này).
  · Văn xưng theo mil đã merge: `bhante nāgasena` → “thưa tôn giả Nāgasena” (36) hoặc
    “bạch ngài Nāgasena” (18) — tôi chọn nhóm đông; `mahārāja` → “tâu đại vương” (77 viết
    hoa) / “đại vương”. Tầng mil có ít nhất 5 cách xưng hô chồng lên nhau
    (Tâu đại vương / tâu đại vương / Tâu Đại vương / này Đại vương / bạch đại đức
    Nāgasena) và đó là tầng đang phân tán; tôi ghi ở đây để người điều phối chuẩn hoá.

  Bốn thí dụ lặp (2.2-2.3, 3.2-3.3, 4.2-4.3, 5.2-5.3) có CÙNG một vế kết
  `sīlaṁ nissāya sīle patiṭṭhāya pañcindriyāni bhāveti … paññindriyan`. Theo luật của kho,
  một công thức phải dịch nhất quán, nên cả bốn vế dùng nguyên văn giống hệt nhau — tôi
  tự viết một lần rồi lặp y nguyên văn, và đã kiểm 4 vế này giống nhau từng chữ.

  Tiền lệ cho danh sách ở khoá 1.5 (dài nhất bài): `indriya` → “căn”, `bala` → “sức
  mạnh” (516 bản), `bojjhaṅga` → “giác chi” (620), `satipaṭṭhāna` → “tứ niệm xứ” (233),
  `sammappadhāna` → “chánh cần” (54), `iddhipāda` → “thần túc” (dn18:22.2 “Bốn thần
  túc”), `jhāna` → “tầng thiền”, `vimokkha` → “giải thoát”, `samāpatti` → “sở đạo”
  (mn12:16.1 “chứng đạt”). `maggaṅga` → “đạo phần” và `iddhipāda` → “căn tiến dẫn” mỗi
  cách chỉ có 1 bản (chính tệp tôi vừa ghi) — lần đầu dùng trong tầng; tôi ghi ở đây.

  Bất định đã ghi: `sabbe kusalā dhammā na parihāyantī` (1.5) — “không thoái lui” theo nghĩa
  đơn giản của `parihāyanti` (suy tàn); có thể là “không suy giảm” (đứng về phía bỏ mất
  phần) nên tôi giữ “không thoái lui”.

  Khoá 7.1-7.4 là bài kệ Đức Phật dẫn, có cùng khoá 6.1 `Sīle patiṭṭhāya naro sapañño`
  với sn1.23:2.1-2.4 và sn7.6:3.1-3.4 (cùng bốn vế, khác ở vế cuối). Tôi theo cách dịch
  đã có: “Người trí, đã đứng vững trên giới” / “thì tu tập tâm và trí tuệ” / “vị tỳ-kheo
  tinh cần, khéo léo” / và “gỡ mớ rối này” (sn1.23:2.4 “người ấy gỡ được mớ rối này”).

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  Giải quyết draft 2026-10-12: đọc đối kháng lại cả 31 khoá từ Pāli và sửa 11 khoá có lỗi
  nghĩa thật (1.2, 1.3, 1.5, 2.2, 5.2, 5.4, 6.4, 7.1, 7.3, 7.4 và dấu nháy đóng ở 7.4);
  thay thế các mục cũ ở trên về `samāpatti` → “sở đạo”, `maggaṅga` → “đạo phần”, `iddhipāda`,
  “bốn tứ niệm xứ” và bất định “thoái lui”, cùng cách dịch 5.4 và 7.1–7.4.
  · 5.2 (nặng nhất): `laṅghako sippaṁ dassetukāmo` là người nhào lộn muốn trình diễn tài nghệ;
    `sakkharakathalaṁ` là sỏi và mảnh sành (đúng như mil3.1.1:4.2). Bản cũ “người vượt sông
    muốn chỉ đường tắt … tảng đá cứng” hoàn toàn sai, và “chỉ đường tắt” không có trong Pāli.
  · 6.4: bản cũ “sẽ có những căn ấy sinh khởi để gỡ mớ rối này” là bịa; Pāli `so imaṁ vijaṭaye
    jaṭaṁ` = “vị ấy có thể gỡ mớ rối này” (khớp sn1.23:2.4). 6.2 bỏ “thì” không có trong Pāli.
  · 7.1: `dharaṇīva pāṇinaṁ` = “như đất đối với chúng sinh”, không phải “như biển nâng đỡ mặt
    đất”. 7.3: bỏ “Tôi nói” không có trong Pāli. 7.4: `yo sīlakkhandho varapātimokkhiyo` =
    “tức là giới uẩn thuộc về giới bổn Pātimokkha tối thắng”, không phải “con đường tối thượng
    để thoát ly”. Dấu nháy đơn mở ở 6.1 nay đóng ở 7.4 (’”) đúng như Pāli.
  · 1.2: `katame te kusalā dhammā` = “những pháp lành ấy là gì”, không phải “pháp lành của ngài”;
    1.3 bỏ “của ngài” thêm vào. 1.5: bỏ các số “bảy / tám / bốn” và “bốn tứ niệm xứ” (Pāli chỉ
    có hợp từ, không có số); `samāpatti` → “các thể nhập”; bỏ “nhờ vậy” (Pāli không có từ nối
    nhân quả); `na parihāyanti` → “không bị suy giảm”.
  · 2.2: thêm lại vế cuối `vuḍḍhiṁ virūḷhiṁ vepullaṁ āpajjanti` bị bỏ sót; `vepulla` = sung
    mãn, không phải “chín muồi” (sn45.150 và mil3.3.5 vẫn dịch “chín muồi” — ngoài phạm vi
    tệp này, báo để người điều phối cân nhắc). 5.4: `bhāsitampetaṁ` có “cũng”, và người nói
    xưng “tâu đại vương” như mọi khoá khác trong bài, thay cho “này Đại vương”.
  · Giữ nguyên: 2.1 “Xin hãy xét một thí dụ” (`opammaṁ karohi` đúng ra là “hãy nêu một thí
    dụ”, nhưng đây là quy ước của cả tầng mil, đã có tiền lệ nhiều bài) và 8.1 “Nāgasenā”.
  Phân loại blocker: câu blocker duy nhất còn lại là loại (A) — Sujato không có bài này tại
  commit đã ghim; giữ nguyên vì đó là sự thật về upstream (ý về `vietnamese-current` vắng trong
  cùng câu là giới hạn tham chiếu, không phải lỗi văn bản). Không còn lỗi văn bản chưa phân xử
  (loại D).
  Số: Pāli chỉ có “năm căn” (pañcindriyāni) và “thứ chín” (navamo); đều khớp.
  Tiền lệ: hợp từ `bījagāmabhūtagāma` → “hạt giống và cây cỏ” (dn2, dn1, mn27, mn51 …);
  `balakaraṇīya` → “công việc cần sức lực” (mn35:10.5); `siṅghāṭaka` → “ngã tư” (mn129, mn87).
  `triangulation` giữ 7,5 (không có bản Anh độc lập). Cổng kỹ thuật chưa chạy trong đợt này:
  `technical_integrity` 9,6; còn lại `npm run validate`, `npm test`, `npm run check`,
  `npm run build`.

  Giải quyết draft 2026-10-13 (vòng 2): đọc đối kháng lại cả 31 khoá từ Pāli; không còn lỗi
  nghĩa nặng, chỉ chỉnh 2 khoá (1.5, 6.1).
  · 1.5: `patiṭṭhānalakkhaṇaṁ … sabbesaṁ kusalānaṁ dhammānaṁ` = đặc tính là nền tảng của tất cả
    các pháp lành; viết lại thành một vế rõ ràng, và `sīlaṁ patiṭṭhaṁ` (nền tảng của các căn, sức
    mạnh, giác chi…) dùng lại “nền tảng” thay cho “chỗ nương tựa” (dễ lẫn với `nissāya`).
  · 6.1: `naro sapañño` → “Người trí”, theo sn1.23:2.1 và sn7.6:3.1 (2/2 bài cùng kệ dùng “Người trí”).
  · Đã dò và giữ: `catukka`/`siṅghāṭaka` → “ngã tư, ngã ba” (đúng thứ tự mil1:7.3 và mil6.4.1);
    `laṅghaka` → “người nhào lộn”; `ātāpī nipako` → “nhiệt tâm, sáng suốt” (sn1.23:2.3).
  Phân loại blocker: loại (A). Sujato không có tệp cho mil3.1.9 tại commit đã ghim
  (`not-published-upstream`); câu blocker đã viết lại thành một khẳng định thuần về việc thiếu
  bản Anh, tách khỏi mọi lời về lỗi văn bản. Tầng `vietnamese-current` vắng là giới hạn tham
  chiếu. Không còn lỗi văn bản chưa phân xử (loại D), không còn bất định phải ghi ngoài mục
  “không bị suy giảm” (`na parihāyanti`, nghĩa đơn giản, không đổi giáo nghĩa).
  Điểm giữ nguyên; `triangulation` 7,5 vì không có bản Anh độc lập.

  Quyết định hội đồng biên tập 2026-10-16: B3 — mil3.1.9:1.5 (iddhipāda = “như ý túc”).
