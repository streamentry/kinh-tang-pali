notes: |-
  Đợt 19, làn 46. Dịch từ Pāli root commit đã ghim, đủ 65/65 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem dưới).

  **Tiêu đề, theo khuôn của các bài anh em cùng phẩm.**
  - `0.2` “Bộ Mười Bài Kệ” và `0.3` “Phẩm Bốn Cửa” dùng lại nguyên văn từ `ja439`, `ja442`, `ja443`, `ja445`–`ja453` (cùng `Dasakanipāta` + `Catudvāravagga`).
  - `0.4` “2. Kinh Kaṇha” và `14.1` “Kinh Kaṇha thứ hai.” theo khuôn “N. Kinh <tên>” và “… thứ <số>” của `ja439` (`Catudvārajātaka` → “1. Kinh Bốn Cửa”, “Kinh Bốn Cửa thứ nhất”); số `2.` ở tiêu đề và `dutiyaṁ` ở 14.1 cùng bằng 2 và cùng đứng sau `ja439` là thứ nhất. Lưu ý: `ja29` cũng có tên Pāli `Kaṇhajātaka` nhưng dịch “Kinh Con Bò Kaṇha” vì đó là chuyện con bò đen; ở `ja440` `Kaṇha` là tên vị bà-la-môn/đạo sĩ (kệ 1–2: `Kaṇho vatāyaṁ puriso`, `Na kaṇho tacasā hoti`), nên không đặt “Con Bò”. Tầng có `Mahākaṇha` → “Kinh Mahākaṇha” ở `ja469:0.4`, giữ tên riêng Pāli như vậy.

  **Trùng nguyên văn trong chính bài (đã dò sau khi nén khoảng trắng): 6 nhóm, 0 nhóm lệch.** `3.1–3.4` = `10.1–10.4` = `12.1–12.4` (4 nhóm, mỗi nhóm 3 khoá, bản Việt giống hệt); `4.1–4.2` = `11.1–11.2` = `13.1–13.2` (2 nhóm, mỗi nhóm 3 khoá, bản Việt giống hệt). Đây là lời Sakka nhắc lại ân huệ và lời xin ân huệ lặp lại ba lần.

  **Trùng nguyên văn với bài khác trong tầng.**
  - `5.4` (`taṁ me akkhāhi pucchito”.`) trùng nguyên văn với `ja401:5.6` và `ja439:9.4`: dùng lại đúng bản Việt “xin hãy nói cho tôi biết điều ấy, tôi hỏi”.” (2 cặp trùng đã dò, 0 cặp lệch).
  - `3.4` (`yaṁ kiñci manasicchasi”.`) trùng nguyên văn với `ja429:6.4`, `ja430:6.4` (“dù ngươi mong muốn điều gì”.”). Tôi **cố ý lệch một chữ**: đại từ “ngươi” đổi thành “ông”, vì ở `ja429`/`ja430` Sakka nói với con vẹt còn ở đây Sakka nói với một vị bà-la-môn khổ hạnh mà chính Sakka vừa khen; “ông” khớp với `3.3` cùng bài. Ghi nhận: 2 cặp trùng đã dò, 2 cặp khác đúng ở đại từ.
  - `13.3–13.6` (`Na mano vā sarīraṁ vā, … etaṁ sakka varaṁ vare”ti.`) và `4.1–4.2`, `11.1–11.2`, `13.1–13.2` (`Varañce me ado sakka, sabbabhūtānamissara;`) là cùng bài kệ được Milindapañha trích ở `mil7.4.2:6.1–6.6` (chính câu dẫn là “trong chuyện tiền thân Kaṇha”, `mil7.4.2:5.4`). Đã đối chiếu: 6 cặp (`mil7.4.2:6.1–6.6` so với `13.1–13.6`): 4 cặp trùng byte (6.2–6.5) và 2 cặp chỉ khác dấu nháy (6.1 mở `‘` so với `“`, 6.6 đóng `’”` so với `”`), cách dịch thuật ngữ giữ cùng “ân huệ” (`vara`), “tâm hay thân thể”, “vì tôi”, “này Sakka, đó là ân huệ tôi cầu xin”. **Hai chỗ tôi không sao chép nguyên văn**: (a) ở `mil7.4.2:6.1–6.2` bản Việt dồn “Này Sakka, chúa tể muôn loài,” vào 6.1 và “nếu ngài ban cho tôi một ân huệ;” vào 6.2, ngược thứ tự Pāli (`Varañce me ado sakka` / `sabbabhūtānamissara`); bản này đặt đúng theo từng khoá (4.1 “Nếu ngài ban cho tôi một ân huệ, này Sakka,” / 4.2 “chúa tể muôn loài;”); (b) `mil7.4.2:6.4–6.5` bỏ `sakka` (6.4) và `kadāci` (6.5); bản này giữ “này Sakka” (13.4) và “không bao giờ” (13.5). Báo, không sửa `mil7.4.2` (ngoài lát): 1 cặp khoá lệch thứ tự và 2 từ bị rơi.

  **Số Pāli:** bài này không có số lượng nào cần tính ngoài `caturo` (4.6) = 4: “bốn ân huệ”, và thật sự có bốn ân huệ ở 4.3–4.5 (không giận dữ · không sân hận · tham đã đoạn · không ái luyến: `sunikkodha` · `suniddosa` · `nillobha` · `nisneha`), khớp. Số `2.` ở dòng tiêu đề `:0.4` và `dutiyaṁ` ở 14.1 = 2 ⇒ “thứ hai”.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên công cụ đo):**
  - `kodha` → “giận dữ”: tầng có 287 khoá chứa `kodh…`; “giận dữ” là cách dịch của `an10.23:8.4` (cùng dạng `kodho`), còn “phẫn nộ” là cách của `an6.36:1.4` (`kodhano`); chọn “giận dữ” vì đây là danh từ trừu tượng trong kệ, phân biệt với `dosa`.
  - `dosa` → “sân hận”: tầng có 267 khoá chứa `dos…`; “sân” là cách chủ yếu trong bộ ba tham–sân–si (`dn34:1.4.19`, `sn36.16:1.12`, `an10.23:8.2`); thêm “hận” cho đủ âm tiết trong câu kệ. Ở 4.3 `suniddosaṁ` → “hoàn toàn không sân hận”, ở 5.1 và 7.5 `dose`/`doso` → “sân hận”, nhất quán.
  - `lobha` → “tham” (142 khoá chứa `lobh…`; “tham” ở `dn34:1.4.19`, `an10.23:7.1`); ở 4.4 `nillobha` → “không tham lam” (tính từ), 5.2, 8.3–8.4 → “tham”. `lobhadhammesu` (8.3) → “những kẻ có tính tham”.
  - `sneha` → “ái luyến”: tầng có 25 khoá chứa `sneh…`; “ái luyến” ở `snp2.5:7.1` (`Snehajā` → “từ ái luyến”) là dạng danh từ ngay cùng nghĩa (tình cảm dính chặt). Các nơi khác (`mn119:18.3`, `mn77:25.4`) là nghĩa đen “độ ẩm / chất nhờn”, không liên quan. `snp4.15:9.2` dịch “sự dính mắc”, nhưng ở đây `sneha` đối cực với `kodha`/`dosa`/`lobha` thành bốn mối nguy nên giữ “ái luyến”. `Snehasaṅgathitā ganthā` (9.1) → “những nút thắt do ái luyến kết lại” (`gantha` ở tầng chỉ có 9 khoá, nghĩa động từ “kết / gắn kết” ở `snp1.10:12.4`, `dn31:26.18`; danh từ “nút thắt” là nghĩa gốc của `gantha`).
  - `pharusā vācā` (7.1) → “lời nói thô ác”: tầng có 230 khoá chứa `pharus…`; “nói ác khẩu” (`an10.222:2.8`), “nói lời ác” (`an4.269:2.1`), “nói dữ” (`dn33:1.11.193`) khác nhau; chọn “thô ác” bám `pharusa` = thô nhám/cứng cỏi + hàm ý độc ác.
  - `parāmāso` (7.2) → “sự túm nắm”: tầng có 82 khoá chứa `parāmās…`, hầu hết nghĩa “chấp thủ / bám chặt” (`mn22:3.19`, `mn64:6.7`); nghĩa đen “chạm / nắm lấy” ở đây (sau lời thô, trước tay và gậy) là bước bạo lực thân thể đầu tiên; xem bất định 3.
  - `ālopa sāhasākārā` (8.1) → “cướp bóc, hành vi bạo lực”: `sāhasa` chỉ 3 khoá trong tầng, dịch “bạo hành” ở `sn56.96-101:3.4`, “bạo lực” ở `an4.198:9.19`; `ālopa` “cướp đoạt” ở `an4.198:9.19`.
  - `nikatī vañcanāni` (8.2) → “gian xảo và lừa lọc”: tầng có 40 khoá chứa `nikat…`, “gian trá / xảo trá / lừa đảo” (`mn94:16.24`, `dn1:1.10.19`, `snp2.2:4.2`); `vañcana` → “lừa” (20 khoá).
  - `ābādhā` (11.5) → “bệnh tật”: tầng có 428 khoá chứa `ābādh…`, chủ yếu trong công thức hỏi thăm sức khoẻ (`appābādhaṁ` → “ít bệnh”); `antarāyakarā` (11.6) → “gây trở ngại”, cùng cách với `dn12:15.8` (`antarāyakaro` → “gây trở ngại”).
  - `upahaññetha` (13.5) → “bị tổn hại”: tầng có 4 khoá, “tổn thương / tổn hại” (`mn139:11.3`, `snp3.8:11.4`, `mil7.4.2:6.5`); cùng cách với `mil7.4.2:6.5`.
  - `akhantijo` (6.2) → “sinh ra từ sự không nhẫn nại”: dạng `akhanti` không có tiền lệ trực tiếp trong tầng (0 khoá); dịch theo gốc `khanti` (nhẫn nại, kham nhẫn) + phủ định `a-`.
  - `upāyāso` (6.3, trong `bahupāyāso`) → “ưu não”: tầng có 407 khoá chứa `upāyās…`, cách dịch cố định “ưu, não” (`mn87:27.4`, `sn22.2:9.10`); ở đây `bahu` → “lắm”.
  - `kaṇha` (1.1–1.3, 2.1, 2.4) → “đen”: `kaṇhasappa` → “rắn đen” ở `ja367:1.2`, `ja389:3.1`, `ja464:11.1`, `ja474:10.3`; ở kệ này `kaṇha` vừa là màu da và đồ ăn vừa là tính chất nghiệp ác (2.3–2.4), nên cố ý dịch cùng một chữ “đen” cho cả bốn lần để giữ chơi chữ của Pāli.
  - `sujampati` (2.4) → “phu quân của nàng Sujā”: cùng cách với `ja347:3.2` (“đấng Maghavā phu quân của nàng Sujā”); đây là danh xưng của Sakka, dùng làm hô cách.
  - `vara` → “ân huệ”: cùng cách với `mil7.4.2:6.2` và `mil7.4.2:6.6`. Bản của `ja429`/`ja430` dịch “món quà” cho `vara` nhưng ở đó Pāli là `varaṁ dammi … varaṁ varassu` kèm chuyện cây xoài, nên không đồng nhất và không dùng lại.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 10 dấu mở · 10 dấu đóng ở các khoá 1.1/1.4, 2.1/2.4, 3.1/3.4, 4.1/4.6, 5.1/5.4, 6.1/9.4, 10.1/10.4, 11.1/11.6, 12.1/12.4, 13.1/13.6; Việt cũng đúng 10/10, lệch 0/65 khoá. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0. Một lỗi đã bắt khi tự kiểm: bản nháp đầu tôi đọc nhầm khoá `6.1` là không có dấu mở nháy (vì 6.1–9.4 là một lời thoại dài khác với 5.1–5.4); phép so từng khoá bắt được và đã sửa. Lỗi thứ hai tự bắt: bản nháp đầu viết thừa dấu chấm trước nháy đóng (`….”.`) ở các khoá kết lời thoại, trong khi Pāli chỉ có `”.`; đã sửa theo khuôn của tầng.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `nillobhaṁ vuttimattano` (4.4): `vuttimattano` = `vuttiṁ` + `attano`; đọc theo hướng ít giả định nhất là “lối sống (`vutti`) của chính tôi, không tham”, tức `nillobhaṁ` bổ nghĩa `vuttiṁ` (cùng đuôi `-ṁ` với `sunikkodhaṁ suniddosaṁ` ở 4.3), dịch “lối sống của tôi không tham lam”. Có thể đọc 4.3–4.5 là ba tân ngữ rời của `abhikaṅkhāmi` (“tôi mong cầu sự không giận dữ, không sân hận, không tham trong lối sống của mình, và không ái luyến”); hai cách cho cùng bốn ân huệ, chỉ khác phạm vi của “lối sống”. Không có tiền lệ nào trong tầng cho `vuttimattano`.
  2. `parāmāso anantarā` (7.2): `parāmāsa` hầu hết nghĩa “chấp thủ” trong tầng; ở đây chọn nghĩa đen “túm / nắm lấy” vì trình tự `lời thô → parāmāsa → tay → gậy → vũ khí` là leo thang bạo lực thân thể. Cách đọc “sự đụng chạm” cũng khả dĩ; “túm nắm” là cách ít giả định hơn.
  3. `satthassa paramā gati` (7.4): dịch “đến vũ khí là chỗ cùng tột”; `gati` có thể là “nơi đến / kết cục”, `paramā` “tột cùng / tối hậu”; nghĩa gần như nhau, giữ “chỗ cùng tột”. `sattha` ở đây là “vũ khí / dao kiếm” (không phải nghĩa “đoàn buôn” cùng chữ).
  4. `Duṭṭhassa` (7.1): dịch “kẻ sân hận” (gốc `dus` “bị làm hư, bị nhiễm sân”); cách đọc “kẻ ác” cũng khả dĩ. Chọn “sân hận” để khớp vế sau `Doso kodhasamuṭṭhāno`.
  5. `Kiṁ nu … Ādīnavaṁ tvaṁ passasi` (5.1–5.3): dịch “nơi giận dữ hay sân hận, nơi tham và ái luyến … ông thấy tai hại gì” (`kiṁ` là từ nghi vấn của `ādīnavaṁ`). Câu trần thuật chứ không để dấu hỏi, vì Pāli ngắt bằng dấu phẩy rồi nối `taṁ me akkhāhi pucchito` ở 5.4.
  6. `senti manomayā puthū` (9.2): `senti` (từ `seti` “nằm”) với chủ ngữ `ganthā … manomayā puthū` (“nhiều nút thắt do tâm tạo”) — dịch “do tâm tạo ra, nằm đó rất nhiều”; vị trí mà các nút thắt “nằm” (trong người nào) không nói trong kệ; không thêm vào Việt.
  7. `maṁ-kate sakka kassaci` (13.4): `maṁ-kate` = “vì tôi / do tôi” (gạch nối của Pāli đã ghim); `sakka` là hô cách chen giữa; dịch “của bất kỳ ai, này Sakka, vì tôi” rồi nối “mà không bao giờ bị tổn hại” ở 13.5, theo cùng nghĩa với `mil7.4.2:6.4`.
  8. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1: Sakka (nhìn vị đạo sĩ da đen); 2: Kaṇha trả lời; 3, 5: Sakka (khen rồi ban ân huệ, hỏi lý do); 4, 6–9, 11, 13: Kaṇha (xin ân huệ, giải thích); 10, 12: Sakka (nhắc lại ân huệ). Đây là suy luận từ nội dung (đặc biệt `sakka` ở hô cách trong 4.1, 11.1, 13.1 và `brāhmaṇa` trong 3.3, 5.2), không được ghi vào thân kinh.

