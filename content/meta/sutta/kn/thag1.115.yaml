notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Bốn vế kệ của
  Trưởng lão Mahānāma trong phẩm Dvādasamavagga.

  **Đây là bài khó nhất lát, và tôi hạ điểm vì lý do này chứ không phải vì hình thức.** Pāli là một
  câu so sánh **hai ngọn núi** nhưng mệnh đề cắt cụt, không có vế chính cho mệnh đề thứ hai:

  `Esā vā hiyyase pabbatena` / `Bahukuṭajasallakikena` / `Nesādakena girinā` /
  `Yasassinā paricchadenā`

  Có ba cách đọc, tôi ghi cả ba ra đây để người biên tập chọn:
  (a) *Núi này làm ngươi kém hơn, với lớp cây bụi dày đặc; còn núi Nesādaka thì có tán phủ rực rỡ*
  — **đây là cách tôi chọn**: hai danh từ `pabbatena` và `Nesādakena girinā` đều đứng, cả hai đều là
  núi, và `hiyyase` (số ít thứ hai, bị động) giữ nguyên là *ngươi ở thế kém*.
  (b) Đọc `Nesādakena girinā` là danh ngữ định danh, `Esā vā` chỉ là ý bổ trợ → bài chỉ nói về một
  núi. Cách này làm mất vế đối lập nên tôi không chọn.
  (c) Nhân với mỉa mai: núi Nesādaka trần trụi nên đá trần là *tán phủ* của nó, đẹp hơn cây cối.
  **Tôi không đưa (c) vào thân kinh** vì Pāli không nói, và ghép chú giải vào lời kệ là loại lỗi
  mà AGENTS.md §6 cấm.

  **Bản Anh Sujato ở bài này không dùng được làm chỗ dựa.** Sujato dịch `Esāvahiyyase pabbatena`
  thành *By Mount Nesādaka* và `Yasassinā paricchadenā` thành *you are found deficient* — tức Sujato
  **đảo vị trí hai vế**, đọc `hiyyase` là chủ ngữ vế sau thay vì `Esā` là chủ ngữ vế trước. Tôi theo
  Pāli; kết quả là bài dịch Việt **không** trùng sắc thái của Sujato ở đây, và tôi ghi rõ thay vì
  né.

  **Thuật ngữ, đếm được.** `pabbata`/`giri` → *núi* (329 bản trong tầng). `Nesādaka` giữ nguyên dạng
  Pāli như tên núi (Pāli viết `Nesādakena girinā`). `Bahukuṭajasallakikena` → *lớp cây bụi dày đặc*
  (Sujato *its famous covering of abundant shrubs and trees*; `bahūkuṭaja` + `salla` là chỗi cây, có 3
  chỗ trong tầng Pāli). `Yasassinā paricchadenā` → *tán phủ rực rỡ* (`yasassin` = rực rỡ / lẫy lừng:
  an4.1:4.4 *oai danh lẫy lừng*, sn11.18:2.4 *vinh quang*; `paricchada` = tán che, xuất hiện 1 lần
  trong tầng Pāli). `vā` là tiểu từ chỉ báo, không dịch.

  **Bất định khác.** `esā vā`: `vā` có thể là tiểu từ hoặc lỗi chép của `va`; tôi bỏ nó vì không đóng
  góp nghĩa. Câu tôi chọn **không** tròn vẹn ở vế cuối, đúng như Pāli cũng cụt; tôi không thêm vế
  cho đủ.

  **Dòng kết lược giữ HAI DẤU LƯỢC, không mở rộng** (BRIEF_VI3 §10.1): 10 bản trên đĩa mở rộng,
  5 bản giữ lược. Xem `thag1.112.yaml`. Cả hai đều giữ 2 dấu lược như Pāli.

  **Thứ tự khoá tiêu đề: theo PĀLI** (`0.3` = phẩm, `0.4` = tên bài kệ); 12 bản thag đã publish đặt
  ngược, tôi không sửa chúng.

  **Không đối chiếu được tầng Việt hiện hành** (bilara chỉ có Pháp Cú). Sujato có 8/9 khoá, trống
  đúng dòng kết; mọi khoá Pāli ngắn hơn 40 ký tự nên `substantiveSegments = 0`, `ratio = 1`.

  **Kiểm kỹ thuật.** `save_vi` sạch, chạy hai lần idempotent. Tự kiểm: đủ 9/9 khoá; đúng ID; thứ tự
  khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2); ngoặc kép cân; không chữ ngoài
  Latin; không còn `(…)`. Không chạy `npm run validate|test|check|build` (đợt này cấm) →
  `technical_integrity` = **9.6**. Ba tiêu chí hạ (`semantic_fidelity` 9.2, `grammar_logic` 9.1,
  `ambiguity_integrity` 9.0) là hạ vì chỗ này — không phải vì khó diễn đạt.

  **Danh xưng giữ nguyên dạng Pāli** (Mahānāma; tên núi Nesādaka).
