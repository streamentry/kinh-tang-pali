  Không khoá nào của 6 bài `ja` này có `…pe…` ở Pāli (đã kiểm 246/246 khoá), nên không có dấu lược nào để giữ và không chỗ nào bịa dấu lược che chỗ thiếu.
  Pāli mở/đóng ở 1.1/1.4 và 2.1/2.4, rồi mở ở `:3.1` và đóng **ở `:9.4`** — tức một lời thoại liền suốt qua sáu câu kệ, không đóng giữa chừng. Bản nháp mở thêm ở `:9.1`; đã sửa.
  Bản này là **Haliddirāga**, bài thứ chín của `Gijjhavagga` trong `Navakanipāta`.
  **Pāli trùng nguyên văn: 9 khoá; 6 khoá dùng lại NGUYÊN VĂN** — `:2.1` theo `ja348:1.1` (*Từ nơi rừng sâu trở về thôn làng,*); `:3.3` theo `ja348:2.3` (*Biết lắng nghe và có lòng kiên nhịn chịu đựng,*); `:3.4`/`:4.4`/`:5.4` (cùng Pāli) theo `ja348:2.4` (*con hãy kết giao thân cận với người ấy khi rời khỏi nơi đây.*); `:6.3` theo `ja348:4.3` (*Này con, chớ bao giờ thân cận hạng người như thế,*); `:4.1`–`:4.2` theo `dhp383-423:dhp391:1–2` (*Vị nào nơi thân, lời, / và ý không làm điều ác;*) — đây là **Pháp Cú 391** nguyên văn, nghĩa giống hệt, dùng lại được. Ngoài ra `:8.3` = `:9.3` trong chính bài và 3 khoá tiêu đề dùng chung *Jātaka*.
  **Cố ý KHÔNG dùng lại 3 khoá trùng Pāli:** (1) `:6.1`–`:6.2` `Haliddirāgaṁ kapicittaṁ, purisaṁ rāgavirāginaṁ` — đây là **Pháp Cú 232:1–2** nguyên văn, nhưng bản Pháp Cú trong tầng dịch theo nghĩa Pháp Cú (*kẻ có lòng dạ đổi thay như màu nghệ, tâm trí lăng xăng như vượn khỉ, / kẻ sớm say đắm rồi vội vàng ghét bỏ lạnh nhạt*) — hoàn toàn khác bối cảnh Jātaka, nên tôi dịch mới theo nghĩa trong Jātaka. (2) `:2.4` `taṁ me akkhāhi pucchito` — có 4 bản dịch sẵn trong tầng và cả 4 đều đọc lệch hoặc rối (`ja348` *xin cha giải thích khi con hỏi điều này*, `ja386` *được hỏi điều này, xin bạn…*, `ja306` *xin ngài được hỏi…*); tôi dịch rõ *xin hãy nói cho tôi biết điều ấy, tôi hỏi*. (3) `:4.3` `Urasīva patiṭṭhāya` — trong Pháp Cú 391–392 `urasī` nằm trong ẩn dụ *đặt đứa trẻ vào lòng* nên dịch *đáng tin cậy như đứa con nép vào lòng mẹ*, còn ở đây là mệnh lệnh cầu người đối thoại nuôi dưỡng điều tốt trong lòng, nên dịch *đem điều ấy ở trong ngực*.
  **Bất định đã ghi, không bịa:** (1) `:6.1`–`:6.4` — bản Jātaka mượn câu kệ Pháp Cú nhưng dùng ngược lại (nói đừng phụng sự người như thế), nên hai vế `Haliddirāgaṁ kapicittaṁ, purisaṁ rāgavirāginaṁ` phải giữ *nghĩa mô tả* chứ không được phán đoán như Pháp Cú; tôi dịch *Bậc mang sắc vàng như Haliddirāga, nhuốm màu vàng đất, / một kẻ đã vượt khỏi tham dục*. (2) `:2.1`–`:2.4` — bài kệ này chuyển từ lời bậc thiền hiền sang lời thằng bé hỏi cha, nhưng Pāli đã ghim không có phần văn xuôi nào; tôi giữ đúng hai lời thoại tách biệt (1.1–1.4 rồi 2.1–2.4) và dùng *hỡi cha* ở `:2.3` theo `tāta`, không bịa thêm nhân vật. (3) `:1.1` `Sutitikkhaṁ araññamhi` — `Suti` là `suti` + tiền tố `su-`; tôi đọc là “đã quen” nên dịch *Tập quen chịu đựng*, nếu đọc là `sutī` (cái gai) thì phải sửa.
  Thuật ngữ theo tiền lệ đếm được: `tāta` → cha (`dhp` và `mn` dùng *cha*), `isi` → bậc thiền hiền (`mil5.5.5:7.5`), `dhamma` → Chánh pháp, `visuddhakārin` → làm trong sạch (`mn7.1` dùng *trong sạch*), `māyā`/`moha` → mê.
  Lỗi bắt được ở lượt review đối kháng, đã sửa: (1) `:9.1` bản nháp mở thêm ngoặc kép, trong khi lời thoại Pāli đi liền từ `:3.1` đến `:9.4` — đã sửa; (2) `:6.1` bản nháp dịch `kapicitta` là *nhuốm màu son* (son là sơn đỏ, còn `kapi` là đất vàng/bột son nung) — đã sửa thành *nhuốm màu vàng đất*.
