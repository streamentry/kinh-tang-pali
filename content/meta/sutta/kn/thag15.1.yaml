  Phạm vi: đủ 71/71 khoá của bài (4 khoá `:0` tiêu đề, 66 khoá kệ `1.1`–`16.4` và 1 khoá bìa `16.5`), không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã đọc đối chiếu cả 71 cặp Pāli↔Việt, không đọc mẫu.

