  COVERAGE ENGLISH THÔ (do người biên tập tự phán, tra tầng đã ghim, không suy từ tên thư mục). `english-sujato` có tệp cho bài này, cùng 71 khoá ID với Pāli (tập khoá bằng nhau). Trên 67 khoá thân (bỏ `:0`), Sujato có prose ở 66/67 = 0,985; khoá trống duy nhất là `16.5` (dòng bìa `… Aññāsikoṇḍañño thero ….`). Trên mọi 71 khoá: 70/71. Ngưỡng 0,80 đạt theo phép đo thô này. `english-project`: không có tệp cho bài này (không cần lấp). `vietnamese-current`: vắng tại commit đã ghim (bilara chỉ có Pháp Cú), đặc điểm của cả tầng ở `thag`. Bản Việt nguyên bài của sc-data chỉ dùng tra cứu toàn văn, không căn lề theo khoá. Không có entry trong `reference-gaps.yaml`; mẫu số bằng 0 nên cổng không có gì để ghi nhận.

  CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli ở bài này, nên đối chiếu được ở mức khoá. Ở các khối `13`, `14`, `15`, Pāli cắt ngắn `… pe` (`13.2`, `14.2`, `15.2`) và `…` (`13.3`, `14.3`, `15.3`); Sujato bung phần lược thành văn đầy đủ. Bản Việt KHÔNG bung: giữ đúng một `…` ở mỗi khoá, theo tiền lệ `thag14.1:11.2/11.3`, `thag7.1` và `thag5.3`. Lời kệ của Pāli mở nháy kép ở `1.1`, đóng ở `1.4`, mở lại ở `2.1` và đóng ở `16.4`; bản Anh đặt nháy khác (mở thêm ở `7.1` và `8.1`), bản Việt theo Pāli từng khoá chứ không theo bản Anh. Phần đầu bài (`2.1`–`6.4`) và phần sau (`7.1`–`16.4`) nằm trong cùng một lớp nháy của Pāli dù ngôi nói đổi từ đầu bài sang ngôi thứ ba ở `7.1` (nói về Koṇḍañña) rồi lại ngôi thứ nhất từ `13.1`; bản Việt không suy luận ai là người nói.

  NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
    1. Tập khoá: Việt 71 = Pāli 71, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
    2. Nháy kép khớp Pāli từng khoá: 0/71 lệch (`“` ở `1.1`, `2.1`; `”` ở `1.4`, `16.4`; Pāli không có nháy đơn nên Việt cũng 0). Tổng: `“` 2/2, `”` 2/2.
    3. Pāli trùng nguyên văn TRONG CHÍNH bài (bỏ khác biệt dấu câu): 5 nhóm (`3.4`=`4.2`=`5.2`=`6.2`; `4.3`=`5.3`=`6.3`; `4.4`=`5.4`=`6.4`; `13.1`=`14.1`; `13.2`=`14.2`=`15.2`). 4 nhóm dịch giống hệt; 1 nhóm khác: `3.4` dịch khi dùng trí tuệ mà thấy, còn `4.2`/`5.2`/`6.2` dịch khi dùng trí tuệ thấy điều ấy. Cố ý: ở `4.2`–`6.2` điều được thấy là mệnh đề ngay trước (`Sabbe saṅkhārā aniccāti` và hai câu song song), nên điều ấy có tiền ngữ; ở `3.4` không có mệnh đề nào ngay trước làm tân ngữ, thêm điều ấy là thêm nội dung không có trong Pāli. Pāli trùng ở bài khác: tra 107 cặp (Pāli trùng, bản Việt tầng đã có) trên 32 khoá của bài; 49 cặp bản Việt giống bản tôi dùng, 58 cặp khác (đa số vì các bài kia dịch khác nhau giữa chúng, như `dn16:2.3.8`, `thag11.1:8.4`, hoặc khác ngôi `ta`/`tôi`, hoặc khác cách ngắt dòng). Chỗ tôi chủ ý không theo bản đã có: xem mục KHÁC TIỀN LỆ bên dưới.
    4. Dấu lược: Pāli có `…` ở 7 khoá (`13.2`, `13.3`, `14.2`, `14.3`, `15.2`, `15.3`, `16.5`), Việt có đúng 7 khoá đó; `…pe…` đầy đủ 0 và `(…)` trần 0 ở Pāli nên 0 ở Việt. Lỗi = 0/71. Khoá bìa `16.5` giữ hai dấu lược `… Trưởng lão Aññāsikoṇḍañña ….`, kết `….` không khoảng trắng trước theo khuôn dòng bìa của `thag` (xem `thag14.1:14.5`).
    5. Số Pāli: chỉ có một con số trong cả bài, `Soḷasaka` (nhóm tiêu đề `0.2`) = `soḷasa` 16 ⇒ Bộ Mười Sáu Bài Kinh, khớp bản Anh The Book of the Sixteens. Số thứ tự `15` của uid là số quyển trong cách đánh số của kho, không bằng số kệ của tên bộ. Không có số nào khác trong thân kệ.
  Vệ sinh: JSON hợp lệ, 71/71 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa, các từ có dấu Pāli còn trong bản Việt chỉ là tên riêng `Theragāthā` (`0.1`), `Aññāsikoṇḍañña` (`0.4`, `16.5`), `Koṇḍañña` (`7.2`), `Māra` (`8.6`), theo thông lệ của `thag` đã dịch.

  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `saṅkappa` → tư duy (60 khoá, so suy nghĩ 38, ý nghĩ 12). `rāga` → tham (`rāgūpasaṁhita` → gắn liền với tham; mil7.4.5 dịch tham ái, sn8.4:3.4 dịch dục tham; riêng chữ tham chiếm 438/449 khoá có rāga). `mathenti` → làm xao động (`snp1.3:16.2`, `mn82:42.48`). `citra` → cảnh sắc đẹp (`sn1.34:4.1`, `an6.63:8.11`). `pathavimaṇḍala` → cõi đất (`dn21`, `an7.62`).
    · `sabbe saṅkhārā aniccāti` → mọi hành đều vô thường (dhp277:1); `dukkhāti` → mọi hành đều là khổ (dhp278:1); `anattāti` → mọi pháp đều vô ngã (dhp279:1). Hai dòng sau (`yadā paññāya passati`, `atha nibbindati dukkhe`, `esa maggo visuddhiyā`) lấy nguyên văn bản dịch `dhp277`–`dhp279` (3 bài, 3 dòng mỗi bài, bản Việt trùng nhau).
    · `uddhata`/`capala` → xao động / dao động (`mn69:7.2`); `anuddhata` → không xao động. `pāpamitta` → bạn xấu (65 khoá, so bạn ác 4); `kalyāṇamitta` → bạn lành (99 khoá, so bạn tốt 24, thiện hữu 8). `medhāvī` → có trí (28; so sáng suốt 29, bậc trí 27). `nipaka` → sáng suốt (21; so tỉnh giác 9) để tránh trùng `sampajāna` → tỉnh giác. `saṁvutindriya` → các căn được thu thúc (`thu thúc` 3, `chế ngự` 1). `dukkhassantakara` → chấm dứt khổ (131 khoá).
    · `mattaññū` → biết tiết độ (20; so biết đủ 17, biết chừng mực 14, vừa phần 1). `adīnamanasa` → tâm không chán nản, theo `thag3.9:1.4`. `nāga saṅgāmasīsa` → voi giữa trận đánh, theo `thag1.31:1.3`/`thag3.9:2.3`.
    · `tibbanikkama` → tinh tấn mãnh liệt (`sn8.9:3.2`). `buddhānubuddha` → chứng ngộ sau Đức Phật (`sn8.9:3.1`). `pahīnajātimaraṇa` → đã từ bỏ sinh và tử (`an3.57:10.1`). `brahmacariyassa kevalī` → bậc viên mãn của phạm hạnh: `kevalī` dịch viên mãn ở `mn91:33.9`, `sn22.56`, `sn22.57`, `an10.12`; ba bài `an3.57`, `an4.22`, `an5.179` dịch hoàn thành/hoàn tất phạm hạnh. Chọn viên mãn vì đa số và vì giữ được danh từ `kevalī` thay vì biến thành động từ.
    · `tiṇṇo pāraṅgato jhāyī` → đã vượt qua, đến bờ kia, tu thiền (`mn98:11.77`). `mārabandhana` → sự trói buộc của Māra (`sn1.35:4.6` dịch trói buộc của ác ma); `Māra` giữ tên Pāli (113 khoá, so Ác Ma 109, Ma vương 54).
    · `nābhinandāmi maraṇaṁ` → tôi không hoan hỷ với cái chết: Pāli `abhinandati` là hoan hỷ/vui đón. Tầng có 7 khoá bản Việt cho dòng này: `không mong muốn sự chết` 3 khoá (`thag2.38:2.1`, `thag11.1:10.1`, `thag11.1:11.1`), `không hoan hỷ với cái chết` 4 khoá (`mil3.2.4:3.1`, `mil3.2.4:4.1`, `thag14.1:10.1`, `thag14.1:11.1`). Hai phạm vi cho đa số khác nhau (thag riêng: 3 so 2); chọn hoan hỷ theo nghĩa đen của `abhinandati` và theo `thag14.1`, bài kế cận có cùng cấu trúc lược. Ngôi: `thag` đã dịch dùng `tôi` ở 89 tệp, `ta` ở 56 tệp (98 tệp hoà), nên dùng `tôi`; `thag14.1` dùng `ta` nhất quán trong bài đó, hai bài tự nhất quán nhưng khác nhau.
    · `sampajāno patissato` → tỉnh giác và chánh niệm (5 khoá, so tỉnh giác, có niệm 3). `satthā` → Đạo Sư (125 khoá, so Thầy 99). `bhavanetti samūhatā` → sợi dây dẫn đến hữu đã được nhổ bỏ (`dn16:2.3.8`, `thag11.1:8.4`; ngoại lệ `mn86:18.46`, `sn56.21:5.2`). `saddhivihārin` → đệ tử (13/14 khoá).
    · Tên: `Aññāsikoṇḍañña` giữ tên Pāli ở tiêu đề (`0.4`) và dòng bìa (`16.5`), vì mọi tiêu đề `thag` đã dịch giữ tên Pāli; trong thân kệ `Koṇḍañña` (`7.2`). Tầng cũng có `Kiều-trần-như` (`sn8.9`, `sn8.12`, `an1.188`) và `Koṇḍañña` (`sn56.11`, `mn68`, `dn14`), và `ud7.6` giữ `Aññāsikoṇḍañña`; `sn8.9:3.2` có cùng dòng Pāli `koṇḍañño tibbanikkamo` dịch Kiều-trần-như. Tôi giữ Koṇḍañña để trọn bài một cách gọi, theo quy ước `thag`.
    · `Soḷasakanipāta` → Bộ Mười Sáu Bài Kinh, `Paṭhamavagga` → Phẩm Thứ Nhất (109 khoá), `:0.4` theo khuôn Kinh Kệ Của Trưởng Lão X.

  KHÁC TIỀN LỆ — CÓ CHỦ Ý, ĐÃ ĐO.
    (1) `12.4` `sato tatrādhivāsaye`: `thag1.31:1.4` và `thag3.9:2.4` dịch `chánh niệm mà cư trú nơi ấy`. Tôi dịch `chánh niệm mà chịu đựng nơi ấy`. Lý do: `adhivāseti` (các dạng `adhivāsaye`, `adhivāseyya`, `adhivāseti`...) có 61 khoá bản Việt trong tầng: chứa chịu 34 khoá, chịu đựng 25 khoá, nhẫn 12 khoá, kham nhẫn 3 khoá, và 0 khoá dùng cư trú; `ud4.8:19.4` (`Adhivāsaye bhikkhu aduṭṭhacitto`) dịch nhẫn chịu; câu cũng nói về việc bị ruồi muỗi hành hạ, nên nghĩa chịu đựng khớp ngữ cảnh. Hai bài kia còn dòng này: nên cân nhắc sửa, không phải việc của lát này.
    (2) `12.1` `phuṭṭho ḍaṁsehi makasehi`: hai bài kia viết `hàm hạ`, tôi viết `hành hạ`; `hàm hạ` không phải từ tiếng Việt thông dụng và có vẻ là chữ gõ sai của `hành hạ`.
    (3) `11.2` `kiso dhamanisanthato`: `thag3.9:1.2` dịch `thân gầy với gân bị rách rưỡi`. `dhamanisanthata` là gân nổi phủ khắp (mn89:12.2 dịch gân nổi), không phải gân bị rách; tôi dịch `gầy gò, gân nổi chằng chịt`.
    (4) `3.4` khác `4.2`: xem phép kiểm 3.

  KHÁC BIỆT ĐÃ PHÂN XỬ (đối chiếu Sujato).
    (1) `8.1`: `oghapāso daḷhakhilo` là hai danh từ số ít; Sujato dịch ba vật số nhiều (floods, snares, strong posts). Bản Việt giữ hai danh từ số ít, đọc `oghapāso` là hợp từ: cái bẫy của dòng lũ. Cách đọc ogha và pāsa là hai vật riêng chưa loại trừ được (xem bất định).
    (2) `8.4`: `selaṁ` (đá) khác `pabbato` (núi) ở `8.2`; Sujato dịch cả hai là mountain. Bản Việt phân biệt: ngọn núi ở `8.2`, khối đá ở `8.4`.
    (3) `9.1`: `uddhato` Sujato dịch haughty; bản Việt theo tiền lệ xao động (mn69:7.2). `9.4`: `ūmiyā paṭikujjito`, Sujato overcome by a wave; Việt dịch bị sóng che phủ, theo nghĩa phủ lên của `paṭikujjati` ở `mn129:16.6` (che bằng mái sắt).
    (4) `1.2`: `mahārasaṁ` Sujato dịch so full of flavor; Việt dịch có hương vị đậm đà. Tiền lệ duy nhất `thag1.69:1.1` dịch pháp rất ngọt; không theo vì rasa ở đây không nhất thiết là vị ngọt.
    (5) `2.3`: `maññe` dịch dường như (it seems), để không áp một ngôi lên câu mà Pāli không nêu chủ ngữ.
    (6) `13.4`: `nibbisaṁ bhatako yathā` → tựa như người làm thuê chờ lãnh tiền công, nguyên văn `thag11.1:10.4` và `mil3.2.4:3.4`; chữ chờ là động từ của `13.1` được hiểu ngầm.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `8.1` `oghapāso`: hợp từ (bẫy của dòng lũ) hay hai vật (dòng lũ và bẫy). Việt chọn hợp từ. Nếu là hai vật, `8.1` đổi thành `Dòng lũ, bẫy, cây cọc vững chắc,`; chỉ sửa một khoá.
    · `11.1` `kālapabbaṅgasaṅkāso`: `pabbaṅga` là khớp/chi; Sujato và `thag3.9:1.1` đọc là đầu gối (knobbly knees), bản Việt theo cả hai. Chữ `saṅkāsa` (giống như) không hiện trong bản Việt, và cách đọc các khớp đen như đốt sậy không loại trừ được.
    · `1.3`–`1.4` `anupādāya sabbaso`: tuyệt đối thức `anupādāya` có thể bổ nghĩa cho Pháp được thuyết giảng hoặc cho người nghe; bản Việt để câu mở, chỉ viết hoàn toàn không chấp thủ.
    · `2.4` `subhaṁ rāgūpasaṁhitaṁ`: đọc là tính từ của `saṅkappaṁ` (tư duy đẹp đẽ, gắn liền với tham); ở `sn8.4:3.4` cùng dòng này bổ nghĩa cho `nimittaṁ`, không bổ nghĩa cho tư duy.
    · `10.4` `siyā`: dịch có thể (chấm dứt khổ), không biến thành khẳng định.
    · `1.1` `esa`: không dịch riêng (tương đương chỉ định), theo `snp5.19:17.1` (Con càng thêm tịnh tín).

