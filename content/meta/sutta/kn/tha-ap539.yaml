notes: |-
  Dịch trọn 122 khoá (3 khoá tiêu đề :0.x, 117 khoá kệ, khoá lời kết 31.1 và khoá kết 32.1) trực tiếp từ Pāli root; không có bản Anh của Sujato, không có lớp english-project và không có bản Việt hiện hành cho tha-ap539 tại commit đã ghim. Đối chiếu thuật ngữ và công thức với các Ký Sự cùng phẩm và liền kề (tha-ap533, tha-ap537, tha-ap544, tha-ap547, tha-ap550) cùng các bài tha-ap khác có cùng Pāli.
  Tiền lệ đã đo: có 61 khoá (không kể :0.x) mà Pāli, bỏ dấu câu và nháy, trùng nguyên văn với khoá đã dịch ở nơi khác (5.815 cặp đã dò); 56 khoá dùng lại nguyên văn bản đã có, trong đó có Therāpadāna, Đức Chiến Thắng tên Padumuttara (21 so với 1 dạng Bậc Chiến Thắng tên là), Cách đây một trăm ngàn kiếp (4 trong 4), Một trăm ngàn năm (8), là tuổi thọ lúc bấy giờ (6), Ở lại trong chừng ấy thời gian (7), vị ấy đã đưa đông đảo mọi người vượt qua (9 so với 1), Là bậc đầy lòng trắc ẩn từ bi (4 trong 5), Rực rỡ tựa như cột trụ bằng vàng (3), sinh ra trong dòng họ Okkāka (26), tên là Gotama theo dòng ấy (26), sẽ làm bậc Thầy ở thế gian (26), Người kế thừa giáo pháp của Ngài (13), là con ruột, do giáo pháp tạo nên (11 so với 2), cùng với tâm nguyện và chí hướng (39 trong 43), sau khi từ bỏ thân người (23, thêm 3 khoá chỉ khác chữ hoa đầu câu), Các phiền não của ta đã được thiêu rụi (119), ta sống không còn lậu hoặc (121), Thật lành thay sự đến của ta (114), đã làm tròn lời dạy của Đức Phật (492 ở khoá có nháy kép đóng, 153 ở khoá không có), Bốn vô ngại giải (528). Năm khoá khác với tiền lệ: 1.2 (tiền lệ duy nhất là bậc hiền sĩ hiểu biết mọi thế gian; ở đây dùng bậc Mâu-ni cho muni, nhất quán với tha-ap533 và tha-ap544), 7.1 và 26.4 (chỉ đổi ngôi tôi thành ta), 18.1 và 18.3 (xem mục số). Ngôi kể dùng ta: tầng tha-ap có 1.680 khoá chứa ta so với 1.638 chứa tôi; phạm vi tha-ap500 đến tha-ap559 là 253 so với 171; hai bài liền kề trong phẩm (tha-ap533, tha-ap537) đều dùng ta.
  Tên phẩm Kaccāyanavagga dịch Phẩm Kaccāyana (tha-ap533 và tha-ap537). :0.3 trong Pāli bắt đầu bằng số 7 nên bản Việt giữ số theo dạng 7. như tha-ap533 (1.) và tha-ap550 (8.); translationTitle bằng đúng giá trị :0.3. Dạng tên bài: Ký Sự Về Trưởng Lão X theo đa số gần nhất (tha-ap500 đến tha-ap559: 27 so với 14 dạng Bài Kệ Tuyên Ngợ, thêm 1 dạng Tuyên Ngợi); trên toàn tầng tha-ap hai dạng kia lại nhiều hơn (Tuyên Ngợ 227, Tuyên Ngôn 135, Ký Sự 123), hai phạm vi cho hai đa số khác nhau và chữ Tuyên Ngợ có vẻ là lỗi chính tả cần người biên tập phán một lượt cho cả cuốn. Lời kết 31.1 dùng nhóm nói những bài kệ này (số nhiều, theo imā gāthāyo). Khoá 32.1 theo dạng Ký Sự Về Trưởng Lão X, thứ bảy (như tha-ap547:24.1); sattamaṁ là thứ bảy. Bài không có khoá bhāṇavāra nên không có khoá tương ứng 30.2 của tha-ap537. Đệ tử cho sāvaka, nhất quán trong bài (8.1, 9.3, 10.2, 15.4): ở khoá 15.4 hessati satthu sāvako toàn tầng là 8 môn đồ so với 5 đệ tử, phạm vi tha-ap500 đến tha-ap559 là 2 so với 2, nên chọn theo hai bài cùng phẩm (tha-ap533, tha-ap537) và theo nhất quán nội bài.
  Lời thọ ký tương lai (12.1 đến 15.4): bhavissati, hessati và lacchase dịch sẽ làm, sẽ đạt. Khoá 14.1 Satasahassito kappe dùng Sau một trăm ngàn kiếp nữa (theo hướng tha-ap537:10.1); ở tha-ap544, tha-ap547 cùng đoạn thọ ký này dùng Vào một trăm ngàn kiếp nữa (3 khoá), còn tha-ap533:17.1 dùng Vào một trăm ngàn kiếp trước đây cho Pāli kể quá khứ; ở đây hướng tương lai chắc chắn nhờ bhavissati và hessati. Khoá 1.3 Ito satasahassamhi dùng Cách đây một trăm ngàn kiếp (4 trong 4 khoá cùng Pāli), kiếp ở 1.3 còn 1.4 chỉ còn bậc Hữu Nhãn đã xuất hiện như tha-ap544:1.3 và 1.4.
  Dấu lược: ba khoá …pe… (28.2, 29.2, 30.2) giữ đúng một …; không có (…) trần trong Pāli của bài này. Nháy: kép mở ở 1.1 và đóng ở 30.3; nháy đơn mở ở 11.2 và đóng ở 15.4; đều khớp Pāli từng khoá, 0 lệch trên 122 khoá. Đối chiếu 122 khoá với Pāli: đủ khoá, đúng thứ tự, NFC sạch, không khoá rỗng, không khoảng trắng thừa, chữ Pāli trong bản Việt chỉ là tên riêng. Có 4 nhóm Pāli trùng nguyên văn trong chính bài (2.4 và 6.4; 20.4 và 21.4; 28.2, 29.2 và 30.2; 29.3 và 30.3), tổng 6 cặp, 0 cặp lệch; 29.3 và 30.3 chỉ khác nháy đóng, đúng theo Pāli. Đã đọc cặp Pāli với Việt của cả 122 khoá.
  Số Pāli, mỗi phép tính đã kiểm: satasahassa là sata 100 nhân sahassa 1.000 là 100.000, dịch một trăm ngàn ở 1.3 và 14.1; vassasatasahassāni là 100.000 năm (6.1); Ratanānaṭṭhapaññāsaṁ là aṭṭha 8 cộng paññāsa 50 là 58 ratana, giữ đơn vị ratana như bv24:23.1 (Cao bốn mươi ratana) và không quy đổi; bāttiṁsa là ba mươi hai; sattāhaṁ là bảy ngày; tāvatiṁsa là Ba mươi ba; satānaṁ tīṇikkhattuñca là tīṇi 3 nhân sata 100 là ba trăm lần (18.1) và satānaṁ pañcakkhattuñca là pañca 5 nhân 100 là năm trăm lần (18.3), phù hợp tha-ap52:9.1 (Ba trăm lần làm vua trên đất); duve là hai; pañcasīla là năm giới; catasso paṭisambhidā là bốn vô ngại giải. Không có cụm tiṁsakappasahassa nào cần phân xử. Lưu ý ngoài lát (không sửa): cùng Pāli satānaṁ tīṇikkhattuñca và satānaṁ pañcakkhattuñca đã được dịch Cả bảy món báu quý giá và Cũng cả năm món báu quý giá ở tha-ap344:7.1 và 7.3, tha-ap345:3.1 và 3.3, tha-ap375:7.1 và 7.3 (3 bài) và Cũng cả trăm món báu cùng năm món quý ở tha-ap459:6.3; cả bảy lẫn trăm đều không có căn cứ trong Pāli vì tīṇi là ba, nên nên rà lại các khoá đó. Ở khoá của bài này giữ ba trăm lần và năm trăm lần theo Pāli; tiểu từ ca ở 18.1 và 18.3 không dịch riêng.
  Bất định và lựa chọn cần người biên tập lưu ý: (1) asandiṭṭhaṁ ở 27.1 không có tiền lệ trong lớp Pāli đã ghim (0 khoá); dịch sát chữ là điều không hiển nhiên; còn có thể hiểu là không lầm lẫn hoặc chưa tận mắt thấy, tầng hiện có không có chứng cứ phân xử. (2) 4.1 đến 4.4: nirākulaṁ, suññataṁ và vicittaṁ đều là trung tính, Pāli không nêu chủ ngữ nên bản Việt cũng bỏ chủ ngữ; tādibhi dịch những bậc Vững Vàng theo dạng đã có ở 11 khoá có tādino (so với 6 khoá đấng Như Thật). (3) 8.1 đến 9.1: Pāli đặt động từ ṭhapesi ở 9.1; bản Việt đưa đã đặt lên 8.1 để câu xuôi, còn 9.1 là vào vị trí tối thắng (etadagge, 2 tiền lệ vị trí tối thắng); pabhinnamatigocaraṁ ở 8.2 dịch có phạm vi hiểu biết thông suốt và pabhinnā ở 26.3 dịch đã thông suốt, không có tiền lệ trong tầng cho cách đọc này. (4) 12.1: Buddhaseṭṭhassa bhikkhussa hiểu là vị tỳ-kheo của bậc Phật tối thượng, giữ dạng Về … để không đổi thứ tự khoá; nếu hiểu là vị tỳ-kheo hàng đầu của Đức Phật thì cần sửa. (5) 12.3 đến 12.4: các từ ở cách công cụ dịch với (đức tin, bố thí, nghe diệu pháp), chưa nêu quan hệ nhân quả; cāga dịch bố thí theo tiền lệ (3 khoá bố thí so với 1 khoá thí xả trong các khoá đã dò). (6) 16.4 paññāsamāhito dịch có tuệ, định tĩnh, không quyết định quan hệ trong từ ghép; không có tiền lệ. (7) 19.1 padesarajjaṁ dịch Vương quyền cai quản các vùng đất rộng lớn (11 khoá) thay vì Vương quốc rộng lớn ấy (15 khoá) vì sát chữ padesa hơn. (8) 22.2 brahmabandhu dịch thân quyến của Phạm thiên (6 so với 3 khoá dịch người dòng Bà-la-môn); nghĩa chuẩn là người Bà-la-môn theo dòng dõi. (9) 22.3 đến 22.4: vippakule dịch gia tộc Bà-la-môn; paccājāto dịch đã tái sinh; mahaddhane bổ nghĩa cho gia tộc nên đặt ở 22.4 (có tài sản lớn). (10) 23.3 đến 23.4: vinayī sabbasuddhiyā dịch đã điều phục bằng sự thanh tịnh toàn diện; có thể liên hệ ý thanh tịnh cho mọi hạng người trong bài về Assalāyana, không nhập vào lời kinh. (11) 24.3 và 24.4: ācariyo dịch thầy dạy; sārisambhavo dịch vị sinh ra từ bà Sārī (Pāli không nêu tên Sāriputta). (12) 3.3 sampatte dịch đã đến, không thêm ý đi tìm; patiṭṭhapi dịch an lập. (13) 9.3 đến 9.4: sasāvakaṁ jinavaraṁ đặt cho ở 9.3 để đối tượng đứng trước động từ ở 9.4. (14) 5.2 uggato dịch vươn cao thay vì cao vút (như bv24:23.2) để khỏi lặp chữ cao với 5.1.
  Kiểm kỹ thuật chưa chạy trong lượt này: npm run validate, npm test, npm run check và npm run build; vì vậy technical_integrity đặt 9.6 và không tuyên bố technical gate đã pass. Bài chưa có record trong reference-gaps; việc ghi nhận nằm ngoài phạm vi lát này.
