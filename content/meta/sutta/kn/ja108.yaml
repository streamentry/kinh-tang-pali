notes: |-
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc toàn văn trong bối cảnh. Tại commit này tầng english-sujato không có tệp cho bài (đã kiểm trong source/upstream-manifest.json: có Pāli, vắng English — giới hạn của bản chụp upstream, không phải chưa sync), và tầng vietnamese-current chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Đối chiếu thay thế: chú giải Jātaka-aṭṭhakathā (đọc qua palikanon.com, chỉ dùng phần chú nghĩa từng chữ), tóm tắt truyện Cowell/Chalmers để giữ đúng bối cảnh, và truyền thống Việt ngoài kho ở mức ghi nhận cách đọc. Tiêu đề 0.1 Jātaka giữ nguyên (ja1:0.1, ja159:0.1); 0.2 Ekakanipāta → Bộ Một Bài Kinh (ja1:0.2). technical_integrity 10.0 căn cứ chốt _hvi.py đã pass (đủ khoá, NFC, ngoặc cân, không Pāli lọt, khớp dấu lược); repo-wide validate/test/build không chạy theo lệnh cấm của lát.
  0.3 Parosatavagga → Phẩm Hơn Trăm (0 tiền lệ; parosata là hơn một trăm, phẩm gồm các kinh 101–110). 0.4/2.1 giữ tên Bāhiya theo Cowell; chú giải: bāhiyā là người đàn bà quê (bahijanapade jātā saṃvaḍḍhā itthī), nên 1.3 dịch người đàn bà quê mùa ấy (quê mùa 1, mn93:18.15). 1.1 Hãy học (hãy học 51). 1.2 thật lòng muốn học theo chú giải tesu tesu sippesu sacchandā (Chalmers đọc headstrong — đã bỏ qua vì chú giải rõ hơn); bản nháp có chữ vì thêm quan hệ nhân quả, review đã bỏ để giữ nguyên hai vế paratactic như Pāli. 1.3 suhanna = nết khiêm tốn (chú giải: hirottappaṃ appahāya paṭicchannenākārena; Chalmers: by modesty). 1.4 abhirādhayī → đã làm đẹp lòng vua (làm đẹp lòng 17; vua 2015).
