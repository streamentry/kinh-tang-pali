notes: |-
  17 khoá, tất cả đã dịch. Bài thứ 9 của `Upacikāvagga`.

  TẦNG THAM KHẢO — 0/17 có Anh Sujato. Không có bản Việt hiện hành. ⇒ `draft`.

  PĀLI TRÙNG: `0.1`, `0.2`, `0.3` `Upacikāvagga` → *Phẩm Con Mối* (4 tiền lệ), và `2.4`
  `Bhāsitampetaṁ, mahārāja, therena piṇḍolabhāradvājena—` → *Trưởng lão Piṇḍolabhāradvāja đã
  nói:—* (mil7.6.6:1.5, đúng nguyên văn). Ngoài ra `3.1` `Kāye sabhāvaṁ disvāna,` trùng nguyên
  văn với `mil7.3.9:2.3` → *thấy rõ bản chất của thân,* (1 tiền lệ, dùng y hệt).

  `3.1–3.4` là bốn câu kệ quán chiếu thân mà Milinda nêu ở `mil7.3.9`; tôi dùng lại nguyên văn
  cả dòng đầu cho khớp.

  THUẬT NGỮ MỚI (0 tiền lệ): `varāha` → *con lợn* (riêng tên *con lợn* có 2 tiền lệ trong
  tầng); `santattakaṭhite` → *trời nóng nực cháy da*; `sītalāma-tapaṇīta-mettābhāvana` → *chỗ
  mát mẻ, chỗ dịu dàng, chỗ thương mến*; `doṇi` → *vòng* (vòng đất nhỏ); `Ekākiyo adutiyo` →
  *độc tầm, không cùng bạn*.

  BẤT ĐỊNH CHƯA PHÂN XỬ:
  · `mānase kāyaṁ nikkhipitvā ārammaṇantaragatena sayitabbaṁ` (`2.2`). `sayati` ở đây là
    **thụ động** của `sayati` (ngửi), nên nghĩa đen là *được ngửi tới*. Với người hành trì thì đó
    là *thẩm xét*. Tôi dịch *thẩm xét tức cảnh bên trong ấy*; bản nháp đầu ghi *hít vào* theo
    nghĩa đen và đã sửa, vì *hít vào* không đúng nghĩa tu tập mà Pāli cũng không bắt buộc.
    Đây là chỗ chưa tuyệt đối.
  · `cikkhallamudaka` (`2.1`) tôi dịch *chỗ nước nhỏ*; `cikkhalla` có thể là *nước đụng* lẫn *vũng
    nhỏ*. 0 tiền lệ.
  · `āluḷitakhalitavibbhantasantatte` (`1.3`) là bốn trạng thái của tâm bị sân đốt; tôi dịch
    *loạn đảng, khiếp đảng, khổn đau* cùng *bị sân đốt cháy*. Có thể tách rõ hơn thành bốn vế.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.
