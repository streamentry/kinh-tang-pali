notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành của Hòa thượng Thích Minh Châu cho Milindapañha (tầng vietnamese-current ở commit đã ghim chỉ có
  26 tệp Pháp Cú). Vì vậy toàn bộ bài dịch từ Pāli root và triangulation bị hạ xuống 7.0.
  Tiền lệ dùng lại: Milindapañha (34 bài) · Mahāvagga → Đại Phẩm (mil3.1.7, pv48, pv49) ·
  Rājā āha— → Vua nói: · bhante nāgasena → thưa tôn giả Nāgasena · mahārāja → Đại vương ·
  chāyā → bóng (an4.195, mil3.5.8) · pañhapaṭibhānāni → lời giải đáp (mn56:15.2) ·
  acchariyaṁ abbhutaṁ → Thật hy hữu / Thật vi diệu (an4.35, an4.187) · nāgasenā → Nāgasenā giữ dấu nguyên.
  Tiền lệ BẮT BUỘC dùng lại (TIEN_LE_PHAI.md và index tự dựng): khoá 2.1 không có Pāli trùng; nhưng dãy
  Kallosi, bhante nāgasenā xuất hiện ở 25 bài khác và tôi dùng đúng nguyên văn Khéo lắm, thưa tôn giả Nāgasenā.
  Kết quả tự tra: lát này có 52 khoá Pāli trùng nguyên văn với bài khác, đã dùng lại nguyên văn của bài có trước
  cho tất cả, không dịch lần hai ở đâu cả.
  Bất định đã ghi nhận. Kế hoạch sắp sẽ dịch năm thành năm (tiền lệ dn14 dùng năm cho cùng vassāna), vì câu
  hỏi của vua là đếm năm đã sống chứ không phải mùa mưa. Khoá 2.4 và 2.5 dùng pavattati (vận động) cho cả
  bóng lẫn con số bảy: tôi giữ cùng một động từ ở hai vế để đường ví von không bị rạn; nếu biên tập muốn
  phân biệt thì đổi cả hai cùng lúc, đừng sửa lẻ một khoá. Khoá 2.6 visajjitānī tôi đặt trước aticitrāni
  (trọn vẹn, vượt xa sự đo lường) vì câu tiếng Việt tự nhiên hơn; cả hai vị từ đều còn.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0. Nháy kép: một cặp ở 1.1 và một cặp ở 2.3-2.6, cân trên cả bài.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá (kiểm() chỉ quét khoá Pāli ≥40 ký tự):
  đủ khoá, đúng ID, NFC, không trùng Pāli, dấu lược khớp, nháy kép cân, không có (…) trống, không có Pāli lọt.
  Đợt này cấm chạy npm run validate, test, check, build nên không tuyên bố technical gate pass; bốn lệnh đó
  để người điều phối chạy, technical_integrity hạ xuống 9.8.
