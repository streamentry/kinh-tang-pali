notes: |-
  Dịch trực tiếp từ Pāli root tại commit bilara đã ghim (11c9d708978cde8ba61096d8a75f7ddfb846f639, khoá dựng từ tiền tố pre của lát, không phải từ uid).
  Tầng Anh đã ghim không có bài nào trong thư viện Milindapañha, tầng Việt hiện hành chỉ có Pháp Cú, lớp lấp english-project không có ⇒ dịch một tầng, nên triangulation bị chặn.
  Văn xưng theo mil đã merge: Thưa Đại đức Nāgasena (7 tệp) và Tâu Đại vương (chữ hoa ở đầu câu, chữ thường sau); Thế Tôn cho bhagavā, Trưởng lão cho thera, Đấng Chiến Thắng cho buddha khi tán dương.
  `Nippapañcavagga` dịch Phẩm Năm Điều Đã Vứt Bỏ theo đa số đã merge trong chính quyển này (mil6.2.4, .6, .7, .8, .9, .10 — 6 tệp; chỉ mil6.2.2 dùng cách khác), để không tạo thêm một biến thể nữa. Thân bài tôi dịch `nippapañca` là điều phải từ bỏ, nên hai cách vẫn cùng nghĩa.
  ⚠ Bất định có nghĩa đáng kể, đã phân xử và ghi lại: thuật ngữ `nippapañca` mang chữ năm (pañca) nhưng lời giải trong `1.3` chỉ liệt kê BỐN món — quả vị nhập lưu, một lần quy vị, không quy vị, A-la-hán — và mỗi món lại được gọi là một `nippapañca`. Tôi dịch theo đúng danh sách Pāli, không thêm món thứ năm và không giải thích trong thân kinh. Người điều phối nên tra chú giải Pali và đánh dấu quyết định này trước khi xuất bản.
  0 tiền lệ, đặt mới có lý do: `sabhāvaparisuddhā` → thanh tịnh tự tánh (1 tiền lệ ở mil7.4.2); `ekacittakkhaṇa` → một khoảnh khắc tâm; `vatipākāra` → làm đồng (đồng ruộng sẵn để nhổ cây); `dhaññatthāya` → để lấy cây; `nisseṇi` → thang; `sāmaññatthamabhisādhenti` → chứng ngộ thân phận sa-môn (1 tiền lệ, mn39 và sn36.27 dùng mục tiêu/thân phận của đời sa-môn); `anusāsanena karaṇīyaṁ` → việc đáng làm bằng lời dạy; `upacitakusalamūlo paññā` → trí tuệ đã tích lũy từ gốc rễ thiện xảo.
  Danh sách `uddisanti paripucchanti suttaṁ geyyaṁ veyyākaraṇaṁ gāthaṁ udānaṁ itivuttakaṁ jātakaṁ abbhutadhammaṁ vedallaṁ` xuất hiện nguyên văn hai lần (`2.1` và `3.1`); tôi dịch giống hệt nhau: kinh, luận, tụng, ngôn, tích dẫn, truyện, pháp lạ, pháp hội.
  Sáu vế trong `7.1` và `7.3` lặp nguyên văn nhau; dịch giống hệt.
  Pāli trùng nguyên văn: `“Bhante nāgasena, bhāsitampetaṁ bhagavatā—` (10 lần toàn kho) — dịch lại y nguyên.
  technical_integrity 9.6 vì agent lát này không chạy gate. Bốn lệnh gate do coordinator chạy trước khi publish: npm run validate, npm test, npm run check, npm run build.
