notes: |-
  Đợt 19, làn 49. Dịch từ Pāli root commit đã ghim, đủ 67/67 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài toàn kệ (không có văn xuôi dẫn truyện trong tầng Pāli đã ghim).

  **Tầng tham khảo.** `source/upstream-manifest.json` chỉ liệt kê `kn/ja/ja422_root-pli-ms.json` (tầng Pāli) cho uid này: không có tệp `english-sujato` nào cho `ja422` (tầng Sujato có 83 bài Jātaka, không gồm bài này), `english-project` 0 tệp, `vietnamese-current` chỉ có Pháp Cú. Đây là `not-published-upstream`, không phải `not-synced`. Ba tầng đều vắng ⇒ bài chỉ dịch từ Pāli root và đối chiếu tiền lệ nội bộ ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker `noEnglishEditionUpstream`. Tôi không đụng `content/meta/reference-gaps.yaml`.

  **Coverage English:** mẫu số = 0. Khoá Pāli dài nhất sau khi nén khoảng trắng chỉ 25 ký tự (< 40); 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*.

  **Tiêu đề và khung.**
  - `0.2` “Bộ Tám Bài Kệ”: tầng có 9/9 bài Jātaka `Aṭṭhakanipāta` dùng đúng dạng này.
  - `0.3` “Phẩm Kaccānivagga”: 9/9 bài cùng phẩm dùng đúng dạng này.
  - `0.4` “6. Kinh Cetiyajātaka” và `16.1` “Kinh Cetiyajātaka, thứ sáu.”: trong cùng phẩm, 5 bài giữ “jātaka” trong tên (`ja418`, `ja423`, `ja424`, `ja425`, `ja426`) và 4 bài bỏ (`ja417`, `ja419`, `ja420`, `ja421`); chọn dạng giữ “jātaka” vì khớp ba bài liền kề `ja423`–`ja425`. Số thứ tự 6 khớp `chaṭṭhaṁ` ở `16.1`, nằm giữa `ja421` (thứ năm) và `ja423` (thứ bảy).

  **Số Pāli:** bài này không có số lượng nào cần tính; chỉ có số thứ tự `6.` / `chaṭṭhaṁ` = thứ sáu (khớp nhau).

  **Năm phép kiểm (có mẫu số).**
  1. Tập khoá: Việt 67 = Pāli 67, thứ tự khoá trùng thứ tự Pāli.
  2. Nháy: Pāli có 2 dấu mở “ (ở `1.1`, `14.1`) và 2 dấu đóng ” (ở `13.4`, `15.4`), 0 nháy đơn; Việt khớp từng khoá, lệch 0/67.
  3. Pāli trùng nguyên văn trong chính bài: 6 nhóm, 27 cặp (ví dụ `3.1`, `5.1`, `7.1`, `9.1`, `11.1`, `13.1`; `2.5`, `4.3`, `6.3`, `8.3`, `10.3`, `12.3`; `7.4`, `9.4`, `11.4`); bản Việt khác ở 0 cặp. `13.4` khác `7.4`/`9.4`/`11.4` chỉ ở dấu nháy đóng, và Pāli cũng khác đúng chỗ đó.
  4. Dấu lược: Pāli 0 `…`, 0 `(…)`; Việt 0 `…`. Không có chỗ nào cần giữ `(…)`.
  5. Số Pāli: không có (xem trên). NFC đạt, 0 khoá rỗng, 0 khoảng trắng thừa, 0 Pāli lọt sang bản Việt ngoài tên riêng.

  **Tiền lệ dùng lại và chỗ cố ý khác (đã dò toàn tầng).** Dò 63 khoá không phải tiêu đề: 3 khoá Pāli trùng nguyên văn với khoá ở bài khác, 3 cặp, bản Việt khác ở cả 3:
  - `4.2` `kāle tassa na vassati;` ≈ `ja194:2.2` (“đúng mùa thì lại không mưa cho hắn;”): bài này dùng “kẻ ấy” thống nhất cả bài thay cho “hắn” và không thêm “lại” (Pāli không có từ đối ứng).
  - `15.1` `Tasmā hi chandāgamanaṁ,` ≈ `ja213:2.1` (“kẻ đi đâu cũng theo ý riêng”) và `15.3` `Aduṭṭhacitto bhāseyya,` ≈ `ja213:2.3` (“Ai tâm không chu đáo mà nói”): tôi **cố ý không dùng lại** vì hai cách dịch của `ja213` không bám Pāli: `chandāgamana` là dạng cùng gốc với `chandāgati` (18 khoá chứa hai dạng này; 6 khoá dịch “thiên vị”/“thiên lệch”, 8 khoá có “ái dục”, ví dụ `dn31:5.2`, `dn33:1.11.128`, `an4.17:1.3`), còn `aduṭṭhacitto` ở `an8.1:4.1`, `iti27:7.1`, `ud4.8:19.4` là “tâm không sân” (3 khoá) so với 1 khoá `ja213:2.3` “không chu đáo”. Ghi cho người điều phối: `ja213:2.1` và `ja213:2.3` (ngoài lát này) có thể cần xem lại; tôi không sửa.
  - `15.4` (`saccūpasaṁhita`) khác chính tả với `ja213:2.4` (`saccupasaṁhita`), không phải cặp trùng; dùng “gắn với sự thật” theo `ja198:2.2` (“gắn với sự thật”) và `ja213:2.4` (“gắn với chân thật”).

  **Thuật ngữ, đã đo.**
  - `isi` (14.1) → “ẩn sĩ”: trong 107 khoá chứa dạng `isi…`, 56 khoá có “ẩn sĩ”, 26 có “tiên”, 5 “tiên nhân”, 2 “đạo sĩ”.
  - `antalikkhacara` (14.2) → “đi trong hư không”: 10/10 khoá chứa `antalikkhacar…` dùng “hư không”.
  - `devatā` (2.2) → “chư thiên”: 252/662 khoá chứa `devatā` (còn lại phần lớn “vị trời” 33, “chư thần” 9).
  - `disodisaṁ` (12.2) → “khắp các phương”: 14/17 khoá chứa dạng này (ví dụ `dn32:7.14`, `thag12.1:8.4`).
  - `disampati` (6.2, 8.2): ở hô cách, không phải tên riêng. Tầng dùng “Disampati” như tên vua ở `dn19` (13 khoá) nhưng hô cách `disampati` ở `ja351:5.2` và `ja452:10.2` đều là “hỡi đấng chúa tể bốn phương”, `ja332:4.2` “tâu đấng chúa tể muôn dân”, `sn3.16:4.2` “bậc lãnh đạo các phương”; chọn dạng 2 khoá `ja351`/`ja452`.
  - `viyākare` (2.6…) → “trả lời”: tầng chỉ có 3 khoá chứa `viyākar…` (`snp5.5:4.5`, `snp5.7:7.3`, `snp5.13:2.3`), đều dịch “giải thích” cho động từ ra lệnh; ở đây tân ngữ là `pañha` (câu hỏi) nên dùng “trả lời”. 0 tiền lệ cho dạng này.
  - `dhamma` (1.1–1.4) → “pháp”: cùng cách với `ja447:11.1` (`Dhammo have rakkhati dhammacāriṁ` → “Pháp hộ trì người thực hành Chánh pháp”). `hanti`/`hane`/`hato` → “hủy hoại” (không có tiền lệ cho bộ ba này, 0 khoá; `ja194:2.4` dịch `hato` là “hủy diệt”).
  - `bhiyyo pavisa` (7.4…): 0 tiền lệ; `pavisa` → “chìm” ở 5.4, 7.4 và `pāvekkhi` ở 14.3 để ba chỗ cùng một động từ Pāli có cùng một cách dịch.
  - `pūtika`, `hīnatto`, `patva pariyāyaṁ`, `sakaṭṭhānā`: 0 tiền lệ nguyên dạng trong tầng (`hīnatt…` 0 khoá).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `Puttā tassa na bhavanti, pakkamanti disodisaṁ` (12.1–12.2): đọc sát chữ `na bhavanti` là “không có/không còn là”, nhưng `10.1`–`10.2` đã nói con trai không sinh ra, còn `12.2` nói “chúng bỏ đi khắp các phương”; tôi đọc `na bhavanti` là “chẳng còn ở lại” (ít giả định nhất để hai vế cùng đứng được). Cách đọc khác: “kẻ ấy không có (con) trai” và `pakkamanti` có chủ ngữ khác.
  2. `cecco` (14.3) và `cetiya` (3.4, 5.4, 7.4, 9.4, 11.4, 13.4): giữ hai dạng tách bạch (“Cecca”, “Cetiya”) và không khẳng định chúng là một danh xưng; có thể `cecco` là dạng của cùng tên (người xứ Cetiya), nhưng tầng Pāli đã ghim không có văn xuôi để xác nhận.
  3. `hīnatto patva pariyāyaṁ` (14.4): đọc `hīnatta` = `hīna` + `atta` → “thân phận sa sút”, `pariyāyaṁ` → “lượt (của mình)”. Cách đọc khác: `pariyāya` là “giai đoạn/vòng (của nghiệp)” (“khi đã tới giai đoạn của mình, thân phận sa sút”). `pariyāya` có 109 khoá trong tầng nhưng chủ yếu là “pháp môn/phương pháp”, không giúp phân xử ở đây.
  4. `Pūtikañca mukhaṁ vāti, sakaṭṭhānā ca dhaṁsati` (2.3–2.4): đọc “miệng bốc mùi thối rữa” và “rơi khỏi vị trí của mình”; `ṭhāna` ở đây có thể là chỗ đứng (nghĩa đen, trên hư không) hoặc địa vị; chọn “vị trí” để mở cả hai. `dhaṁsati` trong tầng dịch không đồng nhất (“tan rã”, “sa sút”, “phá hoại”, “rơi”, ví dụ `an4.61:10.3`, `an7.64:5.5`, `ja396:1.4`).
  5. `hanti kiñcanaṁ` (1.2): `hanti` cần tân ngữ nên dịch “chẳng hủy hoại ai”; `kiñcanaṁ` cũng có thể là “bất cứ điều gì”. `have` (1.1) → “quả thật”.
  6. Đại từ và xưng hô: `tvaṁ` (1.4), `bhaṇasi`/`bhāsase` (3.1, 3.3…) → “ngài”. Không có văn xuôi trong tầng Pāli nên không xác định được người nói; nếu người nói là ẩn sĩ nguyền rủa vua hay vị trời, cách xưng hô có thể khác. Hô cách `rāja` → “hỡi vua”.
  7. Người nói: dấu nháy kép thứ nhất bao `1.1`–`13.4` (lời răn và lời nguyền, hai ngôi), dấu nháy thứ hai bao `14.1`–`15.4` (nói về vua ở ngôi thứ ba rồi nêu bài học). Chỉ suy từ nội dung, không thêm vào thân kinh.

  **technical_integrity = 9,6:** lát này cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  **Lượt cải thiện 2026-10-11** (đọc đối kháng đủ 67/67 cặp Pāli↔Việt; điểm 10 tiêu chí giữ nguyên, `final_score` 9,00).
  - **Khoá đổi: 1/67.** `6.1` `Jivhā tassa dvidhā hoti` “Lưỡi của kẻ ấy trở thành hai nhánh,” → “Lưỡi của kẻ ấy chẻ làm hai,” (clarity fix, không đổi nghĩa): “hai nhánh” là calque của `dvidhā`; “làm hai” là cách tầng đã dùng cho `dvidhā` (`dn23:21.30`, `dn23:21.44`, `dn23:23.9`, `dn23:23.11` đều “làm hai”) và “chẻ” có tiền lệ ở chính `dn23:21.30`.
  - **Đã thử và hoàn tác:** `1.4` bỏ “phải” (“đừng để pháp bị hủy hoại hủy hoại ngài”) cho sát Pāli hơn, nhưng hai “hủy hoại” liền nhau đọc vấp hơn bản cũ, nên giữ “phải hủy hoại ngài”.
  - **Không điểm nào nâng.** Lý do: (1) `triangulation` 7,0 bị chặn bởi việc không có tầng English/Việt hiện hành; các tiền lệ nội bộ tôi vừa dò thêm là bản dịch của chính dự án, không phải nguồn độc lập; (2) `semantic_fidelity`, `grammar_logic`, `ambiguity_integrity` còn các bất định thật (xem mục BẤT ĐỊNH, nhất là 1, 3, 4) mà tầng đã ghim không phân xử được; (3) sửa một khoá trong 67 khoá không đủ để nâng `vietnamese_clarity` một cách bảo vệ được, vì điệp khúc `kẻ nào, biết mà khi được hỏi câu hỏi, lại trả lời khác đi` (6 lần) và `thân phận sa sút khi đến lượt của mình` (14.4) vẫn hơi gượng nhưng bám Pāli và khớp tiền lệ.
  - **Đính chính phần dò trùng ở trên.** Dò lại toàn tầng bằng so khớp Pāli sau khi bỏ dấu câu: các cặp trùng *trong chính bài* là 6 nhóm, **78 cặp** (5 nhóm 6 khoá = 75 cặp, cộng nhóm `7.4`/`9.4`/`11.4` = 3 cặp), bản Việt khác ở 0 cặp; con số “27 cặp” ở mục Năm phép kiểm là đếm thiếu. Với các bài khác, Pāli trùng ở 8 khoá (`4.1`, `4.2`, `12.2`, `14.2`, `14.3`, `15.1`, `15.2`, `15.3`), tổng 12 cặp, không phải 3: 6 cặp bản Việt trùng nguyên văn (`14.2`, `14.3`, `15.1`, `15.2`, `15.3` với `ja530:30.2`, `30.3`, `31.1`, `31.2`, `31.3`; `15.2` còn trùng `pv21:45.2`), 6 cặp khác có chủ ý (`4.1`, `4.2` với `ja194:2.1`, `2.2`; `12.2` với `pv26:6.4`; `15.1`, `15.2`, `15.3` với `ja213:2.1`, `2.2`, `2.3`).
  - **Song song `ja530:30–31` (bản dịch của chính dự án, không phải nguồn độc lập):** `14.2`–`15.4` trùng Pāli với `ja530:30.2`–`31.4` (`14.4` chỉ khác `patva pariyāyaṁ` / `pattapariyāyaṁ`, `15.4` chỉ khác dấu nháy và `nti`) và bản Việt đã khớp từng chữ: “xưa kia từng đi trong hư không”, “Cecca đã chìm vào đất”, “thân phận sa sút khi đến lượt của mình”, “Vì thế, việc thiên vị vì ưa thích”, “nên nói với tâm không ác ý”, “lời nói gắn với sự thật”. Ở `ja530:30.1` câu tương ứng với `14.1` là `Athāyaṁ isinā satto` (“bị ẩn sĩ nguyền rủa”), cùng cách hiểu `satto`. Trong `ja530:27–31` `cecco` đứng cùng các vua bị nguyền rủa (Sahassabāhu, Daṇḍakī, Majjha), nên `cecco` là một vị vua; điều này củng cố rằng `14.3` nói về chính vị vua chìm vào đất ở `3.4`–`13.4`, nhưng không phân xử được việc `cecco` và `cetiya` có phải cùng một danh xưng hay không (BẤT ĐỊNH 2 giữ nguyên).
  - **Đính chính ghi chú thuật ngữ:** ở mục Thuật ngữ, câu về `aduṭṭhacitto` chỉ nêu `an8.1`, `iti27`, `ud4.8` và `ja213`, bỏ sót tiền lệ trùng Pāli nguyên văn gần nhất là `ja530:31.3` (“nên nói với tâm không ác ý”, đúng cách bài này dùng); các tiền lệ khác của `aduṭṭhacitt…` trong tầng gồm `an7.63:11.2` “tâm không hiểm ác”, `ud4.8:19.4` “tâm không sân”, `ja514:28.2` “với tâm không sân hận”. `dvidhā`, `dhaṁsati` (`ja534:65.3` “rơi khỏi cả hai cõi”, cùng nghĩa “rơi khỏi” với `2.4`), `pūtika… vāti` (`thi-ap25:48.3` “bốc mùi hôi hám, thối rữa”, `ja530:49.3` “bốc mùi xác chết thối”) cũng đã dò: `2.3`–`2.4` khớp tiền lệ.
  - **Quyết định không đổi dù nghi ngờ:** `1.1` “sẽ hủy hoại” (thêm “sẽ” so với hiện tại gnomic của `hanti`, lệch nhẹ với `1.2` không có “sẽ”; để nguyên vì bỏ “sẽ” làm câu cụt hơn); `12.1` “chẳng còn ở lại” (BẤT ĐỊNH 1; `na bhavanti` ở `dhp95:4` “không còn”, `ud4.7:4.3` “không có” cho thấy cách đọc “không có (con trai)” cũng đứng được, nên chưa thể phân xử); `12.2` “chúng bỏ đi khắp các phương” khác `pv26:6.4` “tản ra khắp các phương” có chủ ý (chủ ngữ ở `pv26` là ngạ quỷ đi tìm thức ăn, ở đây là các con trai rời nhà).
  - **Bốn lệnh còn lại** (`npm run validate` · `npm test` · `npm run check` · `npm run build`) vẫn do người điều phối chạy; `technical_integrity` giữ 9,6.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 10 khoá chênh lệch lớn nhất (đọc thêm đối kháng cả 67 cặp Pāli↔Việt) → khác nghĩa 1: sửa 0, giữ 0, bất định 1 (`12.1` `Puttā tassa na bhavanti`: bản mù *kẻ ấy không có con trai*, bản dự án *chẳng còn ở lại*; hai cách đọc đã ghi ở BẤT ĐỊNH 1, bản mù để `pakkamanti` làm vế riêng nên không giải được mâu thuẫn với `10.1`–`10.2`; giữ cách đọc ít giả định hơn). `14.4` `hīnatto patva pariyāyaṁ` bản mù cũng ghi không chắc (BẤT ĐỊNH 3), hai bản cùng chọn *sa sút … đến lượt (của mình)*. Còn lại chỉ khác diễn đạt (tên phần, `4.2` *đến mùa lại không mưa* so với *đúng mùa thì mưa chẳng xuống*, `15.1` `chandāgamanaṁ`). Sửa 2 khoá ngoài danh sách chênh lệch, do rà đối kháng: `6.2`, `8.2` `disampati` *hỡi đấng chúa tể bốn phương* → *hỡi chúa tể các phương* (terminology fix: Pāli không có số *bốn*; hiện `ja332:4.2`, `ja351:5.2`, `ja452:10.2` đều *hỡi chúa tể các phương*; mục thuật ngữ ở trên ghi `ja351`/`ja452` là *bốn phương* đã lệch so với tầng hiện tại, nay đính chính). Không có bản Anh hay bản Việt độc lập khác.
