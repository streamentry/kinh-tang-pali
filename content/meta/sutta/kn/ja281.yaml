  điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp (6.6) vì không có
  tầng tham khảo nào.

  Lượt cải thiện 2026-10-11: đọc đối kháng lại từng khoá, đo tiền lệ trên tầng, sửa 10/17
  khoá (1.1, 1.2, 2.1, 2.2, 2.3, 2.4, 3.1, 3.2, 3.3, 3.4). Phần ghi chú cũ ở trên là lịch sử;
  chỗ nào mâu thuẫn với mục này thì mục này thắng.
  (a) 3.4 `labhamāno bhavāmahan”ti` — SỬA SAI NGHĨA. `bhavāmahaṁ` là `bhavāmi` + `ahaṁ`, ngôi
  thứ nhất số ít, nên Pāli nói "tôi là người nhận được". Bản trước dịch "chính là kẻ được
  nhận, bạch ngài": mất chủ thể "tôi" và thêm "bạch ngài" mà Pāli không có từ xưng hô nào.
  Nay: "tôi là người nhận được". Điều bất định cũ của ghi chú (ngôi một sẽ đảo chủ thể câu
  trước) không đứng vững: hình thái động từ phân xử được, không cần dựa vào chú giải.
  (b) 2.1 `bhadde mahesīsi` — "Bà nương, ngài cũng là đại quốc phi tận" có "tận" vô nghĩa và
  đổi ngôi bà/ngài/bà/ngài trong cùng một lời xưng hô. Nay "Hỡi hiền nữ, nàng cũng là hoàng
  hậu": `bhadde` → "hỡi hiền nữ" khớp ja489, ja519, ja523, ja535 (vv34 cũng vậy); `mahesī` →
  "hoàng hậu" ở 7 khoá (dn3, mn51, mn94, an4.198, an10.45, ja489, ja544), "chánh hậu" ở 3
  (ja514, ja524, cp9). 2.2 `patino` → "chồng" khớp ja519, ja537, vv32 (bản trước đổi thành
  "vua"); 2.2 và 2.3 chuyển sang "nàng" cho cùng ngôi xưng hô.
  (c) 1.1 và 2.4 — bỏ "xoài" khỏi lời kệ. Pāli chỉ nói `dumo` (cây) và `abbhantaraṁ phalaṁ`;
  "xoài" chỉ có ở chú giải, mà quy tắc của kho cấm nhập nội dung chú giải vào lời kinh. Tên
  bài (0.4, 4.1, translationTitle) GIỮ "Kinh Xoài Abbhantara" như đã ghi ở mục TÊN BÀI, vì
  tiêu đề là cách đặt tên của biên tập (ja429 cũng đặt tên theo khuôn Xoài).
  (d) 3.1 `Bhatturatthe parakkanto` — Pāli trùng với ja533:45.3 (đã dịch "dốc sức vì lợi ích
  của chủ"); bản trước viết khác ("vì chủ nhân mà ra sức"). Nay dùng lại cách đã có. Đây là
  cặp Pāli trùng duy nhất của phần thân kệ trong toàn tầng sau khi chuẩn hoá dấu câu và hoa
  thường: 1 cặp đã dò, 1 cặp trước đó bản Việt khác, nay khớp. Bỏ "Người nào": Pāli chỉ có
  quan hệ `yaṁ` ở `ṭhānaṁ`, không có `yo` ở chủ ngữ.
  (e) 3.3 `attapariccāgī` → "xả thân" thay "tự hy sinh": `pariccāga` ở tầng dịch là "xả bỏ/từ
  bỏ" (cp12, cnd7, an2.144 …), không có tiền lệ "hy sinh". 3.2 `ṭhānaṁ` → "vị trí" thay "nơi":
  `ṭhāna` ở đây là vị trí/cảnh, chưa có chỗ nào của tầng để đo, nên chọn từ trung tính.
  (f) 1.2 thêm `idaṁ` (quả "này"), bỏ chữ "quả" thừa.
