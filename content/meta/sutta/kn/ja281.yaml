  triangulation 6.6 (vẫn không có bản Anh độc lập đã ghim), technical_integrity 9.6.
  final_score 9.00 → 9.12.
  Nguồn tham khảo ngoài kho: một bản dịch tiếng Anh đã công bố của chú giải Jātaka, đọc để
  biết người nói từng vế (vế 1–2: Sakka nói với hoàng hậu; vế 3: con vẹt nói với các la-sát
  đang bắt nó) và cách chú giải hiểu `labhamāno`, `attapariccāgī`, `mahesī`. Đó là tài liệu
  hậu kỳ, không phải tầng Pāli hay tầng Anh đã ghim, nên chỉ dùng làm từ điển và bối cảnh;
  không câu chữ nào được chép vào bản dịch.
  BẤT ĐỊNH CÒN LẠI (không đổi thân kinh): (1) chủ ngữ của `adhigacchati` ở 3.2 là `parakkanto`
  bỏ lửng qua hai vế; bản Việt giữ cấu trúc bỏ lửng đó ("người ấy" là chủ ngữ ngầm, chưa gọi
  tên). (2) Lời kệ không có từ xưng hô nên người nói vế 3 chỉ rõ nhờ chú giải; bản dịch không
  thêm từ nào. (3) `dohaḷinī` ở 1.3 giữ "mang thai" như ja292:2.1 và ja532:75.3; sắc thái
  thèm nghén của từ chưa vào lời Việt (ja514 và tha-ap551 dịch riêng `dohaḷa` là "thèm"). (4)
  Cụm "xoài" ở tên bài chỉ dựa vào chú giải.
