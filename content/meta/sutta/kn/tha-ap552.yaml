notes: |-
  Dịch từ Pāli root, 173 khoá, đủ khoá, đúng thứ tự Pāli; không có tầng tham khảo tiếng Anh hay tiếng Việt cho bài này nên triangulation chỉ dựa vào Pāli, các bài kệ trùng nguyên văn trong tầng Việt đã dịch (tha-ap544, tha-ap551, tha-ap502, thi-ap40, mil7.5.1 và nhiều tha-ap khác) và ngữ cảnh Therāpadāna.
  Tên bài (khoá 0.3) lấy đúng giá trị translationTitle: Pāli 0.3 là Cūḷasugandhattheraapadāna, không bắt đầu bằng số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số). Kiểu tên: ở phạm vi tha-ap500 đến tha-ap600 Ký Sự Về chiếm 39, Bài Kệ Tuyên Ngợ 16; toàn tầng tha-ap thì Bài Kệ Tuyên Ngợ 255, Bài Kệ Tuyên Ngôn 138, Ký Sự Về 139. Hai phạm vi cho hai đa số khác nhau; theo phạm vi gần nhất và các bài cùng phẩm tha-ap544, tha-ap551 thì dùng Ký Sự Về. Chữ Tuyên Ngợ không dùng vì chưa rõ gốc, vấn đề đó để biên tập phán một lượt cho cả cuốn.
  Khoá 0.2 Bhaddiyavagga dịch Phẩm Bhaddiya (7 khoá của tầng, đều Phẩm Bhaddiya). Khoá 38.1 dùng công thức Tôi nghe như vầy ... đã nói những bài kệ này (nhóm số nhiều, theo imā gāthāyo). Khoá 39.1 dùng Ký sự về Trưởng lão X, thứ mười, cùng dạng với colophon của tha-ap544, tha-ap551 trong cùng phẩm. Khoá 40.1 Phẩm Bhaddiya là phẩm thứ năm mươi lăm theo tha-ap563:20.1 (Phẩm Yasa là phẩm thứ năm mươi sáu); pañcapaññāsa là 5 cộng 50 bằng 55. Khoá 41.1 Tassuddānaṁ dịch Tóm tắt phẩm này: (tha-ap toàn tầng 41 khoá so với Tóm lược: 9 khoá; ở phạm vi tha-ap500 đến tha-ap600 là 5 trên 5; toàn kn Tóm lược: 81 khoá so với Tóm tắt phẩm này: 38 khoá). Khoá 44.1 dùng Và tóm lược các phẩm: (12 khoá của tầng so với 1).
  Số Pāli: bāttiṁsa (2.2) và dvattiṁsa (7.1) là 2 cộng 30 bằng 32, dịch ba mươi hai tướng (22 khoá của kn viết ba mươi hai tướng). tāvatiṁsa (25.4) dịch cõi trời Ba mươi ba theo quy ước tầng (29 trong 31 khoá cùng Pāli ở các bài khác dùng Ba mươi ba kể cả viết hoa, 2 khoá dùng Đạo Lợi; tiṁsa là 30, tāva cộng 33 như tầng đã dùng). sataraṁsī (8.4) là sata 100 cộng raṁsi tia sáng, dịch trăm tia sáng. catujjātena (21.3) là bốn loại hương. māse aṭṭha dinesvahaṁ (21.4) là tám ngày mỗi tháng (aṭṭha 8, dinesu số nhiều định vị). paṭhame yobbane (30.2) là tuổi thanh xuân đầu tiên. caturo dhamme (32.3) là bốn pháp. Paṭisambhidā catasso (37.1) là Bốn vô ngại giải (catasso là bốn). dasamaṁ (39.1) thứ mười. Phần uddāna: tīṇi gāthāsatā (43.3) là 3 nhân 100 bằng 300 và soḷasā (43.4) là 16, nên ba trăm cộng mười sáu bài (316); navagāthāsatānīha (46.1) là 9 nhân 100 bằng 900 và caturāsīti (46.2) là 84; pañcasataṁ sapaññāsaṁ (46.3) là 500 cộng 50 bằng 550, dịch năm trăm cộng năm mươi (550 ký sự); chasahassāni (47.2) là 6 nhân 1000 bằng 6000, dvesatāni (47.3) là 200, aṭṭhārasa (47.4) là 18, tổng 6.218 nếu cộng ba dòng này. Các số 900 và 84 ở 46.1 và 46.2 không khớp với tổng 6.218 ở 47 nếu cộng thẳng; chưa xác lập được các số này đếm cái gì, nên chỉ dịch từng số đúng như Pāli và không cộng hay diễn giải. Bài không có cụm Tiṁsakappasahassa và không có số kiếp nào, nên không có bất định số lượng nào phải phán; chữ kiếp duy nhất là kappe ở 1.1 (hiền kiếp).
  Ngôi kể: tôi cho người kể suốt bài, kể cả các câu chuẩn; ở công thức Kilesā jhāpitā mayhaṁ đa số tầng dùng ta (105 trên 167 khoá cùng Pāli, 50 khoá có tôi), Svāgataṁ vata me āsi cũng đa số ta (100 trên 160) nhưng nhóm dùng tôi đã có và các bài cùng phẩm tha-ap544, tha-ap547, tha-ap548, tha-ap549, tha-ap551 đều dùng tôi và Thật là sự đón tiếp tốt lành cho tôi; chọn tôi để nhất quán. Khoá 25.4 tāvatiṁsamagacchahaṁ: ta 15, tôi 9, con 3 trong 31 khoá; dùng tôi. kataṁ buddhassa sāsanaṁ dịch không chủ ngữ như tha-ap551. Paṭisambhidā catasso dịch Bốn vô ngại giải (509 trên 523 khoá). Thuật ngữ khác: lokanāyaka dịch bậc Dẫn Đạo Thế Gian (Dẫn Đạo 68 khoá của tha-ap); Himavanta dùng như tầng (58 khoá, so với Himavā 13 và Tuyết Sơn 8); amata dịch bất tử (29 khoá của tha-ap, cam lồ 0 khoá); candana dịch chiên-đàn (5 khoá của tha-ap so với đàn hương 1 khoá); cakkavattī dịch Chuyển Luân Vương (173 khoá viết hoa so với 91 khoá viết thường); mahārasa dịch hương vị đậm đà theo thag15.1:1.2.
  Pāli trùng nguyên văn trong chính bài: ba nhóm. 2.1 và 7.3 (Anubyañjanasampanno) Việt khác nhau chỉ ở chữ hoa đầu khoá vì 2.1 đứng đầu một câu còn 7.3 đứng giữa câu; 2.3 và 8.3 (Byāmappabhāparivuto) Việt giống nhau; 35.2, 36.2, 37.2 là …pe…, cả ba Việt giống nhau là một dấu lược …. So với tầng: đã dò 28 khoá Pāli có trùng nguyên văn ở bài khác; 21 khoá Việt giống bản đa số, 7 khoá khác bản đa số: 6.1 (chỉ có 1 khoá trùng, ja437:6.3 dịch với đoàn người hùng vĩ, nhưng đó là lời của một nhân vật khác trong Jātaka; ở đây parivāra là đoàn tùy tùng nên dịch Cùng đoàn tùy tùng đông đảo), 23.3 (chỉ khác chữ hoa đầu câu), 25.4, 35.1, 35.3, 36.1 (ta đổi thành tôi như đã nói, riêng 36.1 theo các bài liền kề cùng phẩm), 41.1 (theo phạm vi gần nhất như đã nói). Các khoá 22.3 (tha-ap544:7.1), 12.1 (mil7.5.1:2.3), 1.1 đến 1.4 (3 đến 4 khoá của tầng, so với 1 khoá khác ở tha-ap433), 25.1 đến 25.3, 35.2, 36.2, 37.1, 37.2, 37.3, 0.1, 0.2, 47.3, 24.4 (7 trên 8 khoá viết sẽ vô lậu mà đi vào Niết-bàn) dùng nguyên văn tầng.
  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 37.3 (cố ý chạy qua khoá); nháy đơn mở ở 18.1 và đóng ở 18.3 (lời Đức Phật dạy), nháy đơn mở ở 23.1 và đóng ở 24.4 (lời thọ ký); Việt khớp Pāli từng khoá, đã đối chiếu 173 trên 173 khoá. Khoá 35.2, 36.2, 37.2 là …pe… nên giữ đúng một dấu lược …; Pāli của bài không có (…) trần.
  Lời thọ ký 23.1 đến 24.4 là lời nói về tương lai (bhavissati, nibbāyissati); viyākāsi ở 22.3 dịch đã tuyên bố theo tha-ap544:7.1 (tầng tha-ap chưa có tiền lệ dịch là thọ ký). Bài không có kappa kèm số trong lời thọ ký nên không có cụm sau bao nhiêu kiếp nữa.
  Bất định, không đưa vào thân kinh: 6.1 đến 6.2 mahatā parivārena (cách công cụ) đặt trước nisinnaṁ lokanāyakaṁ, Việt giữ nguyên thứ tự nên đoàn tùy tùng ngầm gắn với Đức Phật đang ngồi; cách đọc khác là người kể đến gần cùng đoàn tùy tùng của mình. 9.2 samaṇīva siluccayo đọc là sa cộng maṇi cộng iva, như ngọn núi đá có ngọc; chưa có đối chiếu ngoài trong tầng, đây là chỗ khó nhất bài. 9.4 guṇena viya sāgaro cách công cụ, dịch như biển cả đầy đức hạnh. 12.3 kuvāda dịch tà thuyết, gaccha dịch bụi rậm. 12.4 sobhasi là ngôi thứ hai (ngài chói sáng) giữa các câu ngôi thứ ba, giữ nguyên. 13.1 agadho dịch thuốc giải độc (tầng chỉ có agada trong Milindapañha). 14.3 Sindhūva vanarājīnaṁ dịch như dòng sông đối với những dải rừng, chưa phân xử được quan hệ giữa dòng sông và hàng cây rừng (tầng không có vanarājī). 15.1 vijayīva dịch đại chiến sĩ chiến thắng. 16.2 dosa dịch sân, 16.4 diṭṭhigaṇḍa dịch nhọt tà kiến (tầng không có từ này). 18.4 iccevamanusāsatha đọc là ngôi thứ ba, dịch ngài dạy bảo như vậy, không chia thì. 20.4 namassahaṁ dịch tôi đảnh lễ cho đến trọn đời, thì của động từ không chắc (cả bài ở 17 đến 19 dùng thì hiện tại, 21 trở đi dùng quá khứ). 21.1 đến 21.4 opuñjesiṁ dịch trát hương (0 tiền lệ trong tầng; opuñjati có nghĩa chất đống hay rải, chưa phân xử được trát), gandhakuṭi dịch hương thất (3 khoá của tầng, tha-ap18), và 21.4 không có động từ nên lặp lại việc đã nêu ở 21.2 (tôi đã làm như vậy). 22.2 sarīravissagandhino dịch cho người có thân mùi hôi tanh, không rõ là chính người kể hay người nói chung. 22.4 sugandhatanulābhitaṁ dịch việc đạt được thân thơm. 27.2 đến 27.3 purī ở khoá trước, Sāvatthi ở khoá sau, dịch thành phố / Sāvatthī. 30.3 đến 31.2 narasārathi dịch bậc Điều Ngự Trượng Phu (tầng: thag6.1 và tha-ap551 so với Chủ Xế Loài Người 1 khoá), hiểu là Đức Gotama sau khi điều phục Sela. 33.3 nibbāyissaṁ là thì tương lai còn ahu ở 33.4 là quá khứ; giữ khoá 33.3 ở tương lai (và khi tôi sẽ nhập Niết-bàn) và khoá 33.4 không chia thì (khi ấy có mưa hương). 34.2 mahārahaṁ đọc là tính từ chung cho cả ba hương, uppala dịch sen xanh (tha-ap36), campaka giữ nguyên tên hoa (tha-ap370). 34.4 tato dịch từ đó. 42.2 mahālābhī dịch có nhiều lợi lộc (0 tiền lệ). 45.1 đến 45.3 Kaṇikāravhayo vaggo, phalado, tiṇadāyako, Kaccāno dịch giữ tên Pāli; ở khoá 0.2 của tầng các phẩm này mang nhiều tên khác nhau (Kaṇikāravagga 10 khoá viết Phẩm Hoa Kaṇikāra; Phaladāyakavagga 6 khoá viết Phẩm Phaladāyaka và 3 khoá viết Phẩm Cúng Dường Trái Cây; Tiṇadāyakavagga 4 khoá viết Phẩm Cỏ Dâng Cúng, 2 khoá Phẩm Cúng Dường Cỏ, 1 khoá Phẩm Tiṇadāyaka), nên chưa đối chiếu được; để biên tập phán một lượt. 47.1 Pāli ghim viết udānagāthāhi (một d), còn thi-ap40:22.1 viết uddānagāthāhi và dịch các kệ tóm lược; đọc là uddāna vì ngữ cảnh là các bài kệ tóm lược ngay trước, nhưng đúng chữ trong Pāli ghim là udāna nên đây là một cách đọc, chưa phân xử được. Các số 900, 84, 316 và 6.218 ở phần uddāna không kiểm chứng được bằng cách đếm trong tầng.
  Hệ quả giới hạn: triangulation hạ xuống 7.5 và status giữ draft.
