notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trong
  source/upstream-manifest.json). Draft + blocker thật. 13/13 khoá từ Pāli. `cần` RỖNG nên
  tự kiểm mọi khoá — 0 lỗi; idempotent byte-for-byte.
  Tiền lệ: Phẩm Hội Họp cho Santhavavagga (xem ja161). Susīmajātaka chưa có tiền lệ; susīma
  là tơ vải rách, mảnh vải vụn, dịch Tơ Mảnh theo nghĩa, không bịa cốt truyện.
  BẤT ĐỊNH 1: `Kāḷā migā setadantā tavīme` — kāḷā là đen, migā là hươu (số nhiều hoặc
  tế tán số nhiều), tavīme là hai người. Dịch Hai con hươu đen ơi, các ngươi. Nhưng ai nói
  và nói với ai thì Pāli không nói rõ, vì vậy không thêm chủ thể nào vào thân kinh.
  BẤT ĐỊNH 2: `setadantā` là đang tiến lại gần; chuyển sang vừa tới gần cho tự nhiên, thay
  vì dịch sát là ghé thân.
  BẤT ĐỊNH 3: `hemajāla` là lưới có sợi vàng; dịch lưới vàng, không bịa thêm chi tiết.
  BẤT ĐỊNH 4: `susīma brūsi` là sẽ có tơ mảnh, sẽ khóc; `anussaraṁ pettipitāmahānaṁ` là
  nhớ về cha mẹ, tổ tông. Chỉ một tơ mảnh được nói ở cả hai khối; 1.3 và 2.3 lệch nhau ở
  `brūsi` và `vadāmi māṇava`, nên 1.3 dịch là hứa, 2.3 dịch là bảo.
  Cả hai khối 1 và 2 là cùng một lời nói phát ra hai lần (1.3 và 2.3 gần như trùng nhau),
  nên dịch cặp chứ không dịch hai văn bản khác nhau.
  Hạ semantic_fidelity 8.3, terminology 8.2, ambiguity_integrity 8.4 vì còn bốn chỗ chưa
  phân xử và không có tầng Anh. triangulation 7.0: không tầng Anh, không bản Việt tham khảo.
