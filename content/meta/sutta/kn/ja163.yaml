notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trong
  source/upstream-manifest.json). Draft + blocker thật. 13/13 khoá từ Pāli. `cần` RỖNG nên
  tự kiểm mọi khoá — 0 lỗi; idempotent byte-for-byte.
  Tiền lệ: Phẩm Hội Họp cho Santhavavagga (xem ja161). Susīmajātaka chưa có tiền lệ; susīma
  là tơ vải rách, mảnh vải vụn, dịch Tơ Mảnh theo nghĩa, không bịa cốt truyện.
  BẤT ĐỊNH 1: `Kāḷā migā setadantā tavīme` — kāḷā là đen, migā là hươu (số nhiều hoặc
  tế tán số nhiều), tavīme là hai người. Dịch Hai con hươu đen ơi, các ngươi. Nhưng ai nói
  và nói với ai thì Pāli không nói rõ, vì vậy không thêm chủ thể nào vào thân kinh.
  BẤT ĐỊNH 2: `setadantā` là đang tiến lại gần; chuyển sang vừa tới gần cho tự nhiên, thay
  vì dịch sát là ghé thân.
  BẤT ĐỊNH 3: `hemajāla` là lưới có sợi vàng; dịch lưới vàng, không bịa thêm chi tiết.
  BẤT ĐỊNH 4: `susīma brūsi` là sẽ có tơ mảnh, sẽ khóc; `anussaraṁ pettipitāmahānaṁ` là
  nhớ về cha mẹ, tổ tông. Chỉ một tơ mảnh được nói ở cả hai khối; 1.3 và 2.3 lệch nhau ở
  `brūsi` và `vadāmi māṇava`, nên 1.3 dịch là hứa, 2.3 dịch là bảo.
  Cả hai khối 1 và 2 là cùng một lời nói phát ra hai lần (1.3 và 2.3 gần như trùng nhau),
  nên dịch cặp chứ không dịch hai văn bản khác nhau.
  Hạ semantic_fidelity 8.3, terminology 8.2, ambiguity_integrity 8.4 vì còn bốn chỗ chưa
  phân xử và không có tầng Anh. triangulation 7.0: không tầng Anh, không bản Việt tham khảo.
  Sửa lan 2026-10-13: 0.3 `Santhavavagga` "Phẩm Hội Họp" → "Phẩm Santhava", đồng bộ ja162 và ja164–170 (nhãn tag đổi theo); `santhava` là sự thân quen, không phải hội họp (đo: 7/10 bài trong phẩm dùng "Phẩm Santhava"). Đoạn nhắc "Phẩm Hội Họp" ở trên thuộc bản cũ. Các khoá nội dung 1.1–2.4 không được chạm trong lượt này. Điểm cũ không đổi.
  Sửa lan 2026-10-13 (accuracy fix; 0.4, 1.1–1.4, 2.1–2.4, 3.1 đổi; 0.1–0.3 giữ nguyên). Mục này THAY các mục «BẤT ĐỊNH 1–4» ở trên và nhận định «susīma là tơ vải rách, dịch Tơ Mảnh», «hai con hươu đen», «các ngươi vừa tới gần», «đã bị lưới vàng bịt kín», «sẽ có tơ mảnh… sẽ khóc», «cha mẹ, tổ tông» — các mục ấy dựa trên cách đọc sai. Trước → sau: 1.1 «Hai con hươu đen ơi, các ngươi vừa tới gần,» → «Những con thú đen ngà trắng này là của ngài,» (`kāḷā migā setadantā tavīme` = thú đen, ngà trắng, `tava ime` = những con này của ngài; `setadanta` là «ngà/răng trắng», không phải «tiến lại gần»; `migā` giữ «thú», không thêm «voi»); 1.2/2.2 «đã bị lưới vàng bịt kín;» → «hơn một trăm con, phủ lưới vàng;» (`parosataṁ` = hơn một trăm, bị bỏ sót trước đây; `hemajālābhichannā` = phủ lưới vàng, như `hemajālapaṭicchannāni` ở dn17:2.5.5 và sn22.96:3.6); 1.3 «Này, ta hứa với các ngươi: sẽ có tơ mảnh,» → «Ngài nói rằng ngài cho tôi những con ấy, hỡi Susīma,» (`te te dadāmīti susīma brūsi`: `te te dadāmi` = «ta cho ngài những con ấy», lời được trích; `brūsi` = ngươi nói; `susīma` là hô cách của tên riêng, cùng dạng với `ja411:1.3` «hỡi Susīma» và `sn11.2` «Kinh Susīma», không phải «tơ mảnh»); 1.4 «các ngươi sẽ khóc nhớ về cha mẹ, tổ tông mình” → «khi nhớ đến cha ông”» (`anussaraṁ pettipitāmahānaṁ` = nhớ đến cha và ông, `petti` thuộc cha; không có «khóc», «mẹ»); 2.1 như 1.1 nhưng `mamīme` = «của ta»; 2.3 «Lời này ta bảo các ngươi, hỡi người:» → «Ta nói rằng ta cho cậu những con ấy, này thanh niên,» (`vadāmi māṇava`: «cậu»/«này thanh niên» như ja352:7.4, ja449:5.1, ja454:14.4); 2.4 «sẽ có tơ mảnh, các ngươi sẽ khóc nhớ cha mẹ, tổ tông mình.” → «khi nhớ đến cha ông.”». Tiêu đề: 0.4 «3. Kinh Tơ Mảnh» → «3. Kinh Susīma», 3.1 «Kinh Tơ Mảnh thứ ba.» → «Kinh Susīma thứ ba.», `translationTitle` «Kinh Tơ Mảnh» → «Kinh Susīma»; căn cứ: `Susīmajātaka` mang tên riêng Susīma, theo `ja411:0.4` «6. Kinh Susīma» và 411/445 tệp có khoá `:0.4` dạng «N. Kinh X». Pāli trùng nguyên văn trong chính bài: 1.2 = 2.2 (Việt giống nhau). Bất định còn lại, không đưa vào thân kinh: (a) Pāli không nêu người nói; tôi suy khổ 1 là lời người nhận (gọi Susīma, trích lời cho của Susīma) và khổ 2 là lời Susīma đáp (gọi `māṇava`), nên xưng «tôi/ngài» ở khổ 1 và «ta/cậu» ở khổ 2 là chọn của người dịch; (b) `kāḷā migā setadantā` có thể là voi (cùng `hemajālābhichannā`) nhưng Pāli không gọi tên nên không viết «voi»; (c) `pettipitāmahānaṁ` hiểu là «cha ông», chưa tra được nơi thứ hai trong tầng. Không có bản Anh Sujato và không có bản Việt hiện hành của bài này nên triangulation giữ như cũ. Điểm cũ và status không đổi; bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này. Ghi nhận ngoài lát: `ja411.yaml` còn nhắc `ja163:0.4` là «Kinh Tơ Mảnh» trong mục tiền lệ.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 2 khoá chênh lệch (13 khoá cả bài; các khoá còn lại hai bản gần như trùng chữ) → khác nghĩa 0: sửa 0, giữ 2, bất định 0 mới. Giữ `0.3` "Phẩm Santhava" (bản mù dịch nghĩa "Phẩm Giao Hảo"; cả 10 bài của phẩm `ja161`–`ja170` giữ dạng phiên âm) và `0.4` "3. Kinh Susīma" (bản mù "Chuyện Tiền thân Susīma"; theo khuôn "N. Kinh X" của tầng, đã nêu ở lượt trước). Bản mù không đưa thêm cách hiểu nào cho `kāḷā migā setadantā` hay người nói ở khổ 1–2, nên các bất định (a)–(c) ở trên vẫn nguyên. Đọc lại toàn bài 13 cặp: không sửa khoá nào. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản Anh, bản Việt nguyên bài hay đoạn song song): sửa 0 khoá. Rà lại 13/13 khoá: `tava ime`/`mama ime` (1.1/2.1), `parosataṁ` (1.2/2.2, lặp đúng chữ), lời trích `te te dadāmi` chuyển gián tiếp nhất quán ở 1.3 và 2.3, `anussaraṁ pettipitāmahānaṁ` lặp đúng ở 1.4/2.4. Giữ *thú* cho `migā` (Pāli không nói *voi*; `setadantā` *ngà trắng* đã đủ gợi), giữ *tôi/ngài* và *ta/cậu* theo người nói trong Jātaka. Bất định (a)–(c) ghi trước giữ nguyên. Không có bằng chứng mới nên giữ điểm.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :3.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").

  Nghiên cứu nguồn ngoài 2026-10-16: Rouse (Cowell chủ biên, PTS 1897),
  https://obo.genaud.net/dhamma-vinaya/pts/kd/jat/jat.2/jat.2.163.rous.pts.htm; đã đối chiếu 1.1–1.4,
  2.1–2.4 (ai nói với ai: hoàng tử/chủ lễ nói với vua Susīma rồi vua đáp); trang Ānandajoti số 163
  trên web thực ra là Ja 162 nên không dùng; sửa không có khoá nào; bất định không.

  Rà từng chữ bằng DPD 2026-10-16: 13 khoá đã rà; sửa: không (giữ 1.3, 2.3 `te te dadāmi` "cho … những
  con ấy": Indacanda cũng đọc `te` là "cho khanh"; chú giải đọc `te ete` nhưng không làm đổi nghĩa
  chính); bất định: không.
  Lượt hoàn thiện 2026-10-17: thống nhất thuật ngữ: đã rà, không có khoá cần sửa (`migā` "thú", `parosataṁ`, `hemajālābhichannā`, `pettipitāmahānaṁ` "cha ông" lặp đúng ở hai khổ; "Phẩm Santhava" khớp phẩm); thêm 3 chú thích (1.1 thú là voi theo chú giải, ai nói với ai; 1.3 và 2.3 chú giải đọc `te ete` "cho các bà-la-môn khác" so với bản dịch "cho tôi/cho cậu"). Các câu sau trong ghi chú cũ đã bị thay: "Draft + blocker thật" (bài nay ở `review` theo waiver `no-upstream-english`, blocker vẫn ghi trong hồ sơ); điểm "semantic_fidelity 8.3, terminology 8.2 … triangulation 7.0" của mục đầu (điểm hiện hành xem `quality`); dòng kết "Kinh Susīma thứ ba." (nay "Kinh Susīma, thứ ba." theo C2); bất định (a) "Pāli không nêu người nói; tôi suy…" (đã phân xử ở mục nguồn ngoài 2026-10-16: chàng thanh niên nói với vua Susīma rồi vua đáp); câu ở lượt DPD 2026-10-16 "chú giải đọc `te ete` nhưng không làm đổi nghĩa chính" (chú giải hiểu là cho các bà-la-môn khác, tức đổi người được cho; nay ghi là bất định trong chú thích 1.3, lời kinh giữ nguyên theo Indacanda).
  Chấm lại độc lập sau rà DPD + kiểm độc lập 2026-10-17: đọc cả 13/13 khoá đối chiếu chú giải CST (K10-JA/163), Indacanda (kệ 177–178), Rouse (jat.2.163), DPD: LỖI-THẬT 2 khoá / 1 lỗi (1.3, 2.3 te te dadāmi: bản dịch chuyển lời trích sang gián tiếp 'ngài cho tôi'/'ta cho cậu', cố định người nhận là chàng thanh niên; chú giải 'te ete tava santake … aññesaṁ brāhmaṇānaṁ dadāmi' và Rouse 'To thee, and thee I give them' hiểu là cho người khác; Indacanda giữ lời trích trực tiếp ‘Trẫm ban chúng cho khanh’ dạng câu hỏi). Phân xử: chú giải + Rouse + mạch truyện thắng; đề nghị giữ lời trích trực tiếp không nêu người nhận. Không xếp blocker vì cách đọc tặng cách hợp ngữ pháp và đã có chú thích, nhưng semantic 8,2, grammar 8,0. Chú thích lượt hoàn thiện đúng ý nhưng tóm hơi lệch chữ chú giải, không dẫn Rouse → ambiguity 8,5. 'cậu' ngoài cặp C4. Không bản Anh Sujato, không Thích Minh Châu → triangulation 8,6. validate pass, quality:check không lỗi ở bài này → 9,5. Blocker vắng bản Anh thay bằng chuỗi đúng sự thật.
  Sau lượt chấm độc lập 2026-10-17 đã sửa `1.3`, `2.3` *te te dadāmi*: bỏ cách chuyển sang lời gián tiếp «ngài cho tôi»/«ta cho cậu» (tự chọn người nhận, trái chú giải *te ete tava santake* và Rouse) → giữ lời trích trực tiếp «‘Ta cho ngươi những con ấy’»; chú thích viết lại. Điểm ghi là điểm người chấm cho trước khi sửa.
  Chấm lại độc lập round 2 sau sửa (2026-10-17): đọc lại cả 13/13 khoá (bài không đủ 30 khoá mới) đối chiếu Pāli ghim, chú giải CST K10-JA/163 (tải lại), Indacanda kệ 177–178, DPD: LỖI-THẬT 0/13; lỗi round 1 ở 1.3/2.3 đã sửa đúng đề xuất (lời trích trực tiếp ‘Ta cho ngươi những con ấy’), còn một bất định người nhận đã chú thích. Không có bản Anh Sujato, không có Thích Minh Châu → triangulation 8,6. Semantic 8,9 / grammar 8,8 (lên từ 8,2 / 8,0 vì lỗi đã sửa); terminology 9,1 (bỏ «cậu»), clarity 9,0, ambiguity 8,7 (chú thích dẫn Rouse; câu «không tự chọn người nhận» hơi quá). check.py OK; validate pass; quality:check 0 lỗi; test/check/build do CI → 9,5. Blocker vắng bản Anh chép nguyên.
