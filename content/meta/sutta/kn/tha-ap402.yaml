  TÊN BÀI VÀ PHẨM — `translationTitle` bằng đúng `:0.3`. Pāli `Ajitattheraapadāna` không bắt đầu bằng số nên BỎ số
  thứ tự (không thuộc nhóm THỪA). Mẫu câu đo trên 542 tệp `tha-ap` có `:0.3` (cây chính cộng worktree): *Bài Kệ Tuyên
  Ngợ Về* 245 (cộng 10 *Tuyên Ngợi*), *Ký Sự Về* 141, *Bài Kệ Tuyên Ngôn Về* 138, *Kinh Kệ Của* 5. Hai phạm vi cho hai
  đa số khác nhau: cửa sổ gần nhất tha-ap395–420 là *Ký Sự Về* 20/20 (cùng phẩm Pilindavaccha: tha-ap395–401), nên bài này dùng *Ký Sự Về Trưởng Lão Ajita*. `Tuyên Ngợ` là chính tả đáng ngờ (Pāli không có chữ tương
  ứng); đề nghị người biên tập phán một lượt cho cả cuốn. Dòng kết `:39.1` theo tiền lệ gần nhất *Ký sự về Trưởng lão
  X, thứ N* (12 trong 20 khoá cùng cửa sổ tha-ap395–420; 8 khoá viết hoa *Ký Sự Về Trưởng Lão*).
  `:0.1` `Therāpadāna` giữ nguyên Pāli (528 khoá, so với *Trưởng Lão Ký Sự* 9). `:0.2` → *Phẩm Pilindavaccha* (7 khoá,
  tha-ap395–401).

  THUẬT NGỮ VÀ TIỀN LỆ:
  - Đại từ: *ta* xuyên suốt cho người kể (Ajita) theo đa số tầng (cùng cách với tha-ap401, 403, 405). Lời của Đức
    Padumuttara ở `:15.4` viết *Ta* theo tha-ap401 (cùng phẩm, liền kề); `suṇātha mama bhāsato`: 13 khoá *Ta* và 14 khoá
    *ta* toàn tầng, còn ở cửa sổ tha-ap385–420 là 7 *Ta* so với 3 *ta*.
  - Pāli trùng nguyên văn với khoá đã dịch ở bài khác: 77 khoá của bài có Pāli trùng (8.066 cặp dò được, phần lớn là
    công thức lược `…pe…` và kết kệ), 72 khoá dùng đúng một cách dịch đã có (so không phân biệt hoa thường và dấu cuối
    dòng), 5 khoá khác: `:3.2` (`dvattiṁsavaralakkhaṇaṁ`, dùng *ba mươi hai tướng tốt tuyệt hảo* theo 10 khoá `bāttiṁsa…`
    thay vì 2 khoá đã dịch trực tiếp là *tướng cao quý* và *đặc trưng*), `:22.1` (tha-ap136 *Khắp thành xô ấy* là chữ
    chưa rõ nghĩa), `:26.3` (tha-ap293:1.1 mang chữ khác hẳn vì bài ấy lệch dòng), `:27.2` (xem dưới), `:31.2` (chỉ khác
    *Đấng … thế gian* so với *bậc … Thế Gian*).
  - `devaloke ramiṁ ahaṁ` (`:27.2`) → *ta đã vui chơi ở cõi trời*, không dùng *hưởng thọ* (5 khoá *tôi* + 2 khoá *ta*
    toàn tầng) vì cùng động từ `ramissati` ở `:16.2` đã là *sẽ vui chơi* (14 khoá), và `:27.1`–`:27.2` là lời đáp ứng đúng
    lời thọ ký `:16.1`–`:16.2`; đọc giữ nguyên quan hệ lặp lại ấy.
  - `lokanāyaka` → *Đấng Dẫn Đạo thế gian* ở `:1.4`, `:8.4`, `:31.2` (tầng có cả *bậc Dẫn Đạo thế gian* và *Đấng Dẫn Đạo
    thế gian*; tha-ap401 dùng cả hai); `vināyaka` → *bậc Điều Ngự* (30 trong 41 khoá toàn tầng, gồm tha-ap396:4.4); `nāyaka` giữ khác `vināyaka`.
  - `Pasannacitto sumano` → *Với tâm tịnh tín hân hoan* (63 khoá); `pasanno sehi pāṇibhi` → *với tâm tịnh tín bằng chính đôi
    tay mình* (`:9.4` 10 khoá có dấu chấm; `:15.2` dấu chấm phẩy: 4 khoá có dấu phẩy sau *tịnh tín* và 3 khoá không có,
    chọn không phẩy để hai khoá Pāli trùng nhau trong bài khớp nhau).
  - `sāvaka` → *đệ tử* (7 khoá *đệ tử của bậc Thầy*, so với 10 khoá *môn đồ của bậc Thầy*) để khớp `aggasāvako` `:13.2`
    và `sissattaṁ` `:30.4` trong cùng bài; không có căn cứ trong Pāli để phân biệt hai cách.
  - `Satasahassito kappe` (`:34.1`) → *Vào một trăm ngàn kiếp trước đây* (11 khoá; tha-ap401:25.1 cùng dạng), không dùng
    *đại kiếp* (33 khoá) vì Pāli không có chữ *mahā* và bài dùng *kiếp* ở `:16.1`, `:24.1`, `:27.1`.
  - `Duggatiṁ nābhijānāmi` (`:34.3`) → *Ta không còn biết đến đọa xứ* (70 khoá toàn tầng, 7 khoá ở tha-ap385–420);
    dạng *Ta không biết mình rơi vào khổ đau* (140 khoá) không bám `duggati`.
  - `Tassuddānaṁ` → *Tóm lược:* (84 khoá toàn tầng, so với *Tóm tắt phẩm này:* 43 khoá; cùng trăm: tha-ap302, 382
    *Tóm lược*; tha-ap372, 392 *Tóm tắt phẩm này*). `Atha vagguddānaṁ` → *Và tóm lược các phẩm:* (12 khoá).
  - `Pilindavacchavaggo cattālīsamo` → *Phẩm Pilindavaccha là phẩm thứ bốn mươi* (`cattālīsama` = thứ 40); bản Việt nguyên
    bài đếm *thứ bốn mươi bốn*, lệch cách đếm phẩm; theo Pāli.
  - `Padumavaggadasakaṁ` (`:46.1`) → *Nhóm mười phẩm Paduma*; tầng có 3 khoá *Phẩm X — mười phẩm* (tha-ap102, 202, 302),
    nhưng `dasaka` là nhóm mười (các phẩm Paduma, Ārakkhada, Umā, Gandhodaka, Ekapadma, Saddasaññī, Mandāra,
    Bodhivandaka, Avaṭa, Pilindi: đúng 10), không phải một phẩm tên Paduma. `Catutthasatakaṁ samattaṁ` → *Nhóm một trăm
    thứ tư đã hoàn tất* (tầng: 3 khoá *Tập thứ … trăm* đảo thứ tự và 1 khoá *Năm trăm, trọn vẹn*). Đề nghị người biên tập
    phán một lượt.
  - Công thức `Kilesā jhāpitā mayhaṁ` (193 khoá), `Svāgataṁ vata me āsi` (167), `Paṭisambhidā catasso` (564) và `…pe…`
    (955 khoá `…`) dùng nguyên văn đa số toàn tầng. `Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti` dùng nhóm số nhiều *đã nói
    những bài kệ này* (407 khoá, so với 21 khoá *bài kệ này* số ít); `Itthaṁ sudaṁ` → *Tôi nghe như vầy*.
  - Pāli trùng nguyên văn trong chính bài: 8 nhóm (`:6.4`/`:31.4`, `:9.4`/`:15.2`, `:10.4`/`:12.4`, `:16.1`/`:27.1`,
    `:23.4`/`:34.4`, `:33.4`/`:36.3`/`:37.3`, `:35.2`/`:36.2`/`:37.2`, `:42.2`/`:45.2`), bản Việt cùng nghĩa ở cả 8 nhóm, 0 cặp lệch về
    nghĩa; chỉ khác chữ hoa đầu dòng (`:10.4`/`:12.4`), dấu cuối dòng (`:9.4`/`:15.2`) và nháy đóng ” (`:37.3` so với `:33.4`, `:36.3`).
  - Nháy: Pāli mở “ ở `:1.1` và đóng ” ở `:37.3`, cố ý chạy qua khoá; lời Đức Phật mở ‘ ở `:15.1` và đóng ’ ở `:26.4`. Đối
    chiếu từng khoá: 0 lệch trên 168 khoá (chỉ 4 khoá có nháy trong Pāli). Pāli không có `(…)` nên bản Việt không có
    `(…)`; ba khoá `…pe…` (`:35.2`, `:36.2`, `:37.2`) thành đúng một `…`.
  - Số Pāli (tự tính): `dvattiṁsa` = dvā 2 + tiṁsa 30 = 32; `Sattarattindivaṁ` = bảy đêm ngày; `aṭṭhakkhattuṁ` = tám lần;
    `Vasīsatasahassehi` = sata 100 × sahassa 1000 = 100.000 (*một trăm ngàn*); `saṭṭhi kappasahassāni` = 60 × 1.000 = 60.000 kiếp
    (*sáu mươi ngàn kiếp*, `:16.1`, `:27.1`); `sahassakkhattuṁ` = 1.000 lần; `Soḷasamaṁ bhāṇavāraṁ` = phần tụng đọc thứ 16;
    `Chattiṁsakkhattuṁ` = cha 6 + tiṁsa 30 = 36 lần; `sattasataṁ` = 7 × 100 = 700; `aṭṭhakosaṁ` = tám kosa;
    `aṭṭhadīpa` = tám ngọn đèn; `Kappasatasahassamhi` và `Satasahassito kappe` = 100 × 1.000 = 100.000 (*một trăm ngàn
    kiếp*); `tisso vijjā` = ba minh; `Satāni pañca` + `vīsati` = 500 + 20 = 520 (*năm trăm … hơn số ấy hai mươi*);
    `Catusattati` = catu 4 + sattati 70 = 74, `ekādasa satāni` = 11 × 100 = 1.100 (*bảy mươi bốn … một ngàn một trăm*);
    `cattālīsamo` = thứ 40. Trong bài không có `Tiṁsakappasahassa`.

  BẤT ĐỊNH — để người biên tập phán, không thêm vào thân kinh:
  1. `saddaṁ` (`:2.2`) dịch *tiếng đồn*; cũng có thể là *tiếng nói* hoặc *âm thanh*. `suṇomahaṁ` ở thì hiện tại, dịch
     như thì quá khứ theo mạch kể.
  2. `vittimāpajjiṁ` (`:3.3`) dịch *khởi lên niềm hoan hỷ*, theo tha-ap12:3.4, tha-ap99:3.1, tha-ap103:3.3, tha-ap315:2.3
     (`vitti` = hoan hỷ). Bản Việt nguyên bài hiểu là một ý nghĩ dấy lên; chọn nghĩa của tầng vì có 4 tiền lệ. Câu hỏi
     `satto ko nāmayaṁ bhave` (`:3.4`) dịch *rốt cuộc có thể là ai*.
  3. `mama vijjaṁ anussariṁ` (`:4.2`) dịch *môn học của mình*: 0 tiền lệ; `vijjā` ở đây là điều đã học (từ thầy Bāvari),
     không phải *minh* như `tisso vijjā` ở `:33.3`. `vuḍḍhānaṁ paṇḍitānaṁ subhāsitaṁ` (`:4.3`–`:4.4`) hiểu là lời khéo nói
     của các bậc trưởng thượng, hiền trí.
  4. `gatiṁ me sodhayissati` (`:5.4`) dịch *nẻo đi*: 0 tiền lệ; có thể là *số phận* hoặc *cảnh giới tái sinh*. Đối tượng của
     `sakkareyyaṁ` (`:5.3`) là *vị này* theo `:5.2`; Pāli không nêu. `Yannūna` dịch *chi bằng*.
  5. `madhutelaṁ` (`:6.2`) dịch *dầu madhu*: 0 tiền lệ; có thể là dầu của cây madhu hoặc *mật ong và dầu*. `Kolambakaṁ`
     (`:6.3`) giữ nguyên Pāli, là một vật đựng; 0 tiền lệ trong tầng `tha-ap` (chỉ ja503:7.1 `patikolamba`).
     `Tidaṇḍake` (`:7.1`) dịch *giá ba chân* (một vật đỡ đèn); tha-ap339:5.3 dịch cùng dạng `tidaṇḍake` là *ba cây cột*.
  6. `aṭṭhakkhattuṁ avandahaṁ` (`:7.4`) và `aṭṭhadīpaphalena` (`:23.2`): bài chỉ kể một ngọn đèn nhưng `:23.2` nói tám
     ngọn đèn; dịch sát chữ *tám ngọn đèn*, không giải thích mối liên hệ với tám lần đảnh lễ.
  7. `gandhamayā` (`:10.1`) dịch *bằng hương thơm* (theo `sabbasoṇṇamayā rukkhā` tha-ap401:6.1 *toàn bằng vàng*);
     `pupphagandhāse` (`:11.1`) dịch *có hương hoa*; `dharaṇīruhā` dịch *cây mọc trên đất*. `Yāvatā himavantamhi` (`:12.1`)
     dịch *Bao nhiêu ở trong dãy Himavanta*, đối tượng là `nāgā ca garuḷā`; `nāga` → *rồng* (tha-ap521:16.1), `garuḷa` giữ
     nguyên Pāli.
  8. `sattasataṁ` (`:18.3`) không có đơn vị; dịch *bảy trăm lần* theo song song `chattiṁsakkhattuṁ` (`:18.1`); tha-ap61:6.3
     dịch *bảy trăm năm* (1 khoá).
  9. `Devalokā cavantassa, nibbattantassa jantuno … Jāyamānassa sattassa, puññakammasamaṅgino` (`:20.3`–`:21.4`) là các
     cụm sở thuộc cách; dịch *khi … mệnh chung*, *khi chúng sinh ấy tái sinh*, *khi chúng sinh ấy đang sinh ra, đầy đủ phước
     nghiệp*, và `padīpaṁ dhārayissati` (`:21.2`) là chủ động *vị ấy sẽ mang theo ngọn đèn*; cũng có thể hiểu thể bị động
     (một ngọn đèn sẽ được giữ). `Yāvatā nagaraṁ āsi, tāvatā jotayissati` (`:22.1`–`:22.2`) không nêu chủ ngữ của
     `jotayissati`.
  10. `Na jayissantimaṁ jantū` (`:23.3`) dịch *Các chúng sinh sẽ không thắng được vị này*; 0 tiền lệ; `jayissanti` cũng có thể
      là dạng khác của `jāyissanti`. Chủ ngữ và tân ngữ không được xác nhận độc lập.
  11. `dametāvī` (`:32.1`) dịch *bậc điều phục người khác*: Pāli không nêu đối tượng; 0 tiền lệ. `kathayī` dịch *đã nói về*.
      `tositohaṁ mahāmuniṁ` (`:33.2`) dịch *ta đã làm hài lòng bậc Đại Mâu-ni* theo tân cách `mahāmuniṁ` và lời thọ ký
      `Tosayitvāna sambuddhaṁ` (`:26.1`); cũng có thể hiểu bị động.
  12. `giri saḷalasavhayo` (`:41.4`) dịch *Giri, vị có tên Saḷala*: theo thứ tự bài trong phẩm `giri` ứng với tha-ap399
      (Girimānanda) và `saḷala…` ứng với tha-ap400 (Saḷalamaṇḍapiya); giữ nguyên tên Pāli rút gọn của kệ tóm lược, không
      mở rộng. Các tên phẩm ở `:44` cũng là dạng rút gọn (`Padumārakkhado` = Paduma + Ārakkhada).

