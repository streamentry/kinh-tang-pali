notes: |-
  PĀLI TRÙNG NGUYÊN VĂN — ĐÃ DÙNG LẠI. `sandhāvissaṁ anibbisaṁ;` trùng y hệt
  `dhp153:2`, tầng đã dịch "chạy tìm mà không gặp," — dùng lại nguyên văn. `Anekajātisaṁsāraṁ`
  (dhp153:1, chỉ khác dấu mở nháy ở bản này) đã dịch "Lang thang qua bao kiếp sống," — theo lại.
  Hệ quả: 1.1–1.2 ở bài này là nguyên văn câu kệ dhp153 ghép lại, và Sujato cũng vậy. Tôi ghi rõ
  để không ai tưởng tôi dịch trùng mà không biết.
  `dukkhakkhandha` = khối khổ (iti91:2.6, an3.40:1.9, ud1.1:2.13 — 8 chỗ, đều "khối khổ").
  `aparaddho` = đã đi lệch, đã sụp đổ (sn4.1:3.4 "đã đi lệch khỏi con đường thanh tịnh"); ở đây
  ngữ cảnh là khối khổ tan rồi, nên dịch "khối khổ đã tan rồi". `dukkhajāta` = sinh ra trong khổ.
  BẤT ĐỊNH ĐÃ GHI: `Tassa me dukkhajātassa` là "với tôi, kẻ sinh trong khổ này" — chủ ngữ là
  chính người kệ. Sujato đọc thành "I've suffered, but now". Tôi theo Pāli vì `tassa … dukkhajātassa`
  là danh từ chỉ người nói, và thêm "Ta, kẻ sinh trong khổ này," cho đúng chủ thể.
  Dòng kết 1.5 giữ HAI dấu lược như Pāli. Vì `cần` RỖNG, tôi tự quét MỌI khoá — sạch. Không
  chạy npm (đợt này cấm) nên technical_integrity = 9.6.
