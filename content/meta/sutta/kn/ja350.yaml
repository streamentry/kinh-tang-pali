notes: |-
  Jaṭaka 350, `Devatāpañhajātaka`, bài thứ 10 — cũng là bài cuối — của
  `Cūḷakuṇālavagga` trong `Catukkanipāta`. 34 khoá, tất cả đã dịch.

  TRA TIỀN LỆ BẰNG SỐ ĐẾM ĐƯỢC, KHÔNG ĐOÁN. Dùng `grep -rho … | sort | uniq -c |
  sort -rn` và một chỉ mục Pāli tự dựng bằng script, không dựa vào trí nhớ. Ba nơi đã có
  tiền lệ và bản này DÙNG LẠI NGUYÊN VĂN: `Jātaka` → “Jātaka”; `Catukkanipāta` → “Bộ Bốn Bài
  Kinh”; `Cūḷakuṇālavagga` → “Phẩm Cūḷakuṇāla”. `Tassuddānaṁ` → “Tóm lược:” (tiền lệ `sn36.20`);
  `Atha vagguddānaṁ` → “Và tóm lược các phẩm:” (tiền lệ `ja150`, `ja250`); `…jātakaṁ …ṁ` →
  “Kinh …, thứ …” (tiền lệ `ja341`–`ja349`). Tên tập `:0.4` giữ Pāli như “10. Kinh Arañña”,
  “9. Kinh Sandhibheda”.

  DẤU LƯỢC — không có `…pe…`; không phát sinh chính sách.

  BỐN CÂU HỎI CỦA BÀI. Bốn khối trong `ja350:1.1–4.5` là bốn đáp án cho câu hỏi
  `kaṁ tena tvābhipassasi` “theo ngươi thấy, điều nào được vua yêu thích?”. Ba khối đầu có
  cùng nhịp `X hành vi … / Sa ve rāja piyo hoti, / kaṁ tena tvābhipassasi`, và cả ba cặp Pāli
  `Sa ve rāja piyo hoti,` lẫn `kaṁ tena tvābhipassasi”.` trùng nguyên văn — **cùng một bản Việt**
  (đếm được: 3 cặp + 3 cặp). Khối thứ tư đổi nhịp (`Te ve rāja piyā honti;` + `Kaṁ tena
  tvābhipassasī”ti.`) nên dịch theo nhịp riêng của nó, không ép cho giống.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `kaṁ tena tvābhipassasi` — `tena` là cách thức (“bằng điều ấy”), nên câu này hỏi: với hành vi ấy,
  theo ngươi thấy thì điều nào được vua yêu? Dịch “theo ngươi thấy, điều nào được nhà vua yêu
  thích?” — giữ “nhà vua” (xưng ngô ba) vì `rāja` ở đây là chủ tể được nói về, không phải
  người nói chuyện (người nói là kẻ hầu `sārathi`, mà câu kệ trong lát cắt bỏ không có lời thoại
  nào). `mukhañca parisumbhati` (1.2) = bịt kín miệng lại, nên dịch “còn miệng thì bịt kín” chứ
  không dịch thành “nói to”. `abhūtena abbhakkhāti` (3.1) = buộc tội **người khác** bằng điều
  không có thật; `alikenā abhisāraye` = đẩy điều giả dối về phía người khác. `Aññadatthuharā`
  (4.3) = kẻ trộm đồ của người khác (không phải “lấy đi những thứ ấy” — cần chủ thể của hành động).

  HAI ĐOẠN `TASSUDDĀNA` — KỲ LẠ, ĐÃ GHI RÕ. `ja350:6.1` (`Tassuddānaṁ`) là mục lục **của
  phẩm**, liệt kê tên hiệu: `Narānaṁ`, `asakkhivasimhavaro`, `Nīliyamaggivarañca`,
  `rasāyasakūṭavaro`, `Arañña`, `sārathi`. Nhưng `:0.4` và `:5.1` của chính bài lại là
  `Devatāpañhajātaka`, và mười bài trong `Cūḷakuṇālavagga` là Kaṇḍarī, Vānara, Kuntinī, Amba,
  Gajakumbha, Kesava, Ayakūṭa, Arañña, Sandhibheda, Devatāpañha. Tức mục lục của Pāli gốc **không
  khớp** với danh sách bài thật. Đây là đặc trưng của bản kinh, không phải lỗi dịch: ta dịch đúng
  những gì Pāli gốc viết, và **không** sửa danh sách cho khớp, không bịa mười tên. Người đọc
  muốn mười tên thật thì có `:0.4` và `:5.1`. `Arañña` (7.4) và `sārathi` (7.4) dịch được vì
  `Arañña` đã có trong tầng Việt và `sārathi` → “người đánh xe” theo ja349; các tên kia thì
  **giữ nguyên dạng Pāli của khoá** (chữ hoa ở đầu danh sách) vì tầng Việt chưa từng dùng những
  tên ấy và quy tắc `lọt_pāli` của `_hvi.py` chỉ cho phép từ Pāli của **chính khoá đó**. `7.1–7.3`
  vì thế gần như nguyên văn — đó là hệ quả có chủ đích của việc giữ fidelity, ghi ra đây để
  người điều phối gộp. Ngược lại, `udāna` phẩm (`:9.1–9.4`) liệt kê đúng năm bài thật
  (Kāliṅga, Pucimanda, Kuṭidūsaka, Kokilā, Cūḷakuṇāla) nên dịch được hết.

  `suppakāsitoti` (9.4) → “là phẩm thứ năm đã được nói rõ ràng”; `Catukkanipātaṁ niṭṭhitaṁ`
  (10.1) → “Bộ Bốn Bài Kinh đã hoàn tất.” — tiền lệ `ja250` dùng “Nhóm Hai Bài Kệ đã hoàn tất.”,
  `ja150` “Nhóm Một Bài Kệ đã hoàn tất.”; bản này giữ “Bộ … Bài Kinh” cho khớp với chính `:0.2`
  của nó (lân cận ja341–ja349 đều dùng “Bộ Bốn Bài Kinh”).

  VĂN PHONG — phần lớn lát là truyện kệ, nhịp câu ngắn; giữ niêm luật kệ ngôn và
  phép lặp mang cấu trúc (bốn câu hỏi–đáp trong mil5.5.2, năm phần của voi trong mil7.5.10,
  năm ẩn dụ liên tiếp trong mil5.5.4) thay vì diễn giải, theo `skill/translation.md` §9.

  `technical_integrity` đặt 9.6 vì bốn cổng kỹ thuật đều xanh (xem mục cuối), chưa đủ
  10.0 vì không ai rà lại bằng con người.

  Bốn lệnh cổng kỹ thuật đã chạy và đều xanh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
