  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `6.1`–`6.2` `Khattiyā bhogī rājāno, anuyantā bhavanti te`: Pāli bài này tách `bhogī` và `rājāno` và đọc `bhavanti` (trực thuyết, `là`), trong khi `mn92:16.21`–`16.22` viết `bhogirājāno` và `bhavantu` (mệnh lệnh, `hãy là`), Sujato `ought follow your rule` (đọc như mệnh lệnh). Tôi dịch đúng hình thái Pāli ghim: `đều là những người theo phò Ngài`, và `bhogī` → quý tộc theo tiền lệ `mn92`. Không đổi theo `mn92`/Sujato vì Pāli bài này không viết như vậy; nếu người biên tập cho rằng `bhavanti` là biến thể của `bhavantu` thì sửa thành `hãy là`. Chưa có chứng cứ độc lập trong tầng.
    · `8.5` `Iti bhāsatha gotama`: `bhāsatha` hình thái ngôi hai số nhiều dùng tôn kính cho một người (`mn92:18.4` có `bhāsasi`). Dịch `Ngài nói như vậy, hỡi Gotama`, không đổi số.
    · `19.3` `Brahmacariyaṁ carissāma` dịch `Chúng con` (lời ba trăm bà-la-môn xin Đức Phật, theo `snp3.7:31.3`) chứ không `Chúng tôi` như `mn92:22.3`; còn `18.3` `Mayampi pabbajissāma` dịch `chúng tôi` vì là lời nói với Sela (theo `mn92:21.3`). Hai bài trước lệch nhau ở chỗ này (mỗi bên 1 khoá), nên tôi phân theo người nghe: với Đức Phật là `chúng con`, với Sela là `chúng tôi`. `21.1`, `21.4` nói với Đức Phật nên `chúng con`.
    · `21.1`–`21.2` `Yaṁ taṁ saraṇamāgamha, ito aṭṭhame cakkhuma`: cấu trúc quan hệ (`yaṁ taṁ` … `ito`), dịch `Từ khi chúng con quy y Ngài, nay là ngày thứ tám` (theo `mn92:28.2`–`28.3`). `aṭṭhame` ở vị trí cách nơi chốn có thể là `vào ngày thứ tám kể từ nay` (đếm không tính hay tính ngày quy y); ghép với `sattarattena` (bảy đêm) cho kết quả nhất quán là tám ngày bảy đêm; Sujato `the eighth day since`. Không có chứng cứ độc lập để phân xử cách đếm.
    · `16.3` `Ko disvā nappasīdeyya`: Pāli không có đại từ tân ngữ, tôi bổ `Ngài` theo `mn92:20.7`, `snp3.7:28.3` (cả hai cùng thêm); đó là tôn xưng chỉ Đức Phật, không thêm nghĩa. `17.2` `gacchatu` dịch `hãy đi đường khác` theo `mn92:20.10`, `snp3.7:29.2` (2/2); `đường khác` là cách nói tự nhiên của `gacchatu`, không phải thêm ý.
    · `22.4` `tiṇṇo tāresimaṁ pajaṁ` dịch `đã qua bờ, và đưa loài người qua bờ` (theo `mn92:28.9`, `snp3.7:40.4`, 2/2; `imaṁ` là `này`, không dịch riêng, như cả hai khoá trước).
    · `24.4` `nāgā`: dịch `các bậc đại tượng` (so sánh các tỳ-kheo với voi lớn, theo `mn92:28.17`, `snp3.7:42.4`); Sujato `giants`. Không giải thích thêm trong thân kệ.

  CỔNG KỸ THUẬT CHƯA CHẠY — lát này bị cấm chạy lệnh npm. Bốn lệnh còn lại để người biên tập chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Nếu một trong bốn lệnh đó đỏ thì technical_integrity không còn đúng và status phải xét lại.
