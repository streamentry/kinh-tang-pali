notes: |-
  PĀLI TRÙNG NGUYÊN VĂN — ĐÃ DÙNG LẠI, KHÔNG DỊCH LẠI. `ja37:2.1` trùng y hệt
  `ja117:2.1` (`Tittirajātakaṁ sattamaṁ.`), nên tôi dùng lại nguyên văn "Kinh Chim Tittira,
  thứ bảy." và `ja37:0.4` trùng `ja117:0.4` nên dùng lại "7. Kinh Chim Tittira". Tên chim Tittira
  lấy từ đúng tiền lệ đó, không phải do tôi đặt.
  `ja37:1.4` (`samparāye ca suggatī”ti.`) trùng nguyên văn `sn1.49:10.4`, nơi tầng đã dịch là
  "còn đời sau là nẻo lành.” — tôi dùng lại đúng nguyên văn ấy. Lưu ý hệ quả: Pāli khoá này kết
  bằng `”ti.` nhưng bản đã có bỏ `ti`; tôi theo bản đã có vì luật Pāli trùng nguyên văn là bất
  biến, và ghi việc này ra đây để người biên tập phán xét thống nhất cho cả hai nơi.
  Thuật ngữ, đếm được. `vuḍḍha` = người lớn tuổi (tiền lệ `vuḍḍhapabbajita` → "xuất gia khi già",
  an5.59/5.60 và mn104). `kovidā` = hiểu biết, rành mạch; tầng có cả "kỹ thuật" và "thành thạo",
  tôi chọn "hiểu biết" cho đọc dễ. `suggatī` = nẻo lành (cùng gốc `sugati`; `sugati` = cõi lành
  ở thí dụ khác nhưng ở đây là "đi đúng đường"). `diṭṭhe dhamme` = ngay trong đời này.
  `Kulāvakavagga` KHÔNG có tiền lệ (0 chỗ), đặt mới "Phẩm Chim Đang Lồng"; Sujato dịch phẩm này
  là "Nests" và tên phẩm tại SuttaCentral là "The Nestling Birds" (ja-name:35.ja-kulavakavagga),
  nên "chim đang lồng" là dịch đúng nghĩa, không phải sáng tác.
  Vì `cần` RỖNG, tôi tự quét MỌI khoá bằng `review.py` — sạch. Không chạy npm (đợt này cấm) nên
  technical_integrity = 9.6.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja37:0.3` mang Pāli `Kulāvakavagga` được
  đổi *«Phẩm Chim Đang Lồng»* → *«Phẩm Tổ Chim»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:35.ja-kulavakavagga` → *"The Nestling Birds"*; chữ *Kurāva* trong cách cũ **không có** trong Pāli `kulāvakavagga`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.
