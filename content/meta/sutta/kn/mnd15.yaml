  Rà từng chữ bằng DPD 2026-10-16: 1347 khoá đã rà; sửa `162.3` (hô cách: `kāmakāmī` là lời gọi vua cướp theo chú giải ja351 và Indacanda, `asassatā bhogino` số nhiều không làm chủ ngữ cùng `kāmakāmī`; nay «Này kẻ ham dục lạc, người có của cải không trường tồn»; `mnd6:40.3` cùng lỗi, ngoài phạm vi), `46.5` (`ajjhositaṁ … anajjhositaṁ` giải `anositaṁ`: chú giải att15 `jarādīhi madditaṁ`, Indacanda «bị áp bức»; «bám chấp» → «chiếm cứ»), `161.2` (thêm ý: `putte ca dāre ca` không có «thơ», «yêu»; `ja351:1.2` ngoài phạm vi), `20.1`–`20.2` (dòng kệ lệch: `jātavedasamo` ở `20.1`, theo att15 và `cnd23:46.1`), `128.4`, `132.3`, `134.4`, `201.3`, `203.1`, `203.6`, `203.10`, `206.3` (`santo` thống nhất «an tịnh» theo B19, khớp câu giải `132.1`–`132.2`, `203.2` và `mnd10:138.4`; `snp4.15:12.4`, `20.3` còn «tịch tĩnh», ngoài phạm vi); bất định `163.3` (`sattuka`: DPD và Indacanda đọc là tên riêng, tầng dịch «kẻ thù»), `148.4`, `152.1`, `152.5`, `154.4` (`upasanto carissasi` «an tịnh» cả tầng, B19 chốt `upasanto` «yên lặng»), `152.2`–`152.4`, `203.2`, `203.5` (`santattā`/`upasamitattā` dịch ngược chiều B19), `137.13`, `189.14` (`diṭṭhasutamutaviññātabba`), `3.8`, `66.2`, `67.3` (`ekāgārika` «nhà vắng», DPD «home invasion», công thức cả tầng), `189.2` (`niṭṭhuriya`: DPD «harsh», chú giải «issukī»).
