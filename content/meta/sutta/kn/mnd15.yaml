notes: |-
  **Phạm vi: đủ 1347/1347 khoá của mnd15, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải `snp4.15` (Attadaṇḍasutta, Kinh Cầm Gậy), thuộc phẩm Aṭṭhakavagga, cấu trúc như `mnd9`, `mnd10`, `mnd13`: dẫn từng đoạn kệ in đậm (20 đoạn: `2`, `30`, `37`, `51`, `58`, `81`, `88`, `94`, `104`, `114`, `121`, `128`, `135`, `142`, `148`, `155`, `168`, `188`, `194`, `201`), giải từng cụm, rồi nhắc lại cả đoạn kệ trong nháy kép (20 lần: `29`, `36`, `50`, `57`, `80`, `87`, `93`, `103`, `113`, `120`, `127`, `134`, `141`, `147`, `154`, `167`, `187`, `193`, `200`, `206`); 20 lần lời dẫn *Vì thế, Đức Thế Tôn đã nói—* (`28`, `35`, `49`, `56`, `79`, `86`, `92`, `102`, `112`, `119`, `126`, `133`, `140`, `146`, `153`, `166`, `186`, `192`, `199`, `205`). Các đoạn trích: ví dụ nhà vua trừng phạt và đại địa ngục (`3`–`24`, trong đó `9`–`23` là 15 khổ kệ mô tả đại địa ngục), kệ về hai điều lạc (`42`–`44`), kệ tám pháp thế gian (`47`), bảy mũi tên (`54`–`78`, kèm ví dụ ở Sāvatthī `71`–`75`), kệ bố thí vì Niết-bàn (`99`–`101`), kệ về sự mất mát (`161`–`163`), đối thoại với vị thiên tử (`164`–`165`), các đoạn kinh về thân không phải của các ông, rừng Jeta, vị tỳ-kheo tìm kiếm sắc, thế gian trống rỗng (`170`–`183`), kệ Mogharāja (`172`), kệ Vajirā (`178`–`180`). Pāli có 247 khoá mang thẻ in đậm, bản Việt không mang thẻ. Dấu lược `…`: 319 khoá (86 khoá có `…pe…`, đều thành đúng một `…`; 233 khoá chỉ có `…` trần), mỗi khoá có đúng một dấu như Pāli; 285 khoá Pāli kết bằng `…`; 0 khoá có `(…)`; 0 khoá Pāli kết `….`. Nháy: Pāli có 88 khoá chứa “ và 88 khoá chứa ”, 17 khoá chứa ‘ và 17 khoá chứa ’, 2 khoá chứa ngoặc đơn (`201.5`, `206.5`, đều là *(Iti bhagavā.)*, dịch *(Đức Thế Tôn nói như vậy.)* theo `mnd13:139.5`); bản Việt khớp Pāli từng khoá (0/1347 lệch cả bốn loại nháy và ngoặc đơn).

  **Tên bài.** `0.1`, `0.2`, `1.1` theo `mnd9`, `mnd13` (*Đại Tập Kể Lược*, *Kể Lược Phẩm Tám Kệ*, *Giờ đây, sẽ nói phần Kể Lược Kinh …—*); `0.3` ghi *15.* rồi *Kể Lược Kinh Cầm Gậy*, `207.1` là *Kể Lược Kinh Cầm Gậy, thứ mười lăm*, cùng khuôn với `mnd13:0.3` và `mnd13:160.1`. Tên kinh theo `snp4.15:0.2` (*Kinh Cầm Gậy*); tiêu đề Anh của Sujato cho phần chú giải này (tệp tên `mnd-name`) là *Exposition of the Discourse on Taking Up Arms*.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd15`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho `kn/mnd/mnd15` và tệp tên `mnd-name` (chỉ có tiêu đề các bài); không có tệp `mnd15_translation-en-sujato.json`. Lớp `english-project` không có `mnd15`; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự, bỏ khối `0.x`) là **385** khoá (383 nếu bỏ thẻ in đậm trước khi đếm); Sujato phủ 0/385, `english-project` 0/385, `vietnamese-current` 0/385. Ba tầng vắng hết ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`; không nâng điểm để né blocker, và entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.15` (*Taking Up Arms*) có trong tầng đã ghim nhưng là bản của **bài khác** (bài kệ), nên không tính là đối chiếu English của mnd15; nó chỉ được dùng để đọc cú pháp các dòng kệ. Chứng cứ độc lập còn lại là bản Việt đã dịch của `snp4.15` và các đoạn chú giải trùng công thức ở `cnd5`, `cnd8`, `cnd15`, `cnd16`, `cnd19`, `cnd20`, `mnd1`, `mnd3`, `mnd4`, `mnd6`, `mnd7`, `mnd9`, `mnd11`, `mnd13`, cùng các bản kinh `mn2`, `mn51`, `mn87`, `mn129`, `dn8`, `sn2.18`, `sn5.10`, `sn22.33`, `ja351`, `an9.42`.

  **Tiền lệ, đo chứ không đoán.** 358 khoá của mnd15 có Pāli trùng nguyên văn ở nơi khác trong tầng; 308 khoá dùng lại nguyên văn bản Việt đã có, 50 khoá khác có chủ ý, theo bảy lý do: (1) 13 khoá là dòng kệ viết lại cho khớp từng dòng Pāli và cách dịch đã chọn cho cả bài, thay cho bản dịch `snp4.15` hoặc `dhp367` có dòng lệch hoặc dùng từ khác (`36.3`, `87.2`, `87.4`, `93.3`, `103.3`, `111.13`, `141.2`, `147.3`, `167.2`, `167.3`, `187.3`, `206.2`, `206.3`); riêng `snp4.15:7.3`–`7.4` và `8.3`–`8.4` đang để phần Việt lệch một dòng so với Pāli — **báo chứ không sửa**; (2) 4 khoá viết hoa *Ta* khi chính Đức Thế Tôn tự xưng (`27.3`, `34.3`, `57.3`, `193.3`); (3) 8 khoá kệ trích mà bản Việt cũ dịch theo cú pháp khác dòng Pāli ở đây (`42.3`, `43.2`, `43.3`, `44.2`, `44.3`, `47.1`–`47.3`; nguồn `sn6.6`, `sn1.66`, `sn5.7`, `thig8.1`, `an8.6`, `ja329`); (4) 4 khoá đổi ngôi hoặc thể, vì ở nguồn là lời tự thuật hoặc lời của người khác (`85.1`, `85.8`, `87.5` theo `cnd9:6`, và `164.8` theo `dn16:4.27.11`); (5) 10 khoá thống nhất thuật ngữ trong bài (*người ấy* thay *vị ấy* cho kẻ bị hành hình ở `8.8`–`8.9`; *thế giới* thay *thế gian* ở `38.3`; *tham đắm* thay *lòng tham* cho `gedha` ở `122.2`, `189.9`, vì kệ của chính bài này dịch `gedha` là *tham đắm*; *thọ* thay *cảm thọ* ở `174.7`, `174.22`; *không dao động* thay *bậc bất động* cho `anejo` ở `190.5`, `195.5`; *tịch tĩnh* cho `santo` ở `203.6`); (6) 5 khoá đổi *sanh* thành *sinh* và *chồng* thành *khối* ở đoạn Vajirā (`178.3`, `178.4`, `179.4`, `180.1`, `180.3`; nguồn `sn5.10`); (7) 6 khoá cắt hoặc ghép khác nguồn (`165.3`, `170.7`, `170.8`, `174.13`, `203.4`, `203.5`). Trong chính bài có 153 nhóm Pāli trùng nguyên văn (381 khoá) và **chỉ 1 nhóm** mà Việt khác: `73.2` và `74.7` (cùng Pāli, nhưng người mất là mẹ ở `73` và vợ ở `74`, nên Việt theo ngữ cảnh). Nhiều đoạn dài có song song trực tiếp nên được dịch bám sát bản Việt đã có để cùng một công thức không thành hai cách: bảy chủng trừng phạt và đại địa ngục theo `mn129`; danh sách bệnh và khổ theo `mnd1:70` và `cnd8:28`; ngã mạn mười cách theo `mnd3:55`; hư vọng theo `mnd3:54`; nói dối theo `mnd7:48`–`49`; hành trình tìm của cải theo `mnd7:57`–`59`; hành giả khổ hạnh theo `dn8:14` và `mn51:8`; các câu hỏi `ahosiṁ nu kho` theo `mn2:7`; chuỗi chú giải khô héo quá khứ, vị lai, hiện tại theo `cnd15:23`–`28`; hư không, tham ái chấp thủ theo `cnd16:17`; giảm suy theo `cnd20:13`; trống rỗng theo `cnd19:42`–`54` và `cnd19:67`.

  **Thuật ngữ, kèm số đếm (khoá / tệp).** `vedagū` → *bậc đạt minh* (`mnd`/`cnd` 34/3, so với *đạt tri* 5/3; `snp4.15:13.1` ghi *đạt tri*). `pañca kāmaguṇā` → *năm dục lạc* (`mnd`/`cnd` 11/7; *dục trưởng dưỡng* 5/1, chỉ ở `mnd13`). Chuỗi `brūmi ācikkhāmi desemi …` → *Ta nói, Ta giải thích, Ta giảng dạy, Ta trình bày, Ta an lập, Ta khai thị, Ta phân tích, Ta làm cho hiển lộ, Ta công bố* (*khai thị* ở `mnd`/`cnd` 72/21; *khai mở* chỉ 2/2, ở `mnd12:31.3` và `mnd13:11.4` — **báo, không sửa**). `daṁsa` → *ruồi trâu* (`mnd`/`cnd` 7/5; *ruồi mòng* 1/1 ở `mnd7:57.1`, nơi có đoạn Pāli trùng — khác nhau nên ghi cả hai số, và bài này theo đa số). `vevicchā` → *xan tham* (14/6) và `macchariya` → *keo kiệt* (83/15; *bỏn xẻn* chỉ 20/1, ở `mnd11`): giữ hai từ khác nhau trong cùng bài như `cnd5:12`; `snp4.15:7.4`, `20.3` dịch cả hai thành *bỏn xẻn*, nên `vītamaccharo` ở đây ra *lìa keo kiệt*. `atimāna` → *quá mạn* (16/3, đồng nhất với danh sách bảy loại mạn ở `mnd3:55.21`), không dùng *kiêu mạn thái quá* của `snp4.15:8.4`. `duccarita` → *ác hạnh* (85/23; *tà hạnh* 4/3). `nirayapāla` → *ngục tốt* (tầng 50/3; *ngục giữ* 8). `anudisā` → *phương phụ* (31/12). `vessa`, `sudda` → *Phệ-sa*, *Thủ-đà* (25/12). `upadhi` → *sanh y* (73/17). `kathaṅkathā` → *nghi hoặc* (như `mnd11:37.2`), `vicikicchā` → *hoài nghi*, `kaṅkhā` → *nghi ngờ* (ba từ khác nhau). `pheṇapiṇḍa` → *quả bọt* theo `cnd19:45.2` và `sn22.95` (*quả bọt* 1/1 ở `mnd`/`cnd`; *khối bọt* 6/2 ở nơi khác). `phandati`, `vedhati`, `pavedhati`, `sampavedhati` → *run rẩy*, *rung động*, *rung chuyển*, *rung chuyển dữ dội* (giữ một dãy nhất quán trong bài; `cnd18:9.7` dịch `vedhati` là *run rẩy*, nên tầng chưa thống nhất).

  **Số Pāli tự tính.** `sataṁ vā sahassaṁ vā satasahassaṁ vā` (`5.3`) = 100, 1.000, 100.000 → *một trăm, một ngàn, một trăm ngàn* (như `Kappānaṁ satasahassaṁ` ở tầng). `catunnaṁ daṇḍānaṁ` (`6.7`) = 4; `pañcavidhabandhanaṁ` (`7.2`) = 5; `yojanasataṁ` (`10.3`) = 100 do-tuần; `vīsativatthukā` = 20, `dasavatthukā` = 10 (hai lần), `dvāsaṭṭhi` = 62 (`63.2`–`63.3`); `satta sallāni` = 7 (khớp đủ bảy mục ở `54.6`); `dvādasāyatanāni` = 12 (`131.2`); `cattāro ānisaṁse` (`191.2`) = 4, khớp bốn phần của kệ (`aniṭṭhurī`, `ananugiddho`, `anejo`, `sabbadhi samo`); `aḍḍhamāsika` = nửa tháng; các chuỗi một đến mười cách của ngã mạn (`107`) khớp từng mục. Không gặp cụm số chưa phân xử (không có `tiṁsakappasahassa`).

  **Bất định (không đưa vào thân kinh).** (1) `attadaṇḍā` (`2`, `24.6`) dịch theo `snp4.15:1.1` *kẻ cầm gậy*; ở phần chú giải (`3.15` và các khoá lặp) `attadaṇḍato` dịch *từ việc tự mình cầm gậy*, vì ở `3.4` chú giải đồng nhất `daṇḍa` với ác hạnh thân, lời, ý; hợp từ có thể đọc là *gậy của chính mình*. (2) `osāne tveva byāruddhe` (`51`–`52`): đọc theo chính chú giải (`osāpeti` *làm chấm dứt*: già chấm dứt tuổi trẻ…, `byāruddha` *bị đối nghịch*) thành *Nhưng đến chỗ kết thúc, họ vẫn bị đối nghịch*, khác `snp4.15:4.1` *ngay tại chỗ trú, họ vẫn xung đột* (đọc theo *settlement* của Sujato). (3) `sikkhānugīyanti` (`81`–`82`): vì `82.2` định nghĩa `sikkhā` là các môn học đời (voi, ngựa, xe, cung…) nên dịch *các môn học được tụng đọc*, khác `snp4.15:6.1` *các phép tu học*; `nibbijjha` dịch *xuyên thấu* (theo `paṭivijjhitvā` ở `84.2`) thay *nhàm chán* của `snp4.15:6.4`. (4) `82.2`: `sālākiya`, `sallakattiya`, `kāyatikiccha`, `bhūtiya`, `komārabhacca` dịch theo cách tầng đã dịch `sālākiyaṁ sallakattiyaṁ` ở `dn2:62`; riêng `bhūtiyaṁ` dịch *thuật trừ quỷ* chưa có chứng cứ độc lập. (5) `121`–`124`: `ājavaṁ` giữ *dòng xoáy* của `snp4.15:11.2`, `ārammaṇaṁ` dịch *chỗ dựa* và `pakampanaṁ` *sự rung động*, khác `snp4.15:11.3` *sự bám víu, sự sắp đặt*; chú giải chỉ nói cả hai đều là tham ái. (6) `42.3`: `rūpe raṇaṁ disvā sadā pavedhitaṁ` theo `sn6.6:6.3` *thấy sự tranh chấp nơi sắc*; nghĩa của `raṇa` ở đây chưa phân xử chắc. (7) `75.5`: `attānaṁ opāteti` dịch *tự gieo mình xuống*; `mn87:22.7` ở chỗ song song ghi `upphālesi` (mổ bụng). (8) `144.35`: năm biến thể của `nājjheti` (`najjheti`, `ajjheti`, `upanijjhāyati`, `nijjhāyati`, `pajjhāyati`) dịch bằng năm từ gần nhau *ủ ê, ưu tư, u uất, trầm ngâm, nghĩ ngợi*; ánh xạ từng từ chưa chắc. (9) `158.1`: `asatāya dukkhāya vedanāya` dịch *khổ thọ không dễ chịu*, coi là `asātāya`. (10) `31.72`–`73`: `lohitena`, `pittena` tách riêng dịch *xuất huyết*, *bệnh mật*; `mnd1:70.13` gộp `lohitapitta` thành *xuất huyết*. (11) `98.2`: `pariveṇaṁ sammajjanto` *quét dọn sân tu viện*, `cetiya` *bảo tháp*. (12) `190.6`: `calati`, `vedhati` dịch theo dãy *lay động, rung động, rung chuyển* của bài này, khác `cnd18:9.7`.

  **Kỹ thuật.** Bài chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát này bị cấm chạy cổng); vì vậy `technical_integrity` đặt 9.6 và không tuyên bố technical gate đã qua. Khi chạy các lệnh đó và nếu có lỗi thì hạ điểm hoặc sửa. Bài giữ `draft` với blocker nêu trên; việc áp dụng waiver `no-upstream-english` (nếu người biên tập muốn) làm riêng bằng lệnh của kho, không sửa tay.

  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại toàn bài từ Pāli, không xem bản dự án; so 294 khoá chênh lệch lớn nhất (cả 1347 khoá còn lại chênh ít hơn), đọc từng khoá cạnh Pāli và khoá liền kề. Khác nghĩa 11: sửa 1, giữ 7, bất định 3. **Sửa 1.** `152.3`: Pāli `dosassa santattā samitattā upasamitattā …pe…` còn ba vị từ, bản dự án chỉ có *do sân …* (mất *đã được làm yên lặng, làm an hòa, làm an tịnh*, trong khi `152.2` dịch đủ cho `rāga` và `203.3` mới chỉ có `dosassa …pe…`); nay *do sân đã được làm yên lặng, làm an hòa, làm an tịnh …*, theo `152.2`, vẫn đúng một dấu `…`. Đây là chỗ duy nhất bản Việt ngắn hơn Pāli rõ rệt khi đếm từ (tỉ lệ 0,4; bốn khoá khác ở 0,8, `131.3`, `137.4`, `190.9`, `195.10`, đã đủ nghĩa Pāli). **Giữ 7.** `42.2` `uttariyaṁ disāya` *về phương bắc* (bản mù *vượt lên khắp các phương* sai; cùng kệ ở `sn6.6:5.4`, `6.2` ghi `uttarassaṁ disāyaṁ`, phương bắc); `4.2` `savacanīyampi karoti` *buộc người ấy phải chịu lời ràng buộc* (bản mù *hạch hỏi* không khớp `4.3` *ngươi không được rời khỏi nơi này*); `6.3` tên các hình phạt, bản mù thêm *chua* ở `bilaṅgathālika` và *nước kiềm* ở `khārāpatacchika`, còn bản dự án theo `mn129:4.2` (*kiểu nồi cháo*, *kiểu muối chua*) khi các bài khác trong tầng (`cnd23:31.3`, `mn14:13.3`) viết *nồi cháo chua*, *cạo da bằng chất kiềm* — tầng chưa thống nhất nên giữ, báo ngoài lane; `82.2` các môn học, theo cách dịch `sālākiya`, `sallakattiya` ở tầng; `174.12`–`13` `harati` *gom lấy* (tầng 3 chỗ *gom lấy*, 2 chỗ *mang đi*, giữ theo đa số); `189.2` `niṭṭhuriya` *tàn ác* (bản mù *cay nghiệt*; theo `snp4.15:18.1`); `118.2` `ākāsaṁ vuccati taṇhā` *hư không* (bản mù giữ nguyên `ākāsa`; chú giải chơi chữ với `ākassati`, nên dịch được). Bản mù còn lệch nguyên một dòng kệ ở `155.2`, `172.1`–`3`, `175.1`–`3`, `176.1`–`2` (đặt dòng này vào chỗ dòng khác); Pāli khớp bản dự án từng dòng nên không tính là bất đồng. Các khoá còn lại chỉ khác diễn đạt (*xan tham/keo kiệt*, *tịch tĩnh/an tịnh*, *run rẩy/giãy giụa*, *kết sinh/tái tục*, *Mâu-ni/muni*). **Bất định 3 (không đưa vào thân kinh).** `75.5` `attānaṁ opāteti` *tự gieo mình xuống* (đã ghi ở mục bất định 7; bản mù *tự đâm mình*, còn `mn87:22.7` ghi `upphālesi`); `163.3` `sattuka`, tầng dịch *này kẻ thù* theo `ja351:3.3` và `mnd6:41.3`, bản mù coi là tên riêng và tự ghi bất định; chưa tra được nghĩa chắc trong tầng Pāli ghim; `144.35` năm biến thể `nājjheti` (đã ghi ở mục bất định 8, bản mù cũng ghi bất định). Review đối kháng toàn bài: tập khoá, thứ tự, nháy kép, nháy đơn, ngoặc đơn và dấu lược đều khớp Pāli từng khoá (0/1347 lệch); số lượng (`tayo`, `catunnaṁ`, `pañca`, `satta`, `tīhākārehi` … `aṭṭhahākārehi`, `dasavidhena`) khớp; không phát hiện thêm lỗi nghĩa. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt từng khoá 1347/1347; đoạn song song dn23, mn129/130, mn87, mn51, mn94, dn25, sn2.18, ja351, snp4.15; không có bản Việt nguyên bài độc lập, không có bản Anh): sửa 5 khoá. `66.6`: `laddhā ārakkhamūlakampi` là "sau khi được thì cảm thọ khổ ưu do giữ gìn", bản cũ thêm ý nhượng bộ "dù đã được… vẫn" không có trong Pāli. `69.1`: Pāli có mười một mục ăn, bản cũ chỉ có mười (mất `tilabhakkho`, vì `mn51` chỉ có mười mục); nay `piññāka` "bã mè" (theo `dn25:8.8`), `tila` "hạt mè". `152.4`: Pāli có tám vị từ (`santattā … paṭipassaddhattā`), bản cũ bảy (mất `upasamitattā`), nay thêm "làm an tịnh"; dãy `santo upasanto vūpasanto nibbuto paṭipassaddho` đồng nhất với `132.2`, `203.5` (tịch tĩnh, an tịnh, lắng dịu, tịch diệt, yên lặng; bản cũ gán `nibbuto` là "tịch tĩnh" ở `152.4`); `152.4` và `203.5` đổi `nibbutattā` "làm tịch tĩnh" thành "làm tịch diệt" cho khỏi trùng `santo`. `6.3`: phân xử theo PED. `bilaṅgathālika` PED p. 487 "gruel-pot" (bilaṅga = cháo chua), nên "kiểu nồi cháo" ĐÚNG, giữ; `khārāpatacchika` PED p. 236 `khāra` = "alkaline substance, potash, lye" (chất kiềm), không phải muối chua, nên sửa thành "kiểu cạo bằng chất kiềm" (khớp `cnd23:31.3`); `mn129:4.2` và `cnd20:10.5` còn "kiểu muối chua", ngoài lane, cần người biên tập thống nhất. Giữ: `8.1` `saṁvesetvā` "áp xuống" theo `mn129:11.1` (`an3.36:14.1` ghi "bắt nằm xuống", tầng chưa thống nhất); `130.4` `sa brahmā` vẫn ghi "bà-la-môn" như `mnd13:88.3` (Pāli là brahmā, nghĩa chưa chắc); `33.3` `leḍḍu` "đá" theo `mnd9:114.4` (nghĩa gốc cục đất). Bất định giữ như các mục trước (`75.5`, `163.3`, `144.35`); không gặp thêm lỗi nghĩa, số lượng, phủ định hay chủ thể.

  Quyết định hội đồng biên tập 2026-10-16: B1 — `165.4` (`visattikā` = “sự vướng mắc ở đời”; `tare` = “có thể vượt qua”); B8 — `85.6` (`āvajjana` = “hướng tâm”; `abhiniropana` = “gắn tâm”); B19 — `132.1`, `132.2`, `152.4`, `203.2`, `203.5` (`santo` = “an tịnh”, `upasanto` = “yên lặng”).
