notes: |-
  **Nguồn.** Pāli root từ snapshot bilara đã ghim `11c9d708978cde8ba61096d8a75f7ddfb846f639`, đường dẫn `kn/cp/cp22_root-pli-ms.json`, 73 khoá (`:0.1`–`:0.4` tiêu đề, `:1.1`–`:17.4` thân bài 17 bài kệ, `:18.1` dòng kết). Bản Việt viết đủ 73/73 khoá, đúng thứ tự Pāli, không khoá thừa. `translation/vi/phantuananh/` chỉ có Pháp Cú nên không có bản Việt hiện hành để đối chiếu.

  **Coverage English (đo thật).** Tệp Sujato `cp22_translation-en-sujato.json` có trong manifest đã ghim và có trên đĩa: 72/73 khoá có chữ, khoá rỗng duy nhất là `:18.1` (dòng kết số thứ tự, như mọi bài `cp`). Riêng thân bài `:1.1`–`:17.4` là 68/68 và tiêu đề `:0.1`–`:0.4` là 4/4. **Mẫu số của cổng = 0**: không khoá Pāli nào đạt 40 ký tự (dài nhất 28), nên cổng coverage không đo được gì và không có gì để ghi vào `reference-gaps.yaml`; con số 68/68 là phép đo thô trên khoá thân bài, không phải số của cổng. `english-project` không có tệp cho bài này. Sujato được đọc **sát cạnh Pāli** ở mọi khoá thân bài; không có tầng Việt hiện hành.

  **Tiền lệ trong `cp` và toàn kho (đếm bằng khớp Pāli nguyên văn).** Tái dùng nguyên văn 9/73 khoá: `0.1` *Hạnh Tạng* (28/29 bài; 1 bài ghi *Cariyāpiṭaka*), `0.2` *Phẩm Yudhañjaya* (12/12), `1.1` *“Lại nữa, vào thời thuở nọ,* (14/22 bài), `1.2` *ở kinh thành Indapatta tối thượng;* (`cp3`), `11.3` *Nghe lời nói ấy,* (3/3), `14.1` *Ta nói với họ như vậy,* (1/1), `16.4` *ta xuất gia sống đời không nhà.* (3/5, còn lại *rồi xuất gia…* và *tôi xuất gia…*), `17.3` *Mà vì Nhất Thiết Chủng Trí là điều quý báu nhất đối với ta,* (4/5; một bài khác viết *tôi thương yêu điều toàn biết*) và `17.4` *chính vì thế ta đã từ bỏ ngai vàng.”* (2/2). `0.3` theo khuôn `cp21`/`cp23`/`cp24`: *Xuất Gia Ba-la-mật Thứ Hai*; `0.4` và dòng kết theo `cp21`: *Hạnh Của Thái Tử Somanassa* / *Hạnh của Thái tử Somanassa, thứ hai.* Pāli trùng nguyên văn **trong chính bài**: 0 cặp, nên phép so trùng nội bộ chạy rỗng.

  **Ngoặc và dấu lược.** Pāli mở `“` ở `1.1`, đóng `”` ở `17.4`; lời cha dặn (`7.1`–`7.4`), lời Bồ-tát (`8.3`–`8.4`), lời đạo sĩ (`9.3`–`9.4`), lời vua (`10.3`–`10.4`, `12.1`–`12.4`) và lời Bồ-tát với đao phủ (`14.3`–`14.4`) nằm trong nháy đơn `‘…’`; bản Việt khớp Pāli từng khoá (0 lệch trên 73 khoá). Bài không có `…`/`…pe…`/`(…)` ở Pāli, bản Việt cũng không có. Sujato đặt nháy đơn quanh `5.1`–`5.4` (ý nghĩ của Bồ-tát) nhưng Pāli **không** có nháy ở đó nên bản Việt không thêm.

  **Số.** Chỉ có `catukhaṇḍikaṁ` (`12.2`) = *catu* 4 → *bốn khúc*; `dutiyaṁ` (`18.1`) và `Nekkhammapāramī 2` (`0.3`) = thứ hai. Không có cụm số mơ hồ.

  **Thuật ngữ (đếm tiền lệ).** `kalyāṇapaṭibhānavā` → *có tài ứng đối tốt đẹp* (cùng gốc `dn23` *khéo ứng đối*, `dn31` *có tài ứng đối*). `saṅgahesu` → *các nhiếp pháp* (`dn30`, `dn33` dịch `saṅgahavatthu` là *nhiếp pháp*; Sujato *methods of inclusiveness*). `kuhaka` → *kẻ lừa đảo* / *đạo sĩ lừa đảo* (`ja89` *Kẻ Lừa Đảo*; `an5.83`, `an5.90` dùng *lừa gạt*). `khamanīyaṁ` → *dễ chịu* (`mn143:3.2`, `mn128`). `sukkadhamma` → *pháp trắng* (`iti42:0.4`). `sabbakāmada` → *ban cho mọi điều mong muốn* (`an8.47`, `ja278`). `paccanta` → *biên địa* (`dn28`, `dn33`). `gahapati` → *gia chủ*. `mahārajja` → *ngôi vua lớn* ở `16.2` và `17.1`; `17.4` `rajjaṁ` giữ *ngai vàng* theo nguyên văn tiền lệ nên hai chữ cùng chỉ ngôi vua.

  **Bất định đã phân xử (ghi ở đây, không thêm vào thân kinh).** (1) `3.1` `patikaro` — nghĩa không có tiền lệ trong tầng; tôi theo Sujato (*favored by the king*) và dịch *được vua ấy ưu ái*. (2) `11.2` `kumāro yathā nāsiyo` — `yathā` có thể là *rằng* hoặc *như thế nào*; tôi dịch *rằng thái tử đáng bị trừ diệt*, trùng nghĩa Sujato *how the prince deserved execution*. (3) `14.4` `rājakiriyāni atthi me` — Sujato *an issue for the king*; tôi giữ sát chữ *những việc liên quan đến nhà vua* để không đoán thêm nội dung lời xin. (4) `15.2` `pāpassa pāpasevino` — đi với `rañño`; Sujato đọc *follower of the wicked one* (quy về đạo sĩ), tôi giữ *vị vua xấu ác, thân cận điều ác* sát Pāli. (5) `12.4` `jaṭilahīḷitā` — đọc là *kẻ khinh miệt đạo sĩ bện tóc* theo Sujato; cách đọc *bị đạo sĩ bện tóc khinh miệt* về cú pháp không loại trừ được hẳn, nhưng ngữ cảnh (đạo sĩ vừa bị xúc phạm) ủng hộ cách đầu. (6) `5.3` `Hirīsukkadhammajahito` — tôi giữ cấu trúc hợp từ mở bằng *các pháp trắng của lòng hổ thẹn*, không tách `hirī` thành một hạng mục riêng. (7) `16.3` `Sohaṁ tamaṁ dālayitvā` — `tamaṁ` *bóng tối* (vô minh/mê muội), tôi không thêm chữ giải thích. (8) `4.1`–`5.4`: Pāli không có dấu nháy và không có động từ *nghĩ*, nên bản Việt kết `4.4` bằng dấu chấm và để `5.1` mở một câu mới.

  **Kiểm tự động trong phiên (không phải cổng của kho).** Tập khoá Việt = tập khoá Pāli (73/73, cùng thứ tự); mọi giá trị NFC, không rỗng, không khoảng trắng thừa; không từ Pāli lọt sang tiếng Việt ngoài tên riêng *Yudhañjaya*, *Indapatta*, *Somanassa*; đã in từng cặp Pāli↔Việt↔Sujato ra đọc đối kháng. Chưa chạy bốn lệnh cổng của kho nên **không** tuyên bố technical gate pass: `technical_integrity` đặt 9.6 và còn phải chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`.
