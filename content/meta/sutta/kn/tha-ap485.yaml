notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng ở bài này. Đối chiếu tiền lệ chỉ với bản Việt của chính dự án cho cùng bộ `tha-ap`.
  Coverage English: mẫu số = 1 (chỉ `:20.1` đạt ngưỡng 40 ký tự theo `source/layers.yaml`, 63 ký tự; 75 khoá thân bài, mỗi vế kệ chỉ 18-26 ký tự), Sujato phủ 0/1. Với mẫu số nhỏ như vậy, cổng coverage gần như không đo được gì, và việc `content/meta/reference-gaps.yaml` chưa có entry cho uid này cần được coordinator xử lý bằng `npm run reference:gaps`; có entry cũng không cứu được `published`.
  Pāli trùng nguyên văn: 35 khoá có tiền lệ trong tầng `tha-ap` (4.254 cặp), dùng lại nguyên văn bản Việt ở 24 khoá và cố ý khác ở 11 khoá. Trong chính bài có 2 nhóm Pāli trùng nguyên văn: `bhisadānassidaṁ phalaṁ.` ở `:13.4` `:14.4` `:16.4` (ba khoá dịch giống hệt nhau) và `…pe…` ở `:17.2` `:18.2` `:19.2` (ba khoá đều là một dấu `…`); không có cặp trùng nào trong bài mà Việt khác nhau.
  Cố ý khác tiền lệ, có đo: (1) `nisinnako santo` ở `:11.3` dịch là đang ngồi, khác tiền lệ duy nhất "ngồi xuống ngay tại đó" (không có động từ nào chỉ động tác ngồi xuống). (2) `Kaḷevaraṁ me patitaṁ` ở `:12.3` dịch là thân xác tôi đã ngã xuống, khác 2 tiền lệ (tha-ap56:4.3, tha-ap434:4.3) coi `Kaḷevara` là tên riêng "đã tìm đến ta"; `kaḷevara` là thân xác, thi thể. (3) `Satasahassito kappe` ở `:16.1` dịch "một trăm ngàn kiếp" (không "đại"): trong tầng `tha-ap`, cùng Pāli này có 28 nơi, 19 nơi viết "đại kiếp" nhưng Pāli chỉ có `kappa`; đo chung mọi khoá chứa `kappe` thì "kiếp" 389 so với "đại kiếp" 55, trong phạm vi tha-ap440-540 là 42 so với 26. (4) `sambuddho` dịch "Đức Chánh Đẳng Giác" thay cho "bậc Tự Tại Giác" ở `:8.1`. (5) `anumodanaṁ` ở `:6.4` dịch "lời tùy hỷ" (an5.44 dùng "lời tùy hỷ" cho `anumodanīya`); tiền lệ duy nhất của dạng này ở tha-ap343:6.4 "không hề mỏi mệt, đây là lời hoan hỷ của ta" thêm ý mỏi mệt không có trong Pāli.
  Đại từ: dùng "ta" xuyên suốt, kể cả trong lời thỉnh cầu `:5.1`. Đo ở phạm vi gần nhất tha-ap440-540: thiên về "ta" 53 so với "tôi" 21 (hỗn hợp 5); đo cả tầng tha-ap: "tôi" 226 so với "ta" 207 (hỗn hợp 37). Hai phạm vi cho hai đa số khác nhau; chọn "ta" vì khớp trọn các khoá công thức `:17.1` `:17.3` `:18.1` (89/93/83 tiền lệ viết "ta") và `:18.3` `:19.3` (không đại từ). Lời kết `:20.1` dùng nguyên văn tiền lệ tha-ap67:8.1 ("Tôi nghe như vầy ... đã nói những bài kệ này", nhóm "những bài kệ" đo 407 khoá, nhóm "bài kệ này" số ít chỉ 21).
  Tên `:0.3` `:20.1` `:21.1`: giữ nguyên `Bhisadāyaka` như tha-ap67 (cùng Pāli, cùng tên) và đa số Pāli giữ tên cho các tên `-dāyaka` (77 giữ Pāli so với 21 dịch nghĩa); `translationTitle` bằng đúng `:0.3`; Pāli `:0.3` không có số thứ tự đầu nên `:0.3` không có số. Phần mở đầu "Bài Kệ Tuyên Ngợ Về Trưởng Lão" theo phạm vi gần nhất tha-ap470-510: "Tuyên Ngợ" 17, "Ký Sự" 11, "Tuyên Ngôn" 0; cả tầng tha-ap: "Tuyên Ngợ" 247, "Tuyên Ngôn" 115, "Ký Sự" 99. "Tuyên Ngợ" bị brief ghi là sai chính tả nhưng là đa số ở mọi phạm vi gần; giữ để khớp các bài kề (tha-ap480, 483, 488, 490, 493) và để biên tập phán một lượt cho cả cuốn.
  Số Pāli: `Chaḷasītisahassāni` (`:13.1`) = cha 6 + asīti 80 = 86, nhân sahassa 1.000 = 86.000, viết "Tám mươi sáu ngàn". `Satasahassito` (`:16.1`) = sata 100 nhân sahassa 1.000 = 100.000, viết "một trăm ngàn". Bài không có cụm `tiṁsa`. Ghi ngoài lát: tha-ap442:13.3 dịch `Chaḷasīti` thành "Sáu mươi tám" (68), trong khi `chaḷasīti` là 86.
  Thuật ngữ: `bhisa` ngó sen, `muḷāli` củ sen (theo tha-ap365:2.3 "ngó sen và củ sen"); `sappi` bơ (ud, snp2.7 dùng "bơ"); `paṁsukūla` y phấn tảo; `satthā` bậc Thầy (đa số tiền lệ); `cakkhumā` bậc Có Mắt (1 tiền lệ viết đúng dạng này trong tha-ap); `devadeva` Thiên Trung Thiên (đa số); `tādī` bậc Vững Vàng (tiền lệ nhiều nhất); `duggati` đọa xứ; `kālaṅkato` mệnh chung (10+ tiền lệ); `Tusita` Đâu-suất (7 tiền lệ). Ghi ngoài lát: tha-ap67 dịch `bhisa` thành "bó cỏ" (:2.1, :5.4), trong khi tha-ap365 dịch "ngó sen" cho cùng gốc từ.
  Bất định: (1) `:3.1` `Dhunanto paṁsukūlāni` có thể gắn với Đức Phật (như dịch, vì `:2.1-2.4` nói Ngài đang đi trên không) hoặc người nói; chủ ngữ bỏ trống trong Pāli, tôi thêm "Ngài" cho rõ. (2) `:2.3` `rattambaradharo` dịch "khoác y đỏ". (3) `:1.1` `Ogayha` dịch "lội xuống" (có thể là lặn hay đi sâu xuống). (4) `:4.3-4.4` `savati` được lược ở vế sau, `muḷālibhi` hiểu là củ sen theo tiền lệ; nghĩa mật ong, sữa và bơ chảy ra từ ngó và củ sen được dịch sát chữ, không giải thích. (5) `:7.2` `gati` dịch "đích đến" (tiền lệ snp3.12:12.4). (6) `:8.2` `jalajuttamanāmako` giữ "được gọi là bậc Tối Thượng Tựa Hồng Sen" theo 3 tiền lệ giống hệt; "Tựa" không có trong Pāli và cách đọc của cả cụm chưa phân xử được. (7) `:12.3` `patitaṁ` hiểu là thân xác ngã xuống; `:14.1` `manussayoni` dịch "sinh làm người". (8) `:15.1-15.2` `devadevena tādinā` hiểu là Đức Phật Padumuttara.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Chỉ xác minh được: JSON hợp lệ, đủ 78/78 khoá, đúng thứ tự Pāli, không khoá thừa, mọi giá trị NFC, dấu lược khớp Pāli từng khoá (3/3 khoá `…pe…` thành `…`), không có `(…)`, nháy đơn và nháy kép khớp Pāli từng khoá (6 khoá có nháy), và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
