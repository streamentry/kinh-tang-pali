notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B12 — snp4.13:4.2, snp4.13:5.1, snp4.13:6.1 (`vata`/`sīlabbata`: bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”/“giới cấm”); B13 — snp4.13:16.2, snp4.13:17.1, snp4.13:20.4 (`kappa` = vọng tưởng, bỏ “tạo tác”/“sắp đặt” (trùng `saṅkhāra`)); B14 — snp4.13:16.2 (`purakkhata` = đề cao).

  Sửa lỗi nghĩa 2026-10-16: snp4.13:20.1 — "Vị ấy đã lìa xa mọi pháp," → "Vị ấy đã thoát khỏi các đạo
  quân nơi mọi pháp," (`visenibhūta` = "trở thành không còn đạo quân [đối nghịch]", không phải "lìa
  xa": DPD s.v. visenibhūta, dẫn chú giải "kilesasenāya viseno jāto"
  https://www.dpdict.net/search_html?q=visenibhūta; lời giải Niddesa mnd4:53.1–53.3,
  mnd13:143.1–143.7; khớp mnd4:57.1, mnd13:159.1 và snp4.4:6.1). Sujato ghi "remote from all things"
  không khớp lời giải Niddesa nên không theo.
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 13.2 (phủ định bị đảo: *na brāhmaṇassa … atthi … samuggahītaṁ*, chú giải *nicchinitvā samuggahītampi natthi*, Niddesa mnd13:89.4, Sujato «has adopted nothing»: «sau khi đã tự mình quán xét và nắm bắt các pháp» → «cũng không có điều nào được nắm giữ sau khi quyết định giữa các pháp»), 11.4 (bỏ mất *nihīnato* và thêm «là hơn»: chú giải *aññassa vadanti dhammaṃ nihīnato … sakadhamme daḷhavādā*, Niddesa mnd13:76.1: → «là thấp kém, trong khi nói thật chắc về pháp của chính mình»), 12.1 (`saddhammapūjā` là tôn thờ pháp của mình, không phải Chánh pháp: Niddesa mnd13:81.3–81.5 *sakaṁ satthāraṁ … sakaṁ dhammakkhānaṁ*, chú giải *te hi ativiya satthārādīni sakkaronti*, Sujato «their own teachings»: «Chánh pháp» → «pháp riêng»), 1.1, 14.2, 14.3, 16.2, 17.2, 19.3 (`diṭṭhi`/`diṭṭhigata` không phải *ñāṇadassana*: «tri kiến» → «kiến», «kiến chấp»; 1.1 *diṭṭhiparibbasānā* «an trú trong kiến» như snp4.12:1.1, 3.4), 18.3, 6.4 (B19 *santo/santi* = «an tịnh», thay «tịch tĩnh»); bất định 6.4 *santimanuggahāya* (giữ cách đọc của Sujato «fostering peace» = *anuggahāya*; Niddesa mnd13:42.7 và chú giải *diṭṭhiṃ agahetvā* đọc *an-uggahāya* «không nắm giữ sự an tịnh [do kiến]»; chữ ghim cho phép cả hai, người biên tập quyết định); giữ 2.4 (*khemābhipassaṁ* «hướng về miền an ổn» lỏng nhưng không sai nghĩa), 1.3–1.4 (câu hỏi theo Sujato).
  Sau kiểm độc lập 2026-10-17: `6.4` *santimanuggahāya* = *santiṁ + anuggahāya* «không nắm giữ sự an tịnh» (DPD; Niddesa mnd13:42.7; chú giải *diṭṭhiṃ agahetvā*; 18.4 *anuggaho*), Sujato đọc «fostering peace»; `12.2` *sakāyanāni* «đường lối riêng» và `11.4` *samhi* theo mnd13 (DPD own path; chú giải *sakamagge*), tránh trùng «lập thuyết» của *vāda*.
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 10.3 (nghĩa từ sai: viggayha «lục lọi» → «nắm giữ»; lời giải mnd13:69.1 gahetvā uggahetvā gaṇhitvā, DPD viggayha «arguing; lit. grasping differently», Sujato «arguing»), 12.3–12.4 (quan hệ mệnh đề: bhaveyyuṁ là vế kết quả, hi là «vì»; bản cũ biến 12.3 thành vế điều kiện «nếu…» và 12.4 thành hệ quả «thì…»; lời giải mnd13:83.1, 84.3, chú giải Pj II §913 «evaṃ sante sabbeva vādā tathiyā bhaveyyuṃ. Kiṃ kāraṇaṃ? Suddhī hi nesaṃ paccattameva», Sujato «then all doctrines would be equally valid» → «như vậy thì … đều sẽ thành chân thật, vì sự thanh tịnh của họ chỉ là của riêng mỗi người»), 14.3 (sai đối tượng: tena giống đực/trung không chỉ diṭṭhi giống cái, «kiến ấy» → «cái thấy ấy»; lời giải mnd13:97.5 «tassa tena dassanena kiṁ kataṁ», Pj II §915 cùng câu), 17.4, 18.4 (thêm ý: «maññe» bị dịch hai lần thành «người ta … , ta nghĩ vậy»; đọc m-aññe «những người khác» theo lời giải mnd13:120.2, 127.2, Pj II §918 «uggahaṇanti aññe», DPD mục uggahaṇati dẫn chính câu này «m'aññe», Sujato «when others grasp»; đồng bộ mnd13). Không sửa (NGHI-GIỮ, Snp theo Sujato hoặc DPD, lời giải đọc khác, cả hai đọc được): 1.3–1.4 câu hỏi, 7.1 jigucchita (DPD dẫn câu này «loathed»), 7.3 uddhaṁsarā (lời giải, Pj, DPD: tính từ chỉ chủ ngữ), 17.1 saṅkhā (lời giải, Pj, DPD saṅkhā 4 ger.: «sau khi phân định»), 5.2 kamma, 5.3/8.1/8.4 jappa «lẩm bẩm» (Pj vippalapati), 8.4 vedheyya, 17.2 ñāṇabandhu.
