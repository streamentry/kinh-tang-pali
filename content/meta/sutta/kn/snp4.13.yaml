  Quyết định hội đồng biên tập 2026-10-16: B12 — snp4.13:4.2, snp4.13:5.1, snp4.13:6.1 (`vata`/`sīlabbata`: bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”/“giới cấm”); B13 — snp4.13:16.2, snp4.13:17.1, snp4.13:20.4 (`kappa` = vọng tưởng, bỏ “tạo tác”/“sắp đặt” (trùng `saṅkhāra`)); B14 — snp4.13:16.2 (`purakkhata` = đề cao).

  Sửa lỗi nghĩa 2026-10-16: snp4.13:20.1 — "Vị ấy đã lìa xa mọi pháp," → "Vị ấy đã thoát khỏi các đạo
  quân nơi mọi pháp," (`visenibhūta` = "trở thành không còn đạo quân [đối nghịch]", không phải "lìa
  xa": DPD s.v. visenibhūta, dẫn chú giải "kilesasenāya viseno jāto"
  https://www.dpdict.net/search_html?q=visenibhūta; lời giải Niddesa mnd4:53.1–53.3,
  mnd13:143.1–143.7; khớp mnd4:57.1, mnd13:159.1 và snp4.4:6.1). Sujato ghi "remote from all things"
  không khớp lời giải Niddesa nên không theo.
