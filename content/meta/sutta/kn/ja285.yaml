notes: |-
  COVERAGE, ĐO BẰNG SCRIPT KHÔNG SUY. Đếm trực tiếp trên source/upstream-manifest.json tại
  commit đã ghim 11c9d708978cde8ba61096d8a75f7ddfb846f639: tầng translation/en/sujato có 4.291
  tệp, trong đó kn có 755 tệp và thư mục kn/ja chỉ có 83 tệp (ja1..ja79, ja126, ja159, ja466,
  ja534) — không tệp nào chứa khoá của lát này. Tầng translation/vi/phantuananh có đúng 26 tệp
  và chỉ là Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho bất kỳ bài nào ở đây. Cả
  hai đều là đặc điểm của bản chụp upstream, không phải thiếu sót của kho.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt của _hvi.kiểm() chỉ quét khoá Pāli
  từ 40 ký tự trở lên; ở Jātaka mọi vế kệ đều ngắn hơn ngưỡng đó (khoá dài nhất trong lát này
  dài 39 ký tự) nên assertion đó về bản chất KHÔNG chạy. Tôi tự quét lại toàn bộ khoá từ tệp
  đã ghi trên đĩa bằng chính các hàm của _hvi.py: đủ khoá và không thừa so với Pāli, không rỗng,
  chuỗi NFC, số dấu lược khớp TỪNG KHOÁ, vị trí ngoặc kép mở và đóng khớp TỪNG KHOÁ (không chỉ
  tổng số trên cả bài), ngoặc kép cân trên cả bài, không có (…), không trùng nguyên văn Pāli ở
  khoá thân kinh. Kết quả: 0 lỗi trên 238 khoá / 14 bài.

  DẤU LƯỢC §10. Không khoá nào trong 238 khoá của lát này chứa …pe… — đã kiểm bằng script trên
  từng khoá, không phải bằng mắt. Vì vậy cả 238 bản Việt đều có 0 dấu lược, khớp Pāli. Không
  mở rộng, không nén, không có (…) đứng một mình.

  NGHIÊN CỨU TAM GIÁC. Không có tầng Anh nào để đối chiếu (xem trên), nên tôi đọc chú giải
  Jātaka từng vế để phân xử những chỗ Pāli khó, rồi vẫn tự viết lại bản Việt. Chú giải được
  dùng như TỪ ĐIỂN và để cân nhắc bối cảnh, không sao chép câu Anh nào vào thân kinh.

  CẶP PĢI TRÙNG — MỘT CẶP PHẢI DÙNG LẠI NGUYÊN VĂN. `akāco vimalo subho` ở `3.2` trùng
  byte-for-byte `dn19:47.39`; bản Việt đã có là không tì vết, trong sạch và đẹp, và tôi dùng
  lại đúng câu đó. Chỉ khác dấu chấm câu ở cuối: dn19 đứng giữa một câu dài nên có dấu phẩy,
  còn ở đây khoá 3.2 theo sau bởi 3.3 nên tôi kết bằng dấu chấm phẩy theo nhịp Pāli. Từ đây tôi
  không sửa dn19. `kiṁ kiccaṁ idha maññasi` ở `2.4` trùng `ja542`, chưa có bản Việt, đặt mới.
  `Dariyā satta vassāni` ở `1.1` trùng `ja148`, chưa có bản Việt, đặt mới.

  CHỐT LƯỢC. `maṇi` ở 1.3, 2.1, 2.2 là viên ngọc; `veḷuriyo` ở `3.1` là đá quý (tầng đã có
  tiền lệ: ja256 dịch veḷuriyā là đá quý, và một lát trước đã phân biệt rõ muttā là ngọc trai
  còn veḷuriya là đá quý). `siriṁ` ở `3.3` là ÁNH SÁNG, không phải số phúc — chú giải xác nhận
  vế này nói về ánh sáng của ngọc không ai hủy được; đây là cùng một từ với tên bài Sirijātaka ở
  ja284 nhưng nghĩa khác theo ngữ cảnh, nên tôi dịch khác. `appossukko` → các ngươi hãy rời
  đi (chú giải: phải rời khỏi hang ngọc, không thể phá hủy được độ chói của nó). `sūkarā` là tế
  từ số nhiều, dịch lợn rừng như `sūkara` ở 1.2 của bài kia.

  NỬA DÒNG ĐƯỢC THÊM DẤU NHÁY CONG. Ở `1.3` và `3.4` tôi đặt cặp nháy cong quanh lời tường
  thuật bên trong (`Phá bỏ ánh sáng của viên ngọc`, `Rơm của ta còn hơn`) vì Pāli không có dấu
  nháy ở đó; đây là phục hồi chính tả chứ không phải thêm chữ, và tầng đã có tiền lệ (mil7.8.1
  dùng nháy cong cho lời dẫn lại lồng trong lời thoại).

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Quét toàn tầng Pāli gốc 5.764 file (bỏ thư mục
  *.apfs-orphan) theo nguyên văn từng khoá, rồi lặp lại ở dạng không phân biệt hoa thường:
  toàn lát này có **61 cặp**, gồm 57 cặp trùng byte-for-byte và 4 cặp trùng sau khi chuẩn hoá
  dấu câu, nháy kép và hoa thường; trong đó 19 cặp là thân kệ (phần còn lại là khối tiêu đề
  Jātaka, Tikanipāta và tên phẩm, vốn phải giống nhau theo quy định bộ). 48 cặp trỏ tới bài đã
  có bản Việt và 13 cặp trỏ tới bài chưa có, nên tôi đặt mới cho 13 cặp đó. Riêng bài này:
  3 (1.4, 2.4, 3.2) cặp trùng ở thân kệ.

  REVIEW ĐỐI KHÁNG RIÊNG, CHẠY TRƯỚC KHI CHẤM. Tôi in lại từng cặp Pāli và Việt ra đọc lại,
  và đây là những lỗi tôi tự bắt được và đã sửa trước khi ghi lần cuối:
  (1) Vị trí ngoặc kép: lần viết đầu tiên tôi đặt ngoặc kép theo cảm giác của câu kệ, và quét
  từng khoá đã bắt được năm chỗ lệch với Pāli — đóng ngoặc sớm ở 2.4 của ja277, mở ngoặc thừa
  ở 2.1 của ja281, đóng ngoặc thừa ở 3.1 của ja282 và 3.4 của ja286, và mở ngoặc thừa ở 1.4
  và 3.1 của ja292. Pāli phân đoạn lời thoại khác nhau ở mỗi bài, nên phải so **từng khoá**
  chứ không được so tổng số. (2) ja278 vế 2.4: bản nháp dịch mà không ai ngăn được họ; quét
  Pāli trùng mới thấy câu này đã có sẵn trong kho ở sn11.4 và sn11.5, nên đã sửa thành nguyên
  văn đã có. (3) ja282 vế 3.4: bản nháp dịch bước vào việc tự chế; cùng quét đó cho thấy đã
  có sẵn bước đến nơi tự chế, nên đã sửa. (4) ja283 vế 2.1 và 2.2: bản nháp dịch cả hai là
  sợ hãi, lặp từ và mất sắc thái phân biệt của chú giải; đã sửa 2.1 thành hoảng sợ và bỏ sợ
  hãi ở 2.2. (5) ja277 vế 3.4: bản nháp xưng ngài trong khi cả bài xưng ngươi, đã sửa cho nhất
  quán. (6) ja292 vế 3.4: bản nháp dùng trừng trừng kẻ đã làm rách mũi, đọc thành mệnh lệnh;
  đã sửa thành nơn xin ngài trừng phạt kẻ đã làm rách mũi ngài cho đúng vai sứ giả. (7) ja276 vế
  1.3: bản nháp lặp đem đổi ở cả 1.3 và 1.4, đã sửa 1.3 thành Vàng quy ra con voi màu son
  chàm. (8) ja284 vế 1.4: bản nháp ngươi hãy nhận ra, đều hưởng được của cải ấy có hai mệnh đề
  lệch; đã sửa thành ai nhận ra thì đều hưởng được của cải ấy. (9) ja281 vế 1.4: bản nháp thừa
  một chữ một; đã bỏ. (10) ja293 vế 3.3: bản nháp đặt ở nơi ấy trước buông lung làm câu khó
  đọc; đã dời.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate,
  test, check và build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và
  technical_integrity đặt **9.6** chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy
  lại sau khi gộp lát.

  STATUS. Có hai blocking error thật ở trên (thiếu hẳn tầng Anh Sujato tại commit đã ghim, và
  coverage dưới ngưỡng chưa được ghi nhận trong reference-gaps.yaml), nên bài đặt **draft** bất
  kể final_score. Tôi không nâng điểm để né blocker, và cũng không hạ điểm để tỏ ra thận trọng:
  điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp (6.6) vì không có
  tầng tham khảo nào.

  Giải quyết draft 2026-10-12 (kiểm toán độc lập, đọc đối kháng từng khoá từ Pāli; mục này thay thế
  các câu cũ ở phần CHỐT LƯỢC về `veḷuriyo` = đá quý và `siriṁ` = ánh sáng).
  Đã sửa 9 trên 17 khoá (4 khoá tiêu đề, 3.2, 3.4, 2.4 và câu kết giữ nguyên):
  1.1 bỏ "ấy" và "ròng" (Pāli chỉ có `dariyā satta vassāni`, không có chỉ thị hay từ nhấn); 1.2
  `tiṁsamattā` là "chừng ba mươi", KHÔNG phải "ít nhất ba mươi" (hậu tố -matta là "độ chừng", không
  nói cận dưới; "ít nhất" là nghĩa thêm); thêm "đã" vì `vasāmase` đi với khoảng thời gian bảy năm;
  1.3 `haññāma` là lời khuyến dụ ngôi một số nhiều, nên "Chúng ta hãy hủy…" thay cho cụm danh từ
  cụt "Phá bỏ…", và bỏ cặp nháy đơn thêm vào vì Pāli không có (`iti` ở 1.4 đã đóng lời); "hủy"
  thống nhất với `hantuṁ` ở 3.3; 1.4 `mantanaṁ` là "bàn bạc" (tiền lệ dn3:2.7 "cuộc bàn bạc"; "dự
  tính" lệch sang ý riêng của một người); 2.1–2.2 `yāvatā … bhiyyo` là cặp tương quan "đến đâu …
  càng … đến đó", bỏ "dù có … thế nào" (nghĩa nhượng bộ không có trong Pāli); 2.3 bỏ "ngươi" thêm
  vào (Pāli chỉ có `pucchāma`, không có đại từ) và thêm "Và" cho `ca`; 3.1 `ayaṁ maṇi veḷūriyo` là
  "viên ngọc này là ngọc lưu ly", sửa "đá bảo vật" (cụm vô nghĩa, không có trong Pāli) theo tiền lệ
  lưu ly của tầng (dn2:84, dn10, dn14, dn17, mn123, mn129, dn19:47.38 — hơn mười bài, không bài nào
  dùng "đá quý" cho veḷuriya; ghi chú cũ viện ja256 không đủ làm tiền lệ so với số này); 3.3
  `siriṁ` là "vẻ huy hoàng" (bv14:2.4, bv2:185.4, ja524:40.3, ja532:27.4), tách khỏi `ābhaṁ` = "ánh
  sáng" ở 1.3 — bản cũ dịch hai từ Pāli khác nhau thành cùng một chữ; `nāssa sakkā` là "không thể",
  bỏ chủ ngữ "không gì" tự thêm. Giữ nguyên: 2.4 (trùng ja542:81.4 và các khoá cùng cặp, đã dùng
  lại nguyên văn), 3.2 (trùng dn19:47.39), 3.4, tiêu đề. Cặp Pāli trùng trong chính bài: 0; số
  Pāli: `satta` 7, `tiṁsa` 30 (ước chừng) — không có phép tính nào khác.
  Blocker đã gỡ: "Coverage tầng Anh đo được là 0 trên 0 khoá có nội dung" — mẫu số bằng 0 nên cổng
  không đo được gì, chứ không phải bản dịch hỏng; đây là hệ quả của blocker thiếu bản Anh và mọi vế
  kệ ngắn hơn 40 ký tự, không phải lỗi văn bản. Các vế tự đứng được từ Pāli (đã đọc kỹ cả 14 khoá
  thân kệ). Blocker giữ nguyên: thiếu bản Anh Sujato tại commit đã ghim (sự thật về upstream, thuộc
  waiver `no-upstream-english` của người biên tập). `triangulation` giữ 6.6 (không có bản Anh độc
  lập, chỉ đối chiếu nội bộ kho). Tầng `vietnamese-current` chỉ có Pháp Cú nên không có đối chiếu
  Việt hiện hành (giới hạn của bản chụp, không phải lỗi văn bản). Bất định còn lại: người nói ở
  khổ 3 không được Pāli nêu (chỉ có vocative `sūkarā`), và xưng hô "ngươi" là lựa chọn của người
  dịch, đã giữ nhất quán với ja542. `technical_integrity` 9.6: bốn lệnh `npm run validate`, `npm test`,
  `npm run check`, `npm run build` chưa chạy ở lượt này.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
