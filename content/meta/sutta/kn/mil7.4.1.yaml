notes: |-
  Dịch từ Pāli root, không có tầng Anh ở commit ghim nên triangulation thấp, bài giữ draft.
  Văn xưng và đầu đề theo tiền lệ cùng sách mil7.3.4: Bạch ngài Nāgasena, Thưa đại vương,
  Câu Hỏi Về Ví Dụ, Phẩm Đất, người hành trì du-già.
  Bài kệ 6.1-6.4 đọc là hai vế đối nhau (cưa đứt/xoa hương), 7.1-7.2 kết luận vô sân vô tham.
  Coordinartor chạy bốn cổng trước khi gộp: npm run validate, npm test, npm run check, npm run build.
  Lượt cải thiện 2026-10-11 (đọc đối kháng từng khoá Pāli↔Việt, sửa 27/30 khoá, giữ nguyên tập khoá và ID):
  - Sai nghĩa đã sửa: 6.1-6.4 "lưỡi cưa cắt đứt, người cưa, kẻ xoa ướp" → vāsi là cái rìu, tacche là đẽo, hai vế đều là "nếu có người…" (đối chiếu đoạn kệ song song mnd5:53.3 và mnd16:59.3 trong kho); 7.1-7.2 "điều kia/điều này" → "bên kia/bên này" theo mnd16:59.3; 7.3-7.4 tách đúng "te" (các vị ấy) và "samaṇā mamā" (sa-môn của tôi), bỏ đại từ "con" không có trong Pāli.
  - Thiếu/thừa đã sửa: 1.3 thiếu iṭṭhāniṭṭhe, nindāpasaṁsā bị đảo thứ tự, thêm "tâm", "mọi cảnh", "bình thản"; 1.2 thiếu hai chữ ādi, "thơm tho/dơ uế" là diễn giải của iṭṭhāniṭṭha (nay "ưa thích/không ưa thích", khớp mil5.1.8 và mnd); 2.1-2.2 bỏ "mọi", "chỉ" không có trong Pāli; 4.1 "ao hồ" gộp taḷāka và pokkharaṇī, "chim muông" lặp "thú"; 5.4 thiếu "mahārāja" và "pi" (nay "tâu đại vương, điều này cũng đã được…").
  - Thuật ngữ sửa theo số đếm: lasikā "nhớt" → "dịch khớp" (6/6 chỗ khác); semha "đàm" → "đờm" (mil: 7 so với 2, trong đó 1 là chính bài này); nigama "chợ búa" → "thị trấn" (41/44); rāga "tham đắm" → "tham" (83/84); candana "chiên đàn" → "chiên-đàn" (23 so với 1); tagara giữ nguyên dạng Pāli theo mil6.4.1:29.3 (không còn "trầm tagara"); samaṇa "Sa-môn" → "sa-môn" (558 so với 76); akhaṇḍa-acchidda "không nứt không thủng" → "không sứt mẻ, không thủng" (ne13, ne37, ps1.1); vitthiṇṇa "mênh mông" → "rộng lớn" (mil6.3.8); bỏ "liền lạc" và "xốp" không có trong nirantara, susira; maṇḍana/vibhūsana "tô vẽ" → "trang sức, làm đẹp" (cnd23, kp2, mil5.3.1); sīla trong 2.2, 3.2 "giới hạnh" → "giới" (76 so với 21); bhāsita "tuyên thuyết" → "nói" (54 so với 4); parikittayamāna "ca ngợi" → "tán dương" (mil5.1.10, 4 chỗ).
  - Công thức bảy động từ ở 4.2: ovada "giáo giới" (bv12:7.1), anusāsa "dạy bảo", viññāpa "làm cho hiểu rõ" (bv12:7.1), sandassa "chỉ dạy", samādapa "khuyến khích", samuttejā "khích lệ", sampahaṁsa "làm cho hoan hỷ" — bốn chữ cuối khớp 18/23 lần công thức bốn động từ đã có trong kho (ud, iti, mil…; 5 chỗ còn lại dùng chữ khác); bản cũ đảo ovada với anusāsa và dùng "chỉ bày, khích lệ, sách tấn" lệch công thức.
  - Danh xưng: "thưa đại vương" → "tâu đại vương" (mil7.4: 72 so với 38; mil7: 159 so với 64); aṅga "đức tính" → "chi phần" là cách dịch sát chữ và như năm bài anh em cùng phẩm (mil7.4.2, .4, .5, .9, .10; bốn bài còn lại dùng đức tính), nhưng số đếm chỉ nghiêng nhẹ: cụm aṅgaṁ gahetabbaṁ cùng phẩm 22 so với 22, cả mil7 51 so với 42; đầu đề 0.4 và câu kết 8.1 đổi theo.
  - Điểm đổi: semantic_fidelity 9.1 → 9.3 (sửa vāsi/tacche, thiếu iṭṭhāniṭṭhe, thiếu ādi); grammar_logic 9.2 → 9.4 (chủ thể hai vế kệ, te/samaṇā mamā, mahārāja và pi ở 5.4); terminology 8.8 → 9.1 (khoảng 14 thuật ngữ khớp tiền lệ đã đếm); triangulation 6.5 → 6.7 (đối chiếu thêm các đoạn song song mnd5, mnd16, iti104, bv12, ud — chỉ là bản dịch của chính dự án, không độc lập, vẫn không có bản Anh); vietnamese_clarity 9.2 → 9.3. Các tiêu chí khác giữ nguyên; ambiguity_integrity giữ 8.9 vì bất định dưới đây còn nguyên.
  - Bất định còn lại, không phân xử được bằng căn cứ trong kho: (1) tādī ở 1.3 (tādināyeva bhavitabbaṁ) dịch "bất động như vậy" theo 16 chỗ có tādī, ud/iti, trong khi snp1.9 và snp1.12 dùng "bình thản"; (2) amusmiṁ/asmiṁ ở 7.1-7.2 có thể chỉ hai người hoặc hai cánh tay, "bên kia/bên này" giữ trung tính; (3) janapada dịch "xứ" theo 59 chỗ, đứng riêng trong danh sách đọc hơi cộc; (4) aṅga và yogāvacara còn chia đôi trong cả phẩm (chi phần/đức tính; hành giả/người hành trì du-già), bài giữ "người hành trì du-già" như mil7.3.4; (5) đầu đề 0.2 Opammakathāpañha chưa thống nhất trong mil7 (9 chỗ "Câu Hỏi Về Ví Dụ", 42 chỗ cách nói khác), không đổi; (6) kuṅkuma "nghệ tây" chỉ có một chỗ trong kho.
  - Không sửa ngoài bài, báo lại: mil7.4.5:11.4 dịch samaṇe là "bậc đạo sư" (số ít, sai số) và "khoe khoang" cho parikittayamāna.
  - technical_integrity giữ 9.6; chưa chạy bốn cổng npm run validate · npm test · npm run check · npm run build trong lượt này.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 5.4 — “…các sa-môn của mình:—” → “…các sa-môn của mình—” theo dấu câu Pāli (`…parikittayamānāya—`); trong tầng, 8.706/10.716 khoá có Pāli kết “—” đều dịch kết “—”, chỉ 72 khoá dùng “:—”; giữ “cũng” (`-pi`) và “Tâu đại vương” đầu câu, không theo cách sắp xếp của bản đa số.
