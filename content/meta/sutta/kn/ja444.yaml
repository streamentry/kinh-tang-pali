notes: |-
  Đợt 19, làn 45. Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đủ 63/63 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn kệ không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ và từ bản song hành `cp31` (xem dưới).

  **Tầng tham khảo.** Không có Sujato cho `ja444` (xem blocker thứ nhất). Điều duy nhất có thể đối chiếu độc lập là bản song hành `cp31` (Hạnh Tạng, Kaṇhadīpāyanacariya, có Sujato và bản Việt đã có trong kho), trùng nguyên văn Pāli ở 5 khoá: `ja444:1.1` = `cp31:11.1`, `1.3` = `cp31:11.3`, `1.7`/`3.6` = `cp31:12.3`, và `1.6`/`2.6`/`3.5` trùng với `kp6`. Đó chỉ là 5 khoá của bài (cộng 3 khoá trùng `kp6`) và không phải bản Anh của chính `ja444`, nên không dùng để nâng `triangulation`.

  **Tiêu đề, theo khuôn của các bài cùng phẩm.**
  - `0.2` “Bộ Mười Bài Kệ” và `0.3` “Phẩm Bốn Cửa” dùng lại nguyên văn từ `ja443`, `ja445`, `ja446` (cùng `Dasakanipāta` + `Catudvāravagga`).
  - `0.4` “6. Kinh Kaṇhadīpāyana” theo khuôn “N. Kinh <tên>” của `ja443:0.4`, `ja445:0.4`; `11.1` “Kinh Kaṇhadīpāyana thứ sáu.” theo `ja445:11.1`, `ja446:11.1`. Số thứ tự 6 ở tiêu đề khớp `chaṭṭhaṁ` ở `11.1`; `ja445` là thứ bảy nên thứ tự trong phẩm liền mạch.

  **Tiền lệ dùng lại và chỗ cố ý lệch.**
  - `7.3` dùng lại nguyên văn bản Việt của `ja446:3.5` (cùng Pāli `Taṁ kullavattaṁ anuvattamāno,`); `9.3` là dạng giống cái `anuvattamānā`, dịch cùng cách. Tiền lệ chỉ có 1 khoá trong tầng.
  - `1.1` lệch có chủ ý so với `cp31:11.1`: bản `cp31` thêm “đầu” (“bảy ngày đầu”) và dịch `pasannacitto` là “hoan hỷ”. Pāli chỉ nói `sattāhameva` (chỉ bảy ngày) nên bỏ “đầu”; `pasannacitto` tầng có 222 khoá, trong đó “tịnh tín” 114, “hoan hỷ” 23 nên dùng “tịnh tín”. `1.3` lệch `cp31:11.3` ở chỗ không thêm “tu tập”. `1.7`, `2.7`, `3.6` lệch `cp31:12.3`: bỏ “lại” vì `jīvatu` chỉ nói “mong sống”, không nói “sống lại”.
  - `1.6`, `2.6`, `3.5` (Pāli `Etena saccena suvatthi hotu`): tầng có 25 khoá Pāli trùng nguyên văn; bản Việt “nhờ sự thật này, mong được an lành” 12 khoá, “do sự thật này, mong được an lành” 12 khoá (hai dạng bằng nhau, cùng ở `kp6`), “Bằng sự thật này, nguyện được bình an” 1 khoá (`cp31:12.2`). Chọn “nhờ” và giữ nhất quán cả ba khoá trong bài; không có căn cứ phân xử giữa “nhờ” và “do” nên ghi lại ở đây.
  - `1.2` `puññatthiko` → “vì cầu phước” theo `snp3.5` (4 khoá “vì cầu phước”); `cp31:11.2` dịch “cầu tìm phước đức”.
  - `visaṁ` → “nọc độc” theo `cp31`; `āsīviso` → “rắn độc” theo `cp31:6.4`, `cp31:9.1`.
  - `eḷamūga` (5.2) → “câm ngọng”: `dn33`, `dn34` dùng “đần độn, câm ngọng”; `mn4`, `mn5`, `mn107` dùng “ngu độn/ngu muội”; chọn dạng có “câm” vì ở đây dùng làm hình ảnh so sánh.
  - `opānabhūtaṁ` (6.3) → “như một giếng nước” theo `an8.12:27.1` (“như giếng nước”); `mn56` dịch “nguồn hỗ trợ”.
  - `paribbajanti` (4.1) → “xuất gia” theo `sn3.10:5.3`, `dhp346:3`.
  - `samaṇabrāhmaṇā` → “sa-môn, bà-la-môn”: tầng có “Sa-môn Bà-la-môn” 71+41 và “sa-môn bà-la-môn” 148+45+13+8 (viết thường chiếm đa số) nên viết thường.
  - `vāda` (5.3, 6.5, 7.5, 9.5) → “lời bàn tán”, `jigucchamāno` → “ghê sợ”: tầng có 148 khoá chứa gốc `jigucch`, nghĩa dao động giữa “ghê tởm” và “nhàm chán”; ở đây là chủ thể tránh một lời đời bàn tán nên chọn “ghê sợ”.
  - Trong bài có 3 nhóm Pāli trùng nguyên văn (`1.6`/`2.6`/`3.5`; `1.7`/`2.7`/`3.6`; `5.3`/`7.5`): cả ba nhóm đều có bản Việt trùng, chỉ khác dấu câu và nháy theo từng khoá Pāli (`1.7`, `3.6` có nháy đóng; `2.7` không). `1.6`/`2.6`/`3.5` kết `;`, `;`, `,` đúng như Pāli.

  **Người nói và đại từ.** Chỉ `1.x` (trùng `cp31:11.x`) và `5.x` (người được gọi `Dīpāyana` ở `4.3`) chắc chắn là Kaṇhadīpāyana, dịch “ta”. Các khoá khác dịch “tôi”, riêng `3.x` dịch “ta” vì người nói chưa xác định. `3.1` `tāta` dịch “này con” vì người bị cắn (`taṁ`) theo bản song hành `cp31` là một đứa bé, nên lời gọi dành cho trẻ; đây là suy ra từ `cp31`, không từ root của `ja444`. `10.1` người nói đại từ “tôi”, người được gọi `Maṇḍabya`.

  **Số Pāli.** `paññāsa` (1.4) = 50, `samādhikāni` = “và hơn thế” ⇒ “năm mươi năm và hơn thế”; phép tính này khớp `cp31:11.4` (`paññāsasamādhikāni` = “hơn năm mươi năm”). Số thứ tự `chaṭṭhaṁ` (11.1) = thứ sáu, khớp “6.” ở `0.4`. Không có số lượng nào khác.

  **Bất định, đều ghi ở đây thay vì che trong thân kinh.**
  1. `9.1`–`9.2` `Ārā dūre nayidha kadāci atthi, / Paramparā nāma kule imasmiṁ`: hai cách đọc — (a) `paramparā` (truyền thừa nối tiếp) là chủ ngữ của `atthi` và xa xôi chỉ khoảng cách (nghĩa: không bao giờ có điều xa lạ với truyền thừa ở đây); (b) `ārā dūre` là phó từ “từ xa xưa” và câu khẳng định truyền thừa trong gia tộc này. Bản dịch giữ dạng tỉnh lược song song với Pāli (“Xa xôi, cách biệt, ở đây chẳng bao giờ có; / cái gọi là truyền thừa nối tiếp trong gia tộc này”) để không chọn thay. Cần người biên tập hoặc chú giải xác nhận.
  2. `7.4`, `9.4` `antimagandhano`/`antimagandhinī`: 0 tiền lệ trong tầng. Dịch “kẻ cuối cùng mang tiếng xấu”, đọc `gandhana` như “mùi/tiếng xấu” theo mạch `vāda` (lời chê trách, `5.3`/`7.5`/`9.5`) mà người nói ghê sợ. Cách đọc khác: `gandhana` liên quan gốc dùng ở `Agandhana`-Jātaka (không rút lại độc đã nhả), tức “người cuối cùng làm điều trái nếp”. Chưa phân xử được.
  3. `3.2` `sacarā udicca`: dịch “khi đang đi lại, ngóc lên”; `sacarā` có thể là “nơi nó đi lại của chính nó” (sa + cara) hoặc một dạng khác. Cả hai đều không đổi giáo nghĩa.
  4. `8.3` `Na cāpi me appiyataṁ avedi`: đọc `me` là sở hữu (“sự không ưa của tôi”), song song với `2.3` (cùng cấu trúc `me appiyataṁ aveduṁ`). Cách đọc khác: `me` là dạng cho (“nàng chẳng tỏ cho tôi sự không ưa của nàng”). Đã chọn theo `2.3`.
  5. `4.2` `natthākāmarūpā`: tách thành `natthi` + `akāmarūpā`, dịch “chẳng ai là người không muốn”; `rūpa` ở đây như hậu tố “có tính chất”, giống `attakāmarūpā` ở `mn31:3.5`, `mn128:8.5` (dịch “mong cầu”, không dịch `rūpa`).
  6. `5.5` `satañca` đọc là sở hữu cách của `santa` (“của người thiện”), song song với `viññuppasatthaṁ` (được bậc trí tán thán).
  7. `ja444:3.x` người nói chưa xác định (xem trên).

  **Phép kiểm.**
  1. Tập khoá: Việt 63 = Pāli 63, `list(vi) == list(pali)` đúng; không có khoá rỗng, không có khoá ngoài tập Pāli.
  2. Nháy kép: Pāli 10 dấu mở · 10 dấu đóng ở `1.1`/`1.7`, `2.1`/`2.4`, `3.1`/`3.6`, `4.1`/`4.4`, `5.1`/`5.6`, `6.1`/`6.6`, `7.1`/`7.6`, `8.1`/`8.6`, `9.1`/`9.6`, `10.1`/`10.4`; Việt đúng 10/10, lệch 0/63 khoá. Nháy đơn `‘’`: Pāli 0, Việt 0. Chú ý `2.5`–`2.7` không có nháy theo Pāli (nháy đóng ở `2.4`).
  3. Dấu lược `…` và `(…)`: Pāli 0, Việt 0.
  4. Pāli trùng trong chính bài: 3 nhóm, 0 nhóm bản Việt lệch về nội dung (xem trên). Pāli trùng với bài khác: 13 khoá tra được (gồm 0.2, 0.3 và các khoá nêu trên); dùng lại hoặc lệch có lý do như đã liệt kê.
  5. Không Pāli lọt sang Việt ngoài tên riêng (Kaṇha, Dīpāyana, Maṇḍabya, Yaññadatta, Kaṇhadīpāyana); NFC; không khoảng trắng thừa.
  6. Kỹ thuật: tôi không chạy được `npm run validate`, `npm test`, `npm run check`, `npm run build` (bị cấm trong lát này) nên không tuyên bố technical gate pass; `technical_integrity` đặt 9.6 và bốn lệnh này còn phải chạy.
