  của lát, `triangulation` bị chặn ở **7.6** và bài đặt `draft`. Đây là lý do bị chặn,
  không phải để né điểm.

  SAI LỆCH SO VỚI BRIEF ĐÃ ĐO. Brief nói cả 5 bài đều có tầng Việt hiện hành; đo thì
  **không bài nào có** (xem `ja40.yaml`).

  LƯỢT REVIEW ĐỐI KHÁNG ĐÃ BẮT LỖI, ĐÃ SỬA. Bản nháp có sẵn trên đĩa lúc tôi bắt đầu
  (mtime 10:24, **không có scorecard**) rút gọn mất tân ngữ ở vế cuối. Pāli là
  `kattāraṁ nādhigacchatī`: `kattāraṁ` là tân ngữ "người làm" và `nādhigacchatī` là
  "không đạt được". Draft chỉ còn "không với tới được", tức **mất hẳn tân ngữ**, và
  câu thành nghĩa cụt. Sửa thành **"kẻ ấy không với tới được người làm"**. Ba vế còn
  lại giữ nguyên vì đã đúng: `katakalyāṇo` thành "làm điều lành", `nāvabujjhati` thành
  "không hiểu được ý nghĩa của việc ấy", `samuppanne` thành "đã thành tựu".

  ĐA NGHĨA `Pacchā kicce samuppanne` (`1.3`) — ĐÃ GHI, KHÔNG TỰ BỊA. `kicce` ở đây
  không có bản Việt nào trong tầm để đối chiếu và bản chụp không có chú giải; tôi giữ
  vế này ở mức "khi việc ấy đã thành tựu", vốn là nghĩa của `samuppanne`, và **không**
  thêm từ nào để giải thích `kicce`. Đây là chỗ cần người đọc Pāli kiểm lại, nên
  `ambiguity_integrity` ở 9.1.

  ỨD NGHĨA `4.1–4.4` — KHÔNG MỞ MÃ HOÁ, CỐ Ý. `Apāyimha ca dūbhaka sattapadaṁ` …
  là uddāna Apāyimhavagga: danh sách tên-mangala của mười bài trong phẩm, không phải mười
  tên bài kinh. Bản chụp không có chú giải, nên tôi giữ danh sách Pāli kèm dấu, chỉ dịch
  từ nối, theo tiền lệ `ja10`, `ja20`, `ja30`, `ja50`, `ja100`–`ja140`. Cuối vế dùng
  "— mười bài ấy." (6 lần ở JA ngoài lát so với 2 lần của cách kia).

  SỐ THỨ TỰ ĐỐI CHIẾU HAI BÊN, KHÔNG SUY TỪ TÊN UID. `Apāyimhavaggo navamo` là thứ
  chín; chín bài `ja81–ja89` đã mang "Phẩm Chưa Từng Uống" trong tầng, và `ja90:2.1`
  là "thứ mười", khớp `dasamaṁ` và khớp vị trí thứ 10 trong phẩm.

  TIÊU ĐỀ `0.4`. `Akataññu` là "kẻ không biết ơn, vô ơn"; đếm tiền lệ: "vô ơn" đã có
  20 khoá trong tầng ("vô ơn là ô nhiễm của tâm"), nên dịch thành **Kinh Kẻ Vô Ơn**. Đếm
  ở khoá `0.4` của JA: 233 bài dịch tên ra tiếng Việt so với 31 bài giữ Pāli; tôi theo
  nhóm đa số. Ngược lại `Khadiraṅgāra`, `Kuddāla`, `Bhīmasena` là tên riêng nên giữ Pāli.

  `technical_integrity` 9.6 vì đợt này cấm chạy cổng: `npm run validate`, `npm test`,
  `npm run check`, `npm run build` để coordinator chạy.
  Sửa lan 2026-10-13: `Apāyimhavagga` — tên phẩm lấy từ vế đầu của `ja81:1.1`, mà `apāyimha` là thức aorist ngôi thứ nhất số nhiều có tiền tố `a-` (*chúng tôi đã uống*), cùng dạng với `agāyimha` (*chúng tôi đã hát*) và `anaccimha` (= `a-` + `naccimha`, *chúng tôi đã nhảy múa*); dạng phủ định phải là `na`/`nā`. Bản cũ đọc `a-` là phủ định (*Chưa Từng Uống*). Tiền lệ đo trên tầng: ở `kn` các động từ aorist ngôi 1 số nhiều có `a-` (`agamimha`, `adāsimha`, `apucchimha`, `akarimha`… 20+ khoá) đều dịch khẳng định. Khoá `ja90:0.3`: *Phẩm Chưa Từng Uống* → *Phẩm Chúng Tôi Đã Uống* (cùng tên ở `ja81`…`ja90`, một tên phẩm cho cả phẩm; `ja90:4.1` giữ `Apāyimha` là tên trong bài tóm lược, không đổi). Khoá `ja90:2.2` (dòng kết phẩm) đổi theo: *Phẩm Chưa Từng Uống thứ chín* → *Phẩm Chúng Tôi Đã Uống thứ chín*. Điểm không đổi; giữ nguyên các khoá còn lại.

  Kiểm toán 2026-10-15 (kiểm toán Jātaka chỉ có Pāli), Claude Sonnet 5.5 (Claude Code): Sửa 4/4 khoá kệ. katakalyāṇo/katattho là người đã được làm điều lành, đã được thỏa nguyện (người thọ ơn), nāvabujjhati là không nhận biết; bản cũ đảo thành người làm ơn "không hiểu ý nghĩa". samuppanne là phát sinh, không phải "thành tựu"; kattāraṁ nādhigacchati là không tìm được người làm (việc ấy), bản cũ "không với tới được người làm" mơ hồ. Chú giải Jātaka (bản Anh ancient-buddhist-texts.net) xác nhận người thọ ơn quên ơn. Không có bản Anh Sujato.
