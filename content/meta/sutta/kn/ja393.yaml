notes: |-
  Dịch từ Pāli root, không có tầng Anh ở commit ghim nên triangulation thấp, bài giữ draft.
  vighāsādin/ucchiṭṭhabhojin không có tiền lệ, phân biệt người ăn đồ thừa chân chính
  (bố thí rồi mới ăn phần còn lại) với kẻ ăn đồ thừa bỏ lại của thú dữ.
  ja393:2.1-2.2 (Sukassa bhāsamānassa, na nisāmetha paṇḍitā) đọc paṇḍitā là hô cách,
  nisāmetha là mệnh lệnh số nhiều: hỡi các bậc trí, chớ lắng nghe; cách đọc khác vẫn khả dĩ.
  Tên nipāta Chakkanipāta theo đa số Bộ Sáu Bài Kệ, phẩm Kharaputta giữ nguyên.
  Coordinartor chạy bốn cổng trước khi gộp: npm run validate, npm test, npm run check, npm run build.
  Lượt cải thiện 2026-10-13: đọc đối kháng 30 khoá, đổi 5 khoá. ja393:6.2 "kẻ khất thực khác" → "kẻ ăn xin khác"
  (vanibbaka đa số dịch "ăn xin": 15 khoá trong tầng Jātaka, ja547:142.2 cùng cụm aññe vāpi vanibbakā); terminology 8.5 → 8.8.
  ja393:2.3 "các anh em cùng bầy" → "các anh em ruột" (sodariya theo ja543:125.2 "anh em ruột"; "cùng bầy" là thêm nghĩa).
  ja393:3.3 "đồ thừa bỏ lại" → "đồ ăn thừa" (bỏ "bỏ lại" không có trong Pāli; ucchiṭṭha thống nhất "đồ ăn thừa" với 5.3, ja179:1.1, ja547:184.2);
  semantic_fidelity 9.0 → 9.2. ja393:5.1–5.2 bỏ động từ "nuôi sống" thừa ở 5.1 vì yāpentā chỉ có ở 5.3, câu giờ chỉ có một vị ngữ;
  grammar_logic 8.8 → 9.0. Giữ nguyên: "Suka" (tiền lệ tên chim ở ja255), kuṇapāda "ăn xác chết" (ja294:3.3).
  Bất định còn lại: mejjhāraññe (Mejjha là tên riêng hay "khu rừng thanh tịnh", không phân xử được: không có bài song song);
  na nisāmetha ở 2.2 vẫn là mệnh lệnh phủ định gọi các bậc trí, giữ cách đọc cũ.
  Triangulation giữ 6.5 (không có tầng Anh độc lập), technical_integrity giữ 9.6; chưa chạy bốn cổng validate/test/check/build.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli
  không xem bản dự án; so 10 khoá chênh lệch lớn nhất → khác nghĩa 2: sửa 2 (5.4 và 6.1, cùng một sự
  cố với 5.1 ngoài danh sách chênh lệch: lời của Suka ở Pāli là một lời liền từ 5.1 đến 6.4, nháy mở
  ở 5.1 và nháy đóng ở 6.4; bản trước đóng nháy ở 5.4 rồi mở lại ở 6.1, tách thành hai lời thoại và
  thiếu nháy mở ở 5.1; nay mở ở 5.1, bỏ nháy ở 5.4 và 6.1, đóng ở 6.4), giữ 7 (0.2, 0.3, 0.4, 1.2,
  3.4, 4.3, 7.1: bản mù đặt tên bài và tên nipāta khác hoặc chỉ khác diễn đạt, bản mù thêm chủ ngữ
  "chúng tôi" ở 4.3 mà Pāli chỉ có yāpentā), bất định 1 (4.2 sikhaṇḍino: "những con công" theo nghĩa
  sikhaṇḍī = công, nhưng cũng có thể là "có mào/có chỏm"; bản mù cũng không chắc). Không có bản Anh
  hay bản Việt độc lập khác. Rà đối kháng toàn bài: sửa thêm 1 (2.4 amhevāyaṁ: thêm "chính" cho eva,
  "vị này đang khen chính chúng ta"). Giữ "Suka", "kuṇapāda ăn xác chết", "đồ ăn thừa" cho ucchiṭṭha
  và "đồ thừa" cho vighāsa như trước. Nháy đơn, nháy kép khớp Pāli từng khoá sau khi sửa.
  triangulation không vượt 8,0 vì chỉ có một lần dịch lại cùng họ công cụ; technical_integrity vẫn
  9,6, chưa chạy lại: npm run validate, npm test, npm run check, npm run build.
