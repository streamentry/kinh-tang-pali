notes: |-
  Đã đọc HẾT Pāli lát qua v5/p5.txt trước khi viết. Không segment nào của lát này có …pe… nên hai phía đều 0 dấu lược. Mọi dấu nháy kép đều cân trên cả bài.
  Phẩm Littavagga → Phẩm Những Điều Nhỏ: 0 tiền lệ cho tên phẩm này (ja1 Phẩm Bụi Dơ, ja12 Phẩm Giới, ja21 Phẩm Nai Bốn Sừng, ja101/106/107 Phẩm Parosata); litta = nhỏ, bé, ngắn, mà Pāli không nói cái gì nhỏ nên dịch theo nghĩa chữ, không gắn vào con vật nào. Giữ Jātaka và Bộ Một Bài Kinh theo ja1, ja12; 0.1 và 0.2 ngắn hơn 40 ký tự nên chốt không kiểm trùng Pāli, nhưng tầng đã có tiền lệ dùng nguyên văn Jātaka.

  Tên kinh giữ nguyên dạng Pāli kèm hậu tố -jātaka cho 5 bài, theo đúng tiền lệ ja106 (Kinh Udañcanījātaka) và ja107 (Kinh Sālittakajātaka): vì là tên riêng của câu chuyện mà nghĩa cụm không chắc trong chức năng tên, thì dịch nghĩa sẽ là bịa. Mahāsāra, Visāsabhojana, Lomahaṃsa, Nāmasiddhi, Kūṭavāṇija đều thuộc loại đó. Chốt lọt_pāli của _hvi.py cũng chặn dạng rút gọn không trùng (Mahāsāra, Nāmasiddhi, Kūṭavāṇija) vì chưa có trong tầng Việt và không trùng từ nào của Pāli khoá đó.
  Vế 1.1 Sādhu kho paṇḍito nāma trùng sn10.7:9.1 (đã có trong tầng), lấy nguyên văn
  Thật tốt lành thay; phần còn lại dịch theo Pāli của bài này vì hai bài khác nhau
  (sn10.7 vế sau là putto jāto uresayo, không phải na tveva atipaṇḍito).
  Tiền lệ có đếm: paṇḍita → bậc trí tuệ (34); atipaṇḍita → bậc đại trí tuệ (8);
  upakūḷita → ôm lấy (ôm lấy 13); nāma → được gọi là.
  Giữ phủ định có nhấn mạnh của vế 1.2: na tveva là không được gọi là, không phải
  chỉ là, vì tveva khuếch đại lời phủ định.
  Vế 1.3 Atipaṇḍitena puttena là công cụ, nên dịch Với người con là bậc đại trí tuệ
  chứ không dịch thành mối quan hệ sở hữu; vế 1.4 manamhi upakūḷitoti chủ ngữ là
  người nói (vua), nên giữ ta.
  Cần biên tập biết: ja218 là cùng một câu chuyện (Kūṭavāṇijajātaka) nhưng metadata
  của ja218 đang ghi Kinh Kūṭavāṇija, còn lát này ghi Kinh Kūṭavāṇijajātaka cho khớp
  với chính dòng 0.4 và với ja106/ja107. Hai dạng đều dùng được; nếu biên tập muốn
  thống nhất thì cần sửa cả hai, việc đó ngoài lát của tôi.

  Kiểm toán 2026-10-15 (kiểm toán Jātaka chỉ có Pāli), Claude Sonnet 5.5 (Claude Code): Sửa 4/4 khoá kệ. Paṇḍita và Atipaṇḍita là tên hai người (hai thương nhân; kệ do người cha của Atipaṇḍita nói), bản cũ dịch thành "được gọi là bậc trí tuệ/đại trí tuệ"; atipaṇḍitena puttena là bởi người con Atipaṇḍita; upakūḷito (chú giải: cháy sém, nửa cháy) bị dịch "ôm lấy" sai nghĩa. manamhi giữ theo chú giải là "tôi đang (bị)" nên chỗ này còn bất định nhỏ. Tên phẩm Littavagga (khoá 0.3) đổi "Phẩm Những Điều Nhỏ" thành "Phẩm Litta" cho thống nhất với ja91; tên phẩm lấy từ tên bài đầu (Litta), bản cũ không có căn cứ Pāli. Chú giải Jātaka xác nhận. Không có bản Anh Sujato.
