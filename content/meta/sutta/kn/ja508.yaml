notes: |-
  Đợt 19, làn 68. Dịch từ Pāli root commit đã ghim, đủ 94/94 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; người nói chỉ được đọc từ nội dung kệ (xem BẤT ĐỊNH, mục 6). Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề và colophon.**
  - `0.2` “Bộ Hai Mươi Bài Kinh” (`Vīsatinipāta`, vīsati = 20): theo khuôn “Bộ N Bài Kinh” của `ja464` (“Bộ Mười Hai Bài Kinh”) và `ja474` (“Bộ Mười Ba Bài Kinh”). Đo lại 2026-10-11: `ja497`–`ja507`, `ja509`, `ja510` đều đã có bản Việt và đều ghi “Bộ Hai Mươi Bài Kinh” (11/11 khoá `:0.2` đo được khớp).
  - `0.3` “Phẩm Mātaṅga” (`Mātaṅgavagga`): giữ nguyên tên Pāli của phẩm, theo khuôn “Phẩm Parosata”, “Phẩm Haṁci”, “Phẩm Asampadāna”, “Phẩm Kakaṇṭaka” trong tầng; đo lại 2026-10-11, các bài cùng phẩm đã dịch (`ja497`–`ja507`, `ja509`, `ja510`) đều ghi “Phẩm Mātaṅga”.
  - `0.4` “12. Kinh Năm Bậc Hiền Trí” (`Pañcapaṇḍitajātaka`): “Kinh” + tên, theo `ja454` (“Kinh Bậc Hiền Trí Ghaṭa”); “hiền trí” cho `paṇḍita` theo `ja316` (“Thỏ Hiền Trí”). `23.1` “Kinh Năm Bậc Hiền Trí, thứ mười hai.”: có dấu phẩy trước số thứ tự. Đo trên các Jātaka từ `ja400` trở lên: 59 colophon có dấu phẩy, 37 không có. Số `12` ở `0.4` khớp `dvādasamaṁ` (12) ở `23.1`.

  **Tiền lệ dùng lại nguyên văn.** Đã dò 19 dòng Pāli của bài (sau khi bỏ dấu câu và dấu nháy) có dạng trùng nguyên văn ở bài khác trong tầng Pāli đã ghim (`18.1`–`22.3`); cả 19 đều nằm ở một bài duy nhất là `ja518`. Khi dịch lượt đầu `ja518` chưa có bản Việt; đo lại 2026-10-11 thì `ja518` đã có bản Việt, và 19/19 cặp đều cho bản Việt giống hệt bản của bài này (0 cặp lệch). Vì vậy các khoá `18.1`–`22.3` không được sửa riêng trong bài này, để hai bài không tách nhau.

  **Trùng nguyên văn trong chính bài (có kết quả):** đo lại 2026-10-11 sau khi bỏ dấu câu và dấu nháy: 7 nhóm Pāli trùng nguyên văn (gồm cả các khoá `8.x`/`17.x` mà bản trước xếp vào loại “gần trùng”), cả 7 đều đã dịch giống hệt nhau (0 cặp lệch). Các nhóm nguyên văn:
  - `1.3`, `3.3`, `4.3`, `5.3`, `6.3`, `7.3` (Nindiyamatthaṁ pasaṁsiyaṁ vā);
  - `8.2` với `17.2` và `8.3` với `17.3`;
  - `10.1` với `12.1`;
  - `13.4`, `14.4`, `15.4`, `16.5` (Guyhaṁ pātukataṁ sutaṁ mametaṁ).
  Ba cặp/nhóm gần trùng chỉ khác dấu nháy ở đầu hoặc cuối khoá: `8.1`/`17.1`, `8.4`/`17.4` và `12.4` so với `13.4`/`14.4`/`15.4`/`16.5`; bản Việt cũng chỉ khác ở dấu nháy, đúng như Pāli (`8.x` và `12.4` nằm trong lời trích, `17.x` và `13.4`–`16.5` thì không).

  **Số Pāli:** không có phép tính nào. `pañca` = 5 (`0.4`, `1.1`, `2.4`); `aṭṭha` ở `aṭṭhavaṅkaṁ` (`16.1`) = 8; `dvādasamaṁ` (`23.1`) = 12, khớp số `12.` ở `0.4`; `vīsati` (`0.2`) = 20. Không có cụm số nào chưa phân xử được (không gặp `Tiṁsakappasahassa`).

  **Thuật ngữ và tiền lệ đã đo:**
  - `janinda` (2.4, 12.2, 14.1) → “chúa tể loài người”: tầng có 13 khoá chứa `janinda`; dạng “chúa tể loài người” ở `ja481`, `ja482`, `ja483` (3), kèm “chúa loài người”, “chúa của loài người”, “nhân chủ”, “vua” đều ít hơn; 4 khoá còn lại dịch là “hỡi ngươi” (không dùng vì mất nghĩa “chúa”).
  - `rājaseṭṭha` (9.1) → “bậc vua tối thắng”: theo `ja111:1.2`; `ja411:2.4` dịch “bậc vua trong các vua”.
  - `deva` ở vocative (9.4) → “tâu đại vương”: 358 khoá chứa “tâu đại vương” trong `kn`, 0 khoá chứa “tâu bệ hạ”.
  - `devī` vocative (10.4) → “hoàng hậu”: 29 khoá chứa “hoàng hậu” trong `kn`; `devī` còn có nghĩa “nữ thần” ở `ja442` nhưng ngữ cảnh ở đây là vợ của vua (đối chiếu với `bhariyāya` ở `12.3`).
  - `bhūmipāla` (2.1) → “bậc hộ trì đất”: đo 19 khoá chứa `bhūmipāl-` có bản Việt trong toàn tầng sutta, 14 dùng “hộ trì đất” (`ja504`, `ja505`, `ja527` và các bài khác); bản trước ghi “hộ trì đất đai” và ghi nhầm là 0 tiền lệ, đã sửa theo đa số.
  - `dvipada` (7.1, 9.2): 0 tiền lệ; giữ “loài hai chân” để không làm mất thành tố trong ghép `dvipadajanindaseṭṭha`/`dvipadajaninda`.
  - `bhūripañña` (11.3) → “bậc trí tuệ rộng lớn”; `ja452:1.1` dịch `bhūripañña` là “trí tuệ rộng lớn”.
  - `anomapañña` (6.2) → “trí tuệ không thấp kém”: theo `ja441:5.1`.
  - `sīlasamāhita` (5.2) → “có giới, điềm tĩnh”: theo `ja175:1.2` (“có giới và điềm tĩnh”); `ṭhitatta` → “tâm an trú” theo `ja441:4.3`.
  - `anaññatheyyā` (3.1) → “không đổi lòng”: gốc `anaññathā` “không khác đi” (tầng Sujato: “not otherwise” ở `mn95`, `sn56.20`); 0 tiền lệ cho dạng `-eyyā`.
  - `paddhagū` (6.1) → “theo sát tâm ý”: tầng Sujato dịch `paddhagū` là “footman” (`thag13.1`, `snp5.11`), tức người đi theo hầu; `ja328:3.2` dịch “cất bước”. Chọn nghĩa “đi theo” cho hợp `pituhadayassa`.
  - `paṇhe` (10.1, 12.1) → “vào buổi sáng”: tầng Sujato dịch `paṇhe` là “at dawn” ở `cp32:4.2`; trong tầng Việt `ja513:4.2` và `5.4` dịch `paṇhe` là “vào buổi sáng” (2 khoá), `cp32:4.2` là “sáng mai” (1 khoá). Chọn “buổi sáng” theo `ja513`, vì “rạng sáng” (bản trước) hẹp hơn và không có tiền lệ nào trong tầng Việt. Đây không phải `pañhe` (câu hỏi).
  - `abhidosagato` (11.1) → “đã đi từ đêm qua”: tầng Sujato dịch `abhidosa-` là “just last night” (`mn26:23.9`, `mn85:47.9`, `abhidosakālaṅkato`).
  - `saṁhīra` (19.3) → “bị … lay chuyển”: tầng Sujato dịch `asaṁhīra` là “unfaltering/unshakable” (`mn131`–`mn134`); `āmisa` → “mồi lợi” theo `ja233:2.1` (“mồi thế gian”).
  - `nātivelaṁ` (22.2) → “chớ … quá mức”: theo `ja215:2.2` (“chớ quá nhiều”) và `ja331:3.3` (“quá mức”).
  - `thiyā` (19.1) → “phụ nữ”: 43 khoá chứa “phụ nữ” và 41 chứa “đàn bà” trong `kn` (gần ngang nhau); chọn “phụ nữ”.
  - `Sakko` (16.2) → “Sakka”: 404 khoá chứa “Sakka” so với 32 chứa “Đế Thích” trong toàn tầng sutta.
  - `sālavana` (13.1) → “rừng sāla”: 53 khoá chứa “rừng sāla”.
  - `pitāmaha` (16.2) → “ông nội”; `ja163`, `ja271`, `ja337` dịch các dạng ghép là “tổ tông”/“ông bà tổ tông”, nhưng ở đây `pitāmaha` đứng riêng và số ít.
  - `titikkhati` (20.4) → “chịu đựng”: theo `ja278:1.4`, `ja312:1.4`, `ja435`.
  - Cách dịch `guyha`: “việc kín” cho `guyhamatthaṁ` (guyha + attha); “điều kín” cho `guyhaṁ` đứng riêng; “điều bí mật” chỉ cho `rahassaṁ` (22.1); “việc bàn kín”/“lời bàn kín” cho `manta` (20.3, 21.2, 22.3, 22.4) để không lẫn với “thần chú” của `manta` ở `ja474`. Tầng chỉ có 6 khoá khác chứa `guyha-` có bản Việt (ở 3 bài: `ja214`, `ja473`, `ja478`), nên đây là lựa chọn của bài, không phải đa số đo được.

  **Dấu câu (khớp Pāli từng khoá).** Nháy kép `“`/`”`: Pāli 13/13, Việt 13/13, lệch 0/94 khoá. Nháy đơn `‘`/`’`: Pāli 2/2 (cả hai trong `10.1`, `12.1`), Việt 2/2, lệch 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0, nên không có gì để cân. Cấu trúc nháy của Pāli: lời trích mở ở `1.1`…`11.1`, đóng ở `…4`; `12.1`–`12.4` là một lời trích riêng; `13.1`–`22.4` là một lời trích dài mở ở `13.1` và đóng ở `22.4` (`bhedan”ti`), nên các khoá `13.2`–`22.3` không có dấu nháy trong cả Pāli lẫn Việt. Một lỗi đã bắt khi tự kiểm: bản nháp đầu bỏ sót dấu mở nháy kép ở `13.1`; phép so từng khoá bắt được và đã sửa.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `arājayutto` (14.2): dịch “không hợp với người hầu vua”, đọc `a-` + `rājayutta` (“người của vua”; `tha-ap535:10.2` có `rājayuttaṁ`); chưa có chú giải để xác nhận. Cách đọc khác: “không thuộc về vua / không phải việc của vua”.
  2. `Kāmindo naradevena phuṭṭho` (15.2): dịch sát “Kāminda đã bị vua chạm đến” (`naradeva` là “vua”, `phuṭṭho` “bị chạm/vướng phải”). Không chắc `naradevena` là tác nhân (“bởi vua”) hay chỉ một danh xưng; một cách đọc khác là `naradeva` ở hô cách (như `janinda` ở `14.1`) kèm đại từ `ena` (“bị chứng ấy chạm đến, tâu vua”). Không phân xử được bằng tầng đã ghim; không thêm điều gì ngoài chữ.
  3. `asabbhirūpa` (13.2, 15.1): dịch “không xứng với bậc hiền thiện”. Đo toàn tầng sutta: 56 khoá chứa `sabbhi-` có bản Việt, 36 khoá dùng “bậc hiền” (phần lớn “bậc hiền thiện”, ví dụ `sn1.31`); ghép `-rūpa` chỉ có `ja542:13.2` (“không ra dáng người hiền thiện”). Bản trước dùng “người lương thiện”, lệch đa số, đã sửa. Nghĩa chính xác của `-rūpa` ở đây (xứng/ra dáng) vẫn là cách đọc, không phải chắc chắn.
  4. `hadayattheno` (19.4): dịch “kẻ trộm lòng” (`theno` = kẻ trộm, theo `ja392` “kẻ trộm hương”). Nghĩa chính xác của “trộm lòng” (kẻ giả thân để lấy lòng tin) chỉ suy từ ghép; không giải thích thêm trong thân kinh.
  5. `mantinaṁ` (21.2): dịch “người đang bàn việc kín”; có thể đọc là sở hữu cách số nhiều của `mantī` (“những người bàn mưu”), nghĩa gần như nhau.
  6. Người nói không có trong tầng Pāli đã ghim, nên được suy từ nội dung kệ và không ghi vào thân kinh: `1` là vua hỏi năm bậc hiền trí; `2`–`7` do các bậc hiền trí đáp, mỗi đoạn một người nhận kín (vợ, bạn, anh em, con, mẹ); `8` là lời chốt (giữ kín); `9` người hỏi vua vì sao buồn; `10` vua trả lời (xưng “ta”, gọi “devī”); `11` hỏi người vừa đến; `12`–`22` một người trình bày chuyện lộ kín của vua và bốn người kia (Senaka, Pukkusa, Kāminda, Devinda) rồi nêu bài học. Các đại từ trong Việt (“ngài”, “tôi”, “ta”, “nàng”) chỉ theo ngôi thứ nhất/thứ hai của Pāli (`tvaṁ`, `te`, `me`, `mayhaṁ`, `tuyhaṁ`), không gán danh tính; `9`, `11`, `12` có thể đổi người nói nếu có văn xuôi khung truyện chứng thực.
  7. `Abhidosagato dāni ehisi` (11.1): `ehisi` có thể đọc là “ngài sẽ đến/nay mới đến”; dịch “nay ngài mới đến”. Một cách đọc khác của `abhidosa-` là nghĩa “lỗi/giận” (`dosa`); chọn nghĩa “đêm qua” vì có tiền lệ Sujato ở `abhidosakālaṅkato` (xem trên).
  8. `yadi te mantayitaṁ janinda dosaṁ` (12.2): dịch “nếu việc ngài bàn định ấy là một lầm lỗi”, để mệnh đề kế tiếp (`bhariyāya rahogato asaṁsi`) đọc như hệ quả mà không thêm từ nối. `mantayitaṁ` có thể là phân từ hoặc dạng nguyên mẫu; không phân xử được.
  9. `Aṭṭhavaṅkaṁ` (16.1): dịch “tám góc”; `vaṅka` là “cong/góc”, nên “tám khúc cong” cũng được; 0 tiền lệ.
  10. `Devindassa gataṁ tadajja hatthaṁ` (16.3): dịch “hôm nay viên ngọc ấy đã vào tay Devinda”; chủ ngữ ngầm (`tad` = viên ngọc) là suy từ cấu trúc.
  11. `rattiṁ giraṁ nātivelaṁ pamuñce` (22.2): dịch “ban đêm chớ thốt lời quá mức”; vì phủ định gắn với trạng từ `ativelaṁ`, câu có thể đọc “ban đêm hãy nói nhưng đừng quá mức” hoặc “đừng nói quá lâu/quá muộn”; chọn cách đọc ít giả định nhất.
  12. `ca` ở `14.3`, `16.4` (`Bhātuñca`, `Mātuñca`): dịch bằng “cũng” để giữ nghĩa liệt kê; không thêm nội dung.

  **Coverage English (mục 7):** mẫu số = 0. Sau khi nén khoảng trắng, dòng Pāli dài nhất ở các khoá khác `:0` chỉ 36 ký tự (< 40), nên không khoá nào có nội dung; 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja508`; `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng, nên `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Không đụng `content/meta/reference-gaps.yaml`.

