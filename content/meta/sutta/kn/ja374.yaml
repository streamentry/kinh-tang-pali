notes: |-
  `Cūḷadhanugghajātaka`, bài thứ tư của `Aḍḍhavagga` trong `Pañcakanipāta`. 35 khoá, tất cả đã dịch. TẦNG THAM KHẢO — đo, không đoán. 0/7 bài `kn` của lát này có bản Anh Sujato tại commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có `cp, dhp, iti, ja, kp, snp, thag, thig, ud` (đếm trực tiếp trên đĩa: cp 35, dhp 26, iti 11, ja 83, kp 9, snp 5, thag 264, thig 73, ud 8 tệp) — **không có `mil`**, và `ja374/376/407/412` không nằm trong 83 tệp `ja` ấy. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit đã ghim có đúng 26 tệp và tất cả đều là `dhp*` (Pháp Cú). Lớp lấp `english-project` của dự án không có uid nào trong lát. Ba tầng tham khảo đều vắng ⇒ bài dịch chỉ từ Pāli root ⇒ blocker thật, và đây là **giới hạn upstream**, không phải lỗi của người dịch. Vì vậy `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng để né blocker, và `status` là `draft` vì `scripts/validate.ts` coi tệp Anh thiếu là **error** khi status là `review` hoặc `published`.

  TÊN BÀI VÀ TÊN PHẨM — theo đa số **đo được** trong chính các bài lân cận: `0.1` → *Jātaka* (372/388 bài `ja` đã có; **không** bài nào dùng *Kinh Trường Bộ* — đếm toàn kho chỉ ra 2 chỗ, cả hai đều là tiêu đề của bộ `dn` trong `content/catalog/sutta/dn.json`, nên ghi chú trong BRIEF về `ja` là nhầm với `dn`, ghi lại để người điều phối biết); `0.2` `Pañcakanipāta` → *Bộ Năm Bài Kệ* (đối chiếu `ja358`, `ja371`); `0.3` `Aḍḍhavagga` → *Phẩm Aḍḍha* (`ja371`, `ja373`); `0.4` và `8.1` giữ Pāli `Cūḷadhanuggha` theo mẫu `1. Kinh Dīghītikosala` của `ja371`.

  DÙNG LẠI NGUYÊN VĂN — ĐẾM ĐƯỢC 4/6 khoá có Pāli trùng. `ja374:0.1`–`0.3` lấy từ `ja371`/`ja358`; `ja374:5.2` `attano pana duddasaṁ;` lấy y hệt `dhp252:2` → *nhưng lỗi của mình thì khó thấy;*.

  **HAI CHỖ DỊCH RIÊNG, CÓ LÝ DO.** (1) `2.1` `“Asanthutaṁ maṁ cirasanthutena,` trùng nguyên văn với `ja318:4.1`, nhưng ở `ja318` câu đó do một người đàn bà nói về chuyện tình duyên (*Nàng Sāmā đã đổi người tình lâu năm…*), còn ở đây là con sếu nói với lũng thú. Dùng lại sẽ sinh ra hai bản Việt không liên quan cho cùng một Pāli, nên dịch riêng. (2) `4.4` `kapaṇo viya jhāyasi”.` trùng với `ja220:1.4`, nhưng bản của `ja220` là mảnh câu phụ thuộc (`jhāna` ở dòng trước), không dùng lại được; giữ đúng từ đã dùng *kẻ nghèo khó* để còn nhất quán với thuật ngữ.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU. (1) `ahuhāsiyaṁ` ở `3.2` là từ **không tra được** trong kho Pāli và không có bản dịch nào; dịch *gây ra tiếng than vãn* như một cách đọc, và đây là lý do `ambiguity_integrity` chỉ 8.4. (2) `addhuvaṁ dhuvena` ở `2.2` (*ta cũng chẳng được trăm phần một*) là cách đọc theo nghĩa *trăm phần một*; `dhuvena` không tra được nghĩa chắc chắn. (3) `Migova` ở `ja376:7.3` giữ nguyên là *Migo* — đây là tên do Pāli đưa, không phải *Migadeva* của các bản kể.

  NGOẶC KÉP CÓ BỔ SUNG CẦN THIẾT. Ở `4.1` và `6.1` Pāli mở `“` nhưng dấu đóng chỉ về ở `7.4` (`”ti.`); hai chỗ mở `“` về sau (`6.1`–`6.4`) được dùng như **trích dẫn lồng nháy cong** `‘’` để danh sách nháy kép cân trên cả bài. Đây là quyết định hình thức, không thêm nghĩa nào vào thân kinh.

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó — BRIEF cấm `npm run validate|test|build|check` trong từng lát, nên để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6** vì mọi chốt tự động của lát đã xanh (thiếu khoá, thừa khoá, ngoặc kép cân trên cả bài, NFC, không trùng nguyên văn Pāli, không lọt Pāli, khớp số dấu lược) và 35/35 khoá của chính bài này; chưa đủ 10.0 vì cổng `npm` và lượt rà của người chưa chạy.

  LƯỢT CẢI THIỆN 2026-10-11. Đọc đối kháng từng cặp Pāli↔Việt của cả 35 khoá; ĐỔI 31 khoá, giữ nguyên `0.1`–`0.3` và `5.2`; tập khoá và thứ tự không đổi. Mục này THAY các khẳng định cũ ở trên về nghĩa của kệ `1`–`7` (cụ thể: "`ahuhāsiyaṁ` = gây ra tiếng than vãn", "`dhuvena` không tra được", "`Migova` ở `ja376:7.3`", "kẻ sói", "bạch Sona", và đoạn nói ngoặc kép `4.1`/`6.1` đóng ở `7.4`); các ý đó là lỗi hoặc lẫn từ bài khác của bản trước. Thực tế mỗi kệ `1`–`7` tự mở và tự đóng ngoặc kép; đã kiểm nháy kép/đơn khớp Pāli từng khoá, 0 lệch trên 35 khoá.

  LỖI ĐÃ BẮT VÀ SỬA (đều là accuracy fix, có căn cứ Pāli hoặc tiền lệ đã đo).
  (1) `0.4` và `8.1`: tên bài viết sai `Cūḷadhanuggha`; Pāli là `Cūḷadhanuggahajātaka`, sửa thành `Cūḷadhanuggaha`.
  (2) `1.1`–`1.4`: "bạch ông" và "ta cũng nhờ ngài mà được giải thoát" đảo chủ thể và thêm ý "giải thoát" không có; `mampi tārehi dānito` là lời yêu cầu "hãy đưa cả tôi sang (bờ)", nay dịch đúng như vậy.
  (3) `2.1`–`2.4`: bản cũ ("Ngài không hẹn ta… bữa cơm bé mọn… trăm phần một…") không có căn cứ Pāli. Nay: `nimīni` đọc là "đã đổi", danh từ đối cách là cái nhận về (`asanthutaṁ maṁ`, `addhuvaṁ`, `aññaṁ`), danh từ công cụ cách là cái bỏ đi (`cirasanthutena`, `dhuvena`, `mayā`): "bà đổi người quen lâu năm lấy ta là kẻ lạ; đổi cái vững bền lấy cái không vững bền; ngay cả ta bà cũng có thể đổi lấy người khác". Cách đọc này khớp với `2.3` (`mayāpi … nimineyya aññaṁ`) và với `ja318:4.1`.
  (4) `3.1`–`3.6`: `kāyaṁ` là `kā ayaṁ` ("ai đây"), không phải "thân"; đối chiếu `ja274:1.1`/`ja275:2.1` (`Kāyaṁ balākā …`, bản Việt đã có "Con cò xinh đẹp này là ai"). `susoṇi` → "hỡi nàng hông đẹp" (`ja442:7.3`); `sobhane` → "hỡi người xinh đẹp" (`ja415:9.2`); `kiṁ nu jagghasi` → "sao nàng lại cười" (`jagghati`: `ja375:3.1`, `ja517:5.4`, `ja547:277.4`); `nayīdha` = `na idha`: "ở đây chẳng có múa hát, cũng chẳng có nhịp phách hòa khéo" (`tāḷa` → "nhịp phách", `ja539:150.1`). Bản cũ ("Thân ngươi là một khối u lạc", "bạch Sona", "ngươi còn tưởng mình thắng được") không có căn cứ.
  (5) `4.1`–`4.4`: `macchañca pesiñca` là "cá và miếng thịt" (`maṁsapesi` → "miếng thịt": 16 khoá), không phải "hỡi cá, hỡi chim"; `siṅgāla`/`jambuka` → "chó rừng" (`ja335`, `ja490`, các bài `Siṅgālajātaka`); `bāla dummedha` → "kẻ ngu, kẻ kém trí" (đa số đo được: `bālā dummedhino` → "kẻ ngu si, thiếu trí"); `appapañño` → "ít trí tuệ" (`sn9.3:2.2`); `kapaṇo viya jhāyasi` → "ngồi ủ ê như kẻ khốn khổ": `kapaṇa` → "khốn khổ" 25 khoá (+ 10 "đáng thương") so với "nghèo khó" 4 khoá, cả 4 nằm trong một bài `ja220`; `jhāyati` kiểu này → "ủ ê" (`mnd7:40.2`, `ja492:9.4`). "Siêng-đa-la" và "kẻ sói" là phiên âm/diễn sai.
  (6) `5.1`–`5.4`: `5.1`–`5.2` dùng lại nguyên văn `dhp252:1`–`2` (Pāli trùng); `5.3` "Đã bị thua, đã ngã nhào và tuổi già" sai hoàn toàn: `jīnā patiñca jārañca` là "mất cả chồng lẫn nhân tình" (`jīno`/`jīnā` → "mất": `ja351:1.1`–`1.2`, `4.3`; `jāra` → "nhân tình": `ja327:4.3`); `maññe tvaññeva jhāyasi` → "ta nghĩ chính ngươi mới ngồi ủ ê" (không còn "chỉ nghĩ thế thôi").
  (7) `6.1`–`6.4`: `bhattu hessaṁ vasānugā` → "sẽ là người thuận theo ý chồng" (`vasānuga` → "thuận theo", `ja508:3.2`, `ja502:18.4`), không phải "làm chủ xứ kia"; `Sā nūnāhaṁ ito gantvā` cho thấy người nói là nữ tự xưng (cùng công thức ở `ja418:4.1`).
  (8) `7.1`–`7.4`: `thālaṁ` → "đĩa" (`lohathālaka` 8 khoá "đĩa"/2 "chén"); `mattikā` kiểu "bát đất nung" 4 khoá (`thag16.7:21.3`) nên "đất nung"; `kaṁsa` → "đồng thau" (`ja306:1.2`); "Tội lỗi ngươi đã gây ra bằng nó" không có trong Pāli, nay "điều ác ngươi đã làm rồi, ngươi cũng sẽ lại làm như thế".
  Pāli trùng nguyên văn với bài khác: 5 cặp có nội dung (≥ 12 ký tự chữ) đã dò toàn tầng, trong đó 3 cặp bản Việt khác: `2.1`↔`ja318:4.1` (bản `ja318` có chủ ngữ `Sāmā` trong chính câu), `4.4`↔`ja220:1.4` (`ja220` là `jhāyati` nghĩa thiền định và mang nghĩa "nghèo khó" khác đa số 25/4), `6.3`↔`ja418:4.1` (bản `ja418` đọc sai người nói, không dùng lại được); `5.1`, `5.2` dùng lại nguyên văn. Pāli trùng trong chính bài: 0 cặp, phép này chạy rỗng.
  Tiền lệ phẩm: `Pañcakanipāta` ở `0.2` trong kho có ba dạng — "Nhóm Năm Bài Kệ" 16, "Bộ Năm Bài Kệ" 5, "Bộ Năm Kệ" 3; giữ "Bộ Năm Bài Kệ" vì khớp 4/5 bài cùng phẩm `Aḍḍha` (`ja371`, `ja372`, `ja374`, `ja375`) và họ "Bộ N Bài Kệ" của các nipāta khác; không đổi.

  ĐIỂM ĐỔI TRONG LƯỢT NÀY. `terminology` 8.8 → 9.0 (thay các từ sai bằng tiền lệ đã đếm; bỏ phiên âm "Siêng-đa-la", "Sona"). `vietnamese_clarity` 8.8 → 8.9 (các câu vô nghĩa ở `3.x`, `4.3`, `5.3`, `7.3` nay đọc được). `semantic_fidelity` 8.9 → 8.8 (HẠ: điểm cũ chấm cho bản có nhiều lỗi nghĩa; bản này đã sửa nhưng còn bốn điểm chưa phân xử bên dưới). Các tiêu chí khác giữ nguyên, kể cả `triangulation` 7.5 (không có bản Anh, không có bản Việt tham khảo) và `ambiguity_integrity` 8.4.

  BẤT ĐỊNH CÒN LẠI, KHÔNG GIẤU. (1) `ahuhāsiyaṁ` (`3.2`) là từ chỉ có ở bài này trong tầng Pāli đã ghim; dịch "tiếng cười a-hu" theo cấu tạo `ahu` + `hāsiya` và theo mạch (`jagghasi` ở `3.6`): nghĩa "cười" chắc, sắc thái tượng thanh "a-hu" chưa kiểm được. (2) `anamhikāle` (`3.5`) cũng chỉ có ở bài này; "không đúng lúc" theo mạch (`3.3`–`3.4` nói không có múa hát, nhạc), chưa tra được từ nguyên. (3) `dānito` (`1.4`) chỉ có ở bài này; "bây giờ" theo mạch. (4) Hướng của `nimināti` (bên bỏ đi/bên nhận về) suy từ ngữ cảnh và từ `2.3`, không có từ điển hay bản Anh đối chứng; nếu đảo ngược thì `2.1`–`2.3` đổi nghĩa. (5) Tầng Pāli ghim chỉ có kệ, không có văn xuôi duyên khởi, nên người nói từng kệ suy từ ngữ pháp (giống cái `jīnā`, `sā nūnāhaṁ`, hô cách `susoṇi`), không từ văn xuôi; người nói của kệ `7` không xác định được, giữ "ngươi". (6) `migarāja` ở `6.1` dùng gọi chó rừng (cùng câu với `jambuka`), dịch theo nghĩa đen "chúa tể loài thú", không thêm sắc thái mỉa mai. (7) `katañceva` ở `7.3` đọc là `kataṁ ca eva`; nếu là `kataṁ ce eva` ("nếu đã làm") thì thành câu điều kiện, chưa phân xử. (8) `eḷagalā` giữ nguyên, không xác định loài cây.

  BLOCKER VÀ KỸ THUẬT. Blocker "không có tầng tham khảo tiếng Anh/Việt tại commit đã ghim" giữ nguyên (giới hạn upstream, đã có waiver; không đổi). Không thêm blocker mới: các điểm bất định trên không đổi giáo nghĩa. `technical_integrity` giữ 9.6; lượt này không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên chưa tuyên bố cổng kỹ thuật đã pass.

  LƯỢT CẢI THIỆN 2026-10-13 (ghi nhận ngày chấm thực tế 2026-10-14). Đọc đối kháng lại cả 35 cặp Pāli↔Việt sau lượt 2026-10-11; không tìm thấy lỗi nghĩa nặng hay vừa còn sót. ĐỔI 3 khoá (đều là chỉnh nhẹ, không đổi nghĩa trọng yếu); tập khoá và thứ tự không đổi, 32 khoá còn lại giữ nguyên có chủ đích.
  (1) `3.1` "bụi eḷagalā" → "bụi cây eḷagalā" (terminology/style): `eḷagalāgumbe` có đúng một tiền lệ khác trong toàn Pāli là `sn22.2:3.1`, bản Việt đã có dịch là "một bụi cây eḷagalā"; `gumba` được dịch "bụi cây" cho nhất quán. Tiêu chí không đổi điểm.
  (2) `3.2` "đang bật ra tiếng cười a-hu" → "đang phát ra tiếng cười a-hu" (accuracy/style): `karoti` chỉ là "làm ra/phát ra", không có sắc thái đột ngột như "bật ra". Tiêu chí không đổi điểm.
  (3) `7.2` "kẻ ấy cũng sẽ lấy cả đĩa đồng thau" → "kẻ ấy cũng có thể lấy cả đĩa đồng thau" (grammar): `so hare` là optative (cùng thể với `yo hare` ở `7.1`), diễn đạt khả năng/đặc tính chung của câu ngạn ngữ, không phải tương lai; tương tự `nimineyya` ở `2.3` đã dịch "có thể đổi". `7.4` `karissasī` vẫn là tương lai ("sẽ lại làm"). Tiêu chí không đổi điểm.
  KHÔNG đổi dù có nghi ngờ: (a) `6.3` giữ "ta" cho người đàn bà, trong khi `1.4` là "tôi". Đo lại Pāli trùng nguyên văn với bài khác: 5 cặp có nội dung; 3 cặp dùng lại nguyên văn bản Việt (`5.1`, `5.2` ↔ `dhp252:1`–`2`; `6.3` ↔ `ja418:4.1`, hiện đã giống hệt "vậy thì ta, đi khỏi nơi này"), 2 cặp khác có lý do (`2.1` ↔ `ja318:4.1` vì chủ ngữ `Sāmā` nằm trong câu của bài kia; `4.4` ↔ `ja220:1.4` vì bản `ja220` dịch sai nghĩa `jhāyasi`, xem mục lỗi ngoài phạm vi). Nếu người biên tập muốn thống nhất xưng hô cho nhân vật này trong cả bài thì phải đổi cả `6.3` lẫn `ja418:4.1` (ngoài phạm vi); còn `1.4` là lời cầu xin của người đàn bà với người nam nên giữ "tôi". Điều này sửa lại ghi chú cũ nói `ja418:4.1` "đọc sai người nói, không dùng lại được": bản Việt hiện tại của `ja418:4.1` trùng với `6.3`. (b) `1.1` "hết mọi" hơi thừa nhưng không sai nghĩa. Pāli trùng nguyên văn trong chính bài: 0 cặp, phép này chạy rỗng.
  GIẢI QUYẾT BẤT ĐỊNH — đã thử, không phân xử được. Quét toàn tầng Pāli đã ghim: `ahuhāsiyaṁ` 1 lần (chỉ ở `3.2`), `anamhikāle` 0 dạng tương đồng đáng tin ngoài bài này (các kết quả khớp chuỗi là dạng `-mhi` của danh từ khác, không liên quan), `dānito` 1 lần (`pe5:66.10` là chữ khác `samuddānito`); chỉ `eḷagalā` có tiền lệ (`sn22.2:3.1`). Không có bản Anh, bản Việt tham khảo hay từ điển trong kho để đối chứng, nên ba từ trên (nghĩa "cười a-hu", "không đúng lúc", "bây giờ") vẫn là cách đọc theo ngữ cảnh. Điểm mới xác nhận được: hướng của `nimināti` ở `2.1`–`2.3` đúng, vì bài `ja318:4.1`–`4.3` có đúng cùng công thức (`asanthutaṁ maṁ cirasanthutena`, `nimīni … adhuvaṁ dhuvena`, `mayāpi … nimineyya aññaṁ`) và bản Việt của bài đó ("đổi người tình lâu năm để lấy ta là kẻ mới quen", "đổi điều chắc chắn lấy điều bất định") đọc cùng hướng với bản này. Bất định (4) của lượt 2026-10-11 vì thế được thu hẹp: hướng đổi đã có đối chứng nội tại trong kho. Các bất định còn lại (1)–(3), (5)–(8) không đổi.
  ĐIỂM. Không đổi tiêu chí nào so với lượt 2026-10-11: 3 chỉnh sửa trên là chỉnh nhẹ, không đủ để nâng điểm, và các từ hiếm chưa phân xử cùng việc không có văn xuôi duyên khởi (người nói suy từ ngữ pháp) vẫn giữ `semantic_fidelity`, `grammar_logic`, `ambiguity_integrity` và `triangulation` ở mức cũ. `final_score` giữ 8.99 (trung bình thô của 10 điểm), vẫn nằm trong 8.0–9.0 nên bài ở `review`. Blocker "không có tầng tham khảo tiếng Anh/Việt tại commit đã ghim" giữ nguyên; không thêm blocker mới.
