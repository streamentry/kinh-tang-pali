notes: |-
  `Cūḷadhanugghajātaka`, bài thứ tư của `Aḍḍhavagga` trong `Pañcakanipāta`. 35 khoá, tất cả đã dịch. TẦNG THAM KHẢO — đo, không đoán. 0/7 bài `kn` của lát này có bản Anh Sujato tại commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có `cp, dhp, iti, ja, kp, snp, thag, thig, ud` (đếm trực tiếp trên đĩa: cp 35, dhp 26, iti 11, ja 83, kp 9, snp 5, thag 264, thig 73, ud 8 tệp) — **không có `mil`**, và `ja374/376/407/412` không nằm trong 83 tệp `ja` ấy. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit đã ghim có đúng 26 tệp và tất cả đều là `dhp*` (Pháp Cú). Lớp lấp `english-project` của dự án không có uid nào trong lát. Ba tầng tham khảo đều vắng ⇒ bài dịch chỉ từ Pāli root ⇒ blocker thật, và đây là **giới hạn upstream**, không phải lỗi của người dịch. Vì vậy `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng để né blocker, và `status` là `draft` vì `scripts/validate.ts` coi tệp Anh thiếu là **error** khi status là `review` hoặc `published`.

  TÊN BÀI VÀ TÊN PHẨM — theo đa số **đo được** trong chính các bài lân cận: `0.1` → *Jātaka* (372/388 bài `ja` đã có; **không** bài nào dùng *Kinh Trường Bộ* — đếm toàn kho chỉ ra 2 chỗ, cả hai đều là tiêu đề của bộ `dn` trong `content/catalog/sutta/dn.json`, nên ghi chú trong BRIEF về `ja` là nhầm với `dn`, ghi lại để người điều phối biết); `0.2` `Pañcakanipāta` → *Bộ Năm Bài Kệ* (đối chiếu `ja358`, `ja371`); `0.3` `Aḍḍhavagga` → *Phẩm Aḍḍha* (`ja371`, `ja373`); `0.4` và `8.1` giữ Pāli `Cūḷadhanuggha` theo mẫu `1. Kinh Dīghītikosala` của `ja371`.

  DÙNG LẠI NGUYÊN VĂN — ĐẾM ĐƯỢC 4/6 khoá có Pāli trùng. `ja374:0.1`–`0.3` lấy từ `ja371`/`ja358`; `ja374:5.2` `attano pana duddasaṁ;` lấy y hệt `dhp252:2` → *nhưng lỗi của mình thì khó thấy;*.

  **HAI CHỖ DỊCH RIÊNG, CÓ LÝ DO.** (1) `2.1` `“Asanthutaṁ maṁ cirasanthutena,` trùng nguyên văn với `ja318:4.1`, nhưng ở `ja318` câu đó do một người đàn bà nói về chuyện tình duyên (*Nàng Sāmā đã đổi người tình lâu năm…*), còn ở đây là con sếu nói với lũng thú. Dùng lại sẽ sinh ra hai bản Việt không liên quan cho cùng một Pāli, nên dịch riêng. (2) `4.4` `kapaṇo viya jhāyasi”.` trùng với `ja220:1.4`, nhưng bản của `ja220` là mảnh câu phụ thuộc (`jhāna` ở dòng trước), không dùng lại được; giữ đúng từ đã dùng *kẻ nghèo khó* để còn nhất quán với thuật ngữ.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU. (1) `ahuhāsiyaṁ` ở `3.2` là từ **không tra được** trong kho Pāli và không có bản dịch nào; dịch *gây ra tiếng than vãn* như một cách đọc, và đây là lý do `ambiguity_integrity` chỉ 8.4. (2) `addhuvaṁ dhuvena` ở `2.2` (*ta cũng chẳng được trăm phần một*) là cách đọc theo nghĩa *trăm phần một*; `dhuvena` không tra được nghĩa chắc chắn. (3) `Migova` ở `ja376:7.3` giữ nguyên là *Migo* — đây là tên do Pāli đưa, không phải *Migadeva* của các bản kể.

  NGOẶC KÉP CÓ BỔ SUNG CẦN THIẾT. Ở `4.1` và `6.1` Pāli mở `“` nhưng dấu đóng chỉ về ở `7.4` (`”ti.`); hai chỗ mở `“` về sau (`6.1`–`6.4`) được dùng như **trích dẫn lồng nháy cong** `‘’` để danh sách nháy kép cân trên cả bài. Đây là quyết định hình thức, không thêm nghĩa nào vào thân kinh.

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó — BRIEF cấm `npm run validate|test|build|check` trong từng lát, nên để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6** vì mọi chốt tự động của `_hvi.kiểm` đã xanh (thiếu khoá, thừa khoá, ngoặc kép cân trên cả bài, NFC, không trùng nguyên văn Pāli, không lọt Pāli, khớp số dấu lược) và 35/35 khoá của chính bài này; chưa đủ 10.0 vì cổng `npm` và lượt rà của người chưa chạy.
