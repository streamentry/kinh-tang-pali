notes: |-
  Đợt 19, làn 45. Dịch từ Pāli root commit đã ghim, đủ 63/63 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên không ghi người nói vào thân kinh. Kệ 1–6 hỏi và đáp về kẻ thù, kệ 7–12 hỏi và đáp về bạn; đây là cách đọc từ nội dung kệ, không phải từ văn xuôi.

  **Tiêu đề và phần cuối bài, theo tiền lệ.**
  - `0.1`–`0.3` dùng lại nguyên văn từ `ja471:0.1`–`0.3` (cùng `Dvādasakanipāta` + `Cūḷakuṇālavagga`): “Jātaka”, “Bộ Mười Hai Bài Kinh”, “Phẩm Cūḷakuṇāla”.
  - `0.4` và `13.1`: `Mittāmittajātaka` → “Kinh Bạn Và Kẻ Thù”, dùng lại cách dịch của `ja197:0.4`, `ja197:3.1` (cùng tên, bài Dukanipāta). Số thứ tự `10.` theo tiêu đề Pāli; `13.1` “Kinh Bạn Và Kẻ Thù, thứ mười.” có dấu phẩy theo `ja471:13.1`, `ja474:14.1`.
  - `14.1` `Dvādasakanipātaṁ niṭṭhitaṁ` → “Bộ Mười Hai Bài Kinh đã hoàn tất.”, theo khuôn “Bộ … đã hoàn tất.” của `ja416:13.1`, `ja426:10.1`, `ja438:11.1`, với tên bộ theo `0.2` của chính bài.
  - `15.1` `Tassuddānaṁ` → “Tóm lược:” (khuôn dùng ở `ja416:9.1`, `ja426:11.1`, `ja438:12.1`). `16.1`–`16.4` là kệ tóm lược mười bài của phẩm; theo khuôn của `ja426:12`, `ja438:13` và `ja190:5`, tên bài giữ nguyên Pāli, không dịch tên riêng, và dấu “— mười bài ấy” theo `ja190:5.4`, `ja110:4.4`. Đối chiếu tên với mười bài trong phẩm: Lahucitta = ja464 (kệ 1.1 “Luddhānaṁ lahucittānaṁ”), Sasāla = ja465 Bhaddasāla, Kasanti = ja466 (kệ 1.1 “Kasanti vapanti”), Kāma = ja467, Dasakhaluṭṭhāna = ja468 (kệ 1.1 “Dasa khalu imāni ṭhānāni”), Kaṇha = ja469, Sukosiya = ja470 Kosiya, Meṇḍa = ja471, Paduma = ja472 Mahāpaduma, Mittavara = ja473; đủ 10. Phần đối chiếu này chỉ để kiểm tra, không đưa vào thân kinh.

  **Tiền lệ dùng lại nguyên văn.** Pāli `Na naṁ umhayate disvā, / na ca naṁ paṭinandati; / Cakkhūni cassa na dadāti, / paṭilomañca vattati.` (`2.1`–`2.4`) trùng nguyên văn với `ja197:1.1`–`1.4`; đã dùng lại đúng bản Việt của `ja197` cho cả 4 khoá. Hai cặp còn lại với `ja197` (`6.2` = `ja197:2.2`; `6.3` = `ja197:2.3`) tôi **cố ý lệch**: bản `ja197` dịch `amittasmiṁ patiṭṭhitā` thành “của kẻ đã bị coi là kẻ thù” (thêm “bị coi”) và đặt “bậc hiền triệt” (chủ ngữ `paṇḍito`) vào dòng `Yehi amittaṁ jāneyya` trong khi Pāli để `paṇḍito` ở dòng sau; bản này giữ chủ ngữ ở `6.4` đúng thứ tự Pāli. Như vậy: 6 cặp trùng đã dò ra ngoài bài với `ja197` (2.1, 2.2, 2.3, 2.4, 6.2, 6.3), trong đó 4 dùng lại, 2 lệch có lý do. Với phần còn lại của bài đã dò tiền lệ toàn tầng: `Guyhañca tassa akkhāti` có một khoá Pāli gần giống ở `an7.36:3.1` nhưng khác dòng nên không phải cặp trùng; `Tassuddānaṁ` trùng ở nhiều bài (tầng dịch “Tóm lược:” là đa số). Tôi không chạm vào `ja197`; nếu người điều phối muốn đổi `ja197:2.2`–`2.3` thì nên đổi một lần cho cả hai bài.

  **Trùng nguyên văn trong chính bài:** 6 nhóm (`1.1`=`7.1`; `1.2`=`7.2`; `1.4`=`6.4`; `5.3`=`11.3`; `5.6`=`11.6`; `6.1`=`12.1`), cả 6 nhóm đều có bản Việt giống hệt nhau; 0 nhóm lệch.

  **Số Pāli:** `soḷasākārā` (6.1, 12.1) = 16 ⇒ “mười sáu dấu hiệu”. Kiểm đếm theo nội dung: kệ 2 có 4 dấu hiệu (không phấn khích khi thấy, không ưa thích, không trao đôi mắt, đi ngược), kệ 3 có 4 (gần kẻ thù, xa bạn, ngăn người muốn ca ngợi, tán dương kẻ mắng nhiếc), kệ 4 có 4 (không nói điều kín, không giữ kín điều kín của người, không ca ngợi việc làm, không tán dương trí tuệ), kệ 5 có 4 (vui khi suy vong, không vui khi hưng thịnh, được món ngon mà không nhớ, không thương tưởng); 4 × 4 = 16 khớp với Pāli. Kệ 8–11 đối xứng ngược, cũng 16. `dasamaṁ` (13.1) = 10 khớp với `10.` ở `0.4`; `Dvādasa` = 12 khớp với “Mười Hai” ở `0.2`, `14.1`.

  **Thuật ngữ và tiền lệ, đã đo:**
  - `amitta` → “kẻ thù”: `ja181:2.1`, `ja226:2.3`, `ja331:4.3`, `ja435:8.4` (4 tiền lệ trong `ja`), `mitta` → “bạn”.
  - `medhāvī` → “bậc thông tuệ” (tầng có 54 khoá chứa `medhāvī`; ví dụ `dn5:13.9` “thông minh”, `dn31:34.15` “có trí”; ở đây là danh xưng nên dùng “bậc …”); `viññū` → “bậc hiểu biết” (231 khoá chứa `viññū…`; ví dụ `dn25:22.8` “người có trí”, `dn34:1.6.7` “các bậc có tuệ”; dùng “bậc hiểu biết” để phân biệt với `paṇḍito` = “bậc trí” ở cùng khoá).
  - `ākāra` → “dấu hiệu” theo `ja197:2.1` (một tiền lệ); `an8.50:14.1` dịch `soḷasākāra` là “mười sáu phương diện” trong ngữ cảnh khác (đặc tính của bậc Thánh).
  - `bhajati` / `sevati` → “giao du” / “gần gũi”: `bhajati` 0 tiền lệ dạng động từ trong `ja`; `sevati` có 5 khoá (nghĩa gần “thân cận”). Hai động từ gần nghĩa, tôi dùng hai từ khác nhau để giữ hai vế của câu.
  - `vaṇṇakāma` → “người muốn ca ngợi”: tầng có `avaṇṇakāma` → “muốn chê bai / muốn nói xấu” (`mn36:3.5`, `an8.12:32.6`), nên `vaṇṇakāma` đối nghĩa là “muốn ca ngợi”. `akkosante` → “những kẻ mắng nhiếc” (0 tiền lệ). `pasaṁsati` → “tán dương”; `vaṇṇeti` → “ca ngợi” (0 tiền lệ thuận; `ja437:2.2` dịch `vaṇṇeti` là “nhuộm màu”, nghĩa khác ngữ cảnh).
  - `guyha` → “điều kín” (37 khoá chứa `guyha…` trong tầng; ví dụ `dn31:23.2` “điều bí mật”, `dn3:2.12.5` “nam căn”; chọn “điều kín”, sát nghĩa “điều được giữ kín” và không gây lẫn với nghĩa “nam căn”). `gūhati` → “giữ kín”.
  - `sati` (5.4, 11.4) → “nhớ nghĩ”, không dịch là “niệm” vì ở đây là ký ức về người, không phải thuật ngữ thiền.
  - `anukampati` → “thương tưởng” (175 khoá chứa `anukamp…`; ví dụ `dn10:1.3.1` “lòng thương tưởng”, `dn31:25.1` “lòng thương”). `paṭinandati` → “ưa thích” ở 2.2 theo `ja197:1.2`; ở 8.4 dùng “tỏ lòng ưa thích” cho cùng gốc.
  - `accheraṁ bhojanaṁ` → “thức ăn quý hiếm”: `accheraṁ` chỉ có 1 tiền lệ đúng dạng (`pv35:9.1` “điều không thể tin nổi”, nghĩa “kỳ lạ”); các khoá còn lại khớp chuỗi là `maccheraṁ` (keo kiệt), không liên quan; chọn “quý hiếm”.
  - `abhave` / `bhave` (5.1–5.2, 11.1–11.2) → “suy vong” / “hưng thịnh”: nghĩa theo ngữ cảnh đối lập (xem bất định 2).

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 3 dấu mở (1.1, 2.1, 7.1) · 3 dấu đóng (1.4, 6.4, 12.4); Việt đúng 3/3, lệch 0/63 khoá. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (bài không có `…pe…` hay `(…)`).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `kubbānaṁ` (1.1, 7.1): dạng sở hữu/gián tiếp số nhiều của hiện tại phân từ, chủ ngữ không rõ (người quan sát hay người bị quan sát). Tôi dịch “Những người làm các việc nào” để không áp chủ ngữ; kệ đáp (2–5, 8–11) liệt kê việc làm của người kia nên cách đọc “những người ấy làm việc nào” là hợp lý, nhưng Pāli không nói rõ.
  2. `abhave` / `bhave`: nghĩa đen “sự không có / sự có”; “suy vong / hưng thịnh” là cách đọc theo cặp đối lập và theo ngữ cảnh (việc người kia gặp điều xấu hay điều tốt). Không tìm được tiền lệ trong tầng (0 khoá).
  3. `kelāyito` (8.3): 0 tiền lệ; dịch “tỏ ra trìu mến”. Có thể là “thân mật, âu yếm”; nghĩa chắc chắn chỉ là biểu hiện ân cần.
  4. `tassa nuppajjate sati` (5.4) / `tassa uppajjate sati` (11.4): không phân định được `tassa` chỉ người nói hay người kia. Tôi đọc là “hắn [nhớ nghĩ] đến người ấy”, vì khớp với `Tato naṁ …` liền sau.
  5. `aho sopi labheyyito` (5.6, 11.6): `labheyyito` là `labheyya` + `ito` (“từ đây / từ phần này”), dịch “ôi, ước gì người ấy cũng nhận được từ đây”. Phạm vi của phủ định ở 5.5 `nānukampati` có kéo sang 5.6 hay không là Pāli để ngỏ: tôi giữ cách nối bằng dấu hai chấm ở cả hai (5.5 và 11.5) thay vì thêm “không nghĩ” vào bản Việt.
  6. `pavutthaṁ tassa sarati` (8.1): `tassa` đi kèm `pavutthaṁ` có thể là sở hữu dư; dịch “Người ấy đi xa, hắn nhớ đến”.
  7. `vācāya paṭinandati` (8.4): có thể là “đáp lại bằng lời” hoặc “chào đón bằng lời”; dịch “bằng lời nói mà tỏ lòng ưa thích” để giữ cả hai khả năng.

  **Coverage English (mục 7):** mẫu số = 0. Khoá dài nhất sau khi nén khoảng trắng là 31 ký tự (< 40) nên 0/59 khoá có nội dung (4 khoá `:0` bị loại trước). Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja473`; `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Tôi không đụng `content/meta/reference-gaps.yaml`.

