notes: |-
  Đợt 19, làn 76. Dịch từ Pāli root commit đã ghim, đủ 105/105 khoá (0.1–0.4, 1.1–25.4, 26.1), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; người nói của từng khổ vì vậy không được ghi vào thân kinh mà chỉ suy ra từ nội dung (xem bất định 1). Đối chiếu ngoài kho: có tham khảo một bản dịch Anh vần điệu bên thứ ba (không thuộc tầng đã ghim) để kiểm bố cục chung của kệ 16–25; không sao chép, và vì không thuộc tầng ghim nên không tính vào `triangulation`.

  **Tiêu đề.**
  - `0.2` “Bộ Hai Mươi Bài Kinh” và `0.3` “Phẩm Mātaṅga”: dùng lại nguyên văn `ja497:0.2`–`0.3` và `ja508:0.2`–`0.3` (2/2 bài đã dịch cùng bộ, cùng phẩm trên đĩa, 0 lệch).
  - `0.4` “8. Kinh Bhallātiya”, `26.1` “Kinh Bhallātiya, thứ tám.”: giữ phiên âm tên vua như `ja497:0.4` “Kinh Mātaṅga”; khuôn `26.1` theo `ja508:23.1` “Kinh Năm Bậc Hiền Trí, thứ mười hai.” Số `8.` ở `0.4` và `aṭṭhamaṁ` ở `26.1` đều là 8 ⇒ “thứ tám” khớp.

  **Tiền lệ dùng lại nguyên văn.** Đã dò toàn tầng `kn` đã dịch: Pāli trùng nguyên văn ở cấp khoá với bài khác chỉ có hai tiêu đề (`0.2`, `0.3`) ở trên; không có kệ nào của bài này trùng byte với kệ ở bài khác. Một cặp gần trùng đã đọc: `mil7.6.9:4.1`–`4.4` chứa cùng kệ `Mayekarattaṁ vippavasimha ludda…` (nhưng chép khác chữ: `Socāmasā ratti puna na hessatī`) mà bản Việt ở đó dịch rất lệch (“các bậc đi lang thang không biết mình đang đi đâu”, “khóc lớn”); không lấy làm tiền lệ, tự dịch lại từ Pāli. Xin người điều phối xem lại `mil7.6.9:4` (không thuộc lát này, không đụng).

  **Trùng nguyên văn trong chính bài:** 105 khoá, 10 nhóm Pāli trùng (sau khi nén khoảng trắng, hạ chữ hoa, bỏ dấu nháy và dấu câu): (3.3 = 5.3 = 6.3 = 7.3 = 9.3), (5.1 = 6.1 = 7.1), (5.2 = 6.2 = 7.2), (11.3 = 12.3 = 13.3), (11.4 = 12.4 = 13.4), (13.1 = 14.1), (17.3 = 18.4), (22.1 = 23.1 = 24.1), (23.3 = 24.3), (23.4 = 24.4). Bản Việt của cả 10 nhóm giống hệt nhau về chữ; khác biệt duy nhất là dấu nháy/chấm/phẩy theo Pāli từng khoá (`5.1` mở “, `7.4` đóng ”, `22.1` mở “, `24.4` đóng ”, `17.3` kết dấu phẩy còn `18.4` kết dấu chấm). Cặp gần trùng nhưng khác nội dung, đã đọc: `5.4`/`6.4`/`7.4` chỉ khác động từ cuối (`rodatha` “khóc” · `vilapatha` “kêu than” · `socatha` “sầu muộn”); `23.2`/`24.2` chỉ khác `kalahaṁ` “cãi vã” và `vivādaṁ` “tranh cãi”; `11.1`/`12.1`/`13.1`/`14.1` khác ở loài hoa hoặc cây.

  **Số Pāli:** `tīhūnakaṁ sattasatāni` (19.1) = sattasata 700 − tīhūnaka 3 = **697** (đã tính; bản Việt viết “Bảy trăm trừ ba”). Bản root không nêu đơn vị đếm ở khoá này; xem bất định 3. `vassasahassaṁ` (21.1) = vassa 1 × sahassa 1000 = **một ngàn năm** (cấu tạo thông dụng; cùng cách với `ja461:13.1` “mười ngàn năm” và `vv24:14.1`). `ekarattaṁ` (8.1, 8.3, 9.1, 23.4, 24.4) = **một đêm**. `8.` ở `0.4` và `aṭṭhamaṁ` ở `26.1` đều là 8. Số `eka` ở `19.3` (`vassekimaṁ`) xem bất định 3.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên công cụ đo):**
  - `kimpurisa` → giữ phiên âm “kimpurisa”: tầng chỉ có 2 khoá chứa dạng này (`ja481:8.4`, `ja481:13.1`), cả hai giữ phiên âm; đây gần như không có tiền lệ độc lập, nên chọn giữ nguyên như `ja481`.
  - `luddaka`/`ludda` (8.1, 4.4, 18.2, 19.1, 21.1; xưng hô) → “thợ săn”: đo trên 48 khoá chứa `ludd…`: “thợ săn” 16 · “tham lam” 11 (phần lớn là nghĩa tính từ “tham/ác”, và `ja399:7.1` xưng hô `luddaka` dịch “Ngươi tham lam”). Ở đây `ludda` là xưng hô của vị vua đang đi săn (1.2 `migavaṁ acāri`, 2.2 đặt cung xuống) nên chọn “thợ săn”.
  - `amānusa` (22.1, 23.1, 24.1) → “những vị không phải loài người”: cùng cách với `pv34:2.1` “không phải loài người” và `ja494:7.6` “không thuộc loài người”; không dùng “phi nhân” vì tầng không có tiền lệ dùng chữ này cho `amānusa` (0 khoá).
  - `socati` (7.4, 8.4) → “sầu muộn”: đo trên 76 khoá, “sầu” 60 · “buồn” 8. `rodati` → “khóc”: 16/22 khoá. `vilapati` (6.4) → “kêu than”: 3 · “than thở” 4 trong 10 khoá. `paridevati` (5.1) → “than vãn”: tầng dùng “khóc than” (`ja354`) và “than thở” (`pv11:9.1`); chọn “than vãn” để khác `vilapati` “kêu than” trong cùng khuôn kệ 5–7 (ba động từ gần nghĩa phải phân biệt được).
  - `anutappati` (8.3, 9.1) → “tiếc nuối”: tiền lệ tầng là “hối hận/hối tiếc” (9 khoá) cho nghĩa hối về điều đã làm. Ở đây không có việc làm sai nào, người nói tiếc cho đêm đã mất, nên chọn “tiếc nuối” (không phải “hối hận”).
  - `sammodatha` (23.2, 24.2) → “hãy sống hòa hợp”: `samagg…` và `sammod…` có 19/33 khoá dùng “hòa hợp”; `ja475:12.3` dịch `sammodatha mā vivadatha` “Hãy vui vẻ, chớ xung đột”. `kalaha` (23.2) → “cãi vã” và `vivāda` (24.2) → “tranh cãi”: theo `ud6.4:12.1` (`kalahajātā` “cãi vã”, `vivādāpannā` “tranh luận”) và `snp4.13` (`vivādayanti` “tranh cãi”).
  - `avītarāga` (21.4) → “chưa lìa tham”: `ja488:5.1`, `ja488:7.3`, `ja458:19.3`, `ja378:4.4` đều “chưa lìa tham/ly tham”.
  - `ittara` (22.2) → “ngắn ngủi”: tầng chỉ có 1 khoá dùng đúng chữ này; `pv11:11.2` dịch “ít thọ mạng”, `snp3.12:52.4` “tạm bợ”. Chọn “ngắn ngủi” vì nói về thọ mạng của vua so với thọ ngàn năm của kimpurisa.
  - `nivatti` (22.3) → “quay về”: 19/68 khoá chứa `nivatt…` dùng “quay về” (cao nhất, trước “quay lại” 9 · “trở về” 6).
  - `bhoga` (22.4) → “của cải”: 35/90 khoá chứa `bhog…` dùng “của cải” (“tài sản” 21 · “hưởng” 11).
  - `samaṇa` (25.4) → “sa-môn”: đa số áp đảo trong 344 khoá chứa `samaṇ…`.
  - `bhūmipāla` (19.3) → “bậc hộ trì đất”: theo `ja508:2.1` “tâu bậc hộ trì đất đai”, tiền lệ duy nhất (1 khoá).
  - `mālabhārī`/`mālinī` (11.3, 12.3, 13.3 / 11.4…) → “mang tràng hoa” / “đeo tràng hoa”: `vv83:1.2` `māladhārī` → “đeo tràng hoa”; ở đây `bhārī` (người mang) và `mālinī` (người có tràng hoa) được phân biệt “mang” và “đeo”.
  - Tên loài hoa và cây (`aṅkolaka`, `atimuttaka`, `sattaliyothika`, `kuravaka`, `uddālaka`, `pāṭali`, `sindhuvāraka`, `sāla`, `salaḷa`, `kaṇṇikāra`): giữ phiên âm. Tầng có 64 khoá chứa `pāṭali` (tên riêng, “hoa pāṭali” ở `tha-ap257:1.3`), `sāla` 8 khoá (5 giữ phiên âm), 5 khoá chứa `aṅkolaka`; 6 loài còn lại không có tiền lệ. `agaḷu`/`candana` (15.1) → “trầm hương”/“chiên-đàn”: `vv53:7.2` “trầm hương … chiên-đàn”, `vv83:1.2` “chiên-đàn”.
  - Không đụng `content/glossary/pali-vi.yaml`.

  **Dấu câu.** Nháy khớp Pāli từng khoá: 105/105 khoá khớp số lượng cả `“`, `”`, `‘`, `’`, `"`, `…` (0 lệch). Pāli có 10 chỗ mở nháy kép (3.1, 4.1, 5.1, 8.1, 9.1, 10.1, 20.1, 21.1, 22.1, 25.1) trong đó 5.1→7.4, 10.1→19.4, 22.1→24.4 chạy qua nhiều khoá, nên đúng là *khớp Pāli từng khoá*, không phải mỗi khoá tự cân. Nháy đơn: `8.4` (`‘sā ratti punaṁ na hessati’`), `11.3`→`11.4`, `12.3`→`12.4`, `13.3`→`13.4`, `15.3`→`15.4`. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (phép so “…pe…” chạy rỗng vì Pāli không có lược). NFC: 105/105 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa; chữ số chỉ có ở `0.4` (“8.”).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ nội dung chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1–2: người kể; 3, 5–7, 9, 20: vị vua Bhallātiya; 4, 8, 10–19, 21: kimpurisa (10–15 dùng `piyo me hehiti mālabhārī` nên người nói là nữ kimpurisī; 4, 8, 21 xưng “chúng tôi”); 22–24: người kể lại (22 nói về Bhallātiya ở ngôi ba, 23–24 là lời khuyên ở ngôi hai số nhiều `vo`/`akattha`), không xác định danh tính trong bản root; 25: người đáp lại ở 22–24, gọi người nghe là `samaṇa`. Thân kinh giữ đúng mức Pāli cho phép (`mā vo`…, không thêm tên người).
  2. `catukkaṁ` (18.2) `Catukkaṁ nadiṁ uttariyāna ludda`: không xác định được nghĩa của `catukkaṁ` đi với `nadiṁ`. Có thể là một thuật ngữ chỉ bến/lối vượt sông, hoặc một chữ khác; tầng có 92 khoá chứa `catukk…` nhưng toàn là `catukkanipāta` “Bộ Bốn Bài Kinh” và các dạng “bốn”, không cùng dùng với `nadiṁ`. Bản Việt chỉ giữ “vượt qua con sông ấy” và **để trống nghĩa của `catukkaṁ`**, không bịa. Mất một đơn vị nghĩa chưa phân xử được; cần người biên tập hoặc đối chiếu tầng khác.
  3. `19.1–19.4` `Tīhūnakaṁ sattasatāni ludda… Vassekimaṁ jīvitaṁ bhūmipāla`: (a) đơn vị của “bảy trăm trừ ba” không có trong root (nhiều khả năng là năm, vì `vassa` ở dòng 19.3 và `Vassasahassaṁ` ở 21.1, nhưng root không nêu), nên bản Việt không thêm “năm”; (b) `yamidha mayaṁ vippavasimha pubbe` dịch “kể từ lần chúng tôi xa cách nhau ở đây thuở trước” (đọc `yaṁ` là mốc thời gian); (c) `vassekimaṁ` đọc `vassa` + `ekaṁ` + `imaṁ` ⇒ “một năm của đời sống này”, đi với câu hỏi `ko nīdha kantāya vinā vaseyya` ⇒ “ai ở đây có thể sống thiếu người thương?”. Cách đọc khác: `vassekimaṁ` là một dạng chữ khác hẳn; không phân xử được từ tầng (0 khoá tiền lệ cho dạng này).
  4. `1.1–2.1`: `sāḷūrasaṅgha` dịch “bầy chó săn” theo nghĩa thông thường của `sāḷūra` là chó; tầng có 0 khoá chứa `sāḷūr…` nên không có tiền lệ nội bộ. `kalāpa` (2.2) dịch “ống tên” (còn có nghĩa “bó”).
  5. `3.1` `Himaccaye hemavatāya tīre`: `himaccaye` đọc “vào lúc hết mùa lạnh”; `hemavatāya` coi là tên một dòng nước (vì đi với `tīre` “bờ”), giữ phiên âm “Hemavatā”. Cách đọc khác: tính từ “có tuyết” chỉ bờ.
  6. `4.1` `Mallaṁ giriṁ paṇḍarakaṁ tikūṭaṁ`: đọc thành ba tên núi (Malla, Paṇḍaraka, Tikūṭa). Cách đọc khác: một ngọn núi Malla có tính từ “trắng” và “ba đỉnh”.
  7. `4.3` `Migā manussāva nibhāsavaṇṇā`: dịch “loài thú có dáng vẻ giống như người”; chủ ngữ (kimpurisa) hiểu từ 4.4, không thêm “chúng tôi” vào dòng này.
  8. `5.2` `Āliṅgito cāsi piyo piyāya`: đọc `cāsi` là `ca` + `āsi/asi`; có thể là ngôi hai (“ngươi”) hay ngôi ba; bản Việt dùng chủ ngữ trung tính “người thương”.
  9. `10.3–10.4` `Taṁ me piyo uttari vassakāle, mamañca maññaṁ anubandhatīti`: `maññaṁ` đọc là phân từ “nghĩ”; dịch “nghĩ đến tôi mà đi theo”. Cách đọc khác: `maññe` “tôi cho rằng” (“và tôi cho rằng người ấy đi theo tôi”); cùng hướng nghĩa.
  10. `15.2` `pamattarūpā` dịch “lòng mải mê”; `pamatta` còn có nghĩa “lơ đễnh/phóng dật”. `15.3` `rositaṅgo` dịch “thân thoa hương”, hiểu `rosita` là “được thoa”; không có tiền lệ (0 khoá).
  11. `11.2` `sattaliyothikañca`: giữ nguyên một tên “sattaliyothika” (có thể là hai loài `sattalī` + `yūthikā` “nhài”); không có tiền lệ.
  12. `17.4` `Kicchena no āgamā saṁvarī sā`: `āgamā` nghĩa gốc “đến”, dịch “qua” theo nghĩa đêm trôi qua; `saṁvarī` = đêm.
  13. `22.2–22.3` `Bhallātiyo ittara jīvitanti; nivattatha na migavaṁ acari`: `iti` đóng ý nghĩ ⇒ “nghĩ rằng đời sống thật ngắn ngủi”; `nivattatha` đọc là dạng ngôi ba quá khứ (“ông quay về”), không phải mệnh lệnh ngôi hai số nhiều, vì động từ kế tiếp là `acari`, `adāsi`, `abhuñji`.
  14. `25.3` `daraṁ` dịch “nỗi ưu phiền”; có thể là “nỗi lo sợ/nhiệt não”. `25.4` `jīva me ciraṁ` dịch “xin hãy sống lâu cho tôi”; `me` có thể là “vì tôi/với tôi”.

  **Coverage English (mục 7):** mẫu số = 0. Đo mọi khoá không phải khối `:0` (101 khoá), dài nhất sau khi nén khoảng trắng là 36 ký tự (< 40) nên 0/101 khoá có nội dung theo ngưỡng của `source/layers.yaml`; 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja504`; `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Tôi không đụng `content/meta/reference-gaps.yaml`.

