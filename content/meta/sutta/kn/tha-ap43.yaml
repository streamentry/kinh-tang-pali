  TIỀN LỆ, có số đếm (đo trên các bài `kn` đã dịch trong tầng Việt, trừ bài này). 47 khoá Pāli của bài có Pāli trùng nguyên văn với khoá khác của tầng; 39 khoá dùng đúng bản đa số, 8 khoá khác có chủ ý. Công thức dùng lại nguyên văn: `:0.1` Therāpadāna (473), `:0.2` Phẩm Upāli (6), `:3.1` Vắt tấm da thú lên một bên vai (3), `:3.2` chắp tay trên đầu (4), `:3.3` Sau khi đảnh lễ Đức Chánh Đẳng Giác (4), `:5.1` Bất cứ chúng sinh nào đang hiện hữu (cùng Pāli ở kp9:4.1; snp1.8:4.1 dịch có mặt), `:5.3`/`:5.4` Tất cả họ, trong trí tuệ của Ngài / đều ở bên trong, đã được bao gồm (2, tha-ap37), `:7.3` Khi trí tuệ của Ngài chiếu sáng (1, tha-ap37), `:10.2` Đức Phật trong thế gian cùng chư thiên (1), `:11.2` Đức Padumuttara, bậc Đại Mâu-ni (theo tha-ap16:4.4, cùng Pāli khác dấu câu), `:12.3` Bậc Đạo Sư đứng giữa hư không (6), `:12.4` đã nói những bài kệ này (21), `:13.3` Ta sẽ tuyên thuyết về người ấy (6 so với 3 dạng tán dương), `:13.4` hãy nghe lời ta nói (8 so với 3 dạng Ta viết hoa), `:14.4` sẽ cư ngụ trên cõi đất này (2), `:15.1` Và hai mươi lăm lần (1, tha-ap36), `:15.3` Vương quốc rộng lớn ấy (13), `:15.4` đếm không hết, vô tận (10), `:16.1` Sau một trăm nghìn kiếp (4 so với 4 dạng Vào một trăm ngàn kiếp nữa), `:16.2` sinh ra trong dòng họ Okkāka (15), `:16.3` tên là Gotama theo dòng ấy (11), `:16.4` sẽ làm bậc Thầy ở thế gian (15), `:17.1` Sau khi mệnh chung từ cõi trời Đâu-suất (3), `:17.2` được khích lệ bởi cội nguồn thiện căn (20), `:18.1` Vị ấy về sau, sau khi xuất gia (4), `:18.3`/`:20.3` Đã hiểu rõ toàn bộ lậu hoặc (15), `:18.4` sẽ nhập Niết-bàn, không còn lậu hoặc (2 so với 2 dạng có vị ấy), `:19.4` sẽ đặt vị ấy vào vị trí tối thắng (1, tha-ap37), `:20.2` đã làm xong việc cần làm, không còn lậu hoặc (1), `:22.1` Thu thúc trong giới bổn (4), `:22.2` Và trong năm căn (2, cùng cặp với `:22.1` ở tha-ap58), `:23.2` bậc Thầy tối thượng trong đời (4), `:23.4` đã đặt tôi vào vị trí tối thắng (1), `:24.1` Bốn vô ngại giải (488), `:24.2` và tám giải thoát này (49), `:24.3` Sáu thắng trí đã chứng đắc (61), `:24.4` đã làm tròn lời dạy của Đức Phật (452). Công thức câu kết `:25.1` theo nhóm Tôi nghe như vầy ... đã nói những bài kệ này (407 khoá), không dùng nhóm đã từng nói bài kệ này (21 khoá), vì imā gāthāyo là số nhiều.
  Trong chính bài có 2 nhóm Pāli trùng nhau (`:18.3`/`:20.3` và `:20.4`/`:21.4`); cả hai nhóm Việt giống nhau tuyệt đối, 0 cặp lệch.

  CÁC KHOÁ LỆCH TIỀN LỆ CÓ LÝ DO. (a) `:20.4`/`:21.4` viharāmi anāsavo dịch tôi sống không còn lậu hoặc (toàn tầng: ta sống không còn lậu hoặc 100, tôi sống đời thanh tịnh không còn lậu hoặc 23, tôi sống không còn lậu hoặc 15). Chọn ngôi tôi cho người kể vì đo ở phạm vi gần nhất (tha-ap30 đến tha-ap60) cho tôi 4 so với ta 1, và vì trong bài này `:13.3` Ta là lời Đức Phật (ahaṁ trong Tamahaṁ kittayissāmi), nên giữ tôi cho người kể thì không lẫn hai người nói; đây cũng là cách của tha-ap37 là bài có cùng kiểu lời tán thán. (b) `:11.3` Nabhaṁ abbhuggamī dhīro dịch bậc trí đã bay lên hư không (tha-ap336, cùng Đức Padumuttara) thay vì dạng đa số 2 khoá vị dũng cảm không hề chạm tới mặt đất, vì cụm không hề chạm tới mặt đất không có căn cứ trong Pāli; kéo theo `:11.4` haṁsarājāva ambare dịch như chúa thiên nga giữa bầu trời (2 khoá, gồm tha-ap336) thay vì như vị vua hạc giữa bầu trời (3 khoá), vì haṁsa là ngỗng trời hoặc thiên nga, không phải hạc, và để cả cặp theo một bài. (c) `:2.1` Ajinena nivatthohaṁ dịch Tôi khoác tấm da thú (tiền lệ duy nhất của đúng Pāli này: Tôi khoác tấm da nai) để cùng một vật với `:3.1` ekaṁsaṁ ajinaṁ katvā (3 khoá, tấm da thú). Trong tha-ap, ajina dịch tấm da thú 6 khoá, da nai 3 khoá, da linh dương 2 khoá. (d) `:1.1` Khīṇāsavasahassehi dịch Được hàng nghìn vị đã trừ sạch lậu hoặc đi với `:1.2` vây quanh (cùng cách dịch khoá đầu của tha-ap199:2.1); tiền lệ duy nhất của đúng Pāli có dấu mở nháy là Từ hàng nghìn vị, không hợp vì Pāli là cách công cụ (cùng với, được vây quanh bởi), không phải xuất xứ. (e) `:3.4` santhaviṁ dịch tôi đã ca ngợi (1 khoá đúng Pāli, cùng nghĩa ở tha-ap37:3.4); dạng đa số 3 khoá tiến đến bậc Dẫn Dắt Thế Gian không dịch santhavati. (f) `:23.3` Ngồi giữa Tăng đoàn tỳ-kheo (4 khoá, ngang với dạng Ngồi xuống giữa hội chúng các tỳ-kheo 4 khoá) để cùng thuật ngữ Tăng đoàn tỳ-kheo ở `:2.3`.

  TÊN BÀI `:0.3` VÀ KẾT BÀI. Pāli `:0.3` bắt đầu bằng số (1 Bhāgineyyupālittheraapadāna) nên giữ số theo hình thức N. ; translationTitle bằng đúng giá trị `:0.3`. Chính sách số thứ tự đo lại trên tầng: 145 tệp tha-ap có Pāli `:0.3` bắt đầu bằng số thì cả 145 giữ số, 0 tệp bỏ, 0 tệp thêm số ở chỗ Pāli không có. Tiền tố tên bài: đo ở phạm vi gần nhất (tha-ap36 đến tha-ap49, cùng hai phẩm Kuṇḍadhāna và Upāli) cho Bài Kệ Tuyên Ngôn 7, Ký Sự 3, Bài Kệ Tuyên Ngợ 2; đo ở tha-ap30 đến tha-ap60 cho Tuyên Ngợ 12, Tuyên Ngôn 11, Ký Sự 3; đo toàn tầng cho Tuyên Ngợ 240, Tuyên Ngôn 123, Ký Sự 104. Tuyên Ngợ là chữ không có nghĩa (lỗi chính tả); chọn Bài Kệ Tuyên Ngôn Về Trưởng Lão vì tha-ap37 và tha-ap45 trong cùng phạm vi đã dùng dạng này. Hai phạm vi cho đa số khác nhau nếu coi Tuyên Ngợ là một cách riêng, nên đề nghị biên tập viên phán một lượt cho cả cuốn. Tên Bhāgineyyupāli ở `:0.3` và `:26.1` giữ chữ Pāli ghép như tiền lệ Kāḷigodhāputtabhaddiya (tha-ap45); ở `:25.1` Pāli chỉ ghi upāli nên dịch Upāli. Kết bài `:26.1` dịch thứ nhất theo tiền lệ: paṭhamaṁ ở khoá kết bài của 48 bài tha-ap khác đều dịch thứ nhất (0 dạng khác).

  SỐ PĀLI, tự tính. `:14.1` Aṭṭhārasañca khattuṁ = aṭṭhārasa 18 + khattuṁ lần = mười tám lần. `:14.3` Pathabyā rajjaṁ tisataṁ = ti 3 × sata 100 = ba trăm (làm vua trên mặt đất ba trăm lần; cùng cấu tạo với Pathabyā rajjaṁ aṭṭhasataṁ = tám trăm ở tha-ap37:14.3). `:15.1` Pañcavīsatikkhattuñca = pañca 5 + vīsati 20 = hai mươi lăm lần. `:16.1` Kappasatasahassamhi = sata 100 × sahassa 1.000 = một trăm nghìn kiếp (theo tiền lệ satasahassa của tầng). `:1.1` khīṇāsavasahassehi = hàng nghìn vị (sahassa số nhiều, không ấn định số cụ thể). `:2.2` tidaṇḍa = ba cây gậy (ti 3). `:22.2` pañcasu = năm (năm căn), `:24.1` catasso = bốn, `:24.2` aṭṭhime = tám, `:24.3` chaḷabhiññā = sáu. Không có cụm Tiṁsakappasahassa trong bài; Pāli `:14.3` là tisataṁ (ti 3), không phải tiṁsa (30), nên bất định về tiṁsa của lát này không phát sinh ở đây và không ghi là bất định.

  NHÁY. Pāli mở ngoặc kép ở `:1.1` và đóng ở `:24.4`; mở nháy đơn ở `:5.1` và đóng ở `:10.4`; mở nháy đơn lần nữa ở `:14.1` và đóng ở `:19.4`. Bản Việt khớp Pāli từng khoá (0 lệch trên 101 khoá). Đã in cặp Pāli↔Việt đọc từng khoá; kiểm NFC, khoá rỗng, khoảng trắng thừa, chữ Pāli lọt sang Việt (chỉ có các tên riêng và Himavanta) đều sạch.

  BẤT ĐỊNH ĐÃ GHI (không đưa vào thân kinh). (a) `:2.2` tidaṇḍaparidhārako dịch mang theo ba cây gậy: tidaṇḍa là bó ba gậy của người tu khổ hạnh theo truyền thống chú giải, nhưng Pāli chỉ nói ba gậy; 0 tiền lệ cho đúng cụm (tha-ap339:5.3 Tidaṇḍake là ba cây cột, nghĩa khác). (b) `:1.4` gacchate paṭisallituṁ dịch đi để thiền tọa: paṭisallāna là ẩn cư thiền tịnh; 0 tiền lệ cho dạng nguyên mẫu này trong tha-ap. (c) `:4.1`–`:4.2` aṇḍajā, saṁsedā, opapātī, jalābujā dịch noãn sinh, thấp sinh, hóa sinh, thai sinh (bốn loài; 1 tiền lệ của bộ bốn từ này ở mil6.2.4); ja165:1.2 dịch jalābuja là sinh từ nước, không theo vì jalābu là màng thai. `:4.1` yathā đọc là như là (liệt kê), không phải so sánh. (d) `:6.1`–`:6.2` gandhā pabbateyyā himavantanaguttame: dịch những hương thơm thuộc về núi ở núi Himavanta, ngọn núi tối thượng; naguttama đọc là núi tối thượng (na = núi, uttama = tối thượng); 0 tiền lệ. `:6.4` kalāyapi na yujjare dịch không sánh được dù chỉ một phần nhỏ: kalāya đọc là một phần nhỏ (kalā); nếu kalāya là hạt đậu thì nghĩa vẫn là cực nhỏ nhưng chưa có bản đối chiếu nào để phân xử; 0 tiền lệ. (e) `:10.3` Tava kammābhiraddhena dịch Do Ngài hài lòng với việc làm của mình: abhiraddha có thể là hài lòng hoặc thành tựu; cách đọc nhờ việc làm khiến Ngài hài lòng không loại trừ hẳn; đối chiếu Sakakammābhiraddho (tha-ap22, tha-ap36 dịch hài lòng với việc làm của chính mình). Việc làm ở đây (kamma) không được giải thích thêm. `:10.4` tosesi janataṁ bahuṁ dịch đã làm cho nhiều người hoan hỷ (tosesi janataṁ ở tha-ap544:5.4 dịch làm dân chúng hoan hỷ). (f) `:7.1` mohandhakārapakkhando dịch đã rơi vào bóng tối của si mê; pakkhanda là lao vào hoặc rơi vào, 0 tiền lệ cho cụm này. (g) `:13.2` opammehi samāyutaṁ dịch kèm theo những ví dụ: samāyuta bổ nghĩa ñāṇaṁ (trí tuệ gắn với các ví dụ); câu Việt xếp sau trí tuệ này nên có thể đọc nhầm là được ca ngợi kèm ví dụ, Pāli cũng cùng độ mơ hồ ấy. (h) `:18.2` virājetvāna pāpakaṁ dịch sau khi lìa bỏ điều ác: virājeti là làm cho phai nhạt, tách khỏi; 0 tiền lệ trong tha-ap. (i) `:19.2` sakyaputto dịch con của dòng Sakya; 0 tiền lệ trong tha-ap. `:19.3` Vinayādhigataṁ tassa dịch Về sự chứng đạt Luật của vị ấy: có thể đọc adhigata là điều đã chứng đạt hoặc sự thông đạt; etadagge (`:19.4`, `:23.4`) giữ vị trí tối thắng, không nêu lĩnh vực vì Pāli không nêu (lĩnh vực suy ra từ vinayādhigataṁ nhưng không đưa vào thân kinh). (j) `:22.4` kevalaṁ ratanākaraṁ dịch trọn vẹn là mỏ châu báu: ratanākara là mỏ ngọc, kho báu, bổ nghĩa vinayaṁ ở `:22.3`; tha-ap139:4.2 dịch cùng Pāli là sáng rực suốt thời gian làm đầy báu, không theo vì không bám Pāli. (k) `:2.3` Bhikkhusaṅghaparibyūḷhaṁ (đối cách, bổ nghĩa lokanāyakaṁ ở `:2.4`) dịch Vị được Tăng đoàn tỳ-kheo vây quanh; chữ Vị thêm cho rõ đối tượng, không thêm ý. (l) `:9.4` viddhaṁsesi (quá khứ) đi với sadā dịch đã luôn phá tan, trong khi `:9.2` vinodeti (hiện tại) dịch luôn xua tan.

