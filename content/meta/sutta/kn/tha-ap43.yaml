  PHẠM VI. 101/101 khoá, khớp tập khoá Pāli và đúng thứ tự Pāli, không có khoá ngoài tập. Bài gồm tiêu đề (`:0.1`–`:0.3`), 24 khổ kệ (`:1`–`:24`), câu kết Itthaṁ sudaṁ (`:25.1`) và câu kết bài (`:26.1`). Pāli không có dấu lược `…` ở khoá nào nên bản Việt cũng không có.

