  Hình thức: trên 116 tệp Pāli `:0.3` có số: chữ số ở đầu 98 (82 có dấu chấm, 16 không) so với chữ ở cuối 2, bỏ 16 → chọn `N. `; số đếm còn tăng vì các lát f1–f3 được áp song song. Hạ `semantic_fidelity` 9.3 → 8.9; `final_score` tính lại bằng script.

  Rà soát lỗi lặp 2026-10-15 (đợt 2, đối chiếu Pāli đã ghim; không có bản Anh hay Việt độc lập cho
  tầng này): sửa tha-ap456:2.1 `kappa` đổi "đại kiếp" thành "kiếp", vì Pāli không có `mahā` (cùng cách
  đã sửa ở tha-ap340:20.1; tầng đa số dịch "kiếp"). Các khoá khác của bài không đổi.

