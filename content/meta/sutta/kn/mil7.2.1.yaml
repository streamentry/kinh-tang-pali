  Tầng tham khảo: KHÔNG có bản Anh Sujato tại commit đã ghim cho bài này — đếm bằng script, trong cache đã ghin không có tệp nào khớp uid này (0/15 khoá); cũng không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya. Bài này vì thế chỉ dịch từ Pāli, triangulation chấm 7.0 và status giữ draft; xem blocking_errors.

  Đủ 15/15 khoá. Đã đọc hết Pāli lát f120.pali.txt trước khi viết.

  Opammakathāpañha → “Câu hỏi về cách dùng dẫn với ví dụ” (tiền lệ `mil7.2.3`, `mil7.7.1`).
  Số thứ tự: `Gadrabhaṅgapañho paṭhamo` là thứ nhất.

  CỐ Ý LỆCH ĐA SỐ TRONG TẦNG, ĐÃ GHI ĐỦ Ở ĐÂY. Năm tệp `mil7.2.3/4/7/8/9` đang viết
  `Gadrabhavagga` là “Phẩm Con Lừa”, còn thân bài thì dịch `gadrabha` là “con sóc” (đúng nghĩa,
  và cũng là cách `mil7.2.3` dùng). Tôi đặt 0.3 làm “Phẩm Con Sóc” để CÙNG MỘT từ Pāli chỉ
  có một cách trong chính bài này; nếu để “Con Lừa” ở tiêu đề và “con sóc” ở thân thì bài tự
  mâu thuẫn, đúng cái bẫy mà AGENTS.md nêu. Người điều phối cần gộp: nếu giữ đa số
  “Phẩm Con Lừa” thì phải sửa cả 0.3 và thân của năm tệp kia.

  LỖI ĐÃ BẮT Ở LƯỢT REVIEW ĐỐI KHÁNG — LỖI LỚN NHẤT LÁT NÀY. Bản nháp dịch 1.5 bỏ hẳn
  `kaliṅgarūpadhānā`, tức vế “nằm trên chiếu cỏ”, làm mất chính chi tiết nối ví dụ con sóc
  với đời sống tỳ-kheo. Đã sửa thành “…là những người nằm trên chiếu cỏ, không phóng dật,
  nhiệt tâm trong sự cần cố”. Đây là bài nhắc rằng bản nháp dựng từ trí nhớ không đáng tin.

  `dhammasenāpati` tôi dịch “vị đệ nhất về đạo hạnh trong việc thọ trì giáo pháp”; “đạo hạnh
  đệ nhất” có 0 tiền lệ nên tôi đặt mới, còn “đệ nhất” (2 chỗ) và `devātidevena` → “Thiên
  Nhân” (17 chỗ) thì có sẵn.

  Bất định đã ghi nhận. `thusarāsi` tôi dịch “đống rơm”; `catukke` và `siṅghāṭake` lần lượt là
  “hố sâu” và “hang đá” (hai chỗ trũng trong đất). `gāmadvāre` tôi dịch “nơi cửa đồng” — nghĩa
  chữ là cổng đồng hay vùng đồng trống.

  Dấu lược: bài không có `…pe…`; hai phía đều 0.

  Kiểm kỹ thuật: save_vi chạy sạch; vì mọi khoá Pāli ở lát này ngắn hơn 40 ký tự (khoá dài nhất 39) nên tập `cần` trong _hvi.kiểm rỗng và các assertion NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy, tôi tự quét lại MỌI khoá bằng chính các hàm đó (pal, lược, lọt_pāli, ngoặc, _TỪ): đủ 15/15 khoá, đúng ID, thứ tự khoá y hệt Pāli, không rỗng, không thừa, mọi chuỗi NFC, không trùng nguyên văn Pāli (trừ 0.1 là tên bộ Kinh, đúng như tiền lệ), số dấu lược khớp Pāli từng khoá, nháy kép cân trên cả bài và khớp đúng số mở/đóng của từng khoá Pāli, không còn (…), toàn bộ chữ cái là script Latin. Đợt này cấm chạy cổng nên technical_integrity = 9.6, KHÔNG phải 10.0; bốn lệnh npm run validate | test | check | build để người điều phối chạy.
