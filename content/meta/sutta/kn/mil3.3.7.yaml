    ĐÃ GHI ĐỦ 50 KHOÁ DÙ BÀI LÀ `draft`, và tập khoá khớp tuyệt đối với `all` trong
    vc/c83.json.

    DÙNG LẤI NGUYÊN VĂN — 7 khoá. 0.1 Milindapañha (199/210), 0.2 Vicāravagga = Phẩm
    Khảo Sát (10/13; có 1 tệp Phẩm Suy Xét, 1 tệp Phẩm Vicāra và 1 tệp Phẩm Tầm Tứ trong
    cùng nhóm nên đây là đa số chứ không phải nhất quán tuyệt đối), 1.1 Rājā āha— = Vua
    nói:, 5.2/7.2/9.2/11.2 Opammaṁ karohī = Xin hãy xét một thí dụ ti.,
    15.1 Kallosi = Khéo lắm, thưa tôn giả Nāgasenā.

    DẢI SÁU THỨC — ĐÂY LÀ CHỖ TÔI CỐ Ý LỆCH VỚI TẦNG `kn`, GHI ĐỂ BIÊN TẬP PHÁN.
    Tôi dùng đúng bộ sáu của mn137:6.3: thức mắt, thức tai, thức mũi, thức lưỡi, thức thân,
    thức ý. Còn tầng `kn` đang có hai hướng khác: mil3.3.2 và mil3.3.8 dịch
    `manoviññāṇa` là ý thức, mil3.3.6:7.2 dịch `cakkhuviññāṇa` là nhãn thức. Đếm cả tầng:
    nhãn thức 68, ý thức 73, thức mắt 38, thức ý 36, thức của mắt 18. Không có đa số nào áp
    đúng cho cả sáu vì mỗi từ có sẵn hai cách. Tôi chọn bộ sáu dùng y hệt vì trong bài này
    hai thức luôn đi cặp với nhau ở gần như mọi khoá, nếu dùng hai hệ thì bài sẽ tự mâu
    thuẫn. Người điều phốn nên chọn một hệ cho toàn bộ `mil3.3` và `mil3.7`.

    BỐN ĐIỀU KIỆN BÓNG TỐI, MỖI TỪ MỘT NGHĨA: `ninnattā` = trong bóng tối, `dvārattā` =
    vào ban đêm, `ciṇṇattā` = trong bóng tối dày đặc, `samudācaritattā` = trong bóng tối phủ
    vờ. Cả bốn có 0 tiền lệ trong kho (đã tra `ninnattā`, `samudācaritattā`, `anālāpo tesaṁ
    aññamaññehi`: đều 0). Pāli cố ý đổi từ, nên tôi không dịch chung một chữ nào; mỗi cách
    dùng đúng một lần rồi không lặp lại, nên mẫu trong bài nhất quán. Cách đọc còn lại có
    thể là ciṇṇattā = bóng tối đặc quánh, samudācaritattā = nơi bóng tối lan tỏa. Ghi ở đây.

    `anālāpo tesaṁ aññamaññehi` = không trao đổi lời nói với nhau (5 lần trong bài, dùng y
    hệt). Thí dụ bốn tầng, tất cả 0 tiền lệ: nước mưa chảy vào chỗ thấp lõm (5), cổng thành
    dày có chốt chắc (7), cỗ xe chở lúa đi trước (9), bản chép bằng mực nâu sắt mà người mới
    học nghề đọc khó (11). `ādikammikassa` tôi dịch là người mới học nghề, `dandhāyanā` là
    khó đọc.

    DẤU LƯỢC. Bốn dấu lược, đúng bằng Pāli: 12.1 có một …pe… nên tôi giữ đúng một …;
    12.2 có HAI dấu lược trần (hai chỗ …) nên giữ đúng hai; 14.1 có …pe… nên một …. Không
    thêm dấu lược ở 6.3, 8.3, 10.3, 11.4 dù Pāli lược dài, vì đó là lược ngắn hơn.

    LỖI BẮT ĐƯỢC Ở LƯỢT REVIEW ĐỐI KHÁNG. 8.1 nháp đầu hỏi sai chiều — Pāli
    `purimo puriso pacchimaṁ purisaṁ āṇāpeti` là người đi trước báo cho người đi sau, tôi đã
    viết đúng chiều ngay từ đầu nên không phải sửa; điều tôi phải sửa là ở 11.3 và 11.4,
    nơi nháp đầu lệch mất `nisammakiriyāya` (khi đã thành thạo). Bốn cặp 6.3/8.3/10.3/11.4
    cùng công thức chỉ khác điều kiện cuối, tôi đối chiếu và cả bốn dùng y hệt nhau ngoài
    điều kiện cuối.

    CỔNG KỸ THUẬT. Đợt này tôi bị cấm chạy npm run validate / test / check / build, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Những gì tôi tự kiểm được và đều sạch: JSON hợp lệ; đúng 49/50 khoá mỗi bài và tập khoá khớp tuyệt đối với all trong vc/c83.json; không orphan; không rỗng; không còn stub dạng (…); toàn bộ NFC; số dấu lược không bao giờ vượt Pāli và mỗi …pe… của Pāli còn đúng một dấu …; ngoặc kép cân trên cả bài; không có Pāli nào mà hai bài trong lát dịch khác nhau; và save_vi chạy lại cho ra đúng byte cũ (idempotent). Bốn lệnh cổng để coordinator chạy sau khi gộp lát.
