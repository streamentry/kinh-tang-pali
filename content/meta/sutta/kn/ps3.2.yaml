notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim (kn/ps/ps3.2_root-pli-ms.json), đủ 251/251 khoá; thứ tự khoá = thứ tự Pāli, không khoá thừa.

  Tầng tham khảo: english-sujato không có ps3.2 (manifest của commit đã ghim: sutta/kn chỉ có cp dhp iti ja kp snp thag thig ud, 0 tệp Sujato cho ps; đây là not-published-upstream, không phải not-synced); english-project của dự án chưa có tệp ps nào; vietnamese-current (phantuananh) chỉ có Pháp Cú. Coverage English theo công thức của source/layers.yaml: mẫu số 132 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0) trên tổng 251 khoá, tử số 0 ⇒ 0/132 = 0%, dưới ngưỡng 0,8; 119 khoá còn lại (ngắn hơn 40 ký tự: tiêu đề, câu hỏi đáp ngắn, câu kết) cổng không đo được gì. Bản Việt nguyên bài ở mục tra cứu toàn văn cuối trang không được đọc để làm căn cứ cho bản này. Bài chỉ có Pāli root và tiền lệ nội bộ của chính tầng Việt dự án (các bài ps đã dịch, các công thức thần thông ở dn2, dn10, dn11, dn28, dn33, mn108, sn6.14, sn51, an3.80), không có đối chiếu English độc lập, nên triangulation bị chặn ở 7,0 (≤ 8,0) và bài giữ draft.

  Cấu trúc bài: 1.1–1.9 mở đầu bằng câu hỏi đáp (một câu hỏi tổng 1.1–1.3, rồi lặp lại từng câu 1.4, 1.6, 1.8 để trả lời); 2.x liệt kê mười loại thần thông; 3–6 giải thích bốn nền, bốn túc, tám bước, mười sáu gốc; 7–28 giải thích từng loại. Từ 7.x trở đi, dạng định nghĩa mệnh đề (Pāli bôi đậm lemma rồi ti) dịch thành lemma + nghĩa là, không dùng dấu nháy vì Pāli không có nháy ở các khoá đó (thẻ b bị bỏ, đúng tiền lệ ps3.3, ps3.5, ps3.8, ps3.10). Khoá 8.3, 8.8, 8.13, 9.6, 10.4, 11.4, 12.4, 13.3, 14.2, 14.5, 14.8, 14.11 là lời quyết định của vị có thần thông; 16.5, 16.10, 16.15 mở nháy và 16.7, 16.12, 16.17 đóng nháy qua ranh giới khoá đúng như Pāli (16.6, 16.11, 16.16 không có nháy); 19.3, 19.5, 19.7, 19.9, 19.11 mỗi khoá một cặp nháy. Pāli có 23 khoá có nháy kép, bản Việt khớp từng khoá (0 lệch); không có nháy đơn nào trong Pāli.

  Thuật ngữ và tiền lệ (đo trên tầng Việt đã có): iddhi → thần thông (glossary, ps3.6, ps1.0); ijjhati, ijjhanaṭṭhena → thành tựu, do ý nghĩa thành tựu (ps3.6, ps1.9, ps3.3); iddhipāda → như ý túc (122 trên 144 khoá, thần túc 9, còn lại cách khác); bhūmi → nền (ne10:15.6), pāda → túc, pada → bước, mūla → gốc: bộ bốn từ này không có tiền lệ đúng nghĩa trong tầng nên chọn theo nghĩa đen; adhiṭṭhāna → quyết định (ps1.0:50.1); vikubbanā → biến hóa (dn18, bv26, thi-ap32); manomaya → do ý tạo (glossary, dn2 85.2); vipphāra → lan tỏa (5 trên 5 khoá ps; cả tầng lan tỏa 14, tỏa rộng 18 nhưng ở nghĩa khác như mahāvipphāro an8.43); paccanubhoti trong công thức iddhividha → trải nghiệm: hai cách đọc đang hòa (trải nghiệm 13, chứng nghiệm 13, thành tựu 5, thọ dụng 5 gồm ps3.6:2.2, thị hiện 4, thực hiện 3, chứng được 2), chọn trải nghiệm vì cả công thức dn2 87.2 lặp 13 lần giống hệt; āvajjati → hướng tâm (mil5.1.2 ×5 cho āvajjana); pakatiyā → vốn; aniddhimanto → người vốn không có thần thông; iddhimā cetovasippatto → vị có thần thông làm chủ được tâm (làm chủ 8, chế ngự 7, khác 1 trên 16 khoá; dn16:3.14.1, mn56:13.13, an6.41); cetopariyañāṇa → trí biết tâm người khác (7 trên 11, so với tha tâm trí 2; ps1.0:52.1); dibbā sotadhātu → thiên nhĩ giới (25 trên 47, thiên nhĩ 22); dibbacakkhu → thiên nhãn (115 trên 115); paṭikūla, appaṭikūlasaññī → đáng ghét, tưởng không đáng ghét (24 trên 36 khoá công thức này, ghê tởm 12 ở mn152 và sn54.8); aniṭṭha, iṭṭha → không vừa ý, vừa ý (không vừa ý 20, không đáng mong 8; vừa ý 38, đáng mong muốn 24, nhưng đáng ưa 84 ở khuôn iṭṭha kanta manāpa là khuôn khác, không dùng vì cần cặp đối xứng với aniṭṭha); dhātuto upasaṁharati → quy về các giới, aniccato upasaṁharati → quy về vô thường (0 tiền lệ); kosajja → biếng nhác, uddhacca → trạo cử, pamāda → phóng dật (glossary, ps3.3); kāmarāga → dục tham (48 trên 100, tham dục 23, dục ái 9, ái dục 6); chandarāga → ham muốn và tham (59 trên 242, ham muốn 51, tham ái 37, dục tham 35, tham dục 19); kilesa → phiền não; mariyādā → giới hạn (35, ranh giới 6); nānatta → sai biệt (134, ps1.0 ×5); ekatta → đồng nhất (ps1.0:40.1 ×1, 39 trong tầng; tính một ở mn121); assaddhiya → vô tín (8, không có đức tin 3, bất tín 2); pariggahita → thâu nhiếp (ps3.3); iñjati → dao động (cnd16:3.9) và āneñja → bất động; visaññutta → không bị trói buộc (10 trên 23, tách rời 8, không còn ràng buộc 3), appaṭibaddha → không bị ràng buộc (tầng cho không bị trói buộc 4, trói buộc 4, không ràng buộc 1 trên 25; đổi sang ràng buộc để tách khỏi visaññutta); vimariyādikata → không còn giới hạn (thag2.32:2.5 dịch không còn hàng rào, 1 tiền lệ); nibbidānupassanā, virāgānupassanā, nirodhānupassanā, paṭinissaggānupassanā → quán nhàm chán (0 tiền lệ), quán ly tham (21 khoá virāgānupassī), quán đoạn diệt, quán xả bỏ (mn37); nandi → hoan hỷ (135); ādāna → sự nắm giữ (16 so với chấp thủ 15); samudaya → sự sinh khởi (59 so với tập khởi 28; ps tầng 3 so với 1); samāpatti → sự chứng đạt (ps1.0, ps1.1, 5 khoá; cả tầng định 61, thiền chứng 10, chứng nhập 3); kasiṇa → biến xứ (dn33:3.3.36–43); paṭighasaññā → tưởng đối ngại (28 trên 64 khoá, 36 khoá còn lại diễn đạt khác); vimaṁsā → quán sát (35, quán xét 13, khảo sát 7); chanda → dục, vīriya → tinh tấn, citta → tâm (sn51.13, dn33); rūpiṁ manomayaṁ sabbaṅgapaccaṅgiṁ ahīnindriyaṁ → có sắc, do ý tạo, đủ các chi lớn nhỏ, không thiếu căn nào (dn2 85.2, dn10 2.23.2, 3 trên 3); vijjādhara → các vị giữ minh chú (mil5.2.4; tha-ap18 trì minh chú; tha-ap366 tiên minh chú, 1 tiền lệ mỗi cách); vijjā ở nghĩa chú thuật → minh chú; kammavipākaja → do quả nghiệp (sn36.21, an5.104); āyasmā → Tôn giả (3.275 trên 3.433); gahapati → gia chủ (1.451 trên 1.617); upāsikā → nữ cư sĩ (180 trên 220); cakkavatti → Chuyển luân (592 trên 623); caturaṅginī senā → bốn binh chủng (21 trên 42); supaṇṇa → kim sí điểu (54 trên 65, kim-sí-điểu 1); yakkha → dạ-xoa (250 trên 290, dạ xoa 13); dīpi → báo (29 trên 32); byaggha → hổ (46 trên 109); vinipātika → đọa xứ (9 trên 16); vehāsa → hư không (54 trên 79); sahassilokadhātu → ngàn thế giới (sn6.14:5.3, mn120).

  Công thức iddhividha 7.2–7.10: bám dn2 87.2 (trải nghiệm nhiều loại thần thông; hiện hình, ẩn hình; đi xuyên qua tường, thành, núi; lặn xuống đất rồi trồi lên như trong nước, chọn theo đa số lặn xuống 15, độn thổ 9; đi trên nước không chìm 11 trên 12; ngồi kiết-già bay 12; tự tại bằng thân cho đến cõi Phạm thiên 12, so với dùng thân 13 cho yāva brahmalokāpi). 7.3 dùng lại nguyên văn ps3.6:2.3 (từ một hiện ra nhiều, từ nhiều hiện ra một), là khoá Pāli trùng nguyên văn duy nhất trong tầng cho 7.3.

  Pāli trùng nguyên văn: trong chính bài 8 nhóm (25 khoá): Āvajjitvā ñāṇena adhiṭṭhāti ở 8.7, 8.12, 9.5, 10.3, 11.3, 12.3, 13.2; “pathavī hotū”ti ở 11.4, 12.4; Pathavī hoti ở 11.5, 12.5; Tassa evamassa ở 16.4, 16.9, 16.14; ñāṇavipphārā iddhi ở 17.3, 17.10; samādhivipphārā iddhi ở 18.3, 18.5, 18.12; Sace ākaṅkhati ở 19.4, 19.6, 19.8, 19.10; tattha tattha sammāpayogapaccayā ijjhanaṭṭhena iddhi ở 28.3, 28.7: 0 nhóm mà bản Việt khác (8.12 chỉ khác chữ hoa đầu câu theo Pāli). Đã dò cả tầng: 12 khoá Pāli của bài này trùng nguyên văn với 185 khoá ở nơi khác (0.1, 0.2, 7.3, 8.2, 16.4, 16.9, 16.14, 24.3, 24.4, 24.5, 24.6, 24.7). Dùng lại nguyên văn tầng cho 0.1, 0.2, 7.3, 24.4, 24.5, 24.6, 24.7 (7 khoá, khớp dạng đa số); 24.3 giữ Nghe tiếng bằng tai … (6 trên 27; dạng đa số là Khi tai nghe âm thanh … 10 nhưng thuộc các bài mn27, mn51, mn107 có cú pháp khác; dạng dn10, dn2, mn137 đồng khuôn với 24.4–24.6); 8.2, 16.4, 16.9, 16.14 khác tầng đúng một điểm là khoảng trắng trước dấu gạch dài (tầng nói chung không có khoảng trắng, 2.669 trên 888 khoá Pāli kết bằng gạch dài; nhưng trong ps là có khoảng trắng 148 trên 54, nên theo ps cho nhất quán trong cùng bộ).

  Số Pāli: không có số lớn; sataṁ 100, sahassaṁ 1.000, satasahassaṁ 100.000 ở 8.6 (một trăm, một ngàn, một trăm ngàn); catasso bhūmiyo 4 (3.2 liệt kê đủ 4), cattāro pādā 4 (4.2 liệt kê đủ 4), aṭṭha padāni 8 (5.2–5.13: 4 cặp, mỗi cặp 2 vế), soḷasa mūlāni 16 (6.2–6.17 đúng 16 câu), dasa iddhiyo 10 (2.2 liệt kê đủ 10); 15.7 có 13 vaṇṇa + 5 mục sau (voi, ngựa, xe, bộ binh, dàn trận); sahassilokadhātu 15.2 là một ngàn thế giới; pañcannaṁ mahāpuññānaṁ 26.3 là năm vị có phước lớn (Pāli chỉ nêu bốn tên rồi năm là cả nhóm; không bịa thêm tên).

  Bất định, không thêm vào thân kinh: (1) 6.2–6.5 anonata, anunnata, anabhinata, anapanata: dịch chùng xuống, dâng cao, nghiêng về, nghiêng khỏi; 0 tiền lệ trong tầng, nghĩa đen của các tiền tố ava, ud, abhi, apa. (2) 6.9 visaññutta và 6.7 appaṭibaddha gần nghĩa nhau; tiền lệ tầng cho visaññutta ở sn36.6, sn36.7 là không bị trói buộc, nên cố ý không dùng cùng từ cho appaṭibaddha mà dịch không bị ràng buộc. (3) 6.11 ekattagata nānattakilesa: ekatta ở đây có thể là nhất tâm hay sự đồng nhất; chọn đồng nhất theo ps1.0:40.1 vì cặp nānatta–ekatta. (4) 11.6–11.7 abhijjamāne udake gacchati và abhijjamānāya pathaviyā gacchanti: abhijjamāna nghĩa đen là không bị vỡ ra; ở 7.7 và 11.1, 11.6, 11.7 dịch đi trên nước không chìm theo công thức đa số, còn cho đất ở 11.7 dịch đi trên đất không bị vỡ. (5) 14.20 rūpiṁ manomayaṁ…: Pāli không nêu danh từ, nhưng bốn tính từ cùng giống đực số ít với kāyaṁ ở 16.2; dịch một thân có sắc; nimmito ở 14.21–14.31 là vị hóa hiện. (6) 20.2, 21.2, 22.2, 23.2 dhātuto vā upasaṁharati, aniccato vā upasaṁharati: dịch quy về các giới, quy về vô thường (upasaṁharati = đưa về, quy về); asubhāya vā pharati dịch biến mãn bằng bất tịnh; 0 tiền lệ cho nhóm câu này. (7) 8.4 akuppadhammo dịch bản tính không lay chuyển (akuppa là không lay chuyển, dhammo ở đây là bản tính của bahubbīhi); tầng dịch akuppā cetovimutti là không thể lay chuyển, bất động. (8) 15.3–15.6 dissamāna, adissamāna: dịch hiện hình, không hiện hình; sn6.14:4.5 dịch thân hiện hữu hình, không hiện hữu hình; chọn hiện hình vì khớp āvibhāva ở 7.4. (9) 26.2 assabandhagopurise: dịch người giữ ngựa và người chăn bò; 0 tiền lệ trong tầng, assabandha nghĩa đen là người buộc ngựa. (10) 26.3 Pāli chỉ nêu bốn tên rồi pañcannaṁ mahāpuññānaṁ; không bổ sung tên người thứ năm. (11) 8.1 imasmiṁ ādāye dịch trong sự thọ trì này; khanti → sự chấp nhận, ruci → sự ưa thích theo tiền lệ mn102:15.2, sn12.68:1.3; diṭṭhi → quan điểm theo cùng chỗ ấy (khác thường lệ kiến vì ở đây đứng cùng khanti, ruci). (12) 1.3 pādā và padāni: dịch túc và bước; nghĩa đen túc là chân, bước là câu hay bước đi; 4.2 cho thấy pādā là bốn như ý túc, còn padāni ở 5.2–5.13 là tám mệnh đề dục, tinh tấn, tâm, quán sát (mỗi cái hai vế). (13) 2.2, 28.1, 28.3: tattha tattha sammāpayogapaccayā ijjhanaṭṭhena iddhi dịch thần thông do ý nghĩa thành tựu nhờ duyên là sự thực hành đúng đắn ở từng trường hợp; payoga dịch sự thực hành (0 tiền lệ cho sammāpayoga). (14) 13.1 imepi candimasūriye evaṁmahiddhike evaṁmahānubhāve: dịch có đại thần lực, đại oai lực như thế này, imepi là cả mặt trăng mặt trời này (dn2 87.2 bỏ như thế này; ở đây giữ vì Pāli có evaṁ và imepi).

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (251 = 251), thứ tự giống Pāli; nháy kép: 23 khoá Pāli có nháy, 0 lệch, không có nháy đơn trong Pāli; dấu lược … khớp Pāli từng khoá (15 khoá có dấu lược, 0 lệch, không (…) trần); NFC, khoá rỗng, khoảng trắng thừa, Pāli lọt sang Việt: 0 lỗi trên 251 khoá; đã đọc cặp Pāli với Việt của cả 251 khoá.

  Chưa chạy cổng kỹ thuật nên technical_integrity đặt 9,6: còn phải chạy npm run validate, npm test, npm run check, npm run build.
