notes: |-
  Đợt 19, làn 104. Dịch từ Pāli root commit đã ghim, đủ 186/186 khoá (0.1–0.4, 1.1–44.4, 45.1), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng khổ không được ghi vào thân kinh; người nói chỉ được đọc từ nội dung và cách xưng hô trong kệ (xem BẤT ĐỊNH 1). Việc đối chiếu chỉ dựa vào Pāli root, các Pāli song hành trong tầng Việt đã dịch và tiền lệ nội bộ; không dùng bản dịch bên thứ ba nào để sao chép hay để làm cơ sở cho `triangulation`.

  **Tiêu đề và colophon.**
  - `0.2` “Bộ Hai Mươi Bài Kinh” và `0.3` “Phẩm Mātaṅga”: giữ như các bài cùng bộ đã dịch (`ja497`–`ja505`, `ja507`–`ja509`).
  - `0.4` “10. Kinh Campeyya”, `45.1` “Kinh Campeyya, thứ mười.”: giữ phiên âm tên (`Campeyya` là danh xưng của vị rồng), theo `ja504` “8. Kinh Bhallātiya” và `ja505` “9. Kinh Somanassa, thứ chín.”; số `10.` ở `0.4` khớp `dasamaṁ` (10) ở `45.1`.

  **Tiền lệ dùng lại nguyên văn.** Đã dò 182 khoá Pāli có nội dung (sau khi bỏ dấu câu, bỏ 4 khoá `:0`) với toàn tầng đã dịch (6.781 bài ngoài bài này): 24 khoá có dòng Pāli trùng nguyên văn với bài khác đã có bản Việt, trong đó 16 khoá bản này dùng lại nguyên văn và 8 khoá khác nhau có lý do:
  - dùng lại nguyên văn: `8.1`–`8.2` (`ja517:26.1`–`26.2`; `8.1` với dấu phẩy cuối như `ja517`, bản `ja489`/`ja511` không có phẩy), `11.1`–`11.4` và `12.1`–`12.2` (`ja501:27.1`–`28.2`, cùng kệ thưởng cho người thợ săn), `14.2` (`ja507:7.2`), `20.4` (`ja482:10.4`), `34.2` (`vv6:7.4`, `vv7:7.4`, `vv8:8.4`), `40.1`–`40.2` và `41.1`–`41.2` (`ja505:29.1`–`29.2`), `40.4` (`ja484:16.4`, cùng với `ja378:2.4` và `ja391:5.4` dùng “trẫm” thay vì “ta”).
  - khác có lý do: `1.2` (`pv13:10.4`, `pv14:11.4`, `pv15:29.4` thêm “rực rỡ” vì có động từ riêng ở dòng trước; ở đây `1.1` đã có “tỏa sáng” nên không lặp, vẫn dùng “sao mai”); `3.2` (`ja402:1.2` “nước mắt tuôn thành đổi” khó hiểu, không dùng); `33.1`–`33.2` (`vv11:1.1`–`1.2` dịch “công trời và hạc”, “chim cút tự bay đến bên” khác hẳn cấu trúc Pāli, lệch với `ja511:26.3` “sếu, công cõi trời”; chọn theo `ja511` và `ja511:26.6` “chim tu hú”); `34.1` (`vv6`/`vv7`/`vv8` “nơi có xoài, có sāl, có tilaka và có cây jambu” mang cú pháp “nơi có” của đoạn kệ trước; bỏ phần đó, và viết “sāla” theo 12 khoá của tầng so với 3 khoá viết “sāl”); `38.1` (`vv60:3.1`, `vv65:2.1`, `vv66:2.1` ba dạng; chọn “chứng đắc thiên thần lực, có đại oai lực” ghép `vv65` và `vv60`); `38.2` (`pv30:11.2` “họp cùng mọi kiều dục” hẹp nghĩa hơn `kāma`; dùng “đầy đủ mọi dục lạc”); `41.4` (`ja391:6.4` “hãy làm những việc phước thiện không phải là ít”; ở đây viết “các việc” để khớp `40.4` trong cùng bài).

  **Trùng nguyên văn trong chính bài (có kết quả):** 15 nhóm Pāli trùng (sau khi bỏ dấu câu và hạ chữ hoa), tổng 55 cặp, và cả 55 cặp đều đã dịch giống hệt nhau (0 cặp lệch): (4.3, 7.3) · (4.4, 7.4) · (9.2, 10.2) · (9.3, 10.3, 12.3, 13.3) · (9.4, 10.4, 12.4, 13.4) · (15.1–15.4 với 18.1–18.4, bốn nhóm) · (16.4, 17.4) · (26.2, 27.4, 28.2) · (30.5, 31.4, 32.3, 33.3, 34.3, 35.3) · (30.6, 31.5, 32.4, 33.4, 34.4, 35.4) · (40.1, 41.1) · (40.2, 41.2). Chỉ dấu nháy và dấu cuối câu khác nhau, đúng như Pāli (ví dụ `9.4` kết ”. còn `10.4` kết dấu chấm vì lời trích của `10` còn tiếp sang `12.4`).

  **Số Pāli (tự tính, không chép từ bản dựa):**
  - `Soḷasitthisahassāni` (8.1) = soḷasa 16 + itthi + sahassa 1000 ⇒ **mười sáu ngàn** phụ nữ (khớp `ja517:26.1`, `ja489:7.1`, `tha-ap401:7.3`).
