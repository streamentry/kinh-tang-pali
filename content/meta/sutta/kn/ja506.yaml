  - `vāhasahassāni pañca` (43.1) = pañca 5 × sahassa 1000 ⇒ **năm ngàn** xe (5.000 vāha); `0.4` “10.” và `dasamaṁ` (45.1) = 10; `Vīsatinipāta` (0.2) vīsati = 20.
  - Không có cụm số nào chưa phân xử được (không gặp `Tiṁsakappasahassa`).

  **Thuật ngữ và tiền lệ đã đo:**
  - `nāga` → “rồng” khi chỉ vị này và loài của vị ấy (4.2, 5.4, 6.1–6.3, 14.1, 15.4, 18.4, 21.3, 22.1, 22.3, 23.4, 28.4, 30.6, 31.5, 32.4, 33.4, 34.4, 35.4, 40.3; `nāgakaññā` → “thiếu nữ loài rồng”): trong 48 khoá `kn` đã dịch chứa `nāga-`, “voi” chiếm 35 (đúng cho các khoá nói về voi), “rồng” 5, “rắn” 3, “Long vương” 1. `nāga` ở 23.3 (`Nāge ca yojentu suvaṇṇakappane`) đứng cạnh “cỗ xe” và “la” trong đoàn xa giá của vua nên dịch “voi”, còn `nāgassa nivesanāni` ở 23.4 là trú xứ của vị rồng; hai nghĩa của cùng một chữ trong một khổ kệ là điều ghi trong BẤT ĐỊNH 3. `uraga` (4.1, 9.3, 10.3, 12.3, 13.2, 13.3) → “rắn”: `uraga` là chữ chỉ rắn (“loài bò bằng ngực”), và ở 4.1–4.2 Pāli đặt cả `uraga` lẫn `nāga` cho cùng một vật.
  - `nāgarāja` (7.2, 38.3) → “Long vương”: đo toàn tầng đã dịch, 18 khoá chứa “Long vương” (gồm `ja441:7.1`, `ja441:8.1`) so với 8 khoá chứa “vua rồng”; chọn dạng đa số.
  - `supaṇṇa` (21.3) → “kim sí điểu”: 8/11 khoá chứa `supaṇṇ-` đã dịch dùng “kim sí điểu” (1 khoá “chim ưng”); `gandhabbī`/`gandhabbarāja` (1.3, 2.1, 37.4) → “nữ Càn-thát-bà”/“vua Càn-thát-bà”: 6/7 khoá chứa `gandhabb-` dùng “Càn-thát-bà”.
  - `devī`/`devatā` (1.3, 2.1) → “thiên nữ”: theo `ja517:26.4`; `mānusī` (1.4, 2.2) → “người nữ loài người”: theo `ja489:22.4`.
  - `janinda` (3.4, 4.2, 13.1, 22.1, 36.2, 39.1) → “chúa tể loài người”: 13/29 khoá chứa `janinda` (so “chúa loài người” 4, “nhân chủ” 2, “vua” 2).
  - `vanibbaka` (5.2) → “kẻ ăn xin”: toàn tầng có 18 khoá chứa `vanibbak-`, 12 khoá dịch “kẻ ăn xin” (`ja403:1.2`, `ja489:12.2`, `ja499` ×4, `iti75` ×4, `pv39:12.2`, `vv52:14.2`), còn lại “người cầu xin”/“kẻ lang thang”; nhưng người này ở 11.1 lại được gọi `ludda` (“thợ săn”, theo `ja501`), nên hai tên gọi cho một người đều theo từng chữ Pāli; không thêm giải thích.
  - `saraṇaṁ gatā` (8.4) → “đã đến nương tựa”: 7/7 khoá chứa dạng này dùng “nương tựa”. `asāhasena` (9.1, 10.1) → “không cưỡng ép”: theo `ja434:9.2` (1 khoá).
  - `nikkha` (9.2, 10.2, 11.1) và `catussada` (11.3), `umā` (11.4): giữ phiên âm, theo `ja501:27.1`–`27.4`; `mudiṅga` (24.1) theo `ja470:15.1`, `ja498:7.1`; `bherī` theo `ja498:7.1`; `paṇava` (24.1) 0 tiền lệ, giữ phiên âm.
  - `kambukāyūradharā` (31.1) → “đeo vòng xuyến vàng”: theo `pv24:6.3`, `pv34:2.5` (cùng công thức Pāli); `kambu` còn có nghĩa “ốc”, xem BẤT ĐỊNH 6.
