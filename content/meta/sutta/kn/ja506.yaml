  - `tapo karoti`/`karomi`/`karosi` (6.4, 30.6, 31.5, 32.4, 33.4, 34.4, 35.4, 36.4) → “tu khổ hạnh”: theo `ja433:9.3` “tu hành khổ hạnh”; `parakkamma` → “nỗ lực”.
  - `dhammañca apacāyamāno` (6.3) → “tôn kính Pháp”: `apacāyamāna` ở `ja483:12.3` dịch “tôn trọng”; `ja154:1.3` và `ja154:2.3` dịch cùng gốc là “khinh thường”, trái với nghĩa “kính trọng” của `apacāyati` (**bất thường ngoài lát, báo, không sửa**: 2 khoá). Ở đây chọn “tôn kính” theo nghĩa của gốc từ và theo mạch (vì tôn kính Pháp nên nỗ lực tu khổ hạnh, thay vì dùng sức mạnh).
