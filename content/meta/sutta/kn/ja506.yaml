  - `tāla` (42.2, `tālamattā`) → “cây thốt nốt”: theo `ja511:27.4`; `phīta` (44.3) → “phồn vinh”: theo `ja520:5.3`.
  - `iddhaṁ phītaṁ` (44.3) → “hưng thịnh, phồn vinh”; `kāsivaḍḍhana` (14.4, 25.2) → “bậc làm xứ Kāsi hưng thịnh”: 0 tiền lệ cho dạng này, giữ nghĩa từng thành tố (`vaḍḍhana` “làm tăng trưởng”); `kāsirājā` → “vua xứ Kāsi”: 4 khoá trong tầng cùng cách.

  **Dấu câu (khớp Pāli từng khoá).** Nháy kép `“`/`”`: Pāli và Việt khớp 186/186 khoá, 0 lệch. Nháy đơn `‘`/`’`: Pāli 0, Việt 0 (không có gì để cân). Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (không có gì để cân). Cấu trúc nháy của Pāli: lời trích mở ở `1.1`, `2.1`, `3.1`, `4.1`, `5.1`, `6.1` (kết ở `7.4`), `8.1` (kết ở `9.4`), `10.1` (kết ở `12.4`), `13.1`, `14.3` (kết ở `14.6`), `15.1`, `16.1` (kết ở `17.4`), `18.1` (kết ở `19.4`), `20.1`, `21.1`, `22.1`, `23.1`, `30.3` (kết ở `35.4`), `36.1`, `37.1` (kết ở `38.4`), `39.1`, `40.1`, `41.1`, `42.1` (kết ở `44.4`, `”ti`); Việt kết `44.4` bằng ” (không dịch `ti`).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói không có trong tầng Pāli đã ghim, nên được suy từ nội dung kệ và không ghi vào thân kinh: `1` vua xứ Kāsi hỏi thiếu nữ loài rồng; `2` nàng đáp; `3` vua hỏi vì sao nàng khóc; `4`–`9` nàng nói về chồng nàng bị bắt và xin vua giải thoát (`9.1` `mocehi` là mệnh lệnh nói với vua); `10`–`12` vua đáp (xưng “ta”, `mocemi`, `dammi`); `13` người bắt rắn, vì gọi vua là `janinda` và nói `muñcemu` (“chúng tôi xin thả”); `14` rồng Campeyya; `15`, `18`–`19` vua; `16`–`17` rồng thề; `20` rồng nêu lời nguyền cho kẻ vô ơn; `21` vua; `22` rồng; `23` vua truyền xa giá; `30`–`35` vua hỏi rồng; `36` rồng đáp; `37`–`38` vua; `39` rồng; `40` vua; `41`–`44` rồng. Các đại từ trong Việt chỉ theo ngôi của Pāli (`ahaṁ`, `tvaṁ`, `te`, `me`, `mama`), không gán danh tính. `19.4` `arahasi no jānituye katāni`: `no` đọc là “của/đối với chúng ta” (số nhiều của vua); nghĩa “nên biết những việc đã làm cho chúng ta” là đọc sát chữ, chưa có chú giải xác nhận (cách đọc khác: “nên biết ơn”).
  2. `nāga` ở 4.2 nằm sát `uraga` ở 4.1 (cùng một vật gọi bằng hai tên): dịch “rắn” rồi “rồng” theo từng chữ; không gộp.
  3. `Nāge ca yojentu suvaṇṇakappane` (23.3): hiểu `nāge` là voi (cạnh xe và la trong đoàn xa giá, và `nāga` còn là chữ chỉ voi trong tầng); nếu đọc là rồng thì câu mất nghĩa “thắng xe”. `nāgassa nivesanāni` (23.4) là trú xứ của rồng.
  4. `passeyyaṁ me nivesanaṁ` (14.6): hình thức `passeyyaṁ` không rõ là ngôi hai (“mong ngài được thấy”) hay ngôi nhất (“để tôi cho ngài thấy”); dịch “mong ngài được thấy trú xứ của tôi”, hợp với câu đáp ở `15.4`/`18.4` (`dakkhemu te nāga nivesanāni`).
  5. `Catuppathe sammati nāgarājā` (7.2): `sammati` (từ gốc `sam` “lặng”) dịch “lặng yên”; không rõ có nghĩa “nằm yên”, “nghỉ” hay “an trú”; không thêm ý. Vào hai ngày 14 và 15 vị rồng ở ngã tư đường, rồi 6.4 nói vì tôn kính Pháp nên “nỗ lực tu khổ hạnh”; không thêm chi tiết nào ngoài chữ.
  6. `kambukāyūradharā` (31.1): `kambu` vừa là “ốc” vừa là “vàng”; dịch “vòng xuyến vàng” theo `pv24:6.3`, `pv34:2.5` (2 khoá, cùng công thức). `Najjo ca temā puthulomamacchā, āṭā sakuntābhirudā sutitthā` (32.1–32.2): `temā` (ẩm ướt) dịch “đẫm nước”; `puthuloma` chỉ một loại cá nhưng không xác định được, giữ phiên âm “cá puthuloma”; `āṭā` là chữ chưa xác định (0 tiền lệ trong tầng, không thấy trong các tầng đã ghim nào khác), giữ phiên âm, không thêm nghĩa. Ba chữ này ghi là bất định, không phải tuyên bố.
  7. `kaṁsavijju pabhassaraṁ` (26.4): `kaṁsa` “đồng/kim loại thau”, `vijju` “tia chớp”; dịch “sáng chói như chớp đồng”; không biết đó là ánh chớp màu đồng hay một so sánh khác. `Suvaṇṇacitakaṁ bhūmiṁ` (25.1): `citaka` dịch “dát”; “xếp thành đống” cũng có thể.
  8. `Taṁ nāgakaññā caritaṁ gaṇena` (29.1): `taṁ` có thể chỉ cung điện (nơi các thiếu nữ lui tới) hoặc một vật khác trong câu; dịch “Nơi ấy có … thành đoàn lui tới” theo cách đọc ít giả định nhất; `anvāruhī` (29.2) “bước lên”.
  9. `vihatantaraṁso` (37.1): `antaraṁsa` “khoảng giữa hai vai”; dịch “vai rộng”; không chắc là “vai” hay “ngực” rộng. `kappitakesamassu` (37.2) “râu tóc cắt tỉa gọn”.
  10. `vārigehasayā nārī` (8.3): dịch “những phụ nữ sống trong nhà nước”, theo từng chữ (`vāri` nước, `geha` nhà, `sayā` nằm/ở).
  11. `ghoravisā uḷārā` (19.1): `uḷāra` ở đây dịch “to lớn” (còn có nghĩa “cao quý”, `ja253:1.1`); `khottha` đọc là `kho attha`.
  12. `Karassu rūpiyapākāraṁ karontu` (42.4): hai động từ `karassu` (lệnh, ngôi hai) và `karontu` (lệnh, ngôi ba số nhiều); dịch “hãy làm một tường thành bạc, hãy để người ta làm”; `suvaṇṇagharāni` (42.3) “nhà vàng”: câu thiếu tân ngữ rõ ràng cho `haritvāna`, không thêm chữ.
  13. `Bārāṇasiṁ nagaraṁ iddhaṁ phītaṁ, rajjañca kārehi` (44.3–44.4): không rõ `Bārāṇasiṁ nagaraṁ` là tân ngữ của `kārehi` (“hãy cai quản thành Bārāṇasī và vương quốc”) hay đứng song song với `etādisaṁ vimānaseṭṭhaṁ` (“ở trong cung điện này, và thành Bārāṇasī…”). Dịch để cả hai cách đọc còn mở: thành Bārāṇasī hưng thịnh, “và hãy cai quản vương quốc”.
  14. `Saccappaṭiññā tava mesa hotu` (21.1): `paṭiññā` (lời hứa/cam kết); 0 tiền lệ trong tầng; dịch “lời hứa chân thật”; `gimhesu` (21.4) “trong mùa nóng”.
  15. `Peḷāya baddho maraṇaṁ upetu` (20.3): `peḷā` “giỏ”; dịch “bị trói trong giỏ”; cách đọc “bị nhốt trong giỏ” cũng được.

