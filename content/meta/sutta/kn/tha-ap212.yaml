  nêu. (c) `tha-ap154:9.1` dùng *bài kệ này* (số ít) cho `imā gāthāyo` (số nhiều) —
  thuộc nhóm 21 khoá mà `BRIEF_THAP` đã gọi là lỗi ở 4 lát liên tiếp; cần một lượt sửa
