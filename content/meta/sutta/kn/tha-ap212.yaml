notes: |-
  **Bài này.** `tha-ap212` — phẩm `Kaṇikārapupphiyavagga` (`Phẩm Hoa Kaṇikāra`), bài thứ
  **mười** trong phẩm, vị trưởng lão **Pāpanivāriya**. Đây là bài **thứ mười nhất** của
  phẩm nên khác 9 bài kia ở chỗ có **hai khoá phụ**: `:9.1` (`…vaggo ekavīsatimo`) và
  `:10.1`–`:11.6` là **uddāna** (kệ tóm lược) của cả phẩm. Nội dung riêng của bài: ông
  dâng **một chiếc chòm** cho Đức Thế Tôn với tâm hoàn toàn thanh tịnh; tội lỗi của ông
  được bù đắp nhờ điều thiện, mọi cõi hữu đều dứt sạch, và thân xác cuối cùng được
  giữ trong giáo pháp của Đức Chánh Đẳng Giác. Kệ mở ngoặc kép ở `:1.1` và đóng ở
  `:6.3` — nhịp nháy **cố ý chạy qua khoá**, nên tôi so khớp từng khoá với Pāli.

  **`translationTitle` bằng đúng `:0.3`.** Pāli `:0.3` = `10 Pāpanivāriyattheraapadāna`
  **có** số thứ tự ở đầu ⇒ theo luật "giữ số khi và chỉ khi Pāli `:0.3` bắt đầu bằng
  số", tôi giữ số theo hình thức `10. `, và `translationTitle` viết **y hệt** giá trị
  `:0.3`. Tệp cũ ghi `Kinh Kệ Của Trưởng Lão Pāpanivāriya` — vừa sai thành ngữ, vừa
  mất số `10`; đây là lỗi đã mắc 4 lần ở 4 đợt, nên tôi sửa từ gốc.

  **Phe dấu `ti` — đo lại ở phạm vi gần nhất, hai con số đều nêu.**
  Cùng phẩm `tha-ap203`–`tha-ap212`: **Tuyên Ngôn 6 · Tuyên Ngợ 4 · Ký Sự 1** ⇒ đa số
  gần nhất là **Tuyên Ngôn**, tôi theo. Toàn tầng `tha-ap` (405 tệp có `:0.3`): **Tuyên
  Ngợ 220 · Ký Sự 95 · Tuyên Ngôn 87**. Hai phạm vi cho hai đa số khác nhau, nên tôi nêu
  cả hai và theo **phạm vi gần nhất**.

  **Tên phẩm `:0.2`.** Cùng phẩm: `Phẩm Hoa Kaṇikāra` 7 · `Phẩm Kaṇikārapupphiya` 1 ·
  `Phẩm Bậc Rải Hoa Kaṇikāra` 1 ⇒ đa số gần nhất **và** đa số toàn tầng (16, cao nhất
  trong 405 tệp) đều là **`Phẩm Hoa Kaṇikāra`**, tôi theo. Ba tệp `Phẩm Hoa Dâm Bụt`
  ở phẩm kế bên là lỗi đã biết (không có gốc trong Pāli) — không liên quan tới đây.

  **Tiền lệ, đếm được.** Tầng Việt `kn` có **2.263 bài / 31.495 khoá Pāli trùng nguyên
  văn đã có bản Việt**. Trong 35 khoá tôi dịch:
  - **21 khoá** tìm thấy tiền lệ ở nơi khác trong tầng, quét **2.542 cặp Pāli trùng**.
  - **1 khoá** ghi **nguyên văn** y hết một bản Việt đã có: `:6.2` (`…pe…` → `…`).
  - **20 khoá** có tiền lệ nhưng tôi **viết khác**. Những chỗ đáng nói:
    - `:2.2` `kusalassupasampadā` — chỉ 1 tiền lệ (`tha-ap222:2.2` = *để thành tựu các
      thiện pháp*) và **tôi cố ý viết khác**, vì ở `tha-ap222` Pāli có
      `Pāpaṁ vivajjanatthāya` (nghĩa *để*) đứng trước còn ở đây không: `Nivutaṁ hoti
      me pāpaṁ, kusalassupasampadā` là quan hệ **nhân quả**, tôi dịch *nhờ sự thành tựu
      của điều thiện*. Đây là trường hợp Pāli trùng mà bản Việt **phải** khác.
    - `:3.1` `Carimaṁ vattate mayhaṁ` — tiền lệ *Đời sống cuối cùng của ta thì là* bỏ mất
      ngôi tương lai của `vattate`; tôi giữ: *Đời cuối cùng của ta sẽ là đây,*
    - `:8.1` — tiền lệ `tha-ap222:6.1` dùng *Ký sự* cho cùng Pāli `Pāpanivāriyattherassāpadānaṁ
      dasamaṁ`; tôi theo phe đo được ở trên (Tuyên Ngôn).
    - `:10.1` `Tassuddānaṁ` — **riêng `tha-ap`**: *Tóm tắt phẩm này:* 21 vs *Tóm lược:*
      7 vs *Tóm lược phẩm ấy:* 2 ⇒ theo đa số trong chính cuốn. (Toàn tầng đa số là
      *Tóm lược:* 67, nhưng ngoài `tha-ap`; tôi nêu cả hai.)
    - `:1.4` `vippasannena cetasā` — 11 tiền lệ với 11 cách viết; tôi dùng *với tâm hoàn
      toàn thanh tịnh* **giống hệt** bài kia của lát để hai bài nhất quán.
  - **0 cặp Pāli trùng nguyên văn trong chính bài** ⇒ không có chỗ nào phải viết khác vì
    bài tự mâu thuẫn.

  **`Ekacchattaṁ` / `chattadāna` — sửa lại một đọc sai có sẵn, và đây là bằng chứng.**
  `notes` cũ của chính tệp này dịch là *tấm chăn bạc*. Đọc đó **sai**: `cchatta` = vàng
  là một từ khác, còn `chattā` là vải trắng / tấm chòm. Bằng chứng trong chính tầng này —
  `tha-ap459` (vị trưởng lão tên **Ekacchattiyo**, cùng công thức `…chattamādadiṁ…` /
  `…chattadānassidaṁ phalaṁ`) dùng `chattam` cho **chiếc chòm trắng**:
  `Paṇḍaraṁ chattamādāya` = *Ta cầm chiếc chòm trắng tinh*, `Paṭiggaṇha imaṁ chattaṁ` =
  *Xin nhận lấy chiếc chòm này*, `Ajjāpi setacchattaṁ me` = *Ngay hôm nay, chiếc chòm
  trắng của ta*, và chính hai khoá tôi dịch ở đây đã có tiền lệ: `tha-ap459:9.2` =
  *khi ta dâng chiếc chòm ấy;* và `tha-ap459:9.4` = *đó là quả báo của việc dâng chiếc
  chòm.* ⇒ tôi dùng **chiếc chòm** cho `:1.3`, `:4.2`, `:4.4`.

  **Hai chỗ tôi sửa số, tiền lệ đang SAI — có bằng chứng đo được.**
  1. `:5.1` `Dvesattatimhito kappe` = **2 × 70 = 140 kiếp**. Tiền lệ duy nhất là
     `tha-ap172:4.1`, cùng Pāli này, dịch *Vào hai mươi tám kiếp trước* — **sai**. Tôi dịch
     *Trong một trăm bốn mươi kiếp trước,*. Cùng phẩm kế bên còn có `Ekanavuti` = 91,
     `Dvenavute` = 92, `Ito ekādase` = 11, `Catunnavuti` = 94 — đều là cấu trúc `số +
   navute/sattati`, nên `dve sattati` không thể là 28. **Báo coordinator: `tha-ap172:4.1`
   cần sửa thành một trăm bốn mươi.**
  2. `:5.2` `aṭṭhāsiṁsu janādhipā` = **68** vị chúa tể muôn dân. Tiền lệ `tha-ap41:5.2`,
     cùng Pāli này, dịch *có tám vị chúa tể muôn dân* — **sai** (đó là `aṭṭha` = 8, không
     phải `aṭṭhāsiṁsat` = 68). Tôi dịch *sáu mươi tám vị chúa tể muôn dân*. **Báo
     coordinator: `tha-ap41:5.2` cần sửa.**

  **Bất định lớn nhất của bài — `Ākāse chattaṁ dhārenti,` (`:2.3`) — chưa phân xử được,
  nói thẳng.** Pāli là `chattāro` (số **bốn**) + `dhārayanti`. Có ba điều:
  (a) Tôi **không** dịch *ba thế giới* như `notes` cũ của tệp này từng viết, vì `chattāro`
  là **bốn**, còn *ba* là `tīṇi` — dịch vậy là tự sửa Pāli.
  (b) Nhưng Pāli **không nói** "bốn cái gì", và tôi không tìm được chứng cứ nào trong
  Pāli root buộc "bốn" ấy là bốn đại địa chất, bốn phương hay bốn cõi — nên tôi giữ
  đúng số lượng mà **không đặt danh tính** cho nó: *Trên bầu trời, bốn phía nâng đỡ,*.
  (c) Đây là mức chắc chắn, không phải sai nghĩa giáo lýc, nên tôi **không** nâng thêm
  blocker; nhưng nó là lý do `grammar_logic` ở 9.2. Người biên tập có Pāli chú giải
  (Sumaṅgala-vilāsini) trong tay thì phán một lượt cho cả cuốn, vì cùng kiểu câu này có
  thể lặp ở nhiều apadāna.
  Vế kế `pubbakammassidaṁ phalaṁ` tôi dịch *đây là quả báo của nghiệp xưa ấy* (tiền lệ
  *đây là quả báo của tiền nghiệp* bỏ mất vế `idaṁ`).

  **`devadevassa tādino;` (`:1.2`) — cũng bất định, đã ghi.** `devadeva` có 11 tiền lệ
  đã dịch trong tầng, đa số *Đấng Thiên Trung Thiên* ⇒ tôi theo. Nhưng `tādino` thì tầng
  đang **tách làm hai**: đa số coi nó là danh hiệu (*bậc Như Thật*, *bậc Bất Động* — 40+
  nơi), còn một nơi dịch theo nghĩa đen (*Đấng ham muốn điều ấy*). Tôi theo **nghĩa đen**
  vì Pāli là authority: `tādino` = `tādi` + `-ino` = *có dụng ý ấy*, và ở bài này nó
  khớp với hành động sắp kể (dâng chiếc chòm). Tôi giữ ở mức vừa đủ, không biến thành
  khẳng định. Nếu biên tập chọn cách danh hiệu thì phải sửa **cả tầng** một lượt.

  **Uddāna (`:10.1`–`:11.6`) — tôi giữ tên Pāli, đếm được.** `:11.1`–`:11.5` liệt 10
  tên, khớp 10 bài đầu phẩm: `Kaṇikāro`→`tha-ap203`, `Minela`→`204`, `Kiṅkaṇi`→`205`,
  `Taraṇa`→`206` (Pāli tên bài là `Taraṇiya`, uddāna rút gọn), `Nigguṇḍipupphī`→`207`,
  `Dakā`→`208` (rút gọn từ `Udakadāyaka`), `Salala`→`209`, `Kuraṇḍa`→`210` (từ
  `Koraṇḍapupphiya`), `Ādhāraka`→`211`, `Pāpavārī`→**`212` (chính bài này, dạng rút gọn
  của `Pāpanivāriyo`)** — tức uddāna **tự xác nhận** tên vị trưởng lão của bài, đúng như
  `tha-ap212` là bài thứ mười. `:9.1` `ekavīsatimo` = 21, khớp `tha-ap203`–`tha-ap223`.
  Tiền lệ cách dựng uddāna: `tha-ap172:10.1`–`10.6`, `tha-ap222:9.1`–`9.6` (cùng phẩm
  `hatthivagga`) — giữ tên Pāli có dấu, dùng *và / cùng* cho `ca`, và `gāthakāti` → *gồm
  có N bài kệ* (4 tiền lệ, cùng hình thức).
  **Quan sát, không tự sửa:** `:11.6` `aṭṭhatālīsa` = 88, tôi dịch đúng **88** theo Pāli.
  Nhưng đếm kệ thật của 21 bài `tha-ap203`–`223` (mỗi vế = 4 khoá, cộng theo bài) ra
  **108**, không phải 88. Số trong uddāna Pāli của chính cuốn này không khớp thực tế —
  hiện tượng có thật, và nó cũng xảy ra ở phẩm kế bên (`tha-ap202` ghi
  `gāthā paññāsa aṭṭha cāti` = 58 trong khi đếm được 50). Tôi **không** sửa số trong
  kinh; đây là việc biên tập phán trên bản Pāli.

  **`…pe…`.** `:6.2` Pāli = `…pe…`; bản Việt giữ **đúng một** `…`, không mở rộng — theo
  `BRIEF_VI3` §10.1.

  **Năm phép kiểm tự viết (`_hvi.py` chạy rỗng ở `tha-ap`).** Ở phẩm này 35/36 khoá Pāli
  ngắn hơn 40 ký tự, nên bộ lọc `len(p[k]) >= 40` của `_hvi.py` không quét khoá nào và
  báo xanh — đó **không phải pass**. Tôi tự quét **mọi khoá**: (1) tập khoá
  `set(VI) == set(Pāli) == set(all)` → 36/36, không thừa, không orphan; (2) ngoặc kép
  `“”` **và** nháy đơn `‘’` so **từng khoá** với Pāli (không phải mỗi khoá tự cân) → 0 lệch,
  tổng còn dư = 0; (3) dấu lược: 1 khoá Pāli có `…pe…`, giữ đủ 1 `…`, không mở rộng chỗ
  nào → 0 lệch; (4) rỗng / `(…)` chưa dịch → 0; (5) NFC + không trùng nguyên văn Pāli
  (trừ `:0.1` là tên bộ) + thứ tự khoá bằng Pāli → 0 lỗi. Ngoài ra: **0 cặp Pāli trùng
  trong chính bài**. Ghi lại 2 lần cho idempotent, byte-for-byte không đổi.
  Lưu ý phạm vi: `content/meta/reference-gaps.yaml` ghi `substantiveSegments: 1` cho bài
  này vì cùng ngưỡng 40 ký tự; tệp đó nằm ngoài lát này nên tôi **không** sửa, và con số
  đó chỉ đo được 1/36 khoá, không phải toàn bài.

