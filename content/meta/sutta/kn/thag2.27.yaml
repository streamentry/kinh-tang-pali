  PĀLI TRÙNG NGUYÊN VĂN — **56 CẶP TÌM ĐƯỢC**, dùng lại nguyên văn đã có. Tôi dựng chỉ mục Pāli↔Việt của **110.314 khoá trên 3.801 bài** đã dịch rồi so 182 khoá của lát này. Dùng lại **nguyên văn**: `Dukanipāta` → *Bộ Hai Bài Kinh* (`thig2.3:0.2`, `ja153:0.2`) · `Dutiyavagga` → *Phẩm Thứ Hai* · `Tatiyavagga` → *Phẩm Thứ Ba* · `Tissattheragāthā` → *Kinh Kệ Của Trưởng Lão Tissa* (`thag1.39:0.4`) và `… Tisso thero …. ` → *… Trưởng lão Tissa ….* (`thag1.39:1.5`, `thag1.97:1.5`) · `Kimilattheragāthā` → *… Kimbila* (`thag1.118:0.4`/`1.5`) · `Valliyattheragāthā` → *… Valliya* (`thag1.53:0.4`/`1.5`) · `“Accayanti ahorattā,` → *“Ngày và đêm trôi qua,* (`sn4.10:5.1`) · `jīvitaṁ uparujjhati;` → *mạng sống bị cắt đứt;* (`sn4.10:5.2`) · `Āyu khīyati maccānaṁ,` → *tuổi thọ của người phàm hao mòn,* (`sn4.10:5.3`) · `Atha pāpāni kammāni,` + `karaṁ bālo na bujjhati;` → *Kẻ ngu làm các việc ác, / nhưng không biết mình làm;* (`dhp136:1`–`2`) · `Sevetha pantāni senāsanāni,` → *Hãy thân cận những trú xứ xa vắng,* (`sn6.13:2.1`/`3.3`) · `Sace ratiṁ nādhigaccheyya tattha,` → *Nếu không tìm được sự thích thú ở nơi ấy,* (`sn6.13:2.3`) · `Etamādīnavaṁ ñatvā,` → *Biết sự nguy hiểm ấy,* (`iti105:4.1`) · `sato bhikkhu paribbaje”ti.` → *tỳ-kheo hãy sống chánh niệm* (`iti105:4.4`) · `Niccaṁ daḷhaparakkamā;` → *thường hằng với nỗ lực bền bỉ;* (`sn9.2:7.2`) · `yogakkhemassa pattiyā;` → *để mong đạt sự an ổn, thoát khỏi gông trói;* (`ja55:1.4`, `ja56:1.4`) · `Ajjhattañca bahiddhā ca,` → *Dù ở bên trong hay bên ngoài,* (`sn36.2:2.3`) · `natthi dāni punabbhavo”ti.` → *nay không còn tái sinh nữa* (`sn56.21:5.4` — vế có `”ti.` như Pāli bài này) · `“Yathāpi bhaddo ājañño,` → *“Như con ngựa thuần chủng tốt,* (`thag1.45:1.1`, `thag1.16:1.1`) · `khalitvā patitiṭṭhati;` → *vấp lún đi vẫn đứng vững trở lại;* (`thag1.45:1.2`) · `Evaṁ dassanasampannaṁ,` → *Cũng vậy, bậc đầy đủ phần thấy biết,* (`thag1.45:1.3`).

  **TÔI CỐ Ý KHÔNG DÙNG LẠI MỘT CHỖ — VÀ ĐÓ LÀ MỘT SAI SỐT ĐÃ CÓ SẴN.** `thag2.17:1.2` = `muṇḍo saṅghāṭipāruto;` trùng nguyên văn `sn7.13:2.2`, đang dịch trong tầng là *trọc đầu, khoác **y vàng**;*. Pāli `saṅghāṭi` là **áo ngoài** (cùng tệp đó dịch `catugguṇaṁ saṅghāṭiṁ` thành *y sa-đề*), không có chữ nào mang nghĩa *vàng*. Theo luật "Pāli là authority cuối cùng" và "đừng nhân bản lỗi của người trước", tôi dịch **áo ngoài** và **ghi lại ở đây để người điều phối quyết một lần cho cả hai bài**; tôi không sửa `sn7.13` vì ngoài lát.

  **LỖI REVIEW TỰ BẮT ĐƯỢC (3 lỗi, đã sửa trước khi ghi):** (1) `thag2.15:2.4` lặp *hàng người* hai lần liên tiếp với `2.3`, đã đổi thành *họ đã làm hại biết bao người*; (2) `thag2.19:1.2` *chạy theo sự trang sức* quá nghĩa cho `anuyuñjisaṁ`, và `1.3` bỏ mất `cāsiṁ` (= *tôi đã sống*), đã sửa thành *nên mê mải trang sức;* / *Tôi từng sống kiêu mạn, bóng bẩy,*; (3) `thag2.26:1.4` lặp *tự mình* hai lần, đã rút thành *để tự mình biết và thấy;*.

  **BẤT ĐỊNH ĐÃ PHÂN XỬ VÀ GHI LẠI — không chú thích vào thân kinh:** (a) `thag2.22:1.3–1.4` — `Tiriyaṁ soḷasubbedho, / ubbhamāhu sahassadhā`. Pāli nói **xề ngang** gấp mười sáu và **xề cao** gấp trăm rồi ngàn lần; Sujato đảo thành *chiều cao gấp mười sáu lần chiều ngang*. Tôi theo Pāli. (b) `thag2.23:2.1–2.2` — `satta aṭṭha ca` chỉ là *bảy và tám*, không nói là *bảy giác chi và Thánh đạo tám chi* như Sujato khoanh. Tôi dịch **đúng chữ**; đây là công thức quen nhưng Pāli không nói thẳng, nên tôi không đưa phần nhận diện vào thân kinh. (c) `thag2.18:1.1` — `Pācīnavaṁ sadāyamhi` đọc được hai cách: *đã bước vào phía đông* (aorit của `sadāyati`) hoặc *tôi ở phía đông* (`sadāyaṃ asmi`). Tôi chọn cách thứ nhất; Sujato đọc cả vế là một **tên nơi** (*Park of the East-Raftered Hall*), tôi không đưa tên nơi vào vì Pāli không có danh từ đó. (d) `thag2.19:2.1–2.2` — `Upāyakusalenāhaṁ, buddhena ādiccabandhunā` có **hai** công cụ: *tài ứng đoạn của chính tôi* **và** *Đức Phật, thân thuộc Mặt Trời*. Sujato gộp thành một vế. Tôi giữ cả hai vì Pāli có cả hai. (e) `thag2.19:2.4` — `udabbahin` = *không bị trói*, nên *xin tâm tôi khỏi bị trói buộc*; Sujato hiểu là *rút ra sự chấp thủ vào hữu vi*, tôi không nhập nghĩa ấy vào vì Pāli không nói. (f) `thag2.15:2.4` — `heṭhayitvā bahuṁ janan` tôi đọc là mệnh đề bổ nghĩa cho `taṁ janaṁ` (*họ đã làm hại biết bao người*), theo Sujato; cách đọc còn lại là chủ ngữ đã đi làm điều ấy.

