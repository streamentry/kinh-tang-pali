notes: |-
  **ĐỌC TOÀN BỘ PĀLI TRƯỚC KHI VIẾT.** 33 khoá; sau khi ghi đã in lại từng cặp Pāli↔Việt và đọc.

  **`:0.3` — GIỮ SỐ 3, VÀ PĀLI LÀ CHỨNG CỨ.** Pāli `tha-ap225:0.3` = `3 Dverataniyattheraapadāna`
  — **bắt đầu bằng số**. Cùng phép đo trên **437** tệp `tha-ap` (loại **67** tệp `:0.3` rỗng,
  còn **370** lượt): Pāli **có số** ⇒ giữ **117**, khớp số Pāli **117/117**, bỏ **0**; Pāli
  **không số** ⇒ giữ **0**, bỏ **253**. Hình thức khi giữ: chữ số kèm dấu chấm **101** so với số
  trần **16** ⇒ chọn `N.` ⇒ `3. Bài Kệ Tuyên Ngợ Về Trưởng Lão Dverataniya`. Số này cũng khớp
  `:9.1` Pāli `…tatiyaṁ` (thứ ba), nên bài không tự mâu thuẫn. Cùng khuôn với tiền lệ đã đo được
  `tha-ap56:0.3` (`4 Gandhodakiyattheraapadāna` → `4. Bài Kệ Tuyên Ngợ Về Trưởng Lão Gandhodakiya`).

  **COVERAGE ĐO ĐƯỢC — MẪU SỐ 1.** Pāli ≥ 40 ký tự (loại block `:0`) chỉ có **1** khoá: `:8.1`
  (64 ký tự). Tầng Anh = **0/1 = 0%** ⇒ cổng coverage không đo được gì, khác với "không cần ghi
  nhận". Ghi rõ để người gộp không đọc nhầm.

  **HAI KHOÁ ĐƯỢC ANH ĐÃ GHIM XÁC NHẬN.** `:2.3` `Sadevakasmiṁ lokasmiṁ,` trùng nguyên văn
  `iti112:13.3` — Anh đã ghim *"In the world with its gods,"*, đúng là *trong thế giới cùng chư
  Thiên,* (tiền lệ Việt: `mil5.5.11` 3 tệp). `:6.4` `cakkavattī mahabbalo.` trùng `cp4:1.4` —
  Anh đã ghim *"a wheel-turning monarch of great power."*, nên *là Chuyển luân vương có đại thần
  lực.* là cách đọc có chứng cứ (34 tệp trùng nguyên văn cũng dùng **đúng câu này**). Còn `paññā
  nipuṇavedanī` không có trong bộ nào đã ghim Anh, nên dịch từ Pāli.

  **DÙNG LẠI NGUYÊN VĂN 11/33 KHOÁ**, đo bằng script: `:0.1` (358/367); `:0.2`; `:1.1` *“Trước kia
  ta thành con nai bị săn đuổi,* (2 tệp); `:1.3` *Tôi đã trông thấy Đức Phật ly trần,* (5, đa số
  38); `:1.4` *bậc xứng đáng đón nhận các phẩm vật cúng dường.* (tha-ap113:2.4); `:2.2` *Đức
  Vipassī, bậc Đại Ẩn Sĩ;* (2); `:5.1` *Vào chín mươi mốt kiếp trước,* (28, đa số 97); `:5.3`
  (124, đa số 336); `:6.4` (34, đa số 85); `:7.1` (372); `:7.3` (342).

  **TÊN PHẨM — ĐA SỐ ĐO ĐƯỢC, NHƯNG CHƯA THỐNG NHẤT TRONG KHO.** Pāli `Ālambaṇadāyakavagga`
  được 9 tệp cùng phẩm dịch thành: *Phẩm Người Cho Chỗ Tựa* **5** (tha-ap226–229, 231) ·
  *Phẩm Ālambaṇadāyaka* **2** (224, 232) · *Phẩm Người Cho Bậc Thang* 1 (223) · *Phẩm Bậc Cho
  Thức Uống* 1 (230). Tôi theo đa số 5 và ghi lại 4 cách kia ở đây để **coordinator gộp**. Sujato
  đã ghim gloss phẩm này là “Chapter Beginning With Ālambanadāyaka” — tức tên phẩm mang nghĩa
  "phẩm mở đầu bằng trưởng lão Ālambaṇadāyaka"; tầng Việt của kho đang dịch **tên phẩm** chứ
  không theo gloss đó, nên tôi giữ theo dòng đó.

  **BẤT ĐỊNH ĐÃ GHI.**
    · `paññā nipuṇavedanī.` (`:4.4`) — 0 tiền lệ. `nipūṇa` là "thâm sâu, vi diệu" và `vedanī` là
      "thấy biết, chứng nghiệm" (như `paṇḍitavedanīya` = chỉ bậc hiền tri mới hiểu, xuất hiện
      25 lần trong Pāli đã ghim). Tôi dịch *nhờ tuệ thâm sâu khó lường.* Không thêm danh tính
      ba điều kiện của tâm.
    · `Gattañca mudukaṁ mayhaṁ` (`:4.3`) — "thân ta cũng trở nên mềm yếu". `gatta` = thân,
      `muduka` = mềm yếu.
    · `Tehaṁ sabbe anubhomi,` / `maṁsadānassa sattiyā;` (`:4.1`–`:4.2`) — cả hai vế đều là
      từ ngữ chỉ nguyên nhân. Tôi đảo hai vị trí để câu tiếng Việt đọc được (lý do trước, kết quả
      sau): `:4.1` mang *Nhờ thế lực của tấm thịt tế lễ ấy,* và `:4.2` mang *ta đã thắng trọn vẹn tất
      cả;*. **Không mất gì**, nhưng hai khoá không còn mang đúng vế Pāli của mình — ghi ra đây vì
      đó là lý do `grammar_logic` của bài thấp hơn hai bài kia 0,1.
    · `Duveme ratanā loke,` (`:3.3`) — "hai món báu quý hiếm có ở đời". `ratana` dịch *báu quý*
      theo tiền lệ `Sattaratanasampannā` → *Đầy đủ bảy món báu quý giá* (15 tệp). Tôi **không**
      đoán hai món báu ấy là gì, vì kinh không nói.

  **DẤU LƯỢC — GIỮ ĐÚNG MỘT `…`.** `:7.2` Pāli là `…pe…` ⇒ bản Việt viết **một** `…`, không
  mở rộng. Đây là khoá lược **duy nhất** trong 33 khoá của bài.

  **NGOẶC KÉP.** `“` mở ở `:1.1`, `”` đóng ở `:7.3`; cân 1/1 ở mức cả bài. Bài này không có nháy
  cong lồng nhau.

  **TỰ KIẾM 4 LỚP LỖI CHỐT KHÔNG BẮT** (`_n9_selfcheck.py`, 99 khoá lát, **0 lỗi**): tập khoá
  33/33; nháy đơn cân; `…pe…` không bị bung; `…` trần không bị bung; NFC mọi khoá; idempotent.

  **CHỐT `lọt_pāli`**: khai `Dverataniya` (chứng từ `:0.3`, `:8.1` `dverataniyo`, `:9.1`) và
  `Mahārohita` (`:6.3` `Mahārohitanāmo so`) trong bộ nhớ tiến trình, cùng mọi từ có dấu Pāli nằm
  trong Pāli của chính bài. Không sửa `_hvi.py`.

