notes: |-
  **ĐỌC TOÀN BỘ Pāli TRƯỚC KHI VIẾT.** 36 khoá, in lại cặp Pāli↔Việt sau khi ghi.

    **TẦNG THAM KHẢO — 0/2 khoá có Anh Sujato** ⇒ `draft`, `triangulation` 7.5.

    **DÙNG LẠI NGUYÊN VĂN 12/15 KHOÁ PĦI TRÙNG.** `Satapattehi sañchanno,` → Bằng những bông
    sen trăm cánh, (1); `Addasaṁ samaṇānaggaṁ,` → Tôi nhìn thấy bậc Tối Thắng giữa các
    sa-môn, (2); `gacchantaṁ anilañjase.` → đang ngự giữa bầu trời lộng gió. (3); `Sakaṁ cittaṁ
    pasādetvā,` → Làm cho tâm mình tịnh tín, (2); `Himavantassāvidūre` → “Không xa dãy Himavanta,
    (3); `Sattaratanasampanno,` (19); `cakkavattī mahabbalo.` (24); `Paṭisambhidā catasso,` (287);
    `…pe…` (406); `kataṁ buddhassa sāsanaṁ”.` (257); `Duggatiṁ nābhijānāmi,` (83);
    `Mama saṅkappamaññāya` → Nhờ thấu rõ ý định của ta, (1 trong 3 cách, đều 1 lần);
    `Tena cittappasādena` → Nhờ tâm tịnh tín ấy, (2 trong 11 cách).

    **3 KHOÁ LỆCH ĐA SỒ — VÌ ĐÂY LÀ CÁCH BẦU ĐA SỐ NHƯNG KHÔNG PHẢI NHẤT TRÍ.**
    · `Ekattiṁse ito kappe` không có ở bài này; các khoá khác đã nêu ở `tha-ap42.yaml`.
    · `Tena cittappasādena,` (`:6.1`) có **11** cách, tối đa chỉ 2 lần. Tôi dùng *Nhờ tâm tịnh
      tín ấy,* vì `tena` (= nhờ cái ấy) nối trực tiếp với `Sakaṁ cittaṁ pasādetvā` ở `:5.1`.
    · `santharassa idaṁ phalaṁ.` (`:6.4`) có 3 cách, mỗi cách 1 lần: *đó là quả báu của việc
      cúng thảm lá* / *đây là quả báo của việc trải thảm hoa* / *đó là quả báu của việc rải
      hương*. Ở đây `:4.1–4.2` là *ta bày một tấm thảm cỏ / làm chỗ ngồi nằm;* nên tôi dùng
      *đây là quả báo của việc trải thảm hoa.* — khớp đúng hành vi, không phải *rải hương*.
    Nói thẳng: ba khoá này tôi chọn theo logic Pāli chứ không theo phiếu, vì không có phiếu
    đáng tin (1–2 lần).

    **TÊN PHẨM.** `Nāgasamālavagga` đang có 8 bài đã dịch, chia đôi: *Phẩm Nāgasamāla* 5
    (tha-ap73, 76, 79, 80, 81) và *Phẩm Bậc Nāgasamāla* 3 (tha-ap74, 75, 77). Tôi lấy **đa số
    5/8**: *Phẩm Nāgasamāla*.

    **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
    · `Paṭikuṭiko apasakkiṁ,` (`:5.3`) — hai danh từ làm tính ngữ cho Đức Phật: `paṭikuṭika` =
      đẩy lui được, `apasakki` = không đạt được (ý nguyện). 0 tiền lệ cho cụm này. Tôi dịch
      *Bậc chắn đẩy, bậc không đạt được ý nguyện,* và ghi vì cách này là cách đọc chứ không phải
      cách dịch chắc chắn.
    · `miga sammatakhattiyo;` (`:7.2`) — `miga` ở đây là TÊN GIA TỘC (không phải *con nai*; cùng
      kiểu với `Vallikāro`, `Naḷamālī` ở uddāna tha-ap482), `sammatakhattiya` = hàng Sát-đế-lý
      tử tế. 0 tiền lệ. Tôi dịch *ta sinh ra trong gia tộc Miga, bậc Sát-đế-lý hảo kiện;* — giữ
      `Miga` vì đó là cách tầng đang dùng cho tên hiệu của `Migaluddo`.
    · `nānāsakuṇamālayo` (`:1.4`) — `sakuṇa` ở đây là **Hoa** (cụm `nānāsakuṇamāla` xuất hiện ở
      `tha-ap482` với nghĩa *vòng hoa*). Tôi dịch *lót thành vòng hoa nhiều loài.*, không dịch
      *chim sẻ* — đó là cách hiểu sai theo nghĩa đen của *sakuṇa* ở nơi khác.
    · `Visāṇena tiṇaṁ gayha` (`:4.1`) — `tiṇa` ở đây là **thảm/đám cỏ trải**, không phải *cỏ*
      đơn lẻ; `visāṇa` = rải ra. Tôi dịch *ta bày một tấm thảm cỏ,*. Từ này cũng là gốc của
      tên `Tiṇasantharadāyaka` (người dâng thảm cỏ), nên cả tên và câu kệ nói cùng một việc.

    **DẤU LƯỢC.** `:8.2` là `…pe…` → **đúng một** `…`.

    **NGOẶC KÉP.** `“` mở ở `:1.1`, `”` đóng ở `:8.3`. Tự đếm lại: cân.

