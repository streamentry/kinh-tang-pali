notes: |-
  Đối chiếu Pāli + Anh Sujato (8/9 khoá; khoá 2.1 Sujato để trống, Pāli đủ chữ nên viết đủ). Không có bản Việt hiện hành.
  Tiền lệ: đạo sĩ 207, dân chúng 59, hòa hợp 288, hộ trì 176. Cariyāpiṭaka → Hạnh Tạng và pāramī → Ba-la-mật: 0 tiền lệ trong kho, đặt theo thuật ngữ truyền thống của Đại Tạng Việt (mười Ba-la-mật, Chân thật Ba-la-mật). Ghi nhận: tiêu đề cp35 (lát khác) dùng Tập Ký Đời Sống cho cùng tạng — khác kho, biên tập đối chiếu sau.
  saccena không có sở hữu từ nên dịch bằng sự chân thật (sát hơn Sujato my truth); janamakāsahaṁ đọc là khiến dân chúng hòa hợp theo Sujato uniting the people.
