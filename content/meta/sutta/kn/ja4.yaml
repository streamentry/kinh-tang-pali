notes: |-
  9 khoá trong tệp Pāli đã ghim: bốn dòng tiêu đề `0.1`–`0.4`, bốn vế kệ `1.1`–`1.4`, và dòng chốt `2.1`. Bản dịch phủ đủ 9/9, dấu ngoặc kép cân (`“` mở ở `1.1`, `”ti.` đóng ở `1.4`).
  
  **Đối chiếu được tầng Anh.** Sujato dịch cả tám khoá đầu và im lặng ở `2.1` (`Cūḷaseṭṭhijātakaṁ catutthaṁ`) — dấu lược cuối bài luôn trống, không phải chỗ Sujato bỏ sót. Bốn vế kệ được đối chiếu từng vế với *Even with a little capital / the intelligent and clear-seeing man / uplifts himself, / like a tiny flame when fanned.* và khớp.
  
  **Thuật ngữ kế thừa, không phải đặt mới.** `Apaṇṇakavagga` → *Phẩm Bụi Dơ* là tiền lệ đã `published` từ `ja1` (`ja1` còn ghi rõ trong `notes` là đặt mới, 0 tiền lệ lúc đó); nay đã có 9 tệp dùng (*Bụi Dơ* ×9 trong `ja1`–`ja10`). Tôi dùng lại nguyên văn cụm đã có, **không** đề xuất sửa. Ghi lại ở đây vì cách dịch này vẫn còn đáng bàn: `apaṇṇaka` là "kẻ không ngu dốt", chứ không phải "bụi dơ".
  
  **`medhāvī` ở `1.1`** dịch thành *bậc trí khôn ngoan* — đây là một chút diễn giải (`medhāvī` chỉ là "có mang, sở hữu"), nhưng ngữ cảnh `pābhatena vicakkhaṇo` buộc phải có chủ ngữ, và cách dịch này không thêm ý gì. Không tính là lỗi.
  
  **Về tầng Việt**: `vietnamese-current` không có Tăng Bộ ở commit đã ghim (chỉ Pháp Cú), nên không có Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. `triangulation` chỉ dựa trên Pāli + Sujato.
