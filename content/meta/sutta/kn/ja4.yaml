notes: |-
  Apaṇṇakavagga là Phẩm Bụi Dơ theo 7 bài đã có. Tên bài giữ nguyên Pāli theo ja102,
  ja106. medhāvī có tiền lệ an3.67:13.5 bậc trí tuệ và an4.34:8.1 bậc trí; đếm cả
  tầng thì bậc trí nhiều hơn, tôi dùng bậc trí khôn ngoan để giữ chỗ cho vicakkhaṇo ở
  1.2. attānaṁ có tiền lệ chính mình 291 chỗ. vicakkhaṇo tôi dịch tinh tế sáng suốt;
  tinh tế 101 chỗ, sắc bén 44, nên tinh tế sáng suốt là cách ghép có tiền lệ.
  samuṭṭhāpeti không có tiền lệ; tôi dịch tự nâng cao chính mình. Bản Anh Sujato dịch
  uplifts himself, cũng theo nghĩa nâng lên, nên hai bên khớp. sandhaman không có
  tiền lệ, tôi dịch như quạt một ngọn lửa nhỏ; sandhaman là nghĩa quạt lửa, và aṇu là
  nhỏ. Bất định nhỏ: pābhatena ở 1.2 nghĩa là đã có sẵn, được phú bằng. Bản nháp tôi
  viết đã được như vậy, câu nặng; đã đổi thành đã có được.
  Bản Anh Sujato có đủ 9/9 khoá nhưng dịch lỏng: Even with a little capital, tức
  thêm chiếc ví không có trong Pāli; Pāli chỉ có appakenapi. Tôi theo Pāli, dịch Dù
  chỉ là ít. Đây là chỗ tôi cố ý lệch với bản Anh, và là lý do triangulation 8.9.
  Kỹ thuật: 9/9 khoá, không rỗng, thứ tự khớp Pāli, NFC, nháy kép mở 1.1 đóng 1.4 y
  hệt Pāli, không dấu lược. save_vi sạch và idempotent. Không chạy npm run
  validate|test|check|build nên technical_integrity 9.5.
