notes: |-
  **BÀI UID-GỘP — KHOÁ THẬT ĐÃ ĐO, KHÔNG GIẢ ĐỊNH.** Lát này cảnh báo bài học `sn12.83-92`: ở bài đó khoá mang uid TỪNG BÀI (`sn12.83:1.1`). Tôi đã mở thẳng tệp Pāli theo `path` trong `v6/v5.json` và đếm: cả 9 khoá của tệp đều mang CHÍNH uid gộp (`thag1.96:0.1` …), còn `sn48.83:1.1` **không tồn tại** trong nguồn. `all` của lát khớp 100% key của tệp Pāli. Tôi dùng `pre`/uid đúng như đọc được, không suy từ tên bài.

  **CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ KIỂM THỦ CÔNG.** `_hvi.kiểm` chỉ quét `cần` = khoá Pāli ≥ 40 ký tự. Khoá dài nhất cả lát chỉ **35** ký tự, nên `cần` = 0 ở CẢ 12 bài và vòng `for k in cần` — nơi có chốt NFC, chốt trùng nguyên văn Pāli, chốt Pāli lọt và chốt số dấu lược — **không chạy lần nào**. Tôi tự quét lại **108/108 khoá** bằng chính các hàm đó (`_tvd6_5_chk.py`): 0 lỗi — không khoá rỗng, không khoá trùng nguyên văn Pāli (trừ hai tiêu đề `:0.1` mà `excludeReferenceBlock: true` cố ý bỏ qua), mọi chuỗi NFC, số dấu lược khớp Pāli từng khoá, ngoặc kép cân trên cả bài, ngoặc tròn cân. `save_vi` chạy hai lần idempotent, tệp trên đĩa không đổi.

  **TAẦNG THAM KHẢO: ANH SUJATO CÓ, VÀ ĐỦ.** 9/9 khoá có key trong bản Anh đã ghim; khoá Sujato để trống nội dung là `:2.0` (`Tassuddānaṁ`) — đúng như mọi bài Tăng Bộ khác trên đĩa. Tôi chạy đúng hàm `englishCoverageFor` của kho (chỉ đọc): `substantiveSegments = 0`, `substantiveWithoutEnglish = 0`, `ratio = 1`, trên ngưỡng 0.8. Vì không khoá nào đủ 40 ký tự nên **không** cần mục trong `content/meta/reference-gaps.yaml`; tệp đó tôi không đụng tới.

  **KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho Tăng Bộ. Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế chỉ là **Pāli + English Sujato**, và tôi chấm thấp cho đúng lý do.

  **`Ekakanipāta` → *Bộ Một Bài Kinh*** (252 bài kn trên đĩa; 54 bài kn khác dùng *Phẩm Một Pháp*, và chỉ riêng `thag1.1:0.2` dùng *Tập Một* — tôi theo đa số, cùng cách `thag1.14`, `thag1.42`, `thag1.101`–`thag1.109`, `thag1.111`).

  **`:0.1` giữ tên Pāli kèm số** (`Theragāthā 1.96`) như `thag1.42:0.1` và `thag1.107:0.1`; đây là khối TIÊU ĐỀ nên không tính là trùng nguyên văn Pāli — `excludeReferenceBlock: true` trong `source/layers.yaml` cũng bỏ qua nó.

  **`:0.4` → *Kinh Kệ Của Trưởng Lão <X>***: `<X>theragāthā` có 25 tiền lệ theo đúng khuôn ấy.

  **DÒNG KẾT `:1.5` GIỮ NGUYÊN DẤU LƯỢC.** Pāli là `… <X> thero ….` với hai dấu lược; bản Việt giữ đúng hai (`… Trưởng lão <X> ….`), khớp 26 bài thag/thig đã có trên đĩa. Tôi KHÔNG mở rộng thành *Bạch Thế Tôn, Tôn giả … đã từng nói bài kệ này* như `thag1.42:1.4`, vì đó là thêm chữ không nguồn nào chứng thực (BRIEF §10.1). Suyato để trống đúng khoá kết này (8/9 khoá có Anh), nên khoá này dịch **từ Pāli một mình**.

  **BỐN VẾ KỆ — DỊCH TỪ PĀLI, ĐỐI CHIẾU TỪNG VẾ.** `Ekapupphaṁ cajitvāna` → *Sau khi đã dâng một cánh hoa* (`cajitvāna` = *đã cầm/lấy*; ở đây là hành động dâng, và Sujato dịch *I offered a single flower*; bản song song `ne37:89.1` — chưa dịch — có đúng mở đầu này). `asīti vassakoṭiyo` → *tám trăm triệu năm* (`asīti` = 80, `koṭi` = 10⁷, nên 80·10⁷ = 800 triệu; Sujato cũng đọc *800 million years*). `Saggesu paricāretvā` → *đã vui chơi giữa các cõi trời* (`saggesu` → *cõi trời*, 552 tiền lệ). `sesakenamhi nibbuto` → *với phần còn lại, tôi đã tịch diệt* (`nibbuto` = *đã tắm/tịch diệt*, 62 tiền lệ; Sujato *I've become quenched*).

  **BẤT ĐỊNH ĐÃ XỬ LÝ, KHÔNG CÒN.** Có ba cách đọc số lớn: *tám mươi triệu* (đọc `koṭi` theo hệ 10⁶ của bản in Nam Dương), *tám trăm triệu* (đọc `koṭi` theo Pāli 10⁷), và giữ chữ *koṭi* không dịch (2 tiền lệ: `snp3.10:29.3`–`29.4` *năm koṭi nahuta*, *mười hai trăm koṭi*). Tôi chọn *tám trăm triệu* vì `koṭi` trong Pālī là 10⁷ và Sujato — tầng tham khảo đã ghim — cũng đọc 800 million. Ghi ra đây để biên tập biết là có lựa chọn khác.

  **KỸ THUẬT.** Tôi KHÔNG chạy `npm run validate|test|build` — đợt này người điều phối cấm và chạy tập trung. Vì vậy `technical_integrity` chấm **9.6 chứ không phải 10.0**; đó là hạn chế thật của lượt đánh giá này chứ không phải lời khen. Tất cả những gì chạy được thì đã chạy: `save_vi` hai lần idempotent, chốt `kiểm` của `_hvi.py` xanh, kiểm thủ công 108/108 khoá xanh, YAML parse sạch bằng chính thư viện `yaml` của kho.
