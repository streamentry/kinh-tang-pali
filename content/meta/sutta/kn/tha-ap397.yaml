notes: |-
  Dịch trực tiếp từ Pāli root vì tầng tham khảo tiếng Anh (Sujato) không có tệp cho tha-ap397 tại commit đã ghim, không có bản Việt hiện hành cho uid này, và lớp lấp `english-project` không có entry. Chỉ Pāli làm chứng cứ, kèm tiền lệ của chính tầng tha-ap; các điểm dưới đây là chỗ Pāli cho phép hơn một cách hiểu hoặc chưa có tiền lệ trong tầng.
  Tên bài `:0.3`: Pāli `5 Padumakūṭāgāriyattheraapadāna` bắt đầu bằng số nên giữ số theo hình thức `N. ` (chính sách giữ số khi và chỉ khi Pāli bắt đầu bằng số); `translationTitle` bằng đúng giá trị `:0.3`, kể cả số thứ tự. Mở đầu tên: đo toàn tầng tha-ap đã dịch thấy Bài Kệ Tuyên Ngợ/Ngợi 254, Bài Kệ Tuyên Ngôn 136, Ký Sự 129 (Tuyên Ngợ là lỗi chính tả); ở phạm vi gần (tha-ap370–420) Ký Sự 22, Tuyên Ngợ/Ngợi 15, Tuyên Ngôn 1. Hai phạm vi cho đa số khác nhau; chọn Ký Sự vì đây là cách dịch đúng của apadāna, không mang lỗi chính tả, và ba bài liền kề cùng phẩm (tha-ap395, tha-ap396, tha-ap399) dùng đúng dạng này. Cần biên tập phán một lượt cho cả cuốn. Tên phẩm `Phẩm Pilindavaccha` theo tha-ap395, 396, 399. Tên riêng Padumakūṭāgāriya giữ dạng Pāli, theo tiền lệ tầng giữ dạng Pāli cho các tên ghép kiểu -dāyaka/-kūṭāgāriya.
  Số đếm tự tính từng chữ, không chép từ bản khác: `sattāhaṁ` = bảy ngày (14.1); `sattarattindivaṁ` = bảy đêm ngày (7.3); `asītiyā sahassehi` = 80 × 1000 = tám mươi ngàn (11.1); `catuddasāni kappāni` = catu 4 + dasa 10 = mười bốn kiếp (16.1); `catubbīse kappasate` = 24 × 100 = hai ngàn bốn trăm kiếp (17.3); `aṭṭhārase kappasate` = 18 × 100 = một ngàn tám trăm kiếp (26.1, 30.1; tiền lệ tầng 11 khoá "Vào một ngàn tám trăm kiếp trước"); `satapattaṁ` = trăm cánh (6.2); `pañca nīvaraṇe` = năm triền cái (19.4); `paṭisambhidā catasso` = bốn vô ngại giải (33.1); `pañcamaṁ` = thứ năm (35.1). Bài không có cụm `tiṁsa` hay `Tiṁsakappasahassa` nên không phải phân xử cụm này.
  Bất định: (1) 16.3 `kūṭāgāraṁ mahantassa`: `mahantassa` là sở hữu cách nên dịch của bậc vĩ đại (tiền lệ tha-ap295:2.3 `mahantassa` chỉ người); cũng có thể hiểu là ngôi nhà to lớn, Pāli không phân xử được, và về mặt thể kệ `mahantaṁ` sẽ thiếu một âm tiết nên không giải thích được bằng chuyển cách. (2) 25.3–25.4 `rittakā te atikkantā, pamuttā lokanāyakā` là cặp dòng khó nhất bài: `te` và `rittakā` là giống đực số nhiều, không khớp giống với `kappakoṭī`; `pamuttā` có thể là đã được giải thoát, đã rời đi, hoặc vắng khỏi. Dịch sát chữ, dùng đại từ trung tính chúng, không quyết `te` là các kiếp hay các bậc Dẫn Đạo, không thêm nghĩa; người biên tập cần phán. (3) 27.2 `anomaṁ nāma cakkhumaṁ` dịch bậc có mắt với danh hiệu vô song, theo `anomanāma` ở snp1.9:27.1 (bậc có danh hiệu vô song); cách hiểu còn lại là tên riêng Anoma, không chọn vì đoạn 29.2 xác định vị Phật này là Gotama. (4) 17.4 `vokiṇṇaṁ saṁsarissati` dịch sẽ luân hồi xen kẽ (`vokiṇṇa` là xen lẫn, bị gián đoạn, đối với `abbokiṇṇa` là liên tục ở tha-ap40:3.2); tầng có 2 khoá (tha-ap40:3.4, tha-ap70:5.4) dịch có thể đếm, không theo vì cùng tầng dịch `abbokiṇṇaṁ` thành không thể đếm, cho thấy đọc `vokiṇṇa` là đếm; không nêu xen kẽ giữa cõi nào vì Pāli không nói. (5) 17.1, 18.2, 20.4, 21.4 `dhārayissati`, `dhārente`: coi là bị động/vô chủ ngữ (được nâng giữ), theo `dharīyati` ở 23.4 (tiền lệ tha-ap408:8.4 được duy trì) và `dhārayissati` ở tha-ap11:6.4 (nâng giữ); cũng có thể hiểu chủ ngữ là người dâng hoa hoặc chư thiên. (6) 17.3 `catubbīse kappasate` là cách chỉ thời gian trong tương lai đi với `saṁsarissati` (một quãng, không phải một mốc), nên dịch Trong hai ngàn bốn trăm kiếp nữa chứ không dịch Sau … kiếp nữa như ở lời thọ ký đi với `bhavissati`; nếu người biên tập muốn dạng Sau thì đổi chỉ khoá này. (7) 22.2 `paccayaṁ sayanāsanaṁ` dịch vật dụng, chỗ nằm chỗ ngồi (tiền lệ iti107:4.2 vật dụng); có thể `paccaya` ở đây là thuốc men (tứ vật dụng), Pāli không nói rõ. (8) 24.2 `cetanā me na vijjati` dịch tôi không có ý định nào; `cetanā` có thể là tư/ý muốn tác ý, không có tiền lệ cùng ngữ cảnh. (9) 24.4 `labhāmi pariniṭṭhitaṁ` dịch nhận được những thứ đã được hoàn tất sẵn; tân ngữ không nêu, chỉ hiểu là y và đồ ăn của 24.1. (10) 23.1 `kūṭāgārena caratā` dịch cùng với ngôi nhà nóc nhọn đang di chuyển (cách công cụ, phân từ hiện tại), không thêm đi theo. (11) 11.1–11.4 chủ ngữ `parivārito` là vị thị giả Sudassana, còn `āsīnaṁ` (đang ngồi) đi với Đức Phật; vì tiếng Việt không thể để tính từ đứng trước danh từ ở khoá kế, 11.3 dùng đại từ Ngài để chỉ Đức Phật Piyadassī của 10.4; `vanante` dịch nơi bìa rừng. (12) 3.3 `pasadaṁ` dịch con nai đốm theo tiền lệ tha-ap408:1.3; 3.1 `migaluddo` dịch người thợ săn thú theo tha-ap81 và tha-ap98 (cách đọc tên riêng Migaluddo ở tha-ap175 không chọn vì có `pure āsiṁ`). (13) 5.3 `jātassaraṁ` dịch hồ nước tự nhiên theo tha-ap245:1.1; khoá tha-ap343:2.3 dịch bảo bảo sinh cùng mình không theo vì không có nghĩa. (14) 19.3 `manasā vinivaṭṭetvā` dịch dùng tâm quay lưng với (năm triền cái ở 19.4); `vinivaṭṭeti` là quay đi, tránh xa. (15) 13.2 `saharakkhase` dịch cùng với các la-sát; 13.4 `gāthā` số nhiều dịch những bài kệ. (16) 10.1 `upaṭṭhāko` dịch vị thị giả (tiền lệ tha-ap12:11.4); 4.4 `sataraṁsi` dịch mặt trời trăm tia sáng (tiền lệ tha-ap87:2.2, tha-ap112:1.2).
  Đại từ: người kể là vị trưởng lão nói tôi (cùng vagga tha-ap395, tha-ap396 dùng tôi; tầng cho ta 124 so với tôi 28 ở khoá 29.4, nhưng đo gần nhất nghiêng về tôi); lời Đức Phật ở 14–22 dùng Ta. Nháy: kép mở ở 1.1 và đóng ở 33.3; nháy đơn mở ở 14.1 và đóng ở 22.4, khớp Pāli từng khoá.
  Công thức kết `Itthaṁ sudaṁ … abhāsitthāti` (34.1) dịch theo nhóm đa số (những bài kệ này, 407 khoá) thay vì nhóm số ít (bài kệ này, 21 khoá). Hai khoá `…pe…` (32.2, 33.2) giữ đúng một `…`; Pāli không có `(…)` ở khoá nào. 22.4 dùng dạng sẽ nhập Niết-bàn, không còn lậu hoặc (4 khoá; cùng với tha-ap396:10.4), thay vì dạng sẽ vô lậu mà đi vào Niết-bàn (8 khoá), vì sát Pāli hơn và cùng phẩm.
  Đã dò tiền lệ cho 55 khoá có Pāli trùng nguyên văn với tầng tha-ap: 29 khoá dùng lại nguyên văn bản Việt đa số, 26 khoá khác (ta/tôi, chữ hoa, hoặc bản cũ lệch Pāli như tha-ap312 ưa nhìn thấy cho `piyadassī`, nên không theo). Trong chính bài có 5 nhóm Pāli trùng nguyên văn (2.2/7.2/9.2; 14.4/15.4; 18.1/21.3; 26.1/30.1; 32.2/33.2), cả 5 nhóm Việt giống nhau; bản nháp đầu lệch ở 18.1/21.3 và đã sửa. Đã kiểm 135/135 khoá khớp tập khoá và thứ tự Pāli, nháy đơn ‘ ’ và nháy kép “ ” khớp Pāli từng khoá (0 lệch), NFC, không khoảng trắng thừa, không Pāli lọt sang bản Việt ngoài tên riêng (Piyadassī, Padumakūṭāgāriya, Therāpadāna) và từ koṭi. Phép đo số Pāli tự động trong đợt này chỉ quét tầng đã nằm trong cây chính nên không đo được bài này (0 tệp); số được tính tay như trên.
