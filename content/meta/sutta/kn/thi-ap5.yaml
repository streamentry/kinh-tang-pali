notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ `tha-ap`/`thi-ap`.
  Đây là bài đầu tiên trong lát thuộc `thi-ap` nên phải tự tra tiền lệ cho 0.1: đo được
  `Therīapadāna` 5/5 tệp `thi-ap` đã có (thi-ap2, 3, 4, 12, 13) đều giữ nguyên Pāli, không
  tệp nào dịch ra tiếng Việt ⇒ giữ Pāli. Đối chiếu ngược với `tha-ap` thì `Therāpadāna`
  là 291/300, cùng khuôn, nên không tạo cách mới cho bên tỳ-kheo-ní.
  0.2 `Sumedhāvagga` → Phẩm Sumedhā (3/3; thi-ap2, 3, 4). 0.3 và 11.1 → Bài Kệ Tuyên Ngợ
  Về Trưởng Lão Ni X, thứ N., có chữ Ni theo đúng tiền lệ `…theriyāpadānaṁ` (thi-ap2, 3,
  4, 12, 13); 0.3 trong thi-ap chưa bài nào có số thứ tự nên không thêm số. Pāli 0.3 không
  có số, số thứ năm chỉ ở 11.1 theo `pañcamaṁ`.
  Tiền lệ đếm được: 28/40 khoá có Pāli trùng nguyên văn trong tầng.
  Công thức dùng lại nguyên văn: `Candabhāgānadītīre` → Bên bờ sông Candabhāgā (10 cặp,
  cùng dạng với tha-ap169/268); `ahosiṁ kinnarī tadā` → lúc ấy tôi là một nàng tiên nữ
  kinnara (thi-ap12:1.2); `Addasaṁ virajaṁ buddhaṁ` → Tôi đã trông thấy Đức Phật ly
  trần; `sayambhuṁ aparājitaṁ` → bậc Tự Tại không ai đánh bại (tha-ap242);
  `Pasannacittā sumanā` → Với tâm thanh tịnh, hoan hỷ (thi-ap13:2.3);
  `sayambhuṁ abhipūjayiṁ` → rồi dâng lên Đấng Tự Tại (tha-ap479);
  `Tena kammena sukatena` → Nhờ nghiệp lành khéo làm ấy;
  `cetanāpaṇidhīhi ca` → cùng với tâm nguyện và chí hướng;
  `Kilesā jhāpitā mayhaṁ` → Các phiền não của tôi đã bị thiêu rụi (90 cặp);
  `bhavā sabbe samūhatā` → mọi cõi hữu đều đã được nhổ sạch (5 cặp, đúng câu này);
  `Sabbāsavā parikkhīṇā` → Tất cả các lậu hoặc đã cạn kiệt (tha-ap454);
  `natthi dāni punabbhavo` → nay không còn tái sanh nữa (tha-ap454);
  `Catunnavutito kappe` → Vào chín mươi tư kiếp trước đây;
  `yaṁ pupphamabhipūjayiṁ` → khi tôi dâng cúng hoa ấy (39 cặp, dạng này chiếm 10);
  `Duggatiṁ nābhijānāmi` → Tôi không còn biết đến đọa xứ nào;
  `pupphapūjāyidaṁ phalaṁ` → đó là quả báo của việc cúng dường hoa (8 cặp);
  `viharāmi anāsavā` → tôi sống đời thanh tịnh không còn lậu hoặc (thi-ap2/3/4/12/13);
  `Svāgataṁ vata me āsi` → Thật là sự đón tiếp tốt lành cho tôi (tha-ap376 và 9 bài
  cùng dạng); `pabbajiṁ anagāriyaṁ` → rồi xuất gia sống đời không nhà.
  10.1 khác công thức chuẩn ở chỗ Pāli không có `āyasmā` và dùng `therī`; dùng tiền lệ
  `vị trưởng lão nữ …` của thig1.14 (Sumanā) thay vì Tôn giả Trưởng lão của tha-ap.
  Ghi nhận bất định: (a) 3.4 `agacchiṁ tidasaṅgatiṁ` không có tiền lệ trong tầng;
  `tidasaṅgati` là ba cõi (cõi dục, cõi tàm, cõi thiện) theo nghĩa chữ, dịch cảnh giới
  ba cõi. (b) 4.5 `Saṁvejetvāna me cittaṁ` không có tiền lệ; `saṁvejitvāna` là khiêm
  nhường để lỡa chỗ, dịch khiêm nhường đi tâm mình, không thêm chữ buông xả vì Pāli
  không nói buông. (c) 4.1 `Chattiṁsadevarājūnaṁ` không có tiền lệ cho cụm này; `chattiṁsa`
  là sáu mươi, `devarāja` là vua chúa trời, dịch sáu mươi vị trời và các vua chúa. (d) 2.3
  `Naḷamālaṁ` không có tiền lệ; dịch theo nghĩa chùm hoa sen thay vì giữ chữ Pāli, vì
  đây là danh từ chỉ đường vật chứ không phải tên riêng như `Naḷamālikā` ở 10.1.
  Tên `Naḷamālikā` chứng thực trong chính Pāli bài này ở 10.1, nên giữ dạng Pāli ở 0.3
  và 11.1. `…pe…` ở 7.2, 8.2, 9.2 giữ đúng một dấu lược; nháy kép mở ở 1.1, đóng ở 9.3.
