  Dịch từ Pāli root đã ghim. Tầng Anh CÓ và đã đo, không suy từ tên thư mục: source/upstream-manifest.json liệt kê sutta/kn/thag/thag8.1_translation-en-sujato.json, tệp này có 38/39 khoá có chữ (im lặng đúng một khoá, là dòng ghi tên tác giả 8.7). Thư mục thag của bản Anh đã ghim có 264 tệp, không phải 83.
    Coverage theo source/layers.yaml (ngưỡng 0.8, đo trên Pāli ≥40 ký tự, bỏ khối tham chiếu :0.x): Pāli có nội dung của bài này = 0 khoá, mẫu số bằng 0 nên cổng coverage không chặn — cùng tình trạng với 217 tệp thag đang published. Không cần entry trong content/meta/reference-gaps.yaml.
    0.1 giữ Pāli `Theragāthā 8.1`: 200/223 tệp thag viết đúng dạng `Theragāthā X.Y` (12 tệp bỏ số, 9 tệp dùng Trưởng Lão Kệ, 2 tệp ghi nhầm Therīgāthā).
    0.2 `Aṭṭhakanipāta` → Bộ Tám Bài Kinh, theo thag8.2:0.2 (cùng nipāta, đã published). Ghi rõ xung đột: ja424:0.2 dùng Bộ Tám Bài Kệ (1 lần); bảng chốt ở BRIEF_VI3 mục 11 dùng khuôn Bộ N Bài Kinh, nên theo thag8.2 cho nhất quán trong nipāta.
    0.3 `Paṭhamavagga` → Phẩm Thứ Nhất: 91 lần trùng nguyên văn trong tầng đã dịch, đa số tuyệt đối. 0.4 theo khuôn thag8.2:0.4 (Kinh Kệ Của Trưởng Lão <tên>).
    PĀLI THẮNG Ở BA CHỖ, đều ghi lại vì Sujato và tiền lệ đều không giúp được. (1) `Parivajjeyya janaṁ na uyyame` (1.2): uyyame đọc theo √yā = mua/sở hữu, nên dịch đừng tìm tấm tìm tắm, theo Sujato don't try to acquire things; cách đọc cạnh tranh là uyya- = siêng nỗi, không đổi được nghĩa chính. (2) `Paṅkoti hi naṁ avedayuṁ` (2.1): đọc như Sujato — đó chỉ là bãi lầy; không dùng nghĩa bãi tinh dầu thơm. (3) `Sukhumaṁ sallaṁ durubbahaṁ` (2.3): salla là lưỡi tên/lưỡi gai, durubbaha là khó gỡ ra — dịch lưỡi tên mảnh mai, khó gỡ ra.
    XUNG ĐỘT VỚI BẢN ĐÃ CÓ, CỐ Ý KHÁC. 2.3 TRÙNG NGUYÊN VĂN thag2.2:2.3 nhưng bản Việt ở đó là bụi mịn, thức ăn khó tiêu — sai, vì salla không phải thức ăn và durubbaha không phải khó tiêu; Sujato đọc đúng (Honor is a subtle dart, hard to extract). Không dùng lại nguyên văn bản sai; không sửa thag2.2 vì ngoài lát này. Người điều phối nên xem lại thag2.2:2.1 và 2.3 (2.1 Pāli là avedayuṁ nhưng bản Việt ghi Dầu thơm chắc chắn sẽ thanh lọc nó — cũng sai; thêm nữa 0.3 và 0.4 của thag2.2 bị đảo chỗ).
    Bài 5.1–5.4 TRÙNG NGUYÊN VĂN Pháp Cú dhp6:1–4 nên dùng lại y nguyên (4 cặp). Nhưng cùng Pāli đó còn xuất hiện ở thag4.3:1.1–1.4 với bản Việt khác hẳn; chọn dhp6 vì dhp6 đọc yamāmase đúng (tự chế, từ āman), còn thag4.3:1.2 dịch thành chúng ta ở đây đang bị tiêu hoại — sai. Ghi rõ để người điều phối quyết định có sửa thag4.3 hay không.
    Bài 3.4 `kammabandhū hi mātiyā` → nghiệp chính là họ hàng của họ; dùng kamma = nghiệp theo tầng đã dịch (ví dụ nghiệp quá khứ), mātiyā giữ là bọn họ hàng. 7.3 `dhīro` → bậc kiên định (0 tiền lệ đúng cụm dhīro; 17 lần có kiên nhẫn nhưng ở thực hành kiên nhẫn, khác nghĩa ở đây). 8.6 matasāyika → nằm chết như người đã chết, theo Sujato lie as still as a corpse.
    8.7 có HAI dấu lược, đếm được bằng lược() của _hvi.py, giữ đúng hai theo mẫu thag8.2:8.5.
    Tầng vietnamese-current vắng (commit đã ghim chỉ có 26 tệp Pháp Cú) và không có lớp lấp english-project cho bài này; cả hai không làm mất tầng tham khảo vì Sujato đã phủ mọi khoá kệ.
    Cổng kỹ thuật (npm run validate, npm test, npm run check, npm run build vì có bài published) do coordinator chạy, không chạy trong lát agent; technical_integrity đặt 9.6 vì lý do đó. 8/8 khoá đã kiểm: không lệch, NFC sạch, đủ khoá, ngoặc kép cân.
