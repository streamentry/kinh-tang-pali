  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 148 khoá chênh lệch lớn nhất → khác nghĩa 15 nhóm: sửa 2, giữ 8, bất định 5; rà đối kháng toàn bài sửa thêm 2 ngoài danh sách. Phần lớn chênh lệch còn lại do bản mù chia vế khác dòng hoặc xưng hô tôi/ta. Không có bản Anh hay bản Việt độc lập khác.
  - Sửa `23.2` `so tvaṁ gacchasi pammukho`: "vậy mà ngươi quay mặt bỏ đi" → "vậy mà ngươi cứ đi thẳng về phía trước". `pammukha` là `pa-mukha` (hướng mặt về trước), không phải `parammukha` (ngoảnh mặt đi); người nói vừa bảo `tiṭṭha` mà người kia vẫn tiến tới, và ở `24.1` người ấy còn đứng thưa chuyện.
  - Sửa `10.4` `suññamakāsi raṭṭhaṁ`: "thành trống rỗng" (dễ đọc `thành` là "thành phố") → "trở nên trống rỗng".
  - Sửa thêm (rà toàn bài): `55.3` `niddhūmake pacitaṁ sādhupakkaṁ`: mệnh lệnh "hãy nướng chín kỹ trên lửa không khói" → "thứ nấu trên lửa không khói thì chín kỹ, chín tới" (hai quá khứ phân từ, không có động từ mệnh lệnh; Porisāda nói có thể chờ giàn lửa bớt khói). `89.1` `chiddaṁ te raṭṭhaṁ byathitā bhayā hi`: `byathitā` là số nhiều chủ cách chỉ người, đi với `puthū narā` ở `89.2`, không đi với `raṭṭhaṁ` (trung tính số ít); bản cũ gán "run rẩy" cho xứ sở, nay "xứ sở của ngài đã rách nát; vì sợ hãi mà run rẩy, / nhiều người đã chui vào nơi trú ẩn".
  - Giữ: `8.1`–`8.2` `khāditvā` (bản mù lấy "mọi loài cá" làm tân ngữ; `macchānaṁ` là sở hữu cách số nhiều, giữ "Ānanda của tất cả loài cá"); `13.2` `sotthiye` ("dòng họ có học vấn" theo `cp24:1.4`, bản mù thêm "bà-la-môn"); `15.3`, `34.3`–`34.4`, `45.3`–`45.4`, `114.3`–`114.4`, `116.3`–`116.4` (bản mù chia vế khác dòng, nghĩa như nhau); `58.2` `purisamattahetu` (= `purisaṁ attahetu`, bản mù "chỉ vì một người" sai); `59.1` `pañca pañcanakhā` (năm loài năm móng).
  - Bất định (chưa phân xử, không đổi giáo nghĩa): `99.3` `datvā varaṁ khippamavākarohi` (giữ dạng cấm "chớ vội rút lại", Pāli không có `mā`; bản mù "hãy mau [thực hiện]"); `113.2` `migājinūpetapuraṁ` (tên riêng Migājina theo `ja516:1.4` hay "có da nai"); `11.3`–`11.4` `jambupesi`; `91.3`–`91.4` `attāva seyyo paramā ca seyyo`, `ocitatthena`; `111.2` `saṅge`. Người nói ở `28`–`29` chưa xác định nên cặp xưng hô "ngài/ngươi" chưa thống nhất hẳn với `32`–`33`.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt cả 514 khoá, đoạn song song ja513, ja386, ja190, ja424, ja447, ja512, sn1.31, sn2.21, sn3.3, dhp151, an4.47, an4.48, sn21.7, snp2.8; không có bản Việt nguyên bài): sửa 8 khoá —
  23.3 `aṭṭhito tvaṁ ṭhitomhīti`: "chưa vững … đã đứng vững" → "chưa đứng lại … đã đứng lại" (sai nghĩa nhẹ: `ṭhita` ở đây đáp lại lệnh `tiṭṭhāhi` ở 23.1, người kia vẫn đi mà nói mình đã đứng; nghĩa "đứng vững" thuộc lời đáp chơi chữ ở 24.1, giữ nguyên ở đó);
  101.1 `yasmā hi dhammaṁ puriso vijaññā`: "Người ta nhờ ai mà hiểu…" đọc thành câu hỏi → "Vị nào giúp một người hiểu được Chánh pháp" (mệnh đề quan hệ, như cấu trúc `yasmā … taṁ` ở 101.3);
  121.1–121.4 đảo trật tự "Không phải vua kẻ…" (calque, khó đọc) → "Kẻ … thì không phải là vua", song song với 122.1–122.2; 19.4 `santike` "khi ở bên cạnh" → "so với"; 117.4 thêm "sẽ" (nối `kāhāmi` tương lai).
  Giữ: các chỗ khác tiền lệ đã ghi ở lượt trước (43.3–43.4, 101.1–101.2 khác snp2.8/ja452, 120.1/120.3 khác an4.47). Bất định giữ nguyên, quan trọng nhất là 99.3 `datvā varaṁ khippamavākarohi`: bản Việt hiện thêm phủ định "chớ" mà Pāli không có, vẫn cần người biên tập phán (đã ghi); thêm 47.2 `santoti maṁ sappurisā`: `santo` có thể là chủ cách số nhiều đồng vị với `sappurisā` ("các bậc hiền thiện, chân nhân thân cận tôi") thay vì nội dung của `iti`; 33.2/60.2/64.2 `kāmakāmī` ("thỏa lòng mong muốn") nghĩa đen là "kẻ ham dục lạc", giữ vì nhất quán ba chỗ.

