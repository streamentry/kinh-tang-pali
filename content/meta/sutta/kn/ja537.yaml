    2. Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá: 0/514 lệch (Pāli bài này không có nháy đơn; Việt không thêm nháy đơn).
    3. Pāli trùng nguyên văn trong chính bài: 64 nhóm, 118 cặp; Việt khác ở 1 cặp có lý do (`1.2`/`3.2`). Pāli trùng với bài khác: 81 khoá, 247 cặp (46 khoá dùng nguyên văn tiền lệ; 108 cặp giống hệt, 139 cặp khác, lý do ở trên).
    4. Dấu lược `…pe…`, `…` trần và `(…)`: Pāli 0/514 khoá, Việt 0/514 (phép chạy rỗng, không đo được gì).
    5. Số Pāli: xem trên; không có cụm chưa phân xử được.
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng và tên vật giữ phiên âm (`Jātaka`, `Mahāsutasoma`, `Kāḷahatthi`, `Kāḷa`, `Rasaka`, `Ānanda`, `Sujāta`, `Sutasoma`, `Dhataraṭṭha`, `Kāsi`, `Kammāsapāda`, `Migājina`, `Haṁsavara`, `Sakuṇāla`, `Inda`, `Meru`, `jambu`, `kusa`). Đã in cặp Pāli↔Việt ra đọc toàn bài (514 cặp) và sửa sau lượt đọc: `2.3`–`2.4` bỏ "vì" thừa đầu câu; `13.1` đổi "chàng" thành "con" cho khớp `13.3`; `30.3` đồng nhất "bậc hiền thiện"; `101.2` tách đúng hai nhóm người; `112.1` bỏ phiên âm `kumbhathūṇa`; xưng hô của Sutasoma với Porisāda đồng nhất "ngài" ở `56`–`59`, `80`–`81`, `96`; `122.3` dùng lại `snp1.3:40.1`; `5.6`, `12.4`, `20.4` dùng lại tiền lệ.
