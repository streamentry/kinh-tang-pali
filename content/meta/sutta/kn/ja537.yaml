  Nghiên cứu nguồn ngoài 2026-10-16: H.T. Francis (dịch), The Jātaka vol. V (PTS 1905, phạm vi công cộng; đọc qua static.sirimangalo.org/old/jataka/5.htm, Jātaka 537 tr. 246–273); đã đối chiếu toàn bài (các kệ 1–124 và các lời đối đáp giữa Sutasoma, Porisāda, bốn bài kệ trăm đồng, bốn điều ước, lời cho các vua, lời nhắc cuối); sửa 99.3 (`datvā varaṁ khippamavākarohi`: bản cũ 'đã ban điều ước thì chớ vội rút lại', thêm phủ định mà Pāli không có; Francis dịch 'perfect thy work and see it done right soon' và chú thích 273:1 ghi `avākarohi` ở đây và ở Jāt. VI 280 'must mean pay, fulfil'; cùng chữ ở ja546:91.4, 95.4 bản dịch đã dùng 'trao lại', nên đã đổi 'hãy mau thực hiện', khớp mạch 98–99 là Bodhisatta giục Porisāda giữ lời ban điều ước). Giữ 81.2, 82.2, 98.2 `avākareyya` 'rút lại' (Francis chú thích 'seems to mean not to pay', bất định). Chỗ khác: 113.2 `migājinūpetapuraṁ` Francis đọc 'Migācira… park and city', bất định như ghi trước; 109–113, 114–120, 121–124 khớp Francis.
