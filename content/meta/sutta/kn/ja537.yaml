notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja537_root-pli-ms.json` (514/514 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ: bốn dòng tiêu đề `0.1`–`0.4`, 124 bài kệ (`1`–`124`; 119 bài bốn dòng, các bài `54`, `61`, `64` năm dòng, các bài `5`, `23` sáu dòng), dòng kết bài `125.1`, dòng kết bộ `126.1`, dòng `127.1` mở bài kệ tóm lược và bốn dòng `128.1`–`128.4`. Phần văn xuôi khung truyện không nằm trong tầng Pāli đã ghim, nên người nói, người nghe và mạch kể được suy từ xưng hô, nháy và nội dung chính các bài kệ. Mạch chính (suy từ kệ): `1`–`22` đại thần Kāḷahatthi hỏi người đầu bếp Rasaka rồi đem Rasaka đến trước nhà vua mê vị thịt người, khuyên vua bằng chuyện con cá Ānanda và chuyện chàng Sujāta, vua đáp bằng cùng một cách (vị ngon và dục); `23`–`29` cuộc gặp giữa một bà-la-môn có bốn bài kệ và một vị vua; `30`–`39` Sutasoma, bị kẻ ăn thịt người (Porisāda, Kammāsapāda) bắt, thề sẽ trở lại sau khi giữ lời hứa với bà-la-môn; `40`–`50` Sutasoma nghe bốn bài kệ rồi từ chối mọi lời giữ chân; `51`–`54` ông về chỗ kẻ ăn thịt người; `55`–`78` đối đáp về chân thật và Chánh pháp, Sutasoma nói lại bốn bài kệ cho Porisāda; `79`–`104` bốn điều ước và tình bạn; `105`–`113` các vị vua bị giam được thả; `114`–`124` lời Porisāda và các bài kệ kết về hiền thiện, Chánh pháp.
  - Tầng tham khảo:
    Tầng English của Sujato không có ja537 (ja chỉ có 83 tệp: ja1–79, ja126, ja159, ja466, ja534; ja534 là một Jātaka khác); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng (đặc biệt `ja513`, bài Porisāda khác có cùng nhiều dòng kệ; `ja506`, `ja522`, `ja483`, `ja470` ở từng dòng trùng; `an4.47`, `an4.48`, `sn21.7`, `sn7.22`, `sn1.31`, `sn3.3`, `dhp151` ở các kệ trùng) và bối cảnh của chính bài. Tiền lệ Việt trong tầng do cùng một nhóm dịch, nên không phải đối chiếu độc lập; tôi không dùng bản tóm lược hay bản dịch ngoài tầng đã ghim làm câu chữ hay đối chiếu. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
  - Coverage English:
    Mẫu số = 0: trong 514 khoá, không khoá nào có Pāli từ 40 ký tự trở lên theo `source/layers.yaml` (dòng dài nhất 38 ký tự, toàn vế kệ ngắn), nên cổng coverage không đo được gì ở bài này. Điều đó không có nghĩa là không cần ghi nhận gap; entry `reference-gaps.yaml` cũng không cứu được `published`. Sujato phủ 0/514 khoá, `english-project` 0/514, `vietnamese-current` 0/514.
  - Phân loại & tiêu đề:
    + `0.1` "Jātaka"; `0.2` "Bộ Tám Mươi Bài Kinh" (Asītinipāta, asīti = 80; dùng đúng khuôn `ja535:0.2`, `ja530:68.1`); `0.3` "Phẩm Thiên Nga Nhỏ" (dùng lại nguyên văn `ja533:0.3`, `ja534:0.3`, `ja535:0.3`); `0.4` "5. Kinh Mahāsutasoma" (giữ phiên âm như `ja528:0.4` "Kinh Mahābodhi", `ja95:0.4` "Kinh Mahāsudassana"); `125.1` "Kinh Mahāsutasoma, thứ năm." theo khuôn "Kinh <Tên>, thứ n" (`ja525:52.1`, `ja410:10.1`), `pañcamaṁ` = thứ năm khớp "5." ở `0.4`; `126.1` "Bộ Tám Mươi Bài Kinh đã hoàn tất." (`ja530:68.1`, `ja532:94.1`); `127.1` "Tóm lược:" (`ja525:54.1`, `ja528:62.1`, nhiều khoá khác).
    + `128.1`–`128.4` (bài kệ tóm lược Bộ Tám Mươi, tên các Jātaka 533–537): giữ tên theo phiên âm như `ja525:55.1`–`55.4`, `ja520:42.1`–`42.4`; `Sumukho`, `haṁsavaro`, `mahā`, `Sudhabhojaniko`, `Sakuṇāla`, `Sutasoma` giữ nguyên; `paro pavaro` → "bài khác ưu việt" và `dijādhipativhayano` → "mang danh chúa tể loài chim" là cách đọc, không phân xử được vì không có bản đối chiếu; `Sakuṇāla` không rõ có phải tên Kuṇāla (`ja536`) hay không.
  - Người nói (Pāli không ghi tên; suy từ xưng hô và nháy, không thêm vào thân kinh):
    + `1`, `3`, `5`–`6`, `8`–`10`, `13`, `16`–`17`, `21`–`22` Kāḷahatthi (Kāḷa) hoặc người cha trong chuyện lồng; `2`, `4` Rasaka; `7`, `11`–`12`, `14`–`15`, `18`–`20` vua Brahmadatta mê thịt người (chưa có tên trong tầng, nên không nêu tên trong bản Việt); `23`–`25` người có quyền (không rõ là vua hay người gác) với một bà-la-môn; `26`–`27` cuộc hỏi đáp quê quán và bốn bài kệ; `28`–`29` người hỏi Sutasoma vì sao ưu phiền (suy là Porisāda); `30`–`31`, `34`–`37`, `39`, `52`, `54`, `61`, `63`, `65`–`72` Sutasoma; `32`–`33`, `38`, `55`, `58`, `60`, `62`, `64`, `73`–`74` Porisāda; `40` lời kể; `41`–`44` bà-la-môn; `45`, `47`–`50` Sutasoma; `46` bà-la-môn; `51` các cận thần (suy); `53` lời kể; `56`–`57`, `59` Sutasoma; `75`–`78` Sutasoma nhắc lại bốn bài kệ cho Porisāda; `79`, `82`, `84`, `86`, `88`, `90`, `92`, `95`, `97`, `102`–`103` Porisāda; `80`–`81`, `83`, `85`, `87`, `89`, `91`, `93`–`94`, `96`, `98`–`101`, `104` Sutasoma; `105`, `107` Sutasoma nói với các vị vua; `106`, `108` các vị vua; `109`–`113` người hỏi vì sao bỏ lạc thú để ở rừng một mình (suy là Sutasoma); `114`–`120` Porisāda; `121`–`124` bài kệ kết.
    + Xưng hô: Sutasoma nói "tôi/ngài" với Porisāda và bà-la-môn (theo `ja506:16.4`, `ja506:17.4`); Porisāda nói "ta/ngươi" khi còn thù địch (`32`–`33`, `60`, `62`, `64`) rồi "ta/bạn" từ `79` trở đi (`samma` → "này bạn"/"bạn": trong 33 khoá `ja` từ ja400 trở đi có `samma`, phần lớn dịch "này bạn", như `ja475:1.3`, `ja495:2.3`, `ja503:8.1`); các câu nháy mở ở `23.1`, `91.1` không có nháy đơn trong Pāli nên lời dẫn gián tiếp không đặt trong nháy đơn.
  - Pāli trùng nguyên văn:
    Dò Pāli của 514 khoá với toàn bộ Pāli đã ghim (mọi bộ) có bản Việt, loại các khoá dưới 12 ký tự chuẩn hoá: 81 khoá có dạng trùng ở bài khác, tổng 247 cặp; trong đó 46 khoá dùng lại nguyên văn bản Việt có sẵn (`0.3`, `5.1`–`5.2`, `17.1`, `22.1`, `26.3`, `28.2`, `29.2`, `35.1`–`36.4`, `38.4`, `40.1`, `42.1`–`43.2`, `44.1`–`44.3`, `50.2`, `52.3`, `58.3`, `71.2`, `72.2`, `73.3`–`73.4`, `76.1`–`77.2`, `78.1`–`78.3`, `79.1`, `91.3`, `124.1`) và 35 khoá khác. Phép đo theo cặp: giống hệt (bỏ dấu câu) ở 108 cặp, khác ở 139 cặp.
    Cặp mà bản Việt khác có lý do: `5.4`, `5.6`, `31.4`, `37.4`, `39.4`, `50.4` (tiền lệ dùng "ta" và nói với người khác; ở đây Sutasoma xưng "tôi" với Porisāda theo `ja506:16.4`); `33.2`, `60.2`, `64.2` (`ja513:8.2` là lời kể ngôi thứ ba "vị ấy trở về", ở đây là lời Porisāda nói với Sutasoma nên là "ngươi"); `43.3`, `43.4`, `77.3`, `77.4` ("bậc hiền thiện" thay cho "bậc thiện nhân" `sn3.3:2.3` và "bậc chân nhân" `dhp151:4`, để đồng nhất với `42`, `76` trong cùng bài; 42.1–42.4 giữ đúng `sn1.31`, `ja190:2.1`); `50.1` (`ja531:1.1` ghi "của mẹ" theo ngữ cảnh riêng, ở đây Pāli không nêu người nghe); `51.2` (bỏ "cùng" của `ja513:33.2` vì đứng sau dấu hai chấm); `94.4` ("do chính điều ấy" để song song với `93.4`, trong khi `ja424:4.4` dùng "nhờ chính điều ấy" cho vế hạnh phúc, không dùng được cho vế khổ); `101.1`–`101.2` (`snp2.8:1.1`, `ja452:8.2` dịch lệch ý: `kaṅkhā` là nghi hoặc, không phải "vết nhơ"); `102.3` (`ja506:15.3` nói "ngươi", ở đây là lời Porisāda gọi Sutasoma là bạn); `120.1`, `120.3` (`an4.47:3.1`, `an4.47:3.3` dịch `samāgamo` là "đoàn kết", ở đây giữ "sự gặp gỡ" như `41.2`, `114.4`, `116.4`, `118.3`, `119.3`); `122.3` (đã dùng lại `snp1.3:40.1`, `snp3.5:10.1` "đã từ bỏ tham, sân và si"); `123.1`–`123.4`, `124.2`, `124.4` (kết hợp `sn21.7:5`–`6` và `an4.48:4`–`5`, hai bản dịch `isi` là "bậc Thánh" và "bậc tiên nhân"; ở đây dùng "ẩn sĩ" như Jātaka khác; `desentaṁ amataṁ padaṁ` → "cảnh giới bất tử" theo `tha-ap332:2.2`, `thi-ap27:27.2`); `27.3` (`ja417:6.2` đọc khác nghĩa); `48.1` (`mil7.3.10:7.1` dịch `tiṇakaṭṭha` là "bó lúa khô", ở đây "cỏ và củi" như `dn4`, `dn5`); `11.1`, `18.1` (`tha-ap217:5.3` dịch tên theo ngữ cảnh khác).
    Trong chính bài: 64 nhóm Pāli trùng nguyên văn (sau khi bỏ dấu câu), tổng 118 cặp; bản Việt giống nhau ở 117/118 cặp, khác nhau ở 1 cặp: `1.2` và `3.2` (`Karosi kammāni sudāruṇāni;` — ở `1.2` đứng sau `edisāni` nên chỉ còn vế "những việc vô cùng tàn nhẫn", ở `3.2` đứng sau mệnh đề điều kiện nên có "mà làm"). Các nhóm chính: `12`/`20`, `17.1`–`17.2`/`22.1`–`22.2`, `31`/`54.1`–`54.3`, `31.2`/`38.2`/`39.2`, `35.4`/`36.4`, `41`–`44`/`75`–`78` (4 bài kệ trùng nhau, chỉ khác `41.1`/`75.1` ở xưng hô và dấu mở nháy), `54.5`/`61.5`, `60.1`–`60.3`/`64.1`–`64.3`/`33.1`–`33.3`, `65`–`72` (tám bài kệ ghép hai nửa: nửa đầu `65.1`–`65.2`/`66.1`–`66.2`, `67.1`–`67.2`/`68.1`–`68.2`, `69.1`–`69.2`/`70.1`–`70.2`, `71.1`–`71.2`/`72.1`–`72.2`; nửa sau `65.3`–`65.4`/`67.3`–`67.4`/`69.3`–`69.4`/`71.3`–`71.4` và `66.3`–`66.4`/`68.3`–`68.4`/`70.3`–`70.4`/`72.3`–`72.4`), `82`/`98.1`–`98.4`, `85.1`–`85.2`/`86.1`–`86.2`, `87.1`–`87.2`/`88.1`–`88.2`, `90.1`–`90.2`/`102.1`–`102.2`/`95.3`, `91.2`/`93.2`, `92.2`/`117.2`, `99.2`/`96.2`, `87.2`/`88.2`/`105.2`/`106.2`, `107.1`–`107.2`/`108.1`–`108.2`. Ở `22.3` và `59.3`, hai dòng Pāli trùng nhau (`Abhakkhaṁ rāja bhakkhesi,`): đã dịch giống nhau.
  - Số Pāli:
    `asīti` (`0.2`) = 80; `pañcamaṁ` (`125.1`) = thứ năm, khớp "5." ở `0.4`; `catasso` (`27.1`) = 4 bài kệ (là `41`–`44`, và `75`–`78` khi nhắc lại); `satārahā` (`40.3`, `45.2`, `46.2`, `55.4`) = đáng giá một trăm (sata 100); `sahassiyā` (`45.1`, `46.4`) = đáng giá một ngàn; `cattāri … sahassāni` (`45.3`) = 4 × 1.000 = 4.000; `āsītiyā` (`46.1`) = tám mươi, `nāvutiyā` (`46.1`) = chín mươi; `pañca pañca na khā` (`59.1`) = năm loài có năm móng (tầng ghim tách `na khā`; tôi đọc là `pañca pañcanakhā`, vì đọc `pañca` hai lần liền thì không có nghĩa rõ), nên con số là 5; `parosataṁ` (`87.1`, `88.1`) = hơn một trăm (paro + sata, không phải đúng 100 hay 101); `vassasataṁ` (`83.3`, `84.3`) = một trăm năm; `sattadhā` (`73.3`) = bảy mảnh; `cattāri … vare` (`79.4`) = 4 điều ước, các số thứ tự `paṭhamaṁ`, `dutiyaṁ`, `tatiyaṁ`, `catutthaṁ` ở `83.4`, `85.4`, `87.4`, `89.4` (và `84.4`, `86.4`, `88.4`, `90.4`) khớp thứ tự một, hai, ba, bốn; `pañca kāmaguṇe` (`95.2`) = năm dục lạc; `dvipada` (`10.4`, `17.2`, `22.2`) = hai chân; `catuppada` (`109.1`) = bốn chân; `diguṇaṁ` (`96.1`) = hai lớp, hiểu là "nói hai lời"; `sakideva` (`41.1`, `75.1`) = chỉ một lần; `ubhopi` (`58.3`, `103.4`, `104.4`) = cả hai. Không có số lớn và không có cụm thuộc loại chưa phân xử được, kể cả `Tiṁsakappasahassa`.
  - Thuật ngữ (có đếm trên tầng):
    + `janinda` → "chúa tể loài người" (37 khoá ja từ ja480 trở đi, ví dụ `ja481:11.2`, `ja527:3.1`; tầng có 49 khoá, một số dịch "hỡi ngươi", "nhân chủ"); `dvipadinda`, `dvipadādhipa` → "chúa tể loài hai chân" (`ja508:9.2`, `tha-ap72:4.2`); `bhūmipāla` → "bậc hộ trì đất" (8 khoá đã xem trong tổng 11 khoá `ja` từ ja400 trở đi, như `ja504:19.3`, `ja527:3.3`); `rājaseṭṭha` → "bậc vua tối thắng" (4 trong 6 khoá: `ja494:3.2`, `ja494:10.2`, `ja506:44.1`, `ja508:9.1`; `ja411:2.4` dịch "bậc vua trong các vua"); `naravīraseṭṭha` → "bậc tối thượng trong hàng anh hùng loài người" (5 trong 8 khoá, `ja494:9.2`, `ja509:7.2`); `porisāda` → "kẻ ăn thịt người" (`ja513`: 4/4); `Kammāsapāda` giữ phiên âm (`ja513:13.3`); `Korabya` → "Koravya" (`ja515`: 4 khoá); `accharā` → "tiên nữ" (`ja535`); `sudhā` → "cam lộ" (`ja535:0.4` ghi chú); `kāḷapakkha`, `sukkapakkha` → "nửa tối", "nửa sáng" (`ja443:12.4`–`13.4`; `ja515:39.4` dịch "kỳ trăng sáng"); `sotthiye kule` → "dòng họ có học vấn" (`cp24:1.4`; `thi-ap38:6.2` dịch `sotthiya` là "Bà-la-môn thông thánh điển"); `kāmaguṇa` → "dục lạc"; `isayo` → "ẩn sĩ"; `pāpadhamma` → "kẻ có ác pháp"; `abhakkha`, `bhakkha` → "thứ không nên ăn", "món ăn"; `piyaṁ`, `piyāni` → "điều ưa thích"; `saṅgaro`/`saṅkaro` (`30.4`–`31.3`, `38.1`–`39.3`, `54.1`–`54.3`) → "lời hứa" theo `ja513:4.3`; `sata`, `santo`, `sabbhi` → "bậc hiền thiện" (`Sabbhireva samāsetha` → "Chỉ nên gần gũi với bậc hiền thiện" ở `sn1.31:15.1`, `ja190:2.1`; thêm 6 khoá `sn1.31` có nháy mở và 5 khoá `sn2.21` dùng "hãy thân cận các bậc hiền thiện"), `asatā`/`asabbhi` → "kẻ bất thiện"/"kẻ không hiền thiện"; `samāgamo` → "sự gặp gỡ", `saṅgati` → "sự gắn kết", `saṅgamo` → "kết giao"; `dīpa` → "hòn đảo" (`sn42.7:2.4`; cách đọc khác "ngọn đèn" ở `28.3`, `101.3`); `kumbhathūṇa` → "tiếng trống" (`dn31:10.2` "kumbhathuna"); `nippurisa tūriya` → "ban nhạc không có nam nhân" (`dn14:1.38.3`); `pāṇissara` → "tiếng vỗ tay" (`dn31:10.2`, `ja470:15.1`); `Dhataraṭṭha` giữ phiên âm; `leṇa` → "nơi trú ẩn"; `ñāti` → "thân quyến"; `bhagavā` ở `2.3` (nói về vua) → "bậc tôn quý" (không phải Thế Tôn).
  - Chỗ bất định (không thêm vào thân kinh):
    + `1`–`4`, `5`–`7`: tên Kāḷahatthi (`4.2`) dùng nguyên, `Kāḷo` (`5.3`), `kāḷa` (`7.1`, `12.1`) là dạng rút gọn nên dịch "Kāḷa" và "hỡi Kāḷa"; `bhadante` (`2.4`, `4.1`) → "thưa ngài"; `me rājino` (`3.4`) hiểu là "vua của ta", `te rājino` (`4.4`) là "vua của ngài"; `rasaka` (`1.1`, `6.2`, `7.2`, `115.1`) hiểu là tên riêng của người đầu bếp (`sūdaṁ` ở `115.2`), không phải từ chung "người nếm vị".
    + `8.1` `Ānando sabbamacchānaṁ`: "Ānanda của tất cả loài cá" (không nêu "vua cá" vì Pāli không nói); `8.2` `khāditvā` không có tân ngữ nên không nêu đã ăn gì; `8.3` `parisāya` → "hội chúng" (đoàn cá); `10.3` `vārijova` hiểu là "như loài cá" (cách đọc khác: "như hoa sen"); `kevalaṁ` bổ nghĩa `raṭṭhaṁ` ("cả xứ").
    + `11.2`–`11.4`: người thân của `tassa` ở `11.2` không nêu tên trong Pāli; `Jambupesi` → "miếng quả jambu" (cách đọc khác: tên riêng hoặc "miếng thịt jambu"); `tassa saṅkhaye` → "khi nó hết sạch" (cách đọc khác: "khi người ấy chết", "khi nó bị hủy hoại"). `13`–`16`: lời của người cha bà-la-môn với con trai (suy từ `tāta`, `putte`, `dāyāde`); `sotthiye` ở `13.2` xem trên; `14.2` `nivāraye`, `15.3` `yassa me dassanena` hiểu như "vì khi thấy tôi" (cách đọc khác: `yassa` là quan hệ "người mà…"); `16.4` `yattha pattaṁ na taṁ suṇe` hiểu là "nơi ngươi đến, mong ta chẳng nghe về ngươi"; `16.3` `jamma` → "đồ hèn hạ".
    + `17.4` `soṇḍaṁ māṇavakaṁ` → "chàng trai nghiện ngập" (`soṇḍa` nghiện rượu, hoặc nói chung mê đắm); `18.2` `bhāvitattāna sāvako` → "đệ tử của những bậc đã tu dưỡng tự thân"; `18.3` `kāmayantova` → "chỉ vì khao khát". `19.2` `mine` → "đem đo". `21.3` `Abhuttaparibhogena` hiểu là "vì dùng thứ vốn không phải để ăn" (cách đọc khác: "vì thọ dụng thứ chưa từng được ăn"); hình thái `abbhatthataṁ` (`21.4`) → "chỗ diệt vong" (`abbhatthaṁ gacchati` được dịch "tiêu tan" ở `dn33:1.11.39` và "chấm dứt" ở `mn20:3.2`).
    + `23`: người nói không được nêu; `23.2` `pammukho` hiểu là `parammukho` ("quay mặt đi", như `ja513:16.2`); `23.4` `brahmacārini` hiểu là hô cách "hỡi người sống phạm hạnh"; `23.5` `Idaṁ te samaṇāyuttaṁ` hiểu là câu hỏi; `23.6` `kaṅkapattaṁ` → "cọng lông diệc" (cách đọc khác: mũi tên gắn lông diệc, hoặc lưỡi gươm); `24.1` `sadhammesu` → "các pháp của chính mình" (cách đọc khác: "các chánh pháp" nếu `sa-` là `sat-`); `24.4` `Āpāyikaṁ nerayikaṁ ito cutaṁ` → "kẻ sa vào khổ cảnh, vào địa ngục, sau khi từ đời này mệnh chung"; `25.2` `sutaṁ gaṇhāhi` → "nhận lấy điều đã nghe" (cách đọc khác: "nhận lấy điều học được"); `25.3` `Tena yaññaṁ yajitvāna` → "nhờ đó mà cử hành tế lễ"; `26`–`27` người hỏi (vua) và người đáp (bà-la-môn) không được nêu tên; `27.1` `dharaṇīmahissara` → "bậc chúa tể của đại địa"; `27.2` `varasāgarūpamā` → "ví như biển cả thù thắng".
    + `28`–`29`: người nói không nêu tên; `28.3` `Dīpañhi etaṁ paramaṁ narānaṁ` → "hòn đảo tối thượng" (cách đọc khác: "ngọn đèn", `dīpa` = đảo hoặc đèn); `29.3` `anutappe` → "ân hận"; `29.4` `suṇoma` ngôi một số nhiều, dịch "chúng tôi muốn nghe".
