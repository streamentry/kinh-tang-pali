    + `91.1`–`91.4` `Na ve piyaṁ meti janinda tādiso`: hiểu là "bậc như thế không nói điều ấy là ưa thích của mình" (tiền lệ `ja386:6.1` dịch khác: "người như thế không xứng là người yêu quý của trẫm"); `91.2` `Attaṁ niraṅkacca` → "bỏ mặc chính mình"; `91.4` `Labbhā piyā ocitatthena pacchā` → "về sau khi đã đạt được mục đích, vẫn có thể có được những điều ưa thích" (`ja386:6.4` dịch "người yêu quý sẽ tự tìm về", ở đây không thêm "tự tìm về"); `93.1` `piyānurakkhī` → "chỉ lo giữ gìn những điều ưa thích"; `93.3` `visamissapānaṁ` → "thứ nước uống pha độc"; `94.3` `yathosadhāni` → "các loại thuốc".
    + `95.2` `Manāpiye kāmaguṇe ca pañca` → "năm dục lạc khả ái"; `95.4`, `97.4` `kinti mahaṁ` → "làm sao ta có thể" (`mahaṁ` = `mayhaṁ`/`mama`, không dịch riêng); `96.1` `diguṇaṁ` xem Số Pāli; `97.1`–`97.3` `Apuññalābhaṁ … upāgā` → "nhận lấy … ta đã mắc phải".
    + `99.3` `Datvā varaṁ khippamavākarohi`: không phân xử được. Theo `81.2`, `82.2`, `98.2` thì `avākaroti` là "rút lại", nên đọc nguyên chữ sẽ là "ban điều ước rồi mau chóng rút lại", trái với ý các dòng quanh nó (`98`, `99.1`–`99.2`, `99.4`); đã dịch theo bối cảnh "đã ban điều ước thì chớ vội rút lại", tức thêm phủ định mà Pāli không có và bỏ nhấn `khippaṁ` thành "vội"; có thể bản ghim bỏ sót `mā` hay `avākarohi` có nghĩa khác, nên cần người biên tập phán. `99.4` `sampajja` → "thành tựu".
    + `100.1`–`100.2` `aṅgavara` → "phần thân quý nhất" (hình thái hiếm; cách đọc khác: "chi thể tối thắng" hoặc "người thân thiết"); `101.1`–`101.4`: `yasmā` → "nhờ ai", `Taṁ hissa dīpañca parāyaṇañca` → "vì vị ấy là hòn đảo và nơi nương tựa của người ấy", `Na tena mittiṁ jirayetha pañño` → "bậc trí chớ để tình bạn với vị ấy bị hao mòn" (tiền lệ `ja452:8.2` và `ja452:8.4` dịch lệch ý: `kaṅkhā` ở đó là "vết nhơ", `jarayetha` là "đối xử khó khổ").
    + `102.3`–`104.4`: `Satthā ca me hosi` → "bạn là bậc thầy của ta"; `pamocayāma` → "thả họ ra" (tân ngữ ngầm: các vua bị bắt ở `87`–`88`); `105.1`–`106.4`: `viheṭhitattha`, `viheṭhitamhā` → "đã bị … hành hạ"; `105.3` `dubbhetha` → "phản bội"; `105.4` `Saccappaṭiññaṁ me paṭissuṇātha` → "hãy hứa với tôi một lời hứa chân thật" (cách đọc khác: "hãy nghe lời hứa chân thật của tôi"); `107.2`, `108.2` `pajānaṁ` → "con cháu" (cách đọc khác: "dân chúng").
    + `109`–`113`: người nói không nêu, đối tượng ("ngài") là Porisāda (suy); `109.3` `Sudhaṁva indo paribhuñjiyāna` → "sau khi thọ dụng như Inda thọ dụng cam lộ"; `110.1` `vallivilākamajjhā` → "eo thon như dây leo"; `110.3` `Indaṁva devesu pamodayiṁsu` → "đã làm ngài vui thích như Inda giữa chư thiên"; `111.1`–`111.2` `Tambūpadhāne bahugoṇakamhi` → "trên chiếc giường có gối đỏ, nhiều tấm trải lông dài" (`saṅge` không phân xử được nên không dịch riêng; `goṇaka` xem `sn22.96:3.5`); `112.1` `Pāṇissaraṁ kumbhathūṇaṁ nisīthe` → "tiếng vỗ tay, tiếng trống giữa đêm"; `113.2` `Migājinūpetapuraṁ` → "thành phố rất đẹp có Migājina" (`ja516:1.4` giữ `Migājina` như tên; không phân xử được đây là danh từ riêng hay "da nai"); `113.4` đóng nháy.
    + `114`–`120`: `115.2` `kāpurisādhamaṁ` → "kẻ hèn hạ nhất trong những kẻ xấu"; `118.1`–`118.4` `Anaddhaneyyaṁ` → "không giữ được", `thale` → "đất khô"; `120.1` `Abyāyiko` → "bền vững" (cách đọc khác: "không hao tổn"); `120.2` `Yāvampi tiṭṭheyya tatheva hoti` → "chừng nào còn tồn tại thì vẫn như thế" (`an4.47:3.2`).
    + `121`–`124`: `121.1` `ajeyyaṁ jināti` không phân xử được (`jināti` = thắng hoặc mất; `ajeyya` = không thể bị thắng hoặc không nên bị thắng); dịch "thắng được điều không đáng bị thắng"; `121.2` `sakhāraṁ jināti` → "thắng chính người bạn của mình"; `121.3` `na vibheti` → "không biết e sợ" (cách đọc khác: "không kính trọng"); `121.4` `jiṇṇaṁ` → "người già"; `122.1`–`122.4` hiểu hai câu đầu là hai câu phủ định tách rời và hai câu sau là một ý (`sn7.22:2`); `123.1`–`123.4` `missaṁ bālehi paṇḍitaṁ` → "bậc trí lẫn giữa kẻ ngu"; `124.2` `isinaṁ dhajaṁ` → "ngọn cờ của các bậc ẩn sĩ".
