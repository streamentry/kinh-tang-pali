notes: |-
  Dịch từ Pāli root, 170 khoá, đủ khoá, đúng thứ tự Pāli, đúng segment ID. Tên bài (khoá 0.3) lấy đúng giá trị translationTitle: Pāli 0.3 là Sīvalittheraapadāna, không bắt đầu bằng số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số). Kiểu tên: đo toàn tầng tha-ap thì Bài Kệ Tuyên Ngợ 255, Ký Sự Về 141, Bài Kệ Tuyên Ngôn 138; đo phạm vi gần nhất tha-ap539 đến tha-ap563 thì Ký Sự Về 19 so với Tuyên Ngợ 2, và các bài liền kề tha-ap543, 544, 547, 548 đều dùng Ký Sự Về. Hai phạm vi cho hai đa số khác nhau; theo phạm vi gần nhất dùng Ký Sự Về Trưởng Lão X. Chữ Tuyên Ngợ không dùng vì chưa rõ gốc; việc chọn một cách cho cả cuốn để biên tập phán. Khoá 0.2 Bhaddiyavagga dịch Phẩm Bhaddiya, theo tha-ap544. Khoá 44.1 dịch Ký Sự Về Trưởng Lão Sīvali, thứ ba (tatiyaṁ là thứ ba; viết hoa theo đúng tên ở 0.3; trong các colophon dạng Ký sự về Trưởng lão X, thứ ba toàn tầng, viết thường 7 khoá và viết hoa 7 khoá, ngang nhau, nên giữ khớp với 0.3). Khoá 43.1 theo công thức Tôi nghe như vầy ... đã nói những bài kệ này (nhóm số nhiều, đa số rõ rệt; không dùng nhóm số ít).
  Số Pāli, tự tính: satasahassa là sata 100 nhân sahassa 1000 bằng 100.000, dịch một trăm ngàn ở 1.3 (cách đây một trăm ngàn kiếp, đồng điệu với tha-ap544:1.3) và ở 14.1 (satasahassito kappe là lời thọ ký về Đức Gotama ở tương lai nên dịch Sau một trăm ngàn kiếp nữa, theo tha-ap539:14.1; 30 khoá của tầng dùng Vào một trăm ngàn đại kiếp trước cho cùng Pāli này nhưng đó là cách đọc quá khứ, không hợp lời thọ ký). Ekanavutito là eka 1 cộng navuti 90 bằng 91, dịch chín mươi mốt (17.1; đa số Pāli này trong tầng ghi chín mươi mốt). Tiṁsabhikkhusahassehi ở 36.3 là tiṁsa 30 nhân sahassa 1000 bằng 30.000, dịch ba mươi ngàn tỳ-kheo; tiṁsa ở đây là ba mươi chứ không phải ba, và bài không có cụm Tiṁsakappasahassa nên không có bất định về kiếp. Sahassa ở 22.1 là 1000 (một ngàn, không nêu đơn vị vì Pāli không nêu). Sattāha ở 6.1, 10.2, 30.1 là bảy ngày, satta vassāni ở 29.3 là bảy năm; tāvatiṁsa là 33 nên dịch cõi trời Ba mươi ba (16.4, 25.4).
  Dấu lược: 40.2, 41.2, 42.2 là …pe… nên giữ đúng một dấu lược …; Pāli của bài không có (…) trần. Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 42.3; nháy đơn mở ở 8.1 và đóng ở 8.4, mở ở 9.3 và đóng ở 10.4, mở ở 11.2 và đóng ở 15.4, mở ở 22.4 và đóng ở 23.4, mở ở 39.1 và đóng ở 39.2; bản Việt khớp Pāli từng khoá (0 khoá lệch). Cách đóng nháy ở 8.4 trước câu 9.1 là của Pāli; 8.1 đến 8.4 theo văn là lời kể của người thuật nhưng nằm trong dấu nháy, vẫn giữ nguyên dấu như Pāli.
  Pāli trùng nguyên văn trong chính bài: 16.1 đến 16.3 trùng 25.1 đến 25.3, và 40.2, 41.2, 42.2 là …pe…; Việt giống nhau ở mọi cặp (4 nhóm, 0 cặp Việt khác). 16.4 và 25.4 khác nhau ở Pāli (tāvatiṁsūpago ahaṁ và tāvatiṁsamagacchahaṁ) nhưng cùng nghĩa nên Việt giống nhau. So với tầng: đã dò 39 khoá Pāli có trùng nguyên văn ở các bài tha-ap khác, 29 khoá Việt giống bản đa số, 10 khoá Việt khác bản đa số: 4.3 (bản trước tách câu lệch, đây giữ động từ Ṭhapesi), 4.4 (thêm chữ bậc theo danh cách của Pāli), 9.3 (hai bản trước dịch purisājañña khác nhau và đều chưa chắc; dùng thuần chủng giữa loài người vì ājañña là giống thuần), 14.1 (đã giải thích), 16.4 và 25.4 (đổi ta thành tôi cho nhất quán ngôi kể), 17.1 (ba cách ngang nhau 38, 37 và 17 khoá; chọn Vào chín mươi mốt kiếp trước), 17.2 (bốn cách đều một khoá; chọn cách của tha-ap337), 19.2 (genitive vipassissa nên thêm dành cho), 41.1 (118 khoá viết Thật lành thay sự đến của ta, 10 khoá viết Thật là sự đón tiếp tốt lành cho tôi và 9 khoá viết Thật lành thay sự đến của tôi; theo bài liền kề tha-ap544 và 550). Ngôi kể: người kể suốt bài là tôi, kể cả ở các công thức Kilesā jhāpitā mayhaṁ (135 khoá ta, 33 khoá tôi, 27 khoá Mọi ... tôi) và viharāmi anāsavo (134 khoá ta, 33 khoá tôi); chọn tôi vì nhóm này cũng có và vì bài liền kề tha-ap544 dùng tôi. kataṁ buddhassa sāsanaṁ dịch không chủ ngữ (140 so với 28 khoá có tôi).
  Thuật ngữ: nāga ở 3.1 và 33.3 là loài rồng (cùng bộ với manuja, amara, deva; toàn tầng có loài rồng 9, na-ga 12, long vương 6; ở tha-ap544:2.3 nāga là voi nên khác nghĩa); purisāsabha là ngưu vương giữa loài người (tha-ap263, tha-ap285 và các bài có dạng này); lābhī và mahālābhī là lợi đắc, theo an1.207 (chính Pāli của Sīvali dịch lợi đắc; lợi lộc chỉ có 2 khoá trong tha-ap, lợi dưỡng 0 khoá); lokanātha là Đấng Bảo Hộ Thế Gian (tha-ap tầng có dạng này), lokanāyaka là bậc Dẫn Đạo thế gian, lokagganāyaka là bậc Dẫn Đạo tối thượng của thế gian (3 khoá cùng dạng), vināyaka là bậc Điều Ngự (4 khoá), mahāvīra là bậc Đại Anh Hùng (23 khoá). Licchavī viết có dấu dài (99 khoá so với 90 khoá Licchavi). dadhi là sữa đông (nhóm năm sản phẩm sữa của truyền thống Việt). Tên Sīvali giữ nguyên Pāli như ở thag1.60 và các tiêu đề, không dùng Thi-bà-ly của an1.207.
  Bất định, không đưa vào thân kinh: (1) 4.1 sasāvakaṁ đọc là sa cộng sāvaka nghĩa đệ tử của chính Ngài (vì là đối tượng của ṭhapesi ở 4.3); cùng chữ ở 6.2 sasāvakaṁ là cùng các đệ tử, hai nghĩa khác nhau theo cú pháp. Hợp từ có thể được đọc khác. (2) 5.2 nagare haṁsasavhaye dịch thành có tên Haṁsa (thường hiểu là Haṁsavatī), không thêm vatī vào thân kinh. (3) 8.1 đến 8.4 theo cú pháp là lời kể, nhưng Pāli đặt trong nháy đơn và đứng sau câu mở lời 7.4; giữ đúng dấu nháy và dịch sát chữ. (4) 10.2 vo (cho quý vị) hiểu là Đức Phật cùng Tăng đoàn; sattāhikampi dịch kéo dài đến bảy ngày, không gán thêm sắc thái của api. (5) 12.1 đến 13.4 cú pháp chuyển ngôi thứ ba (sa mahābhogo, pattheti) sang ngôi thứ hai (lacchase) và nháy ý nghĩ của vua không có dấu nháy ở Pāli; dịch sát chữ, api ce dịch dù. (6) 18.3 passito (đối chiếu apassito ở tha-ap52, 339, 431 là nương tựa) dịch sống nương nhờ; passito có thể là danh từ khác hoặc biến thể chép; kulassaññatarassa dịch là người của một gia đình nọ. (7) 19.1 pūgo dịch nhóm người; 19.3 parivesaṁ dịch buổi dâng thực theo nghĩa phân phát thức ăn (snp1.4); 20.2 khajjaka dịch các món bánh trái. (8) 21.3 Kammassāmigharaṁ dịch nhà của người chủ công việc, chưa có tiền lệ trong tầng. (9) 26.3 Sattukassa dịch kẻ thù vì sattuka có nghĩa kẻ thù và vì truyện kể chung về Sīvali nói tới một cuộc vây thành chống kẻ thù; cũng có thể là tên riêng (ja419:7.4 dùng làm tên), chưa phân xử chắc. (10) 27.1 tapassino dịch những người khốn khổ (nghĩa khốn khổ của tapassī hợp với cảnh thành bị chặn cửa); cách đọc khác là các vị tu khổ hạnh, như tầng thường dịch tapassī ở ja271, snp2.7. 27.2 rakkhitā dịch bị canh giữ, cũng có thể đọc là được giữ gìn. (11) 30.3 chandadānena dịch vì đã ban sự đồng thuận (chandadāna là sự ban sự đồng thuận theo nghĩa thông thường); không rõ đây là sự ưng thuận của người mẹ cho việc chặn cửa ở đời trước hay một việc khác, nên không thêm đối tượng vào thân kinh. (12) 31.3 nikkhantadivase dịch ngay trong ngày ra đời, sát chữ. (13) 32.1 đến 32.4 Pāli liệt kê Sāriputta là thầy tế độ và Moggallāna, rồi mahāmati ở 32.4 không nói rõ là ai; dịch sát chữ. (14) 35.1 đến 35.2 tesaṁ và kammānaṁ cùng ở sở hữu cách, vipuluttamaṁ ở đối cách đơn số; dịch sát chữ, giữ mơ hồ về chỗ vipuluttamaṁ bổ nghĩa cho gì. (15) 34.3 yaṁ dịch vì (liên từ).
  Hệ quả giới hạn: tha-ap545 không có bản Anh đã ghim; lớp english-project không có entry; vietnamese-current vắng. Triangulation hạ xuống 7.5 và status giữ draft. Không có đối chiếu Anh độc lập nào cho toàn bài; các khoá song song (kệ 14 và 15 trùng tha-ap544 và 539, công thức kết 40 đến 42, kệ 1 đến 3) dùng lại cách dịch của chính tầng Việt, không phải đối chiếu Anh.
  Cổng kỹ thuật để coordinator chạy (người dịch bị cấm chạy): npm run validate, npm test, npm run check, npm run build. technical_integrity đặt 9.6 vì chưa chạy bốn lệnh đó.
