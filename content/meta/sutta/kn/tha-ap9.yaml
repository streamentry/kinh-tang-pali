notes: |-
  Dịch trực tiếp từ Pāli root, 73/73 khoá, đúng thứ tự Pāli. Không có tầng Anh đã ghim cho tha-ap nên không có đối chiếu English độc lập; xem blocking_errors.
  Tiền lệ: dựng chỉ mục Pāli sang Việt trên toàn tầng kn (tha-ap, thag, thig, ja, mil và các bộ khác đã có bản Việt). 26 khoá ngoài :0.1 đến :0.3 có Pāli trùng nguyên văn với bài khác; 23 khoá dùng lại NGUYÊN VĂN một bản Việt đã có (so không phân biệt hoa thường), 3 khoá khác tiền lệ và đều có lý do: 10.2 và 12.2 (tiền lệ tha-ap19:8.2, 1 khoá, ghi Ngươi sẽ đạt tới phẩm người vì ở đó Đức Phật nói với chính người ấy; ở đây là ngôi thứ ba nên bỏ chữ ngươi); 16.2 (tiền lệ tha-ap213:2.2 ghi tới cảnh tịch tĩnh tối thượng không gì sánh bằng, 1 khoá, còn tha-ap452:8.4 và iti63:4.4 ghi cảnh tịch tĩnh tối thượng, 2 khoá; câu này không có động từ nên chọn dạng 2 khoá). Trong chính bài có 1 cặp Pāli trùng (10.2 và 12.2), bản Việt giống hệt nhau; 0 cặp Pāli trùng mà Việt khác.
  0.1 Therāpadāna: 448 tiền lệ giữ nguyên tên Pāli, 11 tiền lệ dịch Trưởng Lão Ký Sự (9 và 2 khoá); theo đa số. 0.2 Buddhavagga dịch Phẩm Phật theo 3/3 tiền lệ trong tha-ap (tha-ap6, tha-ap7, tha-ap10); riêng mil dùng Phẩm Đức Phật (16 khoá), Buddhavagga để nguyên (1 khoá) và Phẩm Buddha (1 khoá) ở một tác phẩm khác nên không áp dụng.
  0.3 và 19.1: Pāli 0.3 là 9 Aññāsikoṇḍaññattheraapadāna, BẮT ĐẦU bằng số thứ tự nên giữ số theo hình thức N. ; translationTitle bằng đúng giá trị 0.3. Tên bài nhận khuôn Bài Kệ Tuyên Ngôn Về Trưởng Lão cộng tên. Hai dạng chính tả đo được trong tầng: toàn tầng khoá 0.3 có Tuyên Ngợ 236, Tuyên Ngôn 107, Ký Sự 99, Tuyên Ngợi 10; ở phạm vi gần nhất (tha-ap1 đến tha-ap60) Tuyên Ngợ 18, Tuyên Ngôn 13, Ký Sự 3, Tuyên Ngợi 2; ở tha-ap1 đến tha-ap30 là Tuyên Ngợ 6, Tuyên Ngôn 6. Ngợ là dạng sai chính tả đa số; chọn Tuyên Ngôn theo tiền lệ tha-ap6 và tha-ap10 (cùng phẩm) và theo hướng dẫn của người điều phối. Người biên tập nên phán một lượt cho cả cuốn. 19.1 dùng lại đúng tên của 0.3 (không kèm số) cộng thứ bảy (sattamaṁ = thứ 7), theo khuôn tha-ap6:15.1.
  18.1 công thức lời kết: dùng nhóm Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (469 khoá trong tầng), không dùng dạng khác (5 khoá).
  Số Pāli: tiṁsakappasahassāni (9.1) = tiṁsa 30 x sahassa 1000 = 30.000, tức ba mươi nghìn kiếp; kappasatasahassamhi (11.1) = sata 100 x sahassa 1000 = 100.000, tức một trăm nghìn kiếp; sahassadhā (10.3) = gấp nghìn lần, dịch một nghìn lần; sattāhaṁ (7.1) = satta 7 + aha ngày = bảy ngày; chabbassāni (12.4) = cha 6 + vassa năm = sáu năm; sattamake vasse (13.1) = năm thứ bảy; catasso (17.1) = 4; aṭṭhime (17.2) = 8; chaḷabhiññā (17.3) = 6; sattamaṁ (19.1) = thứ bảy; số 9 ở 0.3 là số thứ tự trong chính Pāli.
  BẤT ĐỊNH VỀ SỐ ở 9.1 Tiṁsakappasahassāni: một hướng dẫn nội bộ đọc tiṁsa là 3 và đòi dịch ba nghìn kiếp. Phép đo của tôi trong tầng cho tiṁsa = 30, vì tettiṁsa = 33 (tha-ap98:5.3), chattiṁsa = 36 (tha-ap197:4.1), ekūnatiṁsa = 29 (tha-ap118:7.1), bāttiṁsa = 32 (tha-ap312:4.1), catutiṁsa = 34 (tha-ap57:9.1) và Tiṁsa kappāni đã dịch ba mươi kiếp (tha-ap459:6.1, tha-ap72:6.1, tha-ap6:9.1); riêng nhóm tiṁsakappasahass- trong tầng có 10 khoá viết ba mươi và 3 khoá viết ba nghìn. Cùng Pāli với bài này, tha-ap54:6.3 viết Trong ba mươi nghìn kiếp (2 khoá). Giữ ba mươi nghìn kiếp theo phép đo; người biên tập nên phán cho cả nhóm.
  Thuật ngữ đo được: Chánh Đẳng Giác cho sambuddha và sammāsambuddha (12 khoá trong giáo pháp của Đức Chánh Đẳng Giác, cùng Pāli với 4.4); dạ-xoa cho yakkha (98 lượt trong kn); Tam Thập Tam cho tidasa (11 khoá, chủ yếu ở vv); khất thực cho bhikkhā; lậu hoặc cho āsava; vô ngại giải, tám giải thoát, sáu thắng trí, lời dạy của Đức Phật (458, 43, 53, 426 tiền lệ cùng Pāli); Chuyển Luân Vương cho cakkavattī; bậc Thầy ở thế gian cho satthā loke (5 khoá); phiền não cho kilesa; Đâu-suất cho Tusita.
  Khoá dùng lại tiền lệ dù chưa chắc: 10.1 Rơi khỏi cõi trời (4 khoá cùng Pāli, tha-ap523:8.1 và tha-ap20:10.1); Rơi khỏi là cách dịch cavitvāna khá thô, nhưng đã có 4 khoá nên giữ, thuộc một lượt rà toàn tầng. 10.2 và 12.2 phẩm người cho manussattaṁ (tiền lệ tha-ap19:8.2, 1 khoá; manussatta nghĩa là trạng thái làm người). 5.3 chọn Hân hoan với tâm hoan hỷ (6 khoá) thay vì dạng Hân hoan với tâm ý tràn đầy hỷ lạc (7 khoá), vì dạng sau thêm tràn đầy và hỷ lạc mà Pāli haṭṭhena cittena không có. 8.3 Ta sẽ tuyên thuyết về người ấy theo tha-ap10:8.3 cùng phẩm; kittayissāmi tầng đang chia ba: tuyên thuyết (tha-ap10:8.3), tán thán (tha-ap36:5.3) và tán dương (tha-ap61:5.3), mỗi dạng 1 khoá. 9.2 devarajjaṁ karissati cũng chia ba: nắm quyền cai trị cõi trời (2 khoá), vua trời sẽ làm chủ (1) và sẽ làm vua trong cõi chư thiên (1, tha-ap61:6.2); chọn dạng cuối vì giữ cả chữ vua lẫn chư thiên.
  Người nói: Pāli mở nháy kép ở 1.1 và đóng ở 17.4, nháy đơn mở ở 13.1 và đóng ở 13.4. 1 đến 5 là Aññāsikoṇḍañña kể; 6.3 và 6.4 cho biết bậc Thầy ngồi giữa chư thiên và nói những bài kệ này, nên 7 đến 13 là lời Đức Padumuttara (dùng ta), trong đó 13.1 đến 13.4 là lời dẫn trong lời dẫn; 14 đến 17 lại là Aññāsikoṇḍañña (dùng tôi). Điều này suy từ 6.4 và ngôi động từ, Pāli không đánh dấu ranh giới giữa 6 và 7.
  BẤT ĐỊNH (không thêm vào thân kinh): (1) 5.2 vācāsabhimudīrihaṁ: đọc là vācā + āsabhiṁ + udīriha (tôi đã cất lên lời nói như bò đầu đàn, tức hùng dũng); tầng có ba dạng cùng gốc vācāsabhimudīrayi / vācāsabhimudīritaṁ / vācāsabhimudīrayaṁ dịch khác nhau (tha-ap115:4.2, tha-ap133:2.2, tha-ap306:2.4, mỗi dạng 1 khoá), chưa có chuẩn; dịch lời nói hùng dũng, không thêm gầm hay rống. (2) 7.1 sattāhaṁ abhinikkhamma: sattāhaṁ là đối cách chỉ thời gian đi với tuyệt đối từ; đọc là bảy ngày sau khi ra đi, nhưng cũng có thể là suốt bảy ngày ra đi; nơi ra khỏi và việc chứng đắc ở 7.2 không được Pāli nói rõ. (3) 7.4 brahmacārissa yāpanaṁ: sở hữu cách số ít, chưa rõ chỉ chính Đức Phật hay người sống phạm hạnh nói chung; yāpana là sự duy trì sự sống. (4) 12.1 tidasā: tidasa nghĩa đen là ba mươi; dịch Tam Thập Tam theo tiền lệ (11 khoá, chủ yếu ở vv), nhưng thig7.1:7.1 ghi ba mươi vị thần và tha-ap113:3.4 để nguyên Tidasa. (5) 10.3 sahassadhā cakkavattī: dhā là bội số; chọn một nghìn lần, không đọc thành nghìn vị khác nhau. (6) 14.1 Nikkhantenānupabbajiṁ: nikkhantena là cách công cụ, người được theo sau khi ra đi; Pāli không nêu tên, ngữ cảnh chỉ Bồ-tát Gotama, nên dịch vị đã xuất ly, không thêm tên. (7) 15.1 abhigantvāna không có túc từ rõ trong khoá; chọn đi đến rồi để 15.3 là nơi chốn, không gán sang Isipatana. (8) 16.1 So dāni: so (vị ấy) quay lại chủ thể được thọ ký ở 13.3; vì 16.4 viharāmi là ngôi thứ nhất nên dịch Nay tôi, bỏ chữ vị ấy. (9) 2.1 yāvatā bodhiyā mūle: đọc là bao nhiêu (vị) ở gốc cây Bồ-đề, với yakkhā ở 2.2 là chủ ngữ chung; Bồ-đề ở đây là cây (tiền lệ gốc cây Bồ-đề, tha-ap237:1.2, 2 khoá). (10) 4.3 và 4.4: Pāli không có dấu nháy, nên không đóng thành lời trích của chư thiên.
  Phép kiểm tự viết, mẫu số ghi kèm: tập khoá Việt bằng tập khoá Pāli 73/73 và đúng thứ tự; dấu nháy kép và nháy đơn khớp Pāli từng khoá 73/73 (Pāli mở nháy kép ở 1.1, đóng ở 17.4; nháy đơn mở ở 13.1, đóng ở 13.4); dấu lược 0/73 khoá có ở cả Pāli lẫn Việt (không có …pe… và không có … trần nên phép này không đo được gì); dấu câu cuối khoá khớp Pāli 70/70 khoá ngoài :0; không khoá rỗng; NFC đủ; chữ số chỉ có ở 0.3 (số thứ tự theo Pāli); không Pāli lọt sang tiếng Việt ngoài tên riêng và nhan đề Therāpadāna. Cặp Pāli trùng ngoài bài: 26 khoá ngoài :0.1 đến :0.3 có Pāli trùng với bài khác, 3 cặp khác tiền lệ (có lý do ở trên).
  Coverage English: mẫu số 2 khoá có nội dung (18.1, 19.1); Sujato phủ 0/2; english-project 0; vietnamese-current 0 (tầng này chỉ có Pháp Cú). Với mẫu số nhỏ như vậy cổng coverage hầu như không đo được gì: đây không phải sự đồng thuận về cách dịch mà là việc không có bản Anh nào để đối chiếu.
