notes: |-
  Đủ 8/8 khoá trong all. parivattana → Chuyển Đổi (nghĩa đen: sự xoay chuyển); còn lại như ne34.
  Bất định đã ghi nhận: paṭipakkhena có hai đọc (bằng pháp đối trị vs theo chiều đảo ngược); chọn theo chiều đảo ngược vì hợp tên hāra parivattana và vì chính câu này đảo thứ tự (diệt làm quả trước, đạo tu tập sau); đọc còn lại ghi ở đây để biên tập phán xử.
  nirodho phalaṃ → sự diệt là quả; pariññāta → liễu tri; pahīna → đoạn trừ (đều có tiền lệ).
