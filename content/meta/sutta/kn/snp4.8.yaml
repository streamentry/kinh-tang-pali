notes: |-
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 2.2 (`bālaṁ dahantī mithu aññamaññaṁ`: `bālaṁ` là tân ngữ của `dahanti` «xem là», DPD dahati 1.1 «considers; regards (as)», `mithu` «lẫn nhau»; Niddesa mnd8:11.3 «dahanti passanti», chú giải Snp «dvepi janā aññamaññaṃ bālaṃ dahanti»: «những kẻ ngu si chê bai lẫn nhau» → «từng đôi xem nhau là kẻ ngu»), 3.2 (`vinighāti`: DPD «(comm) anxious; apprehensive», Niddesa mnd8:18.3–18.4 và chú giải Snp «pubbeva sallāpā kathaṃkathī vinighātī hoti» là lo âu trước cuộc đối đáp: «bực bội» → «lo âu»), 10.3 (`labhetho` là optative ngôi 2, DPD «you yourself could get», chú giải «kiṃ labhissasi»: «ngươi thu được gì» → «ngươi có thể thu được gì»); bất định 8.3 (`sūra` hô cách: Niddesa mnd8 đọc «hỡi chiến sĩ», Sujato đọc tên riêng «Sūra» chơi chữ với Pasūra; Niddesa và chú giải không giải chữ hô cách này nên giữ bản đã publish).
