notes: |-
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 2.2 (`bālaṁ dahantī mithu aññamaññaṁ`: `bālaṁ` là tân ngữ của `dahanti` «xem là», DPD dahati 1.1 «considers; regards (as)», `mithu` «lẫn nhau»; Niddesa mnd8:11.3 «dahanti passanti», chú giải Snp «dvepi janā aññamaññaṃ bālaṃ dahanti»: «những kẻ ngu si chê bai lẫn nhau» → «từng đôi xem nhau là kẻ ngu»), 3.2 (`vinighāti`: DPD «(comm) anxious; apprehensive», Niddesa mnd8:18.3–18.4 và chú giải Snp «pubbeva sallāpā kathaṃkathī vinighātī hoti» là lo âu trước cuộc đối đáp: «bực bội» → «lo âu»), 10.3 (`labhetho` là optative ngôi 2, DPD «you yourself could get», chú giải «kiṃ labhissasi»: «ngươi thu được gì» → «ngươi có thể thu được gì»); bất định 8.3 (`sūra` hô cách: Niddesa mnd8 đọc «hỡi chiến sĩ», Sujato đọc tên riêng «Sūra» chơi chữ với Pasūra; Niddesa và chú giải không giải chữ hô cách này nên giữ bản đã publish).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 4): sửa 2.3 (`aññasitā`: DPD «dependent on another», chú giải Snp «aññamaññaṃ satthārādiṃ nissitā», mnd8:9.3, Sujato «relying on others»: bị động «được người khác nương tựa» → «nương tựa vào kẻ khác»), 4.4 (`upaccagā` ngôi 3 số ít, chú giải Snp «so maṃ vādena vādaṃ atikkanto», mnd8:23.4: «chúng» → «kẻ ấy»), 8.2 (`abhigajjam eti`: chú giải Snp «abhigajjanto eti», lời giải mnd8:53.2 «đi đến, tiến đến», Sujato «goes roaring»: thêm «đi đến»), 8.4 (`pubbeva natthi`: lời giải mnd8:55.2 và chú giải Snp «pubbeva natthi, bodhimūleyeva pahīnaṃ»; «ở đây, như trước kia» không có trong Pāli: → «ngay từ trước đã không còn gì để chiến đấu»), 9.1, 10.2, 11.2 (`diṭṭhi`/`diṭṭhigata` là kiến, «tri kiến» là ñāṇadassana; như mnd8:64.2, 74.2); giữ 10.1 `visenikatvā` «sống xa lìa đám đông» (bất định: DPD ghi cả «having disassociated» theo Sujato lẫn «(comm) having destroyed the army of defilements» theo chú giải Snp và lời giải mnd8:65.2), 11.4 «đối đáp lại» (DPD sampayātave «to proceed», chú giải «ekapadampi sampayātuṃ»; khác chữ), 2.4, 6.1 `pasaṁsā` và 8.3 «Sūra» (khác chữ / đã ghi bất định).
  Thống nhất cấp kho 2026-10-17: kusalāvadāna/kusalā vadānā dịch «tự nhận là thiện xảo» (số ít kusalāvadāno: «tự mình nhận mình là thiện xảo»), theo DPD vadāna «asserting; professing», lời giải Niddesa kusalavādā (= tuyên bố mình là) và mnd13/snp4.13; thay «tự cho (mình) là», «tán thán».
  Thống nhất cấp kho 2026-10-17: 2.4, 6.1 pasaṁsā/pasaṁsita «khen ngợi» (như 3.2 và các dòng kệ trích ở mnd8:9.4, 37.1); 3.4 nindā «chê trách» như mnd8:16.4 và lời giải mnd8:20.2. Dòng kệ Snp khớp dòng trích trong Niddesa.
