notes: |-
  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG** (mọi vế kệ dưới 40 ký tự). Tôi quét MỌI khoá: đúng 9/9, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép mở ở `1.1` và đóng ở `:2.1` (hoặc `1.4`), nên cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Tiêu đề và phẩm theo tiền lệ, đếm được.** `Jātaka` giữ nguyên (129 chỗ). `Ekakanipāta` → *Bộ Một Bài Kinh*. Dòng niết `<X>jātakaṁ <số>` → *Kinh <X> thứ <số>.* theo đa số trên đĩa (71 chỗ không dấu phẩy so với 24 có). Tên riêng giữ nguyên dạng Pāli ở cả `:0.4` và dòng niết — cùng cách *Kinh Paṇṇikajātaka*, *Kinh Udañcanījātaka*, *Kinh Sālittakajātaka*, *Kinh Parosata* đã có.

  **Ngoặc kép ở khoá cuối.** Pāli `ja67:1.4` là `Yato sodariyamānayeti.` — mở `“` ở `1.1` mà **không** có `”ti` đóng. Tôi đóng `”` ở `1.4` (không có `ti`, vì Pāli không có), đúng cách `ja115:1.4` đã làm cho đúng trường hợp này. Các bài Jātaka còn lại trong lát có `”ti` ở vế cuối nên tôi giữ `”ti`.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có 26 chương Pháp Cú), nên `triangulation` là Pāli + English Sujato.
  **Cả bốn vế là mệnh lệnh, và tôi giữ mệnh lệnh ở cả bốn.** `abhitthanaya`, `nāsaya`, `randhehi`, `pamocayā` đều là **thứ tự khẩu lệnh** (aorist imperative), nên tôi dùng *Hãy kêu lên* / *hãy phá bỏ* / *hãy làm cho* / *hãy giải thoát* — không đổi thành *nên* hay *phải*, vì đó là lệnh của vị vua trong truyện chứ không phải lời khuyên. `kākassa` và `Kākaṁ` là cùng một chủ thể (*con quạ*) ở hai vế liên tiếp, tôi lặp *con quạ* đúng như Pāli lặp, và `sokāya` / `sokā` cũng lặp *nỗi buồn* hai lần theo Pāli.

  **`Abhitthanaya pajjunna` là hai chữ gọi, không phải một.** `pajjunna` là tên riêng theo cách người gọi; tôi đặt dấu chấm than sau nó. `Abhitthanaya` là *cất tiếng reo*, không phải *sấm sét* — nên tôi dịch *Hãy kêu lên*, khác *Thunder forth* của Sujato theo nghĩa đen.

  **Thuật ngữ đặt mới, kèm số tiền lệ.** `Varuṇavagga` → *Phẩm Cây Varuṇa* (1 chỗ: `ja79:0.3`, cùng phẩm, cùng tầng). `maccha` → *con cá*, tiêu đề *5. Kinh Cá* (**0 tiền lệ cho tên riêng**; nhưng *cá* đã có tiền lệ dạng thường trong tầng). `kāka` → *con quạ* (tiền lệ mạnh: *Kinh Quạ Tai Đen*, *Kinh Con Quạ*, *Kinh Quạ Biển*). `Pajjuna` → giữ Pāli (tiền lệ *Pajjuna* đã có ở `dn20:17.7`). `abhitthanā` → *kêu lên*; `nidhi` → *kho tàng*; `nāsaya` → *phá bỏ*; `randhehi` → *gánh chịu*; `soka` → *nỗi buồn*; `pamocayā` → *giải thoát*; `mañca` → *cho tôi* (sandhi của `māṃ ca`).
