notes: |-
  Đã đọc hết Pāli qua v4/p4.txt. Tại commit đã ghim không có tệp Anh Sujato cho bài này (0/9 khoá) và tầng Việt hiện hành chỉ có Pháp Cú nên không có bản Hòa thượng Thích Minh Châu để đối chiếu — bản dịch đứng hoàn toàn trên Pāli root. Mọi segment Pāli đều dưới 40 ký tự nên không có segment nội dung theo ngưỡng coverage.
  Tiền lệ (đếm trong tầng Việt dự án): khung tiêu đề như ja1; bāla → kẻ ngu (253); sabbattha → khắp nơi (53); dadhi → sữa đông (19); maññati → tưởng; colophon Kinh ... thứ ba không phẩy.
  0 tiền lệ, đặt mới, ghi lý do: Naṅgalīsa → Lưỡi Cày (naṅgala → cày đã có 8 chỗ lưỡi cày; naṅgalīsa là lưỡi của cái cày); dadhippayaṁ → sữa đông, sữa tươi (giữ đủ cả hai danh từ dadhi là sữa đông và paya là sữa; sữa tươi chỉ 1 tiền lệ nên terminology hạ điểm); asabbatthagāmin → không nên nói mọi nơi (tính từ bổ nghĩa cho lời nói, đối lập với khắp nơi ở vế sau).
  Triangulation 7.5 vì chỉ có Pāli root, không có bản Anh hay bản Việt nào để đối chiếu.
