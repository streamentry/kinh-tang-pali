  CỔNG COVERAGE ĐO ĐƯỢC, MẪU SỐ BẰNG 1: 32 khoá Pāli, chỉ `tha-ap462:6.1` đạt ≥ 40 ký tự sau khi loại block `:0` ⇒ substantivePaliSegments = 1, không có chữ Anh = 0/1 = 0%. Đây là cổng đo được và báo KHÔNG ĐẠT, khác hẳn trường hợp mẫu số bằng 0 (cổng không đo được gì).
  `:0.3` KHÔNG chép số thứ tự. Đo trên 424 tệp tha-ap Việt đã có: Pāli `:0.3` bắt đầu bằng số ở 127 tệp, không có số ở 297; Việt giữ số 68 (66 đúng theo Pāli + 2 thêm, ở tha-ap117 và tha-ap427) và bỏ số 356. Đa số BỎ (356/424), và so với Pāli thì 295/297 tệp Pāli không có số thì Việt cũng không. Pāli của bài này `:0.3 = Gandhapūjakattheraapadāna` không có số ⇒ bản dịch không thêm. Số thứ tự nằm ở `:7.1` (`dasamaṁ`) và `:11.2` (`dasamo`), và đã dịch ở đó thành `thứ mười`.
  Tiền tố `:0.3`, đếm được trên 357 tệp có nội dung: `Bài Kệ Tuyên Ngợ Về Trưởng Lão` 193, `Ký Sự Về Trưởng Lão` 89, `Bài Kệ Tuyên Ngôn Về Trưởng Lão` 65, `Bài Kệ Tuyên Ngợi Về Trưởng Lão` 10 ⇒ chọn đa số, và cũng đúng với `:7.1` của bốn bài anh em cùng phẩm (tha-ap453:10.1, tha-ap460:11.1, tha-ap461:7.1, tha-ap464:7.1 đều viết `Bài Kệ Tuyên Ngợ Về Trưởng Lão ..., thứ N`).
  `:0.2` `Jagatidāyakavagga` ⇒ `Phẩm Cúng Dường Bệ Nền`: đo trên chính phẩm này (tha-ap453–461), 8 tệp viết thế, 1 tệp (tha-ap458) viết `Phẩm Jagatidāyaka` ⇒ chọn đa số.
  `:1.3`–`:4.3` và `:5.1`–`:5.3` TRÙNG NGUYÊN VĂN với bài khác, nên dùng lại nguyên văn bản Việt đã có (số cặp đo được): `Pasannacitto sumano` 18 bài (đa số `Với tâm tịnh tín hoan hỷ` 8 so với `hân hoan` 6); `Satasahassito kappe` 6 bài (5 `Vào một trăm ngàn đại kiếp trước`); `Duggatiṁ nābhijānāmi` 83 bài, hai phe gần như ngang (37 `không biết mình rơi vào khổ đau` / 35 `không còn biết đến đọa xứ`) — chọn `không còn biết đến đọa xứ` vì ba bài anh em liền kề đều dùng thế (tha-ap461, tha-ap463, tha-ap464); `citapūjāyidaṁ phalaṁ` 4 bài (3 `đây là quả báo của việc cúng dường giàn hỏa táng`); `Kilesā jhāpitā mayhaṁ` 38 bài (35 `Các phiền não của ta đã được thiêu rụi`); `viharāmi anāsavo` 35 bài (`ta sống không còn lậu hoặc`); `Svāgataṁ vata me āsi` 37 bài (36 `Thật lành thay sự đến của ta`); `kataṁ buddhassa sāsanaṁ` 35 bài; `Paṭisambhidā catasso` 117 bài (98 `Bốn vô ngại giải`). `gandhamuṭṭhimapūjayiṁ` chỉ trùng 1 bài (tha-ap378: `ta đã cúng dường một nắm hương thơm`) nên y nguyên.
  `citakaṁ yamapūjayiṁ` (`:2.2`) chỉ trùng 1 bài (tha-ap279) và bản Việt ở đó không nêu hành động, nên dịch theo Pāli: `ta đã cúng dường giàn hỏa táng ấy`.
  DẤU LƯỢC: `:3.2`, `:4.2`, `:5.2` là `…pe…` của Pāli ⇒ mỗi khoá giữ đúng MỘT `…`, không mở rộng (56, 129 và 145 bài khác cũng vậy).
  BẤT ĐỊNH CẦN GHI NHẬN — `:1.1` `Citāsu kurumānāsu` là hapax của TOÀN BỘ Pāli root đã ghim (đã grep `kurum` trên `P('kn')`: chỉ 5 khoá, trong đó chỉ một là dạng này). Tách được: `citāsu` = nơi chốn số nhiều của `citā` (đàn, đống), `kurumānāsu` = số nhiều cách-dat của phân từ hiện tại `kurumāna` (dạng `kurumānena` có thật trong `mil5.3.4:4.1`, nên gốc `kuru` và dạng `-māna` là có thật). Nhưng số cách của `kurumānāsu` không xác định được chắc chắn trong khuôn khổ câu kệ, và không có bản Anh hay bản Việt tham chiếu để đối chiếu. Bản dịch dùng `Trong các đàn hương được gom tụ` — giữ `citā` là đàn và `kurumānā` là hoạt động gom, không khẳng định thêm chủ thể. Chữ `hương` trong `đàn hương` là danh từ bổ nghĩa lấy từ chính bài: `:1.4` có `gandhamuṭṭhi`, và vị trưởng lão chính là Gandhapūjaka; đây là hiện thực hoá danh từ mà Pāli để ngữ cảnh, không phải thêm ý giải thích. Đây là lý do `ambiguity_integrity` ở 9.2 và `grammar_logic` ở 9.2.
  `:11.3` `Sattasaṭṭhi` = 67, kiểm chéo bằng `ps1.0:74.2` (`... tesattatiyā ñāṇānaṁ sattasaṭṭhi ñāṇāni sāvakasādhāraṇāni; cha ñāṇāni asādhāraṇāni sāvakehi` = 67 + 6 = 73) ⇒ dịch `sáu mươi bảy`, không suy đoán.
  `:10.x` và `:11.x` là uddāna liệt kê tên: đối chiếu tiêu đề `:0.3` của tha-ap453–462 đã xác nhận ánh xạ Jagatī=Jagatidāyaka, morahatthī=Morahatthiya, āsanī=Sīhāsanabījiya, ukkadhārako=Tiṇukkadhāriya, Akkami=Akkamanadāyaka, vanakoraṇḍi=Vanakoraṇḍiya, chattado=Ekachattiya, jātipūjako=Jātipupphiya, Paṭṭipupphī=Paṭṭipupphiya, gandhapūjako=Gandhapūjaka. Cách viết danh sách theo tha-ap252:9.1–9.4 và tha-ap482:11.1–11.4 (viết hoa từng tên, `ca` ⇒ `và`, giữ dấu `;`/`,` của Pāli). `:11.1`–`:11.4` có tiền lệ gần như y hệt ở tha-ap142:13.1–13.4 (Ekapasādī… dasamo…/ số bài kệ/ gaṇitāyo vibhāvibhi) nên y nguyên cấu trúc đó.
  `gaṇitāyo vibhāvibhi` trùng nguyên văn 6 tệp đã dịch, tất cả đều dịch `đã được các bậc sáng suốt tính đếm` (tha-ap142, 252, 302, 352, 442, 482) ⇒ y nguyên. `Tassuddānaṁ` (`:9.1`): trong tha-ap có 2 tệp `Tóm tắt phẩm này:` (tha-ap262, tha-ap502) và 1 tệp `Tóm lược:` (tha-ap152) ⇒ chọn `Tóm tắt phẩm này:` theo đa số trong chính bộ này. `…vaggo chacattālīsamo` (`:8.1`) theo tha-ap262:8.1 và tha-ap502:8.2 (`Phẩm X là phẩm thứ N`).
  `:6.1` theo công thức chung của cả bộ: `Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này.` (tha-ap461:6.1, tha-ap463:6.1, tha-ap464:6.1 giống hệt).
  Tầng `vietnamese-current` vắng; không có lớp lấp `english-project` cho uid này. 32/32 khoá đã kiểm: ngoặc kép cân (mở 1 ở `1.1`, đóng 1 ở `5.3`), không khoá rỗng, không khoá thừa, NFC sạch, không trùng nguyên văn Pāli, không lọt Pāli (tên `Gandhapūjaka` khai trong bộ nhớ tiến trình vì chứng minh được từ `:0.3` của chính bài này). Cổng kỹ thuật do coordinator chạy; bốn lệnh còn lại: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
