  HAI KHOÁ CỐ Ý TÁCH KHỎI BẢN DỊCH TRÙNG, ĐỀU CÓ LÝ DO:
  - ja464:9.2 pānāgāraṁ sabhā papā; trùng byte với ja65:1.2, bản Việt sẵn có là quán rượu, nhà nghỉ, quán trọ,. Đó là lỗi thật: Pāli chỉ có MỘT danh từ pānāgāra cùng sabhā papā (hết thảy đều đi tới), không có ba danh từ, và quán trọ bị lặp. Bản này dịch hết thảy đều dẫn tới bờ vực;, theo nghĩa pānāgāra là sự hư hoại (danh từ trừu tượng) và để giữ hình ảnh dòng sông lẫn lối đi ở 9.1. Nghĩa thay thế là quán rượu (pāna + āgāra), đọc được trong bối cảnh Anabhirati Jātaka vì Anabhirati là kỹ nữ, nhưng ở đây câu kệ nói về phụ nữ nói chung. CHƯA PHÂN XỬ ĐƯỢC.
  - ja464:9.3 Evaṁ lokitthiyo nāma, trùng byte với ja65:1.3. Tôi DÙNG LẠI NGUYÊN VĂN câu này, chỉ đổi dấu chấm cuối từ ; thành , để khớp dấu câu Pāli (9.3 kết bằng phẩy, 9.4 mới kết câu). Chữ khác không có.

