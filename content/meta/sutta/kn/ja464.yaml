  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU (toàn bộ là cụm chỉ xuất hiện ở ja464 và ja536 trong tầng Pāli đã ghim, nên không có bản Anh nào để đối chiếu):
  1. Kannappakannaṁ (4.2) — hapax: tầng Pāli chỉ có 2 lần (ja464:4.2 và ja536:67.2); không có từ pakanna, kanna hay kāṇappa nào khác trong tầng. Tôi dịch giống như trăng thác trong nước, dựa vào chuỗi ví dụ ở 4.1–4.2 (tâm khỉ · trăng thác · bóng cây) vốn toàn về cái vừa đẹp vừa không bền. CHƯA PHÂN XỬ ĐƯỢC.
  2. Nādeva satto (1.3) — nā + eva; tôi đọc là chẳng được phê bày và dịch người đàn ông chẳng được đàn bà phê bày. Nếu tách thành nādeva = không chỉ... thì câu sẽ khác; chỗ 1.3–1.4 hơi lặp vì Pāli cũng lặp (satto rồi lại saddhātum).
  3. āpaṇova pasārito (8.2) — pasārito chỉ có 2 lần trong tầng (ja464:8.2, ja536:71.2). Tôi đọc là chỉ dành cho chính mình, tức chúng không thuộc về một người đàn ông nào. Nghĩa thay thế là bị trao cho (cho chính tuổi trẻ của họ). CHƯA PHÂN XỬ ĐƯỢC.
  4. Ete naro niccayato bhajetha (11.3) — bhajetha là thì mệnh lệnh (nên), nhưng đọc thành mô tả (luôn ở chung) thì câu kệ mới nối được với 11.4. Tôi dịch người đàn ông nên thường ở chung với chúng, giữ dạng mệnh lệnh của Pāli. CHƯA PHÂN XỬ ĐƯỢC.
  5. sikhi (7.1) — trong tầng Pāli, sikhī còn là danh xưng của Đức Thế Tôn (dn14:1.4.2, mn116:4.3 Tagarasikhī); ở đây nằm trong chuỗi ví dụ vũ khí (tên tên · giáo · nuốt sạch tất cả) nên tôi dịch giáo. Ghi lại chỗ trùng nghĩa.
  6. ghatāsana (10.1, 11.1) — tầng Pāli có 9 lần (ja133:0.4, ja133:1.2, ja133:2.1, ja464:10.1, ja464:11.1, ja536:73.1, ja536:74.1 và hai khoá nữa); 0 tiền lệ cho nghĩa danh từ. Tôi dịch kẻ ăn mỡ. Nghĩa thay thế là tên một yakkha.
  7. nemi (4.4) — trục bánh xe; mn5:31.6 đã dịch rathaassa nemiṁ là vành bánh xe. Tôi dùng trục bánh xe vì đây là trục quay; ghi tiền lệ để người biên tập thống nhất.
  8. velā tāsaṁ na vijjati (9.4) — đọc được là không có lúc nào đáng tin (vijjā = lòng tin) hoặc không có lúc nào ràng buộc được (ja61:1.2 đã dịch theo nghĩa thứ hai, cùng cụm chữ này). Bản này chọn nghĩa đáng tin; ghi cả hai để người biên tập chốt.
  9. muddhābhisittaṁ (11.2) — chỉ 2 lần trong tầng; tôi dịch đều phun chất từ miệng, theo hình ảnh voi và rắn hay bụp phun. Nghĩa thay thế là nhả (theo nghĩa phun nước bọt).
  10. nadīpāra (6.4) và orakūla (7.4) — mỗi từ chỉ 2 và 4 lần trong tầng, đều chỉ ở ja464 và ja536; tôi dịch bến sông và bờ theo nghĩa thông thường.
  11. Muddhābhisitta, gāvo bahitiṇā, omasanti: chưa có tầng Anh để đối chiếu nghĩa; omasanti tôi dịch tiêu phí, gāvo là người chăn bò (gāvo → bò là 39 khoá trong tầng Pāli).

