notes: |-
  9 khoá, phủ đủ, ngoặc kép cân. Không có blocker.
  
  **Tự mâu thuẫn trong lô: tên phẩm `0.3`.** Pāli `Kulāvakavagga` — bản dịch ghi *Phẩm Chim Cút Kurāva*. Nhưng `ja32` (cùng lô, cùng Pāli, cùng phẩm) ghi *Phẩm Tổ Chim*. Cả hai đúng là một tên phẩm, và người đọc đọc hai bài liên tiếp sẽ thấy phẩm của Tăng Bộ đổi tên. Theo AGENTS.md, bài kinh tự mâu thuẫn là blocker — nhưng ở đây **nguyên nhân đã có sẵn từ trước lô này**, không phải lô này tạo ra: `ja31`, `ja32`, `ja38`, `ja39` dùng *Phẩm Tổ Chim*; `ja33`, `ja36` dùng *Phẩm Kulāvaka*; `ja34` dùng *Phẩm Tổ*; `ja37` dùng *Phẩm Chim Đang Lồng*. Tức đã có 4 biến thể trước, và `ja35` là biến thể **thứ năm**. Vì vậy tôi trừ ở `terminology` và `ambiguity_integrity` chứ không ghi blocker, và đề xuất biên tập chọn một (đa số là *Tổ Chim*) rồi gộp cả 5.
  
  **Tên phẩm còn có vấn đề riêng:** *Kurāva* không thuộc `Kulāvakavagga` — `kurāva` là **tên nhân vật chim cút trong truyện**, còn `kulāvaka` là loài chim/ổ. Chèn tên nhân vật vào tên phẩm là điều Pāli không có.
  
  **`Vaṭṭakajātaka` → *Kinh Chim Cút* ✓.** `vaṭṭaka` = chim cút; Sujato dịch *The Quail* ✓. Giữ cả hai tầng nghĩa (loài + tên gốc).
  
  **Bốn vế kệ — lời chim cút, dịch tốt.** `Santi pakkhā apatanā` → *Có loài chim không bay* ✓ (`santi` = "có" giữ nguyên số nhiều). `santi pādā avañcanā` → *có đôi chân không bước* ✓. `Mātāpitā ca nikkhantā` → *cha mẹ đã lánh mình đi* ✓ (`nikkhantā` = đã bỏ đi). `jātaveda paṭikkamā` → *hỡi lửa cháy, hãy lui đi* ✓ (`paṭikkamā` = lùi lại, thứ tự 2 ngôi của √kam).
  
  **Điểm cần ghi nhận về `jātaveda`.** `Jātaveda` là tên riêng của lửa thiêng trong nghi lễ tế (chữ `ātman` của vua trong nghi lễ). Bản dịch bỏ tên, dùng *lửa cháy* — về nghĩa là đúng (ngọn lửa tế), nhưng mất tên gọi. Sujato cũng dịch *Jātaveda the fire* (giữ cả tên lẫn nghĩa). Đây là lựa chọn biên tập hợp lý, tôi ghi ra chứ không trừ.
  
  **Tầng Anh** có mặt đủ bốn vế. Lưu ý Sujato dịch `1.1` là *I have wings that do not fly!* — lấy ngôi một, trong khi Pāli `santi` là ngôi ba "có loài chim…". Bản dịch bám Pāli, **không** theo Sujato. Đây là chỗ Pāli thắng và bản dịch đã thắng đúng.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja35:0.3` mang Pāli `Kulāvakavagga` được
  đổi *«Phẩm Chim Cút Kurāva»* → *«Phẩm Tổ Chim»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:35.ja-kulavakavagga` → *"The Nestling Birds"*; chữ *Kurāva* trong cách cũ **không có** trong Pāli `kulāvakavagga`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.
