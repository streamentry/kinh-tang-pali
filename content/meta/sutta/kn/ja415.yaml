  Tên truyện nằm ở `:0.4` và ở dòng kết
  `13.1`, không phải `:0.3`. Vì vậy chỗ ít tin cậy nhất của bài **không** phải `:0.3`.
  Các mẫu khác: `:0.1` → *Jātaka* (đo 328/453 tệp `ja` giữ nguyên Pāli ở khoá này);
  `Sattakanipāta` → *Bộ Bảy Bài Kệ* (đo trên toàn Pāli `kn`: 29 uid mang `Sattakanipāta`
  ở `:0.2`, trong đó 21 uid `ja`; cả 21 tệp Việt đều dùng *Bộ Bảy Bài Kệ*);
  `:0.4` → *N. Kinh X* (11/11 tệp `ja406`–`ja416`). ⇒ *10. Kinh Kummāsapiṇḍi* và *Kinh
  Kummāsapiṇḍi, thứ mười.* Giữ `i` ngắn vì Pāli root ghi `Kummāsapiṇḍi` (không phải
  `Kummāsapīṇḍi` như một số từ điển in); tôi không tự chuẩn hoá theo truyền thống.
  Lỗi cần biên tập lưu ý: `ja408` trong cùng phẩm lại ghi *Kinh Kumbhakārajātaka*, tức
