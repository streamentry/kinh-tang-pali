  GIẢI QUYẾT DRAFT 2026-10-12. Mục này THAY THẾ các đoạn cũ nói về nghĩa của các
  khoá `1.1`–`1.4`, `2.1`–`2.4`, `3.1`–`3.4`, `4.3`–`4.4`, `5.1`–`5.4`, `6.1`–`6.3`,
  `7.2`–`7.4`, `8.1`–`8.4`, `9.1`–`9.4`, `10.1`–`10.4`, `11.1`–`11.4`, `12.1`–`12.4`
  (các đoạn "BỐN BÀN LẠI VỀ CÂU CHỮ", "THUẬT NGỮ", "0 tiền lệ", "HAI CHỖ SỬA", đoạn
  `Ambaṭṭhaka`/`Dhammajīvinī` và `Bà-la-môn` cho `samaṇeddasa` ở trên không còn đúng với
  bản dịch hiện hành). Đọc đối kháng lại từng khoá từ Pāli: bản cũ có **44/53 khoá**
  phải đổi (giữ nguyên chỉ `0.1`–`0.4`, `4.1`–`4.2`, `6.4`, `7.1`, `13.1`); phần lớn trong số đó
  là lỗi nghĩa thật (đảo chủ thể, đảo vế, sai thể, nhầm sandhi, câu vô nghĩa), số ít (`1.4`,
  `2.4`, `4.3`–`4.4`, `5.3`, `7.2`) chỉ đổi cách diễn đạt cho khớp tiền lệ. Các lỗi chính:
  (1) `5.2` `caturo samaṇeddasaṁ` = `caturo samaṇe addasaṁ` ("ta đã thấy bốn vị sa-môn"),
  KHÔNG phải "hầu hạ bốn nhà Bà-la-môn": `samaṇa` + `addasaṁ` (aorist `dassati`) nối nhau
  theo sandhi; không có `brāhmaṇa` trong khoá. Bản cũ nhầm sandhi.
  (2) `1.1`–`1.2`: `Na kiratthi` = `na kira atthi` ("quả thật chẳng có") — cùng dạng với
  `ja14:1.1` (`Na kiratthi rasehi pāpiyo`, Sujato: "Nothing, it seems, is worse than tastes");
  `anomadassisu` / `buddhesu` là hai định ngữ định vị số nhiều cho cùng đối tượng, `appikā`
  là vị ngữ của `pāricariyā` ("không có sự hầu hạ nào là nhỏ"), không phải "kẻ hành lễ… ít".
  (3) `1.3`: `Sukkhāya aloṇikāya ca` đi với `kummāsapiṇḍiyā` (nữ, cách sở hữu), nên là
  "khô và không có muối" như `vv42:5.1` (Pāli trùng, dùng lại nguyên văn bản Việt);
  bản cũ "kẻ xin ăn dễ dàng" là sai. (4) `2.1`–`2.3`: `hatthigavassā` là voi + bò + ngựa
  (`hatthi` + `gava` + `assā`), `dhanadhaññaṁ pathavī ca kevalā` là tài sản, lúa gạo, toàn
  thể mặt đất, `accharūpamā` ("giống thiên nữ", cùng `ja519:30.2`); bản cũ ("kẻ vác gánh
  trên đầu…", "Ít là nữ nhân…") hoàn toàn sai và vô nghĩa. (5) `3.x`: người nói là
  hoàng hậu, hỏi vua: `abhikkhaṇaṁ` = thường xuyên, `rājakuñjara` = voi chúa của các vua
  (so `ja546:2.3` `nāgakuñjara` → "tượng vương"), `kosalādhipa` = chúa tể xứ Kosala,
  `bāḷhaṁ pītimano pabhāsasi` = ngài nói với tâm rất hoan hỷ; bản cũ ("hổ trong vương
  đảo", "ngươi", "hãy nói dài dòng") sai. (6) `6.2` `nisīdetvā paṇṇasanthate`: thể sai
  khiến — cho các Ngài ngồi trên chỗ trải bằng lá; bản cũ "ngồi yên trong sự vững vàng
  của trí tuệ" sai. (7) `7.3`–`7.4`: `anubhomi` = thọ hưởng (`tha-ap100:2.2`),
  `dharaṇimuttamaṁ` = tối thượng trên mặt đất (so `ja521:32.2`); bản cũ "xin tôi được
  đạt" sai thể. (8) `8.1` `Dadaṁ bhuñja` = vừa bố thí vừa thọ hưởng (bản cũ "hãy nhận
  lấy mà ăn" đảo chiều); `8.3` `rāja` là hô cách. (9) `9.x`: `vaṭumaṁ` = con đường
  (đối tượng của `ācarissāmi`, đồng vị với `ariyācaritaṁ`); `arahanto me manāpāva
  passituṁ` = các bậc A-la-hán đối với ta thật đáng mến khi được thấy (bản cũ "ta là
  bậc A-la-hán" đảo chủ ngữ). (10) `10.1`–`10.4`: `Devī viya accharūpamā` = giống nữ
  thần, tựa thiên nữ; `bhaddakaṁ` là định ngữ của `kammaṁ`, không phải hô cách "bậc phúc
  lành"; `vaṇṇavatī` = có dung sắc xinh đẹp. (11) `11.1`–`11.4`: `khattiya` là hô cách
  (người nói gọi vua), `Ambaṭṭhakulassa` là sở hữu của `dāsyā` (nữ tỳ của gia tộc
  Ambaṭṭha), `parapesiyā` = kẻ do người khác sai khiến; `saññatā`, `dhammajīvinī`,
  `sīlavatī`, `apāpadassanā` là bốn tính từ nữ cùng chỉ một người, KHÔNG phải tên riêng
  `Dhammajīvinī` (bản cũ "còn Dhammajīvinī thì tiết chế" là sai). (12) `12.x`:
  `vittā sumanā` là hai tính từ nữ ("vui sướng, hoan hỷ"), KHÔNG phải `vitta` = của cải
  (bản cũ "trao của cải" sai); `uddhaṭabhattaṁ` = phần cơm đã được lấy ra (bản cũ "kẻ nấu
  ăn cho khách" sai); `caramānassa bhikkhuno` = vị tỳ-kheo đang đi lại.

  Quan hệ người nói (đọc từ Pāli, không thêm vào thân kinh): khoá `1`–`2` và `4`–`7`, `9`–`10` do vua; khoá `3`, `8`,
  `11`–`12` do hoàng hậu. Điều này khớp `mil6.3.3:3.4` (Mallikā dâng bánh `kummāsapiṇḍa` cho Đức
  Phật rồi thành chánh hậu của vua Kosala). Chỗ gọi người nói bằng "ta"/"nàng"/"tôi" theo đó:
  vua xưng "ta", hoàng hậu xưng "tôi", gọi vua "ngài"/"tâu".

