  BỐN BÀN LẠI VỀ CÂU CHỮ — chỉ từ Pāli root, không đoán.
  (1) `1.2` `Pāricariyā buddhesu appikā`: `pāricariyā` là danh từ trừu tượng, tức
  *sự hành lễ với các bậc Giác thì ít*; bản nháp đầu tôi ghi *kẻ hành lễ … cũng ít*,
  biến danh từ thành danh từ người, đã sửa. (2) `4.2` `kule aññatare ahuṁ` là *ta
  thuộc một gia đình nào đó*; bản nháp ghi *sinh ra trong*, thêm cả ý *sinh* mà Pāli
  không có, đã sửa. (3) `9.2` `sobhane` và `9.3` `sukosale` là **hai** danh xưng, mỗi
  câu một cái; bản nháp dồn cả hai vào `9.3`, đã sửa. (4) `9.4` `Arahanto me manāpāva
  passituṁ`: `me` đi ngay sau `arahanto` nên đọc là *ta là bậc A-la-hán đáng mến*, không
