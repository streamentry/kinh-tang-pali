notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud6.1:16.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 4.1, 6.1 — *Nhưng Tôn giả Ānanda, dù Đức Thế Tôn đưa ra dấu hiệu rõ ràng, ánh sáng rõ ràng như vậy, vẫn không thể lĩnh hội* → *Dù Đức Thế Tôn đã đưa ra một dấu hiệu rõ ràng như vậy, một gợi ý rõ ràng như vậy, Tôn giả Ānanda vẫn không thể hiểu thấu* (`evampi … nāsakkhi paṭivijjhituṁ`: bỏ *Nhưng* không có trong Pāli; `obhāsa` trong ngữ cảnh này là gợi ý, theo toàn tầng); 15.1, 15.2 — *thọ mạng* → *lực mạng* cho `āyusaṅkhāra` (theo dn16, sn51.10, an8.70); 17.2 — *với sự tạo tác của hữu, vị ẩn sĩ từ bỏ thọ mạng* → *bậc Mâu-ni đã buông bỏ hữu hành* (`bhavasaṅkhāra` là hữu hành, không phải thọ mạng; theo 5 khoá trùng Pāli); đồng thời khoá 3.2 (Pāli có `(…)` mà bản Việt bỏ mất) thêm một dấu lược `…` đúng vị trí; giữ nguyên khoá 1.4 và 2.2 vì chỉ khác văn phong, cả hai đều đúng nghĩa. Tên kinh ở `translationTitle` và khoá 0.2 vẫn là *Từ Bỏ Thọ Mạng* — chưa đổi vì thuộc hồ sơ tên bài; người biên tập cân nhắc thống nhất sang *lực mạng*.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.1, 7.3 — “Lành thay, bạch Thế Tôn” → “Dạ vâng, bạch Thế Tôn” (`evaṁ, bhante` là lời nhận lời chứ không phải `sādhu`; “Dạ vâng” là cách dịch đa số của công thức này, 89 khoá, “Lành thay” chỉ 13); khoá 2.1 thêm “sát” cho `piṭṭhito piṭṭhito` (đi theo sát sau lưng, như `sn51.10:1.7`); khoá 13.2, 13.3 — thêm “cho đến mức” cho `yāva devamanussehi suppakāsitaṁ` (bản trước bỏ sót `yāva`; theo `dn16:3.8.17`, `sn51.10:15.3`, `sn12.65:8.25`). Giữ nguyên khoá 1.4, 2.2, 3.1, 4.5, 5.1, 9.2, 10.1, 11.1, 12.1 vì đều đúng Pāli và nhất quán trong bài: “gọi”, “sắp đặt” (9 khoá, ngang “soạn”), “khả ái” (`ramaṇīya`) có tiền lệ cùng mức, và “Bạch Thế Tôn, Ngài đã từng nói” là lời thưa trực tiếp với Đức Thế Tôn nên không đổi sang ngôi thứ ba.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt quét lỏng): khoá 7.2 — “ngươi hãy đi khi ngươi thấy thích hợp” → “ông hãy đi, nay ông thấy lúc nào thích hợp thì cứ làm” (Đức Phật nói với Tôn giả Ānanda xưng “ông”, không “ngươi”; `yassadāni kālaṁ maññasi` theo `an8.70:5.2`); khoá 15.2 — “đại địa chấn khủng khiếp, rùng mình” → “trận động đất lớn, khiếp đảm, rợn tóc gáy” (theo `dn16:3.10.2`, `sn51.10:17.2`, `an8.70:10.2`; “động đất lớn” có 36 chỗ trong toàn tầng, “đại địa chấn” chỉ ở khoá này); khoá 9.4, 10.3, 11.2, 11.3, 12.2, 12.3 (sửa lan 9.3 và 10.2 cùng Pāli) — “giáo pháp của mình” → “giáo pháp của thầy mình” (`sakaṁ ācariyakaṁ` là giáo pháp của vị thầy mình, bản trước bỏ `ācariya`; theo `dn16:3.8.1`). Giữ nguyên khoá 1.4, 3.1, 5.1, 8.1, 9.2, 10.1, 11.1, 12.1, 13.1, 13.3 vì đều đúng Pāli, chỉ khác bản đa số ở văn phong (“khả ái”, “Ác ma”, “Ngài”, “mầu nhiệm” cho `sappāṭihāriya`) và nhất quán trong bài.
