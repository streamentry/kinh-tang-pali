notes: |-
  Đợt 16, lát f205. `:0.3` Vibhaṅga 15 → Nhóm 15; `:0.4` `Parikkhārahāravibhaṅga`
  → *Nhóm Trợ Duyên Hướng Dẫn* — theo bảng `X-hāravibhaṅga` → *Nhóm X Hướng Dẫn*
  (`ne7`, `ne8`, `ne11`–`ne16`) và đồng nhất với `ne34:0.4` `Parikkhārahārasampāta`
  → *Nhóm Phương Thức Trợ Duyên*, nên `parikkhāra` = **trợ duyên** (đã dùng trong
  body `ne34`: "Đây là trợ duyên cho chỉ và quán").
  `:6.2` chain `titthaññutā→pītaññutā→pattaññutā→attaññutā` dùng lại đúng ngữ
  `ne7:4.1` (sự biết chỗ bến / đã uống / đã đạt / nơi mình), chỉ đổi nối `padaṭṭhāna`
  → `paccayo` thành *là duyên của* đúng theo Pāli từng bài. `:3.2` mượn nguyên khuôn
  `ne33:2.8` ("do vô minh làm điều kiện, các hành sinh khởi; ..."); chuỗi `:7.4–7.18`
  và thuật ngữ sầu/bi/khổ/ưu/não, tham ái/chấp thủ, sanh, hữu bám `ne7:3.x`.
  `:6.1` `khandha` → *uẩn* (tiền lệ "uẩn giới, uẩn chánh định, uẩn trí tuệ" trong corpus).
  **Bất định đã ghi nhận:** `:2.7` `Yathā kiṁ bhave?` dịch "Như thế nào?" theo văn mạch
  ví dụ mầm–hạt; `:5.1–5.3` cặp `X-attho Y` lấy chiều `X→Y` theo `:5.2` `yattha...tattha...`
  và bản Anh tham khảo ngoài (chỉ để soát cú pháp, không sao chép); `:4.2` chủ ngữ
  `[lửa]` của `padīpo viya sabhāvo hetu` đặt trong ngoặc vuông vì Pāli lược.
