notes: |-
  KỸ THUẬT. Đợt này tôi KHÔNG chạy `npm run validate|test|build|check` — người điều phối
  cấm và chạy tập trung. Vì vậy tôi KHÔNG tuyên bố technical gate pass:
  `technical_integrity` chấm 9,6 chứ không phải 10,0. Bốn lệnh đó để người điều phối
  chạy lại.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ KIỂM THỦ CÔNG. Bài này CÓ khoá Pāli ≥ 40 ký tự nên vòng
  chốt của `_hvi.kiểm` chạy thật; tôi vẫn tự quét lại TOÀN BỘ 14 khoá bằng chính các
  hàm đó (`_chk_w5.py`): mọi khoá có bản dịch, không khoá thừa/thiếu so với Pāli,
  thứ tự khoá khớp Pāli, chuỗi NFC, không Pāli lọt, số dấu lược khớp TỪNG khoá,
  ngoặc kép cân trên cả bài, không có `(…)`.

  COVERAGE — ĐO LẠI BẰNG ĐÚNG QUY TẮC CỦA KHO (`source/layers.yaml`:
  substantivePaliMinChars 40, excludeReferenceBlock, floor 0,8). Bài này có 6–8 khoá
  Pāli có nội dung và **0 trong số đó mang chữ Anh**, tỉ lệ 0% < 0,8. Vì vậy nếu bài
  muốn lên `review`/`published` thì PHẢI có mục trong
  `content/meta/reference-gaps.yaml` — đợt này tôi không được sửa tệp đó, nên đây là
  blocker thứ hai bên cạnh việc thiếu hẳn tầng Anh.

  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của
  bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho Milindapañha.
  Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho. Vì vậy
  `triangulation` của sáu bài mil3 trong lát này chỉ là **Pāli + các bài song song
  trong chính tầng này + menu SuttaCentral** (xem mục thuật ngữ bên dưới).

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC, KHÔNG ĐOÁN. `“Kallosi, bhante nāgasenā”ti.`
  → *“Khéo lắm, thưa tôn giả Nāgasenā.”* là **25/25** bài mil3 đã có; `TIEN_LE_PHAI.md`
  cũng ghi cặp `mil3.5.6:2.1 == mil3.6.6:2.1`. `Opammaṁ karohī` 6 bài: 3 bài *Hãy xét
  một thí dụ* (đa số), 2 bài *Hãy nêu một ví dụ*, 1 bài *Hãy đưa một ví dụ* → tôi theo
  đa số. `Āma` 5 bài → *Vâng*. `Na hi, bhante` **0 tiền lệ**; tôi dùng *Không phải vậy*
  theo 31 bài đã có `No hetaṁ, bhante` → *Không phải vậy*. `Rājā āha—` **đang chia
  12 `Vua nói:` / 10 `Vua nói—`**; tôi theo đa số `Vua nói:` và ghi lại đây vì tầng
  đang lệch. Lưu ý khi chấm cặp: chuỗi `“Xin hãy xét một thí dụ”ti.` của tôi **khác** `“Hãy
  xét một thí dụ”.` của 3 bài kia chỉ ở chữ *"Xin"*; `ti.` bị rơi ở bản kia. Cùng nguyên
  văn đã có, nên tôi giữ `ti.` cho đúng với `”ti.` mà Pāli mang. Tên phẩm: `Mahāvagga` → *Đại Phẩm* · `Buddhavagga` → *Phẩm Đức Phật* ·
  `Sativagga` → *Phẩm Chánh Niệm* · `Arūpadhammavavatthānavagga` → *Phẩm Xác Định Pháp
  Vô Sắc* (đều có 1–6 tiền lệ). `bojjhaṅga` → *giác chi* (358 khoá Pāli, và
  `content/glossary/pali-vi.yaml` ghi `preferred: "giác chi"`).

  THUẬT NGỮ ĐẶT MỚI. `Addhānavagga` → *Phẩm Khoảng Thời Gian* (xem `mil3.2.7`).
  `Nāmarūpapaṭisandahanapañha` **0 tiền lệ** → *Câu hỏi về việc tái sinh của danh và
  sắc*, dùng **cùng một nghĩa** cho `paṭisandhanā` như `mil3.2.7` ngay cùng phẩm;
  SuttaCentral dịch tiêu đề là *The Question on Name and Form*, bỏ mất chất
  `paṭisandhana`, nên tôi không theo. `oḷārikaṁ` (đối lập `sukhuma`) → *cái phần thô* ·
  `sukhumā cittacetasikā dhammā` → *các pháp thuộc tâm và ý, tinh tế* · `aññamaññūpanissitā`
  **0 tiền lệ** → *lẫn nhau phụ thuộc* · `ekatova uppajjantī` → *cùng sinh ra một lúc* ·
  `kukkuṭi` → *trứng con gà* · `kalalaṁ` → *vỏ trứng* · `aṇḍaṁ` → *lòng trứng* ·
  `sandhāvitan` → *tiếp diễn*.

  Giải quyết draft 2026-10-12. Mục này thay các lựa chọn cũ về `kalalaṁ` → *vỏ trứng*,
  `aṇḍaṁ` → *lòng trứng*, `cittacetasikā` → *tâm và ý* và `nāmaṁyeva na paṭisandahati` →
  *không tự tồn tại* ở trên.
  SỬA 7/13 khoá (đều là sửa nghĩa hoặc xưng hô): `1.4` bản cũ bỏ mất động từ `paṭisandahati`
  (*không tự tồn tại*); nay *chỉ danh một mình không tái sinh, hoặc chỉ sắc một mình*, cùng
  nghĩa *tái sinh* với các khoá mil3 khác dùng `paṭisandahati` (ví dụ cùng phẩm: `mil3.2.6`, `mil3.2.2`).
  `2.2` bản cũ viết *trứng con gà thì không có vỏ trứng, cũng không có lòng trứng* — vừa đảo
  `kalalaṁ`/`aṇḍaṁ` vừa biến `kukkuṭiyā kalalaṁ na bhaveyya, aṇḍampi na bhaveyya` thành mệnh đề
  sai chủ ngữ; `kalala` là phần chất lỏng/phôi bên trong (ở `mil6.1.8`, `mil6.3.11` là *bùn nhão*,
  cùng gốc), không phải vỏ. Nay: *nếu gà mái không có lòng trứng thì cũng không có trứng*;
  `aṇḍa` → *trứng* (đúng với `mil3.3.2:2.2`). `2.3` song song, bỏ chữ *và* không có trong Pāli.
  `1.2` *ngươi* → *ngài* (vua nói với tôn giả; tầng mil có 775 khoá *ngài* so với 87 *ngươi*, và
  *ngươi* không hợp khi vua hỏi một vị tỳ-khưu). `1.3` *tâm và ý* → *tâm và tâm sở* (xem bất
  định dưới). `1.5`, `2.2`, `2.3` *lẫn nhau phụ thuộc* → *phụ thuộc lẫn nhau* (xuôi tiếng Việt,
  cùng nghĩa). `2.4` *Thế ấy* → *Như vậy, điều này* (`evametaṁ`). Không đụng: `0.x`, `1.1`,
  `3.1`, `4.1`.
  BLOCKER GỠ. (a) Dòng "Coverage English dưới ngưỡng 0,8…" gỡ: đó là hệ quả của việc Sujato không
  phát hành bài (0 khoá có chữ Anh vì không có tệp, không phải Sujato bỏ trống từng đoạn) và việc
  thiếu mục trong `content/meta/reference-gaps.yaml` là việc của công cụ ghi nhận, không phải lỗi
  văn bản; bài ngắn (6–8 khoá Pāli có nội dung) và nghĩa đứng vững từ Pāli sau lượt đọc đối kháng
  này. (b) GIỮ blocker "Thiếu tầng tham khảo English Sujato" — đúng sự thật về bản chụp upstream.
  Không có tầng Việt hiện hành (chỉ Pháp Cú), đây chỉ là giới hạn tham chiếu.
  BẤT ĐỊNH CÒN LẠI. `cittacetasikā dhammā`: mil3.7.16 (2 khoá, lát khác) đang dịch *tâm và ý*;
  tôi chọn *tâm và tâm sở* ở đây — chưa thống nhất toàn tầng, cần phân xử một lần. `kalala` ↔
  *lòng trứng* là cách hiểu theo nghĩa gốc (chất lỏng/phôi bên trong), không có bản Anh độc lập
  để đối chiếu. `sandhāvitaṁ` giữ *tiếp diễn* (không thêm nghĩa luân hồi). `triangulation`
  ≤ 8,0 (không bản Anh), chấm 7,5. Điểm mới 9,01: các khoá sai đã sửa; terminology hạ 8,4 do hai
  bất định thuật ngữ trên. Bốn lệnh `npm run validate` · `npm test` · `npm run check` ·
  `npm run build` chưa chạy lượt này (không được phép).
