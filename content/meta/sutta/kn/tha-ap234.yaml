notes: |-
  TẦNG THAM KHẢO — đo, không đoán. 0/14 bài của lát có bản Anh Sujato tại commit đã ghim: tôi đếm ở
  `source/upstream-manifest.json` rồi đếm lại trực tiếp trên đĩa bằng
  `ls .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/{mil,pv,tha-ap}/` — **0 tệp cho cả ba
  thư mục**. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng `vietnamese-current` cũng
  vắng (`translation/vi/phantuananh` tại commit đã ghim có 26 tệp, toàn bộ là Pháp Cú). Lớp lấp
  `english-project` cũng không có uid nào của lát. Ba tầng tham khảo đều vắng ⇒ blocker thật ⇒ `draft`
  cho cả lát, và `triangulation` bị chặn ở 7.5 (≤ 8.0) cho **mọi** bài.

  PĀLI TRÙNG NGUYÊN VĂN — tự dựng chỉ mục bằng script, không tin bảng tiền lệ. Tôi nạp **mọi** tệp Pāli
  gốc trong cache (5.764 tệp / 284.708 khoá) và **mọi** tệp Việt dự án (4.038 tệp / 113.977 khoá), ghép
  theo chuỗi Pāli đã chuẩn hoá khoảng trắng. Lát này có **280 khoá**, trong đó **139 khoá trùng Pāli
  nguyên văn** với bài khác; riêng cụm `…pe…` đã có **1.152 bản rải trên 607 bài**, và `catasso` có
  **599 bản rải trên 598 bài**. Trong 139 khoá ấy, **59 khoá có bản Việt đã có để dùng lại** (132 khoá
  còn lại — 80 khoá — không có bản Việt nào ở bài khác, nên không có gì để dùng lại). Tôi dùng lại
  **nguyên văn cả 59 khoá ấy**, không dịch lần hai:
  · `Milindapañha` (5), `Opammakathāpañha` → *Câu hỏi về cách dùng dẫn với ví dụ* (5);
  · `Sīhavagga` → *Phẩm Sư Tử* (1, mil7.6.3–6), `Makkaṭakavagga` → *Phẩm Kẻ Nhắc Nhở* (2),
    `Kumbhavagga` → *Phẩm Bình Vò* (2);
  · `Petavatthu`, `Mahāvagga` → *Đại Phẩm* (pv47, pv50);
  · `Therāpadāna` (7);
  · `…pe…` (7) → **một** `…`, theo §10.1 BRIEF_VI3: 27 khoá Pāli cùng dạng đã có trong tầng cũng dịch
    là `…`; 152 khoá Việt trong tầng còn để nguyên `…pe…` là dạng **sai** (hai dấu lược), tôi không
    sao chép;
  · `Paṭisambhidā catasso,` → *Bốn vô ngại giải,* (tha-ap243:3.1, tha-ap313:3.1; cả hai cùng Pāli) và
    `kataṁ buddhassa sāsanaṁ”.` → *đã làm tròn lời dạy của Đức Phật”.* (cùng hai bài kia);
  · `Duggatiṁ nābhijānāmi,` → *Ta không biết mình rơi vào khổ đau,* (tha-ap243:2.3) — dùng lại ở cả
    7 bài `tha-ap`;
  · `Ekanavutito kappe,` → *Từ chín mươi **mốt** kiếp trước,* (**đã sửa 2026-10-05**: bản ghi trước
    ghi *chín*, tức 99 — sai; `tha-ap243:2.1` cũng đã sửa) — dùng lại ở tha-ap207, tha-ap234;
  · `patto me āsavakkhayo.` → *ta đã đạt sự chấm dứt của lậu.* (tha-ap313:2.4) — tha-ap218:2.4;
  · `Itthaṁ sudaṁ āyasmā X thero imā gāthāyo abhāsitthāti.` → *Tôi nghe như vầy: Tôn giả Trưởng lão X
    đã nói những bài kệ này.* — khuôn có tiền lệ ở **90** khoá `tha-ap` trong tầng.
  Ngoài ra `Suddhā suddhehi saṁvāsaṁ …` (mil7.7.7:4.1–4.4) là cùng bốn vế kệ với `snp2.6:10.1–10.4`
  đã có bản Việt; tôi dùng lại **nguyên văn cả bốn vế** (script chỉ báo trùng ở 4.2 và 4.3 vì 4.1/4.4
  khác dấu câu), vì tác phẩm phải nhất quán trong một câu kệ.

  DẤU LƯỢC — theo §10. Cả 14 bài: 7 khoá Pāli có `…pe…`, bản Việt đều để **đúng một** `…` (2 phía = 1,
  khớp). Không khoá nào tôi mở rộng, không khoá nào tôi nén bằng `…`, không có `(…)` đứng một mình.
  Nhắc lại vì đây là bẫy đã có tiền lệ: ở `tha-ap*` cụm `Paṭisambhidā catasso, …pe…, kataṁ buddhassa
  sāsanaṁ` lược mất hai vế `vimokkhāpi ca aṭṭhime` và `Chaḷabhiññā sacchikatā`; tôi **không** mở
  chúng ra, vì §10.1 là luật fidelity.

  ĐỢT NÀY CẤM CHẠY CỔNG — theo chỉ đạo của người điều phối, tôi **không** chạy
  `npm run validate|test|check|build`, nên `technical_integrity` chấm **9.6 chứ không phải 10.0**, và tôi
  **không** tuyên bố technical gate pass. Bốn lệnh đó để **coordinator** chạy. Tôi đã tự quét TOÀN BỘ
  20 khoá từ đĩa (không dùng ngưỡng 40 ký tự, vì ngưỡng đó không chạy ở bài kệ ngắn và làm danh sách
  kiểm rỗng): đủ khoá, đúng exact segment ID, thứ tự khoá y hệt Pāli, không orphan, không thừa, không
  rỗng, mọi khoá NFC, số dấu lược khớp từng khoá, nháy kép cân trên cả bài, không có Pāli lọt. Script ghi
  tệp hai lần: sha256 không đổi một byte (idempotent).

  CHI TIẾT BÀI NÀY — THỨ TỰ ỨDĀNA — đếm chuỗi: phẩm **Udakāsanavagga** có 10 bài, tha-ap233 `paṭhamaṁ` →
  **tha-ap234 `dutiyaṁ` (thứ hai)** → 235 `tatiyaṁ` … `6.1` = *thứ hai*. ✓

  TÊN PHẨM dùng lại **nguyên văn** tiền lệ đang có: `Udakāsanavagga` → *Phẩm Bậc Cho Ăn* (3 bài đã
  có trong tầng). Đây là vāgga duy nhất trong lát của tôi đã có sẵn cách dịch.

  BÀI NÀY ÍT BẤT ĐỊNH NHẤT LÁT — mọi từ khóa đều có tiền lệ hoặc nghĩa không tranh luận:
  `kumbhakāro` → *người làm gốm* (Pāli `kumbha` = bình gốm; `kumbhakāra` nghĩa chắc chắn);
  `bhājanaṁ anupālesiṁ` → *ta chăm sóc bát đĩa* (`bhajana` = bát đĩa, dụng ngữ Phật giáo);
  `bhikkhusaṅghassa` → *đại chúng tỳ-kheo* (**107** tiền lệ, ví dụ `dn16:2.19.7`; bản nháp tôi viết
  *Tăng đoàn các bậc tỳ-kheo* — lặp, đã sửa); `Ekanavutito kappe` dùng lại **nguyên văn** *Từ
  chín mươi **mốt** kiếp trước,* của tha-ap243:2.1 (**đã sửa 2026-10-05**: bản ghi trước ghi
  *chín*, tức 99 — sai); `Duggatiṁ nābhijānāmi,` dùng lại *Ta không biết mình
  rơi vào khổ đau,*; `Tepaññāse ito kappe` → *Từ năm mươi ba kiếp trước* (mốc **53**, không làm tròn
  thành năm mươi); `anantajālin` giữ Pāli; `bhājanassa idaṁ phalaṁ` → *quả báo của việc chăm sóc bát
  đĩa* — khác `tha-ap156:2.4` (`buddhapūjā`) vì Pāli cũng khác.

  `1.1` `Nagare bandhumatiyā` → *Tại thành thị Bandhumatī*; `bandhumati` là tên thành, giữ Pāli
  (không dịch *họ hàng*). Cùng khuôn với `tha-ap188:1.1` `Nagare rammavatiyā` mà tôi dịch *Ở thành
  thị Rammavatī* — khác *Ở*/*Tại* nhưng cùng cấu trúc; tôi thống nhất để giữ cùng một khuôn câu.

  **SỬA LỚP LỖI SỐ PĀLI (lỗi loại 2 của quality gate — sai *số lượng*), 2026-10-05.**
  - `tha-ap234:2.1` (`Ekanavutito kappe,`) = **91**: `eka` 1 + `navuti` 90 = 91.
    Bản dịch cũ *Từ chín mươi **chín** kiếp trước,* là **99** — sai. Đã sửa thành *Từ chín mươi **mốt** kiếp trước,*. Tiền lệ trong chính tầng: 86 khoá cùng `Ekanavutito` đã viết *chín mươi mốt* (= 91) và **0** khoá nào viết *một*; 21 khoá sai nằm ở 21 tệp này (chính là số đo trước khi sửa).
  - Vế trước/sau, dấu câu và mọi thứ khác trong câu giữ nguyên y như cũ.

  **CHƯA SỬA — nghi vấn khác trong chính tệp này, xin người biên tập xác nhận:** `Tepaññāse ito kappe` (`:3.1`) đang dịch *Từ năm mươi ba kiếp trước* và notes cũ tự ghi "mốc **53**". Nếu `te` = 2 — đúng như `Tetālīse` = 42 (`tha-ap117:8.3`) và `dvāsattati` = 22 (`tha-ap302:12.2`) — thì `te` + `paññāsa` 50 = **52**, không phải 53. Tôi **KHÔNG sửa** vì ngoài 32 khoá được giao, và đây là kết luận suy từ tiền lệ chứ chưa tra điển ngữ.

  **Cổng còn lại:** bị cấm chạy `git`/`gh` và `npm run validate|test|check|build|audit|reference:gaps` ⇒ `technical_integrity` = **9,6**; bốn lệnh còn lại là `npm run validate` · `npm test` · `npm run check` · `npm run build`. Điểm **không** nâng.
