notes: |-
  Dịch trực tiếp từ Pāli root, đủ 102/102 khoá, thứ tự khoá như Pāli; commit đã ghim không có bản Anh cho toàn bộ `thi-ap`, nên không đối chiếu English cho bài này.
  Nội dung: Pañcadīpikā ở thành Haṁsavatī thấy cây bồ-đề tối thượng, mong Đức Phật thị hiện điều kỳ diệu; cây bừng sáng và hóa vàng; bà ngồi bảy ngày đêm rồi dâng lễ đèn bằng năm ngọn đèn đến sáng. Quả báo: cõi Ba mươi ba, cung điện Pañcadīpā, đèn vây quanh qua các kiếp, đến đời cuối đạt A-la-hán năm bảy tuổi.
  Đại từ ngôi thứ nhất dùng tôi, khớp thi-ap8 và thi-ap10 (cùng Phẩm Sumedhā, liền kề). Đo theo phạm vi gần nhất: Sumedhāvagga (thi-ap1–10 đã dịch) 5 bài nghiêng về tôi, 3 về con, 1 về ta; đo cả nhóm thi-ap (21 bài đã dịch) 9 bài nghiêng về tôi, 8 về con, 4 về ta; cả hai phạm vi cho tôi là nhóm đầu hoặc ngang hàng nên giữ tôi.
  `:0.3` Pāli là `Pañcadīpikātherīapadāna` không bắt đầu bằng số nên không giữ số thứ tự; translationTitle bằng đúng `:0.3`, và `:27.1` kết bằng `thứ chín`. Tên người `Pañcadīpikā` giữ Pāli.
  Hình thức `Tuyên Ngợ` ở `:0.3`/`:27.1`: nhóm thi-ap 19 khoá `Tuyên Ngợ` / 1 `Tuyên Ngôn`; nhóm tha-ap 251 `Tuyên Ngợ` / 131 `Tuyên Ngôn` / 110 `Ký Sự` / 10 `Tuyên Ngợi`. Hai phạm vi cùng nghiêng về `Tuyên Ngợ` nên giữ nhất quán với phạm vi gần nhất; chữ này có dấu hiệu là lỗi chính tả của tầng, người biên tập nên phán một lượt cho cả cuốn.
  `Sumedhāvagga` → Phẩm Sumedhā (thi-ap1–8, 10). `Haṁsavatiyā` → Ở thành Haṁsavatī theo thi-ap14 và tha-ap336 (2 chỗ) so với 5 chỗ `thành xứ Haṁsavatī` ở tha-ap; chọn theo thi-ap14, chỗ duy nhất cùng nhóm thi-ap.
  Công thức lời kết `Itthaṁ sudaṁ … abhāsitthāti` dịch nhóm `đã nói những bài kệ này` (số nhiều, khớp `imā gāthāyo`), theo thi-ap8, thi-ap14 và nhóm 407 khoá của tầng.
  Dùng lại nguyên văn tiền lệ: 44 khoá có Pāli trùng nguyên văn với tầng đã dịch (ngoài chính bài), 39 khoá dùng lại đúng chữ, 5 khoá khác chỉ ở đại từ hoặc hoa/thường hoặc vocative (7.3 hạ chữ cái đầu theo vị trí giữa câu; 15.4, 18.3, 22.2 đổi `ta` thành `tôi` theo đại từ của bài; 21.4 đổi `con` thành `tôi` và thêm `Ngài` để lộ vocative `cakkhuma`). Gồm 8.1–8.2 (`cetanāpaṇidhīhi ca` 32 khoá cùng một cách), 8.3 (18 khoá), 8.4 (`tāvatiṁsamagacchahaṁ` 33 khoá, dạng `đã đến cõi trời Ba mươi ba`), 9.1, 9.3–9.4 (thi-ap14), 14.1–14.2 (15 và 12 khoá), 15.1 `Rơi khỏi cõi trời` (8 khoá), 19.1 (3 khoá), 20.3 (thi-ap8), 21.2 (3 khoá), 22.1 `Satasahassito kappe` (27 khoá `một trăm ngàn đại kiếp trước` so với 6 khoá `kiếp trước đây`), 22.3 (97 khoá `không còn biết đến đọa xứ nào`), 23.1 (22 khoá `Các phiền não của tôi đã bị thiêu rụi`), 24.1 và 25.1 (505 khoá `Bốn vô ngại giải`), 25.3. Pāli trùng nguyên văn trong chính bài: 3 nhóm (14.3=16.1; 16.4=20.4=22.4; 23.2=24.2=25.2) và cả ba đều cho bản Việt giống nhau; 0 cặp trùng mà Việt khác. 13.2 và 13.4 (`mahesittamakārayiṁ`) trùng Pāli, chỉ khác dấu cuối `;` và `.`, Việt giống nhau; 24.3 và 25.3 chỉ khác dấu đóng ” theo Pāli.
  Số Pāli: `Saṭṭhiyojana` = saṭṭhi 60 → sáu mươi do-tuần; `tiṁsayojana` = tiṁsa 30 → ba mươi do-tuần (khớp thi-ap14); `Asīti` = 80 → tám mươi; `Satasahassito kappe` = sata 100 × sahassa 1000 = một trăm ngàn đại kiếp; `Dīpasatasahassāni` số nhiều trung tính → hàng trăm ngàn ngọn đèn (theo tiền lệ 1 khoá cùng Pāli); `Sattarattindivaṁ` = bảy ngày đêm (tiền lệ `rattindivāni` → ngày đêm); `Sattame divase` = ngày thứ bảy; `pañca dīpāni` = năm ngọn đèn; `sattavassāhaṁ` = bảy tuổi; `catasso` = bốn. Không có cụm `Tiṁsakappasahassa` trong bài này.
  Ghi nhận bất định: 13.3 `Satānaṁ cakkavattīnaṁ` — `satānaṁ` là sở hữu cách số nhiều của `sata`; dịch sát số nhiều thành `hàng trăm vị Chuyển Luân Vương`. Cách hiểu thay thế là `một trăm vị` (như số từ cùng khuôn `Vīsānaṁ cakkavattīnaṁ` ở thi-ap6 được hiểu là hai mươi ở sở hữu cách số nhiều); tầng không có tiền lệ nào cho `Satānaṁ cakkavattīnaṁ` đã dịch (thi-ap15 cùng Pāli, chưa có bản Việt tại thời điểm dịch). Không xác định được, giữ nghĩa số nhiều bám ngữ pháp.
  1.2 `cārikī` (nữ du hành, hình thái nữ của `cāraka`/`cārika`) — 0 tiền lệ trong tầng; dịch `người nữ du hành`. 1.3 `ārāmena ārāmaṁ` → `từ tu viện này sang tu viện khác` theo tiền lệ `ārāmena ārāmaṁ` (2 chỗ ghi `tu viện`); `ārāma` cũng có nghĩa vườn, nhưng ngữ cảnh của người đi tìm điều thiện nghiêng về tu viện — không chắc chắn. 1.4 `kusalatthikā` → `mong cầu điều thiện`.
  2.1 `Kāḷapakkhamhi divase` → `ngày thuộc nửa tháng tối` (kāḷapakkha → `nửa tháng tối`: 2 chỗ trong các bài kệ; ở kinh văn xuôi tầng dùng `nửa tháng trăng khuyết` cho cùng từ, nhưng ở đây không có chủ ngữ là trăng nên không theo). 2.2 `bodhimuttamaṁ` đọc là cây bồ-đề tối thượng (vì 2.4 `bodhimūle` = gốc bồ-đề) chứ không phải sự giác ngộ; tiền lệ `ta ngồi xuống dưới gốc bồ-đề` (bodhimūle upāvisiṁ, 1 chỗ).
  3.1 `garucittaṁ upaṭṭhetvā` → `khởi tâm kính trọng` (tiền lệ `garucittaṁ upaṭṭhahiṁ` → phụng sự với tâm kính trọng, 1 chỗ, khác dạng động từ); 3.3 `somanassaṁ pavedetvā` → `bày tỏ niềm hoan hỷ` (0 tiền lệ cho cả cụm). 3.4 `evaṁ cintesi tāvade` — dạng `cintesi` là ngôi thứ ba trong khi người kể ngôi thứ nhất; dịch `tôi nghĩ` theo tiền lệ thi-ap8:2.4.
  4.1–4.4: `Yadi buddho amitaguṇo` dịch `Nếu Đức Phật có phẩm đức vô lượng` (`amitaguṇo` 0 tiền lệ), `asamappaṭipuggalo` → `bậc không ai sánh bằng` (tiền lệ duy nhất `asamappaṭipuggale` dịch lệch, không theo), `dassetu` là mệnh lệnh ngôi ba nên dùng `xin Ngài thị hiện`, `pāṭihīraṁ` → `điều kỳ diệu` (tiền lệ `pāṭihāriya` trong văn xuôi dịch `thần thông`; chọn từ nhẹ hơn vì ở đây không có cụm `iddhi`).
  5.1 `Saha āvajjite mayhaṁ` → `Ngay khi tôi vừa nghĩ đến` (tiền lệ không có). 5.3 `Sabbasoṇṇamayā āsi` chủ ngữ là cây bồ-đề (nữ tính số ít) nên dịch `trở nên hoàn toàn bằng vàng` không nêu lại chủ ngữ. 5.2 `pajjali` → `bừng sáng` (tiền lệ văn xuôi `bùng cháy` dùng cho giàn hỏa táng; ở đây ánh sáng của cây nên dùng `bừng sáng`); 7.2 và 7.4 `pajjaluṁ` của đèn → `cháy sáng`; 19.4 `jalanti` → `cháy sáng`.
  6.4 `dīpapūjaṁ akāsahaṁ` → `làm lễ cúng dường bằng đèn` (tiền lệ `dhātupūjaṁ akāsahaṁ` → làm lễ cúng dường xá-lợi). 7.1 `Āsanaṁ parivāretvā` → `Vây quanh chỗ ngồi` (tiền lệ `Sambuddhaṁ parivāretvā` → Vây quanh bậc Chánh Đẳng Giác); chủ thể của hành động vây không nêu trong Pāli nên không thêm.
  9.2 `pañcadīpāti vuccati` → `được gọi là Pañcadīpā` giữ nguyên tên; Pāli không có nháy nên bản Việt không thêm nháy (dấu `ti` bỏ, theo quy ước phe BỎ). 9.3 `Saṭṭhiyojanamubbedhaṁ` → `cao sáu mươi do-tuần` theo thi-ap14 (`ubbedha` = chiều cao); tiền lệ duy nhất dịch `rộng` ở chỗ ngoài lát này, chỉ báo, không sửa.
  10.3 `Yāvatā devabhavanaṁ` → `trọn khắp nơi ở của chư thiên` — `devabhavana` có thể là cung điện hoặc cõi trời; tầng gần như không có tiền lệ (1 chỗ trong văn xuôi `cõi trời`), nên ghi bất định. 11.1 `Parammukhā nisīditvā` → `Ngồi quay mặt đi` (nghĩa đen `quay mặt đi chỗ khác`, 0 tiền lệ trong ngữ cảnh này; không thêm hướng cụ thể). 11.3 `Uddhaṁ adho ca tiriyaṁ` theo tiền lệ `Trên, dưới, và bốn phía` (1 chỗ); `tiriyaṁ` nghĩa đen là bề ngang.
  12.2 `daṭṭhuṁ sugataduggate` → `để thấy những ai ở cảnh giới tốt và cảnh giới xấu` theo công thức `sugate duggate` ở mn108:22.1 (`ở cảnh giới tốt và cảnh giới xấu`); `sugata`/`duggata` cũng có thể hiểu giàu sang/khốn cùng nhưng không chọn vì công thức thiên nhãn là tiền lệ gần nhất. 12.3–12.4 `āvaraṇaṁ` → `vật cản`.
  13.2 và 13.4 `mahesittamakārayiṁ` → `đã giữ ngôi hoàng hậu` (4 chỗ cùng Pāli dịch `đã giữ ngôi hoàng hậu`; 4 chỗ khác cùng Pāli `mahesittamakārayiṁ` dịch `tôn vinh Đại Ẩn Sĩ`; chỉ báo, không sửa). 14.4 và 10.2 `parivāre jalanti me` → `cháy quanh tôi`.
  15.2 `uppajjiṁ mātukucchiyaṁ` → `đã sinh vào bụng mẹ` (tiền lệ `nibbattiṁ mātukucchiyaṁ`). 16.2 `puññakammasamaṅgitā` là hình thái nữ tính số ít, chỉ người nói; dịch `với tôi, người đầy đủ phước nghiệp` (tiền lệ `puññakammasamaṅgino` → đầy đủ phước nghiệp, 2 chỗ). `sūtikāgehe` → `phòng sinh` (0 tiền lệ).
  17.2 `mānasaṁ vinivattayiṁ` → `xoay chuyển tâm ý` — nghĩa đen là quay tâm trở lại/xoay đi; Pāli không nói quay khỏi cái gì nên không thêm; 0 tiền lệ. 17.3 `Ajarāmataṁ sītibhāvaṁ` → `không già, bất tử, trạng thái mát lạnh` (`ajarāmara` → không già không chết; `sītibhāvaṁ` → mát lạnh: `Sītibhāvasutta` → Kinh Mát Mẻ); đồng vị với Niết-bàn ở 17.4.
  18.1 `Jātiyā sattavassāhaṁ` → `Lên bảy tuổi kể từ khi sinh ra`; 18.3–18.4 `Upasampādayī buddho, guṇamaññāya gotamo` theo tiền lệ `guṇamaññāya cakkhumā` (2 chỗ `sau khi biết rõ phẩm đức`) và `Upasampādayī buddho` (`đã cho ta thọ cụ túc giới`); chủ thể ghép `Gotama` làm đồng vị với `Buddho` nên để `Gotama, sau khi biết rõ phẩm đức` — Pāli không nêu phẩm đức của ai nên không thêm `của tôi`.
  19.1 `Maṇḍape` → `lều` theo thi-ap14 và 3 chỗ; `maṇḍapa` cũng có thể là mái che/nhà rạp. 19.2 `pāsādesu guhāsu vā` → `trong các lâu đài hay các hang động` (số nhiều theo vị trí cách). 19.3 `Suññāgāre vasantiyā` → `khi tôi ở trong ngôi nhà trống` theo thi-ap14:19.2.
  20.1 `Dibbacakkhuvisuddhaṁ` → `Thiên nhãn thanh tịnh` (0 tiền lệ cho dạng ghép); 20.2 `samādhikusalā` → `thiện xảo về định` (tiền lệ `samādhikusalo muni` → bậc ẩn sĩ thiện xảo về định tĩnh, 2 chỗ; `thiện xảo về` còn dùng ở thi-ap8:14.1).
  21.1 `Sabbavositavosānā` → `đã hoàn tất mọi điều cần hoàn tất` (1 tiền lệ `Sabbavositavosānaṁ` dịch `đã hoàn tất mọi sự tu tập` có thêm `tu tập`, không theo). 21.3 `Pañcadīpā mahāvīra` — `Pañcadīpā` hình thái nữ tính số ít, các tính từ liền trước cũng nữ tính số ít chỉ người nói, nên đọc là tên bà (rút gọn của `Pañcadīpikā`) chứ không phải `năm ngọn đèn` số nhiều; `mahāvīra` → `bạch bậc Đại Anh Hùng` theo thi-ap37:13.3. Chưa có tiền lệ nào của `Pañcadīpā` trong tầng (thi-ap15 cùng Pāli, chưa dịch).
  Nháy: Pāli mở `“` ở 1.1 và đóng `”` ở 25.3; lời tự nhủ mở `‘` ở 4.1 và đóng `’` ở 4.4. Bản Việt khớp Pāli từng khoá, 0 lệch trên 102 khoá. `…pe…` ở 23.2, 24.2, 25.2 → đúng một `…`; Pāli không có `(…)` trần ở khoá nào nên bản Việt cũng không có.
  Tự kiểm: tập khoá Việt = tập khoá Pāli (102/102, cùng thứ tự); 0 khoá rỗng, NFC, 0 khoảng trắng thừa; không có từ Pāli lọt vào Việt ngoài tên riêng (Therīapadāna, Sumedhā, Pañcadīpikā, Pañcadīpā, Haṁsavatī, Gotama). Bản Việt mới dịch xong, chưa có lượt review đối kháng riêng ngoài các phép tự kiểm này.
