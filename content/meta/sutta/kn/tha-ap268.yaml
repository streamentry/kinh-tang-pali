notes: |-
  Đã đọc HẾT Pāli lát ở `f121.pali.txt` trước khi viết chữ nào. 16 khoá, tất cả đã dịch.

  TẦNG THAM KHẢO — 0/16 có Anh Sujato (edition `translation/en/sujato` tại commit đã ghin có **0 tệp `kn/`**),
  không có Việt hiện hành, không có lớp lấp `english-project`. ⇒ `draft`, `triangulation` 7.0.

  `Itthaṁ sudaṁ āyasmā … thero imā gāthāyo abhāsitthāti.` dùng lại **nguyên văn** khuôn đã có trong tầng:
  *Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này.* Trong 69 tệp `tha-ap` đã có, dạng này
  41 lần và dạng *đã từng nói bài kệ này* 28 lần, nên tôi theo đa số **trong chính tác phẩm này** (như
  tha-ap243 và tha-ap313 cũng vậy). Công thức này **không có vocative** trong Pāli, nên bản dịch không thêm lời
  hô nào; cũng vì vậy chỗ nào Pāli **không** có `bhagavā/bhagavato` thì tôi không dùng “Đức Thế Tôn”.

  `3.1–3.3` dùng lại nguyên văn công thức của tha-ap243: *Bốn vô ngại giải,* / *…* / *đã làm tròn lời dạy
  của Đức Phật”.* Dấu lược ở `3.2` **giữ đúng một** `…` theo BRIEF_VI3 §10.1 (Pāli ghi `…pe…`), không mở rộng:
  công thức `Chaḷabhiññā sacchikatā` chỉ xuất hiện ở hai bài `tha-ap` khác (tha-ap243, tha-ap313) và ở đây
  Pāli đã lược, nên viết thêm là thêm chữ không nguồn nào chứng thực. Trong tầng có 27 tệp dùng đúng một `…`
  cho `…pe…`, tôi theo.

  Số thứ tự uddāna đã đối chiếu **chuỗi trong phẩm**, không suy từ tên uid:
  · `tha-ap268` là số 6 trong `Padumukkhipavagga` (263–272): 263 `paṭhamaṁ`,
  264 `dutiyaṁ`, 265 `tatiyaṁ`, 266 `catutthaṁ`, 267 `pañcamaṁ`, 268 `chaṭṭhaṁ`. Khớp `5.1`.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điền phối, nên
  `technical_integrity` bị chặn ở **9.6**. Bốn lệnh đó để người điền phối chạy. Tôi đã tự tái lập bằng script
  những kiểm mà `validate` làm cho tầng Việt: đủ 16 khoá với đúng segment ID, 0 orphan, 0 rỗng, mọi khoá NFC,
  dấu lược khớp Pāli **từng khoá**, không có `(…)`, ngoặc kép `“”` cân trên cả bài, và không có Pāli lọt
  vào bản Việt. Đây **không** thay thế được `validate`.

  **TÊN PHẨM LÀ CHỖ YẾU NHẤT LÁT, TÔI GHI RÕ THAY VỌNG.** `Padumukkhipavagga` có **0 tiền lệ** trong
  tầng, và tôi **không xác minh được** nghĩa chắc của `padumukkhi` từ tầng nào. Điều đo được: ở 41 trong 43
  phẩm `tha-ap`, phẩm mang tên phần tử đầu tiên của nó (`Ārakkhadāyakavagga` ← `Ārakkhadāyaka`,
  `Udakāsanavagga` ← `Udakāsanadāyaka`, `Suvaṇṇabibbohanavagga` ← `Suvaṇṇabibbohani`), nhưng
  `Padumukkhipavagga` (263–272) **không** có phần tử nào tên Padumukkhi, nên nó là tên theo chủ đề, không theo
  người. Tôi dịch theo hình ảnh chữ nghĩa — *Phẩm Bậc Tay Nắm* (`padu`/`pāda` + `mukkhi` = tay nắm đóng) —
  và **không** bịa thêm công đức nào cho cả phẩm. `terminology` 9.0 và `ambiguity_integrity` 8.8 là vì lý do
  này. Người điền phối có thể chọn giữ nguyên Pāli `Padumukkhi` nếu thấy an toàn hơn.

  `1.2 ukkuso`. `ukkusa` là “nhảy/lặn vào”, danh từ `ukkuso` là *kẻ lặn*; tôi dịch *kẻ lặn nước*. Có thể
  đọc là “ta đã lặn xuống đó”, nhưng cả hai cho cùng một nghĩa.

  `Candabhāgā` giữ dấu Pāli (tên sông), `Siddhattha` giữ dấu Pāli (tên Đức Phật) — cùng văn phong với
  `Sāvatthī`/`Kassapa` đã có trong tầng. `siddhatthamunino` = *bậc thiện nhân Siddhattha*: `munino` là cách
  sở hữu của *bậc thiện nhân*, và tiền lệ *bậc thiện nhân* đã có (tha-ap313).

  **SỬA LỚP LỖI SỐ PĀLI (lỗi loại 2 của quality gate — sai *số lượng*), 2026-10-05.**
  - `tha-ap268:2.1` (`Catunnavutito kappe,`) = **94**: `catu` 4 + `navuti` 90 = 94.
    Bản dịch cũ *Từ bốn mươi **chín** kiếp trước,* là **49** — sai (vế `bốn mươi` là mười, chứ không phải bốn). Đã sửa thành *Từ chín mươi **tư** kiếp trước,*. Tiền lệ trong chính tầng: 88 khoá cùng `Catunnavutito` đã viết *chín mươi tư*/*bốn mươi tư* (= 94) so với 10 khoá sai (= 49); chọn *chín mươi tư* theo đa số, đồng thời giữ dạng Hán–Việt của câu cũ.
  - Vế trước/sau, dấu câu và mọi thứ khác trong câu giữ nguyên y như cũ.

  **Cổng còn lại:** bị cấm chạy `git`/`gh` và `npm run validate|test|check|build|audit|reference:gaps` ⇒ `technical_integrity` = **9,6**; bốn lệnh còn lại là `npm run validate` · `npm test` · `npm run check` · `npm run build`. Điểm **không** nâng.
