notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ `tha-ap`/`thi-ap`.
  Tiền lệ đếm được: 20/40 khoá có Pāli trùng nguyên văn trong tầng. 0.1 `Therāpadāna`
  giữ nguyên Pāli (291/300 tệp tha-ap). 0.2 `Ekapadumiyavagga` → Phẩm Ekapadumiya (4/6;
  tha-ap346 và 351 dùng Phẩm Bậc Một Hoa Sen). 0.3 và 11.1 → Bài Kệ Tuyên Ngợ Về Trưởng
  Lão X, thứ N. (0.3: 162/305 nhóm Tuyên Ngợ; 11.1: 140/305 đúng dạng này).
  Công thức dùng lại nguyên văn: `Candabhāgānadītīre` → Bên bờ sông Candabhāgā (10 cặp);
  `Addasaṁ virajaṁ buddhaṁ` → Tôi đã trông thấy Đức Phật ly trần; `Obhāsentaṁ disā
  sabbā` → Ngài tỏa sáng khắp mọi phương trời; `sālarājaṁva phullitaṁ` → rực rỡ tựa cây
  sala nở hoa (tha-ap169); `Udaggacitto sumano` → Với tâm phấn khởi, hoan hỷ (snp5.1);
  `vippasannena cetasā` → với tâm trong sáng; `pakkāmiṁ uttarāmukho` → rồi con quay mặt
  hướng bắc mà đi; `Tena kammena sukatena` → Nhờ nghiệp lành khéo làm ấy;
  `cetanāpaṇidhīhi ca` → cùng với tâm nguyện và chí hướng; `Jahitvā mānusaṁ dehaṁ` →
  Từ bỏ thân người (tha-ap426/494/496); `tāvatiṁsamagacchahaṁ` → ta đã đến cõi trời Ba
  mươi ba; `devarajjaṁ akārayiṁ` → ta đã làm ra vương quyền nơi chư thiên (tha-ap347);
  `cakkavattī ahosahaṁ` → ta đã làm Chuyển Luân Vương; `Ekanavutito kappe` → Vào
  chín mươi mốt kiếp trước đây; `Duggatiṁ nābhijānāmi` → Tôi không còn biết đến đọa xứ
  nào; `buddhapūjāyidaṁ phalaṁ` → đó là quả báo của việc cúng dường Đức Phật (24 cặp).
  Ghi nhận bất định: `Lakkhaṇabyañjanūpetaṁ` (2.3) không có tiền lệ nào trong tầng; đọc
  là Đấng Có Dấu Hiệu Và Căn Tính, dịch theo hai thành phần `lakkhaṇa` (dấu hiệu) và
  `byañjana` (căn tính, cách diễn đạt), không ghi chú thêm trong thân kinh.
  `Selantare patitvāna` (5.3) cũng không có tiền lệ; `patitvāna` ở đây là rơi xuống bờ
  (nối với `pāpuṇiṁ jīvitakkhayaṁ` = tận cùng đời sống), nên dịch Khi ngã ngự xuống
  bờ sông. 3.2 `haṭṭhamānaso` dịch vui vẻ với tâm cười mỉm; 4.1 `Pupphāni abhiropetvā`
  và 3.3 `Tīṇi uppalapupphāni` là hai lần nhặt hoa khác nhau trong cùng bài nên giữ hai
  vế khác nhau (3.3 ta cầm lấy, 4.1 dâng lên). Tên `Tīṇuppalamāliyo` chứng thực trong
  chính Pāli bài này ở 10.1, nên giữ dạng Pāli ở 0.3 và 11.1 như đã khai trong tầng Việt.
  `…pe…` ở 9.2 giữ đúng một dấu lược; nháy kép mở ở 1.1, đóng ở 9.3.
