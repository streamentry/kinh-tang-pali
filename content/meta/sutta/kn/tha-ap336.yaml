notes: |-
  Bản dịch chỉ từ Pāli root, đối chiếu tiền lệ tầng Việt của chính dự án (tha-ap), vì commit đã ghim không có bản Anh upstream (giới hạn upstream, không phải lỗi người dịch).
  Số Pāli: Kappasatasahassāni = 100.000 kiếp (sata 100 × sahassa 1000); Satasahassito kappe = một trăm ngàn kiếp trước, cùng giá trị; Chattiṁsakkhattuṁ = 36 lần (cha 6 + tiṁsa 30); Tettiṁsakkhattuṁ = 33 lần (te 3 + tiṁsa 30), khớp tha-ap421:6.1 và 6.3 là 36 và 33. Bất định đã nêu: giá trị tiṁsa = 30 là kết quả đo trong tầng (tāvatiṁsa là cõi Ba mươi ba; tiṁsayojana là ba mươi do-tuần ở tha-ap342), chưa có bản Anh độc lập nào kiểm lại; bài này không có cụm Tiṁsakappasahassa nên không đụng đến cách đọc 3.000 hay 300.000 kiếp.
  Từ vựng và chỗ khó, không bịa: (1) 4.2 `natthi me koci dāyako` dịch sát là tôi không có người ban tặng nào; cũng có thể hiểu là không có ai cho tôi thêm vật gì, nên bản dịch giữ nghĩa chữ và không thêm tân ngữ. (2) 10.2 đến 10.6 chuyển ngôi trong chính Pāli: tuvaṁ (ngươi) ở 10.2 nhưng labhissati (ngôi ba) ở 10.6; bản dịch giữ nguyên ngôi ở 10.2 và bỏ chủ ngữ ở 10.6. `bhave` ở 10.2 có thể là vị trí cách của bhava (trong cõi hữu, cách đã chọn) hoặc thể cầu khiến của động từ hiện hữu (ngươi sẽ là, có dung mạo đẹp…); không loại trừ được cách sau. (3) 10.4 `anavakkantadehavā` dịch thân thể không bị xâm hại theo nghĩa avakkanta là bị tràn vào hay bị chế ngự; không có tiền lệ trong tầng. (4) 10.5 `akkhobhaṁ` dịch không thể lay chuyển; không có tiền lệ trong tầng. (5) 14.1 `cakkavāḷamupādāya` dịch kể cả thế giới này, theo tiền lệ cakkavāḷa là thế giới (bv29:12.4, dn16:6.28.20) và upādāya là bao gồm; tha-ap345:6.1 tới 6.4 bỏ dòng này nên không có tiền lệ cho riêng nó. (6) 16.2 `najjhagaṁ katthacikkhayaṁ` dịch tôi không gặp sự cạn kiệt ở bất cứ nơi nào, chủ thể của cạn kiệt là quả báo ở 16.1. (7) 16.4 `vipaccati idhāpi me` không nêu chủ ngữ; đã hiểu chủ ngữ là quả báo ở 16.1. (8) 6.2 `ukkuṭṭhiṁ sampavattayiṁ` dịch cất tiếng hoan hô; không có tiền lệ trong tầng. (9) 9.5 `Padesarajjaṁ vipulaṁ`: tầng có 12 khoá dịch Vương quốc rộng lớn ấy và 3 khoá dịch Vương quyền cai quản các vùng đất rộng lớn; dùng Vương quốc rộng lớn, bỏ chữ ấy vì Pāli không có đại từ chỉ định và ở đây không có tiền ngữ. (10) 11.2 `jalajuttamanāmako` theo tiền lệ 5 khoá được gọi là bậc Tối Thượng Tựa Hồng Sen. (11) 4.4 `ropayissāmi dakkhiṇaṁ` dịch gieo trồng sự cúng dường; tầng không có tiền lệ cho động từ ropeti trong dạng này.
  Tiền lệ đã đo trong tầng: Satasahassito kappe là đại kiếp 21 trên 31 khoá (hai bài liền kề tha-ap337 và tha-ap342 đều dùng đại kiếp), nên 8.3 dịch một trăm ngàn đại kiếp cho thống nhất trong bài; Duggatiṁ nābhijānāmi với ngôi tôi là đọa xứ 86 so với khổ xứ 51; Kilesā jhāpitā là thiêu rụi 132 khoá; Nāgova bandhanaṁ chetvā là như thớt voi bẻ gãy mọi trói buộc 12 trên 15; Paṭisambhidā catasso là Bốn vô ngại giải 471 trên 476; công thức kết Itthaṁ sudaṁ dùng nhóm số nhiều những bài kệ này (407) chứ không dùng nhóm số ít (21). Pāli trùng với tầng ở 43 khoá có nội dung; 27 khoá dùng lại nguyên văn, 16 khoá viết khác vì khác ngôi hoặc khác ngữ cảnh. Pāli trùng trong chính bài: 1 cặp (12.4 và 17.4, ekadussassidaṁ phalaṁ) dịch giống hệt nhau.
  Tên phiên: `:0.3` Pāli không bắt đầu bằng số nên không giữ số thứ tự, translationTitle bằng đúng giá trị `:0.3`. Cách viết Tuyên Ngôn chọn theo đa số của chính phẩm Gandhodaka và đã sửa chính tả, không dùng dạng Tuyên Ngợ: đo trong tha-ap333 đến tha-ap342 thì Tuyên Ngôn 5, Tuyên Ngợ và Tuyên Ngợi gộp 2; đo trong tha-ap326 đến tha-ap346 thì Tuyên Ngợ và Tuyên Ngợi gộp 9, Tuyên Ngôn 6, Ký Sự 1; đo trong tha-ap300 đến tha-ap370 thì Tuyên Ngợ và Tuyên Ngợi gộp 48, Tuyên Ngôn 10, Ký Sự 8; toàn tầng Tuyên Ngợ và Tuyên Ngợi gộp 250, Tuyên Ngôn 118, Ký Sự 101 — các phạm vi phân kỳ, người biên tập cần phán một lượt cho cả cuốn. Lời kết 21.1 dịch thứ tư theo đa số tầng. Tên phẩm Gandhodakavagga dịch Phẩm Gandhodaka theo các tệp liền kề.
  Đã kiểm trên cả 84 khoá: tập khoá Việt bằng tập khoá Pāli và cùng thứ tự; nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch trên 84); dấu lược chỉ có ở 19.2 và khớp Pāli; chuỗi NFC; không khoảng trắng thừa, không khoá rỗng; không Pāli lọt sang Việt ngoài tên riêng.
  Chưa chạy được các cổng của kho trong lượt này: npm run validate, npm test, npm run check, npm run build; technical_integrity 9.6. Status bắt buộc draft do blocker tầng tham khảo Anh.
  Lượt cải thiện 2026-10-11 (kiểm toán đối kháng họ tha-ap; đọc lại cả 84 khoá cặp Pāli↔Việt, đối chiếu họ lỗi đã biết: không có Migaluddo, caṅkami, apothayi, anāsave sai nghĩa, saḷala, kuñjara, kārayiṁ, bījanī, tiṁsa hiểu sai; adāsahaṁ ở 5.4 là đã dâng, đúng; 36 và 33 ở 9.1, 9.3 đúng; haṁsā là thiên nga, đúng). Sửa 5 khoá: (1) 20.1 `Itthaṁ sudaṁ … abhāsitthāti` trước dịch Tôi nghe như vầy: …; đây là lỗi nghĩa thật, đưa vào một người kể xưng tôi và công thức evaṁ me sutaṁ mà Pāli không có (itthaṁ là như vậy, sudaṁ là tiểu từ nhấn, chủ ngữ là trưởng lão), nay Như vậy, Tôn giả Trưởng lão Ekadussadāyaka đã nói những bài kệ này. Lỗi này là dạng LAN trong tầng: 555 khoá dùng cùng khung Tôi nghe như vầy, chỉ 2 khoá dùng khung khác; ghi cho người biên tập sửa một lượt cho cả họ, bài này đã tự sửa nên lệch số đông tầng có chủ ý. (2) 9.5 `Padesarajjaṁ vipulaṁ` trước Vương quốc rộng lớn, bỏ mất padesa (một vùng); nay Vương quyền cai quản các vùng đất rộng lớn, theo 3 khoá tầng dịch đúng đủ nghĩa; 12 khoá dịch Vương quốc rộng lớn ấy cũng bỏ padesa, ghi để sửa sau. (3) 14.1 `Cakkavāḷamupādāya` trước Kể cả thế giới này, thêm chữ này không có trong Pāli; nay Tính từ vòng thế giới trở vào, theo tiền lệ upādāya là từ đó trở đi (tha-ap142:4.1, tha-ap413:24.3) và tha-ap424:15.1 cùng Pāli. (4) 4.1 `Idaṁ me sāṭakaṁ ekaṁ` trước Đây là tấm vải duy nhất của tôi, duy nhất mạnh hơn ekaṁ (một); nay Tôi có một tấm vải này, không đoán thêm là không còn vật nào khác. (5) 7.3 `Mama dānaṁ pakittento` trước Tuyên bố việc cúng dường của tôi (dānaṁ bị gộp với dakkhiṇaṁ ở 4.4); nay Ngợi ca sự dâng cúng của tôi, theo tiền lệ pakitteti là ngợi ca/tán dương (tha-ap413:26.3, tha-ap486:18.1) và cùng Pāli ở tha-ap424:7.3. Phân loại: 1 lỗi nghĩa thật (20.1), 1 bỏ từ (9.5), 3 chính xác sắc thái (4.1, 7.3, 14.1); tổng 5/84 khoá đổi, tức khoảng 6%. Điểm đổi: semantic_fidelity 8.8 sang 9.0; final_score 9.04 sang 9.06; các tiêu chí còn lại giữ nguyên, kể cả terminology 9.0 vì khoá 20.1 nay lệch số đông tầng, và ambiguity_integrity 8.7 vì bất định ở 4.2, 10.2, 10.4 vẫn chưa phân xử được.
  Chủ ý giữ dù nghi ngờ nhẹ: 18.3 `bandhanaṁ` dịch mọi trói buộc có thêm chữ mọi không có trong Pāli (tầng theo 15 trên 25 khoá); 3.4 `ca` dịch bằng mà; 17.3 `nābhijānāmi` dịch không còn biết, chữ còn thêm sắc thái; 4.2 `dāyako` người ban tặng (tha-ap424:4.2 cùng Pāli dịch thí chủ) vẫn mơ hồ đối tượng của việc ban tặng; 0.3 Tuyên Ngôn so với Tuyên Ngợ chưa phân xử toàn tầng. Ghi nhận khác: tầng dịch satthā là bậc Thầy ở khoảng 56 khoá trong khi đúng là Bậc Đạo Sư; bài này không có satthā nên không sửa lẻ. Pāli trùng nguyên văn trong chính bài: 1 cặp (12.4 và 17.4) vẫn dịch giống nhau; so với tầng, 73 khoá Pāli có trùng và 32 khác (phần lớn khác vì ngôi ta/tôi và quả/quả báo). Kiểm lại sau sửa: tập khoá và thứ tự Việt bằng Pāli (84 trên 84), nháy khớp Pāli từng khoá (0 lệch), dấu lược chỉ ở 19.2 và khớp Pāli, NFC, không khoảng trắng thừa. Chưa chạy được npm run validate, npm test, npm run check, npm run build; technical_integrity giữ 9.6.

  Rà soát lỗi lặp 2026-10-15 (đợt 2, đối chiếu Pāli đã ghim; không có bản Anh hay Việt độc lập cho
  tầng này): sửa tha-ap336:8.3, tha-ap336:17.1 `kappa` đổi "đại kiếp" thành "kiếp", vì Pāli không có
  `mahā` (cùng cách đã sửa ở tha-ap340:20.1; tầng đa số dịch "kiếp"). Các khoá khác của bài không đổi.

  Quyết định hội đồng biên tập 2026-10-16: C5 — 0.3, 21.1 (tiêu đề và dòng kết dùng "Ký Sự Về Trưởng Lão …" thay "Bài Kệ Tuyên Ngôn"); B20 — 8.2 (`cetanāpaṇidhīhi` = nhờ những ước nguyện của tâm); C6 — 6.4 (xưng hô theo mục 9: lời thưa Đức Phật xưng "con").
