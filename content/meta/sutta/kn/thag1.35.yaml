notes: |-
  9 khoá, phủ đủ, dấu lược `…` ở `1.5` giữ nguyên. Không có blocker. Bài sạch.
  
  **Cấu trúc nhân quả của kệ được giữ trọn vẹn.** Kệ nói: ai tìm cầu sự an lạc thì **được an lạc ngay đời này**, lại còn **được danh tiếng** — và nói tiếp **ai** làm điều đó: kẻ mang đủ bát chánh đạo và giữ nó thẳng ngắn thì tu tập con đường chứng bất tử. Bản dịch giữ đúng cả bốn mắt xích và **thứ tự** của chúng, vốn là điều dễ hỏng: `1.1` (*Ai tìm cầu sự an lạc thì được an lạc ngay ở đời này*) → `1.2` (*lại còn đạt được danh tiếng*) → `1.3` (*Kẻ nào mang đủ bát chánh đạo, thẳng ngắn*) → `1.4` (*thì tu tập con đường để chứng đạt bất tử*).
  
  **`tadācaraṁ` → *ngay ở đời này*.** Đây là điểm mấu chốt của vế đầu: ngay trong kiếp này, không phải kiếp sau. Bản dịch giữ đúng. Đây cũng là chỗ dễ lướt mất vì Sujato dịch vắng (`Seeking happiness, they find it through this practice.`) — bản dịch đứng vững bằng Pāli.
  
  **`ariyamaṭṭhaṅgikamañjasaṁ ujuṁ` → *mang đủ bát chánh đạo, thẳng ngắn*.** `uuj`/`ujju` = thẳng, ngay thẳng ✓; `mañjasa` = có trang bị, mang theo ✓. Bản dịch tách `mañjasa` và `ujju` thành hai vế bằng dấu phẩy — hợp lý.
  
  **`Bhāveti maggaṁ amatassa pattiyā` → *thì tu tập con đường để chứng đạt bất tử*.** `pattiyā` (tương lai của √pāṭ) = để đạt được ✓; `amatassa` = bất tử ✓.
  
  **Sujato lệch chiều ở `1.3`–`1.4`** (Sujato đặt *those who develop the direct route* ở `1.3` và *the noble eightfold path…* ở `1.4`, trong khi Pāli `1.3` là `ariyamaṭṭhaṅgikamañjasaṁ ujuṁ`). Bản dịch bám Pāli — lần thứ năm thấy Sujato lệch trong lô.
  
  **`kittiyasassa vaḍḍhati` → *danh tiếng của người ấy càng tăng*.** `vaḍḍhati` = tăng, lớn lên ✓ giữ đúng thì tiến trình.
  
  **Tên riêng:** `Sāmaññakāni` giữ nguyên dấu ở `0.4` và `1.5` ✓.
  
  **Tầng Anh** có mặt đủ bốn vế.
  
