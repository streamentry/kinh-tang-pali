  HAI CON SỐ `bhante` / `mahārāja` — xem kỹ ở `mil3.7.1.yaml`, áp dụng y hệt cho đây.
    Toàn tầng `mil`: `bhante` 583 lần → *thưa tôn giả* 311/297 tệp; `mahārāja` 1.545 lần →
    *này Đại vương* 688/644 tệp. Trong hai bài mil của lát: `bhante` 11 lần / 10 khoá (3 khoá
    có PĦLI trùng nguyên văn), `mahārāja` 29 lần / 27 khoá (**0** khoá có PĦLI trùng nguyên
    văn). Bản nháp đầu đã dùng *tâu đại vương*; đo lại bằng cụm đầy đủ thì đa số là
    *này Đại vương* ⇒ đã sửa cả hai bài, không sửa riêng bài này.

  BẤT ĐỊNH — đã phán.
    · `vatthaguha` (`3.1`, `3.3`, `3.4`, `4.1`, `14.1`) dịch **điều bí mật căn bản**. 0 tiền lệ
      cho cụm này trong cả tầng. Nghĩa là *điều bí mật gốc rễ*; tôi chọn *bí mật căn bản* vì
      bối cảnh (Bà-la-môn Sela học Veda, Đức Thế Tôn chỉ điều cốt lõi). Tầng `name` đã ghim
      đặt `mil5.3.3` là *Showing the Buddha's Private Parts* — cách đó của Sujato quá thô,
      tôi không theo.
    · `kosohitaṁ` dịch *đã học hỏi*; `kosohita` là *đã khảo sát học thuộc*.
    · `subhanimittaṁ hīḷento garahanto jigucchanto` (`10.2`) là bộ ba *làm sáng / chê bai /
      làm ghê tởm*; tôi dịch *tùy tình tốt xấu mà hoặc tán dương, hoặc chê bai, hoặc làm cho
      ghê tởm*. `kakuṭapādiniyo accharāyo` dịch *đầy gai góc, chẳng mượn mà đẹp đẽ*. 0 tiền lệ.
    · `bhaggā paravādā` (`13.1`) dịch *phe đối nghịch*; `bhagga` là phe/bang, `paravādā` là
      *nói chống lại*. 0 tiền lệ cho cụm này.
    · `13.1` là công thức tụng dụng có tiền lệ ở `mil3.1.12/.13/.14`; tôi giữ đúng cấu trúc
      bảy vế và dùng *ngươi* cho `tvaṁ/tayā` như các bài lân cận, vì đây là lời tán dương
      cố định của vua.

  LỖI REVIEW ĐỐI KHÁNG ĐÃ SỬA.
    · `3.1` `Puna ca` bản nháp dịch *Nữa,* — cộc; đã sửa thành *Lại nữa,*.
    · Sáu chỗ có `pana` / `vā` / `Yadi` đứng **trước** `mahārāja` trong PĦLI; dịch theo thứ tự
      đó ra *Nhưng này Đại vương*, *Hoặc này Đại vương* — đọc cộc. Đã dời xưng hô lên đầu câu
      (*Này Đại vương, nhưng …* / *Này Đại vương, hoặc …*) để vừa giữ nghĩa vừa giữ thứ tự
      đại từ. Bốn lệnh này đã đo lại trên PĦLI, không phải sửa cho hay.

