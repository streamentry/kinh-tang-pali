  LỖI NGHĨA THẬT ĐÃ SỬA (bản cũ sai nghĩa, không phải sửa văn):
    · `vatthaguyha` (3.1, 3.3, 3.4, 4.1, 14.1, và `0.4`/`translationTitle`): bản cũ "điều bí mật căn bản" là
      sai. `vattha` = y phục, `guyha` = điều phải giấu ⇒ bộ phận kín dưới y; `kosohita` = thu kín trong vỏ bọc.
      Cùng cụm `kosohitaṁ vatthaguyhaṁ` ở dn3, dn14, dn30 đã dịch "nam căn được vỏ bọc che kín" (8 khoá, 0 khoá
      dịch khác) ⇒ dùng lại. `guyha` đứng riêng (5.1, 7.2, 9.1…) dịch "chỗ kín". Bài toàn về việc Đức Phật dùng
      thần thông cho thấy *hình bóng* (`chāyā`) của bộ phận ấy; bản cũ vì dịch sai nên mất hẳn mạch lập luận.
    · `kaṅkhā uppannā` (4.2, 5.7, 6.3): bản cũ "lòng khao khát" sai; `kaṅkhā` = nghi hoặc.
    · `kulaputta` bản cũ "người quy tông" (vô nghĩa) → "thiện nam" (288/310 khoá có `kulaputta` trong tầng).
    · `3.1`/`3.3`/`3.4`: bản cũ chuyển "yaṁ vacanaṁ" thành mệnh đề nhân quả (*vì Đức Thế Tôn đã chỉ bày…*); đúng
      là hai mệnh đề đối nghịch: nếu A thì lời nói B sai; nếu B thì lời nói A sai.
    · `5.3`: bản cũ "người bệnh sắp chết" (thêm nghĩa); Pāli chỉ nói người bệnh được bà con bạn hữu vây quanh,
      là câu hỏi (`diṭṭhapubbo … tayā`, đáp "Āma").
    · `5.1`: bản cũ cụt giữa câu ("… không thấy được thì"); `5.2` thiếu `iṅgha` và `saññāpehi`.
    · `5.5–5.6`: `vedanā` là cảm thọ của người bệnh, không phải "cảm giác"; `5.6` giữ cả hai `bhante`.
    · `6.1`: `bhūto āviseyya` = có ma nhập vào một người; bản cũ "người ấy nhắm vào bất cứ ai" sai.
    · `7.1`: `ekassapi adassanīyaṁ` = điều dù với một người cũng không nên cho thấy (bản cũ: "ngay cả một người cũng
      không thấy được").
    · `7.4–7.5`: bản cũ "Thật khó lẽ nữa… phải làm thế nào", "cố làm thế nào" — vô nghĩa; `kiriyaṁ hāpeyya` = bỏ
      việc làm ấy.
    · `8.1`: `vamanīyaṁ vameti, virecanīyaṁ vireceti, anulepanīyaṁ anulimpeti, anuvāsanīyaṁ anuvāseti` là các
      phép chữa (cho nôn, cho xổ, xoa thuốc, cho thụt) tùy người; bản cũ đọc thành "thuốc gây nôn thì thuốc gây
      nôn…". `sallakatta` = thầy thuốc phẫu thuật.
    · `9.1`: `mūḷhagabbhā` = người đàn bà bị thai nghẽn (mn86:14.2 "thai bị nghẽn"); bản cũ "đang có thai" mất
      nghĩa. `9.2`: bản cũ "sẽ chỉ bày" (tương lai) sai thì; Pāli là `dassesi` quá khứ.
    · `9.4`: `hadayaṁ` = tim (132/189 khoá); bản cũ "tâm can".
    · `10.1`: `adhimutti` = khuynh hướng (6/7 khoá), bản cũ "sự giải thoát"; `devabhavana` = cõi trời.
    · `10.2`: bản cũ bịa cả câu ("tùy tình tốt xấu mà tán dương…", "lời lẽ đầy gai góc, chẳng mượn mà đẹp đẽ").
      Pāli: Như Lai khinh miệt, chê trách, ghê tởm `subhanimitta` (tướng đẹp) và chỉ cho thấy `kakuṭapādiniyo
      accharāyo`; cùng cụm ở ud3.2 dịch "thiên nữ chân bồ câu" (3 khoá) ⇒ dùng lại.
    · `11.1`: `bhātarā nikkaḍḍhitassa` = bị anh trai đuổi (bản cũ: "người em trai của…"); `sukhumaṁ coḷakhaṇḍaṁ` =
      mảnh vải nhỏ mịn (bản cũ "một thanh nhỏ nhẹ"); `dummanassa` = buồn bã.
    · `12.1`: bản cũ thêm "cơn giận dữ" không có trong Pāli; `māna` = kiêu mạn; `abhisamayo` = chứng ngộ;
      `chasu abhiññāsu` = sáu thắng trí (bản cũ "sáu vị tri kiến"; `abhiññā` → "thắng trí" 2/2 ở tầng).
    · `13.1`: `nippaṭibhānā titthiyā` = các ngoại đạo không còn biện giải được (bản cũ "những nữ đạo hành bạn không
      còn lắc lư nữa"); `jinaputtānaṁ cakkhuṁ tayā uppāditaṁ` = con mắt được ngài tạo cho các con của Đấng Chiến
      Thắng; `paravādā` = học thuyết của người khác (sn1.7 và 35 khoá khác, mẫu "học thuyết của người khác");
      `tayā`/`tvaṁ` dịch *ngài* như `3.5` và 2/3 tiền lệ mil (bản cũ *ngươi*). Số khoá lỗi nghĩa thật: 32/47 (38/47 khoá đổi nội dung; 9 khoá giữ nguyên: `0.1`–`0.3`, `2.1`–`2.4`, `3.5`, `5.4`).
    · Cấu trúc: khoá `0.4` bị ghi cuối tệp (sai thứ tự Pāli) — đã đưa về đúng chỗ; thứ tự khoá nay = Pāli.

