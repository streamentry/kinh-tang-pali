    · `:0.3` `Paṇāmitavagga` **giữ PĦLI**: cùng nhóm, **7/9** giữ nguyên.
    · `:0.4` `3. Vatthaguyhanidassanapañha` → *3. Câu hỏi về …* theo khuôn 79/79 ở trên.
      LƯU Ý CẤU TRÚC: bài này có **4** dòng tiêu đề (vì có cả tên phẩm `Paṇāmitavagga`),
      nên `N. <X>pañha` nằm ở `0.4`, không phải `0.3` như `mil3.7.1`. Bản nháp đầu bỏ sót
      `0.4`; đã thêm.
    · `2.1–2.3` trùng NGUYÊN VĂN với `mil7.5.10:6.1–6.3` ⇒ dùng lại nguyên văn bản Việt ấy.
