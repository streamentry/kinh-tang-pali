notes: |-
  **Bài thứ hai của `Pañcakanipāta`, `Maṇikuṇḍalavagga`: Kinh Sujāta.** 37 khoá, tất cả đã dịch.

  **Cùng một truyện đã có trong chính corpus: `pv8` (Goṇapetavatthu 8) — 18 khoá dùng lại nguyên văn (đếm bằng script).** `pv8` kể đúng câu chuyện con bò chết khốn tội nghiệp kia, chỉ là rút gọn vài câu. Tôi đối chiếu từng khoá: `1.2` `1.3` `1.4` `2.1` `2.2` `4.3` `5.1` `5.2` `5.3` `5.4` `6.1` `6.3` `6.4` `7.3` `8.1` `8.2` trùng nguyên văn Pāli **và** tôi dùng lại nguyên văn bản Việt; `0.2` `0.3` cũng trùng với `ja351`/`ja355`. **14 trong 18 khoá thân là trùng nguyên văn; `0.2`/`0.3` là tiêu đề.** Bốn khoá thân còn lại (`1.1`, `2.3`, `2.4`, `6.2`) là chỗ **hai bản dịch khác nhau về Pāli**, nên tôi dịch riêng nhưng giữ đúng giọng của `pv8`.

  **`1.1` và `2.3`/`2.4` — chỗ này tôi dịch riêng, và đó là đúng.** `pv8:1.1` là `Kiṁ nu ummattarūpova` (*ngươi từng mang hình dạng con bò*) còn `ja352:1.1` là `Kiṁ nu santaramānova` (*vì sao ngươi lại mang hình dạng con bò*) — khác hẳn: một bên là câu hỏi, một bên là nhận lỗi phần đầu. `pv8:2.3` là `Tvaṁsi bālo ca dummedho` (*vừa ngu dại vừa bất trí*) còn `ja352:2.3` là `Tvañca tucchaṁ vilapasi` (*ngươi cứ lẩm bẩm suông không*) — một bên chê, một bên mô tả. Chép y hệt sẽ sai nghĩa.

  **`2.4` tôi vẫn dùng nguyên văn `pv8:2.4`** vì Pāli chỉ khác ở `taṁ`/`ñ` (*taṁ dummatī* vs *taṁñova dummatī*) và nghĩa vế cuối giống hệt. Chỗ đóng nháy kép ở đây khớp Pāli.

  **BẤT ĐỊNH ĐÃ GHI NHẬN, chưa có cách nào tuyệt đối: `6.2` `yamāsi hadayassitaṁ`.** Pāli bỗng đổi ngôi: `6.1` là *tôi* (`Abbahī vata **me** sallaṁ`), `6.3`–`6.4` cũng là *tôi* (`Yo **me** sokaparetassa`), nhưng `6.2` lại là **ngươi** (`**yamāsi**`). Đây gần như chắc là lỗi sao chép trong bản Pāli đã ghim (`meyāsi` đọc thành `yamāsi` rất dễ xảy ra vì `me`→`ya` là đổi phụ âm). Bản song song `pv8:6.2` là `sokaṁ hadayanissitaṁ` — không có dấu vết ngôi thứ hai, dịch *nỗi buồn khắc khoéti lòng ta*. Tôi **theo Pāli của bài đang dịch** và viết *nỗi buồn đã ăn vào lòng ngươi*; nếu biên tập cho rằng đây là lỗi ốc, thì sửa thành *… của ta* là được, và đó là lý do `ambiguity_integrity` ở 8.8 — mức thấp nhất của lát. **Một ô Anh rỗng ở đây cũng không phải sự đồng thuận**, vì bài không có tầng Anh nào.

  **Tên và tên phẩm — đo trên toàn bộ 392 bài `ja` đã có, không đoán.** `0.1` → *Jātaka* **376/392** (16 tệp kia dùng *Chuyện Tiền Thân*; tôi theo đa số tuyệt đối) — đây chính là điều người điều phối nêu, tôi xác nhận sau khi đếm. `0.2` `Pañcakanipāta` → *Nhóm Năm Bài Kệ* **14/21** (đối thủ *Bộ Năm Kệ* 3 và *Bộ Năm Bài Kệ* 3). `0.3` `Maṇikuṇḍalavagga` → *Phẩm Hoa Tai Ngọc* **5/7** (đối thủ *Phẩm Maṇikuṇḍala* 2). `0.4` → *2. Kinh Sujāta* theo mẫu *9. Kinh Sujāta* và *Kinh Sujāta, thứ chín.* đã có. **Lưu ý hòa tan trong chính tác phẩm:** với `Chakkanipāta` đa số là *Bộ Sáu Bài Kệ* 13/13, còn với `Pañcakanipāta` đa số là *Nhóm Năm Bài Kệ*. Tôi theo **đa số của từng phẩm** theo `BRIEF_VI3` §11, nên trong lát này có hai cách — `ja352:0.2` là *Nhóm Năm Bài Kệ*, còn `ja385:0.2`/`ja389:0.2` là *Bộ Sáu Bài Kệ*. **Giao biên tập:** nếu muốn thống nhất *Bộ … Bài Kệ* cho cả hai thì đó là sửa 21 tệp `ja`, không thuộc lát này.

  **Dấu nháy kép — đếm được, cân.** Pāli 3 mở (`1.1`, `3.1`, `5.1`) / 3 đóng (`2.4`, `4.4`, `8.4`); bản Việt y hệt. Riêng `7.4` `tava sutvāna māṇava.` **không** có dấu đóng ở Pāli (trong khi `pv8:7.4` thì có) — tôi **không** thêm, vì lời thoại ở bài này còn chạy tiếp tới `8.4`. Đây là điểm tôi đã làm sai một lần rồi sửa: lúc đầu tôi chép nguyên văn `pv8:7.4` (có `”`) **và** giữ `”` ở `8.4`, làm hỏng cân nháy; chốt `_hvi.py` bắt được ngay.

  **TẦNG THAM KHẢO — đo, không đoán.** Pāli root: `root/pli/ms/sutta/kn/ja/ja352_root-pli-ms.json`, 37 khoá. Bản Anh Sujato **không có** tại commit đã ghim: thư mục `kn/` của edition có `cp` 35, `dhp` 26, `iti` 112, `ja` 83, `kp` 9, `snp` 73, `thag` 264, `thig` 73, `ud` 80 tệp — **không có `cnd`, `pv`, `mil`**, và 83 tệp `ja` ấy phủ `ja1–ja79` cộng `ja126`, `ja159`, `ja466`, `ja534`, **không có `ja352`** ⇒ `not-published-upstream`, không phải `not-synced`. Lớp lấp `english-project` cũng không có uid này (đã `find`). Tầng `vietnamese-current` vắng: thư mục `translation/` không tồn tại trong checkout này. Ba tầng tham khảo đều vắng ⇒ bài chỉ từ Pāli root ⇒ **blocker thật**, là giới hạn upstream. `triangulation` bị chặn ở **7.5** (≤ 8.0), **không nâng để né blocker**; `status` là `draft`.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì BRIEF cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0: mọi chốt tự động của `_hvi.kiểm` đã xanh và 37/37 khoá của chính bài này, nhưng cổng `npm` chưa chạy.