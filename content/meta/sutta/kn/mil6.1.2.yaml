notes: |-
  **Đo lại ba mệnh đề.** `0.1` Pāli `Milindapañha` → giữ Pāli (190/201 bài `mil`;
  8 tệp *Mi-lan-đà Vấn Đạo*, 3 tệp *Mi-tiên Vấn Đáp*). `0.2` Pāli `Anumānapañha` →
  **Câu hỏi về suy luận** 11/17 (5 tệp giữ Pāli, 1 tệp *Câu Hỏi Về Sự Suy Luận*) → theo đa
  số. `0.3` Pāli `Buddhavagga ` → **Phẩm Đức Phật** 3/5 (1 tệp giữ Pāli `Buddhavagga`, 1
  tệp *Phẩm Buddha*) → theo đa số, và khớp ba tệp `mil6.1.6/.7/.8` cùng phẩm.

  **Tiền lệ trùng nguyên văn.** `0.1`←`mil7.7.8:0.1`; `10.3`←`thag4.6:2.3` (chỉ dùng
  ý *trong toàn thế gian cùng chư thiên* cho `Sadevakassa lokassa`, vì cấu kệ ở đây khác
  hẳn nên tôi viết lại vị trí câu cho đúng thứ tự Pāli); `13.5`←`mil5.3.8:8.4`
  (*Lành thay, thưa ngài Nāgasena, đúng là như vậy, trẫm xin kính nhận*).

  **`”ti.` và `’ti.` — dùng đúng quy ước đã đo.** Dấu `”ti.` ở cuối lời thoại được giữ
  (đa số tầng `mil`: 397 giữ so với 188 chỉ để `”.`), còn `ti` bên trong trích dẫn thì bỏ,
  đúng như `mil3.1.13:2.3`. Chỗ đặc biệt đáng ghi: `13.4` Pāli là `’”ti.` — đóng **cả**
  dấu nháy cong (`13.1`) lẫn dấu nháy kép (`5.4`), vì `5.4–13.4` là **một** lời thoại liên
  tục của Nāgasena dài qua tám khoá không dấu nháy, trong đó có hai đoạn kệ trích
  dẫn (`9.1–10.4` và `12.1–12.4`). Tôi giữ y nguyên `’”ti.` ở `13.4`; sửa thành `”ti.`
  hay `’ti.` đều làm lời thoại hỏng.

  **`bhante` / `mahārāja` — dùng lại đúng hai số đã đo ở `mil5.3.2` (cùng lát).** Toàn
  tầng `mil` (531 khoá Pāli có `bhante`): *tôn giả* 360 lần, *ngài* 198, *Đại đức* 28.
  Trong cặp Pāli trùng nguyên văn của bài này (31 cặp): *ngài* 14, *tôn giả* 4,
  *Đại đức* 4. Tách theo dạng: `bhante` trần → *tôn giả*; `bhante nāgasena` → *ngài
  Nāgasena*. `mahārāja`: toàn tầng 1389 khoá, theo lần xuất hiện *Đại vương* (hoa) 886 so
  với *đại vương* (thường) 442; riêng bài này 30 khoá có `mahārāja` và **0 cặp trùng
  nguyên văn**, nên theo đa số toàn tầng → **Đại vương**.

  **Ba từ phải tự quyết vì 0 tiền lệ — ghi rõ là chọn.**
  - `vassikasāṭikā` (0 tiền lệ trong toàn tầng Việt): tôi dịch *tấm áo dâng*, giữ thuật
    ngữ Hán–Việt quen thuộc của tầng `vietnamese-project` cho loại áo tu sĩ màu
    hồng đất/nâu. `vassika` là cây đỏ nhuộm màu, `sāṭikā` là áo của nữ. Nếu biên tập muốn
    thuần Việt hơn thì có thể dùng *áo màu nâu*, nhưng đó sẽ là cách thứ N+1 nên tôi
    không tự đặt.
  - `Gotamī` / `gotami`: 0 tiền lệ cho chính tên này; tầng dùng `Gotama` 128 lần, nên tôi
    giữ **Gotamī** (thái độ) và **Ghotami** (gọi), không đổi thành *Cổ Tát* (0 tiền lệ).
  - `purohita` ở `5.1`: tôi dịch *tể tướng*; `bhaṭa` = *kẻ ăn nhờ vua*, `bala` =
    *binh lính*, `senāpati` = *tướng quân*.

  **Những chỗ không tự thêm nghĩa.**
  - `7.1` `appicchappaṭipattiṁ pakittayamānena`: tôi dịch *khi làm rõ sự thành tựu không
    còn hiếm*. `appiccha` = không hiếm, `paṭipatti` = sự thành tựu / bước đi vào; tôi
    không thay bằng *chứng ngộ* dù người đọc có thể nghĩ vậy.
  - `9.2` `giri seṭṭho`: tôi dịch *là đỉnh cao nhất trong các núi*. Bản nháp đầu của tôi
    ghi *dãy núi tuyết* — vô căn cứ, đã sửa trong lượt review đối kháng trước khi chấm.
  - `10.3–10.4` `Sadevakassa lokassa`: Pāli đặt mệnh đề genitive **trước** chủ ngữ, nên
    tôi đảo sang *Đối với thế giới có chư thiên, / Đức Phật được gọi là bậc cao nhất* để
    không sinh nghĩa sai.

  **Dấu lược `…pe…` — giữ đúng MỘT dấu, không mở rộng.** Chỉ `13.3` có `…pe…`; bản Việt
  giữ một `…` và `13.4` tiếp tục bằng *của chư thiên và loài người* đúng như Pāli. Đây là
  luật 10.1 của brief: mở rộng là thêm chữ không có nguồn, nên tôi **không** viết lại
  phần bị lược.

  **Triangulation:** không có tầng Anh đã ghim cho `mil` (xem blocker) nên bài chỉ dịch từ
  Pāli đã ghim cùng commit (`11c9d708978cde8ba61096d8a75f7ddfb846f639`) cùng tiền lệ đếm
  được trong chính tầng Việt dự án. Không chạy được `npm run validate|test|check|build`
  theo lệnh phân công đợt này, nên technical_integrity là 9.6.

  **Giải quyết draft 2026-10-12 (thay thế các mục cũ nêu rõ bên dưới).** Đọc đối kháng lại
  toàn bài từ Pāli; khoảng 25/46 khoá của bản nháp cũ sai nghĩa thật hoặc có lỗi chữ, nay đã
  viết lại. Lỗi chính: (1) `mātucchā` là *dì* (Mahāpajāpatī Gotamī là dì và mẹ nuôi của
  Đức Phật; tiền lệ mn142:3.3, an8.51:9.8) nhưng bản cũ dịch *mẹ*; (2) vế `sayaṁ piñjitaṁ…
  vāyitaṁ` là việc **dì** tự tay làm ra tấm vải, bản cũ gán cho Đức Phật tự làm; (3) vocative
  `gotami` bị viết thành *Ghotami* ở 4 khoá, nay *Gotamī* (mn142:2.5: *Hãy cúng dường Tăng,
  này Gotamī*; `te` → *bà* theo mn142:2.6); (4) `ucchādana–parimaddana–nahāpana–sambāhana`
  = *xoa dầu, đấm bóp, tắm gội, xoa nắn tay chân* (cùng chuỗi ở dn1:1.16.2, dn2:51.2,
  mnd14:146.4, cnd23:127.1…), bản cũ *xoa tay, vuốt ve, ôm ấp*; (5) `akāmakaraṇīya` là điều
  *buộc phải làm dù không muốn* (bổn phận), bản cũ *không phải thứ cha mẹ phải phục tùng* và
  *làm điều ngược với điều lẽ ra…*; (6) `rājabhattiko rājūpajīvī` = *tận tụy với vua, sống
  nhờ vua*, và `tathāgatabhattiko` tương tự, bản cũ *kẻ ăn nhờ*; (7) `appicchappaṭipatti` =
  *sự thực hành ít muốn* (bản cũ *sự thành tựu không còn hiếm* sai nghĩa), câu trích Dhammadāyāda
  theo mn3:3.23; (8) `taṁ pana na attano patimānanassa avipākatāya na adakkhiṇeyyatāya` =
  không phải vì sự tôn kính dành cho Ngài là vô quả hay vì Ngài không đáng cúng dường (bản cũ
  bịa *tính toán cho chính mình*, *săn sóc chu đáo*); (9) `8.1` là thiên tử Māṇavagāmika nói
  **trước Đức Thế Tôn** (bản cũ đảo thành Đức Thế Tôn nói); (10) kệ `9.1–10.4`: `ādicco` là
  *mặt trời* và `aghagāminaṁ` là *những kẻ đi giữa hư không* (tiền lệ sn2.30:16.4, song song
  gần như nguyên văn), bản cũ *bậc đầu tiên vượt qua vùng tối tăm*; `Vipulo rājagahīyānaṁ` là
  núi Vipula *trong các núi của Rājagaha* (sn2.30:16.1–16.2); `himavataṁ` → *Tuyết Sơn* (8
  tệp so với 1 tệp *Hi-mã-lạp*, tức chính bản cũ này); (11) kệ Sāriputta `12.1–12.4`: bản cũ
  *có lòng tin trong tâm, quy y giới* sai; nay *một niềm tịnh tín trong tâm, hoặc việc quy
  y, hoặc cái chắp tay lễ bái, cũng có sức đưa người vượt qua, khi hướng đến Đức Phật…*; (12)
  `13.3` bản cũ để lọt *Tathāgato* sang tiếng Việt và *A-la-hạn*, nay *Như Lai, bậc A-la-hán,
  Chánh Đẳng Giác …* (an1.170:1.3); `13.1` theo an1.170:1.1; (13) tiêu đề `Gotamivatthadānapañha`
  là *việc dâng vải của Gotamī* (Gotamī là **người dâng**, không phải người nhận) nên `0.4` và
  `14.1` đổi; `0.1–0.3` giữ nguyên.
  **Mục cũ bị thay thế:** toàn bộ đoạn *"Ba từ phải tự quyết vì 0 tiền lệ"* (nay `vassikasāṭikā`
  = *tấm vải tắm mưa* theo Vinaya, tiền lệ *vải tắm mưa* và *y tắm mưa* mỗi cái 1 tệp, không còn
  *tấm áo dâng*; `Gotamī` có tiền lệ *Mahāpajāpatī Gotamī* ở mn142, an8.51, thig6.6; `purohita` =
  *tế sư* theo dn5, không còn *tể tướng*); mục *"Những chỗ không tự thêm nghĩa"* (cả ba đoạn
  `7.1`, `9.2`, `10.3–10.4` đều đã viết lại như trên); đoạn đo `10.3←thag4.6:2.3`. Mục
  *Dấu lược*, *`”ti.`/`’ti.`*, *`bhante`/`mahārāja`* và *Tiền lệ trùng nguyên văn* `0.1`, `13.5` còn
  đúng.
  **Còn bất định (ghi nhận, không đoán):** (a) `piñjita`/`luñcita`/`pothita`: 0 tiền lệ
  trong tầng cho nghĩa chế biến bông; chọn *bật bông / gỡ / đập* theo nghĩa từ điển (bật bông,
  nhổ-gỡ, đập), có thể tinh chỉnh; (b) `bhāriko garuko` ở `1.2` dịch *không quan trọng, không
  đáng kính trọng* (nghĩa đen *nặng*, 1 tiền lệ khác ở mil6.3.8:4.1 dùng nghĩa vật lý); (c)
  `attānaṁ na patthayati na upanissayati` ở `1.3` dịch sát chữ *không mong cầu bản thân,
  không nương tựa vào bản thân*; (d) `bhaṭa`/`bala` giữ *binh sĩ/quân lính* theo mil5.1.5,
  mil6.2.1, mil5.5.10 (các danh sách tương tự dùng cặp này), nghĩa gốc `bhaṭa` còn có thể là *thuộc hạ
  ăn lương*; (e) `anīkaṭṭha` = *vệ binh*.
