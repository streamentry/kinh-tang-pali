notes: |-
  **Đo lại ba mệnh đề.** `0.1` Pāli `Milindapañha` → giữ Pāli (190/201 bài `mil`;
  8 tệp *Mi-lan-đà Vấn Đạo*, 3 tệp *Mi-tiên Vấn Đáp*). `0.2` Pāli `Anumānapañha` →
  **Câu hỏi về suy luận** 11/17 (5 tệp giữ Pāli, 1 tệp *Câu Hỏi Về Sự Suy Luận*) → theo đa
  số. `0.3` Pāli `Buddhavagga ` → **Phẩm Đức Phật** 3/5 (1 tệp giữ Pāli `Buddhavagga`, 1
  tệp *Phẩm Buddha*) → theo đa số, và khớp ba tệp `mil6.1.6/.7/.8` cùng phẩm.

  **Tiền lệ trùng nguyên văn.** `0.1`←`mil7.7.8:0.1`; `10.3`←`thag4.6:2.3` (chỉ dùng
  ý *trong toàn thế gian cùng chư thiên* cho `Sadevakassa lokassa`, vì cấu kệ ở đây khác
  hẳn nên tôi viết lại vị trí câu cho đúng thứ tự Pāli); `13.5`←`mil5.3.8:8.4`
  (*Lành thay, thưa ngài Nāgasena, đúng là như vậy, trẫm xin kính nhận*).

  **`”ti.` và `’ti.` — dùng đúng quy ước đã đo.** Dấu `”ti.` ở cuối lời thoại được giữ
  (đa số tầng `mil`: 397 giữ so với 188 chỉ để `”.`), còn `ti` bên trong trích dẫn thì bỏ,
  đúng như `mil3.1.13:2.3`. Chỗ đặc biệt đáng ghi: `13.4` Pāli là `’”ti.` — đóng **cả**
  dấu nháy cong (`13.1`) lẫn dấu nháy kép (`5.4`), vì `5.4–13.4` là **một** lời thoại liên
  tục của Nāgasena dài qua tám khoá không dấu nháy, trong đó có hai đoạn kệ trích
  dẫn (`9.1–10.4` và `12.1–12.4`). Tôi giữ y nguyên `’”ti.` ở `13.4`; sửa thành `”ti.`
  hay `’ti.` đều làm lời thoại hỏng.

  **`bhante` / `mahārāja` — dùng lại đúng hai số đã đo ở `mil5.3.2` (cùng lát).** Toàn
  tầng `mil` (531 khoá Pāli có `bhante`): *tôn giả* 360 lần, *ngài* 198, *Đại đức* 28.
  Trong cặp Pāli trùng nguyên văn của bài này (31 cặp): *ngài* 14, *tôn giả* 4,
  *Đại đức* 4. Tách theo dạng: `bhante` trần → *tôn giả*; `bhante nāgasena` → *ngài
  Nāgasena*. `mahārāja`: toàn tầng 1389 khoá, theo lần xuất hiện *Đại vương* (hoa) 886 so
  với *đại vương* (thường) 442; riêng bài này 30 khoá có `mahārāja` và **0 cặp trùng
  nguyên văn**, nên theo đa số toàn tầng → **Đại vương**.

  **Ba từ phải tự quyết vì 0 tiền lệ — ghi rõ là chọn.**
  - `vassikasāṭikā` (0 tiền lệ trong toàn tầng Việt): tôi dịch *tấm áo dâng*, giữ thuật
    ngữ Hán–Việt quen thuộc của tầng `vietnamese-project` cho loại áo tu sĩ màu
    hồng đất/nâu. `vassika` là cây đỏ nhuộm màu, `sāṭikā` là áo của nữ. Nếu biên tập muốn
    thuần Việt hơn thì có thể dùng *áo màu nâu*, nhưng đó sẽ là cách thứ N+1 nên tôi
    không tự đặt.
  - `Gotamī` / `gotami`: 0 tiền lệ cho chính tên này; tầng dùng `Gotama` 128 lần, nên tôi
    giữ **Gotamī** (thái độ) và **Ghotami** (gọi), không đổi thành *Cổ Tát* (0 tiền lệ).
  - `purohita` ở `5.1`: tôi dịch *tể tướng*; `bhaṭa` = *kẻ ăn nhờ vua*, `bala` =
    *binh lính*, `senāpati` = *tướng quân*.

  **Những chỗ không tự thêm nghĩa.**
  - `7.1` `appicchappaṭipattiṁ pakittayamānena`: tôi dịch *khi làm rõ sự thành tựu không
    còn hiếm*. `appiccha` = không hiếm, `paṭipatti` = sự thành tựu / bước đi vào; tôi
    không thay bằng *chứng ngộ* dù người đọc có thể nghĩ vậy.
  - `9.2` `giri seṭṭho`: tôi dịch *là đỉnh cao nhất trong các núi*. Bản nháp đầu của tôi
    ghi *dãy núi tuyết* — vô căn cứ, đã sửa trong lượt review đối kháng trước khi chấm.
  - `10.3–10.4` `Sadevakassa lokassa`: Pāli đặt mệnh đề genitive **trước** chủ ngữ, nên
    tôi đảo sang *Đối với thế giới có chư thiên, / Đức Phật được gọi là bậc cao nhất* để
    không sinh nghĩa sai.

  **Dấu lược `…pe…` — giữ đúng MỘT dấu, không mở rộng.** Chỉ `13.3` có `…pe…`; bản Việt
  giữ một `…` và `13.4` tiếp tục bằng *của chư thiên và loài người* đúng như Pāli. Đây là
  luật 10.1 của brief: mở rộng là thêm chữ không có nguồn, nên tôi **không** viết lại
  phần bị lược.

