  **Tiến lệ trực tiếp, dùng lại nguyên văn.** `“Kallosi, bhante nāgasenā”ti.` trùng y hệt `mil3.5.6:2.1` và `mil3.6.6:2.1` (cả hai `published`) → *“Khéo lắm, thưa tôn giả Nāgasenā.”* Cấu trúc hội thoại (`1.1` vua hỏi / `1.2` trưởng lão đáp) theo đúng hai bài đó. `bhante nāgasena` → *Thưa tôn giả Nāgasena*; `mahārāja` → *Này Đại vương* (`mil3.5.6:1.4`, `mil3.6.6:1.3`). `Milindapañha` → giữ nguyên (mẫu `mil3.5.6:0.1`). `Vicāralakkhaṇapañho cuddasamo` → *Câu hỏi về dấu hiệu của sự suy xét, thứ mười bốn*; `Vicāravaggo tatiyo` → *Phẩm Suy Xét, thứ ba*; `Imasmiṁ vagge cuddasa pañhā` → *Trong phẩm này có mười bốn câu hỏi* (đúng nguyên văn `mil3.6.11:5.1`). Mẫu tiêu đề dùng dấu chấm hết câu như `mil3.5.6:0.3`.

  **Hai thuật ngữ đặt mới, 0 tiền lệ trong tầng — ghi ra đây.**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: `vicāra` → *suy xét* (0 chỗ; chỗ duy nhất tầng có `vicāro` là `mn111:4.1`, ở đó nó là yếu tố thứ tư của sơ thiền và tầng dịch *tứ*, nên **không** dùng làm tiền lệ cho nghĩa *suy xét* ở đây). `anumajjana` → *cân nhắc* (0 chỗ). `pāyāsi`/`vicāra` cùng phẩm với `lakkhaṇa` → *dấu hiệu* (0 chỗ cho `lakkhaṇa`; tôi dùng vì cấu trúc câu `kiṁlakkhaṇo vicāro` / `anumajjanalakkhaṇo vicāro` là hỏi–đáp về **đặc trưng nhận biết**).

  **Bất định lớn nhất: ví dụ ở `2.2`–`2.3`, tôi dịch theo chữ và KHÔNG diễn giải.** `kaṁsathālaṁ ākoṭitaṁ pacchā anuravati anusandahati` — *tấm đúc đồng đã đổ đầy, lật úp xuống thì phần đã đổ vào chảy ngược và tụ lại bên trong*. Tôi **không** nói chất lỏng ấy là *nước*, vì Pāli không nói; và **không** nói mục đích của ví dụ là gì. `ākoṭanā` → *cái khuôn đúc ấy* là **thứ đem ra để so**, còn `vitakko` → *sự suy nghĩ* mới là **thứ phải xem xét**; tôi đã sửa một lỗi ở bản nháp là cho *tấm đúc ấy* làm vế phải xem xét, tức là dịch nhầm vế. Bản dịch dừng ở đó vì phần còn lại của câu hỏi (Nāgasena trả lời thế nào) **không có trong lát này** — nó thuộc những khoá của các câu hỏi khác trong `vicāravagga`, và tôi không tra cùng bài ở bài khác để viết trước. Vì vậy `semantic_fidelity`, `grammar_logic` và `ambiguity_integrity` chỉ 9,0 / 9,0 / 8,8.

