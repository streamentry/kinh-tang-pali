  **Bốn khoá có nội dung** (`1.1`, `1.2`, `2.2`, `2.3`) — nhiều nhất trong lát — nhưng **không một khoá nào có tiếng Anh**: tại commit đã ghim tầng English Sujato không có thư mục `kn/mil` (`ls …/en/sujato/sutta/kn/` cho `cp dhp iti ja kp snp thag thig ud`), `englishCoverageFor('kn','mil3.3.14')` lúc tôi đo cho `substantiveSegments: 4`, `substantiveWithoutEnglish: 4`, tỉ lệ **0%**. Giữa lúc đó một agent khác đã ghi vào đĩa `content/translation/en/project/sutta/kn/mil3.3.14_translation-en-project.json` (12 khoá) kèm scorecard `status: published`, nên chỉ số coverage của kho bây giờ là 100%. Tôi **không** nâng `triangulation` vì đó là bản lấp English **do chính tầng dự án tạo ra**, và `assessed_by` của nó trùng `assessed_by` của bài Việt này — không phải bản Anh độc lập (`AGENTS.md`: bản lấp cùng người chấm thì scorecard tiếng Việt không được tuyên bố đã đối chiếu English). Bản Anh **đã ghim** vẫn không có, và đó mới là thứ `validate` đòi. `validate` coi thiếu tệp Anh là lỗi chặn cho `review`/`published` và đồng thời còn đòi khoảng trống phải được ghi trong `content/meta/reference-gaps.yaml` — tệp đó tôi **không** được sửa, nên bài giữ `draft`. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho.

  **Tự kiểm.** `kiểm()` của `_hvi.py` bắt được đúng bốn khoá này và tôi chạy lại từ đĩa: pass. Nhưng ngoài bốn khoá đó thì không có assertion nào chạy, nên tôi tự quét MỌI khoá của cả lát (`_tvd7_2_chk.py`, 136 khoá): đúng tập khoá `all` (12), NFC, **số dấu lược khớp Pāli từng khoá** (bài này không có dấu lược nào ở bất kỳ khoá nào), ngoặc kép cân trên cả bài — mở và đóng cùng khoá ở `1.1`, `1.2`, `2.1`, `3.1`, và **mở ở `2.2` rồi đóng ở `2.3`**, đúng như Pāli — không Pāli lọt, không `(…)`, không trùng Pāli; `save_vi` hai lần không đổi byte.

  **Tiến lệ trực tiếp, dùng lại nguyên văn.** `“Kallosi, bhante nāgasenā”ti.` trùng y hệt `mil3.5.6:2.1` và `mil3.6.6:2.1` (cả hai `published`) → *“Khéo lắm, thưa tôn giả Nāgasenā.”* Cấu trúc hội thoại (`1.1` vua hỏi / `1.2` trưởng lão đáp) theo đúng hai bài đó. `bhante nāgasena` → *Thưa tôn giả Nāgasena*; `mahārāja` → *Này Đại vương* (`mil3.5.6:1.4`, `mil3.6.6:1.3`). `Milindapañha` → giữ nguyên (mẫu `mil3.5.6:0.1`). `Vicāralakkhaṇapañho cuddasamo` → *Câu hỏi về dấu hiệu của sự suy xét, thứ mười bốn*; `Vicāravaggo tatiyo` → *Phẩm Suy Xét, thứ ba*; `Imasmiṁ vagge cuddasa pañhā` → *Trong phẩm này có mười bốn câu hỏi* (đúng nguyên văn `mil3.6.11:5.1`). Mẫu tiêu đề dùng dấu chấm hết câu như `mil3.5.6:0.3`.

  **Hai thuật ngữ đặt mới, 0 tiền lệ trong tầng — ghi ra đây.**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: `vicāra` → *suy xét* (0 chỗ; chỗ duy nhất tầng có `vicāro` là `mn111:4.1`, ở đó nó là yếu tố thứ tư của sơ thiền và tầng dịch *tứ*, nên **không** dùng làm tiền lệ cho nghĩa *suy xét* ở đây). `anumajjana` → *cân nhắc* (0 chỗ). `pāyāsi`/`vicāra` cùng phẩm với `lakkhaṇa` → *dấu hiệu* (0 chỗ cho `lakkhaṇa`; tôi dùng vì cấu trúc câu `kiṁlakkhaṇo vicāro` / `anumajjanalakkhaṇo vicāro` là hỏi–đáp về **đặc trưng nhận biết**).

  **Bất định lớn nhất: ví dụ ở `2.2`–`2.3`, tôi dịch theo chữ và KHÔNG diễn giải.** `kaṁsathālaṁ ākoṭitaṁ pacchā anuravati anusandahati` — *tấm đúc đồng đã đổ đầy, lật úp xuống thì phần đã đổ vào chảy ngược và tụ lại bên trong*. Tôi **không** nói chất lỏng ấy là *nước*, vì Pāli không nói; và **không** nói mục đích của ví dụ là gì. `ākoṭanā` → *cái khuôn đúc ấy* là **thứ đem ra để so**, còn `vitakko` → *sự suy nghĩ* mới là **thứ phải xem xét**; tôi đã sửa một lỗi ở bản nháp là cho *tấm đúc ấy* làm vế phải xem xét, tức là dịch nhầm vế. Bản dịch dừng ở đó vì phần còn lại của câu hỏi (Nāgasena trả lời thế nào) **không có trong lát này** — nó thuộc những khoá của các câu hỏi khác trong `vicāravagga`, và tôi không tra cùng bài ở bài khác để viết trước. Vì vậy `semantic_fidelity`, `grammar_logic` và `ambiguity_integrity` chỉ 9,0 / 9,0 / 8,8.

  **Không có bản Việt tham khảo** tại commit đã ghim (`translation/vi/` bilara chỉ có 26 tệp Pháp Cú), nên `triangulation` chỉ 6,5.

  **`technical_integrity` 9,6** vì đợt này cấm `npm run validate|test|build`.

  **Lượt cải thiện 2026-10-13.** Đọc đối kháng từng khoá thấy bản trước có một lỗi thật ở ví dụ `2.2`–`2.3` và ba chỗ lệch tiền lệ; 9/12 khoá đã đổi.

  *Accuracy fix, `mil3.3.14:2.2`–`2.3`.* Bản cũ dịch `kaṁsathālaṁ ākoṭitaṁ pacchā anuravati anusandahati` thành *tấm đúc đồng đã đổ đầy, lật úp xuống thì phần đã đổ vào chảy ngược và tụ lại bên trong*, và `ākoṭanā` thành *cái khuôn đúc*, `anuravanā` thành *sự chảy ngược*. Pāli không có đổ, lật úp, khuôn hay chất lỏng; đó là cách đọc bịa thêm. Gốc từ là `ākoṭeti` (gõ), `anuravati` (ngân vang theo), nên ví dụ là vật đồng bị gõ rồi còn ngân vang về sau: `ākoṭanā` (việc gõ) là điều đem ra so với tầm, `anuravanā` (tiếng ngân vang) so với tứ. Đối chiếu trong kho: `ākoṭ-` dịch *gõ* ở `mil6.3.6:22.1`, `mil6.3.6:23.1` và `ps1.3:95.6` (*chuông đồng bị gõ*); `kaṁsathāla` dịch *chậu đồng* ở 6 chỗ (`dn2:76.1`, `dn10:2.14.1`, `mn39:15.4`, `mn77:25.4`, `mn119:18.3`, `an5.28:2.4`) so với *bát đồng* ở 1 chỗ (`ja374:7.2`), nên theo đa số 6:1. `grammar_logic` 9.0 → 9.2 vì đã sửa phép phân tích câu so sánh (hai vế *như việc gõ → tầm*, *như tiếng ngân vang → tứ* thay cho vế bị đảo trước đây).

  *Terminology fix, theo tiền lệ đã đo.* `vitakka` → *tầm*: 12 khoá trong `mil` dịch *tầm* so với 5 dịch *suy nghĩ*, và bài liền trước cùng phẩm `mil3.3.13` và `mil3.4.1:1.2` dịch *tầm* (cặp *tầm – tứ*); bản cũ viết *sự suy nghĩ* nên làm vế đối của cặp bị lệch. `vicāra` → *tứ*: 47 khoá toàn tầng dịch *tứ* so với 10 khoá dịch *suy xét* (gồm các khoá của chính bài này); bản cũ chọn *suy xét* vì tưởng không có tiền lệ, nhưng tiền lệ có và là đa số. `lakkhaṇa` → *đặc trưng*: sáu bài liền trước cùng phẩm (`mil3.3.8`–`mil3.3.13`) dùng *đặc trưng*, trong khi *dấu hiệu* thuộc phẩm khác (`mil3.1.8`, `mil3.1.11`–`mil3.1.13`); đồng bộ theo phạm vi gần nhất. `Vicāravagga` → *Phẩm Khảo Sát*: 12/13 khoá `0.2` cùng phẩm đã dùng dạng này, `mil3.3.14:0.2` và `5.1` trước đó là cái duy nhất viết *Phẩm Suy Xét*. `Opammaṁ karohī` → *Hãy xét một thí dụ*: 34/40 chỗ trong `mil` dùng *xét một thí dụ*, bản cũ *Hãy đưa một ví dụ* là một trong 4 dạng thiểu số; tiêu đề `0.3` bỏ dấu chấm cuối như 11/14 tiêu đề cùng phẩm. Điểm `terminology` 8.8 → 9.0.

  *Đổi `anumajjana`.* Bản cũ dịch `anumajjanalakkhaṇo` thành *mang dấu hiệu của sự cân nhắc*. Căn `majj-` mang nghĩa lau, xoa, lướt qua; không có nghĩa cân nhắc, nên đó là thêm nghĩa. Đổi thành *sự lần theo*, bám nghĩa *đi qua lại trên cùng một đối tượng* và có tiền lệ cùng căn `mil4.1:3.1` (*Navaṅgaṁ anumajjanto* → *lần theo chín phần*).

  **Bất định còn lại, không giải được.** (1) `anumajjana`: tầng Pāli đã ghim không có bài song song nào định nghĩa nó đúng ở nghĩa này, nên *lần theo* là lựa chọn bám sát gốc từ nhất chứ không phải nghĩa đã được chứng minh; các nghĩa khả dĩ khác (*xoa đi xoa lại*, *lướt theo*) không loại trừ được. (2) `anusandahati` dịch *nối tiếp* (cùng căn `an7.49:3.1`, nơi tầng dịch *chạy theo*); nghĩa *kéo dài ra* cũng hợp ngữ cảnh. (3) `kaṁsathāla` ở đây là vật bị gõ cho ngân vang nên có thể là chiêng hay mâm đồng; *chậu đồng* theo đa số tiền lệ nhưng không phải bằng chứng về hình dạng. Vì ba điểm trên `semantic_fidelity` giữ 9.0 và `ambiguity_integrity` giữ 8.8. `triangulation` giữ 6.5, `technical_integrity` giữ 9.6, `vietnamese_clarity` giữ 9.1 vì *sự lần theo* vẫn hơi trừu tượng. `final_score` 8.95 → 8.99.

  **Kiểm.** Đủ 12/12 khoá, đúng thứ tự Pāli, NFC; nháy và ngoặc kép khớp Pāli từng khoá (`2.2` mở, `2.3` đóng); không dấu lược trong bài (Pāli cũng không có); không Pāli lọt sang; Pāli trùng nguyên văn trong bài: 0 cặp. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 4 khoá bất đồng nghĩa ở mức thuật ngữ → sửa 0, giữ 0, bất định 4 (1.2: `anumajjanalakkhaṇo`, bản nguyên bài hiểu theo hướng sát lại gần, bản dự án dịch *lần theo*; căn `majj-` chỉ xoa, lướt qua nên cả hai đều là cách đọc khả dĩ và tầng Pāli đã ghim không có bài song song để phân xử; 2.2: `kaṁsathāla`, bản nguyên bài hiểu là cái cồng, bản dự án giữ *chậu đồng* theo đa số tiền lệ nhưng vật bị gõ cho ngân vang thì chiêng hay mâm đồng cũng hợp; 0.2 và 5.1: tên phẩm `Vicāravagga`, bản nguyên bài đọc theo mặt chữ *tứ*, bản dự án giữ *Phẩm Khảo Sát* theo 12/13 bài cùng phẩm). Các khoá 1.1, 2.1, 2.3, 3.1, 4.1, 6.1 cùng nghĩa, và phép so ở 2.2–2.3 (việc gõ ứng với tầm, tiếng ngân ứng với tứ) hai bản khớp nhau; không đổi khoá nào. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
