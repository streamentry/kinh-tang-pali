notes: |-
  Phạm vi: đủ 89/89 khoá của bài (4 khoá `:0` tiêu đề, 84 khoá kệ `1.1`–`21.4` của 21 kệ bốn dòng, `21.5` dòng bìa), không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã đọc đối chiếu cả 89 cặp Pāli↔Việt, không đọc mẫu.

  ⚠️ MẪU SỐ COVERAGE THEO CỔNG = 0 — CỔNG NÀY KHÔNG ĐO ĐƯỢC GÌ. `source/layers.yaml` đặt `substantivePaliMinChars: 40` và bỏ khối `:0`. Khoá Pāli dài nhất của thân bài chỉ 31 ký tự (mỗi pāda một khoá), nên 0 khoá đạt ngưỡng. Đây là "không đo được gì", không phải "không cần ghi nhận gap". Tôi không dùng nó làm căn cứ publish mà đo thô riêng trên khoá thân bài: tầng `english-sujato` có tệp cho bài này (`thag` có trong tầng, 264 tệp), cùng tập khoá với Pāli (89/89); Sujato có chữ ở 84/84 khoá kệ `1.1`–`21.4` (coverage thô 1,000), chỉ để trống `21.5` (dòng bìa). Tính cả dòng bìa thì 84/85 = 0,988. Cả hai số đều ≥ 0,80. `english-project`: không có tệp cho bài này (không cần lấp, vì Sujato không để trống khoá thân nào). `vietnamese-current`: vắng tại commit đã ghim (bilara chỉ có Pháp Cú), đặc điểm của cả tầng ở `thag`. Không có entry trong `reference-gaps.yaml`; mẫu số bằng 0 nên cổng không có gì để ghi nhận. Tôi có đọc bản Việt nguyên bài của sc-data (mục tra cứu toàn văn) chỉ để phân tích cú pháp hai chỗ khó (`11.3`, `16.1`); không căn lề theo khoá, không chép câu chữ, và không tính nó là tầng tham khảo.

  BÀI SONG SONG TRONG TẦNG. Không có bài song song nào trong kn, sn, an, dn, mn: không có khoá thân kệ nào của bài này có Pāli trùng nguyên văn ở bài khác (chỉ các khoá tiêu đề, bìa và hai pāda cuối kệ dưới đây). Khoá Pāli trùng nguyên văn ở bài khác (bỏ dấu câu và hoa thường): 7 khoá (`0.2`, `0.3`, `0.4`, `10.3`, `16.4`, `20.4`, `21.5`), 137 cặp, trong đó 16 cặp bản Việt khác: 13 cặp ở `0.3` `Paṭhamavagga` (11 bài thag đặt tên trưởng lão ở `0.3` và 2 bài ghi thêm số thứ tự đầu dòng; bài này theo `thag12.1`, `thag14.1`, `thag15.2`: `0.3` là tên phẩm, Phẩm Thứ Nhất, đúng Pāli); 2 cặp ở `10.3` (`snp4.1:5.3` dịch rồi sau đó khổ đau theo đuổi nó, `dhp1:5` dịch thì khổ theo nó; Pāli `naṁ` ở đây chỉ người không giữ được tâm (chủ ngữ `yo`), nên dịch theo người ấy, giữ động từ khổ theo của `dhp1:5`); 1 cặp ở `16.4` (`sn10.12:7.4` bỏ chủ ngữ; `snp1.10:11.4` có chữ người như bản này). Các cặp trùng còn lại giữ nguyên bản dịch: `0.2` (`thig13.1:0.2` Bộ Hai Mươi Bài Kinh), `0.4` và `21.5` (`thag1.116:0.4`, `thag1.116:1.5`, cùng trưởng lão), `20.4` (`dhp294:4`, `dhp295:4`: vị Bà-la-môn đi không còn phiền não).

  CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá), nên đối chiếu được ở mức khoá. Về nháy: Pāli mở nháy kép ở `1.1` và đóng ở `21.4` (`”ti`); Sujato mở nháy ở `2.1`, sau câu dẫn. Bản Việt theo Pāli (mở ở `1.1`). Những điểm khác Sujato đã phân xử: (a) `11.3` `naravīrakataṁ`: Sujato dịch cunning people decorate it; bản Việt dịch do những người tài giỏi làm nên (xem bất định). (b) `16.1`–`16.2` `Atho sīdati saññuttaṁ, vajje kiccaṁ niratthakaṁ`: Sujato nối thành one task that is doomed to failure; bản Việt giữ đúng ranh giới khoá (xem bất định). (c) `19.1`–`19.2`: Sujato dịch peg with a peg; bản Việt dịch cái chốt này đánh bật cái chốt kia, có một chỗ lệch ranh giới nhỏ: chữ `āṇiṁ` (chốt kia) ở `19.2` thay vì `19.1`, vì cú pháp Việt cần động từ đứng giữa hai chữ chốt. (d) `17.2` `dhammagatā`: Sujato dịch principled; bản Việt dịch ở nơi pháp, không thêm chữ principled. (e) `15.1`/`21.1` `atthavā`: Sujato dịch purposeful, còn `17.1` `atthena` dịch meaningful; bản Việt giữ một chữ mục đích cho cả hai chỗ.

  NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
    1. Tập khoá: Việt 89 = Pāli 89, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
    2. Nháy đơn và kép khớp Pāli từng khoá: 0/89 lệch. Tổng: `“` 1/1, `”` 1/1, `‘` 1/1, `’` 1/1. Lời kệ mở nháy kép ở `1.1`, đóng ở `21.4` (Pāli `”ti`); nháy đơn ở `16.3` (Pāli `‘Na taṁ kiccan’ti`).
    3. Pāli trùng nguyên văn TRONG CHÍNH bài (khoá thân, bỏ `:0.x` và dấu câu): 7 nhóm trùng, 15 khoá: `2.3`=`4.3`, `2.4`=`4.4`, `5.2`=`6.2`, `5.3`=`6.3`, `5.4`=`6.4`, `9.4`=`13.4`, `15.1`=`21.1`. Việt trùng ở 6 nhóm; khác ở 1 nhóm: `2.4` mà không làm phiền hại ai? và `4.4` thì không làm phiền hại ai. Lý do: Pāli `na ca kañci viheṭhaye` ở `2.4` là vế cuối của câu hỏi (kệ 2), ở `4.4` là vế đáp của câu điều kiện (kệ 4); chỉ liên từ (mà/thì) và dấu câu khác, nội dung giống. Đã soi riêng từng nhóm.
    4. Dấu lược: Pāli có `…` ở 1 khoá (`21.5`, hai dấu lược), Việt có đúng khoá đó; `…pe…` 0; `(…)` trần 0 ở Pāli nên 0 ở Việt. Lỗi = 0/89. Khoá bìa `21.5` kết ` ….` (lược rồi mới tới chấm), đúng Pāli `… Pārāpariyo thero ….` và khoá song song `thag1.116:1.5`.
    5. Số Pāli (tự tính): `Vīsati` (`0.2` `Vīsatinipāta`) = 20 (`vīsati` là 20) ⇒ Bộ Hai Mươi Bài Kinh, theo `thig13.1:0.2`; bài này có 21 kệ đánh số `1.x`–`21.x`, tên bộ là tên nipāta theo quy ước, không phải số kệ, nên không sửa theo số kệ (xem bất định). `pañca` (3 khoá, 5 lần: `10.4` `sabbehetehi pañcahi`, `14.2` `pañca pañcasu`, `20.3` `pañca pañcahi`) = 5 ⇒ năm; `14.2` và `20.3` mỗi khoá hai chữ `pañca`, đều năm. `ekakassa` (`1.3`) là nghĩa một mình, không phải số đếm. Không có số nào khác trong thân kệ.
    Vệ sinh: JSON hợp lệ, 89/89 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa, 0 khoá Pāli lọt sang Việt ngoài tên riêng (khoá `0.1` chứa `Theragāthā` là tên bộ giữ nguyên theo mọi bài thag đã dịch; `1.2`, `0.4`, `21.5` chứa `Pārāpariya`).

  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `indriya` → căn (`3.1`–`4.2`, `19.4`; theo toàn tầng). `cakkhundriya` → nhãn căn (`5.1`): 55 khoá có `cakkhundriya`, 29 dịch nhãn căn, 27 dịch có chữ mắt (hai số chồng nhau), nên không có đa số rõ; chọn nhãn căn theo công thức phòng hộ căn (`dn10`, `dn33`, `mn38`, `mn94`, `mn101`). `sotindriya` → nhĩ căn (`6.1`): 22 khoá, nhĩ căn 3, có chữ tai 19 (tai căn 6, căn tai 7); chọn nhĩ căn để đứng cặp với nhãn căn trong hai kệ song song `5` và `6`, đúng như `dn33:2.1.96` (nhãn căn, nhĩ căn); xin người biên tập cân nhắc đổi sang tai căn nếu muốn theo đa số.
    · `anādīnavadassāvī` → không thấy sự nguy hại (17 khoá, theo `dn25`, `sn20.9`, `sn42.12`: không thấy nguy hại). `anissaraṇadassāvī` → không thấy lối thoát (`sn36.3` dịch có chữ lối thoát). `muccati dukkhā` → thoát khỏi khổ. `anussaraṁ` → nhớ nghĩ (12 khoá có `anussaraṁ`: nhớ nghĩ 3, nhớ lại 1, nhớ 5, khác 3; chọn nhớ nghĩ theo `an5.39:5.2`, `an4.61:20.1`, `an5.41:9.1`). `adhimucchita` → mê đắm (`7.4`; 2 khoá trong tầng, `ja378:2.1` dịch đắm chìm); `sāratto` → say đắm (`13.3`; 11 khoá, say đắm 7); `ratto` → đắm nhiễm (`9.3`); `gadhito` → bị dính chặt (`8.3`; tầng dịch trói buộc, bám giữ, dính mắc). Ba chữ này khác nhau trong Pāli nên dịch khác nhau.
    · `phoṭṭhabba` → xúc chạm (`9.2`, `13.2`; 372 khoá có `phoṭṭhabb`, 135 dịch xúc chạm). `rasataṇhā` → khát ái về vị (`8.3`; `sn18.8` khát ái, `an7.49`). `hadayaṁ` → lòng (`8.4`; tầng dịch lòng, tâm, tim gần ngang nhau; xem bất định) và `manaṁ` → tâm (`10.1`), để hai chữ Pāli khác nhau được dịch khác nhau. `nāvabujjhati` → không hiểu được (`8.4`, theo `ja90`; 4 khoá dịch không hiểu) và không nhận ra (`12.4`, theo `an7.64:22.3`, khi không có tân ngữ).
    · `viheṭheti` → làm phiền hại (`2.4`, `4.4`; 38 khoá, làm phiền 13, quấy 11, hại 11, ba nhóm chồng nhau; ghép làm phiền và hại, như `dn16:5.24.9` làm phiền và `dhp184:4` bức hiếp). `kiccakārī` → làm việc cần làm (`2.3`, `4.3`; `mil5.1.3:7.7` dịch người đã làm điều cần làm); `kicca` → việc cần làm (`15.4`, `16.2`, `16.3`; 37 khoá có `kiccaṁ`). `vata` → hạnh nguyện (`2.2`; `mn7:20.15` dịch hạnh nguyện; `snp4.13:4.2` giới nguyện, `sn2.8:6.2` giới hạnh). `samācāra` → cách cư xử (tầng dịch thân hành, khẩu hành cho `kāya-`/`vacī-samācāra`; ở đây dạng đơn, không phải hợp chất).
    · `hita`/`ahita` → lợi ích/bất lợi (336 khoá có `hitāya`, 308 dịch lợi ích). `jhāyī` → hành thiền, `pavivitta` → viễn ly (82 khoá có `pavivitt`, dịch viễn ly ở `dn34`, `mn3`, `an8.30`). `dukkha`/`dukha` → khổ (cùng một chữ, hai chính tả của Pāli ghim). `vicakkhaṇo` → sáng suốt (22 khoá, sáng suốt 13; `sn10.12:7.4`, `snp1.10:11.4`). `appamatto` → không phóng dật. `dakkho` → khéo léo.
    · `dhammaṭṭho` → an trú trong pháp (`15.1`, `21.1`): 17 khoá có `dhammaṭṭho`; công thức `Dhammaṭṭho sīlasampanno` có 3 khoá: 2 dịch an trú trong pháp (`an5.179:17.3`, `thag3.8:1.3`), 1 dịch Trên pháp (`an3.57:9.3`); tầng có 5 khoá dịch đứng trong pháp nhưng ở ngữ cảnh đối lập `adhammaṭṭho` (`an10.39`, `an10.40`, `iti18`, `iti19`). Chọn theo công thức gần nhất. `atthavā` → có mục đích (tầng không có tiền lệ cho dạng này); `attha` → mục đích (`sn4.25:14.1`, `an10.26`: đạt mục đích; `an5.167:2.5` dịch lợi ích cho `atthasaṁhita` trong ngữ cảnh lời nói; chọn mục đích để `atthavā` (`15.1`), `atthena` (`17.1`) và `dhammatthasaṁhita` (`15.4`) cùng một chữ). `dhammagatā` → ở nơi pháp (`dhp297:4` dịch `dhammagatā sati` thành thường niệm Pháp; ở đây `rati`, nên giữ dạng ngắn ở nơi pháp, không thêm tùy niệm). `rati` → niềm vui. `uttamā` → tối thượng. `samādāya` → thọ trì (`snp4.13:4.2`, `ja300:1.3` dịch thọ trì). `ramamānopi` → dù đang hân hoan (7 khoá có `ramam…`: hân hoan 2 gồm `thag1.76`, `thag1.105:1.2`, hoan lạc 3, vui thú 1; chọn theo hai khoá thag).
    · `uccāvaca` → cao thấp (40 khoá, tầng dịch cao thấp, lớn nhỏ, khác nhau). `ālopati` → cướp đoạt (`sāhasā` → bằng bạo lực; `dn1`, `mn51`: cướp, trộm cắp, bạo lực/bạo hành). `socayitvā` → làm cho sầu khổ (`sn1.32:17.2` dịch làm khổ đau). `hantvā` → giết (`18.3`), `hantvāna` → diệt (`20.3`), `nihanti` → đánh bật (`19.2`, `19.4`; tầng không có tiền lệ), để người đọc phân biệt ba ngữ cảnh: bạo lực với người, đánh bật cái chốt, diệt năm bằng năm. `āṇi` → cái chốt (tầng chỉ có tên `sn20.12` Bài Āṇi; Sujato peg). `kusalo` → người thiện xảo (`dn16:4.43.4`). `bhāvayaṁ` → đang tu tập. `saddhā` → đức tin, `vīriya` → tinh tấn, `samādhi` → định, `sati` → niệm, `paññā` → tuệ (như `mil3.1.9:1.3`). `anīgho yāti brāhmaṇo` → vị Bà-la-môn đi không còn phiền não (`dhp294:4`, `dhp295:4`, cùng Pāli). `sukhamedhati` → hưởng hạnh phúc (12 khoá: hưởng 5, đạt 2; `sn11.1:5.2`, `ja397:3.2`). `sabbena sabbaṁ` → hoàn toàn trọn vẹn (45 khoá, hoàn toàn 36, trọn vẹn 12). `vākyānusāsani` → lời chỉ dạy (tầng không có tiền lệ).
    · `Vīsatinipāta` → Bộ Hai Mươi Bài Kinh. `Paṭhamavagga` → Phẩm Thứ Nhất. `0.4` theo khuôn Kinh Kệ Của Trưởng Lão X (`thag1.116:0.4` cùng Pāli: Kinh Kệ Của Trưởng Lão Pārāpariya). `21.5` → … Trưởng lão Pārāpariya …. Tên: Pāli `Pārāpariyo`/`Pārāpariya` giữ dạng Pārāpariya (không phải Pārāsariya như Sujato, vì Pāli ghim viết Pārāpariya).

  KHÁC BIỆT ĐÃ PHÂN XỬ (đối chiếu Sujato).
    (1) `1.1`–`1.4`: Sujato dịch This thought came to the ascetic, the monk Pārāsariya, as he was seated alone meditating in seclusion; bản Việt giữ đúng ranh giới khoá và để `Samaṇassa ahu cintā` làm mệnh đề riêng ở `1.1`, `pārāpariyassa bhikkhuno` ở `1.2`.
    (2) `2.1`–`2.4`: Sujato dịch Following what procedure, what observance, what conduct, may a person do what they need for themselves, without harming anyone else; mỗi chữ Sujato có một chữ Việt tương ứng (procedure = trình tự, observance = hạnh nguyện, conduct = cách cư xử), và dùng câu hỏi như Pāli (`kiṁ`).
    (3) `5.4`, `6.4`: Pāli `hi` (quả thật) dịch quả thật; Sujato bỏ chữ này.
    (4) `7.2`: Sujato dịch `gandhe` ở số ít (a smell), còn `7.4` smells; bản Việt dịch số nhiều (các mùi hương) cả hai chỗ, theo Pāli `gandhe` (đối cách số nhiều) và `gandhesu`.
    (5) `8.1`–`8.2`: Sujato dịch the sour, the superbly sweet and the bitter, thêm chữ superbly chỉ cho vị ngọt; bản Việt dịch tột bậc cho cả `madhuragga` và `tittakagga` vì Pāli có `-agga` ở cả hai (xem bất định).
    (6) `10.1`–`10.4`: Sujato dịch the mind from such thoughts; bản Việt dịch pháp (từ `dhammehi`), không dịch thoughts, vì `dhammehi` ở đây là những pháp (đối tượng) của năm căn.
    (7) `11.1`–`11.4`: Sujato mở bằng This body, thêm chủ ngữ; Pāli không có chủ ngữ ở bốn khoá này, nên bản Việt không thêm.
    (8) `12.1`–`12.4`: Sujato dịch You don't understand that the sweetness of honey turns bitter ...; Sujato đưa `nāvabujjhati` (từ `12.4`) lên đầu kệ và đổi trật tự các vế. Bản Việt theo thứ tự Pāli: `kaṭukaṁ madhurassādaṁ` ở `12.1`, `piyanibandhanaṁ dukhaṁ` ở `12.2`, dao cạo ở `12.3`–`12.4`.
    (9) `14.1`–`14.4`: Sujato dịch flow from five to five; bản Việt dịch năm chảy vào trong năm, giữ `pañcasu` ở vị trí cách (xem bất định).
    (10) `16.3`: Pāli `‘Na taṁ kiccan’ti`; Sujato dịch ‘This ought not be done’; bản Việt dịch ‘Đó không phải việc cần làm,’ cho `kiccaṁ` cùng chữ ở `15.4`, `16.2`.
    (11) `18.2`: Pāli `Paresamabhijigīsati` không có tân ngữ; Sujato thêm what belongs to others; bản Việt cũng dịch những gì thuộc về người khác (xem bất định).

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `16.1` `Atho sīdati saññuttaṁ`: hai cách đọc. (a) `saññuttaṁ` bổ nghĩa cho `kiccaṁ` ở `16.2`, tức việc gắn liền ấy chìm xuống, thất bại (Sujato: doomed to failure); (b) `sīdati` có chủ ngữ ngầm là người ấy, người bị ràng buộc thì chìm xuống. Bản Việt dịch sát thứ tự chữ, bị ràng buộc mà chìm xuống, để không chọn hẳn một trong hai; cả hai cách đọc đều dẫn đến cùng một ý ở `16.2`–`16.4`: nên tránh việc vô ích. `saññuttaṁ` ở `17.1` dịch gắn liền với (có tân ngữ `atthena`), còn ở `16.1` không có tân ngữ nên dịch bị ràng buộc.
    · `11.3` `Naravīrakataṁ vagguṁ`: `vīra` có thể là anh hùng hoặc người tài giỏi, khéo léo (Sujato cunning people). Bản Việt chọn người tài giỏi, theo nghĩa người khéo tay tô điểm chiếc hộp (ví dụ ở `11.4`). Nếu hiểu là anh hùng thì câu mang sắc thái mỉa mai; Pāli không nói rõ.
    · `8.1`–`8.2` `madhuraggañca`, `tittakaggaṁ`: `-agga` có thể là tột bậc, hảo hạng (Sujato superbly) hoặc phần chủ yếu, phần đầu ngọn (tầng có `sn47.8:1.2` dịch chủ yếu chua, đắng, cay, ngọt cho `ambilagga` và các dạng cùng `-agga`). Bản Việt chọn tột bậc theo ngữ cảnh hồi tưởng vị ngon nhất, không phải một món canh cụ thể.
    · `14.2` `sandanti pañca pañcasu`: năm chảy vào trong năm. Bản Việt giữ nguyên dạng ngắn, không thêm dòng chảy hay giác quan; cách hiểu truyền thống là năm đối tượng (sắc, tiếng, mùi, vị, xúc) chảy vào năm căn, nhưng Pāli ở khoá này không nêu tên và điều đó thuộc chú giải, không thuộc lời kinh.
    · `10.1` `Manaṁ cetehi dhammehi`: `ce` = `ca` + `etehi`, dịch Và tâm; không làm Pāli chắc hơn mức nó cho phép về việc ca nối tâm với năm căn ở các kệ trước.
    · `18.1`–`18.4`: kệ không có mệnh đề chính nêu rõ chủ ngữ (`yo` ở `18.4`). Bản Việt dịch người nào ở `18.4` theo `yo`; kệ này nằm giữa kệ `17` (niềm vui ở nơi pháp) và kệ `19` (đánh bật các căn bằng các căn) nên có thể là phép đối lập, nhưng Pāli không nói. Không thêm.
    · `8.4` `hadayaṁ nāvabujjhati`: lòng hay tâm (tim) của chính người ấy; bản Việt dịch lòng, không thêm mình.
    · `12.1`–`12.2` `Kaṭukaṁ madhurassādaṁ, piyanibandhanaṁ dukhaṁ`: `kaṭuka` là cay đắng, gay gắt; hai vế có thể đọc là hai tính từ của cùng một chủ thể không nêu tên hoặc hai vế độc lập. Bản Việt giữ hai vế liền nhau, cay đắng mà có vị ngọt, khổ vì sự ràng buộc với những gì thương yêu, không nối thành câu có chủ ngữ.
    · `0.2` `Vīsatinipāta` và 21 kệ ở bài này: tên bộ theo quy ước nipāta (khoảng hai mươi kệ), không phải số kệ chính xác; không sửa.

