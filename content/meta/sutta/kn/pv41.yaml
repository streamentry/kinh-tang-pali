notes: |-
  `Kumārapetavatthu`, bài thứ sáu của `Mahāvagga` trong Petavatthu. 34 khoá, tất cả
  đã dịch.

  TRA TIỀN LỆ BẰNG SỐ ĐẾM ĐƯỢC, KHÔNG ĐOÁN. Dùng `grep -rho … | sort | uniq -c |
  sort -rn` và một chỉ mục Pāli tự dựng bằng script, không dựa vào trí nhớ. Ba nơi đã có
  tiền lệ và bản này DÙNG LẠI NGUYÊN VĂN: `Jātaka` → “Jātaka”; `Catukkanipāta` → “Bộ Bốn Bài
  Kinh”; `Cūḷakuṇālavagga` → “Phẩm Cūḷakuṇāla”. `Tassuddānaṁ` → “Tóm lược:” (tiền lệ `sn36.20`);
  `Atha vagguddānaṁ` → “Và tóm lược các phẩm:” (tiền lệ `ja150`, `ja250`); `…jātakaṁ …ṁ` →
  “Kinh …, thứ …” (tiền lệ `ja341`–`ja349`). Tên tập `:0.4` giữ Pāli như “10. Kinh Arañña”,
  “9. Kinh Sandhibheda”.

  ĐẦU 0.2 THEO ĐA SỐ ĐẾM ĐƯỢC. Trong các bài `pv` đã merge, `Mahāvagga` → “Đại Phẩm” (pv46,
  pv50). `:0.3` và `:8.1` theo hình tiền lệ `pv46`/`pv50`: `N. Xpetavatthu` → “N. Chuyện Ngạ Quỷ
  …”. `Petavatthu` giữ Pāli (pv46, pv50, pv4 đều vậy).

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU — BÀI NÀY CÓ NHIỀU HƠN HẦU HẾT LÁT.
  `sammattā rajanīyesu` (2.1) — `sammattā` có thể là “ngay từ đầu, từ khi còn nhỏ” hoặc “đúng là
  đã”. Bối cảnh (hai cậu bé con vua, `āsuṁ` ở 1.3, rồi đến 2.1) cho thấy “từ nhỏ”; chọn
  “từ nhỏ, các ngài đã bám víu vào những thứ dễ chịu”.
  `kāmassādābhinandino` (2.2) — `kāma-sāda` là thứ dễ chịu của lưỡi, tức ăn uống; dịch “vui thích
  cái vị của thức ăn ngon”, không dịch thành “tham dục”.
  `na te passiṁsunāgataṁ` (2.4) — `passiṁsu` là thấy trước/tiên đoán; dịch “mà không thấy sự tham
  khổ đang đến”.
  `Bahūsu vata santesu, deyyadhamme upaṭṭhite` (4.1–4.2) — đoạn khó nhất. `santesu` là “khi có
  mặt”, `deyyadhamme upaṭṭhite` là “khi đức hạnh bố thí hiện diện”, và `vata` mang thái độ tiếc
  nuối. Bản nháp đầu tiên dịch “có biết bao điều đáng phát tặng … / cùng đức hạnh của việc bố
  thí”, lặp ý và **bỏ mất** `vata`; đã sửa thành “Bấy giờ có biết bao người, đức hạnh của việc bố
  thí / đã hiện diện;”.
  `Kiṁ tato pāpakaṁ assa` (5.1) — hỏi “từ đó sinh ra điều ác gì”; dịch “Có điều ác gì do bởi
  đó,” giữ dấu hỏi ở vế sau (5.2). `rajakulā cutā` (5.2) = chết đi **từ** dòng họ vua; giữ.
  `Sāmino idha hutvāna, honti asāmino tahiṁ` (6.1–6.2) — “Có những người ở đây, khi đã là
  sa-môn, lại không phải sa-môn ở nơi kia”. `manussā unnatonatā` (6.4) — `unnata` và `onata` là
  hai danh từ đồng nghĩa (khổ đau, bị giày vò), không phải tính từ; dịch “là những người khổ đau,
  bị giày vò” và **không** thêm ý nào ngoài đó.
  `issaramada` (7.2, 7.3) — cường quyền buông lười, “vua của sự buông lung” theo nghĩa từ điển;
  dịch “sự lười biếng, thiếu nỗ lực” ở cả hai vế và giữ đúng quan hệ `Pahāya … bhave saggagato naro`
  (đã bỏ thì mới sinh lên cõi trời). `Kāyassa bhedā sappañño` (7.5) = khi thân tan rã; `sappañño`
  là “bậc có trí”. `Sāvatthi` giữ Pāli (chỉ có ở 1.1 nên hợp lệ), `Himavanta` giữ Pāli (đã có
  trong tầng Việt).

  DẤU LƯỢC — không có `…pe…`; không phát sinh chính sách.

  `technical_integrity` đặt 9.6 vì bốn cổng kỹ thuật đều xanh (xem mục cuối), chưa đủ
  10.0 vì không ai rà lại bằng con người.

  Bốn lệnh cổng kỹ thuật đã chạy và đều xanh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  LƯỢT CẢI THIỆN 2026-10-11 (kiểm toán độc lập). Thay thế các mục cũ "ĐẦU 0.2…" ở phần tên
  `:0.3`/`:8.1` và toàn bộ mục "BẤT ĐỊNH ĐÃ GHI" ở trên; các mục còn lại giữ làm lịch sử. Đọc
  đối kháng từng khoá với Pāli cho thấy bản trước có nhiều lỗi nghĩa thật, nên điểm cũ (9.07) bị
  hạ.
  Lỗi nghĩa đã sửa (30/34 khoá đổi):
  - `sāmino … asāmino` (6.1–6.2): `sāmin` là "chủ", không phải "sa-môn". Bản cũ dịch "làm sa-môn …
    không phải sa-môn". Nay: "Đã từng là chủ ở nơi đây, họ thành kẻ không còn là chủ ở nơi kia".
  - `issaramada` (7.2, 7.3): là "sự say sưa quyền lực" (theo pv42:12 cùng công thức), không phải
    "lười biếng, thiếu nỗ lực". Bản cũ tự bịa nghĩa này ở cả hai vế.
  - `kāmassādābhinandino` (2.2): `assāda` là vị ngọt/sự hưởng thụ của dục, không phải "vị của thức ăn
    ngon". `sammattā rajanīyesu` (2.1): "mê say những điều khơi gợi tham ái", không phải "từ nhỏ …
    bám víu vào những thứ dễ chịu" (cả "từ nhỏ" lẫn "các ngài" đều không có trong Pāli).
  - `Sāvatthi nāma nagaraṁ` (1.1): "thành xô" là chữ vô nghĩa; nay "thành phố".
  - `Te idha ghosenti adissantā, pubbe dukkaṭamattano` (3.3–3.4): bản cũ bỏ `adissantā` ("không hiện
    hình"), dịch `ghosenti` thành "than thở và khóc lóc", và thêm lời dẫn ‘Trước kia, tất cả là do lỗi
    của chúng ta’ cùng cặp nháy trong không có ở Pāli. Nay: "cất tiếng, không hiện hình, nói về điều
    ác mình đã làm trước kia", không còn nháy trong (Pāli chỉ có một cặp nháy bao cả bài).
  - `Te cutā ca manussattā` (3.1): "Khi các ngài đã mất, làm người" lệch cú pháp; nay "đã mất đi khỏi
    kiếp người".
  - `Kiṁ tato pāpakaṁ assa` (5.1): "tato" là so sánh ("tệ hơn thế"); bản cũ dịch "có điều ác gì do bởi
    đó" và chêm "này". 5.3–5.4 theo tiền lệ pv14 ("sinh vào cõi ngạ quỷ", "bị đói khát bủa vây").
  - `manussā unnatonatā` (6.4): bản cũ coi `unnata`/`onata` là "khổ đau, bị giày vò", không có căn cứ.
    Cả kho dịch cặp này là "cao/nâng lên" và "thấp/hạ xuống" (an8.54, an8.55, mil5.2.3, ja516).
    Nay: "những con người đã lên cao rồi hạ thấp".
  - Tiêu đề (0.3, 8.1): `Kumārapetavatthu` theo tiền lệ pv30 (cùng tên Pāli) là "Chuyện Ngạ Quỷ Trẻ
    Nhỏ"; "Đứa Con" lệch vì `kumāra` là bé trai, không phải "con" (`putta`). `translationTitle` đã đổi
    cho khớp.
  Sửa nhỏ để sát Pāli: 4.1–4.4 bỏ "đức hạnh của việc bố thí" (`deyyadhamma` = vật đáng bố thí, tiền lệ
  pv15/pv19/pv26/pv31) và bỏ "chia sẻ", thêm `attānaṁ` ("cho mình") đã bị bỏ sót; 1.2 giữ "bên sườn núi";
  7.1–7.6 dịch đúng thứ tự mệnh đề.
  Điểm đổi (trước → sau): semantic_fidelity 9.0 → 8.8; grammar_logic 9.1 → 8.8; terminology 9.0 →
  8.8; triangulation 7.5 → 7.0 (đối chiếu duy nhất là pv42/pv14 vì không có bản Anh, và lần trước đã
  không phát hiện các lỗi trên); vietnamese_clarity 9.2 → 8.8; han_viet_balance 9.3 → 9.2;
  ambiguity_integrity 8.5 → 8.0. Các tiêu chí khác giữ nguyên.
  Bất định còn lại, KHÔNG phân xử được: (a) `parittaṁ` (4.4) vừa có thể là "chút ít" vừa là "sự che chở";
  giữ "chút ít điều đem lại an lạc" như bản trước. (b) `bahūsu` (4.1) không có danh từ đi kèm, bổ nghĩa
  cho `deyyadhamme`; dịch "nhiều" để trống danh từ. (c) `unnatonatā` có thể là "kẻ cao người thấp" nói
  chung thay vì chuỗi lên-rồi-xuống; giữ cách đọc theo mạch 6.1–6.2. (d) `bhave saggagato naro` (7.4)
  là cách đọc "sẽ đi đến cõi trời" (khả năng). (e) 1.2 `passato`: "bên sườn" chưa chắc là nghĩa đen.
  Blocker "không có tầng tham khảo tiếng Anh" giữ nguyên.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 1 khoá bất đồng nghĩa → sửa 0, giữ 0, bất định 1 (4.1: bản nguyên bài đọc `bahūsu … santesu` là 'các bậc đạo đức có nhiều', tức người; bản dự án giữ 'đang có nhiều' không nêu danh từ; về hình thái `bahūsu santesu` là vị trí cách số nhiều còn `deyyadhamme` số ít nên `bahūsu` không bổ nghĩa cho `deyyadhamme` như ghi chú cũ nói, và Pāli không nói rõ đang có nhiều người hay nhiều vật nào; giữ cách dịch để ngỏ, không chêm danh từ). Đã so từng khoá 1.1–8.1: thành Sāvatthi bên sườn Himavanta, hai vương tử, say mê điều khơi gợi tham ái và không thấy điều sẽ đến, chết rồi cất tiếng không hiện hình về điều ác đã làm, mất từ dòng vua sinh vào cõi ngạ quỷ, từng là chủ nay không còn, kết kệ về tai họa của sự say quyền lực đều cùng nghĩa với bản nguyên bài. Lượt review đối kháng của bản dự án không tìm thêm lỗi. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
