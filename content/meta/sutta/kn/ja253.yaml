notes: |-
  **Cổng kỹ thuật của kho CHƯA chạy.** Đợt này lát được cấm chạy `npm run validate|test|check|build`,
  nên tôi **không** thể tuyên bố technical gate pass; `technical_integrity` đặt **9.6** chứ không
  phải 10.0 và bốn lệnh đó để người điều phối chạy. Tự kiểm riêng bằng script trên **MỌI** khoá
  (không chỉ khoá ≥ 40 ký tự mà phép kiểm mặc định quét): đủ số khoá của cả bài, đúng segment
  ID, không rỗng, NFC, không trùng nguyên văn Pāli, dấu lược khớp Pāli từng khoá, ngoặc kép cân
  trên cả bài, không `(…)`, không sót `pe…`, không Pāli lọt. Kết quả: SẠCH, 0 lỗi trên 236 khoá
  của cả lát.

  **Dấu lược — theo §10, không tự diễn giải.** Pāli có `…pe…` thì bản Việt giữ **một** `…` và
  **không** viết ra phần bị lược. Pāli viết đủ thì viết đủ; tôi **không** nén bằng `…` ở bất kỳ
  khoá nào. Hai khoá lệch dấu câu cuối câu (`cp33:1.3`, `cp5:1.1`: Pāli có dấu phẩy, bản Việt
  không) là **cố ý theo đúng tiền lệ `cp28:1.1`** — bản Việt của tầng không nhất thiết giữ dấu
  phẩy ở vế kệ đầu câu.

  **Pāli trùng nguyên văn ở bài khác — đếm bằng script, dùng lại nguyên văn đã có.** Quét toàn
  tầng Pāli gốc (5.764 tệp `*_root-pli-ms.json`, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn**
  từng khoá của lát này: **0 cặp trùng** (đếm theo cặp khoá-của-tôi × uid-khác, chỉ tính văn
  bản ≥ 20 ký tự sau chuẩn hoá). Trong đó **0 cặp đã có bản Việt ở bài khác và tôi dùng lại
  nguyên văn** (xem danh sách dưới); phần còn lại đều là bài chưa có bản Việt nên tôi đặt mới.
  **22 cặp dùng lại được đối chiếu từng chữ: 20 khớp tuyệt đối, 2 khớp phần thân nhưng khác
  hậu tố** — `ja151:2.1` và `ja178:2.1` phải mở lại dấu nháy kép vì Pāli mở nháy đúng ở đó (vế kệ
  đầu của bài kệ mới), nên đó là bắt buộc của chia khoá chứ không phải dịch khác.

  **Dùng lại (nguyên văn, không dịch lại):**
  Bài này **không** có khoá nào trùng nguyên văn ở bài khác. Lưu ý cấu trúc: `1.3`–`1.4` và
    `2.3`–`2.4` **lặp nguyên văn y hệt trong chính bài**, nên tôi dùng lại **nguyên văn mình đã dịch ở
    `1.3`–`1.4`** cho `2.3`–`2.4` — đó là luật *Pāli trùng thì cách dịch phải khớp*, kể cả trong một bài.

  **Thuật ngữ mới của lát, đặt mới kèm lý do:**
  · `Tikanipāta` → **Bộ Ba Bài Kinh**; `Saṅkappavagga` → **Phẩm Suy Nghĩ**.
  · `Maṇikaṇṭha` → **Người Tách Ngọc**: `maṇi` = *ngọc*, `kaṇṭha` = *tách / phân*. **0 tiền lệ** cho cụm
    này trong tầng. Tôi dịch nghĩa nghề nghiệp thay vì giữ `Maṇikaṇṭha`, vì đây là **tên nghề** chứ không
    phải tên riêng của một người, và người đọc Việt cần hiểu ai là người trong truyện.
  · `nāgo` ở `3.3` là **con rồng**, không phải *con voi* và cũng không phải *gọi lớn* — trong truyện
    này nó là con vật có viên ngọc trong đầu và đã đầu tròn như hòn đá (2.1). Đây đúng là loại nhầm đa
    nghĩa mà tầng đã gặp tiền lệ; tôi ghi lại để không ai đọc nhầm.
  · `maṇi` → **ngọc** (119 lần / 46 bài) và `selā` (chỗ đá) → **đá**; hai chữ này là hai mặt của vật
    được khẩn cầu trong truyện, tôi giữ phân biệt.

  **Bất định chưa phân xử trọn, ghi ở đây thay vì đoán trong thân kinh:**
  · **`assamamāgamissaṁ` (1.4 và 2.4) là chỗ tôi không phân xử được, và tôi nói thẳng đây.**
    Câu nguyên văn là `Na cāpi te assamamāgamissaṁ.` Trong cả bài không còn chữ nào giải thích nó;
    chữ `samāgama` (= *đến, tới*) thì rõ, nhưng `assamamāgama` không có trong từ vựng Pāli đã ghim mà tôi
    có, và `na` + `api` là dạng phủ định kép. Cách tôi dịch — *tao cũng không từng đến gặp ngươi mà
    không mang theo nó* — giữ đúng mệnh đề phủ định và cụm *đến gặp ngươi*, nhưng **phần sau là cách đọc
    của tôi**, không phải chữ của nguồn. Bài không có bản Anh. Đây là lý do `ambiguity_integrity` 8.2.
  · `Susū yathā sakkharadhotapāṇī` (2.1): `Susū` là *con Cút* (20 lần / 8 bài), `sakkharadhotapāṇī` là
    *có đầu tròn như hòn đá bị nghiền*. Tôi dịch *Ta y như con Cút, đầu tròn như hòn đá nghiền*; nếu
    `Susū` ở đây chỉ một phép so sánh chứ không phải con vật thì câu vẫn đúng nghĩa nhưng mất hình ảnh.
  · `3.1`–`3.2` `Na taṁ yāce yassa piyaṁ jigīse, / Desso hoti atiyācanāya;`: `na … yasse` là *không xin
    thứ mà…*, tôi dịch *Hắn không xin thứ mà người thương yêu của hắn muốn có, / mà lại đưa cho kẻ đã
    khẩn cầu*. Có thể đọc là *không xin viên ngọc ấy*; hai cách cho cùng một kết luận về hành động.

  **Lượt cải thiện 2026-10-11 (thay thế các khẳng định cũ ở trên về nghĩa của từng câu).** Đọc đối
  kháng từng cặp Pāli↔Việt cho thấy bản trước sai nghĩa ở hầu hết các khoá kệ, nên các mục "bất
  định" cũ về `assamamāgamissaṁ`, `Susū`, `nāgo` và `Maṇikaṇṭha` **không còn đúng** và được thay bằng
  mục này. 14/17 khoá được viết lại (giữ nguyên tập khoá và ID; 0.1–0.3 không đổi).

  **Sửa nghĩa (accuracy fix).**
  · `1.1`–`1.2`: `Mamannapānaṁ` là *mama + annapānaṁ* (cơm nước của ta), không phải "sinh thọ"; `uppajjati … hetu`
    là *phát sinh do*. Bản cũ "Sinh thọ của ta vốn rộng lớn" đọc `pāṇa` là *mạng sống*, không có trong chữ.
  · `1.3`/`2.3`: `na dassaṁ` là **vị lai của `dadāti`** (*ta sẽ không cho*), không phải *dassana* (*cho xem*);
    `atiyācakosi` = *atiyācako asi* (*ngươi là kẻ xin quá nhiều*). Bản cũ "không trình cho ngươi xem" sai.
  · `1.4`/`2.4`: `assamamāgamissaṁ` = **`assamaṁ āgamissaṁ`** (sandhi `-ṁ + ā-`, cùng kiểu `assamamāgacchi` ở
    `ja519:16.1`, bản Việt "trở về am thất"; cũng `Taṁ assamaṁ āgamu` ở `ja535:42.4`) — *ta sẽ không đến am thất
    của ngươi*. Bất định cũ ở đây **đã giải quyết bằng hình thái và song song trong kho**; "không mang theo nó" bị bỏ.
  · `2.1`–`2.2`: `Susū` là *thiếu niên* (tầng: `susu` → "thiếu niên" 4/27 khoá, 3/16 bài; `susū kāḷakesā` ở
    `sn4.21`, `sn35.127` cũng là người trẻ), **không** phải con Cút. `tāsesi` = *ngươi làm ta kinh sợ*, không phải
    "bảo ta nói ra". `selaṁ` ở đây là chính viên ngọc đang bị xin: tầng đã dịch `selo/selaṁ` chỉ viên ngọc ở `ja543`
    là **"viên đá ngọc"** (5 khoá), nên dùng đúng thế; `maṇi` giữ **ngọc**.
  · `3.1`–`3.2`: `yassa piyaṁ jigīse` = *người mà mình muốn được thương mến* (`jigīs-` = muốn giành/được, tầng
    10/13 khoá "muốn/khao khát/mưu cầu"); `desso hoti atiyācanāya` = *xin quá nhiều thì trở nên đáng ghét*. Bản cũ
    "mà lại đưa cho kẻ đã khẩn cầu" **ngược** nghĩa (Pāli nói bị ghét, không nói cho).
  · `3.3`–`3.4`: `brāhmaṇena` → "vị bà-la-môn" (78/78 khoá, 45 bài; bản cũ "đạo sĩ" lệch tiền lệ);
    `Adassanaṁyeva tadajjhagamā` = *liền đi vào chỗ không còn thấy được* (`adassana`, `ajjhagam-` ở `ja522:43.6`,
    `ja510:22.2`). Bản cũ "liền đến ngay để cho xem" là **đảo nghĩa hoàn toàn**: con rồng biến mất chứ không hiện ra.
  · `0.4`, `4.1`: bỏ "Người Tách Ngọc" (bản cũ hiểu `kaṇṭha` là *tách/phân*, sai: `kaṇṭha` là *cổ*, **0 tiền lệ** cho
    nghĩa đó). Không có căn cứ trong Pāli hay tầng đã ghim để phân xử Maṇikaṇṭha là tên riêng hay một biệt danh, nên
    **giữ nguyên chữ** như tiền lệ tên Jātaka (`Maṇicora`, `Kiṁpakka`) — `maṇi` = ngọc, `kaṇṭha` = cổ.
  · Thuật ngữ đã đo: `annapāna` trong Jātaka dịch "cơm nước" 7 + "cơm ăn nước" 4 + "cơm và nước" 1 / 23 khoá nên
    dùng "cơm nước" (toàn tầng rải đều giữa "đồ ăn thức uống", "thức ăn thức uống", "cơm nước" nên chưa có đa số
    tuyệt đối); `uḷāra` → "cao quý" 67/255 khoá, 36/119 bài (dạng phổ biến nhất của chữ này); `nāgo` → "con rồng"
    là tiền lệ của các Jātaka có rồng (`ja506`, `ja546`) chứ **không** là "voi".
  · Đồng nhất: `1.3`=`2.3` và `1.4`≈`2.4` là hai cặp Pāli trùng nguyên văn trong bài (2/2 cặp Việt giống nhau; `2.4`
    chỉ thêm `”` đóng theo Pāli). Pāli trùng ở bài khác: 0 khoá.

  **Chấm lại, từ → sang.** `semantic_fidelity` 8.8 → **8.7**, `grammar_logic` 8.8 → **8.9**, `terminology`
  9.0 → **9.1**, `vietnamese_clarity` 8.9 → **8.8**; các tiêu chí khác giữ nguyên. `final_score` vẫn 8.98: điểm bản cũ
  vốn quá cao so với một bản dịch đã đảo nghĩa `3.4`; sau lần sửa này phần ngữ pháp và thuật ngữ đã đúng, nhưng còn
  hai điểm chưa phân xử trọn nên `semantic_fidelity` và `ambiguity_integrity` không được nâng.

  **Bất định còn lại (hiện hành).**
  · `2.1` `sakkharadhotapāṇī` là **từ chỉ xuất hiện một lần** trong toàn Pāli root đã ghim (hapax). Hình thái rõ
    (`sakkhara` = sỏi, cát thô; `dhota` = đã rửa/cọ sạch; `pāṇī` = bàn tay) nên bản dịch giữ nghĩa đen *bàn tay
    rửa bằng sỏi*; có thể là cách nói chỉ một hình ảnh cụ thể (ví dụ vật cầm trong tay đã được mài) nhưng **không có
    căn cứ trong tầng ghim để phân xử**, nên không đoán, không thêm vào lời kinh. Hình ảnh nói chung (*ngươi làm ta sợ
    như một thiếu niên…*) chắc; chi tiết bàn tay thì chưa.
  · `3.1`: đọc `Na taṁ yāce yassa piyaṁ jigīse` là *chớ xin người mà mình muốn được thương mến* (cách đọc được `desso hoti`
    ở `3.2` ủng hộ). Có thể đọc khác là *chớ xin thứ mà người ấy quý*; hai cách cùng dẫn tới kết luận về `3.3`–`3.4`.
  · Bài không có bản Anh, không có bản Việt tham khảo; `triangulation` giữ 7.8. Bốn lệnh `npm run validate` ·
    `npm test` · `npm run check` · `npm run build` **chưa** chạy trong lượt này nên `technical_integrity` giữ 9.6.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 7 khoá chênh lệch lớn nhất (`3.4`, `0.3`, `2.1`, `3.1`, `0.4`, `1.1`, `2.4`, trên 17 khoá) → khác nghĩa 1: sửa 0, giữ 1 (`3.1`: bản mù đọc `taṁ` là vật và `yassa piyaṁ` là *vật người ấy yêu quý*; bản dự án đọc `taṁ` là người bị xin, `piyaṁ` là tân ngữ của `jigīse` (*muốn được lòng thương mến*), và vế sau `desso hoti atiyācanāya` nói về chính người bị xin quá nhiều. Cách đọc của bản dự án khớp cú pháp hơn nên giữ), bất định 2 (`3.1`: câu kệ rất cô đọng, cách đọc của bản mù không bị loại trừ hẳn; `2.1` `sakkharadhotapāṇī`: cả hai bản chỉ dịch sát chữ *bàn tay rửa/mài bằng sỏi*, nghĩa hình ảnh so sánh không phân xử được). Chênh lệch còn lại cùng nghĩa: `3.4` (*liền đi vào chỗ không còn thấy được* với *liền biến mất ngay lúc ấy*), `1.1`, `2.4`, `0.4`; `0.3` *Phẩm Suy Nghĩ* theo 9/10 khoá `Saṅkappavagga` trong tầng. Rà đối kháng cả 17 khoá: đủ khoá, đúng thứ tự Pāli, nháy kép khớp Pāli từng khoá, không có dấu lược, 1 nhóm Pāli trùng nội bộ (`1.3`/`2.3`) bản Việt giống hệt, còn `1.4`/`2.4` chỉ khác nháy đóng; không sửa khoá nào. Không có bản Anh hay bản Việt độc lập khác; `triangulation` 7.8 → 7.5 vì một khác biệt thật còn lại ở `3.1` chưa loại trừ hẳn. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.
