notes: |-
  Đợt 19, làn 91. Dịch từ Pāli root commit đã ghim, đủ 132/132 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ năm của Buddhavaṃsa, về Đức Phật Maṅgala (vị thứ ba theo `33.1`: `tatiyo`): hào quang và bốn chân lý, ba lần chứng ngộ và ba kỳ hội chúng, tiền thân Bà-la-môn Surucī cúng dường và được thọ ký, xuất gia, gia thế, xuất gia lần cuối và chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và bảo tháp. Lời kể mở đầu bằng dấu nháy kép ở `1.1` và đóng ở `32.4`; lời thọ ký mở nháy đơn ở `12.3` và đóng ở `13.3`. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn các phẩm anh em (20/20 tiền lệ).
  - `0.2` “5. Dòng Kế Thừa Của Đức Phật Maṅgala”: `maṅgalabuddhavaṁsa`; cùng khuôn với `bv3:0.2`, `bv9:0.2`, `bv19:0.2`. Số “5.” là số ghi trong tiêu đề Pāli (thứ tự phẩm), còn thứ tự Đức Phật là thứ ba (`33.1`).
  - `33.1` “Dòng kế thừa của Đức Thế Tôn Maṅgala là thứ ba.”: `tatiyo` = 3; cùng khuôn với `bv3:32.1` (thứ nhất), `bv9:30.1` (thứ bảy). `1.1` “Sau Koṇḍañña” khớp thứ tự (Dīpaṅkara thứ nhất, Koṇḍañña thứ hai).

  **Số Pāli, đã tự tính.** `dasasahassī` 10 × 1.000 = **mười ngàn** thế giới (2.4; khớp `bv18:21.4`). `caturo` 4 (3.2 bốn chân lý; 21.1 bốn dấu hiệu). `koṭisatasahassa` 1 × 100 × 1.000 = **một trăm ngàn koṭi** (4.3, 8.3, 9.1; 15 tiền lệ nguyên văn). `koṭisahassa` = **một ngàn koṭi** (5.3; 2 tiền lệ). `navutikoṭi` 90 koṭi (7.2, 9.2; `navuti` = 90). `tayo` 3 (8.1 ba kỳ hội chúng khớp ba con số ở 8.3, 9.1, 9.2; 19.4 ba lâu đài khớp ba tên ở 19.3). `tiṇṇaṁ vedāna` ba Vệ Đà (10.4). `dasapāramī` 10 (14.4). `navaṅga` chín phần (16.2; 2 tiền lệ). `navavassasahassa` 9 × 1.000 = **9.000 năm** (19.1; 4 tiền lệ). `samatiṁsasahassa` = **30.000** người nữ (20.1) — điểm chưa phân xử được, xem bất định 1. `anūnaaṭṭhamāsa` = không thiếu + 8 = **đủ tám tháng** (21.3; 4 tiền lệ). `aṭṭhāsīti` 8 + 80 = **88 ratana** (26.1; khớp `bv13:26.1`). `anekasatasahassiyo` = nhiều × 100 × 1.000 (26.4, số nhiều không quy thành con số). `navutivassasahassa` 90 × 1.000 = **90.000 năm** (27.1; 4 tiền lệ). `tiṁsayojana` **ba mươi do-tuần** (32.4; `tiṁsa` = 30, như `chattiṁsa` = 6 + 30 ở `bv3:31.4`). `paṭhamo`, `dutiyo`, `tatiyo` 1, 2, 3 (8.4, 9.1, 9.2, 5.4, 33.1). Không có cụm `Tiṁsakappasahassa` ở bài này. Lưu ý Pāli ghi lần tụ hội thứ nhất và thứ hai cùng là một trăm ngàn koṭi (8.3, 9.1); Việt giữ đúng như Pāli.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt hiện có (draft và published, gồm cả các phẩm cùng đợt; so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 66 khoá của bài có Pāli trùng với khoá bài khác, tổng 1.586 cặp, trong đó 73 cặp có Việt khác bản tôi viết (27 ở `13.2` `…pe…`, chỉ khác dấu cách hoặc dấu nháy đầu; 46 ở các khoá còn lại); 44 khoá dùng đúng nguyên văn mọi tiền lệ (`0.1`, `1.2`, `2.4`, `4.3`, `5.2`, `5.3`, `8.1`, `8.3`, `9.3`, `11.3`, `12.1`, `13.3`, `14.1`, `14.3`, `14.4`, `15.4`, `16.1`–`16.4`, `17.1`, `17.2`, `18.3`, `19.1`, `19.2`, `19.4`, `20.1`, `21.1`–`21.3`, `22.1`, `22.3`, `23.2`, `24.2`, `25.2`, `25.4`, `26.1`, `26.2`, `27.1`–`27.3`, `30.2`, `31.3`, `32.3`).
  - Chỗ viết **khác** tiền lệ, có lý do: `1.1` (1 cặp, `bv28:4.1` “Sau Koṇḍañña,”): thêm dấu nháy mở “ vì Pāli ở đây mở lời kể. `4.2`, `4.4`, `8.4`, `9.4`, `14.2` (khác chỉ ở dấu cuối: tiền lệ `;` hoặc `.`; theo Pāli từng khoá của bài này). `10.1` (19 cặp, 4 khác: “Vào lúc ấy, ta,” 15; “Vào lúc ấy tôi,” 2): chọn “ta” vì người kể là Đức Phật Gotama (cùng ngôi `bv15:9.1`, `bv13:11.1`). `10.3`–`10.4` (8 và 10 cặp; 5 và 7 khác): các khoá `tha-ap` có dạng “Vị thầy tụng đọc…”, “thông thạo ba Veda, bậc đã đi đến bờ bên kia”, “đã vượt qua ba thọ”; ở đây dùng dạng của `bv15:9.3`–`9.4`, `tha-ap340:1.4`, `tha-ap403:23.1` (3 khoá giống nguyên văn mỗi khoá), cùng phẩm và cùng ngôi kể. `11.1` (1 cặp, `tha-ap26:4.3` “tôi đã đến gần vị ấy,”): đổi “tôi” thành “ta” theo ngôi bài. `12.3` (5 cặp, 2 khác): xem mục “Hướng của lời thọ ký” dưới đây. `12.4` (17 cặp, 1 khác: “vị này sẽ là Đức Phật.”): chọn 16/17. `13.1` (16 cặp, 1 khác chỉ do nháy mở). `17.3` (1 cặp trùng nguyên văn, `tha-ap521:22.1` “Sau khi đạt đến chỗ tận cùng của các thắng trí,”): Pāli ở đây là hợp từ `abhiññāpāramiṁ gantvā`; `bv13:17.3` và `bv20:13.3` có `abhiññāsu pāramiṁ gantvā` (tách làm hai chữ, khác nguyên văn) và dịch “Sau khi đạt ba-la-mật trong các thắng trí,”. Tôi dùng cách dịch của hai khoá này cho nhất quán trong phẩm Buddhavaṃsa; nghĩa không đổi. `20.2` (24 cặp, 3 khác; 21 giống: “người nữ được trang sức đẹp đẽ;” là dạng đa số). `21.4` (9 cặp, 1 khác: “nỗ lực chung thức cuối cùng” — “chung thức” không có trong Pāli và có vẻ là lỗi; dùng “đã nỗ lực tinh tấn” (8/9). **Lỗi ngoài lát, báo chứ không sửa**, đã nêu ở các lát trước). `22.2` (1 cặp, `bv28:4.2` “có bậc Dẫn Đạo tên là Maṅgala;”): ở `bv28` và `1.2` là chủ ngữ mới mở câu nên có “có”; ở `22.2` là đồng vị của chủ ngữ “Bậc Đại Anh Hùng” ở `22.3`, không mở câu, nên bỏ “có”. `24.3` (15 cặp, 1 khác chỉ thiếu dấu phẩy). `27.4` (20 cặp, 1 khác: “cứu vớt đông đảo chúng sanh.”): chọn dạng đa số 19/20. `30.4` (1 cặp, `tha-ap450:1.4` “bậc ấy đã hoàn toàn an tịnh, vang danh khắp nơi.”): khoá ấy dịch `mahāyaso` thành “vang danh khắp nơi”, thêm ý “khắp nơi”; ở đây theo `bv13:30.4` (“những bậc có danh tiếng lớn, đã nhập Niết-bàn”) và `bv28:6.2` (“bậc có danh tiếng lớn”). `31.1` (1 cặp, `mil7.8.5:3.1` “Nhìn toàn thể các hành,”): khoá ấy không dịch `sabhāvattha` (bản chất); xem mục `31.1`–`31.4` dưới đây.
  - **Hướng của lời thọ ký (`12.3`).** `Aparimeyyito kappe … bhavissati` là lời thọ ký tương lai: đếm kiếp **sau** thời Maṅgala (Surucī) là lúc vị này thành Phật (Gotama). Việt: “Sau vô lượng kiếp nữa,” đúng 4/5 tiền lệ (`bv7:12.3`, `bv8:13.3`, `bv9:14.3`, `bv10:13.3`); tiền lệ còn lại (`bv28:1.1` “Vào vô lượng kiếp trước đây,”) là người kể nhìn ngược về quá khứ, khác ngữ cảnh nên không theo.
  - Trùng trong chính bài: 3 nhóm Pāli trùng (`1.2`/`22.2`, `4.3`/`8.3`, `8.2`/`18.4`/`23.4`), 5 cặp, trong đó 4 cặp Việt khác có chủ ý và 1 cặp giống hệt: `4.3`/`8.3` “Của một trăm ngàn koṭi,” (giống); `1.2` “có bậc Dẫn Đạo tên là Maṅgala;” và `22.2` “bậc Dẫn Đạo tên là Maṅgala;” (lý do ở trên); `8.2` “nơi Maṅgala, bậc Đại Ẩn Sĩ;” (nơi xảy ra ba kỳ hội chúng, khuôn `bv13:7.2`), còn `18.4` và `23.4` “của Maṅgala, bậc Đại Ẩn Sĩ.” (sở hữu cách: mẹ, thị giả; khuôn `bv13:18.4`, `bv13:23.4`) giống nhau.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có, khoá phân biệt; so Pāli với bản Việt cùng khoá).
  - `nāyaka` → “bậc Dẫn Đạo” (38 trên 48 khoá bv chứa `nāyak-`; “Lãnh Đạo” dùng cho `lokanātha` ở `bv3`). `lokanāyaka` → “bậc Dẫn Đạo thế gian” (`tha-ap33:3.2`, `tha-ap10:7.2`; 154 khoá chứa `lokanāyak-`: “Dẫn Đạo” 106, “Lãnh Đạo” 15, “Đạo Sư” 12, “Dẫn Lộ” 7, khác 14). `mahesi` → “Đại Ẩn Sĩ” (127 trên 187 khoá; “Đại Tiên” 8, “Đại Hiền” 6). `mahāmuni` → “Đại Mâu-ni” (`bv9`, `bv10`, `bv13`). `mahāvīra` → “Đại Anh Hùng”. `jina` → “bậc Chiến Thắng”. `dvipaduttama` → “bậc tối thắng giữa loài hai chân” (8 trên 9 khoá; khoá còn lại `tha-ap486:9.4` dịch “Tối Thượng Loài Hai Chân”). `sambuddha` → “bậc Chánh Đẳng Giác”.
  - `atula` → “không thể cân lường” (16 trên 17 khoá bv chứa `atul-`; `bv18:3.1`, `bv19:3.1`, `bv16:25.1` “ánh sáng không thể cân lường”). Dùng cho `pabhā` (2.1) và `bodhi` (4.1). Phương án khác: “vô song” (dạng `vv53:4.3`, `thag4.6:2.4`), nhưng trong bv “vô song” dành cho `asama` (`bv19:1.2`).
  - `nihantvāna` → “sau khi tiêu diệt” (`bv16:1.3`, `bv15:2.3`; 2/2 khoá `nihantvāna` trong bv). `tama`/`mahātama` → “bóng tối”, “bóng tối lớn” (`bv16:1.3`). `vinodeti` → “xua tan” (124 khoá chứa `vinod-`: “xua tan” 51, “trừ diệt” 25, “xua đuổi” 5, “dứt bỏ” 4, “loại bỏ” 3, “tiêu diệt” 3, khác 33; `snp2.5:8.2` cùng chữ `vinodenti` dịch “xua tan”). `abhidhāreti`/`dhāreti` → “nâng giữ” (`bv19:12.4` `dhārayiṁ` “nâng giữ”; `tha-ap522:2.3` “giữ”). `ukkā` → “ngọn đuốc” (khoá duy nhất có tiền lệ là `mn76:53.4` `sadhammokkaṁsanā`, nghĩa khác; không có tiền lệ cho `dhammokka`).
  - `saccarasa` → “vị của chân lý” (không tiền lệ); `pivati` → “uống”. `ariyasacca`/`sacca` → “chân lý”, “bốn chân lý” (`bv13:6.2`; `bv15` cùng khuôn). `dhammadesanā` → “thuyết Pháp” (39 trên 69 khoá; `bv9:5.4`, `bv19:4.4`). `abhisamaya` → “chứng ngộ” (`bv18`, `bv20`). `varuttama` → “cao quý, tối thượng” (21 khoá chứa `varuttam-`/`pavaruttam-`: “tối thượng” 8, “tối thắng” 4, “cao quý” 1, “tuyệt hảo” 1, khác 7; giữ cả hai nửa `vara` + `uttama` thay vì gộp). `dhammabherī` → “tiếng trống Pháp” (`tha-ap471:4.1`, 1/1). `āhanati` → “đánh”.
  - `cakkavattī` → “Chuyển Luân Vương” (451 trên 586 khoá; “Chuyển luân vương” 104). `ehibhikkhuka` → “tỳ-kheo Thiện Lai” (không tiền lệ trong tầng; xem bất định 4). `anucara` → “tùy tùng”. `khīṇāsava` → “đã đoạn tận lậu hoặc”; `vimala` → “không cấu uế” (13/13 khoá `bv`). `sannipāta` → “kỳ hội chúng”, `samāgama` → “cuộc tụ hội” (`bv7:6.1`, `bv9:8.1`, `bv13:7.1`). `brāhmaṇa` → “vị Bà-la-môn” (`bv15:9.2`, `bv8:12.2`, `bv7:10.2`). `ajjhāyaka` + `mantadhara` → “người tụng đọc, người thuộc lòng những bài tụng” (8 khoá, 3 giống nguyên văn). `vedāna pāragū` → “bậc thành thạo ba Vệ Đà” (`bv15:9.4`, `tha-ap340:1.4`, `tha-ap128:2.4`).
  - `saraṇaṁ gacchati`/`gantvā` → “quy y” (92 trên 97 khoá chứa `saraṇaṁ gantvā/gacch-/upagacch-`; `thi-ap40:3.1` `saraṇaṁ gantvā` “Sau khi quy y”). `gandhamālā` → “hương và vòng hoa” (`bv17:9.3`). `pūjayiṁ` → “cúng dường” (230 khoá chứa `pūjayiṁ`). `tappeti` → “làm cho no đủ” (9 khoá “no đủ”, 4 “thỏa mãn”, 4 “làm hài lòng” trên 28; `bv9:13.3`). `byākaroti` → “thọ ký” (12/12 cho `Sopi maṁ buddho byākāsi`). `padhāna` → “nỗ lực tinh tấn”. `pasādeti` → “làm cho tịnh tín” (35 trên 42). `vata` → “lời nguyện” (`bv13:15.3`, 14 khoá cùng Pāli). `pāramī` → “ba-la-mật”. `pītiṁ anubrūheti` → “nuôi dưỡng niềm hỷ” (`tha-ap151:1.3` “nuôi lớn niềm vui”; `cp21:2.2`, `ja61:1.6` “nuôi dưỡng”; `pīti` → “niềm hỷ” `bv19:10.4`). `sambodhivarapatti` → “đạt được giác ngộ cao quý” (không tiền lệ; `sambodhimuttama` → “giác ngộ tối thượng” ở ít nhất 10 khoá bv/cp/tha-ap, đây là `vara` chứ không `uttama`, nên viết “cao quý”).
  - `pabbajiṁ` → “xuất gia” (138 khoá chứa `pabbajiṁ`). `navaṅga satthusāsana` → “lời dạy chín phần của bậc Đạo Sư” (`bv13:16.2`, `bv20:12.2`). `jinasāsana` → “giáo pháp của bậc Chiến Thắng”. `sobheti` → “làm rạng rỡ”. `brahmaṁ bhāvanā` → “sự tu tập thuộc Phạm thiên”. `abhiññā` → “thắng trí”. `brahmaloka` → “cõi Phạm thiên”.
  - `agāraṁ ajjhāvasati` → “sống tại gia” (17/17 khoá). `pāsāda` → “lâu đài” (18/18). `nāri` → “người nữ”. `atraja` → “người con ruột”. `nimitta` → “dấu hiệu”. `assayāna` → “xe ngựa” (`bv19:19.2`, 2/2). `Brahmunā yācito` → “Được Phạm thiên thỉnh cầu” (19 khoá). `vattati cakkaṁ` → “chuyển bánh xe” (17/17 khoá bv).
  - `aggasāvaka/-ikā` → “đệ tử thượng thủ / nữ đệ tử thượng thủ” (23/26); `upaṭṭhāka` → “thị giả”; `aggupaṭṭhaka/-ikā` → “thị giả hàng đầu / nữ thị giả hàng đầu” (35/50). `bodhi` → “Cây Bồ-đề” (14/15).
  - `ūmi` → “lượn sóng” (khoá trong tầng: “sóng” 30 trên 33). `sāvaka` → “đệ tử”. `gaṇeti` → “đếm” (không tiền lệ cho dạng `gaṇetuye`). `āyu` → “tuổi thọ” (11/11 cho `āyu vijjati tāvade`). `tāreti` → “đưa … vượt qua” (`bv12:30.1`, `bv20:24.2`). `nibbuto` → “nhập Niết-bàn” (32/32 khoá bv). `mahājana` → “đại chúng” (`bv3:29.2`). `jinathūpa` → “bảo tháp của bậc Chiến Thắng” (4/4). `ratana`, `koṭi`, `yojana` → “ratana” (11/15 khoá bv), “koṭi” (59/59 khoá bv), “do-tuần” (`bv3`, `bv19`).
  - Tên riêng (giữ dạng Pāli có dấu): `Koṇḍañña`, `Maṅgala`, `Sunanda`, `Surucī`, `Uttara`, `Uttarā`, `Yasavā`, `Sucimā`, `Sirīmā`, `Yasavatī`, `Sīvala`, `Sudeva`, `Dhammasena`, `Pālita`, `Sīvalā`, `Asokā`, `Nanda`, `Visākha`, `Anulā`, `Sutanā`, `Vassara`. `Sīvalā` (24.1, nữ đệ tử) khác `Sīvala` (20.4, con trai); `Uttara` thành phố (18.1) và `Uttara` Sát-đế-lợi (18.2) là hai khoá khác nhau cùng tên, không nối với `Uttarā` mẹ (18.3).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `20.1` `samatiṁsasahassāni`: tôi đọc `sama` là “tròn, đủ” rồi 30 × 1.000 = 30.000 (viết “Đủ ba mươi ngàn”, cùng cách `bv19:18.1` và `bv24:17.1` — hai khoá đó do cùng người dịch, không phải chứng cứ độc lập). Cách đọc khác: `samatiṁsa` = 33 (khớp `bv15:17.1` và `bv16:16.1` cùng vị trí đếm người nữ, 33.000). Tầng Anh không có. **Không phân xử được, người biên tập cần xác nhận.**
  2. `11.6` `gavapāna`: “thức uống từ sữa bò”. Tầng Việt không có tiền lệ cho chữ này. `gava` = bò, `pāna` = thức uống; tôi đọc theo nghĩa thông thường là thức uống làm từ sữa bò, nhưng Pāli ở khoá này chỉ nói “thức uống từ bò” (từ hai thành tố), chưa nêu “sữa”. Cách đọc khác: cháo sữa hoặc món uống khác. `tappayiṁ` → “làm cho no đủ”.
  3. `5.4` `dutiyo samayo ahu`: Pāli ở đây là `samayo`, không phải `abhisamayo` như `bv18:4.4`, `bv17:3.4`. Tôi đọc là lần chứng ngộ thứ hai theo khuôn `4.4` `dhammābhisamayo ahu` (lần thứ nhất ở bài này) và các phẩm anh em. Cách đọc khác: `samaya` = “dịp, thời điểm, buổi hội thứ hai”.
  4. `7.4` `ehi bhikkhukā`: “tỳ-kheo Thiện Lai” là cách dịch Hán-Việt quen thuộc của `ehi bhikkhu` (người được thọ giới bằng lời “hãy đến, tỳ-kheo”), giữ nguyên thuật ngữ để khỏi thêm dấu nháy (Pāli khoá này không có). Không có tiền lệ trong tầng; nên có mục trong glossary.
  5. `22.4` `vane sirīvaruttame`: tôi đọc ba tính từ của `vane` (rừng): `sirī` huy hoàng, `vara` cao quý, `uttama` tối thượng. Cách đọc khác: `Sirīvara` là tên khu rừng (như `Sirīghara` ở `bv3:23.2`, `bv7:20.4`), rồi `uttame` “tối thượng”. Pāli root không có `nāma` ở khoá này.
  6. `19.3` `Yasavā sucimā sirīmā`: ba tên lâu đài (khớp “ba” ở `19.4`; cùng khuôn `bv9:18.3`, `bv13:19.3`). Cách đọc khác: ba tính từ (“lừng danh, trong sạch, huy hoàng”) bổ nghĩa cho lâu đài. Pāli không có `nāma`; không có tiền lệ cho cả ba tên.
  7. `29.3`–`29.4` `na tassa sāsane atthi sakilesamaraṇaṁ tadā`: tôi đọc `sakilesamaraṇa` là cái chết của người còn phiền não (không ai trong giáo pháp của Ngài chết khi còn phiền não); `kilesa` → “phiền não” (`mil5.3.9:3.2` `sakilesa` “còn mang phiền não”). Cách đọc khác: cái chết kèm theo phiền não, cái chết do phiền não. Tầng Việt không có tiền lệ cho `sakilesamaraṇa`. `29.1` `aṭṭhāsi` → “còn tại thế” (nghĩa gốc “đứng, tồn tại”).
  8. `2.1`–`2.4` chủ ngữ của `hantvā` (2.3) và `virocati` (2.4): tôi đọc là `pabhā` ở `2.1` (hào quang), nên Việt không thêm “Ngài”; tiền lệ `bv18:21.4` cũng không nêu chủ ngữ. Cách đọc khác: chủ ngữ là Đức Phật. `hantvā` → “lấn át” (động từ nghĩa đen “đánh, đập”; tầng dịch “tiêu diệt” cho `nihantvāna` ở 1.3, nhưng đối tượng ở 2.3 là ánh sáng của trăng và mặt trời nên chọn “lấn át”, nghĩa “vượt lên trên” khớp `jinehaññehi uttariṁ` ở 2.2).
  9. `31.1`–`31.2` `saṅkhārānaṁ sabhāvatthaṁ dassayitvā sadevake`: `sabhāvattha` = bản chất (tự tính) + ý nghĩa; tôi viết “bản chất thật của các hành” (không tiền lệ trực tiếp: khoá `mil7.8.5:3.1` bỏ mất chữ này). `sadevake` là vị trí cách của “thế giới cùng chư thiên” (`loke` bị lược); Việt thêm “thế giới” để câu đủ. Cách đọc khác của `sabhāvattha`: “mục đích/ý nghĩa của tự tính”.
  10. `30.3` `dhūmaketūva`: `dhūmaketu` (nghĩa đen “lấy khói làm cờ”) là lửa; tôi viết “ngọn lửa”. Cách đọc khác: sao chổi (`ketu` cũng là sao chổi). Khoá `tha-ap192:5.2` có chữ `dhūmaketuno` nhưng bản Việt ở đó không dịch từ này, nên không dùng làm tiền lệ. `31.3` dùng khối lửa lớn (4 tiền lệ), cách nhau một khoá.
  11. `24.4` `nāgarukkhoti`: tên loài cây (Mesua ferrea) hay chỉ “cây nāga”; tôi viết “cây nāga”, giữ `nāga` nguyên chữ. `ti` là dấu đóng tên. Tầng Việt không có tiền lệ.
  12. `5.1` `Surindadevabhavane`: “ở cõi trời của vua chư thiên”; chú giải nêu danh tính nhưng Pāli root không nêu nên Việt không nêu tên. `devabhavana` → “cõi trời” (`mil5.1.6:6.5`). `surinda` → “vua chư thiên” (tầng dịch `devānamindo` là “vua chư thiên”).
  13. `3.3`–`3.4` `te te … vinodenti`: `te te` lặp lại mang nghĩa phân bổ (“từng người trong số họ”); Pāli không nêu họ là ai nên Việt viết “Từng người ấy”. `vinodenti` là thì hiện tại; Việt không đánh dấu thì.
  14. `26.3`–`26.4` `anekasatasahassiyo`: “nhiều trăm ngàn (tia)”; Pāli là một từ ghép nhiều × trăm × ngàn, không quy ra con số. `tato` = “từ Ngài” (khớp `Pabhā niddhāvatī tassa` ở `bv9:25.3`, `bv10:24.3`).
  15. `15.1`–`15.4` `Tadā pītimanubrūhanto … buddhe datvāna maṁ gehaṁ pabbajiṁ`: `maṁ gehaṁ` đọc là `mama gehaṁ` “nhà của ta”; `buddhe` “cho Đức Phật” (vị trí/ trao đối cách). Pāli không nêu thêm số tài sản như các phẩm anh em (`bv13:11.3`).
  16. `7.1` `Sunandassānucarā janatā`: `janatā` “đám người”, đồng vị với `anucarā`; Việt viết “Những người tùy tùng của Sunanda” mà không nêu số, số ở `7.2`.
  17. `9.1`–`9.2` `Dutiyo … tatiyo`: tôi hiểu ngầm “cuộc (tụ hội)” thứ hai/ thứ ba theo `8.4`, `9.4` (`samāgama`); Pāli không nêu danh từ ở hai khoá này.
  18. `1.4` `dhammokkamabhidhārayi`: `abhidhāreti` “nâng giữ” (cũng có thể là “mang theo, thắp lên”); chủ ngữ `nāyako` ở `1.2`, nên Việt thêm “Ngài” để khỏi mất chủ ngữ giữa hai khổ kệ. `1.3` `loke` “ở thế gian”.
  19. `4.1` `bodhimatulaṁ`: `atula` đi với `bodhi` đọc là “giác ngộ không thể cân lường” (theo cách bv dịch `atula`); cách đọc khác: “giác ngộ vô song”.

