notes: |-
  **`ne` là bộ nào — tự tra, không đoán.** Pāli `:0.1` của cả `ne8` và `ne12` là
  chữ `Netti`, và toàn bộ 16 bài `ne` đã có trong tầng Việt đều giữ `:0.1` = *Netti*
  **15/15**. Vậy `ne` là bộ **Netti** (Paṭiniddesavāra, phần Paṭiniddesa) — **không**
  phải Nidāsa, cũng không phải Nānāpavāra.

  **Tên phẩm theo đa số trong chính bộ `ne`:** `Paṭiniddesavāra` → *Phần Giải Thích*
  **11/12** (chỉ `ne35` giữ Pāli); `Vibhaṅga N` → *Nhóm N* (`ne11:0.3` = `Vibhaṅga 8`
  → *Nhóm 8*; `ne28` = `Sampāta 9` → *Nhóm 9*). Riêng `Xhāravibhaṅga` tôi theo mẫu duy
  nhất có sẵn, `ne11:0.4` `Vibhattihāravibhaṅga` → *Nhóm Phân Loại Hướng Dẫn*, nên
  `Parivattanahāravibhaṅga` → *Nhóm Chuyển Đổi Hướng Dẫn*, `Lakkhaṇahāravibhaṅga` (ne8) →
  *Nhóm Đặc Trưng Hướng Dẫn*. Cần nói thẳng: `hāra` ở đây là *nāgarāga* nghĩa truyền
  tải, dịch *Hướng Dẫn* hơi thô; tôi chọn nhất quán với 16 bài `ne` đã có thay vì tự
  đặt cách thứ N+1, nhưng đây là chỗ biên tập có thể muốn mở lại cho cả bộ.

  **Thuật ngữ theo tiền lệ `ne` đã có (ne11, ne22–ne35):** `sammādiṭṭhi` → *chánh kiến*,
  `micchādiṭṭhi` → *kiến sai*; `sammāsaṅkappa` → *chánh tư duy*; `nijjiṇṇa` → *chấm dứt*;
  `bhāvanāpāripūri` → *viên mãn của việc tu tập*; `sammāvācā/kammanta/ājīva/vāyāma/sati/
  samādhi/vimutti` → *chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm,
  chánh định, chánh giải thoát* (ne35:3.4) và *sự biết thấy trong chánh giải thoát*
  (ne24:2.5); `ariyo aṭṭhaṅgiko maggo` → *Thánh đạo tám chi phần* (ne24:2.3) và
  *Bát Chi Thánh Đạo* (ne35:3.2) — **hai cách đang cùng tồn tại trong bộ `ne`**; tôi
  theo *Thánh đạo tám chi phần*.

  **`:2.1`–`:2.10`** là mười hành vi căn bản từ bỏ. Pāli đây trùng với AN 5.28, nhưng
  `an5.28` chưa có trong tầng Việt nên **0 tiền lệ trực tiếp**; tôi dịch từng hành vi một
  (*giết người, cướp của không cho, phạm hạnh phi phạm, nói dối, nói độc, lời lạnh lùng,
  nói phù phiếm, tham tài, oán hận, kiến sai*) và giữ nguyên khuôn `Với người …, … đã được
  từ bỏ`. `samphappalāpo` → *lời phù phiếm* là chỗ tôi đặt mới, cần người đọc Phật học
  xác nhận; `appamatta` (`:5.1`) → *không cần cố*.

  **Không có tầng Anh.** 0/44; tầng `english-sujato` đã ghim **không có thư mục `ne`**
  (chỉ có `ne-name`). `translation/vi/phantuananh/` chỉ có Pháp Cú.
