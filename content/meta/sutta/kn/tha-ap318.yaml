notes: |-
  Bản dịch tiếng Việt mới cho bài kinh tha-ap318 — trưởng lão Āsanasanthaviko, bài thứ sáu
  trong Ārakkhadāyakavagga. Tên bài nghĩa là vị trưởng lão đã lo bỏ chỗ ngồi.

  Tiền kiếp: bảo tháp tối thượng tên Cetiya của bậc đang tu hành được dựng trong rừng
  hoang; ông khi ấy còn mù lòa mù mắt, bước ra từ Pavanā thì thấy ngai của bậc sư tử,
  chắp tay cung kính; nửa ngày sau thấy Đức Phật thì phát ra lời kệ tán thán. Ông làm
  dấu hiệu, đảnh lễ chỗ ngồi rồi lui về phía bắc. Vào ba mươi mốt kiếp trước ông tán
  thán bậc được tuyên ngợ; vào hai mươi bảy kiếp trước ông làm vua có đủ bảy món báu.

  Bất định đã ghi lại, không sửa trong kinh:
  - `sikhino lokabandhuno` (1.2) dịch là bậc đang tu hành, bậc Thân Hữu của thế gian, khác
    mười cặp tiền lệ ở tha-ap353, tha-ap520, tha-ap71 dịch “Đức Sikhī”. Lý do: `sikhin` là
    danh từ chung có nghĩa người đang tu, biến nó thành tên riêng là bịa thêm một Đức Phật
    tên Sikhī. Giữ nguyên văn Pāli quan trọng hơn số lượng tiền lệ.
  - `Pavanā` giữ nguyên là tên địa danh; `Cetiya` giữ nguyên là tên tháp, đều lấy thẳng từ
    Pāli của chính bài.
  - `andhāhiṇḍāmahaṁ` (1.4) dịch là mù lòa mù mắt; từ này không có tiền lệ trong tầng,
    giữ nghĩa gốc thay vì chọn một Hán–Việt không có cứu chứng.
  - `thaviṁ vadataṁ varaṁ` (6.2) là ba vị từ cùng nghĩa: được tụng, được tuyên, cao quý;
    dịch gộp thành bậc được tuyên ngợ, bậc cao quý.
  - `Sattaratanasampannā, cakkavattī mahabbalā` (7.3–7.4) số nhiều, nên dịch là những vị
    Chuyển Luân Vương; ở tha-ap32 và tha-ap320 dạng số ít mới dịch là là Chuyển Luân Vương.
  - `Sattavīse ito kappe` là hai mươi bảy kiếp, khớp ba cặp tiền lệ tha-ap229, 293, 327.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của chính tầng Việt qua `_hvi.save_vi`: đủ 36/36 khoá, cân ngoặc kép trên cả bài, đúng số dấu lược theo Pāli, NFC, không trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung bình số học thô của đúng 10 tiêu chí, tính bằng script.
