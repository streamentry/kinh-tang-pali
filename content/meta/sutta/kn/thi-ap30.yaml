notes: |-
  Bài thi-ap30 — Therīapadāna, Phẩm Kuṇḍalakesī, ký sự thứ mười: mười tám ngàn tỳ-kheo-ni dòng Sakya
  do Yasodharā dẫn đầu đến gặp Đức Chánh Đẳng Giác, thị hiện thần thông, kể lại những gì đã làm vì Ngài
  từ thời Đức Phật Dīpaṅkara, và nghe lời xác nhận cuối cùng. 255/255 khoá (66 nhóm khoá), thứ tự khoá khớp
  đúng thứ tự Pāli, không có khoá nào ngoài tập Pāli. Bài kết phẩm Kuṇḍalakesī nên có thêm khoá kết phẩm
  (:63.1) và kệ tóm tắt phẩm (:64.1 đến :66.4).

  TÊN PHẨM, TIÊU ĐỀ — đo trước khi chốt, ghi cả hai số:
  - `:0.1` Therīapadāna giữ nguyên Pāli: 33 trong 34 khoá Pāli trùng ở tầng (tệp còn lại là thi-ap6, viết
    Trưởng Lão Ni Ký Sự).
  - `:0.2` Kuṇḍalakesīvagga → Phẩm Kuṇḍalakesī: 7/7 khoá Pāli trùng ở tầng dùng đúng dạng này.
  - `:0.3` bắt đầu bằng số (`10 Yasodharāpamukha…`) nên theo chính sách số thứ tự (giữ số khi và chỉ khi
    Pāli `:0.3` bắt đầu bằng số) bản Việt giữ `10. ` và `translationTitle` bằng đúng giá trị `:0.3`.
    Đo ở phạm vi thi-ap (17 tệp có Pāli `:0.3` bắt đầu bằng số): giữ số 11 tệp (thi-ap11, 21, 25, 29, 32,
    34, 36, 37, 38, 39, 40), bỏ số 6 tệp (thi-ap2, 4, 7, 12, 16, 31); thi-ap29 cùng phẩm giữ số. Số thứ
    tự vẫn còn ở khoá cuối (`:62.1`, thứ mười).
  - Từ chỉ thể loại `apadāna` ở `:0.3` và `:62.1`: đo ở các khoá tiêu đề thi-ap, `Tuyên Ngợ` 32 / `Tuyên
    Ngôn` 1 (chính là thi-ap29); ở tha-ap, `Tuyên Ngợ` 509 / `Tuyên Ngôn` 276 / `Ký Sự` 154 / `Kinh Kệ` 10.
    Đa số theo số đếm là `Tuyên Ngợ`, nhưng đó là dạng sai chính tả của `Tuyên Ngôn`; bài này viết đúng
    chính tả `Tuyên Ngôn` như thi-ap29, nên khác 32 tệp thi-ap đã có. Người biên tập cần phán một lượt cho
    cả cuốn rồi sửa hàng loạt.
  - `bhikkhunī` ở `:0.3` và `:62.1` dịch Tỳ-kheo-ni (đúng Pāli, như thi-ap29 và thi-ap32); đo ở tiêu đề
    thi-ap: Trưởng Lão Ni 31 / Tỳ-kheo-ni 2 (thi-ap29, thi-ap32).

  SỐ PĀLI — tự tính, in phép:
  - `aṭṭhārasasahassāni` = aṭṭhārasa 18 × sahassa 1.000 = 18.000 → mười tám ngàn (1.1, 2.1, 9.1, 61.1,
    62.1, 66.2). Đơn vị: ở các khoá Pāli chứa `sahass-`, `ngàn` 732 / `nghìn` 107 trên toàn tầng kn.
  - `dasasahassa` = 10 × 1.000 = 10.000 → mười ngàn (66.1). `satasahassa` = sata 100 × sahassa 1.000 =
    100.000 → một trăm ngàn (7.1, 36.1). `caturo asaṅkhiye` = bốn (36.2).
  - `navutīnaṁ chaduttari` (7.2) = navuti 90 + cha 6 = 96 (xem bất định số 1 về đơn vị).
  - `nekakoṭisahassāni` = nhiều ngàn koṭi, giữ nguyên `koṭi` (159 khoá / 47 tệp ở tầng dùng `koṭi`).
  - `aḍḍhamāse` = nửa tháng (aḍḍha nửa + māsa tháng, 52.3). `catusacca` = bốn; `tisso vijjā` = ba
    minh; `paṭisambhidā catasso` = bốn; `aṭṭhime vimokkhā` = tám; `chaḷabhiññā` = sáu; `ubho pakkhā duve
    dīpā` = hai cánh, hai châu lục.
  - `gāthāsatāni cattāri` = 4 × 100 = 400; `cha ca sattati` = 6 + 70 = 76; tổng 476 theo phép tính, chưa
    đối chiếu với số kệ thật của phẩm. Bài không chứa `Tiṁsakappasahassa` hay cụm số chưa phân xử khác.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò toàn tầng, dùng lại nguyên văn bản dịch:
  - Trong 255 khoá, 59 khoá có Pāli trùng byte với một khoá đã dịch ở bài khác (chủ yếu thi-ap29, 31, 32 và
    công thức chung của phẩm). 56/59 dùng lại nguyên văn (bỏ dấu câu và chữ hoa đầu dòng khi so); 3 khoá
    khác có chủ ý:
    20.1 `Pubbānaṁ lokanāthānaṁ` — thi-ap32:18.1 viết Lãnh Đạo thế gian; bài này viết Bảo Hộ Thế Gian
    (xem thuật ngữ `lokanātha`), nên khác 1/1 tiền lệ.
    51.3 `Dhammacārī sukhaṁ seti` — ja384:1.3 viết sống trong an lạc; bài này dùng đúng cách bản Việt đã
    có của Pháp Cú 169 (ngủ an lạc), vì 51.1–51.4 chính là Dhp 169.
    55.2 `mama buddhassa santike` — tiền lệ 15 khoá viết Đức Phật của ta; bài này viết của tôi vì cả bài
    dùng chúng tôi / tôi cho người nói, không dùng ta.
  - Trong chính bài có 9 nhóm Pāli trùng nguyên văn (29 khoá): 1.1·2.1·9.1; 16.2·59.4; 20.4·23.4·24.4·25.4·
    27.4·32.4·35.2; 21.3·22.3·29.3·31.3; 23.1·24.1·25.1·26.1; 23.3·24.3·25.3; 26.2·26.4; 40.4·41.4;
    55.4·56.4. 5 nhóm lặp y nguyên; 3 nhóm chỉ khác dấu câu cuối khoá theo Pāli (16.2 `;` so với 59.4
    `”.`; 20.4 và các khoá cùng nhóm `.` so với 35.2 `;`; 26.2 `;` so với 26.4 `.`); 1 nhóm khác thật
    (40.4 `cho vị ẩn sĩ…` vì đứng sau `viyākāsi`, 41.4 là đồng vị ngữ sau `pakittente`).
  - Lỗi bản nháp đã bắt: 11.3 ban đầu viết Có nhiều loại (thêm chữ Có không có trong `nekā`), đã bỏ;
    12.3 ban đầu viết hai hòn đảo, đổi thành hai châu lục theo thi-ap32:2.3 (`cātuddīpā` → châu lục) và vì
    câu kế là Jambudīpa; 34.1 ban đầu gắn Brahmadeva vào một cụm với Chánh Đẳng Giác, tách lại để giữ chữ
    `ca` của Pāli; 42.3 ban đầu viết Dùng nhiều vật phẩm, đổi sang Với.

  THUẬT NGỮ — kèm số đếm:
  - `lokanāyaka` → bậc Dẫn Đạo Thế Gian (toàn tầng: Dẫn Đạo 159 / Lãnh Đạo 17 / Dẫn Dắt 8 / Dẫn Lộ 7;
    ở thi-ap 11 / 0 / 0 / 1), như thi-ap29. `lokanātha` → bậc Bảo Hộ Thế Gian (Bảo Hộ 25 / Lãnh Đạo 19;
    tha-ap 22 / 12; thi-ap32:18.1 dùng Lãnh Đạo, đó là 1 tiền lệ khác); chọn Bảo Hộ để `nātha` không trùng
    với `nāyaka`. Hai chữ này nằm sát nhau ở 34.2 và 34.3, nên phải khác nhau.
  - `mahāvīra` → bậc Đại Anh Hùng, `mahāmuni` → bậc Đại Mâu-ni, `vināyaka` → bậc Điều Ngự, theo thi-ap29,
    31, 32. `mahesi` → Đại Ẩn Sĩ (Đại Ẩn Sĩ 170 / Đại Hiền 7 / Đại Tiên 2 ở toàn tầng). `naranāyaka` → bậc
    Dẫn Đạo loài người (3/3). `cakkhumā` (hô cách) → bậc Có Mắt (Có Mắt 115 / Hữu Nhãn 16 ở khoá Pāli
    cakkhum-). `sabbadassī` → bậc Thấy Tất Cả (1 tiền lệ, santike sabbadassino).
  - `adhikāra` → việc phụng sự (125 khoá / 68 tệp dùng phụng sự; thi-ap32:18.3 cùng công thức).
    `padaṁ santaṁ` → cảnh giới tịch tịnh (3 tiền lệ), `amataṁ padaṁ` → cảnh giới bất tử (21/26 khoá có Pāli này), `asaṅkhatā` →
    vô vi (21 khoá). `parikkhīṇā` → cạn kiệt (Pāli đúng khoá này: cạn kiệt 15 / đoạn tận 10). `Nibbāna` →
    Niết-bàn (701 / 1).
  - `Khattiya` (người thuộc đẳng cấp) → Sát-đế-lợi (159 / 0 cho Sát-đế-lỵ). `antepura` → nội cung (12 so
    với hậu cung 11, cả hai có tiền lệ; nội cung có `kāsāviyā yantu antepurantaṁ`).
  - `catusacca` → bốn chân lý (đếm chuỗi Việt toàn tầng kn: bốn chân lý 20 / bốn sự thật 18 / Bốn Thánh Đế
    14; công thức `catusaccaṁ pakāsento` 5 so với 2 sự thật).
  - `cajati`/`catta` đi với `jīvita` (22.4, 26.2, 26.4) → từ bỏ mạng sống (11 khoá Pāli cùng cấu tạo ở tầng:
    bỏ mạng sống 6, trong đó 3 khoá là từ bỏ mạng sống / hy sinh 1 / xả bỏ 1). `pariccatta` → được từ bỏ
    (31 khoá `pariccaj-`/`pariccatt-`: từ bỏ 15 / xả bỏ 3 / hy sinh 2; và thi-ap29:5.4).
  - `viyākāsi/viyākari` → thọ ký ở 40.3, 43.1, 44.2 (lời tiên báo về nghiệp tương lai). Tiền lệ chia:
    tuyên bố 5 / giảng giải 7 (chủ yếu khi trả lời câu hỏi) / thọ ký 1 (`sopi buddho viyākari`) trong các
    khoá có chủ ngữ là Đức Phật, bậc Chiến Thắng hay trưởng lão; không có đa số rõ, chọn theo nghĩa ngữ cảnh. `sammukhā` (43.4) → gặp mặt trực tiếp, đúng thi-ap32:32.4.
  - `tulitā` (32.3) → thăng bằng (0 tiền lệ cho `tulita`; đếm chuỗi Việt toàn tầng: thăng bằng 1 / quân bình 2, không có đa số rõ, chọn từ thuần Việt).
  - `sakattānaṁ` → chính mình; `sahāyasampadā` → được thành tựu về bạn hữu (0 tiền lệ).
  - Tên riêng giữ Pāli: Yasodharā, Dīpaṅkara, Sumedha, Jotidīpa, Brahmadeva (2 tiền lệ), Jambudīpa (3),
    Cakkavāḷa, Meru (4), Sakka, Kuru; `koṭi`.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  1. 7.1–7.2 `Thīnaṁ satasahassānaṁ, navutīnaṁ chaduttari`: Pāli đặt một trăm ngàn cạnh chín mươi sáu mà
     không nói đơn vị của số sau. Bản Việt giữ đúng chữ (một trăm ngàn phụ nữ, và chín mươi sáu nữa), không
     thêm đơn vị `ngàn`. Đọc sát chữ là 100.096; cách đọc khác là 196.000 (bản nguyên bài của Bhikkhu
     Indacanda ở mục Tra cứu toàn văn của trang). Chưa phân xử. thi-ap28:18.1–18.2 (Yasodharātherīapadāna)
     có cùng hai khoá Pāli này nhưng chưa có bản Việt của dự án, nên người dịch bài đó cần theo quyết định
     ở đây.
  2. 6.1, 9.3, 16.1 `Yasodharā(…)`: dịch là tên chung của cả nhóm (các Yasodharā); có thể hiểu `yasodharā`
     là danh từ chung (người mang danh tiếng). Không phân xử được bằng Pāli đã ghim.
  3. 8.3–8.4 `devatā viya mānusā`: đọc `viya` là so sánh (như loài người kính chư thiên); cách đọc khác là
     chư thiên và loài người cùng kính (bản Indacanda), ý chung gần nhau nhưng quan hệ khác.
  4. 12–15 hình ảnh thân hình vũ trụ: `kuru` ở 12.2 có thể là tên xứ Kuru (đầu là xứ Kuru) hoặc một dạng
     động từ; `dakkhiṇa` ở 13.1 là phương nam hoặc bên phải; `bījamānā` ở 14.3 không nói quạt bằng vật gì
     (có thể là cây jambu ở 14.2). Không gán thêm.
  5. 34.1–34.2 `Brahmadevañca sambuddhaṁ, gotamaṁ lokanāyakaṁ`: có thể là hai người (Brahmadeva và bậc
     Chánh Đẳng Giác Gotama) hoặc `Brahmadeva` là danh hiệu của chính Gotama. Bản Việt để mở, giữ tên
     Brahmadeva.
  6. 33.1–33.4 `Anumaggena sambuddho` — chủ ngữ của `abhinīhari`, `patto bodhiṁ` là Đức Phật đang được
     xưng hô (Gotama) hay một Đức Phật quá khứ; bản Việt để mở, dùng ngôi ba cho `sambuddho`.
  7. 43.3 `ye patthitā atthi`: `patthitā` có thể là chủ động (những ai đã ước nguyện) hoặc bị động (những
     người được ước nguyện); chọn chủ động vì ngữ cảnh là lời thọ ký cho những người cúng dường và ước
     nguyện. `sammukhā` để trần: gặp mặt trực tiếp, không nói với ai.
  8. 44.1 `Aparimeyye ito kappe`: đọc hồi tưởng (vào vô lượng kiếp trước, 8 tiền lệ), vì 44.2 `viyākari` là
     quá khứ. Nếu `ito` tính từ thời Dīpaṅkara thì là tương lai (sau vô lượng kiếp kể từ nay, 3 tiền lệ,
     đều nằm trong lời tiên báo tương lai: tha-ap4, tha-ap44, tha-ap481); bài này không có động từ tương lai ở khoá đó.
  9. 49.2–51.4 ranh giới trích dẫn: nháy đơn mở ở 49.2 và đóng ở 51.4 theo đúng Pāli. 49.3 có hô cách
     `vīra` (ngôi hai) nằm trong đoạn trích; `pure` ở 49.3 đọc là locative (trong thành) song song với
     `antepure`, cách đọc khác là trước kia. 50.2 `sukhe dukhe` thiếu động từ trong Pāli, dịch cùng chia sẻ
     vui và khổ theo công thức đã dùng ở thi-ap29:2.4.
  10. 58.3–58.4: `honti` đi với `nibbānapadamasaṅkhataṁ` không có động từ riêng; bản Việt đặt hai vế song
      song (được thành tựu về bạn hữu, và cảnh giới Niết-bàn vô vi), không gán động từ đạt.
  11. 60.1–60.4: `Nibbānāya vadantīnaṁ` hơi khó khớp ngữ pháp (với các vị đang nói về Niết-bàn); `vakkhāma`
      là số nhiều nhưng dùng cho Đức Thế Tôn, dịch Ta; `santasaṅkhatadosaṁ` đọc là khiếm khuyết của các
      pháp hữu vi đã lắng dịu; `dosa` có thể là lỗi hoặc sân.
  12. 5.4 `yāvatā`: dịch mọi nghi hoặc đang có; cách đọc khác gắn `yāvatā` với `parisānaṁ` (tất cả các hội
      chúng, bao nhiêu có).
  13. 18.1 `jānāmi` là số ít giữa lời nói số nhiều: bản Việt viết Tôi, không ép thành chúng tôi.
  14. 23.1–26.1 `nekakoṭisahassāni` đứng một mình, không nói đơn vị (lần, kiếp hay mạng sống): ở 23–25 đọc
      là số lần, ở 26 đọc đi với `jīvitāni`; bản Việt giữ đúng chữ `Nhiều ngàn koṭi` và không thêm đơn vị.
  15. Các chỗ nhỏ: 4.3 `aparādhamajānantī` (không biết đến lỗi lầm); 22.1 `abhabbaṭṭhāne` (những trường
      hợp không thích đáng); 47.3 `sabbaṅgasampadā` (đầy đủ mọi chi phần, có thể là mọi phần thân thể);
      36.1 `Kappe ca satasahasse` dịch Cách đây theo thi-ap29:1.1.

  THAM KHẢO ĐÃ ĐỌC (không phải tầng của store):
