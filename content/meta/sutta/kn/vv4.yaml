notes: |-
  Dịch từ Pāli root — không có tầng Anh đã ghim cho `kn/vv`, xem `blocking_errors`.
  **Bài này gần như là bản Việt lại của `vv1`**: cùng khung hỏi–đáp của Tôn giả Moggallāna, cùng công thức, chỉ khác câu 1.1 và 5.1–6.4.
  **Dùng lại nguyên văn 31/37 khoá có Pāli trùng ở bài khác**, phần lớn từ `vv1` và `vv12`: `Manojavaṁ gacchati yenakāmaṁ;` · `Alaṅkate malyadhare suvatthe,` · `Obhāsasi vijjurivabbhakūṭaṁ.` · `Kena tetādiso vaṇṇo,` (13 bài) · `kena te idha mijjhati;` · `Uppajjanti ca te bhogā,` · `ye keci manaso piyā.` (3 bài) · `Pucchāmi taṁ devi mahānubhāve,` · `Manussabhūtā kimakāsi puññaṁ;` (3 bài) · `Kenāsi evaṁ jalitānubhāvā,` (3 bài) · `Vaṇṇo ca te sabbadisā pabhāsatī”ti.` (22 bài) · `Sā devatā attamanā,` (7 bài) · `moggallānena pucchitā;` · `Pañhaṁ puṭṭhā viyākāsi,` · `yassa kammassidaṁ phalaṁ.` (24 bài) · `Addasaṁ virajaṁ bhikkhuṁ,` (3 bài) · `vippasannamanāvilaṁ;` (4 bài) · `Tena metādiso vaṇṇo,` (26 bài) · `tena me idha mijjhati;` · `Uppajjanti ca me bhogā,` · `Akkhāmi te bhikkhu mahānubhāva,` · `Manussabhūtā yamakāsi puññaṁ;` · `Tenamhi evaṁ jalitānubhāvā,` · `Vaṇṇo ca me sabbadisā pabhāsatī”ti.` (23 bài) · `pasannā sehi pāṇibhi.` (5 bài) · `Purimāya jātiyā manussaloke.` · `Phẩm Pīṭha` · `Vimānavatthu` · `Chuyện Cung Điện Nữ Hư Không`.
  **Chỗ phải tự dịch (0 tiền lệ):** `Pīṭhaṁ te veḷuriyamayaṁ uḷāraṁ,` → *Nền của ngươi làm bằng ngọc lưu ly cao quý* (đối chiếu `vv1:1.1` *nền làm bằng vàng*; khác `sovaṇṇa` = vàng và `veḷuriya` = ngọc lưu ly) · `“Appassa kammassa phalaṁ mamedaṁ, Yenamhi evaṁ jalitānubhāvā;` → *Tôi từng thấy / rằng quả báo của nghiệp này là như vậy* · `Tassa adāsahaṁ pīṭhaṁ,` → *Tôi đã lễ bái vị ấy*. Ba chỗ này bám đúng cách chia đại từ của Pāli (`te` bị nói với ở 1.1 và 8.1–8.2, `me` là của người nói ở 8.3–8.4), không trộn hai ngôi trong cùng lời thoại — cùng nguyên tắc đã dùng cho `vv12`.
  `Itthivimāna` → *Chuyện Cung Điện Nữ Hư Không* (8 bài; bỏ `Thiên Cung Của Nữ Giới` 1× của vv49). `Pīṭhavagga` → *Phẩm Pīṭha* (2 bài: vv1, vv12). 0.1 giữ Pāli *Vimānavatthu* (29 bài).
  Nháy kép: `1.1` mở và `3.4` đóng (câu hỏi Moggallāna), `5.1` mở và `8.4` đóng (lời đáp của nữ thiên) — cân trên cả bài.
