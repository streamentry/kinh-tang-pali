notes: |-
  LÁT NÀY KHÔNG CÓ TẦNG THAM KHẢO NÀO, ĐÃ ĐẾM KHÔNG SUY. Với mười ba bài Jātaka này:
  source/upstream-manifest.json tại commit đã ghim 11c9d708978cde8ba61096d8a75f7ddfb846f639 ghi tầng translation/en/sujato có 4.291
  tệp, trong đó thư mục sutta/kn/ja/ chỉ có 83 tệp, không có tệp nào chứa khoá của bài này; hàm
  upstreamPublishes của kho trả false cho cả mười ba, tức SuttaCentral không phát hành bản Anh nào
  phủ chúng. Tầng translation/vi/phantuananh tại cùng commit chỉ có đúng 26 tệp và toàn bộ là Pháp Cú
  (dhp1-20 … dhp383-423), nên KHÔNG có bản Hòa thượng Thích Minh Châu cho bất kỳ bài Jātaka nào ở đây —
  đây là đặc điểm của bản chụp upstream đã ghi ở chính source/layers.yaml, không phải thiếu sót của
  kho, và cũng không phải lý do để tôi né việc chấm điểm. Bài chỉ đối chiếu được với Pāli root một
  mình, nên triangulation chấm thấp và bài đặt draft.

  COVERAGE KHÔNG PHẢI LÝ DO BLOCK, VÀ TÔI ĐÃ TÍNH LẠI CHO ĐÚNG. Trong mười ba bài này mọi vế kệ
  Jātaka đều ngắn hơn ngưỡng 40 ký tự khai ở source/layers.yaml, và mọi khoá tiêu đề nằm trong khối
  tham chiếu, nên substantiveSegments = 0. Hàm englishCoverageFor trả ratio = 1 khi
  substantiveSegments = 0, và cả validate lẫn tests/unit/translation-store.test.ts đều bỏ qua bài có
  substantiveSegments = 0. Tôi đã chạy hàm đó cho cả mười ba: đều ratio 1.000. Vì vậy tôi KHÔNG ghi
  blocker coverage dưới ngưỡng — ghi thì sẽ là một lỗi đo sai. Blocker thật, duy nhất, là mất hẳn
  tầng tham khảo English.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt mặc định chỉ quét khoá Pāli từ 40
  ký tự trở lên; ở Jātaka mọi vế kệ đều ngắn hơn ngưỡng đó nên phần chốt đó về bản chất KHÔNG chạy.
  Tôi tự quét lại toàn bộ 238 khoá của lát bằng script riêng, đọc thẳng từ tệp đã ghi trên đĩa:
  đủ khoá và không thừa so với Pāli gốc, không rỗng, chuỗi NFC, số dấu lược khớp TỪNG KHOÁ (Pāli có
  …pe… thì Việt đúng một …, Pāli không có thì Việt không có), không có (…) đứng một mình, vị trí
  ngoặc kép mở và đóng khớp PĀLI TỪNG KHOÁ (không chỉ tổng số trên cả bài), ngoặc kép cân trên
  cả bài, không chữ phiên tự, không còn sót thẻ chữ Pāli. Kết quả 0 lỗi trên 238 khoá / 14 bài.

  TÊN PHẨM, ĐÃ ĐO THEO BẢNG CHỐT VÀ THEO TẦNG. Tikanipāta → Bộ Ba Bài Kinh: đếm trên toàn tầng
  Việt TRƯỚC khi lát này ghi, đã có 24 tệp Jātaka và 15 tệp thag3/thig3 dùng đúng cách này, và KHÔNG
  tệp Jātaka nào dùng cách khác; cách Phẩm Ba Pháp chỉ do 50 tệp iti50..iti99 dùng mà tôi không đụng
  tới. Sau khi lát này ghi, con số Jātaka là 37/37. Tôi theo đa số TRONG CHÍNH TÁC PHẨM ĐANG LÀM theo
  BRIEF_VI3 §11, và cũng vì nó khớp song song với hai mục đã chốt là Bộ Một Bài Kinh và Bộ Hai Bài
  Kinh. Người điều phối gộp có thể muốn thống nhất cả tầng iti sau này, nhưng đó không thuộc lát này.
  Saṅkappavagga → Phẩm Suy Nghĩ (trước lát này 7 tệp, không lệch; sau đó 8); Padumavagga → Phẩm Bông
  Sen (trước 1 tệp, không lệch; sau đó 9, và cả chín tệp trong phẩm đều giống nhau); Udapānavagga →
  Phẩm Nước Uống (trước 4 tệp, không lệch; sau đó 8). Dấu uddāna: trước lát này đã đếm 22 tệp có
  dạng Kinh <tên>, thứ <từ>. và 3 tệp không có dấu phẩy; tôi dùng dạng có dấu phẩy, và đã kiểm
  bằng script rằng số thứ tự trong uddāna khớp số đứng trước mặt trong 0.4 của cùng phẩm, không suy
  từ tên uid.

  PĀLI TRÙNG NGUYÊN VĂN, ĐÃ DỰNG CHỈ MỤC BẰNG SCRIPT VÀ ĐÃ DÙNG LẠI. Tôi nạp 5.764 tệp Pāli
  gốc trong cache (bỏ mọi thư mục *.apfs-orphan) và 4.038 tệp Việt dự án, ghép theo khoá, rồi so
  TRÙNG NGUYÊN VĂN có chuẩn hoá hoa thường, khoảng trắng và dấu câu biên. Riêng lát này: 102 khoá
  trùng ở nơi khác; 52 khoá trùng đó đã có bản Việt ở bài khác, và tôi DÙNG LẠI NGUYÊN VĂN 51 khoá
  (39 khoá tiêu đề, 12 khoá thân kệ). Một khoá trong 52 là ngoại lệ có chủ ý: ja264:3.1 trùng nguyên
  văn với sn1.50:11.1, nhưng bản Việt đã có mở ngoặc kép ở đầu khoá trong khi Pāli khoá này không mở,
  nên tôi chép phần chữ và bỏ ngoặc kép thay vì chép y nguyên. Ngoài ra có 8 cả ván bốn vế trùng nguyên
  văn ở bài khác, và cả tám đều chưa có bản Việt để mượn. Trong lát này có 3 khoá trùng
  nguyên văn, đều là ba vế mở đầu lặp lại trong ja265; tôi đã dùng lại đúng một cách dịch cho cả
  hai lần, và script tự kiểm bắt được chỗ lệch nếu có.

  TÊN RIÊNG CÓ DẤU PĀLI, CỐ Ý GIỮ, KHÔNG BỎ DẤU. Jātaka, Tikanipāta, Sakka, Panāda, Missībhāvitthi,
  kāḷi, Jātavedas, Gāṅgā, Yamunā, Kassapa — tất cả giữ đúng dấu Pāli như tầng đang làm; tôi không
  bỏ dấu ở bất kỳ tên nào, kể cả tên không có bản Việt nào để đối chiếu.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  STATUS. Có một blocking error thật (thiếu hẳn tầng tham khảo English Sujato tại commit đã ghim), nên
  bài đặt draft bất kể final_score. Tôi không nâng điểm để né blocker, và cũng không hạ điểm để tỏ ra
  thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có
  tầng tham khảo nào.

  TÊN BÀI ĐÃ CÓ TIỀN LỆ CHÍNH XÁC. Kacchapajātaka xuất hiện ở ja178, đã có bản Việt trong tầng với
  tên Kinh Rùa; dù đây là hai câu chuyện khác nhau trong hai phẩm khác, cùng một tên Pāli thì phải
  cùng một tên Việt, nên tôi dùng lại nguyên văn đó cho cả 0.4 và uddāna. Kacchapa → con rùa có
  tiền lệ ở mn và ở ja206, ja215 trong tầng.

  CHỖ CHƯA CHẮC. (1) kapismi ở 2.1: dạng này không có trong từ điển tra được và toàn tầng Pāli cũng
  chỉ có một khoá; tôi đọc là kāpi (con khỉ) và dịch là là một con khỉ, ghi rõ là suy đoán. (2) 2.4
  mutto gaccheyya pabbataṁ: pabbata là núi, cũng là chỗ cao của cõi thiêng; tôi dịch là cho ta được
  thả ra để đi đến núi, theo nghĩa chữ. (3) 1.4 kaṁ saddhaṁ upasaṅkami: tôi dịch là và đã hướng về
  nơi nào với lòng tin kính; saddhaṁ ở đây có thể là niềm tin, cũng có thể là người đáng tin. (4)
  pūrahattho ở 1.2 chỉ có hai khoá Pāli và chưa có bản Việt; tôi dịch là đầy tay đồ đạc, theo nghĩa
  đầy tay, không thêm nghĩa bố thí dù nhiều chú giải hiểu là bà-la-môn nhiều của.

  Lượt cải thiện 2026-10-13: đọc đối kháng từng khoá Pāli↔Việt thì bản trước có lỗi nghĩa thật mà điểm cũ che mất; đã sửa 12/17 khoá (1.1–1.4, 2.1–2.4, 3.1–3.4), giữ nguyên tập khoá và tiêu đề 0.x/4.1.
  (a) 2.2 anāmāsāni āmasiṁ: bản cũ "sống không nhà cửa" là SAI HẲN, không có căn cứ trong Pāli. Anāmāsa là "không nên chạm", āmasati là "chạm"; toàn tầng Việt dịch āmasati/parāmasati là "chạm vào" (mnd4:24, ja523:28, tha-ap16:16 đều "chạm"). Nay: "đã chạm vào những thứ không nên chạm".
  (b) 3.3 muñca kassapa koṇḍaññaṁ: bản cũ "Hãy thả Kassapa con khỉ ra" đảo vai. Kassapa là hô cách, gọi con rùa (3.1 kacchapā kassapā); Koṇḍañña là đối cách, chỉ con khỉ (3.2 koṇḍaññā makkaṭā). Nay: "Này Kassapa, hãy thả Koṇḍañña ra". 3.1–3.2 bản cũ "Rùa thì vẫn là rùa, khỉ thì vẫn là khỉ" là bịa nghĩa; Pāli nói rùa là Kassapa, khỉ là Koṇḍañña (honti, số nhiều); nay dịch đúng như vậy.
  (c) 3.4 kataṁ methunakaṁ tayā: bản cũ "làm điều phi lý" không có căn cứ. Đo trên Pāli: methunaka ở mnd7:3.6 và mnd14:145.4 nghĩa là "một đôi/cặp" ("ubho … methunakāti vuccanti" — cả hai được gọi là một cặp). Nay: "ngươi đã kết thành một đôi rồi" (không thêm "với nó", vì Pāli không nêu).
  (d) 1.3 acari và upasaṅkami là aorist ngôi thứ ba, nên vế 1 hỏi về người thứ ba ("vị ấy"), không phải hô "Ngài" như bản cũ. 1.4 kaṁ saddhaṁ: saddha là tính từ nam tính "người có lòng tin" (cùng dạng ở an3.48:4.2 saddhaṁ kulapatiṁ, an5.40:1.9 saddhaṁ kulaputtaṁ); nay "đã đến với người có lòng tin nào", thay cho "hướng về nơi nào với lòng tin kính".
  (e) 1.2 pūrahattha: đối chiếu cp4:6.4 pūrahatthova gacchati, bản Việt dùng "hai tay đầy ắp" cho người khất cầu đã được đủ thứ mình muốn; nay "tay đầy ắp", bỏ "đồ đạc" vốn thêm nghĩa. 1.1 bản cũ "kẻ đã đến thế" bỏ mất uddhitabhatta; nay "như người vừa được múc cơm cho" (uddhita-bhatta là hapax trên toàn Pāli root, đã quét; đọc theo uddharati "lấy ra, múc ra" và theo mạch khất thực của 1.3 — vẫn là cách đọc có suy luận, xem bất định bên dưới).
  (f) 2.3 bhaddaṁ te: bản cũ "bạn tốt" sai; toàn tầng dịch bhaddaṁ vo/te là "chúc … an lành/bình an" (pv19:17, pv21:17, ja516:20); nay "chúc ngài an lành". mocaya nay "thả ta ra" theo tiền lệ ja546:314 "thả … khỏi xiềng xích". 2.4 mutto gaccheyya pabbataṁ: giữ nghĩa "có thể đi về núi", cùng cụm ở ja481:10.6 ("có thể đi về núi").
  (g) kapismi: ghi chú cũ cho là dạng không có trong từ điển; nay phân xử được bằng ngữ pháp là kapi + asmi (sandhi), "ta là con khỉ". Không còn là bất định.
  (h) Đính chính ghi chú cũ về tên phẩm: Udapānavagga trong tầng Việt đang là "Phẩm Giếng Nước" ở cả 10/10 bài ja271–ja280 (udapāna là giếng), không phải "Phẩm Nước Uống" như ghi chú trên; tệp đúng, ghi chú cũ sai. Không đổi 0.3.
  Điểm đổi: semantic_fidelity 8.8 → 8.6 (hạ: đọc đối kháng thấy bản cũ sai nghĩa ở 2.2/3.1–3.4 nên 8.8 trước đó chưa đúng; bản nay đã sửa nhưng vẫn còn bất định ở uddhitabhatta, methunaka và người nói); grammar_logic 8.8 → 9.0 (sửa ngôi aorist của vế 1, hô cách/đối cách ở 3.3); terminology 8.8 → 9.0 (đưa āmasati, bhaddaṁ te, mocaya, pūrahattha về tiền lệ đo được). Các tiêu chí còn lại giữ: triangulation 6.8 (không có bản Anh độc lập nào), ambiguity_integrity 8.5 (bất định còn, không nâng), technical_integrity 9.6. final_score 8.89 → 8.91 (trung bình số học thô; 89.1/10).
  Bất định còn lại: (1) uddhitabhatta là hapax, "múc cơm cho" là cách đọc suy luận. (2) methunaka ở 3.4: "một đôi/cặp" có căn cứ ở mnd nhưng nghĩa chính xác của việc "kết đôi" giữa rùa và khỉ (theo gotra Kassapa/Koṇḍañña hay nghĩa khác) không phân xử được từ phần kệ, vì không có bản Anh hay văn xuôi nguồn. (3) Người nói từng vế và người nghe của 2.3 ("Ngài") chỉ có kệ, không có văn xuôi nên không xác định được; để nguyên đại từ trung tính. (4) 2.4 gaccheyya có thể là ngôi thứ nhất (đọc theo "mutto" = ta) hoặc ngôi thứ ba như ja481:10.6; cả hai cho cùng nghĩa trong ngữ cảnh. Blocker còn lại: chỉ thiếu tầng tham khảo English (giới hạn của bản chụp upstream), đã có waiver no-upstream-english do người biên tập quyết định; giữ nguyên. Tôi không chạy npm run validate, npm test, npm run check, npm run build trong lượt này, nên technical_integrity vẫn 9.6.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 6 khoá chênh lệch lớn nhất → khác nghĩa 2: sửa 0, giữ 0, bất định 2 (1.1 uddhitabhatta: «múc cơm cho» hay «dọn cơm ra», cả hai bản đều đánh dấu không chắc, từ này chỉ có một nơi dùng; 3.4 methunaka: «một đôi» có tiền lệ ở mnd7, mnd14, ja547 nhưng bản mù đọc «thông gia» có thể khớp lập luận gotra Kassapa/Koṇḍañña, Pāli một mình không phân xử được). Bốn khoá còn lại (tiêu đề, 2.4) chỉ khác diễn đạt. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài, không có
  đoạn song song): sửa 3 khoá: 2.1, 2.3, 2.4 con khỉ gọi người nghe "ngài" nhưng tự xưng "ta" → "tôi"
  (lệch cặp xưng hô trong cùng lời thoại). Không đổi nghĩa. Bất định người được hỏi ở 2.3 (ẩn sĩ hay
