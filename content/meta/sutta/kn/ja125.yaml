notes: |-
  Đã đọc hết Pāli qua v4/p4.txt. Tại commit đã ghim không có tệp Anh Sujato cho bài này (0/9 khoá) và tầng Việt hiện hành chỉ có Pháp Cú nên không có bản Hòa thượng Thích Minh Châu để đối chiếu — bản dịch đứng hoàn toàn trên Pāli root. Mọi segment Pāli đều dưới 40 ký tự nên không có segment nội dung theo ngưỡng coverage.
  Tiền lệ (đếm trong tầng Việt dự án): khung tiêu đề như ja1; janapada → xứ theo xứ khác (10); vikattheti → khoe khoang (5); dūseti → phá hoại (60); bhuñjati → hưởng theo hãy hưởng (10); bhoga → của cải (160); colophon Kinh ... thứ năm không phẩy. Thứ tự hai vế 1.1–1.2 giữ đúng Pāli (khoe khoang trước, đến xứ khác sau).
  0 tiền lệ, đặt mới, ghi lý do: Kaṭāhaka giữ nguyên tên riêng (cách hô ở 1.4 là kaṭāhakā); anvāgantvāna → Trở về (tuyệt đối phân từ của trở lại, tân ngữ của phá hoại hàm ẩn nên không tự thêm); mệnh lệnh 1.4 là lời quở giữ nguyên giọng, không thêm dấu cảm vì Pāli không có.
  Triangulation 7.5 vì chỉ có Pāli root, không có bản Anh hay bản Việt nào để đối chiếu.
