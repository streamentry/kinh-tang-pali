notes: |-
  Đã đọc hết Pāli qua v4/p4.txt. Tại commit đã ghim không có tệp Anh Sujato cho bài này (0/9 khoá) và tầng Việt hiện hành chỉ có Pháp Cú nên không có bản Hòa thượng Thích Minh Châu để đối chiếu — bản dịch đứng hoàn toàn trên Pāli root. Mọi segment Pāli đều dưới 40 ký tự nên không có segment nội dung theo ngưỡng coverage.
  Tiền lệ (đếm trong tầng Việt dự án): khung tiêu đề như ja1; sikhā → búi tóc (58); puñña → phước; Bhāradvāja giữ nguyên họ (236); alaṁ ... hotu → đủ rồi (16); colophon Kinh ... thứ chín không phẩy.
  0 tiền lệ, đặt mới, ghi lý do: Aggika giữ nguyên tên (kẻ thờ lửa 0 tiền lệ đúng cụm, nhưng thờ lửa có 16 nên 1.4 dùng kẻ thờ lửa cho cách hô aggikā); ghāsahetu → vì miếng ăn (miếng ăn chỉ 1 tiền lệ nên terminology hạ điểm); Nāguṭṭhigaṇanaṁ yāti → chẳng đáng được tính đến.
  Bất định đã ghi, không giấu: 1.3 anguṭṭhagaṇana là thành ngữ đếm bằng ngón tay, nghĩa không đáng được tính đến là cách đọc sát chữ nhất (không đi đến sự đếm); hạ ambiguity; không thêm chú thích vào thân kinh.
  Triangulation 7.5 vì chỉ có Pāli root, không có bản Anh hay bản Việt nào để đối chiếu.
