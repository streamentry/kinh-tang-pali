notes: |-
  Quyết định hội đồng biên tập 2026-10-16: A5 — snp4.9:2.3, snp4.9:5.3, snp4.9:6.3, snp4.9:5.5, snp4.9:6.5 (`sīlavata`/`sīlabbata`/`abbata` không có `parāmāsa` nên bỏ chữ “thủ” thừa); B11 — snp4.9:12.1 (`muti` (snp4.9:12.1) theo mnd9:102.1 “điều đã nhận thức”, không phải “tưởng”); B12 — snp4.9:2.3, snp4.9:5.3, snp4.9:6.3, snp4.9:5.5, snp4.9:6.5 (`vata`/`sīlabbata`: bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”/“giới cấm”).

  Sửa lỗi nghĩa 2026-10-16: snp4.9:1.1–1.4 — sửa lệch khoá, mỗi câu Việt dời một nửa dòng: 1.1 "Sau
  khi thấy khát ái," → "Sau khi thấy Khát Ái, Bất Lạc và Tham Đắm," (`taṇhaṁ aratiṁ ragañca`, ba người
  con gái của Māra); 1.2 "bất lạc và tham đắm," → "đối với dâm dục, không còn khởi ước muốn;" (`nāhosi
  chando api methunasmiṁ`); 1.3 → "thân này chứa đầy nước tiểu và phân có là gì," (`kimevidaṁ
  muttakarīsapuṇṇaṁ`); 1.4 → "đến chạm bằng chân, ta cũng không muốn." (`pādāpi naṁ samphusituṁ na
  icche`). Căn cứ: Pāli ghim từng dòng; cách chia khoá đúng như mnd9:2.1–2.4 của dự án; Sujato
  https://suttacentral.net/snp4.9/en/sujato (1.1 nêu ba tên, 1.2 không ước muốn dâm dục).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 1.4, 3.5 (Đức Phật tự xưng, `icche`/`adassaṁ` ngôi 1; §9 và mnd9:6.4, 20.5: «ta» → «Ta»), 2.1, 2.3 (Māgaṇḍiya nói với Đức Phật; chú giải Snp kể Māgaṇḍiya hỏi vị sa-môn về kiến của ngài; cùng người nói ở 4.3 đã gọi «ngài», mnd9:27.3 cũng «ngài»: «ngươi» → «ngài»; Māgaṇḍiya vẫn tự xưng «ta» ở 6.6 như mnd9), 4.3 (`munī` là hô cách, chủ ngữ của `brūsi` là ngôi 2: DPD brūsi «you say», chú giải Snp «te tvaṃ muni diṭṭhigatadhamme aggahetvā … brūsi», Sujato «O sage», mnd9:27.3: «ngài nói rằng bậc Mâu-ni không nắm giữ chúng» → «thưa bậc Mâu-ni, ngài nói về chúng mà không nắm giữ»).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 4): sửa 3.3 (`dhammesu niccheyya` là định sở cách, chú giải Snp «dvāsaṭṭhidiṭṭhigatadhammesu nicchinitvā», mnd9:8.3: «không có pháp nào được nắm giữ» → «không có điều nào được nắm giữ sau khi quyết định giữa các pháp»), 5.1–5.5 và 6.1–6.5 (bản cũ dồn «nhờ nghe, nhờ trí» từ 5.1 xuống 5.3 và bỏ `nopi tena` ở 5.5; đưa về đúng dòng như mnd9:28.1–28.5, 40.1–40.5, thêm «cũng không do điều ấy», chú thích tại 5.5 theo chú giải Snp «tesu ekamekena diṭṭhiādimattenāpi no kathemi»), 6.7 (`paccenti`: chú giải Snp «jānanti», Sujato «believe», mnd9:40.7: «nói» → «tin rằng»), 10.4 (`kathaṁ … kayirā` là «nói lời»: chú giải Snp «janena saddhiṃ viggāhikakathaṃ na katheyya», lời giải mnd9:83–84, Sujato «they wouldn’t get in arguments»; câu hỏi «sao còn xung đột» → «vị ấy không nói lời tranh cãi với người đời»), 11.1–11.2 (`yehi vivitto`: DPD vivitta «free (from)», chú giải Snp «yehi diṭṭhigatehi … ritto careyya», Sujato «from which they live secluded»: «những pháp nhờ đó vị ấy sống viễn ly» → «tách biệt khỏi những pháp nào mà vị ấy du hành»; 11.2 thêm `tāni` «những pháp ấy»), 11.3 (`jalambujaṁ kaṇḍakavārijaṁ`: chú giải Snp «jalasaññite ambumhi jātaṃ kaṇṭakanāḷaṃ vārijaṃ, padumaṃ», Sujato «prickly lotus born in the water»: «sen xanh … sinh từ bùn» → «hoa sen sinh trong nước, có cuống gai, mọc từ nước»), 12.1–12.2 (`sa mānameti` ở 12.2 bị dồn lên 12.1: đưa về đúng dòng; `muti` theo B11 «cảm nhận», như mnd9:102.1, thay «điều đã nhận thức» ghi ở mục B11 phía trên); giữ 1.2 `chanda` «ước muốn» (khác chữ), 12.1 cách đọc `diṭṭhiyāyako` theo Sujato (chú giải «diṭṭhiyā yātīti», mnd9 đọc «không bị kiến dẫn đi»; cách đọc khác, không sai rõ).
  Thống nhất cấp kho 2026-10-17 (dhīra): dhīra «bậc kiên định» → «bậc trí» theo chính lời giải của Niddesa (dhīro paṇḍito paññavā buddhimā ñāṇī vibhāvī medhāvī: mnd9:25.4, mnd11:125.3, mnd12:86.1, mnd13:133.3, mnd16:159.2), theo đa số kho (cnd2, cnd8, cnd23, snp1–snp5, snp4.2, snp4.13, snp4.16 đều «bậc trí»), cho dòng kệ Niddesa khớp bài kệ gốc snp4.13:19.3 và snp4.16:10.1; trong lời giải, chữ đầu dhīro nay là «bậc trí», sáu chữ sau giữ nguyên; snp3.6:33.4 («dũng mãnh», mạch định nghĩa vīra) không đổi.
