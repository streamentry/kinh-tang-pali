notes: |-
  Quyết định hội đồng biên tập 2026-10-16: A5 — snp4.9:2.3, snp4.9:5.3, snp4.9:6.3, snp4.9:5.5, snp4.9:6.5 (`sīlavata`/`sīlabbata`/`abbata` không có `parāmāsa` nên bỏ chữ “thủ” thừa); B11 — snp4.9:12.1 (`muti` (snp4.9:12.1) theo mnd9:102.1 “điều đã nhận thức”, không phải “tưởng”); B12 — snp4.9:2.3, snp4.9:5.3, snp4.9:6.3, snp4.9:5.5, snp4.9:6.5 (`vata`/`sīlabbata`: bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”/“giới cấm”).

  Sửa lỗi nghĩa 2026-10-16: snp4.9:1.1–1.4 — sửa lệch khoá, mỗi câu Việt dời một nửa dòng: 1.1 "Sau
  khi thấy khát ái," → "Sau khi thấy Khát Ái, Bất Lạc và Tham Đắm," (`taṇhaṁ aratiṁ ragañca`, ba người
  con gái của Māra); 1.2 "bất lạc và tham đắm," → "đối với dâm dục, không còn khởi ước muốn;" (`nāhosi
  chando api methunasmiṁ`); 1.3 → "thân này chứa đầy nước tiểu và phân có là gì," (`kimevidaṁ
  muttakarīsapuṇṇaṁ`); 1.4 → "đến chạm bằng chân, ta cũng không muốn." (`pādāpi naṁ samphusituṁ na
  icche`). Căn cứ: Pāli ghim từng dòng; cách chia khoá đúng như mnd9:2.1–2.4 của dự án; Sujato
  https://suttacentral.net/snp4.9/en/sujato (1.1 nêu ba tên, 1.2 không ước muốn dâm dục).
