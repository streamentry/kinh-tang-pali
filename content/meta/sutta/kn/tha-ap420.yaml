notes: |-
  Dịch từ Pāli root commit đã ghim; đủ 86/86 khóa, thứ tự khóa như Pāli. Dấu ngoặc kép mở ở 1.1 và đóng ở 21.3 như Pāli (không có nháy đơn).
  Tiền lệ đếm được trên tầng Việt tha-ap: 0.1 giữ Therāpadāna (469 so với 11 dạng Trưởng Lão Ký Sự; các bài liền kề cùng phẩm 416-419, 422-429 đều giữ); 0.2 Phẩm Bhaddāli (6/6). 0.3 và 23.1 theo kiểu Ký Sự Về Trưởng Lão Cúng Dường X: ở phạm vi gần nhất (tha-ap410-430) là Ký Sự 6, Tuyên Ngôn 4; ở phạm vi tha-ap400-440 là Ký Sự 9, Tuyên Ngợ 7, Tuyên Ngôn 6; toàn tầng tha-ap là Tuyên Ngợ 240, Tuyên Ngôn 120, Ký Sự 103. Dạng Tuyên Ngợ là lỗi chính tả (không có gốc Pāli), cần người biên tập phán một lượt cho cả cuốn. translationTitle bằng đúng :0.3; :0.3 không mang số thứ tự vì Pāli :0.3 không bắt đầu bằng số.
  Công thức dùng đúng đa số: Kilesā jhāpitā mayhaṁ (Các phiền não của ta đã được thiêu rụi, 95/135 toàn tầng); viharāmi anāsavo (ta sống không còn lậu hoặc, 100/143); Svāgataṁ vata me āsi (Thật lành thay sự đến của ta, 89/130); kataṁ buddhassa sāsanaṁ (đã làm tròn lời dạy của Đức Phật, 105/131 không dấu nháy, 445/478 có dấu nháy đóng); Paṭisambhidā catasso (Bốn vô ngại giải, 475/480); lời kết Itthaṁ sudaṁ dùng nhóm số nhiều Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này. Pāli có ba chỗ …pe… (19.2, 20.2, 21.2) giữ đúng một …, không mở rộng.
  Số Pāli: tettiṁsakkhattuṁ 7.1 = te + tiṁsa = 33 lần; tiṁsakkhattuṁ 7.3 = 30 lần (cùng tiṁsa = 30 trong bài, đối chiếu chattiṁsa = 36 ở tha-ap421); pañcannaṁ 5.1 = năm vị; pañca ṭhānāni 15.3 và pañcānisaṁse 13.3 = năm; pañcamakaṁ 14.4 = thứ năm; catasso 21.1 = bốn. Bài khai năm điều: không bệnh, sắc đẹp, mau chóng thấu rõ Pháp, được ăn uống, tuổi thọ (thứ năm).
  Bất định 1 (số): 18.1 Tiṁsakappasahassamhi dịch ba mươi ngàn kiếp theo tiṁsa = 30 (đo được trong chính bài: 7.3 tiṁsakkhattuṁ = 30; tiền lệ cùng Pāli 8 khóa: 5 khóa ba mươi ngàn kiếp, 1 khóa ba mươi ngàn đại kiếp, 1 khóa ba nghìn kiếp, 1 khóa ba trăm nghìn). Tầng Anh đã ghim không có bản đối chiếu độc lập cho dạng này, nên con số chưa phân xử được; để người biên tập phán.
  Bất định 2: 1.1 atithiṁ me gahetvāna (dẫn theo vị khách của ta; me có thể gắn với atithiṁ hoặc với gahetvāna); 3.1 gati (lối đi, hiểu là việc đi khất thực bị cắt do sông, không phải nẻo tái sinh) và 3.4 oruddhanaditāya (vì dòng sông đã chặn lối, hapax trong tầng, 0 tiền lệ); 11.2 vāṇijjaṁ sampayojitaṁ dịch một cuộc buôn bán đã được thực hiện, trong khi tha-ap450 và tha-ap481 (vāṇijjaṁ suppayojitaṁ) dịch một việc trao đổi được sắp đặt chu đáo (2 so với 1); 14.2 khippaṁ dhammanisantitā dịch mau chóng thấu rõ Pháp (nisantitā 0 tiền lệ); 10.1 khayato vayato (0 tiền lệ, dịch Như là hoại diệt, và như là tiêu tan); 10.3 pure sikkhāpadādānā dịch trước khi thọ trì các học giới (0 tiền lệ); 12.2 daratha dịch nỗi bức bách (tiền lệ dao động hoặc mệt nhọc, 3 khóa, không khớp nghĩa); 5.3 sakakammābhiraddhohaṁ dịch ta hài lòng với nghiệp của chính mình (tiền lệ 2, hai cách khác nhau).
  Lựa chọn theo đa số cục bộ: 18.3 Duggatiṁ nābhijānāmi dịch Ta không còn biết đến đọa xứ (19 so với 18 dạng rơi vào khổ đau ở tha-ap380-460; toàn tầng 54 so với 137, nhưng dạng khổ đau lỏng so với Pāli duggati); 8.1 Padesarajjaṁ vipulaṁ theo tha-ap422 (Vương quyền cai quản các vùng đất rộng lớn); 3.2 tādin dịch bất động như vậy theo tiền lệ ud, iti; 6.2 theo tha-ap422 (giữa chúng chư thiên Ba Mươi Ba); 6.3 nārīgaṇehi dịch đoàn nữ nhân (6 tiền lệ). Tha-ap421 cùng phẩm dùng ngôi tôi, bài này dùng ta theo đa số tầng (xem các công thức trên) và các bài tha-ap416-419, 422.
  Tầng tham khảo: english-sujato không phủ tha-ap; vietnamese-current chỉ có Pháp Cú; english-project chưa có. Mẫu số coverage English = 0 (mọi khóa Pāli dưới 40 ký tự).
