  (52.x, 47.4 vẫn «trở lui»); `ñāṇenapi` 27.2 chú giải đọc định cách «tasmimpi ñāṇe»; `loko` = `attā`
  (50.4–50.7), `diṭṭhimedhagāni` = `diṭṭhivihesakāni` (6.3), `yaso` = `parivāro` (53.2).

  Rà từng chữ bằng DPD 2026-10-16: 372 khoá đã rà; sửa `10.24`, `15.3`, `20.3` (`muta` «được nhận thức» → «được cảm nhận», sót của B11: DPD `muta` pp. «sensed», cùng Pāli với `18.1`, `18.3` và `snp4.5:3.3` đã dịch «cảm nhận»); bất định `36.3`, `36.5` (`parattabhāvo`: chú giải att5 «parassa attabhāvo» ủng hộ «của kẻ khác», còn att2 ở mnd2 đọc «paraloke»; chờ quyết định chung), `43.4`, `51.5` (`sa brahmā`, như đã ghi).
  Kiểm độc lập sau lượt rà DPD 2026-10-16: 3/3 khoá sửa đúng (cả 18 khoá có *muta* nay nhất quán «cảm nhận» theo B11; B12, B13, B18 đã áp đủ); mẫu ngẫu nhiên 30 khoá 0 lỗi.
