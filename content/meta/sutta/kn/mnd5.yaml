notes: |-
  **Phạm vi: đủ 372/372 khoá của mnd5, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải kinh `snp4.5` (Paramaṭṭhakasutta, Kinh Tám Kệ Về Tối Thượng), thuộc phẩm Aṭṭhakavagga. Cấu trúc giống các bài Cūḷaniddesa (`cnd6`, `cnd10`, `cnd12`, `cnd13`, `cnd14`, `cnd16`, `cnd18`, `cnd21`): dẫn từng đoạn kệ, giải từng cụm, nhắc lại cả đoạn kệ (kệ in đậm ở `2`, `9`, `15`, `21`, `27`, `34`, `41`, `47`; nhắc lại trong ngoặc kép ở `8`, `14`, `20`, `26`, `33`, `40`, `46`, `59`, mỗi lần mở đầu bằng *Vì thế, Đức Thế Tôn đã nói—*). Pāli có 117 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 69 khoá chứa dấu lược `…`: 17 khoá có `…pe…` (đều thành đúng một `…`), 52 khoá có `…` trần (`4.5`–`4.8`, `50.5`–`50.12`, `54.3`–`54.23`, `56.5`–`56.23`, mỗi khoá giữ đúng một dấu), 0 khoá có `(…)`, 0 khoá kết `….`. Một khoá có ngoặc đơn của Pāli là `52.4` `(vitthāro)`, bản Việt giữ cặp ngoặc đơn và ghi *(phần mở rộng)*.

  **Tên bài.** `0.1` Mahāniddesa → *Đại Tập Kể Lược*, theo `0.1` của các bài cnd (*Tiểu Tập Kể Lược*); `0.2` Aṭṭhakavagga → *Kể Lược Phẩm Tám Kệ* (đối ứng *Kể Lược Phẩm Bờ Kia* ở cnd10 trở đi; tên *phẩm Tám Kệ* theo `snp4.16:23.6`); `0.3` và `60.1` → *Kể Lược Kinh Tám Kệ Về Tối Thượng, thứ năm* (tên kinh theo `snp4.5:0.2`, cùng khuôn *Kể Lược Câu Hỏi Của Thanh Niên …, thứ …* ở cnd).

  **Cách trình bày lemma** theo cnd6/cnd12/cnd13/cnd16/cnd18: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Các câu *Tạo tác: có hai loại tạo tác—* (`44.2`, `48.2`), *Ở đời: cõi đọa xứ … thế giới các xứ—* (`4.11`, `22.3`, `44.13`), *Ở người ấy: ở bậc A-la-hán, bậc đã diệt tận lậu hoặc.* (`37.6`, `42.2`), *Đó là sự lắng dịu mọi hành …* (`52.3`) và *Cái nào là tham, tham đắm …* (`35.9`) dùng lại nguyên văn các khoá trùng Pāli ở cnd16, cnd12 và cnd6.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd5`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho mnd1–mnd16 và tệp tên `mnd-name`. Lớp `english-project` không có `mnd5`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **116** khoá (132 nếu đếm cả thẻ); Sujato phủ 0/116, `english-project` 0/116, `vietnamese-current` 0/116. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.5` (bài kệ chứa đúng tám đoạn kệ này) có trong tầng đã ghim nhưng là bản của **bài khác**, nên không tính là đối chiếu English của mnd5; chứng cứ độc lập còn lại là bản Việt đã dịch của `snp4.5`, `snp4.4`, `snp3.6`, `snp4.9`, `ps2.1`, `ps3.2`, `ud6.4`, `an10.95`, `dn9`, `mil7.4.1` và công thức chú giải ở `cnd6`, `cnd10`, `cnd12`, `cnd13`, `cnd14`, `cnd16`, `cnd18`, `cnd21`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, bỏ khoảng trắng thừa) trùng nguyên dấu câu với khoá đã dịch ngoài bài này: 87 khoá có tiền lệ, dùng lại nguyên văn 73, khác 14; thêm 29 khoá chỉ khác dấu câu hoặc chữ hoa/thường, dùng lại 27 (sau khi bỏ dấu câu và chữ hoa/thường), khác 2. Nguồn dùng lại, đếm theo khoá bản Việt trùng (sau khi bỏ dấu câu và chữ hoa/thường): `snp4.5` 66 khoá (các dòng kệ, kể cả các lần nhắc lại), `cnd16` 17 (chủ yếu tám lần *Vì thế, Đức Thế Tôn đã nói—* và các khoá `Tạo tác`, `Ở đời`), `mil6.3.2` 11 và `an10.24` 3 (danh sách phiền não ở `54.x`), `an10.95` 6 (`50.7`–`50.12`), `cnd6` 2, `cnd12` 1, `snp3.6` 1. Các khoá Pāli trùng nguyên văn mà bản Việt khác, kèm lý do:
  - `2.1`, `2.3`, `8.3`, `21.3`, `21.4`, `26.3` (trùng `snp4.5:1.1`, `1.3`, `4.3`, `4.4`) → bỏ nháy kép quanh *đây là tối thượng*, *thấp kém*, *ngang bằng*, *hèn kém*, *cao hơn*, vì Pāli các khoá này không có nháy (dấu `ti` đã làm việc ấy); chữ còn lại giữ nguyên;
  - `21.2`, `26.2` (trùng `snp4.5:4.2` *dù bằng tri kiến, bằng giới luật hay khổ hạnh*) → *dù bằng trí …*, vì chính bài này giải `ñāṇa` ở `22.2` và `29.1` là *trí của tám thiền chứng, trí của năm thắng trí, tà trí*, và `snp4.5` đã dùng *tri kiến* cho cả `diṭṭhi` lẫn `ñāṇa`; `27.2`, `33.2`, `29.1`, `29.2` theo cách đó (khoá này không có tiền lệ nguyên văn);
  - `47.1` (trùng `snp4.4:7.1`, `snp4.5:8.1` *Họ không hư cấu, không đề cao,*) cùng `59.1`, `48.1`, `49.9` → *Họ không tạo tác, không đề cao,*, vì lời giải `48.2` dùng đúng *tạo tác* (`cnd16:5.2`, 8 khoá *tạo tác do …* trong cnd) và người đọc cần thấy cùng một từ ở kệ và ở lời giải;
  - `52.1` chỉ khác chữ hoa đầu câu; `54.6`, `54.15`, `56.9`, `56.11` (trùng `an10.24`, `mil6.3.2`, `an8.148-627`) → *hằn học*, *ngã mạn*, *ganh tị*, *giả dối* theo cùng chuỗi mười bốn phiền não ở `cnd6:15.2` và `cnd12` (*hằn học* 4 khoá trong cnd, *hiềm hận* 0).
  Đã dò **25 nhóm Pāli trùng nguyên byte trong chính bài** (31 khoá lặp thêm): 0 nhóm có bản Việt khác. Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 41 nhóm (62 khoá lặp thêm), 0 nhóm có bản Việt khác ngoài dấu câu và chữ hoa/thường.

  **Thuật ngữ, kèm số đếm.** `dvāsaṭṭhi diṭṭhigatāni` → *sáu mươi hai kiến chấp* (`cnd6:21.2`); `diṭṭhigata` → *kiến chấp* (`cnd6:21.2`, `mn2`). `diṭṭhi` ở các dòng kệ giữ *tri kiến* như `snp4.5` (`2.1`, `21.1`, `27.4`, `41.3`), ở lời giải là *kiến* như cnd. `paramaṁ aggaṁ seṭṭhaṁ visiṭṭhaṁ pāmokkhaṁ uttamaṁ pavaraṁ` → *tối thượng, cao nhất, tối thắng, thù thắng, dẫn đầu, tối cao, cao quý*: năm khoá `aggaṁ … pavaraṁ` ở `cnd6` (2) và `cnd21` (3) cho *tối thượng, tối thắng, thù thắng, dẫn đầu, tối cao, cao quý*, còn `cnd10`, `cnd14` (3 khoá) cho *tối thượng, cao quý, thù thắng, đứng đầu, tối cao, ưu tú*; theo nhóm đông hơn, và vì `paramaṁ` đứng đầu danh sách là *tối thượng* ở `snp4.5:1.1` nên `aggaṁ` nhường chữ *tối thượng* cho `paramaṁ` và dịch *cao nhất* (cùng ý `cnd10:22.2` *parame agge* → *điều cao nhất, tối thượng*). `uttariṁ karoti` → *xem là cao hơn*. `sīlabbata` → *giới luật và khổ hạnh* (`snp4.5`; `sīla` *giới luật*, `vata` *khổ hạnh*), khác *giới cấm thủ* (`ne5`, `ps2.1`) vốn là thuật ngữ của kiết sử. `ānisaṁsa` → *lợi ích*; `diṭṭhadhammika` → *trong hiện tại*, `samparāyika` → *ở đời sau* (`cnd20:20.1`; *trong đời này* chỉ ở `iti23`). `kappa` → *tạo tác* (`cnd16:5`, 8 lần *tạo tác do …* trong cnd), `kappeti` → *tạo dựng* (`snp4.5:4.1`, `cnd13:16.3`), `pakappitā saññā` → *tưởng hư cấu* (`snp4.5:7.2`), `vikappayeyya` → *phán đoán* (`snp4.5:7.4`). `anta` (cực) → *cực* theo `snp4.5:6.1` (*hai đầu* ở `cnd6:19` thuộc kệ khác). `nivesanā` → *chỗ trú ngụ* (`snp4.5:6.3`; `snp4.9:12.4` dùng *trú xứ*, còn *trú xứ* trong cnd dành cho `viññāṇaṭṭhiti` nên tránh trùng). `paṇidhi` → *nguyện vọng* (`snp4.5:6.1`). `chandāgati` … → *thiên vị vì …* (`ne36:19.2`, `dn31:5.2`; 48 lần *thiên vị vì* trong tầng). `pāraṅgato` → *đã đến bờ kia* (`snp4.5:8.4`; trong cnd và snp *bờ bên kia* 71 lần, *bờ kia* 40 lần, nên giữ *bờ kia* theo kệ gốc cùng bài). Bốn đạo: *Dự lưu đạo*, *Nhất lai đạo*, *Bất lai đạo*, *A-la-hán đạo* theo `ps2.1:13` (5 lần mỗi dạng; *A-la-hán đạo* 51 lần). `vaṇṇapokkharatā` → *dung sắc* (`dn17:1.15.2`); `kolaputtiya` → *xuất thân gia đình danh giá*: 0 tiền lệ. `ugghātinighāti` → *phấn khích và suy nhược* (`snp4.8:5.2`); `anunayapaṭigha` → *ưa thích và ghét bỏ* (`mil7.4.1:5.1`). `tādī` → *vị như vậy*. `ñāṇagginā daḍḍhā` và công thức *đã được đoạn trừ, nhổ tận gốc, làm lắng dịu, làm an tịnh, không thể sinh khởi nữa, bị lửa trí tuệ thiêu cháy* theo `cnd13:10.4`, `cnd16:3.3`. `nissito allīno upagato ajjhosito adhimutto` → *đã nương vào, đã bám vào, đã đi đến, đã chấp chặt, đã nghiêng hẳn về* (`cnd10:21.2`). `jantu` → *chúng sinh* (`cnd16:20.2`). Các loài ở `10.11`: *dạ-xoa*, *kim sí điểu*, *Inda* theo `ps3.2:15.7`; *a-tu-la*, *càn-thát-bà* theo `ud5.5:17.1`; `nāga` → *loài rồng* (`ps3.2` giữ *nāga*, `ud5.5` dùng *long vương*).

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `dvāsaṭṭhi` = dve 2 + saṭṭhi 60 = 62 → *sáu mươi hai* (`3.3`, `3.6`, `31.2`, `38.2`, `48.9`, `50.2`); `vīsativatthukā` 20 → *hai mươi cơ sở*, `dasavatthukā` 10 → *mười cơ sở* (hai lần, `48.9`, như `cnd6:21.2`); `aṭṭhasata` = aṭṭha 8 + sata 100 = 108 → *một trăm lẻ tám* (`48.6`, như `cnd6:20.7`); `sattannaṁ dhammānaṁ` 7 → *bảy pháp* (`43.2`, `51.3`); `pañcahākārehi` 5 → *năm cách* (`52.11`) rồi năm mục `52.12` (5/5); `catūhi upādānehi` 4 → *bốn loại chấp thủ* (`28.6`); `aṭṭhasamāpatti` 8, `pañcābhiññā` 5 → *tám thiền chứng*, *năm thắng trí* (`22.2`, `29.1`); `chaḷabhiñña` 6 → *sáu thắng trí* (`57.9`). Danh sách: `paramaṁ … pavaraṁ` 7 mục / 7 Việt (`3.3`, `3.6`, `11.4`), `aggaṁ … pavaraṁ` 6 / 6 (`4.3`, `4.4`, `4.9`); 9 loài (`10.11`, 9/9); 6 cặp thanh tịnh–giải thoát (`5.8`, `5.9`, `10.12`–`10.14`, 6/6); 13 mục `-kusala` (`16.2`, 13/13); 12 mục `23.2` (12/12); 6 mục `nissito … adhimutto` (`17.2`, 6/6); 8 mục `rāga … anusaya` (`30.1`, `44.7`, 8/8); 8 mục `ratto … thāmagato` (`44.8`, 8/8); 10 mục nẻo đi (`44.11`, 10/10); 6 mục `-dhaja/-ketu/-adhipateyya` (`49.7`, 6/6); 8 điều thế gian (`53.2`, 8/8); 5 trạng từ *đã từ bỏ* (`54.2`, `54.24`, 5/5); 8 mục `taṁniddesā` (`57.2`–`57.9`, 8/8); 6 mục `gāha` và 6 mục `saccaṁ … aviparītaṁ` (`38.4`, 6/6 và 6/6); 6 mục `chinnā …` (`31.2`, `36.15`, `37.7`, `38.4`, `42.3`, 6/6). Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi`; `koṭigato` ở `52.4` là *chỗ tột cùng*, không phải số; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. Đã giải quyết ở lượt cải thiện 2026-10-13: `34.4`, `38.1`, `38.5`, `40.4` `dhammesu niccheyya samuggahītaṁ` nay dịch theo cách đọc phủ định (xem mục *Lượt cải thiện 2026-10-13*). `snp4.5:6.4` (ngoài lát) vẫn là *sau khi quyết định và nắm giữ giữa các pháp*, cần người biên tập xem lại.
  2. `38.4` `odhiggāho bilaggāho varaggāho koṭṭhāsaggāho uccayaggāho samuccayaggāho`: 0 tiền lệ trong tầng cho cả sáu từ; *sự nắm giữ có giới hạn, từng phần, phần tốt nhất, từng khối, chồng chất, tích lũy* là cách đọc theo thành tố từ, chưa phân xử được từng sắc thái.
  3. `42.3` `saññāvikappayeyyatā`, `saññāviggahena`: *viggaha* có thể là *tranh chấp* (như `6.3` `diṭṭhiviggahāni` → *xung đột*) hoặc *hình thể*; chọn *do sự định hình của tưởng* và *do tính có thể bị tưởng phán đoán*, 0 tiền lệ; `saṅkhatā abhisaṅkhatā` → *được cấu thành, được kết tạo*.
  4. `43.4`, `51.5` `sa brahmā` → *được gọi là bà-la-môn*, theo `snp3.6:19.5` và `cnd18:48.2` (chủ yếu để nhất quán); nghĩa đen là `brahmā`. Báo để người biên tập quyết.
  5. `10.2`–`10.3` `attani … attā vuccati diṭṭhigataṁ`: dịch *tự thân* cho cả hai để khớp `snp4.5:2.1`; nghĩa *tự thân được gọi là kiến chấp* là lời chú giải của Pāli, không phải nghĩa thường của `attā`.
  6. `27.2`, `29.1` `ñāṇenapi so nissayaṁ no karoti`: dịch *ngay cả bằng trí, vị ấy cũng không tạo ra chỗ nương tựa* (cách thể công cụ, theo `29.1`), khác `snp4.5:5.2` *ngay cả vào tri kiến*.
  7. `36.2`–`36.13` `idhā … hurā`: dịch *ở đây … ở kia* trong lời giải, khác *đời này … đời sau* ở dòng kệ, vì lời giải đối `sakattabhāvo`/`parattabhāvo`, sáu nội xứ/ngoại xứ, dục giới/sắc giới và vô sắc giới, không chỉ đời sau.
  8. `53.3` `ekañce bāhaṁ … ekañce bāhaṁ`: *một cánh tay … một cánh tay khác*; `vāsiyā taccheyyuṁ` *dùng rìu đẽo* (`mil7.4.1:6` *lưỡi cưa*); `amusmiṁ` *bên kia*, chưa rõ cặp quy chiếu.
  9. `57.2`–`57.9` `taṁniddesā` → *vì được chỉ danh theo điều ấy*, 0 tiền lệ.
  10. `5.1` `khipati ukkhipati parikkhipati` → *ném bỏ, hất bỏ, gạt bỏ*: 0 tiền lệ; `10.14` `āyatiṁ phalapāṭikaṅkhī` → *trong tương lai vị ấy mong đợi quả*: 0 tiền lệ; `48.5` `mariyādikataṁ` → *đặt mốc giới*: 0 tiền lệ.
  11. `4.2` `Yadi ti yaṁ` → *Điều nào: là cái nào.*: lời giải về hình thức từ, dịch tối giản; `1.1` `vakkhati` không nêu chủ ngữ.
  12. `30.1` `dvejjhāpannesu dveḷhakajātesu` → *đã rơi vào hai phía, đã sinh phân vân*: 0 tiền lệ; `11.3`, `30.1` `khanti` → *sự chấp nhận*.
  13. Lỗi ngoài lát, báo chứ không sửa: `snp4.5:1.2` bỏ `jantu` của `Yaduttariṁ kurute jantu loke` (*và cho nó là cao nhất ở đời*, không có *chúng sinh*); `snp4.5:4.2`, `5.2`, `5.4` dùng cùng chữ *tri kiến* cho `ñāṇa` và `diṭṭhi`; `snp4.5:6.4` như mục 1 và `snp4.5:6.2`, `snp3.5:14.2` (`bhavābhavāya` → *hiện hữu hay phi hiện hữu* / *hữu hay phi hữu*, khác lượt sửa ở mục *Lượt cải thiện 2026-10-13*); `cnd18:48.2` `sa brahmā` → *bà-la-môn* như mục 4.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (372/372, cùng thứ tự); nháy kép `“”`, nháy đơn `‘’` và ngoặc đơn khớp Pāli từng khoá (0/372 lệch); dấu lược `…` khớp Pāli từng khoá (0/372 lệch; 69 khoá có `…`: 17 khoá có `…pe…`, 52 khoá có `…` trần; không khoá Pāli nào có `(…)` hay kết `….`); 0 khoá rỗng; NFC; không khoảng trắng thừa; không nháy thẳng; Pāli lọt sang Việt: không còn từ có dấu Pāli (chỉ có tên *Inda*).

  **Lượt cải thiện 2026-10-13.** Đọc đối kháng lại cả 372 khoá cặp Pāli↔Việt, đo tiền lệ toàn tầng rồi sửa **12/372 khoá** (`4.10`, `34.2`, `34.4`, `35.1`, `36.1`, `36.14`, `36.15`, `36.16`, `38.1`, `38.5`, `40.2`, `40.4`); tập khoá và thứ tự không đổi. Phân loại: một accuracy fix (mục 1) và hai terminology fix (mục 2, 3).
  1. **Accuracy fix** — `34.4`, `38.5`, `40.4` (`dhammesu niccheyya samuggahītaṁ`) và lemma `38.1`: trước *sau khi quyết định và nắm giữ giữa các pháp* (đọc như khẳng định vị A-la-hán có nắm giữ), sau *không có điều nào được nắm giữ sau khi quyết định giữa các pháp*. Căn cứ: (a) lời giải `38.4` của chính bài nói điều được nắm giữ ấy *natthi na santi na saṁvijjati nupalabbhati, pahīnaṁ … ñāṇagginā daḍḍhaṁ*; (b) cùng khuôn đã dịch phủ định ở `mnd9` (4 khoá: `8.3`, `11.1`, `11.6`, `20.3`), `mnd13` (4 khoá: `87.2`, `89.1`, `89.5`, `93.2`) và `snp4.9:3.3`; (c) bản Anh của kệ này ở `snp4.5:6.3–6.4` đọc phủ định (*has adopted no dogma at all after judging among the teachings*). Dạng khẳng định chỉ còn ở `mnd3` (4 khoá) và `snp4.3`, `snp4.13`, nơi ngữ cảnh là kẻ chấp kiến. Điểm đổi: `semantic_fidelity` 8.5 → 8.7, `grammar_logic` 8.6 → 8.8 (phạm vi phủ định).
  2. **Terminology fix** — `bhavābhava(āya)` ở `34.2`, `40.2`, `35.1`, `36.1`, `36.14`, `36.15`, `36.16`: trước *hiện hữu hay phi hiện hữu*, sau *hữu này hay hữu khác*. Căn cứ: lời giải `36.1` của chính bài chỉ liệt kê các loại hữu (nghiệp hữu, tái hữu, dục hữu, sắc hữu, vô sắc hữu …), không có phi hữu; đo ngoài bài này 139 khoá chứa `bhavābhav-`: 44 khoá dùng *hữu này (hay) hữu khác*, 13 khoá dùng *hữu (và/hay) phi hữu*, 1 khoá (`snp4.5:6.2`) dùng *phi hiện hữu*; riêng dạng số ít `bhavābhavāya`: 8 / 7 / 1. Dạng *phi hiện hữu* không có tiền lệ nào ngoài dòng kệ này nên bỏ. Hai nhóm *hữu này hữu khác* và *hữu phi hữu* ở tầng vẫn chưa thống nhất (13 khoá *phi hữu* ở `iti`, `ud`, `snp3.5:14.2`, `snp4.11:16.4`, `mnd11`): báo, không sửa ngoài lát. Điểm đổi: `terminology` 8.6 → 8.8.
  3. **Terminology fix** — `35.1` lemma `yassāti`: trước *Của vị ấy: của bậc A-la-hán, bậc đã diệt tận lậu hoặc* (đọc như `tassa`, lệch với chính `36.15` dịch `yassa` là *Ở vị nào*), sau *Ở người nào: ở bậc A-la-hán, vị đã diệt tận lậu hoặc* theo `cnd7:59.2`, `cnd13:10.3`, `mnd3:32.2`, `mnd10:109.2` (4/4). `4.10` `manujo`: trước *con người*, sau *loài người*, vì cùng chuỗi `satto naro … manujo` đã dịch *loài người* ở 9 khoá, *con người* ở 3 khoá (kể cả khoá này). Cả hai thuộc `terminology`.
  Đo lại tiền lệ sau khi sửa (Pāli trùng nguyên văn ở bài khác, bỏ thẻ in đậm và khoảng trắng): 142 khoá có tiền lệ, 13 khoá có bản Việt không trùng bản nào đã dịch ở bài khác. Mười khoá khác đã giải thích ở trên (`2.1`, `2.3`, `8.3`, `21.2`, `21.3`, `21.4`, `26.2`, `26.3`, `52.1` cùng `16.2`: *như ý túc* thay *thần túc* của `mnd3`, vì *như ý túc* ở 4 khoá so với 2 khoá cho cùng chuỗi `iddhipādakusalā`); ba khoá còn lại là `34.2`, `40.2`, `34.4` theo hai mục trên. Pāli trùng trong chính bài: 25 nhóm nguyên byte, 43 nhóm khi bỏ dấu câu, chữ hoa/thường và `ti` cuối, 0 nhóm có bản Việt khác (ngoài dấu câu và chữ hoa/thường). Hiệu chuẩn các phép đo: tập khoá 372/372 cùng thứ tự, nháy kép, nháy đơn và ngoặc đơn khớp Pāli từng khoá (0/372 lệch; 28 khoá Pāli có nháy), dấu lược `…` khớp từng khoá (0/372 lệch), NFC, không khoá rỗng, không Pāli lọt sang Việt.
  **Hạ điểm có chủ ý.** `segment_alignment` 10.0 → 9.8: ở `15.3`–`15.4` và `20.3`–`20.4` (`tasmā hi diṭṭhaṁ va sutaṁ mutaṁ vā` / `sīlabbataṁ bhikkhu na nissayeyya`), mệnh đề *vị tỳ-kheo chớ nương tựa* đứng ở khoá `.3` còn tân ngữ *cái được thấy, được nghe, được nhận thức* ở khoá `.4`, tức nội dung cắt ngang ranh khoá. Giữ nguyên vì cùng cách ngắt với `snp4.5:3.3–3.4` và bản Anh của kệ này, đảo vế sát chữ sẽ làm câu Việt khó hiểu; ghi để người biên tập quyết cùng với `snp4.5`.
  **Không đổi dù còn nghi ngờ (không phân xử được bằng căn cứ trong kho).** `10.11` `mahārājattāya` → *đại vương* theo `mnd3:38.12` (có thể là Tứ Đại Thiên Vương, chưa phân xử); `10.2`–`10.3` `attā` → *tự thân*; `43.4`, `51.5` `sa brahmā` → *được gọi là bà-la-môn* (cùng cách đọc ở `snp3.6:19.5`, `cnd8:102.5`, `cnd9:18.5`, `cnd18:48.2`); `5.1` `khipati ukkhipati parikkhipati` (hapax trong lớp này; `ukkhipati` ở `an8.19:13` và `ud5.5:21` là *trục xuất*, khác nghĩa ở đây); `30.1` `dvejjhāpannesu dveḷhakajātesu`, `38.4`, `42.3` (hapax); `53.4` `amusmiṁ` → *bên này … bên kia* như `mnd16:59.3` (`amukasmiṁ`). Không có lỗi mới nghiêm trọng nào được phát hiện: không có số Pāli bị đổi, tập khoá không đổi. Các điểm khác giữ nguyên (`source_provenance` 9.4, `triangulation` 8.0, `vietnamese_clarity` 8.4, `han_viet_balance` 9.2, `ambiguity_integrity` 8.4, `technical_integrity` 9.6); `final_score` 8.87 → 8.91. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` vẫn chưa chạy trong lượt này nên `technical_integrity` giữ 9.6.

  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 95 khoá chênh lệch lớn nhất → khác nghĩa 5 nhóm: sửa 1, giữ 1, bất định 3. Sửa 1 (`21.1`, `22.1`, `22.4`, `26.1` `diṭṭhimpi lokasmiṁ na kappayeyya`: trước *tri kiến về đời*, sau *tri kiến ở đời*, vì `lokasmiṁ` là vị trí cách; đo trên tầng, trong 408 khoá có `lokasmiṁ` có 92 khoá dịch *ở đời* và chỉ 5 khoá dịch *về đời*, đúng là bốn khoá này cùng `snp4.5:4.1`; *về đời* nghiêng sang nghĩa kiến giải về thế giới, không phải ở đâu mà kiến được dựng nên). Giữ 1 (`38.1`: bản mù dịch cụm `dhammesu niccheyya samuggahītaṁ` thành *điều đã nắm chặt* mà bỏ ngầm phủ định, còn lời giải `38.4` của chính bài có `natthi na santi na saṁvijjati nupalabbhati`, nên giữ cách đọc phủ định ở `34.4`, `38.1`, `38.5`, `40.4`). Bất định 3: (1) `41.4`, `44.1`, `44.14`, `46.4` `kenīdha lokasmiṁ vikappayeyya`: bản dự án *ai … phán đoán được vị ấy*, bản mù *bằng điều gì*; `kena` là cách công cụ và lời giải `44.7`, `44.10` của chính bài dùng `kena` như *bằng cái gì*, nên cách đọc của bản mù có căn cứ ngữ pháp, nhưng cả 10 khoá của tầng ở `snp4.4`, `snp4.5`, `mnd4` và bài này đều dùng *ai*; giữ để khớp tầng, báo người biên tập quyết; (2) `27.4`, `31.1`, `31.4`, `33.4` `diṭṭhimpi so na pacceti kiñci`: *tin vào* (bản dự án, như `mnd10:36.4`, `mnd13:118.3`) so với *quay lại với* (bản mù); lời giải `31.3` ghép `na pacceti na paccāgacchati` nên cả hai nghĩa đều có chỗ đứng; (3) `42.3` `saññāviggahena`: *sự định hình của tưởng* (bản dự án) so với *sự tranh chấp của tưởng* (bản mù), `viggaha` có cả hai nghĩa. Các khoá còn lại trong 95 khoá chỉ khác diễn đạt hoặc cách chọn thuật ngữ (`kappa` *tạo tác* so với *khởi lập*, `purekkhāra` *đề cao* so với *đặt lên hàng đầu*, `idhā`/`hurā` *hiện hữu cá thể* so với *tự thể*, `15.3`–`15.4` và `20.3`–`20.4` đứng khác ranh khoá như đã ghi ở mục hạ điểm `segment_alignment`). Đọc đối kháng lại 372 cặp Pāli↔Việt, không thấy lỗi số hay phủ định mới. Không có bản Anh hay bản Việt độc lập khác; đối chiếu chỉ bằng Pāli, ngữ cảnh bài và tiền lệ trong tầng dự án.

  **Lượt rà soát 2026-10-15** (Claude Opus 5.5, đọc đối kháng Pāli↔Việt 372 khoá, đoạn song song `snp4.5`, `snp4.4`, `cnd12`, `cnd21`, `an10.96`, `dn9`; không có bản nguyên bài): sửa 5 khoá. `28.2`–`28.4` lemma `attaṁ pahāyā` *cái được nắm lấy* → *những gì được nắm lấy*, khớp `28.1`, `28.5`, `28.7` và `snp4.5:5.1` (cùng một chuỗi Pāli, hai cách dịch trong cùng bài). `36.1` `punappunagatiyā` *cảnh giới lặp đi lặp lại* → *nẻo đi lặp đi lặp lại*, theo `mnd10:111.6` (`gati` là *nẻo đi*, như `44.10`–`44.11` của chính bài). `6.1` chữ hoa đầu khoá cho lemma. Giữ: `53.2` *lạc cũng là vị như vậy, khổ cũng …* như `mnd16:59.2` (nghĩa mơ hồ nhưng có tiền lệ); `4.3`–`4.4` *xem là cao nhất* (đã phân xử ở lượt trước). Bất định: các mục 1–13 ở trên vẫn giữ nguyên, đặc biệt `sa brahmā`, `viggaha`, `kena`, `pacceti`. Không thêm lỗi nghĩa nào khác; không có bản Anh nên `triangulation` giữ ở mức chỉ Pāli + song song.

  Quyết định hội đồng biên tập 2026-10-16: B11 — 17 khoá (`9.2` … `46.1`) (`muta` = “cảm nhận”); B12 — 21 khoá (`9.2` … `59.3`) (`vata`/`sīlabbata` bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”); B13 — 22 khoá (`42.3` … `59.1`) (`kappa` = “vọng tưởng”; động từ/phân từ `kappeti` = “tạo dựng”, bỏ “tạo tác” (trùng `saṅkhāra`)); B18 — `41.4`, `44.1`, `44.14`, `46.4` (`kenīdha … vikappayeyya` = “lấy gì ở đời này mà phán đoán được vị ấy”; `timitimiṅgala` = “cá nuốt cá nuốt cá khổng lồ”).

