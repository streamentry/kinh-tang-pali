notes: |-
  Đã đọc hết Pāli qua v4/p4.txt. Tại commit đã ghim không có tệp Anh Sujato cho bài này (0/9 khoá) và tầng Việt hiện hành chỉ có Pháp Cú nên không có bản Hòa thượng Thích Minh Châu để đối chiếu — bản dịch đứng hoàn toàn trên Pāli root. Mọi segment Pāli đều dưới 40 ký tự nên không có segment nội dung theo ngưỡng coverage.
  Tiền lệ (đếm trong tầng Việt dự án): khung tiêu đề như ja1; desa → xứ; anuvicca → xét kỹ (29); gaṇhāti → nhận lấy (55); pivati → uống theo uống sữa (4); colophon Kinh ... thứ bảy không phẩy.
  0 tiền lệ, đặt mới, ghi lý do: Kalaṇḍuka → sóc (con sóc 15, dùng cho loài gặm nhấm ở Veḷuvana; giữ bầy sóc cho số nhiều); vatthu → nơi; vanagocara → sống trong rừng (không dùng kiếm ăn vì chỉ 1 tiền lệ yếu).
  Bất định đã ghi, không giấu: 1.4 piva có hai cách đọc là mệnh lệnh hãy uống và liên từ như; tôi chọn như vì chủ thể số nhiều ở 1.3 (gaṇheyyuṁ) đi với bầy sóc hợp hơn, và hạ ambiguity; không thêm chú thích vào thân kinh.
  Triangulation 7.5 vì chỉ có Pāli root, không có bản Anh hay bản Việt nào để đối chiếu.
