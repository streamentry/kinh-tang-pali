notes: |-
  Dịch từ Pāli root đã ghim (đọc qua `pali.py`). Ba bài trong lát: tha-ap309, tha-ap312, tha-ap321 — mỗi bài 32 khoá, tổng 96, tất cả đều đã dịch đủ. Bài này là bài CUỐI của phẩm Padumakesaravagga và chứa thêm uddāna của bộ Therāpadāna (`:8.1`–`:10.6`).

  SỐ THỨ TỰ Ở `:0.3` — phép đo của lát này (lát này đo lại, không nhận số của lát trước).
  Pāli root có 563 bài `tha-ap`; `:0.3` CÓ số thứ tự ở 165 bài, KHÔNG có ở 398 bài. Trong 357 bài đã có bản Việt trên đĩa, đối chiếu từng bài với Pāli của chính nó: Pāli không có số thì bản Việt cũng không có ở 203/205 = 99,0%; Pāli có số thì bản Việt giữ ở 66/152 = 43,4%.
  Chiều đầu gần như tuyệt đối nên đó là phép đo có ý nghĩa; chiều sau đa số là BỎ nhưng đó là đa số thói quen, không phải đa số nguồn. Ba lát trước cùng kết luận BỎ nhưng tỉ lệ rất khác (66/275, 73/274, 127/291) — chính vì đo theo đa số bản Việt thì mẫu đổi là đổi đáp án.
  Áp dụng cho bài này: `tha-ap312:0.3` = `Pabbhāradāyakattheraapadāna` — Pāli KHÔNG có số ⇒ **BỎ**, không thêm số vào bản Việt. Số thứ tự nằm ở khoá đóng `:7.1` (`dasamaṁ` → thứ mười), và `:8.1` `ekatiṁsatimo` xác nhận phẩm này là phẩm thứ ba mươi mối. Cùng luật áp cho tha-ap309. Với `tha-ap321:0.3` = `9 Kandalipupphiyattheraapadāna` thì Pāli CÓ số nên GIỮ `9.` — bỏ là mất chữ có trong Pāli.

  TẦNG THAM KHẢO — 0, đo từ `source/upstream-manifest.json` chứ không suy từ tên thư mục: `english-sujato` 4291 tệp; dưới `sutta/kn/` chỉ có 9 sub-collection (cp dhp iti ja kp snp thag thig ud), không có `tha-ap`. Trong cả tầng Anh chỉ có một tệp `tha-ap` là `name/sutta/tha-ap-name_translation-en-sujato.json`, và trong 619 mục chỉ 56 mục có chữ. `vietnamese-current` = 26 tệp, toàn bộ Pháp Cú. Lớp lấp `english-project` không có. ⇒ `draft`, `triangulation` 7.5.
  CỔNG COVERAGE ĐO ĐƯỢC (khác hẳn không đo được): mẫu số tha-ap309 = 1, tha-ap312 = 1, tha-ap321 = 2 khoá Pāli ≥ 40 ký tự sau khi loại block `:0`; English = 0/0/0 ⇒ 0%, 0%, 0%, dưới ngưỡng 0.8. Cả ba bài đều là cổng đo được và báo không đạt.

  TIỀN LỆ ĐẾM ĐƯỢC (đối chiếu trên tầng `vietnamese-project` đã có):
