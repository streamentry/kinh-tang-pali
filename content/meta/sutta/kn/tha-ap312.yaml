  ĐẠI TỪ NGÔI THỨ NHẤT — đo trên 424 bài `tha-ap` đã dịch: 219 bài dùng CẢ `ta` lẫn `tôi`, 212 bài chỉ dùng `tôi`, 0 bài nào chỉ dùng `ta`; nhưng `tôi` ấy chỉ xuất hiện trong khung cố định `Tôi nghe như vầy:` (424/424). Vì vậy cả ba bài dùng `ta` cho phần kể chuyện và giữ nguyên khung `Tôi nghe như vầy:`.
  LỆCH TIỀN LỆ CỐ Ý: `tha-ap312:2.1` `Taṁ me buddho viyākāsi,` có đúng **1** tiền lệ và nó dùng `tôi` (`Vị ấy đã giảng giải cho tôi,`). Vẫn dịch `Vị ấy đã giảng giải cho ta,` để giữ nhất quán với 1.2, 1.3 và 3.4 trong chính bài này; một tiền lệ đơn lẻ không đủ để phá vỡ tính nhất quán trong bài.

  NGOẠI LỆ CỐ Ý CHO CHỐT `lọt_pāli` — chỉ **2** tên cho cả lát, đo lại trên tập từ của tầng Việt đã **loại trừ** ba tệp của lát (4356 từ, 0 tệp đọc hỏng): `Ārāmadāyaka` (tha-ap309:0.3) và `Pabbhāradāyaka` (tha-ap312:0.3). Cả hai là chữ tố của chính Pāli khoá đó. 15 tên còn lại không cần khai vì đã có sẵn trong tầng. Dạng `Pabbhāradāyako` ở `:6.1` không cần khai vì có mặt trong Pāli của chính khoá đó (đúng cơ chế `pāli_riêng`). Sau khi thay 2 tên bằng chỗ giữ, `kiểm` chạy lại PASS cho cả ba bài ⇒ không còn lỗi nào khác. `_hvi.py` KHÔNG bị sửa.

  BẤT ĐỊNH GHI Ở ĐÂY, KHÔNG GIẢI THÍCH TRONG THÂN KINH:
  · `tha-ap312:3.1` `Nibbattissati so yūpo,` → `Sẽ sinh khởi cột tế lễ ấy,` theo tiền lệ duy nhất có trong kho: `yassa yūpo suvaṇṇayo` (ja264:1.2 và thag2.22:1.2) được tầng dịch là `người có cột tế lễ bằng vàng ròng;`. `yūpo` còn có nghĩa đống/cụi (đối chiếu `dhajo yūpo ca pāṇinaṁ`, bv1:24.2 và tha-ap3:80.2), nên vật được sinh khởi ở đây có thể là cột tế lễ, đống tài sản hay đống công đức; Pāli đã ghim không phân xử được, và `Nibbattissati` chỉ xuất hiện 3 lần trong toàn bộ Pāli root nên cũng không có bản song song.
  · `tha-ap312:1.3` `Ghaṭakañca upaṭṭhāsiṁ,` → `và ta đã hầu hạ một bình,`. `ghaṭaka` nghĩa chữ nghĩa là bình/ấm; sữa là suy ra từ bối cảnh dâng cúng, không có trong Pāli khoá này, nên không viết vào thân kinh. Dạng `một` cho danh từ số ít trần bám theo `susuddho nāma khattiyo` → `có vị quân tộc tên là Susuddha;`.
  · `tha-ap312:2.3–2.4` `Sahassakaṇḍo satabheṇḍu, / dhajālu haritāmayo.` dịch là một mệnh đề tranh luận của Đức Phật (`Vị ấy đã giảng giải cho ta, / bậc Đại Mâu-ni ưa nhìn thấy: ngàn bức vách, trăm lá hiệu đều làm bằng vàng xanh.`), nên dấu hai chấm đặt ở 2.2 thay cho dấu chấm phẩy của Pāli; `kaṇḍa` và `bheṇḍu` không có tiền lệ nào cho cùng Pāli nên dịch theo nghĩa chữ nghĩa.
  · `tha-ap312:10.1–10.4` là uddāna liệt kê tên tắt của các vị trong phẩm, giữ nguyên dạng Pāli không dịch, theo đúng thói quen của uddāna trong tầng (tha-ap102:9.1–9.4, tha-ap152:10.1–10.4, tha-ap292:11.1–11.4). Cần lưu ý là uddāna chỉ liệt kê 8 tên cho 10 bài trong phẩm, và `Kesara`, `Gandhamanna` không khớp trực tiếp tên bài (`tha-ap303` Padumakesariya, `tha-ap304` Sabbagandhiya); đây là đặc điểm của bản in, ta dịch đúng những gì Pāli ghi.
  · `tha-ap312:10.6` `ekapaññāsa kittitā.` → `năm mươi mối đã được tuyên ngợ.` Đối chiếu tổng số khoá Pāli của phẩm Padumakesaravagga (tha-ap303..tha-ap312) là 580 nửa câu ≈ 145 câu kệ, **không** bằng 51 — ta dịch con số Pāli đang ghi chứ không sửa nó.

  LỖI BẢN NHÁP BẮT ĐƯỢC TRONG REVIEW ĐỐI KHÁNG (ba khoá ở bài này, đã sửa trong `_tvd_n1.py` và ghi lại đĩa):
  1. `:2.3` bản nháp dịch `Sahassakaṇḍo satabheṇḍu` thành `với ngàn bức vách, trăm lá hiệu;` — thêm từ nối `với` trong khi Pāli là danh từ chủ ngữ, làm đổi cả quan hệ cú pháp của câu tranh luận.
  2. `:2.4` bản nháp dịch `dhajālu` thành `cờ hiệu` trong khi `:2.3` đã có `lá hiệu` — lặp từ trong hai khoá liền; và không giữ được số nhiều của Pāli.
  3. `:2.1` bản nháp dùng `tôi` trong khi 1.2, 1.3, 3.4 dùng `ta` — lộn xộn đại từ; xử lý theo số đếm ở trên và nêu lý do lệch tiền lệ.

  CỔNG KỸ THUẬT CHƯA CHẠY — BRIEF cấm `npm run validate|test|build|check`, nên `technical_integrity` đặt **9.6** chứ không phải 10. Trong lát chỉ xác minh được: 96/96 khoá đủ và không orphan (`set(khoá Việt) == set(khoá Pāli)` cho cả ba bài), không khoá rỗng, mọi giá trị NFC, không khoá nào trùng nguyên văn Pāli, `…pe…` khớp từng khoá với quy tắc một dấu lược, ngoặc kép cân trên cả bài, và `kiểm` của chính tầng Việt PASS cho cả ba bài. Bốn lệnh còn lại để coordinator chạy trước khi coi tiêu chí 10 là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Giải quyết draft 2026-10-12: kiểm toán độc lập lại bài này, đọc đối kháng từng khoá với Pāli root; lượt chấm này THAY THẾ bảng điểm 2026-10-05 (điểm cũ 9,22 là quá cao so với số lỗi nghĩa tìm thấy).
  LỖI NGHĨA THẬT, đã sửa (9 trên 32 khoá có lỗi nghĩa hoặc số; 15 khoá đổi chữ gồm cả chỉnh văn):
  · `:1.1` `Piyadassino bhagavato` là sở hữu cách (của Đức Thế Tôn Piyadassī), không phải "Lên Đức Thế Tôn…". Sửa: `Của Đức Thế Tôn Piyadassī,`.
  · `:1.2` và `:3.3` `pabbhāro`/`Pabbhāradānaṁ` bị dịch "lối sân (quét)" — không có căn cứ trong Pāli. `pabbhāra` là hang đá, mái đá nhô ra; đo ở tầng: tha-ap21:1.1 `Pabbhāraṁ sodhayantassa` → "quét dọn hang đá", tha-ap19:1.3 `Pabbhāramhi` → "trong hang đá", cp15:2.1 `Pabbhāre giridugge` → "Trong hang đá". Tên bài `Pabbhāradāyaka` (người dâng hang đá) cũng chỉ hợp nghĩa này. Sửa: `hang đá đã được ta dọn sạch;` và `Sau khi dâng cúng hang đá,`.
  · `:1.3` `Ghaṭakañca upaṭṭhāsiṁ` bị dịch "hầu hạ một bình" (vô nghĩa). `upaṭṭhāsiṁ` mang tân ngữ vật là "đã dâng/cung cấp"; đối chiếu tha-ap233:1.3 `Udakañca upaṭṭhāsiṁ` → "dâng nước phục vụ". Sửa: `và ta đã dâng một cái bình,`; `ghaṭaka` giữ nghĩa chữ là bình, không thêm "nước" hay "sữa" vì Pāli không nói.
  · `:1.4` `paribhogāya tādino`: `tādino` là sở hữu cách, đo 129 khoá trong tầng, đa số dịch "bậc/vị bất động (như vậy)". Sửa: `để bậc bất động ấy sử dụng.`
  · `:2.1`–`:2.2` bản cũ "Vị ấy đã giảng giải cho ta, bậc Đại Mâu-ni ưa nhìn thấy" bỏ mất `taṁ` (điều ấy) và biến tên Phật `Piyadassī` thành tính từ "ưa nhìn thấy". Sửa theo mẫu tha-ap20:5.1 `Taṁ me buddho viyākāsi` → "Đức Phật đã giảng giải điều ấy cho tôi" (đại từ `ta` theo 1.2–3.4 của bài này): `Đức Phật đã giảng giải điều ấy cho ta,` / `Piyadassī, bậc Đại Mâu-ni:` (tha-ap397:2.2, bv15:19.2 cùng cách). Việc thay "Vị ấy" ở :2.1 làm cho lệch tiền lệ đơn lẻ (tha-ap15, tha-ap70 dùng "Vị ấy") nhưng đúng Pāli hơn vì `buddho` là chủ ngữ tường minh.
  · `:2.3`–`:3.1`: `Sahassakaṇḍo satabheṇḍu, dhajālu haritāmayo` là các định ngữ của `so yūpo` ở :3.1 (cột tế lễ ấy), không phải một danh sách riêng "được giảng giải". Đối chiếu bản Anh Sujato của thag2.22:2.1–2.2 (cùng công thức): "a thousand panels and a hundred ball-caps, all adorned with banners, and made of sun gold". `dhajālu` (có cờ/đầy cờ hiệu) bị dịch "lá hiệu" ở :2.3 là lặp và sai; `-ālu` là hậu tố "đầy". Sửa: `Có nghìn tấm vách, trăm quả cầu, / đầy cờ hiệu, làm bằng vàng xanh, / cột tế lễ ấy sẽ sinh ra,`. `kaṇḍa` giữ "tấm vách" theo tiền lệ 5/5 cho bài `Sahassakaṇḍo…`; `bheṇḍu` (cùng gốc `geṇḍu`, quả cầu) đổi từ "ngọn tháp" (5 khoá, bản chép nhau không có căn cứ chữ) sang "quả cầu", gần ja264:2.1 "quả bóng tròn" và "ball-caps" của Sujato. `haritāmaya` giữ "vàng xanh" theo 7/7 tiền lệ.
  · `:3.2` `ratanañca anappakaṁ` bị dịch "không gì sánh bằng" — `anappaka` là "không ít". Đối chiếu tha-ap1:58.2 `Ratanañca anappakaṁ` → "và châu báu không ít;". Sửa: `và châu báu không ít;`.
  · `:4.1` "Từ ba mươi hai kiếp trước" mơ hồ về điểm đếm; `Ito … kappamhi` = "cách đây … kiếp". Sửa: `Cách đây ba mươi hai kiếp,` (tha-ap41:5.1 `Ito ekādase kappe` → "Cách đây mười một kiếp về trước").
  · `:4.2` `khattiya` → "Sát-đế-lợi": đo `nāma khattiyo` trong kn: tha-ap 22 khoá "Sát-đế-lợi", 2 khoá "quân tộc"; toàn kn khác 31/33 "Sát-đế-lợi". Mục "TIỀN LỆ ĐẾM ĐƯỢC" ở trên ghi "quân tộc" là nhầm, THAY THẾ bằng: `có vị Sát-đế-lợi tên là Susuddha;`.
  · SỐ: `:8.1` `ekatiṁsatimo` = 31 (30 `tiṁsa` + 1), `:10.6` `ekapaññāsa` = 51 (50 + 1). Bản cũ viết "ba mươi mối" / "năm mươi mối" — chữ "mối" sai (toàn kn: "mươi mốt" 267 khoá, "mươi mối" 3 khoá, cả 3 đều ở bài này); mục tiền lệ cũ viết nhầm theo. Sửa: `thứ ba mươi mốt`, `năm mươi mối` → `năm mươi mốt đã được tuyên nói.` (`kittitā` → "tuyên nói" theo ne3:1.1; bỏ "tuyên ngợ" ở thân kệ vì không có nghĩa tiếng Việt, tên bài vẫn theo quy ước tầng). Các số khác đã kiểm lại: `bāttiṁsa` = 32 (30 + 2), `sahassa` nghìn, `sata` trăm, `dasamaṁ` thứ mười; không có số nào khác.
