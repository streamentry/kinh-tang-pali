  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (bản dịch 2008, theo ấn bản Buddha Jayanthi). 3 khoá bất đồng nghĩa → sửa 1 (3.1 `yūpa`: “cột tế lễ ấy” → “cột trụ ấy”; cùng công thức `Sahassakaṇḍo satabheṇḍu dhajālu haritāmayo` đi với `byamhaṁ` (thiên cung) ở tha-ap339:7.3–8.4 và với `Yūpo tattha subho āsi` kèm hào quang ở tha-ap523:6.1–7.2, tha-ap350:7.1, hai bài này tầng dịch là “cột trụ”; đây là quả báo rực sáng của việc dâng hang đá chứ không phải bối cảnh hiến tế, còn tiền lệ “cột tế lễ” ở ja264:1.2 và thag2.22:1.2 là bối cảnh hiến tế, nên chữ “tế lễ” thêm nghĩa mà Pāli ở đây không nói), giữ 0, bất định 2 (1.2 và 3.3 `pabbhāra`: bản nguyên bài “sườn núi”, bản này “hang đá”; tầng dùng cả hai, “sườn núi” ở thi-ap28:1.3 và 8.3, “hang đá”/“hang núi” ở tha-ap19, tha-ap21, cp15:2.1, thag9.1, thag10.2; Pāli không phân xử nên giữ “hang đá” cùng tên bài). Bản nguyên bài còn đọc `yūpa` là “tòa lâu đài”; cách đọc đó có chỗ dựa ở tha-ap339 nhưng Pāli ở đây không có chữ nào chỉ lâu đài, nên chỉ ghi là bất định, không đưa vào thân kinh (mục bất định 1 ở trên về `yūpa` nay đọc theo chữ “cột trụ”, bác bỏ riêng chữ “tế lễ”). Đã khớp với bản nguyên bài: ba mươi hai kiếp (4.1), năm mươi mốt bài kệ (10.6), bảy báu (4.3), `bheṇḍu` “quả cầu” (2.3), nghìn/trăm (2.3), cõi trời một kiếp (3.4). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

