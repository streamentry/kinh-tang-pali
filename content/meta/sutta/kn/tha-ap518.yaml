notes: |-
  Review đối kháng: đọc p44.txt, đọc 38 khoá, tra tiền lệ trên toàn tầng kn. Ba khoá sửa, trong đó một khoá là lỗi nghĩa nặng và một khoá là lỗi danh từ.
  LỖI ĐÃ SỬA. (1) :4.1 Chattiṃsakkhattuṃ devindo bị dịch thành Sáu lần, chúa trời ta — sai số. Tôi đếm trong toàn bộ Pāli đã ghim: Chattiṃsadevarāj là tên một vua, còn Chattiṃsati và Chattiṃsatimhi là dạng chỉ nơi chốn trong cách thứ ba mươi, nên Chattiṃsa là ba mươi, không phải sáu; và cùng công thức ấy còn có Tettiṃsakkhattuṃ là ba mươi ba lần ở tha-ap336:9.3 và tha-ap421:6.3, cùng với Dasakkhattuṃ là mười lần ngay ở :4.3 của bài này. Tôi sửa thành Ba mươi lần, chúa trời ta. (2) :6.4 sakyaputtassa sāsane bị dịch thành trong giáo pháp của bậc Thiên tử — đổi hẳn chủ thể: sakyaputta là người con nhà Thích-ca, tức Đức Phật, còn Thiên tử là cách dịch của devaputta, một vị trời. Đây là lỗi làm sai đối tượng theo đúng nghĩa từ điển. Tôi sửa thành trong giáo pháp của Đức Phật, và ghi ở đây rằng cách giữ thêm Sakyaputta như Thích-ca Mâu-ni cũng được nhưng dài hơn cần thiết. (3) :1.4 sayambhuṃ aparājitaṃ dịch là bậc Tự Hữu trong khi :2.4 cùng từ sayambhuṃ lại dịch là Đấng Tự Tại, tức bài tự mâu thuẫn. Tự Hữu vốn là svabhāva, còn sayambhu là tự tại; tôi sửa :1.4 thành bậc Tự Tại cho khớp với hai chỗ còn lại. Tôi biết tha-ap367:1.4 có đúng Pāli này và cũng dịch là Tự Hữu, nên đây là đánh đổi giữa nhất quán trong bài và theo một tệp khác; tôi chọn nhất quán trong bài và để người điều phối gộp cả phạm vi rộng nếu muốn.
  BẤT ĐỊNH CÒN MỞ. Ở :5.4 sayambhumhi aho mama tôi dịch là với bậc Tự Tại, nó là của ta, theo cách hiểu sayambhu là Đấng Tự Tại; nhưng sayambhu cũng là tên một loài chư thiên trong cõi Tāvatiṃsa, mà câu :3.4 vừa nói người kể đã đến cõi Tāvatiṃsa, nên đọc thành cõi Tự Tại cũng có lý và thành mạch hơn. Tôi không đổi vì cả hai đều đứng vững và tôi không có tầng Anh trong store; đây là chỗ người biên tập nên phán xử.
  TIỀN LỄ ĐÃ TRA. tāvatiṃsa = cõi trời Ba mươi ba, devarajja = vương quyền nơi chư thiên, pabbajiṃ anagāriyaṃ = đã xuất gia sống không nhà, Candabhāgā giữ nguyên tên sông, ajjuna ở :2.3 tôi bỏ vì nghĩa tính từ của nó trong câu này không chắc, nên dịch đóa hoa. Phẩm Phaladāyaka cho Phaladāyakavagga là đa số 4 tệp trong phẩm.
  NHÓM KỆ 7.x, 8.x, 9.x TRÙNG NGUYÊN VĂN Ở CẢ SÁU BÀI THA-AP TRONG LÁT. Tôi dựng chỉ mục Pāli → Việt trên toàn bộ tầng kn đã có (1.675 tệp, loại tám uid của lát) rồi đối chiếu: trong lát không còn một Pāli chung nào mà sáu bài dịch khác nhau, và mọi Pāli chung với bài ngoài lát đều trùng khớp hoặc chỉ lệch dấu câu. Bốn câu kệ dùng chung giữ nguyên cách đã có trong kho: Kilesā jhāpitā mayhaṁ = Các phiền não của ta đã được thiêu rụi; viharāmi anāsavo = ta sống không còn lậu hoặc; Svāgataṁ vata me āsi = Thật lành thay sự đến của ta; Paṭisambhidā catasso = Bốn vô ngại giải; kataṁ buddhassa sāsanaṁ = đã làm tròn lời dạy của Đức Phật.
  CHÚ Ý VỀ Svāgataṁ vata me āsi — TÔI CỐ Ý KHÔNG SỬA. Đếm được 54 tệp trong kho dịch câu này thành Thật lành thay sự đến của ta (đa số áp đảo; nhóm kế cạnh là Thật là đón mừng thù thắng thay cho tôi 21 tệp). Nghe thì có vẻ là đọc nhầm: svāgataṃ ở đây là tiếng than thở tự vệ, không phải danh từ sự đến. Nhưng sửa sáu khoá trong lát này sẽ tạo ra thứ tự N+1, và BRIEF_VI3 §6 nói rõ phải dịch nhất quán theo bản Việt đã có. Tôi giữ nguyên và giao việc này lại cho người điều phối quyết định thay cả kho; nếu đổi thì phải đổi cả ~54 tệp, không được sửa lẻ.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Những gì tôi tự kiểm được và đều sạch: JSON hợp lệ, đúng 38 khoá mỗi bài, tập khoá khớp tuyệt đối với content/catalog/sutta/kn.json và với all trong vc/c44.json, không orphan, không rỗng, không còn stub dạng (…), toàn bộ NFC, số dấu lược không bao giờ vượt số dấu lược của Pāli và mỗi …pe… của Pāli còn đúng một dấu …, YAML parse sạch bằng thư viện yaml của kho.
