notes: |-
  ĐỌC HẾT p44.txt trước khi viết. 0.1 Therāpadāna giữ nguyên Pāli (291/300 khoá :0.1 của tầng tha-ap). 0.2 Phaladāyakavagga: đo trong chính phẩm được Phẩm Phaladāyaka 4 tệp, Phẩm Cúng Dường Trái Cây 3 tệp, Phẩm Quả Dâng Cúng 1 tệp; tôi theo đa số Phẩm Phaladāyaka, lưu ý là hai bài kề tha-ap517 và tha-ap519 đang lệch hai hướng nên người điều phối có thể muốn thống nhất cả phẩm. 11.1 thứ sáu (35/35 tệp).
  NHÓM KỆ 7.x, 8.x, 9.x trùng nguyên văn ở cả sáu bài tha-ap của lát này: một bản Việt cho mỗi Pāli, chọn theo đa số đo được (Các phiền não của ta đã được thiêu rụi 56/85 · ta sống không còn lậu hoặc 56/84 · Thật lành thay sự đến của ta 54/82 · đã làm tròn lời dạy của Đức Phật 60/82 · Bốn vô ngại giải 300/300 · đã làm tròn lời dạy của Đức Phật”. 270/299 · …pe… giữ đúng một dấu lược).
  CÁC KỆ ĐÃ TRA. Candabhāgānadītīre = Bên bờ sông Candabhāgā (8/9 tệp) · Addasaṁ virajaṁ buddhaṁ = Tôi đã thấy Đức Phật ly trần (đa số 3/26 khoá; đây là bản dịch đã có, tôi dùng lại) · sayambhuṁ = bậc Tự Hữu (tha-ap367:1.4, nguyên văn) · Pasannacitto sumano = Với tâm tịnh tín hân hoan (30/49 tệp) · vedajāto = tràn ngập nỗi xúc động (tha-ap317:3.2) · sayambhuṁ abhipūjayiṁ = ta đã cúng dường lên Đấng Tự Tại (tha-ap479:1.4, nguyên văn) · Tena kammena sukatena = Nhờ nghiệp lành khéo làm ấy (2/3 tệp) · cetanāpaṇidhīhi ca = cùng với tâm nguyện và chí hướng (4/7 tệp) · tāvatiṁsamagacchahaṁ = ta đã đến cõi trời Ba mươi ba (2/3 tệp) · Padesarajjaṁ vipulaṁ, gaṇanāto asaṅkhiyaṁ = Vương quốc rộng lớn ấy / đếm không hết, vô tận, trùng nguyên văn tha-ap347:4.3-4.4, tôi dùng lại nguyên văn · devarajja = vương quyền nơi chư thiên (tha-ap347:3.4) · pabbajiṁ anagāriyaṁ = đã xuất gia, sống không nhà · sāsane = giáo pháp (9 tệp). 0 tiền lệ: Chattiṁsakkhattuṁ, mahārajjamakārayiṁ, Sukhette vappitaṁ bījaṁ, sayambhumhi, Kusalaṁ vijjate, Pūjāraho ahaṁ ajja, sakyaputta (tôi dịch bậc Thiên tử), ajjuna (bỏ, dịch đóa hoa), mahāyaso (cao lớn danh tiếng).
  BẤT ĐỊNH ĐÃ GHI NHẬN. (1) 5.4 sayambhumhi aho mama tôi dịch là với bậc Tự Tại, nó là của ta; chữ hậu tố -mhi của sayambhumhi là cách nói với Đức Phật, tôi giữ bằng mệnh đề với bậc Tự Tại thay vì ép thành danh từ. (2) 2.3 ajjunaṁ pupphaṁ tôi dịch là đóa hoa, không dịch tính từ ajjuna vì nghĩa của nó trong ngữ cảnh này không chắc. (3) 4.4 mahārajjamakārayiṁ tôi dịch là đã làm ra vương quốc lớn lao để cân với devarajjamakārayiṁ ở 4.2 là vương quyền nơi chư thiên. (4) 6.3 Pūjāraho ahaṁ ajja tôi dịch Ngày nay ta đáng được cúng dường, giữ ràng tôi đã xuất gia ở 6.2 thì không còn dâng cúng được nữa.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.
