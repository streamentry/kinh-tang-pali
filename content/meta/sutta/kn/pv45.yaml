notes: |-
  TẦNG THAM KHẢO — đo, không đoán (xem `blocking_errors`). Coverage Anh = **0/0 khoá có nội dung**: tất cả
  48 khoá Pāli của pv45 đều dưới 40 ký tự nên mẫu số bằng 0; dù vậy tệp Anh thật sự không tồn tại ⇒ `draft`,
