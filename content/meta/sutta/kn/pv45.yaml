  48 khoá, đủ 48/48, không orphan, không thừa, không rỗng, mọi giá trị NFC. Dấu lược: bài này **không có**
  `…pe…` ở Pāli nên không có dấu lược nào phải giữ, không có chỗ nào bịa dấu lược che chỗ thiếu.
  Nháy kép: 4 cặp `“`/`”` ở Pāli, bản Việt giữ đúng 4 cặp; `:1.1` mở–`:1.4` đóng, `:2.1` mở–`:2.4` đóng,
  `:3.1` mở–`:3.4` đóng, `:4.1` mở–`:11.4` đóng. Chạy lại chốt cho cả sáu bài của lát: **0 cụm Pāli lặp
  trong lát bị dịch khác nhau** (20 cụm lặp, 0 lệch).

  PĀLI TRÙNG NGUYÊN VĂN — dựng chỉ mục toàn tầng bằng script. Trong 48 khoá của pv45 có **9 khoá** trùng Pāli
  ở bài khác; dùng lại **nguyên văn** cả 9: `duggatā yamalokikā;` → *sinh về cõi khổ xa xôi, thuộc cõi của Yama;*
  (pv6:2.2, pv44:2.2) · `Pāpakammaṁ karitvāna,` → *đã tạo nghiệp ác,* (pv6:2.3, pv43:2.3, pv44:2.3) ·
  `“Kiṁ nu kāyena vācāya,` / `manasā dukkaṭaṁ kataṁ;` / `Kissa kammavipākena,` → *Đều ác gì là do thân, do lời
  nói,* / *do ý mà đã làm;* / *Do quả báo của nghiệp nào* (pv6:5.1–5.3, pv22, pv43) ·
  `petalokaṁ ito gatā”ti.` → *… đã từ đây đi sang thế giới của người đã chết”ti.* (pv44:2.4).
  Riêng `Naggā dubbaṇṇarūpāsi` (pv6:1.1) là dạng **khác** (số ít, `-si`) nên `:1.1` dịch theo số nhiều
  `Các ngươi gầy gò, xấu xí,` — dùng đúng chữ của pv6.

  THUẬT NGỮ, đếm được: `Petavatthu` giữ Pāli — 20/20 bài `pv` đã có · `Mahāvagga` → *Đại Phẩm* — 23/23 ·
  khuôn `…petavatthu` → *Chuyện Ngạ Quỷ …* — theo pv2/pv3/pv4/pv6/pv8/pv9/pv40–pv50. `Gaṇapetavatthu`
  **0 tiền lệ** (đo: `grep` cả tầng `kn`) ⇒ tôi đặt *Tụ Họp* cho `gaṇa` (đám đông, tập thể), vì cả bài kể
  một **nhóm** ngạ quỷ (`petāmhā` số nhiều ở `2.1`, `tumhettha` số nhiều ở `1.4`), không phải một ngạ quỷ
  như các bài `pv2`–`pv50` đã dịch. `Santesu deyyadhammesu, dīpaṁ nākamha attano.` (1 tiền lệ, pv50:3.3–3.4)
  → *Ở nơi những bậc lành có phẩm đáng ban tặng, chúng ta không tự mình thắp được ngọn đèn.* — dùng lại đúng
  nghĩa *ngọn đèn* mà pv50 đã có.

  BẤT ĐỊNH (ghi ở đây, không giải thích trong thân kinh):
  (1) `Mayaṁ bhadante petāmhā` (2.1) — `petāmhā` = `petā amha` (chúng tôi là ngạ quỷ) nên `Mayaṁ` buộc phải
      là *chúng tôi*; dạng chính tả này chỉ xuất hiện đúng một lần trong toàn bộ Pāli đã ghim (đo bằng
      `grep` toàn cache, 1/5770 tệp) nên không có song ngữ để đối chiếu. Tôi dịch *Chúng tôi, bạch ngài, là
      ngạ quỷ,* và không ghi chú thêm vào thân kinh.
  (2) `Anāvaṭesu titthesu, vicinimhaddhamāsakaṁ;` (4.1–4.2) — `vicinimha` = chó hoang, `addhamāsaka` = kẻ
      cho nửa sức/keo kiệt. Tôi đọc `vicinimha addhamāsaka` là **từ xưng miệt thị** đối với loài người
      (giọng chửi đã mở ở `1.1–1.4`), dịch *bọn chó hoang, bọn tiết kiệm;*. Cách đọc thứ hai là chủ ngữ:
      *chúng ta là kẻ chó hoang, kẻ tiết kiệm*. Cả hai đều giữ `vicinimha` và `addhamāsaka`; tôi chọn cách
      đọc thứ nhất vì `2.1` đã xác định người nói là nhóm ngạ quỷ đang mắng người nghe.
  (3) `Te hi nūna ito gantvā … Vadaññū sīlasampannā, kāhāma kusalaṁ bahun` (11.1–11.4) — động từ chính là
      `kāhāma` (ngôi thứ nhất số nhiều) nên `te` **không** làm chủ ngữ; tôi dịch *Chắc chắn những vị ấy từ
      đây đi sang, / được tái sinh làm thân người; / dù bị chê bai, dù giới hạnh tròn đầy, / chúng tôi sẽ
      làm nhiều điều thiện* — giữ đúng sự chuyển ngôi mà Pāli đang làm, không thêm chủ thể nào.
  (4) `pūtilohitako pati.` không có tiền lệ; xem pv7:8.4.

  **MỘT CỤM PĀLI LẶP TRONG CHÍNH BÀI ĐƯỢC DỊCH KHÁC — CÓ CHỦ Ý.** `petalokaṁ ito gatā”ti.` xuất hiện
  ở `:2.4` và `:3.4`. Ở `:2.4` người nói (nhóm ngạ quỷ) nói về chính mình nên *chúng tôi … đã từ đây đi
  sang*; ở `:3.4` cùng câu ấy nằm trong câu **hỏi** của ngạ quỷ với người nghe (`3.1–3.3` là câu hỏi) nên
  phải là *mà các ngươi …*. Nếu dùng lại nguyên văn thì câu hỏi của ngạ quỷ sẽ tự nói *chúng tôi*, tức là
  lỗi nghĩa. Luật "Pāli trùng thì dùng lại nguyên văn" ở đây bị chính ngữ pháp buộc phải nới; tôi giữ
  khác nhau **đúng ở đại từ chủ thể** và ghi lại ở đây để người biên tập phán xử. (Cùng loại: pv43.yaml đã
  ghi trường hợp `petomhi`/`petīmhi` là chỗ *không* nên cố làm khác.)

  CỔNG KỸ THUẬT CHƯA CHẠY — theo chỉ đạo, tôi **không** chạy `npm run validate|test|check|build`, nên
  `technical_integrity` chấm **9.6 chứ không phải 10.0**, và tôi **không** tuyên bố technical gate pass.
  Tôi tự quét TOÀN BỘ 48 khoá từ đĩa (không dùng ngưỡng 40 ký tự của `_hvi.py`, vì ngưỡng đó không chạy ở
  bài kệ ngắn và làm danh sách kiểm rỗng): đủ khoá, đúng exact segment ID, thứ tự khoá y hệt Pāli, không
  orphan, không rỗng, NFC, dấu lược khớp từng khoá, không `(…)` đứng một mình, nháy kép cân trên cả bài và
  không đóng trước khi mở, không Pāli lọt vào bản Việt. Script ghi tệp hai lần: sha256 không đổi một byte.
  Bốn lệnh để coordinator chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  LƯỢT CẢI THIỆN 2026-10-11 (kiểm toán độc lập; đọc đối kháng từng khoá Pāli↔Việt; THAY THẾ các mục cũ nêu dưới đây).
  Mục cũ bị thay thế: "PĀLI TRÙNG NGUYÊN VĂN" (chín khoá "dùng lại nguyên văn" từ pv6/pv44/pv43/pv22 mang theo chính lỗi của các bài đó:
  `duggatā yamalokikā` không phải "sinh về cõi khổ xa xôi", `petalokaṁ` là "cõi ngạ quỷ" chứ không phải "thế giới của người đã chết");
  BẤT ĐỊNH (2) về `vicinimha` = "chó hoang" (SAI: `vicinimha` là động từ aorist ngôi 1 số nhiều của `vicināti`, "chúng tôi đã đi tìm",
  `addhamāsaka` là "nửa đồng māsaka"; bản dịch cũ trong JSON thực ra đã không theo cách đọc "chó hoang" nên ghi chú cũ tự mâu thuẫn);
  BẤT ĐỊNH (3) "te không làm chủ ngữ" (xem lại bên dưới); đoạn "MỘT CỤM PĀLI LẶP … ĐƯỢC DỊCH KHÁC" (nay 2.4 và 3.4 dịch GIỐNG nhau, chỉ khác dấu cuối câu).
  Điểm cũ 9.1 là quá cao: bản trước sai nghĩa ở khoảng 30/48 khoá.

  Số khoá đổi: 38/48 (gồm vài khoá chỉ đổi chữ hoa/dấu cho khớp câu). Lỗi nghĩa thật, theo loại:
  (a) bịa nội dung không có trong Pāli: 1.2 "mùi thối khinh khỉnh" (Pāli `dhamanisanthatā` = gân nổi chằng chịt), 1.3 "mụn mủ phủ kín" (Pāli
      `upphāsulikā` = sườn nhô ra), 11.3 "dù bị chê bai" (Pāli `vadaññū` = hào phóng), 9.3 "bôi đầu" (Pāli `ghaṭṭema` = đập), 10.1/6.3 "chúng tôi
      đã tới nơi này" (Pāli `arahāma` = đáng phải chịu), 7.2 "mệt mỏi, kiệt sức vì đi lại" (Pāli `chātā āhāragedhino` = đói, thèm khát thức ăn),
      5.1/5.3 "mong có chỗ lội qua sông/bóng mát" (Pāli `upema` = đến, `tasitā` = khát nước) và 5.2/5.4 "quay lưng" (Pāli: sông trở nên trống cạn,
      ánh nắng xoay chuyển; đối chiếu bài song song pv31:5);
  (b) bỏ sót từ: 1.1 bỏ `naggā` (trần truồng);
  (c) đọc sai chủ thể/ngữ pháp: 1.4 "sao các ngươi còn đứng ở đây, hỡi những người đàn ông" (Pāli `ke nu tumhettha mārisā` = các vị là ai ở đây,
      hỡi các bạn hiền; `mārisā` là hô cách, không phải "người đàn ông"), 8.1 `bhantā` (giữa `chātā pamucchitā bhantā` = đói lả, ngất đi, choáng váng)
      bị đọc thành hô cách `bhante` "bạch ngài" (Pāli không có "bhante" ở khoá này), 9.1 "Những vị kia cũng nằm bừa" → "Và những kẻ ấy ngã ngay tại đó",
      11.x bỏ hẳn `vadaññū` và bịa "dù bị chê bai", 6.2 "cứ thổi vào ta" (đổi ngôi sang "ta" trong lời của nhóm "chúng tôi");
  (d) từ vựng sai: 2.2 "sinh về cõi khổ xa xôi" (Pāli `duggatā` = khốn khổ), 2.4/3.4 "thế giới của người đã chết" (Pāli `petalokaṁ` = cõi ngạ quỷ), 7.1 "biết bao"
      thêm nghĩa;
  (e) bất nhất đại từ người nói: nhóm ngạ quỷ nói với ngài, đã mở bằng "Chúng tôi" ở 2.1 nhưng chuyển sang "chúng ta" ở 4.2, 4.4, 7.3, 10.4 → thống nhất
      "chúng tôi" (lời nói với vị ngài, không bao gồm người nghe);
  (f) bất nhất trong cùng bài: Pāli 4.3–4.4 y hệt 10.3–10.4 nhưng 4.4 dịch "hòn đảo che chở" còn 10.4 dịch "ngọn đèn"; nay cả hai là "hòn đảo", không thêm
      "che chở". Tương tự 2.4/3.4 nay giống nhau (không còn bám đại từ "chúng tôi"/"các ngươi").
  Điểm tiêu chí đổi: semantic_fidelity 9.2 → 9.0, terminology 9.1 → 9.0, vietnamese_clarity 9.1 → 8.8; các tiêu chí khác giữ (source_provenance 9.5,
  grammar_logic 9.0, segment_alignment 10.0, triangulation 7.5 vì không có tầng Anh độc lập, han_viet_balance 9.3, ambiguity_integrity 8.7, technical_integrity
  9.6). Đây là điểm cho bản đã sửa, trừ đi bất định còn lại, không phải điểm "tăng" so với bản trước.
  Tiền lệ đo bằng số đếm: `dīpaṁ nākamha attano` có hai cách dịch trong tầng, "hòn đảo" ở pv15, pv19, pv26, pv31 (4 bài, cùng cấu trúc "tạo cho mình hòn đảo") và
  "ngọn đèn" ở pv50, ja314 (2 bài); chọn "hòn đảo" (đa số, và ngữ cảnh bến nước/dòng sông ở 4.1 và 5.1 khớp nghĩa nơi nương tựa); pv50/ja314 không thuộc lát này. `vadaññū` =
  "hào phóng" (pv39, vv52). `dhamanisanthatā` = "gân nổi chằng chịt", `upphāsulike` = "sườn nhô ra" (pv13, pv19). `viciniṁ aḍḍhamāsakaṁ` ở bài song song pv31:4.2 =
  "đã đi tìm nửa đồng māsaka" (đối chiếu để đọc `vicinimha` thành động từ). Bài song song pv31:5–6 xác nhận cách đọc 5.x–6.x. `kisikā` đổi "ốm yếu" → "gầy mòn" vì `kisa`
  là gầy chứ không phải yếu (pv13, pv19 dùng "ốm yếu": không đổi, ngoài lát).
  BẤT ĐỊNH CÒN LẠI (không phân xử được, không giải thích trong thân kinh):
  (1) `paṭikirāma` (8.3) xuất hiện đúng một lần trong toàn bộ Pāli đã ghim, không có bài song song; dịch "vương vãi" theo nghĩa gốc `paṭikirati` (rải ra), có thể là "nằm vật vã". `paṭisumbhitā`
      (8.2/9.2) dịch "bị quật xuống đất" (pp. của `paṭisumbhati`, "bị ném xuống"); pv26:7.4/8.2 có `bhūmiyaṁ paṭisumbhitā` dịch "nằm dài trên mặt đất" — ngoài lát, không đổi.
  (2) `te` ở 9.1 và 11.1 là đại từ ngôi 3 nhưng động từ chính (`ghaṭṭema`, `kāhāma`) và các phân từ đi cùng ở ngôi 1 số nhiều; Pāli đang dùng `te` như đồng vị với "chúng tôi" ("những kẻ
      như thế"). Bản Việt giữ "những kẻ ấy" nguyên như Pāli (không tự biến thành "chúng tôi" trong khoá chứa `te`), nên có chỗ đọc hơi chuyển ngôi; người biên tập có thể chọn nới.
  (3) `dīpa` có thể là "hòn đảo" (nơi nương tựa, như Dhp 25) hoặc "ngọn đèn" (pv50/ja314 chọn); xem đo ở trên.
  (4) `Gaṇapetavatthu` → "Chuyện Ngạ Quỷ Tụ Họp": `gaṇa` là nhóm/đoàn; giữ tiêu đề cũ (không đổi `translationTitle`) vì không có tiền lệ khác, nhưng "Nhóm Ngạ Quỷ" sát hơn.
  (5) Lỗi ngoài lát, báo không sửa: pv6:2.2 và pv31:2.2/2.4/3.4/7.4/7.6/11.2/11.4/12.4/12.6 mang "sinh về cõi khổ xa xôi" và "thế giới của người đã chết"; pv31:2.1 dịch `petī` là "ma"
      (nên là ngạ quỷ nữ); pv44 và pv43 có cùng công thức nên cần kiểm tra; pv50:3.4/4.3 ("ngọn đèn", "tự mình quở trách" cho `vadaññū`).
  Blocker còn lại: không có tầng tham khảo tiếng Anh (giữ nguyên, là sự thật về upstream); `triangulation` 7.5.
  Kiểm tra đã chạy trên 48 khoá: đủ/đúng tập khoá và thứ tự Pāli (48/48), nháy kép khớp Pāli từng khoá (0 lệch), NFC, không khoá rỗng, không dấu lược nào ở Pāli và Việt (0/0),
  7 cặp Pāli trùng nguyên văn trong bài đều có bản Việt giống nhau (chỉ khác dấu cuối câu/chữ hoa đầu câu), không Pāli lọt sang Việt ngoài `māsaka`, `Yama`, `Petavatthu`.
  Cổng kỹ thuật (`npm run validate`, `npm test`, `npm run check`, `npm run build`) chưa chạy trong lượt này nên `technical_integrity` giữ 9.6.
