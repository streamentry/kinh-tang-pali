notes: |-
  Đủ 8/8 khoá trong all. Netti/Milinda/Petavatthu là bài đầu tiên của các tạng này trong tầng Việt nên mọi thuật ngữ nhóm đều là đặt mới, đã ghi lý do từng chữ.
  paṭiniddesa → Giải Thích; sampāta → Nhóm (nghĩa đen: sự nhóm họp); hāra → phương thức (mode); parikkhāra → trợ duyên (requisite cho tu tập); sammāsaṅkappa → chánh tư duy (tiền lệ toàn tầng); gocara → cảnh giới; rakkhitacitta → có tâm được phòng hộ (phòng hộ có tiền lệ).
  Kệ 2.1 cùng Pāli với ne28:2.1 nên hai bài dùng một cách dịch.
  samatha/vipassanā → chỉ và quán (gọn, giữ distinction; thiền chỉ/thiền quán cũng chỉ có 2 occ lẻ).
