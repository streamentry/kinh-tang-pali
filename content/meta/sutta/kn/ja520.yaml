notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja520_root-pli-ms.json` (168/168 khoá, đúng thứ tự Pāli, không khoá thừa). Bài gồm các bài kệ đối đáp; phần văn xuôi của Jātaka không nằm trong tầng Pāli đã ghim, nên người nói ở từng bài kệ chỉ được suy từ lời xưng hô và mạch của chính các bài kệ.

  - Tầng tham khảo:
    Tầng English của Sujato không có ja520 (Sujato Jātaka chỉ có 83 tệp, không có uid này); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Tôi có tham khảo thêm một bản tóm lược truyện bằng tiếng Anh ngoài tầng đã ghim, chỉ để nhận ra ai nói ở từng bài kệ; đó không phải tầng đã ghim, không được dùng làm bản đối chiếu độc lập, và không câu chữ nào được lấy từ đó. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
  - Coverage English:
    Mẫu số = 0. Không khoá Pāli nào của bài đạt ngưỡng 40 ký tự theo `source/layers.yaml` (bài toàn kệ ngắn, bỏ khối `:0`), nên cổng coverage không đo được gì; điều đó không có nghĩa là không cần ghi nhận gap. Sujato phủ 0/168 khoá, `english-project` 0/168, `vietnamese-current` 0/168.
  - Phân loại & tiêu đề:
    + `0.1` "Jātaka"; `0.2` "Bộ Ba Mươi Bài Kinh" và `0.3` "Phẩm Mong Muốn Gì" dùng lại nguyên văn `ja511`–`ja519`; `0.4` "10. Kinh Gandhatinduka" và `39.1` "Kinh Gandhatinduka, thứ mười." (dasamaṁ = 10, khớp số "10." ở `0.4`) theo khuôn "Kinh <Tên>" / "Kinh <Tên>, thứ n" của `ja519`, `ja513`; tên giữ nguyên dạng phiên âm vì nghĩa của `gandhatinduka` ("cây tinduka" có thêm yếu tố `gandha`) không chắc, khác với `ja517` được dịch nghĩa.
    + `40.1` "Bộ Ba Mươi Bài Kinh đã hoàn tất." theo `ja510:26.1` (Vīsatinipāta) và các nipāta trước; `41.1` "Tóm lược:" (83 khoá trong tầng); `42.1`–`42.4` tóm lược của phẩm, để tên riêng theo `ja510:28`; `43.1` "Phần thứ nhất của Pāḷi Jātaka đã hoàn tất." (`paṭhamo bhāgo`, chưa có tiền lệ trong tầng).
  - Người nói (Pāli không ghi tên; suy từ lời xưng hô và bối cảnh trong bài):
    + `1`–`11`: vị thiên thần của cây (bậc Bồ-tát) nói với vua Brahmadatta xứ Pañcāla ("tâu đại vương", `bharatūsabha`); `12`, `14`–`16`: một người già bị gai đâm; `13`, `18`, `22`, `27`, `32`, `36`: vị bà-la-môn đi cùng vua (vị tư tế), hỏi từng người; `17`, `19`–`20`: một người đàn bà có con gái chưa chồng (`kumārikā`); `21`, `23`–`25`: người cày ruộng; `26`, `28`–`30`: người vắt sữa; `31`, `33`–`34`: các chàng chăn bò; `35`, `37`–`38`: con ếch (`maṇḍūka`, `36.2`); `39`–`43` là phần kết do người biên soạn.
  - Pāli trùng nguyên văn:
    Dò Pāli của 168 khoá với toàn bộ Pāli đã ghim (mọi bộ): 10 khoá có dạng trùng ở bài khác đã có bản Việt (`0.1`, `0.2`, `0.3`, `1.3`, `6.2`, `7.3`, `8.2`, `9.3`, `26.3`, `41.1`). Dùng lại nguyên văn ở 9/10 (`0.1`–`0.3`, `1.3` = `dhp21:3`, `6.2` = `snp2.7:3.2`, `7.3` = `vv52:1.3`/`dhp219:3`, `8.2` = `ja462:7.2`, `9.3` = `ja500:17.3`, `41.1`); khác 1/10: `26.3` (`ja324:4.3` "bị thương đau đớn"; ở đây `pahato` đi cùng `haññatu` ở `26.1` nên dùng "bị đánh"). Với `ja513` chỉ trùng `0.2` và `0.3`; các khoá khác của `ja513` không trùng Pāli với bài này.
    Trong chính bài: 10 nhóm Pāli trùng nguyên văn trên 12 ký tự (điệp khúc `Arakkhitā jānapadā, adhammabalinā hatā` ở `14.3`–`14.4`, `19.3`–`19.4`, `23.3`–`23.4`, `28.3`–`28.4`, `33.3`–`33.4`; điệp khúc `Rattiñhi corā khādanti…` ở `15`, `20`, `24`, `29`, `34`; `hato phālena sāliyo` ở `21.4`, `25.4`; `brahmadattassa rājino` ở `28.2`, `33.2`). Bản Việt giống nhau ở 8 nhóm; 2 nhóm cố ý khác: `21.4`/`25.4` (`25.4` thêm chủ ngữ "con bò" vì ở `25.3` có phân từ `apekkhanto` chen vào), `28.2`/`33.2` (vị ngữ khác: `Gārayho` "đáng chê trách" so với `Aparādho` "có lỗi", nên câu Việt khác).
  - Số Pāli:
    `tiṁsa` (`0.2`) = 30; `dasamaṁ` (`39.1`) = 10, khớp `0.4`; `paṭhamo` (`43.1`) = 1; `pañcāla` là tên xứ, không phải số. Bài không có số đếm nào khác.
  - Thuật ngữ (có đếm trên tầng):
    + `khattiya` → "sát-đế-lợi" (13/37 khoá của ja đã dịch ghi rõ dạng này; còn lại là "vương" 3, "vua" 1, không nêu 20); `mahārāja` → "tâu đại vương" (24/40, "đại vương" 14); `raṭṭha` → "vương quốc" (7; còn "xứ" 17, "quốc độ" 12); `jānapadā` → "dân nông thôn" (theo `ja513:33.1`; `janapada` ở các bài khác là "xứ sở" 5/5); `corā` → "bọn cướp" (còn "trộm cướp" 2, "trộm" 2); `hatthārohā`, `rathikā pattikārakā` → "người cưỡi voi", "kẻ cưỡi xe và kẻ đi bộ" (`ja462:7.2`); `appamāda`/`pamāda` → "không phóng dật"/"phóng dật" (dhp21); `dummantimantinaṁ` → "bàn tính sai lầm" (theo `ja500:17.2` "tính toán kém trí"; đây là một từ khác, `dummedhamantinaṁ`); `upassuti` → "nghe ngóng" (ja508 "kẻ nghe lén", tha-ap450 "cơ hội lắng nghe": nghĩa "nghe lén/lắng nghe" cả hai).
  - Chỗ bất định (không thêm vào thân kinh):
    + `2.3` `padosā`: "những hư hỏng"; có thể là "tật xấu", "oán hận", "sự hư hoại"; không phân xử được từ Pāli một mình.
    + `3.3`–`3.4` `gāmino gāmā, anagārā agārino`: đọc là hai cặp danh từ cùng chủ ngữ với `jīnā`: "người đứng đầu làng mất làng, người xuất gia và người tại gia cũng vậy"; cách đọc khác là "người có nhà trở thành không nhà" (agārino → anagārā), không loại trừ được.
    + `8.1` `anikaṭṭhā` → "quân hộ vệ": nghĩa chính xác chưa tra được (không có nơi nào khác trong tầng).
    + `13.4` `maggeyya` → "tìm đến" (đọc là dạng của `maggati/maggeti` "tìm, đuổi theo"); `14.2` `Sohaṁ maggasmi` → "chính tôi đang ở trên đường" (đọc `maggasmi` là `magge asmi`); cách đọc khác có thể là "tôi là kẻ bị truy tìm". Dịch sát chữ, ý nghĩa liên hệ giữa Brahmadatta và cái gai không được giải thích thêm trong thân kinh.
    + `15.2` `tuṇḍiyā` (hapax toàn Pāli đã ghim, ngoài bài này không có) → "bọn quan lại há mồm ăn": `tuṇḍa` là mồm/mỏ; "quan lại" là suy từ mạch (chúng ăn ban ngày, đối với bọn cướp ban đêm) và từ truyện tóm lược, không có từ nào trong Pāli nói "quan lại".
    + `14.4` `adhammabalinā` → "cống thuế phi pháp" (`bali` = cống nạp, thuế; dạng công cụ cách của `bali`); không rõ ai là người thu.
    + `15.3` `kūṭarāja` → "vua gian trá" (`kūṭa` là giả dối, gian xảo).
    + `16.2`–`16.4` `tāta māṇavā`: "hỡi con, các thanh niên"; `nillenakāni` → "chỗ ẩn náu", `āhatva` → "mang đến".
    + `17.4` `jiyyanti` → "già đi" (cũng có thể là "tàn héo").
    + `21.3`–`21.4`, `25.4` `sāliyo`: dịch "con bò" theo mạch (nhắc đến lưỡi cày `phālena`); nghĩa chính xác của `sāliya` không tra được ở nơi khác trong tầng.
    + `25.1` `Sā nūna puna re pakkā`: khó nhất bài; đọc là "chắc hẳn người ấy, này, lại nấu chín chậm"; ai là "người ấy" và nghĩa của `puna re` không phân xử được từ Pāli một mình. `25.3` `apekkhanto` không nói chủ ngữ nên câu Việt giữ nguyên chỗ để ngỏ.
    + `27.4` `yaṁ no garahate bhavaṁ` → "mà ngài lại chê trách chúng tôi" (`no` có thể là "chúng tôi" hoặc "của chúng tôi").
    + `28.1`–`28.2` `Gārayho brahme pañcālo, brahmadattassa rājino`: "đáng chê trách ... là vua xứ Pañcāla, là vua Brahmadatta"; cách chia cách của `brahmadattassa rājino` (sở hữu cách) không tách riêng được thành đồng vị.
    + `30.1` `aṭanakā` → "hay đi lang thang" (`aṭana` = đi rong).
    + `34.5`–`34.6` `asikosatthā, khīrapā … pajā`: "vì vỏ gươm ... con cái còn bú sữa"; `pajā` ở đây đọc là con của loài vật, cách đọc "dân chúng" cũng ngữ pháp được.
    + `35.4` `gāmikehi araññajo` → "bởi những kẻ ở làng" (không nói thêm đó là loài nào).
    + `36.3` `Nettāvatā` đọc là `na ettāvatā` ("không đến mức ấy"); `36.4` `jīvamadeyyu` → "ăn sống".
    + `37.1` `brahmacārī` → "vị phạm hạnh" (chỉ vị bà-la-môn đi cùng vua); `37.4` `paramappamādaṁ` → "phóng dật tột bậc"; `37.2` `anuppiyaṁ` → "lời chiều lòng".
    + `38.3` `baliṁ aggapiṇḍañca` → "lễ vật cúng và nắm cơm đầu" (`bali` ở đây là lễ vật; khác nghĩa với `14.4`).
    + `42.1`–`42.4` tóm lược của phẩm: `paṇḍitasambhava` đọc thành "Paṇḍita Sambhava", `sirakapi` giữ nguyên dạng phiên âm (có thể là "Mahākapi" ở `ja516`), `paṇḍaranāgavara` → "Paṇḍara, bậc tối thắng trong loài rồng", `tindukadevasuta` → "thiên tử Tinduka"; không chắc các tên ghép này.
  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 168/168, cùng thứ tự.
    2. Nháy đơn `‘’`, nháy kép `“”` và dấu lược `…` khớp Pāli từng khoá: 0/168 lệch (Pāli 0 `‘’` và 0 `…`; nháy kép mở/đóng từng đoạn thoại).
    3. Pāli trùng nguyên văn trong chính bài: 10 nhóm, xem trên; Việt khác 2 nhóm, cố ý.
    4. Dấu lược `…pe…`/`(…)`: Pāli 0/168 khoá, Việt 0/168 (phép chạy rỗng).
    5. Số Pāli: xem trên.
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng (`Jātaka`, `Gandhatinduka`, `Pañcāla`, `Brahmadatta`, `Bharata`, `Kiṁchanda`, `Kumbha`, `Jayaddisa`, `Chaddanta`, `Paṇḍita`, `Sambhava`, `Sirakapi`, `Dakarakkhasa`, `Paṇḍara`, `Sambulā`, `Tinduka`, `Pāḷi`). Đã in cặp Pāli↔Việt ra đọc toàn bài (168 cặp).
