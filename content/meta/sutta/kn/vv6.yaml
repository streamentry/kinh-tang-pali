  MỆNH ĐỀ ĐO LẠI TRONG `vv` (44 tệp đã có, đếm bằng `grep` trên tầng Việt dự án) — lát
  này chọn theo đa số, và ghi lại CẢ HAI HƯỚNG kèm số như sau.
  · `Vimānavatthu` (0.1): giữ nguyên Pāli **43 tệp** ⟵ *Chuyện về cảnh giới thần* 1 tệp.
  · `Itthivimāna` (0.2): *Chuyện Cung Điện Nữ Hư Không* **20 tệp** ⟵ *Chuyện Cung Điện
    Nam Hư Không* 14 (14 tệp ấy thuộc `Purisavimāna`, không phải bài này) ⟵ *Thiên Cung Của
    Nữ Giới* 1 ⟵ giữ Pāli `Purisavimāna` 3.
  · `Pāricchattakavagga` (0.3, chỉ ở vv31): *Phẩm Cây San Hô* **1 tệp** (`vv36:0.3`), không
    có cách thứ hai. Củng cố bằng tầng tên đã ghim `vv-name:32.vv-paricchattakavagga`
    = The Chapter With the Coral Tree.
  · `Pīṭhavagga` (0.3, vv6/vv7/vv9): *Phẩm Pīṭha* **9 tệp** ⟵ giữ Pāli 2
    (`Mahārathavagga`, `Sunikkhittavagga`).
  · NGÔI KỂ xưng tự: *vậy tôi* **30 dòng / 22 tệp** ⟵ *vậy ta* 4 dòng / 4 tệp ⇒ chọn
    **vậy tôi**.
  · `mahānubhāva`: *đại oai lực* **18 dòng / 9 tệp** ⟵ *uy thế lớn lao* 12 dòng / 9 tệp ⇒
    chọn **đại oai lực**.
  · `sabbadisā disā` toàn cục: *khắp mọi phương* **45 dòng / 27 tệp** ⟵ *khắp muôn phương*
    31 dòng / 23 tệp ⟵ *khắp bốn phương* 7 dòng / 6 tệp.
    ⚠ Nhưng đo theo CHÍNH CÁI PĀLI thì đảo ngược, và đây là mấu chốt của lát này:
    `…te sabbadisā pabhāsatī”ti.` (Tôn giả hỏi, ngôi 2) → *muôn phương* **19 tệp** ⟵
    *mọi phương* 8 ⟵ *bốn phương* 5; còn `…me sabbadisā pabhāsatī”ti.` (nữ thiên đáp,
    ngôi 1) → *mọi phương* **19 tệp** ⟵ *muôn phương* 10 ⟵ *bốn phương* 2; và
    `Obhāsentī disā sabbā,` → *mọi phương* **8/8 tệp**.
    ⇒ Lát này theo **đa số theo từng PĀLI** (luật PĀLI trùng nguyên văn thì dùng lại nguyên
    văn thắng số đếm toàn cục): câu hỏi → *muôn phương*, câu đáp → *mọi phương*.
    Hệ quả trung thực: trong `vv6`/`vv7`/`vv9` cùng một ý `sabbadisā` mà hai bản dịch khác
    nhau. Cụm `vv1`+`vv3`+`vv4`+`vv10`+`vv13`+`vv14` của kho cũng y hệt (hỏi *muôn phương*,
    đáp *mọi phương*), tức đây là quy ước của cụm đông nhất chứ không phải lỗi đơn lẻ — nhưng
    người biên tập có thể muốn thống nhất lại; nếu vậy thì phải sửa **cả hai vế ở cả 44 tệp**,
    việc đó không thuộc lát này và tôi không tự ý sửa bài đã có.

  Nguồn tên kinh: đọc tầng `name/` đã ghim cùng commit để phân giải ba chữ trong tên bài —
  `vv-name:35.vv31` = Couch Mansion ⇒ `Pallaṅka` là kiều/ngai; `vv-name:8.vv6` và
  `vv-name:9.vv7` = Ship Mansion / Second Ship Mansion ⇒ `Nāvā` là **thuyền** (đúng như
  `pv28:5.2` `Nāvāya ca tvaṁ avalamba tiṭṭhasi;` đã dịch *còn ngươi thì dựa vào thuyền mà
  đứng vững*); `vv-name:11.vv9` = Lamp Mansion ⇒ `Dīpa` là **đèn**. Ba tên đó được giữ
  nguyên Pāli trong tiêu đề (`Phẩm Pīṭha`, `Cung Điện Pallaṅka`, `Cung Điện Nāvā`) theo đúng
  cách 43/44 tệp `vv` đang làm với `Vimānavatthu`; riêng `Dīpavimānavatthu` dịch là *Đèn*
  vì *đèn* là từ Việt phổ thông đúng nghĩa, còn `Pallaṅka`/`Nāvā`/`Pīṭha` thì không.
  Tầng `name/` của `sn` không có tên từng bài (2119 mục nhưng `sn14.18`/`sn12.43`/`sn12.44`
  đều để trống), nên ba bài `sn` của lát dùng tiêu đề dịch nghĩa.

  Nháy kép: đặt đúng vị trí Pāli đặt, và cân trên cả bài (đã kiểm bằng `ngoặc()` của
  `_hvi.py` cho từng khoá đã dịch). `vv1:4.4` có lỗi tiền lệ — dư một dấu `”` thành
  `…muôn phương?”.”` — tôi KHÔNG sao chép lỗi ấy; bản đa số (5 tệp) là `…muôn phương?”`
  và đã dùng nguyên văn bản ấy.

  Dấu lược: không khoá nào của `vv31`/`vv6`/`vv7`/`vv9` có `…pe…` ở Pāli, và bản Việt cũng
  không có một dấu lược nào — mỗi khoá khớp 0 = 0.

  Bất định riêng của `vv6`/`vv7` (các vế kệ ngắn này không có tiền lệ nào trong 44 tệp `vv`):
  · `5.3`–`7.4` — 0 tiền lệ cho toàn bộ khối mô tả người tỳ-kheo khát nước, dòng nước và cây
    cối quanh thuyền. Ba chỗ tôi dựa vào bản Việt `pv28` (Petavatthu), vì `vv` vay nguyên văn
    từ đó: `Pallaṅkaseṭṭhe` → *trên tòa tuyệt hay* (`pv28:2.3`), `Pahūtamalyā
    bahupuṇḍarīkā` → *gần như phủ kín bởi hoa nhài, lại đầy những bông sen* (`pv28:3.2`,
    khác chỉ dấu câu), `vālukasanthatā` → *phủ cát* (`vv39:1.2` `soṇṇavālukasanthate` →
    *nền phủ cát vàng đẹp đẽ* — chỗ này Pāli có `soṇṇa` nên mới có *vàng*; ở `vv6`/`vv7:7.2`
    Pāli chỉ có `vāluka` = cát, nên tôi KHÔNG thêm *vàng*, dù tiền lệ có). `pokkharaṇi` thì
    tầng đang chia làm hai: `pv28:3.1` dịch *Tấm sàn* còn `mn12`/`sn3.19` dịch *hồ sen*; ở
    đây `ogāhasi pokkharaṇiṁ` là *bước xuống sàn thuyền* nên tôi theo `pv28`.
  · `7.3` `Ambā ca sālā tilakā ca jambuyo` — tên cây: *xoài, sāl, tilaka, cây jambu*; `tilaka`
    và `jambu` giữ Pāli vì chúng là tên loài cây đã quen (`tha-ap252` giữ *hoa uddālaka*),
    còn `ambā` và `sālā` có từ Việt phổ thông đúng nghĩa. `Uddālakā`/`pāṭaliyo` cũng giữ Pāli:
    `tha-ap252`/`tha-ap257` đã giữ *uddālaka*/*pāṭaliya*.
  · `6.3` `Sītodakā tassa bhavanti najjo` — 0 tiền lệ; `najjo` là *tấm gương* và câu ví nước
    mát với gương, không có gì để dịch thêm.
  · `8.1` `Taṁ bhūmibhāgehi upetarūpaṁ` — 0 tiền lệ; `bhūmibhāga` là *phần đất*, `upetarūpa`
    là *mang hình dạng*. Bản nháp đầu tiên của tôi viết *Ở từng phần đất, cung điện ấy hiện
    ra với hình dạng* rồi nối tiếp *là cung điện tối thượng* thành câu đứt; đã sửa thành
    *Cung điện ấy ở từng phần đất, đều mang một hình dạng*.
  · ⚠ **NGOẠI LỆ CỐ Ý so với luật PĀLI trùng thì khớp.** `5.4` `Uṭṭhāya pātuṁ udakaṁ
    adāsiṁ.` và `6.1` `Yo ve kilantāna pipāsitānaṁ,` có PĀLI giống hệt giữa `vv6` và `vv7`,
    nhưng tôi dịch *họ* ở `vv6` (vì `5.3` PĀLI là `bhikkhū` — số nhiều) và *vị ấy* ở `vv7`
    (vì `5.3` PĀLI là `bhikkhuṁ` — số ít). Giữ *họ* ở `vv7` sẽ MÂU THUẪN với chính `vv7:5.3`
    đã dịch *một vị tỳ-kheo*; đó đúng là lỗi tự mâu thuẫn mà luật trùng-khớp sinh ra để
    chặn, nên ở đây tôi ưu tiên tính nhất quán trong từng bài. `6.3` `Sītodakā tassa bhavanti
    najjo` (`tassa` số ít ở cả hai bài) thì tôi dịch **giống nhau** là *với vị ấy*.
  · Mẫu khoá cuối: `11.1` theo `vv1:9.1` (*Cung Điện Pīṭha Thứ Nhất, thứ nhất.*) và
    `vv12:8.1` (*…, thứ mười hai.*) — PĀLI `Paṭhamanāvāvimānaṁ chaṭṭhaṁ.` có **hai** số thứ tự
    (thứ nhất trong cụm Nāvā, thứ sáu trong cả `Itthivimāna`), và tôi giữ cả hai như mẫu.

  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|
  check`. `save_vi` của `_hvi.py` đã pass cho cả 45/45 khoá của bài này (đủ khoá, không thừa,
  NFC, không trùng nguyên văn PĀLI, PĀLI không lọt vào bản Việt, số dấu lược khớp từng
  khoá, ngoặc kép cân trên cả bài), và `_rv67.py` quét lại không lỗi nào ngoài `:0.1` — vốn
  là khối tiêu đề ngắn (< 40 ký tự) mà `_hvi.py` cố ý không kiểm, và giữ nguyên PĀLI là
  **tiền lệ 43/44** trong `vv`. Người biên tập cần chạy đủ `npm run validate`, `npm test`,
  `npm run check`, `npm run build` trước khi coi `technical_integrity: 9.6` là đạt.

  Kiểm toán độc lập 2026-10-11 (đọc đối kháng từng khoá theo Pāli; bản trước TỰ CHẤM 9.19).
  Kết quả: 17/45 khoá có lỗi nghĩa thật, 4 khoá lỗi văn phong/độ sát nhẹ; đã sửa 22 khoá
  (1.1–1.4, 2.2, 3.1, 4.2–4.4, 6.1, 6.3, 6.4, 7.1, 7.2, 8.1–8.4, 9.2, 10.1–10.3). Các mục của
  notes cũ ở trên về `pokkharaṇi` = *sàn thuyền*, `najjo` = *tấm gương*, `Pahūtamalyā` = *hoa nhài*
  và cả việc "dựa vào pv28" nay ĐÃ BỊ THAY THẾ bằng đọc lại từ Pāli (chính các tiền lệ pv28 chứa lỗi).
  Phân loại lỗi nghĩa thật:
  · Từ vựng sai (4): `6.3` `najjo` = các con sông (không phải gương) ; `6.4` `pahūtamalyā` =
    nhiều hoa (`malya` = hoa/tràng hoa, không phải hoa nhài) ; `7.2` `vālukasanthatā` = trải cát
    (không phải *cát chặt*) ; `8.2` `bhusa sobhamānaṁ` = chói sáng vô cùng (không phải *thấy từ xa*).
  · `pokkharaṇī`/`ogāhasi`/`chindasi` (2): `1.3` hồ sen (không phải *sàn thuyền*), `1.4` *hái hoa sen*
    (không phải *há ngắm*) — chữ vô nghĩa.
  · Hô cách/ngôi sai (4): `3.1` `devi mahānubhāve` hô cách (nữ thiên có đại oai lực) bị đọc thành
    tân ngữ *về đại oai lực ấy*, và nữ thiên bị gọi *ngài* lẫn *nàng*; `10.1`–`10.3` `Akkhāmi te
    bhikkhu mahānubhāva… yamakāsi… Tenamhi…` — người nói là nữ thiên (*tôi*), bản cũ đảo thành
    *ngài đã tạo phước* và *ngài có oai lực rực rỡ*, tức gán phước cho Tôn giả Moggallāna.
  · `idha mijjhati` (2): `2.2`, `9.2` → *thành tựu được ở nơi đây* (theo quyết định ở vv7).
  · `yassa kammassidaṁ phalaṁ` (2): `4.3`–`4.4` là mệnh đề quan hệ *về nghiệp mà đây là quả báo*
    làm tân ngữ của `viyākāsi`; bản cũ *giải thích rằng quả báo của nghiệp này là thế* sai cú pháp.
    Lỗi y hệt còn ở vv1, vv7, vv9, vv33 và nhiều tệp vv khác (nên rà cả bộ, không sửa ở đây ngoài vv6).
  · Thêm/đổi quan hệ cú pháp (3): `6.1` thêm *thấy* không có trong Pāli (`yo ve kilantāna
    pipāsitānaṁ… dadāti`); `7.1` *tràn tới… từ mọi phía* cho `anupariyanti` (= đi quanh); `8.1`
    mang hình dạng *là cung điện tối thượng* làm đứt câu.
  Lỗi nhẹ đã sửa: `1.1` `suvaṇṇacchadanaṁ` = có mái che bằng vàng (không *bọc*); `1.2` *bạn* → *nàng*;
  `4.2` *bị truy hỏi* → *được hỏi*; `8.3` thêm `idha` (*nơi đây*) và `ayaṁ` = *Đây*; `8.4` `puññakatā` =
  những ai đã tạo phước.
  Đã kiểm, KHÔNG có lỗi: `5.1`–`5.4` (*khát nước, mệt mỏi*, dâng nước), `7.3`–`7.4` tên cây (`tilaka`
  là một loài cây, không phải `tila` = mè; giữ Pāli), `2.3`/`2.4`/`9.3`/`9.4` (giữ theo tiền lệ toàn
  bộ vv), `3.2`–`3.4`, `9.1`, `10.4`. Cặp Pāli trùng nguyên văn trong bài: 1 (`2.4` = `9.4`), Việt giống nhau.
  Không có ākāsa trong Pāli: tiêu đề `0.2` *Chuyện Cung Điện Nữ Hư Không* cho `Itthivimāna` vẫn mang
  lỗi của cả bộ (ở ~51 tệp); KHÔNG sửa riêng vv6 để khỏi lệch bộ — cần người biên tập quyết định
  sửa đồng loạt. `0.4` giữ `Nāvā` bằng Pāli theo tiền lệ, dù nghĩa là *thuyền*.
  Bất định còn lại: (a) `7.1` `Taṁ āpagā anupariyanti` — `taṁ` có thể chỉ cung điện (như `8.1` `Taṁ …
  vimānaseṭṭhaṁ`) hoặc chính vị thí chủ; giữ *cung điện ấy*; (b) `8.1` `bhūmibhāgehi upetarūpaṁ` — *đầy
  đủ các khoảnh đất* là bám sát chữ, chưa phân xử được nghĩa rõ hơn; (c) `7.2` `nadī` số ít hay số
  nhiều (giữ số ít theo vv7); (d) `idha` ở `8.3` bám chữ.
  Chấm lại: bản cũ 9.19 phản ánh bản chứa 17/45 khoá lỗi nghĩa thật nên bị hạ — `semantic_fidelity`
  9.3 → 8.9, `grammar_logic` 9.2 → 9.0, `terminology` 9.2 → 8.6 (tiêu đề phẩm `Itthivimāna` sai cả bộ,
  cộng lỗi từ vựng đã sửa), `vietnamese_clarity` 9.3 → 9.0, `han_viet_balance` 9.3 → 9.2,
  `ambiguity_integrity` 9.1 → 8.8 (còn các bất định nêu trên). `source_provenance` 9.4, `segment_alignment`
  10.0, `triangulation` 7.5 (không có bản Anh), `technical_integrity` 9.6 giữ nguyên. `final_score` = 9.0
  (trung bình số học thô 90.0/10), không phải điểm đủ để `> 9.0`. Blocker upstream giữ nguyên.
  Cổng kỹ thuật CHƯA chạy ở lượt này: cần `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Lượt cải thiện 2026-10-11: đọc đối kháng lại cả 45 khoá theo Pāli, đo tiền lệ bằng chỉ mục Pāli→Việt toàn tầng `kn`; đổi 5/45 khoá, tất cả là bỏ phần thêm ngoài Pāli hoặc thống nhất nội bộ bài.
  · `8.1` `Taṁ bhūmibhāgehi upetarūpaṁ` — *mang hình tướng đầy đủ các khoảnh đất* → *đầy đủ các khoảnh đất*. `upetarūpa` ở `ja444:6.4` (`annena pānena upetarūpaṁ`) và `ja546:244.1` đã dịch *đầy đủ cơm ăn nước uống*, `ja457:5.3` (`guṇehi sabbehi upetarūpo`) *đầy đủ mọi đức tính*: `rūpa` ở cuối ghép không có nghĩa riêng, nên *hình tướng* là phần thêm gây tối nghĩa. `bhūmibhāga` = phần/khoảnh đất (`thag18.1:12.2` *vùng đất*, `ja547:344.2` *khoảnh đất*). Không thêm *tươi đẹp* như `vv7:8.1` vì Pāli không có tính từ.
  · `7.3` *nơi có xoài, có sāl, có tilaka và có cây jambu* → *Xoài, sāla, tilaka và cây jambu*: Pāli chỉ liệt kê danh từ, không có quan hệ nơi chốn; bỏ *nơi có*/*có* lặp. Dạng *sāla* theo tiền lệ tên cây (234 chỗ *sāla* ⟵ 6 chỗ *sāl*; `ja506:34.1` đúng cùng danh sách: *Xoài, sāla, tilaka và cây jambu*).
  · `6.2` bỏ *đều* (Pāli `dadāti` số ít, `yo ve` không phải phân phối); khớp 2 tệp còn lại có cùng Pāli. `8.4` *đều đạt được như thế* → *đạt được điều như thế* (bỏ *đều* không có trong Pāli; `etādisaṁ` là tân ngữ nên thêm *điều*).
  · `10.4` *sắc tướng tôi* → *dung sắc tôi*: `vaṇṇo` đã dịch *dung sắc* ở `2.1`, `3.4`, `9.1` trong cùng bài, riêng `10.4` (nhắc lại `3.4`) lại *sắc tướng*. Toàn tầng, cùng Pāli `Vaṇṇo ca me sabbadisā pabhāsatī”ti`: *dung sắc* 48 ⟵ *sắc tướng* 13 (63 khoá); với `te`: *dung sắc* 64 ⟵ *sắc tướng* 5 (71 khoá).
  Đo lại `sabbadisā`: cùng hai câu Pāli, `te…` → *muôn phương* 50 ⟵ *mọi phương* 20 ⟵ *bốn phương* 1 (71 khoá); `me…` → *muôn phương* 32 ⟵ *mọi phương* 30 ⟵ *bốn phương* 1 (63 khoá). Số của câu `me…` là thế cân bằng, KHÔNG còn là "mọi phương đa số" như ghi ở phần trên; hai câu hiện dịch khác nhau trong cùng bài (`3.4` *muôn phương*, `10.4` *mọi phương*). Giữ nguyên vì hai cụm nghĩa như nhau và cùng cụm với `vv7`/`vv9`; nếu người biên tập thống nhất thì sửa đồng loạt cả bộ.
  Đã xem lại và quyết định KHÔNG đổi dù nghi ngờ: `2.4`/`9.4` *dù là gì dễ chịu với tâm* cho `ye keci manaso piyā` (`piya` là *thân ái, vừa ý*, *dễ chịu* chưa tối ưu và câu gượng, nhưng 40/43 khoá cùng Pāli toàn tầng dùng đúng cách này); `0.2` *Chuyện Cung Điện Nữ Hư Không* (47/49 khoá cùng Pāli, lỗi của cả bộ như đã nêu ở trên, không sửa lẻ một bài); `4.2` *Tôn giả* (16/17); `2.2`/`9.2` `idha mijjhati` *thành tựu được ở nơi đây* (14/21 và 15/16, còn thiếu tân ngữ nhưng chưa có căn cứ để chọn cách khác). `10.2` `yamakāsi puññaṁ` đọc như câu hỏi gián tiếp (*phước báu nào*), 12/13 khoá theo cách này; Pāli là mệnh đề quan hệ nên nghĩa vẫn đúng.
  Chấm lại: `semantic_fidelity` 8.9 → 9.0 (bốn khoá bỏ phần thêm ngoài Pāli: `8.1`, `7.3`, `6.2`, `8.4`); `vietnamese_clarity` 9.0 → 9.1 (`8.1` hết cụm tối nghĩa *mang hình tướng*); `terminology` 8.6 → 8.7 (`vaṇṇo` nhất quán trong bài, tên cây theo tiền lệ; tiêu đề `0.2` vẫn tồn lỗi cả bộ nên không nâng thêm). Không đổi: `source_provenance` 9.4, `grammar_logic` 9.0 (không sửa lỗi ngữ pháp/ngôi nào mới), `segment_alignment` 10.0, `triangulation` 7.5 (không có bản Anh), `han_viet_balance` 9.2, `ambiguity_integrity` 8.8 (bất định `7.1` `taṁ`, `8.1` `bhūmibhāgehi`, `7.2` `nadī`, `8.3` `idha` vẫn chưa phân xử), `technical_integrity` 9.6. `final_score` = 9.03 (trung bình số học thô 90.3/10). Blocker upstream giữ nguyên. Cổng kỹ thuật vẫn CHƯA chạy ở lượt này: cần `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Sửa lỗi nghĩa 2026-10-16: vv6:7.1 `Taṁ āpagā anupariyanti` — "Những dòng sông luôn chảy quanh cung điện ấy" → "Những dòng sông luôn chảy quanh người ấy" (`taṁ` ở `7.1` chỉ người làm phước đã nêu ở khổ trước (`yo … dadāti … tassa`), không phải cung điện — Pāli không nêu cung điện ở khổ này; Vv-a ad Vv 6: "tattha tassāti tanti ca yathāvuttapuññakārinaṃ paccāmasati … tassa vasanaṭṭhānaparikkhipanena sopi parikkhitto nāma hoti" (https://www.tipitaka.org/romn/cscd/s0506a.att1.xml); Indacanda "người ấy"; cùng dòng đã sửa ở vv7:7.1.)
