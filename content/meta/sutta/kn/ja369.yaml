notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho ja369.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 27 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Lô G7 2026-10-15: kiểm lại lỗi lặp bằng Pāli đã ghim, Claude Sonnet 5.5 (Claude Code). 1.3-1.4,
  4.1-5.4 theo ja439:4.3-6.4: bỏ "nàng", "dao cạo/dao sắc", "tột cùng", "phải" không có trong Pāli
  (`cakka` chỉ là bánh xe); 3.1-3.4 chưa rà. Điểm giữ nguyên, trừ semantic_fidelity +0,1 do sửa lỗi
  nghĩa; technical_integrity giữ nguyên.

  Lô H3 2026-10-15: rà 3.1-3.4 bằng Pāli đã ghim, Claude Sonnet 5.5 (Claude Code). 3.1-3.2 `ito
  bahutarā bhogā, atra maññe bhavissare` đưa về đúng trật tự "của cải nhiều hơn thế này, tôi nghĩ sẽ
  có ở nơi đây" (bản cũ thêm "lạc thú" không có trong `bhogā` và đặt "tôi nghĩ" lệch khoá); 3.4
  `byasanaṁ gataṁ` "rơi vào tai họa" thay "chịu cảnh đọa đày" (nhất quán ja381/ja427). Không có bản
  Anh để đối chiếu thêm. Điểm: semantic_fidelity +0,1 do sửa lỗi nghĩa thật ("lạc thú",
  "đọa đày"); technical_integrity giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: A13 — `1.4`, `2.4`, `3.4` (bỏ dấu chấm thừa sau dấu đóng lời thoại, ví dụ `?”.` thành `?”`); C1 — `0.4`, `6.1` và translationTitle (tiêu đề giữ "Kinh X", bỏ đuôi "jātaka" hoặc "Chuyện Tiền Thân"; cùng tên Pāli thì cùng tên Việt); C1 — 0.3 (tên phẩm thống nhất với các bài cùng phẩm: cùng tên Pāli thì cùng tên Việt); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
