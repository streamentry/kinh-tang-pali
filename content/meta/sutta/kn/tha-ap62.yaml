notes: |-
  **ĐỌC TOÀN BỘ PĀLI 72 KHOÁ TRƯỚC KHI VIẾT**, rồi in lại từng cặp Pāli↔Việt sau khi ghi và đọc đối kháng.

  **TẦNG THAM KHẢO.** Mẫu số coverage = **1** khoá (`tha-ap62:16.1`, 64 ký tự); Sujato phủ **0/1**; ba tầng tham khảo (`english-sujato`, `english-project`, `vietnamese-current`) đều vắng ⇒ `draft`, `triangulation` 7,5. Ngoài khoá lời kết, 71 khoá còn lại đều dưới 40 ký tự nên cổng coverage gần như không đo được gì ở bài kệ ngắn: đó là *cổng không đo được*, không phải *đạt*.

  **TÊN VÀ DẪN NHẬP.** `:0.3` Pāli `Asanabodhiyattheraapadāna` **không bắt đầu bằng số** ⇒ bản Việt không có số thứ tự; `translationTitle` bằng đúng giá trị `:0.3`. Tiền tố `Bài Kệ Tuyên Ngôn Về Trưởng Lão` (đo lại, phạm vi gần nhất tha-ap53–70, 18 tệp có tiền tố này: *Tuyên Ngợ* 14 · *Tuyên Ngôn* 2 · *Tuyên Ngợi* 1 · *Ký Sự* 1; cả phẩm `tha-ap` đã dịch: *Tuyên Ngợ* 236 · *Tuyên Ngôn* 108 · *Ký Sự* 99 · *Tuyên Ngợi* 10). Hai phạm vi cho **cùng một đa số là *Tuyên Ngợ***, nhưng đó là dạng sai chính tả (không có nghĩa) đã được nêu ở cả cuốn; tôi chọn dạng đúng chính tả *Tuyên Ngôn* chứ không nhân bản lỗi, và **để người biên tập phán một lượt cho cả cuốn**. `:0.2` `Bījanivagga` → *Phẩm Hạt Giống* (7/9 khoá cùng Pāli đã dịch; *Phẩm Cái Quạt* 1 sai nghĩa, *Phẩm Bījanivagga* 1). `:0.1` giữ `Therāpadāna` (448/459). `:17.1` theo `:0.3` + *thứ mười* (`dasamaṁ`). `:18.1` `Bījanivaggo chaṭṭho` → *Phẩm Hạt Giống là phẩm thứ sáu* (dạng *là phẩm thứ N* và *là thứ N* chia gần đều ở tầng; chọn dạng có chữ *phẩm* cho khỏi cụt). `:19.1` `Tassuddānaṁ` → *Tóm tắt phẩm này:* (29/40).

  **DÙNG LẠI NGUYÊN VĂN (đếm được).** Có **43** khoá Pāli trùng nguyên văn với khoá đã dịch ở nơi khác trong phẩm `tha-ap`; **30** khoá dùng lại đúng chuỗi Việt đã có (`:1.1` *“Lên bảy tuổi kể từ khi sinh ra,* 2/2 · `:1.3` *Với tâm tịnh tín hân hoan,* 50/73 · `:2.2` 7/16 · `:4.2` 2/4 · `:5.4` 11/11 · `:8.2` 13/19 · `:9.2`/`:10.2` *an tịnh, không còn sanh y;* 7/7 · `:9.4` 2/2 · `:10.4` 90/128 · `:11.1` *Vào chín mươi hai kiếp trước,* 15/40 · `:12.1` 1/1 · `:12.3`/`:14.3` 48/89 · `:13.1` 3/3 · `:14.4` 12/112 · `:15.1` 454/459 · `:15.2` *…* 613/613 · `:15.3` 426/458 · `:19.1` 29/40). **13** khoá mà bản Việt khác chuỗi đã có, và lý do từng khoá: `:1.2`, `:1.4` (đổi hoa-thường, bỏ *tiến*), `:3.3` (chuỗi cũ là *Ta đã hầu hạ Ngài suốt năm năm* với tân ngữ là một vị, còn ở đây `paricariṁ` đi với *cây Bồ-đề* ở `:3.4` nên không dùng lại), `:4.1` (bỏ *rộ*, Pāli chỉ nói `pupphitaṁ`), `:4.4`, `:5.2` (xem Bất định), `:5.3` (chỉ khác hoa-thường đầu dòng), `:6.3`, `:7.1`, `:7.2` (dùng lại *sẽ nắm quyền cai trị cõi trời*), `:8.1` (đổi nhịp), `:10.1`, `:11.3` (xem Bất định). Trong chính bài có **2** cặp Pāli trùng nguyên văn (`:9.2`/`:10.2`, `:12.3`/`:14.3`) và cả hai cặp đều có bản Việt **giống nhau**: 0 cặp trùng mà Việt khác. Công thức lời kết `Itthaṁ sudaṁ… imā gāthāyo abhāsitthāti` → *Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này* (459 khoá đã dịch khác dùng *Tôi nghe như vầy: Tôn giả Trưởng lão*, và 2 khoá dùng *đã từng nói bài kệ này*); `…pe…` → đúng một `…` (613/613).

  **SỐ PĀLI, tự tính.** `sattavassa` = 7 (`:1.1`, *lên bảy tuổi*) · `pañcavassa` = 5 (`:3.3`) · `tiṁsakappāni` = 30 (`:7.1`; **không** phải `tiṁsakappasahassa`, nên không gặp bất định 3.000/300.000) · `catusaṭṭhi` = 4 + 60 = **64** (`:7.3`) · `dvenavute` = 2 + 90 = **92** (`:11.1`, khớp với `gāthā dvenavuti` = 92 ở `:20.6`) · `catusattatito` = 4 + 70 = **74** (`:12.1`) · `tesattatimhito` = 3 + 70 = **73** (`:13.1`) · `sattāhesuṁ` = 7 (`:13.2`) · `paṇṇavīsatito` = 5 + 20 = **25** (`:14.1`) · `sattaratana` = 7 báu · `catasso` = 4 · `dasamaṁ` = thứ mười, `chaṭṭho` = thứ sáu. Không có số nào cần dùng *một/mốt, bốn/tư, năm/lăm* sai chỗ; đã đọc lại từng số trong bản Việt.

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `:5.2` `aggapuggalo` → *người tối thượng*. Chuỗi cũ của tầng cho cùng Pāli là *tối thắng giữa loài hai chân* (6 khoá) — Pāli ở đây **không có** `dvipada`, nên cụm *hai chân* là thêm chữ; tôi không dùng lại. Đây là lỗi của các tệp khác, ngoài lát này, **báo chứ không sửa**.
  · `:11.3` `Duggatiṁ nābhijānāmi`: tầng có ba cách (*Ta không biết mình rơi vào khổ đau* 135 · *Tôi không còn biết đến đọa xứ nào* 82 · *Tôi không còn biết đến khổ xứ* 51, trên 392 khoá). `duggati` là *đường đi xấu* (đọa xứ), không phải *khổ đau* chung; tôi chọn *Ta không biết đến đọa xứ nào* (ngôi *ta* theo đa số lời kệ tự thuật 90/128 ở `:10.4`).
  · `:8.3` `Dve sampattī` → *Đã thọ hai thành tựu* dùng lại nguyên văn 3/3; Pāli không nói hai sự thành tựu nào (thường hiểu là cõi trời và cõi người, nhưng đó là chú giải) nên không thêm.
  · `:2.2` `tādino` → *bậc Vững Vàng kiên định* dùng lại nguyên văn 7/16 (còn lại *đã thuần phục*, *đáng tôn kính*, *Như Thật*); giữ để khỏi tạo cách thứ N+1.
  · `:4.3` `Sakaṁ kammaṁ pakittento` → *Công bố việc làm của chính mình*; `pakitteti` nghĩa *nêu ra, tuyên bố, tán dương*; đã chọn nghĩa *công bố* vì ở `:6.3` đã dùng *tán dương* cho `kittayissāmi`, tránh trùng. 0 tiền lệ đúng cụm.
  · `:6.2` `buddhapūjā ca sakkatā` → *và đã cung kính cúng dường Phật*: `sakkatā` là phân từ của `sakkaroti` (tôn kính, trân trọng), đọc thành trạng ngữ cách thức; nếu đọc *việc cúng dường Phật đã được tôn kính* thì cùng ý nhưng thể bị động. 0 tiền lệ đúng câu.
  · `:9.1` `Padhānapahitatto` → *dốc mình vào tinh tấn* (`pahitatta` là người đã gửi gắm chính mình); chuỗi cũ *Tôi đã tự thân phát tâm* (1 khoá) lệch nghĩa nên không dùng lại.
  · `:12.2` `daṇḍasenoti` → *nổi danh là Daṇḍasena* (`iti` là dấu dẫn tên, `vissuto` là *nổi tiếng*). `:13.2` `sattāhesuṁ` = `satta` + `ahesuṁ` (có bảy vị) và `mahīpatī` số nhiều.
  · `:14.4` `mahabbalo` → *có đại thần lực* dùng lại nguyên văn 12/112 phía trước; chuỗi cùng nghĩa viết thường *Chuyển luân vương* chiếm 52, nhưng ở phạm vi gần tha-ap53–70 viết hoa *Chuyển Luân Vương* nhiều hơn rõ rệt (17 so với 1; cả phẩm 144 so với 79), nên giữ viết hoa cho nhất quán trong bài.
  · Ngôi kể: lời kệ của trưởng lão dùng *ta* (khớp đa số), lời Đức Phật trong ‘…’ (`:6.1`–`:9.4`) cũng *ta*; chuỗi cũ của `tha-ap61` đặt *tôi* cho lời Đức Phật là chưa khớp người nói, **báo chứ không sửa**.
  · Danh sách tóm tắt `:20.1`–`:20.6`: giữ tên bằng Pāli (khớp cách tầng xử lý `tha-ap102` `:9.1`–`:9.6`); `padīpañca` = `padīpaṁ ca`; `tathā` dịch là *như vậy* (nghĩa đen), không thêm ý.
  · Dạng `Tiṁsakappāni` ở `:7.1` là *ba mươi kiếp* thẳng, không có `sahassa`.

  **DẤU LƯỢC.** `:15.2` là `…pe…` → **đúng một** `…`; Pāli không có `(…)` ở khoá nào nên không có `(…)` ở Việt. **NGOẶC.** Pāli mở `“` ở `:1.1` và đóng `”` ở `:15.3`; nháy đơn `‘` mở ở `:6.1`, `’` đóng ở `:9.4`: kiểm **khớp Pāli từng khoá**, 4/4 dấu, 0 lệch.

  **KIỂM (có mẫu số).** Tập khoá Việt = tập khoá Pāli: 72 = 72, đúng thứ tự Pāli. Lược `…` khớp: 72/72 khoá. Nháy đơn và nháy kép khớp Pāli từng khoá: 72/72 khoá. NFC: 72/72. Khoá rỗng: 0. Pāli lọt sang Việt: chỉ danh riêng (Therāpadāna, Asana, Tissa, Daṇḍasena, Samantanemi, Puṇṇaka, Asanabodhiya và tên trong tóm tắt), đều có trong Pāli của chính bài. Phép *Pāli trùng nguyên văn trong chính bài mà Việt khác* chạy trên **2** cặp trùng, 0 lệch (mẫu số rất nhỏ).

