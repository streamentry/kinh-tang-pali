notes: |-
  Lát v7/7: 12 bài Jātaka Ekakanipāta (Dūkaṇipāta), 156 khoá, dịch đủ MỌI khoá
  trong `all` của v7/v7.json. Đã đọc HẾT v7/p7.txt trước khi viết.

  **Sàn coverage 80% KHÔNG kích hoạt — nhưng ô Anh trống KHÔNG phải sự đồng
  thuận.** Đo được: mọi vế kệ của Ekakanipāta đều NGẮN HƠN 40 ký tự (156 khoá,
  `substantiveSegments = 0`), nên `englishCoverageFor` cho `ratio = 1` và bài
  không cần entry trong `content/meta/reference-gaps.yaml`. Hệ quả thật: hàm
  `kiểm()` của `_hvi.py` lọc `cần = [k for k in p if len(p[k]) >= 40 …]` nên
  `cần` RỖNG ở cả 12 bài, và **NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu
  lược không tự chạy**. Tôi đã tự kiểm thủ công đủ 156 khoá bằng một lớp kiểm
  riêng áp đúng các quy tắc đó lên MỌI khoá (0 lỗi), và đọc đối kháng từng cặp
  Pāli ↔ Việt. Tầng Việt tham khảo (Hòa thượng Thích Minh Châu) ở commit đã
  ghim chỉ có Pháp Cú, nên không có bản Việt nào để đối chiếu cho 12 bài này —
  đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho.

  **Dấu lược:** không khoá nào trong 12 bài có `…pe…` hay `…`, nên cả hai phía
  đều 0. Không mở rộng, không thêm, không bớt.

  **Ngoại lệ đã đo, không phải lỗi:** khoá `:0.1` = `Jātaka` trùng nguyên văn
  Pāli ở **128/128** tệp `kn/ja*` có cả hai khoá (đếm bằng script, không suy đoán).
  Tôi giữ nguyên theo đúng tiền lệ ấy và nêu ở đây.

  **Thiếu tầng Anh:** xem `blocking_errors`. Chỗ nào Sujato im lặng thì tôi dịch
  từ Pāli; ô Anh trống ở đây KHÔNG được đọc là đồng thuận về cách dịch.
  **`Byākāsi saññaṁ parisaṁ vigayha`** (`1.3`) là vế khó nhất của lát này.
  Bản nháp tôi dịch "ông đi tìm cõi đời, bỏ khỏi đoàn thể", làm mất `byākāsi`
  (đã cầu xin). Đã sửa thành "ông đã cầu, tìm cõi đời, bỏ khỏi đoàn thể" để giữ
  cả ba vế. Vẫn chưa chắc chắn `saññā` ở đây là "thế giới" hay "sự nhận biết";
  tôi chọn "cõi đời" và ghi lại.

  **`Saṁvaccharaṁ bīraṇathambhakasmiṁ`** (`1.2`): `saṃvicchara` = nơi vắng vẻ
  (tu sĩ), `bīraṇathambha` = tên riêng của khu rừng ấy. Tôi dịch "ở nơi vắng vẻ
  Bīraṇathambha" và giữ tên riêng nguyên văn, đúng với tiền lệ tầng `kn` đã giữ
  tên Pāli cho núi/địa danh.

  **`yogga` (`1.1`)**: `yogga` = cày/vành (đòn gánh). `Akāsi yoggaṁ dhuvamappamatto`
  = "đặt cày cho chắc, không cẩu thả". Tôi dịch "buộc đòn gánh cho chắc" — dựa
  vào nghĩa "cày" của từ. **Chỗ này tôi chưa chắc**; ghi lại.

  **Tiêu đề `Bīraṇathambhavagga` (`0.3`):** tầng Việt chưa có tiền lệ cho phẩm
  này (0 lần) → đặt mới, giữ tên Pāli vì là địa danh, theo tiền lệ "Phẩm Varuṇa",
  "Phẩm Kakaṇṭaka", "Phẩm Haṁci".

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja211:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  Lượt cải thiện 2026-10-13 (đọc đối kháng từng khoá; đối chiếu tiền lệ bằng
  số đếm trên tầng `kn/ja*`; Pāli root là căn cứ cuối). Đổi **8/13** khoá
  (`1.1`–`1.4`, `2.1`–`2.4`); năm khoá tiêu đề/kết (`0.1`–`0.4`, `3.1`) giữ.
  Bản trước có nhiều lỗi mà lượt chấm trước chưa bắt được, nên một số điểm cũ
  bị hạ cho đúng thực tế, không phải vì bản mới kém đi.

  - `2.1`–`2.2` (lỗi nặng nhất). Bản cũ «Kẻ xin xỏ ơi, ngươi cầu hai điều, nên
    Somadatta đi tới chỗ không» đọc sai cú pháp: `yācanako` là CHỦ NGỮ của
    `nigacchati`, còn `tāta` và `somadatta` là hai hô cách. Bài song song
    `ja323:1.1–1.4` có CÙNG bốn dòng Pāli (chỉ khác hô cách `rāja, brahmadatta`)
    và được dịch «Kẻ đi cầu xin sẽ gặp hai điều … bởi lẽ thói thường cầu xin là
    vậy». Sửa thành «Này con, kẻ đi cầu xin gặp hai điều, / hỡi Somadatta;».
    `nigacchati` = «gặp» theo đa số tiền lệ (`ja528:22.2`, `ja532:83.4`,
    `ja536:113.3`); `tāta` = «này con» (hàng chục khoá trong `ja348`, `ja371`,
    `ja377`, `ja381`, `ja477`…). Động từ «gặp» nằm ở `2.1`, hô cách Somadatta
    đứng riêng ở `2.2` — cùng kiểu `ja323:1.1–1.2` đã dịch; vì thế
    `segment_alignment` 10 → 9.8.
  - `2.3`: «dù không được … hay được …» → «hoặc chẳng được gì, hoặc được tài
    sản». `vā` là «hoặc»; dùng đúng chữ của `ja323:1.3` (Pāli trùng nguyên văn,
    1/1 cặp trùng ngoài bài, bản cũ khác ở cả hai).
  - `2.4`: «đó là đạo hạnh của sự cầu xin» → «bởi lẽ thói thường cầu xin là
    vậy». `dhammā` ở đây là «bản chất/lẽ thường», không phải «đạo hạnh»; chữ
    của `ja323:1.4`. `evaṁdhammā hi` còn ở `ja543:84.2/85.2` = «bản chất».
  - `1.2`: bản cũ «ở nơi vắng vẻ Bīraṇathambha» làm MẤT `saṁvaccharaṁ` và bịa
    nghĩa. Ghi chú cũ về «`saṃvicchara` = nơi vắng vẻ» là SAI: `saṁvaccharaṁ`
    là «(suốt) một năm» (đối cách chỉ thời gian), cùng chữ với `ja524:27.1`
    «suốt một năm». Sửa thành «suốt một năm ở Bīraṇathambhaka»; giữ tên riêng
    nguyên hình có đuôi `-ka` của vị cách `bīraṇathambhakasmiṁ`.
  - `1.3`: bản cũ «đã cầu, tìm cõi đời, bỏ khỏi đoàn thể» sai cả ba vế.
    `byākāsi` = «đã đáp/nêu rõ» (`ja478:1.3` «chẳng đáp lời», `ja401` «giải
    đáp»), không phải «cầu»; `parisaṁ vigayha` = «sau khi bước vào (giữa) hội
    chúng», cùng mẫu `ja534:51.2` «khi bước vào hội chúng», `ja543:202.3`, chứ
    không phải «bỏ khỏi đoàn thể». Sửa: «đã nêu rõ sự nhận biết, sau khi bước vào
    giữa hội chúng».
  - `1.4`: bản cũ «kẻ ít tuệ thì không được che chở» BỎ MẤT chủ ngữ `niyyamo`.
    Cùng mẫu `ja497:22.4` «… không che chở được kẻ ít trí tuệ». Sửa: «sự tự chế
    không che chở được kẻ ít trí tuệ».
  - `1.1`: «buộc đòn gánh cho chắc, không cẩu thả» → «Đã luyện tập, thường xuyên
    không phóng dật». `dhuvaṁ appamatto` = «thường xuyên không buông lung»
    ở `ja307:1.3`; `appamatto` = «không phóng dật» là đa số (8/12 khoá có từ
    này ngoài bài). «Đòn gánh» không có căn cứ trong từ `yogga`; bản cũ tự ghi «chưa
    chắc».
  - Đã bỏ đại từ «ông» ở `1.1`–`1.3`: `akāsi`/`byākāsi` là aorist mà dạng ngôi
    thứ hai và thứ ba trùng nhau, nên chủ ngữ không phân xử được từ Pāli.
  - Tầng tên của SuttaCentral (`ja-name:235.ja211`) ghi bài là «The Farmer's Son
    Somadatta» — Somadatta là con người nông dân; không dùng để thêm vào lời kinh.

  Điểm đổi: semantic_fidelity 8.7 → 8.5 (hạ: bản trước có lỗi nghĩa chưa bị bắt;
  bản sau còn ba từ chưa phân xử); grammar_logic 8.8 → 8.9; segment_alignment
  10 → 9.8; terminology 9 → 8.8; triangulation 7 → 7.5 (thêm đối chiếu với kệ
  trùng nguyên văn `ja323` và các mẫu `ja307`, `ja478`, `ja497`, `ja534`,
  `ja543`; vẫn không có bản Anh nên không vượt 8.0); vietnamese_clarity 9 → 8.8
  (kệ cô đọng, `1.1`–`1.3` không có chủ ngữ); ambiguity_integrity 8.5 giữ;
  technical_integrity 9.6 giữ. final_score 8.94 → 8.92.

  **Bất định còn lại (không phân xử được, không đoán):** (1) `yoggaṁ` ở `1.1`:
  chọn «luyện tập» (nghĩa «rèn tập, tập luyện» của `yoggaṁ karoti`), nhưng
  `yogga` cũng có nghĩa «thú kéo xe/ách» (`ja545:29.3`, `ja538:79.1`); nếu bài
  nói về việc cày kéo thì câu đổi nghĩa. (2) `saññaṁ` ở `1.3`: chọn «sự nhận
  biết»; còn có thể là «dấu hiệu/ám hiệu». Không có bài song song cho tổ hợp
  `saññaṁ byākāsi` trong `ja*` (toàn tầng chỉ 1 lần). (3) `niyyamo` ở `1.4`:
  hiểu là `niyama` (giữ quy củ, tự chế); còn khả năng là `niyyāma` — không có
  căn cứ phân xử, nên giữ nghĩa rộng. (4) Bīraṇathambhaka là tên làng, địa điểm
  hay khóm lau: giữ nguyên tên. (5) Người nói và người nghe ở `1.1`–`1.3` không
  xác định từ Pāli; nguồn tường thuật (văn xuôi chú giải) không nằm trong tầng
  Pāli đã ghim. Hệ quả: `semantic_fidelity` và `ambiguity_integrity` không nâng.

  **Blocker còn lại:** chỉ blocker «không có tầng english-sujato» (giới hạn
  upstream); khối waiver giữ nguyên. Ghi nhận hộ: `ja220:0.3` và `ja220:3.2`
  viết «Bīraṇathamba» (thiếu một `h`) trong khi 9 bài còn lại cùng phẩm viết
  «Bīraṇathambha» — lỗi ngoài phạm vi bài này, chưa sửa. Cổng kỹ thuật
  `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy
  trong lượt này, nên `technical_integrity` giữ 9.6, không tuyên bố đã pass.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 7 khoá chênh lệch lớn nhất (trong 13 khoá; 6 khoá còn lại hầu như trùng ý) → khác nghĩa 0: sửa 0, giữ 7, bất định 3 (`1.1`, `1.2`, `1.3`). Giữ: `1.1` `yoggaṁ` — bản mù *công việc (yoga)*, bản dự án *luyện tập*; `yoggaṁ karitvā` ở `an9.36:3.1` (và `Silāya yoggaṁ karitvā` ở `ja483:8.2`, `ja516:21.3`) là *tập luyện/thử sức* chứ không phải *công việc*, nên giữ *Đã luyện tập*. `1.2` `bīraṇathambhakasmiṁ` — bản mù *nơi gốc cỏ bīraṇa* (bản mù tự đánh dấu không chắc), bản dự án giữ tên riêng *Bīraṇathambhaka* (đuôi `-ka` và vị cách `-smiṁ`, cùng phẩm `Bīraṇathambhavagga`). `1.3` `saññaṁ` — bản mù cũng *tưởng*, bản dự án *sự nhận biết*; cả hai đều không chắc. `1.4` `niyyamo` — bản mù *sự gò bó*, bản dự án *sự tự chế*; `niyama` ở `pe8:64.3`, `mil5.4.2:1.6` đi cùng `saṁyamo`, `damo` nên là *sự chế ngự, điều răn*. `2.3`, `2.4` chỉ khác diễn đạt (*hoặc chẳng được gì, hoặc được tài sản* ↔ *không được gì hoặc được tiền của*; *thói thường* ↔ *bản chất*). `0.4` *Kinh Somadatta* ↔ *Chuyện Tiền Thân Somadatta* chỉ khác quy ước tiêu đề của tầng. Bất định còn lại: (1) `yoggaṁ` vẫn còn khả năng *thú kéo xe/ách* (`ja545:29.3`); (2) `saññaṁ` là *sự nhận biết* hay *dấu hiệu*; (3) `bīraṇathambhaka` là địa danh hay *gốc/bụi cỏ bīraṇa*. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đoạn song song `ja323:1.1`–`1.4`, `dn24:1.7.20`): sửa 1 khoá — `1.2` `bīraṇathambhakasmiṁ`: bản cũ giữ như địa danh *Bīraṇathambhaka*; đây là danh từ chung *bụi cỏ bīraṇa* (`bīraṇa` + `thambhaka` *bụi, khóm*), cùng từ `bīraṇatthambaka` ở `dn24:1.7.20`/`1.8.5`/`1.8.11`/`1.9.2` đã dịch *bụi cỏ hương bài*, và `bīraṇa` ở `dhp335`/`dhp337` là loài cỏ. Nay *"suốt một năm ở bụi cỏ hương bài;"*. Tên phẩm `0.3` *Phẩm Bīraṇathambha* giữ (quy ước tên phẩm chung của 10 bài). Giữ `2.1`–`2.4` khớp `ja323`. Bất định giữ: `1.3` `byākāsi saññaṁ` (*nêu rõ sự nhận biết*; truyện chú giải kể người nói lỡ lời ngược ý, Pāli kệ không đủ để chốt), `1.4` `niyyamo`. Ghi cho người biên tập: `ja323:1.1` *sẽ gặp* khác `ja211:2.1` *gặp* dù Pāli `nigacchati` như nhau.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :3.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").

