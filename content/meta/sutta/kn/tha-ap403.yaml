notes: |-
  Bản dịch dựng từ Pāli root, đối chiếu với tiền lệ trong chính tầng `tha-ap` vì commit đã ghim không có bản
  Anh Sujato, không có bản Việt hiện hành phân đoạn và không có lớp English của dự án cho bài này. Nghĩa các chỗ
  khó (người nói ở `:4`–`:12`, `devate`, `hetudhamma`) được đối chiếu thêm với bản Việt nguyên bài ở mục Tra cứu
  toàn văn cuối trang (nguồn ngoài, không phân đoạn, không phải tầng store); không sao chép câu chữ từ đó.
