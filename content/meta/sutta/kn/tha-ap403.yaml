  TÊN PHẨM `:0.3` — `translationTitle` bằng đúng `:0.3`. Pāli `Tissametteyyattheraapadāna` không bắt đầu bằng số
  nên BỎ số thứ tự (không thuộc nhóm THỪA). Mẫu câu đo được trên 511 tệp `tha-ap` đã có `:0.3` (cây chính cộng
  worktree): *Bài Kệ Tuyên Ngợ Về* 163, *Bài Kệ Tuyên Ngôn Về* 99, *Ký Sự Về* 91, còn lại là dạng có số thứ tự đứng
  trước. Hai phạm vi cho hai đa số khác nhau: cửa sổ tha-ap380–440 là *Ký Sự Về* 18 (cộng 3 có số) / *Tuyên Ngợ* 9 /
  *Tuyên Ngôn* 2; cửa sổ gần nhất tha-ap395–420 là *Ký Sự Về* 12/12 (9 không số, 3 có số). `Tuyên Ngợ` là chính tả
  đáng ngờ (Pāli không có chữ nào tương ứng), nên bài này dùng *Ký Sự Về Trưởng Lão*, khớp tha-ap404 cùng phẩm và
  `:30.1` *Ký sự về Trưởng lão …, thứ nhất*. Đề nghị người biên tập phán một lượt cho cả cuốn.

  `:0.1` `Therāpadāna` giữ nguyên Pāli (500 khoá, so với *Trưởng Lão Ký Sự* 11). `:0.2` `Metteyyavagga` → *Phẩm
  Metteyya* (3 khoá có tiền lệ, cùng cách với tha-ap404).

  THUẬT NGỮ VÀ TIỀN LỆ:
  - Đại từ: *ta* xuyên suốt cho người kể (Sobhita) và cho Đức Padumuttara khi Ngài nói, theo đa số tầng (chữ *Ta*
    viết hoa giữa câu chỉ 12 lần so với 791 *ta*); phân biệt người nói bằng cấu trúc nháy. Người kể xưng *ta* cả khi
    nói với Đức Phật (`:8`, `:10`, `:12`, `:13`), theo tiền lệ tầng, chưa nhận ra Ngài ở `:4`–`:5`.
  - Pāli trùng nguyên văn với khoá đã dịch ở bài khác: 47 khoá dò được, 41 khoá dùng lại nguyên văn (so không phân
    biệt hoa thường và dấu cuối dòng), 6 khoá khác vì vị ngữ hoặc chủ ngữ khác: `:1.4` (chủ ngữ là đạo sĩ, không phải
    Đức Phật như ở tha-ap404), `:11.3`/`:25.3` (bỏ *Ta* đầu câu vì chủ ngữ đã nêu ở `:11.1`, `:25.2`), `:13.2` (bài khác
    đứng sau một vế có động từ, ở đây phải thêm *đã dâng*), `:16.1`, `:16.3`.
  - `Mama nijjhāyamānassa` (`:16.1`) → *Trong khi ta đang chăm chú nhìn*: tầng có hai dạng, *Khi tôi đang sống an nhàn*
    (tha-ap441, tha-ap446) và *trong khi tôi chăm chú nhìn* (tha-ap421). Chọn dạng sau vì `nijjhāyati` là nhìn chăm
    chú, và `:16.4` `pekkhanto` đang nhìn cùng cảnh; *sống an nhàn* không có căn cứ trong Pāli. Báo người biên tập
    vì tha-ap441 và tha-ap446 (ngoài lát này) có thể cần xét lại.
  - Công thức chung `:17.1`–`:17.2` (Padumuttara…), `:18.3`, `:19.2`, `:19.4`, `:22.1`–`:22.4`, `:23.1`–`:23.4`, `:24.4`, `:26`–`:28`
    dùng nguyên văn đa số toàn tầng (ví dụ `Kilesā jhāpitā mayhaṁ` 107 khoá, `Paṭisambhidā catasso` 497 khoá).
  - `sahassakkhattuṁ rājā ca` (`:19.3`) → *và một ngàn lần làm vua*, theo tiền lệ 2 khoá.
  - `Khāribhāraṁ` → *một gánh khārī* (giữ đơn vị đo, tiền lệ 1 khoá); `tindukaphala` → *quả tinduka*;
    `phalaṁ` chung → *trái cây*. `pavattaphala` → *trái cây rụng* (tiền lệ `pavattaphalabhojihaṁ`).
  - `ajinacamma` → *da nai* (tiền lệ *y da nai*); `nātha` → *bậc Hộ Chủ*; `lokanāyaka` → *bậc Dẫn Đạo Thế Gian*
    (60 khoá); `mahāvīra` → *bậc Đại Anh Hùng* (13 khoá); `mahāpuñña` → *bậc phước lớn*; `mahesi` → *Đại Ẩn Sĩ*;
    `khattiya` → *Sát-đế-lợi* (52 khoá); `Veda` giữ *Veda* theo `tiṇṇaṁ vedāna pāragū` (2 khoá *ba Veda*, 2 khoá *ba Vệ Đà*).
  - `Sabbāsavaparikkhīṇo natthi dāni punabbhavo` → *tái sinh* (7 khoá, so với *tái sanh* 1 khoá).
  - Lời kết `:29.1` dùng nhóm số nhiều *đã nói những bài kệ này* (Pāli `imā gāthāyo`; 407 khoá, so với 21 khoá
    *bài kệ này* số ít). `Itthaṁ sudaṁ` → *Tôi nghe như vầy*.
  - Pāli trùng nguyên văn trong chính bài: 3 nhóm (`:3.1`/`:17.1`, `:3.2`/`:17.2`, `:11.3`/`:25.3`), bản Việt của cả ba nhóm
    giống nhau, 0 cặp lệch.
  - Nháy: Pāli mở “ ở `:1.1` và đóng ” ở `:28.4`, cố ý chạy qua khoá; các lời thoại lồng ‘…’ ở `:4`, `:5`, `:7`, `:8`, `:9`, `:10`,
    `:11`, `:12` và `:18.1`–`:23.4`. Đối chiếu từng khoá: 0 lệch trên 117 khoá (kể cả nháy đơn). `:13` không có nháy trong
    Pāli nên lời mời ngồi ở `:13.3`–`:13.4` không có nháy trong bản Việt.
  - Số Pāli: `Pañcavīsatikkhattuṁ` = pañca 5 + vīsati 20 = 25 → *hai mươi lăm lần* (tiền lệ 1 khoá); `sahassa` = 1000
    → *một ngàn*; `tisso vijjā` = ba minh; `catasso` = bốn; `aṭṭhime` = tám giải thoát; `chaḷabhiññā` = sáu thắng trí;
    `tiṇṇaṁ vedāna` = ba Veda; `tayo ete` = ba điều này; `ubho` = cả hai. Không có `Tiṁsakappasahassa` trong bài.
    Pāli trong bài không có dấu lược `…` nên bản Việt không có `…`.

  BẤT ĐỊNH — để người biên tập phán, không thêm vào thân kinh:
  1. Người kể là chính Sobhita (`ahaṁ` ở `:2.2`) nhưng `:1.2` gọi vị đạo sĩ ở ngôi thứ ba (`sobhito nāma tāpaso`); câu Việt
     không thêm *ta là*, để nguyên cấu trúc của Pāli.
  2. `pabbhārakūṭaṁ` (`:1.1`): dịch *mỏm đá nhô ra* theo tha-ap404 (cùng phẩm); có thể là tên địa điểm.
  3. `aggiṁ dāruṁ āharitvā` (`:2.1`): dịch *mang lửa và củi đến*; cũng có thể hiểu `aggiṁ` ở đây chỉ *củi nhóm lửa*
     (`aggidāruka` ở `:4.2`, `:5.4`); chọn dạng không gộp.
  4. Người nói `:4.1`: Đức Padumuttara (xin củi, tự nhận *chăm sóc lửa*) và đạo sĩ trả lời ở `:5`; Đức Phật nhận lời ở `:6`
     rồi tự nhóm lửa. Đây là cách đọc dựa theo mạch kể, vì Pāli không có chỉ dấu người nói ngoài nháy.
  5. `Subhaddako tvaṁ manuje, devate tvaṁ pajānasi` (`:5.1`–`:5.2`) có hai cách hiểu: `devate` là hô cách (*hỡi vị thần*)
     như đã dịch, hoặc tân cách số nhiều (*ngài biết rõ chư thiên*); `manuje` là vị cách (*giữa loài người*) như đã dịch,
     hoặc hô cách. `Subhaddaka` dịch *hiền thiện* (`subhadda` = rất tốt lành), 0 tiền lệ trong tầng.
  6. `Na tattha kaṭṭhaṁ pajjhāyi` (`:6.3`): Pāli không nói củi của ai; câu Việt để *củi ở đó* và không thêm chủ sở hữu.
  7. `Hetudhammanirodhāya` (`:9.1`): dịch *để diệt tận các pháp làm nhân*; `hetudhamma` có thể hiểu là *pháp thuộc về nhân*
     hay *pháp sinh từ nhân*; 0 tiền lệ trong tầng. `kilesasamaṇāya` dịch *làm lắng dịu phiền não*.
  8. `Ācārapaṭipatti` (`:10.3`) dịch *nếp hành xử và sự thực hành*: 0 tiền lệ.
  9. `deva` (`:12.3`) là hô cách, dịch *hỡi bậc Thiên Tôn*: 0 tiền lệ (chữ *Tôn* nhằm cách xưng hô tôn kính, không có trong
     Pāli); `dukkhassantakaro tuvaṁ` (`:12.4`) dịch như một khẳng định riêng, theo tiền lệ 1 khoá; cũng có thể nối vào vế
     *nếu ngài là…* ở `:12.1`.
  10. `vataṁ` (`:7.3`) dịch *việc hành trì*; `pāṭiheraṁ` (`:6.4`) dịch *thần thông*.
  11. `Tassa saṅkappamaññāya … Puññakammena saṁyuttā, nibbattissanti` (`:20`–`:21`): chủ ngữ ngữ pháp là thức ăn, nước uống,
      y phục, giường nằm; câu Việt giữ cấu trúc nối bằng dấu chấm phẩy, không thêm chủ thể đang *biết* ý định. `tāvade` dịch
      *ngay lúc ấy*.
  12. `Varadhammamanuppatto` (`:25.1`) dịch *Pháp cao quý*; `rāgadose samūhaniṁ` dịch *nhổ sạch tham và sân*.

