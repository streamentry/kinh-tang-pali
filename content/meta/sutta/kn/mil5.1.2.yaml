  **Bất định đã phân xử, ghi lại để biên tập xem lại.**
  (1) Khoá `1.5` `vāhasataṁ … aḍḍhacūḷañca vāhā vīhisattambaṇāni dve ca tumbā`: các đơn vị `vāha`, `ambaṇa`, `tumba` giữ dạng Pāli; `aḍḍhacūḷa` không có tiền lệ nào trong tầng (0 khoá) và tôi không phân xử chắc được nghĩa (nửa-cūḷa? một số cụ thể?), nên để nguyên, không quy ra số. `lakkhaṁ ṭhapīyamānā` dịch `được đặt làm dấu đếm` (đọc `lakkha` là dấu/mốc để đếm, mỗi hạt lúa tương ứng một dấu); đây là cách đọc, không phải nghĩa đã kiểm chứng. Pāli kết bằng dấu hỏi nhưng động từ là `gaccheyyuṁ` (kiểu giả định, không có từ nghi vấn); tôi dịch thành câu khẳng định (`sẽ đi đến chỗ cạn kiệt, hết sạch`) thay vì câu hỏi, hiểu là so sánh: số hạt ấy cạn hết trước khi đếm xong số tâm khởi trong một cái búng ngón tay. Nếu người biên tập hiểu là câu hỏi thì phải sửa dấu câu.
  (2) Khoá `2.1`/`3.1`… `vibhattamāpajjati`: dịch `được phân biệt`, nghĩa là mỗi loại tâm được trình bày riêng; cách đọc `đi vào sự phân chia` cũng có thể đúng nhưng không đổi nghĩa chính.
  (3) Khoá `3.2`/`4.2`/`5.2` `tīsu/pañcasu/dasasu ṭhānesu`: dịch sát `ở ba/năm/mười chỗ`. Pāli không nói `chỗ` ấy là gì (có thể là ba kiết sử đã đoạn, năm, mười), và tầng không có tiền lệ cùng ngữ cảnh; canonical text giữ nguyên chữ `chỗ`, không thêm lời giải thích.
  (4) Khoá `3.2` `diṭṭhippatta`: dịch `đã đạt kiến` giữ đúng chữ, không thêm `chánh`; hơn nữa `diṭṭhippatta` là thuật ngữ chỉ một hạng thánh nhân (`dn33:2.3.44` `vị đạt kiến`), nhưng ở đây chỉ đi cùng `sotāpanna` như một đặc điểm, nên không biến thành danh hiệu.
  (5) Khoá `6.7` `agahanattā vaṁsassa`: dịch `vì cây tre không có chỗ rối rậm`; `gahana` còn có thể là `rậm` hay `bụi`, nên đây là cách đọc, không chắc.
  (6) Khoá `7.7` `tiṇṇattā sakavisayassa`: dịch `phạm vi của mình đã được vượt qua`; `tiṇṇa` là `đã qua` hoặc `đã vượt`, nghĩa `con sông thuộc phạm vi của mình đã được lội qua nhiều lần` hợp ngữ cảnh nhưng Pāli không nói hết.
  (7) Khoá `9.1` `asaṅkhyeyyena guṇena`: dịch `gấp vô số lần`, hiểu `guṇa` là bội số; nếu `guṇa` ở đây là `phẩm tính` thì câu là `nhờ một phẩm tính không thể đếm`, nghĩa khác nhẹ. Canonical text giữ cách thứ nhất vì đi sau `gaṇanaṁ atikkamitvā` (vượt qua sự tính đếm).
  (8) Khoá `10.1`, `11.4` `āvajjanavikalamattaka`: dịch `thiếu hụt hướng tâm` / `chỉ thiếu mỗi sự hướng tâm`, song song với `bhojanavekallamattaka` (`11.2`) và `patitaphalavekallamattaka` (`12.1`); nghĩa của cả ba là `chỉ thiếu một thứ ấy mà thôi`, và `āvajjana` dịch `sự hướng tâm`; tầng chỉ có `snp4.13:6.2` (`sāvajja`, nghĩa khác) nên không có tiền lệ cho `āvajjana`.
  (9) Khoá `11.2` danh sách vật dụng: `pubbaṇṇāparaṇṇa` dịch `các loại ngũ cốc chính và phụ` (0 tiền lệ; không phân xử chắc là `đầu mùa và cuối mùa` hay `chính và phụ`); `khaḷopikumbhipīṭharakoṭṭhabhājanagatā` dịch `được chứa trong các vại, chum, thùng, kho và đồ đựng` (`khaḷopi`, `pīṭhara` 0 tiền lệ nên tên đồ đựng chỉ là ước lượng). `aḍḍhassa mahaddhanassa mahābhogassa` dịch `giàu có, nhiều của cải, nhiều tài sản`; `pahūtadhanadhaññassa` dịch `nhiều tiền của và lúa thóc`.
  (10) Khoá `11.3` `akāle bhojanavekallaṁ`: dịch `thiếu thức ăn vào lúc không đúng thời`; `akāle` có thể là `trái giờ ăn` hoặc `bất ngờ`, đều hợp.
  (11) Khoá `8.8` Pāli không có nháy đơn hay kép quanh lời đáp của vua (`sukhumattā … balavattāti`); bản Việt cũng không thêm nháy, nên đọc liền như lời tự hỏi tự đáp trong lời của Nāgasena.
  (12) Khoá `14.3` `sampaṭicchāma`: dịch `chúng tôi chấp nhận`, giữ ngôi số nhiều của Pāli.

  **Lỗi bản nháp đã bắt:** nháy kép đầu ở `1.5`, `11.2`, `11.4` bản nháp đầu bỏ sót (Pāli có `“` mở); phép kiểm nháy từng khoá bắt được 3 khoá lệch, đã sửa. Khoá `11.2` bản nháp đầu viết `nên người ấy phải lấy gạo` (thêm nhân quả `nên … phải` mà Pāli không có) và `phải bị gọi là`; đã sửa thành `người ấy lấy gạo từ trong chum ra rồi nấu cơm` và `được gọi là`. Khoá `12.1` bản nháp đầu viết `trĩu xuống … nặng trĩu` lặp chữ; đã sửa `cúi cong xuống, mang nặng từng chùm quả`. Khoá `8.5` bản nháp đầu đảo thứ tự `ajimha avaṅka akuṭila` (viết `không cong, không vẹo, không queo`); đã sửa theo Pāli `không vẹo, không cong, không quanh co` và theo `mil7.8.7`. Khoá `9.1` bản nháp đầu dịch `guṇena` là `một phẩm tính không thể đếm`; đã đổi sang cách đọc bội số (xem bất định 7).

  `technical_integrity` 9.6 vì lát này không được chạy cổng. Bốn lệnh còn lại do coordinator chạy trước khi publish: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
