  **Số Pāli, tự tính.** `sattavidhā cittā` = 7 loại tâm; khoá kết `paṭhamaṁ … sattamaṁ cittaṁ` đếm đúng 1 đến 7 ở `2.10`, `3.11`, `4.10`, `5.10`, `6.10`, `7.10`, `8.11`; `channampi cittānaṁ` ở `9.1` = 6 loại tâm còn lại (7 − 1 = 6, khớp). `tīsu ṭhānesu` = 3, `pañcasu ṭhānesu` = 5, `dasasu ṭhānesu` = 10; `tipabbagaṇṭhi` = 3 đốt, `pañcapabbagaṇṭhi` = 5 đốt, `dasapabbagaṇṭhi` = 10 đốt, ba nhóm khớp ba nhóm chỗ ở từng khoá. `pañcorambhāgiyāni saṁyojanāni` = 5 hạ phần kiết sử. `dasabaladharā` = mang 10 sức mạnh, `catuvesārajja` = 4 điều không sợ hãi, `aṭṭhārasahi buddhadhammehi` = 18 pháp của bậc Phật. `vāhasataṁ` = 100 vāha, `vīhisattambaṇāni` = 7 ambaṇa, `dve tumbā` = 2 tumba; đơn vị đo `vāha`, `ambaṇa`, `tumba` giữ nguyên dạng Pāli, không quy ra số hiện đại. Không có cụm số nào thuộc loại chưa phân xử được (`Tiṁsakappasahassa`).

  **Tiền lệ (đếm trên tầng vi hiện có, loại tệp này).**
  Pāli trùng nguyên văn với các bài khác: đã dò 98 khoá, 24 khoá có Pāli trùng ở nơi khác (`0.1`, `0.2`, `0.3`, `2.4` và 20 khoá `Kiṁ kāraṇā?`); bản Việt của cả 24 khoá đều trùng với ít nhất một bản đã có, 0 khoá khác hết. `0.1` `Milindapañha` giữ nguyên (223 trong 235 khoá; còn `Mi-lan-đà Vấn Đạo` 8, `Mi-tiên Vấn Đáp` 3). `0.2` `Meṇḍakapañha`: toàn tầng để trần 32, `Phẩm Meṇḍakapañha` 7, `Câu Hỏi Nan Đề` 4; nhưng 7/7 bài `mil5.1.*` còn lại dùng `Phẩm Meṇḍakapañha` — theo phạm vi gần nhất, nên ở 1 trong 24 khoá trùng bản Việt khác đa số toàn tầng, có chủ ý. `0.3` `Phẩm Iddhibala` 7/7. `0.4` giữ số thứ tự `2.` như các bài `mil5.1.*` khác. `Kiṁ kāraṇā?` → `Vì cớ gì?` (2 trong 4 khoá cùng câu; còn `Vì cớ sao?` 1, `Vì lý do gì?` 1; chọn dạng đa số, gần nhất với `mil5.1.4`).
