notes: |-
  Bản dịch tiếng Việt mới cho vv50 (Chuyện Cung Điện Rajjumālā, thứ mười hai, kết thúc Phẩm Mañjiṭṭhaka và phần Itthivimāna), dịch từ Pāli root: 141/141 khoá khớp tiền tố `vv50:`, thứ tự khoá đúng thứ tự Pāli. Không có tầng tham khảo tiếng Anh hay tiếng Việt truyền thống ở commit đã ghim, nên mọi chỗ khó do Pāli và ngữ cảnh bài tự phân xử.

  **Coverage English theo công thức của `source/layers.yaml`** (Pāli có nội dung ≥ 40 ký tự, loại khối `:0`): mẫu số là **0** khoá — mọi khoá đều là kệ ngắn hoặc tiêu đề (khoá dài nhất là `34.4`, 30 ký tự). Với mẫu số 0, cổng coverage **không đo được gì**; điều đó khác với "không cần ghi nhận". Có blocker nên bài giữ `draft`; `content/meta/reference-gaps.yaml` do người điều phối ghi nhận bằng `npm run reference:gaps`.

  **Năm phép kiểm.** (1) Tập khoá Việt = tập khoá Pāli, 141/141, cùng thứ tự. (2) Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá, 0 lệch trên 141 khoá (Pāli mở nháy kép ở 1.1, đóng ở 7.4; mở ở 8.1, đóng ở 31.6; nháy đơn mở và đóng ở 11.4). (3) Pāli trùng nguyên văn trong chính bài: 7 nhóm (`2.1`/`3.1`, `2.2`/`3.2`, `4.3`/`5.3`, `4.4`/`5.4`, `15.3`/`19.3`, `3.4`/`6.2`, `11.4`/`13.3`); 5 nhóm Việt giống hệt; 2 nhóm Việt khác chỉ ở dấu câu theo đúng Pāli (`3.4` kết `.` còn `6.2` kết `;`; `11.4` nằm trong nháy đơn kết `’.` còn `13.3` kết `,` không nháy). (4) Dấu lược: Pāli không có `…pe…` hay `(…)` ở khoá nào, Việt cũng không có `…` nào. (5) Số Pāli: `saṭṭhitūriyasahassāni` (24.1) = saṭṭhi 60 × sahassa 1.000 ⇒ *sáu mươi ngàn nhạc cụ* (đúng như `vv18:9.3`, cùng cấu tạo); `pañcaṅgike` (4.4, 5.4) = năm phần; `tidasānaṁ` (29.2) giữ *Ba Mươi Ba* theo quy ước của chính câu này ở `vv18:14.4`, `pv26:19.4` (nghĩa đen `tidasa` là ba mươi; hai khoá này đọc là cõi Ba Mươi Ba); `dvādasamaṁ` (32.1) = thứ mười hai; `catuttho` (35.1) = thứ tư. Không có phép nhân thang lớn nào. Ngoài ra kiểm NFC, khoá rỗng, khoảng trắng thừa, Pāli lọt sang Việt: 0 lỗi (trừ tên riêng, tên nhạc cụ/thiên nữ và tên cây cố ý giữ nguyên Pāli: Vimānavatthu, Mañjiṭṭhaka, Rajjumālā, Gayā, mañjūsaka, udumbara, Āḷamba, Gaggara, Bhīma, Sādhuvādī, Saṁsaya, Pokkhara, Suphassa, Vīṇāmokkhā, Nandā, Sunandā, Soṇadinnā, Sucimhitā, Alambusā, Missakesī, Puṇḍarīkā, Dāruṇī, Eṇīphassā, Subhaddā, Muduvādinī, Nandana).

  **Tra tiền lệ (đếm trên toàn tầng `kn` đã dịch).** 73 khoá Pāli của bài trùng (đã bỏ dấu câu, không phân biệt hoa thường) với khoá đã dịch ở nơi khác; 58 khoá dùng lại nguyên văn (kể cả dấu câu), 15 khoá khác nguyên văn: 9 khoá chỉ khác dấu câu vì Pāli ở bài này kết `;` hay `.` khác (`24.2`, `26.2`, `26.4`, `27.2`, `28.2`, `28.4`, `29.2`, `29.4`, `30.2`) và 6 khoá khác có chủ ý do đổi ngôi hoặc ngữ cảnh (`10.4`, `12.1` *Tại đó tôi đã thấy*, `13.1`, `21.3`, `23.1` *Tôi nay*, `23.2`). Ba nhóm kệ trùng được dùng lại: kệ `2–6` theo `vv44:2–6` (cùng phẩm, Pāli trùng, bản Việt ở đó đã đọc đúng: *nàng đang múa*, *đồ trang sức nơi bím tóc*, *nhạc năm phần*); riêng `7.1–7.2` không còn theo `vv44` nữa (xem mục bất định và mục lượt cải thiện); kệ `25–30` theo `vv18:10–16` và `pv26:19–21` (tên thiên nữ và lời mời múa hát); kệ `31.1–31.5` theo `vv47:13`. Cần báo (không sửa vì ngoài lát): `vv38:2–7` cùng Pāli mà bản Việt có lỗi nghĩa rõ — *bà ấy* cho `tassā te naccamānāya`, *cây đàn* cho `piḷandhanā`, *trống năm mặt* cho `pañcaṅgike` (3 khoá, so với *nhạc năm phần* 2 khoá, `vv44:4.4`, `vv44:5.4`), *thơm ngon* cho `sucigandhā`, và `Ghāyase taṁ sucigandhaṁ` thành mệnh lệnh *hãy hít lấy*.

  **Thuật ngữ kèm số đếm.** `dāsī` ⇒ *nữ tỳ* (2 khoá trong `vv`/`pv`/`ja`, gồm `vv18:5.2`) so với *nữ nô* (2 khoá, gồm `vv39:6.2`): chọn *nữ tỳ* theo `vv18`, vì tên bài `vv18` đã là *Cung Điện Nữ Tỳ*. `muni` ⇒ *Mâu-ni* (hàng chục khoá `bv`/`pv`/`snp`) so với *bậc ẩn sĩ*, *bậc hiền sĩ* (4 khoá `iti`/`ja`). `saṁvego` ⇒ *nỗi xúc động* theo `ja501:23.1` (cùng cụm `Tassa me ahu saṁvego`). `puññakhetta` ⇒ *phước điền* theo `ja497:21.2`. `dakkhiṇeyya` ⇒ *đáng cúng dường* (nhiều khoá `cp`, `kp6:6.3`). `0.1` Vimānavatthu giữ Pāli (78 tệp khác); `0.2` *Chuyện Cung Điện Nữ Hư Không* (46 khoá khác, so với *Thiên Cung Nữ* 1 và *Thiên Cung Của Nữ Giới* 1); `0.3` *Phẩm Mañjiṭṭhaka* (10 khoá khác). `33.1` Tassuddānaṁ ⇒ *Tóm lược:* (81 khoá cùng dạng ở `cp`/`vv`/`pv`); `34.5` ⇒ *Phẩm ấy vì vậy được gọi tên là vậy.* theo 4 khoá cùng Pāli (`pv35:14.5`, `vv17:10.5`, `vv28:9.7`, `vv38:12.5`); `35.1` ⇒ *Phẩm Mañjiṭṭhaka, thứ tư* theo khuôn `vv38:13.1` (*Phẩm Cây San Hô, thứ ba*). `36.1` *Itthivimānaṁ samattaṁ* ⇒ *Cung Điện Nữ Hư Không đã hoàn tất*: chỗ này chưa có khoá cùng Pāli làm tiền lệ (khoá gần nhất là `vv85:13.1`, *Kinh văn Vimānavatthu đã hoàn tất*), chữ *Hư Không* theo quy ước tiêu đề của bộ chứ không có trong Pāli (`itthi` = nữ, `vimāna` = cung điện). `0.4` ⇒ *12. Chuyện Cung Điện Rajjumālā* theo khuôn `vv47:0.4`, `vv48:0.4`.

  **Tóm lược (`34.1–34.4`).** Danh sách mười hai cung điện của phẩm, giữ tên Pāli, tách từ các hợp từ: *Mañjiṭṭhā, Pabhassarā, Nāgā, Alomā, Kañjikadāyikā; Vihāra, Caturitthī, Ambā, Pītā, Ucchu, Vandana, Rajjumālā*. Số tên (12) khớp mười hai bài của phẩm (`vv39`–`vv50`); `Vihāra`, `Pītā`, `Ucchu`, `Vandana` khớp tên các bài `vv44`, `vv47`, `vv48`, `vv49`. `Caturitthī` đọc là *bốn người nữ* theo cấu tạo từ, không đọc sâu hơn; `Ambā` giữ tên.

  **Chỗ cần người biên tập phán (bất định, không đưa vào thân kinh):**
    - `9.2` `tajjanāya ca uggatā`: `uggatā` ở nghĩa *bị dồn ép, bức bách* được chọn theo mạch (bị chửi mắng, đánh đập, đe nạt rồi bỏ đi); tầng chưa có khoá nào dùng đúng dạng này trong nghĩa ấy (các khoá `uggata-` khác là *khổ hạnh mãnh liệt*, *vươn lên*, *vang lên*). Có thể đọc nhẹ hơn (*nổi giận / nổi cơn*), Pāli không phân xử dứt khoát.
    - `1.3–1.4` `Hatthapāde ca viggayha`: `viggayha` dịch *dang (tay và chân)*; đây là động tác múa. `suppavādite` là định cách tuyệt đối, dịch *khi nhạc được tấu hay*.
    - `7.1–7.2` `Ghāyase taṁ sucigandhaṁ, rūpaṁ passasi amānusaṁ`: **đã đổi ở lượt 2026-10-11** từ thể bị động không nêu người (*được ngửi thấy / được nhìn thấy*) sang chủ động ngôi hai (*Nàng ngửi thấy … nàng nhìn thấy …*). Lý do: `passasi` là ngôi hai số ít chủ động không có nghĩa khác, `ghāyase` là ngôi hai trung thái; thể bị động là thêm một thể ngữ pháp mà Pāli không có. Nghĩa chấp nhận được: người hỏi nói với nữ thiên rằng nàng đang hưởng hương trời và hình sắc cõi trời của chính mình. Giữ làm bất định: chưa tra được chú giải để biết người xưa hiểu hai động từ này là chủ động hay bị động, nên không khẳng định đã dứt khoát; bản này theo hình thái của văn bản Pāli đã ghim. Khoá cùng Pāli ở `vv44:7.1–7.2` còn là thể bị động và `vv38:7.1`, `vv39:5.1` là mệnh lệnh *hãy hít lấy* — ba bài đó cần được đối chiếu lại (ngoài lát này, không sửa).
    - `8.3` `Appapuññā alakkhikā`: `alakkhikā` dịch *kém may mắn* (không có dấu hiệu may mắn); cũng có thể là *không có vẻ đẹp / phúc tướng*.
    - `9.4` `agañchiṁ udahāriyā`: `udahāriyā` đọc là *đi lấy nước* theo vai trò (người gánh nước), không thêm chi tiết.
    - `10.1` `vipathe`: dịch *nơi không có lối đi* (ngoài đường, chỗ không có đường đi).
    - `11.2` `āsumbhitvāna pādape`: dịch *quăng nó lên cây*; chủ thể bị quăng là sợi thòng lọng, Pāli không nêu rõ.
    - `14.1–14.2` `Pāsādikaṁ pasādanīyaṁ, vanā nibbanamāgataṁ`: `nibbana` đọc đồng thời là *không còn rừng* và là cách chơi chữ với `nibbāna`; dịch theo khoá cùng Pāli `thag15.2:3.2` (*từ rừng rậm đã đến nơi không còn rừng rậm*), không giải thích thêm.
    - `14.4` `nāyaṁ yādisakīdiso`: dịch *vị này không phải hạng người tầm thường*; `yādisakīdisa` là cách nói *hạng thế nào cũng được*.
    - `16.1` `Bhayabheravo`: dịch *đáng khiếp, đáng sợ* (khiến sinh sợ hãi, kinh động), không dịch là *sợ hãi và khiếp đảm* như danh từ ở `snp3.6:50.4`.
    - `20.3–20.4` `Dukkha nirodho maggo ca, Añjaso amatogadho`: `añjasa` (ngay thẳng, thẳng đường) và `amatogadha` bổ nghĩa cho con đường; dịch *ngay thẳng, thâm nhập vào bất tử*. Tầng có `amatogadhaṁ nibbānaṁ` ở `ps` dịch *Niết-bàn nhập vào bất tử*; ở đây đổi động từ cho đỡ nặng nhưng cùng một hướng nghĩa.
    - `22.2` `dassane avikampinī`: `dassana` dịch *cái thấy*; có thể là *thấy (Đức Phật)* hoặc *chánh kiến*, Pāli không phân xử dứt khoát, nên giữ từ trung tính.
    - `23.4` `madhumaddavaṁ`: không có tiền lệ trong tầng; đọc `madhu` (mật, ngọt) + `maddava` (dịu, mềm), dịch *thức uống ngọt dịu như mật*. Cần người biên tập xem lại nếu có nguồn chú giải.
    - `24.3–25.2`: `Āḷamba, Gaggara, Bhīma, Sādhuvādī, Saṁsaya, Pokkhara, Suphassa` giữ là tên riêng (đúng như khoá `vv18:10`); trong truyền thống chú giải có thể là tên nhạc cụ, Pāli ở đây không phân xử dứt khoát. `Vīṇāmokkhā ca nāriyo` dịch *cùng các nữ nhân* theo `vv18:10.4`.
    - `26.2` `puṇḍarīkātidāruṇī`: viết liền; đọc `puṇḍarīkā` + `ti` + `dāruṇī` theo `vv18:11.4`, dịch *Puṇḍarīkā và Dāruṇī*; không đọc `ati` thành nghĩa riêng.
    - `27.1–27.2` `Etā caññā ca seyyāse, accharānaṁ pabodhikā`: giữ nguyên cách đọc của `vv18:12.3–12.4` (*nơi giường nằm … là các tiên nữ đánh thức*); đây là chỗ **nghi nhất** của bài: dạng `seyyāse` chỉ xuất hiện đúng hai khoá trong toàn tầng Pāli (`vv18:12.3`, `vv50:27.1`) nên không có tiền lệ để đối chiếu; đọc là *nơi giường nằm* thì dạng này không phải cách chia vị trí cách thông thường của `seyyā` (giường), còn đọc `seyyāse` là *bậc ưu việt* (số nhiều, dạng cổ) thì câu thành *những vị ưu việt trong hàng tiên nữ, là người đánh thức* — hợp với hình thái hơn nhưng phải đổi cả `vv18`. Không phân xử được bằng nguồn trong tầng nên GIỮ nguyên và nêu rõ, không đổi lẻ một bài; cần người biên tập phán.
    - `30.3` `sahabyakāmānaṁ`: *mong muốn được cùng chung sống* theo `vv18:16.1`, `pv26:21.1`; Pāli không nêu cùng sống với ai.
    - `31.4` `ākarā`: dịch *cội nguồn* (mỏ, nơi phát sinh) của các phước điền.

  **Lượt cải thiện 2026-10-11 (kiểm toán đối kháng bản đã `published`).** Đọc lại cả 141 khoá theo cặp Pāli↔Việt, kèm đối chiếu họ lỗi `vv` đã biết: (a) hô cách `devate` (1.2, 7.3) đã là *này thiên nữ / này nữ thiên*, `Rajjumāle` (17.3) là *Này Rajjumālā*: đúng; (b) người nói: 1.1–7.4 là người hỏi, 8.1–31.6 là nữ thiên (*tôi*), 17.3, 20.1 là Đức Thế Tôn nói với nàng (`maṁvoca`): đúng, không có chỗ nào đảo; (c) vật/thú/đá quý: `kuṭa` (bình), `pāsa` (thòng lọng), `sīha` (sư tử), `odumbara` (hoa udumbara), `mañjūsaka` (giữ tên cây), `dāsī` (nữ tỳ, không phải *mẹ chồng* hay tên người), `madhumaddava` — không có tên vật bị đọc sai thành tên người hoặc ngược lại; (d) thì và phủ định: `agañchiṁ` quá khứ, `marissāmi` tương lai, `bhavissati` (15.4) là suy đoán *hẳn là*, `nayidaṁ akatapuññānaṁ` (28.3) là phủ định đúng, `natthi` (29.4) đúng; (e) số: `saṭṭhitūriyasahassāni` 60 × 1.000, `pañcaṅgika` năm phần: đúng; (f) công thức `idha mijjhati`, `Tenamhi`, `pokkharaṇī`, `ucchu`, `saññamā`, `padīpiya` không có trong bài này. **Một chỗ sai thật**: `7.1–7.2` (2 khoá/141) — thể bị động *được ngửi thấy / được nhìn thấy* mà Pāli không có (`passasi` chỉ có thể là ngôi hai số ít chủ động); đã đổi sang *Nàng ngửi thấy … nàng nhìn thấy …*, loại lỗi: ngôi/thể động từ, mức vừa (làm đổi người thực hiện hành vi cảm nhận nhưng không đảo nghĩa cả khổ kệ), điểm `semantic_fidelity` 9,10 → 9,00 vì bản trước đã tuyên bố "Pāli không phân xử" trong khi hình thái phân xử được. Các chỗ nghi nhưng KHÔNG đổi: `27.1` `seyyāse` (xem mục bất định, không có tiền lệ nào ngoài `vv18`), `25.2` `Vīṇāmokkhā ca nāriyo` (đọc *cùng các nữ nhân* theo `vv18`; cũng có thể là hai tên *Vīṇā* và *Mokkhā* cùng các nữ nhân kể ngay sau, nên `nāriyo` làm đề mục cho danh sách tên nữ ở 25.3–26.4), `0.2` và `36.1` *Nữ Hư Không* (không có `ākāsa` trong Pāli; tiêu đề phẩm lặp ở nhiều tệp `vv` nên không sửa lẻ một tệp, cần sửa cả bộ). Không điểm nào khác đổi: `terminology`, `vietnamese_clarity`, `han_viet_balance`, `ambiguity_integrity` giữ nguyên vì không có cải thiện cụ thể nào tương ứng; `triangulation` vẫn 7,5 (không có bản Anh độc lập). Bốn lệnh cổng kỹ thuật vẫn chưa chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

