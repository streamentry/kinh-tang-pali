notes: |-
  Dịch trực tiếp từ Pāli root, đủ 89/89 khoá, đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài này không có tầng Anh đã ghim nên không có đối chiếu English độc lập; xem blocking_errors.

  Tiền lệ: dựng chỉ mục Pāli sang Việt trên toàn tầng tha-ap (482 tệp ngoài bài này). 27/89 khoá có Pāli trùng (bỏ dấu câu, không phân biệt hoa thường) với khoá của bài khác; tổng 2.287 cặp trùng đã dò, 473 cặp trong đó bản Việt của tầng khác với bản ở đây. 19 khoá dùng lại đúng cách dịch chiếm đa số của tầng (0.1, 0.2, 7.3, 8.4, 9.2, 9.4, 10.1, 10.2, 12.3, 12.4, 13.2, 13.3, 13.4, 14.3, 20.1, 21.1, 21.2, 21.3, 21.4). 8 khoá khác đa số của tầng, có lý do: 1.3 (4 tiền lệ đều khác nhau, trong đó chăm lo nghề làm ruộng không có căn cứ trong Pāli parakammāyane yutto; dịch sát chữ); 3.1 (2 tiền lệ cùng Pāli ghi giáo pháp để trao ban và tôn thờ giáo pháp, đều lệch nghĩa deyyadhamma là vật đáng dâng cúng; một khoá gần giống trong tầng dịch vật gì để dâng cúng nên theo dạng đó); 8.2 (đa số 3/16 viết ta đã làm ra vương quyền nơi chư thiên; giữ nguyên cấu trúc, chỉ đổi đại từ ta sang tôi cho đúng người kể trong bài); 8.3 (1 tiền lệ ghi niềm hạnh phúc ở cõi thiên; Pāli chỉ có dibbasukhaṁ nên bỏ niềm, và dùng cõi trời cho nhất quán với 7.4 và 10.1); 9.1 (2 tiền lệ ghi Lại thêm ... nữa, thêm hai chữ không có trong Pāli, trong khi ca chỉ là và); 9.3 (đa số 13/16 viết Vương quốc rộng lớn ấy, còn 3/16 viết Vương quyền cai quản các vùng đất rộng lớn; chọn dạng thứ hai vì padesarajja là quyền cai quản một vùng và Pāli không có từ ấy, tha-ap421 và tha-ap422 cùng dạng); 14.4 (1 tiền lệ ghi chỗ hủy diệt; vinipāta là đọa xứ theo công thức apāyaṁ duggatiṁ vinipātaṁ nirayaṁ, tầng dịch cõi dữ, ác thú, đọa xứ, địa ngục); 20.3 (405 cặp trùng, dạng chứa đọa xứ chiếm 203 khoá, khổ đau 144, khổ xứ 51; chọn đọa xứ vì duggati là cảnh giới xấu, không phải nỗi khổ nói chung, và khớp tha-ap27:5.3; trong công thức văn xuôi duggati được dịch ác thú, còn ở lời kệ tha-ap tầng quen dùng đọa xứ nên theo quy ước kệ). Trong chính bài có 3 cặp Pāli trùng (7.2 với 12.2; 12.4 với 13.2; 14.3 với 20.1), cả ba Việt khớp nhau và chỉ khác dấu câu hoặc chữ hoa đầu dòng theo Pāli (12.4 kết dấu chấm, 13.2 kết dấu chấm phẩy).

  0.3 và 23.1: Pāli 0.3 là Pañcasīlasamādāniyattheraapadāna, KHÔNG bắt đầu bằng số thứ tự nên không thêm số (toàn tầng tha-ap: không số 337, có số 144); translationTitle bằng đúng giá trị 0.3. Tên bài nhận khuôn Bài Kệ Tuyên Ngôn Về Trưởng Lão cộng tên. Ba dạng chính tả đo được trên khoá 0.3 của tầng tha-ap (ngoài bài này): toàn tầng Tuyên Ngợ 240, Tuyên Ngôn 121, Ký Sự 103, Tuyên Ngợi 10; ở phạm vi tha-ap22 đến tha-ap40 Tuyên Ngôn 7, Tuyên Ngợ 5, Tuyên Ngợi 2; trong phẩm Subhūti (tha-ap27 đến tha-ap32) Tuyên Ngợ 4, Tuyên Ngợi 2, Tuyên Ngôn 0. Toàn tầng và phẩm cho đa số Tuyên Ngợ nhưng đó là dạng sai chính tả; phạm vi gần nhất tha-ap22 đến tha-ap40 cho Tuyên Ngôn; chọn Tuyên Ngôn theo hướng dẫn của người điều phối và theo các bài tha-ap18 và tha-ap20 cùng đợt. Người biên tập nên phán một lượt cho cả cuốn. 23.1 kết thứ tư (catutthaṁ = thứ 4: tha-ap26 là bài thứ tư của phẩm Subhūti, tha-ap27 mang thứ năm). 0.2 Subhūtivagga dịch Phẩm Subhūti theo 6/6 tiền lệ cùng Pāli; 0.1 Therāpadāna giữ nguyên Pāli theo 470/481 tiền lệ. Công thức lời kết 22.1 theo nhóm Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (407 khoá), không phải nhóm số ít đã từng nói bài kệ này (21 khoá).

  Số Pāli, tự tính: vassasatasahassāni (5.1) = sata 100 x sahassa 1.000 = 100.000, dịch một trăm ngàn năm (tầng dịch kappānaṁ satasahassaṁ là một trăm ngàn); sahassayutto (6.3) = 1.000, dịch một ngàn; tiṁsakkhattuñca (8.1) = tiṁsa 30 + lần = ba mươi lần (tầng có tiṁsakkhattuṁ ahosahaṁ dịch ba mươi lần, và chattiṁsakkhattuṁ là ba mươi sáu lần, nên tiṁsa = 30 trong cụm này); pañcasattatikkhattuñca (9.1) = pañca 5 + sattati 70 = 75, dịch bảy mươi lăm lần (tầng có một tiền lệ cùng Pāli ghi bảy mươi lăm); pañcavassena (13.1) = 5 tuổi; tayo hetū (16.2) = 3; catasso (21.1) = 4; aṭṭhime (21.2) = 8; chaḷabhiññā (21.3) = 6; catutthaṁ (23.1) = thứ 4; pañcasīla, pañcasikkhāpada = 5. Cụm Tiṁsakappasahassa (30 hay 3 nghìn hay 300.000 kiếp, chưa phân xử được trong tầng) KHÔNG có trong bài này; chỉ tiṁsakkhattu ở 8.1 và đọc là 30 lần theo tiền lệ nêu trên.

  Thuật ngữ: sikkhāpada dịch học giới theo tầng (tôi thọ trì học giới tránh sát sinh, v.v.); sīla dịch giới; paṭisambhidā bốn vô ngại giải, 467 trên 480 khoá cùng Pāli; chaḷabhiññā sáu thắng trí, 55 trên 65; devindo chúa chư thiên; cakkavattī Chuyển Luân Vương (tôi từng làm Chuyển Luân Vương, khớp nguyên văn 9 tiền lệ); kappa kiếp; koṭi giữ nguyên koṭi theo tầng (một khoá dịch câu-chi, các khoá khác giữ koṭi); jina dịch bậc Chiến Thắng theo jinasāsana tầng (Đấng Chiến Thắng); tāvatiṁsa cõi trời Ba mươi ba (5 khoá ghi tôi, 13 khoá ghi ta). Người nói Pāli ahaṁ: toàn tầng tôi 2.166, ta 1.621; phạm vi gần nhất tha-ap22 đến tha-ap40 tôi 101, ta 40; bài này dùng tôi cho người kể, và ngài cho mārisa trong lời chư thiên (tầng có 14 khoá chứa mārisa, phần lớn dịch thưa Ngài). Dấu <b> bao quanh Jātiyā pañcavassena ở 13.1 là thẻ của nguồn Pāli, không đưa vào bản Việt (30/30 khoá tầng có <b> trong Pāli đều không mang thẻ sang Việt).

  BẤT ĐỊNH (không thêm vào thân kinh): (1) 17.1 đến 17.2 saṅkittento ca sabbesaṁ, adhimattañca porisaṁ: saṅkittento chỉ xuất hiện đúng một lần trong toàn bộ Pāli root đã ghim (hapax), sabbesaṁ không nêu rõ tất cả ai hoặc tất cả điều gì, porisaṁ có thể là sức mạnh con người hoặc phẩm chất trượng phu; dịch sát chữ Đang xưng tán tất cả và sức mạnh con người vượt bậc, KHÔNG giải thích thêm; đây là chỗ chưa chắc nhất của bài và cần người biên tập có chuyên môn Pāli xem lại. (2) 18.3 bhavesu yadi rajjeyyuṁ: rajjeyyuṁ có thể là rājeyyuṁ (cai trị, làm vua) hoặc rajjeyyuṁ từ rajjati (đam mê, đắm nhiễm); dịch nếu họ làm vua trong các cõi hữu theo mạch kinh (8.2, 9.2 nói về vương quyền) và vì câu hỏi vipāko kīdiso về quả báo; nếu đọc theo nghĩa đam mê thì nghĩa của câu đổi. (3) 19.2 bhatakena tapassinā: tapassī có nghĩa khổ hạnh, và theo từ điển còn có nghĩa đáng thương; dịch người khổ hạnh theo nghĩa thông dụng và tầng (khổ hạnh, tu hành), chưa phân xử được nghĩa còn lại. (4) 16.2 tayo hetū: hetu dịch điều vì ba điều kế tiếp là thọ mạng dài, tài sản lớn, trí tuệ sắc bén; hetu thường là nhân, nên đây là chỗ làm phẳng thuật ngữ có chủ ý. (5) 6.3 sahassayutto: dịch thắng một ngàn, không thêm ngựa vì Pāli không nêu. (6) 2.1 đến 2.2 pihitā và ḍayhare là số nhiều không nêu chủ ngữ; để trống chủ ngữ như Pāli. (7) 18.2 vattantā: dịch đang sống (trong vô lượng giới hạnh), không thêm trú hay hành trì. (8) 10.4 mahāsāle suaḍḍhake: mahāsāla là gia đình đại phú, suaḍḍha là rất giàu có; hai vế gần nghĩa nên dịch cả hai như Pāli.

  Phép kiểm tự viết, mẫu số ghi kèm: tập khoá Việt bằng tập khoá Pāli 89/89 và đúng thứ tự; dấu nháy kép và nháy đơn khớp Pāli từng khoá 89/89 (Pāli mở nháy kép ở 1.1 và đóng ở 21.4; nháy đơn mở ở 6.3 và đóng ở 6.4); dấu lược 0/89 khoá có (không có …pe… và không có … trần nên phép kiểm dấu lược chạy rỗng); không khoá rỗng, không khoảng trắng thừa; NFC đủ; không chữ số trong thân kinh; không Pāli lọt sang tiếng Việt ngoài tên riêng, nhan đề Therāpadāna và koṭi. In và đọc đối kháng 89 cặp Pāli với Việt.

  Coverage English: mẫu số = 2 khoá Pāli có nội dung (tha-ap26:22.1, 72 ký tự, và tha-ap26:23.1, 47 ký tự; 87 khoá còn lại ngắn hơn ngưỡng 40), Sujato phủ 0/2: tầng english-sujato đã ghim chỉ có 9 sub-collection của kn và tệp tha-ap duy nhất là tệp tên, không phải thân kinh; english-project 0 entry; vietnamese-current 0 (tầng này chỉ có Pháp Cú). Mẫu số nhỏ như vậy nghĩa là cổng coverage gần như không đo được gì: đây không phải sự đồng thuận về cách dịch mà là việc không có bản Anh nào để đối chiếu. Entry trong reference-gaps.yaml, nếu có, không cứu được published.

