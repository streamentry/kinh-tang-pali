notes: |-
  BLOCKER — THIẾU TẦNG THAM KHẢO ANH TẠI COMMIT ĐÃ GHIM. Không có tệp nào cho `kn/mil*` trong
  toàn bộ `translation/en/sujato` (kiểm bằng manifest, thư mục cache, và grep). Bản Anh duy nhất
  là BẢN LẤP CỦA DỰ ÁN (`content/translation/en/project/sutta/kn/mil7.3.7_translation-en-project.json`,
  trạng thái `published`) — do cùng một agent viết, nên không phải cách đọc English độc lập. Ghi
  rõ: coverage English đo trên 5 khoá có nội dung là 5/5, nhưng đó là coverage của lớp lấp của
  chính dự án, không phải của tầng đã ghim; `triangulation` vì thế chấm 8.0 cho cả bài.
  BỘ KHUNG PHẢI GIỐNG mil7.7.2 — CÙNG BÀI ANH EM, CÙNG BỘC. Tôi tìm thấy mil7.7.2 đã có bản Việt
  và đối chiếu từng khoá: 0.2 `Opammakathāpañha` dùng lại NGUYÊN VĂN "Câu hỏi về cách dùng dẫn
  với ví dụ"; 1.1 và 1.4 theo đúng khuôn "bộ phận ấy là bộ phận nào cần phải nắm lấy"; 1.5 theo
  đúng khuôn "Bậc Thế Tôn, đấng Thiên Nhân, đã nói:"; 2.1 theo khuôn "…, thứ bảy." Danh sách
  `sampajānakārī` ở 1.3 dài và dễ sai, nên tôi theo ĐÚNG tiền lệ đã có: an4.198:12.1,
  mn101:35.1, sn47.2:3.2, mn107:7.2 đều có cùng danh sách này và đều dịch "tỉnh giác" cho
  `sampajānakārī`, "y ngoài và y bát" cho `saṅghāṭipattacīvaradhāraṇe`, "co duỗi chân tay" cho
  `samiñjite pasārite`. `amhākaṁ anusāsanī` → "lời Ta chỉ dạy các ông" theo đúng tiền lệ ở sn47.2,
  sn47.35, sn47.44.
  `kūpa` trong chính bài này là GIẾNG (`kūpassa ekaṁ aṅgaṁ`, `kūpo rajjuñca … dhāreti`), và
  `Kūpaṅgapañha` là tên của chính câu hỏi ấy, nên tôi dịch "Câu hỏi về bộ phận của cái giếng".
  Bản lấp Anh đang dùng đặt "The Mast" — đọc `kūpa` là VOI và `aṅga` là móc dắt voi. Hai cách đọc
  đều có, nhưng bản Việt phải theo nghĩa trong chính câu kệ, và trong câu kệ thì nó là giếng. Tôi
  ghi việc bất đồng này ra đây.
  `aṅga` = bộ phận (cùng gốc `aṅgapañha` mà mil7.7.2 đã dịch "tay chân" và "phần"). `varatta` là
  dây cương (không phải dây thừng); `laṅkāra` là trang sức, đồ trang trí. `satisampajañña` dịch
  "chánh niệm và tỉnh giác" theo mn107:7.2.
  Vì đây là bài có 5 khoá ≥ 40 ký tự nên `kiểm()` CÓ chạy và đã pass; tôi vẫn tự quét thêm MỌI
  khoá bằng `review.py` — sạch. Không chạy npm (đợt này cấm) nên technical_integrity = 9.6.
