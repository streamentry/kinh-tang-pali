notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `tha-ap`.
  Dùng lại nguyên văn 17/34 khoá có tiền lệ: `Therāpadāna` (265×), `Phẩm Cây Vibhītaka` (3×), `“Đến Đức Thế Tôn Padumuttara,` (tha-ap554:1.1), `Với tâm tịnh tín hân hoan,` (24×), `đó là quả báu của việc dâng cúng tòa sư tử.` (tha-ap110:4.4), `Vào một trăm ngàn đại kiếp trước,` (5×), cùng toàn bộ cụm kệ 6–8 như tha-ap384.
  `Satasahassito kappe` dịch theo tiền lệ 5× `một trăm ngàn đại kiếp`; ghi nhận `kappa` và `mahākappa` không phải một, nhưng 5 bài đã có dùng cách này nên không tự đặt cách thứ hai.
  `Sīhāsanamadāsahaṁ.` (1.4) dịch `ta đã dâng cúng tòa sư tử ấy.` theo tiền lệ 1× tha-ap177 cho CHÍNH Pāli này (`tôi đã dâng cúng pháp tòa sư tử.`); cụm `-adāsahaṁ` trong tầng luôn được hiểu là ngôi thứ nhất.
  Bất định còn lại: khổ 3.1–3.4 (`Soṇṇamayā … Maṇimayā ca pallaṅkā, nibbattanti mamaṁ sadā.`) không có tiền lệ cho `lohitaṅgamayā` (0 khoá trong tầng) — dịch trung tính là `đá quý` vì không có bản Anh để xác định là hổ phách hay đá đỏ; `maṇimayā` dịch `ngọc ngà`. Khổ 4.1–4.4 (`Bodhiyā āsanaṁ katvā … aho dhammasudhammatā.`) là cặp kệ khó nhất của lát: `Bodhiyā` đọc là nơi Chánh Đẳng Giác, `jalajuttamanāmino` là tâm không còn ý niếm hơn người, `aho` là thán từ; không có tiền lệ cho bất kỳ Pāli nào trong ba câu này.
  `…pe…` giữ một dấu lược; `Bốn vô ngại giải,` và bản đóng nháy dùng lại nguyên văn.
