  Tầng tham khảo: english-sujato không có ps2.5 (đây là not-published-upstream: sutta/kn đã ghim chỉ có cp dhp iti ja kp snp thag thig ud, và manifest chỉ liệt kê tệp Pāli root cho uid này); english-project của dự án chưa có; vietnamese-current (phantuananh) chỉ có Pháp Cú. Coverage English theo công thức của source/layers.yaml: mẫu số 57 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0.x), tử số 0 ⇒ 0/57 = 0%, dưới ngưỡng 0,8; 91 khoá còn lại (3 khoá tiêu đề 0.1 đến 0.3 và 88 khoá ngắn hơn 40 ký tự) cổng không đo được gì. Bản Việt nguyên bài ở mục tra cứu toàn văn cuối trang (không phân đoạn, alignment: none) không phải tầng store, không cấp text cho bản này và không tính vào triangulation. Vì vậy triangulation bị chặn ở 7,0 (≤ 8,0) và bài giữ draft. Chưa có entry cho ps2.5 trong content/meta/reference-gaps.yaml; bài ngoài phạm vi sửa của lát này.

  Cấu trúc bài: Pāli ngắn nhưng lặp theo khuôn. Mở bằng câu đề (1.1), câu hỏi "ly tham là đạo như thế nào" (1.2), rồi bốn khối đạo theo bốn thời điểm (Dự lưu 1.3 đến 4.7, Nhất lai 5.1 đến 6.8, Bất lai 7.1 đến 7.4, A-la-hán 8.1 đến 9.8); mỗi khối nói chi đạo "ly tham" đối với điều trái nghịch (tà kiến, tà tư duy, v.v.), đối với các phiền não và uẩn đi theo, đối với mọi tướng bên ngoài, rồi khuôn "ly tham lấy ly tham làm đối tượng …" và khuôn giải nghĩa hai ly tham gắn với Dhp 273 (bảy chi đồng sanh, đạo tám chi, các con đường khác). Khối 10 liệt kê các dạng "X-virāgo" (53 khoá), 11 là các dạng "X-maggo" rút gọn. Nửa sau (12 đến 19) lặp lại đúng khuôn ấy với "vimutti" và "phalaṁ" thay cho "virāgo" và "maggo": quả Dự lưu, Nhất lai, Bất lai, A-la-hán, rồi liệt kê "X-vimutti". Mọi khuôn lặp được giữ một cách dịch duy nhất ở mọi lần xuất hiện.

  Dấu câu và phân đoạn: Pāli không có dấu nháy (0/148 khoá) nên bản Việt cũng không có; thẻ b quanh các khoá hỏi và khoá "<b>Virāgo</b>ti" được bỏ (như ps3.4). Các khoá kết bằng dấu gạch dài (2.1, 2.2, 2.4, 2.6, 12.4 …) giữ dấu gạch dài; khoá kế tiếp (2.3, 2.5, 12.5 …) là vế kết luận nên được thêm liên từ "do vậy" hoặc "tức là" để câu Việt đọc được, còn Pāli chỉ có "iti" và dấu gạch. 6.6 và 6.7 (cũng 9.6 và 9.7) là câu Pāli bị chia đôi giữa "maggā" và "ayameva"; 6.6 vì vậy là một đoạn "Trong tất cả … bà-la-môn." đứng riêng và 6.7 bắt đầu bằng "Chính …".

  Thuật ngữ và tiền lệ (đo trên tầng Việt đã có; ps là phạm vi gần nhất): virajjati → ly tham đối với (129 khoá có virajjati trong tầng, "ly tham" 172 lần, "nhàm chán" 41 lần; dùng "ly tham" để trùng với virāga, vì vế "virāgo" là chủ đề của cả bài). virāga → ly tham (ps3.4, dhp273). vimutta, vimutti → được giải thoát khỏi, giải thoát. dassanaṭṭhena → do ý nghĩa thấy (ps1.9). abhiniropana → hướng tâm đến, pariggaha → thâu nhiếp, samuṭṭhāna → phát khởi, vodāna → thanh tịnh, paggaha → nỗ lực, upaṭṭhāna → thiết lập, avikkhepa → không tán loạn (ps1.9, ps3.3). ārammaṇa → đối tượng (157 khoá: đối tượng 62, sở duyên 35; ps1.0:7.1 đối tượng). gocara → phạm vi (244 khoá: phạm vi 56, cảnh giới 37, lãnh vực 29, đối tượng 20; ps1.0:16.1 và ps3.3:12.2 phạm vi). samudāgata → đã phát sinh (13 khoá: sinh khởi 5, thành tựu 2, phát sinh 1; ps1.0:14.1 phát sinh). ṭhita → an trú (483 khoá: đứng 455, an trú 64, đứng vững 31) và patiṭṭhita → đứng vững (206 khoá: an trú 52, an lập 48, đứng vững 19), để hai từ khác nhau trong một khuôn. nibbānārammaṇatājātā → sinh khởi do lấy Niết-bàn làm đối tượng. sahajāta → đồng sanh (59 trên 63 khoá; ps1.9). sattaṅga → bảy chi. aṭṭhaṅgika → tám chi (435 khoá có aṭṭhaṅgika: bát chánh đạo 259, tám ngành 229, bát thánh đạo 59, tám chi 34; chọn "tám chi" theo ps2.8 và vì song song với "bảy chi" của sattaṅgāni; ps3.4 dùng Bát Thánh Đạo, không theo vì ở đây nó đứng cạnh "bảy chi"). buddhā → chư Phật (57 khoá: chư Phật 24, các Đức Phật 4, các vị Phật 3). sāvakā → đệ tử (339 trên 270 khoá). agataṁ disaṁ → phương chưa từng đến (snp4.16:6.2). aggo ca seṭṭho ca pāmokkho ca uttamo ca pavaro ca → tối thượng, tối thắng, tối tôn, tối cao và tối quý: dùng lại đúng cách dịch của an4.95:3.3 và an4.95:4.2 (Pāli y hệt, bỏ dấu phẩy trước "và"); seṭṭho → tối thắng (dhp273). puthusamaṇabrāhmaṇa → đông đảo sa-môn và bà-la-môn (an5.194:3.4 đông đảo). parappavāda → luận thuyết khác (an3.65:3.2 giáo thuyết của người khác). nimitta → tướng (sabbanimittehi → mọi tướng, 40 trên 50 khoá). bahiddhā → ở bên ngoài. kāmarāgasaññojana, paṭighasaññojana, kāmarāgānusaya, paṭighānusaya → dục ái kiết sử, sân kiết sử, dục ái tùy miên, sân tùy miên; oḷārika → thô thiển, anusahagata → vi tế; rūparāga → sắc ái, arūparāga → vô sắc ái, māna → mạn, uddhacca → trạo cử (39 khoá), bhavarāga → hữu ái (tất cả theo ps1.9:6.2, 7.2, 8.2). Dự lưu, Nhất lai, Bất lai, A-la-hán + đạo và quả: "Tại thời điểm Dự lưu đạo" và "Tại thời điểm Dự lưu quả" (ps1.9, ps3.3). indriya, bala: tín căn, tinh tấn căn, niệm căn, định căn, tuệ căn; tín lực, tinh tấn lực, niệm lực, định lực, tuệ lực (ps3.3, ps3.4; ps1.9 viết tấn căn, tấn lực, không theo vì ps3.3 và ps3.4 dùng đủ chữ tinh tấn). assaddhiya → sự không có đức tin (ps3.3:13.5; tầng 29 khoá: không tin 5, bất tín 2, không có đức tin 1). kosajja → biếng nhác (40 khoá: biếng nhác 27, lười biếng 9). pamāda → phóng dật (173 khoá: phóng dật 144, buông lung 74, thất niệm 1). bojjhaṅga → giác chi, pavicaya → trạch pháp (14 khoá), pharaṇa → biến mãn, upasama → an tịnh, paṭisaṅkhāna → suy xét (ps1.9, ps3.3). indriya → các căn, adhimokkha → thắng giải (ps3.3). niyyāna → xuất ly (ps1.9, ps3.3, ps3.4). satipaṭṭhāna → niệm xứ, sammappadhāna → chánh cần, iddhipāda → như ý túc, sacca → chân lý, samatha → chỉ (43 khoá có samatha: chỉ và quán 13, chỉ 8), vipassanā → quán, yuganaddha → song hành, sīlavisuddhi → giới thanh tịnh, cittavisuddhi → tâm thanh tịnh, diṭṭhivisuddhi → kiến thanh tịnh, vijjā → minh, khaye ñāṇaṁ → trí về sự đoạn tận và anuppāde ñāṇaṁ → trí về sự không sinh khởi (ps3.3:13.7 và 15.4), amatogadha → nhập vào bất tử (ps3.3). chando, manasikāro, phasso, vedanā, samādhi, sati, paññā, vimutti, nibbāna ở danh sách cuối → dục, tác ý, xúc, thọ, định, niệm, tuệ, giải thoát, Niết-bàn; mūla → cội rễ, samuṭṭhāna → phát khởi, samodhāna → hội tụ, samosaraṇa → quy tụ, pamukha → đứng đầu, ādhipateyya → làm chủ, taduttara → vượt trội, sāra → cốt lõi, pariyosāna → cứu cánh (ps3.3:13.8). Tên bài: Yuganaddhavagga → Phẩm Song Hành (ps2.8); Virāgakathā → Luận Bàn Về Ly Tham (khuôn tên của ps2.8, ps3.4); câu kết → Luận bàn về ly tham được hoàn tất.

  Pāli trùng nguyên văn: trong chính bài 13 nhóm (47 khoá: 1.4, 3.10, 5.3; 2.1 với 4.1, 6.1, 9.1; 2.2 với 4.2, 6.2, 9.2; 2.3 với 4.3, 6.3, 9.3; 2.4 với 4.4, 6.4, 9.4; 2.5 với 4.5, 6.5, 9.5; 2.6 với 4.6; 2.7 với 4.7, 6.8, 7.4, 9.8; 6.6 với 9.6; 6.7 với 9.7; 12.5 với 13.4, 14.4, 15.5, 17.5; 13.2 với 14.2, 15.3, 17.3; 13.3 với 14.3, 15.4, 17.4); 0 nhóm mà bản Việt khác. Đã dò toàn tầng Việt đã có: 16 cặp (khoá bài này với khoá bài khác có Pāli y hệt, từ 15 ký tự trở lên): 12 cặp 0.1 với tiêu đề các bài ps khác, 1 cặp 0.2 với ps2.8:0.2, 3 cặp 5.1, 7.1, 8.1 với ps1.9:6.1, 7.1, 8.1; 0 cặp mà bản Việt khác (dùng lại nguyên văn). Pāli khoá 12.3 (muttiyo) khác khoá 13.2 (vimuttiyo) nên không tính là trùng.

  Bất định, không thêm vào thân kinh: (1) virajjati kèm ablative/instrumental ("ly tham đối với tà kiến", "ly tham đối với các phiền não …") theo tiền lệ tầng; cách hiểu nghĩa là "lìa bỏ, buông bỏ" cũng khả dĩ (bản Việt nguyên bài ở mục tra cứu toàn văn đọc theo hướng loại bỏ); không đổi vì sẽ phá vế "virāga" là chủ đề bài. (2) tadanuvattakakilesehi ca khandhehi ca: "tadanuvattaka" đứng trước kilesa nên dịch "các phiền não đi theo điều ấy và các uẩn"; có thể đọc "điều ấy" lan sang cả uẩn; 0 tiền lệ cho từ tadanuvattaka trong tầng. (3) sattaṅgāni (2.3): bảy chi, Pāli không kể tên; chú giải hiểu là bảy chi đạo còn lại đồng sanh với chi đang xét, không đưa vào lời kinh. (4) oḷārikā và anusahagatā đứng trước kāmarāgasaññojanā và kāmarāgānusayā chứ không trước paṭigha; dịch như ps1.9 (thô thiển hoặc vi tế chỉ gắn với dục ái). (5) 10.53 và 11.2 kết bằng maggo (không phải virāgo) trong khi các khoá lân cận là virāgo; dịch đúng Pāli "là đạo". (6) Pāli dùng hai từ vimokkha (10.41, 19.2) và vimutti (10.43, 19.2 "vimutti vimutti"): cả hai dịch "giải thoát", chỉ phân biệt bằng ý nghĩa đi kèm (được thoát khỏi so với xả ly); khoá 19.2 "do ý nghĩa xả ly, giải thoát là giải thoát" là dịch sát chữ. (7) samatha dịch "chỉ" (10.34 và 19.2 "chỉ là ly tham"/"chỉ là giải thoát"), dễ đọc nhầm với "chỉ" nghĩa "duy nhất"; giữ theo ps1.9 và tầng, dấu phẩy phân biệt. (8) muttiyo (12.3) và vimuttiyo (13.2 …) đều là "hai giải thoát". (9) "do vậy" và "tức là" ở các khoá kết bằng iti là liên từ nối thêm vào để câu Việt mạch lạc, không có từ tương ứng trong Pāli. (10) puthu trong puthusamaṇabrāhmaṇa dịch "đông đảo" (an5.194:3.4), có thể hiểu là "đủ loại". (11) 6.6 là đoạn dở dang do cách chia khoá của Pāli.

  Dấu lược: Pāli có …pe… ở 12 khoá (5.1, 7.1, 7.3, 8.1, 11.1, 15.1, 16.1, 16.2, 17.1, 18.1, 18.3, 18.5) và không có … trần hay (…) nào; Việt giữ đúng một dấu lược mỗi khoá có dấu lược, khớp Pāli từng khoá (0 lệch); 16.2 kết …pe…. nên Việt kết khoảng trắng rồi ….

  Số Pāli: không có số lớn. Các số có mặt: dve → hai (2.1 và các khoá lặp, 12.3 …); satta → bảy (sattaṅgāni, 2.3 …); aṭṭha → tám (aṭṭhaṅgiko, 2.5 …). Không còn số nào khác; không tính tổng.

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (148 = 148), thứ tự giống Pāli; nháy kép và nháy đơn: Pāli không khoá nào có dấu nháy (0/148), bản Việt cũng 0, nên 2 phép đếm nháy chạy với mẫu số khoá-có-nháy = 0 (không đo được gì về nháy ngoài việc hai bên đều trống); dấu lược khớp từng khoá (12 khoá có …, 0 lệch); NFC, khoá rỗng, khoảng trắng thừa: 0 lỗi trên 148 khoá; Pāli lọt sang Việt: chỉ tên Paṭisambhidāmagga ở khoá 0.1. Đã in và đọc đủ 148 cặp Pāli với Việt.

