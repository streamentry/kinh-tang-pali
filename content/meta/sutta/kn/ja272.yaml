  tầng tham khảo English.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt mặc định chỉ quét khoá Pāli từ 40
  ký tự trở lên; ở Jātaka mọi vế kệ đều ngắn hơn ngưỡng đó nên phần chốt đó về bản chất KHÔNG chạy.
  Tôi tự quét lại toàn bộ 238 khoá của lát bằng script riêng, đọc thẳng từ tệp đã ghi trên đĩa:
  đủ khoá và không thừa so với Pāli gốc, không rỗng, chuỗi NFC, số dấu lược khớp TỪNG KHOÁ (Pāli có
  …pe… thì Việt đúng một …, Pāli không có thì Việt không có), không có (…) đứng một mình, vị trí
  ngoặc kép mở và đóng khớp PĀLI TỪNG KHOÁ (không chỉ tổng số trên cả bài), ngoặc kép cân trên
  cả bài, không chữ phiên tự, không còn sót thẻ chữ Pāli. Kết quả 0 lỗi trên 238 khoá / 14 bài.

  TÊN PHẨM, ĐÃ ĐO THEO BẢNG CHỐT VÀ THEO TẦNG. Tikanipāta → Bộ Ba Bài Kinh: đếm trên toàn tầng
  Việt TRƯỚC khi lát này ghi, đã có 24 tệp Jātaka và 15 tệp thag3/thig3 dùng đúng cách này, và KHÔNG
  tệp Jātaka nào dùng cách khác; cách Phẩm Ba Pháp chỉ do 50 tệp iti50..iti99 dùng mà tôi không đụng
  tới. Sau khi lát này ghi, con số Jātaka là 37/37. Tôi theo đa số TRONG CHÍNH TÁC PHẨM ĐANG LÀM theo
  BRIEF_VI3 §11, và cũng vì nó khớp song song với hai mục đã chốt là Bộ Một Bài Kinh và Bộ Hai Bài
  Kinh. Người điều phối gộp có thể muốn thống nhất cả tầng iti sau này, nhưng đó không thuộc lát này.
  Saṅkappavagga → Phẩm Suy Nghĩ (trước lát này 7 tệp, không lệch; sau đó 8); Padumavagga → Phẩm Bông
  Sen (trước 1 tệp, không lệch; sau đó 9, và cả chín tệp trong phẩm đều giống nhau); Udapānavagga →
  Phẩm Nước Uống (trước 4 tệp, không lệch; sau đó 8). Dấu uddāna: trước lát này đã đếm 22 tệp có
  dạng Kinh <tên>, thứ <từ>. và 3 tệp không có dấu phẩy; tôi dùng dạng có dấu phẩy, và đã kiểm
  bằng script rằng số thứ tự trong uddāna khớp số đứng trước mặt trong 0.4 của cùng phẩm, không suy
  từ tên uid.

  PĀLI TRÙNG NGUYÊN VĂN, ĐÃ DỰNG CHỈ MỤC BẰNG SCRIPT VÀ ĐÃ DÙNG LẠI. Tôi nạp 5.764 tệp Pāli
  gốc trong cache (bỏ mọi thư mục *.apfs-orphan) và 4.038 tệp Việt dự án, ghép theo khoá, rồi so
  TRÙNG NGUYÊN VĂN có chuẩn hoá hoa thường, khoảng trắng và dấu câu biên. Riêng lát này: 102 khoá
  trùng ở nơi khác; 52 khoá trùng đó đã có bản Việt ở bài khác, và tôi DÙNG LẠI NGUYÊN VĂN 51 khoá
  (39 khoá tiêu đề, 12 khoá thân kệ). Một khoá trong 52 là ngoại lệ có chủ ý: ja264:3.1 trùng nguyên
  văn với sn1.50:11.1, nhưng bản Việt đã có mở ngoặc kép ở đầu khoá trong khi Pāli khoá này không mở,
  nên tôi chép phần chữ và bỏ ngoặc kép thay vì chép y nguyên. Ngoài ra có 8 cả ván bốn vế trùng nguyên
  văn ở bài khác, và cả tám đều chưa có bản Việt để mượn. Trong lát này có 3 khoá trùng
  nguyên văn, đều là ba vế mở đầu lặp lại trong ja265; tôi đã dùng lại đúng một cách dịch cho cả
  hai lần, và script tự kiểm bắt được chỗ lệch nếu có.

  TÊN RIÊNG CÓ DẤU PĀLI, CỐ Ý GIỮ, KHÔNG BỎ DẤU. Jātaka, Tikanipāta, Sakka, Panāda, Missībhāvitthi,
  kāḷi, Jātavedas, Gāṅgā, Yamunā, Kassapa — tất cả giữ đúng dấu Pāli như tầng đang làm; tôi không
  bỏ dấu ở bất kỳ tên nào, kể cả tên không có bản Việt nào để đối chiếu.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  STATUS. Có một blocking error thật (thiếu hẳn tầng tham khảo English Sujato tại commit đã ghim), nên
  bài đặt draft bất kể final_score. Tôi không nâng điểm để né blocker, và cũng không hạ điểm để tỏ ra
  thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có
  tầng tham khảo nào.

  1.1 và 2.1 trùng nguyên văn với nhau (Yena mittena saṁsaggā), chỉ khác ở chỗ 1.4 và 2.4, nên tôi dùng
  lại đúng một cách dịch cho cả hai vế.

  CHỖ CHƯA CHẮC, VÀ MỘT CHỖ TÔI CỐ Ý DỪNG LẠI. (1) byagdha là hổ (không phải sư tử), nhưng toàn tầng
  Việt đang dùng sư tử cho sīha và không có khoá Việt nào cho byagdha; tôi dịch là hổ vì Pāli là
  authority, và ghi để người biên tập biết đây là tiền lệ 0. (2) 1.4 rukkhe akkhīva paṇḍito và 2.4
  sabbakiccesu paṇḍito: akkhīva là dấu ẩn dụ như, tôi dịch là người trí thì như cây thụ; nếu ý là người
  trí rụng lá như cây thì câu cần thêm vế mà Pāli không có. (3) 2.3 Kareyyattasamaṁ vuttiṁ: tôi dịch là
  Hãy lấy hành xử của chính mình làm chuẩn; attasamaṁ nghĩa là giống như chính mình, và cũng có thể
  là theo đúng như mình thì. (4) 3.4 Byagghā māhesu nibbanā: nibbanā là bị hủy diệt, tôi dịch là sẽ
  chết thảm; māhē là trâu, nhưng bò rùa cũng phải vì trâu bị thú dữ ăn thì gọi là trâu bò rùa.
  (5) yogakkhemo vihiyyati và yogakkhemo pavaḍḍhati: Pāli dùng hai động từ khác nhau cho cùng một
  điều, tôi giữ khác nhau là đánh mất và sập đổ, để người đọc không tưởng là cùng một câu.


  LƯỢT CẢI THIỆN 2026-10-13. Đọc đối kháng từng khoá cho thấy bản trước SAI NẶNG ở nhiều khoá; các ghi chú "CHỖ CHƯA CHẮC" (2), (3), (4), (5) ở trên bị thay thế bởi mục này (không xoá để giữ lịch sử). Đã đổi 12/17 khoá (các khoá 0.x và 4.1 giữ nguyên).
  - 2.2 pavaḍḍhati: bản trước "sự an ổn bị sập đổ" — nghĩa NGƯỢC (pavaḍḍhati là tăng trưởng, cùng cặp đối với vihiyyati ở 1.2; lệch cả tiền lệ "tăng trưởng": 74 khoá có pavaḍḍhati, tầng dịch tăng trưởng/phát triển). Nay "mà sự an ổn tăng trưởng". 1.2 vihiyyati: "bị đánh mất" → "bị suy giảm" (tiền lệ vihāyati/vihiyyati ở tầng: suy thoái, suy tàn; chọn "suy giảm" để giữ đối xứng với "tăng trưởng"). Điểm đổi: grammar_logic 8.8→9.0, terminology 8.8→9.0.
  - 1.1 và 2.1: bản trước "Người mà ta kết giao với" dịch ngược cấu trúc (yena mittena saṁsaggā là tách rời do giao du với người bạn nào, không phải ta kết giao với ai); thêm "ta" không có trong Pāli. Nay "Do giao du với người bạn nào" (saṁsagga → giao du: tiền lệ sn14.16 "Giao du sinh ra bụi rậm"; yogakkhema → an ổn: tiền lệ "an ổn khỏi các ách" ở DN, đây là ngữ cảnh đời thường nên chỉ giữ "an ổn"). 1.1 và 2.1 Pāli trùng nguyên văn, Việt đã giống nhau (khác nhau duy nhất là dấu mở nháy).
  - 3.2 paccupetha mahāvanaṁ: "hãy vào rừng rậm" → "hãy trở về khu rừng lớn" (mahāvana → rừng lớn, tiền lệ mn86; paccupeti là quay đến lại). 3.1 thêm "Hãy đến" cho etha bị bỏ sót (tiền lệ Jātaka: "Hãy đến đây … hãy quay lại").
  - 3.3 và 3.4: bản trước "Đừng chém rừng bằng lửa" và "sẽ chết thảm giữa bò rùa" là HALLUCINATION. Không có từ nào chỉ lửa, bò hay rùa trong Pāli. Nay: mā vanaṁ chindi nibbyagghaṁ = chớ để khu rừng vắng hổ bị đốn; byagghā māhesu nibbanā = hỡi các hổ, chớ để mình không còn rừng (māhesu = mā ahesuṁ; nibbanā = nir + vana, không có rừng; một trò chơi chữ với byagghā/nibbyagghaṁ). "chớ" là đa số cho mā trong Jātaka: 143 chớ, 98 đừng, 27 khác.
  - 1.3 và 1.4: bản trước "kẻ ấy lại rơi vào chỗ nguy hiểm" và "người trí thì như cây thụ" là hallucination do đọc rukkhe ở nghĩa gốc cây. Nay đề phòng sự lấn át của người bạn ấy ngay từ đầu, như giữ gìn đôi mắt (tassa = của người ấy; ajjhābhavaṁ = sự lấn át, lấn lướt; akkhīva = như đôi mắt). Điểm đổi: semantic_fidelity giữ 8.7 (lỗi lớn đã sửa, nhưng bất định bên dưới vẫn còn).
  - 2.3 và 2.4: "Hãy lấy hành xử của chính mình làm chuẩn" → "hãy cư xử như với chính mình"; "người trí trong mọi khó khăn" → "bậc trí trong mọi việc cần làm" (kicca là việc phải làm, không phải khó khăn; paṇḍito → bậc trí, đa số trong Jātaka). Dấu cuối 2.4 sửa thành ”. đúng thông lệ (1.965 khoá Pāli kết ”. thì Việt kết ”.). Khoá 3.1 hổ: byagghā → hổ, 79 khoá có byaggha/vyaggha dịch hổ, 9 cọp, 57 khác.
  BẤT ĐỊNH CÒN LẠI, GIỮ NGUYÊN, KHÔNG ĐOÁN. (a) Đọc rukkhe hay rakkhe ở 1.4: Pāli đã ghim đọc rukkhe akkhīva; rukkhe (ở cây) không ghép nổi với phần còn lại của vế nên khả năng cao là biến thể của rakkhe (nên giữ gìn), và các ấn bản khác cùng lời chú giải đọc rakkhe, glossed như người trí giữ mình như giữ đôi mắt của chính mình. Bản dịch theo rakkhe vì rukkhe không hiểu được; đây là chỗ bản dịch lệch khỏi chữ đã ghim, và nếu người biên tập muốn theo sát chữ ghim thì khoá 1.4 cần quyết định lại. Khó khăn: không có bản Anh đã ghim để đối chiếu, nên chỉ có bằng chứng ngoài tầng ghim. (b) ajjhābhavaṁ (hapax trong toàn Pāli root đã ghim, chỉ xuất hiện ở ja272): chú giải đọc như sự lấn át cần được người bạn ấy bị chế ngự (abhibhavitabbaṁ); tôi dịch lấn át và để rakkhe chi phối thành đề phòng, nhưng cú pháp (đề phòng sự lấn át, hay lấn át để giữ mình) có thể hiểu hơi khác. (c) 2.3 attasamaṁ vuttiṁ: chú giải gloss attasama là người như chính mình hoặc bạn rất thân, nên bản dịch hiểu cư xử với người bạn ấy như với chính mình; người nhận (người bạn) lấy từ ngữ cảnh 2.1–2.2, không có trong Pāli của khoá. (d) 3.3 chindi: không rõ chủ thể (impersonal), dịch bằng bị động chớ để … bị đốn.
  BẢNG ĐIỂM TRƯỚC → SAU: source_provenance 9.4→9.4; semantic_fidelity 8.7→8.7; grammar_logic 8.8→9.0; segment_alignment 10.0→10.0; terminology 8.8→9.0; triangulation 6.8→7.2 (đã thêm đối chiếu với ấn bản Pāli kèm chú giải và một bản dịch Anh của tập Jātaka đọc dạng tóm lược trên mạng; KHÔNG thuộc tầng ghim, không sao chép câu chữ, và vẫn dưới trần 8.0); vietnamese_clarity 9.0→9.0; han_viet_balance 9.1→9.1; ambiguity_integrity 8.5→8.5; technical_integrity 9.6→9.6. final_score 8.87→8.95. Blocker còn lại: chỉ blocker không có bản Anh upstream, giữ nguyên.
  Cổng kỹ thuật vẫn CHƯA chạy trong lượt này: npm run validate, npm test, npm run check, npm run build.
