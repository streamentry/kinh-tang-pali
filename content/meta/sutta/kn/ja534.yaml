      + `18.2` `piṇḍamapacāyasi` → "biết trọng ơn miếng ăn" (`apacāyati` = tôn kính; không có tiền lệ gần). `19`–`21`: chủ ngữ không nêu; lập luận: nếu thợ săn tự ý đặt bẫy thì hai thiên nga nhận món quà vô úy từ y; nếu không, thả là trộm cắp (`theyya`) vì y không phải chủ, nên hãy đưa họ đến vua mà y làm công.
