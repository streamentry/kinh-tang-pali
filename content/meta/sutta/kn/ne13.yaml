  ne19:7.11 và cả tầng Netti dùng *quán*; terminology fix). Giữ `16.1` *(đầu)* cho `uttamaṅga`, `15.1`
  `surabhipasūnaṁ pujjo`, `7.2` `nibbāpitapariyuṭṭhāno` *dập tắt các phiền não chi phối* (lệch *sự
  hiển hiện* ở ne5/ne19 vì ở đây là danh sách mỹ hiệu, ghi nhận). `8.2` khớp an4.34/an5.32. Bất định
  còn: `6.4` `adhipaññā sikkhā paññā`, `7.2` `asaṅkhepagato`, `13.1` `araṇaṁ`.

