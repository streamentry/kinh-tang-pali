notes: |-
  **Bài này.** `ne13` · tập Netti, phần `Paṭiniddesavāra` (Phần Giải Thích), `Vibhaṅga 10`
  — tức chương thứ mười của bộ phân tích. Bài có 55 khoá Pā li; bản dịch phủ đủ 55/55,
  thứ tự khoá khớp đúng thứ tự Pā li.

  **`ne` KHÔNG phải phẩm chưa có tiền lệ — đo được 20 tệp.** Trên đĩa đã có 20 tệp
  `ne*.json` trong `content/translation/vi/project/sutta/kn/` và 20 tệp `ne*.yaml`
  trong `content/meta/sutta/kn/`, trong đó `ne1, ne2, ne8, ne11, ne12, ne16, ne22`–`ne35`.
  Bộ nhãn Netti vì thế **rất dày**, và tôi tra tiền lệ ở toàn tầng chứ không chỉ trong `ne`.
  Riêng cặp song sinh `Vibhaṅga` / `Sampāta` của cùng một hā ra đã có 16 hộp nhãn, và
  `ne13` là hộp thứ 21 trong loạt đó.

  **`vevacana` → *ngữ đồng nghĩa* (9 khoá / 2 tệp) chứ không phải *diễn đạt bằng lời*
  (1 khoá / 1 tệp).** Đếm chuỗi Việt toàn tầng: `ngữ đồng nghĩa` 8 lần thường + 1 lần hoa
  (tất cả ở `ne1` và `ne29`), `diễn đạt bằng lời` đúng 1 lần ở `ne2:1.2`. Chọn đa số.
  Ba chứng cứ cộng lại: `ne29` — bản *sampāta* của **đúng** hā ra này — dịch
  `Vevacanahārasampāta` là *Nhóm Phương Thức Dùng Ngữ Đồng Nghĩa*; `ne29:2.2`–`2.4` dịch
  `idaṁ vevacanaṁ` là *Đó là ngữ đồng nghĩa*; và chính Netti tự mô tả `hārā` là
  `byañjanavicayo` (`ne1:4.1` → *các phương thức ngữ đồng nghĩa*) còn `byañjana` đã là
  *ngữ đồng nghĩa* ở `ne1:2.2` và `ne1:2.4`.

  **Khuôn tên bài: đo, không đoán.** `Vibhaṅga N` → *Nhóm N* và
  `Xhāravibhaṅga` → *Nhóm X Hướng Dẫn* có tiền lệ ở đúng 4 tệp đã có (`ne8` *Nhóm 5 /
  Nhóm Đặc Trưng Hướng Dẫn*, `ne11` *Nhóm 8 / Nhóm Phân Loại Hướng Dẫn*, `ne12` *Nhóm 9 /
  Nhóm Chuyển Đổi Hướng Dẫn*, `ne16` *Nhóm 13 / Nhóm Thanh Tẩy Hướng Dẫn*), và loạt
  `Sampāta` dùng *Phương Thức* ở 13 tệp (`ne22`–`ne34`). `ne13` là **Vibhaṅnga**, không
  phải Sampāta, nên tôi theo khuôn *Hướng Dẫn*. `translationTitle` đo ở
  `content/meta/sutta/kn/ne*.yaml`: 4/4 tệp vibhaṅga đã có đặt `translationTitle` đúng bằng
  tiêu đề `0.4` — *Nhóm Ngữ Đồng Nghĩa Hướng Dẫn*. `Paṭiniddesavāra` → *Phần Giải Thích*
  có 17 tiền lệ đã dịch.

  **Bốn cụm công thức, dùng lại nguyên văn bản Việt đã có.**
  (1) `Yathāha bhagavā—` → *Như Đức Thế Tôn đã nói—*, khớp byte Pā li và khớp nguyên văn
  bản Việt ở 4 khoá đã có (`ne8:1.6`, `2.5`, `3.5`, `5.3`).
  (2) `arahaṁ sammāsambuddho … bhagavā` → *bậc A-la-hán, Chánh Đẳng Giác, minh hạnh túc đủ,
  Thiện Thệ, biết thế giới, vô thượng điều ngự trượng phu, Đạo Sư chư thiên và người, bậc
  Giác ngộ, bậc Đáng Kính*; đo trên toàn Pā li đã ghim: 107 khoá chứa cụm này, **94** khoá
  đã có bản Việt, và cả 94 đều dùng đúng một cách. `7.1` dùng lại nguyên văn.
  (3) `sandiṭṭhiko akāliko ehipassiko opaneyyiko paccattaṁ veditabbo viññūhi` → *có thể thấy
  ngay trong hiện tại, không hề thời hạn, có thể đến xem, hướng thượng, mỗi bậc trí tự mình
  hiểu được*; đo: **21** khoá đã có bản Việt, 21/21 giống nhau. `8.1` dùng lại nguyên văn.
  (4) `muttacāgo payatapāṇi vossaggarato …` → *buông xả rộng rãi, mở tay rộng rãi, hoan hỷ
  xả bỏ, chuyên cần bố thí, hoan hỷ cho và hoan hỷ chia sẻ*; đo: **21** khoá, thống nhất.
  (5) `sīlāni akhaṇḍāni … samādhisaṁvattanikāni` — Pā li ở `16.1` có **10** vế, nhưng 5 bản
  đã có chỉ dịch **8**: cả `an5.32:7.2` và `an5.105:1.4` **bỏ mất** `ariyanāni ariyakantāni`.
  Tôi dùng lại nguyên văn đa số cho 8 vế kia (*không chằng chịt, không có lỗ thủng, không vết
  ố đốm, không lấm tấm* rồi *tự do, được những người trí tán thán, không bị chấp trước*) và
  **thêm lại** hai vế bị bỏ (*cao quý, đáng được bậc cao quý tôn trọng*) — bỏ thì mất nghĩa.
  Riêng `samādhisaṁvattanikāni` tôi viết *đưa đến sự định* theo khuôn *sự định* của
  `ne29`/`ne30`, thay vì *đưa đến định* của tiền lệ. Cả ba là lệch **có chủ ý**, ghi ở đây.
  `āyasmā mahākaccāyano` → *Tôn giả Mahākaccāyana* (4/5 bản đã có; chỉ `ne11:7.4` dùng
  *Trưởng lão*), `gāthā` → *bài kệ*, `āyatana` → *cảnh giới* (`ne29`, `ne30`),
  `manindriya / manāyatana / vijānanā` → *căn tâm / cảnh giới của tâm / sự biết* (`ne29:2.2`),
  `niddisati` → *chỉ rõ* (47 khoá / 26 tệp toàn tầng).

  **Kệ ca ngợi ở `9.1`–`13.4` là uddāna của `sn43.44` — dùng lại nguyên văn, đo được.**
  Sáu khoá trùng **byte** với `sn43.44`: `9.2`, `9.3`, `9.4`, `10.1`, `10.3`, `10.4`; và
  `11.4` trùng với chính `10.4` (cặp trùng nội bộ duy nhất của bài). Cả sáu đã dùng lại
  nguyên văn bản Việt của `sn43.44`. Bốn khoá còn lại (`9.1`, `10.2`, `11.1`–`11.3`) **không**
  trùng byte — vì ở Netti chúng được **ghép thành câu**, còn ở `sn43.44` chúng là danh sách
  rời của uddāna. Ba ví dụ: `sn43.44:2.1` là `Asaṅkhataṁ anataṁ anāsavaṁ,` (ba từ rời)
  trong khi `ne13:9.1` là `Asaṅkhataṁnantamanāsavañca,` (một từ ghép); `sn43.44:3.2` có
  `Taṇhākkhayo` còn `ne13:10.2` có `Taṇhakkhayo` (thiếu một ngã âm). Tôi dịch theo cách
  **ghép** của Netti, chỉ dùng lại **từ ngữ** của `sn43.44`. Đây là ngoại lệ mà quy tắc
  “dùng lại nguyên văn” vốn để dành, vì ở đây khác cả **chủ thể** lẫn **ngôi kể**.

  **`11.1`–`13.4` là hapax toàn tầng Pā li đã ghim — không có tiền lệ nào để dựa vàn.**
  Đếm trên 284.708 khoá Pā li của `an, dn, kn, mn, sn`: `anūpasaggaṁ`, `vimalanti`,
  `appamāṇaṁ patiṭṭhā`, `tāṇaṁ araṇaṁ`, `jeṭṭhaṁ seṭṭhanti`, `asaṅkhataṁ ntantam` đều
  **0** khoá ngoài `ne13`; `balanipphattigato` và `pariyuṭṭhāno` (trong `7.2`) cũng **0**.
  Đây là dữ liệu quý cho lát sau: nếu ai đó gặp lại những vế này, chỗ duy nhất để đối chiếu
  là bài này.

  **Một cặp Pā li trùng mà bản Việt cố ý khác: `2.3`.** `Aññāṇamūlappabhavā pajappitā,`
  trùng byte với `sn7.18:5.3`, nhưng ở `sn7.18` chủ thể là *lời cầu khẩn của người bà-la-môn*
  và bản Việt đã có viết *những lời cầu khẩn khởi lên từ gốc vô minh*; ở `ne13` chủ thể là
  *khát, mong muốn, hoan hỷ* (xem định nghĩa ở `3.1`–`3.3`). Dịch y hệt sẽ đổi chủ thể, nên
  tôi viết *đều sinh ra từ gốc rễ của vô minh, rồi lan rộng thêm*. `2.4` thì trùng byte với
  `sn7.18:5.4` **và cùng chủ thể**, nên dùng lại nguyên văn: *Tất cả đã được Ta diệt trừ tận
  gốc rễ.* `2.1`–`2.2` trùng byte với `pe1:129.2` và `pe1:129.3`, hai khoá chưa có bản Việt.

  **`gehasita` / `nekkhammasita`: tôi CỐ Ý không theo tiền lệ, và ghi lý do.**
  `mn137` dịch `gehasita` là *cận cư gia đình* và `nekkhammasita` là *cận cư xuất thế*
  (đo được: **11** khoá Việt có *ưu cận cư* / **30** khoá có *cận cư* trong 2 tệp — tức
  `mn137`), còn chỗ khác trong cùng tệp đó dịch `upekkhā` là *ưu*. Người dịch ấy bám vào
  nghĩa *geha = gia đình*, trong khi ở đây `geha` là **tạp ô còn sót** (`sasāvajja`) đối lập
  với `nekkhamma` là **không còn tạp ô** (`nirussavEjja`); “cận cư gia đình” không có nghĩa
  gì với `gehasitāni somanassāni`. Tôi dịch *còn tồn dư* / *không còn tồn dư`. Đây là chỗ
  dễ tranh — biên tập có thể muốn đồng bộ với `mn137`, tôi để nguyên nghĩa Pā li.
  Cùng lý do này, `upekkhā` tôi dịch *bình thản* (83 khoá / 61 tệp toàn tầng) chứ không
  dùng *thanh tẩy* (53 khoá / 9 tệp), vì trong chính lớp Netti `sodhana` đã là *thanh tẩy* và
  hai nghĩa phải giữ riêng.

  **Danh sách tám danh hiệu ở `8.2`: ba tiền lệ, không có đa số — tôi chọn và nói rõ.**
  `madanimmadano … nibbānaṁ` có **3** khoá đã dịch, mỗi khoá một cách: `an4.34:3.1`
  (*khuất phục kiêu mạn, trừ khát ái, nhổ tận gốc của luyến ái, đứt đoạn vòng luân hồi, diệt
  tận khát ái, ly tham, diệt tận, Niết-bàn*), `an5.32:5.2` và `iti90:3.1`. Riêng từng vế:
  `virāgo` → *ly tham* thống nhất cả 3 (và 704 khoá / 346 tệp toàn tầng); `vaṭṭūpacchedo` →
  *cắt đứt vòng luân hồi* 2/3; `taṇhakkhayo` → *đoạn tận tham ái* (9 khoá / 7 tệp, cao
  nhất trong ba biến thể); `madanimmadano`, `pipāsavinayo`, `ālayasamugghāṭo`,
  `suññato`, `atidullabho`, `nirodho` thì 1–1–1, không có đa số. `8.2` của Netti **thừa hai
  vế** so với `an4.34` (`suññato atidullabho` là hai mục riêng) nên tôi dịch **10** vế, đủ
  10, theo `an4.34` làm gốc vì đó là bản AN. `suññato` → *rỗng không* (33 khoá / 12 tệp),
  `atidullabho` → *khó tìm thấy*.

  **Số Pā li — tự tính, in phép.** `catuvīsapadāni` = catu 4 + vīsa 20 = **24**; kiểm chéo
  `cha` 6 × 4 nhóm = **24**, hai đường khớp. `Pañcindriyāni` = **5**. `catuyogavippahīno` =
  **4**. `cattāri purisayugāni` = **4**, `aṭṭha purisapuggalā` = **8**, kiểm 4 × 2 = 8.
  `Vibhaṅga 10` = **10**, kiểm chéo hai chiều: `ne4` là `Vibhaṅga 1` nên `ne13` là
  `Vibhaṅga 10`, và `ne16` là `Vibhaṅga 13` đã dịch *Nhóm 13*. Bộ dò tự hiệu chuẩn **8/8**
  (chèn số sai vào 6 khoá và đòi phải bắt được, cộng 1 khoá đúng để phải **không** báo lỗi),
  độ bao phủ **9/9** mẫu số có trong Pā li, kết quả **0** lệch.

  **Lỗi trong chính phép kiểm của tôi — hai lần, đã sửa, ghi ra để không ai tin nhầm.**
  (1) Bản đầu của bộ dò số khớp `cha` bằng **so chuỗi con**, nên `cha` khớp bên trong
  `acchariyañca` ở `10.2` và báo lỗi giả. Đã sửa sang khớp **theo ranh giới từ**; sau khi
  sửa mẫu số là 9/9 chứ không phải 10.
  (2) Lần đầu tôi viết dòng hiệu chuẩn in ra `CALIBRATION FAILED` 0/9 vì bảng tra chỉ có 3
  từ khóa và còn **hỏng** — đúng nghĩa của *hiệu chuẩn thất bại*: khi đó bộ dò **không đo
  được gì**, nên tôi không in “0 lệch”. Lần thứ hai hiệu chuẩn cũng 0/3, vì tôi đếm `bắt += 1`
  vô điều kiện; lần thứ ba 8/8 mới là con số có nghĩa.

  **`<b>` trong Pā li thì bỏ, không thêm nháy.** `ne13` có **3** khoá Pā li chứa thẻ `<b>`
  (`3.1`, `4.1`, `5.1`); toàn tầng Pā li đã ghim có 5.948 khoá chứa `<b>` trong 78 tệp. Đo tầng Việt: **16** khoá đã dịch mà Pā li có `<b>`,
  và **0** tệp Việt nào chứa chuỗi `<b>` — nên quy ước là bỏ thẻ. `ps1.9:1.1` là ngoại lệ
  duy nhất (thêm nháy đơn `‘Đạo’`), và làm vậy sẽ phá phép so nháy nên tôi không theo.

  **Bất định — ghi ở đây, không thêm vào thân kinh.**
  (1) `3.1` `avassaṁ āgamissatīti` là thành ngữ “đến và lướt qua”, tức *trở thành hiện thực*;
  tôi dịch *sẽ đến và trở thành hiện thực*.
  (2) `6.4` `anaññātaññassāmītindriyaṁ aññindriyaṁ aññātāvindriyaṁ` — ba mục rất khó. Tôi đối
  chiếu `ne14` (Paññattihāravibhaṅnga, chưa dịch) và thấy cùng ba căn ấy được dùng làm
  `sacchikiriyāpaññatti` cho ba tầng trí tuệ: `ne14:17.1` ứng với *căn không để quên điều đã
  biết* (chánh niệm), `ne14:19.1` ứng với *căn khác* (trí tuệ), `ne14:21.1` ứng với *căn có
  biết thấy rõ ràng*. Tôi dịch theo ba đối chiếu ấy, nhưng `aññindriya` → *căn khác* là dịch
