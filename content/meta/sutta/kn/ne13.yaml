  (2) `2.3` `pajappitā` = *lời cầu khẩn* theo 4 tiền lệ (`sn7.18:5.3`, `pe1:129.3`, `ne6:10.3`, `ja500:11.1`); trong bối cảnh định nghĩa ái có thể nghiêng nghĩa *những khao khát lải nhải*, nhưng chưa có căn cứ độc lập để đổi.
  (3) `6.1` `dhamma-` dịch *pháp* trần (không *giáo pháp*): sáu đối tượng vừa liệt kê ở `4.1`/`5.1` kết thúc bằng `dhamma`, nên đọc là pháp (đối tượng của ý); không loại trừ hẳn cách đọc *Pháp* (Dhamma).
  (4) `6.4` Pāli ghim viết `adhipaññā sikkhā paññā` có khoảng trắng; tôi đọc `adhipaññāsikkhā` (*tăng thượng tuệ học*) liền nhau vì `sikkhā` đứng riêng không là đồng nghĩa của tuệ. Nếu ghim đúng là hai mục, thành *tăng thượng tuệ, học*.
  (5) `7.2`: `asaṅkhepagato`, `nirūḷhavaṇo`, `ṭhapitasaṅgāmo`, `bhinnandhakāro`, `balanipphattigato`, `nibbāpitapariyuṭṭhāno`, `ganthaviniveṭhano`, `madditakaṇḍako` đều **0 khoá** khác trong 284.708 khoá Pāli (đo lại); `uddhaṭasallo` có 1 (`thig14.1:24.3`). Dịch theo nghĩa từ gốc; yếu nhất là `asaṅkhepagato` (*không bị thu hẹp* — tôi không đổi thành ý hiểu) và `nirūḷhavaṇo` (*vết thương đã lành*); `ajjhāsaya` dịch *ý hướng* (tiền lệ khác trong tầng là *chí nguyện* ở `dn25`, hợp ngữ cảnh khác); `vaṇṇa` đọc *phẩm đức đáng tán thán* theo `dn4:6.44`, không loại hẳn cách đọc *dung sắc*; `raṇañjaho` *bỏ tranh chấp* theo `iti104`, `sn2.11` (cách đọc *lỗi lầm* ở `tha-ap533` cũng có).
  (6) `15.1` `sāro / maṇḍo / uddhāro / esikā / surabhipasūnaṁ pujjo`: tìm 0 khoá tiền lệ trong tầng. Dịch theo nghĩa từ: *tinh túy, tinh hoa (maṇḍa), phần chắt lọc (uddhāra), cột trụ (esikā), đáng được … dâng hoa thơm cúng kính* (`pasūna` = hoa). **Đây là chỗ yếu nhất của bài**; `uddhāra` có thể là *người nâng đỡ* thay vì *phần chắt lọc*.
  (7) `9.1` Pāli ghim `Asaṅkhataṁnantamanāsavañca`; `sn43.44:2.1` ở cùng danh sách ghi `anataṁ` (*không nghiêng chiều*). Tôi dịch theo ghim: `anantaṁ` *vô tận*; nếu bản gốc là `anataṁ` thì *không nghiêng chiều*.
  (8) `11.3` `anūpasaggaṁ` và `13.1` `araṇaṁ`: dịch *không họa hoạn* và *không tranh chấp* theo `mn115:2.10` và `iti104`; `araṇa` cũng có thể đọc *không lỗi lầm*.
  (9) `6.3` Pāli ghi `vijānanāti`, `6.2` ghi `viññāṇanti` (sandhi với `ti`); đọc là `vijānanā`, `viññāṇaṁ`, không sửa Pāli.
  (10) `13.4` Pāli kết `vuttan”ti`: đọc là *được nói như thế* của cả đoạn kệ, không dịch thêm tân ngữ.

  **Ngoài lát này, báo để biên tập xử lý (không sửa):** `ne29:2.2` và `ne33:2.3` dịch `mano` là *ý chí hành*, và `ne29:2.2` dịch `manāyatana` là *cảnh giới của tâm* — cùng lỗi với bản cũ của `ne13`, nên có thể còn ở các bài `ne` khác (đếm: 2 khoá thấy ở lượt tra này, chưa quét hết tầng).

  **`technical_integrity` = 9,6 vì lượt này không được chạy cổng.** Bốn lệnh còn lại do người biên tập chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`; cổng kiểm cấu trúc của kho (không dùng `npm`) pass 55/55, khớp thứ tự khoá, dấu lược cân bằng Pāli, `final_score` = trung bình thô (8,88).

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 13 khoá chênh lệch lớn nhất → khác nghĩa 4: sửa 1 (16.1 `sippañca sīlaṁ akkhaṇavedhitāya`: "vì bắn trúng trong chớp mắt" → "vì bắn trúng đích chính xác", theo 12/16 khoá `akkhaṇavedhī` đã dịch "trúng đích chính xác" ở an4.181, an4.196, an9.36, ja181, ja510; an3.133 dịch "trúng sát sao"; Pāli không có chữ nào nói "chớp mắt"), giữ 2 (15.1: bản mù dịch `sattānaṁ uddhāro` là "người cứu vớt" và `surabhipasūnaṁ pujjo` là "đóa hoa thơm của chúng sinh"; theo Pāli `sāro, maṇḍo, uddhāro` là chuỗi chỉ phần tinh túy được chắt ra, còn `surabhipasūnaṁ pujjo devānañca manussānañca` là "đáng được hoa thơm của chư thiên và loài người cúng kính", nên giữ; 17.3 `Niyutto … hāro`: bản mù "đã hoàn tất", các khoá `Niyutto … hāro` khác của nhóm ne đều dịch "đã được vận dụng"), bất định 1 (6.4 `adhipaññā sikkhā paññā`: Pāli tách ba từ, bản này gộp hai từ đầu thành "tăng thượng tuệ học" rồi "tuệ"; có thể là hợp từ `adhipaññāsikkhā` bị viết rời hoặc hai mục khác nhau; không phân xử được; khoá này không nằm trong danh sách chênh lệch lớn mà do tôi tự phát hiện khi đọc đối kháng). Các khoá còn lại (11.3, 10.3 `anupasagga`, `anīti`; 9.3, 9.4 `apalokita`, `anidassana`; 7.2 chuỗi mỹ hiệu của Đức Phật; 0.2, 0.4, 1.1) chỉ khác diễn đạt, giữ theo tiền lệ sn43 và các bài ne khác. Hai chỗ bản mù đánh dấu không chắc ở 7.2 và 16.1 đều đã đối chiếu từng mệnh đề với Pāli, không phát hiện thêm lỗi. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; đoạn song song sn43.44, sn7.18,
