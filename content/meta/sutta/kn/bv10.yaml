notes: |-
  Đợt 19, làn 83. Dịch từ Pāli root commit đã ghim, đủ 118/118 khoá (dịch mới toàn bài), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ tám của Buddhavaṃsa theo thứ tự các Đức Phật (`aṭṭhamo`, mục số 10 của bộ), về Đức Phật Paduma: ba lần chứng ngộ và ba kỳ hội chúng, tiền thân là con sư tử hầu hạ Ngài bảy ngày và được thọ ký giữa một koṭi tỳ-kheo, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, hào quang, tuổi thọ, nhập Niết-bàn và xá lợi. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

    **Tiêu đề.**
    - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn các bv đã dịch (11/11 tiền lệ).
    - `0.2` “10. Dòng Kế Thừa Của Đức Phật Paduma”: cùng khuôn với `bv16:0.2`, `bv17:0.2`, `bv20:0.2`; tên viết “Paduma” (bỏ đuôi `-o` của danh cách như “Phussa”, “Tissa”, “Sikhī”). `vaṁso` ở `30.1` cũng là “Dòng kế thừa”; `aṭṭhamo` = 8 (khớp `bv16:27.1` `cuddasamo` = 14 theo thứ tự các Đức Phật).

    **Số Pāli, đã tự tính.** `tayo` 3 (3.3 ba lần chứng ngộ khớp ba khoá `4.2`/`4.4`/`5.4` = thứ nhất, thứ hai, thứ ba; 6.1 ba kỳ hội chúng khớp ba số ở `6.3`, `8.3`, `9.4`; 17.4 ba lâu đài khớp ba tên ở 17.3: Nandā, Vasu, Yasuttarā). `koṭisata` = 100 koṭi (4.2, một trăm koṭi). `navutikoṭi` = 90 koṭi (4.4). `asītikoṭī` = 80 koṭi (5.3). `koṭisatasahassa` = 100 × 1.000 koṭi = **một trăm ngàn koṭi** (6.3; cùng cách tính `bv16:3.3`). `tīṇi satasahassāni` = 3 × 100.000 = **300.000** (8.3, “ba trăm ngàn”). `dvinnaṁ satasahassinaṁ` = 2 × 100.000 = **200.000** (9.4, “hai trăm ngàn”). `koṭibhikkhū` = một koṭi tỳ-kheo (12.4, không quy đổi). `dasavassasahassa` = 10 × 1.000 = **10.000 năm** (17.1). `tettiṁsa` 33, nhân 1.000 = **33.000** (18.1; cùng giá trị `bv16:16.1`). `caturo` 4 (19.1). `anūnaaṭṭhamāsa` = không thiếu + 8 = **đủ tám tháng** (19.3). `aṭṭhapaṇṇāsa` = 8 + 50 = **58** ratana (24.1). `vassasatasahassa` = 100 × 1.000 = **100.000 năm** (26.1). `sattāha` = 7 ngày (11.4, 12.1). `tikkhattuṁ` = ba lần (11.3). `dasapāramī` 10 (15.4). Thang lớn nhân cả số đã tích lũy, không nhân riêng chữ số đứng trước. Không có cụm `Tiṁsakappasahassa` ở bài này.

    **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã dịch ở bộ kn (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 49 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 1.171 cặp (khoá trùng dùng nhiều là `…pe…` 897 cặp), trong đó 45 khoá dùng đúng nguyên văn một tiền lệ và 4 khoá viết khác tiền lệ: `1.3`, `13.3`, `16.2`, `28.1`. Lý do 4 khoá khác:
    - `1.3` `Padumo nāma nāmena`: tiền lệ gần nhất `bv24:1.3` (“tên gọi là Kakusandha,”, Pāli `Kakusandho nāma nāmena`), dùng khuôn đó; ba tiền lệ trùng chữ ở `tha-ap` là lời kể ngôi thứ nhất hoặc tên hoa sen, không hợp.
    - `13.3` `Aparimeyyito kappe`: tiền lệ duy nhất `bv28:1.1` “Vào vô lượng kiếp trước đây,” là lời quá khứ (Đức Phật Gotama nói về thời xa xưa). Ở đây động từ `bhavissati` ở `13.4` là tương lai nên dịch “Sau vô lượng kiếp nữa,” theo khuôn thọ ký `bv16:11.3`, `bv18:10.3`, `bv20:9.3` (“Sau … kiếp nữa,”), không theo `bv28:1.1`.
    - `16.2` `asamo nāma khattiyo`: tiền lệ duy nhất `tha-ap273:3.2` “ta là vị Sát-đế-lợi tên Asama;” là ngôi thứ nhất; ở đây là cha của Đức Paduma, dùng khuôn `bv16:14.2`, `bv20:14.2` (“vị Sát-đế-lợi tên là …”).
    - `28.1` `Uragova tacaṁ jiṇṇaṁ`: hai tiền lệ (`ja354:1.1`, `pv12:1.1`) mở nháy kép vì là đầu lời; ở đây dấu nháy mở đã nằm ở `1.1`, nên bỏ “ phía trước.
    - Dùng lại đúng nguyên văn một tiền lệ: 45 khoá — `0.1`, `1.2`, `1.4`, `3.1`, `3.2`, `5.3`, `5.4`, `6.1`, `6.3`, `6.4`, `8.2`, `10.1`, `11.1`, `13.4`, `14.1`–`14.3`, `15.1`–`15.4`, `17.1`, `17.2`, `17.4`, `18.2`, `19.1`–`19.4`, `20.1`, `20.3`, `21.2`, `22.2`, `22.3`, `23.2`, `23.4`, `24.1`, `24.2`, `26.1`–`26.4`, `27.4`, `29.3`, `29.4`.
    - Trùng nguyên văn **trong chính bài**: 1 nhóm (3 khoá `padumassa mahesino` ở `6.2`, `16.4`, `21.4`). Việt khác ở `6.2` (“nơi Paduma, bậc Đại Ẩn Sĩ;”) so với `16.4`, `21.4` (“của Paduma, bậc Đại Ẩn Sĩ.”) vì vế trước khác: `6.1` là “ba kỳ hội chúng … nơi” (định vị), `16.3` và `21.3` là “mẹ/thị giả … của” (sở hữu), đúng như `bv20:5.2` so với `bv20:14.4`. Không có nhóm trùng nào khác.

    **Thuật ngữ, đã đo trên tầng (kn).** `narāsabho` “đấng Nhân Ngưu” (37 trên 45 khoá chứa dạng này; “bậc Nhân Ngưu” 3), dùng “đấng” ở `9.1`; `lokanāyako` “bậc Dẫn Đạo thế gian” (76 trên 124; “Lãnh Đạo” 15, “Dẫn Dắt” 8, “Dẫn Lộ” 7) ở `20.2`; `mahāvīro` “Đại Anh Hùng” (41 trên 47); `padakkhiṇaṁ` “nhiễu” (22 trên 26); `viveka` “viễn ly” (31 trên 47; “thanh vắng” 6, “ly tịch” 3) ở `10.3`; `anubrūhantaṁ` “nuôi dưỡng” (8 trên 11); `upaṭṭhahaṁ` “phụng sự” (10 trên 26; “hầu hạ” 3, “phục vụ” 2) ở `11.4`; `ovadī` “khuyên dạy” (5 trên 19; “chỉ dạy” 3, “giáo huấn” 2) ở `5.2`, cùng nghĩa `ovadiṁ mama atrajaṁ` → “đã khuyên dạy người con ruột của ta”; `anusāsitvā` “chỉ dạy” (23 trên 79; “giáo giới” 5, “khuyên dạy” 5) ở `27.3`; `bodhayi` “giúp … giác ngộ” (1 tiền lệ: `bodhayitvā bahū satte` “Sau khi giúp nhiều chúng sinh giác ngộ”) ở `4.2`, `4.4`, `27.2`; `abhisamayo` “chứng ngộ” (theo `bv16:3.2`, `bv17:2.4`); `jahitvā` “Sau khi từ bỏ” (đa số trong 43 khoá); `samāpatti` “chứng đạt” theo tầng mil; `dhammasenāpati` “Tướng quân Chánh pháp” (tầng chia “Tướng quân Pháp” 9 và “Tướng quân Chánh pháp” 8; chọn dạng quen thuộc của truyền thống Việt, ghi bất định ở mục dưới); `aparājitā` “không bị khuất phục” (14 trên 56; “bất bại” 4); `mahesino` “bậc Đại Ẩn Sĩ” (theo `bv20:5.2`, `bv20:14.4`); `asama` “vô song”.

    **Bất định (ghi ở đây, không thêm vào thân kinh).**
    1. `3.3`–`3.4` `abhisamayā tayo āsuṁ, mahātamapavāhanā`: `mahātamapavāhanā` (danh từ giống cái, số nhiều) là đồng vị với `abhisamayā`, nên dịch “ba lần chứng ngộ, xua đi bóng tối lớn”; không thêm “là”. `pavāhana` có nghĩa “cuốn đi, quét sạch”, dịch “xua đi”. Cách đọc khác: “những lần xua tan bóng tối lớn”.
    2. `4.2`, `4.4`: `bodhayi` là quá khứ nhân quả “đã làm cho giác ngộ”; dịch “đã giúp … giác ngộ” theo tiền lệ duy nhất của tầng. Pāli không có chữ “vị” hay “người” sau số, nên không thêm danh từ. `4.3` `dhīro` “bậc trí” (61 khoá chứa `dhīro`, các dạng “bậc trí”, “bậc kiên định”, “bậc hiền trí”, “dũng cảm”).
    3. `7.1`–`7.4`: `kathinatthārasamaye` “vào lúc trải y kathina”, `uppanne kathinacīvare` “khi y kathina đã có”. Tầng Việt chưa có tiền lệ nào cho `kathina` (chỉ một khoá nói “may y kathina”), nên giữ nguyên chữ “kathina” như thuật ngữ. `dhammasenāpatitthāya` đọc là `dhammasenāpati` + `atthāya` “cho/vì Tướng quân Chánh pháp” (tức Sāriputta theo chú giải, Pāli của bài không nói tên); dịch “cho” để chỉ người thụ hưởng. Cách đọc khác: “vì lợi ích của Tướng quân Chánh pháp”.
    4. `9.4` `dvinnaṁ satasahassinaṁ`: đọc là “của hai (lần) trăm ngàn” = 200.000; `satasahassin` là dạng tính từ của `satasahassa`. Cách đọc khác: “của hai trăm ngàn vị đã có trăm ngàn”; không ủng hộ vì không có chữ nào cho “vị”.
    5. `10.2` `migādhibhū`: “chúa các loài thú” (`migādhipa` có tiền lệ “chúa loài thú”). `10.3`–`10.4` `pavane addasaṁ jinaṁ`: “trong rừng” đặt cuối câu để giữ cả hai cách hiểu (nơi thấy, và nơi Đức Phật ở viễn ly); Pāli `pavane` cũng đã xuất hiện ở `9.2`.
    6. `12.1`–`12.2` `sattāhaṁ varasamāpattiyā vuṭṭhahitvā tathāgato`: `sattāhaṁ` là đối cách chỉ thời gian; dịch “bảy ngày chứng đạt tối thượng” để giữ nó dính với `varasamāpatti` (sự chứng đạt kéo dài bảy ngày) chứ không dính “xuất khỏi”. `varasamāpatti` dịch “chứng đạt tối thượng”; tầng Việt chưa có tiền lệ cho cụm này (0 khoá). `bậc Như Lai` đứng riêng một dòng vì Pāli đặt `tathāgato` ở cuối `12.2`, câu kết ở `12.4`. `12.3` `manasā cintayitvāna` “sau khi suy nghĩ trong tâm”.
    7. `13.1`–`13.4`: không nói “thọ ký cho ta” vì Pāli chỉ có `tesaṁ majjhe viyākari` “thọ ký giữa các vị ấy”; chủ thể được thọ ký là `ayaṁ` “vị này” ở `13.4`. `13.3` `aparimeyyito kappe` là xuất cách chỉ điểm bắt đầu (`ito`) cộng định cách `kappe`; hiểu là “từ nay, sau vô lượng kiếp”; dịch “Sau vô lượng kiếp nữa” theo khuôn thọ ký của các bv đã dịch. Lời thọ ký tương lai (`bhavissati`) không dịch là “trước đây”.
    8. `14.2` `…pe…`: đoạn lược che mất phần giữa, nên không xác định được “chúng ta” là ai ở `14.3`; giữ nguyên nháy theo Pāli từng khoá và dịch sát chữ, không thêm người nói (cùng cách xử lý ở `bv15`–`bv20`).
    9. `17.3` `nandā-vasu-yasuttarā`: đọc là ba tên “Nandā, Vasu, Yasuttarā” (khớp “ba lâu đài” ở `17.4`). Pāli ghim ghi `Nandā`, bản liên quan khác có thể ghi tên khác ở chỗ này; giữ đúng chữ Pāli đã ghim.
    10. `18.3`–`18.4` `uttarā nāma sā nārī, rammo nāmāsi atrajo`: “Người nữ ấy tên là Uttarā”, “người con ruột tên là Ramma”; `atrajo` “con ruột” (khoá khác trong tầng: 19 khoá có `atrajo`, cùng nghĩa).
    11. `20.4` `dhanañcuyyānamuttame`: đọc là `dhanañca-uyyāna` + `uttame` “ở Dhanañcuyyāna tối thượng”, giữ nguyên chữ Pāli như tên riêng, cùng cách với `bv16:18.4` “Anomuyyāna”. Cách đọc khác: “ở vườn Dhanañca tối thượng” (`uyyāna` = vườn; tầng dịch “vườn” 11 khoá, giữ nguyên 4 khoá).
    12. `22.4` `mahāsoṇoti vuccati`: `ti` là chữ dẫn tên (`mahāsoṇo` + `iti`); “được gọi là Mahāsoṇa”, cùng khuôn `bv16:20.4`. `23.1` `bhiyyo`, `23.3` `nandarāmā`: đọc là tên người theo vị trí trong danh sách thị giả như `bv16:21.1`; `bhiyyo` cũng có thể là phó từ “càng, hơn”, không hợp vì có `ceva … ca` và `ahesuṁ aggupaṭṭhakā` đi sau.
    13. `24.3`–`24.4` `pabhā niddhāvatī tassa asamā sabbaso disā`: “Hào quang của Ngài phóng tỏa ra, không gì sánh bằng, khắp mọi phương”; `asamā` (giống cái) bổ nghĩa `pabhā`. Tầng có tiền lệ `pabhā niddhāvate tassa` “Hào quang của Ngài phóng tỏa ra” (3 khoá).
    14. `25.2` `ratanaggimaṇippabhā`: đọc là `ratana + aggi + maṇi + pabhā` “ánh sáng của châu báu, lửa và ngọc ma-ni”; cách đọc khác (bỏ `aggi`): “ánh sáng của châu báu và ngọc ma-ni”. `25.3` `sabbāpi tā hatā honti`: `hata` là “bị đánh tan, bị đập”; dịch “bị lu mờ” theo nghĩa ánh sáng bị áp đảo; cách đọc sát chữ hơn: “đều bị đánh tan”. Tầng Việt chưa có tiền lệ cho cụm này (0 khoá). `25.4` `jinapabhuttamaṁ` đọc là `jina-pabhā-uttamaṁ` “hào quang tối thượng của bậc Chiến Thắng”.
    15. `27.1`–`27.2` `paripakkamānase satte … bodhayitvā asesato`: “những chúng sinh có tâm đã chín muồi … sau khi giúp giác ngộ, không sót ai”; `asesato` là phó từ “không sót, trọn vẹn”, đứng sau động từ nên buộc với `bodhayitvā`.
    16. `28.2` `vaddhapattaṁva pādapo`: “như cây bỏ lá già”; động từ “bỏ” ở `28.1` (`uragova tacaṁ jiṇṇaṁ`) được hiểu cho cả hai vế. `vaddha` có thể là “già, héo” (từ `vuḍḍha`) hoặc “bị cắt”; chọn “già”. `28.4` `nibbuto so yathā sikhī`: “như ngọn lửa” (không thêm “tắt”; cùng nghĩa `nibbuta` đã được dịch “nhập Niết-bàn”). Tầng Việt chưa có tiền lệ cho `nibbuto so yathā sikhī` (0 khoá).
    17. `29.1` `padumo jinavaro satthā`: “Paduma, bậc Chiến Thắng tối thượng, bậc Đạo Sư”; `jinavaro` “bậc Chiến Thắng tối thượng” theo `bv16:26.1`, `bv20:25.1`, `bv29:1.1`. `29.2` `dhammārāmamhi`: đọc là một tên (“Dhammārāma”), cùng cách `bv16:26.2` “Anomārāma”.
