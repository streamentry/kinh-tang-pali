notes: |-
  Đợt 19, làn 63. Dịch từ Pāli root commit đã ghim, đủ 85/85 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là kệ tổng hợp cuối của Buddhavaṃsa (hai khoá `0.x`, 80 khoá kệ ở 20 bài kệ, một khoá kết `21.1`): liệt kê các Đức Phật theo thời điểm, từ Dīpaṅkara đến Metteyya, kèm số kiếp cách nhau. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bài không có nháy đơn, nháy kép hay dấu lược `…` trong Pāli, nên bản Việt cũng không có.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn `bv29:0.1` (1/1 tiền lệ).
  - `0.2` “28. Phần Tạp Tập Về Các Đức Phật”: `pakiṇṇaka` → “Tạp Tập” (`ja484`–`ja491` “Bộ Tạp Tập” 6 khoá; `pe7:0.2` “Phần Giải Thích Tạp Tập”; riêng `dhp290:0.3` dịch “Phẩm Tạp Lục” cho `vagga`, nên không lấy). `kaṇḍa` → “Phần”, cùng cách `pe7:0.2` dịch `-niddesa` bằng “Phần …”. `buddha-` ở dạng ghép số nhiều → “Các Đức Phật”, cùng cách đã dịch ở `0.1`. Phương án khác: “Chư Phật”, hoặc “Chương” cho `kaṇḍa` (tầng chỉ có `kp8:0.2` `Nidhikaṇḍasutta` “Kinh Bảo Tàng”, không dịch riêng `kaṇḍa`).
  - `21.1` `niṭṭhitaṁ` → “đã hoàn tất”: 12 khoá colophon cùng kiểu trong tầng (thig, kp, snp5.1) dùng “hoàn tất/đã hoàn tất” 6 khoá, “đã khép lại” 4, “kết thúc” 3, “chấm dứt” 2, “viên mãn” 2, “đã hết” 2 (một số khoá cùng đếm vào hai dạng vì lặp ở bài anh em); chọn “đã hoàn tất”. Chữ `ti` ở cuối `20.4` (`sasāvakāti`) không có nháy mở trong Pāli nên không thêm nháy.

  **Số Pāli, đã tự tính.** `caturo` 4 (1.2): bốn bậc Điều Ngự = Taṇhaṅkara, Medhaṅkara, Saraṇaṅkara, Dīpaṅkara, khớp 1.3–1.5. `eko` 1 (2.3, 10.2, 14.2). `duve` 2 (11.2, 15.2, 17.2) = Sumedha/Sujāta, Tissa/Phussa, Sikhī/Vessabhū, đủ 2 tên mỗi lần. `tayo` 3 (12.2, 18.2) = Piyadassī/Atthadassī/Dhammadassī và Kakusandha/Koṇāgamana/Kassapa. `pañca` 5 (19.3) = ba vị ở 18.3–18.4 + “ta” (19.1) + Metteyya (19.2). `kappasatasahassa` 100 × 1.000 = **100.000** “một trăm ngàn kiếp” (10.1; tiền lệ `tha-ap9`, `tha-ap10`, `tha-ap11`, `tha-ap20`). `tiṁsakappasahassa` 30 × 1.000 = **30.000** “ba mươi ngàn kiếp” (11.1): `tiṁsa` = 30 được xác nhận ngay trong bài bằng `ekatiṁse` ở 17.1 (1 + 30 = 31); tầng có 9 khoá Pāli trùng `Tiṁsakappasahassamhi` và đều dịch “ba mươi ngàn” (5/9 đúng nguyên văn “Vào ba mươi ngàn kiếp trước đây,”). `aṭṭhārase kappasate` 18 × 100 = **1.800** “một ngàn tám trăm kiếp” (12.1; 10/17 tiền lệ đúng nguyên văn). `catunnavutito` 4 + 90 = **94** (14.1; 114 khoá Pāli trùng, 57 đúng nguyên văn “chín mươi tư kiếp trước đây”). `dvenavute` 2 + 90 = **92** (15.1; 43 khoá Pāli trùng, 17 đúng nguyên văn). `ekanavutito` 1 + 90 = **91** (16.1; 117 khoá Pāli trùng, 40 đúng nguyên văn). `ekatiṁse` 1 + 30 = **31** (17.1; 23 khoá Pāli trùng, 12 đúng nguyên văn). Thứ tự giảm dần 100.000 → 30.000 → 1.800 → 94 → 92 → 91 → 31 → kiếp Hiền khớp thứ tự thời gian các Đức Phật. Không có `asaṅkhiya` quy đổi số: ở 3.4, 4.4, 6.4, 9.4 giữ “không thể đếm hết”.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 14 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác (`0.1`, `2.4`, `8.4`, `10.1`, `10.3`, `10.4`, `11.1`, `12.1`, `14.1`, `14.4`, `15.1`, `16.1`, `17.1`, `18.1`). Trong 14 khoá đó: 9 khoá dùng đúng dạng đa số (`0.1`, `10.3`, `10.4`, `11.1`, `12.1`, `14.1`, `15.1`, `16.1`, `17.1`), 2 khoá dùng một dạng có trong tầng nhưng không phải dạng đứng đầu (`14.4` “bậc y sĩ vô thượng” theo `mn92:19.17`, `snp3.7:25.4` viết “tối thượng”; `18.1` “Trong hiền kiếp này”, 1/2 tiền lệ, khoá kia viết “kiếp lành lành” và có vẻ là lỗi gõ), 3 khoá khác dạng đã có: `2.4`/`8.4` và `10.1`.
  - `2.4`, `8.4` `tāresi janataṁ bahuṁ`: duy nhất một tiền lệ trùng nguyên văn là `tha-ap343:1.4` “cứu vớt đông đảo chúng sanh”. Tôi không lấy vì `tāresi` ở tầng dịch “đưa” 20 khoá và “vượt qua” 8 khoá, chỉ 4 khoá “cứu vớt”; `janataṁ` dịch “người” 33, “mọi người” 11, “dân chúng” 9, “chúng sinh” 3, “chúng sanh” 1. Viết “đưa đông đảo mọi người vượt qua” là cách hiểu sát nghĩa chữ (tarati = qua, chở qua) và không thêm nghĩa “cứu độ”.
  - `10.1` `Kappasatasahassamhi`: 10 khoá trùng, 5 dạng khác nhau (3/3/2/1/1); không dạng nào đứng đầu rõ. Chọn “Vào một trăm ngàn kiếp trước đây,” theo họ dạng “Vào … kiếp trước đây” đang dùng ở 11.1, 14.1, 17.1.
  - `10.3`: tiền lệ 12/13 viết “Đức Padumuttara, bậc hiểu rõ thế giới,”; giữ nguyên, tức khoá này có “Đức” dù Pāli không có `bhagavā`. Các chỗ khác trong bài giữ tên trần theo Pāli.
  - `10.4` “bậc tiếp nhận lễ vật hiến cúng.” là 15/18 tiền lệ, chỉ đổi `;` thành `.` theo Pāli từng khoá.
  - Trong chính bài: 8 nhóm Pāli trùng (sau khi bỏ chữ hoa và dấu câu), gồm 20 khoá: `2.4`+`8.4`; `3.4`+`4.4`+`6.4`+`9.4`; `4.3`+`6.3`+`9.3`; `5.3`+`7.3`; `10.2`+`14.2`; `11.2`+`15.2`+`17.2`; `12.2`+`18.2`; `15.4`+`17.4`. Bản Việt trong từng nhóm giống hệt nhau ⇒ 0 cặp lệch. Chú ý `3.3` `Etesaṁ antarā kappā` (“này”) khác `4.3`, `6.3`, `9.3` `Tesampi antarā kappā` (“ấy cũng”) về Pāli nên Việt cũng khác.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá, đếm số khoá).
  - `kappa` → “kiếp” (856 khoá có “kiếp” trên 1.621 khoá chứa `kappa`; “kỳ” 5). `sahassa` → “ngàn” (516) so với “nghìn” (217); chọn “ngàn” theo đa số và theo 4 khoá `tha-ap` trùng nguyên văn.
  - `vināyaka` → “bậc Điều Ngự”: 7 khoá “Điều Ngự” trên 20 khoá `vināyak-` (còn lại “hướng dẫn” 8 là dạng động từ, “dẫn dắt” 1, “Dẫn Đường” 1, “Đạo sư” 1). Chọn “Điều Ngự” cho danh từ để phân biệt với `nāyaka` → “bậc Dẫn Đạo” (`lokanāyaka` “Dẫn Đạo” 47/94, `tha-ap11:2.1` đúng cặp `Padumuttaro nāyako`). Cẩn thận: “Điều Ngự” cũng quen dùng cho `purisadammasārathi`, nhưng trong tầng đây là cách dịch `vināyaka` ở `tha-ap31`, `thag4.6`. Đây là điểm yếu nhất về thuật ngữ trong bài.
  - `sambuddha` → “bậc Chánh Đẳng Giác” (1.162/1.392). `satthā` → “Đạo Sư” (766/1.273; “Bậc Thầy” 114). `jina` → “bậc Chiến Thắng” (80 khoá “Chiến Thắng”, 42 “Bậc Chiến Thắng”). `muni` → “Mâu-ni” (47/96; “Ẩn Sĩ” 22); `mahāmuni` → “Đại Mâu-ni” (27/46; “Đại Ẩn Sĩ” 7).
  - `lokavidū` → “bậc hiểu rõ thế giới”: dạng đúng nguyên văn của `Padumuttaro lokavidū` (12/13); toàn tầng `lokavid-` có “hiểu biết thế gian” 41, “hiểu rõ thế gian” 17, “hiểu rõ thế giới” 14. Dùng cùng dạng ở `14.3` cho nhất quán trong bài.
  - `appaṭipuggala` → “không ai sánh bằng” (3 khoá “không ai sánh bằng” trên 17 khoá chứa từ; tầng dịch lẫn “Một người không ngang hàng” ở `mn5`); `asama` → “vô song” (3 khoá, “không ai sánh” 3, “ngang bằng” 2). Ghép “vô song, không ai sánh bằng” ở 15.4, 17.4 để giữ cả hai từ Pāli.
  - `dvipaduttama` → “tối thắng giữa loài hai chân” (`snp5.1:20.6`, `snp5.1:23.6`, `tha-ap11:2.2`). `pabhaṅkara` (tính từ) → “chiếu sáng” (3 khoá; viết thường để phân biệt với tên Phật Pabhaṅkara ở `tha-ap342`). `cakkhumanta` → “có mắt” (`tha-ap484:6.2`). `mahāyasa` → “có danh tiếng lớn” (`tha-ap484:6.2` “có danh tiếng lớn”; “Đại Danh Xưng” 2 khoá). `tamantakāraka` → “chấm dứt bóng tối”: 0 tiền lệ cho từ này; dịch theo cấu tạo `tama` (bóng tối) + `anta-kāraka` (người làm chấm dứt).
  - `sallakatta` → “y sĩ” (`mn92:19.17` đúng cặp `sallakatto anuttaro`). `anuttara` → “vô thượng” (102/149; “tối thượng” 49). `kāruṇika` → “có lòng từ bi” (“từ bi” 11, “bi mẫn” 5, “thương xót” 2). `satta` → “chúng sinh” (86; “chúng sanh” 14). `bandhana` → “trói buộc” (`sn1.70:3.2`, `mn80:16.13`).
  - `bhaddakappa` → “hiền kiếp” (8/10 khoá trùng mang “hiền kiếp”). `sāvaka` → “đệ tử” (1.663/1.911, “môn đồ” 20). `nibbuta` → “nhập Niết-bàn” (81 khoá, và `bv29:1.2`). `dhīra` → “bậc trí” (83). `lokānukampaka` → “có lòng thương tưởng thế gian” (tầng viết `lokānukampāya` “thương tưởng thế gian”, `sn2.9:4.4` đúng dạng `lokānukampakā` “có lòng thương tưởng đến đời”). `dhammarāja` → “Pháp vương” (18/65; “vua Pháp” 12, “Vua Pháp” 12, “vua Chánh pháp” 8). `koṭi` giữ nguyên chữ Pāli “koṭi” (40 khoá; “triệu” 7).
  - Tên Đức Phật, đếm trên tầng (số tệp / số lần): Dīpaṅkara 1/2, Koṇḍañña 9/18, Maṅgala 3/3, Sumana 18/38, Revata 13/41, Sobhita 17/25, Anomadassī 2/3, Paduma 20/49, Nārada 14/58, Padumuttara 61/70, Sumedha 13/19, Sujāta 6/11, Piyadassī 3/4, Atthadassī 11/16, Siddhattha 66/72, Tissa 50/138, Phussa 8/8, Vipassī 71/341, Sikhī 30/56, Vessabhū 17/31, Kakusandha 13/38, Koṇāgamana 8/22, Kassapa 90/594, Metteyya 9/18; Taṇhaṅkara, Medhaṅkara, Saraṇaṅkara: 0 (ba tên mới hoàn toàn, viết dạng gốc bỏ đuôi `-o` của danh cách trong Pāli `Taṇhaṅkaro`, `medhaṅkaro`, `saraṇaṅkaro`). Giữ nguyên chữ Pāli có dấu, cùng dạng với Pāli của chính bài (tên riêng từ nguồn). **Lưu ý không nhất quán đã có sẵn ngoài bài:** `Dhammadassī` có dấu 0 khoá, chỉ có `Dhammadassi` không dấu (1 khoá, `bv17:26.1`), và `Atthadassi` không dấu 1 khoá (`bv16:27.1`) so với `Atthadassī` có dấu 11 tệp; bài này dùng dạng có dấu, theo Pāli. Tôi không sửa hai khoá ngoài phạm vi.
  - Khoá mở “Vào N kiếp trước đây/trước” khác nhau ở “đây” giữa 12.1, 15.1, 16.1 và 11.1, 14.1, 17.1; đây là hệ quả của việc dùng lại dạng đa số cho từng khoá trùng nguyên văn, và cả hai dạng đều có tiền lệ cùng Pāli.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `20.1`–`20.4`: `Etesaṁ dhammarājūnaṁ, aññesaṁ anekakoṭinaṁ` đều ở sở hữu cách. Tôi đọc là chủ đề của câu (“Các vị Pháp vương này, và nhiều koṭi vị khác … các vị ấy … đã nhập Niết-bàn”), `te` ở 20.4 nhận lại cả hai. Cách đọc khác: `aññesaṁ anekakoṭinaṁ` là những người được chỉ đường (“sau khi chỉ ra con đường ấy của các Pháp vương này cho nhiều koṭi người khác”), tức bản Việt hiện hành của Bhikkhu Indacanda. Hai cách đều hợp ngữ pháp; cách của tôi giữ nguyên hai sở hữu cách ngang hàng và không thêm đối tượng cho `ācikkhitvāna`. Thêm: “vị” ở “koṭi vị khác” là lượng từ chỉ người, Pāli không có chữ này, nên nếu `aññesaṁ` chỉ không phải các bậc giác ngộ thì phải sửa.
  2. `20.3` `taṁ maggaṁ` “con đường ấy”: Pāli không nói rõ đường nào; tôi dịch sát chữ, không thêm “Niết-bàn” hay “giải thoát”.
  3. `11.1` `Tiṁsakappasahassa`: tôi chọn 30.000 kiếp theo cấu tạo và 9/9 tiền lệ cùng Pāli; không có bản Anh độc lập trong tầng đã ghim nên không đối chiếu được ngoài Pāli. Nếu truyền thống chú giải đếm khác, canonical text không đổi vì Pāli chỉ nói “ba mươi nghìn kiếp”.
  4. `11.4` `orato padumuttarā`, `13.1` `Orato ca sujātassa`: `orato` nghĩa “về phía này (gần chúng ta hơn)”; tôi dịch “sau Padumuttara”, “Và sau Sujāta”, đọc theo thứ tự thời gian của bài (30.000 kiếp gần hơn 100.000 kiếp). Cách dịch sát chữ hơn là “ở phía này của …”, nhưng khó hiểu.
  5. `10.1`, `11.1`, `12.1`, `14.1`–`17.1`: Pāli chỉ viết số kiếp (vị trí cách, hoặc ablative + `ito`); “trước đây” là cách các khoá trùng ở tầng thể hiện mốc “tính từ lúc nói”, mốc này là Đức Phật Gotama đang kể (`ahaṁ` ở 19.1). Không có chữ nào trong Pāli ở đây nói rõ “từ nay”.
  6. `19.2` `metteyyo cāpi hessati`: `hessati` = “sẽ có / sẽ là”; tôi viết “và cũng sẽ có Metteyya”, giữ nghĩa tồn tại, không bổ sung “làm Phật” hay “xuất hiện ở đời”. Cách đọc khác có vị ngữ `sambuddho` nối từ 19.1: “và Metteyya cũng sẽ là (bậc Chánh Đẳng Giác)”.
  7. `6.2` `anomadassī mahāyaso`: `mahāyaso` đọc là tính từ của Anomadassī (“bậc có danh tiếng lớn”), không phải tên riêng.
  8. `1.6` `ekakappamhi te jinā`: “ở trong một kiếp” là cách dịch chữ; Pāli không nói rõ “cùng một lúc” hay “lần lượt trong cùng một kiếp”. Các khoá 5.3, 7.3, 13.3 dùng cùng cách.
  9. `3.1`–`3.2`, `9.1`–`9.2`: Pāli đặt tên hai vị ở sở hữu cách rồi mới tới `antarā` ở 3.3; tôi dịch tên ở hai khoá đầu như tên đứng riêng và để “ở giữa hai vị này” ở khoá sau (không thêm “giữa” vào hai khoá đầu, vì đó sẽ là cắt lệch cấu trúc khoá).

