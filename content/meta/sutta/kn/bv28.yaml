  **Đính chính số đo ở các mục trên (đo lại 2026-10-13, tầng Việt hiện có).**
  - Trùng nguyên văn trong tầng: 30 khoá của bài có Pāli trùng khoá đã dịch ở bài khác (637 cặp), không phải 14. Trong 30 khoá: 24 khoá dùng đúng dạng đứng đầu; 6 khoá khác dạng đứng đầu có lý do: `1.1`, `10.1` (chiều thời gian, xem dưới), `3.1` (tiền lệ `bv3:14.3` “Của Đức Thế Tôn Dīpaṅkara,” là sở hữu cách đứng một mình trong câu khác; ở đây hai khoá sau mới có chữ “ở giữa”, nên không thêm “Của”), `6.2` (hai tiền lệ ở `tha-ap` đứng sau “Vào lúc ấy Đức Thế Tôn,”; ở đây cùng khung “Sau Sobhita, có …” như `2.2`, `4.2` đã dùng “có”), `9.2` (tiền lệ ở `bv12` là “nơi/của bậc Đạo Sư Padumuttara”, ngữ cảnh khác; ở đây thêm “và” nối với `9.1` như `3.2` có `ca`), `16.2` (4/5 tiền lệ ở `thi-ap`, `tha-ap` đứng trước vị ngữ “đã xuất hiện” ở khoá sau; ở đây khoá sau là `Sopi buddho kāruṇiko` không có động từ nên cần “đã có”).
  - `2.4`, `8.4` `tāresi janataṁ bahuṁ`: có 34 khoá Pāli trùng (không phải một), 32 khoá đúng nguyên văn “vị ấy đã đưa đông đảo mọi người vượt qua.” — khoá của bài khớp 32/34 đúng dạng đa số; mục lý giải “không lấy tiền lệ `tha-ap343:1.4`” ở trên là lập luận cũ, nay thay bằng số đếm này.
  - `vināyaka` → “bậc Điều Ngự”: ngoài danh từ ở `thi-ap`, `tha-ap`, `bv`, `thag4.6`, `vv16` còn rất nhiều khoá khác; đếm lại khoảng 40 khoá danh từ `vināyak-` dùng “Điều Ngự” so với cỡ 12 khoá dùng “Hướng Đạo”, “Dẫn Dắt”, “Hướng Dẫn”, “Dẫn Đường”, “Lãnh Đạo”, “Đấng Điều Phục” (chưa tính 8 khoá `mn85` dùng `vināyaka` chỉ Đức Như Lai như vai trò “hướng dẫn”); điều này làm yếu đi nhận định “điểm yếu nhất về thuật ngữ” ở trên: “Điều Ngự” là đa số rõ.
  - `1.1` `Aparimeyyito kappe`: bản ghi trước không nêu khoá này trong các khoá trùng. Có 9 khoá trùng (`bv2:61.3`, `bv4:11.3`, `bv5:12.3`, `bv6:18.3`, `bv7:12.3`, `bv8:13.3`, `bv9:14.3`, `bv10:13.3`, `bv11:15.3`), cả 9 dịch “Sau vô lượng kiếp nữa,” vì là lời thọ ký hướng về tương lai (“sẽ trở thành Đức Phật”). Ở đây động từ là `āsuṁ` (quá khứ) nên hướng thời gian ngược lại; giữ “Vào vô lượng kiếp trước đây,”, cùng họ với `thi-ap30:44.1`, `thi-ap28:60.1` `Aparimeyye ito kappe` “Vào vô lượng kiếp trước,”. Cùng lý do cho `10.1` `Kappasatasahassamhi`: 25 khoá trùng đều là thọ ký tương lai (“Sau/Vào một trăm ngàn kiếp nữa, sinh ra trong dòng họ Okkāka”), không có khoá nào hướng quá khứ để lấy; đoạn ghi cũ “5 dạng 3/3/2/1/1” ít chính xác, nay không dạng nào dùng được nguyên văn.
  - `7.4` `tamantakārakā`: vẫn không có tiền lệ cho đúng từ. Căn cứ phụ mới: vế `-antakara`/`-antakāraka` ở `dukkhassantakara` có 84 khoá trong tầng, phần lớn dịch “chấm dứt khổ” (31 khoá “ngay trong hiện tại là người chấm dứt khổ”, 7 “làm chấm dứt khổ”, `mn71:13.1`); `dn16:4.3.9` dịch “làm tận cùng khổ”. Vì vậy “chấm dứt bóng tối” theo cấu tạo `tama` + `antakāraka` có cơ sở hơn trước, nhưng đây vẫn là phép suy từ cấu tạo từ, không phải tiền lệ của chính từ này; không đổi khoá và không hạ bất định.
  - Không đổi dù nghi ngờ: `11.4`/`13.1` “sau Padumuttara”, “Và sau Sujāta” (đọc `orato` theo thứ tự thời gian, đã nêu ở bất định 4); `19.3` “Cả năm vị Phật này” (“Cả” diễn `etepime` nhấn mạnh); `10.3` có “Đức” (12/13 tiền lệ).

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 2 khoá bất đồng nghĩa → sửa 0, giữ 1 (14.4 sallakatto: bản nguyên bài sâu sắc, Pāli là y sĩ phẫu thuật), bất định 1 (20.1 và 20.2 etesaṁ dhammarājūnaṁ aññesaṁnekakoṭinaṁ: bản nguyên bài hiểu vế sau là người được chỉ đường, bản dự án hiểu cũng là các bậc Pháp vương; ngữ pháp cho phép cả hai). Số đã đối chiếu độc lập đều khớp: 10.1 một trăm ngàn kiếp, 11.1 ba mươi ngàn kiếp (tiṁsa là ba mươi, cả bản nguyên bài cũng viết ba chục ngàn), 12.1 một ngàn tám trăm kiếp, 14.1 chín mươi tư, 15.1 chín mươi hai, 16.1 chín mươi mốt, 17.1 ba mươi mốt. Đọc đối kháng lại cả 85 khoá, không có khoá nào phải đổi. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
