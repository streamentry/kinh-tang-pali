  BẤT ĐỊNH (bài không có tầng Anh để đối chiếu):
  1. `1.1` `saññatūrū`: đọc là "đôi đùi cân đối" (saññata + ūru); nghĩa chính xác của `saññata` ở đây (cân đối, khép, hay được giữ gìn) không phân xử được từ tầng.
  2. `2.1` `Okiṇṇantaraparikhaṁ`: dịch "các hào ngăn dày đặc" (okiṇṇa = rải đầy, antara-parikha = hào bên trong/hào ngăn); hình dung đúng của thành này chưa chắc. `3.1`–`3.2` đọc là "ngay cả chàng trai trẻ cũng không có đường vào".
  3. `4.4` `Puṇṇakaṁsaṁ` → "một bát đồng đầy" (Pāli không nói đầy gì); `6.4` `rūpiyaṁ kaṁsapūraṁ` → "một bát đồng đầy bạc". Hai cách có thể là cùng một vật.
  4. `7.1`–`7.4` khó nhất bài: câu `Ukkaṁsatī yattha karoti chandaṁ` đọc là "tán dương nàng ở nơi anh ta đặt lòng ham muốn", và `Paccakkhato thokatarena esi` là "rõ ràng ngài đến chỉ với một món rất nhỏ" (so với "pháp của chư thiên"). Còn cách đọc khác về chủ ngữ của `ukkaṁsati` và nghĩa của `esi`; người rà soát nên phán.
  5. `8.3` `Teneva vaṇṇena` đọc là "cũng theo cách ấy" (vaṇṇa = cách/lý do, như `3.3` `kena vaṇṇena`); cách đọc "cùng với sắc đẹp ấy" cũng có thể.
  6. `18.4`, `19.4`, `20.4`, `21.4` `Udaye` được đọc là hô cách của Udayā (tức công chúa Udayabhaddā) — "này Udayā" — chứ không phải Udaya nam; chữ `Udayabhaddā` không xuất hiện trong bài này nên đây là suy từ ngữ cảnh người nghe.
  7. `22.6` `kāsiṁ surundhanaṁ` → "Kāsi, Surundhana": không phân xử được `surundhana` là tên thành (đồng vị với Kāsi) hay tính từ của Kāsi.
  8. `15.4` `subrahā` → "thân hình cao lớn", `16.2` `saṅgarattā` → "vì lời giao ước", `6.3` `sucimhite` → "nụ cười trong sạch/trong sáng": 0 tiền lệ trong tầng, dựng từ Pāli.

  Phép kiểm tra: tập khoá Việt = tập khoá Pāli (97/97, thứ tự trùng); nháy khớp Pāli từng khoá (34 ký tự, 0 lệch); NFC đạt; 0 khoá rỗng, 0 khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng (Jātaka, Udayā, Kāsi, Surundhana). Đã in cặp Pāli↔Việt ra đọc toàn bài (97 cặp).

