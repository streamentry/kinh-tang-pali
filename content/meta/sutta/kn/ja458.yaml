  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim `11c9d708978cde8ba61096d8a75f7ddfb846f639`, đường dẫn `kn/ja/ja458_root-pli-ms.json` (97/97 khoá, đúng thứ tự Pāli, không khoá thừa).

