  - Trùng nguyên văn trong chính bài: 5 nhóm Pāli trùng (`11.1`=`12.1`, `11.2`=`12.2`, `11.3`=`13.3`, `16.2`=`17.2`, và `18.4`=`19.4`=`20.4`=`21.4`); bản Việt giống nhau ở cả 5 nhóm, chỉ khác dấu ngoặc đóng ở `21.4` vì Pāli có `”`.
  - Dấu nháy: Pāli có 34 ký tự nháy (đều là nháy kép `“”`, 0 nháy đơn); bản Việt khớp Pāli từng khoá, 0 khoá lệch trên 97 khoá. Mỗi lời thoại mở `“` ở khoá đầu và đóng `”` ở khoá cuối của đoạn thoại như Pāli. Người nói đổi mà Pāli không ghi: `1`, `4`, `6`, `8`–`10`, `12`, `14`, `16`, `18`–`21` là lời của vị dạ-xoa (về sau tự xưng là Udaya); `2`–`3`, `5`, `7`, `11`, `13`, `15`, `17`, `22` là lời của công chúa. Tôi không ghi tên người nói vào bản dịch.
