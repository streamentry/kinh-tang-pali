  BẤT ĐỊNH (bài không có tầng Anh để đối chiếu):
  1. `1.1` `saññatūrū`: đọc là "đôi đùi cân đối" (saññata + ūru); nghĩa chính xác của `saññata` ở đây (cân đối, khép, hay được giữ gìn) không phân xử được từ tầng.
  2. `2.1` `Okiṇṇantaraparikhaṁ`: dịch "các hào ngăn dày đặc" (okiṇṇa = rải đầy, antara-parikha = hào bên trong/hào ngăn); hình dung đúng của thành này chưa chắc. `3.1`–`3.2` đọc là "ngay cả chàng trai trẻ cũng không có đường vào".
  3. `4.4` `Puṇṇakaṁsaṁ` → "một bát đồng đầy" (Pāli không nói đầy gì); `6.4` `rūpiyaṁ kaṁsapūraṁ` → "một bát đồng đầy bạc". Hai cách có thể là cùng một vật.
  4. `7.1`–`7.4` khó nhất bài: câu `Ukkaṁsatī yattha karoti chandaṁ` đọc là "tán dương nàng ở nơi anh ta đặt lòng ham muốn", và `Paccakkhato thokatarena esi` là "rõ ràng ngài đến chỉ với một món rất nhỏ" (so với "pháp của chư thiên"). Còn cách đọc khác về chủ ngữ của `ukkaṁsati` và nghĩa của `esi`; người rà soát nên phán.
  5. `8.3` `Teneva vaṇṇena` đọc là "cũng theo cách ấy" (vaṇṇa = cách/lý do, như `3.3` `kena vaṇṇena`); cách đọc "cùng với sắc đẹp ấy" cũng có thể.
  6. `18.4`, `19.4`, `20.4`, `21.4` `Udaye` được đọc là hô cách của Udayā (tức công chúa Udayabhaddā) — "này Udayā" — chứ không phải Udaya nam; chữ `Udayabhaddā` không xuất hiện trong bài này nên đây là suy từ ngữ cảnh người nghe.
  7. `22.6` `kāsiṁ surundhanaṁ` → "Kāsi, Surundhana": không phân xử được `surundhana` là tên thành (đồng vị với Kāsi) hay tính từ của Kāsi.
  8. `15.4` `subrahā` → "thân hình cao lớn", `16.2` `saṅgarattā` → "vì lời giao ước", `6.3` `sucimhite` → "nụ cười trong sạch/trong sáng": 0 tiền lệ trong tầng, dựng từ Pāli.

  Phép kiểm tra: tập khoá Việt = tập khoá Pāli (97/97, thứ tự trùng); nháy khớp Pāli từng khoá (34 ký tự, 0 lệch); NFC đạt; 0 khoá rỗng, 0 khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng (Jātaka, Udayā, Kāsi, Surundhana). Đã in cặp Pāli↔Việt ra đọc toàn bài (97 cặp).

  Technical gate: `technical_integrity` đặt 9.6 vì chưa chạy `npm run validate`, `npm test`, `npm run check` và `npm run build` (không được phép chạy ở lát này); không tuyên bố technical gate đã đạt. Coverage English: mẫu số = 0 (cổng không đo được gì); Sujato không có tệp cho bài này (0/97 khoá), và tầng `english-project`, `vietnamese-current` cũng vắng.

  Lượt cải thiện 2026-10-11 (đọc đối kháng lại 97 cặp Pāli↔Việt; đổi 14/97 khoá; tập khoá và thứ tự giữ nguyên; mục này thay thế các dòng cũ ở trên khi hai bên khác nhau):
  - Sửa nghĩa (accuracy fix): `7.2` "tán dương nàng ở nơi anh ta đặt lòng ham muốn" → "tăng thêm ở nơi anh ta đặt lòng ham muốn"; `7.4` "chỉ với một món rất nhỏ" → "với món ít hơn" (`thokatarena` là so sánh hơn, bản trước đọc thành "rất nhỏ"); `8.3` "của cải của nàng" → "của cải dành cho nàng" (`tuyhaṁ` chỉ người nhận). Căn cứ: toàn mạch lời đối thoại 4–8 là chuyện mặc cả (`4.4` một bát đầy → `6.4` bạc đầy bát → `7.4` món ít hơn → `8` giá hạ vì nàng già đi), và đối chiếu bản Anh PTS (Rouse–Cowell) của chính bài này chỉ để hiểu cách đọc, không chép câu chữ: người cầu hôn "nâng" giá ở chỗ mình ham muốn, còn lễ vật của vị dạ-xoa lại giảm vì sắc đẹp của nàng suy. Bản Anh này không phải tầng đã ghim nên không tính là tầng đối chiếu độc lập. Cách đọc `ukkaṁsati` (chỉ gặp một lần ở dạng này trong toàn Pāli; các dạng `ukkaṁseti` khác nghĩa "đề cao") vẫn là suy từ ngữ cảnh: GIỮ bất định, cách đọc cũ "tán dương" là phương án thay thế. Điểm: semantic_fidelity 8.8 → 8.9, grammar_logic 8.8 → 9.0.
  - Sửa theo tiền lệ đo bằng số đếm (terminology fix): `saṅgara` → "lời hứa" ở `16.2`, `16.4`, `17.2` (tầng: 13 khoá "lời hứa" ở ja537, ja513, cp32 so với 1 khoá "lời hẹn"; bản trước dùng "lời giao ước", 0 tiền lệ); `mahānubhāva` → "đại oai lực" ở `5.3`, `11.3`, `13.3` (22 khoá so với 1 khoá "đại thần lực" là ja522:3.3, ngoại lệ nằm ngoài lát; vì vậy `11.3` và `13.3` nay khác nguyên văn ja522:3.3 dù Pāli trùng, lý do là đa số 22/23); `bhaddante` ở `4.3` → "chúc nàng an lành" (trong các khoá có `bhaddante` ở kệ: khoảng 19 khoá "chúc … an lành" so với khoảng 20 khoá "thưa ngài" — hai cách ngang nhau; bản trước "hỡi nàng hiền hậu" không có tiền lệ nào, còn `bhaddante` = `bhaddaṁ te` theo sandhi, như `sn10.5:11.1` và ja538); `uḷāravaṇṇa` ở `15.3` → "dung sắc rạng rỡ" (ja470, ja535 cùng Pāli; bản trước "sắc tướng cao quý"); `aninditaṅgī` ở `1.2` → "thân thể không chỗ chê" (ja519:30.3). Điểm: terminology 9.0 → 9.2.
  - Dùng lại nguyên văn khi Pāli trùng: `14.1` (Pāli trùng `sn1.75:2.1` và `ne37:499.1`, cả hai là "Đặt thẳng lời nói và ý nghĩ,") và `3.3` (Pāli `Atha kena nu vaṇṇena` trùng ở 10 khoá khác: 7 khoá "Thế nhưng vì cớ sao", 2 khoá "Vậy/vậy …", 1 khoá khác; chọn đa số).
  - Dò lại Pāli trùng nguyên văn với bài khác: 16 khoá của ja458 có Pāli trùng ở nơi khác; sau lượt này bản Việt khác ở 4 khoá, đều có lý do: `11.3`, `13.3` (xem ở trên), `14.5` (chỉ khác chữ hoa đầu câu) và `16.3` (bản Việt hiện có ở ja395:6.3 "Hãy đi nào, món ăn của ta" lệch nghĩa so với Pāli, báo ngoài lát). Trùng trong chính bài vẫn 5 nhóm, giống nhau cả 5.
  - Tham chiếu mới cho bất định cũ: `2.1` có Pāli gần giống `ja534:53.3` (`Okiṇṇaparikhaṁ duggaṁ` → "có hào bao quanh, kiên cố"); phần `antara` vẫn chưa phân xử, giữ "các hào ngăn dày đặc". `4.4` và `6.4` khớp mô thức "đĩa/bát … đầy …" của an9.20:4.3 (`kaṁsapātisahassāni … hiraññapūrāni`), nên "bát đồng đầy bạc" ở `6.4` có tiền lệ về hình thức; `4.4` vẫn không nói đầy gì. `1.1` `saññatūrū` còn một nơi khác (ja523:15.3, bản Việt "đùi thon khít"); hai chỗ chưa thống nhất vì nghĩa của `saññata` ở đây chưa phân xử được, giữ "đôi đùi cân đối". `22.6` `surundhana`: bản Anh PTS coi là tên thành của Kāsi nhưng hình thức tên khác nhau giữa văn xuôi và kệ, nên giữ "Kāsi, Surundhana" không thêm phân loại. `18.4`–`21.4` `Udaye` giữ cách đọc hô cách nữ (Udayā), không đổi.
  - Không đổi dù nghi ngờ: `6.2` `visamaṁ caranti` "hành xử sai trái" (tầng chia đều: "bất chính" 2, "tà vạy" 5 khoá cùng một công thức lặp, "sai trái" 1, "bất công" 1; không có đa số rõ); `14.3` giữ "có nhiều đồ ăn thức uống" dù `sn1.75:2.3` dịch "đầy đủ" (Pāli khác chữ `bahunna-`/`bahva-`); `13.2` "dù con đường đã được giảng dạy với nhiều phương tiện" giữ theo `sn1.75:1.2`.
  - Ngoài lát, chỉ báo: `ja279:3.2` "bhayā ukkaṁsayanti vā" bản Việt "hoặc vì sợ hãi mà chê bai" có vẻ ngược nghĩa (`ukkaṁseti` là đề cao); `ja522:3.3` "đại thần lực" lệch đa số "đại oai lực" (22 khoá).
  - Điểm: triangulation 7.0 → 7.5 vì đã đối chiếu thêm một bản Anh bên ngoài tầng đã ghim cho các khoá 7–8, 22 và đối chiếu thêm Pāli song song trong kho; vẫn ≤ 8.0 vì không có bản Anh độc lập đã ghim. Các điểm khác giữ nguyên. final_score 8.99 → 9.09 (trung bình số học thô của 10 điểm). Bất định còn lại (mục BẤT ĐỊNH 1–8 ở trên, trừ phần đã nêu ở lượt này) và blocker `noEnglishEditionUpstream` giữ nguyên; `technical_integrity` giữ 9.6 vì vẫn chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` ở lượt này.
