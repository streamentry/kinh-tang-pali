notes: |-
  **Tiền lệ:** `Petavatthu` giữ nguyên Pāli **18/18**; `Cūḷavagga` giữ nguyên Pāli
  **3/3** (pv28, pv29, pv34) — không dịch tên phẩm. `:0.3` theo khuôn đã có *N. Chuyện Ngạ
  Quỷ X* (pv28 *3. Chuyện Ngạ Quỷ Người Kéo Xe*, pv29 *4. Chuyện Ngạ Quỷ Trấu Thóc*).
  `Migaluddaka` (kẻ giết/bắn hươu) tôi dịch *Bắn Hươu*; tầng `name/` của SuttaCentral
  đặt `pv32` là *The Deer-Hunter (1st)*, còn **0 tiền lệ** trong tầng Việt cho tên này.

  **Một khoá trùng nguyên văn:** `Tassāhaṁ vacanaṁ sutvā,` → *Nghe lời ấy của người ấy,*
  (dùng lại từ pv44, pv43 và 4 bài thig). `:11.1` theo khuôn *Chuyện Ngạ Quỷ …, thứ N*
  (pv29:7.1).

  **Căn tiếp Việt của đoạn 1–4 không tròn.** Pāli ở đây là văn xuôi kệ rất cô đọng: `Nāga`,
  người đàn bà, người đàn ông tên Bắn Hươu và `sukham`, `anomā`, `sumanā` xuất hiện ở các
  khoá trước đó của bài mà lát này không có (`:0.x` chỉ tới `0.3`). Vì vậy tôi dịch từng
  khoá một theo nghĩa chữ, giữ đúng chủ thể và phủ định, và **không** bịa thêm quan hệ
  nhân quả hay danh tính cho ai; những chỗ đó thuộc về `notes` của người đọc, không thuộc
  lời kinh. Đây là lý do `semantic_fidelity` ở 9.1.

  **Vài thuật ngữ:** `khaṇati`/`khāditu` → *ăn*; `duggati` → *đọa xứ* (theo tiền lệ
  tha-ap100/117/119, 20+ chỗ); `kappana`/`puñña` → *công đức*; `sugata` → *bậc Thiện Thế*;
  `padaṁ asaṅkhatan` → *vững chân đạt tới phía bên kia bất tử* (tôi đặt mới, 0 tiền lệ).

  **Không có tầng Anh.** 0/44; tầng `english-sujato` đã ghim **không có thư mục `pv`**
  (chỉ có `pv-name`).
