notes: |-
  LÁT NÀY KHÔNG CÓ TẦNG THAM KHẢO NÀO, ĐÃ ĐẾM KHÔNG SUY. Với mười ba bài Jātaka này:
  source/upstream-manifest.json tại commit đã ghim 11c9d708978cde8ba61096d8a75f7ddfb846f639 ghi tầng translation/en/sujato có 4.291
  tệp, trong đó thư mục sutta/kn/ja/ chỉ có 83 tệp, không có tệp nào chứa khoá của bài này; hàm
  upstreamPublishes của kho trả false cho cả mười ba, tức SuttaCentral không phát hành bản Anh nào
  phủ chúng. Tầng translation/vi/phantuananh tại cùng commit chỉ có đúng 26 tệp và toàn bộ là Pháp Cú
  (dhp1-20 … dhp383-423), nên KHÔNG có bản Hòa thượng Thích Minh Châu cho bất kỳ bài Jātaka nào ở đây —
  đây là đặc điểm của bản chụp upstream đã ghi ở chính source/layers.yaml, không phải thiếu sót của
  kho, và cũng không phải lý do để tôi né việc chấm điểm. Bài chỉ đối chiếu được với Pāli root một
  mình, nên triangulation chấm thấp và bài đặt draft.

  COVERAGE KHÔNG PHẢI LÝ DO BLOCK, VÀ TÔI ĐÃ TÍNH LẠI CHO ĐÚNG. Trong mười ba bài này mọi vế kệ
  Jātaka đều ngắn hơn ngưỡng 40 ký tự khai ở source/layers.yaml, và mọi khoá tiêu đề nằm trong khối
  tham chiếu, nên substantiveSegments = 0. Hàm englishCoverageFor trả ratio = 1 khi
  substantiveSegments = 0, và cả validate lẫn tests/unit/translation-store.test.ts đều bỏ qua bài có
  substantiveSegments = 0. Tôi đã chạy hàm đó cho cả mười ba: đều ratio 1.000. Vì vậy tôi KHÔNG ghi
  blocker coverage dưới ngưỡng — ghi thì sẽ là một lỗi đo sai. Blocker thật, duy nhất, là mất hẳn
  tầng tham khảo English.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt mặc định chỉ quét khoá Pāli từ 40
  ký tự trở lên; ở Jātaka mọi vế kệ đều ngắn hơn ngưỡng đó nên phần chốt đó về bản chất KHÔNG chạy.
  Tôi tự quét lại toàn bộ 238 khoá của lát bằng script riêng, đọc thẳng từ tệp đã ghi trên đĩa:
  đủ khoá và không thừa so với Pāli gốc, không rỗng, chuỗi NFC, số dấu lược khớp TỪNG KHOÁ (Pāli có
  …pe… thì Việt đúng một …, Pāli không có thì Việt không có), không có (…) đứng một mình, vị trí
  ngoặc kép mở và đóng khớp PĀLI TỪNG KHOÁ (không chỉ tổng số trên cả bài), ngoặc kép cân trên
  cả bài, không chữ phiên tự, không còn sót thẻ chữ Pāli. Kết quả 0 lỗi trên 238 khoá / 14 bài.

  TÊN PHẨM, ĐÃ ĐO THEO BẢNG CHỐT VÀ THEO TẦNG. Tikanipāta → Bộ Ba Bài Kinh: đếm trên toàn tầng
  Việt TRƯỚC khi lát này ghi, đã có 24 tệp Jātaka và 15 tệp thag3/thig3 dùng đúng cách này, và KHÔNG
  tệp Jātaka nào dùng cách khác; cách Phẩm Ba Pháp chỉ do 50 tệp iti50..iti99 dùng mà tôi không đụng
  tới. Sau khi lát này ghi, con số Jātaka là 37/37. Tôi theo đa số TRONG CHÍNH TÁC PHẨM ĐANG LÀM theo
  BRIEF_VI3 §11, và cũng vì nó khớp song song với hai mục đã chốt là Bộ Một Bài Kinh và Bộ Hai Bài
  Kinh. Người điều phối gộp có thể muốn thống nhất cả tầng iti sau này, nhưng đó không thuộc lát này.
  Saṅkappavagga → Phẩm Suy Nghĩ (trước lát này 7 tệp, không lệch; sau đó 8); Padumavagga → Phẩm Bông
  Sen (trước 1 tệp, không lệch; sau đó 9, và cả chín tệp trong phẩm đều giống nhau); Udapānavagga →
  Phẩm Nước Uống (trước 4 tệp, không lệch; sau đó 8). Dấu uddāna: trước lát này đã đếm 22 tệp có
  dạng Kinh <tên>, thứ <từ>. và 3 tệp không có dấu phẩy; tôi dùng dạng có dấu phẩy, và đã kiểm
  bằng script rằng số thứ tự trong uddāna khớp số đứng trước mặt trong 0.4 của cùng phẩm, không suy
  từ tên uid.

  PĀLI TRÙNG NGUYÊN VĂN, ĐÃ DỰNG CHỈ MỤC BẰNG SCRIPT VÀ ĐÃ DÙNG LẠI. Tôi nạp 5.764 tệp Pāli
  gốc trong cache (bỏ mọi thư mục *.apfs-orphan) và 4.038 tệp Việt dự án, ghép theo khoá, rồi so
  TRÙNG NGUYÊN VĂN có chuẩn hoá hoa thường, khoảng trắng và dấu câu biên. Riêng lát này: 102 khoá
  trùng ở nơi khác; 52 khoá trùng đó đã có bản Việt ở bài khác, và tôi DÙNG LẠI NGUYÊN VĂN 51 khoá
  (39 khoá tiêu đề, 12 khoá thân kệ). Một khoá trong 52 là ngoại lệ có chủ ý: ja264:3.1 trùng nguyên
  văn với sn1.50:11.1, nhưng bản Việt đã có mở ngoặc kép ở đầu khoá trong khi Pāli khoá này không mở,
  nên tôi chép phần chữ và bỏ ngoặc kép thay vì chép y nguyên. Ngoài ra có 8 cả ván bốn vế trùng nguyên
  văn ở bài khác, và cả tám đều chưa có bản Việt để mượn. Trong lát này có 3 khoá trùng
  nguyên văn, đều là ba vế mở đầu lặp lại trong ja265; tôi đã dùng lại đúng một cách dịch cho cả
  hai lần, và script tự kiểm bắt được chỗ lệch nếu có.

  TÊN RIÊNG CÓ DẤU PĀLI, CỐ Ý GIỮ, KHÔNG BỎ DẤU. Jātaka, Tikanipāta, Sakka, Panāda, Missībhāvitthi,
  kāḷi, Jātavedas, Gāṅgā, Yamunā, Kassapa — tất cả giữ đúng dấu Pāli như tầng đang làm; tôi không
  bỏ dấu ở bất kỳ tên nào, kể cả tên không có bản Việt nào để đối chiếu.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  STATUS. Có một blocking error thật (thiếu hẳn tầng tham khảo English Sujato tại commit đã ghim), nên
  bài đặt draft bất kể final_score. Tôi không nâng điểm để né blocker, và cũng không hạ điểm để tỏ ra
  thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có
  tầng tham khảo nào.

  TÊN BÀI ĐÃ CÓ TIỀN LỆ CHÍNH XÁC. Ārāmadūsakajātaka xuất hiện ở ja46, đã có bản Việt trong tầng
  với tên Kinh Kẻ Phá Hoại Khu Vườn ở cả khoá 0.4 và khoá uddāna; tôi dùng lại nguyên văn đó cho cả
  hai khoá của bài này, vì cùng một tên Pāli thì phải cùng một tên Việt.

  CHỖ CHƯA CHẮC. (1) 1.1 Yo ve sabbasametānaṁ: tôi dịch là Trong tất cả những bên ngang hàng ấy,
  họ — đặt chủ từ họ xuống cuối vế để câu 1.2 đọc liền; ve là vậy thì, mà tôi lược. (2) 1.4 kimeva
  itarā pajā: tôi dịch là còn các loài sinh khác thì ra gì; pajā là các kiếp sinh, không phải loài
  vật, nên cũng có thể dịch là còn các kiếp sinh khác thì ra gì. (3) 3.3 Vissasenova gārayho:
  gārayha là bị gọi với, bị xua đuổi; tôi dịch là bị dồn đuổi với tiếng kêu kinh hoàng, và ghi vì
  na ở đây là như, nên có thể chỉ là sẽ bị xua như bị dồn. (4) 3.4 yassatthā rukkharopakā:
  rukkharopaka là kẻ phá cây, tôi dịch là lũ phá cây; câu hỏi của ai thì Pāli không nói rõ, tôi giữ
  văn phong bị động.

  Lượt cải thiện 2026-10-13 (đọc đối kháng từng khoá; 11/17 khoá đổi: 1.1–1.4, 2.1, 2.3, 2.4, 3.1–3.4; sáu khoá giữ nguyên là 0.1–0.4, 2.2, 4.1). Lượt này THAY các cách đọc ở mục "CHỖ CHƯA CHẮC" phía trên ở ba điểm (1), (2), (3); phần còn lại của mục đó vẫn đúng.
  Accuracy fix. 2.3–2.4: Pāli là câu hỏi (kathaṁ … jaññā, "làm sao biết"), bản cũ viết thành khẳng định "ngươi sẽ biết cây đang đứng đó" — đảo ý; nay "Chưa thấy rễ, làm sao / biết được cây đã đứng vững?". mūlaṁ đổi "gốc cây" → "rễ" vì lập luận là phải thấy phần rễ mới biết cây đứng vững. 3.1–3.2: ye caññe là ye ca aññe, tức "và", bản cũ dịch "nhưng"; tumhe là số nhiều nên đổi "ngươi" → "các ngươi"; nay "Ta không chê bai các ngươi, / và cả những con khỉ khác trong rừng". 3.3–3.4: gārayha là "đáng chê trách" (phân tích của garahati) — đo trên toàn tầng được 209 khoá ở 42 bài dùng gārayha/gārayho/gārayhaṁ ṭhānaṁ (dn29, mn3, mn60, mn101, mn117, và Jātaka ja393, ja520, ja542, ja547…) và cả 209 đều dịch theo nghĩa chê trách / chỉ trích / phê bình / phê phán, không nơi nào là "bị dồn đuổi". Bản cũ "bị dồn đuổi với tiếng kêu kinh hoàng" không có căn cứ trong Pāli (có vẻ lẫn với vissara "tiếng kêu" của mn66, vốn là một từ khác với vissasena) và thêm chủ thể "chúng" mà Pāli không có; nay "chỉ vì lòng tin mà đáng chê trách là người / vì y mà có những người trồng cây", đọc vissasena là cách hiếm của vissāsena (công cụ cách, "bằng lòng tin"). 1.1–1.2: bản cũ có "họ coi người ấy" — chủ ngữ "họ" không có trong Pāli (seṭṭhasammato là quá khứ phân từ bị động, "được xem là"); sametānaṁ là thuộc cách số nhiều của sameta "đã tụ họp", không phải sama "ngang hàng". Nay "Giữa tất cả những ai đã tụ họp, người nào / đã được xem là bậc tối thượng". Đối chiếu sabbasamāgata → "tề tựu" ở ja488:10.1.
  Terminology fix. 1.4: kimeva itarā pajā — tầng đã dịch kimeva "huống chi" (ja450:1.3, ja546:175.3) và cặp pageva itarā pajā là "huống chi quần chúng còn lại" ở 6/6 khoá (an4.70, ja527, ja528); nay "huống chi quần chúng còn lại?". Bản cũ "các loài sinh khác thì ra gì" lệch tiền lệ, và chính lượt trước đã ghi nó là chỗ chưa chắc. 2.1: tuvaṁ brahme có tiền lệ "hỡi Bà-la-môn" ở ja547:288.3 (cùng một dòng Pāli) và nhiều khoá Jātaka khác; thêm "hỡi". Clarity fix. 1.3: "thế ấy" gượng → "là như thế này" (edisī).
  Điểm đổi: semantic_fidelity 8.8 → 8.9 (một nghĩa sai ở 3.3 và một câu hỏi bị đảo ở 2.4 đã sửa; chưa lên cao vì quan hệ vì-y-mà-có-những-người-trồng-cây ở 3.4 vẫn chưa phân xử được). grammar_logic 8.8 → 9.0 (khôi phục câu hỏi kathaṁ, liên từ ca, số nhiều tumhe, bỏ chủ ngữ thừa). terminology 8.8 → 9.0 (kimeva, itarā pajā, gārayha, brahme theo đa số đã đo). triangulation 6.9 → 7.1 (vẫn không có tầng Anh nào; chỉ tăng nhẹ vì đã đối chiếu thêm các khoá Pāli song song trong chính kho cho bốn cụm từ trên). vietnamese_clarity 9.1 → 9.0 (3.4 dịch sát nên hơi tỉnh lược). Giữ nguyên: source_provenance, segment_alignment, han_viet_balance 9.1, technical_integrity 9.6, ambiguity_integrity 8.6.
  Bất định CÒN LẠI, không phân xử được vì snapshot đã ghim không có tầng Anh, không có bản Việt tham khảo và không có phần văn xuôi Jātaka: (a) người nói từng bài kệ và nhân vật được xưng brahme (Bà-la-môn hay Phạm thiên; đã dịch theo đa số "Bà-la-môn", không đổi); (b) 3.3: vissasena đọc là "bằng lòng tin" (vissāsena) — chưa có khoá song song nào để kiểm; (c) 3.4: yassatthā rukkharopakā đọc là "vì y mà có những người trồng cây", chưa rõ y là ai và atthā là "vì lợi ích" hay cách khác; (d) tumhe là số nhiều thật hay là cách xưng tôn kính cho một người — đã giữ nghĩa số nhiều theo hình thái. Không thêm gì vào thân kinh cho những chỗ này. Không đổi status, blocker, waiver. Bốn lệnh npm run validate, npm test, npm run check, npm run build chưa được chạy trong lượt này.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 3 khoá chênh lệch lớn nhất trên 17 khoá → khác nghĩa 1: sửa 0, giữ 0, bất định 1 (`3.3`–`3.4` `Vissasenova gārayho, yassatthā rukkharopakā`: bản mù cũng ghi không chắc; chưa phân xử được người đáng chê trách là ai). Hai khoá còn lại (`1.4` `kimeva itarā pajā`, `2.2` `anaññāya vinindasi`) chỉ khác diễn đạt, giữ. Review đối kháng toàn bài: nháy khớp Pāli từng khoá (0/17 lệch), không có dấu lược, không có số, `tumhe` số nhiều và `brahme` vẫn nhất quán với bản cũ. Không có bản Anh hay bản Việt độc lập khác.
