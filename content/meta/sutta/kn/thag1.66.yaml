notes: |-
  **UID-gộp: không phải.** `thag1.66` là bài từng bài, tiền tố khoá thật là `thag1.66:`; tôi đã đọc `path` và đếm — 11 khoá trong tệp Pāli gốc, 11 khoá trong `all`, `thừa` bằng 0. (Ba uid-gộp thật của lát này là `sn46.66`, `sn55.61`, `an6.143-169`, và cả ba cũng dùng chính uid-gộp làm tiền tố; xem `notes` của chúng.)

  **Vì sao phải tự kiểm, và đã tự kiểm cái gì.** `kiểm()` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài từ 40 ký tự trở lên. Mọi vế kệ bài này ngắn hơn, nên **`cần` RỖNG và không assertion nào của chốt tự chạy** — kể cả cân ngoặc kép, NFC, trùng nguyên văn và dấu lược. Tôi tự quét lại **MỌI** khoá của **MỌI** bài trong lát (136 khoá, `_tvd7_2_chk.py`): đúng tập khoá `all`, mọi chuỗi NFC, **số dấu lược khớp Pāli từng khoá**, ngoặc kép cân trên cả bài, không Pāli lọt, không còn `(…)`, không trùng nguyên văn Pāli, và `kiểm()` chạy lại từ tệp trên đĩa đều pass. `save_vi` chạy hai lần cho cả lát: không đổi byte nào (idempotent).

  **Dấu lược, theo BRIEF_VI3 §10.1 — không mở rộng.** `1.7` Pāli là `… Meghiyo thero ….`, **hai** dấu lược; bản Việt giữ đúng hai. Tôi **không** biến dòng kết thành *Bạch Thế Tôn, … đã từng nói bài kệ này* như nhóm `thig1.10`–`1.16` đang làm, vì mở rộng là thêm chữ KHÔNG ĐÁNH DẤU và đã có tiền lệ sai thật. Nhóm `… X thero ….` đã có sẵn trên đĩa (`thag1.111`, `thag1.116`) và tôi theo đúng nhóm đó.

  **Pāli trùng nghiên văn, dùng lại nguyên văn cũ (luật của kho).** `Tisso vijjā anuppattā,` · `kataṁ buddhassa sāsanan”ti.` · `… Meghiyo thero ….` trùng y hệt `thag1.107:1.3`, `:1.4`, `:1.5` (bản `published`) → *Tôi đã chứng ngộ tam-minh,* · *đã làm tròn lời dạy của Đức Phật”ti.* · *… Trưởng lão Meghiya ….* Ba vế đó **không** phải lựa chọn của tôi.

  **Tiền lệ thuật ngữ, đếm được.** `Ekakanipāta` → *Bộ Một Bài Kinh* (160 chỗ; chỉ `thag1.1:0.2` viết *Tập Một*; nhóm *Phẩm Một Pháp* của 27 bài `iti` là dịch theo hậu tố `-nipāta`, không dùng ở đây). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>* (66 chỗ, so với 4 chỗ *Bài Kệ…*). `Sattamavagga` → *Phẩm Thứ Bảy* — chỉ **1**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: tiền lệ ở tầng Việt dự án (`an1.258:0.2`, đếm trước khi tôi ghi dòng này) (`an1.258:0.2`), nhưng cùng dạng với *Phẩm Thứ Mười* (20 chỗ, `thag1.96`, `thag1.97`) và *Phẩm Thứ Mười Một*; đặt mới theo đúng cấu trúc đó, ghi ra đây vì tiền lệ riêng là mỏng. `mahāvīro` → *đại dũng sĩ* (7 chỗ, `snp3.7:27.3` dịch `Sallakatto mahāvīro` là *bậc y sĩ, đại dũng sĩ*). `sabbadhammāna pāragū` → *đã vượt qua mọi pháp* (5 chỗ, `snp5.1:17.2`; `an4.22:7.1` dùng *Vượt qua tất cả các pháp* — cùng nghĩa, khác nhịp). `sato` → *giữ chánh niệm* (8 chỗ, `sn1.40:4.3`, `sn9.1:3.1`). `Tisso vijjā` → *tam-minh* (34 chỗ) chứ không phải *ba tri thức* (0 chỗ), đúng như `thag1.107` đã ghi.

  **Không có bản Việt tham khảo để đối chiếu.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa 26 tệp Pháp Cú, nên Theragāthā không có bản Hòa thượng Thích Minh Châu. Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato.

  **Tầng Anh đủ cho mọi vế kệ, trống đúng dòng kết.** 10/11 khoá có tiếng Anh Sujato; khoá trống là `1.7` (dòng lược *… X thero ….*) — cùng dạng lược mà `thag1.107` (đã `published`) cũng thiếu, nên không chặn `published`.

  **Bất định.** `Anusāsi mahāvīro,` tôi đọc là Đại vương Tướng **khuyên dạy tôi**: `Anusāsi` là quá khứ của `anusāsi` (chỉ dạy) và `mahāvīro` là chủ ngữ, còn `tôi` là tân ngữ (đối tượng được dạy). Cách đọc cạnh tranh: `mahāvīro` là tán từ gọi thẳng người nói — Meghiya — tức *bậc đại anh hùng khuyên dạy tôi*; hai cách cho cùng một câu tiếng Việt, nên câu dịch không đổi được gì. Không ghi vào `notes` của kinh.

  **`technical_integrity` 9,6 chứ không phải 10,0** vì đợt này cấm `npm run validate|test|build` (người điều phối chạy tập trung), và vì `kiểm()` rỗng với bài này nên phần lớn cổng kỹ thuật phải do tôi tự dựng — tôi ghi rõ script và kết quả ở trên thay vì coi là đã qua cổng.
