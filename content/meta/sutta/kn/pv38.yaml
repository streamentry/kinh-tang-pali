  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 10 khoá bất đồng nghĩa → sửa 1, giữ 5, bất định 4. Sửa: 16.2 `atho te adurāgataṁ` "và việc ngài đến chẳng có gì khó nhọc" → "và việc ngài đến không có gì chẳng lành" (`adurāgata` là phủ định của `durāgata`, "đến không hay, không lành"; bản nguyên bài "không phải là việc đi đến sai trái"; thig13.4:26.2 dịch `adurāgata` theo hướng đó; "khó nhọc" là nghĩa khác; cùng lỗi ở ja503:12.4, ja532:43.2, ja538:83.2, ja542:52.2, ja547:235.2, ngoài lát). Giữ: 1.3 `upaṭṭhānaṁ gantvā` ("hầu cận" so với bản nguyên bài "trợ giúp"); 39.1, 39.2 `vassāni satasahassāni, ghoso suyyati tāvade` (bản nguyên bài hiểu là cứ mỗi một trăm ngàn năm nghe một tiếng vang; bản dự án giữ nghĩa "suốt chừng ấy" theo `tāvade`); 44.2 `suṇhā parakulesu` ("con dâu ở nhà người khác"; bản nguyên bài "nhu mì ở các gia đình những người khác", đọc theo `saṇhā`); 57.4 `pāmokkho` (bản nguyên bài "mặt nhìn hướng đông" theo dị bản; Pāli ghim là `pāmokkho`). Bất định: 26.2 `na visodheti verinaṁ` (bản nguyên bài "không thể xóa sạch sự thù hằn", bản dự án "không làm thanh tịnh những kẻ mang oán thù"; `verī` hay `vera` chưa phân xử); 34.3 `jino` (bản nguyên bài viết hoa "đấng Chiến Thắng"; bản dự án viết thường vì đang trong cụm quan điểm sai; chưa xác định danh tính); 14.6, 47.2 `pūve vitte` ("bánh ngon" so với bản nguyên bài "các loại bánh ngọt đa dạng"). Bản nguyên bài làm rõ hai điểm số mà ghi chú cũ nêu bất định: 29.3 `yojanānaṁ sataṁ pañca` cũng là năm trăm do-tuần (không ủng hộ cách đọc 105); 39.3–39.4 một lakkha là 100.000 năm và một koṭi năm là 100 lakkha (khớp cách đọc đã ghi). Các số khác đã tính lại và khớp: 84 × 100.000 = 8.400.000 đại kiếp (33.1–33.2), sáu tháng (36.1), một trăm do-tuần (38.3), một trăm ngàn koṭi (40.1), bốn góc bốn cửa. Review đối kháng cùng lượt: không tìm thấy lỗi nào khác cần sửa. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

