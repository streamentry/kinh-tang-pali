notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pv/pv38_root-pli-ms.json` (240/240 khoá, đủ và đúng thứ tự Pāli). Tên bài lấy từ nhãn Pāli `Nandakapetavatthu` (Chuyện Ngạ Quỷ Nandaka). Bài thuộc Đại Phẩm (Mahāvagga), bài thứ ba. Tên Nandaka không xuất hiện trong thân bài, chỉ có ở nhãn; thân bài không nêu tên người nói nào ngoài vua Piṅgalaka (1.1) và Uttarā (42.4).

  Không có bản Pāli song song nguyên bài trong toàn Pāli root (dò cụm `Rājā piṅgalako`, `Acchejjābhejjo`, `Cullāsīti mahākappino`: chỉ có ở pv38; `piṅgalako` ở mn30 là tên người khác). Các đoạn kệ địa ngục (37–38, 41) trùng nguyên văn với pv10 và pv19; các đoạn quy y (54–55) trùng vv63, vv83, pv17; đoạn giáo thuyết (24, 30–34) song song với dn2 (Makkhali Gosāla, Pakudha Kaccāyana).

  - Tầng tham khảo và coverage English:
    Tầng `english-sujato` không có pv38 (không có tệp nào của sub-collection `pv`); `english-project` chưa có cho uid này; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage = 0: Pāli có 240 khoá, khoá dài nhất chỉ 32 ký tự, không khoá nào đạt ngưỡng 40 ký tự, nên cổng coverage không đo được gì và KHÔNG được trích ra làm bằng chứng đã có tầng tham khảo. Thứ chặn bài là việc ba tầng tham khảo đều vắng. Không có bản English độc lập nào được đối chiếu; nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài, dn2 và tiền lệ cùng bộ (pv10, pv19, pv17, vv63, vv83), nên `triangulation` đặt 7.0.
  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” và `0.2` “Đại Phẩm” theo pv37, pv39–pv51 (cùng phẩm). `0.3` theo khuôn “N. Chuyện Ngạ Quỷ …”; `58.1` theo khuôn “Chuyện ngạ quỷ …, thứ N.” của pv37, pv39, pv43 (`tatiyaṁ` = thứ ba, khớp số `3.` ở `0.3`).
  - Cấu trúc người nói (Pāli không nêu tên; không thêm vào thân kinh):
    + Kệ 1–2 người kể; kệ 3–4 vua nói với người đánh xe (ngoặc mở ở `4.1`); kệ 5 người kể, kệ 6–7 một người đàn ông hoảng sợ nói với vua; kệ 8 người kể, kệ 8.3–9 vua nhắc lại cho người đánh xe; kệ 10 người kể; kệ 11 vua hỏi, kệ 12 người đánh xe đáp; kệ 13–14 người kể; kệ 15 người kể; kệ 16 vị có dáng chư thiên (ngạ quỷ) mời vua; kệ 17 người kể; kệ 18 vua; kệ 19 ngạ quỷ; kệ 20 vua; kệ 21–52 ngạ quỷ kể (ngoặc mở ở `21.1`, đóng ở `52.4`), trong đó `46.3–46.4` và `47.3–47.4` là hai cặp nháy đơn lồng trong lời ngạ quỷ (lời nói của Uttarā ở 47); kệ 53–56 vua (mở ở `53.1`, đóng ở `56.4`); kệ 57–58 người kể và nhãn kết. Số ngoặc kép bản dịch khớp Pāli từng khoá (11 cặp kép, 2 cặp đơn; 0 khoá lệch trên 240).
    + Đại từ: vua gọi ngạ quỷ “ngài” khi chưa biết (18) rồi “ngươi” (20), sau khi nghe giáo pháp lại “ngài”, tự xưng “tôi” (53–56, khớp pv17, vv83); ngạ quỷ xưng “tôi”, gọi vua “tâu đại vương” (cả `mahārāja` lẫn `deva`, tầng: `deva` vocative → “tâu đại vương” 24 khoá, “bệ hạ” 1 khoá).
    + `soraṭṭho` (tính từ phái sinh của Suraṭṭha, chỉ chính vua Piṅgalaka) dịch “vua xứ Suraṭṭha” để người đọc thấy cùng một nơi với `suraṭṭha` ở các khoá 1, 4, 19, 20, 22.
  - Số Pāli — tự tính:
    + `cullāsīti` (33.1) = catu 4 + asīti 80 = 84; `satasahassāni` (33.2) = 100 × 1000 = 100.000; nên 84 × 100.000 = 8.400.000 đại kiếp. Bản dịch viết “Tám mươi bốn đại kiếp, tính theo trăm ngàn” vì số bị tách qua hai khoá Pāli; dn2:20.7 dịch cùng cụm Pāli này là “tám triệu bốn trăm ngàn đại kiếp” (khớp 8.400.000).
    + `yojanasataṁ` (38.3) = 100 do-tuần (trùng pv10, pv19, mn129, mn130: “một trăm do-tuần”). `chahi māsehi` (36.1) = 6 tháng; `oraṁ` → “chưa đầy” (vv63:10.2 `oraṁ māsehi pañcahi` = “chưa đầy năm tháng”). `catu` (4): `catukkaṇṇaṁ catudvāraṁ` = 4 góc, 4 cửa; `cattāro … cattāro` (51.1–51.2) = 4 + 4 bậc; `aṭṭhaṁso` (29.2) = 8 góc; `sattannaṁ` (28.4) = 7; `chahi` 6; `tatiyaṁ` (58.1) = thứ ba; `dve`/`ekassa` không xuất hiện.
    + `Yojanānaṁ sataṁ pañca` (29.3): đọc “năm trăm do-tuần” (5 × 100, `sataṁ` đặt trước `pañca` theo vần kệ). Chưa phân xử được hoàn toàn: đọc “một trăm lẻ năm” (105) cũng khả dĩ về ngữ pháp; toàn Pāli root chỉ có thêm một chỗ `sataṁ pañca ca uttarīti` (thag17.3:38.4) và đó là cộng thêm rõ ràng (có `ca uttari`), còn ở đây không có `ca`. Bản dịch chọn 500, ghi bất định này; không thêm vào thân kinh.
    + `Lakkho eso … satabhāgavassakoṭiyo` (39.3–39.4) và `Koṭisatasahassāni` (40.1): `lakkha` = 100.000, `koṭi` = 10.000.000 (tầng cnd14: “trăm ngàn koṭi”; bv13: “tám mươi koṭi”). Cách hiểu có thể là: một lakkha (100.000 năm) nhân một trăm = một koṭi năm; chưa phân xử được. Bản dịch chỉ dịch sát chữ, giữ nguyên `lakkha` và `koṭi`, không tự quy ra số.
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch):
    + Pāli trùng nguyên văn với bài khác: đã dò, có 67 khoá của pv38 có Pāli trùng ở nơi khác trong tầng (không kể phép ghép lẫn nội bộ), tạo 287 cặp Pāli↔Việt; 164 cặp trùng khít nguyên văn, 123 cặp khác. Các cặp khác phần lớn chỉ khác dấu câu, ngôi hoặc chữ hoa (ví dụ pv19:7.2 “keo kiệt, hay mắng nhiếc;” ↔ `22.4`), hoặc khác vì ngữ cảnh ở bài đối chiếu là văn xuôi (mn129, mn130, an3.36). Đã dùng lại nguyên văn: pv10 và pv19 cho `37.1–37.4`, `38.1–38.4`, `41.1–41.4`, `36.3–36.4`; pv19:7.3 cho `23.1`, pv19:8.1–8.2 cho `24.1–24.2`; vv83/pv17 cho `18.1`, `18.4`, `52.4`, `53.1–53.4`, `54.1–54.4`, `55.1–55.4`; vv34 cho `51.1–51.2`; ja503/ja494 cho `16.1`, và vv63:4.2 cho `16.2`.
    + `18.2`, `19.2` `Purindada`: ba khoá song song (pv17:11.2, vv62:2.2, vv83:11.2) và hai khoá khác (tha-ap487:4.4, vv62:3.2) dịch “Sakka Đấng Phá Thành”, nhưng sn11.12 và sn11.13 giải thích rõ `purindada` là “vì thuở xưa đã bố thí trước nhất” (không phải phá thành), và dn20, mn56, bv17, ja522 dịch “Purindada”. Bản này giữ “Sakka Purindada” (5 khoá đồng thuận với sn11.12, so với 5 khoá “Đấng Phá Thành” ở các bài khác); các khoá kia nằm ngoài lát này, không sửa.
    + `jīva` → “linh hồn” (nom. `jīvo`: 20/22 khoá trong tầng dịch “linh hồn”; dn2:26.5 dịch “mạng sống” cho `jīve` là một trong bảy thân của Pakudha, ở đây là thực thể có hình dạng và đi vào thân khác nên chọn “linh hồn”); `bondi` → “thân xác” (ja150 “thân xác”; ja148 `hatthibondiṁ` “thân voi”).
    + `Yama` giữ “Yama” (tầng: 68 khoá “Yama”, 6 khoá “Diêm…”); `yamapurisāna` → “những người của Yama” (dhp235 dịch “người của Diêm vương”, pv39 “sứ giả của Yama”).
    + `pāyāsi` → “đi”; `caturaṅginī` → “bốn binh chủng” (dn5, dn17); `sārathi` → “người đánh xe” (154 khoá); `ramaṇīya` → “đẹp đẽ” (tầng: “đáng yêu” 7, “khả ái” 3, “đẹp đẽ” 2; chọn “đẹp đẽ” cho đường và cây); `nigrodha` giữ “cây nigrodha” (161 khoá giữ nguyên, 31 khoá “cây đa”); `amacca` → “đại thần” (34); `pārisajja` → “cận thần” (dn5 dịch “thành viên hội đồng”, dn30 “hội chúng”; ở đây là nhóm đi theo vua nên chọn “cận thần”); `purohita` → “tế sư” (dn5).
    + `vadaññū vītamaccharā` → “hào phóng, hết keo kiệt” (an4.53, an4.54, an8.49, vv34:15.4); `sirīmat` → “đầy uy quang” (dn32, thag1.94); `sakyamuni` → “bậc Mâu-ni dòng Sakya” (bv27:9.3); `sambuddha` → “Chánh Đẳng Giác” (6/6); `okkhittacakkhu satimā` → “mắt nhìn xuống, có chánh niệm” (snp3.1:7.1); `guttadvāro` → “hộ trì các căn” (50 khoá); `Sapadānaṁ caramāno` → “đi khất thực tuần tự từng nhà” (snp3.1:9.1).
    + `amajjapo` → “không uống chất say” (5 khoá “chất say”, 1 khoá “rượu”); `naradeva` → “Trời giữa loài người” (vv63, vv83, pv17); `devate` → “hỡi vị thiên” (pv17:19.2, vv83:19.2); `arindama` → “hỡi bậc hàng phục kẻ thù” (ja511:26.2); `raṭṭhavaḍḍhana` → “bậc làm hưng thịnh xứ sở” (ja521:6.2 “bậc làm hưng thịnh quốc độ”); `kadariyo paribhāsako` → “keo kiệt, hay mắng nhiếc” (pv19:7.2).
    + `ophuṇāmi mahāvāte … nadiyā sīghagāmiyā` (56.1–56.2): cấu trúc giống dn16:4.34.2 (“thả cho cơn gió lớn cuốn đi, hay thả trôi theo dòng sông chảy xiết”) và an4.195:13.6; bản này dịch “tung vào cơn gió lớn, vào dòng sông chảy xiết”; đối tượng bị tung (tà kiến) chỉ nêu ở `56.3`, không thêm vào `56.1`.
    + `suttaguḷe khitte nibbeṭhentaṁ palāyati` → “vừa tháo ra vừa lăn đi”: theo dn2:20.10, mn76:16.14 (“cuộn chỉ … lăn đi”).
    + `Natthi dinnaṁ natthi hutaṁ` → “không có bố thí, không có lễ vật hiến cúng” (mn117:5.2, mn60:5.2: `huta` = “lễ vật hiến cúng”); `niyati` → “định mệnh” (dn2:20.6, mn60); `sattannaṁ` (28.4) giữ “bảy thứ” vì Pāli ở đây không nêu `kāyā`; dn2:26.10 dịch đủ “giữa bảy thân”.
  - Bất định đã ghi (không thêm vào thân kinh):
    + `2.2` `paṅkaṁ upāgami`: dịch sát chữ “đến chỗ bùn lầy”; `paṅka` ở tầng chỉ có nghĩa “bùn lầy”/“vũng bùn” (sn1.50, sn2.24, tha-ap535, snp3.6); không rõ có phải một vùng cụ thể nằm trên “đường sa mạc” (`vaṇṇupatha`, 2.4) hay không.
    + `5.3` `puriso`: người đàn ông hoảng sợ nói với vua ở 6–7; ở 8.1–9 vua nhắc lại đúng lời ấy cho người đánh xe, nên có thể người này là người đánh xe hoặc một người khác trong đoàn; Pāli không nói, dịch “một người đàn ông”.
    + `4.4` `suraṭṭhānaṁ santike ito`: dịch “từ đây đến gần xứ Suraṭṭha”; cũng có thể hiểu là “đường tắt từ đây đến gần người Suraṭṭha”.
    + `14.6`, `47.2` `pūve vitte`: dịch “những chiếc bánh ngon” (`vitta` = “vui lòng, ưa thích”). Tầng có một chỗ khác dùng `vitta` là tên gọi của cái bát (mn139:12.4) nên “bánh và các bát” là cách đọc khả dĩ khác; chưa phân xử.
    + `10.5–10.6` `Nīlabbhavaṇṇasadisaṁ, meghavaṇṇasirīnibhaṁ`: “giống màu mây xanh thẫm, rạng rỡ như vẻ huy hoàng của màu mây” (`nīlabbha` thag1.13:1.1 “màu xanh thẫm”).
    + `21.3–21.4` `Amaccā pārisajjā ca, brāhmaṇo ca purohito`: nhận định là xưng hô (nom. dùng như vocative) với các đại thần, cận thần và tế sư của vua; có thể còn hiểu là liệt kê những người cùng nghe. Đây là điểm dịch theo ngữ cảnh.
    + `26.2` `na visodheti verinaṁ`: dịch “không làm thanh tịnh những kẻ mang oán thù”; chủ ngữ không nêu (có thể là quả của bố thí hoặc việc bố thí), và `verī` có thể là “kẻ thù” hoặc “kẻ mang oán”; không có tiền lệ cùng cụm trong tầng. Đây là điểm bất định đáng kể thứ hai của bài.
    + `27.4` `sunihitaṁ na vijjati`: “điều khéo cất giữ cũng không có” (đối tượng được cất giữ — công đức — không nêu trong Pāli).
    + `28.3–28.4` `Na koci kañci hanati, sattannaṁ vivaramantare`: câu cắt ngắn, dịch giữ cú pháp tỉnh lược (“trong khoảng trống giữa bảy thứ”; lượt 2026-10-13 đã bỏ chữ “chỉ” vì Pāli không có); ý theo dn2:26 (thuyết Pakudha Kaccāyana), không đưa vào thân bài.
    + `29.3` `Yojanānaṁ sataṁ pañca`: xem phần số Pāli (500 hay 105).
    + `33.2` `satasahassāni hi`: `hi` giữ nghĩa nhấn (không dịch riêng); cách ngắt số qua hai khoá xem phần số Pāli.
    + `34.3` `Jino`: viết thường “bậc chiến thắng” (lượt 2026-10-13 hạ chữ hoa; trước đó viết hoa theo vv63:21.4, nơi `jinaṁ` chỉ Đức Phật). Ở đây đang trong cụm kệ của quan điểm sai mà ngạ quỷ từng theo (kệ 24–34, khép lại ở 35.1 `Evaṁdiṭṭhi pure āsiṁ`), nên người được nêu là vị thầy theo quan điểm ấy, không phải Đức Phật; chữ hoa dễ khiến người đọc hiểu là Đức Phật. Chưa xác định được danh tính vị ấy từ chính bài.
    + `39.1–39.4`, `40.1`: xem phần số Pāli (`lakkha`, `koṭi`); `tāvade` dịch “suốt chừng ấy”.
    + `42.4`, `46.4` `bhaddamatthu te`: dịch “cầu mong ngài được an lành” (lời chúc của ngạ quỷ với vua); hai lần dùng cùng khuôn.
    + `47.4` `tassetaṁ upakappatu`: “xin phần này có ích cho người” (an10.177:2.3 dịch `upakappatu` là “có ích”); `48.1` `anuddiṭṭhe` → “được hồi hướng” (không có tiền lệ cùng từ trong tầng, nghĩa theo ngữ cảnh lễ dâng cho người đã mất).
    + `56.3` `vamāmi` → “nhổ bỏ” (nghĩa gốc “nôn ra”; tầng chỉ có một chỗ khác ja389:6.2).
    + `57.4` `pāmokkho` → “người đứng đầu”: chỉ vua (cùng người ở 57.1); dn30, an4.95 dịch `pāmokkha` là “thượng thủ”/“đứng đầu”.
  - Dấu lược: bài này không có `…` hay `(…)` ở Pāli (0/240 khoá), nên bản Việt cũng không có; không phát sinh chính sách dấu lược.
