notes: |-
  Sáu vế kệ, mở nháy kép ở 1.1 và đóng ở 1.6, dòng kết 1.7 giữ HAI dấu lược như Pāli
    (BRIEF_VI3 §10.1, không mở rộng). Khung bốn khối tiêu đề giữ y hệt 24 bài thag1 đã có:
    0.1 giữ Pāli kèm số, 0.2 Bộ Một Bài Kinh, 0.3 tên phẩm, 0.4 Kinh Kệ Của Trưởng Lão.
    Sujato có 10/11 khoá (trống đúng dòng kết lược 1.7) nhưng MỌI khoá Pāli đều ngắn hơn 40 ký
    tự nên substantiveSegments = 0 và ratio = 1; đó là lý do bài này có thể published dù bản
    Anh chỉ phủ 10 khoá. Không có bản Việt hiện hành cho Trưởng Lão ở commit đã ghim.
    Tên riêng giữ nguyên dạng Pāli, không bịa tên Việt.
    Kiểm kỹ thuật: save_vi sạch, chạy hai lần idempotent (sha256 không đổi). Vì mọi khoá Pāli của Theragāḵā ngắn hơn 40 ký tự nên cần trong kiểm() rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá: đủ 11/11 khoá; đúng ID; thứ tự khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2 ở dòng kết); nháy kép cân trên cả bài; không còn `(…)`; không có ký tự ngoài Latin. Không chạy npm run validate|test|check|build (đợt này cấm) nên technical_integrity = 9.6, không phải 10.  Không đối chiếu được tầng Việt hiện hành: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Đây là giới hạn của bản chụp upstream, đã ghi ở content/meta/reference-gaps.yaml.
    SÁU VẾ NÀY LÀ CÙNG MỘT BÀI KỆ VỚI sn4.22:4.1-4.6 (Sarabuddhasammādīṇiha), đã có bản Việt trong
    tầng. Tôi đã đối chiếu từng vế và dùng lại nguyên văn ở bốn vế trùng nguyên văn:
    1.1 Saddhāyāhaṁ pabbajito = Tôi xuất gia vì lòng tin; 1.4 Cittañca susamāhitaṁ = tâm khéo được
    định tĩnh; 1.5 Kāmaṁ karassu rūpāni = ngươi muốn hiện ra các hình sắc gì thì cứ làm;
    1.6 Neva maṁ byādhayissasī = ngươi sẽ không thể khuấy nhiễu ta. Chỉ khác chữ n thường/hoa ở 1.6.
    Hai vế còn lại tôi dịch riêng vì Pāli khác thật, không phải vì lười:
    1.3 ở đây là vuḍḍhā (đã lớn mạnh) chứ không phải buddhā như ở sn4.22:4.3 (đã thuần thục).
    1.2 ở đây gộp chữ Agārasmānagāriyaṁ còn sn4.22:4.2 viết rời agārasmā anagāriyaṁ.
    Nếu đổi 1.3 sang thuần thục thì mất nghĩa của vuḍḍhā, nên tôi giữ đã lớn mạnh (53 tiền lệ) và
    ghi ra đây. Ở 1.2 tôi dùng từ đời sống gia đình sang sống không gia đình thay vì nguyên văn sn4.22
    từ gia đình sống đời không nhà, vì Pāli hai nơi viết khác nhau và cách của tôi khớp với
    xuất gia từ bỏ gia đình đang có 932 tiền lệ.
    Ngoài ra saddhā → lòng tin (345 chỗ) và rūpāni → hình sắc (64 chỗ, giữ Hán–Việt vì đây là thuật
    ngữ quen thuộc trong văn học Phật giáo). Pāli ở 1.5 nói rõ là hình sắc, không nói là ảo ảnh, nên
    tôi giữ hình sắc chứ không theo cách dịch của Sujato là illusions.
    Cũng đã đối chiếu thig1.8:1.1 và thig1.9:1.1 (Saddhāya pabbajitvāna = Đã xuất gia vì lòng
    tin): dạng phân từ ở thig không có chủ ngữ nên thêm Tôi ở đây là đúng, và nguyên văn sn4.22 đã
    cho sẵn chữ Tôi.
