notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trong
  source/upstream-manifest.json). Draft + blocker thật. 13/13 khoá từ Pāli. `cần` RỖNG nên
  tự kiểm mọi khoá — 0 lỗi; idempotent byte-for-byte.
  Tiền lệ: Phẩm Hội Họp cho Santhavavagga (xem ja161); hội họp đã có 3 chỗ trong tầng.
  Cấu trúc bài là hai khối đối xứng trên cùng một công thức santhava: 1.1–1.4 là hội họp
  tệ nhất, 2.1–2.4 là hội họp tốt nhất. Dịch song song có chủ ý, cùng nhịp, khác nội dung.
  BẤT ĐỊNH 1: `kicchākataṁ paṇṇakuṭiṁ` — kicchā là ống sáo, kata là làm bằng, paṇṇakuṭi
  là mảnh vỏ hay mảnh nhỏ. Chọn mảnh sáo nhỏ. Câu này nói kẻ khéo thổi sáo lại làm vỡ mảnh
  sáo, nên giữ cả sáo ở cả hai vế cho nhất quán.
  BẤT ĐỊNH 2: `santappito` là khéo léo, tận tay; `sappinā pāyasena` là bằng sáo trúc. Ghép
  thành Kẻ tận tay, khéo thổi ống sáo trúc.
  BẤT ĐỊNH 3: `sāmā` là bò rừng, bò hoang; `lehati` là liếm; `mukhaṁ` là mõm. Cả bốn vế
  đều là hình ảnh các loài thú lịch sự nhau. Dịch là cùng đàn bò rừng liếm mõm, bạn bè
  trong hội họp ấy còn hít thơm nó.
  BẤT ĐỊNH 4: `paramatthi pāpiyo` và `paramatthi seyyo` — tệ nhất và tốt nhất trong các
  cuộc hội họp. Dùng không có gì tệ hơn và không có gì tốt hơn, đúng cặp.
  Hạ terminology 8.6, semantic_fidelity 8.8, ambiguity_integrity 8.6 vì còn bốn chỗ thuật
  ngữ vật liệu chưa có bản Anh để đối chiếu. triangulation 7.0: không tầng Anh, không bản
  Việt tham khảo.
  Lượt cải thiện 2026-10-11: đọc đối kháng cặp Pāli↔Việt cho thấy bản cũ sai nặng ở cả hai
  khổ kệ, nên các BẤT ĐỊNH 1–4 và đoạn "Tiền lệ" ở trên (ống sáo, mảnh sáo, bò rừng, hội họp)
  thuộc bản dịch cũ và BỊ THAY THẾ bởi mục này. Đã đổi 11/13 khoá (tập khoá giữ nguyên).
  Sửa chính xác: 1.1/2.1 `na santhavasmā paramatthi pāpiyo/seyyo` là so sánh tách cách
  (ablative), nghĩa "chẳng có gì tệ hơn/tốt hơn sự thân quen" (trước: "trong các cuộc hội
  họp"); `santhava` = sự thân quen, khớp tiền lệ tầng "kết thân" (sn1.31, ja190, ja537) và
  "sự thân quen" (ja429, ja430), không phải "hội họp". 1.2/2.2 `kāpurisena`/`sappurisena`
  = kẻ xấu / bậc thiện nhân (tiền lệ ja542, ja546, ja522: "kẻ xấu", "bậc thiện nhân"; bản cũ
  "kẻ tiếc nhân", "bậc thiện chí" không có tiền lệ). 1.3 `santappito sappinā pāyasena` =
  được thỏa mãn bằng bơ lỏng và cháo sữa (bản cũ: "ống sáo trúc" — `sappi` là bơ lỏng,
  tiền lệ sn7.8, ja543; `pāyasa` là cháo sữa, tiền lệ sn7.8, ud4.3; `santappita` tiền lệ
  "thỏa mãn/thỏa lòng", ud4.3, ja524). 1.4 `kicchākataṁ paṇṇakuṭiṁ adayhi` = đốt cháy chòi
  lá dựng nhọc nhằn (bản cũ: "làm vỡ mảnh sáo nhỏ"; `paṇṇakuṭi` tiền lệ "chòi lá"/"lều lá"
  ở dn23, dn27, ud3.3, ja526). 2.3 `sīhassa byagghassa ca dīpino ca` = sư tử, hổ, báo (bản
  cũ "vua sư tử, hổ, cùng con hươu": nhầm `dīpi` là báo, tiền lệ "sư tử, hổ và báo" ở nhiều
  bài). 2.4 `sāmā mukhaṁ lehati santhavena` = con cái sẫm màu liếm mặt (của ba thú) bởi
  sự thân quen. Tiêu đề và nhãn: `Santhavavagga` giữ "Phẩm Santhava" theo đa số 7/10 bài trong
  phẩm (ja164–170); "Hội Họp" chỉ ở ja161, ja162, ja163, và là nghĩa sai, nên không giữ ở
  đây (ja161, ja163 là việc ngoài tệp của lượt này); 0.4 và 3.1 đổi "Kinh Hội Họp" thành
  "Kinh Thân Quen". Đo: `santhava` ở tầng ja có 7 lần dạng `santhavo` + 8 dạng `santhavaṁ`,
  không bài nào dùng "hội họp" cho nghĩa này ngoài ja161–163; `bơ lỏng` 2/2 cho `sappi`.
  Bất định còn lại (giữ nguyên, không phân xử được từ kệ): (a) kệ gốc không nêu chủ ngữ của
  `santappito … adayhi`; bản dịch giữ đại từ "nó". Bản Anh của phần văn xuôi dẫn (bản dịch Rouse
  trong bộ Jātaka do Cowell chủ biên, đọc để hiểu cách đọc, không chép câu chữ) nói đó là lửa
  thờ mà vị ẩn sĩ cúng cơm và bơ lỏng, cũng là cảnh dẫn cho "bạn xấu"; phần văn xuôi ấy không thuộc
  Pāli root đã ghim nên không đưa vào lời kệ. (b) `sāmā` ở 2.4: kệ chỉ có `sāmā` (cái sẫm
  màu); cùng nguồn văn xuôi nói là con nai cái đen, bản dịch dùng "con nai cái đen" theo đó;
  đây là cách đọc dựa vào bối cảnh bài, không phải từ chính kệ. (c) `kāpurisena` có thể ám chỉ
  ngọn lửa như "bạn xấu" hoặc một người; bản dịch giữ "kẻ xấu" chung.
  Chấm lại: grammar_logic 8.8 → 9.0 (vai so sánh, chủ thể ba loài thú và con vật liếm đã
  đúng); terminology 8.6 → 8.8 (thuật ngữ khớp tiền lệ tầng; tên phẩm vẫn lệch giữa ja161–163
  và ja164–170); technical_integrity 10.0 → 9.6 vì bốn lệnh `npm run validate`, `npm test`,
  `npm run check`, `npm run build` chưa chạy trong lượt này; semantic_fidelity 8.8, triangulation
  7.0, ambiguity_integrity 8.6 giữ nguyên vì bất định (a)(b)(c) còn và vẫn không có tầng Anh đã
  ghim; điểm cũ của bản trước đã quá cao so với lỗi thật của nó. Blocker "không có tầng tham khảo
  tiếng Anh" giữ nguyên.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 5 khoá chênh lệch lớn nhất (cả bài chỉ có 13 khoá) → khác nghĩa 1: sửa 0, giữ 0, bất định 1 (ja162:2.4 `Sāmā mukhaṁ lehati santhavenā`: bản dự án dịch “con nai cái đen”, bản mù dịch “con chó” và tự đánh dấu không chắc; `sāmā` đứng một mình là “con vật sẫm màu” nên chính kệ không phân xử được, cách đọc “nai cái đen” dựa vào khung truyện đã ghi ở trên, giữ nguyên). Bốn khoá còn lại (1.4, 1.2, 0.4, 3.1) chỉ khác diễn đạt hoặc cách đặt tên bài; tám khoá không nằm trong nhóm chênh lệch lớn nhất nên không được đối chiếu từng chữ với bản mù. Đọc đối kháng lại toàn bài: nháy, số, xưng hô và thuật ngữ `santhava` nhất quán, không đổi khoá nào. Không có bản Anh hay bản Việt độc lập khác.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :3.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
