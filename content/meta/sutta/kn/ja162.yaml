notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trong
  source/upstream-manifest.json). Draft + blocker thật. 13/13 khoá từ Pāli. `cần` RỖNG nên
  tự kiểm mọi khoá — 0 lỗi; idempotent byte-for-byte.
  Tiền lệ: Phẩm Hội Họp cho Santhavavagga (xem ja161); hội họp đã có 3 chỗ trong tầng.
  Cấu trúc bài là hai khối đối xứng trên cùng một công thức santhava: 1.1–1.4 là hội họp
  tệ nhất, 2.1–2.4 là hội họp tốt nhất. Dịch song song có chủ ý, cùng nhịp, khác nội dung.
  BẤT ĐỊNH 1: `kicchākataṁ paṇṇakuṭiṁ` — kicchā là ống sáo, kata là làm bằng, paṇṇakuṭi
  là mảnh vỏ hay mảnh nhỏ. Chọn mảnh sáo nhỏ. Câu này nói kẻ khéo thổi sáo lại làm vỡ mảnh
  sáo, nên giữ cả sáo ở cả hai vế cho nhất quán.
  BẤT ĐỊNH 2: `santappito` là khéo léo, tận tay; `sappinā pāyasena` là bằng sáo trúc. Ghép
  thành Kẻ tận tay, khéo thổi ống sáo trúc.
  BẤT ĐỊNH 3: `sāmā` là bò rừng, bò hoang; `lehati` là liếm; `mukhaṁ` là mõm. Cả bốn vế
  đều là hình ảnh các loài thú lịch sự nhau. Dịch là cùng đàn bò rừng liếm mõm, bạn bè
  trong hội họp ấy còn hít thơm nó.
  BẤT ĐỊNH 4: `paramatthi pāpiyo` và `paramatthi seyyo` — tệ nhất và tốt nhất trong các
  cuộc hội họp. Dùng không có gì tệ hơn và không có gì tốt hơn, đúng cặp.
  Hạ terminology 8.6, semantic_fidelity 8.8, ambiguity_integrity 8.6 vì còn bốn chỗ thuật
  ngữ vật liệu chưa có bản Anh để đối chiếu. triangulation 7.0: không tầng Anh, không bản
  Việt tham khảo.
