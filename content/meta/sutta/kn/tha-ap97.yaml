notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho `tha-ap`, xem `blocking_errors`.
  ĐO `tha-ap :0.3` theo hướng lát s7 (so với Pāli, KHÔNG so theo chuỗi Việt): 357 tệp Việt có khoá `:0.3`; Pāli `:0.3` KHÔNG có số thứ tự ở 242 tệp, và 240/242 (99,2%) bản Việt cũng không có — xác nhận con số của s7 (289/291 = 99,3%). Chiều ngược lại thì kho còn lệch: Pāli `:0.3` CÓ số ở 115 tệp mà bản Việt chỉ giữ 71 (61,7%), tức 44 tệp đang thêm số ở chỗ Pāli không có. Ba bài trong lát này đều có Pāli `:0.3` không số (`Bhisadāyakattheraapadāna`, `Gandhamāliyattheraapadāna`, `Pallaṅkadāyakattheraapadāna`) ⇒ BỎ số ở `:0.3`, đặt số ở khoá đóng, nơi Pāli thật sự có (`pañcamaṁ` / `dasamaṁ`). Mẫu tiêu đề: `Bài Kệ Tuyên Ngợ Về Trưởng Lão …` 203/357 so với `Ký Sự Về Trưởng Lão …` 89/357 và `Bài Kệ Tuyên Ngôn …` 65/357. Mẫu phẩm ở `:0.2`: `Phẩm X` 469 lần, giữ nguyên Pāli chỉ 9 lần.
  `…pe…` của Pāli giữ đúng MỘT dấu lược `…` theo 606/606 tiền lệ có số đếm trong tầng; không mở rộng ở bất kỳ khoá nào. `Therāpadāna` ở `:0.1` giữ nguyên Pāli (348/357).
  ĐỐI CHIẾU TIỀN LỆ ĐẾM ĐƯỢC (22 khoá trong bài có Pāli trùng nguyên văn ở bài khác; 11/22 dùng lại đúng nguyên văn): `Therāpadāna` 345; `Phẩm Sudhā` 7 (trùng nguyên văn `tha-ap100:0.2`); `được hội chúng tỳ-kheo vây quanh.` cho `bhikkhusaṅghapurakkhataṁ.` 3; `Bốn vô ngại giải,` 362; `…` 603; `đã làm tròn lời dạy của Đức Phật”.` 329; `đây là quả báo của việc cúng dường Đức Phật.` cho `buddhapūjāyidaṁ phalaṁ.` 29/82 (đa số); `sumanā` là `hoa lài` trong 3/3 bản đã có của cụm `Sumanehi paṭicchannaṁ,`; `“Lên Đức Thế Tôn Siddhattha,` khớp 5 bản đã có của mẫu `Xassa bhagavato` ở `:1.1` (kho đang phân mảnh: `Lên` 5, `Đến` 2, `Của` 2 — giữ `Lên` vì đã là đa số).
  SỬA 4 LỖI TÌM ĐƯỢC TRONG TỆP DỊCH CÓ SẴN:
    (1) `2.4` BỊA — bản cũ `tựa ngọn lửa thiêu rụi tàn nhà.`; `ādittaṁva hutāsanaṁ.` không có `nhà` nào (`asana` = chỗ ngồi/lò tro, `huta` = cháy cháy). Đã sửa `tựa ngọn lửa thiêu đống tro tàn.` — cụm `đống tro tàn` đã có tiền lệ ở `cp17:4.4`. Lưu ý cho người gộp: 7 bài có Pāli `ādittaṁva hutāsanaṁ.` nhưng chỉ 2 đã dịch, và bản kia (`tha-ap333:2.4`) bỏ hẳn `hutāsana`.
    (2) `3.1` BỊA — bản cũ `Tựa chúa báo đầu bầu, bậc tối thượng,`; `đầu bầu` (trưởng đàn) không có trong Pāli và không đúng với con báo. Đã sửa `Tựa báo chúa, bậc tối thượng,`. `byagghū` để là `báo` theo hơn 30 bản sẵn có của tầng (`cp33:1.3` `sư tử và hổ`, `ja272:3.1` `những con hổ`, `snp3.1:12.3` `Ngồi đó như hổ` — cùng công thức `-sabha`), và theo `tha-ap72:1.2` đã dịch `garuḷaggaṁva` là `cọp già` nên `byagghūsa` không thể cũng là báo.
    (3) `4.1` LỆCH TIỀN LỆ — bản cũ `Sau khi đảnh lễ…`; 5/6 bản cho `Vanditvā satthuno pāde,` dùng `đảnh lễ dưới đôi chân bậc Đạo Sư,`. Đã theo đa số.
    (4) `4.3` LỆCH TIỀN LỆ — bản cũ `Khi đã qua bốn mươi chín kiếp,`; 73/85 bản cho `Catunnavutito kappe,` dùng nhóm `chín mươi tư kiếp trước…`, còn `bốn mươi chín` chỉ 10/85. Đã sửa `Vào chín mươi tư kiếp trước đây,`.
  BẤT ĐỊNH (ghi ở đây, KHÔNG giải thích trong thân kinh):
    (a) `Buddhe katassa kārassa,` (5.1) — hapax toàn Pāli root. Đọc `buddhe` là dative (quà dâng lên Đức Phật) và `katassa kārassa` là cách `của người thực hiện việc ấy`; bản dịch `Món quà đã dâng lên Đức Phật,` lấy theo nghĩa (`kārassa` = người làm) nên dịch gộp thành món quà. `5.4` `buddhapūjāyidaṁ phalaṁ.` đã nói rõ là quả báo của việc cúng dường nên không mất nghĩa, nhưng đây là cách đọc chứ không phải nghĩa chữ nghĩa thẳng.
    (b) `Cattārīsamhi ekūne,` (6.1) nghĩa là bốn mươi trừ một; giữ hình thức cách tính của Pāli (`Thiếu một mối trong bốn mươi kiếp,`) thay vì đổi thành bậc chữ `ba mươi chín`, vì `tha-ap72:6.3` cùng phẩm cũng giữ kiểu thứ tự (`Trong kiếp thứ mười bốn ấy` cho `kappamhi cuddase āsuṁ`).
    (c) `4.3` nói bốn mươi chín kiếp nhưng `6.1` nói thiếu một mối trong bốn mươi — hai con số không khớp trong chính Pāli; giữ nguyên cả hai, không tự hoà giải.
    (d) `buddhānucchavikaṁ kataṁ.` (1.4) dịch `là lễ bái tôn kính các Đức Phật.`; 0 tiền lệ cho cụm này.
    (e) `pavaraṃ` (3.1) dịch `bậc tối thượng`; cụm kệ 3.1–3.2 (`Byagghūsabhaṁva pavaraṁ, / abhijātaṁva kesariṁ;`) là 3 bản đã có, mỗi bản một cách, không có đa số rõ.
