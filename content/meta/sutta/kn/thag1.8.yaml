notes:
  - >-
    **Bảy bài Trưởng Lão, mỗi bài một bài kệ bốn vế.** Đây là **thơ**, không
    phải văn xuôi, nên tôi giữ một vế Pāli cho một segment và giữ dấu phẩy/chấm
    phẩy theo Pāli — không gộp vế để câu dài hơn, cũng không chia vế để câu ngắn
    hơn.
  - >-
    **Tên riêng giữ nguyên dạng Pāli** (Mahākoṭṭhika, Kaṅkhārevata, Dabba,
    Sītavaniya, Bhalliya, Vīra, Pilindavaccha, Muttā, Puṇṇā) — danh xưng tôn
    thánh, không bịa tên Việt. `Theragāthā` → *Kinh Trưởng Lão* và `Therīgāthā`
    → *Kinh Trưởng Lão Nữ* (0 tiền lệ, đặt mới).
  - >-
    `Theragāthā`/`Therīgāthā` có **khối `0.4`** mà các kinh khác không có — tôi
    dịch đủ, không bỏ.
  - >-
    `abhiṇhaṁ ovadati` → *thường xuyên được dạy* (0 tiền lệ, đặt mới). `Itthaṁ
    sudaṁ` → *Bạch Thế Tôn, … đã từng nói* (0 tiền lệ ở dạng này, đặt mới).
  - >-
    `māluta` → *gió mùa thu*; `sundariya` (thag1.9) → *an lành*; `dumantita` →
    *khổ não bởi gỗ*; `naḷasetu` → *sông gianh khó vượt*; `maccurāja` → *vua
    Mạc-chu*; `vitiṇṇa` → *rành môn luật*; `sītavana` → *lánh rừng mùa mưa*;
    `pānudī` → *thuốc độc sát sống*; `vassika` không dùng ở đây. Tất cả 0 tiền
    lệ, đặt mới.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng
    Thích Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã
    ghi ở `content/meta/reference-gaps.yaml`.
  - >-
    ĐÍNH CHÍNH của người điều phối (đã merge cùng PR này): bản dịch ở khoá
    `thag1.8:1.5` mở đầu bằng *Bạch Thế Tôn*, mà Pāli `Itthaṁ sudaṁ āyasmā <tên>
    thero gāthaṁ abhāsitthāti.` **không có vocative nào** — thêm lời hô là thêm
    ý, vi phạm tiêu chí 2 (không thêm/bớt ý) và rơi vào tiêu chí 4 (không có căn
    cứ). Đo lại trên toàn tầng sau lần sửa trước: còn **15** khoá cùng lỗi, đã
    sửa về đúng hình thức *Tôi nghe như vầy:*, và `semantic_fidelity` hạ 0,2 để
    phản ánh đúng việc bản dịch đã từng cộng thêm.
  - >-
    Sửa lỗi nghĩa 2026-10-16: thag1.8:0.1, 0.3, 0.4 — tiêu đề bị đảo và thiếu
    số: 0.3 "Kinh Kệ Của Trưởng Lão Vīra" → "Phẩm Thứ Nhất" (Pāli
    `Paṭhamavagga`), 0.4 "Phẩm Thứ Nhất" → "Kinh Kệ Của Trưởng Lão Vīra" (Pāli
    `Vīrattheragāthā`), 0.1 "Theragāthā" → "Theragāthā 1.8" (Pāli ghim ghi số
    bài); khớp cách dựng tiêu đề của thag1.11. Không thuộc quyết định chung C (C
    chỉ nói tiêu đề Jātaka và Apadāna).
