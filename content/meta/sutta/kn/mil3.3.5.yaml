notes: |-
  Lát c55. Mệnh đề 0.1 `mil`: giữ Pāli “Milindapañha” theo đa số trong chính tầng `kn` —
  đếm được 183 bản dùng “Milindapañha”, chỉ 8 dùng “Mi-lan-đà” và 3 dùng “Mi-tiên Vấn
  Đáp”. `0.2` và `0.3` dùng lại nguyên văn `mil3.3.4:0.2–0.3` (bài kề): “Phẩm Khảo Sát” /
  “5. Câu hỏi về sự khởi sinh của tiến trình”.

  KHÔNG có tầng Anh đã ghim ⇒ `draft` + blocker, xem `blocking_errors`. Bài dịch hoàn
  toàn từ Pāli root, có đối chiếu song song với **bốn bài mil đã có** trong cùng phẩm.

  Trùng nguyên văn Pāli trong lát (25 nhóm / 71 khoá); riêng bài này:
  `“Bhiyyo opammaṁ karohī”ti.` ×6 (3.1, 4.1, 5.1, 6.1, 7.1, 8.1) — dùng lại **nguyên
  văn** một dạng, theo `mil3.1.9:3.1`; `“Na hi, bhante”ti.` ×4 và cụm
  `“Evameva kho, mahārāja, natthi keci saṅkhārā…”` ×7 — cũng một dạng duy nhất.
  Đây là công thức lặp nguyên văn trong Pāli; dịch mỗi khoá một kiểu sẽ làm bài tự mâu
  thuẫn.

  Văn phong theo ba bài kề `mil3.3.3`/`mil3.3.4`/`mil3.3.6`: `Rājā āha—` → “Vua nói—”,
  `bhante nāgasena` → “thưa tôn giả Nāgasena”, `mahārāja` → “thưa Đại vương”;
  `Opammaṁ karohī`ti. → ““Xin hãy xét một thí dụ”ti.”; `Kallosi, bhante nāgasenā`ti. →
  ““Khéo lắm, thưa tôn giả Nāgasena.””; `saṅkhārā` → “tiến trình” (đúng như `mil3.3.4:0.3`
  và `:1.2` đã có).

  Thuật ngữ trong ví dụ — **0 tiền lệ toàn tầng** (đã grep `Ādāso`, `Araṇi`, `doṇi`,
  `tanti`, `upavīṇo`, `koṇo`, `Ātapo`, `gomayaṁ`, `dārūni`, `Ābhā`, `Attā`):
  tôi dịch nghĩa đen và ghi ở đây — bộ phận cây đàn (`vīṇāya pattaṁ` thân đàn, `cammaṁ` mặt
  da, `doṇi` quai, `daṇḍo` thanh, `upavīṇo` cầu đàn, `tantiyo` dây, `koṇo` trục); bộ đá
  lửa (`araṇi` tảng đá đánh lửa, `araṇipotako` đá để đập, `araṇiyottakaṁ` vật liệu bắt
  lửa, `uttarāraṇi` đá lửa trên, `coḷakaṁ` rơm rác khô); `maṇi` viên ngọc, `ātapo` mặt
  trời, `gomayaṁ` phân bò (dùng "viên ngọc" 64, "phân bò" 20 — có tiền lệ); gương
  (`ādāso` tấm gương 18, `ābhā` hình phản chiếu, `mukhaṁ` khuôn mặt 19); `attā` = "bản ngã".
  Bốn cụm kỹ thuật này **không có bản Việt nào đã có** để đối chiếu, nên đây là nơi bài
  này yếu nhất; `terminology` 8.9 phản ánh đúng điều đó.

  `āma` = “Vâng” (5.5, 6.5, 7.5, 8.5) — cùng dạng dùng trong câu trả lời khẳng định ở
  mil3.3.6.

  Dấu lược: bài này **không có** `…pe…` nào ⇒ bản Việt không có dấu lược nào (đã kiểm bằng
  `lược()`).

  Bị chặn cổng kỹ thuật (không được chạy `npm run validate|test|check|build`), tiêu chí 10
  ở **9.6**: đã xác minh JSON hợp lệ, 42/42 khoá, không orphan/rỗng, NFC, dấu lược khớp
  (0 lệch), ngoặc kép cân 35/35, không `(…)` đứng một mình. Bốn lệnh npm để coordinator
  chạy.