notes: |-
  **Phạm vi: đủ 435/435 khoá của mnd12, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải `snp4.12` (Cūḷabyūhasutta, Kinh Tiểu Bố), thuộc phẩm Aṭṭhakavagga. Cấu trúc như `mnd4`, `mnd5`, `mnd8` và các bài Cūḷaniddesa: dẫn từng đoạn kệ, giải từng cụm, nhắc lại cả đoạn kệ trong ngoặc kép. Có 17 đoạn kệ in đậm (`2`, `9`, `16`, `23`, `30`, `37`, `44`, `51`, `58`, `64`, `70`, `77`, `84`, `90`, `96`, `103`, `109`), mỗi đoạn được nhắc lại trong ngoặc kép (`8`, `15`, `22`, `29`, `36`, `43`, `50`, `57`, `63`, `69`, `76`, `83`, `89`, `95`, `102`, `108`, `115`); lời dẫn nhập có bốn lần *Vì thế, vị được hóa hiện ấy đã nói—* (`7`, `14`, `42`, `56`) và 13 lần *Vì thế, Đức Thế Tôn đã nói—*. Pāli có 159 khoá mang thẻ in đậm, bản Việt không mang thẻ. Dấu lược `…`: 14 khoá (10 khoá có `…pe…` đều thành đúng một `…`; 4 khoá có `…` trần `110.6`–`110.9`, mỗi khoá giữ đúng một dấu), 0 khoá có `(…)`, 0 khoá kết `….`. Nháy: Pāli có 39 khoá chứa “ và 39 khoá chứa ”, 0 nháy đơn; bản Việt khớp Pāli từng khoá (0/435 lệch), kể cả dấu mở “ ở `110.6` đóng ở `110.10`.

  **Tên bài.** `0.1` → *Đại Tập Kể Lược*, `0.2` → *Kể Lược Phẩm Tám Kệ*, theo `mnd4`, `mnd5`, `mnd8`; `0.3` và `116.1` → *Kể Lược Kinh Tiểu Bố, thứ mười hai* (tên kinh theo `snp4.12:0.2`, cùng khuôn với *Kể Lược Kinh Pasūra, thứ tám* ở `mnd8:86.1`).

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd12`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho kn/mnd và tệp tên `mnd-name` (tên bài: *Exposition of the Shorter Discourse on Arguments*); không có tệp `mnd12_translation-en-sujato.json`. Lớp `english-project` không có `mnd12`; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự theo cách đếm của kho, bỏ khối `0.x`) là **134** khoá (121 nếu bỏ thẻ in đậm trước khi đếm); Sujato phủ 0/134, `english-project` 0/134, `vietnamese-current` 0/134. Ba tầng vắng hết ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`; không nâng điểm để né blocker, và entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.12` có trong tầng đã ghim nhưng là bản của **bài khác** (bài kệ), nên không tính là đối chiếu English của mnd12; chứng cứ độc lập còn lại là bản Việt đã dịch của `snp4.12`, `snp4.8`, `snp4.13`, các bài `mnd4`, `mnd5`, `mnd8` cùng đợt và các khoá chú giải tương ứng ở `cnd7`, `cnd9`–`cnd16`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, gộp khoảng trắng) trùng nguyên dấu câu với khoá đã dịch ngoài bài này: 122 khoá có tiền lệ, dùng lại nguyên văn 79 (theo khoá bản Việt trùng: `snp4.12` 46, `mnd8` 29, `mnd5` 19, `mnd4` 18, `cnd9` 17, `cnd15` 16, `cnd14` 16, `cnd12` 15, `cnd7` 15, `cnd11` 14; một khoá có thể trùng nhiều nguồn), 24 khoá chỉ khác nháy/dấu câu/chữ hoa so với tiền lệ (do Pāli khoá này không có nháy mà `snp4.12` đặt nháy đơn quanh lời nói, hoặc do dòng kệ nằm giữa khổ), 19 khoá khác nội dung. Thêm 82 khoá trùng sau khi bỏ dấu câu và chữ hoa/thường: dùng lại 71, khác 11 (đều là hệ quả của cùng các lý do dưới đây, hoặc rút gọn `…pe…` ở `60.5` (`sn45.7:3.7` liệt kê đủ tám chi), hoặc công thức *Thế giới thường còn; chỉ điều này là thật, ngoài ra là sai* ở `33.2`, `33.5` theo `mnd4`/`mnd5`/`mnd8`: tầng có *ngoài ra là sai* 62 khoá — `dn`, `mnd`, `ud` — và *ngoài ra đều hư vọng* 84 khoá — `an`, `mn`, `ne` —, nên giữ dạng của họ hàng gần nhất là `mnd`). Các khoá Pāli trùng nguyên văn trong tiền lệ mà bản Việt khác nội dung, kèm lý do:
  - `2.2`, `8.2`, `4.4` (trùng `snp4.12:1.2`) và `9.1`, `37.3`, `43.3`, `10.5`, `15.1`, `40.5` (trùng `snp4.12:2.1`, `snp4.13:10.3`): *viggayha* → *sau khi nắm giữ*, không phải *tranh chấp, cãi nhau*/*lục lọi*, vì lời giải `4.2` và `10.2` giải *viggayha* bằng *gahetvā uggahetvā gaṇhitvā parāmasitvā abhinivisitvā* và nối *vivādayanti* với *kalahaṁ karonti … medhagaṁ karonti*; chữ *tranh chấp* lại là *bhaṇḍana* ở chính lời giải (`mnd5:6.3`, `mnd8:12.3`). Trong tầng *viggayha*/*vigayha* xuất hiện 25 khoá, `mn18`/`sn22.3` dịch *tranh luận/tranh cãi*, `snp4.9:10.4` *xung đột*, `snp4.8:2.1` (*vigayha*) *chen vào*; không có dạng *nắm giữ* nào, nên đây là lựa chọn mới dựa trên lời giải, ghi để người biên tập xét;
  - `23.3` bỏ chữ *thì* của `snp4.12:4.3`, vì `23.1` mang nghĩa phủ định (xem bất định 1);
  - `30.2`, `36.2`, `32.4` thêm *từng đôi một* (`mithu`) mà `snp4.12:5.2` bỏ, vì lời giải `32.2` giải riêng *Mithū* bằng *Từng đôi: hai người, …*;
  - `64.1`, `64.2`, `69.2` (trùng `snp4.12:10.1`, `10.2`): dòng 1 theo cách đọc *trong cái được thấy, được nghe, được nhận thức, hay trong giới luật và khổ hạnh* (`mnd5:9.2`, `mnd5:14.2`, `snp4.5:2.2` là *trong cái được thấy …*, 3 nơi; `mnd4:16.2`, `mnd4:29.2`, `snp4.4:3.2` là *qua cái được thấy …*, 3 nơi; so với 1 nơi `snp4.12:10.1`) vì lời giải `65.2` tách *sīla* và *vata*; vì vậy *nissāya* phải dồn xuống dòng 2 (*nương vào những điều ấy, nó có cái nhìn khinh miệt*), không dịch *kẻ thấy khinh miệt hiện ra*;
  - `70.4` (trùng `snp4.12:11.4` *cũng chính điều ấy là ác*): lời giải `74.4` giải *tadeva pāva* là *tadeva taṁ diṭṭhigataṁ pāvadati …* nên dịch *chính điều ấy nó tuyên nói*;
  - `77.2`, `83.2`, `79.5` (trùng `snp4.12:12.2`): *paripuṇṇamānī* → *tự cho là viên mãn* vì `79.4` giải *paripuṇṇamānī samattamānī anomamānī*; `snp4.12` dịch *đầy tràn ngã mạn*;
  - `103.3`, `108.3`, `115.4`, `113.1`, `113.7` (trùng `snp4.12:16.3`, `17.4`): *medhaga* → *tranh cãi* thay *xung đột*, vì *xung đột* là *viggaha* ở chuỗi năm mục `10.2`, `46.4`, `106.3`, `111.5`, `113.2`; riêng *vivade* ở `44.2` giữ *tranh chấp* theo `snp4.12:7.2` vì lời giải không giải riêng động từ ấy;
  - `109.2`, `115.2`, `111.1`–`111.5`, `111.8` (trùng `snp4.12:17.2` *tranh cãi ngày càng nhiều*): *uddhaṁsa* → *về sau*, vì `111.2` ghi *Uddhaṁso vuccati anāgataṁ*; *vivāda* → *tranh luận* (xem bất định 4).
  Đã dò **50 nhóm Pāli trùng nguyên byte trong chính bài** (67 khoá lặp thêm): 1 nhóm bản Việt khác (`9.1` so với `37.3`, `43.3`, chỉ khác chữ hoa đầu dòng kệ *Cũng như vậy* / *cũng như vậy*). Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 91 nhóm (156 khoá lặp thêm), 1 nhóm khác ngoài chữ hoa (`113.1`, `113.7` so với `115.4`, vì *jantu* nằm ở dòng 3 theo cách chia dòng của `snp4.12:17.3`).

  **Thuật ngữ, kèm số đếm.** *sacca* → *chân thật* (`snp4.12:2.3`, `5.3`, `7.1`, `7.3`, `8.1`, `8.3`, `9.1`; 7 dòng kệ), không dùng *sự thật* của `mnd5:38.4` (dùng trong danh sách *sự thật, xác thực, như vậy, có thật, đúng như thật, không sai lệch*), vì tái dùng kệ; trong công thức chung *idameva saccaṁ moghamaññaṁ* giữ *chỉ điều này là thật* như `mnd4:13.5`, `mnd5:50.4`, `mnd8:3.3`. Chuỗi *hīno nihīno omako lāmako chatukko paritto* → *thấp kém, hèn kém, hạ liệt, tồi tệ, đê tiện, nhỏ nhoi* (`mnd5:5.10`, `mnd8:11.3`: 6 khoá, 2 tệp). *kalaha · bhaṇḍana · viggaha · vivāda · medhaga* → *cãi vã · tranh chấp · xung đột · tranh luận · tranh cãi* (`mnd5:6.3`, `mnd8:12.3`, `mnd8:11.2`). *kathenti bhaṇanti dīpayanti voharanti* → *thuyết, tuyên bố, làm sáng tỏ, diễn đạt* (`cnd11` 20 khoá, `mnd8:4.4`, `mnd8:24.1`; 26 khoá so với 5 khoá *trình bày … gọi* ở `mnd4`, `mnd5`). *kusalavādā …* → *tuyên bố mình là thiện xảo, là hiền trí, …* (`mnd8:13.3`, dùng lại nguyên văn ở `53.7`). *suddhiṁ visuddhiṁ parisuddhiṁ muttiṁ vimuttiṁ parimuttiṁ* → *sự thanh tịnh … sự giải thoát trọn vẹn* (`mnd8:3.2`, `mnd4`, `mnd5`; `cnd11` dùng *sự thanh lọc, sự hoàn toàn thanh sạch*). *niviṭṭhā patiṭṭhitā allīnā upagatā ajjhositā adhimuttā* → *đã an trú, đã đứng vững, đã bám vào, đã đi đến, đã chấp chặt, đã nghiêng hẳn về* (*niviṭṭha* trong tầng: *đắm chìm* 10 khoá, *an trú* 9 khoá; chọn *an trú* theo `snp4.12:15.3`). *tittha* → *chỗ lội qua* (16 khoá so với 3, `mn33`), *titthiya* → *ngoại đạo* (`dn8`, `dn16`, `snp4.12:14.3`). *sakāyana* → *trú xứ riêng* (`snp4.12:15.4`, `16.1`; 0 tiền lệ khác). *atisāradiṭṭhi* → *kiến cực đoan* (`snp4.12:12.1`; 0 tiền lệ khác; lời giải `78.4` *vượt quá nguyên cớ, đặc tướng, căn cứ* phù hợp). *vedagū* → *bậc đạt Vệ-đà* (`snp4.12:13.3`; tầng có *đạt tri thức* 3, *Vệ-đà* 4, *biết rõ* 8, khác 28). *pahassamāno* → *vui đùa* (`snp4.12:10.3`), *dantavidaṁsakaṁ* → *cười phô răng* (`mnd8:40.3`). *pajā* → *dân chúng* (`snp4.12:7.2`; `cnd16:26.2` dịch *đám người*, 1 khoá). *jantu* → *hữu tình* ở kệ (`snp4.12:17.3`, 1 khoá) và danh sách `113.5` theo `cnd16:20.2` (*chúng sinh* 4 khoá); giữ nguyên chữ *jāgu*, *indagu* như `cnd16:20.2` (không có từ Việt). *kappayitvā* → *tạo dựng* (`mnd5` ghi *kappeti* → *tạo dựng*). Bốn chuỗi động từ chỉ mới xuất hiện ở bài này: *vasanti saṁvasanti āvasanti parivasanti* → *an trú, sống chung, cư ngụ, lưu trú* (khác `mnd5:3.3` ở *saṁvasanti*, 0 tiền lệ); *āvaheyya samāvaheyya āhareyya samāhareyya ākaḍḍheyya samākaḍḍheyya* → *mang đến, mang đến hoàn toàn, đem đến, đem đến hoàn toàn, lôi đến, lôi đến hoàn toàn* (0 tiền lệ); *brūmi ācikkhāmi desemi paññapemi paṭṭhapemi vivarāmi vibhajāmi uttānīkaromi pakāsemi* → *nói, giảng giải, thuyết giảng, công bố, xác lập, khai mở, phân tích, làm sáng tỏ, giải thích* (tám mục đầu theo `dn16:3.35.1`, `dn16:3.8.1`; *pakāsemi* 0 tiền lệ); *pajaheyyuṁ vinodeyyuṁ byantiṁ kareyyuṁ anabhāvaṁ gameyyuṁ* → *đoạn bỏ, xua tan, làm chấm dứt, làm cho không còn hiện hữu* (`mnd5:28.4`).

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `dvāsaṭṭhi` = dve 2 + saṭṭhi 60 = 62 → *sáu mươi hai* (10 khoá, đủ 10/10 chỗ Pāli có `dvāsaṭṭhi`: `3.3`, `3.5`, `20.3`, `31.3`, `66.2`, `78.2`, `78.3`, `78.4`, `110.2`, `112.2`, như `mnd5:3.3`, `cnd6:21.2`); `dve` ×8 ở `32.2` → *hai* ×8 (hai người, hai kẻ gây cãi vã, hai kẻ gây tranh chấp, hai kẻ gây cãi nhau, hai kẻ gây tranh luận, hai kẻ gây kiện tụng, hai người tranh biện, hai người đối đáp: 8/8); `aṭṭhaṅgiko` 8 → *Thánh đạo tám chi* (`45.5`, `60.4`) cùng danh sách tám chi `45.6` (8/8); `dvayadhamma` 2 → *pháp hai mặt* ở `58.4`, `61.1`, `61.4`, `63.4`; `dutīya` ở `44.1`, `45.1`, `45.7`, `50.1` → *không có hai* theo `snp4.12:7.1`; `eka` → *một*. Danh sách: *gahetvā … abhinivisitvā* 5 mục / 5 Việt (`3.3`, `3.5`, `4.2`, `10.2`, `20.3`); *vasanti …* 4/4; *hīno … paritto* 6/6 (`6.2`, `11.2`, …); *kusalavādā … ṭhānavādā* 8/8 (`4.3`, `13.2`, `53.7`, `73.2`); *kalahaṁ … medhagaṁ* 5/5; *suddhiṁ … parimuttiṁ* 6/6; *seṭṭha … pavara* 5/5 (`26.3`, `87.2`); *suddhapaññā … pariyodātapaññā* 5/5 (`25.2`, `25.3`); *kusalā paṇḍitā paññavanto iddhimanto ñāṇino vibhāvino medhāvino* 7/7 (`25.5`, `25.7`) và *ahamasmi kusalo paṇḍito paññavā buddhimā ñāṇī vibhāvī medhāvī* 7/7 (`72.3`, `80.2`, `86.1`); *sacco taccho tatho bhūto yāthāvo aviparīto* 6/6 (`12.2`), *idaṁ saccaṁ tacchaṁ …* 6/6 (`38.2`), *tacchaṁ tathaṁ bhūtaṁ yāthāvaṁ aviparītaṁ* 5/5 (`31.3`), *tucchaṁ musā abhūtaṁ alikaṁ ayāthāvaṁ* 5/5 (`39.2`); *kiṅkāraṇā … kiṁpabhavā* 7/7 (`41.2`), *taṅkāraṇā …* 5/5 (`34.2`, `48.2`); *dahati … upaparikkhati* 6/6 (`34.2`, `71.2`, `105.2`); *āvaheyya … abhiniviseyya* 9/9 (`106.3`); *brūmi … pakāsemi* 9/9 (`31.3`); *hitvā … gametvā* 8/8 (`112.3`); *pajānantā … paṭivijjhantā* 5/5 và *pajaheyyuṁ … gameyyuṁ* 4/4 (`46.4`); *anānujānanto … anānumodanto* 5/5 (`17.2`); danh sách *satto … manujo* 10/10 (`113.5`). Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi`; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `23.1`, `24.1`–`24.3`, `29.1` `Sandiṭṭhiyā ceva navīvadātā`: lời giải `24.2` giải *navīvadātā* là *anavīvadātā avodātā apariyodātā saṅkiliṭṭhā saṅkilesikā* (cách đọc phủ định), nên dịch *chưa được làm cho trong sạch*. `snp4.12:4.1` và bản Anh Sujato của `snp4.12` đọc khẳng định (*nhờ kiến riêng mà thanh tịnh*). Hai cách đọc cho nghĩa trái cực tính ở dòng này; dòng 2–4 (*tuệ thanh tịnh, thiện xảo, có suy xét; không ai trong họ thiếu tuệ*) đọc tiếp lời giải thì chưa mạch lạc về lôgic theo cách đọc phủ định. Chọn cách đọc của lời giải vì Pāli root của bài mang chính dạng *navīvadātā* và lời giải là nguồn duy nhất cho nghĩa; ghi để người biên tập quyết; `snp4.12:4.1` (bản Việt đã publish) cần được xem lại cùng chỗ này.
  2. `84.1`–`84.4`, `85.1`–`85.5`, `89.1`–`89.4` `Tumo sahā hoti nihīnapañño`: `snp4.12:13.2` dịch *chính mình cũng thành hạ liệt, thiếu tuệ*, lời giải `85.4` dùng *sopi … sahā hoti* (*chính người ấy cũng …*), bản Anh dịch là người đối nghịch. Giữ nguyên văn `snp4.12` ở dòng kệ và ghi cả hai ở `85.3`, `85.4`; không phân xử chủ thể của *tumo*. Chủ thể của *paro* ở `85.1` (người bị chê) dịch *kẻ khác* theo `snp4.12:2.2`.
  3. `91.2` `aññāya aparaddhā` → *đã lỡ mất vì cái khác*: 0 tiền lệ; có thể là cách thể công cụ giống cái của *añña* (*bởi [đường lối] khác*) hoặc của *aññā* (trí tối hậu); dịch sát chữ, không chọn.
  4. `109.2`, `111.1`–`111.5`, `111.8` *uddhaṁsa* và `uddhaṁ ṭhapetvā`, `aññena uddhaṁ vādena`: lời giải ghi *Uddhaṁso vuccati anāgataṁ* nên dịch *về sau*; *uddhaṁ* ở `111.3`, `111.5` dịch *lên trên* / *ở bên trên*, nghĩa này chưa chắc (có thể cũng là *về sau*). `snp4.12:17.2` dịch *ngày càng nhiều*. 0 tiền lệ.
  5. `25.5`, `25.7` *iddhimanto* → *có thần lực* (dịch sát chữ): `cnd13:16.2`, `cnd9:11.3` ở cùng chuỗi có *buddhimā* → *sáng suốt*, và `72.3`, `80.2`, `86.1` cũng là *buddhimā*; *iddhimanto* có thể là dị bản của *buddhimanto*. Không sửa theo dự đoán.
  6. `7.1`, `14.1`, `42.1`, `56.1` *so nimmito* → *vị được hóa hiện ấy*: 0 tiền lệ (`dn18:21.5` *nimmitā* → *hóa thân*, `dn1`, `dn24` *tạo ra*). Pāli chỉ nói *người được tạo/hóa ra*; ai là người ấy không được nêu trong bài.
  7. `17.2` *anānupassanto*, *anānumananto*, *anānumaññanto*, *anānumodanto* → *không nhìn nhận, không đồng tình, không công nhận, không tán đồng*: sắc thái của bốn động từ gần nhau; tiền lệ `mn59:5.4`, `sn36.19:5.11` dịch *công nhận, chấp nhận, tán đồng*.
  8. `60.1`, `58.2` *aññatra saññāya niccāni / niccaggāhā*: dòng kệ giữ nguyên văn `snp4.12:9.2` (*vốn thường hằng ở đời ngoài tưởng*); lời giải dịch *ngoài sự chấp là thường hằng do tưởng, ở đời chỉ có một chân thật duy nhất được thuyết …*. Phạm vi của *aññatra* chưa chắc.
  9. `70.4`, `74.4`, `74.5` *tadeva pāva(dati)*: dịch *chính điều ấy nó tuyên nói* theo lời giải; `snp4.12:11.4` đọc *pāva* thành *ác* (như *pāpa*). Cần người biên tập quyết.
  10. `53.1`–`53.3`, `53.8`, `51.2`, `57.2` *pavādiyāse* → *những kẻ thuyết giảng* (`snp4.12:8.2`); lời giải `53.2` giải bằng *vippavadanti* (*họ bất đồng nhau*), dịch sát chữ.
  11. `72.2` *Ātumāno vuccati attā* → *Mình được gọi là tự thân* (*ātumāna* → *mình*, theo `snp4.12:11.2`; *attā* → *tự thân* theo `mnd5:10.3`); chữ *ātumāna* 0 tiền lệ.
  12. `32.3` *te aññamaññaṁ bālo hīno … parittoti, evamāhaṁsu* → *Họ gọi nhau là kẻ ngu, … : họ đã nói như vậy …*: chữ *gọi* không có trong Pāli, thêm để nối *aññamaññaṁ* với danh sách tính từ (nghĩa: *đối với nhau, [họ nói] kẻ ngu …*).
  13. `92.2`, `99.2` *Titthaṁ vuccati diṭṭhigataṁ* → *Chỗ lội qua được gọi là kiến chấp* theo nghĩa đen của *tittha* ở tầng (`mn33`); sợi dây ngữ nguyên với *titthiya* (*ngoại đạo*) bị mất trong tiếng Việt.
  14. `4.2`, `41.2`, `48.2`, `52.2`, `54.1`, `59.1` *aññoññaṁ*/*puthu*/*vividhaṁ* → *mỗi người một khác*, *nhiều cách/nhiều loại*, *muôn vẻ*: 0 tiền lệ cho chuỗi này; `mnd8:2.4` dịch *puthū* là *đông đảo*.
  15. `66.3`, `110.3`, `112.3` *Diṭṭhivinicchaye / Diṭṭhivinicchayā sabbe vinicchaye*: dịch *phán quyết về kiến* và *các phán quyết về kiến … mọi phán quyết*; Pāli lặp *vinicchaya* hai lần ở `112.3`.
  16. `65.2` các chữ *diṭṭhasuddhi, sutasuddhi, sīlasuddhi, vatasuddhi, mutasuddhi* → *sự thanh tịnh nhờ thấy / nghe / giới luật / khổ hạnh / điều được nhận thức* (`cnd11` dịch *sự thanh tịnh nhờ thấy*, *sự thanh tịnh nhờ nghe*).
  17. Lỗi ngoài lát, báo chứ không sửa: `snp4.12:1.2`, `2.1`, `6.3` dịch *viggayha* → *tranh chấp* (xem trên); `snp4.12:4.1` (bất định 1); `snp4.12:11.4` *pāva* → *ác* (bất định 9); `snp4.12:13.2` (bất định 2); `snp4.12:17.2` *uddhaṁsa*; `snp4.12:15.4`, `16.1` *sakāyane* → *trú xứ riêng* (nghĩa đen là *đường đi/lối đi riêng*, chưa phân xử); `snp4.12:10.1`–`10.2` tách *diṭṭhe sute sīlavate mute vā* thành *Nương tựa điều đã thấy, … giới cấm, điều đã tưởng* trong khi `snp4.5:2.2`, `snp4.4:3.2`, `mnd5:9.2`, `mnd4:16.2` dịch khác (6 nơi so với 1).

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (435/435, cùng thứ tự); nháy kép `“”` khớp Pāli từng khoá (0/435 lệch; 0 nháy đơn, 0 ngoặc đơn, 0 nháy thẳng, 0 thẻ HTML); dấu lược `…` khớp Pāli từng khoá (0/435 lệch; 14 khoá có `…`); 0 khoá rỗng; NFC; không khoảng trắng thừa; Pāli lọt sang Việt: chỉ có hai chữ *jāgu*, *indagu* ở `113.5` (giữ nguyên như `cnd16:20.2`, không có từ Việt tương đương).

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dịch của dự án; so 198 khoá chênh lệch lớn nhất (138 dòng Pāli khác nhau; đa số là các khổ kệ và lời giải lặp) → khác nghĩa 8 khoá (một lỗi): sửa 13 (8 khoá khác nghĩa, 5 khoá thuật ngữ), giữ các khoá còn lại, bất định 5. Sửa: `tathā samattā` ở 23.4, 27.1, 27.3, 29.4 (“vì kiến của họ cũng như vậy” → “vì kiến của họ cũng trọn vẹn như vậy”) và 77.4, 81.1, 81.3, 83.4 (“vì kiến của vị ấy là như vậy” → “vì kiến ấy của vị ấy trọn vẹn như vậy”): bản cũ bỏ mất `samattā`, trong khi lời giải 27.2 và 81.2 giải chính chữ ấy bằng “đã trọn vẹn, đã được thọ trì, …” (bản mù có “được thọ trì đầy đủ”). Cùng đợt rà nội bộ (không do bản mù phát hiện): `samatto` ở 77.1, 78.1, 78.8, 78.10, 83.1 “toàn vẹn” → “trọn vẹn”, vì ở 78.9 chính lời giải dịch `samatto` là “trọn vẹn”, và ở 2.4, 6.2, 91.2 “toàn vẹn” là `akevalī` còn “trọn vẹn” là `asamatto/samatta`. Giữ vì bản mù khác diễn đạt hoặc sai: 12.1 (`sacco nu vādo`), 25.7 (`mutīmā`, “có suy xét”), 46.3 (`pajā`, “dân chúng”), 53.2, 66.5, 77.3 (`abhisitto`, “làm lễ quán đảnh”), 92.2 (`tittha`), 113.1. Cả hai bản cùng đọc phủ định `navīvadātā` ở 23.1, 24.2 (theo lời giải; bản mù cũng ghi không chắc) và cùng dịch `iddhimanto` là “có thần lực/thần thông”. Bất định (c), vẫn còn: `sakāyane` (bản dự án “trú xứ riêng”, bản mù “con đường riêng”; lời giải 100.2 `Dhammo sakāyanaṁ, diṭṭhi sakāyanaṁ, paṭipadā sakāyanaṁ, maggo sakāyanaṁ` không phân xử được giữa “lối đi” và “chốn nương”), `pavādiyāse` (bản dự án “thuyết giảng”, bản mù “tranh biện”; lời giải 53.2 `vippavadantītipi` nghiêng về “tranh biện”, giữ theo `snp4.12:8.2` đã publish, người biên tập quyết), `tumo sahā` (84.2, 85.3–85.5, 89.2: chủ thể “chính mình” chưa phân xử), `aññatra saññāya niccāni` (58.2, 60.1) và `uddhaṁsa` (109.2, 111.1–111.8). Lỗi ngoài lát, báo chứ không sửa: `snp4.12:4.4` và `snp4.12:12.4` cũng bỏ `samattā`; `snp4.12:12.1` dịch `samatto` là “toàn vẹn”. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bài, đoạn song song `snp4.12`, `snp4.13`, `cnd12`, `cnd21`): sửa 4 khoá. (1) `59.1` `na heva saccāni bahukāni nānāni vividhāni aññoññāni puthūni`: trước *các chân thật không nhiều, khác nhau, muôn vẻ …* (phủ định chỉ phủ lên *nhiều*, đọc thành "không nhiều nhưng khác nhau") → *không phải là nhiều, không phải là khác nhau, không phải là muôn vẻ, không phải là mỗi cái một khác, không phải là nhiều loại*; `na heva` phủ định cả chuỗi tính từ, khớp tiêu đề kệ `58.1`, `59.2` và lời giải `60.1` (chỉ có một chân thật). (2) `31.3` chuỗi `brūmi ācikkhāmi desemi paññapemi paṭṭhapemi vivarāmi vibhajāmi uttānīkaromi pakāsemi`: trước ánh xạ trôi (*giảng giải, thuyết giảng, công bố, xác lập, khai mở, … giải thích*, `pakāsemi` thành *giải thích*) → *Ta nói, Ta giải thích, Ta giảng dạy, Ta trình bày, Ta an lập, Ta khai thị, Ta phân tích, Ta làm cho hiển lộ, Ta công bố* theo `mnd11:75.3`, `cnd5:20.1`, `cnd7:48.3`, `mnd7:6.2`. (3) `46.4` `pajānantā` *liễu tri* → *biết rõ* (*liễu tri* là `pariññā`, có chuỗi riêng ở `mnd11:59.14`). (4) `113.5` `satto` *hữu tình* → *chúng sinh*, vì từ khoá `jantu` đã là *hữu tình* và danh sách đồng nghĩa dùng *chúng sinh* (`mnd11:45.20`, `113.3`). Giữ: `16.1`–`16.2`/`18.1` *khiến thành kẻ ngu* (lời giải `18.2` `paro bālo hoti` xác nhận chủ thể là người kia); `23.1` *chưa được làm cho trong sạch* theo lời giải `24.2` `anavīvadātā` (snp4.12:4.1 dịch ngược lại, chưa phân xử); `112.1`/`112.4` *nhưng hữu tình nào* theo `snp4.12:17.3`. Bất định ghi sẵn (`tumo sahā`, `aññatra saññāya niccāni`, `uddhaṁsa`) giữ nguyên. Báo ngoài lô: `snp4.12:11.4` dịch `pāva` thành *là ác* trong khi lời giải `74.4` giải là `pāvadati` (tuyên nói); `snp4.12:17.2` *ngày càng nhiều* cho `uddhaṁsa` trái lời giải `111.2` (*anāgataṁ*). Đã đối chiếu hệ thống đoạn song song; không có bản Anh, không có bản Việt nguyên bài độc lập.

  Quyết định hội đồng biên tập 2026-10-16: B11 — `64.1`, `65.1`, `65.2`, `65.3`, `65.7`, `69.1` (`muta` = “cảm nhận”); B12 — `64.1`, `65.1`, `65.2`, `65.3`, `65.7`, `69.1` (`vata`/`sīlabbata` bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”).

  Nghiên cứu nguồn ngoài 2026-10-16: bản Việt song ngữ Pāli–Việt của Tỳ khưu Indacanda,
  Mahāniddesapāḷi - Đại Diễn Giải (Tam Tạng Song Ngữ Pāli–Việt, Sri Lanka 2018),
  https://tamtangpaliviet.net/TTPV/35_Nidd_I.pdf (Đại Diễn Giải, tập 35); đã tải toàn văn và đối chiếu
  phần tương ứng; nguồn độc lập với dự án, giấy phép không khai (NOASSERTION), chỉ dùng làm bằng chứng
  nghĩa, không chép. Đã đối chiếu: căn chỉnh theo đoạn 116 nhóm đoạn của bài với Indacanda (85 nhóm
  khớp từ vựng và không lệch phủ định hay số đếm, 18 nhóm trùng chữ với nhóm đã so ở bài khác, 13 nhóm
  bị cờ; nhóm bị cờ mới quét theo danh sách cờ, chưa đọc từng nhóm); đọc từng nhóm kệ trích (17 nhóm)
  cạnh Indacanda và Sujato; so 32 mục từ đầu đoạn với mục từ của Indacanda; kệ trích còn so với Sujato
  snp4.12 (174 khoá có Pāli trùng chữ với kho `snp`, 138 khoá có Việt trùng chữ, 36 khoá khác, đã xem
  mẫu: phần lớn do ngắt dòng, chấm câu hoặc do Niddesa tự đọc kệ khác Sujato). Phần lời giải Niddesa
  chỉ có Indacanda làm nguồn độc lập (Sujato không có bài này); phần kệ trích có thêm Sujato. Sửa:
