notes: |-
  Bài thi-ap28 — Therīapadāna, Phẩm Kuṇḍalakesī, ký sự thứ tám: Yasodharā (Bimbādevī), ở tuổi bảy mươi tám, xin Đức Phật cho nhập diệt ngay đêm ấy, được dặn thị hiện thần thông, kể lại những việc đã làm vì Ngài từ thời Đức Phật Dīpaṅkara (làm Sumittā dâng hoa cho đạo sĩ Sumedha), rồi tuyên bố các quả vị. 393/393 khoá (100 nhóm khoá kể cả đầu đề), thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào ngoài tập Pāli. Bài là bản dài của cùng một nhân vật với thi-ap29 và thi-ap30, nên nhiều khoá Pāli trùng thi-ap30 và được dùng lại.

  TÊN PHẨM, TIÊU ĐỀ — đo trước khi chốt, ghi cả hai số:
  - `:0.1` Therīapadāna giữ nguyên Pāli (như các tệp thi-ap đã dịch).
  - `:0.2` Kuṇḍalakesīvagga → Phẩm Kuṇḍalakesī (thi-ap21 đến thi-ap30 cùng dạng).
  - `:0.3` Pāli là `Yasodharātherīapadāna`, không bắt đầu bằng số, nên bản Việt không có số thứ tự và `translationTitle` bằng đúng giá trị `:0.3`. Đo ở thi-ap (main): Pāli `:0.3` bắt đầu bằng số thì giữ số 12 tệp / bỏ số 6 tệp; không tệp nào thêm số ở chỗ Pāli không có (THỪA 0). Số thứ tự thứ tám vẫn còn ở khoá cuối (`:100.1`).
  - Từ chỉ thể loại `apadāna`: theo yêu cầu của người điều phối, chọn theo đa số của phẩm trong main. Đo ở thi-ap main: `Tuyên Ngợ` 34 / `Tuyên Ngôn` 2; ở riêng phẩm Kuṇḍalakesī (thi-ap21 đến thi-ap30): `Tuyên Ngợ` 7 / `Tuyên Ngôn` 2 (hai tệp Tuyên Ngôn là thi-ap29 và thi-ap30, cùng nhân vật Yasodharā). Bài này dùng `Tuyên Ngợ` theo đa số của phẩm, dù đó là dạng sai chính tả của `Tuyên Ngôn` và khác thi-ap29, thi-ap30; ở tha-ap `Tuyên Ngợ` 255 / `Ký Sự` 155 / `Tuyên Ngôn` 142 / `Kinh Kệ` 5. Người biên tập cần phán một lượt cho cả cuốn rồi sửa hàng loạt; khi sửa, đổi `:0.3` và `:100.1` cùng `translationTitle`.
  - `therī` ở `:0.3` và `:100.1` → Trưởng Lão Ni (thi-ap main: Trưởng Lão Ni 33 / Tỳ-kheo-ni 3). `bhikkhunī` ở `:99.1` → Tỳ-kheo-ni, công thức kết như thi-ap33: Tôi nghe như vầy: Tỳ-kheo-ni … đã nói những bài kệ này trước mặt Đức Thế Tôn. Công thức `abhāsitthāti` toàn tầng: những bài kệ 591 / bài kệ này 18 (số ít, không dùng).

  SỐ PĀLI — tự tính, in phép:
  - `aṭṭhasattativassāhaṁ` (8.1) = aṭṭha 8 + sattati 70 = 78 → bảy mươi tám tuổi.
  - `satasahassa` = sata 100 × sahassa 1.000 = 100.000 (18.1, 20.1, 48.1, 81.1, 84.1) → một trăm ngàn. `navutīnaṁ chaduttari` (18.2) = navuti 90 + cha 6 = 96 (xem bất định số 1 về đơn vị). `caturo asaṅkhiye` (48.2) = bốn → bốn kiếp vô lượng.
  - `aṭṭha uppalahatthāni` (52.1) = 8; lời nguyện 56.1–56.2 `pañca` 5 và `tayo` 3: 5 + 3 = 8, khớp. `hattha` dịch bó (tha-ap128:3.1 `pañca uppalahatthāni` → năm bó hoa sen xanh).
  - `koṭisata` = một trăm koṭi (tiền lệ: bv7:5.3 `koṭisataṁ` → một trăm koṭi; bv10:4.2 và tha-ap52:11.4 `koṭisata-` → một trăm koṭi; bv13:8.4 `satakoṭiyo` → một trăm koṭi), nên `Pañcakoṭisatā` (72.1) = 5 × 100 = 500 koṭi; `navakoṭisatāni` (72.2) = 9 × 100 = 900 koṭi; `Ekādasakoṭisatā` (73.3) = 11 × 100 = 1.100 koṭi; `dvādasa koṭiyo` (73.4) = 12 koṭi (không phải koṭisata); `Vīsakoṭisatā` (75.1) = 20 × 100 = 2.000; `tiṁsakoṭisatāni` (75.2) = 30 × 100 = 3.000 (tiṁsa = 30, không phải 3); `Cattālīsakoṭisatā` (76.3) = 40 × 100 = 4.000; `paññāsa koṭisatāni` (76.4) = 50 × 100 = 5.000; `Saṭṭhikoṭisatā` (78.1) = 60 × 100 = 6.000; `sattatikoṭisatāni` (78.2) = 70 × 100 = 7.000; `Asītikoṭisatā` (79.3) = 80 × 100 = 8.000; `navutikoṭisatāni` (79.4) = 90 × 100 = 9.000; `Pañcāsītikoṭisatā` (84.3) = 85 × 100 = 8.500 koṭi; `sattatiṁsā ca koṭiyo` (84.4) = satta 7 + tiṁsā 30 = 37 koṭi (tiền lệ tha-ap252:9.5 `Sattatiṁsati gāthāyo` → ba mươi bảy). `Koṭisatasahassa` (81.1, 84.1) = 100 × 1.000 = 100.000 koṭi (một trăm ngàn koṭi: bv16:3.3, bv6:7.4, tha-ap82:15.1, bv5:9.1, bv17:6.3; riêng pv38:40.1 viết hàng trăm ngàn koṭi, 1 tiền lệ khác). `Navakoṭisahassāni` (82.3) = 9 × 1.000 = 9.000 koṭi. `pañcāsītimahesinaṁ` (84.2) = tám mươi lăm vị Đại Ẩn Sĩ.
  - `Nekakoṭisahassāni` (35.1–38.1) giữ đúng chữ nhiều ngàn koṭi, không thêm đơn vị (như thi-ap30:23.1 đến 26.1; 4 tiền lệ).
  - `sahassalokadhātu` (27.3) = một ngàn thế giới. `sahassaparivārena` (90.3) = một ngàn tùy tùng (2 tiền lệ). `aḍḍhamāse` (91.3) = nửa tháng. `catusacca` (91.4) = bốn chân lý. `paṭisambhidā catasso` (95.1) = bốn vô ngại giải.
  - Bài không chứa `Tiṁsakappasahassa`.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò toàn tầng (thi-ap, tha-ap và các bộ kn khác đã dịch):
  - Trong 390 khoá (trừ 3 khoá đầu đề `:0.1`–`:0.3`), 177 khoá có Pāli trùng khoá khác ở bài khác (bỏ dấu câu, chữ hoa khi so). 141/177 dùng lại nguyên văn; 36 khác có chủ ý:
    - 21 khoá khác chủ yếu ở đại từ ngôi thứ nhất (kèm vài chữ đi cùng): tiền lệ viết con (thi-ap19, thi-ap20, thi-ap39, thi-ap40) hoặc ta (thi-ap21 đến thi-ap27, thi-ap33 đến thi-ap38, tha-ap) còn bài này viết tôi, theo thi-ap29 và thi-ap30 (cùng nhân vật Yasodharā, cùng phẩm) vì cả bài là lời nói thẳng với Đức Phật có hô cách bạch. Đo ở khoá `Pubbenivāsaṁ jānāmi` trong thi-ap: ta 10 / con 4 / tôi 1 (thi-ap30); riêng phẩm Kuṇḍalakesī thi-ap21 đến thi-ap27 toàn ta, còn hai bài anh em thi-ap29, thi-ap30 viết tôi / chúng tôi. Hai phạm vi cho hai đa số khác nhau; chọn theo bài anh em gần nhất. Gồm 8.4, 13.3, 29.1, 29.4, 32.3, 33.1, 33.4, 47.1, 66.2, 67.4, 72.4 và các khoá `mahādānaṁ pavattayiṁ` (74.2, 75.4, 77.2, 78.4, 80.2, 81.4, 83.2, 85.2), 91.4, 93.1.
    - Còn lại 15 khoá khác vì lý do riêng:
    - 7.2 `sambuddhaṁ upasaṅkami` → đã đến gần Đức Chánh Đẳng Giác (2 tiền lệ bv viết bậc Chánh Đẳng Giác; chọn Đức cho khớp 7.3, tiền lệ 14 khoá Đức Chánh Đẳng Giác, và thi-ap30:1.4).
    - 15.1 `Iddhiñcāpi nidassehi` → Hãy thị hiện (thi-ap19:5.1 viết Hãy trình bày, 1/1) để khớp 22.2 `iddhiṁ dassesi` và thi-ap30:5.1.
    - 18.4 `pāmokkhā sabbā issarā` → số ít (tôi là người đứng đầu, là vị chủ quản của tất cả); thi-ap30:7.4 viết số nhiều đều là những người đứng đầu, những vị chủ quản vì chủ ngữ ở đó là mayaṁ.
    - 25.4 `vandantī lokanāyakaṁ` → vị ấy (số ít); thi-ap30:14.4 viết các vị.
    - 27.2, 28.4, 98.4 `pāde vandāmi cakkhuma` → tôi đảnh lễ chân Ngài, bạch bậc Có Mắt (như thi-ap30:16.2 và 59.4); thi-ap9, thi-ap15, thi-ap19 viết con xin đảnh lễ dưới chân Ngài, bậc Có Mắt (4 tiền lệ).
    - 10.4 `pāpuṇissāmi nibbutiṁ` → sự tịch diệt (tha-ap532:42.4 viết sự tịch tịnh, 1/1; ở thi-ap `nibbuti` → tịch diệt 3/3: thi-ap29, thi-ap31, thi-ap32).
    - 28.1 thêm Và theo `ca`; 52.2 `pūjanatthāya satthuno` → bậc Đạo Sư (thi-ap27:11.2 viết bậc Thầy, 1/1; `satthuno` ở tầng: bậc Đạo Sư 11 so với chữ khác ít); 62.3 `Tassa dhammesu dāyādā` → Người kế thừa giáo pháp của vị ấy (8 tiền lệ viết của Ngài, 1 tiền lệ thi-ap32:26.3 viết của vị ấy; ở đây `tassa` là Phật tương lai trong lời thọ ký ngôi ba nên không dùng Ngài); 64.4 dấu nháy theo Pāli; 81.1 và 84.1 `Koṭisatasahassāni` → Một trăm ngàn koṭi (xem trên); 87.1 `Khīṇāsavā vītamalā` → Các bậc (bv3:11.3 viết những bậc).
  - Trong chính bài có 21 nhóm Pāli trùng nguyên văn (86 khoá, bỏ dấu câu và chữ hoa đầu dòng khi so): 16 nhóm lặp y nguyên bản Việt; 5 nhóm chỉ khác dấu câu cuối khoá theo Pāli (27.2·28.4·98.4 `”;` so với `.` so với `”.`; 35.4·36.4·37.4·39.4·44.4·47.2 `.` so với `;`; 72.4 và 8 khoá `mahādānaṁ pavattayiṁ` khác; 73.2 và 10 khoá `dhammarāja suṇohi me` khác, đều `;` so với `.`); không có nhóm nào khác nghĩa.
  - Lỗi bản nháp đã bắt: 4.4 ban đầu để trống động từ, đã thêm sẽ vì 5.1 `Gamissāmī` là động từ chung của cả câu; 54.1–54.2 ban đầu viết đảo ý (tôi đã thấy của vị ẩn sĩ), đổi thành tôi đã thấy nơi vị ẩn sĩ; 7.5 và 32.3 sai chữ hoa đầu dòng so với Pāli, đã sửa; 38.3 `karissanti` là ngôi ba số nhiều (họ), ban đầu viết nhầm ngôi thứ nhất.

  THUẬT NGỮ — kèm số đếm (toàn tầng kn đã dịch / riêng thi-ap):
  - `lokanāyaka` → bậc Dẫn Đạo Thế Gian (Dẫn Đạo 182 / Lãnh Đạo 17 / Dẫn Dắt 8; thi-ap 19 / 0 / 0). `lokanātha` → bậc Bảo Hộ Thế Gian (Bảo Hộ 29 / Lãnh Đạo 20; thi-ap 4 / 1), như thi-ap30. `lokagganāyaka` → bậc Dẫn Đạo tối thượng của thế gian (Dẫn Đạo tối thượng 15 / Đạo Sư tối thượng 6 / Lãnh Đạo tối thượng 6; bv19, bv22, tha-ap415 cùng dạng).
  - `mahāvīra` → bậc Đại Anh Hùng (148 / 20; thi-ap 41 / 0), `mahāmuni` → bậc Đại Mâu-ni, `munindo` → bậc Chúa Mâu-ni (1 tiền lệ tha-ap537:22.1), `munirāja` → vị Vua của các bậc Mâu-ni (0 tiền lệ). `cakkhumā` → bậc Có Mắt (102 / Hữu Nhãn 17; thi-ap 7 / 2). `dhammarāja` → bậc Pháp Vương (Pháp Vương 15 / vua Chánh pháp 7 / Vua Pháp 2). `mahesi`, `mahāisi` → Đại Ẩn Sĩ.
  - `adhikāra` → việc phụng sự (28 / 1; thi-ap 4). `devadeva` → bậc Thiên Trung Thiên (0 tiền lệ trong tầng; dạng Hán–Việt quen thuộc, chọn thay cho cụm dài thần của các thần). `bhikkhunupassaya` → trú xứ của các tỳ-kheo-ni (tha-ap537:22.4; thi-ap26:15.2 viết chỗ trú ngụ). `mahādāna … pavattayiṁ` → thực hành đại thí (bv23:12.1 `Mahādānaṁ pavattetvā` → thực hành đại thí). `nibbinditvāna` → chán ngấy (thi-ap31:8.1, thi-ap33:13.1 chán ngấy 2/2; thig16.1 nhàm chán). `akiñcana` → không sở hữu gì (cnd13: 4 khoá không sở hữu gì; ja330:2.4 viết không giữ vật gì). `āyusaṅkhāra` → thọ hành (0 tiền lệ khớp; tha-ap119:1.2 dịch khác).
  - `punabbhavo` → tái sinh ở 30.4: toàn tầng tái sinh ≥ 30 / tái sanh 17, nhưng riêng thi-ap tái sanh 14 / tái sinh 3 (thi-ap19, thi-ap30, thi-ap6). Hai phạm vi cho hai đa số khác nhau; chọn tái sinh theo thi-ap30 (cùng nhân vật) và đa số toàn tầng.
  - `Nibbāna` → Niết-bàn (479 khoá có Pāli nibbāna dùng Niết-bàn). `asaṅkhata` → vô vi (26). `Sākiya` → Sakya (5 / Thích-ca 1; thi-ap 3 / 1).
  - Tên riêng giữ Pāli: Yasodharā, Suddhodana, Gotamī Pajāpatī, Rājagaha, Kuru, Jambudīpa, Cakkavāḷa, Meru, Sakka, Nandana, Brahmadeva, Gotama, Dīpaṅkara, Sumedha, Sumittā; `koṭi`.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  1. 18.1–18.2 `Thīnaṁ satasahassānaṁ, navutīnaṁ chaduttari`: theo đúng quyết định ở thi-ap30:7.1–7.2 (hai khoá Pāli trùng nhau), bản Việt giữ đúng chữ một trăm ngàn phụ nữ và chín mươi sáu nữa, không thêm đơn vị ngàn. Đọc sát chữ là 100.096; cách đọc khác là 196.000 (bản nguyên bài của Bhikkhu Indacanda ở mục Tra cứu toàn văn của trang). Chưa phân xử; thi-ap30 và bài này cần cùng một quyết định khi người biên tập phán.
  2. 86.2 `aṭṭhaṭṭhamakakoṭiyo`: hapax toàn Pāli root (không có trong tầng nào khác). Bản Việt viết tám–tám koṭi để không gán số; cách đọc có thể là 8 × 8 = 64 koṭi, hoặc khác. Không phân xử được bằng Pāli đã ghim.
  3. 72–85 cách đọc `koṭisata`: quy theo tiền lệ là một trăm koṭi và tính ra 500, 900, 1.100, 2.000 … 9.000 koṭi; nếu `koṭisata` có nghĩa khác (ví dụ koṭi và sata cộng lại) thì mọi số trong 72–84 đổi theo. 73.4 `buddhā dvādasa koṭiyo` đặt sau số 1.100 koṭi không có động từ riêng; bản Việt đặt hai vế song song (một ngàn một trăm koṭi, chư Phật, mười hai koṭi), không gán quan hệ.
  4. 53.1–53.2 `Cirānugataṁ dayitaṁ, atikkantaṁ manoharaṁ`: đọc `cira` là lâu, `anugata` là đã đi theo, nên đồng hành từ lâu; `atikkanta` là vượt trội. Cách đọc khác (bản BJT ở mục Tra cứu toàn văn): `cīra` là y vỏ cây, `atikkanta` là rất đáng yêu (ati + kanta). Không phân xử.
  5. 8.3 `Pabbhāramhi anuppattā` và 1.3 `Pabbhāramhi varekamhi`: cả hai dịch sườn núi (chỗ Đức Phật ngự); ở 8.3 cũng có thể hiểu `pabbhāra` là chặng dốc của tuổi đời (bản Indacanda: sườn dốc, cùng 8.2).
  6. 10.2 `maraṇaṁ uparuddhati`: bản Việt cái chết đang ngăn chặn, không nêu bị ngăn chặn cái gì (Indacanda: ngăn tuổi thọ). 9.3 `Pahāya vo`: `vo` số nhiều, dịch các Ngài (có thể chỉ riêng Đức Phật hoặc cả hội chúng).
  7. 12.3 `Aparādhamajānantī` (giống cái số ít): hiểu chủ ngữ là Yasodharā (tôi không biết lỗi), theo thi-ap30:4.3; vì `parisā` ở 12.1 cũng là giống cái số ít nên cách hiểu chủ ngữ là các hội chúng cũng có thể. 12.4 `khamantaṁ` đọc là mệnh lệnh ngôi ba số nhiều (xin họ tha thứ).
  8. 19.4 `devatā viya mānusā`: đọc `viya` là so sánh (như loài người kính chư thiên) theo thi-ap30:8.4; cách đọc khác là chư thiên và loài người cùng kính.
  9. 20.1 `Kaññāsatasahassapamukhā`: đọc là đứng đầu một trăm ngàn thiếu nữ (khớp 18.4 `pāmokkhā`); cách đọc khác là do một trăm ngàn thiếu nữ dẫn đầu (như `Yasodharāpamukhāni` ở thi-ap30). 23–26 hình ảnh thân vũ trụ: `kuru` (23.2) là tên xứ Kuru hay dạng động từ, `dakkhiṇa` (24.1) là phương nam hay bên phải, `bījamānā` (25.3) không nói quạt bằng gì; theo thi-ap30:12–15, không gán thêm.
  10. 32.2 `saṅgamaṁ te nidassitaṁ` dùng lại thi-ap19:20.2 (đã được chỉ ra cho Ngài); `te` cũng có thể là do Ngài. 46.4 `saṅgamaṁ te bahuṁ mayā`: `te` là các vị ấy hay là Ngài (thi-ap30:34.4 có `tehi`); bản Việt theo thi-ap30. 46.1–46.2 `Brahmadeva` là một người hay danh hiệu của Gotama: để mở, như thi-ap30.
  11. 38.3–38.4 `Bhayamokkhaṁ karissanti, dadāmi mama jīvitaṁ`: `karissanti` ngôi ba số nhiều, không nêu chủ ngữ (họ, tức những người được lợi); bản Indacanda đọc ngôi thứ nhất. 39.3 `Itthimaṇḍe` khác `Itthibhaṇḍe` ở thi-ap30:27.3; dịch theo `maṇḍa` (trang điểm), có thể là biến thể chép tay.
  12. 42.1–42.2: Pāli không có `ti` nên bản Việt không đóng nháy; lời nói là của Ngài (nhân vật Bodhisatta) nên bỏ chủ ngữ (sẽ bố thí cho những người cầu xin).
  13. 60.1 và 65.1 `Aparimeyye ito kappe`: hai khoá đi với động từ quá khứ (`viyākāsi`, `viyākarī`, `bhaviṁ`), nên đọc `ito kappe` theo thành ngữ lùi (vô lượng kiếp trước, như thi-ap30:44.1 và 8 tiền lệ); bài không có mệnh đề tương lai đi kèm `kappe`, nên không dùng dạng sau … kiếp nữa (4 tiền lệ tha-ap4, tha-ap44, tha-ap481, tha-ap491 chỉ nằm trong lời tiên báo tương lai có `bhavissati`). Lời thọ ký 61–64 (`bhavissati`, `hessati`, `anurakkhissate`, `pūrayissati`, `pāpuṇissati`) dịch tương lai. 60.4 `ujubhāvaṁ mahāmuni` đọc `mahāmuni` là hô cách (bạch bậc Đại Mâu-ni), có thể là đồng vị với Dīpaṅkara.
  14. 61–64 lời thọ ký của Dīpaṅkara nói với Sumedha: dùng ngươi (tiền lệ Đức Phật nói với người thường: thi-ap20:8.4, thi-ap23:10.4, thi-ap24:13.2 đều viết ngươi); chủ ngữ ngôi ba là Sumittā, không nêu trong Pāli ở 61.1 nên dùng người này theo `ayaṁ` ở 63.4. 64.1 `Tassa te anukampantī`: `tassa te` khó khớp; dịch vì thương xót ngươi. 56.3 `Tena saddhiṁ samā hontu`: chủ ngữ số nhiều không rõ (các bó hoa, hay phước của hai người); dịch giữ mơ hồ.
  15. 70.1–70.4 `Vuttañhetaṁ bhagavatā … vīra` người nói là Đức Phật tương lai hay Đức Phật hiện tại: theo thi-ap30:49. 97.1–97.3 `yā dadāti … honti`: số ít rồi số nhiều, dịch số nhiều chung (những người nữ nào … họ). 18.3 `jānāmi` chủ ngữ số ít xuyên suốt, dùng tôi.
  16. Các chỗ nhỏ: 3.3 `abhiññātā` dịch lừng danh (không phải thắng trí như bản Indacanda); 4.1 `gatāva` bỏ `va`; 5.3 `āyusaṅkhāra` dịch thọ hành; 17.4 `itthiaṅge` dịch thân nữ; 63.1 `bhaṇḍasāmugga` dịch kho tài vật và thêm có người gìn giữ cho `anurakkhati` thiếu chủ ngữ.

