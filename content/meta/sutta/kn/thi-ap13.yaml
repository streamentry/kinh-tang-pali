notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ `thi-ap`.
  Đại từ ngôi thứ nhất dùng con, khớp cả ba bài tỳ-kheo-ní đã có: thi-ap2/3/4.
  5.1-5.3, 6.1-6.3, 7.1-7.3 trùng Pāli thi-ap2:4-6 nên dùng lại nguyên văn.
  Tiền lệ đếm được: Therīapadāna giữ Pāli (thi-ap2/3/4); `Sumedhāvagga` → Phẩm
  Sumedhā nên `Ekūposathikavagga` → Phẩm Ekūposathika; tầng giữ Uposatha không
  dịch (Uposatha 15 chỗ, Trai Đàn 0) nên giữ Pāli; `Bandhumatiyā` → Bandhumatī
  (41 khoá, viết có dấu như dn14/tha-ap234); `kumbhadāsiyāpi` → nữ tỳ đội ghè nước
  (dn8, 3 chỗ); `santacitta` → tâm tịch tịnh (iti89, ud4.10); `samāhita` → tâm có
  định (dn2, dn10, mn108); `sumanā` → hoan hỷ (ja355, kp6, snp2.1); `pasannacitta` →
  tâm thanh tịnh (dn14, dn16); `santacittaṁ samāhitaṁ` ghép hai tiền lệ trên.
  `Tena kammena sukatena` → Nhờ nghiệp lành khéo làm ấy (tha-ap426, tha-ap494);
  `cetanāpaṇidhīhi ca` → cùng với tâm nguyện và chí hướng (tha-ap426, tha-ap494);
  `ekānavuti kappa` → chín mươi mốt kiếp (dn14:1.4.1 và tha-ap437:3.1) — đây là
  tiền lệ quyết định 3.3, vì 91 là cách đếm của Theravāda chứ không phải 100;
  `acala` → bất động (ud8.10).
  0 tiền lệ, đã ghi lý do: `modaka` → bánh ngọt (3 chỗ trong tầng, không có `kẹo`);
  `nagara` → thành (không có `xóm mộc`; sn22.28:1.2 dùng thị trấn, mn31:22.6 dùng
  thành phố — chọn thành vì `Nagare` đi kèm tên kinh đô); `vinipāta` → chỗ diệt vong;
  `pada` trong `acalaṁ padaṁ` → chỗ đứng; `Ekūposathikavagga`, `Modakadāyikā` giữ Pāli
  theo thi-ap3:0.3. Tên riêng `Modakadāyikā` giữ Pāli là theo đúng tiền lệ
  thi-ap3 (`Maṇḍapadāyikā`), không phải tự ý giữ chữ lạ.
  Ghi nhận bất định: 2.4 `tīṇidāsahaṁ` là thì quá khứ số nhiều (ta đã cho ba cục
  bánh ngọt), trong khi các câu khác dùng `ahaṁ` số ít; giữ số nhiều vì đó là dạng
  Pāli được truyền. 1.4 `gacchaṁ udakahārikā` là mệnh lệnh + tế từ, dịch
  'này kẻ gánh nước, hãy đi đi!' — Pāli không nói rõ gọi ai, nên giữ nghĩa đen.
  `udakahārikā` mang hậu tố nữ `-kā` nên gọi một nữ; tiếng Việt không có dấu giốc.
  4.4 `acalaṁ padaṁ` không có tiền lệ nào trong tầng; dịch theo nghĩa bằng
  `acala` = bất động (ud8.10) và `pada` = chỗ đứng, không ghi chú trong thân kinh.
  `…pe…` ở 5.2, 6.2, 7.2 giữ đúng một dấu lược; nháy kép mở ở 1.1, đóng ở 7.3.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
