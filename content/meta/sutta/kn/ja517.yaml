    Dò Pāli của 151 khoá với toàn bộ Pāli `ja` đã ghim có bản Việt (kho chính cộng các bài đã dịch ở worktree): 9 khoá có ít nhất một dạng trùng ở bài khác (so sau khi bỏ dấu nháy, dấu câu cuối, khoảng trắng). Dùng lại nguyên văn: `0.3` (`ja511`–`ja513`), `26.1` (`ja511:29.1`, `ja489:7.1`: "Mười sáu ngàn phụ nữ"), `26.2` (`ja493:9.4`: "đeo hoa tai ngọc"), `27.2` (`ja346:1.2`, `ja480:21.2`: "đầy đủ mọi dục lạc sung túc"), `34.2` (`ja431:3.2`: "tinh tế, suy nghĩ cẩn trọng"). Cố ý khác tiền lệ (4/9): `17.4` so với `ja225:1.2` ("thành thạo mọi nghề" ở đó là thuộc tính của một người; ở đây `byāvaṭo` đi với `ussukko te divārattiṁ` — "ngày đêm tận tâm vì ngài, lo liệu mọi việc" — nghĩa là bận tâm, dốc sức); `24.1`, `24.2` so với `ja310:1.1–1.2` và `ja433:2.1–2.2` (hai bài có hai cách dịch khác nhau cho cùng Pāli; `ja310` bắt đầu bằng "Dẫu" nên là mệnh đề điều kiện không có trong `ja517`; ở đây là đoạn mô tả đất đai mà vua cai quản và `sāgarakuṇḍalaṁ` được giữ nguyên "biển làm hoa tai"); `0.1` "Jātaka" dùng lại tiêu đề.
    Trong chính bài: 9 nhóm Pāli trùng nguyên văn. Cả 9 nhóm dịch nhất quán, 0 cặp mà Việt khác: `3.4`=`8.2` ("bậc trí thấy rõ điều lợi ích"); `4.4`, `8.4`, `12.4`, `17.6`, `22.4` (câu hỏi "ngài sẽ trao cho quỷ nước?"); `6.4`, `10.6`, `15.4`, `20.4`, `23.4` (câu đáp "tôi sẽ trao cho quỷ nước"); `5.4`=`18.4` ("cười cợt quá mức", lời về mẹ và về bạn); cả khổ `11.1`–`11.4` = `13.1`–`13.4` (bốn khoá, lời Bherī rồi vua nhắc lại nguyên văn); `28.3`=`32.3` ("bảo hộ bậc trí"). `28.4` (`pāṇaṁ cajasi duccajaṁ`, "ngài bỏ…") và `32.4` (`cajati`, "vị ấy bỏ…") không trùng vì khác ngôi động từ.
