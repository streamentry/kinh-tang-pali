    Tầng Pāli ghim chỉ có kệ, nên người nói tôi suy ra từ cách xưng hô trong kệ và từ chuyện khung đã nêu ở trên: Bherī (nữ tu sĩ du hành) hỏi vua Cūḷanī (ở `32.2` gọi là Cūḷaneyya) câu hỏi về quỷ la-sát nước; vua đáp, gọi Bherī là `ayye`. Phân chia: `1.x`, `3.x`–`4.x`, `7.x`–`8.x`, `11.x`–`12.x`, `16.x`–`17.x`, `21.x`–`22.x`, `24.x`–`28.x` là lời Bherī; `2.x`, `5.x`–`6.x`, `9.x`–`10.x`, `13.x`–`15.x`, `18.x`–`20.x`, `23.x`, `29.x`–`31.x` là lời vua; `32.x`–`34.x` Bherī nói với dân Pañcāla. Chưa có tiền lệ `ayye` trong tầng (0 khoá `ja` đã dịch có từ này; `ja267:2.1` chỉ có dạng nam `Ayya`), nên dịch "thưa bà" ở mọi chỗ (`15.1`, `18.1`, `19.1`, `23.1`, `29.1`); không thêm vào thân kinh chữ "ni sư" hay "hoàng hậu" vì Pāli không nói. Vua xưng "tôi", Bherī gọi "ngài" (theo cách `ja512` xử lý cặp vua—bậc được tôn kính). Mở/đóng nháy kép đúng từng khoá theo Pāli: 15 đoạn lời nói mở ở `1.1`, `2.1`, `3.1`, `5.1`, `7.1`, `9.1`, `11.1`, `13.1`, `16.1`, `18.1`, `21.1`, `23.1`, `24.1`, `29.1`, `32.1` và đóng ở khoá cuối tương ứng, cả khổ `34.4` đóng bằng `”ti.` của Pāli (`cā”ti` → `…đời sau”.`, bỏ `ti`).
