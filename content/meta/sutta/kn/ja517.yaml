  - Chỗ bất định (không thêm vào thân kinh):
    + `1.1`–`1.6` `muñcesi`: dịch ở thì tương lai/giả định ("ngài sẽ thoát khỏi"), theo nghĩa câu hỏi giả định "nếu… thì" của `Sace… gaṇheyya`; hình thái `muñcesi` có thể hiểu là ngôi 2 giả định hoặc quá khứ ngôi 3; ngữ cảnh (cả bốn khổ đáp `2.x` đều ở thì giả định) ủng hộ cách đọc đã chọn. `kathaṁ` (1.5) dịch "như thế nào"; có thể đọc "kathaṁ" là danh từ "lời nói" nhưng ngữ cảnh không hỗ trợ.
    + `3.3` `Chabbhī tayi padussati`: tôi đọc `Chabbhī` là một tên người (theo tóm lược của chuyện khung, nhân vật làm điều ác với vua, nên bà mẹ phải cứu), `padussati` = "làm điều ác với" (padussati nghĩa "hư hỏng, có ác ý, làm hại"). Không tra được tiền lệ, Pāli có thể chấp nhận cách đọc khác (một danh từ chung); `3.5` `Aññaṁ upanisaṁ katvā`: `upanisā` ở đây dịch "chỗ thay thế" (nghĩa gốc "chỗ nương, cớ"); đây là cách đọc từ chuyện khung (bà mẹ đưa người khác thay vào), không thấy trực tiếp trong kệ.
    + `5.1`–`5.2` `Daharā viyalaṅkāraṁ… apiḷandhanaṁ`: "như thiếu nữ, mang đồ trang điểm, đeo những món trang sức không nên đeo"; tôi bỏ chủ ngữ như Pāli (chủ ngữ là bà mẹ, nêu ở `6.3`); nghĩa của `apiḷandhanaṁ` ("không nên đeo") là cách đọc, chưa có tiền lệ trong tầng.
    + `6.2` `dūtāni sāsati`: "sai gửi sứ giả" (dūta sứ giả; `dūtāni` số nhiều trung tính, có thể là "thông điệp"); không ảnh hưởng nghĩa.
    + `11.1`–`11.4` (cũng `13.1`–`13.4`) `Yenocitā janapadā, ānītā ca paṭiggahaṁ; Ābhataṁ pararajjebhi, abhiṭṭhāya bahuṁ dhanaṁ`: `ocitā` (gom lại), `paṭiggahaṁ` (nắm giữ), `abhiṭṭhāya` (chế ngự) đều là dạng hiếm; không tra được tiền lệ; dịch sát từng chữ và giữ cấu trúc khổ như Pāli, không điền chữ nào cho chủ ngữ hay tân ngữ bị lược. Cách đọc khác của `abhiṭṭhāya` là "sau khi áp sát/đứng lên chống lại"; chưa phân xử được từ Pāli một mình.
    + `14.3` `Mayāyaṁ sukhito rājā`: đọc là ý nghĩ của người anh em ("nhờ mình mà vua này sung sướng"), nên dùng "mình" để không nêu rõ ngôi; không dùng nháy đơn vì Pāli không có.
    + `16.3` `Ubho jātettha pañcālā`: "cả hai sinh ra ở đây, là người Pañcāla"; `16.4` `susamāvayā` dịch "thật hợp nhau, bạn bè đồng tuổi"; "hợp nhau" là cách đọc `su-samā-vaya` (cùng tuổi rất khít).
    + `17.1`, `18.1` `Cariyā`: dịch "về nếp sống"; có thể đọc "cariyā" là "hạnh/cách cư xử" hoặc dạng gerund; `18.1` thiếu động từ trong Pāli (`maṁ ayaṁ`), tôi bổ sung "theo" từ `17.1` `anubandhittho`; chưa phân xử được dứt khoát.
    + `19.1` `Ubbariyāpihaṁ`: tách `Ubbariyā + api + ahaṁ`, dịch "Ngay cả khi tôi… bàn chuyện với Ubbarī"; `19.4` `pubbe appaṭivedito` = "không được báo trước".
    + `21.2` `rutaññū`: "hiểu các tiếng" (ruta = tiếng kêu/tiếng nói); `āgatāgamo` = "thông hiểu kinh điển truyền thừa"; `22.2` `Nakkhattapadakovido`: "tinh thông các dấu hiệu của tinh tú"; chưa chắc `pada` là "dấu hiệu" hay "vị trí".
    + `23.3` `accabhamuṁ luddaṁ`: đọc `acca-bhamu` = "chau mày quá" (bhamu = lông mày) theo tóm lược chuyện khung ("mở to mắt, chau mày"); `luddaṁ` = "hung dữ". Hình thái hiếm, đây là cách đọc có căn cứ ngữ cảnh nhưng không có tiền lệ trong tầng.
    + `24.3` `Vasundharaṁ`: "mặt đất" (đất giữ của cải); `25.1` `Cāturanto mahāraṭṭho`: "đại quốc rộng khắp bốn phương" (bốn phía cùng bờ biển); `25.4` `yaso`: "danh vọng" (cũng có thể là "quyền thế/tùy tùng").
    + `27.1`–`27.4`: `Evaṁ sabbaṅgasampannaṁ, sabbakāmasamiddhinaṁ; Sukhitānaṁ piyaṁ dīghaṁ, jīvitaṁ āhu khattiya`: cấu trúc ghép cú pháp rời; giữ nguyên thứ tự ghép và không thêm "đời sống" ở khoá đầu.
    + `29.2` `mama hatthaṁ`: "đến dưới tay tôi" (thành ngữ, dưới quyền); `29.3` `dhīrassa`: "bậc kiên định" (dhīra), cũng có thể là "bậc trí".
    + `32.2` `cūḷaneyyassa`: giữ "Cūḷaneyya" (dạng con trai/thuộc Cūḷanī) vì chưa phân xử được nó là danh xưng hay tên khác của vua; `33.3`–`33.4`: `pañcālo` đọc là vị vua Pañcāla; `channaṁ` = "của cả sáu", gồm cả chính mình.
