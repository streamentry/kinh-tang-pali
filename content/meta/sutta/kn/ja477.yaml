notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja477_root-pli-ms.json` (65/65 khoá, đủ, đúng thứ tự Pāli, không có khoá ngoài tập Pāli). Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; người nói và quan hệ giữa hai người nói không được ghi vào thân kinh mà chỉ đọc từ nội dung kệ (xem bất định số 1).

  **Tiêu đề, theo khuôn các bài cùng phẩm.** `0.2` “Bộ Mười Ba Bài Kinh” và `0.3` “Phẩm Xoài” dùng lại nguyên văn từ `ja474`, `ja475` (cùng `Terasakanipāta` + `Ambavagga`). `0.4` “4. Kinh Cūḷanārada” theo khuôn “N. Kinh <tên>” của `ja475`, `ja478`; tên Cūḷanārada giữ nguyên Pāli như Phandana ở `ja475` và Dūta ở `ja478` (tầng có `ja4`, `ja464`, `ja443`, `ja358`, `ja374` đều giữ tên Cūḷa… ở dạng Pāli). `15.1` “Kinh Cūḷanārada, thứ tư.” theo `ja474:14.1`, `ja475:14.1`, `ja478:14.1` (có dấu phẩy trước số thứ tự; `catutthaṁ` = 4, khớp số ở `0.4`).

  **Tiền lệ dùng lại nguyên văn.** Đã dò 61 khoá thân kinh (loại 4 khoá `:0` và khoá chép tên cuối bài) với toàn tầng: 5 khoá có Pāli trùng nguyên văn với nơi khác đã được dịch (12 cặp). Dùng lại đúng bản Việt ở 2 khoá: `13.2` (= `mil7.6.4:2.2`) và `14.3` (= `ja435:7.3`). Ba khoá khác lệch có chủ ý (10 trong 12 cặp là các cặp lệch):
  - `6.4` trùng với 8 khoá (`ja306:1.4`, `ja348:1.4`, `ja386:4.4`, `ja401:3.6`, `ja401:5.6`, `ja435:2.4`, `ja439:9.4`, `vv78:8.4`): bản Việt của 8 khoá này khác nhau vì thay đổi ngôi (thiếp, con, bạn, tôi); chọn khuôn đa số “xin hãy nói cho … biết điều ấy, … hỏi” (5/8: `ja401` ×2, `ja435`, `ja439`, `vv78`) và đổi ngôi cho đúng người nói (con, ngài).
  - `9.1` trùng với `snp3.2:14.1` (“Lợi lộc, danh thơm, cùng cúng dường”). Ở `snp3.2` dòng kế không có `pūjā`, nên `sakkāro` mới được dịch “cúng dường”; ở đây dòng `9.2` có `pūjā` riêng, nếu dịch `sakkāro` cũng là “cúng dường” thì hai từ trùng nhau. Giữ “danh thơm” cho `siloko` theo `snp3.2:14.1` và dịch `sakkāro` là “sự cung kính” (cùng cách với `ud2.10:10.2` “cung kính”, `ja339:2.3`, `ja339:4.3` “cung kính tôn sùng”); `pūjā` ở `9.2` là “sự cúng dường”.
  - `13.3` trùng với `mil7.6.4:2.3` (“Hãy ăn vừa phải, uống vừa phải”). `bhuñje` là động từ ăn, không phải uống (`pāna` ở dòng trước mới là uống), nên dùng “ăn có chừng mực, dùng có chừng mực”. Không sửa `mil7.6.4:2.3` (ngoài lát); xin người điều phối xem lại: `bhuñje` ở đó có thể không nên là “uống”.
  - `ja435:7.4` “như tránh một con đường gồ ghề” dịch `yānīva visamaṁ pathaṁ` mà không có chữ cho `yānīva` (= `yānāni iva`, “như xe cộ …”). Ở `14.4` của bài này đã dịch “như xe tránh con đường gồ ghề”; Pāli `14.4` kết `pathan”ti` nên không trùng byte với `ja435:7.4`, không phải cặp trùng. Không sửa `ja435`; chỉ báo.
  - Cặp trùng với `ja526:25.1–25.3`, `ja547:168.3`, `ja540:62.2`, `ja540:85.2` không có bản Việt (khoá trống) nên không có gì để dùng lại.

  **Trùng nguyên văn trong chính bài:** có 1 nhóm, 4 khoá: `7.6`, `8.6`, `9.4`, `11.4` (Pāli `brahmacariyassa nārada.`); bản Việt của cả 4 giống nhau (“đối với phạm hạnh, hỡi Nārada.”), 0 cặp lệch. Các khoá `1.1`–`1.3` không lặp trong bài.

  **Số Pāli:** bài không có số lượng nào cần tính. Số `4.` ở dòng tiêu đề `0.4` và `catutthaṁ` ở `15.1` = 4 ⇒ “thứ tư”. Không có số nào khác.

  **Thuật ngữ và tiền lệ, đã đo:**
  - `papāta` → “vực sâu”: tầng có 285 khoá chứa `papāt…` (đa số là `upapāta`, `cutūpapāta`); dạng `papāta` đứng một mình “vực sâu” ở `ud5.5:10.1`, `ud5.5:10.2`, `ud5.5:19.1`.
  - `paṅka` → “bùn lầy”: 32 khoá (ví dụ `ud3.2:18.1`, `snp3.6:38.3`, `snp4.9:11.4`, `snp5.19:15.1`).
  - `visa` → “chất độc”: 28 khoá có `visaṁ`, đa số là “độc / thuốc độc / chất độc” (ví dụ `ja69:1.1`, `ja155:2.3`, `ja331:2.2`); chọn “chất độc”.
  - `āsīvisa` → “rắn độc”: 64 khoá (ví dụ `cp31:6.4`, `cp31:7.3`, `ja435:7.1`); cùng cách.
  - `pamatta` → “phóng dật”: 77 khoá (ví dụ `ud2.8:18.4`, `ud7.4:4.3`, `snp1.3:23.3`).
  - `brahmacārin` / `brahmacariya` → “phạm hạnh”: 46 khoá `brahmacārin…` (ví dụ `ud4.8:6.3`), cách chính trong tầng.
  - `tūla … bhaṭṭha` → “bông gòn rụng”: `sn4.25:25.4` “bông vải rụng”, `ja461:9.6` và `snp3.8:18.6` “bông gòn” — chọn “bông gòn” (2/3) và “rụng” theo `sn4.25:25.4`.
  - `tāta` → “này con”: 35 khoá `ja` có `tāta` đã dịch, đa số là người nói lớn tuổi gọi người nhỏ, ví dụ `ja348:2.1`, `ja348:4.3` (“này con”), `ja160:2.2` (“con ơi”). Dùng “này con” cho người nói lớn tuổi (xem bất định số 1).
  - `ghāsesana` → “tìm thức ăn”: `snp3.11:33.3` “tìm kiếm thức ăn”, `sn6.3:6.4` “tìm đồ ăn”.
  - `nisāmeti` → “lắng nghe”: tầng chỉ có 1 khoá (`sn10.7:7.3` “chú tâm nghe”); chọn “lắng nghe”.
  - `raṭṭha` → “xứ sở”: tầng chỉ có `ja478:9.1` (“xứ sở”) trong `ja`; `janapada` → “miền”: tầng có 71 khoá chứa `janapade` dịch “xứ”, “quốc độ”, “vùng đất” không đồng nhất; dùng “miền” ở `3.2` để tránh trùng `raṭṭha`.
  - `rūpe` ở `13.4` → “hình sắc”: bản Việt `mil7.6.4:2.4` dịch “sắc đẹp”; Pāli chỉ nói `rūpa`, không thêm “đẹp”.
  - `āsava` ở `7.1` (rượu men) → “thứ ủ men”: không phải `āsava` kiểu “lậu hoặc” (tầng có 625 khoá chứa `āsavo…`, đa số là `āsava` “lậu hoặc”); ngữ cảnh `surā nāma pavuccati` cho thấy đây là thức uống ủ men.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 5 khoá mở (`1.1`, `2.1`, `4.1`, `6.1`, `7.1`) và 5 khoá đóng (`1.4`, `3.4`, `5.4`, `6.4`, `14.4`); Việt đúng như vậy, lệch 0/65 khoá. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (không phải dùng `…pe…`). Một lỗi đã bắt khi tự kiểm: bản nháp đầu đọc nhầm khoá `7.1` là không có dấu mở nháy; phép so từng khoá bắt được và đã sửa.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói và quan hệ giữa hai người nói không có trong root. Đọc từ nội dung kệ: `1`, `4`–`5`, `7`–`14` là người nói lớn tuổi (dạy con); `2`–`3`, `6` là Nārada, người xin đi về xứ sở và xin chỉ dạy. `tāta` ở `7.1`, `8.1`, `10.1`, `10.4` (và `Kassapa` ở `2.2`, `brahme` ở `3.3`) cho thấy quan hệ thầy–trò hoặc cha–con, nhưng root không nói rõ; bản Việt dùng “con” cho Nārada và “ngài” cho người nói lớn tuổi mà không thêm “cha / thầy”. `10.3`–`10.4` (`Te tādise manussinde, mahante tāta nārada`) là câu rút gọn, tôi đọc như đề ngữ của `11.1`–`11.2` (“Với những chúa tể … những bậc vĩ đại ấy …, những bậc quyền thế, những bậc thống lĩnh, chớ …”).
  2. `Aggīpi te na hāpito` (`1.3`): `hāpito` (động từ `hāpeti`, “làm cho rời / bỏ”) không rõ nghĩa trong cụm này; tôi đọc theo ngữ cảnh (củi chưa chẻ, nước chưa mang về) là “lửa chưa được nhóm”. Không có bản Việt của `ja526:25.3`, `ja547:603` (cùng câu Pāli) để đối chiếu. Cách đọc khác: `hāpito` là dạng của `jhāpito` (“đốt”), nghĩa vẫn là “nhóm lửa”.
  3. `kassapāmantayāmi taṁ` (`2.2`): `āmantayāmi` có thể là “tôi xin thưa với ngài” hoặc “tôi xin từ biệt ngài”; chọn “thưa … xin thưa cùng ngài” (ít giả định hơn). Không có tiền lệ trong tầng (0 khoá).
  4. `jhāyasi` (`1.4`) → “ngồi trầm tư” (động từ gốc của “thiền”, nhưng ở đây người nói trách người kia ngồi như kẻ ngu — `mandova`); không dịch là “thiền” để khỏi nhầm với tu thiền. Tầng chỉ có `ja236:1.4` (`mandamandova jhāyati`) làm tham chiếu gần, và đó là một ngữ cảnh khác.
  5. `khuddarasūpamo` (`7.4`): `khuddarasa` đọc là “mật ong (nhỏ)”, `upama` là “giống như” ⇒ “tựa vị mật ong”. Không có tiền lệ trong tầng (0 khoá); nghĩa dựa vào từ điển Pāli và nghĩa cảnh (rượu ngọt).
  6. `pamattaṁ pamathenti tā` (`8.2`): `pamatheti` đọc là “đè bẹp”, nghĩa gốc “nghiền, làm vỡ, áp đảo”; “đè bẹp” là cách ít thêm giả định nhất. Tầng không có khoá nào chứa `pamathenti` (0).
  7. `na tesaṁ pādato care` (`11.2`): `pādato` là cách xuất xứ (“từ / nơi chân”), cụm “đi lại nơi chân ai” là thành ngữ ít chắc; dịch “chớ lui tới nơi chân họ”, không thêm “gần” hay “sát”. Một cách đọc khác: “chớ đi từ chân họ (tức là chớ đứng dưới quyền họ)”.
  8. `Yadettha kusalaṁ jaññā` (`12.3`): `kusala` ở đây là “điều thích hợp” (điều nên làm khi đến nhà ai); cũng có thể là “điều tốt lành / lợi ích”. Chọn “thích hợp”; câu `12.1`–`12.4` đọc là: người cần thức ăn vào giờ ăn, đến nhà nào cũng phải biết điều thích hợp ở đó rồi mới đi tìm thức ăn.
  9. `kirāṭa` (`14.1`) và `nikiraṇāni` (`14.2`): 0 khoá tiền lệ trong tầng (`kirāṭ…`: 0; `nikiraṇ…`: 3 khoá nhưng đều thuộc loạt tính từ trong `mnd3`, `mnd14`, `mnd15`, nghĩa khác). Không phân xử được nghĩa chắc chắn: để nguyên `kirāṭa` ở dạng Pāli (như `caṇḍāla` ở `ja474`) và dịch `nikiraṇāni` sát chữ là “những nơi vung rải”; `goṭṭha` → “chuồng bò”, `majja` → “rượu” (không thêm “quán”), `sabhā` → “hội trường”. Đây là chỗ cần người biên tập có nguồn chú giải phân xử; không đoán thành “nơi cờ bạc” hay “kẻ lừa đảo” vì root không nói.
  10. `yānīva visamaṁ pathaṁ` (`14.4`): `yānīva` đọc là `yānāni iva` (“như xe cộ”), nên dịch “như xe tránh con đường gồ ghề”; `ja435:7.4` bỏ `yāna` (xem trên).

