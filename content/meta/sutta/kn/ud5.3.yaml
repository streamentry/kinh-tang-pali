notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud5.3:12.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `6.2` (`seyyathāpi, bhante, nikkujjitaṁ vā ukkujjeyya … ‘cakkhumanto rūpāni dakkhantī’ti`) — bản trước bỏ nháy đơn của Pāli và diễn giải thành mục đích; nay giữ lời trích ‘Người có mắt sẽ thấy sắc’ và dùng công thức của dn16, dn9, dn31: «Ví như, bạch Thế Tôn, có người dựng đứng lại vật bị lật úp, phơi bày vật bị che kín, chỉ đường cho kẻ lạc lối, cầm đèn dầu soi sáng trong bóng tối: ‘Người có mắt sẽ thấy sắc’; cũng vậy, Thế Tôn đã dùng nhiều phương tiện mà khai mở Pháp.»
