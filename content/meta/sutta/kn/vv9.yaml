  upstream, đã ghi ở `blocking_errors`, không phải lựa chọn của người dịch.

  MỆNH ĐỀ ĐO LẠI TRONG `vv` (44 tệp đã có, đếm bằng `grep` trên tầng Việt dự án) — lát
  này chọn theo đa số, và ghi lại CẢ HAI HƯỚNG kèm số như sau.
  · `Vimānavatthu` (0.1): giữ nguyên Pāli **43 tệp** ⟵ *Chuyện về cảnh giới thần* 1 tệp.
  · `Itthivimāna` (0.2): *Chuyện Cung Điện Nữ Hư Không* **20 tệp** ⟵ *Chuyện Cung Điện
    Nam Hư Không* 14 (14 tệp ấy thuộc `Purisavimāna`, không phải bài này) ⟵ *Thiên Cung Của
    Nữ Giới* 1 ⟵ giữ Pāli `Purisavimāna` 3.
  · `Pāricchattakavagga` (0.3, chỉ ở vv31): *Phẩm Cây San Hô* **1 tệp** (`vv36:0.3`), không
    có cách thứ hai. Củng cố bằng tầng tên đã ghim `vv-name:32.vv-paricchattakavagga`
    = The Chapter With the Coral Tree.
  · `Pīṭhavagga` (0.3, vv6/vv7/vv9): *Phẩm Pīṭha* **9 tệp** ⟵ giữ Pāli 2
    (`Mahārathavagga`, `Sunikkhittavagga`).
  · NGÔI KỂ xưng tự: *vậy tôi* **30 dòng / 22 tệp** ⟵ *vậy ta* 4 dòng / 4 tệp ⇒ chọn
    **vậy tôi**.
  · `mahānubhāva`: *đại oai lực* **18 dòng / 9 tệp** ⟵ *uy thế lớn lao* 12 dòng / 9 tệp ⇒
    chọn **đại oai lực**.
  · `sabbadisā disā` toàn cục: *khắp mọi phương* **45 dòng / 27 tệp** ⟵ *khắp muôn phương*
    31 dòng / 23 tệp ⟵ *khắp bốn phương* 7 dòng / 6 tệp.
    ⚠ Nhưng đo theo CHÍNH CÁI PĀLI thì đảo ngược, và đây là mấu chốt của lát này:
    `…te sabbadisā pabhāsatī”ti.` (Tôn giả hỏi, ngôi 2) → *muôn phương* **19 tệp** ⟵
    *mọi phương* 8 ⟵ *bốn phương* 5; còn `…me sabbadisā pabhāsatī”ti.` (nữ thiên đáp,
    ngôi 1) → *mọi phương* **19 tệp** ⟵ *muôn phương* 10 ⟵ *bốn phương* 2; và
    `Obhāsentī disā sabbā,` → *mọi phương* **8/8 tệp**.
    ⇒ Lát này theo **đa số theo từng PĀLI** (luật PĀLI trùng nguyên văn thì dùng lại nguyên
    văn thắng số đếm toàn cục): câu hỏi → *muôn phương*, câu đáp → *mọi phương*.
    Hệ quả trung thực: trong `vv6`/`vv7`/`vv9` cùng một ý `sabbadisā` mà hai bản dịch khác
    nhau. Cụm `vv1`+`vv3`+`vv4`+`vv10`+`vv13`+`vv14` của kho cũng y hệt (hỏi *muôn phương*,
    đáp *mọi phương*), tức đây là quy ước của cụm đông nhất chứ không phải lỗi đơn lẻ — nhưng
    người biên tập có thể muốn thống nhất lại; nếu vậy thì phải sửa **cả hai vế ở cả 44 tệp**,
    việc đó không thuộc lát này và tôi không tự ý sửa bài đã có.

  Nguồn tên kinh: đọc tầng `name/` đã ghim cùng commit để phân giải ba chữ trong tên bài —
  `vv-name:35.vv31` = Couch Mansion ⇒ `Pallaṅka` là kiều/ngai; `vv-name:8.vv6` và
  `vv-name:9.vv7` = Ship Mansion / Second Ship Mansion ⇒ `Nāvā` là **thuyền** (đúng như
  `pv28:5.2` `Nāvāya ca tvaṁ avalamba tiṭṭhasi;` đã dịch *còn ngươi thì dựa vào thuyền mà
  đứng vững*); `vv-name:11.vv9` = Lamp Mansion ⇒ `Dīpa` là **đèn**. Ba tên đó được giữ
  nguyên Pāli trong tiêu đề (`Phẩm Pīṭha`, `Cung Điện Pallaṅka`, `Cung Điện Nāvā`) theo đúng
  cách 43/44 tệp `vv` đang làm với `Vimānavatthu`; riêng `Dīpavimānavatthu` dịch là *Đèn*
  vì *đèn* là từ Việt phổ thông đúng nghĩa, còn `Pallaṅka`/`Nāvā`/`Pīṭha` thì không.
  Tầng `name/` của `sn` không có tên từng bài (2119 mục nhưng `sn14.18`/`sn12.43`/`sn12.44`
  đều để trống), nên ba bài `sn` của lát dùng tiêu đề dịch nghĩa.

  Nháy kép: đặt đúng vị trí Pāli đặt, và cân trên cả bài (đã kiểm bằng `ngoặc()` của
  `_hvi.py` cho từng khoá đã dịch). `vv1:4.4` có lỗi tiền lệ — dư một dấu `”` thành
  `…muôn phương?”.”` — tôi KHÔNG sao chép lỗi ấy; bản đa số (5 tệp) là `…muôn phương?”`
  và đã dùng nguyên văn bản ấy.

  Dấu lược: không khoá nào của `vv31`/`vv6`/`vv7`/`vv9` có `…pe…` ở Pāli, và bản Việt cũng
  không có một dấu lược nào — mỗi khoá khớp 0 = 0.

  Bất định riêng của `vv9`:
  · `3.1`–`3.2` `Kena tvaṁ vimalobhāsā, atirocasi devatā;` — 0 tiền lệ. Bản nháp đầu tiên của
    tôi dịch `3.2` thành *này nữ thiên;* và **bỏ sót** `atirocasi`; đã sửa thành *lại chói lòa,
    này nữ thiên;*. `9.1`–`9.2` là cặp đối xứng của nó (`Tenāhaṁ vimalobhāsā, atirocāmi
    devatā;`) nên hai cặp phải dùng cùng một động từ — đã vậy.
  · `6.3`–`7.4` `andhakāramhi timīsikāyaṁ` / `Padīpakālamhi … dīpaṁ` — 0 tiền lệ;
    `timīsikāya` = *ba mươi ngày*, `padīpa` = *ngọn đèn* (theo `vv46:7.1`
    `Padīpaṁ tattha jāletvā` → *Tôi thắp một ngọn đèn ở đó*). `jotirasaṁ` = *ánh lửa* nên
    `7.3` là *sinh ra cung điện rực rỡ ánh lửa*.
  · `0.4` và `11.1` — `Dīpavimānavatthu` là nghĩa thường dùng tiếng Việt (*đèn*), nên tôi dịch
    *Chuyện Cung Điện Đèn* thay vì giữ Pāli như `Pīṭha`/`Nāvā`/`Pallaṅka`. Đây là **điểm lệch
    so với `vv36`/`vv39`**, vốn giữ *Mallikā*/*Mañjiṭṭhaka* dù là tên riêng; lý do là *đèn*
    là từ phổ thông đúng nghĩa còn ba tên kia thì không. Ghi lại để người biên tập gộp nếu
    thấy đáng.
  · `9.4` `sabbā obhāsate disā.` — PĀLI **không** đóng ngoặc kép ở đây (đóng ở `10.4`), nên
    bản Việt cũng không đóng; bản nháp đầu tiên của tôi đóng nhầm, `ngoặc()` của `_hvi.py`
    bắt được ngay.
  · `sabbā obhāsate disā` có tiền lệ nguyên văn 1 tệp ở `pv2:1.2` (*làm sáng mọi phương
    trời;*) — dấu chấm phẩy thay chấm ở đây; dùng lại nguyên văn. Tiền lệ ấy cùng hướng với
    lựa chọn *mọi phương* cho `disā` ở bài này, nên hai khoá `3.4` và `9.4` đều là *mọi phương*
    trong khi câu hỏi `4.4` là *muôn phương* — xem mục đo đếm ở phần notes chung.

  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|
  check`. `save_vi` của `_hvi.py` đã pass cho cả 45/45 khoá của bài này (đủ khoá, không thừa,
  NFC, không trùng nguyên văn PĀLI, PĀLI không lọt vào bản Việt, số dấu lược khớp từng
  khoá, ngoặc kép cân trên cả bài), và `_rv67.py` quét lại không lỗi nào ngoài `:0.1` — vốn
  là khối tiêu đề ngắn (< 40 ký tự) mà `_hvi.py` cố ý không kiểm, và giữ nguyên PĀLI là
  **tiền lệ 43/44** trong `vv`. Người biên tập cần chạy đủ `npm run validate`, `npm test`,
  `npm run check`, `npm run build` trước khi coi `technical_integrity: 9.6` là đạt.

  Kiểm toán độc lập 2026-10-11 (đọc đối kháng từng khoá Pāli↔Việt; điểm cũ 9.19 không có căn cứ vì bản trước còn nhiều lỗi nghĩa thật). Các nhận định cũ ở trên về `timīsikāya` = "ba mươi ngày", `jotirasaṁ` = "ánh lửa", `padīpakāla` = "suốt khoảng ấy", `Pahūtamalyaṁ` = "hoa nhài" (mượn từ pv28) và "khoá 3.2 là hô cách" đã được lượt này thay thế; hãy đọc các mục sau.
  Sửa 22/45 khoá, trong đó 14 khoá sai nghĩa thật: (a) 2.2 và 8.2 `idha mijjhati`: "thành tựu được ở nơi đây" (bản cũ "có được nơi này", khớp vv3, vv6, vv13). (b) 4.1 `Pucchāmi taṁ devi mahānubhāve` và 10.1 `Akkhāmi te bhikkhu mahānubhāva`: `mahānubhāve`/`mahānubhāva` là hô cách, bản cũ đọc thành tân ngữ "về đại oai lực ấy" và gọi nữ thiên là "ngài"; nay "Tôi hỏi nàng, này thiên nữ có đại oai lực" và "Tôi xin nói cho ngài, này tỳ-kheo có đại oai lực". (c) 10.2 `yamakāsi` và 10.3 `Tenamhi`: người đáp là nữ thiên, bản cũ ghi "ngài đã tạo… ngài có oai lực", nay "tôi". (d) 3.1 `Kena tvaṁ…`: nữ thiên là "nàng" chứ không phải "ngài" (bản cũ tự mâu thuẫn với 4.1 gọi "nàng"). (e) 5.3–5.4 `yassa kammassidaṁ phalaṁ`: "về nghiệp mà đây là quả báo" (bản cũ "quả báo của nghiệp này là thế"; 5.2 bỏ sắc thái "truy hỏi" vì `pucchitā` chỉ là được hỏi). (f) 6.3 và 7.1 `timīsikāyaṁ`: bản cũ thêm "suốt ba mươi ngày" không có trong Pāli; `timīsikā` là cảnh tối tăm, ja456:7.3 `Tatthandhakāramhi timīsikāyaṁ` đã dịch "trong đêm tối mịt mùng", nên nay "bóng tối mù mịt, giữa đêm tối mịt mùng" (`tamandhakāra` ở bv và tha-ap: 13 dòng, tất cả dịch "bóng tối", đa số "bóng tối mù mịt"). (g) 6.4 và 7.2 `Padīpakālamhi adāsi/dadāti dīpaṁ`: `padīpakāla` là lúc lên đèn, `adāsi/dadāti` là dâng, cho; bản cũ "suốt khoảng ấy… đốt một ngọn đèn" bịa khoảng thời gian và đổi động từ; 7.1–7.2 còn thêm "đều" sai thì (hiện tại, "Ai… dâng"). (h) 7.4 `Pahūtamalyaṁ bahupuṇḍarīkaṁ`: "nhiều hoa, nhiều sen trắng" (khớp vv6:6.4); bản cũ "gần như phủ kín bởi hoa nhài" thêm "gần như" và sai `malya`, lại bỏ `puṇḍarīka` thành "bông sen". (i) 9.2 `atirocāmi devatā`: `devatā` ở đây là chủ ngữ đồng vị của nữ thiên đang nói ("tôi, nữ thiên, chói sáng vượt trội"); bản cũ "này nữ thiên, tôi chói lòa" đọc thành hô cách gọi Tôn giả. Sửa nhẹ: 1.2 bỏ "nơi đây" (không có trong Pāli); 3.1/9.1 `vimalobhāsā` = "ánh sáng không cấu uế" (bản cũ "tỏa sáng không vẩn bụi" mơ hồ); 3.2 `atirocasi` = "chói sáng vượt trội" (bản cũ "lại chói lòa" mất sắc thái `ati-`), đối xứng với 9.2; 3.3 thêm "của nàng" (`te` bị bỏ); 10.4 "sắc tướng" đổi "dung sắc" cho khớp 4.4 và 1.1; 5.3 "Được hỏi câu hỏi, nàng đã giải đáp" theo vv3:4.3 và vv6:4.3.
  Phép đo sau sửa: 45/45 khoá có đủ tập khoá Pāli; nháy kép và nháy đơn khớp Pāli từng khoá (0 lệch trên 45 khoá); NFC sạch; không khoá rỗng, không khoảng trắng thừa; dấu lược … không có ở Pāli lẫn Việt nên phép này chạy rỗng; Pāli trùng nguyên văn trong bài có 2 cặp (2.4 với 8.4, 3.4 với 9.4) và Việt giống nhau ở cả hai cặp; không có số Pāli cần tính; không có Pāli lọt sang Việt ngoài tên riêng.
  Mức điểm đổi so với 9.19: semantic_fidelity 9.3 xuống 8.8 (14 khoá sai nghĩa thật vừa sửa, cộng tiêu đề 0.2 Itthivimāna còn "Nữ Hư Không" mà Pāli không có ākāsa); terminology 9.2 xuống 8.6 (tiêu đề 0.2 như trên; `bhogā` = "của cải" theo họ tệp trong khi nghĩa đúng hơn là các thứ thọ hưởng; `Pīṭha` giữ Pāli); grammar_logic 9.2 xuống 9.0; ambiguity_integrity 9.1 xuống 8.8 vì các bất định dưới đây; source_provenance 9.4 xuống 9.2 vì ghi chú cũ nêu các khẳng định từ vựng không có căn cứ; vietnamese_clarity 9.3 xuống 9.1; các tiêu chí còn lại giữ nguyên. Điểm sau 8.99 là điểm của bản đã sửa, không phải của bản trước, và chưa vượt 9.0.
  Bất định còn lại: (1) `jotirasaṁ vimānaṁ` ở 7.3: tha-ap24:12.2 và tha-ap562:12.2 dùng `jotirasaṁ maṇiṁ` (viên ngọc jotirasa), nên có thể là tên loại ngọc làm thành tính từ chỉ cung điện; giữ nghĩa trung tính "rực rỡ ánh sáng" thay cho "ánh lửa" của bản cũ, không phân xử được bằng tầng Pāli đã ghim. (2) `timīsikā` dựa vào một tiền lệ duy nhất (ja456:7.3), không có từ điển trong tầng ghim. (3) `devatā` ở 3.2 có thể là hô cách ("này nữ thiên") hoặc đồng vị; chọn đồng vị cho đối xứng với 9.2, nghĩa hai cách đọc gần nhau. (4) `bhogā` giữ "của cải" và `piyā` giữ "dễ chịu" theo họ tệp (22 tiền lệ), sắc thái yếu hơn "thọ dụng"/"thân thương". (5) 1.4 giữ "rực rỡ tựa như sao mai" theo 25 tiền lệ (pv13–pv16 và họ vv) dù "rực rỡ" là tô điểm nhỏ không có trong `osadhī viya tārakā`. (6) "Tôn giả" trước Moggallāna không có trong Pāli, giữ vì cả họ vv dùng. (7) 0.2 `Itthivimāna` dịch "Nữ Hư Không" là sai (Pāli không có ākāsa), lặp ở khoảng 51 tệp vv; không sửa riêng một tệp để khỏi lệch cả bộ, cần sửa đồng loạt. (8) `sabbadisā` hỏi "muôn phương" và đáp "mọi phương" theo quy ước họ tệp đã nêu ở trên. (9) Các lỗi (a)–(i) có mặt ở các tệp vv khác có cùng Pāli, chưa sửa ở lượt này.
  Cổng kỹ thuật: lượt này không chạy được npm run validate, npm test, npm run check, npm run build; technical_integrity giữ 9.6 do coordinator chạy sau.
