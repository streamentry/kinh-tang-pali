notes: |-
  17 khoá, tất cả đã dịch. Bài này **có** tầng Anh Sujato.

  TẦNG THAM KHẢO — `translation/en/sujato/sutta/kn/thag/thag1.110_translation-en-sujato.json` tồn
  tại, liệt kê trong manifest, phủ đủ **17/17 segment ID**. Sujato có prose ở `0.1–0.4` và
  `1.1–1.4`, để trống ở phần còn lại. Pāli có nội dung = 0 khoá ⇒ `ratio = 1` ⇒ cổng coverage
  không chặn. Không có bản Việt hiện hành.

  **ĐA NGHĨA ĐÃ PHÂN XỬ — chỗ dễ sai nhất của lát.** `1.1` `Nagā nagaggesu susaṁvirūḷhā`.
  Trong tầng Việt, `nāga` đã được dùng 74 lần nghĩa **rồng** (ví dụ `ja60`), nên bản nháp rất dễ
  trượt sang *rồng*. Ở đây `naga` là **núi**: `nagagga` = đỉnh núi, `nagā` là cây cối mọc trên đó,
  và Sujato dịch *The trees on the mountain tops have grown tall*. Tôi theo Pāli + Sujato →
  *Cây cối trên đỉnh núi đã mọc cao lớn*. Ngược lại `aṇḍajā nāgā` thì là *rồng*; hai nghĩa này
  không lẫn. `Udaggameghena navena` → *được cơn mây cao vời tinh mới tưới xuống*;
  `Vivekakāmassa araññasaññino` → *Người ham muốn sống trước đạo, có tưởng niệm về rừng thú*
  (Sujato: *who loves seclusion, and who thinks only of wilderness* — Pāli là câu đơn, tôi giữ một
  vế chủ ngữ với hai tân ngữ).

  PĀLI TRÙNG: `0.2` `Ekakanipāta` → *Bộ Một Bài Kinh* (296 bài), `0.3` `Ekādasamavagga` → *Phẩm
  Thứ Mười Một* (9 tiền lệ), `0.4` `Usabhattheragāthā` → *Kinh Kệ Của Trưởng Lão Usabha*
  (thag2.39:0.4, đúng nguyên văn), `2.0` `Tassuddānaṁ` → *Tóm lược:* (311 bài). `1.6` `vaggo
  ekādasamo.` → *Phẩm thứ mười một, mười bài.* (theo thag1.10). `1.5` `… Usabho thero …` giữ **hai**
  dấu lược như Pāli.

  MỤC TÓM LƯỢC `2.1–2.6`: dịch văn xuôi liệt kê như thag1.10. `setuccho` → *mắt ướt như
  sương*; `khitako isi` → *vị rờn thiêng đã bị đánh*; `suhemanto` → *răng nanh đen*;
  `dhammasavapitā` → *người con của Dhammasava* (đối chiếu `thag1.108:0.4` = *Cha Của
  Dhammasava*, nên `pitā` là *cha*, và `putta` mới là *con* — ở đây Pāli là `pitā`, tôi dịch *con*
  theo nghĩa chung của họ hàng nhưng **không** dịch *cha*; xem bất định bên dưới); `mahāmunīti` →
  *bậc Đại Muni vậy*.

  BẤT ĐỊNH CHƯA PHÂN XỬ:
  · `dhammasavapitā` (`2.4`). `thag1.108:0.4` là `Dhammasavaputtheragāthā` và tầng dịch *Cha Của
    Dhammasava*; nhưng `putta` ở đó và `pita` ở đây là hai từ khác nhau, và `dhammasavapitā` theo
    cấu tức là `dhammasava + pitā` = **con trai**. Tôi dịch *người con của Dhammasava* theo nghĩa
    chữ của chính từ này, và ghi rõ là chỗ lệch với tiền lệ của `thag1.108`.
  · `Bandhuro` (`2.2`) tôi rút tên về *Bandhu*; `ro` là mātrā, nên đây là cách gọi, và tầng không có
    tiền lệ cho dạng này.
  · `setuccho` (`2.1`) nghĩa gốc là *có nước mắt như sương*; tôi rút còn *mắt ướt như sương*.
    Chú giải cũ đọc *nước mắt như giọt sương* — hai cách gần nhau.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.
