notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Không thêm, không bỏ,
  không đổi segment ID.

  **⚠ Đặc thù đo được của lát Theragāthā: `cần` trong `kiểm()` RỖNG, nên assertion KHÔNG tự
  chạy.** Đã đo: vế kệ dài nhất của lát là 37 ký tự (`thag1.35:1.1`), ngắn nhất 16 (`Ekakanipāta`),
  trong khi `kiểm()` chỉ kiểm khoá ≥ 40 ký tự. Nên NFC / trùng nguyên văn Pāli / lọt_pāli /
  dấu lược **không** tự chạy cho bất kỳ khoá nào. Tôi vì vậy viết thêm một tầng kiểm thủ công
  `_tv6_1_tu_tay()` trong `_tvd6_1.py`, chạy ngay trong script, và **đã kiểm đủ 108/108 khoá**:
  đủ khoá và đúng ID; NFC; 60 khoá thân kệ không trùng nguyên văn Pāli; không Pāli lọt;
  số dấu lược bằng Pāli từng khoá; số ngoặc kép bằng Pāli từng khoá và cân trên cả bài; không
  còn `(…)` đứng một mình. Không chỉ tin chốt. Chạy `save_vi` hai lần: idempotent, hash tệp
  không đổi.

  **Tầng Anh đủ cho toàn bộ nội dung kệ.** 8/9 khoá mỗi bài có tiếng Anh Sujato tại commit đã
  ghim; khoá trống duy nhất là dòng quy kết lược `… X thero …. `, vốn không có tiếng Anh ở cả
  23 bài thag1 trên đĩa. Không có tầng Việt hiện hành: `translation/vi/` của bilara tại commit đã
  ghim chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho Theragāthā. Đây là
  giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là
  Pāli root + English Sujato cho phần kệ, và Pāli + tiền lệ trong tầng cho phần khung bài.
  Không sửa `content/meta/reference-gaps.yaml`.

  **Thuật ngữ — tiền lệ đếm được trong tầng (3.500+ bài Việt đã có).** `Ekakanipāta` → *Bộ Một
  Bài Kinh* (22 bản thag1; chỉ `thag1.1:0.2` viết *Tập Một*, tôi không theo). `aṭṭhaṅgika` →
  *tám pháp* (357 lần trong Pāli cache, Sujato dịch *eightfold* 363 lần; tiếng Việt tầng dùng
  *tám pháp*, không có *bát pháp*/*tám phương*). `anariya` → *hèn hạ*; `dosasaṁhita` → *mang theo
  sân hận*; `asita` → *vô nhiễm*; `aneja` → *không dao động* (75 lần) / *bất động* (181 lần);
  `aparibhāga` → *tranh chấp*; `uḷāra` → *cao quý*; `kāmarāgappahānāya` → *từ bỏ tham dục*;
  `kitti`/`yasa` → *tiếng khen* / *danh tiếng*; `amata` → *bất tử*; `suta` → *nghe pháp*;
  `atthapucchana` → *hỏi han về ý nghĩa*; `Agārasmā anagāriyaṁ` → *từ đời sống tại gia đi vào
  đời sống không nhà*; `ekatta` → *nhất tâm*; `sabbasaṅgātigata` → *thoát mọi trói buộc*;
  `pāra` → *bờ bên kia*; `susamāhita` → *điền tịnh*; `tapasā` ( cháy, khóc) → *khóc lóc*;
  `bhitam` (buồn khóc) → *buồn khóc*; `iddhi` → *thần thông*; `jhāna` → *thiền định*;
  `paribbajati` → *đi lang thang* (7 lần); `sāmañña` → *hạnh sống*.

  **Khung bài — dùng lại nguyên văn đã có (đếm trước khi chọn).** `Theragāthā 1.N` ở `:0.1`: giữ
  nguyên, 13 bản thag1 (`11`, `42`, `101`–`109`, `111`, `1`). `0.3` = *Phẩm Thứ…* và `0.4` =
  *Kinh Kệ Của Trưởng Lão <tên>*: **13 bản đúng vị trí** (thag1.11, 42, 101–109, 111) so với 11
  bản đảo hai khoá này (thag1.2–10, 14); tôi theo đa số và theo đúng vị trí Pāli. Dòng quy kết
  `… X thero …. ` → *… Trưởng lão X ….*: **14 bản giữ nguyên dấu lược** (thag1.11, 101–109,
  111). ⚠ **`thag1.42:1.4` đi ngược lại** — mở rộng thành *Bạch Thế Tôn, Tôn giả Trưởng lão … đã
  từng nói bài kệ này*. Tôi **giữ lược** theo đa số và theo BRIEF_VI3 §10.1: Pāli đã lược thì
  bản dịch không được mở rộng, và 12 bài của lát này thống nhất 12/12. Người biên tập nên biết
  tồn tại hai cách trong cùng tầng; tôi không sửa bài của lát khác.

  **Giới tính người kệ ở `thag1.35`.** Bài này nằm trong *Theragāthā* và Pāli ở `0.4`/`1.5` dùng
  hình masculine `…ttheragāthā` / `…kānitthero`, nhưng tên là nữ (`Sāmaññakānī`, Sujato ở
  `0.4` cũng viết *Sāmaññakāni*). Tôi dùng *Trưởng lão Sāmaññakānī* — theo đúng tầng. Lý do
  chọn: 14 bản thag1 giữ dạng *… Trưởng lão X ….* không có dấu hiệu giới tính, thêm *nữ* sẽ tạo
  một ngoại lệ mới trong chính tạng này. Lựa chọn thay thế để người biên tập cân nhắc: *… Trưởng
  lão nữ Sāmaññakānī ….* (tầng có dạng đó ở Therīgāthā: *Trưởng lão nữ Vīrā / Mittā / Bhadrā*).
  Tôi chuẩn hoá về dạng tên gốc ở `1.5` — cùng cách `thag1.107` đã làm (*Dhammasavo thero* →
  *Trưởng lão Dhammasava*).

  **Bất định có nghĩa đáng kể, đã phân xử và ghi ở đây (không chú thích trong thân kinh).**
  **Hai chỗ lần đầu trong tầng, 0 tiền lệ — ghi lý do.** `vīratthu` (`vīra` + `atthu`)
  = *bậc Trượng phu*; tầng không có cách nào sẵn cho danh từ này khi xưng Đức Phật, mà *Trượng
  phu* thì quen thuộc hơn *anh hùng* và không lệch nghĩa (Sujato: *O hero*). `padāna` ở `1.3` là
  chỗ **thật sự bất định**: `tuyhā padāne viharaṁ`. Hai đọc: (a) *trong quả vị của Ngài* — `padāna`
  là *quả báo* (đọc tôi chọn, khớp Sujato *the fruits of your practice* và khớp mạch bài, vì người kệ
  đang sống nhờ quả của Đức Phật); (b) *trong sự phóng phóng của Ngài* — `padāna` là *phóng phóng*
  (`pada` = *bước chân*). Chọn (a) vì (b) làm nghĩa cả vụng và trái mạch bài; nếu người biên tập
  chọn (b) thì đổi một vế này. `sabbadhi` tôi dịch *vô thường biến dịch* (nghĩa *mọi mặt, mọi
  phương diện*), `anāsavo` → *không ô nhiễm*. `vippamuttosi` giữ *Ngài* (danh từ -si là chủ thể hạ
  thứ hai đi kèm *te* ở `1.1`) chứ không rút gọn thành *ta*.

  **Điểm.** `final_score` là trung bình số học thô của đúng 10 tiêu chí, **tính bằng script**
  trong `_meta6_1.py`, không gõ tay. `technical_integrity` chấm **9.6 chứ không phải 10.0**: đợt
  này cấm chạy `npm run validate|test|check|build` (người điều phối chạy tập trung), nên tiêu chí 10
  chưa đủ căn cứ để chấm 10 — cùng cách `thag1.42` đã làm. Ba tiêu chí hạ dưới 9.5 là
  `semantic_fidelity`, `terminology` và `ambiguity_integrity` — điểm thấp nhất của lát vì **hai** từ lần đầu trong tầng (`vīratthu`) và một bất định thật sự về nghĩa `padāna`.
