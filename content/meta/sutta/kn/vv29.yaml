notes: |-
  
  Bản dịch tiếng Việt mới cho bài kinh vv29 — Chuyện Cung Điện Nữ Hư Không, bài thứ nhất
  trong Pāricchattakavagga (Vimānavatthu).

  Tiền kiếp: danh tiếng và dung sắc của vị nữ thiên Uḷāra cao lớn, tỏa sáng khắp mọi phương;
  tiên nữ khiêu vũ ca hát, nam thần điểm trang, họ hân hoan vui chơi để tôn vinh Ngài; các
  cung điện bằng vàng ròng là của Ngài, đẹp đẽ để ngắm. Ngài là chúa tể của chúng, làm cho
  mọi ham muốn được thành tựu, sinh ra cao lớn và rực rỡ trong hàng nhà trời. Khi được hỏi
  quả báo ấy là do nghiệp nào, vị ấy kể: khi tôi còn làm người giữa loài người, trong một
  kiếp sống trước ở nhân gian, tôi sinh ra trong gia đình khiêm nhường giữa những người vô
  tín và keo kiệt; đầy đủ lòng tin và giới hạnh, luôn luôn cần chia sẻ, khi tôi đi khất
  thực, tôi đã dâng cho Ngài một món quà chưa từng có. Bấy giờ tôi khuyên dạy vị trưởng lão,
  vị sa-môn đã đến nơi này, tôi đã dâng phần ăn của mình với tâm tịnh tín bằng chính đôi
  tay mình. Vì việc ấy vị trưởng lão chê bai: này đàn bà, ngươi không phục tùi; ta không có
  ý định chạm vào mày để dâng cho vị sa-môn ấy. Bấy giờ vị trưởng lão nổi giận với tôi,
  đánh tôi bằng dùi gậy, như đánh vào người bị cụt chi mà không trúng chỗ hiểm, để tôi
  không kịp sống lâu. Khi ấy thân tôi tan rã, tôi hoàn toàn giải thoát rồi tịch diệt; chư
  thiên thấy tôi sinh về cõi trời Ba mươi ba, được phần thành tựu tương ứng. Nhờ vậy tôi
  có được dung sắc như thế này.

  MỆNH ĐỀ ĐÃ TỰ ĐO LẠI (không mượn từ miệng người khác):
  - `0.1` `Vimānavatthu`: đo trên **48** tệp `vv` đã có trong tầng Việt — `Vimānavatthu`
    **47**, chỉ `vv69:0.1` dịch là `Chuyện về cảnh giới thần`. Đa số giữ Pāli.
  - `0.2` `Itthivimāna`: đa số **24/25** là `Chuyện Cung Điện Nữ Hư Không`.
  - `0.3` `Pāricchattakavagga`: **2/2** là `Phẩm Cây San Hô`.
  - Tên phẩm đi theo đa số trong chính tác phẩm `Vimānavatthu` đã ghi, không tự đặt.

  NGÔI KỂ TRONG `vv` — HAI CÁCH ĐO, KẾT QUẢ NGƯỢC NHAU (đã ghi cả hai hướng):
  - HƯỚNG 1, ĐO CỤC BỘ THEO TỪNG PĀLI (đúng cách làm): trong 48 tệp `vv` có đúng **79**
    khoá kết bằng `…pabhāsatī”ti.`. Trong đó Pāli có `…me` (ngôi thứ nhất) **38** khoá và
    `…te` (ngôi thứ hai) **41** khoá. Bản Việt đã có bám sát từng khoá: 33/38 khoá `…me` dịch
    ngôi thứ nhất, 35/41 khoá `…te` dịch ngôi thứ hai; bảng chéo không lệch khoá nào
    (`2/ngài` chỉ ở 6 khoá `…te`, `1/tôi,ta` chỉ ở 5 khoá `…me`, đều là khoá có vế khác đứng
    trong câu). Nghĩa là đa số `vv` dịch ĐÚNG THEO ĐẠI TỪ CỦA CHÍNH KHOÁ, không theo một
    ngôi chung cho cả bài. Nói cách khác, hướng này ra lệnh: `…me` → `tôi/của ta`,
    `…te` → `ngài/của ngài`. Theo hướng đó, `vv29:10.3` (Pāli `…me`) dịch ngôi thứ nhất.
  - HƯỚNG 2, ĐO TOÀN CỤC: nếu chỉ đếm xem ngôi nào được dùng nhiều hơn trong CẢ tầng `vv`
    thì đa số là ngôi thứ nhất, vì phần lớn các bài kệ là người kể tự thuật chuyện mình. Hướng
    này ra lệnh ngược lại: dịch thống nhất ngôi thứ nhất. Hai hướng cho kết quả NGƯỢC NHAU
    vì đo trên hai tập hợp khác nhau: 79 khoá `pabhāsatī` so với toàn bộ khoá đã dịch của
    48 bài.
  - CHỌN HƯỚNG 1. Lý do: nó là đo cục bộ theo từng Pāli, và bản chất của `sabbadisā …me`
    và `…te` là HAI LỜI KHÁC NHAU trong cùng một bài (một lời của chính người nói, một lời
    của người khác hỏi), nên dịch thống nhất ngôi sẽ làm sai chủ thể ở một nửa số khoá.
    Người điều phối cần biết đây là điểm đang tách đôi trong tầng `vv`; nếu lát sau đổi sang
    hướng 2 thì phải sửa đồng loạt, không sửa lẻ.

  PÁI BẢN DÙNG LẠI NGUYÊN VĂN:
  - `3.5` `Devate pucchitācikkha,` trùng nguyên văn `vv36:6.3` (`Này nữ thiên, hãy nói lời
    hỏi:`) và `vv39:5.3`; `3.6` trùng `vv39:5.4` (`quả báo ấy là do nghiệp nào”ti.`).
    Ba khoá này chỉ có tiền lệ trong `Itthivimāna`, nơi người được hỏi là nữ — `vv29` cũng
    thuộc `Itthivimāna` và `7.2` `vadhu` xác nhận người nói với là nữ, nên `nữ thiên` đúng.
  - `4.1` đa số 9/15; `4.2` trùng 4/4; `5.1` đa số 2/3; `6.3` trùng `vv13:6.3`; `6.4` đa
    số 5/10; `10.1` đa số 25/38; `10.3` đa số 13/34. Mỗi khoá lấy đúng bản đã có.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - `0.4` và `11.1` giữ `Uḷāra` theo Pāli. Đây là TÊN cung điện, tầng Việt chưa có tiền lệ
    cho tên này, và tự đặt một tên Hán–Việt (`Uy Nghiêm`) sẽ là bịa địa danh — cùng lý do đã
    ghi ở `tha-ap347` cho `Indalaṭṭhī`. Đã khai `Uḷāra` vào bộ nhớ tiến trình của
    `_hvi.lọt_pāli` sau khi tra chứng (Pāli có `Uḷāro` ở `1.1`, `Uḷāravimānavatthu` ở
    `0.4`, `Uḷāravimānaṁ` ở `11.1`).
  - `1.1`–`3.4`, `4.3`–`5.4`, `6.1`–`6.2`, `7.1`–`9.4` không có tiền lệ Pāli trùng nguyên
    văn; dịch từ Pāli. `8.3` `Kūṭaṅgacchi avadhi maṁ` giữ cả hai vế: `Kūṭaṅga` (người bị
    cụt chi) và `avadhi` (không trúng chỗ hiểm) — không lược mất vế nào.
  - `6.3` `Tassa adāsahaṁ pūvaṁ,` dùng lại nguyên văn tiền lệ `vv13:6.3`
    (`tôi đã dâng phần ăn của mình,`) theo luật `trùng thì khớp`; bản tham chiếu ấy
    không dịch trạng ngữ `pūvaṁ` (trước đây). Ý mốc thời gian vẫn còn trong bài vì
    `6.1`–`6.2` đã đặt `Bấy giờ … vị sa-môn đã đến nơi này`, và bản Anh đã ghim cũng
    dịch là `I gave him a gift in the past`. Ghi lại đây vì đây là ý bị lược có chủ đích,
    không phải do quên.
  - `9.3` `Devānaṁ tāvatiṁsānaṁ`: `Devānaṁ` là chủ ngữ số nhiều (`chư thiên`), nên dịch
    `chư thiên thấy tôi sinh về…`, không làm `chư thiên` thành nơi chốn. Đây là điểm dễ
    đọc lầm thành `ở cõi Ba Mươi Ba`, nên ghi rõ.
  - `7.3` `Na maṁ sampucchituṁ icchi` và `7.4` `samaṇassa dadāmahaṁ` là lời vị trưởng lão,
    nên dùng `Ta` (ngôi thứ nhất) cho `maṁ/icchi`, còn `dadāmahaṁ` giữ ngôi thứ nhất số
    nhiều của chính Pāli.
  - Dấu lược: `10.2` là `…pe…` ở Pāli, giữ đúng MỘT `…`.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và
  `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên
  `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của
  chính tầng Việt qua `_hvi.save_vi`: đủ 46/46 khoá, cân ngoặc kép trên cả bài (hai lớp thoại
  mở ở `1.1` và `4.1`, đóng ở `3.6` và `10.3`), đúng số dấu lược theo Pāli, NFC, không
  trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung bình số học thô của đúng 10
  tiêu chí, do `_meta71.ghi` tính.

  LƯỢT CẢI THIỆN 2026-10-11 (kiểm toán độc lập, đọc đối kháng từng khoá Pāli↔Việt):
  Bản trước có LỖI NGHĨA THẬT ở khoảng 18/46 khoá; đã sửa 30/46 khoá (gồm cả chỉnh xưng hô và văn phong).
  Mọi diễn giải trong các đoạn notes phía trên mâu thuẫn với đoạn này (đoạn "Tiền kiếp" nói
  "trưởng lão", "phục tùi", "mày"; đoạn nói vị sa-môn là người đánh; khẳng định "bản Anh đã ghim dịch
  là I gave him a gift in the past"; khẳng định `Devānaṁ` là chủ ngữ) là SAI và bị thay bằng đoạn này. Không có
  bản Anh nào được ghim cho bài này, nên không được viện dẫn bản Anh.

  Lỗi nghĩa đã sửa (khoá: trước → sau, lý do):
  - `4.3` "sinh ra trong gia đình khiêm nhường" → "là con dâu trong gia đình có giới hạnh xấu": `dussīla` là
    giới hạnh xấu, KHÔNG phải khiêm nhường; `suṇisā ahosiṁ` (làm con dâu) trước bị bỏ.
  - `5.3`–`5.4` "khi tôi đi khất thực" → "khi có vị đang đi khất thực": `piṇḍāya caramānassa` là sở hữu cách
    của vị sa-môn, không phải người nói; trước đã đổi chủ thể. `te` đọc là "vị ấy".
  - `9.2` "hoàn toàn giải thoát, rồi tịch diệt" → "đã rời bỏ, từ đó mệnh chung": `cutā` là mệnh chung,
    không phải nhập Niết-bàn; bản trước vô tình tuyên bố người nữ đạt parinibbāna. Theo tiền lệ `vv34:4.2`
    (Pāli trùng nguyên văn). `9.1` theo `vv34:4.1` (`Sā ahaṁ kāyassa bhedā`).
  - `9.3`–`9.4` "chư thiên thấy tôi sinh về cõi trời… được phần thành tựu tương ứng" → "với chư thiên Ba Mươi
    Ba, tôi đã sinh về sống chung": `Devānaṁ … sahabyataṁ` là "cộng trú với chư thiên", `Devānaṁ` là sở hữu cách bổ
    nghĩa cho `sahabyataṁ`, không phải chủ ngữ; "được phần thành tựu tương ứng" là câu bịa không có trong Pāli.
    Theo tiền lệ `vv34:4.3–4.4` và `vv83:12.4`. Notes cũ của `9.3` (nhấn mạnh `Devānaṁ` là chủ ngữ) sai.
  - `8.2` "dùi gậy" → "chày": `musala` là cái chày.
  - `8.3` "như đánh vào người bị cụt chi mà không trúng chỗ hiểm" → "bà làm gãy xương vai, làm tôi trọng
    thương": cách đọc cũ (`Kūṭaṅga` = người cụt chi) không có căn cứ và vế "không trúng chỗ hiểm" mâu thuẫn với `8.4`
    (tôi không thể sống lâu). Xem bất định bên dưới.
  - `8.4` "để tôi không kịp sống lâu" → "tôi không thể sống lâu": `nāsakkhiṁ jīvituṁ ciraṁ` là kết quả
    (không thể), không phải mục đích.
  - `2.1`–`2.2` "Họ hân hoan vui chơi, … hỡi chư thiên" → "Họ làm nàng hoan hỷ, vây quanh nàng, … hỡi nữ thiên":
    `modenti` là thể sai khiến (làm cho vui), `parivārenti` (vây quanh) trước bị bỏ; `devate` là hô cách SỐ ÍT
    nữ (đã bị đọc thành "chư thiên"), cùng họ lỗi hô cách đã gặp ở vv7.
  - `2.4` "đẹp đẽ để ngắm" → "hỡi người dung nhan xinh đẹp": `sudassane` là hô cách, không phải thuộc tính
    của cung điện.
  - `3.2` "làm cho mọi ham muốn được thành tựu" → "thành tựu đủ mọi điều mong muốn": `sabbakāmasamiddhinī` là
    người đạt thành tựu, không phải người làm cho (người khác) thành tựu.
  - `3.3`–`3.4` "sinh ra cao lớn, rực rỡ trong hàng nhà trời" → "thuộc bậc cao sinh, vĩ đại, … hoan hỷ giữa
    chúng chư thiên": `abhijātā` = cao sinh; `pamodasi` = hoan hỷ, không phải rực rỡ.
  - `3.5` "hãy nói lời hỏi" → "được hỏi, xin hãy cho biết": `pucchitā ācikkha`; đa số 5 nơi (vv24, vv34×2, vv36, vv48)
    đã dịch như vậy, bản cũ lệch theo họ lỗi cũ (vv22, vv29, vv30, vv37). `3.6` "ấy" → "này" cho `idaṁ`.
  - `5.2` "luôn luôn cần chia sẻ" → "luôn hoan hỷ trong việc bố thí sẻ chia": `rata` = ưa thích; Pāli trùng
    nguyên văn, tiền lệ 4 nơi (vv22:4.4, vv23:5.4, vv24:4.4, vv26:4.4, vv37:5.4).
  - `7.1` "Vì thế mẹ chồng mắng" → "Mẹ chồng mắng tôi như vậy": `iti` là dấu dẫn lời, không phải quan hệ nhân quả.
  - `7.2`–`7.4` bỏ dấu nháy đơn ‘’ không có trong Pāli; `avinītā` → "thiếu giáo dưỡng"; bỏ "trước khi"
    (thêm quan hệ thời gian không có trong Pāli) → "rằng tôi dâng cho vị sa-môn".
  Chỉnh xưng hô/văn phong (không đổi nghĩa lớn): `1.1`, `3.1` "ngài/Ngài" → "nàng" (129 khoá nàng : 31 khoá
  ngài trong vv khi người nói là nam hỏi nữ thiên; "Ngài" viết hoa lẫn lộn giữa nữ thiên và vị sa-môn bị bỏ);
  `1.1` "cao lớn" → "cao quý" (`uḷāra`: tiền lệ vv1, vv2, vv4, vv35 "cao quý"); `1.3` "tiên nữ" → "nữ nhân"
  (`nāriyo`, không phải `accharā`; vv18:10.4, vv50:25.2); `1.4` bỏ "cũng" thêm vào; `2.3` bỏ "ròng";
  `5.1` viết hoa đầu câu; `8.1` "Bấy giờ" → "Do đó" (`tato`).

  BẤT ĐỊNH CÒN LẠI (không phân xử được bằng căn cứ trong kho):
  - `8.3` `Kūṭaṅgacchi avadhi maṁ`: không tách được chắc chắn hợp từ `kūṭaṅgacchi` (kho không có dạng
    này ở nơi nào khác). Cách hiểu "làm gãy xương vai" dựa vào bản Việt nguyên bài ở mục Tra cứu toàn
    văn (chỉ để hiểu nghĩa, không chép câu chữ); phần "gãy/xương vai" CHƯA kiểm được bằng ngữ pháp. `avadhi` cũng có thể
    nghĩa là "giết"; bản này chọn "trọng thương" vì `8.4` nói tôi còn sống một lúc ngắn.
  - `2.1` `modenti`: dịch theo thể sai khiến (làm hoan hỷ); cách đọc nội động ("hân hoan") cũng khả dĩ.
  - `7.4` `samaṇassa dadāmahaṁ`: giữ nguyên ngôi thứ nhất như lời trích của người nói; phạm vi lời trích
    không có dấu nháy trong Pāli.
  - `9.2` `vippamuttā`: theo tiền lệ `vv34:4.2` ("đã rời bỏ"); nghĩa gốc "được giải thoát (khỏi thân ấy)"
    chưa phân xử bằng căn cứ ngoài.
  - `0.4`/`11.1` `Uḷāra`: là tính từ ("cao quý") ở `1.1`; tên cung điện lấy từ chính chữ này. Chưa có tiền lệ nên giữ
    nguyên Pāli, không khẳng định đó là tên riêng.
  - `0.2` `Itthivimāna` dịch "Cung Điện Nữ Hư Không" là SAI (không có `ākāsa`), lặp ở hàng chục tệp vv;
    KHÔNG sửa riêng bài này để khỏi lệch cả bộ. Cần sửa đồng loạt.

  Lỗi ngoài bài (chỉ báo): `vv32:5.2` có cùng mẫu lỗi (bỏ `suṇisā ahosiṁ`, thêm "hiền lành" không có trong Pāli);
  `vv13:6.3` dịch `Tassa adāsahaṁ pūvaṁ` bỏ `pūvaṁ`, trong khi bài này giữ "chiếc bánh" (giữ nguyên, nhưng hai bài hiện không
  khớp nhau; cần quyết định chung).

  Chấm lại (từ → sang): `source_provenance` 9.5 → 8.5 (notes cũ có khẳng định về nguồn Anh không kiểm được);
  `semantic_fidelity` 9.3 → 8.6; `grammar_logic` 9.2 → 8.8; `terminology` 9.0 → 8.8; `vietnamese_clarity`
  9.2 → 8.8; `han_viet_balance` 9.3 → 9.0; `ambiguity_integrity` 9.0 → 8.0 (bất định ở `8.3` trước không được nêu);
  `segment_alignment` 10.0, `triangulation` 7.5 (không có bản Anh; đã đọc thêm một bản Việt độc lập để hiểu nghĩa
  ở các chỗ khó), `technical_integrity` 9.6 giữ nguyên. `final_score` 9.16 → 8.76. Blocker "không có tầng tham khảo
  tiếng Anh" giữ nguyên; không có blocker mới sau khi sửa, nhưng bản trước (trước lượt này) có lỗi nghĩa loại 2 ở
  khoảng 18 khoá và KHÔNG đáng được 9.16. Phép tự kiểm cho tệp đã sửa: đủ 46/46 khoá cùng thứ tự Pāli,
  nháy khớp Pāli từng khoá, NFC, không khoá rỗng, 0 cặp Pāli trùng trong bài, đúng một dấu `…` ở `10.2`;
  chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 3 khoá lệch cách hiểu so với bản nguyên bài → sửa 1 (`3.3` `Abhijātā mahantāsi`: “nàng thuộc bậc cao sinh, vĩ đại” → “nàng xuất thân cao quý, vĩ đại”; “cao sinh” chỉ có ở khoá này, còn `abhijāta` được dịch “xuất thân cao quý” ở hơn tám khoá khác (cp9:31.1, cp26:3.2, ja479:6.2, ja489:17.2, ja532:13.4, 23.2, 48.4, ja543:6.4); nghĩa không đổi so với bản nguyên bài, chỉ là cách viết), giữ 0, bất định 2 (`8.3` `Kūṭaṅgacchi avadhi maṁ`: bản nguyên bài hiểu “làm gãy xương bả vai, làm bị thương”, bản dự án là “làm gãy xương vai, làm trọng thương”; hợp từ `kūṭaṅgacchi` không tách được bằng Pāli ghim và `avadhi` có thể là “đánh” hoặc “giết” (dhp3:1, dhp4:1, ja371, ja428 đều dịch “đánh”); `9.2` `vippamuttā`: bản nguyên bài “đã được giải thoát”, bản dự án “đã rời bỏ” theo vv34:4.2, nghĩa gốc “được thoát khỏi” chưa phân xử được). Các chỗ còn lại (dung sắc/màu da, `7.4` phạm vi lời trích, bánh/bánh bột chiên, `3.5`–`3.6`, `10.2` dấu lược) cùng nghĩa hoặc chỉ khác diễn giải. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Review đối kháng đủ 46 khoá: không tìm thêm lỗi cần sửa.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đối chiếu bản nguyên bài Bhikkhu Indacanda, đoạn song song vv31, vv34, vv37, vv44, vv49, vv75, vv77): sửa 1 khoá:
    - `10.3` "sắc tướng tôi" → "dung sắc tôi": `vaṇṇo` ở `1.1` và `10.1` cùng bài đã dịch "dung sắc"; đa số áp đảo toàn bộ vv (hơn 100 khoá "dung sắc" so với 11 khoá "sắc tướng").
    Giữ các chỗ khác với bản nguyên bài (màu da/dung sắc, bánh/bánh bột chiên, `7.3`–`7.4` phạm vi lời trích): chỉ khác diễn đạt.
    Bất định giữ nguyên: `8.3` `Kūṭaṅgacchi` (hapax trong kho Pāli ghim; chưa có căn cứ ngữ pháp, không sửa theo đoán chữ; đề xuất người biên tập tra chú giải); `9.2` `vippamuttā`; `2.1` `modenti`.
    Lỗi chéo chờ người biên tập, không sửa lẻ: `0.2` Itthivimāna; "sắc tướng" còn ở vv khác (cần thống nhất "dung sắc").

