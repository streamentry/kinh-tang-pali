  Sửa lỗi nghĩa 2026-10-16: 9.2 — *đã rời bỏ, từ đó mệnh chung* → *đã thoát khỏi nỗi khổ ấy, rồi mệnh
  chung* (`vippamuttā tato cutā`: `tato` là xuất cách chỉ điều vừa kể ở `8.1–8.4`; chú giải Vv-a
  https://www.tipitaka.org/romn/cscd/s0506a.att1.xml giải "Vippamuttāti tato dukkhato suṭṭhu muttā"
  (thoát hẳn khỏi khổ ấy), và ở bài `vv20` (`vippamuttā ito cutā`) cũng giải "tato manussadobhaggiyato … vippamuttā apagatā";
  bản cũ để `vippamuttā` không có đối tượng). Mục "bất định 9.1/9.2 `vippamuttā`" ở trên được thay
  bằng kết luận này.
