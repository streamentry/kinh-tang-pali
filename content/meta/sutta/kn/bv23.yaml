notes: |-
  Đợt 19, làn 88. Dịch từ Pāli root commit đã ghim, đủ 124/124 khoá (123 khoá mới cộng khoá kết `31.1` đã có từ trước và được giữ nguyên), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ hai mươi mốt của Buddhavaṁsa (đánh số 23 trong tệp), về Đức Phật Vessabhū: ba lần chứng ngộ và ba kỳ hội chúng, tiền thân Sudassana dâng cúng, xuất gia và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng và hào quang, tuổi thọ, nhập Niết-bàn và xá lợi. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn 15/15 tiền lệ (`bv7`, `bv9`, `bv22`, `bv24`…).
  - `0.2` “23. Dòng Kế Thừa Của Đức Phật Vessabhū”: cùng khuôn với `bv22:0.2`, `bv24:0.2`.
  - `31.1` giữ nguyên “thứ hai mươi mốt”: `ekavīsatimo` = 21; Vessabhū là vị Phật thứ hai mươi mốt trong danh sách, ngay sau Sikhī “thứ hai mươi” (`bv22:29.1`) và trước Kakusandha “thứ hai mươi hai” (`bv24:28.1`).

  **Số Pāli, đã tự tính.** `asītikoṭisahassa` = 80 × 1.000 = **tám mươi ngàn koṭi** (3.3; tiền lệ `bv15:6.3`, `bv22:5.3`). `sattatikoṭisahassa` = 70 × 1.000 = **bảy mươi ngàn koṭi** (4.3). `dasasahassī` = **mười ngàn thế giới** (5.4; cùng cách dịch `bv18:21.4`). `saṭṭhikoṭiyo` = 60 koṭi = **sáu mươi koṭi** (6.4; ở đây không có `sahassa` nên không nhân 1.000, khác 3.3 và 4.3). `tayo` 3 (7.1: ba kỳ hội chúng, khớp ba cuộc tụ hội ở 8.2, 8.4, 9.2). `asītibhikkhusahassa` = **tám mươi ngàn** tỳ-kheo (8.1), `sattatibhikkhusahassa` = **bảy mươi ngàn** (8.3), `saṭṭhibhikkhusahassa` = **sáu mươi ngàn** (9.1). `ekatiṁsa` 30 + 1 = **ba mươi mốt** kiếp (15.3). `dasapāramī` 10 (17.4). `cha ca vassasahassa` 6 × 1.000 = **sáu ngàn năm** (19.1). `tayo pāsāda` 3 (19.4, khớp ba tên ở 19.3: Ruci, Suruci, Rativaḍḍhana). `anūnatiṁsasahassa` 30 × 1.000 = **ba mươi ngàn** người nữ, “đủ” theo `anūna` (20.1; cùng khuôn `bv24:17.1`; đây là đếm người nữ, không phải cụm `Tiṁsakappasahassa`). `caturo` 4 (21.1). `chamāsa` 6 tháng (21.3). `saṭṭhiratana` 60 ratana (26.1; `ratana` giữ chữ Pāli như `bv24:23.1`). `saṭṭhivassasahassa` 60 × 1.000 = **sáu mươi ngàn năm** (27.1). `ekavīsatimo` 21 (31.1). Ba lần chứng ngộ: Pāli chỉ gắn thứ tự cho hai lần đầu (`paṭhamābhisamayo` 3.4, `dutiyābhisamayo` 4.4); lần thứ ba (5.1–6.4, sáu mươi koṭi giác ngộ khi thị hiện thần thông) không có chữ “thứ ba” trong Pāli nên không thêm. Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt hiện có (draft và published, kể cả các phẩm bv anh em; so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 61 khoá của bài (kể cả `0.1` và `16.2`) có Pāli trùng với khoá bài khác, tổng 1.412 cặp, trong đó 75 cặp có Việt khác bản tôi viết; 57/61 khoá dùng đúng nguyên văn ít nhất một tiền lệ (so sau khi bỏ dấu câu và chữ hoa). Các khoá có cặp khác và lý do:
  - `15.3` ‘Ekatiṁse ito kappe’: **cố ý khác** 25/26 tiền lệ (các khoá `tha-ap` đo được “Vào ba mươi mốt kiếp trước đây” 14, “Vào ba mươi mốt đại kiếp trước” 7, “Từ ba mươi mốt kiếp trước” 2, cộng `bv28:17.1`). Các tiền lệ đó là người kể nhìn ngược về quá khứ. Ở bài này đó là lời thọ ký tương lai (`ayaṁ buddho bhavissati`, 15.4), nên hướng đếm ngược lại: 31 kiếp **sau** thời Vessabhū là thời Gotama. Viết “Sau ba mươi mốt kiếp nữa,”, cùng hướng với `bv22:12.3`, `bv17:10.3`, `bv7:12.3`. Pāli ở 15.3 không có chữ chỉ hướng; hướng lấy từ động từ tương lai ở 15.4.
  - `17.1` “Nghe lời ấy của vị ấy,”: 19 cặp, 17 khác (10 “Nghe lời ấy của người ấy,” ở `cp8:10.1`, `pv32:6.1`…, 2 “ngài/Ngài”); dùng “vị ấy” vì người nói là Đức Phật, cùng `bv22:14.1`.
  - `2.4` “đã đạt giác ngộ tối thượng.”: 14 cặp, 7 khác (5 “ta đã đạt giác ngộ tối thượng.” ở `cp35`, ngôi thứ nhất; ở đây Đức Phật Vessabhū được nói ở ngôi thứ ba, cùng `bv16:1.4`, `bv24:2.4`, `bv22:2.2`).
  - `2.3` “như thớt voi bẻ gãy mọi trói buộc,”: 21 cặp, 3 khác (“Như voi bẻ gãy mọi xiềng xích,” 1, “Như voi chúa …” 1, “Tựa như thớt voi dũng mãnh …” 1); dùng dạng 13/21 (`cp23:9.3`, `tha-ap342:12.3`).
  - `10.1` “Vào lúc ấy, ta,”: 15 cặp, 3 khác (“Vào lúc ấy tôi,” 2, “Vào thời ấy, ta” 1); chọn “ta” vì người kể là Đức Phật Gotama, như các phẩm cùng bộ (11 khoá).
  - `6.2` “đáng kinh ngạc, rợn da gà;”: 7 cặp, 2 khác (`tha-ap113:6.2`, `tha-ap125:4.2`); dùng dạng 5/7 (`pv35:9.2`, `thag16.1:16.2`…).
  - `12.2` “ngày đêm không mệt mỏi;”: 4 cặp, 2 khác (“không biếng trễ”, “không hề mỏi mệt”); dùng dạng 2/4 (`thag1.83:1.2`, `thig9.1:9.2`).
  - `20.2` 19 cặp, 3 khác ở chữ “trang điểm lộng lẫy”; dùng dạng 16/19. `27.1` “Sáu mươi ngàn năm,”: 5 cặp, 3 khác (cú pháp riêng của từng khoá `ja`, `pv`); dùng `bv7:26.1`. `27.4` 10 cặp, 1 khác (`tha-ap343:1.4` “cứu vớt đông đảo chúng sanh.”). `15.4` 13 cặp, 1 khác (“vị này sẽ là Đức Phật.” ở `tha-ap491:1.4`). `1.2` 3 cặp, 1 khác (`bv19:1.2` có “đã có” ở đầu; ở bài này câu đã có động từ “đã xuất hiện” ở 1.4). `1.3` 1 cặp, 1 khác (`tha-ap67:1.1` “Có một vị tên là Vessabhū,” khác cú pháp); dùng “tên gọi là Vessabhū,” theo `bv24:1.3`.
  - `7.2`, `18.4`, `23.4` `vessabhussa mahesino`: 2 tiền lệ (`tha-ap314:2.2` “Đức Vessabhū bậc Đại Ẩn Sĩ;”, `tha-ap465:1.2` “… bậc Đại Tiên;”), khác mọi tiền lệ ở cú pháp quanh khoá; dùng “của Vessabhū, bậc Đại Ẩn Sĩ.” theo `bv22:15.4`, `bv22:20.4`.
  - Trùng trong chính bài: 1 nhóm Pāli trùng (`vessabhussa mahesino` ở `7.2`, `18.4`, `23.4`: 3 khoá, 3 cặp). `18.4` và `23.4` giống hệt. `7.2` **cố ý khác** (“nơi Vessabhū, bậc Đại Ẩn Sĩ;”) vì ở đó `vessabhussa` đi với `sannipātā` (kỳ hội chúng xảy ra nơi Ngài), cùng cách `bv7:6.2` ⇒ 2 cặp khác (7.2 với 18.4, 7.2 với 23.4).

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có của `kn`, trừ chính bài này; số đo là số khoá chứa gốc Pāli).
  - `mahesi` → “Đại Ẩn Sĩ” 112/155 (“Đại Hiền” 6, “Đại Tiên” 2). `khattiya` → “Sát-đế-lợi” 103/176 (“vua” 24). `nāyaka` → “Dẫn Đạo” 138/240 (“Lãnh …” 25). `mahāvīra` → “Đại Anh Hùng” 79/98. `satthā` → “Đạo Sư” 119/226 (“thầy” 60). `jinasāsana` → “giáo pháp” 53/67 (“lời dạy” 12). `jinavara` → “bậc Chiến Thắng tối thượng” 3/9 (`thi-ap26:19.1`, `bv24:27.1`). `lokajeṭṭha narāsabha` → “bậc Trưởng Thượng thế gian, đấng Nhân Ngưu” (`tha-ap4:1.2`, `tha-ap6:1.2`, `tha-ap19:1.2`, `bv25:1.4`; khoá có `narāsabha` ở bv anh em dịch “bậc Nhân Ngưu” `bv7:5.2`, `bv16:18.4`, `bv17:17.2` nhưng với `lokajeṭṭha` đi kèm thì dùng dạng trên). `lomahaṁsana` → “rợn da gà” 8/15 (“dựng tóc gáy” 3). `pāṭihera` → “thần thông” 2/2 (`tha-ap403:6.4`, `tha-ap550:10.3`). `sivikā` → “kiệu” 7/8 (“xe” 1). `nimantetvā` → “thỉnh mời” 7/7. `pabbajjaṁ/pabbajiṁ` → “xuất gia” 80/81. `bandhana` → “trói buộc” 46/71 (“xiềng” 5). `nāga` ở 2.3 (so sánh voi) → “thớt voi”. `sambodhi` → “giác ngộ” 36/48. `vijita` (2.2, đối tượng là `taṇhā`) → “chinh phục” 10 trong 46 khoá chứa `vijit-` (“thắng” 25, “chiến thắng” 15): chọn “chinh phục” để phân biệt với `jina` “Chiến Thắng”. `sikhī` ở 26.4 → “ngọn lửa”, theo `bv10:28.4` (`nibbuto so yathā sikhī` → “như ngọn lửa”); trong khi `snp1.12:15.1` là “con chim công”, nghĩa không áp dụng cho đoạn so sánh với núi ban đêm.
  - `asama appaṭipuggala` → “vô song, không ai sánh bằng” (`bv22:1.4`, `bv10:1.4`). `rāgaggi` → “lửa tham” (`iti93:3.1`, `ja216:2.1`; “lửa tham dục” 1 ở `tha-ap219:2.1`). `acchariya` → “kỳ diệu” và `abbhuta` → “đáng kinh ngạc” (ở dạng liền `abbhutaṁ lomahaṁsanaṁ`, 5/7 khoá; riêng `acchariya` đứng một mình ở `ud` là “kỳ diệu”, `abbhuta` là “hy hữu”). `mahādāna` → “đại thí”, `pavattetvā` → “thực hành” (`cp7:2.4`, `thi-ap39:2.3` “Sau khi thực hiện đại thí,”). `mahāraha` → “vô cùng quý giá” (`tha-ap44:9.1`, `tha-ap403:20.4`). `annapāna` → “thức ăn thức uống” (`bv9:13.3`, `bv22:9.4`). `paṇīta` → “cao quý” (`kp6`). `guṇasampanna` → “đầy đủ đức hạnh” (3 trong 5 khoá: `tha-ap336:10.3`, `tha-ap551:4.3`, `vv5:8.1`; “đầy đủ phẩm hạnh” 1; “đầy đủ đức tốt” 1). `iriyāpatha` → “oai nghi” (`snp2.14:11.3`, `tha-ap429:4.4`). `padesa` → “vùng” (26/66 khoá). `sabbaññutā` → “Nhất Thiết Chủng Trí” (`bv24:13.3`, `bv25:15.1`). `ṭhapetvāna` ở 28.3 → “để lại” (xem bất định 9). `jarādibhaya` không có tiền lệ trong tầng.
  - Tên riêng giữ dạng Pāli có dấu: Vessabhū, Maṇḍa, Sudassana, Kapila, Anoma, Suppatīta, Yasavatī, Ruci, Suruci, Rativaḍḍhana, Sucittā, Suppabuddha, Aruṇārāma, Soṇa, Uttara, Upasanta, Rāmā, Samālā, Mahāsāla (tên cây Bồ-đề, giữ nguyên chữ Pāli), Sotthika, Rambha, Gotamī, Sirimā, Khemārāma. `koṭi` và `ratana` giữ chữ Pāli như `bv22`, `bv24`.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `2.1`–`2.2` `ādittaṁ vata rāgaggi, taṇhānaṁ vijitaṁ tadā`: `ādittaṁ` là trung tính còn `rāgaggi` ở dạng gốc, nên quan hệ ngữ pháp giữa hai chữ không hoàn toàn rõ; tôi đọc “lửa tham quả thật đang bùng cháy”. Quan hệ giữa 2.1 và 2.2 (đồng thời, tương phản, hay mệnh đề phụ cho 2.3–2.4) Pāli không nêu bằng liên từ nên không thêm chữ nối. `taṇhānaṁ` là sở hữu cách số nhiều, dịch “các ái”; `vijitaṁ` “đã bị chinh phục”. Cách đọc khác: “sự chiến thắng của các ái” (chủ thể là ái); không phù hợp với 2.3–2.4 nên không chọn. Không có tiền lệ cho cả cụm.
  2. `4.1` `pakkante cārikaṁ raṭṭhe`: đọc “khi lên đường du hành trong xứ” (`raṭṭhe` định vị). Chủ thể ở 4.2 `lokajeṭṭhe narāsabhe` đồng cách định vị tuyệt đối, đặt sau.
  3. `5.1` `mahādiṭṭhiṁ vinodento`: `mahā-diṭṭhi` có thể là “quan điểm lớn” hoặc “tà kiến lớn”. Tầng có `bv15:4.3` dịch `diṭṭhiṁ vinodento` là “xua tan quan điểm”, nên giữ “quan điểm” và không thêm “tà/sai lầm”. Bản dịch để nguyên mức đó.
  4. `5.3`–`5.4` `samāgatā naramarū, dasasahassī sadevake`: `sadevake` đọc là định cách của “mười ngàn thế giới cùng chư thiên”. Có thể là hai nhóm tụ hội riêng (loài người và chư thiên đã tụ hội; và mười ngàn thế giới cùng chư thiên chứng kiến). Dịch sát hình thái, không giải nghĩa.
  5. `9.3` `jarādibhayabhītānaṁ`: “của những vị khiếp sợ các nỗi sợ như già nua”; `ādi` = “…vân vân”, không liệt kê thêm (Pāli không nêu). Không có tiền lệ. `9.4` `orasānaṁ mahesino` đọc “những người con ruột của bậc Đại Ẩn Sĩ” (`orasa` → “con ruột”, `thi-ap26:6.2`, `thi-ap39:10.4`).
  6. `10.4`–`10.6` `dānaṁ datvā mahārahaṁ; annapānena vatthena, sasaṅghaṁ jinapūjayiṁ`: `vattha` đọc “y phục” (không phải “vải” như `dussa` ở `bv22:10.1`), vì `vattha` ở đây đi cùng thức ăn thức uống thành bộ vật dâng; không có tiền lệ một-một.
  7. `11.1`–`11.2` `tassa buddhassa asamassa, cakkaṁ vattitamuttamaṁ`: sở hữu cách “của Đức Phật vô song ấy” đứng trước phân từ `vattita`; đọc “bánh xe tối thượng của Ngài đã được chuyển”. Cách đọc khác “bánh xe tối thượng do Đức Phật ấy chuyển” cùng nghĩa. `11.4` `pabbajjamabhirocayiṁ` “ta đã ưa thích sự xuất gia”; `abhirocayiṁ` không có tiền lệ trong tầng.
  8. `13.1`–`13.2` `ācāraguṇasampanno, vattasīlasamāhito`: `ācāraguṇa` có thể là “đức hạnh thuộc cách hành xử” (tatpuruṣa) hoặc “hạnh kiểm và đức hạnh” (dvandva); chọn cách thứ nhất cho 13.1. `vattasīlasamāhito` đọc “an định trong phận sự và giới hạnh” (`vatta` “phận sự”, `sīla` “giới hạnh”, `samāhita` “an định”); cũng có thể đọc `vattasīla` là một chữ ghép “giới hạnh của phận sự”. Không có tiền lệ trong tầng.
  9. `14.1`–`14.4` `saddhāpītiṁ upagantvā`: `saddhāpīti` đọc “niềm hoan hỷ do đức tin”; cách đọc khác “đức tin và hoan hỷ” (dvandva). Các động từ `vandāmi`, `uppajjati`, `ramāmi` ở thì hiện tại (kể chuyện), giữ nguyên thể hiện tại không đánh dấu thì trong tiếng Việt. `15.1` `anivattamānasaṁ ñatvā`: đọc “biết tâm không thoái lui của ta”; cách đọc khác “biết ta, người có tâm không thoái lui” cùng nghĩa.
  10. `26.2`–`26.4` `hemayūpasamūpamo`: “tựa như cột trụ bằng vàng”; `yūpa` nghĩa gốc là cột tế lễ, nhưng ở đây giữ nghĩa “cột trụ” như `bv18:21.3` (`kañcanagghiya`). `rasmi` “tia sáng”, `rattiṁva pabbate sikhī` “như ngọn lửa trên núi vào ban đêm”: `sikhī` còn là tên Đức Phật Sikhī và nghĩa “chim công”, nhưng đoạn so sánh với núi ban đêm và tiền lệ `bv10:28.4` ủng hộ nghĩa “lửa”. `26.3` chủ thể “từ thân Ngài” là điều ngụ trong `kāyā`, không thêm tên.
  11. `28.2` `vibhajitvā mahājanaṁ`: đọc sát chữ “sau khi phân chia đại chúng”; Pāli không nói phân chia theo tiêu chí nào (căn cơ, loại giải thoát…). Cách đọc khác: “chia sẻ (Pháp) cho đại chúng”. `28.3` `dhammanāvaṁ ṭhapetvāna` đọc “sau khi để lại chiếc thuyền Pháp”; cách đọc khác “thiết lập” (`ṭhapeti`). `28.1` `dhammaṁ vitthārikaṁ katvā` đọc “làm cho Pháp được truyền bá rộng khắp” (`vitthārika`, `snp3.11:15.4`).
  12. `29.1`–`29.2` `dassaneyyaṁ sabbajanaṁ, vihāraṁ iriyāpathaṁ`: đọc “điều đáng chiêm ngưỡng đối với mọi người; nơi an trú, oai nghi”; cũng có thể đọc `dassaneyyaṁ` bổ nghĩa cả `vihāraṁ` và `iriyāpathaṁ` (“nơi an trú, oai nghi đáng chiêm ngưỡng đối với mọi người”), và `vihāra` có thể là “cách an trú” chứ không phải “nơi ở”. Cùng kết quả ở 29.3: tất cả đã biến mất. Không có tiền lệ.

