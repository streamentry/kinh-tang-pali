notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trong
  source/upstream-manifest.json, editions[english-sujato]). Draft + blocker thật. 13/13 khoá
  dịch từ Pāli. `cần` RỖNG nên tự kiểm mọi khoá — 0 lỗi; idempotent byte-for-byte.
  BÀI NÀY KHÓ NHẤT LÁT, nên bị hạ điểm thẳng:
  BẤT ĐỊNH 1, chưa phân xử được: `Idhūragāna` là tên một loài rắn, và `Selassa vaṇṇa` là
  màu của loài rắn sela. Pāli không giải thích và không có tầng Anh nào để đối chiếu. Chọn
  cách ít giả định: `Idhūragāna` dịch thành bầy rắn, `Selassa vaṇṇa` thành sắc màu của mình,
  tức bỏ tên loại; tên loại có thể là thông tin quan trọng cho hậu thế, nên ghi rõ ở đây
  thay vì giấu.
  BẤT ĐỊNH 2: `paviṭṭho` là hiện ra, đã tới, đã ở đó. Chọn đã hiện ra.
  BẤT ĐỊNH 3: `bhakkhā` là mảnh ngon, thức ăn nhỏ (số nhiều). Chọn những mảnh ngon của
  thần tiên, giữ ý thần tiên của `dibyā`.
  BẤT ĐỊNH 4: `bubhukkhito` xuất hiện hai lần với nghĩa khác nhau trong ngữ cảnh. Ở 1.4
  người nói chửi kẻ kia đã no rồi cũng bỏ mặc ta; ở 2.4 người nói chửi kẻ kia dù đã no
  bụng vẫn đưa ta ra cho nuốt. Giữ đúng hai nghĩa, không gộp.
  Cấu trúc 1.1–1.4 và 2.1–2.4 là hai lần chúc ngược nghịch trên cùng một công thức
  Brahmavaṇṇa, nên dịch song song có chủ ý, không lặp khuôn.
  Tiền lệ: nhấy kép mở ở 1.1 và 2.1, đóng ở 1.4 và 2.4, đúng như Pāli. Daḷhavagga và
  Uragajātaka không có tiền lệ; xem ghi chú ở ja153 về Phẩm Tàn Tật.
  Hạ terminology 8.2, semantic_fidelity 8.4, ambiguity_integrity 8.5 vì hai tên loại bị bỏ
  và còn chỗ chưa phân xử. triangulation 7.0: không tầng Anh, không bản Việt tham khảo.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dịch của dự án; so 10 khoá chênh lệch lớn nhất (cả 8 khoá kệ 1.1–2.4 và hai khoá tiêu đề 0.4, 3.1) → khác nghĩa 8: sửa 8, giữ 2, bất định 3. Sửa: 1.4 và 2.4 (“kẻ no rồi sẽ bỏ mặc ta cho nuốt” / “dù đã no bụng vẫn đưa ta ra cho nuốt chửng” → “dù đói, ta không dám ăn” / “dù đói vẫn không dám ăn”): `bubhukkhito` là “đói” (cùng nghĩa ở `mil3.7.3:4.2` `yadā tvaṁ bubhukkhito bhaveyyāsi`) và `no vitarāmi/vitarāsi bhottuṁ` là “không dám ăn”, không phải “bị bỏ mặc cho nuốt”; 1.3 và 2.3 (“khinh thường màu mạc … Phạm thiên” → “kính trọng hình sắc Phạm thiên”): `apacāyamāno` là “tôn kính”, không phải “khinh”; 1.1 (“Tôi là bậc trưởng của bầy rắn” → “Ở đây, bậc đứng đầu loài rắn đã chui vào”): `Idhūragānaṁ` là sandhi của `idha uragānaṁ` (“ở đây … của loài rắn”), còn `pavaro paviṭṭho` là danh cách ngôi ba, không có `asmi` nên không phải lời tự xưng của con rắn; 1.2 (“đã hiện ra; ngươi mong tự do theo sắc màu của mình” → “muốn thoát thân nhờ hình sắc của hòn đá”): `icchaṁ` cùng chủ ngữ ngôi ba với `paviṭṭho`, không có “ngươi”, và `sela` hiểu là “đá”; 2.1–2.2 (“Kẻ giữ gìn màu mạc Phạm thiên” → “Nguyện ngài, được Phạm thiên hộ trì”; “những mảnh ngon của thần tiên” → “thức ăn cõi trời”): `brahmagutto` là phân từ bị động, `dibbā … bhakkhā` là thức ăn cõi trời, `pātubhavantu` là “nguyện hiện đến”; khổ 2 là lời người đối đáp nói với chính người nói ở khổ 1 (`vitarāsi` ngôi hai đáp `vitarāmi` ngôi một). Giữ: 0.4, 3.1 (tiêu đề, chỉ khác diễn đạt). Sửa này thay thế các bất định 1–4 ở trên về 1.1–2.4: `Idhūragānaṁ` không phải tên một loài rắn, và ý “`bubhukkhito` mang hai nghĩa khác nhau ở 1.4 và 2.4” là sai. Bất định (c), vẫn còn: `selassa vaṇṇena` (1.2: “hòn đá” hay một tên riêng/tên loại), `brahmañca vaṇṇaṁ` và `brahmavaṇṇaṁ` (1.3, 2.3: “hình sắc Phạm thiên”, Pāli không nói là hình tướng của ai), `brahmagutto` (2.1: “được Phạm thiên hộ trì”, hay “được phạm hạnh/vị bà-la-môn che chở”). Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản Anh, bản Việt nguyên bài hay đoạn song song): sửa 1 khoá — `2.3`: `Yo brahmavaṇṇaṁ apacāyamāno` là mệnh đề quan hệ (*ngài, người …*), bản cũ *"vì ngài kính trọng"* biến thành quan hệ nhân quả mà Pāli không nói thẳng. Giữ 12 khoá; lượt 2026-10-14 đã sửa đúng các lỗi lớn (`bubhukkhito`, `apacāyamāno`, `idha uragānaṁ`). Bất định còn lại (không đổi, vẫn là lý do bài dưới 9): `selassa vaṇṇena` (1.2), `brahmavaṇṇa` (1.3, 2.3: trong tầng chỉ có `brahmavaṇṇī` ở `dn4`/`dn5` tả dung sắc vị bà-la-môn, không đủ để chốt là *hình sắc Phạm thiên* hay *dáng vẻ bậc phạm hạnh* của vị ẩn sĩ), `brahmagutto` (2.1).

  Quyết định hội đồng biên tập 2026-10-16: C2 — :3.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").

  Nghiên cứu nguồn ngoài 2026-10-16: Rouse (Cowell chủ biên, PTS 1897),
  https://obo.genaud.net/dhamma-vinaya/pts/kd/jat/jat.2/jat.2.154.rous.pts.htm; Ānandajoti, bản dịch
  kệ và chú giải Jātaka,
  https://ancient-buddhist-texts.net/Texts-and-Translations/Jatakagathavannana/154.htm; đã đối chiếu
  1.1–1.4, 2.1–2.4 (cả ai nói với ai); sửa không có khoá nào; bất định 1.2 `selassa vaṇṇena`: chú giải
  hiểu rắn hóa thành hình viên ngọc, Rouse dịch "trong hòn đá"; bản Việt giữ "hình sắc của hòn đá".

  Nguồn thứ hai 2026-10-16: Bhikkhu Indacanda, Tam Tạng song ngữ Pāli–Việt tập 32 (Jātakapāḷi I,
  Buddhist Cultural Centre, Sri Lanka, 2016; bản dịch Việt độc lập của các kệ, không phải bản
  nguyên bài; không có tuyên bố giấy phép máy đọc nên NOASSERTION; chỉ dùng làm bằng chứng nghĩa,
  không chép câu nào), https://tamtangpaliviet.net/TTPV/32_Ja_I.pdf, kệ 157–158; đối chiếu 12/13
  khoá (bỏ 0.1); KHỚP 8, LỆCH-THẬT 0, NGUỒN-LỆCH 4. NGUỒN-LỆCH: `1.2` `selassa vaṇṇena
  pamokkhamicchaṁ` — Indacanda "muốn ra khỏi hình dạng của viên đá", bản này "muốn thoát thân nhờ
  hình sắc của hòn đá" khớp chú giải Jātaka (`maṇivaṇṇena`, thoát khỏi tay ta; bản Ānandajoti đã
  đọc); `2.1` `brahmagutto` — Indacanda "Phạm hạnh hộ trì", bản này "Phạm thiên hộ trì" khớp chú
  giải (`Brahmagopito`) và Rouse; `1.3`, `2.3` `brahmavaṇṇaṁ` — Indacanda "hình bóng Phạm hạnh",
  bản này "hình sắc Phạm thiên", chú giải giải `seṭṭhavaṇṇaṁ` (phẩm sắc tối thượng), chưa phân xử
  nên tính là khoá chưa kết luận. `1.4`, `2.4` `vitarāmi` "không dám ăn" khớp "không mạo hiểm ăn".
  triangulation 8,8→9,2 (8,8 + 0,6 × 12/13 × 10/12 = 9,26, chặn ở 9,2).

  Rà từng chữ bằng DPD 2026-10-16: 13 khoá đã rà; sửa 1.2 (`selassa vaṇṇena`: DPD sela 3 "crystal;
  gem", chú giải CST `maṇivaṇṇena, maṇikkhandho hutvā paviṭṭho`,
  https://ancient-buddhist-texts.net/Buddhist-Texts/K10-JA/154.htm → "hình sắc của viên ngọc"; giải
  quyết bất định cũ); bất định 1.3, 2.3 (`brahmavaṇṇa`: DPD brahma "God" hoặc "Brahman; holy man", chú
  giải `seṭṭhavaṇṇaṁ`, Indacanda "Phạm hạnh"; giữ như lượt trước).
  Lượt hoàn thiện 2026-10-17: thống nhất thuật ngữ: đã rà, không có khoá cần sửa (`vaṇṇa` "hình sắc", `brahma-` "Phạm thiên", `bubhukkhito` "đói", `no vitar-` "không dám ăn" đã nhất quán ở 1.1–2.4; "Phẩm Kiên Cố" khớp ja151–ja160); thêm 4 chú thích (1.1 `idha uragānaṁ` và người nói theo chú giải; 1.2 `sela` "viên ngọc" theo chú giải, Rouse/Indacanda "đá"; 1.3 `brahmavaṇṇa` nghĩa đen so với chú giải "hình sắc tối thượng của vị ẩn sĩ"; 2.1 `brahmagutto`). Các câu sau trong ghi chú cũ đã bị thay: "Draft + blocker thật" (bài nay ở `review` theo waiver `no-upstream-english`, blocker vẫn ghi trong hồ sơ); các bất định 1–4 và điểm "terminology 8.2 … triangulation 7.0" của mục đầu (đã được lượt 2026-10-14 và điểm hiện hành trong `quality` thay); "muốn thoát thân nhờ hình sắc của hòn đá" ở lượt 2026-10-14 và câu "bản Việt giữ hình sắc của hòn đá" ở mục nguồn ngoài (nay "viên ngọc", lượt DPD 2026-10-16); "nhấy kép" là lỗi chính tả của "nháy kép".
  Chấm lại độc lập sau rà DPD + kiểm độc lập 2026-10-17: đọc cả 13/13 khoá đối chiếu chú giải CST (K10-JA/154), Indacanda, DPD: LỖI-THẬT 0, BẤT-ĐỊNH 2 (1.3, 2.3 brahmavaṇṇa: chú giải seṭṭhavaṇṇa của vị ẩn sĩ, bản dịch giữ 'hình sắc Phạm thiên', có chú thích). Gộp V7 (10 khoá, 0 lệch thật) và DPD (1.2 đã sửa 'viên ngọc' đúng chú giải maṇivaṇṇena). Xưng hô ngược quyết định C4 (chim xưng 'ta' với ẩn sĩ, ẩn sĩ gọi chim 'ngài') → grammar 8,9, terminology 8,8. Không có bản Anh Sujato, không Thích Minh Châu → triangulation 8,8. 4 chú thích lượt hoàn thiện khách quan, khớp chú giải → ambiguity 9,0. validate pass, quality:check không lỗi ở bài này; test/check/build không tự chạy → 9,5. Blocker vắng bản Anh thay bằng chuỗi đúng sự thật (chuỗi cũ ghi 'bài phải ở draft').
  Sau lượt chấm độc lập 2026-10-17: `1.3`, `1.4` chim kim sí điểu nói với vị ẩn sĩ xưng «tôi» (C4, dưới→trên).
