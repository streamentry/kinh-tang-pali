notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trong
  source/upstream-manifest.json, editions[english-sujato]). Draft + blocker thật. 13/13 khoá
  dịch từ Pāli. `cần` RỖNG nên tự kiểm mọi khoá — 0 lỗi; idempotent byte-for-byte.
  BÀI NÀY KHÓ NHẤT LÁT, nên bị hạ điểm thẳng:
  BẤT ĐỊNH 1, chưa phân xử được: `Idhūragāna` là tên một loài rắn, và `Selassa vaṇṇa` là
  màu của loài rắn sela. Pāli không giải thích và không có tầng Anh nào để đối chiếu. Chọn
  cách ít giả định: `Idhūragāna` dịch thành bầy rắn, `Selassa vaṇṇa` thành sắc màu của mình,
  tức bỏ tên loại; tên loại có thể là thông tin quan trọng cho hậu thế, nên ghi rõ ở đây
  thay vì giấu.
  BẤT ĐỊNH 2: `paviṭṭho` là hiện ra, đã tới, đã ở đó. Chọn đã hiện ra.
  BẤT ĐỊNH 3: `bhakkhā` là mảnh ngon, thức ăn nhỏ (số nhiều). Chọn những mảnh ngon của
  thần tiên, giữ ý thần tiên của `dibyā`.
  BẤT ĐỊNH 4: `bubhukkhito` xuất hiện hai lần với nghĩa khác nhau trong ngữ cảnh. Ở 1.4
  người nói chửi kẻ kia đã no rồi cũng bỏ mặc ta; ở 2.4 người nói chửi kẻ kia dù đã no
  bụng vẫn đưa ta ra cho nuốt. Giữ đúng hai nghĩa, không gộp.
  Cấu trúc 1.1–1.4 và 2.1–2.4 là hai lần chúc ngược nghịch trên cùng một công thức
  Brahmavaṇṇa, nên dịch song song có chủ ý, không lặp khuôn.
  Tiền lệ: nhấy kép mở ở 1.1 và 2.1, đóng ở 1.4 và 2.4, đúng như Pāli. Daḷhavagga và
  Uragajātaka không có tiền lệ; xem ghi chú ở ja153 về Phẩm Tàn Tật.
  Hạ terminology 8.2, semantic_fidelity 8.4, ambiguity_integrity 8.5 vì hai tên loại bị bỏ
  và còn chỗ chưa phân xử. triangulation 7.0: không tầng Anh, không bản Việt tham khảo.
