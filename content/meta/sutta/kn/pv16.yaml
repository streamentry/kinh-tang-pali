notes: |-
  **Bài.** Nandāpetivatthu (Chuyện Ngạ Quỷ Nandā), bài 4 của Phẩm Ubbarī, Petavatthu: 80 khoá = 3 khoá tiêu đề `:0` + 18 nhóm kệ (`1.x`–`18.x`; 16 nhóm có 4 pāda, riêng kệ 9 và kệ 17 có 6 pāda: 16 × 4 + 2 × 6 = 76) + 1 khoá kết `19.1`. Cấu trúc đối thoại theo dấu nháy của chính Pāli: chồng Nandisena hỏi (1, 3, 5–6 cho áo), vợ Nandā đáp (2, 4, 7–8), phần tường thuật (9–12), chồng hỏi vị thiên nữ (13–15), vợ trả lời (16–18). Pāli ghim mở nháy ở `16.1` nhưng không đóng ở `16.4`, chỉ đóng ở `18.4`; bản Việt giữ đúng như vậy, không tự sửa.
  **Năm phép tự chạy (không dùng chốt cũ, vì bài ngắn nên chốt cũ có thể chạy rỗng).** (1) Tập khoá Việt so với Pāli: 80 = 80, thiếu 0, thừa 0, thứ tự khớp. (2) Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá: mẫu số 320 dấu (80 khoá × 4 loại), lệch 0; nháy đơn Pāli có 0 dấu nên phần nháy đơn chạy rỗng. (3) Pāli trùng nguyên văn trong chính bài: 5 nhóm (`2.1`/`16.1`, `2.2`/`16.2`, `2.3`/`16.3`, `2.4`/`3.4`/`4.4`, `7.3`/`10.1`); ba nhóm đầu dịch giống hệt; nhóm `2.4`/`3.4`/`4.4` cố ý khác ở `3.4` (người hỏi là chồng nên viết *mà nàng đã từ đây…?* thay vì *tôi đã từ đây…*, và dấu hỏi thay dấu chấm); nhóm `7.3`/`10.1` khác một chữ nối (*còn các tỳ-kheo* ở giữa lời nói, *Các tỳ-kheo* khi mở câu tường thuật). Số cặp trùng trong chính bài mà Việt khác: 2 nhóm. (4) Dấu lược: Pāli có `…` ở 0 khoá, Việt 0 khoá; không có `…pe…`, không có `(…)`. (5) NFC 0 lỗi, khoá rỗng 0, khoảng trắng thừa 0, Pāli lọt sang Việt: chỉ các tên riêng và `Petavatthu`, `Ubbarivagga`. Khoá Pāli ngắn nhất và dài nhất: 10 và 35 ký tự, 0 khoá đạt ngưỡng 40.
  **Số Pāli.** Chỉ có số thứ tự: `catutthaṁ` = thứ tư, khớp tiêu đề `4.` ở `0.3`. Không có số lượng nào khác (không có `sahassa`, `sata`, `navuti`…).
  **Chỉ mục Pāli → Việt toàn tầng.** Dựng từ Pāli root của 5 bộ (284.708 khoá) với 186.171 khoá Việt đã có. Số khoá pv16 có Pāli trùng nguyên văn với bài khác: 41 khoá (412 cặp); dùng lại nguyên văn bản dịch đã có ở 33 khoá: `0.1` Petavatthu (35/35), `0.2` Ubbarivagga (3/3: pv20, pv22, pv23), `2.3`/`16.3` (10/10 *đã tạo nghiệp ác,*), `3.1` (8/8), `3.2` (9/10), `3.3` (11/11), `5.1` (pv10), `7.2` (pv10), `8.2` (pv10), `8.4` (2/2), `9.3`, `9.4` (sn3.24), `11.1`–`11.4` và `12.1`–`12.2` (pv10, cùng một đoạn công thức hồi hướng và hiện quả), `13.1`–`13.4` (vv), `14.1`–`14.4` (vv), `15.2`–`15.4` (vv), `17.4`, `17.5` (4/5), `18.1` (4/8). Tám khoá Pāli trùng mà Việt cố ý khác, kèm lý do: `2.4`, `4.4`, `16.4` (tầng dùng *con đã từ đây…* khi người nói là ngạ quỷ thưa với vị tôn giả; ở đây vợ nói với chồng nên dùng *tôi*; tiền lệ gần nhất là pv45:2.4 *chúng tôi đã từ đây…*); `3.4` (xem trên); `7.1` (pv10:4.1 là *Vật ngài trao…*, ở đây vợ gọi chồng là *chàng*); `8.3` (pv31 *con*, ở đây *tôi*); `18.3` (an4.57:4.3 *họ trừ sạch gốc rễ vết bẩn của lòng keo kiệt* là mệnh đề có chủ ngữ ngôi ba, ở đây là phân từ nên viết *sau khi trừ sạch ô nhiễm keo kiệt cùng gốc rễ*; chọn *ô nhiễm keo kiệt* theo an3.10 và an3.42, 6 khoá so với *vết bẩn/nhơ* 2 khoá, *cấu uế* 4 khoá); `15.1` (xem mục bất định).
  **Thuật ngữ, kèm số đếm.** `vītarāga` → *đã ly tham* (80/166 khoá, so với *lìa tham* 22); `bahussuta` → *đa văn* (123/247, so với *nghe nhiều* 60 và *học rộng* 24); `sīlasampanna` → *đầy đủ giới hạnh* (*giới hạnh* 51/154); `maccheramala` → *ô nhiễm keo kiệt* (6/23); `suṇisā` → *con dâu* (3/16); `mālā` → *tràng hoa* (41, so với *vòng hoa* 48 ở mọi dạng `mālā`, giữ theo danh sách chuẩn y phục, hương, tràng hoa); `gandha` → *hương thơm* (91 khoá); `upāhanā` → *dép* (dn1/dn2 *giày* chỉ cho `citrupāhana`, còn `paṭaliyo upāhanā` ở mn93 và sn11.9 đều *dép*); `khādanīya` → *các món ăn* (59/87, theo sn3.24:7.1); `vasavattin` → *quyền tự tại* theo cách tầng đã dịch *vasavattī* là *bậc Tự tại* (dn1, 5 khoá); `akutobhaya` → *không sợ hãi từ bất cứ đâu* (mn92 và snp3.7 *từ phương nào*, an5.55 *bất cứ phương hướng nào*, iti112 *từ đâu*); `pharusa` (dạng chỉ hình dáng ở `1.2`) → *thô kệch*, vì *thô ráp* 0 khoá, *thô bạo* 23 và *thô lỗ* 8 đều nói về lời nói và hành vi; ở `4.1` `pharusā` nói về tính khí nên dùng *thô lỗ*; `caṇḍī` → *hung dữ* (6/89, *dữ dằn* 6). `Ubbarivagga` giữ nguyên Pāli theo pv20, pv22, pv23 (3/3, không có tiền lệ nào khác), đúng như các bài cùng phẩm.
  **Cách xưng hô, đo từ chính bài.** Chồng gọi vợ là *nàng* và vợ gọi chồng là *chàng*; tên người chồng giữ nguyên dạng Pāli `Nandisena` (vocative `nandisena` ở `2.1`, `16.1`). Tên bài `Nandāpetivatthu` → *Chuyện Ngạ Quỷ Nandā*, theo khuôn pv31 *Chuyện Ngạ Quỷ Seriṇī* (tên nữ không thêm *Nữ*); `translationTitle` không có số đầu theo đa số 16/29 trong các bài `pv` đã có; thân kinh `0.3` vẫn giữ `4.` vì Pāli có. `19.1` theo khuôn `<tiêu đề>, thứ N.` (pv31:16.1).
  **Coverage English, mẫu số bằng 0.** Công thức `source/layers.yaml`: Pāli có nội dung từ 40 ký tự trở lên, bỏ khối `:0`; pv16 có 0 khoá như vậy, nên Sujato phủ 0/0 và cổng không đo được gì (không phải *không cần ghi nhận*). Tầng `english-sujato` vắng toàn bộ `pv` ở commit đã ghim (kn chỉ có 9 sub-collection, 755 tệp), `english-project` vắng, `vietnamese-current` bilara vắng. Có đối chiếu thêm bản Việt nguyên bài (không phân đoạn) của Bhikkhu Indacanda ở mục tra cứu toàn văn; nó không phải tầng store, không cấp text cho cột nào, nên không tuyên bố đã đối chiếu English hay Việt hiện hành theo từng khoá.
  **BẤT ĐỊNH ghi lại, không thêm vào thân kinh.** (1) `1.3` `piṅgalā` và `kaḷārā`: dịch *nâu vàng* và *răng hô*; nghĩa gốc của `piṅgala` (nâu vàng, hung) khá chắc, còn `kaḷāra` (răng hô, lởm chởm) theo cách đọc quen thuộc của truyền thống, chưa có tầng Anh đã ghim để kiểm; bản Indacanda đọc `piṅgalā` là *mắt đỏ ngầu* — cách đọc ấy thêm *mắt*, mà Pāli không nói. (2) `1.4` `mānusiṁ` dịch *con người*; nghĩa chặt hơn là *người nữ thuộc loài người*. (3) `4.3` `Tāhaṁ duruttaṁ vatvāna`: dịch *sau khi nói với chàng những lời xấu ác*, hiểu `tā` là `taṁ` cộng `ahaṁ` (nói với ông); 0 tiền lệ đúng cụm `duruttaṁ vatvāna`; cách đọc khác không đổi nghĩa lớn. (4) `9.1` Pāli `Sādhūti so paṭissutvā` không có dấu nháy, nên dịch *nói rằng tốt lắm* không dùng nháy; tiền lệ gần nhất tha-ap432:5.1 *Tôi vâng lời, nói rằng lành thay,*. (5) `9.2` `ākiri`: dịch *đã rải ra vật thí dồi dào*; `dānaṁ vipulaṁ` 5/14 khoá đã dùng *dồi dào*. (6) `15.1` `Pucchāmi taṁ devi mahānubhāve`: tôi đọc `mahānubhāve` là hô cách (*thiên nữ có đại oai lực*), vì `devi` đứng ngay trước nó cũng là hô cách giống cái. Cả 15/15 khoá đã dịch trùng Pāli này ở tầng (chủ yếu ở nhóm `vv`) đều viết *Tôi hỏi ngài, này thiên nữ, về đại oai lực ấy*, tức đọc `mahānubhāve` là địa cách. Tôi lệch tiền lệ vì Pāli là chuẩn cuối cùng và cách đọc hô cách khớp hình thái; đã đo trước khi lệch, nhưng 15 khoá ấy không thuộc lát này nên không sửa; nhờ người biên tập xử. (7) `17.6` `āvāsaṁ vasavattinaṁ`: dịch *là trú xứ của những vị có quyền tự tại*; truyền thống chú giải có thể đồng nhất với một cõi trời cụ thể, nhưng Pāli root không nêu, nên không thêm. (8) `18.4` `Anindito saggamupehi ṭhānaṁ`: dịch *không bị chê trách, mong chàng đi đến nơi cõi trời*, hiểu `ṭhāna` là nơi chốn; hình thức `upehi` là mệnh lệnh cách ngôi hai nên là lời mong, không phải lời khẳng định. (9) `5.4` `ehi nessāmi taṁ gharaṁ` dịch *hãy đến, tôi sẽ đưa nàng về nhà*. (10) `12.4` `sāmikaṁ upasaṅkami` dịch *đã đến gặp chồng mình*.
  **Lỗi bản nháp đã bắt.** Bản nháp đầu bỏ sót dấu nháy mở ở `16.1` vì đọc nhầm Pāli (nghĩ khoá đó không có `“`); phép đối chiếu nháy từng khoá bắt lệch 1/320 và đã sửa. Pāli thực tế mở nháy ở `16.1` và chỉ đóng ở `18.4`.
  **Cổng kỹ thuật chưa chạy trong lượt này, ghi để không tuyên bố technical gate pass:** `npm run validate`; `npm test`; `npm run check`; `npm run build`. Không chạy `npm run audit:*` hay `npm run reference:gaps`; vì thế `technical_integrity` đặt 9.6, không cao hơn.
