notes: |-
  Dịch từ Pāli root của chính bài này, đối chiếu bản Anh Bhikkhu Sujato (cú pháp và sắc thái) và bản Hòa thượng
  Thích Minh Châu nguyên bài trên SuttaCentral. Bản Thích Minh Châu là nguồn tra cứu toàn văn ở cuối trang, không
  phải tầng phân đoạn: tại commit bilara đã ghim, tầng Việt hiện hành chỉ có Pháp Cú nên bài này không có cột đó.
  Thích Minh Châu đối chiếu để thấy thuật ngữ truyền thống, không chép; những chỗ bản mới khác bản cũ đều do Pāli.

  Coverage Anh, đo thật: mẫu số 40 khoá Pāli có nội dung (từ 40 ký tự trở lên, bỏ khối dạng :X.0). Sujato có chữ
  ở 39 trên 40 khoá, bằng 0,9750, trên ngưỡng 0,8 của tầng chỉ tính một mình Sujato. Khoá duy nhất Sujato để trống
  là 11.1 (đoạn lặp lại cuộc trò chuyện, đã lược sau 10.x). Khoá đó có trong lớp english-project nên coverage tính
  cả hai tầng là 40/40, nhưng lớp ấy do tác nhân khác của dự án viết, không phải đối chiếu Anh độc lập, nên
  triangulation chỉ 9,0 chứ không cao hơn. Ngoài lề: bản lấp English ở 11.1 dịch `māṇavakehi` là "human beings",
  trong khi cả bài và Sujato đều là "young students"; đây là lỗi của lớp english-project, nằm ngoài lát này, bản
  Việt không dựa vào nó mà dựa vào Pāli (māṇavaka là thiếu niên).

  Dùng lại nguyên văn: trong chính bài có 8 nhóm Pāli trùng nguyên văn (2.2/10.2 · 7.3/10.4 · 12.4/12.10 · 12.5/13.5 ·
  12.6/13.6 · 12.7/13.7 · 12.8/13.8 · 12.12/14.1) và 0 trên 8 nhóm bị dịch khác nhau. Các cặp gần trùng mà Pāli
  khác ở dấu nháy hay dấu câu (2.1/10.1, 7.4/10.5, 9.8/11.1, 12.9/13.9) chỉ khác ở đúng chỗ Pāli khác. Ngoài bài:
  17 khoá có Pāli trùng nguyên văn với nơi khác trong tầng; 8 khoá khớp nguyên văn (0.2, 0.3, 7.2, 10.3, 12.5, 13.5,
  13.10, 14.9) và 9 khoá khác có chủ ý: 12.4/12.10 dùng "người ấy" vì `ekacco` còn sn35.244:5.6 là tỳ-kheo nên "vị
  ấy"; 13.4 cũng "vị ấy" khác sn35.247:4.6 (không có chủ ngữ); 12.6–12.8 và 13.6–13.8 chọn dạng "sau khi … bằng"
  vì khớp ba trên ba lần đã có ở sn35, thay cho dạng ngắn của dn (Ngửi hương 10 · Nếm vị 11 · Chạm xúc 7), và bỏ
  chữ "chạm xúc chạm" bị lặp của sn35. Khoá 12.5 và 13.5 khớp nguyên văn dạng "Sau khi nghe âm thanh bằng tai".

  Nháy: khoá Pāli kết `”ti` hoặc `’ti` đều bỏ `ti`, 17 khoá, tức 0 giữ và 17 bỏ; cùng phẩm sn35.124–131 và 133 đo
  32 trên 32 cũng bỏ. Dấu lược: 10.3 là `…pe…` giữ đúng một `…`; 12.5–12.8 và 13.5–13.8 là `…` trần giữ nguyên.
  Pāli 8.2 kết `”ti?` nhưng nội dung là lời xác quyết ("xin ngài biết cho"), nên Việt kết `!”`, không phải câu hỏi.
  Số Pāli: `tayo vedā` thành ba bộ Veda (tayo là 3); `Navamaṁ` thành Thứ chín (bài thứ chín của Phẩm Gia Chủ, sau
  sn35.124 đến sn35.133 là thứ mười); không còn số nào khác.

  Thuật ngữ, đo trên tầng Việt hiện có (không tính bài này): `māṇavaka` thành thiếu niên: sn35 10 so với thanh niên
  0, sn 14 so với 58, toàn tầng 47 so với 420 — chọn theo phạm vi gần nhất, giống sn35.133 · `mante`/`mantā` thành
  thánh chú, theo dn4 `apavadati mante` thành hạ thấp thánh chú (toàn tầng thánh chú 16, bài tụng 41 là bối cảnh
  Veda khác) · `kodha` thành sân hận (sn 14 so với phẫn nộ 10) · `muṇḍakā samaṇakā ibbhā kaṇhā bandhupādāpaccā`
  thành đầu trọc, sa-môn giả hiệu, hạng thấp kém, đen đúa, sinh từ chân của vị bà con chúng ta, 10 khoá ở dn3, dn27,
  mn50 · `sakkatā garukatā mānitā pūjitā apacitā` thành cung kính, trọng vọng, tôn kính, cúng dường, đảnh lễ (ud3.8,
  2 khoá) · `kupitā anattamanā` thành tức giận và bất mãn (mn58, mn21) · `uccāsaddā mahāsaddā` thành ồn ào lớn
  tiếng (mn67) · `araññakuṭikā` thành túp lều nơi hoang vắng (mn125, mn136, sn4.20) · `kharājinaṁ` thành da linh
  dương thô (mn51, mn94, an4.198) · `sīlabbataṁ` thành giới hạnh và lễ nghi (an3.78, an3.80) · `akhila` thành không
  chai cứng, theo snp1.12:6.3 · `abhikkantaṁ` thành Thật vi diệu thay (sn 33) · `acchariyaṁ … abbhutaṁ` thành
  kỳ diệu … hy hữu (dn10, dn28) · `Upāsakaṁ … dhāretu` thành nam cư sĩ (dn, 60 khoá) · `Kittāvatā` thành đến mức
  nào · `cetovimuttiṁ paññāvimuttiṁ … nirujjhanti` theo sn35.244, và cặp `parittacetaso`/`appamāṇacetaso` thành tâm
  còn hẹp hòi/tâm vô lượng, `anupaṭṭhitakāyassati` thành niệm thân chưa hiện tiền · `dīgharattaṁ hitāya sukhāya` thành
  lợi ích và an lạc lâu dài (50 khoá) · khoá 0.2 thành 13. Phẩm Gia Chủ như sn35.127 và sn35.131 · 0.3 thành Kinh
  Lohicca, trùng dn12:0.2.

  Bất định đã ghi, không che. Một: `bharatakānaṁ` ở 1.3 không có tiền lệ nào trong tầng; dịch "đám người làm thuê"
  theo nghĩa kẻ làm công, gần Thích Minh Châu (nô tì khuân vác), còn Sujato đọc khác (so-called inheritors of
  Vedic culture); chọn nghĩa kẻ thấp hèn vì lời mỉa của các cậu nhắm vào việc những kẻ hạ cấp mới tôn kính sa-môn.
  Hai: `seleyyakāni` ở 1.2 không có tiền lệ; dịch "đủ trò chế giễu" theo Sujato (jeers) vì dấu hai chấm dẫn vào lời
  chế giễu, còn Thích Minh Châu là trò chơi nghịch ngợm. Ba: `purāṇaṁ saranti` ở 2.2 không nêu tân ngữ; giữ "điều xưa
  cũ", không thêm "cổ luật" của Thích Minh Châu hay "legends" của Sujato. Bốn: `japāmaseti` ở 4.1 dịch "chúng ta
  tụng niệm", không đóng nháy vì Pāli không có nháy ở khoá này. Năm: `puthuattadaṇḍā` ở 4.3 dịch "vung nhiều gậy
  gộc" (Sujato take up many arms, Thích Minh Châu dùng nhiều loại gậy gộc), nghĩa bóng bạo lực cũng có thể. Sáu:
  `virajjamānā sataṇhātaṇhesu` ở 4.4 dịch "thờ ơ với cả kẻ còn tham ái lẫn người không còn" theo Sujato (indifferent);
  Thích Minh Châu đọc khác (giữa kẻ tham, bậc Thánh), câu này khó. Bảy: `Vaṇṇā ete` ở 6.5 là "vẻ ngoài", và
  `kiñcikkhabhāvanā` ở 6.6 dịch "chỉ để mưu chút lợi lộc" theo Sujato (profits) và Thích Minh Châu (lợi nhỏ) cùng
  hướng nhưng từ này hiếm. Tám: `udakācamanāni` dịch "dùng nước súc miệng" (ācamana vừa là súc miệng vừa là nhấp nước
  nghi lễ; dn2:62 là lễ súc miệng). Chín: `dvāra` giữ là "cửa" mà không thêm "căn", vì Pāli không có `indriya`; phần
  giải thích ở 12.3–12.10 và 13.3–13.10 làm rõ đó là sáu cửa giác quan; Sujato thêm sense, Thích Minh Châu thêm căn,
  thag1.116 dịch "các cửa đã gác giữ". Mười: `lohiccakulaṁ` ở 14.7 là Lohicca tự nói về nhà mình nhưng bằng tên;
  giữ "gia đình Lohicca", không đổi ngôi. Mười một: `Dhamme` ở 3.1 dịch "pháp" chữ thường, vì đang là lời kệ nói về
  Bà-la-môn xưa chứ không phải Pháp của Đức Phật; Sujato dịch virtue.

  `technical_integrity` bằng 9,6 vì lát này bị cấm chạy cổng, nên không thể tuyên bố technical gate đã pass. Bốn lệnh
  còn lại do người điều phối hoặc CI chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
