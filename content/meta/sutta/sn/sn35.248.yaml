notes: |-
  **65 khoá** (0.1–0.3, 1.1–1.11, 2.1–2.17, 3.1–3.4, 4.1–4.4, 5.1–5.4, 6.1–6.4, 7.1–7.6, 8.0–8.5, 9.0–9.5), viết đủ cả 65; tập khoá Việt == tập khoá Pāli (65 == 65), thứ tự khoá == thứ tự Pāli; không khoá nào ngoài tập.
  **Trùng nguyên văn (chỉ mục toàn kho 284.708 khoá Pāli, 165.642 khoá Việt): 13/65 khoá có Pāli trùng ở bài khác.** Dùng lại nguyên văn 7 khoá: `0.2` *19. Phẩm Rắn Độc* (8 nơi) · `2.2` *Rồi này các tỳ-kheo, Vepacitti, vua A-tu-la, gọi các A-tu-la:* (`sn11.4:1.3`) · `2.4` (`sn11.4:1.5`) · `2.6` (`sn11.4:1.7`) · `7.5` *Thứ mười một.* (56/58 nơi) · `8.0` *Tóm lược:* (359/476 nơi, cả `sn35.103:6.0`) · `9.0` *Kệ tóm tắt của phần năm mươi kinh ấy:* (3/3 nơi trong `sn35`). **Trùng nhưng không theo nguyên văn, có lý do (6 khoá):** `2.1` (2 nơi: `sn56.41:3.2` *tranh chấp*, `an9.39:3.1` *cuộc chiến*) dùng khuôn `an9.39:3.1`/`sn11.4:1.2` với *trận chiến* + *A-tu-la* (118 nơi viết hoa, 71 nơi viết thường; chọn theo `sn11.4`); `3.4`, `4.4`, `5.4`, `6.4`, `7.4` (`evañhi vo, bhikkhave, sikkhitabbaṁ` — 5 nơi *đây là điều các ông cần phải học*; `…sikkhitabban”ti` 17 nơi *vì thế nên các ông cần phải học tập*) không theo vì ở các nơi ấy câu đứng sau một mệnh đề riêng, còn ở đây nó nối tiếp lời tự nhủ ‘Chúng ta sẽ sống với tâm …’ qua dấu gạch — dịch *các ông cần phải học tập như vậy.* Dẫn khuôn gần nhất: `2.3` / `2.5` dựng từ `sn11.4:1.4` / `1.6` (khác ở *devāsurasaṅgāme* và đích đến *asurapuraṁ* / *sudhammaṁ devasabhaṁ*), `2.10` / `2.13` lấy cụm *hợp pháp / phi pháp* của `sn11.10:1.5`.
  **Pāli trùng trong chính bài: 1 nhóm (`3.4`/`4.4`/`5.4`/`6.4`, 4 khoá), Việt giống nhau cả 4; 0 cặp Pāli trùng mà Việt khác.** Bốn khối lặp `maññita` / `iñjita` / `phandita` / `papañcita` / `mānagata` (`3.1`/`4.1`/`7.1` đủ 9 mục; `5.1`/`6.1` rút gọn bằng `…pe…` và `…`) được in cặp Pāli↔Việt đọc đối kháng từng mục: không khối nào mang nội dung của khối kia.
  **Dấu lược:** Pāli có `…` ở 4 khoá (`1.8`, `1.9`, `5.1`, `6.1`); mỗi khoá đếm lược(vi) == lược(pāli) (`1.8` một, `1.9` một, `5.1` và `6.1` mỗi khoá sáu — một `…pe…` + năm `…`); khoá khác không có. Nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá, 0 lệch trên 65 khoá. NFC đạt; không khoảng trắng đôi; Pāli lọt sang Việt chỉ ở tên riêng/tên gọi giữ nguyên (*Saṁyutta Nikāya*, *Sakka*, *Vepacitti*, *Sudhammā*, *Māra*, *kiṁsuka*).
  **Số Pāli (tự tính):** `cha` = *sáu* (1.2, 1.3, 1.4) · `sattama` = *thứ bảy* (1.5, 1.6, 1.7, 1.11) · `kaṇṭhapañcamehi bandhanehi` = *năm mối trói gồm tứ chi và cổ* (kaṇṭha + pañcama: bốn chi + cổ là mối thứ năm; theo `sn11.4`; 2.3, 2.5, 2.7, 2.8, 2.11, 2.14) · `pañca kāmaguṇā` = *năm dục công đức* (2.11, 2.14) · `tāvatiṁsa` = *Ba Mươi Ba* · `ekādasama` = *thứ mười một* (7.5) · `catuttha` = *thứ tư* (7.6, 8.5) · `saṭṭhi` = *sáu mươi* (9.1) · 9 mục của công thức *asmī … nevasaññīnāsaññī* đếm đủ 9 ở `3.1`/`4.1`/`7.1` và 9 ở `5.1`/`6.1` (hai mục đầu đủ, bảy mục sau rút gọn bằng dấu lược). 0 số lệch.
  **Tiền lệ thuật ngữ đã tra kèm đếm:** `assutavā puthujjano` → *kẻ phàm phu chưa học* (`sn35.246`, `sn35.228–229`, 6+ nơi trong `sn`; toàn tầng còn có *ít nghe / không có học* ít hơn); `manāpāmanāpa` → *khả ý và bất khả ý* (cùng phẩm `sn35.238:11`; 3 nơi *khả ý* so với 16 *khả ái* trong `sn`, chọn theo cùng phẩm); `haññati` ở 1.8–1.10 → *bị đập* (để giữ ví dụ cái đập; ở `sn35.238:11` cùng gốc dịch *bị tổn hại* vì không có ví dụ đập); `byābhaṅgi` → *cái đập* (bản `mn96`/`an5.7` là *đòn gánh / chày*, là nghĩa khác của cùng từ trong ngữ cảnh thợ gặt; ví dụ ở đây là đập lúa); `suhata` → *đập kỹ* (không có tiền lệ); `moghapuriso` → *người rỗng tuếch* (53 nơi, *kẻ rỗng tuếch* 1 nơi); `yava` → *lúa mạch* (không có tiền lệ trong tầng; `mil3.1.8` giữ *yava*); `ceteti` (`punabbhavāya`) → *khởi ý hướng đến tái sinh* (không có tiền lệ); `maññita` / `maññati` → *tưởng nghĩ* (78 khoá, cùng phẩm `sn35.30–31`; *tưởng tư* 26 nơi chủ yếu ở `mn140:31`, nơi có đúng công thức chín mục này; *tưởng tượng* 14 nơi, trong đó `sn22.64` có đúng câu *maññamāno baddho mārassa* — chọn *tưởng nghĩ* vì cùng `sn35` và đã dùng cho `sabbamaññita`); `iñjita` → *lay động* (`iñjati`: *lay động* ở 54 khoá, kể cả `dn2:26`); `phandita` → *giãy giụa* (`an8.56:4.4` *phandamānaṁ* → *giãy giụa*; cách duy nhất có tiền lệ cho gốc này; bản Thích Minh Châu dịch *chấn động*); `papañcita` → *hý luận* (9 nơi trong `sn`; *phóng diễn* 20 nơi chủ yếu ở `mn`); `mānagata` → *rơi vào mạn* (không có tiền lệ cho dạng này; *mạn* 79 nơi); `nihatamāna` → *đã dẹp tan mạn* (không có tiền lệ); `rogo / gaṇḍo / sallaṁ` → *bệnh / ung nhọt / mũi tên* (khuôn `mn140:31.2`; *ung nhọt* 6 trong 10 nơi có `gaṇḍa`, *mũi tên* 45); *ayamahamasmī* → *ta là cái này* (`sn22.47`, `dn34`; `mn140` dùng *tôi*), *nevasaññīnāsaññī* → *không có tưởng cũng không phải không có tưởng* (`mn140:31.1`, 1 nơi; *không có tưởng cũng không không có tưởng* 2 nơi trong `sn22.47` — chọn dạng rõ hơn); `kāmaguṇā` → *dục công đức* (`sn` 8 nơi *năm dục công đức* và 8 nơi *năm dục*); `parihāyati` → *bị mất*; `pāpimā` → *Ác Ma* (282 nơi), `māra` → *Māra* (238 nơi); `mārisā` → *hiền hữu* (`sn11.4`); `sakka`, `vepacitti`, `sudhammā` giữ tên.
  **Bất định, ghi tại đây, không thêm vào thân kinh.** (1) `2.10` / `2.13` *idheva dānāhaṁ devapuraṁ gacchāmī / tattheva dānāhaṁ asurapuraṁ gamissāmī*: nghĩa đen *ngay tại đây, bây giờ ta đi đến thành chư thiên* / *ngay tại đó, bây giờ ta sẽ đi đến thành các A-tu-la*; Sujato đọc là *Now I belong right here in the castle of the gods* / *I will go over there to the citadel of the titans*, bản Thích Minh Châu *Nay ta đi đến thành của chư Thiên* / *Ở đây, ta sẽ đi đến thành của các A-tu-la*. Có thể hiểu *idheva* là *tại nơi chư thiên này* thay vì *trong chính giảng đường*; văn dịch bám nghĩa đen và không bình giải. Không đổi giáo nghĩa của đoạn (ý chính vẫn là Vepacitti thấy mình được cởi trói / bị trói tùy theo ý nghĩ về bên nào hợp pháp). (2) `8.2` *avassuto* trong kệ tóm lược: chọn *mưng mủ* theo `sn35.241:6.2` và `an4.243:3.3` (cùng từ *avassuto kasambujāto* → *mưng mủ*); đây là tên kinh `sn35.243` (Sujato: *Explanation on the Festering*), kinh chưa dịch trong kho khi viết bài này; nếu bản của `sn35.243` chọn khác thì nên đồng bộ hai chỗ. Cũng `8.3` *kiṁsukā* giữ *kiṁsuka* (tên cây, tiền lệ `tha-ap496:1.1`, `tha-ap355:1.1`), không dịch *hạt cải* như `ja248` (lệch từ nguyên). (3) `9.3`–`9.4` *Catupaṇṇāsakā ete, nipātesu pakāsitā*: hiểu *catupaṇṇāsakā* là *bốn phần năm mươi* (khớp bốn lời kết *paṭhama / dutiya / tatiya / catutthapaṇṇāsako* của `sn35`) và *nipāta* là *tập*; Sujato bỏ trống khoá này và tầng Việt không có tiền lệ; nghĩa chắc là phần tóm lược cuối Tương Ưng Sáu Xứ nhưng cách xác định đơn vị *nipāta* không phân xử được từ tầng đã ghim. (4) `1.8` / `1.9` bản Sujato bỏ `…pe…` thành `… nose … tongue … body …`; ta giữ đúng một `…` cho mỗi `…pe…` của Pāli. (5) `3.3` *Tasmātiha … ‘…’ti— / evañhi vo … sikkhitabbaṁ*: Pāli tách mệnh lệnh học tập khỏi lời tự nhủ bằng gạch ngang qua ranh giới khoá; Việt giữ gạch và dịch *các ông cần phải học tập như vậy* ở khoá sau, không thêm *nên học như vầy* vào khoá đầu.
  **Coverage Anh (công thức mục 7 của kho): mẫu số = 43 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); `english-sujato` phủ 42/43 (97,7%).** Khoá duy nhất Sujato bỏ trống là `8.5` (câu kết phần năm mươi, 42 ký tự — chỉ vừa qua ngưỡng 40); lớp `english-project` có đúng `8.5` (1/43; bản lấp ghi *Sixes Vagga*, không khớp Pāli *Saḷāyatanavagge* — việc của lớp English, không sửa ở đây). Không có tầng Việt hiện hành phân đoạn (bilara chỉ có Pháp Cú); bản Hòa thượng Thích Minh Châu của `sn35.248` có ở dạng nguyên bài (tra cứu toàn văn, không căn theo segment) và được đọc đối chiếu: *Bó Lúa* — cùng cấu trúc năm mục (tư tưởng / động chuyển / chấn động / hý luận / ngã mạn). Ngưỡng 0,8 đạt; không cần ghi nhận gap.
  **Phương án đã cân nhắc và loại:** (a) *chấn động* (Thích Minh Châu) cho `phandita`, vì *rung động / chấn động* trong tầng này chủ yếu dịch `kampati` / `sampavedhati`, còn gốc `phand-` có tiền lệ *giãy giụa* ở `an8.56:4.4`; (b) *đòn gánh* cho `byābhaṅgi` theo `mn96`/`an5.7`, sai ngữ cảnh đập lúa; (c) *bị tổn hại* cho `haññati` ở 1.8 theo `sn35.238:11`, làm mất hình ảnh cái đập của ví dụ. Nháy đơn khoá `5.1` / `6.1` đã đếm lại từng khoá theo Pāli (sáu `…` mỗi khoá, chín nháy mở).
  **Kiểm tra kỹ thuật:** bị cấm chạy cổng nên chưa tuyên bố pass; `technical_integrity` đặt 9,6. Cần chạy lại `npm run validate`, `npm test`, `npm run check`, `npm run build` trước khi gộp.
