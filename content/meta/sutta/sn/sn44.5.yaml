notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    **Bốn bài `sn38.9/11/12/14` dùng nguyên văn khung của `sn38.8*`** (lát 34, đã `published`): cùng phẩm Jambukhádaka, cùng hai người nói, cùng mười một vế hỏi–đáp. Chỉ đổi danh từ cần định nghĩa và số từ xưng.
  - >-
    **`an3.74*` đã `published` là bản song song của `sn47.1`** — cùng câu `sattānaṁ visuddhiyā … sacchikiriyāya`, cùng nơi `Vesālī, ambapālivana` → cụm đó dùng lại **nguyên văn**: *để thanh tịnh hóa chúng sinh, vượt qua sầu than, chấm dứt khổ ưu, đạt được đạo lý, và tự chứng Niết-bàn*.
  - >-
    **`sn48.45*` (lát 35) là bài ngay trước của `sn48.46`**, cùng khung `Katinaṁ nu kho … khīṇāsavo bhikkhu aññaṁ byākaroti` → dùng lại **nguyên văn** cả mười khoá, kể cả `2.1` bị `…pe…` cắt. Vế `tadanvayā saddhā saṇṭhāti…` của `sn48.52:3.3` cũng lấy nguyên văn từ `sn48.45:2.4`.
  - >-
    **`sn45.19*` (lát 34) là bài anh em của `sn45.18`**, cùng khung `Kukkutārāma` với `Sādhu sādhu` / `Bhaddako kho te` / `Evañhi tvaṁ … pucchasi` → dùng lại **nguyên văn** `2.3–2.8`, kể cả cách viết lặp `Phi Phạm hạnh` ở `2.1` và `2.6`.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Đo lại trên toàn bộ segment Việt đang có trong `content/translation/vi/project/` (bỏ 22 tệp trong thư mục APFS orphan): **khớp 46.755 / 47.140 = 99,18%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ.
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Dùng lại: `Jambukhādakavagga` → *1. Phẩm Jambukhádaka* (`sn38.8`) · `Avijjāvagga` (Sn 45) → *1. Phẩm Vô Minh* (`sn45.1`) · `Pabbatavagga` → *1. Phẩm Núi* (`sn46.7`) · `Jarāvagga` → *5. Phẩm Già* (`sn48.45`) · `Sūkarakhatavagga` → *6. Phẩm Núi Khỉ* (`sn48.59`) · `Ananussutavagga` → *4. Phẩm Chưa Từng Nghe* (`sn47.36`) · `Oghavagga` (Sn 46) → *13. Phẩm Dòng Chảy* (`sn46.121-129`). **Phân kỳ chưa giải quyết:** `Vihāravagga` — 7 bài ghi *2. Phẩm Tào Môn*, chỉ `sn45.19` ghi *Phẩm Thiền*; bài này theo đa số. `Sukhindriyavagga` — chia làm ba: *Căn Sước* (2 bài), *Căn Lành* (2 bài), *Lạc Căn* (1 bài, `sn48.35` — bài ngay trước); bài này theo `sn48.35`. **Ba phẩm 0 tiền lệ:** `Abyākatavagga` → *1. Phẩm Không Tuyên Bố* (theo `an7.60`) · `Ambapālivagga` → *1. Phẩm Cây Mít* · `Vibhaṅgasutta` → *Kinh Chia Ra (Nhất)*. **Người biên tập nên thống nhất các chỗ phân kỳ.**
  - >-
    **Lỗi lặp mà lượt review đối kháng bắt được:** bản nháp đầu viết đủ sáu vế `avigataraṅga…` ở `1.11`, nhưng Pāli ở đó chỉ còn `vigatarāgassa …pe…` — **vế bị che không được viết lại**. Bản Việt nay dừng đúng ở *với kẻ đã hết tham …*; người đọc muốn đủ sáu vế thì đã có ở `1.15`, nơi Pāli hiện đủ.
  - >-
    **Tên riêng phải phiên âm, ghi kèm lý do:** `koṭṭhika` **0 tiền lệ** trong kho và harness chặn chuỗi Pāli lọt vào bản Việt. Bài này dùng **Cốt-thi-ka** cho `sāriputtakoṭṭhika` và **Đại Cốt-thi-ka** cho `mahākoṭṭhiko` — giữ **hai** tên ấy khác nhau vì Pāli cũng khác (`sāriputtakoṭṭhika` và `mahākoṭṭhiko`), và giữ nhất quán trong cùng một bài. **Lệch với `sn22.127*` đã `published`, dùng “Tôn giả Mahākoṭṭhita”. Người biên tập nên thống nhất.**
  - >-
    0 tiền lệ cho danh sách `avigatarāgassa … avigatataṇhassa` → *kẻ chưa hết tham, chưa hết ham muốn, chưa hết khốn khổ, chưa hết khát khô, chưa hết nóng bức, chưa hết ái* (`pariḷāha` = nóng bức, không có tiền lệ sạch trong kho). `taṇhā` → *ái* theo **`sn38.10:1.1` đã `published`**, cùng phẩm — lưu ý kho còn đang dùng *khát ái* ở nhiều chỗ khác.
  - >-
    `neva hoti na na hoti tathāgato paraṁ maraṇā` dịch **nguyên văn** `sn33.55:1.5` và `sn33.6-10:1.5` → *Như Lai chẳng tồn tại chẳng không tồn tại sau khi chết* (kho còn một cách nữa ở `sn33.51:1.6` là *Như Lai sau khi chết không có, cũng không không có* — **cần thống nhất**). `hoti tathāgato paraṁ maraṇā` → *Tứ Thế Tôn tồn tại sau khi chết*.
  - >-
    `1.2` `(sāyeva pucchā.)` là chú thích của chính Bilara, dịch *(chỉ hỏi thôi.)*; `Tatiyasāriputtakoṭṭhikasutta` → *Kinh Sāriputta Và Cốt-thi-ka (Ba)* (0 tiền lệ, `sn44.1–4` chưa dịch). `Abyākatavagga` → *1. Phẩm Không Tuyên Bố* theo `an7.60`.
