notes:
  - >-
    **⚠ SỬA LỖI CHẶN: bản đầu tôi thêm mệnh đề không có trong Pāli.** Tôi viết
    *“số ít là kẻ nào biết, kẻ nào thấy thì …”* — Pāli chỉ có `Kathaṁ nu kho,
    bhante, jānato, kathaṁ passato āsavā pahīyantī`, tức *thế nào khi biết, thế
    nào khi thấy thì các lậu được đoạn trừ*. Vế “số ít là” là của họ `sn56`, tôi
    lấy nhầm sang đây. Với bản chữ, người đọc tưởng Đức Phật nói số ít người
    biết — trái hẳn ý kinh. Đã sửa thành *khi biết, khi thấy, …*.
  - >-
    `bhante` → *bạch Thế Tôn*; `āsava` → *lậu* (`an10.139:0.3`); `samugghāta` →
    *bị nhổ bỏ tận gốc* (0 tiền lệ, đặt mới); `anusaya` → *thiên hướng* theo
    quyết định chung của kho (PR #116).
  - >-
    **Quy ước dấu lược của kho, đã đo lại chứ không phải đoán:** trong 1.535
    segment đã `published` có `…` trong Pāli, chỉ **617** (40%) giữ **đúng số**
    dấu, và cặp lệch phổ biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` →
    `…`). Vì vậy quy tắc của kho là **có/không có `…` phải khớp theo từng
    segment**, không phải khớp số; tôi giữ đúng quy ước đó.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Hòa thượng Thích
    Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
