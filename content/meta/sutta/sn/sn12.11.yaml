  **DÙNG LẠI NGUYÊN VĂN, đo được 26/32 khoá.** Sáu khoá phải dịch mới: `0.3`
  (tên bài), `1.3`, `1.6`, `2.1`, `3.1`, và `0.1` (dòng tên bộ, giữ nguyên như mọi tệp
  khác của tầng). Cụ thể:
  · `0.2` `2. Āhāravagga` trùng nguyên văn ở **9 khoá** của 6 bài anh em đã có bản Việt
    (sn12.12–16, 18, 19) → *2. Phẩm Đoàn Thực* (**6** khoá cùng cách).
  · `1.2` trùng `sn12.61:1.2` → *Một thời, Đức Phật ở Sāvatthī, tại rừng Jeta, trong tu
    viện của ông Anāthapiṇḍika …* (1 khoá).
  · `1.5` `Kabaḷīkāro āhāro oḷāriko vā sukhumo vā …` trùng nguyên văn `mn38:15.3` →
    *Đoàn thực, thô hay tế; xúc là thứ hai; ý tư là thứ ba; và thức là thứ tư.*
  · `1.4` `Katame cattāro?` trùng **248** khoá → *Thế nào là bốn?* (**144**).
  · `2.2`–`2.16` (15 khoá) trùng nguyên văn với `mn38:16.2`–`16.16` và `mn11:16.x`; tôi
    theo **cách của `mn38`** (bản đã `published`), vì đo được nó là đa số: *X lấy Y làm
    nhân, làm nguồn sinh, làm chỗ phát sinh và làm nguồn gốc* (**16** khoá) và *X lấy gì
    làm nhân, …* (**8**) so với *X là nguồn, là nguyên nhân, là nơi sinh, là khởi điểm
    của Y* (**7**) và *…, này các tỳ-kheo, nguồn, nguyên nhân, nơi sinh và khởi điểm
    của nó là gì?* (**7**). `mn11` là biến thể khác của **cùng Pāli**, đã `published`; tôi
    chọn theo đa số đo được và ghi lại đây để người biên tập gộp nếu muốn thống nhất.
  · `3.2` (trùng 19 khoá) → *do duyên hành mà có thức …*; `3.3` (38 khoá) → *như vậy là
    sự tập khởi của toàn bộ khối khổ đau này.*; `3.4` (14 khoá) → *Do vô minh diệt tận
    không còn dư mà hành diệt;*; `3.5` (14 khoá) → *do hành diệt mà thức diệt …*; `3.6`
    (17 khoá) → *như vậy là sự đoạn diệt của toàn bộ khối khổ đau này”.*; `3.7` (319 khoá)
    → *Thứ nhất.* (**291**).
  
  **Thuật ngữ, kèm số đếm trên toàn tầng 5.343 tệp Việt:** `āhāra` → *đoàn thực*
  (**3** khoá: sn12.13–19 dùng cho tên phẩm `Āhāravagga`, mn38:15.3 cho `kabaḷīkāro
  āhāro`) — đây là số mỏng nhất trong bài này, nên tôi bám theo tên phẩm đã có sẵn của
  chính phẩm thay vì tự đặt; `sattāna` → *hữu tình* (**111** khoá, 39 tệp) thay vì
  *chúng sinh* (**1.448**), vì `mn38:15.1` — bản song song trực tiếp — dùng *hữu tình*
  cho đúng cụm này và `bhūtānaṁ vā sattānaṁ` đòi một danh từ bao được cả hai vế;
  `manosañcetanā` → *ý tư* (**30** khoá, 16 tệp) chứ không phải *ý định của tâm*
  (**2**); `oḷāriko vā sukhumo vā` → *thô hay tế* (**46**); `phasso` → *xúc* (**1.592**);
  `saḷāyatana` → *sáu xứ*; `nāmarūpa` → *danh-sắc*; `viññāṇa` → *thức*; `saṅkhārā` →
  *các hành*; `avijjā` → *vô minh*; `dukkakkhandha` → *khối khổ đau* (**31**).
  
  **Chỗ 0 tiền lệ, tôi dịch mới và ghi lý do:** `0.3` `Āhārasutta` — toàn tầng chỉ có
  hai bài mang đúng tên Pāli này (`sn12.11`, `sn46.51`) và `sn46.51` chưa dịch, nên 0
  tiền lệ; tôi đặt *Kinh Đoàn Thực* theo đúng tên phẩm `2. Phẩm Đoàn Thực` đã có sẵn
  của phẩm. `2.1` Pāli chỉ khác `mn38:16.1` ở chữ `ca`, nên tôi dịch mới nhưng giữ nguyên
  bốn vế `làm nhân / làm nguồn sinh / làm chỗ phát sinh / làm nguồn gốc`. `1.3` và `1.6`
  trùng Pāli với `sn12.12:1.2`, `sn12.63:1.2`, `sn12.64:1.2` — nhưng cả ba bài đó **chưa
  được dịch**, nên hai khoá này dựa vào `mn38:15.1` (đã `published`) chứ không phải vào
  bản Việt của bài anh em.
  
  **Bất định đã ghi, không che:** `2.2` để *"Chúng lấy ái làm nhân…"* chứ không nói thẳng
  *"Bốn đoàn thực ấy lấy ái…"* — đây là nguyên văn `mn38:16.2` đã `published`, tôi giữ
  nguyên để hai bài không lệch; nhưng chủ thể Pāli (`Ime cattāro āhārā`) bị lược đi,
  người đọc phải bám câu hỏi ở `2.1` mới thấy rõ. `1.5` bỏ chữ *Kabaḷīkāro* vì `mn38`
  đã vậy và `kabaḷīkāro` không có tiền lệ nào trong tầng (0 khoá); tôi không thêm từ
  chú giải vào thân kinh. Ba bản Việt của cùng Pāli `Taṇhā vedanānidānā…` đang tồn tại
  hai cách trong tầng (`mn11` và `mn38`) — tôi chọn `mn38` theo đa số đo được, không sửa
  `mn11`.
  
  **Dấu lược:** `1.2`, `3.2`, `3.5` giữ **đúng một** `…` mỗi khoá, khớp Pāli (`…` trần ở
  `1.2`, `…pe…` ở `3.2` và `3.5`); không mở rộng, không bỏ. Không có `(…)` đứng một
  mình. Ngoặc kép cân trên cả bài: mở ở `1.3`, đóng ở `3.6`.
  
