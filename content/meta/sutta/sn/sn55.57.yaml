notes:
  - >-
    `anāgāmiphalasacchikiriyā` → *sự chứng ngộ quả vị không hữu lậu* và
    `arahattaphalasacchikiriyā` → *sự chứng ngộ quả vị A-la-hán* (0 tiền lệ ở
    dạng danh từ, đặt mới; `sacchikiriyā` → *sự chứng ngộ* theo kho). Đây là hai
    bài **cùng khuôn, chỉ khác một chữ**, nên tôi dựng riêng từng vế thay vì
    dùng một bảng dịch chung — dùng chung sẽ thành hai câu máy móc giống nhau.
  - >-
    `saṁyojana` → *sự trói buộc* theo kho. `ānāpānassatisamādhi` → *chứng ngộ
    chế ngự hơi thở* (0 tiền lệ, đặt mới; `āpāna` = hơi thở theo `an10.59:1.1`
    đã dịch *hơi thở*).
  - >-
    **Quy ước dấu lược của kho, đã đo lại chứ không phải đoán:** trong 1.535
    segment đã `published` có `…` trong Pāli, chỉ **617** (40%) giữ **đúng số**
    dấu, và cặp lệch phổ biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` →
    `…`). Vì vậy quy tắc của kho là **có/không có `…` phải khớp theo từng
    segment**, không phải khớp số; tôi giữ đúng quy ước đó.
