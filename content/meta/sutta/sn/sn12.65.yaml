notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không căn theo segment nên chỉ dùng để đối chiếu thuật ngữ và mạch lập luận, không làm tầng cột). Tầng `vietnamese-current` căn theo segment không có cho bài này (tại commit đã ghim chỉ có 26 chương Pháp Cú); tầng `english-project` chưa có bản lấp cho bài này.
  Coverage English = **39/39** khoá Pāli có nội dung = **100%** (Pāli ≥ 40 ký tự, bỏ khối `:0`), cao hơn xa ngưỡng 0,8. Sujato có khoá cho 105/105 khoá; chỉ 3 khoá Sujato để trống, đều dưới ngưỡng nội dung: `8.9` và `8.19` (`Tamanugacchiṁ;`, câu lặp ngắn) và `8.26` (colophon `Pañcamaṁ.`). Bài không cần entry trong `content/meta/reference-gaps.yaml`. Triangulation ở đây là Pāli + Sujato độc lập + bản Việt nguyên bài; không có lớp lấp của dự án nên không có chỗ nào tự đánh bài của mình.
  **Số Pāli.** `aṭṭhaṅgiko` = *tám ngành* (`aṭṭha` 8); `saḷāyatana` = *sáu xứ* (`saḷ` 6); `Pañcamaṁ` = *Thứ năm* (`pañcama` thứ 5: `sn12.61`, `sn12.62`, `sn12.63`, `sn12.64`, `sn12.65` là năm bài liên tiếp trong 7. Mahāvagga, trong sn, `Pañcamaṁ.` dịch *Thứ năm.* ở 118 khoá, *Bài thứ năm.* ở 5 khoá). Không còn số nào khác.
  **Dùng lại nguyên văn đã có, đếm được.** 35 khoá Pāli trùng nguyên văn với khoá của bài khác, tổng 879 cặp; 24 khoá dùng đúng nguyên văn Việt đã có ở ít nhất một cặp (`0.2` *7. Phẩm Lớn* 24/24 cặp; `1.1` *Trú ở Sāvatthī.* 95 cặp so với 52 *Đang sống tại Sāvatthī.*; `1.4`, `1.5`, `1.7`, `1.9`, `2.2` và `4.8` lấy từ `sn12.10`; `3.4`–`3.6` lấy dạng *do duyên … mà có …*; `3.7` *như vậy là sự tập khởi của toàn bộ khối khổ đau này.* dạng nhiều nhất, 15/35 cặp trong sn; `6.7` *như vậy là sự đoạn diệt của toàn bộ khối khổ đau này.* dạng nhiều nhất, 6/17 cặp trong sn; `8.2` *Chính là Thánh đạo tám ngành này, tức là—* 7 cặp; `8.3` *chánh kiến … chánh định.* 29 cặp; `8.26` *Thứ năm.* 261/267 cặp toàn tầng). Trong 879 cặp có 345 cặp bản Việt khác, gần hết là khác diễn đạt trên cùng nghĩa: câu dẫn *Tassa mayhaṁ, bhikkhave, etadahosi:* (27 cặp khác; dạng nhiều nhất, 13/41 cặp, là *Này các tỳ-kheo, rồi Ta nghĩ:*, chọn dạng này vì giữ được vocative `bhikkhave` mà `sn12.10` bỏ), và công thức `yoniso manasikārā ahu paññāya abhisamayo:` (4 cặp khác, đều từ `sn12.10` bỏ vocative; ở đây thêm *Này các tỳ-kheo,* để đủ ý `bhikkhave`). Trong chính bài có 4 nhóm Pāli trùng nguyên văn (6 khoá `etadahosi:` là `1.6`, `2.1`, `2.13`, `4.1`, `4.7`, `5.1`; 6 khoá `yoniso manasikārā …` là `1.8`, `2.11`, `2.15`, `4.4`, `4.17`, `5.4`; cặp `3.1` với `6.1`; cặp `8.9` với `8.19`) và cả 4 nhóm bản Việt giống nhau nguyên văn (0 nhóm khác).
  **Thuật ngữ chọn theo tiền lệ đếm được.** `jarāmaraṇa` → *già và chết*: bài có 4 khoá Pāli trùng nguyên văn với `sn12.10` (`1.4`, `1.5`, `1.7`, `1.9`) mà `sn12.10` đã dịch *già và chết*, nên dùng lại và giữ nhất quán trong cả bài; ở sn12 toàn bộ khoá chứa *già chết* 124, *già và chết* 34, *già-chết* 23 (hai dạng đầu cùng nghĩa; bài này chọn dạng của bài anh em cùng công thức). `nissaraṇa` → *thoát ly* theo `sn12.10` (sn: *thoát ly* 23 khoá). `upādāna`/`taṇhā`/`vedanā` → *thủ*/*ái*/*thọ* trong chuỗi mười hai chi, theo `sn12.10` và `dn14` (chuỗi công thức Bồ-tát tìm ra duyên khởi); ở sn12, *do duyên thủ* 3 so với *do duyên chấp thủ* 5, *do duyên ái* 3 so với *do duyên khát ái* 4 — hai dạng gần ngang nhau nên chọn dạng của bài anh em. `nāmarūpa` → *danh sắc* (sn12: 102 so với *danh-sắc* 2). `saḷāyatana` → *sáu xứ* (sn12: 69 so với *sáu căn* 22). `nirodha` → *đoạn diệt* xuyên suốt, theo `sn12.10` và `dn14`; ở sn12 *đoạn diệt mà* 36, *diệt tận mà* 43 và *diệt mà* 50 — gần ngang nhau; chọn *đoạn diệt* để cặp với *tập khởi* (không dùng *diệt tận* như một số bài khác trong tầng). `samudaya` → *tập khởi*. `bodhisatta` → *Bồ-tát* (37 tệp toàn tầng so với 1 tệp *Bồ tát*, gồm `sn12.10`, `mn19`, `mn26`, `dn14`). `sambodhā` → *giác ngộ*. `yoniso manasikārā` → *tác ý như lý* (glossary, `sn12.10`). `cakkhuṁ … āloko udapādi` → *mắt, trí, tuệ, minh và sáng được khởi lên* theo `sn12.10`, `dn14`. `abbhaññāsiṁ` → *biết rõ* (toàn tầng *biết rõ* 2.027 lần so với *thắng tri* 702 lần; chọn dạng đa số). `nagara` → *thành*; `rājadhāni` → *kinh đô* (dn14, dn17). `sammāsambuddha` → *Chánh Đẳng Giác*. `brahmacariya` → *phạm hạnh* (sn: 289 khoá so với *Phạm hạnh* viết hoa 86). `Mahāvagga` → *Phẩm Lớn* (24/24 khoá trong tầng). Tiêu đề `Nagarasutta` → *Kinh Thành Phố* (theo nghĩa `nagara` là *thành phố*; Sujato *The City*, Thích Minh Châu *Thành Ấp*; tầng không có tiền lệ dịch `nagara` làm tên kinh).
  **Bất định đã ghi nhận, không che.** (1) `7.3`/`7.6` `uddhāpavantaṁ`: nghĩa chính xác của `uddhāpa` (bờ lũy, nền đắp cao, hay tường thành) không phân xử được từ riêng Pāli; Sujato dịch *embankments*, Thích Minh Châu *thành lũy*; bài dịch *có thành lũy*, nghĩa rộng nhất bám Pāli. (2) `7.7` `māpehi`: Pāli chỉ nói `māpeti` (cho xây dựng) mà không có tiền tố *lại*; Sujato thêm *re-* (*rebuild*) và Thích Minh Châu *xây dựng lại*. Bài này dịch *cho xây dựng thành ấy* vì thành xưa đã được nêu rõ là *purāṇaṁ*, không thêm *lại*; hai cách hiểu cùng nghĩa trong bối cảnh. (3) `8.25` `Tayidaṁ … brahmacariyaṁ iddhañceva phītañca …`: Pāli không có từ nối nhân quả. Sujato dịch *And that's how …* (nối với câu trước như một hệ quả), tầng đã có `dn18:29.4` dịch *Nhờ vậy …* và `sn51.10:15.3` dịch *chính phạm hạnh ấy … đã thành tựu và phồn thịnh*. Bài này dịch *Chính phạm hạnh này … đã thịnh vượng và sung túc …* (không thêm quan hệ nhân quả mà Pāli không nói); dùng cùng cặp *thịnh vượng và sung túc* cho thành (`7.9`, có tiền lệ `sn55.21:1.4` cho đúng chuỗi `iddhañceva phītañca bāhujaññaṁ ākiṇṇamanussaṁ`) và cho phạm hạnh (`8.25`) để giữ phép so sánh song song của ví dụ. (4) `7.9` `vuddhivepullappattaṁ` → *đạt đến sự tăng trưởng và mở rộng* (tầng không có tiền lệ); Sujato *attained to growth and expansion*. (5) `1.2` Pāli đọc `Pubbe me` (không có `-va`) khác `sn12.10` `Pubbeva me`; Sujato dịch cùng nghĩa *before*, bài giữ cùng cách dịch với `sn12.10`; `1.3` đọc `kicchā` thay `kicchaṁ` của `sn12.10`, cùng nghĩa. (6) `3.3` `Ettāvatā`: dịch *Đến mức ấy* theo `dn14:2.19.3` (*Đến mức ấy, người ta có thể được sanh …*) với cùng chuỗi động từ giả định. (7) `3.2`: dịch *Thức này quay trở lại từ danh sắc, không đi xa hơn nữa* theo `dn14:2.19.2` (cùng Pāli, không có nháy trong bài này nên viết hoa đầu câu sau dấu gạch). (8) `4.2`–`4.3`, `4.5`–`4.6`, `4.18`–`4.19`, `5.2`–`5.3`, `5.5`–`5.6`: Pāli ngắt câu hỏi và đáp ở dấu chấm phẩy giữa hai khoá; bản Việt giữ dấu chấm phẩy ở khoá đầu và viết thường chữ đầu khoá sau, đúng như Pāli.
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 105/105, đúng thứ tự Pāli. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá, 105 khoá × 4 loại dấu (mẫu số 105, 0 lệch). Dấu lược: 26 khoá Pāli có dấu lược (6 khoá `…pe…` là `2.2`, `3.6`, `4.8`, `6.6`, `8.3`, `8.10`; 20 khoá `…` trần là `2.3`–`2.9`, `4.9`–`4.14`, `8.11`–`8.17`); cả 26 khoá Việt giữ đúng một `…`, không mở rộng thành văn, không có `…` ở khoá mà Pāli không có. NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang bản Việt (ngoại trừ tên bộ *Saṁyutta Nikāya* ở `0.1`, giữ nguyên như các khoá tiêu đề `:0.1` khác của sn).
