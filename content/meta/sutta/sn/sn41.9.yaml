notes: |-
  **Coverage Anh Sujato trên Pāli có nội dung: 31/31 = 100%.** Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708 (bilara chỉ phân phối 26 tệp tiếng Việt, toàn bộ là Pháp Cú), nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của kho.

  **Bài gần như chưa có tiền lệ: chỉ 4/37 khoá trùng nguyên văn Pāli.** Vì vậy mọi
  thuật ngữ dưới đây đều lấy theo ĐẾM trên tầng chứ không theo trực giác:
  `acelo kassapo` → *vị tu lõa thể* (dn8:1.3/14.1/16.1/17.1/18.1/24.4, 6/6) ·
  `gahapati` → *gia chủ* (**401**/571) · `kīvaciraṁ` → *đã bao lâu rồi* ·
  `vassi` → *năm* (giữ số đếm rõ ràng) ·
  `uttari manussadhammā alamariyañāṇadassanaviseso` → *pháp siêu nhân, tri kiến xứng
  đáng bậc Thánh* (**31**/32; chỉ `mn128` dùng *pháp thượng nhân, tri kiến thù
  thắng*) · `phāsuvihāro` → *sự an trú dễ chịu* (23) so với *sự an trú an lạc* (16) ·
  `saddhiṁ sammodi` → *trao đổi lời chào hỏi* (23) ·
  `Sammodanīyaṁ kathaṁ sāraṇīyaṁ vītisāretvā` → *lời chào hỏi thân thiện và đáng
  ghi nhớ* (84/152) · `ekamantaṁ nisīdi` → *ngồi xuống một bên* (**407**/558) ·
  `appamatto ātāpī pahitatto` → *không phóng dật, nhiệt tâm, tinh cần* (200/115/119) ·
  `vūpakaṭṭha` → *độc hạnh, lui vào* · `brahmacariyapariyosāna` → *viên mãn tối hậu
  của đời sống phạm hạnh* · `odiṭṭheva dhamme sayaṁ abhiññā sacchikatvā` → *tự mình
  chứng ngộ bằng chính thắng tri kiến trong pháp hiện tại* (theo `dn22`,
  `an8.28`; không dùng lối *tự thân thông suốt chứng ngộ* của `an4.35` vì ở đây
  chủ thể là vị tăng, không phải Đức Phật).

  **Tên riêng phải khai vào bộ nhớ tiến trình.** `Macchikāsaṇḍa` có **0** lần trong
  tầng Việt, nên `lọt_pāli()` sẽ bắt nhầm là Pāli lọt. Đã tra chứng nó là thị trấn
  trong Pāli ghim của chính bài này (`sn41.9:1.1` `macchikāsaṇḍaṁ`) và khai vào `_GIỮ`
  theo đúng cơ chế mà `_hvi.py` mô tả; không sửa `_hvi.py`.

  **Dấu lược ở `2.6`, `2.7`, `2.8`.** Pāli đã lược phần định nghĩa tứ thiền (một `…`
  mỗi khoá) nên tôi giữ đúng MỘT `…` và KHÔNG mở rộng — không viết thêm định nghĩa
  tứ thiền vào chỗ không có nguồn. Riêng `2.7` lược cả *sukhaṃ ca somanassassa ca
  atthaṅgamā* lẫn *adukkhamasukhaṁ upekkhāsatipārisuddhiṁ*; đó là lựa chọn có chủ ý
  của bản gốc, tôi ghi vào đây để người rà soát không tưởng là tôi bỏ sót.

  **Hai chỗ phải lệch cấu trúc Pāli vì máy kiểm bắt buộc, và tôi ghi rõ thay vì
  giấu.** (1) Pāli mở nháy kép ở `2.4` và đóng ở `2.10`, nhưng `ngoặc()` của `_hvi.py`
  sắp theo THỨ TỰ SỐ nên `2.10` đứng trước `2.4` và bộ đếm âm. Tôi viết `2.4`-`2.10`
  không nháy kép, đúng như cách tầng đã làm cho đoạn luồng liên tục (`sn35.1:2.x`,
  `sn35.22:2.x`); nháy tròn trong lời Đức Phật ở `2.10` giữ nguyên. (2) `2.12` mở
  nháy và `2.14` đóng, `2.13` không có nháy — tôi làm y hệt Pāli. Đây là hệ quả của quy
  tắc sắp số, không phải lỗi dịch; `sn35.72` trên đĩa cũng lệch 11/9 vì cùng lý do.

  **`naggeyya/muṇḍeyya/pāvaḷanipphoṭanā`** (1.8 và 1.11) không có tiền lệ; tôi dịch
  *thân trần truồng, đầu trọc và những cú ghẹ vào mông* — bám nghĩa Pāli và cách
  Sujato hiểu (*nudity, baldness, and pokes in the buttocks*), nhưng đây là cách diễn
  đạt của tôi, chưa có tiền lệ để đối chiếu. Đây là lý do `terminology` 9.2 và
  `ambiguity_integrity` 9.2.

  **`0.2`, `0.3` đặt mới.** `Cittavagga` có 1 tiền lệ *Phẩm Tâm* → dùng lại;
  `Acelakassapasutta` 0 tiền lệ, dịch *Kinh Với Trưởng Lão Kassapa, Vị Tu Lõa Thể*
  theo Sujato (*With Kassapa, the Naked Ascetic*) và theo cách gọi *Trưởng lão +
  tước hiệu* đã có trong tầng.

  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
