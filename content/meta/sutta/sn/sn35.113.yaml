  - >-
    **`kevalassa dukkhakkhandhassa` — có bất định thật, đã chọn và ghi lại.** Ba cách đang dùng trong tầng: *khối khổ đau* / *khối khổ* / *uẩn khổ*. Đếm trên **Pāli trùng nguyên văn** mới quyết định được, vì đếm theo chuỗi Việt sẽ lẫn bài khác Pāli: `samudayo hoti.` (**18** khoá) → *khối khổ* **13**, *khối khổ đau* **4**, *uẩn khổ* **1** · `nirodho hoti.` (**12**) → *khối khổ* **5**, *uẩn khổ* **4**, *khối khổ đau* **3** · `nirodho hotī”ti.` (**13**) → *khối khổ đau* **7**, *uẩn khổ* **4**, *khối khổ* **2**. Gộp cả ba chuỗi: *khối khổ* **20** > *khối khổ đau* **14** > *uẩn khổ* **9**. Bài này dùng **khối khổ** cho cả bốn lần (`1.10`, `1.19`, `2.8`, `2.15`) để bài tự nhất quán. ⚠ `sn35.106:2.9/2.19` và `sn35.107:2.9/2.17` dùng *uẩn khổ*; riêng trong `sn35` chuỗi `nirodho hoti.` có **3** khoá và cả **3** đều là *uẩn khổ*. **Nếu coordinator muốn thống nhất với `sn35.106`/`sn35.107` thì phải sửa cả hai vế**, không sửa lẻ bài này — tôi chọn phe đo được là phe đa số.
  - >-
    **Phe `ti` — đo lại, và chọn theo CẤU TRÚC chứ không theo phe trần.** Đo trên toàn tầng (155.141 khoá Việt), lấy những khoá mà Pāli kết bằng `”ti.`: **9.906** khoá → VI **giữ** `ti` **2.498** · **bỏ** **7.408**. Lấy khoá Pāli kết bằng `”ti?` (câu hỏi): **3.170** khoá → giữ **2** · bỏ **3.168**. Riêng `sn35`: `”ti.` **220** khoá → giữ **129** · bỏ **91**; `”ti?` **138** khoá → giữ **0** · bỏ **138**. Vậy có một **luật cấu trúc** đo được: `ti` ở **chấm câu khai báo** thì giữ (đa số trong `sn35`), `ti` ở **dấu hỏi** thì bỏ (gần như toàn tầng). Bài này theo đúng luật đó: `2.15` `hoti”ti.` **giữ**, `3.9` `cariyako”ti.` **giữ**, `3.4` `pariyāyan”ti?` **bỏ**. Cả ba đều có tiền lệ trùng nghĩa: `sn12.45:6.9` giữ, `sn12.45:6.4` (Pāli trùng nguyên văn với `3.4`) bỏ, `sn35.106:2.20` và `sn35.107:2.18` giữ. ⚠ **Phe vẫn chưa thống nhất toàn tầng** — số đo nêu ở đây để lát gộp quyết, và **đừng sửa lẻ**: nếu chốt phe bỏ thì phải quét lại cả `2.15` và `3.9`.
  - >-
    **Ba bẫy `sn35` đã biết — bài này không dính, đã kiểm bằng script.** (1) `sn35.94` lệch ngoặc kép −1 ở tầng Pāli ghim: tổng `“` trừ `”` trên **53** khoá Pāli của `sn35.113` = **0**, không có khoá nào làm số âm giữa chừng ⇒ không cần vá như `sn35.94`. (2) Dạng `“ …pe…` vừa mở ngoặc kép vừa mang lược (tranh luận `sn35.74:14.1` vs `sn35.62`): ở `sn35.113` **không có khoá nào** vừa có `“` vừa có `…pe…` ⇒ **không phải chọn phe**, không phát sinh vế `14.6` hỏng. (3) `sn35.74:21.3` sửa `dhammacakkhu` thành *pháp nhãn* vì *con mắt của pháp* có 0 tiền lệ: từ `dhammacakkhu` **không có** trong bài này. `sn35.111:1.8/1.9` có lỗi riêng của lát khác (`jivhaṁ` dịch *con mắt*, `kāyaṁ` dịch *lưỡi*) — **không thuộc lát này nên không sửa**, báo lại để lát gộp xử.
  - >-
    **Dấu lược: 4 khoá Pāli có `…pe…`, 0 dấu `…` trần.** Cả bốn bản Việt giữ **đúng một** `…`, không mở rộng, không bung thành văn — đúng `…pe…` là **một** dấu lược. ⚠ **Bản Anh Sujato đã ghim bung hai đoạn này** (`1.11` và `2.9` thành *Ear … nose … tongue … body …*) — đây là lớp lỗi đã bị phát hiện trước đây (`rāgagginā…` lọt sang `sn35.29:1.15`), và tôi **không** sao chép. Thêm nữa Pāli `jivhañca paṭicca rase ca uppajjati …pe…` **không** ghi `jivhāviññāṇaṁ`, nên bản Việt dừng ở *Nhân lưỡi và vị, sinh khởi …* và **không** bịa thức của lưỡi vào chỗ bị lược (tiền lệ duy nhất `sn35.107:2.11`).
