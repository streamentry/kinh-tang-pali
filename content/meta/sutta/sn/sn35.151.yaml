notes: |-
  Dịch từ Pāli root đã ghim (manifest liệt kê sutta/sn/sn35/sn35.151_root-pli-ms.json và sutta/sn/sn35/sn35.151_translation-en-sujato.json). Tầng Anh CÓ và đã đo.
    Coverage đo được: 28/28 Pāli có nội dung có chữ Anh = 1.0000, trong đó 24 từ Sujato và 4 khoá (2.2, 2.4, 5.2, 5.4) do lớp lấp english-project bù, lớp lấp đã published. Không cần entry reference-gaps.
    2/42 khoá có Pāli trùng nguyên văn với một khoá đã dịch ở bài khác, và dùng lại y nguyên cả hai: 0.2 (15. Phẩm Cũ Mới, trùng 9 bài) và 6.10. 28 khoá có nội dung thì không có khoá nào trùng, nên phần lớn bài dịch mới.
    Không có tiền lệ nào trong tầng Việt dự án cho santevāsika, sācariyaka, anantevāsika, anācariyaka: đo trên Pāli của 1.626 bài sn đã dịch, cụm này chỉ xuất hiện ở chính bài này. Bản dịa đặt có đệ tử ở nhà, có giáo sư, không có đệ tử ở nhà, không có giáo sư. Nếu bài khác sau này cũng dịch cụm này thì phải theo đúng bốn cách này.
    Cảnh báo về bản Anh: ở 2.1 và 5.1 Sujato ghi he hears … smells … tastes … touches … nhưng Pāli chỉ có jivhāya rasaṁ sāyitvà (nếm vị bằng lưỡi), không có dấu lược ở đâu cả. Bản dịa chỉ dịch lưỡi, không mở rộng theo bản Anh. Tương tự ở 3.1 và 6.1, Pāli chỉ có manasā dhammaṁ viññāya.
    Điểm khó chưa giải quyết trọn vẹn, ghi rõ để coordinator xử lý: ở 6.8, Pāli đặt anācariyakaṁ (không có giáo sư) cạnh sācariyako (có giáo sư) trong cùng một vế, tức là câu tự mâu thuẫn ngay trong nguyên bản. Sujato bỏ mất anācariyakaṁ và chỉ dịch là có đệ tử ở nhà và có giáo sư. Bản dịa giữ đủ cả bốn từ tính từ theo đúng Pāli nên câu vẫn thấy nghịch lý, nhưng đó là nghịch lý của nguồn chứ không phải lỗi dịch. Có thể đọc 6.7–6.9 là phần tóm tắt nén của 1.1–1.3, trong đó anācariyakaṁ ở 6.8 về ngữ nghĩa thuộc về 6.7 (6.7 khác 1.1 ở chỗ không có anācariyakaṁ). Nếu coordinator chọn cách đọc đó thì phải sửa cả 6.7 lẫn 6.8.
    Cụm dukkhaṁ na phāsu viharati dịch là sống trong khổ, không an lành, và sukhaṁ phāsu viharati là sống an lành, thong thả. Chưa có tiền lệ cho phāsu trong tầng.
    1.6, 2.2, 3.2, 4.3, 5.2 và 6.2 đều có cùng công thức tyāssa anto vasanti, antassa vasanti pāpakā akusalā dhammāti; bản dịa lặp y như Pāli, dùng tức là để nối hai vế.
    1.8, 2.4, 3.4, 4.5, 5.4 và 6.4 đều có samudācaranti; dịch là áp đảo. Chưa có tiền lệ trong tầng.
    sarasaṅkappā saṁyojaniyā dịch là những tưởng và ý nghĩ trói buộc vào; chưa có tiền lệ trong tầng.
    Antevāsikasutta đặt làm Kinh Đệ Tử Ở Nhà theo Sujato A Resident Pupil; chưa có tiền lệ cho Pāli này.
    Cấu trúc ngoặc kép bám đúng Pāli: mở một dấu kép ở 1.1 và đóng ở 6.9, không có nháy lồng ở giữa.
    Tầng vietnamese-current vắng ở commit đã ghim (chỉ có Pháp Cú), nên không có bản Thích Minh Châu để đối chiếu cho bài này.
    Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.

  Lượt cải thiện 2026-10-13 (kiểm toán đối kháng từng khoá Pāli↔Việt; 21/42 khoá đổi, tập khoá và ID giữ nguyên, thứ tự khoá nay đúng thứ tự Pāli vì 6.10 trước đó bị xếp sau 6.1):
    Đính chính ghi chú cũ: cụm sāntevāsika/sācariyaka CÓ tiền lệ trong tầng — Mahāniddesa mnd14, mnd16, mnd1 và Cūḷaniddesa cnd23 cùng dịch có đệ tử ở nhà, có giáo sư (không dấu bản dịa như ghi chú trên); bản này đã khớp, giữ nguyên. Cũng ở các bài đó, cùng công thức sarasaṅkappā saṁyojaniyā dịch là những hồi ức và ý định có tính trói buộc (8 khoá), samudācaranti dịch là chi phối (4 khoá), tyassa anto vasanti dịch là chúng cư trú bên trong vị ấy.
    Đổi theo tiền lệ và sửa nghĩa: (1) 1.5, 2.1, 3.1, 4.2, 5.1, 6.1: những tưởng và ý nghĩ trói buộc vào → những hồi ức và ý định có tính trói buộc. Tưởng trong tầng là saññā, còn sara- là ức nhớ (sarati) nên đọc tưởng là lệch nghĩa; trói buộc vào thì thiếu tân ngữ, trong khi saṁyojaniya đo được ~25 chỗ dịch là có tính trói buộc / trói buộc. Điểm terminology 9.0 → 9.3, semantic_fidelity 9.2 → 9.3. (2) 1.8, 2.4, 3.4, 4.5, 5.4, 6.4: áp đảo → chi phối (4/4 tiền lệ mnd14, mnd16; áp đảo chỉ có ở bài này và mạnh hơn Pāli). (3) 1.6, 2.2, 3.2, 4.3, 5.2, 6.2: thêm vị ấy cho assa (trước đó bỏ sót đại từ) và bỏ đang cư trú (thêm thể tiến hành không có trong Pāli); dùng chúng ở cả hai vế cho đều. (4) 6.8: trước đó dịch nguyên văn thành Vị tỳ-kheo không có giáo sư, có đệ tử ở nhà, có giáo sư, tự mâu thuẫn. Anācariyakaṁ ở đây là trung tính -aṁ, cùng dạng với brahmacariyaṁ ở 1.1 (vussati anācariyakaṁ), còn bhikkhu, santevāsiko, sācariyako đều là -o nên về ngữ pháp từ này không thể bổ nghĩa cho vị tỳ-kheo; nó là đuôi của câu 6.7 bị ranh khoá đẩy sang 6.8 trong bản Pāli đã ghim. Nay dịch là một mảnh câu: Không có giáo sư. rồi đến vế sau, giữ trong cùng khoá, không chuyển chữ sang 6.7. grammar_logic 9.1 → 9.3, vietnamese_clarity 9.2 → 9.3. (5) 6.9: thêm Này các tỳ-kheo (Pāli có bhikkhave, trước đó bỏ sót); nay trùng đúng bản dịch 1.3, đúng phép Pāli trùng nguyên văn. (6) 1.4: bỏ này tỳ-kheo thừa (trước đó bhikkhu bị đếm hai lần, vừa là hô cách vừa là chủ ngữ); đọc bhikkhu là chủ ngữ như Sujato, 4.1 có bhikkhave còn 1.4 thì không. (7) 2.1, 3.1, 5.1, 6.1: Nữa → Lại nữa (25/36 trong tầng sn; mnd cũng Lại nữa). (8) 1.5, 4.2: thêm ở đây cho idha như dòng mnd. 
    Điểm hạ: triangulation 9.0 → 8.8, vì chính lỗi tưởng/hồi ức lọt qua dù Sujato ghi memories ở cùng khoá, nghĩa là đối chiếu Anh khi đó chưa đủ chặt. Điểm giữ: ambiguity_integrity 8.6, vì chưa chắc đoạn 6.7–6.8 là lỗi tách câu của bản Pāli hay là bản gốc; đọc ngữ pháp trên là cách đọc hợp lý nhất nhưng không phân xử được bằng bản thứ hai. Sujato bỏ hẳn anācariyakaṁ ở 6.8, không giúp phân xử.
    Chủ trương không đổi dù nghi ngờ: đệ tử ở nhà cho antevāsika (cách đọc ở nhà gợi nhà ở hơn là nội trú, nhưng 4 bài mnd/cnd và sn35.133 cùng dùng, đổi riêng một bài sẽ phá nhất quán); phāsu giữ an lành, thong thả; tên kinh giữ nguyên. Cổng kỹ thuật chưa chạy lại ở lượt này: npm run validate, npm test, npm run check, npm run build do coordinator chạy.
