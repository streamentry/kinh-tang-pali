notes:
  - >-
    Tên bài `Sāriputtasaddhivihārikasutta` → *Kinh Với Đệ Tử Của Sāriputta*, theo mẫu `sn35.70:0.3` *Kinh Với Upavāṇa Về …*. `saddhivihārī` **0 tiền lệ** trong tầng Việt; chọn *đệ tử* vì ngữ cảnh (môn đồ ở dưới một thầy) và vì Sujato dịch *protégé*. Tên phẩm `Lokakāmaguṇavagga` → *12. Phẩm Dục Thuộc Thế Gian* khớp Pāli tuyệt đối với `sn35.114:0.2` và `sn35.115:0.2`.
  - >-
    **12 khoá có Pāli trùng nguyên văn và dùng lại nguyên văn** (đo bằng script, đã loại lát này khỏi chỉ mục): `0.2` (tên phẩm) · `1.1` ← `sn28.1:1.1` · `3.2` ← `dn33:1.11.75` · `3.4`, `3.5`, `3.6`, `3.7`, `3.8` ← `dn33:1.11.77`–`.81` · `5.3` ← `sn35.239:4.3` · `5.5` ← `sn35.239:4.5` · `5.7` ← `an6.46:6.1` · `5.10` ← `an10.107:6.5`. `4.3` là công thức `neva davāya …` của `sn35.239:3.3` (cùng Pāli, khác dấu câu) nên cũng dùng lại nguyên văn để `sn35.120` và `sn35.239` không dịch hai kiểu.
  - >-
    **Một chỗ cố ý KHÔNG dùng lại nguyên văn, để giữ nhất quán trong bài**: `3.3` và `3.9` là hai đoạn song song nhau (mắt căn / ý căn), và cả hai đều trùng Pāli với một tệp đã có: `3.3` với `mn101:34.2` (*kiềm chế*, *bảo hộ*), `3.9` với `dn33:1.11.82` (*thu thúc*, *giữ gìn*). Dùng nguyên văn sẽ để lại hai cặp từ khác nhau ngay cạnh nhau trong cùng bài, trông như lỗi. Vì vậy cả hai lấy theo `sn35.239:2.3` và `:2.9` — cùng SN, cùng công thức, cùng từ vựng (*chế ngự*, *hộ trì*, *nhãn căn*, *tham lam và ưu não*). Đây là **sai lệch có chủ ý so với dùng lại nguyên văn**, nên `3.3` và `3.9` không nằm trong con số 12 ở trên; ghi ở đây để người biên tập biết.
  - >-
    Còn lại đã có tiền lệ: `paṭisaṅkhā yoniso āhāraṁ āhāreti` → *suy xét hợp lý về thức ăn mà ăn* (`sn35.239:3.2`) · `caṅkamena nisajjāya āvaraṇīyehi dhammehi cittaṁ parisodheti` → *bằng kinh hành và ngồi, thanh lọc tâm khỏi các pháp là những chướng ngại* (`sn35.239:4.2–4.5`) · `sīhaseyyaṁ` → *nằm nghỉ như con sư tử, bên phải, chân này chồng lên chân kia* (`sn35.239:4.4`) · `indriyesu aguttadvāro` → *phòng hộ các căn* để khớp với `guttadvārā` ở `5.8` và với `sn35.239:2.12` *hộ trì các căn* · `bhojane mattaññū` → *biết đủ trong ăn uống* (`sn35.239:3.1`) · `jāgariyaṁ anuyutto` → *chuyên tâm vào sự tỉnh giác* (`sn35.239:4.1`).
  - >-
    Bất định đã ghi: (a) `1.4` `hīnāyāvatto` dịch *trở về đời sống thấp kém hơn*; Sujato dịch *returned to a lesser life* — giữ nguyên mức độ *thấp kém hơn*, không nói thêm là rời bảo tháp hay trở lại đời. (b) `2.2–2.3` `netaṁ ṭhānaṁ vijjati / ṭhānametaṁ vijjati` dịch *không thể* và *có thể*; đây là *khả năng* chứ không phải *sự chắc chắn*, nên không dùng *chắc chắn được* / *chắc chắn không được*. (c) `3.2` và `3.8` giữ *không nắm giữ tướng, không nắm giữ đặc tính phụ* theo `dn33`, trong khi `sn35.239` dịch *tùy tướng*; giữ nguyên tiền lệ của khoá trùng Pāli.
  - >-
    Cấu trúc nháy kép: `1.4` mở và đóng ngay trong một khoá; `2.1` mở → `2.3` đóng; `4.3` và `5.8` dùng nháy đơn; `5.9` đóng `”ti.`. Cân trên toàn bài 34 khoá.
  - >-
    Quy tắc dấu lược của BRIEF_VI3 §10: mọi khoá Pāli có `…pe…` hoặc `…` đều giữ **đúng một** `…`, không mở rộng; không khoá nào nén bằng `…` cả khi Pāli viết đủ. Đã đếm từng khoá. Coverage Anh đo được: 22/22 = 100%
  - >-
    Tầng `vietnamese-current` vắng: tại commit đã ghim, bilara chỉ có Pháp Cú cho tiếng Việt, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Ba tầng tham khảo còn lại là Pāli root (authority) + `english-sujato` đã ghim + `english-project` (lớp lấp của chính dự án, chỉ tính khi `published`).
  - >-
    Bốn cổng kỹ thuật của AGENTS.md: `npm run validate`, `npm test`, `npm run check` và `npm run build`. **Agent lát này KHÔNG chạy bốn lệnh đó** — BRIEF_VI3 §7 và lệnh của người điều phối cấm chạy `npm run validate|test|build|check`. Những gì đã chạy và xanh: `_hvi.py` (`save_vi` → `kiểm`) cho cả 9 bài — đủ khoá trong `all`, không thừa, NFC, không trùng nguyên văn Pāli (trừ 0.1 theo quy ước), không Pāli lọt, số dấu lược khớp từng khoá, nháy kép cân trên cả bài; quét lại 306 khoá bằng script độc lập; `notes` và `blocking_errors` parse sạch bằng thư viện `yaml` của kho. Cổng thật còn lại là CI (`.github/workflows/ci.yml`), nên `technical_integrity` chỉ 9.6 chứ không 10.
