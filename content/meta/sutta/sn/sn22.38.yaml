notes: |-
  Đợt 19, lát l15. Dịch trọn 71 khoá từ Pāli root tại commit bilara đã ghim, đối chiếu English Sujato đã ghim, bản Hòa thượng Thích Minh Châu (nguyên bài, tra cứu toàn văn, không phải tầng segment) và bài song hành sn22.37 cùng phẩm.

  Coverage English trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): Sujato phủ 36/41 = 0,878, đạt sàn 0,80. Sujato để trống 5 khoá (2.14, 2.17, 3.4, 3.7, 4.6) — đều là dòng "sự sinh khởi … của nó/chúng …" lặp công thức; 5 khoá này Pāli tự đứng vững và được đối chiếu với các khoá Pāli trùng nguyên văn trong chính bài (2.12, 2.19, 3.2 …). Lớp english-project của dự án có điền 5 khoá đó nhưng là bản của chính dự án, không phải đọc English độc lập, nên không được tính vào triangulation: triangulation 9,0 phản ánh 36/41 khoá có đối chiếu độc lập.

  Thuật ngữ theo tiền lệ đo được trên tầng: "sự sinh khởi / sự hoại diệt / sự biến dịch khi đang tồn tại được thấy rõ" theo sn22.37 (cùng công thức paññāyati); "đã qua, đã dứt, đã biến đổi" cho atīta niruddha vipariṇata theo sn22.62 (4/4 khoá); "chưa sinh, chưa hiện" và "đã sinh, đã hiện" cho ajāta apātubhūta / jāta pātubhūta theo sn22.62 (8/8 khoá); "Hiền giả/hiền giả" cho āvuso và "thầy" cho Ānanda theo sn22.37. Tiêu đề "Kinh Ānanda (Hai)" theo mẫu "(Hai)" phổ biến cho các kinh Dutiya trong tương ưng bộ.

  Ba thì được phân biệt đúng theo Pāli: paññāyittha → "đã được thấy rõ", paññāyissati → "sẽ được thấy rõ", paññāyati → "được thấy rõ" (hiện tại, theo sn22.37). Các cặp Pāli trùng nguyên văn trong bài (9 nhóm) đều dùng cùng một bản dịch; các khoá chỉ khác ngôi hô (āvuso / ānanda) thì khác tương ứng ("Này hiền giả" / "Này Ānanda"). Dấu lược: Pāli chỉ có "…" và "…pe…", không có "(…)" ở khoá nào; mỗi "…pe…" (3.5, 4.3) chuyển thành đúng một "…". Không có số lượng Pāli trong bài.

  Bất định: (1) vayo được dịch "hoại diệt" và niruddha "đã dứt" nhằm giữ hai từ khác nhau, theo sn22.37 và sn22.62; Hòa thượng Thích Minh Châu dịch niruddha là "đoạn diệt" và vayo là "diệt mất" — khác từ ngữ, cùng nghĩa. (2) ṭhitassa aññathattaṁ dịch "sự biến dịch khi đang tồn tại" theo sn22.37, phù hợp "change while persisting" của Sujato. (3) pātubhūta dịch ngắn "hiện" theo tiền lệ sn22.62; Sujato "appeared".

  Kiểm kỹ thuật: bản dịch đủ 71/71 khoá, thứ tự đúng Pāli; nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch); NFC, không khoá rỗng, không Pāli lọt sang Việt. technical_integrity đặt 9,6 vì chưa chạy các lệnh cổng của kho trong lượt này; cần chạy: npm run validate · npm test · npm run check · npm run build.
