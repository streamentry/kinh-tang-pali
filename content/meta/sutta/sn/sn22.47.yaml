notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim (14/14 khoá Pāli có nội dung, coverage 1.0000). Tầng `vietnamese-current` không có cho bài này.
  **Dùng lại nguyên văn 5 khoá có Pāli trùng ở bài khác**: `1.5` và `1.9` lấy từ `sn22.93` (cùng cụm `attato samanupassati…` bốn vế), `1.6` từ `sn22.118`, `1.7`–`1.8` và `3.12` từ các bài cùng phẩm.
  **`attā` → *tự thân*, đây là lựa chọn đánh đổi đã đo.** Cùng một Pāli (`rūpaṁ attato samanupassati…`) đã có **hai** cách trong kho: `sn22.93` và `sn22.117` dùng *tự thân*, còn `sn22.43` và `sn22.44` dùng *tự ngã*; toàn tầng *tự ngã* (548) đứng trước *tự thân* (427). Chọn **tự thân** vì tên phẩm `Attadīpavagga` đã dịch là *Phẩm Tự Mình Là Hòn Đảo* và vì `asmī` (mạn *ta là*) ở đây nói về cách người phàm tự nhận mình là *cái này*, không phải một bản ngã siêu hình. Người biên tập nên gộp `sn22.43`/`sn22.44` về một dạng.
  `asmī` → *mạn ‘ta là’* (theo `dn33`, vì `dn33` dùng đúng nghĩa mạn); danh sách `2.6`–`2.13` và `3.4`–`3.11` dùng **nguyên văn `mn140`** cho cả chín cách tính (*ta là cái này* / *ta sẽ có* / *ta sẽ không có* / *ta sẽ có sắc* / *ta sẽ vô sắc* / *ta sẽ có tưởng* / *ta sẽ không có tưởng* / *ta sẽ không có tưởng cũng không không có tưởng*).
  **`3.7`–`3.10` là bốn mảnh Pāli lược (`rūpī …`, `arūpī …`, `saññī …`, `asaññī …`) trong mệnh đề phủ định.** Bản nháp đầu để nguyên chữ Pāli — sai, vì tầng Việt không được để Pāli lọt; nhưng mở rộng thành *ta sẽ có sắc* cũng sai, vì Pāli không có `bhavissan` ở đây. Dịch *có sắc …* / *vô sắc …* / *có tưởng …* / *không có tưởng …*, giữ **đúng một** `…` mỗi khoá, và giữ dấu chấm câu không có trong Pāli vì đó là câu văn tiếp nối từ `3.6`.
  **BẤT ĐỊNH đã ghi nhận ở `2.1`.** `Iti ayañceva samanupassanā ‘asmī’ti cassa avigataṁ hoti.` — cách nói nén của Pāli gộp *cách quán sát ấy* và *mạn ‘ta là’* vào một vế `avigataṁ hoti`. Bản Anh hiểu là *they’re not rid of this way of regarding things, and the conceit ‘I am’* (hai vế). Đã dịch *Cách quán sát ấy, cùng mạn ‘ta là’, không được trừ khỏi vị ấy.* — không khẳng định thêm phạm vi của `avigataṁ` mà Pāli không nói rõ. `avakkanti hoti` ở `2.2` dịch *được tính đến* (nghĩa: được kể ra, được nêu); 0 tiền lệ cho từ này.
  `pañcupādānakkhandha` → *năm thủ uẩn* (94 so với *năm uẩn* 39). `samaṇā vā brāhmaṇā vā` → *sa-môn và bà-la-môn* (44). `assutavā puthujjano` → *kẻ phàm phu chưa học* (30). `ariyānaṁ adassāvī …` → nguyên văn `sn22.43` (*không thấy các bậc Thánh, không thuần thục pháp các bậc Thánh, không tu tập pháp các bậc Thánh*), `sappurisānaṁ` → *bậc chân nhân*.
  Nháy kép: `1.2` mở và `3.11` đóng — cân trên cả bài.
  Cổng kỹ thuật do coordinator chạy: `npm run validate`, `npm test`, `npm run check`, và `npm run build` (vì có bài `published`). `technical_integrity` 9.6 vì bốn lệnh này chưa chạy ở lát c42.

  **Lượt cải thiện 2026-10-14** (đọc đối kháng từng khoá với Pāli, Sujato và đo tiền lệ trên toàn tầng; 10/37 khoá đổi; các đoạn ghi ở trên về `attā` → *tự thân*, về `1.5`/`1.9` lấy từ `sn22.93`, về *mạn* ở `2.1` và về `avakkanti` → *được tính đến* **được thay thế** bởi mục này).
  **Sửa nghĩa:** (1) `1.5`, `1.9` và `1.2`: `attā` → *tự ngã*, `samanupassati` → *quán*. Cùng công thức `rūpaṁ attato samanupassati…` đo được *tự ngã* ở 157 khoá, *tự thân* ở 16 khoá toàn tầng, và *tự thân* dễ bị đọc là thân thể; lý do đánh đổi cũ (tên phẩm *Tự Mình Là Hòn Đảo*) không đủ để lệch đa số. `1.2` đọc `anekavihitaṁ` là định ngữ của `attānaṁ` (*tự ngã thuộc nhiều loại khác nhau*, theo cách dịch `anekavihita` = *nhiều loại* ở `an10.102`), thay cho *thấy nhiều thứ khác nhau là tự thân* vốn đẩy tân ngữ sang chữ khác. (2) `2.2`: `avakkanti hoti` → *có sự giáng hiện của …* (cùng cách dịch ở `sn12.39`, `sn12.64`, `ne14`, `ne37`: 14+ khoá; *được tính đến* có 0 tiền lệ và không có căn cứ từ vựng); *‘ta là’* giữa câu viết thường vì là lời người phàm phu tự nghĩ. (3) `3.2`: bỏ chữ *tỳ-kheo* thêm vào (Pāli chỉ có `ariyasāvaka`), thêm `ettha` thành *ở đó* (trỏ lại *năm căn* ở `3.1`), `pahīyati` → *được đoạn trừ* (đa số 7/27 so với *từ bỏ* 1). (4) `3.3`: bỏ *ly tham và diệt tận* (hai chữ cho một `virāga`, *diệt tận* không có trong Pāli) → *Do vô minh phai nhạt và minh sinh khởi* (như `mn11:17.1`); bỏ *minh hiểu*/*sanh khởi* theo đa số *minh*/*sinh khởi* (3.433 so với 413).
  **Sửa nhẹ:** `2.1` bỏ chữ *mạn* tự thêm vào (Pāli chỉ có `‘asmī’ti`; `2.2` và `3.3` cũng không có *mạn*), thêm `Iti` → *Như vậy* và `ayañceva` → *chính … này*; `2.3` thêm *căn* (`cakkhundriyassa…`, như `sn48.41`); `2.4` thêm hô ngữ `bhikkhave` còn thiếu, bỏ *Vẫn* không có trong Pāli, `mano` → *ý* (như `sn35.65`, `sn4.19`) và `avijjādhātu` → *giới vô minh* thay cho *giới tánh vô minh* (như `mn115:6.4`); `2.5` thêm hô ngữ `bhikkhave`.
  **Điểm tiêu chí đổi:** `terminology` 9.1 → 9.3 (tự ngã, giáng hiện, đoạn trừ, sinh khởi, giới vô minh theo đa số tầng); `semantic_fidelity` 9.3 → 9.2 và `triangulation` 9.3 → 9.0, vì đối chiếu lại với Sujato cho thấy lượt trước đã bỏ sót bốn chỗ lệch nghĩa nêu trên (`1.2`, `2.2`, `3.2`, `3.3`), điểm cũ không phản ánh đúng, và vì chỗ còn lại ở `2.5` (xem dưới) chưa sửa; các tiêu chí khác giữ nguyên. `final_score` 9.39 → 9.37.
  **Bất định/việc còn lại.** `2.1`: phạm vi của `avigataṁ` (gộp hai vế `ayaṁ samanupassanā` và `‘asmī’ti`) vẫn giữ như đã ghi. `2.5`: *xúc chạm sinh ra từ vô minh chạm vào* vẫn lệch cách đọc `avijjāsamphassajena` (*xúc với vô minh* hay *xúc do vô minh*) và lặp *chạm*; không sửa riêng một bài vì cùng cụm đang là cách dịch ở 8 khoá khác (`sn22.81` và các bài kế cận), nên cần sửa đồng bộ. Cổng kỹ thuật `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy ở lượt này; `technical_integrity` giữ 9.6.