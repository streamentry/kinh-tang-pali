notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không căn theo segment nên không lập thành cột). Tầng `english-project` chưa có cho bài này.

  **Coverage Anh đo thật: Sujato phủ 51/51 = 100% khoá Pāli có nội dung** (≥ 40 ký tự, bỏ khối `:0`; chỉ `13.10` — dòng kết `Tatiyaṁ.` — Sujato để trống, và nó nằm ngoài mẫu số). Không có lớp lấp nào tham gia vào con số này, nên cũng không có chuyện tự đánh bài của mình. Vượt ngưỡng 0.80, không cần entry `reference-gaps`. 87 khoá, đủ và đúng thứ tự Pāli, không khoá ngoài phạm vi.

  **Tiền lệ đã đo.** Pāli trùng nguyên văn một khoá đã dịch ở chỗ khác trong `sn`: 19 khoá; dùng lại đúng bản đa số ở 16, khác ở 3 (`2.6`, `7.2`, `7.3`, xem dưới). Trong chính bài có 2 nhóm Pāli trùng nguyên văn (`1.4`=`9.3`; `10.4`=`11.3`), cả hai nhóm bản Việt đều giống nhau. Dùng lại: `1.1` *Tại Sāvatthī.* (427), `1.5` *Khi được nói như vậy … thưa với Thế Tôn:* (4 so với 3 dạng khác), `0.2` *6. Phẩm Dính Mắc* (7 so với 1 *Phẩm Trói Buộc*), `10.4`/`11.3` công thức *Có thể chẳng có, và sẽ chẳng phải của tôi; sẽ chẳng có, và sẽ chẳng phải của tôi* (đúng như `sn22.153`, `sn24.4`, 4 khoá giống hệt), `13.6` và `13.7` theo `sn22.53`/`sn22.54` (cùng phẩm, cùng Pāli; `sn22.45`/`sn22.46` dùng *vững trú … không dao động thì tự mình chứng đạt Niết-bàn*, chọn theo bài cùng phẩm vì ngay bài kế trước), các dòng lược `Cảm thọ …` (12 và 11), `tưởng …` (11), `các hành …` (12, 44), `13.10` *Thứ ba.* (120).

  **Ba khoá lệch tiền lệ có chủ ý.** `2.6`: bản đa số 3 khoá là *thấy thức là tự thân …* thuộc công thức khác (`sn22.99`, dùng *Bộ Đạo*, *tự thân*); ở đây theo `sn22.7:5.1` cùng công thức cùng chương (*quán … là tự ngã, hay tự ngã có …*; 2 khoá). `7.2`, `7.3`: tiền lệ chỉ 1–2 khoá, dùng *quán* cho `samanupassati` như toàn bài và `sn22.7`. Dấu `;` giữa hai cặp trong `2.2` và `2.6` giữ đúng như Pāli (tiền lệ `sn22.7` thay bằng dấu phẩy).

  **Thuật ngữ.** `vedanā` dịch *cảm thọ* xuyên suốt bài (cân bằng toàn `sn22`: *cảm thọ* 181 so với *thọ* đứng riêng 183; theo `sn22.54` cùng phẩm và theo các khoá lược trùng nguyên văn). `saṅkhata` *hữu vi*; `vibhavissati` / `vibhavā` *sẽ biến diệt* / *biến diệt*; `adhimuccamāno` *quyết tâm như vậy*; `orambhāgiyāni saṁyojanāni` *các hạ phần kiết sử* (tiền lệ `mn64`, `an10.13`, `sn45.179`); `upaya` *nơi dính mắc*, `ārammaṇa` *sở duyên*, `patiṭṭhā` *chỗ nương tựa*, `nandūpasecana` *được tưới tẩm bởi hỷ ái* theo `sn22.53`/`sn22.54`; `assutavā puthujjano` *kẻ phàm phu chưa học* (22 lần trong `sn22`) và `sutavā ariyasāvako` *bậc Thánh đệ tử có học*; `avinīto`/`suvinīto` *không tu tập*/*khéo tu tập* theo `sn22.7:2.2`, `sn22.7:6.2`, `sn22.43`, `sn22.44`, `sn22.47` (`sn22.93`, `sn22.99` dùng *không đi lệch*).

  **Chỗ lệch có chủ ý so với bài kế cùng phẩm.** `rāga` ở `13.1`, `13.5` dịch *tham*, không dịch *tham ái* như `sn22.53:3.2`, `sn22.54:4.2`: `rāga` là *tham* ở mọi chỗ khác trong tầng (`sn38.3`, `an3.72`, 7 khoá), còn *ái* thuộc `taṇhā`/`nandi`. Hai bài sau vì thế đang không đồng nhất với bài này; người biên tập nên cân nhắc đồng nhất ở `sn22.53`/`sn22.54` (4 khoá). Cũng vì thế câu `Rāgassa pahānā …` ở đây là *Do đoạn trừ tham, sở duyên bị cắt đứt, không còn chỗ nương tựa cho thức.* (khác 4 khoá trùng ở `sn22.53`, `sn22.54` chỉ ở chữ *ái*).

  **Bất định, không thêm vào thân kinh.** (1) Công thức `no cassaṁ, no ca me siyā, nābhavissa, na me bhavissatī`: `cassaṁ` là `ca` + `assaṁ` (ngôi thứ nhất, cầu khiến), nên nghĩa sát chữ là *tôi có thể không có*; tầng (`sn22.153`, `sn24.4`) và Sujato dịch không chủ ngữ (*có thể chẳng có*). Giữ theo tầng để các bài khỏi tự mâu thuẫn; đây là chỗ nên xét lại cho cả nhóm cùng lúc, không sửa lẻ một bài. (2) `anantarā āsavānaṁ khayo` ở `10.1`, `13.9`: *ngay tức thì* (Thích Minh Châu *lập tức*, Sujato *without delay*); `anantara` còn có nghĩa *liền kế, không gián đoạn*, không phân xử được hơn bằng Pāli. (3) `tāsa` (`10.2`–`11.2`) dịch *hoảng sợ*, còn `paritassati` (`13.7`) giữ *lo âu* theo `sn22.53`; hai từ cùng gốc `tas`, Sujato dịch cả hai là *worry*, Thích Minh Châu dịch *hoảng sợ* cho `tāsa`. (4) `adhimuccamāno`: tầng có *quyết định* cho `adhimuccati` ở `sn25.1`, `sn4.20`; chọn *quyết tâm* theo Thích Minh Châu và Sujato (*resolution*) vì ở đây là một khuynh hướng của tâm, không phải một quyết định chọn lựa. (5) `vā` đầu `11.4`/`11.7` (*Rūpupayaṁ vā*, *saṅkhārupayaṁ vā*) không dịch riêng ở `11.4`, theo `sn22.53:1.3` và `sn22.54:2.1`; `11.5` và `11.7` mang *Hay* / *hay*. (6) `cutiṁ` ở `12.2` dịch *sự biến mất* theo `sn22.53:2.2`, `sn22.54:3.2` (nghĩa sát chữ là *sự rơi xuống, sự chết đi*), và `12.2` thêm *cảm thọ* thay *thọ* theo cách dịch của bài này.

  **Cấu trúc câu dễ đọc nhầm.** `1.3`–`1.4`, `1.6`–`1.7`, `9.1`–`9.3` là một câu bị `iti` + dấu gạch ngang chia qua nhiều khoá: công thức đứng giữa hai dấu *—*, mệnh đề *vị tỳ-kheo quyết tâm như vậy có thể cắt đứt các hạ phần kiết sử* nằm ở khoá sau. `9.4` mở dấu nháy kép mà không đóng; `10.1` mới đóng, đúng như Pāli. `8.6`–`8.8` giữ đúng dấu lược Pāli: `…pe…` thành một `…`, và `8.6`, `8.7` mỗi khoá có hai dấu lược vì Pāli có hai.

  **Số Pāli.** Bài không có số đếm cần tính (chỉ *năm uẩn* nói gián tiếp, không có số bằng chữ).

  **Phép đo sau khi ghi.** Tập khoá Việt = tập khoá Pāli (87/87), đúng thứ tự Pāli; nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch trên 87 khoá); dấu lược `…` cân bằng Pāli từng khoá (0 lệch); không có `…` ở khoá Pāli không có; NFC, không khoảng trắng thừa, không Pāli lọt sang Việt (0 trường hợp).

