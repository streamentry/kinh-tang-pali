notes: |-
  Dịch từ Pāli root tại commit đã ghim. COVERAGE ĐO LẠI bằng chính hàm của kho (`englishCoverageFor`, ngưỡng 0.8 trong `source/layers.yaml`): tầng `english-sujato` phủ 23/30 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối tham chiếu `:0`) = 0.767; tầng lấp `english-project` KHÔNG có tệp cho sn52.1 nên không bù được; `loadRecordedGaps()` không trả về entry nào cho `sn/sn52.1`. Bảy khoá mất tầng Anh là `6.1-6.5` và `8.1-8.2` — tức đúng hai vòng `So sace ākaṅkhati` bị Sujato lược mất. Đây là GIỚI HẠN CỦA BẢN CHỤP UPSTREAM, không phải thiếu sót của repo; không có bản Anh nào khác phủ bài này tại commit đã ghim. Mình KHÔNG sửa `content/meta/reference-gaps.yaml` (bị cấm trong lát này) và KHÔNG mở rộng dấu lược để bịa tiếng Anh; vì vậy status là `draft`. Tầng `vietnamese-current` cũng không có cho bài này.

  ĐỢT NÀY LÀ LƯỢT REVIEW ĐỐI KHÁNG THỨ HAI, trên bản dịch đã có trên đĩa. KHÔNG sửa khoá nào — đọc lại từng cặp Pāli↔Việt và không tìm ra lỗi nào cần sửa. Giữ nguyên 39/39 khoá. Vì không sửa khoá nào, `segment_alignment` và `semantic_fidelity` giữ nguyên ở 10.0 và 9.4.

  ĐO LẠI TIỀN LỆ (không tin số của người khác):
    · 0.1 bài sn: quét 1.608 khoá `:0.1` trong tầng `sn` -> 1.608/1.608 viết `Saṁyutta Nikāya`, 0 tệp nào trong cả tầng ghi `Saṡyutta` (grep `Saṡyutta` trong `content/translation/vi/project/` = 0 hit). Chốt `Saṁyutta Nikāya 52.1`.
    · Tên phẩm: `1. Rahogatavagga` -> `1. Phẩm Ở Riêng` (10 tệp, sn52.2-sn52.11). Không tạo cách thứ N+1.
    · Tiêu đề: `Paṭhamarahogatasutta` -> `Kinh Nơi Thanh Vắng (Nhất)`.
    · Dấu lược: đếm từng khoá, `…pe…` tính là MỘT dấu lược, dấu `…` trần cũng một — `7.1` (1/1), `7.2` (1/1), `7.3` (3/3), `8.1` (1/1), `9.1` (1/1), `9.2` (1/1), `9.3` (2/2), `10.1` (1/1). Không mở rộng ở đâu. Cả 39 khoá khớp.
    · Ngoặc kép cân trên cả bài (đếm cả `“` và `”` toàn bài, kể cả ngoặc lồng nhau), 0 lỗi. NFC toàn bộ 0 lỗi. Không có khoá rỗng, không có `(…)` khoá chưa dịch, không có khoá tràn. Số khoá 39 = 39.
    · Dùng lại NGUYÊN VĂN, đối chiếu byte-for-byte (Pāli trùng tuyệt đối): `1.2` <- `sn52.11:1.1` · `1.3` <- `sn52.2:1.2` · `1.4` <- `sn52.2:1.3` · `1.5` <- `sn52.2:1.4` · `2.3` <- `sn52.2:3.1` · `7.1` <- `sn52.2:6.1` · `7.2` <- `sn52.2:6.2` · `9.1` <- `sn52.2:7.1` · `9.2` <- `sn52.2:7.2` · `10.3` <- `sn52.2:7.4`.
    · `7.3` cố Ý KHÔNG khớp byte với `sn52.2:6.3` dù Pāli trùng tuyệt đối, và lý do là bản nguồn làm thay bài này: `sn52.2:6.3` nén ba mệnh đề thành một và làm mất ba dấu lược; bản ở đây giữ đủ ba dấu lược đúng số dấu lược của Pāli. `9.3` có lý do tương tự.

  Tiền lệ thuật ngữ: `cattāro satipaṭṭhānā āraddhā hontī` -> `bốn niệm xứ được xem là bắt đầu thực hành đối với vị tỳ-kheo` (nguyên văn `sn52.2`) · `kittāvatā nu kho, āvuso …` -> `Cho đến chừng mức nào, này Hiền giả …` (`sn52.2:3.1`) · `Ettāvatā kho, āvuso` -> `Cho đến chừng mức ấy, này Hiền giả` (`sn52.2:7.4`) · `ajjhattaṁ/bahiddhā/ajjhattabahiddhā` -> `trên nội … / trên ngoại … / trên cả nội … và ngoại …` cho thân, thọ, tâm, pháp (nguyên văn `sn52.2:4.1-7.3`) · `ātāpī sampajāno satimā` -> `nhiệt tâm, tỉnh giác, chánh niệm` (344 chỗ `nhiệt tâm`) · `vineyya loke abhijjhādomanassaṁ` -> `nhiếp phục tham ưu ở đời` (36 chỗ) · `paṭikūla`/`appaṭikūla`/`paṭikūlasaññī`/`upekkhako vihareyyaṁ sato sampajāno` -> `đáng ghét` / `không đáng ghét` / `tưởng (không) đáng ghét` / `an trú với xả, có niệm và tỉnh giác` (nguyên văn `dn28:18.10-18.14`, cùng công thức) · `rahogata`/`paṭisallīna` -> `ở nơi thanh vắng độc cư` (nguyên văn `sn52.2:1.2`) · `viraddhā/āraddhā` -> `xao lãng / bắt đầu thực hành` (giữ đúng cặp phủ định của Pāli).
  0 tiền lệ, đặt mới kèm lý do: `samudayadhammānupassī` -> `sống quán sự khởi sinh của các pháp` · `vayadhammānupassī` -> `sống quán sự diệt tận của các pháp` · `samudayavayadhammānupassī` -> `sống quán sự khởi sinh và diệt tận của các pháp`. Không bản Việt nào trong tầng dịch ba phức hợp này (đã grep `samudayavaya`, `khởi sinh`, `sinh và diệt`: 0 tiền lệ đúng công thức); giữ `sự khởi sinh` và `sự diệt tận` vì đúng với `samudaya`/`vaya` và với `sự hiện khởi`/`sự đi đến chỗ chấm dứt` đã có trong tầng.

  Bất định đã phân xử và ghi lại:
    (1) `So sace ākaṅkhati` ở `4.1` và `6.1` có tiếng nối `So`, còn `4.2-4.5` và `6.2-6.5` không có; đã dịu cả hai dạng thành `Nếu muốn:` cho nhất quán, vì `So` ở đây chỉ là tiếp nối câu chứ không đổi nghĩa.
    (2) `7.3` và `9.3` có `…pe…` lược mất `sampajāno satimā, vineyya loke`; theo chính sách dấu lược KHÔNG mở rộng, nên `7.3` giữ `nhiệt tâm … nhiếp phục tham ưu ở đời`.
    (3) `9.1`/`9.2` dịch `dhammesu` thành `các nội pháp` / `các ngoại pháp`. Đây là nguyên văn dùng lại từ `sn52.2:7.1`/`7.2` (Pāli trùng tuyệt đối), nhưng từ `nội pháp` trong tầng đã mang nghĩa `anattādhamma` là vô ngã pháp, nên đây là điểm DỄ GÂY LẪN — ghi ra đây để người biên tập cân nhắc thống nhất với `7.1`/`7.2` dùng `nội tâm`/`ngoại tâm`; mình giữ nguyên vì ưu tiên nhất quán với nguồn đã có và không tự tạo cách thứ N+1 trong cùng một lát.

  Cổng kỹ thuật: `technical_integrity` đặt 9.6 thay vì 10.0 vì lát này bị cấm chạy `npm run validate`, `npm test`, `npm run check` và `npm run build` (bốn lệnh này là cổng thật do CI chạy). Đã tự kiểm bằng node: JSON hợp lệ, 39/39 khoá khớp Pāli, 0 khoá thừa/thiếu/rỗng, NFC sạch, dấu lược khớp từng khoá, ngoặc kép cân. `source_provenance` hạ 9.0 và `triangulation` hạ 8.5 vì coverage tầng Anh thấp hơn ngưỡng và không có entry gap; `validate` sẽ chặn bài này ở `review`/`published` cho tới khi người điều phối ghi nhận gap. Không sửa `content/meta/reference-gaps.yaml`, không sửa `source/`, không sửa `scripts/` hay `src/`.
