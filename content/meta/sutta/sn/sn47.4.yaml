notes: |-
  Bản dịch tiếng Việt mới cho bài kinh sn47.4.

  Bốn niệm xứ là pháp môn chung cho tỳ-kheo mới xuất gia (để biết rõ), bậc hữu học (để liễu tri) và bậc A-la-hán (để không dính mắc).

  Đối chiếu Pāli root và bản Anh Sujato tham khảo.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.1 — «trú giữa dân chúng Kosala» → «trú tại xứ Kosala» (`kosalesu viharati` dịch «xứ Kosala» ở 19/21 khoá trong tầng, kể cả `sn48.51:1.2` cùng Pāli); giữ «Thế Tôn» (không «Đức») theo cách viết của bài.
