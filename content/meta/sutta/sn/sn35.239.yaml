notes: |-
  Dịch từ Pāli root; đối chiếu Sujato đã ghim (coverage 24/24 = 100%). Tầng `vietnamese-current` không có cho bài này.
  **Bài này gần như là `an4.37` (`Aparihāniyasutta`) viết lại trong Sn 35.** Trùng nguyên văn **16 khoá**, dùng lại y nguyên văn **14**: `an4.37:3.2`, `3.3`, `3.8`, `3.9`, `3.10`, `4.2`, `4.3`, `4.4`, `5.2`, `5.3`, `5.4`, `5.5`, `5.6` và `an3.16:2.10` cho `2.12`. `an5.28:10.1–10.2` cho ẩn dụ cỗ xe ở `2.10` (Pāli gần trùng, chỉ khác `cātumahāpathe` và dấu phẩy). `sn35.240` (**bài ngay sau, cùng phẩm**) cho `2.4–2.7` — cùng Pāli, dùng lại nguyên văn. Tiêu đề phẩm `Āsīvisavagga` → *19. Phẩm Rắn Độc* (2 bài).
  **Ba chỗ chọn theo đa số kho, có số đếm.** `indriyesu guttadvāro` → *hộ trì các căn* (25) thay vì *hộ trì các cửa của các căn* (3, `an3.16` dùng cách ngắn, `an4.37` cách dài). `bhojane mattaññū` → *biết đủ trong ăn uống* (11) thay vì *biết chừng mực trong thức ăn* (4, `an4.37`/`an3.16`). `jāgariyaṁ anuyutto` → *chuyên cần trong sự tỉnh giác* (4) thay vì *…tỉnh thức* (3). `nimittaggāhī / nānubyañjanaggāhī` → *nắm giữ tướng / tùy tướng* (10) thay vì *nắm giữ tướng phụ* (2, `sn35.240`). `paṭisaṅkhā yoniso āhāraṁ āhāreti` giữ nguyên *suy xét hợp lý về thức ăn mà ăn* của `an4.37`.
  **0 tiền lệ, đặt mới, ghi kèm lý do:** `Rathopamasutta` → *Kinh Ví Dụ Cỗ Xe* theo khuôn tên bài đã có trong cùng phẩm (`Kummopamasutta` → *Kinh Ví Dụ Con Rùa*, `Bāḷisikopamasutta` → *Kinh Ví Dụ Người Câu Cá*); `ratha` dịch *cỗ xe* (151) thay vì *xe ngựa* (32). `ārakkhāya sikkhati, saṁyamāya sikkhati, damāya sikkhati, upasamāya sikkhati` → *học tập để bảo hộ, để chế ngự, để thuần phục, để an ổn* — bốn động từ giữ thành bốn mệnh đề, không gộp. `puriso vaṇaṁ ālimpeyya … akkhaṁ abbhañjeyya` (0 tiền lệ) → *bôi thuốc lên vết thương chỉ để cho nó lành, hoặc tra dầu vào trục xe chỉ để cho nó chở nổi sức nặng*; `yāvadeva … ththāya` là mệnh đích *chỉ để*, không phải lý do chung.
  **Sửa trong lượt review đối kháng:** `2.8` bản nháp đầu ghi *sau khi*; đã đổi thành *sau khi biết pháp bằng ý* cho khớp `an4.37:3.8` và với `2.2` (…bằng mắt). `4.1` bản nháp đầu dùng *chuyên cần trong sự tỉnh thức* (cách `an3.16`); đã đổi sang *tỉnh giác* cho khớp đa số và với `4.6`.
  `3.3` và `3.6` là cùng một Pāli `neva davāya … phāsuvihāro cā’ti` lặp hai lần theo peyyāla; giữ nguyên văn hai lần. Dấu lược: `2.4–2.7` giữ **một** `…`; không nén thêm. `notes` dùng khối literal `|-` thụt 2, đã đọc mẫu đích trước khi ghi. Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` (và `npm run build` vì có bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9.6 chứ không 10.0.
