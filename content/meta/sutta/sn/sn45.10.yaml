notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    **Bốn bài `sn38.9/11/12/14` dùng nguyên văn khung của `sn38.8*`** (lát 34, đã `published`): cùng phẩm Jambukhádaka, cùng hai người nói, cùng mười một vế hỏi–đáp. Chỉ đổi danh từ cần định nghĩa và số từ xưng.
  - >-
    **`an3.74*` đã `published` là bản song song của `sn47.1`** — cùng câu `sattānaṁ visuddhiyā … sacchikiriyāya`, cùng nơi `Vesālī, ambapālivana` → cụm đó dùng lại **nguyên văn**: *để thanh tịnh hóa chúng sinh, vượt qua sầu than, chấm dứt khổ ưu, đạt được đạo lý, và tự chứng Niết-bàn*.
  - >-
    **`sn48.45*` (lát 35) là bài ngay trước của `sn48.46`**, cùng khung `Katinaṁ nu kho … khīṇāsavo bhikkhu aññaṁ byākaroti` → dùng lại **nguyên văn** cả mười khoá, kể cả `2.1` bị `…pe…` cắt. Vế `tadanvayā saddhā saṇṭhāti…` của `sn48.52:3.3` cũng lấy nguyên văn từ `sn48.45:2.4`.
  - >-
    **`sn45.19*` (lát 34) là bài anh em của `sn45.18`**, cùng khung `Kukkutārāma` với `Sādhu sādhu` / `Bhaddako kho te` / `Evañhi tvaṁ … pucchasi` → dùng lại **nguyên văn** `2.3–2.8`, kể cả cách viết lặp `Phi Phạm hạnh` ở `2.1` và `2.6`.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Đo lại trên toàn bộ segment Việt trong `content/translation/vi/project/` — 3.215 tệp, bỏ 22 tệp trong thư mục APFS orphan, đối chiếu **mọi** khoá với Pāli ở commit đã ghim: **khớp 61.033 / 61.460 = 99,31%** (0 khoá Việt nào không có trong Pāli). Con số ở các lát trước là 46.755 / 47.140 = 99,18% — **đo trên tập con, không tái lập được** từ định nghĩa đã ghi, nên thay bằng số đo lại được toàn bộ. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ.
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Dùng lại: `Jambukhādakavagga` → *1. Phẩm Jambukhádaka* (`sn38.8`) · `Avijjāvagga` (Sn 45) → *1. Phẩm Vô Minh* (`sn45.1`) · `Pabbatavagga` → *1. Phẩm Núi* (`sn46.7`) · `Jarāvagga` → *5. Phẩm Già* (`sn48.45`) · `Sūkarakhatavagga` → *6. Phẩm Núi Khỉ* (`sn48.59`) · `Ananussutavagga` → *4. Phẩm Chưa Từng Nghe* (`sn47.36`) · `Oghavagga` (Sn 46) → *13. Phẩm Dòng Chảy* (`sn46.121-129`). **Phân kỳ chưa giải quyết:** `Vihāravagga` — 7 bài ghi *2. Phẩm Tào Môn*, chỉ `sn45.19` ghi *Phẩm Thiền*; bài này theo đa số. `Sukhindriyavagga` — chia làm ba: *Căn Sước* (2 bài), *Căn Lành* (2 bài), *Lạc Căn* (1 bài, `sn48.35` — bài ngay trước); bài này theo `sn48.35`. **Ba phẩm 0 tiền lệ:** `Abyākatavagga` → *1. Phẩm Không Tuyên Bố* (theo `an7.60`) · `Ambapālivagga` → *1. Phẩm Cây Mít* · `Vibhaṅgasutta` → *Kinh Chia Ra (Nhất)*. **Người biên tập nên thống nhất các chỗ phân kỳ.**
  - >-
    Ba lần `nibbānaṅgamā honti nibbānaparāyanā nibbānapariyosānā` dịch *đưa đến Niết-bàn, làm bến đỗ đến chỗ Niết-bàn, kết thúc ở chỗ Niết-bàn*. Hai vế sau bám tiền lệ đã `published`: `nibbānapoṇa` → *có bến về phía Niết-bàn* (`sn45.127/133`), `amatapariyosāna` → *có sự kết thúc ở chỗ không chết* (`sn45.115/121`). **Nháp đầu dịch cả hai là *bến đỗ* và *khái quán* — hai chữ đó không có tiền lệ nào trong kho và đã bị sửa.**
  - >-
    `kati nu kho, bho gotama, dhammā` → *Bạch tôn giả Gotama, có bao nhiêu pháp…*. `bho gotama` là cách xưng hô của người hỏi với tôn giả, dịch *bạch tôn giả*; `Nandiya` là tên riêng người hỏi nên giữ nguyên dạng Nandiya trong lời thoại (*này Nandiya*).
  - >-
    0 tiền lệ cho `Nandiyasutta` → *Kinh Nandiya*; `paribbājaka` → *du sĩ*; `dhāretu ajjatagge pāṇupetaṁ saraṇaṁ gatan` → *làm chủ đạo hộ của tôi từ hôm nay đến chừng nào còn sống, tôi xin quy y theo Ngài làm chỗ nương tựa* — kho chỉ có một tiền lệ `Buddhaṁ saraṇaṁ gacchāmi` (*Tôi quy y Phật*, `kp1:2.1`) nên câu này phải dựng lại từ Pāli.
  - >-
    Uddāna `3.0–3.4` dịch chữ, **độ chắc thấp**: `Avijjañca upaḍḍhañca, / sāriputto ca brāhmaṇo; / Kimatthiyo ca dve bhikkhū, / vibhaṅgo sūkanandiyāti` → *Vô minh, và Upaḍḍha, / Sāriputta, và Bà-la-môn; / Kimatthiya, và hai vị tỳ-kheo, / Vibhaṅga, và Sūka-Nandiya là vậy.* `upaḍḍha` **giữ nguyên Pāli** vì 0 tiền lệ; `vibhaṅgo` dịch *Vibhaṅga* (giữ tên riêng) nhưng có thể là *bài Phân loại* — **người biên tập nên kiểm**, vì `sn45.1–9` chưa dịch.
