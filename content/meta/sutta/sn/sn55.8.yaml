notes: |-
      **DÙNG LẠI NGUYÊN VĂN — 11 khoá Pāli trùng nguyên văn.** Bài anh em **`sn55.9`**
      (`Dutiyagiñjakāvasathasutta`, đã `published`): `0.2` = `sn55.9:0.2` (*1. Phẩm Veḷudvāra*) ·
      `2.8` = `sn55.9:1.7` · `6.2` = `sn55.11:2.5` · `6.3` = `sn55.11:2.6` · `6.4` =
      `sn55.12:3.7` · `6.5` = `sn55.9:3.1` (*Này Ānanda, đây là tấm gương pháp, pháp môn ấy;*) ·
      `6.6` = `sn55.9:3.2` · `6.7` = `sn55.9:3.3` · `6.8` = `sn12.38:3.6`. Ngoài ra: `1.1` =
      `sn1.11:1.1` · `1.2` = `sn14.13:1.1` · `1.3` = `sn22.21:1.2`.
      Tiêu đề theo đúng cặp anh em: `sn55.9:0.3` = *Kinh Giñjakāvasatha (Hai)*, tôi đặt
      *Kinh Giñjakāvasatha (Nhất)* cho `Paṭhamagiñjakāvasathasutta`.
      **Đã sửa sau khi đối kháng:** `3.4` bản đầu tôi dùng *không còn bị đọa xuống*; đếm toàn
      tầng sn cho thấy **21** segment dùng *không rơi vào ác đạo* và chỉ **2** dùng *không còn bị
      đọa xuống*, nên đã sửa cho khớp với `4.4`/`5.2`/`6.7` ngay trong bài này.
      **Thuật ngữ, kèm đếm:** `dhammādāso dhammapariyāyo` → *tấm gương pháp, pháp môn ấy*
      (`sn55.9:3.1`, nguyên văn) — `dn16.2:8.3` dùng *chiếc gương Pháp* cho cùng Pāli; **hai
      cách cùng tồn tại**, tôi theo `sn55.9` vì cùng Tăng Bộ và đúng bài anh em ·
      `attānaṁ byākareyya` → *tự mình tuyên bố về mình* (`sn55.9:3.2`) ·
      `kā gati, ko abhisamparāyo` → *sanh thú là gì, đời sau là gì* (`sn55.9:1.3`/`1.7`) ·
      `kālaṅkato` → *đã qua đời* (`dn16.2.6.6` cho `kukkuṭo … kālaṅkato`) ·
      `pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ … opapātikā tattha parinibbāyinī anāvattidhammā`
      → *năm hạ phần kiết sử … được hóa sinh, nhập Niết-bàn tại đấy, không còn trở lui từ cảnh
      giới ấy* — **nguyên văn `sn55.52:5.4`** (cùng Tăng Bộ) ·
      `tiṇṇaṁ saṁyojanānaṁ parikkhayā … tanuttā sakadāgāmī` → *ba kiết sử, làm muội lược tham,
      sân, si, là bậc nhất lai* — **nguyên văn `sn55.52:6.3`**; `an4.241:3.2` dùng *ba kết
      trói* + *làm cho nhạt nhòa* cho cùng Pāli — **hai cách cùng tồn tại**, tôi theo
      `sn55.52` vì cùng Tăng Bộ ·
      `anacchariyaṁ` → *không có gì lạ* (`mn125.11.1`) · `vihesā` → *phiền não cho ta* ·
      `Ekaṁ samayaṁ … ñātike … giñjakāvasathe` → nguyên văn `sn14.13:1.1`.
      **0 tiền lệ, đặt mới:** `Tīṇipi suttantāni ekanidānāni` → *Ba bài kinh tiếp theo cùng
      chung một nhân duyên* (0 tiền lệ cho đúng câu này; `sn55.9:2.2` dùng *Cùng duyên khởi
      với câu trả lời trước.* cho `purimaveyyākaraṇena ekanidānaṁ` — khác Pāli).
      **⚠ Tầng Anh 94.74%** (18/19) — trên ngưỡng 0.8, **không** cần ghi gap. Segment trống:
      `5.2` — chính là khoá trùng nguyên văn `sn55.9:3.3`, nên Pāli vẫn đứng vững;
      `triangulation` 9.1 vì thế.
      **Không đối chiếu được tầng Việt hiện hành.**
