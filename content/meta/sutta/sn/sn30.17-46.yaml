notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    **Mười bài anh em đã `published` có cùng Pāli hoặc cùng khung**, và bản Việt dùng lại **nguyên văn** của chúng: `sn22.111`/`sn22.112` (đúng Pāli `sn23.9`/`sn23.10`) · `sn29.10` (khung dāna-khetta, `sn29.3`/`sn29.11-20`) · `sn29.6` (`vossaṭṭhakāyā`) · `sn34.1` (khung bốn loại người tu định, `sn34.55`) · `sn34.6`/`sn34.7`/`sn34.15` (`gocarakusalo`, `abhinīhārakusalo`) · `sn34.53`/`sn34.54` (`sakkaccakārī`, `sātaccakārī`, `sappāyakārī`) · `sn35.78` (`anattā … chando pahātabbo`, `sn35.164`) · `sn35.166` (`kathaṁ nu kho, bhante, jānato …`, `sn35.165`/`sn35.167`) · `sn36.24`/`sn36.26` (cụm cảm thọ, `sn36.23`) · `sn38.8` (khung hỏi–đáp với Sāriputta, `sn38.2`/`sn38.4`/`sn38.7`) · `sn23.11` (`Nibbindaṁ virajjati…`, `sn35.60`) · `sn48.47` (`'khīṇā jāti…'`) · `sn45.42-47` (câu hỏi `samaṇe gotame`, `sn38.4`). **Những chỗ viết khác đều ghi rõ trong `notes` của từng bài.**
  - >-
    **Danh sách song song trong lát này đã bị lệch một chỗ và đã sửa** — ghi lại vì đó là loại lỗi mà máy không bắt được: ba danh sách được sinh bằng vòng lặp (mười món cho ở `sn29.11-20`, chín loại hương ở `sn31.4-12`, mười món cho ở `sn31.23-112`). Một `range` lệch một đơn vị làm **cả danh sách** dịch sai từ đó trở đi mà vẫn qua mọi chốt tự động. Đã đối chiếp từng khoá với Pāli sau khi sửa.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên **49.374 segment đã `published`**: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Khớp **49.179 / 49.374 = 99,14%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ (`hay` được miễn vì `vā…vā…vā` là cấu trúc).
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Sn 45–56 đã đủ: `Paṭhamamāravagga` → *1. Phẩm Ma Rối Lần Nhất* (`sn23.8`) · `Nāgavagga` → *1. Phẩm Rồng* (`sn29.1/10`) · `Supaṇṇavagga` → *1. Phẩm Kim Sí Điểu* (5 bài; `sn30.1` ghi *Phẩm Rồng* — **lệch**) · `Gandhabbavagga` → *1. Phẩm Càn-thát-bà* (3 bài) · `Jhānavagga` → *1. Phẩm Thiền Định* (`sn34.1`) · `Avijjāvagga` → *6. Phẩm Vô Minh* (`sn35.59`) · `Channavagga` → *9. Phẩm Channa* · `Yogakkhemivagga` → *11. Phẩm An Ổn Khỏi Ách* · `Navapurāṇavagga` → *15. Phẩm Cũ Mới* · `Nandikkhayavagga` → *16. Phẩm Đoạn Tận Hoan Hỷ* · `Devadahavagga` → *14. Phẩm Devadaha* · `Jambukhādakavagga` → *1. Phẩm Jambukhádaka*. **Ba phẩm 0 tiền lệ:** `Lokakāmaguṇavagga` → *12. Phẩm Dục Thuộc Thế Gian* · `Samuddavagga` → *18. Phẩm Biển* · `Khandhavagga` → *Phẩm Uẩn* (chỉ xuất hiện ở uddāna `sn34.55`). **Chỗ đang phân kỳ trong kho:** `Aṭṭhasatapariyāyavagga` — `sn36.28` ghi *Bát Pháp Chân Đắc*, `sn36.24/25/26` ghi *Một Trăm Linh Tám Cách*, `sn36.29/30` ghi *Tám Trăm Lần*; bài này theo `sn36.28` vì cùng nhóm số thứ tự. **Người biên tập nên thống nhất.**
  - >-
    **merged bundle** (30 bài `Jalābujadānūpakāra`). Khung giống `sn29.11-20*` nhưng chủ thể là **các vị Kim Sí Điểu** và có **ba** loại sinh: `jalābujā` (sinh từ ẩm ướt), `saṁsedaja` (sinh từ hạt giống), `opapātikā` (tự hóa sinh).
  - >-
    Dùng lại **nguyên văn** `sn29.10:1.3/2.1–2.5/2.7*` cho cả khung; tên phẩm `Supaṇṇavagga` → *1. Phẩm Kim Sí Điểu* (5 bài đã xuất bản so với 1 bài ghi *Phẩm Rồng* — **cần thống nhất**).
  - >-
    0 tiền lệ: `saṁsedaja` → *sinh từ hạt giống*, `jalābuja` → *sinh từ ẩm ướt*; `Jalābujadānūpakārasutta` → *Bối Trăm Bài Về Cho Và Nhận*. Ở đây danh sách món cho chỉ còn **ba** khoá (`anna`, `pāna`, `padīpeyya`) vì Pāli đã lược bớt — bản Việt không tự thêm món nào.
  - >-
    Uddāna `2.0–2.5` và chú thích `1.17` dịch chữ, độ chắc thấp. `1.17` là chú thích của chính Bilara (`(Evaṁ piṇḍakena chacattālīsaṁ suttantā honti.)`), vẫn phải dịch vì nằm trong tệp.
  - >-
    **Lượt cải thiện 2026-10-14 (đọc đối kháng từng khoá với Pāli; sửa 14/27 khoá).** Lượt chấm 2026-09-29 đã bỏ sót nhiều lỗi nghĩa và số lượng; ghi lại để lịch sử không bị che. **Nặng — thuật ngữ:** `jalābuja` là *sinh từ bụng* (không phải *sinh từ ẩm ướt*), `saṁsedaja` là *sinh do ẩm ướt* (không phải *sinh từ hạt giống*) — khớp `sn30.2:1.6–1.8`, `sn30.4-6:1.3–1.4` và bản Anh Sujato (`womb-born`, `moisture-born`, `spontaneously-born`) ở `1.3`–`1.5` (sửa `1.3`, `1.4`; semantic_fidelity hạ 9.4 → 9.2 và ambiguity_integrity 9.4 → 9.2 vì lượt trước đã để lọt các lỗi này, terminology giữ 9.2 do các bài anh em chưa đồng bộ). `padīpeyya` là *đèn*, không phải *thức lót sàng* (`1.13`; khớp `sn30.7-16:1.18`, `sn31.13-22:1.18`, `sn32.3-12:1.10`, `sn32.13-52:1.13`, `sn29.21-50:2.8`, `an6.57`, `cnd7`). **Nặng — số lượng:** `chacattālīsamaṁ` = bốn mươi sáu (6 + 40), không phải *bốn mươi tám* (`1.16`); `chacattālīsaṁ suttantā` ở `1.17` cũng là bốn mươi sáu bài (17–46 là 30 bài, cộng 1 + 1 + 4 + 10 = 46); `tālīsaṁ` ở `2.3` là bốn mươi (`sn30.7-16` cộng `sn30.17-46` = 10 + 30). **Nặng — chữ hỏng:** `bối mươi tám`, `bối mươi`, `Bối Trăm Bài` ở `0.3`, `1.17`, `2.3` là chữ vô nghĩa (số đếm bị thay sai), đã sửa thành *Ba Mươi Bài Về Cho Và Nhận* (theo `sn29.11-20`, `sn31.23-112`; bản Anh `Thirty` ở bài song song `sn29.21-50`), *bốn mươi sáu*, *bốn mươi*. **Vừa:** `2.1` *"Họ lấy đi cả thứ thanh tịnh"* đọc `suddhikaṁ haranti ceva` như một mệnh đề; thực chất là hai tên bài (`sn30.1` Suddhika, bản Anh *Plain Version*; `sn30.2` Haranti, *They Carry Off*) → *Bài đơn thuần và bài bắt mang đi*. **Nhẹ:** `1.5`, `1.8`, `1.10`, `1.14`, `1.15` bỏ *các vị* và viết thường *kim sí điểu* cho khớp tiền lệ `sn30.3`–`sn30.7-16` (3/3 bài đã `published` cùng khung dùng *kim sí điểu*, không *các vị Kim Sí Điểu*); `2.4` *phẩm* → *tập* và dịch đủ *su-* của *suppakāsitā* (*trình bày rõ ràng*) theo `sn29.21-50:4.6`. **Đã sửa lời ghi sai ở trên:** mục "0 tiền lệ" cho `saṁsedaja`, `jalābuja` không đúng — `sn30.2` và `sn30.4-6` đã có tiền lệ; câu về tầng English cũng cần chỉnh: Sujato **có** tệp cho bài này nhưng chỉ dịch `1.2`–`1.5` và `1.17` (4/9 segment Pāli có nội dung; phần thân `1.6`–`1.16` và uddāna để trống, "Tell all in full"), nên triangulation giữ 8.2. **Bất định còn lại:** `2.1` *đơn thuần* cho `suddhika` là cách đọc theo tên bài và bản Anh, chưa có phân xử độc lập; `dānūpakāra` giữ *về cho và nhận* theo tiền lệ nhưng không phân tách *dāna* (cho) và *upakāra* (giúp đỡ, lợi ích). Đối chiếu 27/27 khoá, nháy/ngoặc khớp Pāli từng khoá, 0 cặp Pāli trùng nội bộ (phép rỗng). Không chạy được bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` ở lượt này nên `technical_integrity` đặt 9.6, chưa tuyên bố technical gate pass.
