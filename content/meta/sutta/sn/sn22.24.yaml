  - >-
    **Lượt cải thiện 2026-10-13 (đọc đối kháng đủ 12 khoá thân bài; bản cũ chấm
    9,47 trên bản có lỗi nghĩa, nên điểm đó quá tay và đã được chấm lại).** Đổi
    8/15 khoá: 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.11. Ghi chú cũ *"Lượt review
    đối kháng bắt được 0 lỗi nghĩa"* là sai; mục này thay thế nó. **Lỗi nặng 1
    (6 khoá: 1.2, 1.3, 1.5, 1.6, 1.7, 1.11):** `avirājayaṁ`/`virājayaṁ` dịch
    *không làm cho sáng ra*/*làm cho sáng ra* là sai nghĩa; `virājeti` đi với
    `rāga`, nghĩa là làm cho hết nhiễm, ly tham. Tầng đã dịch cùng gốc là *ly
    tham* ở 48 khoá (iti7–iti13, mn28, mn62, mn140, an4.177, an6.54…); *làm cho
    sáng ra* chỉ còn trong năm bài (sn22.24, sn35.26, sn35.27, sn35.111,
    sn35.112), và Sujato dịch *dispassion* ở chính bài này (1.2, 1.7, 1.11).
    Đổi thành *không ly tham*/*ly tham*. Chính ghi chú cũ cũng nêu cụm
    `virāga…` → *ly tham* ở bài khác nhưng không áp cho `virājayaṁ`. **Lỗi
    thuật ngữ cùng 6 khoá:** `anabhijānaṁ`/`abhijānaṁ` dịch *không biết*/*biết*
    làm mất bậc `abhi-` và lệch tên bài (*Thắng Tri*) lẫn ghi chú cũ
    (`abhiññā` → *thắng tri*); đổi thành *không thắng tri*/*thắng tri* và giữ
    *liễu tri* cho `parijānaṁ` (bài này vốn đã đúng; Sujato *directly knowing*
    và *completely understanding*; đối chiếu sn22.35, sn22.56, sn22.57 dùng
    *thắng tri*). **Cấu trúc:** Pāli đặt tân ngữ đứng đầu (`Rūpaṁ … anabhijānaṁ
    … abhabbo`), chủ ngữ ngầm là người tu; bản cũ *"sắc không biết, không làm
    cho sáng ra…"* dễ đọc thành sắc là chủ thể không biết. Đổi sang *đối với
    sắc/cảm thọ/các hành/thức, … không thắng tri…*, theo cách đã sửa ở sn35.26
    (*đối với mắt, … không thắng tri…*). 1.7 thêm *Và* cho `Rūpañca kho`. **Nhẹ
    (2 khoá):** 1.4 (`saññaṁ anabhijānaṁ …`) và 1.8 (`vedanaṁ abhijānaṁ …`) bản
    cũ bỏ mất `anabhijānaṁ`/`abhijānaṁ` còn Pāli giữ; nay *đối với tưởng, không
    thắng tri …* và *đối với cảm thọ, thắng tri …*. 1.9, 1.10 chỉ có danh từ
    nên giữ *tưởng …*, *các hành …*. **Điểm đổi:** `semantic_fidelity` 9,4 → 9,3
    và `ambiguity_integrity` 9,4 → 9,2 (lỗi nghĩa đã tồn tại và không được bản
    cũ phát hiện; dạng sai khiến của `virājayaṁ` chưa thể hiện được trong *ly
    tham*, và các bài song song sn35.26/27/111/112 chưa đồng bộ); `grammar_logic`
    9,3 → 9,4 (tân ngữ/chủ ngữ ngầm nay rõ); `triangulation` 9,2 → 8,8 (Sujato
    phủ 6/6 khoá Pāli có nội dung nhưng bản cũ đã lệch *dispassion* mà không ai
    bắt; tầng Việt hiện hành vắng nên không có đối chiếu Thích Minh Châu);
    `technical_integrity` 10,0 → 9,6 vì bốn lệnh `npm run validate`, `npm test`,
    `npm run check`, `npm run build` chưa chạy ở lượt này. Các điểm khác giữ
    nguyên. Bất định còn lại: *ly tham* chưa thể hiện được nghĩa sai khiến (làm cho
    người tu hết nhiễm); giữ theo đa số tầng.
