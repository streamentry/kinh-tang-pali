notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh của Bhikkhu Sujato ở mọi khoá trừ số thứ tự bài.
  Các công thức quán vị ngọt và sự bất lợi giữ nguyên cách dịch của sn12.54 trong kho vì Pāli trùng nhau từng chữ, trừ saṁyojaniya ở sn12.54 đổi thành upādāniya ở bài này nên chữ đáng chấp thủ ở đây là đúng nghĩa gốc.
  Kết luận 1.7 và 2.6 dịch sát là sự tập khởi của toàn bộ uẩn khổ này, không thêm chữ là do khát ái như sn12.54.
  Tiêu đề 0.2 theo sn12.54 cùng phẩm là 6. Phẩm Khổ, 0.3 là Kinh Sự Chấp Thủ vì sn12.54 đã mang tên bản Hai.
