notes: |-
  Đợt 19, lane 10. Dịch đủ 66 khoá từ Pāli root, đối chiếu bản Anh của Bhikkhu Sujato đã ghim và đối chiếu bản Việt nguyên bài của Hòa thượng Thích Minh Châu (tra cứu toàn văn, không phải tầng store).

  Số: catucattārīsa = catu 4 + cattārīsa 40 = 44, bốn mươi bốn. Đếm chi phần ở 2.2 tới 2.12: già chết, sinh, hữu, thủ, ái, thọ, xúc, sáu xứ, danh sắc, thức, các hành là 11 nhóm, mỗi nhóm bốn trí (về pháp ấy, tập khởi, diệt, con đường đưa đến diệt), 11 nhân 4 bằng 44, khớp số nêu ở 1.2, 2.1, 2.13.

  Coverage English trên Pāli có nội dung (từ 40 ký tự trở lên, bỏ khối :0): Sujato không rỗng ở 29 trên 29 khoá, bằng 100 phần trăm, trên sàn 0,8. Giới hạn cần nói thẳng: năm khoá trong số đó (2.3 tới 2.7) Sujato chỉ viết một dòng rút gọn dạng Knowledge of rebirth … trong khi Pāli viết đủ bốn trí cho từng chi phần. Nếu chỉ tính các khoá mà English thật sự dịch đủ nội dung Pāli thì là 24 trên 29, khoảng 82,8 phần trăm, vẫn trên 0,8 nhưng sát ngưỡng hơn con số 100 phần trăm. Với năm khoá ấy bản dịch dựa vào Pāli cùng công thức bốn trí nêu đủ ở 2.2 và 2.12, và dòng Anh rút gọn chỉ xác nhận tên chi phần. Tầng english-project chưa có nội dung cho bài này, tầng vietnamese-current vắng (chỉ có Pháp Cú). Vì vậy triangulation để 8.8.

  Văn cảnh và công thức: 2.8 tới 2.11 và 9.1 tới 9.9 là các khoá Pāli lược, giữ đúng một dấu lược cho mỗi khoá, không mở rộng. Dấu ngoặc kép mở ở 2.1 và đóng ở 14.3 đúng theo Pāli. 8.3 và 14.3 Pāli không có nháy đơn nên bản Việt không thêm nháy đơn quanh các danh xưng, dù Sujato và vài bản Việt khác thêm.

  Bất định đã ghi, không đưa vào thân kinh:
  anvaye ñāṇaṁ dịch trí suy luận. Hai khoá trong dn33 ghi trí suy theo quy luật (quy luật không có trong Pāli); Hòa thượng Thích Minh Châu dùng tùy trí; Sujato inferential knowledge. Chọn trí suy luận cho nhất quán với 5.2 và 11.2.
  atītānāgate nayaṁ neti dịch suy ra cho quá khứ và vị lai theo tiền lệ sn42.11:2.9 (suy ra cho quá khứ và vị lai); Sujato apply the method; Thích Minh Châu hướng dẫn thái độ. Nghĩa đen là dẫn một phương pháp, nên có thể hiểu là áp dụng phương pháp ấy cho quá khứ và vị lai; hai cách hiểu cùng hướng.
  abbhaññaṁsu và abhijānissanti dịch trực tiếp biết. Tầng có hai cách ngang nhau (thắng tri 29 khoá, trực tiếp biết 29 khoá), nên chọn cách dễ hiểu hơn và khớp directly knew của Sujato.
  indriyānaṁ paripāko dịch các căn già yếu theo sn12.28:2.2; nghĩa đen là các căn chín muồi.
  akālikena dịch không bị thời gian chi phối theo sn42.11:2.9.

  Thuật ngữ theo đa số trong phạm vi sn12: sinh (39 khoá, sanh 13), già chết (36, già-chết 17), đệ tử Thánh (9, Thánh đệ tử 2; toàn sn thì Thánh đệ tử 112 trên 20), hữu, thủ (thủ 92, chấp thủ 46), ái (71, khát ái 38), thọ (51, cảm thọ 35), xúc, sáu xứ (22, sáu căn 18), danh sắc (33, danh-sắc 1), các hành (98 trên 44), tập khởi cho samudaya (22 trong sn12), con đường đưa đến sự diệt cho nirodhagāminī paṭipadā (con đường 33 trên 33 trong sn12). Hai chỗ khác khoá anh em sn12.34: sinh thay vì sanh, già chết thay vì già-chết, theo đa số sn12 và cùng phẩm (sn12.35 tới sn12.40 đều dùng sinh); tên phẩm và công thức mở bài theo sn12.34.
  Định nghĩa già (3.2) và chết (3.4) dùng lại gần nguyên văn sn12.28:2.2 và 2.4. 4.4 và 10.4 là chánh kiến … chánh định như 23 khoá cùng Pāli đã có. Năm cặp Pāli trùng nguyên văn trong bài (4.4 và 10.4, 5.2 và 11.2, 7.2 và 13.2, 8.1 và 14.1, 8.2 và 14.2) đều có bản Việt giống hệt nhau.

