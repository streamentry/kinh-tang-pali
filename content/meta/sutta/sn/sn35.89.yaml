notes: |-
  Dịch từ Pāli root; đối chiếu Sujato đã ghim (coverage 17/17 = 100%). Tầng `vietnamese-current` không có cho bài này.
  **Bài này và `sn47.15` (`Bāhiyasutta`) là cùng một văn bản.** Trùng nguyên văn **28 khoá**, dùng lại y nguyên văn **17**. Nguồn chính: `sn47.15` cho `0.3`, `1.2`, `16.1`, `16.2`, `16.3`, `16.4` — **cùng Pāli, dùng lại nguyên văn**; `sn35.150` cho `8.1`; `sn22.150` cho `4.1`, `5.1`, `11.1`, `12.1`; `sn22.159` cho `6.1`; `sn18.11` cho `6.2`, `13.2`; `sn18.2` cho `9.1`; `sn35.108`/`sn35.145` cho `15.3`. Tiêu đề phẩm `Channavagga` → *9. Phẩm Channa* (5 bài). `Chaṭṭhaṁ.` → *Thứ sáu.* (240).
  **Hai chỗ cố ý viết khác, kèm lý do.** (1) `‘neva hoti na na hoti tathāgato paraṁ maraṇā’` dịch *Như Lai phi tồn tại phi phi tồn tại sau khi chết* theo `sn16.12:1.15` (**cùng Pāli, luật 5**); kho còn *chẳng tồn tại chẳng không tồn tại* (`sn44.5`, Pāli khác vì có `tipissa hoti`) và *hoặc không có… mà cũng không không có* (`sn33.1/33.2`, Pāli khác vì có `…ti vā`). Chi tiết và đề xuất thống nhất nằm ở `sn24.36`; hai bài phải sửa cùng lúc nếu đổi. (2) `15.2` và `9.4` viết *xúc chạm*; `sn35.150` viết *xúc chạp* — đó là lỗi chính tả trong tệp bên kia, giữ chữ đúng của mình. `9.4` cũng dùng *khởi lên* (`uppajjati`) thay vì *sinh lên* của `sn35.150`.
  **Nháy kép cân trên cả bài (kiểm bằng `ngoặc()` của `_hvi.py`), dù Pāli lệch một `”`.** Pāli bài này có tổng `“` = 15, `”` = 16: `…pe…` ở `9.1–9.3` nuốt mất nháy đóng của lời thoại. Bản Việt đóng ngay sau `”` ở `1.2`, `6.2`, `7.1` (`””?`) và mở nháy ở `9.2` cho lời thoại Pāli không đánh dấu; `9.1` và `9.2` vì thế là hai lời riêng, đúng như Pāli đóng `”` ngay sau `Aniccā, bhante` rồi lại mở ở `cakkhuviññāṇaṁ`.
  **Bất định đã ghi nhận.** `1.1` `tenupasaṅkami …pe… ekamantaṁ nisinno … etadavoca:` — `…pe…` nuốt *đến nơi, đảnh lễ Ngài*; giữ **một** `…` và không thêm những gì không có trong Pāli. `16.2` `brahmacariyapariyosānaṁ` → *mục đích tối thượng của đời sống phạm hạnh* (dùng lại nguyên văn của `sn47.15`). `16.4` `arahataṁ ahosīti` → *một trong các bậc A-la-hán* (không thêm *đã chứng ngộ* vì Pāli chỉ nói *trở thành*).
  `notes` dùng khối literal `|-` thụt 2, đã đọc mẫu đích trước khi ghi (thư mục đích đang dùng cả `|-` lẫn `- >-`: 505 tệp `|-` và 1.038 tệp `- >-`). Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` (và `npm run build` vì có bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9.6 chứ không 10.0.
