notes: |-
  **ĐỌC TOÀN BỘ PĀLI 44 KHOÁ TRƯỚC KHI VIẾT**, in lại từng cặp Pāli↔Việt sau khi ghi.

  **COVERAGE TẦNG ANH 20/22 = 0.91**, cộng thêm lớp lấp `english-project` đã có cho `sn24.8`
  (`content/translation/en/project/sutta/sn/sn24.8_*.json`, bản lấp của chính dự án) ⇒ trên
  ngưỡng 0.8, `published` được phép. Hai khoá Pāli có nội dung bị Sujato để trống: `:3.4`
  (bản lấp của dự án có) và `:3.12` (bản lấp của dự án có) — không khoá nào phải đứng không
  tầng tham khảo.

  **DÙNG LẠI NGUYÊN VĂN 9 KHOÁ PĦI TRÙNG.** Đo trên lát: 148 khoá Pāli ≥ 25 ký tự, **30**
  khoá trùng **nguyên văn** với một bài đã dịch; **11** cặp nằm trong `sn24.8` và cả 11 đều
  dùng lại nguyên văn: `:1.2`→`sn24.14:1.2` · `:2.1`→`sn24.71:2.1` · `:2.7`→`sn24.71:2.6` ·
  `:3.1`→`sn24.2:2.1` · `:3.2`→`sn24.71:2.9` · `:3.8`→`sn24.2:2.12` · `:3.10`→`sn24.2:2.9` ·
  `:4.1`→`sn24.2:3.1` · `:4.2`→`sn24.2:3.2` · `:1.14`→`dn2:20.10`. Ngoài ra `:1.11` dùng lại
  nguyên văn `dn2:20.7` (Pāli chỉ khác ở dấu câu), `:1.12`/`:1.13` ghép lại nguyên văn
  `dn2:20.8`+`dn2:20.9`, `:1.6` theo `dn2:26.5`, `:1.16` theo `sn54.14:1.3`.

  **BỐN BẢY THÀNH PHẦN.** `Pathavīkāyo … jīve sattame` → *Thân đất, thân nước, thân lửa,
  thân gió, lạc, khổ, và mạng sống là thứ bảy* (`dn2:26.5`, gần như y hệt). Bản Sujato đọc
  `jīve` là *the soul*; Pāli là `jīva` (sinh vật/mạng sống) và `mn76:16.5` đã dịch
  *linh hồn* — tôi theo **Pāli**, không theo Sujato. `akaṭā, akaṭavidhā, animmitā,
  animmātā, vañjhā, kūṭaṭṭhā, esikaṭṭhāyiṭṭhitā` → *không chế tạo, không tạo ra từ điều
  kiện, không sinh tạo, không có tác nhân, hoang vắng, vững như đỉnh núi, đứng vững như cột
  trụ*.

  **`:1.11` — DANH SÁCH HÀNG TRĂM.** `Cuddasa kho panimāni … dukkhassantaṁ karissanti.` dài
  356 ký tự, gần như y hệt `dn2:20.7`; tôi dùng lại **nguyên văn** bản Việt của `dn2` để hai
  nơi nói một cách và để không tự bịa cách liệt kê mới. `:1.12`–`:1.13` cũng vậy.

  **DẤU LƯỢC.** Tám khoá có `…pe…` (`:1.16` `:2.2` `:2.4` `:3.3` `:3.5` `:3.9` `:3.11`
  `:4.1`) → **đúng mỗi khoá một** `…`. Bản Anh Sujato **mở rộng** hai chỗ (`:2.2` và `:2.8`
  thành *There are these seven substances that are not made …*) và `:4.1` nối liền sáu căn —
  Pāli lược thì tôi giữ lược, không mở rộng.

  **⚠ NGOẶC KÉP — MỘT CHỖ LỆCH CÓ CHỦ Ý, ĐÃ ĐẾM.** Pāli của bài này **chênh +1**: dấu `“` ở
  `:1.16` (lời Citta) **không** được đóng trong bài, vì bài bị cắt giữa lời. Bản Việt vì thế
  **không** đặt dấu mở ở `:1.16`, đúng như tiền lệ đã đo trên toàn tầng: `sn24.71` (Pāli +1,
  Việt 0), `sn43.3`–`43.9` (P +1, V 0), `sn56.63`–`56.97` (P +1, V 0), `sn19.12`–`19.15`
  (P +1, V 0). Ngoài ra hai khoa soát đối chiếu: bản nháp đầu của tôi đặt thêm nháy kép ở
  `:1.12`/`:1.13` (Pāli không có) và thêm nháy cong ở `:1.7` (Pāli không có) — đã gỡ.
  Sau khi sửa, **mọi khoá khớp Pāli về số `“ ” ‘ ’`**, trừ đúng `:1.16` nêu trên.

  **VẾ HỎI `:1.15` / `:3.6` / `:3.12`.** Pāli kết `’”ti?` (cả ba dấu). Tôi giữ đủ: `’”ti?`.

