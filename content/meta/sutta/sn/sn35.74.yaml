  trong tầng, `virāgā` cũng vậy). `nibbinda` → *chán nản*, `nibbindati` → *chán nản*
  (theo `sn35.73:15.1`–`15.2`). `anukampaṁ upādāyā` → *vì lòng thương tưởng*
  (`an3.64:2.6`, `an4.159:1.7`, `an5.44:2.4`). `mayā` khi Thế Tôn tự xưng → *Ta*
