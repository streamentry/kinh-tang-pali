  **⚠ BẤT ĐỊNH ĐÃ PHÂN XỬ — dấu nháy kép ở `14.1`.** Pāli `14.1` là `“ …pe…`: nó
  **mở** ngoặc kép (đóng ở `14.6`), đồng thời chỉ chứa dấu lược. Đo được 641 khoa có
  Pāli dạng này và 637 bản Việt **bỏ** dấu mở — nhưng bỏ thì `14.6` thành ngoặc đóng
  không mở và `ngoặc()` trong `_hvi.py` chặn. Tôi giữ dấu mở: `“…`. **Tiền lệ trực
  tiếp:** `sn18.11:1.12` có Pāli `“Sotaṁ …pe…` (mở ngoặc **và** mang dấu lược) và bản
  Việt giữ cả hai (`“Với tai … `). Đây là ngoại lệ có chủ đích so với đa số 637, và tôi
  ghi ra đây để người biên tập phán xử nếu muốn thống nhất hóa.

  **⚠ KHÔNG sao chép lỗi của tiền lệ ở `20.3`.** `sn22.54:4.10` có Pāli **trùng từng
  chữ** với `20.3` (`‘Khīṇā jāti …pe… nāparaṁ itthattāyā’ti pajānātī”ti.`), nhưng bản
  Việt ở đó **bung nội dung ra khỏi dấu lược**: nó viết *"Sanh đã tận … phạm hạnh đã
  thành, việc cần làm đã làm xong, không còn trở lại…"* — tức thêm `vusitaṁ
  brahmacariyaṁ, kataṁ karaṇīyaṁ` vốn nằm **trong** `…pe…`. Đó là vi phạm §10.1 của
  `BRIEF_VI3`, và tôi không lặp lại: `20.3` của tôi chỉ giữ *"Sanh đã tận … không còn
  trở lại trạng thái này nữa"*. **Người biên tập nên vá `sn22.54:4.10`**, vì nó đã
  `published` và có lỗi này. (Tôi không sửa vì ngoài lát của tôi.)

  **Về dấu lược:** `lược()` khớp từng khoá — 0 lệch. Cụ thể `1.2`, `14.1`, `20.1`,
  `20.3` mang `…pe…` ⇒ **một** dấu `…`; `14.2`–`14.5` mang `…` trần ⇒ **một** dấu
  `…`; không khoá nào có Pāli viết đủ mà tôi nén bằng `…`, nên không có chỗ nào cần
  người biên tập phán xử theo §10.2. Riêng `20.1`: Sujato đã điền đủ sáu căn, nhưng
  Pāli chỉ có `cakkhu … sotam … …pe… manam`, tôi giữ theo Pāli và không mở rộng.

  **Thuật ngữ, kèm số đếm:** `phassāyatana` không dùng ở bài này. `khamanīyaṁ /
  yāpanīyaṁ` → *dễ chịu / đủ sức* (15 bài: `sn46.14:2.1`–`2.2`, `sn46.15:2.2`,
