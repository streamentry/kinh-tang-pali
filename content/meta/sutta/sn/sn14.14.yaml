notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của harness gần như không kiểm gì ở bài này, nên tôi tự quét toàn bộ khoá từ đĩa.** Mọi vế kệ ngắn hơn 40 ký tự nên bộ lọc `substantivePaliMinChars: 40` trong `source/layers.yaml` không thấy segment nào; tôi đọc Pāli thật của từng khoá từ `.cache/upstream/suttacentral/` theo `sourcePath` trong catalog, đối chiếu tay với bản Việt, rồi quét máy: tập khoá Việt bằng đúng tập khoá Pāli (17/17, đúng exact ID, không orphan), mọi giá trị NFC và không rỗng, ngoặc kép cong cân trên cả bài, không có `(…)`, dấu lược khớp Pāli từng khoá.
  - |-
    **Không thể tuyên bố technical gate pass.** Đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tiêu chí 10 bị chặn ở 9.6: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, NFC, ngoặc kép cân cả bài và YAML sạch. Người biên tập phải chạy lại bốn lệnh trên trước khi đổi trạng thái.
  - |-
    **Tầng Anh đủ ở đây, và tôi đã kiểm cả tầng lấp.** Sujato để trống `2.2`, `2.3`, `3.2`, `3.3` — đúng bốn khoá bị lược bằng peyyāla — nhưng dự án đã có lớp `english-project` cho chính bốn khoá đó (`content/translation/en/project/sutta/sn/`, trạng thái published). Tính cả hai tầng: **13/14 khoá nội dung có English, 92,9%**; khoá duy nhất còn im lặng là `4.4` `Catutthaṁ.`, tức dòng đánh số tham chiếu. Trên phép đo chính thức trong `source/layers.yaml` (Pāli từ 40 ký tự, bỏ khối `:0`) là 12/12 vì bốn khoá bị lược đều dài hơn 40 ký tự và đã được lấp đủ. **Vượt ngưỡng 0,8, không cần ghi vào `content/meta/reference-gaps.yaml`.**
  - |-
    **Bốn khung thời gian được phân biệt đúng, đây là phần dễ hỏng nhất của bài và bản dịch không hỏng.** `samenti` ở hiện tại → *hòa hợp và tụ hội*; `saṁsandiṁsu samiṁsu` ở quá khứ → *đã hòa hợp và tụ hội*; `saṁsandissanti samessanti` ở vị lai → *sẽ hòa hợp và tụ hội*. Cả mười hai vế đều mang dấu thời, và bản Việt không có vế nào trần thời. Đây là điểm tốt cần nói rõ.
  - |-
    **Thuật ngữ nhất quán và có tiền lệ đã publish.** `hīnādhimuttikā` → *khuynh hướng hèn hạ* và `kalyāṇādhimuttikā` → *khuynh hướng tốt đẹp*, dùng đúng như vậy ở cả tám chỗ, và `iti78` đã publish dùng đúng hai cụm này cho cùng hai thuật ngữ — nên đây là tiền lệ có sẵn chứ không phải cách đặt mới. `Dhātusova` → *do giới tánh*, xuất hiện 23 lần trong tầng Việt và ở chính nhóm `sn14` này (`sn14.3`, `sn14.7`, `sn14.8`, `sn14.9`, `sn14.21` đến `sn14.25`, `sn14.28`, `sn14.29`), nên bản dịch bám tiền lệ. `Saṁsandanti samenti` → *hòa hợp và tụ hội* giữ nguyên ở cả bốn khung.
  - |-
    **Tiêu đề dịch đúng công thức.** `Hīnādhimuttikasutta` → *Kinh Lấy Hướng Hèn Hạ Làm Gốc*: `adhimutti` là *lấy sở thích/định hướng làm căn cứ*, nên *làm gốc* giữ đúng nghĩa, không rút thành *Kinh Hèn Hạ*. `:0.2` `2. Dutiyavagga` → *2. Phẩm Thứ Hai* khớp 85 bài `sn` khác.
  - |-
    **Chỗ có thể bàn, không phải lỗi.** `Āveṇika` dịch *riêng biệt* (Sujato: *particular*). Với *đau khổ riêng biệt* thì rất đúng; ở đây nó mô tả năm điều chỉ *nữ giới* phải trải qua chứ không phải nam, nên *dành riêng cho nữ giới* sẽ rõ hơn. Tôi ghi để người điều phối thống nhất với `sn37.3`, vốn cũng dùng *riêng biệt*.
