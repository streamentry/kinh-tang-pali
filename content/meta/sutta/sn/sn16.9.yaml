    `ngồi kiết già` không dấu gạch nối (73/46) thay cho `ngồi kiết-già` (21/11).
  · Danh sách 16 mục ở `12.2–12.17` chọn **nguyên bộ** của ba bài có Pāli *giống hệt, cùng thứ tự*
    (`an3.101:5.2–5.17`, `an5.23:5.2–5.17`, `an5.28:13.2–13.17`): tâm có tham / không tham, có
    sân / không sân, có si / không si, thu hẹp, tán loạn, rộng lớn / không rộng lớn, thượng thừa,
    vô thượng, định / không định, **được giải thoát / không được giải thoát**. Trong đúng ngữ
    cảnh `X vā cittaṁ` đo được `vimuttaṁ`: "tâm được giải thoát" 13 > "tâm giải thoát" 9;
    `avimuttaṁ`: "tâm chưa giải thoát" 8 > "tâm không giải thoát" 5 > "tâm không được giải
    thoát" 3. **Tôi cố ý lệch phe đông nhất ở `avimuttaṁ`** vì `12.16` và `12.20` cùng một từ
    phải dịch giống nhau, và vì phải giữ cặp song song với `vimuttaṁ` của ba bài kia. Đây là
    lệch có chủ đích với `dn10:2.29.6` (`tâm chưa giải thoát là ‘tâm chưa giải thoát’.`) và
