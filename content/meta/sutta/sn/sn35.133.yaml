notes: |-
  Dịch từ Pāli root của chính bài này; bản Anh Bhikkhu Sujato chỉ dùng để đối chiếu cú pháp và sắc thái, và
  bản Việt hiện hành của Hòa thượng Thích Minh Châu vắng mặt: tại commit bilara đã ghim, thư viện ấy chỉ có
  26 tệp Pháp Cú, nên không có tầng đó cho bài này. Đó là đặc điểm của snapshot upstream, không phải thiếu sót.

  Bản dịch dùng lại nguyên văn: 9 cặp khoá, tức 18 khoá viết một lần rồi dùng lại, cộng 1 cặp nữa là
  2.3/4.8, tổng cộng 20 khoá. Chính xác 9 nhóm Pāli trùng nguyên văn trong bài đã đo bằng script:
  1.3/3.2 · 1.4/3.3 · 1.6/3.5 · 1.7/3.6 · 2.1/4.6 · 2.2/4.7 · 2.4/4.9 · 2.5/5.1 · 2.6/5.2,
  và 0 trên 9 nhóm bị dịch khác nhau. 2.3 với 4.8 chỉ khác Pāli ở dấu phẩy sau `kira` nên cũng dùng
  chung một văn bản. Nếu không, lần thứ hai của cậu thiếu niên sẽ tự mâu thuẫn với lần thứ nhất.

  Phe `ti` ở khoá đóng ngoặc kép — ĐO LẠI, và kết quả KHÔNG đồng nhất với những gì đang lưu hành.
  Toàn kho: BỎ 11.209 / GIỮ 2.591. Riêng `sn`: BỎ 2.036 / GIỮ 1.057. Riêng `sn35`: GIỮ 131 / BỎ 119.
  Riêng cùng phẩm Gahapativagga, tức sn35.124–133: BỎ 10 / GIỮ 4. Riêng sn35.120–149: BỎ 19 / GIỮ 16.
  Tức câu phe lớn đo được là giữ chỉ đúng ở phạm vi toàn bộ sn35, và chỉ hơn 12 khoá; ở phạm vi sát nhất —
  cùng phẩm, cùng những bài kề — đa số là BỎ, và cả 4 ca GIỮ đều nằm trong một tệp duy nhất là sn35.127.
  Bài này chọn BỎ: 12 khoá Pāli kết bằng `”ti` hay `’ti` đều bỏ `ti`, tức 0 GIỮ / 12 BỎ.

  Dấu lược: Pāli có `…pe…` ở đúng 2 khoá là 6.1 và 6.2, mỗi khoá giữ một `…` trần, không mở rộng, không thêm
  dấu chấm. Đo toàn tầng, khoá Pāli kết bằng `…pe…` được dịch thành `…` trần 4.137 lần, thành `….` chỉ 150,
  còn 164 khoá kết bằng lược rồi tới ngoặc kép, nên `…` trần đúng phe lớn. 6.1 vừa mở ngoặc kép vừa mang
  lược, dạng `“Cakkhusmiṁ … …pe…`, KHÔNG phải dạng `“ …pe…` của sn35.74:14.1: trước dấu lược có nội dung
  thật nên giữ `“`, và giữ luôn ở đây.

  Thuật ngữ — mọi mục đều đếm trên tầng Việt hiện có, không đoán. Các số dưới đây đếm trên các tệp KHÁC,
  không tính sn35.133: `samaṇa` thành Sa-môn 655 so với đạo sĩ 4 · `āyasmā` thành Tôn giả 2.705 ·
  `māṇavaka` thành thiếu niên 17 so với thanh niên 12 · `brahmacariya` thành
  phạm hạnh 996 · `ambavane` thành vườn xoài · `dhammiyā kathāya` thành pháp thoại 75 · `onītapattapāṇiṁ`
  thành rút tay khỏi bát 7 · `nivesanaṁ` thành đến nhà 33 · `paññatte āsane` thành chỗ đã soạn · `paññapenti`
  thành tuyên bố 46 · `adhivāsetu … bhattaṁ` thành nhận lời 23 · `ādikalyāṇaṁ` thành tốt đẹp ở phần đầu 36 ·
  `sātthaṁ sabyañjanaṁ` thành đầy đủ ý nghĩa và lời văn 45 · `brahmacariyaṁ pakāseti` thành trình bày đời sống
  phạm hạnh 34 · `mūḷhassa maggaṁ ācikkheyya` thành chỉ đường cho người lạc 53 · `nikkujjitaṁ vā ukkujjeyya`
  có 52 khoá dùng chữ dựng, trong đó 46 kèm chữ lật hoặc đổ và chỉ 6 khoá dựng trần ·
  `anekapariyāyena dhammo pakāsito` thành bằng nhiều cách 32 ·
  `abhikkantaṁ` thành Thật vi diệu thay 45 · `Esāhaṁ … saraṇaṁ gacchāmi` thành tôi đi quy y theo sn35.127:5.8 ·
  `dhāretu` thành ghi nhận … đã quy y · `Dasamaṁ` thành Thứ mười. 254 · `Tassuddānaṁ` thành Tóm lược: 371 ·
  `Xvaggo tatiyo` thành Phẩm …, thứ ba. · khoá 0.2 thành 13. Phẩm Gia Chủ, đúng câu mà tám tệp cùng phẩm
  sn35.124–131 đã dùng, đếm đủ cả tám · khoá 0.3 thành Kinh Verahaccāni, theo Kinh Ghosita của sn35.129.
  Hai mục KHÔNG có tiền lệ khớp Pāli nào trong kho, nên ghi rõ: `bhagini` số ít dịch là chị, khớp với
  `bhaginimattīsu` thành phụ nữ ngang tuổi chị em ở sn35.127:1.6; `telapajjotaṁ` dịch là ngọn đèn dầu vì `tela`
  là dầu và nằm tường minh trong Pāli, dù cụm đèn trần đứng đầu bảng đếm với 30 so với 23.

  Bất định đã ghi, không che. Một: `bhagini` là xưng hô với người đàn bà trần trụi, Sujato dịch sister; chọn
  chị vì tiếng Việt không có từ nào vừa trang trọng vừa quen, và đổi cả ba khoá 2.9, 4.2, 6.1 cùng lúc nếu
  biên tập muốn tỷ. Hai: `bhattan` ở 2.3 và 4.8 là động từ gốc bhā nghĩa dâng thức ăn, dịch là đã cung cấp;
  Sujato để an offering of, còn bản dịch không thêm chữ cúng dường vì Pāli không có từ nào mang nghĩa phận sự.
  Ba: `kismiṁ nu kho … sati` ở 5.4 là đại từ hỏi cố ý bị Pāli giấu, câu trả lời chỉ xuất hiện ở 6.1 là con mắt;
  bản Việt giữ đúng tính chất hỏi với một cái gì và không điền con mắt vào 5.4. Bốn: `ācariyabhariyā` ở 2.3
  và 4.8 nghĩa là vợ của thầy, còn 1.2 gọi cậu thiếu niên là đệ tử ở nhà của bà ấy; hai câu không mâu thuẫn nếu
  thầy của cậu là chồng bà ấy, và bản dịch giữ nguyên cả hai, không tự hoà giải. Năm: `dhammagaruno …
  dhammagāravā` ở 4.5 là cặp garu và gāru đóng vai chủ bậc trọng, dịch là lấy Pháp làm chủ và rất kính trọng
  Pháp để giữ cả hai, thay vì lặp tôn trọng Pháp hai lần.

  Tầng Anh: Sujato có mặt, đường dẫn phẳng `translation/en/sujato/sutta/sn/sn35/sn35.133_…`, tra
  `source/upstream-manifest.json` chứ không đoán theo tên thư mục. Mẫu số là 39 khoá Pāli có nội dung, tức
  dài từ 40 ký tự trở lên và bỏ khối đánh số dạng `:X.0`. Sujato có chữ ở 33 trên 39, bằng 0,8462 — đã trên
  ngưỡng 0,8 của `source/layers.yaml` ngay cả khi chỉ tính một mình Sujato. Sujato để trống sáu khoá có nội
  dung: 3.2 · 3.3 · 3.6 · 4.8 · 4.9 · 5.1. Cả sáu đã có trong lớp `english-project`, tệp
  `content/meta/en/sn/sn35.133.yaml` đang ở trạng thái published, nên số khoá còn lấp được bằng lớp đó là 0
  và coverage tính cả hai tầng là 39/39 bằng 1,0000. Vì sáu khoá ấy do cùng loại agent viết, chúng không
  phải một cách đọc English độc lập, nên `triangulation` hạ xuống 8,0 và bài này không được tuyên bố là đã
  đối chiếu English ở toàn bộ.

  Bảy tên riêng có dấu Pāli bị `_hvi.lọt_pāli` chặn vì lần đầu xuất hiện trong tầng Việt, dù đều suy ra được
  từ chính Pāli của bài này: `Kāmaṇḍā` từ 1.1 `kāmaṇḍāyaṁ`; `Verahaccāni` từ 0.3 `Verahaccānisutta` và
  thân bài `verahaccānigottā…`; `Vajjī`, `Soṇa`, `Ghosita`, `Hāliddikā`, `Lohicca` từ udāna 8.1–8.4 cho dạng
  có hậu tố cách. Đúng theo docstring của `_hvi`, agent phải tự tra chứng rồi khai tên vào bộ nhớ tiếng trình,
  nên bảy tên ấy được khai trong script riêng của lát này; `_hvi.py` không bị sửa.

  `technical_integrity` bằng 9,6 vì lát này bị cấm chạy cổng, nên không thể tuyên bố technical gate đã pass.
