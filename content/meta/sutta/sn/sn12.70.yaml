notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không căn theo segment nên chỉ dùng để đối chiếu thuật ngữ và mạch lập luận, không dùng làm tầng cột). Tầng `vietnamese-current` căn theo segment không có cho bài này (tại commit đã ghim chỉ có 26 chương Pháp Cú). Bài đủ 180/180 khoá của Pāli, đúng thứ tự Pāli.
  **Coverage English, đo thật.** Mẫu số = 107 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Sujato phủ **102/107 = 0,9533**, trên ngưỡng 0,80 nên không có blocker coverage và không cần entry trong `content/meta/reference-gaps.yaml`. Năm khoá Sujato để trống: `4.4`, `4.5`, `4.9`, `22.2`, `22.3` (đều là chỗ Sujato nối câu qua đoạn trích dẫn lại hoặc đoạn lược `…pe…`). Cả năm khoá đó đã được lớp `english-project` (đã published) lấp; tính cả hai lớp thì 107/107 = 1,00, nhưng lớp lấp **không phải bản đọc độc lập** nên bài này chỉ tuyên bố đã đối chiếu English độc lập cho 102/107 khoá, và `triangulation` hạ xuống 9,0 vì vậy. Các khoá dưới 40 ký tự không vào mẫu số, trong đó `16.3` (`Yā kāci saññā …pe…`, 18 ký tự) vẫn được Sujato phủ đủ. Các khoá `2.4`, `3.2`, `15.7`, `15.14`, `15.23`, `15.30`, `11.2` có Pāli 40–42 ký tự, sát ngưỡng và đều được Sujato phủ.
  **Dùng lại nguyên văn, đếm được.** Trong chính bài có **123 cặp** Pāli trùng nguyên văn (so sau khi cắt khoảng trắng; chủ yếu là các lời đáp `No hetaṁ`, `Evaṁ, bhante` và bốn nhóm `15.x` cho sắc, cảm thọ, hành, thức), **0 cặp bản Việt khác**. Ở các khoá Pāli gần giống nhau nhưng khác ngôi (`5.1` so với `20.1`, `6.1` so với `21.1`, `7.1` so với `22.1`) bản Việt chỉ khác đúng chỗ khác đó (*các Tôn giả* so với *ông, này Susima*). Trong **tầng**: **74 khoá** của bài có Pāli trùng nguyên văn với khoá ở bài khác, tổng **7.122 cặp**; bản Việt trong tầng lệch nhau nhiều (lời đáp ngắn như `No hetaṁ, bhante` có 303 cặp với hàng chục cách viết), nên 4.209/7.122 cặp khác bản của bài này là cái giá của việc tầng không đồng nhất, không phải lỗi. Bài này chọn đúng **một** trong các cách đã có ở 73/74 khoá, theo đa số ở phạm vi `sn` khi `sn` và toàn tầng khác nhau (ví dụ `Cái gì vô thường là khổ hay lạc?` 18 trong 57 khoá `sn` so với 22 trong 83 toàn tầng; `Thưa không phải vậy, bạch Thế Tôn` 99/303 toàn tầng và 12/12 trong `sn12`). Khoá duy nhất khác mọi cách đã có là `1.2` (viết thường *một thời* sau dấu `—` của `1.1`, đúng như `sn12.71:1.2`; 38 cặp trong tầng đều viết hoa vì đứng sau câu kết bằng dấu chấm).
  **Thuật ngữ, theo tiền lệ đã đo.** `sakkato garukato mānito pūjito apacito` → *được cung kính, trọng vọng, tôn kính, cúng dường, đảnh lễ* đúng như `ud2.4:1.3` và `ud3.8` (cùng chuỗi Pāli; 7 khoá `ud`), vì tầng chưa có cách nào khác cho chuỗi năm từ này; riêng `apacito` → *đảnh lễ* là cách hiểu của `ud`, bản Sujato dịch *esteemed*. `cīvara…parikkhāra` → *y phục, thức ăn khất thực, chỗ ở, thuốc men và vật dụng cho người bệnh* theo `mn17` (16 khoá) và `sn12.22:3.8`. `dhammavinaya` → *Pháp và Luật* (188 khoá toàn tầng, 25 trong `sn`, so với *giáo pháp và luật* 2 trong `sn`; `mn26:15.2` viết *giáo pháp và kỷ luật*). `svākkhāte` → *được khéo thuyết giảng* theo `sn11.1:8.2`. `dhammatthenako` → *kẻ trộm Pháp*: **0** tiền lệ trong tầng, bám Pāli (`dhamma` + `thenaka`); Sujato dịch *thief of the teachings*, Thích Minh Châu *người ăn trộm pháp*. `accayo maṁ accagamā yathābālaṁ yathāmūḷhaṁ yathāakusalaṁ` → *đã phạm lỗi như kẻ ngu, như kẻ mê, như kẻ bất thiện* (10 khoá, từ `an9.11:13.4`) so với *vì ngu si, mê muội, bất thiện* (6 khoá, `mn140`, `dn25`); chọn dạng đa số, cũng sát chữ `yathā-` (*như*) hơn. `aññā byākatā` → *tuyên bố thắng trí* đúng như `mn105:2.1` (cùng Pāli, 4 khoá), so với *tuyên bố chánh trí* (`mn112`, 1 khoá) và *tuyên bố chứng ngộ cứu cánh giải thoát* (`sn48.49`, 2 khoá). `pajānāmā` → *chúng tôi biết rõ như vậy* theo `mn105:2.2`. `paññāvimutta` → *tuệ giải thoát* (107 trong 266 cặp). `aññatitthiyā paribbājakā` → *du sĩ ngoại đạo* (139 khoá so với *ngoại đạo* 15). Các chuỗi dài về thần thông, tha tâm, túc mạng, thiên nhãn, thiên nhĩ lấy đúng cách dịch của `dn10:2.25`, `dn10:2.28`, `dn10:2.30`, `dn2:87`, `an10.97:10.1`, `an11.14:13.1` (cùng chuỗi Pāli): *thiên nhãn thanh tịnh vượt trên mắt người* (11 khoá trong `sn`/`an`), *thiên nhĩ thanh tịnh vượt trên tai người* (3), *tâm quảng đại* (`mahaggata`), *tâm hữu thượng* / *tâm vô thượng* (`sauttara`/`anuttara`, `dn10`, 4 khoá), *chết đi và tái sinh, thấp kém hay cao quý, đẹp hay xấu, đi đến cảnh giới tốt hay xấu* (13 khoá toàn tầng, đầu là `mn130:2.2`). `ye te santā vimokkhā atikkamma rūpe āruppā, te kāyena phusitvā viharati` → *thân chứng và an trú những giải thoát trầm lặng vượt khỏi sắc, thuộc vô sắc* theo `mn70:15.2` (6 khoá). `sutavā ariyasāvako` → *bậc Thánh đệ tử đa văn* (giữ `sāvaka`): trong tầng *bậc Thánh đa văn* 80, *Thánh đệ tử đa văn* 10, *đệ tử Thánh…* 4; không theo dạng đa số vì dạng đó bỏ mất `sāvaka`. `nibbindati` → *chán nản* (211 khoá toàn tầng so với *nhàm chán* 105; trong `sn22` 36 so với 13). `vedanā` → *cảm thọ* (29 so với *thọ* 13 trong `sn`, và 11 so với 3 trong `sn12` như đã ghi ở `sn12.68`). Dãy mười một chi duyên khởi (`18.x`, `19.x`): *sinh, già chết, hữu, chấp thủ, khát ái, cảm thọ, xúc, sáu xứ, danh sắc, thức, các hành, vô minh*; *do duyên … mà có …*, *diệt tận*, như `sn12.68` và `sn12.67`. `Evaṁ, bhante` → *Bạch Thế Tôn, đúng vậy.* (58/146). `Taggha tvaṁ` → *Thật vậy, này Susima, ông…* theo `dn25:22.4`, `mn140:33.5`. `accayaṁ accayato paṭiggaṇhātu` (`27.3`) dùng lại nguyên văn `mn65:7.3`, `mn65:10.2`, `mn65:13.3` (3 khoá giống nhau; `dn25:22.3` và `mn140:33.4` viết khác). `28.3` dùng lại nguyên văn `sn12.63:6.3` và `mn129:8.3`; `28.4` dùng lại *Nhà vua nói như vầy:* (6 khoá). Khối hình phạt (`28.5`, `28.6`) theo `an4.244:1.7`–`1.8`, `dn23:7.7`, `dn26:12.18` cho `rathiyāya rathiyaṁ siṅghāṭakena siṅghāṭakaṁ` (*từ đường này sang đường khác, từ ngã tư này sang ngã tư khác*) và `kharassarena paṇavena` (*tiếng trống chói tai*).
  **Tên riêng.** Pāli root của cả bài đọc *susimo* (ngắn), nên viết **Susima**, khác *Susīma* trong bản Anh Sujato và Thích Minh Châu. Tầng có 26 khoá viết *Susīma*, trong đó `sn11.2`, `sn11.10`, `ja411` là nhân vật khác (thiên tử, Bồ-tát; Pāli root ở đó là *susīma* dài); không lấy làm tiền lệ cho vị du sĩ này. `Rājagaha`, `Ānanda`, `Gotama`, `Veḷuvana` → *Trúc Lâm* theo tiền lệ của tầng (cùng *chỗ nuôi dưỡng sóc* cho `kalandakanivāpa`).
  **Số và danh sách Pāli.** `8.1` liệt kê đúng 13 số theo Pāli: `ekampi` 1, `dvepi` 2, `tissopi` 3, `catassopi` 4, `pañcapi` 5, `dasapi` 10, `vīsampi` 20, `tiṁsampi` 30, `cattārīsampi` 40, `paññāsampi` 50, `jātisatampi` 100, `jātisahassampi` 1.000, `jātisatasahassampi` 100.000 (100 × 1.000); bản Thích Minh Châu thêm *hai trăm đời* mà Pāli ghim không có nên **không** theo. Mười một chi duyên khởi ở `18.x` đếm được 4 + 7 = 11 khoá và ở `19.x` 2 + 9 = 11 khoá, mỗi chiều đủ cặp từ `jāti/jarāmaraṇa` đến `avijjā/saṅkhārā`. Tám cặp tâm ở `7.2`–`7.17`: 16 khoá cho 8 cặp (tham, sân, si, co rút/tán loạn, quảng đại, hữu thượng, có định, giải thoát), đúng bằng Pāli. Năm uẩn ở `15.x` và `16.x`: sắc, cảm thọ, tưởng, các hành, thức. `Dasamaṁ` → *Thứ mười*; `Mahāvaggo sattamo` → *Phẩm Lớn, chương thứ bảy*; `Dve assutavatā vuttā` → *Hai bài*.
  **Dấu câu, nháy và dấu lược.** Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá (180 khoá, 0 lệch); vì bài là một lời thoại dài, nháy kép mở ở `14.3` chạy qua `15.1` (không nháy) đến `15.2`, và nháy mở ở `16.1` chạy qua `16.2`–`17.3` đến `18.1` (khoá này đóng bằng `”` mà không mở), đúng như Pāli. Ở `16.1`–`16.5` Pāli không có nháy đơn (`netaṁ mama nesohamasmi na meso attāti`) nên bản Việt cũng không thêm nháy đơn. Dấu lược: 19 khoá Pāli có `…`, `…pe…` hoặc `…` trần (`15.17`, `16.3`, `18.9`–`18.14`, `19.5`–`19.12`, `22.2`, `23.1`, `24.1`); cả 19 khoá Việt giữ đúng một `…`, không mở rộng. Pāli không có `(…)` ở khoá nào nên Việt cũng không có. NFC, không khoá rỗng, không khoảng trắng thừa; Pāli chỉ lọt sang bản Việt ở tên riêng (`Saṁyutta Nikāya`, `Rājagaha`, `Ānanda`, `Kosambī`, `Susima`, `Gotama`).
  **Bất định đã ghi nhận, không che.** (1) `11.1`, `26.1` `idaṁ no, āvuso, kathaṁ`: tiểu từ `no` có thể là *cho chúng tôi* hoặc là biến thể của `nu`; bản Anh Sujato gộp cả câu thành *how could there be such a declaration when these things are not attained?*, bản Thích Minh Châu dịch *như thế nào?*. Bài này dịch *vừa có lời tuyên bố này, vừa không chứng đạt những pháp ấy; việc này … là thế nào?*, giữ hai vế `idañca … imesañca`, không dịch riêng `no`. (2) `13.3`, `14.3` `dhammaṭṭhitiñāṇaṁ`: *trí về sự thường trú của pháp* theo `sn12.34:2.6` (tiền lệ duy nhất, cùng tương ưng); bản Anh Sujato dịch *stability of natural principles*. *Thường trú* có thể gợi nghĩa *thường còn*, nhưng `ṭhiti` ở đây là sự đứng vững, sự ổn định của pháp (lý duyên khởi); người biên tập có thể đổi nếu muốn thống nhất lại. (3) `29.1`–`29.2`: Pāli `Yaṁ kho so … paṭisaṁvediyetha.` kết bằng dấu chấm rồi mới tới `Yā evaṁ svākkhāte … ayaṁ tato dukkhavipākatarā`; cú pháp là một mệnh đề quan hệ treo (*nỗi khổ mà người ấy sẽ cảm thọ — sự xuất gia … khổ hơn nỗi ấy*). Sujato thêm *Although*, Thích Minh Châu gộp một câu. Bài này giữ hai khoá, nối bằng dấu `—` ở `29.1` và `hơn nỗi ấy` ở `29.2`, không thêm từ liên kết nào ngoài cú pháp. (4) `2.4` `vāceyyāsi`: dạng sai khiến của `vāceti` (*cho đọc, dạy, truyền cho*); bản Anh Sujato dịch *have us recite it with you*, bản Thích Minh Châu *nói lại cho chúng tôi*; bài này dịch *dạy lại cho chúng tôi*, nghĩa là truyền cho họ, giữ cả hai khả năng trong mức Pāli cho phép. (5) `2.7`, `4.10` `Evamāvuso`: `āvuso` ở số ít nhưng người nghe ở `2.7` là cả hội chúng (Sujato: *reverends*); *hiền giả* không phân biệt số nên không cần thêm chữ. (6) `22.3` kết ở `vimuttaṁ vā cittaṁ vimuttaṁ cittanti` (không có vế `avimuttaṁ` như `7.17`); bản Việt theo Pāli, không bổ sung. (7) `5.1`–`10.1`, `20.1`–`25.1` `Api pana`: tiểu từ hỏi; bản Việt thêm *hay không* ở cuối từng câu để thành câu hỏi, vì Pāli không có chữ riêng cho *hay không*. (8) `4.8` `saccaṁ kira`: *có thật chăng* gộp `saccaṁ` và `kira`; không thêm *nghe nói*. (9) `29.3` `mayaṁ paṭiggaṇhāma`: số nhiều của Đức Phật, dịch *Ta* như `dn2:100.2`, `dn25:22.5`. (10) Khối tóm lược `30.x`: tựa các bài lấy từ `translationTitle` của `sn12.61`, `sn12.62`, `sn12.63`, `sn12.64`, `sn12.65`, `sn12.67`, `sn12.68` (*Người Chưa Học*, *Thịt Con*, *Có Tham*, *Thành Phố*, *Bó Lau*, *Ở Kosambī*), `sn12.69` (*Dẫn Dắt Đến Bờ Bên Kia*), `sn12.70` (*Du Sĩ Susima*). `sn12.66` (`Sammasa`, Sujato: *Probing Within*) chưa có bản Việt hay metadata trong tầng tại commit này nên `Quán Xét` là tên tạm; cần đồng bộ khi `sn12.66` được dịch. Tựa `sn12.69` trong metadata của bài ấy (*Dẫn Dắt Đến Bờ Bên Kia* cho `Upayantisutta`, Sujato: *Surge*) có vẻ lệch nghĩa; chỉ ghi nhận, không sửa vì ngoài lát này.
  **Khác biệt với bản đối chiếu, đã phân xử bằng Pāli.** Thích Minh Châu viết `Vi-n 20` *hai trăm đời* (không có trong Pāli); gộp các câu hỏi tuyên bố (`Vi-n 23`–`25`) khác cấu trúc với `11.1`–`11.2`; lược một số chỗ bằng *(như trên)* ở những khoá Pāli viết đủ (`Vi-n 39`, `41` cho `16.2`, `16.4`). Bản Sujato dịch `17.2` *desire fades away* cho `virajjati`; bài này giữ *ly tham* theo tầng (`sn18.1`, `sn22.x`). Pāli luôn thắng khi ba nguồn khác nhau.
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 180/180, đúng thứ tự Pāli. Nháy đơn và nháy kép khớp Pāli từng khoá, mẫu số 180, 0 lệch. Dấu lược cân bằng từng khoá, mẫu số 180, 0 lệch. Cặp Pāli trùng nguyên văn trong bài: 123 cặp, 0 cặp bản Việt khác. Số Pāli: 13 số ở `8.1`, 11 chi ở `18.x`, 11 chi ở `19.x`, đều đối chiếu lại bằng cách đếm; không có cụm số chưa phân xử được. Cả 180 cặp Pāli và Việt đã được đọc lại đối kháng từng cặp.
