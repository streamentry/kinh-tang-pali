notes: |-
  Lát c55. Mệnh đề 0.1 đo lại: toàn tầng `sn` dùng “Saṁyutta” 1612/1612; “Saṡyutta”
  (s có dấu chấm dưới) = 0. Dùng y hệt.

  Trùng nguyên văn Pāli: `“asu amutra upapanno, asu amutra upapanno”ti.` ×6 — gồm
  2.4, 2.6, 3.7, 3.9, 4.3, 4.5, **sáu khoá dùng lại nguyên văn một dạng** “Người kia
  sinh ra ở đây, người nọ sinh ra ở kia.” (tiền lệ: dn1 đã dịch `asu amutra upapanno`
  = “sinh ra ở đây” ở nhiều khoá). Đây là công thức Pāli lặp nguyên văn sáu lần; dịch
  mỗi khoá một kiểu khác nhau sẽ làm bài tự mâu thuẫn.
  `Sopi sāvakaṁ abbhatītaṁ kālaṅkataṁ upapattīsu byākaroti:` ×3 (2.3, 3.6, 4.2) và
  `Yopissa sāvako uttamapuriso…` ×2 (2.5, 3.8) — cũng dùng lại nguyên văn.

  0.3 “Kinh Tòa Tranh Luận” cho `Kutūhalasālāsutta`: grep toàn tầng Việt = **0 tiền lệ**
  (đã tra cả `kutūhalasālā`, `tòa tranh luận`, `hội tranh luận`, `đường tranh luận`).
  Tôi theo cách dịch của Sujato “The Debating Hall” và khuôn tiêu đề “Kinh …” của kho.
  Người điều phối nên thống nhất với AN 4.36 nếu bài đó có tiêu đề tương ứng.

  `saṅghī ca gaṇī ca gaṇācariyo … sādhusammato bahujanassa` dùng **nguyên văn** dạng
  của `dn2:2.2` (6 lần trong dn2): “có tăng đoàn, có hội chúng, là thầy dạy hội chúng,
  nổi tiếng, có danh vọng, là vị sáng lập tông phái được nhiều người tôn là bậc lành.”
  Cùng công thức, cùng cách dịch — không tự tạo cách thứ N+1.

  1.1/1.2 dùng lại nguyên văn `an3.57:1.1/1.2` (cùng câu chuyện Vacchagotta trong tòa
  tranh luận): “Rồi du sĩ Vacchagotta đi đến chỗ Đức Phật; đến nơi, chào hỏi Đức Phật.”

  Thuật ngữ: `kaṅkhā` = “nghi ngờ” (134 lần), `vicikicchā` = “hoài nghi” (199);
  `upādāna` (nghĩa nhiên liệu) = “nhiên liệu” — theo `mn99:17.2` “ngọn lửa cháy nhờ cỏ
  và củi làm nhiên liệu”; `nāṭaputta` → “Nigaṇṭha Nāṭaputta” (90 lần trong tầng Việt);
  `bho gotama` → “này ông Gotama” (51 lần). `Navamaṁ` → “Thứ chín.” (252 lần).

  Bất định đã ghi: `nānātitthiyānaṁ` (2.1) = “theo những tôn phái khác nhau”; grep
  “tôn phái” = 0 tiền lệ trong tầng Việt, tôi đặt cách này. Còn `sammā mānābhisamayā`
  (4.7): Sujato đọc “conceit”, tôi theo hướng “liễu tri đúng đắn ngã mạn” của hai tiền lệ
  kho đã có (an3.57 và sn35.36 cùng công thức) thay vì rút gọn thành “hiểu biết chính
  đác” — đó là lượt review tự bắt được.

  Triangulation 9.4: Sujato phủ 32/32 khoá Pāli ≥40 ký tự (100%); `vietnamese-current`
  vắng (chỉ có Pháp Cú tại commit đã ghim). Ba lớp tra tiền lệ: dn2 (công thức tôn
  phái), an3.57 (mở đầu), mn99 (nhiên liệu).

  Bị chặn cổng kỹ thuật (không được chạy `npm run validate|test|check|build`), tiêu chí 10
  ở **9.6**: đã xác minh JSON hợp lệ, 41/41 khoá, không orphan/rỗng, NFC, dấu lược khớp
  từng khoá, ngoặc kép cân 13/13, không `(…)` đứng một mình. Bốn lệnh npm để coordinator
  chạy.