    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Có tiền lệ: `Nāgavagga` → *1. Phẩm Rồng* (`sn29.10`, 9 bài) · `Supaṇṇavagga` → *1. Phẩm Kim Sí Điểu* (`sn30.2`) · `Valāhakavagga` → *1. Phẩm Mây* (`sn32.13-52`) · `Vacchagottavagga` → *1. Phẩm Vaccha* (`sn33.21-25`) · `Aniccavagga` (SN35) → *1. Phẩm Vô Thường* (`sn35.10`) · `Devadahavagga` → *14. Phẩm Devadaha* (`sn35.143*`) · `Saṭṭhipeyyālavagga` → *17. Phẩm Chuỗi Lặp Sáu Mươi* (`sn35.168`, 29 bài — **không** dùng *Sáu Mươi Bài Lược* nháp đã ghi) · `Yamakavagga` → *2. Phẩm Cặp Đôi* (`sn35.20` cùng phẩm; `sn35.21` ghi *Song Trùng*) · `Avijjāvagga` (SN35) → *6. Phẩm Vô Minh* (`sn35.53` cùng phẩm) · `Gilānavagga` → *8. Phẩm Người Bệnh* (`sn35.76` cùng phẩm) · `Rahogatavagga` → *2. Phẩm Về Trú Xa* (`sn36.12–14`, 5 bài) · `Aṭṭhasatapariyāyavagga` → *3. Phẩm Một Trăm Linh Tám Cách* (`sn36.24`/`26`) · `Jambukhādakavagga` → *1. Phẩm Jambukhādaka* (`sn38.16`) · `Moggallānavagga` → *1. Phẩm Mục-kiền-liên* (`sn40.11`) · `Dutiyavagga` (SN43) → *2. Phẩm Thứ Hai* (`sn4.20`/`sn6.15`) · `Vihāravagga` → *2. Phẩm Tào Môn* (`sn45.13–17`, 5 bài) · `Esanāvagga` → *13. Phẩm Tìm Kiếm* (`sn45.163–169`, 7 bài). **Hai chỗ phải ghi rõ lệch:** `sn45.19` ghi `Vihāravagga` thành *2. Phẩm Thiền* (Sujato *Meditation*, 0 tiền lệ tại lúc viết) — bài này theo đa số 5/6; và `sn36.27/28/29` ghi `Aṭṭhasatapariyāyavagga` theo ba cách khác, bài này theo `sn36.24/26` vì cùng phẩm và cùng vấn đáp `vedanā`.
  - >-
    Dùng lại nguyên văn đã `published`: khuôn `sn32.3-12` và `sn30.3/31.2*` cho phần hỏi–đáp–nguyện–sinh về; dãy dāna `annaṁ deti … padīpeyyaṁ deti` → *cho cơm … cho đèn* (dịch chữ từng món, không gộp thành *cho vật*).
  - >-
    0 tiền lệ, đặt mới, ghi kèm lý do: bốn loài `uṇha/abbha/vāta/vassa valāhaka` → *mây nóng / mây mù / mây gió / mây mưa*. Sujato dịch *hot / misty / windy / rainy*, `vāta` là mây gió (không phải mây có gió). Tiến lệ có sẵn chỉ là *mây lạnh* cho `valāhakakāyikā devā` ở `sn22.151*`, **không** phân biệt bốn loại, nên cả bốn tên đặt mới. **Người biên tập nên kiểm** `abbha` (Sujato *misty*; cũng đọc *sương mù*).
  - >-
    Đặc thù tầng Pāli: `0.3` là `Uṇhavalāhakadānūpakārasutta` (chỉ một tên cho 40 bài) — dịch đúng nghĩa *bài bố thí cho chư thiên mây nóng* và ghi rõ đây là bản chụp rút gọn, không tự thêm danh sách mười món.
  - >-
    Lượt cải thiện 2026-10-13 (đọc đối kháng 19/19 khoá, đối chiếu Pāli và tiền lệ cả tầng sn32). Đổi 2 khoá. (1) `sn32.13-52:1.4` `abbhavalāhakānaṁ devānaṁ`: *mây mù* → *mây tối tăm*. Lý do: `abbha` và `mahikā` là hai từ riêng trong cùng một dãy ở `an4.50` (bản Việt đã ghi *mây bão* và *sương mù*), nên *mù* có nguy cơ đọc thành sương mù, là nghĩa của `mahikā`; còn cùng loài chư thiên này đã được viết *mây tối tăm* ở `sn32.55` (cùng Tương Ưng). Cách đọc *tối tăm* vẫn là lựa chọn gần nghĩa chứ chưa phân xử chắc, vì bản Anh đã ghim viết *stormy* (không phải *misty*: ghi chú cũ ở trên về Sujato là sai, đã đối chiếu lại với tầng English). Bất định còn lại: `abbha` hiện có ba cách viết trong Tương Ưng (`sn32.1:1.7` *mây không mưa*, `sn32.55` *mây tối tăm*, `an4.50` *mây bão*); không có căn cứ phân xử dứt khoát nên giữ nguyên ghi nhận bất định. (2) `sn32.13-52:0.3` tên bài `Uṇhavalāhakadānūpakārasutta` (dāna + upakāra = bố thí giúp ích): *Bài Bố Thí Cho Chư Thiên Mây Nóng Và Các Bài Sau* → *Bố Thí Giúp Sinh Cùng Chư Thiên Mây Nóng Và Các Bài Sau*; chữ *cho* cũ đọc thành bố thí cho các vị trời, trong khi người bố thí là người thường để được sinh về với họ (bản Anh: *How Giving Helps to Become a Warm Thundercloud God, Etc.*). `translationTitle` và thẻ tag đổi theo. Cùng kiểu tên *Bố Thí Cho …* còn ở `sn32.3-12`, `sn31.13-22`, `sn30.7-16`, chưa đổi ở lượt này. Các khoá còn lại giữ nguyên sau khi đo: *sinh cộng trú*, *làm thiện bằng thân/lời/tâm*, *có dung sắc*, *Vị ấy đã nghe*, *Vị ấy cho cơm …* / *Vị ấy cho đèn.* đều trùng nguyên văn tiền lệ trong `sn30`–`sn32` (ví dụ `sn31.13-22:1.9`, `sn31.13-22:1.18`, `sn31.3:1.5`); `Dvepaññāsamaṁ` = thứ năm mươi hai. Điểm đổi: terminology 9.2 → 9.0 (từ `abbha` chưa thống nhất trong Tương Ưng, tên bài hướng sai trước đó); triangulation 9.2 → 9.0 (ghi chú cũ nêu sai bản Sujato); semantic_fidelity 9.4 → 9.3 (`mây mù` lệch nghĩa); ambiguity_integrity 9.4 → 9.2 (bất định `abbha` chưa giải); technical_integrity 10.0 → 9.6 (không chạy lại cổng ở lượt này; còn các lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build`). `final_score` 9.47 → 9.36.
