notes: |-
  **Nguồn.** Pāli root đã ghim: `sn/sn22/sn22.95_root-pli-ms.json`, commit `11c9d708`. Đường dẫn
  tầng Anh **phẳng theo chương**: `translation/en/sujato/sutta/sn/sn22/sn22.95_translation-en-sujato.json`,
  có trong `source/upstream-manifest.json` (4.291 tệp `english-sujato`). Không có bản Việt
  hiện hành: tại commit đã ghim `translation/vi/phantuananh` chỉ có 26 tệp Pháp Cú.

  **Coverage đo được.** 14 segment Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); Sujato có
  chữ ở **14/14** ⇒ **1,0000**, trên ngưỡng 0,8. Sujato im lặng đúng **1** khoá: `15.5`
  (`Tatiyaṁ.`) — ngắn 9 ký tự, không tính vào coverage. ⚠ `content/meta/en/sn/sn22.95.yaml`
  **không tồn tại** và cũng không có tệp `english-project` cho bài này, nên `15.5` là khoá
  **còn lấp được** ở lớp `english-project` — giao cho lát lớp lấp. Nó không ảnh hưởng
  cổng coverage, và bản Việt ở `15.5` dịch thẳng từ Pāli.

  **Pāli trùng nguyên văn — đếm bằng script.** Chỉ mục Pāli→Việt dựng trên 96.479 Pāli
  khác biên dịch: **11/51** khoá của bài này có Pāli trùng nguyên văn; **10** dùng lại
  y nguyên văn. Danh sách: `0.2` · `1.2` · `8.1` (18/40 cách dùng trong `sn`) · `8.2`
  (12/21) · `11.2` (`sn36.3:4.2`) · `14.2` (`ja156:2.2`) · `14.3` (`iti28:5.3`, `iti29:5.3`)
  · `14.4` (`dn21:2.8.16`) · `15.3` (`sn4.9:5.3`) · `15.5` (`sn12.3:3.6` và 3 bài nữa).

  ⚠ **Lỗi của hai bản tiền lệ — đã KHÔNG sao chép.** Khoá `7.1` cũng trùng nguyên văn, ở
  `sn22.61:1.3` và `sn22.77:2.1`, nhưng **cả hai** đều sốt **một** `…` và **mất** vế
  `saññāyapi` (tưởng): chỉ còn *chán nản nơi thọ … chán nản nơi các pháp … chán nản nơi
  thức*, tức là **4 uẩn thay vì 5**. Pāli ở đây là hai `…` trần cộng một `…pe…` ⇒ **3**
  dấu lược. Đã dịch lại đủ ba dấu và đủ năm uẩn. Tệp ngoài lát không sửa; người điều
  phối nên xử lý `sn22.61:1.3` và `sn22.77:2.1`. Đo toàn tầng `sn` để thấy đây không phải
  ca lẻ: trên **32.809** khoá đã dịch của 1.679 tệp `sn`, **160** khoá ở **117** tệp lệch
  số dấu lược, và có **81** khoá đã bung `…pe…` thành *… cho đến …* (hai dấu).

  **Thuật ngữ — đếm trên tầng Việt, chỉ `sn`.**
    · `sāra` → *lõi*: `mn29:2.9`, `mn30:8.9` (*cần lõi cây, đi tìm lõi cây*), áp cho `pheṇapiṇḍe`,
      `kadalikkhandhe`, `māyāya`; `pheggu` → *gỗ mềm* (`sn35.234:7.1`).
    · `ritta/tuccha/asāra` → *rỗng không / trống rỗng / không có gì cả*: `dn13:15.4`,
      `mn95:14.7` (*rỗng không, trống rỗng*).
    · `nibbindati` → *chán nản*; `virajjati/virāgā vimuccati` → *ly tham … giải thoát*
      (7 bài khớp nguyên văn: `sn22.12:1.6`, `sn22.61:1.4` …).
    · `nāparaṁ itthattāyāti pajānāti` → *không còn gì là tự thân nữa* (6 tiền lệ;
      53 bài khác dùng `pajānātī”ti` cùng cách này).
    · `bhagavā` → *Thế Tôn / Đức Thế Tôn* (`Idamavoca bhagavā`: 18/40 là *Đức Thế Tôn đã
      nói như vậy*; `Tatra kho bhagavā bhikkhū āmantesi`: 10/39 là *Tại đó Đức Thế Tôn gọi
      các tỳ-kheo*). Chọn hai cách đa số cục bộ để `bhagavā` nhất quán trong bài.
    · `marīcikā` → *huyễn ảnh* (`dhp170:2`); `bubbuḷa/udakapubbuḷa` → *bọt nước*
      (`dhp170:2`: *như bọt nước*); `kadalikkhandha` → *thân chuối* (`mn35:22.2`, `sn35.234:7.1`).
    · `catumahāpathe` → *ngã tư đường* (`mn10:12.3`, `an5.38:2.1`, `dn22:6.3`, `mn21:7.10`).
    · `desitādiccabandhunā` → *được vị Thân thuộc Mặt Trời giảng dạy* (`an4.14:5.4`,
      `an4.69:5.4`, cùng Pāli); `bālalāpinī` → *tiếng lẽ phù phiềm của kẻ ngu*
      (`mn106:2.2`).
    · `māyā` → *ảo thuật*; `vedanā` → *thọ* theo `content/glossary/pali-vi.yaml`
      (`preferred: "thọ"`); `rūpa` → *sắc*, `saññā` → *tưởng*, `viññāṇa` → *thức*;
      `saṅkhāra` → *các hành* (42/68 khoá `saṅkhārā …` trong `sn`).
    · `sampajāno paṭissato` → *tỉnh giác và chánh niệm*; `bhūripaññena` → *bậc nhiều tuệ*;
      `āyu usmā ca viññāṇaṁ` → *mạng sống, hơi ấm và thức* (`mn43:24.2`).
    · `passeyya/nijjhāyeyya/upaparikkheyya` là **ba** động tác khác nhau ⇒ *thấy / quán
      sát / khảo sát*, không gộp làm một. `yoniso` → *cho hợp lý*.
    · Tên phẩm `Pupphavagga` → *10. Phẩm Hoa* theo đúng Pāli, đồng thời với `sn22.93/94/96/97`.

  **Bất định đã ghi, không chôn trong thân kinh.**
    · ⚠ **`ayujjhāyaṁ` — 0 tiền lệ trong toàn tầng Việt.** Đã tra bằng `grep` trên
      `content/translation/vi/project/sutta/`: không có `Ayujjhāy*`, `Ayujhā*` hay `Ayodhya`
      nào; cũng không có trong `content/glossary/pali-vi.yaml`. Chọn **Ayodhya** — tên
      hiện đại phổ biến ở Việt Nam, không mang dấu Pāli nên không bị chốt `lọt_pāli` bắt,
      và không thể bị nhầm với chưa dịch. Người biên tập nên chốt một cách duy nhất cho
      địa danh này (Hán–Việt *Ayu-đà* là lựa chọn khác).
    · `marīcikā phandati` → *có một huyễn ảnh hiện lên lấp loáng*; `phandati` là "hắt
      loáng/hiện rồi mất", không phải "đứng yên".
    · `majjhanhike kāle` → *giữa ban ngày* (nghĩa đen: giữa ban ngày), không phải *mùa
      hè*; `gimhānaṁ pacchime māse ṭhite` mới là *tháng cuối mùa hạ*.
    · `Cātumahā…` không có ở bài này; `Āyu usmā ca viññāṇaṁ` đã dùng `mn43:24.2`.
    · `Vadhako esa akkhāto` → *sự ấy được nói là kẻ giết người* (`esa` = "cái này", chỉ
      sự liên tục ở `13.1`).
    · `patthayaṁ accutaṁ padan` → *trạng thái không thoát lui*; không dùng tiền lệ
      `thag2.46:2.4` (*không gì sánh bằng*) vì `accuta` ở đây là "không thoát lui", không
      phải "vượt trội".

  **Công thức lặp — dịch nhất quán, không dịch khuôn.** Năm vòng `Seyyathāpi…` /
  `Evameva kho…` ở `2`–`6` là **peyyāla** của chính Pāli: nó lặp nguyên văn mệnh đề
  *Tassa taṁ passato nijjhāyato yoniso upaparikkhato …* năm lần. Tiếng Việt vì vậy lặp
  y hệt; khác ở chỗ danh từ (`quả bọt`, `sắc`, `bọt nước`, `thọ`, `tưởng`, `các hành`,
  `thức`) và vế hỏi (`Do đâu mà trong X có lõi?`). Đây là lặp **có nguồn**, không phải
  điền bằng khuôn.

  **Dấu lược — đối chiếu từng khoá.** `2.2`, `3.2`, `4.1`, `4.2`, `5.2`, `6.2`, `7.2` mỗi
  khoá giữ **đúng một** `…` theo Pāli; `7.1` giữ **ba**. `4.1` có dấu lược **giữa câu**
  (sau *trống rỗng* trước *Do đâu mà…*) — giữ nguyên vị trí, không dồn lên cuối. `4.2`
  là `…pe….` — một `…` rồi dấu chấm. Không khoá nào mở rộng dấu lược.

  **Lượt review đối kháng — 2 lỗi bản nháp, đã sửa trước khi ghi.**
    (1) ⚠ **Thêm quan hệ nhân quả không có trong Pāli, 5 khoá.** Bản nháp viết *"Người có
      con mắt tinh **nhưng** khi thấy…"* ở `2.1`, `3.1`, `4.1`, `5.1`, `6.1`. Pāli chỉ có
      `Tamenaṁ cakkhumā puriso passeyya nijjhāyeyya yoniso upaparikkheyya` — không có
      `api`/đối lập nào; Sujato cũng không dịch là "nhưng". Chữ **nhưng** là quan hệ logic
      bịa thêm ⇒ đã bỏ ở cả năm khoá. (2) `13.3` bản nháp bỏ mất `esa` (*được nói là kẻ
      giết người*) ⇒ sửa thành *sự ấy được nói là kẻ giết người*.

  **Ngoài phạm vi kiểm của chốt, đã tự quét** (`_hvi` im lặng ở bốn trường hợp):
  `set(khoá Việt) == set(khoá Pāli)` = **51/51**; độ dài khoá: không khoá nào < 40 ký tự bị
  bỏ sót; nháy đơn `‘…’`: bài này **không** dùng nháy đơn (0 mở, 0 đóng); `…pe…` bị bung:
  0; `…` trần bị viết đủ: 0. Nháy kép cân trên cả bài: mở ở `2.1` và `9.1`, đóng ở `7.3`
  và `15.4`, không bao giờ âm.

