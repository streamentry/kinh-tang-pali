notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không căn theo segment nên chỉ dùng để đối chiếu thuật ngữ và mạch lập luận). Tầng `vietnamese-current` căn theo segment không có cho bài này (tại commit đã ghim chỉ có 26 chương Pháp Cú); tầng `english-project` chưa có bản lấp cho bài này.
  **Coverage English = 140/173 = 0.809** khoá Pāli có nội dung (Pāli ≥ 40 ký tự, bỏ khối `:0`), **trên sàn 0.80 nhưng sát biên**: cần tối thiểu 139/173, dư đúng 1 khoá. Sujato để trống 33 khoá Pāli có nội dung: `9.3`, `9.7`, `10.2`, `11.3`, `11.7`, `12.3`, `13.3`, `13.7`, `14.3` (các câu lược `…pe…` của vòng người đeo vòng hoa / người bị chặt đầu) và `28.4`–`28.6`, `28.13`, `29.1`, `29.4`–`29.6`, `29.13`, `30.1`, `30.4`–`30.10`, `30.17`, `31.1`, `31.4`–`31.8` (Sujato rút gọn cả phần tâm xả `28`–`31` thành một lượt). Ở các khoá ấy Pāli tự đứng vững; vì chúng là lặp nguyên văn của khoá đã có Sujato ở vòng trước trong chính bài (xem dưới), việc dựng lại nghĩa dựa trên vòng trước, nhưng không thể coi là đã đối chiếu English độc lập cho 33 khoá này, nên `triangulation` đặt 8.8 chứ không cao hơn. Chưa có entry trong `content/meta/reference-gaps.yaml` cho bài này và cũng không cần: coverage đạt sàn.
  **Số Pāli.** `cattāro satthāro` (`15.5`) → *bốn vị đạo sư* (4); `Eko satthā` ×4 (`16.1`–`19.1`) → *Một vị đạo sư* (mỗi vòng một vị, đủ 4 vị với 4 quan điểm: không có, có, nghiệp không tạo ác, nghiệp tạo ác); `ekaṁ disaṁ … dutiyaṁ … tatiyaṁ … catutthaṁ` → *một phương, … thứ hai, … thứ ba, … thứ tư*; mười nghiệp đạo ở `4.1`–`4.10` và `22.4` đếm đủ 10 (sát sinh, lấy của không cho, tà dâm, nói dối, nói hai lưỡi, nói lời thô ác, nói lời phù phiếm, tham lam, sân hận và ác ý, tà kiến) ở cả hai nơi; `Terasamaṁ` → *Thứ mười ba* (đúng số thứ tự sn42.13). `ekaṁ maṁsakhalaṁ ekaṁ maṁsapuñjaṁ` giữ đủ hai danh từ: *một đống thịt, một khối thịt*.
  **Dùng lại nguyên văn đã có, đếm được.** 23 nhóm Pāli của bài trùng nguyên văn với khoá ở bài khác, tổng 982 cặp; 547 cặp bản Việt giống hệt, 435 cặp khác. Dùng lại đúng dạng đa số: `0.2` (11/11 cặp *1. Phẩm Làng*), `1.3` (*Bạch Thế Tôn, con nghe rằng:*, 3/7), `8.14` (*Thưa không phải vậy, bạch Thế Tôn*, 99/303, dạng nhiều nhất; còn lại 204 cặp là các dạng ngắn hơn như *Bạch Thế Tôn, không.* 59), `15.1` (*Vi diệu thay, bạch Thế Tôn! Hy hữu thay, bạch Thế Tôn!*, 3/16), `32.2` (3/4), `32.3` (*Từ hôm nay trở đi, con trọn đời quy y.*, 3/9; dạng dài *xin Đức Thế Tôn ghi nhận tôi là một nam cư sĩ …* ở sn42.3/sn42.5 có thêm `upāsakaṁ maṁ … dhāretu` mà Pāli khoá này không có), `32.4` (14/15), `33.0` (*Tóm lược:*, 372/491), `23.10` (2/2), `3.6` (3/3), `19.6` (1/1). Khác tiền lệ hoặc chọn giữa các dạng ngang nhau ở bảy chỗ: (1) `3.1` (9 cặp, 8 khác): tiền lệ viết *anh nghĩ sao về điều ấy?* (6 cặp) nhưng ở bài này Pāli kết bằng dấu phẩy và câu hỏi nằm ngay khoá kế (`3.2`), nên viết *ngươi nghĩ sao:*; xưng hô *ngươi* theo lời Đức Thế Tôn nói với thôn trưởng trong sn42 (*ngươi* 22 lần ở sn42.2/3/5/9/10/11; *anh* 15 lần ở sn42.6/7/8; *ông* 9 lần; riêng cho Pāli `3.1` thì cặp trùng nghiêng về *anh* 8 so với *ngươi* 4) và khớp 3 cặp `3.6` dạng có nháy mở (3/3 *ngươi nghĩ sao:*); nếu người biên tập chọn *anh* cho cả tương ưng thì đổi đồng loạt. (2) `3.11` (13 cặp, cả 13 khác): dạng ngắn *Thưa không, bạch Thế Tôn.* (5/13) không có ở sn; dùng cùng dạng với `8.14` để trong bài chỉ một cách đáp. (3) `8.3` (5 cặp, cả 5 khác): tiền lệ *chúng tôi* nhưng cả bài thôn trưởng tự xưng *con/chúng con* với Đức Thế Tôn (như `1.3`, `15.2`). (4) `18.3`, `19.3` (3 + 2 cặp khác): tiền lệ (`mn60`) gộp *một đống thịt, một khối thịt* thành *một khối thịt*; bài này tách đủ hai danh từ vì Pāli lặp `ekaṁ … ekaṁ`. (5) `18.4`, `18.5` (1 và 3 cặp khác): `mn60:13.4`–`13.5` gộp thành *vừa giết hại, chặt cắt và hành hạ, vừa khiến người khác làm như vậy*; bản này giữ từng cặp *làm / khiến người làm* của Pāli (`hananto ghātento chindanto chedāpento pacanto pācāpento`); `18.6` dùng nguyên văn `mn60:13.6` (1/4 cặp; 3 cặp còn lại là dạng khác như *Trong bố thí, trong chế ngự …*). (6) `23.2` (47 cặp, 22 khác): dùng dạng nhiều nhất *Người ấy suy nghĩ như sau:* (25/47, cũng là dạng của sn42.8); các dạng khác như *Vị ấy suy xét:* 15. (7) `23.8`, `23.9`, `23.11` (11 cặp, 9 khác): ba dạng tương đương nhau cùng tồn tại (*Với người hỷ khéo dâng lên …* ở `sn35.97`, `an5.26`; *Người có niềm vui thì …* ở `sn55.40`; *Người đã hân hoan thì hỷ sinh khởi / Người có tâm hỷ thì thân an tịnh / Người có lạc thì tâm được định tĩnh* ở `sn47.10`); chọn dạng của `sn47.10` vì cả chuỗi `23.7`–`23.11` có đủ ở đó và là dạng sn gần nhất, không dạng nào chiếm đa số tuyệt đối. Trong chính bài có 43 nhóm Pāli trùng nguyên văn (tổng 485 cặp) và cả 43 nhóm bản Việt giống nhau; không có cặp Việt khác nhau. Các khoá `6.2`, `6.4`, `7.2`, `7.4`, `9.2`, … `14.4` cùng Pāli `Tamenaṁ evamāhaṁsu:` nên cùng bản Việt *Về người ấy, người ta nói như vầy:*, kể cả chỗ đó là câu hỏi và chỗ đó là câu đáp (Hòa thượng Thích Minh Châu và Sujato phân thành hỏi / đáp, nhưng Pāli chỉ có `evamāhaṁsu`; không thêm nghĩa).
  **Thuật ngữ chọn theo tiền lệ đếm được.** `gāmaṇi` → *thôn trưởng* (toàn tầng, sn42.x); `pāṇātipāta` → *sát sinh*; `kāmesumicchācāra` → *tà dâm* (sn 23/31 khoá so với *tà hạnh trong các dục* 4 và *hành dâm* 4; toàn tầng 82/217 so với *tà hạnh trong các dục* 52; mn và dn lại nghiêng về *tà hạnh trong dục* — hai phạm vi cho đa số khác nhau, chọn sn vì cùng tương ưng với sn42.8); `adinnādāna` / `adinnaṁ ādiyati` → *lấy của không cho* (sn 8/10, toàn tầng 41 so với *trộm cắp* 32); `musāvāda` → *nói dối*; `pisuṇā vācā` → *nói hai lưỡi* (105/173 khoá); `pharusā vācā` → *nói lời thô ác* (toàn tầng 49 so với *nói lời ác* 46 và *ác khẩu* 39; ở sn 6 so với *nói lời ác* 7 — gần ngang nhau, chọn dạng đúng nghĩa `pharusa` = thô, không lẫn với `pāpa`); `samphappalāpa` → *nói lời phù phiếm* (114/158); `abhijjhā` → *tham lam* (sn 173/200); `byāpādapadosa` → *sân hận và ác ý* (mn, an: 5/7 khoá, dạng khác *sân hận cùng ý hại* 2/7); `abyāpannacitta` → *tâm không còn sân hận*; `micchādiṭṭhi` → *tà kiến*; `vipāka` → *quả* (sn 29/29 khoá); `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ` → *cõi dữ, ác thú, đọa xứ, địa ngục* (dạng nhiều nhất: sn 21/44 khoá, toàn tầng 59/240; so với *cảnh khổ, cảnh xấu, cảnh đọa, địa ngục* 37 và *cõi ác, ác thú, cõi đọa, địa ngục* 32 toàn tầng); `kāyassa bhedā paraṁ maraṇā` → *sau khi thân hoại mạng chung* (sn 158/166 khoá); `sugatiṁ saggaṁ lokaṁ` → *cõi lành, cõi trời* (toàn tầng 38/239 khoá so với *cảnh giới tốt, cõi trời* 30 và *cõi thiện, cõi trời* 8; ở sn đảo ngược, 5 so với 8 trên 43 khoá, mẫu nhỏ, chọn dạng nhiều nhất toàn tầng); `ariyasāvako` → *Thánh đệ tử* (sn 135 so với *thánh đệ tử* 73; toàn tầng 266 so với 197); `tasaṁ vā thāvaraṁ vā` → *dù run sợ hay kiên cố* (`sn55.35`, 2 khoá; `iti38` viết *dù run sợ hay vững chãi*, 2 khoá); `paṭisañcikkhati` → *suy nghĩ như sau* (theo `23.2`); `kaṅkhā` / `vicikicchā` → *nghi ngờ / hoài nghi* (`sn44.9:4.8`, `an3.65`); `āvasathāgāra` → *nhà khách* (`dn16`); `yathāsatti yathābalaṁ saṁvibhajāmi` → *chia sẻ … tùy theo khả năng và sức lực* (`an9.19`); `kammakāraṇaṁ` → *hình phạt* (`mn129`); `vuttavādī … dhammassa cānudhammaṁ byākaronti … gārayhaṁ ṭhānaṁ āgacchati` theo khung `sn42.10`/`mn55`; công thức mettā theo `sn42.8:12.1` (cùng tương ưng) và `an3.65:42.1`; bốn quan điểm của bốn đạo sư theo `mn60:5.2`, `6.3`, `13.2–13.6`, `14.2–14.6`; chuỗi *hân hoan → hỷ → thân an tịnh → lạc → tâm định tĩnh* theo `sn47.10:6.5–6.9`; mô tả cực hình theo `dn26:12.18`, `an4.244:1.7`. 0 tiền lệ (đặt mới, ghi lý do): `lambacūḷaka bhaṭa` → *người làm thuê có búi tóc thòng* (Hòa thượng Thích Minh Châu *người làm thuê có búi tóc thòng xuống*; Sujato *officers with drooping headdresses*; chọn nghĩa đen `bhaṭa` = người làm thuê, không thêm *quan*); `dhammasamādhi` → *pháp định* (Sujato *immersion based on understanding of principle*, Hòa thượng Thích Minh Châu *pháp Thiền định*; giữ cấu tạo `dhamma` + `samādhi` song song với `cittasamādhi` → *tâm định*, không thêm lời diễn giải); `rājāno` → *các vua* (số nhiều đúng Pāli; Sujato *the rulers*, Hòa thượng Thích Minh Châu *người của nhà vua*).
  **Bất định đã ghi nhận, không che.** (1) `māyā` / `māyāvī` (`1.4`–`3.14`): dịch *lừa dối* / *kẻ lừa dối* theo Sujato *deceit*; Hòa thượng Thích Minh Châu *huyễn thuật*. Tầng có `māyā` ở 150 khoá với *xảo trá* 26, *gian dối* 25, *lừa dối* 25, *gian xảo* 21, *dối trá* 17, *huyễn* 8. Bài này lấy *lừa dối* vì từ phải đọc được ở hai chỗ: lời đồn *biết lừa dối* (`1.4`–`2.6`) và công thức *biết rõ … và quả của …, người thực hành … sinh vào địa ngục* (`3.14`) đặt ngang hàng với sát sinh, nói dối …; nếu hiểu `māyā` là *huyễn thuật* thì `3.14` thành *kẻ làm huyễn thuật sinh vào địa ngục*, khó khớp mạch bài nhưng Pāli không loại trừ hẳn. (2) `apaṇṇakatāya mayhaṁ` (`23.5` và các khoá lặp): dịch *đó là điều chắc chắn không sai*, theo `mn60:12.7` (*apaṇṇako dhammo* → *đúng pháp chắc chắn*) và Sujato *a sure bet*; Hòa thượng Thích Minh Châu dịch lỏng *ta cũng không có tội lỗi gì*, không giữ. (3) `kaṭaggāho` (`23.6`): *ta thắng ở cả hai phía* theo `mn60:12.5` (`kaṭaggaho`) và Sujato *winning hand on both counts*; Pāli giữ nguyên hai vế `yaṁ … saṁvuto` / `yañca … upapajjissāmi` — bản Việt viết *ở chỗ … và ở chỗ …* để không biến vế sau (sinh về cõi lành) thành khẳng định vô điều kiện ngay cả ở quan điểm *không có đời sau*; công thức này lặp nguyên văn ở cả 8 vòng (`23`–`26`, `28`–`31`). (4) `tvaṁ … lacchasi` / `tathāgato na lacchati` (`3.13`): dịch *được nói rằng* (thể bị động của `labhati`, *được nhận / được phép*); Sujato *can know … why can’t the Realized One know*; hai cách hiểu cùng dẫn đến một nghĩa, giữ dạng sát chữ. (5) `Saccaṁyeva kira, bho` (`2.4`): dịch *hóa ra … đã không tin*; `kira` có thể là hearsay hoặc nhận ra điều vừa biết; Sujato bỏ qua. (6) `dāresu cārittaṁ āpajji` (`11.5`), `kulitthīsu kulakumārīsu cārittaṁ āpajji` (`12.5`): *có quan hệ tình dục* (Sujato *had relations*; không dùng *tà dâm* vì đó là thuật ngữ khác `kāmesumicchācāra`); Pāli `dāresu` là *các người vợ* và `rañño paccatthikassa` giữ cấu trúc *kẻ thù của vua* như các khoá cùng vòng (Sujato viết *the wives of an enemy king*). (7) `atthaṁ bhañji` (`14.5`): *làm hỏng lợi ích* theo `sn55.7:7.2`; Sujato *ruined*, Hòa thượng Thích Minh Châu *phá hại tài sản*. (8) Uddāna `33.1`–`33.4`: tên trong bài tóm lược không trùng hẳn tên bài (`Hatthasso`, `Desanā`, `Bhadrarāsiya…` so với `Hatthāroha`, `Assāroha`, `Khettūpama`, `Bhadraka`, `Rāsiya` đã dịch ở các bài trước); dịch từng từ đúng Pāli (*Voi, Ngựa*; *Thuyết Giảng*; *Bhadra, Rāsiya và Pāṭali*), không tự nối với tên bài. (9) Tên phẩm `0.2` / `32.5`: *Phẩm Làng* theo 11/11 tiền lệ của sn42.1–sn42.11, dù `Gāmaṇivagga` là *phẩm về các thôn trưởng* và tên tương ưng `33.5` dịch *Tương Ưng Thôn Trưởng* (0 tiền lệ riêng cho `Gāmaṇisaṁyutta`; ở sn dạng *Tương Ưng X đã hoàn tất / đã xong* chiếm 35/43 khoá `saṁyuttaṁ samattaṁ`). Đề nghị người biên tập quyết định chung cho cả phẩm; không đổi trong bài này. (10) Hòa thượng Thích Minh Châu dịch `lambacūḷake bhaṭe` là *dân chúng Kosala*; Pāli và Sujato đều là `koliyānaṁ` (*dân Koliya*), bản này theo Pāli.
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 300/300, đúng thứ tự Pāli. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá, 300 khoá (mẫu số 300, 0 lệch); tổng Pāli `“`58 `”`58 `‘`43 `’`43 và bản Việt đúng bằng. Dấu lược: 15 khoá Pāli có `…pe…` (`9.1`, `9.3`, `9.7`, `10.1`, `10.2`, `10.10`, `11.1`, `11.3`, `11.7`, `12.1`, `12.3`, `12.11`, `27.1`, `27.2`, `32.2`); cả 15 khoá Việt giữ đúng một `…`, không mở rộng; Pāli không có `…` trần và `(…)` ở khoá nào, Việt cũng không có. Pāli kết `…pe….` ở `27.2` thì Việt kết ` ….` theo đa số của tầng. NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang bản Việt (chỉ có các tên riêng `Saṁyutta Nikāya`, `Pāṭaliya`, `Gaṅgā`, `Maṇicūḷa`, `Pāṭali`, `Rāsiya`). Đã in cặp Pāli↔Việt từng khoá để đọc đối kháng; lỗi bản nháp đã bắt khi đọc: bốn khoá `8.4`, `10.9`, `12.10`, `14.10` thiếu dấu `“` mở đầu so với Pāli (đã sửa), `4.9` có hai chữ *và* liền nhau (đã sửa), `10.4` mơ hồ về chủ ngữ của *trộm cắp* (đã sửa), `4.3` / `5.4` / `22.4` ban đầu dùng *tà hạnh trong các dục* trái với đo đếm ở sn (đổi sang *tà dâm*).
  Cổng kỹ thuật `npm run validate`, `npm test`, `npm run check` và `npm run build` do coordinator chạy, không chạy trong lát agent này; vì vậy `technical_integrity` đặt 9.6 chứ không 10.0.
