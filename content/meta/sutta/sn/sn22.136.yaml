  - >-
    `sn37.25`/`26`/`27` — ⚠ **bản đầu tôi bỏ mất vế `sāmikaṁ`.** Pāli: `visārado
    agāraṁ ajjhāvasatī` (bản 25) / `sāmikaṁ pasayha agāraṁ ajjhāvasatī` (bản 26)
    / `sāmikaṁ abhibhuyya vattatī` (bản 27). Tôi dịch ba bài thành *“sống tự tin
    nơi gia đình” / *“sống tự tin ở ngôi nhà trong thành” / *“sống khinh phục
    ngôi nhà trong thành”* — **hai bài sau mất hẳn `sāmika`**, tức mất vẽ *đã
    khuất phục chủ nhân*; bản Anh đọc *“has her husband under her thumb”* /
    *“having mastered her husband”*. Đã sửa thành *“đã chế phục chủ nhân, sống
    trong ngôi nhà trong thành”* và *“sống, đã chế phục chủ nhân”*. `sāmika` →
    *chủ nhân* (0 tiền lệ) · `pasayha`/`abhibhuyya` → *chế phục* (`an3.53:2.1`
    dùng *chế phục* cho `abhibhūto`) · `visārado` → *tự tin* (0 tiền lệ).
