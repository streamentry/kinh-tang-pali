  - >-
    **⚠ `m’idhekacce` ở `sn29.4:1.3/1.5` và `sn29.5:1.3/1.5`: dấu `’` đó là DẤU
    LƯỢC Sandhi của `maṃ idhe kacce`, KHÔNG phải nháy.** Bản đầu tôi dịch thành
    *“trong đời này”* rồi thêm một dấu nháy để khớp đếm — sai. Lần này tôi khai
    đúng bốn khoá đó là *dấu lược* và để số nháy Việt thấp hơn Pāli đúng một;
    phần độ sâu ngoặc ở cấp tệp vẫn được kiểm như bình thường.
  - >-
    **⚠ BẢN ANH SUJATO ĐẢO `jalābujā` VÀ `saṁsedajā` Ở CẢ BỐN BÀI
    `sn29.4`–`29.9`.** Pāli (tầng authority): `sn29.4` = *sinh từ ẩm ướt*,
    `sn29.5` = *sinh tự nhiên*, `sn29.8` = *sinh từ ẩm ướt*, `sn29.9` = *sinh tự
    nhiên*. Sujato: `sn29.4` = *womb-born*, `sn29.5` = *moisture-born*, `sn29.8`
    = *womb-born*, `sn29.9` = *moisture-born* — tức cặp 4/5 và cặp 8/9 bị hoán.
    Tôi theo Pāli. Ghi lại vì đây là loại lệch mà nếu không đọc song song sẽ
    không thấy.
  - >-
