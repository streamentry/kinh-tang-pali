notes: |-
  Đợt 19, lane 30. Dịch từ Pāli root commit đã ghim, đối chiếu English Sujato đã ghim, bản Hòa thượng Thích Minh Châu nguyên bài (tra cứu toàn văn, không phân đoạn) và các tiền lệ cùng tầng. Đủ 94 khoá, thứ tự và tập khoá khớp Pāli; không có khoá ngoài Pāli.

    **Coverage Anh trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): Sujato 70/79 = 0.886** — trên sàn 0.80. Chín khoá Sujato để trống (5.5, 5.6, 5.9, 6.1, 6.2, 6.3, 6.4, 6.5, 6.6) là đoạn Nakulapitā thuật lại nguyên văn lời mình và lời Đức Thế Tôn; Pāli của chúng trùng 2.1–2.5 và 3.1–3.5, nên phần này được đối chiếu qua bản Sujato của 2.x/3.x, không phải qua lớp lấp. Lớp english-project của dự án không có tệp cho bài này, nên không có phần nào do lớp lấp cung cấp, và coverage ở trên hoàn toàn là Sujato độc lập. Các khoá Sujato bỏ trống nhưng Pāli dưới 40 ký tự (5.7: `Ovadatu maṁ, bhante, bhagavā;` và 5.8, 6.7, 19.3) không nằm trong mẫu số. Tại commit đã ghim không có bản Việt phân đoạn cho bài này (chỉ Pháp Cú), nên cột Việt hiện hành vắng; bản Thích Minh Châu chỉ có ở mục tra cứu toàn văn.

    Số Pāli: không có số lượng nào trong bài; chỉ có danh sách năm uẩn (sắc, thọ, tưởng, hành, thức), mỗi uẩn được lặp đúng một lần ở nhóm có ám ảnh (9–13) và một lần ở nhóm không ám ảnh (14–18).

    Dấu lược: Pāli không có `…pe…`, `…` trần hay `(…)` ở khoá nào, bản Việt không có `…` nào. Nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá (2.1–3.6 là lời Nakulapitā và lời Đức Thế Tôn; 5.4–6.8 là lời Nakulapitā kể lại với hai lớp trích dẫn lồng nhau, đúng như Pāli).

    Pāli trùng nguyên văn trong chính bài: 5 cặp byte-trùng (2.2=5.6, 2.3=5.7, 2.4=5.8, 3.2=6.3, 3.3=6.4); bản Việt giống nhau ở cả 5. Thêm 6 cặp chỉ khác dấu nháy, hoa thường hoặc dấu cuối câu (2.1~5.5, 2.5~5.9, 3.1~6.2, 3.4~6.5, 3.5~6.6, 3.6~6.7): bản Việt giống nhau ngoài đúng chỗ Pāli khác (nháy ‘’ hay “”, dấu hai chấm hay gạch dài, và ở 6.6 Pāli bỏ nháy nên Việt cũng bỏ).

    Tiền lệ và thuật ngữ (đo trên tầng): 21 khoá có Pāli trùng nguyên văn với bài khác; bản Việt dùng lại nguyên văn ở 14 khoá (0.2, 0.3, 1.1, 2.5, 3.1, 3.6, 7.4, 8.3, 9.6, 13.4, 14.6, 18.4, 19.1, 19.3) và khác ở 7 khoá (1.2, 3.4, 9.3, 10.1, 13.1, 14.3, 15.1). Lý do khác: 3.4 bỏ chữ "người" trong "này người gia chủ" (22 khoá mn143, trong khi sn47.29 và mọi bài sn22 khác dùng "này gia chủ"); 1.2 theo thể "Đức Thế Tôn ở xứ người Bhagga" (ở xứ trội trong các công thức Một thời … viharati đã dò: sn 20, mn 14, an 11); 9.3, 10.1, 13.1, 14.3, 15.1 chỉ khác tiền lệ ở dấu chấm phẩy theo Pāli và ở việc lặp "không quán" bốn lần theo sn22.44 (bốn "na" trong Pāli). `gahapati` → "gia chủ"; `bhante` → "Bạch Thế Tôn" khi nói với Đức Thế Tôn, "thưa Tôn giả" khi nói với Sāriputta (theo sn22.2); `Evaṁ me sutaṁ—` → "Tôi nghe như vầy—" (sn22.2); "Phẩm Nakulapitu" (10 khoá), tên kinh "Kinh Phụ Thân Của Nakula" (sn35.131, an6.16). `jiṇṇo vuḍḍho mahallako addhagato vayoanuppatto` → "già nua, cao tuổi, uy lão, tuổi đã cao, đã đến giai đoạn cuối của đời" đúng như năm khoá mn82/mn91 (cả 5/5 khoá dùng "uy lão"). `aṇḍabhūto pariyonaddho` → "như quả trứng bị bọc kín", theo an4.128 ("bị bọc kín như trong trứng"). `kimaññatra bālyā` → "ngoài sự ngu dại ra, đó còn là gì?" theo sn22.49 (`kimaññatra …?`, 4 khoá). `vippasannāni … indriyāni; parisuddho mukhavaṇṇo pariyodāto` → "các căn … thật trong sáng; sắc mặt thanh tịnh, rạng rỡ" theo sn52.9 và sn28.2. `āturakāyo`/`āturacitto` → "thân bệnh"/"tâm bệnh" ("bệnh", không "bịnh", theo tầng). `sokaparidevadukkhadomanassupāyāsā` → "sầu, bi, khổ, ưu, não"; câu `Tassa …vipariṇāmaññathābhāvā uppajjanti …` dùng lại nguyên văn sn22.43 và sn22.8 ("Do sự biến hoại và trở thành khác của … ấy, sầu, bi, khổ, ưu, não sanh khởi nơi vị ấy", 3 tệp / 17 lần); `assutavā puthujjano …` và `sutavā ariyasāvako …` dùng lại cách dịch của sn41.3 (9.2 và 14.2; Pāli chỉ khác dấu phẩy). `samanupassati` → "quán … là tự ngã" (13 khoá sn trên các Pāli cùng dạng: 8 khoá "quán … là tự ngã" so với 5 khoá "thấy … là tự thân" ở sn22.47 và sn22.117). `abhinanditvā anumoditvā … padakkhiṇaṁ katvā` → "hoan hỷ, tín thọ lời Đức Thế Tôn dạy … đi nhiễu quanh Ngài về phía bên phải" (4 khoá sn dùng "hoan hỷ, tín thọ"; "đi nhiễu quanh Ngài về phía bên phải" 12 so với "đi nhiễu bên phải" 13, chọn dạng rõ nghĩa hơn). `Tena hi, gahapati, suṇāhi, sādhukaṁ manasi karohi; bhāsissāmī` → "hãy lắng nghe và khéo tác ý; ta sẽ nói" (cụm "khéo tác ý" 141 lần / 73 tệp; mn54 dùng "chú tâm kỹ"). `Idamavoca āyasmā sāriputto` / `Attamano … abhinandi` → "đã nói như vậy" / "hoan hỷ và tán đồng" (theo các bài cùng công thức).

    Bất định ghi ở đây, không đưa vào thân kinh: (1) `Aniccadassāvī kho panāhaṁ, bhante, bhagavato manobhāvanīyānañca bhikkhūnaṁ` — Pāli có genitive `bhagavato … ca bhikkhūnaṁ` nên bản Việt dịch "không được thường xuyên thấy Đức Thế Tôn và các tỳ-kheo đáng kính", theo Thích Minh Châu; Sujato bỏ Đức Thế Tôn ("I hardly ever get to see the esteemed mendicants"), có lẽ vì lúc nói câu này gia chủ đang đứng trước Ngài. `aniccadassāvī` được hiểu là "không thường thấy" (không nói "hiếm khi"), nghĩa gần của Sujato ("hardly ever") và của Thích Minh Châu ("không được thường thấy"). `manobhāvanīya` → "đáng kính" (Sujato "esteemed", Thích Minh Châu "đáng kính"; an10.28 trong tầng dịch "đáng được tôn kính trong tâm"), không khẳng định nghĩa hẹp hơn. (2) `amatena abhisitto` → "rưới nước bất tử": Pāli không có chữ "nước", nhưng `abhisitto` (rưới/quán đảnh) đòi hỏi một chất lỏng nên Việt dùng "nước" như Thích Minh Châu ("rưới với nước bất tử") và Sujato ("anointed … with the deathless ambrosia"); tầng chưa có tiền lệ cùng Pāli. (3) `pariyuṭṭhaṭṭhāyī hoti` → "bị ám ảnh rằng": theo Sujato ("obsessed") và Thích Minh Châu ("bị ám ảnh"), nhưng trong tầng `pariyuṭṭhāna`/`pariyuṭṭhita` còn được dịch "chế ngự" (44 khoá), "xâm chiếm" (41), "chi phối" (30) và "ám ảnh" (28). Giáo nghĩa không đổi: đó là sự chiếm lĩnh của ý nghĩ "ta là sắc, sắc là của ta". (4) `Tassa … pariyuṭṭhaṭṭhāyino, taṁ rūpaṁ vipariṇamati aññathā hoti` — genitive absolute, dịch trung tính "Với vị ấy, đang bị ám ảnh rằng …, sắc ấy biến hoại, trở thành khác"; ở nhóm không ám ảnh (14.5–18.3) dịch song song "Với vị ấy, không bị ám ảnh rằng …", không thêm "vẫn" hay "dù" mà Pāli không có. (5) `Na hi pana taṁ, gahapati, paṭibhāsi bhagavantaṁ uttariṁ paṭipucchituṁ` — dịch "chẳng lẽ ông không nghĩ đến việc hỏi thêm", nghĩa gần của Sujato ("didn't you feel the need to ask the Buddha the further question") và Thích Minh Châu ("Gia chủ có hỏi thêm Thế Tôn"). (6) `Kathañhi no siyā, bhante` — câu hỏi tu từ, dịch "Làm sao lại không như vậy được, thưa Tôn giả?"; Sujato "What else, sir, could it be?", Thích Minh Châu "Làm sao không thể như vậy được". (7) `uy lão` giữ theo tiền lệ mn (5/5 khoá) dù là Hán–Việt cổ, để một công thức Pāli giữ một cách dịch.

    Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: chỉ xác minh được JSON hợp lệ, đủ 94 khoá, không thừa khoá, không rỗng, mọi giá trị NFC, không `…`, nháy đơn và nháy kép khớp Pāli từng khoá, và YAML đọc được. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
