  **Uid gộp phạm vi, 10 bài nhỏ trong một tệp.** Khoá thật mang uid từng bài `sn35.33:`…`sn35.42:`, đúng như `segmentPrefixesForUid` trong `src/lib/canon/load.ts`; tên tệp và `uid` vẫn là `sn35.33-42`. Pāli đọc thẳng từ tệp bilara đã ghim `root/pli/ms/sutta/sn/sn35/sn35.33-42_root-pli-ms.json` (mục `sourcePath` trong `content/catalog/sutta/sn.json`) và đã so với trường `pali` của lát: **trùng khớp từng ký tự, 0 sai lệch, không thiếu khoá nào**.
  **Năm phép kiếm tự chạy, in số** (`_hvi.py` không đủ: nó chỉ quét khoá ≥ 40 ký tự nên chạy rỗng ở đây, không đếm nháy đơn, và lọc `\b\d+\.0\b` trong nội dung Pāli chứ không phải tên khoá). (1) `set(khoá Việt) == set(Pāli)`: **Pāli 56 = Việt 56**, 0 thiếu, 0 thừa. (2) Dấu nháy khớp Pāli từng khoá: **0/56 lệch**; `“` Pāli 10 = Việt 10, `”` Pāli 1 = Việt 1, nháy đơn `‘`/`’` cả hai tầng đều 0; số dư ngoặc kép cả bài **+9, y hệt Pāli**. (3) Pāli trùng nguyên văn: **4005 cặp** đã dò ngoài lát, trong đó **3237 cặp khớp nguyên văn bản dịch của tôi**, **404 cặp khác**, 364 cặp thuộc bài chưa dịch nên không tính là khác; ngay trong tệp có **1 nhóm Pāli trùng** (9 khoá `saṅkhittaṁ.`) và cả 9 dùng **một** dạng Việt. (4) Dấu lược: **0/56 lệch**; tổng dấu lược Pāli 21 = Việt 21; **0** khoá Pāli có `…` mà Việt không có (không mở rộng lược), **0** khoá Pāli không có `…` mà Việt có (không chế lược). (5) Mọi số nêu trong `notes` này đều do script in ra. Ngoài ra: NFC sạch 56/56, 0 khoá rỗng, 0 khoá trùng nguyên văn Pāli, 0 dấu ngoặc tròn trần, 0 từ mang dấu Pāli lọt vào, tổng ký tự Pāli 1549 → Việt 1717 (tỉ lệ 1,108).
  **Coverage tầng tham khảo.** Mẫu số = Pāli ≥ 40 ký tự, bỏ khối `:0` theo `substantivePaliMinChars` của `source/layers.yaml`: **6 khoá** (`sn35.33:1.9`, `1.14`, `1.16`, `1.17`, `1.18`, `sn35.38:1.1`). Sujato phủ **5/6** (trống đúng `1.14`), lớp lấp `english-project` phủ **1/6** (`sn35.33:1.14`, trạng thái `published`), nên **tổng 6/6 = 1,0000 ≥ 0,8** — không cần ghi vào `content/meta/reference-gaps.yaml`. Tính trên cả 56 khoá không lọc thì Sujato chỉ phủ 26/56, vì Sujato để trống mọi mảnh lược và mọi mốc `Paṭhamaṁ.`; đó là giới hạn của bản chụp, không phải thiếu sót. Tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) **vắng** — tại commit đã ghim tầng đó chỉ có `sutta/kn` (Pháp Cú).
  **`triangulation` = 8,5, và không nâng để né cổng.** `sn35.33:1.14` là khoá duy nhất trong mẫu số mà Sujato để trống; nó chỉ được phủ bởi lớp lấp `english-project` của chính dự án, mà người viết lớp lấp cũng là người chấm bài này — theo AGENTS.md đó **không phải** một cách đọc English độc lập, nên bài này **không được tuyên bố đã đối chiếu English toàn bộ**. Thêm nữa, chín bài `sn35.34`–`sn35.42` chỉ còn câu mở đầu rồi lược, nên nội dung lặp của chúng có mặt trong **không tầng tham khảo nào**; người đọc muốn đối chiếu chín câu ấy phải tự tra nguồn.
  **Bản Anh lệch ở `1.10`, đã theo Pāli.** Sujato dịch `jivhā … ` thành *"The ear … nose … tongue …"* và bỏ trống `1.11`–`1.13`, nhưng Pāli `1.10`–`1.13` là **lưỡi** (`jivhā`, `rasā`, `jivhāviññāṇaṁ`, `jivhāsamphasso`); tai và mũi nằm trong `…pe…` của `1.9`. Đây là đúng lỗi mà hai lát kế (`sn35.43-51`, `sn35.52`) đã ghi nhận ở bản của họ. Pāli thắng. Sujato cũng bỏ dấu lược ở `1.5`–`1.7` và gộp vế — không theo.
  **Nháy kép: giữ nguyên Pāli, và đây là chỗ bất đồng cần người biên tập gộp.** Pāli đã ghim mở **10** dấu `“` nhưng chỉ đóng **1** (`sn35.33:1.19`): chín bài `34`–`42` đều mở rồi cắt, không đóng. Bản Việt **khớp Pāli từng khoá**, nên cũng để mở. Đo trong phạm vi `sn35.*`: có **284** khoá mà Pāli mở `“` mà không đóng, và chỉ **10** khoá thêm `”`; trong đó **8** khoá là tệp anh em `sn35.43-51`, tức ngoài tệp đó là **276 khoá chỉ 2 khoá thêm dấu đóng**. Tệp `sn35.43-51` chủ động đóng cả tám và ghi lý do trong `notes` của nó. **Hai quyết định này trái nhau**; tôi theo luật của lát (khớp Pāli từng khoá) và theo số đo, đồng thời ghi ra đây để coordinator chọn một cách cho cả phần tư thứ năm.
  **Dùng lại nguyên văn bản dịch đã có (3237 cặp khớp).** `Tại Sāvatthī.` (439/484 cặp) · `Tại đó …` (3/5) · `Sắc …` (2/2) · `thức của con mắt …` (2/9) · `lưỡi …` (2/12) · `các vị …` (2/19) · `thức của lưỡi …` (2/6) · các mốc `Thứ nhất.`…`Thứ mười.` (mỗi mốc 250–295 cặp, trừ xem mục `Catutthaṁ` bên dưới) · `Tóm lược:` (345/541). Chủ yếu lấy từ bài kế `sn35.43-51` và `sn35.52` — cùng bộ, cùng phẩm liền kề, cùng khuôn.
  **Tên phẩm dùng lại nguyên văn, không tự đặt lần thứ hai.** `Jātidhammavagga` → *4. Phẩm Có Tính Sanh Tái*, lấy **nguyên văn** từ `sn35.52:3.2` (lát kế đã dựng và đã viết trong `notes` của nó: *Người biên tập nên gộp hai tên phẩm này với các lát sau*). Tầng `name/` của chính SuttaCentral xác nhận: `sn-name:1024.sn35-jatidhammavagga` = *"The Chapter on Liable to Be Reborn"*, cùng commit với bản thân kinh. `Jātidhammādisuttadasaka` → *Bộ Mười Bài Về Có Tính Sanh Tái V.v.*, theo khuôn `sn35.43:0.3` (*Bộ Chín Bài Về Vô Thường V.v.* cho `Aniccādisuttanavaka`).
  **`translationTitle` lấy từ khoá `:0.3`, không phải `:0.1`.** Brief của lát ghi *bằng đúng giá trị `:0.1`*, nhưng `:0.1` ở đây chỉ là tiêu đề bộ (*Saṁyutta Nikāya 35.33–42*), dùng làm tên bài sẽ sai; ba tệp anh em cùng phần đều lấy `translationTitle` từ `:0.3` (`sn35.31` → *Kinh Con Đường Đưa Đến Nhổ Tận Gốc Mọi Sự Tưởng Nghĩ Thứ Nhất* = `0.3`; `sn35.52` → *Kinh Nhiễm Bẩn* = `0.3`; `sn35.43-51` → *Bộ Chín Bài Về Vô Thường V.v.* = `0.3`). Tôi theo khuôn 3/3 và ghi lý do ở đây.
  **Thuật ngữ thân bài — mười hậu tố `-dhamma`, dịch bằng một công thức: *có tính X*.** `jātidhammo` → *có tính sinh* · `jarādhammaṁ` → *có tính già* · `byādhidhammaṁ` → *có tính bệnh* · `maraṇadhammaṁ` → *có tính chết* · `sokadhammaṁ` → *có tính sầu* · `saṅkilesikadhammaṁ` → *có tính ô nhiễm* · `khayadhammaṁ` → *có tính hoại diệt* · `vayadhammaṁ` → *có tính suy tàn* · `samudayadhammaṁ` → *có tính sanh khởi* · `nirodhadhammaṁ` → *có tính diệt tận*. Số đếm tiền lệ trong tầng Việt: *có tính sinh* 14 · *có tính già* 6 · *có tính bệnh* 6 · *có tính chết* 6 · *có tính sầu* 2 · *có tính ô nhiễm* 5 · *có tính sanh khởi* 47 · *có tính diệt tận* 9 · *có tính hoại diệt* 0 · *có tính suy tàn* 0. Công thức này đúng vị ngữ với câu Pāli (*X là jātidhammo*) và khớp đúng tên phẩm đã có sẵn trong kho; họ từ `an3.83` và `mn26` dùng *phải sinh / phải già* cho cùng họ từ nhưng ở khung liệt kê danh từ (*… thuộc về cái phải sinh*), đọc vào câu *tất cả đều …* thì tối nghĩa, nên không theo. Vì từng thành phần: *hoại diệt* 167 (đối chiếu *hủy diệt* 60) và đúng tiền lệ `sn12.34:2.6` (*có pháp hoại diệt* cho `khayadhammaṁ`) · *suy tàn* 49 (đối chiếu *suy vong* 35) · *diệt tận* 1196 (đối chiếu *đoạn diệt* 573) · *sanh khởi* 435 · *chán nản* 270 cho `nibbindati` · *bậc Thánh đa văn* 96 cho `sutavā ariyasāvako` · *thức của con mắt* 16 và *xúc chạm của con mắt* 26, lấy theo `sn35.43` vì cùng khuôn. Vế ba *lạc, khổ hay không lạc không khổ* cho `sukhaṁ vā dukkhaṁ vā adukkhamasukhaṁ vā` giữ nguyên như khuôn đã có. Riêng `xúc chạm của lưỡi` là lựa chọn mới: kho có *sự xúc chạm qua lưỡi* (1) và *xúc của lưỡi* (1), tôi chọn *xúc chạm của lưỡi* cho khớp *xúc chạm của con mắt* trong chính bài này.
  **`ti`: giữ, và đây là hai số của quy ước không đồng nhất.** Khoá `1.19` kết bằng `”ti.`; tôi giữ `”ti.`. Đo ở phạm vi gần nhất `sn35.*` (3 895 khoá có bản Việt): **giữ `”ti.` 132, bỏ thành `”.` 101**, 88 khoá chưa dịch. Riêng Pāli trùng nguyên văn của chính khoá này (56 cặp): giữ 24, bỏ 28. Toàn tầng ngược lại: giữ 2 550, bỏ 7 135. Chọn **giữ**, vì luật của lát là khớp Pāli từng khoá và bỏ `ti` là bỏ một phần tử có thật trong nguồn; hai số đã ghi để coordinator chốt.
  **`Catutthaṁ`: chọn *Thứ bốn.*, và đây cũng là hai số.** Đo ở phạm vi gần nhất `sn35.*`: ***Thứ bốn.* 9, *Thứ tư.* 6**. Toàn tầng ngược lại: *Thứ tư.* 162, *Thứ bốn.* 94 (phần lớn ở `an1`/`an3`/`an4`); riêng bộ `sn*` thì *Thứ bốn.* 73, *Thứ tư.* 40. Tệp lân cận ngay `sn35.43-51` dùng *Thứ tư.* ở `sn35.46:1.2`. Chọn theo phạm vi gần nhất và theo `sn*` (*Thứ bốn.*), đồng thời khớp chín bốn mốc còn lại vốn đều là *thứ + số*; sự lệch với `sn35.43-51` đã ghi đây để coordinator gộp.
  **Bất định đã ghi nhận, không che.** (1) `saṅkhittaṁ.` ở chín khoá `1.2` của `sn35.34`–`sn35.42` **không có tiền lệ nào trong toàn tầng** (0 khoá Pāli trùng); tôi dịch *tóm tắt.*, theo đúng chức năng peyyāla (chín bài này là bản nói rút gọn của `sn35.33`) và theo tiền lệ *tóm tắt* 70 lần cho `saṅkhitta` ở `an5.20`; hai cách khác là *rút gọn* (13) và *sơ lược* (`an3.33`). Người đọc phải hiểu đây là nhãn kỹ thuật, không phải mệnh đề mới. (2) Khoá `1.19` là mảnh vỡ giữa chừng: Pāli bắt đầu bằng vế danh từ và `pajānātī` là ngôi thứ ba **có trong chính khoá này**, nên tôi giữ thứ tự *không còn gì là tự thân nữa, vị ấy biết rõ”ti.*; 28 bản dịch sẵn có đảo thành *biết rõ: không còn gì là tự thân nữa* và 22 bản giữ `”ti.`. (3) `Khayavayasamudayaṁ` (`2.3`) có 3 bản dịch sẵn và cả ba đều lệch nhau, trong đó `sn23.22:2.5` dịch sai thành *sanh khởi, chấm dứt, tan rã*; tôi dịch *hoại diệt, suy tàn, sanh khởi,* cho khớp đúng ba tên bài đã dùng ở chính bài này. (4) Vế cuối `Nirodhadhammena te dasāti` dịch *Cùng pháp diệt tận, đó là mười bài.* — chữ *bài* là do uddāna này liệt kê **tên mười bài kinh** của phần, và tệp kế `sn35.12` cũng thêm *bài* ở `uddāna` (*Một bài vô thường, một bài khổ, một bài vô ngã*), nên không phải chữ thêm nghĩa. (5) Tên phẩm là *Có Tính Sanh Tái* còn thân bài là *có tính sinh*: cố ý, vì tên phẩm phải dùng nguyên văn chỗ đã có, còn thân bài dùng dạng ngắn cho đọc 20 lần.
  **Bốn lệnh cổng kỹ thuật do coordinator chạy, lát agent không được chạy:** `npm run validate` · `npm test` · `npm run check` · `npm run build`. Vì bốn lệnh ấy chưa chạy ở lát này nên `technical_integrity` đặt **9,6** chứ không phải 10,0, và bài này không tuyên bố technical gate pass. Lát cũng bị cấm mọi lệnh `git`, nên không có `git status` nào để đối chiếu; hai tệp đã kiểm bằng `os.path.exists` và đọc lại từ đĩa.
  Ghi chú kỹ thuật: `save_vi` của `_hvi.py` **không dùng được** cho uid gộp này — `pal('sn','sn35.33-42')` lọc theo tiền tố `sn35.33-42:` nên trả rỗng, và `ngoặc()` đòi ngoặc kép cân trên cả bài trong khi Pāli đã ghim ở đây dư 9 dấu mở. Bản dịch vì thế được ghi bằng đúng định dạng `_hvi._ghi` (thứ tự khoá theo số, `indent=2`, `ensure_ascii=false`, hết file bằng `\n`) và tự chạy năm phép kiếm ở trên; `scripts/validate.ts` không có kiểm cân ngoặc kép trên tầng Việt nên cấu trúc này không làm hỏng cổng.
