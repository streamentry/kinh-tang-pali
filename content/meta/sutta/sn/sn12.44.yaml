notes: |-
  Nguồn: PĀLI root đã ghim (commit 11c9d708, tầng `pali`) + bản Anh Bhikkhu Sujato đã ghim
  (`source/upstream-manifest.json`, tầng `english-sujato`, `treeSha` 24e81ded; tệp
  `sutta/sn/sn12/sn12.44_translation-en-sujato.json` tồn tại ở commit này). Coverage Anh đo theo đúng công thức `source/layers.yaml`
  (`substantivePaliMinChars: 40`, loại block tham chiếu `:0`): **17/17 khoá PĀLI có nội dung = 100%** — trên ngưỡng 0.8 nên
  không cần ghi ở `content/meta/reference-gaps.yaml`. Tầng `vietnamese-current` vắng
  (`translation/vi/phantuananh` tại commit đã ghim chỉ có 26 tệp, toàn bộ là Pháp Cú), và
  đây là giới hạn của bản chụp upstream chứ không phải thiếu sót của kho — nên `triangulation`
  không thể cao hơn mức đó.

  `Lokasaṅkhitta` ở `sn12.44` là bản **tóm lược** duyệt lại mệnh đề duyên khởi ở
  `sn12.22–23`; tôi dịch tên `Lokasutta` theo đa số (*Kinh Thế Gian*, 4 tệp ⟵ *Kinh Thế
  Gian*→*Kinh Thế Giới*, 3 tệp) chứ không thêm chữ *tóm lược*, vì PĀLI ở `0.3` không có
  `saṅkhitta`. Chênh lệch chỉ 1 tệp nên đây là chỗ dễ người biên tập muốn gộp.

  Bốn khoá duyên `…paccayā` ở `2.5`–`2.8` có 5 cách tiền lệ lẫn nhau (cao nhất 2 tệp mỗi
  cách); tôi chọn *Do … làm điều kiện, sinh khởi …* cho cả bốn vế, đúng nhóm đã dùng ở
  `sn12.45` và ở `2.3`/`2.4` ngay trên (*Do xúc chạm làm điều kiện, sinh khởi cảm thọ;*),
  thay vì trộn *do duyên … mà có …*. Lý do: `3.7` lặp lại `2.8` nguyên văn, và bản dịch
  phải giống nhau ở hai chỗ.

  Các khoá lược `3.1`–`3.4` và `5.1`–`5.4` chỉ có tiền lệ **1 tệp mỗi câu**, và có hai
  biến thể: *nhân mũi và mùi …* so với *nhân mũi và mùi, thức của mũi sinh khởi …*. Tôi chọn
  bản NGẮN, vì PĀLI của các khoá này lược ngay sau danh từ (`ghānañca paṭicca gandhe ca …`),
  nên vế thứ hai là **chữ không có nguồn** nào đứng vững ở đúng chỗ đó. Bản Anh Sujato mở
  rộng đúng như vậy — và đó là loại lỗi mà BRIEF §10.1 cấm.

  Dấu lược: giữ **đúng một** `…` cho mỗi `…pe…` của PĀLI, không mở rộng, và KHÔNG thêm
  dấu lược vào khoá mà PĀLI không lược. Đây là điểm cần nói rõ vì bản Anh Sujato ở commit
  đã ghim có **tra dấu `…` vào nhiều khoá mà PĀLI không lược** (ví dụ `4.2`–`4.4` của
  `sn14.18` mỗi khoá kết bằng `…` bên Anh, trong khi PĀLI kết bằng `;`). Tôi theo PĀLI.
  Đếm: sn12.43 = 8, sn12.44 = 11, sn14.18 = 9; `save_vi` của `_hvi.py` đã bắt khớp từng
  khoá.

  Tiền lệ dùng lại nguyên văn (đếm trên tầng Việt dự án, kèm số tệp) được ghi trong
  `_tvd_67.py` ngay trên mỗi `save_vi`. Vài chỗ cố ý theo đa số dù tiền lệ lệch:
  · `Sāvatthiyaṁ viharati.` → *Trú ở Sāvatthī.* (**75 tệp**; *Đang sống tại Sāvatthī.* 53;
    *Trú tại Sāvatthī.* 6 — `sn12.45`/`46` dùng cách 6 tệp này vì cùng phẩm, nhưng đa số
    toàn tầng và `sn14.14` cùng loạt đều là 75 tệp, nên tôi theo 75).
  · `Catutthaṁ.` → *Thứ tư.* (**140 tệp** ⟵ *Thứ bốn.* 93).

  Bất định chung của ba bài `sn` trong lát:
  · `dhātusova` — Sujato đọc là *an element* (theo `dhātu` = phần tử), còn từ điển tra đọc
    là *xét về nghĩa lý, do giới tánh*. Tôi theo *do giới tánh* theo đa số tiền lệ
    (`sn14.14:1.2`, 9 tệp). `sn14.19:1.2` đã dịch ngược lại thành *Về nghĩa lý* — là bất
    đồng ở cấp toàn kho, đề nghị người biên tập thống nhất; tôi không tự sửa bài đã có.

  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|
  check`. `save_vi` của `_hvi.py` đã pass 45/45 khoá cho bài này (đủ khoá, không thừa, NFC,
  không trùng nguyên văn PĀLI, PĀLI không lọt vào bản Việt, số dấu lược khớp từng khoá,
  ngoặc kép cân trên cả bài), và `_rv67.py` quét lại không có lỗi nào ngoài `:0.1` — khối
  tiêu đề ngắn mà `_hvi.py` cố ý không kiểm, giữ nguyên PĀLI là tiền lệ **100%** (vd
  `sn12.45:0.1`, `sn14.14:0.1`). Người biên tập cần chạy đủ `npm run validate`, `npm test`,
  `npm run check`, `npm run build` trước khi coi `technical_integrity: 9.6` là đạt.
