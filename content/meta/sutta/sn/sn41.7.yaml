notes:
  - >-
    **Bài song sinh cùng nhân vật với `sn41.5` (Paṭhamakāmabhūsutta, `published`).** Cùng gia chủ Citta, cùng địa điểm Macchikāsaṇḍa, và Pāli ở `sn41.5:1.1`, `:1.2`, `:5.7`, `:7.2`, `:7.3` trùng nguyên văn với `sn41.7:1.1`, `:1.2`, `:6.3/6.7/6.11`, `:6.15`, `:6.16`. Năm khoá đó dùng lại nguyên văn bản Việt của sn41.5.
  - >-
    **Bốn giải thoát lấy từ bài song song đã dịch, không tự đặt.** `mn43` (Mahācattārīsaka) và `mn127` dịch sẵn đúng bộ `appamāṇā / ākiñcaññā / suññatā / animittā cetovimutti`: *vô lượng tâm giải thoát* (mn127:4.5, mn43:31.6) · *vô sở hữu tâm giải thoát* (mn43:32.1) · *tâm giải thoát qua tính không* (mn43:33.1) · *vô tướng tâm giải thoát* (mn43:34.1). `ākiñcaññāyatana` = *Vô Sở Hữu Xứ* và `viññāṇañcāyatana` = *Thức Vô Biên Xứ* có 103 cặp tiền lệ (dn33, dn9, dn15). `attā/attaniya` → *tự ngã / cái thuộc về tự ngã* (đúng `mn43:33.3`; *tự ngã* sn=136 mn=239). `akuppā` → *bất động* (sn=64), `aggamakkhāyati` → *được gọi là cao nhất* (đúng `mn43:35.4/36.3/37.3`), `pariyāyo` → *cách nhìn theo đó*.
  - >-
    **Khác kho, có chủ ý — số đếm.** (a) `upekkhā` → *tâm xả*: 6 tệp cùng công thức đã dùng *xả* (`mn7:16.1`, `mn43:31.5`, `mn83:9.5`, `mn97:33-35.3`, `mn99:25-27.3`, `mn127:7.5`), và trong chính mn83 karuṇā là *bi* còn upekkhā là *xả* — hai từ khác nhau, không lặp. *tâm xả* (mn=29 an=6) thắng *tâm bình thản* (an=5 mn=0). Dù đúng là *bình thản* mới là thuật ngữ Việt thông dụng cho upekkhā, lát này theo kho. (b) Công thức tứ vô lượng tâm chọn nhóm đa số *quảng đại, vô lượng, không thù hận, không ác ý* (mn=16) hơn *cao cả, vô lượng, không hận, không sân* của mn43/mn127 (mn=10) — và Pāli bài này viết `averena abyāpajjena` (không ác ý) chứ không phải `abyābajjhena` như mn43, nên nhóm đa số cũng khớp Pāli hơn.
  - >-
    **0.1 giữ Pāli, có số đếm.** `Saṁyutta Nikāya` có 1492/1493 tệp `sn`; chỉ một tệp dùng *Tương Ưng Bộ* (và chính tệp đó — `sn47.14` — vẫn viết Pāli ở `:0.1`, nên ghi chú của nó không khớp dữ liệu). `0.2` `Cittavagga` → *1. Phẩm Tâm* (3/3: sn41.2/.5/.9). `0.3` `Godattasutta` → *Kinh Với Godatta* theo khuôn sn41.
  - >-
    **Nhặc kép và dấu lược giữ đúng Pāli.** Pāli mở `“` ở `:1.3`, `:1.4`, `:2.1`, `:6.15`; bản Việt đóng/ mở cùng vị trí. `:2.3` và `:2.4` có `…pe…` → mỗi khoá đúng MỘT `…` (luật BRIEF_VI3 §10.1).
  - >-
    **Còn dịch `sabbattatāya` thành *khắp mọi nơi* cùng `sabbadhi`.** `mn43:31.2`, `mn127:7.2` và `mn97/mn99:32.2/24.2` cũng gộp hai từ này thành một; giữ nguyên cách gộp của kho để không tự tạo thêm một cách.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Tại commit đã ghim `translation/vi/phantuananh/` chỉ có 26 chương Pháp Cú, không có Hòa thượng Thích Minh Châu cho `sn41`; đây là đặc điểm snapshot upstream. **Coverage tầng Anh 34/34 = 1,000** (toàn bộ Pāli có nội dung đều có chữ Anh, và bài này KHÔNG dùng bản lấp của dự án), nên triangulation là một lần đọc Anh độc lập.
