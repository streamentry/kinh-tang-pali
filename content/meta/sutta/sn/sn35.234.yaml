notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở commit 11c9d708. Không có bản Việt tham khảo: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên tầng `vietnamese-current` không phủ bài này và triangulation chỉ dựa trên Pāli + Sujato.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  Tra tiền lệ bằng cách đếm được trên 3.359 bài Việt đã có: 362 cặp Pāli trùng nguyên văn với lát này đã có bản dịch; những cặp đó dùng lại nguyên văn.
  Tên phẩm `Samuddavagga` đi theo đa số đã có: 18. Phẩm Biển (sn35.228, sn35.229, sn35.230) 3 phiếu, bỏ 18. Phẩm Biển Cả của sn35.233 (1 phiếu). 0.1 giữ Saṁyutta Nikāya: đếm 1202 so với 330 cho Tương Ưng Bộ. 0.3 `Udāyīsutta` dùng lại nguyên văn an4.40 và an5.159.
  Dùng lại nguyên văn sn35.233 (bài ngay trước, cùng công thức) cho 1.1, 1.2, 1.3, và cho `No hetaṁ, āvuso` ở 4.4, 5.4, 6.4. `Evamāvuso` dịch là Đúng vậy theo 3 cặp Pāli trùng nguyên văn (mn5:4.6, mn5:5.6, mn24:9.2); chuỗi Thưa vâng đếm được 17 lần nhưng ít chính xác bằng với `evamā`.
  0 tiền lệ cho `cakkhuviññāṇa/jivhāviññāṇa/manoviññāṇa`: dịch Hán–Việt là mắt-thức, lưỡi-thức, ý-thức để tránh Pāli có dấu lọt vào bản Việt.
  Dấu lược theo luật của BRIEF_VI3 §10.1: Pāli có …pe… thì Việt giữ đúng một …, không mở rộng. 4.5 và 5.5 mỗi khoá một …; các khoá 4.1, 4.3, 5.1, 5.3, 6.1, 6.3 giữ câu trọn vì Pāli ở đó không có …pe….
  Bất định đã phân xử: 7.4 `paccattaññeva parinibbāyati` dịch là tự mình chứng đạt sự tịch diệt, đọc theo nghĩa chứng ngộ tự mình chứ không phải Niết-bàn-vào; `nāparaṁ itthattāyā` ở 7.5 dịch là không còn gì là tự thân nữa, theo sn46.5:1.10 (Sujato: there is nothing further for this place).
  Ngoặc kép cân trên cả bài theo đúng cấu trúc Pāli: 6.5 mở nháy nhưng không đóng, 7.5 đóng nháy ấy. Không thêm dấu nháy nào ngoài Pāli.
  Coverage tầng Anh đo trên Pāli có nội dung (21 segment) là 21/21 = 100%: Sujato đã ghim 18/21, 3 chỗ còn lại do lớp english-project của dự án bù và đang published. Không cần ghi nhận gap.
