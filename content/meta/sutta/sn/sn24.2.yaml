  32 khoá có PĀLI TRÙNG NGUYÊN VĂN với tệp đã có trong HEAD, dùng lại nguyên văn — nhiều nhất trong lát: 0.2 (3 bài) · 0.3 (`sn22.151:0.3`, cùng tên bài) · 1.1 (433) · 1.2 (`sn24.11`/`sn24.12`) · 1.3 (`sn22.159:2.7`, `sn18.11`) · 1.4 (`sn24.10:1.4`) · 1.6 (`sn12.61:2.4`) · 1.7 (`sn24.19:2.3`) · 1.8 (`sn22.150:1.6`) · 1.9 (`sn22.150:1.7`) · 1.10 (`sn24.19:2.6`) · 1.11 (`sn12.61:2.4`) · 2.1 (`sn13.2`/`sn13.10`/`sn13.11`) · 2.2 (`sn22.150:1.10`) · 2.3 (`sn22.151:1.10`) · 2.5 (`sn22.106`) · 2.6 (`sn22.106`) · 2.7 (`sn22.150:1.19`) · 2.8 (`sn22.151:1.17`) · 2.9 (`sn24.36:3.14`) · 2.10 (`sn22.159:2.7`) · 2.11 (`sn18.11`) · 2.12 (`sn24.10:2.7`) · 2.13 (`sn22.150:1.11`) · 2.14 (`sn18.11:1.7`) · 2.15 (`sn18.11:1.8`) · 2.16 (`sn24.9:3.19`) · 2.17 (`sn22.159:2.7`) · 2.18 (`sn18.11`) · 3.1 (`sn24.10:3.1`) · 3.2 (`sn24.10:3.2`) · 3.3. Tổng lát c32: 143 cặp.
  `Kismiṁ nu kho, bhikkhave, sati, kiṁ upādāya, kiṁ abhinivissa evaṁ diṭṭhi uppajjati` dịch y hệt `sn24.19:1.2` (khi có cái gì, khi dựa vào cái gì, khi hướng về cái gì thì ý kiến như sau khởi lên) và dùng lại cho 1.2, vì bài song song cùng phẩm này.
  Pāli trùng nguyên văn giữa hai bài của lát: `api nu taṁ anupādāya evaṁ diṭṭhi uppajjeyya:` ở 2.9 và `sn24.45:3.15` — gộp về MỘT cách dịch (lẽ nào cái chịu biến hoại ấy mà không chấp thủ thì ý kiến như sau vẫn khởi lên) sau khi bản nháp đầu lệch nhau.
  LỆCH CÓ CHỦ ĐÍCH, ghi rõ: `‘etaṁ mama, esohamasmi, eso me attā’ti` xuất hiện ở 1.6 và 1.11 với Pāli giống hệt, nhưng bản nháp lấy nguyên văn `sn12.61:2.4` (tôi là cái này) trong khi 1.3, 2.10, 2.17 lấy `sn22.159:2.7` (cái này là tôi). Bốn khoá cùng nghĩa nên gộp về cái này là tôi (22 khoá trên đĩa so với 14) cho nhất quán trong bài.
  `etaṁ mama, esohamasmi, eso me attā` dịch thành Cái này là của tôi, cái này là tôi, cái này là tự ngã của tôi (không dùng thêm dấu hai chấm như một số bản cũ). `sotāpanno avinipātadhammo niyato sambodhiparāyano` ở 3.2 dùng nguyên văn `sn24.10:3.2`.
  Dấu nháy kép đúng nhịp Pāli: 1.2 mở thì 1.3 khép; 1.4 mở, 1.5 mở thêm, 2.2 khép 1.5; 2.4 mở thì 2.7 khép; 2.10 khép 1.4; 3.1 mở thì 3.2 khép. Mười dấu lược giữ đúng MỘT `…` mỗi khoá.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy; technical_integrity 9.6 vì lát này không tự chạy bốn lệnh đó. Đã tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, và mô phỏng đúng `validateSegmentMap` của `scripts/validate.ts` (tiền tố khoá, orphan, requireComplete, non-Latin) — 316/316 khoá sạch.
