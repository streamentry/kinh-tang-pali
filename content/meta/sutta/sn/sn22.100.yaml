notes: |-
  Dịch từ Pāli root; đối chiếu bản Anh Bhikkhu Sujato ở commit đã ghim. Coverage Anh 23/23 đoạn Pāli có nội dung (≥40 ký tự, bỏ khối tham chiếu :0) = 100%, không đoạn nào phải đứng một mình trên Pāli.
    Tầng Việt hiện hành không có bài này: translation/vi/phantuananh/ ở commit đã ghim
    chỉ chứa 26 chương Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu
    thuật ngữ; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo.
    budsas.org chỉ là tra cứu toàn văn, không cấp text cho tầng nào.
  0.1 đo trên 1.652 tệp sn của tầng: toàn bộ dùng Saṁyutta Nikāya (ṁ = U+1E41), 0 tệp nào dùng Saṡyutta. Tên phẩm 0.2 đo trong chính phẩm: 5 tệp sn22 đều ghi 10. Phẩm Hoa, không phân kỳ. Ba phẩm còn lại của lát đo tương tự và cũng nhất quán: 4. Phẩm Không Như Mình 8 tệp, 1. Phẩm Nhập Lưu 15 tệp, 1. Phẩm Tâm 6 tệp, 1. Phẩm Không Tuyên Bố 4 tệp.
  Chỗ cần người biên tập quyết: Dutiyagaddulabaddhasutta đặt là *Kinh Dây Dắt (Thứ Hai)*, vì gaddula trong ẩn dụ này là dây buộc (Pāli kể một con vật bị buộc vào cột trụ hay cọc), không phải chổi quét. Nhưng uddāna của sn22.102 (lát trước, đã published) lại dịch hai bài Gaddulabaddha là *Buộc Chổi*. Hai bên cần thống nhất; tôi giữ nghĩa của ẩn dụ và ghi lệch ở đây thay vì sửa tệp ngoài lát.
  Tra tiền lệ có số đếm và dùng lại nguyên văn: Sāvatthinidānaṁ → *Tại Sāvatthī.* (sn24.2:1.1 và hàng trăm tiền lệ); assutavā puthujjano → *vị phàm nhân vô học* — Pāli trùng nguyên văn với sn14.12:3.2 và :4.2, đã có sẵn trong tầng; ẩn dụ dây buộc theo mn102:12.7 (*con chó bị xích buộc chặt vào cột trụ hay cọc vững chắc*) nhưng bỏ chữ *chó* vì Pāli ở đây không nói loài vật nào; Taṁ kiṁ maññatha → *Các ông nghĩ sao về điều ấy* theo sn24.2:2.1; các câu hỏi vô thường–khổ–lạc theo nguyên văn sn24.2:2.13–2.16; etaṁ mama, esohamasmi, eso me attā → *Cái này là của tôi, tôi là cái này, đây là tự ngã của tôi* (15 tiền lệ ở sn24.2 và sn24.3).
  0 tiền lệ sạch trong kho, ghi để người đọc biết đây là lựa chọn mới: paccavekkhitabbaṁ → *tự thấy lại tâm mình*; caraṇaṁ → *Hành vi*; cittataraṁ → *đa dạng hơn*; pañcupādānakkhandha → *năm uẩn thủ uẩn*; rāga/dosa/moha → *tham, sân, si*; nīli → *chàm*; haliddi → *nghệ*; mañjiṭṭhā → *cánh đỏ*.
  Bất định đã ghi, không giấu. (1) abhinibbattento abhinibbatteti ở 4.2: Pāli chỉ có động từ này, bản Anh Sujato thêm *a future life*; tôi dịch *khi tạo ra đời sống tương lai* theo hướng Sujato nhưng đây là chỗ Pāli không nói thẳng, vì thế ambiguity_integrity chỉ 9.0. (2) rājanā và lākhā ở 4.1 đều là son/lac, dịch *son đỏ, son* để giữ đủ năm thứ màu Pāli liệt kê; không có cách nào trung thực hơn mà không bịa tên loài cây. (3) nāparaṁ itthattāyā ở 4.12: bản Anh có dấu lược, Pāli không có — tôi không chép dấu lược của bản Anh. (4) saṅkiliṭṭha → *bị nhiễm ô*, cùng cách dùng cho saṅkilesa ở sn24.7, chọn vì *nhiễm ô* thành câu với *thanh tịnh* ở vế sau.
  Dấu lược: …pe… của Pāli giữ đúng một dấu lược, đếm lại từng khoá, không khoá nào lệch. 4.2 có ba dấu lược (một …pe… và hai …); 4.6–4.11 mỗi khoá một.
  Ngoặc kép ở 4.6–4.12: Pāli của chính bilara mở hai dấu mở (4.6 và 4.10) nhưng chỉ đóng một (4.12), vì dấu đóng của 4.6 bị nuốt trong …pe… của 4.9. Bản Việt đặt dấu đóng ngay sau dấu lược ở 4.9, đúng chỗ bị lược, để cân được và đúng nguyên văn in; đây là chỉnh sửa dấu câu, không thêm chữ nào.
