  Lượt cải thiện 2026-10-13 (kiểm toán mẫu): đọc đối kháng đủ 46 khoá như người chấm độc lập; đổi 30/46 khoá (kể cả các khoá lặp 1.14–1.17 = 2.4–2.7 = 3.3–3.6, giữ giống nhau). Các mục ghi ở đây thay thế những chỗ cũ mâu thuẫn ở phần trên (cách dịch assutavā puthujjano, caraṇa, dấu ngoặc ở 4.9, 4.12, abhinibbatti).
  LỖI NGHĨA THẬT (7 khoá): 4.12 *nāparaṁ itthattāyā* bị dịch thành *không có gì cao hơn thế này*, sai nghĩa nặng; công thức đo được 30 lần trong dn/mn đều là *không còn trở lại trạng thái hiện hữu này nữa*, nay dùng đúng câu đó. 4.2 bản cũ thêm *khi tạo ra đời sống tương lai*, Pāli chỉ có động từ abhinibbatteti nên đã bỏ phần thêm. 1.3 *vô min* (lỗi chính tả) và *bị tham trói buộc* cho taṇhā; nay theo đúng câu Pāli trùng nguyên văn ở sn15 (khát ái, đa số 8/11 trong sn15). 1.4 Pāli *sā* là con chó (đối chiếu mn102:12.7 và bản Anh), bản cũ ghi *con vật* và mở bằng *Tương tự vậy* cho Seyyathāpi; nay *Ví như … con chó bị buộc dây*; upagacchati/upatiṭṭhati/upanisīdati/upanipajjati dịch *đi đến / đứng gần / ngồi gần / nằm gần* thay cho *ngay cạnh*, và 1.10–1.13 theo cùng cách. 4.1 rajako là thợ nhuộm (bản cũ *người vẽ tranh*), lākhā là cánh kiến (bản cũ *son đỏ, son*), mañjiṭṭhā là thiến thảo (bản cũ *cánh đỏ*), theo sn12.64:4.1, sn46.55:4.1, cnd9:39.3; mở bằng *Ví như*. 2.3 *ngay cả tâm ấy còn đa dạng hơn* đặt sai phạm vi so sánh, nay *chính tâm còn đa dạng hơn bức tranh ấy*. 3.1 Đức Phật xưng *tôi* nay *Ta*; ekanikāya là một nhóm; *phức tạp* đổi *đa dạng* để cùng một từ với cittataraṁ ở 2.3 và 3.2.
  LỖI NHẸ, thuật ngữ và văn phong (khoảng 15 khoá): assutavā puthujjano từ *vị phàm nhân vô học* về *kẻ phàm phu chưa học* (đo 66 trong toàn tầng, 35 trong sn22; dạng cũ chỉ 5, trong đó 3 ở chính bài này và 1 ở sn14.12); samanupassati từ *nghĩ rằng* về *xem … là* (đa số xem trong nhóm công thức etaṁ mama); pañcupādānakkhandha từ *năm uẩn thủ uẩn* về *năm thủ uẩn* (183 so với 4); saṅkilesa/saṅkiliṭṭha từ *nhiễm ô* về *ô nhiễm* (861 so với 166, và pe8:145.3 cùng câu); paccavekkhitabbaṁ từ *tự thấy lại* về *thường xuyên quán sát tâm của mình* theo mn122:15.1; cittavodānā *do tâm thanh tịnh* đối xứng với 1.16; 4.3 theo *Điều ấy các ông nghĩ sao* (10 trong sn22); 4.11 *Thấy như vậy …* theo sn22.83, sn22.87, sn22.93; Seyyathāpi *Ví như* và evameva *Cũng vậy* (82 và 220 so với 5 của *Tương tự vậy*).
  Dấu ngoặc nay khớp Pāli từng khoá: bỏ dấu đóng ” mà bản cũ tự đặt ở 4.9 (Pāli 4.9 không có, chỉ đóng ở 4.12); thêm dấu mở “ ở 2.3 đúng như Pāli; bỏ nháy ‘…’ quanh tên bức tranh ở 2.1 và 2.3 vì Pāli không có nháy ở đó. 4.12 không còn nháy đơn, như Pāli. Phép đo: tập khoá 46/46, 0 khoá thừa hay thiếu, nháy đơn và nháy kép khớp Pāli ở 46/46 khoá, 4 nhóm Pāli trùng nguyên văn trong bài (1.14=2.4=3.3, 1.15=2.5=3.4, 1.16=2.6=3.5, 1.17=2.7=3.6) bản Việt đều giống nhau, NFC, không Pāli lọt sang Việt, dấu lược cân từng khoá.
  Đổi điểm: semantic_fidelity 9.4 sang 9.0 và grammar_logic 9.3 sang 9.1 (bản cũ có sai nghĩa nặng ở 4.12 và thêm nghĩa ở 4.2, nay đã sửa nhưng điểm cũ không đúng thực tế); terminology 9.3 sang 9.0 (nhiều khoá lệch tiền lệ nay đã đồng bộ nhưng caraṇa và cittita vẫn là lựa chọn mới); triangulation 9.4 sang 9.0 (bản Anh có 100% nhưng bản cũ không dùng để bắt các lỗi trên; vẫn không có tầng Việt hiện hành đối chiếu theo đoạn); vietnamese_clarity 9.3 sang 9.1; han_viet_balance 9.3 sang 9.2. source_provenance, segment_alignment, ambiguity_integrity, technical_integrity giữ nguyên.
  Bất định còn lại, giữ nguyên không đoán: (1) *caraṇaṁ nāma cittaṁ* dịch *bức tranh tên là Hành vi* theo bản Anh (Conduct); chưa phân xử được đây là tên thật hay một loại tranh, bản Việt nguyên bài ở mục tra cứu toàn văn đọc là *danh họa*. (2) cittita/cittaññeva cittataraṁ là chơi chữ citta (tâm, vẽ, đa dạng); dịch *vẽ nên* và *đa dạng hơn*, không có cách nào giữ trọn cả ba nghĩa. (3) abhinibbatteti ở 4.2: không thêm *đời sống tương lai* vì Pāli không nói; hướng đọc theo tái sinh của bản Anh chỉ là cách hiểu. (4) ekanikāya dịch *một nhóm* (không nói rõ là nhóm chúng sinh).
  Ngoài phạm vi, chỉ báo: sn22.99:2.1 cùng lỗi *con vật* và *Tương tự vậy*; sn14.12 dùng *phàm nhân vô học*; khoảng 25 khoá sn22 dịch nāparaṁ itthattāyā thành *không còn gì là tự thân nữa* (ví dụ sn22.93:1.24, sn22.87:4.18, sn22.154:1.25) trái với tiền lệ dn/mn.
  technical_integrity 9.6 giữ nguyên: lượt này không chạy được npm run validate, npm test, npm run check, npm run build; chưa tuyên bố technical gate pass.
  Lượt kiểm toán lại 2026-10-13 (lần hai, độc lập): đọc đối kháng lại đủ 46 khoá, đối chiếu tiền lệ bằng số đếm; xác nhận các sửa ở lượt trên (nāparaṁ itthattāyā: dn, pe và ne dùng *không còn trở lại trạng thái (hiện hữu) này nữa*, còn *không còn gì là tự thân nữa* chỉ là dạng lệch lan trong sn). Chỉ đổi 1 khoá: 1.6 *cảm thọ …* thành *Cảm thọ …* vì Pāli mở đầu câu mới sau dấu chấm và tiền lệ sn22.93:1.7 cùng 17 khoá khác viết hoa. Không đổi điểm. Ngoài phạm vi, chỉ báo: sn12.64:4.1 viết *thiên thảo* trong khi sn46.55, cnd9:39.3 và bài này viết *thiến thảo*; an5.193 viết *son đỏ, son … cánh đỏ* cho cùng bộ năm thứ màu.
