notes: |-
      **DÙNG LẠI NGUYÊN VĂN — 15 khoá Pāli trùng nguyên văn:** `0.2` = `sn47.11:0.2`
      (*2. Phẩm Nālanda*) · `1.1` = `sn1.11:1.1` (*Tôi nghe như vầy—*) · `1.3` = `sn1.11:1.3` ·
      `1.4` = `sn1.11:1.4` · `1.5` = `sn1.11:1.5` · `1.6` = `sn1.11:1.6` · `2.4` =
      `mn46.18.2` (*Một người muốn sống, không muốn chết, muốn an vui và ghét khổ đi đến*) ·
      `2.5` = `sn56.35:1.2` · `2.9` = `sn13.10:1.3` (*Điều ấy các ông nghĩ sao, này các
      tỳ-kheo,*) · `2.11` = `sn18.11:1.11` (*Không phải vậy, bạch Thế Tôn*) · `3.2` =
      `mn19.26.2` (*Ý nghĩa ở đây là:*) · `3.4` = `sn17.1:2.2` (*Vì vậy, này các tỳ-kheo, cần
      học tập như vậy:*) · `3.6` = `an5.2:7.3` · `3.7` = `sn12.30:2.13` (*Thứ mười*) ·
      `4.0` = `sn1.10:5.0` (*Tóm lược:*).
      `1.2` **không** trùng nguyên văn (`sedakaṁ nāma sumbhānaṁ nigamo` so với `sn47.19:1.1`
      có thêm `bhagavā … viharati`) nhưng tôi dùng lại **nguyên văn** của `sn47.19:1.1` cho cả
      hai: *Một thời, Đức Thế Tôn trú ở xứ Sumbha, tại thị trấn Sedaka của người Sumbha.* —
      cùng bối cảnh, cùng cách gọi địa danh.
      **Thuật ngữ, kèm đếm:** `sivathikā` không có ở đây, nhưng `kāyagatā sati` → *niệm thân*
      (`an1.575:1.2`, `an1.616:1.1`, `ud7.8:2.1` — dùng 8 lần trong lát này) ·
      `adhivacanaṁ` → *cách gọi khác cho* (`sn17.6:2.1`, `sn17.2:2.2`) · `samatittiko telapattoti`
      → *bình dầu đầy đến miệng* (`mn119.29:2` dùng *đầy đến miệng* cho `samatittiko`) ·
      `ukkhittāsiko` → *cầm thanh kiếm đã rút khỏi vỏ* (`mn56.13.5` nguyên văn) ·
      `yānīkatā vatthukatā anuṭṭhitā paricitā susamāraddhā` → *lấy làm phương tiện, làm chỗ nương
      tựa, giữ gìn, tích tụ, chuyên sắc thực hành* (nguyên văn `dn34.1.7.39` cho sáu vế
      `bhāvitāya bahulīkatāya yānīkatāya vatthukatāya …`).
      **0 tiền lệ, đặt mới:** `paramapāsāvinī` → *mê hoặc* (0 tiền lệ; Sujato *most thrilling*;
      `pāsā` = mê hoặc, làm mê). `ambho` → *bạn*. `amanasikaritvā bahiddhā pamādaṁ āhareyya`
      → *quên bình dầu ấy, rồi lơ là làm đổ ra bên ngoài*.
      **⚠ Bốn khoá `4.1`–`4.4` là THƠ `uddāna`** (tóm lược danh sách mười bài của phẩm), **không
      phải mô tả**. Tôi dịch thành thơ tiếng Việt và giữ tên riêng Pāli: *Bậc Đại Nhân nói với
      Nālanda, / rồi đến Cundo và Bāhiyo khác; / Uttiya, Ariya, Brahmā, / Sedaka và người nữ đẹp
      nhất xứ nữa.* Đối chiếu `sn47.19` đã publish (`Kinh Sedaka`) và `sn47.11` (`Kinh Bậc Đại
      Nhân`) cho tên từng bài — `Mahāpuriso` = `sn47.11`, `Nālanda` = `sn47.12`, `Cundo` =
      `sn47.13`, `Bāhiyo` = `sn47.15`, `Uttiya` = `sn47.16`, `Ariya` = `sn47.17`, `Brahmā` =
      `sn47.18`, `Sedaka` = `sn47.19`, và `janapada` = chính bài này.
      **Không thêm mệnh đề nhân quả ngoài segment:** `3.3` chỉ nói *bình dầu đầy đến miệng* là cách
      gọi khác cho niệm thân — tôi **không** viết thêm *nếu không giữ tâm thì sẽ đổ như vậy*.
      `3.8` (`Nālandavaggo dutiyo`) → *Phẩm Nālanda là phẩm thứ hai.*, theo `sn35.123:2.6`.
      **Tầng Anh đủ 100%** (14/14), `triangulation` 9.3. **Không đối chiếu được tầng Việt hiện
      hành.**
      **technical_integrity = 9.6** vì bốn cổng kỹ thuật do coordinator chạy, tôi không được chạy (`npm run validate|test|check|build` bị cấm trong lát này): (1) `npm run validate` (qua `npm run build`) — kiểm metadata, scorecard, `blocking_errors` và nội dung; (2) `npm test` — unit tests; (3) `npm run check`; (4) `npm run build`. Ngoài ra `npm run reference:gaps:check` phải xanh sau khi chạy lại `npm run reference:gaps`.
