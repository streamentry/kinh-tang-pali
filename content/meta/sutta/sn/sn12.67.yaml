notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không căn theo segment nên chỉ dùng để đối chiếu thuật ngữ và mạch lập luận, không dùng làm tầng cột). Tầng `vietnamese-current` căn theo segment không có cho bài này (tại commit đã ghim chỉ có 26 chương Pháp Cú); tầng `english-project` chưa có bản lấp cho bài này.
  Coverage English = **32/32** khoá Pāli có nội dung = **100%** (Pāli ≥ 40 ký tự, bỏ khối `:0`), cao hơn xa ngưỡng 0,8 và không sát ngưỡng; Sujato có key cho cả 67/67 khoá. Chỉ có 2 khoá Sujato để trống, đều không có nội dung đủ ngưỡng: `8.2` (`abbhutaṁ, āvuso sāriputta.`, 26 ký tự, Sujato gộp vào `8.1`) và `9.17` (colophon `Sattamaṁ.`). Vì vậy bài không cần entry trong `content/meta/reference-gaps.yaml`.
  **Số Pāli.** `chattiṁsāya vatthūhi` (`8.4`) = *ba mươi sáu căn cứ*: `cha` 6 + `tiṁsa` 30 = 36; khớp phép đếm trong chính bài: 12 chi phần (già chết, sinh, hữu, chấp thủ, khát ái, cảm thọ, xúc, sáu xứ, danh sắc, thức, các hành, vô minh) × 3 mệnh đề (`9.1`–`9.3` và `9.14`–`9.16` viết đủ; `9.4`–`9.13` là phần lược) = 36. `dve naḷakalāpiyo` = *hai bó lau*.
  **Dùng lại nguyên văn đã có, đếm được.** Có 11 khoá Pāli trùng nguyên văn với khoá ở bài khác, tổng 346 cặp; 8 khoá dùng lại đúng văn bản Việt đã có (`0.2` 18/18 cặp; `7.6`, `7.7`, `7.13`, `7.14` từ `sn12.1`; `9.17` 266/271 cặp, còn lại là *Bài thứ bảy* / *Kinh thứ bảy*; `7.9` lấy dạng chiếm đa số 12/30 cặp; `1.1` lấy nguyên văn `sn22.122`, 1/3 cặp). Trong 346 cặp có 43 cặp bản Việt khác, đều là khác diễn đạt trên cùng nghĩa ở các câu mở đầu và công thức kết (`1.1`–`1.3` có tới 3–4 cách dịch trong kho, không cách nào chiếm đa số; `7.9` còn 4 dạng, `7.16` còn 3 dạng: `.”` và `”.` — chọn `.”` vì Pāli `”ti.` ở sn có 1976 khoá dùng `.”` so với 625 khoá dùng `”.`). Trong chính bài có 2 cặp Pāli trùng nguyên văn (`3.9` với `5.3`, `4.3` với `6.3`) và cả 2 cặp bản Việt chỉ khác nhau ở dấu nháy, đúng như Pāli (nháy kép ở lần đầu, nháy đơn khi được trích lại).
  **Thuật ngữ chọn theo tiền lệ đếm được.** `sayaṅkata` → *do tự mình làm ra* (sn: 8 khoá so với *chính mình làm ra* 3); `adhiccasamuppanna` → *ngẫu nhiên khởi lên*, theo `sn12.26` (*do ngẫu nhiên khởi lên, không do tự mình làm ra cũng không do người khác làm ra*); `āvuso` → *hiền giả* (sn: *hiền giả* 762 + *Hiền giả* 42 so với *hiền hữu* 20); `Mahākoṭṭhiko`/`koṭṭhika` → *Mahākoṭṭhita* / *Koṭṭhita* theo tầng (Mahākoṭṭhita 16 lần so với Mahākoṭṭhika 8 lần; Koṭṭhita 27 lần so với Koṭṭhika 6 lần — Pāli đã ghim đọc `-ko`/`koṭṭhika`, bản Anh Sujato viết Koṭṭhita; chọn theo đa số của tầng, không đổi nghĩa); `paṭisallānā vuṭṭhito` → *từ chỗ độc cư đứng dậy* (17 khoá *độc cư* so với 5 *thiền tịnh*); `migadāya` → *Vườn Nai* (10 so với *Lộc Uyển* 7); `nāmarūpa` → *danh sắc* (sn12: 35 so với *danh-sắc* 2); `jāti` → *sinh* (toàn tầng 50 khoá so với *sanh* 23; riêng sn12 là 12 so với 9, và `sn12.1` viết *sanh*; `dn`/`mn` đều là *sinh*); `jarāmaraṇa` → *già chết* (sn12: 35 so với *già-chết* 17); `dukkhakkhandha` → *khối khổ đau* (ở câu kết công thức `7.9`, dạng *khối khổ đau* 12 khoá so với *khối khổ* 6 khoá); `upādāna` → *chấp thủ* và `taṇhā` → *khát ái* và `vedanā` → *cảm thọ* theo `sn12.1` và `sn12.16` (sn12: chấp thủ 56 so với thủ 46; khát ái 38 so với ái 19; cảm thọ 49 so với thọ 18); `phassa` → *xúc* (sn12: 51 so với *xúc chạm* 28); `bhava` → *hữu* (sn12: 70); `nirodha` → *diệt tận* khi nối với `paccayā` (như `sn12.1`) và *đoạn diệt* chỉ trong câu kết công thức `7.16` (theo dạng có sẵn ở `sn12.53`, `sn12.52`, `sn35.113` và các bài khác); `dhammānudhammappaṭipanno` → *tỳ-kheo hành trì đúng theo pháp* (7 khoá so với *thực hành đúng* 4); `anupādā` → *không chấp thủ* (116 khoá so với *không còn chấp thủ* 4); `anumodāma` → *tùy hỷ* (`an5.36:3.3` dịch `anumodanti` là *tùy hỷ*; *hoan hỷ* ở 14 khoá sn là công thức kết kinh, khác cấu trúc nên không dùng).
  **Hai chỗ cố ý viết khác kho, đã đo.** (1) `nibbidāya virāgāya nirodhāya` → *để nhàm chán, ly tham, diệt tận*: ba bài `sn12.16`, `sn22.115`, `sn22.116` (12 khoá) dịch `nibbidā` là *từ bỏ*, nhưng trong 217 khoá chứa `nibbidā` ở toàn tầng, dạng có chữ *chán* (gồm *nhàm chán* 61 và *chán nản* 40) xuất hiện ở 177 khoá còn *từ bỏ* chỉ ở 20 khoá; *từ bỏ* mang nghĩa `pahāna`/`cajati` hơn là `nibbidā` (sự chán lìa, *disillusionment* của Sujato), nên bài này viết *nhàm chán*. Người biên tập nên cân nhắc đồng bộ 12 khoá đó. (2) `diṭṭhadhammanibbānappatto` → *đã chứng đắc Niết-bàn ngay trong hiện tại*: trong tầng có 13 khoá viết sai chính tả *chứng đắt* ở 6 bài (`an7.58`, `mil3.7.11`, `sn12.16`, `sn22.115`, `sn22.116`, `vv67`) — bài này viết *chứng đắc* (sn: 121 khoá). Lỗi ngoài lát, báo chứ không sửa.
  **Bất định đã ghi nhận, không che.** (1) `7.10`–`7.11` `Tāsañce … naḷakalāpīnaṁ ekaṁ ākaḍḍheyya, ekā papateyya; aparañce ākaḍḍheyya, aparā papateyya`: đọc theo chữ thì *kéo một (bó), một (bó) đổ*, nhưng bó bị kéo đi thì không thể đổ. Cả bản Anh Sujato (*the other would collapse … the first would collapse*) lẫn bản Việt nguyên bài của Hòa thượng Thích Minh Châu (*bó lau kia liền rơi xuống … bó lau này được rơi xuống*) đều hiểu là bó còn lại đổ. Bài này dịch *nếu kéo một bó … đi, thì bó kia sẽ đổ; còn nếu kéo bó kia đi, thì bó này sẽ đổ*; đại từ *kia/này* là cách phân giải của `eka`/`apara` trong cặp, không thêm ý nào khác. (2) `3.2`–`3.6` (`sayaṅkataṁ upādānaṁ …` v.v.) và `3.7` trong Pāli không có `kiṁ nu kho` mà chỉ có dấu lược; Sujato thêm từng câu hỏi trọn vẹn. Bản Việt giữ nguyên dạng lược, không thêm *có phải*, và nháy kép mở ở `3.1` chỉ đóng ở `3.7` đúng như Pāli. (3) `paṭisallānā` được dịch *độc cư* theo tầng; `etadavoca` → *nói với* (tầng có 5 khoá *bạch* và 3 khoá *nói với/thưa với* cho cùng người nói; Pāli dùng cùng động từ trung tính và hai tôn giả xưng hô ngang `āvuso`). (4) `Upamāyapidhekacce` có tiểu từ `api`; bản Việt *có những người trí nhờ ví dụ mà hiểu được* đủ nghĩa *một số người trí* (`ekacce`) mà không thêm sắc thái nhấn *ngay cả*. (5) `dhammānudhammappaṭipanno` giữ *hành trì đúng theo pháp* theo tầng; Thích Minh Châu viết *tùy pháp hành*.
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 67/67, đúng thứ tự Pāli. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá, 67 khoá (mẫu số 67, 0 lệch). Dấu lược: 18 khoá Pāli có dấu lược (3 khoá `…pe…` là `3.1`, `7.8`, `7.15`; 15 khoá `…` trần là `3.2`–`3.6` và `9.4`–`9.13`); cả 18 khoá Việt giữ đúng một `…`, không mở rộng, không dùng `…` để nén thêm. NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang bản Việt.
