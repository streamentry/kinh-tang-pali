notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh của Bhikkhu Sujato. Tầng Anh CÓ và đã đo: manifest liệt kê sutta/sn/sn22/sn22.78_translation-en-sujato.json, 38/39 khoá có chữ.
    Coverage đo được: 13/13 Pāli có nội dung có Anh = 1.0000. Không cần entry reference-gaps.
    21 khoá TRÙNG NGUYÊN VĂN, dùng lại y nguyên: 2.2, 2.5, 2.6 (an4.41, an4.90, sn46.30), 4.1–4.4 và 5.1–5.4 và 6.1–6.4 (an4.33, 11 cặp), 2.13 (sn21.5, sn21.6, sn21.8, sn3.24). 1.1 trùng 414 cặp → Tại Sāvatthī.
    KHÔNG dùng lại an4.33:3.1 và :3.4, cố ý và ghi rõ: bản Việt ở an4.33 đặt vế satthā appaṭipuggalo (bậc Đạo Sư vô đối thủ) vào 3.1, trong khi Pāli đặt nó ở 3.4, và lặp lại Sadevakassa lokassa hai lần — bản đó bị lệch do nối dòng ‑j của bản Anh đã ghim. Bài này dịch theo đúng thứ tự từ Pāli: 3.1 Khi bậc Phật, tự mình chứng ngộ, / 3.2 xoay chuyển bánh xe Pháp; / 3.3 trong toàn thế giới cùng chư Thiên, / 3.4 bậc Đạo Sư vô đối thủ, nhờ thắng trí của chính mình. Người điều phối nên xem lại an4.33:3.1–3.4.
    2.5 iti saṅkhārā → như vậy là các hành (dùng y nguyên sn46.30:2.9). 2.3 và 2.4 không có tiền lệ riêng vì Pāli ở đó đã lược bằng …; cảm thọ và tưởng theo khuôn sắc và thức đã có.
    Sīho migarājā → con sưu vốn là vua muông; sīhanāda → tiếng sưu. Cả hai 0 tiền lệ trong tầng (đo: sīha 0 lần, migarājā 0 lần, sīhanāda 0 lần), nên đặt mới theo Sujato The Lion / king of beasts.
    2.8–2.11 bốn câu của các vị trời, giữ đủ ba vế mỗi câu: Hóa ra chúng tôi …, trong khi tưởng mình là …! Sujato dịch vô thường, không bền, chuyển biến và bao hàm trong thân kiến — khớp với aniccā, addhuvā, asassatā, sakkāyapariyāpannā.
    4.3 Ariyañcaṭṭhaṅgikaṁ maggaṁ → con đường Thánh Tám Ngành, đa số nhẹ (3 tệp) và trùng đúng với an4.33 mà 4.1, 4.2, 4.4 đang dùng y nguyên; giữ nhất quán trong bài.
    Tầng vietnamese-current vắng, không có lớp lấp english-project. Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
