notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở commit 11c9d708. Không có bản Việt tham khảo: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên tầng `vietnamese-current` không phủ bài này và triangulation chỉ dựa trên Pāli + Sujato.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  Bốn lần lặp cùng một khung (1.2–1.8, 2.1–2.6, 3.1–3.6, 4.1–4.7) chỉ khác ở chữ ở 1.7, 2.5, 3.5, 4.6. Bốn khoá đó đã tra tiền lệ riêng và mỗi khoá dùng đa số đếm được: vivekanissita (69 lần y cứ vào, 25 lần nương vào) · rāgavinayapariyosāna (12 lần khuếch tán và loại bỏ, 2 lần mục đích cứu cánh) · amatogadha (12 lần chỗ không chết) · nibbānaninna (58 lần xu hướng, bến, dòng về phía Niết-bàn).
  Câu liệt kê apadā… và câu về appamādamūlakā dùng lại nguyên văn an10.15:1.1 (Pāli trùng tuyệt đối với 1.2, 2.1, 3.1, 4.1). Câu mong đợi và câu hỏi dùng lại sn45.140 và sn45.146-148.
  `ariyaṁ aṭṭhaṅgikaṁ maggo` dịch là bát chánh đạo: đếm trong sn45 là 238 lần bát chánh đạo so với 47 lần Thánh đạo tám ngành.
  0.2 `Appamādapeyyālavagga` là phân kỳ chưa chốt: chuỗi lặp khác nhau (sn45.141 và sn45.146 cho Chuỗi Lặp Không Phóng Dật, sn45.140 cho Lặp Lại Về Không Phóng Dật). Chọn theo đa số 2 phiếu và ghi ở đây để người biên tập thống nhất.
  0.3 `Tathāgatasutta` dùng lại nguyên văn sn56.12.
  Dấu lược: 1.7, 2.5, 3.5, 4.6 mỗi khoá một …, khớp Pāli; dấu lược nằm giữa hai vế tu tập chánh kiến và chánh định như Pāli.
  Bất định đã phân xử: ngoặc kép. Pāli mở nháy ở 1.2 và chỉ đóng ở 4.7, nên cả bài là một trích dẫn liên tục; bản Việt giữ đúng như vậy, các khối 2.x và 3.x không thêm nháy.
  Coverage tầng Anh trên Pāli có nội dung (26 segment) là 26/26 = 100%. Không cần ghi nhận gap.
