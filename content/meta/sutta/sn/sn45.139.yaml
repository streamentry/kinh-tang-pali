notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở commit 11c9d708. Không có bản Việt tham khảo: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên tầng `vietnamese-current` không phủ bài này và triangulation chỉ dựa trên Pāli + Sujato.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  Bốn lần lặp cùng một khung (1.2–1.8, 2.1–2.6, 3.1–3.6, 4.1–4.7) chỉ khác ở chữ ở 1.7, 2.5, 3.5, 4.6. Bốn khoá đó đã tra tiền lệ riêng và mỗi khoá dùng đa số đếm được: vivekanissita (69 lần y cứ vào, 25 lần nương vào) · rāgavinayapariyosāna (12 lần khuếch tán và loại bỏ, 2 lần mục đích cứu cánh) · amatogadha (12 lần chỗ không chết) · nibbānaninna (58 lần xu hướng, bến, dòng về phía Niết-bàn).
  Câu liệt kê apadā… và câu về appamādamūlakā dùng lại nguyên văn an10.15:1.1 (Pāli trùng tuyệt đối với 1.2, 2.1, 3.1, 4.1). Câu mong đợi và câu hỏi dùng lại sn45.140 và sn45.146-148.
  `ariyaṁ aṭṭhaṅgikaṁ maggo` dịch là bát chánh đạo: đếm trong sn45 là 238 lần bát chánh đạo so với 47 lần Thánh đạo tám ngành.
  0.2 `Appamādapeyyālavagga` là phân kỳ chưa chốt: chuỗi lặp khác nhau (sn45.141 và sn45.146 cho Chuỗi Lặp Không Phóng Dật, sn45.140 cho Lặp Lại Về Không Phóng Dật). Chọn theo đa số 2 phiếu và ghi ở đây để người biên tập thống nhất.
  0.3 `Tathāgatasutta` dùng lại nguyên văn sn56.12.
  Dấu lược: 1.7, 2.5, 3.5, 4.6 mỗi khoá một …, khớp Pāli; dấu lược nằm giữa hai vế tu tập chánh kiến và chánh định như Pāli.
  Bất định đã phân xử: ngoặc kép. Pāli mở nháy ở 1.2 và chỉ đóng ở 4.7, nên cả bài là một trích dẫn liên tục; bản Việt giữ đúng như vậy, các khối 2.x và 3.x không thêm nháy.
  Coverage tầng Anh trên Pāli có nội dung (26 segment) là 26/26 = 100%. Không cần ghi nhận gap.
  **Vế thứ ba của ẩn dụ dòng sông: `pabbhāro` là *bãi bồn*, không phải *có dòng* — đã sửa 1 khoá
  (2 lần).** `nibbānaninno hoti nibbānapoṇo nibbānapabbhāro` là ẩn dụ ba vế của một dòng sông: *có
  xu hướng (nghiêng)* · *có bến* · *bãi bồn (đổ sang bờ bên kia)*. Bản đang có dịch vế ba là *có
  dòng về phía Niết-bàn* — tức **lặp lại nghĩa vế nhất** (`ninno` đã là *có xu hướng về phía …*)
  và **đánh rơi** nghĩa của `pabbhāro`, vốn là vế độc lập: chỗ nước dồn lên bãi rồi tràn sang bờ
  bên kia. Đã sửa thành *có bãi bồn về phía Niết-bàn* theo mẫu đúng đã có sẵn ở `sn45.152:1.1`
  (*cây trôi về phía đông, có bến về phía đông, có bãi bồn về phía đông*); giữ nguyên vế một, vế
  hai và nhịp câu của chính bài này. Khoá đã sửa: `sn45.139:4.6`. Lớp lỗi này sinh ra từ chính
  luật *Pāli trùng nguyên văn thì cách dịch phải khớp*: một bài sai trước đó được nhân bản sang
  các bài cùng Pāli, nên nó lan rộng và trông rất nhất quất — đúng cái làm cho nó khó thấy. Quét
  lại trên **mọi** dạng chia của `pabbhāra` (`nibbānapabbhāro` và `nibbānapabbhāraṁ`), chứ không
  chỉ dạng danh từ, mới thấy hết lớp này. **Dấu lược không mở rộng:** `sn45.139:4.6` có `…pe…`
  trong Pāli và bản Việt vốn đã giữ **đúng một** `…`; sửa vế ba không đụng vào dấu lược. **Không**
  ép về khuôn *nghiêng / xuôi / đổ* của 28 khoá ở 11 bài khác (`mn73`, `sn45.149`, `sn46.77-88`,
  `sn47.51-62`, `sn48.71-82`, `sn48.125-136`, `sn49.1-12`, `sn50.1-12`, `sn50.55-66`,
  `sn51.33-44`, `sn55.22`) và 3 khoá *có bãi bồn* đã có sẵn ở `sn45.152` — đó là các cách dịch
  khác hợp lệ; ép khuôn sẽ sinh vấn đề mới. Đo lại toàn tầng sau khi sửa: Pāli có
  `nibbānapabbhāra*` ở 87 khoá / 32 bài, **0 khoá** nào còn dịch vế ba bằng *có dòng*. Ghi chú cũ
  của tệp này có nêu *… bến …, … dòng về phía …* như nguyên văn dùng lại / như tiền lệ đếm được;
  nay bị mục này thay thế, không xoá, để lịch sử còn đọc được. Con số *“58 lần xu hướng, bến, dòng
  về phía Niết-bàn”* ở ghi chú cũ của tệp này đo cả cụm ba vế cho `nibbānaninna…`; sau khi sửa vế
  ba là *bãi bồn*, đo lại toàn tầng được **61 lần *có bãi bồn về phía Niết-bàn* / 56 khoá**. Hạ
  `semantic_fidelity` (−0.3 × 2) và `terminology` (−0.1 × 2) theo **số lần sai × mức độ**;
  `final_score` tính lại bằng script từ trung bình số học thô của đúng 10 tiêu chí: 9.42 → 9.34,
  status `published` → `published`. Không blocker.
