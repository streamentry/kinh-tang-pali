notes: |-
  Đợt 19, làn 13. Dịch trọn 69/69 khoá từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt Hòa thượng Thích Minh Châu nguyên bài ở mục Tra cứu toàn văn (không phân đoạn nên không căn lề theo từng khoá).

  **Coverage tầng Anh trên Pāli có nội dung: 24/49 = 0.490** (dưới sàn 0.80). Sujato để trống 25 khoá dù Pāli viết đủ, gồm toàn bộ phần Mahānāma thuật lại cho Đức Thế Tôn (5.1–7.9) và 8.1–8.3. Lớp english-project của bài này chưa có, và reference-gaps chưa có mục cho bài; ngay cả khi có, lớp lấp do cùng một tác giả với bản Việt thì không phải cách đọc Anh độc lập. Vì vậy triangulation 7.5 và bài giữ draft kèm blocker nêu trong blocking_errors. Phần trống ấy dựa vào Pāli, các khoá cùng Pāli ở phần đầu bài (2.x, 3.x), và bản Thích Minh Châu.

  **Pāli trùng nguyên văn trong chính bài: 13 nhóm / 37 cặp**, cả 37 cặp đều dùng lại nguyên văn bản Việt (0 cặp khác). Chỗ Pāli chỉ khác dấu nháy (2.1/6.1, 3.2/7.2, 3.9/7.9, 4.1/8.2, 4.2/8.3) bản Việt chỉ khác dấu nháy. Các cặp khác Pāli thì khác Việt đúng chỗ khác: 3.1 *bao nhiêu pháp* (katihi) so với 6.9 *những pháp nào* (katamehi); 8.6/8.9/8.12/8.15 so với 8.18 chỉ khác dấu nháy đóng.

  **Số Pāli.** tīhi = ba, catūhi = bốn (ba pháp ở 2.1, 2.2, 2.8, 6.1, 6.2, 6.8; bốn pháp ở 3.2, 3.3, 3.9, 7.2, 7.3, 7.9). Năm lần mở rộng phe đối lập ở 8.4, 8.7, 8.10, 8.13, 8.16: Tăng tỳ-kheo; thêm Tăng tỳ-kheo-ni; thêm nam cư sĩ; thêm nữ cư sĩ; thêm thế gian cùng chư thiên, Ma vương, Phạm thiên, Sa-môn, Bà-la-môn, chư thiên và loài người. Mỗi cấp thêm đúng một nhóm so với cấp trước.

  **Thuật ngữ, theo tiền lệ đã đo.** *nhập lưu, không rơi vào ác đạo, chắc chắn, hướng về giác ngộ* (sotāpanna avinipātadhamma niyata sambodhiparāyaṇa): 32/49 khoá toàn tầng có avinipātadhamma dùng đúng cụm này, 6/49 dùng *Dự lưu*; theo đa số và theo sn55.2, sn55.8. *niềm tín xác quyết* (aveccappasāda): 13/62 khoá sn55 (theo sn55.21, sn55.22), còn lại *tịnh tín bất động* và *tín bất động*; chọn dạng khớp hai bài anh em liền kề. *các giới được bậc Thánh yêu mến, không bị sứt mẻ … đưa đến định* (ariyakanta sīla): *yêu mến* 21 khoá, *yêu thích* 8, *yêu quý* 3; *sứt mẻ* 17, *đứt đoạn* 11. *Đối với Pháp …* / *Đối với Tăng …* theo sn55.3 (10 khoá) và sn55.22. *Tăng chúng đệ tử của Đức Thế Tôn khéo thực hành … là ruộng phước vô thượng cho thế gian* theo sn55.27:10.2 (3 khoá). *Kapilavatthunidāna* → *Tại Kapilavatthu* theo sn55.47 (3 khoá). *Saraṇānivagga* → *3. Phẩm Quy Y* theo sn55.21, sn55.22, sn55.29. *người Sakka* theo sn55.21 và sn55.22 (sn55.37 dùng *Thích-ca*). *Tatiyaṁ* → *Thứ ba* (119 khoá). Xưng hô giữa hai người Sakka cùng hàng là *bạn* (tvaṁ), Đức Thế Tôn gọi Godhā là *ông* như gọi Mahānāma ở sn55.21.

  **Dấu nháy.** Mỗi khoá khớp Pāli: nháy kép mở ở 1.3, 2.1, 3.2, 4.1, 4.3, 5.1 và đóng ở 1.3, 3.1, 3.9, 4.2, 4.3, 8.18; 8.19 và 8.20 có cặp riêng. Nháy đơn mở ở 5.2, 7.2, 8.2 và đóng ở 5.2, 6.9, 7.9, 8.3. Pāli 6.9 chỉ có nháy đóng (không có nháy mở nào ở 5.3–6.8), bản Việt giữ nguyên như vậy. Pāli không có dấu nháy ở 2.4, 3.5, 6.4, 7.5 (itipi so bhagavā…), nên bản Việt cũng không thêm nháy.

  **Dấu lược.** Pāli …pe… ở 2.4, 2.5, 2.7, 3.5, 3.6, 3.7, 3.8, 6.4, 6.5, 6.7, 7.5, 7.6, 7.7, 7.8: mỗi khoá bản Việt giữ đúng một …; không khoá nào Pāli lược mà Việt viết đủ, không có (…) trần ở bài này.

  **Bất định (1) — Godhā là nam hay nữ.** Bản Anh Sujato dùng đại từ nữ (her) cho Godhā, nhưng Pāli ghi godhā sakko, godhaṁ sakkaṁ (danh từ giống đực) và bản Thích Minh Châu gọi Godhā bằng Hiền giả, họ Thích; cũng trùng tên *Kāḷigodhā sākiyānī* ở sn55.39, là người nữ khác bài. Bản Việt tránh đại từ phân biệt giới (*tôi/bạn*) nên không phụ thuộc vào cách hiểu nào.

  **Bất định (2) — dhammo samuppādo (8.4, 8.7, 8.10, 8.13, 8.16).** Nghĩa đen *một pháp-khởi nào đó nảy sinh*. Sujato dịch *instigation of a legal proceeding*, Thích Minh Châu dịch *vấn đề pháp sự khởi lên*; cả hai hiểu là một vụ tranh chấp hay vụ việc, vì Pāli ngay sau đó đặt hai bên (ekato … ekato) với Đức Thế Tôn một phía. Không có tiền lệ trong tầng cho cụm dhammo samuppādo (tìm 0 khoá; sn22.7 chỉ có *dhammasamuppādā* mang nghĩa các trạng thái lo âu khởi lên, khác nghĩa). Bản Việt chọn *vụ việc nào đó nảy sinh*, không dịch riêng dhammo (theo nghĩa tranh chấp của cả hai bản tham khảo); chưa phân xử được nghĩa chính xác của dhammo ở đây. Không đổi cấu trúc *một bên … một bên* nên không làm đổi thông điệp: Mahānāma tuyên bố đứng về phía Đức Thế Tôn.

  **Bất định (3) — 8.19 và 8.20, evaṁvādī tvaṁ / evaṁvādāhaṁ.** Pāli ở đây là chủ cách (nominative): nghĩa đen là *ông, người nói như vậy, nói gì với Mahānāma?* và *tôi, người nói như vậy, không nói gì với Mahānāma*, mâu thuẫn với văn cảnh (người nói như vậy ở trên là Mahānāma, không phải Godhā). Cả Sujato (*what do you have to say to Mahānāma when he speaks like this*) lẫn Thích Minh Châu (*họ Thích Mahānāma đã nói như vậy, này Godhà, Ông có nói gì không*) đều hiểu *evaṁvādī* như nói về Mahānāma, tức đọc như thể đối cách (evaṁvādiṁ). Bản Việt theo cách đọc ấy: *đối với Mahānāma đang nói như vậy*. Cách đọc chủ cách nghĩa đen (Godhā nói về chính lời mình vừa nói, *Hãy khoan…*) là khả dĩ nhưng không được hai bản tham khảo ủng hộ; chưa loại trừ được hẳn. Cũng thế, *evaṁvādāhaṁ* (8.20) có thể là evaṁvādiṁ + ahaṁ hoặc bản đọc khác; không có bản Anh độc lập chi tiết hơn.

  **Khác kho có chủ ý.** *Saṁyutta Nikāya* giữ nguyên ở khoá :0.1 như các bài sn55 anh em. Không có thuật ngữ nào mới ngoài kho.

