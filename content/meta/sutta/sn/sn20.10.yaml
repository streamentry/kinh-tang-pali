notes: |-
  Soạn từ Pāli root, đối chiếu Anh Sujato: 22/22 khoá có nội dung đều có Anh;
  1.7, 1.9 và 1.10 do `english-project` lấp (meta `published`). Không có bản Việt
  Thích Minh Châu (ngoài Pháp Cú).
  3.2-3.3 trùng PẢI an5.76:6.5-6.6 nên dùng lại nguyên văn; 3.1 cũng theo
  an5.76:6.4, chỉ thêm mở đầu `Evameva kho … idhekacco bhikkhu` mà Pāli bài này có.
  Tiền lệ đếm được: `1. Opammavagga` → 1. Phẩm Ví Dụ 9/10; `Sāvatthiyaṁ viharati` →
  Trú ở Sāvatthī. 70/130; `Dasamaṁ.` → Thứ mười 211/213;
  `ativelaṁ kulesu cārittaṁ` → sống quá lâu và quá thân mật trong gia tộc (an5.226);
  `sikkhaṁ paccakkhāya hīnāyāvattati` → từ bỏ sự tu học và quay về lối sống hạ
  liệt 7/23 (cách ngắn hơn của mn67 chỉ 3); `Maraṇañhetaṁ …` theo mn105;
  `saṅkiliṭṭhaṁ āpattiṁ` → tội ô nhiễm (an11.6, mn105);
  `Tasmātiha, bhikkhave, evaṁ sikkhitabbaṁ:` hòa 9-9 giữa an3.1 và sn20.7 — chọn
  theo sn20.7 vì cùng Phẩm Ví Dụ; `evañhi vo … sikkhitabban”ti.` →
  vì thế nên các ông cần phải học tập 7/17 (sn17.11);
  `evamāhaṁsu:` → nói như vầy theo đa số 22 (ud3.9).
  0 tiền lệ, đã ghi lý do: 0.3 `Biḷārasutta` chưa có tiền lệ; giữ tên Pāli `Biḷāra`
  theo sn20.12:2.4 đã dùng 'bài Biḷāra' trong cùng phẩm. `mudumūsi` dịch
  người mù (giữ vai trò người mù trong ví dụ, như Pāli); `sandhi` dịch chỗ khúc và
  `sandhisamalasaṅkaṭīre` là chỗ dễ bị tấn công về đêm (theo nghĩa, chưa có tiền lệ);
  `khādissāmī` → ăn cho đến nhừ (thì tương lai, giữ đúng sắc thái).
  `padīpeyyaṁ deti` chia 4 (cho đèn) với 3 (cho thức lót sàng) — chọn 'cho đèn'
  theo đa số 4 và vì `padīpeyya` là vật để thắp đèn.
  Ghi nhận bất định: `māyasmā` dịch 'Bạch' (xưng hô lịch sự, không phải 'Bạch Thế
  Tôn'); nháy kép mở ở 1.4, 1.7 và 2.1, đóng ở 1.4, 1.10 và 3.10 đúng như Pāli —
  2.2 vì vậy kết bằng `’ti.` chứ không phải `”ti.`. Bài không có `…pe…` nào.
  triangulation 8.3 chứ không cao hơn: ba khoá 1.7, 1.9, 1.10 lấp từ
  `english-project` cũng do chính tác giả này chấm, nên không phải một lần đọc Anh
  độc lập; `validate` sẽ cảnh báo khi tầng lấp và tầng Việt trùng `assessed_by`.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
