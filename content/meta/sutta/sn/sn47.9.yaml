notes: |-
  ĐỌC LẠI TỪNG CÂU TỪ PĀLI. Bản dịch có sẵn do phiên trước ghi, thiếu metadata; tôi đã đối
  chiếu 47/47 khoá với Pāli root đã ghim và sửa 8 khoá. Coverage English đo bằng đúng công
  thức `src/lib/canon/reference.ts`: 32 khoá Pāli có nội dung, **32/32 có chữ Anh = 100%**
  — 31 từ Sujato đã ghim, 1 từ tầng lấp `english-project` (`content/meta/en/sn/sn47.9.yaml`,
  trạng thái `published`). Không có tầng lấp thì coverage là 31/32 = **96,88%**.

  ⚠ TRIANGULATION KHÔNG ĐỘC LẬP Ở 1 KHOÁ. `assessed_by` của bản lấp `english-project` là
  "OpenCode Space Bunny Free (agent)" — **trùng đúng** với `assessed_by` của scorecard này.
  Theo `AGENTS.md` ("Không tự đánh bài của mình") thì khoá 4.7 đó không phải cách đọc Anh
  độc lập; `triangulation` đặt 8.8 cho một khoá. Khoá lấp ấy lại chép nguyên văn bản Anh đã
  ghim ở 4.5 của CHÍNH bài này, nên nó không thêm thông tin mới.

  SỬA 8 KHOÁ:
  2.5. **LỖI NGHĨA NẶNG NHẤT CỦA BÀI.** Bộ ba `phāsu` / `khamanīyaṁ` / `yāpanīyaṁ`
  (3.3–3.5) bị dịch thành "an ổn" / "chịu đựng" / "dễ chịu" — `yāpanīyaṁ` sai nghĩa và còn
  trùng nghĩa với `khamanīyaṁ` ngay khoá trước. Cặp `khamanīyaṁ yāpanīyaṁ` có tiền lệ rõ
  ở `sn46.14`, `sn46.15`, `sn47.29`, `sn47.30`, `sn55.3`: "dễ chịu … đủ sức". Sujato cũng tách
  rõ: "keeping well" / "getting by". Đã sửa 3.4 thành "sự dễ chịu", 3.5 thành "sự đủ sức".
  3.6. `disāpi me na pakkhāyanti` bị dịch "các phương hướng của con không nhận rõ được" —
  sai cả nghĩa lẫn chủ thể: `disā` là **bốn phương** (chứ không phải "phương hướng của con"),
  và `me na pakkhāyanti` là "không hiện ra đối với con". Sujato dịch "I was disorientated".
  Đã sửa thành "bốn phương cũng không hiện ra đối với con".
  1.4 và 1.6. `yathāsambhattaṁ` bị dịch "tùy nơi có chỗ dựa" — lấy nhầm nghĩa của `leṇa`/`aya`
  (45 chỗ "chỗ dựa" ngoài lát đều đúng nghĩa bám víu, không chỗ nào là `yathāsambhattaṁ`).
  `sambhatta` nói về **người** thuận hợp để ở cùng, và cả ba vế `yathāmittaṁ` /
  `yathāsandiṭṭhaṁ` / `yathāsambhattaṁ` đều chỉ về người. Đã sửa thành "tùy người nào thuận
  hợp".
  4.9. `mahallako` (già nua, mòn mỏi) bị dịch "đã xưa rồi" — sai nghĩa. Tiền lệ `an4.257`
  đúng bộ ba `jiṇṇo vuddho mahallako` dịch "già cả / cao tuổi / già nua". Đã sửa thành
  "đã già" (cho `jiṇṇo`) · "đã lớn tuổi" (`vuddho`) · "đã già nua" (`mahallako`), giữ ba tính
  từ Pāli tách bạch.
  1.11. 1.2 dịch `bhagavā` thành "Đức Phật" trong khi 17 chỗ còn lại của bài dùng "Đức Thế
  Tôn". Đã chuẩn hóa.

  ⚠ MỘT ĐIỂM CẦN NGƯỜI BIÊN TẬP BIẾT. Bản Anh đã ghim ở 3.3–3.5 gộp ba vế thành một câu
  ("it's fantastic that the Buddha is comfortable / keeping well / getting by"), tức bản Anh
  không tách rõ ba tính từ; tôi tách rõ nhờ tiền lệ `sn46.14`/`sn46.15`/`sn47.29`/`sn47.30`/
  `sn55.3` và nhờ Pāli. Đây là chỗ duy nhất trong bài tôi dựa vào bằng chứng ngoài bản Anh đã
  ghim.

  Thuật ngữ, kèm đếm: `attadīpā` → tự mình làm hòn đảo · `attasaraṇā` → tự mình làm nơi
  nương tựa · `sabbanavako`/`veḷuvagāmake` → giữ theo nguyên văn `sn47` đã có ·
  `yathāmittaṁ` → tùy nơi có bạn bè, `yathāsandiṭṭhaṁ` → tùy nơi có người quen biết ·
  `vassa` → an cư mùa mưa (29 lần "Trúc Lâm", 29 lần giữ `Veḷuva`) ·
  `kāyassa bhedā` → thân hoại mạng chung · `avihaññamāno` → không hề bị khổ não ·
  `vīriyena paṭipaṇāmetvā` → nén căn bệnh lại bằng tinh tấn · `veḷamissakena` → dây giông ·
  `sammādiṭṭhi`/`sammādhi` theo quy ước kho · `anussati` → nhớ tưởng · `veḷamissakena` chỉ
  có 2 chỗ trong lát này, 0 tiền lệ ngoài lát. 0.1 giữ `Saṁyutta Nikāya 47.9` theo 1673
  khoá `:0.1` đã có; 0.2 `Ambapālivagga` → "1. Phẩm Ambapālī" đúng 8 bài cùng phẩm
  (`sn47.1`–`sn47.8`).

  Dấu lược: 6.3 và 6.4 lược `vedanāsu` và `citte`; bộ bốn căn đã nêu đủ ở 6.2 và 6.5 trong
  cùng bài nên lược hợp lệ theo luật 10.2, mỗi khoá giữ đúng MỘT `…`.

