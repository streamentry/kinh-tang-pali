  “tức là quan hệ điều kiện cụ thể, duyên khởi” vì `idappaccayatā` và `paṭiccasamuppāda` là hai từ
  (mn26:19.4, mn85:43.4); giữ nguyên khoá 5.5, 5.2 (modal đổi “pháp” thành “Pháp” và dùng nháy đơn
  sai với Pāli; bài này viết “pháp” thường) và 1.2 (“chứng ngộ” đủ nghĩa `abhisambuddho`, “Thế
  Tôn” theo mạch bài).
