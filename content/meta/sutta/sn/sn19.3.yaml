  - >-
    **⚠ `sn19.2`–`sn19.6:0.2` — bản đầu tôi CHÉP NGUYÊN TIẾNG LA-TINH** `1.
    Paṭhamavagga` sang tiếng Việt, không dịch. Đã sửa thành *1. Phẩm Thứ Nhất*.
  - >-
    **⚠ `sn19.2`/`sn19.3:1.3` — bản đầu ghép nhầm ra câu *“Sà gây ra tiếng kinh
    khủng”*** (typo ghép từ). Đã sửa thành *Bà ấy*.
  - >-
    **⚠ `sn19.4` — tự mâu thuẫn về giới tính trong cùng một bài.** `1.1` là *một
    người đàn ông* (`nicchaviṁ purisaṁ`) nhưng `1.2` tôi dùng chung *“Bà ấy”*
    với `sn19.2`/`13`/`14`; sửa thành *“Người ấy”* — **kể cả tân ngữ** ở cuối,
    vì chỉ đổi chủ ngữ thì câu vẫn tự mâu thuẫn. `Tamenaṁ` không mang giống, nên
    cả hai cách xưng đều hợp Pāli; tôi chọn theo chủ thể đã nêu ở `1.1`.
  - >-
    **⚠ `sn19.15:1.1` — bản đầu tôi dịch thành hai người.** Pāli mô tả **một**
    người nữ bằng ba vế (`itthiṁ uppakkaṁ okilinīṁ okiriniṁ` — trang điểm, xoa
    phấn, phủ bụi); bản đầu ra *“một người nữ trang điểm, **một phụ nữ** phủ
    bụi”*, đọc ra là hai. Đã sửa.
  - >-
    **`anupatitvā anupatitvā` tôi gộp thành một động từ** (“bay xuống”) ở sáu
    bài có cảnh chim. Đây là nhân đôi tu từ để nhấn; tiếng Việt không cần hai
    chữ *“tới tới”* (đọc rất máy). Mất nhấn, không mất nghĩa — ghi lại để không
    ai tưởng là sót.
  - >-
    Thuật ngữ 0 tiền lệ, đặt mới: `nicchavi` → *bị khuyết xác* · `vehāsa` →
    *rừng* (khác `an3.64:10.4` dùng *hư không* cho `vehāsaṁ` theo nghĩa *bay
    giữa không trung*; đây là nghĩa *rừng*, nên dịch khác và ghi rõ) ·
    `maṁsapesi` → *nước xay thịt* · `maṁsapiṇḍa` → *bánh thịt* · `goghātaka` →
    *người nấu thịt chó* (`dhp235:0.4` có *con người giết bò* cho
    `Goghātakaputtavatthu`, khác chữ) · `sākuṇiko` → *người bán thịt chó* ·
    `orabbhiko` → *người mổ lợn* · `sūkariko` → *người nuôi lợn rừng* ·
    `māgaviko` → *con gấu* · `asī`/`satti` → *lông* / *lông mũi* ·
    `okilinī`/`okirini` → *xoa phấn* / *phủ bụi* · `aṭṭassaraṁ karoti` → *gây ra
    tiếng kinh khủng* · `ikkhaṇikā` → *nữ khiêng nài* · `sapattiṁ … okiri` → *vẽ
    vết cháy lên* · `pāpabhikkhu` → *tỳ-kheo bất thiện*.
  - >-
    `sn19.17:1.2` — bốn vế `āditta sampajjalita sajotibhūta` lặp y hệt nhau
    trong Pāli; tôi dịch *bị cháy đen, cháy âm ỉ, thành màu đen* cho cả bốn.
    `kassapassa sammāsambuddhassa` → *bậc Chánh Đẳng Giác Kassapa* — đây là một
    vị Phật trong 32 vị, **không** phải Đức Phật Ca-diếp của truyện Ā-jī-va-ka.
