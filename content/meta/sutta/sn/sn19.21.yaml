notes:
  - >-
    Tên bài `Pāpasāmaṇerīsutta` → *Kinh Sa-di Nữ Bất Thiện*, theo đúng `sn19.20:0.3` *Kinh Sa-di Bất Thiện* (`Pāpasāmaṇerasutta`). Tên phẩm `Dutiyavagga` → *2. Phẩm Thứ Hai* khớp Pāli với `sn11.11:0.2` và `sn19.13/17/18/19/20:0.2` (6 tiền lệ).
  - >-
    **6 khoá có Pāli trùng nguyên văn và dùng lại nguyên văn** (đo bằng script, đã loại lát này khỏi chỉ mục): `0.2` (tên phẩm) · `1.5` ← `mn81:9.6` (`‘acchariyaṁ vata bho, abbhutaṁ vata bho.`) · `2.1` ← `dn16:3.51.2` (`Atha kho bhagavā bhikkhū āmantesi:`) · `2.10` ← `an10.111:2.5` (*Thứ mười một.*) · `2.11` ← `sn11.20:9.5` (*Phẩm Thứ Hai là phẩm thứ hai.*, 7 tiền lệ) · `3.0` (`Tóm lược:`, 167 lần trong SN). `1.2` lấy từ `sn19.17:1.2` — cùng Pāli nhưng **không** trùng byte vì đổi `vị ấy` thành `bà ấy` cho đúng nữ tính.
  - >-
    Công thức đã có tiền lệ, dùng lại: `gijjhakūṭā pabbatā` → *núi Gijjhakūṭa* · `vehāsaṁ gacchantiṁ` → *đang bay trên hư không* (`sn19.18:1.1`, `sn19.20:1.1`; lưu ý `sn19.13/14/15/16` dịch *đang đi vào rừng* — ít phổ biến hơn, và `Sumāgadhā` không phải rừng) · `sudaṁ aṭṭassaraṁ karoti` → *gây ra tiếng kinh khủng* (`sn19.13/14/16`) · `kassapassa sammāsambuddhassa pāvacane` → *trong hàng giảng pháp của bậc Chánh Đẳng Giác Kassapa* (`sn19.17:1.4`) · `vipākāvasesena` → *tàn dư quả báo của chính nghiệp ấy* (`sn3.20:4.2`). `Tassā saṅghāṭipi ādittā …` ở `1.2` lấy từ `sn19.17:1.2` (cùng Pāli, đổi `vị ấy` thành `bà ấy`).
  - >-
    Bất định đã ghi: (a) `1.6–1.8` là cụm `Evarūpopi nāma … bhavissati` — `satto` dịch *một loài hồn*, `yakkha` dịch *Dạ-xoa* (đa số SN: `sn10.*` 64 lần), `attabhāvapaṭilābho` dịch *sự đạt được cá thể* (tiền lệ `mn114:11.6`). Cả ba thuật ngữ ở đây không có bản Anh: Sujato để trống `1.6–1.8`. Ba cách đọc khác đều khả năng (*người* / *chúng sinh* / *linh hồn* cho `satto`); người biên tập nên thống nhất với `sn19.*` khác. (b) `2.4` chỉ có `Pubbeva me sā … diṭṭhā ahosi.` — Sujato thêm *but I did not speak of it*, nhưng câu đó là `2.5` (`Api cāhaṁ na byākāsiṁ`), nên **không** gộp vào `2.4`. (c) `3.0–3.6` là uddāna phẩm hai, dịch theo cách của `sn19.10:2.1–2.6` là giữ cấu trúc câu `… ahu …` và **không** thêm tên riêng chưa có ở Pāli: `pāradāriko` → *kẻ trộm trong hang vua* (`sn19.11:1.4`) · `duṭṭhabrāhmaṇo` → *Bà-la-môn khốn khổ* (`sn19.12:1.2`) · `ikkhaṇitthikā` → *nữ khiêng nài* (`sn19.14:1.4`) · `sapattaṅgārokiri` → *quệt tro ong lửa lên mặt đất* (`sn19.15:1.4`) · `coraghātako` → *kẻ cướp giết người* (`sn19.16:1.5`). Uddāna `4.1–4.5` cũng không có Anh; `Lakkhaṇasaṁyuttaṁ samattaṁ` → *Tương Ưng Dấu Hiệu đã hoàn tất* theo `lakkhana` = *dấu hiệu* (192 lần) và mẫu `Tương Ưng X đã hoàn tất` của tầng.
  - >-
    Cấu trúc nháy kép: `1.4` mở → `1.8` đóng; `2.2` mở → `2.6` đóng; `2.7` mở → `2.16` đóng; `3.3` mở → `3.5` đóng. Cân trên toàn bài 34 khoá.
  - >-
    Quy tắc dấu lược của BRIEF_VI3 §10: mọi khoá Pāli có `…pe…` hoặc `…` đều giữ **đúng một** `…`, không mở rộng; không khoá nào nén bằng `…` cả khi Pāli viết đủ. Đã đếm từng khoá. Coverage Anh đo được: 11/11 = 100% (nhưng 4 khoá uddāna ngắn nằm ngoài mẫu số)
  - >-
    Tầng `vietnamese-current` vắng: tại commit đã ghim, bilara chỉ có Pháp Cú cho tiếng Việt, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Ba tầng tham khảo còn lại là Pāli root (authority) + `english-sujato` đã ghim + `english-project` (lớp lấp của chính dự án, chỉ tính khi `published`).
  - >-
    Bốn cổng kỹ thuật của AGENTS.md: `npm run validate`, `npm test`, `npm run check` và `npm run build`. **Agent lát này KHÔNG chạy bốn lệnh đó** — BRIEF_VI3 §7 và lệnh của người điều phối cấm chạy `npm run validate|test|build|check`. Những gì đã chạy và xanh: `_hvi.py` (`save_vi` → `kiểm`) cho cả 9 bài — đủ khoá trong `all`, không thừa, NFC, không trùng nguyên văn Pāli (trừ 0.1 theo quy ước), không Pāli lọt, số dấu lược khớp từng khoá, nháy kép cân trên cả bài; quét lại 306 khoá bằng script độc lập; `notes` và `blocking_errors` parse sạch bằng thư viện `yaml` của kho. Cổng thật còn lại là CI (`.github/workflows/ci.yml`), nên `technical_integrity` chỉ 9.6 chứ không 10.
