notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato (34/35 khoá có chữ). Coverage English = 13/13 khoá Pāli có nội dung = 100%.
  0.1 giữ `Saṁyutta Nikāya 18.1`; 0.2 theo tiền lệ 99 lần; 0.3 `Cakkhusutta` theo đa số 4 lần (Kinh Mắt).
  Sáu câu hỏi về sáu căn lặp nguyên văn trong Pāli; dịch cả sáu theo MỘT cách (thường còn hay là vô thường) thay vì bê từng tiền lệ rời rạc — tiền lệ có trộn lẫn thường còn/thường và cả ba biến thể của 4.1.
  `…pe…` ở 3.2 và 4.1 giữ đúng MỘT dấu lược; 4.1 có 5 chỗ lược (một `…pe…` bốn `…`) nên bản Việt cũng phải có 5.
  BẤT ĐỊNH nhỏ: 2.6 và 3.13 `kallaṁ nu taṁ samanupassituṁ` là câu hỏi (`nu`); tiền lệ đa số (2 lần) bỏ dấu hỏi, còn hai tiền lệ khác giữ. Giữ câu hỏi vì Pāli hỏi và Sujato cũng hỏi.
  1.4 dùng lại nguyên văn tiền lệ 4 lần; 2.3, 2.5, 2.8, 4.1, 4.2, 4.3, 4.4, 4.5 đều có tiền lệ trùng Pāli và dùng lại.
