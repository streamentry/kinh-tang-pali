notes: |-
  **Nguồn.** Pāli root từ snapshot bilara đã ghim `11c9d708978cde8ba61096d8a75f7ddfb846f639`,
  đường dẫn `root/pli/ms/sutta/sn/sn45/sn45.8_root-pli-ms.json`. Bản Anh tham khảo là
  Bhikkhu Sujato cùng commit (`translation/en/sujato`), có 44 khoá, 43 khoá có chữ.
  `translation/vi/phantuananh/` tại commit đã ghim chỉ chứa Pháp Cú, nên KHÔNG có bản Hòa
  thượng Thích Minh Châu cho bài này — `triangulation` vì thế không nâng lên.
  Coverage đo theo đúng định nghĩa `source/layers.yaml` (Pāli ≥ 40 ký tự, loại khối `:0`):
  **25/25 khoá có nội dung đều có Anh ⇒ 1.00**, trên ngưỡng 0.8, nên không cần entry trong
  `content/meta/reference-gaps.yaml` và không có blocker.

  **Ba mệnh đề về tên — tôi đo lại, không dùng số được đưa.** (1) `sn:0.1`: trong 1.725 tệp
  `sn`, **1.637 tệp có giá trị `:0.1` đều viết `Saṁyutta Nikāya N.N`, 0 tệp nào viết
  `Saṡyutta`**; 15 tệp còn lại là uid-gộp (`sn45.104-108`…) vốn không có khoá `:0.1`.
  Chữ `ṁ` trong `:0.1` của tôi đã kiểm bằng mã điểm: U+1E41, không phải U+1E61; cả chuỗi
  NFC. (2) `ja:0.1`: 433 tệp → `Jātaka` 407, `Chuyện Tiền Thân` 16, không có 10 ⇒ giữ
  `Jātaka`. (3) `cp:0.1`: 20 tệp → **17** dịch `Cariyāpiṭaka` thành *Hạnh Tạng*, **1**
  (`cp34`) giữ nguyên Pāli, 2 không có. Đúng như đoán đoán ban đầu: ngoại lệ lạt là `cp34`,
  không phải số đông. Lát này (cp11, cp23, cp30) theo *Hạnh Tạng*.

  **Pāli trùng nguyên văn: 25/44 khoá.** Tôi dựng index Pāli của toàn tầng Việt rồi đối chiếu
  từng khoá, và chỉ tính cặp trùng khi khoá Pāli thực sự thuộc bài ấy — đo được `pal()` của
  `_hvi.py` có lúc trả về tệp của bài khác, làm một lần quét đầu ra **56 cặp ở `an2.*` là
  sai thật**. Dùng lại nguyên văn bản Việt đã có ở: `0.2` (8 bài, toàn bộ *1. Phẩm Vô Minh*),
  `0.3` (1 bài, *Kinh Phân Tích* = `sn47.40:0.3`), `1.1` (430 bài; chọn *Tại Sāvatthī.* vì
  `sn45.6/45.7/45.9/45.10:1.1` — bốn người kề cùng phẩm — dùng đúng câu này), `1.3`,
  `1.4`, `1.5`, `2.2`, `8.5`, `9.5`, `10.2`, `10.3`, `10.5`, `10.7`.

  **Ba chỗ tôi cố ý KHÔNG dùng lại nguyên văn, và lý do** — luật là *trùng thì khớp*, nhưng
  bản tham chiếu sai thì phải sửa, và bản tham chiếu đúng thì cái sai nằm ở chỗ khác:
  (1) `9.2`–`9.4`: có bản Việt đã ghi *"Ở đây, này các tỳ-kheo, vị tỳ-kheo **khi** sống quán…"*
  cho đúng ba khoá này. Ở `sn45.8` thì mệnh đề dẫn `Idha, bhikkhave, bhikkhu` đã nằm hết ở
  `9.2`, và `9.3`–`9.5` chỉ là phần lặp lại của công thức; chép cả "Ở đây, này các tỳ-kheo,
  vị tỳ-kheo" vào sẽ thêm chữ không có ở Pāli. Tôi giữ `9.3`–`9.5` chỉ phần lặp, còn `9.5`
  vốn đã trùng tuyệt đối với một bài nên vẫn khớp từng chữ.
  (2) `10.4`: Pāli khác `sn48.10:4.5` và `sn53.1-12:1.7` chỉ ở dấu phẩy và dấu nháy, nên không
  ràng buộc; tôi theo *thiền thứ ba* cho khớp với `10.2`–`10.3` ngay trên.
  (3) `1.4`: 63 bài đã dịch cùng Pāli này nhưng có **30** cách Việt khác nhau
  (*Thưa vâng* 11, *Dạ vâng* 6, *Vâng* 5…), và `sn45.1:1.5` còn viết *"các tỳ-kheo ấy đáp lời
  Đức Thế Tôn"* cho cùng cấu trúc. Không có đa số đủ rõ để ép; tôi giữ dạng *Dạ vâng,
  bạch Thế Tôn* vì đó là dạng dùng nhiều nhất trong chính phần `sn45` đã có, và ghi ở đây để
  người điều phối gộp thay vì tự sửa lẻ.

  **Dấu lược.** Pāli có `…pe…` ở đúng ba khoá (`2.2`, `8.3`, `8.4`); mỗi khoá giữ **đúng một**
  `…`, không mở rộng. `2.2` là chỗ dễ sai nhất: bản Anh đã ghim liệt kê đủ tám yếp (right
  view … right immersion), nhưng Pāli lược, và **9/18** bản Việt đã có cho đúng Pāli ấy đang
  viết đủ tám yếp — đó là thêm chữ không đánh dấu, tôi không theo. Ngược chiều, tôi cũng KHÔNG
  nén `adukkhamasukhaṁ upekkhāsatipārisuddhiṁ` ở `10.5`: viết đủ *không khổ không lạc, xả niệm
  thanh tịnh*.

  **Nháy kép bám Pāli từng khoá.** `1.2` mở, `1.3` đóng, `1.4` mở và đóng ngay trong một khoá,
  `2.1` mở và `10.6` đóng. Các khoá `3.1`–`10.1` Pāli không có ngoặc thì bản Việt cũng không
  mở. Ở `10.4` dùng nháy cong `‘…’` vì Pāli cũng dùng `‘…’ti`.

  **Bất nhất trong chính phẩm sn45, ngoài lát của tôi, giao người điều phối.** (1) Đánh số
  thiền trong bài này không thống nhất: `10.2`–`10.4` dùng *thiền thứ nhất / thứ hai / thứ ba*,
  còn `10.5` dùng **tứ thiền** — vì Pāli `10.5` trùng nguyên văn `sn48.10:4.6`, tôi buộc phải
  dùng lại nguyên văn đó. `sn53.1-12:1.8` có cùng câu ấy (khác duy nhất dấu chấm cuối thay
  `—`) và đang viết *thiền thứ tư*; `sn48.10` lại dùng *nhị thiền / tam thiền / tứ thiền* cho
  cả bốn. Đây là xung đột ở tầng, không phải ở lát, nên tôi ghi ra chứ không sửa.
  (2) `sn45.7:3.6` (cùng phẩm, cùng công thức *Chính … này là con đường*) dùng *Thánh đạo tám
  ngành*, còn tôi dùng *bát chánh đạo* theo đa số trong chính sn45. (3) `sn45.7:3.6` còn là
  bản dịch viết bởi *Kinh Tạng Pāli Project*; tệp này ghi *OpenCode Space Bunny Free (agent)*
  theo mẫu BRIFF_VI.md.

  **Cổng kỹ thuật.** Agent dịch không được chạy lệnh npm, nên `npm run validate`/`test`/
  `check`/`build` là việc của coordinator. Tôi tự kiểm: JSON hợp lệ, đủ 44/44 khoá trong
  `all`, không orphan, mọi giá trị NFC, số dấu lược khớp từng khoá, không `(…)` đứng một mình,
  ngoặc kép cân trên cả bài, không Pāli lọt, không khoá nào trùng nguyên văn Pāli, và thứ tự
  khoá viết **đúng thứ tự số** (`0.1, 0.2, 0.3, 1.1 … 2.1 … 10.7`) như 4.870 tệp khác của tầng,
  vì `_ghi` của `_hvi.py` dùng `sorted()` theo chữ cho tệp mới (đặt `10.1` trước `2.1`).