  - >-
    **⚠ `ariyaṁ aṭṭhaṅgikaṁ maggaṁ`: ba cách dịch cạnh tranh trong kho, tôi chọn
    theo cùng chương.** `an3.61:17.2` dùng *bát thánh đạo*, `sn3.18:4.4` dùng
    *Thánh đạo Tám ngành*, còn `sn45.163:1.5` (đã `published`) dùng *bát chánh
    đạo*. Với **bốn bài `sn45.*`** của loạt này (`sn45.33`, `sn45.49`,
    `sn45.140`, `sn45.152`) tôi theo *bát chánh đạo* — **cùng chương thắng tiền
    lệ toàn kho** — và **ghi lại để người biên tập quyết**.
  - >-
    **⚠ `pabbhāro`: chỗ này tôi sửa một lỗi của bản đã `published`, và không sửa
    bản đó.** `pabbhāra` = *bãi bồn, xoáy nước* (PED: a sand-bank, shoal, eddy)
    — **không phải *dòng nước***; dòng nước là `ninna` (`pācīnaninno` → *trôi về
    phía đông / có xu hướng về phía Niết-bàn*). PR #124 đã viết `sn45.103:1.2`
    (đã `published`) làm *có xu hướng về phía Niết-bàn, có bến về phía Niết-bàn,
    **có dòng** về phía Niết-bàn* — tức vế thứ ba **lặp nghĩa** vế thứ nhất và
    làm rơi `pabbhāro`. Ở `sn45.152:1.1` tôi dùng *có bãi bồn về phía đông* và ở
    `sn45.152:1.4`/`1.5`/`1.7` dùng *có bãi bồn về phía Niết-bàn*. **Đây là lệch
    có chủ đích, đã ghi, không phải tôi âm thầm viết lại bản đã xuất bản**;
    người biên tập xem có muốn vá `sn45.103` và các bài `sn45.92-96`, `sn45.151`
    đã publish với cùng lỗi không. ⚠ **Đã đảo hướng trong mục này:** `pācīna` là **đông** — các câu *phía tây* ở trên là bản nháp cũ của lớp lỗi đã lan từ PR #124, và lớp lỗi đó đã được đảo ở 11 tệp cùng họ (xem mục `pācīna` của `sn45.103`). Đo lại toàn tầng: 95 khoá Pāli có `pācīn`, **không** khoá dịch nào ghi *tây* — nên đợt này chỉ sửa hồ sơ, không đụng bản dịch.
  - >-
    **Ghi chú về `Duppañño eḷamūgo` (`sn46.44`).** `eḷa` = con rắn lượn (`mūga`
    = mù), `eḷamūga` là loài rắn theo truyền thuyết **không có mắt**, đánh bất
    cứ thứ gì nó chạm vào mà không thấy. Cả cụm là ẩn dụ cho bảy giác chi
    **chưa** được tu tập. Tôi dịch *kẻ kém tuệ, kẻ mù lóa* — giữ nghĩa chính của
    `duppañña` (kém tuệ) và `eḷamūga` (mù), **không** chép ẩn dụ con rắn vào
    kinh. Sujato dịch *witless, idiot* và cũng bỏ ẩn dụ rắn. Nếu người biên tập
    muốn giữ ẩn dụ thì phải đưa vào lớp bình chú giải, **không** đưa vào thân
    kinh.
  - >-
    **Ghi chú về kho: `Bhadante` đang dịch hai kiểu.** Tôi đếm được **846**
    segment bắt đầu *Bạch Thế Tôn* và **21** segment *Bạch Đức Thế Tôn* trong
    phần đã publish — lời gọi này không phải thứ gì dịch theo nguyên tắc mà là
    quy ước đọc. Trong lát này tôi theo **đa số** (*Bạch Thế Tôn*) và **không**
    sửa 21 segment kia; ghi ở đây để người biên tập thống nhất.
