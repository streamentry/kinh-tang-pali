    lúc*, tôi dịch mất vị từ thời gian; (9) `sn32.53:1.6` — `sakāya ratiyā` là
    *hưởng thụ niềm vui*, tôi viết *đi săn bằng sức mình* — sai nghĩa; (10)
    `sn45.33:1.2`/`1.3`/`1.6`/`1.7` — Pāli là **định nghĩa** (`Yesaṁ kesañci …
