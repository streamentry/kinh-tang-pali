  - >-
    **⚠ `pabbhāro`: chỗ này tôi sửa một lỗi của bản đã `published`, và không sửa
    bản đó.** `pabbhāra` = *bãi bồn, xoáy nước* (PED: a sand-bank, shoal, eddy)
    — **không phải *dòng nước***; dòng nước là `ninna` (`pācīnaninno` → *trôi về
    phía đông / có xu hướng về phía Niết-bàn*). PR #124 đã viết `sn45.103:1.2`
    (đã `published`) làm *có xu hướng về phía Niết-bàn, có bến về phía Niết-bàn,
    **có dòng** về phía Niết-bàn* — tức vế thứ ba **lặp nghĩa** vế thứ nhất và
    làm rơi `pabbhāro`. Ở `sn45.152:1.1` tôi dùng *có bãi bồn về phía đông* và ở
    `sn45.152:1.4`/`1.5`/`1.7` dùng *có bãi bồn về phía Niết-bàn*. **Đây là lệch
    có chủ đích, đã ghi, không phải tôi âm thầm viết lại bản đã xuất bản**;
    người biên tập xem có muốn vá `sn45.103` và các bài `sn45.92-96`, `sn45.151`
    đã publish với cùng lỗi không. ⚠ **Đã đảo hướng trong mục này:** `pācīna` là **đông** — các câu *phía tây* ở trên là bản nháp cũ của lớp lỗi đã lan từ PR #124, và lớp lỗi đó đã được đảo ở 11 tệp cùng họ (xem mục `pācīna` của `sn45.103`). Đo lại toàn tầng: 95 khoá Pāli có `pācīn`, **không** khoá dịch nào ghi *tây* — nên đợt này chỉ sửa hồ sơ, không đụng bản dịch.
  - >-
    **Bốn bài bát chánh đạo, bốn gốc khác nhau**: `sn45.33` = *bỏ lỡ*
    (`viraddho` / `āraddho`, danh sách bát chánh đạo lược giữa), `sn45.49` =
    *thân thiết lành mạnh* (nhóm bốn vế **rāgavinaya**), `sn45.140` = *bàn chân
    voi* (nhóm **viveka**), `sn45.152` = *cây* (nhóm **viveka**).
    `sn45.152:1.1`–`1.3` là ẩn dụ cây trôi về phía đông theo **ba** phía:
    `pācīnaninno` = *trôi về phía đông*, `pācīnapoṇo` = *có bến về phía đông*,
    `pācīnapabbhāro` = *có bãi bồn về phía đông* (xem ghi chú `pabbhāro` — bản
    `sn45.103` đã publish sai vế này). ⚠ **Đã đảo hướng trong mục này:** `pācīna` là **đông** — các câu *phía tây* ở trên là bản nháp cũ của lớp lỗi đã lan từ PR #124, và lớp lỗi đó đã được đảo ở 11 tệp cùng họ (xem mục `pācīna` của `sn45.103`). Đo lại toàn tầng: 95 khoá Pāli có `pācīn`, **không** khoá dịch nào ghi *tây* — nên đợt này chỉ sửa hồ sơ, không đụng bản dịch.
  - >-
    `sn45.33:1.2`/`1.3`/`1.6`/`1.7` — Pāli là công thức định nghĩa (`Yesaṁ
    kesañci … viraddho`), **không** có chủ thể `tesaṁ` mang nghĩa “của họ” như
    một vế riêng; bản đầu tôi thêm *thì vị ấy*, đã sửa thành *bất cứ ai … thì
    người ấy cũng …*.
