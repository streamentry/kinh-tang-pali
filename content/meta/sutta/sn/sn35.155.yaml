  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `15. Navapurāṇavagga` → «15. Phẩm Cũ Mới». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.3 — bỏ dấu chấm thừa sau `?”` (Pāli kết `”ti?`); giữ nguyên lời Việt “Đến mức độ nào, bạch Thế Tôn, thì được gọi là bậc thuyết pháp?” vì bám sát `Kittāvatā nu kho … hoti` và nhất quán với “bậc thuyết pháp” ở 1.2 (khác bản `sn12.16:1.4` “Người giảng pháp được gọi là đến mức nào”, vốn đảo trật tự Pāli).
