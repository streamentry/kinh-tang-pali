    Nguyên nhân là tôi cố phân biệt `aniccaṁ` (danh từ số ít, sau *cái nào là*)
    với `aniccā` (tính từ số nhiều, sau *Sắc,*) — nhưng tiếng Việt dịch cả hai
    giống nhau, nên **một** hằng chuỗi là đủ. Đã sửa và ghi lại trong mã để
    không tái lập. ⚠ (2) **Vị ngữ đặt sai thứ tự** — `sn22.130:2.1`/`2.5` và
