    Pāli (`sutavā ariyasāvako … yathābhūtaṁ pajānāti`). (3) **Chữ dính liền** —
    `sn22.30:1.2`/`1.7` ra *… của sắcsự sinh ấy là…*; Pāli không có dấu phẩy
