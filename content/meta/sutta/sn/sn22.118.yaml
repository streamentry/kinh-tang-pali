    **Bất định có nghĩa đáng kể, đã phân xử và ghi lại:** (1) `vijjā` ở
    `sn22.130` — nghĩa thông thường là *tri kiến*, nhưng ở đây Pāli đặt nó cạnh
    `assāda`/`ādīnava`/`nissaraṇa` và bài kế là `Samudayasutta` (về `avijjā`),
    nên tôi dịch *sự đáng ưa* cho khớp ngữ cảnh; **người biên tập nên kiểm** vì
    `vijjā` cũng có thể là bản chữ sai của `vijjñā`. (2) `ubhayenevāyaṁ`-ngoại
    hình: `tatra vo chando pahātabbo` — `tatra vo` là `tatara vo` (cách gọi thân
    mật), tôi dịch *ở đó, này các tỳ-kheo* thay vì dịch nghĩa chữ. (3)
    `anissaraṇadassino`-ngoại hình: `kuto sukhaṁ bhavissati` là câu hỏi **gián
    tiếp** không có dấu hỏi; tôi dịch thành *… sẽ lấy đâu ra.* dùng dấu chấm, vì
    thêm `?` sẽ lệch với Pāli. (4) `anatthāyā’ti` ở `sn22.19/20:1.12` — xem
    PĀ_LỖI (1). (5) `Kukkuḷavagga` có hai tiền lệ khác nhau trong cùng cuốn; xem
    NOTE_CHAP.
  - >-
    **Bẫy đã tránh trong lát này:** (a) **Không truyền tuple vào ô mà hàm in ra
    JSON** — đây là biến thể mới của lỗi đã gặp ở lát 16A (truyền chuỗi rồi
    index). Quy tắc: ô tham số của hàm dịch chỉ nhận **chuỗi**, và chỗ nào thật
    sự cần hai biến thể thì truyền **hai tham số có tên**. (b) **Dấu phẩy tiếng
    Việt không phải dấu phẩy Pāli** — Pāli liệt kê ba mệnh đề không dấu phẩy,
    tiếng Việt không có dấu phẩy thì dính thành một từ; nhưng ở chỗ Pāli **đã
    lược** thì thêm dấu phẩy là thừa. (c) **Câu ẩn dụ không lặp nguyên văn hai
    lần** — chép lại danh sách năm loại cây cỏ ở `sn22.93:1.4` làm câu không đọc
    được; Pāli ở chỗ đó dùng phép rút gọn (`uttarā vā tīre`). (d) **Sáu bài cùng
    hàm** — `sn22.137`–`139` và `143`–`145` chỉ khác ở *vô thường/vô ngã* × *ham
    muốn/ham muốn/ham muốn ghép*; tôi dùng **một hàm** và truyền ba tham số có
    tên. (e) **Cặp `ĐUOI`/`ĐUOI_P`** — Pāli khác nhau ở dấu phẩy giữa các mệnh
    đề đệ quy, nên phải có hai hằng chứ không được chung một cách rồi bịa dấu
    câu.
  - >-
    **19 khoá**; bản **hỏi chiều** của `sn22.119`: các người bị hỏi *đây là của
    tôi* thì trả lời *không*, bản kia hỏi *đây không phải của tôi* thì trả lời
    *vâng*. Nhưng **phần trả lời của Đức Thế Tôn thì giống hệt nhau** ở cả hai
    bài, nên tôi dùng **một hàm** — cùng Pāli thì phải cùng bản dịch. `1.13` bị
    lược (bản kia thì không), nên `1.14` dịch khác: *Thấy như vậy* so với *Như
    vậy*.
