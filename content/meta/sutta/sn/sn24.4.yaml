notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở những chỗ có tiếng Anh. Tầng `vietnamese-current` không có cho bài này.
  Bài thuộc loại peyyāla lặp nguyên văn trong `sn24`; toàn bộ khung **dùng lại nguyên văn** của các bài đã có, không dịch lại: **35** khoá Pāli trùng nguyên văn, **32** dùng lại y nguyên văn — nguồn chính `sn24.1:5.1` và `sn24.3:4.1` (2 khoá cho `4.1`), `sn24.2` (toàn khung 1.2–2.3 và 4.1–4.2), `sn22.153`, `sn24.9`, `sn24.10`, `sn24.36`, `sn24.37`, `sn24.45`. Tổng lát c37: 127 cặp trùng Pāli, 121 dùng lại nguyên văn.
  Bốn chỗ không dịch lại được mà phải tự viết, và mỗi chỗ đều dựa trên chính tiền lệ của nó: `api nu taṁ anupādāya evaṁ diṭṭhi uppajjeyya:` (3.4, 3.12, 3.17) → *lẽ nào cái chịu biến hoại ấy mà không chấp thủ thì ý kiến như sau vẫn khởi lên:* (nguyên văn 2 khoá) · `3.15` *Cái gì được thấy, được nghe, được cảm nhận, được biết, được đạt tới, được tìm cầu, được suy xét bằng tâm…* (nguyên văn 2 khoá) · `4.2` *vị này được gọi là… nhập lưu, không rơi vào ác đạo, chắc chắn, hướng về giác ngộ* (nguyên văn 2 khoá).
  0 tiền lệ, đặt mới, ghi kèm lý do: `Nocamesiyāsutta` → *Kinh Có Thể Không Phải Của Ta* (tiền lệ `sn22.153:0.3` với đúng Pāli này; Sujato dịch *It Might Not Be Mine*).
  Dấu lược: Pāli có `…pe…` ở **năm** khoá (`1.4`, `3.3`, `3.11`, `3.16`, `4.1`) và `…` trần ở sáu khoá (`2.3`, `2.4`, `2.5`, `3.7`, `3.8`, `3.9`); mỗi khoá Việt giữ **đúng một** `…`, không mở rộng. Ở `3.3`, `3.11`, `3.16` dấu lược đứng ngay sau *Vô thường, bạch Thế Tôn* đúng như Pāli, vì `…pe…` ở đây là mô phỏng *yadaniccaṁ taṁ dukkhaṁ vipariṇāmadhammaṁ* của bài kế tiếp trong cùng phẩm — bản dịch không bung nội dung ấy ra, chỉ giữ dấu lược.
  Bất định đã ghi nhận: câu hỏi `api nu taṁ anupādāya…` nối `taṁ` về `aniccaṁ`/`vipariṇāmadhammaṁ`, mà ở bài này cả hai đều nằm TRONG `…pe…`; bản dịch dùng lại đúng công thức đã có nên không phải đoán bừa, nhưng người đọc không thấy mối nối ấy — đây là lý do `ambiguity_integrity` không vượt 9,2.
  `notes` ở đây là khối literal `|-` thụt 2 đặt ở GỐC file, đúng như `content/meta/sutta/sn/sn24.45.yaml` (đã đọc mẫu đích trước khi ghi).
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy — lát agent này không chạy bốn lệnh đó, nên `technical_integrity` đặt 9.6 chứ không 10.0. Tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài.
