notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt Hòa thượng Thích Minh Châu nguyên bài (SuttaCentral, `16.7. Giáo Giới (2)`) làm tham khảo toàn văn; tầng `vietnamese-current` không có bản phân đoạn cho bài này.
  COVERAGE ENGLISH, mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 46. Sujato phủ **32/46 = 0,696**, dưới ngưỡng 0,80; 14 khoá bị Sujato để trống (liệt kê ở blocker). Lớp `english-project` (đã published) điền đủ 14 khoá ấy nên cổng tính 46/46 = 1,000, nhưng lớp lấp cùng một tác giả với bản Việt nên **không độc lập**; vì vậy `triangulation` đặt 7,0 và bài giữ `draft` cho đến khi người biên tập phán định coverage. Ở 32 khoá có Sujato, `kodhano`/`upanāhī` (4.6/4.7) được dịch "irritable"/"acrimonious" và `akkodhano`/`anupanāhī` (7.6/7.7) "loving"/"kind"; ở các chỗ này tôi bám Pāli (`kodhano` giận dữ; `upanāhī` oán hận; `akkodhano`/`anupanāhī` là dạng phủ định của hai từ đó), không bám Sujato.
  Pāli trùng nguyên văn: trong chính bài có 19 cặp, 0 cặp Việt khác nhau (`3.3=8.3=9.4`, `3.4=8.4=9.5`, `3.5=8.5=9.6`, `8.6=9.7`, `6.6=10.5=11.5`, `6.4=10.3=11.3`, `6.5=10.4=11.4`...). So với các bài khác: 310 cặp Pāli trùng, 302 cặp dùng lại nguyên văn bản dịch; 8 cặp Việt khác nằm ở hai chỗ có chủ ý: `12.3` `ottappī …` (an8.23 dịch *cẩn trọng* trong danh sách tám đức khác; bài này theo cặp `hirimā`/`ottappī` = *biết hổ thẹn*/*biết kính sợ* của an10.68 và sn37) và `12.9` `Sattamaṁ.` (*Thứ bảy.* 121 khoá, *Bài thứ bảy.* 3, *Kinh thứ bảy.* 1).
  Dùng lại từ bài anh em: `1.4` `1.5` `1.6` `1.7` và `0.2` lấy nguyên văn từ sn16.6/sn16.8; `2.1` theo sn16.6:2.1 (*đầy đủ các pháp làm cho khó khuyên dạy*) khác ở dấu đóng ngoặc vì Pāli bài này không đóng; `1.1` theo mẫu Pāli y hệt (3/4 tiền lệ: *Trú ở Rājagaha, tại Rừng Trúc.*); `8.1` theo sn16.5:7.1 là nơi duy nhất có cùng Pāli.
  Thuật ngữ, đo trên tầng: `saddhā`/`saddho` → *lòng tin* (an10.68 và các bài song hành; `saddho` *có lòng tin* 59, *có niềm tin* 21); `hirī`/`ottappaṁ` → *hổ thẹn*/*kính sợ* (an10.68:4.1-4.2 đã dịch đúng cặp này); `hirimā`/`ottappī` → *biết hổ thẹn*/*biết kính sợ* (*biết kính sợ* 15, *biết sợ* 14); `kusīto` → *lười biếng* (34 so với *biếng nhác* 12); `āraddhavīriyo` → *tinh tấn* (121); `duppañño` → *kém tuệ* (sn 14, an hay dùng *thiếu trí tuệ* 13) vì đi cùng cặp `paññavā` = *có trí tuệ*; `kodhano` → *hay giận dữ* (giận dữ 15, hay giận 8, nóng nảy 11, phẫn nộ 7); `upanāhī` → *hay oán hận* (5/5 trong tầng); `ovādakā` → *giáo hóa*, cùng gốc `ovada` đã dịch *hãy giáo hóa* ở sn16.6/sn16.8 (bản Thích Minh Châu viết *giáo giới*); `hāni`/`parihāna` → *suy giảm* (an10.68, an6.84; bản Thích Minh Châu viết *tổn giảm*); `purisapuggala` → *người*; `ārohapariṇāha` → *đường kính lẫn chu vi* (an10.68:4.10); `kāḷapakkha`/`juṇhapakkha` → *nửa tháng trăng khuyết*/*nửa tháng trăng tròn dần* (an10.68).
  Bất định, ghi tại đây chứ không thêm vào thân kinh: (1) `kodhano`/`upanāhī`: các bản dịch lệch nhau (Thích Minh Châu *phẫn nộ*/*sân hận*, Sujato *irritable*/*acrimonious*); cặp *hay giận dữ*/*hay oán hận* theo đa số tầng, nhưng đây là lựa chọn biên tập chứ không phải nghĩa duy nhất. (2) `ārohapariṇāhena` dịch *đường kính lẫn chu vi* theo tiền lệ an10.68 và Sujato ("diameter and circumference"); không tự suy rộng nghĩa của hợp ngữ. (3) Nhiều khoá Pāli bị rút gọn bằng `…pe…`/`…`; mỗi khoá Việt giữ đúng một `…` và không mở rộng, nên đọc một khoá lẻ sẽ thấy câu đứt, đúng như tầng Pāli. (4) Không có số Pāli nào cần tính trong bài.
  Dấu lược khớp Pāli từng khoá (đã đối chiếu 81/81): 36 khoá có `…`; Pāli không có `…` thì Việt cũng không. Nháy đơn `‘’` và ngoặc kép `“”` khớp Pāli từng khoá (81/81, 0 lệch). Lát này không có khoá `(…)` trần. Không còn Pāli lọt vào Việt ngoài tên riêng; NFC sạch.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` do coordinator chạy; lát này không chạy bốn lệnh đó nên `technical_integrity` đặt 9.6.
