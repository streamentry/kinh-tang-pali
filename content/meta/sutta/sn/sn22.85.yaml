notes: |-
  Đợt 19, lát l41. Dịch từ Pāli root đã ghim, đủ 197/197 khoá, không khoá nào ngoài tập khoá Pāli; đối chiếu bản Anh Sujato đã ghim ở mức từng segment, lớp lấp `english-project` của chính dự án (7 khoá Sujato để trống) và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (Bình Anson hiệu đính) ở mục tra cứu toàn văn — bản này không căn lề theo segment, chỉ dùng để đối chiếu thuật ngữ và mạch lập luận.

  **Coverage Anh.** Đo theo `source/layers.yaml` (Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`): mẫu số **96**, Sujato phủ **89/96 = 0,9271**, trên sàn 0,80. 7 khoá có nội dung do Sujato để trống: `2.2` `3.4` `4.2` `4.4` `5.2` `5.3` `13.5` — toàn là chỗ lặp lại câu tà kiến của Yamaka (`2.2` `4.4` = `1.3`; `3.4` `4.2` = `3.2` rút gọn; `5.2` ≈ `1.2`; `5.3` ≈ `1.3`) hoặc câu hỏi `13.2` (`13.5`), mà Sujato có dịch ở khoá lân cận. Lớp lấp `english-project` (`content/meta/en/sn/sn22.85.yaml`, status `published`, người chấm khác người dịch bản Việt này) bù đủ 7/7, nên tính cả hai tầng là 96/96 = 1,0000; nhưng cổng đã đạt chỉ với Sujato nên không dựa vào lớp lấp. Vì 7/96 khoá chỉ có lớp lấp của dự án làm tham khảo Anh, `triangulation` đặt 9,0, không cao hơn. Tầng `vietnamese-current` không có bài này (manifest ghim chỉ 26 tệp Pháp Cú): đó là giới hạn của ảnh chụp upstream, không phải thiếu sót của kho. Ba khoá dưới 40 ký tự mà Sujato cũng để trống (`8.5` 19 ký tự, `9.13` 18, `28.9` 8) nằm ngoài mẫu số. Tổng số khoá Pāli Sujato để trống là 10 (7 có nội dung + 3 ngắn). Entry trong `content/meta/reference-gaps.yaml` không cần cho bài này vì coverage không dưới ngưỡng.

  **Pāli trùng nguyên văn.** Trong tầng đã dịch (`sn`/`mn`/`dn`/`an`), 68 khoá của bài này có Pāli trùng nguyên văn (so sau khi chuẩn hoá khoảng trắng) với khoá ở nơi khác, tổng **1.158** cặp. Dùng đúng dạng đa số (hoặc dạng hoà) ở **52/68** khoá. Mười sáu khoá khác dạng đa số vì lý do đã đo: `8.2` `8.8` `9.2` `9.4` `9.12` `9.14` `11.2` (1–2 cặp mỗi khoá, đều ở `sn22.86` và `sn44.2`, nơi Đức Phật gọi Anurādha là *ngươi*; ở đây Sāriputta nói với Yamaka là *ông*, `āvuso` → *hiền giả*), `9.8` và `9.10` (*ở trong tưởng* / *ở trong các hành* so với *đối với tưởng* 18/36 và *đối với các hành* 6/14: ở đây là vị trí của Như Lai — *Như Lai ở trong tưởng*, cùng cách với `9.2` *ở trong sắc* và với `sn22.86:9.8`, `9.10`, nên không dùng *đối với*), `7.11` (xem dưới), `13.13` (*thức là vô thường* viết thường vì nối tiếp *các hành …* của cùng câu; dạng đa số viết hoa 3, viết thường 2), `15.14` và `15.18` (*quán … là tự ngã* 1 so với *thấy … là tự thân* 3 khoá; trong sn22 đo được *quán* 9 so với *thấy* 6), `22.3` (1 khoá trùng, `mn138:21.8` *Không xem thọ …*), `22.4` (*không xem tưởng* 4, *không quán tưởng* 3) và `22.5` (*không xem các hành* 4, *không quán các hành* 2) — chọn *không quán* cho song song với `22.2` và `15.14`. `22.4` `22.5` gần hoà nên ghi để người biên tập cân nhắc.

  Pāli trùng nguyên văn **trong chính bài**: 27 nhóm (đáng kể: `1.3` = `2.2` = `4.4`; `3.1` = `6.1`; `3.2` = `6.2`; `3.4` = `4.2`; `7.3` = `7.8` *“Aniccaṁ, āvuso”*; `8.9` `9.3` `9.5` `9.13` `9.15` `10.3` `11.3` *“No hetaṁ, āvuso”*; `Taṁ kiṁ maññasi, āvuso yamaka,` ở `7.1` `8.1` `9.1` `10.1` `11.1` `15.1`; các hàng *Vedanaṁ …* / *saññaṁ …* / *saṅkhāre …* ở `15` `21` `28`; `13.5` = `13.2` và `13.4` ≈ `13.1`; `15.4` = `15.7` = `15.10`; `15.5` = `15.8`): 67 cặp, **0** nhóm bản Việt khác.

  **Thuật ngữ — đếm trước khi chốt.**
    - `tathāgato` → *Như Lai* (cùng `sn22.86`); `samanupassasi` trong *tathāgatoti samanupassasi* → *ông có xem … là Như Lai chăng* (`sn22.86`: *ngươi có xem*; `samanupassati` với `attato` → *quán … là tự ngã*, 9/15 trong sn22). Hai động từ cùng gốc được dịch khác nhau có chủ ý theo tiền lệ từng cụm, không phải vô ý.
    - `evarūpaṁ pāpakaṁ diṭṭhigataṁ uppannaṁ` → *khởi lên tà kiến tai hại* theo `mn22` (8 khoá, cùng công thức `tathāhaṁ bhagavatā dhammaṁ desitaṁ ājānāmi` và cùng chuỗi `mā bhagavantaṁ abbhācikkhi`, `yato kho te bhikkhū nāsakkhiṁsu … vivecetuṁ`); `mn38` và `mn49` dịch *tà kiến nguy hại* (7 + 1 khoá), `sn6.4` `sn6.5` *tà kiến sai lạc* (2), `dn23` *tà kiến ác* (1). Không có dạng đa số toàn tầng, nên theo bài gần nhất và cùng công thức là `mn22`. `thāmasā parāmāsā abhinivissa voharati` → *nắm giữ kiên cố, chấp trước … mà tuyên bố* (`mn136:9.9`, `mn136:13.9`, 8 khoá). `mā bhagavantaṁ abbhācikkhi` → *đừng xuyên tạc Đức Thế Tôn* (`mn22:3.6`).
    - `aḍḍho mahaddhano mahābhogo` → *giàu có, nhiều tài sản, nhiều của cải* (13 khoá, `sn55.44`); `tiṇhena satthena jīvitā voropeti` → *dùng dao sắc đoạt mạng sống* (`sn35.88:14.2`, `mn145:5.27`: *dùng dao sắc lấy mạng sống*; 9 khoá); `pubbuṭṭhāyī pacchānipātī kiṅkārapaṭissāvī manāpacārī piyavādī` → *dậy trước, ngủ sau, sẵn sàng vâng lệnh, làm điều vừa ý, nói lời dễ nghe* (cùng chuỗi năm cụm ở `mn84:5.10` và `dn2:35.2`, mỗi nơi nhiều khoá).
    - `anatthakāmo ahitakāmo ayogakkhemakāmo` → *muốn điều bất lợi, muốn điều tổn hại, muốn điều không an ổn* (`dn22:18.28`; `mn19:25.3` có *gây bất lợi, gây hại, không được an toàn*).
    - `upamaṁ te karissāmi` → *tôi sẽ nêu một ví dụ cho ông* (`sn12.67:7.2`, `mn43:22.16`: Sāriputta tự xưng *tôi*); `vedanā` (uẩn) → *cảm thọ*, `saññā` → *tưởng*, `saṅkhārā` → *các hành*, `viññāṇa` → *thức*; `āvuso` → *hiền giả*, *các hiền giả* khi nhiều tỳ-kheo (`3.3`).
    - `sutavā ca kho … ariyasāvako` → *bậc Thánh đệ tử có học* (`sn22.55:7.1`); `assutavā puthujjano … ` → *kẻ phàm phu chưa học* (`sn22.47:1.4`, `sn22.7:2.2`, 15 khoá).
    - `‘attā me’ti` → *‘Đây là tự ngã của tôi’* (`sn22.90:9.6`, `sn12.15:2.5`; hai khoá tiền lệ duy nhất, cùng dạng). `upeti` → *đi đến*; `upādiyati` → *chấp thủ* (38 khoá trong tầng, so với *nắm giữ* 3); `adhiṭṭhāti` → *quyết định*.
    - `dīgharattaṁ ahitāya dukkhāya saṁvattanti` → *đưa đến bất lợi và khổ đau lâu dài* (21 khoá), `hitāya sukhāya` → *lợi ích và an lạc lâu dài* (40 khoá). `anupādāya āsavehi cittaṁ vimuttaṁ` → *tâm … được giải thoát khỏi các lậu hoặc do không chấp thủ* (`mn112:4.6`).
    - `kallaṁ nu te taṁ veyyākaraṇaṁ` → *lời trả lời này của ông có hợp lý chăng*; `ettha ca te … diṭṭheva dhamme saccato thetato tathāgate anupalabbhiyamāne` → *ngay trong đời này, khi ông không tìm thấy Như Lai như một sự thật chắc chắn* theo `sn22.86:12.1` và `sn44.2:17.7`; bản Thích Minh Châu đọc *thường chơn, thường trú*.
    - `Tatiyaṁ` → *Thứ ba* (263/265 khoá); `0.2` *9. Phẩm Các Vị Trưởng Lão* (24/26).

  **Số Pāli.** `Tatiyaṁ` = **3** → *Thứ ba* (bài thứ ba của Phẩm Trưởng Lão: `sn22.83` là bài thứ nhất, `sn22.84` thứ hai, `sn22.85` thứ ba, `sn22.86` thứ tư); `pañcupādānakkhandhā` = pañca **5** → *năm thủ uẩn*, và danh sách đủ năm mục (sắc, cảm thọ, tưởng, các hành, thức) ở mọi hàng; bốn cách quán tự ngã của `15.14` `15.18` `22.2` `22.6` `22.7` (attato / vantaṁ / attani / asmiṁ) = **4** cách, đủ bốn trong bản Việt. Không có số lớn, không có cụm số chưa phân xử được.

  **Bất định đã ghi — không đưa vào thân kinh.**
    - **`7.11` `nāparaṁ itthattāyāti pajānāti`** → *vị ấy biết rõ: không còn gì là tự thân nữa* theo đa số trong sn (đo trên 51 khoá Pāli chứa `itthattāy-`: sn 113 so với 39 khoá theo dạng *trạng thái*; sn22 33 so với 5; còn toàn tầng thì gần hoà 115 so với 121 vì mn/dn theo bản Thích Minh Châu); đây là quy ước của tầng sn và **không** sát chữ `itthattāya` (*trạng thái này*): Sujato dịch *They understand: '… there is nothing further for this place.'*, bản Thích Minh Châu dịch *không còn trở lui trạng thái này nữa*. Chưa sửa theo luật *đo tiền lệ trước khi sửa*; người biên tập có thể cân nhắc thống nhất lại toàn tầng.
    - **`10.2`** Pāli `rūpaṁ … vedanaṁ … saññaṁ … saṅkhāre … viññāṇaṁ tathāgatoti samanupassasī` — Thích Minh Châu đọc *ông có quán Như Lai là sắc, thọ, tưởng, hành, thức không* (cả năm uẩn gộp lại); Sujato đọc *one who has form …* (người có sắc …). Bản Việt giữ nguyên bốn dấu lược `…` của Pāli, không chọn nghĩa nào. `11.2` `ayaṁ so arūpī … aviññāṇo` → *cái ấy, không có sắc … không có thức* (`ayaṁ so` → *cái ấy*, không *người ấy*, vì Pāli không nói là người; cùng cách với `sn22.86:11.2`).
    - **`13.9` `13.15` `tadatthaṅgataṁ`** → *đã biến mất*: không có khoá trùng nào trong tầng cho cụm `niruddhaṁ tadatthaṅgataṁ`; các dạng liên quan `atthaṅgama` được dịch *diệt mất* (10 khoá). Sujato *has ceased and disappeared*, Thích Minh Châu *đoạn diệt, tiêu diệt*. Chọn *đã diệt, đã biến mất* để giữ hai ý của hai từ Pāli, không quá hơn.
    - **`15.3` `15.6` `15.9` `tadāpi so vadhakova`** → *khi ấy người ấy vẫn chính là kẻ giết người*: Sujato *weren't they a killer then*, Thích Minh Châu hỏi *có phải là kẻ giết người không*; Pāli là câu khẳng định (kết bằng chấm). **`15.4` `Vadhakañca pana santaṁ na aññāsi`** — chủ ngữ của `na aññāsi` không nói; bản Việt thêm *người ấy* để tách người bị hại (*ông ta*) khỏi kẻ giết, vì `vadhako me` là lời của người bị hại.
    - **`adhiṭṭhāti`** (`21.1` `21.5` `28.1` `28.5`) → *quyết định*: Sujato *fixate on*, Thích Minh Châu *nhiếp trì*, `sn22.90:9.6` (danh từ `adhiṭṭhānaṁ`) *an lập*. Không có khoá động từ trùng; chọn *quyết định rằng* vì theo sau là một mệnh đề trích dẫn.
    - **`5.4`** `Sādhāyasmā … tenupasaṅkamatu anukampaṁ upādāyā` → *Lành thay, xin Tôn giả … vì lòng thương xót mà đến chỗ* theo `sn35.75:1.3`.
    - **Dấu hỏi.** `13.3` kết `”ti?` và là câu hỏi thật; `13.2` `13.5` kết `’ti?` nhưng là câu hỏi giả định được trích, bản Việt giữ dấu hỏi theo Pāli từng khoá.
    - **`15.13`** Pāli mở `“` (lời Sāriputta tiếp tục, kết ở `28.6`); `14.1` mở `“` và kết ở `15.11`; bản Việt bám đúng Pāli từng khoá, không tự cân.
    - Sujato mở rộng ở `7.9` và `7.11` (`So you should truly see …`, `They understand: …`) — thêm chữ không có ở Pāli, và bản Việt không bám theo; Pāli ở đó chỉ có `tasmātiha …pe…`, `evaṁ passaṁ …pe…`, `nāparaṁ itthattāyāti pajānāti`.

  **Dấu lược và nháy.** `…pe…` ở 5 khoá (`5.6` `7.9` `7.10` `9.7` `22.1`) đều thành **một** `…`; dấu `…` trần ở 54 khoá giữ đúng số lượng. Pāli không có `(…)` nên bản Việt cũng không có. Nháy đơn `‘’` và ngoặc kép `“”` khớp Pāli **từng khoá**: 0/197 lệch (mẫu số 197).

  **Phép kiểm đã chạy, có mẫu số.** Tập khoá Việt = tập khoá Pāli: 197/197, thứ tự khoá trùng thứ tự Pāli. Nháy theo khoá: 0/197 lệch. Dấu lược `…pe…` và `…` trần: 0/197 lệch. Pāli trùng nguyên văn trong chính bài: 27 nhóm / 67 cặp / 0 nhóm Việt khác. NFC, khoảng trắng đầu/cuối, hai dấu cách liền, khoá rỗng: 0 lỗi / 197. Pāli lọt sang Việt (trừ tên riêng và tiêu đề `Saṁyutta Nikāya`): 0 / 197. Đã đọc đối chiếu cặp Pāli↔Việt cả 197 khoá. Phép kiểm số Pāli: bài này chỉ có `tatiya` và `pañca`, đều tự tính ở trên; không có cụm số ghép nên phép đo máy đóng góp 0 cặp.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` và `npm run build`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
