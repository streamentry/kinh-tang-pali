notes:
  - >-
    Tên bài `Upasenaāsīvisasutta` → *Kinh Với Upasena Về Rắn Lửng*, theo mẫu `sn35.70:0.3` *Kinh Với Upavāṇa Về …*. Tên phẩm `Migajālavagga` → *7. Phẩm Migajāla* khớp Pāli tuyệt đối với `sn35.64:0.2` và `sn35.65:0.2`.
  - >-
    **2 khoá có Pāli trùng nguyên văn và dùng lại nguyên văn** (đo bằng script): `0.2` (tên phẩm, từ `sn35.64:0.2`) và `3.9` (*Thứ bảy.*, từ `an10.107:6.5`). Đây là lát có **ít cặp trùng nhất** trong 9 bài: bài này viết mới gần như toàn bộ.
  - >-
    Tiền lệ đã dùng: `sītavane sappasoṇḍikapabbhāre` → *trong rừng mát, dưới hang Sappasoṇḍika* (`dn16:3.42.5`) · `āsīviso` → *rắn nọc* (`an4.110:2.5`, `mn105:30.1`) · `mañcakaṁ` → *tấm giường* (`dn16:5.1.5`) · `ahaṅkāramamaṅkāramānānusayo susamūhato` → *các thiên hướng chấp tôi, chấp của tôi và mạn … đã được khéo nhổ sạch từ lâu* (`sn28.1:3.4`, `sn21.2:3.6`) · `satthe hi` cho `sakkhiṁ vā karissati` → *chứng ngộ được*.
  - >-
    **Bất định quan trọng, ghi rõ:** công thức `ahaṁ cakkhūti vā mama cakkhūti vā` … `ahaṁ jivhāti vā …` `ahaṁ manoti vā mama mano’ti vā` (ở `2.8–2.10`, `2.13–2.15`, `3.3–3.5`) là **lần đầu xuất hiện trong tầng Việt** — tra theo mẫu Pāli trên toàn bộ 85.752 cặp Pāli–Việt đã có: 0 tiền lệ (cùng dạng với `ahaṅkara` = *chấp tôi* / `mamaṅkāra` = *chấp của tôi* đã có ở `sn18.21`, `sn22.71`, `sn28.1`…). Chọn *Ta là con mắt, hay con mắt là của Ta* theo đúng cấu trúc `ahaṁ X` / `mama X`; Sujato dịch *I am the eye* / *the eye is mine* cũng theo hướng đó. Cách đọc khác là *con mắt này là của ta*; người biên tập nên thống nhất khi có bài khác dùng cùng công thức.
  - >-
    Bất định khác: (a) `2.13` (`‘ahaṁ cakkhūti vā mama cakkhūti vā …pe…`) **không có tầng Anh nào** — Sujato để trống và tầng lấp của dự án cũng chưa có — nên `2.13` dịch hoàn toàn từ Pāli và tiện với `2.8` trong cùng bài. Coverage Anh 17/18 = 94,4%, vẫn trên ngưỡng 0,8. (b) `vikirati` → *rơi vụn* (Sujato *scattered*); nháp đầu ghi *vỡ ra*, đã sửa theo nghĩa *rơi vụn tan tành*. (c) `bhusamuṭṭhī` → *một nắm rơm*; 0 tiền lệ trong tầng, nhưng Sujato dịch *a handful of hay* nên không có gì để đối chiếu thêm. (d) `kāyassa aññathattaṁ` → *thân có thay đổi gì*, `indriyānaṁ vipariṇāmaṁ` → *các căn có thoái lui gì*; `siyā … vipariṇāmo` ở `2.11` là *có thể*, nên dùng *có thể có* chứ không nói chắc.
  - >-
    Cấu trúc nháy kép đối chiếu lại với Pāli: `1.4` mở → `1.6` đóng `”ti.`; `2.2` mở → `2.6` đóng `’”ti.`; `2.7` mở → `2.16` đóng `”ti.`. Pāli có một dấu `"` thừa ở `3.5` (không còn nháy mở tương ứng); bản Việt đóng bằng nháy đơn `’` ở đó cho cân. Cân trên toàn bài 34 khoá.
  - >-
    Quy tắc dấu lược của BRIEF_VI3 §10: mọi khoá Pāli có `…pe…` hoặc `…` đều giữ **đúng một** `…`, không mở rộng; không khoá nào nén bằng `…` cả khi Pāli viết đủ. Đã đếm từng khoá. Coverage Anh đo được: 17/18 = 94,4%
  - >-
    Tầng `vietnamese-current` vắng: tại commit đã ghim, bilara chỉ có Pháp Cú cho tiếng Việt, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Ba tầng tham khảo còn lại là Pāli root (authority) + `english-sujato` đã ghim + `english-project` (lớp lấp của chính dự án, chỉ tính khi `published`).
  - >-
    Bốn cổng kỹ thuật của AGENTS.md: `npm run validate`, `npm test`, `npm run check` và `npm run build`. **Agent lát này KHÔNG chạy bốn lệnh đó** — BRIEF_VI3 §7 và lệnh của người điều phối cấm chạy `npm run validate|test|build|check`. Những gì đã chạy và xanh: `_hvi.py` (`save_vi` → `kiểm`) cho cả 9 bài — đủ khoá trong `all`, không thừa, NFC, không trùng nguyên văn Pāli (trừ 0.1 theo quy ước), không Pāli lọt, số dấu lược khớp từng khoá, nháy kép cân trên cả bài; quét lại 306 khoá bằng script độc lập; `notes` và `blocking_errors` parse sạch bằng thư viện `yaml` của kho. Cổng thật còn lại là CI (`.github/workflows/ci.yml`), nên `technical_integrity` chỉ 9.6 chứ không 10.
