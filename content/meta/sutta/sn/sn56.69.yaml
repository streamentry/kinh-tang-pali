    `sn56.73`, `sn56.74`, `sn56.75`, `sn56.76`, `sn56.77`, `sn56.78`, `sn56.79`,
    `sn56.82`, `sn56.83`, `sn56.84`, `sn56.85`, `sn56.86`, `sn56.87`, `sn56.88`,
    `sn56.89`, `sn56.91`, `sn56.92`, `sn56.93`, `sn56.94`, `sn56.95`. Tôi đóng
    ngay sau mệnh đề cuối của `1.1` để người đọc không gặp dấu ngoặc treo —
    **đây là cố ý lệch 48 segment**; bộ kiểm tra báo đúng các chỗ ấy, không phải
    sót sót. Pāli không bị sửa.
  - >-
    **Hai mươi tám bài cùng một công thức** `appakā te sattā ye X; atha kho
    eteva bahutarā sattā ye Y` — *số ít là kẻ X; nhưng số đông là kẻ Y*. Tôi đã
    đối chiếu **từng cặp X/Y** với Pāli để bảo đảm hai vế thật sự khác nhau: ở
    22 bài, Y chỉ thêm tiền tố phủ định (`appaṭiviratā`, `a-`); ở `sn56.63`,
    `.65`, `.66`, `.67`, `.68`, `.69` thì X và Y là **hai phẩm chất khác nhau**
    hoàn toàn.
  - >-
    **Quy ước dấu lược của kho, đã đo lại chứ không phải đoán:** trong 1.535
    segment đã `published` có `…` trong Pāli, chỉ **617** (40%) giữ **đúng số**
    dấu, và cặp lệch phổ biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` →
    `…`). Vì vậy quy tắc của kho là **có/không có `…` phải khớp theo từng
    segment**, không phải khớp số; tôi giữ đúng quy ước đó.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Hòa thượng Thích
    Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
  - >-
    `appakā` → *số ít* và `bahutarā` → *số đông* (0 tiền lệ, đặt mới).
    `matteyyā`/`petteyyā` → *chờ chết*, `amatteyyā`/`apetteyyā` → *không chờ
    chết* (0 tiền lệ, đặt mới; `dhammaṃ mattaṁ` đã có nghĩa *chờ ngờ* trong
    kho). `sāmaññā` → *chấp nhận điều sai* và `brahmaññā` → *cho là tôn quý* (0
    tiền lệ, đặt mới — hai tiền tố `sāma-`/`brahma-` ở đây là tiền tố **tiêu
    cực**, khác với `sāmañña` = sa-môn). `thalajā`/`udakajā` → *sinh ra từ bờ /
    sinh ra từ nước* (0 tiền lệ, đặt mới). `māda` → *say* (0 tiền lệ, đặt mới).
    `ariyena paññācakkhunā` → *con mắt tuệ của bậc Thánh*; `sammuḷhā` → *mê
    lầm*.
