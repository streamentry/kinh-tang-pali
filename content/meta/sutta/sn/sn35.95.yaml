notes: |-
  Bản dịch mới từ Pāli root (snapshot SuttaCentral/Bilara đã ghim), đối chiếu bản Anh của Bhikkhu Sujato và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không phân đoạn, dùng để tra nghĩa, không căn lề vào segment). Bài: Kinh Với Māluṅkyaputta (Mālukyaputtasutta), bài thuộc Phẩm Sáu (Saḷavagga), Tương Ưng Sáu Xứ. 181/181 khoá, đúng thứ tự Pāli. Bài là bản song song của Kinh Bāhiya (ud1.10) ở phần "chỉ là cái được thấy" và của an4.257 về nhân vật.

  COVERAGE ENGLISH (đo thật): Pāli có nội dung (từ 40 ký tự sau nén khoảng trắng, bỏ khối :0.x) = 23 khoá. Bản Sujato phủ độc lập 23/23 = 1,000, trên ngưỡng 0,80 của cổng. Không có lớp english-project cho bài này nên không khoá nào do dự án tự bù: toàn bộ coverage là English độc lập. LƯU Ý mẫu số nhỏ: Sujato để TRỐNG 26 khoá, tất cả đều dưới 40 ký tự nên không tính vào cổng: bốn câu đáp `No hetaṁ, bhante` (5.2, 6.2, 7.2, 8.2), toàn bộ phần kệ được Đức Thế Tôn nhắc lại (37.1–40.6, 21 khoá; Sujato gộp vào 36.3 bằng một câu "And he repeated the verses in full") và dòng kết `Dutiyaṁ.` (42.5). Phần kệ ấy do đó chỉ có Pāli đứng một mình, nhưng kệ ấy trùng từng chữ với kệ 12.1–35.6 (đã có Sujato) nên không mất chỗ tựa. Tầng vietnamese-current: không có ở mức segment (bilara tại commit ghim chỉ phân phối Pháp Cú); bản Thích Minh Châu chỉ có dạng nguyên bài và dùng để tra.

  DÙNG LẠI NGUYÊN VĂN (Pāli trùng từng chữ): 0.1 và 0.2 theo `sn35.100`–`sn35.103` (Phẩm Sáu); 0.3 `Mālukyaputtasutta` theo `an4.257:0.3` (Kinh Với Māluṅkyaputta); 1.2 theo `an8.63:1.2`, `an7.83:2.1` (và `sn47.3:1.3`, khác chữ hoa đầu câu); 3.2 hai vế cuối (`Appeva nāmāhaṁ …`) theo `an8.63:1.5` và `sn47.3:1.5`; 42.4 theo `an4.257:4.4` (đã bỏ chữ `ấy` vì Pāli không có); `No hetaṁ, bhante”.` đo toàn tầng 285 khoá, dạng `Thưa không phải vậy, bạch Thế Tôn”.` 57 khoá (7 trong sn35), `Bạch Thế Tôn, không.` 56, `Không, bạch Thế Tôn.` 28; tôi giữ dạng đầu theo đa số trong sn35. Pāli lặp trong chính bài: 23 nhóm (kệ 12.x–23.x lặp ở 37.x, 38.x; kệ 24.x–35.x lặp ở 39.x–40.x; bốn câu đáp `No hetaṁ, bhante`; bốn câu `Atthi te tattha…`), 0 cặp trùng mà bản Việt khác nhau (đã sửa một chỗ lệch giữa 13.3 và 38.3 trong lượt tự kiểm).

  BẤT ĐỊNH VÀ CÁC CÂU NGHĨA ĐEN DỄ LỆCH VĂN CẢNH (không thêm vào thân kinh):
  - `na tena` / `na tattha` (10.3–10.6): nghĩa đen `không bởi/ở cái ấy` và `không ở nơi ấy`. Sujato dịch `you won't be 'by that'` / `'in that'`; Thích Minh Châu `Ông không có vì cái ấy`, `không có: Ở nơi đây`. Bản Việt theo tiền lệ `ud1.10:8.5–8.8` (cùng cụm Pāli, bài Bāhiya): `không ở trong đó` / `không ở nơi đó`. Khác `ud1.10` ở chỗ không đặt nháy đơn quanh `trong đó`, `nơi đó`, vì Pāli của khoá này không có nháy, và bản dịch giữ cân nháy từng khoá theo Pāli. Nghĩa của cặp này vốn khó và là điểm bất định chính của bài; tôi không thêm giải thích vào thân kinh.
  - `diṭṭhasutamutaviññātabbesu dhammesu` (10.1, 10.2): hợp từ có đuôi `-tabba` ở cuối, có thể hiểu `-tabba` chỉ áp cho `viññāta` hoặc cho cả bốn. Theo `an4.24:7.5` (cùng hợp từ, bản đã published) viết `các pháp nên thấy, nên nghe, nên cảm nhận, nên biết`; Sujato cũng `things that ought be seen, heard, thought, and known`. Mệnh đề sau (`diṭṭhe diṭṭhamattaṁ`) dịch `trong cái được thấy sẽ chỉ là cái được thấy` theo `ud1.10:8.2`, `8.4`.
  - `na ca te hoti passeyyanti` (4.2–9.1): `và cũng không có ý nghĩ rằng mình có thể thấy`. Sujato `neither see nor think might be seen`; Thích Minh Châu `Ông không muốn thấy`. Pāli là `hoti` + `passeyya` + `iti` (không có `ý muốn`), tôi giữ `có ý nghĩ rằng mình có thể thấy` thay vì `muốn thấy` để không thêm động cơ. Đây là câu duy nhất của bài mà Thích Minh Châu và Sujato khác nhau về nghĩa, nên người biên tập có thể phán xử lại.
  - `chando vā rāgo vā pemaṁ vā` (4.2–9.1): `lòng ham muốn, tham ái hay thương mến` theo đúng `sn42.11:4.2` và `4.5` (cùng chuỗi, hai khoá). `rāga` → `tham ái` ở đây là theo tiền lệ này; các bài khác trong tầng dịch `rāga` là `tham` (`mn151`, `sn35.246`), vì ở đó nó đứng trong chuỗi khác (`chando … rāgo … doso … moho`).
  - `Tañca ajjhosa tiṭṭhati` (12.4, 14.4, 16.4, 18.4, 20.4, 22.4, 37.4): `và bám chặt vào đó`. Hai khoá Pāli gần trùng `thag1.98:1.4` và `thag1.99:1.4` dịch `rồi vẫn chạy theo đó`; đo `ajjhosāya tiṭṭhati` toàn tầng cho `bám chặt` (cụm `hoan hỷ, chào đón và bám chặt` ở `mn145`, `mil3.4.8`, `an4.24:9.2`) áp đảo, nên tôi chọn `bám chặt vào đó`. Phủ định đối xứng `tañca nājjhosa tiṭṭhati` → `và không bám chặt vào đó`.
  - `Abhijjhā ca vihesā ca` (13.3–23.3, 38.3): `tham lam và sự hại`. Đo: `abhijjhā` ngoài cụm `abhijjhādomanassa` là `tham lam` 117 khoá, `tham` 48, `tham muốn` 38; `vihesā` là `sự hại` ở `an5.200`, `an6.13` (37 khoá chứa `hại`). Sujato `covetousness and cruelty`. Bản nháp đầu của tôi viết `phiền toái` (0 tiền lệ), đã bỏ trong lượt đối kháng.
  - `cittamassūpahaññati` (13.4…): `tâm của vị ấy bị tổn thương` (`upahaññati` bị `tổn thương` 2 / `tổn hại` 1 trong tầng; tôi giữ `tổn thương` để khác với `sự hại` ở dòng trên).
  - `Yathāssa passato rūpaṁ … Khīyati nopacīyati` (25.x–35.x): `khīyati nopacīyati` là động từ bị động không chủ ngữ; bản Việt `cạn mòn, không tích lũy` không chỉ rõ chủ thể (Sujato `you wear away, you don't heap up`). `sevato cāpi vedanaṁ` → `và cũng trải qua cảm thọ` (Sujato `get familiar with how it feels`; Thích Minh Châu `thọ cảm giác`). Chữ `thì` ở 25.3 là nối câu của bản Việt, không có trong Pāli. `apacinato dukkhaṁ` → `Người làm khổ tiêu giảm`, đối xứng với `ācinato` → `tích lũy`.
  - `Rasaṁ bhotvā` (18.1, 30.2): `bhotvā` là biến thể của `bhutvā`; Sujato `enjoy a taste`, bản Việt `thưởng thức vị`, còn `sāyato rasaṁ` (31.1) là `nếm vị`. `Phassaṁ phussa` (20.1, 32.2, 33.1): `chạm xúc`; Thích Minh Châu `cảm xúc`.
  - `jiṇṇo vuddho mahallako addhagato vayoanuppatto` (2.2, 3.1): `đã già, cao niên, lớn tuổi, đã đi xa trong cuộc đời, đã đến tuổi cuối đời`. Tầng có ba cách (`dn4:5.15` `sống lâu và đã đến tuổi trưởng thượng`, `dn19:32.2` `nhiều tuổi, ở giai đoạn cuối đời`, `mn12:62.5` `tuổi đã cao, đã đến giai đoạn cuối của đời`). Không cách nào là đa số; tôi chọn cách có hai vế riêng cho `addhagato` và `vayoanuppatto` để không gộp hai từ thành một.
  - `kiṁ dahare bhikkhū vakkhāma` (2.1): ngôi thứ nhất số nhiều, dịch `Ta phải nói gì` (theo `an4.257:2.2` `bây giờ ta phải nói gì với các vị tỳ-kheo trẻ tuổi`), không phải `chúng ta`. Câu có sắc thái trách nhẹ (Sujato `what are we to say`), giữ trong ngữ điệu `phải nói gì`.
  - Tên: Pāli root ở bài này viết `mālukyaputta` (không có `ṅ`), còn Sujato và 68 khoá trong tầng viết `Māluṅkyaputta` (chỉ 2 khoá dùng dạng không `ṅ`), nên tôi giữ `Māluṅkyaputta` cho nhất quán với tầng; người biên tập có thể muốn thống nhất lại.
  - Công thức 42.2: `không phóng dật, nhiệt tâm, tinh cần` (đo 80 khoá có `appamatto ātāpī pahitatto`: dạng `nhiệt tâm, tinh cần` là dạng thường gặp nhất, 13 khoá nguyên dạng và thêm các biến thể có đuôi nối), khác 1.2 `không phóng dật, tinh cần, quyết tâm` (đo 8 khoá, theo `an8.63:1.2`, `an7.83:2.1`, `sn47.3:1.3`). Hai khoá cùng chuỗi Pāli nhưng ở hai bối cảnh (lời xin và lời kể) mà tầng dùng hai cách khác nhau; tôi theo từng cách để mỗi khoá khớp tiền lệ, nên cùng một bài hai chuỗi đó dịch khác nhau. Người biên tập có thể muốn thống nhất.
  - `trở thành một vị A-la-hán` (42.4): đo 43 khoá có `arahataṁ ahosī`: `một vị A-la-hán` 14, `một trong các (những) bậc A-la-hán` 14; hòa, nên theo bản cùng nhân vật `an4.257:4.4`.

  Dấu lược: `lược` khớp từng khoá, 0 lệch. 1.1 mang `…pe…` ⇒ một dấu `…`; 38.7 là `…pe…` ⇒ giá trị đúng một dấu `…`. Không khoá nào có Pāli viết đủ mà tôi nén bằng `…`, không có `(…)` trần. Nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch trên 181 khoá).

  Lỗi bản nháp đã bắt trong lượt đối kháng (ghi để không tái phạm): (1) `phiền toái` cho `vihesā` (0 tiền lệ) → `sự hại` (13.3, 15.3, 17.3, 19.3, 21.3, 23.3, và 38.3 bị sót, đã sửa; phép so Pāli trùng trong bài bắt được); (2) 3.2 diễn đạt `lời Đức Thế Tôn nói` cho cả hai vế `bhāsitassa`, khác `an8.63:1.5` và `sn47.3:1.5` (vế sau `lời dạy của Đức Thế Tôn`) → đã theo tiền lệ; (3) 2.1 `còn biết nói gì` thêm sắc thái bi quan không có trong `kiṁ vakkhāma` → `phải nói gì`; (4) 41.1 viết lại thành `cần được hiểu chi tiết` thay vì `cần phải được thấy` của `daṭṭhabbo` (5 khoá trùng Pāli trừ tên) → đã theo tiền lệ; (5) 36.1 thừa chữ `là` → đã bỏ.

  `technical_integrity = 9,6` vì bốn cổng kỹ thuật do người điều phối chạy, tôi không được chạy trong lát này: `npm run validate` (qua `npm run build`), `npm test`, `npm run check`, `npm run build`. Những gì đã tự kiểm: tập khoá Việt bằng tập khoá Pāli (181 = 181) và đúng thứ tự, `lược` khớp từng khoá, nháy khớp Pāli từng khoá, NFC từng khoá, không khoá rỗng, không `(…)` trần, không Pāli lọt vào bản Việt (ngoài tên riêng và tiêu đề `Saṁyutta Nikāya 35.95`), 23 nhóm Pāli trùng trong bài đều có bản Việt giống hệt nhau.
