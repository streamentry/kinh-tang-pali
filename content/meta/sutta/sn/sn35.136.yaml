notes: |-
  Tầng tham khảo. Đo riêng bài này, không dùng phỏng đoán theo cả phẩm: mẫu số là
  **11** segment Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Sujato đã ghim phủ **10/11**;
  khoá `1.4` để trống và được lớp lấp `english-project` của dự án (đã `published`) phủ nốt,
  nên coverage English tính được là **11/11 = 1,0000** — vượt ngưỡng 0,8, **không** cần ghi
  nhận gap. Tầng Việt hiện hành vắng: manifest tại commit đã ghim chỉ có 26 tệp Pháp Cú, đây là
  đặc điểm của snapshot upstream chứ không phải thiếu sót của kho. Vì 1 trong 11 khoá có
  nội dung đến từ lớp lấp của chính dự án (không phải một lần đọc Anh độc lập), `triangulation`
  hạ xuống 8,8 và không tuyên bố đã đối chiếu English cho toàn bài.

  Lỗi ở tầng Anh đã ghim, chỉ đếm và báo, không sửa. Ở `sn35.136:1.12` Pāli chỉ có **đúng một
  từ** `Saddānaṁ …`, nhưng tầng ghim in ra cả vế đầu của câu `1.10` của chính nó (15 từ). Đếm
  cả bài theo phép `số từ tiếng Anh ≥ 2 × số từ Pāli và ≥ 8`: **1** khoá lỗi, đúng là `1.12`;
  `1.5/1.6/1.7/1.13/1.14/1.15` đều để trống phần bị lược nên không lỗi. Chiều ngược lại cũng có
  **1** khoá: `1.3` Pāli viết đủ (`Saddārāmā, bhikkhave, devamanussā saddaratā saddasammuditā.`)
  nhưng tầng ghim lại lược. Ngoài ra tầng ghim để trống `9.5` (`Tatiyaṁ.`) — chỉ 8 ký tự, dưới
  ngưỡng 40 nên không tính vào coverage. Bản Việt ở đây theo Pāli: `Đối với các tiếng …`, một dấu
  lược, không mở rộng.

  Quy tắc dấu lược — không mở rộng. Bài anh em cùng công thức `sn35.137` đã dịch `1.11–1.14`
  (Pāli cùng dạng danh từ + `…`) theo cả ba vế đủ, tức **bung chữ vào chỗ Pāli đã lược**. Bài này
  không làm vậy: `1.5/1.6/1.7` và `1.12–1.15` giữ đúng phần Pāli còn lại rồi dấu `…`. Cả bản Anh
  đã ghim cũng dịch `1.5/1.6/1.7` theo đúng giới hạn này (chỉ một danh từ). Ghi ở đây để người
  biên tập biết là **lệch có chủ ý** với `sn35.137`, không phải sót.

  Thuật ngữ — đều tra tiền lệ và ghi cả hai số khi hai phạm vi cho đa số khác nhau.
  `rūpārāma / rūparata / rūpasammudita` → *vui thích / ưa thích / hoan hỷ vì*: **0** tiền lệ ngoài
  `sn35.137`, đặt mới theo đúng bài anh em để hai bài không tự mâu thuẫn.
  `Rūpavipariṇāmavirāganirodhā` → *biến hoại, ly tham, diệt tận* và
  `samudayañca atthaṅgamañca assādañca ādīnavañca nissaraṇañca` → *sự sanh khởi, sự diệt tận,
  sự đáng ưa, tai họa và lối thoát*: dùng lại nguyên văn `sn35.137` (52 cặp Pāli↔Việt cùng công thức
  này trên tầng đã có tiền lệ, dùng lớn nhất là *sự sanh khởi, sự diệt tận*).
  `mariyebhi` (`4.1`, `9.1`) → *bậc Thánh*: `mariy-` chỉ xuất hiện **2** lần trong toàn bộ Pāli `sn`
  và cả hai đều ở chính bài này; `ariy-` thì **1331** lần, mà tầng dịch `ariyānaṃ` là *bậc Thánh*
  (**19** cặp; *hàng A-ri* và *bậc A-ri* lần lượt **0** và **0**). Hai khoá đã dùng cùng một cách.
  `sakkāyassa nirodhanaṁ` → *sự chấm dứt của hữu thân*: **đây là chỗ tầng còn chia rẽ**, đo được
  `sakkāya` + `nirodha` có **11** cặp và chia *hữu thân* **3** / *thân kiến* **4** / *thân* **3**.
  Chọn *hữu thân* vì `sakkāya` không mang hậu tố `-diṭṭhi`/`-pariyāpanna` nên nghĩa là "hữu thân"
  chứ không phải "thân kiến"; ghi rõ ở đây vì lựa chọn ngược với đa số sát nhất.
  `Māradheyyānupannehi` → *lọt vào cõi Ác Ma*: `Māra` trên tầng `sn` là **13/13** *Ác Ma*,
  `Māradheyya` là **3/3** *cõi Ác Ma*. `Iṭṭhā kantā manāpā` → *khả ái, dễ thương, vừa ý*:
  chuỗi này đã có **10** lần ở **3** tệp, dùng nguyên văn. `Idamavoca bhagavā` → *Đức Thế Tôn đã
  nói như vậy*: **20/35**. `Idaṁ vatvāna sugato athāparaṁ etadavoca satthā` → *Nói như vậy xong,
  bậc Thiện Thệ, bậc Đạo Sư lại nói thêm*: **14/24**. `Tatiyaṁ` → *Thứ ba*: **115/117**.
  Tên phẩm: `Devadahavagga` → *14. Phẩm Devadaha* là **11/11** tệp cùng phẩm đã có; `Paṭhamarūpārāmasutta`
  → *Kinh Vui Thích Sắc (Một)* đặt cạnh `sn35.137` *Kinh Vui Thích Sắc (Hai)*. Có tiền lệ cùng
  hình thức: toàn tầng `sn` dùng thứ tự trong ngoặc *(Một)/(Hai)* ở **169** tệp so với dạng viết
  *Thứ Nhất/Thứ Hai* ở **75** tệp; phạm vi gần nhất trong phẩm này là 2 trên 3 theo dạng ngoặc.

  Điểm số Pāli — tự tính, không chép. Quét cả **55** khoá: số đếm duy nhất là `14` ở `0.2`
  (số thứ tự phẩm, giữ nguyên `14`; `sn35.136:0.2` và 10 tệp anh em cùng phẩm đều ghi `14.`),
  `35.136` ở `0.1`, và hai thứ tự: `Paṭhama` → *(Một)* ở `0.3`, `Tatiya` → *Thứ ba* ở `9.5`.
  Không có số đếm lớn nào trong bài. Hai kết quả khác: bảo đảm **6** xứ ở `2.1–2.2` đủ và **đúng
  thứ tự Pāli** (`rūpā saddā rasā gandhā` rồi `phassā dhammā` → *sắc, tiếng, vị, mùi, xúc và
  pháp*), và bảng `1.1–1.8` giữ thứ tự `sắc, tiếng, mùi, vị, xúc, pháp` của chính Pāli khoá đó.

  Phép kiểm đã chạy trên tệp này, kèm mẫu số: tập khoá Việt = tập khoá Pāli **55 = 55**,
  không có khoá rỗng, không có khoá lạc, thứ tự khoá bằng đúng thứ tự Pāli. Dấu nháy (đơn và kép)
  khớp **từng khoá**: mẫu số **4** dấu trên phía Pāli, lệch **0**. Dấu lược: `…pe…` **0** khoá,
  `…` trần **7** khoá, `…` của Việt khớp `…` của Pāli ở **7/7**, không có `… cho đến …`, không có
  khoá nào thêm hoặc bỏ dấu lược; không khoá nào có `(…)` ở cả hai bên. **Phép rỗng:** bài này
  **không có** cặp Pāli trùng nguyên văn nào ở trong chính nó, nên phép so trùng nội bộ đo được
  0 cặp — nói thẳng là phép rỗng chứ không phải "0 lỗi". Cả 55 giá trị đều ở dạng NFC, không thừa
  khoảng trắng, không lọt ký tự Pāli (ngoại lệ duy nhất là `ṁ` trong `0.1`, và đó là quy ước
  tầng: **1708/1708** giá trị `:0.1` của `sn` đều mở đầu bằng `Saṁyutta Nikāya`).

  Ba chỗ tầng Anh đã ghim đọc khác Pāli và bản Viện theo Pāli, ghi lại vì người đọc bốn cột sẽ
  thấy lệch: `1.3` (xem trên); `4.3` `Paccanīkamidaṁ hoti` — Pāli chỉ nói "điều này trái ngược",
  tầng ghim thêm "cái thấy của những bậc thấy", bản Việt giữ đúng Pāli; `9.2` `Padaṁ sambuddhumarahati`
  — Pāli là "chứng ngộ được trạng thái ấy", tầng ghim đọc là "đủ tư cách hiểu", bản Việt theo Pāli.

  Cổng kỹ thuật. Bị cấm chạy cổng trong lát này nên `technical_integrity` đặt **9,6** và **không**
  tuyên bố technical gate đã pass; đã tự kiểm tương đương bằng cách đọc mã cổng: không khoá trùng,
  đúng tiền tố uid, không khoá lạc so với nguồn Pāli đã ghim, đủ 55/55 khoá có chữ, không ký tự
  ngoài Latin, không ký tự thay thế, tất cả ở dạng NFC — **0** lỗi. Bốn lệnh còn lại của kho, chạy
  ở nơi khác: `npm run validate` · `npm test` · `npm run check` · `npm run build`.