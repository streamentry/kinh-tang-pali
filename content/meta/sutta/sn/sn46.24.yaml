notes: |-
  Đối chiếu Pāli + English Sujato (16/16 khoá). Tác động của phi như lý tác ý làm tăng trưởng năm triền cái và làm suy giảm bảy giác chi; như lý tác ý làm đoạn tận năm triền cái và viên mãn bảy giác chi. Số thứ tự uddāna 'Catutthaṁ' = Thứ tư.
  
  16 khoá, tất cả đã dịch, không có khoá nào thiếu hay orphan.
  
  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `3. Udāyivagga` → «3. Phẩm Buổi Sớm». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.
