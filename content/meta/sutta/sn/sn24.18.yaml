notes: |-
  Dịch từ Pāli root đã ghim. Tầng Anh CÓ và đã đo: manifest liệt kê sutta/sn/sn24/sn24.18_translation-en-sujato.json, 24/39 khoá có chữ.
    Coverage đo được: 14/14 Pāli có nội dung có Anh = 1.0000 (13 khoá từ Sujato + 1 khoá do lớp lấp english-project của dự án bù, và lớp lấp đã ở trạng thái published nên được tính theo source/layers.yaml). Không cần entry reference-gaps.
    18 khoá TRÙNG NGUYÊN VĂN, dùng lại y nguyên: 1.2 (19 cặp), 1.3 và 2.2 (sn24.36 cùng tên Nevahotin… và cùng câu), 1.4 (20 cặp), 2.1 (7 cặp), 3.1–3.13 (đa số trong các cặp vô thường, khổ hay lạc, thưa không phải vậy), 4.2 (4 cặp).
    TRIANGULATION 8.9 VÌ KỆ LIỆT KÊ TÊN KHÔNG CÓ TẦNG ANH NÀO: 5.0–7.3 gồm 15 khoá, trong đó 7.1–7.3 trống trong bản Anh đã ghim và phần còn lại vắng mặt trong cả Sujato lẫn lớp lấp. Đó là 15/39 khoá của bài phải đứng vững bằng Pāli một mình, nên hạ điểm so với 9.2 của các bài khác trong lát.
    Cách đọc kệ liệt kê tên, ghi lại vì không có tầng đối chiếu. Vātaṁ etaṁ mama, so attā no ca me siyā = các bài trên tròn tánh (vāta); Natthi karoto hetu ca = các bài về không có nhân của người tạo ra; mahādiṭṭhena aṭṭhamaṁ = bài thứ tám, tầm nhìn xa. Sassato loko / Asassato ca antavā / Anantavā = bốn cách đặt câu hỏi về thế giới (có tự tại, vô tự tại, hữu hạn, vô hạn); taṁ jīvaṁ taṁ sarīranti và aññaṁ jīvaṁ aññaṁ sarīranti = hai ý kiến về linh hồn thân xác. Hoti / Na hoti / Neva hoti na na hoti tathāgato paraṁ maraṇāti = ba bài cuối của phẩm, và bài 18 chính là bài đang dịch nên khớp với 0.3. Tassuddānaṁ → Tóm lược: (đa số 302/471 trong tầng).
    0.3 → Kinh Như Lai Chẳng Còn, Chẳng Không Còn, bám khuôn sn24.36:0.3 (Nevahotinanahotisutta → Kinh Chẳng Còn, Chẳng Không Còn) và ghép thêm Như Lai cho tathāgato. Chặn nguy hiểm không khổ không lạc: neva hoti na na hoti dịch là Chẳng Còn, Chẳng Không Còn, không gộp thành không có.
    4.4 Sotāpattivaggo → Phẩm Nhập Lưu; 4.5 Aṭṭhārasaveyyākaraṇaṁ niṭṭhitaṁ → Sự trình bày thập tám ổ theo từng mục cũng đã khép lại (āyatana giữ làm ổ, aveyyākaraṇa là trình bày theo từng mục). 0 tiền lệ cho hai khoá này trong tầng.
    4.1 imesu ca ṭhānesu là sáu điểm (Sujato: these six grounds); giữ đủ sáu mục khổ, tập khởi, diệt tận, con đường đưa đến diệt tận.
    Tầng vietnamese-current vắng. Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
