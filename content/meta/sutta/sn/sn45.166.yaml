notes:
  - >-
    **Dùng lại nguyên văn đã duyệt:** `Sāvatthinidānaṁ.` → *Tại Sāvatthī.*
    (`an4.51:1.1`) · năm căn *Tín căn, tinh tấn căn, niệm căn, và định căn*
    (`an4.151:1.3`) · bốn căn xứ *xứ vô số hư không / xứ vô số thức / xứ vô sở
    hữu / xứ phi tưởng phi phi tưởng* (`an10.6:1.2`, `an3.116:2.3`/`3.3`) · câu
    *hoàn toàn vượt qua mọi tưởng về sắc…* (`an3.116:1.3`) · toàn bộ thang đạo
    quả (`an3.87:2.6`–`3.10`) · khung *“người ta gọi là … thế nào vậy?”*
    (`an3.76:1.2`–`1.3`) · tám bước diệt tận (`an10.240-266`) · *kiêng tránh sát
    sinh* (`an10.178:3.2`) và *nhảy múa, hát, nhạc, và xem các trò chơi*
    (`an4.198:9.3`).
  - >-
    **⚠ Năm bài này KHÔNG cùng hình dạng.** `sn45.163`/`164` chỉ có danh từ
    (`Kāmāsavo, bhavāsavo, avijjāsavo`) còn `sn45.166`/`167`/`168` **tự lặp danh
    từ** (`Rāgo khilo, doso khilo, moho khilo`). Bản đầu tôi dùng chung một danh
    sách, ra *là tham là rỡ rạc, sân là rỡ rạc* và tự mâu thuẫn ngay trong một
    vế. Đã dựng lại đúng hình dạng từng bài.
  - >-
    `mala` → *ô nhiễm* (theo `an3.10:0.3` *Kinh Ô Nhiễm*), `khila` → *rỡ rạc*,
    `nīgha` → *tối tăm*, `āsava` → *lậu*, `bhava` → *hữu*; `bhavo` trong
    `kāmabhavo` → *hữu trong dục* theo nguyên văn `an3.76:2.1` (*hữu trong giới
    dục*).
  - >-
    **Quy ước dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
    `published` có `…` trong Pāli, chỉ **617** (40%) giữ đúng số, và cặp lệch
