notes: |-
  Soạn từ Pāli root, đối chiếu Anh Sujato: 20/20 khoá có nội dung đều có Anh;
  1.12 và 1.15 do `english-project` lấp (meta `published`). Không có bản Việt
  Thích Minh Châu (ngoài Pháp Cú, tầng `vietnamese-current` vắng mặt).
  Bốn cách trả lời về Như Lai sau khi chết dùng nguyên văn sn44.4:1.4-1.7 đã có
  ('có tồn tại' / 'không tồn tại' / 'vừa có vừa không' / 'phi tồn tại phi phi tồn tại')
  để bốn vị trí trong bài này khớp đúng bốn vị trí ở sn44, tránh bài tự mâu thuẫn.
  1.2-1.3 trùng Pāli sn16.2:1.2-1.4 nên dùng lại nguyên văn, chỉ viết hoa chữ
  đầu câu vì ở bài này không có khoá `Evaṁ me sutaṁ` đứng trước (Pāli không có,
  nên không tự thêm câu dẫn). 1.3 trùng Pāli an4.177:1.1.
  1.17-1.18 và 2.7-2.8 theo mn35:5.3-5.4, nguyên văn Pāli gần trùng.
  Tiền lệ đếm được: Saṁyutta Nikāya giữ Pāli 1074/1408 (sn16.1/16.2/16.8 vậy);
  `1. Kassapavagga` → 1. Phẩm Kassapa 3/3; `Evaṁ me sutaṁ—` không có ở bài này;
  `Sāvatthiyaṁ viharati` 70/130 chọn 'Trú ở'; bốn khoá `abyākataṁ bhagavatā`
  theo sn44.4/mn35/mn107.
  Tiền lệ cho câu hỏi bốn lần: 1.7 'Cái gì vô thường thì là khổ hay lạc' (mn22:26.4);
  1.9 'Cái gì vô thường, khổ và chịu biến đổi, có hợp lý để quán sát' (sn22.159:1.6);
  1.10 'Cái này là của tôi, cái này là tôi, cái này là tự ngã của tôi' (sn22.159);
  1.11 'Không phải vậy, bạch Thế Tôn' (sn22.150).
  2.2-2.5 giữ bộ bốn đã thành đa số trong tầng: Đây là khổ / nguyên nhân của khổ /
  sự diệt khổ / con đường đưa đến diệt khổ (mn109, mn22, sn22.150, sn35.10, sn35.28…).
  Ghi nhận bất định: 0.3 `Paraṁmaraṇasutta` không có tiền lệ trong tầng; dịch
  theo nghĩa `paraṁ maraṇā` (sau khi chết, 65 khoá) thành Kinh Về Sau Khi Chết.
  `neva hoti na na hoti` dịch 'phi tồn tại phi phi tồn tại' theo sn44.4 dù hiểm
  khó đọc — đây là cách tầng đã dùng cho bốn vị trí này, không phải lựa chọn mới.
  Không có `…pe…` trong bài này nên không có quyết định nào về dấu lược; nháy kép là
  danh sách xuyên suốt bài (1.4–1.6, 1.7–1.9, 1.10–1.12, 1.13–1.15, 1.16–1.18,
  2.1–2.5, 2.6–2.8) đúng như Pāli.
  triangulation 8.3 chứ không cao hơn: hai khoá 1.12 và 1.15 lấp từ `english-project`
  cũng do chính tác giả này chấm, nên không phải một lần đọc Anh độc lập; `validate`
  cũng sẽ cảnh báo khi tầng lấp và tầng Việt trùng `assessed_by`.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
