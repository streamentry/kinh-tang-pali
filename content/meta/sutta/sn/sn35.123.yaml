  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    **Mười bài anh em đã `published` có cùng Pāli hoặc cùng khung**, và bản Việt dùng lại **nguyên văn** của chúng: `sn22.111`/`sn22.112` (đúng Pāli `sn23.9`/`sn23.10`) · `sn29.10` (khung dāna-khetta, `sn29.3`/`sn29.11-20`) · `sn29.6` (`vossaṭṭhakāyā`) · `sn34.1` (khung bốn loại người tu định, `sn34.55`) · `sn34.6`/`sn34.7`/`sn34.15` (`gocarakusalo`, `abhinīhārakusalo`) · `sn34.53`/`sn34.54` (`sakkaccakārī`, `sātaccakārī`, `sappāyakārī`) · `sn35.78` (`anattā … chando pahātabbo`, `sn35.164`) · `sn35.166` (`kathaṁ nu kho, bhante, jānato …`, `sn35.165`/`sn35.167`) · `sn36.24`/`sn36.26` (cụm cảm thọ, `sn36.23`) · `sn38.8` (khung hỏi–đáp với Sāriputta, `sn38.2`/`sn38.4`/`sn38.7`) · `sn23.11` (`Nibbindaṁ virajjati…`, `sn35.60`) · `sn48.47` (`'khīṇā jāti…'`) · `sn45.42-47` (câu hỏi `samaṇe gotame`, `sn38.4`). **Những chỗ viết khác đều ghi rõ trong `notes` của từng bài.**
  - >-
    **Danh sách song song trong lát này đã bị lệch một chỗ và đã sửa** — ghi lại vì đó là loại lỗi mà máy không bắt được: ba danh sách được sinh bằng vòng lặp (mười món cho ở `sn29.11-20`, chín loại hương ở `sn31.4-12`, mười món cho ở `sn31.23-112`). Một `range` lệch một đơn vị làm **cả danh sách** dịch sai từ đó trở đi mà vẫn qua mọi chốt tự động. Đã đối chiếp từng khoá với Pāli sau khi sửa.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên **49.374 segment đã `published`**: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Khớp **49.179 / 49.374 = 99,14%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ (`hay` được miễn vì `vā…vā…vā` là cấu trúc).
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Sn 45–56 đã đủ: `Paṭhamamāravagga` → *1. Phẩm Ma Rối Lần Nhất* (`sn23.8`) · `Nāgavagga` → *1. Phẩm Rồng* (`sn29.1/10`) · `Supaṇṇavagga` → *1. Phẩm Kim Sí Điểu* (5 bài; `sn30.1` ghi *Phẩm Rồng* — **lệch**) · `Gandhabbavagga` → *1. Phẩm Càn-thát-bà* (3 bài) · `Jhānavagga` → *1. Phẩm Thiền Định* (`sn34.1`) · `Avijjāvagga` → *6. Phẩm Vô Minh* (`sn35.59`) · `Channavagga` → *9. Phẩm Channa* · `Yogakkhemivagga` → *11. Phẩm An Ổn Khỏi Ách* · `Navapurāṇavagga` → *15. Phẩm Cũ Mới* · `Nandikkhayavagga` → *16. Phẩm Đoạn Tận Hoan Hỷ* · `Devadahavagga` → *14. Phẩm Devadaha* · `Jambukhādakavagga` → *1. Phẩm Jambukhádaka*. **Ba phẩm 0 tiền lệ:** `Lokakāmaguṇavagga` → *12. Phẩm Dục Thuộc Thế Gian* · `Samuddavagga` → *18. Phẩm Biển* · `Khandhavagga` → *Phẩm Uẩn* (chỉ xuất hiện ở uddāna `sn34.55`). **Chỗ đang phân kỳ trong kho:** `Aṭṭhasatapariyāyavagga` — `sn36.28` ghi *Bát Pháp Chân Đắc*, `sn36.24/25/26` ghi *Một Trăm Linh Tám Cách*, `sn36.29/30` ghi *Tám Trăm Lần*; bài này theo `sn36.28` vì cùng nhóm số thứ tự. **Người biên tập nên thống nhất.**
  - >-
    Cùng khung với `sn35.122` (xem ghi chú bài đó), chỉ `saṁyojana` → `upādāna`. Bài này **có** dòng kết phẩm `1.12` mà `sn35.122` không có, nên bản dịch phải có.
  - >-
    0 tiền lệ, đặt mới: `Upādāniyadhammasutta` → *Kinh Pháp Đáng Tham Trữ*; `Yo tattha chandarāgo taṁ tattha upādānaṁ` → *Sự ham muốn và tham với chúng, thì đó là sự tham trữ* (`upādāna` giữ *tham trữ* như `sn51.7*`, khác `saṁyojana` = *chấp thủ*).
  - >-
    Uddāna `2.0–2.6` dịch chữ, **độ chắc thấp**: `Mārapāsena dve vuttā, lokakāmaguṇena ca` → *Bằng tên gọi Ma, đã nói hai bài, cùng với dục của thế giới*; `Sakko pañcasikho ceva, sāriputto ca rāhulo` → *Sakka, Pañcasikha, Sāriputta và Rāhula*. **Người biên tập nên kiểm** — `sn35.116–121` chưa dịch.
