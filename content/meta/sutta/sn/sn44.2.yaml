notes: |-
  Đợt 19, lát l32. Dịch từ Pāli root đã ghim, đủ 100/100 khoá, không khoá nào ngoài tập khoá Pāli; đối chiếu bản Anh Sujato đã ghim ở mức từng segment, lớp lấp `english-project` của chính dự án (14 khoá Sujato để trống), và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (Bình Anson hiệu đính) ở mục tra cứu toàn văn — bản này không căn lề theo segment, chỉ dùng để đối chiếu thuật ngữ và mạch lập luận.

  **Trạng thái `draft` — vì sao.** Coverage Sujato đo thật trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`, theo `source/layers.yaml`): mẫu số **49**, Sujato phủ **35/49 = 0,7143**, dưới sàn 0,80. 14 khoá có nội dung do Sujato để trống: `2.5` `2.6` `2.7` `2.8` `2.10` `2.11` `2.12` `2.14` `2.15` `2.16` `2.17` `2.18` `2.19` `17.10` — chính là đoạn Anurādha kể lại cuộc trò chuyện với các du sĩ cho Đức Thế Tôn, cộng câu hỏi chốt `17.10`. Lớp lấp `english-project` (`content/meta/en/sn/sn44.2.yaml`, status `published`) bù đủ 14/14, nên cổng đếm tổng hai tầng là 49/49 = 1,0000; nhưng theo luật của lát, lớp lấp không được coi là một lần đọc Anh độc lập với bản Việt này. Vì vậy Sujato dưới 0,80 thì bài giữ `draft` kèm blocker, `triangulation` đặt 7,8 (≤ 8,0), không nâng điểm để né. Tầng `vietnamese-current` không có bài này (manifest ghim chỉ 26 tệp Pháp Cú): đó là giới hạn của ảnh chụp upstream, không phải thiếu sót của kho. Muốn lên `review`/`published`, cần một lần đọc Anh độc lập cho 14 khoá trên (hoặc người biên tập quyết định cổng nên tính lớp lấp là độc lập); bản Việt không đổi theo quyết định đó.

  **Pāli trùng nguyên văn trong tầng đã dịch** (`sn`/`mn`/`dn`/`an`): 62/100 khoá của bài này có Pāli trùng nguyên văn (sau khi chuẩn hoá khoảng trắng) với khoá ở nơi khác, tổng **5.020** cặp, trong đó **3.351** cặp bản Việt khác — phần lớn là khác diễn đạt trên cùng nghĩa hoặc khác vị ngữ. 47/62 khoá dùng đúng cách dịch đa số toàn tầng; các khoá còn lại tách hai loại. Khác đa số toàn tầng nhưng theo đa số ở `sn` hoặc `sn22` (cùng cặp với `sn22.86`, bài Anurādha song song): `5.1` `11.1` *Cái gì vô thường là khổ hay lạc?* (toàn tầng 20 so với 31 của dạng có thêm dấu phẩy; trong sn 16 so với 11, trong sn22 5 so với 4); `7.1` `13.1` *chịu sự biến hoại, có hợp lý chăng khi quán xét điều ấy* (toàn tầng 5 so với 32 của *có tính biến đổi, có nên xem như vầy*; trong sn22 6/8 theo dạng đã chọn, trong sn 9 so với 13); `7.2` `13.2` *Cái này là của tôi, cái này là tôi, cái này là tự ngã của tôi* (toàn tầng 27 so với 31 của *đây là của ta … đây là ngã của ta*; trong sn22 8/18 theo dạng đã chọn); `15.8` *không còn gì là tự thân nữa* (**114** khoá so với 113 khoá *trạng thái*, trong sn là 112 so với 39, trong sn22 là 32 so với 5 — đa số rõ ràng ở sn). Các khoá còn lại khác đa số vì ngữ cảnh hoặc chỉ có 1–3 tiền lệ: `9.1`, `9.4`, `15.3`, `15.4`, `15.5`, `16.19`, `16.21`, `2.14`.

  Pāli trùng nguyên văn **trong chính bài**: 8 nhóm, **103** cặp, **0** cặp bản Việt khác. Nhóm lớn nhất `No hetaṁ, bhante`. (14 khoá: `8.1` `14.1` `16.3` `16.5` `16.7` `16.9` `16.11` `16.14` `16.16` `16.24` `16.26` `17.3` `17.6` `17.11`, 91 cặp), nhóm `Taṁ kiṁ maññasi, anurādha,` (4 khoá `3.1` `16.12` `17.1` `17.4`, 6 cặp), và năm nhóm cặp đôi (`4.1`/`10.1`, `5.1`/`11.1`, `6.1`/`12.1`, `7.1`/`13.1`, `7.2`/`13.2`) cùng `2.9`/`2.13`. `16.1` và `17.4` ở dạng khác Pāli một dấu nháy mở nên không tính là trùng nhưng được dịch cùng câu, chỉ khác dấu nháy theo Pāli từng khoá.

  **Thuật ngữ — đếm trước khi chốt.**
    - `tathāgato` → *Như Lai*. Bốn lập trường: *Như Lai tồn tại / không tồn tại / vừa tồn tại vừa không tồn tại / phi tồn tại phi phi tồn tại sau khi chết* — theo `sn22.86` và `sn44.8` (*phi tồn tại phi phi tồn tại*), cùng quy ước với *phi tưởng phi phi tưởng*.
    - `paññāpayamāno paññāpeti` / `paññāpemi` → *tuyên bố*, nhất quán trong cả bài (1.5, 1.7, 2.8, 2.12, 17.8, 17.13); cùng chọn với `sn22.86`.
    - `uttamapuriso paramapuriso paramapattipatto` → *bậc tối thượng, bậc cao quý nhất, đã đạt đến chỗ tối thượng* (sn44.9:2.5, 3.8, 4.4 và sn22.86).
    - `aññatitthiyā paribbājakā` → *du sĩ ngoại đạo*; `araññakuṭikā` → *túp lều nơi hoang vắng* (cùng `sn22.86`).
    - `vedanā` → *cảm thọ* (như sn22.86; trong sn22, khoá Pāli mở đầu bằng `vedanā` dịch *cảm thọ* 78 so với *thọ* 31), `saññā` → *tưởng*, `saṅkhārā` → *các hành*, `viññāṇa` → *thức*.
    - `bhante` → *bạch Thế Tôn*; `āvuso` → *hiền giả* khi gọi một người, *các hiền giả* khi gọi cả nhóm du sĩ; Đức Phật gọi Anurādha là *ngươi* (5/5 khoá `Taṁ kiṁ maññasi, anurādha` đã dịch, đều ở sn22.86).
    - `nibbindati` → *chán nản* (trong sn22 8/9 khoá chứa Pāli `sutavā ariyasāvako rūpasmimpi nibbindati` dùng *chán nản*, toàn tầng 12 so với *nhàm chán* 1); bản Thích Minh Châu viết *nhàm chán*. Đây là quy ước của tầng, không phải lựa chọn riêng của bài này; người biên tập có thể cân nhắc thống nhất lại.
    - `sutavā ariyasāvako` → *bậc Thánh đệ tử đa văn* (trong sn22 8/9 khoá cùng Pāli có *đa văn*; có bài ghi *bậc Thánh đa văn* không có *đệ tử*, bài này giữ cả hai vế của `ariyasāvako`).
    - `yaṁ kiñci … sabbaṁ` ở 15.1–15.5 → *bất cứ … tất cả … ấy đều phải được thấy như thật bằng chánh trí tuệ* (11 khoá toàn tầng cùng công thức `yaṁ kiñci rūpaṁ …`: *bất cứ* 5, *mọi* 3, *phàm* 2, *sắc gì* 1; `mn35:24.8` *mọi tưởng …* dùng *mọi*); bài này dùng *bất cứ* nhất quán cho cả bốn uẩn.
    - `kallaṁ nu` → *có hợp lý chăng* (7.1, 13.1, 17.7); `samanupassasī` → *ngươi có xem … chăng* (như sn22.86; bản Thích Minh Châu *quán*).
    - `vuttavādī … dhammassa cānudhammaṁ byākareyyaṁ … sahadhammiko vādānuvādo gārayhaṁ ṭhānaṁ āgaccheyya` (2.3, 2.19) → *nói đúng lời Đức Thế Tôn, … giải thích đúng chánh pháp, … không có lập luận hợp pháp nào đưa đến chỗ đáng bị chê trách* (như sn22.86 và sn45.5, sn42.10, sn12.25).
    - `rūpasmiṁ tathāgato` / `aññatra rūpā tathāgato` (16.13–16.25) → *Như Lai ở trong sắc / ở ngoài sắc* (định vị Như Lai trong hay ngoài uẩn, như `sn22.86:9.2–9.13` và bản Thích Minh Châu *ở trong / ở ngoài*), khác ngữ cảnh *Với sắc … với kẻ chưa hết tham* của `sn44.5` (nên không dùng *Với tưởng …* ở 16.19).

  **Số Pāli.** `catūsu ṭhānesu` / `catūhi ṭhānehi` = catu **4** → *bốn trường hợp*; danh sách đủ đúng bốn mục (hoti / na hoti / hoti ca na ca hoti / neva hoti na na hoti). `Dutiyaṁ` = **2** → *Thứ hai* (bài thứ hai của Phẩm Không Tuyên Bố; sn44.3 là bài thứ ba). `ekamantaṁ` = *một bên*. Không có số lớn, không có cụm số chưa phân xử.

  **Bất định đã ghi — không đưa vào thân kinh.**
    - **Chủ ngữ của `taṁ tathāgato … paññāpayamāno paññāpeti` (1.5, 1.7, 2.8, 2.12, 17.8).** Pāli đặt `tathāgato` ở chủ cách và `taṁ` (vị ấy) ở đối cách. Sujato đọc *khi một vị Như Lai tuyên bố về một vị Như Lai*; bản Thích Minh Châu đọc *Như Lai ấy đã được trình bày* (thể bị động). Bản Việt giữ đúng cấu trúc tương liên của Pāli (*vị Như Lai nào … thì khi Như Lai tuyên bố về vị ấy, Như Lai tuyên bố …*), không chọn nghĩa nào trong hai.
    - **Dấu hỏi ở `1.6`, `2.10`.** Pāli kết `vā”ti?` (1.6) và `vā’ti?` (2.10) ở hai khoá mà Sujato và Thích Minh Châu đều dịch như lời trình bày, không phải câu hỏi; `1.8` và `2.14` kết dấu chấm. Bản Việt kết bằng dấu chấm ở cả bốn khoá. Ngược lại `2.3`, `2.19` (`kathaṁ … nu`) và `17.10` (`kallaṁ nu te taṁ veyyākaraṇaṁ`) thật sự là câu hỏi nên giữ dấu hỏi.
    - **`1.8` dấu nháy.** Pāli của `1.8` viết ba vế đầu trong nháy đơn nhưng vế thứ tư `neva hoti na na hoti tathāgato paraṁ maraṇāti vā”ti` không có nháy đơn. Bản Việt giữ đúng như Pāli (ba cặp nháy đơn, vế thứ tư không nháy, một ngoặc đóng) chứ không tự cân; đây là khác biệt dấu câu của tầng Pāli, không có ý nghĩa nội dung.
    - **`17.2`.** Pāli `rūpaṁ, vedanaṁ, saññaṁ, saṅkhāre, viññāṇaṁ tathāgatoti samanupassasī` — Thích Minh Châu đọc là gộp cả năm uẩn lại là Như Lai (*Ông có quán Như Lai là sắc, thọ, tưởng, hành, thức hay không?*); Sujato đọc *one who has form …* (người có sắc …). Bản Việt giữ nguyên danh sách liệt kê (*xem sắc, cảm thọ, tưởng, các hành, thức là Như Lai*) và không chọn nghĩa nào. `17.5` `ayaṁ so arūpī … aviññāṇo` → *cái ấy, không có sắc, … không có thức* (Sujato *that one who is without form*; Thích Minh Châu *Như Lai là không có sắc …*); `ayaṁ so` dịch *cái ấy*, không *người ấy*, vì Pāli không nói là người.
    - **`17.7` `ettha … saccato thetato … anupalabbhiyamāne`** → *như một sự thật chắc chắn* (mn22:25.5, an3.61:3.2; Sujato *genuine fact*); bản Thích Minh Châu đọc *một cách chân thật, một cách xác chứng*. Bản Việt giữ nghĩa *thật, chắc chắn*.
    - **`17.13` *điều Ta tuyên bố chỉ là khổ và sự chấm dứt khổ*** theo mn22:37.5 và sn22.86:13.2 cho cùng câu; Sujato không dịch *chỉ* (`what I describe is suffering and the cessation of suffering`), còn bản Thích Minh Châu viết *Ta chỉ nói lên sự khổ và sự diệt khổ*. Chữ *chỉ* là của tiền lệ, không phải của riêng bài này.
    - **`15.8` `nāparaṁ itthattāya`** → *không còn gì là tự thân nữa*, theo đa số ở sn (112 so với 39 của *trạng thái*). Đây là quy ước của tầng và **không** sát nghĩa chữ `itthattāya` (*trạng thái này / cõi này*); Sujato dịch *there is nothing further for this place*, bản Thích Minh Châu *không còn trở lui trạng thái này nữa*. Chưa sửa theo luật *đo tiền lệ trước khi sửa*; người biên tập có thể cân nhắc thống nhất lại toàn tầng.
    - **Sujato mở rộng im lặng ở `15.1`** (`So, Anurādha, you should truly see …`) — bản Việt không bám theo chữ nào Pāli không có.
    - **Công thức lặp `1.5`–`1.8` so với `2.8`–`2.14`.** Các vế Anurādha kể lại cho Đức Thế Tôn (`2.9`, `2.13`, `2.10`, `2.14`) có dấu lược `…pe…` của Pāli; bản Việt giữ đúng một `…` mỗi khoá có `…pe…` (15 khoá) và không bung ra, kể cả ở `2.9`/`2.13` nơi lớp lấp Anh có chữ.
    - **Chuẩn dấu nháy.** Bản Việt bám đúng Pāli từng khoá: 100/100 khoá có số `“` `”` `‘` `’` bằng Pāli; các ngoặc mở ở `1.5`, `1.7`, `2.2`, `3.1`, … không tự cân trong từng khoá.
    - **Lỗi ngoài lát, báo không sửa:** cụm *Tứ Thế Tôn* xuất hiện trong bản Việt của `sn44.3` (32 lần) và `sn44.5` (3 lần) ở chỗ Pāli là `tathāgato` — 4 tệp toàn tầng; có vẻ là sai chữ so với *Như Lai* của bài này và `sn44.8`.

    technical_integrity 9.6: môi trường lát này không cho chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`; bốn lệnh đó chưa chạy cho bài này, người điều phối chạy trước khi gộp. Bài tự kiểm bằng phép đo riêng: đủ 100/100 khoá, 0 khoá thừa, 0 khoá để trống, NFC, đúng thứ tự khoá Pāli, 0 lệch số dấu nháy theo từng khoá, 15/15 khoá `…pe…` ở Việt giữ đúng một `…`, 0 Pāli lọt sang Việt (trừ tiêu đề `Saṁyutta Nikāya` ở 0.1), Coverage Anh tính lại bằng đúng công thức của `src/lib/canon/reference.ts` (Pāli ≥40 ký tự sau khi nén khoảng trắng, bỏ khối tham chiếu `:0`).
