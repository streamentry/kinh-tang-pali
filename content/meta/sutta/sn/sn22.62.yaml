notes: |-
  **ĐỌC TOÀN BỘ PĀLI 44 KHOÁ TRƯỚC KHI VIẾT**, in lại từng cặp Pāli↔Việt sau khi ghi.

  **⚠ COVERAGE TẦNG ANH 21/28 = 0.75 < 0.8 ⇒ `draft`.** Bản Anh Sujato đã ghim để trống bảy
  khoá Pāli có nội dung: `:2.2` `:3.3` `:6.2` `:7.3` `:10.2` `:11.3` `:13.5`. Sáu trong bảy
  chỉ là vế lặp `na tassā/tesaṁ saṅkhā ‘atthī’ti…`, nên **phải tự đứng vững bằng Pāli**.
  `content/meta/reference-gaps.yaml` chưa có entry cho `sn22.62` và tôi bị cấm sửa tệp đó
  ⇒ bài **bắt buộc `draft`**, `triangulation` 8.5 chứ không nâng.

  **TÊN PHẨM.** `Saṁyutta Nikāya 22.62` — 1492/1492 tệp `sn` đã dịch giữ đúng dạng này (tuyệt
  đối không `Saṡyutta`). `6. Upayavagga` → *6. Phẩm Dính Mắc*: đo được **2** tệp đã dịch
  cùng phẩm này (`sn22.53:0.2`, `sn22.61:0.2`) và cả hai đều là *Phẩm Dính Mắc*; đó cũng là
  điểm đã được ghi trong `sn22.61.yaml`. `Niruttipathasutta` → *Kinh Định Nghĩa* (Sujato: *The
  Scope of Definition*), theo khuôn *Kinh <tên>* của tầng.

  **BỐN BỘ DANH XƯNG — `saṅkhā` / `samaññā` / `paññatti`.** Đây là tam bộ định danh; tôi
  dùng *danh xưng* / *tên gọi* / *chỉ báo*, khớp `dn15:22.6` (*phạm vi của danh xưng, ngôn ngữ
  và khái niệm*) và Sujato (*designation, label, description*). Ba mốc thời gian giữ
  nguyên ba từ của Pāli: `atīta niruddha vipariṇata` → *đã qua, đã dứt, đã biến đổi*;
  `ajāta apātubhūta` → *chưa sinh, chưa hiện*; `jāta pātubhūta` → *đã sinh, đã hiện*.

  **`‘ahosī’ti` VÀ `‘ahesun’ti` — ĐÃ CỐ Ý DÙNG CHUNG MỘT CHỮ.** Pāli phân biệt số ít
  (`ahosī`) và số nhiều (`ahesun`); tiếng Việt không mang phân biệt ấy, nên tôi dùng **‘đã
   là’** cho cả hai (Sujato cũng dịch cả hai là *was*). Bản nháp đầu của tôi dùng *‘đã có’*
  cho số ít và *‘đã là’* cho số nhiều — tạo ra một khác biệt **không có** trong Pāli. Đã sửa
  (15 khoá).

  **DÙNG LẠI NGUYÊN VĂN / THEO TIỀN LỆ.** `Sāvatthinidānaṁ.` → *Tại Sāvatthī.* (`sn22.61:1.1`) ·
  `6. Upayavagga` → *6. Phẩm Dính Mắc* (`sn22.61:0.2`) · `:1.2` và `:13.1`
  `asaṅkiṇṇā asaṅkiṇṇapubbā, na saṅkīyanti, na saṅkīyissanti` → *vốn không trộn lẫn, chưa
  từng bị trộn lẫn, không bị trộn lẫn, không sẽ bị trộn lẫn* (`an4.30:2.1`) · `appaṭikuṭṭhā
  samaṇehi brāhmaṇehi viññūhi` → *các sa-môn, Bà-la-môn có thể biết đều không chê bai* ·
  `:13.2` cụm `ukkalā vassabhaññā ahetukavādā akiriyavādā natthikavādā … na garahitabbaṁ
  nappaṭikkositabbaṁ amaññiṁsu` → *những kẻ ở Ukkalā, những người huyên thuyên to tiếng,
  chủ trương vô nhân duyên, chủ trương không hành động, chủ trương hư vô, … không cho rằng …
  nên bị quở trách hay nên bị bác bỏ* (`an4.30:8.2`, cùng công thức gần như y hệt) ·
  `Katame tayo?` → *Ba là gì?* (`Katame aṭṭha?` → *Tám là gì?*, `dn15:35.2`) ·
  `Nindāghaṭṭanabyārosaupārambhabhayā` → *bị chê bai, bị công kích, bị khiêu khích, bị đổ lỗi*
  (Sujato: *blamed, attacked, provoked, faulted*) · `Tassuddānaṁ` → *Tóm lược phẩm thứ nhất:*
  (`sn22.159:4.0` dùng đúng khuôn *Tóm lược phẩm năm mươi thứ ba:* cho phẩm 53).

  **TÓM LƯỢC PHẨM (:14.1–14.5) — ĐỐI CHIẾU TÊN BÀI THẬT.** `Upayo`=*Dính Mắc* (`sn22.53`) ·
  `bījaṁ`=*Hạt Giống* (`sn22.54`) · `udānaṁ`=*Udāna* (`sn22.55`) ·
  `Upādānaparivattaṁ`=*Nhân Duyên* (`sn22.56`, tên gốc là `Upādānaparipavattasutta`) ·
  `sambuddho`=*Chánh Đẳng Giác* (`sn22.58`) · `mahāli`=*Mahāli* (`sn22.60`) ·
  `ādittā`=*Thiêu Đốt* (`sn22.61`) · `niruttipathena cāti`=*Phẩm này cùng với
  Niruttipatha* (chính bài này). Bốn tên riêng `Udāna`, `Sattaṭṭhāna`, `Mahāli`,
  `Niruttipatha` **giữ nguyên Pāli** vì chưa có bản Việt nào cho chúng, theo đúng cách tầng
  đang làm với `Rādha`, `Surādha`, `Devadaha`; khai trong bộ nhớ tiến trình.

  **NGOẶC KÉP.** `“` mở ở `:1.2`, `”` đóng ở `:13.4`. Cân trên cả bài. Nháy cong `‘…’`
  chỉ đánh dấu ba từ trong `‘ahosī’ti`, theo đúng Pāli.

