notes: |-
  BÀI NÀY HẦU NHƯ TOÀN BỘ LÀ BÀI KỆ LIỆT KÊ TÊN, VÀ CÓ MỘT BẪY THẬT.
  BẪY. Ba vế 2.1, 2.2, 2.3 TRÙNG NGUYÊN VĂN với `sn46.111-120` (phẩm Tìm Kiếm, bài 12) —
  cùng danh sách tên mười bài, chỉ khác `vedanā…` ở vế thứ tư. Bản nháp tự dịch lần hai ở cả ba
  vế. Đã sửa thành dùng lại NGUYÊN VĂN của sn46.111-120: "Tìm kiếm, quy định, thọ lậu," /
  "sự trở thành, khổ, và ba sự này;" / "vô ích, nhiễm ô, và tối tăm,". Vế 2.4 ở đây viết
  `Vedanātaṇhā` (không có khoảng cách) còn ở sn46.111-120 là `Vedanā taṇhā` — khác đúng một dấu
  cách, cùng một công thức, nên cũng theo lại: "cảm thọ, khát ái, và khát, là vậy."
  GHI RÕ VỀ TẦNG, KHÔNG TỰ SỬA. Tầng hiện có bốn cách dịch cạnh tranh cho các vế này ở
  sn47/sn48/sn50/sn51/sn53 ("Tìm kiếm, sự quyết định, lậu," / "hữu và ba sự khổ," / "rỡ rạc, ô
  nhiễm, tối tăm," — 5 tệp) và một cách nữa ở sn49.35-44 và sn45.170. Tôi theo sn46.111-120 vì
  đó là bài cùng phẩm và cùng danh sách, chứ không theo đa số 5 vì đa số ấy nằm ở những phẩm
  KHÁC (Gaṅgā, Āyatanika…) và đã tự lệch nhau. Việc chuẩn hoá tám tệp kia là của người biên tập,
  không phải việc của lát này.
  Dấu lược: 1.1 là `…pe…` nên giữ MỘT `…` và KHÔNG mở rộng, dù Sujato dịch thành
  "(Tell in full as in SN 45.161–170.)" — đó là chú thích của người dịch, không phải lời kinh, đưa
  vào thân kinh là thêm chữ không có nguồn. Tiền lệ: 4 tệp sn46 cùng cục đều viết `…`.
  Tiêu đề: `Punaesanāvagga` → "Phẩm Lại Tìm Kiếm" theo khuôn `Puna…` đã có (sn46.175-184
  "Punaoghavagga" → "Phẩm Dòng Chảy Lại"; sn46.143-152 "Punabalakaraṇīyavagga" → "Phẩm Lại Luyện
  Tập Sức Lực"). `Punaesanādisutta` dùng lại nguyên văn của sn50.89-98 vì trùng y hệt.
  `Uddānaṁ` → "Tóm lược:" (4 tiền lệ sn46). `Punaesanāvaggo sattarasamo.` → "Phẩm Lại Tìm
  Kiếm, thứ mười bảy." theo khuôn `Esanāvaggo dvādasamo.` → "Phẩm Tìm Kiếm, thứ mười hai."
  Sujato có mặt nhưng để trống toàn bộ khối 2.0–2.4 và dịch 1.1 bằng chú thích tiếng Anh — nên ở
  đây Pāli phải tự đứng vững, và nó đứng được. Vì `cần` RỖNG, tôi tự quét MỌI khoá — sạch. Không
  chạy npm (đợt này cấm) nên technical_integrity = 9.6.
