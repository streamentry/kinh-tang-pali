notes: |-
  Đã đọc HẾT `vc/p75.txt` trước khi viết. Đây là bài **công thức lặp đúng nghĩa**: ba khối
  `2`, `3`, `4` chỉ khác nhau ở chủ thể (*vị tỳ-kheo nào* / *Kassapa*) và ở có `na` phủ định hay
  không. Đã dịch từng khoá và dùng lại y nguyên văn cho các khoá trùng nhau, để bài không tự
  mâu thuẫn.

  MỆNH ĐỀ ĐO LẠI: `:0.1` `Saṁyutta Nikāya 16.4` (`ṁ` = U+1E41). `:0.2` ⇒ `1. Phẩm Kassapa`
  (7/7). `:0.3` `Kulūpakasutta` ⇒ **Kinh Đến Các Gia Đình** — 1 tiền lệ, `an5.111:0.3`, **cùng
  Pāli**, nên lấy y nguyên văn. `:1.1` `Sāvatthiyaṁ viharati.` ⇒ **Trú ở Sāvatthī.** (79/141;
  cũng là cách `sn16.1:1.1`, `sn16.3:1.1`, `sn16.6:1.1` dùng ngay trong phẩm này).

  DÙNG LẠI Y NGUYÊN VĂN TRONG CHÍNH BÀI: `3.3`–`3.7` ≡ `2.2`–`2.6`; `4.2`–`4.7` ≡ `3.2`–`3.7`.
  `:4.13` lấy theo đúng công thức đã dùng ở `sn16.1:6.5` và `sn16.3:8.5` (cùng phẩm, đã
  `published`): *Ta sẽ khuyến dạy các ông bằng tấm gương của Kassapa…* `:4.14` `Catutthaṁ.` ⇒
  **Thứ tư.** (153/252).

  0 TIỀN LỆ, ĐẶT MỚI, GHI KÈM LÝ DO:
  · Cả danh sách năm ý ở `2.2`–`2.6` (và lặp ở `3`, `4`) **không có bản Việt nào** trên tầng
    với đúng Pāli này. Đặt mới: `dentuyeva me, mā nādaṁsu` ⇒ *Xin hãy bố thí cho tôi, đừng có bỏ
    mặc không cho* (`mā nādaṁsu` là mệnh lệnh cầu, không phải phủ định tuyệt đối — đó là điểm
    mà Sujato cũng dịch *may they not fail to give*); `paṇīta`/`lūkha` ⇒ *cao quý / thô kệch*
    (Hán–Việt quen thuộc, giữ được cặp nghĩa); `sīgha`/`dandha` ⇒ *mau / chậm*;
    `sakkacca`/`asakkacca` ⇒ *chu đáo / cẩu thả* — theo `mn35:1` đã dùng *cho cẩu thả chứ không
    cẩn thận*, cùng hướng.
  · `sandīyati` (`:2.7`, `:2.10`, `:2.11`) — **0 tiền lệ**; nghĩa là *bị xúc phạm, bực bội*.
    Chọn **bực bội** vì tầng đã dùng *bực bội* cho `anattamanā` (`kn`/`mn`), nên `3.1` của tỳ-kheo
    này và `2.7` của người kia đọc liền nhau.
  · `tatonidānaṁ dukkhaṁ domanassaṁ paṭisaṁvedayati` ⇒ *phải cảm nhận đau khổ và buồn khóc*;
    có `na` thì *không phải cảm nhận*. Giữ đúng phủ định ở cả sáu khoá `:3.8`–`:3.12`, `:4.8`–`:4.12`.
  · `na arahamti`-không: `:2.12` *không đáng đến gần các gia đình* đối lập với `:3.13` /
    `:4.13` *đáng đến gần các gia đình* — không dịch nhạt điểm này.

  DẤU LƯỢC: Pāli có `…pe…` ở `1.4` và `2.8`, và `…` trần ở `2.9`; mỗi khoá Việt giữ **đúng
  một** `…`, không mở rộng. Ba khoá khác không có dấu lược.

  COVERAGE: substantive **23** khoá, Sujato đã ghim có tiếng ở **cả 23** ⇒ **23/23 = 1,000**,
  vượt ngưỡng 0,8 nên không cần entry trong `content/meta/reference-gaps.yaml`. Tầng
  `vietnamese-current` không có cho bài này (bilara tại commit đã ghim chỉ có Pháp Cú).

  `technical_integrity` 9.6: cổng kỹ thuật do coordinator chạy; tự kiểm qua `_hvi.kiểm()` — 0 lỗi.
