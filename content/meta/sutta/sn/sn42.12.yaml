notes: |-
  Bản dịch mới từ Pāli root (snapshot SuttaCentral/Bilara đã ghim), đối chiếu bản Anh của Bhikkhu Sujato và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không phân đoạn, dùng để tra nghĩa, không căn lề vào segment). Bài: Kinh Với Rāsiya (Rāsiyasutta), bài thứ mười hai của Phẩm Làng, phẩm duy nhất của Tương Ưng Thôn Trưởng (sn42). 169/169 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập khoá Pāli.

  BÀI SONG SONG: an10.91 (Kinh Anāthapiṇḍika) có cùng khung mười hạng người hưởng dục, đã published; các cụm `adhammena bhoge pariyesati sāhasena`, `attānaṁ sukheti pīṇeti`, `saṁvibhajati puññāni karoti`, `gārayho`/`pāsaṁso`, `iminā paṭhamena ṭhānena` đều dùng lại cách dịch của bài đó (đáng bị chê trách / đáng được khen; vì điểm thứ nhất này; chia sẻ, làm các công đức), chỉ đổi `gahapati` thành `gāmaṇi` (thôn trưởng). Khác biệt có chủ ý so với an10.91: Pāli ở bài này không có nháy đơn quanh các câu `…ti, iminā … ṭhānena`, nên bản Việt không thêm nháy; câu được nối bằng dấu chấm phẩy.

  COVERAGE ENGLISH (đo thật): Pāli có nội dung (từ 40 ký tự sau nén khoảng trắng, bỏ khối :0.x) = 137 khoá. Bản Sujato phủ độc lập 137/137 = 1,000, trên ngưỡng 0,80 của cổng (bản Sujato có chữ ở 168/169 khoá; chỉ khoá 23.4, lời kết `Dvādasamaṁ`, để trống). Không có lớp english-project cho bài này (không có tệp bản dịch lẫn tệp meta), nên không khoá nào do dự án tự bù: toàn bộ coverage là English độc lập. Tầng vietnamese-current: không có ở mức segment (bilara tại commit ghim chỉ phân phối Pháp Cú); bản Thích Minh Châu chỉ có dạng nguyên bài, đã đọc nhưng không căn lề.

  SỐ ĐẾM VÀ SỐ THỨ TỰ (tự tính, so thứ tự từng khoá): `tayo`/`tisso`/`tīhi` = 3, `dve`/`dvīhi`/`ubho` = 2, `ekena` = 1, `catūhi` = 4, `aṭṭhaṅgiko` = 8, `paṭhama`/`dutiya`/`tatiya`/`catuttha` = thứ nhất/hai/ba/tư, `Dvādasamaṁ` = dvā 2 + dasa 10 = 12, dịch `Thứ mười hai` (khớp 30 khoá cùng Pāli ở tầng). Quét tự động: 104 khoá có số trong Pāli hoặc Việt, 0 khoá lệch về giá trị hay thứ tự. Tổng kết 10 hạng của phần hưởng dục (3 + 3 + 4) và các câu `X điểm bị chê, Y điểm được khen` đã đối chiếu từng cặp (6.2, 7.2, 8.2, 9.2, 10.2, 11.2, 12.2, 13.2, 14.2, 15.3): số điểm được khen cộng bị chê khớp với số mục liệt kê ngay bên dưới ở mọi khoá.

  PĀLI TRÙNG NGUYÊN VĂN TRONG CHÍNH BÀI: 27 nhóm Pāli trùng (đã bỏ qua khác biệt dấu phẩy), 0 nhóm Việt khác nhau; dùng lại nguyên văn (ví dụ 3.4/3.6, 4.1/4.3/4.5, 5.1/5.3/5.5/5.8, 5.6/5.9, 5.10/15.2, 17.1/18.1, 16.4/17.2/18.2, 22.5/22.8/22.11). Khoá 4.1 và 4.5 chỉ khác một dấu phẩy ở Pāli; bản Việt giống hệt nhau.

  DẤU NHÁY: Pāli có dấu nháy ở 9 khoá (1.2, 1.3, 1.4, 16.4, 17.2, 18.2, 22.12, 23.2, 23.3); thứ tự và loại từng dấu ở bản Việt khớp Pāli từng khoá, 0 lệch. Nháy kép mở ở 1.2 và đóng ở 1.3 (lời Rāsiya); mở ở 1.4 và đóng ở 22.12 (lời Đức Phật, đúng Pāli, vượt qua nhiều khoá); mở ở 23.2 và đóng ở 23.3.

  DẤU LƯỢC: Pāli có hai khoá `…pe…` (2.6 và 23.2), không có `…` trần, không có `(…)`. Cả hai được giữ đúng một `…` (2.6: `chánh kiến … chánh định.`; 23.2: `Tuyệt diệu thay, bạch Thế Tôn …`), theo tiền lệ sn42.8:14.2. Với 2.6, đo trên 41 khoá Pāli cùng giá trị ở tầng: 24 khoá viết khai ra cả tám chi trước `… chánh định`, 16 khoá viết `chánh kiến … chánh định`, 1 khoá `chánh tri kiến … chánh định`; bài này theo dạng rút gọn đúng một `…` vì Pāli chỉ có `…pe…`, không có chữ của sáu chi ở giữa.

  THUẬT NGỮ (kèm số đếm):
  - `gāmaṇi` → thôn trưởng (khớp 11 tệp sn42.1 đến sn42.11 đã có). `kāmabhogī` → người hưởng dục (45 khoá Pāli chứa từ này ngoài bài; an10.91 là bài song song). `sāhasena` → cưỡng ép (36 khoá tầng).
  - `gārayho` → đáng bị chê trách; `pāsaṁso` → đáng được khen (theo an10.91).
  - `tapassī lūkhajīvī` → người tu khổ hạnh, sống khắc khổ: 0 tiền lệ cho `lūkhajīvī` đứng chung với `tapassī` (dn8 viết `lūkhājīvī`); theo Thích Minh Châu và dn8:2.2.
  - `nijjarā` → sự tiêu mòn: tầng có bốn dạng cho từ này (dn34 `căn cứ tiêu mòn`, an10.106 `bào mòn`, an3.74 `hủy diệt`, an4.195 `cạn dần`); chọn `tiêu mòn` (Sujato `wearing away`, dn34). Thích Minh Châu không dịch `nijjarā` mà gộp thành `pháp thiết thực hiện tại`; bản này theo Pāli.
  - Công thức `sandiṭṭhikā akālikā ehipassikā opaneyyikā paccattaṁ veditabbā viññūhi`: dùng dạng của 6 bài an khác cùng công thức (an3.40, an3.70, an3.75, an6.10, an11.11, an11.13): có thể thấy ngay trong hiện tại, không hề thời hạn, có thể đến xem, hướng thượng, mỗi bậc trí tự mình hiểu được.
  - `ādīnavadassāvī` → thấy nguy hại / `anissaraṇapañño` → không có tuệ thấy lối thoát: đo trên các khoá có `ādīnava`, tầng viết `hậu quả` 10 lần và `nguy hại` 9 lần; chọn `nguy hại` (dn25, mn99) và giữ `tuệ thấy lối thoát` theo an10.91.
  - `appeva nāma` → biết đâu (mn65:14.4, 15.4); Thích Minh Châu và Sujato dịch `mong rằng`/`hopefully`, nghiêng nghĩa mong muốn hơn.
  - `uttari manussadhammā alamariyañāṇadassanavisesaṁ` → pháp siêu nhân, tri kiến thù thắng xứng đáng bậc Thánh (mn26, mn65; 19 khoá tầng chứa cụm này).
  - `Evaṁ vutte` → Khi được nói như vậy (18 khoá sn dạng `Khi được nói`; sn42.8 dùng `Nói vậy xong`); `abhikkantaṁ, bhante …` → Tuyệt diệu thay, bạch Thế Tôn …; khoá 23.3 dùng nguyên văn sn42.8:14.3 (Pāli trùng nguyên văn).
  - `bhante` → bạch Thế Tôn; lời kể dùng Đức Thế Tôn theo sn42.1 và sn42.11 (cùng công thức mở đầu `Atha kho … gāmaṇi yena bhagavā tenupasaṅkami`).

  BẤT ĐỊNH VÀ CÁC CÂU NGHĨA ĐEN DỄ LỆCH VĂN CẢNH (không thêm vào thân kinh):
  - 3.1 `tayo kāmabhogino` (ba hạng) nhưng liệt kê mười tiểu loại (3 + 3 + 4); đọc là ba nhóm lớn (phi pháp, vừa phi pháp vừa đúng pháp, đúng pháp), mỗi nhóm có tiểu loại. Sujato giữ `three`; an10.91 nói rõ `dasa`. Bản Việt giữ `ba hạng` đúng Pāli; không sửa thành mười.
  - 3.1 `Tayo kho me`: `me` đứng sau `kho`, đọc như `ime` (Sujato `There are these three`); không dịch riêng.
  - 3.3 Pāli có một `sāhasena` thừa ở đầu mệnh đề thứ hai (`pariyesati, sāhasena adhammena bhoge pariyesitvā sāhasena`). Bản Việt dịch cả hai mệnh đề cùng nghĩa với 3.4/3.5 (`phi pháp, cưỡng ép`), như Sujato và an10.91; coi `sāhasena` thứ nhất thuộc về mệnh đề trước.
  - 1.3 `sahadhammiko vādānuvādo gārayhaṁ ṭhānaṁ āgacchati`: dịch `lời nói hay lời bàn nào hợp Pháp của họ rơi vào chỗ đáng bị chê trách` theo mn55:3.3 và dn8:2.3; Sujato đọc là cơ sở chính đáng để phản bác, dn28:19.21 đọc cùng hướng. Chưa phân xử dứt điểm giữa hai cách hiểu (lời họ bị chê, hay có người chê lời họ hợp pháp), vì cả hai cùng kết luận họ nói sai lời Phật.
  - 6.1 đến 15.1 và 19.1, 20.1, 21.1: mệnh đề quan hệ `yvāyaṁ … ` không có động từ chính ngay trong khoá (động từ ở khoá kế tiếp), bản Việt giữ nguyên cấu trúc `hạng người … nào …` rồi chấm câu, khoá kế mở bằng `Hạng người … này`, như an10.91 (bài đó gộp hai câu vào một khoá).
  - 22.3, 22.6, 22.9 `Yaṁ ratto rāgādhikaraṇaṁ …`: `yaṁ` đứng đầu câu không có tiền ngữ; dịch như liên từ và không có chữ riêng (Sujato cũng bỏ), `adhikaraṇa` → nguyên nhân (Thích Minh Châu `do nhân`). `ceteti` → có ý làm hại (mn13, mn110).
  - 17.3, 20.7 `kusalañhi kho dhammaṁ`: `hi kho` mang sắc thái nhấn/đối lập; dịch đơn giản `đạt được thiện pháp, nhưng không …`, không thêm từ nhấn.
  - 2.2 `yo cāyaṁ … yo cāyaṁ …`: hai mệnh đề đồng vị với hai cực đoan ở 2.1; dịch `đó là … và …` theo sn56.11:2.3.
  - Dấu chấm câu: khoá 16.3 kết thúc bằng dấu hai chấm (nghĩ rằng:) và 16.4, 17.2, 18.2 là lời nghĩ trong nháy đơn, Pāli kết `…sacchikareyyan’ti.`; bản Việt kết `bậc Thánh.’` đúng cấu trúc.
  - Xưng hô: Rāsiya gọi `bhante` → bạch Thế Tôn / con; Đức Phật tự xưng Ta, gọi `gāmaṇi` → này thôn trưởng.

  Bài này không chứa số lớn (không `sahassa`, `sata`, `navuti`); không có cụm chưa phân xử được (không `Tiṁsakappasahassa`).

  `technical_integrity` = 9.6 vì lát này không được chạy bốn cổng kỹ thuật của kho; còn lại do người biên tập chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Không tuyên bố cổng kỹ thuật đã pass. Tự kiểm: tập khoá và thứ tự khoá khớp Pāli, dấu lược cân bằng Pāli từng khoá, nháy khớp Pāli từng khoá, NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang tiếng Việt (ngoại trừ tên riêng Rāsiya và nhan đề `Saṁyutta Nikāya`).
