    0 tiền lệ, đặt mới, ghi kèm lý do: `aḍḍhamāsa` → *nửa tháng* (0 tiền lệ trong kho; `aḍḍha` = một nửa, `māsa` = tháng) · `piṇḍapātanīhāraka` → *người đi xin khất thực* (0 tiền lệ) · `vūpasanta` → *lắng dịu* (đối xứng `paṭippassaddha` → *lắng dịu* ở `sn36.16:1.12*`; Sujato *still* ở `an3.63*`) · `Paṭhamavihārasutta` → *Kinh Tu Sự (Nhất)* (0 tiền lệ cho nghĩa *cách sống* của `vihāra`; xem `sn40.3` về *tu sự*).
  - >-
    Lượt review đối kháng: dải `2.4–2.10` là `…paccayāpi vedayitaṁ` lặp bảy lần với `vedayitaṁ` ở vị trí cuối; bản Việt đặt danh từ trước (*cảm thọ nào khởi lên do … làm căn cứ*) để câu đọc được, nhưng phải giữ nguyên thứ tự bảy căn cứ (tà kiến, chánh kiến, tà định, chánh định, ham muốn, tàn nhẫn, tưởng) — nháp lúc đầu đảo hai căn cứ đầu, đã sửa.
  - >-
    Bất định đã ghi: `appattassa pattiyā atthi āyāmaṁ` không có tiền lệ (`āyāma` = thời hạn, thời gian còn lại) — dịch *với người chưa đạt thì có thời hạn*. **Người biên tập nên kiểm.**
