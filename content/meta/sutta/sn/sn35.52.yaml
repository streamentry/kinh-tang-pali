notes: |-
  Dịch từ Pāli root; đối chiếu Sujato đã ghim chỉ ở **7/13** segment Pāli có nội dung (coverage 0,5385 < 0,8). Sáu khoá không có tiếng Anh: `1.6`, `1.11`, `1.12`, `1.13`, `1.14`, `2.7`, và lớp `english-project` của dự án chưa có mảng nào cho bài này — tức gần **một nửa** bài chỉ có Pāli để đứng vững. Vì vậy `triangulation` = 7,6 và bài ở trạng thái `draft` (xem `blocking_errors`). Tầng `vietnamese-current` không có cho bài này.
  **Bản song parallel trùng Pāli: 7 khoá, dùng lại y nguyên văn 6.** `sn22.53:3.10` (**cùng phẩm**) cho `1.15`; `sn22.21:2.1` cho `Aniccaṁ dukkhaṁ anattā`; `sn35.123:2.6` cho `vaggo tena pavuccatīti`; `sn35.155:3.5` cho `Saḷāyatanavagge paṭhamapaṇṇāsako samatto`; `sn35.155:4.0` cho `Tassa vagguddānaṁ`. `Tassuddānaṁ` → *Tóm lược:* (đa số 277; riêng trong sn35 là 8/9).
  **0 tiền lệ cho cả bài, đặt mới — thuật ngữ chính của bài chưa từng xuất hiện trong kho.** `upassaṭṭha` → *nhiễm bẩn* (đối chiếu `āsava` mà kho dịch *lậu hoặc*, và `ñātta` mà kho dịch *ô nhiễm* 509 lần; chọn *nhiễm bẩn* để phân biệt với *lậu* và *ô nhiễm*) · `Upassaṭṭhasutta` → *Kinh Nhiễm Bẩn* · `Sabbaaniccavagga` → *5. Phẩm Tất Cả Vô Thường* (0 tiền lệ; theo tầng `name/` của chính SuttaCentral, `sn-name:1026` dịch *The Chapter on All is Impermanent*, và theo khuôn `Aniccavagga` → *Phẩm Vô Thường*, `Sabbavagga` → *Phẩm Tất Cả* đã có trong sn35) · `jātidhavagga` → *phẩm Có Tính Sanh Tái* (0 tiền lệ; `sn-name:1024` dịch *Liable to Be Reborn*). **Người biên tập nên gộp hai tên phẩm này với các lát sau.**
  **Cách dịch uddāna của bài, đủ để đối chiếu.** `abhiññeyya` và `abhiññeyyapariññeyya` → *cần thắng tri* (0 tiền lệ; ghép với `pariññeyya` → *cần liễu tri* của `sn56.29`, 4 khoá, và `sn35.25` dùng *để thắng tri, liễu tri*) · `pahātabba` → *cần từ bỏ* · `sacchikātabba` → *cần chứng ngộ* · `Upaddutaṁ` → *dơ bẩn*. **Đây là uddāna liệt kê tên các bài của phần năm mươi thứ nhất, không phải mô tả nội dung bài** — không được đọc như một danh sách pháp mới.
  **Bất định đã ghi nhận.** (1) Bản Anh của Sujato ở `1.5` dịch *The ear … nose … tongue …*, nhưng Pāli `1.5` là `jivhā … rasā … jivhāviññāṇaṁ … jivhāsamphasso` — **lưỡi**. Tay/mũi nằm trong `…pe…` của `1.4`. Dịch theo Pāli là *lưỡi*; đây là chỗ Pāli thắng bản Anh. (2) `1.2` `Kiñca … sabbaṁ upassaṭṭhaṁ?` dịch *cái gì là tất cả bị nhiễm bẩn ấy?* — hỏi lại về `sabbaṁ`, không phải hỏi *tất cả là gì*. (3) `sukhasayitāni` → *gieo trồng chu đáo*; `sāra` ở kho chưa có tiền lệ nên dịch *có hạt tốt*, đọc theo Sujato *fertile*.
  **Sửa trong lượt review đối kháng — lỗi bỏ sót một động từ.** `1.12` bản nháp đầu dịch *với tâm, với các pháp, với thức của tâm, với xúc chạm của tâm*, bỏ mất động từ `nibbindati` **vốn có trong Pāli** (`…pe…` của `1.11` chỉ nuốt phần tai/mũi, không nuốt động từ này). Đã sửa thành *chán nản với tâm, chán nản với các pháp, chán nản với thức của tâm, chán nản với xúc chạm của tâm*.
  Dấu lược: `1.4`, `1.7`, `1.11` giữ **một** `…`; `…pe…` không bao giờ mở rộng. `notes` dùng khối literal `|-` thụt 2, đã đọc mẫu đích trước khi ghi. Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` (và `npm run build` vì có bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9.6 chứ không 10.0.
