notes: |-
  Nguồn: PĀLI root đã ghim (commit 11c9d708, tầng `pali`) + bản Anh Bhikkhu Sujato đã ghim
  (`source/upstream-manifest.json`, tầng `english-sujato`, `treeSha` 24e81ded; tệp
  `sutta/sn/sn12/sn12.43_translation-en-sujato.json` tồn tại ở commit này). Coverage Anh đo theo đúng công thức `source/layers.yaml`
  (`substantivePaliMinChars: 40`, loại block tham chiếu `:0`): **21/21 khoá PĀLI có nội dung = 100%** — trên ngưỡng 0.8 nên
  không cần ghi ở `content/meta/reference-gaps.yaml`. Tầng `vietnamese-current` vắng
  (`translation/vi/phantuananh` tại commit đã ghim chỉ có 26 tệp, toàn bộ là Pháp Cú), và
  đây là giới hạn của bản chụp upstream chứ không phải thiếu sót của kho — nên `triangulation`
  không thể cao hơn mức đó.

  `Dukkhasutta` (0.3) → *Kinh Khổ* (4 tệp; *Kinh Khó Chịu* 2 tệp; *Kinh Khổ Đau*, *Kinh
  Sự Khổ*, *Kinh Niềm Tưởng Khổ Trong Vô Thường* mỗi 1 tệp). Lưu ý: `Dukkhasaṅkhitta` trong
  `sn12.43` là bản **tóm lược** duyệt lại mệnh đề duyên khởi ở `sn12.21–23`; tôi dịch tên
  theo đa số (*Kinh Khổ*) chứ không thêm chữ *tóm lược*, vì PĀLI ở `0.3` không có
  `saṅkhitta`.

  ⚠ CỐ Ý GIỮ NGUYÊN MÂU THUẪN CHỮ HOA CỦA TIỀN LỆ, và ghi lại để biên tập quyết:
  `sn35.106:1.1` (PĀLI trùng nguyên văn `…Dukkhassa…desessāmi.`) dịch *Ta* — chữ T hoa,
  còn `sn35.107:1.1` (PĀLI trùng `…Lokassa…desessāmi.`) dịch *ta* — chữ thường. Luật PĀLI
  trùng nguyên văn thì dùng lại nguyên văn buộc tôi lấy đúng từng chuỗi ấy, nên bài này có
  *Ta* và `sn12.44` có *ta*. Đồng thời cả hai đều dùng *Ta* hoa ở `1.3` (tiền lệ 9 tệp cho
  `Taṁ suṇātha…`). Tôi KHÔNG tự sửa `sn35.106`/`107` (ngoài lát) và cũng không phá luật
  trùng-khớp để làm đẹp một câu — đề nghị người biên tập chọn một dạng rồi áp cho cả ba.

  `2.1` và `4.1` (`Katamo ca, bhikkhave, dukkhassa …`) có 0 tiền lệ nguyên văn; tôi dựng
  theo đúng tiền lệ 1 tệp của vế kia trong cùng bài: `4.1` → *Vậy sự diệt mất của khổ là
  gì, này các tỳ-kheo?* và `2.1` → *Vậy sự tập khởi của khổ là gì, này các tỳ-kheo?*
  (`samudaya` = *tập khởi*, `atthaṅgama` = *diệt mất*, theo tiền lệ `sn35.106:1.15`). Vế
  kết `4.10`/`5.13` dùng nguyên văn tiền lệ `sn35.107:2.18` cho hình câu *đây là sự chấm
  dứt của thế giới* — ở bài này với `dukkha` là *đây là sự diệt mất của khổ*.

  Dấu lược: giữ **đúng một** `…` cho mỗi `…pe…` của PĀLI, không mở rộng, và KHÔNG thêm
  dấu lược vào khoá mà PĀLI không lược. Đây là điểm cần nói rõ vì bản Anh Sujato ở commit
  đã ghim có **tra dấu `…` vào nhiều khoá mà PĀLI không lược** (ví dụ `4.2`–`4.4` của
  `sn14.18` mỗi khoá kết bằng `…` bên Anh, trong khi PĀLI kết bằng `;`). Tôi theo PĀLI.
  Đếm: sn12.43 = 8, sn12.44 = 11, sn14.18 = 9; `save_vi` của `_hvi.py` đã bắt khớp từng
  khoá.

  Tiền lệ dùng lại nguyên văn (đếm trên tầng Việt dự án, kèm số tệp) được ghi trong
  `_tvd_67.py` ngay trên mỗi `save_vi`. Vài chỗ cố ý theo đa số dù tiền lệ lệch:
  · `Sāvatthiyaṁ viharati.` → *Trú ở Sāvatthī.* (**75 tệp**; *Đang sống tại Sāvatthī.* 53;
    *Trú tại Sāvatthī.* 6 — `sn12.45`/`46` dùng cách 6 tệp này vì cùng phẩm, nhưng đa số
    toàn tầng và `sn14.14` cùng loạt đều là 75 tệp, nên tôi theo 75).
  · `Catutthaṁ.` → *Thứ tư.* (**140 tệp** ⟵ *Thứ bốn.* 93).

  Bất định chung của ba bài `sn` trong lát:
  · `dhātusova` — Sujato đọc là *an element* (theo `dhātu` = phần tử), còn từ điển tra đọc
    là *xét về nghĩa lý, do giới tánh*. Tôi theo *do giới tánh* theo đa số tiền lệ
    (`sn14.14:1.2`, 9 tệp). `sn14.19:1.2` đã dịch ngược lại thành *Về nghĩa lý* — là bất
    đồng ở cấp toàn kho, đề nghị người biên tập thống nhất; tôi không tự sửa bài đã có.

  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|
