notes: |-
  Đợt 19, lane 25. Dịch từ Pāli root commit đã ghim, đối chiếu English Sujato đã ghim, bản Hòa thượng Thích Minh Châu nguyên bài (tra cứu toàn văn, không phân đoạn) và các tiền lệ cùng tầng. Đủ 86 khoá, thứ tự và tập khoá khớp Pāli; không có khoá ngoài Pāli.

  **Coverage Anh trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): 45/72 = 0.625** — dưới sàn 0.80. Sujato để trống 27 khoá (1.6–1.7, 4.1–4.8, 4.10–4.12, 5.4, 6.2, 10.1–10.8, 10.10–10.13: các đoạn dẫn lại lời Phật, lời các tỳ-kheo và công thức mô tả Đức Thế Tôn), chưa có lớp english-project nào cho bài này, và tại commit đã ghim không có bản Việt phân đoạn cho bài này. Vì vậy phần lớn bài chỉ có Pāli tự đứng vững ở các đoạn lặp; bài giữ `draft` kèm blocker độ phủ, `triangulation` hạ xuống 7.0. Đây là giới hạn của tầng tham khảo, không phải lỗi của bản dịch; muốn nâng trạng thái cần lớp english-project lấp 27 khoá trên, không nâng điểm để né blocker.

  Số Pāli: bài không có số lượng nào cần tính (không có `pañca`, `saḷāyatana` hay số lớn; chỉ có `cha` ngầm trong danh sách mắt–ý được lược).

  Dấu lược: 3 khoá Pāli có `…` trần (8.9, 8.10, 8.12), mỗi khoá giữ đúng một `…` ở bản Việt; Pāli không có `…pe…` và không có `(…)` trần ở khoá nào nên không có `(…)`. Nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá (0 lệch trên 86 khoá). Ở 1.6 Pāli có nháy lồng ‘“…”: bản Việt giữ đúng ‘“ ở đầu và ” cuối câu, vì từ khoá 1.6 trở đi chỉ có một câu phát biểu của Đức Thế Tôn được trích lại. Ở 4.5→4.6 và 10.5→10.6 Pāli kết khoá 4.5/10.5 bằng dấu gạch dài và khoá kế không có nháy; bản Việt giữ gạch dài liền chữ (tiền lệ sn: 716 khoá kết « — » liền chữ, 20 khoá có khoảng trắng). 8.3 và 8.18 Pāli kết bằng dấu phẩy sau nháy; bản Việt kết bằng nháy đóng và chấm.

  Tái dùng nguyên văn tầng: 0.2 theo 8 khoá cùng Pāli ở các kinh kề (12. Phẩm Dục Thuộc Thế Gian); 1.3, 2.2–2.4, 3.1–3.2, 4.1, 4.4, 4.9, 4.13, 7.1–7.2, 8.1, 9.1, 10.1, 10.9, 10.11–10.14, 11.1–11.2 theo sn35.117 / mn138 (cùng công thức Pāli, chỉ đổi tên Tôn giả Mahākaccāna thành Ānanda hoặc đổi «Đức Phật» thành «Đức Thế Tôn» cho đồng nhất trong bài và với sn35.117); 5.1, 5.2, 5.4, 6.1–6.3 theo mn138 (cùng công thức tìm lõi cây và mô tả Đức Thế Tôn). Pāli trùng nguyên văn trong chính bài: 12 nhóm khoá (1.7/4.3/10.3, 2.3/4.11/6.6/10.11, 4.2/8.2/8.17/10.2, 4.5/10.5, 4.6/10.6, 4.7/10.7, 4.8/10.8, 4.12/10.12, 5.4/6.2, 8.3/8.18, 8.5/8.14, 8.6/8.15), bản Việt giống nhau ở cả 12 nhóm.

  Thuật ngữ (đếm trên tầng): `loko` / `lokassa antaṁ` → «thế giới» (sn35: 24 khoá «thế giới» so với 6 khoá «thế gian»; toàn tầng 449 so với 350; mn138/an9.38/sn35.84 cùng dạng); `ariyassa vinaye loko` → «thế giới trong giới luật của bậc Thánh» («giới luật» 47, «luật» 19 ở tầng; an9.38 cùng dạng); `dukkhassa antakiriyaṁ` → «sự chấm dứt khổ» («chấm dứt khổ» là dạng chủ đạo ở 13 khoá có cùng cụm); `saññī` → «có tưởng» (saññā → «tưởng», sn35.117 và tầng 448/455); `vihāra` → «tịnh phòng» (21/28 khoá cùng công thức); `āvuso` → «hiền giả»; `bhante` → «bạch Thế Tôn»; `sabrahmacārī` → «bạn đồng phạm hạnh»; `viññū` → «bậc trí»; `ājānāmi` → «hiểu» theo sn35.117; công thức `cakkhubhūto … tathāgato` theo mn138 (6/6 khoá cùng công thức ghi «ban sự bất tử»); `So ceva panetassa kālo ahosi` → «Chính lúc ấy là lúc» (4/6 khoá cùng công thức); `Tatiyaṁ` → «Thứ ba» (273 khoá so với 2 dạng khác).

  Bất định, không đưa vào thân kinh:
  (1) 1.1/1.2 (và các khoá lặp): `nāhaṁ … ñāteyyaṁ, daṭṭheyyaṁ, patteyyanti vadāmi` dịch sát phạm vi phủ định của Pāli: «Ta không nói rằng bằng cách đi mà có thể biết, thấy hay đạt đến cùng tận của thế giới». Sujato dịch «it's not possible to know or see or reach the end of the world by traveling», Hòa thượng Thích Minh Châu dịch «Ta tuyên bố rằng … không thể biết, không thể thấy, không thể đạt được», và tiền lệ sn2.26/an4.45 là «ta nói rằng không thể». Ba cách đọc khác nhau về vị trí phủ định nhưng cùng nghĩa thực tế; chọn cách bám Pāli nhất, không đổi sắc thái.
  (2) 8.5 và các khoá lặp: `lokasmiṁ lokasaññī hoti lokamānī` dịch «ở trong thế giới, người ta có tưởng về thế giới, có mạn về thế giới». `mānī` ở đây dịch «có mạn» (mạn dùng ở 31 khoá so với «kiêu mạn» 20 ở các khoá có māna); Hòa thượng Thích Minh Châu dịch «kiêu mạn về thế giới», Sujato «conceive the world». Chưa phân xử được sắc thái «mạn / kiêu mạn / ý niệm hoá» của `māna` trong chỗ này; giữ «mạn» để không thêm nghĩa kiêu căng mà Pāli không nói. Chủ ngữ «người ta» là hình thức chỉ chung, Pāli không nêu chủ thể.
  (3) 1.6 và các khoá tương ứng: nháy lồng ‘“…” của Pāli đặt dấu nháy kép ôm cả câu `nāhaṁ … patteyyan` rồi mới tới `ti vadāmi`; bản Việt không thể giữ cấu trúc «iti» này nên đặt nháy kép ôm cả câu và bỏ `vadāmi` thành «nói rằng» trong thân câu. Đây là lựa chọn biên tập, không thêm nghĩa.
  (4) 5.2: `amhe` (số nhiều) giữ «chúng tôi» theo mn138/mn133, dù Tôn giả Ānanda đang nói về mình; Sujato dịch «ask me». Số nhiều lịch sự/kính ngữ hay cả nhóm không phân xử được. `sammukhībhūte` giữ «đang đứng ngay trước» theo tiền lệ mn138/mn133 (2 khoá); sn6.14 dịch «đang trực tiếp hiện diện». Hai cách chỉ khác ở việc thêm «đứng», không đổi ý.
  (5) 5.6/6.4: `byākareyya` (khả năng) và 8.21 `byākaroti` (hiện tại) đều dịch «giải đáp … như thế nào» không thêm «sẽ»; Pāli dùng dạng khác nhau nhưng nghĩa thực dụng giống nhau.
  (6) 8.4: không dịch `evaṁ` ở khoá 8.4 (Pāli không có) nhưng dịch «theo cách như vậy» ở 8.19 (Pāli có `evaṁ`), theo sn35.117:8.4 và 8.11.

