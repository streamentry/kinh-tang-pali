notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở commit 11c9d708. Không có bản Việt tham khảo: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên tầng `vietnamese-current` không phủ bài này và triangulation chỉ dựa trên Pāli + Sujato.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  sn47.18 là bài song song trùng Pāli gần như từng khoá (cùng câu ekāyanvāyaṁ maggo, cùng bốn vế quán sát, cùng câu Phạm thiên Sahampati, cùng bốn câu kệ), nên dùng lại nguyên văn sn47.18 cho 1.5, 2.2–2.5, 2.6, 3.4, 4.2–4.5, 4.6, 6.2, 6.3, 6.4. an4.21 cho 1.3, 1.4, 3.3, 5.1, 5.2. sn51.21:0.3 cho 0.3.
  0.2 `Amatavagga` là phân kỳ chưa chốt: sn47.41 và sn47.45 dùng 5. Phẩm Bất Tử, còn sn47.42 và sn47.44 dùng 5. Phẩm Vô Tỉnh, hai phiếu mỗi bên. Chọn 5. Phẩm Bất Tử vì đúng với nghĩa của amatā và với bản Anh (Freedom From Death); ghi ở đây để người biên tập thống nhất.
  Bất định đã phân xử và đã sửa bản nháp: 6.1 và 6.2 phải tách đúng theo Pāli. Bài sn47.18:6.1 đã publish gộp cả hai vế vào một khoá (thấy rõ sự chấm dứt tái sanh hiểu rõ con đường trực tiếp), còn Pāli của sn47.43 chia 6.1 (Ekāyanaṁ jātikhayantadassī) và 6.2 (Maggaṁ pajānāti hitānukampī). Ở đây 6.1 chỉ là bậc thấy sự chấm dứt của các kiếp, còn hiểu rõ con đường trực tiếp và bậc bi mẫn thuộc 6.2. Đây là lý do cảm ơn việc tách khoá, và là khác biệt có chủ đích so với sn47.18 chứ không phải lệch khuôn.
  Ngoặc kép: Pāli mở nháy kép ở 1.3 và chỉ đóng ở 6.4; các nháy đơn ở 1.5, 3.3, 6.1 đóng ở 2.6, 4.6, 6.4. Bản Việt giữ nguyên như vậy, nên 2.6 và 4.6 kết bằng dấu nháy đơn đứng một mình — đúng như Pāli, không phải lỗi.
  0 tiền lệ cho `ekāyanvāyaṁ maggo` có nhiều hơn một cách dịch trong tầng (con đường trực tiếp của sn47.18 và dn14, đường thẳng của bản Anh). Chọn theo bài song sinh cùng phẩm để hai bài không lệch.
  Coverage tầng Anh trên Pāli có nội dung (14 segment) là 14/14 = 100%. Không cần ghi nhận gap.
