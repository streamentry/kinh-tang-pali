notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  Giải quyết draft 2026-10-12: blocker "cắt ngắm" (khoá 4.1, 5.1) thuộc loại lỗi văn bản nhưng đã lỗi thời: bản dịch hiện tại ở 4.1 và 5.1 viết đủ nội dung (không có dấu lược), còn `…` chỉ nằm ở 4.2, 4.3, 5.2, 5.3 là nơi Pāli có `…pe…` (Yepi te …pe…), nên không còn khoá nào có dấu lược mà Pāli không có; blocker được gỡ.
  Đọc đối kháng lại toàn bài (23 khoá), sửa 3 khoá (2.5, 3.1, 3.4), đều là accuracy/terminology fix: 2.5 và 3.4 — "koci sahadhammiko vādānupāto gārayhaṁ ṭhānaṁ āgaccheyya" trước dịch "không một ai cùng theo pháp biện luận có thể tìm ra lý do..." là đọc koci như người; nay "không có lập luận hợp pháp nào đưa đến chỗ bị khiển trách" (khớp sn12.24 và sn12.25, tầng này 11 nơi dùng "lập luận hợp pháp"); "vu khống" → "xuyên tạc" (tầng 26 nơi "xuyên tạc ... điều không thật" so với 5 nơi "vu khống"); "giải thích đúng chánh pháp" → "giải thích đúng giáo pháp" (khớp sn12.24/25, 8/8 cân bằng nên chọn theo bài song song); 2.5 "Thế Tôn nói gì" → "chủ trương điều gì" cho kiṁvādī, khớp sn12.24:3.5 và sn12.25:2.5; 3.1 bỏ "là" để khớp sn12.24 và sn12.25 ("khổ do duyên khởi sinh"). Lỗi nghĩa thật: 2 khoá (2.5, 3.4) trên 23; 3.1 chỉ là chỉnh thuật ngữ.
  Coverage English: bản Sujato có đủ bài, để trống 4.2, 4.3, 5.2, 5.3 (đều là `Yepi te …pe…`, dưới ngưỡng 40 ký tự nên không tính vào mẫu số); các đoạn này là công thức lặp tự đứng vững từ Pāli (lặp lại 4.1 và 5.1 cho ba luận điểm paraṅkataṁ, sayaṅkatañca paraṅkatañca ở 2.2–2.3), dịch "đối với những vị …" giữ một dấu lược. Tầng Việt hiện hành (vietnamese-current) chỉ có Pháp Cú nên không có tham chiếu Việt cho bài này; triangulation hạ về 9.0.
  Bất định còn lại: anudhammaṁ trong "dhammassa cānudhammaṁ byākareyya" chưa được dịch riêng (theo tiền lệ sn12.24/25 gộp vào "giải thích đúng giáo pháp"); phần giải thích ở glossary nếu cần.
