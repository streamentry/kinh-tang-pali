    thuật ngữ; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo.
    budsas.org chỉ là tra cứu toàn văn, không cấp text cho tầng nào.
  0.1 đo trên 1.652 tệp sn: toàn bộ dùng Saṁyutta Nikāya, không có Saṡyutta. Tên phẩm 0.2 đo trong chính phẩm: 8 tệp sn22 ghi *4. Phẩm Không Như Mình*, không phân kỵ.
  Tra tiền lệ có số đếm và dùng lại nguyên văn: Sāvatthinidānaṁ → *Tại Sāvatthī.*; eko vūpakaṭṭho appamatto ātāpī pahitatto ở 1.3 → *sống độc hạnh, lui vào, không phóng đãng, nhiệt tâm, tinh cần* — cụm Pāli này trùng với sn41.9:3.6 đã dịch sẵn trong tầng, nên dùng lại nguyên văn thay vì tự đặt (bản nháp đầu viết *thu mình một mình*, gộp mất hai vế); ekamantaṁ nisinno → *ngồi xuống một bên*; aññātaṁ, aññātaṁ → *Đã hiểu rồi … đã hiểu rồi*; arahataṁ ahosīti → *là bậc A-la-hán*; sādhu sādhu → *Tốt lành, tốt lành*.
  0 tiền lệ sạch trong kho, ghi để người đọc biết đây là lựa chọn mới: anuseti → *có xu hướng với*; anumīyati → *bị đo theo*; saṅkhaṁ gacchati → *được xếp hạng theo*; sugatā → *bậc Cát Bàn* (đo toàn tầng: 0 tiền lệ cho Cát Bàn lẫn Điều Quang, nên đặt mới theo ngữ cảnh Phật giáo Việt); vūpakaṭṭha → *lui vào*.
  Bất định đã ghi, không giấu. (1) Ba từ anuseti / anumīyati / saṅkhaṁ gacchati là ẩn dụ đo lường của bài, và tiếng Việt *bị đo theo / được xếp hạng theo* giữ được hệt quan hệ đối ứng nhưng hơi nặng đọc; tôi giữ nó vì thay bằng từ dễ hơn sẽ mất đúng cái đối xứng của Pāli. (2) sugatā ở 1.8 là tán dương Đức Thế Tôn, dịch *bậc Cát Bàn*; không có tiền lệ để đối chiếu. Vì hai chỗ này nên terminology 9.2 và vietnamese_clarity 9.2.
  Xưng hô: tỳ-kheo hỏi Đức Thế Tôn thì *Bạch Thế Tôn … con*; Đức Thế Tôn đáp thì *này tỳ-kheo … ngươi / mày*. Câu 3.2 của Đức Thế Tôn dùng mày vì Pāli là tvaṁ.
  Dấu lược: …pe… giữ đúng một dấu lược; đếm lại từng khoá, không khoá nào lệch. Mười một khoá có dấu lược, tất cả là lược thật của Pāli chứ không phải nén của bản Việt.
    technical_integrity 9.6: môi trường lát này không cho chạy npm run validate|test|
    build|check|audit|reference:gaps. Bài tự kiểm bằng bản cài lại nguyên vẹn logic của
    _hvi.py: đủ 46/46 khoá, 0 khoá thừa, 0 khoá để trống, NFC, không khoá nào trùng
    nguyên văn Pāli, số dấu lược khớp từng khoá, ngoặc kép cân trên cả bài theo thứ tự
    số. Coverage Anh tính lại bằng đúng công thức của src/lib/canon/reference.ts
    (Pāli ≥40 ký tự sau khi nén khoảng trắng, bỏ khối tham chiếu :0).

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.1, 3.2 — *mày* → *ngươi* (đại từ `tvaṁ` của Đức Thế Tôn dùng *ngươi* ở 1.4 và ở toàn tầng sn22; *mày* là ngoại lệ duy nhất 2 khoá, thay cho lựa chọn xưng hô đã ghi ở mục trên), *lời Như Lai đã nói ngắn gọn ấy* → *lời Ta nói vắn tắt* (`mayā saṅkhittena bhāsitassa`); 3.17 — *ý nghĩa của nó phải được hiểu như vầy* → *Này tỳ-kheo, ý nghĩa chi tiết của lời Ta nói vắn tắt cần phải được thấy như vậy* (theo 5/8 khoá cùng Pāli); 2.16 — *Đối với lời Như Lai … ý nghĩa của nó chính là như vầy* → *Bạch Thế Tôn, con hiểu ý nghĩa chi tiết của lời Thế Tôn nói vắn tắt như vậy* (đúng chủ thể: tỳ-kheo nói về lời của Đức Thế Tôn, không phải *Như Lai*); đồng bộ trong bài: 1.3 *ngắn gọn* → *vắn tắt* cho `saṅkhittena`, 3.1 *Tốt lành* → *Lành thay* cho `sādhu` (như 15/22 khoá cùng Pāli, và bản ghi cũ ở mục trên về *Tốt lành, tốt lành* nay thay bằng *Lành thay, lành thay*).

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.2 — «một vị tỳ-kheo nào đến chỗ … rồi ngồi xuống một bên, … thưa với» → «một vị tỳ-kheo đi đến chỗ … ngồi xuống một bên, … bạch» (công thức so bhikkhu bhagavantaṁ etadavoca: 68 khoá dùng «bạch» so với 3 khoá «thưa»; bỏ «nào» vì «một vị» đã dịch aññataro, giữ dấu lược đúng vị trí Pāli).
