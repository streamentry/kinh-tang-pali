notes: |-
  Dịch từ Pāli root đã ghim (manifest liệt kê sutta/sn/sn12/sn12.1_root-pli-ms.json và sutta/sn/sn12/sn12.1_translation-en-sujato.json). Tầng Anh CÓ và đã đo.
    Coverage đo được: 13/13 Pāli có nội dung (≥40 ký tự sau khi bỏ khối :0) có chữ Anh Sujato = 1.0000. Không cần entry reference-gaps.
    0.1 giữ đúng Saṁyutta Nikāya 12.1 với chữ ṁ là U+1E41: đếm trên tầng Việt dự án, 1.622 lần xuất hiện Saṁyutta và 0 lần Saṡyutta, nên đây là cách viết đã chốt của cả tầng chứ không phải lựa chọn riêng.
    24/42 khoá có Pāli trùng NGUYÊN VĂN với một khoá đã dịch ở bài khác (đếm cả khối 0.x và các khoá đánh số); dùng lại y nguyên 22/24, lệch 2.
    Lệch: 1.9 (Pāli Evaṁ, bhante nên bản này dịch là Vâng, bạch Thế Tôn, còn 8 tiền lệ đều dùng Thưa vâng, bạch Thế Tôn) và 3.14 (4 tiền lệ chia ba cách, không có cách nào giống hệt; bản này chọn hoan hỷ tán thán lời Đức Thế Tôn đã nói).
    Dùng lại y nguyên 22 khoá, trong đó quan trọng nhất: 0.2 (1. Phẩm Đạo Sư, trùng sn12.3 đến sn12.9, 6 bài), 2.2 (do duyên vô minh mà có các hành, trùng sn12.3:2.2), 2.6 (do duyên sáu xứ nên có xúc), 2.10, 2.11, 2.12 (trùng sn12.52, gồm dấu gạch nối của già-chết), 2.13, 3.1 (Do vô minh diệt tận không còn dư mà hành diệt), 3.9, 3.10, 3.11 (trùng sn35.106) và 3.12.
    Cảnh báo đo được trong chính lớp tham chiếu: 2.12 và 3.11 đã dùng y nguyên tiền lệ (bao gồm dấu gạch nối trong già-chết và chữ sanh), 2.2 và 3.1 dùng y nguyên tiền lệ; 2.6 và 3.1 lệch nhịp câu với phần còn lại của chuỗi vì bản tham chiếu lệch, nhưng luật trùng thì khớp được giữ vì bản tham chiếu không sai nghĩa.
    Duyên khởi cho paṭiccasamuppāda: đo trên toàn tầng, duyên khởi có 53 lần, liên duyên có 0 lần, duyên sinh có 55 lần; giữ duyên khởi vì đó là thuật ngữ đã thành quy ước (ví dụ Ai thấy duyên khởi là thấy Pháp).
    Chuỗi duyên khởi và chuỗi diệt tận giữ do X mà có Y và do X diệt tận mà Y diệt tận theo sn12.3 và sn12.27; xúc và thọ giữ dạng ngắn của sn12.13, khát ái và chấp thủ giữ dạng của sn12.27 và sn35.106, khối khổ giữ dạng của sn12.3.
    Có hai chỗ lệch có chủ ý, xem hai bài kế: sn12.27:1.4 và sn12.58:4.6 thêm vế do vô minh / do danh và sắc vào câu evametassa kevalassa dukkhakkhandhassa samudayo hoti, trong khi Pāli không có vế đó. Bản này không sao chép lỗi ấy. Đề nghị coordinator xem lại hai tệp đó.
    Tầng vietnamese-current vắng ở commit đã ghim (chỉ có Pháp Cú), nên không có bản Thích Minh Châu để đối chiếu cho bài này.
    Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
