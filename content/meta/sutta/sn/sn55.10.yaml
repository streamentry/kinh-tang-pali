notes: |-
  **Nguồn.** `sn55.10` = `Tatiyagiñjakāvasathasutta`, tệp Pāli ghim
  `root/pli/ms/sutta/sn/sn55/sn55.10_root-pli-ms.json` (46 khoá, đủ 46 khoá đã dịch).
  Tầng Anh `english-sujato` đã ghim cùng commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`
  (`sutta/sn/sn55/sn55.10_translation-en-sujato.json`). `translation/vi/phantuananh/` ở
  commit đã ghim chỉ có Pháp Cú, nên **không có** tầng Việt hiện hành cho bài này — đây là
  đặc điểm của snapshot upstream, không phải thiếu sót của kho.

  **DÙNG LẠI NGUYÊN VĂN — 28/46 khoá.** Pāli của `sn55.10:4.1`–`6.7` trùng công thức gần
  như nguyên văn với `sn55.8:4.1`–`6.7` (hai bài anh em cùng tam phẩm `Veḷudvāravagga`, đã
  có bản Việt trong tầng). Tôi đối chiếu từng cặp rồi dùng lại **nguyên văn** bản dịch đã
  có: `4.1` = `sn55.8:4.1` · `4.3` = `sn55.8:4.3` · `4.4` = `sn55.8:4.4` · `5.1` = `sn55.8:5.1`
  · `5.2` = `sn55.8:5.2` · `6.5` = `sn55.8:6.5` · `6.6` = `sn55.8:6.6` · `6.7` = `sn55.8:6.7` ·
  `3.3` = `sn55.8:3.4` · `3.2` lấy `sn55.8:3.3` nhưng sửa `sakadāgāmino` → *bậc **Nhất Lai***
  (đếm trên toàn tầng: *Nhất Lai* 34 lần so với *nhất lai* 19, nên đây là dạng đa số) ·
  `2.1`/`2.8` lấy `sn55.8:3.2` · `0.1`/`0.2` = `sn55.8:0.1`/`0.2` · `0.3` theo `sn55.8:0.3` +
  `(Ba)` (Sujato dịch tiêu đề là *At the Brick Hall (3rd)*). Ba khoá `6.2`/`6.3`/`6.4` trùng
  Pāli `sn55.8:6.2`/`6.3`/`6.4` nhưng bản anh em **bỏ sót** `sammādiṭṭhi` ở `6.4`
  (Pāli đã ghim của `sn55.10:6.4` cũng vậy) — tôi dịch lại nhưng **không** bịa thêm chữ nào.
  `4.2` lấy `sn55.8:4.2` rồi sửa `Vihesā pesā … assa tathāgatassa` thành *Điều ấy sẽ làm phiền
  não cho **Thế Tôn**, này Ānanda* — bản anh em dịch *cho ta, này Ānanda, và cho bậc Như Lai*,
  tức lặp `ta`/`tathāgatassa` hai lần cho một ý.
  Không có trường hợp nào phải sửa cả hai bên: Pāli của mười khoá dưới đây là của riêng bài
  này (tám tên cư sĩ của `1.4`–`2.7` chỉ xuất hiện ở `sn55.10`), nên không có bản tham chiếu
  nào để đối chiếu.

  **Thuật ngữ, kèm số đếm.** `dhammādāso dhammapariyāyo` → *tấm gương pháp, pháp môn ấy*
  (`sn55.8:4.3`/`6.5`, `sn55.9:3.1` — nguyên văn) · `kālaṅkato` → *đã qua đời* (`sn55.8`/`sn55.9`)
  · `kā gati ko abhisamparāyo` → *sanh thú của vị ấy là gì, đời sau là gì* (nguyên văn `sn55.8:2.2`) ·
  `ñātike` → *ở làng Ñātika* (`sn55.8:1.2` dịch `ñātike viharati` là *trú tại làng Ñātika*) ·
  `opapātiko` → *được hóa sinh* · `parinibbāyī` → *nhập Niết-bàn tại đấy* ·
  `anāvattidhammo tasmā lokā` → *không còn trở lui từ cảnh giới ấy* (cả ba nguyên văn
  `sn55.8:3.2`) · `orambhāgiyānaṁ` → *năm hạ phần kiết sử* (đếm toàn tầng: cụm này chiếm
  đa số, ≥ 34 lần, không có cụm cạnh tranh nào đứng ngang) · `rāgadosamohānaṁ tanuttā` →
  *làm muội lược tham, sân, si* · `sakadāgāmino` → *bậc Nhất Lai* · `sotāpannā` → *bậc nhập lưu* ·
  `avinipātadhammā niyatā sambodhiparāyaṇā` → *không rơi vào ác đạo, chắc chắn, hướng về giác ngộ*
  · `satthā devamanussānaṁ buddho bhagavāti` → *bậc Đạo Sư chư thiên và người, bậc Giác Ngộ,
  bậc Đáng Kính* (đếm toàn tầng: cụm *Đạo Sư chư thiên và người* 17 lần, không có cách khác) ·
  `aveccappasādena samannāgato hoti` → *thành tựu lòng tịnh tín bất động* (`sn55.8:6.1`) ·
  `ariyakantehi sīlehi … akhaṇḍehi … samādhisaṁvattanikehi` → *đầy đủ các giới được bậc Thánh
  yêu thích, không sứt mẻ … và đưa đến định tâm* (đếm toàn tầng: *bậc Thánh yêu thích* 12 lần
  cho cùng Pāli; `sn55.20:3.6` đã dịch `samādhisaṁvattanikehi` là *đưa đến định tâm*) ·
  `Paropaññāsa` → *Hơn năm mươi* · `Sādhikanavuti` → *Hơn chín mươi* · `Chātirekāni …
  pañcasatāni` → *Hơn năm trăm* · `Dasamaṁ` → *Thứ mười* (`an4.158:3.9`) ·
  `Tassuddānaṁ` → *Tóm lược:* (đếm toàn tầng: 362 lần, áp đảo) ·
  `Xvaggo paṭhamo` → *Phẩm Veḷudvāra, chương thứ nhất.*

  **Dấu lược — 10 khoá, mỗi khoá đúng một `…`.** `1.4`–`1.9`, `2.2`, `2.7` có `…pe…`;
  `1.5`–`1.8`, `2.3`–`2.6` chỉ có `…`. Luật của lát này là `…pe…` → **một** `…`, không mở
  rộng, nên tôi chỉ để một dấu. Riêng `6.1` cần chú ý: Pāli là
  `buddhe aveccappasādena samannāgato hoti—itipi so bhagavā …pe… satthā devamanussānaṁ
  buddho bhagavāti`. Bản Việt đã có của `sn55.8:6.1` **bịa thêm** *"là bậc A-la-hán"* ở chỗ
  lược; tôi **không** lặp lại, và chỉ dịch đúng phần còn nhìn thấy: *— Thế Tôn ấy … là bậc
  Đạo Sư chư thiên và người, bậc Giác Ngộ, bậc Đáng Kính.*

  **Ngoặc kép — cân, không phải may mắn.** Pāli có đúng hai cặp: `“` ở `1.2` và `2.1`, `”` ở
  `1.11` và `6.7`. Tôi giữ nguyên vị trí đó và **không** thêm dấu nào (các lời trích `khīṇā
  jāti …` ở `4.4`/`5.2`/`6.7` dùng nháy cong `‘…’` như `sn55.8` vì vậy không tính vào vòng
  đếm, cũng không làm lệch).

  **Bất định, ghi ở đây chứ không thêm vào thân kinh.**
  (1) `2.9` `(Sabbe ekagatikā kātabbā.)` — `kātabbā` là dạng bị động nghĩa *được làm*, và
  `ekagatikā` là *một lần*, nhưng câu này là dấu chấm hết của cả đoạn nên tôi dịch
  *(Tất cả đều được xử đoán chung một lần.)*; cũng có thể đọc là *nên* được xử đoán chung một
  lần. Sujato để trống chỗ này.
  (2) Bốn câu `uddāna` `7.1`–`7.4` là **mật mã liệt kê tên bài trong tam phẩm**, và mười tên
  chúng liệt kê **không khớp** với tên mười bài `sn55.1`–`sn55.10` đang có trong tệp Pāli ghim:
  chỉ `Thapatī` (=`Thapatisutta` = `sn55.6`) và `giñjakāvasathe tayoti` (ba bài `55.8`–`55.10`)
  còn khớp, `Rājā ogadhadīghāvu` và `Veḷudvāreyyā` (=`sn55.7`) không có bài nào tên vậy.
  Tôi dịch nghĩa từng câu và **không** tự ghép tên nào với bài nào, vì Pāli ở đây chỉ liệt kê
  và tôi không có căn cứ ánh xạ. `ogadhadīghāvu` = *có vẻ tay dài đến bến* (`ogadha` = có vẻ
  như, `dīghāvu` = dài tới bờ biển).
  (3) `1.11` `tassa` dùng số nhiều cho cả tám vị (`tassā … tassā …` ở `sn55.8:2.4` cũng vậy),
  nên tôi dùng *của họ* thay vì *của vị ấy* như ở `1.3`.

  **Khai tên riêng.** Tám tên cư sĩ (`Kakkaṭa`, `Kaḷibha`, `Nikata`, `Kaṭissaha`, `Tuṭṭha`,
  `Santuṭṭha`, `Bhadda`, `Subhadda`) cùng `Thapati` và `Veḷudvāreyya` chỉ xuất hiện trong Pāli
  của chính bài này. Pāli để dạng danh từ (`kakkaṭo`, `Kaḷibho`, `nikato`…), tiếng Việt phải
  dùng dạng gọi (`Kakkaṭa`, `Kaḷibha`, `Nikata`…) nên lệch `o`/`a` cuối; tôi đã **tự tra chứng
  rồi khai** mười tên này vào bộ nhớ tiến trình của `lọt_pāli` (không sửa `_hvi.py`). Không có
  bản Việt nào khác trong kho dùng những tên đó, nên không có cách viết thứ hai để đối chiếu.

  **Mệnh đề, đo lại (đo từ `content/translation/vi/project/sutta/`, không dùng số của lát
  trước).** `sn:0.1` — 1.648 tệp có khoá `0.1` và **1.648/1.648 (100%) giữ PĀLI**
  `Saṁyutta Nikāya`; không tồn tại cách dịch nào trong tầng. `sn:0.2` — `1. Phẩm Veḷudvāra`
  chiếm **6/6** trong `sn55.1`–`sn55.9`, tôi theo. Tên phẩm `sn55` theo đa số trong chính
  phẩm: `Veḷudvāravagga` → *Phẩm Veḷudvāra* (6/6), không có ngoại lệ. Chữ `ṁ` trong `Saṁyutta`
  là U+1E41 (đã kiểm: không có `Saṡyutta` nào trong tầng).

  **Tầng Anh: 21/22 segment có nội dung = 0.955**, trên ngưỡng 0.8, nên **không** cần entry
  trong `content/meta/reference-gaps.yaml` và tôi không sửa tệp đó. Segment duy nhất bản Anh
  đã ghim để trống là `5.2` — nhưng `5.2` **trùng nguyên văn** `4.4` (bản Anh của `4.4` có
  đủ), nên đoạn này vẫn được đối chiếu Anh qua chính bản anh em trong bài. `triangulation` 9.0
  vì vậy, và **không** nâng điểm để né.

  **Đã sửa sau khi review đối kháng.** (1) `6.1` bản đầu tôi dịch `aveccappasādena samannāgato
  hoti` là *có đủ lòng tịnh tín* và `samādhisaṁvattanikehi` là *đưa đến định tổ chức tâm* —
  cả hai đều là dịch tự do; đã sửa về nguyên văn `sn55.8` (*thành tựu lòng tịnh tín bất động*,
  *đưa đến định tâm*) để ba bài anh em đọc như nhau, vì `samāhita` mới là *tổ chức tâm*, còn
  `samādhisaṁvattanikehi` là *đưa đến định*. (2) `4.2` sửa như nói trên. (3) `7.2` bản đầu tôi
  viết *ngoài hai người có vẻ tay dài là con Thế Tôn* — đọc lại `sāriputtāpare duve` thì đó là
  *hai bài ngoài các bài về Sāriputta*, tức là `sn55.2`/`sn55.3`, đã sửa.

  **technical_integrity = 9.6.** Bốn cổng kỹ thuật (`npm run validate` qua `build`, `npm test`,
  `npm run check`, `npm run build`) bị cấm trong lát này nên tôi không tự chạy được. Tôi tự
  kiểm bằng chính `_hvi.py`: đủ 46/46 khoá trong `all`, không khoá thừa, không khoá nào trùng
  nguyên văn Pāli, mọi giá trị NFC, dấu lược khớp từng khoá (10 khoá có lược, tất cả 1 dấu),
  không có `(…)` đứng một mình, ngoặc kép cân trên cả bài theo thứ tự số (đã cân tay:
  +1 −1 +1 −1), không Pāli lọt, thứ tự khoá đúng thứ tự số.