notes:
  - >-
    **Sáu bài cùng một khung câu hỏi, chỉ khác ý kiến được nêu**: *thế gian có
    kết thúc* / *không có kết thúc* / *ta là sinh, ta là thân tế* / *sinh là
    một, thân tế là một khác* / *sau khi thân hoại mạng chung thì có Đức Phật* /
    *… không có Đức Phật*. Tôi dựng từng vế riêng; dùng một bảng dịch chung sẽ
    ra sáu câu giống nhau.
  - >-
    `Kismiṁ nu kho … sati, kiṁ upādāya, kiṁ abhinivissa` → *khi có cái gì, khi
    dựa vào cái gì, khi hướng về cái gì* (0 tiền lệ, đặt mới; `upanissaya` chưa
    có bản dịch nào trong kho). `Bhagavaṁmūlakā` → *lấy Đức Phật làm gốc rễ*;
    `niyato sambodhiparāyano` → *là hướng chắc chắn đến giác ngộ*. `diṭṭhi` ở
    đây là **ý kiến**, không phải *tà kiến* theo mặc định của kho
    (`an10.103:1.3`) — tự mâu thuẫn nếu dịch theo mặc định.
  - >-
    **Quy ước dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
    `published` có `…` trong Pāli, chỉ **617** (40%) giữ đúng số, và cặp lệch
    phổ biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` → `…`). Quy tắc là
    **có/không có `…` phải khớp theo từng segment**, không phải khớp số.
  - >-
    **Dùng lại nguyên văn đã duyệt:** `Sāvatthinidānaṁ.` → *Tại Sāvatthī.*
    (`an4.51:1.1`) · năm căn *Tín căn, tinh tấn căn, niệm căn, và định căn*
    (`an4.151:1.3`) · bốn căn xứ *xứ vô số hư không / xứ vô số thức / xứ vô sở
    hữu / xứ phi tưởng phi phi tưởng* (`an10.6:1.2`, `an3.116:2.3`/`3.3`) · câu
    *hoàn toàn vượt qua mọi tưởng về sắc…* (`an3.116:1.3`) · toàn bộ thang đạo
    quả (`an3.87:2.6`–`3.10`) · khung *“người ta gọi là … thế nào vậy?”*
    (`an3.76:1.2`–`1.3`) · tám bước diệt tận (`an10.240-266`) · *kiêng tránh sát
    sinh* (`an10.178:3.2`) và *nhảy múa, hát, nhạc, và xem các trò chơi*
    (`an4.198:9.3`).
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng
    Thích Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã
    ghi ở `content/meta/reference-gaps.yaml`.
