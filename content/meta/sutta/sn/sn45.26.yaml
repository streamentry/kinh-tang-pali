    **Lượt review đối kháng bắt được 13 lỗi, tất cả đều là lỗi nghĩa chữ — không phải lỗi hình thức.** (1) `sn36.20`: lần viết đầu tôi **bịa** một hằng số lặp vô nghĩa thay cho Pāli, trong khi Pāli liệt kê cảm thọ theo **bảy** cách phân loại (2/3/5/6/18/36/108) — viết lại toàn bài. (2) `sn22.4:1.5/4.4`: `ye upayupādānā cetaso adhiṭṭhānābhinivesānusayā` là **năm** vế, bản đầu tôi nén còn hai — mất ba ý. (3) `sn22.4:1.5`: `seṭṭhā devamanussānaṁ` là *hơn hết ở trời và người*, không phải *tối thượng* (câu đã có bốn chữ *tối thượng*). (4) `sn22.117:2.1`: `suvinīto` phải thành cặp với `avinīto` ở 1.2 — đổi *thành sự* thành *đã đi lệch trọn vẹn vào*. (5) `sn35.228:1.5/2.4/2.8`: `vego` là *dòng nước*, tôi thêm *lớn* (Pāli không có). (6) `sn35.228:2.1/2.5/2.9`: `cakkhusamuddaṁ` là *biển của con mắt* — chữ *đại* chỉ có ở `mahā eso` 1.3. (7) `sn35.228:3.2`: `sabhayaṁ` là *có bến*, tôi dịch nhầm thành *hiểm trở*. (8) `sn35.237:1.3/2.3`: `pabbesu` là *chỗ khớp*, tôi dịch riêng thành *khuỷu*. (9) `sn35.237:3.2`: `khīrarukkha` là *cây cho sữa*, không phải *cây sữa*. (10) `sn38.5/6:1.7`: `Ayameva kho, āvuso, ariyo aṭṭhaṅgiko maggo` phải theo đúng khung `sn38.2:1.8`. (11) `sn44.10:1.3/1.5`: `atthattā` / `natthattā` là **câu hỏi**; bản đầu tôi rơi mất vế hỏi, thành khẳng định — đổi nghĩa. (12) `sn44.10:2.5`: `api nu … abhavissa` cũng là câu hỏi, dấu `?` nằm ở khoá 2.6 nên phải nối bằng *rằng*, không dùng dấu hai chấm. (13) `sn45.26:1.6/2.2`: hàm dịch lặp *tà kiến … tà kiến* — `…pe…` đã đại diện cho sáu vế giữa. **Máy không bắt được loại lỗi này — cả mười ba đều qua mọi chốt tự động.** Riêng (13) đúng loại lặp từ mà harness chặn: lặp do **hàm dịch** sinh ra chứ không phải lặp trong chuỗi viết tay, nên chỉ lộ ra khi đọc lại đối chiếu từng khoá.
