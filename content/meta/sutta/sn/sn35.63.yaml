notes: |-
  Không có tầng Việt hiện hành để đối chiếu. Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Tầng đối chiếu còn lại là Pāli root và bản Anh Sujato đã ghim. budsas.org chỉ là tham khảo toàn văn, không cấp text cho tầng nào.
  Dấu lược theo đúng luật của tầng Việt: pe-lược của Pāli là MỘT dấu lược, và sau khi bỏ hết pe-lược thì đếm dấu lược còn lại. Chạy trên 315 khoá của lát: 0 khoá lệch. Không có khoá nào để trống trong bản dịch.
  Tên phẩm đo trên toàn tầng sn: 10 tệp cùng phẩm Migajālavagga, cả 10 đều là 7. Phẩm Migajāla. Tên bài Paṭhamamigajālasutta chưa có tiền lệ; đặt mới theo mẫu đã có trong tầng là Kinh Kassapa Thứ Nhất và Kinh Gà Gai Thứ Hai: Kinh Migajāla Thứ Nhất.
  Coverage Anh 23/23 khoá Pāli có nội dung, tức 100%, và english-project của bài đang trống, nên tầng tham khảo là bản Sujato đã ghim, độc lập với người dịch. Bốn pe-lược đều là pe-lược Pāli thật.
  Đo rồi mới dùng: 17 khoá có Pāli trùng nguyên văn với bài đã mang trạng thái, 9 dùng lại nguyên văn (Sāvatthinidānaṁ → Tại Sāvatthī 425 lần; Paṭhamaṁ → Thứ nhất 287 lần; Taṁ kissa hetu → Vì sao vậy 97 lần; 1.3; 2.1 và 3.1; 3.7 và 3.8; 2.7 với pe-lược đứng riêng thì 573 tiền lệ đều là một dấu lược; 3.3 và 3.10; và cụm này nữa). Tám khoá lệch và tất cả đều vì lý do chính đáng: (1) 2.2 và 2.9 và 3.2 và 3.9 — tiền lệ chia ba động từ của Pāli thành bốn vế, tôi dịch đúng ba vế và làm cho 3.2 và 3.9 là phủ định chính xác của 2.2; (2) 2.3 và 2.10 — tôi giữ thuật ngữ niềm vui cho nandī xuyên suốt bài; (3) 3.1 và 3.8 — Pāli không mở ngoặc ở hai khoá này vì chúng nằm giữa một lời thoại mở từ 2.1, nên tôi viết thường cho đúng kiểu, và làm cả 2.8 và 3.7 theo cùng quy tắc.
  Cặp khẳng định và phủ định trong bài là cấu trúc của chính kinh, nên dịch đối xứng là bắt buộc: có hoan hỷ thì có lòng tham dục, không có hoan hỷ thì không có lòng tham dục; có lòng tham dục thì có sự trói buộc, không có lòng tham dục thì không có sự trói buộc. 2.4 và 2.11 và 3.4 và 3.11 dùng đúng một văn bản.
  Thuật ngữ mới, 0 tiền lệ trong tầng: ekavihārī → sống một mình; sadutiyavihārī → sống chung với bạn; nandī → niềm vui; sārāga → lòng tham dục; saṁyoga → sự trói buộc; visaṁyutto và vippayutto lần lượt là không bị trói buộc và đã thoát khỏi sự trói buộc. Taṇhā hissa dutiyā dịch là tham khẩu là người bạn của vị ấy, vì dutiyā ở đây là bạn chứ không phải người thứ hai.
  Review đối kháng bắt được và đã sửa: 2.14 ban đầu dịch manussarāhasseyyakāni thành không vừa lòng người ta trú ở, câu đọc nghẽn; đã đổi thành đáng ghét với người ta. Cũng sửa hoa thường ở 2.8 và 3.7 và 3.8. Không còn khoá nào dịch khuôn.
