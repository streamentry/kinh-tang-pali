notes: |-
  **Uid gộp, khoá thật mang uid từng bài**: `pre` trong lát là `sn35.43-51:`, nhưng 37 khoá dùng `sn35.43:`…`sn35.51:` — đúng như `segmentPrefixesForUid` trong `src/lib/canon/load.ts`. Tệp bản dịch vẫn đặt tên theo uid gộp.
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim. **Coverage đo được 14/14 khoá Pāli có nội dung = 1.0000** khi tính cả lớp lấp `english-project` (5 khoá `1.8`, `1.13`, `1.14`, `1.15`, `1.16` đã `published`) theo `creditLayers` của `source/layers.yaml`. Tầng `vietnamese-current` không có cho bài này.
  **`triangulation` hạ xuống 7.8 — không nâng để né cổng.** Chính 5 khoá `1.13`–`1.16` nằm trong `1.14`–`1.16` cùng `1.8` **không có tầng Anh độc lập**: chúng chỉ được phủ bởi lớp lấp của chính dự án này, mà người dịch cũng là người viết lớp lấp — theo AGENTS.md, đó **không phải** một cách đọc English độc lập, nên không được tính như đối chiếu. Ngoài ra tám bài `sn35.44`–`sn35.51` chỉ còn câu mở đầu rồi `…pe…`, nên **nội dung lặp của chúng không có mặt trong bất kỳ tầng tham khảo nào**; người đọc muốn đối chiếu tám câu kệ ấy phải tự tra nguồn.
  **Dùng lại nguyên văn 13 khoá có Pāli trùng**, chủ yếu từ `sn35.52` (bài kế, **cùng phẩm** và **cùng bộ chín bài**): `5. Phẩm Tất Cả Vô Thường` cho `Sabbaaniccavagga`, `1.10`, `1.11`, `1.12`, `1.13`, `1.14`, `1.16`, `1.17`, `1.18`; cộng `sn35.7:1.13` cho `Thân là vô thường …` và `sn12.69:1.3`/`sn15.11:1.2` cho `Tại đó …`. `Thân vô thường` (không có `là`) lấy nguyên văn `sn35.7`.
  **Bản Anh lệch ở `1.7`, đã theo Pāli.** Bản Anh dịch `jivhā aniccā, rasā aniccā, jivhāviññāṇaṁ aniccaṁ, jivhāsamphasso anicco` thành *"The ear … nose … tongue …"*, nhưng Pāli là **lưỡi** và **các vị**. Tay và mũi nằm trong `…pe…` của `1.6`. Đây là chỗ Pāli thắng bản Anh; tiêu đề bài kế `sn35.52` đã ghi nhận đúng lỗi tương tự ở bản đó.
  **0 tiền lệ cho thân bài của tám bài `44`–`51`, phải tự đặt — lấy theo uddāna `sn35.52:2.1`–`2.5` để bài này và bài kế không lệch nhau:** `abhiññeyya` → *cần thắng tri* · `pariññeyya` → *cần liễu tri* (30 bài) · `pahātabba` → *cần từ bỏ* (102) · `sacchikātabba` → *cần chứng ngộ* · `abhiññāpariññeyya` → *cần thắng tri, cần liễu tri* · `upadduta` → *dơ bẩn* (31). Đây là **uddāna liệt kê tên các bài của phần năm mươi thứ nhất, không phải mô tả nội dung kinh** — không được đọc như một danh sách pháp mới, và không được thêm nghĩa cho phần bị lược.
  **Tên bài 0 tiền lệ.** `Aniccādisuttanavaka` → *Bộ Chín Bài Về Vô Thường V.v.*, theo khuôn `sn31.4-12:0.3` (*Bộ Chín Bài Về Người Cho Hương Và Người Nhận*, `Sāragandhādidātāsuttanavaka`): `…suttanavaka` → *Bộ Chín Bài Về …*.
  **Nháy kép.** Pāli không đóng dấu nháy ở tám bài `44`–`51` (mỗi bài chỉ có `“` rồi `…pe….`), nhưng nếu giữ nguyên thì bản Việt sẽ lệch dấu. Đã đóng `”` ở cả tám — đây là dấu trình bày, không phải chữ thêm vào nghĩa; các khoá `1.1`–`1.2` của `sn35.44`–`sn35.51` mỗi cặp tự cân. `sn35.43` mở ở `1.3` và đóng ở `1.17`.
