notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 14/14 = 100%** — cao nhất lát này; nhưng tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ phân phối Pháp Cú cho tiếng Việt), nên `triangulation` 9.0 chứ không cao hơn. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **20 khoá có PĨI TRÙNG NGUYÊN VĂN ở bài khác; 11 cặp dùng lại NGUYÊN VĂN.** `0.2` theo 9/9 (14. Phẩm Dây Xích) · `1.1` = `sn53.45-54:1.1` và `sn46.130:1.2` (Có năm thượng phần kiết sử này, này các tỳ-kheo.) · `1.3` = `sn53.45-54:1.3` (Tham sắc, tham vô sắc, mạn, trạo cử, vô minh—) · `1.4` = `sn53.45-54:1.4` · `1.7` = `sn45.96:1.5` (cùng chương; tôi **không** dùng `sn45.77:1.5` vì bản đó lặp *y cứ vào viễn ly* cho chánh kiến, trái với hình dạng Pāli của khoá này) · `2.8` = `sn46.130:1.10` · `2.9` = `sn46.130:1.11` · `2.11` = `sn38.10:1.14` · `3.0` = *Tóm lược:* · `3.1` = `sn53.45-54:2.1` (Bộc lưu, ràng buộc, chấp thủ,) · `4.0` = `sn12.72-81:12.0`.
  **Cố ý SỬA MỘT TIỀN LỆ SAI — `3.4`.** Bản đã có `sn53.45-54:2.4`, `sn48.115-124:2.4`, `sn48.169-178:2.4` đều dịch `khandhā oruddhambhāgiyāti` là *…thượng phần…*. `oruddhambhāgiyā` là **hạ** phần (`oruddha` = kéo xuống dưới, đối lập `uddhambhāgiyā` ở `1.1` mà chính bài này đã dịch *thượng phần*); dịch *thượng phần* ở đây là đảo nghĩa, và nó còn mâu thuẫn với chính `6.5` của bài. Tôi dịch *uẩn, và hạ phần, là vậy.* **Ba tệp nói trên nằm ngoài lát nên tôi không sửa; người điều phối nên xử lý.**
  **`2.12` tôi dịch theo Pāli, không sửa Pāli.** `Oghavaggo aṭṭhamo.` nghĩa là *thứ tám*, nhưng `0.2` của chính bài ghi `14. Oghavagga` và `6.5` lại nói Phẩm Dây Xích là *thứ mười ba*. Số trong uddāna vốn không khớp với tiêu đề phẩm ở tầng này; tôi dịch đúng chữ Pāli (*Phẩm Dây Xích, thứ tám.*) chứ không âm thầm sửa thành *thứ mười bốn*.
  **Tiêu đề `0.3` có hai tiền lệ cạnh tranh.** `Uddhambhāgiyasutta` trùng nguyên văn ở `sn46.130:0.3` (*Kinh Thượng Phần*) và `an9.70:0.3` (*Kinh Năm Sự Trói Buộc Kéo Lên*). Tôi chọn `an9.70` vì nó tạo đúng cặp đối xứng với bài ngay trước cùng phẩm `sn45.179:0.3` = *Kinh Năm Sự Trói Buộc Kéo Xuống Dưới* (`Orambhāgiyasutta`). Lưu ý bất nhất này tồn tại sẵn: phần **thân** bài tôi dùng *thượng phần kiết sử* theo đa số (10/10 bản trùng nguyên văn ở `1.1`), còn **tiêu đề** theo nhánh *kéo lên* của `an9.70`.
  **`1.6`/`2.6`: `ariyo aṭṭhaṅgiko maggo` → *Bát chánh đạo*, cố ý không theo hai tiền lệ cùng chương.** `sn45.162:1.6` và `sn45.30:1.16` dùng *Thánh đạo tám ngành*, `sn45.170:1.6` dùng *Bát chánh đạo*. Tôi theo `sn45.170` và theo cả lý do đã ghi trong `sn45.179` (13 bài `sn45.*` của loạt này chọn *bát chánh đạo*, cùng chương thắng tiền lệ toàn kho). `1.5`/`1.8`/`2.5`/`2.10` theo khuôn của `sn45.163:1.5` và `sn51.77-86:1.5` (cùng chương): *để chứng ngộ, để hoàn toàn hiểu rõ, để đoạn tận, để từ bỏ … thì cần phải tu tập bát chánh đạo*. `2.7` theo `sn45.103:1.4` cho `rāgavinayapariyosāna` = *sự khuếch tán và loại bỏ*.
  **`1.2`/`2.2`: `Katamāni pañca?` → *Thế nào là năm?*** 111 bản trùng nguyên văn, đo được: 79 *Thế nào là năm?*, 19 *Là năm nào?*, 5 *Năm nào?*, 2 *Năm pháp nào?*, 5 *Năm căn nào?*, 1 *Năm phương pháp nào?*. Tôi theo 79/111. Ở `sn48.10:1.2` — cùng lô này — tôi lại theo *Là năm nào?* của `sn48.9`/`sn48.11` vì đó là hai bài ngay trước/sau cùng công thức peyyāla trong **cùng phẩm**; hai lựa chọn khác nhau là có chủ ý, ghi ở đây để người biên tập quyết nếu muốn thống nhất toàn kho.
  **Uddāna `4.1`–`6.6` dịch theo tên phẩm thật của `sn45`**, lấy từ chính `0.2` của 13 bài trong tầng đó: Tào Môn (2), Sai Trái (3), Thực Hành (4), Chuỗi Lặp Lời Dạy Khác Nhau → *Ngoại Đạo* (5), Chuỗi Lặp Mặt Trời → *Mặt Trời* (6), Chuỗi Lặp Một Pháp → tôi dịch `Bahukate` là *tại Bahukā* (7), Chuỗi Lặp Một Pháp Lần Hai → `uppādo` là *sinh khởi* (8), Chuỗi Lặp Sông Lớn → `Divasavaggo` là *Phẩm Ngày* (9), Chuỗi Lặp Sông Lớn Lần Hai → `appamādena` là *Không Phóng Dật* (10), Phẩm Mười Một Lực (11), Phẩm Công Sức → `esanā` là *Tìm Kiếm* (12). `4.4` (`catutthaṁ paṭipanneneva`) là vần đệ quy gọi tên phẩm; tôi dịch *thứ tư là do cách thực hành* — **đây là chỗ dịch gần nghĩa nhất của bài**, vì `paṭipatti` ở đó không có tiền lệ nào trong tầng. `6.6` (`Maggasaṁyuttaṁ paṭhamaṁ`) theo `sn51.77-86:1.12`: *Tương Ưng Đạo Lộ*.
  **Thuật ngữ 0 tiền lệ, đặt kèm lý do.** `hatthiyāyī / assayāyī / rathayāyī / yānayāyī` (0 bản trong tầng dịch *đi voi / đi ngựa / đi xe ngựa / đi xe cộ*) · `bhogabhogī` → *hưởng thọ phú tài* (0 tiền lệ) · `bhogakkhandhaṁ` → *khối tài sản lớn* (`dn33:2.1.48`) · `Bahukā` giữ nguyên tên riêng Pāli vì không có tiền lệ địa danh trong tầng. `uddhacca` → *trạo cử* và `māno` → *mạn* là **dùng lại nguyên văn** của `sn53.45-54:1.3`.
  **Dấu lược.** `1.7` và `2.7` giữ đúng một dấu `…` mỗi khoá; `2.7` có **hai** dấu lược trong Pāli (`…pe…` ở giữa và một dấu lược trần ở cuối câu, vì câu nói tiếp sang `2.8`) nên bản Việt cũng phải có hai. Không mở rộng ở chỗ nào; Sujato mở rộng `…pe…` ở `1.7` thành đủ tám ngành, tôi giữ lược.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  **Vế thứ ba của ẩn dụ dòng sông: `pabbhāro` là *bãi bồn*, không phải *có dòng* — đã sửa 1 khoá
  (1 lần).** `nibbānaninno hoti nibbānapoṇo nibbānapabbhāro` là ẩn dụ ba vế của một dòng sông: *có
  xu hướng (nghiêng)* · *có bến* · *bãi bồn (đổ sang bờ bên kia)*. Bản đang có dịch vế ba là *có
  dòng về phía Niết-bàn* — tức **lặp lại nghĩa vế nhất** (`ninno` đã là *có xu hướng về phía …*)
  và **đánh rơi** nghĩa của `pabbhāro`, vốn là vế độc lập: chỗ nước dồn lên bãi rồi tràn sang bờ
  bên kia. Đã sửa thành *có bãi bồn về phía Niết-bàn* theo mẫu đúng đã có sẵn ở `sn45.152:1.1`
  (*cây trôi về phía đông, có bến về phía đông, có bãi bồn về phía đông*); giữ nguyên vế một, vế
  hai và nhịp câu của chính bài này. Khoá đã sửa: `sn45.180:2.9`. Lớp lỗi này sinh ra từ chính
  luật *Pāli trùng nguyên văn thì cách dịch phải khớp*: một bài sai trước đó được nhân bản sang
  các bài cùng Pāli, nên nó lan rộng và trông rất nhất quất — đúng cái làm cho nó khó thấy. Quét
  lại trên **mọi** dạng chia của `pabbhāra` (`nibbānapabbhāro` và `nibbānapabbhāraṁ`), chứ không
  chỉ dạng danh từ, mới thấy hết lớp này. **Không** ép về khuôn *nghiêng / xuôi / đổ* của 28 khoá
  ở 11 bài khác (`mn73`, `sn45.149`, `sn46.77-88`, `sn47.51-62`, `sn48.71-82`, `sn48.125-136`,
  `sn49.1-12`, `sn50.1-12`, `sn50.55-66`, `sn51.33-44`, `sn55.22`) và 3 khoá *có bãi bồn* đã có
  sẵn ở `sn45.152` — đó là các cách dịch khác hợp lệ; ép khuôn sẽ sinh vấn đề mới. Đo lại toàn
  tầng sau khi sửa: Pāli có `nibbānapabbhāra*` ở 87 khoá / 32 bài, **0 khoá** nào còn dịch vế ba
  bằng *có dòng*. Tệp này không có ghi chú cũ nào khen cụm *… dòng về phía …*, nên không có mục
  nào bị thay thế. Hạ `semantic_fidelity` (−0.3 × 1) và `terminology` (−0.1 × 1) theo **số lần sai
  × mức độ**; `final_score` tính lại bằng script từ trung bình số học thô của đúng 10 tiêu chí:
