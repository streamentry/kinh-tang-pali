notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không căn theo segment nên chỉ dùng để đối chiếu thuật ngữ và mạch lập luận, không dùng làm tầng cột). Tầng `vietnamese-current` căn theo segment không có cho bài này (tại commit đã ghim chỉ có 26 chương Pháp Cú).
  **Coverage English, đo thật.** Mẫu số = 36 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Sujato phủ **29/36 = 0,8056**, đứng trên ngưỡng 0,80 nhưng **sát ngưỡng** (chỉ hơn 0,0056, tức dư đúng 1 khoá). Bảy khoá còn lại Sujato để trống: `8.3`, `9.1`, `9.4`, `10.1`, `10.3`, `11.1`, `11.4` (Sujato gộp cả đoạn lặp `8.1`–`11.5` vào một dòng ghi chú ở `8.1`: *Saviṭṭha repeats exactly the same series of questions, and Nārada answers just as Musīla did*). Cả bảy khoá đó đã được lớp `english-project` (đã published) lấp, và mỗi khoá lấp chép lại đúng lời Sujato đã ghim cho khoá Pāli y hệt trong cùng bài (`8.3`, `9.4`, `10.3`, `11.4` giống `1.5`; `9.1`, `10.1`, `11.1` giống `12.1` chỉ khác dấu cuối `—` so với `:`), nên khi tính cả hai lớp thì 36/36 = 1,00. Nhưng lớp lấp **không phải bản đọc độc lập**; nên bài này **không** tuyên bố đã đối chiếu English độc lập cho cả 36 khoá, chỉ cho 29. Cổng coverage theo Sujato đạt (0,8056 ≥ 0,80) nên không có blocker coverage và không cần entry trong `content/meta/reference-gaps.yaml`; nhưng vì sát ngưỡng, nếu bản Anh đã ghim đổi thì cần đo lại. Hai khoá `6.1`, `13.1` có Pāli đúng 40 ký tự sau khi chuẩn hóa khoảng trắng, đứng đúng ngưỡng `≥ 40` của cổng nên được tính vào mẫu số (Sujato phủ cả hai); nếu đo theo ngưỡng chặt hơn thì Sujato-only còn 27/34 = 0,794, nhưng tính cả lớp `english-project` thì vẫn 1,00.
  **Tên riêng, chọn theo Pāli root, khác bản Anh và bản Thích Minh Châu.** Pāli ghim đọc `musilo`, `paviṭṭho`, `nārado`, `ānando`; bản Anh Sujato và bản Việt Thích Minh Châu viết *Musīla* và *Saviṭṭha* (cách đọc khác của cùng tên, thường thấy ở bản PTS). Bài này viết **Musila** và **Paviṭṭha** theo đúng Pāli root (authority), vì tầng đã có Paviṭṭha ở `thag1.87` (*Trưởng lão Paviṭṭha*) và không có tiền lệ nào cho dạng *Saviṭṭha*. Cách gọi *Musīla*/*Saviṭṭha* là cách đọc khác, không phải nghĩa khác; người biên tập có thể đồng bộ nếu muốn theo bản Anh. `Ghositārāma` → *tu viện Ghosita* (tại tu viện Ghosita 12 khoá so với trong tu viện Ghosita 5 khoá, ở toàn tầng); `Kosambī` theo tầng (54 khoá *Kosambī* so với 1 khoá *Kosambi*). Tựa bài *Kinh Ở Kosambī* theo tiền lệ *Kinh Ở Kusinārā* (`an3.123`, `an4.76`), *Kinh Ở Sāketa* (`sn48.43`).
  **Công thức "ngoài niềm tin…", thuật ngữ theo tiền lệ đã đo.** `saddhā, ruci, anussava, ākāraparivitakka, diṭṭhinijjhānakkhanti` → *niềm tin, sở thích, truyền khẩu, suy luận theo lý lẽ, chấp nhận một quan điểm sau khi suy tầm*, đúng như `mn95:14.5` và `mn101:11.4` (cùng năm thuật ngữ, cùng cách dịch); `mn102:15.2` dịch năm thuật ngữ này thành *tín, sở thích, truyền khẩu, suy xét theo dấu vết, chấp nhận tri kiến sau khi suy tầm* — bài này theo `mn95`/`mn101` vì cùng danh sách thuật ngữ kỹ thuật đứng riêng, và giữ *ngoài* đứng trước từng mục như `aññatra` lặp ở Pāli (không nén thành "ngoài A, B, C"). `paccattameva ñāṇaṁ` → *có trí tự mình biết*, giữ `ñāṇa` là *trí*, không viết lại thành "hiểu". `ahametaṁ jānāmi ahametaṁ passāmi` → *tôi biết điều này, tôi thấy điều này*, giữ hai động từ và đại từ lặp. `paccayā` → *do duyên … mà có …* theo `sn12.67` và `sn12.1`; `nirodhā` → *diệt tận* như `sn12.67`; `bhavanirodho nibbānaṁ` → *Hữu diệt tận là Niết-bàn* (khác `an10.7:5.2` *sự diệt hữu vi*, vì sn12 dịch `bhava` là *hữu*: 70 khoá). Thuật ngữ trong dãy mười hai chi: `vedanā` → *cảm thọ* (cùng dãy `paccayā` ở sn12: cảm thọ 11 so với thọ 3; toàn tầng 25 so với 22), `taṇhā` → *khát ái* (sn12: 5 so với 1), `upādāna` → *chấp thủ* (sn12: 4 so với *thủ* 6; chọn *chấp thủ* theo `sn12.67`, `sn12.1`, `sn12.16`), `saḷāyatana` → *sáu xứ* (28 so với *sáu căn* 3), `saṅkhārā` → *các hành*, `nāmarūpa` → *danh sắc*, `jāti` → *sinh*, `jarāmaraṇa` → *già chết*. `khīṇāsavo` → *các lậu hoặc đã tận* (12 khoá dạng *đã tận* trong 45 khoá `arahaṁ khīṇāsavo`, nhiều hơn *đoạn tận* 4, *hết* 2); `tuṇhī ahosi` → *im lặng* (26 so với *giữ im lặng* 7); `Evaṁ vutte` → *Khi được nói như vậy* (sn 3, mn 10). `kantāramagge` → *con đường hoang vắng* (`dn10:2.11.1`, 3 chỗ), `ghammābhitatto ghammapareto kilanto tasito pipāsito` → *bị nắng nóng thiêu đốt và hành hạ, mệt mỏi, khát và khô cổ* theo `mn40:13.2` (cùng chuỗi Pāli), `udakavārako` → *gàu nước*.
  **Dấu câu và nháy.** Pāli kết `’”ti.` (nháy đơn đóng, nháy kép đóng, rồi `ti`, rồi chấm) → *.’”* (chấm nằm trong nháy đơn). Đo toàn tầng: *.’”* 303 khoá, *’.”* 179, *’”.* 67; riêng sn thì *’.”* 68, *’”.* 31, *.’”* 30; chọn *.’”* theo đa số toàn tầng và theo `sn12.67:9.16`. Hệ quả: một số khoá trùng Pāli với `sn12.35` khác dấu chấm (`1.6`, `2.13`, `8.4`, `9.5`: sn12.35 viết *’”.*). Nháy đơn mở ở `2.2` đóng ở `2.11`, nháy kép mở ở `2.1` đóng ở `2.11`; nháy kép mở ở `7.5` chạy qua `7.7` và `8.1` (hai khoá này không có nháy kép, đúng như Pāli) rồi đóng ở `8.2`. `ti?` ở cuối câu hỏi → *… hay không?”*, đặt sau nháy đơn đóng (*’ hay không?”*), không mở rộng thành câu mới. Ở `9.1` Pāli kết bằng `—` (khác `:` ở `10.1`, `11.1`, `12.1`); giữ `—` ở `9.1` và để `9.2`–`9.3` liền mạch.
  **Dùng lại nguyên văn, đếm được.** Trong chính bài có **64 cặp** Pāli trùng nguyên văn (so sánh sau khi cắt khoảng trắng; gồm nhóm 10 khoá `1.5, 2.12, 3.3, 4.12, 5.3, 8.3, 9.4, 10.3, 11.4, 12.3`, nhóm `2.1, 3.1, 4.1, 5.1`, nhóm `10.1, 11.1, 12.1`, nhóm `1.4`=`8.2`, `1.6`=`8.4`, `2.13`=`9.5`, `3.2`=`10.2`, `3.4`=`10.4`, `4.2`=`11.2`, `4.11`=`11.3`, `4.13`=`11.5`, `5.2`=`12.2`, `5.4`=`12.4`), **0 cặp bản Việt khác**. Ở các khoá Pāli lệch nhau đúng một ký tự (`1.3` viết thường `aññatreva` so với `2.1` viết hoa; `9.1` kết `—` so với `10.1` kết `:`) bản Việt chỉ khác ở đúng chỗ khác đó. Trong **tầng** có 287 cặp Pāli trùng nguyên văn với khoá ở bài khác: `0.2` (18/18 cặp cùng *7. Phẩm Lớn*), `14.4` (253/260 cặp cùng *Thứ tám.*, còn lại *Bài thứ tám*/*Kinh thứ tám*) dùng lại nguyên văn; 8 khoá còn lại (`1.6`, `2.5`–`2.8`, `2.13`, `8.4`, `9.5`) trùng Pāli với `sn12.35` nhưng bản Việt ở đó khác, **tổng 15 cặp bản Việt khác trong 287**, đều là khác thuật ngữ (*thọ*/*cảm thọ*, *sáu căn*/*sáu xứ*) hoặc dấu chấm trong nháy (mục trên); `2.9` trùng nguyên văn `sn12.35`. Đã đối chiếu với sn12.35 theo từng khoá, không có sai nghĩa.
  **Số Pāli.** Bài không có số lượng nào cần tính (không có `eka`, `dve`, `sata`, `sahassa`…); mười hai chi duyên khởi (`avijjā` → `jarāmaraṇa`) được liệt kê đủ ở `2.2`–`2.11` (mười hai chi, mười khoá) và `4.2`–`4.11` theo đúng thứ tự Pāli, không thêm, không bỏ chi nào; `9.2`–`9.3` và `11.2`–`11.3` giữ đúng phần lược `…pe…` thành một `…`.
  **Bất định đã ghi nhận, không che.** (1) `14.2`–`14.3`: `evaṁvādī tvaṁ, āvuso paviṭṭha, āyasmantaṁ nāradaṁ kiṁ vadesī` và `evaṁvādāhaṁ … na kiñci vadāmi`. Theo chữ, `evaṁvādī` ở cách chủ ngữ ghép với `tvaṁ` (*hiền giả là người nói như vậy*), `evaṁvādāhaṁ` ghép với `ahaṁ` (*tôi là người nói như vậy*). Cả bản Anh Sujato (*when he speaks like this*) lẫn bản Thích Minh Châu (*nói như vậy thời Hiền giả nói gì về Tôn giả Nārada*) hiểu `evaṁ` là lời của Nārada, tức Nārada là người nói. Bản Việt dùng *nói như vậy* không có chủ ngữ rõ ràng để không buộc một trong hai cách hiểu; đã đối chiếu `sn55.23:8.20` (Pāli gần như y hệt, chưa có bản Việt trong tầng). Chọn cách trung tính, ghi bất định. (2) `13.5` `na ca kāyena phusitvā vihareyya`: câu nghĩa đen *và không an trú sau khi chạm bằng thân*; bản Anh Sujato dịch *couldn't physically touch it*, bản Thích Minh Châu dịch *đứng chịu, thân thể không chạm nước*. Bài này viết *ở đó mà không thể chạm vào nước bằng thân*, không dùng *thân chứng* vì ở đây là ví dụ nghĩa đen (người khát đứng bên giếng không có gàu), khác công thức `kāyena phusitvā viharati` của `mn70`. (3) `1.3` `atthāyasmato musilassa paccattameva ñāṇaṁ`: `atthi` + `āyasmato` (*có ở nơi Tôn giả… trí riêng của chính mình*); chuyển thành *Tôn giả Musila có trí tự mình biết rằng*, hai cách xưng (`āvuso musila` ở vế đầu, `āyasmato musilassa` ở vế sau) giữ nguyên *hiền giả* / *Tôn giả* như Pāli. (4) `13.5` `udakan’ti` dịch *‘đó là nước’* (bản Thích Minh Châu: *giếng này có nước*; Sujato: *there was water*); Pāli chỉ có `udakaṁ`, không có động từ *là* hay *có*, nên đây là cách chọn tự nhiên chứ không thêm ý. (5) `6.1`, `13.1` `Tenahāyasmā`: `tena hi` + `āyasmā` (*nếu vậy thì Tôn giả…*), dịch *Vậy thì Tôn giả … là bậc A-la-hán… phải không?* với `ti?` là dấu hỏi.
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 84/84, đúng thứ tự Pāli. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá, 84 khoá (mẫu số 84, 0 lệch). Dấu lược: 20 khoá Pāli có dấu lược (`2.2`–`2.10`, `4.2`–`4.10`, `9.2`, `11.2`; trong đó `2.2`, `4.2`, `9.2`, `11.2` là `…pe…`, 16 khoá còn lại là `…` trần); cả 20 khoá Việt giữ đúng một `…`, không mở rộng. Pāli không có `(…)` ở khoá nào nên Việt cũng không có. NFC, không khoá rỗng, không khoảng trắng thừa; Pāli chỉ lọt sang bản Việt ở tên riêng (Musila, Paviṭṭha, Nārada, Ānanda, Kosambī, Ghosita, Saṁyutta Nikāya).
  Cổng kỹ thuật `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy, không chạy trong lát agent này; vì vậy `technical_integrity` đặt 9.6 chứ không 10.0.
