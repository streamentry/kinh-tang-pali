notes: |-
  Đợt 16, lát f206. TẠO MỚI toàn bài: 40/40 khoá đúng tập segmentMapForUid,
  dịch từ Pāli root snapshot đã ghim, đối chiếu EN Sujato và mẫu đã publish
  sn12.82/sn12.83-92 (cùng Antarapeyyāla).
  Khuôn theo sn12.82 (cùng công thức): `Jarāmaraṇaṁ` → "sự chết và già"
  (sn12.82:1.2 nguyên văn); thứ tự mạo danh giữ theo sn12.83:1.1 "Sự X, này các
  tỳ-kheo, khi chưa biết, chưa thấy" (bám trật tự Pāli `Jarāmaraṇaṁ, bhikkhave,`,
  không theo thứ tự đảo của sn12.82:1.2). `sikkhā karaṇīyā` → "thì phải tu tập
  để biết rõ như thật về sự chết và già" (EN "should train so as to truly know").
  Dấu lược: khoá nào Pāli có `…pe…` thì VI đúng MỘT `…` (20 khoá 1.1/1.2 của
  104–213), khoá 93-103:1.1 Pāli không có `…` nên VI không được thêm `…` (đúng
  truncation.test: không dấu lược thừa ngoài Pāli). Cân bằng đếm từng khoá đã
  kiểm bằng _checkwave.
  Ngoặc: Pāli tệp này KHÔNG có `”` đóng; VI tự đóng theo mẫu sn12.83-92 đã
  publish (mỗi phát biểu tự cân): mở 11 / đóng 11 — 93-103 đóng ở 1.1, các cụm
  104–213 mở ở 1.1 và đóng ở 1.2. Ghi nhận là quy ước trình bày, không phải
  nguyên văn Pāli.
  Mười một pháp thêm vào công thức (1.2 từng cụm), bám tiền lệ từng thuật ngữ:
  `yogo karaṇīyo` → "cần nỗ lực" (đăng ký trong meta an1.575-615); `chando` →
  "hăng hái" và `sampajaññaṁ` → "tỉnh giác" (an6.20:3.2); `ussoḷhī` → "bền bỉ"
  (an6.20:3.2); `appaṭivānī` → "không từ bỏ" (sn56.34); `sati` → "chánh niệm"
  (sn56.34); `appamādo karaṇīyo` → "hãy không phóng dật" (an4.116 nguyên văn);
  `ātappa` → "gắng sức", `vīriyaṁ` → "tinh tấn", `sātaccaṁ` → "kiên trì" đặt
  mới theo đúng nghĩa, phân biệt với ba tiền lệ trên.
  Kệ tóm lược 2.1–2.6: đếm đủ mười hai pháp ứng `appamādena dvādasā`
  (Đạo Sư, Học, Nỗ lực, Hăng hái, Bền Bỉ, Không từ bỏ, Gắng sức, Tinh tấn,
  Kiên trì, Chánh niệm, Tỉnh giác, Không phóng dật). `sātaccamuccati` đọc là
  `sātaccaṁ + uccati` → "Tinh tấn và Kiên trì được gọi;" — mức chắc vừa phải,
  ghi nhận ở đây.
  Kệ đếm 3.1–3.4: `dvattiṁsa satāni` → "ba mươi hai trăm bài kinh" — BẤT ĐỊNH
  có ý nghĩa: đọc theo nghĩa đen 32 × 100, chưa đối chiếu được cách đếm của
  bậc trước (12 kinh × ... không khớp trực tiếp); giữ bản dịch nghĩa đen thay
  vì suy ra một con số khác. `peyyālaantaramhi yeti` → "Peyyāla ở giữa trong
  này." theo bản nháp điều phối — không có tiền lệ VI, ghi nhận là đặt mới.
  `2.7` "Các kinh tạng Phẩm Lặp Lại Bên Trong đã hoàn tất." và `3.5` "Tóm lược
  các Phẩm Lặp Lại Bên Trong đã hoàn tất." theo mẫu `Suttantā ... niṭṭhitā` /
  `uddānaṁ samattaṁ`; `3.6` `Nidānasaṁyuttaṁ samattaṁ` → "Thế là xong Bộ Duyên
  Khởi." (EN "The Linked Discourses on causality are complete."); `2.0`
  `Tassuddānaṁ` → "Tóm lược:" (tiền lệ tuyệt đối trong corpus).
  `0.3` `Sikkhāsuttādipeyyālaekādasaka` → "Tập Kệ Mười Một Bài Về Học Và Những
  Điều Kế Tiếp": giữ khuôn "Tập Kệ ... Về ... Và Những Điều Kế Tiếp" của
  sn12.72-81/sn12.83-92, nhưng GIỮ số đếm -ekādasaka (mười một) thay vì bỏ như
  tiền lệ đã bỏ -dasaka, vì EN cũng dịch "Sets of Eleven"; không thêm "Rút Gọn"
  (không có cơ sở Pāli trong khoá này).
  Tầng tham khảo: EN Sujato có chữ ở 15/40 khoá (toàn khoá 0.1–0.3, 1.1 của
  93-103 và 1.2 của mười cụm); 25 khoá EN trống đều < 40 ký tự nên KHÔNG rơi
  vào nhóm substantive — coverage đo được 1/1 substantive (ratio 1 ≥ 0.8) nên
