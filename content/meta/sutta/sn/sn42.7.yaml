notes: |-
  ĐỌC LẠI TỪNG CÂU TỪ PĀLI. Bản dịch có sẵn do phiên trước ghi, thiếu metadata; tôi đã đối
  chiếu 47/47 khoá với Pāli root đã ghim và sửa 4 khoá. Coverage English đo bằng đúng công
  thức `src/lib/canon/reference.ts`: 34/34 khoá Pāli có nội dung đều có chữ Anh Sujato =
  **100%**, không cần tầng lấp `english-project`. Trên ngưỡng 0.8 nên không phải ghi
  `content/meta/reference-gaps.yaml`.

  SỬA 4 KHOÁ:
  1.10. 1.11 có đuôi rác "mà được": "ít nhất thì còn làm được thức ăn cho bò **mà được**”ti."
  Pāli `Antamaso gobhattampi bhavissatī` chỉ là "ít nhất thì còn làm được thức ăn cho bò".
  Cặp song song 3.5 (`Antamaso bhaṇḍadhovanampi bhavissatī`) dịch gọn "ít nhất thì còn rửa
  được bát nồi”ti." — không có đuôi đó. Đây là chữ thêm không có nguồn, đúng lớp lỗi hay gặp
  nhất. Đã bỏ.
  1.11. 1.2 và 5.1 BỎ RƠI MỐC `putto`: `asibandhakaputto gāmaṇi` = thôn trưởng, **con trai
  của** Asibandhaka, nhưng bản dịch chỉ còn "thôn trưởng Asibandhaka". Đã sửa thêm mốc ấy ở
  cả hai chỗ.
  1.12. 1.1 dịch `bhagavā` thành "Đức Phật" trong khi 7 chỗ còn lại của cùng bài dùng "Đức Thế
  Tôn". Đã chuẩn hóa theo đa số trong chính bài (cả bài không dùng "Thế Tôn" cho `bhagavā` ở
  đâu khác).

  ⚠ SỬA Ở ĐÂY LÀM LỆCH VỚI BÀI ANH EM — CẦN NGƯỜI BIÊN TẬP XỬA NỮA MỘT LƯỢT.
  Mốc `putto` mà tôi vừa thêm vào 1.2 và 5.1 thì bài anh em `sn42.6:1.2`
  (`asibandhakaputto gāmaṇi`, đúng một công thức Pāli) đang BỎ SÓT, và `sn42.6` không thuộc
  lát này nên tôi không sửa được. Lý do tôi vẫn sửa ở đây: `AGENTS.md` đặt Pāli root là
  authority cuối cùng, và tiêu đề `sn42.6:0.3` (`Asibandhakaputtasutta` → "Kinh Con Nội
  Asibandhaka") của chính bài đó **có** giữ mốc này — tức bài đã tự mâu thuẫn với thân bài.
  Đánh đổi: hai bài anh em giờ lệch nhau ở đúng một công thức Pāli. **Đề nghị sửa `sn42.6:1.2`
  theo cách ở đây trong cùng một đợt.**

  Thuật ngữ, kèm đếm: `gāmaṇi` → thôn trưởng (88 lần toàn kho, 0 lần "làng trưởng") ·
  `samaṇa/brāhmaṇa/paribbājaka` → sa-môn, bà-la-môn, du sĩ theo kiến khác ·
  `ādikalyāṇa/majjhekalyāṇa/pariyosānakalyāṇa` → tốt lành ở đầu/giữa/cuối ·
  `sātthaṁ sabyañjanaṁ` → có nghĩa, có lời hay · `paripuṇṇa` → viên mãn (909 lần) ·
  `parisuddha` → thanh tịnh (1249 lần) · `maṁdīpā maṁleṇā maṁtāṇā maṁsaraṇā` → hòn đảo,
  bến, chỗ tựa, nơi nương tựa · `upāsakaupāsikā` → cư sĩ nam, cư sĩ nữ.
  `ahārī aparihārī` ở 3.1 tách thành "không rỉ, không thấm" và giữ nguyên như vậy ở 3.2 và
  3.3 — Pāli có ba tính từ (`acchiddo`, `ahārī`, `aparihārī`) nên tách là giữ đủ ba; Sujato gộp
  thành "uncracked and nonporous". 0.1 giữ `Saṁyutta Nikāya 42.7` theo 1673 khoá `:0.1`
  đã có; 0.2 `Gāmaṇivagga` → "1. Phẩm Làng" đúng 6 bài cùng phẩm; 0.3 `Khettūpamasutta` chưa
  có tiền lệ, dịch theo mô tả bài (ruộng tốt/tầm thường/xấu và bình nước).

  Dấu lược: 5.2 có `…pe…` giữa "Tuyệt diệu thay" và lời nguyện, giữ đúng MỘT `…` (luật
  10.1, không mở rộng).

  KHÔNG ĐỐI CHIẾU ĐƯỢC tầng `vietnamese-current` (Hòa thượng Thích Minh Châu): lớp Bilara
