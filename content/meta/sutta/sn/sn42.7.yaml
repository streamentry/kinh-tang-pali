  `technical_integrity` = 9.6 vì lát này không được chạy `npm run validate|test|check|build`
  (bị cấm). Tự kiểm bằng `_hvi.kiểm()`: 47/47 khoá, không khoá thừa, không Pāli lọt, không
  trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, toàn bộ ký tự
  NFC.
