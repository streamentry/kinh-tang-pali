notes: |-
  COVERAGE ENGLISH — ĐO THẬT, mẫu số KHÔNG rỗng. Mẫu số = 67 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) theo `source/layers.yaml`; tầng `english-sujato` đã ghim phủ 67/67 = 1,0000, ngưỡng 0,8 cần tối thiểu 54 khoá. Không dùng lớp lấp `english-project` (bài này không có), nên toàn bộ coverage là đối chiếu Anh độc lập của Sujato. Tầng `vietnamese-current` vắng tại commit đã ghim (bilara chỉ có Pháp Cú), không phải thiếu sót của bài. Bản Việt nguyên bài của Hòa thượng Thích Minh Châu (sc-data, Bình Anson hiệu đính chuẩn bị văn bản) chỉ dùng để tra cứu toàn văn, không căn lề theo khoá. Không cần entry `reference-gaps.yaml`.

  BỐ CỤC. Bài có 24 đoạn công thức, 103 khoá. Đoạn 1 mở bằng 1.1–1.3 (nidāna, lời mở, lời nhắc nghe) rồi 1.4–1.7 là câu hỏi, nội dung, tác ý, kết luận của triền cái đầu tiên (dục tham); đoạn 2–5 là bốn triền cái còn lại; đoạn 6–12 là bảy giác chi; đoạn 13–17 là thức ăn-không-phải của năm triền cái (`anāhāro`); đoạn 18–24 là của bảy giác chi. Lời Phật mở nháy kép ở `sn46.51:1.2` và đóng ở `sn46.51:24.4`; không có nháy đơn, không có dấu lược `…` nào trong Pāli của bài (0/103), nên bản Việt cũng 0.

  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC. Pāli của `sn46.2` (Kinh Thân) dùng đúng cùng công thức; đo trên toàn tầng `sn`, 57 khoá của bài này có Pāli trùng nguyên văn với khoá đã dịch ở bài khác (149 cặp), bản Việt khác ở 0 cặp: `āhāro` → thức ăn; `subhanimittaṁ` → tướng tịnh; `paṭighanimittaṁ` → tướng đối kháng; `arati tandi vijambhitā bhattasammado cetaso ca līnattaṁ` → không hân hoan, uể oải, biếng nhác, say sau khi ăn, và tâm suy nhược; `cetaso avūpasamo` → tâm không an tịnh; `X-ṭṭhānīyā dhammā` → các pháp làm nhân cho X; `kusalākusalā… kaṇhasukkasappaṭibhāgā dhammā` → các pháp thiện và bất thiện, … có phần đen trắng đối ứng nhau; `ārambhadhātu nikkamadhātu parakkamadhātu` → khởi phát giới, tinh cần giới, dũng mãnh giới; `bhiyyobhāvāya vepullāya` → tăng trưởng và lớn mạnh; `bhāvanāya pāripūriyā` → tu tập viên mãn; `Tattha ayonisomanasikārabahulīkāro` → Thường xuyên không như lý tác ý ở đó—; `Tattha yonisomanasikārabahulīkāro` → Thường xuyên như lý tác ý ở đó—. Trong bài, 10 nhóm khoá có Pāli trùng nguyên văn (108 cặp), bản Việt khác ở 0 nhóm. Đặt mới (không có tiền lệ cùng Pāli): `asubhanimittaṁ` → tướng bất tịnh (đối ứng `subhanimittaṁ` → tướng tịnh); `cetaso vūpasamo` → tâm an tịnh (đối ứng `avūpasamo`); `mettācetovimutti` → tâm giải thoát bằng từ (theo hai khoá đã dịch trong `sn`); `anāhāro`/`ayamanāhāro` → không phải thức ăn / đây không phải là thức ăn; `Āhārasutta` → Kinh Thức Ăn (Sujato đặt tên Nourishing, Hòa thượng Thích Minh Châu Đồ Ăn). `Sākacchavagga` → 6. Phẩm Hỏi Luận theo `sn46.53`.

  BẤT ĐỊNH — `amanasikārabahulīkāro` (`sn46.51:18.3`–`24.3`, bảy khoá). Pāli đã ghim đọc `amanasikāra` (không tác ý), khác `ayonisomanasikāra` (không như lý tác ý) ở đoạn 1–5. Tôi dịch sát Pāli: Thường xuyên không tác ý ở đó—. Sujato dịch Not frequently applying the mind to that, tức đọc `bahulīkāro` như thường xuyên làm và phủ định cả cụm, khác nhẹ về phạm vi phủ định so với bản Việt; bản Hòa thượng Thích Minh Châu viết phi như lý tác ý ở cả bảy chỗ này (giống đoạn 1–5), tức theo một dị bản khác hoặc đồng nhất hai khái niệm. Không phân xử được từ Pāli đã ghim hơn mức đã chọn; cách hiểu cả đoạn (các pháp là chỗ trụ của giác chi, nếu thường không chú tâm thì thiếu thức ăn cho giác chi) không đổi. Ghi ở đây, không đưa vào thân kinh.

  KHÁC BIỆT ĐÃ PHÂN XỬ. (1) `vijambhitā` Sujato dịch yawning; bản Việt giữ biếng nhác theo `sn46.2:4.2` để Pāli trùng nguyên văn cho cùng bản dịch. (2) `cetaso ca līnattaṁ` Sujato mental sluggishness, Việt giữ tâm suy nhược theo `sn46.2`. (3) Sujato ở `sn46.51:1.3` viết Listen … rút gọn lời mời nghe thành dấu lược không có trong Pāli; bản Việt dịch đủ taṁ suṇātha thành hãy lắng nghe điều ấy. (4) Số lượng: `pañcannañca` và `sattannañca` ở `sn46.51:1.2` là năm và bảy; kiểm đếm khớp với bố cục (5 triền cái ở đoạn 1–5 và 13–17, 7 giác chi ở đoạn 6–12 và 18–24).

  KIỂM CHỨNG. Tự đối chiếu in cặp Pāli↔Việt cả 103 khoá và đọc đối kháng: tập khoá Việt = tập khoá Pāli (103 = 103), thứ tự khoá giống Pāli, nháy kép khớp từng khoá, NFC sạch, không khoá rỗng, không Pāli lọt sang Việt. Kết quả 0 lệch.

