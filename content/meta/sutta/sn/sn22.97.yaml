  CHÍNH SÁCH KHO Ở 6.11: 50 tiền lệ, 28x thì biết rõ: không còn gì là tự thân nữa (bản đa số
  BỎ chữ ti), 21x biết rõ: không còn gì là tự thân nữa ti. Pāli có `”ti.` nên tôi giữ ti,
  đồng dạng với sn22.93:1.24. Ghi ra vì lệch với bản đa số.

  CHÍNH SÁCH KHO Ở 6.1: PĀLI THIẾU NHẤT QUÁN. `6.2` và `6.7` có `”` mà không có `“` mở trước
  (6.1 và 6.4 trong Pāli không mở ngoặc kép). Toàn bài vì thế lệch −1 nếu bám Pāli từng khoá.
  Tôi mở `“` ở 6.1 — đúng như tiền lệ sn24.19:3.1 (cùng công thức hỏi Taṁ kiṁ maññasi) và
  sn24.4:3.2. Có tài liệu tham chiếu khác làm tiền lệ: sn22.93:1.14 và sn22.154:1.10 chọn
  cách khác — bỏ luôn dấu `”` và `ti` ở câu hỏi. Tôi chọn hướng giữ ngoặc kép vì không bỏ chữ
  có trong Pāli. NGƯỜI BIÊN TẬP NÊN THỐNG NHẤT HAI HƯỚNG NÀY TRONG TẦNG sn.

  `brahmacariyavāso` → đời sống phạm hạnh (tiền lệ an3.100:1.2, sn12.19:6.7 ghi đời sống phạm
  hạnh). `dukkhakkhaya` → sự chấm dứt trọn vẹn khổ đau. `Ettakampi` → chỉ chừng này thôi;
  `abhavissa` → dẫu có chừng ấy … nếu … thì; `Yasmā … tasmā` → Vì … nên … . Bốn cặp 2.x–5.x
  dịch nhất quán với nhau, mỗi cặp theo đúng uẩn của nó (sắc/cảm thọ/hành/thức).

  QUY TẮC DẤU LƯỢC: 1.5, 1.9, 1.10, 1.11, 4.1, 6.8, 6.9, 6.10 — tám khoá có `…`, giữ tám
  dấu `…`, không mở rộng ở đâu cả. Riêng 1.5 và 4.1 mở đầu bằng Atthi nu kho / Ettakāpi có
  sẵn trong chính khoá Pāli đó nên chữ Bạch Thế Tôn và Chỉ chừng này thôi là có nguồn, không
  phải mở rộng.

