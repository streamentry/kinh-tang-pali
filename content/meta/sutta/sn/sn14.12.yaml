notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh của Bhikkhu Sujato. Tầng Anh CÓ và đã đo: manifest liệt kê sutta/sn/sn14/sn14.12_translation-en-sujato.json, 38/39 khoá có chữ.
    Coverage đo được: 31/31 Pāli có nội dung có Anh = 1.0000, trên ngưỡng 0.8. Không cần entry reference-gaps.
    Thuật ngữ chuỗi 5 tầng lấy từ sn14.7 (đúng cấu trúc dhātu → saññā → saṅkappo → chando → pariḷāho → pariyesanā, đã dịch sẵn): giới tánh, tưởng, tư duy, ham muốn, nóng nảy, tìm cầu. Tam sở lấy từ an6.111:1.3 và :1.7: Sở dục, Sở oán giận, Sở chê bai, sở xuất giai, sở không oán giận, sở không chê bai. Tam tưởng lấy từ an3.123:3.6 và :5.6: tưởng về dục, tưởng về sân, tưởng về sát hại, tưởng về xuất ly, tưởng không sân, tưởng không sát hại.
    micchā paṭipajjati → hành xử sai quẻ, sammā paṭipajjati → hành xử đúng đắn; bám tiền lệ tránh hành động sai quẻ trong các dục là thiện. assutavā puthujjano → vị phàm nhân vô học, sutavā ariyasāvako → vị Thánh đệ tử đa văn (đa số trong tầng).
    3.1 và 4.1 có …pe… và ba … rời; đếm bằng lược() của _hvi.py ra 4 dấu lược, giữ đúng 4. 8.2 đếm 1, giữ 1. Cũng giữ đúng cấu trúc rời của Pāli: 8.3 và 8.4 chỉ là một mục + một dấu lược, không mở rộng thành vế đầy đủ.
    0 tiền lệ cho Sanidānasutta: đo toàn tầng, 0 khoá Pāli nào chứa Sanidāna đã có bản Việt. Chọn Kinh Vì Có Nhân để giữ đối lập với anidāna (không nhân) của chính bài.
    Ẩn dụ cây đuốc ở 5.1 và 10.1 chưa có tiền lệ trong tầng (0 lần tiếng Anh đã ghim); dịch sát Pāli: cây đuốc đang cháy, bụi cỏ khô, những loài vật sống ở trong cỏ và trong gỗ.
    5.2 và 10.2 bốn động từ pajahati, vinodeti, byantīkaroti, anabhāvaṁ gameti dịch từ bỏ, trừ diệt, làm cho tiêu tan, đưa đến chỗ không; Sujato dịch give it up, dispel it, eliminate it, obliterate it — cùng bốn ý. savighātaṁ saupāyāsaṁ sapariḷāhaṁ dịch khổ não, bị khổ áp đảo, mệt mỏi, khó nhọc (bốn danh từ).
    Tầng vietnamese-current vắng, không có lớp lấp english-project. Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
