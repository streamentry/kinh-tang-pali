notes: |-
  Dịch trọn 80/80 khoá từ Pāli root đã ghim, đối chiếu English Sujato đã ghim, lớp `english-project` của chính bài này, bản Việt nguyên bài ở mục Tra cứu toàn văn và các bài song song `mn67` (cùng sự kiện Đức Thế Tôn trục xuất chúng tỳ-kheo, Phạm thiên Sahampati nhắc lại hai ví dụ) và `iti91` (cùng đoạn "cách sống thấp nhất").

  **Coverage English.** Mẫu số = 53 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Sujato phủ 47/53 = 0,8868, trên ngưỡng 0,80. Sáu khoá Sujato để trống (`2.6`, `3.6`–`3.10`) được lớp `english-project` lấp, nâng cổng lên 53/53; nhưng lớp lấp do cùng người làm với bản Việt nên **không phải đối chiếu độc lập** — phần độc lập chỉ là 47/53. Vì thế `triangulation` đặt 8,8 chứ không cao hơn. Sáu khoá đó đều là Pāli lặp lại nguyên văn các khoá đã được Sujato phủ (`2.3`, `2.5`, `2.7`, `3.5`) và có tiền lệ Việt ở `mn67`, nên chỗ dựa vào Pāli một mình là hẹp.

  **Pāli trùng nguyên văn trong chính bài: 3 cặp (`2.3`=`3.5`, `2.5`=`3.7`, `2.7`=`3.9`), cả 3 cặp dùng bản Việt y nguyên.** Các khoá gần giống nhưng khác Pāli (`2.4`/`3.6` đổi `mamaṁ`/`bhagavantaṁ`; `2.6`/`3.8`/`3.10`; `2.9`/`3.10` dùng `alabhantānaṁ dassanāya` → "không được thấy", khác `apassantānaṁ` → "không thấy") được giữ khác có chủ ý, theo cách `mn67:7.6` và `mn67:7.10` phân biệt hai dạng này.

  **Tiền lệ ngoài bài.** Đã dò 34 khoá có Pāli trùng nguyên văn với khoá đã dịch ở tầng (1.240 cặp, trong đó 647 cặp có bản Việt y nguyên); 21 khoá dùng lại nguyên văn bản Việt có sẵn, 13 khoá cố ý khác (do tầng không thống nhất hoặc phải đổi dấu câu, ví dụ `1.3` kết bằng chấm thay vì phẩy so với `mn18:2.2`, `5.1`, `9.1`, `10.6`). `6.1`, `6.3`, `7.2` lấy nguyên văn từ `iti91:2.1`, `2.3`, `2.8`; `8.2` từ `dn33:1.10.13`; `9.2` từ `mn11:6.2`.

  **Bất định đã ghi, không giấu.**
  - `2.2`, `3.4` `pabāḷho` là chỗ **nghĩa đen mâu thuẫn văn cảnh**. Trong tầng, `pabāḷha` chỉ xuất hiện với nghĩa "dữ dội" (`dn16:4.20.1`, `ud8.5:6.1`). Hòa thượng Thích Minh Châu (bản nguyên bài) dịch "đã được Ta làm cho vững mạnh", nhưng như vậy trái với `1.2` (`paṇāmetvā`, Đức Thế Tôn vừa trục xuất chúng) và với nỗi lo ở `2.3`–`2.4` (các tỳ-kheo mới không thấy Ngài). Sujato dịch "purged", và bài song song `mn67:6.5` nói `paṇāmito` "đã bị trục xuất" cho cùng sự kiện. Đã chọn **"đã bị Ta/Ngài đẩy đi"**, nhẹ hơn "trục xuất" ở `1.2` để không đồng nhất hai từ Pāli, và không có tiền lệ nào khác trong tầng cho dạng này. Một cách hiểu khác (nặng tay, "áp bức") không thể loại trừ hoàn toàn nhưng không đổi nội dung giáo lý của bài; đây là lý do `ambiguity_integrity` hạ 8,6.
  - `5.2`–`5.3` `sārajjamānarūpā` dịch **"với dáng vẻ e dè"** (Sujato "timidly"); bản Việt nguyên bài ghi "với tâm có tội lỗi", không được Pāli hậu thuẫn. Tầng không có tiền lệ (chỉ có `vesārajja`). `ekadvīhikāya` dịch "từng người một hoặc từng hai người một" (`dn24:1.8.8` đã dịch "từng ngày một" cho cùng gốc). `5.2` Pāli viết `yenāhaṁ` (ngôi thứ nhất, ý định của Đức Thế Tôn) nhưng đang là lời kể; bản Việt đổi sang "đến chỗ Ngài" cho khỏi lẫn giọng kể.
  - `7.3` `chavālāta` giữ thành tố `chava` ("của giàn thiêu xác"); `iti91:2.9` bỏ thành tố này ("khúc củi cháy hai đầu"), `an4.95:2.1` dịch "đuốc mồi".
  - `8.5` `yāvañcidaṁ … alameva … bhāvetuṁ` dịch theo khuôn đã có ở `dn17:2.16.5`, `sn22.96:4.15` ("Chừng ấy … là đủ để …"); khuôn này đo được ở 10 khoá, nên được giữ dù chữ "chừng ấy" trỏ về hơi xa.
  - `9.4`, `9.6` `vajjavā` dịch "có lỗi"; `9.7`–`9.9` `rūpaññeva … upādiyeyyaṁ` giữ "chỉ chấp thủ" cho từng uẩn, động từ `upādiyamāno upādiyeyyaṁ` được gánh một lần ở `9.7` rồi ngầm kéo qua `9.8`–`9.9`, vì Pāli xếp dấu lược `…` trần ở `9.7`, `9.8` y như vậy.
  - `9.3` `sutavā ariyasāvako`: tầng có 20 khoá dịch "bậc Thánh đa văn" (bỏ `sāvaka`) và 7 khoá giữ "bậc Thánh đệ tử"; bài này giữ cả hai ("bậc Thánh đệ tử đa văn") vì Pāli có đủ hai thành tố.
  - `Nigrodhārāma`: tầng có 4 khoá "Cây Đa" và 3 khoá "Cây Bàng" cho cùng tên; đã chọn **Cây Đa** (nigrodha là cây đa; "Banyan" ở Sujato).
  - `6.2`, `6.5`–`6.6` Pāli không có dấu nháy mở (chỉ có `ti` đóng ở `6.6`), nên bản Việt dùng "rằng:" và "nghĩ rằng:" mà không thêm nháy, đúng theo Pāli từng khoá.
  - `9.10`–`9.12` chuỗi duyên khởi: tầng không thống nhất ("do hữu làm duyên nên có sinh" 3 khoá, "do duyên hữu mà có sanh" 2 khoá, v.v.); giữ khuôn "do duyên …" nhất quán với `9.10` ngay trong bài, và dùng "sinh" (142 khoá trong sn22 so với "sanh" 110).

  **Số Pāli.** `tayo` = ba (`8.1`, `8.3`: dục tầm, sân tầm, hại tầm); `dve` = hai (`9.1`: hữu kiến, phi hữu kiến); `catūsu satipaṭṭhānesu` = bốn niệm xứ (`8.4`); `ekadvīhikāya` = "từng người hoặc từng hai người" (`5.2`, `5.3`). Không có số lớn nào cần tính.

  **Dấu lược và nháy.** `…pe…` ở `2.8` và `10.12` thành đúng một `…`; các `…` trần ở `9.7`, `9.8`, `10.9`–`10.11`, `10.14` giữ đúng một dấu mỗi khoá, cân với Pāli từng khoá. Nháy kép/đơn khớp Pāli ở cả 80 khoá (đo lại bằng phép đếm từng khoá, 0 lệch); không có `(…)` trần trong bài này.

