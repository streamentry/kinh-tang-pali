notes: |-
  Dịch từ Pāli root, có đối chiếu tầng Anh đã ghim.

  **Coverage, và chỗ yếu của nó — đã đo.** `sn24.3` có 14 segment Pāli có nội dung. Bản ghim Sujato phủ
  11/14; 3 khoá `3.4`, `3.13`, `3.20` Sujato để trống và được lớp lấp `english-project` của chính dự án
  bù, lớp ấy ở trạng thái `published` nên được tính vào coverage theo `source/layers.yaml` ⇒ 14/14 =
  1,0000. **Nhưng bản lấp ấy cùng do chính agent này chấm**, nên không phải cách đọc Anh độc lập:
  `scripts/validate.ts` sẽ cảnh báo, và vì vậy `triangulation` bị hạ xuống 7,5. Bản Việt này **không
  tuyên bố** là đã đối chiếu ở ba khoá ấy. Nếu người biên tập muốn `triangulation` cao hơn thì phải
  lấp lại `english-project` bằng người khác.

  **Bản song parallel đã có: `sn22.152` mang đúng Pāli của bài này** (chỉ khác số hiệu và cách đánh số
  khối). Dùng làm đối chiếu từng cặp.

  **Pāli trùng nguyên văn: 32 khoá, 1.263 cặp; dùng lại y nguyên văn 29.** Ba khoá lệch, cả ba là cùng
  một Pāli lặp ở `3.4`, `3.13`, `3.19`: `api nu taṁ anupādāya evaṁ diṭṭhi uppajjeyya:`. Đa số kho
  (7 bài) thêm *cái chịu biến hoại* vào câu, nhưng `vipariṇāmadhamma` **không có** trong Pāli của ba khoá
  này — nó chỉ xuất hiện ở `3.6` và `3.15`, sau dấu `…pe…`. Dùng lại nguyên văn đa số sẽ **thêm chữ
  không có nguồn**, nên đã chọn bản trung thành *cái ấy* (2 bài: sn24.10:2.4, sn24.10:2.9) và giữ vế
  *ý kiến như sau vẫn khởi lên* của đa số. Ba khoá trùng nhau thì dùng một cách, như luật của lớp lấp.

  **Dấu lược.** `…pe…` ở `1.4`, `2.3`, `3.3`, `3.5`, `3.12`, `3.14`, `3.18` và các dấu lược rời ở
  `2.4`, `2.5`, `3.8`–`3.10` đều giữ **đúng số lượng** Pāli. Riêng `3.5` và `3.14` chỉ còn `‘so attā …`,
  nên bản Việt là *‘Tôi là tự ngã …*; `3.6` và `3.15` vì Pāli **không** có dấu lược nên bản Việt cũng
  không được thêm — đọc sẽ thấy *Tôi là tự ngã … không thay đổi*, đúng như Pāli đọc.

  **Bất định đã ghi.**
    - `3.5`/`3.6` và `3.14`/`3.15`: phần bị lược không được đánh dấu ở đầu khoá sau, nên hai khoá đọc
      nối nhau hơi gượng. Không sửa được mà không thêm dấu lược trái Pāli.
    - `1.4` kết `…pe….` giữ nguyên một `…`, không mở rộng; bản `sn22.152:1.4` (cùng ý) đã dịch cũng
      vậy.
    - `4.2` dùng lại y nguyên văn của `sn24.10:3.2` và `sn24.2:3.2` (3 bài), kể cả khuôn `”ti.`.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`, và `npm run build` vì bài sẽ `published`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
