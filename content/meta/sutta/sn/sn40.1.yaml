notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `1. Moggallānavagga` → «1. Phẩm Mục-kiền-liên». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.5 (cùng 2.7, 3.4) — công thức sơ thiền «Sơ thiền, một trạng thái hỷ lạc do ly dục sanh, có tầm và có tứ» → «Sơ thiền, có tầm, có tứ, có hỷ lạc do viễn ly sinh» (`savitakkaṁ savicāraṁ vivekajaṁ pītisukhaṁ`): bỏ cụm ‘một trạng thái’ không có trong Pāli, đúng thứ tự Pāli, ‘trú’ → ‘an trú’ (`viharati`), ‘sanh’ → ‘sinh’. Dạng cũ chỉ có 3/102 chỗ toàn tầng, cả ba đều trong bài này. Giữ nguyên khoá 3.1, 3.6, 3.7 vì bản hiện tại đúng Pāli: hô ngữ `āvuso` (‘Này các hiền giả’) được giữ, ‘bậc Đạo Sư’ là cách dịch `satthā` của cả bài, ngôi ‘tôi’ là lời Tôn giả Mahāmoggallāna kể.
