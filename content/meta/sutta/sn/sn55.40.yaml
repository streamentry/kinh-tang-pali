notes: |-
  Dịch trọn 64/64 khoá từ Pāli root, đối chiếu Sujato (tầng Anh đã ghim), bản nguyên bài của Hòa thượng Thích Minh Châu (tra cứu toàn văn, không căn lề theo segment) và các bài cùng công thức trong tầng.
  **Coverage English (đo thật).** Mẫu số 31 segment Pāli có nội dung (≥ 40 ký tự, bỏ khối :0). Sujato phủ 29/31 = 93,5%; hai segment Sujato để trống là 3.3 và 5.3 (đoạn lược công thức Phật đức), đã có lớp lấp của dự án (cùng một người làm nên không tính là cách đọc độc lập). Trên ngưỡng 0,8 nên không cần ghi nhận gap. Tầng Việt hiện hành phân đoạn: không có ở bài này (chỉ Pháp Cú); bản Thích Minh Châu chỉ dùng như tra cứu toàn văn. triangulation 9.2 vì hai đoạn đó không có bản Anh độc lập.
  **Cấu trúc và nghĩa.** Hai vế đối xứng: vế phóng dật (3–4) và vế không phóng dật (5–6), mỗi vế gồm một chi tín (Phật) rồi đoạn lược Pháp–Tăng–giới. Chuỗi nhân quả: không có niềm vui, không có hỷ, không có khinh an, khổ, không định, các pháp không hiện khởi; đảo ngược ở vế sau. Hai khối 3.x/4.x và 5.x/6.x trùng nguyên văn Pāli nhiều câu, bản Việt giống nhau trong từng cặp: 19 nhóm Pāli trùng nội bộ, 0 nhóm bản Việt khác nhau.
  **Điểm cần phán xử — 1.3 và 2.1.** Câu hỏi 1.3 nghe như tự mâu thuẫn: một ariyasāvaka mà hoàn toàn không có bốn sotāpattiyaṅga. Đức Phật không nhận tiền đề: ở 2.1 Ngài nói người như vậy đứng bên ngoài, về phía phàm phu (puthujjana), tức không phải thánh đệ tử theo nghĩa kinh đang nói; rồi 2.2 chuyển sang người thật sự có chi phần nhưng vẫn có thể phóng dật. Bản Việt giữ nguyên câu hỏi theo Pāli (*thì chính vị ấy có phải là người sống phóng dật chăng?*, sveva = so + eva), không điều chỉnh để câu hỏi hợp lý hơn. Sujato và bản nguyên bài Thích Minh Châu cùng cách hiểu. Nháy đơn ở 2.1 phủ cả mệnh đề (kể cả tamahaṁ) nên bản Việt đặt nháy đơn quanh cả vế, kết bằng *Ta nói vậy*; đối chiếu sn48.18:1.6 dùng nháy đơn hẹp hơn vì Pāli ở đó chỉ nháy cụm bāhiro…ṭhito.
  **Ba điểm còn bất định.** (1) `dhammā` ở 3.10/5.10: Sujato *principles*, Thích Minh Châu *các pháp*; giữ *các pháp … hiện khởi* (tier: sn35.97 cùng công thức), không diễn nghĩa (chú giải hiểu là các pháp thuộc minh sát, không đưa vào thân kinh). (2) `saṅkhyaṁ gacchati`: tier có *được tính* 43, *được gọi* 39, *được kể* 26 trên 154 khoá; chọn *được kể là* để giữ sắc thái «được liệt vào». 19 khoá trong tầng (sn35.97 và các bài cùng họ) ghi *bị tín là* chắc là lỗi chính tả của *bị tính là*, không theo. (3) `uttari vāyamati divā pavivekāya, rattiṁ paṭisallānāya`: pavivekāya *viễn ly* (122/139 khoá), paṭisallānāya *độc cư* (95/164, so với *thiền tịnh* 38/164), cả hai đều là dạng cho mục đích; giữ cách đọc *để ban ngày được viễn ly, ban đêm được độc cư* như Sujato (*solitude by day … retreat by night*).
  **Thuật ngữ, kèm đếm.** pāmojja *niềm vui* (50/199 so với *hoan hỷ* 103/199): chọn *niềm vui* để không lẫn với pīti, như sn35.97 và Sujato *joy*. pīti *hỷ* (96/97; *hỷ khoái* chỉ 10, sn35.97). passaddhi *khinh an* (68/99). sukha *lạc*. samādhiyati *định* (93/99). santuṭṭho *hài lòng* (tier có *bằng lòng* 4, *hài lòng* 2, *thỏa mãn* 2; *tri túc* 46 là nghĩa khác, santuṭṭho trong nghĩa tri túc về vật dụng). aveccappasāda *lòng tịnh tín bất động* (thành tựu lòng tịnh tín bất động 20, đầy đủ tín bất động 8). ariyakanta *bậc Thánh yêu mến* (34 so với *yêu thích* 22). sotāpattiyaṅga *chi phần Dự lưu* (33/42). nigrodhārāma *tu viện Cây Đa* (8 khoá cùng Pāli ở an/mn; sn55.21/22/37/39 dùng *Cây Bàng*, 4 khoá, *nigrodha* là cây đa nên theo Cây Đa).
  **Dùng lại nguyên văn tầng.** 28 khoá có Pāli trùng nguyên văn với khoá đã có bản Việt ở nơi khác; 15 khoá dùng lại nguyên văn (0.2, 1.1 = an8.25:1.1 và 6 khoá cùng Pāli, 1.2 = an11.13:4.4, 2.3, 2.5, 3.3/5.3 theo sn55.13/39/43, 3.10/4.10, 4.2/6.2, 4.3/6.3, 6.13, 7.0). 13 khoá khác bản có sẵn, có lý do: 3.9/4.9 và 5.6/5.7/5.9/5.10 (và 6.6/6.7/6.9/6.10) khác sn35.97 vì bản đó dịch pamudita là *hỷ khéo dâng lên* và sukhino là *cảm thọ lạc thọ*, còn chuỗi này cần nhất quán với *niềm vui / hỷ / khinh an / lạc*; 3.2/5.2 khác một khoá có *đầy đủ tín bất động* (theo đa số *thành tựu lòng tịnh tín bất động* của sn55.39/41); 7.1 thêm *đã nói* cho vuttā mà sn55.50:2.1 để rơi.
  **⚠ Tên phẩm 0.2 / 6.14 / 7.1: *Gặp Gác Công Đức* — ghi để người biên tập quyết.** Tôi giữ đúng cách dịch đa số của tầng (4. Phẩm Gặp Gác Công Đức ở sn55.31–39, 9 bài; sn55.50:2.1 dùng *Ba bài Gặp Gác*) để cả phẩm đọc như nhau, theo quy ước gộp tên phẩm của đợt trước. Nhưng *Gặp Gác* không có căn cứ trong Pāli: puññābhisanda là *phước tràn đầy / dòng phước chảy tràn* (Sujato *Overflowing Merit*), cùng tầng sn55.31 đã dịch tên bài là *Dòng Phước Chảy Tràn*. Đề nghị đổi cả phẩm 4 và phẩm 5 (*Sagāthakapuññābhisandavagga*, hiện *Người Hiện Kinh Gặp Gác Công Đức*) cùng lúc, không đổi lẻ bài này.
  **Tên bài.** Nandiyasakkasutta → *Kinh Nandiya Người Sakya* (sakka là người Sakya; Sujato *Nandiya the Sakyan*); 0 tiền lệ cho tên bài, đặt theo an11.13 (*Nandiya người Sakya*, 22 khoá *người Sakya* trên toàn tầng).
  **Số Pāli.** cattāri sotāpattiyaṅgāni = *bốn chi phần Dự lưu* (1.3, 2.1); Dasamaṁ = *Thứ mười* (bài thứ 10 của phẩm, sn55.31–40); catuttho = *thứ tư*. Tassuddānaṁ: abhisandā tayo = ba bài (sn55.31–33), duve devapadāni = hai bài (sn55.34–35), sabhāgata = sn55.36, mahānāmo = sn55.37, vassaṁ = sn55.38, kāḷī = sn55.39 (viết tắt của Kāḷigodhā, bản Việt giữ *Kāḷī* đúng Pāli, không thêm), nandiyā = sn55.40; 3+2+1+1+1+1+1 = 10, khớp.
  **Năm phép tự kiểm.** (1) tập khoá Việt = tập khoá Pāli: 64 = 64. (2) nháy đơn và nháy kép khớp Pāli từng khoá: 0 lệch / 64. (3) 19 nhóm Pāli trùng nguyên văn trong bài, 0 nhóm bản Việt khác. (4) dấu lược: 8 khoá Pāli có …pe… đều giữ đúng một …, 0 dấu … thừa. (5) số Pāli: xem mục trên. NFC, khoá rỗng, khoảng trắng thừa: 0. Pāli lọt sang Việt: chỉ tên riêng và địa danh.
