notes: |-
  Coordinator (gộp thuật ngữ tên bộ, 2026-10-04): khối `:0.1` đổi "Tương Ưng Bộ" → "Saṁyutta Nikāya". Đếm lại trên toàn tầng: 1.211 tệp giữ PĀLI / 326 tệp dịch — 78,8% giữ PĀLI. Hai agent cùng đếm gần giống nhau rồi kết luận ngược nhau (1.187 vs 315 và 1.074 vs 316), nên đã đếm lại từ đầu thay vì theo lời báo. Đây là tên bộ ở khối tiêu đề, không đổi nghĩa segment nào. Phạm vi: cả tầng sn, gồm cả tệp đã merge trước đợt này.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá sn8.5:4.1 — «Ngài Vaṅgīsa … phủ y xuống một bên … thưa» → «Tôn giả Vaṅgīsa … phủ y sang một bên … thưa với Đức Phật» (ekaṁsaṁ uttarāsaṅgaṁ karitvā là «đắp y một bên vai», cách chiếm đa số là «sang một bên», 5/6 khoá Pāli trùng; «Tôn giả» là danh xưng chuẩn của kho); cùng chữ «Ngài Vaṅgīsa» ở khoá sn8.5:4.4 đổi thành «Tôn giả Vaṅgīsa» để nhất quán trong bài. Ghi nhận ngoài phạm vi: sn8.5:4.2 dùng «Bậc Giác Ngộ» cho bhagavā và «đấng Thế Tôn» cho sugata, sn8.5:4.3 để Đức Phật gọi Tôn giả Vaṅgīsa là «Ngài»; chưa sửa trong lượt này.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 4.2 — «Bậc Giác Ngộ» (cho `bhagavā`) và «đấng Thế Tôn» (cho `sugatā`) → «bạch Thế Tôn» và «bạch Thiện Thệ» (5/9 khoá Pāli trùng: sn8.9:2.2, sn8.10:2.2, sn8.11:2.2), sửa đúng lỗi đã ghi ở mục trên; 4.4 — «đã khen ngợi Đức Phật … bằng bài kệ thích hợp» → «đã tán thán Đức Phật … bằng những bài kệ thích hợp» (`abhitthavi`, `gāthāhi` số nhiều; như sn8.7:5.4 và sn8.8:2.4). Khoá 4.3 vẫn gọi Tôn giả Vaṅgīsa là «Ngài», giữ nguyên vì không thuộc danh sách lượt này.
