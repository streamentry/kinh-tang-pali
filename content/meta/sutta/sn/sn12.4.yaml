notes: |-
  Đối chiếu: Pāli root (bilara pin) + English Sujato (phủ đủ) + tiền lệ cùng công thức Duyên khởi trong kho (sn12.10, sn12.3, dn14). Tầng Việt hiện hành (HT. Thích Minh Châu) chỉ có Pháp Cú, không có cho SN nên không được dùng; tầng english-project không có tệp cho bài này.
  Coverage English: 98/98 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0) được Sujato phủ = 1,00, vượt ngưỡng 0,80; không có đoạn nào do lớp lấp dự án cung cấp, nên không có chuyện bài tự đối chiếu với bản English của chính mình. Khoá Pāli trống ở phía Sujato duy nhất là 25.5 "Catutthaṁ." (ngắn hơn ngưỡng, không tính vào mẫu số).
  Số khoá: 106/106, đúng segment ID, đúng thứ tự Pāli, không khoá ngoài phạm vi. Dấu lược: 1.1, 13.2, 25.2 có …pe… -> một "…"; Pāli không có "…" thì Việt không có. Nháy đơn ‘ ’ và nháy kép “ ” khớp Pāli từng khoá (0/106 lệch): “ mở ở 1.2 và đóng ở 25.4 đúng như Pāli, 25.3 kết bằng "hotīti" không có dấu nháy nên Việt cũng không có.
  Số trong bài: saḷāyatana -> "sáu xứ" (đúng một mẫu số 6, không phép tính nào khác); 26.1 Sattannampi buddhānaṁ -> "Bảy vị Phật" (satta = 7, chủ cách số nhiều sở hữu, đúng với bảy vị Phật của Buddhavagga; khớp tổng tụng 8.2–8.4 của sn12.10 gồm Vipassī, Sikhī, Vessabhū, Kakusandha, Koṇāgamana, Kassapa, Gotama).
  Cặp Pāli trùng nguyên văn trong kho đã dò (sn/an/mn/dn/kn, trừ chính bài): 95/106 khoá có ít nhất một khoá Pāli trùng, tổng 1.306 cặp; trong đó 180 cặp có bản Việt khác bản của tôi, và đều thuộc bốn loại đã xét: (a) hình dạng nháy — các cặp dn14 viết “ ” còn Pāli từng khoá là ‘ ’, tôi giữ nháy theo Pāli từng khoá như sn12.10 (38 khoá); (b) "danh-sắc" so với "danh sắc" (dn14 so với sn12: 2 so với 37, theo sn12); (c) 1.1, 13.2, 25.2, 25.5: các khoá ngắn có nhiều dạng trong tầng, chọn dạng gần nhất cùng Tương Ưng (xem dưới); (d) 13.3 viết "tập khởi" không có "sự" theo sn12.3:2.4 và sn12.10:4.3 (6 cặp) thay cho dạng "sự tập khởi" (1 cặp). 0 cặp khác nghĩa. Nhóm trùng trong chính bài: 2 nhóm — 2.1…12.1 cùng 14.1…24.1 (22 khoá) = "Rồi, này các tỳ-kheo, Bồ-tát Vipassī nghĩ rằng:" theo dn14:2.18.4 (22/22 cặp ngoài bài cùng một dạng), và 2.3…12.3 cùng 14.3…24.3 (20 khoá) = "Rồi, này các tỳ-kheo, nhờ tác ý như lý, sự thấu đạt bằng trí tuệ hiện khởi nơi Bồ-tát Vipassī:" (20/20) — hai nhóm đều dịch giống hệt nhau, 0 cặp lệch. 1.3, 1.4, 1.5 theo sn12.10:1.2–1.4 (dn14:2.18.2 gộp ba câu thành một khoá nên không dùng); 2.2, 2.4, 12.4, 14.2, 14.4, 24.4, 13.1, 25.1 theo sn12.10; các câu hỏi/đáp của vòng 3–11 và 15–23 theo dn14 (mỗi khoá 1 cặp, chỉ khác nháy và danh-sắc). Không có cặp trùng tầng với 11.4, 12.2, 23.4, 24.2, 25.3, 1.2, 13.4, 25.4 — dịch mới theo cùng công thức với khoá anh em.
  Tiền lệ tiêu đề và thuật ngữ (đếm trên tầng vi): :0.1 "Saṁyutta Nikāya …" giữ nguyên; :0.2 "Buddhavagga" -> "1. Phẩm Đạo Sư" (8/9 khoá Pāli trùng); :0.3 "…sutta" của tên Phật giữ Pāli: "Kinh Vipassī". 1.1 "Sāvatthiyaṁ viharati …pe…": tầng sn có 4 khoá trùng nguyên văn, 3 "Đang sống tại Sāvatthī …" (sn15) và 1 "Trú ở Sāvatthī …" (sn12.3); chọn dạng cùng Tương Ưng (sn12) là "Trú ở Sāvatthī …". "danh sắc" (sn12: 37) hơn "danh-sắc" (sn12: 2; toàn tầng 97 so với 87), theo sn12.10. Kết thúc chu kỳ: 13.3 "tập khởi" theo sn12.3 và sn12.10 (6 khoá); 25.3 "đoạn diệt" (không có cặp trùng; "đoạn diệt của toàn bộ khối khổ" 7 khoá trong sn12.41 và sn12.44 so với "đoạn tận" 3 khoá của sn12.3), và 25.4 "Đoạn diệt, đoạn diệt" theo dn14:2.21.5 để nirodha nhất quán trong toàn bài (sn12.10:7.4 dùng "Đoạn tận"; khác nhau về chữ, cùng nghĩa). 25.5 "Thứ tư." (171 khoá so với "Thứ bốn." 90, chọn dạng đa số). 26.1: "cần được giảng rộng" theo 8 khoá tiền lệ ở sn48.83-114, ghi "Bảy vị Phật … như vậy" cho Sattannampi buddhānaṁ evaṁ.
  Bất định: (1) 1.2 Pāli là thuộc cách tuyệt đối "vipassissa … bhagavato … bodhisattasseva sato etadahosi"; tôi chuyển thành câu có chủ ngữ Đức Thế Tôn Vipassī như Sujato và an5.196:1.1, không thêm "đang hướng đến giác ngộ" của Sujato vì Pāli chỉ có "bodhisattasseva sato". (2) 1.2 đặt "Đức Thế Tôn" cho bhagavato, nhất quán an5.196; sn12.5–12.9 dùng cách khác cho cùng cụm, báo cho người biên tập, không đụng tệp khác. (3) Vì Pāli mở “ ở 1.2 và chỉ đóng ở 25.4 trong khi bên trong dùng ‘ ’, tôi giữ đúng cấu trúc nháy của Pāli từng khoá, không đóng sớm. (4) Không có bản Việt hiện hành của SN nên thuật ngữ truyền thống chỉ được đối chiếu qua kho dự án.
  Kiểm tra máy: NFC, không khoá rỗng, không Pāli lọt sang Việt ngoài tên riêng, không khoảng trắng thừa; in cặp Pāli↔Việt cả 106 khoá để đọc đối kháng, không thấy khối nào mang nội dung của khối khác. Bốn lệnh còn lại chưa chạy trong lát này: npm run validate, npm test, npm run check, npm run build; vì vậy technical_integrity đặt 9.6.
