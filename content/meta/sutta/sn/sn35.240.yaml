notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở commit 11c9d708. Không có bản Việt tham khảo: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên tầng `vietnamese-current` không phủ bài này và triangulation chỉ dựa trên Pāli + Sujato.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  Tra tiền lệ: 3.1–3.4 dùng lại nguyên văn sn1.17 (bài cùng bốn câu kệ, Pāli trùng tuyệt đối). 2.8–2.11 (tai, mũi, lưỡi, thân) dùng lại an4.14:1.7–1.10 và an3.16:2.4–2.7. 2.7 và 2.13 dùng lại an4.14:1.6 và an3.16:2.3 cho cả câu về chế ngự căn.
  0.2 `Āsīvisavagga` dùng nguyên văn sn35.242: 19. Phẩm Rắn Độc.
  0 tiền lệ cho `kummo` và `kacchapo` (cùng nghĩa là rùa, Pāli dùng thay nhau): dịch cả hai là con rùa; `sārāgapvisī`/`sārāthiko` cũng vậy. Không đặt tên riêng mới khi 0 tiền lệ và từ thường dùng.
  `māro pāpimā` dịch là Ác Ma theo đa số đếm được (235 lần, không có Ma-di trong tầng). `saṁvara` dịch là chế ngự vì an4.14 và an3.16 dùng cụm này cho đúng công thức; `rakkhatha` thì vẫn giữ là hộ trì vì hai tầng cùng câu dùng cả hai động từ.
  `indriyesu guttadvārā` dịch là sống bảo hộ các căn theo an5.114:3.1 (11 lần trong tầng), không dùng hộ trì các căn của an3.16:1.3 để tránh lặp chữ với chính câu này.
  Dấu lược: 2.2, 2.3, 2.8, 2.9, 2.10, 2.11 mỗi khoá một …, khớp Pāli. 2.3 chỉ dịch con lưỡi rồi … vì …pe… của khoá này là con thân; 2.4 là con ý. Không mở rộng chỗ lược để thêm tai, mũi hay thân, vì đó sẽ là chữ không nguồn nào chứng thực.
  Bất định đã phân xử: 2.6 và 2.12 là mệnh lệnh phủ định (mā … ahuvattha, đừng trở thành người nắm giữ) nên dịch với động từ trở thành, không dịch như an4.14 là mệnh đề không nơi khác (na nimittaggāhī hoti), vì hai dạng khác nhau về nghĩa.
  Coverage tầng Anh trên Pāli có nội dung (16 segment) là 16/16 = 100%. Không cần ghi nhận gap.
