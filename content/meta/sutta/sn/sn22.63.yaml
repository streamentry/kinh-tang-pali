  Công thức trục lặp 10 khoá dịch theo đúng tiền lệ của hai bài song song `sn22.64` (Maññamānasutta) và `sn22.65` (Abhinandamānasutta): `baddho mārassa` → bị trói buộc bởi Ác Ma (10 khoá), `mutto pāpimato` → thoát khỏi điều ác (10 khoá), `eko vūpakaṭṭho appamatto ātāpī pahitatto` → một mình, viễn ly, không buông lung, nhiệt tâm, tinh cần (khớp nguyên văn `sn47.46:4.1` vốn dùng tinh cần chứ không phải tinh tần).
  Pāli trùng nguyên văn trong CHÍNH bài: `anupādiyamāno mutto pāpimato.` xuất hiện ở 2.3, 2.5, 2.9, 3.4, 3.9 — mỗi khoá nêu đúng tham chiếu của khoá trước (sắc / cảm thọ / thức), y hệt cách `sn22.64` làm. 2.3 và 3.4 dịch giống nhau vì cùng tham chiếu sắc.
  LỆCH CÓ CHỦ ĐÍCH, ghi rõ: `nāparaṁ itthattāyā` ở 4.3 dịch không còn trở lại trạng thái hiện hữu này nữa (48 khoá trên đĩa) chứ không dùng không còn gì là tự thân nữa (86 khoá, chủ yếu `sn48.45–48.48`) — Pāli `itthattāyā` là sự hiện hữu, không phải tự thân; cách 86 khoá thêm chữ tự thân không có trong Pāli.
  BẤT ĐỊNH: tên bài `Upādiyamānasutta` 0 tiền lệ. Chọn Kinh Chấp Thủ theo đúng khuôn của hai bài kề trong cùng phẩm (`Maññamānasutta` → Kinh Tưởng Tượng, `Abhinandamānasutta` → Kinh Hoan Nghỉnh) và theo nghĩa `upādiyamāna` đã dùng ở thân kinh.
  BẤT ĐỊNH: `sugatā` trong 1.7 bị bỏ, dịch thành đã hiểu rồi, đã hiểu rồi — theo tiền lệ `sn22.64:1.6` và `sn22.65:1.6` đã bỏ từ này. Người biên tập có thể muốn khôi phục Cồng Đàn ở cả hai bài cho khớp.
  Dấu nháy kép đặt đúng nhịp Pāli: 1.5 mở thì 1.6 khép, 2.2 mở thì 2.10 khép, 3.1 mở thì 3.10 khép; tổng cân trên toàn bài. Năm dấu lược ở 2.6, 2.7, 3.5, 3.6, 3.7 giữ đúng MỘT `…`.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy; technical_integrity 9.6 vì lát này không tự chạy bốn lệnh đó. Đã tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, và mô phỏng đúng `validateSegmentMap` của `scripts/validate.ts` (tiền tố khoá, orphan, requireComplete, non-Latin) — 316/316 khoá sạch.
