notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có 26 chương Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Hai tầng còn lại là Pāli root (authority) và bản Anh Bhikkhu Sujato đã ghim.
  - >-
    **Coverage tầng Anh 0,950** (20 Pāli có nội dung, 19 có chữ; trống `sn54.1:5.1`, mà `mn62:29.1` và `mn118:21.1` — cùng Pāli — đã có bản Việt trong kho) — trên ngưỡng 0,80.
  - >-
    **Công thức 16 mục `assasissāmī / passasissāmī` dùng lại nguyên văn, theo `mn62`.** `sn54.1` và `mn62:26.3`–`mn62:29.4` có **cùng Pāli từng mục** `assasissāmī` / `passasissāmī`, nên lấy nguyên văn `mn62` (bản `mn118` dùng `sabbakāyapaṭisaṁvedī`/`kāyasamādhā` nên chữ khác): *cảm nhận toàn thân* (15) · *làm lắng dịu hoạt động của thân* (12) · *cảm nhận hỷ* (6) · *cảm nhận lạc* (79) · *cảm nhận hoạt động của tâm* · *làm lắng dịu hoạt động của tâm* · *cảm nhận tâm* (12) · *làm tâm hoan hỷ* · *làm tâm định tĩnh* (6) · *giải thoát tâm* (157) · *quán vô thường* (38) · *quán ly tham* (10) · *quán diệt* · *quán buông bỏ*.
  - >-
    **Thuật ngữ đã có tiền lệ nhưng khác kho — báo trước để người điều phối gộp.** Cùng Pāli `paṭinissaggānupassī` đang được dịch **sáu** cách trong kho: *quán xả bỏ* (`mn62:29.4`, 6), *quán buông bỏ* (`mn118:21.4` + `mn119`, 6), *quán sự phân ly* (`sn54.4:1.5`, `sn54.7:5.3`, 4), *Quán từ bỏ* (`sn54.5:1.5`, 4), *Quán sát sự xả ly* (`sn54.6:3.5`, 2). Bài này chọn ***quán buông bỏ*** vì hoà theo `mn118`–`mn119` và `sn54.20:1.7`; `nirodhānupassī` chọn *quán diệt* theo `mn118:21.3` (thay vì *quán đoạn diệt* của `mn62:29.3`, 6).
  - >-
    **Dùng lại.** `:1.1` *Tại Sāvatthī.* (391) · `:1.7` (2) · `:1.8` *Vị ấy chánh niệm thở vào, chánh niệm thở ra.* (1) · `:2.1 :2.2` theo `mn62:26.1/26.2` (*dài* / *ngắn*) · `:6.1` theo nguyên văn `mn118:22.1` · `:6.2` *Thứ nhất.* (258) · `:1.4` *Một pháp ấy là gì?* (3) · `:1.6` (1).
  - >-
    **0 tiền lệ, đặt mới.** `Ānāpānassati` → *Niệm hơi thở* (75, chọn đa số thay vì *chánh niệm hơi thở* 24) — cùng lựa chọn với `mn118:22.1`.
  - >-
    **Bất định đã ghi.** `:1.2` Pāli là `Tatra kho …pe… etadavoca:` (một `…pe…`). Tiền lệ ở kho viết **hai** `…` (*Tại đó, … cho đến … Đức Phật nói như sau:*), tức lệch dấu lược. Bài này giữ **một** `…`: *Tại đó, … Đức Phật nói như sau:*.
  - >-
    **Ngoặc kép.** `:1.3` mở và `:6.1` đóng — cân trên cả bài.
  - >-
    **Khác kho, có chủ ý — số đếm.** `Saṁyutta Nikāya` → *Tương Ưng Bộ* (xem `sn35.105`).
  - >-
    `technical_integrity` 9.6 vì bốn lệnh cổng **do coordinator chạy**, lát này đã tự kiểm mọi thứ còn lại bằng `_hvi.kiểm` (NFC, dấu lược khớp từng khoá, nháy kép cân trên cả bài, không Pāli lọt): `npm run validate` · `npm test` · `npm run check` · `npm run build`.
