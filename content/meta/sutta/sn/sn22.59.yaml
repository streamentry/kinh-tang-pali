notes: |-
  Dịch từ Pāli root commit 11c9d708.
  Đối chiếu bản dịch tiếng Anh của Bhikkhu Sujato đã ghim.
  Bản dịch của Sujato để trống các đoạn lặp thọ, tưởng, hành ở câu hỏi vô thường và đoạn quán 11 khía cạnh, nên coverage Anh trên Pāli có nội dung là 26/34 = 76.5% (< 80%). Bản Việt dịch đầy đủ trực tiếp từ Pāli root.
  59/59 khoá khớp Pāli root tuyệt đối.
  Nháy đơn và kép khớp 1:1 với Pāli root.
  Dấu lược … cân bằng chính xác với Pāli.
  Công thức tam pháp ấn và vô ngã 'netaṁ mama, nesohamasmi, na meso attā'ti dịch chuẩn mực.
