notes: |-
  Dịch từ Pāli root commit 11c9d708.
  Đối chiếu bản dịch tiếng Anh của Bhikkhu Sujato đã ghim.
  Bản dịch của Sujato để trống các đoạn lặp thọ, tưởng, hành ở câu hỏi vô thường và đoạn quán 11 khía cạnh, nên coverage Anh trên Pāli có nội dung là 26/34 = 76.5% (< 80%). Bản Việt dịch đầy đủ trực tiếp từ Pāli root.
  59/59 khoá khớp Pāli root tuyệt đối.
  Nháy đơn và kép khớp 1:1 với Pāli root.
  Dấu lược … cân bằng chính xác với Pāli.
  Công thức tam pháp ấn và vô ngã 'netaṁ mama, nesohamasmi, na meso attā'ti dịch chuẩn mực.

  Giải quyết draft 2026-10-12: đọc đối kháng toàn bài 59/59 khoá với Pāli root và bản Anh Sujato đã ghim. Sửa 5 khoá: 0.2 'Phẩm Trói Buộc' → 'Phẩm Dính Mắc' (tiền lệ tầng sn22: 9/10 bài cùng phẩm Upayavagga dùng 'Dính Mắc', 1/10 là bài này); 4.2 'hành là vô ngã' → 'Các hành là vô ngã' (saṅkhārā số nhiều); 4.3 'nếu hành này là ngã, thì các hành đã' → 'nếu các hành này là ngã, thì các hành này đã' (hidaṁ saṅkhārā abhavissaṁsu số nhiều, lệch số và lệch vế so với 2.2/3.2/5.2); 11.1 'bậc Thánh đệ tử có nghe nhiều' → 'bậc Thánh đệ tử đa văn' (sutavā ariyasāvako; giữ cả hai đơn vị nghĩa, dùng thuật ngữ 'đa văn' đã chiếm đa số trong tầng); 11.2 'khởi lên hiểu biết' → 'có trí biết' (ñāṇaṁ hoti, 'hoti' không phải 'khởi lên'; tầng dùng 'có trí biết/có sự biết rõ'). Các khoá khác giữ nguyên; công thức 'nāparaṁ itthattāyā' giữ 'không còn trở lui trạng thái này nữa' (có tiền lệ, không sai nghĩa; tầng còn nhiều cách khác như 'không còn gì là tự thân nữa').
  Blocker lowEnglishCoverage (loại B, độ phủ Sujato 26/34 = 76.5% trên Pāli có nội dung) đã gỡ: Sujato để trống đúng 8 khoá có nội dung là 3.2, 3.3, 3.4, 3.5 (thọ) và 4.3, 4.4, 4.5, 4.6 (hành). Đây là các khuôn lặp y hệt 2.2–2.5 và 5.2–5.5 (sắc, thức) mà Sujato đã dịch đủ, chỉ thay danh từ; đã đọc kỹ từ Pāli từng khoá, bản Việt tự đứng vững và song song đúng với khuôn sắc/thức. Không còn blocker nào khác. Triangulation đặt 8.0 vì 8/34 đoạn có nội dung không có bản Anh để đối chiếu và tầng Việt hiện hành không có (chỉ có Pháp Cú tại snapshot đã ghim).
  Dấu lược … ở 4.1, 6.9–6.11, 8.1, 9.1, 9.2 khớp Pāli …pe… và '…' trần; nháy đơn và kép khớp từng khoá. Không có số đếm Pāli trong bài. technical_integrity 9.6; chưa chạy bốn lệnh npm run validate · npm test · npm run check · npm run build trong lượt này.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 6.6, 6.16 — «Cái gì vô thường, khổ, chịu sự biến hoại, có hợp lý chăng khi quán xét điều ấy:» → «Cái gì vô thường, khổ, có tính biến đổi, có nên xem như vầy:» (`yaṁ panāniccaṁ dukkhaṁ vipariṇāmadhammaṁ, kallaṁ nu taṁ samanupassituṁ`; 39/74 khoá cùng Pāli; `-dhamma` là «có tính …» như `samudayadhamma`, và `vipariṇāma` là biến đổi chứ không nhất thiết «biến hoại»); giữ nguyên khoá 11.2 vì «nhàm chán» khớp 11.1 của chính bài (bản đa số «chán nản» sẽ làm `nibbindati` lệch trong bài), cả hai đều đúng Pāli.
