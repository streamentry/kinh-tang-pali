notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở commit 11c9d708. Không có bản Việt tham khảo: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên tầng `vietnamese-current` không phủ bài này và triangulation chỉ dựa trên Pāli + Sujato.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  0.2 `Pabbatavagga` dùng nguyên văn sn46.1, sn46.5, sn46.7, sn46.10: 1. Phẩm Núi. 0.3 `Vatthasutta` dùng lại nguyên văn mn7:0.2 (Kinh Ví Dụ Tấm Vải).
  1.1 dùng lại nguyên văn sn28.1:1.1. 1.2, 1.4, 1.5 dùng lại an10.52 và an11.21. 2.3 (danh sách bảy giác chi) dùng lại nguyên văn an10.102:1.3. 3.1 đến 3.4 dùng lại mn32:9.10–9.13 (hòm y phục nhiều màu, mặc bộ nào thì mặc bộ ấy buổi sáng, buổi trưa, buổi chiều).
  0 tiền lệ cho `appamāṇo` và `susamāraddho`: dịch vô lượng và đã được tu tập khéo. `susamāraddho` là ý giác chi đã được điều phục khéo (well-levened), không phải rộng lớn; vì vậy không dùng vô lượng cho cả hai chữ.
  `cavati` dùng là lắng xuống (giác chi lắng xuống thì vẫn còn, cho đến khi lắng hẳn). Lượt review đối kháng bắt được bản nháp đầu dịch là đi xuống, đã sửa cả bốn khoá 2.9, 2.11, 3.9, 3.11 cho nhất quán.
  `pubbaṇhasamayaṁ`, `majjhanhikaṁ samayaṁ`, `sāyanhasamayaṁ` dịch là buổi sáng, buổi trưa, buổi chiều theo mn32.
  Dấu lược: 2.9 và 3.9 mỗi khoá một …, khớp Pāli. 2.9 và 3.9 vốn là đoạn ngắn dưới ngưỡng 40 ký tự của Pāli nhưng vẫn nằm trong all và được dịch đầy đủ.
  Bất định đã phân xử: 2.2 `Katame satta?` dịch là Bảy giác chi nào (theo an10.102) thay vì Bảy nào, vì câu hỏi nằm ngay sau danh sách bảy giác chi và câu trả lời kế tiếp là danh sách đó.
  Coverage tầng Anh trên Pāli có nội dung (22 segment) là 22/22 = 100%. Không cần ghi nhận gap.
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 3, sau chấm lại độc lập 2026-10-17): sửa 2.1, 2.5, 2.8, 2.10, 3.1, 3.5, 3.8, 3.10 (`āvuso` «này hiền giả» → «này các hiền giả»: người nghe là nhiều tỳ-kheo, 1.3 `āvuso bhikkhavo`, Sujato «Reverends»; như ps2.3:40.1), 2.4 (thêm hô ngữ `āvuso` bị sót: «Này các hiền giả, đây là bảy giác chi ấy.»), 1.4 («Bạch đại hiền giả» → «Thưa hiền giả»: Pāli chỉ có `āvuso`, «đại» là thêm chữ; Sujato «Reverend»; như ps2.3:39.4 và đa số kho); giữ `cavati` «lắng xuống» (DPD cavati 1 «falls away», Sujato «subsides»; ps2.3:40.11 cùng cách, bất định chung, không đổi riêng bài này).
