  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho bài này. Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho; `budsas.org` chỉ là tra cứu toàn văn và không có căn cứ alignment ở mức segment.

  DẤU LƯỢC §10. Không khoá nào trong lát này được MỞ RỘNG chỗ Pāli lược. Bản Anh Sujato đã ghim mở rộng nhiều chỗ `…pe…` (ví dụ `sn45.24:2.2` và `sn55.31:4.1` liệt kê đủ tám ngành Bát Chánh Đạo, `sn46.14:3.3` liệt kê đủ bảy giác chi) — tôi KHÔNG theo, vì mở rộng là thêm chữ không đánh dấu. Cũng không khoá nào bị nén thêm: mọi `…` trong bản Việt đều ăn đúng một dấu lược ứng với một `…pe…` của Pāli, đếm từng khoá.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC. `Tasmātiha, bhikkhave, ‘idaṁ dukkhan’ti
    yogo karaṇīyo …pe… ‘ayaṁ dukkhanirodhagāminī paṭipadā’ti yogo karaṇīyo”ti.` trùng nguyên văn
    với `sn56.10:3.1` và `sn56.19:2.1` → đã dùng lại NGUYÊN VĂN đã có: *Vì vậy, này các tỳ-kheo,
    ‘đây là khổ’ thì cần gắng sức … ‘đây là con đường đưa đến diệt tận của khổ’ thì cần gắng
    sức”ti.* `Dukkhassa ariyasaccassa …pe… dukkhanirodhagāminiyā paṭipadāya ariyasaccassa`
    trùng `sn56.34:2.3` và `sn56.35:2.9`; hai bản chọn hai cách nên tôi theo `sn56.34` (*Diệu
    đế của bậc Thánh về khổ … diệu đế của bậc Thánh về con đường đưa đến việc diệt tận khổ*) vì
    trong sn56 chữ *diệu đế* đứng **33 so với 26** *thánh đế*. Tên phẩm: `Paṭhamasūriyasutta`
    → *Kinh Mặt Trời (Một)* (`sn56.37`) nên `Dutiyasūriyasutta` → *Kinh Mặt Trời (Hai)*;
    `Sīsapāvanavagga` → *4. Phẩm Rừng Sīsapā* (đa số 3 so với 2 và 1). 0 tiền lệ, đặt mới:
    `catunnaṁ ariyasaccānaṁ ācikkhaṇā hoti desanā paññāpanā paṭṭhapanā vivaraṇā
    vibhajanā uttānīkammaṁ` → *chỉ dạy, thuyết trình, thiết lập, khai mở, phân biệt, trình bày
    rõ ràng* — lấy **đúng bộ từ** của `mn141` (6 bài đã có), chia đúng sáu Pāli từ thành sáu
    vế; `yāvakīvañca` → *chừng nào* theo `sn48.52` và `ud6.10`; `andhakāratimisā` → *tối đen,
    đen thẫm* theo `dn14:1.17.5` (các bản khác dùng *tối tăm u ám*, *u tối, mịt mù*, *đêm tối
    mịt* — cùng một ý).
  REVIEW ĐỐI KHÁNG. Tôi in lại Pāli ↔ Việt từng cặp và đọc lại với mục tiêu tìm lỗi.
