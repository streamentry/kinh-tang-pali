  **(1)** `1.2`/`2.5` là Pāli trùng nguyên văn; bản nháp viết khác nhau, đã thống
      nhất. **(2)** `2.2`/`3.2` cũng vậy. **(3)** `1.3` bản nháp đổi *không được nhận biệt* thành
