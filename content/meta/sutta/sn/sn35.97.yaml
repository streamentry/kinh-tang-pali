notes: |-
  ĐỌC LẠI TỪNG CÂU TỪ PĀLI, KHÔNG TIN BẢN DỊCH CÓ SẴN. Bản 6/6 tệp dịch do phiên trước
  ghi xong nhưng không có metadata; tôi đã đối chiếu 47/47 khoá với Pāli root đã ghim và sửa
  6 khoá. Coverage English đo bằng đúng công thức `src/lib/canon/reference.ts` (Pāli ≥ 40
  ký tự sau nén khoảng trắng, bỏ khối tham chiếu `:0`): 17/17 khoá có nội dung đều có chữ
  Anh Sujato = **100%**, không cần tầng lấp `english-project`. Ngưỡng `source/layers.yaml` là
  0.8 nên không phải ghi `content/meta/reference-gaps.yaml`.

  SỬA 6 KHOÁ — cả sáu là lỗi thật, không phải sở thích văn phong:
  1.4. `passaddhi` ở 1.7, 1.8, 1.18, 1.19 dịch "trấn an". Đếm được: toàn tầng Việt có
  "khinh an" 122 lần và "trấn an" 7 lần, trong đó 4 lần "trấn an" chính là 4 khoá này, còn
  3 lần kia ở `mn45` là `upasāmi` ("hãy an ủi") — tức KHÔNG còn lần nào dùng "trấn an" cho
  `passaddhi`. Tiền lệ trực tiếp cho đúng cụm `passaddhiyā asati/sati`: `an10.3`, `an10.5`,
  `an11.3`, `an11.4` đều dịch "không có khinh an". Đã sửa cả bốn sang "khinh an".
  2.5. 2.10 và 2.12 BỎ SÓT vâng dẫp `bhikkhave` (Pāli có `, bhikkhave,` ở cả hai khoá).
  Cùng công thức `Xindriyaṁ saṁvutassa, bhikkhave, viharato …` đã được dịch "Này các
  tỳ-kheo, …" ở 1.4, 1.12, 1.15 và 2.2 — 2.10 và 2.12 là hai chỗ rơi sót, tức một công thức
  Pāli được dịch theo hai kiểu trong cùng một bài. Đã bổ sung.

  GIỮ NGUYÊN CÓ CHỦ ĐÍCH (đều có tiền lệ đã công bố, sửa ở đây sẽ thành lùi):
  Chuỗi `Pamuditassa pīti jāyati` / `Pītimanassa kāyo passambhati` / `Passaddhakāyo sukhaṁ
  viharati` / `Sukhino cittaṁ samādhiyati` ở 2.4–2.7 và 2.14–2.17 dùng y nguyên cách dịch
  đã có ở `an5.26` (mỗi vế 5 lần): "Với người hỷ khéo dâng lên, hỷ khoái được sanh khởi" /
  "Với người có hỷ khoái, thân được khinh an" / "Với người thân khinh an, người ấy sống an
  lành" / "Với người cảm thọ lạc thọ, tâm được an định". Cụm "cảm thọ lạc thọ" lặp từ và
  "hỷ khéo dâng lên" khó đọc, nhưng đó CHÍNH LÀ bản dịch đã publish của `an5.26`; cùng
  công thức Pāli ấy ở `an3.95` lại dùng khung khác ("Khi hoan hỷ, hỷ sanh khởi; …"), và
  `an11.12` (cùng lát này) theo `an3.95`. Tức kho đang có HAI khung cho MỘT công thức Pāli.
  Tôi để nguyên theo tiền lệ của từng bài và không tự tạo cách thứ N+1. **Người biên tập
  nên chọn một khung cho `passaddhi`-`passambhati`-`sukhino` rồi áp lại cho `an3.95`,
  `an5.26`, `an11.12`, `sn35.97`** — đây là việc gộp chéo ngoài lát này.

  1.12 chỉ có `jivhindriyaṁ` (căn lưỡi); bản Anh đã ghim ở 1.12 gộp cả tai/mũi/mắt/tay
  chung một câu. Theo luật 10.1 (Pāli lược chỗ nào thì giữ một dấu lược, không mở rộng), tôi
  dịch đúng căn lưỡi, không thêm ba căn kia. 1.13 và 1.14 lược chuỗi "tâm nhiễm bẩn → không
  vui → không hỷ → không trấn an → …"; chuỗi đó đã nêu đủ ở 1.5–1.10 trong cùng bài nên lược
  hợp lệ theo luật 10.2, và mỗi khoá giữ đúng MỘT `…`.

  Thuật ngữ, kèm đếm: `asaṁvutassa/saṁvutassa indriyaṁ` → không/có phòng hộ căn (nhất quán
  6 khoá trong bài) · `pāmojja` → niềm vui, `pīti` → hỷ khoái, `passaddhi`/`passambhati` → khinh
  an (122 lần toàn kho) · `dhammā pātubhavanti` → các pháp hiện khởi · `bhikkhu` → tỳ-kheo ·
  `thera` → trưởng lão (320 lần toàn kho) · `bhante` → bạch Thế Tôn · `…pe…` → một dấu lược.
  0.1 giữ nguyên `Saṁyutta Nikāya 35.97` theo 1673 khoá `:0.1` đã có trên đĩa; 0.2
  `Saḷavagga` → "10. Phẩm Sáu" theo đúng 5 bài cùng phẩm (`sn35.96`, `98`, `99`, `100`,
  `102`); 0.3 `Pamādavihārīsutta` không có tiền lệ, dịch theo tên phẩm.

  KHÔNG ĐỐI CHIẾU ĐƯỢC tầng `vietnamese-current` (Hòa thượng Thích Minh Châu): tại commit đã
  ghim lớp Bilara tiếng Việt chỉ có Pháp Cú. Đây là giới hạn của bản chụp upstream, không
  phải thiếu sót của repo; `triangulation` 9.3 vì vậy (đã có Anh Sujato đầy đủ 100%, nhưng
  không có tầng Việt thứ hai).

  `technical_integrity` = 9.6 vì lát này không được chạy bốn cổng kỹ thuật (`npm run
  validate|test|check|build` bị cấm). Tôi tự kiểm bằng harness `_hvi.kiểm()` của kho: đủ khoá
  có nội dung, không khoá thừa, không Pāli lọt vào bản Việt, không trùng nguyên văn Pāli,
  dấu lược khớp từng khoá, ngoặc kép cân trên cả bài (47/47 sạch), và toàn bộ ký tự NFC.
