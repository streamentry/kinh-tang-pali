notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở commit 11c9d708. Không có bản Việt tham khảo: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên tầng `vietnamese-current` không phủ bài này và triangulation chỉ dựa trên Pāli + Sujato.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  1.1–1.10 và 1.11–1.18 dùng lại nguyên văn sn52.8 (dòng sông Hằng, đám đông mang cuốc và giỏ, lời mời từ bụi y ca-sa, cùng cấu trúc hỏi và trả lời). Riêng 1.18–1.20 về bát chánh đạo, dùng cùng cách với sn45.139 để hai bài cùng phẩm không lệch nhịp.
  0.3 `Nadīsutta` dùng lại nguyên văn sn22.93:0.3. 0.2 `Balakaraṇīyavagga` chọn 12. Phẩm Công Sức theo đa số 8 phiếu trong sn45.
  1.19 có HAI …pe… nên bản Việt giữ đúng hai …; đây là khoá duy nhất trong lát có hai dấu lược, đã đối chiếu lại bằng hàm lược của harness.
  2.1–2.4 là uddāna, dùng lại nguyên văn sn46.153-164, sn47.73-84 và sn48.93-104 (3 cặp cho mỗi câu). 2.0 `Tassuddānaṁ` dịch là Tóm lược theo an10.10, an10.100, an10.112, an10.122.
  1.23 `Balakaraṇīyavaggo chaṭṭho` dùng lại khuôn của sn46.99-110:1.2 (Phẩm … là phẩm thứ …). 1.21 để trong ngoặc vì Pāli để trong ngoặc.
  Bất định đã phân xử: 1.2 Pāli không có động từ nói (āgaccheyya … ādāya rồi dấu hai chấm) nên bản Việt không thêm nói rằng, dù sn52.8 có thêm. Không thêm chữ ngoài Pāli.
  Coverage tầng Anh trên Pāli có nội dung (16 segment) là 16/16 = 100%: Sujato ghim 15/16, chỗ còn lại do english-project published bù. Không cần ghi nhận gap.
