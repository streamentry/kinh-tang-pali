notes: |-
  Dịch từ Pāli root đã ghim (`.cache/upstream/suttacentral/root/pli/ms/sutta/sn/sn22/sn22.99_root-pli-ms.json`; git object `2a51e0ecc8e1846a4873086331e9b94ec171bdcb`, commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`, tra `source/upstream-manifest.json`). Pāli là authority; bản Anh chỉ để đối chiếu.

  **TẦNG ANH ĐỦ 100%, đo được.** Công thức `src/lib/canon/reference.ts`: Pāli có nội dung = 17 khoá (≥ 40 ký tự sau nén, loại khối tham chiếu `:0`); trong đó **0 khoá** không có chữ ở tầng được tính điểm; `ratio = 17/17 = 1,0000`. Tệp: `translation/en/sujato/sutta/sn/sn22/sn22.99_translation-en-sujato.json` (object `81cd751fde759ff5148847b1f4d434054a2f3b0b`). `content/meta/en/sn/sn22.99.yaml` không tồn tại ⇒ không có lớp lấp `english-project`. `triangulation` 9.3 vì có đầy đủ tầng Anh, nhưng **không** có tầng Việt hiện hành để đối chiếu (tại commit đã ghim, `translation/vi/phantuananh` chỉ có 26 tệp Pháp Cú).

  **DÙNG LẠI NGUYÊN VĂN — 9/32 khoá có Pāli trùng nguyên văn ở bài khác:**
  `0.2` = `sn22.93:0.2` · `1.1` = `sn31.3:1.1` · `1.2` = `sn15.1:1.7` · `1.3` = `sn15.13:2.2` · `2.7` = `sn22.93:1.10` = `sn22.47:1.9` · `3.3` = `mn132:9.4` = `mn131:9.4` · `3.4` = `mn132:9.5` · `3.5` = `mn132:9.6` · `3.10` = `sn38.7:1.15`.

  **Ba khoá có Pāli trùng nhưng tôi cố ý KHÔNG dùng lại, và lý do:**
  (1) `3.6` trùng `sn22.44:2.7`, nhưng bản Việt ở đó dịch sai vế cuối thành *tự ngã ở trong sắc* trong khi Pāli là `viññāṇasmiṁ vā attānaṁ` = *trong thức*. Tôi dịch đúng và ghi đè chỗ sai, không sao chép lỗi.
  (2) `1.3` trùng `sn15.13:2.2` và `sn22.100:1.3`. Đa số đo được là 6 (`Không thấy được khởi điểm của các chúng sinh bị vô minh che lấp, bị khát ái trói buộc, trôi lăn và luân chuyển.`); `sn22.100:1.3` chỉ có 1 và dùng cách khác. Tôi theo đa số, **người biên tập nên gộp `sn22.100:1.3`** về cùng cách để hai bài em anh không tự mâu thuẫn.
  (3) `2.10` trùng `sn12.19:5.6` và `an2.6:1.6`; hai bản ấy bỏ chủ ngữ `so`, tôi giữ *Người ấy* cho khớp `3.9` (*Vị ấy đã thoát khỏi khổ đau*) — vế trước và vế sau là một cặp.

  **Thuật ngữ, kèm số đếm (đếm trên toàn tầng Việt 153.365 khoá / 5.349 tệp):**
  `Sāvatthinidānaṁ` → *Tại Sāvatthī* (**444** nơi trong sn) · `Pupphavagga` → *10. Phẩm Hoa* (**7**) · `sineru pabbatarājā` → *vua núi Sineru* (**2**: `sn13.11:1.4`, `sn13.11:2.1`; còn `Himavān` → *núi chúa Himavān*, `mn129:9.3`) · `mahāpathavī` → *mặt đất lớn* (đa số: `mn21:12.10`, `sn13.5:1.2`, `sn13.6:1.4`, `sn56.51/61`, `dn16:3.13.3`) · `rūpa/vedanā/saññā/saṅkhāra/viññāṇa` → *sắc/cảm thọ/tưởng/các hành/thức* · `attato samanupassati` → *thấy … là tự thân* (**3** nơi trùng PāLI: `sn22.93:1.4`, `sn22.47:1.5`, `sn22.117:1.3`; đối chiếu *quán … như là tự ngã* chỉ **2**) · `ariyānaṁ adassāvī` → *không thấy Bộ Đạo của bậc Thánh* (**2** nơi trùng: `sn22.93:1.3`, `sn22.117:1.2`) · `sappurisadhamme avinīto/suvinīto` → *thiện nhân / đã đi lệch trọn vẹn vào các pháp của* (`sn22.117:1.2`+`2.1`, nguyên văn) · `sokehi … upāyāsehi` → *sầu, bi, khổ, ưu, não* (**114** khoá / 36 tệp) · `parimuccati … jātiyā jarāmaraṇena` → *thoát khỏi sinh, già, chết, sầu, bi, khổ, ưu, não* (nguyên văn `sn12.19:5.5`+`6.5`) · `Sattamaṁ` → *Thứ bảy* (**115**).

  **Bốn chỗ phải phán xử, đã ghi:**
  (1) `ariyāna` nghĩa đen là *các bậc Thánh*, nhưng tôi dùng *Bộ Đạo của bậc Thánh* để khớp `sn22.117:2.1` mà `3.1` dùng lại nguyên văn — nếu đổi thì hai vế trong cùng bài lệch nhau.
  (2) `-ññeva` ở `2.8` là *chỉ*; Sujato bỏ mất (*just keep running*). Tôi giữ *chỉ quay vòng quanh …* ở cả năm uẩn, vì đó là điểm của ngụ.
  (3) `anuparidhāvati anuparivattati` = *chạy tới chạy lui, quay vòng quanh*; **0 tiền lệ** cho cụm này (`sn22.100:1.4` chỉ có `upagacchati/upatiṭṭhati/…` → *chỉ đi ngay cạnh*).
  (4) `gaddula` = dây buộc cổ, `baddha` = bị buộc. Tầng tên `name/` không khai `sn22-gaddulabaddha` nên không có tiền lệ chốt; tôi lấy **nguyên văn từ bài em `sn22.100:0.3`** = *Kinh Dây Dắt (Thứ Hai)*, nên bài này là *Kinh Dây Dắt*. Sujato dịch *A Leash*.

  **Dấu lược:** đo từng khoá từng khoá. `2.2`, `2.3`, `2.4`, `2.5`, `2.6`, `3.1`, `3.2`, `3.3`, `3.4`, `3.5` mỗi khoá **một** `…` cho `…pe…`; `2.8`, `2.9` (mỗi khoá 1 `…pe…` + 2 `…` trần) và `3.7`, `3.8` (3 `…` trần) → **3**. Không khoá nào bị bung hay bị bỏ.

  **Lượt cải thiện 2026-10-14** (đọc đối kháng từng khoá Pāli↔Việt; 22/32 khoá đổi; Pāli đứng đầu, bản Anh Sujato và tiền lệ kho đo bằng số đếm). Phần ghi chú phía trên về `tự thân`, `Bộ Đạo của bậc Thánh`, `thiện nhân`, `đi lệch`, `chạy tới chạy lui, quay vòng quanh` và `thấy … là tự thân` **đã bị thay thế** bởi các sửa dưới đây; phần đo coverage, dùng lại nguyên văn và dấu lược vẫn đúng.
  Lỗi nặng (3 khoá). `2.1`: `sā gaddulabaddho` là *con chó bị buộc dây* (Sujato: *hound on a leash*), bản cũ dịch *một con vật* và mở bằng *Tương tự vậy* cho `Seyyathāpi`, lại đếm ba lần `khīle vā thambhe vā` (*cọc gỗ, cây cọc, chân cột*) trong khi Pāli chỉ có hai vế; nay *Ví như … con chó bị buộc dây vào một cọc hay một cột trụ vững chắc*, đồng bộ với `sn22.100:1.4` và `mn102:12.7`. `2.3` và `3.1`: `avinīto/suvinīto` là *chưa/đã được huấn luyện (tu tập)*, bản cũ dịch *không đi lệch / đã đi lệch trọn vẹn vào*, nghĩa không có trong Pāli và đảo nghĩa của `suvinīta`; nay *không tu tập pháp các bậc chân nhân* và *khéo tu tập pháp các bậc chân nhân*, theo `sn22.55:2.2`, `sn22.55:7.1`, `sn22.85:22.1` (cùng công thức rút gọn `…pe…`) và hơn mười bài `sn22` đầy đủ. `3.1` còn thêm *tỳ-kheo* cho `ariyasāvako` (Pāli chỉ nói *Thánh đệ tử*); đã bỏ.
  Lỗi vừa (11 khoá). `2.2`: `ariyānaṁ adassāvī` → *không thấy các bậc Thánh* (không *Bộ Đạo của bậc Thánh*), theo `sn22.47:1.4`, `sn22.55:2.1` và đa số; `attā` → *tự ngã*, `samanupassati` → *quán* ở `2.3`–`2.7`, `3.2`–`3.6` (7 khoá): trước đó *tự thân* chỉ có ở 4 bài cùng một họ (`sn22.93`, `sn22.99`, `sn22.47`, `sn22.117`; 16 khoá), còn *quán … là tự ngã* 110 khoá và *tự ngã* tổng cộng 157/214 khoá `attato samanupassati`; *tự thân* còn trùng nghĩa với thân (kāya). `2.8`, `2.9`, `3.7`, `3.8`: `anuparidhāvati anuparivattati` → *chạy theo và xoay quanh* (tiền lệ `mn102:12.7`, cùng ẩn dụ con chó và cọc; 8 chỗ dùng *chạy theo và xoay quanh*, còn cụm *chạy tới chạy lui, quay vòng quanh* chỉ có ở chính bài này), và dấu lược đặt lại đúng chỗ Pāli lược (sau `vedanaṁ`, `saññaṁ`, `saṅkhāre`) thay vì chen vào vế `na parimuccati` đã viết đủ; câu `3.7` từng có dạng *không … quanh cảm thọ* nay đọc được. Số dấu lược mỗi khoá khớp Pāli (3/3).
  Lỗi nhẹ (8 khoá). `1.5`, `1.7`, `1.9`: *luân hồi* → *luân chuyển* cho `saṁsarataṁ` để khớp `1.3` (cùng cụm Pāli, 10 tiền lệ *luân chuyển*), và `ta` → `Ta` (692 *Ta* so với 52 *ta* ở câu `vadāmi`). `1.4`: `ussussati visussati na bhavati` → *khô cạn, khô kiệt, không còn nữa*; *biến mất* lặp nghĩa của *không còn nữa* và không có trong Pāli. `3.3`–`3.5`: *xem* → *quán* (cùng `sn22.55:7.3–7.5`). `3.9`: *đã thoát khỏi* → *thoát khỏi* (Pāli là hiện tại `parimuccati`, và `2.10` không có *đã*).
  Điểm: `semantic_fidelity` 9.4 → 9.3 (các lỗi nghĩa trên là lỗi mà điểm cũ chưa bắt; sau sửa còn hai điều chưa phân xử: `-ññeva` và `anuparidhāvati` đã dịch gộp theo danh sách thay vì lặp động từ cho từng uẩn, và *có thể chấm dứt* ở `1.5` là cách đọc `antakiriyaṁ vadāmi` theo tiền lệ sn15, Pāli không có từ *có thể*); `terminology` 9.3 → 9.4 (tự ngã, chân nhân, chạy theo và xoay quanh, luân chuyển nay theo đa số đo được); các điểm khác giữ. `final_score` 9.47 → 9.47 (trung bình thô). Không blocker; `status` giữ nguyên.
  Tên kinh `Gaddulabaddhasutta` giữ *Kinh Dây Dắt*; uddāna `sn22.102` đang gọi hai bài này là *Buộc Chổi*, vẫn là điểm lệch cần người biên tập quyết, không sửa ở đây. Lỗi cùng họ nằm ngoài phạm vi, chỉ báo: `sn22.93`, `sn22.47`, `sn22.117` còn *tự thân*, *Bộ Đạo*, *đi lệch*; `sn22.117:2.1` còn *vị tỳ-kheo có học … đã đi lệch trọn vẹn*.
  `technical_integrity` giữ 9.6 vì cổng kỹ thuật chưa chạy lại trong lượt này; còn phải chạy `npm run validate`, `npm test`, `npm run check` và `npm run build`.
