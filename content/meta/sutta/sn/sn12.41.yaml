notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim (29/29 khoá Pāli có nội dung, coverage 1.0000). Tầng `vietnamese-current` không có cho bài này (`translation/vi/phantuananh` ở commit đã ghim chỉ có 26 tệp Pháp Cú) ⇒ không có đối chiếu Việt truyền thống.
  **Bài song song trùng gần như toàn bộ**: `sn12.42` (bài kế, `Dutiyapañcaverabhayasutta`, đã `published`), `sn55.28` (cùng khung, cùng người nói `gahapati`) và `an9.27`/`an9.28`. **Dùng lại nguyên văn 19 khoá có Pāli trùng**.
  **Thuật ngữ — đo bằng grep, có số đếm.** `sotāpattiyaṅga` → *chi phần Dự lưu* (**22** so với *chi phần dự lưu* 4; `sn12.42` dùng chữ thường, chọn theo đa số toàn tầng — đề nghị coordinator gộp `sn12.42` cho khớp). `vera` + `bhaya` → *mối sợ hãi và hận thù* trong bài, và *sự sợ hãi và hận thù* khi đi với động từ `pasavati`. Đây là **lựa chọn đánh đổi đã ghi rõ**: toàn tầng *oán thù* (24) đứng trước *hận thù* (16), và *nỗi sợ hãi* (66) trước *sự sợ hãi* (56); nhưng `sn12.42` là bài kế cùng phẩm, đã publish, dùng *mối sợ hãi và hận thù* ba lần — giữ nguyên để người đọc đọc hai bài liền nhau không thấy hai cách gọi khác nhau. `paccayā` → *làm nhân*; `paṭisaṁvedayati` → *cảm thọ khổ ưu về tâm* (nguyên văn `sn55.28`); `ṭhiracchāna` → *cõi súc sanh*, `khīṇāpāyaduggativinipāta` → *mọi cõi dữ, ác thú, đọa xứ* (22 bài); `sandiṭṭhiko…viññūhi` → nguyên văn `an5.179` vì đó là cách hiện đại rõ nhất trong tám bản Việt trùng Pāli.
  **Chuỗi duyên 12.5–12.10 dùng nguyên văn `sn12.48:6.1–6.6`** cho `12.8` và `12.9`, còn `12.5` ghép `Yadidaṁ` với cách của `sn12.48`. `samudayo` → *sự tập khởi của toàn bộ khối khổ* (17) và `nirodho` → *sự đoạn diệt của toàn bộ khối khổ* (10), hai số lớn nhất trong nhóm bản Việt trùng Pāli này.
  **Bản Anh lệch ở một chỗ, đã theo Pāli.** Bản Anh ở `3.2`–`7.1` dịch `paṭisaṁvedayati` là *"experiences mental pain and sadness"* — khớp. Nhưng ở `9.1`/`10.1` bản Anh để trống câu (`Dhamme…`, `Saṅghe…` chỉ có một từ), nên `aveccappasādena samannāgato hoti` không có chỗ bám bên Anh; đã dùng nguyên văn `an9.27:7.1` và `8.1` (Pāli trùng nguyên văn).
  Dấu lược: `12.6` và `12.9` giữ **một** `…` cho `…pe…`; không mở rộng. Nháy kép: `2.1` mở và `13.2` đóng — cân trên cả bài.
  Cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`, và `npm run build` (vì có bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9.6 chứ không 10.0.
