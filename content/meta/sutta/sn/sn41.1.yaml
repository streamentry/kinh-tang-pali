notes: |-
  Không có tầng Việt hiện hành để đối chiếu. Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Tầng đối chiếu còn lại là Pāli root và bản Anh Sujato đã ghim. budsas.org chỉ là tham khảo toàn văn, không cấp text cho tầng nào.
  Dấu lược theo đúng luật của tầng Việt: pe-lược của Pāli là MỘT dấu lược, và sau khi bỏ hết pe-lược thì đếm dấu lược còn lại. Chạy trên 315 khoá của lát: 0 khoá lệch. Không có khoá nào để trống trong bản dịch.
  BLOCKER quyết định status, không phải điểm số. Bảy mươi sáu phần trăm chỉ là số trung thực: mười một khoá Pāli có nội dung không có một chữ Anh nào trong bản Sujato đã ghim, gồm 2.3 đến 2.7 (cả đoạn tụ họp và hai cách trả lời của các vị trưởng lão), 3.3 đến 3.6 (phần gia chủ Citta nghe lại và hai vị trả lời), cùng 4.15 và 4.16 (thân và xúc chạm). Tám khoá đó tôi dựng hoàn toàn từ Pāli, và đó là lý do scorecard này không tuyên bố đã đối chiếu Anh ở những chỗ đó. Cần chạy npm run reference:gaps rồi chốt lại status.
  Tên phẩm đo trên toàn tầng sn: 5 tệp cùng phẩm Cittavagga, cả 5 đều là 1. Phẩm Tâm. Tên bài Saṁyojanasutta PHÂN KỲ thật: sáu tệp cùng tên Pāli mà sáu bản Việt khác nhau, mỗi cách đúng một lần (Kinh Bảy Sự Trói Buộc, Kinh Các Kết Trói, Kinh Các Kết Trói Thứ Hai, Kinh Kết Trói Buộc, Kinh Kiết Sử, Kinh Năm Căn Trừ Sự Trói Buộc). Không có đa số để theo, nên tôi đặt Kinh Về Sự Trói Buộc và ghi rõ ở đây để người điều phối chốt một tên cho cả nhóm.
  Cặp thuật ngữ trung tâm của bài tôi dịch có chủ đích và đây là điểm khó nhất của lát: saṁyojana là sự trói buộc, tức cái dây hay cái ách; saṁyojaniyā dhammà là các pháp gây trói buộc, tức tham dục và lòng ham. Citta dùng đúng cái phân biệt này trong ví dụ con bò, nên nếu dịch cả hai bằng kiết sử thì ví dụ mất hết ý nghĩa. Một tệp đã có bản Việt cho cụm ở 4.6 dùng kiết sử; tôi không sửa được tệp đó (ngoài lát) và ghi phân kỳ ở đây.
  Đo rồi mới dùng: 9 khoá có Pāli trùng nguyên văn với bài đã mang trạng thái, 5 dùng lại nguyên văn (1.1 và 1.2 và 3.1 với Macchikāsaṇḍa và maṇḍalamāḍe; 4.3; 4.4; và Paṭhamaṁ → Thứ nhất 287 lần). Bốn khoá lệch: 0.3 là tên bài nói trên; 3.7 giữ dấu ti mà bản có sẵn bỏ vì Pāli có; 4.5 Yo nu kho evaṁ vadeyya, bản có sẵn dịch là Nếu có ai nói như vầy, tôi dịch sát hơn là Thì có ai sẽ nói như vầy vì Pāli hỏi phủ định; 4.6 là thuật ngữ trói buộc nói ở trên.
  Ba công thức lặp: câu hỏi về saṁyojana và saṁyojaniyā dhammā xuất hiện ba lần (1.3, 2.3, 3.3), hai cách trả lời mỗi thứ một lần (1.5 và 1.7, 2.5 và 2.7, 3.5 và 3.6), nên cả sáu chỗ có một văn bản. 4.11 và 4.16 và 4.18 có Pāli trùng nhau, tôi dùng một văn bản, và 4.12 đến 4.14 lấy theo khuôn mở đầu của 4.10 vì Pāli chỉ lược ở đó.
  Review đối kháng bắt được và đã sửa: 4.5 dùng hạt giống Sai thì có ai nói như vầy trong khi bản có sẵn dùng Nếu có ai; và 3.6 dùng đáp: thay vì đáp rằng để khớp với 1.6 và 2.6 nhưng vẫn rõ nghĩa.
  Giải quyết draft 2026-10-12: kiểm toán độc lập, đọc đối kháng 45 khoá từ Pāli; thay thế các mục cũ nói về 4.5, 3.7 và về việc BLOCKER chờ chạy gap (blocker ấy đã gỡ, xem dưới). Số khoá sửa: 21/45 (1.2, 2.1, 2.2, 3.2, 3.3, 3.7, 4.2, 4.5, 4.6, 4.10 đến 4.20; 4.12 đến 4.14 chỉ bỏ chữ cũng thừa).
  Lỗi nghĩa thật, accuracy fix: (1) maṇḍalamāḷe dịch là gò đất bằng phẳng, sai; tiền lệ ud3.8, ud3.9 dịch ngôi nhà hình tròn, nay dùng lại ở 1.2, 2.2, 3.2. (2) pacchābhattaṁ piṇḍapātapaṭikkantānaṁ bị dịch thành sau khi đã nhận thức ăn trưa ở 1.2 và bỏ mất pacchābhattaṁ ở 2.2 và 3.2; nay cả ba đều là sau bữa ăn, khi khất thực trở về (tiền lệ mn123, mn119, dn14). (3) ayamantarākathā dịch là cuộc trò chuyện vặt vãnh, một nghĩa không có trong Pāli; nay là câu chuyện này khởi lên giữa các vị, theo các khoá có cụm khởi lên/được khởi lên ở mn119, mn123, dn14, ud3.9 (chữ vặt vãnh chỉ còn ở sn56.30:1.2 và an6.61:1.3, ngoài phạm vi bài này). (4) 4.19 Gặp phải may mắn thay đọc sai Lābhā te suladdhaṁ te; nay Lợi lạc cho ông, điều khéo được cho ông, theo sn52.9:3.1. (5) 4.20 ngươi có con mắt tuệ đi khắp: hai vị trưởng lão gọi gia chủ là ngươi là sai lễ, và paññācakkhu kamati là mắt tuệ thấm vào (tiền lệ an4.158:3.5), không phải đi khắp; nay vì mắt tuệ của ông thấm vào lời dạy sâu xa của Đức Phật.
  Các sửa còn lại: 4.5 và 4.6 Yo nu kho evaṁ vadeyya là mệnh đề quan hệ ai nói như vầy, không phải câu hỏi có ai sẽ nói; nay Nếu có ai nói như vầy, đúng với sn35.232:4.2 và sn35.233:4.2 (2/2 tiền lệ cùng Pāli), và 4.6 đúng đắn không thay cho đúng đắn chưa (Pāli là câu hỏi nu kho, không có ý chưa). 4.11, 4.16, 4.18 Pāli trùng nguyên văn nhau và với sn35.232; thân câu cũ là lòng ham muốn và lòng tham do cả hai phía ấy mà sinh khởi thêm chữ phía và đảo cú pháp; nay còn ham muốn và tham khởi lên ở đó do duyên cả hai ấy, thì chính điều ấy ở đó là sự trói buộc, đúng cách dịch của 19 khoá cùng cụm chandarāgo ở tầng Việt. 4.17 mano dịch Tâm, nay ý theo glossary (mano = ý) và sn35.232. 4.10 và 4.12 đến 4.15 dùng mắt thay con mắt theo sn35.232 và bỏ chữ cũng thừa ở các vế đầu. 2.1 bỏ chữ thị trấn không có trong Pāli (Migapathaka chỉ là tên nơi chốn) và anuppatto là đã đến. 3.3 thêm này hiền giả vì Pāli 3.3 có āvuso như 1.3, 2.3. 3.7 Evaṁ, gahapatī là Đúng vậy, này gia chủ, theo sn41.3:7.5 và 7.9 (2 so với 1 khoá Vâng vâng ở sn41.5:4.3). 3.2 và 4.2 người cư sĩ nói với tỳ-kheo xưng con, theo sn41.2, 41.3, 41.4 (sn41.2:1.3, 3.3; sn41.3:1.3, 4.3; sn41.4:1.3, 5.2 đều xưng con); 4.2 thêm cho các ngài vì Pāli có vo.
  Giữ nguyên sau đo: 0.2 là 1. Phẩm Citta vì đo 10/10 tệp sn41 đều là 1. Phẩm Citta (mục cũ ở trên nói cả nhóm là Phẩm Tâm là không khớp với 0.2 thực tế; thẻ tag trong meta không đụng tới). 0.3 Kinh Về Sự Trói Buộc giữ theo mục cũ (tên phân kỳ, chưa có đa số). 4.3 giữ vì có tiền lệ mn127:16.3. 4.4, 4.8, 4.9 đối chiếu lại đúng. Phép đo trên lát đã sửa: tập khoá Việt bằng tập khoá Pāli (45/45); nháy đơn và nháy kép khớp Pāli từng khoá; các nhóm Pāli trùng nội bộ (1.5, 2.5, 3.5 và 1.7, 2.7; 4.11, 4.16, 4.18) có bản Việt đồng nhất; 1.3, 2.3 và 3.3 chỉ khác ở ngoặc mở và vế mở đầu, đúng như Pāli; dấu lược 4.12 đến 4.14 giữ …, mỗi khoá một dấu như Pāli; không có số lượng Pāli để tính.
  Blocker cũ về độ phủ English (23/34 = 67,6% dưới ngưỡng 0,80) đã gỡ: đó là blocker loại độ phủ, không phải lỗi văn bản, và mất mát được ghi nhận ở content/meta/reference-gaps.yaml. Sujato để trống 11 khoá Pāli có nội dung: 2.3 đến 2.7, 3.3 đến 3.6, 4.15 và 4.16. Đã đọc kỹ từng khoá từ Pāli: 2.3 đến 2.7 và 3.3 đến 3.6 là lặp lại gần nguyên văn 1.3 đến 1.7 (theo kiểm kê cũ ở trên, các khoá 1.x có bản Sujato phủ); 4.15 và 4.16 theo đúng khuôn 4.10 và 4.11 (4.11 có Sujato theo kiểm kê cũ); không có chỗ nào nghĩa còn chưa chắc. Vì vậy triangulation đặt 8,0 (không cao hơn), vì không có bản Anh độc lập cho 11 khoá ấy và không có tầng Việt hiện hành (tầng này chỉ có Pháp Cú tại commit đã ghim).
  Bất định còn lại: tên bài Saṁyojanasutta (sáu bản Việt khác nhau trong kho, chưa có đa số); maṇḍalamāḷa dịch ngôi nhà hình tròn theo tiền lệ (có thể là sảnh đường hình tròn); kira ở 2.2 và 3.2 dịch nghe nói. Ngoài phạm vi, báo: sn41.5:7.3 và sn41.7:6.16 cũng dùng ngươi ... đi khắp cho cùng câu, sn56.30:1.2 và an6.61:1.3 cũng có gò đất bằng phẳng và vặt vãnh. Bốn lệnh kỹ thuật npm run validate, npm test, npm run check, npm run build chưa chạy trong lượt này nên technical_integrity giữ 9,6, không tuyên bố đã qua cổng.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 3.4 — `Ekaccehi therehi bhikkhūhi evaṁ byākataṁ` “Có các vị trưởng lão tỳ-kheo trong số ấy đáp rằng” → “Có những vị trưởng lão tỳ-kheo đáp rằng”: “trong số ấy” thuộc `tatra` ở 2.4, không có trong Pāli của 3.4; không thêm “khác” vì đây là nhóm thứ nhất trong lời Citta kể lại (2.6 và 3.6 mới là nhóm “khác”).
