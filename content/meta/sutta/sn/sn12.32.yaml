notes: |-
  Đợt 19, lane 38. Dịch đủ 135 khoá từ Pāli root, đối chiếu bản Anh của Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn (chỉ để tra thuật ngữ và cấu trúc, không sao chép; tầng Việt hiện hành phân đoạn vắng ở bài này).

  Coverage English đo thật: mẫu số là khoá Pāli có nội dung (từ 40 ký tự, bỏ khối 0) = 103; Sujato có chữ Anh ở 80 khoá = 77,7%, dưới ngưỡng 0,80. 23 khoá để trống: 8.2, 8.3, 9.5, 10.5, 11.7, 14.6, 14.7, 16.8, 16.10, 16.12, 16.14, 16.16, 17.4, 17.5, 17.13, 18.2 đến 18.9. Trong 23 khoá ấy có 10 khoá (8.2, 8.3, 9.5, 10.5, 11.7, 14.6, 14.7, 17.4, 17.5, 17.13) có Pāli trùng, chỉ khác dấu cuối khoá, với một khoá trong cùng bài đã có chữ Anh, nên được đối chiếu gián tiếp; 13 khoá còn lại (16.8, 16.10, 16.12, 16.14, 16.16, 18.2 đến 18.9) không có English nào, chỉ dựa vào Pāli. Ngay trong 80 khoá có chữ Anh, Sujato rút gọn ở khoảng 9 khoá chuỗi ngày đêm (16.5, 16.6, 16.7, 16.9, 16.11, 16.13, 16.15, 17.3, 18.1: 17.3 chỉ là một dòng tóm lược trong ngoặc đơn và 18.1 gộp cả chuỗi), nên độ phủ thật còn thấp hơn con số 77,7%. Tầng english-project chưa có nội dung cho bài này, tầng vietnamese-current vắng (chỉ có Pháp Cú). Vì dưới ngưỡng nên bài giữ draft chứ không publish; triangulation để 8,0. Người biên tập chạy `npm run reference:gaps` rồi quyết định nâng trạng thái.

  Số Pāli: bài không có số lớn. Chuỗi thời gian ở 16.4 đến 16.17, 17.5 đến 17.13, 18.1 đến 18.9 theo đúng thứ tự Pāli: divasa một ngày, ratti một đêm, rattindiva một ngày đêm, dve hai ngày đêm, tīṇi ba, cattāri bốn, pañca năm, cha sáu, satta bảy; đã đối chiếu từng khoá: 16.7/16.8 hai, 16.9/16.10 ba, 16.11/16.12 bốn, 16.13/16.14 năm, 16.15/16.16 sáu, 16.17 bảy; 17.7 một ngày đêm, 17.8 hai, 17.9 ba, 17.10 bốn, 17.11 năm, 17.12 sáu, 17.13 bảy; 18.3 một ngày đêm, 18.4 hai, 18.5 ba, 18.6 bốn, 18.7 năm, 18.8 sáu, 18.9 bảy. Ba loại thọ ở 12.6 đến 12.9 (tisso) là ba, đếm đủ ba tên ở 12.8.

  Dấu lược: 25 khoá Pāli có …pe… hoặc … trần (11.2, 16.7 đến 16.16, 17.6 đến 17.12, 18.2 đến 18.8), bản Việt giữ đúng một … cho mỗi khoá (0 lệch). Pāli không có (…) ở khoá nào nên bản Việt không có. 17.9 đến 17.12 Pāli chỉ là số đếm rồi …, bản Việt giữ nguyên dạng ba …, bốn …, năm …, sáu …. Nháy đơn và nháy kép khớp Pāli từng khoá (135/135 khoá, 0 lệch). Pāli trùng nguyên văn trong chính bài: 14 nhóm, 62 cặp, 0 cặp bản Việt khác nhau.

  Tiền lệ dùng lại nguyên văn: dò 35 khoá có Pāli trùng nguyên văn ở nơi khác trong tầng (849 cặp, trong đó 330 cặp bản Việt khác vì cùng Pāli đã được dịch nhiều cách); 26 khoá dùng đúng dạng đa số hoặc ngang đa số, 9 khoá khác có lý do. Dạng dùng lại: 0.2 Phẩm Kaḷāra (9 nơi); 1.1 Trú ở Sāvatthī (95 trong 158 nơi); 6.2 đến 6.5 theo an9.11:1.10 đến 1.13; 6.1 Rồi Đức Thế Tôn gọi một tỳ-kheo (5 nơi); 8.1, 9.4, 10.4, 11.6, 12.4, 14.5 Bạch Thế Tôn, nếu có người hỏi con như vầy (sn22.37:2.4 và sn22.38:2.6); 8.4, 9.6, 10.6, 11.8, 14.8 Được hỏi như vậy, bạch Thế Tôn, con sẽ trả lời như vầy (sn22.37:2.6, sn22.38:2.10); 8.8, 9.8, 10.8, 11.10, 14.10 theo sn22.38:4.9 (như vậy; sn22.37:2.13 viết như thế); 12.7 Thế nào là ba (42 trong 56 nơi); 13.1 và 15.1 Lành thay, lành thay, này Sāriputta (12 nơi ở sn, so với 4 nơi Tốt lắm ở mn); 18.10 Thứ hai (285 nơi). Chín khoá khác tầng, có lý do: (1) công thức khīṇā jāti, vusitaṁ brahmacariyaṁ, kataṁ karaṇīyaṁ, nāparaṁ itthattāyā (5.3, 6.8, 7.3, 8.7, 14.3, 14.7; 8.3 khác cả về dấu cuối): tầng có bốn dạng, toàn sn 114 khoá viết không còn gì là tự thân nữa, 41 khoá viết không còn trở lại trạng thái này nữa, riêng sn12 là 4/4 khoá không còn trở lại trạng thái này nữa (sn12.17, 12.51, 12.61, 12.62), còn an9.26 và an10.84 viết không còn trở lại trạng thái hiện hữu này nữa (9 khoá). Chọn dạng của sn12 vì cùng bộ và gần nhất, giữ cùng một cách viết ở mọi chỗ trong bài (sinh đã tận, phạm hạnh đã thành, việc cần làm đã làm, không còn trở lại trạng thái này nữa, tôi biết rõ). (2) 12.8 Lạc thọ, khổ thọ, bất khổ bất lạc thọ khác sn36.10 chỉ ở chữ và, vì Pāli không có chữ ấy. (3) 15.4 Đức Thế Tôn đã nói như vậy: toàn tầng Đức Phật đã nói như vậy 110 khoá, Đức Thế Tôn đã nói như vậy 30 khoá, nhưng ở sn là 25 trên 45 khoá nghiêng về Đức Thế Tôn đã nói như vậy, và sn12.1 cùng dạng. (4) 16.1 khác mn3:4.3 và mn141:7.1 vì bài này mở bằng Tại đó theo 33 khoá Tatra kho āyasmā sāriputto bhikkhū āmantesi (an và sn đều là Tại đó, Tại đây, Ở đó).

  Thuật ngữ theo đếm: dhammadhātu suppaṭividdhā dịch nguyên lý của Pháp ấy đã được thấu đạt rõ ràng theo dn14 và mn58 (6 khoá, cùng công thức yassā dhammadhātuyā suppaṭividdhattā). nandī dịch hoan hỷ (sn 39 khoá hoan hỷ, 0 khoá thích thú; toàn tầng hoan hỷ 52, thích thú 6; sn12.64 cùng dạng). upādāna dịch chấp thủ (sn12: chấp thủ 72, thủ 59; toàn sn chấp thủ 178, thủ 164), taṇhā dịch ái (sn12 ái 68, khát ái 57; công thức nidāna theo sn12.11). vedanā dịch thọ (sn12: thọ 119, cảm thọ 69); tisso kho imā vedanā dịch có ba loại thọ theo mn44, mn74, dn15. kulaputta dịch thiện nam tử (sn 40 trên 54 khoá). kiṁnidānā kiṁsamudayā kiṁjātikā kiṁpabhavā dịch lấy gì làm nhân, làm nguồn sinh, làm chỗ phát sinh và làm nguồn gốc theo sn12.11 và sn12.51. aññā byākatā dịch tuyên bố chánh trí theo sn48.45 đến sn48.47; byākareyyāsi dịch trả lời theo sn22.37; veyyākaraṇa dịch giải đáp. padehi dịch từ ngữ, byañjanehi dịch văn cú (cặp từ ngữ, văn cú có ở sn35.116). pariyāya dịch cách. aññamaññehi dịch khác nhau (nghĩa các khác nhau, không phải lẫn nhau). hīnāyāvatto dịch trở về đời sống thấp kém theo sn35.120:1.4 (Pāli giống). kaṅkhā dịch nghi ngờ (sn 60 khoá: nghi ngờ 16, do dự 7, phân vân 3), vicikicchā dịch do dự (sn 17 khoá: nghi hoặc 10, do dự 4, nghi ngờ 3); chọn do dự để hai từ khác nhau như cặp na kaṅkhati na vicikicchati ở sn12.15:2.6 và tránh dùng nghi hoặc làm động từ (tên triền cái). assāsa dịch sự yên ổn theo sn38.5 (Kinh Sự Yên Ổn). Sāriputta khi nói với Phật xưng con, khi nói với các tỳ-kheo xưng tôi; āvuso dịch hiền giả (sn35.120, sn38.5, mn44).

  Bất định đã phân xử, ghi ở đây, không thêm vào thân kinh: (1) 8.5 và 8.6 yaṁnidānā jāti, tassa nidānassa khayā khīṇasmiṁ khīṇāmhīti viditaṁ. Về hình thái khīṇāmhi là ngôi thứ nhất (tôi đã tận), nếu đọc đúng chữ thì thành tôi đã diệt tận, mâu thuẫn với văn cảnh vì Sāriputta đang nói về sự tận của sinh; Sujato đọc when the source of rebirth ended, I knew it is ended, Hòa thượng Thích Minh Châu đọc là sự tận diệt của cái nhân sinh. Bản Việt viết trung tính, không chủ ngữ, được biết rằng đã diệt tận, và không thêm nháy vì Pāli 8.5 và 8.6 không có nháy quanh khīṇāmhīti. Người biên tập nên kiểm. (2) 16.3 và 17.4 bhagavā paṭhamaṁ pañhaṁ anumodi, nghĩa đen là Đức Thế Tôn tùy hỷ câu hỏi đầu tiên, mâu thuẫn văn cảnh vì chính Ngài là người hỏi; Sujato dịch agreed with my answer, Thích Minh Châu tùy hỷ trả lời. Bản Việt viết tùy hỷ với câu trả lời của tôi về câu hỏi đầu tiên, phần câu trả lời của tôi được bổ từ văn cảnh (14.9, 8.5 đến 8.8 và lời khen của Đức Thế Tôn ở 13.1, 15.1). (3) 14.9 ajjhattaṁ vimokkhā dịch nhờ giải thoát nội tâm (vimokkhā là cách xuất xứ, Sujato inner release; Thích Minh Châu tự giải thoát), và attānañca nāvajānāmi dịch tôi không xem thường chính mình theo Sujato (Thích Minh Châu dịch không chấp nhận tự ngã, không khớp avajānāti). tathā sato viharāmi yathā sataṁ viharantaṁ āsavā nānussavanti dịch tôi sống có niệm theo cách mà khi tôi sống có niệm như vậy, các lậu hoặc không rỉ chảy theo tôi; anussavanti dịch rỉ chảy theo (sn35.244 dịch rỉ vào chi phối, chỉ có 2 khoá nên không đủ tiền lệ). (4) 15.2 và 15.3: Pāli 15.3 không có nháy đơn mở nên không thêm nháy; câu ye āsavā samaṇena vuttā tesvāhaṁ na kaṅkhāmi, te me pahīnāti na vicikicchāmi dùng ngôi thứ nhất tôi, là lời Sāriputta được Đức Phật nêu làm cách giải đáp vắn tắt khác, không phải lời Đức Phật nói về chính Ngài. samaṇena dịch vị sa-môn, không phân xử đó là ai (Sujato the ascetic; Thích Minh Châu vị Sa-môn). Ý của 3.1 và 4.1 trả lời đúng hai vế ở 15.3 (tôi không nghi ngờ về các lậu hoặc, không do dự rằng chúng đã được đoạn trừ). (5) 3.2 Āyatiṁ, panāvuso chỉ có hai chữ, bản Việt dịch Còn về tương lai, này hiền giả?, không thêm vế được hiểu ngầm (nghi ngờ hay chưa nghi ngờ); Sujato But what of the future, Thích Minh Châu Còn đối với tương lai. (6) 1.5 Na hi nūna dịch chắc hẳn đã không đạt (an8.86 và sn2.30 cùng cách). 2.1 Tena hāyasmā dịch Vậy thì. (7) 12.2, 12.5, 12.11 upaṭṭhāsi dịch không còn hiện diện (Sujato no longer present, Thích Minh Châu không tồn tại), giữ sắc thái thì quá khứ bằng đã được biết ở 12.11; viditaṁ ở 12.11 nối với yadaniccaṁ taṁ dukkhaṁ ở 12.10, nên 12.10 ghi Cái gì vô thường thì cái ấy là khổ và 12.11 điều ấy đã được biết (Pāli 12.10 không có dấu nháy riêng, ti chỉ đóng nháy đơn mở từ 12.6). (8) 17.7 và 17.8 Pāli chỉ có rattindivañcepi maṁ bhagavā …pe… và dve rattindivāni cepi maṁ bhagavā …pe… không có động từ; bản Việt thêm động từ hỏi theo mẫu ở 17.5 và 16.7, vì đó là phần Pāli đã lược, không phải ý mới. 17.6 rattiñcepi …pe… không có maṁ bhagavā nên bản Việt chỉ viết Dù suốt một đêm …. (9) pajānāmi trong công thức khīṇā jāti dịch tôi biết rõ; ở 5.3 và 6.8 Pāli đặt pajānāmi ngoài nháy đơn (’ti pajānāmī) nên bản Việt đặt tôi biết rõ ngoài nháy đơn, còn ở 7.3, 8.3, 8.7, 14.3, 14.7 pajānāmi nằm trong nháy đơn. (10) 6.10 byākataṁ byākatato daṭṭhabbaṁ dịch điều đã tuyên bố cần được xem là đã tuyên bố, sát chữ; Thích Minh Châu lời tuyên bố cần được xem đúng như lời tuyên bố; ý là chấp nhận lời tuyên bố theo đúng điều nó nói, bất kể cách diễn đạt.

  Lượt review đối kháng: in cặp Pāli với Việt cả 135 khoá để đọc, bắt được và sửa 4 lỗi trong bản nháp: (a) 8.5 viết sinh lấy gì làm nhân (nghĩa hỏi) trong khi Pāli yaṁnidānā jāti là mệnh đề quan hệ, sửa thành sinh có nhân nào; (b) 6.12 thiếu bhante trong nháy đơn, đã thêm Bạch Thế Tôn; (c) 5.3 và 6.8 đặt tôi biết rõ trong nháy đơn trong khi Pāli đặt ngoài, đã chuyển ra ngoài; (d) 18.1 viết Dù viết hoa giữa câu, đã đổi thành dù. Chưa phát hiện cặp Pāli trùng nguyên văn nào mà bản Việt lệch ý.

