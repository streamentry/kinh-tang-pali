  0 tiền lệ cho công thức kiến chấp `so attā, so loko, so pecca bhavissāmi nicco dhuvo sassato avipariṇāmadhammo`. Suy ra từ bản song song `sn22.151` (cùng khung câu hỏi, cùng năm tính từ) và từ Sujato; dùng MỘT cách cho cả 1.3, 1.6, 1.11, 2.7, 2.17 vì Pāli lặp nguyên văn.
  BẤT ĐỊNH: `so attā, so loko` không có chữ nối trong Pāli; Sujato đọc là self and cosmos are one and the same. Chọn cách đọc tối thiểu giả định (Tôi là tự ngã ấy, là thế giới ấy) và giữ đủ năm tính từ.
  Dấu nháy kép đặt đúng như Pāli (mở 1.2 và 1.5, đóng 1.3 và 2.2, v.v.); tổng cân bằng trên toàn bài. 1.4 trong Pāli không có dấu nháy, cũng không thêm.
  1.7, 1.8, 1.9 dịch song song cùng một cách (Với cảm thọ / Với tưởng / Với các hành) dù tiền lệ dùng lẫn ba kiểu — ưu tiên nhất quán trong bài.
