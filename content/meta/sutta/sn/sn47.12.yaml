notes: |-
  Dịch từ Pāli root, có đối chiếu tầng Anh đã ghim.

  **Coverage, và chỗ yếu của nó — đã đo.** 25 segment Pāli có nội dung. Bản ghim Sujato phủ 22/25; 3 khoá
  `5.4`, `6.10`, `6.11` Sujato để trống và được lớp lấp `english-project` của chính dự án bù, lớp ấy ở
  trạng thái `published` nên được tính vào coverage theo `source/layers.yaml` ⇒ 25/25 = 1,0000. **Nhưng
  bản lấp ấy cùng do chính agent này chấm**, nên không phải cách đọc Anh độc lập: `scripts/validate.ts`
  sẽ cảnh báo, và vì vậy `triangulation` bị hạ xuống 7,5. Bản Việt này **không tuyên bố** là đã đối chiếu ở
  ba khoá ấy.

  **Pāli trùng nguyên văn: 8 khoá, 533 cặp; dùng lại y nguyên văn 7.** Một khoá lệch: `1.2`. Pāli
  `Atha kho āyasmā sāriputto …` trùng **nguyên văn** với `sn47.11:1.2` — đã đối chiếu từng ký tự — và cả
  hai bài cùng nằm trong `Nālandavagga` của cùng bộ, nên dùng lại y nguyên văn `sn47.11`. Hai bản khác
  (an4.79:1.1, sn45.3:1.2) cũng chỉ có 1 lần, và nói *Đức Phật* thay vì *Đức Thế Tôn* như khuôn chính
  của bộ `sn`.

  **Dấu lặp lại trong bài, dùng lại y nguyên văn của chính khoá trước đó.** `1.6`–`1.7` lặp `1.3`–`1.4`
  (có `‘…’` bao ngoài trong bản ghim); `3.1`–`3.2` lặp `2.1`–`2.2` ở thì tương lai (`bhavissanti`);
  `4.1`–`4.2` lặp ở thì hiện tại về chính Đức Thế Tôn; `5.3`–`5.4` lặp `1.3`–`1.4`; `6.10` lặp `6.9`
  với thì tương lai; `6.11` lặp `6.9` với thì hiện tại về chính Ngài. `6.6` dùng lại y nguyên văn
  của an4.192:9.2 và 11.2 (2 bài). `1.1` dùng lại y nguyên văn của bài cùng cảnh (1 bài). `2.3`,
  `3.3`, `4.3` dùng lại y nguyên văn đa số 35 bài cho `‘No hetaṁ, bhante’.`.

  **Thuật ngữ.** `sīhanāda` → **tiếng sư tử hống**, theo đúng khuôn của mn11:2.3 và mn12 (15 lần, gọi tên
  là *Tiểu Kinh Sư Tử Hống*, động từ *cất tiếng sư tử hống*). `bhikkhunī` → **tỳ-kheo-ni**, đúng khuôn có
  thấy ở sn10.9 và sn10.10 (đo được 0 lần dùng *tỳ-khu* trong toàn tầng). `kaṅkhā vā vimati vā` →
  **hoài nghi hay phân vân**, theo an4.172 (17 lần). `oḷārikā pāṇā` → **sinh vật lớn**, theo sn56.36:1.4.
  `cetasā ceto paricca` → **bằng tâm hiểu rõ tâm**, theo sn17.11, sn17.12, an1.43, an3.60. Danh sách
  năm cặp `sīla / dhamma / paññā / vihāra / vimutti` dịch *giới hạnh / pháp tính / trí tuệ / sống tu / tự do*;
  `dhamma` ở đây là *đạo hạnh*, không phải *pháp* theo nghĩa *thiện–ác*, nên dịch *pháp tính* cho khác
  *giới hạnh* và khớp với `evaṁdhammā te bhagavanto`.

  **Bất định đã ghi, không giấu.**
    - `5.4` có **một dấu lạc của chính bản Pāli đã ghim**: `bhagavatā’ bhiyyobhiññataro`, dấu `’`
      đứng lạch giữa hai từ, không có ở `1.4` và `1.7`. Bản Việt giữ một dấu đóng đúng chỗ Pāli đặt, nên
      đọc sẽ thấy *hơn Đức Thế Tôn’ về phần giác ngộ* — vẻ lạ nhưng là hình ảnh trung thành của lỗi nguồn.
      Cùng lý do, `6.11` kết `’”ti` (hai dấu đóng, không có mở tương ứng), nên bản Việt có hai dấu đóng
      liền nhau ở cuối câu và **không** chêm dấu chấm vì Pāli không có.
    - Hai chỗ đó là lý do `ambiguity_integrity` ở 8,9 và `vietnamese_clarity` ở 9,0.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`, và `npm run build` vì bài sẽ `published`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
