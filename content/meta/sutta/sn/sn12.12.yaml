notes: |-
  Bản dịch mới từ Pāli root (snapshot SuttaCentral/Bilara đã ghim), đối chiếu bản Anh của Bhikkhu Sujato và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không phân đoạn, dùng để tra nghĩa, không căn lề vào segment). Bài: Kinh Moḷiyaphagguna (Moḷiyaphaggunasutta), bài thứ hai của Phẩm Đoàn Thực, Tương Ưng Nhân Duyên. 70/70 khoá, đúng thứ tự Pāli.

  COVERAGE ENGLISH (đo thật): Pāli có nội dung (từ 40 ký tự sau nén khoảng trắng, bỏ khối :0.x) = 23 khoá. Bản Sujato phủ độc lập 23/23 = 1,000, trên ngưỡng 0,80 của cổng (bản Sujato có chữ ở 69/70 khoá, chỉ khoá 7.9 là lời kết trống). Không có lớp english-project cho bài này nên không có khoá nào do dự án tự bù: toàn bộ coverage là English độc lập. Tầng vietnamese-current: không có ở mức segment (bilara tại commit ghim chỉ phân phối Pháp Cú); bản Thích Minh Châu chỉ có dạng nguyên bài.

  BẤT ĐỊNH VÀ CÁC CÂU NGHĨA ĐEN DỄ LỆCH VĂN CẢNH (không thêm vào thân kinh):
  - Động từ ngôi thứ ba `āhāreti`, `phusati`, `vedayati`, `tasati`, `upādiyati` (2.4–6.3): Pāli chỉ có động từ, không có danh từ chủ ngữ; Thích Minh Châu viết `Có kẻ ăn` / `Có người cảm thọ`, Sujato `one who consumes`. Bản Việt viết `Người ấy ăn` / `Người ấy xúc chạm` (ngôi thứ ba của động từ), tránh thêm khẳng định tồn tại `có kẻ`; câu hỏi `ko nu kho` giữ `ai`. Đây là lựa chọn có ý thức về cách đưa ngôi thứ ba vào lời Đức Phật phủ nhận, không phải khác Thích Minh Châu về nghĩa.
  - `tasati` (5.1–5.8) nghĩa đen là run sợ, khát khao; ở đây là động từ tương ứng của `taṇhā`, nên dịch `khát ái` (Thích Minh Châu `khát ái`, Sujato `craves`). Nếu dịch sát nghĩa gốc thì ngắt mối nối với `taṇhā` ở 5.8 và 5.10.
  - `kissa nu kho, bhante, viññāṇāhāro` (2.9): `kissa` là sở hữu cách/liên hệ của `kiṁ`, hiểu là `cho cái gì`. Sujato `For what is consciousness the fuel?`; Thích Minh Châu `cho ai`, hơi nghiêng về chủ thể, khác Pāli (không có `ko`). Bản Việt dùng `thức thực là cho cái gì` để câu trả lời 2.11 (`duyên cho sự tái sinh …`) đứng đúng vai trò.
  - `tasmiṁ bhūte sati` (2.11): `bhūta` có thể hiểu là hữu tình đã sinh (Sujato `When the being is present`) hoặc cái đã hiện hữu (Thích Minh Châu `Khi cái ấy hiện hữu`). Câu nằm ngay sau `punabbhavābhinibbattiyā paccayo`, nên chủ ngữ ngầm là cái đã được thức thực làm duyên cho; bản Việt giữ nghĩa trung tính `khi cái ấy đã hiện hữu` theo Thích Minh Châu.
  - `kallo pañho` / `kallaṁ veyyākaraṇaṁ` (5 vòng): `câu hỏi hợp lý` / `câu trả lời hợp lý`, theo đúng `sn12.35:1.7, 2.2, 3.2, 4.2` (cùng cụm Pāli, tầng viết `câu hỏi hợp lý`). `tatrassa kallo pañho` giữ cách điều kiện bằng `sẽ là hợp lý`.
  - `āhāra` → `đoàn thực` (1.2, 1.5): theo `sn12.11:1.3, 1.6` (cùng Pāli, đã published) và tên phẩm `Đoàn Thực`, dù `đoàn thực` thật ra là `kabaḷīkāro āhāro` (1.4). `mn38:15.1` dịch `bốn loại thức ăn`; đo toàn tầng: `thức ăn` 187 khoá cho các khoá có `āhāra`, `đoàn thực` 20. Giữ theo `sn12.11` để hai bài cùng phẩm khớp nhau; người biên tập có thể muốn thống nhất cả phẩm sau.
  - `viññāṇāhāro` dịch `thức thực` (Thích Minh Châu); tầng không có cặp song song nào cho từ này (0 khoá) nên không có tiền lệ đếm được.
  - `punabbhavābhinibbatti` (2.11): `sự tái sinh vào hữu mới` theo `sn12.38:1.4`; `mn43` dùng `sự hình thành một đời sống mới`, hai cách cùng tồn tại trong tầng (4 khoá `mn43`, 4 khoá `sn12.38`).
  - Xưng hô: Phagguna gọi `bhante` → `bạch Thế Tôn`; Đức Phật tự xưng `Ta`; `phagguna` ở 7.1 là hô cách → `này Phagguna` (rút gọn từ `Moḷiyaphagguna`, theo Thích Minh Châu). `bhagavā avoca` → `Thế Tôn dạy` theo `sn12.35`, khác `đáp` ở các bài lân cận (`sn12.17`); đây là trường hợp Pāli trùng nguyên văn nên dùng lại.
  - Dấu nháy: nháy kép mở ở 1.2 và 2.3–2.4 (lời Phagguna và lời Đức Phật) rồi đóng ở 7.8; nháy đơn mở ở 6.10 và đóng ở 6.11 (`bhavo’ti …pe…`), đúng như Pāli cắt qua ranh giới khoá. 6.11 giữ đúng một `…` (`…pe…`); các khoá còn lại không có dấu lược.
  - Số: `cattāro` = bốn; `dutiyo` = thứ hai, `tatiyā` = thứ ba, `catutthaṁ` = thứ tư (1.4); `channaṁ phassāyatanānaṁ` = sáu xúc xứ (7.1); `saḷāyatanaṁ` = sáu xứ. Không có số lớn.

  TIỀN LỆ VÀ THUẬT NGỮ (đo bằng cách dựng chỉ mục Pāli đến Việt toàn tầng): đã dò 13 khoá của bài có Pāli trùng nguyên văn với khoá của bài khác (0.2, 1.1, 1.3, 1.4, 6.12, 7.2 đến 7.9); ở 12/13 khoá, bản Việt của bài này khác ít nhất một bản cùng Pāli (chỉ 1.4 giống cả 3 bản), vì tầng có nhiều biến thể cho cùng một công thức, không biến thể nào áp đảo tuyệt đối. Cụ thể: 0.2 theo `sn12.13:0.2` (7 khoá cùng cách; 1 khoá `sn12.11:0.2` viết `Đoān` là lỗi gõ sẵn có, không theo); 1.1 `Trú ở Sāvatthī.` (91 khoá toàn tầng, và 26 khoá trong `sn12`, so với `Đang sống tại Sāvatthī.` 8 khoá và `Trú tại Sāvatthī.` 5 khoá trong `sn12`); 1.3 `Thế nào là bốn?` (153 trên 233 khoá); 1.4 theo `mn9:11.4`, `mn38:15.3` và `sn12.11:1.5` (3 khoá, giống hết); 7.9 `Thứ hai.` (270 trên 274 khoá). 1.2 và 1.5 không trùng nguyên văn với `sn12.11:1.3` và `sn12.11:1.6` (khác chữ hoa và chữ `kho`) nhưng cùng công thức, nên dùng đúng bản Việt của hai khoá ấy. 2.3, 3.2, 4.2, 5.2, 6.2 theo `sn12.35` (4 khoá `No kallo pañho`). Trong chính bài có 4 nhóm khoá Pāli trùng nguyên văn (2.3/3.2/4.2/5.2/6.2; 2.7/3.6/4.6/5.6/6.6; 2.8/3.7/4.7/5.7/6.7; 2.10/3.9/4.9/5.9/6.9); bản Việt giống nhau trong cả 4 nhóm.
  - Chuỗi diệt 7.5 đến 7.7: Pāli trùng nguyên văn với 10, 10 và 15 khoá (`sn12.1`, `sn12.43`, `sn12.52`, `sn12.53`, `sn12.60`, `sn35.106`, `sn35.107`, `sn35.113`, `mn38`, `an3.61`, `ud1.2`, `ud1.3`). Có hai họ: `do X diệt tận mà Y diệt tận` (kèm `chấp thủ`, `sanh`; 8 khoá cho 7.5, 8 khoá cho 7.6, 8 khoá cho 7.7) và `do X diệt nên Y diệt` (kèm `thủ`, `sinh`; 2 khoá cho 7.5 và 7.6, 4 khoá cho 7.7: `sn12.53`, `sn12.60`, `mn38`). Tôi chọn họ `diệt nên`, tức là chọn ít khoá hơn, vì ba lẽ: (a) 7.1 theo `mn38:20.1` (`hoàn toàn ly tham và đoạn diệt không còn dư tàn nên … diệt`) giữ được `virāga`, còn họ `diệt tận mà` bỏ chữ ly tham; (b) `sn12.60:6.9 đến 6.13` là khối gần nhất, cùng Pāli từ 7.4 đến 7.8, đã published; (c) `sn12.11` và `sn12.15` trong cùng phẩm cũng viết `nên … diệt`. Hệ quả: `taṇhā` danh từ dịch `ái` và `upādāna` danh từ dịch `thủ` (theo `sn12.60:4.5`, `sn12.53`), còn động từ `tasati` và `upādiyati` dịch `khát ái` và `chấp thủ` (Thích Minh Châu cũng phân biệt như vậy); đo trong `sn12`: `taṇhā` dịch `khát ái` 52 khoá, `ái` 49 khoá, `tham ái` 18 khoá; `upādāna` dịch `chấp thủ` 68 khoá, `thủ` 48 khoá; `jāti` dịch `sinh` 18 khoá, `sanh` 17 khoá (gần như hòa, nên chọn theo khối gần nhất). `sn12.20` cùng phẩm viết `khát ái` và `chấp thủ` cho cả danh từ; lệch này có chủ ý, ghi lại để người biên tập thống nhất nếu muốn.
  - 7.7 dùng lại nguyên văn `sn12.60:6.12`, `sn12.53:3.5`, `mn38:20.11` (4 khoá cùng Pāli, cùng cách). 6.12 theo họ `như vậy là sự tập khởi của toàn bộ khối khổ đau này` (13 trên 31 khoá; họ `khối khổ này` khoảng 8 khoá). 7.8 dùng `khối khổ đau này` để khớp 6.12 (như `sn12.60:6.13` và `sn12.11:3.6`), dù 5 khoá `sn12.1`, `sn12.38`, `sn12.40`, `ud1.2`, `ud1.3` viết `khối khổ này`: cặp 6.12 và 7.8 phải đồng nhất trong cùng bài.
  - Công thức nhân duyên 2.11, 3.10, 4.10, 5.10, 6.10 đến 6.11 viết `do duyên … mà có …` theo `sn12.20`, `sn12.35` và `sn12.1`; `saḷāyatana` dịch `sáu xứ`, `phassāyatana` dịch `sáu xúc xứ` (`mn102`, `dn1`); `vedanā` dịch `thọ` (76 khoá, so với `cảm thọ` 51 khoá trong `sn12`), còn động từ `vedayati` dịch `cảm thọ` ở 4.1 đến 4.5; `phasso` dịch `xúc` (41 khoá so với `xúc chạm` 23 khoá), động từ `phusati` dịch `xúc chạm`.

  Kiểm tra đã làm: tập khoá 70/70 khớp Pāli, thứ tự khớp; dấu nháy kép và nháy đơn khớp Pāli từng khoá (70 khoá, 0 lệch); NFC; không khoá rỗng; không khoảng trắng thừa; không Pāli lọt sang Việt ngoài tên riêng; đã in cặp Pāli với Việt từng khoá để đọc.

  technical_integrity 9,6 vì các lệnh cổng kỹ thuật của dự án chưa được chạy trong lát này: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Người điều phối chạy bốn lệnh này trước khi hợp nhất; chỉ khi cả bốn pass mới coi tiêu chí kỹ thuật là đạt hoàn toàn.
