notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato cộng bản lấp English của dự án. Coverage English = 25/25 khoá Pāli có nội dung = 100%.
  TRIANGULATION KHÔNG ĐỘC LẬP: 1 trong 25 khoá Pāli có nội dung (3.3) chỉ có tiếng Anh từ bản lấp `content/translation/en/project`, cùng tác giả với bản Việt này. Tiêu chí 6 đặt 8.0. Tầng Việt hiện hành vắng ở commit đã ghim.
  0.1 giữ `Saṁyutta Nikāya 55.28`; 0.2 theo tiền lệ 4 bài cùng phẩm (3. Phẩm Quy Y, khớp `sn55.29:3.9` câu Phẩm Quy Y là phẩm thứ ba); 0.3 đặt theo `sn55.29:0.3` là Kinh Sợ Hãi Và Nguy Hiểm Đã Xóa Sạch (Hai), nên bài nhất không ghi (Nhất).
  18 khoá có PĀLI TRÙNG NGUYÊN VĂN với tệp đã có trong HEAD, dùng lại nguyên văn: 0.2 (3 bài) · 1.1 (433 khoá) · 1.2 (`an3.110:1.1`) · 2.1 (`an9.27:3.1`) · 2.3 (`an9.27:3.3`) · 2.4 (`an9.27:4.1`) · 2.9 (`an9.27:5.1`) · 3.1 (`an9.27:6.1`) · 3.3 (`sn55.11`/`sn55.13`/`sn55.14`) · 3.4 (`sn55.11:2.5`) · 3.5 (`sn55.11:2.6`) · 3.6 (`sn55.12:3.7`) · 3.7 (`an9.27:9.2`) · 4.1 (`sn12.42:4.1`) · 4.6 (`sn12.15:3.6`) · 4.8 (`sn12.3:3.4`) · 5.2 (`an9.27:10.2`) · 5.3 (Thứ tám.). 2.8 dùng nguyên văn `an9.27:4.5` cho vế tương ứng với rượu men. Tổng lát c32: 143 cặp.
  Toàn bộ khung năm sợ hãi và oán thù dùng nguyên văn `an9.27` (cùng công thức, cùng bối cảnh gia chủ Anāthapiṇḍika): năm nỗi sợ hãi và oán thù đã được làm lắng dịu, do duyên sát sinh / trộm cắp / tà dâm / nói dối / uống rượu men, rượu nấu và các chất say, chuốc lấy sự sợ hãi và oán thù ngay trong hiện tại, chuốc lấy trong đời sau, cảm thọ khổ ưu về tâm.
  LỆCH CÓ CHỦ ĐÍCH, ghi rõ: `khīṇanirayomhi khīṇatiracchānayoni khīṇapettivisayo khīṇāpāyaduggativinipāto; sotāpannohamasmi avinipātadhammo niyato sambodhiparāyaṇo` ở 1.4 và 5.2 dịch theo `an9.27` (đoạn tận địa ngục, loài súc sanh, cõi ngạ quỷ, các đọa xứ, ác thú, hiểm cảnh; không còn bị đọa xứ, được quyết định, hướng đến Chánh giác) chứ không theo `sn55.29:1.3` vốn dịch `tiracchānayoni` thành cõi địa ngục sinh ra từ sự tiếp xúc — nghĩa đó không có trong Pāli.
  `ariyo ñāyo` dịch chánh lý của bậc thánh, theo 4 tiền lệ `sn12.42:4.1`, và `sotiāpattiyaṅga` dịch chi phần Dự lưu (25 khoá) — không dùng thành phần của sự nhập lưu của `sn55.29` vì bài đó cùng tác giả nhưng đã dịch lệch.
  BẤT ĐỊNH: `avijjāpaccayā` dịch là điều kiện của (22 khoá), `suduṭṭho suppaṭividdho` dịch khéo thấy, khéo thấu suốt. 3.3 dịch `itipi so bhagavā …pe… satthā devamanussānaṁ buddho bhagavāti` là Đức Thế Tôn ấy là bậc A-la-hán … bậc Thầy của chư thiên và loài người, Phật, Thế Tôn, giữ MỘT dấu lược và không mở rộng danh sách tướng chưa viết trong Pāli.
  Chín dấu lược ở 2.4, 2.5, 2.6, 3.3, 3.4, 3.5, 3.6, 4.5, 4.7 giữ đúng MỘT `…`; 4.5 và 4.7 lược cả chuỗi duyên với 12 bước còn lại nên không viết đủ.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy; technical_integrity 9.6 vì lát này không tự chạy bốn lệnh đó. Đã tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, và mô phỏng đúng `validateSegmentMap` của `scripts/validate.ts` (tiền tố khoá, orphan, requireComplete, non-Latin) — 316/316 khoá sạch.
