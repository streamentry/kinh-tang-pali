notes: |-
  Dịch từ Pāli root đã ghim. Tầng Anh CÓ và đã đo: manifest liệt kê sutta/sn/sn35/sn35.86_translation-en-sujato.json, 34/39 khoá có chữ.
    Coverage đo được: 17/17 Pāli có nội dung có Anh = 1.0000. Không cần entry reference-gaps.
    31 khoá TRÙNG NGUYÊN VĂN — nhiều nhất trong lát — và dùng lại y nguyên phần lớn: 1.2 (14 cặp, đa số Tốt đẹp thay… quyết tâm), 6.2, 14.2, 22.2 (13 cặp), 24.3 (12 cặp), 24.4 (24 cặp), 2.2, 8.1, 16.1, 18.3, 10.2, 24.2, cùng các khoá lặp vô thường, khổ hay lạc, thưa không phải vậy, vô thường bạch Thế Tôn.
    PĀLI THẮNG Ở 16.1: bản Anh đã ghim in Is the ear … nose … tongue … body … mind …, nhưng Pāli khoá này chỉ có Jivhā (lưỡi), phần còn lại nằm sau …pe…. Dịch Lưỡi là thường hay vô thường, khớp tiền lệ sn35.105:9.1. Cùng lý do, 18.1 và 18.2 dịch theo Pāli (Jivhāviññāṇaṁ, jivhāsamphasso) chứ không theo danh sách bị lệch.
    24.1 Pāli có …pe… và …pe…, đếm được 2 dấu lược: chán ngấy cả con mắt … chán ngấy cả nhãn xúc …, bám sn35.60:1.6 và không mở rộng danh sách mà Sujato đã điền vào (sắc, nhãn thức).
    10.1 Pāli chỉ có …pe…, đếm được 1, giữ đúng một; 9.1, 15.1, 17.1 cũng vậy (…pe… tính là một dấu theo quy ước của lớp Việt).
    Công thức kallaṁ samanupassituṁ có 6 bản khác nhau trong tầng (đều 2 lần), chọn Cái gì vô thường, khổ và chịu biến đổi, có hợp lý để quán sát theo đa số; không thêm câu hỏi vào vì 6.2 đã mang dấu hỏi.
    Tầng vietnamese-current vắng, không có lớp lấp english-project. Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
