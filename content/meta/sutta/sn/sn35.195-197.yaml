notes:
  - >-
    **Mười hai bài cùng đóng `Evaṁ passaṁ … nāparaṁ itthattāyāti pajānātī`**
    nhưng khác nhau ở **thứ tự thời gian và phạm vi**: ba bài chỉ nói *vị lai*,
    hai bài chỉ nói *hiện tại*, ba bài chỉ nói đơn danh tính chất (*căn bên
    trong*), ba bài nói cả ba thời, và ba bài chuyển từ căn sang *sắc, âm thanh,
    mùi, vị, sắp xúc, pháp* (bốn mục giữa bị `…` lược). Tôi giữ đúng hình dạng
    từng bài — dùng một bảng chung sẽ **thêm** chi tiết thời gian mà Pāli không
    có.
  - >-
    `atīta`/`anāgata`/`paccuppanna` → *quá khứ / vị lai / hiện tại* theo nguyên
    văn chương 21 (đã `published`). `itthattā` → *tự thân* (0 tiền lệ ở nghĩa
    này, đặt mới; `an5.76:19.3` chỉ có trọn câu *không còn tái sanh nữa*).
  - >-
    **Quy ước dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
    `published` có `…` trong Pāli, chỉ **617** (40%) giữ đúng số, và cặp lệch
    phổ biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` → `…`). Quy tắc là
    **có/không có `…` phải khớp theo từng segment**, không phải khớp số.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng
