notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có 26 chương Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Hai tầng còn lại là Pāli root (authority) và bản Anh Bhikkhu Sujato đã ghim.
  - >-
    **Coverage tầng Anh 0,952** (21 Pāli có nội dung, 20 có chữ; trống `sn47.14:2.6`, đoạn Sujato để trống và đã được lớp `english-project` lấp) — trên ngưỡng 0,80.
  - >-
    **Bài song song trùng Pāli.** `sn47.13` và `sn47.9` có đúng ba khoá `attadīpā viharatha / Kathañcā… / Evaṁ kho…` như bài này nhưng **chưa được dịch**, nên không dùng lại được. Đã dùng `dn16:2.26.1/2/7` và `dn26:1.8/13` (đã `published`) cho cụm *tự mình làm hòn đảo, tự mình làm nơi nương tựa, không nương tựa gì khác; lấy Pháp làm hòn đảo, lấy Pháp làm nơi nương tựa, không nương tựa gì khác* — *hòn đảo* đã có 8 nơi trong kho.
  - >-
    **Sai lệch chủ ý so với `dn16`.** `dn16:2.26.4` và `:2.26.5` viết `…pe…` cho Pāli chỉ có `…pe…` — tức là **hai** dấu lược, lệch luật BRIEF_VI3 §10.1. Bài này viết **một** `…` ở `:3.3` và `:3.4`, không chép lỗi đó.
  - >-
    **Tiền lệ dùng lại, đếm được.** `:2.1` (1, nguyên văn) · `:2.12 :2.16` *Không có khả năng ấy* (4) · `:3.2` *sống quán thân trên thân, tinh cần, tỉnh giác, có niệm, xa lìa tham lam và buồn phiền nơi đời* (8, chọn nhóm nhiều nhất) · `:3.5` *sống quán pháp trên các pháp…* (9) · `:3.3 :3.4` *sống quán thọ trên các cảm thọ …* / *sống quán tâm trên tâm …* (17) · `:3.8` *Thứ tư.* (134).
  - >-
    **0 tiền lệ, đặt mới.** `sāvakayuga` → *đôi đệ tử ưu tú* (*đôi đệ tử* có 13) · `acchariyaṁ / abbhutaṁ` → *thật kỳ lạ, thật chưa từng có* (theo `mn50:11.4`) · `soko vā paridevo vā` → *buồn khóc* · `palokadhamma` → *chịu sự hao mòn* (theo `sn35.84:0.3` *Kinh Pháp Hao Mòn*) · `sāravato` → *có lõi chắc* (*lõi* 243) · `sikkhākāmā` → *ham muốn học tập*.
  - >-
    **Bất định đã ghi, không giấu.** `etapparamaṁyeva sāvakayugaṁ` nghĩa là *đôi đệ tử ưu tú thì chỉ có từng đôi như thế là hơn*, không phải *chỉ có một đôi*; bản Việt giữ *cũng chỉ có đôi đệ tử ưu tú* để không khẳng định quá tay. `anapekkhā tassaṁ disāyaṁ` để *không quan tâm đến vùng đất nào*, giữ `yassaṁ disāyaṁ` (vùng đất mà Ngài trú), không nới thành *chỗ nào*. `tamatagge mete` (*đứng vào hàng tốt nhất trong hàng tốt nhất*) để *những người tốt nhất trong những người tốt nhất*.
  - >-
    **Tiêu đề và địa danh.** `Ukkacelasutta` → *Kinh Ukkacelā* (giữ tên riêng như `sn47.16:0.3` *Kinh Uttiya*, `sn47.15:0.3` *Kinh Bāhiya*; `Ukkacelā` đã có trong kho qua `mn34:1.2`). `Nālandavagga` → *2. Phẩm Nālanda* (4, chọn theo đa số trong sn47 thay vì *Nāḷanda* 2). `vajjīsu` → *dân Vajji* và `sông Ganges` lấy nguyên văn câu `mn34:1.2` — cùng địa điểm, cùng cấu trúc câu.
  - >-
    **Khác kho, có chủ ý — số đếm.** `Saṁyutta Nikāya` → *Tương Ưng Bộ* (xem `sn35.105`).
  - >-
    `technical_integrity` 9.6 vì bốn lệnh cổng **do coordinator chạy**, lát này đã tự kiểm mọi thứ còn lại bằng `_hvi.kiểm` (NFC, dấu lược khớp từng khoá, nháy kép cân trên cả bài, không Pāli lọt): `npm run validate` · `npm test` · `npm run check` · `npm run build`.
