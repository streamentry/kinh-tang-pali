    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Có tiền lệ: `Nīvaraṇavagga` → *4. Phẩm Chướng Ngại* (`sn46.31`, 4 bài) · `Pabbatavagga` → *1. Phẩm Núi* (`sn46.10`) · `Sīlaṭṭhitivagga` → *3. Phẩm Giới Và Trú* (`sn47.27/28`, 2 bài) · `Jarāvagga` (Sn 48) → *5. Phẩm Già* (`sn48.47/48`) · `Sūkarakhatavagga` → *6. Phẩm Núi Khỉ* (`sn48.59`) · `Cāpālavagga` → *1. Phẩm Lá Câu* (`sn51.1`, 4 bài) · `Pāsādakampanavagga` → *2. Phẩm Vui Vẻ* (`sn51.18`) · `Dutiyavagga` → *2. Phẩm Thứ Hai* (`sn11.11` v.v., 76 bài) · `Oghavagga` → *Phẩm Bộc Lưu* (Sn 49 `sn49.45-54`, 2 bài) — **lưu ý** Sn 45 dùng *Phẩm Dây Xích* (9 bài), Sn 46 *Phẩm Dòng Chảy* (1), Sn 48 *Phẩm Bộc Lưu* (1): năm bài `sn47.95-104`, `sn51.77-86`, `sn53.45-54` theo *Bộc Lưu* vì đó là cách đã có tiền lệ cho `ogha`; **người biên tập nên thống nhất toàn bộ Sn 45–49.** · `Puññābhisandavagga` → *4. Phẩm Gặp Gác Công Đức* (`sn55.38`) · `Ekadhammavagga` → *1. Phẩm Một Pháp* (`sn54.2`) · `Rahogatavagga` → *1. Phẩm Ở Riêng* (`sn52.6`) · `Abhisamayavagga` (Sn 56) → *6. Phẩm Chứng Ngộ* (5 bài). **Hai chỗ điểm hoà phải ghi rõ:** `Veḷudvāravagga` — `sn55.2` ghi *1. Phẩm Cổng Tre*, `sn55.9` ghi *1. Phẩm Veḷudvāra*; bài này theo *Veḷudvāra* vì giữ địa danh Pāli như *Devadaha*/*Jambukhādaka*. `Aññatitthiyapeyyālavagga` 0 tiền lệ → *5. Phẩm Chuỗi Lặp Lời Dạy Khác Nhau*.
  - >-
    0 tiền lệ, đặt mới, ghi kèm lý do: `Paṭhamasāriputtasutta` → *Kinh Sāriputta (Nhất)* (0 tiền lệ vì `sn55.5` chưa dịch) · `sotāpannā avinipātadhammā niyatā sambodhiparāyaṇā` → *học trò có đặc tính không bị thoái lui, nhất hướng về giác ngộ, hướng về bờ bến kia* (0 tiền lệ trong kho; `avinipāta` = không thoái lui / không đổi hướng, `niyatā` = nhất hướng, `parāyana` → *bờ bến kia* theo quyết định ở `sn43.44`) · `ariyakantehi sīlehi akhaṇḍehi` → *các điềi lành cao quý không đập phá* (0 tiền lệ; `akhaṇḍa` = không đập vỡ) · `dhammānaṁ samannāgamanahetu` → *là lý do, là hiện tượng*.
  - >-
    Dùng lại nguyên văn đã `published`: `itipi so bhagavā …pe… satthā devamanussānaṁ buddho bhagavāti` → *rằng Đức Thế Tôn ấy … Đạo Sư chư thiên và người, bậc Giác ngộ, bậc Đáng Kính* (nguyên văn `sn55.14/16/44/46*` — **cùng Sn 55**, đây là khuôn lặp lại suốt phẩm) · `buddhe aveccappasādena samannāgato hoti` → *có đức tin đối với Phật* · `dhamme …pe… / saṅghe …pe…` → *với các pháp … / với Tăng …*.
  - >-
    Lượt review đối kháng: `2.3` nháp có **hai** dấu `…` trong khi Pāli chỉ có một (`itipi so bhagavā …pe… satthā…`); tiền lệ `sn55.16:1.4*` chỉ giữ dấu `…` ở giữa. Đã bỏ dấu `…` thừa ở cuối. Cùng lỗi này lặp ở `sn55.34:2.3` và `2.2` của `sn55.32/33` — đã kiểm cả ba.
  - >-
    Bất định đã ghi: tên phẩm `Veḷudvāravagga` **điểm hoà 1–1** — `sn55.2` ghi *1. Phẩm Cổng Tre*, `sn55.9` ghi *1. Phẩm Veḷudvāra*. Bài này theo *Veḷudvāra* vì giữ địa danh Pāli như *Devadaha*/*Jambukhādaka*/*Gandhabba*. **Người biên tập nên chọn một.**
