notes: |-
      **⚠ QUYẾT ĐỊNH TÊN — cần người biên tập xác nhận.** `Caṇḍasutta`: `Caṇḍa` vừa là **tên
      riêng** của thôn trưởng, vừa là **danh từ tính từ** mà cả bài dùng
      (`caṇḍotveva saṅkhaṁ gacchati` = *được coi là đúng là dữ tính*). Tôi dịch **cả hai
      theo nghĩa là *Dữ Tính***, vì (a) Sujato cũng vậy (`Fury the chief`) và (b) bài kinh
      dựng toàn bộ trên chơi chữ này — giữ tên riêng Pāli `Caṇḍa` sẽ phá chơi chữ. **Lệch với
      tiền lệ kho**: `sn42.10` giữ tên Pāli cho thôn trưởng (*thôn trưởng Maṇicūḷaka*). Người biên
      tập xem có muốn đổi sang *thôn trưởng Caṇḍa* không. `sorato` → *hiền hòa* (tiền lệ
      `snp3.6.44.4`).
      **DÙNG LẠI NGUYÊN VĂN — 7 khoá Pāli trùng nguyên văn:** `1.1` = `sn1.10:1.1` (*Tại Sāvatthī*,
      30+ bài) · `3.2` = `sn3.1:14.2` · `3.3` = `sn3.1:14.3` (nguyên văn 226 ký tự, có
      `cakkhumanto rūpāni dakkhantī`) · `3.4` = `sn3.1:14.4` (*Con xin quy y Đức Phật, quy y Pháp,
      quy y chúng Tỷ-kheo*) · `3.5` = `mn54.26.4` (*Từ hôm nay cho đến trọn đời, xin Thế Tôn ghi
      nhận con là một nam cư sĩ đã quy y*) · `0.2` = `sn42.10:0.2` (*1. Phẩm Làng*) ·
      `3.6` = `sn12.21:1.16` (*Thứ nhất*).
      **Thuật ngữ khác, kèm đếm:** `gāmaṇi` → *thôn trưởng* (`sn42.10` đã publish, dùng 4 lần
      trong bài này) · `appahīno`/`pahīno` → *chưa từ bỏ / đã từ bỏ* · `paccayo` → *hoàn cảnh*
      (0 tiền lệ riêng cho cặp `hetu … paccayo`; đối xứng với *nguyên nhân*) ·
      `kopaṁ pātukaroti` → *để lộ sự giận dữ ra* (`an4.197:6.2` dùng *phô bày sự giận dữ* cho
      `kopaṁ pātukaroti`) · `sotāpanno` không có ở bài này.
      **0 tiền lệ, đặt mới:** `otveva saṅkhaṁ gacchati` → *được coi là đúng là …* (0 tiền lệ;
      Pāli là tautology **cố ý** nhấn rằng nhãn dán đúng như thật; tôi giữ tautology bằng
      *đúng là* và **không** thêm mệnh đề nhân quả nào ngoài segment). Đây là lý do
      `vietnamese_clarity` 9.2 và `grammar_logic` 9.2: đọc tiếng Việt vẫn gượng, nhưng đó là
      gượng **có nguồn**.
      **Tầng Anh đủ 100%** (18/18), nên `triangulation` 9.3. **Không đối chiếu được tầng Việt
      hiện hành** (bilara ở commit đã ghim chỉ có Pháp Cú cho tiếng Việt).
      **technical_integrity = 9.6** vì bốn cổng kỹ thuật do coordinator chạy, tôi không được chạy (`npm run validate|test|check|build` bị cấm trong lát này): (1) `npm run validate` (qua `npm run build`) — kiểm metadata, scorecard, `blocking_errors` và nội dung; (2) `npm test` — unit tests; (3) `npm run check`; (4) `npm run build`. Ngoài ra `npm run reference:gaps:check` phải xanh sau khi chạy lại `npm run reference:gaps`.
