notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh của Bhikkhu Sujato và bản nguyên bài tiếng Việt của Hòa thượng Thích Minh Châu (Bình Anson hiệu đính) ở mục Tra cứu toàn văn. Bản nguyên bài chỉ để tra thuật ngữ và cấu trúc, không sao chép; tầng Việt hiện hành phân đoạn vắng ở bài này.
  Coverage English đo thật: 24/41 khoá Pāli có nội dung (từ 40 ký tự, bỏ khối 0) có chữ Anh của Sujato = 58,5%, dưới ngưỡng 0,8. 17 khoá không có chữ Anh: 4.2, 4.4, 6.1 (lặp 1.3, 3.1, 3.2) và 11.2-11.6, 12.1-12.9 (Sujato chỉ ghi chú Đức Phật lặp lại lời Sāriputta, để trống). Cả 17 khoá đều trùng nguyên văn Pāli với khoá đã có chữ Anh trong cùng bài (13 nhóm Pāli trùng, 43 cặp, 0 cặp bản Việt khác nhau), nên nội dung có đối chiếu gián tiếp; nhưng đó chưa phải là đọc English độc lập. Chưa có entry của bài này trong danh sách gap, và lớp lấp English của dự án chưa có. Vì dưới ngưỡng nên bài giữ draft chứ không publish; người biên tập chạy `npm run reference:gaps` rồi quyết định nâng trạng thái.
  Tiền lệ dùng lại nguyên văn: 8/8 khoá có Pāli trùng ở nơi khác trong tầng đều dùng lại bản Việt đã có, 0 khoá khác: 0.2 theo 7 nơi (4. Phẩm Kaḷāra), 1.1, 1.2 (3 nơi), 14.2 (302/304 là Thứ nhất), và 2.3, 5.3, 9.3, 13.3 theo snp5.2:7.3 (Xin Ngài, bậc minh mẫn, nói cho con). Công thức bhūtamidaṁ, tadāhārasambhavaṁ, tadāhāranirodhā theo mn38 (9 đến 13): cái này đã sinh khởi; cái này sinh do cái kia làm điều kiện nuôi dưỡng; khi điều kiện nuôi dưỡng ấy chấm dứt thì cái đã sinh khởi có bản chất chấm dứt; yathābhūtaṁ sammappaññāya passati là thấy đúng như thật bằng chánh trí.
  Kệ Ajita: 2.1 dùng lại Những người đã liễu tri pháp (snp5.2:7.1, Pāli Ye ca saṅkhātadhammāse trùng). 2.2 khác snp5.2:7.2 có chủ ý: Pāli đây là sekkhā (snp là sekhā), và vì thân bài gọi sekkho là bậc hữu học (tầng 12 khoá dùng hữu học, trong đó 7 khoá là bậc hữu học; 0 dạng khác cho sekkha trong văn xuôi) nên dịch hạng hữu học để người đọc nối được kệ với lời giảng; snp5.2 dịch là hạng người còn học tập. 2.4 theo snp5.2:7.4 (Pāli khác nhau chỉ ở dấu).
  pārāyane ajitapañhe dịch Đường Đến Bờ Bên Kia, phần Câu Hỏi Của Ajita (Đường Đến Bờ Bên Kia ở an6.61; Câu Hỏi Của Puṇṇaka ở an3.32, an4.41). Không thêm nháy đơn quanh tên vì Pāli các khoá 1.3, 4.4, 8.9, 12.9 không có nháy đơn tại đó.
  nibbidāya virāgāya nirodhāya dịch nhàm chán, ly tham, đoạn diệt, và nibbidā virāgā nirodhā anupādā vimutto theo sn22.58 (nhờ sự nhàm chán, ly tham, đoạn diệt đối với..., không chấp thủ mà được giải thoát). Đếm: dạng nibbidā virāgā nirodhā anupādā vimutto toàn tầng 7 khoá đều nhàm chán, 0 khoá chán nản; dạng nibbidāya virāgāya nirodhāya toàn tầng nhàm chán 20 khoá và chán nản 30 khoá (30 khoá chán nản tập trung ở cụm sn35.10 đến 35.12), chọn nhàm chán theo sn35.155 và mn60 là phạm vi gần nhất.
  tuṇhī ahosi dịch im lặng (tầng 30 khoá im lặng, 7 khoá giữ im lặng; sn44.10, an6.29 cùng dạng). Evaṁ vutte dịch Nghe vậy (97 trong 487 khoá, dạng nhiều nhất). Sādhu sādhu, sāriputta dịch Lành thay, lành thay, này Sāriputta (12 khoá ở sn và an, so với 9 khoá Tốt lắm ở mn).
  Dấu lược: 4.1 có …pe… giữ đúng một … (đo cân bằng với Pāli từng khoá). Nháy đơn và nháy kép khớp Pāli từng khoá (66/66 khoá, 0 lệch). 12.7 Pāli viết sammappaññā disvā (thiếu āya so với 8.7 sammappaññāya); đây là biến thể chính tả của Pāli, bản Việt vẫn dịch cùng nghĩa bằng chánh trí.
  Bất định đã phân xử (ghi ở đây, không thêm vào thân kinh): (1) 7.5, 8.5, 11.4, 12.5 āhārasambhavassa dịch cái sinh do điều kiện nuôi dưỡng, theo song song với tadāhārasambhavaṁ ở khoá liền trước và công thức mn38. Sujato dịch the fuel for its origination, tức đọc đối tượng của nhàm chán là chính điều kiện nuôi dưỡng chứ không phải cái sinh từ nó. Hai cách đọc cùng khả thể về ngữ pháp; cách chọn giữ đối tượng là cái sinh ra, trùng cách hiểu của Hòa thượng Thích Minh Châu (sự tục sanh do một loại đồ ăn). Người biên tập nên kiểm. (2) tad trong tadāhāra dịch cái kia theo mn38, không giải thích thêm. (3) saṅkhātadhammo dịch bậc đã liễu tri pháp theo kệ snp5.2:7.1; Sujato dịch has appraised the teaching; không có tiền lệ nơi nào khác trong prose.
  Số Pāli: bài không có số lượng. Tiêu đề Bhūtasutta dịch Kinh Cái Đã Sinh Khởi (Sujato: What Has Come to Be), đặt mới vì 0 tiền lệ.
  Lượt review đối kháng: in cặp Pāli với Việt cả 66 khoá để đọc; bắt được 2 chỗ lệch tiền lệ vùng gần (tuṇhī ahosi dịch giữ im lặng thay vì im lặng; Sādhu sādhu dịch Tốt lắm thay vì Lành thay), đã sửa theo đếm.
