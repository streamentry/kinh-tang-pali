notes: |-
  Dịch từ Pāli root, đối chiếu tầng Anh đã ghim ở mức từng segment, đối chiếu bản song song sn12.15 (cùng đoạn Kaccānagotta) và bản Việt hiện hành nguyên bài của Hòa thượng Thích Minh Châu (chỉ để tra cứu thuật ngữ và cách hiểu, không phải tầng theo segment).

  **Trạng thái `draft`, kèm blocker — vì sao.** Coverage Anh của bản Sujato đã ghim chỉ **27/41 = 0,6585**, dưới ngưỡng 0,80 của `source/layers.yaml`. Công thức: mẫu số = segment Pāli có nội dung (≥ 40 ký tự, loại khối `:0`) = **41**. Sujato để trống **14** khoá có nội dung: 3.11, 5.1, 5.2, 5.4, 5.5, 5.13, 6.4, 6.8, 6.9, 6.14, 7.2, 7.3, 7.4, 7.7 (cùng các khoá ngắn 3.3–3.10, 5.7–5.12, 6.3, 6.5–6.7, 7.1, 7.5–7.6 nằm ngoài mẫu số). Lớp lấp `english-project` của chính dự án (trạng thái `published`) phủ đúng 14 khoá đó nên **cổng tính cả hai tầng là 41/41 = 1,0000**; nhưng lớp lấp do cùng một dự án viết, **không phải một lần đọc Anh độc lập**, nên theo quy tắc của lát này, độ phủ độc lập 0,6585 < 0,80 giữ bài ở `draft` giống sn22.7. `reference-gaps.yaml` có entry cũng không cứu được `published`. Tầng `vietnamese-current` ở bilara đã ghim chỉ có Pháp Cú, nên bài này không có tầng Việt theo segment — đó là giới hạn của ảnh chụp upstream, không phải thiếu sót của kho. `triangulation` đặt 8,0: 27/41 khoá có nội dung được đối chiếu Anh đã xuất bản; 14 khoá còn lại chỉ có bản lấp của dự án, bản Việt hiện hành nguyên bài (cùng người dịch cho cả tập SN) và các bản song song sn12.15, sn35.116, sn22.83 làm chứng cứ phụ. Khi Sujato được bổ sung hoặc người biên tập chấp nhận lớp lấp như tầng đối chiếu, blocker này gỡ được mà không phải dịch lại.

  **Tầng Anh đã ghim ở đúng bài này: đáng tin về nghĩa, có hai chỗ lệch Pāli.** Ở 4.5 Sujato viết thêm `told him what had happened` — Pāli chỉ có `sammodi …pe… ekamantaṁ nisinno … etadavoca`, không có vế đó; bản Việt chỉ có chào hỏi rồi `…`. Ở 8.1 Sujato dịch `I'm already delighted` (số ít) cho `mayaṁ … attamanā` (số nhiều); bản Việt giữ *chúng tôi*, số nhiều của Pāli. Sujato gộp 7.5–7.7 vào khoá 7.5; Pāli có ba khoá, bản Việt dịch đủ ba.

  **Pāli trùng nguyên văn ở nơi khác trong tầng: 32 khoá, 991 cặp; dùng lại y nguyên văn 833 cặp, 158 cặp bản Việt khác.** Chọn theo đa số của từng khoá, và chỗ khác đều có lý do:
    - `0.2` *9. Phẩm Các Vị Trưởng Lão* **21/23** (so với *Phẩm Trưởng Lão* 2); `0.3` *Kinh Channa* 2/2; `1.1` dùng lại bản duy nhất (1/1); `10.3` *Thứ tám.* **266/271** (tiền lệ sn: 117/120).
    - `2.9`/`3.4`/`3.8`/`5.8`/`6.5` *tưởng …* **49/56** (cảm thọ/Tưởng viết hoa 7 cặp khác); `2.10`/`3.5`/`3.9`/`5.9`/`6.6` *các hành …* **48/57**; `2.11`/`3.10`/`5.12`/`6.7` *thức là vô ngã.* 2/2; `3.11`/`5.13`/`6.8` *Tất cả các hành là vô thường; tất cả các pháp là vô ngã.’* 2/2.
    - `2.6` *thức là vô thường.*: tầng có 4 cặp, 1 viết thường (sn22.15:1.12) và 3 viết hoa (sn22.45, 22.46, 22.76). Đã chọn viết thường vì ở đây 2.6 là vế cuối của một câu liệt kê nối bằng `;` (2.2–2.6), khác với ba bài kia mở câu mới — nên khác một cặp là có chủ ý.
    - `6.1`/`7.1` (11 cặp, 4 dạng Việt khác nhau): *Ta từng có điều này, này hiền giả* 7 (sn40.2–40.9, cùng một chuỗi bài, lời Tôn giả Mahāmoggallāna), *Này hiền giả, khi ấy tôi nghĩ* 2 (sn19.1, sn19.21), 2 dạng khác (sn21.2, sn40.1). Đã chọn dạng *Này hiền giả, khi ấy tôi nghĩ*: Tôn giả Channa kể với Tôn giả Ānanda bằng *tôi*, cùng kiểu một tỳ-kheo kể với bạn đồng phạm hạnh như ở sn19.1; `Tassa mayhaṁ` = *khi ấy, với tôi*, và *Ta* trong chuỗi sn40 là cách xưng của Tôn giả Mahāmoggallāna, không phải của Channa.
    - `9.9` dùng lại sn12.15:2.7 y nguyên (1/1). `9.13` (1 cặp, mang thêm *này các tỳ-kheo* mà Pāli của bài này không có, nên không dùng lại), `9.16` (1 cặp, sn12.15:3.7 có `;` còn đây là `…pe…`).
    - `9.14`, `9.15`, `9.17` (18, 34, 16 cặp): `9.15` *như vậy là sự tập khởi của toàn bộ khối khổ đau này.* 15/34; `9.17` *…khối khổ đau này.”* 3/16, còn *này”.* (dấu nháy trước chấm) 4/16 — chọn dạng *này.”*: cho cùng một chuỗi chữ thì 3 so với 4, nhưng tính mọi biến thể thì dấu chấm đứng trước nháy đóng là **11/16** so với 4/16; `9.14` *do hành làm duyên nên có thức …* 2/18, trong khi *do duyên hành mà có thức …* 6/18 — đo cả hai nhóm: họ *làm duyên nên có* 8 so với *do duyên X mà có* 7 trên 27 cặp (`saṅkhārapaccayā viññāṇaṁ`), và họ *do duyên … mà có* 11 so với *làm duyên nên có* 8 trên 27 cặp (`avijjāpaccayā saṅkhārā`). Hai họ ngang nhau (đa số hẹp), nên chọn theo **bản song song gần nhất** sn12.15:3.4–3.5 (cùng người nói, cùng đoạn Pāli): *do vô minh làm duyên nên có các hành; do hành làm duyên nên có thức …*. Đây là lựa chọn nhất quán trong nội bộ bài, không phải đa số tầng.
    - Pāli trùng **trong chính bài**: 13 nhóm, 0 nhóm bản Việt khác nhau (các nhóm như `3.12`/`6.9`, `3.13`–`3.16`/`6.10`–`6.13`, `3.1`/`4.1`, `6.1`/`7.1`).

  **Số Pāli.** Chỉ có `Aṭṭhamaṁ` (8) → *Thứ tám* (tiền lệ 117/120 trong sn); `ekamantaṁ` → *một bên*; `dutiyo anto` → *cực đoan thứ hai* (và `ayameko anto` → *một cực đoan*, `ubho ante` → *cả hai*; không phép tính nào ngoài các số đếm đơn). Phép đo máy số Pāli của tầng không có từ khoá số ghép nào trong bài này nên **không đo được gì cho sn22.90**; mọi số ở đây tự tính.

  **Thuật ngữ — đếm trước khi chốt.**
    - `āvuso` → *hiền giả*: **3.807/4.304** khoá chứa chữ này (sn22: 129/130); `āyasmā ānando` → *Tôn giả Ānanda*: **496/498**. Channa và Ānanda ngang hàng nên xưng *tôi*/*hiền giả*; Ānanda với *mayaṁ* dịch *chúng tôi*.
    - `therā bhikkhū` → *các vị trưởng lão tỳ-kheo*: **73/86**; `ghositārāme` → *tu viện Ghosita*: **20/30**; `satthu ceva saṁvaṇṇito sambhāvito ca viññūnaṁ sabrahmacārīnaṁ` → *được bậc Đạo Sư khen ngợi, lại được các bạn đồng phạm hạnh bậc trí kính trọng*: dùng lại đúng cấu tạo của sn35.116/117 (19 khoá, 15 chứa *đồng phạm hạnh*).
    - `avāpuraṇaṁ ādāya vihārena vihāraṁ` → *cầm chìa khóa, đi từ tịnh xá này đến tịnh xá khác*: **3/3** (an9.11, mn124 hai khoá). `paṭisallānā vuṭṭhito` với chủ ngữ `āyasmā X`: *độc cư* **13**, *thiền tịnh* **11**, *tịnh cư* 6, trên 40 khoá — đa số hẹp, chọn *từ chỗ độc cư đứng dậy*. `senāsanaṁ saṁsāmetvā`: *thu dọn chỗ ở* **11**, *thu xếp chỗ ở* 4, trên 15 khoá (cả tầng); riêng gần nhất sn41.3/41.4 thì ngược lại (*thu xếp*), đã chọn theo cả tầng.
    - `dhammiṁ kathaṁ` → *pháp thoại* (sn16.6, 16.7, 16.8: *thuyết pháp thoại*); `ovadati` → *khuyên dạy*, `anusāsati` → *chỉ dạy* (sn22.83:2.2 *ovādena ovadati* → *dạy bằng lời khuyên*; `anusāsati` trong tầng có nhiều dạng *dạy dỗ/dạy bảo*, nên chọn *chỉ dạy* để phân biệt hai động từ đi đôi).
    - `taṇhākkhaye` → *sự tận diệt khát ái* (**taṇhākkhaya** đo 6 khoá trong tầng, *khát ái* 5/6); công thức `sabbasaṅkhārasamatho sabbūpadhipaṭinissaggo taṇhakkhayo virāgo nirodho nibbānaṁ` → *sự lắng dịu của mọi hành, sự buông bỏ mọi sanh y, sự tận diệt khát ái, sự ly tham, sự diệt, Niết-bàn* đúng 8/27 khoá có công thức (dạng thường gặp nhất).
    - `cittaṁ na pakkhandati nappasīdati na santiṭṭhati nādhimuccati` → *không hướng đến, không tịnh tín, không an trú, không quyết định*. Chỉ có **5** khoá trong tầng chứa đủ cả bốn động từ: `nādhimuccati` → *không quyết định* **5/5**; `nappasīdati` → *không tịnh tín* 1 / *không tin sạch* 4; `na pakkhandati` → *không phóng thích* 4 / *không nhảy vào* 1, trong khi ở công thức gần (20 khoá) `na pakkhandati` thường là *không hướng đến*. Đã chọn *hướng đến* và *tịnh tín* (dạng thường gặp nhất ở công thức gần) và *quyết định* (5/5).
    - `upayupādānā cetaso adhiṭṭhānābhinivesānusayā` → *cầu cạnh, chấp thủ, trú lập của tâm, ám ảnh, thiên hướng*: **9/11** khoá cùng công thức (sn22.3, 22.112…), 2 khoá (sn22.4) dùng *hướng đến, chấp thủ, an trú của tâm, chấp trước, tùy miên*. Đã chọn dạng 9/11. Ở 9.5 chỉ dịch thành *cầu cạnh, chấp thủ và ám ảnh* vì Pāli ở đây nối `upayupādānābhinivesa-` thành một từ ghép với `vinibandho`.
    - `attā me` → *Đây là tự ngã của tôi* (theo sn12.15:2.5, cùng đoạn Pāli); `viññāṇaṁ` → *thức*, `saṅkhārā` → *các hành*, `vedanā` → *thọ*: theo sn22.83/22.88 cùng phẩm.

  **Bất định đã ghi, không giấu, không thêm vào thân kinh.**
    - **`3.13`/`6.10` `paritassanā upādānaṁ uppajjati`.** Sujato và Hòa thượng Thích Minh Châu đều đọc nhân quả (*vì lo âu/tham luyến, chấp thủ khởi lên*). Pāli chỉ đặt hai danh từ cạnh nhau, không có từ nối nhân quả; đã dịch *Lo âu, chấp thủ khởi lên;* — có thể đọc là hai việc cùng khởi hoặc việc này khởi theo việc kia, đúng mức bất định của Pāli. `paritassanā` → *lo âu*, theo sn22.7 (*upādāparitassanā* → *lo âu do chấp thủ*). Đây là lý do `ambiguity_integrity` ở 9,2.
    - **`8.1` `api nāma taṁ āyasmā channo āvi akāsi khīlaṁ chindi`.** `āvi akāsi` đã dịch *bộc lộ*, `khīlaṁ chindi` dịch *chặt đứt sự chai cứng*; `khīla` nguyên nghĩa *cọc, vật cứng*; tầng có 52 khoá chứa nhóm từ `cetokhila`/`khīla` đa số dịch *tâm chai cứng/tâm hoang vu*, nhưng ở đây không có `ceto-`, nên không thêm chữ *tâm* vào thân kinh. Sujato: `severed your hard-heartedness`; Hòa thượng Thích Minh Châu: *phá vỡ chướng ngại*. `api nāma` đã dịch *Mong rằng*.
    - **`4.3`/`7.3` `tāvatikā vissaṭṭhi`** đã dịch *sự tin cậy đến mức ấy*. `vissaṭṭhi` không có tiền lệ nào trong tầng (đếm = 0) và Sujato dịch `so much trust`, Hòa thượng Thích Minh Châu *lòng tin tưởng*; chưa xác định được từ nguyên chắc chắn, nên chọn nghĩa ít giả định nhất.
    - **`3.16`/`6.13` `Na kho panevaṁ dhammaṁ passato hoti`** đã dịch *Người thấy pháp thì không như vậy* theo Sujato (*that doesn't happen for someone who sees the teaching*); Hòa thượng Thích Minh Châu đảo thành *như vậy thời ta không thể thấy pháp* — hai cách là phản đề của nhau, Pāli nghiêng về cách đầu.
    - **`9.2` `dvayanissito`.** Bản song song sn12.15:2.1 dịch *nương tựa vào hai cực đoan*; ở bài này Pāli dùng `dvaya` (cặp đôi) ở 9.2 và chỉ đến 9.10–9.11 mới dùng `anto` (cực đoan). Đã dịch *hai điều: có và không có* và giữ *cực đoan* cho 9.10–9.12. Khác sn12.15 đúng một chỗ này (1 cặp).
    - **`10.1` `Evametaṁ … hoti yesaṁ āyasmantānaṁ tādisā sabrahmacārayo …`** đã đọc *việc này là như vậy đối với những vị Tôn giả có các bạn đồng phạm hạnh như thế*; `sabrahmacārayo` là dạng số nhiều lạ của tầng Pāli, giữ nghĩa số nhiều.
    - **`10.2` `dhammo abhisamito`** dịch *đã hiểu rõ pháp*, theo cấu tạo của sn22.83:4.14, bỏ chữ *bài pháp* vì ở bài này `dhamma` là *pháp* (như `dhammaṁ passeyyaṁ` → *thấy pháp*); Pāli không nói đã chứng quả nào, nên bản Việt không thêm.
    - **Dấu nháy của tầng Pāli có chỗ rơi lệch** và bản Việt bám đúng Pāli từng khoá, không tự cân: `6.2` mở `‘` rồi `6.8` đã đóng `’ti`, nhưng `6.9`–`6.14` vẫn nằm trong lời nghĩ (và `6.14` kết bằng `passeyyanti` không có `’`); `9.2`–`9.5` và `9.13`–`9.16` không có `‘` dù lời Đức Phật là trích dẫn lồng; `9.10`–`9.11` có `iti` nhưng không có dấu nháy (dịch *Cho rằng tất cả là có/không có*, không thêm nháy).
    - **`9.5`** Pāli kết không dấu câu (`yebhuyyena` rồi sang 9.6) — bản song song sn12.15:2.4 có dấu chấm; đã đóng câu bằng dấu chấm vì ý đã trọn.
    - **`3.17`/`6.14`** `deseyya` (optative) dịch *có thể thuyết pháp*, không phải *sẽ*.

  **Dấu lược và nháy.** `…` khớp Pāli từng khoá: 20/20 khoá có `…` hoặc `…pe…` giữ đúng số `…` (kể cả 4.5, 5.11, 6.3, 9.14, 9.16 là `…pe…` → đúng một `…`); không khoá nào có `(…)`; không `…` thừa. Nháy đơn `‘’` và ngoặc kép `“”` khớp Pāli từng khoá: 0/100 lệch (mẫu số 100).

  **Phép kiểm đã chạy, có mẫu số.** Tập khoá Việt = tập khoá Pāli: 100/100, thứ tự khoá trùng thứ tự Pāli. NFC, khoảng trắng thừa, khoá rỗng: 0 lỗi (mẫu số 100). Pāli lọt sang Việt: ngoài tên riêng (Channa, Ānanda, Kosambī, Ghosita, Bārāṇasī, Isipatana, Kaccāna, Kaccānagotta) và nhãn `Saṁyutta Nikāya 22.90`, không có. Pāli trùng nguyên văn trong chính bài: 13 nhóm, 0 nhóm khác nhau.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`, và `npm run build` nếu bài lên `published`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
