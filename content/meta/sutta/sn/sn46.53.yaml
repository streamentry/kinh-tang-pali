  - >-
    **Tầng Anh đã ghim — đã so lỗi ở đúng bài này, không tìm thấy lỗi nào.**
    Bốn lớp lỗi đã xảy ra ở các bài khác của đợt này, đo tại `sn46.53`:
    (1) **mở rộng dấu lược** — Pāli của bài này có **0** khoá chứa `…`,
    `…pe…`, `(…)` hay ASCII `...`; tầng Anh cũng **0** ⇒ không có chỗ nào
    để mở rộng. (2) **tự thêm nháy** — kiểm chéo thô báo Anh có **20** dấu
    `’` mà Pāli không có, nhưng **21/21** đều là dấu **possessive tiếng Anh**
    (`they’re`, `it’s`, `don’t`); phép đếm lại có loại `’` đứng giữa hai chữ
    cái cho **0 lệch / 54 khoá**. Ngoài ra Pāli và Anh đều có đúng 9 cặp
    `“”` và 1 cặp `‘’` ⇒ không thêm, không bớt. (3) **đảo thứ tự danh sách** —
    `passaddhi, samādhi, upekkhā` và `dhammavicaya, vīriya, pīti` giữ đúng thứ
    tự trong Anh (*tranquility, immersion, equanimity* / *investigation,
    energy, rapture*), **0** lần đảo. (4) **dịch sai quan hệ từ** — `udaka-vāta`
    → *spray it with water*, `mukha-vāta` → *blow on it*, `na ca paṁsukena
    okireyya` → *don’t scatter dirt* đều khớp; `duvūpasamayaṁ/suvūpasamayaṁ`
    → *hard/easy to settle* khớp. **Một chỗ Anh làm mờ đi Pāli, đã theo Pāli:**
    `allāni ca gomayāni` / `allāni ca kaṭṭhāni` — Anh chỉ dịch *cow-dung* và
    *timber*, **bỏ** mạo từ ướt ở hai món còn lại; bản Việt giữ *"phân bò ướt,
    củi ướt"*.
  - >-
    **Bài này là bản lặp nguyên văn của `mn13` (Mahādukkhakkhandhasutta), và
    `mn13` đã `published`.** Đo được **18/54** khoá của `sn46.53` trùng byte
    với một khoá nào đó của bài khác trong `sn`. Bốn khoá **dùng lại nguyên
    văn** bản dịch đã có, vì cùng một đoạn văn thì phải dịch một lần:
    `1.1` (công thức mở đầu, tiền lệ đồng nhất **4/4** ở `sn3.9/3.10/3.14/3.15`),
    `2.1`·`2.4`·`2.6` (từ `mn13:6.1/6.5/6.7`), `3.1` (từ `mn13:6.8`; Pāli hai
    bên chỉ khác **một dấu phẩy** trước `ito vā pana sutvā`, nên vẫn là cùng
    câu). **Sửa đúng một chỗ khi dùng lại:** `2.1` — Pāli mở bằng `“` còn bản
    dùng lại mở bằng `‘`, nên đã đổi về `“` cho khớp Pāli. **Hai điểm dùng
    lại mà phải ghi lại:** `2.6` bản dùng lại **không** có `bhikkhave` ("này
    các tỳ-kheo") mà Pāli có, và `3.1` có `Māra` — cả hai đều giữ nguyên văn
    bản đã `published` để hai bài không tự mâu thuẫn, vì đây là **cùng một
    câu**. `2.1` cũng dịch `evamassu vacanīyā` là *"nên hỏi họ"* trong khi
    Anh đọc là *say*; giữ nguyên văn `mn13` vì hai khoá kế tiếp (`2.2`–`2.3`)
    đúng là câu hỏi và `2.4` là *"Bị hỏi như vậy"*.
  - >-
    **Tên phẩm và tên kinh — đo trước khi đặt, ghi cả hai số.** `0.2`:
    trong `sn46`, **17/17** phẩm đã dịch dùng khuôn `N. Phẩm <Tên>`; tầng tên
    chính thức của SuttaCentral đặt `sn46-sakacchavagga` là *"The Chapter on
    Discussion"* ⇒ **6. Phẩm Hỏi Luận**, ghép với tiền lệ `Sākacchasutta` →
    *"Kinh Hỏi Luận"* (**4** khoá trên tầng). `0.3` `Aggisutta` → **Kinh Lửa**:
    tiền lệ **2** khoá (`an5.219:0.3`, `iti93`); trong `content/meta/sutta/sn/`
    có **1705** tệp, **1632/1705 = 95,7%** `translationTitle` theo khuôn
    `Kinh …`, và có đúng **1** tiền lệ chứa "Lửa" (`sn7.8` *Kinh Thời Lửa*)
    — tức **1632** theo hình dạng nhưng **0** trùng nguyên văn *"Kinh Lửa"*
    trong chính `sn`, nên lấy theo tiền lệ Pāli↔Việt (**2**) và hình dạng
    đa số (**1632/1705**).
  - >-
    **Thuật ngữ — mỗi cái đều có số đếm.** *Có tiền lệ đo được:* `bojjhaṅga`
    → **giác chi** (tầng 694, `sn` 380); danh sách bảy giác chi của chính
    `sn46` (`sn46.4:2.3`, đã `published`) cho `passaddhi` = **khinh an**,
    `samādhi` = **định**, `upekkhā` = **xả**, nên bài này theo đúng danh sách
    đó; `dhammavicaya` chọn **trạch pháp** vì dạng ghép `…sambojjhaṅga` đo được
    *"giác chi trạch pháp"* **4** khoá trong `sn46` và **16** toàn tầng, còn
    *"giác chi thẩm pháp"* **0**; `tiṇa` → **cỏ** (**111**), `gomaya` → **phân
    bò** (**19**), `pakkhipeyya` → **ném** (**10**), `kaṭṭha` → **củi**
    (**22**; đa số toàn tầng là **gỗ** 46 nhưng **gỗ**/“cỏ” sẽ đụng nhau vì
    `tiṇa` đã là *cỏ*, nên lấy **củi** và ghi lý do), `bhāvanāya` → **tu tập**
    (**3063**), `Evameva kho` → **Cũng vậy** (**285/470** toàn tầng, **102/121**
    trong `sn`), `Taṁ kissa hetu?` → **Vì sao vậy?** (**290/447**; 12 dạng
    khác nhau), `Tatiyaṁ` → **Thứ ba.** (**261/263**), `avisayasmiṁ` → dùng
    lại nguyên văn `mn13:6.7`, `aññatitthiyā paribbājakā` → **du sĩ thuộc
    giáo phái khác**. *Đặt mới, 0 tiền lệ:* `līnaṁ cittaṁ` → **tâm nhạ đại**
    (nghĩa có tiền lệ *"tâm nhạt nhẽo"* 1 và *"tâm nhạ…"* 10, nhưng đúng cụm
    này **0**), `uddhataṁ cittaṁ` → **tâm khuấy động** (nghĩa có *"tâm bồng
    cuộng"* 1), `akālo/kālo … bhāvanāya` → **không đúng lúc / đúng lúc tu tập**
    (*đúng lúc* 153 toàn tầng), `dussamuṭṭhāpayaṁ/susamuṭṭhāpayaṁ` → **khó/dễ
    được … khuyến khích** (*khuyến khích* 323), `duvūpasamayaṁ/suvūpasamayaṁ`
    → **khó/dễ được … lắng dịu** (*lắng dịu* 372), `sabbatthikaṁ vadāmī` →
    **Ta tuyên bố là luôn hữu ích** (tiền lệ **1** ở `mil3.1.13:4.12` — tệp
    đó đang ở trạng thái `draft`, nên chỉ là tiền lệ tham khảo chứ không phải
    bản đã xuất bản — là *"chánh niệm ở mọi nơi"*; bản đó còn **giữ nguyên**
    `ti` thừa và một dấu `’` thừa, **không** chép theo). Cùng cảnh báo cho
    `līnaṁ cittaṁ` và `uddhataṁ cittaṁ`: nguồn duy nhất trên tầng cho hai
    nghĩa này là `mil5.3.11:2.6`, cũng đang ở trạng thái `draft`.
  - >-
    **`bhante` — tầng bị chia làm nhiều nhánh, đã ghi rõ thay vì bịa đa số.**
    `“No hetaṁ, bhante”.` trùng byte **247** khoá trên tầng với **24** dạng
    dịch: phạm vi gần nhất (`sn`, 105 khoá) đa số là *"Thưa không phải vậy,
    bạch Thế Tôn"*. (**55/105**), toàn tầng đa số lại là *"Bạch Thế Tôn,
    không."* (**56/247**, không đa số) — bài này lấy **phạm vi gần nhất**.
    `“Evaṁ, bhente”.` trùng byte **124** khoá với **17** dạng: `sn` (**31**
    khoá) đa số *"Thưa vâng, bạch Thế Tôn"*. (**11/31**, bằng *"Thưa có"*
    11/31), toàn tầng đa số *"Bạch Thế Tôn, đúng vậy."* (**35/124**) — bài
    này lấy **toàn tầng** vì phạm vi gần bị **hòa**. Vì hai công thức này
    rút ra hai câu khác nhau, bản Việt giữ **“Thưa không phải vậy, bạch Thế
    Tôn”**. cho `5.4`/`11.4` và **“Bạch Thế Tôn, đúng vậy.”.** cho
    `8.4`/`14.4`; cặp trong bài vẫn **tự nhất quán** (`5.4`≡`11.4`,
    `8.4`≡`14.4`). Dấu chấm ở `5.4` đặt **ngoài** ngoặc kép và ở `8.4` đặt
    **trong**, đúng theo tiền lệ đã đo của **từng** công thức — tầng tự nó
    không thống nhất ở điểm này.
  - >-
    **Bất định đã ghi, không đưa vào thân kinh.** (1) `(Pariyāyasuttasadisaṁ.)`
    là **hapax** — `suttasadisa` chỉ xuất hiện **đúng 1 lần** trong **284.708**
    khoá Pāli đã cache của năm bộ, nên **0** tiền lệ; dịch thành *"Tương tự
    Kinh Pariyāya."* giữ **tên riêng Pāli** thay vì bỏ tên theo Sujato (*the
    same as the previous discourse*), vì `sn46.52` (`Pariyāyasutta`) chưa có
    bản Việt nên bỏ tên sẽ thành tham chiếu treo. (2) `bhikkhave` bị bản
    dùng lại ở `2.6` bỏ mất — đã ghi, không sửa, để `mn13` và bài này không
    mâu thuẫn. (3) `sabbatthikaṁ` đọc là *"luôn hữu ích"* theo Sujato (*always
    useful*); có thể đọc *"hữu ích với mọi phương diện"* — chuyện này **không
    đổi nghĩa** thân kinh, chỉ là cách diễn đạt.
  - >-
    **Năm phép kiếm — kèm mẫu số, nói rõ phép nào chạy rỗng.** (1) tập khoá
    Việt **54** = tập khoá Pāli **54**, `list(vi) == list(pali)` **đúng**,
    khoá ngoài `keys` của lát = **0**. (2) nháy đơn `‘’` và ngoặc kép `“”`
    khớp Pāli **từng khoá**: lệch **0/54**; tổng hai bên đều `(9, 9, 1, 1)`;
    phép *cân tổng* ở đây trùng với *khớp từng khoá* vì không khoá nào lệch.
    (3) Pāli trùng nguyên văn **trong chính bài**: **12** nhóm / **47** cặp,
    số cặp trong đó bản Việt khác = **0** — phép này **có mẫu số**, không
    chạy rỗng. Thêm **13** nhóm *gần* trùng (chỉ khác enclitic `ca` hoặc dấu
    `“`, mà Pāli không mang nghĩa), trong đó Việt khác = **0**. (4) dấu lược:
    lỗi **0/54**; Pāli có `…` **0** khoá nên phép `…pe…` và phép *không thừa
    `…`* đều **không có mẫu số** ở bài này — hai phép này **chạy rỗng**,
    không phải đã đạt; cùng vậy `(…)` = **0** và kết `….` = **0** ở cả hai
    bên. (5) số Pāli: quét **46** mẫu từ số trên toàn bài cho ra **0** từ số
    thật; chỗ gần giống nhất là `tiṇāni` (số nhiều của `tiṇa` = *cỏ*, **không
    phải số**) ở `5.2`, `8.2`, `11.2`, `14.2`. Hai chữ số Ả-rập chỉ nằm ở
    `0.1` (`46.53`) và `0.2` (`6.`) và được giữ nguyên. Kiểm phụ: lệch NFC
    **0**, khoá rỗng **0**, khoảng trắng thừa **0**; dấu Pāli còn sót **4**
    khoá nhưng đều là **tên riêng cố ý giữ** — `Saṁyutta Nikāya` (0.1, khuôn
    của cả sách), `Sāvatthī` (1.1, nguyên văn dùng lại), `Pariyāya` (1.2),
    `Māra` (3.1, nguyên văn dùng lại).
  - >-
    **Lượt review đối kháng bắt được 2 lỗi trong chính bản nháp, đã sửa.**
    (1) `5.2`/`14.2` đã viết *"**rồi** tưới nước vào"* — Pāli `udakavātañca
    dadeyya, paṁsukena ca okireyya` chỉ có trạng ngữ `ca`, **không** có ý
    *trước rồi sau*; đã gỡ `rồi` cho khớp hình câu của cặp cỏ khô. (2) `kaṭṭha`
    đã dịch **cành cây** — đo lại thì đúng cụm này **0** tiền lệ trên tầng
    (chỗ đếm được trước đó là 4 khoá của chính bài này); đã đổi sang **củi**.
    Ngoài ra `2.1` đã sửa dấu mở ngoặc kép khi dùng lại nguyên văn `mn13`.
