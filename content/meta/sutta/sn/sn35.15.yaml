notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim. **Coverage đo được 21/21 khoá Pāli có nội dung = 1.0000** khi tính cả lớp lấp `english-project` (4 khoá `1.13`, `1.14`, `1.15`, `1.17`, `1.18` đã `published`) theo `creditLayers` của `source/layers.yaml`. Tầng `vietnamese-current` không có cho bài này.
  **Song song trùng gần như toàn bài**: `sn35.14` (cùng `Yāvakīvañcāhaṁ… sáu …āyatana`) và `sn35.16` (cùng công thức `assādapariyesana` nhưng cho *ngoại* xứ), và `sn22.27` (cùng công thức nhưng cho uẩn). `ajjhattikānaṁ āyatanānaṁ` → *sáu nội xứ* — nguyên văn `sn35.13:2.1` (cùng bài trước, cùng câu). **Dùng lại nguyên văn 4 khoá có Pāli trùng** (`0.2`, `2.3`, `2.4`, `2.5`).
  **Lỗi của Pāli đã ghim ở `2.1`–`2.2` — báo rõ, và KHÔNG mở rộng.** `sn35.15:2.1` kết bằng `…pe…` và `sn35.15:2.2` chỉ còn **một chữ**: `paccaññāsiṁ.` Bản `sn35.16:2.1` — cùng công thức, không lược — cho thấy chữ này là vế cuối của câu *…‘anuttaraṁ sammāsambodhiṁ abhisambuddho’ti **paccaññāsiṁ***, tức phần bị nuốt là `neva tāvāhaṁ… abhisambuddho’ti`. Bản Anh Sujato ở `2.2` lại dịch là *"But when I did truly understand …"* — **không** phải nghĩa của `paccaññāsiṁ`. Đã theo Pāli: `2.1` dịch *… khi Ta còn chưa như thật thắng tri … của sáu nội xứ này …* giữ **một** `…`, và `2.2` dịch đúng một mệnh đề *Ta đã tuyên bố.* — tiền lệ cho một khoá đơn từ là `sn22.27` (`abbhaññāsiṁ.` → *Ta chưa từng tự nhận.*). **Cố tình KHÔNG bịa phần bị lược** (BRIEF_VI3 §10.1): mở rộng chỗ lược là thêm chữ không nguồn nào chứng thực. Cảnh báo cho biên tập: tiêu đề `sn35.16` đã có tiếng Việt *"thì Ta vẫn chưa tuyên bố chứng ngộ Vô thượng Chánh Đẳng Chánh Giác"* ở `2.1` — đó **là** mở rộng chỗ lược; lát này không sao chép.
  **Thuật ngữ.** `assāda` → *vị ngọt*, `ādīnava` → *sự nguy hại*, `nissaraṇa` → *sự xuất ly* — đồng bộ nguyên văn `sn35.16` (bài kế) và `sn22.27`. Bài này dùng **số ít** (`cakkhussāhaṁ`), nên bám cách số ít của `sn22.27` (*Ta từng đi tìm vị ngọt của con mắt*) thay vì cách số nhiều của `sn35.16` (*Ta đã tìm cầu… của các sắc*). `tadajjhagamaṁ` → *Ta đã tìm thấy* (nguyên văn `sn22.27`, rõ cho người đọc hơn *Ta đã đạt được vị ngọt ấy* của `sn35.16`).
  **Tên bài 0 tiền lệ.** `Paṭhamaassādapariyesanasutta` → *Kinh Tìm Cầu Vị Ngọt Nội Xứ Thứ Nhất*, theo đúng khuôn bài kế `sn35.16` (*Kinh Tìm Cầu Vị Ngọt Ngoại Xứ Thứ Hai*): `Paṭhama…` = Thứ Nhất, `Dutiya…` = Thứ Hai. Vế *Nội Xứ* lấy từ nội dung bài (sáu nội xứ ở `2.1`), không phải từ chữ trong tên.
  Nháy kép: `1.1` mở và `2.4` đóng. Dấu lược: `1.10`, `1.11`, `1.20` giữ **một** `…` mỗi khoá (`1.20` là `…pe…`), không mở rộng.
