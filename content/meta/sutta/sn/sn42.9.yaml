notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim. Coverage English = **32/32** khoá Pāli có nội dung = **100%** (đo bằng `isSubstantive` của `src/lib/canon/reference.ts`). Tầng `vietnamese-current` không có cho bài này — `translation/vi/phantuananh` tại commit đã ghim chỉ có 26 tệp Pháp Cú.
  Bài song parallel `mn58` (Trung Bộ, Vương Tử Vô Úy — đúng chuyện thôn trưởng Asibandhaka đi bác bỏ Đức Phật về chuyện phá hủy gia đình) đã có bản Việt và được dùng làm khung cho **3** khoá trùng nguyên văn, cộng thêm toàn bộ khung thoại của bài: `āropehi` → *hãy đi bác bỏ lập luận* (`mn58:3.1`) · `Kathaṁ panāhaṁ… vādaṁ āropessāmī` → *nhưng làm sao con có thể bác bỏ lập luận…* (`mn58:3.4`) · `ubhatokoṭikaṁ pañhaṁ` → *câu hỏi gài cả hai phía này* và `neva sakkhati uggilituṁ, neva sakkhati ogilitun` → *không thể nhả ra cũng không thể nuốt xuống* (`mn58:3.16`).
  0 tiền lệ, đặt mới, ghi kèm lý do: `gāmaṇi` → *thôn trưởng* (đã có ở `sn42.1`, `sn42.3`, `sn42.10`) · `nigaṇṭha nāṭaputta` giữ nguyên dấu Pāli, y hệt `mn58:2.1` (196 khoá trong tầng dùng *Nigaṇṭha Nāṭaputta*) · `samaṇa gotama` → *Sa-môn Gotama* (706 khoá) · `Nāḷandā` giữ dấu · `pāvārikambavane` → *trong vườn xoài Pāvārika* (`dn28:1.2`, `mn56:1.2`) · `Tatra sudaṁ bhagavā … viharati` → *Ở đó, nghe như vầy: Đức Thế Tôn trú ở …* · `Kulasutta` → *Kinh Gia Đình* (3 khoá) · `Gāmaṇivagga` → *1. Phẩm Làng* (4 khoá).
  Ba cụm kinh điển dịch theo nghĩa, không theo lối tắt: `anuddaya / anurakkha / anukampa` → *sự điều tâm / sự hộ trì / lòng thương xót* (Sujato: *kindness, protection, sympathy*; không gộp ba thành một) · `ucchedāya / anayāya / upaghātāya` → *tiêu diệt / làm sụp đổ / phá hủy* (Sujato: *annihilate, collapse, ruin*) · `aṭṭha hetū, aṭṭha paccayā` → *tám nhân, tám duyên* (tiền lệ `an10` *Tám nhân, tám duyên*).
  Đoạn `4.8` là danh sách tám nhân của gia đình bị phá hủy — giữ đủ cả tám và giữ đúng thứ tự Pāli; `aniccatā` là nhân thứ tám nhưng không nằm trong nhóm tám nhân đầu, nên dịch *còn vô thường thì là nhân thứ tám*, không lẫn vào danh sách đếm ở trên.
  Câu nguy hiểm ở đây là `4.12`: `yathābhataṁ nikkhitto evaṁ niraye` là **hình phóng**, không phải mệnh đề điều kiện. Bản dịch giữ hình ảnh: *bị đặt vào địa ngục như bị đưa vào đó*, thay vì biến thành *sẽ bị đưa xuống địa ngục*.
  Dấu lược: đúng một khoá có `…pe…` của Pāli (`5.2`) và giữ **một** `…`; không mở rộng, không dùng `…` để nén.
  `notes` ở đây là khối literal `|-` thụt 2 đặt ở GỐC file, đúng như `content/meta/sutta/sn/sn12.61.yaml` (đã đọc mẫu đích trước khi ghi).
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy — lát agent này không chạy bốn lệnh đó, nên `technical_integrity` đặt 9.6 chứ không 10.0. Tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài.
