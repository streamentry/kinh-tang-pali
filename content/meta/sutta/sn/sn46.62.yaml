notes: |-
  Pāli đọc trực tiếp từ snapshot đã ghim; English Sujato có ở 1.1, trống ở
  1.2 là số thứ tự chaṭṭhaṁ, giống hệt hai bài sibling đã published
  sn46.58 và sn46.70 nên không chặn published. Tầng Việt hiện hành vắng vì
  snapshot chỉ có Pháp Cú; đây là giới hạn của bản chụp upstream.
  Giữ …pe… nguyên dạng … theo quy ước kho, không mở rộng.
  Tiền lệ đếm được: mettā thành lòng từ có 102 đoạn; Kinh Lòng Từ đã là
  tiêu đề của iti22 và kp9; Pāli 1.1 có bhāvitā nên giữ đã được tu tập
  theo khuôn sn46.58, cụm này có 121 đoạn; 1.2 Thứ sáu. có 224 đoạn.
  Không có bất định đáng kể; mettā ở đây là pháp tu độc lập chứ không nằm
  trong liệt kê từ bi hỷ xả nên dạng lòng từ là phù hợp.
