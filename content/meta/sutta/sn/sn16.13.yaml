notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim (20/21 khoá Pāli có nội dung; `3.4` do lớp lấp `english-project` của dự án bù và nó đã `published`, nên coverage tính cả hai tầng theo `creditLayers` trong `source/layers.yaml` là 21/21 = 1.0000). Tầng `vietnamese-current` không có cho bài này.
  **Song song gần như trùng: `mn65` (Kinh Bhaddāli)** — cùng câu hỏi của trưởng lão về *vì sao trước kia giới học pháp ít hơn mà tỳ-kheo chứng quyết định nhiều hơn*. **Dùng lại nguyên văn 4 khoá có Pāli trùng với `mn65`** cho `1.4`, `1.5`, `1.6`, `4.2`/`5.2`, cộng thêm `mn140:36.1` cho `2.1`. `sikkhāpadāni` → *giới học pháp* (nguyên văn `mn65`; `sikkhāya` riêng thì 152 bài dùng *học giới*). `saddhamme antaradhāyamāne` → *Chánh Pháp đang biến mất* (nguyên văn `mn65`).
  **Bản Anh gọi bài là *The Counterfeit of the True Teaching*; `saddhammappatirūpaka` 0 tiền lệ trong kho** — chọn *hình thức giả dối của Chánh Pháp*, và dùng **đúng cụm đó** ở `1.7`, `1.8`, `2.3`, `2.4`, `6.6` để tiêu đề và thân bài nhất quán. Người biên tập có thể đổi nếu thấy *bản chước dạng* rõ hơn.
  **0 tiền lệ, phải tự đặt — `okkamaniyā dhammā` → *pháp có hại*.** Công thức đầy đủ của nó đã có ở `an5.154` (`pañca dhammā saddhammassa sammosāya antaradhānāya` → *năm pháp đưa đến sự phai nhợt và biến mất*), nên `4.1`, `4.4`, `5.1`, `5.4` dùng nguyên văn `an5.154`; chỉ chữ bổ nghĩa `okkamaniyā` là mới. `sagāravā … sappatissā` / `agāravā … appatissā` → nguyên văn `an5.201` (*sống có cung kính, có tôn trọng…* / *sống không cung kính, không tôn trọng…*), đổi `bhikkhuniyo` sang *tỳ-kheo-ni* vì chính tả *tỳ-kheo-ni* (276) đứng trước *tỳ-kheo ni* (78); `samādhismiṁ` → *tâm định* (48 so với *sự định* 25). `jātarūpa` → *vàng ròng* đối với `jātarūpappatirūpaka` → *vàng giả*. `Xsaṁyuttaṁ samattaṁ` → *Tương Ưng X đã hoàn tất* (34 bài). `Tassuddānaṁ` → *Tóm lược:* (333 bài).
  **Uddāna `6.1`–`6.6` là mục lục tên các bài của phẩm, không phải mô tả nội dung** — mỗi khoá chỉ liệt kê chữ mở đầu của từng bài. Dịch nghĩa có giới hạn từ chính các bài ấy trong cùng phẩm, đọc Pāli để chốt: `candūpama` → *bọn dơi* (`sn16.3`), `kulūpaka` → *đống rơm rác* (`sn16.4`, bài hỏi làm sao bậc A-la-hán lại thành đống rơm rác), `jiṇṇa` → *bạc màu* (`sn16.5`), `jhānābhiññā` → *thiền quán và chứng tri* (`sn16.9`), `upassaya` → *sự nương tựa* (`sn16.10`, Kassapa rời Đức Phật đến với Ānanda; 547 bài dùng *nương tựa*), `santuṭṭha` → *tri túc* và `anottappī` → *không sợ hãi tội lỗi* (theo `sn16.1` và `sn16.2` đã dịch). **Năm khoá này có 0 tiền lệ trong kho.**
  Nháy kép: `1.4` mở–`1.5` đóng, `1.6` mở–`5.4` đóng — cân trên cả bài, đúng như Pāli.
