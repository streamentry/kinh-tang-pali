notes: |-
  Đợt 19, lane 21. Dịch từ Pāli root commit đã ghim, đối chiếu English Sujato đã ghim, bản Hòa thượng Thích Minh Châu nguyên bài (tra cứu toàn văn, không phân đoạn) và các tiền lệ cùng tầng. Đủ 78 khoá, thứ tự và tập khoá khớp Pāli; không có khoá ngoài Pāli.

  **Coverage Anh trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): 37/67 = 0.552** — dưới sàn 0.80. Sujato để trống 30 khoá (các đoạn lặp lại lời Phật và lời các tỳ-kheo), chưa có english-project cho bài này, và tại commit đã ghim không có bản Việt phân đoạn cho bài này. Vì vậy phần lớn bài chỉ có Pāli tự đứng vững; bài giữ `draft` kèm blocker độ phủ, `triangulation` hạ xuống 6.5. Đây là giới hạn của tầng tham khảo, không phải lỗi của bản dịch; muốn nâng trạng thái cần lớp english-project lấp 30 khoá trên, không nâng điểm để né blocker.

  Số Pāli: `pañca` 5 (năm dục trưởng dưỡng) và `saḷāyatana` 6 (sáu xứ), cùng danh sách mắt–lưỡi–ý được lược bằng `…pe…`; không có số lớn.

  Dấu lược: 15 khoá Pāli có `…pe…` đều giữ đúng một `…` ở bản Việt; Pāli không có `(…)` trần ở khoá nào nên không có `(…)`. Nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá (ở 6.1–6.2 nháy kép mở ở 6.1 và đóng ở 6.2 vì đoạn lược `…pe…` ở giữa; người nói đổi từ Tôn giả Ānanda sang các tỳ-kheo ngay trong chỗ lược nên phần chữ 6.2 là lời các tỳ-kheo nhưng dấu nháy theo Pāli).

  Tái dùng nguyên văn tầng: 1.1 và 1.3 theo cách đã dùng ở sn35.14 (cùng Pāli); 0.2 theo 7 khoá cùng Pāli ở các kinh kề (12. Phẩm Dục Thuộc Thế Gian); 0.3 theo sn45.176 (cùng tên Pāli Kāmaguṇasutta); 10.1, 10.14 và 11.2 theo cách đã dùng ở mn138/mn133/mn18 (cùng công thức Pāli, chỉ đổi tên Tôn giả Mahākaccāna thành Ānanda). Pāli trùng nguyên văn trong chính bài: 10 nhóm khoá, bản Việt giống nhau ở cả 10 nhóm.

  Thuật ngữ (đếm trên tầng): `kāmaguṇā` → «dục trưởng dưỡng» (55 lần ở tầng, đa số; «dục công đức» 23) ở cả tiêu đề lẫn thân; `āyatana` → «xứ» (161/228 khoá sn); `saññā` → «tưởng» (448/455); `nirujjhati` → «diệt» (52/73); `viññū` → «bậc trí»; `sabrahmacārī` → «bạn đồng phạm hạnh»; `āvuso` → «hiền giả»; `bhante` → «Bạch Thế Tôn»; `saṅkhittena uddesa` / `vitthārena atthaṁ avibhajitvā` → «bản tóm lược … vắn tắt … không phân tích rộng nghĩa» theo mn138; `vihāra` → «tịnh phòng» theo mn133/mn138; `Catutthaṁ` → «Thứ tư» (tầng có cả «Thứ bốn.» 71 và «Thứ tư.» 44 ở bộ sn; chọn tiếng Việt chuẩn, hai dạng cùng tồn tại ở tầng).

  Bất định, không đưa vào thân kinh:
  (1) `attarūpena` / `attarūpehi` ở 1.4, 1.6 dịch «theo cách của chính ta / của chính mình» theo Sujato ("in my own way"); Hòa thượng Thích Minh Châu dịch «vì lợi ích cho chính Ta», là một cách đọc khác của cùng từ. Chưa phân xử được, giữ cách bám sát hình thái từ.
  (2) 1.2, 1.5: `bahulaṁ gacchamānaṁ gaccheyya paccuppannesu vā appaṁ vā anāgatesu` dịch theo Sujato (thường hướng đến năm dục đã qua, hoặc hướng đến dục hiện tại, hoặc chút ít đến dục vị lai). Hòa thượng Thích Minh Châu hiểu «đi đến cuồng nhiệt khi chúng có mặt hiện tại, giảm thiểu khi chưa đến»; hai cách đọc khác nhau về quan hệ giữa `bahulaṁ` và các dạng hiện tại/vị lai. Không đủ chứng cứ để loại bỏ cách nào; chọn cách ít giả định nhất, không thêm sắc thái «cuồng nhiệt».
  (3) 6.1: câu lược `mahato rukkhassa …pe…` chỉ còn một cụm sở hữu cách; dịch «đối với một cây lớn …» và không bổ sung phần Pāli đã lược. 6.2 `agaruṁ karitvā` dịch «không xem đó là việc nặng nhọc» (Sujato: "if it's no trouble").
  (4) 8.5 `no` trong «Saḷāyatananirodhaṁ no etaṁ» không dịch riêng (dùng như tiểu từ nhấn; Sujato cũng bỏ).

