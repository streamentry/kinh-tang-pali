notes:
  - >-
    **Năm vế đều bị `…pe…` lược** — mỗi vế chỉ còn *Rồi hàng thiên tử X …*. Tôi
    dịch đúng phần còn lại và **không** bịa nội dung chuỗi lặp. Tên riêng giữ
    **nguyên dạng Pāli** (Suyāma, Santusita, Sunimmita, Vasavatti, Sakkà) — danh
    xưng chư thiên, không bịa tên Việt.
  - >-
    uddāna `7.1`–`7.6` là **bài đố đếm số**: *tán chương và cân nhắc* (Savitakka
    Avitakka), *sước và bình thản*, *hư không và thức*, *hư vô và không-có-
    tưởng*, *vô tưởng và Trời Sakkà*, *Chiên Đàn* — mười một bài của phẩm.
  - >-
    **Quy ước dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
    `published` có `…` trong Pāli, chỉ 617 (40%) giữ đúng số, và cặp lệch phổ
    biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` → `…`). Quy tắc là
    **có/không có `…` phải khớp theo từng segment**.
