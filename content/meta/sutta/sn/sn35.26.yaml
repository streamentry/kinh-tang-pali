notes: |-
  Dịch từ Pāli root đã ghim (manifest liệt kê sutta/sn/sn35/sn35.26_root-pli-ms.json và sutta/sn/sn35/sn35.26_translation-en-sujato.json). Tầng Anh CÓ nhưng thiếu chữ ở nhiều khoá.
    Coverage đo được: 18/24 Pāli có nội dung có chữ Anh Sujato = 0.7500, thấp hơn ngưỡng 0.8 trong source/layers.yaml. 6 khoá không có chữ ở lớp được tính nào: 1.12, 2.4, 2.5, 2.6, 2.7, 2.12. Cả 6 đều là Pāli viết đủ, không có dấu lược.
    Vì sao Sujato thiếu: đây là kinh đối xứng với sn35.27 (Dutiya) và cùng dùng một công thức liệt kê, nhưng bản Anh của sutta này đã bị Suthit SC để trống ở các khoá liệt kê phần thân. SuttaCentral không có bản Anh nào khác phủ bài này tại commit đã ghim, và lớp lấp english-project chưa có file cho sn35.26.
    Đây là lý do bài để draft, không phải lý do dịch kém. Đề nghị coordinator chạy lại npm run reference:gaps để sinh entry cho sn35.26, hoặc cho lớp lấp english-project lấp 6 khoá này; sau đó bài có thể nâng lên published mà không phải sửa một chữ nào trong bản dịch. Tôi không sửa content/meta/reference-gaps.yaml theo quy tắc lát.
    9/24 khoá có nội dung trùng nguyên văn Pāli đã dịch ở bài khác: 0.2 (3. Phẩm Tất Cả, trùng 8 bài), 1.1, 1.14, 1.15, 1.17, 2.2, 2.15, 2.17, 2.20.
    1.1 và 2.2 dùng y nguyên sn35.27 (bài Dutiya cùng công thức): tất cả mà không biết, không thấy rõ, không làm cho sáng ra, không từ bỏ thì không thể chấm dứt khổ. 1.14 dùng y nguyên nhưng bỏ dấu phẩy lạch trước thì trong tiền lệ.
    1.15, 1.17, 2.15 và 2.17 có tiền lệ nhưng tiền lệ sai ngữ cảnh: chúng dịch Dhamme và manosamphassaṁ theo nghĩa về tâm và pháp (Đối với Pháp, Đừng tưởng nghĩ ý xúc), không phải theo vị trí của chúng trong danh sách. Bản dịa dịch đúng vị trí: các pháp và xúc chạm của tâm. Đây là trường hợp trùng-thì-khớp lẽ ra phải sửa, nhưng các bài tham chiếu nằm ngoài lát nên tôi chỉ ghi lại ở đây.
    avirājayaṁ và virājayaṁ dịch là không làm cho sáng ra và làm cho sáng ra, y nguyên sn35.27. Đây là cách dịch sát nghĩa gốc (virājati là trở nên sáng, trong) nhưng Sujato dịch là dispassion, tức ly tham, nên người đọc Việt có thể thấy khó hiểu. Nếu coordinator muốn theo Sujato thì phải sửa cả sn35.26 và sn35.27 cùng lúc.
    Paṭhamaaparijānanasutta đặt làm Kinh Không Biết Trọn Vẹn (Một), đối chiếu sn35.27:0.3 là Kinh Không Biết Trọn Vẹn (Hai).
    Danh sách 1.3–1.19 và 2.3–2.19 chỉ đổi dấu phủ định giữa hai nửa; bản dịa giữ đúng sự đối xứng này, không rút gọn.
    Cảm thọ lạc, khổ, hay vừa khổ vừa không khổ dịch từ vedayitaṁ sukhaṁ vā dukkhaṁ vā adukkhamasukhaṁ vā; adukkhamasukha đo được 1 lần trong tầng, chưa có tiền lệ.
    Cấu trúc ngoặc kép bám đúng Pāli: mở một dấu kép ở 1.1 và đóng ở 2.19.
    Tầng vietnamese-current vắng ở commit đã ghim (chỉ có Pháp Cú), nên không có bản Thích Minh Châu để đối chiếu cho bài này.
    Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
