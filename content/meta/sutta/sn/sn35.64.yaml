notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.3 và 2.8 — *hỷ duyệt* → *hỷ*, *nắm giữ lấy chúng* → *bám chặt lấy chúng*; `nandī` toàn tầng là *hỷ* (88 khoá) hoặc *niềm vui* (16 khoá), *hỷ duyệt* chỉ có ở bài này, và `ajjhosāya tiṭṭhati` là *bám chặt* ở 10 trong 12 khoá, *nắm giữ* chỉ có ở bài này; đồng bộ trong bài ở 2.2, 2.4, 2.7, 2.9, 3.2, 3.3, 3.6, 3.7. Không theo modal *chào đón* và *như vậy* cho `abhivadato` và `taṁ`: *tán thán* cũng là cách đã dùng (6 khoá) và *chúng* nêu đúng đối tượng của `taṁ`.
