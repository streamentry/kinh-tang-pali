  Rà nhất quán theo Pāli trùng 2026-10-14: khoá sn54.5:1.1 — «Này các tỳ-kheo, niệm hơi thở vô hơi thở ra khi được tu tập… sẽ có quả lớn» → «Niệm hơi thở vô hơi thở ra, này các tỳ-kheo, khi được tu tập… thì có quả lớn» (đúng thứ tự `ānāpānassati, bhikkhave`; `hoti` ở hiện tại nên bỏ «sẽ», theo `mn118:15.1` và `sn54.2`–`4:1.1`; giữ «niệm hơi thở vô hơi thở ra» của chính bài thay cho «chánh niệm hơi thở» của các bài kia); khoá sn54.5:1.6 cùng bài — «sẽ có» → «thì có» cho khớp.
