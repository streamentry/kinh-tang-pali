notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    **Các bài anh em đã `published` có đúng Pāli, dùng lại nguyên văn.** `sn51.1:1.3–1.6` và `sn51.18:2.2–2.5` cho **công thức bốn tức địa** (`sn51.27`) · `sn55.16:1.1–1.7` cho **khung bạn bè và đồng liêu** (`sn55.17`) · `sn17.1/12/22*` cho **khung mở `Dāruṇo … lābhasakkārasiloko`** của cả dãi bài lợi lộc (`sn17.2/5/9/23/24`) · `sn13.11:1.2` và `sn56.60:1.1–1.8` cho **ẩn dụ bảy hạt đậu của vua núi Sineru** (`sn56.49/50`) · `sn56.19/36/60/61*` cho **dòng kết `yogo karaṇīyo`** (sáu bài) · `sn35.60*` (lát 37) cho `Nibbindaṁ virajjati…` (`sn35.61`) và `cittaṁ suvimuttanti vuccati` (`sn35.158`).
  - >-
    **Dịch từng bài, không dịch bằng khuôn.** Sáu bài trong lát này có **cùng một câu kết** nhưng **khác nhau ở chỗ cần phân biệt**: `sn56.32/35/44/47/49/50` đều kết `Tasmātiha … yogo karaṇīyo`, và phải giữ `…pe…` ở **đúng vị trí Pāli che** — có bài che ở `1.2`, có bài ở `2.5`, có bài che cả bốn thánh đế giữa chừng rồi mới hiện vế thứ tư. Một khuôn chung là mất dấu lược hoặc thừa dấu lược.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Đo lại trên toàn bộ segment Việt trong `content/translation/vi/project/` — 3.215 tệp, bỏ 22 tệp trong thư mục APFS orphan, đối chiếu **mọi** khoá với Pāli ở commit đã ghim: **khớp 61.033 / 61.460 = 99,31%** (0 khoá Việt nào không có trong Pāli). Con số ở các lát trước là 46.755 / 47.140 = 99,18% — **đo trên tập con, không tái lập được** từ định nghĩa đã ghi, nên thay bằng số đo lại được toàn bộ. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ.
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Dùng lại: `Ayoguḷavagga` → *3. Phẩm Ayoguḷa* (đã sửa ở lát 42: `Ayoguḷa` là tên riêng của một vị du sĩ, nên *Cầu Vàng* lẫn *Hòn Sắt* đều sai) (`sn51.23`) · `Rahogatavagga` → *1. Phẩm Ở Riêng* (`sn52.10`) · `Rājakārāmavagga` → *2. Phẩm Lều Của Vua* (`sn55.14/15/16`) · `Koṭigāmavagga` → *3. Phẩm Làng Koṭi* (`sn56.29`) · `Paṭhamavagga`/`Tatiyavagga` (Sn 17) → *1. Phẩm Thứ Nhất* / *3. Phẩm Thứ Ba* (`sn17.1`, `sn17.22`) · `Avijjāvagga` (Sn 35) → *6. Phẩm Vô Minh* · `Attadīpavagga` → *5. Phẩm Tự Mình Là Hòn Đảo* (`sn22.45`). **Chỗ phân kỳ chưa giải quyết:** `Sīsapāvanavagga` — kho có ba cách: *Phẩm Cây Chày* (`sn56.33`), *Phẩm Rừng Huyết Dụ* (`sn56.34`), *Phẩm Rừng Sīsapā* (`sn56.36`); bài này theo `sn56.36` vì nghĩa chữ. `Nandikkhayavagga` (Sn 35) — *Phẩm Dứt Niềm Vui* (3 bài) hay *Phẩm Đoạn Tận Hoan Hỷ* (3 bài); bài này theo đa số. **Một phẩm 0 tiền lệ:** `Papātavagga` → *5. Phẩm Núi Sụp* (`papāta` = vách núi đổ, cũng là tên một bài dạng ẩn dụ trong chính phẩm này — **người biên tập nên kiểm**). **Người biên tập nên thống nhất các chỗ phân kỳ.**
  - >-
    **Mở đầu nguyên văn theo 18 tiền lệ** (`sn17.6/12/22/29/32/33*`): *Nguy hiểm khủng khiếp, này các tỳ-kheo, là cõi thế gian có lợi và được tôn kính, được danh tiếng* — đây là dịch của cả dãi bài lợi lộc trong Sn 17, không phải lựa chọn riêng cho bài này. `1.2` đủ ba vế `kaṭuko pharuso antarāyiko` + `anuttarassa yogakkhemassa adhigamāya`; `2.4` lặp lại cùng ba vế — phải giữ.
  - >-
    **Ẩn dụ `1.3–1.5` là cả ba khoá của một câu chuyện** và phải giữ chủ thể: `āmisacakkhu maccho` = *con cá chép ăn mất* (không phải “cá tầu” như ở `sn56.47*` — đó là con cua, xem ghi chú bài đó). `gilabaḷiso` → *ăn mất bẫy gai*; `bāḷisikassa` (người đặt bẫy) khác `bāḷisī` (cái bẫy) — phải phân biệt. `2.1` và `2.2` cho **hai** nghĩa của `bāḷisa`: *Ma, kẻ ác* và *cõi thế gian có lợi và được tôn kính, được danh tiếng*; `2.3` gộp hai nghĩa ấy lại — nếu dịch mất một thì `2.3` không còn nghĩa.
  - >-
    0 tiền lệ cho `Baḷisasutta` → *Kinh Bẫy Gai*; `mārassetaṁ pāpimato adhivacanaṁ` → *là cách gọi khác cho Ma, kẻ ác*; `yathākāmakaraṇīyo` → *theo ý mình*; `ṭhassatī` → *choán lấy tâm chúng ta mà trú* theo **nguyên văn** `sn17.1:2.3`. Tên phẩm `Paṭhamavagga` → *1. Phẩm Thứ Nhất* theo `sn17.1`. `1.1` nguyên văn `sn17.12/22:1.1` *Đang sống tại Sāvatthī.*
