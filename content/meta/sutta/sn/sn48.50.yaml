  **DÙNG LẠI NGUYÊN VĂN, đo được 12/50 khoá** (6 khoá trùng nguyên văn ở bài khác:
  `0.2`, `1.1`, `1.3`, `7.1`, `11.5`, `12.0`; cộng 6 khoá lặp nguyên văn trong chính
  bài: `10.2`–`10.5` = `5.2`–`5.5` và `11.2`–`11.3` = `6.2`–`6.3`).
