  (`dn33`, `dn34`, `an9.1`, 3 khoá).

  **Thuật ngữ, kèm số đếm toàn tầng:** `saddhindriya / vīriyindriya / satindriya /
  samādhindriya / paññindriya` → *tín căn* (57) / *tấn căn* (54) / *niệm căn* (54) /
  *định căn* (52) / *tuệ căn* (107) — đúng như `sn48.9`, `sn48.10`, `sn48.44`. `vīriya` →
  *tinh cần* và `sati` → *niệm*, `samādhi` → *định* (theo `sn48.9`/`sn48.10`).
  `pāṭikaṅkhaṁ` → *điều có thể mong đợi* (*đáng mong* 88 khoá; `là đáng mong` 0).
  `ekaggatā` → *nhất tâm*; `santametaṁ padaṁ paṇītametaṁ padaṁ` → *an tịnh, là cao quý*
  (*cao quý* 343 khoá hơn *thù diệu* 7). `satisampajañña` (dùng ở `sn54.12`) → *niệm và
  tỉnh giác* — ở đây `satinepakkena` tôi dịch *niệm và tỉnh giác tối thượng* theo
  `sn48.9:3.2`.

  **Chỗ 0 tiền lệ, tôi dịch mới và ghi lý do:** `1.4`, `2.1`, `7.2` — cụm
  `ariyasāvako tathāgate ekantagato abhippasanno` **không khoá tiền lệ nào trong toàn
  tầng** (quét cả 5 bộ); tôi dịch *đã nhất hướng và hoàn toàn tin tưởng nơi Như Lai*,
  giữ `ekantagato` = *nhất hướng* và `abhippasanno` = *hoàn toàn tin tưởng* là hai vế
  riêng, và `kaṅkheyya` / `vicikiccheyya` = *mong cầu* / *nghi ngờ* (cả cặp này cũng 0
  tiền lệ). `5.2` `anamataggo kho saṁsāro` — **0 tiền lệ ở toàn bộ 5.312 bài** (đã
  quét `anamataggo`, `amatā koṭi`) → *luân hồi không có điểm khởi đầu*; `luân hồi`
  được dùng 173 khoá. `1.2` `aṅgesu … āpaṇaṁ nāma aṅgānaṁ nigamo` (0 tiền lệ) →
  *một thời Thế Tôn trú ở xứ Aṅga, tại ngôi làng Āpaṇa*. `5.3` tôi giữ đủ ba vế của
  `avijjānīvaraṇānaṁ sattānaṁ taṇhāsaṁyojanānaṁ` là *bị vô minh che phủ, bị chướng
  ngại và tham ái trói buộc* — Sujato chỉ dịch hai vế là *shrouded by ignorance and
  fettered by craving*, tôi giữ `nīvaraṇa` vì bỏ thì mất một từ; `chướng ngại` là cách
  dùng của tầng (213 khoá). `6.1` bốn cặp lặp `padahitvā … saritvā … samādahitvā …
  pajānitvā …` → *nỗ lực / quán lại / định tâm / hiểu biết*, giữ nguyên số lần lặp của
  Pāli. `0.3` `Āpaṇasutta` → *Kinh Āpaṇa* (0 tiền lệ; theo cách đặt tên đã có của tầng:
  *Kinh Icchānaṅgala*, *Kinh Piṇḍolabhāradvāja*).

  **Uddāna `12.1`–`12.4` bám đúng tên mười bài của phẩm** (đã tra trong Pāli và trong
  bản Việt đã có): `sn48.41` *Kinh Pháp Già*, `sn48.42` *Kinh Bà-la-môn Un-nà-ba* →
  *Già, un-nà-ba, Bà La Môn,*; `sn48.43` *Kinh Ở Sāketa* + `sn48.44` `Pubbakoṭṭhaka`
  (mà `sn48.44:1.2` đã dịch là *cổng thành phía Đông*) → *Sa-ket, cổng thành phía Đông;*;
  `sn48.45`–`48` đều là *Kinh Pubbārāma (Nhất/Hai/Ba/Bốn)* → *Pubbārāma, và bốn,*;
  `sn48.49` *Kinh Piṇḍolabhāradvāja* và `sn48.50` → *Piṇḍola, Āpaṇa.* `11.6`
  `Jarāvaggo pañcamo` → *Phẩm Già là phẩm thứ năm.* theo khuôn `sn35.52:1.17`.

