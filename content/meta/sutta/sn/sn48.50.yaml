  ):
  `2.2` → *sống tinh cần vì đoạn trừ các pháp bất thiện, vì thành tựu các pháp thiện,
  có sức mạnh, nỗ lực vững chắc, không đặt gánh nặng xuống đối với các pháp thiện*
  (`sn48.9:2.2` và `sn48.10:2.2`, 2 khoá);
  `3.1` → *đầy đủ niệm và tỉnh giác tối thượng, nhớ điều đã làm lâu, nhớ điều đã nói lâu*
  (`sn48.9:3.2` và `sn48.10:3.2`, 2 khoá);
