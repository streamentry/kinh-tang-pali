  Ngoài ra `5.5` và `10.5`: cụm `sabbasaṅkhārasamatho sabbūpadhipaṭinissaggo taṇhākkhayo
  virāgo nirodho nibbānaṁ` có **6 khoá trùng nguyên văn** trong tầng (`an10.60`,
