  Tôn nhắc lại lời Sāriputta *nguyên văn* (Sujato chú ở `7.3`: lặp lại từng chữ). Đã đối
  chiếu Pāli từng cặp: `7.4`=`2.2` (phần đuôi), `7.5`=`2.3`, `8.1`=`3.1`, `8.2`=`3.2`,
  `9.1`=`4.1`, `9.2`=`4.2`, `10.1`=`5.1`, `10.3`–`10.5`=`5.3`–`5.5`, `10.6`=`5.6`,
  `11.1`–`11.4`=`6.1`–`6.4`, chỉ đổi `bhante` thành `sāriputta` (`10.2` cũng để trống nhưng
  ngắn hơn 40 ký tự nên không tính vào mẫu số). Mười lăm khoá đó vì vậy tự đứng vững từ Pāli và từ chính các khoá `2.2`–`6.4`
  mà Sujato đã dịch; sáu cặp Pāli trùng nguyên văn trong bài (`5.2`–`5.5` với `10.2`–`10.5`,
  `6.2`–`6.3` với `11.2`–`11.3`) đều có bản Việt giống hệt nhau (6/6 cặp, 0 cặp lệch). Mất
  mát được ghi nhận ở `content/meta/reference-gaps.yaml` theo cổng của kho nên không còn là
  lỗi văn bản; đã gỡ blocker. Không có tầng Việt hiện hành ở bài này (giới hạn của bản chụp
  upstream, như mọi bài ngoài Pháp Cú). `triangulation` giữ 8,0, không cao hơn: nửa sau của
  bài không có bản Anh độc lập.

  *Lỗi văn bản thật đã sửa (đọc đối kháng Pāli, 50 khoá, 39 khoá đổi chữ).* Lỗi nghĩa:
  (1) `1.4`, `2.1`, `7.2` — `kaṅkheyya` bị dịch *mong cầu*; đây là `kaṅkhā` = hoài nghi,
  không phải ước muốn. Nay: *hoài nghi hay do dự* (`kaṅkhati vicikicchati` → *hoài nghi,
  do dự* theo `dn33`, `dn34`, `mn16`: 36 khoá có cặp này, 19 khoá phủ định). Khoá `1.4` là câu hỏi
  có `na` (*sẽ không … phải không?*), Sāriputta xác nhận ở `2.1`; (2) `6.1`, `11.1` —
  `saritvā` bị dịch *quán lại* (sai: là *nhớ*), và `evaṁ` bị bỏ; câu đôi `padahitvā padahitvā …`
  là tuyệt đối phân từ lặp = *nhiều lần* (Sujato: *again and again*). Nay: *sau khi nhiều
  lần nỗ lực như vậy, nhiều lần nhớ như vậy, nhiều lần định tâm như vậy, nhiều lần hiểu biết
  như vậy*; (3) `6.3`, `11.3` — `Tenāhaṁ` bị dịch *Nhưng* (Pāli không có đối lập); nay *Vì vậy*
  (`an6.42`, 6 khoá `Tenāhaṁ` → *Vì vậy*); `kāyena … phusitvā viharāmi` → *thân chứng và an
  trú* (`mn70`, 5 khoá; `mn6` *tự thân chứng nghiệm*), `ativijjha passāmi` → *thấy … xuyên thấu
  bằng tuệ*; (4) `12.3` — `Pubbārāme ca cattāri` là *bốn bài ở Pubbārāma* (`sn48.45`–`48`);
  bản cũ *Pubbārāma, và bốn* thành năm mục, làm mười bài của phẩm thành mười một.
  `6.2`, `11.2` — thêm `ye`: *Chính những pháp này là những pháp trước kia tôi đã được nghe*.
  Lỗi chính tả/thuật ngữ: `6.4`, `11.4` *căn tín* → *tín căn* (*tín căn* là dạng dùng trong
  notes cũ của bài này và ở `sn48.9`/`sn48.10`; *căn tín* lệch cả hai); `1.2` `nigamo` → *thị trấn* (63 khoá *thị trấn* / 17 khoá *làng*; `mn39`,
  `mn40` cùng công thức *thị trấn … của người Aṅga*); `5.3`, `10.3` `avijjānīvaraṇānaṁ` là một
  hợp từ, không phải hai vế: bản cũ *bị vô minh che phủ, bị chướng ngại* tách hợp từ và để
  *bị chướng ngại* không có chủ thể; nay *bị vô minh che lấp* (17 khoá *che lấp* / 3 *che phủ* / 2
  *chướng ngại*), `taṇhāsaṁyojanānaṁ` → *khát ái trói buộc* (`sn`: 15 khoá *khát ái* / 2 *tham ái*),
  `sandhāvataṁ saṁsarataṁ` → *chạy tới chạy lui, luân chuyển* (*luân chuyển* 16 khoá; *lang thang*
  chỉ 3), `sattānaṁ` → *chúng sinh* (11/11 khoá ở `sn15`); `5.5`, `10.5` `taṇhākkhayo` →
  *sự đoạn tận khát ái* (cùng quy ước), `sabbūpadhi` → *sanh y* (giữ nguyên, đúng glossary:
  `upadhi` = *sanh y*, không phải *chấp thủ* như câu cũ ở trên đã nhầm); `5.4`, `10.4` bỏ
  *xóa tan … dư tàn* và *ấy* thừa, nay *phai biến và đoạn diệt hoàn toàn, không còn dư sót* theo
  `asesavirāganirodho` (`mn9`, `mn44`); `vị bậc Thánh đệ tử` (13 khoá) → *vị Thánh đệ tử* (khuôn
  của `sn48.9`/`sn48.10`); `7.4` *mạnh mẽ, dõng mã, không bỏ gánh phần thiện pháp* → *có sức mạnh,
  nỗ lực vững chắc, không đặt gánh nặng xuống đối với các pháp thiện* cho khớp `2.2` (cùng
  Pāli `thāmavā daḷhaparakkamo anikkhittadhuro kusalesu dhammesu`); `7.3`, `8.1`, `9.1`
  thêm *sẽ* cho khớp thì tương lai `viharissati`/`bhavissati`/`labhissati` ở `2.2`/`3.1`/`4.1`;
  năm câu `yā hissa … tadassa …indriyaṁ` (`2.3`–`5.6`, `7.5`–`10.6`, `6.4`, `11.4`) bỏ *cái là X*
  (không tự nhiên) thành *X nào của vị ấy, đó chính là … căn của vị ấy*; uddāna `12.1`–`12.4`:
  *Sa-ket* → *Sāketa* (khớp `sn48.43`), *un-nà-ba, Bà La Môn* → *Un-nà-ba, Bà-la-môn* (khớp tên
  `sn48.42`), thêm *và* ở `piṇḍolo āpaṇena cāti`.

  *Không đổi, đã kiểm:* `5.2` *luân hồi không có điểm khởi đầu* (0 tiền lệ nhưng khớp Pāli và
  Sujato); `nhất hướng và hoàn toàn tin tưởng nơi` (16 khoá, `sn55.25`); `an tịnh, là cao quý`;
  `giữ vững niệm` (`upaṭṭhitassati`); `lấy xả ly làm cảnh` (khớp `sn48.9:4.2`, `sn48.10:4.2`).
  Hai câu thuật lại ở mục cũ nay đã sửa: `7.4` không còn dùng lại `dn33`/`dn34`/`an9.1`;
  `5.5` không phải *chấp thủ*.

  Bất định còn lại: `Tenāhaṁ` (`tena` có thể là *vì vậy* hoặc *nhờ đó*; giữ *vì vậy* theo
