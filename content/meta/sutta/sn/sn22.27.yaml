notes: |-
  Soạn từ Pāli root, đối chiếu Anh Sujato: 15/15 khoá có nội dung đều có Anh;
  bài này KHÔNG dùng lớp lấp `english-project`. Không có bản Việt Thích Minh Châu
  (ngoài Pháp Cú).
  Đây là bài song song của sn14.32 (bốn giới tánh ở đó, năm thủ uẩn ở đây) nên dùng
  cùng khung: Ta từng đi tìm … và Ta đã tìm thấy nó / Đến mức … được Ta biết rõ bằng
  trí tuệ.
  Dùng CHUNG bộ thuật ngữ với sn22.26 và sn22.28 (bài liền kề trong Phẩm Gánh
  Nặng): vị ngọt / sự nguy hại / sự xuất ly, tiêu đề theo Kinh Vị Ngọt Thứ Ba của
  sn22.28. Ghi lại vì sn22.73 và sn22.130 dùng bộ Sự Đáng Ưa còn sn22.129 dùng
  Kinh Vô Minh (sai); nếu điều phối muốn thống nhất theo sn22.73 thì cả 0.3 của
  sn22.26 và sn22.27 phải đổi cùng lúc.
  Tiền lệ đếm được: Saṁyutta Nikāya giữ Pāli 1074/1408; `3. Bhāravagga` →
  3. Phẩm Gánh Nặng 9/9 trong sn22; `Sāvatthinidānaṁ.` → Tại Sāvatthī. 391/410;
  cụm `…pariyesanaṁ acariṁ … tadajjhagamaṁ … sudiṭṭho` theo sn14.32:1.2 và an3.104;
  `akuppā me vimutti` theo sn14.31; `Chaṭṭhaṁ.` theo đa số Thứ sáu.
  Ghi nhận bất định: 1.11-1.13 Pāli lược ở giữa (thọ, tưởng, các hành), nên bản Việt
  giữ đúng ba khoa ngắn ấy với một dấu lược mỗi khoá thay vì nối liền — nối liền sẽ
  giấu mất chỗ lược. 1.23-1.24: Pāli lặp `abbhaññāsiṁ` hai lần với `…pe…` ở giữa, nên
  hai khoá đều phải có mệnh đề Ta chưa từng tự nhận, không được gộp. 1.26 dùng dấu
  hai chấm phẩy theo Pāli. Nhắy kép mở ở 1.2 và đóng ở 1.26, đúng như Pāli.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
