notes: |-
      **DÙNG LẠI NGUYÊN VĂN — 10 khoá Pāli trùng nguyên văn:** `0.2` = `sn48.51:0.2`
      (*6. Phẩm Núi Khỉ*) · `0.3` = `an6.31:0.3` (*Kinh Bậc Hữu Học*) · `1.1` = `sn1.11:1.1` ·
      `1.2` = `sn48.49:1.2` (dùng lại nguyên văn, kể cả chữ thường ở đầu câu, vì nó nối tiếp
      *Tôi nghe như vầy—*) · `1.3` = `sn1.11:1.3` · `2.1` = `sn24.10:1.4` (*Bạch Thế Tôn, các pháp
      lấy Đức Thế Tôn làm gốc …*) · `4.3` = `sn55.35:2.6` · `5.2` = `an4.162:2.6` và `6.3` =
      `an4.162:2.6` (nguyên văn *tín căn, tinh tấn căn, niệm căn, định căn, và tuệ căn.*, 8 bài
      đã publish) · `7.5` = `sn12.13:2.13`.
      **⚠ `sekho` / `asekho`: đã sửa sau khi đối kháng.** Bản đầu tôi dịch `asekho` là *bậc không
      còn hữu học* — **đây là cách tôi tự chế, 0 tiền lệ**. Đếm lại trên đĩa: `asekho` được dịch
      **vô học** ở 7 chỗ (`iti/an/mn`, cụ thể *bậc vô học*, *được gọi là vô học*,
      *vô học chánh niệm, vô học chánh định*); `sekho` = *hữu học* (`an5.90:1.3`, `iti79:2.3`,
      `sn2.6:2.3`). Tôi đã sửa hết sang **hữu học / vô học** — cặp đối xứng, đúng tiền lệ, và
      ngắn hơn. Ảnh hưởng `1.4`, `2.2`, `3.1`, `3.3`, `4.5`, `5.1`, `5.5`, `6.1`, `6.2`, `6.6`,
      `7.1`, `7.4` — 12 khoá.
      **Nháy kép của Pāli ở bài này KHÔNG cân:** đếm trên chính Pāli cho ra `2.1` mở `“`,
      `2.2` mở `“` **thêm lần nữa**, và chỉ `7.4` đóng một lần — ròng +1. Đây là quy ước
      SuttaCentral sau `…pe…`: đoạn lược ở `2.1` cắt giữa lời thoại, nên tầng trên mở lại dấu nháy.
      Tôi làm **đúng như `sn24.11`** (đã `published`: `1.4` mở `“Bhagavaṁmūlakā no …pe…`, `1.5`
      đóng `”ti`) — chỉ mở một lần ở `2.1`, đóng ở `7.4`. Nếu giữ hai lần mở thì `validate`
      báo lệch; tôi **không** bịa thêm dấu nháy để cân.
      **0 tiền lệ, đặt mới:** `yaṅgatika` → *mục đích* · `yaṁparama` → *đỉnh điểm* ·
      `yaṁphala` → *quả báo* · `yaṁpariyosāna` → *sự viên mãn* (bốn cụm này **không có** tiền lệ
      ở tầng Việt; Sujato *destination, apex, fruit, culmination*). `paṭisañcikkhati` → *suy xét*
      (`mn54.19.3`) · `bhūtaṁ tacchaṁ tathaṁ` → *đúng thật, đúng như thật* (`dn29.28.2`) ·
      `ativijjha passati` → *xuyên thấu, thấy biết* (`an6.46:7.5`) ·
      `nirujjhissanti … aparisesaṁ` → *chấm dứt trọn vẹn, không thừa một chút nào*.
      `Cakkhundriyaṁ … manindriyaṁ` → *Mắt căn, tai căn, mũi căn, lưỡi căn, thân căn, tâm căn* —
      theo `sn48.27:1.3` (`sn48.26:1.3` dùng *Nhãn căn* cho `Cakkhundriyaṁ`; **hai cách đang
      cùng tồn tại trong kho**, tôi theo `sn48.27` vì ngay trong cùng Tăng Bộ; ghi để người biên
      tập thống nhất).
      **Tầng Anh đủ 100%** (23/23), `triangulation` 9.3. **Không đối chiếu được tầng Việt hiện
      hành.**
      **technical_integrity = 9.6** vì bốn cổng kỹ thuật do coordinator chạy, tôi không được chạy (`npm run validate|test|check|build` bị cấm trong lát này): (1) `npm run validate` (qua `npm run build`) — kiểm metadata, scorecard, `blocking_errors` và nội dung; (2) `npm test` — unit tests; (3) `npm run check`; (4) `npm run build`. Ngoài ra `npm run reference:gaps:check` phải xanh sau khi chạy lại `npm run reference:gaps`.
