notes: |-
  Đã đọc HẾT `vc/p75.txt` trước khi viết. Đây là bản lặp **thứ tư** của cùng một bài đã có hai bản
  `published` (`sn24.45` ở phẩm thứ nhất, `sn24.70` ở phẩm thứ ba), nên phần lớn dùng lại Y
  NGUYÊN VĂN. Đếm được: **18** khoá Pāli trùng nguyên văn `sn24.70`, **15** khoá trùng `sn24.45`,
  **16** khoá trùng cả hai nên lấy từ `sn24.70`. Khối `3.13`–`3.18` lặp nguyên văn khối `3.3`–`3.8`
  (Pāli lặp y hệt) nên dùng lại y nguyên văn trong chính bài.

  MỆNH ĐỀ ĐO LẠI: `:0.1` `Saṁyutta Nikāya 24.96` (`ṁ` = U+1E41). `:0.2` `4. Catutthagamanavagga`
  ⇒ **4. Phẩm Tái Sinh Thứ Tư** (2/2 bài `sn24` đã có, và cùng họ *Phẩm Tái Sinh Thứ N* với
  `1. Phẩm Nhập Lưu` 15, `2.` 10, `3.` 3). `:0.3` `Adukkhamasukhīsutta` ⇒ **Kinh Tự Thân Vừa
  Khổ Vừa Vui** — 1 tiền lệ `sn24.70:0.3`, cùng Pāli, lấy y nguyên văn.

  **MỘT KHOÁ CỐ Ý KHÔNG DÙNG LẠI Y NGUYÊN VĂN: `:1.4`.**
  Pāli của bài này, chạy `“` trừ `”` trên toàn bộ, cho **+1** — tức Pāli tự nó dư một dấu nháy
  mở. Chốt `_hvi.ngoặc()` đòi bản Việt phải cân, nên phải bỏ đúng một dấu. Đối chiếu từng bước
  cho thấy dấu nháy mở thừa nằm ở `:1.4`: đó là lời các tỳ-kheo đáp *“Bạch Thế Tôn, các pháp
  lấy Đức Thế Tôn làm gốc …pe…”*, và `…pe…` nuốt mất phần khép; còn `:4.1` **mở** `“` và `:5.3`
  **khép** `”ti.` là đúng, vì từ `:4.1` đến hết `:5.3` Đức Thế Tôn nói liên tục. Nên tôi bỏ dấu
  nháy ở `:1.4` và giữ mọi dấu còn lại y nguyên văn hai bài đã `published`. Đây cùng loại với
  việc `sn24.70` đã làm cho `3.14` (ghi trong `notes` của bài đó).
  Hệ quả trung thực: khoá này lệch **một ký tự** so với `sn24.70:1.4` và `sn24.45:1.4`; không
  mất nghĩa, và người đọc không thấy khác biệt vì câu đã bị `…` cắt.

  MỘT KHOÁ CỐ Ý CHỌN BẢN DỊCH KHÁC: `:5.1`.
  Cùng Pāli `Evaṁ passaṁ … nibbindati …` có **3** bản dùng *chán nản nơi thọ / chán nản nơi các
  pháp* (`sn22.12:1.5`, `sn22.14:1.3`, `sn22.136:1.3`) và **1** bản dùng *chán nản nơi cảm thọ /
  chán nản nơi các hành* (`sn12.61:6.1`). Tôi lấy bản `sn12.61` vì chính bài này đã dịch
  `saṅkhārā` là **các hành** ở `:3.11` và `:4.4`, và `vedanā` là **cảm thọ** ở `:2.3` và `:3.9`;
  lấy *nơi các pháp* sẽ khiến bài tự mâu thuẫn trong mười khoá. Cả hai bản đều là tiền lệ có
  thật với đúng Pāli này, nên đây là chọn giữa hai tiền lệ, không phải đặt mới.

  `:2.3` lấy `khi có cảm thọ …` (chữ thường, **không** có dấu nháy) từ `sn24.45:2.3`, không lấy
  `“Khi có cảm thọ …` của `sn24.70:2.3`: Pāli ở khoá này vốn không có dấu nháy và `:2.2` đã đóng
  nháy rồi, nên bản `sn24.70` có một dấu `“` thừa. Đa số tầng (8×) viết hoa `Khi`, nhưng ở vị trí
  này chữ thường mới đúng.

  `:2.2` và `:2.7` dùng y nguyên văn `sn24.70:2.2`/`:2.7`.
  `:5.3` — đa số tầng (6×) đặt mệnh đề *biết rõ* **trước** (`'…' thì biết rõ”.`); tôi dùng *Vị ấy
  biết rõ: '…'”ti.* để khớp `pajānātī”ti.` của chính Pāli (vế `”ti.` đóng ngoặc kép ở đây).
  `:5.4` `Catutthapeyyālo.` ⇒ **Chuỗi lặp thứ tư.** — `peyyāla` dịch *chuỗi lặp* theo
  `sn35.227:1.4` và `sn24.70:3.21`.
  `:6.0` `Tassuddānaṁ` ⇒ **Tóm lược:** (319 lần, đa số toàn tầng).
  `:6.5` `Diṭṭhisaṁyuttaṁ samattaṁ.` ⇒ **Tương Ưng Về Kiến Chấp đã hoàn tất.** — theo đúng công
  thức `Xsaṁyuttaṁ samattaṁ.` đã có 34 tiền lệ, gần nhất cùng phẩm `sn16.13:6.7`
  (*Tương Ưng Kassapa đã hoàn tất.*).

  DẤU LƯỢC: `…pe…` ở `1.4` và dấu `…` trần ở `2.3`, `2.4`, `2.5`, `3.9`, `3.10`, `3.11`, `4.2`,
  `4.3`, `4.4`; mỗi khoá Việt giữ **đúng một** `…`.

