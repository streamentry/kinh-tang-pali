notes: |-
  Tiền lệ đã đếm: khung Niềm tưởng X, này các tỳ-kheo … theo sn46.70 cùng phẩm;
  tưởng vô ngã trong khổ có 6+ lần trong tầng Việt.
  Sujato cho :1.1 là perception of not-self in suffering — khớp Pāli Dukkhe anattasaññā.
  Dấu lược: Pāli …pe… là một dấu lược, Việt giữ một …; không mở rộng công thức lược.
  Không đối chiếu được tầng Việt hiện hành: snapshot đã ghim chỉ có Pháp Cú tiếng Việt,
  nên không có bản Hòa thượng Thích Minh Châu cho Tương Ưng Bộ — giới hạn của upstream.
  Bất định: không có bất định thay đổi nghĩa; đầu đề tưởng đã rõ từ Pāli và Sujato.
