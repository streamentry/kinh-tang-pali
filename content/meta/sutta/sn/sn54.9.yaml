notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato cộng bản lấp English của dự án. Coverage English = 26/26 khoá Pāli có nội dung = 100%.
  TRIANGULATION KHÔNG ĐỘC LẬP: 2 trong 26 khoá Pāli có nội dung (4.4, 4.5) chỉ có tiếng Anh từ bản lấp `content/translation/en/project`, cùng tác giả với bản Việt này. Tiêu chí 6 đặt 8.0. Tầng Việt hiện hành vắng ở commit đã ghim.
  0.1 giữ `Saṁyutta Nikāya 54.9`; 0.2 theo tiền lệ 7 bài cùng phẩm (1. Phẩm Một Pháp, khớp `sn54.1–7`); 0.3 dùng lại nguyên văn `sn35.124:0.3` (cùng tên Pāli `Vesālīsutta`); 1.1 theo tiền lệ 63 khoá; 1.2 theo tiền lệ `sn1.39`.
  13 khoá có PĀLI TRÙNG NGUYÊN VĂN với tệp đã có trong HEAD, dùng lại nguyên văn: 0.2 (3 bài) · 0.3 (`sn35.124:0.3`, cùng tên bài) · 1.1 (63 khoá) · 1.2 (`sn1.39`/`sn1.40`) · 2.1 (`sn4.23:8.1`) · 2.3 (`sn54.11:1.4`) · 2.4 (`sn54.11:1.5`) · 5.4 (`an3.126:3.8`) · 6.2 (`sn21.7:2.2`) · 8.1 (`sn54.1:1.7`/`sn54.3:1.3`/`sn54.4:1.3`) · 8.2 (`sn54.3:1.4`) · 8.3 (`sn54.4:1.5`) · 8.5 (Thứ chín.). Tổng lát c32: 143 cặp.
  Cả khối ānāpānassatisamādhi ở 6.3, 7.2, 7.3, 8.4 dịch định chánh niệm hơi thở, theo `sn54.4` và `sn54.1` (ānāpānassati → chánh niệm hơi thở, 4 bài cùng phẩm). `bhāvito bahulīkato` → được tu tập, làm cho sung mãn; `ṭhānaso antaradhāpeti vūpasameti` → biến mất ngay tại chỗ, làm dịu xuống, theo nguyên văn `sn45.156:1.1` và `sn45.157:1.1`.
  7.1 dùng nguyên văn `sn45.156:1.1` cho cả ví dụ cơn mưa đến muộn giữa mùa hè (Pāli hai khoá này giống nhau tuyệt đối).
  `asubhakathā` → sự quán tưởng bất tịnh, `asubhabhāvanā` → sự tu tập bất tịnh, theo 25 khoá niệm tưởng bất tịnh / bất tịnh trên đĩa. `anekapariyāyena` → nhiều phương diện, theo 3 khoá đã có và đúng nghĩa nhiều mặt của `anekākāra`; `anekākāravokāram asubhabhāvanānuyogamanuyuttā` → chuyên cần tu tập nhiều phương diện của sự quán tưởng bất tịnh.
  BẤT ĐỊNH: `asecanako` 0 tiền lệ trên đĩa. Dịch không chật hẹp trong cụm `santo ca paṇīto ca asecanako ca sukho ca vihāro` → hiền lành và thù thắng, không chật hẹp, đời sống an ổn. Người biên tập nên thống nhất với `an5.x` hoặc `mn` khi dịch.
  `aṭṭīyamānā harāyamānā jigucchamānā satthahārakaṁ pariyesanti` ở 3.3 và 4.4 dịch Kinh kinh dọa, kinh chán ghét và kinh khêu khỉnh thân này, các vị đi tìm lấy vũ khí để tự sát — ba gerund của Pāli giữ đủ ba vế; vế để tự sát theo Sujato (a suicide weapon) vì `sattha` trong mạch văn này không thể là vũ khí thường.
  `bhikkhusaṅgho` dịch đông đảo tỳ-kheo (không phải tăng đoàn) vì đối lập với cá nhân trong câu hỏi của Đức Thế Tôn với Ānanda; `khīṇānirayā` và các loại cõi không có trong bài này nên không dùng.
  Ba dấu lược ở 3.4, 4.5, 8.2 giữ đúng MỘT `…`; 3.4 và 4.5 có Pāli hơi khác nhau nên dịch hơi khác (4.5 có chữ bhikkhū sau vīsampi).
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy; technical_integrity 9.6 vì lát này không tự chạy bốn lệnh đó. Đã tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, và mô phỏng đúng `validateSegmentMap` của `scripts/validate.ts` (tiền tố khoá, orphan, requireComplete, non-Latin) — 316/316 khoá sạch.
