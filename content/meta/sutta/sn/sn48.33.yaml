  - >-
    **Bốn hình dạng `1.4`, không phải ba — tôi dựng tường minh, không dùng chung
    một khuôn.** `sn48.2` có **ba** vế (`assāda … ādīnava … nissaraṇa`) và chủ
    từ là `ariyasāvako` → *bậc Thánh đoàn*; `sn48.3`/`32` có **năm** vế (`thêm
    samudaya … atthaṅgama`) → *bậc Thánh đoàn*; `sn48.4` có **ba** vế nhưng thêm
    `viditvā anupādāvimutto hoti` → *bậc Thánh đoàn*; `sn48.5`/`33`/`27` có
    **năm** vế kèm `viditvā anupādāvimutto` nhưng chủ từ là `bhikkhu` → *vị tỳ-
    kheo*. Bản đầu tôi gộp chủ từ làm một nên `sn48.4` và `sn48.5` lệch nhau ở
    từng chủ từ — đã tách.
  - >-
    `sn48.*:1.4` — `Yato kho, bhikkhave, …` → *Khi này các tỳ-kheo, …*;
    `pajānāti` → *biết rõ như thật sự về …* · `viditvā` → *đã biết rồi* ·
    `anupādāvimutto` → *được giải thoát vì không tham trữ* (0 tiền lệ). ⚠ Bản
    đầu tôi dựng *“biết rõ như thật sự sự thú vị … của chúng … của năm căn này”*
    — lặp hai vế *của* và dính *thật sự sự*; đã tách thành *“biết rõ như thật sự
    về sự thú vị, điều nguy hiểm và sự thoát khỏi của năm căn này”*.
  - >-
    `sn48.32`/`33:1.3` — **0 tiền lệ cho cả danh sách**: `Sukhindriyaṁ,
    dukkhindriyaṁ, somanassindriyaṁ, domanassindriyaṁ, upekkhindriyaṁ` → *Sướp
    căn, khổ căn, hân hoan căn, buồn bực căn, bình thản căn*. `an10.20:10.2`
    dịch cùng bộ này là *lạc / khổ / hỷ ưu đã / xả*; tôi chọn bộ *sướp / khổ /
    hân hoan / buồn bực / bình thản* vì đọc giả hiện đại hiểu ngay và *bình
    thản* đã có tiền lệ cho `upekkhā` (PR #120). **Ghi lại để người biên tập
    cân** khi dịch `sn48.26`/`31`.
  - >-
    `sn48.27:1.5` — Pāli có `‘…’”` (nháy trong nháy kép); tôi giữ đúng hai lớp.
    Sujato bỏ lớp nháy trong.
  - >-
    `sn48.59` — 9 khoá với `1.1` là dòng địa danh vô nháy, khác `sn48.2`–`33` (9
    khoá nhưng `1.1` mở `“`). ⚠ Bản đầu tôi để danh sách `1.4` **chữ thường**
    trong khi Pāli và mọi bài anh em đều **chữ hoa** — đã sửa.
  - >-
    `sn56.26` — **⚠ lệch tiền lệ, tôi theo Pāli.** `samādapetabbā nivesetabbā
    patiṭṭhāpetabbā` là **ba động từ song song, cùng nhận chủ ngữ là “họ”**
    (khuyến hóa, dẫn vào, thiết lập). Bản Anh đọc *“should be encouraged,
    supported, and established”* — cũng là ba động từ song song. Nhưng
    `an3.75:2.1` (đã `published`, PR #117) dịch thành *“nên khuyến hóa, an trú
    và thiết lập họ **trên** ba chỗ này”* — gắn *trên* vào danh từ địa điểm, là
    **sai phép**; tôi dịch *“nên chuyên cần khuyến hóa, dẫn vào và thiết lập họ
    **trong** bốn diệu đế của bậc Thánh”*. **Ghi lại để người biên tập quyết có
    quay lại `an3.75` hay không**; tôi không sửa bản đã xuất bản. `abhisamayāya`
    → *chuyên cần* (0 tiền lệ) · `anukampeyyātha`/`sotabbaṁ maññeyyuṁ` → *mà các
    ông thương tưởng / người nào các ông cho là đáng nghe*.
  - >-
    `sn56.26:3.1` — `‘idaṁ dukkhan’ti yogo karaṇīyo` → *luyện tập ý nghĩ ‘đây là
    khổ’* (0 tiền lệ; `an10.20` dùng *chứng và an trú* cho
    `samaṇavāpaṭisamāpanna`). **9 khoá với `1.1`, `2.1`, `2.2`, `2.3`, `3.1`,
    `3.2`** — hình dạng duy nhất trong 50 bài này, tôi dựng tường minh.
  - >-
