notes: |-
      Nguồn: đúng uid sn24.71, Pāli root bilara đã ghim. Tầng Anh đã ghim là bản Bhikkhu Sujato cùng commit. Tầng Việt hiện hành (Hòa thượng Thích Minh Châu) không có cho bài này vì snapshot upstream chỉ phân phối Pháp Cú — đặc điểm của snapshot, không phải thiếu sót của repo.
      Coverage đo bằng đúng quy tắc trong source/layers.yaml (Pāli có nội dung ≥ 40 ký tự, bỏ khối tham chiếu `:0`): 15/15 segment có tiếng Anh = 100%. Không có mất tầng tham khảo nào.
      Trùng nguyên văn: 17/40 khoá của bài này có Pāli trùng tuyệt đối (sau khi chuẩn hóa khoảng trắng) với khoá đã dịch ở bài khác; dùng lại nguyên văn bản Việt cho 0.2 (sn24.72-95:0.2), 0.3 (sn24.45:0.3), 1.3 (sn24.45:1.3), 1.4 (sn24.3:1.4), 2.2 (sn24.19:2.2), 2.7 (sn24.19:3.8), 2.9/2.11/2.13/2.14/2.19/2.21/2.23/2.24 (mn109:15.2, :15.4, :15.6, :15.7, :16.5, :15.4, :15.6, :15.7), 4.2 (sn22.118:1.15). Trong chính lát này có 3 cặp trùng nội bộ (2.11/2.21, 2.13/2.23, 2.14/2.24) — dịch giống hệt nhau có chủ ý.
      Tiền lệ đo được: `Saṁyutta Nikāya N.N` 1482/1612 bài `sn`; `4. Catutthagamanavagga` → «4. Phẩm Tái Sinh Thứ Tư» 1/1; `Navātasutta` → «Kinh Gió» 1/1; `Taṁ kiṁ maññatha` → «Điều ấy các ông nghĩ sao, này các tỳ-kheo,» 28/31 đoạn khớp trong tầng; cấu trúc ngoặc kép bám sn24.19 (Pāli gần như trùng, bản Việt đó cân 0 trên cả bài).
      Bất định đã ghi, không giấu:
        1) 3.1 và 3.5 — Pāli đặt `evametaṁ yathābhūtaṁ sammappaññāya daṭṭhabbaṁ` SAU trích dẫn `‘netaṁ mama …’`. Giữ nguyên thứ tự đó: «… toàn bộ sắc: ‘cái này không phải của tôi, tôi không phải cái này, cái này không phải tự ngã của tôi’ phải được thấy đúng như thật bằng chánh trí». mn22:27.1 và mn22:27.5 (cùng công thức) đảo hai vế lại thành «… phải được thấy đúng như thật bằng chánh trí: ‘…’»; theo Pāli là bản này, khác một cách đặt vị trí dấu hai chấm.
        2) `sammappaññāya` dịch «chánh trí» theo mn22:27.1/:27.5. Tầng còn có «chánh tuệ» (mn109:13.2, mn109:16.12, mn22:26.1); hai từ dùng xen kẽ, ghi ra để người biên tập gộp nếu muốn thống nhất toàn tầng.
        3) Ngoặc kép: Pāli của bài này dư +5 dấu mở (tính trên mọi khoá), nên không thể sao chép vị trí dấu như nguyên bản — chốt của kho đòi ngoặc kép phải cân trên cả bài. Đặt theo đúng lược của sn24.19 (bài cùng họ, Pāli gần như trùng): 1.2 mở, 1.3 đóng ngoặc kép bao trích dẫn, 1.4 vừa mở vừa đóng; 2.1 mở ↔ 2.7 đóng; 2.8 ↔ 2.9; 2.13 ↔ 2.14; 2.16 ↔ 2.19; 2.23 ↔ 2.24; 3.1 mở ↔ 3.5 đóng; 4.1 mở ↔ 4.2 đóng. Ở 1.3 và 2.14/2.24 chỉ giữ một ngoặc kép đóng như sn24.19:1.3 và mn109:15.7 — đây là quy ước hiện hành của tầng, không phải bỏ chữ trong Pāli.
      Dấu lược: 10 khoá có dấu lược (1.4, 2.2, 2.3, 2.7, 2.16–2.18, 3.2–3.4, 4.1). Mỗi khoá giữ đúng MỘT `…`. Lần review đối kháng bắt được một lỗi thật ở đây: bản nháp đầu tiên thêm `…` vào đầu 4.2 trong khi Pāli 4.2 không lược, làm lệch số dấu — đã bỏ. Bản dịch ở các khoá lược không suy rộng nghĩa: 1.4 là công thức lược vốn vô nghĩa; 2.3–2.5, 2.16–2.18, 3.2–3.4 đều nén những mục đã nêu đủ ở 2.1, 2.8 và 3.1 trong chính bài.
      Kiểm tra: `_hvi.py` bắt được 0 lỗi (40/40 khoá, NFC, ngoặc kép cân, dấu lược khớp từng khoá, không trùng nguyên văn Pāli ở khoá có nội dung, không lọt Pāli). Đã in ra và đọc từng cặp Pāli ↔ Việt.

