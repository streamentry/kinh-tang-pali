notes: |-
  Dịch từ Pāli root (bilara đã ghim), đối chiếu Anh Bhikkhu Sujato. ĐO LẠI: 15/15 khoá Pāli có nội dung đều có chữ Anh ⇒ coverage 1,000. Bài này KHÔNG cần bản lấp Anh của dự án.
  Bản Việt hiện hành (Hòa thượng Thích Minh Châu) không có: tại commit đã ghim tầng `vietnamese-current` chỉ có 26 chương Pháp Cú. Thuật ngữ đối chiếu bằng Pāli + Anh + tiền lệ của tầng dự án.
  0.1 giữ `Saṁyutta Nikāya 24.71` (1612/1613 tệp `sn` giữ Pāli ở `:0.1`; `Saṡyutta` sai dấu = 0 lần). 0.2 và 0.3 dùng lại nguyên văn `sn24.72-95:0.2` và `sn24.45:0.3`. 1.1 theo 63 khoá (Tại Sāvatthī.).
  PĀLI TRÙNG NGUYÊN VĂN: 36/40 khoá có Pāli giống hệt tệp đã có; 35 khoá dùng lại NGUYÊN VĂN bản Việt: 0.2, 0.3, 1.1, 1.3 (`sn24.45:1.3`) · 2.1 (`sn24.18:2.1`) · 2.2, 2.7 (`sn24.19`) · 2.3, 2.6 (`sn24.19`/`sn22.152`) · 2.4, 2.5, 2.9, 2.19 (`sn22.150`) · 2.8 (`sn13.1:1.4`) · 2.10–2.15 và 2.20–2.25 (`sn18.11`) · 2.16 (`sn22.151:1.13`) · 2.17, 2.18 (`sn18.10`) · 3.2, 3.3, 3.4 (`sn22.71`/`sn18.21`) · 4.1 (`sn22.13:1.3`) · 4.2 (`sn22.118:1.15`). Đây là bài có mật độ trùng cao nhất lát (36/40) — vì `sn24.19` và `sn24.45` là hai bài cùng dải, đã publish và chia sẻ nguyên văn.
  LỆCH CÓ CHỦ ĐÍCH, 1 khoá: 1.4 thêm dấu `”` khép so với `sn24.45:1.4`/`sn24.18:1.4`. Pāli để dấu `“` của lời tỳ-kheo treo sang tệp kế (sn24.72) và không khép; nếu bỏ `”` thì tổng nháy của bài lệch +1 và `_hvi.ngoặc()` chặn. `sn24.19:1.4` đã làm y hệt (đóng ngay tại khoá này) nên đây là tiền lệ có sẵn, không phải lựa chọn mới.
  DẤU NHÁY bám đúng nhịp Pāli: 1.2 mở và 1.3 khép (Pāli 1.3 kết `’”ti?`) · 1.4 tự cân (đóng ngay) · 2.1 mở, 2.2 không khép, 2.7 khép (đúng như Pāli: 2.2 không có `”`) · 2.8–2.9 · 2.13–2.14 · 2.16–2.19 · 2.23–2.24 · 3.1 mở và 4.2 khép (Pāli cũng vậy). Tổng cân trên toàn bài, không bao giờ âm.
  BẤT ĐỊNH: `upādāya … abhinivissa` dịch `dựa vào … hướng về` — theo tiền lệ `sn24.18:2.1`/`sn22.152:1.5` đã publish, dù Pāli ở 1.2 khác (`Kismiṁ nu kho …`). Lý do chọn tiền lệ: cùng vị ngữ và cùng bản in `sn24` đã công bố; đổi sang `nắm giữ … bám vào` sẽ tạo thêm một cách dịch cho cùng một công thức. Người biên tập nếu muốn thống nhất theo hướng hiện đại hơn thì phải sửa cả `sn24.18`/`sn24.19`/`sn24.45`.
  BẤT ĐỊNH: 3.1 giữ thứ tự Pāli (`… toàn bộ sắc: ‘Cái này…’ , vị ấy phải thấy như thật bằng chánh tuệ`) khác `sn18.21:1.4` (đặt vế `vị ấy thấy…` lên đầu). Giữ thứ tự Pāli vì đây là câu kết của một danh sách; hai cách đều đúng, người biên tập chọn.
  THUẬT NGỮ đếm được: `thường còn`/`vô thường` cho `niccaṁ`/`aniccaṁ`; `lạc` cho `sukha` (đối xứng `khổ`); `chịu biến đổi` cho `vipariṇāmadhammaṁ` — cả hai đều dùng nguyên văn `sn18.11:1.9/1.20`. `esikaṭṭhāyiṭṭhitā` → `đứng vững như cọc gỗ` (nguyên văn `sn24.19`/`sn24.45`).
  DẤU LƯỢC: 5 khoá có `…pe…` trong Pāli (1.4, 2.2, 2.3, 2.7, 4.1) và 4 khoá lược trần (2.4, 2.5, 2.16, 2.17, 2.18, 3.2, 3.3, 3.4) — tất cả giữ đúng MỘT `…`, không mở rộng, không nén thêm.
  CỔNG KỸ THUẬT: bốn lệnh do coordinator chạy; technical_integrity 9,6. Đã tự kiểm bằng `_hvi.kiểm()` — 40/40 khoá sạch.
