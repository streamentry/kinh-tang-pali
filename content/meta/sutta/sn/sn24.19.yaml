notes: |-
  Dịch từ Pāli root. Tầng Anh của store đầy đủ: Sujato đã ghim phủ 15/16 segment Pāli có nội dung, khoá còn lại (`3.15`) do lớp `english-project` của dự án bù và đã ở trạng thái `published`, nên coverage tính cả hai lớp là **16/16 = 1,0000** — không cần entry trong `content/meta/reference-gaps.yaml`. Ở chỗ bù đó tầng Anh độc lập không có, nên `triangulation` = 9,0 chứ không phải 9,3. Tầng `vietnamese-current` không có cho bài này.
  **Bản song parallel trùng Pāli: 18 khoá, dùng lại y nguyên văn 16.** `sn24.37` (`Rūpīattāsutta`, đã `published`, **cùng phẩm**) cho `1.2`, `1.4`, `2.1`, `2.3`, `2.6`, `3.1`, `3.2`, `3.4`, `3.7`; `sn22.150/151/154/155` cho `2.3–2.5`, `3.9–3.12`. Cụm trích `‘na vātā vāyanti … esikaṭṭhāyiṭṭhitā’` được dịch nhất quán trong toàn bài (7 lần). `Kismiṁ nu kho … evaṁ diṭṭhi uppajjati` → *khi có cái gì, khi dựa vào cái gì, khi hướng về cái gì thì ý kiến như sau khởi lên* (đa số 9 so với 2).
  **Hai chỗ cố ý viết khác, kèm số đếm.** (1) `Bhagavaṁmūlakā no, bhante, dhammā …pe…` — kho có *các pháp lấy Đức Thế Tôn làm gốc* (16) và *những pháp ấy lấy Đức Phật làm gốc rễ* (6); chọn đa số. (2) `Taṁ kiṁ maññatha, bhikkhave` — bản nháp đầu không mở nháy kép ở đây, hậu quả là ngoặc kép lệch; đã thêm `“` cho khớp tiền lệ `sn13.8:1.3`.
  **0 tiền lệ, đặt mới, ghi kèm lý do:** `Vātasutta` → *Kinh Gió* (Sujato *Winds*; `vātasutta` không có trong kho, chỉ có `Vātavalāhakasutta` → *Kinh Mây Có Gió*) · `esikaṭṭhāyiṭṭhitā` → *đứng vững như cọc gỗ* (0 tiền lệ; `esi` = cọc gỗ, `kaṭṭha` = gỗ, `iṭṭhitā` = đã dựng đứng) · `gabbhiniyo vijāyanti` → *người có thai không sinh đẻ* (không thêm chủ ngữ nào ngoài Pāli) · `vipariṇāmadhamma` → *chịu biến hoại* (bám `sn24.37:3.3`).
  **Bất định đã ghi nhận về dấu lược và nháy kép.** (1) Pāli của bài này có **một** dấu `”` thừa (tổng `“` = 10, `”` = 11): `…pe…` nuốt mất nháy đóng của lời thoại ở `1.4` và ở `2.2–2.7`, nhưng `3.5` lại mang `”` không có `“` mở. Bản Việt đóng `”` ngay sau `…` ở `1.4`, đóng nháy ngoài ở `2.7`, và mở nháy ở `3.1`/`3.4` cho hai lời thoại mà Pāli không đánh dấu — nháy kép vì thế **cân** trên cả bài (đo bằng `ngoặc()` của `_hvi.py`). (2) `1.4` giữ **một** `…`; không mở rộng.
  `3.1`–`3.8` và `3.13`–`3.19` là hai vòng hỏi-đáp lặp lại y hệt nhau ở cấp Pāli; giữ nguyên sự lặp, chỉ khác `uppajjati` (khởi lên, thực tế) và `uppajjeyya` (lẽ nào vẫn khởi lên, giả định). `notes` dùng khối literal `|-` thụt 2, đã đọc mẫu đích trước khi ghi. Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` (và `npm run build` vì có bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9.6 chứ không 10.0.
