notes: |-
  Bản dịch mới từ Pāli root (snapshot SuttaCentral/Bilara đã ghim), đối chiếu bản Anh của Bhikkhu Sujato và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không phân đoạn, dùng để tra nghĩa, không căn lề vào segment). Bài: Kinh Núi Vepulla (Vepullapabbatasutta), bài thứ mười và cuối của Phẩm Thứ Hai, Tương Ưng Vô Thỉ (Anamataggasaṁyutta, sn15). 70/70 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli.

  COVERAGE ENGLISH (đo thật): Pāli có nội dung (từ 40 ký tự, bỏ khối :0.x) = 35 khoá. Bản Sujato phủ độc lập 35/35 = 1,000, trên ngưỡng 0,80 của cổng. Các khoá Sujato để trống (3.9, 4.9, 4.10, 8.5, 8.6, 9.0–9.4) đều ngắn hơn 40 ký tự nên nằm ngoài mẫu số; không khoá nào trong 35 khoá có nội dung bị trống. Không có lớp english-project cho bài này nên không khoá nào do dự án tự bù: toàn bộ coverage là English độc lập. Tầng vietnamese-current: không có ở mức segment (bilara tại commit ghim chỉ phân phối Pháp Cú); bản Thích Minh Châu chỉ có dạng nguyên bài, dùng để tra nghĩa.

  BẤT ĐỊNH VÀ CÁC CÂU NGHĨA ĐEN DỄ LỆCH VĂN CẢNH (không thêm vào thân kinh):
  - `muhuttena ārohanti muhuttena orohanti` (5.5): `muhutta` vừa là khoảnh khắc vừa là đơn vị thời gian cố định (khoảng 48 phút). Sujato dịch `an hour`; Thích Minh Châu `thời gian ngắn`. Văn cảnh là đối lập với bốn ngày, ba ngày, hai ngày ở các đoạn trên, nên điều chắc chắn là một khoảng rất ngắn. Bản Việt viết `một khoảnh khắc` theo tầng (các khoá `muhuttena` đã dịch đều là `khoảnh khắc`). Không phân xử được là một giờ hay chớp mắt; ghi bất định.
  - Cụm `‘x’tveva samaññā udapādi` (2.3, 2.4, 3.1, 3.2, 4.1, 4.2, 5.1, 5.2): `tveva` = `tu eva`, nhấn mạnh tên gọi. Bản Việt viết `có tên gọi là ‘X’`, không thêm chữ `chỉ`; Sujato `was known as`, Thích Minh Châu `được biết với tên là`. Nháy đơn giữ đúng như Pāli (mỗi khoá một cặp).
  - Tên nhóm người: `tivarā`, `rohitassā`, `suppiyā`, `māgadhakā` dùng dạng gốc `Tivara`, `Rohitassa`, `Suppiya`, `Māgadhaka` (Sujato `Tivaras`, `Rohitassas`; Thích Minh Châu `Tivàrà`, `Rohita`, `Suppiya`, `Magadhaka`). Ở kệ 7.4 Pāli viết `māgadhānañca` (không có `ka`) nên bản Việt viết `Māgadha`, giữ đúng sự khác nhau của Pāli. Tầng dịch `māgadhaka` ở các bài khác là `Magadha` (không dấu); ở đây giữ dấu vì đây là tên gọi nêu bằng nháy đơn.
  - `sāvakayugaṁ aggaṁ bhaddayugaṁ` (2.8, 3.6, 4.6, 5.7): `một đôi đệ tử tối thắng, hiền thiện`, dùng lại nguyên văn tiền lệ `dn14:1.9.4` (cùng Pāli) cho 2.8; 3.6 và 4.6 cũng trùng nguyên văn Pāli với `dn14:1.9.5` và `dn14:1.9.6` (mỗi khoá 1 tiền lệ). Đôi đệ tử Koṇāgamana là `Bhiyyosa và Uttara` (Pāli `bhiyyosuttaraṁ`, tiền lệ `dn14` và Sujato); Thích Minh Châu viết `Bhìyya và Suttara`, tách khác. `tissabhāradvājaṁ` → `Tissa và Bhāradvāja` (Sujato; Thích Minh Châu `Tissa và Bharadvāja`). `vidhurasañjīvaṁ` → `Vidhura và Sañjīva` (Thích Minh Châu `Vidhura và Sajìva`).
  - Số: `cattārīsa vassasahassāni` = 40 × 1.000 = 40.000 năm; `tiṁsavassasahassāni` = 30 × 1.000 = 30.000 năm; `vīsativassasahassāni` = 20 × 1.000 = 20.000 năm (khớp `dn14` cho Kakusandha 40.000, Koṇāgamana 30.000, Kassapa 20.000, và khớp Sujato). `catūhena` = bốn ngày; `tīhena` = ba ngày; `dvīhena` = hai ngày (hình thức công cụ cách của `catu-aha`, `ti-aha`, `dvi-aha`; Sujato `four days`, `three days`, `two days`). `vassasataṁ` = một trăm năm. Không có số lớn nào chưa phân xử được.
  - `anassāsikā` (2.12, 5.11): `không đáng nương tựa` theo `dn16` (`evaṁ anassāsikā kho, ānanda, saṅkhārā` → `các hành không đáng để nương tựa như vậy`); Sujato `unreliable`; tầng cũng có `không đáng tin cậy` ở `mn76` cho cùng gốc từ. Chọn `nương tựa` theo dòng `saṅkhārā` của `dn16`/`sn6.15`.
  - Bản Việt kết 2.13 và 5.12 `Như vậy, này các tỳ-kheo, là đủ để các ngươi chán nản trong mọi hành, đủ để ly tham, đủ để giải thoát.` Pāli có `bhikkhave`; hai khoá trùng Pāli ở `sn15` đã viết `Như vậy là đủ để các ngươi chán nản…` (bỏ lời gọi), một khoá có Pāli gần trùng (không dấu phẩy) dịch có lời gọi (`sn15.1`: `Như vậy, này các tỳ-kheo, là đủ để các ông…`). Giữ đại từ `các ngươi` theo hai khoá trùng (và `sn15.5`, `sn15.19`), nhưng bổ sung `này các tỳ-kheo` vì Pāli có `bhikkhave`: đây là một khoá khác tiền lệ có chủ ý (1 cặp Pāli trùng ngoài bài mà Việt khác, xem dưới).
  - Hai khoá có `…pe…` (3.8 `Evaṁ aniccā, bhikkhave, saṅkhārā …pe…`; 4.9 `evaṁ addhuvā, bhikkhave, saṅkhārā …pe…`): mỗi khoá giữ đúng một `…` và dịch phần Pāli còn lại (3.8 chỉ `…` sau `saṅkhārā`, 4.9 sau `addhuvā…saṅkhārā`), khoá tiếp theo `alaṁ vimuccituṁ` → `đủ để giải thoát.` Không bung `…pe…` thành văn.
  - `Passatha` (2.9, 3.7, 4.7): mệnh lệnh số nhiều `Hãy xem`; Thích Minh Châu `Hãy nhìn xem`, Sujato `See`. Mệnh đề `sā cevimassa pabbatassa samaññā antarahitā` là `tên gọi ấy của ngọn núi này đã biến mất`; ở 5.8 `yā ayañcevimassa pabbatassa samaññā` là `cái tên này của ngọn núi này` (`ayañca` chỉ tên hiện thời, khác `sā` chỉ tên xưa).
  - `Aniccā vata saṅkhārā` (8.1): `Ôi, các hành là vô thường` theo kệ đã dịch ở `sn1.11`, `tha-ap21`, `ja95` (cùng ba dòng `uppādavayadhammino`, `uppajjitvā nirujjhanti` → `bản chất là sinh, diệt`, `đã sinh ra rồi chấm dứt`). Dòng 8.4 `tesaṁ vūpasamo sukho` → `sự lắng yên của chúng là an lạc` theo `dn16` và `dn17` (2 khoá cùng Pāli); `ja95` viết `hạnh phúc`.
  - Uddāna 9.1–9.4 (`Duggataṁ sukhitañceva, tiṁsa mātāpitena ca; Bhātā bhaginī putto ca, dhītā vepullapabbataṁ`): tên các bài sn15.11–15.20 theo nghĩa Pāli (`duggata` nghèo khổ; `sukhita` vui sướng; `tiṁsa` ba mươi [tỳ-kheo]; `mātā-pitā` mẹ và cha; `bhātā` anh em trai; `bhaginī` chị em gái; `putto` con trai; `dhītā` con gái; `vepullapabbata` núi Vepulla). Viết hoa từng đề mục theo `sn15.10:8.1–8.4`. Lưu ý ngoài lát: tên dịch của `sn15.11` đang là `Kinh Điều Lành Bẻ` (không khớp `duggata` = nghèo khổ); chỉ báo, không sửa vì ngoài phạm vi.
  - Kết tương ưng 9.5 `Anamataggasaṁyuttaṁ samattaṁ`: tầng chưa có tên Việt cho `sn15`. Dùng `Tương Ưng Về Khởi Đầu Không Được Biết Đến` (cùng khuôn `Tương Ưng Về Kiến Chấp`, `sn24.96:6.5`; cùng nghĩa `anamatagga` = không có khởi đầu được biết đến như đã chọn cho `sn15`). Thích Minh Châu dùng `Tương Ưng Vô Thỉ`. Tên này là lựa chọn biên tập; người biên tập nên thống nhất tên tương ưng trên toàn `sn15`.
  - Xưng hô và công thức mở: 1.1–1.5 dùng lại nguyên văn `sn15.10:1.1–1.5` (cùng Pāli, cùng khung Rājagaha, Gijjhakūṭa); 2.1–2.2 dùng lại `sn15.19:1.2–1.3` (cùng Pāli); 6.1 `Đức Thế Tôn đã nói như vậy.` theo `sn15.10:3.1` và `sn15.13:4.1` (185 khoá cùng Pāli ở tầng: `Đức Phật đã nói như vậy` 104, `Đức Thế Tôn nói như vậy` 30, `Đức Thế Tôn đã nói như vậy` 27; chọn dạng 27 vì cả hai bài `sn15` lân cận dùng dạng đó); 6.2 `Nói xong, bậc Thiện Thệ, bậc Đạo Sư, lại nói thêm:` theo `sn15.10:3.2` (44 khoá cùng Pāli: `Nói như vậy xong…lại nói thêm` 16, `Nói xong…lại nói thêm` 7; chọn dạng của bài `sn15` lân cận).
  - Dấu nháy: nháy kép: 1.3 và 1.4 mỗi khoá một cặp (lời gọi và lời đáp); mở ở 2.1 (lời Đức Thế Tôn) và đóng ở 5.12; mở ở 7.1 (kệ) và đóng ở 8.4. Nháy đơn mỗi khoá là một cặp, khớp Pāli. Khớp Pāli từng khoá, 0 lệch trên 70 khoá.

  TIỀN LỆ DÙNG LẠI NGUYÊN VĂN: 20 Pāli (khác nhau) của bài có khoá trùng nguyên văn ở nơi khác trong tầng; 19/20 dùng lại nguyên văn bản Việt đã có, 1/20 khác (5.12, lý do ở trên). Các khoá dùng lại: 1.1–1.5 (`sn15.10:1.1–1.5`), 2.1–2.2 (`sn15.19`), 2.8 (`dn14`), 3.6 và 4.6 theo cùng Pāli ở `dn14` (cùng `sāvakayugaṁ`), 6.1–6.2, 8.2–8.4, 8.5–8.6 (`Thứ mười.`, `Phẩm thứ hai.`), 9.0 (`Tóm lược:`), 0.2 (`2. Phẩm Thứ Hai`). Khoá 5.3–5.4 không trùng nguyên văn nhưng dùng cụm `ít ỏi, ngắn ngủi, nhỏ nhoi` và `ai sống lâu thì được trăm năm, hay hơn chút ít` đã dịch ở tầng cho cùng cụm Pāli (3 khoá). Trong chính bài có 5 nhóm Pāli trùng nguyên văn (2.9/3.7/4.7; 2.10/4.8/5.9; 2.11/5.10; 2.12/5.11; 3.9/4.10); bản Việt giống nhau trong cả 5 nhóm, 0 nhóm lệch. Hai khoá 2.13 và 5.12 khác nhau chỉ ở dấu đóng nháy kép, đúng như Pāli.

  Kiểm tra đã làm: tập khoá 70/70 khớp Pāli, thứ tự khớp; dấu nháy kép và nháy đơn khớp Pāli từng khoá (70 khoá, 0 lệch); dấu lược `…` cân bằng Pāli từng khoá (2 khoá `…pe…`, 0 lệch); NFC; không khoá rỗng; không khoảng trắng thừa; không Pāli lọt sang Việt ngoài tên riêng; đã in cặp Pāli với Việt từng khoá để đọc.

  technical_integrity 9,6 vì các lệnh cổng kỹ thuật của dự án chưa được chạy trong lát này: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Người điều phối chạy bốn lệnh này trước khi hợp nhất; chỉ khi cả bốn pass mới coi tiêu chí kỹ thuật là đạt hoàn toàn.
