notes: |-
  Đợt 19, lane 38. Dịch trọn 136 khoá từ Pāli root ở commit đã ghim; đối chiếu English Sujato đã ghim, lớp english-project của bài, bản Hòa thượng Thích Minh Châu nguyên bài (tra cứu toàn văn, không phân đoạn, không phải tầng store) và kinh song song mn59 (cùng nhân vật, cùng đề tài). Thứ tự và tập khoá khớp Pāli; không có khoá ngoài Pāli.

  **Coverage English trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): Sujato 80/87 = 0,920**, trên sàn 0,80 nên không cần ghi nhận gap. Bảy khoá Pāli có nội dung mà Sujato để trống là 2.4, 2.10, 3.4, 3.10, 5.7, 5.8, 5.9; cả bảy chỉ lặp lại lời đã có ở 1.4, 1.10 và dải số 5.3. Lớp english-project đã lấp cả bảy khoá (87/87 = 1,000) nhưng đó không phải bản đọc English độc lập nên cổng chỉ dựa vào con số của Sujato. Tầng Việt hiện hành phân đoạn của bài này: không có tại commit đã ghim; chỉ có bản Hòa thượng Thích Minh Châu nguyên bài để tra cứu. `triangulation` đặt 9,2: ba nguồn độc lập đã đọc (Pāli, Sujato 92%, Thích Minh Châu nguyên bài) nhưng 7 khoá lặp không có English độc lập.

  Số Pāli, tự tính: `dve` 2 · `tisso` 3 · `pañca` 5 · `cha` 6 · `aṭṭhārasa` 8 + 10 = 18 · `chattiṁsā` 6 + 30 = 36 · `aṭṭhasata` 8 + 100 = 108 (tầng viết «một trăm linh tám» ở 20 khoá, «lẻ tám» ở 2 khoá). Bản Việt: hai, ba, năm, sáu, mười tám, ba mươi sáu, một trăm linh tám. Bản Thích Minh Châu nguyên bài ghi «16 thọ» ở đoạn này; Pāli là `aṭṭhārasa` = 18 nên không theo. Không có số lớn nào khác.

  Dấu lược: duy nhất 6.3 có `…pe…` (lược ba căn giữa tai–mũi–lưỡi), Việt giữ đúng một `…` và kết « …»; Pāli không có `(…)` nên không có. Nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá (31 khoá có nháy; nháy kép mở ở 5.1 đóng ở 16.6 cùng nháy đơn). Pāli trùng nguyên văn trong chính bài: 16 nhóm, 271 cặp, bản Việt giống nhau ở cả 16 nhóm.

  Tái dùng tầng, đo trên Pāli trùng (bỏ dấu câu): 89 khoá có Pāli trùng ở nơi khác; dùng lại nguyên văn 63, khác 26. Phần khác, có lý do: (a) 1.4, 2.4, 3.4 — tầng có 6 khoá cho `adukkhamasukhā vedanā` là «vừa khổ vừa dễ chịu» (sn36.17/18 và hai kinh khác), nhưng cụm đó dễ đọc thành «vừa khổ vừa lạc», ngược nghĩa `adukkham-asukhā`, nên dùng «không khổ không lạc» như mn59:1.6 và như ở thiền thứ tư; (b) 1.9, 2.9, 3.9 — mn59 dùng «cảm thọ đau khổ» (20 khoá) còn tầng dùng «cảm thọ khổ» (58 khoá), theo tầng; (c) 1.6, 2.1, 2.6, 3.1, 3.6, 3.12 — thêm «thợ cả»/«Tôn giả» vì mn59 lược `thapati`/`āyasmā`; (d) 2.2, 2.3, 3.2, 3.3 — chỉ khác dấu cuối khớp Pāli (dấu chấm thay dấu chấm phẩy); (e) 5.4–5.9 — «theo một cách trình bày», không theo «phương tiện» của sn36.20/22, để cùng khối với 5.10 và 5.12 dùng nguyên văn mn59:5.3 «theo nhiều cách»; (f) 6.5 — «năm dục trưởng dưỡng» (xem thuật ngữ); (g) 16.4 — không dùng «các ông» của mn59 vì `evamassu vacanīyā` là thể bị động, không có chủ thể «các ông» và Ānanda chỉ là một người; 16.5–16.6 Pāli khác mn59 và sn36.20 nên viết mới.

  Thuật ngữ, có số đếm: `thapati` → «thợ cả» (mn59, 19 khoá) trong khi mn78/mn127 dùng «đốc công» (73 khoá); chọn theo kinh song song mn59, **phân kỳ cần thống nhất ở cấp tầng**. `bhagavā` → «Đức Phật» (theo mn59 cho Pāli trùng) trong khi sn36 có «Đức Thế Tôn» ở 25 trong 27 khoá nói về `bhagavā`; đây cũng là một phân kỳ. `pariyāya` → «cách (trình bày)» (tầng 123 khoá) so với «phương tiện» (68 khoá, gồm sn36.20/22). `kāmaguṇā` → «dục trưởng dưỡng» (sn 36 khoá, «dục công đức» 14; sn36.20 cùng dùng «dục trưởng dưỡng»). `sukhaṁ somanassaṁ` → «lạc và hỷ» (10 khoá; tầng còn «vui» 35 và «sướng» 20 là cách khác); `somanassadomanassa` → «hỷ và ưu» (21 khoá, «hỷ ưu» 19); `pītiyā virāgā` → «hỷ phai nhạt» (43 khoá, «ly hỷ» 19). `vitakkavicārānaṁ vūpasamā` → «lắng dịu» (78 khoá). `ajjhattaṁ sampasādanaṁ cetaso ekodibhāvaṁ` → «nội tâm lắng trong, tâm hợp nhất» là cụm đầy đủ phổ biến nhất của tầng (11 khoá). `ācikkhanti` → «nói» (21 khoá). `abhikkantatara` / `paṇītatara` → «cao hơn» / «vi tế hơn» theo mn59 (9 khoá Pāli trùng). `nevasaññānāsaññāyatana` → «Phi tưởng phi phi tưởng xứ» (quy ước tầng, 168 khoá). Tên thiền «sơ thiền … tứ thiền» theo mn59 và sn36.31 (tầng chia 66 «sơ thiền» / 79 «thiền thứ nhất»); «chứng và trú» theo mn59. Tiêu đề `Pañcakaṅgasutta` → «Kinh Pañcakaṅga» (tên riêng, như «Kinh Ānanda»); 0.2 theo 9 khoá cùng Pāli ở sn36.12–18. Lưu ý ngoài lát: uddāna ở sn36.20:3.4 gọi bài này là «bài Người Năm Chi», khác tên riêng ở đây.

  Bất định, không đưa vào thân kinh:
  (1) 6.9, 7.5, 8.5, 9.5, 10.5, 11.5, 12.5, 13.5, 14.5: `etapparamaṁ santaṁ sukhaṁ somanassaṁ paṭisaṁvedentī`. mn59 ở cùng đoạn đọc `etaparamaṁ sattā sukhaṁ somanassaṁ …` (`sattā` = chúng sinh); bản Pāli ghim ở sn36.19 đọc `santaṁ` ở cả 9 khoá, không có `sattā`. Sujato dịch "that sentient beings experience" và Hòa thượng Thích Minh Châu dịch «chúng sanh cảm thọ» — cả hai thêm «chúng sinh» mà Pāli khoá này không có chữ. Bản này dịch sát chữ: `santaṁ` = «có thật» (cùng nghĩa `santa` ở 5.1), động từ số nhiều không nêu chủ ngữ nên «người ta». Cách đọc khác: `santaṁ` là biến thể của `sattā`, hoặc `santa` = «yên tĩnh» (như ở 1.10) bổ nghĩa cho `sukhaṁ`. Chưa phân xử được; ý chung của câu (đó là mức cao nhất, và Đức Phật không chấp nhận) không đổi giữa các cách đọc.
  (2) 5.1, 5.2: `santameva … pariyāyaṁ` / `santañca … pariyāyaṁ` dịch «một cách trình bày vốn đúng thật / đúng thật»; Sujato "quite correct", mn59 «đúng», Thích Minh Châu «dầu thật có pháp môn». `-eva` dịch «vốn».
  (3) 1.10, 2.10, 3.10: `santasmiṁ esā paṇīte sukhe` (định vị cách) dịch «xếp nó vào loại lạc yên tĩnh và vi tế» theo mn59:1.12 và Sujato.
  (4) 5.3–5.9: mỗi câu có `-pi` («cũng») và `pariyāyena` (cách trình bày); Pāli không nói «một cách khác» nên không thêm «khác».
  (5) 6.3: `…pe…` lược các căn giữa; không bổ sung phần đã lược.

  Kiểm kỹ thuật: bị cấm chạy cổng nên `technical_integrity` đặt 9,6, KHÔNG tuyên bố technical gate pass. Còn phải chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; ngoài ra cần `npm run reference:gaps` để xác nhận không còn record độ phủ thừa cho bài này.
