    0 tiền lệ, đặt mới: `Paṭhamasamaṇabrāhmaṇasutta` → *Kinh Sa-môn Bà-la-môn (Nhất)* (kho đang không thống nhất dãy này: `sn36.27` ghi *Kinh Sa-môn Bà-la-môn Về Ba Thọ*, `sn36.28` *Kinh Sa-môn Bà-la-môn (Hai)*, `sn36.29` *… Thứ Ba*, còn `sn22.31/32` ghi *Kinh Ô Nhiễm* — *Ô nhiễm* là `mala`, không phải `samaṇa-brāhmaṇa`). **Người biên tập nên chọn một cách cho toàn bộ các bài `samaṇabrāhmaṇa`.**
  - >-
    Đặc thù tầng Pāli: `2.4` là `cittasamādhi …` (dấu lược **trần**, không phải `…pe…`) trong khi `sn51.5:2.4` là `cittasamādhi …pe…` — khác nhau ở tầng chụp, bản Việt vẫn một dấu `…` ở cả hai nên đọc không lệch.
