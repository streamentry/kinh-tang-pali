notes: |-
  Soạn từ Pāli root, đối chiếu Anh Sujato (27/29 khoá; thiếu 4.11 Pañcamaṁ là mốc
  kết cấu và 4.5 do tầng english-project lấp) và bản Việt sn12.57 song sinh cùng phẩm.
  Tiền lệ đếm được: Saṁyutta Nikāya giữ nguyên (1187 tệp so với 315 Tương Ưng Bộ);
  6. Phẩm Khổ (5); quán vị ngọt/nguy hại, ái làm duyên, tập khởi/đoạn diệt khối khổ (sn12.57
  nguyên văn); cuốc và giỏ; rê tro trước gió mạnh; gốc cây thốt nốt (sn12.57:4.4).
  0 tiền lệ: Kinh Cây Lớn (mahārukkha; chỉ có taruṇa→Non ở sn12.57); oja→nhựa;
  usīranāḷi→cọng cỏ (tránh Pāli lọt). Pāli 4.4 dừng ở phơi khô, không kéo đốt/rê tro
  của 4.5 vào như bản Anh (giữ fidelity theo Pāli).
