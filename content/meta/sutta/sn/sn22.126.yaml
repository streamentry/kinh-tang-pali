notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 18/26 = 69,23%**, dưới ngưỡng 0,8; xem `blocking_errors`. Tầng `english-project` không có cho uid này. Tầng Việt hiện hành vắng ở commit đã ghim: bilara chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **16 khoá có Pāli trùng nguyên văn ở bài khác; 12 cặp dùng lại NGUYÊN VĂN.** `0.2` theo 9/9 (13. Phẩm Vô Minh) · `0.3` theo `sn23.21:0.3` (Kinh Những Pháp Sinh Khởi) — nhưng bài liền kề **cùng phẩm** `sn22.127:0.3` dùng *Kinh Pháp Sanh Khởi (Hai)*, tức họ đặt tiêu đề theo cặp Paṭhama/Dutiya chứ không theo bản dịch ở `sn23.21`; tôi theo cặp để `sn22.126` và `sn22.127` khớp nhau · `1.1` trùng 441 bản (Tại Sāvatthī.) · `2.7` trùng `sn22.127:2.3` · `3.1` trùng `sn45.7:3.1` · `4.16` trùng 287 bản (Thứ nhất.).
  [Đã bị thay thế bởi mục "Giải quyết draft 2026-10-12": `vijjā` nay dịch *minh*; các câu về `kittāvatā`/`ettāvatā` và nháy đơn cũng đã đổi.] ~~`vijjā` dịch *tri kiến*~~ — lập luận cũ: Tám bản trùng nguyên văn ở `1.5`/`3.4` chia làm ba nhánh: *đã đi đến chỗ nào của vô minh* (`sn22.131`, `sn22.113`), *và đến mức nào thì đi đến vô minh* (`sn22.135`), và *vị ấy được gọi là người vô minh đến mức nào* (`sn22.133`). Tôi theo `sn22.133` vì đó là cách duy nhất đọc được với người Việt hiện đại mà vẫn giữ đủ nghĩa của `kittāvatā … avijjāgato hoti`; hai cách còn lại là calque nặng. Với `vijjā` thì tôi theo **uddāna ngay trong Tương Ưng này** (`sn22.125:3.1` *Avijjā vijjā …* → *Vô minh, tri kiến, …*) thay vì *hiểu biết* của `sn22.114` hay *minh* của `sn22.135` — đó là bằng chứng trong chính bộ cho tới nghĩa của từ.
  **Còn 2 khoá có tiền lệ nhưng tôi dịch khác, ghi lý do.** `2.14`/`4.14` (`Ayaṁ vuccati, bhikkhu, avijjā;`) trùng `sn22.113:1.12` (*Đây, thầy tỳ-kheo, được gọi là vô minh;*); `thầy tỳ-kheo` ở đó là cách gọi riêng của một bài khác, còn khuôn dùng chung của tầng là `an4.14:1.13` nên tôi dịch *Cái này, này tỳ-kheo, được gọi là vô minh;*. `1.4`/`3.3` (`Katamā nu kho, bhante, avijjā;`) có hai tiền lệ (*Vô minh nào, bạch Thế Tôn,* và *Thế nào là vô minh, bạch Thế Tôn;*) — tôi chọn *Vô minh là gì, bạch Thế Tôn,* cho cân với *Sādhu, này các tỳ-kheo* ở `an5.178`.
  **Nhãn.** `‘avijjā, avijjā’ti` và `‘vijjā, vijjā’ti` được Pāli đánh dấu bằng nháy đơn bên trong lời thoại; theo đúng tiền lệ của tầng, tôi **không lồng nháy** vào trong lời thoại vốn đã mở, mà để thành chữ thường — giữ đúng số từ, không thêm và không bớt ý.
  **Dấu lược.** `1.2` giữ đúng **một** dấu `…` cho `…pe…`. Ở `2.7` và `4.7` tôi dịch đủ `Samudayadhammaṁ saññaṁ` thành *Tưởng có tính sanh khởi* rồi giữ **một** dấu lược (`…pe…` ở `2.7`, dấu lược trần ở `4.7`), **không mở rộng** danh sách `vayadhammaṁ …` vốn bị lược. Sujato ở hai khoá đó chỉ dịch *perception …* và bỏ rơi phần bị lược; tôi dịch nghĩa rồi giữ lược, không mở rộng và không bịt.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  **Giải quyết draft 2026-10-12.** Blocker duy nhất (coverage Anh Sujato 18/26 = 69,23% dưới 0,8) thuộc loại mất mát tầng tham khảo, không phải lỗi văn bản, nên đã gỡ; mất mát được ghi nhận ở `content/meta/reference-gaps.yaml` (tệp do `npm run reference:gaps` sinh). Sujato để trống 8 khoá `2.5`, `2.6`, `2.9`, `2.10`, `4.5`, `4.6`, `4.9`, `4.10` — đều là các câu lặp công thức (hoại diệt / sanh-diệt của thọ và hành). Đã đọc từ Pāli: mỗi câu chỉ là `X-dhammaṁ + danh từ + ‘…’ti yathābhūtaṁ (na) pajānāti`, cùng khuôn với các khoá `2.1`–`2.3`, `2.11`–`2.13` mà Sujato có dịch; không còn nghĩa nào chưa chắc, nên bản Việt tự đứng vững. `triangulation` giữ 8,0 (không cao hơn); tầng `vietnamese-current` vắng cho SN (giới hạn tham chiếu, không phải lỗi văn bản).
  Sửa văn bản (đo tiền lệ trên tầng): (1) `vijjā` *tri kiến* → *minh* (`3.2`–`3.4`, `4.14`, `4.15`) — tiền lệ tầng cho `vijjā` là *minh* (đa số áp đảo: ≈245 khoá có *minh*; *tri kiến* chỉ 13 khoá, đều do chính tác giả bài này và bài kề), glossary đặt `avijjā`↔`vijjā` = *vô minh*↔*minh*, và `sn22.128`/`sn22.134`/`sn22.135` cùng Tương Ưng đều dùng *minh*; uddāna `sn22.125:3.1` không phải căn cứ vì do cùng tay dịch. (2) `1.5`/`3.4`/`2.15`/`4.15` (`kittāvatā`/`ettāvatā ca avijjāgato/vijjāgato hoti`): bỏ *được gọi là người … đến mức* (Pāli không có `vuccati` ở đây, thêm nghĩa) và theo khuôn đa số của tầng *và đến mức nào thì đi đến vô minh / minh?* (4–5 tiền lệ nguyên văn), `ettāvatā` → *đến mức này*. (3) Nháy đơn của Pāli được khôi phục cho `1.3`, `3.2` và 24 khoá công thức `2.x`/`4.x` (*là ‘sắc có tính sanh khởi’*…), thay cho quyết định cũ không nháy; khớp tiền lệ `sn22.127:1.3`. (4) `1.2` *Rồi có vị tỳ-kheo* → *Rồi một vị tỳ-kheo* (khuôn đa số trong các tiền lệ nguyên văn của tầng). (5) `4.1` *đã học biết rõ* (đọc nhập nhằng) → *đa văn biết rõ*, theo `sutavā ariyasāvako` = *đa văn* ở tầng. Số khoá sửa: 33/43; không có lỗi sai nghĩa nặng, đây là sửa thuật ngữ, khuôn câu và nháy. Số Pāli: không có số cần tính. Bài không có cặp Pāli trùng nội bộ nào mà Việt khác (các cặp `2.x`/`4.x` khác nhau ở `nappajānāti`/`pajānāti`, đã đối chiếu từng cặp). Cổng kỹ thuật vẫn do coordinator chạy: npm run validate; npm test; npm run check; npm run build.
