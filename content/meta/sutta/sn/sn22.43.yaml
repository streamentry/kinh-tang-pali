notes: |-
  Soạn từ Pāli root, đối chiếu Anh Sujato (24/29; 2.7/2.8/3.4/3.7 do english-project
  lấp, 3.10 Paṭhamaṁ là mốc kết cấu). Không có bản Việt Thích Minh Châu.
  Tiền lệ: 5. Phẩm Tự Mình Là Hòn Đảo (4, hơn Hòn Đảo Tự Thân 1 và Tự Mình Làm Hòn Đảo 1);
  Tại Sāvatthī; kẻ phàm phu không học + chuỗi không thấy/không thuần thục/không tu tập
  (sn22.44:1.5 nguyên văn); quán sắc như là tự ngã 4 cách (sn22.44:1.6); sầu-bi-khổ-ưu-não;
  thấy đúng như thật bằng trí tuệ chân chánh; Hãy lắng nghe (31).
  0 tiền lệ: attadīpa→hòn đảo (theo tên phẩm đa số); yoni upaparikkhitabbā→khéo quán xét
  cội nguồn; vipariṇamati aññathā→biến hoại, trở thành khác; tadaṅganibbuto→đã tịch tịnh
  trong phần ấy. 2.8 Pāli lược giữa hợp phần (sokaparideva …pe… pāyāsā) nên Việt giữ
  một … đúng chỗ (sầu, bi … não).
