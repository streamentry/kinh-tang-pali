notes:
  - >-
    Tên bài `Dutiyaabhisandasutta` → *Kinh Phước Báu Tràn Đầy (Hai)*. `sn55.41:0.3` là *Kinh Phước Báu Tràn Đầy (Nhất)* và `sn55.43:0.3` là *… (Thứ Ba)*, nhưng đa số tầng (102 lần) và chính SN55 (`sn55.32:2.1`, `sn55.45:0.3` *Kinh Giàu Có (Hai)*) dùng `(Hai)`, nên chọn `(Hai)`. **Người biên tập nên gộp `sn55.41/43` cho cùng một cách** — hiện SN55 đang lẫn ba cách. Tên phẩm `Sagāthakapuññābhisandavagga` → *5. Phẩm Người Hiện Kinh Gặp Gác Công Đức* khớp Pāli tuyệt đối với `sn55.41:0.2` và `sn55.43:0.2`.
  - >-
    Đây là **bản thứ hai của cùng một bài** (`sn55.41` là bản nhất): Pāli giống nhau ở phần lớn các đoạn, chỉ khác ở dấu câu và ở hai chỗ thật sự khác nội dung — `3.1` (bản nhất nói về giới bổn phước `ariyakantehi sīlehi`, bản này nói về tâm không nín khi sống tại gia) và ví dụ `5.1–5.2` (bản nhất lấy biển bắc `mahāsamudde`, bản này lấy năm con sông hội tụ).
  - >-
    **28 khoá có Pāli trùng nguyên văn và dùng lại nguyên văn** — nhiều nhất trong lát (đo bằng script, đã loại lát này khỏi chỉ mục): `0.2` (tên phẩm) · `1.1` ← `sn55.41:1.1` · `1.2` ← `sn55.41:1.2` · `1.3` ← `sn55.12:3.3` · `1.4` ← `sn55.11:2.4` · `2.1`, `2.2` ← `sn55.32:2.1–2.2` · `3.1` ← `sn55.32:3.1` · `3.3` ← `sn55.41:3.3` · `4.1`, `4.2`, `4.3` ← `sn55.41:4.1–4.3` · `5.3`, `5.4`, `5.5`, `5.6`, `5.7` ← `sn55.41:5.2–5.6` · `5.8`, `5.9` ← dựng từ `sn21.5:1.7–1.8` (`Idamavoca bhagavā … satthā:`) · `6.1`, `6.2` ← `sn55.41:7.1–7.2` · `6.3`, `6.4` ← `an4.51:7.3–7.4` (trùng `sn55.41:7.3–7.4`) · `7.1`, `7.2` ← `sn55.41:8.1–8.2` · `7.3`, `7.4` ← `an4.51:8.3–8.4` · `7.5` ← `an10.102:1.11` (*Thứ hai.*). Không trùng byte: `1.5` và `3.2` (xem ghi chú kế bên); `0.1` và `0.3` là tiêu đề.
  - >-
    **Sai lệch có chủ ý so với dùng lại nguyên văn:** `1.5` và `3.2` trùng Pāli tuyệt đối với `sn55.32:1.5` / `:3.2` (*dòng phước chảy tràn*) nhưng **không** dùng, mà theo `sn55.41` (*nguồn phước báu tràn đầy … mang lại hạnh phúc*). Lý do: `sn55.42` còn `1.1`, `3.3`, `4.2`, `4.3`, `5.6`, `5.7` trùng Pāli với `sn55.41` và phải dùng nguyên văn của nó; nếu `1.5`/`3.2` dùng *dòng phước chảy tràn* thì cùng một bài sẽ dùng hai tên cho một thứ. Ghi ở đây để người biên tập biết.
  - >-
    Bất định đã ghi: (a) `5.1–5.2` là phần **không có tiền lệ** — `sn55.41:5.1` dùng `mahāsamudde` (biển bắc) chứ không phải năm con sông, nên phải dịch riêng: *có những dòng sông lớn gặp nhau, hội tụ về chỗ này—* rồi liệt kê *dòng Gaṅgā, dòng Yamunā, dòng Aciravatī, dòng Sarabhū, dòng Mahī*. Năm tên sông đều đã có trong tầng Việt. (b) `3.1` `muttacāgo payatapāṇi vossaggarato yācayogo dānasaṁvibhāgarato` dùng nguyên văn `sn55.32:3.1`; Sujato dịch rộng hơn (*freely generous, open-handed, loving to let go…*), nhưng không thêm ý. (c) `5.8–5.9` `Idamavoca bhagavā …pe… satthā:` — Pāli có `…pe…` nên giữ đúng một `…`: *Đức Thế Tôn đã nói như vậy … bậc Đạo Sư:*.
  - >-
    Cấu trúc nháy kép đối chiếu lại với `sn55.41`: `1.1` mở → `5.7` đóng `”ti.`; `6.1` mở → `7.4` đóng `”.`. Cân trên toàn bài 34 khoá.
  - >-
    Quy tắc dấu lược của BRIEF_VI3 §10: mọi khoá Pāli có `…pe…` hoặc `…` đều giữ **đúng một** `…`, không mở rộng; không khoá nào nén bằng `…` cả khi Pāli viết đủ. Đã đếm từng khoá. Coverage Anh đo được: 18/18 = 100% (hai khoá lấp từ `english-project`, trạng thái `published`)
  - >-
    Tầng `vietnamese-current` vắng: tại commit đã ghim, bilara chỉ có Pháp Cú cho tiếng Việt, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Ba tầng tham khảo còn lại là Pāli root (authority) + `english-sujato` đã ghim + `english-project` (lớp lấp của chính dự án, chỉ tính khi `published`).
  - >-
    Bốn cổng kỹ thuật của AGENTS.md: `npm run validate`, `npm test`, `npm run check` và `npm run build`. **Agent lát này KHÔNG chạy bốn lệnh đó** — BRIEF_VI3 §7 và lệnh của người điều phối cấm chạy `npm run validate|test|build|check`. Những gì đã chạy và xanh: `_hvi.py` (`save_vi` → `kiểm`) cho cả 9 bài — đủ khoá trong `all`, không thừa, NFC, không trùng nguyên văn Pāli (trừ 0.1 theo quy ước), không Pāli lọt, số dấu lược khớp từng khoá, nháy kép cân trên cả bài; quét lại 306 khoá bằng script độc lập; `notes` và `blocking_errors` parse sạch bằng thư viện `yaml` của kho. Cổng thật còn lại là CI (`.github/workflows/ci.yml`), nên `technical_integrity` chỉ 9.6 chứ không 10.
