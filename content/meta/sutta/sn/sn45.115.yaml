    `sn51.33-44` …) và **26 khoá ở 11 bài** ghi **tây**. Đã đảo **chỉ hướng**
    `tây` → `đông` và giữ nguyên phần còn lại của câu; dấu lược không đụng.
    Mẫu đúng có sẵn ở `sn45.104-108:1.1` là *nghiêng về đông, xuôi về đông, đổ
    về đông*; **không** ép bài này về khuôn đó, vì phần `nibbānaninno
    nibbānapoṇo nibbānapabbhāro` của chính bài đã dùng cấu *có xu hướng về
    phía …, có bến về phía …, có dòng về phía …* — ép khuôn sẽ làm bài tự mâu
    thuẫn. Đã sửa kèm `translationTitle` và nhãn (slug) của nó cho khớp. Hạ
