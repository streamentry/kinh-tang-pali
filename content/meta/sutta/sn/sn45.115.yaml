    dịch `pācīnaninnā` là *“slants, slopes, and inclines to the east”*
    (`sn45.91:1.2`) và tiêu đề SuttaCentral của `sn45.91` là *“Slanting
    East”*; đo lại bằng script trên toàn tầng `sn` thì trước lát này có **37
