    *bát chánh đạo*. Với 13 bài `sn45.*` của loạt này tôi theo *bát chánh đạo* —
    **cùng chương thắng tiền lệ toàn kho** — và **ghi lại ở đây để người biên
    tập quyết**. Bản đầu tôi viết lẫn hai kiểu trong cùng loạt (một câu *Thánh
    đạo Tám ngành, … bát chánh đạo*) — đã thống nhất.
