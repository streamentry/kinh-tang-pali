notes: |-
  Hoàn thiện bài gộp 30 bài sn43.14-43: giữ nguyên 5 khóa sn43.14 đã có, thêm 62 khóa mới, đủ 67/67 khóa Pāli.
  Khuôn 1.1-1.2 theo sn43.14:1.1-1.2 đã chốt và sn43.44: con đường đưa đến, Hãy lắng nghe; 3 bài tách Katama sn43.23-29-36 giữ đúng Pāli: 1.2 chỉ Hãy lắng nghe, 1.3 mới hỏi và đóng ngoặc, giữ dấu hỏi của nguồn.
  29/30 danh xưng giữ đúng kệ tóm lược sn43.44:2.1-4.4 đã published; bờ bến kia theo thân bài sn43.44 và sn55.4, 12 lượt, phân biệt với bờ bên kia 155 lượt ở ngữ cảnh qua sông.
  Các điểm đổi so với chữ kệ, mỗi điểm đều có đếm và lý do: chân lý cho sacca theo dn33 và an4.185 thay vì thật; tế nhị cho nipuṇa theo sn6.1:1.4 thay vì thuần thục, vì thuần thục trong kho đã gắn với nghĩa khéo tu tập như dn16; không suy hoại cho ajajjara theo Sujato undecrepit thay vì không run rẩy, vì run rẩy trong kho chỉ dịch sự run sợ lay động như mn35 mn91 sn36.4; vô hý luận cho nippapañca vì kệ ghi rất hiếm không có căn cứ Pāli, hý luận cho papañca 21 lượt, mẫu vô cộng danh từ trong chính phẩm này, mn56:29.31 cũng đọc nippapañcassa là không còn hý luận; tịch tịnh cho santa theo sn6.1:1.4, 125 lượt, thay vì thảnh thơi; vi diệu cho paṇīta theo sn6.1:1.4, 170 lượt, thay vì cao quý; điều kỳ diệu và điều hy hữu cho cặp acchariya abbhuta theo dn10 dn25, hy hữu 177 lượt, thay vì điều kỳ lạ điều huyền diệu chỉ có trong kệ; không tai họa và pháp không tai họa cho anītika anītikadhamma theo Sujato untroubled, giữ phân biệt với sacca chân lý, thay vì không chân thật; sự đoạn tận khát ái cho taṇhākkhaya 12 lượt gồm mn64 sn6.1, khaya đoạn tận trong chính phẩm sn43.1:1.5 sn43.44:1.4, thay vì sự chấm dứt ái vốn là khung nirodha của mn9; điều lành giữ chữ lành của kệ thêm lượng từ điều như kệ đã làm với kỳ lạ huyền diệu.
  Còn lại theo kệ: khó thấy rõ, bền vững theo dn24, không ai thấy, không thấy được, bất tử 92, an toàn, Niết-bàn 884, không bị thương tổn, ly tham 610, thanh tịnh 965, giải thoát 2051, không nương tựa, hòn đảo 30, nơi nương náu, chốn trú ẩn, nơi quy y.
  Bất định đã ghi nhận: apalokita Sujato đọc not worn out, ở đây giữ không ai thấy của kệ vì phân tích apa cộng lokita là không được thấy, phân biệt với anidassana không thấy được; anālaya dùng không nương tựa cùng chữ với anissita ở các bài khác; các tính từ làm danh từ sau về theo đúng lối Sujato the X và tiền lệ về bờ bến kia, không đổi nghĩa.
  Sujato chỉ còn dạng rút gọn một chữ cộng dấu lược ở 30 khóa 1.1, toàn bộ 1.2-1.3 không có bản Anh; đối chiếu bằng Pāli cộng thân bài sn43.1 sn43.11 sn43.13 sn43.44 và cụm sn6.1; không có tầng Việt hiện hành ngoài Pháp Cú nên triangulation 8.8.
  Chốt _hvi qua: đủ khóa, NFC, ngoặc cân cả bài 30 mở 30 đóng, dấu lược khớp Pāli từng khóa; lane này không chạy được npm validate nên technical 9.5.
