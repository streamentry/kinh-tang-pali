  - >-
    `sn55.38:1.1` là **cùng Pāli** với `an3.95:6.1` — dùng lại **nguyên văn cả
    ẩn dụ** để cùng một hình vẫn đọc giống nhau ở hai nơi. `aveccappasāda` →
    *lòng tin vượt tới chỗ cần đặt* (0 tiền lệ, đặt mới; `pasāda` → *lòng tin*
    theo `an1.393`).
  - >-
    **`sn35.186:1.4` — `Khīṇā jāti` là *sanh đã tận*, không phải *khổ đã tận*.**
    Nguyên văn `an5.76:19.3` (đã `published`) đã có đúng câu này; bản đầu tôi
    viết *Khổ đã tận* — sai nghĩa, vì `jāti` là *sanh* và cả cụm là lời tuyên bố
    thắng trận của bậc A-la-hán. Đã sửa và dùng lại nguyên văn kho.
  - >-
    `nibbindati` → *chán nản* và `nibbindaṁ virajjati` → *chán nản rồi ly tham*
    theo `an10.2:1.24` (đã `published`). `viruddhā` không dùng ở đây — khác
    `nibbidā` → *chán ngại* (`an10.1:10.1`) mà `sn35.11` dùng; hai từ gần nhau
    nhưng **khác nghĩa**, tôi giữ đúng từng chỗ.
  - >-
    `sn35.11:1.2` — Pāli hỏi bằng `ko pana vādo paccuppannānaṁ` nhưng **không có
    dấu hỏi** (câu dẫn, đáp ở `1.3`). Tôi giữ dấu chấm như Pāli, không tự thêm
    `?`. `anapekkho` → *không bận tâm* (0 tiền lệ) · `nābhinandati` → *không
    hoan hỷ* (0 tiền lệ, đặt mới).
