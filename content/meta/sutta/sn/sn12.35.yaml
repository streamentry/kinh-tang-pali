notes: |-
  Dịch từ Pāli root đã ghim (manifest liệt kê sn/sn12/sn12.35_root-pli-ms.json và sutta/sn/sn12/sn12.35_translation-en-sujato.json).
  Coverage tầng Anh: 32/32 đoạn Pāli có nội dung (≥ 40 ký tự) có bản dịch tiếng Anh của Bhikkhu Sujato = 1.0000 (100%). Không cần ghi nhận reference-gaps.
  Tập khoá khớp 58/58 khoá Pāli root. Thứ tự khoá hoàn toàn trùng khớp.
  Nháy đơn và nháy kép khớp đúng Pāli từng khoá (58/58 khoá). Cấu trúc hội thoại: 1.6 mở kép và đóng ở 1.11; 2.1 đóng mở; 2.2 mở kép đóng ở 2.6; 3.2 mở kép đóng ở 3.13; 4.2 mở kép đóng ở 4.6; 5.1 mở kép đóng ở 8.3.
  Dấu lược: 16 khoá chứa dấu lược trong Pāli (3 khoá …pe…, 12 khoá …, 1 khoá …pe….), mỗi khoá bản Việt giữ đúng một …, khoá 7.9 kết thúc bằng dấu chấm sau lược ( ….). Không có khoá nào bung lược thành văn, không có khoá nào thêm dấu lược ngoài Pāli.
  Bảo toàn tính nhất quán nội bộ: 7 nhóm Pāli trùng nguyên văn trong chính bài (14 cặp so sánh) đều được dịch hoàn toàn đồng nhất.
  Thuật ngữ: tālāvatthukatāni dịch là làm cho như thân cây thốt nốt (chỉnh sửa cách dịch sai ở tiền lệ); tathāgato dịch là Như Lai; No kallo pañho dịch là Đó không phải là câu hỏi hợp lý; jīva dịch là linh hồn, sarīra dịch là thân xác theo ngữ cảnh tà kiến đoạn diệt/thường kiến.
  Số Pāli: khoá 0.2 mang số 4 (4. Phẩm Kaḷāra), khoá 8.4 Pañcamaṁ dịch là Thứ năm; hai cực đoan (ubho ante), một ý nghĩa (ekatthaṁ), sáu căn (saḷāyatana) đều được dịch chuẩn xác.
  Bốn lệnh kiểm tra kỹ thuật cần chạy trước khi hoàn tất phát hành: npm run validate, npm test, npm run check, npm run build.
