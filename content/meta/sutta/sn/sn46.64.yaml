notes: |-
  Pāli đọc trực tiếp từ snapshot đã ghim; English Sujato có ở 1.1, trống ở
  1.2 là số thứ tự aṭṭhamaṁ, giống hệt hai bài sibling đã published
  sn46.58 và sn46.70 nên không chặn published. Tầng Việt hiện hành vắng vì
  snapshot chỉ có Pháp Cú; đây là giới hạn của bản chụp upstream.
  Giữ …pe… nguyên dạng … theo quy ước kho, không mở rộng.
  Tiền lệ đếm được: hoan hỷ có 889 đoạn; Kinh Hoan Hỷ đã là tiêu đề của 5
  tệp; Pāli 1.1 có bhāvitā nên giữ đã được tu tập; 1.2 Thứ tám. có 204 đoạn.
  Bất định đã ghi: 5 tiêu đề Kinh Hoan Hỷ kia đứng sau các bài Nandati và
  Abhinandana chứ không phải Muditā, còn liệt kê bốn phạm trú trong kho
  dùng dạng từ bi hỷ xả chỉ gặp 1 lần. Chọn hoan hỷ vì đó là cách kho vẫn
  gọi niềm vui nói chung với số đếm áp đảo; người biên tập có thể đổi sang
  hỷ cho khít với liệt kê phạm trú.
