notes: |-
  Đợt 18, lát n186. Dịch từ Pāli root commit 11c9d708, đối chiếu English Sujato đã ghim.

  **Coverage Anh trên Pāli có nội dung: 12/12 = 100%** — trên sàn 0.8, không có gap.

  **Cấu trúc duyên khởi 12 chi phần (1.3–1.12, 5.1–5.13):**
  - Tuân thủ tiền lệ sn12.27 và sn12.29 (cùng phẩm Dasabalavagga).
  - Dấu lược `…pe…` và `…` trần: toàn bộ 32 khoá có dấu lược đều cân bằng tuyệt đối 1:1 với Pāli.
  - Định nghĩa già và chết (2.2, 2.4) lấy chuẩn theo mn9:22 và dn22:18.
  - Chín danh xưng cho bậc hữu học đạt chánh kiến (5.14) đối chiếu sn12.27:5.2 và sn12.49/50.

  **Lượt cải thiện 2026-10-14** (đọc đối kháng cả 58 khoá; 2 khoá đổi lời, 1 khoá bỏ nháy; terminology 9.6 → 9.7, các tiêu chí còn lại giữ nguyên):
  - `2.4` (terminology fix): "sự từ trần, qua đời" → "sự qua đời, lìa đời" cho `cuti cavanatā` — "từ trần" là từ kính ngữ, không hợp với chúng sinh nói chung (gồm cả súc sinh, ngạ quỷ); đo trên tầng: `qua đời` 38 khoá, `từ trần` 3 khoá (đều lệch). `mệnh chung` → `mạng chung` cho `kālakiriyā` (15 so với 4). `sự vứt bỏ thi hài` → `sự bỏ lại thân xác` cho `kaḷevarassa nikkhepo` (cùng công thức ở dn22:18.10, mn141:13.2, mnd6:39.2, ps1.1:183.2, sn12.2:3.4 đều dùng "bỏ lại thân xác"; "vứt bỏ" nặng hơn `nikkhepa`). Đã đối chiếu từng từ Pāli của công thức già (2.2) và chết (2.4): đủ và đúng, không thêm không bớt (chuỗi này ở bản Pāli đã ghim không có `jīvitindriyassa upacchedo`, nên không thêm "cắt đứt mạng căn").
  - `5.14` (terminology/style fix): "tuệ thể nhập" → "tuệ thấu suốt" cho `nibbedhikapañño` (2 so với 1, cùng sn12.33:8.3, 14.3); bỏ nháy đơn ‘…’ vì Pāli khoá này không có nháy đơn (chỉ có nháy kép đóng ”ti).
  - Giữ nguyên, có cân nhắc: "thành tựu tri kiến" cho `dassanasampanno` (tiền lệ trên tầng đầy đủ tri kiến 13, đầy đủ cái thấy 4 — chưa có đa số rõ nên không đổi); "Khi nào" cho `yato kho` (cùng sn12.49:5.1, sn12.50:5.1).
  - Lệch tiền lệ nội bộ ngoài phạm vi: sn12.33:3.4 còn "từ trần", "mệnh chung", "vứt bỏ thi hài" (cùng câu với 2.4 cũ); sn12.27:2.4 còn dịch công thức chết rất khác (do lane khác xử lý).
  - Bất định còn lại: không có bất định giáo nghĩa; kỹ thuật vẫn ghi 9.6 vì chưa chạy lại `npm run validate` · `npm test` · `npm run check` · `npm run build`.
