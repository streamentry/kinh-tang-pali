notes: |-
  **Phạm vi phẩm — đo được, không giả định.** `sn42` = **13 bài** (đếm trong
  `content/catalog/sutta/sn.json` và trong 13 tệp Pāli đã ghim), tổng cộng **935 khoá**.
  Cả 13 bài đều đặt cùng một khối phẩm `1. Gāmaṇivagga` ở `:0.2` ⇒ phẩm này **chỉ có
  một phẩm**, không có phẩm thứ hai. Trước lát này đã có **9** bản Việt (`sn42.1`–`7`, `9`,
  `10`; còn thiếu `8`, `11`, `12`, `13`); lát này làm `sn42.11` = `Bhadrakasutta`, **55 khoá**.
  **Đo `indriya` thay vì tin tin đồn: 0 khoá.** Quét toàn bộ 935 khoá Pāli của 13 bài
  `sn42`, không khoá nào chứa chữ `indriya`. Nghĩa là trong `sn42` **không có khoá nào để
  phân xử** giữa "giác quan" và "quyền năng" — tên `Indriya-saṃyutta` chỉ nằm ở tên phẩm,
  không đi vào thân bài. Báo cả hai số như yêu cầu: **tầng** Việt hiện hữu có **391** khoá
  Pāli chứa `indriya/indriyā`, và dạng đã thành quy ước ở tầng là **chư giác** (`sn54.15*`,
  `sn35.154`), hiếm có chỗ dịch *quyền năng*; còn **gần nhất (trong `sn42`) = 0 tiền lệ**
  vì 0 khoá Pāli chứa từ này. Vì vậy bài này **không** dùng `indriya` ở đâu cả, và câu hỏi
  "giác quan hay quyền năng" không phát sinh trong thân bài — nêu ở đây để người biên tập khỏi
  phải đo lại.

  **Tên phẩm — dùng đúng dạng đã chốt trong chính phẩm.** `1. Gāmaṇivagga` → *1. Phẩm Làng*,
  khớp **9/9** tệp `sn42.*` đã có. Tôi ghép trên **giá trị Pāli tuyệt đối**, không so chéo:
  toàn tầng chỉ `sn42` mang `Gāmaṇivagga` (13 khoá `:0.2`), còn `3. Phẩm Làng Koṭi` và
  `1. Phẩm Làng Bhaṇḍa` là hai phẩm **khác** ở bộ khác.
  `Bhadrakasutta` → *Kinh Với Bhadraka*: **0 tiền lệ** cho tên `Bhadraka` trong tầng, đặt mới
  theo khuôn `sn42.2:0.3` (*Kinh Với Tà-la-pu-ta*, khớp "With Tālapuṭa" của Sujato); giữ dấu
  Pāli trong tên như `sn42.10` giữ `Maṇicūḷaka`. Đây là chỗ duy nhất trong bài có thể phải đổi
  nếu người biên tập muốn dịch nghĩa tên riêng.

  **Dùng lại nguyên văn từ bài song song — có số đếm.** `1.1` dùng lại khung của `dn24:1.1.2`
  (*Một thời, Đức Thế Tôn trú giữa dân Malla, tại thị trấn của dân Malla tên là …*); Pāli hai
  bài chỉ khác ở tên thị trấn (`anupiyaṁ` / `uruvelakappaṁ`). `1.2` dùng lại nguyên văn
  `sn42.1:1.2` (cùng công thức `Atha kho … yena bhagavā tenupasaṅkami … etadavoca:`, chỉ khác
  tên `caṇḍo` → `bhadrako`). `4.2` và `4.5` dùng lại cặp *ham muốn / tham / tình ái*.

  **Năm phép kiểm — kèm mẫu số.** (1) Tập khoá Việt = tập khoá Pāli: **55/55**, và thứ tự
  khoá **y hệt** thứ tự Pāli. (2) Nháy đơn `‘’` + ngoặc kép `“”` khớp Pāli **từng khoá**:
  mẫu số là **39/55** khoá có nháy trong Pāli ⇒ **0 lệch**. Nhớ rằ ở bài này nháy **cố ý chạy
  qua ranh giới khoá**: `4.1` không mở nháy vì `“` mở ở `3.4` và đóng ở `4.2`; nếu chỉ cân
  tổng thì vẫn ra `True` dù lệch. (3) Pāli trùng nguyên văn **trong chính bài**: mẫu số
  **5 nhóm** (`2.1`/`3.1`/`5.1`; `2.13`/`5.6`; `2.16`/`3.5`/`5.5`; `2.17`/`3.6`;
  `3.4`/`5.4`) ⇒ **0 nhóm lệch**, đã dùng lại nguyên văn cho từng nhóm. (4) Dấu lược: mẫu số
  **55/55** khoá đều đo được; Pāli có **0** khoá `…pe…`, **0** khoá `…` trần, **0** khoá
  `(…)`; bản Việt có **0** dấu `…` ⇒ 0 lệch. Cổng này **đo được** chứ không phải "không cần
  ghi nhận". (5) NFC, khoá rỗng, Pāli lọt sang tiếng Việt, khoảng trắng thừa: 0 lỗi trên
  55 khoá. Bổ sung: dấu nháy đơn kiểu tiếng Anh không lọt vào bản dịch (0 dấu `'` trong toàn bài).

  **Số Pāli — tự tính, in phép tính.** `Ekādasamaṁ` (`5.7`) = eka 1 + dasa 10 ⇒ **11**, dịch
  *Thứ mười một*; khớp **53/57** khoá tầng có cùng Pāli, và khớp cả vị trí thứ 11 trong 13
  bài của phẩm. `Saṁyutta Nikāya 42.11` và `1. Gāmaṇivagga`: giữ nguyên số hiệu, khớp 9/9
  tệp `sn42` đã có. Cụm `sokaparidevadukkhadomanassupāyāsā` = **5** danh từ
  (soka · parideva · dukkha · domassa · upāyāsa): dịch đủ **5** ở **11/11** khoá, đúng thứ tự.
  Cụm `vadhena vā bandhena vā jāniyā vā garahāya vā` = **4**: dịch đủ **4** ở **11/11** khoá.
  `chando vā rāgo vā pemaṁ vā` = **3**: đủ **3** ở **2/2** khoá (`4.2`, `4.5`).
  `diṭṭhena viditena akālikena pattena pariyogāḷhena` (`2.9`) = **4** vị ngữ ngang hàng: giữ đủ
  **4**. `chandamūlakaṁ chandanidānaṁ` = **2** vai trò: tách thành *gốc rễ* và *nguồn gốc*,
  không dịch chung một từ.
  **Một phép đo chạy rỗng, nói thẳng:** phép đo số máy của kho chỉ so **9** cụm số đã xác lập
  được ở tầng (`Ekanavutito`, `Catunnavutito`, `Sattatālīsito`, `Dvesattatimhito`,
  `Tesattatimhi`, `Ekūnasattatikappe`, `Catusattatikappamhi`, `Sattasattatikappasate`,
  `Aṭṭhārase`), và bài này **không chứa cụm nào** trong chính 9 cụm đó ⇒ phép đó ở đây có
  mẫu số **0**, tức **không đo được gì**; dòng hiệu chuẩn vẫn in `OK` nhưng vì không có mục nào
  để so, nên không được đọc là đã kiểm. Vì vậy phần số ở đoạn này do tôi **tự đếm lại** chứ
  không dựa vào phép đó: tôi tách từng cụm ghép thành số mục và so với số mục bên Việt (5, 4,
  3, 4, 2 — kết quả 11/11, 11/11, 2/2, 1/1, 5/5 khớp), và tự tính `eka 1 + dasa 10 = 11`.

  **Thuật ngữ — kèm đếm, và nêu cả hai số khi hai phạm vi khác nhau.**
  `gāmaṇi` → *thôn trưởng* (93 khoá Pāli / 10 tệp tầng; 15 lần trong bài này).
  `bhante` → *bạch Thế Tôn*: **tầng 1321** so với *bạch thầy* **16**; **gần (`sn42`) 20 so
  với 8**. Hai phạm vi cùng ra đa số nên theo *bạch Thế Tôn*, và như vậy khớp cả 9 tệp anh em.
  `bhagavā` → *Đức Thế Tôn*; `me` của thôn trưởng → *con*, `te/tvaṁ` của Đức Phật → *ngươi*,
  `ahaṁ` → *ta* (khớp `sn42.2`/`3`/`5` dùng *ngươi* cho `te`).
  `sokaparidevadukkhadomanassupāyāsā` → *sầu, bi, khổ, ưu, não*: dạng **trần** (không kèm
  jāti-byāla-mita) có **42** tiền lệ ở 15 tệp, **31/42** dùng đúng dạng này; tiền lệ **gần nhất**
  và **cùng cấu trúc** là `mn87:24.5`–`26.6` (`jīvitassapi siyā aññathattaṁ, kiṁ pana me na
  uppajjissanti …`). Bản nháp tôi đầu tiên tự đặt *sự sầu, tiếc khóc, đau đớn, u buồn, não
  lòng* (0 tiền lệ) và đã gỡ — đây đúng là cách thứ N+1 mà phải tránh.
  `vadhena`/`bandhena`/`jāniyā`/`garahāya` → *giết / giam tù / tịch thu / khiển trách*, khớp
  `an3.69:2.3` và `an3.69:5.2` (*bằng cách giết, bỏ tù, tịch thu, khiển trách*); chuyển sang
  dạng bị động vì Pāli ở đây là thụ động (`uppajjeyyuṁ`).
  `samudayañca atthaṅgamañca` → *sự sinh khởi và đoạn diệt* (98 khoá tầng có cặp này).
  `kaṅkhā … vimati` → *hoài nghi … phân vân* (24 khoá tầng có cả hai từ).
  `acchariyaṁ` → *kỳ diệu*; `abbhutaṁ` → *hy hữu* (**17/27** khoá tầng).
  `Yāva subhāsitañcidaṁ, bhante, bhagavatā` → *Nói tốt quá, bạch Thế Tôn, lời của Đức Thế
  Tôn* (tiền lệ sát nhất, 3 khoá). `Taṁ kiṁ maññasi, gāmaṇi,` → *Này thôn trưởng, ngươi nghĩ
  sao:*; khuôn này khớp `mn87:25.4` (*Đại vương nghĩ thế nào?*) và cả 6 khoá cùng Pāli ở
  `sn42.6`; `paccayo` → *hoàn cảnh* (2/2 ở `sn42.1`).
  `Ekādasamaṁ` → *Thứ mười một* (53/57 tầng). `pemaṁ` → *tình ái* (tầng hay dùng *yêu thích*
  ở ngữ cảnh khác; ở đây `chando vā rāgo vā pemaṁ vā` là bộ ba được Sujato tách *desire,
  passion, fondness*, nên tôi tách *ham muốn / tham / tình ái*). `āvasatha` → *một căn nhà*
  (4 khoá tầng).
  **0 tiền lệ, đặt mới, và đó là lý do `terminology` ở 9.3:** `chandamūlakaṁ chandanidānaṁ` và
  `Chando hi mūlaṁ dukkhassa` xuất hiện ở **đúng 5 khoá của chính `sn42.11`**, không có ở bài
  nào khác trong 5.764 tệp Pāli đã ghim. Tôi tách `mūlaka` → *gốc rễ* và `nidāna` → *nguồn gốc*
  thay vì dịch chung, cùng nguyên tắc người biên tập đã dùng ở `sn42.9` với
  `anuddaya/anurakkha/anukampa`.

  **Lỗi bản nháp đã bắt — kể cả lỗi trong chính phép kiểm của tôi.**
  (a) `4.5` thiếu một dấu `’` (nháy đóng lồng theo mẫu `’”ti` của `2.13`, `2.22`, `5.6`) —
  phép so nháy **từng khoá** bắt được; phép *cân tổng* sẽ trả `True` vì thiếu 1 nhưng không
  thừa chỗ nào. (b) `2.6` bỏ sót `uruvelakappiyānaṁ manussānaṁ` và thêm một chỗ đứng *"ở đây"*
  không có trong Pāli. (c) `3.2` và `3.3` dùng **"họ"** (số nhiều) cho `Ciravāsissa me
  kumārassa` (số ít) ⇒ sai chủ thể, loại lỗi làm đổi nghĩa. (d) `2.3` và `2.5` lặp *"có …
  có"* vì dịch cả `Atthi` và `manussā` thành hai vị ngữ "có". (e) `2.18` tự đặt *"tự nhiên"*
  cho `āvasathe` — 0 tiền lệ trong tầng. (f) `1.3` bỏ sót `sādhu`. (g) `1.5` và `1.7` dịch
  `kaṅkhā`/`vimati` thành cặp tự đặt thay vì cặp *hoài nghi / phân vân* đã có 24 tiền lệ.
  (h) Bốn mục trong `vadhena vā bandhena vā jāniyā vā garahāya vā` lệch cả ba chữ so với
  `an3.69`. (i) `2.19` thêm *"mỗi"* không có trong Pāli. (j) Lỗi trong chính cách sửa của tôi:
  khi đổi `bhante` sang *bạch Thế Tôn* bằng thay thế ở dạng chữ thường, tôi **bỏ sót 7 chỗ
  viết hoa** (`Bạch thầy`), làm câu `2.14` lệch nửa vời — chỉ lộ ra khi in lại toàn bộ cặp
  PĀLI↔VIỆT đọc đối kháng, không phải khi chạy phép đo.

  **Bất định — ghi ở đây, không thêm vào thân kinh.** `pariyāyena veditabbaṁ` (`3.4`, `5.4`):
  `pariyāya` có thể là "lối so sánh" (đọc theo nghĩa phép ẩn dụ) hoặc chỉ "cách". Tầng có cả
  hai dạng (*phương tiện* ở `mn84`, *theo cách này* ở `dn9` và `sn54.12`). Ở `5.4` tôi dịch
  *"theo cách ấy"* vì nó trỏ ngược lại `3.4` chứ không phải một ví dụ so sánh mới; nếu người
  biên tập muốn nhấn nghĩa phép ẩn dụ thì đổi **cả hai** sang *"bằng lối so sánh ấy"*. Chưa
  phân xử dứt điểm.
  `idheva nisinno ettheva te nisinnassa` (`1.8`): giữ cả hai vế (*ta ngồi / ngươi ngồi*) thay vì
  rút gọn thành "ngay tại đây", vì Pāli lặp `eva` để nhấn **khoảng cách gần** chứ không để nói
  thêm thông tin — nhưng cách nhấn ấy không có tiền lệ Pāli song song trong tầng để đối chiếu.
  `sādhu` (`1.3`) dịch *Lành thay* theo đa số 24 khoá cùng mở đầu; không có tiền lệ riêng cho
  `sādhu` đứng một mình không kèm `bhagavā`.
  `Bhadraka` giữ dấu Pāli — 0 tiền lệ; đây là điểm người biên tập có thể muốn đổi.

  **Coverage tầng Anh — đo thật.** Mẫu số = khoá Pāli **có nội dung**, tức ≥ 40 ký tự sau khi
  gộp khoảng trắng và bỏ khối `:0.x`, đúng công thức tầng tham khảu khai trong
  `source/layers.yaml` (`substantivePaliMinChars: 40`, `excludeReferenceBlock: true`,
  `floor: 0.8`): mẫu số **38**. Tầng `english-sujato` phủ **38/38 = 100%**, không thiếu khoá nào
  ⇒ không cần ghi nhận vào `reference-gaps.yaml`, và ngưỡng cũng không chặn. Tầng
  `english-project` **không có** tệp cho `sn42.11` (0 khoá), nên không có lớp lấp nào che tầng
  đã ghim. Tầng `vietnamese-current` **không có** cho bài này: corpus Việt tại commit đã ghim
  chỉ có 26 tệp Pháp Cú, đây là **đặc điểm của snapshot upstream**, không phải thiếu sót của
  repo. Vì đối chiếu được Pāli + Anh Sujato ở mức 100% nên `triangulation` đặt 9.3 — nhưng
  **không** có tầng Việt hiện hành để đối chiếu thêm, nên không nâng cao hơn mức đó.

  **`technical_integrity` = 9.6** vì lát này không được chạy bốn cổng kỹ thuật của kho. Còn
  lại do người biên tập chạy: `npm run validate` · `npm test` · `npm run check` ·
  `npm run build`. Tôi **không** tuyên bố cổng kỹ thuật đã pass. Thay vào đó tự kiểm bằng phép
  riêng: tập khoá và thứ tự khoá khớp Pāli, nháy khớp từng khoá, Pāli trùng trong bài dùng lại
  nguyên văn, dấu lược khớp, NFC, không khoá rỗng, không Pāli lọt sang tiếng Việt, không khoảng
  trắng thừa, số lượng trong mọi danh sách khớp số mục của Pāli.