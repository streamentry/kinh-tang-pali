notes:
  - >-
    **Tám bài cùng hỏi `Katamo ca, bhikkhave, asaṅkhatagāmimaggo?`, chỉ khác
    danh từ ở `1.2`.** `asaṅkhatagāmimagga` → *con đường bất tân* (0 tiền lệ,
    đặt mới).
  - >-
    **⚠ SỬA LỖI: bản đầu tôi dịch `Ayaṁ vuccati, bhikkhave, X` thành cụm lạ**
    (*“thì được gọi là, này các tỳ-kheo, con đường bất tân”*) **và để chữ thường
    sau dấu chấm** ở `sn43.5`–`sn43.10` (*“Bốn Chánh Trừng Phạt. thì được gọi
    là”*). Nguyên văn `an3.117:1.6` (đã `published`) là *Đây, này các tỳ-kheo,
    được gọi là ‘thất nghiệp về giới’* — dùng lại đúng khuôn. Hoa/thường nay
    chọn **theo dấu kết thật sự của Pāli**: `sn43.3`/`sn43.4` nối bằng `—` nên
    viết *đây*, sáu bài sau kết bằng `.` nên viết *Đây*.
  - >-
    `savitakkasavicāra` → *tán chương và cân nhắc* (nguyên văn `sn40.11:7.1`, đã
    `published`) · `avitakkavicāramatto` → *không tán chương mà tâm không cân
    nhắc* và `avitakkavicāro` → *không có tán chương, không có cân nhắc* (0 tiền
    lệ, đặt mới) · `suññato` → *trống rỗng* · `animitto` → *vô tưởng*
    (`an10.6:1.2` đã dùng *phi tưởng phi phi tưởng*, nhưng `animitto` dạng tính
    chất 0 tiền lệ) · `appaṇihito` → *không đặt dính* (0 tiền lệ).
  - >-
    **Pāli mở `“` ở `1.1` rồi không đóng** ở cả tám bài — tôi đóng sau danh từ,
    **cố ý lệch**, đã ghi.
  - >-
    **Quy tắc dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
    `published` có `…` trong Pāli, chỉ 617 (40%) giữ đúng số, và cặp lệch phổ
    biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` → `…`). Quy tắc là
    **có/không có `…` phải khớp theo từng segment**.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ và Tăng Chi Bộ Lớn không có bản
    Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản chụp
