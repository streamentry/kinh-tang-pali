notes: |-
  Bản dịch tiếng Việt mới cho sn12.45 (`Ñātikasutta`), 43/43 khoá. Tầng Anh đã ghim
  CÓ tệp `translation/en/sujato/sutta/sn/sn12/sn12.45_translation-en-sujato.json`; đo coverage theo
  đúng công thức `source/layers.yaml` (Pāli ≥ 40 ký tự, loại `:0.x`) cho **19/19 = 100%**, nên
  bài không rơi vào `reference-gaps` và không có blocker.

  **Dấu lược: giữ đúng một `…`, KHÔNG mở rộng.** Đây là điểm quan trọng nhất của lát này.
  Bản Anh Sujato **đã ghim** mở rộng những đoạn mà Pāli khoá đó không có: `3.1` và `5.1` chỉ có
  `Sotañca paṭicca sadde ca …pe…` nhưng Sujato viết đủ *"Ear consciousness arises dependent on
  the ear and sounds."*; `3.2`–`3.4` chỉ có `…ghānañca paṭicca gandhe ca …` nhưng Sujato viết đủ
  *"…thức của mũi sinh khởi"*. Tôi **không** chép bản mở rộng ấy vào kinh: `3.1`/`5.1` dịch
  *“Nhân tai và âm thanh …”*, `3.2` *“nhân mũi và mùi …”*, `3.3` *“nhân lưỡi và vị …”*,
  `3.4` *“nhân thân và sắp xúc …”* — mỗi khoá đúng **một** dấu lược như Pāli. `2.4`/`3.8`/
  `4.5`/`5.6` dịch theo đúng một `…` cho `…pe…`. Số dấu lược khớp Pāli **theo từng khoá** ở
  cả 43 khoá.

  **Tiền lệ đã dùng lại nguyên văn (đếm được):** `Cakkhuñca paṭicca rūpe ca …` → *“Nhân mắt và
  sắc, nhãn thức sinh khởi. Ba cái ấy hợp nhau thành xúc chạm.”* (3/4 cặp trùng nguyên văn:
  `sn35.60:1.4`, `sn35.106:1.4`, `sn35.106:2.2`); `Phassapaccayā vedanā;` → *“Do xúc chạm làm điều
  kiện, sinh khởi cảm thọ;”* (5/5, `sn35.106`); `Tassāyeva taṇhāya asesavirāganirodhā
  upādānanirodhā;` → *“Khát ái ấy khi được rút lại, diệt tận không còn dư lại, thì chấp thủ diệt
  tận;”* (`sn35.106:2.15` nguyên văn); `upādānanirodhā bhavanirodho …pe…` → *“do thủ diệt nên
  hữu diệt …”* (`sn12.55:3.3` nguyên văn, 2 cặp); `ek aṁ samayaṁ bhagavā ñātike viharati
  giñjakāvasathe.` → *“Một thời Thế Tôn trú tại làng Ñātika, trong ngôi nhà gạch.”* (2/2);
  `5. Gahapativagga` → *“5. Phẩm Gia Chủ”* (`sn12.41`–`sn12.47`); `Ñātikasutta` → *“Kinh …”*
  (2923/2929 bài `<X>sutta` đã có dùng *Kinh X*; đo trước khi ghi lát này).

  **Chuỗi `taṇhāpaccayā upādānaṁ …pe…` dịch *“Do khát ái làm điều kiện, sinh khởi chấp thủ …”***
  (không có tiền lệ trùng nguyên văn; `sn12.55:2.5` chỉ có *“Do ái làm duyên nên có thủ …”*).
  Tôi theo cách diễn đạt của cụm `Phassapaccayā vedanā` đã có sẵn trong tầng, để chuỗi
  `paccayā` trong bài đọc nhất quán.

  **`“Evaṁ, bhante”ti.` dịch *“Thưa vâng, bạch Thế Tôn.”*** Đếm `Evaṁ, bhante` trên toàn tầng:
  cách này **4/7** cặp trùng nguyên văn; 2 cặp ở `an3.35:4.3` và `an3.35:6.4` dịch *“Bạch Thế
  Tôn, có thể.”* — với câu hỏi *"ngươi có nghe … không?"* thì “có thể” sai nghĩa (trả lời *có
  thể* thay vì *vâng*). Tôi theo đa số và **không sửa hai tệp ngoài lát**; ghi ra đây để người
  biên tập xem lại `an3.35`.

  **`Uggaṇhāhi / pariyāpuṇāhi / dhārehi` (6.6–6.8): 0 tiền lệ trên toàn tầng**, dịch từ Pāli:
  *thuộc lòng* · *học thuộc cho đến kỹ* · *ghi nhớ* — đúng ba mệnh lệ của mệnh lệ giảng *dhammapariyāya*
  mà Sujato dịch *Learn / memorize / remember*.

  **`Atthasaṁhito ayaṁ … ādibrahmacariyako”ti.` (6.9):** `atthasaṁhita` → *mang lại lợi ích*
  (đa số tầng: `an10.44:7.5` *“ta sẽ nói mang lại lợi ích”*); `ādibrahmacariyaka` → *khởi đầu
  Phạm hạnh* — đếm cả tầng: *khởi đầu Phạm hạnh* **8** so với *căn bản của đời phạm hạnh* **4**
  (`sn56.7/8/10/41` so với `sn16.12`, `sn56.31`). `brahmacariya` → *phạm hạnh* là quy ước sẵn có.

  **`Pañcamaṁ.` → “Thứ năm.”** (246/252 cặp trùng nguyên văn, đo trước khi ghi lát này).
