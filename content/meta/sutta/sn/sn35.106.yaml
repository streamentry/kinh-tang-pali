notes: |-
  Dịch từ Pāli root đã ghim. Tầng Anh CÓ và đã đo: manifest liệt kê sutta/sn/sn35/sn35.106_translation-en-sujato.json, 34/39 khoá có chữ.
    Coverage đo được: 17/17 Pāli có nội dung có Anh = 1.0000 (15 từ Sujato + 2 do lớp lấp english-project bù, lớp lấp đã published). Không cần entry reference-gaps.
    14 khoá TRÙNG NGUYÊN VĂN, dùng lại y nguyên: 1.4 và 2.2 trùng sn35.60:1.4 (Nhân mắt và sắc, nhãn thức sinh khởi. Ba cái ấy hợp nhau thành xúc chạm), 2.12 trùng sn35.60:1.12, 2.6–2.9 và 2.16–2.19 trùng sn12.52:3.3–3.6 (5 cặp).
    Phassapaccayā vedanā và vedanāpaccayā taṇhā: 0 tiền lệ đúng cụm trong tầng, nhưng sn35.60:1.5 đã dịch sẵn cùng công thức nên bám y: Do xúc chạm làm điều kiện, sinh khởi cảm thọ; / Do cảm thọ làm điều kiện, sinh khởi khát ái. taṇhā giữ là khát ái theo sn12.52 (khát ái tăng trưởng, do khát ái diệt tận).
    1.9 và 1.10 Sujato để trống nên Pāli phải tự đứng vững; 2.11 trống và do lớp lấp của dự án bù (đã published). Dùng y nguyên sn35.60:1.10 cho cảu lưỡi (Nhân lưỡi và vị, thức của lưỡi sinh khởi) để cân với 1.4 về mắt và 1.11 về tâm.
    2.5 và 2.15 Tassāyeva taṇhāya asesavirāganirodhā upādānanirodhā → Khát ái ấy khi được rút lại, diệt tận không còn dư lại, thì chấp thủ diệt tận; theo Sujato When that craving fades away and ceases with no residue left behind, grasping ceases, và tiền lệasesavirāganirodha trong tầng (không còn dư lại, không còn sót lại).
    1.3 và 2.1 giữ hạt dạng đặt câu hỏi khác nhau: tập khởi của khổ là gì và sự diệt mất của khổ là gì; samudaya giữ là tập khởi (đa số trong tầng), atthaṅgama dịch sự diệt mất.
    Tầng vietnamese-current vắng. Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
