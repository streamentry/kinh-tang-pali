notes: |-
  **ĐỌC TOÀN BỘ PĀLI 44 KHOÁ TRƯỚC KHI VIẾT**, in lại từng cặp Pāli↔Việt sau khi ghi.

  **COVERAGE TẦNG ANH 24/24 = 1.00** trên Pāli có nội dung ⇒ `published` được phép; không
  cần lớp lấp `english-project`.

  **DÙNG LẠI NGUYÊN VĂN 12 KHOÁ PĦI TRÙNG.** Đo trên lát: 148 khoá Pāli ≥ 25 ký tự, 30
  khoá trùng nguyên văn với bài đã dịch; **12** cặp nằm ở `sn36.8` và **9** dùng lại nguyên
  văn: `:1.1`→`sn55.30:1.1` · `:2.2`→`sn47.2:2.2` · `:4.5`→`sn47.2:2.2` · `:3.1`→`sn47.2:2.3` ·
  `:3.6`→`sn47.2:2.8` · `:4.1`→`sn47.2:3.1` · `:4.3`→`sn47.35:3.5` · `:1.3`→`sn54.9:6.2` ·
  `:3.2`→`sn47.32:2.2`. Ba khoá còn lại tôi **không** dùng lại, và ghi lý do:
  (a) `:3.3`/`:3.4` — `mn77:15.3`/`:15.4` có Pāli `…` đã bị **mở rộng** thành văn đầy đủ
      (vi phạm luật `…pe…` của kho); tôi giữ lược.
  (b) `:3.5` — `sn52.8:3.8` có **cùng Pāli** nhưng dịch *nhiếp phục tham ưu ở đời* cho
      `vineyya loke abhijjhādomanassaṁ`, tức đảo mất nghĩa vế động từ; `sn47.32:2.2` dịch
      đúng (*từ bỏ tham lam và ưu não nơi thế gian*). Tôi theo `sn47.32:2.2`. **Tệp
      `sn52.8` nằm ngoài lát của tôi nên tôi không sửa** — coordinator nên xem lại.

  **DÙNG LẠI THEO CÔNG THỨC (không trùng nguyên văn).** `(Yathā purimasuttante, tathā
  vitthāretabbo.)` → *(Cần giảng rộng như bài trước.)* (`sn36.18:1.9`, cùng phẩm) ·
  `Idha … abhikkante paṭikkante sampajānakārī hoti …pe… bhāsite tuṇhībhāve sampajānakārī hoti.`
  → khuôn của `sn47.2:3.2`. `sato … sampajāno kālaṁ āgameyya` → *có nhớ tưởng, có tỉnh
  giác mà chờ đúng thời* (0 tiền lệ đúng câu; `āgameyya` = *chờ đúng thời*).

  **`vayānupassī` (:5.9–5.10).** Chuỗi năm quán `aniccānupassī, vayānupassī, virāgānupassī,
  nirodhānupassī, paṭinissaggānupassī` → *quán vô thường, quán tan biến, quán ly tham, quán
  diệt tận, quán buông bỏ*; đây đúng là bản năm vế đã dùng ở `mn37` và `sn36.7`.

  **DẤU LƯỢC.** `:3.3` và `:3.4` là `…` trần (không phải `…pe…`) → **đúng một** `…` mỗi khoá;
  `:4.2` `:6.1` `:6.2` là `…pe…` → cũng **đúng một** `…`. Bản nháp đầu của tôi viết `:6.2`
  thành *“… sống như vậy …”* (hai dấu) và thêm `…` ở đầu `:6.3` (Pāli không có) — đã sửa;
  `_hvi.py` không bắt được vì hai khoá đó ngắn hơn 40 ký tự, tôi tự đếm lại **mọi** khoá.

  **NGOẶC KÉP.** `“` mở ở `:2.1`, `”` đóng ở `:7.4`. Nháy cong: `‘` mở ở `:5.3` đóng ở
  `:5.8`; `‘` mở ở `:6.5` và `’` ở `:6.10` (Pāli đóng nháy ở đây vì phần giữa đã bị `…pe…`
  lược ở `:6.2`); hai cặp `‘…’` riêng trong `:7.3`; một cặp trong `:7.4`. Cân trên cả bài.
  Bản nháp đầu của tôi mở thêm một `‘` ở `:6.10` — đã gỡ.

