notes: |-
  Đã đọc HẾT `vc/p75.txt` trước khi viết. Ba bài `sn` trong lát này nằm trong **Bộ Trường Bộ**
  nên công thức lặp là bình thường — đã dịch từng khoá, không dịch khuôn.

  MỆNH ĐỀ ĐO LẠI: `:0.1` `Saṁyutta Nikāya 16.10` (chữ `ṁ` là **U+1E41**, đã kiểm trên tệp đã có:
  `sn16.1:0.1`). `:0.2` `1. Kassapavagga` ⇒ `1. Phẩm Kassapa` — 7/7 bài `sn16` đã có dùng y hệt
  (`sn16.1`, `.2`, `.12`, `.13`…). `:0.3` `Upassayasutta` ⇒ **Kinh Tịnh Xá Của Các Tỳ-kheo Nữ**;
  Sujato đặt tiêu đề *The Nuns' Quarters*, `upassaya` = chỗ ở/tịnh xá, và nội dung bài đúng là
  Kassapa đến tịnh xá của các tỳ-kheo nữ. 0 tiền lệ cho tên kinh này.

  DÙNG LẠI Y NGUYÊN VĂN TRONG CHÍNH BÀI: `1.7`≡`1.4`, `1.8`≡`1.5`, `1.10`≡`1.4`,
  `5.2`≡`7.2`, `5.3`≡`6.2`, `6.1`≡`8.1`, `7.3`≡`8.2`, `7.5`≡`5.5`. Với `7.5` mở ngoặc kép ở
  `7.4` nên `7.1` **không** được mở thêm dấu nháy.

  BẤT ĐỊNH ĐÃ PHÂN XỬ:
  · `4.6` `Āgamehi tvaṁ` — đây là chỗ khó nhất của bài. Bodhi dịch *Wait, Ānanda!*; Sujato
    *Hold on, Reverend Ānanda!*. Có thể đọc `āgamehi` là mệnh lệnh của `āgamā` (*hãy đến
    đây*) nhưng ngữ cảnh là ngăn Ānanda, nên tôi chọn **Khoan đã**. Ghi rõ vì Sujato ở đây
    cũng không giữ nghĩa chữ.
  · `5.1`/`:7.1` `Taṁ kiṁ maññasi, āvuso ānanda` — Pāli có tân ngữ `-si` (ngôi thứ hai) nên
    dịch **ngươi**. Tiền lệ duy nhất (`sn22.83:4.1`) dùng *ngài* và có một dấu nháy mở `‘` thừa;
    cả hai không dùng được ở đây (xem trên), nên đây là **1 khoá lệch tiền lệ có chủ đích**.
  · `4.1` — Pāli khoá này viết `thullatissāya` (cách), nên chốt `lọt_pāli` của `_hvi.py` báo
    *Pāli lọt* cho `Thullatissā`. Đây là **điểm yếu của chốt**: nó lấy `pāli_riêng` từ *chính
    khoá đang dịch*, không quét cả bài, nên một danh xưng Pāli đúng vẫn bị chặn khi xuất hiện ở
    dạng biến cách. Tôi **không sửa `_hvi.py`** (luật của kho) và dùng *nữ tỳ-kheo ấy* — tên đã
    nêu rõ ở `:3.1` ngay trước nên người đọc không mất thông tin. **Người điều phối nên xem lại
    `lọt_pāli`**: hoặc quét `pāli_riêng` cho cả bài, hoặc thêm một ngoại lệ tên riêng.
  · `3.3` `sūcivāṇijako` = kẻ **bán** kim chỉ rong ruỗi; `sūcikāro` = bậc **làm** kim chỉ. Cặp
    này là trọng tâm của bài, giữ đúng chiều (bán/làm) ở cả `:3.3–3.4` và `:4.3–4.4`.
  · `9.1` `sattaratanaṁ … aḍḍhaṭṭhamaratanaṁ … nāgaṁ` — đơn vị `ratana` (≈ 3 m). Sujato đổi
    ra mét; tầng đã có dùng **bảy thước hay bảy thước rưỡi** cho đúng cụm Pāli này (`ud4.4:4.2`,
    `ud4.4:6.4`) nên tôi theo tầng để khớp. `yo me cha abhiññā` = *sáu tầng tri kiến của ta*.
  · `10.1` `Cavittha … brahmacariyamhāti` — `māti` = *sa cơ, rơi ra ngoài*; dịch *sa cơ mất phạm
    hạnh* (Sujato *fell from the spiritual life*).

  DẤU LƯỢC: `6.3` có HAI `…pe…` ở Pāli ⇒ bản Việt giữ **đúng hai** `…`, không mở rộng danh sách
  chín sự an trú / năm tầng tri kiến (nêu ở `6.4`). `…pe…` còn ở `6.4` của bài `sn16.4`, không có
  ở bài này.

  COVERAGE: substantive **38** khoá (≥40 ký tự, loại khoá đánh số `N.0`). Sujato đã ghim có tiếng
  ở **35**; ba khoá trống là `1.7`, `1.8`, `3.4` — `1.7`/`1.8` là lần lặp thứ hai/thứ ba của
  đúng câu `1.4`/`1.5` nên lớp lấp `english-project` đã có, và `3.4` cũng có. Cả ba được tính
  (vì `content/meta/en/sn/sn16.10.yaml` có `status: published`) ⇒ coverage **38/38 = 1,000**.
  Lớp lấp là tiếng Anh **của chính dự án**, không phải bản độc lập — đó là lý do `triangulation`
  chỉ 8,8, và bài này không tuyên bố đã đối chiếu English độc lập cho ba khoá đó. Tầng
  `vietnamese-current` không có.

  `technical_integrity` 9.6: cổng kỹ thuật do coordinator chạy; tự kiểm qua `_hvi.kiểm()` — 0 lỗi.
