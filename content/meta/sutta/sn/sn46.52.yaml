notes: |-
  **Coverage English — ĐO THẬT, mẫu số KHÔNG rỗng, và chạm sát ngưỡng.** Mẫu số = **57** segment Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`), theo `source/layers.yaml`. Tầng `english-sujato` đã ghim phủ **46/57 = 0,8070**; ngưỡng 0,8 cần tối thiểu `ceil(0,8 × 57)` = **46**. **Độ nhạy:** mất thêm 1 khoá là hỏng ngưỡng (45/57 = 0,7895 < 0,8) — bài đạt **đúng sát ngưỡng**, không có biên an toàn. **11** khoá Sujato để trống đều là phần **thuật lại** (`5.1`, `5.3`–`5.6`, `6.1`–`6.4`, `7.1`, `7.2`): các tỳ-kheo kể lại cho Đức Thế Tôn đúng những gì đã xảy ra ở `1.x`–`4.x`, và Sujato bỏ trống vì lặp. Chúng KHÔNG phải sự đồng thuận về cách dịch; bản Việt dịch các khoá này từ Pāli và giữ cùng lời với `1.x`–`4.x` (xem mục dịch lại). Không có lớp lấp `english-project` cho bài này. Tầng `vietnamese-current` **vắng** tại commit đã ghim (snapshot bilara chỉ có Pháp Cú) và `countsTowardCoverage: false`; đây là đặc điểm của bản chụp upstream, không phải thiếu sót của bài. Việc có hay không entry trong `content/meta/reference-gaps.yaml` do người điều phối quyết (lát này không được sửa tệp đó); `npm run reference:gaps` cần chạy lại.

  **Đối chiếu ngoài tầng store.** Đã đọc **bản Việt nguyên bài của Hòa thượng Thích Minh Châu** (SuttaCentral, `legacyHtml`, không phân đoạn nên không căn lề vào segment) để kiểm thuật ngữ và cấu trúc; không chép câu nào từ đó. Bốn điểm hai bản **khác nhau**, đều phân xử bằng Pāli: (1) `pariyāya` — Hòa thượng dùng *"pháp môn"*, bản này *"cách thức"* (xem thuật ngữ); (2) `uddesaṁ gacchati` — Hòa thượng *"Gọi là dục tham triền cái là có ý nghĩa này"*, bản này *"Điều này được nêu gọn là ‘triền cái dục tham’"* theo Sujato (*concisely referred to as*); (3) `ajjhattaṁ/bahiddhā` — Hòa thượng *"nội/ngoại"*, bản này *"bên trong/bên ngoài"* (cùng nghĩa, từ Việt thuần); (4) `ājānissāmā` — Hòa thượng *"sẽ được biết"*, bản này *"sẽ hiểu rõ"* (cùng nghĩa).

  **Dùng lại nguyên văn — số đã đo.** Năm khoá dùng lại nguyên văn bản Việt đã có: `0.2` (**3/3** khoá cùng Pāli trên tầng cùng một bản Việt), `1.1` (công thức mở đầu, **5/5** khoá cùng Pāli đã dịch — `sn3.9:2.1`, `sn3.10:2.1`, `sn3.14:2.1`, `sn3.15:3.1`, `sn46.53:1.1` — đều *"Bấy giờ, rất nhiều Tỷ-kheo…"*, nên **giữ cả chữ viết "Tỷ-kheo"** dù toàn tầng sn chỉ có **25** lần "Tỷ-kheo" so với **7.574** "tỳ-kheo"; hệ quả đã biết: `1.1` viết "Tỷ-kheo" còn `2.1`, `4.4` viết "tỳ-kheo"), `8.1` (**1/1** khoá cùng Pāli, `sn46.53:2.1`; `mn13:6.1` cùng Pāli chỉ thiếu dấu mở ngoặc kép và cũng dịch *nên hỏi họ*), `8.4` *"Vì sao vậy?"* (**112** khoá cùng Pāli, **50** cùng dạng này — nhiều nhất; *"Vì lý do gì?"* 32, *"Vì sao?"* 8, còn lại là dạng khác), `16.4` *"Thứ hai."* (**126** khoá cùng Pāli, **122** cùng dạng này). Tổng cặp Pāli trùng nguyên văn đã dò ở **bảy** khoá (năm khoá dùng lại cộng `8.3`, `8.5`): **249**; bản Việt cùng dạng: **181**; khác: **68** (62 ở `8.4` và 4 ở `16.4` là dạng khác trên tầng, 2 ở `8.3` và `8.5`, xem ngay dưới). Năm khoá `1.2`, `1.3`, `1.4`, `4.1`, `4.2` được dựng từ `mn13:2.2`–`2.4`, `4.1`, `4.2` (Pāli gần trùng, khác dấu câu) với cùng lời. `8.3`, `8.5`, `8.6` dựa trên `mn13:6.5`, `6.7`, `6.8` (có *"Này các tỳ-kheo"*). **Hai chỗ KHÁC `sn46.53`, đã đo:** Pāli `8.3` trùng byte với `sn46.53:2.4` và Pāli `8.5` trùng byte với `sn46.53:2.6`, nhưng bản Việt của `sn46.53` **bỏ** `bhikkhave` (`sn46.53` đã ghi điểm này ở `2.6`, chưa ghi ở `2.4`) còn bài này **giữ** *"này các tỳ-kheo"* theo Pāli và theo `mn13` (đã `published`). Vì Pāli có `bhikkhave`, giữ đúng; đây là chỗ hai bài `sn46.52`/`sn46.53` hiện **không khớp nhau** (2 cặp), người điều phối có thể muốn sửa `sn46.53:2.4`, `2.6` cho khớp. **Chưa dịch trên tầng, Pāli trùng byte với bài này:** `sn46.54:11.1`, `11.6`, `11.8` và `an10.27:9.1`, `9.5` (cùng ba câu `8.1`, `8.3`, `8.5` ở đây) và `an10.27:1.2` (cùng `1.1`) — lát nào dịch các bài đó nên dùng lại bản Việt ở đây.

  **Ba điểm CỐ Ý lệch `mn13` khi dùng lại, đã đo.** (a) `4.3`/`7.2` — `ājānissāmā` ở `mn13:4.3` dịch *"hỏi chính Đức Phật"*; Pāli là *biết/hiểu*, không phải *hỏi*, và cả Hòa thượng (*"sẽ được biết"*) lẫn Sujato (*learn*) đều nói *biết*, nên bản này dịch *"hiểu rõ ý nghĩa của lời này ngay nơi Đức Thế Tôn"*. (b) `3.5`/`6.4` — `dhammadesanāya vā dhammadesanaṁ, anusāsaniyā vā anusāsanin`: `mn13:3.5`/`5.11` dịch *"khác về thuyết Pháp hay về giáo huấn"* và Hòa thượng *"về thuyết pháp hay về giáo giới"*; Pāli lặp **cùng một danh từ hai lần** quanh `vā` (*giữa lời thuyết Pháp này và lời thuyết Pháp kia*) và Sujato dịch *between … teaching and instruction and ours*; bản này dịch *"giữa lời thuyết Pháp với lời thuyết Pháp, hoặc giữa lời giáo huấn với lời giáo huấn"* — vì Pāli có phép lặp. Đây là **bất định thật** (cả hai cách đọc đều có người theo): cách đọc của `mn13` không sai về giáo lý, chỉ bỏ mất phép lặp. (c) `1.1` giữ *"vào thành Sāvatthī"* (nguyên văn tầng) còn `1.3` *"ở Sāvatthī"* (theo `mn13:2.3`) — khác giới từ vì Pāli khác (`sāvatthiṁ … pavisiṁsu` accusative so với `sāvatthiyaṁ … carituṁ` locative).

  **Nửa thuật lại — `5.x`–`7.x` so với `1.x`–`4.x`.** Pāli của hai nửa không trùng byte (đổi ngôi `mayaṁ/amhākaṁ`, thêm `bhante`, đổi `‘ ’`/`“ ”`), nên không thể dùng lại nguyên văn; bản Việt giữ **cùng lời** với `1.x`–`4.x` và chỉ đổi ngôi (*"chúng ta"*, *"họ"* → *"chúng con"*) và thêm *"Bạch Thế Tôn"* ở chỗ có `bhante`. `7.2` *"Chúng con sẽ hiểu rõ"* (lời bạch) khác `4.3` *"Chúng ta sẽ hiểu rõ"* (độc thoại của các tỳ-kheo) — đúng theo Pāli. Cặp Pāli trùng byte **trong chính bài**: `3.3` và `6.2`, bản Việt giống nhau.

  **Tên phẩm và tên kinh — đo trước khi đặt.** `0.2` *"6. Phẩm Hỏi Luận"* (**3/3** khoá Pāli `6. Sākacchavagga`). `0.3` `Pariyāyasutta` → **Kinh Cách Thức**. Tiền lệ trực tiếp cho tên này: **0**; chỉ có tên ghép `Atthinukhopariyāyasutta` → *"Kinh Có Con Đường Không?"* (`sn35.153`) và `Ādittapariyāyasutta` → *"Kinh Bài Pháp Về Lửa Cháy"* (`sn35.235`). Sujato đặt *Is There a Way?*; bản này theo từ gốc `pariyāya` + khuôn `Kinh …`. Hệ quả: `sn46.53:1.2` (đã `published`) gọi bài này là *"Kinh Pariyāya"* bằng tên Pāli; người biên tập có thể muốn thống nhất.

  **Thuật ngữ — số đếm (đếm trên tầng, bỏ chính bài này; số khoá có chứa chữ, các nhóm có thể chồng nhau).** `pariyāya*` → **cách thức / theo cách thức này**: trên Pāli có `pariyāy` — sn 146 khoá: *cách* 53 (trong đó *cách thức* 11), *phương tiện* 24, *bài pháp* 17, *con đường* 16, *phương diện* 12, *pháp môn* 10; mn 132: *cách* 53, *phương tiện* 22, *pháp môn* 16; dn 125: *cách* 79, *phương tiện* 17; an 92: *cách* 16, *pháp môn* 6; kn 46: *cách* 16. *Cách* là chữ nhiều nhất ở **cả năm bộ**; *pháp môn* (Hòa thượng) nhỏ hơn ở mọi bộ. Cấu trúc gần nhất `Katamo ca, bhikkhave, pariyāyo yaṁ pariyāyaṁ āgamma …` có ở `sn48.43` (3 khoá) dịch *"cách thức"*, nên lấy *cách thức*. `nīvaraṇa` → **triền cái**: **hai phạm vi cho đa số KHÁC nhau.** Toàn tầng: *triền cái* **175** khoá (sn 48, an 43, mn 39, dn 36, kn 9) so với *chướng ngại* **89** (sn 69, an 11, kn 6, dn 3, mn 0); riêng bộ `sn` lại *chướng ngại* **69** nhiều hơn *triền cái* **48**, và riêng `sn46` *chướng ngại* **54** so với *triền cái* **29** (cụm `sn46.31`–`sn46.40` dùng *chướng ngại*; `sn46.2`, `sn46.56`, `sn46.130` dùng *triền cái*). Chọn **triền cái** vì: công thức `pañca nīvaraṇe pahāya cetaso upakkilese paññāya dubbalīkaraṇe` có **33** khoá trên tầng, đều *triền cái* (`mn51:20.1`, `mn101:38.1`, `dn25:18.8`, `an5.75:15.7`), `sn46.55:23.1` đã dùng *chướng ngại* cho `āvaraṇa` (nên *triền cái* giữ phân biệt `nīvaraṇa`/`āvaraṇa`), và hai bài `sn46` có đúng cụm *năm triền cái* (`sn46.2`, `sn46.56`) đều *triền cái*. Ghi rõ đây là **chỗ tầng chưa thống nhất**. Tên triền cái: *dục tham* (`kāmacchanda`, **119** so với *tham dục* 47 trên sn), *sân hận* (`byāpāda`: sn 10/27, mn 28/49, an 33/77, dn 18/32; không có *ác ý* ở sn), *hôn trầm và buồn ngủ* (`thinamiddha`: *hôn trầm* 20/20 trên sn; tách `thina`=hôn trầm, `middha`=buồn ngủ ở `9.6` đúng theo cặp Pāli), *xao động* (`uddhacca`: **17** so với *trạo cử* 11), *hối tiếc* (`kukkucca`: **24** so với *hối hận* 8), *nghi hoặc* (`vicikicchā`: **32**). Bảy giác chi: *niệm giác chi* 42/43, *trạch pháp giác chi* 11/12, *tinh tấn giác chi* 9/9, *hỷ giác chi* 10/10, *khinh an giác chi* 9/9, *xả giác chi* 78/79 (và *định giác chi* theo `sn46.2`). `savitakkasavicāra` → *có tầm có tứ*, `avitakkaavicāra` → *không tầm không tứ* (`sn43.3:1.2`, `dn33:1.10.121`). `pavicinati pavicarati parivīmaṁsamāpajjati` → *"tìm hiểu, phân tích, quán sát kỹ"* theo `mn118:31.1`, `31.2` (**2** khoá, cùng nhóm động từ, đã `published`); `sn46.3:2.4` dịch khác (*thẩm sát và tầm cứu*, **1** khoá). `kāyika`/`cetasika` → *thuộc thân*/*thuộc tâm* (`sn36.6`, `sn48.37`). `etha tumhe` → *"hãy đến đây, hãy …"* (`dn11:1.9`, `sn47.4:2.3`, `sn16.6:4.6`). Mọi chữ khác dùng lại công thức đã có ở `mn13`.

  **Số Pāli — tự tính, kèm phép.** `pañca nīvaraṇā dasa honti`: 5 triền cái → `dasa` = **10**; đúng **5** cặp ở `9.2`–`9.11` (dục tham, sân hận, hôn trầm/buồn ngủ, xao động/hối tiếc, nghi hoặc), mỗi cặp 2 ⇒ 5 × 2 = 10. `satta bojjhaṅgā catuddasa honti`: `catuddasa` = `catu` 4 + `dasa` 10 = **14**; đúng **7** giác chi ở `10.2`–`16.2` ⇒ 7 × 2 = 14. Hai con số khớp số mục thật của bài. Số Ả-rập trong bản Việt chỉ ở `0.1` (`46.52`) và `0.2` (`6.`), giữ như khuôn.

  **Bất định đã ghi — không đưa vào thân kinh.** (1) `8.1` `evamassu vacanīyā` dịch *"các thầy nên hỏi họ"* (nguyên văn `sn46.53:2.1`, và `mn13:6.1`); nghĩa đen Pāli là *nên được nói với họ như sau*, Hòa thượng dịch *"cần phải trả lời với các du sĩ ngoại đạo như sau"*; vì điều sau đó **là một câu hỏi** nên hai cách đều đúng ngữ cảnh, giữ *hỏi* để các bài khớp nhau. (2) `3.5`/`6.4` như trên. (3) `uddesaṁ gacchati` → *"được nêu gọn là"*: cụm này **0** tiền lệ trên tầng; `uddesa` ở sn chỉ có **4** khoá, đều là `sauddesaṁ` trong công thức túc mạng (khác nghĩa), nên chọn theo Sujato. (4) `ajjhattaṁ kāmacchando` có thể đọc *dục tham đối với (pháp) bên trong* hoặc *dục tham ở bên trong mình*; bản Việt giữ *"dục tham bên trong"* **không** giải thích thêm, giống Hòa thượng (*nội dục tham*). (5) `Tadamināpetaṁ pariyāyena dvayaṁ hoti` → *"Và cũng theo cách thức này, nó trở thành hai"*: `pi` trong `Tadamināpetaṁ` được tính là *cũng*. (6) `yadapi … tadapi` dịch thành hai mệnh đề song song *"X là …, và Y cũng là …"* theo Sujato, không dịch `tadapi` thành *"cũng chính là"*.

  **Năm phép kiếm — kèm mẫu số, nói rõ phép nào chạy rỗng.** (1) tập khoá Việt **65** = tập khoá Pāli **65**, `list(vi) == list(pali)` đúng, khoá ngoài `keys` = **0**. (2) nháy đơn `‘’` và ngoặc kép `“”` khớp Pāli **từng khoá**: lệch **0/65**; tổng hai bên đều `‘`=18, `’`=18, `“`=7, `”`=7. (3) Pāli trùng nguyên văn **trong chính bài**: **1** nhóm / **1** cặp (`3.3` = `6.2`), bản Việt khác = **0** — phép này **có mẫu số nhưng rất nhỏ**, vì bài lặp theo mẫu (`9.x`, `10.x`–`16.x`) chứ không trùng byte; các khoá lặp mẫu được so bằng mắt: câu thứ hai *"Và cũng theo cách thức này, nó trở thành hai."* **giống hệt** ở **12/12** khoá (`9.3`, `9.5`, `9.7`, `9.9`, `9.11`, `10.3`, `11.2`, `12.2`, `13.2`, `14.2`, `15.2`, `16.2`). (4) dấu lược: Pāli có `…` ở **0/65** khoá và Việt có `…` ở **0/65** khoá nên các phép `…pe…`, *không thừa `…`*, `(…)` và *kết `….`* đều **không có mẫu số — chạy rỗng, không phải đã đạt**. (5) số Pāli: xem mục trên. Kiểm phụ: lệch NFC **0**, khoá rỗng **0**, khoảng trắng thừa **0**; chữ Pāli còn trong Việt ở **7** khoá, đều là **tên riêng cố ý giữ**: `Saṁyutta Nikāya` (`0.1`, khuôn của cả sách), `Sāvatthī` (`1.1`, `1.3`, `4.4`, `5.1`, `5.3`) và `Māra` (`8.6`, nguyên văn `mn13:6.8`).

  **Lượt review đối kháng — in từng cặp Pāli↔Việt rồi đọc ngược về Pāli.** Không bắt được lỗi nghĩa nào ở bản nháp đầu; các điểm sau là **quyết định có chủ đích**, đã ghi ở trên, không phải lỗi sửa sau: (1) lệch `mn13` ở `4.3`/`7.2` và `3.5`/`6.4`; (2) giữ `bhikkhave` ở `8.3`, `8.5` khác `sn46.53`. Lỗi trong **ghi chú nháp của chính tôi** đã sửa trước khi lưu: ghi *"bảy khoá"* dựng từ `mn13` (đúng là **năm**), và một bảng đếm `pariyāya`/`nīvaraṇa` đầu tiên có lỗi lọc (đếm lại đúng thì `nīvaraṇa` trên bộ `sn` nghiêng về *chướng ngại*, đã ghi ở mục thuật ngữ).

  **Cổng kỹ thuật chưa chạy được — lát bị cấm lệnh cổng.** Vì vậy `technical_integrity` đặt **9,6** và **không** tuyên bố technical gate pass. Bốn lệnh còn lại của kho, người điều phối chạy giúp: `npm run validate` · `npm test` · `npm run check` · `npm run build`; cộng `npm run reference:gaps` (bài đạt sát ngưỡng English 46/57).
