notes: |-
  Dịch từ Pāli root (63 khoá, đủ tập khoá, đúng thứ tự), đối chiếu bản Anh Bhikkhu Sujato đã ghim. Tầng Việt hiện hành không có cho bài này (bilara tại commit ghim chỉ có Pháp Cú), nên không đối chiếu được bản Hòa thượng Thích Minh Châu; thuật ngữ dựa vào tiền lệ các bài `sn22` đã publish.
  Coverage English: mẫu số = 20 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); Sujato phủ 20/20; không cần lớp `english-project`. Các khoá Sujato để trống (`2.6–2.8`, `2.11–2.13`, `4.10`) đều là khoá Pāli ngắn dưới ngưỡng, phần lặp công thức, Pāli tự đứng vững.
  Công thức `seyyohamasmī / sadisohamasmī / hīnohamasmī` → *Tôi hơn / Tôi ngang / Tôi kém* (`an4.185:4.6` dùng đúng ba dạng này); `sn35.108` dùng *Ta tốt hơn / Ta bằng người / Ta thua kém* và `sn45.162` dùng *Tôi là hơn/bằng/kém* — ba cách đều có trong kho, bài này theo `an4.185` vì sát chữ nhất. `samanupassanti` → *thấy rằng*. `kimaññatra yathābhūtassa adassanā` không có tiền lệ trong kho; dịch *ngoài sự không thấy như thật, đó còn là gì?* (Sujato: *What is that but a failure to see truly?*).
  Cú pháp `aniccena rūpena dukkhena vipariṇāmadhammena … samanupassanti` (công cụ cách) → *dựa vào sắc vô thường, khổ, chịu sự biến hoại mà thấy rằng …*, theo Sujato *based on form …*; bốn uẩn còn lại cùng cấu trúc. Khối `3.x` có `tipi na` (*cũng không thấy*) — phủ định của khối `2.x`, phải giữ để hai khối đối nhau.
  Khối `4.x` (vô thường–khổ–vô ngã) theo `sn22.59:6.x` đã publish: *Cái gì vô thường thì là khổ hay là lạc?* · *có hợp lý chăng khi quán xét điều ấy:* · *Cái này là của tôi, cái này là tôi, cái này là tự ngã của tôi*. Khối `5.1/6.4` theo `sn22.59:7.1/10.1` và `sn22.48`: *thấp kém hay thù thắng* (15 khoá `sn` so với *liệt hay thắng* 2 khoá). Khối `7.1–7.2` theo `sn22.12/14/61`: *chán nản* (51 khoá `sn`, so với *nhàm chán* 22) và *đã giải thoát thì có sự biết rõ là đã giải thoát*. `7.3` theo `sn22.45:1.20`: *không còn gì là tự thân nữa* (107 khoá `sn`, so với *không còn trở lại trạng thái này nữa* 27 khoá).
  Bất định 1: `soṇo gahapatiputto` — Pāli là *con của gia chủ* (`putta`); Sujato viết *the householder Soṇa*, bỏ `putta`. Theo Pāli, *con của gia chủ* (27 khoá toàn kho, *con trai gia chủ* 18). Tiền lệ `sn22.50:1.3` dịch *con nhà Cấp Cô Đế* không có căn cứ trong Pāli của bài này, nên không dùng lại.
  Bất định 2: `…pe…` ở `1.3` che phần còn lại của công thức mở đầu (đảnh lễ, ngồi một bên); giữ đúng một `…`. Tên bài `Soṇasutta` → *Kinh Soṇa* (`ud5.6:0.2` dùng *Kinh Soṇa* cho một bài khác, `sn35.128:0.3` dùng *Kinh Con Nhà Soṇa*); bài này không có hậu tố nào để phân biệt trong chính bài nên chọn dạng ngắn.
  Ghi chú ngoài phạm vi: `sn22.50:0.3` hiện là *Kinh Lời Dạy Bậc Thứ Hai*, không phải *Kinh Soṇa (Hai)* như Pāli `Dutiyasoṇasutta`; người biên tập nên kiểm.
  Tự kiểm: tập khoá Việt = tập khoá Pāli, 63/63; nháy đơn và nháy kép khớp Pāli từng khoá, 0 lệch; 12 nhóm Pāli trùng nguyên văn trong bài, 0 nhóm bản Việt khác nhau; dấu lược `…` khớp Pāli từng khoá, 0 lệch; NFC, không khoá rỗng, không Pāli lọt sang Việt. Bài không có số đếm Pāli.
  technical_integrity 9.6 vì cổng chưa chạy ở bài này: các lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` do người điều phối chạy.
