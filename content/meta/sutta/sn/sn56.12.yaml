notes: |-
  **Cổng kỹ thuật của kho CHƯA chạy.** Đợt này lát được cấm chạy `npm run validate|test|check|build`,
  nên tôi **không** thể tuyên bố technical gate pass; `technical_integrity` đặt **9.6** chứ không
  phải 10.0 và bốn lệnh đó để người điều phối chạy. Tự kiểm riêng bằng script trên **MỌI** khoá
  (không chỉ khoá ≥ 40 ký tự mà `kiểm()` của `_hvi.py` quét): đủ số khoá của cả bài, đúng segment
  ID, không rỗng, NFC, không trùng nguyên văn Pāli, dấu lược khớp Pāli từng khoá, ngoặc kép cân
  trên cả bài, không `(…)`, không sót `pe…`, không Pāli lọt. Kết quả: SẠCH, 0 lỗi trên 236 khoá
  của cả lát.

  **Dấu lược — theo §10, không tự diễn giải.** Pāli có `…pe…` thì bản Việt giữ **một** `…` và
  **không** viết ra phần bị lược. Pāli viết đủ thì viết đủ; tôi **không** nén bằng `…` ở bất kỳ
  khoá nào. Hai khoá lệch dấu câu cuối câu (`cp33:1.3`, `cp5:1.1`: Pāli có dấu phẩy, bản Việt
  không) là **cố ý theo đúng tiền lệ `cp28:1.1`** — bản Việt của tầng không nhất thiết giữ dấu
  phẩy ở vế kệ đầu câu.

  **Pāli trùng nguyên văn ở bài khác — đếm bằng script, dùng lại nguyên văn đã có.** Quét toàn
  tầng Pāli gốc (5.764 tệp `*_root-pli-ms.json`, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn**
  từng khoá của lát này: **9 cặp trùng** (đếm theo cặp khoá-của-tôi × uid-khác, chỉ tính văn
  bản ≥ 20 ký tự sau chuẩn hoá). Trong đó **9 cặp đã có bản Việt ở bài khác và tôi dùng lại
  nguyên văn** (xem danh sách dưới); phần còn lại đều là bài chưa có bản Việt nên tôi đặt mới.
  **22 cặp dùng lại được đối chiếu từng chữ: 20 khớp tuyệt đối, 2 khớp phần thân nhưng khác
  hậu tố** — `ja151:2.1` và `ja178:2.1` phải mở lại dấu nháy kép vì Pāli mở nháy đúng ở đó (vế kệ
  đầu của bài kệ mới), nên đó là bắt buộc của chia khoá chứ không phải dịch khác.

  **Dùng lại (nguyên văn, không dịch lại):**
  · `sn56.12:0.2` trùng nguyên văn 9 bài cùng phẩm (`sn56.11`, `13`–`20`). Trong 9 bài
    đã có bản Việt, cách dùng **chia đôi 4–4**: `sn56.17`/`18` ghi *2. Phẩm Lăn Pháp Luân*, `sn56.19`/`20` ghi
    *2. Phẩm Chuyển Pháp Luân*. Tôi theo *Chuyển Pháp Luân* — `cakkavattin` ở `5. Cakkavattivagga` cùng
    Tăng Bộ đã dùng đúng cách đó 7 lần, và đây là thuật ngữ quen của người Việt; ghi ra đây để người
    biên tập thống nhất nếu muốn.

  **Thuật ngữ mới của lát, đặt mới kèm lý do:**
  · Công thức 5 vị `cakkhuṁ / ñāṇaṁ / paññā / vijjā / āloko udapādi` dịch **đúng y như
    `dn14:2.19.6`, `dn14:2.21.5` và `sn36.25:1.1`** (cùng công thức, cùng `pubbe ananussutesu dhammesu`):
    *mắt, trí, tuệ, minh và sáng*. Bản nháp tôi tự chế *pháp nhãn sinh khởi, trí sinh khởi…* — thừa chữ
    *pháp* vào nơi Pāli chỉ có `cakkhu` — đã bỏ.
  · `pubbe ananussutesu dhammesu` → *các pháp chưa từng được nghe trước đây* (theo `sn36.25`), không
    phải *chưa từng học* (0 tiền lệ trong kho).
  · `tathāgata` → **Như Lai** (1.106 lần / 248 bài trong tầng; chữ *Tathāgata* không xuất hiện lần nào).
    Đây là tiền lệ bắt được nhiều nhất của lát: nháp tôi viết *Tathāgata* ở cả tiêu đề lẫn bốn khoá thân
    bài, và nếu ghi nguyên như vậy thì đó là **Pāli lọt** vì tầng chưa từng dùng chữ đó.
  · `Tathāgatasutta` → **Kinh Các Bậc Như Lai**. `Tathāgatasutta` còn xuất hiện ở `sn45.139` và
    `sn51.32`, nhưng cả hai đều **chưa có bản Việt**, nên không có tiền lệ để theo — đặt mới.
  · `ariyasacca` → **Thánh đế** (133 lần / 31 bài), giữ nguyên số thứ tự bộ như `sn56.19:1.1`–`1.6`.
  · `pariññeyya / pahātabba / sacchikātabba / bhāvetabba` → *hiểu cho trọn / từ bỏ / chứng ngộ / tu tập*
    (cần khớp với ba dạng thứ tự của Pāli: cần phải … / đã được …).

  **Bất định chưa phân xử trọn, ghi ở đây thay vì đoán trong thân kinh:**
  · Bốn khoá có `…pe…` (`1.2`, `2.2`, `3.2`, `4.2`) là chỗ dễ sai nhất của bài này. Pāli lược
    đúng đoạn `ananussutesu dhammesu cakkhuṁ udapādi, ñāṇaṁ udapādi, paññā udapādi, vijjā udapādi,
    āloko`, nên bản Việt phải dừng ở `pubbe` (= *trước đây*) rồi để `…`, rồi mới sang `udapādi`
    (= *đã sinh khởi*). Tôi viết *nơi các bậc Như Lai, trước đây … đã sinh khởi*. Câu này **hơi cộc** —
    đó là hệ quả của luật không mở rộng peyyāla, không phải lựa chọn văn phong của tôi. Sujato ở đây chỉ
    còn một mẩu `…` trần, nên **không dùng được làm chốt**: đó là lý do `triangulation` chỉ 9.0.
  · `tathāgatānaṁ` là cách sở hữu đứng **trước** `pubbe` trong Pāli; tôi đưa xuống cuối câu (*đã sinh
    khởi nơi các bậc Như Lai*) vì tiếng Việt không đảo được, và đây đúng là cách `sn36.25:1.1` đã làm.
