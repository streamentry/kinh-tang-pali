notes: |-
  Đợt 19, lát l23. Dịch trọn 81/81 khoá từ Pāli root commit đã ghim, đối chiếu English Sujato đã ghim và các bài cùng phẩm đã dịch (sn54.1, 54.3, 54.7–54.10, 54.14, 54.15) cùng công thức bảy giác chi ở mn118, sn46.3.

  **Coverage Anh trên Pāli có nội dung: 9/67 = 13,4%** (mẫu số: khoá Pāli từ 40 ký tự trở lên, bỏ khối :0) — dưới sàn 0,80. Sujato chỉ dịch phần mở đầu (1.1–1.4, 2.1–2.2, 3.1–3.2) và câu kết 18.5; từ 3.3 đến 18.4 (58 khoá có nội dung) để trống vì bài là bản lược của công thức niệm hơi thở. Chưa có lớp english-project cho bài này. Không tầng Anh nào khác phủ được; tầng Việt hiện hành (Hòa thượng Thích Minh Châu) không có cho bài này tại commit đã ghim. Vì vậy bài giữ draft kèm blocker, triangulation 6,5; tại các khoá trống, Pāli tự đứng vững và được đối chiếu với tiền lệ Việt của cùng công thức, không phải bản Anh độc lập.

  **Dùng lại nguyên văn tiền lệ.** Dò 23 khoá có Pāli trùng nguyên văn với bài đã dịch trên toàn tầng (sn, mn, an, dn, kn; 3.265 tệp): 15 khoá dùng lại đúng một bản đã có, 8 khoá khác bản đã có: 1.3 (an9.1 ghi Đức Phật; theo sn54.14 giữ Đức Thế Tôn) · 3.1 (sn54.15 ghi định niệm hơi thở / làm tròn; theo đa số tầng, xem dưới) · 6.3 (theo cấu trúc sn54.10 thay vì Vị ấy tập như sau) · 9.1, 18.1, 18.5 (mn118 dịch có để làm viên mãn, thêm ý mục đích mà Pāli không có; giữ cấu trúc sn54.10) · 11.1 (sn46.3 ghi trạch pháp, thẩm sát, tầm cứu; theo mn118 và các khoá 10.x liền trước) · 16.1 (xem bất định). Trong chính bài có 4 nhóm Pāli trùng (4.5/5.6/6.6; 15.1/17.1; 15.2/17.2; 15.3/17.3), cả 4 nhóm bản Việt giống nhau.

  **Thuật ngữ, kèm số đếm.** ānāpānassatisamādhi → định chánh niệm hơi thở (32 khoá toàn tầng sn, so với định niệm hơi thở 14 khoá, trong đó có bài kế sn54.15 và sn54.14; bài này theo đa số, người biên tập nên thống nhất ba bài) · paripūreti → làm viên mãn (11 khoá sn, so với làm tròn 5; sn54.15 dùng làm tròn) · vijjāvimutti → minh và giải thoát (10/14 khoá sn và an; sn54.14 dùng minh giải thoát, 2 khoá; sn54.15 dùng giải thoát và trí tuệ, 2 khoá) · ātāpī sampajāno satimā, vineyya loke abhijjhādomanassaṁ → tinh cần, tỉnh giác, có niệm, xa lìa tham lam và buồn phiền nơi đời (đa số trong sn47, sn52, sn54.10) · bhāvanāpāripūriṁ gacchati → đi đến sự viên mãn của tu tập (mn117, mn118, mn149; sn46.3 dùng được đưa đến sự viên mãn của sự tu tập) · vivekanissitaṁ… vossaggapariṇāmiṁ → y cứ vào viễn ly, y cứ vào ly tham, y cứ vào diệt tận, và hướng đến buông bỏ (23 khoá trùng nguyên văn Pāli trên toàn tầng, 14 khoá cùng bản Việt này) · paṭinissaggānupassī → quán buông bỏ (sn54.8, sn54.10; 3 khoá khác dùng quán sự phân ly) · Dutiya…sutta → (Hai) (111 tên bài Dutiya… trong sn dùng (Hai), 45 dùng Thứ Hai); tên bài Kinh Tỳ-kheo (Hai) đối ứng Kinh Tỳ-kheo (Nhất) ở sn54.15.

  **Số Pāli.** cattāro → bốn (bốn pháp, bốn niệm xứ), satta → bảy (bảy pháp, bảy giác chi), dve → hai (hai pháp), ekadhammo → một pháp; đối chiếu từng khoá 1.2, 1.4, 2.1, 2.2: Pāli bốn, bảy, hai, một khớp Việt bốn, bảy, hai, một. Không có số lớn.

  **Bất định đã ghi.** (1) 3.3 có sn54.3, 54.7, 54.9 dịch So satova assasati, satova passasati …pe… thành chỉ hít vào, chỉ thở ra, bỏ mất satova (chỉ có niệm); bài này giữ nghĩa Pāli theo sn54.10:4.6 (chỉ có niệm mà thở vào, chỉ có niệm mà thở ra). 3.2 giữ nguyên văn đa số 4 khoá sn54 (đến núi rừng… kết già co, dựng thân ngay ngắn, thiết lập chánh niệm trước mặt), nên 3.2 dùng chánh niệm còn 3.3 dùng niệm; hai cách đều có tiền lệ. (2) 16.1 và 16.2: Pāli chỉ có vedanāsu …pe… và citte …pe… (lược phần vedanānupassī viharati). mn118:37.1 dịch bung thành sống quán thọ nơi các thọ; bài này giữ nguyên dấu lược và chỉ dịch phần Pāli có mặt (nơi các cảm thọ …, nơi tâm …), không bung vì quy tắc chỉ giữ một dấu lược. (3) Các khoá 4.2, 5.1–5.3, 6.1–6.2, 7.1–7.3 chỉ là một tính từ Pāli dưới dấu lược (sabbakāyappaṭisaṁvedī, pītippaṭisaṁvedī, aniccānupassī…); dịch theo từng tính từ (cảm nhận toàn thân, quán vô thường…), không thêm động từ tập. (4) Dấu ngoặc kép: Pāli 1.4 mở và 18.5 đóng, hai ngoặc này mở xuyên nhiều khoá; 2.2 kết bằng iti nhưng Pāli không có dấu đóng nên bản Việt không đóng. (5) Pāli có …pe… hoặc … ở 1.3, 3.3, 4.1, 4.2, 5.1–5.3, 6.1, 6.2, 7.1–7.3, 16.1, 16.2, 16.5, 18.3; mỗi khoá giữ đúng một …, không có (…) trần nên không dùng (…). (6) 1.2: câu hỏi nu kho dịch có … không? vì Pāli là câu hỏi.

  **Kiểm tra bắt buộc đã chạy.** Tập khoá Việt = Pāli (81 = 81, đúng thứ tự); nháy đơn và ngoặc kép khớp Pāli ở cả 81 khoá (0 lệch); dấu lược khớp có/không và kết ….; NFC 0 lỗi; 0 khoá rỗng, 0 khoảng trắng thừa; 0 chữ Pāli lọt sang Việt (ngoài khoá 0.1 tên bộ); 4 nhóm Pāli trùng nguyên văn trong bài đều có bản Việt giống nhau; số Pāli khớp 4/4 khoá có số đếm. Đã in cặp Pāli với Việt của cả 81 khoá để đọc.

  **Cổng kỹ thuật.** Không chạy npm run validate, npm test, npm run check, npm run build trong phiên này; technical_integrity đặt 9,6, chưa tuyên bố pass. Trạng thái do blocker coverage, không phải do điểm.
