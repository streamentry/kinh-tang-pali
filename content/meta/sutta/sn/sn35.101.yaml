notes: |-
  Dịch từ Pāli root của SuttaCentral/Bilara (commit pin 11c9d708), đối chiếu bản Anh của Bhikkhu Sujato đã ghim. Không có tầng Việt hiện hành ở dạng phân đoạn tại commit này (chỉ có Pháp Cú); bản Việt nguyên bài của Hòa thượng Thích Minh Châu (Bình Anson hiệu đính) chỉ dùng tra cứu thuật ngữ, không cấp văn bản cho bản dịch.

  Coverage English: Sujato phủ 14/22 đoạn Pāli có nội dung (≥ 40 ký tự, bỏ khối :0) = 63,6%, DƯỚI ngưỡng 0,8. Tám đoạn Sujato để trống: 1.9, 1.12, 2.6, 2.9, 2.13, 2.14, 3.6, 3.9 (các câu lặp "được từ bỏ sẽ vì lợi ích và hạnh phúc", cùng 2.13 là câu cảm thọ của lưỡi và 2.14 là đoạn lược). Lớp english-project của dự án có điền các chỗ này nhưng chưa có metadata published nên không được tính vào coverage, và cũng không phải bản đọc Anh độc lập; do đó `triangulation` hạ xuống 7,8 và bài này cần có entry trong content/meta/reference-gaps.yaml (chạy `npm run reference:gaps`) để `validate` không chặn status. Một ô Anh rỗng không phải sự đồng thuận về cách dịch: các đoạn đó Pāli phải tự đứng vững.

  Cấu trúc và chỗ cần lưu ý:
  - 0.3: `Paṭhamanatumhākasutta` → "Kinh Không Phải Của Các Ông (Một)". Tầng đã có `sn22.33` và `sn35.139` "Kinh Không Phải Của Các Ông (Hai)", `sn22.34` cùng tên, `sn35.138` "…Thứ Nhất" — 3 bài dùng "Không Phải Của Các Ông", chỉ `sn35.102` dùng "Kinh Từ Bỏ Điều Không Của Mình (Hai)" (bài đôi của bài này). Hai tên này lệch nhau và nên được người biên tập thống nhất; bài này theo số đông.
  - 0.2: `Saḷavagga` → "10. Phẩm Sáu" (tiền lệ `sn35.94`–`sn35.100`, 8 bài).
  - Dải căn: Pāli đọc đủ mắt → sắc → thức mắt → xúc mắt → cảm thọ, rồi 1.19 `…pe…` lược tai–mũi, đi thẳng sang lưỡi (2.x), 2.14 `…pe…` lược thân, và đi tới ý (3.x). Bản Việt giữ đúng ba dấu lược này, mỗi chỗ một `…`; 2.14 kết ` ….` theo Pāli `…pe….`.
  - Gọi tên: "thức mắt", "xúc mắt", "xúc ý" theo `sn35.100`, `sn35.162`–`164`; "cảm thọ nào khởi lên do duyên xúc …, dù lạc, dù khổ hay không khổ không lạc" theo `sn35.30`.
  - `Taṁ vo pahīnaṁ hitāya sukhāya bhavissati` → "Cái ấy được từ bỏ sẽ vì lợi ích và hạnh phúc cho các ông" (tiền lệ `sn22.33`, 6 khoá); `Te vo pahīnā … bhavissanti` → "Chúng được từ bỏ…" (`sn35.139`); `So/Sā vo pahīno/pahīnā …` → "Nó được từ bỏ…". Tiếng Việt không đánh dấu giống ngữ pháp Pāli, nên chỉ phân biệt số ít/nhiều và đối tượng chung/riêng.
  - "các ông" (vo, tumhākaṁ) theo `sn22.33/34`, `sn35.138/139`; `sn35.102` ghi "các người" ở nửa câu đầu và "các ông" ở nửa sau — không theo.
  - 4.1–4.3: `tiṇakaṭṭhasākhāpalāsaṁ` → "cỏ, cây, cành, lá" (`sn15.1`, `sn56.36`, `sn22.33`); `yathāpaccayaṁ` → "tùy theo ý muốn" (`sn22.33`, `sn35.138`). `4.2` kết bằng dấu hai chấm, dấu hỏi nằm ở 4.3 (`ti?`), nên 4.2 nối vào 4.3 bằng "ý nghĩ:"; ngoặc kép mở ở 1.1 đóng ở 4.3, nháy đơn mở và đóng trong 4.3, khớp Pāli từng khoá.
  - 5.1 `No hetaṁ, bhante` → "Thưa không phải vậy, bạch Thế Tôn" (đa số tầng: 57 khoá). 6.1 `Taṁ kissa hetu` → "Vì sao vậy?" (48). 7.1 dùng lại nguyên văn `sn22.33:2.6`.
  - 8.4–8.6 giữ đúng ba dấu lược của Pāli (…, …, …pe…).
  - Số: không có số lượng trong Pāli, trừ `Aṭṭhamaṁ` ở 8.10 = "Thứ tám".
  - Không có đoạn nào Pāli nghĩa đen mâu thuẫn ngữ cảnh. Điểm chưa chắc duy nhất là cách phân biệt `Taṁ`/`So` bằng "cái ấy"/"nó": chỉ là quy ước biên tập, không phải khác biệt nghĩa.

  Tự kiểm: tập khoá Việt = tập khoá Pāli (67/67, đúng thứ tự); nháy đơn/nháy kép khớp Pāli ở 67/67 khoá; 5 nhóm Pāli trùng nguyên văn trong chính bài (26 cặp) thì bản Việt trùng đủ 26/26; NFC, không khoá rỗng, không Pāli lọt sang Việt. Đối chiếu với tầng: 48 khoá có Pāli trùng ở bài khác, dùng lại nguyên văn 36, khác 12 (đều có lý do ở trên).

  Cổng kỹ thuật chưa chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa được chạy cho bài này; `technical_integrity` đặt 9,6 chứ không tuyên bố đã pass.

  Giải quyết draft 2026-10-12: blocker cũ về độ phủ tiếng Anh (14/22 = 0,636 dưới 0,80) thuộc loại giới hạn của bản Anh đã ghim, không phải lỗi văn bản, nên đã gỡ khỏi `blocking_errors`. Căn cứ: Sujato để trống 8 đoạn Pāli có nội dung là 1.9, 1.12, 2.6, 2.9, 2.13, 2.14, 3.6, 3.9; đã đọc đối kháng từng đoạn từ Pāli. 1.9, 1.12, 2.6, 2.9, 3.6, 3.9 là câu điệp `Taṁ/Te vo pahīnaṁ/pahīnā hitāya sukhāya bhavissati/bhavissanti`, Pāli y hệt các câu Sujato đã dịch ở 1.2, 1.6, 1.18, 3.3, 3.15 và trùng nguyên văn trong chính bài; bản Việt của từng cặp trùng cũng giống nhau. 2.13 là câu cảm thọ do duyên xúc lưỡi, cùng khuôn với 1.16 và 3.13 mà Sujato có dịch ở 1.16 và 3.13. 2.14 là đoạn lược `…pe….` giữ ` ….`. Cả tám đoạn tự đứng vững từ Pāli, không còn nghĩa nào chưa chắc. Một ô Anh rỗng vẫn không phải sự đồng thuận về cách dịch; `triangulation` giữ 7,8 (không quá 8,0) vì ba tầng tham khảo đều không phủ trọn bài. Mục "Coverage English" ở trên vẫn đúng về số đo; phần nói bài "giữ draft cho đến khi english-project lấp" bị thay thế bởi mục này, và mất mát được ghi nhận ở content/meta/reference-gaps.yaml.
  Đọc đối kháng toàn 67 khoá: không phát hiện lỗi nghĩa (0/67 khoá sửa). Đã đối chiếu từng dải căn–cảnh–thức–xúc–thọ với Pāli và Sujato (1.4–1.16, 3.1–3.13, 8.1–8.9), `Rasā` = "các vị", `pajahatha` số nhiều mệnh lệnh = "hãy từ bỏ", `yathāpaccayaṁ` = "tùy theo ý muốn", 7.1 trùng nguyên văn `sn22.33:2.6`. 8.6 Pāli kết `…pe…` được dịch đúng một `…`; 8.4, 8.5 `…` giữ `…`. Không có khoá nào đổi nên bản JSON không đổi.
  Tiền lệ: giữ kết quả đã đo ở trên (26/26 cặp Pāli trùng trong bài khớp bản Việt); tên bài "Không Phải Của Các Ông" vẫn theo số đông, `sn35.102` ("Từ Bỏ Điều Không Của Mình") lệch tên và dùng "các người", đề nghị người biên tập thống nhất, không thuộc phạm vi sửa ở đây.
  Bản Việt nguyên bài ở mục Tra cứu toàn văn không được tham chiếu để chép câu chữ; tầng Việt hiện hành không có ở dạng phân đoạn (chỉ Pháp Cú), là giới hạn tham chiếu chứ không phải lỗi văn bản. Cổng kỹ thuật `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này; `technical_integrity` giữ 9,6.
