notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato và bản Hòa thượng Thích Minh Châu (nguyên bài, mục tra cứu toàn văn; tầng Việt hiện hành phân đoạn vắng ở commit đã ghim, chỉ có Pháp Cú). Coverage English = 45/45 khoá Pāli có nội dung (≥ 40 ký tự) = 100% bằng bản Sujato đã ghim; bài này không có lớp english-project nên không có khoá nào dựa vào bản lấp của dự án, triangulation độc lập ở mọi khoá có nội dung. 25 khoá Pāli ngắn hơn 40 ký tự không vào mẫu số; trong đó Sujato để trống 7 khoá (9.10, 9.11, 10.0 đến 10.4), các khoá ngắn còn lại đều có Sujato.
  Số Pāli: bài không có số lượng nào cần tính (không có sata, sahassa hay chữ số), phép kiểm số chạy trên 70 khoá và không có kết quả nào.
  Tiền lệ: 22/70 khoá có Pāli trùng nguyên văn với bài khác trong tầng; 14 khoá dùng lại nguyên văn một dạng đã có (0.2 theo 8 bài cùng phẩm, 0.3 an5.201 và 2 bài, 1.1 225/434, 2.2 mn54:3.5, 3.1 mn115:3.1, 4.3 109/209, 5.2 mn118:24.2, 5.6 6.6 7.6 Vì sao vậy 299/462, 9.7 22/52, 9.8 23/51, 9.10 Thứ mười 261/266, 10.0 Tóm lược 358/477). 8 khoá lệch có chủ ý: 4.1 chọn chú tâm kỹ (13 khoá) thay vì chú tâm khéo léo ở mn152:3.5 (4 khoá); 4.2 chọn Thưa vâng như sn54.9 và sn23.4 (19 khoá) thay vì Dạ vâng (22 khoá, hầu hết dn16); 4.5 chọn ngồi xuống kiết già (46 khoá, cùng sn54.5 và sn54.7) thay vì kết già co (7 khoá, gồm an4.36 và an10.60:13.2), đi đến rừng thay vì đến núi rừng; 4.6 xem dưới; 4.7 xem dưới; 5.3, 6.2, 6.3 theo cấu trúc mn118:24.3, 25.2, 25.3 (vị ấy tập, cảm nhận hỷ, lạc, tâm hành) thay vì gộp hai câu như sn54.1:2.3, 3.2, 3.3. Pāli trùng trong chính bài: 1.4 và 2.4 (Việt giống nhau), 5.6 6.6 7.6 (Việt giống nhau), 4.7 và 8.4 chỉ khác dấu cuối khoá nên Việt cũng chỉ khác dấu cuối.
  Thuật ngữ: ānāpānassatisamādhi dịch định chánh niệm hơi thở theo sn54.9 và sn54.4 (cùng phẩm); thở vào, thở ra 70 khoá so với hít vào 12 khoá; sikkhati dịch tập 76 khoá so với học 4 khoá; kāye kāyānupassī dịch sống quán thân trên thân 53 khoá sn; ātāpī sampajāno satimā vineyya loke abhijjhādomanassaṁ dịch tinh cần, tỉnh giác, có niệm, xa lìa tham lam và buồn phiền nơi đời, đa số tầng sn (98 khoá so với từ bỏ tham lam và ưu não 25, nhiếp phục tham ưu 24, gạt bỏ tham và ưu 8 ở mn118); paṭinissaggānupassī dịch quán buông bỏ (10 khoá) thay vì quán sự phân ly (6 khoá, sn54.4:1.5, sn54.7:5.3, sn54.9:8.3); passambhayaṁ kāyasaṅkhāraṁ dịch làm lắng dịu thân hành theo mn118:24.4; sabbakāyappaṭisaṁvedī cảm nhận toàn thân (4 khoá); abhippamodayaṁ làm tâm hoan hỷ (8), samādahaṁ làm tâm định tĩnh (8), vimocayaṁ làm tâm giải thoát (6 so với giải thoát tâm 2); sādhukaṁ ajjhupekkhitā khéo nhìn với tâm xả theo mn118:27.6 và sn46.3; pāpake akusale dhamme các pháp ác, bất thiện theo sn54.9; Kimila giữ Kimila theo an5.201:0.3 (Sujato và Thích Minh Châu đọc Kimbila, Pāli root là Kimila).
  4.6: So satova assasati, satova passasati. Satova là sato cộng eva (chỉ với niệm), dịch Vị ấy chỉ có niệm mà thở vào, chỉ có niệm mà thở ra. Bốn khoá cũ cùng Pāli (sn54.3:1.4, sn54.4:1.4, sn54.7:5.2, sn54.9:8.2) dịch Vị ấy chỉ hít vào, chỉ thở ra, bỏ mất chữ niệm; một khoá (sn54.5:1.4) giữ niệm. Bài này theo bản giữ niệm. Bốn khoá cũ nằm ngoài lát, chưa sửa, cần người điều phối xét.
  4.7 và 8.4: dịch thở vào, thở ra thay vì hít vào, và quán buông bỏ thay vì quán sự phân ly như ba khoá cùng Pāli ở sn54.4:1.5, sn54.7:5.3, sn54.9:8.3 (hít vào, quán sự phân ly); chọn theo số đếm toàn tầng nên khác ba khoá ấy.
  1.2: veḷuvane, cùng Pāli với an5.201:1.1, dịch Trúc Lâm. Sujato dịch Freshwater Mangrove Wood và Thích Minh Châu ghi Veluvana tại Kimbila; Pāli root là veḷuvane nên giữ Trúc Lâm.
  3.3: Yaṁ bhagavā ānāpānassatisamādhiṁ bhāseyya, bhagavato sutvā bhikkhū dhāressantī (optative, quan hệ đại từ). Dịch Mong Đức Thế Tôn nói về định chánh niệm hơi thở; sau khi nghe Đức Thế Tôn, các tỳ-kheo sẽ ghi nhớ, theo Sujato (Let the Buddha speak) và cách dịch dhāressanti là ghi nhớ ở sn16.3:2.5 và 6 khoá khác. Chữ Mong là cách thể hiện thức optative, không có từ riêng trong Pāli.
  5.7 và 6.7: kāyaññatarāhaṁ, vedanāññatarāhaṁ ở bài này không có kāyesu, vedanāsu như mn118:24.6, 25.6; aññatara vẫn là một trong các, nên dịch như mn118: là một thân trong các thân, là một thọ trong các thọ.
  6.4: Pāli root chỉ nêu passasissāmi (thở ra), không có phần assasissāmi (thở vào); Sujato bổ sung cả hai. Bản Việt giữ đúng Pāli: chỉ thở ra.
  7.2, 7.3, 8.1, 8.2, 8.3, 9.3, 9.4, 9.7, 9.8: các dấu lược Pāli (…pe… hoặc … trần) đều đổi thành đúng một …; 9.7 và 9.8 dùng nguyên văn 22 và 23 khoá cùng Pāli ở sn47.x. 11 khoá có lược, khớp Pāli từng khoá (0 lệch).
  8.6: Pāli trùng nguyên văn mn118:27.6 (Sau khi thấy bằng trí tuệ sự từ bỏ tham và ưu, vị ấy khéo nhìn với tâm xả); bài này đổi tham và ưu thành tham lam và buồn phiền để khớp 5.5, 6.5, 7.5, 8.5 và đa số tầng sn (98 khoá).
  9.2 và 9.5: sakaṭaṁ vā ratho vā dịch xe chở hàng hay xe ngựa (Sujato: cart or chariot; Thích Minh Châu để nguyên sakaṭa hay ratha); paṁsupuñja dịch đống bụi (0 tiền lệ trên đĩa; Thích Minh Châu: đống rác bụi); upahanateva dịch chắc chắn phá nát (Sujato: destroy; Thích Minh Châu: làm cho giảm bớt đi). 9.6 và 9.9 viharantopi dịch ngay khi sống quán, upahanateva cùng cách dịch với 9.2.
  BẤT ĐỊNH: dīpo ở 10.3 dịch ngọn đèn theo tựa sn54.8 của Sujato (The Simile of the Lamp); bài sn54.8 chưa có trong tầng Việt để đối chiếu. 0.2 theo 8 bài cùng phẩm. 9.11 dịch Phẩm Một Pháp, thứ nhất theo sn12 (25 khoá) và sn54.20:1.13. 10.2 suddhikañca dịch thuần khiết theo tựa sn54.3 (Thuần Khiết).
  Cổng kỹ thuật: bài này không tự chạy npm run validate, npm test, npm run check, npm run build; technical_integrity 9.6 và bốn lệnh đó do coordinator chạy. Đã tự kiểm: đủ 70/70 khoá, thứ tự khoá theo Pāli, NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang Việt, nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch trên 70 khoá).
