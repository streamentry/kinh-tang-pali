notes: |-
  Dịch từ Pāli root của commit bilara đã ghim, đối chiếu trực tiếp bản Anh của Bhikkhu
  Sujato ở cùng commit. **Tầng Việt hiện hành (store) không có ở bài này** — bilara tại commit
  đã ghim chỉ phân phối Pháp Cú cho tiếng Việt; bản Hòa thượng Thích Minh Châu của bài này chỉ
  có dưới dạng nguyên bài (không phân đoạn) ở mục tra cứu toàn văn, tôi đã đọc nó để đối
  chiếu thuật ngữ nhưng không coi là tầng store.

  **Coverage English đo bằng đúng công thức của cổng.** Mẫu số = 65 khoá Pāli có nội dung
  (>= 40 ký tự, bỏ khối `:0`). Sujato có chữ ở 57/65 = 0,877 (>= 0,80). 8 khoá để trống ở
  Sujato — `11.3`, `12.3`, `13.3`, `14.3`, `15.3`, `16.3`, `17.6`, `18.3` — đều là mệnh đề
  ba vế `…sambojjhaṅgo … āraddho hoti … bhāveti … bhāvanāpāripūriṁ gacchati`; ở các chỗ đó
  tôi dựa vào Pāli, vào khung đã dịch đầy đủ ở `10.4`, và vào tiền lệ `sn46.3`. Không có lớp
  `english-project` cho bài này, nên toàn bộ 57 khoá phủ là của Sujato (độc lập). Chỉ ghi
  nhận mất mát ở 8 khoá trên, không cần entry trong `content/meta/reference-gaps.yaml` vì
  coverage vượt ngưỡng.

  **Dùng lại nguyên văn đã `published` (đo Pāli trùng nguyên văn trên toàn tầng `sn`):** 43 khoá
  của bài có ít nhất một khoá Pāli trùng nguyên văn ở bài khác (1.144 cặp); trong 43 khoá đó, 39
  khoá dùng đúng một câu Việt đã có (nguồn chính: `sn54.10` 21 khoá — cùng Tương Ưng, cùng
  khuôn *Này Ānanda* — rồi `sn46.3` 5 khoá, `sn11.3`, `sn46.1`, `sn22.21`, `sn54.1`, `sn54.8`,
  `sn47.6` và các tiêu đề/đuôi bài như *2. Phẩm Thứ Hai*, *Kinh Ānanda (Nhất)*, *Tại
  Sāvatthī.*, *Thứ ba.*), còn 4 khoá khác tiền lệ có chủ ý (nêu ngay dưới). Trong 1.144 cặp, 257
  cặp mà Việt của bài này khác Việt ở bài kia, chủ yếu vì cùng một câu Pāli công thức đã được
  dịch nhiều cách (ví dụ `Taṁ kissa hetu?`: *Vì sao vậy?* 56 khoá, *Vì lý do gì?* 32 khoá, *Vì
  sao?* 8 khoá; tôi theo đa số và theo `sn54.10`). Trong chính bài có 5 nhóm khoá Pāli trùng nguyên văn (`5.5`/`6.6`/`7.6`; `10.3`/`17.4`; `16.1`/`18.1`; `16.2`/`18.2`; `16.3`/`18.3`), cả 5 nhóm cho bản Việt giống hệt nhau (0 cặp trùng mà Việt khác).

  **Bốn khoá cố ý khác tiền lệ có Pāli trùng nguyên văn (`1.3`, `3.1`, `16.1`, `18.1`), nêu rõ:** (1) `1.3` và `3.1` trùng
  Pāli với `sn54.15:1.2`/`2.1`, ở đó dịch *làm tròn*; bài này dùng *làm viên mãn* vì
  `paripūreti` đếm được *làm viên mãn* 22 khoá (`sn46.6`, `sn54.14`) so với *làm tròn* 6 khoá
  (chỉ `sn54.15`), và `sn54.14` là bài cùng khuôn *Ānanda*. (2) `16.1`/`18.1` trùng Pāli với
  `sn46.3:7.2` (*Vị ấy an trú xả một cách thiện xảo đối với tâm định tĩnh như vậy*); bài này
  dịch `sādhukaṁ ajjhupekkhitā hoti` thành *khéo nhìn … với tâm xả* cho nhất quán với
  `8.6` (dùng lại nguyên `sn54.10:8.6`, cũng là Pāli trùng nguyên văn). Hai tiền lệ này tự
  mâu thuẫn nhau trên tầng (`ajjhupekkhitā`: 3 khoá, 2 cách dịch); tôi chọn cách bám Pāli
  hơn (không thêm *an trú*) và dùng đúng một cách trong cả bài.

  **Thuật ngữ, kèm số đếm toàn tầng `sn`:** `ānāpānassatisamādhi` → *định chánh niệm hơi
  thở* (32 khoá / 4 bài, `sn54.7`, `sn54.8`, `sn54.10`) hơn *định niệm hơi thở* (14 khoá / 4
  bài, gồm `sn54.11`, `sn54.12`, `sn54.14`, `sn54.15`); `bhāvito bahulīkato` → *được tu
  tập, được làm cho sung mãn*; `paripūreti` → *làm viên mãn* (22 khoá vs 6); `vijjāvimutti` →
  *minh và giải thoát* (13 khoá vs *minh giải thoát* 2; `sn46.6`); `āraddho hoti` → *được khơi
  dậy* (`sn46.3`, 33 khoá chứa *khơi dậy*); `bhāvanāpāripūriṁ gacchati` → *được đưa đến sự viên
  mãn của sự tu tập* (`sn46.3:2.3`); `vineyya loke abhijjhādomanassaṁ` → *xa lìa tham lam và
  buồn phiền nơi đời* (116 khoá *xa lìa tham lam* vs 43 *từ bỏ tham lam*); `pavicinati
  pavicarati parivīmaṁsamāpajjati` → *trạch pháp ấy bằng trí tuệ, thẩm sát và tầm cứu*
  (`sn46.3:2.4`, nguyên văn); `nirāmisā pīti` → *hỷ phi vật chất*; `passambhati` → *an
  tịnh*, `passaddhi` → *khinh an giác chi* (tiền lệ `sn46.3`). `kāyasaṅkhāra`/`cittasaṅkhāra`
  → *thân hành*/*tâm hành* (`sn54.10`). `satipaṭṭhāna` → *niệm xứ*; `bojjhaṅga` → *giác chi*.

  **Số Pāli:** `ekadhammo` 1; `cattāro` 4 (`1.3`, `2.1`, `3.1`, `3.2` đều hai lần *bốn*); `satta` 7
  (hai lần *bảy* mỗi khoá); `dve` 2. Không có số lớn hay số ghép nào cần phân xử.

  **Bất định đã ghi, không đưa vào thân kinh:** (1) `5.2` `rassaṁ vā …pe…` chỉ còn hai chữ rồi
  lược; tôi giữ nguyên dạng cụt *hoặc ngắn …* chứ không bung thành vế thở ngắn (đúng quy
  tắc `…pe…` → một `…`). (2) `6.1` Pāli chỉ nêu vế *thở vào* (`assasissāmī`) rồi lược; Việt chỉ
  nêu vế *thở vào*, các vế còn lại ở `6.2`–`6.4`. (3) Sujato ở `6.3` ghi *mind …’ …* — như hiểu
  `cittasaṅkhārappaṭisaṁvedī` thành *tâm* — lệch Pāli (`cittasaṅkhāra` = tâm hành, khớp `6.4`
  *làm lắng dịu tâm hành*); tôi theo Pāli: *cảm nhận tâm hành*. (4) `4.4` Sujato dịch `dīghaṁ`
  là *heavily*; tôi theo tiền lệ `sn54.10:5.1`: *dài*. (5) `5.6`/`6.7` `kāyaññatarāhaṁ`/
  `vedanāññatarāhaṁ` → *Ta nói rằng … là một thân/thọ trong các thân/thọ*, theo
  `sn54.10:5.7`/`6.7`. (6) `4.3` `satova` — tiền lệ trùng nguyên văn (`sn54.1`, `sn54.8`)
  bỏ sắc thái *eva*; giữ nguyên tiền lệ. (7) Pāli bài này không có `(…)` trần ở khoá nào; khoá
  `17.7` là dòng chỉ dẫn nguyên văn trong ngoặc, dịch theo mẫu *(Cần giảng rộng như …)*. (8) `17.1`
  `vedanāsu …pe…` dịch *sống quán thọ trên các cảm thọ …* theo mẫu tầng cho `citte …pe…`
  (`sống quán tâm trên tâm …`, 24 khoá).

  **Kiểm:** 84/84 khoá, thứ tự khoá = thứ tự Pāli; nháy đơn và nháy kép khớp Pāli từng
  khoá (0/84 lệch); `…pe…` → đúng một `…`, 0 lệch dấu lược; NFC sạch; không Pāli lọt sang Việt.

  **technical_integrity = 9,6** vì bốn cổng kỹ thuật do coordinator chạy, tôi không được chạy
