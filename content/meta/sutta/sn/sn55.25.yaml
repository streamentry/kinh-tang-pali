notes: |-
  Đợt 19, làn 28. Dịch trọn 91/91 khoá từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt Hòa thượng Thích Minh Châu nguyên bài ở mục Tra cứu toàn văn (bài này ở đó chỉ ghi "giống như đoạn số 2–7 kinh trên" cho phần mở đầu và gộp nhiều khoá, không phân đoạn nên không căn lề theo từng khoá). Không có khoá nào ngoài tập khoá Pāli. Bài anh em liền kề sn55.24 (Kinh Saraṇāni người Sakka Một, cùng đợt) cùng cấu trúc; những khoá Pāli y hệt giữa hai bài dùng lại nguyên văn bản Việt của sn55.24.

  **Coverage tầng Anh trên Pāli có nội dung: Sujato 43/54 = 0.796** (dưới sàn 0.80). Sujato để trống 18 khoá, trong đó 11 khoá có nội dung (1.10, 2.1, 2.3, 2.4, 2.5, 2.9, 2.10, 4.2, 5.2, 6.2, 7.2) và 7 khoá dưới 40 ký tự (1.9, 2.2, 2.6, 2.7, 2.8, 11.2, 11.11). Lớp english-project của bài này đã published và phủ đủ 18 khoá, nên cổng tính 54/54; nhưng đó không phải bản đọc Anh độc lập của toàn bài, và bản Việt này không tuyên bố đã đối chiếu English độc lập cho 11 khoá đó. Phần trống ấy dựa vào Pāli, các khoá Pāli y hệt ở nơi khác trong bài (1.10 với 2.3, 4.2 với 5.2 với 6.2 với 7.2, và 2.1 gần trùng sn55.24:2.2, chỉ khác chữ hoa đầu câu) và bản Thích Minh Châu. Vì vậy triangulation 7.5 và bài giữ draft kèm blocker nêu ở blocking_errors, đúng như đã làm với sn22.7. Reference-gaps chưa có mục cho bài này, và dù có mục cũng không cứu được published. Sujato lệch Pāli ở các chỗ đã nêu: 1.8 gộp vế *so bhagavatā byākato* của 1.9 vào một câu và thêm *after he passed away*, 1.12 thêm vế *told him what had happened* mà Pāli không có, 8.2, 8.3, 9.2, 9.3 bỏ phủ định *na*, 11.9 *kimaṅgaṁ pana* dịch thành câu hỏi *Why can't this apply to Sarakāni?* (đổi nghĩa so với *huống chi là*), 11.1 gộp vế mưa của 11.2.

  **Pāli trùng nguyên văn trong chính bài: 18 nhóm / 42 cặp**, cả 42 cặp đều dùng lại nguyên văn bản Việt (0 cặp khác). Các nhóm: 1.3/1.9/2.2, 1.7/2.6, 1.8/2.7, 1.10/2.3, 4.2/5.2/6.2/7.2, 4.3/5.3/6.3/7.3, 4.4/5.4/6.4/7.4, 4.7/5.7/6.7/7.7, 5.1/6.1/7.1, 6.5/7.5, 8.2/9.2, 8.3/9.3, 8.4/9.4, 8.5/9.5, 8.6/9.6, 8.8/9.8, 10.2/11.3, 10.6/11.7. Gần trùng nhưng Pāli không y hệt nên bản Việt khác có chủ ý: 1.4 so với 1.10 (nháy kép so với nháy đơn), 4.1 so với 5.1 (*Idha* so với *Idha pana*), 8.1 so với 9.1 (kết bằng …pe… so với … trần; bản Việt cùng kết …), 1.12 so với 2.1, 10.3 so với 11.4 (đáp ngược nhau). **Trùng nguyên văn với bài khác trong tầng đã gộp: 25 khoá dò được, 5 khoá bản Việt khác có chủ ý**: 1.6 và 2.5 (tầng có 10 và 9 khoá Pāli y hệt, viết nhiều dạng khác nhau như *Thật kỳ diệu thay, thật hy hữu thay* và *Ôi, kỳ diệu thay*; bản này giữ cả hai vế *bho* thành *này các bạn*, theo sn55.24), 4.6 (5 khoá trùng, 4 khoá viết *giải thoát tâm không lậu hoặc*; bản này theo sn55.8 *tâm giải thoát vô lậu, tuệ giải thoát vô lậu*), 6.6 (3 khoá trùng, đều dịch tanuttā khác nhau: *suy giảm*, *giảm nhẹ*; bản này chọn *suy giảm*, *bậc nhất lai* viết thường theo sn55.8, sn55.24), 7.6 (1 khoá trùng viết *bậc Sotāpanna*; bản này theo cụm sn55 *bậc nhập lưu* như 1.4). 20 khoá còn lại giống nguyên văn. Các khoá giống với sn55.24 (ví dụ 1.12 trùng với sn55.24:2.1, 3.1, 3.2, 4.5, 4.7, 5.5, 8.7, 8.8, 9.7, 9.8, 11.9 trùng với sn55.24:9.10) chưa nằm trong tầng đã gộp tại lúc dò nên không tính vào 25 khoá nói trên; đã đối chiếu riêng và dùng lại nguyên văn.

  **Số Pāli.** pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ (5.6) = năm hạ phần kiết sử (pañca 5); danh sách ở 5.6 có đúng năm mục (antarāparinibbāyī, upahaccaparinibbāyī, asaṅkhāraparinibbāyī, sasaṅkhāraparinibbāyī, uddhaṁsoto akaniṭṭhagāmī); tiṇṇaṁ saṁyojanānaṁ (6.6, 7.6) = ba kiết sử (tiṇṇaṁ 3); danh sách căn ở 8.6 và 9.6 do …pe… rút gọn, đủ năm căn (saddhā, vīriya, sati, samādhi, paññā) như sn55.24:8.6 viết đầy đủ. Bài chia sáu hạng người (4.1, 5.1, 6.1, 7.1, 8.1, 9.1): bốn hạng đầu *parimutto* (thoát khỏi), hai hạng sau *agantā* (không đi đến). Không có số khác.

  **Thuật ngữ, theo tiền lệ đã đo.** *nhập lưu, không rơi vào ác đạo, chắc chắn, hướng về giác ngộ*, *niềm tin* ở khoá mở đầu, *đã qua đời*, *Lúc bấy giờ*, *tụ họp lại*, *phàn nàn, chê trách, bực bội*, *nam cư sĩ*, *quy y*, *chân chánh*, *người Sakka*, *Phẩm Quy Y*, *Tại Kapilavatthu*, *Đối với Pháp …*, *Đối với Tăng …*, *hạ phần kiết sử*, *kiết sử*, *thoát khỏi*, *loài bàng sanh*, *cõi ngạ quỷ*, *cõi dữ, ác thú, đọa xứ*, *tín căn … tuệ căn*, *chấp nhận*, *một mức độ niềm tin và lòng thương kính*, *huống chi là*, *trí tuệ hoan hỷ*, *mau lẹ*: theo sn55.24 và các bài sn55 đã nêu ở đó. *nhất hướng và hoàn toàn tin tưởng* (ekantagato abhippasanno, 4.1, 5.1, 6.1, 7.1; phủ định ở 8.1, 9.1): tầng chỉ có một tệp (sn48.50, 3 khoá) với cụm này và đều dịch *nhất hướng và hoàn toàn tin tưởng*; khác sn55.24 (*niềm tín xác quyết*) vì Pāli ở đây là *ekantagato abhippasanno*, không phải *aveccappasādena samannāgato*, hai cụm khác nhau nên không dùng chung một thuật ngữ. 8.1 và 9.1 *na heva kho … ekantagato hoti abhippasanno* dịch *không nhất hướng và cũng không hoàn toàn tin tưởng* để phủ định bao cả hai thành tố, theo Sujato *isn't sure or devoted*. *bậc bát-niết-bàn giữa chừng, khi chạm đến, không cần gắng sức, cần gắng sức, đi ngược dòng đến cõi Akaniṭṭha* (5.6): theo sn46.3 và sn48.15, sn48.16, sn48.17, sn48.24; đo được *giữa chừng* 12 khoá / 8 tệp so với *ở giữa* 2 khoá / 2 tệp và *Trung Gian* 2 khoá / 2 tệp; *khi chạm đến* 9 khoá / 6 tệp so với *khi sanh, khi vừa sinh* 2 khoá / 2 tệp và *Tổn Hại* 2 khoá / 2 tệp; *không cần gắng sức* 8 khoá / 6 tệp so với *vô hành* 4 khoá / 4 tệp. *đã không làm viên mãn sự tu học* và *đã làm viên mãn sự tu học* (aparipūrakārī, paripūrakārī): *sikkhāya na paripūrakārī* ở dn33 (4 khoá) dịch *không làm viên mãn sự tu học*; bản này theo đó, giữ *sikkhā* nghĩa rộng như sn55.24:1.11, không thu hẹp thành *học giới* hay *năm giới*. Cụm ruộng và hạt giống: dn23:31 (bài song song duy nhất cho dukkhette dubbhūme avihatakhāṇukaṇṭake và sukhette subhūme suvihatakhāṇukaṇṭake) cho *ruộng xấu, đất xấu*, *nứt vỡ, mục thối, hư hại vì gió nắng, không chắc lõi, không được cất giữ lành lặn* và mặt tốt *nguyên vẹn, không mục thối, không hư hại vì gió nắng, chắc lõi, được cất giữ lành lặn*; *sukhasayita* trong tầng còn dịch *bảo quản tốt* (an3.34, 2 khoá) và *gieo trồng chu đáo* (sn22.54, 2 khoá), chọn dn23 vì là bài duy nhất có cả cặp ruộng xấu và ruộng tốt như ở đây. *trời không ban mưa đầy đủ / trời ban mưa đầy đủ* theo an4.178:3.6 và 4.6. *tăng trưởng, phát triển và hưng thịnh* (vuddhiṁ virūḷhiṁ vepullaṁ āpajjeyyun) theo sn22.54:1.6, 1.9. *pháp được giảng dạy vụng về, trình bày thiếu rõ ràng, không đưa đến giải thoát, không hướng đến an tịnh, không do bậc Chánh Đẳng Giác tuyên dạy* và mặt tốt *pháp được khéo giảng dạy, trình bày rõ ràng, đưa đến giải thoát, hướng đến an tịnh, do bậc Chánh Đẳng Giác tuyên dạy* theo dn29 (4 khoá mặt xấu, 9 khoá mặt tốt; dn33 viết *khéo tuyên bạch, xuất ly* khác). *thực hành pháp và tùy pháp, thực hành chân chánh, sống thuận theo pháp* (dhammānudhammappaṭipanno sāmīcippaṭipanno anudhammacārī) theo mn113 (12 khoá). *Ta gọi đó là ruộng xấu / hạt giống xấu / ruộng tốt / hạt giống tốt* (idamahaṁ … vadāmi) theo mn4:21.2 (*Ta gọi đó là …*), tầng chỉ có một khoá cùng cấu trúc. *“Thưa không phải vậy, bạch Thế Tôn”* cho *No hetaṁ, bhante*: trong sn 62 khoá / 27 tệp, dạng kế tiếp *Không phải vậy, bạch Thế Tôn* 28 khoá; *“Thưa vâng, bạch Thế Tôn”* cho *Evaṁ, bhante*: 11 khoá so với *Bạch Thế Tôn, đúng vậy* 9 khoá. Đã chọn dạng đa số ở sn.

  **Dấu nháy.** Mỗi khoá khớp Pāli (0 lệch trên 91 khoá). Nháy kép mở ở 1.4 (đóng cùng khoá), 1.6, 2.1, 3.1, 10.3, 10.4, 11.4, 11.5 và đóng ở 1.11, 10.2, 10.3, 11.3, 11.4, 11.10; 2.10 đóng bằng nháy đơn rồi nháy kép (khép lời kể lại của người Sakka rồi lời Mahānāma). Nháy đơn mở ở 2.5, đóng ở 2.10; 1.10, 2.3 và 3.3 mở và đóng trong cùng khoá. 2.9 Pāli không có nháy ở hai đầu (đứng giữa 2.8 kết bằng *—* và 2.10), bản Việt không thêm nháy.

  **Dấu lược.** Pāli …pe… ở 4.2, 4.3, 4.4, 5.2, 5.3, 5.4, 6.2, 6.3, 6.4, 7.2, 7.3, 7.4, 8.1, 8.2, 8.3, 8.6, 9.2, 9.3, 9.6: mỗi khoá bản Việt giữ đúng một …. Pāli kết bằng … trần ở 9.1 (lược sau *abhippasanno*): bản Việt kết bằng … trần theo Pāli. Không có (…) trần ở bài này; không khoá nào Pāli lược mà Việt viết đủ.

  **Bất định (1) — 5.6, danh sách năm hạng bất hoàn.** Pāli liệt kê năm mục nối bằng dấu phẩy, mỗi mục kết bằng *hoti*: *antarāparinibbāyī hoti, upahaccaparinibbāyī hoti, asaṅkhāraparinibbāyī hoti, sasaṅkhāraparinibbāyī hoti, uddhaṁsoto hoti akaniṭṭhagāmī*. Đọc nghĩa đen là một người *là* cả năm hạng, điều không thể đúng với nghĩa phân hạng; cách hiểu thông thường (Sujato dùng dấu chấm lửng giữa các mục, và các tầng sn48.17, sn51.26 giữ nguyên danh sách) là *một trong năm hạng*. Bản Việt giữ đúng cấu trúc liệt kê của Pāli, không thêm *hoặc* hay *một trong*, nhưng chưa tự phân xử việc đó trong lời kinh. Tầng có tiền lệ liệt kê nguyên như vậy ở sn51.26:2.4 (*là vị nhập diệt ở giữa, vị nhập diệt khi sanh, …*). Cũng cần nói: 5.6 ở bài này khác với sn55.24:5.6 (chỗ đó Pāli viết *opapātiko hoti tattha parinibbāyī anāvattidhammo tasmā lokā*), nên không chép khoá Việt của sn55.24 sang.

  **Bất định (2) — 1.11 và 2.10, sikkhāya aparipūrakārī ahosī.** *aparipūrakārī* là danh từ tác nhân (a + paripūra + kārī), nghĩa đen *người không làm cho đầy đủ*; *ahosi* là aorist. Sujato dịch *didn't fulfill the training* (đã không làm trọn sự học). Bản Việt *đã không làm viên mãn sự tu học*, theo dn33 (*sikkhāya na paripūrakārī*). Chưa phân xử được *sikkhā* chỉ giới nào cụ thể, và Pāli không nói người Sakka bị chê vì điều gì cụ thể (khác sn55.24 nói rõ *majjapānaṁ apāyī*).

  **Bất định (3) — 11.10, maraṇakāle sikkhāya paripūrakārī ahosī.** Pāli là *vào lúc chết* Saraṇāni *đã là người làm viên mãn sự tu học*. Đối lập trực tiếp với 1.11, 2.10 (*aparipūrakārī*). Nghĩa đen hai khoá này không mâu thuẫn nhau vì nói hai thời điểm khác nhau (cả đời đến trước lúc chết so với lúc lâm chung), và 11.9 đến 11.10 là lời đáp cho lời chê của người Sakka. Thích Minh Châu viết *khi mạng chung, đã làm viên mãn học giới*; Sujato *fulfilled the training at the time of his death*. Bản Việt dùng *vào lúc lâm chung* theo Pāli và Sujato. Chưa phân xử được *sikkhā* chỉ giới nào, và không rõ *lúc chết* là khoảnh khắc nào (ngay trước khi chết hay trong lúc chết); bản Việt không thêm.

  **Bất định (4) — 1.8 và 2.7, yatra hi nāma.** Chỉ cấu trúc *hi nāma* nêu ngạc nhiên hay lý do (*vì … mà …*). Khác sn55.24:1.8, ở đây Pāli kết bằng dấu chấm (không phải chấm phẩy) và 1.9 viết hoa *So*, nên bản Việt đặt dấu chấm sau *đã qua đời* và viết hoa *Vị ấy* ở 1.9; chữ *Vì* ở đầu 1.8 nay đứng đầu một câu đơn, hơi cụt về mặt tiếng Việt, nhưng thêm *thế mà* hay *ngay cả* là thêm nghĩa Pāli không có. Sujato gộp 1.8 và 1.9 thành một câu *For the Buddha even declared…*, mất vế *so bhagavatā byākato:*; bản Việt giữ hai khoá riêng.

  **Bất định (5) — 8.8 và 9.8, agantā.** Danh từ tác nhân phủ định (a + gantā), nghĩa đen *người không đi đến / sẽ không đi đến*. Sujato dịch thì hiện tại (*doesn't go*), Thích Minh Châu *không đi đến*. Bản Việt theo hai bản tham khảo, không thêm *sẽ*; chưa phân xử được sắc thái thời.

  **Bất định (6) — hāsapañña, javanapañña.** *trí tuệ hoan hỷ* theo sn8.7, dn30 và Thích Minh Châu, sn2.29 viết *trí tuệ thông sáng*; Sujato *laughing wisdom*. *mau lẹ* (javana) theo sn2.29 và mn111. Chưa có chứng cứ chắc nghĩa của hāsa trong ngữ cảnh này, ghi như sn55.24.

  **Bất định (7) — 8.1/9.1 na heva kho và 8.2/8.3/9.2/9.3 na.** *na heva kho* là cấu trúc nhấn phủ định; không dịch riêng. *na dhamme …pe…* và *na saṅghe …pe…* giữ phủ định thành *Không đối với Pháp …*, *Không đối với Tăng …*; Sujato bỏ *na* ở các khoá này (nén phủ định thành *the teaching …*), nên ở đó Sujato không dùng để đối chiếu phủ định. Ở 8.1, 9.1 chọn *không nhất hướng và cũng không hoàn toàn tin tưởng* (phủ định cả hai thành tố, theo Sujato *isn't sure or devoted*); nếu *na heva kho* chỉ phủ định thành tố đầu thì nghĩa hẹp hơn, nhưng Pāli không cho căn cứ để tách.

  **Bất định (8) — 10.5, 10.7, 11.6, 11.8, idamahaṁ … vadāmi.** Từ *idaṁ* (điều này) chỉ về cặp pháp và người đệ tử đứng ngay trước, dịch *Ta gọi đó là…* theo mn4:21.2. Sujato *This is what I call a barren field / a bad seed*. Pāli dùng định vị cách (dukkhettasmiṁ, dubbījasmiṁ), nghĩa đen *Ta nói điều này ở chỗ ruộng xấu*; bản Việt dùng cấu trúc gọi tên, không thêm *ví dụ* hay *giống như*.

  **Bất định (9) — 3.4, vị ấy làm sao có thể rơi vào ác đạo.** Pāli nối ý bằng dấu phẩy (…saṅghaṁ saraṇaṁ gato, so kathaṁ vinipātaṁ gaccheyya.) không tách thành hai câu như sn55.24:3.4 và 3.5. Bản Việt giữ nguyên dấu phẩy, câu hỏi tu từ cuối khoá cùng cấu trúc với 3.1.

  **Khác khoá có chủ ý.** *Saṁyutta Nikāya* giữ nguyên ở khoá :0.1 như các bài sn55 anh em. Số Pāli ở trên được tự tính, không chép từ bản dựa.

