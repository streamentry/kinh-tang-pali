notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu English Bhikkhu Sujato (đã ghim) và các bài song song đã có trong tầng (sn54.1, sn54.9–10, sn36.7–8, sn22.88, sn52.1, sn35.90–91, sn16.9, mn6, mn140, mn152).
  Coverage English = 68/68 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0) = 100%, toàn bộ từ bản Sujato đã ghim; bài này không có lớp english-project và không cần. Tầng Việt hiện hành (Thích Minh Châu) vắng ở commit đã ghim, nên không có đối chiếu độc lập với bản Việt truyền thống cho bài này; triangulation đặt 8.8 vì lý do đó.
  Số Pāli: không có số đếm trong bài; chỉ có số thứ tự `Aṭṭhamaṁ` = thứ tám (22.5), khớp 54.8 và 253/260 khoá `Aṭṭhamaṁ.` đã có.
  Pāli trùng nguyên văn với tệp đã có: đã dò 295 cặp ở 10 khoá (0.2 · 2.1 · 2.2 · 2.3 · 2.4 · 21.2 · 21.3 · 21.4 · 22.2 · 22.5). Dùng lại nguyên văn: 0.2 (8/8 giống nhau), 2.1 (nguyên văn `sn54.3:1.3`/`sn54.4:1.3`/`sn54.9:8.1`), 2.2 (`sn54.1:1.8`), 22.2 (`sn36.7:9.2`), 22.5 (253/260). 29 cặp bản Việt khác, có chủ ý: 2.1 (6 cặp khác: `mn118:17.1`… dùng "ngồi xếp bằng", `sn54.1:1.7` thêm dấu phẩy); 2.2 (3 cặp: "Có niệm, vị ấy thở vào" ở `mn10`/`dn22`, "thở vô" ở `sn54.6`); 2.3 (1 cặp: `sn54.6:3.4` viết "thở vô", tầng có 69 "thở vào" so với 2 "thở vô"); 2.4 (8 cặp: `sn54.4:1.5`/`sn54.7:5.3`/`sn54.9:8.3` viết "học … hít vào … phân ly", còn đo toàn tầng thì "tập" 76 so với "học" 5, "thở vào" 69 so với "hít vào" 12, "quán buông bỏ" 6 so với "quán sự phân ly" 3; dùng dạng `sn54.1:5.4`, `sn54.10:4.7`); 21.2–21.3 (2 cặp: `sn22.88:4.12–13` viết "mà không chướng lắm", dùng "không bị ràng buộc" theo nghĩa `visaṁyutto` = không còn bị buộc); 21.4 (1 cặp: `mn140:24.4` viết "cảm thọ một cảm thọ …", đổi động từ thành "cảm nhận" cho đồng bộ với 20.x–21.x); 22.2 (1 cặp: `sn36.8:7.2` viết "không được nuôi thì sẽ tắt"); 22.5 (7 cặp: "Bài thứ tám." 4 khoá, "Thứ tám. " có khoảng trắng thừa 2 khoá, "Kinh thứ tám." 1 khoá; dùng dạng 253/260).
  Trong chính bài: 240 cặp khoá Pāli trùng nguyên văn (các khoá `Tasmātiha…` và `ayameva ānāpānassatisamādhi sādhukaṁ manasi kātabbo.`), 0 cặp bản Việt khác nhau.
  `kāyapariyantikaṁ vedanaṁ` → "cảm thọ lấy thân làm giới hạn", `jīvitapariyantikaṁ` → "cảm thọ lấy mạng sống làm giới hạn", theo `mn140:24.4` (khoá Pāli trùng nguyên văn). Các bài khác của tầng dịch khác nhau: `sn22.88`/`sn36.8` "thọ chấm dứt của thân" (3 khoá), `sn36.7` "cảm thọ cùng tột" (2 khoá), `an4.195` "cùng tận" (2 khoá), `mn140` "lấy … làm giới hạn" (2 khoá); không có đa số rõ.
  `sītībhavissanti` → "sẽ trở nên mát lạnh" (4 khoá `sn36.7`/`mn140`) so với "nguội lạnh" (4 khoá `sn22.88`/`sn36.8`): hoà 4-4, chọn "mát lạnh".
  `paṭikūla` → "ghê tởm" (27 khoá so với 17 "đáng ghét"), theo `mn152`/`an5.144`; `appaṭikūle paṭikūlasaññī` → "tưởng ghê tởm đối với điều không đáng ghê tởm".
  Jhāna: "thiền thứ nhất/hai/ba/tư" (tầng `sn` đã dùng dạng này ở `sn16.9`, `sn21.1`, `sn28.x`, `sn40.x`; toàn tầng 67 "thiền thứ nhất" so với 77 "sơ thiền"); `vivekajaṁ` → "do viễn ly sinh" (27, hoà với "do ly dục sinh" 27, "do ly sinh" 20); `ekodibhāvaṁ` → "sự nhất tâm" (34 khoá "nhất tâm"); `paṭighasaññā` → "tưởng đối ngại" (16), `nānattasaññā` → "tưởng sai biệt" (22, so với "đa dạng" 15); `upekkhāsatipārisuddhiṁ` → "xả niệm thanh tịnh" (28). Arūpa: "xứ vô lượng hư không", "xứ vô lượng thức", "xứ vô sở hữu", "xứ phi tưởng phi phi tưởng" (đúng quy ước tầng, 168 khoá / 62 tệp), "diệt thọ tưởng"; tên arūpa ở tầng còn dao động ("Không vô biên xứ" 106, "xứ vô số hư không" 25…), chọn dạng viết thường theo `sn16.9`.
  `sarasaṅkappā` → "ký ức và ý nghĩ" (tầng đã dịch hai cách: "ký ức và ý chí" 6 khoá `sn35.96`, "tưởng và ý nghĩ" 6 khoá `sn35.151`).
  BẤT ĐỊNH (1): 2.1 giữ nguyên văn tầng "núi rừng … ngồi xuống kết già co" dù toàn tầng "kiết già" 81 và "kiết-già" 28 so với "kết già co" chỉ 7 (đều ở `sn54.1`, `sn54.3`, `sn54.4`, `sn54.9`, `an4.36`, `an10.60`, `an4.198`); chưa sửa vì cùng Pāli với bốn bài cùng phẩm, người biên tập nên thống nhất một lần cho cả phẩm.
  BẤT ĐỊNH (2): 13.2 Pāli viết `yaṁ taṁ ariyā ācikkhanti—upekkhako satimā sukhavihārīti` không có dấu nháy; bản Việt giữ nguyên không dùng dấu nháy, ngăn bằng dấu gạch dài, nên không đánh dấu lời trích của các bậc Thánh bằng ‘…’ như sn36.31 hay sn16.9. Mọi dấu ‘ ’ “ ” của bản Việt khớp Pāli từng khoá (74/74).
  2.3 `…pe…` giữ đúng một `…` ở cuối khoá, Pāli chỉ có vế thở vào dài nên bản Việt không tự thêm vế thở ra dài mà Sujato đã bổ sung trong tiếng Anh. 22.4 Pāli kết `pajānātī”ti.` bản Việt kết `.”`.
