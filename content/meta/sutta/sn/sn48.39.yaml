notes: |-
  Dịch từ Pāli root đã ghim (`…/root/pli/ms/sutta/sn/sn48/sn48.39_root-pli-ms.json`; git object `8ecbe71e497eb1fdd13564e402e13394cbe5cb5c`, commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`).

  **TẦNG ANH ĐỦ 100%, đo được.** Công thức `src/lib/canon/reference.ts`: Pāli có nội dung = 26 khoá (≥ 40 ký tự sau nén, loại khối tham chiếu `:0`), **0 khoá** không có chữ ⇒ `ratio = 26/26 = 1,0000`. Tệp `translation/en/sujato/sutta/sn/sn48/sn48.39_translation-en-sujato.json` (object `f337701486d87dd78c02ef5b0c6a73a8ac0ca69b`). `content/meta/en/sn/sn48.39.yaml` không tồn tại ⇒ không có lớp lấp `english-project`. `triangulation` 9.3 vì tầng Anh đầy đủ, nhưng **không** có tầng Việt hiện hành để đối chiếu.

  **DÙNG LẠI NGUYÊN VĂN — 5/32 khoá:** `0.2` = `sn48.37:0.2` = `sn48.38:0.2` (8 tệp) · `1.1` = `sn48.37:1.1` = `sn48.38:1.1` (5 nơi) · `1.2` = `sn48.37:1.2` = `sn48.38:1.2` (5 nơi) · `1.3` = `sn48.37:1.3` = `sn48.38:1.3` (2 nơi) · `7.7` = `sn38.9:1.13` (**116** nơi cho *Thứ chín*). `6.1` mượn nguyên văn `sn36.10:1.10` vì Pāli **không** trùng nguyên văn (khác dấu câu và `nānābhāvāvinikkhepā` gộp một từ).

  **Công thức lặp là BÌNH THƯỜNG, tôi KHÔNG dịch bằng khuôn.** Pāli lặp khuôn 5 căn ở `1.4`–`5.3`, rồi lặp lại `6.2`–`7.6` (luật peyyāla của Pāli gốc). Tôi dịch từng khoá một, rồi **dùng lại nguyên văn** cho khoá trùng trong chính bài: `1.5`=`6.3`, `1.6`=`6.4`, `5.1`=`7.4`, `5.2`=`7.5`, `5.3`=`7.6`. Tám khoá còn lại có Pāli **khác** nên phải viết khác, và tôi đã viết khác có chủ đích:
  `6.2` không có `bhikkhave` và dùng `uppajjati` (không phải `uppannaṁ`) nên không gộp vào `1.4`; `6.4` và `7.6` cũng dùng `uppajjati`, khác `1.6`/`2.3`/`3.3`/`4.3`/`5.3` — nhưng nghĩa nhau nên cùng một cách diễn đạt; `7.1`–`7.3` bị lược bằng `…pe…` nên chỉ còn vế đầu.

  **Thuật ngữ, kèm số đếm (đếm trên toàn tầng Việt):**
  `indriya` → *căn* · danh sách 5 căn → *Lạc căn, khổ căn, hỷ căn, ưu căn, và xả căn* (**2** nơi nguyên văn: `sn48.37:1.3`, `sn48.38:1.3`; đối chiếu *Sướp căn … hân hoan căn … buồn bực căn* `sn48.32:1.3`, `sn48.33:1.3` — cũng 2; chọn cặp cùng phẩm, sát `Sukhavedaniya` hơn) · `Pañcimāni pañca` → *có năm căn này / Năm căn nào?* (**5**) · `phassa` → *xúc* · `vedaniya` → *được cảm nhận là* (khuôn `…vedaniyaṁ phassaṁ paṭicca uppajjati …` chưa có tiền lệ ở dạng căn; bản gần nhất `sn12.62:3.4` *do xúc được cảm nhận là dễ chịu, nên cảm thọ dợi chịu sinh khởi* và `sn36.10:1.8` *duyên xúc được cảm thọ là bất khổ bất lạc khởi lên …*, tôi ghép từ cả hai) · `sukhavedaniya` → *dễ chịu* · `dukkhavedaniya` → *đau khổ* · `somanassavedaniya` → *hân hoan* · `domanassavedaniya` → *uất ức* · `upekkhāvedaniya` → *bình thản* · `pajānāti` → *biết rõ* (đa số: **6** nơi *Vị ấy biết rõ như sau:*; đối chiếu *hiểu rõ như vầy* **3**) · `nirodha` → *chấm dứt* · `nirujjhati, vūpasammati` → *tắt dần, dập tắt* (xem dưới) · `kaṭṭha` → *thanh củi* · `saṅghaṭṭanasamodhānā` → *sự cọ xát kết hợp* · `tejo abhinibbattati` → *ngọn lửa phát sinh* · `Navamaṁ` → *Thứ chín* (**116**).

  **Bốn chỗ phải phán xử, đã ghi:**
  (1) **Sujato đổi ngôi ở `1.5` và `6.3`**: Pāli là `So sukhitova samāno ‘sukhitosmī’ti pajānāti` — ngôi thứ ba, chủ thể là vị thiền sinh. Sujato dịch `you understand` (ngôi thứ hai, như đang nói với người nghe). Pāli là authority nên tôi giữ *vị ấy biết rõ: ‘Tôi đang sướp’*.
  (2) `nirujjhati, vūpasammati`: hai bản gần nhất dùng *cũng chấm dứt, cũng dừng lại* (`sn12.62:3.5` và `3.9`) và *được đoạn diệt, được lắng dịu* (`sn36.10:1.5`). Cả hai đều lặp lại chữ *chấm dứt* đã dùng cho `nirodhā` ngay trước. Tôi chọn **tắt dần, dập tắt** và dùng nhất quán ở cả sáu chỗ (`1.6`, `2.3`, `3.3`, `4.3`, `5.3`, `6.1`, `7.6`) để một công thức trong bài không mang hai cách.
  (3) `…osmī` và `…akova` là **hapax** trong toàn Pāli root đang ghim (`sukhitosmī` **2** khoá — `1.5` và `6.3`; `dukkhitosmī`, `sumanosmī`, `dummanosmī`, `upekkhakosmī`, `upekkhakova` mỗi cái **1**); **0 tiền lệ** bản Việt. Tôi dịch nghĩa đen *Tôi đang …* và *Khi đang …*.
  (4) Tên bài `Kaṭṭhopamasutta`: **0** Pāli trùng, tầng `name/` không khai, Sujato dịch *The Simile of the Fire Sticks*. Khuôn *Kinh Ví Dụ …* có sẵn (**20** khoá / 16 tệp), nên tôi chọn *Kinh Ví Dụ Về Củi*. Tầng tên `sn-name` có `sn48-sukhindriyavagga` → *The Chapter on the Pleasure Facility*, khớp *4. Phẩm Lạc Căn*.

  **Dấu lược:** chỉ `7.1`, `7.2`, `7.3`, mỗi khoá đúng **một** `…` cho `…pe…`. Không khoá nào bị bung. Nhấy kép mở ở `1.1` và đóng ở `7.6`, đúng như Pāli; nhấy đơn đều cân ngay từng khoá.
