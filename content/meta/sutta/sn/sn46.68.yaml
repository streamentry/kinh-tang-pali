  snapshot chỉ có Pháp Cú; đây là giới hạn của bản chụp upstream.
  Giữ …pe… nguyên dạng … theo quy ước kho, không mở rộng.
  Tiền lệ đếm được: cái chết có 77 đoạn; 0.3 mở rộng theo kiểu chương như
  Puḷavakasutta thành Kinh Niềm Tưởng Về Đám Bụi, Sujato đặt Death;
  Pāli 1.1 không có bhāvitā nên không thêm đã được tu tập; 1.2 Thứ hai.
  có 218 đoạn.
  Tiêu đề không có tiền lệ trực tiếp nào cho Maraṇasutta; dạng Niềm Tưởng
  Về Cái Chết giữ đúng kiểu sibling; ghi ở đây để người biên tập quyết
  nếu muốn dạng gọn hơn.
