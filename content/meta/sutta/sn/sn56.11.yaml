notes: |-
  Dịch từ Pāli root snapshot đã ghim.
  Đối chiếu bản dịch tiếng Anh của Bhikkhu Sujato và lớp lấp english-project ở khoá 12.4.
  Coverage tầng Anh đạt 45/45 substantive segments = 100%, không có gap dưới sàn.
  Đủ 60/60 khoá khớp Pāli root tuyệt đối.
  Dấu nháy kép và đơn khớp 1:1 với Pāli từng khoá.
  10 dấu lược … cân bằng chính xác với 10 vị trí …pe… trong Pāli.
  Cấu trúc Bát Thánh Đạo, Tứ Diệu Đế, 3 chuyển 12 hành tướng (tiparivaṭṭaṁ dvādasākāraṁ) và danh hiệu Tôn giả Aññāsikoṇḍañño dịch chuẩn xác theo thuật ngữ truyền thống.

  Sửa lan 2026-10-13: (1) khoá 11.1 — `virajaṁ vītamalaṁ dhammacakkhuṁ`: «Pháp nhãn thanh tịnh không uế nhiễm» → «Pháp nhãn không bụi, không cấu uế» (`raja` = bụi; cùng công thức ở `dn3:2.21.6`, `dn5:29.6`, `dn21:2.10.9` và nhiều bài khác). (2) khoá 11.2 — `yaṁ kiñci samudayadhammaṁ sabbaṁ taṁ nirodhadhammaṁ`: «Phàm pháp gì có tập khởi, tất cả pháp ấy đều có hoại diệt.» → «Bất cứ pháp nào có tính sinh khởi, tất cả đều có tính đoạn diệt.» (`-dhamma` = có tính chất; đây là cách dịch của đa số các bài cùng câu: `dn3`, `dn5`, `dn21`, `sn35.74`, `sn35.121`, `mn74`…).
  Quyết định hội đồng biên tập 2026-10-16: B9 — `sn56.11:5.2`, `sn56.11:5.3` (`pariññeyya`/`pariññāta` → «liễu tri»).
