notes: |-
  Dịch trọn vẹn 63/63 khoá của Sallasutta (sn36.6), không có khoá nào ngoài tập khoá Pāli.
  Coverage tầng Anh Sujato đạt 100% (36/36 segment Pāli có nội dung); không có lớp english-project cho bài này. Bản Việt hiện hành (HT. Thích Minh Châu) chỉ có dạng nguyên bài ở mục tra cứu toàn văn, không có tầng theo segment; tôi đọc để đối chiếu thuật ngữ nhưng không coi là tầng store.
  Năm phép kiểm: (1) tập khoá Việt = tập khoá Pāli, 63/63, đúng thứ tự; (2) nháy đơn và nháy kép khớp Pāli từng khoá, 63/63 khoá, 0 lệch; (3) Pāli trùng nguyên văn trong chính bài: 6 nhóm, 0 nhóm bản Việt khác nhau (1.6/1.12, 1.7/1.13, 1.8/3.1, 2.2/3.5, 2.3/3.6, 1.17/3.10); (4) dấu lược: Pāli có đúng một `…pe…` ở 1.4, Việt giữ đúng một `…`, 0 lệch; (5) không có số Pāli cần tính trong bài (chỉ có "hai mũi tên" và "một mũi tên", dvisalla và ekasalla).
  Dùng lại nguyên văn đã published, sau khi đo tiền lệ: 0.2 (9/9 khoá) · 1.17 và 3.10 (*Vì sao vậy?*, dạng đa số, 298 khoá) · 1.4 (*các pháp lấy Đức Thế Tôn làm gốc …*, 7 trên 9, cùng dạng với sn36.18:1.5) · 5.3 và 5.4 theo an8.5:3.3 và 3.4 · 6.2 theo snp3.4:24.2 và 27.2 (hai dạng, trùng Pāli đúng nguyên văn) · 6.3 theo an8.5:4.3. Đã dò 8 khoá Pāli trùng nguyên văn với tầng, cả 8 đều dùng lại; 1 khoá gần trùng (5.1, Pāli khác một dấu câu so với ud2.5:4.2) tôi chủ ý dịch khác, xem BẤT ĐỊNH.
  Thuật ngữ, theo tiền lệ sn36 và mn148: `vedanā` → cảm thọ; `sukhā/dukkhā/adukkhamasukhā vedanā` → lạc thọ / khổ thọ / bất khổ bất lạc thọ (sn36.7:8, mn148); `vedayati` → cảm nhận (sn36.7); `assutavā puthujjano` → kẻ phàm phu chưa học (sn36.4); `sutavā ariyasāvako` → bậc Thánh đa văn (sn36.4, sn36.5); `urattāḷiṁ kandati` → đấm ngực mà khóc (sn36.4:1.6 và 1.8, 2 khoá cùng chương); `sammohaṁ āpajjati` → rơi vào mê muội (mn36); `anusaya` → tùy miên, `anuseti` → tiềm ẩn nơi (mn148:28.3 đến 28.7); `paṭigha` → sân hận; `kāmasukha` → dục lạc (30 khoá so với 1 khoá "lạc dục" ở toàn sn); `abhinandati` → hoan hỷ; `saññutto`/`visaññutto` → bị trói buộc / không bị trói buộc (sn36.7:8.4); `viseso/adhippayāso/nānākaraṇaṁ` → sự đặc thù / sự thù thắng / sự sai biệt (sn12.19:3.1). Công thức năm vế `samudaya/atthaṅgama/assāda/ādīnava/nissaraṇa` theo sn36.27:1.4 và 1.6 (*sự sinh khởi, sự diệt tận, sự thú vị, điều nguy hiểm, sự thoát khỏi*). Riêng `nissaraṇaṁ` đứng một mình (1.18, 3.11) tôi dịch *lối thoát* theo sn36.15 đến sn36.26 (đa số trong chương).
  Cấu trúc lập luận được giữ nguyên: hai mũi tên (thân thọ cộng tâm thọ) so với một mũi tên; chuỗi tuần tự khổ thọ, sân hận, tùy miên sân, hoan hỷ dục lạc, tùy miên tham, không biết như thật, tùy miên vô minh, bị trói buộc. Hai phần phàm phu và bậc Thánh đối xứng từng vế; khoá 1.4 của Pāli bị lược bằng `…pe…` nên chỉ còn lời mở của các tỳ-kheo.
  BẤT ĐỊNH 1 (cần người biên tập kiểm): kệ 4.1 và 4.2 `Na vedanaṁ vedayati sapañño, sukhampi dukkhampi bahussutopi` có đúng một phủ định `na`, nên nghĩa đen là "bậc trí, bậc đa văn không cảm nhận cảm thọ, dù lạc hay khổ", trong khi văn xuôi ngay trước đó nói bậc Thánh đa văn vẫn cảm nhận một cảm thọ thuộc thân. Bản Anh Sujato viết "does not not feel" (phủ định kép), tức đọc theo hướng "vẫn cảm nhận"; bản Hòa thượng Thích Minh Châu ở mục tra cứu toàn văn đọc "lạc khổ không chi phối". Tôi giữ nghĩa đen một phủ định theo Pāli, không thêm "bị chi phối" hay "không không" vào thân kinh, và hạ `ambiguity_integrity` xuống 8,8. Chưa tìm được chứng cứ độc lập trong các tầng đã ghim để phân xử.
  BẤT ĐỊNH 2: `Saṅkhātadhammassa` (5.1) tôi dịch *bậc đã thẩm xét pháp*, khác `ud2.5:4.2` (*bậc đã thắng tri pháp*) vì `saṅkhāta` là "đã được cân nhắc, thẩm xét", không phải `abhiññā` (thắng tri); đây là khoá gần trùng duy nhất bị dịch khác, 1 trên 1 tiền lệ. `Aniṭṭhato no paṭighātameti` (5.4) giữ nguyên văn an8.5:3.4 (*không làm tâm bực bội*); Sujato đọc chủ ngữ là người ("nor are they repelled by the undesirable"), nghĩa gần nhau nhưng người biên tập có thể muốn chỉnh theo hướng đó. `Padañca ñatvā virajaṁ asokaṁ` (6.3) giữ *chỗ đặt chân là không trần, không buồn* theo an8.5:4.3 để nhất quán, dù Sujato dịch "stainless, sorrowless state".
  `paṭighavā` (1.14, 3.7) dịch *có sân hận* theo `paṭighānusayo` → *tùy miên sân* (mn148); Sujato dịch "resist" (kháng cự). Cùng gốc `paṭigha`, nghĩa thiên về phản kháng, giận ghét; chọn *sân hận* cho khớp tùy miên đã có tiền lệ.
  technical_integrity đặt 9,6 vì chưa chạy được bốn lệnh của kho trong phiên này: `npm run validate` · `npm test` · `npm run check` · `npm run build` đều chưa chạy, cần chạy trước khi coi cổng kỹ thuật đã qua.
