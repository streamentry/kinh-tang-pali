notes: |-
  Dịch từ Pāli root, đối chiếu bản dịch tiếng Anh của Bhikkhu Sujato trên SuttaCentral (commit đã ghim 11c9d708). Không có bản Việt hiện hành (Hòa thượng Thích Minh Châu) tại commit đã ghim cho phần này (ngoài Pháp Cú).
  Coverage tầng Anh đạt 18/20 segment Pāli có nội dung (90.00% >= 80%), vượt ngưỡng gate xuất bản trực tiếp không cần ghi nhận gap.
  Tuân thủ 5 phép kiểm tra nghiêm ngặt:
  1. Tập khoá: Đúng chính xác 58 khoá theo canonical SuttaCentral.
  2. Dấu nháy: Khớp 1:1 với Pāli root (mở ngoặc kép ở 1.2, đóng ngoặc kép ở 7.8, các khoá còn lại không dùng dấu nháy).
  3. Dấu lược: Giữ nguyên quy ước lược của repo, '…pe…' chuyển thành đúng một '…' trần không bung chữ.
  4. Cụm 'nibbānaninnaṁ nibbānapoṇaṁ nibbānapabbhāraṁ' (ở 4.7) dịch chuẩn xác: 'hướng về Niết-bàn, nghiêng về Niết-bàn, xuôi về Niết-bàn'.
  5. Nhất quán nội bộ: Ba sự tìm kiếm (kāmesanā, bhavesanā, brahmacariyesanā: tìm kiếm dục lạc, tìm kiếm hữu, tìm kiếm phạm hạnh), Thánh đạo tám ngành, các công thức về bốn pháp tu tập (thắng tri - abhiññā, liễu tri - pariññā, đoạn tận - parikkhaya, từ bỏ - pahāna) và các chú thích biên tập '(Yadapi abhiññā...)' đồng nhất 100%. Số đếm chuẩn: Tisso = ba, aṭṭhaṅgiko = tám ngành, Paṭhamaṁ = Thứ nhất.
