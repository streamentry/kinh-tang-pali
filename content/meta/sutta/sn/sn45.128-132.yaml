    `nibbānaninnaṁ nibbānapoṇaṁ nibbānapabbhāraṁ` → *có xu hướng về phía
    Niết-bàn, có bến về phía Niết-bàn, có dòng về phía Niết-bàn* (theo
    `sn45.127:1.2` và `sn46.130:1.11`).
  - >-
    **`pācīna` là ĐÔNG, bản này ghi TÂY — đã sửa 6 khoá** (`sn45.128-132:0.3`,
    `sn45.128-132:1.1`, `sn45.128-132:1.3`, `sn45.128-132:1.5`,
    `sn45.128-132:1.7`, `sn45.128-132:1.10`). Lớp lỗi này **sinh ra từ chính
    luật** *Pāli trùng nguyên văn thì cách dịch phải khớp*: một bài sai trước đó
    được nhân bản sang các bài cùng Pāli, nên nó lan rộng và trông rất nhất quất
    — đúng cái làm cho nó khó thấy, và nó đã qua mọi cổng. Bằng chứng: bản Anh
    Sujato **đã ghim** dịch `pācīnaninnā` là *“slants, slopes, and inclines to
    the east”* (`sn45.91:1.2`) và tiêu đề SuttaCentral của `sn45.91` là
    *“Slanting East”*; đo lại bằng script trên toàn tầng `sn` thì trước lát này
    có **37 khoá ở 16 bài** đã dịch **đông** (`sn45.104-108`, `sn45.116-120`,
    `sn46.77-88`, `sn47.51-62`, `sn48.71-82`, `sn48.125-136`, `sn50.55-66`,
    `sn51.33-44` …) và **26 khoá ở 11 bài** ghi **tây**. Đã đảo **chỉ hướng**
    `tây` → `đông` và giữ nguyên phần còn lại của câu; dấu lược không đụng. Mẫu
    đúng có sẵn ở `sn45.104-108:1.1` là *nghiêng về đông, xuôi về đông, đổ về
    đông*; **không** ép bài này về khuôn đó, vì phần `nibbānaninno nibbānapoṇo
    nibbānapabbhāro` của chính bài đã dùng cấu *có xu hướng về phía …, có bến về
    phía …, có dòng về phía …* — ép khuôn sẽ làm bài tự mâu thuẫn. Đã sửa kèm
    `translationTitle` và nhãn (slug) của nó cho khớp. Hạ `semantic_fidelity`
    (−1.5) và `ambiguity_integrity` (−0.7) theo **số khoá hỏng × mức độ**;
    `final_score` tính bằng script từ trung bình số học thô của đúng 10 tiêu
    chí: 9.36 → 9.14, status `published` → `published`. Ghi chú cũ của tệp này
    nêu hướng *tây* là **quyết định sai** và nay bị mục này thay thế; không xoá,
    để lịch sử còn đọc được.
  - >-
    **Vế thứ ba của ẩn dụ dòng sông: `pabbhāro` là *bãi bồn*, không phải *có
    dòng* — đã sửa 4 khoá (5 lần).** `nibbānaninno hoti nibbānapoṇo
    nibbānapabbhāro` là ẩn dụ ba vế của một dòng sông: *có xu hướng (nghiêng)* ·
    *có bến* · *bãi bồn (đổ sang bờ bên kia)*. Bản đang có dịch vế ba là *có
    dòng về phía Niết-bàn* — tức **lặp lại nghĩa vế nhất** (`ninno` đã là *có xu
    hướng về phía …*) và **đánh rơi** nghĩa của `pabbhāro`, vốn là vế độc lập:
    chỗ nước dồn lên bãi rồi tràn sang bờ bên kia. Đã sửa thành *có bãi bồn về
    phía Niết-bàn* theo mẫu đúng đã có sẵn ở `sn45.152:1.1` (*cây trôi về phía
    đông, có bến về phía đông, có bãi bồn về phía đông*); giữ nguyên vế một, vế
    hai và nhịp câu của chính bài này. Khoá đã sửa: `sn45.128-132:1.11`,
    `sn45.128-132:1.12`, `sn45.128-132:1.13`, `sn45.128-132:1.14`. Lớp lỗi này
    sinh ra từ chính luật *Pāli trùng nguyên văn thì cách dịch phải khớp*: một
    bài sai trước đó được nhân bản sang các bài cùng Pāli, nên nó lan rộng và
    trông rất nhất quất — đúng cái làm cho nó khó thấy. Quét lại trên **mọi**
    dạng chia của `pabbhāra` (`nibbānapabbhāro` và `nibbānapabbhāraṁ`), chứ
    không chỉ dạng danh từ, mới thấy hết lớp này. **Dấu lược không mở rộng:**
    `sn45.128-132:1.13` có `…pe…` trong Pāli và bản Việt vốn đã giữ **đúng một**
    `…`; sửa vế ba không đụng vào dấu lược. **Không** ép về khuôn *nghiêng /
    xuôi / đổ* của 28 khoá ở 11 bài khác (`mn73`, `sn45.149`, `sn46.77-88`,
    `sn47.51-62`, `sn48.71-82`, `sn48.125-136`, `sn49.1-12`, `sn50.1-12`,
    `sn50.55-66`, `sn51.33-44`, `sn55.22`) và 3 khoá *có bãi bồn* đã có sẵn ở
    `sn45.152` — đó là các cách dịch khác hợp lệ; ép khuôn sẽ sinh vấn đề mới.
    Đo lại toàn tầng sau khi sửa: Pāli có `nibbānapabbhāra*` ở 87 khoá / 32 bài,
    **0 khoá** nào còn dịch vế ba bằng *có dòng*. Ghi chú cũ của tệp này có nêu
    *… bến …, … dòng về phía …* như nguyên văn dùng lại / như tiền lệ đếm được;
    nay bị mục này thay thế, không xoá, để lịch sử còn đọc được. Hạ
    `semantic_fidelity` (−0.3 × 5) và `terminology` (−0.1 × 5) theo **số lần sai
    × mức độ**; `final_score` tính lại bằng script từ trung bình số học thô của
    đúng 10 tiêu chí: 9.14 → 8.94, status `published` → `review`. Không blocker.
