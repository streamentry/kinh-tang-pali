    tách `amaññamāno` thành *“không tưởng tượng mà tưởng tượng”*; đã bỏ hàm,
    viết tay từng câu theo `maññamāno` / `amaññamāno` · `abhinandamāno` /
    `anabhinandamāno`. (2) `sn22.64/65:0.1`: hàm sinh ra **`Saṁyutta Nikāya
    sn22.64`** rồi **`Saṁyutta Nikāya 64`** — phải là
    `'.'.join(u.split('.')[1:])`. (3) `sn22.64/65:0.3`: tiêu đề bị sinh ra là
    *Kinh Tưởng Tượng (thật sự tưởng tượng)* và *Kinh Hoan Nghỉnh (thật sự hoan
    nghỉnh)*. (4) `sn22.64/65:3.2`: `Sādhu kho tvaṁ` là *Lành thay cho ngươi*,
    bản nháp viết *Lành thay **thay***. (5) `sn22.133:1.2`: bản nháp **bỏ mất
    chủ thể** `Tôn giả Sāriputta` trong `Atha kho āyasmā sāriputto
    sāyanhasamayaṁ …pe…`. (6) `sn22.133:2.5/4.5`: cụm *sự thú vị* bị lặp thành
    *biết rõ như thật sự **sự** thú vị*. (7) `sn22.133:2.2–2.4`: `Vedanāya /
    saññāya / saṅkhārānaṁ` là **của** (genitive) để khớp với *của sắc* ở 2.1 và
    *của thức* ở 2.5; bản nháp dùng *với*. (8) `sn23.1:2.4/2.10`: `rūpaṁ māroti
    passa … aghabhūtanti passa` là **tám** vế (māro · māretā · mīyati · roga ·
    gaṇḍa · salla · agha · aghabhūta), bản nháp đếm chín vì hằng dịch đã có sẵn
    chữ *Ác Ma* trong khi mệnh đề dẫn đầu *thấy sắc là Ác Ma* cũng mang; và
    `mīyati` là kẻ **bị** giết, không phải *kẻ chết*. (9) `sn45.146-148:1.1`:
    `sabbā tā candimappabhāya kalaṁ nāgghanti soḷasiṁ` nghĩa là **ánh trăng
    thắng**, bản nháp viết **ngược** là *đều lấn át ánh trăng*. (10)
    `sn45.146-148:3.1`: `kāsikavatthaṁ tesaṁ aggamakkhāyati` là *vải dệt ở Kāsi
    được xem là hơn hết*, bản nháp viết *chúng đều lấn át tấm lót bằng vải
    thường* — thêm một vật **không có trong Pāli**. (11) `sn45.134-138:2.5`:
    `Nibbānaninno dvādasakī` là bài **hướng về Niết-bàn** thứ mười hai, bản nháp
    viết *Bài Dòng Sông Chảy Về Đông thứ mười hai*. (12) `sn45.30:1.9/1.13`: sáu
    tính từ `iṭṭhā kantā manāpā piyarūpā kāmūpasaṁhitā rajanīyā` bị **bỏ nguyên
