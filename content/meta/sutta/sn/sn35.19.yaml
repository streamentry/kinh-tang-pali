  Rà nhất quán theo Pāli trùng 2026-10-14: khoá sn35.19:1.2, 1.6, 1.9 — «chưa thoát khỏi khổ đau» → «chưa thoát khỏi khổ», và cùng quy tắc cho khoá 2.2, 2.6, 2.9 («đã thoát khỏi khổ»). Vì dukkhasmā cùng gốc dukkha với «sự khổ» ngay trong câu trước; viết «khổ đau» ở một vế và «sự khổ» ở vế kia là hai chữ cho một từ. Giữ «nơi sự khổ», «Ta nói rằng», «Người ấy» theo mạch cả bài (số đông viết «hoan hỷ khổ, ta nói ‘vị ấy …’» ở các bài khác). Ghi nhận ngoài phạm vi: Pāli ở 2.9 viết aparimutto (không phải parimutto) dù cả đoạn nói «đã thoát khỏi»; bản Việt giữ theo văn cảnh, không sửa Pāli.
