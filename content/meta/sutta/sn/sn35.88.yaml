notes: |-
  Dịch từ Pāli root, đủ 70/70 khoá, thứ tự khoá đúng thứ tự Pāli. Đối chiếu bản Anh Sujato đã ghim và bài song song `mn145` (cùng lời dạy cho Puṇṇa đi Sunāparanta, đã `published`).
  **Coverage Anh đo thật trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): Sujato phủ 48/51 = 94,1%** (độc lập, không tính lớp `english-project`). Ba khoá Sujato để trống (`5.2`, `18.5`, `18.6`) được lớp `english-project` lấp, nên cổng tính cả hai lớp là 51/51 = 100%; phần lấp đó không phải bản đọc độc lập. Vượt sàn 0,80, không cần entry trong `reference-gaps.yaml`. Tầng `vietnamese-current` không có cho bài này (SuttaCentral chỉ có Pháp Cú); bản Hòa thượng Thích Minh Châu nguyên bài không được đọc đối chiếu trong lượt này, nên `triangulation` đặt 9.0 chứ không cao hơn.
  **Dùng lại tiền lệ.** 29 khoá có Pāli trùng nguyên văn một khoá khác trong tầng (không kể tên phiên và `Pañcamaṁ`); 28/29 dùng lại nguyên văn một bản đã `published`, chủ yếu từ `mn145` (cụm đối thoại Sunāparanta: `5.1–5.3`, `6.1–6.4`, `7.1`–`16.1`, `16.3–16.4`; hỷ khởi/hỷ diệt `2.3`, `2.8`, `2.9`, `3.6`; `17.1`, `17.3`, `18.2`, `18.3`) và từ `sn35.81` cho `19.1`. Khoá còn lại, `1.2` (14 cặp trùng, các bản trong tầng khác nhau ở *pháp*/*Chánh pháp*, *Tốt đẹp thay*/*Lành thay*), viết theo dạng gần `sn35.89:1.2` nhưng giữ *pháp* cho cả hai `dhammaṁ` vì Pāli không có chữ *chánh*. `17.2` và `19.2`/`19.3`/`20.1`/`20.2` bám `mn145:6.2`, `8.2`–`8.5` với Pāli gần như trùng (khác `vatthuṁ`/`viharituṁ`, `yo so`), đổi *người con gia đình* thành *thiện nam tử* theo quy ước tầng (219 khoá so với 3) và *mạng chung* thành *qua đời* (12 so với 4 *mệnh chung* và 2 *mạng chung* ở `kālaṅkato` trong bộ Tương Ưng).
  **Trùng nguyên văn trong chính bài, 6 nhóm.** `2.3`=`2.8`, `2.6`=`3.4`, `6.3`=`8.3`=`10.3`=`12.3`=`14.3`=`16.3`, `6.4`=`8.4`=`10.4`=`12.4`=`14.4`=`16.4` đều cùng bản Việt. Hai nhóm cố ý khác: `2.2` với `2.7` và `3.2` với `3.5` (Pāli `tañ …` giống hệt) viết khác ở đại từ chỉ định *các sắc ấy* và *các pháp ấy*, vì `tañ` quy về đối tượng đã nêu ngay trước (sắc do mắt nhận biết ở `2.1`/`3.1`, pháp do ý nhận biết ở `2.6`/`3.4`).
  **Dấu lược.** `1.1`, `19.1` giữ một `…` cho `…pe…` (*sau khi đến …*). `2.4`, `2.5`, `3.3` kết bằng ` …` như Pāli `…pe…`; `2.5` và `3.4` mở bằng chữ thường vì Pāli `santi kho` viết thường sau dấu lược. Nháy đơn và nháy kép khớp Pāli từng khoá.
  **Thuật ngữ.** `nandī` → *hỷ* (tầng không thống nhất: *hoan hỷ*, *hỷ*, *niềm vui*, và *hỷ duyệt* ở bốn khoá của `sn35.64`; chọn *hỷ* theo `mn145:3.3`); `abhinandati abhivadati ajjhosāya tiṭṭhati` → *hoan hỷ, chào đón và bám chặt* (theo `mn145`; tầng có nhiều biến thể, cùng nghĩa); `samudaya`/`nirodha` ở `nandisamudayā dukkhasamudayo` → *Hỷ sanh thì khổ sanh* / *Hỷ diệt thì khổ diệt* (theo `mn145:3.4`/`4.4`; `sn35.64` viết *tập khởi của hỷ duyệt*). `iṭṭhā kantā manāpā piyarūpā kāmūpasaṁhitā rajanīyā` theo `mn145:3.1` (*đáng ưa, đáng thích, dễ chịu, hấp dẫn, liên hệ đến dục và khơi dậy ham muốn*); tầng có nhiều cách dịch khác (*khả ái, dễ thương, vừa ý…*), `sn35.64` dùng một cách khác.
  **Số.** `pañcamattāni upāsakasatāni` / `upāsikāsatāni` = *khoảng năm trăm*: pañca 5 × sata 100 = 500, mỗi vế một lần (`18.4`, `18.5`); `tisso vijjā` = *ba minh* (`18.6`).
  **Bất định.** (1) `18.4`–`18.5` `paṭivedesi`: Sujato dịch *confirmed*, `mn145:7.4` (cùng cấu trúc) dịch *hướng dẫn … được tín thọ*; bản này theo `mn145` và không thêm gì về nội dung được dạy. (2) `16.2` `satthahārakaṁ`: nghĩa đen *vật/kẻ mang dao*; Sujato dịch *suicide weapon*, `mn145:5.32` dịch *dao để tự vẫn*; giữ *dao* theo `mn145`, và *tự vẫn* là nghĩa suy từ ngữ cảnh *aṭṭīyamānā harāyamānā jigucchamānā* chứ Pāli không nói trực tiếp. (3) `18.3` `Tatra sudaṁ āyasmā puṇṇo sunāparantasmiṁ janapade viharati` dùng lại nguyên văn `mn145:7.3` *và an trú tại đó* (Pāli trùng); chủ ngữ và địa danh lấy từ `18.2`. (4) `18.1` `padakkhiṇaṁ katvā` → *đi nhiễu bên phải* (14 khoá *đi nhiễu* trong bộ Tương Ưng, 5 khoá *đi vòng*). (5) `ovāda` → *giáo hóa* (21 khoá *giáo hóa*, 22 *khuyên dạy*, 10 *giáo giới* ở toàn tầng; theo `mn145:5.1`). (6) `4.1`, `5.3`, `7.1`… `kinti bhavissati` → *nghĩ thế nào* theo `mn145`; Sujato dịch *what will you think of them*. (7) `0.2` `Channavagga` theo *9. Phẩm Channa* (8 khoá đã có ở `sn35.86`, `sn35.89`, `sn35.92`).
  **Lỗi bản nháp đã bắt.** Bản nháp đầu dùng *người con gia đình* và *mạng chung* theo `mn145`; đo lại thì tầng dùng *thiện nam tử* (219 so với 3) và *qua đời* (12 so với 2), nên đã đổi. Đã in lại 70 cặp Pāli↔Việt để đọc đối kháng; không thấy khoá bị cắt lệch.
  **Cổng kỹ thuật.** Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lát này (do người điều phối chạy), nên `technical_integrity` đặt 9.6 chứ không 10.0.
