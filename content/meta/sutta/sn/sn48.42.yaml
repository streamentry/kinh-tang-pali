notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có 26 chương Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Hai tầng còn lại là Pāli root (authority) và bản Anh Bhikkhu Sujato đã ghim.
  - >-
    **Coverage tầng Anh 1,000** (22 Pāli có nội dung, 22 có chữ Sujato).
  - >-
    **Tên riêng phải chuyển tự, và đây là lý do — ghi rõ để người đọc tin được.** `_hvi.lọt_pāli` coi mọi từ có dấu Pāli chưa từng xuất hiện trong tầng Việt là *Pāli lọt*, và `Uṇṇābha` **chưa** có ở đâu trong kho (`sn51.15`, `sn51.20` — hai bài cùng nhân vật — chưa dịch). Nên tên được viết theo lối phiên âm Việt thông dụng là *Un-nà-ba* (0 tiền lệ trong kho). Nếu người điều phối muốn giữ IAST `Uṇṇābha` cho nhất quán với Anāthapiṇḍika, Jāṇussoṇi…, phải sửa cả tầng.
  - >-
    **Bài song song, chưa dịch.** `sn51.15` và `sn51.20` cùng có nhân vật Un-nà-ba nhưng chưa có bản Việt, nên không có gì để dùng lại.
  - >-
    **0 tiền lệ, đặt mới — cả bài là câu hỏi–câu trả lời về `paṭisaraṇa`.** `paṭisaraṇaṁ` → *quy về* theo cụm *mọi pháp đều quy về cảm thọ* đã có trong kho; `nānāvisaya / nānāgocara` → *tánh chất khác nhau, phạm vi khác nhau*; `paccanubhonti` → *cảm nhận*; `brahmacariyaṁ` → *phạm hạnh* (1.187). `indriya` → *căn* (không phải *cản*), giữ đúng phân biệt `viṣaya` / `gocara` thay vì làm phẳng thành một từ.
  - >-
    **Nibbānogadhañhi** (`:4.9`) dịch *là chỗ quy vào, là đích đến và là sở chứng của phạm hạnh* — giữ đủ ba vế `ogadha / parāyaṇa / pariyosāna` mà không nói thêm. `saddhā niviṭṭhā mūlajātā patiṭṭhitā daḷhā asaṁhāriyā` (`:6.4`) có **năm** vế, bản Việt có **năm** vế: *vững chắc, đã mọc rễ, đã được gieo trồng sâu, cứng cỏi, không lay chuyển được*.
  - >-
    **Thuật ngữ đã đếm.** `Jarāvagga` → *5. Phẩm Già* (5, đúng `sn48.41:0.2`) · `Sāvatthinidānaṁ` → *Tại Sāvatthī.* (391) · `Katamāni pañca?` → *Thế nào là năm?* (73) · `abhinanditvā anumoditvā` → *hoan hỷ tín nhận* (theo `sn37.31`) · `padakkhiṇaṁ` → *đi vòng bên phải* (nhiều nơi trong sn) · `saṁyojana` → *trói buộc* (theo `sn35.109:0.3`) · `mārena` → *Māra* (kho giữ nguyên IAST ở tầng sn) · `brahmunā` → *Phạm thiên* (788).
  - >-
    **Tiêu đề.** `Uṇṇābhabrāhmaṇasutta` → *Kinh Bà-la-môn Un-nà-ba*; 0 tiền lệ cho nhân vật này. `sammodanīyaṁ kathaṁ sāraṇīyaṁ` lấy nguyên văn `an2.16:1.2`.
  - >-
    **Dấu lược:** bài không có `…pe…`; `lược()` bằng 0 mọi khoá. **Ngoặc kép:** mỗi cặp hỏi–đ tự cân ngay trong cặp, `_hvi.ngoặc` xác nhận.
  - >-
    **Khác kho, có chủ ý — số đếm.** `Saṁyutta Nikāya` → *Tương Ưng Bộ* (xem `sn35.105`).
  - >-
    `technical_integrity` 9.6 vì bốn lệnh cổng **do coordinator chạy**, lát này đã tự kiểm mọi thứ còn lại bằng `_hvi.kiểm` (NFC, dấu lược khớp từng khoá, nháy kép cân trên cả bài, không Pāli lọt): `npm run validate` · `npm test` · `npm run check` · `npm run build`.
