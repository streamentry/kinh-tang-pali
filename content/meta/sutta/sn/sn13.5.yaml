  - >-
    **Lượt review đối kháng bắt được 4 lỗi, đã sửa hết.** (1) **`an8.1:2.4` rút
    gọn sai** — Pāli liệt kê đủ tám động từ (không có `…pe…`) mà bản nháp ghi
    *đã được thực hành … đã được khéo bắt đầu*; đã viết đủ tám. (2)
    **`an8.38:2.3` thừa ngoặc đóng** — Pāli kết `hotīti.` (iti viết liền, không
    có `”`); đã bỏ `”ti`. (3) **`sn15.4:2.5` thêm chữ** — Pāli chỉ còn `alaṁ
    vimuccituṁ` (phần trước đã lược ở `2.4`); đã bỏ *Như vậy là*, còn *Đủ để
    giải thoát*. (4) **`ārāma` sai từ** — `an8.1:1.2`/`sn17.1:1.2` ghi *vườn*
    trong khi kho dùng *tu viện* (`an10.1:1.2`); đã sửa. Ngoài ra: `sn55`-kiểu
    *Sakka* đã tránh (dùng tên riêng đầu); `sappurisa` theo kho (*Thiện Nhân* —
    `Kinh Bậc Thiện Nhân` đã publish) dù Sujato ghi *true person*.
  - >-
    **Không có bài nào dưới ngưỡng 80%: `npm run reference:gaps` giữ nguyên 209
    gap.** Cả 25 bài đều đủ prose Sujato ở các khoá được tính (kể cả các bài
    nhiều khoá lược như `sn12.30`, `sn14.9`, `an7.79/82`, `sn17.13-20`, vì
    Sujato đã dịch đủ mệnh đề chính).
  - >-
    **Đặc thù của tầng Pāli tại commit đã ghim — ghi ra, không sửa Pāli, không
    chú thích trong thân kinh:** (1) `an2.49:1.6`/`2.3` giữ nguyên dấu `(…)` của
    Pāli. (2) `an2.31`/`an2.49` không có `0.x`; `an2.49:1.0` trần (*49*) nằm
    trong tệp Pāli dùng chung `an2.42-51`. (3) `an7.79/82:1.8` **không** có
    `…pe…` (liệt kê thiếu `diṭṭhadhammasukhavihārānaṁ` so với bản đủ) — giữ
    đúng, không bù. (4) `sn54`-kiểu `…pe…` đứng riêng ở `sn56.1`-ngoại: không có
    ở lát này. (5) `sn17.1:2.3` Pāli viết thường sau `‘` (`‘uppannaṁ…`) — Việt
    viết hoa theo chính tả (*‘Lợi lộc…*), ghi rõ là chủ ý. (6) `sn13:2.3` đóng
    lời tỳ-kheo (`”ti`) dù `2.1` mở; `sn15.4:1.5` kép đủ `“…”`. (7) Uddāna
    `sn12.30:3.2` (`Aññatitthiyabhūmijo`) và `sn17.13-20:2.1` (`Dve pāti`) dịch
    nghĩa chữ từng đề mục.
  - >-
    **Bất định có nghĩa đáng kể, đã phân xử và ghi lại:** (1) `vinayadhara` —
    *am hiểu* (theo Sujato *expert*) thay vì *giữ* (nghĩa chữ *dhara*); nội dung
    bài (thiền + thắng trí) ủng hộ nghĩa tinh thông. **Người biên tập nên
    kiểm.** (2) `apace brahmacārayo` (`an8.38:4.4`) — *các vị khất sĩ phạm hạnh*
    theo Sujato (*mendicant spiritual practitioners*); `apace` không chắc chắn.
    (3) `amata` — giữ *bất tử* (xem lát 18). (4) `visamā/samā` — giữ *sai
    trái/chân chánh* (xem lát 18, `an2.49`).
  - >-
    **Bẫy đã tránh trong lát này:** (a) **Ô tham số chỉ nhận chuỗi** (lát 16B).
    (b) **Cùng khuôn ≠ cùng cấu trúc** — năm bài `sn13` khác danh từ so sánh;
    `sn14.3/4/5/7/9` khác số khoá và vị trí lược; `an7.75/76/78` vs `an7.79/82`
    khác lược; viết tay từng bài. (c) **Không mở rộng `…pe…`** — `an7.34`-kiểu
    không có ở đây, nhưng `sn49`-kiểu `1.8` nối tiếp không chủ ngữ được giữ
    đúng. (d) **Tiền lệ sai thì không theo** — *Cầu Vàng* / *tức địa* (lát 18).
    (e) **Pāli không hoa sau ngoặc thì Việt vẫn hoa** — `sn17.1:2.3` (PĀ_LỖI 5).
