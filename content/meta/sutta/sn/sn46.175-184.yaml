    lặp lại lỗi đoán rồi mới sửa. (b) **Hằng `K`/`KĐ`** — harness chặn (từ PR
    #131) và không lọt lần này. (c) **Cùng Pāli phải cùng bản dịch** —
    `sn36.12:5.1`–`6.4` và `sn36.3:5.1`–`6.4` có **cùng** năm khoá kệ Pāli giống
    hệt nhau, nên tôi dùng **chung một hằng** thay vì viết hai lần; tương tự
    `sn35.204`/`sn35.205` chỉ khác ở *quá khứ/vị lai* và `1.13` có/không
    `bhikkhave`. (d) **Danh sách bắt đầu từ đâu** — `sn35.59:1.3` đã nói *con
    mắt* thì danh sách phải bắt đầu từ *tai*; đây là lỗi dễ lặp, tôi đã ghi. (e)
    **Hằng nối với đuôi câu** — `TẾ = 'tế sự '` chứ không phải `'tế sự theo '`,
    vì vế sau đã có *theo*.
  - >-
    **13 khoá** — bài hợp nhất **mười** bài. ⚠ `1.1` là `…pe…` **đứng riêng** ở
    đầu bài (phần bị lược của câu trước bài trước); tôi giữ **một** `…`. `2.0`
    là `Uddānaṁ` chứ không phải `Tassuddānaṁ`. `3.1`/`3.2` là **ghi chú trong
    ngoặc** — tôi dịch theo công thức đã publish ở `sn46.99-110:3.1` và
    **không** giải thích thêm.
  - >-
    **Thuật ngữ `oruddhambhāgiyā` — đảo dấu, đã sửa.** `oruddhambhāgiyā` là `o-` phủ định
    của `uddhambhāgiya` "thượng phần", tức **hạ phần**; đây là thuật ngữ cho **năm kiết sử
    hạ phần**. Dòng tổng kết `Khandhā oruddhambhāgiyā(t)nīti` trước đây ghi "thượng phần" /
    "phần trên" / "hạ-thượng phần" — **ngược dấu**. Đã sửa về **hạ phần** và giữ nhịp câu
    của bài. Mẫu đúng đã có sẵn: `sn45.180:3.4` = "uẩn, và hạ phần, là vậy." (khoá đó đã
    đúng, không đụng). Cần phân biệt: `uddhambhāgiyāni` **không** có `o-` nên vẫn là "thượng
    phần" và **không** đụng ở đợt này. Đếm trước khi viết trên toàn tầng: `hạ phần` 93 khoá,
    `thượng phần` 48, `phần trên` 11, `hạ-thượng` 2; Pāli có `oruddhambhāgiyā` ở **10**
    khoá, và sau khi sửa **0** khoá nào còn dịch khác "hạ phần". Dòng này trước đây dịch
    `oruddhambhāgiyānīti` thành *"năm uẩn, và chúng dây chằng chịt là vậy"* — **mất hẳn
    nghĩa**, đã sửa.

    `final_score` tính lại bằng script (trung bình số học thô của đúng 10 tiêu chí),
    `assessed_at` cập nhật. Đây là sửa lỗi kỹ thuật/thuật ngữ ở mức khoá, không phải biên
    dịch lại bài; không blocker, trạng thái giữ nguyên theo quality gate.
