  - >-
    **Bất định có nghĩa đáng kể, đã phân xử và ghi lại:** (1) `mātugāmo` — tầng
    đã `publish` dịch là *người nữ* (`an10.213:1.1`), nhưng trong `sn37` nó là
    **người mẹ** (uddāna đối với *mẹ/cha*), nên tôi dùng *người mẹ*; cùng dịch ở
    uddāna `mātugāmo puriso ca` → *người mẹ, người cha* (đối xứng) thay vì
    *người mẹ, người nam*. (2) `asappuriso` — kho đã `publish` dùng *người ác*
    (`an3.150:1.1`), tôi dùng *phi thiện tử* vì `sn45.25` đặt cạnh `sappuriso`
    và nội dung là tám pháp tà/chánh. (3) `sn46.20:2.3` — `viraddho` nghĩa là
    *đã lùi*, nhưng uddāna không nêu tên bài nên tôi chỉ dịch chữ, **không** gán
    vào bài nào. (4) `an2.136`/`an2.137` — `micchāpaṭipajjamāno` và
    `sammāpaṭipajjamāno` là hai cặp đối xứng; tôi dịch *hành xử sai lầm / hành
    xử đúng đắn* (0 tiền lệ) và dùng **nguyên văn `an3.150:1.1`** cho phần còn
    lại. (5) `sn48.60:2.2` — `padaṁ sāraṁ patiṭṭhitaṁ` là ba mục của uddāna; tôi
    dịch *Người Nữ Cư Sĩ / Bậc Thánh / Đã An Trú* theo nghĩa chữ, **không** gán
    vào tên bài vì tầng Pāli không cho.
