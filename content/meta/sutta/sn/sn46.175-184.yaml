    `sn27.10:2.1`–`2.4` tôi dùng **nguyên văn** uddāna của `sn18.10` đã viết
    trong PR #132 vì Pāli giống hệt từng vế. Ở `sn37.14:2.1`–`2.8` và
    `sn37.24:2.1`–`2.6` tôi dịch **mười sáu** và **mười một** mục; ở `sn35.59`
