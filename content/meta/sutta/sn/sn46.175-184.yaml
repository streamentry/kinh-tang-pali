    **Lượt review đối kháng bắt được 5 lỗi, đã sửa hết.** (1) ⚠ **Sai lệch một
    vị trí trong danh sách** — `sn35.59:1.4` tôi dịch *con mắt* trong khi Pāli
    là `sotaṁ` (*tai*); `1.3` đã nói *con mắt* rồi, mà tôi lại bắt đầu danh sách
    từ đầu. Đã dịch lại tám khoá `1.4`–`1.11` theo đúng thứ tự Pāli. (2) ⚠ **Chữ
    lặp** — hằng `TẾ` tôi viết là *tế sự theo* rồi lại nối *theo tham*, ra *tế
    sự theo theo tham* ở bốn khoá `sn36.3`. (3) ⚠ **Bỏ sót vị ngữ** ở
    `an2.136:2.1`/`an2.137:2.1` — Pāli có `Dvīsu, bhikkhave,
    sammāpaṭipajjamāno…` nhưng tôi không dịch `bhikkhave`. (4) **`sn46.20:2.1`**
    — tôi dịch `Pāṇā` thành *Giết Người* trong khi tiền lệ `an10.178:3.2` dùng
    *sát sinh* cho `Pāṇātipātā`; đã sửa. (5) `sn46.20:2.3` — tôi dịch `viraddho`
    thành *Tận Nhẫn*, tức lẫn với `khanti` (kiên nhẫn); đúng ra là *Người Đã
    Lùi*. Ngoài ra `sn48.60:2.1` tôi dịch `Sālaṁ mallikaṁ` thành *Đại Lâm* trong
    khi đây là **hai tên riêng**; đổi lại giữ nguyên *Sāla* và *Mallikā* như đã
    làm với `Dīghajānu`/`Ujjaya` ở PR #132.
  - >-
    **Mười một bài có `uddāna` — dịch lời của chính uddāna, không liệt kê ngoài
