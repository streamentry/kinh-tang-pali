notes: |-
  Dịch từ Pāli root. Tầng Anh của store đầy đủ: Sujato đã ghim phủ 13/16 segment Pāli có nội dung; ba khoá còn lại (`3.4`, `3.5`, `3.15`) do lớp `english-project` của dự án bù và đã ở trạng thái `published`, nên coverage tính cả hai lớp là **16/16 = 1,0000** — không cần entry trong `content/meta/reference-gaps.yaml`. Ở ba khoá bù đó tầng Anh độc lập không có, nên `triangulation` = 8,9. Ba khoá đó phải được gắn nhãn là bản lấp của dự án, không trộn vào Sujato. Tầng `vietnamese-current` không có cho bài này.
  **Bản song parallel trùng Pāli: 23 khoá, dùng lại y nguyên văn 19.** `sn24.37` (**cùng phẩm**) cho `1.2`, `1.4`, `2.1`, `2.6`, `3.1`, `3.2`, `3.3`, `3.6`, `3.7`, `3.9–3.12`; `sn16.12:1.15` cho cụm `‘neva hoti na na hoti tathāgato paraṁ maraṇā’` (**cùng Pāli, dùng lại nguyên văn**, 7 lần trong bài); `sn22.150/154/155` cho `2.4`, `2.5`, `3.10`, `3.11`.
  **Bất định lớn nhất của bài, ghi rõ thay vì giấu.** `neva hoti na na hoti tathāgato paraṁ maraṇā` — kho đang có **ba** cách cho cùng ý: *Như Lai phi tồn tại phi phi tồn tại sau khi chết* (`sn16.12:1.15`, 1 khoá, **trùng nguyên văn Pāli nên dùng lại**), *Như Lai chẳng tồn tại chẳng không tồn tại sau khi chết* (`sn44.5:1.5`, 2 khoá, Pāli khác vì có `tipissa hoti`), *hoặc không có Như Lai sau khi mạng chung mà cũng không không có* (`sn33.1/33.2`, 14 khoá, Pāli khác vì có `…ti vā`). Chọn theo luật *Pāli trùng nguyên văn thì dùng lại nguyên văn*. *phi phi tồn tại* là calque mà người Việt ít dùng; nếu người biên tập muốn dễ hiểu hơn thì có thể thống nhất cả bài thành *chẳng còn cũng chẳng không còn* — nhưng phải sửa `sn16.12` cùng lúc. Tiêu đề `Nevahotinanahotisutta` → *Kinh Chẳng Còn, Chẳng Không Còn* là **0 tiền lệ**, đặt theo cùng cách đọc ấy.
  **Hai chỗ cố ý viết khác, kèm số đếm.** (1) `Bhagavaṁmūlakā no …` — chọn *các pháp lấy Đức Thế Tôn làm gốc* (16) thay vì *những pháp ấy lấy Đức Phật làm gốc rễ* (6). (2) `api nu taṁ anupādāya evaṁ diṭṭhi uppajjeyya` — bản nháp đầu dùng *lẽ nào cái ấy mà không chấp thủ…* (`sn24.10:2.4`, 2 khoá); đã đổi sang *còn cái chịu biến hoại ấy mà không chấp thủ…* để khớp `vipariṇāmadhammaṁ` ở `3.3`/`3.13` và với `sn24.37`.
  **Dấu lược và nháy kép.** Pāli của bài cũng lệch `”` một cái (tổng `“` = 14, `”` = 15) vì `…pe…` nuốt nháy đóng. Bản Việt đóng `”` ngay sau `…` ở `1.4`, đóng nháy ngoài ở `2.7`, mở nháy ở `3.1`/`3.4`/`3.14` cho các lời thoại Pāli không đánh dấu; `ngoặc()` của `_hvi.py` báo cân trên cả bài. `2.3`, `2.4`, `2.5`, `3.3`, `3.9`, `3.10`, `3.11`, `3.13` giữ **một** `…`; `Aṭṭhāmasamaṁ.` → *Thứ mười tám.* theo khuôn `Soḷasamaṁ` → *Thứ mười sáu.* (7 khoá) và `Ekūnavīsatimaṁ` → *Thứ mười chín.* (`sn24.37:3.12`).
  `notes` dùng khối literal `|-` thụt 2, đã đọc mẫu đích trước khi ghi. Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` (và `npm run build` vì có bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9.6 chứ không 10.0.
