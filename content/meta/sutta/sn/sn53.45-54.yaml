notes:
  - >-
    Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên **48.784 segment đã `published`**: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Khớp **48.359 / 48.784 = 99,13%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ (`hay` được miễn vì `vā…vā…vā` là cấu trúc).
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Có tiền lệ: `Nīvaraṇavagga` → *4. Phẩm Chướng Ngại* (`sn46.31`, 4 bài) · `Pabbatavagga` → *1. Phẩm Núi* (`sn46.10`) · `Sīlaṭṭhitivagga` → *3. Phẩm Giới Và Trú* (`sn47.27/28`, 2 bài) · `Jarāvagga` (Sn 48) → *5. Phẩm Già* (`sn48.47/48`) · `Sūkarakhatavagga` → *6. Phẩm Núi Khỉ* (`sn48.59`) · `Cāpālavagga` → *1. Phẩm Lá Câu* (`sn51.1`, 4 bài) · `Pāsādakampanavagga` → *2. Phẩm Vui Vẻ* (`sn51.18`) · `Dutiyavagga` → *2. Phẩm Thứ Hai* (`sn11.11` v.v., 76 bài) · `Oghavagga` → *Phẩm Bộc Lưu* (Sn 49 `sn49.45-54`, 2 bài) — **lưu ý** Sn 45 dùng *Phẩm Dây Xích* (9 bài), Sn 46 *Phẩm Dòng Chảy* (1), Sn 48 *Phẩm Bộc Lưu* (1): năm bài `sn47.95-104`, `sn51.77-86`, `sn53.45-54` theo *Bộc Lưu* vì đó là cách đã có tiền lệ cho `ogha`; **người biên tập nên thống nhất toàn bộ Sn 45–49.** · `Puññābhisandavagga` → *4. Phẩm Gặp Gác Công Đức* (`sn55.38`) · `Ekadhammavagga` → *1. Phẩm Một Pháp* (`sn54.2`) · `Rahogatavagga` → *1. Phẩm Ở Riêng* (`sn52.6`) · `Abhisamayavagga` (Sn 56) → *6. Phẩm Chứng Ngộ* (5 bài). **Hai chỗ điểm hoà phải ghi rõ:** `Veḷudvāravagga` — `sn55.2` ghi *1. Phẩm Cổng Tre*, `sn55.9` ghi *1. Phẩm Veḷudvāra*; bài này theo *Veḷudvāra* vì giữ địa danh Pāli như *Devadaha*/*Jambukhādaka*. `Aññatitthiyapeyyālavagga` 0 tiền lệ → *5. Phẩm Chuỗi Lặp Lời Dạy Khác Nhau*.
  - >-
    **merged bundle**. Khung mở đầu giống hệt `sn47.95-104*` và `sn51.77-86*` (thứ ba trong ba biến thể của cùng khung), lần này đáp bằng **bốn tầng thiền**. Cả ba bài dùng chung một uddāna `2.1–2.4`.
  - >-
    Dùng lại nguyên văn đã `published`: khung `uddhambhāgiya` theo `sn48.115-124:1.1–1.5*` · công thức tầng thiền theo `an3.58:4.2*` và `an3.63:6.5–6.6*` — *ly các dục, ly các pháp bất thiện, chứng và an trú thiền thứ nhất, có tầm, có tứ, với hỷ lạc do ly sinh*; *khi tầm và tứ lắng dịu, nội tâm thanh sáng, tâm nhất tâm, không tầm không tứ, có hỷ lạc do định sinh, chứng và an trú thiền thứ hai* · `Yathā maggasaṁyuttaṁ …` → *(Cũng phải giảng giải chi tiết, y như Tương Ưng Đạo Lộ.)*.
  - >-
    0 tiền lệ, đặt mới: `Oghādisutta` → *Bài Từ Bộc Lưu Và Các Bài Sau* (cùng cách, và cùng giải thích, với `sn51.77-86`) · `jhāna` → *tầng thiền* khi đứng một mình trong danh sách bốn tầng (đã xuất bản: `sn45.170:2.8*` *bốn tầng thiền*, `sn53.16` v.v.), nhưng *thiền thứ nhất/hai/ba/tư* khi đánh số từng tầng (`sn28.1–9*`, `sn40.3–7*` của lát trước) — phân biệt này là chủ đích, không phải lệch.
  - >-
    Lượt review đối kháng: `1.9/1.10` Pāli chỉ còn `tatiyaṁ jhānaṁ …pe…` và `catutthaṁ jhānaṁ upasampajja viharati.` (động từ `upasampajja viharati` **không** có trong `1.9`, chỉ có trong `1.10`) — bản Việt phải cân đối; đã viết *chứng và an trú* ở cả hai vì đó là phần lược bắt buộc để câu đọc được, và ghi lại đây là chỗ lược che mất động từ.
  - >-
    Bất định đã ghi: `1.11` kết `…bhāvetabbā”ti vitthāretabbaṁ.` — `vitthāretabbaṁ` (phải giảng rộng) đứng **ngoài** dấu `”ti`, nên bản Việt đặt nó ra ngoài: *…bốn tầng thiền này”ti, phải giảng giải chi tiết.*
  - >-
    **Thuật ngữ `oruddhambhāgiyā` — đảo dấu, đã sửa.** `oruddhambhāgiyā` là `o-` phủ định
    của `uddhambhāgiya` "thượng phần", tức **hạ phần**; đây là thuật ngữ cho **năm kiết sử
    hạ phần**. Dòng tổng kết `Khandhā oruddhambhāgiyā(t)nīti` trước đây ghi "thượng phần" /
    "phần trên" / "hạ-thượng phần" — **ngược dấu**. Đã sửa về **hạ phần** và giữ nhịp câu
    của bài. Mẫu đúng đã có sẵn: `sn45.180:3.4` = "uẩn, và hạ phần, là vậy." (khoá đó đã
    đúng, không đụng). Cần phân biệt: `uddhambhāgiyāni` **không** có `o-` nên vẫn là "thượng
    phần" và **không** đụng ở đợt này. Đếm trước khi viết trên toàn tầng: `hạ phần` 93 khoá,
    `thượng phần` 48, `phần trên` 11, `hạ-thượng` 2; Pāli có `oruddhambhāgiyā` ở **10**
    khoá, và sau khi sửa **0** khoá nào còn dịch khác "hạ phần".

