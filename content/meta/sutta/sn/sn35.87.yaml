notes: |-
  Dịch từ Pāli root, đủ 75/75 khoá, thứ tự khoá đúng thứ tự Pāli. Đối chiếu bản Anh Sujato đã ghim, bản Hòa thượng Thích Minh Châu nguyên bài (phần Tra cứu toàn văn, không phân đoạn theo khoá, chỉ đọc đối chiếu nghĩa) và bài song song `mn144` (cùng cảnh Channa, đã `published`).
  **Coverage Anh đo thật trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): Sujato phủ 49/56 = 87,5%** (độc lập). Bảy khoá Sujato để trống (`3.3`, `3.5`, `3.7`, `9.2`, `9.3`, `10.2`, `10.3`) được lớp `english-project` lấp (đã `published`), nên cổng tính cả hai lớp là 56/56 = 100%; phần lấp đó do cùng một nguồn dịch với bản Việt này, không phải bản đọc độc lập. Vượt sàn 0,80, không cần entry trong `reference-gaps.yaml`. Tầng `vietnamese-current` không có cho bài này (SuttaCentral chỉ có Pháp Cú).
  **Dùng lại tiền lệ.** 31 khoá có Pāli trùng nguyên văn một khoá đã dịch trong tầng (kể cả tên phẩm, tên kinh, câu mở đầu và `Catutthaṁ`); 29/31 dùng lại nguyên văn, hầu hết từ `mn144` (`1.2`, `1.4`–`1.6`, `3.10`, `4.3`–`4.5`, `6.1`, `7.3`, `8.3`, `9.3`, `10.3`, `11.1`, `11.3`, `11.9`, `12.1`, `13.2`, `13.4`, `13.6`, `13.7`, `13.10`). Hai khoá còn lại, `11.7` và `11.8`, khác bản `mn144` vì ở `mn144` hai câu này là mệnh đề nối bằng dấu chấm phẩy (viết thường), còn ở đây mỗi câu là một câu riêng (Pāli có `hoti`/dấu chấm), nên mở bằng *Khi* theo `ud8.4:3.4`. Ngoài ra bài còn một nhóm theo `mn144`: `3.1`, `3.9` (khoản đau), `5.1`–`5.8` (không thiếu thức ăn, thuốc men, người chăm sóc) và `13.3`, mà Pāli gần trùng `mn144` và chỉ khác một hai từ (`me`, `sāriputta`, `napi`/`na`, dấu câu).
  **Trùng nguyên văn trong chính bài, 1 nhóm.** `3.3`=`3.5`=`3.7` (Pāli `Na me, āvuso, khamanīyaṁ, na yāpanīyaṁ …pe… no paṭikkamo.`) cùng một bản Việt. `4.1`/`4.6` và `4.2`/`4.7` Pāli trùng nhưng khác dấu nháy mở/đóng, nên bản Việt chỉ khác ở dấu nháy. Không có cặp trùng nào mà bản Việt khác nhau về nội dung.
  **Dấu lược.** `3.3`, `3.5`, `3.7` giữ một `…` giữa câu (*không đủ sức gì … chứ không phải sự thuyên giảm*). `7.1`, `7.2`, `8.1`, `8.2`, `10.1`, `10.2` (Pāli kết bằng `…pe…`) và `9.1`, `9.2` (Pāli kết bằng `…` trần) kết bằng ` …`. Nháy đơn và nháy kép khớp Pāli từng khoá (75/75).
  **Thuật ngữ.** `satthaṁ āharati` → *dùng dao tự vẫn* (`mn144`; tầng: 7 khoá *dùng dao tự vẫn*, 1 *dùng dao tự sát*). `khamanīyaṁ`/`yāpanīyaṁ` → *dễ chịu*/*đủ sức* (theo `mn144:4.3`; Hòa thượng Thích Minh Châu: *kham nhẫn*/*chịu đựng*). `nissita` → *nương tựa*, `calita` → *lay động*, `passaddhi` → *lắng tịnh*, `nati` → *khuynh hướng*, `āgatigati` → *đến và đi*, `cutūpapāta` → *chết đi sinh lại* (theo `mn144:11.3`–`11.8`; `ud8.4` dùng *tử và sinh* ở một khoá). `sādhukaṁ manasi kātabbaṁ` → *khéo tác ý* (119 khoá *khéo tác ý* so với 2 *tác ý kỹ*). `anupavajja`/`saupavajja` → *không đáng trách*/*đáng trách* (theo `mn144`). `ovāda` → *giáo hóa*. `Catutthaṁ` → *Thứ tư* (172 so với 90 *Thứ bốn* trên toàn tầng).
  **Số.** `dve balavanto purisā` = *hai người lực sĩ* (2); `Catutthaṁ` = thứ tư (4). Không có số lớn trong bài.
  **Bất định.** (1) `6.2` `vedissāmā` là ngôi thứ nhất số nhiều (`mn144:8.2` viết `vedissāmī`, số ít); Hòa thượng Thích Minh Châu dịch *chúng ta sẽ biết*, Sujato dịch *I’ll know*; bản này theo Pāli và dịch *chúng ta sẽ biết*, không biến thành *tôi*. (2) `13.5` `pubbavijjanaṁ` (root đã ghim) khác `pubbajiraṁ` ở `mn144:13.5` và Sujato (*Pubbajira*), Hòa thượng Thích Minh Châu viết *Pubbavijjhamam*; bản này giữ nguyên dạng Pāli đã ghim, *Pubbavijjana*. (3) `13.6`, `13.7` `upavajjakulāni`: tiền lệ `mn144` dịch *gia đình thường lui tới*; Hòa thượng Thích Minh Châu dịch *gia đình có lỗi* (chơi chữ với `saupavajja` ở `13.8`–`13.9`). Bản này giữ cách dịch của `mn144` và không giải nghĩa vào thân kinh; chơi chữ với `upavajja` không hiện ra trong tiếng Việt. (4) `13.9` `tañca kāyaṁ` (*thân ấy*) khác `imañca kāyaṁ` ở `mn144:13.9` (*thân này*) và Sujato (*this body*); chọn *thân ấy* bám Pāli, không đổi nghĩa. (5) `1.3` Pāli có `yena` thừa (`Tena kho pana samayena yena āyasmā channo …`), không dịch, giống `mn144:3.1`. (6) `3.2`, `3.4`, `3.6`, `3.8` Pāli không có `me`/`sāriputta` như `mn144:5.2`–`5.8`; bản này bỏ đại từ sở hữu *tôi* cho các câu so sánh, không thêm gì ngoài Pāli (Sujato thêm *my*). (7) `7.1`, `7.2`, `7.3` thêm *không* sau câu trích để giữ nghĩa câu hỏi có/không (Pāli chỉ có `samanupassasi`); `9.1`–`9.3` Pāli kết `…`/`?` nên giữ nguyên. (8) `13.11`–`13.12` Pāli ngắt khoá ở dấu `—`; bản Việt giữ ` —` ở `13.11` và mở `13.12` bằng chữ thường.
  **Lỗi bản nháp đã bắt.** Bản nháp đầu thiếu dấu nháy mở ở `13.5` (Pāli có `“`); đã sửa, nháy khớp 75/75. Bản nháp đầu dịch `6.2` *tôi sẽ biết* theo `mn144`; đo lại thì Pāli ở đây là số nhiều và Hòa thượng Thích Minh Châu dịch *chúng ta*, nên đã đổi. Đã in lại 75 cặp Pāli↔Việt để đọc đối kháng; không thấy khoá bị cắt lệch.
  **Cổng kỹ thuật.** Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lát này (do người điều phối chạy), nên `technical_integrity` đặt 9.6 chứ không 10.0.
