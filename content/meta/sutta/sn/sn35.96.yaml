notes: |-
  Dịch từ Pāli root, có đối chiếu tầng Anh đã ghim.

  **Coverage.** 21 segment Pāli có nội dung, Sujato phủ đủ 21 ⇒ 21/21 = 1,0000; không cần entry trong
  `content/meta/reference-gaps.yaml`, và không có lớp lấp `english-project` cho bài này nên coverage
  không dựa vào bản dịch Anh của chính dự án.

  **Pāli trùng nguyên văn: 7 khoá, 307 cặp; dùng lại y nguyên văn cả 7, không lệch chỗ nào.**
  Bốn khoá lặp nguyên văn trong bài cũng dùng lại y nguyên văn của chính khoá đó: `1.5`/`2.3`,
  `1.6`/`2.4`, `1.4`/`3.2`, `2.1`/`4.1`, `2.2`/`4.2`.

  **Ba thuật ngữ không có tiền lệ nào trong tầng Việt — đã đo là 0, ghi rõ lý do đặt.**
    - `abhibhāyatana` / `abhibhāyatanāni` → **phạm vi thắng trị**. `abhibhāya` là *chinh phục*, `āyatana`
      là *căn / phạm vi*; Sujato dịch *field of mastery*. Chọn *phạm vi* vì *căn* trong tiếng Việt đã bị
      dùng cho `indriya` và sẽ lẫn với *tứ chánh trừng phạt* ở `sn47.12:6.9`. 0 tiền lệ nên đây là
      lựa chọn của người dịch, và là lý do `ambiguity_integrity` ở 8,9.
    - `parihāna` / `aparihāna` → **thoái trào / không thoái trào**. Tiêu đề `0.3` cũng đặt theo đó;
      0 tiền lệ trong kho (chuỗi `thoái trào` đo được = 0).
    - `sarasaṅkappā saṁyojaniyā` → **ý chí siết chặt sợi trói buộc**. Đo `sarasaṅkappā` trong toàn tầng
      Việt được 0 khoá, nên không có cách dịch sẵn để theo; chọn theo Sujato (*thoughts that tighten
      the fetters*), ghép `ý chí` (42 lần) + `siết chặt` (8) + `trói buộc` (741).

  **Một chỗ cố ý KHÔNG mở rộng, theo luật 10.1 của brief.** Ở `2.1` và `4.1`, Pāli là `jivhāya rasaṁ
  sāyitvā uppajjanti …pe…`: động từ `uppajjanti` có tân ngữ bị `…pe…` nuốt mất (nghe, ngửi, nếm, sờ —
  Sujato mở đủ cả bốn). Bản Việt vì vậy là *khi vị tỳ-kheo nếm vị bằng lưỡi, các pháp ấy khởi lên …*,
  với **một** dấu lược. *Các pháp ấy* là dấu trùng lặp chỉ tới danh sách đã nêu ở `1.4`, đánh dấu rõ
  bằng cách lặp; đây là chỗ duy nhất trong lát phải chèn một từ nối, và ghi ra đây để người biên tập
  phán nếu thấy không cần.

  **Dấu lược và nháy kép.** `…pe…` ở `1.7`, `2.1`, `3.5`, `4.1`, `5.5` và các dấu lược rời ở `1.7`,
  `3.5`, `5.5` đều giữ đúng số lượng Pāli. Nháy kép: Pāli mở `“` ở `1.1` và đóng `”` ở `5.10`, bản Việt
  giữ nguyên; các cặp `‘…’` ở `1.6`/`1.7`, `2.4`/`2.5`, `3.4`/`3.5`, `4.4`/`4.5`, `5.4`/`5.5`,
  `5.8`/`5.9` cũng theo Pāli; `ngoặc()` báo cân.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`, và `npm run build` vì bài sẽ `published`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
