  **Pāli trùng nguyên văn: 7 khoá, 307 cặp; dùng lại y nguyên văn cả 7, không lệch chỗ nào.**
  Bốn khoá lặp nguyên văn trong bài cũng dùng lại y nguyên văn của chính khoá đó: `1.5`/`2.3`,
  `1.6`/`2.4`, `1.4`/`3.2`, `2.1`/`4.1`, `2.2`/`4.2`.

  **Ba thuật ngữ không có tiền lệ nào trong tầng Việt — đã đo là 0, ghi rõ lý do đặt.**
    - `abhibhāyatana` / `abhibhāyatanāni` → **phạm vi thắng trị**. `abhibhāya` là *chinh phục*, `āyatana`
      là *căn / phạm vi*; Sujato dịch *field of mastery*. Chọn *phạm vi* vì *căn* trong tiếng Việt đã bị
      dùng cho `indriya` và sẽ lẫn với *tứ chánh trừng phạt* ở `sn47.12:6.9`. 0 tiền lệ nên đây là
      lựa chọn của người dịch, và là lý do `ambiguity_integrity` ở 8,9.
    - `parihāna` / `aparihāna` → **thoái trào / không thoái trào**. Tiêu đề `0.3` cũng đặt theo đó;
      0 tiền lệ trong kho (chuỗi `thoái trào` đo được = 0).
    - `sarasaṅkappā saṁyojaniyā` → **ý chí siết chặt sợi trói buộc**. Đo `sarasaṅkappā` trong toàn tầng
      Việt được 0 khoá, nên không có cách dịch sẵn để theo; chọn theo Sujato (*thoughts that tighten
      the fetters*), ghép `ý chí` (42 lần) + `siết chặt` (8) + `trói buộc` (741).

  **Một chỗ cố ý KHÔNG mở rộng, theo luật 10.1 của brief.** Ở `2.1` và `4.1`, Pāli là `jivhāya rasaṁ
  sāyitvā uppajjanti …pe…`: động từ `uppajjanti` có tân ngữ bị `…pe…` nuốt mất (nghe, ngửi, nếm, sờ —
  Sujato mở đủ cả bốn). Bản Việt vì vậy là *khi vị tỳ-kheo nếm vị bằng lưỡi, các pháp ấy khởi lên …*,
  với **một** dấu lược. *Các pháp ấy* là dấu trùng lặp chỉ tới danh sách đã nêu ở `1.4`, đánh dấu rõ
  bằng cách lặp; đây là chỗ duy nhất trong lát phải chèn một từ nối, và ghi ra đây để người biên tập
  phán nếu thấy không cần.

  **Dấu lược và nháy kép.** `…pe…` ở `1.7`, `2.1`, `3.5`, `4.1`, `5.5` và các dấu lược rời ở `1.7`,
  `3.5`, `5.5` đều giữ đúng số lượng Pāli. Nháy kép: Pāli mở `“` ở `1.1` và đóng `”` ở `5.10`, bản Việt
  giữ nguyên; các cặp `‘…’` ở `1.6`/`1.7`, `2.4`/`2.5`, `3.4`/`3.5`, `4.4`/`4.5`, `5.4`/`5.5`,
  `5.8`/`5.9` cũng theo Pāli; `ngoặc()` báo cân.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`, và `npm run build` vì bài sẽ `published`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.

  **Lượt cải thiện 2026-10-14.** Đọc đối kháng cả 38 khoá, đo lại tiền lệ trên toàn tầng; ba khẳng định "0 tiền lệ" ở mục thuật ngữ phía trên **sai** và được đính chính ở đây. Đổi 27 khoá, giữ nguyên tập khoá và thứ tự.
    - `sarasaṅkappā saṁyojaniyā`: tiền lệ **có**, ở `mnd1`, `mnd14`, `mnd16`, `cnd23` (*hồi ức và ý định có tính trói buộc*), `mn119`/`mn66`/`sn54.8` (*hồi ức*, *ý nghĩ*) và `sn35.244` (cùng Pāli, không có `dhammā`: dịch trực tiếp *ức niệm và tư duy ác, bất thiện, trói buộc vào kiết sử*). Đổi *ký ức và ý chí siết chặt sợi trói buộc* thành *hồi ức và ý định … có tính trói buộc* ở `1.4`, `2.2`, `3.2`, `4.2`, `5.2`, `5.6`. Ở `1.4`/`2.2`/`3.2`/`4.2`/`5.2` Pāli **không** có `dhammā`, nên bỏ *các pháp* đã chèn và để *ác, bất thiện, có tính trói buộc* làm tính từ của *hồi ức và ý định*; riêng `5.6` Pāli có `dhammā` nên giữ dạng *các pháp ác, bất thiện …: những hồi ức và ý định …*. Thứ tự *ác, bất thiện* theo đa số của tầng thay cho *bất thiện xấu xa*. (terminology, semantic_fidelity)
    - `abhibhāyatana`: tiền lệ **66** khoá dùng *thắng xứ* (`dn34` và các bài khác), **0** khoá dùng *phạm vi thắng trị*. Đổi sang *thắng xứ* ở `1.1`, `5.1`, `5.5`, `5.9`, `5.10`; `abhibhūtametaṁ āyatanaṁ` ở `5.4`/`5.8` thành *xứ này đã bị chế ngự* (`abhibhūta` → *chế ngự* 19 khoá, `āyatana` → *xứ*). (terminology)
    - Công thức `adhivāseti nappajahati na vinodeti na byantīkaroti na anabhāvaṁ gameti`: *dung túng* và *phá bỏ*/*quét sạch* lệch tầng (`pajahati` → *từ bỏ* ở 36/36 khoá có công thức; `adhivāseti` → *chịu đựng* ở 8 khoá, kể cả `an4.11` và `iti110` cùng công thức). Đổi ở `1.5`, `2.3`, `3.3`, `4.3` thành *chịu đựng chúng, không từ bỏ, không trừ diệt, không làm cho tiêu tan, không đưa đến không còn* và dạng phủ định tương ứng. (terminology)
    - Hô cách `bhikkhave` trong `veditabbametaṁ, bhikkhave, bhikkhunā` bị bỏ sót ở `1.5`, `2.3`, `3.3`, `4.3`, `5.3`, `5.7`; đã khôi phục *này các tỳ-kheo*. `Parihānaṁ`/`aparihānaṁ` (danh từ, không có `dhamma`) ở `1.7`, `2.5`, `3.5`, `4.5` đổi *pháp thoái trào* thành *sự thoái trào*; `parihānadhammo hoti` ở `2.6`/`4.6` đổi câu gượng *Đó là cách gọi là …* thành *Như vậy, này các tỳ-kheo, là pháp …*; `5.1` bỏ *… nào* gượng. (semantic_fidelity, vietnamese_clarity)
    - `1.1`: *ta* viết hoa thành *Ta* (Đức Phật tự xưng; 166 khoá viết hoa, 44 viết thường ở mở đầu *Này các tỳ-kheo, Ta …*). *Nhìn thấy sắc bằng con mắt* thành *thấy sắc bằng mắt* (83 khoá so với 4); *nhận biết một pháp bằng tâm* thành *biết pháp bằng ý* (41 so với 3); thêm *ở đây* cho `idha`; `2.1`/`4.1` thay *các pháp ấy* bằng *chúng*. `1.7` và `3.5` kết ` ….` theo Pāli `…pe….`. (terminology, clarity)
    - Điểm: `semantic_fidelity` 9,3 → 9,4; `terminology` 9,2 → 9,0 (điểm cũ dựa trên khẳng định tiền lệ bằng 0 là sai; sau khi sửa còn hai chỗ lệch đa số, xem dưới); `vietnamese_clarity` 9,3 → 9,4; `ambiguity_integrity` 8,9 → 9,1 (hai trong ba bất định cũ đã được phân xử bằng tiền lệ); còn lại giữ nguyên. `final_score` 9,41 → 9,43.
    - **Bất định còn lại, cố ý không đổi.** (1) `parihānadhammo` → *pháp thoái trào*: tiền lệ của tầng nghiêng về *suy giảm* (10 khoá) so với *thoái trào* (2 khoá, đều ở bài này); giữ vì tiêu đề `0.3` và vế tóm tắt ở `sn35.103:6.1` đã dùng *thoái trào*, đổi phải đổi cả hai nơi ngoài phạm vi. (2) `parihāyāmi kusalehi dhammehi` → *thoái đoạn* ở `1.6`, `2.4`, `3.4`, `4.4`: tầng chưa thống nhất (*thoái đoạn* 8 khoá ở `an4.158` và bài này, *thoái đọa* ở `sn35.98`, *thoái lui* ở `an6.21`, *suy giảm* ở nhiều bài khác); giữ theo bài song song gần nhất `an4.158`. (3) `2.1`/`4.1`: `…pe…` nuốt cả tân ngữ của `uppajjanti`; *chúng* quy về `1.4`, một lựa chọn của người dịch.
