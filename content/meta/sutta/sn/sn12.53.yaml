  **DÙNG LẠI NGUYÊN VĂN, đo được 30/32 khoá** — trong đó **5 khoá lặp nguyên văn trong
  chính bài**: `2.5`–`2.9` lặp hệt `1.3`–`1.7`, và `4.1` lặp `2.1`. Mười khoá lặp
  nguyên văn **với bài khác đã `published`**:
  · `0.2` trùng 9 khoá → *6. Phẩm Khổ* (**8** khoá cùng cách).
  · `1.1` trùng **160** khoá → *Trú ở Sāvatthī.* (**84**).
  · `1.2` trùng `sn12.57:1.2` → *“Này các tỳ-kheo, sống quán vị ngọt trong các pháp có
    tính trói buộc, tham ái tăng trưởng.* (`2.4` dùng lại `sn12.57:2.4`).
  · `1.3`–`1.7` trùng `sn12.60:3.2`–`3.6` — cả xích `taṇhā → upādāna → bhava → jāti →
    jarāmaraṇa…` lấy nguyên văn của bài anh em cùng phẩm.
  · `2.1`, `2.2`, `2.3` trùng `sn12.54:2.1`, `sn12.54:1.3`, `sn12.54:1.4` — cả ẩn dụ ngọn
    đèn dầu. `4.2`, `4.3` trùng `sn12.54:2.2`, `sn12.54:2.3`.
  · `3.1` trùng `sn12.57:3.1`; `4.4` trùng `sn12.57:4.5` → *Cũng vậy, này các tỳ-kheo,
    sống quán sự nguy hại trong các pháp có tính trói buộc, tham ái đoạn diệt.*
  · `3.2`–`3.6` trùng `sn12.60:5.2` và `sn12.60:6.9`–`6.12` — xích `nirodha`.
  · `4.5` trùng `sn12.57:4.6` → *Do ái diệt nên thủ diệt …*.
  · `4.7` trùng **287** khoá → *Thứ ba.* (**256**).
  Hai khoá phải dịch mới: `0.1` (dòng tên bộ, giữ nguyên như mọi tệp khác của tầng) và
  `0.3` (tên bài).
  
  **Thuật ngữ, kèm số đếm toàn tầng 5.350 tệp Việt:** `saṁyojana` → *trói buộc*
  (**881** khoá) chứ không phải *kết trói* (**3** khoá, chỉ ở `an4.88`, `an4.131`,
  `an10.13`) và không phải *chấp thủ* — xem cảnh báo bên dưới về `sn12.54`.
  `assādānupassino` → *sống quán vị ngọt* (**6** khoá, đều ở `sn12.57`/`sn12.60` hai bài
  anh em cùng phẩm) thay vì *sự thú vị* (**44**), vì *sự thú vị* là cách dịch
  `assāda` trong `sn12.52`/`sn12.54` theo đường *đáng chấp thủ* (**16**); hai con đường dịch
  đang cùng tồn tại trong tầng, tôi theo con đường **giữ nguyên `dhammesu có tính trói
  buộc`** của `sn12.57`/`sn12.60` vì nó giữ cả hai vế *saṁyojaniya* và *assāda*.
  `ādīnavānupassino` → *sống quán sự nguy hại* (*sự nguy hại* **129** khoá so với *sự bất
  lợi* **24**). `paccayā` → *làm duyên nên có* (**90** khoá) thay vì *làm điều kiện, sinh
  khởi* (**54**). `telappadīpo` → *đèn dầu* (**59** khoá), `vaṭṭi` → *bấc dầu* (**4**),
  `āsiñceyya` → *rót dầu* (**2**). `nibbāyeyya` → *tắt dần*; đây là chỗ lệch đáng nói:
  toàn tầng *tắt lịm* **41** khoá và *tắt dần* chỉ **3**, nhưng trong ba khoá trùng
  nguyên văn `Evañhi so… nibbāyeyya` thì chỉ `sn12.54:2.3` có bản Việt và nó dùng *tắt
  dần*, nên tôi theo nguyên văn bài anh em. `taṇhā` → *ái*; `upādāna` → *thủ* trong
  xích `paccayā` (theo `sn12.60`) dù tầng còn dùng *chấp thủ* ở ngữ cảnh khác.
  `dukkakkhandha` → *khối khổ đau* (**31** khoá).
  
  **Cảnh báo cho người biên tập — `0.3`, tên bài.** `Saṁyojanasutta` trùng nguyên văn ở
  **7** khoá 0.3 của bài khác, nhưng **mỗi bài một cách khác nhau**: *Kinh Các Kết Trói*
  (`an4.88`), *Kinh Các Kết Trói Thứ Hai* (`an4.131`), *Kinh Bảy Sự Trói Buộc*
  (`an7.8`), *Kinh Kết Trói Buộc* (`an10.13`), *Kinh Kiết Sử* (`sn1.64`), *Kinh Về Sự
  Trói Buộc* (`sn41.1`), *Kinh Năm Căn Trừ Sự Trói Buộc* (`sn48.61`). Tôi đặt **Kinh Sự
  Trói Buộc** vì *trói buộc* là đa số đo được (**881** khoá). **Lệch này không chỉ ở tôi:**
  bài anh em ngay số `sn12.54` (`Dutiyasaṁyojanasutta`) đã dịch là *Kinh Sự Chấp Thủ
  (Hai)*, trùng với `sn12.52` (`Upādānasutta` = *Kinh Sự Chấp Thủ*) — hai Pāli khác nhau
  bị dịch thành một tên. Tôi **không sửa `sn12.54`** (ngoài lát của tôi); đề nghị người
  điều phối đổi `sn12.54:0.3` cho khớp `sn12.53:0.3`.
  
  **Bất định đã ghi, không che:** `4.3` `purimassa ca upādānassa pariyādānā aññassa ca
  anupahārā anāhāro nibbāyeyya` có **ba** vế trong Pāli (chất cũ hết · không tiếp thêm ·
  không được nuôi) nhưng nguyên văn `sn12.54:2.3` đã `published` chỉ nói **hai**
  (*do sự diệt tận của chất cháy cũ, do sự tiêu tán của dầu*) và bỏ vế `anāhāro`; tôi
  theo nguyên văn bài anh em vì Pāli trùng nguyên văn, nhưng ghi lại đây. Nếu người biên
  tập muốn đủ ba vế thì `sn12.52:4.3` (*thiếu thức ăn*) là cách đã có sẵn trong cùng
  phẩm. `3.6` `Evametassa … nirodho hoti.` không có dấu đóng nháy ở Pāli (chỉ `4.6` mới
  có), nên `3.6` không mở nháy — đúng cấu trúc SuttaCentral.
  
  **Dấu lược:** `4.5` giữ **đúng một** `…` cho `…pe…` của Pāli, không mở rộng. Bài này
  không có `…` trần nào, và bản Việt cũng không thêm. Không có `(…)` đứng một mình. Ngoặc
  kép cân trên cả bài: mở ở `1.2`, đóng ở `4.6`.
  
