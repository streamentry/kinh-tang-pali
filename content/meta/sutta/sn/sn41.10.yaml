notes: |-
  Dịch từ Pāli root; đối chiếu bản Anh Bhikkhu Sujato ở commit đã ghim. Coverage Anh 29/29 đoạn Pāli có nội dung = 100%, nhưng hai đoạn chỉ có chữ Anh nhờ tầng english-project của chính dự án, và tầng đó đang published với cùng người chấm (OpenCode Space Bunny Free (agent)) — bản lấp không phải lớp Anh độc lập, nên triangulation chỉ 9.0 và scorecard không tuyên bố đã đối chiếu English cho hai đoạn ấy.
    Tầng Việt hiện hành không có bài này: translation/vi/phantuananh/ ở commit đã ghim
    chỉ chứa 26 chương Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu
    thuật ngữ; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo.
    budsas.org chỉ là tra cứu toàn văn, không cấp text cho tầng nào.
  Bài này có 5.6 cùng chữ là 4.5, và nó là bài cuối của Phẩm Tâm nên có uddāna.
  Dùng lại nguyên văn tiền lệ có số đếm. (1) 3.4 và 3.6 có Pāli *trùng nguyên văn* với sn55.1:2.3 và :2.5 (đối chiếu từng khoá bằng script), nên dùng lại đúng câu đã dịch: *Đức Thế Tôn ấy quả thật là bậc A-la-hán, Chánh Đẳng Giác, Minh Hạnh Túc, Thiện Thệ, Thế Gian Giải, Vô Thượng Sĩ, Điều Ngự Trượng Phu, Thầy của chư thiên và loài người, Phật, Thế Tôn* và *Pháp được Đức Phật thuyết giảng hay, hiện tại thấy ngay, không thời hạn, mời gọi đến chứng nghiệm, hướng dẫn đi lên, đáng để những bậc trí tự mình nhận biết*. (2) 3.8 cùng công thức với sn55.1:2.7, chỉ khác một dấu gạch nối trong Pāli, nên cũng dùng lại nguyên văn: *Tăng đoàn đệ tử của Đức Thế Tôn thực hành tốt đẹp, thực hành ngay thẳng, thực hành đúng chánh đạo, thực hành đúng phép tắc, tức là bốn cặp người, tám hạng cá nhân; … đáng được hiến dâng, đáng được tiếp đón, đáng được cúng dường, đáng được chắp tay lễ kính, là phước điền vô thượng của thế gian*. Riêng aveccappasādena samannāgatā ở 3.3/3.5/3.7 có Pāli hơi khác sn55.1 (samannāgato hoti thay cho bhavissāma) nên tôi dùng *chúng ta sẽ đầy đủ tín bất động đối với …* để giữ cùng một cách diễn đạt trong cùng một bài.
  Danh sách các vị thần ārāmadevatā vanadevatā rukkhadevatā osadhitiṇavanappatīsu adhivatthā devatā dịch *các vị thần ở vườn, rừng, cây cối, dược thảo, cỏ và cây lớn* — nguyên văn mn45:4.4 và :4.10, đã có sẵn trong tầng; dùng lại ở cả sáu lần xuất hiện trong bài. mittāmaccā ñātisālohitā → *bạn, đồng nghiệp, thân quyến* theo một tiền lệ trong tầng.
  Uddāna 4.1–4.4 dịch từ danh sách tên bài thật của phẩm, tra trong chính các tệp Pāli sn41.1–41.10 rồi theo đúng tên đã dịch: sn41.1 Saṃyojanasutta → *Sự trói buộc* (theo sn41.1:0.3 đã có); hai bài Isidatta; sn41.4 Mahākapāṭihāriyasutta mà uddāna gọi tắt là *Mahāko*; sn41.5–6 Kāmabhūpi → *Kāmabhū*, chữ lặp -pi dịch bằng *lẫn*; sn41.7 Godatta; sn41.8 Nigaṇṭhanāṭaputtasutta mà uddāna gọi tắt là *Nigaṇṭho*; sn41.9 Acelakassapasutta mà uddāna gọi tắt là *Acela*; và các bài thăm người bệnh. 3.12 Cittavaggo paṭhamo → *Phẩm Tâm, thứ nhất.* theo tiền lệ của các phẩm khác; 4.0 → *Tóm lược:* (180 tiền lệ); 4.5 Cittasaṁyuttaṁ samattaṁ → *Tương Ưng Citta đã hoàn tất.* theo dãy tiền lệ của các bài cuối phẩm.
  Bất định đã ghi. (1) paṇidhehi → *phát nguyện* và cetopaṇidhi → *tâm ông phát nguyện*: cetopaṇidhi là tâm nguyện, dịch theo nghĩa; không có tiền lệ cho cụm này trong kho. (2) anāgatamaddhānaṁ → *trong tương lai*; đây là *thời gian ở gần phía sau*, dịch theo ngữ cảnh vì các vị thần nói về kiếp sau. (3) rājā assaṁ cakkavattī → *thành vua chuyển pháp luân*, theo 16 tiền lệ *chuyển pháp luân vô thượng* cho cakkavattī trong tầng. (4) dhammiko dhammikaṁ phalaṁ anupassatī → *vua đúng pháp, người hành xử đúng pháp, người trao tặng đúng pháp*; phalaṁ ở đây là lợi ích ban cho người khác, dịch *trao tặng*.
  Lỗi lặp mà lượt review đối kháng bắt được và đã sửa: bản nháp đầu lặp chữ ở 2.15 và 2.19 (Các vị các vị thần…), vì cụm tiếng Việt đã có sẵn tiểu từ *các vị* mà khuôn lại thêm một *các vị* nữa; bản nay chỉ một.
  Dấu lược: 2.12 có …pe… giữ đúng một dấu, đếm lại từng khoá, không khoá nào lệch.
