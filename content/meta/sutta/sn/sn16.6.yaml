notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim. Coverage English tính bằng công thức `isSubstantive` = **25/26** khoá Pāli có nội dung = **0,962**, trên ngưỡng 0,8. Khoá trống duy nhất là `6.2` (Sujato để trống ở `“See who can speak more…”`). Tầng `vietnamese-current` không có cho bài này.
  TRIANGULATION KHÔNG ĐỘC LẬP Ở MỘT KHOÁ: khoá `6.2` chỉ có tiếng Anh từ lớp lấp `content/translation/en/project/sutta/sn/sn16.6_translation-en-project.json`, cùng tác giả với bản Việt này, và lớp lấp đó chưa có scorecard nên không được tính vào coverage. Tiêu chí 6 đặt 8,8 và bài này **không** tuyên bố đã đối chiếu English cho toàn bài.
  Bài song parallel `sn16.8` (đã có) dùng lại nguyên văn: **12** khoá Pāli trùng nguyên văn, **11** dùng lại y nguyên văn — `0.2` (4 khoá) · `1.2` · `1.3` · `1.4` · `1.6` · `3.3`/`3.5` (`ud3.3`, khác ở chỗ thêm `ti` theo Pāli bài này) · `3.1` (3 khoá) · `4.4` · `4.8` (35 khoá) · `6.5`. Tổng lát c37: 127 cặp trùng Pāli, 121 dùng lại nguyên văn.
  `accaya` dịch là **lỗi lầm**, không phải thứ bậc — đây là chỗ dễ làm sai nhất của bài. Căn cứ: tiền lệ `an2.21:1.3` đã dịch `yo ca accayaṁ accayato na passati` thành *kẻ không nhận ra lỗi lầm của mình*, và toàn bộ ngữ cảnh ở đây là hai tỳ-kheo thú tội vì đua nhau học thuật rồi xin nhận lỗi. `accayaṁ accayato paṭiggaṇhātu` (5.4, 6.3) → *nhận lỗi lầm ấy đúng như nó là*; `yo accayaṁ accayato disvā yathādhammaṁ paṭikaroti` (6.4) → *ai nhận ra lỗi lầm của mình đúng như nó là, xử lý đúng pháp*.
  Không thêm ý vào chỗ dễ dịch quá. `kiṁ jānantā kiṁ passantā` (4.9) là câu hỏi tu từ đầy ý trách: **biết và thấy điều gì** mà lại đua nhau thế — không dịch thành một mệnh đề khẳng định. `moghapurisā` → *kẻ ngu bạo* (18 khoá; *kẻ ngu si* 30 nhưng ở đây Sujato dịch *futile men*, nên *ngu bạo* sát hơn).
  0 tiền lệ, đặt mới, ghi kèm lý do: cụm `‘ehi, bhikkhu, ko bahutaraṁ bhāsissati, ko sundarataraṁ bhāsissati, ko cirataraṁ bhāsissatī’` xuất hiện **11 lần trong chính bài này** và không có bản Việt nào ở nơi khác ⇒ dịch **một lần rồi dùng lại y nguyên văn cho cả 11**, kể cả chỗ không có `“`; vi phạm chính cái bẫy BRIEF_VI §10.1 nếu mỗi khoá một kiểu. · `saddhivihāri` → *đệ tử* (tiền lệ `sn21.12` *các đệ tử của Tôn giả Mahākappina*) · `svākkhāte dhammavinaye` → *Pháp và Luật được khéo thuyết giảng* (`sn4.22`) · `dovacassakaraṇehi dhammehi` → *đầy đủ các pháp làm cho khó khuyên dạy* (theo `sn16.8:2.1`).
  Dấu lược: Pāli bài này không có `…pe…` nào, bản Việt cũng không dùng `…` để nén.
  `notes` ở đây là khối literal `|-` thụt 2 đặt ở GỐC file, đúng như `content/meta/sutta/sn/sn24.45.yaml` (đã đọc mẫu đích trước khi ghi).
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy — lát agent này không chạy bốn lệnh đó, nên `technical_integrity` đặt 9.6 chứ không 10.0. Tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài.
