notes:
  - >-
    Tên bài `Lokacintāsutta` → *Kinh Suy Nghĩ Về Thế Giới*, theo `sn56.8:0.3` *Kinh Suy Nghĩ* và cách dùng `cintā` = *suy nghĩ* của `sn56.8:2.1` và `sn56.10:2.1`. Tên phẩm `Papātavagga` → *5. Phẩm Núi Sụp* khớp Pāli tuyệt đối với `sn56.42:0.2` và `sn56.43:0.2`.
  - >-
    **10 khoá có Pāli trùng nguyên văn và dùng lại nguyên văn** (đo bằng script, đã loại lát này khỏi chỉ mục): `0.2` (tên phẩm) · `1.1` ← `an4.183:1.1` (*Một thời, Đức Phật ở Rājagaha, trong vườn tre, nơi đàn sóc ăn.*) · `1.2` ← `dn16:2.12.1` (*Ở đó, Đức Thế Tôn bảo các tỳ-kheo:*) · `1.5` ← `dn23:21.9` (*Trông thấy, y nghĩ:*) · `3.3` ← `sn11.4:1.7` (*chư thiên chiến thắng, các A-tu-la bại trận*) · `4.2` ← `sn56.8:1.2` (danh sách mười hai phán đoán, nguyên văn) · `4.3` ← `dn14:1.27.3` (*Vì lý do gì?*) · `5.2` ← `dn14:1.27.3` · `6.1` ← `sn56.10:3.1` · `6.2` ← `an10.101:2.4` (*Thứ nhất.*). `4.4` cùng công thức với `sn56.8:1.4` nhưng **không** trùng byte (viết hoa `Này` ở đầu câu).
  - >-
    Cả khung `4.1–6.1` bám sát `sn56.8` và `sn56.10` (cùng `Ādīnavagga`): `mā lokacintaṁ cintetha` → *đừng suy nghĩ về thế giới* · `Taṁ kissa hetu?` → *Vì lý do gì?* · `atthasaṁhitā nādibrahmacariyakā` → *có lợi ích, không phải khởi đầu Phạm hạnh* · `nibbidāya virāgāya nirodhāya upasamāya abhiññāya sambodhāya nibbānāya` → *chán nản, ly tham, diệt tận, chân nhận, chứng ngộ, Niết-bàn* (nguyên văn `sn56.8:1.4`) · `yogo karaṇīyo` → *thì cần gắng sức* (nguyên văn `sn56.10:3.1`).
  - >-
    Bất định đã ghi: (a) `ummatta` / `viceto` — Sujato dịch *gone mad* / *lost my mind*; chọn *mất trí* và *lạc lống thế* để hai từ Pāli khác nhau không bị lặp thành một. Có thể đọc *điên* / *mất trí* cũng được; người biên tập nên thống nhất với `sn56.*` khác. (b) `caturaṅginī senā` → *đạo quân bốn cánh*; 0 tiền lệ cho cụm này, tiền lệ chỉ có *đạo quân* cho `senā` (`dn`/`sn`, 8 lần). (c) `bhisamuḷālaṁ` → *xuyên qua ống sen*; 0 tiền lệ, nhưng `pokkharaṇī` = *hồ sen* có tiền lệ và `muḷāla` là lỗi xuyên qua khe hẹn. (d) `devānaṁyeva mohayamānā` → *chỉ để mê hoặc chư thiên*; giữ đúng mục đích (đánh lừa), không dịch thành *đánh nhau*. (e) `bhūtaṁyeva addasa, no abhūtaṁ` → *đã thấy đúng là có thật, không phải điều không có*; đây là điểm quan trọng của bài nên giữ rõ hai vế.
  - >-
    Cấu trúc nháy kép: `1.3` mở → `6.1` đóng `”ti.`, đúng như Pāli (lời Đức Thế Tôn chạy suốt từ `1.3`). Cân trên toàn bài 34 khoá.
  - >-
    Quy tắc dấu lược của BRIEF_VI3 §10: mọi khoá Pāli có `…pe…` hoặc `…` đều giữ **đúng một** `…`, không mở rộng; không khoá nào nén bằng `…` cả khi Pāli viết đủ. Đã đếm từng khoá. Coverage Anh đo được: 23/23 = 100%
  - >-
    Tầng `vietnamese-current` vắng: tại commit đã ghim, bilara chỉ có Pháp Cú cho tiếng Việt, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Ba tầng tham khảo còn lại là Pāli root (authority) + `english-sujato` đã ghim + `english-project` (lớp lấp của chính dự án, chỉ tính khi `published`).
  - >-
    Bốn cổng kỹ thuật của AGENTS.md: `npm run validate`, `npm test`, `npm run check` và `npm run build`. **Agent lát này KHÔNG chạy bốn lệnh đó** — BRIEF_VI3 §7 và lệnh của người điều phối cấm chạy `npm run validate|test|build|check`. Những gì đã chạy và xanh: `_hvi.py` (`save_vi` → `kiểm`) cho cả 9 bài — đủ khoá trong `all`, không thừa, NFC, không trùng nguyên văn Pāli (trừ 0.1 theo quy ước), không Pāli lọt, số dấu lược khớp từng khoá, nháy kép cân trên cả bài; quét lại 306 khoá bằng script độc lập; `notes` và `blocking_errors` parse sạch bằng thư viện `yaml` của kho. Cổng thật còn lại là CI (`.github/workflows/ci.yml`), nên `technical_integrity` chỉ 9.6 chứ không 10.
