notes:
  - >-
    **Sáu khoá trùng nguyên Pāli với `sn47.14` (đã `published`) — dùng lại nguyên văn bản Việt.** `:6.3`=`:6.7`, `:6.5`=`:6.8`, `:6.9`→`:7.6`, `:7.1`, `:7.7`, và `:6.5/6.6` (cây lớn / đại Tỳ-kheo Tăng). Chỉ đổi *này các tỳ-kheo* → *này Ānanda* cho đúng người nói. Công thức `attadīpā … dhammadīpā` dịch là *tự mình làm hòn đảo, tự mình làm nơi nương tựa, không nương tựa gì khác; lấy Pháp làm hòn đảo, lấy Pháp làm nơi nương tựa, không nương tựa gì khác* — *hòn đảo* đã có 8 nơi trong kho.
  - >-
    **Coverage tầng Anh 28/28 = 1,000, NHƯNG một khoá dựa vào bản lấp của chính dự án.** Sujato để trống `sn47.13:5.3`, `:5.4`, `:5.5`, `:7.8`; trong đó `5.5` là Pāli có nội dung và được `content/translation/en/project/sutta/sn/sn47.13` lấp, tệp đó `status: published` nhưng cùng `assessed_by` (*OpenCode Space Bunny Free (agent)*) — tức KHÔNG phải một lần đọc Anh độc lập. Vì vậy `triangulation` hạ xuống 8,9 và scorecard không tuyên bố đã đối chiếu Anh ở khoá đó.
  - >-
    **Bốn khoá Pāli trùng nguyên văn với bài khác đã dịch, dùng lại nguyên văn.** `:1.1` trùng `mn127:1.2` → *Một thời, Đức Phật ở gần Sāvatthī, tại rừng Jeta, trong tu viện của ông Anāthapiṇḍika.* `:4.5` (`madhurakajāto viya kāyo, disāpi me na pakkhāyanti, dhammāpi maṁ na paṭibhanti`) trùng gần nguyên văn `dn16:2.24.5` → *thân … như bị dược chất làm cho uể oải; các phương hướng … không nhận rõ được; các Pháp không hiện lên trong tâm*. `:6.1` (`Nanu taṁ, ānanda, mayā paṭikacceva akkhātaṁ`) trùng `dn16:3.48.1` → *đã nói sẵn trước rồi sao*.
  - >-
    **Thuật ngữ, có số đếm.** `parinibbāna/parinibbuto` → *viên mãn* (sn=123 an=480 mn=138 kn=68; sn47.14 cũng vậy). `khandha` → *uẩn* (sn=209 mn=193 dn=123) chứ không phải *khối* (sn=59 mn=72); `dn10` đã dịch sẵn *Thánh giới uẩn / Thánh định uẩn / Thánh tuệ uẩn* nên `:5.1` dùng y hệt. `pattacīvara` → *bát và y* (sn=17 mn=57 > *y bát* mn=25). `samaṇuddeso` → *đệ tử tại gia* (sn=1 mn=2). `sabrahmacārī` → *đồng phạm hạnh* (an=141 mn=74). `kāyānupassī …` dùng y hệt `sn47.14:3.2`–`:3.5` (114 cặp *tinh cần, tỉnh giác, có niệm* trong 39 tệp sn), kể cả *sống quán thọ trên các cảm thọ* ở `:7.3`.
  - >-
    **Bất định đã ghi, không giấu.** (a) `:5.6` sáu tính từ `ovādako otiṇṇo viññāpako sandassako samādapako samuttejako sampahaṁsako` dịch *khuyên can, khuyên răn, chỉ bày, khuyến khích, khơi gợi, làm cho vui* — chỉ có `sabrahmacārīnaṁ` có tiền lệ (`mn24:2.5` *đem lại niềm vui cho các vị đồng phạm hạnh*), năm kia không có tiền lệ nào trong kho nên là lựa chọn của lát này. (b) `:5.7` `dhammojaṁ dhammabhogaṁ dhammānuggahaṁ` → *vị ngọt ngào của giáo pháp, sự giàu có của giáo pháp, sự trợ giúp của giáo pháp* — **0 tiền lệ**, vì chưa tệp nào trong kho dịch cụm này. (c) `:2.2` `sabbehi piyehi manāpehi nānābhāvo vinābhāvo aññathābhāvo` dịch giữ ba động từ phân biệt *phải chia ly, phải xa cách, phải trở nên khác đi*.
  - >-
    **Không đối chiếu được tầng Việt hiện hành** (tại commit đã ghim chỉ có 26 chương Pháp Cú) — đặc điểm snapshot upstream, không phải thiếu sót của repo.
