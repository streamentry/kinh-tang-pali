notes:
  - >-
    Bản dịch hoàn tất 60/60 segment Pāli của Nirāmisasutta (SN 36.31), bài kinh
    thứ 11 khép lại Phẩm Một Trăm Linh Tám Cách (Aṭṭhasatapariyāyavagga) và hoàn
    tất toàn bộ Tương Ưng Thọ (Vedanāsaṁyutta).
  - >-
    Đối chiếu Pāli root và bản Anh của Bhikkhu Sujato tại SuttaCentral. Tầng
    tham khảo Anh có coverage 100% (32/32 substantive segments), không có khoảng
    trống (reference gap) và không có blocking error nào.
  - >-
    Hệ thống thuật ngữ cốt lõi được đối chiếu và chuẩn hóa nhất quán 100% qua 4
    phạm trù (hỷ - pīti, lạc - sukha, xả - upekkhā, giải thoát - vimokkha):
    sāmisa (thuộc vật chất / nương năm dục công đức hoặc sắc giới), nirāmisa
    (không thuộc vật chất / nương thiền định sơ-nhị-tam-tứ thiền hoặc vô sắc
    giới), nirāmisatara (tối thắng không thuộc vật chất / khởi sinh nơi vị
    tỳ-kheo lậu tận khi quán sát tâm mình giải thoát khỏi tham, sân, si).
  - >-
    Dấu ngoặc kép, ngoặc đơn và dấu lược khớp 1:1 tuyệt đối với Pāli root theo
    từng segment: ngoặc kép mở ở 1.1, ngoặc kép đóng ở 12.2, ngoặc đơn ở 5.4, và
    dấu lược '…' ở 1.8, 4.4, 7.4.
