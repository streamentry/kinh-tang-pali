notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở mức từng khoá và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không căn theo segment nên chỉ dùng đối chiếu thuật ngữ và mạch bài, không dùng làm tầng cột). Tầng `vietnamese-current` căn theo segment không có cho bài này (tại commit đã ghim chỉ có 26 chương Pháp Cú); tầng `english-project` chưa có bản lấp cho bài này.
  **Coverage English: 71/86 = 0,8256** khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`; tổng 144 khoá), trên ngưỡng 0,8 nhưng không xa. Sujato có key cho 144/144 khoá. 15 khoá có nội dung để trống: `1.9`, `1.11`, `8.6`, `8.7`, `8.9`, `8.13`, `8.24`, `8.25`, `8.29`, `8.30`, `9.2`, `9.7`, `9.8`, `9.14`, `9.15`; cả 15 đều là đoạn lặp nguyên văn một đoạn khác của chính bài (bản tin sứ giả được nhắc lại ở `1.9`–`1.11`, `8.5`–`8.13` và `9.2`–`9.15`, mà Sujato nén thành một câu như *They repeated what the Buddha had said*), nên nội dung của chúng vẫn được đối chiếu qua bản Anh của đoạn gốc (`1.4`–`1.7`, `7.3`–`7.10`, `8.15`–`8.21`). Ngoài ra Sujato để trống `4.14` và `4.15` (Pāli 14 và 19 ký tự, nằm ngoài mẫu số) và colophon `11.8`. Vì vậy `triangulation` không đạt mức của bài phủ 100%, và bài không tuyên bố đã đối chiếu English cho toàn bộ 144 khoá; bài không cần entry trong `content/meta/reference-gaps.yaml` vì coverage vượt ngưỡng.
  **Số Pāli.** `dve devatāyo` = *hai vị thiên* (`dve` = 2: `5.7`, `7.2`, `8.5`, và `dvinnañca devatānaṁ` = *hai vị thiên* ở `7.1`, `7.12`); `Pañcamaṁ` = *Thứ năm* (colophon `11.8`, Sujato để trống). Phép đếm hướng ở `11.1`: `purimaṁ` đông, `pacchimaṁ` tây, `uttaraṁ` bắc, `dakkhiṇaṁ` nam, `uddhaṁ` trên, `adho` dưới, `anudisaṁ` các hướng giữa = 7 mục, khớp bản Anh *east, west, north, south, above, below, and in-between* và khớp nguyên văn `sn4.23:9.3`.
  **Dùng lại nguyên văn đã có, đếm được.** 37 khoá Pāli của bài có Pāli trùng nguyên văn với khoá ở bài khác trong tầng (tổng 1.656 cặp, trong đó 1.005 cặp bản Việt khác, chủ yếu ở các câu mở đầu và đáp ngắn có nhiều dạng trong kho như `1.1`, `1.12`, `4.8`, `11.4`); trong 37 khoá đó có 28 khoá bản Việt này dùng đúng một dạng đã có sẵn trong kho. Các công thức lấy theo dạng chiếm đa số hoặc theo bài kế cận: `4.2`/`4.12` *sắc/thức là thường còn hay vô thường?* (29/40, 25/33), `4.3` *Vô thường, bạch Thế Tôn* (50/78), `4.5` *Khổ, bạch Thế Tôn* (38/81), `4.4` *Cái gì vô thường, là khổ hay là lạc?* (31/83), `4.6` *có tính biến đổi, có nên xem như vầy* (32/58), `4.8`/`4.15` *Thưa không phải vậy, bạch Thế Tôn* (99/303), `4.11`/`9.11` *các hành …* (54/63), `4.13` (17/19), `4.17` (7/8), `0.2` (24/26); `2.10` lấy nguyên văn từ `sn22.88`, `2.12` từ `sn22.88` và `sn35.74`; `10.5`, `10.6`, `11.1`, `11.5`–`11.7` lấy theo `sn4.23` (cùng công thức Hắc Nham, luồng khói và Ác Ma tìm thức), chỉ đổi tên nhân vật. Những chỗ cố ý khác dạng nhiều nhất: `1.1`, `1.12`, `10.1`, `11.2` dùng *Đức Thế Tôn* thay vì *Đức Phật* để nhất quán một danh xưng cho `bhagavā` suốt bài (tầng chia gần đều: `1.12` Đức Phật 10 so với Đức Thế Tôn 9); `4.7` giữ *Cái này là của tôi, cái này là tôi, cái này là tự ngã của tôi* theo sn22 (8/8) dù toàn tầng chia 31 so với 29 với dạng *đây là của ta*; `4.18` giữ *biết rõ: không còn gì là tự thân nữa* (dạng không có chữ *thì*: 23 khoá toàn tầng so với 28 khoá có *thì*; riêng sn22 là 12 so với 4) mặc dù Hòa thượng Thích Minh Châu nguyên bài viết *không còn trở lui trạng thái này nữa* (quy ước tầng đã thành dạng chuẩn, không đổi). Trong chính bài có 15 nhóm Pāli trùng nguyên văn, tổng 48 cặp, bản Việt khác nhau 0 cặp.
  **Thuật ngữ chọn theo tiền lệ đếm được.** `āvuso` → *hiền giả*; `bhante` → *bạch Thế Tôn* khi nói với Đức Thế Tôn; `upaṭṭhāka` → *những người chăm sóc* (cùng cách chọn với `sn35.87` và `mn144` cho người chăm sóc tôn giả bệnh; `sn22.88` viết *các vị hộ trì*, nhưng `sn47.9`/`mn32`/`an1.223` dùng *thị giả* và nghĩa của `upaṭṭhāka` là người hầu cận người bệnh); `vedanā` đứng đầu câu → *Cảm thọ* (tầng: *Cảm thọ …* 21 khoá khi mở nháy và 12 khoá khi không nháy, so với *Thọ …* 2 khoá), còn `dukkhā vedanā` → *cảm thọ khổ* theo `sn35.74`/`mn144`; `kaṅkhāmi` → *nghi ngờ* và `vicikicchāmi` → *hoài nghi* (để giữ hai động từ khác nhau trong cặp `8.19`/`8.20`; dạng *nghi hoặc* của glossary dành cho danh từ `vicikicchā` trong ngữ cảnh triền cái, còn `sn12.15` dịch cặp `kaṅkhati vicikicchati` là *hồ nghi, do dự*); `kulaputta` → *người con lương gia* (theo `sn4.23`); `māro pāpimā` → *Ác Ma* (theo `sn4.23`); `satthaṁ āharesi` → *dùng dao tự vẫn* (`sn35.87:12.2`, `mn144:12.1`, `mn144:6.1`); `parinibbuto` → *nhập Niết-bàn* (mục `parinibbāyati` của glossary liệt kê dạng này, và `sn35.88:20.2` dịch cùng cách); `kālaṁ kattabbaṁ` → *mệnh chung* (cùng gốc với `kālakiriyā` ở `7.10`/`8.13`, theo `sn55.21` *sự mệnh chung*); `apāpakaṁ maraṇaṁ`, `apāpikā kālakiriyā` → *cái chết … sẽ không xấu ác, sự mệnh chung … sẽ không xấu ác* (theo `sn55.21`/`sn55.22`, đổi đại từ *ông* thành *ngươi* vì Đức Thế Tôn xưng hô với tỳ-kheo ở các bài sn22 cùng phẩm); `āsanāni paññattāni` → *chỗ ngồi đã được soạn sẵn* (`an6.56`, `sn22.88`); `pūtikāya` → *thân hôi thối* (`an9.11:11.2`).
  **Hai chỗ cố ý viết khác kho, đã đo.** (1) `2.13` `atha kiñca te kukkuccaṁ ko ca vippaṭisāro` → *thì ngươi còn hối hận điều gì, hối tiếc điều gì?* Ba bài `sn22.88`, `sn35.74`, `sn35.75` viết *hối hận điềm gì, và sự hối tiếc ấy là của ai?*; Pāli `ko ca vippaṭisāro` là cách hỏi *vippaṭisāra nào* (`ko` đồng cách với danh từ giống đực, không phải hỏi *của ai*), và bản Anh Sujato (*why do you have remorse and regret?*) cùng bản Việt nguyên bài (*có gì phân vân, có gì hối hận*) đều hỏi nội dung của hối tiếc, nên bài này sửa. Người biên tập nên cân nhắc đồng bộ ba bài kia. (2) `3.4`–`3.5` `Dhammañhi, vakkali, passanto maṁ passati` → *Thật vậy, này Vakkali, khi thấy Pháp là thấy Ta* (phân từ hiện tại `passanto` dịch thành *khi thấy*, tiểu từ `hi` thành *thật vậy*; không gộp với `3.2`–`3.3`, vốn nói bằng đại từ quan hệ `yo`).
  **Bất định đã ghi nhận, không che.** (1) `10.6` `vivattakkhandhaṁ`: giữ *thân uẩn đã buông bỏ* theo `sn4.23:9.2` (cùng công thức) và theo cách đọc *khandha* là *uẩn* của Sujato (*aggregates cast off*); Hòa thượng Thích Minh Châu nguyên bài đọc *khandha* là *vai* (*vai co quắp lại*). Pāli `khandha` có cả hai nghĩa; hai cách đọc không đổi giáo nghĩa, chỉ đổi cách tả tư thế người nằm. (2) `2.2`/`2.4` `samadhosi`: dịch *cố ngồi dậy / đừng ngồi dậy* theo `an6.56:1.8` và Hòa thượng Thích Minh Châu nguyên bài (*cố gắng từ giường ngồi dậy*); `sn22.88`, `sn35.74` viết *chống tay vào chiếc giường mà ngồi dậy* thêm chi tiết chống tay mà Pāli không nói, còn Sujato *stirred in his cot* là cách đọc khác về cùng động tác. (3) `5.3`/`5.5` `maṁ mañcakaṁ āropetvā`: hai tân ngữ; dịch *nhấc tôi lên cùng chiếc giường* theo Sujato (*lift my cot and take me*) và Hòa thượng Thích Minh Châu nguyên bài (*nhắc cái giường ta*). (4) `5.4` `antaraghare`: dịch *ở giữa nhà cửa*, trung tính giữa *trong nhà* (Hòa thượng Thích Minh Châu nguyên bài) và *khu dân cư* (Sujato). (5) `5.9`/`7.4`/`8.7` `vimokkhāya cetetī` dịch *đang có ý hướng đến giải thoát* và `5.11`/`7.6`/`8.9` `suvimutto vimuccissatī` dịch *được giải thoát tốt đẹp*; Hòa thượng Thích Minh Châu nguyên bài viết *có ý nghĩ muốn giải thoát* / *được khéo giải thoát*, Sujato *intent on liberation* / *well freed*; cả ba cùng nghĩa, không đổi giáo nghĩa. (6) `7.1`/`7.12` `Suṇāvuso tvaṁ` / `suṇāvuso`: Pāli khác nhau ở tiểu từ `tvaṁ`, bản Việt viết cùng một câu vì đại từ không đổi nghĩa trong lời kêu gọi. (7) `8.5`–`8.13` không có động từ dẫn lời của các tỳ-kheo (Pāli bắt đầu thẳng bằng nháy kép, người nói là các tỳ-kheo đang thuật lại lời nhắn `7.1`–`7.10`): bản Việt không thêm *các tỳ-kheo nói* vào thân kinh, vì Pāli không có.
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 144/144, đúng thứ tự Pāli. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá, 144 khoá (mẫu số 144, 0 lệch). Dấu lược: 13 khoá Pāli có dấu lược: 6 khoá `…pe…` (`4.13`, `4.16`, `4.17`, `5.7`, `8.5`, `11.3`) và 7 khoá `…` trần (`4.9`–`4.11`, `8.26`, `9.9`–`9.11`); cả 13 khoá Việt giữ đúng một `…`, không mở rộng. Pāli không có `(…)` ở khoá nào nên bản Việt không có `(…)`. NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang bản Việt ngoài tên riêng Rājagaha, Gijjhakūṭa, Isigili, Saṁyutta Nikāya.
