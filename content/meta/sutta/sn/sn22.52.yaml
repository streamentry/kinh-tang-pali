notes:
  - >-
    **Lý do `draft`:** xem `blocking_errors`. Sáu khoá `1.7–1.9`, `1.12–1.14` không có tầng Anh nào (Sujato để trống; tầng lấp của dự án chưa có cho bài này), nên `triangulation` chỉ 7.5 và bài không đủ điều kiện `published`.
  - >-
    Tên bài `Dutiyanandikkhayasutta` → *Kinh Diệt Tận Hỷ Ái (Hai)*, theo `sn22.51:0.3` *Kinh Diệt Tận Hỷ Ái*; hậu tố thứ hai theo đa số tầng `(Hai)` (102 lần) và đúng với `sn22.46:0.3` *Kinh Vô Thường (Hai)*, `sn22.50:0.3` cùng phẩm. Tên phẩm `Attadīpavagga` → *5. Phẩm Tự Mình Là Hòn Đảo* khớp Pāli tuyệt đối với `sn22.43:0.2` và `sn22.44:0.2`.
  - >-
    **12 khoá có Pāli trùng nguyên văn và dùng lại nguyên văn** (đo bằng script, đã loại lát này khỏi chỉ mục): `0.2` (tên phẩm) · `1.1` ← `an4.51:1.1` · `1.19` ← `an10.100:2.5` (*Thứ mười.*) · `2.0` (`Tóm lược:`) · tám khoá `1.4`, `1.5`, `1.8`, `1.9`, `1.13`, `1.14`, `1.17`, `1.18` lấy nguyên văn từ `sn22.51:1.4/1.5/1.8/1.9/1.13/1.14/1.18` (công thức `Nandikkhayā rāgakkhayo…` và `Nandirāgakkhayā cittaṁ vimuttaṁ…`). Cùng công thức: `yoniso manasi karotha` → *hãy khéo suy nghĩ về* và `yathābhūtaṁ samanupassatha` → *hãy thấy rõ … đúng như thật* (`sn35.158:1.1`, cùng Pāli); `nibbindati` → *nhàm chán* (`sn22.51:1.3`).
  - >-
    Bất định đã ghi: `2.0–2.5` là uddāna nhóm và `3.0–3.4` là uddāna phẩm, **không có một từ Anh nào** (Sujato để trống cả hai khối) và chỉ có một tiền lệ gần: `sn22.159:2.0–2.5` (nhóm 53) và `sn22.11:2.1` (*Bài Nakulapitā, bài Trời Rơi*). Theo đó: `Tassuddānaṁ` → *Tóm lược:*; `Mūlapaṇṇāsako samatto.` → *Phẩm Gốc đã xong* (mẫu `sn22.159:3.5` *Phẩm năm mươi thứ ba đã xong.* cho `Uparipaṇṇāsako samatto.`); `Tassa mūlapaṇnāsakassa vagguddānaṁ` → *Tóm lược phẩm gốc:* (mẫu `sn22.159:4.0`); tên bài trong `2.1–2.4` và `3.1–3.2` giữ **nguyên tên Pāli** (`Attadīpa`, `Paṭipadā`, `Anicca`, `Samanupassanā`, `Khandha`, `Soṇa`, `Nandikkhaya`, `Nakulapitā`, `Bhāro`, `Natumhāka`) vì hai bài `sn22.47`/`sn22.49` của nhóm chưa dịch nên chưa có tiêu đề Việt để dùng, và `sn22.11:2.1` đã lập tiền lệ gọi tên bài bằng chính tên Pāli. `Attadīpena paññāso` → *Hòn đảo là chính mình, bậc thắng trí*; `Paṭhamo tena pavuccatīti` → *bài thứ nhất được tuyên thuyết từ ấy vậy*. **Người biên tập nên kiểm lại toàn bộ uddāna này**; 0 tiền lệ cho `Bhāro` và `Natumhāka`.
  - >-
    Cấu trúc nháy kép: `1.2` mở → `1.18` đóng `”.`. Cân trên toàn bài 34 khoá.
  - >-
    Quy tắc dấu lược của BRIEF_VI3 §10: mọi khoá Pāli có `…pe…` hoặc `…` đều giữ **đúng một** `…`, không mở rộng; không khoá nào nén bằng `…` cả khi Pāli viết đủ. Đã đếm từng khoá. Coverage Anh đo được: 10/16 = 62,5% — DƯỚI ngưỡng 0,8
