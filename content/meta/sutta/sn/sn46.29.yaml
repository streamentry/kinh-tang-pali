  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho bài này. Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho; `budsas.org` chỉ là tra cứu toàn văn và không có căn cứ alignment ở mức segment.

  DẤU LƯỢC §10. Không khoá nào trong lát này được MỞ RỘNG chỗ Pāli lược. Bản Anh Sujato đã ghim mở rộng nhiều chỗ `…pe…` (ví dụ `sn45.24:2.2` và `sn55.31:4.1` liệt kê đủ tám ngành Bát Chánh Đạo, `sn46.14:3.3` liệt kê đủ bảy giác chi) — tôi KHÔNG theo, vì mở rộng là thêm chữ không đánh dấu. Cũng không khoá nào bị nén thêm: mọi `…` trong bản Việt đều ăn đúng một dấu lược ứng với một `…pe…` của Pāli, đếm từng khoá.

  DÒNH CHIẾU ĐƯỢC THÊM TẦNG `english-project`. Sujato để trống `sn46.29:3.5`;
    lớp lấp của dự án có `status: published`, cho *This is where these fetters, shackles, and
    attachments arise …* — khớp bản Việt *Từ đó, các sự trói buộc, ràng buộc và chấp thủ sinh
    khởi …*.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC. `Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo` đếm
    trong SN46 cho *giác chi có nhớ tưởng … giác chi có bình thản* 5 bài (sn46.12, 13, 19,
    22, 36) so với *niệm giác chi … xả giác chi* 3 bài và *giác chi niệm … giác chi xả* 1 bài
    → theo đa số, và dùng nhất quán với `sn46.14/15`. `Idha, bhikkhave, bhikkhu
    satisambojjhaṅgaṁ bhāveti vivekanissitaṁ …pe…` → *Ở đây, này các tỳ-kheo, vị tỳ-kheo tu
    tập giác chi có nhớ tưởng, y cứ vào viễn ly …* theo 5 bài. `upekkhāsambojjhaṅgaṁ bhāveti
    vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ` → *tu tập giác chi có
    bình thản, y cứ vào viễn ly, y cứ vào ly tham, y cứ vào diệt tận, và hướng đến buông bỏ*
    theo 4 bài. Tên phẩm: `Udāyivagga` → *3. Phẩm Buổi Sớm* (đa số 4 so với 1 và 1).
    0 tiền lệ, đặt mới: `Ekadhammasutta` → *Kinh Một Pháp*; `saṁyojanavinibandhā ajjhosānā`
    → *các sự trói buộc, ràng buộc và chấp thủ* (0 bài trong tầng; `saṁyojanīyā dhammā` thì
    ĐÃ có tiền lệ: `sn35.109:1.3` dịch đúng là *các pháp trói buộc*, nên tôi theo).
  REVIEW ĐỐI KHÁNG. Tôi in lại Pāli ↔ Việt từng cặp và đọc lại với mục tiêu tìm lỗi.
  Lỗi đã bắt được và đã sửa trước khi ghi lần cuối: 
  **(1)** `saṁyojanīyaṁ dhammā` bản nháp dịch *các pháp siết chặt*; `sn35.109`
      đã có *các pháp trói buộc* cho đúng Pāli này → đã đổi và dùng nhất quán trên 6 khoá.
      **(2)** Bản nháp thêm `“` đóng ở `2.3`; Pāli giữ lời thoại mở từ `1.1` cho tới `3.8`
      mới đóng, nếu đóng sớm sẽ thành hai lời thoại. **(3)** `2.2` bản nháp lỡ `diệt tận`
      trong khi tiền lệ `sn46.12/13/31/32` viết `diệt tận`; đã đồng nhất.
