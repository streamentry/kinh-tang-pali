  - >-
    **Danh sách song song trong lát này đã bị lệch một chỗ và đã sửa** — ghi lại vì đó là loại lỗi mà máy không bắt được: ba danh sách được sinh bằng vòng lặp (mười món cho ở `sn29.11-20`, chín loại hương ở `sn31.4-12`, mười món cho ở `sn31.23-112`). Một `range` lệch một đơn vị làm **cả danh sách** dịch sai từ đó trở đi mà vẫn qua mọi chốt tự động. Đã đối chiếp từng khoá với Pāli sau khi sửa.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên **49.374 segment đã `published`**: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Khớp **49.179 / 49.374 = 99,14%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ (`hay` được miễn vì `vā…vā…vā` là cấu trúc).
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Sn 45–56 đã đủ: `Paṭhamamāravagga` → *1. Phẩm Ma Rối Lần Nhất* (`sn23.8`) · `Nāgavagga` → *1. Phẩm Rồng* (`sn29.1/10`) · `Supaṇṇavagga` → *1. Phẩm Kim Sí Điểu* (5 bài; `sn30.1` ghi *Phẩm Rồng* — **lệch**) · `Gandhabbavagga` → *1. Phẩm Càn-thát-bà* (3 bài) · `Jhānavagga` → *1. Phẩm Thiền Định* (`sn34.1`) · `Avijjāvagga` → *6. Phẩm Vô Minh* (`sn35.59`) · `Channavagga` → *9. Phẩm Channa* · `Yogakkhemivagga` → *11. Phẩm An Ổn Khỏi Ách* · `Navapurāṇavagga` → *15. Phẩm Cũ Mới* · `Nandikkhayavagga` → *16. Phẩm Đoạn Tận Hoan Hỷ* · `Devadahavagga` → *14. Phẩm Devadaha* · `Jambukhādakavagga` → *1. Phẩm Jambukhádaka*. **Ba phẩm 0 tiền lệ:** `Lokakāmaguṇavagga` → *12. Phẩm Dục Thuộc Thế Gian* · `Samuddavagga` → *18. Phẩm Biển* · `Khandhavagga` → *Phẩm Uẩn* (chỉ xuất hiện ở uddāna `sn34.55`). **Chỗ đang phân kỳ trong kho:** `Aṭṭhasatapariyāyavagga` — `sn36.28` ghi *Bát Pháp Chân Đắc*, `sn36.24/25/26` ghi *Một Trăm Linh Tám Cách*, `sn36.29/30` ghi *Tám Trăm Lần*; bài này theo `sn36.28` vì cùng nhóm số thứ tự. **Người biên tập nên thống nhất.**
  - >-
    **merged bundle** (90 bài `Sāragandhādidānūpakārasuttanavutika`). Khung giống `sn31.4-12*` nhưng chỉ nêu **một** loại hương (`gandhagandhe` — hương mùi hương) và thay danh sách `So dātā hoti …` bằng **danh sách mười món cho**.
  - >-
    **Lỗi lệch một chỗ đã bắt và sửa trong lượt review đối kháng:** danh sách món cho bị lệch suốt từ `1.18` (Pāli `pānaṁ` mà bản dịch ra *thức ăn*). Nay khớp: thức ăn · thức uống · áo · phương tiện · hoa · hương · dầu thơm xứa · chỗ nằm · chỗ ở · thức lót sàng.
  - >-
    0 tiền lệ cho `Sāragandhādidānūpakārasuttanavutika` → *Bộ Chín Mươi Bài Về Cho Và Nhận*; `vilepanaṁ` → *dầu thơm xứa* (thoa xứa, không phải *mùi*).
  - >-
    Chú thích `2.1` là của chính Bilara (`(Evaṁ piṇḍakena ekasatañca dvādasa ca suttantā honti.)`). Uddāna `3.0–3.5` dịch chữ, **độ chắc thấp** — `dātā hi apare dasa` hiểu là *mười bài về người cho, không phải về người nhận* (vì chín tám bài còn lại là về người cho), nhưng cách hiểu này **chưa được đối chiếu** vì `sn31.13-22` chưa dịch.
  - >-
    **Lượt cải thiện 2026-10-13** (24/40 khoá đổi; đối chiếu bản làm mẫu `sn31.4-12`). **Sửa nghĩa:** `1.26` `padīpeyyaṁ` *thức lót sàng* → *đèn* (khớp bản Anh *a lamp* và đa số tiền lệ cùng Pāli); `1.29` `Dvādasasatimaṁ` *Thứ hai trăm mười hai* → *Thứ một trăm mười hai* (phù hợp `2.1`: tổng một trăm mười hai bài; 3 + 9 + 10 + 90); `1.3`–`1.11`, `1.14`, `1.16`, `1.27`, `1.28` `devānaṁ`/`devā` *các vị thần trong …* → *chư thiên trú ở …* (`adhivatthā devā`), và chín loại hương dịch lại đúng từng loại, nhất quán với `sn31.4-12`: lõi cây · giác cây · vỏ cây · vảy cây · lá cây · hoa · trái cây · nhựa cây · hương thơm (trước đó *sắc hương · hương nước hoa · hương gỗ · hương vải vóc · hương lá · … · hương vị · hương mùi hương* — lệch Pāli `sāra`/`phegu`/`taca`/`papaṭika`/`patta`/`puppha`/`phala`/`rasa`/`gandha`); `1.12` *sống lành thiện* → *làm thiện bằng thân/lời/tâm* (`sucaritaṁ carati`, nhất quán `sn31.2`, `sn31.4-12`, `sn31.13-22`); `0.3` tiêu đề *về Cho Và Nhận* → *về Sự Giúp Ích Của Bố Thí …* (`dānūpakāra` = bố thí giúp ích, không có nghĩa "nhận"); uddāna `3.1`–`3.4`: bỏ ý *không phải về người nhận* (không có trong Pāli) — `dātā hi apare dasa` = *mười bài khác về người cho* (`sn31.3` + `sn31.4-12` = 10 bài về người cho), `Dānūpakārā satadhā` = bố thí giúp ích đủ trăm cách (10 bài `sn31.13-22` + 90 bài này = 100). **Sửa nhẹ:** `1.17` viết hoa *Vị ấy* sau nháy đóng; `1.21` `mālaṁ` *hoa* → *vòng hoa* (garland, tách với `puppha`); `1.23` `vilepanaṁ` *dầu thơm xứa* (sai chính tả) → *dầu thơm xức*. **Điểm đổi:** `semantic_fidelity` 9.4→9.2, `terminology` 9.2→9.0, `ambiguity_integrity` 9.4→9.0 (đánh giá trước đó quá tay: ba lỗi nghĩa nêu trên đã lọt), `technical_integrity` 10.0→9.6 (bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa chạy lại trong lượt này); các điểm còn lại giữ nguyên.
  - >-
    **Bất định còn lại (lượt 2026-10-13).** (1) `papaṭika` (`1.6`): đã dịch *vảy cây* theo `sn31.4-12`; bản Anh ghim ghi *sprouts* (chồi). (2) `rasagandha` (`1.10`): *hương nhựa cây* theo bản Anh *sap*; Pāli cũng có thể hiểu là *hương vị*. (3) `gandhagandha` dịch *hương thơm*, không tách được nghĩa "hương của hương" khỏi *fragrant scents*. (4) Mười món cho: bản này dùng họ từ *thức ăn · thức uống · áo · phương tiện · vòng hoa · hương · dầu thơm xức · chỗ nằm · chỗ ở · đèn*, **khác** họ từ của `sn30.7-16`/`sn31.13-22` (*cơm · nước · vải · xe · vòng hoa · … · liệu xoa · giường · trú xứ · đèn*); đo trong kho thì hai họ ngang nhau (2/2 cho `vilepanaṁ`, `seyyaṁ`, `āvasathaṁ`), chưa thống nhất — **người biên tập nên chọn một họ cho mọi bài có mười món cho**, và `sn29.11-20`/`sn30.17-46` còn *thức lót sàng* cho `padīpeyyaṁ`. (5) Uddāna `3.1`: *Bản Thuần* = `Suddhika` theo tên `sn31.1` (*Kinh Bản Thuần*); độ chắc trung bình.
