  - >-
    **⚠ `sn20.4:1.2` — HAI CHỖ TÔI DỊCH SAI, ĐÃ SỬA.** (a) `okkhāsataṁ dānaṁ`:
    bản đầu tôi dịch *“cho ra hàng trăm”* như thể `okkhāsata` là một trăm;
    `okkhasa` = *một trăm*, `okkhāsata` = *một trăm lần một trăm* — số tiền
    khổng lồ. Sujato đọc *“a hundred cauldrons of rice”*, cũng là một cách phân
    tích khác. Đã sửa thành *“hàng trăm hàng trăm”*. (b) `gadduhanamattampi`:
    bản đầu tôi tự bịa *“một hai chén gạo”* — trong Pāli **không có gạo**;
    `gadduhāna` là bát để vắt sữa, `gadduhanamatta` = *lượng vắt được trong một
    bát*, và bản Anh đọc *“as long as it takes to pull a cow’s udder”*. Đã sửa
    thành *“một bát vắt từ bầu bê bò”*.
  - >-
    **⚠ `sn19.16:1.2` — TÔI DỊCH NGƯỢC VỀ NGHĨA.** Pāli `Tassa **ure** akkhīni
    ceva honti mukhañca` = *trên bụng* vị ấy có cả mắt, và cả miệng nữa; bản đầu
    tôi viết *“Bụng vị ấy thì có lông, mặt thì có”* — “có lông” là nghĩa của
    `akkhīni` cũng như `loma` nhưng ở đây Pāli nói **mắt** trên bụng, và
    miệng/mặt ở… Bản Anh đọc *“Its eyes and mouth were on its chest”*. Đã sửa
    thành *“Trên bụng vị ấy có cả đôi mắt, và cả khuôn mặt nữa”*.
