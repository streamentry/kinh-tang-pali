    = *cướp*).
  - >-
    `sn19.16:1.3` ⚠ **bất định đã ghi, không bịa:** `gijjhā kāka kulāla` —
    `gijjhā` = *kền kền* · `kāka` = *quạ*; còn `kulāla` PED cho cả hai nghĩa
    *chó* lẫn *một loài chim*, và bản Anh chọn *hawks*. Bản Anh cũng **đảo**
    `jalābujā`/`saṁsedajā` ở `sn29.4`–`29.9` (xem ghi chú dưới). Tôi chọn *chó*
    vì nghĩa chính trong PED, vì vật thể bị xé là một thân người, và vì **đã ghi
    rõ ở đây** để người biên tập đổi nếu chọn nghĩa chim.
