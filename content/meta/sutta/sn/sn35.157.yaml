    (b) **Ô tham số của hàm dịch chỉ nhận chuỗi** — quy tắc từ lát 16B, giữ
    nguyên. (c) **Dấu phẩy tiếng Việt không phải dấu phẩy Pāli** —
    `sn35.21`/`sn35.22` Pāli **có** dấu phẩy giữa ba mệnh đề đệ quy nên dùng
    hằng `ĐUOI_P`/`ĐUÔI_P` bản có dấu phẩy (PR #135), không dùng `ĐUOI` của
