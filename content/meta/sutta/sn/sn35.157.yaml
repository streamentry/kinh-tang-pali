  - >-
    **Đặc thù của tầng Pāli tại commit đã ghim — ghi ra, không sửa Pāli, không
    chú thích trong thân kinh:** (1) `sn35.143:1.12` và `sn35.144:1.12` là
    `…attāyā’ti` — **một** ngoặc đơn `’` **không có ngoặc mở tương ứng** (đã
    thấy ở `sn3.22`, `sn22.19`/`sn22.20`); dùng cơ chế `cắt_ước` để **bỏ dấu**.
    (2) `sn35.111:1.7` (`Cakkhuñca kho… …pe…`) bị lược **che mất tai và mũi**,
    nên phần khẳng định chỉ còn bốn mục (mắt/lưỡi/thân/tâm) — tôi **không** bịa
    hai mục đã mất, cũng không dịch thừa. (3) `sn35.21`/`sn35.22` **không** có
    khoá SV (`Sāvatthinidānaṁ`): phần sinh ở `1.1…1.6`, phần chấm dứt ở
    `2.1…2.6` — khác `sn26.1` gộp cả hai vào `1.x`. (4) `sn35.112:1.7` (`Rūpe ca
    kho…`) **không** lược và kết dấu chấm, trong khi `sn35.111:1.7` có lược —
    hai bài khác nhau đúng một dấu, tôi truyền riêng.
  - >-
    **Bất định có nghĩa đáng kể, đã phân xử và ghi lại:** (1) `anabhijānaṁ` ở
    `sn35.111`/`sn35.112` — tiền lệ `iti10:2.1` dùng *không thắng tri*
    (`abhiññā` = thắng trí), nhưng ở đây đối tượng là **sáu căn** chứ không phải
    tâm pháp cần thắng trí, nên *không biết* đọc đúng hơn; **người biên tập nên
    kiểm**. (2) `suvimuttanti` ở `sn35.157:1.5` — *tâm họ thoát ra hoàn toàn*
    theo công thức Nandikkhaya ở `sn22`; giữ nguyên. (3) `dhammaṭṭho` ở
    `sn36.5:3.5` — Sujato ở đây dịch *firm in principle* nhưng PR #133 đã chốt
    *là bậc đã biết pháp* (`sn36.12:6.3`); **nhất quán trong cùng cuốn sách
    thắng**, giữ nguyên văn.
