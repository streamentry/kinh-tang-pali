  - >-
    **Lượt review đối kháng bắt được 6 lỗi, đã sửa hết.** (1) **Tên phẩm sai
    nghĩa** — `Devadahavagga` viết nháp *Thần Rơi* (phân tích `deva` + `daha`
    theo nghĩa chữ); thực ra Devadaha là **địa danh**, Sujato *At Devadaha*,
    `mn101` đã là *Kinh Devadaha* — sửa thành *14. Phẩm Devadaha*. (2) **Bỏ sót
    tiền lệ** — `Yamakavagga` viết nháp *Phẩm Đôi* trong khi `an8.75` đã dùng
    *Phẩm Song Trùng* — sửa cả `0.2`, `2.8` và uddāna `3.6`. (3) **Trùng tên hai
    phẩm khác nhau** — `Jhānavagga` viết nháp *Phẩm Định* trùng với
    `Samādhivagga` ở `sn56.9` — sửa thành *Phẩm Thiền Định*. (4) **Lỗi chính tả
    trong tiêu đề** — bảy bài `sn34.12-18` đều ghi *Chứng Đắng* thay vì *Chứng
    Đắc* (`samāpatti` = sự chứng đắc) — sửa cả bảy `0.3`. (5) **Sai nghĩa từ
    khóa** — `sn36.5` dịch `salla` thành *chặt*; Sujato *a dart*, nghĩa đúng là
    **mũi tên** — sửa `1.4`, `1.5`, `2.2`. (6) **Sai cấu trúc kệ** —
    `sn36.5:2.3` tách `santaṁ` (tính từ của cảm thọ) thành vị ngữ riêng *là điều
    an ổn*, trong khi động từ nằm ở `2.4` (Sujato: *that peaceful, neutral
    feeling / as impermanent*) — sửa thành *thấy điều vừa khổ vừa dễ chịu, an
    ổn,*. Ngoài ra `sn35.206:0.3` viết nháp *Vừa Sinh* đã sửa thành *Hiện Tại*
    theo nguyên văn `sn35.204`/`sn35.205` (*Bên Trong Quá Khứ/Vị Lai*).
  - >-
