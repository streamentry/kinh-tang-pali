    **Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên
    **48.784 segment đã `published`**: `số = đếm('…pe…') + đếm('…' còn lại sau
    khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải
    `…pe…`. Khớp **48.359 / 48.784 = 99,13%**; 425 segment lệch là chỗ `…pe…`
    chưa dịch hoặc đã mở rộng trong bản cũ — tôi **không** sửa, **không** sao
    chép. Lát này có **79** segment Pāli mang dấu lược. Ba dạng phải phân biệt:
    `…pe…. ` → **một** `…` rồi dấu chấm; `…pe…` **ở đầu** segment là dấu lược
    **đầy đủ**, vẫn giữ; dấu `…` trần **ở đầu** segment thì **bỏ**.
