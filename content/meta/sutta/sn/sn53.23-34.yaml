notes: |-
  BÀI UID-GỘP: tệp Pāli có đúng 9 khoá và cả 9 khoá mang CHÍNH uid gộp (đã mở thẳng tệp
  đếm, không suy từ tên bài).

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 2.0 (Tassuddānaṁ, Sujato để
  trống ở mọi bài Tăng Bộ uid-gộp, chỉ 13 ký tự nên không tính coverage thân bản). Không có
  bản Việt hiện hành cho Tăng Bộ.

  BỐN VẾ BÀI ĐỐI TRÙNG NGUYÊN VĂN — DÙNG LẠI BẢN ĐA SỐ. Cả bốn vế của uddāna này trùng y hệt
  với sn50.23-34:2.1–2.4 và sn51.55-66:2.1–2.4 (đã so ký tự từng cặp), và tầng đang thống nhất
  ở cả hai bài kia, nên tôi dùng lại NGUYÊN VĂN: Sức lực, hạt giống, con rồng, / cây, bầu,
  chày; / cùng hư không và hai đám mây, / con thuyền, khách đến, dòng sông. (Đo được trên đĩa:
  mỗi về có đúng 4 lượt khớp nguyên văn, và 2 bản lạc — sn46.99-110 dịch âm theo kiểu
  Na-vā, Ā-gan-tu-ka, Na-dī, và sn49.23-34 dịch lệch — tôi theo đa số, không theo hai bản lạc.)

  KHUON: Balakaraṇīyavagga → *Phẩm Việc Nặng* (4 lượt ngoài lát, trùng nguyên văn ở
  sn49.23-34:0.2, sn50.23-34:0.2, sn51.55-66:0.3, sn48.93-104:0.3 — tôi dùng lại y hệt ở cả
  0.2 và 0.3). (Balakaraṇīyavaggo vitthāretabbo.) → *(Phẩm Việc Nặng cần được giảng rộng.)*
  trùng nguyên văn ở 3 bài, dùng lại y hệt. Tassuddānaṁ → *Tóm lược:* (240 lượt).

  `:0.1` — TÔI BỔ DẢI, ĐÃ GHI. Pāli chỉ ghi Saṁyutta Nikāya 53.23, tức chỉ số bài đầu của
  dải. sn53.13-22 (cùng phẩm, ngay trước) đã viết đủ dải lấy từ uid và dùng dấu gạch dài;
  Sujato cũng ghi Linked Discourses 53.23–34. Tôi theo và dùng gạch dài. Đây là khối TIÊU ĐỀ
  nên không tính là thêm chữ vào thân bản.

  `:1.1` — TÔI KHÔNG CHÈ CHÚ THÍCH CỦA SUJATO. Bản Anh viết kèm cả dấu ngoặc chỉ sang
  SN 45.149–160; số ấy không có trong Pāli khoá này, nên tôi không chèn vào thân bản.
