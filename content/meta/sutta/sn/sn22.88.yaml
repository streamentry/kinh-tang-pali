notes: |-
  Dịch từ Pāli root, có đối chiếu tầng Anh đã ghim ở mức từng segment.

  **Coverage — đo thật, mẫu số khác 0.** Công thức `source/layers.yaml` (Pāli có nội dung ≥ 40 ký
  tự, loại khối tham chiếu `:0`): mẫu số **36** segment, dài nhất 206 ký tự (4.14). Sujato phủ
  **35/36 = 0,9722**; khoá còn lại là **1.11** (Sujato để trống, do lớp lấp `english-project` của
  chính dự án bù, trạng thái `published`). Tổng hai tầng được tính coverage: **36/36 = 1,0000**,
  trên ngưỡng 0,8. Tầng `vietnamese-current` không có bài này — manifest ghim chỉ 26 tệp Pháp Cú —
  nên đây là giới hạn của ảnh chụp upstream, không phải thiếu sót của kho. Không cần entry trong
  `content/meta/reference-gaps.yaml`.

  **Tầng Anh đã ghim ở đúng bài này thì đáng tin về nghĩa, không đáng tin về dấu lược.** 8 khoá Pāli
  mang `…pe…`; Sujato **mở rộng im lặng ở 3 khoá** — 2.8, 3.1 và 4.10 — viết thêm câu chữ không có ở
  Pāli (`your pain is fading, not growing`; `My pain is terrible and growing`; `they're not attached
  to it`), và chỉ giữ dấu lược ở 4 khoá (4.3–4.6). Pāli là authority: cả 8 khoá giữ **đúng một** `…`,
  không mở rộng. Sujato cũng để trống 1.10, nhưng 1.10 chỉ dài 38 ký tự nên nằm ngoài mẫu số.

  **`triangulation` hạ một nấc, và vì sao.** 35/36 khoá có nội dung được đối chiếu với bản Anh
  **đã xuất bản** của Ngà Thế Tôn; 1 khoá (1.11) đến từ bản lấp của chính dự án cùng họ công cụ,
  nên không phải một lần đọc Anh độc lập. Vì vậy bài **không** tuyên bố đã đối chiếu English cho
  toàn bộ.

  **Tên bài — đo cả hai phạm vi, ghi cả hai số.** Pāli `Assajisutta`; tầng tên của SuttaCentral đã ghim
  (`name/sutta/sn`) dịch nó là *With Assaji*. Đo `translationTitle` trong `content/meta/sutta/sn/*.yaml`
  cho mọi tên bài dạng `<Tên riêng>sutta`: **Kinh <Tên> = 1.624**, **Kinh Cùng … = 4**. Riêng sn22:
  **133** so với **1** (`sn22.83`, cùng phẩm 9, cùng dạng tên, đặt là *Kinh Cùng Tôn Giả Ānanda* theo
  đúng *With Ānanda* của Sujato). Đa số rõ ràng ở cả hai phạm vi nên đã chọn **Kinh Assaji** cho cả
  khoá `:0.3` và `translationTitle`; khác `sn22.83` một cách, và sự khác ấy đã ghi lại đây để người
  điều phốn gộp nếu muốn thống nhất theo bản anh em.

  **Pāli trùng nguyên văn: 10 khoá, 395 cặp, 28 nhóm bản Việt khác nhau; dùng lại y nguyên văn 9
  khoá, dịch mới 1.** Chọn theo đa số của từng khoá:
    - `0.2` `9. Theravagga` (19 cặp): *Phẩm Các Vị Trưởng Lão* **17** so với *Phẩm Trưởng Lão* 2.
    - `1.1` (24 cặp, 14 dạng Việt khác nhau) — **khoá duy nhất phải dịch mới**: lớp chưa thống nhất,
      đa số chính xác là *trong vườn tre, nơi đàn sóc ăn* (5/24) nhưng chỉ hơn *tại rừng Trúc, nơi nuôi
      dưỡng các con sóc* (4/24) **một**. Đã ghép hai đa số theo **thành phần** trong phạm vi sn:
      `veḷuvane` → *Trúc Lâm* **15** và `kalandakanivāpe` → *chỗ nuôi dưỡng các con sóc* **12**.
    - `1.6` (3 cặp, 2 dạng): *Vị ấy đảnh lễ dưới chân Đức Thế Tôn.* **2** so với 1.
    - `1.12` (27 cặp, 5 dạng): *Đức Thế Tôn im lặng nhận lời.* **10**, *Đức Phật im lặng nhận lời* 9,
      *nhận lời bằng sự im lặng* 4.
    - `2.3` và `2.6` (mỗi khoá 2 cặp, **chỉ một** dạng Việt): dùng lại y nguyên văn.
    - `4.2` (33 cặp, 6 dạng): *sắc là thường còn hay vô thường”ti?* **24**.
    - `4.3` (16 cặp, 2 dạng): *“Vô thường, bạch Thế Tôn” …* **15**.
    - `4.6` (5 cặp, 2 dạng): *Thấy như vậy …* **4**.
    - `5.5` (264 cặp, 3 dạng): *Thứ sáu.* **259**.
  Ngoài ra còn **5** khoá chỉ xuất hiện **một** lần ở nơi khác trong tầng, và tất cả đều dùng lại
  nguyên văn: `3.5` (sn35.74), `4.4` (sn22.100, bỏ dấu nháy kép thừa mà bản kia có), `4.5`
  (sn22.97), `4.7` (sn22.83), `5.4`/`4.15` (sn36.8).

  **Thuật ngữ — đếm trước khi chốt, và có một chỗ đã sửa sau khi đếm.**
    - `passambhetvā passambhetvā` và `kāyasaṅkhāre`: bản nháp đầu viết *an trị* và *các hành thức
      thân*, cả hai đều là cách của riêng lát này (đếm = 1, chính là bản nháp). Đo lại tầng:
      `passambh-` có **26** khoá dịch *lắng dịu*; `kāyasaṅkhāra` có **5** dịch *hoạt động của thân*.
      Đã đổi sang *đã lắng dịu, đã lắng dịu* và *sống trong hoạt động của thân*.
    - `bhante` → *bạch Thế Tôn*: trong sn **532**, trong sn22 **64/64**; không có ngoại lệ.
    - `te`/`tvaṁ` (Đức Phật gọi Assaji) → *ngươi*: trong sn **218**.
    - `me`/`maṁ`/`ahaṁ` của một vị tỳ-kheo nói với Đức Phật → *con*: riêng sn22 là **32** so với
      *tôi* 12, và sn35.74/sn35.75 — hai bài cùng cuộc đối thoại này — cũng dùng *con*.
    - `āvuso` → *hiền giả*: trong sn **751**. `bhagavā` trong câu *sādhu kira…* → *Đức Phật*, theo
      đúng tiền lệ mn128:3.3.
    - `anukampaṁ upādāyā` → *vì lòng thương tưởng*: **11** khoá (mn128, mn142, mn143, mn97…).
    - `khamanīyaṁ`/`yāpanīyaṁ`/`paṭikkamosānaṁ`/`abhikkamosānaṁ` → *dễ chịu* / *đủ sức* /
      *thuyên giảm* / *gia tăng*: đếm trong sn lần lượt **14 / 11 / 9 / 9**, tất cả từ sn35.74 —
      cùng công thức với bài này.
    - `kukkuccaṁ`/`vippaṭisāro` → *hối hận* / *hối tiếc*; `attā sīlato upavadatī` → *tự thấy mình
      có lỗi lầm về giới pháp* (dùng lại y nguyên văn từ sn35.74).
    - `ānandaṃ` ở `tasmātiha` → *Vì vậy*, theo sn22.83:4.9.
    - `vedayati` → *cảm nhận*; `pajānāti` → *biết rõ* khi dẫn lời tự thấy, *biết* khi kể sự kiện.
    - `telappadīpo` → *ngọn đèn dầu*; `vaṭṭi` → *tim* (theo mn140 và sn36.8).

  **Bốn chỗ dịch mới, đã đo là không có tiền lệ trùng nguyên văn.**
    - `kassapakārāme` (1.2) — hậu tố `-kārāme` là *được dựng lên*, `ārāma` là *tu viện* (**79** khoá
      trong sn). Sujato dịch *a monastery built by a Kassapa* không xác định người xây; bản Việt giữ
      sự không xác định đó: *tu viện do người tên Kassapa dựng*. Vì tên `Kassapa` còn là tên một Đức Phật
      đời trước, nơi đây **không** nói đó là thầy Kiều-lân đã dựng — đó là suy đoán, xem mục bất định.
    - `gelaññe` (3.7) — *khi còn khỏe*. Chữ này xuất hiện ở vài nơi trong tầng Pāli nhưng **chưa khoá
      Việt nào** dịch nó theo nghĩa “khỏe” (đếm = 0); dn16:2.24.5 và sn47.9:3.6 chỉ có nghĩa “vì
      Đức Thế Tôn bị bệnh”.
    - `visaṁyutto` (4.11–4.13) — *không chướng lắm*. Đếm = 0 khoá Việt nào dịch `visaṁyutta` theo
      nghĩa trạng ngữ này; chỗ duy nhất có tiền lệ là an5.200, ở đó nó đi kèm mối từ `kāmehi` và
      được dịch *thoát ly khỏi các dục*.
    - `samaṇabrāhmaṇā samādhisārakā samādhisāmaññā` (3.10) — *các Sa-môn Bà-la-môn lấy định làm cốt
      lõi, coi định là điều họ đạt được*. `samādhisāra` có **2** tiền lệ (*cốt lõi*, snp2.9);
      `samādhisāmaññā` không khoá nào dịch.

  **Bất định đã ghi, không giấu, không thêm vào thân kinh.**
    - `3.4` `attā sīlato na upavadatī` có chữ `na` mà bản song song sn35.74:6.1 **không có**
      (`attā sīlato upavadatī`). Đây là hai Pāli khác nhau, nên bản Việt của sn35.74 không dùng lại
      được nguyên văn; đã dịch theo đúng Pāli của bài này và giữ phủ định. Cách diễn đạt hơi nặng
      nên đây là lý do `vietnamese_clarity` ở 9,3.
    - `1.2` xem mục trên.
    - Bản Pāli đã **cắt câu ở giữa** ở cặp khoá 1.5/1.6 (bản anh em sn22.87:1.5 giữ cả hai vế
      trong một khoá). Bản Việt bám đúng ranh giới khoá của tầng Pāli: 1.5 dừng ở *bệnh nặng.* và
      1.6 mở đầu bằng *Vị ấy*. Đây là hệ quả của cắt khối, không phải lỗi dịch.
    - `assaji, bhante` ở 1.5/1.10 đọc như chủ ngữ đặt trước (giống hệt `vakkali, bhante` của
      sn22.87:1.5), nên dịch *Bạch Thế Tôn, vị tỳ-kheo Assaji…*, không dịch như cách xưng hô.

  **Dấu lược và nháy.** Cả 8 khoá `…pe…` giữ **đúng một** `…` (8/8), không khoá nào thêm dấu lược
  trần, không khoá nào có `(…)` ở Pāli nên cũng không có ở bản Việt. Nháy đơn `‘’` và ngoặc kép `“”`
  khớp Pāli **từng khoá**: 0/54 lệch (mẫu số 54), tổng 66 dấu ở cả hai bên. Bản Pāli mở `“` ở 4.5 và
  khép ở 5.4 — bản Việt bám đúng, không tự cân.

  **Phép kiểm đã chạy, có mẫu số.** Tập khoá Việt = tập khoá Pāli: 54/54, thứ tự khoá trùng thứ tự
  Pāli. Kiểm nháy theo khoá: 0/54 lệch. Kiểm `…pe…` và lược trần: 0/54 lệch, 8/8 khoá có `…pe…`.
  Kiểm Pāli trùng nguyên văn **trong chính bài này** chạy **rỗng** — không có cặp trùng nào (0 cụm,
  0 cặp), nên ở phép đó **không** thể nói “0 lỗi”; phép đo thật là 10 khoá có bản dịch trùng ở nơi
  khác trong tầng (395 cặp), nêu ở trên. Phép đo số Pāli máy quét toàn tầng: **230** cặp cùng đơn
  vị, **0 lệch**; riêng bài này **không có** từ khoá số ghép nên đóng góp **0 cặp** — phép đo máy
  **không đo được gì cho sn22.88**, nên mọi số ở đây đều tự tính: `Chaṭṭhaṁ` = cha 6 → *Thứ sáu*
  (đa số tầng **259**), và `ekamantaṁ` = một bên (1.9, hai lần).

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`,
  `npm test`, `npm run check`, và `npm run build` vì bài sẽ `published`. Vì bốn lệnh ấy chưa chạy ở lát
  này, `technical_integrity` đặt 9,6 chứ không 10,0.
