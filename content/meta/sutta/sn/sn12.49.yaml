notes: |-
  TẦNG THAM KHẢO CÓ, ĐẦY ĐỦ. `sn12.49_translation-en-sujato.json` có đủ 41/41 khoá
  và 11/11 khoá Pāli có nội dung ≥ 40 ký tự đều có chữ ⇒ coverage 100%, không cần entry
  `reference-gaps`. Tầng `vietnamese-current` vắng.

  :0.1 giữ `Saṁyutta Nikāya 12.49` với chữ ṁ = U+1E41, đúng như 1482/1612 tệp sn đã có.
  (Không bao giờ `Saṡyutta` — đó là điểm 0.1 của brief.) :0.2 trùng nguyên văn 5 tệp.
  :0.3 `Ariyasāvakasutta` không có tiền lệ trùng giá trị Pāli; Sujato đọc A Noble Disciple →
  Kinh Đệ Tử Thánh.

  CÔNG THỨC ĐIỀU KIỆN `X sati, Y hoti` — 0 tiền lệ trùng toàn văn, nhưng có tiền lệ cùng
  dạng ở sn23.1:2.6–2.9 (Khi có cảm thọ / khi có tưởng / khi có các hành / khi có thức) và
  sn24.19. Dịch theo đó. Còn `X paccayā, Y hoti` ở sn12.48 dùng Do duyên … nên có; bài này
  Pāli dùng sati (khi có) chứ không phải paccayā (do duyên) — phân biệt rõ, không đồng nhất
  hai công thức.
  `sutavato ariyasāvakassa` → đệ tử Thánh đa văn (tiền lệ an4.125:1.9, an9.14).
  `aparappaccayā ñāṇamevettha` → không tựa vào điều gì khác (không phải so với người khác như
  bản Anh dịch — Pāli là không tựa vào điều kiện nào khác).
  `diṭṭhisampanno` → đầy đủ chánh kiến (tiền lệ sn12.27:5.2).

  QUY TẮC DẤU LƯỢC — BA DẠNG, KHÔNG GỘP.
  4.6, 4.7, 4.8 và 5.1 có `…pe…` nên giữ đúng MỘT `…` mỗi khoá (4 khoá, 4 dấu).
  3.4 PĀLI KHÔNG CÓ `…pe…` (Sujato mới dùng `…` để nén 11 vế), nên bản Việt BẮT BUỘC viết đủ
  cả 11 vế — nếu thêm `…` thì lệch với Pāli, và đây là chỗ hay bị nén oan.
  2.15 và 4.11 có `‘…’ti` nên giữ dấu nháy cong và chữ ti.
  5.1 giữ `…` đúng một dấu; danh sách danh xưng còn lại để sang 5.2.
  Trích dẫn kép: Pāli mở `“` ở 1.2 và đóng `”` ở 5.2 — bản Việt cân đúng một cặp.

  BẤT ĐỊNH ĐÃ PHÂN XỬ.
  (1) `kismiṁ sati kiṁ hoti, kissuppādā kiṁ uppajjati` (1.4): dịch là khi có cái gì, cái gì có;
  do cái gì sinh khởi, cái gì sinh ra. Bản Anh dịch When what exists, what is — cùng nghĩa.
  (2) `bhavo` → hữu sanh, `jāti` → tái sinh, `jarāmaraṇaṁ` → già chết. Trong Tăng Bộ đã có
  sẵn: danh và sắc (sn12.14), sáu căn (sn12.58, sn48), xúc chạm (sn35.106), ái dục, chấp thủ.
  Không dùng báo hán cũ vì tầng Việt đã bỏ.
  (3) `atthaṅgama` → sự diệt tận, `samudaya` → sự khởi lên (tiền lệ an4.10 ghi nhận từ lát 16B).
  (4) Bản Anh ở 5.1 liệt kê tám danh xưng dài hơn, còn Pāli nén sau `…pe…`. Theo luật của kho:
  KHÔNG mở rộng; giữ `…` và dịch vế còn lại (`amatadvāraṁ āhacca tiṭṭhati`) ở 5.2.

  TẦNG THAM KHẢO ĐÃ ĐO.
