notes: |-
  TẦNG THAM KHẢO CÓ, ĐẦY ĐỦ. `sn12.49_translation-en-sujato.json` có đủ 41/41 khoá
  và 11/11 khoá Pāli có nội dung ≥ 40 ký tự đều có chữ ⇒ coverage 100%, không cần entry
  `reference-gaps`. Tầng `vietnamese-current` vắng.

  :0.1 giữ `Saṁyutta Nikāya 12.49` với chữ ṁ = U+1E41, đúng như 1482/1612 tệp sn đã có.
  (Không bao giờ `Saṡyutta` — đó là điểm 0.1 của brief.) :0.2 trùng nguyên văn 5 tệp.
  :0.3 `Ariyasāvakasutta` không có tiền lệ trùng giá trị Pāli; Sujato đọc A Noble Disciple →
  Kinh Đệ Tử Thánh.

  CÔNG THỨC ĐIỀU KIỆN `X sati, Y hoti` — 0 tiền lệ trùng toàn văn, nhưng có tiền lệ cùng
  dạng ở sn23.1:2.6–2.9 (Khi có cảm thọ / khi có tưởng / khi có các hành / khi có thức) và
  sn24.19. Dịch theo đó. Còn `X paccayā, Y hoti` ở sn12.48 dùng Do duyên … nên có; bài này
  Pāli dùng sati (khi có) chứ không phải paccayā (do duyên) — phân biệt rõ, không đồng nhất
  hai công thức.
  `sutavato ariyasāvakassa` → đệ tử Thánh đa văn (tiền lệ an4.125:1.9, an9.14).
  `aparappaccayā ñāṇamevettha` → không tựa vào điều gì khác (không phải so với người khác như
  bản Anh dịch — Pāli là không tựa vào điều kiện nào khác).
  `diṭṭhisampanno` → đầy đủ chánh kiến (tiền lệ sn12.27:5.2).

  QUY TẮC DẤU LƯỢC — BA DẠNG, KHÔNG GỘP.
  4.6, 4.7, 4.8 và 5.1 có `…pe…` nên giữ đúng MỘT `…` mỗi khoá (4 khoá, 4 dấu).
  3.4 PĀLI KHÔNG CÓ `…pe…` (Sujato mới dùng `…` để nén 11 vế), nên bản Việt BẮT BUỘC viết đủ
  cả 11 vế — nếu thêm `…` thì lệch với Pāli, và đây là chỗ hay bị nén oan.
  2.15 và 4.11 có `‘…’ti` nên giữ dấu nháy cong và chữ ti.
  5.1 giữ `…` đúng một dấu; danh sách danh xưng còn lại để sang 5.2.
  Trích dẫn kép: Pāli mở `“` ở 1.2 và đóng `”` ở 5.2 — bản Việt cân đúng một cặp.

  BẤT ĐỊNH ĐÃ PHÂN XỬ.
  (1) `kismiṁ sati kiṁ hoti, kissuppādā kiṁ uppajjati` (1.4): dịch là khi có cái gì, cái gì có;
  do cái gì sinh khởi, cái gì sinh ra. Bản Anh dịch When what exists, what is — cùng nghĩa.
  (2) `bhavo` → hữu sanh, `jāti` → tái sinh, `jarāmaraṇaṁ` → già chết. Trong Tăng Bộ đã có
  sẵn: danh và sắc (sn12.14), sáu căn (sn12.58, sn48), xúc chạm (sn35.106), ái dục, chấp thủ.
  Không dùng báo hán cũ vì tầng Việt đã bỏ.
  (3) `atthaṅgama` → sự diệt tận, `samudaya` → sự khởi lên (tiền lệ an4.10 ghi nhận từ lát 16B).
  (4) Bản Anh ở 5.1 liệt kê tám danh xưng dài hơn, còn Pāli nén sau `…pe…`. Theo luật của kho:
  KHÔNG mở rộng; giữ `…` và dịch vế còn lại (`amatadvāraṁ āhacca tiṭṭhati`) ở 5.2.

  TẦNG THAM KHẢO ĐÃ ĐO.
  TẦNG KỸ THUẬT: đợt này cấm chạy `npm run validate|test|build|check|audit|reference:gaps`, nên
  `technical_integrity` bị chặn ở 9.6. Đã tự kiểm bằng chính `_hvi.py`: JSON hợp lệ, đủ khoá, 0
  orphan, 0 rỗng, mọi giá trị NFC, 0 khoá trùng nguyên văn Pāli, dấu lược khớp Pāli từng khoá,
  không có `(…)` đứng một mình, ngoặc kép cân toàn bài, và `save_vi` chạy lại cho md5 y hệt
  (idempotent).


  LƯỢT CẢI THIỆN 2026-10-14 (đọc đối kháng từng khoá; 23/41 khoá đổi; thứ tự khoá tệp dịch đưa về đúng thứ tự Pāli).
  Các mục (2) và (3) của phần "Bất định đã phân xử" ở trên được thay bằng kết quả đo dưới đây; mục còn lại giữ nguyên.
  SỬA NGHĨA.
  (a) 5.2 `amatadvāraṁ āhacca tiṭṭhati itipī`: bản cũ "đã đập cửa bất tử, đứng dựa nơi ấy, cũng vậy còn được gọi là" dịch sai động từ, thêm "nơi ấy" và đảo vế `itipi`. Nay "cũng được gọi là vị đang đứng gõ cửa bất tử" như sn12.28:5.14 và sn12.33:8.3, sn12.33:14.3 (3/3 khoá có cùng cụm).
  (b) 2.1, 4.1 `aparappaccayā ñāṇamevettha`: bản cũ "sự biết tri này, không tựa vào điều gì khác" và ghi chú cũ hiểu `para` là "điều kiện khác". Tiền lệ đo được: dn14 (3 khoá), sn12.15:2.6, sn22.90:9.8 đều hiểu là người khác ("không lệ thuộc người khác", "không do nương vào ai khác"). Nay "chỉ có trí về điều này, không do nương vào ai khác mà có"; bổ sung hô ngữ `bhikkhave` đã bị bỏ sót (tiền lệ "Nhưng này các tỳ-kheo" 7 khoá).
  (c) 5.1: "như thật sự sự khởi lên" (lặp chữ) và `evaṁ` không được dịch; nay "như vậy biết rõ, đúng như thật, sự khởi lên và sự diệt tận".
  (d) 4.11 "tan chấm dứt" thừa chữ "tan"; nay "chấm dứt".
  (e) 1.3, 3.2 `kiṁ nu kho—`: "rồi cái gì—" nghe như một câu hỏi riêng; nay "Vậy thì—" (bản Anh bỏ trống khoá này; chọn cách không thêm câu hỏi thứ hai).
  SỬA THUẬT NGỮ THEO ĐA SỐ, 16 khoá trong chuỗi mười hai duyên. Đo trên toàn tầng và trên riêng sn12: `saḷāyatana` "sáu xứ" 170/190 (sn12: 70/82) thay "sáu căn"; `phasso` "xúc" 195/247 (sn12: 106/126) thay "xúc chạm"; `bhavo` "hữu" 144/160 (sn: 56/57) thay "hữu sanh"; `jāti` "sinh" 282 so với "tái sinh" 35 (sn12: 141 so với 10) thay "tái sinh"; `nāmarūpa` "danh sắc" 233/325 (sn12: 107/114) thay "danh và sắc"; `taṇhā` "ái dục" chỉ 5/573 nên đổi "khát ái" như sn12.27, sn12.51 và sn12.66. Giữ "cảm thọ" và "chấp thủ" vì tiền lệ chia đều (thọ 532 so với cảm thọ 555; thủ 90 so với chấp thủ 67).
  ĐÃ KIỂM, KHÔNG ĐỔI. Dấu lược đúng một `…` ở 4.6, 4.7, 4.8, 5.1 (khớp Pāli từng khoá); 3.4 không có `…` vì Pāli không có; nháy đơn và nháy kép khớp Pāli từng khoá; 2.1 và 4.1, 2.14 và 4.10, 1.3 và 3.2 là các cặp Pāli trùng nguyên văn trong bài, bản Việt giống nhau từng cặp; số lượng không có; không Pāli lọt sang Việt.
  BẤT ĐỊNH CÒN LẠI. Cách dịch `kiṁ nu kho` ở 1.3 và 3.2 là lựa chọn không có tiền lệ trùng; 5.1 chỉ dịch `diṭṭhisampanno itipi` rồi dấu lược, phần danh xưng đã lược để Pāli tự đứng; `nirodha` và `nirujjhati` dịch "diệt tận" và "chấm dứt" (hai dạng cùng có tiền lệ).
  ĐIỂM. semantic_fidelity 9.3 thành 9.4, grammar_logic 9.3 thành 9.4, terminology 9.2 thành 9.5, vietnamese_clarity 9.3 thành 9.4; các điểm khác giữ nguyên. final_score 9.41 thành 9.47. Bản dịch song song sn12.50 vẫn mang các lỗi tương tự (chưa sửa ở đây).
