notes: |-
  Tiền lệ đã đếm: addhānapariññā → liễu tri chặng đường dài đã chốt ở sn54.20:1.4
  cùng phẩm (Sujato: completely understanding the course of time); chính tả liễu
  khớp byte với sn54.20. Đuôi công thức :1.1 lấy nguyên khung sn54.20:1.4.
  Pāli mở ngoặc “ không đóng: Việt đóng ” trước …. theo sn54.17 để ngoặc cân cả bài.
  Pāli có hai dấu lược (đầu và cuối), Việt giữ đủ hai; không mở rộng phần lược.
  Không đối chiếu được tầng Việt hiện hành: snapshot đã ghim chỉ có Pháp Cú tiếng Việt.
  Bất định: addhāna là chặng đường thời gian dài (luân hồi), không phải một kiếp cụ thể;
  cách dịch chặng đường dài giữ đúng độ mở của Pāli.
