notes: |-
  Đối chiếu Pāli + English Sujato (20/20 khoá). Lời dạy tại thị trấn Devadaha của người Sakya về phận sự đối với sáu xứ xúc: bậc A-la-hán đã làm xong việc với tâm không buông lung nên không cần làm nữa; bậc hữu học cần tinh cần không buông lung để tâm không bị các đối tượng khả ái và không khả ái chế ngự, làm phát khởi tinh tấn, chánh niệm, khinh an và định tĩnh. Số thứ tự uddāna 'Paṭhamaṁ' = Thứ nhất.
  
  20 khoá, tất cả đã dịch, không có khoá nào thiếu hay orphan.
  
  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
