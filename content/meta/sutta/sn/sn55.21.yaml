notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có 26 chương Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Hai tầng còn lại là Pāli root (authority) và bản Anh Bhikkhu Sujato đã ghim.
  - >-
    **Coverage tầng Anh 1,000** (18 Pāli có nội dung, 18 có chữ Sujato).
  - >-
    **Bài song song trùng Pāli, dùng lại nguyên văn — 15 khoá.** `sn55.22` (`Dutiyamahānāmasutta`, đã `published`) có **cùng Pāli** ở `:0.1 :0.2` và toàn bộ `:1.1`–`:1.13`, nên lấy nguyên văn; `:0.3` chỉ khác `Paṭhama`/`Dutiya` nên đổi thành *Kinh Mahānāma (Một)*. `Saraṇānivagga` → *3. Phẩm Quy Y* (2, đúng `sn55.22:0.2` và `sn55.29:0.2`).
  - >-
    **Ba mục còn lại (`:2.3`–`:3.8`) dịch mới.** `dīgharattaṁ …paribhāvitaṁ cittaṁ` → *tâm đã được nuôi dưỡng trong thời gian dài bởi niềm tín, giới hạnh, học thức, bố thí và trí tuệ*; `rūpī cātumahābhūtiko` → *hữu hình, do bốn đại tạo thành*; `odanakummāsūpacayo` → *gom từ cơm và cháo*; `aniccucchādanaparimaddanabhedanaviddhaṁsanadhammo` → *vốn chịu vô thường, mòn mẻ, bào mòn, tan vỡ và hư hoại* (giữ đủ năm vế); `uddhagāmi visesagāmi` → *hướng lên trên, hướng về cõi cao hơn*; `sakkharā vā kaṭhalā vā` → *mảnh vỡ và mẩu nhỏ*.
  - >-
    **Danh sánh loài ăn xác `:2.4` và `:3.4`.** `kākā / gijjhā / kulalā / sunakhā / siṅgālā` → *quạ / bồ câu / chim ưng / chó / lạc can*; `vividhā pāṇakajātā` → *vô số loài sinh vật nhỏ*. Không thêm *khác* vào *quạ* (Pāli chỉ liệt kê loài, không phải *quạ khác*).
  - >-
    **0 tiền lệ, đặt mới.** `udāyana`… không có; `visesagāma` → *cõi cao hơn*; `sappikumbhaṁ / telakumbhaṁ` → *bình sáp trong / một bình dầu*; `sutta` (trong `sutaparibhāvitaṁ`) → *học thức*.
  - >-
    **Ngoặc kép.** `:1.4` mở và `:1.13` đóng; `:2.1` mở và `:3.8` đóng — cân. `:3.7` Pāli **không** có dấu nháy nên bản Việt cũng không có (giữ đúng phân lớp lời thoại của Pāli).
  - >-
    **Dấu lược — quyết định từng khoá.** `:2.5 :3.3 :3.5 :3.6` có `…pe…`; bản Việt giữ **một** `…` mỗi khoá. Ở `:3.4` Pāli **không** lược nên bản Việt **không** mở đầu bằng `…` — đã sửa một lần sau lượt review đối kháng.
  - >-
    **Khác kho, có chủ ý — số đếm.** `Saṁyutta Nikāya` → *Tương Ưng Bộ* (xem `sn35.105`).
  - >-
    `technical_integrity` 9.6 vì bốn lệnh cổng **do coordinator chạy**, lát này đã tự kiểm mọi thứ còn lại bằng `_hvi.kiểm` (NFC, dấu lược khớp từng khoá, nháy kép cân trên cả bài, không Pāli lọt): `npm run validate` · `npm test` · `npm run check` · `npm run build`.
