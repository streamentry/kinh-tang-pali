notes: |-
  TẦNG THAM KHẢO CÓ. NHÓM `an`/`sn` CÓ TẦNG ANH. Coverage đo theo đúng công thức src/lib/canon/reference.ts, ngưỡng đọc từ source/layers.yaml (substantivePaliMinChars=40, excludeReferenceBlock=true, floor=0.8): 38 khoá Pāli có nội dung, 0 khoá không tầng Anh nào có chữ, tức 100%. Tệp Anh đã ghim có mặt trong source/upstream-manifest.json (tầng english-sujato, 4.291 tệp), nên đây là not-published-upstream=false: bài CÓ tầng tham khảo. Lớp lấp english-project của dự án không có cho uid này, nhưng không cần vì Sujato đã phủ hết. Tầng vietnamese-current vắng: tại commit đã ghim thư mục đó chỉ có 26 tệp, toàn bộ là Pháp Cú.

    DÙNG LẠI NGUYÊN VĂN — 12 khoá, đo bằng script dựng chỉ mục Pāli → Việt trên toàn tầng
    và đếm số khoá trùng từng chữ. 1.1 Sāvatthinidānaṁ (417/435), 1.2 Ekamantaṁ nisinno (19/30),
    1.3 (sn22.97:1.3), 1.4 (sn22.97:1.4), 1.7 (sn22.97:1.7), 1.8 (sn22.97:1.8),
    1.9 (sn22.97:1.9), 1.10 (sn22.97:1.10), 1.11 (sn22.98:1.11), 1.12 (sn22.97:1.12),
    0.2 Pupphavagga (6/6), 4.16 Catutthaṁ (đa số 157/253). Dãi
    `niccaṁ dhuvaṁ sassataṁ avipariṇāmadhammaṁ sassatisamaṁ tatheva ṭhassati` dịch y hệt
    sn22.97 và sn22.98 — cùng cấu trúc hỏi năm uẩn, hai bài kế ngay.

    DANH SÁCH 84.000 LẤY TỪ `dn17` (Kinh Đại Thiện Kiến Vương), Pāli gần trùng từng vế:
    `caturāsīti … sahassāni` = tám mươi bốn ngàn …, `kusāvatī rājadhānī` = kinh đô Kusāvatī,
    `dhammapāsāda` = cung điện Dhamma, `kūṭāgāra` = phòng mái nhọn, `pallaṅka` = giường,
    `nāgarājā` = tượng vương, `assarājā` = mã vương, `maṇiratatana` = ngọc báu,
    `pariṇāyakaratana` = vị chỉ huy báu, `dhenusahassāni dukūlasandānāni` = bò sữa cho sữa
    đầy bình đồng. `addhuvā` = không bền vững, `anassāsikā` = không đáng để nương tựa,
    `nibbindituṁ / virajjituṁ / vimuccitun` = nhàm chán / ly tham / giải thoát (dn17:2.16.1-2.16.5).

    KHÁC BIỆT CỐ Ý, GHI LẠI ĐỂ BIÊN TẬP PHÁN.
    (1) `mayhaṁ` của Đức Thế Tôn tôi dịch là tôi, không phải Ta như dn17: tầng `sn` đang
    dùng tôi 827 lần, đồng bộ với chính bộ mà bài này thuộc về.
    (2) `mahābyūhakūṭāgāra` tôi giữ làm tên riêng Mahābyūha, đúng cách dn17 giữ Mahāviyūha;
    chốt `_hvi.lọt_pāli` không thấy chữ này trong Pāli của bài vì Pāli chỉ có dạng ghép
    `mahābyūhakūṭāgārappamukhāni` và `mahābyūhaṁ` (có dấu ṁ), nên tôi khai tên vào bộ nhớ
    tiến trình đúng như docstring của chốt mô tả, thay vì đổi tên riêng.
    (3) 3.5 Pāli chỉ liệt kê ngà, gỗ quý, vàng — không có bạc — nên bản Việt cũng không thêm
    bạc; 4.4 có `rūpiyamayo` thì có bạc. Bản Anh đã ghim dịch cả hai giống y hệt nhau (ivory
    or heartwood or gold or silver); tôi theo Pāli vì Pāli là authority.
    (4) 3.5 tôi dịch đủ bốn cách phủ chăn (`goṇakattha / paṭikattha / paṭalikattha /
    kadalimigapavarapaccattharaṇa`) và tách `sauttaracchadāni` (màn che phía trên) khỏi
    `ubhatolohitakūpadhānāni` (gối đỏ hai đầu); dn17 gộp thành một mệnh đề và bỏ mất
    phía trên. Đây là chỗ tôi cố ý dịch đầy đủ hơn bản tiền lệ, ghi ra để không bị coi là lệch.

    LỖI BẮT ĐƯỢC Ở LƯỢT REVIEW ĐỐI KHÁNG, ĐÃ SỬA. (1) 3.6-3.8 tôi đã thêm động từ
    mang vào cụm `sovaṇṇaddhajāni` (cờ vàng), trong khi Pāli chỉ nói có cờ vàng; đã sửa
    thành có cờ vàng. (2) 4.10 tối đa chỉ đến là cụm thừa, đã sửa thành tối đa là.

    DẤU LƯỢC. Chín khoá có dấu lược, đúng bằng Pāli: 1.5 (…pe… của Pāli, tôi giữ đúng MỘT
    dấu … và không mở rộng), 1.9, 1.10, 1.11, và 3.10-3.14 (mỗi khoá một …pe…). Ở đâu khác
    không thêm dấu lược nào. Ngoặc kép bám đúng Pāli: mở 3 ở 1.3, 1.8, 2.2; đóng 3 ở
    1.7, 1.12, 4.15 — lưu ý Pāli để dấu đóng của lời Đức Thế Tôn từ 2.2 kéo dài tới 4.15.

    BẤT ĐỊNH CÒN MỞ. 4.8 `velāmikā` tôi dịch là nàng đào hoa; bản Anh đã ghim dịch là a
    coquette. Từ này không có tiền lệ nào trong kho (0 lần), nên tôi chọn cụm tiếng Việt
    thông dụng thay vì giữ chữ Hán–Việt; cách đọc còn lại là nàng làm ăn. Tôi không tự chắc
    hơn mức Pāli cho phép nên ghi ở đây.

    CỔNG KỸ THUẬT. Đợt này tôi bị cấm chạy npm run validate / test / check / build, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Những gì tôi tự kiểm được và đều sạch: JSON hợp lệ; đúng 49/50 khoá mỗi bài và tập khoá khớp tuyệt đối với all trong vc/c83.json; không orphan; không rỗng; không còn stub dạng (…); toàn bộ NFC; số dấu lược không bao giờ vượt Pāli và mỗi …pe… của Pāli còn đúng một dấu …; ngoặc kép cân trên cả bài; không có Pāli nào mà hai bài trong lát dịch khác nhau; và save_vi chạy lại cho ra đúng byte cũ (idempotent). Bốn lệnh cổng để coordinator chạy sau khi gộp lát.
