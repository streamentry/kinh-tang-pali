notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `4. Puññābhisandavagga` → «4. Phẩm Gặp Gác Công Đức». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Sửa lan 2026-10-13: khoá `sn55.37:0.2` (`4. Puññābhisandavagga`), *4. Phẩm Gặp Gác Công Đức* → *4. Phẩm Dòng Phước Chảy Tràn*. Căn cứ: `puñña` = phước/công đức, `abhisanda` = dòng chảy tràn; *Gặp Gác* không có nghĩa trong Pāli. Đo `Puññābhisandavagga` trong tầng: 20 khoá, 12 khoá *Dòng Phước Chảy Tràn* (`sn55.31:0.2`, `sn55.32:0.2` và 10 khoá `an4.51`–`an4.60`) so với 8 khoá *Gặp Gác Công Đức* (`sn55.33`–`sn55.40`). Đã kiểm: bài này không còn chữ *Gặp Gác*. Các bài `sn55.33`–`sn55.36`, `sn55.38`–`sn55.40` (kể cả các dòng thứ tự phẩm và uddāna ở `sn55.40`) vẫn mang dạng cũ, ngoài phạm vi lượt này. Đoạn *terminology fix* cũ ở trên ghi cách dịch *Gặp Gác* là theo đa số lúc đó, nay đã được thay. Không đổi điểm.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.1 — `nigrodhārāme` “tu viện Cây Bàng” → “tu viện Cây Đa” (`nigrodha` là cây đa; “Cây Đa” 20 khoá, “Cây Bàng” 6 khoá trong cùng công thức). Giữ “bộ tộc Thích-ca” và “thành Kapilavatthu” cho nhất quán với 1.2.
