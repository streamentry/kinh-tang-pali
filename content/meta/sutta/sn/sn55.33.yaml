  - >-
    Đối xứng cần nêu: `sn55.32` đưa **thế giới** (bốn điều kiện của gia chủ) vào vị thứ tư, `sn55.33` đưa **trí tuệ**. Cả hai vị đều là `catuttho puññābhisando`, và `sn55.34` đưa **điều lành** vào — đó là bốn dòng phước của `an4.51:1.2*` mà bản Việt đã dịch trước, nên thứ tự ở đây là nhất quán với tiền lệ.
