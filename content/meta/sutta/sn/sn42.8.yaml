notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không căn theo segment nên chỉ dùng để đối chiếu thuật ngữ và mạch lập luận). Tầng `vietnamese-current` căn theo segment không có cho bài này (tại commit đã ghim chỉ có 26 chương Pháp Cú); tầng `english-project` chưa có bản lấp cho bài này.
  **Coverage English = 65/88 = 0.739** khoá Pāli có nội dung (Pāli ≥ 40 ký tự, bỏ khối `:0`), **dưới sàn 0.80** ⇒ bài bắt buộc `draft`, không nâng điểm để né blocker (`triangulation` đặt 7.5, ≤ 8.0). Sujato có key cho cả 105/105 khoá nhưng để trống 23 khoá Pāli viết đầy đủ: `3.3`, `3.4`, `4.2`, `4.3`, `6.8`, `6.10`, `6.12`, `6.14`, `6.16`, `6.17`, `6.19`, `8.2`–`8.5`, `8.7`, `8.8`, `9.2`–`9.7` (Sujato gộp các vòng lặp của bốn giới `adinnādāna`, `kāmesumicchācāra`, `musāvāda` vào dấu lược `…` của vòng đầu). Ở các khoá ấy Pāli tự đứng vững, đối chiếu với bản Việt nguyên bài chỉ về thuật ngữ. Lớp lấp `english-project` cho 23 khoá này (nếu có) sẽ do cùng một người làm nên không tính là cách đọc độc lập. Chưa có entry trong `content/meta/reference-gaps.yaml` cho bài này; entry đó cũng không cứu được `published`.
  **Số Pāli.** Không có số lượng trong bài ngoài các thứ tự `dutiyaṁ`/`tatiyaṁ`/`catutthaṁ` → *thứ hai / thứ ba / thứ tư*, `catuddisā` → *bốn phương* và `Aṭṭhamaṁ` → *Thứ tám* (8). `yāvatako vā tāvatako vā` không phải số: dịch *nhiều ít thế nào đó*.
  **Dùng lại nguyên văn đã có, đếm được.** 10 khoá Pāli trùng nguyên văn với khoá ở bài khác, tổng 437 cặp; trong đó 109 cặp bản Việt khác. Dùng lại đúng dạng đã có: `0.2` (10/10 cặp *1. Phẩm Làng*), `1.1` (sn42.7), `6.4` (*Vị ấy nghĩ:*, dạng chiếm đa số 48/114 cặp; còn 66 cặp là dạng khác như *Người ấy nghĩ:* 28, *Vị ấy nghĩ như vậy:* 16), `7.7` (*Người ấy suy nghĩ như sau:*, 22/36 cặp), `14.2` (2/3 cặp), `14.4` (*Thứ tám.*, 245/250 cặp, còn 5 cặp là *Bài thứ tám* / *Kinh thứ tám*). Cố ý khác tiền lệ ở 3 chỗ: (1) `2.1`/`3.1` (7 cặp, cả 7 khác): tiền lệ viết *Này thôn trưởng, anh nghĩ sao về điều ấy?* (6 cặp) nhưng ở bài này Pāli kết bằng dấu phẩy và câu hỏi nằm ngay khoá kế tiếp (`2.2`/`3.2`), nên viết *Này thôn trưởng, anh nghĩ sao:* để câu hỏi không bị đứt; (2) `14.1` (3 cặp, cả 3 khác): giữ nguyên *Nói vậy xong, … nói với Đức Thế Tôn:* nhưng đổi tên thành *Asibandhakaputta*; (3) `14.3` (4 cặp, cả 4 khác): *con* (xưng hô với Đức Thế Tôn; sn và toàn tầng *ghi nhận con* 57 lần so với *ghi nhận tôi* 18 lần). Trong chính bài có 10 nhóm Pāli trùng nguyên văn (`2.1`=`3.1`; `2.4`=`3.4`=`4.3`=`5.3`; `6.3`=`7.6`; `6.8`=`6.12`=`6.17`=`6.22`; `6.9`=`6.13`=`6.18`; `6.16`=`6.21`; `7.15`=`8.7`=`9.6`; `7.16`=`8.8`=`9.7`; `8.4`=`9.4`; `12.2`=`13.4`) và cả 10 nhóm bản Việt giống nhau; không có cặp Việt khác nhau. Lỗi ngoài lát, báo không sửa: `sn42.6:1.1` và `sn35.126:1.1` (cùng Pāli `Ekaṁ samayaṁ bhagavā nāḷandāyaṁ viharati pāvārikambavane`) dịch *Bàn La Thiên, trong rừng giày dép*, trong khi `sn42.7:1.1` dịch đúng *Nāḷandā, trong vườn xoài của Pāvārika*.
  **Thuật ngữ chọn theo tiền lệ đếm được.** `pāṇātipāta` → *sát sinh* (254 khoá so với *giết* 24, *sát sanh* 10); `kāmesumicchācāra` → *tà dâm* (65 khoá so với *tà hạnh trong các dục/dục* 81 gộp, *hành dâm* 39; trong `an10` 27/32 và trong sn 11/18 là *tà dâm*; Sujato *sexual misconduct*); `musāvāda` → *nói dối* (309/332); `pisuṇā vācā` → *nói hai lưỡi* (89/160); `pharusā vācā` → *nói lời ác* (42 so với *nói ác khẩu* 34, *lời thô ác* 34; cũng là cách `sn42.6` viết); `samphappalāpa` → *nói lời phù phiếm* (49 so với *nói phù phiếm* 49 và *nói lời vô ích* 29 — hai dạng đầu ngang nhau, chọn dạng đủ chữ); `āpāyiko nerayiko` → *đi đến đọa xứ, địa ngục* (`iti48`, `iti89`; tiền lệ trong tầng chỉ 6 khoá *đọa xứ, địa ngục* trong 31 khoá chứa `āpāyika`/`nerayika`, còn lại là *địa ngục*, *bại vong*, *cõi ác*); `yathābhataṁ nikkhitto evaṁ niraye` → *như vật đã được mang đến, bị đặt vào địa ngục* (114/157 khoá; `sn42.9:4.12` viết khác: *bị đặt vào địa ngục như bị đưa vào đó*, ngoài lát, chưa đồng bộ); `vippaṭisārī` → *hối tiếc* (124 so với *hối hận* 25); `saṅkhadhamo` → *người thổi tù và* (*tù và* 9/10); `abhippasanno` → *có lòng tin sâu sắc* (*lòng tin* 16 so với *tịnh tín* 1); `nīyati` → *bị … dẫn dắt* (*dẫn dắt* 8 so với *dẫn đi* 1, `an4.186`); `pamāṇakataṁ kammaṁ` → *nghiệp hữu hạn* (`dn13`; `mn99` viết *nghiệp có hạn lượng*, 4 khoá so với 2); `bahulīkata` → *làm cho sung mãn* (456/594); `ariyasāvako` → *Thánh đệ tử* (240 so với *thánh đệ tử* 125); `cetovimutti` → *tâm giải thoát*; `vigatābhijjho vigatabyāpādo` → *đã rời bỏ tham lam, đã rời bỏ sân hận* (`an10.219`); `gāmaṇi` → *thôn trưởng* (114 lần so với *Thôn trưởng* 4 lần); `Nigaṇṭha Nāṭaputta` giữ dấu Pāli (106 lần so với *Ni-kiền-tử* 5 lần); công thức Như Lai theo dạng đa số của sn (10 khoá), công thức mettā theo `an10.219`. `Asibandhakaputta` giữ nguyên dạng Pāli (như Hòa thượng Thích Minh Châu): tầng đang có ba dạng khác nhau (`sn42.6`/`sn42.9` *Asibandhaka*, `sn42.7` *Asibandhaka, con trai của Asibandhaka*), không dạng nào chiếm đa số.
  **Bất định đã ghi nhận, không che.** (1) `samayāsamayaṁ upādāya` (`2.2`–`5.2`) dịch *tính theo từng lúc trong đêm hay ngày*: Sujato *compare periods of time*, Hòa thượng Thích Minh Châu *thỉnh thoảng làm*; không dạng nào nằm ngoài nghĩa Pāli nhưng sắc thái *thỉnh thoảng* của Hòa thượng không có trong bản này. (2) `na metaṁ pāpaṁ kammaṁ akataṁ bhavissati` (`7.12`, `8.4`, `9.4`, `10.3`) dịch *ác nghiệp này của ta sẽ không trở thành điều chưa từng làm*, theo Sujato (*I can’t undo what I have done*); Hòa thượng Thích Minh Châu đọc `akataṁ` thành *nay sẽ không làm nữa*, lệch hướng với câu `Ahañceva … vippaṭisārī assaṁ`. (3) `Yaṁbahulaṁ yaṁbahulaṁ viharati, tena tena nīyati` (`1.6`) — Hòa thượng dịch *chiều hướng ấy sanh thú của họ sẽ như vậy*, Sujato *led on by what you frequently live by*; bản này theo Sujato vì `nīyati` là thể bị động của `nayati` (*bị dẫn*). (4) Trong `1.8`, `2.4`, `3.4`, `4.3`, `5.3` Pāli đặt hô cách `gāmaṇi` ngay giữa câu được trích (`‘Yaṁbahulaṁ yaṁbahulañca, gāmaṇi, viharati …’`); bản Việt giữ `này thôn trưởng` ở đúng vị trí đó, không dời ra ngoài lời trích. (5) Dấu nháy: Pāli `6.5` chỉ mở `‘` và `6.14` chỉ đóng `’`; các khoá `6.6`–`6.13` không có dấu nháy; bản Việt giữ đúng như vậy, không tự thêm dấu nháy để khép lời trích. (6) `6.7`, `6.11`: `…ahampamhi āpāyiko nerayikoti diṭṭhiṁ paṭilabhati` — *ahampamhi* = *ta cũng là*; bản Việt dịch *vậy ta cũng là kẻ đi đến đọa xứ, địa ngục — người ấy có được quan điểm như vậy*, không thêm dấu nháy vì Pāli `6.7`/`6.11` không có. (7) `7.8`, `8.1`, `9.1`, `10.1`: Pāli `viramathāti cāha` không có dấu nháy trong lời Đức Thế Tôn trích lại; bản Việt viết *bảo rằng hãy tránh xa …* (gián tiếp), không thêm nháy kép. (8) `13.1` Pāli `…pe…` đứng sau `karuṇāsahagatena cetasā` nên bản Việt kết bằng *với tâm bi …* (không thêm *an trú*), và `13.2` kết bằng *với tâm hỷ ….* đúng dạng Pāli `…pe….`.
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 105/105, đúng thứ tự Pāli. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá, 105 khoá (mẫu số 105, 0 lệch); tổng Pāli `“`12 `”`12 `‘`18 `’`18 và bản Việt đúng bằng. Dấu lược: 3 khoá Pāli có `…pe…` (`13.1`, `13.2`, `14.2`); cả 3 khoá Việt giữ đúng một `…`, không mở rộng, không dùng `…` để nén thêm; Pāli kết `…pe….` ở `13.2` thì Việt kết ` ….` theo đa số của tầng. NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang bản Việt (chỉ các tên riêng `Nāḷandā`, `Nigaṇṭha`, `Nāṭaputta`). Đã in cặp Pāli↔Việt từng khoá để đọc đối kháng.
