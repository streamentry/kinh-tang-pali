  ⚠ COVERAGE ANH Ở ĐÂY KHÔNG PHẢI MỘT LẦN ĐỌC ĐỘC LẬP, nên `triangulation` bị hạ xuống
  8.0. `content/meta/en/sn/sn14.18.yaml` có `status: published` cho 5 khoá `2.2`–`2.6`, và
  `assessed_by` của nó trùng đúng tên người viết (*OpenCode Space Bunny Free (agent)*) —
  tức nhánh cảnh báo trong `scripts/validate.ts` sẽ chạy, và đúng như cảnh báo ấy: scorecard
  tiếng Việt này **không được tính là đã đối chiếu English** ở 5 khoá đó. 31/36 khoá còn
  lại là bản Sujato thật. Lớp lấp ấy dùng lại y nguyên văn cách dịch của `1.3`–`1.8` (sáu
  vế trùng nguyên văn), nên về chất lượng nó không thêm thông tin mới — nhưng người đọc vẫn
  phải được biết là do cùng một người làm, nên tôi ghi rõ thay vì để `triangulation` cao.

  `Assaddhamūlakasutta` (0.3) — 6 tiền lệ `…mūlakasutta`, 6 cách: *Kinh Chín Pháp Căn Của
  Tham*, *Kinh Khởi Từ Sự Hổ Thẹn* (`sn14.19`), *Kinh Bắt Đầu Bằng Không Tàm Quý*
  (`sn14.20`), *Kinh Lấy Ít Học Làm Gốc*, *Kinh Lấy Biếng Nhác Làm Gốc*, *Kinh Gốc Rễ Xúc*.
  Đa số (2/6) là mẫu *Kinh Lấy … Làm Gốc*, tức giữ cả vế `mūla`; tôi theo mẫu ấy ⇒ *Kinh
  Lấy Vô Đức Tin Làm Gốc*. Cụm `assaddhā` trong chính bài này đã dịch *không có đức tin*
  (`sn14.20` dùng *không tàm quý* cho `anottappino`), nên *vô đức tin* là nhất quán.
  `paññavanto` → *có trí tuệ* (tiền lệ `sn14.20:1.7` dùng *có trí tuệ*, `sn14.20:3.5` dùng
  *có trí*); tôi theo *có trí tuệ* vì khớp `duppaññā` → *kém trí* trong cùng danh sách.

  `2.6` — PĀLI là `…samentīti.` (không có `”`), trong khi PĀLI đóng ngoặc kép ở `6.6`. Tôi
  KHÔNG đóng ngoặc kép ở `2.6` (đóng sớm sẽ phá cấu trúc trích dẫn và làm ngoặc kép lệch),
  và bỏ `ti` — vì `ti` ở đây chỉ là dấu kết câu thoại, không mang nghĩa. Tương tự `4.2`–`4.5`
  và `5.2`–`6.6`: bản Việt viết **thường/hoa theo y hệt PĀLI** (`assaddhā` nhỏ ở `4.2`/
  `5.2`/`6.2`, `Assaddhā` hoa ở `1.3`/`2.2`/`3.2`), nên các khoá có PĀLI trùng nhau ở đây lại
  có Việt lệch nhau — đây là **phản ánh đúng chữ hoa của PĀLI**, không phải lỗi.

  `appassutā appassutehi` (4.3) có tiền lệ **1 tệp** (`sn14.20:1.4`) dịch theo mẫu *hòa nhập
  và gặp gỡ*, trong khi 10/11 khoá còn lại có tiền lệ trong chính bài này dùng *hòa hợp và tụ
  hội*. Tôi theo *hòa hợp và tụ hội* vì giữ nhất quán trong một danh sách; đây là điểm cố ý
  lệch tiền lệ 1-tệp, ghi lại cho người biên tập. Tương tự `kusītā` (tiền lệ 2 tệp, 2 cách,
  hoà), `āraddhavīriyā` và `upaṭṭhitassatino` (tiền lệ 2 tệp nhưng 2 cách — *người có trí*
  thay *người có trí tuệ*) — tôi ghép danh từ theo đa số với cụm động từ theo đa số.
  `paṭhamavāro viya vitthāretabbo.` (3.8) → *(Cần giảng rộng như bài trước.)* — tiền lệ 2 tệp;
  đây là chú thích của người biên soạn chứ không phải lời kinh, nên tôi giữ ngoặc tròn như PĀLI
  và các tiền lệ. `3.1` kết bằng dấu chấm như PĀLI, dù bản Anh Sujato dùng dấu hai chấm.

  Dấu lược: giữ **đúng một** `…` cho mỗi `…pe…` của PĀLI, không mở rộng, và KHÔNG thêm
  dấu lược vào khoá mà PĀLI không lược. Đây là điểm cần nói rõ vì bản Anh Sujato ở commit
  đã ghim có **tra dấu `…` vào nhiều khoá mà PĀLI không lược** (ví dụ `4.2`–`4.4` của
  `sn14.18` mỗi khoá kết bằng `…` bên Anh, trong khi PĀLI kết bằng `;`). Tôi theo PĀLI.
  Đếm: sn12.43 = 8, sn12.44 = 11, sn14.18 = 9; `save_vi` của `_hvi.py` đã bắt khớp từng
  khoá.

  Tiền lệ dùng lại nguyên văn (đếm trên tầng Việt dự án, kèm số tệp) được ghi trong
  `_tvd_67.py` ngay trên mỗi `save_vi`. Vài chỗ cố ý theo đa số dù tiền lệ lệch:
  · `Sāvatthiyaṁ viharati.` → *Trú ở Sāvatthī.* (**75 tệp**; *Đang sống tại Sāvatthī.* 53;
    *Trú tại Sāvatthī.* 6 — `sn12.45`/`46` dùng cách 6 tệp này vì cùng phẩm, nhưng đa số
    toàn tầng và `sn14.14` cùng loạt đều là 75 tệp, nên tôi theo 75).
  · `Catutthaṁ.` → *Thứ tư.* (**140 tệp** ⟵ *Thứ bốn.* 93).

  Bất định chung của ba bài `sn` trong lát:
  · `dhātusova` — Sujato đọc là *an element* (theo `dhātu` = phần tử), còn từ điển tra đọc
    là *xét về nghĩa lý, do giới tánh*. Tôi theo *do giới tánh* theo đa số tiền lệ
    (`sn14.14:1.2`, 9 tệp). `sn14.19:1.2` đã dịch ngược lại thành *Về nghĩa lý* — là bất
    đồng ở cấp toàn kho, đề nghị người biên tập thống nhất; tôi không tự sửa bài đã có.

