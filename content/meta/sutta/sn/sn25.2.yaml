  DẤU LƯỢC §10. Không khoá nào trong lát này được MỞ RỘNG chỗ Pāli lược. Bản Anh Sujato đã ghim mở rộng nhiều chỗ `…pe…` (ví dụ `sn45.24:2.2` và `sn55.31:4.1` liệt kê đủ tám ngành Bát Chánh Đạo, `sn46.14:3.3` liệt kê đủ bảy giác chi) — tôi KHÔNG theo, vì mở rộng là thêm chữ không đánh dấu. Cũng không khoá nào bị nén thêm: mọi `…` trong bản Việt đều ăn đúng một dấu lược ứng với một `…pe…` của Pāli, đếm từng khoá.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC. `sn25.1` là bài em cùng phẩm, và **5 khoá
    có Pāli trùng nguyên văn**: `1.9`/`2.2`, `1.10`/`2.3`, `2.1` đã dùng lại đúng nguyên văn
    đã có. Cùng bộ `saddhānusārī/dhammānusārī` → *tùy tín/tùy pháp* theo `sn25.1` và
    `dn33:2.3.44` (không theo *tùy tín hành* của `mn65/70` hay *thọ trì theo tín* của
    `an7.14/an10.16`). `sotāpanno avinipātadhammo niyato sambodhiparāyano` → *bậc nhập lưu,
    không rơi vào ác đạo, chắc chắn, hướng về giác ngộ* (nguyên văn `sn25.1:2.4`).
    `aniccā vipariṇāmino aññathābhāvino` → *vô thường, biến hoại, đổi khác* theo `sn25.1`
    (cùng ba tính từ `vipariṇāmi aññathābhāvi`), không theo *làm thay đổi khác thường* của
    `sn25.3` hay *chuyển biến, khác thường* của `sn25.4`. Sáu tầng khả giới `rūpā/saddā/
    gandhā/rasā/phoṭṭhabbā/dhammā` → *các sắc/các thanh/các hương/các vị/các xúc chạm/các
    pháp*, theo từ vựng của `dn22:18.31` (*những sắc, thanh, hương, vị, xúc và pháp*) và
    `mn137`/`sn35.100` cho *rūpā* → *các sắc*. Tên phẩm: `Cakkhuvagga` → *1. Phẩm Mắt* (8
    bài, toàn bộ đồng thuận); `Rūpasutta` → *Kinh Sắc* (3 bài, đa số). 0 tiền lệ, đặt mới:
    không có.
