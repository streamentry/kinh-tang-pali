  nên giữ đã được tu tập theo khuôn sn46.58; 1.2 Thứ bảy. có 221 đoạn.
  Tiêu đề Kinh Lòng Bi chưa có tiền lệ, đặt song song với Kinh Lòng Từ của
  bài mettā ngay trước; ghi ở đây để người biên tập quyết nếu muốn dạng khác.
