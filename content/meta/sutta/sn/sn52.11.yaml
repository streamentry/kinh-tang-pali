  - >-
    Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên **48.784 segment đã `published`**: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Khớp **48.359 / 48.784 = 99,13%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ (`hay` được miễn vì `vā…vā…vā` là cấu trúc).
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Có tiền lệ: `Nīvaraṇavagga` → *4. Phẩm Chướng Ngại* (`sn46.31`, 4 bài) · `Pabbatavagga` → *1. Phẩm Núi* (`sn46.10`) · `Sīlaṭṭhitivagga` → *3. Phẩm Giới Và Trú* (`sn47.27/28`, 2 bài) · `Jarāvagga` (Sn 48) → *5. Phẩm Già* (`sn48.47/48`) · `Sūkarakhatavagga` → *6. Phẩm Núi Khỉ* (`sn48.59`) · `Cāpālavagga` → *1. Phẩm Lá Câu* (`sn51.1`, 4 bài) · `Pāsādakampanavagga` → *2. Phẩm Vui Vẻ* (`sn51.18`) · `Dutiyavagga` → *2. Phẩm Thứ Hai* (`sn11.11` v.v., 76 bài) · `Oghavagga` → *Phẩm Bộc Lưu* (Sn 49 `sn49.45-54`, 2 bài) — **lưu ý** Sn 45 dùng *Phẩm Dây Xích* (9 bài), Sn 46 *Phẩm Dòng Chảy* (1), Sn 48 *Phẩm Bộc Lưu* (1): năm bài `sn47.95-104`, `sn51.77-86`, `sn53.45-54` theo *Bộc Lưu* vì đó là cách đã có tiền lệ cho `ogha`; **người biên tập nên thống nhất toàn bộ Sn 45–49.** · `Puññābhisandavagga` → *4. Phẩm Gặp Gác Công Đức* (`sn55.38`) · `Ekadhammavagga` → *1. Phẩm Một Pháp* (`sn54.2`) · `Rahogatavagga` → *1. Phẩm Ở Riêng* (`sn52.6`) · `Abhisamayavagga` (Sn 56) → *6. Phẩm Chứng Ngộ* (5 bài). **Hai chỗ điểm hoà phải ghi rõ:** `Veḷudvāravagga` — `sn55.2` ghi *1. Phẩm Cổng Tre*, `sn55.9` ghi *1. Phẩm Veḷudvāra*; bài này theo *Veḷudvāra* vì giữ địa danh Pāli như *Devadaha*/*Jambukhādaka*. `Aññatitthiyapeyyālavagga` 0 tiền lệ → *5. Phẩm Chuỗi Lặp Lời Dạy Khác Nhau*.
  - >-
    Câu chữ bám **sn52.6** (đã xuất bản, cùng bài hỏi Tôn giả Anuruddha về `mahābhiññataṁ patto`): *Tôn giả Anuruddha do tu tập và làm cho sung mãn các pháp nào mà đạt được đại thắng trí* · *Chính do tu tập và làm cho sung mãn bốn niệm xứ…* · *Là bốn nào?* · *Và cũng do tu tập…* — và công thức bốn Chánh Trừng Phạt **rút gọn** đúng như `sn52.6:1.4–1.7*` (xem ghi chú ở `sn52.4`).
  - >-
    0 tiền lệ, đặt mới, ghi kèm lý do: `Kappasahassasutta` → *Kinh Hơn Một Nghìn Kiếp* (Sujato *Aeon After Aeons*; `kappasahassa` = hơn một nghìn kiếp) · `kappasahassaṁ anussarāmī` → *ta nhớ suốt hơn một nghìn kiếp* — dựng theo đối xứng `sahassaṁ lokaṁ abhijānāmī` → *ta thắng tri ngàn thế giới* ở `sn52.6:1.9*` (cùng bài, cùng cấu trúc `Imesañca panāhaṁ`); `anussarāmi` = *ta nhớ*, khác `abhijānāmi` = *ta thắng tri*.
  - >-
    Bất định đã ghi: `1.2` Pāli có `…pe…` che phần văn của Đức Thế Tôn (`…saddhiṁ …pe… ekamantaṁ nisinnā`), nên bản Việt nối thẳng *đến rồi chào hỏi Tôn giả Anuruddha … ngồi một bên…* — không tự viết lại phần bị che. Đây là điểm dễ bịa thêm; đã giữ đúng mức.
