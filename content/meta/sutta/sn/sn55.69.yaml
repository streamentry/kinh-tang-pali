  1.1 theo khung sn55.74:1.1, giữ dấu lược đầu như Pāli, đưa đến chỗ tuệ.
  sīgha thành mau chóng là đặt mới, 0 tiền lệ cho sīghapaññā trong kho, theo
  Sujato Fast. Dùng mau chóng để phân biệt với javana nhanh nhạy ở sn55.72
  cùng lát, cả hai Pāli đều có nghĩa nhanh nhưng là hai bài khác nhau nên
  không được làm phẳng thành một chữ.
  1.2 Aṭṭhamaṁ thành Thứ tám, đúng thứ tự sau Sattamaṁ ở sn55.68.
  Tầng Anh Sujato để trống 1.2 (từ đánh số thứ tự dưới 40 ký tự, không phải
