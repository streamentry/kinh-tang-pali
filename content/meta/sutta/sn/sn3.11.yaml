notes: |-
  Coordinator (gộp thuật ngữ tên bộ, 2026-10-04): khối `:0.1` đổi "Tương Ưng Bộ" → "Saṁyutta Nikāya". Đếm lại trên toàn tầng: 1.211 tệp giữ PĀLI / 326 tệp dịch — 78,8% giữ PĀLI. Hai agent cùng đếm gần giống nhau rồi kết luận ngược nhau (1.187 vs 315 và 1.074 vs 316), nên đã đếm lại từ đầu thay vì theo lời báo. Đây là tên bộ ở khối tiêu đề, không đổi nghĩa segment nào. Phạm vi: cả tầng sn, gồm cả tệp đã merge trước đợt này.

  Sửa lan 2026-10-13 (accuracy fix): khoá sn3.11:9.3–9.4 — Pāli `Susaññatānañhi viyañjanena,
  asaññatā lokamimaṁ caranti`: `susaññatānaṁ` (khéo tự chế) bổ nghĩa cho `viyañjana` (dấu hiệu bên
  ngoài); chủ ngữ của `caranti` là `asaññatā` (những kẻ không tự chế). Trước: “vì những kẻ không
  tự chế ngự, với những cử chỉ giả tạo, / đi lại trong đời này” — đảo `susaññata` thành “không tự
  chế” và đẩy `asaññatā` ra khỏi chủ ngữ. Sau: “vì mang dấu hiệu bên ngoài của những bậc khéo tự
  chế, / những kẻ không tự chế đi lại trong đời này.” Căn cứ: Pāli root; cùng Pāli ở ja518:36.3
  “mang dấu hiệu của những bậc tự chế tốt” và ja522:2.3, ja522:4.4, tha-ap65:1.4, ja545:183.2 đều theo nghĩa “khéo/tốt tự chế” (5 khoá; hai khoá còn lại ja26:1.3 và tha-ap154:7.2 mang nghĩa khác). Đồng
  bộ tiêu đề: `translationTitle` trước là “Kinh Bảy Vị Lõa Thể” lệch khoá `sn3.11:0.3` (“Kinh Bảy
  Đạo Sĩ Bện Tóc”, `sattajaṭila`), nay đổi cho khớp. Điểm không đổi.
