notes: |-
  Coordinator (gộp thuật ngữ tên bộ, 2026-10-04): khối `:0.1` đổi "Tương Ưng Bộ" → "Saṁyutta Nikāya". Đếm lại trên toàn tầng: 1.211 tệp giữ PĀLI / 326 tệp dịch — 78,8% giữ PĀLI. Hai agent cùng đếm gần giống nhau rồi kết luận ngược nhau (1.187 vs 315 và 1.074 vs 316), nên đã đếm lại từ đầu thay vì theo lời báo. Đây là tên bộ ở khối tiêu đề, không đổi nghĩa segment nào. Phạm vi: cả tầng sn, gồm cả tệp đã merge trước đợt này.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 14.3 — công thức ví dụ ‘nikkujjitaṁ vā ukkujjeyya…’ dùng lại nguyên văn bản dịch của `dn16`, `dn9`, `dn2` và các bài khác (5/11 khoá cùng Pāli), vì bản cũ thiếu cặp nháy đơn mà Pāli có quanh ‘cakkhumanto rūpāni dakkhantī’ và bỏ hô ngữ ‘bạch Thế Tôn’; khoá 14.5 — thêm hô ngữ ‘Bạch Thế Tôn’ cho `bhante` theo `an8.12`/`an10.176`. Giữ nguyên các khoá còn lại của lời quy y.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 14.4 — «Đệ tử xin quy y Đức Phật, quy y Pháp, quy
  y chúng Tỷ-kheo» → «Bạch Thế Tôn, đệ tử xin quy y Thế Tôn, quy y Pháp và quy y Tăng chúng
  tỳ-kheo», vì Pāli có hô ngữ bhante và bhagavantaṁ, và đây là cách dịch của 7/15 khoá trùng; chữ
  «Tỷ-kheo» (chỉ 26 lần trên toàn tầng, tất cả còn lại viết «tỳ-kheo») được đồng bộ ở khoá 3.6,
  12.1, 13.6.
