  **Về dấu lược — 0 lệch, đo từng khoá.** `…pe…` ở **4** khoá (`1.1`, `3.1`, `11.1`,
  `17.1`) ⇒ **một** dấu `…` mỗi khoá; `…` trần ở **9** khoá (`11.2`–`11.8`, `17.2`,
  `17.3`) ⇒ **một** dấu `…` mỗi khoá. **Không có khoá nào Pāli viết đủ mà tôi nén bằng
  `…`**, nên không có chỗ nào cần người biên tập phán xử theo §10.2. Riêng `11.1`
  (`“ …pe…`) vừa **mở** ngoặc kép vừa mang dấu lược — tôi giữ cả hai, y hệt
  `sn35.74:14.1` (`“…`) và `sn18.11:1.12` (`“Với tai …`). `3.1` cũng vậy: Pāli
  `“Na me, bhante, khamanīyaṁ, na yāpanīyaṁ …pe…` chỉ còn *… không đủ sức gì …*, tôi
  **không** bổ sung *các cảm thọ khổ của con càng lúc càng gia tăng…* như Sujato và như
  `sn35.74:3.1`.

  **⚠ `17.2`–`17.4` là chỗ tôi phải tự quyết, và đã ghi lại đây.** Pāli cho ba khoá này
  **không** có động từ (chỉ `manasmimpi …`, `manoviññāṇepi …`,
  `manosamphassepi nibbindati.`), vì `…pe…` ở `17.1` đã nuốt mệnh đề `nibbindati` của
  các căn trước. Tôi **không lặp lại** động từ (sẽ là thêm chữ ngoài Pāli), mà để
  `… chán nản cả mắt … cả tâm … cả tâm thức … chán nản cả tâm xúc.`; `cả tâm thức`
  và `cả tâm xúc` có tiền lệ ở `sn35.60:1.14`. Người biên tập nếu muốn dùng kiểu lặp
  động từ như `sn35.52:1.12` thì phải sửa cả ba bài cùng công thức cho khớp.

  **Thuật ngữ, kèm số đếm (đo trên toàn tầng Việt dự án):**
  `anupādāparinibbāna` → *Bát-niết-bàn không còn chấp thủ* (**14** khoá; và
  `Anupādāparinibbānasutta` đã đặt là *Kinh Viên Tịch Không Chấp Thủ*). Vì chỉ có 1
  khoá cho đúng Pāli `Anupādāparinibbānatthaṁ …`, `terminology` hạ ở 9,2. `nibbinda`
  → *chán nản* (`Chán nản rồi ly tham…` **19** khoá). `kukkucca / vippaṭisāro` →
  *hối hận / sự hối tiếc*; `attā sīlato upavadatī` → *tự thấy mình có lỗi lầm về giới
  pháp* (y hệt `sn35.74:7.1`). `khamanīyaṁ / yāpanīyaṁ` → *dễ chịu / đủ sức*.
  `paṭikkamanti / abhikkamanti` → *thuyên giảm / gia tăng*. `veyyākaraṇasmiṁ
  bhaññamāne` → *trong khi bài pháp này đang được thuyết giảng* (y hệt `sn35.74:21.3`).
  `anupādāya āsavehi cittaṁ vimuccīti` → *tâm … được giải thoát khỏi các lậu do không
  chấp thủ* — đọc `āsavehi` là cách phương tiện của `anupādāya`, nên **không** dịch là
  *hoặc* như vài bài cũ đã làm (`sn22.*`, `an*`: *giải thoát khỏi lậu **hoặc** không
  còn chấp thủ*); cách đọc của tôi khớp `sn22.*` `… được giải thoát khỏi các lậu hoặc
  **vì** không còn chấp thủ`. `bhagavato bhāsitaṁ abhinandi` → *hoan hỷ và tán đồng lời
  Đức Thế Tôn dạy* (y hệt `sn35.74:21.2`). `Idamavoca bhagavā` → *Đức Thế Tôn nói như
  vậy* (**27** *nói như vậy* vs **5** *nói vậy*). `Sādhu sādhu` → *Lành thay, lành thay*
  (y hệt `sn35.74:12.1`). `Dasamaṁ/Dutiyaṁ` → *Thứ mười.* / *Thứ hai.* (**252** /
  **260**).

  **Những chỗ 0 tiền lệ, tôi dịch mới và ghi lý do:** `7.1`, `8.2`, `8.3` — cụm
  `anupādāparinibbānatthaṁ/mayā dhammaṁ desitaṁ ājānāsi` chưa có bản Việt nào ở đúng
  Pāli này; tôi bám khung của `sn35.74:11.1`–`12.3` (Pāli chỉ khác ở
  `rāgavirāga` → `anupādāparinibbāna`): *thật không phải là con biết rõ…* /
  *Lành thay là phải, này tỳ-kheo, ngươi biết rõ là…* /
  *Chính là vì mục đích … Ta đã giảng pháp*.

