  **DÙNG LẠI NGUYÊN VĂN — 14 khoá Pāli TRÙNG NGUYÊN VĂN với bài đã có**, đếm bằng
  script (chỉ mục 94.570 biến thể Pāli / 146.749 segment Việt của 5.312 bài đã merge):
  `sn24.44:2.1`–`2.7` lấy nguyên văn `sn24.70:2.1`–`2.7` (bài cùng công thức
  `adukkhamasukhī`, cùng phẩm, đã publish) — trong đó `2.1` trùng nguyên văn cả
  `sn24.19`/`sn24.18`/`sn24.36` (15 khoá) và `2.6` trùng `sn22.152`/`sn24.1`/`sn24.19`
  (16 khoá). `3.1` trùng nguyên văn `sn24.37:3.1` (1 khoá). `2.3`–`2.5` lấy nguyên
  văn `sn24.70:2.3`–`2.5` (9 / 21 / 23 khoá tiền lệ cho ba vế `sati …`). `3.2` và
  `3.12` = *Vô thường, bạch Thế Tôn* (14 khoá: `sn22.97`, `sn22.151`, `sn24.2`,
  `sn24.3`, `sn24.10`, `sn24.18`). `3.3` và `3.13` = *còn cái chịu biến hoại ấy mà
  không chấp thủ thì lẽ nào ý kiến như sau vẫn khởi lên* (2 khoá: `sn24.18`, `sn24.37`,
  cùng Pāli trùng từng chữ). `3.6`/`3.16` (4 khoá: `sn24.19`, `sn24.36`, `sn24.37`).
  `3.8` = *Cảm thọ* (19 khoá). `3.11` = *thức là thường còn hay vô thường* (27 khoá).
  `3.18` = *Chuỗi lặp thứ chín mươi tư* (`sn24.70:3.21`). `4.0` = *Tóm lược:* (178 khoá
  `:5.0`/`:6.0` của tầng sn). `4.1`–`4.4` lấy nguyên văn `sn24.18:5.1`–`5.4` cho
  `Vātaṁ etaṁ mama…` (Pāli khác hai chữ `so`).

  **Bốn khoá `‘adukkhamasukhī attā hoti arogo paraṁ maraṇā’` (`2.2`, `2.7`, `3.4`,
  `3.17`)** trùng nguyên văn `sn24.70` và `sn24.96` (3 khoá) — *Tự thân vừa không khổ
  vừa không vui, sau khi tử vẫn không mang bệnh*.

  **⚠ BẤT ĐỊNH ĐÃ PHÂN XỬ, CẦN NGƯỜI BIÊN TẬP XÁC NHẬN — dấu nháy kép ở `2.3`.**
  Pāli `sn24.44` **tự nó không cân nháy kép toàn bài**: đếm bằng script, tổng
  `“`−`”` chạy từ `0` xuống `-1` ngay ở `3.14` và kết thúc ở `-1` (10 dấu mở, 11 dấu
  đóng), vì `…pe…` đã nuốt mất dấu đóng của ba lời thoại. Bản Việt bắt buộc cân, nên
  tôi thêm **đúng một** dấu `“` ở `2.3` — cùng vị trí và cùng chữ với `sn24.70:2.3`
  (*“Khi có cảm thọ …*), vì `sn24.70` là bài cùng công thức có Pāli đầy đủ ở đây.
  Đây là thêm *dấu câu*, không thêm chữ; `sn24.18:2.2` cũng gộp luôn `vedanāya /
  saññāya / saṅkhāresu / viññāṇe sati` sau một `…pe…` nên không thể đem làm chứng về
  dấu nháy. Nếu người biên tập muốn giữ Pāli tuyệt đối ở `2.3` thì phải bỏ dấu `”`
  ở `3.4` và `3.14` để cân — tôi chọn cách ít sửa Pāli hơn.

  **Những chỗ 0 tiền lệ, tôi dịch mới và ghi lý do:**
  `1.1` (vế bị lược của bài trước, 0 tiền lệ) dựng lại từ chính `2.2` của bài; `3.19`
  `Dutiyapeyyālo.` (0 tiền lệ) dựng theo `sn24.70:3.22` *Chuỗi lặp thứ ba* cho
  `Tatiyapeyyālo.`; `5.1`–`7.6` là uddāna của phẩm, **không câu Pāli nào trùng** (quét
  cả 5 bộ: `Rūpī attā hoti…`, `Ime chabbīsati suttā`, `Dutiyavārena desitā`,
  `Sassato asassato ceva`, `Taṁ jīvaṁ aññaṁ jīvañca`, `Vātaṁ etaṁ mama so`,
  `mahādiṭṭhena aṭṭhamaṁ` đều 0 khoá trùng), nên tôi dịch mới nhưng bám đúng từ vựng
  `sn24.18:5.1`–`7.3` đã có: `sassato/asassato` → *có tự tại / vô tự tại*,
  `antavā/anantavā` → *hữu hạn / vô hạn*, `ekantasukhī/ekantadukkhī/sukhadukkhī/
  adukkhamasukhī` → *chỉ sước / chỉ khổ / vừa sước vừa khổ / vừa không khổ vừa không vui*
  (bốn mục phải phân biệt được; theo `sn24.41:0.3` *Kinh Bản Thân Chỉ Sước* đã có),
  `vāra` → *chuyến* (theo `sn24.96:6.1`).

  **Tên phẩm:** `Dutiyagamanavagga` → *2. Phẩm Tái Sinh Thứ Hai* (10 bài sn24 đã dịch,
  cả 10 đều dùng đúng cách này; `Tatiyagamanavagga` ở `sn24.70` là *Phẩm Tái Sinh Thứ Ba*).
  `Adukkhamasukhīsutta` → *Kinh Tự Thân Vừa Khổ Vừa Vui* (nguyên văn `sn24.70:0.3` và
  `sn24.96:0.3`, 2 khoá). `sn24.44:0.1` giữ nguyên Pāli `Saṁyutta Nikāya` theo đa số
  **1600/1656** segment `:0.1` của tầng sn.

  **`No hetaṁ, bhante` (`3.5`, `3.15`):** toàn tầng sn có 36 cách; đa số chung là
  *Bạch Thế Tôn, không.* (56 khoá). Trong `sn24` thì hoành 19 *Không phải vậy, bạch Thế
  Tôn* với 18 *Thưa không phải vậy, bạch Thế Tôn*, và `sn24.70` cùng phẩm dùng
  *Không phải vậy, bạch Thế Tôn* — tôi theo `sn24.70` để bài liền kề không lệch.

