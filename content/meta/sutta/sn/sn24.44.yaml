  **Giải quyết draft 2026-10-12.** Đọc đối kháng toàn bài từ Pāli root và đối chiếu
  từng khoá với các bài cùng công thức đã có (`sn24.70`, `sn24.96`, `sn24.36`,
  `sn24.37`, `sn24.19`). Phần thân đối thoại `1.1`–`3.17` đúng nghĩa, giữ nguyên.
  Sửa các khoá sau; **mục cũ nào trái với danh sách này bị thay thế**:
  - `0.3` + `translationTitle`: *Vừa Khổ Vừa Vui* nghĩa là *sukhadukkhī* (cả khổ lẫn vui,
    bài `sn24.43`), ngược với `adukkhamasukhī` (không khổ không vui) — nay là *Kinh Tự Thân
    Vừa Không Khổ Vừa Không Vui*, khớp thân bài `2.2`. Hai bài `sn24.70` và `sn24.96` còn
    tiêu đề cũ (ngoài phạm vi, báo riêng).
  - `3.18` `Chabbīsatimaṁ` = *thứ hai mươi sáu* (26), không phải *thứ chín mươi tư*; số
    thứ tự các bài kề cận là `Pañcavīsatimaṁ` *Thứ hai mươi lăm* (`sn24.43`),
    `Catuvīsatimaṁ` *Thứ hai mươi tư* (`sn24.42`) — đúng mạch 26 bài của vòng hai. Mục
    cũ "`3.18` = Chuỗi lặp thứ chín mươi tư (`sn24.70:3.21`)" bị thay thế: `sn24.70:3.21`
    cùng Pāli nhưng dịch sai, không dùng làm tiền lệ.
  - `7.5` `Ime chabbīsati suttā` = *Hai mươi sáu bài kinh này* (26; bản cũ ghi "mười
    sáu" và thêm "Từng phẩm" không có trong Pāli). `7.6` `Dutiyavārena desitā` giữ *chuyến
    thứ hai* (theo `sn24.96:6.1`), sửa *trong* thành *theo* (cách công cụ).
  - `4.1`–`4.4` và `5.1`–`5.4` là **bảng tên bài** (uddāna) của các bài đầu
    tương ưng, không phải câu văn: `Vāta` = `sn24.1` *Gió*; `Etaṁ mama` = `sn24.2`;
    `So attā` = `sn24.3`; `No ca me siyā` = `sn24.4` *Có Thể Không Phải Của Ta*; `Natthi`
    = `sn24.5` *Natthidinna*; `Karoto` = `sn24.6`; `Hetu` = `sn24.7`; `Mahādiṭṭhi` =
    `sn24.8` — tám bài, đúng `aṭṭhamaṁ`. Bản cũ dịch thành câu ("Gió này là của ta, còn
    tự thân ấy…", "không có nguyên nhân của người tạo ra", "tầm nhìn xa") là đọc sai. Nay
    dịch từng tên bài, không thêm chữ (`Natthi` để *Không có*, vì Pāli chỉ có một chữ).
    `5.1`–`5.4`: `sassato asassato` = *thường còn, không thường còn* (khớp `sn24.9`,
    *thế giới là thường còn*; bản cũ dịch *tự tại* là sai nghĩa); `antānantavā` = hữu
    hạn / vô hạn; `taṁ jīvaṁ aññaṁ jīvañca` = *linh hồn ấy, và linh hồn khác* (các bài
    `sn24.13`–`14`); `tathāgatena cattāro` = *bốn bài về Như Lai* (`sn24.15`–`18`), không
    phải "do Như Lai tuyên thuyết". Tổng 8 + 10 + 8 = 26 bài, khớp `7.5`.
    Mục cũ nói "bám đúng từ vựng `sn24.18:5.1`–`7.3`" bị thay thế; `sn24.18` còn dịch
    sai `sassato` là *tự tại* (ngoài phạm vi, báo riêng).
  Số khoá lỗi nghĩa thật: 12/50 (`0.3`, `3.18`, `4.1`–`4.4`, `5.1`–`5.4`, `7.5`, `7.6`
  chỉ sửa giới từ).

  **Gỡ blocker.** (1) Blocker cũ về độ phủ tầng Anh (1/14 = 7,1%, `content/meta/
  reference-gaps.yaml` chưa có entry) là loại ghi nhận mất mát, không phải lỗi văn bản:
  13 khoá Sujato để trống (`2.1`, `2.2`, `2.6`, `2.7`, `3.1`, `3.3`, `3.4`, `3.6`, `3.7`,
  `3.13`, `3.14`, `3.16`, `3.17`) đã được đọc lại từ Pāli, đều là công thức lặp mà `sn24.70`
  có Pāli y hệt từng chữ ở các khoá tương ứng (và bài đó Sujato có dịch phần lớn), nên bản
  Việt tự đứng vững; `triangulation` giữ 7,0 (≤ 8,0, không có bản Anh độc lập cho các khoá
  này). Bài vẫn cần `npm run reference:gaps` để ghi nhận. (2) Tầng Việt hiện hành không có:
  giới hạn của bản chụp upstream (chỉ Pháp Cú), không phải lỗi văn bản.

  **Bất định còn lại (không chặn, đã ghi).** `abhinivissa` = *hướng về* (71 khoá trong
  tầng, so với *bám vào*/*cố chấp*/*chấp thủ* 16 khoá) là cách đã thành quy ước nhưng
  yếu hơn nghĩa *chấp chặt* của Pāli; giữ để khớp bài kề cận. `gamana` trong tên phẩm
  dịch *Tái Sinh* (10 bài sn24) là quy ước của tầng; Pāli chỉ có nghĩa *chuyến/lượt đi*.
  `sukha` = *sước* ở `6.4`, `7.2` theo `sn24.41`, `sn24.43` (80 khoá có *sước*), trong khi
  `adukkhamasukhī` dùng *vui* — hai cách cùng tồn tại trong tầng. `Bhagavaṁmūlakā no`
  để *các pháp lấy Đức Thế Tôn làm gốc* (không dịch *no* = *của chúng con*), theo đa số
  (33/66 khoá khớp dạng này). Dấu nháy `“` thêm ở `2.3` theo `sn24.36:2.3` và `sn24.70:2.3`, là dấu câu.

  **technical_integrity = 9,6** (không chạy được `npm run validate`, `npm test`,
  `npm run check`, `npm run build` trong lượt này; cần chạy ở khâu chốt).
