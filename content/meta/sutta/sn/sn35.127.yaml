notes: |-
  Dịch từ Pāli root đã ghim (manifest liệt kê sutta/sn/sn35/sn35.127_root-pli-ms.json và sutta/sn/sn35/sn35.127_translation-en-sujato.json). Tầng Anh CÓ và đã đo.
    Coverage đo được: 33/33 Pāli có nội dung có chữ Anh Sujato = 1.0000, không cần lớp lấp, không cần entry reference-gaps. Đây là bài có tầng Anh đầy đủ nhất trong lát.
    5/42 khoá có Pāli trùng nguyên văn với một khoá đã dịch ở bài khác; dùng lại y nguyên 4, lệch 1 (4.6, xem dưới). 0.2 là 13. Phẩm Gia Chủ, trùng 7 bài.
    Cụm ở 4.3–4.10 trùng công thức với an5.140:11.2–11.9 (Pāli chỉ khác ở chủ người: 3sg của an5.140, 2pl của bài này). Dùng y nguyên cách đã có: nimittaggāhino thành nắm giữ đặc tướng, mānubyañjanaggāhino thành nắm giữ tùy tượng, abhijjhādomanassā thành tham lam và không vui, anvāssaveyyuṁ thành tràn vào, paṭipajjatha thành hãy thực hành. Chỉ 4.4 và 4.10 đổi sang số nhiều cho đúng với mệnh lệ của Pāli.
    4.5–4.8 lệch có chủ ý so với 3 tiền lệ trùng nguyên văn: các tiền lệ đó mở đầu bằng Sau khi, còn bản này giữ dạng của an5.140 (Nghe tiếng bằng tai, Ngửi mùi bằng mũi, Nếm vị bằng lưỡi, Chạm xúc bằng thân) để 4.5 và 4.9 cùng một nhịp. Tiền lệ Chạm xúc chạm bằng thân cũng bị bỏ vì lặp chữ.
    Bất định cần ghi: pubbo lohitaṁ trong danh sách chất thải của thân tại 3.3 dịch là mủ, theo Sujato pus. Nhưng lohita là máu và pubba là cũ hoặc tối, nên một cách đọc khác là máu đen. Bản dịa chọn mủ vì Sujato là lớp tham chiếu đã ghim và vì mệt chữ phù hợp vị trí trong danh sách này; coordinator có thể đổi nếu muốn bám nghĩa từ điển.
    Cùng danh sách còn có redo với assu: hai từ này đều có thể là nước mắt. Bản dịa giữ cả hai mục (nước mắt và giọt nước mắt) thay vì làm phẳng thành một, vì Pāli liệt kê riêng. Đây là chỗ hơi lặp trong tiếng Việt nhưng trung thực với nguồn.
    4.6 và 4.8 chỉ có tiền lệ là ngửi mùi và chạm xúc, không có tiền lệ cho tai và lưỡi trong đúng cụm này; bản dịa dựng cả bốn câu theo an5.140.
    4.2 indriyesu guttadvārā viharatha dịch là hãy sống khi đã giữ chặt cửa các căn; tầng có tiền lệ không giữ cửa các căn cho an6.77 nên giữ cả vế cửa.
    5.4 và 5.5: antepura dịch là hậu cung (có 9 tiền lệ trong tầng). Chánh niệm không có mặt và chánh niệm đã có mặt dịch từ anupaṭṭhitāya satiyā và upaṭṭhitāya satiyā; arakkhitena và rakkhitena dịch là không hộ trì và đã hộ trì.
    5.8 và 5.9: Esāhaṁ … saraṇaṁ gacchāmi dịch là tôi đi quy y nơi Đức Thế Tôn ấy, nơi Pháp, và nơi Tăng chúng tỳ-kheo (tầng có tiền lệ cho cả ba vế, ví dụ dn9). pāṇupetaṁ saraṇaṁ gatan dịch là đã phát tâm quy y, không lỡ suốt đời, từ hôm nay.
    Câu hỏi của vua ở 1.4, 2.3, 3.8 lặp nguyên văn ba lần trong Pāli; bản dịa lặp y như Pāli và không dùng cách viết tắt cho đoạn bị lược.
    Tầng vietnamese-current vắng ở commit đã ghim (chỉ có Pháp Cú), nên không có bản Thích Minh Châu để đối chiếu cho bài này.
    Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
