notes: |-
  Đã đọc HẾT `vc/p75.txt` trước khi viết.

  MỆNH ĐỀ ĐO LẠI: `:0.1` `Saṁyutta Nikāya 35.241` (`ṁ` = U+1E41). `:0.2` `19. Āsīvisavagga` ⇒
  **19. Phẩm Rắn Độc** — 3/3 bài `sn35` đã có dùng y hệt (`sn35.240:0.2`, `sn35.242:0.2`),
  trong đó có bài đã ghi rõ đây là *0 tiền lệ, đặt mới có lý do (kèm Sujato)*. `:0.3`
  `Paṭhamadārukkhandhopamasutta` ⇒ **Kinh Ví Dụ Khúc Gỗ (Một)** — suy từ bài anh em đã có
  `sn35.242:0.3` = *Kinh Ví Dụ Khúc Gỗ (Hai)* cho `Dutiyadārukkhandhopamasutta`; Sujato cũng đánh
  số *(1st)*.

  DÙNG LẠI Y NGUYÊN VĂN: bốn khoá trùng nguyên văn `sn35.242` (`:0.2`, `:1.2`, `:1.3`, `:1.4`) và
  hai khoá trùng nguyên văn `sn35.240` (`:0.2`) — lấy y nguyên văn. Trong chính bài: `:7.10` ≡
  `:7.4` dùng lại y nguyên văn. `:1.8` ≡ `:2.4` và `:2.6` cùng Pāli, dịch một lần rồi dùng lại.

  0 TIỀN LỆ, ĐẶT MỚI, GHI KÈM LÝ DO:
  · `samuddaninno / samuddapoṇo / samuddapabbhāro` (`:1.7`, `:1.9`, `:2.3`, `:2.5`) — ba vế cùng
    nghĩa nghiêng/dốc/đổ về biển (và về Niết-bàn ở `2.3`/`2.5`). Dịch *nghiêng về …, dốc về …, đổ
    vào …*; tiền lệ gần nhất cho `nibbānaninnā` (`mn79`) cũng dùng *nghiêng về Niết-bàn, dốc về
    Niết-bàn, đổ vào Niết-bàn*. `ninnā` giữ là *nghiêng* vì `poṇa` và `pabbhārā` đã lo phần
    *dốc* và *đổ*.
  · `orimaṁ tīraṁ / pārimaṁ tīraṁ` ⇒ **bờ bên này / bờ bên kia** (Sujato *near shore / far
    shore*). Đây là ẩn dụ trục của cả bài và cũng là nơi Đức Phật định nghĩa lại ở `3.1`–`3.4`,
    nên từ ngữ phải cố định từ đầu đến cuối (đã kiểm: dùng nhất quán ở mọi khoa).
  · `āvaṭṭaggāho` ⇒ **bị xoáy nước cuốn đi**; `antopūtibhāvo` ⇒ **mục rữa bên trong** — tiền lệ
    `sn35.242:1.8`/`:1.10` (cùng phẩm) đã dùng *thối nát bên trong* cho `antopūtibhāvo`; ở đây
    dùng **mục rữa bên trong** để phân biệt với `thối nát` (đã dùng cho hành vi giấu giếm ở
    `:6.2`) — nếu không, hai từ Pāli khác sẽ ra cùng một chữ.
  · `asmimānassetaṁ` (`:3.4`) ⇒ **mạn mà tự cho là mình** (Sujato *the conceit “I am”*); đây là
    tên gọi kỹ thuật của `asmi-māna`, giữ nguyên vì cả bài đang định nghĩa từng tên gọi.
  · `nandīrāgassetaṁ` (`:3.3`) ⇒ **tham ái và hỷ lạc** — `nandī` là niềm vui thêm, `rāga` là tham.
    Tầng có 4 tiền lệ cho `nandīrāgassetaṁ`: *sự thích thú và tham đắm* (2), *Miếng thịt là tên
    gọi cho sự thích thú và tham đắm* (1), *Sợi dây … là danh từ chỉ tham ái và hỷ lạc* (1).
    Ở đây ghép `nandī` với `hỷ lạc` vì đó là nghĩa của `nandī`.
  · `kāmaguṇānaṁ` (`:5.4`) ⇒ **năm loại trần duyên** — 5 tiền lệ cho đúng công thức
    `pañcannetaṁ kāmaguṇānaṁ adhivacanaṁ`; giữ nguyên vì đây là tên gọi kỹ thuật.
  · `sattaratanaṁ … nāgaṁ` không xuất hiện ở bài này, nhưng `aḍḍhaṭṭhamaratana` có tiền lệ ở
    `ud4.4` với *bảy thước hay bảy thước rưỡi*; bài này không dùng tới nên không áp.

  CHỖ ĐÃ CỐ Ý CHỌN KHÁC TIỀN LỆ: `:2.6` `Evaṁ vutte, aññataro bhikkhu bhagavantaṁ etadavoca:`
  có 15 bản; tôi lấy `Khi được nói như vậy, một vị tỳ-kheo thưa với Thế Tôn:` (3×) thay vì
  bản lai *Khi được nói vậy … với Đức Phật* (2×) — vì luật *trùng thì khớp* phải chọn đúng một bản
  đã có, không được trộn hai bản.
  `:7.4` và `:7.10` lấy y nguyên văn `dn16:5.28.5` (cùng Pāli): *Bạch Thế Tôn, con xin được xuất
  gia trong sự hiện tiền của Đức Thế Tôn, con xin được thọ cụ túc giới.* — chọn bản này vì nó giữ
  **cả hai** ý cầu của Pāli (`labheyyāhaṁ … pabbajjaṁ, labheyyaṁ upasampadan`), trong khi ba bản
  kia gộp làm một.

  DẤU LƯỢC: `…pe…` ở `7.12` ⇒ bản Việt giữ **đúng một** `…`, không mở rộng đoạn
  *vūpakaṭṭho appamatto ātāpī pahitatto* (tức tịnh tâm, tinh tấn, quyết chí). Đó là quyết định
  cần người biên tập biết: câu đó Sujato cũng lược.

