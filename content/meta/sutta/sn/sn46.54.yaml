notes: |-
  **Coverage English: ĐO THẬT, mẫu số 73, 57 khoá có Sujato = 0,7808, DƯỚI ngưỡng 0,80.** Mẫu số là 73 khoá Pāli có nội dung (từ 40 ký tự trở lên, bỏ khối :0), theo ngưỡng khai trong cấu hình các tầng. Tầng english-sujato đã ghim phủ 57/73; ngưỡng 0,8 cần tối thiểu 59, thiếu 2. Sujato để trống 16 khoá: 4.2, 4.5, 4.6 (đoạn lược của lời các du sĩ), 6.1, 6.3, 7.1, 7.2 (nửa thuật lại thứ nhất), 8.1, 8.2, 8.5, 9.1, 9.2, 9.5, 9.6 (nửa thuật lại thứ hai) và 10.1, 10.2. Đó là phần lặp lại của 1.x đến 4.x, Sujato bỏ trống vì lặp; chúng KHÔNG phải sự đồng thuận về cách dịch, và bản Việt dịch các khoá này trực tiếp từ Pāli, giữ cùng lời với phần gốc. Không có lớp lấp english-project cho bài này, tầng vietnamese-current vắng ở commit đã ghim (snapshot chỉ có Pháp Cú, đặc điểm của bản chụp upstream, không tính vào coverage). Vì độ phủ dưới ngưỡng nên status PHẢI là draft kèm blocker, bất kể điểm; triangulation đặt 8,0 vì 16/73 khoá chỉ có Pāli đứng một mình. Việc có hay không entry trong reference-gaps do người điều phối quyết; npm run reference:gaps cần chạy lại.

  **Đối chiếu ngoài tầng store.** Đã đọc bản Việt nguyên bài của Hòa thượng Thích Minh Châu (SuttaCentral, không phân đoạn nên không căn lề vào segment) để kiểm thuật ngữ và cấu trúc; không chép câu nào. Các điểm hai bản khác nhau, đều phân xử bằng Pāli và tiền lệ của tầng: (1) paṭikūla, Hòa thượng dùng "ghê tởm", bản này dùng "đáng ghét" theo sn52.1 và dn28 (5 khoá cùng công thức Pāli so với 2 khoá "ghê tởm" ở mn152); (2) kiṅgatikā, kiṁparamā, kiṁpariyosānā, Hòa thượng "thú hướng, tối thắng, cứu cánh", bản này "đích đến, đỉnh cao, kết thúc"; (3) subhaṁ vimokkhaṁ và subhaparama, Hòa thượng "giải thoát được gọi là thanh tịnh" và "thanh tịnh tối thượng", bản này "giải thoát về cái đẹp đẽ" (dn24, 6/6 khoá) và "có cái đẹp đẽ là đỉnh cao"; (4) mettācetovimutti, Hòa thượng "từ tâm giải thoát", bản này "tâm giải thoát nhờ lòng từ" (8 khoá có dạng "nhờ lòng" so với 6 khoá "giải thoát tâm" và 6 dạng khác trên tầng, và mn99, dn33, dn34 dùng đúng dạng này); (5) ājānissāmā, Hòa thượng "sẽ được biết", bản này "sẽ hiểu rõ" (khớp sn46.52:4.3). Sujato ở 12.8 BỎ vế subhaṁ vā kho pana vimokkhaṁ upasampajja viharati; bản này dịch đủ vế đó vì Pāli có.

  **Tiền lệ và dùng lại nguyên văn: số đã đo.** Đã dò 66 cặp Pāli trùng nguyên văn giữa các khoá của bài này với các khoá đã dịch ở tầng (mn13, mn57, mn18, mn133, mn138, ud3.3, dn3, sn46.52, sn46.53); 53 cặp bản Việt cùng dạng, 13 cặp khác. 13 cặp khác gồm: 1.3 và 6.2 (câu "etadahosi" khác nhau ở 9 cặp trên tầng, gồm mn18, mn133, mn138, ud3.3, dn3; giữ dạng của sn46.52 và mn13), 5.3 và 10.2 (mn13:4.3, 5.14 dịch ājānissāmā là "hỏi chính Đức Phật", còn Pāli, Hòa thượng và Sujato đều nói "biết/hiểu", nên bản này giữ "hiểu rõ ý nghĩa của lời này ngay nơi Đức Thế Tôn" như sn46.52), 11.6 và 11.8 (sn46.53:2.4, 2.6 bỏ "này các tỳ-kheo" dù Pāli có bhikkhave; bản này giữ theo Pāli và theo sn46.52:8.3, 8.5, mn13:6.5, 6.7; hai bài sn46.52 và sn46.53 hiện không khớp nhau ở đó). Các câu khung dùng lại gần nguyên từ sn46.52 (cùng cấu trúc du sĩ nêu giáo lý giống nhau): 2.1, 2.2, 3.1, 4.1, 4.7, 5.1 đến 5.3, 6.2, 7.2, 10.1, 10.2, 11.1, 11.6 đến 11.9; riêng 1.1 dùng lại mn57:1.2 (Pāli trùng, 1/1 khoá). Pāli trùng nguyên văn TRONG CHÍNH bài: 11 nhóm (4.1 với 9.1; 4.2 với 9.2; 8.3 với 9.3; 8.4 với 9.4; 8.5 với 9.5; 12.4 với 15.4; 12.5 với 15.5; 12.6 với 15.6; 12.7 với 15.7; 13.4 với 14.4; 13.5 với 14.5); cả 11 nhóm có bản Việt giống hệt nhau, 0 cặp khác. Pāli 4.7 và 9.6 chỉ khác dấu câu và dấu nháy nên bản Việt giữ cùng lời, chỉ khác dấu ” ở 4.7.

  **Thuật ngữ, kèm số đếm.** mettā, karuṇā, muditā, upekkhā trong sahagatena cetasā → "tâm từ, tâm bi, tâm hỷ, tâm xả" (121 khoá trên tầng cùng dạng, so với 7 dạng khác); cụm vipulena mahaggatena appamāṇena averena abyāpajjena → "rộng lớn, cao cả, vô lượng, không thù hận, không ác ý" (78/79 khoá); ekaṁ disaṁ pharitvā viharati → "an trú với tâm … lan tỏa một phương" (nhiều tiền lệ: mn55, mn97, mn7, an4.125, sn41.7); bojjhaṅga sahagata → "câu hữu với" (18/38 khoá sahagata trên tầng, theo sn46.57); vivekanissitaṁ … vossaggapariṇāmiṁ → "y cứ vào viễn ly, y cứ vào ly tham, y cứ vào diệt tận, và hướng đến buông bỏ" (cùng một câu Việt ở 14 khoá, kể cả sn46.11); nānattasaññā → "tưởng sai biệt", paṭighasaññā → "tưởng về va chạm" (mn26, mn31, mn64 trở xuống); ākāsānañcāyatana → "Không vô biên xứ" (23 khoá so với 6 "xứ vô số hư không", 3 "xứ không vô biên"), viññāṇañcāyatana → "Thức vô biên xứ" (19 so với 5 "xứ thức vô biên"), ākiñcaññāyatana → "Vô sở hữu xứ" (21 so với 13 "xứ vô sở hữu"); "ananto ākāso" → "không gian là vô biên" (mn8, mn26, mn30, mn31, mn64, mn77 cùng dạng); saññī → "tưởng"; Sākacchavagga → "Phẩm Hỏi Luận" (sn46.52, sn46.53, 3/3). Số Pāli: pañca nīvaraṇe = năm triền cái; tathā dutiyaṁ, tatiyaṁ, catutthaṁ = phương thứ hai, thứ ba, thứ tư (phép tính duy nhất trong bài, đã đối chiếu); Catutthaṁ. = "Thứ tư." (172/264 khoá cùng Pāli ghi cùng dạng).

  **Tên kinh.** Mettāsahagatasutta → "Kinh Câu Hữu Với Lòng Từ". Tiền lệ trực tiếp cho tên này: 0; chỉ có tên Mettāsutta → "Kinh Lòng Từ" (sn46.62), "Kinh Thương Yêu" (an11.15) và "Kinh Lợi Ích Của Từ" (an8.1). Sujato đặt Full of Love; bản này theo gốc sahagata (đã là "câu hữu với" ở sn46.57) cộng "lòng từ" theo sn46.62, nên tiêu đề không lẫn với Kinh Lòng Từ ở sn46.62.

  **Dấu lược và dấu nháy, đã đo.** 13 khoá Pāli có …pe… (4.2, 8.2, 8.3, 8.4, 9.2, 9.3, 9.4, 12.2, 13.2, 13.4, 14.2, 14.4, 15.2) và 2 khoá có … trần (4.3, 4.4): Việt giữ đúng một … ở cả 15 khoá, khớp Pāli, không bung thành văn; Pāli không có … ở khoá nào khác và Việt cũng không có. Pāli không có (…). Dấu nháy đơn và kép: 87/87 khoá khớp Pāli từng khoá, kể cả các khoá Pāli để nháy chạy qua ranh giới (3.2 mở ‘ và 3.5 đóng ’; 8.1 mở ‘ nhưng không có khoá đóng riêng; 9.6 Pāli kết "anusāsaninti" không mang dấu nháy nên bản Việt cũng không đóng; 10.2 đóng ’ rồi ”).

  **Bất định, KHÔNG thêm vào thân kinh.** (a) idhapaññassa bhikkhuno uttarivimuttiṁ appaṭivijjhato: Sujato "a wise mendicant here who has not penetrated to a higher freedom", Hòa thượng "Ở đây là trí tuệ đối với Tỷ-kheo không đạt tới giải thoát cao hơn", an8.1:2.3 dịch appaṭivijjhanto là "chưa thấu triệt"; bản này "đối với vị tỳ-kheo có trí tuệ ở đây, chưa thấu triệt giải thoát cao hơn", giữ idha là "ở đây" đứng sau trí tuệ chứ không đoán nghĩa "trong giáo pháp này". (b) subhaparamāhaṁ mettācetovimuttiṁ: "có cái đẹp đẽ là đỉnh cao" theo cấu tạo subha + parama, đồng nhất với subhaṁ vimokkhaṁ ở 12.8; Pāli không nói rõ là cùng một thứ, chỉ cùng gốc subha. (c) upekkhako ca tattha viharati ở 12.8 có chữ ca mà 13.5, 14.5, 15.8 không có; bản này không dịch ca, vì cả ba trường hợp cùng nghĩa trong cấu trúc "nếu muốn … thì vị ấy an trú …". (d) Thứ tự appaṭikūla, paṭikūla trong 12.6, 12.7, 12.8: giữ đúng thứ tự Pāli; sn52.1:4.3 và 4.5 đảo thứ tự ở các khoá tương đương, nên hai bài này lệch nhau ở thứ tự hai vế (không đổi nghĩa). (e) 11.2, 11.3, 11.4, 11.5 āvuso số ít dịch là "Này hiền giả" theo sn46.52:8.2, dù người nói là nhiều du sĩ.

  **Lỗi ngoài lát, báo, không sửa.** an10.219:6.7 và an10.219:11.7 có cùng cụm Pāli "idha paññassa bhikkhuno uttari vimuttiṁ appaṭivijjhato" nhưng bản Việt hiện có viết "đạt đến giải thoát cao hơn, không khuyết thiếu", ngược dấu với Pāli (appaṭivijjhato là không thấu triệt; Sujato và an8.1:2.3 cùng chiều với bản này). Cần người điều phối xét.

  **Quy trình và cổng kỹ thuật.** Pāli đọc trực tiếp từ snapshot đã ghim; đã đối chiếu English Sujato (57/73 khoá) và bản Việt nguyên bài của Hòa thượng Thích Minh Châu. Đã in và đọc đối kháng đủ 87/87 cặp Pāli với Việt. Chưa chạy npm run validate, npm test, npm run check, npm run build (bị cấm chạy cổng), nên technical_integrity đặt 9,6 chứ không tuyên bố đã qua cổng kỹ thuật; cần chạy đủ bốn lệnh này và npm run reference:gaps trước khi đổi trạng thái. Vì blocker coverage, bài phải giữ draft.

  **Giải quyết draft 2026-10-12.** Blocker cũ (độ phủ English Sujato 57/73 = 0,781 dưới ngưỡng 0,80) thuộc loại mất mát tầng tham khảo, không phải lỗi văn bản, và đã GỠ khỏi blocking_errors; mục "Coverage English" và câu "bài phải giữ draft" ở các đoạn notes trên bị thay thế bởi mục này (số đo 57/73 vẫn đúng và vẫn phải được ghi nhận trong reference-gaps). Căn cứ gỡ: đã đọc đối kháng lại cả 16 khoá Sujato để trống (4.2, 4.5, 4.6, 6.1, 6.3, 7.1, 7.2, 8.1, 8.2, 8.5, 9.1, 9.2, 9.5, 9.6, 10.1, 10.2) trực tiếp từ Pāli. Tất cả là phần lược hoặc thuật lại nguyên văn các khoá 1.x đến 4.x (Pāli trùng lời, chỉ đổi ngôi kể từ "họ" sang "chúng con"/"chúng tôi"); bản Việt dịch cùng lời với phần gốc, không có nghĩa nào chưa chắc, nên bản dịch tự đứng vững từ Pāli. Phần Sujato có thật (57 khoá, gồm toàn bộ lời Đức Phật ở 11.x đến 15.x) đã đối chiếu từng khoá. Vì 16/73 khoá chỉ có Pāli và Sujato lại không có bản độc lập cho các khoá đó, triangulation giữ 8,0, không cao hơn. Tầng Việt hiện hành vắng (snapshot chỉ có Pháp Cú): đây là giới hạn tham chiếu của upstream, không phải lỗi văn bản.

  Sửa sau lượt đọc đối kháng (4 khoá, trên 87): 1.2 "rất nhiều tỳ-kheo" thành "nhiều vị tỳ-kheo" (sambahulā là "một số đông", không có sắc thái "rất"; tầng có 3 khoá "nhiều (vị) tỳ-kheo" so với 6 khoá "rất nhiều Tỷ-kheo" ở bản cũ chưa kiểm); 11.1 "các thầy nên hỏi họ" thành "các thầy nên nói với họ như sau" (vacanīyā là "cần được nói với", câu hỏi nằm ở các khoá liền sau, không nằm trong động từ; tầng có 4 khoá "nên hỏi họ" và 14 khoá "nên trả lời" cho cùng công thức, khác nhau tùy bối cảnh); 11.6 "còn bối rối" thành "còn thêm bực bội" (uttariñca vighātaṁ āpajjissanti: vighāta là bực bội, phiền não, không phải lúng túng; Sujato dịch frustrated; cùng công thức vẫn là "còn bối rối" ở mn13:6.5, sn46.52:8.3, sn46.53:2.4, an10.27:9.3, ngoài lát, báo để người điều phối xét); 4.5 dấu ; ở cuối đổi thành dấu chấm để 4.6 mở câu "Như thế" bằng chữ hoa khớp 3.2, 8.5, 9.5 (Pāli có ;, đây là chọn dấu câu, không đổi nghĩa). Không khoá nào khác sai nghĩa: 0 lỗi nghĩa thật trên 87 khoá; 3 khoá chỉnh nghĩa nhẹ (1.2, 11.1, 11.6) và 1 khoá dấu câu (4.5). Điểm giữ nguyên vì các lỗi chỉ là sắc thái; không có blocker nào còn lại.

  Bất định còn lại, giữ trong notes: (1) idhapaññassa là "có trí tuệ ở đây" (Sujato cùng chiều), chưa phân xử được nghĩa "ở đây" là trong giáo pháp này hay ở mức này; (2) adhippayāso ở 4.7 và 9.6 dịch "đặc thù", chuỗi ba từ viseso, adhippayāso, nānākaraṇaṁ gần nghĩa nhau, Sujato gộp cả ba thành một câu hỏi về "difference"; (3) 13.6 "biết rằng" cho iti trong nháy trích, theo tiền lệ mn26 và Sujato. Lỗi ngoài lát đã báo ở trên (an10.219) vẫn còn. Các lệnh npm run validate, npm test, npm run check, npm run build chưa chạy trong lượt này nên technical_integrity vẫn 9,6, không tuyên bố đã qua cổng kỹ thuật.
