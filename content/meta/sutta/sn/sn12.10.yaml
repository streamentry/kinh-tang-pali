notes: |-
  Đối chiếu: Pāli root (bilara pin) + English Sujato + các tiền lệ cùng công thức trong kho. Tầng Việt hiện hành (HT. Thích Minh Châu) chỉ có Pháp Cú, không có cho SN — không được dùng; phần bù là các bản đã dịch trong kho có Pāli trùng nguyên văn.
  Số khoá: 56/56, đúng segment ID, dấu lược "…" của Pāli giữ nguyên (3.2, 6.2, 4.2, 7.2 có …pe… -> một "…").
  Cặp Pāli trùng nguyên văn đã tái dùng: 1.1 = mn19:2.1; 2.1/3.1/5.1/6.1 = mn26:13.2; 2.2/2.4/5.2/5.4 = dn14:2.18.5/2.18.7/2.20.2/2.20.4; 4.2 = sn12.3:2.3; 4.3 = sn12.3:2.4; 7.2 = sn12.3:3.3; 7.3 = sn12.3:3.4; 4.3/7.3 cũng trùng dn14:2.19.5/2.21.4 và mn38/mn115 (chọn sn12.3 cùng quyển sn); 3.3-3.10/6.3-6.10 = sn12.39:1.8-1.11 (hữu/thủ/ái…), 3.6/6.6 = mn109:16.2 (thọ). Tổng: 46/56 segment có ít nhất một segment Pāli trùng đã dịch; các cặp lặp trong cùng bài (3.x đối xứng 6.x, 2.1=3.1=5.1=6.1, v.v.) dịch khớp từng cặp.
  Tiền lệ tiêu đề (đếm bằng grep -ro trên tầng vi): :0.1 "Saṁyutta Nikāya …" giữ nguyên 1.592/1.592 file sn; :0.2 "Buddhavagga" -> "1. Phẩm Đạo Sư" (sn12.3, sn12.7, sn12.8, sn12.9 = 4 file); :0.3 tên Phật giữ Pāli: "Kinh Vessabhū" (sn12.6), "Kinh Kakusandha" (sn12.7), "Kinh Koṇāgamana" (sn12.8), "Kinh Kassapa" (sn12.9) = 4 file, nên "Gotamasutta" -> "Kinh Gotama". Phát hiện lệch: sn12.5:0.3 "Sikhīsutta" đang dịch là "Kinh Bậc Thầy" — không theo, báo cho người biên tập (không đụng file khác theo phạm vi giao).
  Thuật ngữ Duyên khởi theo kho: "do duyên vô minh mà có các hành" (sn12.3:2.2), "khối khổ" (sn12.3/dn14), "tác ý như lý" (glossary); "Tập khởi/Đoạn tận" trong 4.4/7.4 chọn khớp tiếng vọng với 4.3/7.3 (sn12.3 dùng "tập khởi"/"đoạn tận"; dn14 dùng "sinh khởi"/"đoạn diệt" — hai họ tiền lệ khác nhau, đã chọn nhất quán trong bài theo sn12.3 cùng quyển). 7.6 "Buddhavaggo paṭhamo." theo mil6.1.9:11.1 "Phẩm Đức Phật, thứ nhất."; 8.0 "Tassuddānaṁ" -> "Tổng tụng" (dn34; tiền lệ ít — dn23/dn13 dùng "Tóm lược"). Udāna 8.1-8.4 (English để trống): dịch theo nghĩa từ Pāli, tên bảy vị Phật giữ Pāli; "Desanā vibhaṅgapaṭipadā" là bộ ba chủ đề (giáo thuyết/giải nghĩa/con đường) của 12.1-12.3, không phải tên kinh 12.1 (Paṭiccasamuppādasutta -> "Kinh Duyên Khởi").
