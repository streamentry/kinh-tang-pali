notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato cộng bản lấp English của dự án. Coverage English = 24/24 khoá Pāli có nội dung = 100%.
  TRIANGULATION KHÔNG ĐỘC LẬP: 3 trong 24 khoá Pāli có nội dung (3.2, 3.4, 3.6) chỉ có tiếng Anh từ bản lấp `content/translation/en/project`, cùng tác giả với bản Việt này; 3.2 và 3.4 nằm trong chuỗi lặp dài mà Sujato đã dịch ở 2.4 và 4.3. Tiêu chí 6 đặt 8.0. Tầng Việt hiện hành vắng ở commit đã ghim.
  0.1 giữ `Saṁyutta Nikāya 35.153`; 0.2 theo tiền lệ 8 bài cùng phẩm (15. Phẩm Cũ Mới).
  12 khoá có PĀLI TRÙNG NGUYÊN VĂN với tệp đã có trong HEAD, dùng lại nguyên văn: 0.2 (3 bài) · 1.2 (`sn48.45`/`sn48.46`/`sn48.47`) · 1.4 (`sn22.58:4.3`) · 1.5 (`sn12.19:4.2`/`sn12.34:1.4`) · 1.6 (`sn1.11:1.6`) · 2.5 (`sn18.11`) · 2.7 (`sn17.8:1.4`) · 3.3 (`sn18.11`) · 3.5 (`sn17.8`) · 4.4 (`sn18.11`) · 4.6 (`sn17.8`) · 4.9 (Thứ tám.). Tổng lát c32: 143 cặp.
  Công thức khép phẩm `khīṇā jāti, vusitaṁ brahmacariyaṁ, kataṁ karaṇīyaṁ, nāparaṁ itthattāyā` dịch thành Sanh đã tận, phạm hạnh đã hoàn thành, việc nên làm đã làm, không còn trở lại trạng thái hiện hữu này nữa.
  LỆCH CÓ CHỦ ĐÍCH, ghi rõ: vế cuối dùng không còn trở lại trạng thái hiện hữu này nữa (48 khoá trên đĩa) chứ không dùng không còn gì là tự thân nữa (86 khoá, chủ yếu `sn48.45–48.48`) — Pāli `itthattāyā` là sự hiện hữu, không phải tự thân; `saññā` thì dùng tưởng (4073 lần) chứ không dùng nhận biết.
  Danh sách năm ngoại lệ của `pariyāyo` dịch nhất quán ở 1.1, 1.7, 2.1, 2.4, 2.8, 2.9, 3.2, 3.6, 4.3, 4.7: lòng tin (saddhā, 385 khoá) · sự tán thích (ruci, 0 tiền lệ) · truyền khẩu (anussava, `an4.193`) · sự suy luận có lý lẽ (ākāraparivitakka, `an4.193` dịch là sự xét đoán hợp lý) · sự chấp nhận một kiến chấp sau khi cân nhắc (diṭṭhinijjhānakkhanti, `an4.193` dịch là chấp nhận kiến sau khi suy nghĩ). `an3.65`/`an3.66` dùng bộ từ khác cho ba mục giữa nhưng không theo vì chỉ một tệp.
  `paññāya disvā veditabbā` → quán sát với tuệ, theo 3 tiêu chí có tiếng Anh đã ghim (2.6, 3.4, 4.5) và 78 khoá có với tuệ trên đĩa.
  BẤT ĐỊNH: tên bài `Atthinukhopariyāyasutta` 0 tiền lệ trên đĩa. Chọn Kinh Có Con Đường Không? theo Sujato (Is There a Method?) và `pariyāya` → con đường (`sn48.53:2.2`). Người biên tập nên gộp nếu sau này dịch các bài `Pariyāyasutta` cùng dãy.
  BẤT ĐỊNH: `aññaṁ byākareyya` ở 1.1, 1.7, 2.1, 2.8, 3.6, 4.7 dịch tuyên bố một điều khác — giữ đúng chữ `aññaṁ` của Pāli, khác Sujato (declare their enlightenment) vốn lược mất từ này.
  SỬA NGOẶC KÉP CÓ CHỦ ĐÍCH: Pāli bài này thiếu một ngoặc khép ở 4.8 (chạy `“`-`”` trên Pāli cho +1). Bản Việt khép nốt tại 4.8; vì vậy 4.8 khác 1.8 đúng một dấu nháy kép, dù Pāli hai khoá này gần như trùng nhau.
  Bốn dấu lược ở 2.1, 2.9, 3.1, 3.6 giữ đúng MỘT `…`; 3.1 nói rõ là phần bị lược nên không mở rộng.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy; technical_integrity 9.6 vì lát này không tự chạy bốn lệnh đó. Đã tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, và mô phỏng đúng `validateSegmentMap` của `scripts/validate.ts` (tiền tố khoá, orphan, requireComplete, non-Latin) — 316/316 khoá sạch.
