notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim. Coverage English (Sujato) = **51/51** khoá Pāli có nội dung = **100%** (Pāli ≥ 40 ký tự, bỏ khối `:0`; Sujato có chữ ở cả 51 khoá). Lớp `english-project` không có tệp cho bài này, tầng `vietnamese-current` không có cho bài này (tại commit đã ghim chỉ có 26 tệp Pháp Cú), nên cổng English được thoả hoàn toàn bằng bản Sujato độc lập.
  Tiền lệ cùng bộ, dùng lại nguyên văn: `1.1` (`Sāvatthiyaṁ viharati.` → *Trú ở Sāvatthī.*, 91 khoá so với 52 *Đang sống tại* và 7 *Trú tại*) · `1.3` (*Thế nào là bốn?*, 152 so với 39 *Là bốn nào?*) · `1.4` (3 khoá, gồm `sn12.11:1.5` và `mn9:11.4`) · `1.5` (`sn12.11:1.6`) · `0.2` (*7. Phẩm Lớn*, 18 khoá) · `8.2` (`sn48.42:6.3`, bỏ dấu chấm thừa sau nháy) · `9.9` (*Thứ tư*, 152 khoá so với 89 *Thứ bốn*). Tổng 7 Pāli có tiền lệ nguyên văn đã dò, **0** cặp trong đó bản Việt khác. Khoá `1.2` chỉ khác `sn12.11:1.3` ở chữ hoa đầu câu (`Cattārome` so với `cattārome`) nên dùng lại cách dịch của khoá kia.
  Trong chính bài: 14 nhóm Pāli trùng nguyên văn (peyyāla chuỗi *thức an lập → danh sắc → hành → hữu mới → sinh già chết → sầu muộn* lặp ở khối 2, 3, 4, 5 và bản phủ định ở 6, 7, 9; cùng các khoá `…pe…`/`…` lặp), **0** nhóm mà bản Việt khác nhau.
  Thuật ngữ theo tiền lệ đếm được: `viññāṇaṁ patiṭṭhitaṁ virūḷhaṁ` → *thức an lập và tăng trưởng* (`sn12.38`, `sn12.39`, `sn12.40`) · `nāmarūpassa avakkanti` → *sự giáng hiện của danh sắc* (`sn12.39`) · `āyatiṁ punabbhavābhinibbatti` → *sự tái sinh vào hữu mới trong tương lai* (`sn12.38`) · `āhāra` → *bốn đoàn thực* theo `sn12.11` (cụm *bốn đoàn thực* xuất hiện 3 lần, so với 2 lần *bốn loại thức ăn*, thí dụ `mn38`); khi Pāli viết `phasse āhāre` / `manosañcetanāya āhāre` / `viññāṇe āhāre` thì dịch *ở thực là xúc / ý tư / thức* để không gọi xúc, ý tư, thức là *đoàn thực* · `rāga` → *tham* · `nandī` → *hoan hỷ* · `taṇhā` → *ái* (`sn22.4`, `sn22.111`, `sn23.2`) · `saupāyāsa` → *ưu não* (`an5.3`, `an6.75`) · `sokaṁ`/`asokaṁ` → *sầu muộn*/*không sầu muộn* (`sn11.1`). Cặp ví dụ nhà mái nhọn theo `sn48.42:6.2`: *dừng lại ở đâu*, *tường phía tây*.
  Số Pāli: `cattāro` = 4 → *bốn* · `dutiyo`/`tatiyā`/`catutthaṁ` = thứ 2/3/4 → *thứ hai*/*thứ ba*/*thứ tư*. Không có số nào lớn hơn trong bài.
  Bất định, ghi tại đây, không thêm vào thân kinh: (1) `sadaraṁ` — `dara` dịch *đau khổ* (Sujato *anguish*); tầng chưa có tiền lệ, từ này dễ trùng với `dukkha` nhưng không có chữ nào hẹp hơn mà vẫn đúng Pāli. (2) `rajako vā cittakārako vā` — `rajaka` nghĩa đen là thợ nhuộm, Sujato dịch *artist*, tầng chỉ có `sn22.100:4.1` (*người vẽ tranh*) cho Pāli khác một chữ; ở đây giữ *thợ nhuộm hay họa sĩ* theo nghĩa Pāli vì cặp này đi liền với `cittakāraka`. (3) `mañjiṭṭhā` → *thiên thảo* (cây nhuộm đỏ; Sujato *rose madder*), `lākhā` → *cánh kiến*, `rajanā` → *thuốc nhuộm* — các từ này đều là tên chất nhuộm. (4) `avakkanti` → *giáng hiện* theo `sn12.39`; `sn12.58`/`sn12.59` dùng *tràn ngập*/*đi vào* cho cùng từ ở ngữ cảnh khác, tầng chưa thống nhất.
  Khoá `8.1` ở Pāli rút gọn ví dụ cửa sổ: câu hỏi khép bằng `”ti?` mà không có dấu mở nháy ở chính khoá đó (nháy mở ở `1.2`); bản Việt giữ đúng một dấu `”` ở `8.1` và `9.8`, cân với từng khoá Pāli. `8.9` Pāli kết `…pe….` nên Việt kết ` ….` (dạng đa số ở tầng; ở `…pe….` riêng của `sn`, ` ….` và `…` hoà nhau 99/99).
  Dấu lược: Pāli có `…pe…` ở `3.1`/`5.1`/`7.1` và `…` trần ở `3.2`/`5.2`/`7.2`/`9.1`/`9.2`; cả hai dạng Việt giữ **đúng một** `…`. Pāli không có `(…)` ở khoá nào.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` do coordinator chạy — lát agent này không chạy bốn lệnh đó, nên `technical_integrity` đặt 9.6 chứ không 10.0. Tự kiểm thay bằng phép đo riêng: tập khoá Việt = tập khoá Pāli (69/69, cùng thứ tự), nháy đơn/nháy kép khớp Pāli từng khoá (0 lệch), NFC, không khoá rỗng, không Pāli lọt sang Việt (ngoài tên riêng).
