notes: |-
  Dịch từ Pāli root; đối chiếu bản Anh Bhikkhu Sujato ở commit đã ghim (32/32 segment
  có nội dung đều có chữ Anh, coverage 100%). Tầng Việt hiện hành không có bài này:
  `translation/vi/phantuananh/` ở commit đã ghim chỉ chứa Pháp Cú.
  Tên phẩm 0.2 lấy theo tiền lệ cùng phẩm: sn51.13 và sn51.14 (Pāsādakampanavagga)
  đều dùng «2. Phẩm Vui Vẻ» — 2 tiền lệ.
  0.1 đo 1.640 tệp `sn` trong tầng Việt dự án: toàn bộ dùng "Saṁyutta Nikāya" (ṁ =
  U+1E41); số 0 dùng "Saṡyutta" (s có dấu). Cũng 0 tệp nào khác cho "Saṡyutta".
  6.3 TRÙNG NGUYÊN VĂN với sn7.1:9.3 (`Seyyathāpi, bho ānanda, nikkujjitaṁ vā ukkujjeyya…`)
  — bản Việt sn7.1 đã ghin, nên dùng lại nguyên văn, chỉ đổi tên người nói sang Ānanda
  theo đúng chủ thể Pāli ở đây.
  4.2 dùng "Không thể từ bỏ ham muốn bằng chính ham muốn ấy" cho `netaṁ ṭhānaṁ vijjati`;
  Sujato dịch là "it's not possible to give up desire by means of desire" — hai vế là
  một nghĩa, không phải hai mệnh đề độc lập.
  Địa danh: đo trong tầng `sn`, "Kosambī" 7 tiền lệ (sn35.127, sn35.129, sn35.233,
  sn35.234, sn48.49, sn48.53, sn56.31) so với "Kosambi" 1 (sn46.8) ⇒ chọn "Kosambī".
  Cụm "tại tu viện Ghosita" dùng nguyên văn các bài đã ghin (sn35.127, sn48.49, sn35.234).
  Tên riêng "Uṇṇābha" là lần dùng đầu tiên trong tầng Việt; đã tra lại: không có bài
  nào đã dịch dùng tên này. Giữ dấu Pāli vì đây là tên riêng từ nguồn, không phải Pāli lọt.
  technical_integrity 9.6: môi trường lát này không có shell, nên không tự chạy được
  `npm run validate`/`test`/`build`; các bài đã tự kiểm bằng bản cài lại logic của
  `_hvi.py` (đủ khoá, không thừa khoá, NFC, không trùng nguyên văn Pāli, số dấu lược
  khớp từng khoá, ngoặc kép cân trên cả bài theo thứ tự số).