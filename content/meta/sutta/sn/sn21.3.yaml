notes: |-
  Dịch từ Pāli root đã ghim (manifest liệt kê sutta/sn/sn21/sn21.3_root-pli-ms.json và sutta/sn/sn21/sn21.3_translation-en-sujato.json). Tầng Anh CÓ và đã đo.
    Coverage đo được: 31/31 Pāli có nội dung có chữ Anh = 1.0000, trong đó 29 từ Sujato và 2 khoá (4.2 và 5.2) do lớp lấp english-project bù, lớp lấp đã published. Không cần entry reference-gaps.
    6/42 khoá có Pāli trùng nguyên văn với một khoá đã dịch ở bài khác; dùng lại y nguyên 4, lệch 2.
    Dùng lại y nguyên: 0.2 (1. Phẩm Tỳ-kheo, trùng 11 bài sn21), 1.1 (Tôi nghe như vầy) và 1.2 (Một thời, Đức Phật ở Sāvatthī…).
    Lệch: 6.2 dùng dấu chấm phẩy theo Pāli trong khi tiền lệ sn2.20 dùng dấu phẩy; 6.3 vì tiền lệ dùng chữ dầu (lỗi gõ) hoặc nói đã đi đến bờ kia, còn bản này dùng dù là vị tỳ-kheo đã sang bờ bên kia. Đề nghị coordinator sửa chữ dầu trong sn2.20.
    Tên phẩm: Pāli ở 0.2 là 1. Bhikkhuvagga, dùng 1. Phẩm Tỳ-kheo theo 11 bài sn21 đã có. Tên Bhikkhunipakkhāya mà coordinator nêu có 0 lần trong tầng Việt dự án và không phải Pāli tại commit đã ghim. Tương tự, sn12: Pāli 0.2 ở sn12.1 là 1. Buddhavagga, dùng 1. Phẩm Đạo Sư; Tiruttāraṇavagga có 0 lần trong tầng Việt dự án.
    Ghaṭasutta đặt làm Kinh Đống Muối theo Sujato A Mound of Salt; tầng chưa có tiền lệ cho Pāli ghaṭa nên không có cách dùng lại.
    Tôn giả Mahāmoggallāna dịch là Tôn giả Đại Moggallāna; tầng có cả dạng Mahāmoggallāna (sn21.1) và Đại Moggallāna, bản này chọn dạng dễ đọc hơn cho người Việt và giữ nhất quán trong cả bài. Đây là khác biệt có chủ ý so với sn21.1, xem coordinator nếu muốn thống nhất.
    2.12 và 2.13 là chiều hai của công thức yāvatā bhagavā ettāvatā … yāvatāhaṁ ettāvatā …: phía Đức Thế Tôn đã mở thiên nhãn và thiên thính về phía tôi, và phía tôi cũng đã mở về phía Ngài. dibbacakkhu dịch là thiên nhãn (có 125 tiền lệ trong tầng), sotadhātu dịch là thiên thính (chưa có tiền lệ trong tầng).
    vihārena vihāsi ở 2.1–2.3 dịch là duy trì buổi thiền; vihāra ở đây là buổi tu, không phải tự viện, và bản dịch không thêm tên kỹ thuật của một phương pháp cụ thể. Sujato cũng chỉ nói spent the day in a meditation.
    oḷārika ở 2.3 dịch là thô kệch, theo Sujato coarse meditation.
    4.1 và 5.1 là ẩn dụ kép: vua của các núi, núi Hi-mạn và đống muối lớn. Pāli ở hai khoá này là cắt ngang, không có chủ ngữ tường minh cho vế so sánh, nên bản dịch nối vế còn lại bằng còn tôi thì, đúng như Sujato đã nối (next to Mahāmoggallāna I am like a few pieces of gravel). Đây là chỗ duy nhất trong bài có chữ thêm, và ghi rõ ở đây. 4.2 và 5.2 chỉ dịch đúng những gì Pāli có, không thêm mệnh đề nào; hai khoá này Sujato để trống và do lớp lấp của dự án bù.
    āraddhavīriyo dịch là người cần cù; chưa có tiền lệ trong tầng, chọn vì đây là thuật ngữ chuẩn của vīriya trong tiếng Việt Phật học.
    kappaṁ tiṭṭheyyā ở 4.3 dịch là sống đủ một thời kỳ. Sujato để lifespan không rõ; kappa là thời kỳ rất dài, nên bản dịch giữ nghĩa thời kỳ chứ không rút về đời sống của con người.
    Cấu trúc ngoặc kép bám sát Pāli. Pāli ở bài này lệch một dấu kép kép ở tầng ngoài (mở ở 5.1, không đóng bằng kép mà đóng bằng nháy cong ở 6.4), nên bản dịa đóng cả hai lớp bằng ’ti. tại 6.4, theo cách 107 tệp đã merge xử lý trường hợp Pāli lệch. Nhấy cong ở 3.2, 3.3, 3.5, 3.7 và 6.1 bám đúng Pāli vì đó là lớp trích dẫn lồng.
    Tầng vietnamese-current vắng ở commit đã ghim (chỉ có Pháp Cú), nên không có bản Thích Minh Châu để đối chiếu cho bài này.
    Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
