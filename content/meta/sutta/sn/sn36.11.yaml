notes: |-
  Dịch từ Pāli root của commit bilara đã ghim, đối chiếu trực tiếp với bản dịch tiếng
  Anh của Bhikkhu Sujato tại cùng commit (tầng `english-project` của chính dự án có
  một khoá lấp chỗ trống ở `1.9` và đã `published`). **Tầng Việt hiện hành (Hòa thượng
  Thích Minh Châu) không có ở bài này** — bilara tại commit đã ghim chỉ phân phối Pháp
  Cú cho tiếng Việt, đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho.
  
  **DÙNG LẠI NGUYÊN VĂN — đo được 15/50 khoá** (12 khoá trùng nguyên văn ở bài khác +
  3 khoá lặp nguyên văn trong chính bài: `2.3`, `2.8`, `2.14` — cùng Pāli
  `Sukhā vedanā, dukkhā vedanā, adukkhamasukhā vedanā—` và cùng
  `‘yaṁ kiñci vedayitaṁ taṁ dukkhasmin’ti.`). Danh sách 12 khoá từ bài khác:
  `1.1` trùng `an6.27:1.1`, `sn12.16`, `sn22.35`, `sn22.63`, `sn36.23` (5 khoá);
  `1.6` trùng `mn28`/`mn3` (2 khoá) *Nhưng Đức Thế Tôn cũng đã dạy:*; `2.1` =
  *Lành thay, lành thay, này tỳ-kheo!* (đa số 11 khoá: `an4.186`, `sn22.66`–`70`,
  `sn56.15`, `sn56.16`); `2.25` = `sn36.15:1.17`; `2.29` = `sn36.15:1.20`;
  `2.30` = `sn36.15:1.21`; `2.32` = `sn36.17:2.8`; `2.34` = `sn36.17:2.10`;
  `2.35` = `sn36.17:2.11`; `2.36` = `sn36.15:1.28` và `sn36.17:2.12` (2 khoá);
  `2.37` = `sn36.15:1.29` và `sn36.17:2.13` (2 khoá); `2.38` = *Thứ nhất.* (290 khoá).
  **Hai cặp chỉ *bám cách dùng*, không trùng Pāli từng chữ:** `2.24` ← `sn36.15:1.16`
  (Pāli kia viết thường chữ đầu câu) và `2.31` ← `sn36.17:2.7` (Pāli kia là
  `bhikkhave`, bài này là `bhikkhu`) — cả hai đều dùng đúng câu
  *Với người đã chứng đạt định diệt tưởng và diệt thọ…* và *Này các tỳ-kheo, đây là
  sáu mức an tịnh.*
  
  **Ba chuỗi song song trong `2.16`–`2.30` và `2.32`–`2.37` dựng từ khung của
  `sn36.15` và `sn36.17`** (hai bài anh em cùng phẩm, đã publish, lùng mỗi chữ sau `…pe…`
  của cả ba chuỗi): `niruddhā` → *đã ngừng hẳn*; `vūpasantā` → *đã lắng dịu*;
  `paṭippassaddhā` → *đã hoàn toàn lắng dịu*. `jhāna` dùng *chứng đạt*, `āyatana` dùng
  *chứng nhận*, đúng như `sn36.15:1.23`–`1.27` (thiền là chứng đạt, xứ là nhập).
  
  **Bốn `āyatana` lấy theo đa số toàn tầng, có số đếm:** `ākāsānañcāyatana` → *hư không
  vô biên* (63), `viññāṇañcāyatana` → *thức vô biên* (88), `ākiñcaññāyatana` → *vô sở
  hữu* (151), `nevasaññānāsaññāyatana` → *phi tưởng phi phi tưởng* (140; năm khoá tiền
  lệ có Pāli trùng — `dn33`, `mn1`, `mn106`, `sn36.15`, `sn40.8` — đều dùng đúng cụm
  này, nên tôi giữ nguyên dù đọc lên thành tiếng Việt có vẻ lặp).
  
  **⚠ LỆCH CÓ CHỦ ĐÍCH, ĐÃ GHI — `2.15`, `2.26` dùng *các hành*, không dùng *các phép
  tu tập*.** `sn36.15:1.14`, `sn36.15:1.18` và `sn36.17:2.1`/`2.4` dịch
  `anupubbasaṅkhārānaṁ` thành *các phép tu tập*; tôi dịch thành *các hành* vì chính
  trong bài này `saṅkhārānaṁ` ở `2.7`–`2.13` là *các hành*, và một từ không thể mang
  hai nghĩa trong cùng một bài; `saṅkhāra` đo được *các hành* là cách phổ biến của
  tầng dự án. Người biên tập nếu muốn đồng bộ thì phải sửa **cả** `sn36.15`/`sn36.17`,
  không sửa riêng bài này.
  
  **Chỗ 0 tiền lệ, tôi dịch mới:** `0.3` `Rahogatasutta` (chỉ xuất hiện đúng một lần
  trong toàn bộ Pāli đã ghim) → *Kinh Trú Xa*, theo tên phẩm *2. Phẩm Về Trú Xa*.
  `2.7`, `2.9` `Taṁ kho panetaṁ, bhikkhu, mayā saṅkhārānaṁyeva … sandhāya bhāsitaṁ`
  (cả hai 0 tiền lệ) → *khi ta nói câu ấy là nhằm chỉ đúng … của các hành*: `yeva`
  giữ thành *đúng*, `sandhāya bhāsitaṁ` giữ *nhằm chỉ*. `2.9`–`2.13` là danh sách
  `khayadhammataṁ / vayadhammataṁ / virāgadhammataṁ / nirodhadhammataṁ /
  vipariṇāmadhammataṁ` — **0 tiền lệ ở cả năm vế** (quét toàn tầng), dịch mới thành
  *sự tận diệt / sự tiêu diệt / sự ly tham / sự chấm dứt / sự biến hoại*, theo đúng
  nghĩa `khayati/vayati/virajjati/nirodhati/vipariṇāmati` và theo thứ tự Sujato đã
  dịch (*liable to end, vanish, fade away, cease, perish*). `1.7` và `2.6`–`2.14`:
  `yaṁ kiñci vedayitaṁ taṁ dukkhasmin’ti` (0 tiền lệ) → *Cái gì được cảm nhận thì cái
  ấy nằm trong khổ*, giữ nguyên ở cả năm khoá. `1.3` `tisso vedanā vuttā bhagavatā` có
  tiền lệ `mn59` (2 khoá) là *Ngài nói có ba loại:* — **bản đó bỏ mất `vedanā`**, tôi
  không dùng lại mà dịch đủ là *Đức Thế Tôn đã nói ba cảm thọ này.*; nếu người biên tập
  muốn đồng bộ thì phải vá `mn59`.
  
  **Một chỗ tôi chọn khác đa số, có lý do:** `Sukhā vedanā, dukkhā vedanā,
  adukkhamasukhā vedanā—` có 13 khoá tiền lệ, chia làm ba cách; cách nhiều nhất (3 khoá,
  `mn59`) là *cảm thọ dễ chịu, cảm thọ đau khổ và cảm thọ không khổ không lạc.*, còn
  *cảm thọ dễ chịu, cảm thọ khổ, cảm thọ vừa khổ vừa dễ chịu—* có 2 khoá
  (`sn36.15:1.5`, `sn36.17:1.5`) và 2 khoá nữa ở `sn45.29`/`sn47.49`. Tôi theo 4 khoá
  **có dấu gạch cuối** vì ở `1.4`/`2.3` đây là câu độc lập bắt đầu bài, còn các bản
  *cảm thọ dễ chịu…* khác đều nằm giữa câu (theo sau *có ba loại:*) và bản *Là thọ
  sước…* (3 khoá `sn36.1`/`sn36.2`/`sn36.30`) mở bằng *Là* nên không vừa vị trí này.
  
