  - >-
    **Bản Anh đã ghim dùng làm cảnh báo, không làm authority — và ở đúng bài này
    nó lệch.** Bốn chỗ đo được: (1) tệp Anh có 54 khoá, **1** khoá rỗng
    (`11.5` `Catutthaṁ.`); (2) **1** khoá lệch số dấu lược so với Pāli ghin —
    `2.1`, Pāli có **3** dấu `…` còn bản Anh có **0**, tức đã âm thầm mở rộng ba
    chỗ lược; (3) **14** khoá bản Anh thêm nháy ở nơi Pāli không có (quy ước
    riêng của bản Anh); (4) **9.3–9.4** bản Anh dịch `Yo sāro brahmacariyassa /
    tasmiṁ aparapaccayā` theo kiểu hai mệnh đề độc lập, không phải quan hệ từ
    tương ứng — tôi theo Pāli. Không có lỗi HTML trong tệp Anh.
  - >-
    **Tên kinh — đo theo cả hai số rồi mới chọn.** Đếm trên `content/meta/sutta/sn/`
    (1703 tệp), Pāli `Arahantasutta ` trùng byte ở **6** khoá: *Kinh A-la-hán* **2**
    · *Kinh Bậc A-la-hán* **2** · *Kinh Bậc A-la-hán (Sáu Căn)* **1** · *Kinh
    Bậc A-la-hán (Căn Lành)* **1** ⇒ gộp lại **2** đối **4** về *Bậc A-la-hán*.
    Trọng yếu hơn cả đếm: bài **kế** (`Dutiyaarahantasutta` = `sn22.77`, đã
    `published`) dịch là *Kinh Bậc A-la-hán (**Hai**)*, mà *(Hai)* chỉ dẫn được từ
    *Bậc A-la-hán* chứ không từ *A-la-hán*. Chọn **Kinh Bậc A-la-hán**, và không
    thêm *(Nhất)* — quy ước đã kiểm được ở các cặp cùng loại: `Aniccasutta` →
    *Kinh Vô Thường* còn `Dutiyaaniccasutta` → *Kinh Vô Thường (Hai)*;
    `Abhinivesasutta` → *Kinh Sự Ám Ảnh* còn `Dutiyaabhinivesasutta` → *Kinh Sự Ám
    Ảnh (Hai)* (đếm được 242 cặp bản gốc/bản Dutiya trong tầng đã dịch).
  - >-
    **Tên phẩm — 5/5, không có tiền lệ nào lệch.** `8. Khajjanīyavagga ` trùng
    byte ở 5 khoá đã `published` ngay trong cùng phẩm (`sn22.73`, `74`, `75`,
    `77`, `78`), tất cả đều *8. Phẩm Khajjanīya*; dùng lại nguyên văn. Bản Anh
    dịch phẩm này là *8. Bitable* — một chơi chữ, không phải dịch tên phẩm, nên
    không theo.
  - >-
    **Luật dùng lại khi Pāli trùng byte, và chỗ hai phạm vi cho đa số khác nhau.**
    Luật áp dụng: *phạm vi gần nhất (`sn22`, toàn bộ đã `published`) thắng khi có
    dạng cạnh tranh; dùng lại nguyên văn khi phạm vi gần nhất chỉ có một dạng.*
    Số đo **cả hai** phạm vi: `1.3` toàn tầng *Cái gì vô thường thì khổ* **7**–6
    *Chỗ nào…* · `sn22` **4**–4. `1.4` **4**–4 cả hai phạm vi. `1.5` toàn tầng dạng
    *chỗ nào…* **8**–4, nhưng **5** trong 8 là viết hoa ở đầu câu nên không dùng
    được ở vị trí giữa vế; đếm riêng dạng dùng được thì **4**–3, và chọn theo
    *cái gì* để khớp `1.3`–`1.4` thành một chuỗi. `2.1` `sn22` **3**–1 nghiêng
    *chán nản nơi…* ⇒ theo. `2.2` toàn tầng **6**–1 và `sn22` **4**–1 nghiêng
    *Chán nản rồi ly tham…* ⇒ theo. `3.1` toàn tầng *Đức Phật đã nói như vậy* **103**
    nhưng `sn` **20**–3 và `sn22` **2**–0 nghiêng *Đức Thế Tôn đã nói như vậy* ⇒ theo
    phạm vi gần. `11.5` toàn tầng *Thứ tư.* **163**–95 nhưng `sn22` **7**–5 và `sn`
    **74**–40 nghiêng *Thứ bốn.* ⇒ theo phạm vi gần.
  - >-
    **Sai lệch còn lại so với bài anh em `sn22.77` (đã `published`) — báo để
    người biên tập gộp.** `sn22.76` và `sn22.77` là cặp nhất–kế của cùng một
    bài, phần `2.1–2.4` trùng Pāli từng khoá. Tôi theo đa số phạm vi gần ở `2.1`
    và `2.2`, nên hai bài lệch nhau ở hai khoá đó. Ở `2.3` và `2.4` phạm vi gần
    chỉ có **một** dạng (chính `sn22.77`) nên dùng lại nguyên văn. Riêng `2.4` tôi
    **viết hoa** chữ đầu (*Này* các tỳ-kheo) vì Pāli kết `2.3` bằng dấu chấm và
    mở câu mới ở `Yāvatā`, còn `sn22.77` để chữ thường — đây là sửa một chữ, cố ý.
    Cũng lưu ý: bản dùng lại ở `2.4` nén mất nhấn lặp `ete aggā, ete seṭṭhā`
    của Pāli, y hệt bản đã `published`.
  - >-
    **Một khoá cố ý lệch phép kiểm nháy: `4.3`, tỉ lệ 1/54 khoá.** Pāli
    `Asmimāno samucchinno,` không có nháy nào, còn `Ngã mạn ‘ta là’ đã chặt đứt,`
    có một cặp nháy đơn. Đây là lựa chọn có chủ ý: Pāli này trùng byte với
    `thag6.9:6.3` đã `published`, dịch sẵn là *ngã mạn ‘ta là’ đã chặt đứt*, và cả
    bản Anh cũng để nháy quanh *I am*. Tôi chỉ thay nháy thẳng `'` thành `’` cho
    đúng chính tả. Ngoài `4.3` thì cả 53 khoá còn lại khớp Pāli từng khoá.
  - >-
    **Dấu lược — đếm bằng số, không suy đoán.** Bài này **không** có `…pe…` và
    **không** có `(…)`. Pāli có `…` ở **4** khoá, tổng **6** dấu (mỗi khoá một dấu,
    riêng `2.1` có **3**); bản Việt cũng **6** dấu và khớp Pāli **54/54** khoá, khớp
    bản Anh **53/54** — khoá lệch duy nhất chính là `2.1` mà bản Anh đã mở rộng.
    Ba khoá `1.6`/`1.7`/`1.8` (`Vedanā …` `saññā …` `saṅkhārā …`) là chỗ Pāli ghim
    **lược**; tôi giữ nguyên một `…` và **không** mở rộng, vì mở rộng là thêm chữ
    không đánh dấu. Bài kệ `4.1–11.4` viết **đủ** từng câu, không nén.
  - >-
    **Mọi số Pāli trong bài, tự tính và in phép ra.** `Pañcakkhandhe` = *pañca* 5 +
    *khandha* ⇒ **năm** uẩn (`6.1`) · `satta` = **7** (`6.2`) · `Sattaratanasampannā` =
    *satta* 7 + *ratana* ⇒ **bảy** món báu (`7.1`) · `Tīsu` = **3** (`7.2`) ·
    `Dasahaṅgehi` = *dasa* 10 ⇒ **mười** (`8.1`) · `Catutthaṁ` = *catu* 4 ⇒ **bốn**
    (`11.5`) · `sattāvāsā` = *satta* 7 (`2.4`) — khoá này dùng lại nguyên văn bản đã
    `published`, vốn nói **các chỗ trú** chứ không đưa con số vào, nên không có nguy
    cơ nhầm *satta* 7 với *nava* 9 · `8.` ở tên phẩm giữ nguyên. Bài **không** có
    thang lớn (`sahassa`/`koṭi`/`vāci`) và **không** có `Tiṁsakappasahassa`. Bộ đo
    số của kho chạy trên lát này báo **hiệu chuẩn 9/9 cụm kiểm chuẩn đều quét 0
    mốc** (`cần 0 · đo được 0`) tức **không đo được gì**; số ở đây là tôi tự tính
    theo Pāli và in ra như trên, không phải kết quả của bộ đo.
  - >-
    **Bài kệ `4.1–11.4`: 32 khoá, không có tiền lệ trùng byte nào** (đã dò toàn
    tầng Pāli đã ghim: *Sukhino vata arahanto* 1 khoá, *Anejaṁ te anuppattā* 1,
    *Asekhañāṇamuppannaṁ* 1, *mohajālaṁ padālitaṁ* 1, *buddhā loke anuttarā* 1,
    *Dantabhūmimanuppattā* 3, *Uddhaṁ tiriyaṁ apācīnaṁ* 4, *puttā buddhassa orasā*
    1, *sattaratanasampannā* 51). Vì vậy phần này dịch từ Pāli, có đối chiếu bản
    Anh. Quy ước viết hoa của tầng đã được đo và dùng lại: **khoá lẻ (`.1`, `.3`)
    viết hoa, khoá chẵn (`.2`, `.4`) viết thường** — đúng như hai bài kệ đã
    `published` dùng làm chuẩn. Riêng `4.2` và `8.4` có Pāli gần giống nhau nên
    dịch **giống hệt** nhau, chỉ khác dấu chấm.
  - >-
    **0 tiền lệ, đặt mới, ghi kèm lý do:** `sattasaddhammagocara` → *cư trú trong
    bảy phạm vi của Pháp lành* (bản Anh: *their domain is the seven good
    qualities*) · `orasā` → *con út* (bản Anh: *bosom sons*) · `Anuvicaranti` →
    *vẫn đi lại* (bản Anh: *live on*) · `Anejaṁ` → *chỗ không lay chuyển* (bản Anh:
    *imperturbability*) · `Asekhañāṇa` → *trí không dao động*, ghép với `vikampanti`
    ở `10.1` cùng một chữ *dao động* để hai vế khớp nhau · `Vidhāsu` → *giữa muôn
    loại* (bản Anh: *due to the discriminations*) · `mohajāla` / `padālita` → *tấm
    lưới si mê* / *bị giẫm nát*. **Có tiền lệ và dùng lại nguyên văn:**
    `Pañcakkhandhe pariññāya` → *Sau khi thấu suốt tường tận năm uẩn* (`thag5.11:5.1`)
    · `Asmimāno samucchinno` → *ngã mạn ‘ta là’ đã chặt đứt* (`thag6.9:6.3`) ·
    `antimoyaṁ samussayo` → *thân này là thân cuối cùng* (`dhp351:4`, cùng Pāli
    trùng byte; hai chỗ nữa trong 4 khoá trùng byte dùng *thân xác này là thân xác
    cuối cùng*) · `Uddhaṁ tiriyaṁ apācīnaṁ` → *Trên, ngang, và dưới* (**2**–1) ·
    `Sattaratanasampannā` → *Đầy đủ bảy món báu quý giá* (**34/46**) · `brahmabhūtā` →
    *đã thành Phạm thiên* · `sīhanāda` → *tiếng sư tử* · `mahānāga` → *Đại Long* ·
    `pahīnabhayabheravā` → *đã đoạn bỏ sợ hãi và khiếp đảm* (tiền lệ 33 khoá).
  - >-
    **Bất định có nghĩa đáng kể — đã phân xử, ghi ở đây, không thêm vào thân
    kinh.** (1) `antimoyaṁ samussayo` (`9.2`) — đọc theo nghĩa vực quen thuộc
    `antimoyā` của bậc A-la-hán, tức *thân cuối cùng, hết nhiên liệu cho đời sau*;
    bản Anh đọc theo nghĩa chữ `moya` = *túi xương* và dịch *This bag of bones is
    my last*; cả hai cùng chỉ một việc, tôi theo dạng đã có sẵn trong tầng. (2)
    `Vidhāsu` (`10.1`) — `vidhā` là *loại, trạng thái*; bản Anh đọc là *discriminations*.
    Tôi giữ nghĩa chữ với *giữa muôn loại*; nếu người biên tập muốn bám Sujato thì
    đổi thành *dù các phân biệt* — **không** đổi nghĩa giáo nghĩa, chỉ đổi sắc thái.
    (3) `orasā` (`6.4`) — *con út*; nếu hiểu theo nghĩa *đệ tử trẻ* thì tương đương,
    tôi giữ nghĩa chữ. (4) `Anuvicaranti` (`7.3`) — *đi lại* là động từ *đi tới lui*;
    bản Anh chọn *live on* (sống tiếp); hai cách không đổi chủ thể. (5) `2.4` —
    bản dùng lại nén mất nhấn lặp `ete … ete …`; tôi giữ nguyên bản đã `published`
    thay vì tự sửa. (6) `sattāvāsā` — không đưa con số vào bản dịch (xem mục số Pāli).
  - >-
    **Lượt review đối kháng bắt được 1 lỗi, đã sửa.** `6.4` ban đầu viết *là những
    người con út của Đức Phật* — thừa chữ, đã rút còn *là con út của Đức Phật*.
    Ngoài ra phép kiểm dấu lược của chính tôi lần đầu **báo nhầm** `2.1` là lỗi
    vì mới chỉ so *có/không* dấu lược chứ chưa so *số* dấu; đã sửa phép rồi đo
    lại (`2.1` có **3** dấu ở cả hai vế).
