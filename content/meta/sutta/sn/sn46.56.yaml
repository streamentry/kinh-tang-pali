notes: |-
  Đối chiếu: Pāli root + English Sujato + tiền lệ trong kho. Tầng HT. Thích Minh Châu không có cho SN.
  Số khoá: 56/56; mọi "…" của Pāli (3.1-3.3, 6.1) giữ nguyên.
  Cặp Pāli trùng nguyên văn tái dùng: 1.2 = dn25:1.2; 1.9 = sn42.3:1.4; 6.2 = mn118:42.7/mn2:21.8/dn33:1.11.97 ("tu tập giác chi xả dựa trên viễn ly, ly tham, đoạn diệt, hướng đến buông bỏ" — bỏ "và" đầu vì "…pe…" đã tách ở 6.1); 7.3/4.3-family = sn46.14:3.5-3.6; 7.7 = "Chaṭṭhaṁ." (sn36.16 v.v.). Tổng: 16/56 segment có segment Pāli trùng đã dịch; các cặp lặp trong bài (4.x đối xứng 7.x; 2.4 = 3.5; 5.5 = 6.4; 2.1-2.2 = 5.1-5.2 dạng phủ định/positif) dịch khớp.
  Tiêu đề: :0.2 "Sākacchavagga" -> "6. Phẩm Hỏi Luận" (sn46.53:0.2); 7.8 "Sākacchavaggo chaṭṭho." -> "Phẩm Hỏi Luận, thứ sáu." theo mẫu "Buddhavaggo paṭhamo." -> "Phẩm Đức Phật, thứ nhất." (mil6.1.9); 8.0 "Tassuddānaṁ" -> "Tổng tụng" (dn34).
  Thuật ngữ: nīvaraṇa -> "triền cái" (glossary pali-vi.yaml, 151 chỗ trong kho); bojjhaṅga -> "giác chi" (glossary); "kāmarāgapariyuṭṭhitena cetasā viharati Xparetena" theo mn64:5.11 ("bị dục tham chi phối, chìm đắm trong dục tham") nhưng thống nhất "bị chìm đắm trong" cho mọi triền cái trong bài; vicikicchā -> "nghi hoặc" (mn108:26.11); uddhaccakukkucca -> "trạo hối" (an5.193:10.1); thīnamiddha -> "hôn trầm".
  :0.3 "Abhayasutta" -> "Kinh Abhaya" (giữ tên riêng): bài này là với thái tử Abhaya ("abhayo rājakumāro"), tên người; tiền lệ an9.56/an4.184 dịch cùng tiêu đề Pāli là "Kinh Sự Không Sợ Hãi"/"Kinh Không Sợ Hãi" — hai bản đó không phải ngữ cảnh thái tử Abhaya rõ ràng như ở đây, giữ tên riêng theo luật tên riêng; ghi lại sự bất đồng này. Udāna 8.1-8.4 (English để trống): dịch nghĩa từ Pāli, liệt kê chủ đề các kinh 46.51-56 (Āhāra/Pariyāya/Aggi/Mettā/Saṅgārava/Abhaya được hỏi/trên núi Gijjhakūṭa); 7.6 dịch trực tiếp từ Pāli (không có tiền lệ cùng segment).
