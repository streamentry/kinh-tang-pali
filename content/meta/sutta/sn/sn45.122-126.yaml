    `nibbānaninno hoti nibbānapoṇo nibbānapabbhāro` → *có xu hướng về phía Niết-bàn, có bến về phía Niết-bàn, có dòng về phía Niết-bàn* theo đúng `sn45.115:1.2` và `sn45.121:1.2`.
  - >-
    **Vế thứ ba của ẩn dụ dòng sông: `pabbhāro` là *bãi bồn*, không phải *có
    dòng* — đã sửa 3 khoá (3 lần).** `nibbānaninno hoti nibbānapoṇo
    nibbānapabbhāro` là ẩn dụ ba vế của một dòng sông: *có xu hướng (nghiêng)*
    · *có bến* · *bãi bồn (đổ sang bờ bên kia)*. Bản đang có dịch vế ba là *có
    dòng về phía Niết-bàn* — tức **lặp lại nghĩa vế nhất** (`ninno` đã là *có
    xu hướng về phía …*) và **đánh rơi** nghĩa của `pabbhāro`, vốn là vế độc
    lập: chỗ nước dồn lên bãi rồi tràn sang bờ bên kia. Đã sửa thành *có bãi
    bồn về phía Niết-bàn* theo mẫu đúng đã có sẵn ở `sn45.152:1.1` (*cây trôi
    về phía đông, có bến về phía đông, có bãi bồn về phía đông*); giữ nguyên
    vế một, vế hai và nhịp câu của chính bài này. Khoá đã sửa:
    `sn45.122-126:1.11`, `sn45.122-126:1.12`, `sn45.122-126:1.14`. Lớp lỗi này
    sinh ra từ chính luật *Pāli trùng nguyên văn thì cách dịch phải khớp*: một
    bài sai trước đó được nhân bản sang các bài cùng Pāli, nên nó lan rộng và
    trông rất nhất quất — đúng cái làm cho nó khó thấy. Quét lại trên **mọi**
    dạng chia của `pabbhāra` (`nibbānapabbhāro` và `nibbānapabbhāraṁ`), chứ
    không chỉ dạng danh từ, mới thấy hết lớp này. **Không** ép về khuôn
    *nghiêng / xuôi / đổ* của 28 khoá ở 11 bài khác (`mn73`, `sn45.149`,
    `sn46.77-88`, `sn47.51-62`, `sn48.71-82`, `sn48.125-136`, `sn49.1-12`,
    `sn50.1-12`, `sn50.55-66`, `sn51.33-44`, `sn55.22`) và 3 khoá *có bãi bồn*
    đã có sẵn ở `sn45.152` — đó là các cách dịch khác hợp lệ; ép khuôn sẽ sinh
    vấn đề mới. Đo lại toàn tầng sau khi sửa: Pāli có `nibbānapabbhāra*` ở 87
    khoá / 32 bài, **0 khoá** nào còn dịch vế ba bằng *có dòng*. Ghi chú cũ
    của tệp này có nêu *… bến …, … dòng về phía …* như nguyên văn dùng lại /
    như tiền lệ đếm được; nay bị mục này thay thế, không xoá, để lịch sử còn
    đọc được. Hạ `semantic_fidelity` (−0.3 × 3) và `terminology` (−0.1 × 3)
