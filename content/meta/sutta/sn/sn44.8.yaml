notes: |-
  Đợt 19, lát l11. Dịch từ Pāli root ở commit đã ghim, đối chiếu English Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục tra cứu toàn văn (không căn lề được vào segment, chỉ dùng để đọc ý và so thuật ngữ).

  COVERAGE TẦNG ANH (đo thật): mẫu số 43 khoá Pāli có nội dung (>= 40 ký tự, bỏ khối :0), Sujato có chữ ở 21 khoá, 21/43 = 0,488, DƯỚI ngưỡng 0,80. Sujato chỉ dịch lượt hỏi đáp thứ nhất với Đức Thế Tôn, rồi tóm toàn bộ lượt hỏi đáp thứ hai với Tôn giả Mahāmoggallāna (4.3 đến 6.15) trong một câu ở 4.2 ("asked ... the same questions, and received the same answers"). Vì vậy 4.2 được đếm là có chữ nhưng thực tế chỉ phủ phần dẫn nhập; độ phủ thật còn thấp hơn 0,488. Các khoá Sujato bỏ trống trên Pāli có nội dung: 1.7, 2.3, 2.6, 3.8, 3.16, 4.3, 4.4, 4.5, 4.6, 4.7, 5.1, 5.3, 5.4, 5.6, 6.1, 6.5, 6.6, 6.8, 6.9, 6.13, 6.14, 6.15. Chưa có lớp english-project cho bài này. Theo luật cổng: coverage dưới 0,80 thì status draft kèm blocker, triangulation không quá 8,0 (đặt 7,0), và entry trong reference-gaps không cứu được published. Điểm trung bình thô là 9,18 nhưng blocker thắng điểm. Bài chỉ nâng lên được khi lớp english-project lấp các khoá trên và được published để coverage tính lại.
  Tầng Việt hiện hành (phantuananh) chỉ có Pháp Cú tại commit đã ghim, nên không có tầng Việt phân đoạn cho bài này; bản Thích Minh Châu ở trên chỉ là nguyên bài, không cấp text cho tầng nào.

  Cấu trúc bài: hai lượt hỏi đáp lặp nhau gần nguyên văn, lượt một với Đức Thế Tôn (1-3) và lượt hai với Tôn giả Mahāmoggallāna (4-6), rồi lời cảm thán của Vacchagotta (7). Pāli trùng nguyên văn TRONG CHÍNH bài: 18 nhóm, bản Việt dùng đúng một cách dịch cho mỗi nhóm, 0 nhóm lệch. Chỗ Pāli khác nhau có chủ ý thì Việt khác theo ngữ cảnh: 1.4 "mayā" (do Ta) / 4.4 "bhagavatā" (do Thế Tôn); 2.4 "bhoto gotamassa" / 5.4 "samaṇassa gotamassa"; 3.15-16 rút gọn bằng dấu lược / 6.15 liệt kê đủ mười luận điểm.

  Dùng lại nguyên văn tiền lệ: 0.2 "1. Phẩm Không Tuyên Bố" (7 nơi cùng phẩm); 4.6 "Này Vaccha, điều này cũng không được Thế Tôn tuyên thuyết:" (2 nơi, sn44.3 và sn44.6); 1.7 và 4.7 "‘Như Lai phi tồn tại phi phi tồn tại sau khi chết’.”" (3 nơi, sn44.x); 7.7 "Thứ tám." (106 nơi). Số cặp Pāli trùng với bài khác đã dò: 8 chuỗi (0.2, 1.1, 1.2, 1.7, 3.3, 3.4, 4.6, 7.7); trong đó bản Việt của tầng khác nhau ở 1.1 và 1.2 (mỗi cách chỉ một nơi, không có đa số) và ở 3.3, 3.4 (tiền lệ đứng trong công thức tipissa khác, "nơi tưởng …", nên bài này dùng "tưởng …" theo mạch "Họ thấy … tưởng …").

  Thuật ngữ, kèm số đếm toàn tầng Việt:
  - attā trong công thức "rūpaṁ attato samanupassati, rūpavantaṁ vā attānaṁ ...": "tự ngã" 63 khoá, "tự thân" 16 khoá (chỉ riêng sn22: ngã 18 · thân 16; mn 28, an 16, dn 1: ngã hoàn toàn). Chọn "tự ngã" theo đa số toàn tầng. Lưu ý sn44.10 (cùng phẩm) dùng "tự thân" cho câu hỏi "attā atthi"; hai bài khác công thức, nhưng người biên tập có thể muốn thống nhất cả phẩm.
  - samanupassati: "thấy" 6 · "quán" 5 trong sn; chọn "thấy" cho rõ nghĩa.
  - taṁ jīvaṁ taṁ sarīran / aññaṁ jīvaṁ aññaṁ sarīran: toàn tầng "linh hồn" 17 · "mạng" 6; riêng công thức đủ mười luận điểm "linh hồn" 5 · "mạng" 3 (mạng: sn56.8, sn56.41, sn33.55). Chọn "linh hồn là thân" / "linh hồn khác, thân khác", ghi bất định: jīva có thể được hiểu là "mạng, sinh mạng".
  - bho gotama / bho moggallāna: "Tôn giả Gotama" 46 + "thưa Tôn giả Gotama" nhiều nhất trong sn (so với "ông Gotama" 7). Chọn "thưa Tôn giả Gotama / Moggallāna" theo sn44.10, sn44.11, sn12.18.
  - aññatitthiya paribbājaka: "du sĩ ngoại đạo" (đa số trong sn45, sn35, sn36, sn54). Hetu/paccayo: "nhân/duyên" (sn44.3-6, sn35, sn31, sn29...). Abyākataṁ: "không được ... tuyên thuyết" (sn44.3, 44.4, 44.6, 44.11). Tathāgato paraṁ maraṇā: "Như Lai ... sau khi chết", "phi tồn tại phi phi tồn tại" (3 nơi cùng phẩm, 168 khoá toàn tầng theo quy ước nevasaññānāsaññā).
  - asassato / antavā / anantavā: "không thường còn" (sn33.1) / "có biên" / "vô biên" (sn56.8, sn56.41, sn33.55). Không dùng "vô thường" cho asassato vì dễ lẫn với anicca.
  - Acchariyaṁ abbhutaṁ: "Thật kỳ diệu ... Thật hy hữu ..." (5 + 3 nơi trong tầng, vắng tiền lệ riêng cho "bho moggallāna").

  Bất định đã ghi (không thêm vào thân kinh):
  1. 2.5, 3.15, 5.5, 6.15: hậu tố "-tipi" ("‘sassato loko’tipi") là "cũng, dù là". Bản Việt dùng "hay" để nối chuỗi luận điểm phủ định ("không trả lời như sau: A hay ... hay Z"). Không dịch từng chữ "cũng" vì sẽ thành "A cũng không ...", đảo cấu trúc; hai tiền lệ sn22.47 và sn44.4 cùng công thức tipissa cũng bỏ "pi". Nghĩa phủ định bao quát được giữ.
  2. 7.2, 7.6 "aggapadasmiṁ": "agga" là tối thượng, "pada" là điểm, câu, từ. Sujato dịch "the chief matter"; Hòa thượng Thích Minh Châu dịch "tối thượng văn cú"; tiền lệ duy nhất cùng công thức là an11.7:10.2 và 10.6 dịch "đệ nhất cú" (2 nơi). Bài này chọn "điểm tối thượng", hiểu pada là điểm của vấn đề; cách hiểu "câu, từ tối thượng" cũng hợp lý và không thể phân xử chỉ bằng Pāli trong bài. "padehi" ở 7.4 dịch "từ ngữ", "byañjanehi" dịch "lời văn" (không dùng "văn cú" cho cả hai để khỏi gộp hai khái niệm).
  3. 7.3 "Idānāhaṁ": "vừa rồi, bây giờ"; chọn "vừa rồi" vì Vacchagotta vừa rời chỗ Đức Thế Tôn ở 4.1.
  4. 1.3 và 4.3 "kiṁ nu kho ... sassato loko": câu hỏi có/không, dịch "có phải thế giới là thường còn?".
  5. Tiêu đề: Pāli "Vacchagottasutta"; "Kinh Vacchagotta" trùng với an3.57:0.3 (bài khác trong Tăng Chi). Người điều phối có thể thêm dấu phân biệt.

  Phương án đã cân nhắc và loại bỏ khi review đối kháng: (a) dịch "-tipi" thành "cũng không", vì đảo cấu trúc phủ định thành "A cũng không ..."; (b) dùng "văn cú" cho cả padehi lẫn byañjanehi, vì gộp hai khái niệm; (c) viết "Mahāmoggallāna" trong lời xưng hô của Vacchagotta, trong khi Pāli chỉ có "bho moggallāna", nên xưng hô chỉ để "Moggallāna" còn "Mahāmoggallāna" chỉ ở câu kể 4.1 và 4.2.

  Kiểm: 67/67 khoá khớp tập khoá Pāli, đúng thứ tự, 0 khoá thừa, 0 khoá rỗng; nháy đơn và nháy kép khớp Pāli từng khoá 67/67 (0 lệch); dấu lược 21 khoá có "…pe…" đều thành đúng một "…" (0 lệch); 4.4 và 1.4 kết " …." theo Pāli kết "…pe….", đúng đa số toàn tầng (398 khoá); NFC; không Pāli lọt sang Việt; 18 nhóm Pāli trùng nguyên văn trong bài, 0 nhóm bản Việt khác nhau; không có số Pāli cần tính (bài không chứa số lượng ngoài "mười luận điểm" ở 6.15 đã đếm đủ 10 mục: 4 về thế giới, 2 về linh hồn và thân, 4 về Như Lai).

