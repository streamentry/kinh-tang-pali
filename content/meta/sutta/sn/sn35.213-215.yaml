  - >-
    **Lượt review đối kháng bắt được 6 lỗi, đã sửa hết.** (1) **Tiền lệ sai
    nghĩa** — `sn33.21-25:1.2` đã publish ghi *Này nữ hoàng Vaccha*, nhưng
    Vacchagotta là **nam** du sĩ và `vaccha` ở đây chỉ là tiếng gọi thân mật;
    *nữ hoàng* không có căn cứ trong Pāli. Tôi dùng *Này Vaccha* và ghi rõ ở đây
    — không sao chép lỗi, cũng không âm thầm viết lại bản đã publish. (2–5)
    **Sai thuật ngữ ở bốn khoá** — lần viết đầu `sn35.216-218:1.3`/`1.10` và
    `sn35.219-221:1.2`/`1.8` ghi *chỗ nào là **khổ**, chỗ ấy cần được thấy…*
    trong khi Pāli là `Yadanattā` (**vô ngã**); nguyên nhân là tôi sao hằng của
    bài *Khổ* sang bài *Vô Ngã*. Đã sửa cả bốn về *Chỗ nào là vô ngã…* (không vị
    ngữ, đúng Pāli). (6) **Thêm vị ngữ không có trong Pāli** —
    `sn35.213-215:1.2` (`Yadaniccaṁ, taṁ dukkhaṁ.`) tôi thêm *này các tỳ-kheo,*;
    đã bỏ. Ngoài ra bản nháp đầu của `sn33.16-20` đặt ngoặc kép sai ở `1.3`
    (Pāli không có) và thừa `”` ở `1.4` (`vīsatimaṁ.` không có ngoặc) — đã viết
    lại toàn bộ từ Pāli sạch.
  - >-
    **Cả bốn bài đều dưới ngưỡng 80% và đã ghi ở `content/meta/reference-
    gaps.yaml`** (203 → **207**): `sn33.16-20`, `sn35.213-215`, `sn35.216-218`
    đều **25%** (3/4 substantive segment không có prose Sujato), `sn35.219-221`
    **50%** (2/4 — Sujato còn prose ở `1.1`/`1.2`). Nguyên nhân đo được: Sujato
    để trống các mệnh đề đệ quy và `…pe…` (chỉ còn prose ở khoá mở đầu), còn
    Pāli tách riêng từng khoá. Đây là **giới hạn của bản chụp upstream**; tôi
    **không** mở rộng dấu lược để bịa tiếng Anh, và chỗ đó Pāli tự đứng vững.
  - >-
    **Đặc thù của tầng Pāli tại commit đã ghim — ghi ra, không sửa Pāli, không
    chú thích trong thân kinh:** (1) `sn33.16:1.4` chứa một dấu nháy thẳng ASCII
