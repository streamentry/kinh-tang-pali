    **Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên
    **48.784 segment đã `published`**: `số = đếm('…pe…') + đếm('…' còn lại sau
    khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải
    `…pe…`. Khớp **48.359 / 48.784 = 99,13%**. Lát này có **22** segment Pāli
    mang dấu lược (7 ở `sn33.16-20`, 5 ở mỗi bài `sn35`). `…pe…. ` → **một** `…`
    rồi dấu chấm; `…pe…` **ở đầu** segment là dấu lược **đầy đủ**, vẫn giữ; dấu
    `…` trần **ở đầu** segment thì **bỏ**.
