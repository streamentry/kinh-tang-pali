notes: |-
  Dịch từ Pāli root; đối chiếu bản Anh Bhikkhu Sujato ở commit đã ghim. Coverage Anh 13/13 đoạn Pāli có nội dung = 100%, nhưng hai đoạn (3.4 và 3.13) chỉ có chữ Anh nhờ tầng english-project của chính dự án, và tầng đó đang published với cùng người chấm (OpenCode Space Bunny Free (agent)) — vì vậy bản lấp không phải một lớp Anh độc lập, triangulation chỉ 9.0 và scorecard này không tuyên bố đã đối chiếu English cho hai đoạn ấy.
    Tầng Việt hiện hành không có bài này: translation/vi/phantuananh/ ở commit đã ghim
    chỉ chứa 26 chương Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu
    thuật ngữ; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo.
    budsas.org chỉ là tra cứu toàn văn, không cấp text cho tầng nào.
  Công thức trùng nguyên văn với sn24.1 và sn24.2 của cùng lát, nên dùng lại nguyên văn các khung: kismiṁ nu kho … sati … upādāya … abhinivissa; rūpe kho … sati; vedanāya/saññāya/saṅkhāresu/viññāṇe sati; Taṁ kiṁ maññatha; aniccaṁ, bhante; no hetaṁ, bhante; ayaṁ vuccati … ariyasāvako sotāpanno. Phần *không chấp thủ vào nó mà ý kiến như sau vẫn khởi lên* là nguyên văn sn24.1.
  0 tiền lệ sạch trong kho cho câu phủ định, nên dịch mới theo nghĩa: natthi hetu, natthi paccayo → *Không có nhân, không có duyên*; ahetū appaccayā → *không phải do nhân, không phải do duyên*; avasā abalā avīriyā → *không tự chủ, không có sức, không có nỗ lực*; niyatisaṅgatibhāvapariṇatā → *bị định mệnh, hoàn cảnh và bản chất chi phối*; chasvevābhijātīsu → *trong sáu cõi sinh ấy*; paṭisaṁvedentī → *cảm nhận*.
  Bất định đã ghi. niyatisaṅgatibhāvapariṇatā là một danh từ kép gồm bai nguyên tố (niyati / saṅgati / bhāva) mà Pāli không tách; tôi dịch theo ba danh từ *định mệnh, hoàn cảnh, bản chất* — cách Sujata hiểu — nhưng ba từ này không có tiền lệ trong kho, nên ambiguity_integrity 9.1. Tương tự, purisathāmo/purisaparakkamo → *sức bền của người / sức cố của người* là cách chuyển nghĩa tự nhiên, không phải thuật ngữ đã có.
  Tên phẩm 0.2 đo trong chính phẩm: 15 tệp sn24 đều ghi *1. Phẩm Nhập Lưu*. Tên bài Hetusutta đặt *Kinh Nhân*, khớp với tiêu đề Anh Cause và với chủ đề duy nhất của bài.
  Dấu lược và ngoặc kép. Mười hai khoá có lược, tất cả là lược thật của Pāli, giữ nguyên một dấu; 4.1 có …pe… nên chỉ hiện ba chỗ (những chỗ, khổ, con đường), phần bị lược không viết lại. Ngoặc kép: Pāli của chính bilara mở dấu ở 1.9 nhưng dấu đóng bị nuốt trong …pe… cùng khoá, nên cả tệp Pāli lệch một dấu; bản Việt đặt dấu đóng ngay sau dấu lược ở 1.9, đúng chỗ bị lược, để cân được. Đây là chỉnh sửa dấu câu, không thêm chữ nào.
    technical_integrity 9.6: môi trường lát này không cho chạy npm run validate|test|
    build|check|audit|reference:gaps. Bài tự kiểm bằng bản cài lại nguyên vẹn logic của
    _hvi.py: đủ 46/46 khoá, 0 khoá thừa, 0 khoá để trống, NFC, không khoá nào trùng
    nguyên văn Pāli, số dấu lược khớp từng khoá, ngoặc kép cân trên cả bài theo thứ tự
    số. Coverage Anh tính lại bằng đúng công thức của src/lib/canon/reference.ts
    (Pāli ≥40 ký tự sau khi nén khoảng trắng, bỏ khối tham chiếu :0).
