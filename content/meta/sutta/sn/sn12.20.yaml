notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt Hòa thượng Thích Minh Châu (nguyên bài, đọc để tra thuật ngữ — không có tầng phân đoạn). Đủ 64 khoá, đúng thứ tự Pāli.
  Coverage English: mẫu số 25 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`), Sujato phủ 25/25 = 100%. Các khoá Sujato để trống (`5.7`, `5.10`, `5.11`, `6.0`–`6.6`) đều ngắn dưới ngưỡng. Không có lớp `english-project` cho bài này; tầng `vietnamese-current` ở bilara không có bài này nên không tính vào coverage.
  Bất định chính, đã phân xử bằng Pāli và văn cảnh. (1) `5.1`–`5.7`: nghĩa đen của câu là khẳng định — «vị ấy sẽ chạy ngược về quá khứ … sẽ chạy tới tương lai … sẽ phân vân về hiện tại» — và phủ định chỉ đến ở cuối (`netaṁ ṭhānaṁ vijjati`). Đọc từng khoá rời sẽ thành «vị thánh đệ tử vẫn hoài nghi», ngược hẳn nghĩa bài. Đã giữ nguyên trật tự Pāli (mệnh đề điều kiện `Yato kho … sudiṭṭhā honti` → «thì việc vị ấy sẽ …», rồi `—` → «điều ấy không thể có»), theo cấu trúc `so vata … netaṁ ṭhānaṁ vijjati` đã có ở `mn148:28.8` và `mn99:13.2`; Sujato dịch cùng nghĩa («quite impossible»). Bản Thích Minh Châu đảo thành «không chạy theo quá khứ» và đặt phủ định ở đầu — đúng nghĩa nhưng đổi trật tự, nên không theo để giữ truy được từng khoá. (2) `3.16`: `tathatā avitathatā anaññathatā` → «tính chân thật, tính không hư dối, tính không đổi khác»; ba từ này là ba mặt cùng một nghĩa, Sujato «real, not unreal, not otherwise», Thích Minh Châu «như tánh, bất hư vọng tánh, bất dị như tánh». Cách chọn từ Việt là lựa chọn biên tập, không phải điều Pāli quyết định. (3) `idappaccayatā` → «tính điều kiện cụ thể», theo `mn26:19.4`, `mn85:43.4` và `sn6.1:1.6`; Thích Minh Châu «y duyên tánh».
  Công thức Như Lai, dùng lại: `2.3`/`3.11` và `2.4`–`2.6`/`3.12`–`3.14` — cùng Pāli trong bài, bản Việt giống nhau từng chữ; `2.3`, `2.4`, `2.5` theo `an3.136:1.1/1.3/1.4` (`dhātu` → «giới tánh», `abhisambujjhati abhisameti` → «giác ngộ … hoàn toàn hiểu rõ», bảy động từ `ācikkhati … uttānīkaroti`). Đã dò 6 cặp Pāli trùng nguyên văn với phần còn lại của tầng, 2 cặp khác bản: `1.3` (tầng không có đa số, 40 khoá chia nhiều dạng — chọn «khéo tác ý» như `sn12.3:1.3` và `sn22.7:1.3`, «Ta» viết hoa như 7/10 khoá `sn`) và `3.17` (`ayaṁ vuccati …` ở đây nối tiếp dấu `—` của `3.16` nên phải viết thường, khác `sn12.1:2.14`).
  Chuỗi `4.2`–`4.13`: `khayadhammaṁ vayadhammaṁ virāgadhammaṁ nirodhadhammaṁ` → «có pháp đoạn tận, có pháp hoại diệt, có pháp ly tham, có pháp diệt tận», theo `sn22.21:1.5/1.7/1.10/1.12` (4 khoá; cùng công thức `aniccaṁ saṅkhataṁ paṭiccasamuppannaṁ`). Đã đo: `dn15` giữ «có bản chất tiêu hoại, suy tàn …» (3 khoá), `mn74` «có tính tận, có tính hoại …» (3 khoá); chọn dạng `sn22` vì cùng bộ và cùng công thức.
  Thuật ngữ, đã đếm: `jāti` → «sanh» (`sn12.1:2.11`, `sn12.52:1.6`; cả tầng `sn` 19 sanh / 10 sinh khi đi cùng `jātipaccayā`) còn `paṭiccasamuppanna` → «do duyên sinh» (tầng 74 «sinh» / 8 «sanh») — hai chữ khác nhau để «Sanh … do duyên sinh» ở `4.3` không đọc thành cùng một từ. `jarāmaraṇa` → «già chết» (sn12: 37 «già chết» / 17 «già-chết»); `taṇhā` → «khát ái» (sn12: 47 / «ái» đơn 115, nhưng `sn12.1` dùng «khát ái»); `nāmarūpa` → «danh sắc» (38 / 4 «danh-sắc»); `saḷāyatana` → «sáu xứ» (28 / 24 «sáu căn»); `upādāna` → «chấp thủ» (67); `ariyasāvaka` → «vị thánh đệ tử» (166 trong `sn`). Tên phẩm «2. Phẩm Đoàn Thực» theo 6/7 khoá `:0.2` cùng phẩm.
  Tên kinh: `Paccayasutta` → «Kinh Duyên» (Sujato «Conditions», Thích Minh Châu «Duyên»). `sn12.27:0.3` cùng tên Pāli nhưng đang là «Kinh Nhân»; đó là chữ dành cho `hetu`, không phải `paccaya` — ghi lại để biên tập quyết định, không sửa ngoài phạm vi bài này.
  Số: `Dasamaṁ` = thứ mười; `dutiyo` = thứ hai; `Dve ca samaṇabrāhmaṇā` = hai bài (`sn12.13`, `sn12.14`); `Dasamo` = thứ mười. Kệ tóm lược liệt kê đúng mười bài (Āhāra, Phagguna, hai Sa-môn Bà-la-môn, Kaccānagotta, Người Giảng Pháp, Acela, Timbaruka, Kẻ Ngu và Người Trí, Duyên).
  Lượt review đối kháng: đã in từng cặp Pāli↔Việt đọc lại; kiểm tập khoá 64/64, nháy đơn và nháy kép khớp Pāli từng khoá, dấu lược cân bằng Pāli (`…pe…` → một `…`), 0 từ Pāli lọt sang Việt trong thân bài. Khoá `0.1` giữ tên bộ «Saṁyutta Nikāya» theo quy ước tầng.
  `technical_integrity` 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` ở lượt này (do người điều phối chạy), nên không tuyên bố technical gate đã pass.
