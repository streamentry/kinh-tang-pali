  Dịch từ Pāli root tại commit đã ghim. COVERAGE ĐO LẠI bằng chính hàm của kho (`englishCoverageFor`, ngưỡng 0.8 trong `source/layers.yaml`): `english-sujato` phủ 27/27 khoá Pāli có nội dung = 1.000; `english-project` có tệp lấp cho bài này nên được tính vào. Tầng `vietnamese-current` không có — tại commit đã ghim bilara chỉ phân phối Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu.

  ĐỢT NÀY LÀ LƯỢT REVIEW ĐỐI KHÁNG THỨ HAI, trên bản dịch đã có trên đĩa. Sửa 1 khoá, giữ nguyên 39/39 khoá:
    · `5.17` — LỖI NGHĨA. Pāli `Imesañca pana, bhikkhave, catunnaṁ iddhipādānaṁ bhāvitattā bahulīkatattā moggallāno bhikkhu āsavānaṁ khayā anāsavaṁ cetovimuttiṁ paññāvimuttiṁ diṭṭheva dhamme sayaṁ abhiññā sacchikatvā upasampajja viharatī”ti.` không có chữ `hoặc` nào cả, mà bản dịch có `hoặc` HAI lần: `do đoạn tận các lậu hoặc` và `tuệ giải thoát không còn lậu hoặc ngay trong hiện tại` — đọc thành câu vô nghĩa, và `hoặc` lại là liên từ tương phản nên còn sai lệch nghĩa. Đã sửa thày đủ `do đoạn tận các lậu, … an trú tâm giải thoát không lậu, tuệ giải thoát ngay trong hiện tại` (theo `anāsavaṁ` và `āsavānaṁ khayā`).
    ĐÂY LÀ CHỖ DUY NHẤT TRONG LÁT CỐ Ý PHÁ VỠ KHỚP BYTE-FOR-BYTE VỚI BẢN VIỆT ĐÃ CÓ, và lý do phải ghi rõ: khoá này trùng Pāli tuyệt đối với `sn51.31:4.2` (`Imesañca pana, bhikkhave, catunnaṁ iddhipādānaṁ …`), bản Việt ở đó cũng có đúng hai chữ `hoặc` ấy — tức lỗi này được sao chép từ bản Việt đã có chứ không phải do dịch sai Pāli. Nhưng khác với `5.5`/`5.6`/`5.10` (xem dưới), cách dùng ở `sn51.31` vẫn đọc được và giữ được hình ảnh gốc, còn hai chữ `hoặc` ở đây làm câu không lập được. Sửa trong lát, và GHI NHẬN để người điều phối sửa nốt `sn51.31:4.2` — tệp đó ngoài lát này nên mình không đụng vào.

  ĐO LẠI TIỀN LỆ (không tin số của người khác):
    · 0.1 bài sn: quét 1.608 khoá `:0.1` trong tầng `sn` -> 1.608/1.608 viết `Saṁyutta Nikāya`, 0 tệp nào trong cả tầng ghi `Saṡyutta` (grep `Saṡyutta` trong `content/translation/vi/project/` = 0 hit). Chốt `Saṁyutta Nikāya 51.14`.
    · 0.1 bài an: quét 1.248 khoá `:0.1` trong tầng `an` -> `Kinh Tăng Chi Bộ` 895, `Aṅguttara Nikāya` 353.
    · Tên phẩm: `2. Pāsādakampanavagga` -> `2. Phẩm Vui Vẻ` (7 tệp, sn51.12-sn51.19). Cách này đã có sẵn trong tầng và được giữ để không tạo cách thứ N+1, dù Sujato dịch phẩm này là *Shaking the Stilt Longhouse* và nghĩa Pāli `pāsādakampana` là làm lay chống sàn.
    · Dấu lược: đếm từng khoá, `…pe…` tính là MỘT dấu lược, dấu `…` trần cũng một — `5.5` (1/1), `5.6` (1/1), `5.16` (2/2). Không mở rộng ở đâu. Cả 39 khoá khớp.
    · Ngoặc kép cân trên cả bài (đếm cả `“` và `”` toàn bài, kể cả ngoặc lồng nhau), 0 lỗi. NFC toàn bộ 0 lỗi. Không có khoá rỗng, không có `(…)` khoá chưa dịch, không có khoá tràn. Số khoá 39 = 39.
    · Dùng lại NGUYÊN VĂN, đối chiếu byte-for-byte (Pāli trùng tuyệt đối): `5.5` <- `sn51.31:3.9` · `5.6` <- `sn51.31:3.10` · `5.10` <- `sn51.12:1.5` · `5.14` <- `sn51.12:1.9` · `4.7` <- `sn51.31:1.3` · `1.2` <- `sn48.45:1.2`. Ba chỗ dùng lại nhưng KHÔNG khớp byte, và đã cân nhắc: `1.2` — `sn48.45` mở đầu câu nên viết `Một thời,` còn ở đây `1.1` đã mở câu bằng *Tôi nghe như vầy—* nên phải viết thường `một thời`; `4.7` — bản nguồn có dấu chấm thừa sau dấu hỏi (`?”.`), bỏ cho nhất quán trong lát; `5.14` — bản nguồn khác ở chữ cách đầu, chọn theo ngữ cảnh mở đoạn.

  Tiền lệ thuật ngữ: `iddhipāda` -> `như ý túc` (113 chỗ; `chandasamādhi` -> `định do dục và hành cần nỗ lực`, `vīriyasamādhi` -> `định do tinh tấn`, `cittasamādhi` -> `định do tâm`, `vīmaṁsāsamādhi` -> `định do quán và hành cần nỗ lực`) · `pacchāpuresaññī` -> `an trú với tưởng trước sau bình đẳng` (nguyên văn `sn51.12:1.5`; chữ `bình đẳng` không có trong Pāli, nhưng đây là tiền lệ đã có trong tầng cho đúng cụm, nên giữ và ghi ra đây thay vì tạo cách thứ N+1) · `vivaṭena cetasā apariyonaddhena sappabhāsaṁ cittaṁ` -> `với tâm rộng mở không bị bao phủ, tu tập tâm tràn đầy quang minh rực rỡ` (`sn51.12:1.9`) · `atilīnā/atippaggahitā` -> `thụ động chùng chình / nỗ lực căng thẳng` (`sn51.31:3.3`) · `iddhābhisaṅkhāra` -> `thần lực` · `iddhividha` -> `nhiều loại thần thông` · `evaṁmahiddhiko evaṁmahānubhāvo` -> `đại thần lực và đại oai đức` · `saṁvejeti` -> `làm cho … khiếp sợ` (sn6.14:8.1, sn6.5:9.1) · `lomahaṭṭhajāto` -> `kinh hoàng, dựng cả tóc gáy` (nguyên văn `sn7.9:11.1`) · `gambhīranemo sunikhāto acalo asampakampī` -> `có nền móng sâu, đóng chắc, không lay, không chuyển` (nguyên văn `sn56.39:4.1`) · `sabrahmacāri` -> `đồng đạo` · `sāvatthiyaṁ` -> `ở Sāvatthī`.
  0 tiền lệ, đặt mới kèm lý do: `heṭṭhāmigāramātupāsāde` -> `dưới lầu của mẹ Migāra` (`heṭṭhāpāsādaṁ` đã có `lầu dưới` ở an3.39:2.2 và mn75:10.7) · `bhantacittā` -> `tâm phóng tú` (cụm `vibbhantacittā` đã có `tâm dao động`/`tâm tán loạn`; `bhantacittā` chưa có tiền lệ nên chọn từ khác để không đồng nghĩa) · `pādaṅguṭṭhakena` -> `bằng ngón chân cái` (mn37:11.4) · thán từ `vata` bỏ như tiền lệ sn41.9:1.10.

  Bất định đã phân xử và ghi lại:
    (1) `5.5` và `5.6`: Pāli khoá chỉ có `vīriyasamādhi …pe…` và `cittasamādhi …`, còn bản Việt mở đầu `Vị ấy tu tập như ý túc …` / `câu hữu với định do …` — tức có chữ thêm ngoài khoá. Đây là nguyên văn dùng lại từ `sn51.31:3.9`/`3.10` (Pāli trùng tuyệt đối), và ở bài kia các khoá trước đã viết đủ mệnh đề. Giữ nguyên để bài này không lệch khỏi `sn51.31` trong cùng quyển 51, và ghi ra đây.
    (2) `3.3` không dịch thán từ `bho` (giữ như tiền lệ sn41.9:1.10 bỏ `vata`); `saṁvejehī` dịch `khiếp sợ` theo tiền lệ trong tầng.
    (3) Tiêu đề `Moggallānasutta` có tiền lệ mâu thuẫn trong tầng: `sn51.31:0.3` dùng `Kinh Moggallāna`, còn `sn8.10:0.3` dùng `Kinh Mục-kiền-liên` (1–1). Chọn `Kinh Moggallāna` vì cùng bộ Saṁyutta và cùng nhóm 51.

