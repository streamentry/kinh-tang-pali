notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của harness gần như không kiểm gì ở bài này, nên tôi tự quét toàn bộ khoá từ đĩa.** Mọi vế kệ ngắn hơn 40 ký tự nên bộ lọc `substantivePaliMinChars: 40` trong `source/layers.yaml` không thấy segment nào; tôi đọc Pāli thật của từng khoá từ `.cache/upstream/suttacentral/` theo `sourcePath` trong catalog, đối chiếu tay với bản Việt, rồi quét máy: tập khoá Việt bằng đúng tập khoá Pāli (17/17, đúng exact ID, không orphan), mọi giá trị NFC và không rỗng, ngoặc kép cong cân trên cả bài, không có `(…)`, dấu lược khớp Pāli từng khoá.
  - |-
    **Không thể tuyên bố technical gate pass.** Đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tiêu chí 10 bị chặn ở 9.6: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, NFC, ngoặc kép cân cả bài và YAML sạch. Người biên tập phải chạy lại bốn lệnh trên trước khi đổi trạng thái.
  - |-
    **Tầng Anh tốt nhất trong 14 bài: 13/14 khoá nội dung có prose Sujato (92,9%), trên phép đo chính thức là 12/12 = 100%.** Chỉ `1.14` `Tatiyaṁ.` im lặng. Không có lớp lấp. Vượt ngưỡng 0,8, không cần ghi vào `content/meta/reference-gaps.yaml`.
  - |-
    **Mười bốn khoá là mười bốn vế của một danh sách, và bản dịch giữ nguyên cấu trúc đó.** Năm điều được kể ở `1.3`, `1.5`, `1.7`, `1.9`, `1.11` rồi được đánh số lại ở `1.4`, `1.6`, `1.8`, `1.10`, `1.12`; công thức `Idaṁ … pañcamaṁ āveṇikaṁ dukkhaṁ, yaṁ mātugāmo paccanubhoti, aññatreva purisehi` lặp y nguyên ở cả năm lần, cùng với `Imāni kho … pañca …` ở `1.13`. Không khoá nào bị lược, không khoá nào bị gộp. Đây là tiêu chí căn cấu trúc kinh đạt trọn vẹn.
  - |-
    **Chủ thể và phạm vi phủ định giữ đúng ở cả sáu lần.** `yaṁ mātugāmo paccanubhoti, aññatreva purisehi` được dịch *mà chỉ nữ giới phải trải qua, không phải nam giới* — không hề đảo thành *nữ giới không phải nam giới*, và `mātugāmo` là chủ thể chính ở cả năm vế.
  - |-
    **Một nghi vấn về nguyên văn đã ghi, không sửa.** `1.14` là `Tatiyaṁ.` — *thứ ba* — trong khi danh sách vừa kể **năm** điều và `1.12` vừa gọi `pañcamaṁ` là *thứ năm*. Bản Anh đã ghim để trống khoá này nên không ai đối chiếu được. Bản Việt dịch *Thứ ba* theo đúng Pāli; tôi giữ nguyên vì Pāli là chuẩn và sửa thành *Thứ năm* là bịa, nhưng người đọc sẽ thấy mâu thuẫn. Đây là lý do tôi hạ `ambiguity_integrity` xuống 8.8: có nghi vấn thật mà không có chỗ nào ghi lại.
  - |-
    **Thuật ngữ đúng và đủ sắc.** `utunī` → *đến thời kỳ kinh nguyệt*, `gabbhinī` → *mang thai*, `vijāyati` → *sinh con*, `pāricariyaṁ upeti` → *đi làm vợ một người đàn ông* (Sujato chỉ dịch *provides services for a man*, nhiều nghĩa; bản Việt chọn nghĩa cụ thể đúng với cách một nữ trưởng lão nói trong kinh). `daharova samāno` → *còn trẻ*, `ñātakehi vinā hoti` → *xa cách người thân*.
  - |-
    **Tiêu đề.** `Āveṇikadukkhasutta` → *Kinh Khổ Đau Riêng Biệt*; `:0.2` `1. Paṭhamapeyyālavagga` → *1. Phẩm Chuỗi Lặp Thứ Nhất*, cùng cách dùng với 12 bài `sn37` đã có trong tầng.
