notes: |-
  Soạn từ Pāli root, đối chiếu Anh Sujato (28/29; chỉ thiếu 6.5 Aṭṭhamaṁ mốc kết cấu).
  Tiền lệ: 2. Phẩm Nālanda (2); Bốn niệm xứ nào (mn10:3.1); công thức quán thân/thọ/tâm/pháp
  (12/17/21/12 lượt); con đường trực tiếp… (khung dn22:1.7/22.24, giữ đạt được chánh đạo
  thay vì phương pháp chân chánh của mn10:2.1 — ghi nhận dị biệt); Phạm thiên Sahampati;
  đắp thượng y một bên vai; Thiện Thệ; bộc lưu. Khóa 1.1 gần trùng sn4.2:1.2 nhưng Pāli
  thiếu mūle (ajapālanigrodhe vs ajapālanigrodhamūle) nên Việt ghi tại cây đa Ajapāla thay vì
  dưới gốc, và dùng Đức Thế Tôn theo đa số (154 so với 39 Đức Phật).
  0 tiền lệ: rahogata paṭisallīna→ở nơi vắng vẻ chuyên tâm thiền tịnh; kệ 6.1–6.4.
  Vihareyya cầu khiến lược theo tiền lệ trực thuyết, ghi nhận đã làm phẳng thức.
