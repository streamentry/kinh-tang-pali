notes: |-
  Không có tầng Việt hiện hành để đối chiếu. Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Tầng đối chiếu còn lại là Pāli root và bản Anh Sujato đã ghim. budsas.org chỉ là tham khảo toàn văn, không cấp text cho tầng nào.
  Dấu lược theo đúng luật của tầng Việt: pe-lược của Pāli là MỘT dấu lược, và sau khi bỏ hết pe-lược thì đếm dấu lược còn lại. Chạy trên 315 khoá của lát: 0 khoá lệch. Không có khoá nào để trống trong bản dịch.
  Tên phẩm đo trên toàn tầng sn, không đoán: 6 tệp sn đã có dịch cùng phẩm Kassapavagga và cả 6 đều là 1. Phẩm Kassapa, không có phân kỳ. Tên bài Candūpamāsutta chưa có tiền lệ nào trong tầng; đặt mới theo Sujato (Like the Moon) và theo tiền lệ Candimasutta là Kinh Mặt Trăng, nhưng giữ vế -mā của Pāli: Kinh Như Mặt Trăng.
  Coverage Anh 35/35 khoá Pāli có nội dung, tức 100%, nhưng tầng english-project của bài này đang published và do cùng một người ký (OpenCode Space Bunny Free). Vì vậy validate sẽ cảnh báo chồng tác giả, và scorecard này CỐ TÌNH chấm triangulation thấp 8.8: bản lấp Anh không phải một cách đọc Anh độc lập, nên không được tuyên bố là đã đối chiếu Anh. Ở các khoá mà bản lấp im lặng, Pāli phải tự đứng vững.
  Tra tiền lệ có số đếm, không đoán. Pāli trùng nguyên văn với 9 khoá đã có bản Việt ở bài đã mang trạng thái; 6 trong số đó dùng lại nguyên văn (Sāvatthiyaṁ viharati → Trú ở Sāvatthī 76 lần; Taṁ kiṁ maññatha → Điều ấy các ông nghĩ sao 29 lần; Bhagavaṁmūlakā …; Bhagavā etadavoca → Thế Tôn nói như sau; Tatiyaṁ → Thứ ba 251 lần; và Kassapena vā hi vo gần như y nguyên). Ba khoá còn lại lệch, đều có lý do đo được: 5.4 và 5.5 và 8.5 — bản có sẵn bỏ dấu hiệu ti mà Pāli có, nên tôi giữ lại; 8.5 còn đổi các thầy thành các ông theo vo của Pāli.
  Sáu khoá mang cùng một công thức Pāli nên chỉ có một cách dịch: 1.3 và 1.7 trùng nguyên văn, dịch giống hệt; 2.2 là biến thể số ít, giữ nguyên phần lui thân lui tâm và thô lỗ; 7.4 và 8.4 gần trùng nhau, giữ một văn bản. Không có khoá nào dịch theo khuôn riêng.
  Nháy kép bám đúng Pāli từng khoá: mở ở 1.2 và đóng ở 2.4; 2.5 và 5.3 và 5.4 và 5.5 là cặp cân ngang; 3.2 mở và 8.5 đóng, vì lời giảng của Đức Thế Tôn là một lời thoại liên tục qua sáu đoạn, có 6.1 mở thêm một cặp bên trong. Phần khách tưởng phải học thuộc dùng ngoặc đơn.
  Ba chỗ Sujato không dùng làm chuẩn: ông dịch candūpamā là như mặt trăng theo câu mô tả chứ không giữ nghĩa ẩn dụ của ẩn dụ Như Mặt Trăng, nên tôi dùng mặt trăng ở cả 1.2 lẫn 1.6 và 2.1 cho nhất quán; ông gộp chindato chedāpayato pacato pācāpayato thành một động từ punish, tôi giữ đủ hai mươi vế theo Pāli; và ông dịch niccanavakā là always the newcomer, tôi dịch là luôn là người mới đến.
  Review đối kháng bắt được và đã sửa: 5.5 đặt dấu phẩy sai chỗ, và 7.4 cùng 8.4 suýt lệch nhau vì 8.4 thiếu một dấu cách trong Pāli; đã thống nhất thành một văn bản. Ngoài ra không còn khoá nào dịch khuôn.
