notes: |-
  Dịch từ Pāli root đã ghim. Tầng Anh CÓ và đã đo: manifest liệt kê sutta/sn/sn36/sn36.21_translation-en-sujato.json, 36/39 khoá có chữ.
    Coverage đo được: 23/23 Pāli có nội dung có Anh = 1.0000 (21 từ Sujato + 2 do lớp lấp english-project bù, lớp lấp đã published). Không cần entry reference-gaps.
    9 khoá TRÙNG NGUYÊN VĂN, dùng lại y nguyên: 1.1 (4 cặp cùng cách), 1.2 và 1.3 (an6.47, cùng nhân vật du sĩ Moḷiyasīvaka), 1.5 và 2.5 và 3.13 (an3.61:1.4 — cụm pubbekatahetū, lặp y hệt ở cả ba chỗ trong bài này nên giữ nguyên sự lặp), 4.2 (9 cặp), 4.3 (21 cặp).
    Tám nguyên nhân cảm thọ lấy y nguyên thuật ngữ từ an5.104:2.5 — cùng tám mục, cùng bài giảng: chứng lên huyết, chứng đờm tăng, chứng gió, chứng trầm kha, thời tiết thay đổi, tự mình bất cẩn, nỗ lực, quả nghiệp. Đo trước đó: chính các từ pittasamuṭṭhāna, semhasamuṭṭhāna, vātasamuṭṭhāna, sannipātika, kammavipāka có 0 lần trong tầng, nên không có cách nào dịch khác đã thành quy ước; an5.104 và an4.87 là hai nguồn song parallel đã có sẵn. visamaparihārajā và opakkamikajā chọn theo an5.104 (tự mình bất cẩn, nỗ lực) vì cùng cấu trúc với bài này.
    3.9 và 3.11 Sujato để trống, do lớp lấp của dự án bù (đã published); dịch theo Pāli và theo 3.7 của chính bài, giữ sự lặp hai lần đúng như Pāli.
    5.1–5.4 là kệ liệt kê lại tám nguyên nhân, giữ đúng thứ tự Pāli (mật, đờm tăng, gió / sự kết hợp, thời tiết / tự mình bất cẩn, nỗ lực / quả nghiệp là thứ tám) chứ không theo thứ tự Sujata đảo trong bản Anh.
    micchāti vadāmi → là sai (0 tiền lệ đúng cụm; tầng chỉ có vô lý và sai bậy ở ngữ cảnh khác); atidhāvanti → vượt qua (tiền lệ Bà-la-môn ấy đã vượt qua ranh giới, không còn giới hạn); saccasammataṁ → đồng thuận (đa số trong tầng).
    Tầng vietnamese-current vắng. Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
