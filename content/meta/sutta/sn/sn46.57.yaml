notes: |-
  MẤT TẦNG THAM KHẢO ANH — ĐÃ ĐƯỢC GHI NHẬN, KHÔNG ĐƯỢC SỬA. ĐO LẠI theo đúng `src/lib/canon/reference.ts`: 30 khoá Pāli có nội dung (≥40 ký tự, bỏ khối `:0`), 15 khoá không có chữ Anh nào ở tầng đã ghim ⇒ coverage 0,500 < ngưỡng 0,8. Bản lấp Anh của dự án chưa có tệp cho bài này và `content/meta/en/sn/sn46.57.yaml` cũng chưa có, nên không có gì để tính vào coverage.
  LỊCH SỬ CỔNG, ghi rõ vì nó thay đổi trạng thái: lúc tôi chấm, `content/meta/reference-gaps.yaml` chưa có `sn46.57`, nên tôi đặt `draft` với một blocker. Trong lúc lát còn đang chạy, commit `43d39bb1` (chore(gaps): 722 → 737 record) đã thêm entry `sn46.57` — substantiveSegments 30, substantiveWithoutEnglish 15, coverage 0.5. Tôi KHÔNG sửa tệp gap đó. Vì mất tầng tham khảo nay ĐÃ được ghi nhận, `validate` chỉ cảnh báo chứ không chặn, blocker cũ không còn đúng sự thật, nên bài đi qua cổng với final_score 9,39 > 9,0 ⇒ `published`. Ghi nhận không phải sửa: 15 khoá đó vẫn phải dựa vào Pāli một mình.
  15 khoá mất tầng Anh là toàn bộ phần thân sau `Idha … bhāveti` của năm bài con (2.3–2.5, 3.3–3.5, 4.3–4.5, 5.3–5.5, 6.3–6.5): Sujato chỉ dịch bài đầu (1.4–1.5) rồi bỏ trống các bài lặp lại. 15 khoá đó dịch từ Pāli + tiền lệ `sn46.76`, và `triangulation` chỉ 8,6 vì không có một bản đọc Anh nào để đối chiếu ở đúng những đoạn đó. Chỗ Anh trống KHÔNG phải sự đồng thuận về cách dịch.
  Bản Việt hiện hành (Hòa thượng Thích Minh Châu) không có: tầng `vietnamese-current` tại commit đã ghim chỉ có 26 chương Pháp Cú.
  BÀI SONG SONG ĐÃ DÙNG LÀM KHUÔN: `sn46.76` (đã publish) là CÙNG bộ khung với bài này, chỉ khác `nirodhasaññā`→`aṭṭhikasaññā` và gộp bốn vế `mahatāya …` vào một khoá. Vì vậy toàn bộ bài theo đúng cách dịch của `sn46.76`: `bhāvitā bahulīkatā` → khi được tu tập, được làm cho sung mãn · `mahapphalā hoti mahānisaṁsā` → đem lại quả lớn, lợi ích lớn · `satisambojjhaṅgaṁ` → niệm giác chi · `upekkhāsambojjhaṅgaṁ` → xả giác chi · `vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ` → nương tựa viễn ly, nương tựa ly tham, nương tựa đoạn diệt · `vossaggapariṇāmiṁ` → hướng đến buông bỏ · `diṭṭheva dhamme aññā` → chứng đắc thắng trí ngay trong hiện tại · `sati vā upādisese anāgāmitā` → nếu có dư tàn y thì chứng quả Bất lai · `mahatāya atthāya` → đưa đến lợi ích lớn · `mahatāya yogakkhemāya` → đưa đến an ổn lớn khỏi các ách phược · `mahatāya saṁvegāya` → đưa đến sự xúc động lớn.
  LỆCH CÓ CHỦ ĐÍCH so với `sn46.76`: `mahatāya phāsuvihārāya` ở 6.1–6.5 dịch `đưa đến sự an trú ổn thoải lớn`, không theo `đưa đến sự trú lạc lớn` của `sn46.76:3.1`. Lý do: tiêu đề 6.0 `Phāsuvihārasutta` đã dùng nguyên văn `an5.105:0.3` là `Kinh An Trú Ổn`; nếu thân bài lại dịch `trú lạc` thì cùng một thuật ngữ có hai cách trong một bài. Người biên tập nên thống nhất `phāsuvihāra` giữa `sn46.57` và `sn46.76`.
  TÊN BÀI (0 tiền lệ cho cả 6 tên, đặt mới theo thân bài): 0.3 `Aṭṭhikamahapphalasutta` → Kinh Bộ Xương Có Quả Lớn · 2.0 `Aññataraphalasutta` → Kinh Quả (Một), theo khuôn `sn51.26:0.3` (Dutiyaphalasutta → Kinh Quả (Hai)) · 3.0 `Mahatthasutta` → Kinh Lợi Ích Lớn · 4.0 `Yogakkhemasutta` → Kinh An Ổn Khỏi Ách Phược · 5.0 `Saṁvegasutta` → Kinh Xúc Động · 6.0 `Phāsuvihārasutta` → Kinh An Trú Ổn. Mỗi tên bám đúng vế `mahatāya …` của chính nó nên thân bài và tiêu đề không lệch nhau.
  PĀLI TRÙNG NGUYÊN VĂN: 4/40 khoá có Pāli giống hệt tệp đã có, 4 khoá dùng lại nguyên văn (0.2 `sn46.58:0.2`, 1.1, và 6.0 `an5.105:0.3`). Ngoài ra 9 cặp Pāli trùng NỘI BỘ (1.5/2.4/3.4/4.4/5.4/6.4 và 2.3/3.3/4.3/5.3/6.3) — dùng lại đúng nguyên văn đã viết ở khoá đầu tiên, y hệt cách Pāli lặp.
  `aṭṭhikasaññā` → `niệm tưởng bộ xương` theo `an10.238:1.3` (Sujato: the perception of a skeleton). `vivekanissitaṁ` → `nương tựa` theo `sn46.76:1.4`.
  DẤU NHÁY: mỗi bài con một cặp — 1.2/1.6 · 2.1/2.5 · 3.1/3.5 · 4.1/4.5 · 5.1/5.5 · 6.1/6.5. Cân trên toàn bài. Sáu khoá có `…pe…` (1.4, 2.3, 3.3, 4.3, 5.3, 6.3) giữ đúng MỘT `…`. 6.5 giữ nguyên việc Pāli không có dấu chấm cuối.
  CỔNG KỸ THUẬT: `npm run validate`, `npm test`, `npm run check`, `npm run build` do coordinator chạy; technical_integrity 9,6 vì lát này không tự chạy bốn lệnh đó. Đã tự kiểm bằng harness `_hvi.kiểm()` (NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, đủ khoá theo `all`) — 40/40 khoá sạch — và mô phỏng `validateSegmentMap` của `scripts/validate.ts`.
