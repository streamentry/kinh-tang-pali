  Mục-kiền-liên* → *Mahāmoggallāna / Moggallāna* (*Mục-kiền-liên* 46 khoá so với *Moggallāna* 370, số
  cả hai kể cả dạng có *Đại*/*Mahā*), *Đại Ca-diếp* → *Mahākassapa* (4 so với 102), *Đại Kappina* →
  *Mahākappina* (3 so với 19), *A-na-luật-đà* → *Anuruddha* (5 so với 385). Nghĩa không đổi, chỉ đồng
  nhất danh xưng; giữ *Kappina* ở `9.5`, `9.8` vì Pāli là `kappino` không có *mahā*.
