  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    **Bản song song trùng Pāli, đã `published`, dùng lại nguyên văn.** `an10.6*` cho `an11.19*` (cùng danh sách các tầng trạng và cùng `sabbasaṅkhārasamatho`) · `an10.10*` cho `an8.72*` (cùng khung 'yếu tố chưa trọn vẹn / làm cho trọn vẹn') · `an6.3:1.4` cho cụm `āhuneyyo pāhuneyyo dakkhiṇeyyo añjalikaraṇīyo` của `an8.57:1.1` · `an10.220:1.4` cho `an2.16:1.4` (trùng nguyên vân `Adhammacariyāvisamacariyāhetu`) · `an10.58:1.3` cho `Bhagavaṁmūlakā no, bhante, dhammā…` (`an8.83/11.19`) · `an7.615:1.1` cho `Rāgassa, bhikkhave, abhiññāya …` (`an8.119`) · `an8.16:1.1` cho khuôn `Aṭṭhahi, bhikkhave, dhammehi samannāgato bhikkhu…` · `sn12.30*` cho cụm `nappajānanti` của `sn12.14` · `sn22.50*` (lát 39) cho cặp `samaṇasammatā…` của `sn12.14` · `sn56.60/61*` (lát 38–39) cho ẩn dụ bụi móng tay – mặt đất lớn (`sn13.1`).
  - >-
    **Những lỗi mà lượt review đối kháng bắt được ở lát này, đều là lỗi nghĩa chữ — không phải lỗi hình thức.** (1) `an6.2:3.10–3.13`: `mahaggata/amahaggata` và `sauttara/anuttara` bị dịch thành *có/không có tầm viễn* và *có/không có định hơn* — sai hoàn toàn; đã sửa thành *rộng lớn* và *cao hơn*. (2) `an2.5:1.4/1.7/1.11`: `kāmaṁ taco ca nhāru ca aṭṭhi ca` bị xếp sai thứ tự (da/xương/gân) — đã sửa theo đúng Pāli là xác thịt, gân, xương. (3) `sn13.1:2.3/2.6`: `neva satimaṁ kalaṁ upeti` bị dịch thành *không đến một phần bao nhiêu* — vô nghĩa; đã sửa thành *không phải một phần*. (4) `an8.44:3.5` lúc đầu rối vừa đọc vừa dịch, đã viết lại. **Máy không bắt được loại lỗi này — cả bốn đều qua mọi chốt tự động.**
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Đo lại trên toàn bộ segment Việt trong `content/translation/vi/project/` — 3.215 tệp, bỏ 22 tệp trong thư mục APFS orphan, đối chiếu **mọi** khoá với Pāli ở commit đã ghim: **khớp 61.033 / 61.460 = 99,31%** (0 khoá Việt nào không có trong Pāli). Con số ở các lát trước là 46.755 / 47.140 = 99,18% — **đo trên tập con, không tái lập được** từ định nghĩa đã ghi, nên thay bằng số đo lại được toàn bộ. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ.
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Dùng lại: `Āhuneyyavagga` (An 6) → *1. Phẩm Đáng Lễ Bái* (`an6.1` chưa dịch nhưng `an6.3/4` ghi *1. Phẩm Đáng Cúng Dường* — **hai tên khác nhau cho cùng phẩm, cần thống nhất**) · `Sāraṇīyavagga` → *2. Phẩm Đáng Nhớ* · `Anusayavagga` → *2. Phẩm Ám Ảnh* · `Uposathavagga` → *5. Phẩm Giữ Trai* · `Gotamīvagga` → *6. Phẩm Gotāmī* · `Yamakavagga` → *8. Phẩm Song Chi* · `Sativagga` → *9. Phẩm Có Nhớ Tưởng* · `Rāgapeyyālā` → *11. Ấp Tặng Tham* · `Sattāvāsavagga` → *3. Phẩm Bảy Chướng Ngại* · `Jāṇussoṇivagga` → *17. Phẩm Vua Jāṇussoṇi* · `Anussativagga` → *2. Phẩm Nhớ Lễ* · `Āhāravagga` (Sn 12) → *2. Phẩm Đoàn Thực* · `Dasabalavagga` → *3. Phẩm Mười Lực* · `Dukkhavagga` → *6. Phẩm Khổ* · `Abhisamayavagga` (Sn 13) → *1. Phẩm Thông Đạt* · `Paṭhamavagga` (Sn 15) → *1. Phẩm Thứ Nhất* · `Chaṭṭhavagga` (An 1) → *19. Phẩm Thứ Sáu*. **Hai phẩm 0 tiền lệ:** `Gahapativagga` (Sn 12) → *5. Phẩm Giếng Nước* (`gahapati` là bến nước/đầu nguồn) · `Vihāravagga` (An 8, kho có `an8.68–70` chưa dịch) → *Phẩm Thiền* theo `sn45.19*`. **Người biên tập nên thống nhất các chỗ phân kỳ.**
  - >-
    **`1.2–1.4` và `3.6` là cùng một câu nguyên văn** (*do vô minh mà có các hành; do các hành mà có thức… Như vậy, sự sinh khởi của toàn bộ uẩn khổ ấy là do vô minh*) và phải dịch giống hệt — dấu `…pe…` nằm **giữa** `viññāṇaṁ` và `evaṁ`, nên dấu lược ở cuối. `3.8–3.9` là câu đối xứng cho diệt tận và cũng phải dùng **đúng một** dấu lược.
  - >-
    **`2.2` và `2.4` là định nghĩa của `jarā` và `maraṇa`, phải giữ đủ từng vế** — `jarā` có sáu vế (già nua · suy yếu · gãy vụn · tích tụ tuổi tác · suy hao các căn · thành già), `maraṇa` có tám vế (ra đi · lìa bỏ · biến mất · tử vong của thần chết · chết tử · phân tán các uẩn · đặt xác chết thân này). Rút một vế là mất một nửa định nghĩa. **Độ chắc thấp ở `khaṇḍiccaṁ pāliccaṁ valittacatā`** (= mỏng manh, dần dần rạn nứt) — 0 tiền lệ sạch.
  - >-
    `4.2–4.4` định nghĩa `saṅkhārā` là **ba** hành (thân, lời nói, ý) — phải đủ ba. `2.8–2.10` và `4.5–4.7` là hai vòng “do X mà có …; do diệt tận của X mà có …; chính Thánh đạo tám ngành là con đường…”; `2.11` liệt kê tám ngành **đầy đủ** (không có `…pe…`) trong khi `4.8` có `…pe…` — phải theo Pāli từng chỗ, không dùng cùng một cách.
  - >-
    `5.1` là công thức biết nhân–tập khởi của nhân–diệt tận của nhân–con đường (bốn vế), và `5.2` là **chín** danh từ mô tả vị Thánh đệ tử ấy — phải giữ đủ chín. `amatadvāraṁ āhacca tiṭṭhati` → *được cương trì bằng chánh đạo* (0 tiền lệ). 0 tiền lệ cho `Paccayasutta` → *Kinh Nhân*; `ariyo nibbedhikapañño` → *có cái biết thấy đường vào bất sanh của bậc Thánh*.
  - >-
    **Lượt cải thiện 2026-10-14 (đọc đối kháng từng khoá, đối chiếu công thức già–chết và chuỗi duyên khởi đã `published` trong `dn22`, `mn141`, `mn9`, `sn12.2`, `sn12.20`, `sn12.28`, `sn12.33`).** Mục *"Độ chắc thấp ở `khaṇḍiccaṁ pāliccaṁ valittacatā`"* ở trên đã được giải quyết, không còn bất định: ba từ là *răng rụng · tóc bạc · da nhăn* (bản Anh Sujato đã ghim ghi *broken teeth, grey hair, wrinkly skin*, và toàn bộ tiền lệ trong kho đều dịch như vậy), không phải *gãy vụn · tích tụ tuổi tác*. 22 khoá đổi. **Nặng (nghĩa sai hoặc lệch chủ thể, 5 khoá):** `2.2` (`khaṇḍicca…valittacatā`, `āyuno saṁhāni` dịch lệch; thiếu `tamhi tamhi sattanikāye`; lại kèm *được gọi là già* chép lấn sang khoá `2.3`) · `2.4` (*sự tử vong của thần chết*, *sự chết tử*, *sự đặt xác chết thân này* thay cho `maccu`, `kaḷevarassa nikkhepo`; thiếu `tamhā tamhā sattanikāyā`; lại kèm *được gọi là chết* chép lấn sang `2.5`) · `1.4` (thêm *là do vô minh* mà Pāli không có) · `5.2` (`ayaṁ` là chủ từ chỉ vị Thánh đệ tử nhưng bị dịch *điều này*; `saddhammaṁ` thành *chỗ chân chính*; `ñāṇena` và `vijjāya` cùng bị gộp thành *tri kiến*; `dhammasotaṁ samāpanno` thành *thông đạt với tai đang nghe pháp*; `ariyo nibbedhikapañño` thành *cái biết thấy đường vào bất sanh*; `amatadvāraṁ āhacca tiṭṭhati` thành *được cương trì bằng chánh đạo*) · `5.1` (`paccayaṁ` dịch *nhân*, nay *duyên* như mọi `paccaya` khác trong `sn12`). **Vừa/nhẹ (17 khoá):** `2.3`/`2.5` (bản cũ lặp *được gọi là là già/chết*) · `3.5` *cảm thọ* → *thọ* (8 so 2), `3.6` *xúc chạm* → *xúc* (12 so 0), `3.7` *sáu căn* → *sáu xứ* (11 so 1), `3.8` *danh và sắc* → *danh sắc*, `3.1` và `2.8–2.9`/`4.5–4.6` *sinh ra · sinh khởi* → *sinh · tập khởi · diệt tận nên* theo tiền lệ · `4.3` *lời nói hành, ý hành* → *khẩu hành, tâm hành* (`citta` → *tâm*) · `4.4` `ime` là số nhiều · `1.1` *Đang sống tại* → *Trú ở* (32 so 8) · `1.2–1.3` *do duyên* như `sn12.1`, `sn12.2`, `sn12.20` · `2.6` thành *đây là già và đây là chết*. **Giữ nguyên dù có nghi ngờ:** tiêu đề `Paccayasutta` → *Kinh Nhân* — `sn12.20` cùng tên Pāli đã `published` là *Kinh Duyên*; giữ *Nhân* ở tiêu đề để hai bài không trùng tên, còn thân bài dùng *duyên* như tiền lệ; cần người biên tập thống nhất. **Điểm đổi:** `grammar_logic` 9.3→9.4 (bỏ lỗi *là là*, đúng chủ từ ở `5.2`) · `terminology` 9.2→9.3 (đã khớp tiền lệ ở các chỗ trên, còn lệch tiêu đề) · `ambiguity_integrity` 9.4→9.5 (giải quyết được bất định `khaṇḍicca`) · `technical_integrity` 10.0→9.6 (không chạy cổng trong lượt này: còn phải chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`). Các điểm còn lại giữ nguyên. Bản cũ chấm 9.47 khi còn các lỗi nghĩa nêu trên, tức là đã chấm cao hơn thực tế; con số mới 9.46 phản ánh bản đã sửa với `technical_integrity` bảo thủ hơn.
