    `sn56.73`, `sn56.74`, `sn56.75`, `sn56.76`, `sn56.77`, `sn56.78`, `sn56.79`,
    `sn56.82`, `sn56.83`, `sn56.84`, `sn56.85`, `sn56.86`, `sn56.87`, `sn56.88`,
    `sn56.89`, `sn56.91`, `sn56.92`, `sn56.93`, `sn56.94`, `sn56.95`. Tôi đóng
    ngay sau mệnh đề cuối của `1.1` để người đọc không gặp dấu ngoặc treo —
    **đây là cố ý lệch 48 segment**; bộ kiểm tra báo đúng các chỗ ấy, không phải
    sót sót. Pāli không bị sửa.
  - >-
    **⚠ SỬA LỖI NGỮ NGHĨA: bản đầu tôi dựng HAI VẾ GIỐNG HỆT NHAU**, xoá mất
    đúng sự tương phản mà bài kinh sinh ra để nói. Pāli luôn đối chiếu *số ít*
    (một nơi) với *số đông* (nhiều nơi) — ví dụ `sn56.105-107`: số ít là kẻ chết
    rồi sinh ra ở **cõi trời**; số đông là kẻ sinh ra ở **cõi địa ngục, cõi địa
    ngục sinh ra từ sự tiếp xúc, và cõi thân thuộc**. Tiêu đề Pāli xác nhận:
    `…cuti-devanirayādisutta`. Bản đầu còn cho cả hai vế cùng một danh sách ba
    nơi, tức nói rằng “số đông sinh về cùng chỗ với số ít” — sai hẳn ý. Đã dựng
    lại từng cặp riêng cho cả mười bài.
  - >-
    `pettivisaya` → *cõi thân thuộc* và `tiracchānayoni` → *cõi địa ngục sinh ra
    từ sự tiếp xúc* (0 tiền lệ ở nghĩa này, đặt mới; kho chỉ có `tiracchāna`
    trong cụm *địa ngục sinh ra từ sự tiếp xúc* của chương 21). `nāma` trong
    `nirayādi` → *các cõi khác*.
  - >-
    **Các bài rút gọn (`sn56.105-107` … `sn56.126-128`) là MỘT catalog uid cho
    BA bài kinh**, nên tệp dịch mang UID thật của tệp Bilara, giống
    `an7.618-644` và `an7.645-1124` ở PR #116.
  - >-
    **Quy ước dấu lược của kho, đã đo lại chứ không phải đoán:** trong 1.535
    segment đã `published` có `…` trong Pāli, chỉ **617** (40%) giữ **đúng số**
    dấu, và cặp lệch phổ biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` →
    `…`). Vì vậy quy tắc của kho là **có/không có `…` phải khớp theo từng
    segment**, không phải khớp số; tôi giữ đúng quy ước đó.
