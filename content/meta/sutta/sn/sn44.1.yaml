notes: |-
  Đợt 19, lane 36. Dịch từ Pāli root commit đã ghim, đối chiếu English Sujato đã ghim, bản Hòa thượng Thích Minh Châu nguyên bài (tra cứu toàn văn, không phân đoạn) và các tiền lệ cùng tầng. Đủ 120 khoá, thứ tự và tập khoá khớp Pāli; không có khoá ngoài Pāli.

  **Coverage Anh trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): 46/85 = 0.541** — dưới sàn 0.80. Sujato để trống 39 khoá (các vế lặp lại ở 4.10–5.12 và 7.2–8.5, cùng toàn bộ lượt hỏi của vua với Thế Tôn từ 10.2 đến 12.4), chưa có english-project cho bài này, và tại commit đã ghim không có bản Việt phân đoạn cho bài này. Vì vậy phần lớn lượt hỏi Thế Tôn chỉ có Pāli tự đứng vững; bài giữ `draft` kèm blocker độ phủ, `triangulation` hạ xuống 7.4 (các khoá Sujato có chữ vẫn được đối chiếu độc lập; riêng bản nguyên bài của Hòa thượng Thích Minh Châu đối chiếu được toàn bài nhưng không phải tầng store). Đây là giới hạn của tầng tham khảo, không phải lỗi của bản dịch; muốn nâng trạng thái cần lớp english-project lấp 39 khoá trên, không nâng điểm để né blocker.

  Số Pāli: `sata` 100, `sahassa` 1000, `satasahassa` 100.000 (sata × sahassa), dịch «trăm», «nghìn», «trăm nghìn» ở 6.4, 6.7, 11.3, 11.6 (hạt cát và bình nước, «chừng ấy trăm hạt cát» = bội số của trăm, không phải 100 hạt); bốn vế `hoti / na hoti / hoti ca na ca hoti / neva hoti na na hoti` là bốn, không phải số khác. Không có số lớn khác.

  Dấu lược: 7 khoá Pāli có `…pe…` (8.1, 10.15, 11.3, 11.6, 11.13, 11.15, 11.16 — riêng 11.16 có hai chỗ, tổng 8 chỗ lược) đều giữ đúng một `…` ở mỗi chỗ; 10.15 và 11.16 kết Pāli bằng `….` nên Việt kết ` ….`. Pāli không có `(…)` trần ở khoá nào nên bản Việt không có `(…)`. Nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá, theo đúng nháy lệch của Pāli ghim: 6.11 mở nháy kép lời Khemā và 9.4 đóng, còn 11.9 mở nháy kép lời vua mà Pāli không đóng trước khi lời Thế Tôn nối tiếp ở 11.10, đến 12.4 mới đóng; bản Việt giữ nguyên chỗ lệch này, không tự sửa.

  Tái dùng nguyên văn tầng: đo 34 khoá có Pāli trùng nguyên văn ở nơi khác trong tầng, 23 khoá bản Việt trùng một tiền lệ (1.1 theo 18 khoá «Một thời, Đức Phật ở Sāvatthī, tại rừng Jeta, trong tu viện của ông Anāthapiṇḍika»; 0.2 theo 9 khoá «1. Phẩm Không Tuyên Bố»; 1.4; 6.9 và 11.8 «Vì sao vậy?»; 11.4 và 11.7 «Thưa không phải vậy, bạch Thế Tôn»; 13.11 «Thứ nhất.» 314 khoá). 11 khoá khác tiền lệ có lý do: 5.3, 5.6, 5.9, 5.12 (tiền lệ viết «ông nói»; ở đây người nói là Khemā nên «Ni sư nói vậy»), 6.2 (tiền lệ là câu hỏi đóng, ở đây 6.2 nối thẳng sang 6.3 nên kết bằng dấu hai chấm), 10.18 (người nói là Thế Tôn nên «Ngài nói vậy»), 13.1 và 13.5 (theo «Thật kỳ diệu, … Thật hy hữu, …» của sn44.7 và sn44.8 cùng samyutta), 13.8 theo dn2:101.2, 13.9 theo dn16:3.6 và sn51.10:7.3, 13.10 theo dn16:2.18 («hoan hỷ, tùy hỷ … đi nhiễu bên phải»). Pāli trùng nguyên văn trong chính bài: 22 nhóm khoá, 18 nhóm bản Việt giống nhau, 4 nhóm khác có chủ ý ở xưng hô theo người nói (5.12 và 10.18 «Ni sư»/«Ngài»; 6.1 và 11.1 «tâu Đại vương … tôi»/«này Đại vương … Ta»; 6.12 và 11.11, 9.2 và 12.2 «Tâu»/«Này Đại vương»).

  Thuật ngữ (đếm trên tầng): `hoti tathāgato paraṁ maraṇā` → «Như Lai có tồn tại sau khi chết» như sn44.4, sn44.6, sn44.7, sn44.11; `hoti ca na ca hoti` → «vừa có tồn tại vừa không tồn tại» (18 khoá toàn tầng, thêm 13 «vừa tồn tại vừa không tồn tại» và 25 «vừa còn vừa không còn»; riêng ở sn44 là 14/16 khoá); `neva hoti na na hoti` → «phi tồn tại phi phi tồn tại» (59 khoá, đa số; «không phải tồn tại, cũng không phải không tồn tại» 4); `abyākataṁ bhagavatā` → «không được Thế Tôn tuyên thuyết» (34 khoá); `payirupāsati` → «thân cận» theo dn2 (23 khoá); `ayye` gọi tỳ-kheo-ni → «Ni sư» theo mn44 và an10.28 (14 khoá «Ni sư» ở mn44 và an10.28; riêng an4.159:1.8 dùng «thưa bà» cho một tỳ-kheo-ni, là dạng lệch duy nhất đo được); `deva` gọi vua → «bệ hạ» theo dn2; `gambhīro appameyyo duppariyogāho` → «sâu xa, không thể đo lường, khó dò thấu» theo mn72 (5/6 khoá cùng cụm); `paññāpayamāno paññāpeyya` → «có thể mô tả» theo mn72:20; `tālāvatthukata` → «làm thành như gốc cây thốt nốt bị chặt» theo mn72:20; `gaṇako muddiko` → «người tính toán, người đếm bằng ngón tay» theo dn2:14 và dn2:34; `udakāḷhaka` → «bình nước» theo sn55.41, sn55.42, an6.37, an5.45; `Paṭhamaṁ` → «Thứ nhất.».

  Bất định, không đưa vào thân kinh:
  (1) `saṅkhāya` trong `rūpasaṅkhāyavimutto` (6.12, 7.2, 8.3, 9.2, 11.11, 12.2): dịch «giải thoát khỏi sự tính đếm theo sắc/thọ/các hành/thức» theo Sujato ("freed from reckoning in terms of form"), khớp với `saṅkhāyako` ở 6.3. mn72:20.2 có cùng cú pháp nhưng Pāli ghi `saṅkhaya` (không có ā dài) và bản Việt đã dịch «sự định danh»; hai dạng khác hình thái nên không dùng lại «định danh» cho `saṅkhāya`. Hòa thượng Thích Minh Châu dịch «ước lượng của sắc thân», gần với «tính đếm». Chưa phân xử được nghĩa chính xác của `saṅkhāya` ở đây (cách đọc: «bị đếm/gán theo», hoặc «sự đếm»), giữ cách bám sát văn cảnh người đếm cát.
  (2) `saṅkhāyako` ở 6.3, 6.6, 11.2, 11.5 dịch «người tính đếm» để ba nghề `gaṇako / muddiko / saṅkhāyako` có ba tên khác nhau; Sujato dịch "reckoner", Hòa thượng Thích Minh Châu dịch «toán số». Không có tiền lệ Việt cho riêng từ `saṅkhāyako` (0 khoá trong tầng).
  (3) `muddiko` dịch «người đếm bằng ngón tay» theo dn2; Hòa thượng Thích Minh Châu ghi «chưởng ấn» kèm gốc Pāli, Sujato "finger-tallier": hai cách hiểu `muddā` (ấn / tính bằng ngón tay), chọn cách đã có trong tầng.
  (4) `tathārūpa` ở 1.5, 2.1, 3.1 dịch «xứng hợp» (Sujato "suitable"); Hòa thượng Thích Minh Châu bỏ không dịch riêng. Chưa có tiền lệ Việt trong tầng cho cụm `tathārūpaṁ samaṇaṁ vā brāhmaṇaṁ vā` (0 khoá).
  (5) `tipi na upeti` ở 6.14, 7.4, 8.5, 9.4, 11.13, 11.14, 12.4 dịch «cũng không áp dụng»; Hòa thượng Thích Minh Châu «không thể chấp nhận», mn72:20.4 «không điều nào áp dụng». Chọn «áp dụng» theo mn72 vì cùng động từ `na upeti`.
  (6) 5.2–5.3, 5.5–5.6, 5.8–5.9, 5.11–5.12, 10.15, 10.17–10.18: dấu gạch `—` ở Pāli nối `abyākataṁ … bhagavatā—` với vế được nêu; bản Việt giữ dấu gạch và không thêm «rằng».
  (7) 13.9 `Yassadāni tvaṁ, mahārāja, kālaṁ maññasī` dịch «bây giờ hãy làm điều Đại vương nghĩ là hợp thời» theo dn16:3.6 và sn51.10:7.3; mn90:17.16 chọn «hãy đi khi nhà vua thấy hợp lúc», là cách khác của cùng công thức.

  Ngoài lát (báo, không sửa): «Tứ Thế Tôn» (chữ «Tứ» đứng chỗ «Như Lai») còn ở 40 khoá của sn44.3 (32), sn35.104 (4), sn44.5 (3) và sn36.20 (1).

  Kiểm kỹ thuật: bị cấm chạy cổng nên `technical_integrity` đặt 9.6, KHÔNG tuyên bố technical gate pass. Còn phải chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; ngoài ra cần `npm run reference:gaps` để cập nhật record độ phủ cho bài này.
