notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở commit 11c9d708. Không có bản Việt tham khảo: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên tầng `vietnamese-current` không phủ bài này và triangulation chỉ dựa trên Pāli + Sujato.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  Dùng lại nguyên văn sn47.46 (cùng khung hỏi về pháp vắn tắt rồi làm thanh tịnh giới hạnh và tri kiến chánh trực, rồi hành trì bốn niệm xứ theo ba cách, rồi chứng ngộ) cho 1.6, 3.1, 3.2, 3.4; sn47.15 cho 1.7 và 1.8; sn22.159 cho 1.3.
  0.2 `Ambapālivagga` là phân kỳ chưa chốt: sn47.1 và sn47.2 dùng 1. Phẩm Cây Mít, còn sn47.4 và sn47.5 dùng 1. Phẩm Ambapālī, hai phiếu mỗi bên. Chọn giữ tên riêng Ambapālī vì đúng với tên phẩm Pāli và sát bản Anh (In Ambapālī’s Mango Grove); ghi ở đây để người biên tập thống nhất với hai bài kia.
  0.3 `Bhikkhusutta` dùng lại nguyên văn an5.286:0.3 (Kinh Vị Tỳ-kheo).
  0 tiền lệ cho sự phân biệt bên trong, bên ngoài, cả hai của `ajjhattaṁ/bahiddhā/ajjhattabahiddhā` trong bài này. Dùng theo cách đã có của mn10 (sống quán thân nơi thân từ bên trong, từ bên ngoài, và cả bên trong lẫn bên ngoài), nhưng vì Pāli ở đây có `kāyānupassī viharāhi` và các khoá 2.5, 2.8, 2.11 chỉ là vế đầu nên phần quán sát phải đặt ở 2.7, 2.10, 2.13 chứ không lặp lại ở các khoá vế đầu.
  Dấu lược: 2.5, 2.8, 2.9, 2.11, 2.12 mỗi khoá một …, khớp Pāli; 2.6 chỉ có … trần ở cuối vì Pāli cũng vậy, vẫn giữ đúng số.
  Bất định đã phân xử: 1.5 `dāyādo assan` dịch là người thừa kế lời dạy, đọc theo nghĩa thừa tự của giáo pháp; không phải con cái. 1.4 `moghapurisā` dịch là kẻ vô ích.
  3.3 dùng đúng cụm đã dùng ở sn35.234:7.5 vì Pāli giống hệt, để bài này và bài kia không mâu thuẫn nhau.
  Coverage tầng Anh trên Pāli có nội dung (18 segment) là 18/18 = 100%. Không cần ghi nhận gap.
