notes: |-
  **Coverage Anh Sujato trên Pāli có nội dung: 14/14 = 100%**, không khoá nào bị bỏ
  trống, không cần ghi nhận gap. Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708 (bilara chỉ phân phối 26 tệp tiếng Việt, toàn bộ là Pháp Cú), nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của kho.

  **28/37 khoá có Pāli trùng nguyên văn với bài đã có; 21 cặp tôi dùng lại NGUYÊN
  VĂN.** Ngân hàng tiền lệ: dựng chỉ mục Pāli→Việt cho toàn tầng (135.452 cặp, 87.157
  Pāli khác nhau) rồi tra từng khoá. Nguồn chính: `sn35.71`, `sn35.72` (hai bài
  Migajāla trùng Pāli tuyệt đối với `1.1`-`2.3`) và `sn35.1:2.19-2.21` (trùng tuyệt
  đối với `15.1`-`15.3`).

  **Chỗ tôi CỐ Ý dịch khác hai bài song song, và đây là điểm quan trọng nhất.**
  `sn35.71` và `sn35.72` có cùng Pāli ở `1.1`, `1.2`, `2.2`, `2.3` nhưng đã dịch theo
  hai cách: `sn35.71` dùng *sáu xứ xúc chạm*, `sn35.72` dùng *sáu xứ tiếp xúc*. Đo cả
  tầng: *sáu xứ xúc chạm* **64** lần, *sáu xứ tiếp xúc* **2** lần → tôi theo đa số
  **xúc chạm** và ghi kèm cả hai bài kia để người gộp sửa cho khớp. Ngoài ra `sn35.71`
  dịch `Avusitaṁ tena brahmacariyaṁ` thành *Vị ấy đã sống phí phạm* — sai; `Avusitaṁ`
  là **chưa viên mãn**, đúng như `sn35.72` và như Sujato (*has not completed the
  spiritual journey*). Tôi dịch *đời sống phạm hạnh của vị ấy chưa trọn vẹn*.
  `an11.2` có tiền lệ nguyên văn cho `avippaṭisāratthāni`; ở đây tôi theo `sn35.72`
  cho phần nhân quả và thứ tự câu.

  **Uddāna `16.0`-`16.4` — 0 tiền lệ cho cả năm khoá, và tôi đối chiếu bằng chính
  thứ tự bài trong phẩm.** Đọc Pāli `0.3` của `sn35.64`-`sn35.76`: `sn35.64` là bài
  Migajāla thứ hai, `sn35.65`-`sn35.68` là bốn bài hỏi của Samiddhi, `sn35.69` Upasena,
  `sn35.70` Upavāṇa, `sn35.71`-`sn35.73` là ba bài Sáu Xứ Xúc Chạm. Đúng thứ tự uddāna
  đọc từ Pāli gốc: *Hai bài nói với Migajāla / và bốn bài với Samiddhi / bài Upasena,
  bài Upavāṇa / và ba bài Sáu Xứ Xúc Chạm là vậy.* `Tassuddānaṁ` → *Tóm lược:* theo
  290/386 bản. Câu kết phẩm theo dạng đa số *Phẩm X, thứ N*.

  **`0.3` đặt mới (0 tiền lệ).** `Tatiyachaphassāyatanasutta`: theo `sn35.71`
  *Kinh Sáu Xứ Xúc Chạm (Nhất)* và thứ tự của `sn35.72` *Thứ Hai* → *Kinh Sáu Xứ Xúc
  Chạm Thứ Ba*. Lưu ý cho người gộp: tiêu đề trong phẩm đang lẫn hai kiểu — 135 tệp
  dùng *(Hai)*, 146 tệp dùng *Thứ Hai*; tôi theo *Thứ Ba* vì `sn35.72` ngay cạnh.

  **Dấu lược.** `9.1`-`9.4` Pāli chỉ có `…`; tôi giữ đúng MỘT `…` mỗi khoá và KHÔNG
  mở rộng, không bịa `…` che chỗ thiếu. `lược()` của `_hvi.py` bắt khớp từng khoá.

  **Bất định.** `Ahañhi, bhente` ở `2.3` dịch *Bởi vì* theo `sn35.72` cùng Pāli; đọc
  độc lập nó cũng có thể là *Vì thế*. Nếu sau này chọn cách kia thì phải sửa cả hai bài.

  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
