notes: |-
  Đợt 19, lát l12. Dịch từ Pāli root đã ghim, đối chiếu English Sujato (47/47 khoá Pāli có nội dung = 100%, mẫu số là khoá Pāli từ 40 ký tự trở lên, bỏ khối :0; không có khoá nào Sujato để trống) và bản Hòa thượng Thích Minh Châu nguyên bài (tra cứu toàn văn, không phải tầng segment nên không tính vào coverage). Bài này không có lớp english-project; bản Việt hiện hành chỉ có ở dạng nguyên bài. Hai kinh song song đã dịch trong kho là dn16 (Mahāparinibbānasutta, chương 3) và ud6.1; Pāli trùng nguyên văn với dn16 hoặc ud6.1 thì dùng lại bản dịch dn16 ở 1.4, 2.1–2.3, 3.1, 4.1–4.2, 5.1–5.2, 7.3, 17.1, 17.3 (đã dò 54 khoá Pāli từ 15 ký tự, trong đó 31 khoá có Pāli trùng nguyên văn với khoá khác trong kho).

  68 khoá, đủ mọi khoá Pāli, không khoá nào ngoài tập Pāli. Pāli trùng nguyên văn trong chính bài: 8 nhóm (3.1=5.3, 3.2=5.4, 3.3=5.5, 4.1=6.1, 4.2=6.2, 4.3=6.3, 9.2/11.1/13.1/15.1, 10.2=12.2=14.3), 0 cặp mà bản Việt khác nhau. Dấu lược cân bằng Pāli từng khoá (5.1, 13.2, 14.1: mỗi khoá một …). Nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch trên 68 khoá).

  Số Pāli, tự tính: cattāro iddhipādā = 4 (như ý túc); tiṇṇaṁ māsānaṁ = 3 tháng (accayena: sau ba tháng kể từ nay); sáu đền được kể ở 3.1 (Udena, Gotamaka, Sattamba, Bahuputta, Sārandada, Cāpāla) cộng Vesālī; Dasamaṁ = thứ mười; paṭhamo = thứ nhất. Chữ Sattamba giữ nguyên là tên đền, không dịch như bản Sujato.

  Thuật ngữ, đã đo trên tầng trước khi chọn: iddhipāda = như ý túc (tầng Samyutta 247 lần, 0 lần "thần túc"; dn16 dùng thần túc nên khác); māro pāpimā và pāpima = Ác Ma (sn4: 53 khoá; cũng dùng ở sn2, sn5, sn35), còn Māra đứng riêng = Ma vương (108 khoá trong sn); āyusaṅkhāra ossaji = từ bỏ lực mạng (dn16 5 khoá, ud6.1 dùng thọ mạng 2 khoá); parinibbāyati = nhập Niết-bàn (sn 21 khoá, so với diệt độ 7 khoá, nhập diệt 20 khoá); upāsaka/upāsikā = nam cư sĩ/nữ cư sĩ; bhikkhunī = tỳ-kheo-ni (sn 91); viyattā vinītā visāradā … = khéo léo, được huấn luyện, tự tin, đa văn, nắm giữ Pháp, thực hành pháp và tùy pháp, thực hành đúng đắn, sống theo pháp (đúng như dn16 và an4.7); Evaṁ me sutaṁ — = Tôi nghe như vầy. (47 khoá, so với 20 khoá có dấu gạch ngang).

  Bất định, không đưa vào thân kinh:
  1. kappa ở 3.2, 3.3, 4.3 dịch kiếp theo tiền lệ dn16 và ud6.1. Bản Sujato dịch proper lifespan (tuổi thọ), và truyền thống chú giải thường hiểu đây là tuổi thọ của một đời người (āyukappa) hơn là đại kiếp. Chỗ này giữ kiếp theo tiền lệ và Hòa thượng Thích Minh Châu (sống đến một kiếp hay phần kiếp còn lại), nhưng nghĩa là tuổi thọ.
  2. 7.2–7.3 gaccha kho tvaṁ, ānanda, yassadāni kālaṁ maññasī: Pāli viết nghĩa đen là hãy đi, đến điều mà nay ông thấy là đúng lúc. Văn cảnh là Đức Thế Tôn cho Ānanda rời đi, và bản Sujato dịch at your convenience, Hòa thượng Thích Minh Châu dịch hãy đi và làm những gì ông nghĩ là phải thời, dn16 dịch tương tự. Giữ cách dn16 và Hòa thượng Thích Minh Châu.
  3. 4.3 yathā taṁ mārena pariyuṭṭhitacitto: dịch vì tâm ngài như bị Ma vương chi phối (Hòa thượng Thích Minh Châu: bị Ma vương ám ảnh); không thêm rằng Ma vương thật sự ra tay.
  4. sappāṭihāriyaṁ dhammaṁ desenti (9.3 và các khoá song song): dịch Pháp mầu nhiệm theo ud6.1 và Hòa thượng Thích Minh Châu (chánh pháp thần diệu). Bản Sujato dịch teach with a demonstrable basis và dn16 trong kho dịch có thể kiểm chứng. Hai cách hiểu đều có cơ sở, không phân xử chắc chắn được từ Pāli của riêng bài này.
  5. 18.1–18.4 kệ: Tulamatulañca sambhavaṁ. Bản Sujato hiểu là comparing the incomparable with the creation of prolonged life (và dn16, ud6.1 trong kho theo hướng đó), còn Hòa thượng Thích Minh Châu dịch mạng sống có hạn hay vô hạn. Ở đây dịch sát chữ: tulaṁ, atulaṁ ca, sambhavaṁ là một chuỗi bị buông bỏ cùng bhavasaṅkhāra (hữu hành), vì Pāli chỉ có ca nối tula với atula và không có giới từ nào cho phép dịch với. Cách này khác dn16 và ud6.1 trong kho ở đúng một dòng (18.1); nếu người biên tập muốn đồng bộ, đổi thành Cân nhắc cái vô song với sự sanh khởi. attasambhavaṁ ở 18.4 giữ theo dn16 (sự sanh khởi nơi tự thân).
  6. 4.1, 6.1 oḷārike nimitte, oḷārike obhāse: dịch dấu hiệu rõ ràng, gợi ý rõ ràng theo dn16; nghĩa đen obhāsa gần với ánh sáng, nhưng ngữ cảnh là gợi ý.
  7. 19.1 Apārāpi: tiêu đề sn51.1 trong kho đặt là Đưa Qua Bờ Bên Kia, còn bản Sujato dịch From the Near Shore. Ở tóm lược dịch Bờ Bên Này theo Pāli apāra; chưa đồng bộ với tiêu đề sn51.1 và nên để người biên tập phán.
  Tiêu đề Kinh Đền Cāpāla: Pāli chỉ là Cetiyasutta; thêm tên Cāpāla theo tiêu đề Sujato và để phân biệt.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở 9.6: chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, nháy đơn và nháy kép khớp Pāli từng khoá, YAML sạch. Bốn lệnh npm run validate, npm test, npm run check, npm run build để người điều phối chạy.
