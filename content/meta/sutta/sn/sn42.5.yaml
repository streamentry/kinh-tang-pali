notes: |-
  Dịch từ Pāli root đã ghim (`…/root/pli/ms/sutta/sn/sn42/sn42.5_root-pli-ms.json`; git object `5494e9c2f5d84188bf5393b4fe9df69cf57e0995`, commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`).

  **⚠ TẦNG ANH KHÔNG ĐỦ — 1/18 = 5,56%.** Bản Anh Sujato tại commit đã ghim để trống 31/32 khoá, nên gần như **toàn bộ** bài này phải đọc Pāli một mình. **Tôi không tuyên bố đã đối chiếu English cho bài này**, và `triangulation` hạ xuống 7.5. (Mục này vẫn đúng sau lượt giải quyết 2026-10-12; blocker tương ứng đã gỡ — xem cuối notes.)

  **DÙNG LẠI NGUYÊN VĂN — 15/32 khoá** ở lần dịch đầu. Bài này và `sn42.3` (Yodhājīvasutta) là **cùng một công thức peyyāla**, chỉ khác `assāroho` thay `yodhājīvo`; mọi Pāli trùng nguyên văn đều lấy từ đó: `0.2` = `sn42.7:0.2` · `1.4`/`2.5` = `sn42.3:1.4` = `sn42.2:1.5` · `1.5` = `sn42.3:1.5` · `2.1` = `sn42.3:1.6` · `3.1` = `sn42.3:2.1` = `sn42.2:2.1` · `3.2` = `sn42.3:2.2` · `3.7` = `sn42.3:2.8` · `3.9` = `sn42.3:2.10` = `sn42.2:2.14` · `3.10` = `sn42.3:2.11` = `sn42.2:2.15` · `4.2` = `sn42.3:3.2` = `sn42.2:3.2` · `4.3` = `sn42.3:3.3` = `sn42.2:3.3` · `4.7` = `sn42.3:3.7` · `4.8` = `sn42.3:3.8` · `4.9` = `sn38.5:1.12`. Thêm ba khoá **cùng Pāli trong chính bài** (`1.3`=`2.4`, `1.4`=`2.5`, `1.2`=`2.3`) dịch giống hệt nhau, vì đây là **cùng một lời tuyên bố được lặp**, không phải lặp vô nghĩa. (Từ lượt 2026-10-12, các khoá `1.1`, `1.3`, `2.4`, `3.4`, `3.5`, `3.6`, `3.7`, `3.8`, `4.5`, `4.6` không còn khớp nguyên văn `sn42.3` — xem mục cuối.)

  **BẪY ĐÃ BẮT — `1.1` không được đặt dấu lược.** `sn42.3:1.1` có `upasaṅkamitvā …pe… ekamantaṁ nisinno`, bản Việt ở đó là *đến nơi … ngồi xuống*. Pāli của bài này **viết đủ** `upasaṅkamitvā ekamantaṁ nisīdi. Ekamantaṁ nisinno…` ⇒ không có `…pe…`, nên viết đủ *đến nơi, ngồi xuống một bên*.

  **Tên phẩm — cần người biên tập xác nhận.** `Assārohasutta`: Sujato dịch *A Cavalryman* / *cavalry chief*. Tầng tên `name/` không khai mục này. `sn42.3` đã chiếm tiêu đề *Kinh Người Chiến Sĩ*, nên chọn **Kinh Người Kỵ Mã** để hai bài em anh phân biệt được và tra được; `kỵ binh` đã có **3** nơi, `cưỡi ngựa` **6** nơi trong tầng. Trong thân bài dùng *kỵ mã / thôn trưởng kỵ mã* thay *chiến sĩ* của `sn42.3`.

  **Thuật ngữ, kèm số đếm:** `gāmaṇi` → *thôn trưởng* (8 tệp cùng phẩm đã dùng) · `ācariyapācariya` → *các thầy của thầy* · `kāyassa bhedā paraṁ maraṇā` → *sau khi thân hoại mạng chung* · `sahabyataṁ` → *sinh ra cùng với chư thiên thuộc hàng kẻ bị đánh bại* (giữ `parajita` cả ba chỗ `1.3`/`2.4`/`4.6`) · `parajito nāma nirayo` → *cõi địa ngục tên là ‘Kẻ Bại Trận’* · `parodi, assūni pavattesi` → *bật khóc, nước mắt chảy xuống* · `tiracchānayoni` → *loài vật* · `Abhikkantaṁ` → *Thật vi diệu thay* · `Pañcamaṁ` → *Thứ năm* (**112**). (Các cách dịch `ussahati vāyamati`, `hananti pariyāpādenti`, `pubbe gahitaṁ dukkaṭaṁ duppaṇihitaṁ`, `mā ahesuṁ iti vā`, `nikato vañcito paluddho`, `diṭṭhi` ở `3.7` nêu ở bản đầu đã được **thay thế** bằng mục "Giải quyết draft 2026-10-12" bên dưới.)

  **Phán xử còn giữ:** `4.8` `ajjatagge pāṇupetaṁ saraṇaṁ gatan`: Pāli ở `4.7` lược phần `upāsakaṁ maṁ bhagavā dhāretu` bằng `…pe…`, còn `4.8` chỉ có vế `ajjatagge … gatan`. Theo `sn42.3:3.8` nguyên văn: *Từ hôm nay cho đến trọn đời, xin Đức Thế Tôn ghi nhận tôi là một nam cư sĩ đã quy y* — đủ cả ba vế, nhưng vế *xin ghi nhận … nam cư sĩ* là phần công thức được lược ở `4.7` nối sang; đa số toàn tầng (`sn7.18:7.3`, `sn7.11:11.3`) chỉ có *Từ hôm nay trở đi, con trọn đời quy y* và bỏ mất `pāṇupetaṁ`.

  **Dấu lược:** chỉ hai khoá có, `2.1` và `4.7`, mỗi khoá đúng **một** `…` cho `…pe…`. Bản Anh đã ghim **mở rộng** `…pe…` ở `1.1` thành *bowed* — theo luật của kho không thêm đảnh lễ và không mở rộng.

  **Giải quyết draft 2026-10-12** (thay thế các mục cũ nêu trên ở những điểm sau):
  (1) **Sửa — 10 khoá trên 32 có đổi (`1.1`, `1.3`, `2.4`, `3.4`, `3.5`, `3.6`, `3.7`, `3.8`, `4.5`, `4.6`); lỗi nghĩa thật ở 4 khoá (`3.4`, `3.5`, `3.7`, `4.5`), còn lại là bổ sung vế bị bỏ (`vāyamati`), đổi chữ khó hiểu (`hạ trọn`) hoặc bỏ chữ thừa.**
  - `3.5` `haññantu vā bajjhantu vā ucchijjantu vā vinassantu vā mā ahesuṁ iti vā`: bản cũ dịch `bajjhantu` thành *bị bắn cho trúng* (sai: `bajjhati` là *bị trói*, không có nghĩa bắn) và dịch `mā ahesuṁ iti vā` thành *hoặc cho là chúng ta không hề tồn tại* (sai chủ thể và sai thức: `mā ahesuṁ` là mệnh lệnh/mong ước ngôi thứ ba, chủ ngữ vẫn là `ime sattā`, không phải *chúng ta*). Nay: *Mong những chúng sinh này bị giết, bị trói, bị cắt đứt, bị hủy diệt, hoặc đừng tồn tại nữa*. `haññantu` … `vinassantu` cũng là ngôi thứ ba mong ước, nên bỏ *Xin* (nghe như xin ai đó) mà dùng *Mong*.
  - `3.4` `pubbe gahitaṁ dukkaṭaṁ duppaṇihitaṁ`: bản cũ *khó khăn, khó chỉnh định* sai — `dukkaṭa` là *làm sai, làm xấu* (so `dn16:3.40.6`, `sn2.8:4.1` đều dịch *lỗi lầm / việc ác*), `duppaṇihita` là *hướng sai, đặt sai*, không phải *khó*. Nay: *đã bị nắm giữ, bị làm sai, bị hướng sai*. Tầng Pāli đã ghim ở `sn42.3:2.4` và `sn42.5:3.4` cùng đọc `gahitaṁ`; Sujato (`sn42.3:2.4`) dịch *already low, degraded, and misdirected*, tức đọc như `hīnaṁ` hoặc lấy nghĩa chung của chuỗi. **Bất định còn lại:** nghĩa chính xác của `pubbe gahitaṁ` (tâm đã bị *nắm giữ* bởi ý nghĩ ác từ trước, hay *đã bị cầm giữ/đã thành thói quen*) — giữ nghĩa đen, không thêm.
  - `4.5` `nikato vañcito paluddho`: bản cũ *lừa gạt, lừa đảo, bẫy lừa* lặp ba chữ *lừa* và dịch `paluddha` (*bị dụ dỗ, bị cám dỗ*) thành *bẫy lừa*; `mn75:23.17` và `mn75:24.6` có đúng chuỗi này, dịch *lừa dối, lừa gạt, dụ dỗ* (2 nơi, 2/2). Nay theo đó: *đã lừa dối, lừa gạt, dụ dỗ tôi*. Chữ đầu `4.5` viết hoa vì `4.4` đã kết thúc bằng dấu chấm (Pāli `Api cāhaṁ`).
  - `3.7` `Sace kho panassa evaṁ diṭṭhi hoti`: `diṭṭhi` trung tính, `micchādiṭṭhi` chỉ ở `3.8`; bản cũ *có tà kiến như sau … thì đó là tà kiến* tự lặp và biến vế điều kiện thành kết luận. Nay *có quan điểm như sau* (`diṭṭhi hoti` kèm `sammādiṭṭhi/micchādiṭṭhi` ở tầng thường dịch *quan điểm / kiến*: `mn9:2.2`, `mn9:3.2`, … 3 nơi trong mẫu đã quét; `sn42.2:2.12` dùng *kiến*).
  - `ussahati vāyamati` / `ussahantaṁ vāyamantaṁ` (`1.3`, `2.4`, `3.4`, `3.6`, `3.8`, `4.6`): bản cũ bỏ mất `vāyamati`. Nay *đang nỗ lực, cố gắng* (`an5.76:1.4` có *nỗ lực, cố gắng*, đúng cặp động từ này).
  - `pare hananti pariyāpādenti` (`1.3`, `2.4`, `3.6`, `3.8`, `4.6`): *hạ trọn* là chữ khó hiểu; `pariyāpādeti` là *làm cho chấm dứt, kết liễu*. Nay *giết và kết liễu* (Sujato dịch *killed and finished off*, `sn42.3:1.3`). `pare` vẫn dịch *đối thủ* như `sn42.3` cùng phẩm, nhưng chữ gốc là *những kẻ khác*; giữ vì ngữ cảnh trận chiến.
  - `1.1` bỏ chữ *thì* thừa (`upasaṅkamitvā ekamantaṁ nisīdi`, không có *thì*).
  (2) **Các khoá Sujato bỏ trống mà tôi đã đọc kỹ từ Pāli** (17 khoá): `1.2`, `1.3`, `1.5`, `2.2`, `2.3`, `2.4`, `3.2`, `3.4`, `3.5`, `3.6`, `3.8`, `3.9`, `4.1`, `4.3`, `4.4`, `4.5`, `4.6`. Các lời của Đức Phật ở `3.x` và lời tỳ-kheo/thôn trưởng ở `1.x`/`4.x` đều là câu đơn giản và lặp công thức; Pāli tự đứng vững. Đối chiếu song song với `sn42.3` (có Sujato đầy đủ) cho cấu trúc và nghĩa từng vế (`sn42.3:2.4`–`2.9`, `3.4`–`3.6`) — đây là **bài song song, không phải bản Anh của chính bài này**, nên `triangulation` vẫn ≤ 8,0 (nay 7.5). Bản Việt nguyên bài ở mục Tra cứu toàn văn của bài này chỉ ghi *giống như kinh trước, chỉ khác là mã sư*, không đủ để đối chiếu từng câu.
  (3) **Blocker đã gỡ:** blocker (B) về độ phủ Anh 1/18 < 0,80 — không phải lỗi văn bản mà là giới hạn của bản Anh đã ghim (Sujato để trống 17/18 đoạn Pāli có nội dung; `sn42.3` có đủ, bài này lược thành `…`). Đã đọc đối kháng 17 khoá trống từ Pāli, không còn nghĩa nào chưa chắc, nên gỡ; mất mát được ghi nhận qua `content/meta/reference-gaps.yaml` theo quy trình của kho. Tầng `vietnamese-current` không có bản phân đoạn cho bài này (chỉ Pháp Cú có), cũng là giới hạn tham chiếu, không phải lỗi văn bản.
  (4) **Lỗi cùng họ ở bài em `sn42.3` (ngoài lát, chỉ báo):** `sn42.3:2.4` và `2.5` dùng *khó khăn, khó chỉnh định* và *bị bắn cho trúng … hoặc cho là chúng ta không hề tồn tại* cho cùng Pāli (`mā vā ahesuṁ iti vā` ở đó có thêm `vā`); nên sửa theo cách đọc ở `3.4`/`3.5` của bài này. `sn42.3:3.5` và `sn42.2:3.5` có *bẫy lừa* cho `paluddho`. Hiện bài này lệch nguyên văn với `sn42.3` ở các khoá trên **vì sửa lỗi**, không phải vì khác công thức.
  (5) **Điểm sau lượt này:** `semantic_fidelity` 9.1 (còn `pare`→*đối thủ*, `pubbe gahitaṁ` giữ nghĩa đen, `4.8` nối vế công thức), `terminology` 8.9, `ambiguity_integrity` 8.8, `vietnamese_clarity` 9.2 (bỏ *hạ trọn*, *bẫy lừa*, *khó chỉnh định*); các điểm khác giữ. `technical_integrity` = 9.6, chưa chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`.
