  **⚠ TẦNG ANH KHÔNG ĐỦ — 1/18 = 5,56%.** Chi tiết và lý do `draft` nằm trong `blocking_errors`. Bản Anh Sujato tại commit đã ghim để trống 31/32 khoá, nên gần như **toàn bộ** bài này phải đọc Pāli một mình. **Tôi không tuyên bố đã đối chiếu English cho bài này**, và `triangulation` hạ xuống 7.5.

  **DÙNG LẠI NGUYÊN VĂN — 15/32 khoá.** Bài này và `sn42.3` (Yodhājīvasutta) là **cùng một công thức peyyāla**, chỉ khác `assāroho` thay `yodhājīvo`; mọi Pāli trùng nguyên văn đều lấy từ đó: `0.2` = `sn42.7:0.2` · `1.4`/`2.5` = `sn42.3:1.4` = `sn42.2:1.5` · `1.5` = `sn42.3:1.5` · `2.1` = `sn42.3:1.6` · `3.1` = `sn42.3:2.1` = `sn42.2:2.1` · `3.2` = `sn42.3:2.2` · `3.7` = `sn42.3:2.8` · `3.9` = `sn42.3:2.10` = `sn42.2:2.14` · `3.10` = `sn42.3:2.11` = `sn42.2:2.15` · `4.2` = `sn42.3:3.2` = `sn42.2:3.2` · `4.3` = `sn42.3:3.3` = `sn42.2:3.3` · `4.7` = `sn42.3:3.7` · `4.8` = `sn42.3:3.8` · `4.9` = `sn38.5:1.12`. Thêm ba khoá **cùng Pāli trong chính bài** (`1.3`=`2.4`, `1.4`=`2.5`, `1.2`=`2.3`) tôi dịch giống hệt nhau, vì đây là **cùng một lời tuyên bố được lặp**, không phải lặp vô nghĩa.

  **BẪY ĐÃ BẮT — `1.1` không được đặt dấu lược.** `sn42.3:1.1` có `upasaṅkamitvā …pe… ekamantaṁ nisinno`, bản Việt ở đó là *đến nơi … ngồi xuống*. Pāli của bài này **viết đủ** `upasaṅkamitvā ekamantaṁ nisīdi. Ekamantaṁ nisinno…` ⇒ không có `…pe…`, nên tôi viết đủ *đến nơi thì ngồi xuống một bên*. Nếu sao chép nguyên văn bài em thì đã thêm một dấu lược không có nguồn.

  **Tên phẩm — cần người biên tập xác nhận.** `Assārohasutta`: Sujato dịch *A Cavalryman* / *cavalry chief*. Tầng tên `name/` không khai mục này. `sn42.3` đã chiếm tiêu đề *Kinh Người Chiến Sĩ*, nên tôi chọn **Kinh Người Kỵ Mã** để hai bài em anh phân biệt được và tra được; `kỵ binh` đã có **3** nơi, `cưỡi ngựa` **6** nơi trong tầng. Trong thân bài tôi dùng *kỵ mã / thôn trưởng kỵ mã* thay *chiến sĩ* của `sn42.3`.

  **Thuật ngữ, kèm số đếm:** `gāmaṇi` → *thôn trưởng* (8 tệp cùng phẩm đã dùng) · `ācariyapācariya` → *các thầy của thầy* · `ussahati vāyamati` → *đang nỗ lực trong trận* · `hananti pariyāpādenti` → *giết và hạ trọn* · `kāyassa bhedā paraṁ maraṇā` → *sau khi thân hoại mạng chung* · `sahabyataṁ` → *sinh ra cùng với chư thiên thuộc hàng kẻ bị đánh bại* (giữ `parajita` cả ba chỗ `1.3`/`2.4`/`4.6`) · `parajito nāma nirayo` → *cõi địa ngục tên là ‘Kẻ Bại Trận’* · `pubbe gahitaṁ dukkaṭaṁ duppaṇihitaṁ` → *từ trước đã bị chiếm giữ, khó khăn, khó chỉnh định* (ba tính từ tính từng về tâm) · `mā ahesuṁ iti vā` → *hoặc cho là chúng ta không hề tồn tại* (đọc theo nghĩa **phủ định sự tồn tại**) · `nikato vañcito paluddho` → *lừa gạt, lừa đảo, bẫy lừa* · `parodi, assūni pavattesi` → *bật khóc, nước mắt chảy xuống* · `micchādiṭṭhi` → *tà kiến* · `tiracchānayoni` → *loài vật* · `Abhikkantaṁ` → *Thật vi diệu thay* · `Pañcamaṁ` → *Thứ năm* (**112**).

  **Hai chỗ phải phán xử, đã ghi:**
  (1) `diṭṭhi` ở `3.7` nghĩa đen là *kiến* (trung tính); `micchādiṭṭhi` ở `3.8` mới là *tà kiến*. Tôi vẫn dùng *tà kiến* ở cả hai để khớp `sn42.3:2.8` nguyên văn — người đọc sẽ thấy *tà kiến … thì đó là tà kiến*, hơi lặp nhưng nhất quán với bài em. Ba nơi khác trong tầng dịch `diṭṭhi` trung tính thành *quan điểm* (`mn2:8.7`, `mn22:20.3`, `mn22:21.3`).
  (2) `4.8` `ajjatagge pāṇupetaṁ saraṇaṁ gatan`: đa số toàn tầng là *Từ hôm nay trở đi, con trọn đời quy y* (`sn7.18:7.3`, `sn7.11:11.3`, **2** nơi) — nhưng hai bản ấy **bỏ mất** `pāṇupetaṁ saraṇaṁ gatan` (chỉ *đã quy y*), tức mất chữ có nguồn. Tôi theo `sn42.3:3.8` nguyên văn: *Từ hôm nay cho đến trọn đời, xin Đức Thế Tôn ghi nhận tôi là một nam cư sĩ đã quy y* — đủ cả ba vế.

  **Dấu lược:** chỉ hai khoá có, `2.1` và `4.7`, mỗi khoá đúng **một** `…` cho `…pe…`. Bản Anh đã ghim **mở rộng** `…pe…` ở `1.1` thành *bowed* — theo luật của kho tôi không thêm đảnh lễ và không mở rộng.
