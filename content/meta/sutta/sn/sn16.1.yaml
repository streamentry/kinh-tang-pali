notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của `_hvi.py` gần như vô dụng ở bài này**: nó chỉ quét khoá Pāli từ 40 ký tự trở lên, mà mọi vế kệ ở đây đều ngắn hơn, nên `cần` rỗng và assertion không chạy. Vì vậy tôi tự quét **toàn bộ** khoá từ đĩa: đủ khoá, đúng exact ID, NFC, không rỗng, dấu lược khớp Pāli từng khoá, ngoặc kép cân cả bài, không Pāli lọt, không `(…)`. Kết quả: **0 lỗi trên 252 khoá**.
  - |-
    **Đã tự dựng chỉ mục Pāli↔Việt toàn tầng rồi so khoá của lát, không đoán.** Nạp mọi tệp Pāli gốc trong cache (284.708 khoá) và mọi tệp Việt dự án (111.657 khoá), ghép theo khoá vì khoá là duy nhất toàn hệ thống. Lát này tìm được **2 khoá có Pāli trùng nguyên văn với bài đã có bản Việt ngoài lát (117 cặp)**, và **16 cụm Pāli trùng nguyên văn nội lát**. Mọi bản Việt đã có đều được dùng lại nguyên văn, không dịch lần hai.
  - |-
    **Coverage English 11/11 = 100%** trên Pāli có nội dung, nên không có khoá nào phải đứng một mình. Đây là bài duy nhất của lát mà tầng Anh phủ kín, và tôi vẫn không dùng nó làm chuẩn: ba chỗ Sujato dịch sai hướng, đã quay lại Pāli.
  - |-
    **Nguyên văn trùng bắt buộc với dn33 — đã dùng lại y nguyên, không dịch lại.** `agadhito amucchito anajjhāpanno ādīnavadassāvī nissaraṇapañño paribhuñjati` là cùng nguyên văn với dn33:1.11.64/66/68, và dn33 đã dịch là *không đắm chấp, không si mê, không trói buộc, thấy rõ mối hại, có trí về sự thoát ly*. Tôi dùng lại đúng chuỗi đó cho cả bốn vật, kể cả `santuṭṭho` → *tri túc* (107 bài) và `itthītarena …` → *tùy được*. Lưu ý: mn55:6.11 dịch cùng cụm Pāli ấy bằng *không bị trói buộc, không mê đắm, không dính mắc* — hai cách đang cùng tồn tại trong tầng; tôi theo dn33 vì cùng cấu trúc `santuṭṭhāyaṁ … itarītarena …`.
  - |-
    **Ba chỗ Sujato sai hướng, Pāli thắng.** (1) `appatirūpaṁ āpajjati` hắn dịch *improper solicitation* — `āpajjati` là *bước vào*, tôi dịch *tìm cầu những điều không xứng đáng* theo dn33. (2) `laddhā ca cīvaraṁ … paribhuñjati` hắn dịch *uses it untied* — `agadhito` không phải *không buộc* mà là *không bị trói*, tôi theo dn33. (3) `vaṇṇavādī` hắn dịch *praises*, tôi dùng *tán thán* theo dn33:1.11.64.
  - |-
    **Review đối kháng bắt được 2 lỗi.** (1) `2.1/3.1/4.1` bản nháp tôi đặt dấu phẩy ở giữa câu (`…tùy được ấy, không vì…`) trong khi `1.2` đặt dấu chấm phẩy — bốn vế song song phải có cùng nhịp dấu câu; đã thống nhất cả bốn. (2) `6.5` `tathattāya paṭipajjitabban` bản nháp tôi viết *thực hành đúng như lời đã được khuyên dạy* — bỏ mất `tathattāya` (*đúng thật*); đã sửa.
  - |-
    **Nháy kép.** `“` mở ở `1.2` và đóng ở `6.5`, đúng quy ước SuttaCentral: lời giảng của Kassapa là **một** lời thoại suốt sáu đoạn. Bên trong nó, `5.1–5.2` và `6.1–6.3` dùng `‘…’` cho phần người nghe phải học thuộc. `5.3` là chú thích trong ngoặc của Pāli và tôi giữ nguyên ngoặc — đây không phải chỗ lỗ chưa dịch.
  - |-
    **Điểm lệch đã đo, không phải tự ý.** `1.1` `Sāvatthiyaṁ viharati.` chia đôi gần như bằng: *Trú ở Sāvatthī.* 54 bài so với *Đang sống tại Sāvatthī.* 52 bài. Tôi theo phe đa số, và chọn cách giữ động từ `viharati` thay vì đổi thành trạng thứ. **Chênh lệch 54–52 là thực tế của tầng, không phải lựa chọn có cơ sở; người biên tập nên chốt một cách cho toàn tầng.**
