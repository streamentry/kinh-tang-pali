notes: |-
  Đủ 78/78 khoá, thứ tự khoá = thứ tự Pāli, dịch từ Pāli; không khoá nào ngoài `all`.
  **Coverage English (đo thật):** mẫu số = 69 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Sujato phủ 68/69 = 0,9855 (≥ 0,80). Khoá duy nhất Sujato để trống là `11.2` (`itipi so bhagavā …pe… satthā devamanussānaṁ buddho bhagavāti;`); lớp `english-project` của dự án đã `published` và lấp đúng khoá đó, nên cổng tính 69/69, nhưng phần lấp **không** phải đọc English độc lập (cùng một nhóm tác giả) — `triangulation` hạ xuống 9,0 vì vậy. Không có tầng Việt hiện hành cho bài này (chỉ có Pháp Cú trong snapshot đã ghim); tiền lệ Thích Minh Châu chỉ được tham chiếu gián tiếp qua các bài đã dịch trong kho. Không cần entry `reference-gaps` vì coverage trên ngưỡng.
  **Dùng lại nguyên văn.** Dò 78 khoá với toàn tầng sn/an/dn/mn/kn: 16 khoá có Pāli trùng nguyên văn ở bài khác; 13 khoá dùng lại nguyên văn bản Việt có sẵn: `0.2` (8 bài sn55 cùng phẩm, `1. Phẩm Veḷudvāra`), `1.1` (`Tôi nghe như vầy—`, 29 khoá cùng Pāli), `1.5`–`1.9` = `mn150:2.3`–`2.7` (`1.5` cũng = `mn41:2.3`, `mn42:2.4`), `3.2` (15 khoá), `3.4` (22 khoá), `11.7` = `sn55.8:6.7` (cùng `sn55.9:3.3`, `sn55.10:6.7`), `12.2` (15 khoá), `12.4` = `mn41:44.5`, `12.5` (`Thứ bảy.`, 261 khoá). 3 khoá có Pāli trùng ở bài khác mà bản Việt cố ý khác: `11.2`, `11.3`, `11.5` (khoá nằm trong danh sách chi, giữ dạng ngắn và thay đại từ cho liền mạch với `11.1`/`11.4` của chính bài, theo đúng hình thức `sn55.8:6.1`–`6.4`). Trong chính bài: 6 nhóm Pāli trùng (23 khoá) — `x.1` ×6, `4.6/5.4/6.4/7.4/10.4`, `4.7/5.5/6.5/7.5/10.5`, `4.9/5.7/6.7`, `7.7/10.7`, `8.4/9.5` — 0 nhóm có bản Việt khác nhau.
  **Thuật ngữ, kèm đếm.** `pāṇātipātā` → *sát sinh* (168 khoá toàn tầng, 0 dạng khác trong sn55). `adinnādānā` → *lấy của không cho* (86 khoá chỉ dùng dạng này, so với 51 khoá chỉ dùng *trộm cắp*; riêng sn thì 4 so với 7 — đã chọn dạng đa số toàn tầng, trùng với khoá sn55 duy nhất). `adinnaṁ theyyasaṅkhātaṁ ādiyeyya` → *lấy … món không được cho, đồng nghĩa với trộm cắp* theo `an5.178:2.11`. `kāmesumicchācārā` → *tà hạnh trong các dục* (34 + 16 *trong dục* = 50, đối lập *tà dâm* 40; sn: 2 so với 6; sn55: 1 so với 0). `pisuṇāya vācāya` → *lời nói hai lưỡi* (59 khoá, so với 35 khoá dùng *chia rẽ*). `pharusāya vācāya` → *lời thô ác* (26 *thô ác*, ngang *ác khẩu* 26 và *nói lời ác* 23 — ba dạng gần bằng nhau, đã chọn dạng sát chữ `pharusa`). `samphappalāpā` → *nói phù phiếm* (64 khoá). `veramaṇiyā samādapeti` → *khuyến khích … kiêng tránh* (42; *khích lệ* 12, *khuyến hóa* 7). `vaṇṇaṁ bhāsati` → *nói lời tán thán* (7, ngang *khen* 7). `kāyasamācāra`/`vacīsamācāra` → *hạnh thân*/*hạnh khẩu* (`an5.162:2.3`). `sattahi saddhammehi` → *bảy thiện pháp* (`mn53`, 6 khoá). `ariyasāvako … buddhe aveccappasādena samannāgato` → *thành tựu lòng tịnh tín bất động nơi Đức Phật* (sn55.8, .12, .28, .30). `jīvitukāmo amaritukāmo sukhakāmo dukkhappaṭikūlo` → *muốn sống, không muốn chết, muốn an vui và ghét khổ* (`mn46:18.2`, `sn35.238:1.2`, `sn47.20:2.4`). `appiyaṁ amanāpaṁ` → *không ưa, không thích* (`dn32:2.12`). `puttasambādhasayanaṁ ajjhāvasati` → *sống trong nhà chật chội vì con cái* (`sn3.11:4.1`, `sn55.53:2.4`); `kāsikacandanaṁ` → *trầm hương Kāsi* theo hai tiền lệ đó, dù `candana` sát nghĩa là gỗ đàn hương (giữ để khớp tầng). Tiêu đề `Veḷudvāreyyasutta` → *Kinh Dân Làng Veḷudvāra* theo `mn150` (*Kinh Dân Làng Nagaravinda*).
  **Số Pāli, tự tính:** `sattahi saddhammehi` = 7 (ba hạnh thân: sát sinh, lấy của không cho, tà hạnh trong các dục; bốn hạnh khẩu: nói dối, hai lưỡi, thô ác, phù phiếm — 3 + 4 = 7, khớp đủ bảy mục `4`–`10` của bài); `catūhi ākaṅkhiyehi ṭhānehi` = 4 (Phật, Pháp, Tăng, giới — `11.1`–`11.5`); `tikoṭiparisuddho` = 3 (*ba phương diện*). Phép kiểm số bằng máy (9 từ khoá đã xác lập, có hiệu chuẩn) không chứa từ khoá nào xuất hiện trong Pāli của bài này nên **không đo được gì cho bài này**; ba số trên là tự tính tay.
  **Bất định, ghi tại đây chứ không thêm vào thân kinh.** (1) `dāresu cārittaṁ āpajjeyya` (`6.2`, `6.3`): cụm uyển ngữ, chữ Pāli không có tiền tố *mis-*; dịch *tà hạnh với vợ* theo nghĩa từ điển (cārittaṁ āpajjati = hành xử sai trái trong quan hệ) và vì khoá `6.6` dùng đúng thuật ngữ *kāmesumicchācāra*; Sujato viết *have relations with*. Không có tiền lệ trong tầng (0 khoá cho cụm này). (2) `musāvādena atthaṁ bhañjeyya` (`7.2`, `7.3`): `attha` ở đây dịch *lợi ích* (nghĩa thông dụng của `attha` trong ngữ cảnh bị hại), không theo *meaning* của Sujato; 0 tiền lệ cho cụm này trong tầng. (3) `attupanāyika` (`3.1`, `4.1`): dịch *liên hệ đến chính mình*; Sujato *relevant for oneself*; không có tiền lệ trong tầng. (4) `tikoṭiparisuddho`: *ba phương diện* là lựa chọn diễn đạt; sát chữ hơn là *ba điểm*; Pāli không nêu ba mục nào, và đây không được thêm vào thân kinh. (5) `2.3`: các động từ optative `ajjhāvaseyyāma … upapajjeyyāma` dịch bằng *mong sao chúng tôi …* theo cấu trúc `evaṅkāmā evaṁchandā evaṁadhippāyā` ở `2.2`; `2.4` bản Pāli có một `…pe…` ở giữa, giữ đúng một `…`. (6) Pāli `8.2` và `9.2` mở bằng dấu nháy kép “ thay vì nháy đơn ‘ (khác `5.2`, `6.2`, `7.2`, `10.2`); giữ đúng như Pāli từng khoá, không chỉnh. (7) Không có `(…)` trần ở khoá nào của bài. (8) `1.4` `bho` dịch *Này quý vị* theo tiền lệ `dn5:2.2`, `mn82:2.2`; `khalu` không được dịch riêng (0 tiền lệ dịch riêng).
  **Lỗi bản nháp đã bắt:** bản đầu ghi `1.5` theo cách diễn đạt riêng; đối chiếu 27 khoá cùng Pāli thấy ba bài mn có cùng ngữ cảnh làng bà-la-môn dùng `Về Tôn giả Gotama ấy có tiếng lành truyền xa như sau:` (cùng nguồn với chuỗi `1.6`–`1.9` đã tái dùng), nên đã đổi về đó.
