notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `4. Puññābhisandavagga` → «4. Phẩm Gặp Gác Công Đức». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Sửa lan 2026-10-13: khoá 3.6 — `sabbaṁ taṁ appaṭivibhattaṁ sīlavantehi kalyāṇadhammehi`. Trước: «con đều chia sẻ không phân biệt với các bậc có giới đức…» → sau: «tất cả đều không giữ riêng, mà chia sẻ với các bậc có giới đức và có thiện pháp». Căn cứ: `appaṭivibhatta` = không chia riêng cho mình; cùng công thức ở `sn55.6:18.5`, `an8.21:6.2`, `an8.22:6.2` (không giữ riêng, mà chia sẻ).
  Sửa lan 2026-10-13 (lượt L810, terminology fix, tên phẩm): khoá `sn55.39:0.2` — `4. Puññābhisandavagga`. Trước: «4. Phẩm Gặp Gác Công Đức» → sau: «4. Phẩm Dòng Phước Chảy Tràn». Căn cứ: `puññābhisanda` là dòng phước chảy tràn, không có chữ Pāli nào mang nghĩa «gặp gác»; cùng tên phẩm được dịch «Phẩm Dòng Phước Chảy Tràn» ở `sn55.31:0.2`, `sn55.32:0.2` và 10/10 khoá `:0.2` của `an4.51`–`an4.60` (12/12); mục «terminology fix (2026-10-04)» ở trên, vốn chọn «Gặp Gác Công Đức» theo đa số cục bộ, được thay bằng mục này. Bài không có khoá nào khác chứa «Gặp Gác». Chưa sửa ở lượt này: `sn55.33`–`sn55.38`, `sn55.40` (cùng phẩm) còn ghi «Gặp Gác Công Đức».
