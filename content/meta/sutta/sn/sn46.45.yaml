    **Ba chỗ tôi cố ý không theo bản Anh, và ghi lại để người biên tập cân:**
    (1) `sn14.19:1.2` — `Dhātusova`: Sujato đọc là *“an element”* (theo `dhātu`
    = phần tử), còn từ điển tra nghĩa là *“xét về nghĩa lý”*; tôi theo nghĩa từ
    điển tra. (2) `sn46.45:1.1` — `aneḷamūgo`: Sujato dịch `ajaḷo aneḷamūgo`
    (an5.152) thành *“sáng suốt, thông minh”*, tức coi đây là tính từ tốt; tôi
    dịch thẳng *không mù không câm* vì ở đây nó là **danh từ** được gọi tên, và
    dịch thẳng giữ được nghĩa *không mù không câm* như một lời khen. (3)
    `sn22.75` — Sujato mở rộng ba đoạn lược thành đủ *feeling, perception,
    choices, and consciousness*; Pāli lược nên tôi giữ lược.
