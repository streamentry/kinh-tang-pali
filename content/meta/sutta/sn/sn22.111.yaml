    **Lệch có chủ đích so với bản đã `published` — không âm thầm viết lại bản
    cũ:** (1) `sn17.29` dịch `chaviṁ chindati` là **chặt da**, còn `sn17.28:1.3`
    (đã publish) dùng **cắn da**. Pāli `chin-d` = cắt/chặt, Sujato dịch *cut
    through*, và `an3.69:15.7` đã publish dùng **chặt** cho `chindeyya` — nên
    **cắn** là lỗi, tôi dùng cách đúng và **ghi đây là chỗ cần người biên tập
    xem lại `sn17.28`**. (2) `saññāvedayitanirodhaṁ` → **sự chấm dứt tưởng và
    thọ**: đa số 12+ segment (`an5.166`) dùng *sự chấm dứt tưởng và thọ*, 4
    segment (`an9.46/47/52/61`) dùng *sự đoạn tận của tưởng và cảm thọ*;
    `nirodha` là *chấm dứt* và `vedaya` là *thọ*, nên tôi theo đa số. (3)
    `asaṅkhata` → **bất tân**: đếm thật là 8 bài `sn43.*` dùng *bất tân* và chỉ
    `an3.47:2.1` dùng *vô vi*, nên loạt `sn43` này theo đa số. (4)
    `sotāpattiyaṅga` → **bốn thành phần của sự nhập lưu**: kho chia đều 2–2
    (`sn55.29` dùng *thành phần của sự nhập lưu*, `an5.15` và `dhp178` dùng *Dự
    lưu*), nhưng **cùng phẩm `sn55`** đã publish dùng *nhập lưu* và *Dự lưu* là
    calque của `sota-patti` (*sông đưa qua*) nên tôi giữ *nhập lưu* theo gia
    đình `sn55`. (5) `aḍḍho mahaddhano mahābhogo` → **giàu có, nhiều tài sản,
    nhiều của cải**: `an3.100:10.2` dịch *giàu có, giàu tài sản, nhiều tiền của*
    (vế cuối rất khó đọc), `an5.134:3.6` dịch *giàu có, nhiều của cải, sung túc*
    (nuốt mất một vế), nên tôi giữ đủ ba vế bằng lời tự nhiên. (6) `appicchatā`
    → **không sơ hở**: `an1.378-393:1.1` dịch *sự ít bị quyến rũ* theo nghĩa *ít
    bị quyến rũ*, nhưng ở `an6.114` `appicchatā` đứng đối xứng với `mahicchatā`
    nên phải là *không sơ hở*; tôi giữ cả hai vế đối xứng và **ghi lệch**.
