notes: |-
  Lát c55. Mệnh đề 0.1 đo lại: toàn tầng `sn` dùng “Saṁyutta” 1612/1612; “Saṡyutta”
  (s có dấu chấm dưới, viết sai) = 0. Dùng y hệt 1612 bản.

  Trùng nguyên văn Pāli TRONG LÁT: 25 nhóm, 71 khoá dính. Nhóm lớn nhất
  `Taṁ kissa hetu?` ×8; `“asu amutra upapanno…”` ×6 (đó là sn44.9, không phải bài
  này); `“Bhiyyo opammaṁ karohī”ti.` ×6 và `“Āma, bhante, jāyeyyā”ti.` ×4
  (mil3.3.5). Trong riêng sn35.231: 1.2/3.2/5.2/7.2/8.2/9.2/10.2/12.2 đều là
  `Taṁ kissa hetu?` ⇒ dùng lại nguyên văn một dạng “Vì sao vậy?” cho cả tám
  (tiền lệ đo được 284 lần trong tầng Việt). Tương tự 4.5/9.8 và 4.3/9.6.

  Trùng nguyên văn với tầng đã có (dùng lại y hệt, không dịch lại): 1.2/3.2/… ←
  an1.41:1.2 “Vì sao vậy?”; 4.3 ← an3.18:1.4 ““Dạ đúng vậy, bạch Thế Tôn.””;
  9.6 ← an3.76:2.2 ““Bạch Thế Tôn, không thể.””; 4.4/9.7 ← an3.100:4.5. Tổng cộng
  lát này có 112/281 khoá Pāli ≥12 ký tự khớp trùng nguyên văn với một tệp Việt đã
  có.

  Danh sách bốn cây: `sn46.39:1.3` đã dùng “Cây bồ-đề (assattha), cây đa (nigrodha),
  cây pilakkha, cây sung (udumbara)”. Ở đây danh sách lặp hai lần (4.1 và 9.4) nên tôi
  bỏ ngoặc Pāli, giữ “cây bồ-đề, cây đa, cây pilakkha hay cây sung” — cùng tên, ít
  nhiễu hơn. `khīrarukkha`/`khīra` = cây có mủ: grep tầng Việt = 0 tiền lệ ⇒ tôi đặt
  “cây có mủ” / “mủ” và ghi ở đây; người điều phối nên thống nhất với các bài ví dụ về
  cây khác.

  Thuật ngữ có số đếm: `pariyādiyanti` = “lấn át” (10 lần trong tầng Việt);
  `parittā` = “tầm thường” (20); `adhimattā` = “đáng kể” (10);
  `āpāthaṁ āgacchanti` = “đi vào tầm nhìn” (cụm “tầm nhìn” 13 lần, “tầm mắt” 4);
  `bhikkhuniyā` = “tỳ-kheo-ni” (280 lần; cụm đầy đủ “vị tỳ-kheo hay tỳ-kheo-ni nào”
  10 lần); `appahīno` = “chưa trừ bỏ”, `pahīno` = “đã trừ bỏ” (đối xứng, và
  “đã trừ bỏ” có 3 tiền lệ cùng nghĩa).

  Bất định đã ghi: `daho taruṇo komārako` (4.1) là ba tầng tính từ chồng nhau —
  non, trẻ, mới nhú — tôi nén thành “còn non trẻ”. `sukkho kolāpo terovassiko`
  (9.4) = khô, héo, già nua: grep cụm này = 0 tiền lệ trong tầng Việt, tôi dịch nghĩa
  đen và chọn “đã khô cạn, đã héo, đã già nua”.

  Dấu lược: 9 khoá có `…pe…` của Pāli (1.3, 2.1, 5.3, 6.1, 8.3, 9.1, 10.3, 11.1 và
  các khoá tiếp nối) — tôi giữ **đúng một** `…`, không mở rộng. Đã đối chiếu từng khoá
  bằng hàm `lược()` của `_hvi.py`: 0 lệch.

  Triangulation 9.4: Sujato phủ 23/23 khoá Pāli ≥40 ký tự (coverage 100%), tầng
  `vietnamese-current` vắng (đặc điểm snapshot, chỉ có Pháp Cú). Bốn bài ngay trong
  cùng phẩm Biển (sn35.228, sn35.230, sn35.233, sn46.39) đã dịch sẵn và cho tiền lệ về
  văn phong, nên đối chiếu có cả Pāli + Anh + bản Việt đã có.

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên
  tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ 41/41 khoá, không
  orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, ngoặc kép cân 9/9
  trên cả bài, không `(…)` đứng một mình, không Pāli lọt. Bốn lệnh `npm run validate`,
  `npm test`, `npm run check`, `npm run build` để coordinator chạy.