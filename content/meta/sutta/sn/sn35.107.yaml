notes: |-
  Dịch từ Pāli root đã ghim (manifest liệt kê sutta/sn/sn35/sn35.107_root-pli-ms.json và sutta/sn/sn35/sn35.107_translation-en-sujato.json). Tầng Anh CÓ và đã đo.
    Coverage đo được: 17/17 Pāli có nội dung có chữ Anh = 1.0000, trong đó 16 từ Sujato và 1 khoá (1.12) do lớp lấp english-project bù, lớp lấp đã published. Không cần entry reference-gaps.
    Lưu ý khi đếm: 1.3 và 2.11 dài đúng 39 ký tự sau khi bỏ khoảng trắng, nên dưới ngưỡng 40 và không tính vào coverage. Nếu tính nhầm ra 19/18 thì sẽ tưởng thiếu một khoá không có lý do.
    27/42 khoá có Pāli trùng NGUYÊN VĂN với một khoá đã dịch ở bài khác; dùng lại y nguyên 20/27, lệch 7.
    Nguồn tiền lệ chính là sn35.106 (bài cùng phẩm, cùng công thức, chỉ khác chủ thể: khổ thay cho thế giới). Dùng lại y nguyên 0.2, 1.1, 1.2, 1.4, 1.5, 1.11, 1.12, 1.13, 1.14, 1.15, 1.16, 1.20, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6, 2.7, 2.8, 2.9, 2.10, 2.12, 2.13, 2.14, 2.15, 2.18 và 2.19.
    Lệch 7 khoá, tất cả cùng một lý do: 1.8, 1.9, 1.10, 1.17, 1.18, 1.19 và 2.17 có một tiền lệ duy nhất ở sn12.52 dùng công thức do duyên X mà có Y, còn 20 khoá trùng cùng chuỗi trong chính bài này (đặc biệt 1.5, 1.14, 2.3, 2.13) đã dùng công thức Do X làm điều kiện, sinh khởi Y của sn35.106. Bản này bám công thức đã dùng 20 lần trong chính bài, đánh đổi với một tiền lệ ở bài khác.
    samudaya giữ là tập khởi. atthaṅgama dịch là sự chấm dứt, khác với sn35.106 dùng sự diệt mất; chọn sự chấm dứt để giữ rõ khác biệt với samudaya và vì tầng đã có tiền lệ sự chấm dứt cho atthaṅgama (nhiều bài kn). Nếu coordinator muốn thống nhất với sn35.106 thì cần sửa cả hai.
    2.11 là jivhañca paṭicca rase ca uppajjati …pe…, chủ ngữ bị nằm trong dấu lược, khác 1.12 vốn ghi rõ jivhāviññāṇaṁ. Bản dịa vì vậy dừng ở Nhân lưỡi và vị, sinh khởi … và không bịa thức của lưỡi vào chỗ bị lược.
    2.17 dùng uẩn khổ cho khớp 2.9 (có 3 tiền lệ cùng chuỗi nirodha); 2.17 có 5 tiền lệ nhưng chúng dùng khối khổ hoặc lệch (một tiền lệ thêm vế do diệt tận của danh và sắc không có trong Pāli), nên bám 2.9 cho nhất quán trong bài.
    Cấu trúc ngoặc kép bám đúng Pāli: mở một dấu kép ở 1.1 và đóng ở 2.18.
    Tầng vietnamese-current vắng ở commit đã ghim (chỉ có Pháp Cú), nên không có bản Thích Minh Châu để đối chiếu cho bài này.
    Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
