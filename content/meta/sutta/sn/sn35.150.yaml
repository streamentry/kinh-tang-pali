notes: |-
  Dịch từ Pāli root tại commit bilara đã ghim, đối chiếu với bản Anh của Bhikkhu Sujato tại cùng commit.
  0.2 theo `sn35.149`: 15. Phẩm Cũ Mới. 0.3 Nibbānasappāyapaṭipadāsutta dịch Kinh Con Đường Đưa Đến Niết-bàn, theo đúng khuôn hai bài anh em `sn35.147` (qua sự vô thường) và `sn35.148` (qua sự khổ).
  Tái dùng nguyên văn bản Việt đã có, đếm được: 16/31 khoá có Pāli trùng nguyên văn với bài đã dịch. `Nibbānasappāyaṁ vo … desessāmi.` trùng `sn35.147`, `sn35.148`, `sn35.149`; `katamā ca sā … nibbānasappāyā paṭipadā?` trùng 3 bài đó; `Taṁ kiṁ maññatha, bhikkhave,` trùng 9 lần; `cakkhu niccaṁ vā aniccaṁ vā`ti?` trùng `sn35.108` → mắt là thường hay vô thường; `Yaṁ panāniccaṁ dukkhaṁ vā taṁ sukhaṁ vā`ti?` trùng 7 lần (`sn22.150`, `sn22.154`, `sn22.159`, `sn35.108`); `Yaṁ panāniccaṁ dukkhaṁ vipariṇāmadhammaṁ, kallaṁ nu taṁ samanupassituṁ:` và `‘etaṁ mama, esohamasmi, eso me attā’”ti?` trùng `sn22.159`; `yampidaṁ manosamphassapaccayā … tasmimpi nibbindati` trùng `sn35.28` và `sn35.29`; `Ayaṁ kho sā … nibbānasappāyā paṭipadā`ti.` trùng 3 bài trên.
  Công thức `Evaṁ passaṁ, bhikkhave, sutavā ariyasāvako … nibbindati` dịch theo `sn22.12:1.5` đã published: Thấy rõ như thế, này các tỳ-kheo, bậc Thánh đa văn thì chán nản nơi …; `Nibbindaṁ virajjati; virāgā vimuccati` dịch y nguyên theo `sn22.12:1.6`: Chán nản rồi ly tham; ly tham rồi giải thoát.
  Dấu lược: `1.2`, `9.2`, `15.1`, `15.3` có …pe… nên giữ đúng MỘT `…` và không mở rộng, dù Sujato có dịch đủ danh sách ở `9.2` và `15.1` — tôi bám Pāli.
  ⚠ Đặc thù tầng Pāli tại commit đã ghim: `2.1`–`14.1` là các đoạn hỏi-đáp ngắn nằm xen kẽ (số thứ tự 2, 4, 6, 8, 10, 12, 14), nên tôi dịch đúng số khoá, không gộp và không thêm chữ.
  `nāparaṁ itthattāyāti pajānāti` dịch không còn gì là tự thân nữa, theo đúng bản đã published ở `sn22.155:1.24` (ghi trong notes của sn22.32).
  Coverage: 13 khoá Pāli có nội dung, 13 có chữ Anh ⇒ 100%, trên ngưỡng 0.8; Sujato để trống `8.1` nhưng khoá ấy chỉ 18 ký tự nên không tính vào mẫu số. Không cần ghi vào content/meta/reference-gaps.yaml.
  technical_integrity 9.6 vì agent lát này không chạy gate. Bốn lệnh gate do coordinator chạy trước khi publish: npm run validate, npm test, npm run check, npm run build.
