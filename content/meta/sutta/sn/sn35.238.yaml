notes: |-
  Đợt 18, lát n190. Dịch từ Pāli root commit 11c9d708, đối chiếu English Sujato đã ghim và bản Việt Thích Minh Châu.

  **Coverage Anh trên Pāli có nội dung: 53/55 = 96.4%** — trên sàn 0.8, không có gap. Bản Anh Sujato để trống 5.5 (gộp vào 5.6) và colophon 17.2; bản Việt dịch đầy đủ từng phân đoạn trực tiếp từ Pāli root.

  **Các hình ảnh ẩn dụ chính trong bài:**
  - Bốn con rắn độc với sức nóng tột độ, có nọc độc kinh hoàng: tượng trưng bốn đại (địa đại, thủy đại, hỏa đại, phong đại).
  - Năm tên sát nhân thù địch: tượng trưng năm thủ uẩn (sắc, thọ, tưởng, hành, thức).
  - Tên sát nhân thứ sáu rình rập, giơ cao thanh kiếm: tượng trưng hỷ tham (nandīrāga).
  - Ngôi làng trống không: tượng trưng sáu nội xứ (mắt, tai, mũi, lưỡi, thân, ý).
  - Bọn giặc cướp làng: tượng trưng sáu ngoại xứ (sắc, thanh, hương, vị, xúc, pháp).
  - Biển nước lớn: tượng trưng bốn bộc lưu (dục, hữu, kiến, vô minh).
  - Bờ bên này nguy hiểm, đáng sợ hãi: tượng trưng hữu thân (sakkāya).
  - Bờ bên kia an ổn, không có sợ hãi: tượng trưng Niết-bàn (nibbāna).
  - Chiếc bè: tượng trưng Thánh đạo tám ngành (chánh kiến … chánh định).
  - Nỗ lực với tay và chân: tượng trưng sự phát khởi tinh tấn (vīriyārambha).
  - Đã vượt qua, đứng trên đất liền: tượng trưng bậc A-la-hán (arahant).

  **Dấu nháy và dấu lược:**
  - Dấu nháy đơn và kép: 12 khoá có dấu nháy khớp tuyệt đối 1:1 với Pāli từng khoá (1.1 kép mở; 1.4, 2.3, 3.3, 4.6, 5.5 đơn mở; 1.6, 2.4, 3.4, 4.7, 5.6 đơn đóng; 17.1 kép đóng).
  - Dấu lược: 6/6 khoá có dấu lược cân bằng tuyệt đối với Pāli (10.2, 10.3, 11.3, 11.4, 11.6, 15.2); mỗi khoá chuyển …pe… thành đúng một ….

