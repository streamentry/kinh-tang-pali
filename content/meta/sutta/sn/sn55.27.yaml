notes: |-
  Đối chiếu: Pāli root + English Sujato + các bản song song trong kho. Tầng HT. Thích Minh Châu không có cho SN.
  Số khoá: 56/56; mọi "…" của Pāli (8.4, 9.2, 10.2, 11.1, 12.4, 12.5, 12.7) giữ nguyên.
  Cặp Pāli trùng nguyên văn tái dùng: 1.2 = mn143:2.1; 1.3 = mn143:2.2; 1.4 = sn47.29:1.4; 1.5-1.8 = mn143:2.4-2.5/sn47.29:1.5-1.8 (Pāli trùng, tên người trùng); 2.1 = sn47.29:1.9; 2.6 = mn88:6.1/sn47.29:1.13; 3.2 = sn47.29:2.2; 3.3 = sn47.29:2.3 (= sn55.3:2.3); 8.4/12.4 = sn55.33:1.4 (= sn55.19:2.2, sn55.42:1.4 — chọn sn55.33, cấu trúc "hoti—" + công thức khớp); 9.2 = sn55.31:2.2; 10.2/12.7 = sn55.31:3.2; 11.1 = sn55.19:2.6 (cùng cụm "ariyakantehi sīlehi… samādhisaṁvattanikehi"); 12.9 = mn127:18.2; 12.10 = sn55.39:3.8 ("Sotāpattiphalaṁ tayā … byākatan"ti."). Tổng: 25/56 segment có segment Pāli trùng đã dịch; các cặp lặp trong bài (4.1 = 7.3; 8.1 = 11.3; 4.4 = 5.2 = 6.2 = 7.2; 8.5 = 9.3 = 10.3 = 11.2; 8.4 = 12.4; 10.2 = 12.7) dịch khớp từng cặp.
  Tiêu đề: :0.2 "Saraṇānivagga" -> "3. Phẩm Quy Y" (sn55.21/22/28/29); :0.3 "Dutiyaanāthapiṇḍikasutta" -> "Kinh Anāthapiṇḍika Thứ Hai" (mẫu "DutiyaX" -> "… Thứ Hai": 88 chỗ, vd "Kinh Sukkā Thứ Hai"; "Lần Hai" chỉ 2 chỗ); 12.11 "Sattamaṁ." -> "Thứ bảy."; 1.1 "Sāvatthinidānaṁ." -> "Tại Sāvatthī." (sn31.x).
  Thuật ngữ: aveccappasāda -> "tịnh tín bất động" (49 chỗ, sn55.19:2.1); appasāda -> "tâm không tịnh tín" (phản nghĩa trong cùng họ từ); ariyakanta sīla -> "các giới được bậc Thánh yêu mến, không bị sứt mẻ … đưa đến định" (sn55.19:2.6); "gihisāmīcikāni sikkhāpadāni" -> "những học pháp thích hợp cho người tại gia"; uttāsa/chambhitattaṁ/samparāyikaṁ maraṇabhayaṁ -> "sự sợ hãi / sự kinh hoàng / nỗi sợ chết thời vị lai" (không có tiền lệ đã dịch cho công thức này — dịch từ Pāli theo dùng ngữ HTMC "thời vị lai"); "Dự lưu" (115 chỗ, sn55.39) so "nhập lưu" (112) — chọn sn55.39 vì cùng công thức.
  Hai chỗ bất đồng tham khảo đã phân xử và ghi: (1) 1.5/2.2 — mn143:2.4/2.7 (Pāli trùng) dịch "bhante" là "Bạch Thế Tôn" dù người nghe là Tôn giả; sn47.29:1.5/1.10 cùng tình huống (báo cho Tôn giả) dùng "Bạch thầy" — chọn "Bạch thầy" theo ngữ cảnh, giữ cách nói bệnh của mn143; (2) kết "…'ti." — một số tiền lệ bỏ "ti" (sn55.3:2.3, sn47.29:1.8), một số giữ (sn47.29:1.12, 4.8) — thống nhất giữ "ti" khi Pāli có "ti".
