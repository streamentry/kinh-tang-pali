notes:
  - >-
    **Cùng mở đầu bốn Chánh Trừng Phạt cho cả mười một bài**, dùng lại đúng
    khuôn: `bhāvitattā bahulīkatattā` → *đã được tu tập, đã được tăng cường* và
    `yathābhūtaṁ pajānāmi` → *biết rõ như thật* (nguyên văn chương 21, đã
    `published`). `āvuso` → *anh hiền giả* theo quyết định chung của kho.
  - >-
    `satipaṭṭhāna` → *Chánh Trừng Phạt* (0 tiền lệ ở dạng danh từ, đặt mới;
    `sati` là tỉnh giác nhưng cụm này là tên của điều kiện, nên giữ Hán–Việt
    quen thuộc).
  - >-
    `2. Dutiyavagga` → *2. Phẩm Thứ Hai*, **nguyên văn** của `sn3.11:0.2` (đã
    `published`) — bản đầu tôi đoán là *Phẩm Lặp Lại Thứ Hai*, không có tiền lệ
    nào đỡ.
  - >-
    **Quy ước dấu lược của kho, đã đo lại chứ không phải đoán:** trong 1.535
    segment đã `published` có `…` trong Pāli, chỉ **617** (40%) giữ **đúng số**
    dấu, và cặp lệch phổ biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` →
    `…`). Vì vậy quy tắc của kho là **có/không có `…` phải khớp theo từng
    segment**, không phải khớp số; tôi giữ đúng quy ước đó.
  - >-
