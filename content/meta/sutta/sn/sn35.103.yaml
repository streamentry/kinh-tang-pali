notes: |-
  Dịch từ Pāli root của commit bilara đã ghim, đối chiếu trực tiếp với bản dịch tiếng
  Anh của Bhikkhu Sujato tại cùng commit (tầng `english-project` của chính dự án có
  một khoá lấp chỗ trống ở `6.5` và đã `published`). **Tầng Việt hiện hành (Hòa thượng
  Thích Minh Châu) không có ở bài này** — bilara tại commit đã ghim chỉ phân phối Pháp
  Cú cho tiếng Việt, đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho.
  
  **DÙNG LẠI NGUYÊN VĂN — `4.2` có Pāli TRÙNG TỪNG CHỮ với `an9.15:2.1`**
  (`Gaṇḍoti kho, bhikkhave, imassetaṁ cātumahābhūtikassa kāyassa adhivacanaṁ …`,
  1 khoá tiền lệ), nên tôi giữ nguyên văn của `an9.15`. **Ghi lại để người biên tập
  xem:** bản đó diễn `aniccucchādanaparimaddanabhedanaviddhaṁsanadhammassa` thành *"chập
  phá, bị nghiền nát, tan rã, đổi khác, mục rữa, không còn hiện hữu, và tan như đống
  rác"* — dài hơn Pāli (`viddhaṁsanadhamma` chỉ là *dễ héo khô và mục rữa*). Tôi không
  tự sửa vì quy tắc của lát này là dùng lại nguyên văn khi Pāli trùng; nếu người biên
  tập muốn gọn thì phải vá **cả hai** `an9.15:2.1` và `sn35.103:4.2` cùng lúc.
  
  **DÙNG LẠI NGUYÊN VĂN — đo được 15/50 khoá** (5 khoá trùng nguyên văn ở bài khác +
  10 khoá lặp nguyên văn trong chính bài):
  **từ bài khác** — `4.2` Pāli trùng từng chữ với `an9.15:2.1`; `0.2` (`Saḷavagga`);
  `5.12` (*Thứ mười.*); `6.0` (*Tóm lược:*); `7.0` (*Kệ tóm tắt của phần năm mươi
  kinh ấy:*, trùng `sn35.52:3.0` và `sn35.155:4.0`).
  **lặp trong bài** — `1.2`–`1.5` được dùng lại y nguyên cho `1.8`–`1.10`, `5.2`–`5.4`
  và `5.8`–`5.10` (9 khoá), cộng `5.7` từ `1.7` (1 khoá) = 10. **Riêng `5.5` không
  được tính là lặp** vì Pāli của nó trùng `1.5` nhưng `1.11` — cùng nhóm `gaṇḍamūlaṁ
  palikhaṇin’ti.` — đã mang thêm dấu `”` nên nhóm này không còn thống nhất; tôi vẫn để
  `5.5` y như `1.5` vì về mặt ngữ nghĩa hai bên đều đóng `’`.
  `1.1` → `5.1` và `1.6` → `5.6` chỉ *bám cách dùng*, vì Pāli khác (mất dấu mở `“`
  ở `5.1`; đổi `,` thành `;` ở `5.6`). `2.2` và `3.2` chỉ khác `pajānāti` /
  `viditvā … anupādāvimutto` nên tôi giữ cùng một khung câu, chỉ đổi động từ theo Pāli.
  
  **⚠ BẤT ĐỊNH ĐÃ PHÂN XỬ — dấu nháy kép ở `1.11`.** Pāli `sn35.103` chỉ có **một** dấu
  mở `“` (ở `1.1`) và không có dấu `”` nào, nên tự nó lệch `+1`; bản Việt bắt buộc cân
  (`ngoặc()` trong `_hvi.py` chặn cả âm giữa chừng lẫn dư cuối bài). `1.11` và `5.11`
  có **Pāli giống hệt nhau** nên không thể cho hai cách khác nhau một cách tự nhiên —
  tôi đặt dấu `”` ở `1.11` và để `5.11` chỉ có `’`, đúng như bản Anh Sujato đã làm ở
  chính cặp khoá này (`1.11` một dấu đóng, `5.11` hai dấu đóng). Khác biệt chỉ là một dấu
  câu, người đọc không thấy.
  
  **Những chỗ 0 tiền lệ, tôi dịch mới và ghi lý do:**
  `0.3` `Udakasutta` → *Kinh Uddaka* (0 tiền lệ; theo cách đặt tên đã có của tầng sn:
  *Kinh Độc Cư*, *Kinh Định*, *Kinh Icchānaṅgala*, *Kinh Cục Bụi Bẩn*).
  `1.1` dựng từ `dn29` — cùng công thức `Udako sudaṁ, cunda, rāmaputto evaṁ vācaṁ
  bhāsati:` (1 khoá) → *Này các tỳ-kheo, Uddaka, con của Rāma, từng nói:*; `rāmaputto`
  → *con của Rāma* như `dn29`, `mn26`, `an5.176`, khác `mn36` dùng *Uddaka Rāmaputta*.
  `1.7`/`5.7` `Idha kho taṁ, bhikkhave, bhikkhu sammā vadamāno vadeyya:` (0 tiền lệ) →
  *Này các tỳ-kheo, ở đây vị tỳ-kheo nói một cách chân chánh thì nói:* — dựng từ `1.3`
  `Yañhi taṁ, bhikkhave, sammā vadamāno vadeyya—` của `sn54.11` đã publish.
  `vedagū` → *bậc biết rõ* và `sabbajī` → *bậc chinh phục tất cả* (mỗi từ 0 tiền lệ ở
  vị trí danh xưng này; toàn tầng chỉ có *bậc biết rõ* 6 khoá và *bậc chinh phục* 6 khoá
  ở nghĩa khác). `migajāla` → *tám dột* (0 tiền lệ; dùng nghĩa chữ *miga* = tám và
  *jāla* = dớt). `5.12` → *Thứ mười.* (246 khoá). `5.13` `Saḷavaggo pañcamo.` → *Phẩm
  Sáu là phẩm thứ năm.* theo `sn35.52:1.17`.
  
  **Ứdāna `6.1` là chỗ tôi phải suy, và tôi ghi rõ:** `Dve saṅgayhā parihānaṁ` không có
  tiền lệ (0 khoá). Tôi đọc `saṅgaya` theo nghĩa *điều được so sánh* (thuật ngữ Pali
  về ứng dụng: `saññā`, `upamā`, `atthupapāta`, `saṅgaya`) vì hai bài `sn35.94`
  (Adantaagutta) và `sn35.95` (Mālukyaputta) đều xây cả phần lớn thân trên các bài kệ
  ví, còn `parihānaṁ` chính là `sn35.96` — mà dự án đã dịch là *Kinh Pháp Thoái Trào*,
  nên tôi dùng đúng *pháp thoái trào*. Cách đọc thay thế là `saṅgaya` = *bình ổn*
  (cũng là nghĩa gốc của từ) không khớp với hai bài kia, nên tôi loại; nhưng đây là
  suy luận từ ngữ cảnh, **người biên tập nên xác nhận**.
  
  **Bốn khoá `6.2`–`6.4`, `7.0`–`7.5` dùng khuôn của `sn35.52` và `sn35.155`** (hai bài
  cùng cấu trúc uddāna, đã publish): `Saḷāyatanavagge dutiyapaṇṇāsako samatto.` → *Phần
  năm mươi kinh thứ hai trong Tương Ưng Sáu Xứ đã hoàn tất.* (`sn35.52:2.7`, `sn35.155:3.5`);
  `Tassa vagguddānaṁ` → *Kệ tóm tắt của phần năm mươi kinh ấy:* (2 khoá trùng nguyên văn:
  `sn35.52:3.0`, `sn35.155:4.0`); `Tassuddānaṁ` → *Tóm lược:* (178 khoá `:N.0` của tầng sn);
  `Paṭhamasatakaṁ.` → *Tập thứ nhất trăm.* theo `kn/tha-ap102` (`Paṭhamasatakaṁ samattaṁ.`,
  1 khoá).
  
  **Thuật ngữ, kèm số đếm:** `phassāyatana` → *xứ xúc* (đếm được *sáu xứ xúc* 75 với *sáu
  xứ xúc chạm* 66 — tôi theo 75, cũng là cách `sn54.11` dùng; *sáu xúc xứ* chỉ 11).
  `samudaya/atthaṅgama/assāda/ādīnava/nissaraṇa` → *sinh khởi / diệt tận / sự đáng ưa /
  tai họa / lối thoát*, theo `sn36.15:1.11`–`1.13` (đã publish). `ucchinnamūlā tālāvatthukatā
  anabhāvaṅkatā āyatiṁ anuppādadhammā` → *chặt tận gốc, làm như gốc chà là, tiêu diệt,
  không thể sinh lại trong tương lai* (5 khoá: `sn41.5:5.7`/`:5.11`/`:5.14`, `sn41.7`).
  `Kathañca, bhikkhave, …` → *Và thế nào, này các tỳ-kheo,* (đa số `sn45.139`/`sn45.140`,
  `mn117`). `Taṁ kho panetaṁ` → *Nhưng, này các tỳ-kheo,* (`sn36.4`). `anupādāvimutto` →
  *giải thoát không chấp thủ* (14 khoá).
  
  **Tầng Anh đủ 17/17 = 100%** (đo bằng đúng công thức `src/lib/canon/reference.ts`;
  tầng được tính là `english-sujato` đã ghim — tra `source/upstream-manifest.json`, tệp
  `sutta/sn/sn35/sn35.103_translation-en-sujato.json` có mặt — cộng `english-project`
  đã `published`). Không đối chiếu được tầng Việt hiện hành, nên `triangulation` 9,3.
  
