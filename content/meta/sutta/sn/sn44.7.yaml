notes: |-
  Đợt 19, lát l24. Dịch từ Pāli root ở commit đã ghim, đối chiếu English Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục tra cứu toàn văn (không căn lề được vào segment, chỉ dùng để đọc ý và so thuật ngữ; không cấp text cho tầng nào). Tầng Việt hiện hành phân đoạn (phantuananh) chỉ có Pháp Cú tại commit đã ghim, nên không có tầng Việt phân đoạn cho bài này.

  COVERAGE TẦNG ANH (đo thật): mẫu số 59 khoá Pāli có nội dung (>= 40 ký tự sau khi nén khoảng trắng, bỏ khối tham chiếu :0), Sujato có chữ ở 31 khoá, 31/59 = 0,525, DƯỚI ngưỡng 0,80. Sujato có chữ ở: 1.1, 1.2, 2.1, 2.4, 2.7, 2.10, 2.13, 2.16, 2.19, 2.22, 2.25, 2.28, 2.29, 3.1, 3.3, 4.1 đến 4.4, 4.7 đến 4.10, 5.1, 5.2, 8.1 đến 8.6. Ông dịch lượt hỏi đáp với Tôn giả Mahāmoggallāna, rồi tóm toàn bộ lượt thứ hai với Đức Thế Tôn (5.3 đến 7.11) trong một câu ở 5.2 (he asked the Buddha the same questions, and received the same answers), và chỉ dịch lại lời cảm thán ở 8.1 đến 8.6. Vì vậy 5.2 được đếm là có chữ nhưng thực tế chỉ phủ phần dẫn nhập; độ phủ độc lập thật là 30/59 = 0,508. Các khoá Sujato bỏ trống trên Pāli có nội dung (28 khoá): 2.5, 2.11, 2.17, 2.23, 2.27, 2.30, 3.2, 3.4, 4.6, 4.12, 5.3, 5.4, 5.5, 5.7, 6.1, 6.3, 6.4, 6.6, 7.1, 7.2, 7.3, 7.4, 7.6, 7.7, 7.8, 7.9, 7.10, 7.11. Chưa có lớp english-project cho bài này. Theo luật cổng: coverage dưới 0,80 thì status draft kèm blocker, triangulation không quá 8,0 (đặt 7,0), và entry trong reference-gaps không cứu được published. Điểm trung bình thô là 9,17 nhưng blocker thắng điểm. Bài chỉ nâng lên được khi lớp english-project lấp các khoá trên và được published để coverage tính lại (hoặc người biên tập quyết định khác về cổng).

  Cấu trúc bài: Vacchagotta hỏi Tôn giả Mahāmoggallāna mười câu (2), hỏi nhân duyên (3), được giải thích bằng công thức sáu căn viết lược (4); rồi lặp lại với Đức Thế Tôn, lần này Pāli viết lược hơn (5 đến 7); cuối cùng là lời cảm thán (8). Câu hỏi nhân duyên 3.2 và 3.4 và danh sách 7.11 trong Pāli là chuỗi mười luận điểm viết liền; bài này giữ đúng ranh giới khoá, không đưa nháy vào khoá mà Pāli không có nháy (3.2, 3.4, 4.5, 4.6, 4.11, 4.12).

  Pāli trùng nguyên văn TRONG CHÍNH bài: 10 nhóm ([2.2, 2.8, 2.14, 2.20, 2.26], [2.5, 2.11, 2.17, 2.23, 2.29], [2.30, 5.7], [4.1, 7.1], [4.2, 7.2], [4.3, 7.3], [4.7, 7.7], [4.8, 7.8], [4.9, 7.9], [6.2, 7.5]), bản Việt dùng đúng một cách dịch cho mỗi nhóm, 0 nhóm lệch. Số cặp Pāli trùng với bài khác trong tầng đã dò: 28 chuỗi; 23 chuỗi dùng lại NGUYÊN VĂN bản Việt của nơi gốc (đa số từ sn44.8 và sn44.11: 1.2, 2.2, 2.5, 2.21, 2.24, 2.27, 2.30, 5.3, 5.4, 5.6, 5.7, 6.2, 6.3, 6.5, 6.6, 7.4, 7.6, 7.10, 7.11, 8.2, 8.6, 0.2, 8.7), 5 chuỗi khác có chủ ý: 4.5 (tiền lệ nằm trong công thức khác), 4.8 và 4.9 (mn148 dịch xem lưỡi và xem ý với đây và ta; bài này theo cặp cái này và tôi), 8.1 và 8.5 (tiền lệ trong tầng lệch nhau, không có đa số).

  Thuật ngữ, kèm số đếm toàn tầng Việt:
  - samanupassanti trong công thức X ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassanti: dịch xem X: ‘...’, theo tiền lệ cùng cấu trúc ở mn148 (xem lưỡi, xem ý), thay vì thấy hay quán. Cấu trúc này khác công thức rūpaṁ attato samanupassati của sn44.8 (thấy sắc là tự ngã), nên không bắt buộc đồng bộ.
  - Công thức etaṁ mama, esohamasmi, eso me attā → Cái này là của tôi, tôi là cái này, cái này là ngã của tôi: đếm cả tầng, cái này kèm của tôi là 167 (112 phủ định, 55 khẳng định) so với đây kèm của ta là 92; riêng sn là 124 so với 23. Ngã (173) thắng tự ngã (90) cho riêng công thức này; riêng sn khẳng định thì tự ngã 35 so với ngã 18 còn phủ định thì ngã 80 so với tự ngã 14, tức hai chiều trái nhau. Chọn ngã cho cả hai chiều để bài không tự mâu thuẫn. LỆCH CÓ Ý với sn44.8 (cùng phẩm) vốn dùng tự ngã cho công thức attato, và lệch với bản Hòa thượng Thích Minh Châu (tự ngã); người biên tập nên thống nhất cho phẩm.
  - cakkhu, jivhā, mano → mắt, lưỡi, ý. Giữ đúng ba căn Pāli viết ra; ba căn còn lại (tai, mũi, thân) nằm trong dấu lược nên không được bung ra, vì Pāli root chỉ có cakkhuṁ …pe… jivhaṁ …pe… manaṁ; Sujato bung đủ sáu căn nhưng đó là diễn giải của bản Anh, không phải của root.
  - tathāgato paraṁ maraṇā → Như Lai ... sau khi chết, phi tồn tại phi phi tồn tại (168 khoá toàn tầng theo quy ước nevasaññānāsaññā; cùng phẩm sn44.4, sn44.6, sn44.8, sn44.11).
  - taṁ jīvaṁ taṁ sarīraṁ / aññaṁ jīvaṁ aññaṁ sarīraṁ → linh hồn là thân / linh hồn khác, thân khác. Đếm trên các khoá Pāli có jīvaṁ: sn linh hồn 19 · mạng 9 · thân xác 3; mn mạng 28; dn sinh mệnh 26 · linh hồn 13. Chọn linh hồn theo sn33.1, sn44.8 và đa số sn. Bản Hòa thượng Thích Minh Châu dùng sinh mạng và thân thể; ghi bất định: jīva cũng có thể hiểu là mạng, sinh mạng.
  - asassato → không thường còn (không dùng vô thường để khỏi lẫn với anicca), antavā → có biên, anantavā → vô biên.
  - abyākataṁ bhagavatā → không được Thế Tôn tuyên thuyết (sn44.8, sn44.11); mayā → không được Ta tuyên thuyết (sn44.8).
  - bho moggallāna, bho gotama → thưa Tôn giả Moggallāna, thưa Tôn giả Gotama (sn44.8). aññatitthiya paribbājaka → du sĩ ngoại đạo. hetu, paccayo → nhân, duyên.
  - Acchariyaṁ abbhutaṁ → Thật kỳ diệu ... Thật hy hữu (sn44.8); tiền lệ toàn tầng không có đa số cho cặp này. aggapadasmiṁ → ở điểm tối thượng (sn44.8); Sujato dịch the chief matter, Hòa thượng Thích Minh Châu dịch tối thượng văn cú, an11.7 dịch đệ nhất cú.
  - Sattamaṁ. → Thứ bảy. (271 khoá). Abyākatavagga → 1. Phẩm Không Tuyên Bố (8 nơi). Moggallānasutta → Kinh Moggallāna (sn51.31, sn8.10).

  Bất định đã ghi (không thêm vào thân kinh):
  1. -tipi ở 3.4, 4.11, 6.5, 6.6, 7.11: hậu tố là cũng, dù là; bản Việt dùng hay để nối chuỗi luận điểm sau không trả lời như sau, theo sn44.8 và sn44.4; không dịch từng chữ cũng vì sẽ thành A cũng không, đảo cấu trúc. Nghĩa phủ định bao quát được giữ.
  2. 3.2 và 3.4: Pāli viết chuỗi mười luận điểm liền, không nháy, nên Việt cũng không nháy; 3.2 dùng hoặc, 3.4 dùng hay vì nằm sau câu phủ định.
  3. 8.3 idānāhaṁ: vừa rồi hay bây giờ; chọn vừa rồi vì Vacchagotta vừa rời chỗ Tôn giả Mahāmoggallāna ở 5.1.
  4. 5.4 và các chỗ …pe…: Pāli root viết lược, bản Việt giữ đúng một dấu lược, không bung; chuỗi mười luận điểm đủ chỉ có ở 3.2, 3.4 và 7.11.
  5. Tên người nói: Pāli 1.1 và 8.3 có mahā (Mahāmoggallāna), còn bho moggallāna trong lời Vacchagotta không có mahā; bản Việt giữ đúng.

  Số Pāli: bài không có con số cần tính; mười luận điểm ở 3.2, 3.4, 7.11 đếm đủ 10 mục (4 về thế giới, 2 về linh hồn và thân, 4 về Như Lai).

  Dấu lược: 14 khoá Pāli có …pe…, cả 14 khoá Việt giữ đúng MỘT dấu lược; không khoá nào bung …pe… thành văn; không khoá nào thêm dấu lược Pāli không có; 5.4 kết ….  theo Pāli kết …pe…., đúng đa số toàn tầng. Pāli bài này không có (…) trần ở khoá nào nên không phải giữ (…). Ngoặc: nháy đơn và ngoặc kép khớp Pāli từng khoá 82/82 (0 lệch); chỗ ngoặc kép mở ở 4.1, 5.4, 7.1 và các khoá khác không đóng trong cùng khoá là theo đúng Pāli. NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang Việt ngoài tiêu đề 0.1.

  Lượt review đối kháng: đọc lại cặp Pāli và Việt cả 82 khoá; không thấy khoá nào lệch nội dung (khoá 2.x đủ mười cặp hỏi và đáp, đúng thứ tự). Không có câu Pāli nào nghĩa đen mâu thuẫn văn cảnh.

  technical_integrity 9,6, KHÔNG tuyên bố technical gate pass: lát này bị cấm chạy npm run validate, npm test, npm run check, npm run build; bốn lệnh đó để người điều phối chạy.
