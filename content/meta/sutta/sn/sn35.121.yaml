notes: |-
  Dịch từ Pāli root của SuttaCentral/Bilara (commit pin 11c9d708), đối chiếu bản Anh của Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (Bình Anson hiệu đính; chỉ để tra thuật ngữ, không cấp văn bản cho bản dịch — tại commit ghim tầng Việt hiện hành phân đoạn chỉ có Pháp Cú). Bài song song `mn147` (Cūḷarāhulovāda) có cùng khung và cùng cụm Pāli ở 1.2–1.4, 1.7–1.9, 2.1–2.5, 3.1–3.2, 53.3; bản Việt dùng lại cách dịch đã published của `mn147` cho các khoá Pāli trùng nguyên văn.

  Coverage English: Sujato phủ 37/41 đoạn Pāli có nội dung (≥ 40 ký tự, bỏ khối :0) = 90,2%, TRÊN ngưỡng 0,8. Bốn đoạn Sujato để trống là 27.1, 29.1, 31.1, 31.2 (các vế lặp của chuỗi lưỡi); lớp english-project của dự án đã lấp bốn đoạn này và đã published, nên cổng tính 41/41, nhưng phần đó không phải bản đọc Anh độc lập — độ phủ độc lập chỉ là 37/41 và `triangulation` đặt 9,0 vì thế. Cả bốn đoạn đều có Pāli trùng nguyên văn với đoạn đã có bản Sujato ở chính bài (15.1/5.1/7.1/7.2…), nên nghĩa không phụ thuộc vào ô trống.

  Cấu trúc và chỗ cần lưu ý:
  - 0.3: `Rāhulovādasutta` → "Kinh Giáo Giới Rāhula" theo `mn61`, `mn62` ("Giáo Giới Rāhula", 2 bài); `mn147` dùng "Giáo Hóa" (1 bài) — không theo. 0.2: `Lokakāmaguṇavagga` → "12. Phẩm Dục Thuộc Thế Gian" (tên phẩm này có 7 khoá tiền lệ trong tầng, như `sn35.118`, `sn35.122`).
  - Pāli đọc đủ mắt → sắc → thức mắt → xúc mắt → cái do duyên xúc mắt, rồi thẳng sang lưỡi (21.x–32.x) và thẳng sang ý (33.x–50.x); tai, mũi, thân không được viết ra (Sujato mở rộng thành "ear … nose … tongue … body" nhưng để trống các khoá đó). Bản Việt chỉ dịch điều Pāli có, không tự thêm tai, mũi, thân. 51.1 lược sang 51.2 (lưỡi) bằng `…pe…`, 51.2 lược sang 52.1 (ý) bằng `…pe….`; Việt giữ đúng mỗi chỗ một `…`, 51.2 kết ` ….` theo Pāli `…pe….`.
  - Mười một khoá `…pe….` (10.1, 12.1, 14.1, 20.1, 22.1, 24.1, 26.1, 32.1, 40.1, 42.1, 44.1) đều kết ` ….` (dạng đa số của tầng); tầng sn35 gần đó có xen ` …` không chấm — đo thấy gần cân bằng (sn: 119 không chấm, 108 ` ….`), chọn ` ….` theo luật chung và giữ nhất quán trong bài.
  - Gọi tên: "thức mắt", "xúc mắt", "thức lưỡi", "xúc lưỡi", "thức ý", "xúc ý" theo `mn147` và `sn35.29`/`sn35.235`; "Các sắc", "Các pháp" theo `sn35.86`, `mn147`.
  - 15.1/27.1/45.1: `Yampidaṁ … vedanāgataṁ saññāgataṁ saṅkhāragataṁ viññāṇagataṁ` → "cái gì do duyên xúc … khởi lên thuộc về thọ, thuộc về tưởng, thuộc về các hành, thuộc về thức — cái đó là thường hay vô thường?" dùng lại cách dịch `mn147:3.26`, `mn147:4-8.38`.
  - 3.1 `Taṁ kiṁ maññasi, rāhula` → "Ông nghĩ sao, này Rāhula" (6 khoá `mn147`); `sn18` dùng "Ngươi nghĩ thế nào, Rāhula" (3) và "Bạch Rāhula, ngươi…" (7) — không theo vì cùng một câu chuyện với `mn147`.
  - 4.1 `Aniccaṁ, bhante` → "Vô thường, bạch Thế Tôn" kết dấu chấm NGOÀI nháy (39 khoá, `sn18.1`, `sn35.86`; `mn147` để chấm trong nháy — 9 khoá); 5.1 → "Cái gì vô thường, là khổ hay là lạc?" (25 khoá); 6.1 → "Khổ, bạch Thế Tôn" (29); 7.1 → "Cái gì vô thường, khổ, có tính biến đổi, có nên xem như vầy:" (20); 7.2 → "đây là của ta, ta là cái này, đây là ngã của ta' không?" (26, `mn146`/`mn147`).
  - 8.1, 38.1, 50.1 `No hetaṁ, bhante` → "Thưa không phải vậy, bạch Thế Tôn" (57 khoá, nhiều hơn "Bạch Thế Tôn, không" 56 và "Không, bạch Thế Tôn" 28); với `…pe…` (20.1, 32.1) dùng cùng cách dịch cho nhất quán trong bài (`sn35.86:15.1` đã có đúng dạng này); `sn35.105` ghi "Thưa không" cho hai khoá lược — lệch, không theo. 8.1 giữ nguyên `(…)` trần của tầng Pāli ghim.
  - 37.1: Pāli thiếu dấu hai chấm sau `samanupassituṁ` (các khoá anh em 7.1, 19.1, 31.1, 49.1 đều có `:`); bản Việt vẫn kết bằng dấu hai chấm để câu nối được sang 37.2 — đây là khác biệt dấu câu của Pāli, không phải khác biệt nghĩa.
  - `nibbindati` → "chán nản" (tầng: 56 khoá "chán nản" so với 51 "nhàm chán"; trong `sn35`: 29 so với 13; câu 52.2 có 11 khoá Pāli y hệt và 7 khoá khác chỗ ngắt câu, cả 18 dùng "Chán nản rồi ly tham; ly tham rồi giải thoát; đã giải thoát thì có sự biết rõ là đã giải thoát"); `mn147` và `sn35.105` dùng "nhàm chán" — không theo vì `52.2` buộc dùng "chán nản", và một bài không nên trộn hai từ. Hậu tố `-pi` của `cakkhusmimpi`, `rūpesupi`… không dịch riêng (theo `sn35.105`, `sn35.29`, `mn147`).
  - 52.3: `nāparaṁ itthattāyā` → "không còn trở lại trạng thái này nữa" theo `sn35.105`, `mn147` và bản Thích Minh Châu; tầng còn có "không còn gì là tự thân nữa" (11 khoá, `sn18.1`, `sn35.1`, `sn22.46`) — khó bảo vệ trước Pāli nên không theo. Nháy đơn mở ở 52.3, nháy kép mở ở 51.1 và đóng ở 52.3, khớp Pāli từng khoá.
  - 53.3: `veyyākaraṇasmiṁ` → "bài pháp" theo `sn35.74`, `sn35.75` (`mn147` dùng "bài phân giải") — tầng còn có "pháp thoại", "bài kinh", "lời giảng giải" (mỗi dạng 1 khoá): chưa có quy ước thống nhất, đã ghi lại để người biên tập quyết.
  - 53.4: Pāli `Anekānañca devatāsahassānaṁ` (không có `tāsaṁ` như `mn147`) → "nhiều ngàn chư thiên" (không thêm "ấy"). 53.5 dùng lại nguyên văn `sn35.74:21.4`, `dn3:2.21.7` (4 khoá).
  - 1.1 theo 16 khoá; 1.2 theo `mn147:1.3` (Pāli trùng byte); 1.5/1.6 đắp y, cầm bát và y (38 khoá), "nghỉ trưa" cho `divāvihārāya` (7 khoá, `mn147:1.9`; "nghỉ ban ngày" 5, "an trú ban ngày" 3), "rừng Andha" theo `mn147`, `mn23`, `mn24` (`sn5.*` dùng "Andhavana").
  - 1.5 kết không có dấu câu trong Pāli (`caritvā`) và 1.6 nối tiếp; Việt kết 1.5 bằng dấu phẩy và mở 1.6 bằng chữ thường.
  - 2.1 `anekāni devatāsahassāni` → "nhiều ngàn chư thiên" (`mn147:2.1`): không có con số cụ thể, không có phép tính. Số duy nhất là thứ tự `Aṭṭhamaṁ` = "Thứ tám" (235 khoá).
  - Không có đoạn Pāli nghĩa đen mâu thuẫn ngữ cảnh. Điểm chưa chắc duy nhất là 53.2: Pāli kết `abhinandi.` không có `ti` như `mn147:9.10` (`abhinandīti`) — Việt đồng nhất với cách dịch tầng ("hoan hỷ và tán đồng lời Đức Phật dạy", 2 khoá Pāli y hệt hình thức này).

  Tự kiểm: tập khoá Việt = tập khoá Pāli (82/82, đúng thứ tự); nháy đơn và nháy kép khớp Pāli ở 82/82 khoá; 26 cặp Pāli trùng nguyên văn trong chính bài thì bản Việt trùng đủ 26/26; dấu lược cân bằng Pāli ở 82/82 khoá; NFC, không khoá rỗng, không Pāli lọt sang Việt ngoài tên riêng. Đối chiếu với tầng: các khoá Pāli trùng với bài khác (chủ yếu `mn147`) dùng lại nguyên văn khi trùng bối cảnh; chỗ khác đều có lý do ở trên.

