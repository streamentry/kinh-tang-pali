    phép tra cụm từ, nên đây là chỗ người điều phối nên gộp nếu có bài khác chứa
    cùng cụm.
  - >-
    **Kệ `tassuddānaṁ` — bất định đã ghi nhận, không bịa.** `Palokasuññā
    saṅkhittaṁ, / channo puṇṇo ca bāhiyo; / Ejena ca duve vuttā, / dvayehi apare
    duveti.` Số bài của phẩm là 10 (`sn35.84`–`sn35.93`); kệ nêu 6 tên, rồi nói
    một bài ấy chứa hai bài, rồi hai bài kia thành đôi — cộng lại không tròn
    vòng. Tôi dịch theo nghĩa văn phục và đúng trạng thái lịch sử, không điền
    số: *Bài ấy đã nói ra hai bài, / còn hai bài kia thì thành đôi.* Đã đối
    chiếu để giữ đúng: `sn35.89` (`Bāhiyasutta`, 33 khoá) là bài duy nhất trong
    phẩm nói cả hai vị trí mắt và tâm, nên câu *bài ấy* khớp Bāhiya. `Suññā` và
    `Saṅkhitta` là tắt tên của `Suññatalokasutta` (sn35.85 → *Kinh Thế Gian
    Trống Rỗng*) và `Saṅkhittadhammasutta` (sn35.86 → *Kinh Giảng Vắn Tắt*),
    cùng phẩm.
  - >-
    **Dấu lược: `lược()` khớp TỪNG KHOÁ, 0 lệch.** `1.15` và `2.13` mang `…pe…`
    ⇒ mỗi khoá **một** dấu `…`, không bao giờ mở rộng. `3.13` mang **cùng câu**
    nhưng Pāli không có dấu lược ⇒ bản Việt cũng **không** có, đây là chỗ Pāli
    khác nên bản Việt bắt buộc phải khác. Không khoá nào có Pāli viết đủ mà tôi
    nén bằng `…`, nên không có chỗ nào cần người biên tập phán xử theo BRIEF_VI3
    §10.2.
  - >-
    **Pāli trùng nguyên văn TRONG CHÍNH bài này — kiểm riêng, không dựa vào
