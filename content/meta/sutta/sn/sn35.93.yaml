    **BA CỤM PĀLI TRÙNG NGUYÊN VĂN ĐÃ DÙNG LẠI NGUYÊN VĂN BẢN DỊCH CŨ — bắt buộc
    theo luật `sn11.24` trong AGENTS.md.** Cùng công thức ấy đã có 4 bài trong
    cùng bộ sn35, dịch giống nhau, nên bài này phải y hệt, nếu không bài sẽ tự
    mâu thuẫn: (1) `Cakkhuñca paṭicca rūpe ca uppajjati cakkhuviññāṇaṁ` → *Nhân
    mắt và sắc, nhãn thức sinh khởi.* (tiền lệ `sn35.60:1.4`, `sn35.61`,
    `sn35.106`, `sn35.107` = 11 hit cho đúng cụm này). (2) `Manañca paṭicca
    dhamme ca uppajjati manoviññāṇaṁ` → *Nhân tâm và các pháp, tâm thức sinh
    khởi.* (10 hit cùng loại). (3) `jivhañca paṭicca rase ca` → *Nhân lưỡi và
    vị, thức của lưỡi sinh khởi.* (`sn35.60:1.10`). Vì thế `cakkhuviññāṇaṁ` →
    *nhãn thức*, `manoviññāṇaṁ` → *tâm thức*, `jivhāviññāṇaṁ` → *thức của lưỡi*:
    mỗi từ lấy đúng cách đã có cho đúng gốc Pāli ấy, kể cả khi ba cách ấy không
    đồng nhất với nhau. Lưu ý cho người gộp: tầng sn còn *ý thức* 25 hit và
    *lưỡi thức* 6 hit cho cùng hai gốc; tôi theo cụm đã có, không theo đếm từ
    rời.
  - >-
    **Thuật ngữ, kèm số đếm.** `aniccā vipariṇāmino aññathābhāvino` → *vô
    thường, biến hoại, đổi khác* (đúng ba mệnh đề này, `sn25.2:1.2` và
    `sn25.10:1.5`). `Yopi hetu yopi paccayo …uppādāya, sopi …` → *Dù nhân, dù
    duyên làm … sinh khởi, thì nhân ấy …* (`sn35.141:1.2`, `sn35.142:1.5`).
    `kuto niccā bhavissatī` → *làm sao có thể là thường còn* (`sn36.8:5.8`).
    `cakkhusamphasso` → *xúc chạm của con mắt*, `jivhāsamphasso` → *xúc chạm của
    lưỡi*, `manosamphasso` → *xúc chạm của tâm* (đếm trong sn35: 7 + 8 hit cho
    hai cụm đầu). `rūpā` → *các sắc*, `rasā` → *các vị* (`sn35.162:2.9` *Các vị
    là vô thường*; `mil3.3.2` *Do duyên mắt và các sắc*). `dhammā` (sau `mano`)
    → *các pháp* (`mn38:8.21`). `dvaya` → *đôi* (`sn35.92:1.3` cùng phẩm).
    `saṅgati sannipāto samavāyo` → *hội họp, tụ họp, hòa hợp* (0 tiền lệ, giữ cả
    ba danh từ như Pāli). `sañjānāti` → *nhận biết* (65 hit toàn tầng). `vedeti`
    → *cảm thọ* (339 hit). `Dasamaṁ` → *Thứ mười.* · `Channavaggo catuttho` →
    *Phẩm Channa, thứ tư.* (8 hit dạng này trong sn35, `sn35.83:3.5`) ·
    `Tassuddānaṁ` → *Tóm lược:* (11 hit trong sn35).
  - >-
    **Hai chỗ KHÔNG có tiền lệ, tôi dịch mới:** `calañceva byathañca` → *chập
