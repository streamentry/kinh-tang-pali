    check`, `npm run build`, nên `technical_integrity` giữ 9,6 và bốn lệnh ấy
    vẫn do người điều phối/CI chạy; tôi tự kiểm được: 52 = 52 khoá, đúng thứ tự
    Pāli, NFC, không khoá rỗng, `…pe…` → đúng một `…` ở `1.15` và `2.13`, nháy
    kép khớp Pāli (mở ở `1.1`, đóng ở `3.14`), không Pāli lọt vào bản Việt ngoài
    dòng tiêu đề `0.1`. (3) **Lỗi nghĩa thật đã sửa — kệ `tassuddānaṁ`
    `4.3`–`4.4`.** Bản cũ đọc `Ejena ca duve vuttā, dvayehi apare duve` là "bài
    ấy đã nói ra hai bài, còn hai bài kia thì thành đôi" và ghi bất định rằng số
    bài không tròn vòng. Đọc lại thì `ejena` là tên bài **Ejā** (`sn35.90`,
    `sn35.91`, trong kho là "Kinh Dao Động Thứ Nhất/Thứ Hai"), `dvayehi` là tên
    bài **Dvaya** (`sn35.92`, `sn35.93`): *hai bài được nói với Dao Động, hai
    bài kia với Đôi*. Phép đếm khép kín đúng 10 bài của phẩm: `Paloka`
    (`sn35.84`), `Suññā` (`sn35.85`), `Saṅkhitta` (`sn35.86`), `Channa`
    (`sn35.87`), `Puṇṇa` (`sn35.88`), `Bāhiya` (`sn35.89`) = 6, cộng 2 bài Ejā
    và 2 bài Dvaya = 10. Cùng khuôn với kệ của `sn35.83` ("Hai bài … được nói, /
    … với Rādha"). Nên `4.1` cũng được dịch thay vì để Pāli: *Hao mòn, trống
    rỗng, vắn tắt* (theo tên `sn35.84`–`sn35.86` trong kho), nhờ đó không còn
    cần khai `Suññā`/`Saṅkhitta` vào chốt Pāli; `4.2` bỏ chữ "rồi" mà Pāli không
    có. (4) **Sửa độ sát Pāli ở thân bài.** `1.1`, `3.14`: bản cũ viết "đôi
    này", nhưng `dvayaṁ` ở đây không có chỉ định từ — đôi chưa được xác định mà
    bài sẽ giảng ở sau — nên dịch *một đôi*; `3.14` `Evaṁ kho` cũ là "đó là
    cách" (thêm nghĩa) nay là *Như vậy, …*. `1.2` `Kathañca … dvayaṁ paṭicca
    viññāṇaṁ sambhoti` cũ bị đổi thành câu hỏi "đôi này là gì"; nay giữ đúng câu
    hỏi *như thế nào*. `1.6`, `2.4`, `3.4`, `1.15`, `2.13`, `3.13`:
    `Itthetaṁ`/`Itthetepi` cũ bị bỏ chữ *Như vậy*; nay có lại. `calañceva
    byathañca` cũ là "chập chờn, sắp đổ" (chập chờn là nhấp nháy, không phải
    nghĩa của `cala`; `byathā` là lay động, run rẩy) nay là *chao đảo và lung
    lay*, cả sáu chỗ giống nhau. `jivhāviññāṇa` cũ "thức của lưỡi" nay là *thức
    lưỡi* ở `2.1`, `2.5`, `2.6`, `2.7`, cho song song với *thức mắt* trong cùng
    bài (toàn tầng 78 "thức lưỡi" so với 24 "thức của lưỡi"; trong `sn35` đo
    theo gốc Pāli `jivhāviññāṇ…` là 23 so với 11). Tổng cộng 17 khoá đổi trên
    52; lỗi nghĩa thật (đảo nghĩa kệ) là 2 khoá (`4.3`, `4.4`), còn lại là
    thêm/bớt nghĩa nhỏ và thuật ngữ. (5) **Đính chính mục thuật ngữ cũ.** Mục ấy
    viết `cakkhuviññāṇaṁ` → *nhãn thức*, nhưng bản dịch luôn là *thức mắt* (207
    khoá cả tầng; *nhãn thức* chỉ 8) — đúng với bản dịch, sai với ghi chú.
    `manoviññāṇaṁ` giữ *tâm thức*, theo cụm đã có ở `sn12.43`, `sn35.60` (`Nhân
    tâm và các pháp, tâm thức sinh khởi`). (6) **Bất định còn lại.** `ceteti` →
    *có ý định* (Sujato *intends*, không có tiền lệ Việt; nghĩa gần *tư*, có thể
    đổi nếu người biên tập chọn). `calā … byathā` → *chao đảo, lung lay* là cách
    đọc theo gốc `cala`/`vyath`, không có tiền lệ. Tiêu đề *Đôi Nhóm (Hai)* theo
    `sn35.92` đã xuất bản; chữ "Nhóm" không có trong `dvaya` — nếu đổi phải đổi
    cả hai bài. `phuṭṭho … vedeti` → *khi bị chạm, vị ấy …* dùng "vị ấy" cho chủ
    thể vô định của Pāli (Sujato *one*).
