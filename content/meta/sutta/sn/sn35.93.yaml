    **Pāli của bài này là DUY NHẤT trong toàn corpus — đo bằng script trên 284.708 khoá.**
    Cụm `dvayaṁ paṭicca viññāṇaṁ sambhoti` chỉ xuất hiện ở 1 khoá / 1 bài (chính
