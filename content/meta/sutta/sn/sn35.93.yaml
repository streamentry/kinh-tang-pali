    nguyên. Mục cũ về kệ `tassuddānaṁ` ("bất định đã ghi nhận") bị thay thế hoàn
    toàn; mục cũ về thuật ngữ có hai chỗ sai so với bản dịch thực tế và được
    đính chính dưới đây. (1) **Blocker độ phủ Anh 29/40 = 0,7250 đã gỡ.** Đây là
