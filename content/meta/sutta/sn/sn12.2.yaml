notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt Hòa thượng Thích Minh Châu (nguyên bài, đọc để tra thuật ngữ — không có tầng phân đoạn). Đủ 79 khoá, đúng thứ tự Pāli; không có khoá nào ngoài tập khoá Pāli.
  Coverage English: mẫu số 23 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`), Sujato phủ 23/23 = 100%. Không có lớp `english-project` cho bài này, nên con số 100% là hoàn toàn của Sujato; tầng `vietnamese-current` ở bilara không có bài này nên không tính vào coverage. Đạt ngưỡng, không cần entry `reference-gaps`.
  Bất định, đã phân xử bằng Pāli và văn cảnh. (1) `3.2`: Pāli `Yā tesaṁ tesaṁ sattānaṁ … jarā jīraṇatā …` là sở hữu cách đứng đầu câu; giữ trật tự bằng «Đối với từng chúng sinh trong từng loại chúng sinh, đó là sự già, …». Cách này chuyển cấu trúc so với `sn12.28:2.2` («Sự già nua … của từng chúng sinh …»), cùng nghĩa; chọn cách đặt chủ thể trước để ba khoá `3.2`, `3.4`, `4.2` đọc song song. `tesaṁ tesaṁ`/`tamhi tamhi`/`tamhā tamhā` đều dịch «từng». (2) `3.4`: Pāli kết bằng `(…),` — giữ nguyên `(…),` theo quy ước tầng (dấu lược của tầng Pāli ghim). Danh sách `cuti cavanatā bhedo antaradhānaṁ maccu maraṇaṁ kālakiriyā khandhānaṁ bhedo kaḷevarassa nikkhepo` có hai từ `bhedo` (một của chúng sinh, một của các uẩn); dịch «tan rã» cho cái đầu và «các uẩn tan rã» cho cái sau, không đổi nghĩa; `maccu` → «tử vong» và `maraṇaṁ` → «chết» là hai mục riêng trong danh sách. Sujato dịch cùng cấu trúc. (3) `11.4`: `upādāyarūpaṁ` → «sắc phát sinh từ bốn đại», theo `mn9:54.4` (cùng đoạn Pāli về danh sắc); `mn28`, `mn33`, `mn106` dùng «sắc do bốn đại tạo thành» — cùng nghĩa, chọn cách của `mn9` vì cùng định nghĩa danh sắc. `cetanā` → «tư» (`mn9:54.2`, cùng danh sách Thọ–tưởng–tư–xúc–tác ý). (4) `7.3`: tên sáu nhóm ái dịch «ái sắc, ái thanh, …», trong khi đầu mối của chuỗi duyên khởi là «khát ái» (theo `sn12.1`); `taṇhā` đơn đứng cuối danh sách là «khát ái», còn các thành viên hợp thành dạng ngắn «ái X» cho gọn — hai chữ cùng gốc `taṇhā`.
  Số: `tayome … bhavā` = ba hữu (liệt kê đúng 3: dục, sắc, vô sắc); `cattārimāni … upādānāni` = bốn chấp thủ (liệt kê đúng 4); `chayime … taṇhākāyā / vedanākāyā / phassakāyā / viññāṇakāyā` = sáu nhóm (mỗi danh sách đúng 6 mục, đã đếm); `saḷāyatana` = sáu xứ (đúng 6 mục); `tayome saṅkhārā` = ba hành (thân, khẩu, tâm); `cattāro mahābhūtā` = bốn đại; `Dutiyaṁ` = thứ hai. Không có cụm số bất định.
  Công thức dùng lại: đã dò 34 khoá có Pāli trùng nguyên văn với phần còn lại của tầng `sn`; 23 khoá trùng với ít nhất một cách dịch đã có (ví dụ `Trú ở Sāvatthī.` 90 khoá, `1.4`, `2.1`, `2.2`, `15.1`–`15.6`), 11 khoá khác tiền lệ: `2.3`, `2.11`, `2.12`, `3.1`, `3.3`, `3.5`, `3.7`, `13.1`–`13.4`. Với chuỗi duyên khởi `2.2`–`2.12` tầng chia hai dạng («do duyên … mà có» như `sn12.1`, và «do … làm điều kiện / làm duyên» ở `sn12.44`, `sn12.53`, `sn35.107`); chọn dạng `sn12.1` cho cả chuỗi vì cùng công thức và cùng phẩm, riêng `2.3` giữ «do duyên hành» cho đồng đều với các dòng còn lại (`sn12.1:2.3` viết «do các hành»; tầng chia 8 «do các hành» / 7 «do duyên hành» ở `saṅkhārapaccayā viññāṇaṁ`). `3.1`, `3.3`, `3.5`, `3.7`, `13.1`–`13.4` trùng Pāli với `sn12.27` và `sn12.28`, nhưng đó là hai bài có ngữ cảnh khác (dịch «Sinh ra là gì», «đây gọi là …», «lời nói hành»); ở đây theo mẫu thống nhất «Và này các tỳ-kheo, … là gì?» / «cái này được gọi là …» cho cả bài, và «khẩu hành» theo `mn9:62.3` và `sn41.6:1.5`. Trong chính bài này không có hai khoá Pāli trùng nguyên văn (phép so nội bộ chạy rỗng: 0 cặp).
  Thuật ngữ, đã đếm: `jāti` → «sinh» (trong `sn12`: 56 khoá «sinh» / 30 khoá «sanh»; `sn12.1`, `sn12.20`, `sn12.44`, `sn12.52` dùng «sanh» — đã ghi để biên tập quyết định, không đổi ở bài này); `jarāmaraṇa` → «già-chết» (`sn12.1`); `taṇhā` → «khát ái» (`sn12.1`; toàn `sn` 9 khoá «khát ái» trong chuỗi `taṇhāpaccayā`); `nāmarūpa` → «danh sắc» (tầng `sn` 34 / 1 «danh-sắc»; `mn9` dùng «danh-sắc»); `saḷāyatana` → «sáu xứ» (24 / 18 «sáu căn»); `upādāna` → «chấp thủ» (`sn12.1`; 8 khoá chuỗi); `kāyasaṅkhāro` … → «thân hành, khẩu hành và tâm hành» (11 «khẩu hành» / 1 «lời nói hành»; cùng `mn9:62.3`, `sn41.6:1.5`); `vedanā` → «thọ»; `saṅkhārā` → «hành»; `Buddhavagga` → «Phẩm Đạo Sư» (`sn12.1:0.2`, 8 khoá `:0.2`); `Vibhaṅgasutta` → «Kinh Phân Tích» (Sujato «Analysis», Thích Minh Châu «Phân Biệt»).
  Lượt review đối kháng: đã in từng cặp Pāli↔Việt đọc lại; tập khoá 79/79, nháy đơn và nháy kép khớp Pāli từng khoá, dấu lược cân bằng Pāli (`…pe…` → một `…` ở `15.2` và `15.5`; `(…)` ở `3.4` giữ nguyên), 0 từ Pāli lọt sang thân bài Việt. Khoá `0.1` giữ tên bộ «Saṁyutta Nikāya» theo quy ước tầng.
  `technical_integrity` 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` ở lượt này (do người điều phối chạy), nên không tuyên bố technical gate đã pass.
