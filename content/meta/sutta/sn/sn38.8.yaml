    Bài này và `sn38.10`/`sn38.13` có **cùng một khung** (hỏi tên một thứ → định nghĩa ba loại → hỏi có con đường không → chỉ bát chánh đạo → Đức Thế Tôn khen và dặn Sāriputta đề phòng phóng dật), nên dùng chung một hàm sinh; chỉ khác danh từ và mệnh đề cuối. Đã tách riêng `maggo` → *con đường* và `paṭipadā` → *đạo lộ*.
  - >-
    Dùng lại nguyên văn đã `published`: `āsava` → *lậu* (đúng `sn45.163:1.1*`, bài định nghĩa cùng ba loại) · `Kāmāsavo, bhavāsavo, avijjāsavo` → *Lậu trong dục, lậu trong hữu, lậu trong vô minh* (nguyên văn `sn45.163:1.3*`) · `ariyo aṭṭhaṅgiko maggo` → *Thánh đạo tám ngành* (`sn43.11:1.2*`) · `āvuso sāriputta` → *hiền giả Sāriputta* (`sn38.16:1.1*`).
