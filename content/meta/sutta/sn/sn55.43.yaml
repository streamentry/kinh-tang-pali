notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `5. Sagāthakapuññābhisandavagga` → «5. Phẩm Người Hiện Kinh Gặp Gác Công Đức». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Sửa lan 2026-10-13 (terminology fix): khoá sn55.43:0.2 — Pāli `Sagāthakapuññābhisandavagga`
  (`sagāthaka` = có kệ, `puññābhisanda` = dòng phước chảy tràn, đúng cụm “dòng phước chảy tràn” đã
  dùng trong thân bài này) trước dịch “5. Phẩm Người Hiện Kinh Gặp Gác Công Đức”, không có căn cứ
  ở bất kỳ thành tố nào. Sau: “5. Phẩm Dòng Phước Chảy Tràn Có Kệ”. Căn cứ: Pāli root;
  `Puññābhisandavagga` ở sn55.31 và sn55.32 là “Phẩm Dòng Phước Chảy Tràn”; `Sagāthāvagga` → “Phẩm
  Có Kệ Tụng” (10 khoá) và `Sagāthakasutta` → “Kinh Có Kệ” (2 khoá). Mới sửa trong bài này;
  sn55.41–sn55.50 (9 bài còn lại cùng phẩm) vẫn mang tên cũ “Người Hiện Kinh Gặp Gác Công Đức” —
  cần đồng bộ theo quyết định này. Điểm không đổi.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.5, 3.2 — «dòng phước chảy tràn, nguồn thiện pháp tràn đầy thứ nhất/tư, mang lại hạnh phúc» → «dòng phước chảy tràn thứ nhất/tư, dòng thiện chảy tràn, là chất nuôi dưỡng hạnh phúc» (puññābhisando, kusalābhisando, sukhassāhāro: bản cũ làm «abhisanda» thành «tràn đầy» gắn vào «nguồn» và biến «āhāra» thành động từ «mang lại»; dạng mới là dạng chiếm đa số của tầng và sát từng từ Pāli hơn), đồng bộ cả 1.1, 3.3, 4.1, 4.2 trong bài; giữ nguyên khoá 2.1 «vị thánh đệ tử thành tựu lòng tịnh tín bất động nơi Pháp …» (ariyasāvako là «thánh đệ tử»; bản đa số «bậc Thánh đa văn» sai thuật ngữ).
