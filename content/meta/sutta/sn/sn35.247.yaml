  **57 khoá** (0.1–0.3, 1.1–1.6, 2.1–2.9, 3.1–3.14, 4.1–4.6, 5.1–5.14, 6.1–6.5), viết đủ cả 57; dump f202 == root JSON: 0 lệch.
  **Trùng nguyên văn (chỉ mục toàn kho 68.499 chuỗi Pāli): 13/57 khoá khớp tuyệt đối, đều dùng lại cách dịch đã có.** 19. Āsīvisavagga → *19. Phẩm Rắn Độc* (4 nơi) · Kathañca…asaṁvaro/saṁvaro hoti → *Thế nào…sự không phòng hộ?/Và thế nào…sự phòng hộ?* (khuôn `sn35.98:1.3/2.1`) · Evaṁ kho…asaṁvaro hoti → *Như vậy, này các tỳ-kheo, là sự không phòng hộ.* (`sn35.98:1.13`) · Sotena saddaṁ sutvā … / ghānena… / jivhāya… / kāyena… → *Sau khi nghe âm thanh bằng tai … / Sau khi ngửi mùi bằng mũi … / Sau khi nếm vị bằng lưỡi … / Sau khi chạm xúc chạm bằng thân …* (khuôn cùng phẩm `sn35.240:2.8–2.11`) · tañca cetovimuttiṁ…pajānāti (4.6) → nguyên văn `an5.142:5.2` · Tasmātiha vo…sikkhitabbaṁ → *Vì vậy…tu học như vầy:* (`an5.56:6.2`) · Evañhi kho…sikkhitabban”ti → *…nên tu học như vậy.”* (`sn47.20:3.6`) · Dasamaṁ → *Thứ mười.* (228 nơi).
  **Trùng nhưng không theo, có lý do:** `4.4` `jivhāya rasaṁ sāyitvā …pe…` có 15 biến thể trùng; chọn *Sau khi nếm vị bằng lưỡi …* để nhất quán nội bộ với `2.6` và cùng phẩm `sn35.240`, thay vì *khi lưỡi nếm vị …* (mn51, 8 nơi). `4.3`/`2.3`/`2.9` dựng từ nguyên văn `an5.142:5.2` (khoá `4.6` trùng tuyệt đối) thêm phủ định *không* / thêm *của vị ấy* theo `yatthassa te`.
  **Tiền lệ thuật ngữ đã tra kèm đếm:** `saṁvara/asaṁvara` → *sự phòng hộ/sự không phòng hộ* (`sn35.98`); `adhimuccati` → *bám víu* ('bám víu' 60 nơi); `byāpajjati` → *bực bội* (165 nơi); `manāpiya/amanāpiya` → *đáng yêu/không đáng yêu* ('đáng yêu' 207 nơi); `paṭikūlā honti` → *trở nên ghê tởm* (80 nơi); `anupaṭṭhitakāyassati/upaṭṭhitakāyassati` → *niệm thân chưa hiện tiền/đã hiện tiền* ('niệm thân' 65 nơi, 'hiện tiền' 66 nơi); `parittacetaso` → *tâm còn hẹp hòi* ('hẹp hòi' 19 nơi, khuôn `an3.100`); `appamāṇacetaso` → *tâm vô lượng* (khuôn snp1.8); `kāyagatāsati` → *niệm thân*; `khīla/thambha` → *cọc/cột* ('cọc' 85 nơi); `susumāra` → *cá sấu* (24 nơi); `siṅgāla` → *chó rừng* (53 nơi); `sīvathika` → *nghĩa địa* (63 nơi); `vammika` → *gò mối* (4 nơi); `saravana` → *rừng lau sậy* (khuôn `dn26:23.7` 'rừng lau sậy'); công thức `bhāvitā bahulīkatā yānīkatā vatthukatā anuṭṭhitā paricitā susamāraddhā` (6.3) → nguyên khuôn `dn33:2.2.102` (*được tu tập, được làm cho sung mãn, được dùng như cỗ xe, được làm nền tảng, được hành trì thường xuyên, được làm cho quen thuộc, được khéo khởi hành*) với `bhavissati` → *sẽ được…*; `abhāvitā abahulīkatā` (3.12) → *chưa được tu tập, chưa được làm cho sung mãn* — cùng mapping.
  **Coverage Anh: 38/38 segment ≥40 ký tự có English Sujato.** Không có tầng Việt hiện hành (bilara chỉ có Pháp Cú) — đã ghi vào scorecard.
  **Lược: mỗi khoá đếm lược(vi) == lược(pāli)**; `…pe…` ở `2.4–2.7` (trần "…"), `4.3`, `4.4`, `5.4`, `5.5`, `5.6`, `5.12` (hai dấu trong một khoá) — giữ đúng số; `1.6` `kaṇṭakoti iti` dịch ý (*Đã biết rõ như vậy là cái gai…*). Không blocker.
