notes: |-
  Dịch từ Pāli root tại commit đã ghim, viết mới từng khoá, đối chiếu English Sujato đã ghim và (ở dạng nguyên bài, không phân đoạn) bản Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn. Đủ 73/73 khoá, đúng thứ tự khoá Pāli, không khoá ngoài tập Pāli.

  COVERAGE ENGLISH, đo thật: mẫu số = 49 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối tham chiếu `:0`). `english-sujato` phủ 47/49 = 0,959. Hai khoá Sujato để trống là `3.5` và `3.6` (Sujato nối câu qua chỗ lược). Hai khoá này do lớp `english-project` (đã published) lấp, nên cổng tính cả hai lớp = 49/49 = 1,000; nhưng lớp lấp và bản Việt này cùng một tác giả/người chấm, nên đó KHÔNG phải cách đọc English độc lập. Con số độc lập là 47/49. Cả hai cách đo đều trên ngưỡng 0,80, không có blocker coverage, và không cần entry trong `content/meta/reference-gaps.yaml`. Tầng `vietnamese-current` không có (bilara tại commit ghim chỉ phân phối Pháp Cú tiếng Việt); bản Thích Minh Châu chỉ có dạng nguyên bài và chỉ dùng để đối chiếu thuật ngữ, không tính vào coverage. `triangulation` vì vậy đặt 9.0, không cao hơn: hai khoá `3.5`, `3.6` không có English độc lập, và hai khoá `4.7`, `8.5` ngắn hơn ngưỡng 40 ký tự nên không vào mẫu số.

  TIỀN LỆ ĐÃ DÒ (đếm, không tin số của người khác):
  · Pāli trùng nguyên văn với khoá đã có bản Việt ở tầng `sn`: 30 khoá (239 cặp, kể cả công thức chung như `Evaṁ, bhante`, `Tatiyaṁ`). Trong 30 khoá đó bản này dùng lại nguyên văn 15 khoá và khác ở 15 khoá; mọi chỗ khác đều có lý do bên dưới.
  · Pāli trùng nguyên văn TRONG CHÍNH bài: 3 nhóm (`2.4`=`3.6`=`4.12`, `2.5`=`3.7`, `7.5`=`7.9`), cả 3 nhóm bản Việt giống hệt nhau, 0 chỗ lệch.
  · `3.5` và `4.11` có Pāli gần trùng (chỉ khác dấu phẩy sau `antavā lokoti vā` và nháy `‘` đầu khoá); bản Việt dùng cùng một danh sách mười điều, khác nhau đúng ở chữ hoa đầu khoá và dấu nháy.

  KHÁC TIỀN LỆ CÓ CHỦ ĐÍCH (đo rồi mới khác):
  (1) `1.3` `adhivāsentu me, bhante, therā svātanāya bhattan`. `sn41.2:1.3` và `sn41.4:1.3` dịch thành câu hỏi “…có nhận bữa ăn… không?”. Pāli là mệnh lệnh ở ngôi thứ ba (lời mời), không có từ nghi vấn; các bài `mn` có cùng cấu trúc (mn92:3.5, mn92:3.10, mn92:3.15, mn127:2.5) đều dịch thành lời thỉnh “mong… nhận lời dùng bữa”. Bản này dịch thành lời thỉnh. Hai khoá của `sn41.2` và `sn41.4` mang cách đọc câu hỏi; chưa sửa vì ngoài phạm vi lát này, nên người biên tập cân nhắc.
  (2) `1.5` `padakkhiṇaṁ katvā`. Cách dịch có sẵn ở `sn41.2:1.5` “vòng quanh giữ sang bên phải các ngài, rồi mới ra đi” thêm sắc thái “rồi mới” mà Pāli (phân từ hoàn thành `katvā`) không có và ít gặp trong tầng. Đếm các dạng cho cùng cụm Pāli trong `sn`: dạng “nhiễu … bên phải/hướng hữu” chiếm đa số. Dùng “đi nhiễu quanh theo hướng bên phải rồi ra đi”.
  (3) `8.1` `paṇītena khādanīyena bhojanīyena`. Cách có sẵn “những món ăn tinh tú, đáng nếm, đáng ăn” là calque khó hiểu (“tinh tú” trong tiếng Việt thường là sao trời, không phải “thượng hạng”); trong tầng, cụm này phần lớn được dịch “món ăn cứng và mềm” kèm “thượng vị/hảo hạng”. Dùng “các món ăn cứng và mềm thượng vị”, đặt `sahatthā` thành “tự tay”. Lưu ý ngoài lát: chuỗi “tinh tú” còn xuất hiện ở khoảng 52 dòng khác trong `content/translation/vi/project/sutta`, chưa sửa ở đây.
  (4) `4.9` `Evaṁ, bhante`: 34 trong 35 khoá trùng Pāli là lời đáp Đức Thế Tôn (“Thưa vâng, bạch Thế Tôn”). Ở đây người đáp là Tôn giả trưởng lão, nên dùng “Thưa vâng, bạch ngài” như `sn41.2:3.8`.
  (5) `7.5`, `7.9` `Evaṁ, gahapatī`: hai khoá trùng Pāli ở `sn41.1:3.7` và `sn41.5:4.3` dịch “Vâng vâng, này gia chủ”, nhưng đó là lời xác nhận một mô tả; Pāli chỉ có một `evaṁ`, không lặp. Ở đây là lời xác nhận “đã gặp”, dịch “Đúng vậy, này gia chủ”.
  (6) `7.11` `Ramaṇīyaṁ ambāṭakavanaṁ`: tiền lệ duy nhất `sn41.4:6.5` “Vườn Xoài ấy thật làm khoái lòng” thêm “ấy” và nghĩa gây khiến mà `ramaṇīya` (đáng ưa, dễ chịu) không có; dịch “Vườn Xoài thật đáng ưa”. `7.13` dùng lại nguyên cụm tiền lệ, chỉ đặt dấu chấm ngoài ngoặc đúng như Pāli `”ti.`.
  (7) `5.5`, `5.6`: `saññaṁ …` và `saṅkhāre …` có 20 và 22 khoá trùng Pāli; chọn dạng đa số chữ thường “tưởng …”, “các hành …” (11 và 12 khoá).

  THUẬT NGỮ, đếm trên bản Việt đã có (tầng `sn` cho `sakkāyadiṭṭhi`, `sassato`; toàn tầng sutta cho `jīva`, `kulaputto`, `sutavā`):
  · `sakkāyadiṭṭhi` -> “thân kiến” (19 khoá) so với “tà kiến về thân” (6 khoá).
  · `diṭṭhi` (trung tính, chưa phải `diṭṭhigata`) -> “quan điểm”; `diṭṭhigata` trong `dvāsaṭṭhi diṭṭhigatāni` -> “tà kiến”, trùng cách dịch `sn6.4`, `sn6.5`. Hai từ được giữ khác nhau có chủ ý, vì `4.13` nói “những quan điểm ấy có mặt khi có thân kiến”.
  · `taṁ jīvaṁ taṁ sarīraṁ` -> “mạng là thân”, `aññaṁ jīvaṁ aññaṁ sarīraṁ` -> “mạng khác thân” (21 khoá dùng “mạng”, 10 khoá dùng “linh hồn”, 4 khoá “sinh mạng”).
  · `sassato loko` -> “thế giới thường còn” (18 khoá) và `asassato` -> “không thường còn” (16 khoá) so với “vô thường” (5 khoá), tránh trùng thuật ngữ `anicca`; `neva hoti na na hoti` -> “phi tồn tại phi phi tồn tại”, cùng quy ước với dạng tương tự `phi tưởng phi phi tưởng` (168 khoá toàn tầng).
  · `kulaputto` -> “thiện nam tử”: 204 khoá, so với “người con nhà” 22, “người con” 37.
  · `sutavā ariyasāvako` -> “Thánh đệ tử có học”: tầng có “có nghe” 7, “đa văn” 7, “nghe nhiều” 4, “có học” 3; chọn “có học” để đối xứng với “phàm phu chưa học” (51 khoá).
  · `samanupassati` -> “quán” (cùng cách `sn22.7`), `attā` -> “tự ngã”.
  · `Avantiyā` -> “xứ Avanti” (tầng viết “xứ Avanti” 2 chỗ, “xứ Avantī” 1 chỗ). `kulaputto … adiṭṭhasahāyo` -> “người bạn chưa từng gặp mặt”.

  BẤT ĐỊNH ĐÃ PHÂN XỬ:
  (a) `7.8` `Ayyo no, bhante, isidatto`: `no` có thể là tiểu từ nghi vấn (`nu`), cũng có thể là “của chúng con”. Sujato (“are you that Isidatta?”) và bản Thích Minh Châu nguyên bài đều không dịch “của chúng con”. Dịch như câu hỏi “có phải ngài là Isidatta không?”; không thêm “của chúng con”.
  (b) `7.3` `amhākaṁ` là số nhiều nên dịch “của chúng con” (giữ số nhiều), dù trong lời thỉnh `1.3` người nói dùng “con”.
  (c) `8.8` `Yaṁ macchikāsaṇḍamhā pakkāmi, tathā pakkantova ahosi` là mệnh đề tương liên khó dịch sát. Dịch theo ngữ cảnh “Từ khi rời Macchikāsaṇḍa, ngài đã ra đi hẳn như thế, không trở lại nữa”, tức đi luôn. Tiền lệ duy nhất `sn41.4:6.9` dịch “…đó là lần rời đi cuối cùng”, cùng nghĩa.
  (d) `3.8` `Tatiyampi kho āyasmā thero tuṇhī ahosi` là lần im lặng thứ BA theo Pāli (lần thứ hai nằm sau dấu lược `3.2`); Sujato gộp “a second time and a third time”. Dịch bám Pāli.
  (e) `8.9` `Tatiyaṁ` là số thứ tự của bài trong phẩm (bài thứ ba), không phải tên bài `Dutiyaisidatta`; dịch nguyên “Thứ ba.”
  (f) `4.8` và `4.13` Pāli có `’”` đóng ở cuối nhưng nháy `‘` mở ở `4.6` và `4.11`: hai cặp lồng nhau theo Pāli (`4.6`…`4.8`, `4.11`…`4.13`), bản Việt giữ nguyên từng cặp.
  (g) Không có số cần tự tính ngoài `dvāsaṭṭhi` = dvā 2 + saṭṭhi 60 = 62 (“sáu mươi hai”), khớp truyền thống Brahmajāla; số thứ tự `dutiyaṁ`, `tatiyaṁ` dịch “hai”, “ba”.

  PHÉP ĐO TỰ KIỂM: tập khoá Việt = tập khoá Pāli, 73 = 73, cùng thứ tự; nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch trên 73 khoá); dấu lược `…pe…` -> đúng một `…` ở 3 khoá (3.2, 4.7, 5.4), `…` trần giữ ở 4 khoá (5.5, 6.4, 6.5, 6.6), không có `(…)`; NFC sạch, không khoá rỗng, không khoảng trắng thừa; không có Pāli lọt sang bản Việt ngoài tên riêng.

  Cổng kỹ thuật: `technical_integrity` đặt 9.6 vì lát này bị cấm chạy `npm run validate`, `npm test`, `npm run check` và `npm run build`; bốn lệnh đó vẫn là cổng thật do CI chạy, chưa được chạy ở đây.
