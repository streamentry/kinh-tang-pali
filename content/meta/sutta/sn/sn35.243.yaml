notes: |-
  **103 khoá** (0.1–0.3, 1.1–1.8, 2.1–2.10, 3.1–3.15, 4.1–4.12, 5.1–5.19, 6.1–6.11, 7.1–7.18, 8.1–8.3, 9.1–9.4), viết đủ cả 103; tập khoá Việt == tập khoá Pāli (103/103), cùng thứ tự; không có khoá ngoài Pāli.

  Coverage tầng Anh (đo trên Pāli có nội dung, ≥ 40 ký tự, bỏ khối :0): mẫu số 68. Sujato phủ 67/68 = 0,985, vượt ngưỡng 0,80. Khoá còn lại, 2.2, Sujato để trống vì đã dồn việc chuẩn bị hội trường vào 2.1; khoá đó được lớp english-project lấp. Đây là bản lấp do cùng một phía soạn nên không tính là đối chiếu độc lập: phần đối chiếu English độc lập của bài là 67/68 khoá. Bản Việt hiện hành (Hòa thượng Thích Minh Châu, Bình Anson hiệu đính) chỉ có ở dạng nguyên bài, không phân đoạn, nên dùng tra cứu thuật ngữ chứ không thay cho đối chiếu từng khoá.

  Thuật ngữ và tiền lệ (đo trên toàn tầng):
  - `avassuta` / `anavassuta` → "bị thấm nhiễm" / "không bị thấm nhiễm"; `avassutapariyāya` → "bài pháp về sự thấm nhiễm", theo mẫu tên kinh "Kinh Bài Pháp Về Lửa Cháy" của sn35.235 (`pariyāya`). Tiền lệ cho `avassuta` ở nghĩa tâm lý không đồng nhất: "ô nhiễm" 4 khoá (mn137 ×2, thag2.17, snp1.3), "thấm nhiễm" 1 (dhp39), "rỉ chảy" 1 (thag4.4), "thấm ướt" 15 khoá nhưng đều ở nghĩa vật lý (an3.109, an3.128). Chọn "thấm nhiễm" để giữ hình ảnh thấm vào, ăn khớp với ẩn dụ ngôi nhà ở các đoạn 5 và 7, đồng thời tránh trùng với "tạp nhiễm" (`saṅkilesika`) ở 5.18 và 7.17. Bản Hòa thượng Thích Minh Châu dịch là "nhiễm dục lậu", bản Sujato là "festering"; hai cách này khác nhau và khác tầng Việt hiện hành, nên đây là chỗ bất định về thuật ngữ, đã ghi ở đây.
  - `adhibhavati` / `adhibhūta` / `adhibhū` → "chế ngự" / "bị chế ngự" / "kẻ chế ngự". Dạng `adhibh-` không có tiền lệ trong tầng (0 khoá); trên các khoá có gốc `abhibh-` / `adhibh-` (tên riêng và nghĩa "tối thắng" lẫn trong đó), "chế ngự" gặp ở 51 khoá, "chinh phục" ở 19 (bản Hòa thượng Thích Minh Châu của chính bài này dùng "chinh phục"). Sujato dùng "mastered / master".
  - `otāraṁ` / `ārammaṇaṁ` (`labhati māro otāraṁ, labhati māro ārammaṇaṁ`) → "kẽ hở" / "chỗ bám", theo mn119 (9 khoá cùng công thức, cùng thế Māra). Các nơi khác dịch "chỗ xâm nhập", "sơ hở", "cơ hội" nên đã chọn theo bài cùng công thức nhiều nhất.
  - Công thức `tañca cetovimuttiṁ paññāvimuttiṁ yathābhūtaṁ (na)pajānāti yatthassa te uppannā pāpakā akusalā dhammā aparisesā nirujjhanti`: dịch theo dạng đa số của tầng — "giải thoát tâm và giải thoát tuệ" (122/109 khoá, so với "tâm giải thoát / tuệ giải thoát" 86/79) và "vừa sanh khởi … chấm dứt không còn dư sót" (khoảng 13 khoá cùng công thức, so với 4 khoá của sn35.244 dịch "đã sanh khởi … diệt tận"). Giữ "của vị ấy" cho `assa` ở `yatthassa`. Bất định: `uppannā` là quá khứ phân từ ("đã sanh khởi"), chữ "vừa" là cách dịch của công thức tầng chứ không phải chữ riêng của Pāli.
  - `anupaṭṭhitakāyassati … parittacetaso` / `upaṭṭhitakāyassati … appamāṇacetaso` → "niệm thân chưa hiện tiền, tâm còn hẹp hòi" / "niệm thân đã hiện tiền, tâm vô lượng", đúng bản sn35.244 và sn35.247 cùng phẩm. `adhimuccati` / `byāpajjati` → "bám víu" / "bực bội", cùng nguồn.
  - `saṅkilesikā ponobhavikā sadarā dukkhavipākā āyatiṁ jātijarāmaraṇiyā` → "tạp nhiễm, dẫn đến tái sinh, đem theo phiền lụy, cho quả khổ và dẫn đến sinh, già, chết trong tương lai", theo mn122 (3 khoá) và mn36:47.1. `sadara` không có nghĩa chắc chắn trong tầng; "phiền lụy" theo tiền lệ đó.
  - `rūpa, sadda, gandha, rasa, phoṭṭhabba, dhamma` → "sắc, tiếng, mùi, vị, xúc, pháp": trong sn35 "các mùi" 11 khoá so với "các hương" 1; "các xúc" 12 so với "xúc chạm" 10.
  - Khung mở đầu (hội trường mới của người Thích-ca): dùng lại cách dịch của mn53 cho cùng công thức, riêng `udakamaṇika` dịch "bình nước" theo đa số (16 khoá so với "ghè nước" 2); "tu viện Cây Bàng" và "người Thích-ca" theo sn55.37 (cùng câu Pāli mở đầu 1.1).
  - Cụm cố định: "Đức Thế Tôn im lặng nhận lời" (11 khoá dạng này, so với "Đức Phật im lặng nhận lời" 10, mà cả tầng sn35 gọi `bhagavā` là "Đức Thế Tôn"); "Này các hiền giả tỳ-kheo!" (13/25 khoá của `āvuso bhikkhave`); "Hãy lắng nghe và chú tâm kỹ" (15/40 khoá), đổi "Ta" thành "tôi" vì người nói là Tôn giả Mahāmoggallāna. Số cặp Pāli trùng đã dò với phần còn lại của tầng: 23 khoá có Pāli trùng ngoài bài, 199 cặp, trong đó bản Việt khác ở 151 cặp (phần lớn do tầng chưa thống nhất một cách dịch, hoặc do người nói khác nhau). Dùng lại nguyên văn ở 12 khoá. Trong chính bài, 6 nhóm Pāli trùng nguyên văn (3.11/3.15, 4.4/6.4, 4.12/5.11, 5.7/7.7, 5.10/6.10, 6.11/7.10), cả 6 nhóm bản Việt đều giống nhau; 0 cặp khác.

  Các điểm bất định:
  - 3.3 `paṭibhātu taṁ … dhammī kathā`: dn33 bỏ `paṭibhātu`, mn53 và Sujato giữ ("theo điều ông thấy thích hợp / as you feel inspired"). Giữ theo mn53.
  - 5.1 `terovassika` dịch "để lâu năm" theo dn22 và mn10; bản Hòa thượng Thích Minh Châu của chính bài viết "ba bốn năm", Sujato viết "decrepit". Nghĩa gốc là quá một năm; không thêm số năm vào lời kinh.
  - 7.1 `kūṭāgāraṁ vā sālā vā`: dịch "nhà mái nhọn" theo tầng, `sālā` dịch "sảnh đường"; không có tiền lệ cùng cặp từ này. `bahalamattikā addāvalepanā` → "tường đất dày, mới trát còn ướt" theo mn13 và mn14 (`addāvalepana`).
  - 8.1 `uṭṭhahitvā` dịch "ngồi dậy" theo mn53:26.1 (cùng công thức, Đức Thế Tôn đang nằm nghỉ lưng).
  - 5.12, 7.11 và các khoá kế: `adhibhaṁsu` / `adhibhosi` là thì quá khứ (aorist); dịch "đã chế ngự" ở vế khẳng định, "không chế ngự được" ở vế phủ định, không thêm yếu tố thời gian nào khác.
  - 2.2, 2.3: Pāli dồn lời Thích-ca vào hai khoá; Sujato dồn 2.2 vào 2.1 nên cột Anh của bài lệch nhịp một khoá ở đây, không ảnh hưởng căn khoá của bản Việt.
  - Dấu lược: 25 khoá có lược trong Pāli (19 khoá `…pe…`, 6 khoá `…` trần bị cắt qua ranh giới khoá: 5.7, 7.3, 7.4, 7.5, 7.6, 7.7); đều chuyển thành đúng một `…`, không mở rộng thành văn. Pāli không có `(…)` ở khoá nào trong bài nên không có `(…)` ở bản Việt.
  - Không có số lượng Pāli nào cần tự tính ngoài `catugguṇaṁ saṅghāṭiṁ` (catu 4 + guṇa → "gấp bốn", dn16 và dn33 cùng cách).

