notes: |-
  Dịch từ Pāli root ở commit đã ghim, đối chiếu bản Anh Bhikkhu Sujato đã ghim. Tầng Việt
  hiện hành KHÔNG có bài này: translation/vi/phantuananh/ ở commit đã ghim chỉ chứa 26
  chương Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Đó là
  đặc điểm của snapshot upstream, không phải thiếu sót của repo; budsas.org chỉ là tra cứu
  toàn văn, không cấp text cho tầng nào.

  COVERAGE TẦNG ANH — đo bằng script trên 53 khoá của chính bài: mẫu số là 23 khoá Pāli có
  nội dung (>= 40 ký tự sau khi nén khoảng trắng, bỏ khối tham chiếu :0). Sujato có chữ ở 14
  khoá ⇒ 14/23 = 0,6087, THẤP HƠN ngưỡng 0,8. Nhưng content/meta/en/sn/sn44.11.yaml ĐÃ
  TỒN TẠI, status published, và content/translation/en/project/sutta/sn/sn44.11…json đã có
  đúng 9 khoá lấp, phủ hết 9/9 khoá Sujato im lặng trên Pāli có nội dung (2.3 · 2.6 · 3.4 ·
  3.6 · 3.7 · 3.9 · 3.10 · 3.11 · 3.12) ⇒ coverage hợp nhất là 23/23 = 1,0. Vì vậy KHÔNG
  có blocker về coverage, KHÔNG cần thêm entry trong content/meta/reference-gaps.yaml (đã
  kiểm: file đó không có record cho sn44.11, nên không có gì thừa). Tôi không ghi bất kỳ
  khoá lấp nào ở tầng Anh — lớp đó đã đủ, và tôi không được sửa content/translation/en/.

  PHE DẤU `ti` — ĐO Ở PHẠM VI GẦN NHẤT (cùng phẩm), SỐ ĐÃ CŨ ĐÃ LỖI THỜI. Đo bằng script
  trên tầng Việt, chỉ những khoá mà Pāli kết bằng <nháy>ti + dấu câu: TOÀN TẦNG GIỮ 3.500 ·
  BỎ 14.212 (mẫu 17.712); riêng sn44 GIỮ 17 · BỎ 38 (mẫu 55). Cả hai phạm vi đều nghiêng
  BỎ, và phạm vi gần nhất nghiêng rõ hơn. Bài này vì vậy BỎ `ti` ở MỌI khoá: bản Việt có
  0 lần chữ `ti`, trên 13 khoá mà Pāli kết bằng `ti`. Đây cũng là lựa chọn của sn44.6 (bài
  gần nhất trong phẩm, cùng đã bỏ ở mọi khoá). ⚠ CÒN PHÂN KỲ CHƯA GIẢI QUYẾT, người biên
  tập nên thống nhất: sn44.3 và sn44.10 (đều published) vẫn GIỮ ”ti? và ”ti. trong cùng
  công thức, nên trong phẩm này hiện còn hai cách.

  DÙNG LẠI NGUYÊN VĂN — đo bằng script, không đếm tay. Phân biệt hai loại trùng:
  (A) PĀLI TRÙNG NGUYÊN VĂN TRONG CHÍNH BÀI: 9 khoá thuộc 4 nhóm, và cả 4 nhóm chỉ có
  MỘT dạng Việt — [1.5, 2.2] · [1.8, 2.5] · [3.2, 3.5, 3.8] · [4.0, 5.0].
  (B) PĀLI TRÙNG NGUYÊN VĂN VỚI BÀI KHÁC: chỉ 2 khoá có nơi gốc với một dạng Việt duy
  nhất — 0.2 (= 10 tệp sn44) và 3.19 (= 61 tệp) — cả hai đã dùng lại nguyên văn. Bảy khoá
  còn lại có Pāli trùng nguyên văn nhưng nơi gốc TANG nhiều dạng, nên tôi đọc từng cặp
  thay vì cứ máy chọn: 1.6 · 1.9 · 2.3 · 2.6 mỗi khoá có 2 bản Việt khác nhau
  (sn16.12 dùng "Như Lai …" còn sn44.3 dùng "… Tứ Thế Tôn …"); 3.12 có 2 dạng; 4.0 và 5.0
  có tới 7 dạng vì "Tassuddānaṁ" là công thức chung của cả bộ.
  Ngoài ra còn dùng lại nguyên văn khi Pāli trùng nhưng không xét theo từ khoá: 1.3 y nguyên
  sn44.6:1.3 (Pāli giống hệt, chỉ khác tên); vế "được hỏi như vậy, ông nói:" ở 3.1/3.4/
  3.7/3.10 y nguyên sn44.6:1.5; "cái nhân và cái duyên ấy, được cho dứt tận, dứt sạch, dứt
  hẳn, không còn sót lại chút nào" ở 3.14 y nguyên sn35.234:4.3; "trú tại làng Ñātika,
  trong ngôi nhà gạch" ở 1.1 có 3 tệp tiền lệ.

  `tathāgato` → "Như Lai", đo trên toàn tầng: 205 khoá dùng "Như Lai" và 30 khoá dùng
  "Tứ Thế Tôn"; riêng sn44 là 59 và 30. Chọn "Như Lai" vì đa số ở cả hai phạm vi, và vì
  bốn khoá ở 1.6/1.9/2.3/2.6 có PĀLI TRÙNG NGUYÊN VĂN từng chữ với sn16.12 (cùng tình
  huống Sabhiya Kaccāna với du sĩ Vacchagotta) nên dùng lại đúng câu chữ nơi gốc. Đây là khác
  biệt CỐ Ý so với sn44.3 (cùng phẩm, dùng "Tứ Thế Tôn"); người biên tập nên chọn một cách
  cho cả phẩm.

  CỜ GIẢ CỦA CHỐT `lọt_pāli` — ĐÃ TRA CHỨNG, ĐÃ KHAI, KHÔNG SỬA `_hvi.py`. Chốt báo Pāli lọt
  cho từ mang dấu Pāli mà tầng Việt chưa từng dùng, nên nó chặn đúng LẦN DÙNG ĐẦU TIÊN của
  một tên hợp lệ — và nó còn có một điểm mà tôi phải nói rõ: chốt dò CHÍNH tầng
  content/translation/vi/project/, tức tới cả tệp của chính lát này. Nên nếu tôi kiểm sau khi
  ghi thì tên nào đã lọt vào tệp tôi sẽ tự qua cổng một cách vòng tròn. Tôi đã dựng lại bộ
  từ của tầng với tệp của tôi BỊ LOẠI RA rồi thử lại: đúng 3 khoá (4.1, 5.2, 5.4) là trường
  hợp này. Cả ba đã được chứng minh là tên bài kinh thật trong tầng Pāli đã ghim —
  Anurādhā = sn44.2:0.3 "Anurādhasutta" (bài ngay kế bài này), Mātugāma = sn17.21:0.3 và
  sn37.1:0.3 "Mātugāmasutta", Saṅkhata = sn43.12:0.3 "Asaṅkhatasutta" (cùng nhóm tên) — rồi
  khai vào bộ nhớ tiến trình `_hvi._GIỮ`, đúng như docstring của chính `lọt_pāli` chỉ định.
  Kutūhalasālā cũng được khai dù không bị chặn (đã có trong Pāli khoá của nó); nó không xuất
  hiện trong bản dịch vì tôi dùng "Tòa Tranh Luận" theo sn44.9:0.3. Cần người điều phối biết
  để lát sau tái lập được.

  KỆ uddāna (4.1–4.5, 5.1–5.5) — giữ tên bài kinh dạng Pāli, y cấu sn21.12:5.x và
  sn34.55:3.x. Tên Anurādhā, Mātugāma, Saṅkhata, Citta, Gāmaṇi, Sāmaṇḍaka, Jambukhādaka
  đều tra được trong Pāli đã ghim; Citta · Sāmaṇḍaka · Jambukhādaka · Nanda đã có sẵn trong
  tầng Việt (nên chốt không chặn), ba tên kia thì không — đã khai như trên. "Tòa Tranh Luận"
  ở 4.4 là tên đã dịch của chính sn44.9, giữ cho nhất quán trong phẩm.

  `rūpīti vā arūpīti vā saññīti vā asaññīti vā nevasaññīnāsaññīti vā` (3.14, 3.15) — ĐO ĐỘT
  ĐẦU: công thức đủ 5 vế này xuất hiện ở 11 khoá trên toàn tầng Pāli và 0 trong số đó có bản
  Việt, tức KHÔNG có tiền lệ để dùng lại. Tôi dựng từ Pāli, ghép các mảnh đã có trong tầng:
  "thuộc sắc" 6 lần, "thuộc vô sắc" 16 lần, "có tri giác" 2 lần, "vô tri" 14 lần.
  Vì vậy hạ nhẹ `terminology` xuống 9.3 và nói thẳng ở đây: năm vế này là chỗ dịch bằng
  phán đoán của tôi nhiều nhất trong bài, và người biên tập nên đối chiếu lại với một bản
  Anh khác khi có.

  BẤT ĐỊNH ĐÃ GHI — 3.18 `Yassapassa, āvuso, etamettakena ettakameva tampassa bahu, ko
  pana vādo evaṁ abhikkante` là chỗ khó và có biến thể ngay trong tầng ghim: chữ `Yassapassa`
  và cụm `ettakameva tampassa bahu` không có nghĩa rành mạch, và tôi đã tra thì cả cụm này
  không xuất hiện ở bất kỳ bài nào khác trong tầng Pāli đã ghim. Tôi dịch theo nghĩa chắc
  chắn nhất mà Pāli vẫn cho phép — "trong thời gian này mà chỉ học được chừng này thôi mà
  đã là nhiều" — và KHÔNG bịa thêm ý nào. Đây là lý do hạ `ambiguity_integrity` xuống 9.2.
  3.3/3.6/3.9/3.12 có `vadesi` ("ông nói") mà Sujato ở các khoá trống bỏ; tôi giữ lại vì đó là
  chữ có nghĩa và nó nối về "được hỏi như vậy, ông nói:" ở 3.1.

  TRIANGULATION 8,8. Đã đối chiếu Pāli root + bản Anh Sujato đã ghim của chính bài. Tầng Anh
  của bài im lặng 9 khoá, nhưng content/meta/en/sn/sn44.11.yaml ghi chúng là "English fill",
  tức lớp lấp english-project, KHÔNG phải bản dịch độc lập của Sujato. Vì lớp lấp đó do cùng
  họ công cụ với bản Việt này nên không phải lớp đọc Anh độc lập; bản Việt hiện hành thì
  không có ở commit đã ghim. Tôi vì vậy KHÔNG tuyên bố đã đối chiếu English cho toàn bài.

  NĂM PHÉP KIẾM — tự chạy, mỗi phép in số khoá so sánh, vì `_hvi.py` không đủ: (1) set(khoá
  Việt) == set(khoá Pāli) khớp 53/53, 0 thiếu, 0 thừa, NFC sạch 53/53. (2) Nhấy đơn ‘ ’:
  điều kiện đúng là KHỚP TỪNG KHOÁ VỚI PĀLI chứ không phải "mỗi khoá tự cân" — vì Pāli chính
  bài này CỐ TÌM để nháy đơn chạy qua khoá (3.2 mở → 3.3 đóng), bản Việt y hệt, và nếu bắt
  "mỗi khoá tự cân" thì chính Pāli cũng fail; 8 khoá lệch trong bản thảo (3.2/3.3, 3.5/3.6,
  3.8/3.9, 3.11/3.12) và 0 khoá có nháy khác Pāli, cộng dồn cả bài = 0; đối chiếu hàng xóm:
  sn44.3 lệch 4 khoá ở cả Pāli lẫn Việt, sn44.6 lệch 2 ở cả hai, đều khớp. Nháy kép “ ”
  cân trên cả 53 khoá (= 0). (3) 4 nhóm trùng nguyên văn trong bài, 0 nhóm mà bản Việt khác.
  (4) ⚠ KHÔNG ĐO ĐƯỢC GÌ, ĐÂY KHÔNG PHẢI "PASS": Pāli bài này có 0 khoá `…pe…` và 0 khoá
  `…` trần, nên cổng dấu lược không có mẫu để so; bản Việt cũng 0, và tôi không tự thêm dấu
  lược nào. (5) mọi con số trong notes này đều lấy từ script.

  technical_integrity 9,6: lát này không được chạy `npm run validate`, `npm test`,
  `npm run check`, `npm run build`, nên tôi KHÔNG tuyên bố technical gate pass. Bốn lệnh đó
  còn lại cho người điều phối. Thay vào đó tôi đã tự kiểm bằng harness `_hvi.kiểm()` (NFC,
  không trùng nguyên văn Pāli ở thân khoá, không Pāli lọt, dấu lược khớp từng khoá, nháy kép
  cân cả bài) cộng năm phép kiếm ở trên.