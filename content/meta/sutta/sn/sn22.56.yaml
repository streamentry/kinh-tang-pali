notes: |-
  Đợt 19, lát lane19. Dịch từ Pāli root đã ghim, đối chiếu English Sujato đã ghim; dịch đủ 76 khoá (0 khoá ngoài tập khoá Pāli). Bài Upādānaparipavattasutta (Kinh Các Vòng Của Thủ Uẩn), phẩm Upayavagga.

  **Coverage Anh trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): Sujato 23/31 = 0,7419 — dưới ngưỡng 0,80.** Sujato để trống 8 khoá có nội dung (`1.7`, `7.1`, `7.2`, `8.1`, `11.1`, `11.2`, `12.1`, `12.3`); thêm 7 khoá ngắn hơn 40 ký tự cũng trống (`6.8`, `8.2`, `9.8`, `9.9`, `10.8`, `12.2`, `15.4`). Lớp `english-project` của dự án đã `published` và lấp đủ 15/15 khoá trống nên cổng máy tính cả hai lớp là 31/31, nhưng lớp lấp là bản dịch của chính dự án từ Pāli, **không phải đối chiếu English độc lập**; theo quy tắc đã đặt, bài giữ `draft` kèm blocker cho tới khi người biên tập phán định hoặc có tầng Anh độc lập. `triangulation` hạ xuống 7,4 vì không có tầng Việt hiện hành cho bài này (tầng `vietnamese-current` chỉ có Pháp Cú) và 8 khoá có nội dung thiếu English độc lập. Bản dịch tiếng Việt không bị ảnh hưởng: mọi khoá dịch trực tiếp từ Pāli.

  **Dấu lược.** Pāli có 13 dấu lược (mỗi `…pe…` một dấu; kể cả `…` trần ở `2.3`, `2.4`, `2.5`); bản Việt giữ đúng 13, từng khoá khớp Pāli, không bung thành văn. Dấu ngoặc: Pāli chỉ có `“` ở `1.2` và `”` ở `15.3`; không có nháy đơn; bản Việt khớp từng khoá. Vì Pāli `1.5` kết bằng `abhisambuddhoti paccaññāsiṁ` không có nháy nên bản Việt không đặt nháy quanh lời tuyên bố.

  **Khoá Pāli trùng nguyên văn trong bài.** 15 cặp Pāli trùng (sau khi gộp khoảng trắng), 0 cặp Việt khác nhau: `4.2`=`7.2`=`11.2`=`14.2`; `3.7`=`6.8`=`10.8`=`13.8`; `8.2`=`9.9`; `12.2`=`15.2`; `5.3`=`12.3`. `5.2` (`Ye suvimuttā te kevalino.`, không dấu phẩy) và `12.2`/`15.2` (có dấu phẩy) khác nhau ở một dấu câu Pāli nên chỉ cùng bản Việt, không tính là cặp trùng byte. `9.8` có hai dấu lược nên Việt giữ hai dấu `…`, khác `3.7`.

  **Số Pāli.** Chỉ có `pañca` = năm (thủ uẩn), `catu-` = bốn (bốn vòng, bốn đại), `cha` = sáu (sáu thọ thân, tưởng thân, tư thân, thức thân), `aṭṭhaṅgiko` = tám (Thánh đạo tám ngành), `Catutthaṁ` = thứ tư. Không có số lớn, không có `sahassa`/`sata`/`tālīsa`.

  **Thuật ngữ (đếm trên tầng Việt dự án).**
  - `abhiññāya`/`abbhaññāsiṁ` → *thắng tri*: tiền lệ `ps1.1` (*thắng tri*), `sn35.13`/`sn35.14` (*như thật thắng tri*), `an10.107`; `sn22.26` dùng *liễu tri* cho cùng công thức `yathābhūtaṁ nābbhaññāsiṁ` — chọn *thắng tri* cho nhất quán với `abhiññāya` trong chính bài.
  - `catuparivaṭṭaṁ` → *qua bốn vòng*; tiền lệ gần nhất `an8.64` dịch `aṭṭhaparivaṭṭaṁ` là *qua tám đợt*, dạng *vòng* dùng cho `ñātiparivaṭṭaṁ` (`an4.198`, `dn10`). Chọn *vòng* vì bốn khía cạnh (sắc, sinh khởi, chấm dứt, con đường) lặp quay lại cho từng uẩn.
  - `paccaññāsiṁ` → *tuyên bố*: `sn22.26`, `sn35.13`, `sn35.14`, `sn48.21`, `sn48.28`, `sn14.31` (*tuyên bố*) so với *tự nhận* ở `an3.103`, `an3.104`, `an8.64`; sn đa số *tuyên bố*.
  - `upādānakkhandha` → *thủ uẩn* (`sn45.178`, `an9.66`; `sn22.107`–`110` dùng *uẩn của sự tham trữ*). `Rūpupādānakkhandho…` → *Sắc thủ uẩn, thọ thủ uẩn, …* theo `an9.66`, `dn33`.
  - `mahābhūtā … upādāya rūpaṁ` → *bốn đại và sắc do bốn đại tạo thành* (`mn28:4.2`).
  - `āhāra` → *thức ăn* (`sn47.42:1.4`, `an4.159`, `iti43`); khung `Āhārasamudayā rūpasamudayo` theo `sn47.42:1.4` (*Do sự sinh khởi của … mà có sự sinh khởi của …*), thêm *mà có* cho rõ.
  - `samudaya` → *sinh khởi*, `nirodha` → *chấm dứt* (`sn22.113`, `sn22.114`); riêng `nibbidāya virāgāya nirodhāya` → *nhàm chán, ly tham, đoạn diệt* theo `sn22.58` (cùng công thức; *nhàm chán* 17 so với các dạng khác ở sn).
  - `anupādā vimuttā` → *không chấp thủ mà được giải thoát* (`sn22.58`).
  - `ariyo aṭṭhaṅgiko maggo … seyyathidaṁ—` → *Thánh đạo tám ngành … tức là:* (sn: *Thánh đạo tám ngành* 39 so với *bát thánh đạo* 7; `mn9`, `dn22`; kết `tức là:` theo `an3.61`).
  - `sammādiṭṭhi …pe… sammāsamādhi.` → *chánh kiến … chánh định.* (`an3.71`, `mn9:18.3`, `mn9:22.10`).
  - `samaṇā vā brāhmaṇā vā` → *sa-môn hay bà-la-môn* (sn22: 6 so với *sa-môn và bà-la-môn* 1; toàn tầng 141 so với 16).
  - `imasmiṁ dhammavinaye` → *pháp và luật này* (toàn tầng 78 so với *giáo pháp và giới luật* 10).
  - `vedanākāyā`/`saññākāyā`/`cetanākāyā`/`viññāṇakāyā` → *thọ thân, tưởng thân, tư thân, thức thân* (`dn33:2.2`, `mn137`); `sañcetanā` → *tư về …* (`dn33:2.2.17`); sáu loại xúc → *thọ sinh do xúc mắt …* (`dn33`).
  - `vaṭṭaṁ tesaṁ natthi paññāpanāya` → *không có vòng luân hồi để chỉ định cho họ* (`ud6.8:5.7`, *không có sự luân hồi để chỉ định cho họ*; `vaṭṭa` = *vòng luân hồi* ở `dn15`).
  - `Sāvatthinidānaṁ.` → *Tại Sāvatthī.* (sn22: 112 so với các dạng khác tổng 7).
  - `0.2` → *6. Phẩm Dính Mắc* theo `sn22.53`, `sn22.54`, `sn22.58`, `sn22.60` (`sn22.59` dùng *Phẩm Trói Buộc*, đã lệch tầng).
  - `Catutthaṁ.` → *Thứ bốn.*: sn22 *Thứ bốn.* 8 so với *Thứ tư.* 5; toàn sn 72 so với 45 (cả hai số vì phạm vi toàn tầng và sn22 cho cùng chiều nhưng sát nhau).

  **Bất định, không thêm vào thân kinh.**
  1. `gādhanti` (`4.2`, `7.2`, `11.2`, `14.2`): không tìm thấy tiền lệ nào trên tầng Việt dự án (0 khoá). Dịch *có được chỗ đứng* theo nghĩa gốc (đứng vững, có chỗ đặt chân), phù hợp *have a footing* của Sujato; chưa phân xử được sắc thái (đứng vững / thâm nhập).
  2. `kevalino` → *bậc viên mãn* theo `an10.12` (`kevalī` = *viên mãn*) và `snp3.5`; `an4.8`, `an3.57` dùng *trọn vẹn / hoàn tất* cho `kevalī`. Sujato *consummate ones*. Có thể đổi nếu người biên tập chọn *trọn vẹn*.
  3. `1.5`/`1.6`/`1.7`: Pāli `1.6` kết bằng `…pe…` và `1.7` nối giữa câu bằng `sadevamanussāya`. Đọc `sadevamanussāya` như cụm với `pajāya` (*quần chúng … cùng chư thiên và loài người*) rồi chuyển thành *cùng chư thiên và loài người* nối sau dấu lược ở `1.6`; không thêm từ ngoài Pāli. Sujato nuốt cụm này vào cuối `1.6`, nên bản Anh đã ghim lặp lại phần đó.
  4. Lệch giữa tầng Anh đã ghim và Pāli ở dấu lược (không sửa được ở đây): `6.7`, `9.7`, `10.7` Pāli kết `seyyathidaṁ—` còn Sujato thêm `…`; bản Việt theo Pāli (kết `tức là:`).

  **Cổng kỹ thuật.** Bị cấm chạy cổng, nên không tuyên bố technical gate pass; `technical_integrity` đặt 9,6. Bốn lệnh còn lại chưa chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  **Giải quyết draft 2026-10-12.** Thay thế phần "giữ `draft` kèm blocker" ở đoạn Coverage Anh phía trên. Đọc đối kháng lại toàn bài (76 khoá) từ Pāli, đối chiếu tiền lệ trên tầng Việt dự án; không có khoá nào đổi (0/76 lỗi nghĩa thật).
  - Blocker cũ (độ phủ Sujato 23/31 = 0,742 dưới ngưỡng 0,80) thuộc loại do tác giả cũ tự đặt, không phải lỗi văn bản; theo cổng của kho, mất mát chỉ cần được ghi nhận ở hồ sơ khoảng trống tham chiếu. Đã gỡ sau khi đọc kỹ 8 khoá Sujato để trống có nội dung (`1.7`, `7.1`, `7.2`, `8.1`, `11.1`, `11.2`, `12.1`, `12.3`): tất cả đều là lặp nguyên công thức đã xuất hiện ở khoá khác cùng bài, nên tự đứng vững từ Pāli — `1.7` là phần cuối của công thức tuyên bố ở `1.5` (cùng `sadevamanussāya anuttaraṁ sammāsambodhiṁ abhisambuddhoti paccaññāsiṁ`); `7.1`/`7.2` lặp `4.1`/`4.2` với `vedanā` thay cho `rūpa`; `8.1` là dạng lược `…pe…` của `5.1`; `11.1`/`11.2`/`12.1`/`12.3` lặp `4.1`/`4.2`/`5.1`/`5.3` với `saṅkhāra`. Bản Việt các khoá này khớp từng chữ với khoá tương ứng đã đối chiếu được với Sujato (15 cặp Pāli trùng, 0 cặp Việt khác, đã đo ở trên).
  - `triangulation` giữ 7,4 (không nâng): không có bản Anh độc lập cho 8 khoá có nội dung, và tầng Việt hiện hành không có bài này (tầng `vietnamese-current` chỉ có Pháp Cú — giới hạn tham chiếu, không phải lỗi văn bản).
  - Kiểm lại tiền lệ: `gādhanti` → *có được chỗ đứng trong pháp và luật này* khớp `sn22.57` (4 khoá); `0.2` *6. Phẩm Dính Mắc* khớp `sn22.53`–`sn22.62`; `Thứ bốn.` theo đa số `sn22` (9 so với 6 `Thứ tư.`, kể cả bài này). Bất định về `gādhanti` và `kevalino` ở trên vẫn giữ nguyên.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): sn22.56:15.4 — `catuttha` dịch số thứ tự “thứ bốn” → “thứ
  tư” (dạng chuẩn của số thứ tự tiếng Việt). Giữ nguyên phần còn lại của từng khoá.
