  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `sn23.23:1.2` — «Ngồi xuống một bên rồi, Tôn giả Rādha bạch Đức Thế Tôn» → «Ngồi xuống một bên, Tôn giả Rādha bạch Đức Thế Tôn» (`ekamantaṁ nisinno` không có chữ «rồi»; theo `sn23.1:1.2`, `sn23.2:1.2`); giữ «Tôn giả … bạch» thay cho «trưởng lão … nói với» của dạng đa số (11 khoá) vì `āyasmā` là «Tôn giả» chứ không phải «trưởng lão» (`thera`), và người nghe là Đức Thế Tôn.
