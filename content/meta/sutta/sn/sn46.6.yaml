notes: |-
  Dịch từ Pāli root commit 11c9d708.
  Đối chiếu bản dịch tiếng Anh của Bhikkhu Sujato đã ghim.
  Coverage tầng Anh đạt 46/46 substantive segments = 100.0%, không có gap dưới sàn.
  59/59 khoá khớp Pāli root tuyệt đối.
  Nháy kép và đơn khớp 1:1 với Pāli từng khoá.
  11 dấu lược … cân bằng chính xác với Pāli.
  Chuỗi nhân duyên giải thoát: phòng hộ các căn (indriyasaṁvaro) → 3 diệu hạnh (tīṇi sucaritāni) → 4 niệm xứ (cattāro satipaṭṭhānā) → 7 giác chi (satta bojjhaṅgā) → minh và giải thoát (vijjāvimutti) dịch nhất quán.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá sn46.6:8.3 — «tu tập xả giác chi nương vào viễn ly, nương
  vào ly tham, nương vào đoạn diệt, hướng đến từ bỏ» → «tu tập xả giác chi, y cứ vào viễn ly, y cứ vào ly
  tham, y cứ vào diệt tận, và hướng đến buông bỏ» (cách đa số 16/26 khoá trong cùng Tương Ưng Giác Chi, Pāli
  `vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ`); khoá sn46.6:8.2 (cùng công thức, quét
  cả bài) sửa tương tự để hai khoá liền nhau không lệch; nghĩa không đổi.
