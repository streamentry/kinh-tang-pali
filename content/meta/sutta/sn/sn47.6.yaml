notes: |-
  Dịch từ Pāli root (bilara đã ghim), đối chiếu Anh Bhikkhu Sujato. ĐO LẠI: 26/26 khoá Pāli có nội dung đều có chữ Anh ⇒ coverage 1,000. Không dùng bản lấp Anh của dự án.
  Bản Việt hiện hành (Hòa thượng Thích Minh Châu) không có: tầng `vietnamese-current` tại commit đã ghim chỉ có 26 chương Pháp Cú.
  PĀLI TRÙNG NGUYÊN VĂN: 16/40 khoá có Pāli giống hệt tệp đã có; cả 16 khoá đều dùng lại NGUYÊN VĂN bản Việt: 0.2 (`sn47.1:0.2`) · 3.6–3.10 (`sn45.30:1.9–1.13`) · 4.1, 4.2 (`dn26:1.14/1.15`) · 4.4 (`sn46.25:1.4`) · 4.7–4.9 (`sn47.14:3.2–3.4`) · 4.10 (`sn52.4:2.6`) · 3.5 (`sn16.13:4.2`) · 4.6 (`sn22.103:1.3`).
  ẨN DỤ CHÍNH DÙNG LẠI TIỀN LỆ `dn26` (đã publish): `gocare, bhikkhave, caratha sake pettike visaye` → `Này các tỳ-kheo, hãy đi trong lãnh vực của mình, nơi quen thuộc của cha ông` (4.1) và `Gocare … na lacchati māro otāraṁ, na lacchati māro ārammaṇaṁ` → `… Māra sẽ không tìm được chỗ xâm nhập, không tìm được đối tượng để nắm lấy` (4.2). Vì vậy `agocaro paravisayo` dịch `lãnh vực của người khác` (3.3, 3.11) và `otāraṁ`/`ārammaṇaṁ` ở 3.2 dịch `tìm được chỗ xâm nhập / tìm được đối tượng để nắm lấy` — cặp này phải đối xứng dấu với 4.2 trong cùng bài.
  BẤT ĐỊNH 1: `sakuṇagghi` → `bàng con`, `sakuṇa` → `cút`, `naṅgalakaṭṭhakaraṇaṁ leḍḍuṭṭhānaṁ` → `ruộng đã cày bằng, đầy những cục đất`. KHÔNG có tiền lệ nào trên đĩa cho cả ba (đã tra bằng chỉ mục Pāli→Việt của toàn tầng). Sujato dịch `hawk`/`quail`/`a ploughed field covered with clods of earth`. Người biên tập nên kiểm, nhất là khi `sn47.1`–`sn47.4` (cùng phẩm Ambapālī) được dịch.
  BẤT ĐỊNH 2: giới tính. Sujato dùng `she` cho bàng con; Pāli không phân định. Bản này giữ trung tính (`con bàng`, `bàng con`) để không nhập thêm ý từ bản Anh.
  BẤT ĐỊNH 3: 1.5 bàng con hỏi `Ko pana te, lāpa, gocaro sako pettiko visayo` — `te` là của NGƯƠI (nói với cút), nên dịch `lãnh vực của ngươi, nơi quen thuộc của cha ông`. Lượt review đối kháng đã bắt lỗi này: bản nháp đầu dịch `của mình … của ngươi`, trộn hai ngôi.
  DANH SÁCH GIÁC QUAN 3.6–3.10 dùng nguyên văn `sn45.30:1.9–1.13` (`đáng yêu, đáng mến, đáng ý, hình dáng đẹp, gắn với dục, quyến rũ`). Nói rõ: `sn45.30` chọn `là những thứ đáng yêu…` còn `sn45.176` chọn `đáng ưa, đáng thích, đáng ý, có sắc đẹp, quyện vào dục, và hấp dẫn` — hai cách đã publish cho cùng một vế; ở đây theo `sn45.30` vì 4 khoá của nó (1.10–1.13) trùng nguyên văn với 3.7–3.10 của bài này, dùng chung một cách thì danh sách không tự mâu thuẫn.
  DẤU NHÁY bám đúng nhịp Pāli: lời Đức Thế Tôn mở ở 1.1 và khép ở 4.11 (Pāli cũng vậy — xem `sn47.3:1.6`→`2.14` là cùng cách); lời cút dùng `‘…’` cân tại 1.3–1.4, 1.5, 1.6, 1.8, 2.2. Tổng cân trên toàn bài, không bao giờ âm.
  DẤU LƯỢC: 3.7–3.9 và 4.8–4.9 có `…pe…` trong Pāli, giữ đúng MỘT `…`. Bốn khoá lược tròn 3.7–3.9 cũng giữ `…` vì Pāli vốn vậy.
  CỔNG KỸ THUẬT: bốn lệnh do coordinator chạy; technical_integrity 9,6. Đã tự kiểm bằng `_hvi.kiểm()` — 40/40 khoá sạch.
