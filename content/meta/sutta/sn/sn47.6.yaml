notes: |-
      Nguồn: đúng uid sn47.6, Pāli root bilara đã ghim; tầng Anh đã ghim là bản Bhikkhu Sujato cùng commit. Tầng Việt hiện hành không có cho bài này (snapshot upstream chỉ phân phối Pháp Cú) — đặc điểm của snapshot, không phải thiếu sót của repo.
      Coverage đo bằng đúng quy tắc trong source/layers.yaml: 26/26 segment có nội dung đều có tiếng Anh = 100%. Không có mất tầng tham khảo nào.
      Trùng nguyên văn: 9/40 khoá có Pāli trùng tuyệt đối với khoá đã dịch ở bài khác — 3.6 với an9.65:1.3, 3.7 với an9.65:1.4, 3.8 với mn59:6.5, 3.9 với mn59:6.6, 3.10 với mn105:7.7, 4.1 với dn26:1.14, 4.2 với dn26:1.15, 4.7 với mn10:3.2, 4.10 với sn52.4:2.6; dùng lại nguyên văn bản Việt cho các khoá này. 3.8/3.9 chỉ dùng lại cụm mở đầu của bản gốc vì Pāli ở đây bị lược bằng `…pe…` còn Pāli bên kia thì không; phần sau dấu lược dịch theo cùng công thức an9.65:1.5–1.6. Trong chính lát không có cặp trùng nội bộ nào ở sn47.6.
      Tiền lệ đo được: `1. Ambapālivagga` → «1. Phẩm Ambapālī» 5/5; `sakuṇagghī` → «kền kền» 16 lượt (ja164:0.4 «Kinh Kền Kền», sn19.4:1.2, mn13:22.2); `lāpo`/`sakuṇa` → «chim cút» 8 lượt (mn66:8.1, mn128:22.5, vv11:1.2); `gocaro sako pettiko visayo` → theo dn26:1.14; `na lacchati māro otāraṁ` → theo dn26:1.15; `lacchati māro otāraṁ, lacchati māro ārammaṇaṁ` → theo mn119:23.1; năm dục adiệu theo nguyên văn an9.65:1.3–1.7; tứ niệm xứ theo nguyên văn sn52.4:2.3–2.6.
      0 tiền lệ, đã tự tra và ghi lại:
        · `leḍḍu` / `leḍḍuṭṭhāna` (đống búp mê) — grep `búp mê` trên toàn tầng Việt cho 0 lượt. Dùng «búp mê», là từ Việt thông dụng và đúng nghĩa hòn đất vụn.
        · `naṅgalakaṭṭhakaraṇa` (ruộng đầy búp mê) — grep `cày bừa` cho 0 lượt. Dùng «cánh đồng cày bừa có những đống búp mê»; `kāraṇa` ở đây là nơi chứa đầy ấy, không phải "nguyên nhân", nên không dịch là «vì lý do».
        · `Sakuṇagghisutta` (tiêu đề 0.3) — không có bản Việt nào trong tầng. Dùng «Kinh Chim Cút Và Chim Kền Kền», nêu đủ hai loài vì bài kể cả hai; bản Anh đã ghim để trống ở 0.3.
      Bất định đã ghi, không giấu:
        1) `mayamevamha alakkhikā, mayaṁ appapuññā` — hai vế tương ứng nhau trong tiếng Pāli và Sujato dịch "I’m so unlucky, of so little merit". Dịch «Tôi thật khốn khổ, tôi thật bất phúc». `appapuññā` nguyên nghĩa là «ít phước», nhưng ở đây là tiếng than của con vật, nên «bất phúc» giữ được sắc thái mà vẫn hiểu được ngay.
        2) `apaṇṇatī` / `apatthaddhā sake bale asaṁvadamānā` (1.7 và 2.3) dịch «tự tin vào sức mình, không e dè, không sợ hãi». Hai khoá lặp nguyên văn cụm này nên dịch giống nhau có chủ ý; Sujato dịch "Confident in her own strength, not daunted or intimidated" — nghĩa giữ nguyên.
        3) `āyāmaka` / `na mokkhasī` (1.8) dịch «ngươi có sang đó nữa cũng không thoát khỏi ta đâu»; `mokkhasi` ở đây là động từ "thoát khỏi tay" chứ không phải mệnh đề "sẽ được giải thoát", nên không dịch theo nghĩa Phật học của chữ.
        4) `agocare carati paravisaye` dịch «ở ra ngoài lãnh thổ của mình mà vào chỗ của người khác», theo đúng dn26:1.14–1.15 của bài cùng ý này; `gocare caratha sake pettike visaye` dịch «ở trong lãnh thổ của mình, nơi quen thuộc của cha ông».
      Dấu lược: 5 khoá có `…pe…` (3.7, 3.8, 3.9, 4.8, 4.9), mỗi khoá giữ đúng MỘT `…`. Ở 3.7–3.9 bị lược là danh sách tính chất của âm thanh, mùi, vị; ở 4.8–4.9 là hai niệm xứ còn lại — cả hai đã nêu đủ ở 3.6, 3.10 và 4.7, 4.10 trong chính bài nên không mất nghĩa.
      Kiểm tra: `_hvi.py` bắt được 0 lỗi (40/40 khoá, NFC, ngoặc kép cân trên cả bài — 1.1 mở và 4.11 đóng, đúng như Pāli, không trùng nguyên văn Pāli ở khoá có nội dung, không lọt Pāli). Lượt review đối kháng bắt được một lỗi thật ở bản nháp: 1.3 dịch `agocare carimha` thành «đã rời lãnh thổ của mình» — bỏ mất động từ `cari` (lang thang), đã sửa thành «đã lang thang ra ngoài lãnh thổ của mình». Cả 40 khoá đã in ra đọc từng cặp.

