  Soạn từ Pāli root, đối chiếu Anh Sujato (26/29; 3.3/3.6 do english-project lấp,
  3.10 Navamaṁ mốc kết cấu). Tên Medakathālikā 0 tiền lệ trong tầng Việt: đã tra chứng
  Pāli (chủ cách tại 1.5/1.9, hô/vấn cách các khóa còn lại) rồi seed bộ nhớ tiến trình
  cho chốt lọt-Pāli, không sửa _hvi.py. Sedaka/Sumbha thuần ASCII nên không vướng chốt.
  Tiền lệ: 2. Phẩm Nālanda (2); thị trấn… của người… (mn10:1.2); Thuở xưa (28);
  Này bạn + tên (an3.21); Vâng thưa thầy (1); leo lên; tu tập niệm xứ (1); sáu nội xứ;
  gần gũi-tu tập-làm cho sung mãn (āsevitā-bhāvitā-bahulīkatā); kham nhẫn (47); tâm từ;
  lòng trắc ẩn (5). 0 tiền lệ: caṇḍālavaṁsika→người biểu diễn sào tre thuộc tầng lớp hạ tiện;
  rakkhati→giữ gìn; sippa→trổ tài nghệ; lābha→tiền công; ñāya 2.1→cách làm đúng.
