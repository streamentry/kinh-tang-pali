notes: |-
  TẦNG THAM KHẢO THIẾU THẬT, và đây là lý do bài ở `draft` chứ không phải do điểm số. Sujato có
  mặt nhưng im lặng ở 15/35 khoá Pāli có nội dung; dự án chưa có lớp lấp `english-project` cho
  `sn14.17`. Một ô Anh trống KHÔNG phải sự đồng thuận về cách dịch — 15 vế đó phải tự đứng vững
  bằng Pāli. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit đã
  ghim chỉ có 26 chương Pháp Cú.

  NHÓM `Dhātusova` dùng lại nguyên văn của `sn14.14`, `sn14.18` và `sn14.22` (cùng Pāli, đã
  publish), nên bài không tự mâu thuẫn với bài anh em. Bốn khung thời gian phân biệt đúng —
  đây là phần dễ hỏng nhất của bài: `samenti` ở hiện tại → *hòa hợp và tụ hội*;
  `saṁsandiṁsu samiṁsu` ở quá khứ → *đã hòa hợp và tụ hội*; `saṁsandissanti samessanti` ở vị
  lai → *sẽ hòa hợp và tụ hội*. Ở `:2.2`–`:2.8` (quá khứ) và `:3.2`–`:3.8` (vị lai) không có
  tiền lệ cùng Pāli trong tầng Việt, nên tôi dựng từ đúng bộ từ đã chốt ở `sn14.14` và giữ
  nguyên bộ đó, không tự đặt từ mới.

  Bảy điều kiện đi cặp nhau ở `:1.3`–`:1.9` và `:4.2`–`:4.8` (assaddhā / ahirikā / anottappino /
  appassutā / kusītā / muṭṭhassatino / duppaññā) và tám điều kiện ở `:5.2`–`:5.8` (saddhā /
  hirimāna / ottappino / bahussutā / āraddhavīriyā / upaṭṭhitassatino / paññavanto). Mỗi cặp
  ghi rõ *hòa hợp và tụ hội với …* đúng một lần cho cả hai vế — không bỏ dấu thời ở vế nào.
  `duppaññā` → *Kẻ kém trí* (tiền lệ `sn14.23:1.7`, `sn14.24:1.7`). `bahussutā` → *Kẻ đa văn*
  (tiền lệ `sn14.21:1.6`). `āraddhavīriyā` → *Người tinh tấn* (tiền lệ `sn14.22:1.6`).
  `upaṭṭhitassatino` → *người an trú niệm* (2 tiền lệ, `sn14.21:2.5`, `sn14.18:6.6`).

  DẤU LƯỢC: Pāli có `…pe…` ở sáu khoá — `:3.4`–`:3.7`, `:4.3`–`:4.6`, `:5.9`, `:5.10`,
  `:5.12`. Bản Việt giữ **đúng một** `…` mỗi khoá và KHÔNG mở rộng. Ở bốn khoá lược ngay sau
  `saddhiṁ` (`:3.4`–`:3.7`, `:4.3`–`:4.6`) tôi dịch `saddhiṁ` thành *cùng* rồi đặt `…`, vì Pāli
  đã cắt trước động từ; ở `:5.9` và `:5.10` chỉ có *trong quá khứ* / *trong vị lai* rồi `…`.

  Dấu ngoặc kép: `“` mở ở `:1.2` và đóng ở `:5.13` (`”ti`), đúng như Pāli. `ngoặc()` của
  `_hvi.py` xác nhận cân trên cả bài.

  BẤT ĐỊNH đã ghi, không giấu:
  1. Tiêu đề `:0.3` `Assaddhasaṁsandanasutta` chưa có tiền lệ trong tầng Việt. Bài anh em
     `sn14.18` mang Pāli khác (`Assaddhamūlakasutta`) và đã dịch *Kinh Lấy Vô Đức Tin Làm Gốc*;
     Sujato đặt tên ngắn là *Faithless*. `saṃsandana` là mệnh đề trung tâm của cả bài, nên tôi
     chọn *Kinh Hòa Hợp Theo Vô Đức Tin* để giữ cả hai vế. Đây là cách đặt thứ N+1 — xin người
     điều phối thống nhất lại theo một công thức chung cho nhóm `saṃsandana` (gồm `sn14.14`
     *Kinh Lấy Hướng Hèn Hạ Làm Gốc* và `sn14.15` *Kinh Đi Hành Chung*).
  2. Ở `:5.11` Pāli bắt đầu bằng `etarahipi`, nhưng hai vế trước (`:5.9`, `:5.10`) đã bị lược, nên
     tôi mở đầu bằng *hiện tại* cho câu được nối tiếp. Đây là hệ quả của peyyāla, không phải tôi
     thêm chữ.

  HẠN CHẾ KỸ THUẬT: đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`, nên tiêu chí 10 bị chặn ở 9.6. Tôi chỉ xác minh được JSON hợp lệ, đủ 50/50
  khoá đúng exact ID, mọi giá trị NFC, ngoặc kép cong cân trên cả bài, dấu lược khớp Pāli từng
  khoá, không có khoá `(…)`. Người biên tập phải chạy lại bốn
  lệnh trên trước khi đổi trạng thái.

  Giải quyết draft 2026-10-12: đọc đối kháng lại toàn 50 khoá với Pāli và Sujato đã ghim.
  Các đoạn "TẦNG THAM KHẢO THIẾU THẬT" (đầu notes) và "BẤT ĐỊNH 2" ở trên được THAY THẾ bởi mục này.

  Blocker đã gỡ (loại B, độ phủ Anh dưới ngưỡng): Sujato có mặt nhưng để trống 24 khoá
  (`2.2`–`2.8`, `3.2`–`3.8`, `4.2`–`4.8`, `5.12`–`5.14`) và nối các vế liệt kê qua `…`; ngoài ra có
  `…` ở `2.1`, `3.1`, `4.1`, `5.9`–`5.11`. Đó là các vế lặp công thức theo ba thời, và bảy/tám cặp
  `X với X` đã được Sujato dịch đầy đủ ở `1.3`–`1.9` và `5.2`–`5.8`, nên chỉ còn khung thời gian
  và động từ chia thời là những thứ Pāli phải tự đứng vững. Pāli ở các khoá trống ngữ pháp
  thẳng: danh từ chủ thể số nhiều + cụ cách số nhiều + `saddhiṁ` + động từ (`saṁsandiṁsu samiṁsu`
  aorist, `saṁsandissanti samessanti` tương lai, `saṁsandanti samenti` hiện tại); không có từ
  nào mơ hồ. Bản dịch ở các khoá đó tự đứng vững từ Pāli, không có nghĩa chưa chắc, nên blocker
  được gỡ. Mất mát Anh vẫn là giới hạn thật của tầng tham khảo, nên `triangulation` giữ 8.0 và
  không cao hơn. Tầng `vietnamese-current` không có cho bài này (giới hạn tham chiếu, không phải
  lỗi văn bản).

  Sửa trong bản dịch (accuracy/clarity):
  1. `3.4`–`3.7`: Pāli lược trước động từ, nhưng bản Việt trước đó điền động từ ở thì hiện tại
     (*hòa hợp và tụ hội*) trong khung vị lai, lệch với `3.1`–`3.3` và `3.8` (*sẽ*). Đã thêm *sẽ*
     cho khớp khung thời của đoạn. `4.3`–`4.6` (khung hiện tại) và `5.12` giữ nguyên.
  2. `5.9`, `5.10`, `5.11`: Pāli có `-pi kho` (*cũng vậy*) ở cả ba (`atītampi`, `anāgatampi`,
     `etarahipi`); bản cũ làm rơi *cũng vậy* ở `5.9`, `5.10` và `5.11`. Đã trả lại, theo thứ tự
     Pāli (khung thời trước, `bhikkhave` sau).
  3. `5.13` `paññavanto` đổi *Người có trí* → *người có trí tuệ*, khớp với `5.8` (cùng Pāli, bản cũ
     để hai cách dịch trong một bài).
  4. `5.5` `bahussutā`: *Kẻ đa văn* → *người nghe nhiều*, đối ứng trực tiếp với `appassutā` =
     *người ít nghe* ở `1.6`, và không gọi người có đức hạnh là *kẻ*; cách này đã dùng ở `sn14.18:4.3`,
     `sn14.20:1.7` (`sn14.21:1.6` dùng *Kẻ đa văn*, xem là điểm lệch trong nhóm, không thuộc phạm vi bài này).
  5. Chữ hoa đầu khoá: các vế liệt kê đứng sau dấu `;` hay `…` được hạ chữ thường (`1.4`–`1.9`,
     `2.3`–`2.8`, `3.3`–`3.8`, `4.3`–`4.8`, `5.3`–`5.8`, `5.10`, `5.11`, `5.13`); bản cũ viết hoa
     ngẫu nhiên giữa câu. Chỉ là dấu chữ, không đổi nghĩa.
  Số khoá lỗi nghĩa thật: 0/50. Có sửa: 7 khoá lệch thời hoặc rơi *cũng vậy* (`3.4`–`3.7`,
  `5.9`–`5.11`), 1 khoá thuật ngữ không đồng nhất (`5.13`), 1 khoá chọn từ (`5.5`); phần còn lại
  là chữ hoa.

  Giữ nguyên, đã đo: *do giới tánh* cho `dhātusova` (nhóm `sn14.14`–`sn14.24` đều dùng); *không biết hổ
  thẹn* / *không biết sợ dữ* (`ahirikā` / `anottappino`) khớp `sn14.18`, `sn14.23`, `sn14.24`;
  *Kẻ kém trí* / *kẻ thất niệm* / *kẻ biếng nhác* khớp `sn14.18`, `sn14.21`, `sn14.22`; tiêu đề
  *Kinh Hòa Hợp Theo Vô Đức Tin* không đổi (`:0.3`), bất định tiêu đề (ghi ở trên) vẫn còn.
  Dấu `…` đúng một mỗi khoá lược, Pāli không có `(…)` trần. Hiệu chuẩn: tập khoá Việt = Pāli (50/50),
  ngoặc kép “ ” mở ở `1.2`, đóng ở `5.13`.
  Technical gate (`npm run validate`, `npm test`, `npm run check`, `npm run build`) chưa được chạy ở lượt này,
  nên `technical_integrity` giữ 9.6.
