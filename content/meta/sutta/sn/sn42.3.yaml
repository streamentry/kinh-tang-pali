notes: |-
      **⚠ QUYẾT ĐỊNH TÊN — cần người biên tập xác nhận.** `Yodhājīvasutta`: `yodhājīva` vừa là
      danh từ chỉ người (*người chiến sĩ*, `yodhājīvo gāmaṇi` = thôn trưởng chiến sĩ), vừa là
      **tên riêng** mà Sujato bịa thành *Dustin*. Tôi **không bịa tên** và dịch theo danh từ:
      *thôn trưởng chiến sĩ*, tiêu đề *Kinh Người Chiến Sĩ* — theo tiền lệ `an4.181:0.3`
      (*Kinh Chiến Sĩ*) chứ không phải `an3.133:0.3` (*Kinh Chiến Binh*; `yodhājīva` là
      **người**, không phải trận đánh).
      **DÙNG LẠI NGUYÊN VĂN — 6 khoá Pāli trùng nguyên văn:** `0.2` = `sn42.10:0.2` ·
      `1.6` = `mn85.7.9` (*Lần thứ hai, …*) · `3.4` = `mn57.4.5` · `3.9` = `sn12.13:2.13`
      (*Thứ ba*).
      **Ba khoá lặp nguyên văn trong bài** (`1.3`=`1.9`; `3.6` chỉ khác dấu `”ti`) — tôi dịch
      giống hệt, vì đây là **cùng một lời tuyên bố được lặp**, không phải lặp vô nghĩa.
      **Thuật ngữ, kèm đếm:** `gāmaṇi` → *thôn trưởng* (`sn42.10`) · `parajita` → *bị đánh bại*
      (0 tiền lệ) · `parajito nāma nirayo` → cõi địa ngục tên là *‘Kẻ Bại Trận’* (0 tiền lệ;
      Sujato *the hell called ‘The Fallen’*) · `ācariyapācariya` → *các thầy của thầy*
      (`dn13.18.5`, `dn13.22.7`) · `nikato vañcito paluddho` → *lừa gạt, lừa đảo, bẫy lừa*
      (`mn75.24.6` nguyên văn ba vế) · `parodi, assūni pavattesi` → *bật khóc, nước mắt chảy
      xuống* (`mn143.15.1`) · `tiracchānayoni` → *loài vật* (`mn57.3.4`, `mn57.5.4`).
      **Bốn chỗ phải phán xử, đã ghi:**
      (1) `mā vā ahesuṁ iti vā` (`2.5`) — có thể là *hoặc cho là chúng ta không hề tồn tại*;
      tôi theo nghĩa **phủ định sự tồn tại**, không đọc thành *hoặc cho là chúng ta đã chết*.
      (2) `pubbe gahitaṁ dukkaṭaṁ duppaṇihitaṁ` (`2.4`) — ba vế tính từ tới tâm:
      *đã bị chiếm giữ, khó khăn, khó chỉnh định*; Sujato đọc là *low, degraded, misdirected*.
      (3) `sahabyataṁ` (`1.3`, `2.9`, `3.6`) — *sinh ra cùng với chư thiên thuộc hàng kẻ bị đánh
      bại*; tôi giữ `parajita` ở cả ba chỗ thay vì đổi qua *thua trận*.
      (4) `micchādiṭṭhi` (`2.9`) — *tà kiến* (đa số toàn tầng).
      `1.1` có `…pe…` che nghiêng vụ đảnh lễ; bản Anh mở rộng thành *bowed* — theo quy tắc
      của kho **tôi giữ đúng một dấu lược và không thêm đảnh lễ**.
      **Tầng Anh đủ 100%** (19/19), `triangulation` 9.3. **Không đối chiếu được tầng Việt hiện
      hành.**
