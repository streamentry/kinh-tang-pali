notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `12. Balakaraṇīyavagga` → «12. Phẩm Công Sức». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Sửa lan 2026-10-13 (accuracy fix): `:1.2`, `:3.1`, `:4.1`, `:5.1` `… evamete balakaraṇīyā kammantā karīyanti` — *… đứng vững trên đất mà được thực hiện;* → *… đứng vững trên đất; như vậy các công việc ấy được thực hiện;* (`evaṁ` + `ete` là vế kết của hình ảnh, không phải "mà"; đồng bộ với `ps3.4:1.2` và `ps3.4:14.1`, cùng Pāli). Bài này không có `nissaraṇa`, nên không có thuật ngữ *xuất ly/thoát ly* nào cần xét ở đây; tiêu đề không đổi.

  Sửa lan 2026-10-13 (style-only, đồng bộ Pāli trùng): khoá `sn45.149:5.4` "… này các tỳ-kheo, tỳ-kheo tu tập chánh kiến, …" → "… này các tỳ-kheo, vị tỳ-kheo tu tập chánh kiến, …". Pāli `Idha, bhikkhave, bhikkhu sammādiṭṭhiṁ bhāveti nibbānaninnaṁ nibbānapoṇaṁ nibbānapabbhāraṁ …pe… sammāsamādhiṁ …` trùng nguyên văn `sn45.127:1.4`; đã dò toàn `sn`: 6 khoá cùng Pāli (kể cả khoá này), 5 khoá còn lại (`sn45.127:1.4`, `sn45.133:1.4`, `sn45.134-138:1.13`, `sn45.139:4.6`, `sn45.128-132:1.13`) đều dùng "vị tỳ-kheo" (4 khoá giống hệt, riêng `sn45.128-132:1.13` thiếu dấu phẩy sau "chánh kiến"/"chánh định"); khoá này là ngoại lệ duy nhất. Phần nghĩa không đổi: ba vế `ninna/poṇa/pabbhāra` đã là "hướng về / nghiêng về / xuôi về Niết-bàn" giống `sn45.127:1.4` (không có lỗi "có dòng"), dấu lược `…` đã đúng một. Lưu ý nhỏ: ba khoá `1.5`, `3.4`, `4.4` của bài này (Pāli khác) vẫn viết "tỳ-kheo tu tập" không có "vị"; không đổi vì Pāli không trùng.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `4.4` (`amatogadhaṁ amataparāyanaṁ amatapariyosānaṁ`) — «lấy bất tử làm viên mãn» → «lấy bất tử làm cứu cánh tối hậu» (công thức «nhập vào bất tử, lấy bất tử làm cứu cánh, lấy bất tử làm cứu cánh tối hậu», khoảng 20 khoá ở sn46.130, sn48.57, sn48.44, mnd10:72); bản đa số nhóm này («dựa vào chỗ không chết …») kém sát `ogadha` hơn nên không lấy làm gốc; thêm dấu phẩy sau «chánh kiến» và «chánh định» theo `5.4`.
