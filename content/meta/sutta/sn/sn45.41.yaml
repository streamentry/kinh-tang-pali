  - >-
    **Tên phẩm và tên kinh — đã tra tiền lệ `published` trước khi viết.** Dùng lại: `Avijjāvagga` → *13. Phẩm Vô Minh* (8 bài) · `Paṭhamamāravagga` → *1. Phẩm Ma Rối Lần Nhất* (8 bài) · `Sotāpattivagga` → *1. Phẩm Nhập Lưu* (8 bài) · `Arahantavagga` → *7. Phẩm A-la-hán* · `Micchattavagga` → *3. Phẩm Sai Trái* (4 bài) · `Aññatitthiyapeyyālavagga` → *5. Phẩm Chuỗi Lặp Lời Dạy Khác Nhau* · `Dutiyagaṅgāpeyyālavagga` → *10. Phẩm Chuỗi Lặp Sông Lớn Lần Hai* (6 bài) · `Appamādapeyyālavagga` → *11. Phẩm Chuỗi Lặp Không Phóng Dật* (đúng như `sn45.141-145`) · `Nīvaraṇavagga` → *4. Phẩm Chướng Ngại* (6 bài) · `Sīlaṭṭhitivagga` → *3. Phẩm Giới Và Trú* (4 bài) · `Sūkarakhatavagga` → *6. Phẩm Núi Khỉ* (4 bài) · `Pāsādakampanavagga` → *2. Phẩm Vui Vẻ* · `Puññābhisandavagga` → *4. Phẩm Gặp Gác Công Đức* · `Veḷudvāravagga` → *1. Phẩm Veḷudvāra* · `Udāyivagga` → *3. Phẩm Buổi Sớm* · mẫu uid dải `…uttapañcaka` → *Năm Bài … (Hai) Và Các Bài Sau* (`sn34.41-45`, `sn45.104-108`) · `an5.23:0.3` cho *Kinh Các Ô Nhiễm* · `sn36.26:0.3` + `sn54.15:0.3` cho `Paṭhamabhikkhusutta` → *Kinh Vị Tỳ-kheo (Nhất)*. **Phân kỳ cần biên tập, đã chọn đa số ở mọi chỗ:** `Arahantavagga` 1–1 (*Phẩm A-la-hán* / *Phẩm Bậc A-la-hán*) · `Appamādapeyyālavagga` 1–1 · `Veḷudvāravagga` 2–1 (*Cổng Tre*) · `Udāyivagga` 3–1–1 (*Buổi Sớm* / *Tiếng Hồi* / *Udāyī*) · `Sūkarakhatavagga` 4–1, và cả hai tên đều sai: `sūkarakhatā` là *hang heo rừng* chứ không phải *núi khỉ* (Sujato: *The Boar’s Cave*) · `Pāsādakampanavagga` và `Puññābhisandavagga` lệch với Sujato (*Shaking the Stilt Longhouse*, *Overflowing Merit*). **Một phân kỳ đã sửa vì sai cả Pāli lẫn Sujato:** `Ayoguḷavagga` → *3. Phẩm Ayoguḷa* (`sn51.27/28/29`) — `Ayoguḷa` là **tên riêng** của một vị du sĩ (`Ayoguḷasutta`, `ayoguḷo`, `ayoguḷe` trong chính Sn 51), còn *Cầu Vàng* (3 bài) lẫn *Hòn Sắt* (2 bài) đều là cách dịch sai tên riêng. **Hướng dòng sông — không nhân bản đoán sai.** `pācīnaninnā` là *về phía tây*; 16 dòng đã công bố trong `sn45.104-108` và `sn51.33-44` ghi *nghiêng về đông* (Sujato cũng dịch *slant to the east*), **sai**; tên kinh cùng họ (`sn45.91/92-95/103/115/127`) là *Dòng Sông Chảy Về Tây*. Lát này theo Pāli. **Nếu biên tập chọn *đông*, phải sửa cả 16 dòng kia và sáu tên kinh cùng lúc, không sửa riêng lát này.**
  - >-
    `rāgavirāga` → *chấm dứt tham*. Sujato dịch *The Fading Away of Greed*; `virāga` trong kho là *ly tham* (xem `virāganissitaṁ` → *y cứ vào ly tham*), nhưng `virāga` ở đây là mục đích của phạm hạnh, nên chọn *chấm dứt* cho tự nhiên ở tiếng Việt. **Đề nghị biên tập thống nhất** với bất cứ bài nào khác dùng `rāgavirāga`.
  - >-
    Tên `Rāgavirāgasutta` 0 tiền lệ → *Kinh Chấm Dứt Tham*. Toàn khung hỏi–đáp lấy nguyên văn `sn45.42-47:1.1–1.3` (cùng phẩm, cùng nguyên văn `Sace vo … paribbājakā evaṁ puccheyyuṁ`). `…pe…` ở `1.10` **không** mở rộng: bản Việt liệt kê đủ tám ngành rồi mới đặt một dấu lược, dù Pāli chỉ viết `sammādiṭṭhi … sammāsamādhi`.
  - >-
    `1.6` dùng *hay không* cho vế hỏi thứ hai: `atthi panāvuso, maggo, atthi paṭipadā rāgavirāgāyā` là **một** câu hỏi cho cả hai; *không … không* tiếng Việt đọc như hai lần phủ định.
