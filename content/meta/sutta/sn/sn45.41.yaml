  - >-
    **Bản song trùng Pāli, dùng lại nguyên văn — không dịch lại từ đầu.** `sn46.34:1.1–1.4` (đã công bố) cho **cả bốn** khoá `2.1–2.4` của `sn46.37`: Pāli `Sattime, bhikkhave, bojjhaṅgā anāvaraṇā anīvaraṇā cetaso anupakkilesā …` và `Satisambojjhaṅgo …` giống hệt một, nên dùng nguyên văn của nó · `sn45.127` (cùng Pāli `pācīnaninnā pācīnapoṇā pācīnapabbhārā`) và `sn45.92-95` cho ba vế *trôi về phía tây, có bến về phía tây, trôi ra bờ bên kia* · `sn45.122-126` (cùng Pāli `samuddaninnā …`) cho *trôi ra biển, có bến ra biển* · `sn45.104-108` + `sn45.96` cho phần Thánh đạo tám ngành · `sn45.42-47:1.1–1.3` cho khung hỏi–đáp `Sace vo … paribbājakā evaṁ puccheyyuṁ` của `sn45.41/48` · `sn51.27` (cùng Pāli `Iddhādidesanāsutta`) cho `sn51.28/29` · `an5.23:1.1/2.1` cho công thức năm ô nhiễm của vàng sa thạch lẫn của tâm · `an5.51:2.3` + `sn46.38:2.2` cho năm `āvaraṇā nīvaraṇā` của `sn46.37` · `sn46.13:2.3` và `sn54.2:1.3` cho `vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ` · `sn47.32:2.2/2.5` cho bộ tu quán sát · `sn48.59:1.4` cho năm căn · `sn53.45-54:1.7–1.10` cho bốn tầng thiền, `sn40.3:1.4` cho tầng thứ ba, và `Tassuddānaṁ` → *Tóm lược:* · `an5.179:3.2/4.1–4.2/5.1–5.2/6.1` cho bốn vế `catūhi dhammehi` của `sn55.1` và `sn55.36` · `an5.179:1.4` + `sn55.9:3.3` cho bốn nơi không thoát lui · `sn45.18:1.2` cho `kukkuṭārāme` · `sn36.26:0.3` cho `sambahulā bhikkhū` → *Kinh Nhiều Vị Tỳ-kheo*.
  - >-
    **Lượt review đối kháng bắt được 15 lỗi, tất cả đều là lỗi nghĩa chữ — không phải lỗi hình thức.** (1) `sn22.64/65`: hàm ghép câu trong bản nháp **sinh ra** *“tưởng tượng mà tưởng tượng”* và *“hoan nghỉnh mà hoan nghỉnh”*, và tách `amaññamāno` thành *“không tưởng tượng mà tưởng tượng”*; đã bỏ hàm, viết tay từng câu theo `maññamāno` / `amaññamāno` · `abhinandamāno` / `anabhinandamāno`. (2) `sn22.64/65:0.1`: hàm sinh ra **`Saṁyutta Nikāya sn22.64`** rồi **`Saṁyutta Nikāya 64`** — phải là `'.'.join(u.split('.')[1:])`. (3) `sn22.64/65:0.3`: tiêu đề bị sinh ra là *Kinh Tưởng Tượng (thật sự tưởng tượng)* và *Kinh Hoan Nghỉnh (thật sự hoan nghỉnh)*. (4) `sn22.64/65:3.2`: `Sādhu kho tvaṁ` là *Lành thay cho ngươi*, bản nháp viết *Lành thay **thay***. (5) `sn22.133:1.2`: bản nháp **bỏ mất chủ thể** `Tôn giả Sāriputta` trong `Atha kho āyasmā sāriputto sāyanhasamayaṁ …pe…`. (6) `sn22.133:2.5/4.5`: cụm *sự thú vị* bị lặp thành *biết rõ như thật sự **sự** thú vị*. (7) `sn22.133:2.2–2.4`: `Vedanāya / saññāya / saṅkhārānaṁ` là **của** (genitive) để khớp với *của sắc* ở 2.1 và *của thức* ở 2.5; bản nháp dùng *với*. (8) `sn23.1:2.4/2.10`: `rūpaṁ māroti passa … aghabhūtanti passa` là **tám** vế (māro · māretā · mīyati · roga · gaṇḍa · salla · agha · aghabhūta), bản nháp đếm chín vì hằng dịch đã có sẵn chữ *Ác Ma* trong khi mệnh đề dẫn đầu *thấy sắc là Ác Ma* cũng mang; và `mīyati` là kẻ **bị** giết, không phải *kẻ chết*. (9) `sn45.146-148:1.1`: `sabbā tā candimappabhāya kalaṁ nāgghanti soḷasiṁ` nghĩa là **ánh trăng thắng**, bản nháp viết **ngược** là *đều lấn át ánh trăng*. (10) `sn45.146-148:3.1`: `kāsikavatthaṁ tesaṁ aggamakkhāyati` là *vải dệt ở Kāsi được xem là hơn hết*, bản nháp viết *chúng đều lấn át tấm lót bằng vải thường* — thêm một vật **không có trong Pāli**. (11) `sn45.134-138:2.5`: `Nibbānaninno dvādasakī` là bài **hướng về Niết-bàn** thứ mười hai, bản nháp viết *Bài Dòng Sông Chảy Về Tây thứ mười hai*. (12) `sn45.30:1.9/1.13`: sáu tính từ `iṭṭhā kantā manāpā piyarūpā kāmūpasaṁhitā rajanīyā` bị **bỏ nguyên Pāli** trong bản Việt — Pāli lọt thẳng vào bản dịch. (13) `sn45.41/48:1.6`: `atthi … atti` là **một** vế hỏi cho cả hai, bản nháp tạo ra hai chữ *không*; đổi sang *hay không*. (14) `sn46.26:1.6`: bản nháp **mở rộng** `…pe…` thành bảy giác chi — đúng loại lỗi mà bất biến kho chặn. (15) `sn51.19:1.2`: `Taṁ suṇātha` bị để **trống** — không phải phân đoạn lược, là một câu có nghĩa. **Máy không bắt được loại lỗi này — cả mười lăm đều qua mọi chốt tự động.** Riêng (1), (3), (4), (9), (10), (11), (12), (15) đều do **hàm dịch** sinh ra hoặc do **bỏ sót** khi viết, không phải do chọn nhầm thuật ngữ.
  - >-
    **Ba nhóm lỗi do hàm sinh ra — bài học vận hành của kho.** Nhóm (1)–(4) của lát 42A đều xuất từ một hàm ghép câu; nhóm (9)–(12) của lát 42B xuất từ bản nháp có sẵn; (15) là khoá bị để rỗng. Không chốt chặn lặp từ nào bắt được, vì cụm bị lặp có **một từ ngăn cách** giữa chúng (*tưởng tượng **mà** tưởng tượng*) hoặc do hàm mà ra. Bài học: đối với câu lặp, **in Pāli ↔ Việt từng khoá để đọc lại**; và không dùng hàm ghép câu cho lát sau.
  - >-
    **Một loại sót sót nguyên tác bị chốt kiểm nặng hơn cả con số đối chiếu.** Đã đọc lại và sửa: (a) `sn46.26:1.6` kéo `…pe…` thành bảy giác chi; (b) `sn46.33:1.3` và `sn53.1-12:1.5–1.8/2.4/2.7` là khoá Pāli viết **đầy đủ** nhưng bản nháp thêm dấu `…`; (c) `sn45.41/48:1.11` Pāli viết trọn `…āyāti.` nên bản Việt không được thêm dấu trích; (d) `sn46.37:2.1–2.4` Pāli **mở** `“` ở 1.1 rồi **không đóng** — lỗi của nguồn Bilara, giữ nguyên theo từng khoá thay vì tự thêm.
  - >-
    **Một loạt số `0.1` bị bỏ trong kho — đã sửa 27 tệp.** Bản ghi `Saṁyutta Nikāya 64` cho `sn22.64` và `Aṅguttara Nikāya 2` cho **21 tệp An** khác nhau (`an2.11/21/32/42/52/77/130/280`, `an1.248-257/278-286/287-295/296-305/575-615`, `an5.308-1152`, `an8.119`, `an11.502-981/982/992-1151`). Đó là hình thức của **lỗi (2)**, lan sang 21 tệp An đã công bố trước đó. Đã sửa bằng lệnh và kiểm lại bằng một lệnh khác: còn 0 tệp sai.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán. Công thức: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Harness còn chặn hoa sau ngoặc, hoa sau dấu chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ.
