notes: |-
  Dịch từ Pāli root; đối chiếu bản Anh Bhikkhu Sujato ở commit đã ghim. Coverage Anh 22/22 đoạn Pāli có nội dung = 100%.
    Tầng Việt hiện hành không có bài này: translation/vi/phantuananh/ ở commit đã ghim
    chỉ chứa 26 chương Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu
    thuật ngữ; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo.
    budsas.org chỉ là tra cứu toàn văn, không cấp text cho tầng nào.
  Công thức của bài trùng nguyên văn với sn24.2 đã published trong cùng phẩm, nên dùng lại nguyên văn phần lớn: kismiṁ nu kho, bhikkhave, sati, kiṁ upādāya, kiṁ abhinivissa → *Này các tỳ-kheo, khi có cái gì, khi dựa vào cái gì, khi hướng về cái gì thì ý kiến như sau khởi lên* (sn24.2:1.2); rūpe kho, bhikkhave, sati … → *Khi có sắc, này các tỳ-kheo, dựa vào sắc, hướng về sắc thì ý kiến như sau khởi lên* (sn24.2:1.5); vedanāya/saññāya/saṅkhāresu/viññāṇe sati → *Khi có cảm thọ … khi có tưởng … khi có các hành … khi có thức …* (sn24.2:1.7–1.10); Taṁ kiṁ maññatha → *Các ông nghĩ sao về điều ấy*; rūpaṁ niccaṁ vā aniccaṁ vā → *sắc là thường còn hay vô thường*; aniccaṁ, bhante → *Vô thường, bạch Thế Tôn*; yaṁ panāniccaṁ dukkhaṁ vā taṁ sukhaṁ vā → *Vô thường thì là khổ hay lạc*; yaṁ panāniccaṁ dukkhaṁ vipariṇāmadhammaṁ → *Vô thường, khổ, chịu biến hoại*; no hetaṁ, bhante → *Không phải vậy, bạch Thế Tôn*; Yampidaṁ diṭṭhaṁ sutaṁ mutaṁ viññātaṁ pattaṁ pariyesitaṁ anuvicaritaṁ manasā → *Cái gì được thấy, được nghe, được cảm nhận, được biết, được đạt tới, được tìm cầu, được suy xét bằng tâm* (sn24.2:2.12); ayaṁ vuccati … ariyasāvako sotāpanno → *vị này được gọi là, này các tỳ-kheo, bậc Thánh đệ tử nhập lưu, không rơi vào ác đạo, chắc chắn, hướng về giác ngộ* (7 tệp trong sn24 đều dùng y hệt câu này).
  Tên phẩm 0.2 đo trong chính phẩm: 15 tệp sn24 đều ghi *1. Phẩm Nhập Lưu*, không phân kỳ. Tên bài Vātasutta chưa có tiền lệ; đặt *Kinh Gió* theo đúng nghĩa của vāta (gió), khớp với tiêu đề Anh Winds và với chủ đề cả bài.
  Lỗi lặp mà lượt review đối kháng bắt được và đã sửa: bản nháp đầu viết sáu chỗ ở 5.1, trong khi Pāli chỉ có NĂM vị trí *kaṅkhā pahīnā hoti* (imesu ca ṭhānesu, dukkhe, dukkhasamudaye, dukkhanirodhe, paṭipadāya). Bản nay dừng đúng ở *con đường đưa đến diệt tận của khổ*; Sujato nói *six grounds* vì đếm cả *these grounds* như một, tôi theo số vị trí Pāli đang liệt kê chứ không theo cách đếm của bản Anh.
  Bất định đã ghi, không giấu. (1) esikaṭṭhāyiṭṭhitā → *đứng yên như cột đá*: esikā là cột xây, dịch *cột đá* cho thành câu; không có tiền lệ cho cụm này trong kho. (2) mutaṁ trong diṭṭhaṁ sutaṁ mutaṁ → *được cảm nhận*, theo sn24.2:2.12 đã published; cũng có thể đọc là *được nghĩ trong tâm*, tôi giữ tiền lệ để hai bài anh em không lệch nhau.
  paccassosuṁ ở 2.3 dịch *đáp lại*; Pāli gốc nghĩa là *báo lại, đọc lại*, nhưng ở đây sau một câu hỏi của Đức Thế Tôn thì *đáp lại* là nghĩa tự nhiên và không mất ý.
  Dấu lược: 3.3/3.4/3.5 và 4.1/4.2/4.3 là lược thật của Pāli, mỗi khoá một dấu, giữ nguyên; đếm lại từng khoá, không khoá nào lệch.
    technical_integrity 9.6: môi trường lát này không cho chạy npm run validate|test|
    build|check|audit|reference:gaps. Bài tự kiểm bằng bản cài lại nguyên vẹn logic của
    _hvi.py: đủ 46/46 khoá, 0 khoá thừa, 0 khoá để trống, NFC, không khoá nào trùng
    nguyên văn Pāli, số dấu lược khớp từng khoá, ngoặc kép cân trên cả bài theo thứ tự
    số. Coverage Anh tính lại bằng đúng công thức của src/lib/canon/reference.ts
    (Pāli ≥40 ký tự sau khi nén khoảng trắng, bỏ khối tham chiếu :0).
