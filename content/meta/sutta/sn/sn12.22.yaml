notes:
  - >-
    Tên bài: `Dutiyadasabalasutta` → *Kinh Mười Sức Mạnh (Hai)*. Hậu tố thứ hai lấy theo đa số tầng (102/1561 tệp SN dùng `(Hai)`) và đúng với `sn12.30:0.3` *Kinh Sa-môn Bà-la-môn (Hai)* cùng phẩm. Tên phẩm `Dasabalavagga` → *3. Phẩm Mười Lực* khớp Pāli tuyệt đối với `sn12.21:0.2` và `sn12.26:0.2`, dùng lại nguyên văn. `sn12.22:0.1` giữ nguyên `Saṁyutta Nikāya 12.22` theo quy ước 1561/1561 tệp SN trên đĩa.
  - >-
    **13 khoá có Pāli trùng nguyên văn và dùng lại nguyên văn bản Việt** (đo bằng script, đã loại chính lát này khỏi chỉ mục): `0.2` · `1.1` · `1.4`, `1.5`, `1.6`, `1.7` · `1.10`, `1.11`, `1.12`, `1.13`, `1.14` (mười khoá `1.1–1.14` lấy từ `sn12.21`, bài liền kề cùng loạt) · `2.1` (từ `mn22:42.1`) · `3.13` (từ `an10.102:1.11`). Ngoài ra `1.2`, `1.3`, `1.8`, `1.9` cùng lấy từ `sn12.21` nhưng **không** trùng byte vì Pāli hai bài lệch dấu câu; `3.9` lấy câu của `an10.51:2.2` và chỉ đổi chữ đầu thành `Đây` cho đúng chữ hoa đầu câu.
  - >-
    Nhiều công thức đã có tiền lệ: `appattassa pattiyā, anadhigatassa adhigamāya` → *để đạt được điều chưa đạt được, chứng được điều chưa chứng được, thực chứng điều chưa thực chứng* (`mn118:4.3`) · `avañjhā saphalā saudrayā` → *không vô ích, không cằn cỗi, mà có kết quả và lợi ích* (`dn19:60.10`) · `cīvarapiṇḍapātasenāsanagilānappaccayabhesajjaparikkhāraṁ paribhuñjāma … mahapphalā … mahānisaṁsā` → câu lấy nguyên văn từ `mn39:2.4` · `thiện nam tử` (121 lần trong tầng) · `uttāno vivaṭo pakāsito chinnapilotiko` → *sáng rõ, được mở bày, được làm cho hiển lộ, không chắp vá che giấu* (6 lần, `mn22:42.1/43.1`) · `maṇḍapeyya` → *phần tinh túy* (tiền lệ `an4.20:4.5` *phần tinh túy của hội chúng*; 0 tiền lệ cho `brahmacariya`).
  - >-
    Bất định đã ghi, không giấu: (a) `kāmaṁ taco ca nhāru ca aṭṭhi ca avasissatu` ở `2.3` — Pāli giống `mn70:27.6` nhưng khác dấu câu nên không tính là trùng nguyên văn; giữ hai mong ước riêng của Pāli (*Xin cho trong thân ta chỉ còn da, gân, xương; xin thịt và máu trong thân ta khô đi*) thay vì gộp một câu như `mn70`. (b) `appamādena sampādetuṁ` ở `3.10–3.12` — Sujato đọc là *persevere diligently*; Pāli nghĩa gốc là *đạt được*, nên dịch *cho đến khi đạt được* và không thêm mệnh đề nhân quả nào ngoài segment. (c) `hīnena aggassa patti hoti` — chọn *kẻ hèn kém không thể đạt được điều cao thượng* / *kẻ cao thượng thì đạt được điều cao thượng* để giữ đối xứng của Pāli.
  - >-
    Cấu trúc nháy kép đối chiếu lại với Pāli: `1.2` mở → `1.15` đóng (trùng nguyên văn `sn12.21`); `3.7` mở → `3.8` đóng; `3.10` mở → `3.12` đóng `”ti.` Cân trên toàn bài 34 khoá.
  - >-
    Quy tắc dấu lược của BRIEF_VI3 §10: mọi khoá Pāli có `…pe…` hoặc `…` đều giữ **đúng một** `…`, không mở rộng; không khoá nào nén bằng `…` cả khi Pāli viết đủ. Đã đếm từng khoá. Coverage Anh đo được: 25/25 = 100%
  - >-
    Tầng `vietnamese-current` vắng: tại commit đã ghim, bilara chỉ có Pháp Cú cho tiếng Việt, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Ba tầng tham khảo còn lại là Pāli root (authority) + `english-sujato` đã ghim + `english-project` (lớp lấp của chính dự án, chỉ tính khi `published`).
  - >-
    Bốn cổng kỹ thuật của AGENTS.md: `npm run validate`, `npm test`, `npm run check` và `npm run build`. **Agent lát này KHÔNG chạy bốn lệnh đó** — BRIEF_VI3 §7 và lệnh của người điều phối cấm chạy `npm run validate|test|build|check`. Những gì đã chạy và xanh: `_hvi.py` (`save_vi` → `kiểm`) cho cả 9 bài — đủ khoá trong `all`, không thừa, NFC, không trùng nguyên văn Pāli (trừ 0.1 theo quy ước), không Pāli lọt, số dấu lược khớp từng khoá, nháy kép cân trên cả bài; quét lại 306 khoá bằng script độc lập; `notes` và `blocking_errors` parse sạch bằng thư viện `yaml` của kho. Cổng thật còn lại là CI (`.github/workflows/ci.yml`), nên `technical_integrity` chỉ 9.6 chứ không 10.
