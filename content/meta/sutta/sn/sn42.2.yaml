notes: |-
  ĐỌC LẠI TỪNG CÂU TỪ PĀLI. Bản dịch có sẵn do phiên trước ghi, thiếu metadata; tôi đã đối
  chiếu 47/47 khoá với Pāli root đã ghim và sửa 3 khoá. Coverage English đo bằng đúng công
  thức `src/lib/canon/reference.ts`: 32 khoá Pāli có nội dung, **32/32 có chữ Anh = 100%**
  — nhưng 29 khoá từ bản Sujato đã ghim và 3 khoá (1.8, 1.9, 1.11) từ tầng lấp
  `english-project` (`content/meta/en/sn/sn42.2.yaml`, trạng thái `published`). Không có tầng
  lấp nào ở đây cho an11, nhưng với bài này thì có.

  ⚠ TRIANGULATION KHÔNG ĐỘC LẬP Ở 3 KHOÁ. `assessed_by` của bản lấp `english-project` là
  "OpenCode Space Bunny Free (agent)" — **trùng đúng** với `assessed_by` của scorecard
  tiếng Việt này. Theo `AGENTS.md` ("Không tự đánh bài của mình"), bản lấp đó KHÔNG phải là
  một cách đọc Anh độc lập, nên 3 khoá ấy **không được tính là đã đối chiếu English** và
  `triangulation` đặt 8.6. Chạy không có tầng lấp thì coverage là 29/32 = **90,63%**, vẫn
  trên ngưỡng 0.8 nên không phải ghi `content/meta/reference-gaps.yaml`. Điểm giảm nằm ở
  `triangulation`, **không** nâng điểm ở chỗ khác để bù.

  SỬA 3 KHOÁ — lỗi mất nghĩa giáo lý, không phải văn phong:
  2.6, 2.8 và 2.10 là bộ ba câu song song `Tesaṁ naṭo raṅgamajjhe samajjamajjhe ye dhammā
  rajanīyā|dosanīyā|mohanīyā te upasaṁharati bhiyyoso mattāya` — tức những pháp khởi động
  THAM | SÂN | MÊ. Bản dịch cũ dịch 2.6 (`rajanīyā`) và 2.10 (`mohanīyā`) ra **hai chuỗi
  y hệt nhau**, nên ba tam nhãn tham-sân-si — đúng thứ đáng dạy nhất trong bài — bị làm phẳng
  thành một. Riêng 2.8 (`dosanīyā`) thì đã dịch đúng cấu trúc "khiến họ …". Đã sửa cả ba
  theo cùng một khung và phân biệt ba tính từ: "khơi dậy tham ái" (theo `sn35.114`, `sn35.115`
  — "khởi lòng tham ái", "khơi dậy tham ái"; `sn35.104` dùng "quyến rũ"), "khêu gợi sân hận"
  (theo `sn35.118` — "khêu gợi tham ái"), "làm mê sự". Đồng thời bỏ cụm lặp "mê mờ say mờ".

  GIỮ NGUYÊN CÓ CHỦ ĐÍCH:
  1.5. 1.5, 1.10, 1.15 dịch `Idha bhagavā kimāhā”ti?` thành "Bạch Thế Tôn nói gì về điều
  đó”ti?" — nguyên văn `sn42.3` (hai khoá, cùng công thức) cũng dịch y hệt, và cách đọc này
  khớp Sujato. Giữ.
  2.11. 2.15 `tiracchānayoniṁ` dịch "loài vật" — có 19 tiền lệ ngoài lát cho `tiracchāna`,
  nên giữ dù "cõi loài vật" sẽ cân với "địa ngục" hơn.
  3.11. 1.3/1.8/1.13 và 1.4/1.9/1.14/3.6 dùng y nguyên văn nhau, và 1.11 trùng 1.6: đúng
  quy tắc dùng lại cách dịch đã có cho Pāli lặp trong cùng bài.

  Thuật ngữ, kèm đếm: `gāmaṇi` → thôn trưởng (88 lần toàn kho; **0** lần "làng trưởng") ·
  `naṭagāmaṇi` → thôn trưởng vũ công · `naṭa` → vũ công · `samaṇa/brāhmaṇa/paribbājaka` → sa-môn,
  bà-la-môn, du sĩ · `micchādiṭṭhi` → tà kiến · `saccālika` → lẫn lộn thật giả · `pahāsa` →
  cười cợt (đặt đúng nghĩa "cười" như danh xưng cõi ngục) · `arādhako` → thành tựu.
  0.1 giữ `Saṁyutta Nikāya 42.2` theo 1673 khoá `:0.1` đã có; 0.2 `Gāmaṇivagga` →
  "1. Phẩm Làng" đúng 6 bài cùng phẩm (`sn42.1`, `3`, `4`, `6`, `9`, `10`) — Sujato dịch
  "Chiefs", nhưng kho đã chốt "Phẩm Làng" cho cả phẩm nên tôi theo kho.

  BẤT ĐỊNH, 0 tiền lệ ngoài lát: `samajjamajjhe` → "hội hội hè" (8 khoá trong bài này, 0 lần
  ngoài lát). `samajja` là cuộc tụ họp/lễ hội của nhóm vũ công; "hội hội hè" hơi lặp và "lễ hội"
  sẽ gọn hơn nhưng chưa có bản nào trong tầng dùng. Tôi để nguyên theo bản có sẵn, không tự
  tạo cách mới. **Người biên tập nên chốt `samajjamajjhe` rồi áp lại cho các `sn42` còn lại.**

