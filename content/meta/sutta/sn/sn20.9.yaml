notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim. **Coverage đo được 21/23 khoá Pāli có nội dung = 0.9130, trên ngưỡng 0.8** — tính cả lớp lấp `english-project` (3 khoá, đã `published`) theo `creditLayers` của `source/layers.yaml`. Hai khoá `2.4` và `2.5` không có tiếng Anh ở bất kỳ tầng nào: chúng lặp nguyên văn `1.5` và `1.6` (lời các tỳ-kheo khuyên vị tỳ-kheo mới, và lời vị ấy đáp lại), nên bản Việt dùng **nguyên văn hai khoá đã dịch ở `1.5` và `1.6`** — đây là dùng lại công thức, không phải dịch không có chứng cứ. Tầng `vietnamese-current` không có cho bài này.
  **Song song trong cùng phẩm**: `sn20.8` và `sn20.10` (đã dịch) cho `nivāsetvā pattacīvaramādāya gāmaṁ vā nigamaṁ vā piṇḍāya pavisanti`, `Tasmātiha… evaṁ sikkhitabbaṁ`, `Evañhi vo… sikkhitabbaṁ`. **Dùng lại nguyên văn 7 khoá có Pāli trùng** (kể cả `Tasmātiha…` và `Evañhi vo…` với `an3.1`, `sn20.8`, `sn20.10`).
  **Ngũ liệt `agadhitā amucchitā anajjhopannā ādīnavadassāvino nissaraṇapaññā`** → *không đắm chấp, không si mê, không trói buộc, thấy rõ mối hại, có trí về sự xuất ly*; dạng phủ định ở `4.9` dịch lật lại đúng từng chữ (*đắm chấp, si mê, trói buộc, không thấy mối hại, không có trí về sự xuất ly*) — **giữ phủ định vì đó là ý của bài**, không dùng chung một công thức cho hai vế. `nissaraṇapaññā` chọn *sự xuất ly* (121) thay *sự thoát ly* (45), khớp `sn35.16` và `sn22.27`.
  **Tên bài 0 tiền lệ.** `Nāgasutta` — cùng chữ `Nāgasutta` đã có ba cách trong kho (`an4.114` *Kinh Voi Naga*, `sn45.151` *Kinh Rắn Lớn Nhờ Núi*, `ud4.5` *Kinh Voi Chúa*). Chọn **Kinh Voi Đực** vì nội dung bài nói rõ về *voi đực làm thầy* và bê con (`mahānāga` / `taruṇā bhiṅkacchāpā`), và vì bản Anh dịch tiêu đề là *A Bull Elephant*; `nāga` = *rắn* ở `sn45.151` không liên quan.
  `maraṇamattaṁ vā dukkhaṁ` → *khổ đau gần chết* (9 so với *đau khổ gần chết* 3). `therā bhikkhū` / `navā bhikkhū` → *tỳ-kheo trưởng lão* / *tỳ-kheo trẻ* (85 so với 24). `gihī` → *gia chủ*. `pasannākāraṁ` → *biểu lộ sự tịnh tín* (theo `mn125`).
  Nháy kép: `1.5` và `1.7` cân trong lời thoại của vị tỳ-kheo mới; `2.2` mở và `2.6` đóng — về đúng cấu trúc Pāli, nơi vị tỳ-kheo kể lại chuyện đã xảy ra (anh nghe ở `1.5`–`1.7` nhưng dùng `‘…’` chứ không dùng `“…”`).
  Cổng kỹ thuật do coordinator chạy: `npm run validate`, `npm test`, `npm run check`, và `npm run build` (vì có bài `published`). `technical_integrity` 9.6 vì bốn lệnh này chưa chạy ở lát c42.
