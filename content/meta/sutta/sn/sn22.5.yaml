notes: |-
  **63/63 khoá**, không khoá nào ngoài tập khoá Pāli. Bài là một khung lặp: hai nửa đối xứng — *hoan hỷ, tán thán, bám chặt* → hỷ khởi → thủ → hữu → sinh → khối khổ **tập khởi**; rồi *không hoan hỷ, không tán thán, không bám chặt* → hỷ diệt → thủ diệt → hữu diệt → khối khổ **đoạn diệt** — áp lần lượt vào năm uẩn, với phần lớn các vế sau sắc và thọ bị lược `…pe…`/`…`.

  **Coverage English (đo thật).** Mẫu số = 28 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Sujato phủ **24/28 = 85,7%**, trên ngưỡng 0,8; bốn khoá Sujato để trống là `9.2`, `9.5`, `10.3`, `10.6` (các vế `Tassa … nirujjhati` và `evametassa … nirodho hoti` của thọ và các hành, nơi bản Anh nối câu qua chỗ trống) đã được lớp `english-project` lấp, đưa coverage lên 28/28. **Bốn khoá lấp đó do cùng một tác giả với bản Việt này, nên không phải cách đọc English độc lập**: triangulation chỉ tính trên 24 khoá Sujato phủ thật, không tuyên bố đã đối chiếu English cho bốn khoá còn lại, và hạ xuống 9,0. Bản Anh cũng để trống `1.3` (công thức mở đầu), `12.2` (số thứ tự) — đều dưới ngưỡng 40 ký tự, không tính vào mẫu số.

  **Tầng Việt hiện hành.** Bilara tại commit ghim chỉ có Pháp Cú cho tiếng Việt, nên không có cột Việt hiện hành theo từng khoá. Bản Hòa thượng Thích Minh Châu của bài này chỉ có dạng nguyên bài ở mục Tra cứu toàn văn; đã đọc để đối chiếu thuật ngữ, không căn lề vào khoá và không chép câu chữ. Đối chiếu cho thấy ba trục thuật ngữ trùng bản đó: *hoan hỷ*, *hỷ* (nandī), *thủ / hữu / sinh*, *tập khởi*, *đoạn diệt*.

  **Dùng lại nguyên văn đã `published` (Pāli trùng nguyên văn trong tầng).** `Evaṁ me sutaṁ—` → *Tôi nghe như vầy—* (bản đa số: 29 khoá toàn tầng, 20 khoá trong `sn`, so với *như vậy—* 20 và 12; `sn22.4` cùng phẩm viết *như vậy—*, không đổi theo vì đa số rõ) · `Nakulapituvagga` → *1. Phẩm Nakulapitu* (7/7) · `Samādhisutta` → *Kinh Định* (6 khoá, trùng `sn35.99`, `sn56.1`) · `Samādhiṁ, bhikkhave, bhāvetha` → *hãy tu tập định* (`sn35.99:1.14`) · `jātipaccayā jarāmaraṇaṁ sokaparidevadukkhadomanassupāyāsā sambhavanti` → *do sinh làm duyên nên già-chết, sầu, bi, khổ, ưu và não sinh khởi* (5 khoá `sn12.*`) · `bhavapaccayā jāti` → *do hữu làm duyên nên có sinh* (3 khoá, trên *do hữu làm điều kiện, sinh khởi sanh* 5 khoá ở `sn35.113` — chọn dạng gần với `sn12.60/53` cùng công thức 12 chi) · `upādānapaccayā bhavo` → *do thủ làm duyên nên có hữu* (3) · `upādānanirodhā bhavanirodho …pe…` → *do thủ diệt nên hữu diệt …* (7/7) · `Pañcamaṁ.` → *Thứ năm.* (260). Các khoá Pāli trùng nguyên văn với tầng đã `published` đều dùng lại dạng đã nêu; chỗ nào tầng có hai dạng thì ghi số đo ở trên.

  **Pāli trùng nguyên văn trong chính bài:** 5 nhóm (3.5=4.7; 3.6=4.8; 8.4=9.3=10.4; 8.5=9.4=10.5; 8.6=9.5=10.6=11.4), 0 cặp mà bản Việt khác.

  **Thuật ngữ, kèm số đo.** `samudaya` của năm uẩn → *sự sinh khởi* (19/19 khoá `sn22.*` đã `published`: `sn22.74`, `sn22.131`–`134`…), nhưng `evametassa kevalassa dukkhakkhandhassa samudayo hoti` → *sự tập khởi của toàn bộ khối khổ này* (37/51 khoá toàn tầng; *sinh khởi* 13) — hai công thức khác nhau trong tầng, giữ mỗi bên đúng dạng đa số của mình; **cùng một từ Pāli hai cách dịch trong một bài**, ghi để người biên tập quyết có thống nhất hay không. `atthaṅgama` → *sự diệt tận* (`sn22.131`/`132`/`134`, `sn22.74`); `nirodha` → *diệt* trong cụm `…nirodhā …nirodho`, *sự đoạn diệt* ở công thức cuối (21/29 khoá). `abhinandati abhivadati ajjhosāya tiṭṭhati` → *hoan hỷ, tán thán và bám chặt* (*hoan hỷ* 25/26 khoá toàn tầng; *bám chặt* theo `sn35.63`, `mn145`; `sn35.131` viết *chấp chặt*). `nandī` → *hỷ*, theo `mn145:3.3` và `mn145:4.3` (cùng câu Pāli); `sn35.63` viết *niềm vui*, `mn38` viết *sự thích thú* — **ba cách dịch trong tầng, 0 đa số rõ**; chọn *hỷ* vì khớp câu Pāli y hệt ở `mn145` và khác với động từ *hoan hỷ* (xem bất định số 1). `upādāna` → *thủ* (trong chuỗi duyên, theo `sn12.60/53`, `mn38`). `saṅkhārā` → *các hành*. `samāhito bhikkhu` → *vị tỳ-kheo có định* (`sn35.99:1.2`).

  **Số Pāli:** không có số lượng nào cần tính; `Pañcamaṁ` là số thứ tự (*Thứ năm*), khớp `sn22.5` là bài thứ năm của phẩm. Phép kiểm số chạy rỗng — không có số để đo.

  **Bất định, không thêm vào thân kinh.** (1) `nandī` → *hỷ*: *hỷ* cũng dùng dịch `pīti` trong tầng, nên người đọc có thể hiểu nhầm là hỷ giác chi; nghĩa Pāli ở đây là sự hoan lạc dính mắc (đồng căn với `abhinandati`), ghi lại để người biên tập quyết. (2) `7.1`: Pāli `Idha, bhikkhave, nābhinandati …` **không** có chữ `bhikkhu` (khác `2.2`), chủ ngữ bị lược; tôi dịch *vị ấy* theo ngữ cảnh. (3) `6.1`–`6.3`: Pāli lược `atthaṅgamo` sau `ko vedanāya …` / `ko saññāya …` / `ko saṅkhārānaṁ …`; tôi giữ lược, không điền *sự diệt tận* vào. (4) `1.2`–`1.3`: công thức mở đầu bị lược gần hết (`…pe… sāvatthiyaṁ …`, `tatra kho …pe… etadavoca:`); chủ ngữ của *nói như sau* nằm trong phần lược, tôi không thêm *Đức Thế Tôn* vì Pāli ở đây không có `bhagavā`. (5) Hai chỗ `…pe…` liền nhau ở `4.9` và `8.5/9.4/10.5` giữ một dấu `…`, không bung ra chuỗi `bhavapaccayā jāti …`.

  **Lỗi bản nháp tự bắt khi đọc đối kháng.** Chỉ một: bản đầu viết `3.8`/`4.10` là *sự sinh khởi của toàn bộ khối khổ* theo sự nhất quán trong bài; đo lại tầng thì công thức này đa số là *tập khởi* (37/51) nên đã đổi (xem mục Thuật ngữ). Các lựa chọn `7.1` (*vị ấy*) và `6.1`–`6.3` (giữ lược) được quyết ngay từ đầu, không phải sửa sau.

  **Kiểm kỹ thuật (bị cấm chạy cổng nên không tuyên bố pass).** `technical_integrity` đặt 9,6; còn phải chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`. Đã tự kiểm: tập khoá Việt = tập khoá Pāli (63 = 63, cùng thứ tự); dấu nháy `“”‘’` khớp Pāli từng khoá (0 lệch / 63); dấu lược `…` cân bằng Pāli từng khoá (0 lệch / 63 khoá, 14 khoá Pāli có lược); NFC; không khoá rỗng; không Pāli lọt sang Việt.
