notes: |-
  Tiền lệ đã đếm: pahāna → từ bỏ vì tưởng từ bỏ có 10 lần, luôn cặp với tưởng ly tham
  trong cùng liệt kê; biến thể tưởng đoạn trừ chỉ 6 lần. Sujato đặt tên bài là Giving Up,
  gần với từ bỏ hơn đoạn trừ. Khung câu theo sn46.70 cùng phẩm.
  Dấu lược: Pāli …pe… là một dấu lược, Việt giữ một …; không mở rộng công thức lược.
  Không đối chiếu được tầng Việt hiện hành: snapshot đã ghim chỉ có Pháp Cú tiếng Việt,
  nên không có bản Hòa thượng Thích Minh Châu cho Tương Ưng Bộ — giới hạn của upstream.
  Bất định: chọn từ bỏ thay vì đoạn trừ là quyết định thuật ngữ đã ghi ở đây, không đổi nghĩa Pāli.
