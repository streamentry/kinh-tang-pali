  Cổng kỹ thuật chưa chạy — lát này bị cấm `npm run validate|test|check|build|audit|reference:gaps`. Tiêu chí 10 bị chặn ở **9.6**; bốn lệnh để coordinator chạy: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  **Lượt cải thiện 2026-10-14 (đọc đối kháng cả 48 khoá, đối chiếu công thức già–chết và chuỗi duyên khởi đã `published`; ĐOẠN NÀY THAY THẾ các đoạn trên ở mọi chỗ mâu thuẫn).** 22 khoá đổi trên 48. **Nặng (nghĩa sai hoặc thiếu đơn vị nghĩa, 3 khoá):** `5.1` — (a) `evaṁ lokassa samudayañca atthaṅgamañca yathābhūtaṁ pajānāti` bản cũ viết *biết rõ như thật sự sự khởi lên…* (lặp *sự sự*, mất `evaṁ` = *như vậy*), nay *như thật biết rõ sự khởi lên và sự diệt tận của thế gian như vậy*; (b) chín danh hiệu bị dịch lệch như đã thấy ở `sn12.27:5.2`: `ñāṇena` và `vijjāya` đều thành *tri kiến* (nay *trí* và *minh của bậc hữu học*), `dhammasotaṁ samāpanno` thành *thông đạt với tai đang nghe pháp* (nay *đã nhập vào dòng pháp*, 9 so 0 tiền lệ *dòng pháp/dòng Pháp*), `ariyo nibbedhikapañño` thành *cái biết thấy đường vào bất sanh* (nay *bậc Thánh có tuệ thấu suốt*, 13 so 5 *thông suốt*), `amatadvāraṁ āhacca tiṭṭhati` thành *đã đập cửa bất tử, đứng dựa nơi ấy* (nay *đang đứng gõ cửa bất tử*, 3 *gõ cửa* so 2 *đập cửa*); (c) `imaṁ saddhammaṁ` đổi *Giáo pháp chân chánh* → *chánh pháp* (đo lại trên Pāli có `saddhamm`: *chánh pháp/Chánh Pháp* 380 khoá, *Giáo pháp chân chánh* 38 khoá — 38 khoá đó nằm ở `mn9`, còn công thức `itipi` cùng bài `sn12.28`, `sn12.33` đã `published` dùng *chánh pháp*); (d) câu kết bản cũ *cũng vậy còn được gọi là* không đọc được, nay mỗi danh hiệu theo công thức `itipi` = *cũng được gọi là* như `sn12.28`, `sn12.33`; (e) vế *thì bậc đệ tử Thánh ấy* đổi thành *vị đệ tử Thánh này* theo `ayaṁ vuccati`. **Vừa (chủ thể/thiếu đơn vị nghĩa, 3 khoá):** `2.1` và `4.1` — bản cũ *chỉ có sự biết tri này, không tựa vào điều gì khác* (*biết tri* vô nghĩa; mất `bhikkhave`; mất `ettha`; `aparappaccayā` đã có 25 tiền lệ là *không lệ thuộc người khác*), nay *Nhưng, này các tỳ-kheo, ở đây vị đệ tử Thánh đa văn chỉ có trí, không lệ thuộc người khác:*; `4.9` *tan chấm dứt* (có *tan* không có trong Pāli) → *chấm dứt*, khớp `nirujjhati` ở `3.2`/`4.2`. **Nhẹ (thuật ngữ lệch tiền lệ, 16 khoá):** `1.3`/`3.2` bỏ *rồi cái gì—* (calque của `kiṁ nu kho`, mà `dn14:2.20` cho thấy tiền lệ để `kimhi nu kho` chỉ làm dấu hỏi) · chuỗi mười hai chi ở `1.4`, `2.5`–`2.13`, `3.3`, `3.5`, `3.6`, `4.5`–`4.7` theo tiền lệ đo được (trong chuỗi duyên khởi toàn tầng: *danh sắc* 12 so *danh và sắc* 4; *sáu xứ* 15 so *sáu căn* 4; *xúc* 26 so *xúc chạm* 6; *thọ* 41 so *cảm thọ* 7; *ái* 56 so *ái dục* 2; *hữu* 47 so *hữu sanh* 3; *sinh* 33 so *tái sinh* 3 — riêng `tái sinh` cho `jāti` còn lẫn với `punabbhava`; trong `sn12`: *sáu xứ* 69 so 10, *xúc* 122 so 20, *ái* 124 so *ái dục* 4, *hữu* 108, *sinh* 159 so *tái sinh* 10). *Chấp thủ* giữ nguyên (15 so *thủ* 15, hoà). `3.4` *chấp thủ …* không đổi. Số khoá Pāli còn dùng lại nguyên văn của `sn12.49` vì thế giảm: bản `sn12.49` hiện vẫn mang cách dịch cũ (`1.3`, `1.5`, `2.5`–`2.13`, `5.1`–`5.2`) nên hai bài đang lệch nhau — cần sửa cả `sn12.49` cho nhất quán. **Giữ nguyên dù có nghi ngờ:** *đệ tử Thánh* (26 khoá so *Thánh đệ tử* 149 khoá trên toàn `sn`; chỉ `sn12.33`, `sn12.49` và vài bài `sn55`/`sn23.11` dùng dạng này) — giữ để khớp tiêu đề *Kinh Đệ Tử Thánh*, `6.5` và `sn12.49`; người biên tập nên thống nhất · *sinh khởi … sinh ra* / *diệt tận … chấm dứt* ở `1.3`, `2.2`, `3.2`, `4.2` (mn dùng *sinh … sinh*, *diệt … diệt*; sn12.21/22 *sinh khởi … sinh khởi*) — là khác biệt văn phong, không sai nghĩa · `6.6` *được gọi tên là vậy* (11 khoá cùng công thức, dùng lại) · `:1.2` *không nghĩ như vầy* cho `evaṁ hoti`. **Điểm đổi:** `terminology` 9.4→9.5 (khoá chuỗi duyên khởi về tiền lệ; còn lệch ở *đệ tử Thánh*) · `vietnamese_clarity` 9.4→9.5 (bỏ *biết tri*, *tan chấm dứt*, *sự sự*, *rồi cái gì—*, câu kết không đọc được). Các điểm khác giữ nguyên: `semantic_fidelity` 9.4 và `grammar_logic` 9.4 — các lỗi nặng ở `5.1`, `2.1`, `4.1` trên đây được sửa nhưng bản cũ đã chấm 9.4 khi còn chúng, nên con số giữ nguyên chỉ phản ánh bản đã sửa chứ không phải điểm được nâng; `ambiguity_integrity` 9.3 (cách đọc `aparappaccayā ñāṇamevettha` là *trí không lệ thuộc người khác*, theo 25 tiền lệ của `aparappaccaya` nhưng chưa có bài song song `sn12` nào đã dịch để so; và `:3.4`–`:3.6` bản Anh trống) · `technical_integrity` 9.6 (không chạy cổng trong lượt này: còn phải chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`). Bản cũ chấm 9.47 khi còn các lỗi nêu trên; 9.49 là điểm của bản đã sửa.
