  **`sn12.50` LÀ BẢN ANH EM CỦA `sn12.49`** (`Ariyasāvakasutta`): Pāli gần như trùng, chỉ
  khác ở chỗ `sn12.49` **lược** danh sách danh hiệu bằng `…pe…` còn `sn12.50` liệt kê **đủ
  chín** danh hiệu ở `:5.1`. **34 khoá dùng lại nguyên văn `sn12.49`**: `:1.2` · `:1.4` ·
  `:2.1`–`:2.13` · `:2.14` · `:2.15` · `:3.1` · `:4.1`–`:4.7` · `:4.8` · `:4.9`.
  `:1.3` và `:3.2` ở đây là Pāli **gộp** hai khoá của `sn12.49` (`:1.3`+`:1.4`, `:3.2`+`:3.3`),
  nên tôi gộp hai vế và giữ dấu gạch dài sau `kiṁ nu kho` đúng như `sn12.49:1.3`
  (*‘rồi cái gì—*).

  **DẤU LƯỢC — hai chỗ, cả hai đều giữ đúng một `…`, KHÔNG mở rộng.**
  · `:3.3` Pāli kết `…pe…` sau `taṇhā na hoti`: bản Việt dừng đúng ở *…ái dục không có …*
    và dấu `…` **giữ lại** làm dấu nối sang các khoá `:3.4`–`:3.6`.
  · `:4.6` Pāli kết `…pe…`: giữ *…sáu căn không có …*, đúng như `sn12.49:4.6`.
  · `:3.4` `upādānaṁ …`, `:3.5` `bhavo …`, `:3.6` `jāti …` — Pāli đặt `…` **sau** danh từ
    chứ không có `na hoti`; `…` ở đây đứng thay cho *"không có"*, nên tôi dịch *chấp thủ …* /
    *hữu sanh …* / *tái sinh …*, theo đúng khuôn `sn12.49:4.7` (`bhavo na hoti …` →
    *hữu sanh không có …*). Không thêm *"không có"* vào khoá nào vì Pāli không có ở đó.

  **LỆCH ĐA SỐ, ĐÃ KIỂM CHỨNG BẰNG SỐ ĐẾM.**
  · `:2.14`/`:4.8` `So evaṁ pajānāti:` — đa số đo được là *Vị ấy biết như sau:* (**24/54**),
    nhưng `pajānāti` = *biết rõ*, nên tôi theo `sn12.49:2.14` (*Vị ấy biết rõ như sau:*).
  · `:5.1` `imaṁ saddhammaṁ` — tiền lệ duy nhất trong cùng tầng là `sn12.27:5.2`
    (*đã đến chỗ chân chính này* / *thấy chỗ chân chính này*, 1 lần), còn `mn9` dịch `imaṁ
    saddhammaṁ` là *Giáo pháp chân chánh* (**38** lần / 2 tệp). Tôi theo 38 lần đó:
    *đã đi vào Giáo pháp chân chánh này* / *thấy Giáo pháp chân chánh này*. Các danh hiệu còn
    lại dùng lại nguyên văn `sn12.27:5.2` (`đầy đủ chánh kiến`, `đầy đủ cái thấy`, `đầy đủ tri
    kiến của bậc học`, `đã thông đạt với tai đang nghe pháp`, `có cái biết thấy đường vào bất
    sanh của bậc Thánh`), và vế cuối `amatadvāraṁ āhacca tiṭṭhati itipī”ti.` dùng lại
    nguyên văn `sn12.49:5.2`. Điểm này **không nhân bản** `sn12.27`'s *"được cương trì bằng
    chánh đạo"* cho cụm cuối, vì `sn12.27` không có đoạn `āhacca tiṭṭhati` ngay sau đó nên
    không thể so trên cùng Pāli.
  · `:0.3` `Dutiyaariyasāvakasutta` → *Kinh Đệ Tử Thánh Thứ Hai*; khuôn đo trên metadata
    `sn` là `Paṭhama…` → *(Nhất)*, `Dutiya…` → *Thứ Hai* (ví dụ `sn55.4:0.3`
    `Paṭhamasāriputtasutta` → *Kinh Sāriputta (Nhất)*).
  · `:1.1` `Sāvatthiyaṁ viharati.` → *Trú ở Sāvatthī.* (82/143 cho đúng khoá này).

  **UDDĪNA CỦA PHẨM `Gahapativagga` — ĐỐI CHIẾU TÊN THẬT, KHÔNG LIỆT KÊ NGOÀI PĀLI.**
