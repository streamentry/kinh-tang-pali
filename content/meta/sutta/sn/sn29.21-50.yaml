notes: |-
  Soạn từ Pāli root, đối chiếu Anh Sujato: 11/11 khoá có nội dung đều có Anh;
  3.2 và 3.3 do `english-project` lấp (meta `published`). Không có bản Việt Thích
  Minh Châu (ngoài Pháp Cú).
  1.2, 2.1, 2.5, 2.9, 2.10 trùng PẢI sn29.11-20:1.1/2.1 và sn29.10 nên dùng lại
  nguyên văn — cùng công thức hội thoại với mười vị rồng ở sn29.11-20.
  Tiền lệ đếm được: Saṁyutta Nikāya giữ Pāli 1074/1408; `1. Nāgavagga` →
  1. Phẩm Rồng (sn29.10, sn29.11-20); `opapātikānaṁ nāgānaṁ` → rồng tự hóa sinh
  (sn29.10, 3 chỗ); `Tassuddānaṁ` → Tóm lược: 276/369;
  `Ayaṁ kho, bhikkhu, hetu, ayaṁ paccayo, yena …` → Này tỳ-kheo, đây là nhân, đây là
  duyên (sn29.9, sn30.3, sn31.2); `So annaṁ deti …` → Vị ấy cho thức ăn (4/7;
  sn31.13-22 dùng cho cơm nhưng sn30.17-46 và sn29.11-20 dùng thức ăn — chọn theo
  hai bài cùng cấu trúc ở sn29); `saṁsedajānaṁ` → sinh từ ẩm (dn33:2.2.2);
  `Nāgavaggo paṭhamo.` theo sn20.12:1.10 `Opammavaggo paṭhamo.` → Phẩm …, thứ nhất;
  `Nāgasaṁyuttaṁ samattaṁ.` theo sn30.17-46:2.5.
  1.3-1.5: Pāli liệt ba loại rồng với `…pe…` giữa mỗi loại; bản Việt giữ đúng ba khoá
  và một dấu lược mỗi khoá, theo đúng cách sn29.11-20:2.8-2.9 đã làm (nói lược
  giữa các danh từ bị lặp) — KHÔNG nối thành một câu.
  0 tiền lệ, đã ghi lý do: 0.3 `Jalābujādidānūpakārasuttattiṁsaka` chưa có;
  `suttattiṁsaka` là gồm mười bài nên theo mẫu `suttadasaka` của sn29.11-20 và
  sn30.7-16 là Mười Bài. 3.1 theo mẫu câu peyyāla của sn30.17-46:1.17 (mẫu duy nhất
  có trong tầng). 3.2 `cattālīsaṁ veyyākaraṇā` và 3.3 `paṇṇāsasuttantā` không có
  tiền lệ ở đâu cả; dịch theo nghĩa số đếm, không chú thích trong thân kinh.
  4.1-4.6 là kệ uddāna, cũng không có tiền lệ: dịch theo mẫu sn20.12:2.1-2.4 và
  sn30.17-46:2.1-2.4 (liệt kê bài rồi đếm). `paṇītataraṁ` dịch cực thắng hơn;
  `caturo ca uposathā` là bốn bài về ngày trai đàn, `Tassa sutaṁ caturo ca` là bốn bài
  trong đó ngài đã nghe, `dānūpakārā ca tālīsaṁ` là ba mươi bài bố thí cho — các con
  số 4 + 4 + 30 = 38 rồi cộng mười bài trước thành năm mươi, khớp 3.3.
  triangulation 8.3 chứ không cao hơn: hai khoá 3.2 và 3.3 lấp từ `english-project`
  cũng do chính tác giả này chấm; nhưng hai khoá ấy lại là hai khoá 0 tiền lệ, nên
  cũng là chỗ yếu nhất của bài, vì thế ambiguity_integrity hạ xuống 8.9.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
