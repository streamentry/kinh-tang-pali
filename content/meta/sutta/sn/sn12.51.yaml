notes: |-
  Dịch trọn **92 khoá** từ Pāli root, đối chiếu từng khoá với bản Anh của Bhikkhu Sujato; tập khoá Việt trùng khít tập khoá Pāli, đúng thứ tự, không khoá thừa.

  **Tầng tham khảo, đo thật.** `source/upstream-manifest.json` liệt kê `sutta/sn/sn12/sn12.51_translation-en-sujato.json`. Mẫu số = khoá Pāli có nội dung (từ 40 ký tự, bỏ khối `:0`) = **59**; bản Sujato có chữ Anh ở **59/59** ⇒ coverage **1,0000**, trên ngưỡng 0,80. Lớp `english-project` không có cho uid này nên không có chỗ nào được tính từ lớp do dự án tự dịch; cả 59 khoá đều là bản Anh độc lập đã ghim. Tầng `vietnamese-current` vắng (bản phân đoạn chỉ có Pháp Cú tại commit đã ghim); đối chiếu truyền thống Việt dựa vào các bài đã publish cùng bộ.

  **Tiền lệ cùng bộ (Pāli trùng nguyên văn).** Dò **28** khoá có Pāli trùng với bài khác trong `sn`; **25** dùng lại nguyên văn một bản dịch đã có (công thức mở bài, `:2.2` giống `sn16.3`, mười một khoá `No hetaṁ, bhante`, `:13.1`, `:24.3`…). **3** khoá cố ý khác đa số: `:1.5` (*Bạch Thế Tôn*, vì Pāli chỉ có `Bhadante`, không có `Evaṁ`), `:2.4` (*Đức Phật* thay *Đức Thế Tôn* cho đồng nhất cả bài) và `:9.7` (*Sinh* thay *Sanh* theo thuật ngữ cả bài). Trong chính bài có **5** nhóm Pāli trùng (`:1.6`/`:2.5`; `:3.5`/`:5.3`/`:7.12`; `:5.1`/`:7.1`; `:11.2`/`:12.4`; mười một khoá `No hetaṁ, bhante`) và cả năm nhóm đều có bản Việt **giống hệt** nhau (0 cặp lệch).

  **Thuật ngữ, theo số đếm trong `sn12`.** *Già chết* (36) hơn *già-chết* (17); *sáu xứ* (24) và *sáu căn* (20) gần nhau, chọn *sáu xứ* theo `sn12.1`; *khát ái* cho `taṇhā` và *chấp thủ* cho `upādāna` theo `sn12.1`/`sn12.52`; *hữu* cho `bhava`; *danh sắc*. `jāti` là *sinh* (16 khoá) so với *sanh* (14 khoá) khi xét các khoá Pāli có `jātipaccayā`/`jātiyā`/`jātinirodhā`; chọn *sinh*, ghi rõ hai bài `sn12.1` và `sn12.52` kề bên viết *sanh*. `vedanā`: trong chuỗi mười hai chi dùng *thọ* (`:7.5`, `:18`–`:19`, theo tiền lệ 8 khoá `vedanā …` → *thọ …*), còn ở phần nói về cảm giác được kinh nghiệm (`:10`–`:12`) dùng *cảm thọ*, theo `sn36.7`/`sn22.88`; đây là hai ngữ cảnh khác nhau nên không đồng nhất máy móc. `puññābhisaṅkhāra`/`apuñña…`/`āneñja…` dịch *hành phước · hành phi phước · hành bất động* (chưa có tiền lệ trong tầng `sn`; ghi nhận đây là lần đầu).

  **Dấu lược.** `:7.2` Pāli kết `…pe…` ⇒ Việt đúng một `…`. `:7.3`–`:7.9` Pāli có `…` ở từng khoá ⇒ Việt cũng một `…` mỗi khoá, không thêm *không có* hay mở rộng chuỗi. Nháy đơn của `:7.2` mở ở khoá đó và chỉ đóng ở `:7.11`, đúng như Pāli (khớp từng khoá, không tự cân). `:11.1` và `:12.3` Pāli không có nháy quanh lời tự biết `vedayāmīti pajānāti`, nên Việt cũng không đặt nháy (bản Anh đặt nháy, nhưng Pāli quyết định).

  **Bất định đã ghi nhận (không thêm vào thân kinh).**
  · `:3.2`/`:3.6` `…dukkhaṁ loke uppajjati jarāmaraṇaṁ`: dịch `jarāmaraṇaṁ` đồng vị với khổ (*tức là già chết*). Sujato đọc *khổ… khởi lên, bắt đầu bằng già chết*; Pāli không có chữ nào tương ứng *bắt đầu bằng*, nên giữ nghĩa ít giả định hơn. Hai cách đọc không đổi giáo nghĩa của bài (khổ được xét là già chết, nhân là sinh).
  · `:2.1` `Kittāvatā nu kho… parivīmaṁseyya`: dịch *đến mức nào thì… có thể tra xét để chấm dứt khổ*; Sujato diễn đạt *how do you define when…*. Giữ bám `kittāvatā` = *đến mức nào*.
  · `:9.1` `Avijjāgato yaṁ…`: `yaṁ` đóng vai liên từ điều kiện, không có chữ Việt riêng; dịch *người đã rơi vào vô minh, nếu…*.
  · `:11`–`:12` `kāyapariyantikaṁ`/`jīvitapariyantikaṁ`: tầng đã có hai cách (`sn22.88` *chấm dứt*, `sn36.7` *cùng tột*); bài này chọn *giới hạn bởi thân / bởi mạng sống* vì `pariyanta` = ranh giới; `sarīrāni avasissanti` dịch *chỉ còn lại phần xác thân*.
  · `:10.4`–`:10.6` `visaṁyutto`: dịch *không bị ràng buộc* (`sn22.88` ghi *không chướng lắm*, cách này không khớp nghĩa `visaṁyutta` nên không dùng lại).
  · `:14.1`–`:23.1` `paññāyetha`: dịch *được nhận ra*, bám nghĩa gốc *hiện rõ để nhận biết*; Sujato *be found*.
  · Tiêu đề `:0.3` là *Kinh Sự Tra Xét* (`parivīmaṁsana`); chưa có tiền lệ trong tầng, tiêu đề đặt theo mẫu `sn12.52`, `sn12.53`.

  **Số Pāli.** Bài không có số lượng nào ngoài số thứ tự *Paṭhamaṁ* (`:24.4`) và `saḷāyatana` là thuật ngữ *sáu xứ*; không có phép tính nào cần làm.

