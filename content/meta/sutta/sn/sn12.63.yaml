notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim; bản Việt nguyên bài của Hòa thượng Thích Minh Châu trên SuttaCentral dùng làm tra cứu toàn văn (không phải tầng segment). Coverage English (Sujato) = **51/51** khoá Pāli có nội dung = **100%** (Pāli ≥ 40 ký tự, bỏ khối `:0`; Sujato có chữ ở cả 51 khoá). Lớp `english-project` không có tệp cho bài này, tầng `vietnamese-current` (segment) không có cho bài này (tại commit đã ghim chỉ có 26 tệp Pháp Cú), nên cổng English được thoả hoàn toàn bằng bản Sujato độc lập; coverage ≥ 0,80, không cần entry trong `reference-gaps.yaml`.
  Tiền lệ cùng tầng, dùng lại nguyên văn: 29 khoá Pāli trùng nguyên văn với khoá đã dịch ở bài khác đã dò (`0.2`, `1.1`, `1.2`–`1.5`, `3.1`, `3.3`, `3.5`, `5.3`, `5.6`, `6.2`, `6.4`–`6.19`, `6.25`); trong đó **2** cặp bản Việt khác có chủ ý: (a) `5.3` dùng *Rồi có một người muốn sống…* theo `sn35.238:1.2` để giữ `atha`, trong khi `mn46:18.2`, `mn46:19.3`, `sn47.20:2.4` (3 khoá) bỏ *Rồi*; (b) `6.2` dùng *bắt tên trộm cướp, kẻ phạm tội* theo `mn129:8.2` (17/25 khoá có `āgucāri` ở tầng đã viết *phạm tội*), khác `an4.244:1.3` (*làm điều dơ bẩn*). Các khoá còn lại giữ đúng bản đã có: `1.2` ← `sn12.11:1.3`, `1.4` ← `sn12.11:1.5`/`mn9:11.4`, `1.5` ← `sn12.11:1.6`, `6.4`–`6.18` ← `mn129:8.4`–`8.18` (đoạn vua ra lệnh đánh bằng giáo ba lần), `3.1`/`6.19` ← *Điều ấy các ông nghĩ sao, này các tỳ-kheo,* (35 khoá cả tầng), `5.6` ← *Vì sao vậy?* (314 so với 68 *Vì sao?*), `6.25` ← *Thứ ba.* (268 khoá), `3.3` ← *Thưa không phải vậy, bạch Thế Tôn* (58 khoá trong `sn`, so với 28 khoá *Không phải vậy…*), `3.5` ← *Bạch Thế Tôn, đúng vậy* (9 khoá trong `sn`). `6.7` bỏ khoảng trắng cuối của `mn129:8.7`.
  Trong chính bài: 4 nhóm Pāli trùng nguyên văn (`3.1`/`6.19`; `6.4`/`6.10`/`6.16`; `6.8`/`6.14`; `6.9`/`6.15`), **0** nhóm mà bản Việt khác nhau.
  Thuật ngữ theo tiền lệ đếm được: `āhāra` → *đoàn thực* (13 khoá, gồm `sn12.11`, `mn9`, `sn12.64`); `phassāhāro`/`manosañcetanāhāro`/`viññāṇāhāro` → *xúc thực*/*ý tư thực*/*thức thực* (không có tiền lệ trong tầng — 0 khoá; ghép theo *đoàn thực* và theo `manosañcetanā` → *ý tư* ở `sn12.11`, `mn9`, `dn34`) · `pariññāta` → *liễu tri* (sn: 117 khoá so với 9 *hiểu rõ*; `mn` dùng *hiểu thấu đáo* 30 khoá nhưng ở đây theo `sn`) · `pañca kāmaguṇa` → *năm dục trưởng dưỡng* (49 khoá so với 38 *dục lạc*, và đúng bản Thích Minh Châu) · `ariyasāvaka` → *Thánh đệ tử* (sn: 180 so với 38 *đệ tử Thánh*) · `saṁyojana` → *kiết sử* (sn: 94) · `tisso vedanā` → *ba cảm thọ* (7 so với 5 *ba thọ*) · `tisso taṇhā` → *ba ái* · `daṭṭhabba` → *cần được thấy* (sn: 38 khoá *cần được thấy như thật…*, 22 khoá *cần phải được…*) · `kantāra` → *hoang mạc* (`dn10`, `dn2`) · `davāya madāya maṇḍanāya vibhūsanāya` → *vui chơi, say mê, trang sức, làm đẹp* (`mn53`, `mn39`) · `aṅgārakāsu sādhikaporisā…` → *hố than hồng sâu hơn tầm người, chứa đầy than đỏ rực không có ngọn lửa, không có khói* (`sn35.244:3.2`, `mn54:18.1`) · `parikkhayaṁ pariyādānaṁ gaccheyya` → *đi đến tiêu hao, cạn kiệt* (`sn6.10`) · `tatonidānaṁ` → *vì cớ ấy* (`mn129:8.21`) · `ekaputtako piyo manāpo` → *đứa con một, yêu dấu, đáng quý* (`mn82`, `mn87`) · `uttarikaraṇīya` → *việc cao hơn phải làm* (`dn10`) · `sattisata` → *một trăm mũi giáo* (`mn129`).
  Số Pāli: `cattāro` = 4 → *bốn* · `dutiyo`/`tatiyā`/`catutthaṁ` = thứ 2/3/4 → *thứ hai*/*thứ ba*/*thứ tư* · `dve jāyampatikā`, `dve balavanto purisā` = 2 → *hai* · `ekaputtaka` = 1 con → *con một* · `sabbeva tayo` = cả 3 → *cả ba* · `pañca` = 5 → *năm* · `tisso vedanā`, `tisso taṇhā` = 3 → *ba* · `sattisatena` = sata 100 → *một trăm mũi giáo* (×3 lần: sáng, giữa ngày, chiều) · `tīhi sattisatehi` = 3 × 100 = **300** → *ba trăm mũi giáo* · `ekissā sattiyā` = 1 → *một mũi giáo*. Không có số nào lớn hơn trong bài.
  Bất định, ghi tại đây, không thêm vào thân kinh: (1) `vallūra`/`soṇḍika` (`2.9`, `2.10`) → *thịt khô* và *thịt ướp* theo bản Thích Minh Châu; Sujato *dried and spiced meat*; hai từ này chỉ gặp trong bài này ở tầng đã ghim (0 khoá khác), nên không có tiền lệ độc lập — cách hiểu *ướp* (gia vị hay muối) chưa phân xử được. (2) `niccammā` (`4.2`, `4.6`) → *bị lột da* (Sujato *flayed*; Thích Minh Châu *bị lở da*); `khādeyyuṁ` nghĩa đen là *ăn*, dịch *cắn* theo Sujato và Thích Minh Châu. (3) `5.5` `ārakāvassa cetanā ārakā patthanā ārakā paṇidhi` — Pāli chỉ lặp `ārakā` (*xa*) mà không nêu đối tượng; Việt dịch *chỉ muốn lánh xa* (Sujato *get far away*); đối tượng (hố than) để ngầm theo văn cảnh. (4) `6.5` dùng lại `mn129:8.5` *sáng nay hãy đánh…* trong khi `6.6` của cùng nhịp viết *vào buổi sáng*; Pāli `pubbaṇhasamayaṁ` ở cả hai khoá là một, nên *nay* ở `6.5` là nét của bản dịch `mn129`, giữ theo luật dùng lại nguyên văn. (5) `sattisata`: `satti` dịch *mũi giáo* theo `mn129`; Thích Minh Châu dùng *hèo*, Sujato *spear*. (6) `ayaṁ te, deva, coro` (`6.3`) — `te` (*của ngài*) không dịch riêng, theo `mn129:8.3`.
  Dấu nháy: `1.2` mở “ và đóng ở `3.2` (”ti?); `3.6` Pāli mở “‘ … ’ti vadāmi — Việt giữ đúng một “ và một cặp ‘ ’; `4.7`/`5.9` Pāli có ‘ ’ nên Việt có ‘ ’; `6.23` Pāli chỉ có “ nên Việt không thêm nháy đơn; `6.21` mở “, `6.22` đóng ”, `6.24` đóng ”. Pāli không có `…pe…` và không có `(…)`; dấu lược duy nhất là `…` ở `1.1`, Việt giữ đúng một `…`.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` do coordinator chạy — lát agent này không chạy bốn lệnh đó, nên `technical_integrity` đặt 9.6 chứ không 10.0. Tự kiểm thay bằng phép đo riêng: tập khoá Việt = tập khoá Pāli (73/73, cùng thứ tự), nháy đơn/nháy kép khớp Pāli từng khoá (0 lệch), dấu lược khớp Pāli (0 lệch), NFC, không khoá rỗng, không Pāli lọt sang tiếng Việt (ngoài tên riêng).
