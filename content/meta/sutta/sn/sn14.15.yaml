notes: |-
  TẦNG THAM KHẢO ĐỦ, và tôi đã kiểm cả tầng lấp. Sujato đã ghim có 50 khoá nhưng chỉ 45 khoá có
  chữ; năm khoá bị để trống là `3.5`, `3.6`, `4.2`, `4.3` và `5.4` (`Pañcamaṁ.` — dòng đánh số
  bài, ngắn hơn 40 ký tự nên không tính vào coverage). Bốn khoá đầu đúng kiểu Sujato để trống dòng
  lược rồi nối câu. Dự án đã có lớp `english-project` cho `sn14.15` với trạng thái `published`
  (`content/meta/en/sn/sn14.15.yaml`) và lấp đúng bốn khoá ấy, nên tính cả hai tầng theo đúng
  công thức `source/layers.yaml`: **37/37 khoá Pāli có nội dung đều có English = 100%**, vượt
  ngưỡng 0,8, không cần ghi vào `content/meta/reference-gaps.yaml`. Tầng `vietnamese-current` thì
  vắng — tại commit đã ghim, `translation/vi/phantuananh` chỉ có 26 chương Pháp Cú; đó là đặc
  điểm của snapshot upstream, không phải thiếu sót của repo.

  NHÓM `Dhātusova` dùng lại nguyên văn của `sn14.14` (cùng Pāli, đã publish), nên bài không tự
  mâu thuẫn với bài anh em: `samenti` ở hiện tại → *hòa hợp và tụ hội*; `saṁsandiṁsu samiṁsu`
  ở quá khứ → *đã hòa hợp và tụ hội*; `saṁsandissanti samessanti` ở vị lai → *sẽ hòa hợp và tụ
  hội*. Cả mười hai vế đều mang dấu thời, không vế nào trần thời. `hīnādhimuttikā` → *khuynh
  hướng hèn hạ* (2 tiền lệ), `kalyāṇādhimuttikā` → *khuynh hướng tốt đẹp* (1 tiền lệ), đúng
  như `sn14.14`.

  Cặp hỏi–đáp `:2.2`–`:2.24` giữ tiếng Đức Phật và tiếng tỳ-kheo khác nhau rõ: Đức Thế Tôn hỏi
  *các ông có thấy…*, tỳ-kheo đáp *Bạch Thế Tôn, đúng vậy* (35/86 tiền lệ cho `Evaṁ, bhante`).
  Danh xưng trong tiếng Đức Phật dùng *ngài* (`sāriputtaṁ`, `moggallānaṁ`, `anuruddhaṁ` là
  dạng tân từ nên có dấu hiệu cách), còn tiếng kể ở `:1.2`–`:1.9` dùng *Tôn giả* — đúng cách
  đã dùng ở `an` và `sn`.

  Dấu ngoặc kép: `“` mở ở `:2.25` và đóng ở `:5.3`, đúng như Pāli (`…pāpicchā.` mở, `samentī”ti`
  đóng). Các cặp khác mở và đóng trong cùng một câu. `ngoặc()` của `_hvi.py` xác nhận cân trên
  cả bài.

  DẤU LƯỢC: bài này không có `…pe…` nào, nên bản Việt cũng không có `…` nào.

  THUẬT NGỮ: `sambahulehi bhikkhūhi` đo được *nhiều vị tỳ-kheo* 46 lần so với *một số vị tỳ-kheo*
  3 lần, nên dùng *nhiều vị tỳ-kheo*. `mahiddhikā` → *có đại thần thông* (theo tiền lệ `dasa therā
  mahiddhikāti` → *mười vị Trưởng lão có đại thần thông*). `dibbacakkhukā` → *có thiên nhãn*
  (134 lần trong tầng Việt). `dhammakathikā` → *người thuyết Pháp* (tiền lệ `Cattārome, bhikkhave,
  dhammakathikā` → *có bốn người giảng pháp*; tôi chọn *thuyết Pháp* vì `an` đã dùng nguyên cụm này).
  `vinayadharā` → *bậc nắm giữ Luật*. `bahussutā` → *đa văn* (267 lần). `pāpicchā` → *ác dục*
  (theo `na pāpicchā bhavissanti` → *không ác dục*). `dhutavādā` → *tán thánh hạnh đầu-đà*, theo
  tiền lệ duy nhất `…Dhutavādānaṁ yadidaṁ mahākassapo` → *hạnh đầu-đà*.

  BẤT ĐỊNH đã ghi, không giấu:
  1. Tiêu đề `:0.3` `Caṅkamasutta` chưa có tiền lệ nào trong tầng Việt (một khoả khác —
     `an5.29:0.3` cùng Pāli `Caṅkamasutta` — lại dịch *Kinh Kinh Hành*, lặp chữ *Kinh*, và tôi
     không theo vì đó là lỗi). Tôi chọn *Kinh Đi Hành Chung* vì `caṅkamati` ở bài này nghĩa là
     *đi hành cùng nhau*, khớp Sujato *Walking Together*. Xin người điều phối thống nhất với
     `an5.29`.
  2. `caṅkamati` ở `:1.2`–`:1.9` và `caṅkamantan` ở `:2.2`… là hành động đi dạo quanh Đức Phật
     (mục đích khẩu cầu), không phải hành trình đi xa; tôi dịch *đi hành không xa Đức Phật* và
     *đang đi hành*, giữ `avidūre` là *không xa*.
  3. `mahāpaññā` (`:2.4`) dịch *có đại trí tuệ* — tiền lệ chỉ có *có đại trí* và *đại trí tuệ*;
     tôi ghép vì người đọc Việt cần cả hai tầng nghĩa.

  HẠN CHẾ KỸ THUẬT: đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`, nên tiêu chí 10 bị chặn ở 9.6. Tôi chỉ xác minh được JSON hợp lệ, đủ 50/50
  khoá đúng exact ID, mọi giá trị NFC, ngoặc kép cong cân trên cả bài, dấu lược khớp Pāli từng
  khoá, không có khoá `(…)`. Kiểm bằng `save_vi` của `_hvi.py`, chạy lại cho idempotent.
  Người biên tập phải chạy lại bốn lệnh trên trước khi đổi trạng thái.