  Coordinator (gộp tên phẩm, 2026-10-04): tên phẩm đổi theo đa số TRONG CHÍNH vagga đó, đếm trên toàn tầng bằng cách ghép Pāli↔Việt ở khối :0.2. `Sūkarakhatavagga` 6/9 "Phẩm Núi Khỉ" (lệch: Hang Heo Rừng 2, Cái Hang Của Lợn Rừng 1); `Sappaññavagga` 7/10 "Phẩm Có Tuệ" (lệch: Người Có Trí 3). Không so chéo giữa các bộ vì số thứ tự phẩm thuộc từng Saṃyutta/Aṅguttara — cùng tên `Jarāvagga` ở SN1 và SN48 là hai phẩm khác nhau, đã giữ "Phẩm Già Nua" (SN1, 10/10) và "Phẩm Già" (SN48, 7/9) riêng.
