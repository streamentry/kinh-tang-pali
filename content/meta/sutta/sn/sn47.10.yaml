notes: |-
  DỊCH MỚI TỪ PĀLI, đủ 76/76 khoá của sn47.10, không khoá thừa, thứ tự khoá = thứ tự Pāli.

  COVERAGE ENGLISH, đo đúng công thức của kho (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối :0):
  mẫu số 50 khoá. Sujato đã ghim phủ 44/50 = 88,0%, ngưỡng 80% đạt chỉ bằng Sujato. Sáu khoá
  còn lại là 4.1–4.6 (Ānanda thuật lại cho Đức Thế Tôn lời các tỳ-kheo-ni), Sujato để trống cả
  sáu; lớp `english-project` (trạng thái published) lấp đủ, nên tính cả lớp lấp thì 50/50 = 100%.
  ⚠ TRIANGULATION KHÔNG ĐỘC LẬP Ở 6 KHOÁ ĐÓ. `assessed_by` của bản lấp `english-project`
  trùng đúng với `assessed_by` của scorecard này, nên theo "không tự đánh bài của mình" đó
  không phải cách đọc Anh độc lập. Nhưng 4.1–4.6 lặp lại 1.1–2.4 (Pāli trùng gần nguyên văn),
  và 1.1–2.4 được Sujato phủ độc lập; vì vậy `triangulation` đặt 8.8 chứ không hạ thấp hơn.
  Tầng `vietnamese-current` không có ở bài này (bản chụp bilara chỉ có Pháp Cú); bản Việt
  nguyên bài của Hòa thượng Thích Minh Châu (do Bình Anson hiệu đính) ở mục Tra cứu toàn văn
  được dùng để đối chiếu thuật ngữ, không cấp chữ cho bản dịch.

  ⚠ LỖI Ở LỚP LẤP ENGLISH (không thuộc bản Việt này, không sửa ở đây, cần người biên tập):
  `english-project` của sn47.10, khoá 4.4, dịch `Evaṁ vuttāhaṁ, bhante, tā bhikkhuniyo
  etadavocaṁ` thành "Having been spoken to this way, sir, those nuns said this" tức các
  tỳ-kheo-ni là người nói. Pāli là `vuttāhaṁ` = `vutto` + `ahaṁ`: chính Ānanda là người được
  nói với và là người nói tiếp ("con nói với các tỳ-kheo-ni ấy"); `tā bhikkhuniyo` ở cách
  đối cách, là người nghe. Ba chỗ đồng cấu trúc ở tầng Việt đã publish đều dịch người nói
  là "con/Ta" (`sn1.20:14.1`, `sn3.18:4.1`, `sn2.23`). Và nội dung 4.5–4.6 ("evametaṁ,
  bhaginiyo") là lời Ānanda đáp lại các tỳ-kheo-ni, y như 2.2–2.4, nên bản lấp 4.4 tự mâu
  thuẫn với 2.2 của chính bài. Bản Việt này theo Pāli và theo cấu trúc 2.2.

  Pāli trùng nguyên văn TRONG CHÍNH BÀI: 17 cặp (khối 6.x/7.x lặp 11 khoá; 8.2/8.5/8.8/8.11
  và 8.3/8.6/8.9/8.12), bản Việt giống nhau ở cả 17 cặp. Các cặp gần trùng nhưng khác dấu
  nháy hoặc người nói (2.2/4.5/5.1, 2.3/4.6/5.2, 2.1/4.3, 1.1/4.1, 1.2/4.2) được dịch
  riêng theo ngôi nói và đúng dấu nháy từng khoá.

  Dấu nháy: 76/76 khoá khớp Pāli ở cả bốn dấu “ ” ‘ ’ (nháy kép ngoài mở ở 2.2 và 5.1, đóng ở
  2.4+4.6 và 9.3; nháy đơn của lời các tỳ-kheo-ni ở 4.3–4.6). Dấu lược: 76/76 khoá cân bằng
  Pāli. 7.1 và 7.2 là hai chỗ `…pe…` của Pāli, mỗi chỗ giữ đúng MỘT `…`; Pāli chỉ ghi
  `vedanāsu` và `citte`, bản Việt viết "sống quán thọ trên các cảm thọ …" và "sống quán tâm
  trên tâm …" theo quy ước đã có ở `sn47.7`, `sn47.9`, `sn47.14`, `sn47.45`, `sn52.4`; bộ bốn
  được nêu đủ trong cùng bài ở 8.4, 8.7, 8.10, 8.13 nên lược hợp lệ theo quy tắc 10.2.
  Không có `(…)` trần trong Pāli khoá nào.

  Số Pāli: `catūsu` = 4 ("bốn niệm xứ", khoá 2.1, 2.3, 4.3, 4.6, 5.2, 6.1); `Dasamaṁ` = 10
  ("Thứ mười"); `paṭhamo` = 1 ("phẩm thứ nhất"); `47.10` giữ nguyên. Không có số lớn.

  THUẬT NGỮ, kèm đếm tiền lệ trên tầng đã dịch:
  - `uḷāraṁ pubbenāparaṁ visesaṁ jānanti/sañjānanti` → "chứng biết sự thù thắng cao cả, càng
    về sau càng cao hơn trước": 3/3 chỗ ở `mn118:2.3`, `mn89:12.12`, `mn89:18.9`; Sujato
    "realized a higher distinction than they had before" cùng nghĩa.
  - `suppatiṭṭhitacitto` → "sống với tâm khéo an trú trong bốn niệm xứ": `sn52.9:2.3` và
    `sn52.9:2.9` (2/2).
  - `pāṭikaṅkhaṁ` → "điều có thể mong đợi": cùng họ với `sn45.84`, `sn45.139`, `an9.1:10.1`
    ("điều được mong đợi", "có thể mong"); Sujato "can expect".
  - `bhaginiyo` → "này các chị": `mn146` (tất cả các chỗ trong bài đó, 76 lần cụm "này các chị"
    ở toàn tầng); ngoài `mn146` không có tiền lệ ở `sn`. `bhikkhunī` → "tỳ-kheo-ni" (76 khoá
    ở `sn` so với 10 khoá "tỳ-kheo nữ"); `sambahulā bhikkhū` → "nhiều vị tỳ-kheo" (18 so với 5
    "nhiều tỳ-kheo" ở `sn`), nên "nhiều vị tỳ-kheo-ni".
  - `bhikkhunupassayo` → "trú xứ của các tỳ-kheo-ni" (Sujato "nuns' quarters"; Hòa thượng Thích
    Minh Châu "trú xứ của Tỷ-kheo-ni"). `sn16.10:1.4` và `sn16.10:2.1` cùng Pāli dịch "tịnh xá
    của các tỳ-kheo nữ", `an4.159` dịch "tăng phòng tỳ-kheo-ni": ba cách có sẵn, đều đúng nghĩa
    "chỗ ở của tỳ-kheo-ni"; chọn "trú xứ" theo Hòa thượng Thích Minh Châu, ngắn và quen thuộc.
  - `dhammiyā kathāya sandassetvā samādapetvā samuttejetvā sampahaṁsetvā` → "pháp thoại chỉ
    dạy, khuyến khích, khiến hưng phấn và khiến hoan hỷ": đúng `sn16.10:2.4` (cùng Ānanda/
    Mahākassapa và tỳ-kheo-ni).
  - Công thức `pāmojjaṁ jāyati … sukhino cittaṁ samādhiyati` (6.5–6.9, 7.6–7.10): theo nhịp
    `dn10:2.12.4` (4 chỗ) chứ không theo `dn33:2.1.130`: "hân hoan sinh khởi → hỷ sinh khởi →
    thân an tịnh → cảm nhận lạc → tâm được định tĩnh". `pāmojja` = "hân hoan" và `pīti` = "hỷ"
    được tách bạch.
  - `pasādanīye nimitte` → "tướng gợi niềm tịnh tín": `mn89:4.1` dịch `pasādanīya` là "gợi niềm
    tịnh tín"; `nimitta` giữ "tướng". Toàn tầng 0 tiền lệ cho cả cụm; Sujato "inspiring
    subject", Hòa thượng Thích Minh Châu "tướng tịnh tín".
  - `paṇidahati/paṇidhāya` → "hướng tâm" (`mn133:15.3`, `mn133:15.9`); `appaṇihita` → "không
    hướng" (`sn41.6`, `sn43.4` đã dịch "không hướng/vô nguyện" trong ngữ cảnh định). Hai vế
    "sự tu tập có hướng tâm / không hướng tâm" giống Sujato "directed / undirected development".
  - `paṭisañcikkhati` → "suy xét": 82 khoá so với 44 khoá "suy nghĩ" trên toàn tầng.
  - `avitakko avicāro` → "không tầm, không tứ".
  - `satthā` → "bậc Đạo Sư"; công thức cuối bài theo `sn43.1:2.2–2.3` và `mn106:15.2`,
    `mn152:18.2` ("Đây là lời chỉ dạy của Ta cho các ông", 4 chỗ, hai chỗ là chính Ānanda
    được nói với); `vo` là số nhiều, nên "các ông" dù người nghe là Ānanda.
  - `Tassuddānaṁ` → "Tóm lược:" (285 khoá so với "Tóm tắt phẩm:" 4 khoá).

  BẤT ĐỊNH, GHI Ở ĐÂY CHỨ KHÔNG THÊM VÀO THÂN KINH:
  1. 6.3/7.4 `kāyārammaṇo vā uppajjati kāyasmiṁ pariḷāho, cetaso vā līnattaṁ, bahiddhā vā
     cittaṁ vikkhipati`. Có hai cách đọc cú pháp. (a) Sujato: ba vế, vế đầu là "nóng bức nơi
     thân lấy thân làm đối tượng" (đã theo). (b) Hòa thượng Thích Minh Châu tách `kāyārammaṇo`
     thành vế riêng ("thân sở duyên khởi lên, hoặc thân nhiệt não"). Chọn (a) vì Pāli có đúng
     ba chữ `vā` và `uppajjati` chỉ có một chủ ngữ rõ là `pariḷāho`. Ở 7.4, `dhammārammaṇo` đi
     cùng `kāyasmiṁ pariḷāho`: đối tượng là pháp nhưng sự nóng bức vẫn ở thân; dịch sát chữ,
     không nghĩa nào bị thêm. `pariḷāho` → "nóng bức" (3 chỗ ở `sn`; tầng còn dùng "nhiệt não"
     73, "nóng nảy" 50, "thiêu đốt" 39 cho các bối cảnh khác nhau); `līnattaṁ` → "chùng xuống"
     (0 tiền lệ nguyên cụm).
  2. 6.12/7.13 `paṭisaṁharāmi` không có tân ngữ: dịch "ta rút lại", không điền "tâm" hay "đối
     tượng". Sujato "relax", Hòa thượng Thích Minh Châu "rút lui (khỏi đối tượng tịnh tín)".
  3. 8.3 `pacchāpure`: có thể hiểu theo thời gian ("trước sau") hay theo không gian ("phía
     trước và phía sau"); `an7.61:8.1` cùng dạng được dịch "trước sau". Dịch "trước và sau"
     giữ trung tính. Chủ ngữ `asaṅkhittaṁ vimuttaṁ appaṇihitaṁ` là `cittaṁ` trung tính từ 8.2,
     bản Việt thêm "tâm" để câu đứng được, không thêm nghĩa. `asaṅkhitta` → "không co rút"
     (khớp "tâm co rút" `dn10:2.28.9`).
  4. UDDĀNA 11.2 `kusalarāsi`: Pāli nghĩa đen là "đống thiện", trong khi tiêu đề Pāli của sn47.5
     là `Akusalarāsisutta` và tầng Việt đang dịch "Kinh Đống Bất Thiện". Kinh `sn47.5` nêu cả hai
     đống (bất thiện rồi thiện) nên dòng tóm lược có thể chỉ đống thiện của chính bài đó, và
     `sn47.45` cũng có kinh `Kusalarāsi` ("Kinh Đống Thiện"). Dịch đúng chữ Pāli: "đống thiện";
     không đổi theo tiêu đề kinh. Đề nghị người biên tập xem lại tiêu đề `sn47.5`.
  5. UDDĀNA 11.1 `Ambapāli`: giữ tên riêng "Ambapālī" (khớp tên phẩm "Phẩm Ambapālī"); tiêu đề
     `sn47.1` ở tầng Việt đang là "Kinh Rừng Cây Mít" (`ambapāli` là xoài/Ambapālī, không phải
     mít `panasa`): ngoài phạm vi bài này, báo người biên tập. 11.3 `sakuṇagghi` → "con bàng"
     theo đúng cách `sn47.6` đã dùng (9/9 chỗ ở bài đó; Hòa thượng Thích Minh Châu dịch "chim
     ưng"); nếu `sn47.6` đổi thì dòng này đổi theo.
  6. 6.1 `Katamesu catūsu?` → "Trong bốn nào?" theo `sn52.10:2.3`; không bổ sung "niệm xứ" vì
     đã nêu ở câu trước.

