notes:
  - >-
    `rūpī`/`nārūpī` → *có hình / không có hình*; `Neva rūpī nārūpī` là **phủ
    định kép** — *không có hình, không phải không có hình* — tôi dịch đủ cả hai
    vế thay vì gộp thành một, vì gộp lại sẽ mất nghĩa “không phải cái gì cả”.
    `arogo paraṁ maraṇā` → *không bệnh, sau khi thân hoại mạng chung* theo
    nguyên văn chương 21 (đã `published`). `attā` → *bản thân*.
  - >-
    `Dutiyagamanavagga` → *Phẩm Tái Sinh Thứ Hai*: `gāmanā` là “sự đi đến”,
    nhưng cả Tăng Chi Bộ 24 nói về sự thọ sanh, nên tôi dịch nhãn phẩm theo chủ
    đề; đây là **nhãn diễn giải**, 0 tiền lệ.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Hòa thượng Thích
    Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
