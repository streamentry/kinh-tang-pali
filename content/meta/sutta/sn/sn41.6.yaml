  BẤT ĐỊNH — đã phân xử, ghi lại để người gộp có thể chuẩn hoá:
    (1) `saññāvedayitanirodha` → tôi dùng `diệt tưởng và thọ`. Số đếm toàn tầng:
        `diệt thọ tưởng` 33 chỗ, `sự chấm dứt tưởng và thọ` 22, `diệt tưởng và thọ` 4.
        Nghĩa là đa số tầng ĐẢO thứ tự Pāli (`saññā` = tưởng đứng trước `vedanā` = thọ),
        và riêng `mn43` (19 chỗ) + `mn44` (4 chỗ) — hai bản song song sát nhất với bài
        này — đều viết `diệt thọ tưởng`. Tôi chọn `diệt tưởng và thọ` vì đúng thứ tự từ
        và đọc tự nhiên hơn, và vì nó ĐÃ có sẵn trong tầng nên không tạo biến thể mới.
        Hệ quả: bài này sẽ khác hai bản song song. Nếu người điều phối muốn chuẩn hoá
        theo đa số cục bộ thì đổi sang `diệt thọ tưởng` ở 10 khoá (3.2, 3.3, 3.4, 4.2,
        4.3, 5.2, 5.4, 5.5, 6.2, 6.3, 6.4, 10.2) — tôi không tự chuẩn hoá vì BRIEF_VI3
        §6 cấm sinh ra cách thứ N+1 một cách âm thầm, còn đổi hàng loạt thì cần người
        đọc cả `mn43`/`mn44` cùng lúc.
    (2) `apaṇihita` (`appaṇihito phasso`, `8.4`) — Pāli root không có `apaṇihita`; chỉ
        dạng `appayitta`/`appaṇihita` với nghĩa `không hướng, không chỉ đến`. Sujato dịch
        *undirected*. `mn44:20.2` dùng `xúc vô nguyện`, nhưng `vô nguyện` chỉ có ĐÚNG
        1 chỗ trong cả tầng, còn `không hướng` có 75. Tôi dùng `xúc không hướng` và ghi
        lại đây là chỗ lệch có chủ đích với bản song song, không phải chỗ quên tra.
    (3) `ninna/poṇa/pabbhāra` (`9.2`, `9.3`) là ba đồng nghĩa mà Pāli liệt kê để nhấn;
        dịch bằng một từ sẽ mất phép liệt kê, nên tôi dùng ba động từ `hướng về / nghiêng
        về / xuôi về` theo đúng thứ tự Pāli. Cả ba đều có tiền lệ mạnh (445/132/67).
    (4) `Addhā kho tvaṁ … yaṁ paṭhamaṁ pucchitabbaṁ taṁ pucchasi` (`10.3`) là lời trách
        nhẹ của Kāmabhū, không phải lời khen. Tôi dịch `ngươi đáng lẽ ra phải hỏi trước,
        vậy mà bây giờ mới hỏi` — giữ được cả vẻ trách (`đáng lẽ … vậy mà`) lẫn chữ
        `pucchitabbaṁ` (việc đáng phải hỏi). Không nâng thành blocker vì Sujato cho
        cùng một nghĩa và không có cách đọc thứ hai.
    (5) `10.7` = `Chaṭṭhaṁ.` không phải lời thoại mà là số thứ tự kinh do SuttaCentral
        chèn (đã đối chiếu `sn41.1` = `Paṭhamaṁ.` … `sn41.10` = `Cittasaṁyuttaṁ
        samattaṁ.`). Dịch `Thứ sáu.` theo 255 chỗ tiền lệ.
    (6) `1.3` (`kati nu kho, bhante, saṅkhārā`) ngắn 35 ký tự nên KHÔNG nằm trong mẫu
        số 37, nhưng vẫn phải dịch và đã dịch. Cũng vậy 12 khoá < 40 ký tự khác đều đã
        dịch đủ; `set(khoá Việt) == set(khoá Pāli)` = 51/51, không gộp mất khoá nào.

