notes: |-
  **57 khoá** (0.1–0.3, 1.1–1.7, 2.1–2.4, 3.1–3.5, 4.1–4.5, 5.1–5.5, 6.1–6.3, 7.1–7.4, 8.1–8.3, 9.1–9.3, 10.1–10.3, 11.1–11.3, 12.1–12.3, 13.1–13.6), viết đủ cả 57; dump f202 == root JSON: 0 lệch.
  **Trùng nguyên văn (chỉ mục toàn kho 68.499 chuỗi Pāli): 11/57 khoá khớp tuyệt đối, đều dùng lại cách dịch đã có.** 18. Samuddavagga → *18. Phẩm Biển* (8 nơi) · Taṁ suṇātha → *Hãy lắng nghe.* (37 nơi) · nirayaṁ vā tiracchānayoniṁ vā (4 khoá) → *địa ngục hoặc loài bàng sinh.* (4 nơi) · 13.1 → nguyên văn `sn35.29:1.16` · 13.2 → nguyên văn `sn35.29:1.17` (cùng cặp đoạn với 13.1) · 13.6 Aṭṭhamaṁ → *Thứ tám.* (223 nơi).
  **Trùng nhưng chọn biến thể khác, ghi lý do:** `13.3` có 4 biến thể trùng Pāli; chọn `sn35.28:1.16` (*Do nhàm chán…trí hiểu biết rằng: ‘Đã giải thoát’.*) thay vì biến thể đông nhất (11 nơi *Chán nản rồi ly tham…*) để giữ nhất quán trong bài: `nibbinda` ở `13.1`/`13.2` đã khóa theo `sn35.29` = *nhàm chán*. `13.4` có ~17 biến thể; chọn `sn35.62:20.7` (cùng SN35): *Vị ấy biết rõ: ‘Sanh đã tận, phạm hạnh đã thành, việc cần làm đã làm, không còn trở lại trạng thái này nữa’.* — "pajānāti" → *biết rõ* khớp cặn kẽ hơn biến thể đông nhất (mn51, 4 nơi).
  **Tiêu đề:** Pāli `Ādittapariyāyasutta` → *Kinh Bài Pháp Về Lửa Cháy*; các bài chị em đã publish: `sn35.28` *Kinh Bốc Cháy*, `sn22.61` *Kinh Thiêu Đốt*, và uddāna cùng phẩm `sn35.237:3.4` gọi chính bài này là *bài Bị Đốt Cháy* — ba cách gọi khác nhau; chọn "Bài Pháp" để giữ `pariyāya` (1.1 và 13.5 có `dhammapariyāya` → *pháp môn*, khuôn `mn114:2.1`). Người biên tập có thể muốn thống nhất cả ba.
  **Tiền lệ thuật ngữ đã tra kèm đếm:** `cakkhundriya…kāyindriya` → *nhãn căn* (51 nơi) / *tai căn* / *mũi căn* / *lưỡi căn* / *thân căn* (khuôn `sn48.27–29`); `nimittaggāho` → *nắm giữ tướng* (khuôn `sn35.240:2.6`, 'nắm giữ tướng' 42 nơi); `anubyañjana` → *chi tiết* ('chi tiết' 236 nơi) — LƯU Ý: `sn35.240` dùng *tướng phụ* cho cùng từ trong formula của nó; chọn "chi tiết" vì ở đây `anubyañjanaso` là trạng ngữ phương cách ("theo các chi tiết"), không phải danh từ ghép đôi. `sutta`-nội bộ giữ nhất quán. `tiracchānayoni` → *loài bàng sinh*; `Tăng đoàn` (317 nơi) cho `saṅghaṁ bhindeyya` → *phá hoại Tăng đoàn* ('phá hoại' 73 nơi). Tên các căn thức/xúc theo `sn35.28`: *nhãn thức/nhãn xúc … ý thức/ý xúc*.
  **Bất định có nghĩa đáng kể, đã phân xử và ghi lại:** (1) `sampalimaṭṭhaṁ` — từ gốc paḷi-maṭṭha (nghiền, làm nát); Sujato *mutilating*; chọn *nghiền nát*; **người biên tập nên kiểm.** (2) Chủ ngữ của `kālaṁ kareyya` (`1.5` v.v.): Sujato hiểu là tỳ-kheo ("you were to die"); cú pháp optative 3sg vẫn điều khiển bởi `viññāṇaṁ` — bản dịch giữ chủ ngữ *ý thức* xuyên suốt ("…ý thức … vào lúc ấy chết đi…nó đi đến…"), ít giả định hơn. (3) Chuỗi công cụ nung: đủ 4 đơn vị `tattā/ādittā/sampajjalitā/sajotibhūtā` → *nung đỏ, bốc cháy, bùng cháy, rực sáng*. (4) `Tiṭṭhatu tāva` → *Thôi thì cứ để…* (Sujato *Forget…*).
  **Coverage Anh: 30/39 segment ≥40 ký tự có English Sujato; 9 chỗ trống** (`2.2`, `2.4`, `3.2`, `3.3`, `3.5`, `4.2`, `4.3`, `4.5`, `5.3`) — toàn bộ là lặp formula của `1.5`–`1.7` đã có English; những khoá đó có Pāli đầy đủ và được dịch trực tiếp. Không có tầng Việt hiện hành (bilara chỉ có Pháp Cú) — đã ghi vào scorecard.
  **Lược: mỗi khoá đếm lược(vi) == lược(pāli)**; các `…pe…` ở `9.3`, `10.3`, `11.3`, `13.1` giữ một "…"; `”ti` ở `13.5` giữ nguyên; quote đơn ‘…’ mở `7.2` đóng `12.3` như Pāli. Không blocker.
