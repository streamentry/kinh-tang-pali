notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato (34/35 khoá có chữ). Coverage English = 24/24 khoá Pāli có nội dung = 100%.
  0.1 giữ `Saṁyutta Nikāya 19.1`; 1.2 dùng lại nguyên văn tiền lệ 9 lần; 3.4, 3.5, 4.1 cũng có tiền lệ trùng Pāli và dùng lại.
  `gijjhakūṭa` dùng núi Linh Thứu theo tiền lệ 4 lần trên đĩa.
  0 tiền lệ: `aṭṭhikasaṅkhalikaṁ`, `phāsuḷantarikāhi`, `vitudenti`, `vitacchenti`, `virājenti`, `goghātako`, `yakkho`. Dịch trực tiếp theo Pāli + Sujato (bộ xương; mổ, cào, xé qua kẽ sườn; kẻ giết bò; yêu quái).
  BẤT ĐỊNH: `attabhāvapaṭilābho` chỉ có 1 tiền lệ (sự hiện hữu, `sn20.11`) và tiền lệ ấy không cho biết sắc thái. Dùng sự hiện hữu ở 3.8 và 4.8 để nhất quán với tiền lệ, thay vì tự đặt một từ Hán–Việt khó (thân tướng ứng nghiệm) không có chứng cứ.
  Danh xưng: Pāli ghi `mahāmoggallāno` nhưng tầng Việt đã có cả Đại Moggallāna lẫn Moggallāna; dùng Đại Moggallāna ở phần văn xuôi và Moggallāna ở phần đối thoại (`āvuso moggallāna`), khớp cách Pāli dùng tên ngắn trong lời gọi thân mật.
  4.8 `vipākāvasesena` dùng lại cụm quả còn dư của nghiệp ấy theo tiền lệ `ud5.3`.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` do coordinator chạy; `npm run build` chỉ cần thêm cho bài `published`. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
