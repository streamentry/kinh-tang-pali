  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `3.1`, `3.6` (`catūhi sotāpattiyaṅgehi samannāgato`) — «Thế nào là bốn chi phần dự lưu mà vị ấy thành tựu?» → «Bốn chi phần Dự lưu mà vị ấy thành tựu là những gì?»; «Đó là bốn chi phần dự lưu mà vị ấy thành tựu.» → «Đây là bốn chi phần Dự lưu mà vị ấy thành tựu.» (công thức của sn55.28, sn12.41, an10.92; viết hoa «Dự lưu» theo tầng). Giữ `1.2`, `5.1` («dự lưu» viết thường trong câu dài) vì Pāli không trùng.
