notes: |-
  **Phạm vi lát c7: đủ mọi khoá trong `all` của bài, không thêm khoá nào.**
  Chạy lại `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tự kiểm những
  cờ mà `rven88.py` không áp cho tầng Việt: đủ khoá và đúng segment ID theo `pre`
  (tiền tố khoá thật, không phải uid-gộp); ngoặc kép cân trên cả bài; mọi chuỗi
  đã NFC; không Pāli lọt; số dấu lược bằng Pāli.

  **Không đối chiếu được tầng Việt hiện hành.** Tại commit đã ghim,
  `translation/vi/` của bilara chỉ chứa Pháp Cú, nên các bài này không có bản Hòa
  thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu
  sót của kho; `triangulation` vì thế chỉ ở mức Pāli + English Sujato.

  Tôi **không** chạy `npm run validate|test|check|build` (đợt này cấm; người điều
  phối chạy tập trung sau khi gộp các pre), nên `technical_integrity` chấm 9.6
  chứ không phải 10.0.

  **Khung theo nhóm anh em `sn19.16`/`sn19.17` (đã `published`).**
  `0.1` giữ *Saṁyutta Nikāya* như các bài Tương Ưng đã dịch (không viết *Tương
  Ưng Bộ* ở khối `:0` này); `0.2` *2. Phẩm Thứ Hai*; `0.3` theo mẫu *Kinh
  Tỳ-kheo Bất Thiện* của `sn19.17:0.3`, thêm *ni* đúng theo Pāli
  `Pāpabhikkhunī`; `pāpa` → *bất thiện* theo `sn19.17:1.4`.

  **Thuật ngữ, đếm được.** `vehāsa` → *bay trên hư không* (3 chỗ *bay trên hư
  không như chim*). `saṅghāṭi` → *y khoác ngoài* theo `sn19.17:1.2`; `ādittā* →
  *đang cháy* (Pāli là lửa đang cháy, không phải *cháy đen* như ngữ cảnh khác
  của bài anh em). `ahosi` (quá khứ) → *từng là*, đúng như Sujato *used to be*.

  **Hai khoá lược dịch từ Pāli một mình.** `1.2` và `1.3` có `…pe…` mà bản Anh
  Sujato bỏ trống, nên mỗi khoá giữ đúng một dấu lược; nghĩa khoá (*y đang
  cháy*, *từng là tỳ-kheo-ni bất thiện*) vẫn đầy đủ trong Pāli, không phải suy
  đoán. Đây là lý do `triangulation` chỉ 8.3.
