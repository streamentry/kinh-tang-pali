notes: |-
  Dịch từ Pāli root tại commit bilara đã ghim, đối chiếu với bản Anh của Bhikkhu Sujato tại cùng commit.
  Bài này là bài ĐẦU của cặp `Natumhākasutta` / `Dutiyanatumhākasutta`, nên tôi dịch 0.3 là Kinh Không Phải Của Các Ông (không thêm (Hai) như sn22.34); 0.2 theo đúng `sn22.34` đã published: 4. Phẩm Không Phải Của Các Ông.
  Tái dùng nguyên văn bản Việt đã có, đếm được: 15/31 khoá có Pāli trùng nguyên văn với bài đã dịch. Cụ thể, `Yaṁ, bhikkhave, na tumhākaṁ, taṁ pajahatha.` trùng `sn22.34:1.2`; `Taṁ vo pahīnaṁ hitāya sukhāya bhavissati.` trùng 9 lần (`sn22.34`, `sn35.102`, `sn35.138`, `sn35.139`) và tôi dùng lại đúng cách đã có: Cái ấy được từ bỏ sẽ vì lợi ích và hạnh phúc cho các ông; `Kiñca, bhikkhave, na tumhākaṁ?` trùng 4 lần; `Rūpaṁ …` và `viññāṇaṁ …` trùng `sn22.34`; `Te vo pahīnā hitāya sukhāya bhavissanti.` trùng `sn35.102`/`sn35.139` → Chúng được từ bỏ sẽ vì lợi ích và hạnh phúc cho các ông.
  Ví dụ rừng Jeta ở `2.1`–`2.3` và `2.6` trùng nguyên văn `sn35.138:1.10`–`1.14`, tôi dùng lại đúng bản Việt đã có (kể cả Câu Ví như, này các tỳ-kheo, ở trong khu rừng Jeta này có cỏ, cây, cành lá, và người ta gom lấy, thiêu đốt hoặc xử lý tùy theo ý muốn).
  Ngoặc kép bám đúng Pāli: mở ở `1.2`, đóng ở `2.3` (dấu ’”), mở ở `2.7`, đóng ở `2.14`. Hai cặt lời thoại trong nội thành ở `2.4` và `2.5` mang dấu ASCII trong Pāli; tôi dùng ngoặc kép cong cho cả hai vế như `sn35.138` đã published, vế `2.5` đóng trước dấu hỏi để cân.
  ⚠ Đặc thù tầng Pāli tại commit đã ghim, ghi ra chứ không sửa: `1.9`, `2.11`, `2.12` kết bằng dấu lược trần ngay trong Pāli root (không phải …pe…), và `1.10` cùng `2.13` bắt đầu bằng chữ thường (`saṅkhārā`, `viññāṇaṁ`) vì câu nối từ khoá trước. Tôi giữ nguyên số dấu lược từng khoá và giữ chữ thường theo Pāli.
  `attā` dịch tự ngã theo đúng bản đã published ở `sn35.138:1.14` với cùng Pāli này; kho còn dùng bản thân ở Diṭṭhisaṁyutta (sn24.38) — hai cách cùng tồn tại, tôi theo bản trùng Pāli.
  Coverage: 12 khoá Pāli có nội dung (≥ 40 ký tự), 12 có chữ Anh ⇒ 100%, trên ngưỡng 0.8. Hai khoá Sujato để trống (`1.8`, `2.10`) dài 39 ký tự nên không tính vào mẫu số; `1.11` trống ở Sujato nhưng đã được lớp english-project của dự án lấp và ở trạng thái published nên vẫn được tính. Không cần ghi vào content/meta/reference-gaps.yaml.
  technical_integrity 9.6 vì agent lát này không chạy gate. Bốn lệnh gate do coordinator chạy trước khi publish: npm run validate, npm test, npm run check, npm run build.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `4. Natumhākavagga` → «4. Phẩm Không Như Mình». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.
