  ⚠ **Hai chỗ phải rời khỏi nguyên văn, đã ghi lý do.**

    (1) **`1.13` — bỏ dấu `“` mở.** Pāli của cả bài **dư đúng một** dấu nháy kép mở: lời
    các vị tỳ-kheo ở `1.13` (`“Bhagavaṁmūlakā no, bhante, dhammā …pe…`) có dấu mở nhưng
    dấu đóng nằm **bên trong** `…pe…`, còn `2.1` lại mở nháy kép mới. Đếm cả bài: **12**
    dấu `“`, **11** dấu `”`. Giữ nguyên mọi vị trí còn lại rồi **bỏ** dấu mở thừa ở
    `1.13` ⇒ 11/11, không bao giờ âm. Đây là cách sửa duy nhất không thêm và cũng không
    xoá chữ nào; 117 tệp `sn` đã dịch cũng lệch số dấu nháy kép so với Pāli. Lưu ý:
    `sn24.6` — cùng hình dạng — **không** dư, vì mục 3 của nó thiếu một vòng; đừng dùng
    nó làm chuẩn đối chiếu. Hệ quả phụ: `1.13` **không còn** là bản dùng lại y nguyên văn
    của `sn24.2:1.4` / `sn24.6:1.8` / `sn24.8:1.16` (thiếu dấu mở), nên số dùng lại thực
    là **31/32**.

    (2) **`1.3` — vế mở đầu của thế kiến vô giả.** Nhiều tệp trong tầng dịch *Không có ý
    nghĩa trong bố thí* (theo cách Sujato dịch tiêu đề: `mn60:5.2`, `mn60:7.2`). Đa số cục
    bộ — `an10.212:2.10`, `an10.216:5.10`, `an3.118:4.3`, `an3.119:3.3`, `mn110:11.3`,
    `mn114:10.10` — dùng *Không có sự bố thí*, và Pāli `natthi dinnaṁ` nghĩa đen cũng vậy
    (không có sự cho, không có sự tặng). Đã theo đa số.

  **Thuật ngữ — đếm trên tầng Việt, chỉ `sn` khi có.**
    · `sotāpanno` → *nhập lưu*; `avinipātadhammo` → *không rơi vào ác đạo*;
      `niyato sambodhiparāyano` → *chắc chắn, hướng về giác ngộ* (`sn24.1:5.2`,
      `sn24.2:3.2`, `sn24.3:4.2`, `sn24.4:4.2` — cùng Pāli, dùng lại y nguyên văn).
    · `kaṅkhā` → *nghi ngờ*; `ṭhānesu` → *ở những chỗ này*; `dukkhanirodha` → *diệt tận*.
    · `atthikavāda` → *chủ trương có thật* (`dn23:5.0` dịch phẩm `Natthikavāda` là *Chủ
      trương hư vô*; ở đây Pāli `ye keci atthikavādaṁ vadanti` là hành động nói, nên
      "chủ trương có thật" mới đúng; `1.11` dùng lại nguyên văn `dn2:23.8`).
    · `rūpa/vedanā/saññā/saṅkhāra/viññāṇa` → *sắc / cảm thọ / tưởng / các hành / thức*.
      ⚠ `content/glossary/pali-vi.yaml` đặt `vedanā` là *thọ* (`severity: warn`), nhưng
      bốn khoá Pāli trùng nguyên văn ở `2.4` và `3.8` đã được dịch sẵn thành *cảm thọ*
      (`sn24.1:3.3`, `sn24.3:2.3`, `sn22.97:6.4`), và phải dùng lại nguyên văn ⇒ giữ *cảm
      thọ* trong `sn24.5`. Bài song song `sn22.95` cùng lát dùng *thọ* theo glossary. Người
      điều phối nên chốt: glossary hay tiền lệ.
    · `Cātumahābhūtiko` → *do bốn đại hợp thành* (`mn76:7.3`, `mn76:8.4`; `dn2:23.3` dùng
      *bốn đại tạo thành*); `anupeti anupagacchati` → *trở về với khối …* (`mn76`),
      `dn2:23.3` dùng *nhập vào, đi về thân …*; `Ākāsaṁ indriyāni saṅkamanti` →
      *các căn chuyển vào hư không* (`mn76`, `dn2:23.3`); `Kāpotakāni` → *xám bồ câu*
      (`mn76:7.6`).
    · `mataṁ` → *xác chết*; `āḷāhana` → *thiêu xác* (`sn7.12:5.2`); `āhuti` → *lễ vật hiến
      dâng*; `atthikavāda` xem trên.
    · `Taṁ kiṁ maññatha` → *Điều ấy các ông nghĩ sao* (33/75 khoá trong `sn`);
      `No hetaṁ, bhante` → *Thưa không phải vậy, bạch Thế Tôn* (52/103);
      `Aniccaṁ, bhante` → *Vô thường, bạch Thế Tôn* (35/82).
    · `api nu taṁ anupādāya evaṁ diṭṭhi uppajjeyya` → *lẽ nào cái ấy mà không chấp thủ
      thì ý kiến như sau vẫn khởi lên*. ⚠ Không chép bản Anh đã ghim của `3.19` (Sujato
      thêm *impermanent, suffering, and perishable*) vì Pāli ở `3.19` **không** có các tính
      ngữ ấy — chúng chỉ xuất hiện ở `sn24.2:2.9`. Chép theo là thêm chữ không có nguồn.
    · Tên kinh `Natthidinnasutta` → *Kinh Không Có Sự Bố Thí*, theo đúng quy ước `sn24`
      (tên dịch nghĩa, không chép English "There's No Meaning in Giving").

  **Bất định đã ghi.**
    · `natthi paro loko` → *không có thế giới bên kia* (`mn114:10.10` dùng đúng cụm này;
      `mn76:8.3` dùng *không có đời sau*). Giữ *bên kia* để phân biệt với `ayaṁ loko` và
      không kéo theo ngụ ý đời sau của các bản kia.
    · `sukata-dukkata` ở `1.3` dịch *lành và dữ* (`mn114:10.10`, `mn110:11.3`), không
      dùng *thiện ác* của `mn76:8.3`, vì Pāli đặt `sukata` trước `dukkaṭa` và bản đã ghim
      ở `sn` không có tiền lệ nào khác.
    · `2.3` và `2.9` bắt đầu bằng `kāyassa bhedā` vì `…pe…` đã lược mất vế `Bāle ca
      paṇḍite ca`; `3.6`/`3.15` cũng vậy. `3.22` thì Pāli viết `bāle` chữ thường ⇒ vế
      nối tiếp từ `3.21`. Bản Việt giữ đúng cách viết này, đọc liền mạch.
    · Toàn bộ khối 3 là **rút gọn nặng** (`natthi dinnaṁ …` bị lược đúng khối giáo lý
      vô giả). Người đọc chỉ thấy *Không có sự bố thí, không có sự hiến tế …* rồi tới
      *khi thân tan rã, đều bị đoạn diệt*; **không** mở rộng, vì không có nguồn nào chứng
      thực tại đúng chỗ bị lược.

