notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim, các bài song song trong kho (mn143 cùng người bệnh và cùng Tôn giả Sāriputta; sn55.27, sn55.13, sn55.31, sn55.33, sn47.29, sn35.74/75/87, sn46.14/15) và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không căn theo segment nên chỉ dùng để kiểm thuật ngữ và mạch lập luận, không làm tầng cột). Tầng `vietnamese-current` căn theo segment không có cho bài này (tại commit đã ghim chỉ có 26 chương Pháp Cú).
  **Coverage English (đo lại, không kế thừa).** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = **62** (bài có 88 khoá, trong đó 85 khoá ngoài khối `:0`). Sujato phủ **48/62 = 0,7742**, dưới ngưỡng 0,80. 14 khoá Sujato để trống mà Pāli viết đủ: `3.1` `3.2` `3.4` (Sujato gộp lời người tớ ở `2.1`, để trống phần nhắc lại), `10.2` `10.3` `11.3` `12.2` `12.3` `13.3` `14.3` `15.3` `16.2` `16.3` `17.3` (Sujato viết `X.1` cụt kết bằng dấu lược rồi để trống các khoá kế). Lớp `english-project` đã `published` lấp 21 khoá ở bài này (kể cả các khoá dưới 40 ký tự) nên cổng máy tính **62/62 = 1,00**; nhưng lớp lấp do cùng họ công cụ của dự án viết, dựng lại từ chính lời Sujato ở các khoá lặp trong bài, nên **không phải cách đọc English độc lập**. Vì vậy: `triangulation` 7,5 (không tuyên bố đã đối chiếu English toàn bài), `status: draft` kèm blocker. Nếu người biên tập chấp nhận lớp lấp là tầng tham khảo đủ, blocker này có thể gỡ và bài đủ điều kiện xét lại; tôi không tự gỡ. Bài ở trạng thái `draft` nên chưa cần entry trong `content/meta/reference-gaps.yaml`.
  **Dùng lại nguyên văn đã có, đếm được.** 29/88 khoá Pāli trùng nguyên văn với khoá ở bài khác, tổng 899 cặp, trong đó 137 cặp bản Việt khác bản này. Phần lớn chênh lệch nằm ở hai khoá công thức rất nhiều cặp: `1.1` (451 cặp: *Tại Sāvatthī.* 428, còn lại *Duyên khởi*/*Nhân duyên*; 20 cặp khác) và `24.6` (279 cặp: *Thứ sáu.* 273 cặp, 5 cặp khác). `0.2` *3. Phẩm Quy Y* 8/8 cặp. `1.2`, `1.3` lấy từ `mn143:2.1`, `2.2` (2/2 cặp trùng nhau, 0 khác). `1.5`, `1.6`, `1.8`, `3.4` lấy từ `mn143:2.7`, `2.8`, `2.10`, `2.18` (cùng thông điệp, cùng người nhận là Tôn giả Sāriputta; `1.5` có 3 cặp: `mn143:2.4` nhận là Thế Tôn nên *Bạch Thế Tôn*, `sn55.27:1.5` nhận là Tôn giả Ānanda nên *Bạch thầy*; chọn *Bạch Tôn giả* theo người nhận). `1.7` (*Và hãy nói thêm* 6 trên 11 cặp). `3.5` (*im lặng nhận lời* là đa số toàn tầng). `5.3` lấy dạng của `sn55.27:8.4`, `sn55.31:1.5`, `sn55.33:1.4` (12 trên 45 cặp; các dạng còn lại *Đây là Thế Tôn … bậc Thầy* 9, *đây là Thế Tôn … bậc Đạo Sư của chư thiên và loài người* 7, *chính vì lý do này* 6). `6.3` và `7.3` theo `sn55.27:9.2`, `10.2`, `sn55.31:2.2`, `3.2` (6.3: 2/2 cặp trùng; 7.3: 5 trên 6 cặp trùng). `24.1` lấy nguyên văn `sn36.16:1.1` và `sn54.14:1.1` (2 trên 10 cặp trùng; 8 cặp là dạng khác của công thức đi đến Thế Tôn). Các khoá kệ `20.1`–`22.4` đối chiếu `sn55.51:3.1`–`5.4`, `thag2.42`, `an4.52`, `an5.47`, `thag8.2` (Pāli trùng nguyên văn; các bài này dịch khác nhau nên không có dạng chiếm đa số tuyệt đối). Trong chính bài chỉ có 1 cặp Pāli trùng nguyên văn (`1.8` = `3.4`) và bản Việt giống hệt nhau (0 cặp khác).
  **Số Pāli.** `cattāri sotāpattiyaṅgāni` (`24.5`) = *bốn chi phần Dự lưu* (`catu` = 4). `dasahākārehi` = *mười phương diện* (`dasa` = 10; tiền lệ `dn5:16.1`, `16.16` dịch `dasahākārehi` là *mười phương diện*). Không có số nào khác trong bài.
  **Thuật ngữ chọn theo tiền lệ đếm được.** `aveccappasāda` → *tịnh tín bất động* (57 khoá so với *niềm tín xác quyết* 29 trên 177 khoá có dạng này; `sn55.19`, `sn55.27`, `sn55.33` cùng chọn *tịnh tín bất động*). `appasāda` → *tâm không tịnh tín* theo `sn55.27` (9 khoá *tâm không tịnh tín*, 3 khoá *lòng không tịnh tín* ở `sn55.13`, 2 khoá *bất tín*; phần còn lại là các công thức khác). `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ` → *cõi dữ, ác thú, đọa xứ, địa ngục*: trong các khoá có công thức này, dạng kết bằng *ác thú, đọa xứ, địa ngục* có 62 khoá, dạng *ác thú, cõi đọa, địa ngục* có 32 khoá, và `sn3.21:2.5` cũng dùng *cõi dữ, ác thú, đọa xứ, địa ngục*. `ṭhānaso` → *ngay tại chỗ* (41 khoá có *ngay tại chỗ* trên 58 khoá có `ṭhānaso`, như `sn45.156`, `sn54.9`, `sn8.8`). `paṭippassambheyya` → *lắng dịu* (như `sn10.8:4.1`: *lắng dịu*; `sn7.13:5.3` dùng *thuyên giảm* cho bệnh, nhưng ở đây tránh trùng với *thuyên giảm* của `paṭikkamanti`). `ariyakanta` → *được bậc Thánh yêu mến* (41 khoá *yêu mến* so với 25 khoá *yêu thích* trong 75 khoá có `ariyakanta`; `sn55.19`, `sn55.27` chọn *yêu mến*). `assutavā puthujjano` → *phàm phu chưa nghe pháp* theo `sn55.27:4.1`. `micchā-`/`sammā-` mười chi → *tà/chánh kiến · tư duy · ngữ · nghiệp · mạng · tinh tấn · niệm · định · trí · giải thoát* theo `dn34`, `an10.103`, `sn45.1`, `mn117`. `adaliddo` → *không nghèo khó* (8 khoá so với 2 khoá *không thiếu*, 1 *không nghèo khổ*, 1 *keo kiệt* ở `sn55.51:4.3`; *keo kiệt* là dạng lệch nghĩa, không theo). `sotāpattiyaṅga` → *chi phần Dự lưu* (28 khoá so với *thành phần* 7). `ovāda` → *giáo hóa* (như `sn35.88`, `mn145`). `mahāpañño` → *bậc đại trí tuệ* (như `sn35.117:11.1`, `mn111:2.2`; *đại tuệ* ở 3 khoá khác). `anumodi` (lời kệ) → *tùy hỷ* (`dn16:1.31.1`, `1.31.14`, `dn19:3.4`, `17.3`; `mn92:25.6` dùng *tán thán*). `pacchāsamaṇa` → *với Tôn giả Ānanda theo sau* theo `mn143:3.1`. `thālipāka` → *nồi thức ăn* (như `dn17`, `sn22.96`).
  **Chỗ cố ý khác tiền lệ gần nhất, đã đo.** (1) `4.3` (`bāḷhā me dukkhā vedanā abhikkamanti`): ba cặp Pāli trùng (`sn46.14:2.2`, `sn46.15:2.2`, `sn55.3:2.3`) bỏ chữ `bāḷhā` (*kịch liệt*/*nặng*); bài này giữ *rất khốc liệt*, theo `mn143:4.1` và `sn35.87:3.1` là nơi Pāli có `bāḷhā` và cùng người nói. (2) `2.1` (`“Evaṁ, bhante”`): người tớ đáp chính người gia chủ; `sn55.27:2.1` và `sn47.29:1.9` viết *Vâng, bạch thầy*, `mn143:2.11` viết *Vâng, thưa ông*; chọn *thưa ông* vì người được xưng hô là Anāthapiṇḍika chứ không phải vị Tôn giả. (3) `nivesana` → *nhà* (`mn143:2.10`, `3.1`) thay cho *nơi trú ngụ* ở `sn55.27`, vì `nivesana` của người cư sĩ. (4) `4.2` kết bằng *chứ không phải sự gia tăng?* theo `sn35.74:2.9`, `sn35.75:2.8` (hai khoá), không theo dạng *…không?* của `mn143:3.2`, `sn46.14:2.1` vì Pāli không có phủ định cuối câu nào để lặp.
  **Bất định đã ghi nhận, không che.** (1) `vedanā` ở `5.4`…`18.3` trong Pāli không có `dukkhā`; theo văn cảnh (`4.2`–`4.3`, `dukkhā vedanā`) và Sujato (*pain*) được hiểu là các cảm thọ khổ đang tăng của người bệnh. Bản Việt giữ nguyên *các cảm thọ*, không thêm *khổ*, để Pāli tự đứng; Hòa thượng Thích Minh Châu viết *các cảm thọ của Gia chủ được an tịnh* cũng không thêm. (2) `8.2` (`ariyakantāni sīlāni … pe samādhisaṁvattanikāni`): Pāli ở khoá này lược bằng `… pe` và không có `akhaṇḍāni`; bản Anh Sujato mở rộng thành danh sách (*unbroken, impeccable…*), bản Việt của `sn55.27:11.1` và `sn55.19:2.6` có *không bị sứt mẻ* vì Pāli ở đó có `akhaṇḍ-`. Bài này giữ *các giới được bậc Thánh yêu mến … đưa đến định* với một dấu lược, **không** thêm *không bị sứt mẻ* vì Pāli ở khoá này không có chữ ấy. (3) `24.5`: `yatra hi nāma … vibhajissati` là kiểu nhấn mạnh sự lạ (Sujato: *since he can analyze*, Hòa thượng Thích Minh Châu: *Vị ấy có thể chia chẻ…*); bản Việt viết *vì vị ấy có thể phân tích*, giữ lý do mà không thêm sắc thái ngạc nhiên. (4) Số *mười phương diện* ở `24.5` không khớp tự nhiên với thân bài (bài liệt kê 4 chi phần `5`–`8` rồi 10 chi chánh/tà `9`–`18`, tức 14 nhóm); Sujato cũng giữ *ten respects*. Bản Việt giữ *mười phương diện* đúng Pāli, không tự suy mười phương diện là gì. (5) `19.2` `sakeneva thālipākena parivisi`: *dâng thức ăn … bằng chính nồi thức ăn của mình*; Hòa thượng Thích Minh Châu viết *từ nơi nồi nấu cơm của mình* trong ngoặc. (6) `24.2`: tiểu từ `handa` không dịch riêng (không tiền lệ nào trong tầng cho khoá này), `divādivassā` → *vào giữa ban ngày* theo `mn27:2.1`. (7) `20.4`, `21.2`: `ariyakantaṁ pasaṁsitaṁ` → *được bậc Thánh yêu mến và tán thán*; `ujubhūtañca dassanaṁ` → *và tri kiến ngay thẳng* (các bài kệ song song dịch `dassana` là *tri kiến*, *kiến giải* hoặc *cái thấy*; không có dạng chiếm đa số, chọn *tri kiến* theo `sn11.14` và `an5.47`).
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 88/88, đúng thứ tự Pāli. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá, 88 khoá (mẫu số 88, 0 lệch). Dấu lược: 4 khoá Pāli có dấu lược (`5.3`, `6.3`, `7.3` là `…pe…`, `8.2` là `… pe`); cả 4 khoá Việt giữ đúng một `…`, không mở rộng, không có `(…)` nào. NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang bản Việt. Số cặp Pāli trùng nguyên văn trong chính bài: 1 (`1.8` = `3.4`), Việt giống nhau.
