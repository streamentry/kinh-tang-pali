notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `12. Balakaraṇīyavagga` → «12. Phẩm Công Sức». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.1, 2.6, 2.9, 2.12 — ‘thế nào là những pháp cần
  phải … bằng thắng trí?’ → ‘những pháp nào cần phải … bằng thắng trí?’ (`katame dhammā` = ‘những
  pháp nào’, cùng cách ở `mn149:11.1–11`); giữ ‘cần phải’ và các động từ liễu tri / đoạn trừ / tác
  chứng / tu tập vì cả bài (1.2, 1.3, 2.5, 2.8, 2.11, 2.14, 2.15, 2.17) dùng đúng bộ này; giữ
  nguyên khoá 2.4 vì dạng modal của khoá ấy là bản sai (mở rộng `…pe…` thành năm uẩn kèm ‘của sự
  tham trữ’, vốn không có trong Pāli).
  Dấu lược khoá 2.16 (ngoài danh sách): Pāli kết bằng `…` nên thêm ` …` ở cuối câu Việt cho cân với Pāli; không đổi nghĩa.
