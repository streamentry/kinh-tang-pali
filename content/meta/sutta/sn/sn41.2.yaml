  Bất định đã phân xử và ghi lại:
    (1) `4.6` là `Dutiyaṁ.` — *Thứ hai* — dù bài này là `Paṭhamaisidattasutta`. Bản Pāli MS tại commit đã ghim viết vậy; dịch theo nguyên văn và KHÔNG sửa PāLI.
    (2) `2.12` là `Tatiyampi kho āyasmā thero tuṇhī ahosi.` trong khi bản Anh Sujato đã ghim đã ghép câu trả lời lần hai và lần ba vào một chỗ. Theo PāLI thì đây là lần thứ BA im lặng, và bản dịch bám PĀLI, không bám bản Anh.
    (3) `1.5` dịch `padakkhiṇaṁ katvā` thành `vòng quanh giữ sang bên phải các ngài` — hiểu được nhưng hơi rối; giữ nguyên vì không sai nghĩa (Pāli `padakkhiṇa` là vòng vâng kính trọng, và Sujato cũng giữ hình ảnh đi vòng giữ bậc trên bên phải).

