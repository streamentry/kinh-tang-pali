    · 0.1 bài an: quét 1.248 khoá `:0.1` trong tầng `an` -> `Kinh Tăng Chi Bộ` 895, `Aṅguttara Nikāya` 353, không có dạng thứ ba. Đa số là `Kinh Tăng Chi Bộ` (72%), nên cả 4 bài an của lát đều dùng nó.
    · Tên phẩm, đếm bằng cách ghép Pāli↔Việt ở khối `:0.2` toàn tầng: `1. Cittavagga` -> `1. Phẩm Tâm` (3 tệp) · `2. Pāsādakampanavagga` -> `2. Phẩm Vui Vẻ` (7 tệp) · `1. Rahogatavagga` -> `1. Phẩm Ở Riêng` (10 tệp) · `12. Paccorohaṇivagga` -> `12. Phẩm bước xuống` (6 tệp) · `17. Jāṇussoṇivagga` -> `17. Phẩm Vua Jāṇussoṇi` (7 tệp) · `2. Mahāvagga` -> `2. Phẩm Lớn` (5 tệp). Không tạo cách thứ N+1.
