  Bất định đã phân xử và ghi lại: (1) `sn41.2:4.6` là `Dutiyaṁ.` — *Thứ hai* — dù bài này là `Paṭhamaisidattasutta` (bản Pāli MS tại commit đã ghim viết vậy; đây là điểm nghi ngờ của bản in, mình dịch theo nguyên văn và KHÔNG sửa PāLI). (2) `Sn41.2:2.12` là `Tatiyampi kho āyasmā thero tuṇhī ahosi.` trong khi bản Anh Sujato đã ghim dịch lệch (ghép câu trả lời lần hai và lần ba vào một chỗ); theo PāLI thì đây là lần thứ BA im lặng, và mình dịch theo PāLI.
