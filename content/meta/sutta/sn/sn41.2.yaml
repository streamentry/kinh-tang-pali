  Dịch từ Pāli root tại commit đã ghim. COVERAGE ĐO LẠI bằng chính hàm của kho (`englishCoverageFor`, ngưỡng khai trong `source/layers.yaml`): `english-sujato` phủ 30/30 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối tham chiếu `:0`) = 1.000; `english-project` có tệp lấp cho bài này nên được tính vào. Tầng `vietnamese-current` không có — tại commit đã ghim bilara chỉ phân phối Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của repo.

  ĐỢT NÀY LÀ LƯỢT REVIEW ĐỐI KHÁNG THỨ HAI, trên bản dịch đã có trên đĩa. Sửa 2 khoá, giữ nguyên 39/39 khoá:
    · `4.4` — LỖI XƯNG NGÔ. Pāli `sādhu kho taṁ, āvuso isidatta, eso pañho paṭibhāsi, neso pañho maṁ paṭibhāsi` do Tôn giả trưởng lão nói với Isidatta, tức người nhỏ tuổi nhất trong tăng đoàn (`sn41.2:3.1` `sabbanavako`). Bản dịch dùng `con` — tức cách tự khiêm của bậc dưới nói với bậc trên, đảo ngược thứ bậc, và trái với chính `ngươi` đứng ngay trước trong cùng câu cũng như `4.5`. Đã sửa thành `ta`. Trong cả tầng chỉ có 4 chỗ ghi `Đạo hữu` và cả 4 đều ở lát này, nên không có tiền lệ nào để bám; phán xử theo Pāli.
    · `3.4` — LỖI DẤU CÂU. Bản dịch viết `…gia chủ Citta.”.` tức có dấu chấm câu bên trong ngoặc kép rồi lại thêm dấu chấm nữa bên ngoài. Pāli `Byākarohi tvaṁ, āvuso isidatta, cittassa gahapatino etaṁ pañhan”ti.` không có dấu kết trong lời. Đã sửa thày đủ `…gia chủ Citta”.`
  Số khoá sửa: 2. Sửa đúng một dấu lệch thứ bậc và một lỗi chấm câu, không đụng ý nghĩa, nên `grammar_logic` hạ còn 9.2 (đã sửa xong) chứ không hạ `segment_alignment` — không khoá nào thừa, thiếu hay lệch, vẫn 39/39 khớp đúng khoá Pāli.

