    · Dấu lược: đếm từng khoá, tính `…pe…` là MỘT dấu lược và dấu `…` trần cũng là một dấu lược — chỉ `sn41.2:3.10` có, Pāli 1 / Việt 1. Cả 39 khoá khớp, không mở rộng ở đâu.
