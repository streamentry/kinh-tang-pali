  Coordinator (gộp thuật ngữ tên bộ, 2026-10-04): khối `:0.1` đổi "Tương Ưng Bộ" → "Saṁyutta Nikāya". Đếm lại trên toàn tầng: 1.211 tệp giữ PĀLI / 326 tệp dịch — 78,8% giữ PĀLI. Hai agent cùng đếm gần giống nhau rồi kết luận ngược nhau (1.187 vs 315 và 1.074 vs 316), nên đã đếm lại từ đầu thay vì theo lời báo. Đây là tên bộ ở khối tiêu đề, không đổi nghĩa segment nào. Phạm vi: cả tầng sn, gồm cả tệp đã merge trước đợt này.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.2 — «đi vào nơi tịnh tu trong thời nghỉ trưa, nhập định tĩnh lặng» → «đang trong thời nghỉ ban ngày, nhập tĩnh cư» (`divāvihāragato … paṭisallīno` không có «nơi», và `paṭisallīna` là ẩn cư chứ không phải «nhập định»; theo 3 khoá trùng ở `sn6.6`–`sn6.8`, `sn11.8`). Giữ «Lúc bấy giờ» (244 khoá so với «Bấy giờ» 168) và «Đức Phật» theo cả bài.
