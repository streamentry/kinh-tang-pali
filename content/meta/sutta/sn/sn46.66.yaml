notes: |-
  **UID-gộp: đã đọc `path` và đếm thật.** `path` là `sn/sn46/sn46.66_root-pli-ms.json`, 11 khoá, và **tiền tố khoá thật là `sn46.66:`** — không phải uid từng bài. `all` khớp 11/11, `thừa` bằng 0. `an6.143-169` trong lát này cũng vậy (uid-gộp nhưng khoá vẫn mang uid-gộp); hai bài khác dạng là `sn12.83-92` và `sn48.83-92`, tôi đã so với chúng và **không** áp nhầm.

  **Tự kiểm.** Chỉ `1.1` là khoá ≥ 40 ký tự nên `kiểm()` của `_hvi.py` chỉ bắt một khoá; các cổng còn lại không tự chạy cho phần lớn lát. Tôi tự quét MỌI khoá của cả lát (`_tvd7_2_chk.py`, 136 khoá): đúng tập khoá `all`, NFC, **số dấu lược khớp Pāli từng khoá**, ngoặc kép cân trên cả bài, không Pāli lọt, không `(…)`, không trùng Pāli, `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Dấu lược `1.1`: KHÔNG mở rộng.** Pāli `“Ānāpānassati, bhikkhave, bhāvitā …pe…”` — một `…pe…`, nên bản Việt giữ **một** `…` (BRIEF_VI3 §10.1). Bản Anh Sujato ở đúng khoá này **đã mở rộng** phần lược thành *it’s very fruitful and beneficial*; đó là chữ của Sujato, không phải chữ có trong Pāli gốc, nên tôi không theo. Đây là lý do `triangulation` chỉ 8,2: tầng Anh có ở `1.1` nhưng **không** dùng được ở chỗ lược.

  **Uddāna: dùng đúng `translationTitle` của chính các bài anh em, đếm từng bài.** `sn46.58` *Kinh Niềm Tưởng Về Đám Bụi* · `sn46.59` *Kinh Niềm Tưởng Về Tử Thi Xanh Bầm* · `sn46.60` *Kinh Niềm Tưởng Bị Cắt Xẻ* · `sn46.61` *Kinh Niềm Tưởng Trương Sình* · `sn46.62` *Kinh Lòng Từ* · `sn46.63` *Kinh Lòng Bi* · `sn46.64` *Kinh Hoan Hỷ* · `sn46.65` *Kinh Xả*, tất cả đều `published`. Mười mục của uddāna khớp đúng mười bài `sn46.57`–`66`; `2.2` `pañcamaṁ` chỉ đúng khi *Uddhumātaka* là mục thứ năm, và `2.4` `te dasāti` là *đủ mười bài là vậy* theo cùng cách `sn27.10:2.4`.

  **Một chỗ phải đặt mới, và tôi ghi rõ:** `sn46.57` (`Aṭṭhikamahapphalasutta`) **chưa có** bản Việt trong kho, nên ở `2.1` tôi dịch `Aṭṭhikamahapphala` thành *Bài Niềm Tưởng Về Bộ Xương*. Nếu lát sau dịch `sn46.57` và đặt tiêu đề khác, `2.1` ở đây sẽ lệch — cần biên tập thống nhất. Tôi **không** đoán bừa tiêu đề cho một bài chưa có bản Việt.

  **Tiền lệ, đếm được.**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: `Ānāpānavagga` → *Phẩm Chế Ngự Hơi Thở* (10 chỗ, và cả tám chỗ đều là chính các bài anh em `sn46.57`–`65`). `Ānāpānasutta` → *Kinh Chánh Niệm Hơi Thở*; `ānāpāna` → *niệm hơi thở* (40 chỗ). `bhāvitā` → *đã được tu tập* (đúng nguyên văn `sn46.65:1.1` cho `bhāvitā`). `dasamaṁ` → *Thứ mười* (46 chỗ ở thời điểm đo). `Ānāpānavaggo sattamo` → *Phẩm …, thứ bảy* (`sn46.20:1.6`, `sn55.50:1.6`). `Tassuddānaṁ` → *Tóm lược:* (238 chỗ).

  **Không có bản Việt tham khảo** tại commit đã ghim (`translation/vi/` bilara chỉ có 26 tệp Pháp Cú); `triangulation` là Pāli + English Sujato (4/11, trong đó chỉ `1.1` có chữ; `1.2`–`1.3` và cả uddāna Sujato để trống).

