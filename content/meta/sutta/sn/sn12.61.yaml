notes: |-
  Dịch từ Pāli root; đối chiếu bản Anh Bhikkhu Sujato đã ghim (coverage 21/21 = 100%, đo bằng `isSubstantive` của `src/lib/canon/reference.ts`: Pāli ≥ 40 ký tự, bỏ khối `:0`). Tầng `vietnamese-current` không có cho bài này — bilara tại commit đã ghim chỉ có Pháp Cú.
  **Bản song parallel trùng Pāli, đã `published`, dùng lại nguyên văn.** Bài này tra ra **12 khoá trùng nguyên văn** với bài đã dịch; **11** dùng lại y nguyên văn của bài cũ. Nguồn chính: `sn12.37` cho cả khối lý duyên khởi `5.1–5.9` (cùng Pāli `paṭiccasamuppādaññeva sādhukaṁ yoniso manasi karoti`, `iti imasmiṁ sati idaṁ hoti`, `avijjāpaccayā saṅkhārā`, `saṅkhārapaccayā viññāṇaṁ …pe…`, `evametassa kevalassa dukkhakkhandhassa samudayo hoti`, `Avijjāya tveva asesavirāganirodhā saṅkhāranirodho`, `saṅkhāranirodhā viññāṇanirodho …pe…`). `sn22.12:1.6` cho `Nibbindaṁ virajjati; virāgā vimuccati…`. Tiêu đề phẩm `Mahāvagga` → *7. Phẩm Lớn* (13 bài cùng phẩm đã dùng). `Paṭhamaṁ.` → *Thứ nhất.* (264/277 khoá).
  **Một chỗ cố ý viết khác kho, đếm được.** `assutavā puthujjano`: trong sn đang có *kẻ phu nhân chưa học* (20 khoá, sn22.73/74/113/117/127–136) và *kẻ phàm phu không học* (3, sn22.8/22.43/22.44); toàn tầng thì *phàm phu* 163 so với *kẻ phu nhân* 21. `puthujjana` là hạng người tại gia bình thường, không mang dấu hiệu giống nữa như *phu nhân* (vợ), nên bài này dùng ***kẻ phàm phu chưa học*** — nối hai tiền lệ có sẵn, không tạo cách thứ ba. Người biên tập nên gộp `sn22.73/74/113/117/127–136` theo lựa chọn này.
  **0 tiền lệ, đặt mới, ghi kèm lý do:** `Assutavāsutta` → *Kinh Người Chưa Học* (Pāli là 'sutta của kẻ chưa học'; Sujato dịch *Unlearned*; chưa bài nào trong kho mang tên Pāli này) · `cātumahābhūtikassa kāyassa` → *thân tứ đại* (chỉ 4 khoá có chữ này; an9.15 dùng *thân thể tứ đại*) · `puthujjano` → *phàm phu* như trên · `Varaṁ … attato upagaccheyya, na tveva cittaṁ` → *thà lấy chính thân tứ đại này làm tự ngã, chứ không phải chỉ lấy tâm* (bản nháp đầu dịch *còn hơn là lấy tâm*, làm mất nghĩa phủ định `na tveva` — đã sửa trong lượt review đối kháng) · `araññe pavane` → *rừng hoang*.
  **Bất định đã ghi nhận, không che.** (1) `cittaṁ itipi, mano itipi, viññāṇaṁ itipi` — ba từ cùng nghĩa nhưng Pāli liệt kê cả ba; dịch *tâm* / *ý* / *thức* và **giữ nguyên cả ba** ở `2.1`, `4.1`, `4.3` thay vì quy về một từ. (2) `nibbindeyyapi virajjeyyapi vimucceyyapi` là ba động từ ở thế bị động (*có thể chán nản, ly tham, giải thoát*), không phải một trạng thái; giữ cả ba với *có thể* và phủ định *không thể* ở `2.1`/`2.5`. (3) `dissati … ācayopi apacayopi ādānampi nikkhepanampi` — *tích tụ/phân tán* và *thu nhận/đặt xuống* là hai cặp tiêu chí khác nhau, không gộp thành một.
  Dấu lược: `…pe…` của Pāli giữ **một** `…`; bài này có 3 khoá lược (`1.2`, `5.5`, `5.8`), đếm bằng `lược()` của `_hvi.py`. Không mở rộng bất cứ `…pe…` nào, cũng không dùng `…` để nén thêm. `notes` ở đây dùng khối literal `|-` thụt 2 như 505 tệp `|-` sẵn có trong `content/meta/sutta/sn/`; tệp này là tệp mới nên đã đọc mẫu đích trước khi ghi. Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` (và `npm run build` vì có bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9.6 chứ không 10.0.
