notes: |-
  Dịch từ Pāli root (SuttaCentral bilara, commit 11c9d708978cde8ba61096d8a75f7ddfb846f639). Đối chiếu bản Anh Bhikkhu Sujato đã ghim tệp `translation/en/sujato/sutta/sn/sn56/sn56.40_translation-en-sujato.json`. Tầng `vietnamese-current` không phủ bài này: manifest tại commit đã ghim chỉ có 26 tệp, toàn bộ là Pháp Cú (sutta/kn/dhp), nên không có bản Việt tham khảo để đối chiếu.
  Coverage Anh đo được theo `source/layers.yaml` (`substantivePaliMinChars: 40`, loại block tham chiếu, `floor: 0.8`): mẫu Pāli ≥ 40 ký tự = 15/32 khoá; tầng `english-sujato` phủ 12/15 = 80,0% — thiếu đúng ba khoá `1.6`, `1.7`, `2.10`. Ba khoá ấy là công thức `dakkhiṇāya` lặp lại của `1.2`–`1.3`, và lớp lấp `english-project` của dự án đã điền đúng ba khoá đó với `status: published` trong `content/meta/en/sn/sn56.40.yaml`, nên coverage tính cả hai tầng là 15/15 = 100%.
  Vì ba khoá lấp ấy do cùng họ agent viết, không phải lớp đọc Anh độc lập; `triangulation` hạ xuống 9.0 và không tuyên bố đã đối chiếu Anh độc lập cho ba khoá đó. Bù lại Pāli của chúng trùng nguyên văn `1.3` và gần trùng `2.7` trong chính bài, nên Pāli root tự đứng vững cho ba khoá.
  Dùng lại nguyên văn bản dịch đã có cho Pāli trùng nguyên văn: `2.3` ← sn56.39:4.2 (hai dấu lược); `2.12` ← sn56.39:4.9; `2.14` ← sn56.39:4.11 (đa số đếm được 3×); `3.1` theo đa số 9× cho Pāli trùng 39 bài khác; `1.7` trùng `1.3` ngay trong bài. `2.13` `Katamesaṁ catunnaṁ?` hòa ba cách (7× Bốn nào? / 7× Thế nào là bốn? / 7× Là bốn nào?); chọn Bốn nào? vì sn56.39:4.10 dùng đúng cách ấy ngay trước cùng ngữ cảnh `Sudiṭṭhattā … catunnaṁ ariyasaccānaṁ`.
  `Taṁ kissa hetu?` chọn đa số 37× (Vì sao vậy?) thay vì 33× (Vì lý do gì?); dạng có ạ (Vì sao vậy ạ?) chỉ 5×, dù sn56.39 dùng dạng có ạ cả bốn lần — ở đây ta theo đa số đo được, ghi rõ để người biên tập thống nhất nếu muốn bám bài kề. `netaṁ ṭhānaṁ vijjati` hòa 4×/4×/4×; chọn điều ấy không thể có vì đọc sau vạch — ghi ở đây để người biên tập thống nhất nếu muốn chuyển sang không có khả năng ấy.
  `kukku` (đơn vị cùng tay, sáu mươi tư ngón) không có tiền lệ trong kho cho nghĩa đơn vị đo, nên giữ nguyên chữ Pāli `kukku` thay vì quy đổi ra thước hay feet. Sujato dịch là feet, khác với cách giữ của bản Việt; ghi ra đây vì hai bên không thống nhất được đơn vị.
  `Sīsapāvanavaggo catuttho.` chọn khuôn Phẩm X, thứ N. (chiếm đa số trong 149 khoá cùng khuôn). Kệ liệt tên `4.1`–`4.4` dịch theo tên bài đã dịch sẵn trong chính phẩm: sn56.31 Kinh Rừng Sīsapā, sn56.32 Kinh Lá Khadira, sn56.33 Kinh Cây Quật Rơi, sn56.34 Kinh Cái Áo, sn56.35 Kinh Bảy Mươi, sn56.36 Kinh Sinh Vật, sn56.37+38 Kinh Mặt Trời, sn56.39 Kinh Cột Trụ Của Inda; khuôn lấy từ sn46.20:2.1 và sn22.149:2.1.
  Dấu lược: `1.1`, `1.4`, `1.5`, `2.6`, `2.8`, `2.9` mỗi khoá một dấu lược; `2.3` có hai `…pe…` nên giữ hai dấu; `2.14`, `3.1` mỗi khoá một. Không khoá nào mở rộng `…pe…` hay viết đủ chỗ lược.
  Lượt review đối kháng tự làm: in lại cả 32 cặp Pāli–Việt và đọc từng cặp. Bản nháp không bị bắt lỗi nghĩa nào ở lượt đọc đó; điều duy nhất phải sửa là `2.4`/`2.11`. Ta ban đầu theo dạng Vì sao vậy ạ? vì sn56.39 ngay trước dùng dạng có ạ cả bốn lần; đo lại bằng script mới thấy đa số toàn kho là Vì sao vậy? (37× so với 5×) — đã đổi theo đa số. Lỗi này không lộ ra khi đọc cặp Pāli–Việt mà chỉ lộ ra khi đo lại số thay vì tin số đã được đưa cho mình, nên ghi lại đây như một lỗi riêng của phép đo.
  0.1 giữ nguyên `Saṁyutta Nikāya 56.40` theo quy ước của cả 1.686 tệp metadata sn đã có; 0.2 theo đa số 9×; 0.3 không có tiền lệ Pāli trùng nên tự đặt Kinh Tìm Chỗ Tranh Cãi theo khuôn tiêu đề của sn56.31–39.
  Mọi số đếm trong tệp này là ảnh chụp lúc đo, và được đo SAU khi loại ba tệp của lát s3 (sn56.40, pv23, tha-ap46) khỏi tầng Việt, để không tự đếm phiếu cho chính mình; các agent khác vẫn đang ghi vào cùng tầng nên số có thể đã tăng. `Dasamaṁ.` 109× và `Tassuddānaṁ` 183×.
  `technical_integrity` chỉ 9,6 vì bị cấm chạy cổng: bốn lệnh còn lại là `npm run validate`, `npm test`, `npm run check`, `npm run build`. Không tuyên bố technical gate đã pass; trạng thái `published` đặt theo điều kiện chất của tầng tham khảo, cổng kỹ thuật để coordinator chạy.
