notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato (34/35 khoá có chữ). Coverage English = 23/23 khoá Pāli có nội dung = 100%; không phụ thuộc bản lấp English của dự án.
  0.1 giữ `Saṁyutta Nikāya 22.94`; 0.2 theo tiền lệ 2 bài cùng phẩm (10. Phẩm Hoa); 0.3 theo tên phẩm; 1.1 theo tiền lệ 433 khoá (Tại Sāvatthī.).
  7 khoá có PĀLI TRẬNG NGUYÊN VĂN với tệp đã có trong HEAD, dùng lại nguyên văn: 0.2 (2 bài) · 1.1 (433 khoá) · 2.3 (`sn22.66`/`sn22.67`) · 2.4 (`sn22.106`/`sn22.120`) · 2.5 (`sn22.106`/`sn22.120`) · 3.3 (`sn22.137:1.5`) · 8.3 (Thứ hai.). 6.3 (`saññā, bhikkhave …`) cũng trùng, nhưng nguồn `mn22` chưa vào HEAD nên dịch theo cùng khuôn `tưởng, này các tỳ-kheo …`. Tổng lát c32: 143 cặp.
  `niccaṁ dhuvaṁ sassataṁ avipariṇāmadhammaṁ` → thường còn, bền vững, thường hằng, không chịu biến hoại, dùng nguyên văn `sn22.98` (cùng Saḷāyatana-saṃyutta, 4 khoá). `aniccaṁ dukkhaṁ vipariṇāmadhammaṁ` → vô thường, khổ, chịu biến hoại (12 khoá trên đĩa).
  Chuỗi bảy động từ `ācikkhati deseti paññapeti paṭṭhapeti vivarati vibhajati uttānīkaroti` dịch theo nguyên văn `sn14.13` (3 khoá): giải thích, giảng dạy, trình bày, an lập, khai thị, phân tích, làm cho hiển lộ. Dạng bị động `-yamāne` ở 6.1 và 7.1 dùng cùng nhịng đó với đang.
  `abhisambujjhati abhisameti` → giác ngộ và liễu tri, theo 1 tiền lệ `an3.136:1.3` cho đúng công thức `Taṁ tathāgato abhisambujjhati abhisameti`. `lokaṁ abhibhuyya viharati` → thắng trị thế gian, sống không nhiễm bởi thế gian (`anupalittaṁ`/`anupalitto lokenā`).
  Ví dụ sen ở 8.1 theo `an4.36:4.3` (uppala → hoa sen xanh, paduma → sen hồng, puṇḍarīka → sen trắng, anupalittaṁ udakena → không dính nước vào); `an10.81:2.13` dùng súng, không theo vì chỉ 1 khoá.
  LỆCH CÓ CHỦ ĐÍCH, ghi rõ: 1.3 dịch bám Pāli — kẻ nói theo pháp thì không tranh chấp với bất cứ ai trong thế gian — chứ không theo Sujato (When your speech is in line with the teaching…), vì Sujato chêm một mệnh đề mà Pāli không có.
  BẤT ĐỊNH: `natthisammataṁ / atthisammataṁ loke paṇḍitānaṁ` 0 tiền lệ trên đĩa. Dịch là các bậc trí trong thế gian cho là không có / cho là có, theo `paṇḍita` → bậc trí (348 khoá). `Kiñca` mở câu hỏi dịch Vậy thì, theo 5 tiền lệ `an5.144`.
  BẤT ĐỊNH: `andhaṁ acakkhukaṁ` ở 6.1 và 7.1 dịch mù lòa, mù mắt. `mù mắt` có 23 khoá trên đĩa, `mù lòa` có 9; cặp này đi cùng nhau như hai vế của một hạng từ như Sujato (blind and sightless).
  Dấu nháy kép: 1.2 mở thì 8.2 khép, đúng như Pāli — cả bài nằm trong một lời thoại. Bảy dấu lược ở 2.3, 2.4, 2.5, 3.3, 6.2, 6.3, 6.4 giữ đúng MỘT `…`.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy; technical_integrity 9.6 vì lát này không tự chạy bốn lệnh đó. Đã tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, và mô phỏng đúng `validateSegmentMap` của `scripts/validate.ts` (tiền tố khoá, orphan, requireComplete, non-Latin) — 316/316 khoá sạch.
