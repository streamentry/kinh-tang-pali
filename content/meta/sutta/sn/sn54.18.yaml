notes: |-
  Tiền lệ đã đếm: anusaya → thiên hướng (sn54.20:1.3, an7.11, sn18.21, sn35.58);
  ghi nhận biến thể tùy miên nhưng giữ thiên hướng để nhất quán cùng phẩm Niệm Hơi Thở.
  samugghāta → trừ khử tận gốc (an6.103:1.4, sn54.20:1.3, uddāna sn54.20:2.3).
  Đuôi công thức :1.1 lấy nguyên khung sn54.20:1.3; Sujato: uprooting the underlying tendencies.
  Pāli mở ngoặc “ không đóng: Việt đóng ” trước …. theo sn54.17 để ngoặc cân cả bài.
  Pāli có hai dấu lược (đầu và cuối), Việt giữ đủ hai; không mở rộng phần lược.
  Không đối chiếu được tầng Việt hiện hành: snapshot đã ghim chỉ có Pháp Cú tiếng Việt.
  Bất định: không có bất định thay đổi nghĩa; chủ ngữ lược (định niệm hơi thở) đọc từ đầu phẩm.
