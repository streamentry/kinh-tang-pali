  - >-
    Bài cuối của Sn 43 nên tệp gồm thân kinh + dòng đóng phẩm + uddāna + `Asaṅkhatasaṁyuttaṁ samattaṁ`; cấu trúc y hệt `sn43.1*` nên dùng lại nguyên văn từng vế.
  - >-
    Dùng lại nguyên văn đã `published`: `Yo, bhikkhave, rāgakkhayo dosakkhayo mohakkhayo—` → *đó là sự đoạn tận tham, đoạn tận sân, đoạn tận si—* · `idaṁ vuccati` → *cái này được gọi là* · `Kāyagatāsati` → *Niệm thân* · `satthārā karaṇīyaṁ sāvakānaṁ hitesinā anukampakena anukampaṁ upādāya, kataṁ vo taṁ mayā` → *Điều mà bậc Đạo Sư vì tìm lợi ích, vì thương xót, vì lòng thương cần làm cho các đệ tử thì ta đã làm cho các ngươi* · `Etāni … rukkhamūlāni … suññāgārāni. Jhāyatha … mā pamādattha; mā pacchā vippaṭisārino ahuvattha. Ayaṁ vo amhākaṁ anusāsanī”ti.` → nguyên văn `sn43.1:2.2/2.3*` (`sn43.11:1.11*` dùng biến thể *chớ phóng dật*/*đây là lời dạy của chúng ta cho các ngươi*; chọn bản `sn43.1` vì gần nhất) · `Yathā asaṅkhataṁ tathā vitthāretabbaṁ.` → *(Cũng phải giảng giải chi tiết, y như bài Vô Vi.)* theo mẫu `(Yathā sakkasuttaṁ…)` của `sn40.11*`.
  - >-
    0 tiền lệ, đặt mới: `parāyana` → *bờ bến kia*. `an3.52:2.4*` dịch cụm `tāṇañca leṇañca dīpañca saraṇañca parāyaṇañcāti` thành *nơi trú ẩn, nơi nương náu, hòn đảo, nơi quy y và chốn nương tựa cuối cùng*; ở đây giữ *bờ bến kia* cho cả bài và cả uddāna vì đó là tên phẩm của Tương Ưng. `Parāyanasutta` → *Kinh Bờ Bến Kia*.
  - >-
    **Uddāna `2.1–4.4` — dịch chữ từng đề mục, độ chắc thấp** như mọi uddāna trong kho. Các từ đã có tiền lệ được dùng lại: `amata` → *bất tử*, `paṇīta` → *cao quý* (`kp6:4.1*`), `virāga` → *ly tham*, `khaya` → *đoạn tận* (cùng nguồn), `suddhi/mutti/anālayo` → *thanh tịnh / giải thoát / không nương tựa* (`sn22.104:1.13*`, `sn22.22:4.2*`), `dīpa/leṇa/tāṇa/saraṇa` → *hòn đảo / nơi nương náu / chốn trú ẩn / nơi quy y* (`an3.52:2.4*`). **0 tiền lệ, đặt mới:** `anataṁ` → *vô hữu*, `sududdasaṁ` → *khó thấy rõ*, `ajajjaraṁ` → *không run rẩy*, `apalokitaṁ` → *không ai thấy*, `anidassanaṁ` → *không thấy được*, `nippapañca` → *rất hiếm*, `santaṁ` → *thảnh thơi*, `nipuṇaṁ` → *thuần thục*, `acchariya/abbhuta` → *kỳ lạ / huyền diệu*, `sivañca` → *lành*, `khemaṁ` → *an toàn*. `apalokita` và `anidassana` gần nghĩa nhau, dịch tách bằng *không ai thấy* / *không thấy được* là suy đoán; **người biên tập nên kiểm**.
