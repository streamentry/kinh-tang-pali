notes:
  - >-
    **Chuỗi lặp thứ sáu mươi — bài CUỐI của 60 bài, kèm uddāna liệt kê cả 60
    bài.** uddāna là **bài đố** đếm số: *mười tám với tham, hai với sân, chín
    với si* (tổng 29 bài về ba lậu) + *mười tám vẽ ra là vô thường, ba bên
    trong, ba bên ngoài* (24) + *mười bài về ba lậu và ba hành* = 60. Tôi dịch
    nguyên văn không diễn giải.
  - >-
    `buddhenādiccabandhunāti` → *bằng uy quyền bậc Đầu tiên của Đức Phật*;
    `bandhu` → *thân thuộc* theo nguyên văn `an4.14:5.4`. `Suttantāni saṭṭhi` →
    *Sáu mươi bài kinh*.
  - >-
    **Quy ước dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
    `published` có `…` trong Pāli, chỉ 617 (40%) giữ đúng số, và cặp lệch phổ
    biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` → `…`). Quy tắc là
