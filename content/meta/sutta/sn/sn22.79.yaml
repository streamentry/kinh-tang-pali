notes: |-
  Dịch trọn 153/153 khoá từ Pāli root đã ghim, đối chiếu English Sujato đã ghim, bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn và các bài cùng phẩm (`sn22.76`–`sn22.78`, `sn22.80`), cùng các bài có công thức tương đồng (`mn43` về chiết tự thọ, tưởng, thức; `sn35.10`–`sn35.11`, `sn22.11` về "không trông ngóng quá khứ, không hoan hỷ vị lai"; `an11.9` về bài kệ cuối).

  **Coverage English.** Mẫu số = 66 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Sujato phủ 54/66 = 0,8182, trên ngưỡng 0,80. Mười hai khoá Sujato để trống: `1.7`, `8.2`–`8.5`, `8.7`, `9.3`–`9.6`, `9.8`, `10.4`. Tất cả đều là Pāli lặp lại nguyên khuôn với các khoá Sujato đã phủ (`1.5`, `7.3`–`7.7`, `10.2`–`10.7`) hoặc đã được dịch trong chính bài. Không có lớp `english-project` cho bài này, và `vietnamese-current` vắng (tầng chỉ có Pháp Cú), nên phần đối chiếu Anh độc lập là 54/66. Coverage chỉ cao hơn ngưỡng 0,02 nên `triangulation` đặt 8,8, không cao hơn. Không cần entry trong `reference-gaps`, nhưng nếu một lượt đo sau này đếm khác (ví dụ bỏ thêm một khoá) làm tụt dưới 0,80 thì bài phải hạ về `draft` kèm blocker độ phủ.

  **Tiền lệ.** Đã dò 45 khoá có Pāli trùng nguyên văn với khoá đã dịch ở tầng (2.606 cặp, trong đó 1.189 cặp bản Việt khác); 39 khoá dùng lại nguyên văn bản Việt có sẵn, 6 khoá cố ý khác: `7.6`, `10.6`, `9.7` (đổi "vui mừng"/"hoan hỷ" lẻ thành "hoan hỷ", vì `nābhinandati` ở tầng là "hoan hỷ" 69 khoá so với "vui mừng" 8; `abhinandeyyaṁ` là "hoan hỷ" 393 so với 2), `7.7`, `9.8` (tầng ghi "đã hướng đến"/"đã thực hành" cho `paṭipanno hoti`, trái thì hiện tại của Pāli; đổi thành "thực hành hướng đến" theo `sn12.31:7.3`, `sn35.155:2.2`), `11.19` (tầng có hai bản lệch nhau, dùng khuôn `sn24.71:3.1`). `3.4`, `4.4` theo cấu trúc `mn43:7.5`, `mn43:8.5`; `4.3`, `6.3` dùng lại nguyên văn `mn43`; `6.4` theo `sn47.8:2.3` (chua, đắng, cay, ngọt, cay nóng, dịu, mặn, nhạt); `15.1`–`15.4` theo `an11.9:4.1`–`4.4`; `13.1` theo `sn22.77:2.1`; `13.3` là dạng phổ biến nhất của công thức (4 khoá trên 32). `11.4`, `11.6`–`11.8` theo `sn22.80`. **Pāli trùng nguyên văn trong chính bài: 95 cặp, bản Việt khác ở 0 cặp.**

  **Thuật ngữ, kèm số đếm.** `khajjāmi` dịch "bị … cắn xé": tầng có 12 khoá "cắn xé", 7 "ăn", 3 "nuốt" cho `khajjati`/`khajjamāna`; Sujato "bitten". Hòa thượng Thích Minh Châu dịch "bị … chinh phục", không khớp động từ "ăn, cắn", nên không theo. `sutavā ariyasāvako` dịch "bậc Thánh đa văn" (78 khoá, so với "bậc Thánh đệ tử" 24, "bậc Thánh đệ tử đa văn" 10); `ariyasāvako` đứng riêng (`12.1`) dịch "bậc Thánh đệ tử". `anapekkho hoti` dịch "không trông ngóng" (12 khoá so với "không ham" 10, "bận tâm" 1). `nibbidāya virāgāya nirodhāya` dịch "chán nản, ly tham, diệt tận" (30 khoá so với "nhàm chán, ly tham, đoạn diệt" 21; trong `sn22` là 7 so với 4); `nibbindati` cũng "chán nản" cho nhất quán với `13.2` (dùng lại đúng văn bản ở 8 trong 10 khoá). `sarīsapa` "các loài bò sát" (18 khoá so với "rắn" 4). `khārika`/`akhārika` "cay nóng"/"dịu" theo `sn47.8:2.3`. "Cảm thọ" cho `vedanā` theo `sn22.80`.

  **Bất định đã ghi, không giấu.**
  - `2.2`, `2.3`–`2.5` `ruppati`: dịch "bị biến dạng" (Sujato "deformed"; bản Việt nguyên bài "bị thay đổi"). Trong tầng, `ruppati` chỉ có ở `mn105` với nghĩa "làm tổn thương" (nọc độc của vô minh làm tổn thương); nghĩa "bị tác hại, bị bức bách" bởi lạnh, nóng, đói, khát, ruồi muỗi cũng hợp ngữ cảnh. Chọn "biến dạng" vì cả Sujato và bản Việt nguyên bài đều hiểu theo hướng đổi dạng, và vì nó cho phép nối với `rūpa` trong chiết tự. Chữ này không phải thuật ngữ đã có tiền lệ trong tầng; đây là lý do `terminology` và `ambiguity_integrity` không cao.
  - `5.2`–`5.5` `saṅkhatamabhisaṅkharonti`: `saṅkhata` là tân ngữ của `abhisaṅkharonti`, dịch "tạo tác cái hữu vi". `5.4` `rūpaṁ rūpattāya saṅkhatamabhisaṅkharonti`: dịch "tạo tác sắc thành tính sắc" theo hướng "choices are what make it into form" của Sujato; bản Việt nguyên bài "làm cho hiện hành sắc với sắc tánh". Pāli nối tân ngữ `rūpaṁ` với `saṅkhataṁ` bằng phép đồng vị, không có động từ thứ hai; chữ "thành" và dấu hai chấm là cách đọc, không phải nguyên văn.
  - `12.1`–`12.28`, `14.x` `apacināti`/`ācināti`, `visineti`/`ussineti`, `vidhūpeti`/`sandhūpeti`: bốn cặp động từ ít gặp, tầng không có tiền lệ nào (apacināti 1 khoá `mn48:12.6` với nghĩa khác, ācināti, visineti, ussineti, vidhūpeti, sandhūpeti đều 0 khoá). Đã dịch "làm giảm bớt/tích lũy", "từ bỏ/chấp thủ", "tháo gỡ/chất chồng", "làm tiêu tán/hun đốt". Cặp thứ ba và thứ tư không chắc: Sujato "unmeshes/enmeshes" và "dissipates/gets clouded", bản Việt nguyên bài "xa lánh/thân cận" và "phân tán/huân tập". "Huân tập" (hun khói) khớp gốc `dhūpa` nhưng là thuật ngữ khác nghĩa trong Phật học Việt; "hun đốt" giữ gần Pāli (khói) hơn. Không đổi giáo nghĩa của bài (mọi cặp đều nói bậc A-la-hán không tích lũy, không chấp thủ, không kết đống, không bị khói che), nhưng tên gọi cụ thể từng cặp chưa phân xử được; cần người biên tập duyệt nếu muốn một thuật ngữ cố định.
  - `14.1`, `14.2`–`14.25` `ṭhito`: dịch "an trú"; `apacinitvā ṭhito` thành "an trú sau khi đã làm giảm bớt". Sujato "remain after getting rid"; bản Việt nguyên bài "sau khi giảm thiểu, vị ấy trú". Pāli `14.1` kết không có dấu chấm (do tầng Pāli ghim); bản Việt thêm dấu chấm kết câu. Cũng không có dấu chấm ở `9.8`.
  - `1.5`, `1.7`, `1.11` `iti vā hi … anussaramāno`: dịch "này các tỳ-kheo, khi nhớ lại như vậy, họ chỉ nhớ lại …", bỏ `vā hi` (Sujato cũng bỏ, bản Việt nguyên bài dịch "hay có người nhớ rằng"). Chủ ngữ "họ" quy về "sa-môn hay bà-la-môn" ở `1.2`.
  - `7.2`–`7.4` `khajjāmi`/`khajjiṁ`/`khajjeyyaṁ`: dùng nhất quán "bị … cắn xé" (hiện tại, quá khứ, giả định tương lai) để giữ nguyên hình ảnh "bị ăn" mà Pāli dùng; Hòa thượng Thích Minh Châu dịch "chinh phục" cho cả ba.
  - `15.3`–`15.4` `yampi nissāya jhāyasī`: dịch "ngài đang dựa vào điều gì mà thiền định!" theo `an11.9`, không theo bản Việt nguyên bài ("ta không có chấp trước, đối tượng ông thiền tư"), vì Pāli `nābhijānāma` ("chúng con không biết rõ") là ngôi thứ nhất số nhiều, `nissāya` là "dựa vào".
  - Tiêu đề `0.3` `Khajjanīyasutta` dịch "Kinh Đáng Bị Cắn Xé" (Sujato "Bitable", bản Việt nguyên bài "Đáng Được Ăn"): chọn "cắn xé" cho khớp với động từ trong thân kinh.

  **Số Pāli.** `pañca` = năm (`1.2`, `1.3`: năm thủ uẩn, câu hỏi "thế nào là năm"); tám vị ở `6.4` (ambila, tittaka, kaṭuka, madhura, khārika, akhārika, loṇika, aloṇika = 8) và bốn màu ở `4.4` đều đếm đủ ở bản Việt. Không có số lớn nào cần tính.

  **Dấu lược và nháy.** `…pe…` ở `9.1` và `11.23` thành đúng một `…`; các `…` trần ở `1.8`, `1.9`, `11.9`–`11.11`, `11.20`–`11.22`, `12.7`–`12.9` (và lặp lại ở `12.13`–`12.15`, `12.19`–`12.21`, `12.25`–`12.27`), `13.1`, `14.4`–`14.6`, `14.10`–`14.12`, `14.16`–`14.18`, `14.22`–`14.24` giữ đúng một dấu mỗi khoá, cân với Pāli từng khoá (0 lệch trên 153 khoá). Nháy đơn và nháy kép đo từng khoá, khớp Pāli (0 lệch trên 153 khoá); không có `(…)` trần trong bài này.

