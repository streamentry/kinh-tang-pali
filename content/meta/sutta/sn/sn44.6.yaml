  BẤT ĐỊNH ĐÃ GHI, ba nơi:
  1. Công thức -ārāma / -ārata / -asammudi (16 khoá) có 0 tiền lệ sạch trong tầng. Dịch
     thành bộ ba thích · ham · bám víu, cả ba từ đều có tiền lệ đo được (thích sắc 6,
     ham sắc 24, bám víu 47; phủ định: không thích 171, không ham 91, không bám 48). Đây
     là chính ba từ Sujato dịch là like, love, enjoy, giữ thứ tự ấy. Hạ terminology xuống 9.2
     vì không có tiền lệ đúng công thức để đối chiếu.
  2. bhavārāma ở 4.3 và 4.5: chữ bhava ở đây là cõi tồn tại nối tiếp (Sujato: continued
     existence), KHÁC với ariye-bhava của nhóm upādāna, và nhóm upādāna đã nằm riêng ở 5.3.
     Dịch thành sự tồn tại (118 tiền lệ) thay vì hữu. Nếu người biên tập chọn hữu thì sẽ
     phải đổi cả 4.3, 4.5, 6.3, 6.5 cho nhất quán.
  3. 7.3: Taṇhāsaṅkhayavimuttassa và vaṭṭa đều 0 tiền lệ; paññāpanāyā có 3, gần nhất là
     ud6.8:5.7 dịch thành không có sự luân hồi để chỉ định cho họ. Bài này dịch không có
     vòng luân hồi nào để tuyên thuyết, giữ vòng luân hồi (22 tiền lệ) cho vaṭṭa.

