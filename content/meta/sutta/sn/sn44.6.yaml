  theo nghĩa của chính dấu phẩy ấy. Đã sửa: 5.6 dùng CHUNG một dạng với 3.2, 3.7, 4.6, 6.6,
  vì nghĩa không đổi. Người đọc không nên sửa được bằng cách sửa bản dịch; nếu muốn Pāli sạch
  thì phải sửa ở tầng root.

  LỆCH CHỦ Ý VỚI TIỀN LỆ, để người biên tập biết:
  · 0.3 Catutthasāriputtakoṭṭhikasutta → Kinh Sāriputta Và Koṭṭhita Thứ Tư, theo đúng
    hàng xóm sn44.3 (Thứ Nhất) và sn44.4 (Thứ Hai). sn44.5 dùng Cốt-thi-ka (Ba), là cách
    lệch; vẫn cần thống nhất tên người nói vì kho đang dùng song song Mahākoṭṭhika (14),
    Koṭṭhika (7), Mahākoṭṭhita (30), Koṭṭhita (27) và Cốt-thi-ka (15). Bài này dùng
    Mahākoṭṭhika cho mahākoṭṭhiko và Koṭṭhika cho chữ koṭṭhika trần ở 1.4, vì Pāli ở 1.4
    không có mahā.
  · 1.2 và 1.3 lấy khung từ sn16.12 (Sāriputta đi đến chỗ vị kia, cùng chiều đi của bài
    này) chứ không từ sn44.3 (chiều ngược lại). Trong ba tệp sn44 đã có, tên nơi ở 1.1 đang
    lệch ba cách: Vườn Nai (5), trong khu rừng hương (sn44.5), Vườn Lộc Uyển (sn44.4); bài
    này theo đa số.

