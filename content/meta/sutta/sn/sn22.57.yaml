notes: |-
  Đợt 19, lát lane35. Dịch từ Pāli root đã ghim, đối chiếu English Sujato đã ghim; dịch đủ 107 khoá (0 khoá ngoài tập khoá Pāli). Bài Sattaṭṭhānasutta (Kinh Bảy Trường Hợp), phẩm Upayavagga.

  **Coverage Anh trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): Sujato 40/49 = 0,8163 — đạt ngưỡng 0,80.** Sujato để trống 9 khoá có nội dung (`8.1`, `8.2`, `8.3`, `9.1`, `12.1`, `12.3`, `12.5`, `13.1`, `13.2`: các công thức lặp của thọ và hành); thêm 18 khoá ngắn hơn 40 ký tự cũng trống. Bài này chưa có lớp `english-project` và tầng `vietnamese-current` không có bản cho bài này (chỉ có Pháp Cú), nên độ phủ chỉ đến từ Sujato. Biên độ trên ngưỡng hẹp: chỉ cần thêm một khoá nữa thành trống (39/49 = 0,7959) là tụt dưới 0,80. Các đoạn Sujato trống đều cùng khung công thức với đoạn đã có bản Anh ở khoá khác trong bài (`4.1`–`4.3` cho `8.1`–`8.3`; `5.1`–`5.4` cho `9.1`; `3.1`, `3.3`, `3.5` cho `12.1`, `12.3`, `12.5`; `4.1`, `4.2` cho `13.1`), chỉ đổi uẩn, nên Pāli tự đứng vững và cách hiểu công thức đã đối chiếu được qua các khoá có English. `triangulation` đặt 8,4 vì thiếu tầng Việt hiện hành và 9 khoá có nội dung thiếu English.

  **Dấu lược.** Pāli có 14 dấu lược (mỗi `…pe…` một dấu; `…` trần ở `1.6`, `1.7`, `1.8`); bản Việt giữ đúng số dấu từng khoá, không bung thành văn (`10.8` có hai dấu, `13.1` một dấu giữa câu). Dấu ngoặc: Pāli có `“` ở `1.2`, `‘` và `’` quanh `uttamapuriso` và `”` ở `18.4`; bản Việt khớp từng khoá (0 lệch / 107 khoá). Không có `(…)` trần nào.

  **Khoá Pāli trùng nguyên văn trong bài.** 14 cặp Pāli trùng, 0 cặp Việt khác nhau: `2.7`=`6.9`=`11.9`=`14.8`; `4.3`=`8.3`=`16.3`; `5.3`=`17.3`; `5.4`=`17.4`; `9.2`=`10.9`=`13.3`. Phần lặp của sắc/thọ/hành/thức là cùng một khung với `sn22.56` nên tái dùng nguyên các cụm đã chọn ở đó (*thắng tri*, *nhàm chán, ly tham, đoạn diệt*, *không chấp thủ mà được giải thoát*, *chỗ đứng*, *bậc viên mãn*, *vòng luân hồi*).

  **Số Pāli.** `satta` = bảy (bảy trường hợp), `ti-` trong `tividha-` = ba (ba cách), `cattāro`/`catunnaṁ` = bốn (bốn đại), `cha` (`Chayime`) = sáu (sáu thọ thân, tưởng thân, tư thân, thức thân), `aṭṭhaṅgiko` = tám (Thánh đạo tám ngành), `Pañcamaṁ` = thứ năm. Không có số lớn; không có `sahassa`/`sata`/`tālīsa`.

  **Thuật ngữ (đếm trên tầng Việt dự án).**
  - `pajānāti` → *biết rõ* (`sn22.113`, `sn22.114`, `sn22.126`).
  - `abhiññāya` → *thắng tri*, theo `sn22.56` (cùng công thức; `sn22.26` dùng *liễu tri* cho `yathābhūtaṁ nābbhaññāsiṁ`).
  - `assādo`/`ādīnavo`/`nissaraṇaṁ` → *vị ngọt* / *sự nguy hại* / *lối thoát khỏi*: bộ ba này có tiền lệ `mn13` (*vị ngọt, nguy hại, lối thoát*). *vị ngọt* 78 so với *thú vị* 2 trên toàn tầng (sn22: 17 so với 0); *nguy hại* 140 so với *nguy hiểm* 27 (sn22: 17 so với 0). Riêng `nissaraṇa` hai phạm vi cho đa số khác nhau: *lối thoát* 122 so với *xuất ly* 175 và *thoát ly* 79 trên toàn tầng; sn: 44 so với 116 và 17; sn22: 20 so với 26 — tức đa số tầng và đa số sn22 nghiêng về *xuất ly*, nhưng ở các bài sn22 mới (`sn22.73`, `sn22.74`, `sn22.134`) và ở `mn13` cùng bộ ba, *lối thoát* là dạng được dùng. Chọn *lối thoát* vì rõ hơn với người đọc hiện đại và đi cùng bộ ba `mn13`; đổi được nếu người biên tập muốn theo đa số *xuất ly*.
  - `sukhaṁ somanassaṁ` → *lạc và hỷ* (`sn35.13`, `sn35.14`; sn22 `sn22.26`–`sn22.28` dùng *hỷ lạc*; chọn *lạc và hỷ* vì Pāli có hai từ và `sn35` tách riêng).
  - `chandarāgavinayo chandarāgappahānaṁ` → *sự loại bỏ và từ bỏ ham muốn và tham* (`mn13:16.2`, `mn13:30.2`, `mn13:37.2`; `sn22.26` dùng *nhiếp phục dục tham, đoạn trừ dục tham*; 24 khoá toàn tầng dùng nhiều dạng khác nhau, không có đa số rõ).
  - `vipariṇāmadhammaṁ` → *có tính biến hoại* (`sn22.126`: *có tính sanh khởi / hoại diệt*).
  - `ariyo aṭṭhaṅgiko maggo … seyyathidaṁ—` → *Thánh đạo tám ngành … tức là:*, `sammādiṭṭhi …pe… sammāsamādhi` → *chánh kiến … chánh định* (theo `sn22.56`).
  - `kevalī vusitavā uttamapuriso` → *bậc viên mãn, đã sống xong, bậc tối thượng* (`iti97`: *bậc viên mãn, đã sống xong, bậc tối thượng nhân*; `an10.12`: *viên mãn … bậc tối thượng*; *bậc tối thượng* 8 so với *tối thượng nhân* 2 trên toàn tầng). `kevalino` → *bậc viên mãn* theo `sn22.56`.
  - `vedanākāyā`/`saññākāyā`/`cetanākāyā`/`viññāṇakāyā` → *thọ thân, tưởng thân, tư thân, thức thân*; `sañcetanā` → *tư về …*; sáu loại xúc → *thọ sinh do xúc mắt …* (`sn22.56`, `dn33`).
  - `vaṭṭaṁ tesaṁ natthi paññāpanāya` → *không có vòng luân hồi để chỉ định cho họ* (`sn22.56`).
  - `Pañcamaṁ.` → *Thứ năm.* (sn: 114 so với *Bài thứ năm.* 5; sn22: 12 so với 0).
  - `0.2` → *6. Phẩm Dính Mắc* (`sn22.53`, `sn22.54`, `sn22.56`, `sn22.58`, `sn22.60`).

  **Bất định, không thêm vào thân kinh.**
  1. `sattaṭṭhānakusalo` → *thiện xảo về bảy trường hợp*; `ṭhāna` dịch là *trường hợp* theo Sujato (*cases*). Bảy trường hợp được hiểu là sắc (và từng uẩn còn lại) cùng sáu mặt đi kèm: sinh khởi, chấm dứt, con đường, vị ngọt, nguy hại, lối thoát (đếm từ Pāli `1.4`–`1.5` là 4 + 3 = 7). Pāli bài này không tự nói đó là bảy, nên không đưa vào thân kinh. Dịch khác (*bảy xứ*, *bảy phương diện*) có thể; không có tiền lệ trên tầng (0 khoá cho `sattaṭṭhāna`).
  2. `dhātuso`/`āyatanaso` (`18.2`) → *theo giới*, *theo xứ*: Pāli không nêu số giới (mười tám) hay số xứ (mười hai), nên không thêm. Sujato *elements, sense fields*. Từ *giới* ở đây là `dhātu`, không phải `sīla`; nếu người biên tập thấy dễ nhầm có thể đổi *các yếu tố* (tầng dùng *yếu tố* 6 so với *giới* 22 cho `dhātuso`, nhưng các khoá *yếu tố* là `kāyaṁ … dhātuso paccavekkhati`).
  3. `gādhanti` (`4.3`, `8.3`, `16.3`): không có tiền lệ trên tầng Việt chính (0 khoá), chỉ có `sn22.56` cùng đợt; dịch *có được chỗ đứng* theo nghĩa gốc, giữ nhất quán với `sn22.56`; sắc thái (đứng vững / thâm nhập) chưa phân xử được.
  4. `vusitavā` → *đã sống xong* theo `iti97`; `sn22.110` dịch *đã sống trọn đời phạm hạnh*. Pāli không nói đối tượng nên không thêm *phạm hạnh*.
  5. `1.7`, `1.8` Pāli chỉ ghi `saññaṁ …` và `saṅkhāre …` (lược động từ `pajānāti` và phần còn lại); bản Việt chỉ dịch từ có mặt (*tưởng …*, *các hành …*), không bổ sung động từ.
  6. Giữa tầng Anh đã ghim và Pāli: Sujato `2.7`, `6.9`, `11.9`, `14.8` bung cả `…pe…` thành tám chi; bản Việt theo Pāli (`chánh kiến … chánh định`).

