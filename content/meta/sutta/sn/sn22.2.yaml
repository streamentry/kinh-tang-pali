notes: |-
  Đợt 19, lane 26. Dịch từ Pāli root commit đã ghim, đối chiếu English Sujato đã ghim, bản Hòa thượng Thích Minh Châu nguyên bài (tra cứu toàn văn, không phân đoạn) và các tiền lệ cùng tầng. Đủ 87 khoá, thứ tự và tập khoá khớp Pāli; không có khoá ngoài Pāli.

  **Coverage Anh trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): Sujato 49/51 = 0.961** — trên sàn 0.80. Hai khoá Sujato để trống (8.14 và 9.2) đã được lớp english-project của dự án lấp (đã published), nên cả hai lớp phủ 51/51; nhưng lớp lấp đó là bản của dự án, không phải đọc độc lập, nên `triangulation` chỉ tính phần Sujato độc lập (49/51) cộng bản Thích Minh Châu nguyên bài, và hạ xuống 9.2. Các khoá Sujato bỏ trống nhưng Pāli dưới 40 ký tự (6.2, 7.2, 8.2: `…pe…`, 39 ký tự) không nằm trong mẫu số. Tại commit đã ghim không có bản Việt phân đoạn cho bài này (chỉ Pháp Cú), nên cột Việt hiện hành vắng; bản Thích Minh Châu chỉ có ở mục tra cứu toàn văn.

  Số Pāli: không có số lượng nào trong bài; chỉ có danh sách năm uẩn (sắc, thọ, tưởng, hành, thức) và danh sách sáu mục `rāga, chanda, pema, pipāsā, pariḷāha, taṇhā`.

  Dấu lược: 4 khoá Pāli có `…pe…` (6.2, 7.2, 8.2, 8.13) giữ đúng một `…`; 19 khoá có `…` trần (các khoá `vedanāya …`, `saññāya …`, `saṅkhāresu …`, 9.15) giữ đúng một `…`; Pāli không có `(…)` ở khoá nào nên không có `(…)`. Nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá (4.1–4.4 và 6.1–11.2 là hai lớp trích dẫn lồng nhau, đúng như Pāli).

  Pāli trùng nguyên văn trong chính bài: 12 nhóm khoá (4.1=6.1; 4.2=9.2; 4.3=6.3=7.3=8.3=9.3; 6.2=7.2=8.2; 6.5=7.5=8.9=9.9; 7.1=8.1=9.1; bốn nhóm `vedanāya …`/`saññāya …`/`saṅkhāresu …` cùng 7.10=8.20=9.18; 8.8=9.8; 8.11=9.11); bản Việt giống nhau ở cả 12 nhóm.

  Tiền lệ và thuật ngữ (đo trên tầng sn): `āvuso` → "hiền giả" (584 khoá, "Hiền giả" 29); `bhante` → "Bạch Thế Tôn"; "ngồi xuống một bên" trội hơn "ngồi một bên" trong 172 khoá cùng công thức đã dò (233 lần so với 77 lần); `chandarāgavinayo` → "sự nhiếp phục dục tham" (11 khoá "dục tham" so với 6 khoá "ham muốn", theo sn22.26 và sn14.31); `ādīnava` → "nguy hại" (40 khoá, "nguy hiểm" 37 — chọn theo sn14.31, sn35.14); `ānisaṁsa` → "lợi ích"; `sokaparidevadukkhadomanassupāyāsā` → "sầu, bi, khổ, ưu, não" (62/69 khoá); `Sakkesu … devadahaṁ nāma sakyānaṁ nigamo` theo sn35.134 (cùng Pāli); tên kinh "Kinh Devadaha" theo mn101 và sn35.134; dãy `rāga, chanda, pema, pipāsā, pariḷāha, taṇhā` theo sn23.2 ("tham, dục, luyến ái, khát khao, … , ái"), riêng `pariḷāha` dùng "nóng rực" cho cả dãy này lẫn `apariḷāho` (an5.3, an4.195) để một từ giữ một nghĩa trong bài; `vuttavādino … abhūtena abbhācikkheyyātha … sahadhammiko vādānuvādo` theo sn12.25, sn35.81, mn103; `sugati/duggati pāṭikaṅkhā` → "cõi lành/cõi dữ được mong chờ" theo an5.3 (cùng công thức), sn dùng "cõi lành" 15 khoá, "cõi dữ" 14 khoá; `upasampajja viharato` / `upasampadā` → "thành tựu" theo tiền lệ `kusalānaṁ dhammānaṁ upasampadāya` (an3.20, an11.14).

  Bất định ghi ở đây, không đưa vào thân kinh: (1) `eḷagalāgumbe` — Sujato dịch "golden shower trees", Thích Minh Châu "cây ba đậu (elagalà: cassia)"; bản Việt giữ phiên âm `eḷagalā` và chỉ dịch `gumba` là "bụi cây" để không khẳng định tên loài. (2) `nānāverajjagataṁ` — dịch "đã đi đến nhiều xứ sở khác" (Sujato "has gone abroad", Thích Minh Châu "thường đi các quốc độ khác nhau"). (3) `apalokito` — dịch "từ biệt" (Sujato "taken leave of"); Thích Minh Châu dịch "xin phép", nghĩa hai bên gần nhau và đều giữ được trong ngữ cảnh (các tỳ-kheo muốn đi xa và phải báo cho Tôn giả Sāriputta). (4) 4.4 `kacci vo … ?` — hiểu là câu hỏi của Tôn giả Sāriputta nói với các tỳ-kheo về việc họ đã nắm Pháp chưa, dịch "Có chắc là … chăng"; Sujato đọc là "I trust …", Thích Minh Châu đặt phần này vào lời của những người hỏi, như một đoạn của câu hỏi đã trích; Pāli không có dấu nháy riêng cho phần này nên bản Việt giữ nó trong lời Tôn giả Sāriputta, sau câu trích `‘…kimakkhāyī’ti`. Giáo nghĩa không đổi: đó vẫn là điều các tỳ-kheo cần nắm vững khi trả lời. (5) `sahadhammiko vādānuvādo` — dịch "lời bác bỏ hay chỉ trích hợp pháp"; `sahadhammika` có thể hiểu là "của người đồng pháp" hoặc "hợp theo Pháp", Việt chọn nghĩa thứ hai theo mn103 và Sujato ("legitimate grounds"). (6) `pema` → "luyến ái", `pipāsā` → "khát khao" theo sn23.2, khác Thích Minh Châu ("ái", "khát"); thứ tự và số lượng sáu mục vẫn khớp Pāli.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: chỉ xác minh được JSON hợp lệ, đủ 87 khoá, không thừa khoá, không rỗng, mọi giá trị NFC, dấu lược cân bằng Pāli từng khoá, `(…)` không đứng một mình, nháy đơn và nháy kép khớp Pāli từng khoá, và YAML đọc được. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
