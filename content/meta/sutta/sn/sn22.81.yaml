notes: |-
  Dịch trọn 140/140 khoá từ Pāli root đã ghim, đối chiếu English Sujato đã ghim, bản Việt nguyên bài của SuttaCentral ở mục Tra cứu toàn văn (Hòa thượng Thích Minh Châu), và các bài song song trong tầng: `sn22.55` (cùng câu hỏi "biết thế nào, thấy thế nào thì ngay tức thì có sự đoạn tận các lậu hoặc"), `sn35.116` (cùng khuôn các tỳ-kheo tìm Tôn giả Ānanda sau khi Đức Thế Tôn rời đi), `ud4.5` (cùng chuyến đi Pārileyyaka), `sn22.1`, `sn22.7` (cùng khuôn bốn cách quán ngã).

  **Coverage English.** Mẫu số = 88 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Sujato phủ 70/88 = 0,7955, dưới ngưỡng 0,80 (chỉ thiếu 0,0045, nhưng cổng so sánh số thô nên vẫn dưới). 18 khoá Sujato để trống đều là chỗ Pāli viết đầy đủ: `2.2` (lời tỳ-kheo báo tin), và các khoá lặp công thức duyên khởi của hành ở bốn đoạn lược `6.4`–`8.12` và `11.12`, `11.14`. Lớp `english-project` không có bài này, tầng Việt hiện hành (bilara) cũng không có; bản Việt nguyên bài chỉ là tra cứu toàn văn, không cấp text theo khoá. Vì vậy blocker coverage là thật, không bù được bằng điểm: status giữ `draft`, `triangulation` đặt 7,8 (chỗ Sujato trống Pāli phải tự đứng vững; các khoá còn lại được đối chiếu độc lập). Hướng gỡ: dịch lớp `english-project` cho 18 khoá trên (giữ dấu lược), rồi chấm lại.

  **Pāli trùng nguyên văn trong chính bài: 13 nhóm (45 khoá, 77 cặp), cả 13 nhóm dùng bản Việt y nguyên, 0 nhóm lệch.** Lớn nhất: `5.4` = `6.3` = `7.3` = `8.3` = `9.6` (sự quán là hành); `5.5` = `6.4` = `7.4` = `8.4` = `11.11` = `12.11` (hành lấy gì làm nhân); `5.6` = `6.5` = `7.5` = `8.5` = `9.8` = `11.12` = `12.12` (ái khởi lên từ cảm thọ do xúc với vô minh); `5.8` = `6.7` = `7.7` = `8.7` = `9.10` = `12.14`.

  **Tiền lệ ngoài bài.** Đã dò 5 khoá có Pāli trùng nguyên văn với khoá đã dịch ở tầng (11 cặp): `1.2` dùng lại y nguyên một trong hai dạng của `mn128:5.1`; `3.4` dùng lại y nguyên `sn35.116:3.2`; ba khoá cố ý khác: `1.1` ("Đức Thế Tôn … tu viện Ghosita": tầng có 3 khoá "Đức Phật … tinh xá" ở `an8.46`, nhưng ở sn/mn/ud chủ yếu là "tu viện Ghosita", 17 khoá), `4.5` (hai dạng ở `mn109:14.4` không thống nhất, chọn dạng gần "bằng tâm biết được suy nghĩ"), `12.4` (`sn22.117:2.7` dịch "không thấy thức là tự thân"; bài này theo khuôn sn22.1, sn22.7, sn22.55 "quán … là tự ngã"; đo trên khuôn `rūpaṁ attato samanupassati` toàn tầng: "tự ngã" 19, "ngã" 8, "tự thân" 6). Các khoá khác lấy khuôn từ khoá gần nghĩa: `1.3`, `2.2`, `2.3` theo `dn16:2.23.4` và `sn47.9:2.4` ("không báo cho các thị giả biết, không từ biệt đại chúng tỳ-kheo", 2 khoá); `4.2` theo `dn16:2.14.4`; `5.2` theo `sn22.47:1.4`; `5.5` theo `mn38:16.7`, `sn12.11:2.7`; `5.6` theo `sn22.47:2.5`; `5.8` theo `sn36.7:5.6`, `sn12.20:4.4`; `12.9` theo `an4.184:6.1`; `11.9`, `12.8` theo `sn22.55:10.4`, `sn24.4:1.3`, `sn22.153:1.3` (16 khoá).

  **Bất định đã ghi, không giấu.**
  - `saṅkhāro` (`5.4`–`12.18`) dịch **"hành"** theo Hòa thượng Thích Minh Châu và theo `saṅkhārā` = các hành ở `9.4`, `10.4`; Sujato dịch "conditioned phenomenon". Hai cách cùng đi qua được câu "hành ấy cũng vô thường, hữu vi, do duyên sinh", nhưng dùng cùng một chữ "hành" cho uẩn ở `9.4` và cho cái bị gọi tên ở `5.4` có thể làm người đọc lướt tưởng là một. Chọn giữ "hành" vì tầng không có tiền lệ khác cho cấu trúc này (`sn22.55` chỉ dịch `saṅkhato`), đây là lý do `terminology` ở 9,1 và `ambiguity_integrity` ở 8,8.
  - `12.5` `na viññāṇasmiṁ attato samanupassati` là chỗ **nghĩa đen mâu thuẫn văn cảnh**: `viññāṇasmiṁ` (định vị cách, "trong thức") đi với `attato` (xuất xứ cách, "là tự ngã"), không thành câu như các khuôn trước (đáng lẽ `attānaṁ`). Sujato để trống khoá này; Hòa thượng Thích Minh Châu dịch "không quán tự ngã ở trong thức". Đã chọn khớp với khuôn bốn cách quán ở `9.1`–`9.5`, `8.2`: cách thứ tư, "không quán tự ngã ở trong thức", vì dấu lược `12.4` đã bỏ qua hai cách giữa. Không thể loại hẳn khả năng bản Pāli ghim có lỗi chính tả (`attato` lẫn từ `attānaṁ`); không đổi giáo nghĩa của bài.
  - `10.7`, `11.7`, `12.6` công thức `so attā so loko, so pecca bhavissāmi nicco dhuvo sassato avipariṇāmadhammo`: giữ khung `sn24.3`, `sn22.152` (9 khoá: "Tôi là tự ngã ấy, là thế giới ấy, sau khi tôi chết tôi sẽ là như vậy, thường còn, bền chắc, … , không thay đổi") nhưng thay "chân chất" bằng **"thường hằng"** cho `sassato`: "chân chất" không có căn cứ ở `sassata` (vĩnh cửu), còn `sn22.96:2.2`–`2.4` đã dịch "thường còn, bền vững, thường hằng, không chịu biến hoại" (3 khoá) và bản Hòa thượng Thích Minh Châu của chính bài này cũng viết "thường còn, thường hằng, thường trú". Cách hiểu `so attā so loko` là "tự ngã ấy là thế giới ấy" (Sujato "one and the same") không thể loại trừ; giữ khuôn tầng vì chuỗi này đã dịch nhất quán ở sn24.
  - `11.9`, `12.8` `no cassaṁ no ca me siyā nābhavissaṁ na me bhavissatī` dịch **đúng khuôn tầng** "Có thể chẳng có, và sẽ chẳng phải của tôi; sẽ chẳng có, và sẽ chẳng phải của tôi" (16 khoá, ở `sn22.55`, `sn24.4`, `sn22.153`). Pāli của bài viết `nābhavissaṁ` (có ṁ), các khoá tiền lệ viết `nābhavissa`; đã coi là biến thể chính tả. Khuôn tầng bỏ chủ ngữ ở `no cassaṁ` (ngôi thứ nhất, Sujato "I might not be"); giữ vì Pāli cũng chỉ có một hình thái động từ.
  - `na heva kho … api ca kho …` (`6.1`–`12.9`) dịch **"Có thể người ấy không … nhưng …"**. Pāli không có "có thể" lẫn "người ấy"; cả Sujato ("Perhaps they don't") lẫn Hòa thượng Thích Minh Châu ("Vị ấy có thể không") đều thêm, vì đây là các trường hợp giả định nối tiếp `5.2` (kẻ phàm phu chưa học). "Người ấy" thay "vị ấy" của Hòa thượng Thích Minh Châu vì chủ thể là kẻ phàm phu.
  - `api ca kho` lặp ở `9.2`–`9.5` dịch **"hay"** (khuôn `vā` của `sn22.1:9.3`, `sn22.7:2.3`, `sn22.55:2.2`: "quán sắc là tự ngã, hay tự ngã có sắc, …") để ba chữ "hay" nối bốn cách quán, và "nhưng" chỉ ở `9.2`. Pāli dùng `api ca kho` mỗi lần; nghĩa "hay" (lựa chọn) là cách đọc theo ngữ cảnh, không thấy chữ `vā` trong khoá.
  - `vicayaso` (`4.6`–`4.15`) dịch **"một cách phân tích"**; tầng không có tiền lệ (đếm = 0). Sujato "analytically"; Hòa thượng Thích Minh Châu dịch "giải thích, thuyết giảng" (bỏ mất sắc thái phân tích).
  - `anantarā āsavānaṁ khayo` dịch **"ngay tức thì có sự đoạn tận các lậu hoặc"** theo `sn22.55:10.1`, `13.9`; tầng có hai cách khác: "ngay lập tức" (`an5.170`) và "không trì hoãn" (`an6.27`, `an6.28`). Chọn cách cùng saṁyutta.
  - Địa danh: Pāli ghim viết `pālileyyaka`; dịch **Pārileyyaka** theo `ud4.5` (4 khoá) và Sujato; `bhaddasālamūle` dịch "dưới gốc cây sāla phước lành" theo `ud4.5:2.4` (1 khoá), bản nguyên bài giữ "bhaddasàla". Tên bài "Kinh Pārileyyaka" tự đặt từ `Pālileyyasutta`, không có tiền lệ.
  - `evampi kho` (`5.12`, `6.12`, `7.12`, `10.10`, `11.15`) dịch có **"cũng"**, còn `evaṁ kho` (`9.15`, `12.19`) không có: phân biệt cách thứ nhất trong nhiều cách, và cách kết luận cuối cùng.

  **Số Pāli.** `cattāro` = bốn (`4.7`, `4.8`, `4.9`: niệm xứ, chánh cần, như ý túc); `pañca` = năm (`4.10`, `4.11`: căn, lực); `satta` = bảy (`4.12`: giác chi); `aṭṭhaṅgiko` = tám ngành (`4.13`). Không có số lớn.

  **Dấu lược và nháy.** `…pe…` ở `8.12`, `9.7`, `10.9`, `11.14`, `12.4` thành đúng một `…`; các `…` trần ở `6.8`–`6.10`, `7.8`–`7.10`, `8.8`–`8.10`, `9.3`, `9.11`–`9.13`, `10.3`–`10.4`, `11.2`–`11.4`, `12.1`–`12.3` giữ đúng một dấu mỗi khoá, khớp Pāli từng khoá. Nháy kép và nháy đơn khớp Pāli ở cả 140 khoá (đo từng khoá, 0 lệch); không có `(…)` trần trong bài này.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`, và `npm run build` (chỉ cần khi bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.

  **Giải quyết draft 2026-10-12.** Blocker duy nhất trước đó là độ phủ English Sujato 70/88 = 0,7955 (dưới ngưỡng 0,80) và đã được gỡ khỏi `blocking_errors`; mục "Coverage English" và hướng gỡ "dịch lớp english-project" ở trên không còn là điều kiện chặn (mất mát được ghi nhận ở bản ghi gap của kho). Lý do gỡ: đã đọc đối kháng lại từ Pāli cả 18 khoá Sujato để trống (`2.2`, `6.4`, `6.5`, `6.7`, `6.11`, `6.12`, `7.4`, `7.5`, `7.7`, `7.11`, `7.12`, `8.4`, `8.5`, `8.7`, `8.11`, `8.12`, `11.12`, `11.14`). Đây đều là các khoá lặp nguyên văn công thức đã có ở khoá Sujato phủ (`5.5`, `5.6`, `5.8`, `5.11`, `5.12`, `1.3`), bản Việt dùng lại y nguyên; riêng `8.12` và `11.14` có dấu lược `…pe…` được giữ thành một `…`. Không còn đoạn nào có nghĩa chưa chắc ở các khoá này. Vì vậy chỗ Sujato trống tự đứng vững từ Pāli, nhưng đây không phải đối chiếu English độc lập nên `triangulation` giữ 7,8 (không cao hơn 8,0). Tầng Việt hiện hành không có cho bài này (tầng ấy chỉ có Pháp Cú); đó là giới hạn tham chiếu, không phải lỗi văn bản.

  Đọc đối kháng toàn bài (140 khoá): không thấy lỗi nghĩa thật. Một sửa nhỏ: `8.12` đổi "biết như vậy … cũng có sự" thành "biết như vậy cũng … có sự đoạn tận các lậu hoặc", vì `evampi` thuộc `jānato` đứng trước dấu lược `…pe…`, còn sau dấu lược chỉ là `āsavānaṁ khayo hoti` (sửa chính xác vị trí "cũng"; không đổi nghĩa). Điểm hạ nhẹ so với lượt trước: `semantic_fidelity` 9,2 → 9,0, `grammar_logic` 9,2 → 9,1, `vietnamese_clarity` 9,1 → 9,0, vì ba chỗ bất định dưới đây và vì cụm "xúc chạm … chạm vào" ở `5.6` (và 6 khoá lặp) có hai chữ "chạm" liền nhau.

  Bất định bổ sung, không đổi câu chữ: (1) `avijjāsamphassajena vedayitena` ở `5.6`, `6.5`, `7.5`, `8.5`, `9.8`, `11.12`, `12.12` đang dịch "cảm thọ do xúc chạm sinh ra từ vô minh", tức hiểu vô minh là nguồn của xúc; Sujato dịch "feelings born of contact with ignorance" (xúc với vô minh), và cách hiểu "xúc có vô minh đi kèm" cũng khả dĩ. Tầng chỉ có một tiền lệ (`sn22.47:2.5`, cùng cách dịch), nên giữ để nhất quán, nhưng không loại trừ cách hiểu thứ hai. (2) `so attā so loko` (`10.7`, `11.7`, `12.6`): giữ khuôn "Tôi là tự ngã ấy, là thế giới ấy" của `sn22.152` đã ghi ở trên; cách hiểu "tự ngã ấy là thế giới ấy" (Sujato "one and the same") khả dĩ như nhau. (3) `aniṭṭhaṅgato saddhamme` (`12.9`, `12.10`) dịch "không vững vàng nơi Chánh Pháp" theo `an4.184:6.1` (3 khoá); nghĩa sát chữ là "chưa đi đến chỗ dứt khoát/cứu cánh nơi Chánh Pháp", không đổi giáo nghĩa. Chưa có bất định nào làm thay đổi đáng kể nghĩa đoạn kinh, nên không còn blocker.
