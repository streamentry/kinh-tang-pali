notes: |-
  Đợt 19, lát l20. Dịch từ Pāli root commit 11c9d708, đối chiếu English Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (Bình Anson hiệu đính) ở mục tra cứu toàn văn. **76 khoá** (0.1–0.3, 1.1–1.3, 2.1–2.3, 3.1–3.3, 4.1–4.3, 5.1–5.12, 6.1–6.6, 7.1–7.16, 8.1–8.14, 9.1–9.13), viết đủ cả 76 khoá; tập khoá khớp 76/76 với Pāli, đúng thứ tự.

  **Coverage Anh trên Pāli có nội dung: 38/59 = 64,4%** — dưới sàn 0,80. Mẫu số 59 là khoá Pāli ≥ 40 ký tự, bỏ khối :0. Sujato để trống 21 khoá dù Pāli viết đầy đủ: 2.2, 3.1, 3.2, 4.1, 4.2 (các lượt hỏi đáp lặp), 5.2–5.11 (lời kể lại với Đức Thế Tôn), 7.5, 7.6, 7.10, 7.11 (lặp ví dụ cây kiṁsuka), 8.11, 8.13 (lặp ví dụ sứ giả). Lớp english-project **chưa có** tệp nào cho bài này nên chưa có gì lấp các chỗ trống; mọi khoá trong danh sách trên chỉ được đối chiếu Pāli + bản Việt nguyên bài của Hòa thượng Thích Minh Châu, không có bản Anh độc lập. Vì vậy triangulation hạ xuống 7,0 và bài giữ `draft` kèm blocker. Gợi ý xử lý: lấp 21 khoá bằng lớp english-project (khoá lặp nên có thể dùng lại đúng câu Anh Sujato đã dịch ở chỗ lặp), rồi chạy `npm run reference:gaps`.

  **Pāli trùng nguyên văn trong chính bài: 11 nhóm, 20 cặp; 18 cặp Việt giống hệt, 2 cặp Việt khác.** Các nhóm: {1.2, 2.2, 3.2, 4.2}; {2.1, 3.1, 4.1}; {5.2, 5.6} (Pāli giống hệt, nháy đơn bao quanh như nhau); {5.3, 5.7}; {6.3, 7.2, 7.7, 7.12}; {6.4, 7.3, 7.8, 7.13, 8.5, 8.12}; {6.6, 7.5}; {7.10, 7.15}; {7.6, 7.11}; {8.6, 8.13}; {8.7, 8.14}. Ngoài ra 6.6/7.5 và 7.10/7.15 chỉ khác nhau một dấu phẩy trong Pāli nên bốn khoá này dịch cùng một câu; 8.4 và 8.11 khác nhau một từ Pāli (`nagarassa`) nhưng nghĩa như nhau nên dịch giống nhau; 7.1 khác 7.6/7.11 ở chỗ có `bhikkhu` đứng sau `so` và dịch thêm *lại* ở lần thứ hai, thứ ba (7.6, 7.11).
  Hai cặp Pāli giống hệt mà Việt khác: `So evaṁ vadeyya:` ở 6.4, 7.3, 7.8, 7.13 → *Người kia sẽ nói:* (người được hỏi về cây kiṁsuka), còn ở 8.5, 8.12 → *Người giữ cổng sẽ nói:* (chủ ngữ là người giữ cổng, suy ra từ vế trước 8.3 và 8.10). Đây là khác chủ ngữ theo văn cảnh, không phải lệch khoá.

  **Thuật ngữ và tiền lệ đã đếm:**
  - `Kiṁsuka` → *cây kiṁsuka*, giữ nguyên danh xưng (kiṁsuka là cây Butea monosperma; tiền lệ `sn35.248:8.3` *cây kiṁsuka*, `tha-ap355` *hoa kiṁsuka*). Tên bài lấy khuôn *Kinh Ví Dụ Cây Đàn Tỳ Bà* của `sn35.246` → *Kinh Ví Dụ Cây Kiṁsuka*; Sujato *The Simile of the Parrot Tree*, Hòa thượng Thích Minh Châu *Phải Gọi Là Gì (Kimsukà)*.
  - `Āsīvisavagga` → *19. Phẩm Rắn Độc* (khuôn `sn35.244`, `sn35.246`–`248`).
  - `dassanaṁ suvisuddhaṁ` → *sự thấy … được thanh tịnh hoàn toàn* (Sujato *vision is well purified*; Hòa thượng Thích Minh Châu *sự thấy … khéo thanh tịnh*; `sn56.11`, `an8.64` *hoàn toàn thanh tịnh*).
  - `āvuso` → *hiền giả* (`sn52.1:2.3`, `mn36:13.13`, `mn26:15.12`, `mn85:12.2`). `kittāvatā nu kho` → *cho đến mức nào*.
  - `channaṁ phassāyatanānaṁ` → *sáu xứ xúc* (đếm trên tầng: *sáu xứ xúc* 45, *sáu xứ xúc chạm* 34, *sáu xúc xứ* 12). `pañcannaṁ upādānakkhandhānaṁ` → *năm thủ uẩn*; `catunnaṁ mahābhūtānaṁ` → *bốn đại*.
  - `samudayañca atthaṅgamañca yathābhūtaṁ pajānāti` → *biết rõ như thật sự khởi sinh và sự diệt tận* (khuôn `sn35.244` cùng phẩm).
  - `yaṁ kiñci samudayadhammaṁ sabbaṁ taṁ nirodhadhammaṁ` → *bất cứ pháp nào có tính sinh khởi, tất cả đều có tính đoạn diệt*: dùng lại nguyên văn dạng chiếm đa số của công thức (13 khoá đã dịch, trong đó 4 khoá giống hệt dạng này, `sn35.74:21.4`). Cố ý để *tính sinh khởi* theo công thức, trong khi `samudaya` đứng một mình dịch *sự khởi sinh* theo `sn35.244`; hai dạng cùng gốc nên người đọc cần biết đây là hai khuôn tiền lệ khác nhau.
  - `asantuṭṭho … pañhaveyyākaraṇena` → *không hài lòng với lời giải đáp câu hỏi* (`pañhaveyyākaraṇa` → *lời giải đáp*, `dn18:2.7`, `dn21`; `asantuṭṭha` ở `an4.157`/`an5.127` nghĩa *không tri túc* nhưng ở đây là *không bằng lòng với câu trả lời* nên dùng *không hài lòng*).
  - `sappurisa` → *bậc chân nhân* (đếm trong `sn`: *chân nhân* 12, *thiện nhân* 9, *thiện tử* 7); Sujato *true persons*, Hòa thượng Thích Minh Châu *Chân nhân*.
  - `sirīsa` → *cây sirīsa* (`dn14:1.8.4`); Sujato *lebbeck tree*, Hòa thượng Thích Minh Châu *cây keo (sirīso)*. `nigrodha` → *cây đa* (đếm trên tầng: *cây đa* 18, *cây bàng* 4). `maṁsapesī` → *miếng thịt* (`an7.74:7.1`, `mn54:16.1`, `mn23:2.34`).
  - `paccantimaṁ nagaraṁ daḷhuddhāpaṁ daḷhapākāratoraṇaṁ` → *thành trì biên cương của vua, có hào lũy kiên cố, tường thành và cổng vòm kiên cố* (khuôn `dn16:1.17.3`, `an10.95:10.4`, `sn47.12:6.3`); ở đây thêm `chadvāraṁ` → *có sáu cổng*.
  - `dovārika` → *người giữ cổng* (khác `mn56` *người giữ cửa* vì ở đây là cổng thành). `dūtayuga` → *cặp sứ giả* (0 tiền lệ trên tầng Pāli; Sujato *a swift pair of messengers*, Hòa thượng Thích Minh Châu *hai người sứ giả*). `nagarassāmī` → *vị chủ thành* (0 tiền lệ). `siṅghāṭaka` → *ngã tư*. `yathābhūtaṁ vacanaṁ` → *lời như thật* (Sujato *a message of truth*, Hòa thượng Thích Minh Châu *lời như thật ngữ*), và 9.10 cho biết nó là Niết-bàn. `yathāgatamagga` → *con đường đã đến* (0 tiền lệ), 9.11 cho biết nó là Thánh đạo tám ngành.
  - Công thức thân tứ đại 9.3 (`cātumahābhūtika … aniccucchādanaparimaddanabhedanaviddhaṁsanadhamma`) đo 13 khoá trên tầng: *cha mẹ* 11 : *mẹ cha* 4; *nuôi lớn bằng cơm cháo* chiếm đa số. Viết *do bốn đại tạo thành … do cha mẹ sinh ra, được nuôi lớn bằng cơm cháo, có bản chất vô thường, hao mòn, xói mòn, tan vỡ và hủy hoại*. Năm vế cuối ứng với năm phần tử Pāli (anicca, ucchādana, parimaddana, bhedana, viddhaṁsana); cách chia vế khác nhau giữa các bài tầng nên không áp nguyên văn một bài.
  - `samathavipassanā` → *an tịnh và minh sát* (6/9 khoá có công thức này trên tầng; Sujato *serenity and discernment*). `aṭṭhaṅgika magga` → *Thánh đạo tám ngành* (`sn35.238:15.1`). `pathavīdhātu…vāyodhātu` → *địa đại, thủy đại, hỏa đại, phong đại* (`sn35.238:7.4`). `Upamā kho myāyaṁ … atthassa viññāpanāya` → *Ví dụ này … được Ta đưa ra để làm rõ ý nghĩa* (`sn35.238:7.1`). `Aṭṭhamaṁ` → *Thứ tám* (`sn35.244:9.16` *Thứ bảy*).

  **Số Pāli:** 6 (cổng, xứ xúc), 5 (thủ uẩn), 4 (đại, hướng, chủ đề trả lời), 8 (Thánh đạo tám ngành, `Aṭṭhamaṁ` = bài thứ tám trong phẩm), 2 (cặp sứ giả), 4 hướng đông–tây–bắc–nam (8.3, 8.8, 8.9, 8.10). Không có số lớn. Bốn câu đáp của bốn vị tỳ-kheo (1.3, 2.3, 3.3, 4.3) được kể lại ở 5.4, 5.8, 5.9, 5.10 (ba câu sau bị lược); không có số nào bị suy.

  **Bất định có nghĩa đáng kể (không thêm vào thân kinh):**
  1. `7.16 adhimuttānaṁ` (genitive của `adhimutta`): Pāli không nêu đối tượng của sự hướng tâm. Sujato dịch *focused on*; Hòa thượng Thích Minh Châu bỏ qua từ này (*tùy theo sự thấy … khéo thanh tịnh, tùy thuộc theo đấy*). Tôi giữ *những vị đang hướng tâm* không gán đối tượng, đúng với `adhimutta` (tầng dùng *hướng tâm* cho `adhimutta` ở `an3.116`, `dhp226`). Nếu người biên tập muốn nhấn nghĩa *tùy sở trọng của từng vị* thì đó là cách đọc có thể bảo vệ nhưng Pāli không nêu rõ.
  2. `7.9 ocīrakajāto … ādinnasipāṭiko`: Sujato *flaking bark and burst pods*, Hòa thượng Thích Minh Châu *bị lột vỏ, vỏ bị nứt nẻ ra*. Tôi dịch *tróc vỏ, quả nứt toác*: hai từ này **không có** tiền lệ nào trên tầng Pāli (`ocīraka` 0, `sipāṭika` 1 khoá không dịch). Nghĩa chính xác của `ocīraka` (tróc vỏ hay rụng lá) và `sipāṭikā` (vỏ quả hay vỏ hạt) chưa kiểm được bằng từ điển trong lát này; phần *như cây sirīsa* thì chắc.
  3. `6.5 jhāmakhāṇu` → *gốc cây cháy*: `khāṇu` là cọc hoặc gốc cây trụi, 0 tiền lệ; Sujato *charred stump*, Hòa thượng Thích Minh Châu *một khúc cây bị cháy*. Chọn *gốc cây cháy* theo Sujato.
  4. `7.14 bahalapattapalāso sandacchāyo` → *có lá rậm, bóng mát dày*: 0 tiền lệ; Sujato *luxuriant, shady foliage*, Hòa thượng Thích Minh Châu *lá rậm rạp, bóng của nó dày và rậm*.
  5. `8.1 chadvāraṁ` = *có sáu cổng*, rồi 8.2 chỉ có **một** người giữ cổng cho cả thành; đây là hình ảnh của kinh, không phải lỗi dịch.
  6. `8.2 paṇḍito byatto medhāvī` → *sáng suốt, thành thạo, thông tuệ*: 3 từ gần nghĩa; thứ tự giữ theo Pāli.
  7. `5.8–5.10`: dấu lược `…pe…` ở 5.8 và 5.9 bỏ lửng giữa câu, nên *khi vị tỳ-kheo, về năm thủ uẩn …* ở 5.8 là câu bị cắt đôi (tầng Pāli lược chính phần động từ); tôi dùng *về* làm bản lề cho cách đứng của sở hữu cách `pañcannaṁ upādānakkhandhānaṁ` mà không điền thêm động từ từ 5.4. 5.10 bắt đầu bằng *bất cứ pháp nào …* (chữ thường) vì nối tiếp 5.9.

  **Dấu lược và ngoặc.** Dấu lược `…`: khớp 1:1 với Pāli ở 5.8, 5.9, 8.8, 8.9, 9.12 (mỗi nơi đúng một `…`; `…pe…` → một `…`; 8.9 `…` trần giữ nguyên). 5.11 giữ nguyên dấu lược của tầng Pāli `(…)` trước dấu chấm. Ngoặc: 1.2, 1.3, 2.2, 2.3, 3.2, 3.3, 4.2, 4.3 mỗi khoá tự mở và tự đóng ngoặc kép; 5.1 mở kép `“` (nối thẳng đến 5.12 đóng `”`), 5.2/5.4/5.6/5.10 là nháy đơn lồng bên trong, 5.8 mở `‘` và 5.10 đóng `’` (nháy đơn trải qua ba khoá, đúng Pāli); 6.1 mở kép `“` và 9.12 đóng `”` (cả lời Đức Thế Tôn một mạch); 6.3, 6.5, 7.2, 7.4, 7.7, 7.9, 7.12, 7.14, 8.4, 8.6, 8.11, 8.13, 9.3–9.11 tự cân nháy đơn. Số nháy `“ ” ‘ ’` mỗi khoá bằng Pāli: 0 lệch / 76 khoá.

  **Lỗi bản nháp đã bắt:** (a) bản đầu 8.6/8.13 dịch *ngã tư giữa thành* — thêm nghĩa *giữa thành* mà Pāli `majjhe siṅghāṭake` không nói rõ; đổi *giữa ngã tư* cho khớp với 9.8 (Hòa thượng Thích Minh Châu cũng dịch *giữa ngã tư đường*) và để 9.8 *Giữa ngã tư … là tên gọi của bốn đại* đọc khớp 8.6. (b) bản đầu 9.8 viết *Ngã tư ở giữa*, không đồng nhất với 8.6; đã sửa.

  **Tự kiểm:** tập khoá khớp 76/76, thứ tự khoá = thứ tự Pāli, 0 khoá rỗng, 0 lệch dấu lược, 0 lệch nháy, NFC đạt.
  Chưa chạy được bốn lệnh của kho trong lát này (bị cấm): `npm run validate`, `npm test`, `npm run check`, `npm run build` — nên `technical_integrity` đặt 9.6 và **không** tuyên bố technical gate đã pass.
