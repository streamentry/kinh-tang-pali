notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có 26 chương Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Hai tầng còn lại là Pāli root (authority) và bản Anh Bhikkhu Sujato đã ghim.
  - >-
    **Coverage tầng Anh 1,000** (22 Pāli có nội dung, 22 có chữ Sujato).
  - >-
    **Bài không có Pāli trùng nguyên văn** với bài nào đã dịch (đã kiểm bằng chỉ mục Pāli → Việt trên 3.359 bài): mọi thuật ngữ dưới đây đều phải **tra đếm** trong kho, không có bản song song để dùng lại.
  - >-
    **Thuật ngữ đã đếm.** `Balavagga` → *3. Phẩm Sức Mạnh* (9 trong sn37) · `mātugāma` → *người nữ* (199; sn37 dùng *người nữ* ở `sn37.1:0.3`, `sn37.14:1.3`) · `puñña` → *công đức* (159; `sn6.3:9.4` *hãy tạo công đức*) · `dullabha` / `sulabha` → *khó gặp* / *dễ gặp* (15 và 2, thành cặp đối xứng; *hiếm có* có 48 nhưng không có cặp đối xứng) · `ṭhāna` → *hoàn cảnh* (theo `an4.115`, cùng `Ṭhānasutta` và cùng cách dịch `ṭhāna` là *hoàn cảnh*) · `sambahulā` → *nhiều vị* (4).
  - >-
    **0 tiền lệ, đặt mới — năm từ ngữ xã hội.** `patirūpa kula` → *gia đình thích hợp* (0 tiền lệ) · `asapatti agāraṁ ajjhāvaseyyanti` → *sống tại gia mà không có vợ hai* (0 tiền lệ; kho không có *hải hôn* lẫn *đồng trinh thất*) · `sāmikaṁ abhibhuyya vatteyyanti` → *sống mà thắng trộn được chồng* (*thắng trộn* có 2, dùng đúng nghĩa *abhibhuyya*) · `puttavatī assanti` → *có con* · `ṭhānāni` → *hoàn cảnh*.
  - >-
    **Dấu lược — quyết định từng khoá.** Bài này **không có `…pe…` nào**; các vế ước nguyện kết bằng `—` ở Pāli được giữ nguyên `—`, không thêm `…`. Vì vậy `lược()` bằng 0 mọi khoá.
  - >-
    **Ngoặc kép.** Pāli mở `“` ở `:1.1` nhưng chỉ đóng ở `:2.13` (không đóng ở `:1.13`), nên bản Việt để một lời nói liên tục từ `:1.1` đến `:2.13`: đóng dấu ở `:2.13` và bỏ dấu đóng ở `:1.13`. Nhờ vậy `_hvi.ngoặc` cân.
  - >-
    **Tiêu đề.** `Ṭhānasutta` → *Kinh Các Hoàn Cảnh*; tiền lệ có hai cách: `an4.115:0.3` *Kinh Các Hoàn Cảnh* và `sn52.15:0.3` *Kinh Biết Rõ Chỗ Này Chỗ Kia*. Chọn theo `an4.115` vì nội dung hai bài cùng là liệt kê `ṭhāna` và đã dịch `ṭhāna` là *hoàn cảnh*.
  - >-
    **Khác kho, có chủ ý — số đếm.** `Saṁyutta Nikāya` → *Tương Ưng Bộ* (xem `sn35.105`).
  - >-
    `technical_integrity` 9.6 vì bốn lệnh cổng **do coordinator chạy**, lát này đã tự kiểm mọi thứ còn lại bằng `_hvi.kiểm` (NFC, dấu lược khớp từng khoá, nháy kép cân trên cả bài, không Pāli lọt): `npm run validate` · `npm test` · `npm run check` · `npm run build`.
