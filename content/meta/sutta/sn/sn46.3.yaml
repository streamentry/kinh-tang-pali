notes: |-
  Dịch từ Pāli root (bilara đã ghim), đối chiếu Anh Bhikkhu Sujato. ĐO LẠI: 34/34 khoá Pāli có nội dung đều có chữ Anh ⇒ coverage 1,000. Không dùng bản lấp Anh của dự án.
  Bản Việt hiện hành (Hòa thượng Thích Minh Châu) không có: tầng `vietnamese-current` tại commit đã ghim chỉ có 26 chương Pháp Cú.
  BÀI SONG SONG ĐÃ DÙNG LÀM KHUÔN: `mn118` (đã publish) là cùng dãy bảy giác chi, cùng nhịp `Yasmiṁ samaye … āraddho hoti; … bhāveti; … bhāvanāpāripūriṁ gacchati`, chỉ khác `pavinati pavicayati` ở bản Mn và `pavicinati pavicarati` ở bản Sn. Vì vậy 2.1–8.1 dịch theo đúng nhịp của `mn118:30.2–36.2`, và 4.2, 5.2, 6.2, 7.2 có PĀLI TRÙNG NGUYÊN VĂN với `mn118:33.1/34.1/35.1/36.1` nên dùng lại NGUYÊN VĂN — đó là 4 khoá trong 9 khoá có tiền lệ.
  PĀLI TRÙNG NGUYÊN VĂN: 9/40 khoá có Pāli giống hệt tệp đã có, 9 khoá dùng lại nguyên văn: 0.2 (`sn46.1:0.2`) · 0.3 (`sn47.21:0.3`) · 1.7 (`sn11.3:8.1`) · 4.2, 5.2, 6.2, 7.2 (`mn118`) · 9.2 (`sn48.66:1.6`).
  THUẬT NGỮ, cùng cơ sở với `mn118`: `satisambojjhaṅgo` → giác chi niệm · `dhammavicayasambojjhaṅga` → giác chi trạch pháp · `vīriyasambojjhaṅga` → giác chi tinh tấn · `pītisambojjhaṅga` → giác chi hỷ · `passaddhisambojjhaṅga` → giác chi an tịnh · `samādhisambojjhaṅga` → giác chi định · `upekkhāsambojjhaṅga` → giác chi xả; `āraddho hoti` → được khơi dậy; `bhāveti` → tu tập; `bhāvanāpāripūriṁ gacchati` → được đưa đến sự viên mãn của sự tu tập. Cần biết: `sn46.76` (cùng phẩm, đã publish) dùng thứ tự khác — `niệm giác chi`, `xả giác chi`, và `ps1.9:9.2` dùng `niệm giác chi / trạch pháp giác chi`. Ba kiểu đang tồn tại trên đĩa; chọn theo `mn118` vì đó là bài song song gần nhất về cấu trúc. Người biên tập nên thống nhất.
  BẢY QUẢ, dịch theo `sn48.66` (đã publish, cùng khung `No ce … atha …`): `satta phalā sattānisaṁsā` → bảy quả bảy lợi ích · `diṭṭheva dhamme paṭikacca aññaṁ ārādheti` → ngay trong hiện tại mà chứng đạt thắng trí sớm · `pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā` → do đoạn tận năm trói buộc phần dưới · `antarā/upahacca/asaṅkhāra/sasaṅkhāraparinibbāyī` → bát-niết-bàn giữa chừng / khi chạm đến / không cần gắng sức / cần gắng sức · `uddhaṁsoto akaniṭṭhagāmī` → đi ngược dòng đến cõi Akaniṭṭha. Trên đĩa còn hai cách cho cùng danh sách này: `sn51.26:2.4` (năm hạ phần kiết sử; vị nhập diệt ở giữa / khi sanh / vô hành / hữu hành / thượng lưu) và `an3.87`/`an3.88` (năm kết trói buộc hạ giới; bậc Diệt tận giữa hai đời …). Ba cách đều đã publish; ở đây theo `sn48.66` vì Pāli `No ce … no ce … atha …` khớp từng mệnh đề.
  CHÚ Ý 1.1–1.6: Pāli lặp `tesaṁ bhikkhūnaṁ bahukāraṁ vadāmi` sáu lần; tiếng Việt lặp `Ta nói là có lợi ích lớn` theo đúng sáu lần, và từ 1.2 trở đi dùng `họ` cho `tesaṁ bhikkhūnaṁ` (1.1 đã nêu `những vị tỳ-kheo`) — tránh lặp cụm dài sáu lần. Cụm `dassanampāhaṁ … bahukāraṁ vadāmi` theo tiền lệ `iti104:2.1` (được thấy … có lợi ích lớn). `sīlasampannā … ñāṇasampannā` → `thành tựu giới hạnh, thành tựu định, thành tựu tri, thành tựu giải thoát, thành tựu tri kiến giải thoát` cũng theo `iti104:2.1` (chỗ đó là `paññāsampannā`; ở đây Pāli là `ñāṇasampannā` nên dịch `tri`).
  BẤT ĐỊNH: 1.8 `dvayena vūpakāsena` → `viễn ly cả hai: viễn ly thân và viễn ly tâm`. `dn34:2.1.12` (Pāli gần trùng, `sampādeti`) dịch `ly thoát bằng hai phương diện — ly thoát về thân và ly thoát về tâm`; ở đây theo `vūpakaṭṭho`→`viễn ly` (460 khoá) cho nhất quán với 1.9 và với cả bài.
  DẤU NHÁY: 1.1 mở thì 9.10 khép; các khoá còn lại không nháy. Cân trên toàn bài. Bài không có `…pe…`.
  CỔNG KỸ THUẬT: bốn lệnh do coordinator chạy; technical_integrity 9,6. Đã tự kiểm bằng `_hvi.kiểm()` — 40/40 khoá sạch.
