notes: |-
      Nguồn: đúng uid sn46.3, Pāli root bilara đã ghim; tầng Anh đã ghim là bản Bhikkhu Sujato cùng commit. Tầng Việt hiện hành không có cho bài này (snapshot upstream chỉ phân phối Pháp Cú) — đặc điểm của snapshot, không phải thiếu sót của repo.
      Coverage đo bằng đúng quy tắc trong source/layers.yaml: 34/34 segment có nội dung đều có tiếng Anh = 100%. Không có mất tầng tham khảo nào.
      Trùng nguyên văn: 5/40 khoá có Pāli trùng tuyệt đối với khoá đã dịch ở mn118 và sn48.66 — 4.2 với mn118:33.1, 5.2 với mn118:34.1, 6.2 với mn118:35.1, 7.2 với mn118:36.1, 9.2 với sn48.66:1.6; dùng lại nguyên văn bản Việt. Ngoài ra 9.3 và 9.4 có Pāli trùng sn48.66:1.7 và :1.8 (chỉ khác dấu chấm cuối) và cũng dùng lại nguyên văn.
      Tiền lệ đo được: `1. Pabbatavagga` → «1. Phẩm Núi» 7/7 bài đã dịch; `Sīlasutta` → «Kinh Giới» 5/5; danh sách bảy giác chi theo sn46.4:2.3 (cùng bộ, cùng phẩm Pabbatavagga), cùng cách đó có thêm ở an10.102:1.3 và an4.238:4.2; sáu bước của chuỗi bảy quả theo nguyên văn sn48.66:1.7–1.13.
      Bất định đã ghi, không giấu:
        1) Tên bảy giác chi: dùng «niệm giác chi, thẩm pháp giác chi, tinh tấn giác chi, hỷ giác chi, khinh an giác chi, định giác chi, xả giác chi» (sn46.4:2.3). Tầng còn có nhánh «giác chi niệm, giác chi trạch pháp, giác chi hỷ, giác chi khinh an, giác chi xả» (sn46.1:1.6–1.12, cùng phẩm Pabbatavagga) và «giác chi có nhớ tưởng / giác chi có bình thản» (sn46.5:1.6–1.7, sn46.31:2.2–2.3). Ba cách đều đã có trong tầng; chọn theo sn46.4 vì đó là danh sách được dùng thống nhất ở ba bài. Ghi ra đây vì đây là nguồn trôi dạt thật sự — người biên tập nên chọn một cách cho cả bộ rồi áp lại.
        2) `pavicinati pavicarati parivīmaṁsamāpajjati` (2.4, 3.1, 3.4) dịch «khảo sát, thẩm tra và bao quanh». Pāli gần nhất trong tầng (mn118:31.1, chỉ khác `pavicayati` và `parivīmaṁsaṁ āpajjati`) dịch «trạch pháp ấy bằng trí tuệ, thẩm sát, tầm cứu». Ba động từ Pāli là ba cấp độ của cùng một việc quét pháp; giữ cả ba bằng ba động từ tiếng Việt rõ nghĩa, không lược. Điểm chưa chắc: `parivīmaṁsamāpajjati` có thể đọc là «đi vòng quanh bao phủ» (nghĩa của `vīmaṃsā`) thay vì «bao quanh» — cùng nghĩa với nghĩa thứ nhất nên không thay đổi kết luận, nhưng ghi ra.
        3) `dhammavicaya` dịch «thẩm pháp» (theo sn46.4:2.3) chứ không phải «trạch pháp» (sn46.1:1.7, mn118) — hai từ dùng xen kẽ trong tầng, ghi để người biên tập gộp.
        4) `orambhāgiyānaṁ saṁyojanānaṁ` dịch «năm trói buộc phần dưới» theo nguyên văn sn48.66:1.9. Tầng còn có «năm kết trói buộc hạ giới» (an3.87:3.10) và «năm kiết sử phần dưới» (an7.16:3.2). Chọn sn48.66 vì đó là bài cùng danh sách bảy quả.
        5) Chuỗi `no ce … atha …` ở 9.5–9.9 là chuỗi tích lũy: mỗi khoá lặp lại toàn bộ các điều kiện đã nêu rồi thêm một điều kiện nữa. Giữ nguyên lặp (luật bảo toàn repetition), không nén, nên 9.9 dài nhất trong bài. Đây là độ dài do Pāli quyết định, không phải lỗi văn phong.
        6) 1.8 `dvayena vūpakāsena vūpakaṭṭho viharati — kāyavūpakāsena ca cittavūpakāsena ca` dịch «sống tách biệt theo hai phép — theo phép tách biệt về thân và theo phép tách biệt về tâm». `vūpakaṭṭha` ở đây không phải «một mình» như trong an5.56/sn22.63 mà là «ở nơi tách biệt» — giữ đúng sắc thái để không trộn hai nghĩa của cùng một từ.
      Dấu lược: bài này Pāli KHÔNG có `…pe…`; bản Việt cũng không thêm dấu lược nào. Các khoá bị rút gọn trong bài chỉ là khoá đánh số (`Tatiyaṁ.`) và khoá tiêu đề.
      Kiểm tra: `_hvi.py` bắt được 0 lỗi (40/40 khoá, NFC, ngoặc kép cân trên cả bài — cặp nháy kép duy nhất là 1.1 mở và 9.10 đóng, đúng như Pāli, không trùng nguyên văn Pāli ở khoá có nội dung, không lọt Pāli). Lượt review đối kháng bắt được hai lỗi thật ở bản nháp đầu: `vimuttiñāṇadassanasampannā` bị dịch «thắng tri về giải thoát» (đã sửa thành «tri kiến giải thoát» theo iti104:2.1), và 1.8 dịch vụng «sống tách biệt bằng cả hai» (đã sửa). Cả 40 khoá đã in ra đọc từng cặp.

