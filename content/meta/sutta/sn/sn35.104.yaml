notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    **Mười bài anh em đã `published` có cùng Pāli hoặc cùng khung**, và bản Việt dùng lại **nguyên văn** của chúng: `sn22.111`/`sn22.112` (đúng Pāli `sn23.9`/`sn23.10`) · `sn29.10` (khung dāna-khetta, `sn29.3`/`sn29.11-20`) · `sn29.6` (`vossaṭṭhakāyā`) · `sn34.1` (khung bốn loại người tu định, `sn34.55`) · `sn34.6`/`sn34.7`/`sn34.15` (`gocarakusalo`, `abhinīhārakusalo`) · `sn34.53`/`sn34.54` (`sakkaccakārī`, `sātaccakārī`, `sappāyakārī`) · `sn35.78` (`anattā … chando pahātabbo`, `sn35.164`) · `sn35.166` (`kathaṁ nu kho, bhante, jānato …`, `sn35.165`/`sn35.167`) · `sn36.24`/`sn36.26` (cụm cảm thọ, `sn36.23`) · `sn38.8` (khung hỏi–đáp với Sāriputta, `sn38.2`/`sn38.4`/`sn38.7`) · `sn23.11` (`Nibbindaṁ virajjati…`, `sn35.60`) · `sn48.47` (`'khīṇā jāti…'`) · `sn45.42-47` (câu hỏi `samaṇe gotame`, `sn38.4`). **Những chỗ viết khác đều ghi rõ trong `notes` của từng bài.**
  - >-
    **Danh sách song song trong lát này đã bị lệch một chỗ và đã sửa** — ghi lại vì đó là loại lỗi mà máy không bắt được: ba danh sách được sinh bằng vòng lặp (mười món cho ở `sn29.11-20`, chín loại hương ở `sn31.4-12`, mười món cho ở `sn31.23-112`). Một `range` lệch một đơn vị làm **cả danh sách** dịch sai từ đó trở đi mà vẫn qua mọi chốt tự động. Đã đối chiếp từng khoá với Pāli sau khi sửa.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên **49.374 segment đã `published`**: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Khớp **49.179 / 49.374 = 99,14%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ (`hay` được miễn vì `vā…vā…vā` là cấu trúc).
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Sn 45–56 đã đủ: `Paṭhamamāravagga` → *1. Phẩm Ma Rối Lần Nhất* (`sn23.8`) · `Nāgavagga` → *1. Phẩm Rồng* (`sn29.1/10`) · `Supaṇṇavagga` → *1. Phẩm Kim Sí Điểu* (5 bài; `sn30.1` ghi *Phẩm Rồng* — **lệch**) · `Gandhabbavagga` → *1. Phẩm Càn-thát-bà* (3 bài) · `Jhānavagga` → *1. Phẩm Thiền Định* (`sn34.1`) · `Avijjāvagga` → *6. Phẩm Vô Minh* (`sn35.59`) · `Channavagga` → *9. Phẩm Channa* · `Yogakkhemivagga` → *11. Phẩm An Ổn Khỏi Ách* · `Navapurāṇavagga` → *15. Phẩm Cũ Mới* · `Nandikkhayavagga` → *16. Phẩm Đoạn Tận Hoan Hỷ* · `Devadahavagga` → *14. Phẩm Devadaha* · `Jambukhādakavagga` → *1. Phẩm Jambukhádaka*. **Ba phẩm 0 tiền lệ:** `Lokakāmaguṇavagga` → *12. Phẩm Dục Thuộc Thế Gian* · `Samuddavagga` → *18. Phẩm Biển* · `Khandhavagga` → *Phẩm Uẩn* (chỉ xuất hiện ở uddāna `sn34.55`). **Chỗ đang phân kỳ trong kho:** `Aṭṭhasatapariyāyavagga` — `sn36.28` ghi *Bát Pháp Chân Đắc*, `sn36.24/25/26` ghi *Một Trăm Linh Tám Cách*, `sn36.29/30` ghi *Tám Trăm Lần*; bài này theo `sn36.28` vì cùng nhóm số thứ tự. **Người biên tập nên thống nhất.**
  - >-
    **0 tiền lệ cho danh sách trung tâm của bài**, xuất hiện lại ở `sn35.122/123/229` trong cùng lát: `cakkhuviññeyyā rūpā iṭṭhā kantā manāpā piyarūpā kāmūpasaṁhitā rajanīyā` → *có thể nhận biết, đáng ưa, lấy lòng, khớp lòng, có dáng vẻ đẹp, phù hợp với ham muốn, quyến rũ* (Sujato *attractive, desirable, pleasant, agreeable, of a pleasing shape, matching lust, alluring*). **Bốn bài trong lát này dùng chung đúng một cách dịch** cho cụm này.
  - >-
    Tên phẩm `Yogakkhemivagga` → *11. Phẩm An Ổn Khỏi Ách* (`sn35.110/111*`); `akkhāsi yogaṁ` → *đã chỉ bày hạnh pháp*.
  - >-
    Hai vế `1.7` và `1.10` là **cùng một câu** với danh từ khác nhau (sắc / pháp) — bản Việt viết giống hệt chỉ thay danh từ, và `1.7` có `…pe…` còn `1.10` không nên phải lệch dấu lược.
  - >-
    **Kiểm toán độc lập 2026-10-12** (thay các mục cũ nói về `akkhāsi yogaṁ` → *đã chỉ bày hạnh pháp*, về cách dịch danh sách *đáng ưa, lấy lòng, khớp lòng, có dáng vẻ đẹp, phù hợp với ham muốn, quyến rũ* và về "Bốn bài dùng chung một cách dịch" — những mục đó mô tả bản cũ đã bị sửa). Đọc đối kháng từng khoá với Pāli và Sujato đã ghim; sửa 9/15 khoá. (1) **`tathāgato` bị dịch hỏng thành "Tứ Thế Tôn"** ở `1.6`, `1.7`, `1.9`, `1.10` (6 chỗ) → *Như Lai* theo glossary (`tathāgata`) và `sn44.1`. (2) **`cakkhuviññeyyā … rajanīyā`** ở `1.5`/`1.8`: bản cũ lặp thừa "có thể nhận biết có thể nhận biết" (tạo ra khi ghép *do mắt nhận biết* với *có thể nhận biết*), thêm "Có," đầu câu, và dùng cụm *lấy lòng, khớp lòng, có dáng vẻ đẹp, phù hợp với ham muốn* (kāmūpasaṁhitā bị đọc thành "phù hợp với ham muốn" — sai quan hệ: *liên hệ đến dục*). Sửa theo cách dịch đa số của tầng cho đúng chuỗi Pāli này (`mn80`, `mn145`, `sn35.88`, `mnd2`, `cnd23`: *do mắt nhận biết, đáng ưa, đáng thích, dễ chịu, hấp dẫn, liên hệ đến dục và khơi dậy ham muốn*); chuỗi cũ chỉ còn ở 4 bài sn35 cùng lát (`sn35.119`, `sn35.122`, `sn35.123`, `sn35.229`) — các bài đó chưa được sửa ở lượt này. (3) **`yogakkhemipariyāyaṁ dhammapariyāyaṁ`** ở `1.2`/`1.4`/`1.11`: bản cũ dịch "pháp về sự an ổn khỏi ách" (đối tượng của bài giảng bị đọc thành *trạng thái*), trong khi `1.7` cho thấy bài giảng là cách Như Lai được gọi là *yogakkhemī*; Sujato cũng đọc là "explanation of one who has found sanctuary". Sửa thành *bài pháp về bậc an ổn khỏi ách, một pháp môn về Pháp* (theo khuôn `sn35.235`), thêm *cho các ông* (`vo`, bị bỏ sót ở `1.2`) và *Và* (`ca`) ở `1.4`. (4) **`akkhāsi yogaṁ`**: bản cũ "hạnh pháp" là chữ không có căn cứ trong Pāli; `yoga` ở đây là hapax toàn sn (không có tiền lệ), nghĩa *sự gắn bó/chuyên cần (tu tập)* đối lập với *ách* ở `yogakkhemī`; Sujato "yoking oneself to meditation". Viết *sự chuyên cần tu tập* — **bất định còn lại**: chữ "tu tập" theo cách đọc của Sujato, Pāli chỉ nói `yogaṁ`. (5) `pahīnā` → *từ bỏ* (bản cũ "xa lìa", lệch `pahānāya` ở `1.7` và tiền lệ `sn54.12`); `1.6`=`1.9` là cùng Pāli nguyên văn nên dùng cùng một câu *Những thứ ấy*. Điểm: `semantic_fidelity` 9.4→8.9, `grammar_logic` 9.3→9.2, `terminology` 9.2→9.0, `triangulation` 9.2→9.0, `vietnamese_clarity` 9.3→9.2, `ambiguity_integrity` 9.4→9.0, `technical_integrity` 10.0→9.6; `final_score` 9.47→9.28 (vẫn trên 9.0, không blocker). Không đổi: tên phẩm/tên kinh (*Phẩm/Kinh An Ổn Khỏi Ách*, theo tiền lệ cùng phẩm), `Tại Sāvatthī.` (435/444 trong tầng), `manāpā` → *dễ chịu* (theo đa số dù không sát nhất).
