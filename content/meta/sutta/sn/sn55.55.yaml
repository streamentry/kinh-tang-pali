notes:
  - >-
    **Dùng lại nguyên văn đã `published`:** `Sappurisasaṁsevo,
    saddhammassavanaṁ, yonisomanasikāro, dhammānudhammappaṭipatti` → *Sự phục sự
    thiện nhân, sự nghe Chánh Pháp, sự tác ý hợp lý, và thực hành theo pháp hợp
    pháp* (`an4.248:1.3`) cho `sn55.55:1.3` và `sn55.62:1.3` — **cùng Pāli** ·
    `pathavīdhātu … vāyodhātu` → *giới tánh đất, giới tánh nước, giới tánh lửa,
    giới tánh gió* (`an3.61:10.5`) cho `sn14.30:1.4` — bản đầy đủ của `an3.61`
    có **sáu** sở, kho lấy đúng bốn sở đầu · `chavi / maṁsaṁ nhāru aṭṭhi
    aṭṭhimiñja` → *da; thịt, gân, xương, tủy xương* (`an10.60:6.3`) cho
    `sn17.28:1.3` · `upādānakkhandha` → *uẩn của sự tham trữ* (`an10.60:4.4`) ·
    `lābhasakkārasiloka` → *sự được cho, được tôn kính và danh tiếng*
    (`an4.157:2.4`) · `abhibhūto` → *chế phục* (`an3.53:2.1`) · `niyato
    sambodhiparāyaṇo` + `avinipātadhammo` → *là hướng chắc chắn đến giác ngộ* +
    *có pháp không còn thoát lui* (PR #118 `sn55.29:1.3`) cho `sn48.26:1.5` ·
    `ariyasāvako sotāpanno` cho cùng chỗ · `mātugāmo` → *thân người* (PR #120) ·
    `pāṇātipātā paṭivirato …` → *kiêng tránh sát sinh…* (`an10.178:3.2`) và
    `surāmerayamajjappamādaṭṭhāna` → *chỗ ngồi giữa rượu, thịt, tửu và say*
    (`sn56.64:1.1`) cho `sn37.33:1.3` · `pariyesanā` → *sự tìm kiếm*
    (`an4.255:0.3`) · `paṭikuṭṭha` → *đáng chê* (`an4.29:1.3`) · `anusaya` →
    *thiên hướng* (PR #116) cho `sn45.175` · năm lậu (PR #121 `sn46.35:1.1`) cho
    `sn45.177` · `satisambojjhaṅgo … upekkhāsambojjhaṅgo` → *giác chi có nhớ
    tưởng … giác chi có bình thản* (PR #120) cho `sn46.9`, `sn46.19`, `sn46.22`,
    `sn46.34`, `sn46.36` · `nimuggaṁ` → *bị mắc kẹt* (PR #120) · `kassapassa
    sammāsambuddhassa pāvacane` → *hàng giảng pháp của bậc Chánh Đẳng Giác
    Kassapa* (PR #122) · `Gijjhakūṭa` (PR #120) · `sattā opapātikā` → *chúng
    sinh hóa sinh* (`an10.211:11.1`) · `Ekakanipāta` → *Bộ Một Bài Kinh*
    (`thag1.2:0.2`) · `Namo tassa Bhagavato …` → *Kính lạ Đức Thế Tôn…*.
  - >-
    **`sn37.6`–`sn37.13` là tám bài chuỗi lặp, khác nhau ở ĐÚNG MỘT vế của `1.3`
    và ở hình dạng lược.** Tôi dựng từng vế riêng, không dùng chung một danh
    sách — đây là lần thứ sáu cùng lớp lỗi được kiểm.
  - >-
    **Ba hình dạng lược, không phải hai:** `sn37.6`/`7` **không** có `…pe…`;
    `sn37.9` và `sn37.12` có `…pe…` nhưng vẫn còn vế `apāyaṁ duggatiṁ vinipātaṁ
    nirayaṁ upapajjati`; `sn37.10`/`11`/`13` lược tới mức chỉ còn `nirayaṁ
    upapajjati`. Bản đầu tôi xếp `sn37.12` vào nhóm “không lược” cùng
    `sn37.6`/`7` — sai. Đã sửa. Ở `sn37.9:1.4` chỉ còn `upapajjati` nên tôi dịch
    *sinh ra* chứ không kéo theo *địa ngục*.
  - >-
    `dussīlo` → *không có giới* (đa số kho: `an4.229:1.1`, `an4.109:2.2`;
    `an10.75:9.3` dùng *mất giới*) · `appassuto` → *ít học* · `kusīto` → *lười
    nhác* · `muṭṭhassati` → *thất niệm* (bốn vế đầu dùng lại nguyên văn
    `an4.202:2.2`) · `issukī` → *ganh tị* (`dhp262:4`, `an4.80:2.3`;
    `an3.10:1.4` dùng *ganh ghét*) · `duppañño` → *kém tuệ* (`an4.192:8.4` dùng
    *thiếu trí*) · `upanāhī` → *gây hại* (0 tiền lệ) — **năm cách dịch 0 tiền
    lệ, đặt mới; mỗi cách đều có tiền lệ cạnh tranh đã ghi.**
  - >-
    `sn37.16:1.3` — bảy vế dương: `hirimā`/`ottappī` → *biết hổ thẹn / biết sợ
    hối* (0 tiền lệ ở dạng khẳng định; chương 8 chỉ có dạng phủ định) ·
    `anupanāhī` → *không gây hại*.
  - >-
    `sn45.165`–`sn45.177` — cùng vế kết `abhiññāya pariññāya parikkhayāya
    pahānāya …pe… ayaṁ ariyo aṭṭhaṅgiko maggo bhāvetabbo`. Bản Anh Sujato dịch
    vế lược thành **bốn** mục, không mở rộng, nên tôi dịch *để chứng ngộ, để
    hoàn toàn hiểu rõ, để đoạn tận, để từ bỏ*. (Khác `sn45.163:1.5` — đã
    `published` — nơi `…pe…` mở rộng ba lậu thành chín mục.) `dukkhadukkhatā` →
    *khổ vì khổ* · `saṅkhāradukkhatā` → *khổ vì tích tụ* · `vipariṇāmadukkhatā`
    → *khổ vì biến đổi* (0 tiền lệ) · `ariyo aṭṭhaṅgiko maggo` → *bát chánh đạo*
    (theo `sn45.163:1.5`; `an3.61:17.2` dùng *bát thánh đạo*) ·
    `idaṁsaccābhiniveso` → *ý chấp thật là như vậy* (0 tiền lệ).
  - >-
    `sn46.9`/`19`/`22`/`34`/`36` — năm bài về bảy giác chi, mỗi bài một mệnh đề:
    *chưa sinh thì sinh khởi* (chỉ khi Đức Phật xuất hiện) · *là bậc Thánh, dẫn
    đến điều quyết định* · *giảng bảy giác chi* (hình dạng sáu khoá: mở, “hãy
    nghe”, hỏi, đáp, đóng, số thứ tự) · *không chướng ngại, không bị chướng
    ngại, tâm không bị ô nhiễm* · *trí tuệ không còn thoát lui*. `niyyānika` →
    *dẫn đến điều quyết định* · `anāvaraṇa`/`anīvaraṇa` → *không chướng ngại /
    không bị chướng ngại* · `cetaso anupakkilesa` → *tâm không bị ô nhiễm* ·
    `vijjāvimuttiphalasacchikiriyāya` → *sự chứng ngộ quả giải thoát tri thức* —
    0 tiền lệ. `an46.36:1.3` kết bằng `.` (khác bốn bài kia kết `—`) — theo đúng
    Pāli từng bài.
  - >-
    `sn48.26` — `Yato kho … pajānāti` dùng lại nguyên văn `sn17.26:1.2` (PR
    #121) cho sáu căn; `sn48.61:1.4` dùng lại *Tín căn … tuệ căn—* (PR #118) ·
    `cakkhundriya … manindriya` → *nhãn căn … tâm căn*.
  - >-
    `sn55.55`/`sn55.62` — cùng bốn mục, chỉ khác mệnh đề: *chứng ngộ quả bậc
    Nhập lưu* (PR #122) và *chỗ trí tuệ lớn* (`mahāpaññatāya`, 0 tiền lệ).
