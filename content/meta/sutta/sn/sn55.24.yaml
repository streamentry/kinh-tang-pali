notes: |-
  Đợt 19, làn 22. Dịch trọn 78/78 khoá từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt Hòa thượng Thích Minh Châu nguyên bài ở mục Tra cứu toàn văn (không phân đoạn nên không căn lề theo từng khoá). Không có khoá nào ngoài tập khoá Pāli.

  **Coverage tầng Anh trên Pāli có nội dung: Sujato 37/48 = 0.771** (dưới sàn 0.80). Sujato để trống 17 khoá, trong đó 11 khoá có nội dung (1.10, 2.2, 2.4, 2.5, 2.6, 2.10, 2.11, 4.2, 5.2, 6.2, 7.2) và 6 khoá dưới 40 ký tự (1.9, 2.3, 2.7, 2.8, 2.9, 9.12). Lớp english-project của bài này đã published và phủ đủ 17 khoá, nên cổng tính 48/48; nhưng lớp ấy do cùng một tác giả với bản Việt (assessed_by trùng) nên không phải bản đọc Anh độc lập và bản Việt này không tuyên bố đã đối chiếu English độc lập cho 11 khoá đó. Phần trống ấy dựa vào Pāli, các khoá cùng Pāli ở nơi khác trong bài và bản Thích Minh Châu. Vì vậy triangulation 7.5 và bài giữ draft kèm blocker nêu ở blocking_errors, đúng như đã làm với sn22.7. Reference-gaps chưa có mục cho bài này, và dù có mục cũng không cứu được published. Sujato lệch Pāli ở các chỗ đã nêu: 1.8 gộp vế *so bhagavatā byākato* của 1.9 vào một câu, 2.1 thêm vế *told him what had happened* mà Pāli không có, 8.2 và 8.3 bỏ phủ định *na*.

  **Pāli trùng nguyên văn trong chính bài: 16 nhóm / 36 cặp**, cả 36 cặp đều dùng lại nguyên văn bản Việt (0 cặp khác). Chỗ Pāli chỉ khác dấu nháy (1.4/2.4, 1.10/2.4/2.10) bản Việt chỉ khác dấu nháy; 9.4 khác 8.4 chỉ ở dấu phẩy cuối; 8.1/9.1 trùng. Cặp gần trùng nhưng khác chữ hoa (4.3/7.3 *Dhamme*/*dhamme*) bản Việt khác ở chữ hoa và dấu `;` ở 7.2 (Pāli 7.2 kết `;`, các khoá 4.2/5.2/6.2 kết `.`). **Trùng nguyên văn với bài khác trong tầng: 12 khoá dò được, 5 khoá bản Việt khác có chủ ý**: 1.6 (tầng có 11 khoá Pāli y hệt nhưng viết khác nhau, từ *Thật vi diệu thay* đến *Ôi, kỳ diệu thay*; bản này giữ cả hai vế *bho* thành *này các bạn*), 4.6 (6 khoá trùng, có bài viết *giải thoát tâm không lậu hoặc*, bản này theo sn55.8 *tâm giải thoát vô lậu, tuệ giải thoát vô lậu*), 5.6 và 6.6 (trùng với an3.86 *kết trói buộc hạ giới*, *bậc Nhất lai* khác sn55.3, sn55.8, sn55.10 *hạ phần kiết sử*, *được hóa sinh, nhập Niết-bàn tại đấy, không còn trở lui từ cảnh giới ấy*; bản này theo cụm sn55 vì ba bài anh em cùng bộ và đo thấy *hạ phần kiết sử* 58 khoá so với *kết trói buộc hạ* 16 khoá toàn tầng), 7.2 (Pāli kết `;`, tầng chỉ có sn55.44:2.3 trùng và dịch khác văn cảnh). 7 khoá còn lại trùng với bài khác (kể cả 2.1 với sn55.21:1.3) bản Việt giống nguyên văn.

  **Số Pāli.** pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ (5.6) = năm hạ phần kiết sử (pañca 5); tiṇṇaṁ saṁyojanānaṁ (6.6, 7.6) = ba kiết sử (tiṇṇaṁ 3); danh sách căn ở 8.6 và 9.6 có đúng năm mục: tín, tinh tấn, niệm, định, tuệ (saddhā, vīriya, sati, samādhi, paññā). Bài chia sáu hạng người (4.1, 5.1, 6.1, 7.1, 8.1, 9.1): bốn hạng đầu *parimutto* (thoát khỏi), hai hạng sau *agantā* (không đi đến). Không có số khác.

  **Thuật ngữ, theo tiền lệ đã đo.** *nhập lưu, không rơi vào ác đạo, chắc chắn, hướng về giác ngộ* (sotāpanna avinipātadhamma niyata sambodhiparāyaṇa) theo sn55.2, sn55.8, sn55.23. *niềm tín xác quyết* (aveccappasāda) theo sn55.21, sn55.22, sn55.23 (cụm *đầy đủ niềm tín xác quyết nơi Đức Phật* theo sn55.23); sn55.3 và sn55.8 dùng *lòng tịnh tín bất động*, chọn dạng khớp ba bài liền kề. *đã qua đời* (kālaṅkato): 12/12 khoá sn55 (toàn tầng *qua đời* 81 so với *mệnh chung* 24). *Lúc bấy giờ* (tena kho pana samayena): 60 khoá trong sn so với 1 khoá *vào lúc ấy*. *nam cư sĩ* (upāsako): trong sn có 28 khoá (7 tệp) viết *nam cư sĩ* và 14 khoá viết *người cư sĩ*, còn lại *cư sĩ* trần; theo sn55.3, sn55.8, sn55.10. *quy y* (saraṇaṁ gato): 58 khoá, 0 dạng khác. *đã lâu ngày* (dīgharattaṁ) theo Thích Minh Châu; toàn tầng *lâu dài* 61 tệp, *từ lâu* 22 tệp, *lâu ngày* 7 tệp, nhưng *lâu dài* là nghĩa dīgharattaṁ hitāya sukhāya, khác nghĩa. *chân chánh* (sammā vadamāno vadeyya) theo sn16.8, sn21.1, sn35.103. *phàn nàn, chê trách, bực bội* (ujjhāyanti khīyanti vipācenti): tầng có hai dạng, *xúc phạm, chê trách, bực bội* ở sn11.14 và sn11.22 (5 khoá) và *tức giận, phàn nàn, bất mãn* ở sn6.14 (3 khoá); *xúc phạm* nghĩa hẹp (offend) so với *ujjhāyati* (chỉ trích, kêu ca) nên lấy *phàn nàn* của sn6.14 ghép *chê trách, bực bội* của sn11. *tụ họp lại* (saṅgamma samāgamma) theo sn41.10, sn42.6. *sự suy yếu trong sự tu học* (sikkhādubbalya) theo an5.75, an5.76 (18 khoá có sikkhādubbalya: *suy yếu* 17 khoá / 2 tệp, *yếu kém* 1 khoá / 1 tệp). *một hạng người* (ekacco puggalo) theo mn70 (trong sn 4 khoá / 1 tệp cùng dạng); an4.97 viết *một cá nhân*. *hạ phần kiết sử* 58 khoá so với *kết trói buộc hạ* 16 khoá; *kiết sử* theo sn55.8, sn55.10. *được hóa sinh, nhập Niết-bàn tại đấy, không còn trở lui từ cảnh giới ấy* theo sn55.3, sn55.8, sn55.10. *nhất lai* theo sn55.8 (viết thường). *suy giảm* (tanuttā) so với *muội lược* ở sn55.8: toàn tầng *suy giảm* 5 tệp, *suy yếu* 4, *làm mỏng* 3, *muội lược* 3 (cả ba đều thuộc sn); chọn *suy giảm* vì *muội lược* là Hán–Việt cổ không thêm chính xác. *thoát khỏi* (parimutto) theo sn55.1 để tránh trùng *giải thoát* đã dùng cho vimutti ở 4.5. *loài bàng sanh* theo sn55.1 (toàn tầng *súc sinh* 30 tệp, *bàng sanh* 6, *súc sanh* 8, *bàng sinh* 3; trong sn *bàng sanh* 6 tệp thắng). *cõi ngạ quỷ* 11 tệp, *ngạ quỷ* 17 tệp. *cõi dữ, ác thú, đọa xứ* (apāyaduggativinipāta): dạng ba vế này thắng ở an5.213, iti81, sn17.10, sn3.21, an6.57 (khoảng 40 khoá), còn sn55.1 gộp thành *ác đạo* và an9.12 viết *đoạ xứ ác thú*; chọn ba vế để giữ đủ ba thành tố Pāli, còn *vinipāta* đứng riêng trong *avinipātadhamma* (1.4, 7.6, 9.9) và *vinipātaṁ gaccheyya* (3.1, 3.5) vẫn là *ác đạo* theo sn55. *tín căn, tinh tấn căn, niệm căn, định căn, tuệ căn* theo sn48.1 đến sn48.6. *chấp nhận* (khamanti) theo sn25.1, sn25.2, mn70. *một mức độ niềm tin và lòng thương kính* (saddhāmattaṁ pemamattaṁ) theo mn22:47.2. *cây sa-la lớn* (mahāsālā) theo an3.48, an4.193. *huống chi là* (kimaṅgaṁ pana) theo dn14:2.16.5. *thọ trì* (samādiyī) 45 khoá so với *thọ* 52 khoá. *Phẩm Quy Y*, *Tại Kapilavatthu*, *Đối với Pháp …*, *Đối với Tăng …* theo sn55.21, sn55.23. *người Sakka* theo sn55.21, sn55.22, sn55.23 (sn55.37 dùng *Thích-ca*). Tên Saraṇāni giữ đúng Pāli root, không theo Sujato *Sarakāni* (Thích Minh Châu viết *Sarakàni, hay Saranàni*).

  **Dấu nháy.** Mỗi khoá khớp Pāli. Nháy kép mở ở 1.4, 1.6, 2.2, 3.1 và đóng ở 1.4, 1.11, 2.11, 9.11; nháy đơn mở và đóng trong cùng khoá ở 1.10, 2.4, 2.10, 3.3 (mở và đóng), 9.9 (mở ở giữa khoá, đóng ở cuối). Pāli 2.5 kết bằng *—*, bản Việt giữ. 7.2 kết `;`, bản Việt giữ `;`.

  **Dấu lược.** Pāli …pe… ở 4.2, 4.3, 4.4, 5.2, 5.3, 5.4, 6.2, 6.3, 6.4, 7.2, 7.3, 7.4, 8.2, 8.3, 9.2, 9.3, 9.6: mỗi khoá bản Việt giữ đúng một …. Pāli kết bằng … trần ở 8.1 và 9.1 (lược sau *hoti*, trước khi sang khoá kế): bản Việt kết bằng … trần theo Pāli. Không có (…) trần ở bài này; không khoá nào Pāli lược mà Việt viết đủ.

  **Bất định (1) — 1.11 và 2.11, majjapānaṁ apāyī.** *apāyī* là aorist của *pivati*, nghĩa đen *đã uống*. Sujato dịch *he used to drink liquor* (thói quen), Thích Minh Châu gộp thành *đã phạm giới và uống rượu*. Bản Việt giữ aorist: *đã uống rượu*, không thêm nghĩa thói quen mà Pāli không nói. *Sikkhādubbalyamāpādi* (*āpajjati*, rơi vào) dịch *đã rơi vào sự suy yếu trong sự tu học*; kinh không nói đó là phạm giới nào.

  **Bất định (2) — 9.11, maraṇakāle sikkhaṁ samādiyī.** Pāli là *vào lúc chết (lâm chung)* Saraṇāni *đã thọ trì sự học*. Sujato: *undertook the training at the time of his death*; Thích Minh Châu: *sau khi mệnh chung, đã chấp nhận học giới* (đọc *maraṇakāle* thành *sau khi mệnh chung*, lệch khỏi Pāli). Bản Việt theo Pāli và Sujato: *vào lúc lâm chung*; chữ *sikkhā* giữ nghĩa rộng *sự tu học* như ở 1.11, không dịch thành *học giới* hay *năm giới* vì Pāli không nói. Điều này không mâu thuẫn với 1.11 (đã rơi vào yếu kém, đã uống rượu): hai khoá nói hai thời điểm khác nhau, và 9.9 đến 9.11 là lời đáp cho lời chê của người Sakka. Chưa phân xử được *sikkhā* chỉ giới nào cụ thể.

  **Bất định (3) — 1.8 và 2.8, yatra hi nāma.** Chỉ cấu trúc *hi nāma* nêu ngạc nhiên hay lý do (*vì … mà …*). Sujato gộp 1.8 và 1.9 thành một câu *For the Buddha even declared…* làm vế *so bhagavatā byākato:* mất; bản Việt giữ hai khoá riêng *Vì Saraṇāni … đã qua đời; vị ấy được Thế Tôn tuyên bố:* và không thêm *ngay cả*, *lại* mà Pāli không có. Tầng không có tiền lệ cho *yatra hi nāma* kèm *kālaṅkato* (0 khoá).

  **Bất định (4) — 8.8 và 9.8, agantā.** Danh từ tác nhân phủ định (a + gantā), nghĩa đen *người không đi đến / sẽ không đi đến*. Sujato dịch thì hiện tại (*doesn't go*), Thích Minh Châu *không đi đến*. Bản Việt theo hai bản tham khảo, không thêm *sẽ*; chưa phân xử được sắc thái thời. Tầng không có tiền lệ (2 khoá khác không cùng từ).

  **Bất định (5) — hāsapañña, javanapañña.** *trí tuệ hoan hỷ* theo sn8.7, dn30 và Thích Minh Châu (2 tệp, thêm *hỷ trí tuệ* ở mn111), còn sn2.29 viết *trí tuệ thông sáng* (1 tệp, 4 khoá); Sujato *laughing wisdom*. *mau lẹ* (javana): sn2.29 và mn111 (2 tệp) so với *nhanh nhạy* và *nhanh* mỗi dạng 1 tệp. Chọn *hoan hỷ* và *mau lẹ* theo số tệp và theo bản tham khảo, ghi rõ chưa có chứng cứ chắc nghĩa của hāsa trong ngữ cảnh này.

  **Bất định (6) — 8.1/9.1 na heva kho và 8.2/8.3/9.2/9.3 na.** *na heva kho* là cấu trúc nhấn phủ định; không dịch riêng (Sujato, Thích Minh Châu cũng không). *na dhamme …pe…* và *na saṅghe …pe…* giữ phủ định thành *Không đối với Pháp …*, *Không đối với Tăng …*; Sujato bỏ *na* (nén phủ định) nên ở những khoá này Sujato không dùng để đối chiếu phủ định.

  **Bất định (7) — 8.7, mattaso nijjhānaṁ khamanti.** Tầng có 4 khoá cùng cụm này viết khác nhau (sn25.1, sn25.2, sn25.10, mn70:20.2). Chọn *chấp nhận sau khi dùng trí tuệ suy xét ở một mức độ nào đó*, giữ cả *mattaso* (mức độ) lẫn *nijjhāna* (suy xét), theo sn25.1 và mn70.

  **Khác kho có chủ ý.** *Saṁyutta Nikāya* giữ nguyên ở khoá :0.1 như các bài sn55 anh em. Số Pāli ở trên được tự tính, không chép từ bản dựa.

