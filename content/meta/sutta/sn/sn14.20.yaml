notes: |-
  Bản dịch tiếng Việt mới cho bài kinh sn14.20.

  Sự tụ hội theo giới (khuynh hướng tự nhiên) giữa người không tàm quý và người có tàm quý.

  Đối chiếu Pāli root và bản Anh Sujato tham khảo.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.2, 2.2, 3.2 (và toàn bộ các khoá còn lại của bài) —
  ‘hòa nhập và gặp gỡ’ → ‘hòa hợp và tụ hội’ (dạng đa số: ‘hòa hợp và tụ hội’ 241 lần so với 11 lần còn
  lại ở các bài khác; 12/18 khoá trùng ở 1.2); 1.2 ‘Này các tỳ-kheo, các chúng sinh hòa nhập và gặp gỡ
  nhau theo các giới (khuynh hướng tự nhiên):’ → ‘Này các tỳ-kheo, do giới tánh mà các chúng sinh hòa
  hợp và tụ hội.’ (bỏ phần ngoặc giải thích ‘khuynh hướng tự nhiên’ không có trong Pāli; Pāli kết bằng
  dấu chấm). Giữ ‘người an trú chánh niệm’, ‘người có trí tuệ’ ở 3.5 (cùng nghĩa với dạng đa số).
