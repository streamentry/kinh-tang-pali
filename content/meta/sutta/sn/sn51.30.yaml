notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `3. Ayoguḷavagga` → «3. Phẩm Ayoguḷa». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.2 — *… cho đến điều phục thân có quyền năng lên đến tận cõi Phạm thiên* → *… cho đến cõi Phạm thiên, vị ấy dùng thân tự tại* (`kāyena vasaṁ vatteti` là dùng thân làm chủ, tự tại, không phải «điều phục thân»; khớp cách dịch đa số của công thức); giữ nguyên khoá 3.2, 4.2, 5.1, 5.4 vì bản hiện tại đúng Pāli (*dục định và tinh cần hành* là cách dịch truyền thống của `chandasamādhippadhānasaṅkhāra`, sát hơn bản đa số *sự chuyên cần về ham muốn và định*).
