  0.1 giữ nguyên Saṁyutta Nikāya 55.66; 0.2 7. Phẩm Đại Tuệ theo sn55.62:0.2.
  1.1 theo khung sn55.74:1.1, giữ dấu lược đầu như Pāli, đưa đến chỗ tuệ.
  appamatta thành không buông lung là đặt mới, 0 tiền lệ cho paññā trong kho.
  Lý do: Pāli ở đây là a cộng pamatta, nghĩa không buông lung, tinh cần trên
  chánh, hợp chuỗi tính từ khuếch đại tuệ. Sujato đọc Extraordinary ở nhan đề
  và unrivaled ở thân, uddāna sn55.74:2.2 đọc vô lượng; cả hai đều lệch chữ
  Pāli nên Pāli thắng theo thứ bậc nguồn, đã ghi bất đồng ở đây.
  1.2 Pañcamaṁ thành Thứ năm, đúng thứ tự sau Catutthaṁ ở sn55.65.
  Tầng Anh Sujato để trống 1.2 (từ đánh số thứ tự dưới 40 ký tự, không phải
  đoạn nội dung), đã dịch trực tiếp từ Pāli, không mở rộng dấu lược.
