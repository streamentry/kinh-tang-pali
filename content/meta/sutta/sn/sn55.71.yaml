  0.1 giữ nguyên Saṁyutta Nikāya 55.71; 0.2 7. Phẩm Đại Tuệ theo sn55.62:0.2.
  1.1 theo khung sn55.74:1.1, giữ dấu lược đầu như Pāli, đưa đến chỗ tuệ.
  hāsa thành hoan hỷ theo sn8.7:3.2, nơi hāsapañño được dịch trí tuệ hoan hỷ,
  khớp Sujato Laughing và nghĩa đen vui mừng của hāsa. Kho còn hai cách đọc
  khác đã publish là dn30:1.26.6 nhanh nhẹn và sn2.29:5.4 thông sáng, cùng
  uddāna sn55.74:2.3 dứt khoát; cả ba đều lệch chữ Pāli nên theo sn8.7, là
  tiền lệ cùng Tương Ưng Bộ và liệt kê đúng sáu tính từ paññā, đã ghi ở đây.
  1.2 Dasamaṁ thành Thứ mười, đúng thứ tự sau Navamaṁ ở sn55.70.
  Tầng Anh Sujato để trống 1.2 (từ đánh số thứ tự dưới 40 ký tự, không phải
  đoạn nội dung), đã dịch trực tiếp từ Pāli, không mở rộng dấu lược.
