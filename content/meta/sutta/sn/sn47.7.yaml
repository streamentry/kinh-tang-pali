notes: |-
  Không có tầng Việt hiện hành để đối chiếu. Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Tầng đối chiếu còn lại là Pāli root và bản Anh Sujato đã ghim. budsas.org chỉ là tham khảo toàn văn, không cấp text cho tầng nào.
  Dấu lược theo đúng luật của tầng Việt: pe-lược của Pāli là MỘT dấu lược, và sau khi bỏ hết pe-lược thì đếm dấu lược còn lại. Chạy trên 315 khoá của lát: 0 khoá lệch. Không có khoá nào để trống trong bản dịch.
  Tên phẩm đo trên toàn tầng sn: 7 tệp cùng phẩm Ambapālivagga, cả 7 đều là 1. Phẩm Ambapālī. Tên bài Makkaṭasutta chưa có tiền lệ; đặt mới theo Sujato (A Monkey) và theo Pāli: Kinh Con Khỉ.
  Coverage Anh 25/25 khoá Pāli có nội dung, tức 100%, và english-project của bài đang trống, nên tầng tham khảo là bản Sujato đã ghim, độc lập với người dịch. Năm pe-lược đều là pe-lược Pāli thật.
  Đo rồi mới dùng: 21 khoá có Pāli trùng nguyên văn với bài đã mang trạng thái, 19 dùng lại nguyên văn. Sáu khoá 3.1 và 3.2 và 3.3 và 4.1 và 4.2 và 4.3 có tiền lệ khớp từng khoá và tôi dùng lại y nguyên, kể cả cụm lãnh vực và nơi quen thuộc của cha ông; 4.5 cattāro satipaṭṭhānā → bốn niệm xứ; 4.6 Katame cattāro → Thế nào là bốn 142 lần; 3.6 Katame pañca → Thế nào là năm 124 lần; 3.4 và 4.4 Yadidaṁ → Tức là 5 lần; 4.7 đầy đủ chuỗi an trú 10 tiền lệ và 4.8 và 4.9 và 4.10 cũng đã có. Hai khoá lệch: 3.7 tôi thêm dấu phẩy sau nhận biết để tách khỏi chuỗi tính từ, và 3.8 tôi dịch âm thanh do tai nhận biết thay vì tiếng mà tai nhận biết; cả hai đều là lựa chọn văn phong, không đổi nghĩa.
  Xung đột tầng đã ghi ra: agocara và paravisayo được dịch lãnh thổ 29 lần và lãnh vực 18 lần trong tầng. Sáu khoá của bài này có tiền lệ riêng cho lãnh vực, nên tôi theo lãnh vực cho cả bài, kể cả 2.14, để bài không tự mâu thuẫn. Người điều phối nên chốt một cách cho toàn tầng.
  Thuật ngữ: lepa → nhựa đặc; bālajātika và abālajātika → liều lĩn và không liều lĩn; lolajātika và alolajātika → ham muốn và không ham muốn; pañcoḍḍito → bị trói giữ ở năm chỗ; tuṇḍena → bằng mõm; kaṭṭhakataṅgāre → thân cây chuối; pañca kāmaguṇā → năm dục adiệu; cattāro satipaṭṭhānā → bốn niệm xứ; Māra giữ nguyên tên như trong tầng.
  Tên núi: himavato pabbatarājassa có tiền lệ duy nhất là vua của các núi, núi Hi-mạn, nên tôi dùng vua núi Hi-mạn; tầng còn có Himavā 17 lần ở ngữ cảnh khác, ghi ra để gộp.
  Nháy kép: Pāli mở ở 1.1 và đóng ở 4.11, tức toàn bộ lời giảng là một lời thoại; tôi bám đúng, không thêm ngoặc ở 3.7 và 3.11 dù câu mới bắt đầu.
  Review đối kháng bắt được và đã sửa: 2.12 bản nháp dịch tai nạn và khổ đau thành một cụp, tôi tách thành tai nạn và hiểm nguy để theo đúng hai danh từ anayaṁ byasanaṁ; 2.13 bản nháp bỏ mất chữ đúng và viết đâm vào nó, tôi sửa thành đâm nó vào đúng thân cây chuối ấy.
