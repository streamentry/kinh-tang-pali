  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `12. Dhammakathikavagga` → «12. Phẩm Người Giảng Pháp». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.1 và 5.1 (cùng 1.3, 3.1, 4.1 trong bài) — bỏ dấu chấm thừa sau `?”` (Pāli kết bằng `”ti?`), không đổi chữ. Giữ nguyên chữ của 2.1, 5.1 và khoá 5.3: “Nhưng thưa hiền giả Sāriputta” (`panāvuso` = *pana* + *āvuso*) và “chứng Dự lưu” / “đắc quả Dự lưu” là hai cách đều đúng, cả bài nhất quán nội bộ; `paticayo` “bồi đắp” giữ.
