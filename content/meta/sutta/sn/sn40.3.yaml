  - >-
    Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên **48.784 segment đã `published`**: `số = đếm('…pe…') + đếm('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Khớp **48.359 / 48.784 = 99,13%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ (`hay` được miễn vì `vā…vā…vā` là cấu trúc).
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Có tiền lệ: `Nāgavagga` → *1. Phẩm Rồng* (`sn29.10`, 9 bài) · `Supaṇṇavagga` → *1. Phẩm Kim SÍ Điểu* (`sn30.2`) · `Valāhakavagga` → *1. Phẩm Mây* (`sn32.13-52`) · `Vacchagottavagga` → *1. Phẩm Vaccha* (`sn33.21-25`) · `Aniccavagga` (SN35) → *1. Phẩm Vô Thường* (`sn35.10`) · `Devadahavagga` → *14. Phẩm Devadaha* (`sn35.143*`) · `Saṭṭhipeyyālavagga` → *17. Phẩm Chuỗi Lặp Sáu Mươi* (`sn35.168`, 29 bài — **không** dùng *Sáu Mươi Bài Lược* nháp đã ghi) · `Yamakavagga` → *2. Phẩm Cặp Đôi* (`sn35.20` cùng phẩm; `sn35.21` ghi *Song Trùng*) · `Avijjāvagga` (SN35) → *6. Phẩm Vô Minh* (`sn35.53` cùng phẩm) · `Gilānavagga` → *8. Phẩm Người Bệnh* (`sn35.76` cùng phẩm) · `Rahogatavagga` → *2. Phẩm Về Trú Xa* (`sn36.12–14`, 5 bài) · `Aṭṭhasatapariyāyavagga` → *3. Phẩm Một Trăm Linh Tám Cách* (`sn36.24`/`26`) · `Jambukhādakavagga` → *1. Phẩm Jambukhādaka* (`sn38.16`) · `Moggallānavagga` → *1. Phẩm Mục-kiền-liên* (`sn40.11`) · `Dutiyavagga` (SN43) → *2. Phẩm Thứ Hai* (`sn4.20`/`sn6.15`) · `Vihāravagga` → *2. Phẩm Tào Môn* (`sn45.13–17`, 5 bài) · `Esanāvagga` → *13. Phẩm Tìm Kiếm* (`sn45.163–169`, 7 bài). **Hai chỗ phải ghi rõ lệch:** `sn45.19` ghi `Vihāravagga` thành *2. Phẩm Thiền* (Sujato *Meditation*, 0 tiền lệ tại lúc viết) — bài này theo đa số 5/6; và `sn36.27/28/29` ghi `Aṭṭhasatapariyāyavagga` theo ba cách khác, bài này theo `sn36.24/26` vì cùng phẩm và cùng vấn đáp `vedanā`.
  - >-
    Bắt đầu chuỗi năm bài `sn40.3–7` (cùng khung, cùng Mục-kiền-liên kể lại trước khi Đức Thế Tôn hiện ra bằng thần thông), nên dùng chung một hàm sinh. Năm bài khác nhau ở tên tầng, công thức `1.4/1.6/2.4` và vị trí dấu lược.
  - >-
    Dùng lại nguyên văn đã `published`: `moggallāna` → *Mục-kiền-liên* và `Moggallānavagga` → *1. Phẩm Mục-kiền-liên* (`sn40.11:0.2/2.0*`, ngay trong Sn 40) · công thức tam thiền theo `sn28.3:2.1*` (ly hỷ, trú xả, chánh niệm tỉnh giác, cảm nhận lạc bằng thân; các bậc Thánh gọi là *xả, niệm, trú lạc*) · `mahābhiññataṁ patto` → *đạt được đại thắng trí* (`sn52.6:1.3*`) · `sammā vadamāno vadeyya` → *nói đúng rằng* (`dn18:27.9*`).
  - >-
    0 tiền lệ, đặt mới: `Tatiyajhānapañhāsutta` → *Kinh Câu Hỏi Về Thiền Thứ Ba* · `vihāra` (nghĩa cách sống) → *tu sự* (0 tiền lệ trong kho; thuật ngữ cổ truyền cho đời sống tu hành, khác *vihāra* = tu viện) · `cittaṁ saṇṭhapehi / ekodiṁ karohi / samādahā` → *hãy điều tâm / nhất tâm / định tâm* (0 tiền lệ; `an4.94:3.7*` chỉ có dạng động tính từ *làm cho vững chãi / hợp nhất / định tĩnh*).
  - >-
    Đặc thù tầng Pāli: khác `sn40.4–7`, Pāli ở đây **đóng** ngoặc đơn ngay trong `1.4/1.6/2.4` (`đơn1/1`) và `1.5` không có ngoặc; bản Việt theo đúng, không thêm ngoặc ở `1.5`.
  - >-
    Lưu ý vai: `brāhmaṇa` ở `2.3` giữ *Bà-la-môn* (Mục-kiền-liên vốn là Bà-la-môn), còn `āvuso` ở `2.4/2.5` dịch *hiền giả* — đúng với cách Đức Thế Tôn đổi kiểu xưng trong cùng câu.
