    (*Chính vì không giác ngộ, không thâm nhập pháp này mà chúng sinh bị rối như cuộn chỉ,
    thắt như búi sợi, bện như cỏ muñja và cỏ pabbaja, không vượt khỏi ác thú, đọa xứ và
    luân hồi*). `2.1` dùng *Chớ nói như vậy, này Ānanda!* theo `sn45.2:2.1`.
  ⚠ **CỐ Ý LỆCH `dn15:1.4` ở khoá `1.3`.** Cùng Pāli `acchariyaṁ, bhante, abbhutaṁ,
