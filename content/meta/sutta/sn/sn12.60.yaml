  BÀI NÀY LÀ BẢN SONG SINH CỦA `dn15` — đã dùng lại nguyên văn bản Việt đã có:
  · `1.1` ≈ `dn15:1.2`; `1.2` ≈ `dn15:1.3` + `an3.79:1.1`; `1.4` = `dn15:1.5`
