  cao nhất) ⟵ `an4.76:5.5` *Thật hy hữu… Thật vi diệu…* (2) ⟵ `ud7.9` (2) ⟵ `dn15` (1).
  Tôi theo đa số; nếu người biên tập muốn `dn15` và `sn12.60` dùng **cùng một** câu cho cùng
  một Pāli thì phải sửa một trong hai tệp — việc đó ngoài lát này.

  Nửa sau bài trùng nguyên văn `sn12.55` (`Mahārukkhasutta`, **cùng phẩm Phẩm Khổ, đã
  published**) — dùng lại nguyên văn:
  · `4.2` = `sn12.55:2.2`; `4.3` = `sn12.55:2.3`; `4.4` = `sn12.55:2.4`; `4.7` = `sn12.55:2.6`;
    `6.1` = `sn12.55:4.1`; `6.2` = `sn12.55:4.2`; `6.3` = `sn12.55:4.3`; `6.4`+`6.5`+`6.6` chia
    theo đúng dấu chấm câu Pāli của `sn12.55:4.4`–`4.5`; `6.7` = `sn12.55:4.6`;
    `6.8` = `sn12.55:4.7`; `5.1`/`5.4` = `sn12.55:3.1`/`3.4`.
  · `3.1`/`5.1` tôi **đảo trật tự câu** cho tự nhiên tiếng Việt: `sn12.55` để *sống quán vị
    ngọt trong các pháp có tính trói buộc*, còn ở đây để *Trong các pháp có tính trói buộc,
    này Ānanda, khi sống quán vị ngọt* — vì `ānanda` là **danh xưng** đứng giữa hai vế và tiếng
    Việt không có dạng đó. Ghi rõ vì đây là lệch hình thức so với `sn12.55`.
  · Chuỗi `Taṇhānirodhā …` / `upādānanirodhā …`: chọn *Do ái diệt nên thủ diệt* (**2 tệp**
    cùng Pāli: `sn12.55:3.2`, `sn12.55:4.8`) và *do thủ diệt nên hữu diệt* (**9 tệp** toàn
    cục) thay cho *diệt tận* (7 tệp, chỉ ở `sn12.1`); `bhavanirodhā jātinirodho` chọn *do hữu
    diệt nên sinh diệt* (3, `mn115`) vì `sn12.55` cùng phẩm cũng dùng *nên* cho vế này.
    `6.12` dùng *đều diệt* (theo `mn38:20.11`) vì Pāli ở khoá này là `nirujjhanti` (thì hiện
    tại, *dập tắt*) chứ không phải `nirodhā` (quan hệ nhân quả) như ở `3.5`.
  · `3.5` = *do sinh làm duyên nên già-chết, sầu, bi, khổ, ưu và não sinh khởi.*
    (`mn115:11.14`; ⟵ `sn12.44:2.8` *Do sanh làm điều kiện…* 4 tệp).

  Tên phẩm và tiêu đề — đa số ĐO ĐƯỢC:
  · `Saṁyutta Nikāya 12.60` (0.1): giữ nguyên Pāli — 100% tệp `sn` đã có giữ Pāli ở
    `0.1` (`sn12.55`, `sn16.6`, …), khác 315 tệp dùng *Tương Ưng Bộ*.
  · `6. Dukkhavagga` (0.2): *6. Phẩm Khổ* **7/7 tệp** có cùng Pāli này (`sn12.55`–`sn12.61`).
    Củng cố bằng tầng tên đã ghim `sn-name:369.sn12-dukkhavagga` = *The Chapter on
    Suffering*.
  · `Nidānasutta` (0.3): *Kinh Nguồn Gốc*. Đúng Pāli này có **2** tiền lệ và chúng **1–1**:
    `an6.39:0.3` = *Kinh Nguồn Gốc* ⟵ `an3.34:0.3` = *Kinh Duyên Nguồn* (2 tệp khác:
    `an3.111`/`an3.112` *Duyên Nguồn Thứ Nhất/Hai*, `an10.174` *Nguồn Gốc Của Nghiệp*).
    Tôi phá vỡ thế hoà bằng đếm toàn cục: *nguồn gốc* **183** lần ⟵ *duyên nguồn* **51** lần.
    Cũng khớp với bản Anh đã ghim, `sn12.60:0.3` = *Causation*. Người biên tập nếu muốn thống
    nhất `an3.34` với `an6.39` thì đó là việc chỉnh sửa ngoài lát này.
  · `Dasamaṁ.` (6.14) → *Thứ mười.* (**246 tệp**).
  · `Dukkhavaggo chaṭṭho.` (6.15) → *Phẩm Khổ, thứ sáu.* theo `sn47.51-62:2.7` (*Phẩm Chuỗi
    Lặp Sông Gaṅgā, thứ sáu.*); phe còn lại là *Phẩm X là phẩm thứ sáu.* (`sn1.60`, `an1.60`)
    và *Phẩm X, chương thứ sáu.* (`an3.162`, `an4.263`).

  `uddāna` (7.0–7.6): `Tassuddānaṁ` → *Tóm lược:* (đa số **330+ tệp**; `sn12.30:3.0`,
  `sn12.50:6.0`, `sn16.13:6.0` cùng dùng). Sáu vế viết theo đúng nhịp của `sn1.30:3.1`–`3.6`
  và `sn12.50:6.1`–`6.6`: danh từ ngắn, phân cách bằng dấu phẩy, kết bằng câu đếm bài.
  `taruṇena ca sattamaṁ` → *bài cây non* khớp `sn12.57:0.3` *Kinh Cây Non* (`Tarunarukkhasaṁyutta`,
  bản Anh đã ghim *The Tender Tree*).

  Dấu lược: **hai** khoá có `…pe…` ở Pāli — `4.6` và `5.3` — và mỗi khoá bản Việt giữ
  **đúng một** `…` (`… do thủ diệt nên hữu diệt …` hơi dài hơn: `4.6` = *do thủ làm duyên nên có
  hữu …*, `5.3` = *do thủ diệt nên hữu diệt …*). 47 khoá còn lại khớp 0 = 0. **Không mở rộng
  dấu lược ở đâu cả**; cũng không nén thêm.

  Nháy kép: Pāli mở `“` ở `1.3` và `2.1`, đóng `”` ở `1.4` và `6.13` — cân 2 = 2. Bản Việt
  đặt đúng vị trí ấy; `ngoặc()` của `_hvi.py` xác nhận.

  BẤT ĐỊNH (không chặn, nhưng người biên tập nên biết):
  · `7.1` `Parivīmaṁsanupādānaṁ` — `parivīmaṃsa` là hapax cấu từ (quét toàn bộ Pāli root:
    cụm này chỉ ở chính khoá này) nghĩa là *vòng quanh, quanh co*. `Tassuddānaṁ` là danh sách
    **tên bài**, và các bài của *Phẩm Khổ* không có tên riêng bằng Pāli trong tầng Việt, nên
    tôi dịch danh từ nội dung (*Về vòng quanh và chấp thủ*) thay vì giữ Pāli. Nếu người biên
    tập muốn giữ Pāli ở `uddāna` thì phải quyết cho cả các `uddāna` khác, ngoài lát này.
  · `7.6` `nidānena ca te dasāti` → *và bài nguồn gốc, thế là mười bài.*; `nidānena` là cách
    đọc công cụ của `uddāna` (*bài về nguồn gốc*), khớp với cách tôi dịch `0.3`.
  · `1.1` `kammāsadhammaṁ nāma kurūnaṁ nigamo` — `nigamo` là *thị trấn*; `dn15:1.2` dịch
    *thị trấn Kammāsadhamma của người Kuru*, `an10.20:1.1` dịch *ngôi làng gọi là
    Công-đức-pháp*. Tôi theo `dn15` vì đó là bản song sinh có cùng Pāli.

