notes: |-
  Đợt 19, lát l29. Dịch từ Pāli root commit 11c9d708, đối chiếu English Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (Bình Anson hiệu đính) ở mục tra cứu toàn văn. **93 khoá** (0.1–0.3, 1.1–1.9, 2.1–2.16, 3.1–3.15, 4.1–4.15, 5.1–5.10, 6.1–6.22, 7.1, 8.1–8.2), đúng bằng tập khoá Pāli, đúng thứ tự Pāli, không khoá nào ngoài tập đó.

  **Coverage Anh trên Pāli có nội dung: 28/28 = 100%.** Mẫu số 28 là khoá Pāli ≥ 40 ký tự, bỏ khối :0; Sujato phủ cả 28, không đoạn nào phải bù. Lớp english-project không có tệp cho bài này nên không góp gì vào số đo; do đó con số 100% đều là bản Sujato độc lập. Tầng vietnamese-current vắng (bilara tại commit đã ghim chỉ có Pháp Cú); bản Hòa thượng Thích Minh Châu chỉ được đọc ở dạng nguyên bài, không căn lề theo khoá. Không có entry nào trong reference-gaps cho bài này và cũng không cần.

  **Pāli trùng nguyên văn trong chính bài: 0 nhóm trùng** (mọi cặp Pāli trong bài đều khác nhau ít nhất một chữ: mỗi mắt xích đổi tên pháp, nên 17 câu hỏi `Kā ca … upanisā?` và 15 câu `…mpāhaṁ … saupanisaṁ vadāmi` đều khác nhau). Phép đo này vì thế không có cặp nào để so; ghi thẳng là rỗng chứ không ghi "0 lỗi". **Dò tầng: 11 khoá có Pāli trùng nguyên văn với khoá ở bài khác** (0.2, 1.1, 1.2, 1.3, 1.5, 1.6, 1.7, 1.9, 3.14, 5.10, 8.2). Dùng lại nguyên văn: 0.2 (8 bài cùng phẩm), 1.2 và 1.3 (nguyên văn từ `sn22.101:1.2`, `sn22.101:1.3`), 1.1 (dạng chiếm đa số, 94/157 so với 52 `Đang sống tại`; trong riêng `sn12` là 29 so với 8), 8.2 (277/279). Việt khác: 6 khoá. `1.5`–`1.7` (Pāli `iti vedanā …`) có ba dạng trong tầng (*đây là thọ …* / *như vậy là thọ …* / *thọ là như thế …*): chọn *thọ là vậy …* để nối tiếp 1.4, vì 1.4 mở bằng *sắc là vậy* (khuôn `sn12.21:1.3`, `sn12.22:1.3`). `1.9` khác `sn56.25:1.4` (*cạn lậu*) vì ở đây dùng *sự đoạn tận các lậu hoặc* theo `sn22.101:1.3`, `mn2:3.1` cùng công thức. `3.14` và `5.10` khác `an10.62:6.21`, `an10.62:2.3` ở chỗ đặt dấu chấm ngoài nháy (xem bên dưới).

  **Thuật ngữ và tiền lệ đã đếm:**
  - `upanisā` → *nền tảng* (tiền lệ chuẩn `an11.3`–`an11.5` *hatūpaniso* → *nền tảng … đã bị hủy hoại*; `an6.50`; tên *Kinh Nền Tảng Thứ Nhất* của `an11.3`). Đếm trên tầng: trong 144 khoá có `upanis…` (loại `upanissāya`), 87 khoá dùng *nền tảng*; còn lại là các dạng khác (*điều kiện thiết yếu* ở `an8.81`, *y chỉ* ở `dn18:27.7`, *sở trí* ở `an3.67`). Sujato dịch *vital condition*, Hòa thượng Thích Minh Châu dịch *duyên*; giữ *nền tảng* để không lẫn với `paccaya` (*duyên*, dùng cho `sn12.20`) và để thống nhất với `an11.3`.
  - `saupanisaṁ` / `anupanisaṁ` → *có nền tảng* / *không có nền tảng*; câu `…mpāhaṁ … saupanisaṁ vadāmi, no anupanisaṁ` → *Ta nói X cũng có nền tảng, không phải không có nền tảng*, theo khuôn `an10.61:2.1`, `an10.62:2.1` (*Ta nói vô minh cũng có thức ăn, không phải không có thức ăn*). `-pāhaṁ` (= *pi ahaṁ*) giữ ở chữ *cũng*.
  - `‘…’tissa vacanīyaṁ` → *Nên nói rằng: ‘…’* (`an10.61`, `an10.62`; 52 khoá dùng *Nên nói rằng: ‘* trong tầng, dấu chấm trong nháy 33 so với ngoài nháy 19, nhưng `an10.61` cùng dạng ngoài nháy; `sn22.101`, `sn56.13` dùng *Phải trả lời rằng*). Dấu chấm đặt ngoài nháy, khớp Pāli (nháy đóng trước `tissa`).
  - `nibbidā` → *nhàm chán* (đếm tầng: *nhàm chán* 30, *chán ngại* 27, *yểm ly* 3; trong `sn12` là *nhàm chán*: `sn12.31:7.3`, `sn12.67:9.3`, và `mn22:29.1`). `virāga` → *ly tham* (218/219). `yathābhūtañāṇadassana` → *sự thấy biết như thật* (50 so với 10 *như thật tri kiến*). `vimutti` → *giải thoát*. `khaye ñāṇaṁ` → *trí về sự đoạn tận* (`dn34:1.4.39`, `mn140:25.3` *trí về sự diệt tận…*).
  - `samādhi` → *định*, `sukha` → *lạc*, `passaddhi` → *khinh an* (66 so với 6 *an tịnh*), `pīti` → *hỷ* (184 so với 40 *hoan hỷ*), `pāmojja` → *hoan hỷ* (83; *hân hoan* 28, *vui mừng* 10): hai chữ *hoan hỷ* / *hỷ* giữ phân biệt `pāmojja` / `pīti` theo `an11.3:1.2–1.3`. `saddhā` → *lòng tin* (110; *niềm tin* 36, *tín* 26, *đức tin* 21). `dukkha` → *khổ*; `jāti` → *sinh* (289 so với 162 *sanh*); `bhava` → *hữu* (101); `upādāna` → *thủ* (156; *chấp thủ* 77); `taṇhā` → *ái*; `vedanā` → *thọ* trong cả bài (chuỗi nhân duyên: 33 *thọ* so với 3 *cảm thọ*; riêng khoá `1.5` cũng *thọ* để cả bài một chữ, dù `sn12.21:1.4`, `sn12.22:1.4` viết *cảm thọ*); `phassa` → *xúc*; `saḷāyatana` → *sáu xứ* (101 so với 23 *sáu căn*); `nāmarūpa` → *danh sắc* (110; riêng `sn12` là 74 so với 1 *danh-sắc* và 15 *danh và sắc*); `saṅkhārā` → *các hành*; `avijjā` → *vô minh*.
  - `samudaya` / `atthaṅgama` (1.4, 1.8) → *sự sinh khởi* / *sự chấm dứt* (khuôn `sn12.21:1.3` đổi *sanh* thành *sinh* cho thống nhất chính tả với `jāti` → *sinh* trong bài).
  - `Seyyathāpi, bhikkhave, uparipabbate thullaphusitake deve vassante …` (7.1) → câu của `sn55.38:1.1`, `an3.95:6.1` (*Như thể, này các tỳ-kheo, trên núi cao mưa tầm tã, dòng nước chảy theo dốc lấp đầy các hang hốc, khe nứt và lạch suối trên núi…*; *Như thể* 5 so với 1 *Ví như*); đổi `;` thành `.` theo dấu câu Pāli, và `mahāsamuddaṁ` → *đại dương*. `Evameva kho, bhikkhave` → *Cũng vậy, này các tỳ-kheo* (169 so với 4).
  - `Sāvatthiyaṁ viharati` → *Trú ở Sāvatthī.* (xem trên). `Dasabalavagga` → *3. Phẩm Mười Lực* (nguyên văn `sn12.22:0.2`, `sn12.27:0.2`, `sn12.28:0.2`, `sn12.30:0.2`). Tên bài `Upanisasutta` → *Kinh Nền Tảng (Upanisā)* (khuôn *Kinh Nền Tảng Thứ Nhất* của `an11.3`; tên *Kinh Nền Tảng* đã được `sn1.54` (`Vatthusutta`) dùng nên thêm chữ Pāli trong ngoặc để hai bài không trùng tên). Tầng có một dạng khác cho cùng chữ `upanisā`: *cận duyên* ở kệ tóm lược `sn12.30:3.1` (1 khoá); không theo vì ở đó là danh sách tên bài rút gọn. `0.1` giữ `Saṁyutta Nikāya 12.23` theo quy ước tầng SN.

  **Số Pāli:** bài không có số đếm nào ngoài thứ tự bài cuối phẩm. `Tatiyaṁ` (8.2) → *Thứ ba.* (277/279 khoá cùng dạng; `Dasabalavagga` gồm `sn12.21`–`sn12.30`; 12.23 là bài thứ ba của phẩm).

  **Dấu câu và dấu lược (đo từng khoá):** nháy kép `“` mở ở 1.2 và `”` đóng ở 8.1 khớp Pāli (`ñāṇan”ti`); nháy đơn `‘…’` ở các khoá 2.3, 2.6, 2.9, 2.12, 2.15, 3.2, 3.5, 3.8, 3.11, 3.14, 4.2, 4.5, 4.8, 4.11, 4.14, 5.2–5.7, 5.10: mỗi khoá một cặp, khớp số lượng Pāli của chính khoá đó (0 lệch trên 93 khoá). Pāli ở 1.4–1.8 dùng `iti … iti … -ti` không có nháy; bản Việt cũng không thêm nháy (Sujato thêm nháy; không theo vì Pāli không có). Dấu lược: 8 khoá Pāli có dấu lược (1.5, 1.6, 1.7, 5.2, 5.3, 5.4, 5.5, 5.6), 1.5 và 5.2 là `…pe…`, các khoá còn lại là `…` trần; mỗi khoá Việt đúng một `…`, không bung văn, không có `(…)` trong bài, không khoá nào kết `….` (lược rồi mới tới chấm). Chữ hoa đầu khoá 5.3–5.7 (*nên nói rằng*) để thường theo Pāli (khoá Pāli bắt đầu bằng nháy đơn rồi chữ thường).

  **Bất định đã ghi, không đưa vào thân kinh:** (a) `2.1` `Yampissa taṁ … khayasmiṁ khaye ñāṇaṁ`: Pāli lặp `khaya` (*đoạn tận* ở vị trí hạn định và *trí về đoạn tận*); Sujato gộp thành *knowledge of ending*, Hòa thượng Thích Minh Châu dịch *trong đoạn diệt ấy, trí về đoạn diệt*. Giữ cấu trúc sát Pāli: *trí của vị ấy về sự đoạn tận trong sự đoạn tận ấy*, không thêm lời giảng. Cách hiểu của Sujato (gộp) có thể cũng đúng; nghĩa giáo lý không đổi. (b) `upanisā` là thuật ngữ khác `paccaya`: Hòa thượng Thích Minh Châu dịch *duyên* cho cả hai, Sujato dịch *vital condition*; bản này giữ *nền tảng* nhưng người đọc cần biết rằng chữ *nền tảng* ở đây không thay cho *duyên* trong các bài `paṭiccasamuppāda`; Pāli không giảng thêm, bản Việt cũng không. (c) Hướng của hợp từ `avijjūpanisā saṅkhārā`: *các hành có vô minh làm nền tảng* = *vô minh là nền tảng của các hành* (Sujato *ignorance is the vital condition for choices*): đọc theo hướng đó cho cả 22 mắt xích. (d) `1.4` thiếu nháy dù có `iti … -ti` (xem trên).

  **Đối chiếu:** Pāli root là chuẩn; mọi cặp Pāli ↔ Việt đã in ra đọc đối kháng từng khoá (93/93), không phát hiện cặp nào lệch nội dung (khác với lát từng cắt lệch khối). Không có Pāli lọt sang tiếng Việt ngoài tên riêng (`Saṁyutta Nikāya`, `Sāvatthī`).

  **Cổng kỹ thuật:** bốn cổng của AGENTS.md là `npm run validate`, `npm test`, `npm run check` và `npm run build`. **Lát này KHÔNG chạy bốn lệnh đó** (bị cấm); CI (`.github/workflows/ci.yml`) là cổng thật còn lại nên `technical_integrity` đặt 9.6 chứ không 10. Đã tự kiểm: đủ khoá và đúng thứ tự Pāli, nháy kép/đơn khớp từng khoá, dấu lược khớp từng khoá, NFC, không khoá rỗng, không khoảng trắng thừa; `blocking_errors` rỗng; coverage Anh 28/28 vượt ngưỡng 0,80 và không cần entry gap.
