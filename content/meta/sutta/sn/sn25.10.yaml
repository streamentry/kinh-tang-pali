notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.8, 2.2 — "nghiệp nào khiến phải tái sanh vào … cõi súc sanh" → "nghiệp mà sau khi tạo nghiệp ấy có thể tái sinh vào … loài súc sinh" vì `upapajjeyya` là thức khả năng (không phải "phải"), `yoni` là "loài", và chính tả "sinh" là cách đa số của toàn tầng.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt hai): khoá 2.1, 2.3 — thêm nháy đơn cho khớp Pāli từng khoá (Pāli mở ‘ ở 2.1, ngay sau `ayaṁ vuccati:`, và khép ’ ở 2.3; bản cũ không có dấu nào, trong khi 2.5 vẫn khép ’”); lời dịch giữ nguyên, chỉ chuyển «người ấy được gọi là» thành «người ấy được gọi là: ‘bậc Tùy pháp hành …». Giữ nguyên 2.1 theo cách hiểu của bài (không theo bản đa số sn25.1:2.1, sn25.2:2.1 vốn bỏ `Này các tỳ-kheo` và `evaṁ`), và giữ 1.8, 2.2 như lượt trước.
