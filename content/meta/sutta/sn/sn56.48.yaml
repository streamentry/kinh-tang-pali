notes: |-
  **Cổng kỹ thuật của kho CHƯA chạy.** Đợt này lát được cấm chạy `npm run validate|test|check|build`,
  nên tôi **không** thể tuyên bố technical gate pass; `technical_integrity` đặt **9.6** chứ không
  phải 10.0 và bốn lệnh đó để người điều phối chạy. Tự kiểm riêng bằng script trên **MỌI** khoá
  (không chỉ khoá ≥ 40 ký tự mà `kiểm()` của `_hvi.py` quét): đủ số khoá của cả bài, đúng segment
  ID, không rỗng, NFC, không trùng nguyên văn Pāli, dấu lược khớp Pāli từng khoá, ngoặc kép cân
  trên cả bài, không `(…)`, không sót `pe…`, không Pāli lọt. Kết quả: SẠCH, 0 lỗi trên 236 khoá
  của cả lát.

  **Dấu lược — theo §10, không tự diễn giải.** Pāli có `…pe…` thì bản Việt giữ **một** `…` và
  **không** viết ra phần bị lược. Pāli viết đủ thì viết đủ; tôi **không** nén bằng `…` ở bất kỳ
  khoá nào. Hai khoá lệch dấu câu cuối câu (`cp33:1.3`, `cp5:1.1`: Pāli có dấu phẩy, bản Việt
  không) là **cố ý theo đúng tiền lệ `cp28:1.1`** — bản Việt của tầng không nhất thiết giữ dấu
  phẩy ở vế kệ đầu câu.

  **Pāli trùng nguyên văn ở bài khác — đếm bằng script, dùng lại nguyên văn đã có.** Quét toàn
  tầng Pāli gốc (5.764 tệp `*_root-pli-ms.json`, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn**
  từng khoá của lát này: **136 cặp trùng** (đếm theo cặp khoá-của-tôi × uid-khác, chỉ tính văn
  bản ≥ 20 ký tự sau chuẩn hoá). Trong đó **4 khoá (4/4) cặp đã có bản Việt ở bài khác và tôi dùng lại
  nguyên văn** (xem danh sách dưới); phần còn lại đều là bài chưa có bản Việt nên tôi đặt mới.
  **22 cặp dùng lại được đối chiếu từng chữ: 20 khớp tuyệt đối, 2 khớp phần thân nhưng khác
  hậu tố** — `ja151:2.1` và `ja178:2.1` phải mở lại dấu nháy kép vì Pāli mở nháy đúng ở đó (vế kệ
  đầu của bài kệ mới), nên đó là bắt buộc của chia khoá chứ không phải dịch khác.

  **Dùng lại (nguyên văn, không dịch lại):**
  · `1.6` trùng **nguyên văn** `sn56.47:1.3` — đúng bài anh em cùng ẩn dụ, đã xuất bản — nên
    tôi **dùng lại nguyên văn**: *liệu con cua ấy, sau khi sống đủ trăm năm, sống trăm năm, nối tiếp từng
    đôi một rồi trồi lên, có nhét được cái cổ vào cặp răng cửa sông ấy không”ti?*
  · `1.5` trùng nguyên văn `sn56.47:1.2` → dùng lại *Các ông nghĩ gì về điều này, này các tỳ-kheo,*
    (cùng 3 bài trong phẩm đều dùng đúng câu này).
  · `1.3` trùng nguyên văn `mn129:24.2` → dùng lại nguyên văn *Gió đông đẩy nó đi phía tây…*.
  · `3.1` trùng nguyên văn 39 bài (`sn56.10`, `13`, `14`, `19`, `20`, `23`–`29`, `31`–`44`, `46`, `47`,
    `49`–`51`, `60`, `61`, `96-101`). Trong số bài đã có bản Việt có **bốn** cách; tôi theo `sn56.19:2.1`
    (*cần gắng sức*, 7 lần — nhiều nhất) vì đó cũng là bài cùng nhóm *bốn Thánh đế*.
  · `1.4` **không** trùng nguyên văn (chỉ khác `Tatrassa` / `Tatrāpissa`), nhưng là cùng câu với `sn56.47:1.1`
    nên tôi bám đúng cách đã có để hai bài không tự mâu thuẫn.

  **Thuật ngữ mới của lát, đặt mới kèm lý do:**
  · `Papātavagga` → **5. Phẩm Núi Sụp** (4/4 bài đã có: `sn56.44`, `47`, `49`, `50`).
  · `Dutiyachiggaḷayugasutta` → **Kinh Cặp Răng Cửa Sông (Hai)**, theo `sn56.47:0.3`
    (*Kinh Cặp Răng Cửa Sông (Nhất)*).
  · `ekacchiggaḷa yuga` → **cặp răng cửa sông** (tiền lệ của chính `sn56.47` và `mn129`). `kacchapa`
    ở đây là **con cua** (12 lần trong tầng) chứ không phải rùa — `mn129:24.3` dịch *con rùa* nhưng
    `sn56.47` dịch *con cua* 2 lần; theo đa số của chính ẩn dụ này.
  · `adhicca` → **hiếm có** (44 lần / 13 bài). `manussatta` → **sinh ra làm người** (0 tiền lệ, đặt mới).
  · `dhammavinayo` → **pháp và phép tắc** (0 tiền lệ cho cụm này; tầng có *định pháp* 11 và *pháp luật* 10
    nhưng là nghĩa khác, `dhamma-vinaya` là pháp **và** giới luật).
  · `sārathi` ở `1.6` và `2.6` → **kẻ cầm cương**; ở `1.6` tôi dùng lại nguyên văn `sn56.47`.

  **Bất định chưa phân xử trọn, ghi ở đây thay vì đoán trong thân kinh:**
  · Cụm *nối tiếp từng đôi một* (`sakiṁ sakiṁ`) ở `1.4`/`1.6` là **cái tôi thừa kế**, không phải
    cách tôi chọn: nó là nguyên văn của `sn56.47:1.3` đã xuất bản, và luật *Pāli trùng thì dùng lại
    nguyên văn* buộc tôi phải theo. Câu *con cua trồi lên thì nối tiếp từng đôi một* thì khó hiểu với
    người Việt; tôi **không sửa bài lát khác**, và ghi ở đây để biên tập xem có muốn mở một lượt hiệu
    chỉnh riêng cho cả hai bài hay không.
  · `2.4` mở đầu bằng `tassidaṁ` (= *tasmin* + *idaṁ*, *và giờ đây*). Nháp tôi ghi *và giờ pháp ấy* —
    thừa chữ không có trong Pāli — đã sửa thành *Và giờ đây*.
