notes: |-
  Lượt review toàn bài ngày 2026-10-06 sau khi đối chiếu main và các sửa chưa được chuyển lên canonical. Đã đọc đủ 30 segment Pāli root và bản Sujato ghim tại 11c9d708978cde8ba61096d8a75f7ddfb846f639; đọc bản toàn văn của Hòa thượng Thích Minh Châu tại https://www.dhammatalks.net/suttacentral/sc2016/sc/vn/sn22.26.html. Đây là bản sao SuttaCentral 2016, không phải tầng Việt đã ghim theo segment. Sửa lỗi gõ “Rối thì” ở 1.3, paccaññāsiṁ là tuyên bố và pajā là quần chúng ở 2.1/2.3; giữ phủ định, mệnh đề điều kiện và ranh segment 2.2/2.3. Không bung dấu lược ở 1.15, không thêm/bớt segment. Bản English-project lấp 1.13/1.14/1.17/1.18/2.3 do cùng tác giả với bản Việt cũ nên không dùng làm đối chứng độc lập; các đoạn đó được đối chiếu trực tiếp với Pāli trong ngữ cảnh cả bài. TMC được dùng để đối chiếu truyền thống từ ngữ, không dùng làm authority hoặc cột segment. Các lượt chấm trước và reviewer lịch sử giữ nguyên. Cổng kỹ thuật đã xác nhận trên nhánh sửa này: npm test 350/350, npm run check 0 lỗi và 0 cảnh báo (5 hint), npm run validate + quality:check qua, verify:store:partial không có discrepancy và khớp số liệu đã ghi, npm run build qua. Chỉ sau các cổng này mới chấm technical_integrity 10 và áp dụng published.
