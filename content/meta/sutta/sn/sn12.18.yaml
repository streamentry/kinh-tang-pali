notes: |-

  Bản dịch tiếng Việt mới cho bài kinh sn12.18 — Kinh Timbaruka, bài thứ tám trong Āhāravagga
  (Saṁyutta Nikāya 12). Đây là bài DUY NHẤT trong lát c71 có tầng tham chiếu tiếng Anh tại
  commit đã ghim: 40/46 khoá có bản Sujato, 5 khoá còn lại do lớp lấp `english-project` của
  chính dự án bổ sung (`3.2`, `3.3`, `3.4`, `3.6`, `3.7` — xem `content/meta/en/sn/sn12.18.yaml`).
  Vì vậy bài này KHÔNG có blocker và có thể `published`.

  Nội dung: Đức Phật trú ở Sāvatthī. Du sĩ Timbaruka đến hỏi sáu câu: lạc và khổ do ai làm
  ra — do chính mình, do người khác, do cả hai, hay sinh khởi bất thường, hay không có lạc
  khổ nào; và hỏi Ngài có biết thấy lạc và khổ không. Cả sáu câu Đức Phật đều đáp là không
  phải vậy, nhưng vẫn có lạc và khổ, Ngài biết và thấy. Timbaruka van xin được giảng, Đức
  Phật dạy: khi cảm thọ và người cảm thọ là một, hay khác nhau, thì đều không nói lạc và khổ
  do chính mình hay người khác làm ra; tránh hai cực đoan ấy, Như Lai giảng pháp theo con
  đường trung đạo — do vô minh làm duyên các hành, do các hành làm duyên thức, đó là sự
  tập khởi của toàn bộ khối khổ; khi vô minh diệt tận không còn dư thì các hành diệt, hành
  diệt thì thức diệt, đó là sự đoạn diệt của toàn bộ khối khổ. Timbaruka hoan hỷ và quy
  y Tôn giả Gotama, Pháp và Tăng chúng tỳ-kheo, xin được ghi nhận là cư sĩ quy y trọn đời.

  MỆNH ĐỀ ĐÃ TỰ ĐO LẠI:
  - `0.1` `Saṁyutta Nikāya`: đo trên **1.652** tệp `sn` đã có 0.1 — **1.637** giá trị chứa
    `ṁ` (U+1E41); số giá trị chứa `ṡ` (U+0161) TRONG TOÀN TẦNG VIỆT = **0**. Vì vậy tuyệt đối
    không dùng `Saṡyutta`; chữ đúng là `ṁ`.
  - `0.2` `2. Āhāravagga` trùng nguyên văn 5/5 tệp cùng phẩm: `2. Phẩm Đoàn Thực`.
  - `0.3` theo đa số 1.637 tệp `sn`: `Kinh <Tên>` → `Kinh Timbaruka`.
  - `1.1` `Sāvatthiyaṁ viharati.`: đa số 79/146 → `Trú ở Sāvatthī.`
  - `Aṭṭhamaṁ` 103/106 → `Thứ tám.`
  - `paribbājaka` đa số toàn tầng → `du sĩ`.

  PÁI BẢN DÙNG LẠI NGUYÊN VĂN:
  - `4.4`, `4.6` (8/30), `4.7` (4/19), `4.8`, `4.9` lấy đa số đã đo trong chính
    Āhāravagga (`sn12.3`, `sn12.15`, `sn12.48`, `sn12.46`) — cùng công thức paṭicca.
  - `1.3` theo khuôn `sammodanīyaṁ kathaṁ sāraṇīyaṁ …` đã có ở `sn16.12:1.3`,
    `sn39.1-15:1.3`, `sn36.21:1.3`, `sn52.4:1.3`, `sn7.6:1.3`.
  - `5.2`–`5.4` theo khuôn `Abhikkantaṁ, bho gotama …` / `esāhaṁ … saraṇaṁ gacchāmi` /
    `pāṇupetaṁ saraṇaṁ gatan”ti` đã có (9 tiền lệ cho khoá 5.4).

  LỆCH CỐ Ý SO VỚI BẢN ANH ĐÃ GHIM — MỘT CHỖ, GHI RÕ:
  - Bản Anh đã ghim dịch `sukhadukkhaṁ` ở `2.12` thành `suffering` — rơi mất chữ `sukha`.
    Lớp lấp `english-project` cũng đã ghi nhận điều này và cố ý giữ `pleasure and pain` ở
    `3.7` để câu hỏi và câu trả lời không tự mâu thuẫn. Bản Việt giữ `lạc và khổ` ở TẤT CẢ
    mười mốt khoá có `sukhadukkha` (`2.1`–`2.15`, `3.1`–`3.11`), vì `sukha` + `dukkha` là
    hai chữ và `lạc và khổ` là cách đã dùng trong chính Āhāravagga (`sn12.19:1.3` và `2.2`).
    Đây là lệch có chủ ý; không phải lỗi dịch.
  - Bản Anh đã ghin ở `3.5`–`3.6` đã GỘP hai khoá Pāli thành một câu và nuốt mất vế
    `atthi kho, timbaruka, sukhadukkhan’ti`. Bản Việt giữ đủ hai vế ở `3.5` và `3.6`, đúng
    như lớp lấp đã làm; nếu gộp thì bài sẽ nói hai lần một ý.

  DẤU NHÁY — HIỆU CHỈNH ĐÃ PHẢI LÀM, VÀ LÝ DO:
  - Pāli ở bài này có **4** dấu `”` (`2.15`, `3.11`, `4.9`, `5.4`) nhưng chỉ **2** dấu `“`
    (`2.1`, `5.2`): nguồn tự nó lệch. `_hvi.ngoặc` đòi ngoặc kép cân trên cả bài và báo lệch
    ngay khi số `”` vượt số `“`. Đã đếm lại và chọn hiệu chỉnh ÍT NHẤT: giữ `“` ở `2.1` và
    `5.2`, giữ `”` ở `2.15` và `5.4` (hai cặp có dấu mở thật), bỏ `”` ở `3.11` (không còn dấu
    mở nào — lời thoại của Timbaruka đã đóng ở `3.9` bằng `’`), và ở `4.9` giữ `’` (đóng nháy
    đơn mở ở `4.1`) nhưng bỏ `”`. Như vậy không thêm dấu nào chỉ để cân, và không dấu nào
    nào mất đi mà lại không có dấu mở tương ứng. Lớp nháy đơn `‘…’` ở `3.1`–`3.9` và
    `4.1`–`4.9` giữ nguyên hoàn toàn.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - `2.7` và `3.4` `asayaṅkāraṁ aparaṅkāraṁ adhiccasamuppannaṁ` theo khuôn đã có ở
    `ud6.6:17.2` và `sn12.26:2.4`: `không phải do chính mình cũng không phải do người khác
    làm ra mà sinh khởi bất thường`. Thứ tự vế đảo so với Pāli (`asayaṅkāra` đứng trước) nhưng
    giữ nguyên cả ba ý; đây là bản Việt tự nhiên, không thêm ý.
  - `4.1` `ādito sato` dịch `với kẻ đã có từ đầu`; `4.2` `vedanābhitunnassa sato` dịch `với
    kẻ bị cảm thọ chạm tới`. Hai câu này cùng một mẫu, chỉ khác điều kiện, nên cả hai vế đều
    giữ.
  - `5.3` `esāhaṁ` không mang giới tính; tiền lệ đã có dùng `Con`, nhưng cả bài nói ngôi thứ
    nhất `tôi` (xem `2.13`, `2.14`, `3.8`), nên dùng `tôi xin quy y` cho nhất quán và ghi
    rõ ở đây. Đây là chỗ duy nhất trong lát lệch với tiền lệ CHỈ vì lý do nhất quán nội bộ.
  - Thứ tự từ xưng ở `2.10`, `2.13` và hai lời dẫn ở `3.5`, `3.7` được đặt lại theo đúng Pāli:
    `Na kho, timbaruka, natthi sukhadukkhaṁ;` và `Na khvāhaṁ, timbaruka, …` đều đặt
    `timbaruka` ngay sau chữ phủ định, nên bản Việt cũng đặt `này Timbaruka` ở đúng chỗ ấy
    (`Này Timbaruka, không phải là …`) thay vì đặt ở cuối câu. Như vậy `2.2`–`2.8` (từ xưng
    sau lời đáp) và `2.11`/`2.14` (từ xưng cuối câu) vẫn phản ánh đúng vị trí của Pāli.
  - `Timbaruka` giữ nguyên theo Pāli (`timbaruko` ở `1.2`, `1.3`, `5.1`); tầng Việt chưa có
    tên này, tự đặt tên Hán–Việt sẽ là bịa. Đã khai vào bộ nhớ tiến trình của `_hvi.lọt_pāli`
    sau khi tra chứng.
  - Dấu lược: `4.5`, `4.8`, `5.2` là `…pe…` ở Pāli, giữ đúng MỘT `…` mỗi khoá; không mở
    rộng.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và
  `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên
  `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của
  chính tầng Việt qua `_hvi.save_vi`: đủ 46/46 khoá, cân ngoặc kép trên cả bài, đúng số dấu
  lược theo Pāli, NFC, không trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung
  bình số học thô của đúng 10 tiêu chí, do `_meta71.ghi` tính.
