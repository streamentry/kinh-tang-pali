notes: |-
  **57 khoá** (0.1–0.3, 1.1–1.3, 2.1–2.6, 3.1–3.4, 4.1–4.2, 5.1–5.5, 6.1–6.6, 7.1–7.7, 8.1–8.5, 9.1–9.7, 10.1–10.9), viết đủ cả 57; dump f202 == root JSON: 0 lệch.
  **Trùng nguyên văn (chỉ mục toàn kho 68.499 chuỗi Pāli): 8/57 khoá khớp tuyệt đối, đều dùng lại cách dịch đã có.** Mahālisutta → *Kinh Mahāli* (3 nơi, `dn6:0.2`) · 6. Upayavagga → *6. Phẩm Dính Mắc* (5 nơi) · Evaṁ me sutaṁ— → *Tôi nghe như vầy—* (29 nơi; chọn biến thể giữ dấu gạch cuối như Pāli, đa số tuyệt đối là "Tôi nghe như vầy." 220 nơi) · ahetū appaccayā sattā saṅkilissanti → mn60:21.3 · sahetū sappaccayā sattā saṅkilissanti → *các hữu tình bị ô nhiễm do nguyên nhân và điều kiện.* (2 nơi, mn60:22.4) · Idha bhagavā kimāhā”ti? → *Bạch Thế Tôn nói gì về điều đó”ti?* (8 nơi, sn42) · Aṭṭhamaṁ → *Thứ tám.* (223 nơi).
  **Tiền lệ thuật ngữ đã tra kèm đếm:** đoạn Phú Lâu Na Ca Diệp về nhân duyên ô nhiễm/thanh tịnh là formula song song với `mn60:21–23` — `hetu/paccayo` → *nguyên nhân/điều kiện*, `sattā` → *các hữu tình*, `saṅkilesa` → *ô nhiễm*, `visuddhi` → *thanh tịnh* (theo mn60 từng câu). `kūṭāgārasālā` → *giảng đường mái nhọn* ('mái nhọn' 35 nơi trong kho; biến thể Pāli-khớp gần nhất mn35:1.2; `Trùng Các` chỉ 6 nơi). Mahāli → *này Mahāli* (31 nơi); `licchavi` → *người Licchavi* (39 nơi); công thức `yena…tenupasaṅkami …pe… ekamantaṁ nisinno…etadavoca` → khuôn `sn22.124:1.2` (*đi đến chỗ Đức Thế Tôn … ngồi một bên, … bạch…*). `bhikkhave` → *này các tỳ-kheo*; `bhante` (Mahāli nói với Đức Phật) → *thưa Ngài* (99 nơi) trừ khoá `2.6` dùng nguyên văn tiền lệ.
  **Chọn biến thể, ghi lý do:** `13.4`-tương đương không có; formula `sārajjeyyuṁ` → *dính mắc* (Sujato *aroused*; nghĩa chữ sārajja = bám dính; khớp chủ đề Phẩm Dính Mắc — `upaya`), `saṁyujjanti` → *bị ràng buộc* ('ràng buộc' 155 nơi), `saṅkilissanti` → *bị ô nhiễm*. `nibbindaṁ virajjanti; virāgā visujjhanti` → *chán nản rồi ly tham; ly tham rồi được thanh tịnh* — khuôn theo `sn35.86:24.3` (*Chán nản rồi ly tham…*), phần hai đổi thành *được thanh tịnh* theo `visujjhanti` ('được thanh tịnh' 136 nơi).
  **Coverage Anh: 34/40 segment ≥40 ký tự có English Sujato; 6 chỗ trống** (`6.2`, `6.5`, `6.6`, `7.3`, `7.6`, `7.7`) — toàn bộ là đuôi formula lặp của đoạn `5.1`–`5.5` đã có English; những khoá đó dịch trực tiếp từ Pāli theo đúng khuôn đoạn đã đối chiếu. Không có tầng Việt hiện hành (bilara chỉ có Pháp Cú) — đã ghi vào scorecard.
  **Lược: mỗi khoá đếm lược(vi) == lược(pāli)**; tổng 4 `…pe…` (1.3, 7.1, 10.1, 10.2, 10.3 — 5 chỗ) → giữ một "…" mỗi chỗ; các khoá `”ti`/`’ti` giữ nguyên dấu quote + "ti" như Pāli (khuôn 3.631 nơi "”ti" trong kho).
  **Bất định đã phân xử và ghi lại:** `ekantadukkhaṁ abhavissa dukkhānupatitaṁ dukkhāvakkantaṁ anavakkantaṁ sukhena` → *hoàn toàn là khổ, bị khổ lấn tới, bị khổ thấm vào, và không bị lạc thấm vào* — hai compound `ānupatita`/`avakkanta` đều có nghĩa "bị xâm nhập"; chọn hai động từ khác nhau cho hai bước, phân biệt với Sujato ("soaked and steeped"). Không blocker.
