notes: |-
      **DÙNG LẠI NGUYÊN VĂN — 12 khoá Pāli TRÙNG NGUYÊN VĂN với `sn36.17`** (đã `published`,
      cùng Tăng Bộ, cùng công thức, chỉ khác người hỏi): `sn36.15:1.2`–`1.3`, `1.5`, `1.7`–`1.13`
      → nguyên văn của `sn36.17:1.2`–`1.3`, `1.5`, `1.7`–`1.13`; `1.15` = `sn36.17:2.2`,
      `1.19` = `sn36.17:2.5`, `1.28` = `sn36.17:2.12`, `1.29` = `sn36.17:2.13`.
      Đếm bằng cách ghép chuỗi Pāli đã `.strip()` của 298 khoá của lát này với mọi
      segment Pāli đã dịch trong `dn/mn/sn/an/kn`. `0.1` giữ nguyên Pāli `Saṁyutta Nikāya` theo
      đa số **1427/1427** segment `:0.1` của tầng sn.
      **Thuật ngữ dùng lại có số đếm:** `assādo` → *sự đáng ưa* (5 bài sn36 đã publish),
      `ādīnavo` → *tai họa*, `nissaraṇaṁ` → *lối thoát*, `sukhadukkhadukkhasukhadukkha` cả ba vế
      → *dễ chịu / khổ / vừa khổ vừa dễ chịu* (nguyên văn `sn36.17:1.5`),
      `Paṭhamaānandasutta` → *Kinh Ānanda (Nhất)* (`sn51.27:0.3`; anh em `sn36.16` đã publish
      làm *Kinh Ānanda (Hai)* — tôi theo đúng cặp đó),
      `Rahogatavagga` → *2. Phẩm Về Trú Xa* (đa số 3 với 3; `sn36.12`/`sn36.16`/`sn36.17`).
      **Bốn `āyatana` lấy theo đa số toàn tầng** (đếm Pāli↔Việt): `ākāsānañcāyatana` → *hư không
      vô biên*, `viññāṇañcāyatana` → *thức vô biên*, `ākiñcaññāyatana` → *vô sở hữu*,
      `nevasaññānāsaññāyatana` → *phi tưởng phi phi tưởng*. `an9.31` dùng *không trung* cho
      xứ hư không vô biên — **một tiền lệ lẻ**, tôi theo đa số 5 với 1.
      **Ba tên sắc thái `anupubbasaṅkhārānaṁ` giữ đúng khuôn của `sn36.17`** và khoá theo đúng
      ba động tở của Pāli: `nirodho` → *sự ngừng dần* → `niruddhā honti` = *đã ngừng hẳn*;
      `vūpasamo` → *sự lắng dịu dần* → *đã lắng dịu*; `paṭippassaddhi` → *sự lắng dịu trọn vẹn*
      → `paṭippassaddhā honti` = *đã hoàn toàn lắng dịu*.
      **⚠ LỆCH CÓ CHỦ ĐÍCH, đã ghi:** `sn36.15:1.16` có Pāli trùng nguyên văn `an9.31:1.11`
      (*với người đã chứng tưởng và cảm thọ đã đoạn diệt, tưởng và cảm thọ hoàn toàn bị chấm
      dứt*). **Tôi không dùng nguyên văn đó**: ba khoá `1.16`/`1.20`/`1.28` trong chính bài này
      là một chuỗi song song, và `1.28` vốn đã trùng nguyên văn `sn36.17:2.12`
      (*Với người đã chứng đạt định diệt tưởng và diệt thọ…*). Dùng khung của `an9.31` cho
      `1.16` sẽ khiến cùng một công thức có hai cách dịch ngay trong một bài. Tôi theo
      `sn36.17` (cùng Tăng Bộ) cho cả ba. Người biên tập xem có muốn vá `an9.31:1.11` cho
      khớp không.
      `1.1` **không** có `abhivādetvā` (đảnh lễ) như `sn55.8:1.3` và `sn22.21:1.2` — tôi không
      thêm đảnh lễ vào. `1.30` = `Pañcamaṁ.` → *Thứ năm.*
      **Tầng Anh đủ 100%** (24/24 segment có nội dung có chữ Anh ở commit đã ghim), nên
      `triangulation` 9.3. **Không đối chiếu được tầng Việt hiện hành**: bilara tại commit đã
      ghim chỉ có Pháp Cú cho tiếng Việt — giới hạn của bản chụp upstream.
      **technical_integrity = 9.6** vì bốn cổng kỹ thuật do coordinator chạy, tôi không được chạy (`npm run validate|test|check|build` bị cấm trong lát này): (1) `npm run validate` (qua `npm run build`) — kiểm metadata, scorecard, `blocking_errors` và nội dung; (2) `npm test` — unit tests; (3) `npm run check`; (4) `npm run build`. Ngoài ra `npm run reference:gaps:check` phải xanh sau khi chạy lại `npm run reference:gaps`.
