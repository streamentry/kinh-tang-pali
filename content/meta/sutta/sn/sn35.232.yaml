notes: |-
  Lát Wave 19 Lane 17. Dịch trọn 73/73 khoá từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato, bản Việt
  Hòa thượng Thích Minh Châu (bản nguyên bài, chỉ tham khảo) và các bài cùng phẩm đã publish
  (sn35.233, sn35.234, sn41.1 có cùng khuôn “ví dụ hai con bò”).

  Coverage English (đo trên Pāli có nội dung ≥ 40 ký tự, bỏ khối :0): mẫu số 40. Sujato phủ 34/40 =
  0,85, đủ trên ngưỡng 0,80 mà không cần bản lấp. Sáu khoá còn lại (3.4, 7.2, 9.2, 9.4, 9.5, 11.6) Sujato
  để trống; lớp `english-project` đã published lấp cả sáu nên cổng tính 40/40, nhưng bản lấp do cùng một
  bên viết nên KHÔNG phải cách đọc English độc lập: triangulation chỉ để 9,3 và bản Việt này không tuyên bố
  đã đối chiếu English độc lập cho sáu khoá đó. Với chúng, Pāli tự đứng vững (đều là lặp nguyên công thức
  của 3.2/3.6/5.5/3.5). Tầng `vietnamese-current` vắng ở bài này (snapshot chỉ có Pháp Cú); bản Thích
  Minh Châu nguyên bài được đọc như tra cứu toàn văn, không căn lề theo khoá.

  Trùng nguyên văn Pāli TRONG CHÍNH bài: 6 nhóm (3.2/3.4/5.2 · 3.5/5.4/9.4 · 5.3/9.3 · 5.5/9.5 ·
  `Chandarāgo bhagavato natthi.` ×6 · `Suvimuttacitto bhagavā.` ×6), 0 nhóm mà bản Việt khác nhau. Các cặp
  chỉ khác dấu phẩy hoặc chữ hoa của Pāli (3.6 và 11.6, 3.2 và 9.2) được giữ cùng một cách diễn đạt,
  chỉ khác hoa/thường và dấu cuối câu theo Pāli.

  Số Pāli: không có số lượng nào trong bài; “Pañcamaṁ” ở 11.10 = “Thứ năm” (cùng cách với sn35.233 “Thứ
  sáu” và sn35.231 “Thứ tư”).

  Dấu lược: Pāli có 10 chỗ `…pe…` (2.1, 2.2, 3.2, 3.4, 5.2, 5.3, 6.3, 7.2, 9.2, 9.3 — mỗi chỗ đúng một dấu)
  và 3 chỗ `…` trần (11.3, 11.4, 11.7). Mỗi chỗ Việt giữ đúng một `…`, không mở rộng. Hai khoá Pāli kết
  `…pe….` (6.3, 7.2) → Việt kết ` ….`, theo dạng đa số của tầng (398/760). Ba khoá `Na sotaṁ …`, `na ghānaṁ …`,
  `Na kāyo …` dịch thành “Không phải tai …” v.v., chỉ phản chiếu phần đã viết của Pāli (có tiền lệ
  `sn22.99:3.3` “không xem thọ …”). Ngoặc kép và nháy đơn khớp Pāli từng khoá (4 cặp ngoặc kép, 1 cặp nháy đơn).

  Thuật ngữ có số đếm:
  - `saṁyojana` = “sự trói buộc”. Toàn tầng `sn`: “trói buộc” 53, “kiết sử” 17; trong sn35: “kiết sử” 13,
    “trói buộc” 12; khuôn giống hệt ở sn41.1 dùng “sự trói buộc” 19/20. Ở đây saṁyojana là một vật
    đặt cạnh sợi dây của ví dụ hai con bò, nên chọn “trói buộc” để ví dụ và lời nêu cùng một từ.
    Bài anh em sn35.233 dùng “kiết sử”; đây là khác biệt có chủ ý, nên người điều phối cân nhắc thống nhất.
  - `chandarāga` = “ham muốn và tham” (sn35 dùng “ham muốn và tham” 21, “dục tham” 8; sn41.1
    “lòng ham muốn và lòng tham”). Bản Thích Minh Châu dùng “dục tham”.
  - `āvuso` = “hiền giả” (đa số ở sn35.233, sn35.234, sn52.8: “thưa/này hiền giả”).
  - `paññāyati/paññāyetha … sammā dukkhakkhayāya` = “được biết đến / sẽ không thể được biết đến …
    nhằm chấm dứt trọn vẹn khổ đau”. Tiền lệ sn22.96–97 (10 khoá) viết “… như sự chấm dứt trọn vẹn khổ
    đau”; Pāli là cách dativ chỉ mục đích (`dukkhakkhayāya`) nên chọn “nhằm”, ghi lại ở đây vì khác tiền lệ.
  - `Bhagavā` = “Đức Thế Tôn” (273 so với “Thế Tôn” 161 khi Pāli là chủ ngữ ngắn); `paṭisallāna` = “độc cư”
    (15 so với “tịnh cư” 7); `sadda` = “tiếng” (sn: 28 so với 12 “âm thanh”).
  - Tên: Pāli ghi `mahākoṭṭhiko` / `koṭṭhika`; tầng Việt dùng “Mahākoṭṭhita” 19 lần so với “Mahākoṭṭhika”
    8 lần, nên dịch “Mahākoṭṭhita”/“Koṭṭhita” và tên bài “Kinh Koṭṭhita” (tiền lệ “Kinh Koṭṭhita (Hai)”).
    Khối 1.1 dùng lại nguyên văn bản đã publish (2 tiền lệ cùng Pāli).

  Bất định đã ghi: (1) `phusati … phoṭṭhabbaṁ` (10.18) dịch “cảm nhận xúc chạm bằng thân”, khoảng 98 khoá
  tầng dùng “xúc” hoặc “xúc chạm” cho `phoṭṭhabba`, nhưng động từ `phusati` (chạm) không có từ tương
  đương gọn, nên “cảm nhận” có thể hơi rộng hơn “chạm”. (2) 6.2/7.2/8.2 `Yasmā ca kho` dịch “Nhưng vì”
  để lộ thế đối lập với “nếu … thì không thể” ở câu trước; Pāli chỉ có `ca kho`.

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên tiêu chí 10 là
  9,6: đã xác minh JSON hợp lệ, đủ 73/73 khoá, đúng thứ tự Pāli, không rỗng, NFC, không Pāli lọt sang
  Việt, dấu lược và ngoặc khớp Pāli từng khoá. Bốn lệnh `npm run validate`, `npm test`, `npm run check`,
  `npm run build` để coordinator chạy.
