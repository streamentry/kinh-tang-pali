notes:
  - >-
    **Sáu bài này gần như chỉ có uddāna** (bài đố liệt kê tên các bài trong
    phẩm) và lời bạt của người biên tập. Nội dung thật của mỗi bài bị `…pe…`
    lược — tôi dịch đúng phần còn lại, **không** bịa tên các bài mà uddāna nhắc
    tới.
  - >-
    **Ba uddāna được DÙNG LẠI từ bài đã `published` để chúng không lệch nhau:**
    `Tathāgataṁ padaṁ kūṭaṁ, mūlaṁ sārena vassikaṁ` (`sn49.13-22:2.1`–`2.2`)
    dùng lại nguyên văn cho `sn46.143-152`; `Balaṁ bījañca nāgo ca…`
    (`sn47.73-84`) dùng lại cho `sn46.153-164`; `Esanā vidhā āsavo…`
    (`sn50.89-98`) dùng lại cho `sn47.85-94`.
  - >-
    ⚠ **`sn47.63-72:2.2` KHÁC `sn49.13-22:2.2` và `sn46.143-152:2.2`:** Pāli
    viết `mūlaṁ sāro ca vassikaṁ` (*cây sāro*) thay vì `mūlaṁ sārena vassikaṁ`
    (*cây đại có trăng làm trăng*). Tôi dịch đúng từng bản, không dùng lại
    chung.
  - >-
    `pācīna` → *quy tắc đi xuống*, `ninnā` → *quy tắc đi lên*, `samuddato` → *từ
    biển* (0 tiền lệ, đặt mới). `rāgavasena` → *theo lối của tham* (0 tiền lệ,
    đặt mới) — xem `an2.97:1.3`.
  - >-
    **Dùng lại nguyên văn đã `published`:** `nibbindati` → *chán nản* và
    `virajjati` → *ly tham* (`an10.2:1.24`) · `sīlasampadā` → *sự thành tựu về
    giới* (`an3.117:5.1`) · `Kāmesanā`/`Bhavesanā` → *sự tìm kiếm dục / sự tìm
    kiếm hữu* (`an4.38:5.1`) · `anticcānupassī`/`aniccānupassī` → *sống quán vô
    thường* (`an10.60:4.4`) · `mānānusaya` → *tùy miên ngã mạn* (`sn8.4:6.2`) ·
    `antimoyaṁ samussayo` → *thân cuối cùng ấy* (`dhp334-359:4`) · `Moggallāna`
    → *Mục-kiền-liên* (`sn8.10:0.3`) · `Candana` → *Chiên Đàn* (`dhp44-59`) ·
    `anāsavaṁ cetovimuttiṁ paññāvimuttiṁ diṭṭheva dhamme sayaṁ abhiññā
    sacchikatvā upasampajja` → *tự mình chứng tri, chứng ngộ trong hiện tại và
    an trú ở giải thoát tâm không lậu, giải thoát tuệ* (`an3.87:4.6`) ·
    `mālāgandhavilepanadhāraṇamaṇḍanavibhūsanaṭṭhānā` → *đeo hoa, xức hương,
    trang sức, điểm trang* (`an4.198:9.4`) · `hatthigavassavaḷavapaṭiggahaṇā` →
    *thọ nhận voi, bò, ngựa và ngựa cái* (`an4.198:9.13`) · `Tassuddānaṁ` → *Tóm
    lược:* (`an10.80:2.0`).
  - >-
    **Quy ước dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
