notes: |-
  Không có tầng Việt hiện hành để đối chiếu. Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Tầng đối chiếu còn lại là Pāli root và bản Anh Sujato đã ghim. budsas.org chỉ là tham khảo toàn văn, không cấp text cho tầng nào.
  Dấu lược theo đúng luật của tầng Việt: pe-lược của Pāli là MỘT dấu lược, và sau khi bỏ hết pe-lược thì đếm dấu lược còn lại. Chạy trên 315 khoá của lát: 0 khoá lệch. Không có khoá nào để trống trong bản dịch.
  Tên phẩm đo trên toàn tầng sn: 4 tệp cùng phẩm Pupphavagga, cả 4 đều là 10. Phẩm Hoa, không có phân kỳ. Tên bài Aniccasaññāsutta chưa có tiền lệ; đặt mới theo Aniccasutta là Kinh Vô Thường, thêm sở tưởng cho rõ nghĩa của saññā: Kinh Tưởng Vô Thường.
  Coverage Anh 25/25 khoá Pāli có nội dung, tức 100%, và tầng english-project của bài đang trống nên toàn bộ tầng tham khảo là bản Sujato đã ghim, độc lập với người dịch. Mười hai đoạn pe-lược của bài đều là pe-lược Pāli thật, tôi giữ nguyên một dấu lược theo luật của tầng Việt.
  Tra tiền lệ có số đếm: Pāli trùng nguyên văn với 8 khoá đã có bản Việt, 6 khoá dùng lại nguyên văn (Sāvatthinidānaṁ → Tại Sāvatthī 425 lần; uddāna-mở đầu Tassuddānaṁ → Tóm lược 314 lần; Dasamaṁ → Thứ mười 240 lần; và cụm iti rūpaṁ … với iti viññāṇassa … đã có từ 2 đến 5 tiền lệ cho từng vế, tôi dùng lại y nguyên cả 5 vế ở 12.2 đến 12.6). Hai khoá lệch có lý do: 7.1 lohitacandana, tầng có ba cách không cách nào đa số (bát hương đỏ, đàn hương đỏ, chiên đàn đỏ), tôi chọn chiên đàn đỏ vì đúng nghĩa candana; 12.3 tôi viết thường để đồng bộ với 12.4 và 12.5 và 12.6 cùng nằm sau dấu chấm phẩy.
  Mười ví dụ của bài đều mở bằng Seyyathāpi. Hai khoá 7.1 và 8.1 đã có bản dịch bỏ mất vế này; tôi giữ đủ thành Ví như ở cả mười ví dụ, vì bỏ nó là mất một từ của Pāli. Hai cách này cùng tồn tại trong tầng, ghi ra để người điều phối gộp.
  Thuật ngữ: aniccasaññā → tưởng vô thường; kāmarāga, rūparāga, bhavarāga → tham dục, tham sắc, tham hữu; asmimāna → gốc ngã mạn; pariyādiyati → làm cho tan biết; samūhanati → nhổ tận. Tất cả đều có tiền lệ: saññā → tưởng 36 lần, rūparāga → tham sắc, bhavarāga → tham hữu, asmimāna → gốc ngã mạn.
  Bất định đã ghi, không giấu: (1) Cụm uddāna 13.1 đến 13.4 là mười tên bài của phẩm, tôi tra từng tên trong sn22.93 đến sn22.102 rồi dịch theo đúng tên đã có: Dòng Sông, Hoa, Bụt, Phân, Bụi Móng Tay, Thanh Tịch, Vāsījaṭa, Vô Thường; hai bài Gaddulabaddha chưa có bản Việt nên đặt Buộc Chổi theo nghĩa gaddula là chổi quét, và tôi đánh dấu rõ là hai bài. Vāsījaṭa là tên riêng, giữ dấu Pāli và khai vào bộ nhớ tiến trình của harness. (2) 14.4 dutiyo tena vuccatī, tôi hiểu là Trung Bộ Năm Mươi thứ hai, vì 12.9 và 13.5 cho thấy phần này là nửa thứ hai của Trung Bộ; độ chắc trung bình nên ambiguity_integrity chỉ 9.0. (3) 14.3 Pupphavaggena paṇṇāsa, tôi dịch là phần Trung Bộ Năm Mươi nhờ Phẩm Hoa mà hoàn thành.
  Review đối kháng bắt được và đã sửa: 3.1 suýt dịch niddhunāti nicchoṭeti thành rung lắc hai lần theo lối nhày, đã tách rung lắc và đập cho ráo cho đúng ba động từ của Pāli; 5.1 suýt viết tày dài của một gò nhà nhưng bỏ mất chữ đều, đã thêm lại.
