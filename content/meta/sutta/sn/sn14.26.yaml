notes: |-
  Đối chiếu Pāli + English Sujato (20/20 khoá). Chúng sinh hòa hợp và tụ hội theo giới tánh (dhātu): kẻ sát sinh, trộm cắp, tà dâm, nói dối, nói đâm thọc, nói thô ác, nói phù phiếm tụ hội với nhau; người từ bỏ bảy nghiệp ác tụ hội với nhau. Số thứ tự uddāna 'Catutthaṁ' = Thứ bốn.
  
  20 khoá, tất cả đã dịch, không có khoá nào thiếu hay orphan.
  
  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
