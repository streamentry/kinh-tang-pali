notes: |-
  Đợt 19, lát l24. Dịch trọn 83 khoá từ Pāli root đã ghim, đối chiếu English Sujato đã ghim và bản Hòa thượng Thích Minh Châu nguyên bài (mục Tra cứu toàn văn của trang, không có ở mức segment).

  **Coverage English.** Mẫu số = 40 khoá Pāli có nội dung (từ 40 ký tự, bỏ khối `:0`). Sujato phủ 39/40 = 97,5% (chỉ để trống `18.1`, câu chốt dẫn lại `1.x`–`3.1`). Lớp `english-project` đã `published` lấp `18.1` nên cổng tính 40/40, nhưng khoá đó không phải bản đọc độc lập; coverage độc lập vẫn là 39/40, trên sàn 0,80, nên không có blocker coverage và không cần entry `reference-gaps`. Tầng Việt hiện hành của store vắng với bài này (chỉ có Pháp Cú); bản Thích Minh Châu chỉ tham khảo ở dạng nguyên bài.

  **Dùng lại nguyên văn đã `published` (Pāli trùng nguyên văn).** `0.2` ← `sn22.4:0.2` · `1.2` ← `sn22.4:1.2` · `3.1` ← `sn22.4:2.1` · `5.4`–`5.6` ← `sn22.4:4.1`–`4.3` · `18.1` ← `sn22.4:6.1` (cũng trùng `an10.26:7.1`) · `2.1`–`2.3`, `17.1`, `17.3` ← `snp4.9:10.1`–`10.3` (`17.2` chỉ khác chính tả `munisanthavāni`, dịch cùng cách với `2.2`) · `12.3`/`13.3` ← `mn109:7.4` (Pāli cũng trùng `sn22.82:5.4`, bài này chưa dịch) · `0.3` ← `sn35.130:0.3` · `8.2`/`9.2` theo `sn35.241:4.2` (chung vế `gihīhi saṁsaṭṭho … yogaṁ āpajjati`, nhưng không trùng nguyên khoá). Đã dò 18 khoá Pāli (từ 15 ký tự, bỏ qua nháy và dấu câu) trùng với một khoá đã dịch ngoài bài: 16 khoá bản Việt giống hệt, 2 khoá khác (`2.4` và `17.4` so với `snp4.9:10.4`, cố ý, xem Bất định 1). Ngoài ra có 9 cặp Pāli trùng ngay trong bài này (`2.1`/`17.1`, `2.3`/`17.3`, `2.4`/`17.4`, `5.3`/`5.8`, `6.4`/`7.5`, `6.5`/`7.6`, `6.6`/`7.7`, `7.3`/`7.9`, `12.3`/`13.3`); cả 9 cặp bản Việt giống hệt.

  **Bất định 1 — `Kathaṁ na viggayha janena kayirā` (2.4, 17.4).** Đọc theo nghĩa đen, `kathaṁ` có thể là từ hỏi *thế nào* — `snp4.9:10.4` (đã `published`) dịch *sao còn xung đột với người đời?*. Nhưng chính bài kinh tự giải ở `14.1`–`15.4`: `kathaṁ viggayha janena kattā hoti` / `evarūpiṁ kathaṁ kattā hoti`, trong đó `kathaṁ` là danh từ *lời nói, lời bàn luận* (tân ngữ của `kattā`), và đoạn mẫu ở `14.3` là *lời tranh cãi*. Sujato (*they wouldn't get in arguments with people*) và Hòa thượng Thích Minh Châu (*chấm dứt mọi tranh luận, bất cứ với một ai*) đều đọc như khẳng định. Vì vậy bài này dịch *chẳng nói lời tranh cãi với người đời* để kệ khớp phần giải; cách đọc hỏi của `snp4.9:10.4` không bị bác bỏ ở đây, chỉ không được chọn do văn cảnh bài kinh. Cần người biên tập quyết có thống nhất `snp4.9:10.4` hay không.

  **Bất định 2 — `oka` / `niketa`.** Kho đã `published` ở `snp4.9:10.1` dịch `Okaṁ pahāya aniketasārī` là *Từ bỏ trú xứ, du hành không nhà*, tức `oka` = *trú xứ*, `niketa` = *nhà*. Bài này giữ đúng ánh xạ đó cho cả hai bộ `okasārī/anokasārī` (*du hành có/không trú xứ*) và `niketasārī/aniketasārī` (*du hành có/không nhà*) để kệ và phần giải thống nhất. Hòa thượng Thích Minh Châu nguyên bài đảo lại (`oka` = *nhà*, `niketa` = *trú xứ*), Sujato dịch `oka` là *bastion*, `niketa` là *abode*; `dn30` dịch `niketaṁ` là *chỗ trú*. Cả ba tầng dùng khác nhau nên hai từ này cần được thống nhất toàn kho.

  **Bất định 3 — ngữ pháp `…niketavisāravinibandhā` (6.2, 6.7, 7.2, 7.8).** `vinibandhā` ở `7.2`/`7.8` là số nhiều đứng làm chủ ngữ của `pahīnā` (*những sự trói buộc … đã được từ bỏ*). Ở `6.2`/`6.7` nghĩa đen cũng cho chủ ngữ là *sự trói buộc* được gọi là `niketasārī`, trong khi phần kết `6.8` (`niketasārī hoti`) nói về một người. Theo Sujato và bản Thích Minh Châu, bài này đọc `6.2`/`6.7` là *bị trói buộc … thì được gọi là*, còn `7.2`/`7.8` giữ danh từ *những sự trói buộc*. `visāra` dịch *sự lan rộng*; `nimittanikete` dịch *nhà là tướng …* (Sujato *the abodes that are the features of …*; Thích Minh Châu *an trú chấp trước vào … tướng*).

  **Thuật ngữ, đã đo tiền lệ.** `ucchinnamūlā tālāvatthukatā anabhāvaṅkatā āyatiṁ anuppādadhammā` → *đã bị chặt tận gốc, làm như gốc chà là, làm cho không còn hiện hữu, là pháp không sinh khởi trong tương lai*; đo trên 111 khoá có `anabhāvaṅkatā`: *không còn hiện hữu* 32 · *tiêu diệt* 23 · *hủy hoại* 10; `tālāvatthukatā` → *gốc chà là* 20 · *thốt nốt* 12 · *cây cọ* 8 · *gốc tala* 4 (đúng ở `sn22.25`/`sn22.112`, nhưng `sn35.104`, `sn35.103`, `an3.69` đều *chà là*); `pahīnā` → *từ bỏ* 27 · *đoạn tận* 18. Vế `chando … anusayā` theo `sn22.112`/`sn23.10` (8 nơi: *ham muốn, tham, niềm vui, khát ái, cầu cạnh, chấp thủ, trú lập của tâm, ám ảnh, thiên hướng*), khác `sn22.4:3.1` (*hỷ … tùy miên*, 2 nơi). `avigatapariḷāho` → *nhiệt não*: trong đúng cụm `avigatacchando … avigatapariḷāho` kho đang có *say mê* 8 · *nóng rực* 4, nhưng toàn kho cho `pariḷāha` *nhiệt não* 76 · *thiêu đốt* 54 · *nóng bức* 24, và Thích Minh Châu nguyên bài cũng viết *nhiệt não*; chọn *nhiệt não* vì *say mê* hẹp và lệch nghĩa Pāli (*nóng bức, thiêu đốt*), cần thống nhất. `santhavajāto` → *đã sinh thân cận* (`santhava` = *thân cận* ở `mn86`, `snp4.9`). `purakkharāno`/`apurakkharāno` → *có/không mong cầu phía trước* (đúng `snp4.9:10.3`); `ritto`/`aritto` → *rỗng không dục lạc*/*chưa rỗng không dục lạc* (đúng `snp4.9:10.3`); `viggayha` → *tranh cãi* (`ud6.4`). Công thức tranh luận `14.3` theo `dn33:1.6.3`/`mn104:2.3`: *pháp và luật* (4 nơi) so với *giáo pháp và giới luật* (3 nơi), *mạch lạc* (4) so với *nhất quán* (3), *lật ngược* (6) so với *đảo ngược* (1); thứ tự câu ở `14.3` đặt `sahitaṁ me, asahitaṁ te` sau cặp `pure vacanīyaṁ … pure avaca`, khác `dn33`/`mn104` nên bản Việt theo thứ tự Pāli của bài. `bhante` → *Thưa Tôn giả* (đúng `sn22.4:1.4`); `aṭṭhakavaggiye` → *phẩm Tám Kệ* (`snp4`, `ud5.6`); `āyasmā mahākaccāno` → *Tôn giả Mahākaccāna*.

  **Số Pāli.** Bài không có số lượng cần tính; không gặp `sahassa`, `sata`, `navuti`, `tālīsa`, `sattati` hay `Tiṁsakappasahassa`.

  **Dấu lược.** Pāli có `…pe…` ở `6.3` và `15.3`, Việt giữ đúng một `…`. Pāli có `…` trần ở `5.4`–`5.6`, `6.4`–`6.6`, `7.4`–`7.7`, Việt cũng một `…` mỗi khoá. Không có `(…)` trần trong bài. Nháy đơn `‘’` và ngoặc kép `“”` khớp Pāli từng khoá: 83/83 khoá.

