notes: |-
  Dịch từ Pāli root của commit bilara đã ghim, đối chiếu trực tiếp với bản dịch tiếng
  Anh của Bhikkhu Sujato tại cùng commit (tầng `english-project` của chính dự án có
  hai khoá lấp chỗ trống ở `8.4` và `11.4` và đã `published`). **Tầng Việt hiện hành (Hòa
  thượng Thích Minh Châu) không có ở bài này** — bilara tại commit đã ghim chỉ phân
  phối Pháp Cú cho tiếng Việt, đây là giới hạn của bản chụp upstream, không phải thiếu
  sót của kho.
  
  **BÁM SÁT `sn54.11` — 12 khoá lấy nguyên văn câu Việt** (bài ngay trước, cùng Tăng Bộ,
  cùng phẩm, đã publish, và là bài mà `sn54.12` chính là lần lặp thứ hai trong
  `peyyāla`): `6.1`–`6.4` ← `sn54.11:1.1`–`1.4`; `7.1`–`7.4` ← `sn54.11:2.1`–`2.4`;
  `8.1`–`8.4` ← `sn54.11:3.1`–`3.4`; `11.1`–`11.4` ← `sn54.11:4.1`–`4.4`.
  **Phải nói rõ: các cặp này KHÔNG trùng PāLI từng chữ** — bài này thêm từ gọi
  `āvuso mahānāma` vào giữa, đổi `:` cuối câu thành `—`, và ở `8.2`/`8.4`/`11.2`/`11.4`
  **bỏ luôn dấu nháy quanh ba tên gọi** mà `sn54.11` có (`‘ariyavihāro’ itipi …`).
  Tôi giữ dấu nháy của `sn54.11` vì đó là cách đọc tự nhiên khi nêu ba tên gọi, và vì
  bỏ đi thì ba tên gọi sẽ lẫn với câu kể. Chỉ có **`7.5` là Pāli trùng từng chữ**
  (1 khoá) nên tôi dùng lại y nguyên. Riêng `7.6` và `7.7` tôi **không** dùng lại
  nguyên văn `sn54.11:2.6`–`2.9`: Pāli bài này không có dấu nháy quanh
  `‘dīghaṁ assasāmī’`, và không có khoá vế *ngắn* (`rassaṁ`), nên tôi dịch thành *Ta
  tuệ tri rằng …* thay vì *Ta tuệ tri: ‘…’*.
  **Số khoá trùng NGUYÊN VĂN đo được:** 5 từ bài khác (`0.2`, `2.4`, `4.2`, `7.5`,
  `11.7`) + 5 lặp trong bài = **10/50**.
  
  **Vế danh sách A-la-hán ở `4.1` và `5.1` dựng trên `sn54.11:3.6`** (cùng tám vế
  `khīṇāsavā … sammadaññāvimuttā`, 1 khoá) → *các lậu hoặc đã tận, phạm hạnh đã thành,
  việc cần làm đã làm, gánh nặng đã đặt xuống, mục đích tối hậu đã đạt được, hữu kiết
  sử đã dứt sạch, đã giải thoát nhờ chánh trí*.
  
  **Năm chướng ngại, dùng khuôn của `sn45.177` và `sn46.38` (2 khoá, cùng Tương Ưng):**
  `chướng ngại dục tham, chướng ngại sân hận, chướng ngại hôn trầm thụy miên, chướng
  ngại phóng dật hối quá, chướng ngại sự nghi ngờ` — `nīvaraṇa` đếm được *chướng ngại*
  213 khoá, đây là cách dùng của tầng (nhóm khác dùng *triền cái* như `dn13`/`an5.52`).
  Đuôi `ucchinnamūlā tālāavatthukatā anabhāvaṅkatā āyatiṁ anuppādadhammā` → *chặt tận
  gốc, làm như gốc chà là, tiêu diệt, không thể sinh lại trong tương lai* (5 khoá:
  `sn41.5:5.7`/`:5.11`/`:5.14`, `sn41.7`). `Katame pañca?` → *Thế nào là năm?* (đa số
  128 khoá).
  
  **Thuật ngữ, kèm số đếm toàn tầng:** `sekha` → *bậc hữu học* (99); `tathāgata` →
  *bậc đã giác ngộ* (41 khoá có *đã giác ngộ*; *bậc đã giác ngộ* 0 vì mới ở đây — tôi
  đặt cặp với *bậc hữu học* cho cân đối); `vihāra` → *sự an trú* (115 khoá; *chỗ an
  trú* 9 — `sn54.11` dùng *chỗ an trú* khi đây là danh xưng, tôi dùng *sự an trú* khi
  đây là hành vi); `āvuso` → *đạo hữu* (223); `Mahānāma sakko` → *ông Mahānāma người
  Sākya* (nhóm *người Sākya* 3 khoá `an11.12`/`an8.25`/`mn14` hơn *người Sakka* 2 khoá
  `sn55.21`/`sn55.22`; `sakko` là người bộ tộc Thích-ca nên *Sākya* chính xác hơn);
  `nigrodhārāma` → *tu viện Cây Đa* (5 khoá `an11.12`/`an8.25`/`mn14`/`mn18`/`mn122`;
  *tu viện Cây Bàng* chỉ 2 khoá `sn55.21`/`sn55.22` — và *cây Bàng* không phải
  `nigrodha`, nên tôi theo đa số 5 với 2); `Lomasakaṅgiya` giữ nguyên dấu (13 khoá).
  
  **`10.1` giữ cả hai vế của Pāli, khác `sn54.11:3.6`:** ở bài kia Pāli là
  `diṭṭhadhammasukhavihārāya` (một từ), ở đây là `diṭṭheva dhamme sukhavihārāya`
  (hai từ), nên tôi dịch đủ là *sẽ đưa đến sự an trú an lạc ngay trong hiện tại* — theo
  `mn107` (1 khoá) — thay vì *hiện tại lạc trú* của `sn54.11`. `satisampajaññāya` →
  *niệm cùng tỉnh giác*; cụm `satisampajaññāya` có 10 khoá tiền lệ, đa số dùng *niệm và
  tỉnh giác* (`mn107`, `an4.41`).
  
  **Chỗ 0 tiền lệ, tôi dịch mới:** `0.3` `Kaṅkheyyasutta` → *Kinh Nghi Ngờ* (theo Sujato
  *In Doubt* và theo cách đặt tên *Kinh* + cụm từ của tầng). `5.2` và `11.5`
  `Tadamināpetaṁ … / Iminā kho etaṁ … pariyāyena veditabbaṁ yathā—` → *Và còn cách này
  nữa … có thể hiểu được như thế này—* (0 tiền lệ).
  
  **Tầng Anh đủ 38/38 = 100%** (đo bằng đúng công thức `src/lib/canon/reference.ts`;
