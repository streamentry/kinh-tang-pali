  - >-
    0 tiền lệ, đặt mới, ghi kèm lý do: `Paṭhamadevapadasutta` → *Kinh Bước Chân Của Chư Thiên (Nhất)* (Sujato *the path of the gods*; 0 tiền lệ vì `sn55.35` chưa dịch) · `devapada` → *bước chân của chư thiên* · `avisuddhānaṁ sattānaṁ visuddhiyā apariyodātānaṁ sattānaṁ pariyodapanāya` → *của bảy chúng chưa thanh tịnh, làm cho bảy chúng ấy được thanh tịnh, đưa bảy chúng chưa được hoàn toàn ra khỏi đến bảy chúng được hoàn toàn ra khỏi* (0 tiền lệ trong kho — đây là công thức của `Khandha-samyutta` về bảy uẩn, chưa có bài nào trong dự án dịch nó).
  - >-
    Lượt review đối kháng: vế dài `avisuddhānaṁ sattānaṁ …` bị lặp **bốn lần** trong Pāli (`1.2`, `2.4`, `4.2`, `4.3`) và bản Việt lặp đủ bốn — cắt bớt chỗ nào là mất một đối xứng của bài, đã đối chiếp từng khoá.
  - >-
    Bất định đã ghi: `pariyodapanāya` dịch *được hoàn toàn ra khỏi* (`pari-` = hoàn toàn, `odapana` = đưa ra khỏi), đối xứng `apariyodātānaṁ` = *chưa được hoàn toàn ra khỏi*.
