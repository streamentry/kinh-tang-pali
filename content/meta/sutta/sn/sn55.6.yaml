notes: |-
  Đủ 111/111 khoá, thứ tự khoá = thứ tự Pāli, dịch từ Pāli root; không khoá nào ngoài `all`.
  **Coverage English (đo thật):** mẫu số = 75 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0` và tiêu đề). Sujato phủ 54/75 = 0,72 (< 0,80). 21 khoá Sujato để trống: `1.6`, `1.7` (lời dẫn lại ở `1.2`–`1.3`), các khoá lặp của chuỗi địa danh `6.4`–`13.1` (Sujato nén chuỗi bằng một dấu `…` sau `6.2`) và hai khoá công thức `17.3`, `18.2` (`itipi so bhagavā …pe…`). Lớp `english-project` chưa có tệp cho sn55.6, nên không có phần lấp nào được cộng. Vì vậy `triangulation` = 7,5 (≤ 8,0) và bài giữ `draft` kèm blocker; phần Pāli ở các khoá để trống tự đứng vững (chuỗi lặp có cấu trúc giống hệt các khoá đã được Sujato dịch ở `4.2`–`5.6`, `8.5`–`9.5`). Không có tầng Việt hiện hành cho bài này (snapshot chỉ có Pháp Cú); bản Thích Minh Châu nguyên bài (tra cứu toàn văn) được đọc để đối chiếu nghĩa. Bài thuộc diện cần `npm run reference:gaps` sau khi lớp `english-project` lấp xong, hoặc ghi nhận gap.
  **Dùng lại nguyên văn.** Dò 111 khoá với toàn tầng: 15 khoá có Pāli trùng nguyên văn ở bài khác (1.139 cặp); 11 khoá dùng lại nguyên văn bản Việt có sẵn (`0.2`, `1.1`, `17.1`, `17.3`/`18.2` = `sn55.24:7.2`, `17.4`/`18.3`, `17.5`/`18.4`, `18.11`). 4 khoá có Pāli trùng mà bản Việt cố ý khác (`1.2`, `1.3`, `1.6`, `1.7` so với `sn55.54:1.2`–`1.6`: chỉ khác *Đức Thế Tôn* thay *Thế Tôn* cho thống nhất với toàn bài; `3.2` theo `dn16:4.21.1`). Trong chính bài: 9 nhóm Pāli trùng, 0 nhóm có bản Việt khác nhau.
  **Thuật ngữ, kèm đếm.** `thapati` → *thợ cả*: tầng có `mn59`/`mn127` (19 khoá) dùng *thợ cả*, `mn78` (70 khoá) dùng *đốc công*; chọn *thợ cả* vì ngữ cảnh gần `mn127` (người làm việc cho nhà vua). Sujato *chamberlain*, bản Thích Minh Châu *thợ mộc*. `sambādho gharāvāso rajāpatho` → *chật hẹp, đầy bụi bặm* (`dn2:41.4`, `dn10`, `mn27`, `mn51`, `mn125`, `an4.198`: 6 khoá *chật hẹp* so với 2 khoá *chật chội* ở `mn94`, `mn112`); `abbhokāso pabbajjā` → *đời xuất gia rộng mở* (4 khoá; `dn2`, `dn10` thêm *như hư không*). `catūhi dhammehi samannāgato … sotāpanno` → *đầy đủ bốn pháp thì là bậc nhập lưu, không rơi vào ác đạo, chắc chắn, hướng về giác ngộ* (sn55.2, .11, .30, .47, .48, .49 cùng dạng). `buddhe aveccappasādena samannāgato` → *thành tựu lòng tịnh tín bất động nơi Đức Phật* (`sn55.7`, `.8`, `.12`, `.28`, `.30`). `Katamehi catūhi?` → *Thế nào là bốn?* (71/90 khoá). `Tasmātiha` → *Vì vậy* (145 khoá, so với *Do vậy* 31). `yassadāni kālaṁ maññathā` → *tùy thời mà làm* (`dn9:30.5`). `kappetvā` (nāgā opavayhā) → *sửa soạn yên cương*; không có tiền lệ cho `kappetvā` với voi trong tầng (0 khoá). `anattamanatā … domanassaṁ` → *không vui và ưu phiền*, `attamanatā … somanassaṁ` → *vui mừng và hoan hỷ*; `anappakā … anappakaṁ` → *không nhỏ* (tầng có *không ít* ở `sn35.74:5.1`, `sn22.88:3.3`; chọn *không nhỏ* cho khỏi nhập nhằng với *không vui*). `bhaginiyo` → *các nàng ấy*; `pajāpatiyo` → *các phu nhân*; `rājakaññā` → *vương nữ* (không tiền lệ trực tiếp: 0 khoá trong tầng cho cụm này).
  **Số Pāli, tự tính:** `dvīhatīhaṁ` = 2 + 3 → *hai, ba ngày*; `temāsa` = ba tháng (ti + māsa); `catūhi dhammehi` = 4 (Phật, Pháp, Tăng, bố thí: 17.2–17.6 nêu đủ bốn mục). Hai người (Isidatta, Purāṇa) → *hai thợ cả*. Phép kiểm số bằng máy (9 từ khoá đã xác lập, có hiệu chuẩn) không chứa từ khoá nào xuất hiện trong Pāli của bài này nên **không đo được gì cho bài này**; các số trên là tự tính tay.
  **Bất định, ghi tại đây chứ không thêm vào thân kinh.** (1) `thapatayo`: nghĩa *thợ cả/kiến trúc sư* hay chức quan hầu cận như Sujato *chamberlain* không phân xử được chỉ bằng bài này; chọn nghĩa nghề (theo từ điển và tiền lệ). (2) `Alañca pana vo, thapatayo, appamādāya` (`14.2`, `16.2`): Pāli không có chủ ngữ; dịch *thế là đủ để các ông không phóng dật* theo Sujato (*Just this much is enough for diligence*) và Thích Minh Châu (*Như vậy là vừa đủ… để các Ông không có phóng dật*); `Tasmātiha` đi trước đó đọc như liên từ chuyển ý, không thêm quan hệ nhân quả ngoài Pāli. (3) `bhaginī` (`15.2`–`15.5`) nghĩa đen *chị em*; dịch *các nàng ấy* vì đây là cách gọi kính trọng dành cho các phu nhân của vua (`pajāpatiyo`, `15.1`); Sujato giữ *sisters*, Thích Minh Châu *các cung phi*. (4) `ekaṁ purato ekaṁ pacchato` (`15.1`): Pāli không nói *trước/sau* ai; giữ nguyên *một người ở phía trước, một người ở phía sau*, không thêm *của chúng con* (Sujato thêm *in front of us*) và không nói ngồi ở đâu (Sujato *on the elephants*). (5) `Yesaṁ no bhagavā evaṁ pajānāti` (`18.10`): mệnh đề quan hệ dùng như lý do (*vì … biết rõ chúng con như vậy*), theo Sujato *in that the Buddha understands us like this*; Thích Minh Châu nguyên bài ghi *những người như chúng con*, không khác nghĩa. (6) `anappakā` ở `8.5`, `13.5`: Sujato bỏ qua từ này (viết *sad and upset* như các khoá trước); bản Việt giữ nghĩa *không nhỏ*, vì Pāli phân biệt hai mức. (7) `1.2`, `1.6`: *nghĩ rằng* ở `1.2` là cách đọc dẫn lời đã có ở `sn55.54:1.2`; Pāli chỉ có dấu hai chấm và trích dẫn. (8) `kappetvā` (`15.1`): *sửa soạn yên cương* theo Sujato *harness and prepare*; không tiền lệ trong tầng. (9) `Sādhuka` (`1.4`) là địa danh theo Sujato (*Sādhuka*), Thích Minh Châu *Sàdhuka*; giữ nguyên dạng Pāli. (10) Không có `(…)` trần ở khoá nào của bài. Mọi dấu `…` ở `17.3`–`17.5`, `18.2`–`18.4` đều ứng với đúng một `…pe…` của Pāli.
  **Lỗi bản nháp đã bắt:** bản đầu dịch `itipi so bhagavā …pe…` theo `sn55.30:2.4` thành *Thế Tôn ấy là bậc A-la-hán …*, đã chèn thêm *A-la-hán* vào chỗ Pāli lược; đổi sang dạng `sn55.24:7.2` (*Đây là Thế Tôn …*) vốn không thêm từ. Bản đầu cũng dùng *không ít nỗi không vui* ở `8.5`, đọc nhập nhằng như phủ định đôi; đã đổi thành *không vui không nhỏ*.
  **technical_integrity = 9,6** vì bốn cổng kỹ thuật do coordinator chạy, tôi không được chạy (`npm run validate|test|check|build` bị cấm trong lát này): (1) `npm run validate` (qua `npm run build`) — kiểm metadata, scorecard, `blocking_errors` và nội dung; (2) `npm test` — unit tests; (3) `npm run check`; (4) `npm run build`. Ngoài ra `npm run reference:gaps:check` phải xanh sau khi chạy lại `npm run reference:gaps`.
