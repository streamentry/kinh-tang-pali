notes: |-
  Dịch từ Pāli root của commit bilara đã ghim, đối chiếu trực tiếp với bản dịch tiếng
  Anh của Bhikkhu Sujato tại cùng commit (tầng `english-project` của chính dự án có
  ba khoá lấp chỗ trống ở `3.1`–`3.3` và đã `published`). **Tầng Việt hiện hành (Hòa
  thượng Thích Minh Châu) không có ở bài này** — bilara tại commit đã ghim chỉ phân
  phối Pháp Cú cho tiếng Việt, đây là giới hạn của bản chụp upstream, không phải thiếu
  sót của kho.
  
  **DÙNG LẠI NGUYÊN VĂN — đo được 8/50 khoá** (6 khoá trùng nguyên văn ở bài khác:
  `0.2`, `1.1`, `1.2`, `6.3`, `7.1`, `11.5`; cộng 2 khoá lặp nguyên văn trong chính
  bài: `3.3` và `3.4`). Chi tiết:
  `1.2` trùng nguyên văn `sn7.21` (1 khoá) → *Rồi Tôn giả Ānanda vào buổi sáng, đắp
  y, mang bát y, đi vào Sāvatthī khất thực.*
  `3.3` Pāli **trùng từng chữ** với `1.4` (cùng danh sách xe trắng) nên tôi dùng lại
  nguyên văn của chính `1.4` cho cả hai; `3.4` lặp `1.5`. `1.1` = *Tại Sāvatthī.*
  (414 khoá).
  `6.3` = *Đức Phật đã nói như vậy.* (102 khoá, đa số toàn tầng). `7.1` = *Nói như
  vậy xong, bậc Thiện Thệ, bậc Đạo Sư lại nói thêm:* (11 khoá, trong đó `sn45.34` —
  cùng Tăng Bộ). `4.3` và `6.2` dùng *chiến thắng tối thượng trong chiến trận* cho
  `anuttaro saṅgāmavijayo` (1 khoá `dn1`). `3.7` dùng *trong Giáo pháp và Giới luật
  này* cho `imasmiṁ dhammavinaye` (2 khoá `an7.42`/`an7.43`). `1.3` và `3.2` dựng theo
  `mn27`/`mn99` — cùng cảnh Bà La Môn Jānussoṇi đi xe trắng toàn bộ do ngựa cái kéo
  (2 khoá): *trên một cỗ xe trắng toàn bộ do ngựa cái kéo*.
  
  **⚠ BẤT ĐỊNH LỚN NHẤT CỦA BÀI NÀY — `brahmayāna`, tôi chọn *cỗ xe của Phạm
  thiên*, và đây là lý do.** `brahmayāna` có hai nghĩa có thể tranh: (1) nghĩa kỹ
  thuật — *xe của Phạm thiên*, tức Thánh đạo tám ngành, đây là nghĩa gốc của từ và là
  nghĩa ở `4.3`, `6.2`, `11.2`, cũng như ở `dn27 Brahmayāna`; (2) cách đọc theo lớp
  ngữ cảnh — *xe của một Bà La Môn*, vì ở `1.6`–`1.7` và `3.5`–`3.7` đó là tiếng
  khen của đám đông khi thấy một Bà La Môn ngồi xe trắng (chữ `brahma` trong Pāli
  khác `brāhmaṇa` = Bà La Môn). **Tôi chọn một cách dùng duy nhất — *cỗ xe của Phạm
  thiên* — ở cả tám khoá**, vì: `Đức Thế Tôn` dùng đúng ba danh xưng *có sẵn trong
  truyền thống* cho Thánh đạo tám ngành (`anuttaro saṅgāmavijayo` chắc chắn là tên
  gọi cổ điển, không phải lời khen của đám đông), dự án đã quyết định
  `brahmavihāro` → *chỗ an trú của bậc Phạm thiên* (`sn54.11:3.2`), và cách dùng
  “*Bà La Môn*” cho Thánh đạo tám ngành sẽ **đọc sai về mặt giáo lý**. Hệ quả tôi
  chấp nhận: `1.6`/`3.5` đọc thành *Phạm thiên quá, các ông, cỗ xe này* — nghe như
  lời thán ngợi, không phải lời định danh. **Người biên tập nên xác nhận**; nếu chọn
  hướng kia thì phải sửa đồng thời cả `dn1` và `sn54.11` cho khớp.
  
  **Danh sách tám yếu tố `5.1`–`5.8` giữ đúng khuôn của `sn45.56`, `sn45.70`,
  `sn45.84`, `sn45.103`, `sn45.109`, `sn45.139`** (6 khoá cùng Tăng Bộ, đã dịch):
  `bhāvitā bahulīkatā` → *được tu tập, được làm cho sung mãn*; `pariyosānā hoti` →
  *làm viên mãn việc …*; `rāgavinayapariyosāna` → *việc hướng đến sự khuếch tán và
  loại bỏ tham*. **Tám tên yếu tố lấy theo đa số toàn tầng, có số đếm:** chánh kiến
  (691), chánh tư duy (186), chánh ngữ (157), **chánh nghiệp (152) hơn chánh hạnh
  (46)** cho `sammākammanta`, chánh mạng (146), chánh tinh tấn (154), chánh niệm
  (580), chánh định (369), Thánh đạo tám ngành (120).
  
  **Kệ ngựu xe `8.1`–`11.4` (17 câu) — không câu Pāli nào trùng với bài khác, tôi dịch
  mới và ghi lý do.** Quét cả 5 bộ: `Ratho sīlaparikkhāro`, `jhānakkho cakkavīriyo`,
  `Upekkhā dhurasamādhi`, `anicchā parivāraṇaṁ`, `Abyāpādo avihiṁsā`, `viveko yassa
  āvudhaṁ`, `Titikkhā cammasannāho`, `yogakkhemāya vattati`, `Etadattani sambhūtaṁ`,
  `brahmayānaṁ anuttaraṁ`, `Niyyanti dhīrā lokamhā`, `aññadatthu jayaṁ jayan`,
  `Sati ārakkhasārathi`, `Dhammā yuttā sadā dhuraṁ` đều 0 khoá trùng (riêng
  `Hirī īsā mano yottaṁ` có 2 khoá: `sn7.11:4.3` *Hổ thẹn là tay cầm, tâm là dây,*
  và `snp1.4:6.3` *Tàm là cây cột ách, ý là dây thừng,* — **hai bản đó lệch nhau**, và
  `īsā` là roi cương chứ không phải tay cầm, nên tôi dịch *Hổ thẹn là roi cương, tâm là
  dây buộc,*). Những câu dịch mới: `9.3` → *Sự thăng bằng và định là đội cày*;
  `9.4` `anicchā` → *sự không thèm muốn* (chỉ 4 khoá tiền lệ trong toàn tầng; `anicchā`
  ở nghĩa bổ nghĩa `upekkhā` là *không thèm*), `parivāraṇaṁ` → *lớp vải phủ*;
  `10.1` → *Lòng không oán ghét, lòng không gây hại* (đếm được *không hận* 19 và
  *không gây hại* 23); `10.2` `āvudhaṁ` → *vũ khí* (58); `10.3` `cammasannāho` →
  *bào hiền, là giáp*; `10.4` → *để đi tới chỗ an toàn khỏi kiềm cào*; `11.3` `dhīrā`
  → *kiên định* (37); `11.4` `aññadatthu jayaṁ jayan` → *rời sang ở nơi khác, chắc
  chắn thắng trận*.
  
  **Chỗ khác 0 tiền lệ:** `0.3` `Jāṇussoṇibrāhmaṇasutta` → *Kinh Bà La Môn Jāṇussoṇi*.
  Chính tên `Jāṇussoṇi` tôi dùng dấu chấm dưới `ṇ` như Pāli `jāṇussoṇi`, vì toàn
  tầng đếm *Jāṇussoṇi* 22 với *Jānussoṇi* 17 (thiếu dấu ở bản thiểu số). `2.1`
  (0 tiền lệ) dựng từ cùng công thức đã có ở `sn36.17:1.1` (*đi đến … đảnh lễ … ngồi
  một bên … bạch*). `3.2` bỏ hạt nhấn `khvāhaṁ` (toàn tầng 46 khoá chia 37 cách, không
  có cách nào chiếm đa số) — mất nhấn, không mất nghĩa. `6.1` `pariyāyena veditabbaṁ`
  → *cần phải hiểu được theo cách này* (0 tiền lệ).
  
