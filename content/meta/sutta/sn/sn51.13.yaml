notes:
  - >-
    Tên bài `Chandasamādhisutta` → *Kinh Định Do Dục*, theo từ vựng `chandasamādhi` của bài liền kề `sn51.12:1.3`. Tên phẩm `Pāsādakampanavagga` → *2. Phẩm Vui Vẻ* khớp Pāli tuyệt đối với `sn51.12:0.2` và `sn51.16:0.2`.
  - >-
    **2 khoá có Pāli trùng nguyên văn và dùng lại nguyên văn** (đo bằng script): `0.2` (tên phẩm) và `4.8` ← `an10.103:2.5` (*Thứ ba.*). Bảy khoá còn lại của công thức `chandaṁ janeti …` là **cùng Pāli, cùng công thức** nhưng bản Việt đã có trong tầng khác nhau: `sn49.1-12:1.6–1.8` (bắt đầu bằng *Vị ấy khởi lên ước muốn…*) và `dn33:1.11.11–.13` (bắt đầu bằng *Tỳ-kheo khởi ý muốn…*). Ở bài này chọn một cách duy nhất cho cả bảy khoá — theo `dn33` — vì `dn33` là bản dài đầy đủ nhất, phủ đủ cả bốn vế, và có đủ ba tầng Anh đã ghim. `2.3`, `3.3`, `4.3` giữ đúng một `…` theo BRIEF_VI3 §10.1 vì Pāli có `…pe…`.
  - >-
    **Sai lệch thuật ngữ có chủ ý, cần người biên tập gộp:** `chanda` / `chandasamādhi` dịch *dục* /*định do dục* để khớp `sn51.12:1.3` (*định do dục và hành cần nỗ lực*) — cùng phẩm, bài liền kề. Nhưng Sujato dịch *Immersion Due to Enthusiasm*, và `chanda` ở đây nghĩa là *hứng thú / ước muốn tinh tấn* chứ không phải *dục trần*. `padhānasaṅkhārā` cũng theo `sn51.12` là *hành cần nỗ lực*. Ưu tiên giữ nhất quán với bài đã `published` cùng phẩm; nếu người biên tập chọn theo Sujato thì phải sửa cả `sn51.12` và bài này cùng lúc. Ba tên tứ định còn lại khớp nguyên văn với `sn51.12`: `vīriyasamādhi` → *định do tinh tấn* · `cittasamādhi` → *định do tâm* · `vīmaṁsāsamādhi` → *định do khảo sát*.
  - >-
    Bất định đã ghi: `iddhipāda` → *căn cứ của thần thông*. `sn51.12:1.3` đã gộp cụm `chandasamādhippadhānasaṅkhārasamannāgataṁ iddhipādaṁ` thành *như ý túc*, nhưng ở bài này Pāli tách rõ `chandasamādhi, ime ca padhānasaṅkhārā— … samannāgato iddhipādo`, nên phải dịch `iddhipādo` là *căn cứ của thần thông* (`iddhi` = *thần thông*, theo `sn51.12:3.1`). 0 tiền lệ cho `iddhipāda` trong tầng Việt. `ekaggatā` → *sự nhất tâm của tâm*; 0 tiền lệ.
  - >-
    Cấu trúc nháy kép: `1.1` mở → `4.7` đóng `”ti.`, đúng như Pāli (chỉ có một cặp ở toàn bài). Cân trên toàn bài 34 khoá.
  - >-
    Quy tắc dấu lược của BRIEF_VI3 §10: mọi khoá Pāli có `…pe…` hoặc `…` đều giữ **đúng một** `…`, không mở rộng; không khoá nào nén bằng `…` cả khi Pāli viết đủ. Đã đếm từng khoá. Coverage Anh đo được: 20/20 = 100%
  - >-
    Tầng `vietnamese-current` vắng: tại commit đã ghim, bilara chỉ có Pháp Cú cho tiếng Việt, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Ba tầng tham khảo còn lại là Pāli root (authority) + `english-sujato` đã ghim + `english-project` (lớp lấp của chính dự án, chỉ tính khi `published`).
  - >-
    Bốn cổng kỹ thuật của AGENTS.md: `npm run validate`, `npm test`, `npm run check` và `npm run build`. **Agent lát này KHÔNG chạy bốn lệnh đó** — BRIEF_VI3 §7 và lệnh của người điều phối cấm chạy `npm run validate|test|build|check`. Những gì đã chạy và xanh: `_hvi.py` (`save_vi` → `kiểm`) cho cả 9 bài — đủ khoá trong `all`, không thừa, NFC, không trùng nguyên văn Pāli (trừ 0.1 theo quy ước), không Pāli lọt, số dấu lược khớp từng khoá, nháy kép cân trên cả bài; quét lại 306 khoá bằng script độc lập; `notes` và `blocking_errors` parse sạch bằng thư viện `yaml` của kho. Cổng thật còn lại là CI (`.github/workflows/ci.yml`), nên `technical_integrity` chỉ 9.6 chứ không 10.
