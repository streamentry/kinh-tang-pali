    · Ngoặc kép cân trên cả bài (đếm cả `“` và `”` toàn bài, kể cả ngoặc lồng nhau), 0 lỗi. NFC toàn bộ 0 lỗi. Không có khoá rỗng, không có `(…)` khoá chưa dịch, không có khoá tràn. Số khoá 39 = 39.
    · Dùng lại NGUYÊN VĂN khi Pāli trùng tuyệt đối, đối chiếu byte-for-byte: `7.2` <- `sn47.29:4.7` (Pāli `“Lābhā te, gahapati, suladdhaṁ te, gahapati.` trùng; cùng cụm còn có ở `sn47.30`).

  Tiền lệ thuật ngữ, đều có số đếm: `sīla` -> `giới luật` · `vimutti` -> `giải thoát` · `sati` -> `chánh niệm` · `arahanto` -> `bậc A-la-hán` · `taṇhā` -> `ái` · `nīgho` -> `tối tăm` (90 chỗ trong tầng) · `bandhanaṁ` -> `trói buộc` (741 chỗ) · `khīṇāsavo bhikkhu` -> `vị tỳ-kheo đã đoạn tận các lậu` · `pahīnā ucchinnamūlā tālāvatthukatā anabhāvaṅkatā āyatiṁ anuppādadhammā` -> `trừ bỏ, bị chặt tận gốc, được làm như gốc chà là, bị tiêu diệt, là pháp không sinh lại trong tương lai` (nguyên văn `sn23.10:1.6`) · `saṅkhittena bhāsitassa vitthārena attho` -> `ý nghĩa chi tiết của lời dạy vắn tắt` (`sn22.70:2.1`) · `muhuttaṁ` -> `một lát` · `paṇḍito` -> `bậc trí`.
  0 tiền lệ, đặt mới kèm lý do: `nelaṅgo` -> `không tỳ vết` (33 chỗ `không tỳ vết` trong tầng, đọc cùng dãy `anukkama` tứ đảnh ở `sn48.8`) · `setapacchādo` -> `tấm che trắng` · `ekāro` -> `chỉ một càng` · `vattatī` -> `vận chạy tới` · `ratho` -> `xe cở` (`xe ngựa` có 33 chỗ, nhưng `cở` đúng nghĩa cỗi xe và giữ được hình ảnh tầm nhìn thấp của bánh xe) · `anīgha` -> `không u buồn` (theo `nīgho` = sầu bi, và `5.6` giải nghĩa `nīgha` là tham sân vô minh) · `chinnasota` -> `đã cắt dòng sông` · `abandhana` -> `không trói buộc` · `odanakummāsūpacayassa` -> `tích tụ từ cơm nếu cháo` (`an9.15:2.1` chỉ có `tích tụ từ đất, nước, gió, lửa` cho `cātumahābhūtikassa`, không có cụm tương ứng với `odanakummā`; grep `cơm nếu` trong tầng trước đợt này = 0 hit).

  Bất định đã phân xử:
    (1) `5.16` (`Iti kho, bhante, yaṁ taṁ bhagavatā vuttaṁ:`) trong Pāli không có `saṅkhitta` cũng không có `vitthārena attho`; dịch thẳng sẽ thành câu vô nghĩa. Đã dùng `ý nghĩa chi tiết của lời Đức Thế Tôn nói vắn tắt được hiểu như sau:` — lấy từ chính `7.1` ngay sau đó và từ cách tầng dịch `saṅkhittena bhāsitassa vitthārena attho`. Đây là chỗ duy nhất trong bài có chữ thêm ngoài Pāli, nên `ambiguity_integrity` hạ 9.2.
    (2) `anīgha` có thể đọc `an-īgha` (không bệnh tật); chọn `không u buồn` vì `5.6` giải nghĩa `nīgha` là tham/sân/vô minh và Sujato dịch *untroubled*.

