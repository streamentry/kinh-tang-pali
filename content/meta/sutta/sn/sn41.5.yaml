  Dịch từ Pāli root tại commit đã ghim. COVERAGE ĐO LẠI bằng chính hàm của kho (`englishCoverageFor`, ngưỡng 0.8 khai trong `source/layers.yaml`): `english-sujato` phủ 25/25 khoá Pāli có nội dung = 1.000; `english-project` có tệp lấp cho bài này nên được tính vào. Tầng `vietnamese-current` không có — tại commit đã ghim bilara chỉ phân phối Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu.

  ĐỢT NÀY LÀ LƯỢT REVIEW ĐỐI KHÁNG THỨ HAI, trên bản dịch đã có trên đĩa. Sửa 2 khoá, giữ nguyên 39/39 khoá:
    · `7.1` — LỖI XƯNG NGÔ. Pāli `Imassa kho, bhante, bhagavatā saṅkhittena bhāsitassa evaṁ vitthārena atthaṁ ājānāmī”ti.` do gia chủ Citta nói; bản dịch dùng `tôi`. Cùng người này dùng `con` với Tôn giả Kāmabhū ở `4.2` và `4.4` trong chính bài này, và trong tầng có 7 chỗ dịng dạng `con hiểu ý nghĩa chi tiết của lời … nói vắn tắt … như vậy` cho `ājānāmī` (5 + 1 + 1) so với đúng 1 chỗ dùng `tôi` — chính là chỗ này. Đã sửa thành `con`.
    · `7.3` — LỖI NHẤT QUÁN TRONG CÙNG MỘT CÂU NÓI. Pāli `Yassa te gambhīre buddhavacane paññācakkhu kamatī”ti.` dùng `te` như `7.2` (`Lābhā te … suladdhaṁ te`), mà `7.2` dịch `ngươi` (đúng byte-for-byte với `sn47.29:4.7` và `sn47.30`), thì `7.3` lại dịch `bạn`. Đã sửa thành `ngươi`.
  Số khoá sửa: 2, cùng loại lỗi xưng ngô/thống nhất xưng hô. Không có khoá thừa, thiếu hay lệch, vẫn 39/39 khớp đúng khoá Pāli, nên `segment_alignment` giữ 10.0; `grammar_logic` hạ 9.2 vì hai lỗi trên là lỗi quan hệ chủ thể thật, không chỉ là văn phong.

  ĐO LẠI TIỀN LỆ (không tin số của người khác):
    · 0.1 bài sn: quét 1.608 khoá `:0.1` trong tầng `sn` -> 1.608/1.608 viết `Saṁyutta Nikāya`, 0 tệp nào trong cả tầng ghi `Saṡyutta` (grep `Saṡyutta` trong `content/translation/vi/project/` = 0 hit). Chốt `Saṁyutta Nikāya 41.5`.
