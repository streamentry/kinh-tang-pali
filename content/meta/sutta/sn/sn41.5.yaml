  Tiền lệ thuật ngữ, đều có số đếm: `sīla` -> `giới luật` · `vimutti` -> `giải thoát` · `sati` -> `chánh niệm` · `arahanto` -> `bậc A-la-hán` · `taṇhā` -> `ái` · `nīgho` -> `tối tăm` (90 chỗ trong tầng) · `bandhanaṁ` -> `trói buộc` (741 chỗ) · `khīṇāsavo bhikkhu` -> `vị tỳ-kheo đã đoạn tận các lậu` · `pahīnā ucchinnamūlā tālāvatthukatā anabhāvaṅkatā āyatiṁ anuppādadhammā` -> `trừ bỏ, bị chặt tận gốc, được làm như gốc chà là, bị tiêu diệt, là pháp không sinh lại trong tương lai` (nguyên văn sn23.10:1.6) · `saṅkhittena bhāsitassa vitthārena attho` -> `ý nghĩa chi tiết của lời dạy vắn tắt` (nguyên văn sn22.70:2.1) · `muhuttaṁ` -> `một lát` · `cātumahābhūtikassa kāyassa … odanakummāsūpacayassa aniccucchādanaparimaddanabhedanaviddhaṁsanadhammassa` -> `thân thể tứ đại này … được tích tụ từ cơm nếu cháo, có bản chất vô thường, chập phá, bị nghiền nát, tan rã` (theo an9.15:2.1, chỉ khác `odananalakumma` ở nguồn nên lấy `cơm nếu cháo`) · `paṇḍito` -> `bậc trí`.
  0 tiền lệ, đặt mới kèm lý do: `nelaṅgo` -> `không tỳ vết` (33 chỗ trong tầng, nhưng chưa ở đây; đọc cùng `anukkama` tứ đảnh trong `sn48.8` mà tầng dịch `không tỳ vết`) · `setapacchādo` -> `tấm che trắng` · `ekāro` -> `chỉ một càng` · `vattatī` -> `vận chạy tới` · `ratho` -> `xe cở` (`xe ngựa` có 33 chỗ nhưng `cở` đúng nghĩa cỗi xe và giữ được hình ảnh tầm nhìn thấp của bánh xe) · `anīgha` -> `không u buồn` (theo `nīgho` = sầu bi, và 5.6 giải nghĩa `nīgha` là tham sân vô minh) · `chinnasota` -> `đã cắt dòng sông` · `abandhana` -> `không trói buộc`.
  Bất định đã phân xử: (1) `sn41.5:5.16` (`Iti kho, bhante, yaṁ taṁ bhagavatā vuttaṁ:`) trong Pāli không có `saṅkhitta` cũng không có `vitthārena attho`, nhưng dịch thẳng thì thành câu vô nghĩa; mình dùng `ý nghĩa chi tiết của lời Đức Thế Tôn nói vắn tắt được hiểu như sau:` — lấy từ chính `sn41.5:7.1` ngay sau đó và từ cách tầng dịch `saṅkhittena bhāsitassa vitthārena attho`; không thêm ý vào thân kinh. (2) `anīgha` có thể đọc là `an-īgha` (không bệnh tật) — chọn `không u buồn` vì 5.6 giải nghĩa `nīgha` là tham/sân/vô minh và Sujato dịch *untroubled*.
