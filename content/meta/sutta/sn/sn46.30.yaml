notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato cộng bản lấp English của dự án. Coverage English = 19/19 khoá Pāli có nội dung = 100%.
  TRIANGULATION KHÔNG ĐỘC LẬP: 1 trong 19 khoá Pāli có nội dung (4.2) chỉ có tiếng Anh từ bản lấp `content/translation/en/project`, cùng tác giả với bản Việt này. Tiêu chí 6 đặt 8.0. Tầng Việt hiện hành vắng ở commit đã ghim.
  0.1 giữ `Saṁyutta Nikāya 46.30`; 0.2 theo tiền lệ 9 bài cùng phẩm (3. Phẩm Buổi Sớm); 0.3 theo tiền lệ `sn46.18:0.3` (Kinh Với Udāyī).
  7 khoá có PĀLI TRÙNG NGUYÊN VĂN với tệp đã có trong HEAD, dùng lại nguyên văn: 0.2 (3 bài) · 2.1 (`sn2.23`/`sn2.26`) · 2.6 (`an4.41:5.3`) · 2.7 (`an4.90:3.4`) · 2.10 (`an4.41:5.7`) · 5.4 (Thứ mười.) · 6.0 (Tóm lược:, 12 khoá trong sn46). 2.8 và 2.9 cũng trùng Pāli với `dn33`, nhưng dịch theo cùng khuôn `iti …` của 2.6 và 2.10. Tổng lát c32: 143 cặp.
  `iti rūpaṁ, iti rūpassa samudayo, iti rūpassa atthaṅgamo` dùng nguyên văn `an4.41:5.3` (Như vậy là sắc, như vậy là sự sanh khởi của sắc, như vậy là sự diệt mất của sắc) và `an4.41:5.7` cho thức. LỆCH CÓ CHỦ ĐÍCH: 2.7 dịch cảm thọ chứ không theo `an4.90:3.4` (như vậy là thụ), vì cảm thọ có 1449 lần trên đĩa so với thụ 247, và bài này còn dùng cảm thọ ở sn46.30:2.7 lẫn 3.1.
  `satisambojjhaṅgo` / `upekkhāsambojjhaṅgo` ở 4.1 và 4.3 dịch yếu tố giác chi chánh niệm / yếu tố giác chi bình đẳng, theo 22 khoá niệm giác chi và 27 khoá xả giác chi trong `sn46.24`, `sn46.76`.
  Công thức khép phẩm dịch thành Sanh đã tận, phạm hạnh đã hoàn thành, việc nên làm đã làm, không còn trở lại trạng thái hiện hữu này nữa. LỆCH CÓ CHỦ ĐÍCH: không dùng không còn gì là tự thân nữa (86 khoá trên đĩa) vì Pāli `itthattāyā` là sự hiện hữu, không phải tự thân.
  `hiri` và `ottappa` ở 2.2 và 2.4 dịch sự hổ thẹn và sự ngăn ngừng. 0 tiền lệ cho cụm này trên đĩa; `an4.272` dùng tâm sân cho `byāpāda` và `sn16.2` dùng sợ tội lỗi cho `ottappa`, nên đây là lựa chọn mới, ghi lại để người biên tập gộp.
  NGOẶC KÉP: lời Udāyī là MỘT trích dẫn chạy từ 2.1 tới 4.6, đúng như Pāli. Vì vậy 3.4, 4.2, 4.4 không có nháy kép riêng (trong khi 3.1 giữ bốn cặp nháy lồng cho `idaṁ dukkhan`… vốn là trích dẫn trong trích dẫn), và 4.6 mang dấu khép của trích dẫn ngoài. Sujato dịch 4.1–4.2 gộp cả bảy yếu tố giác chi, còn Pāli bài này chỉ nói tới chánh niệm — bản Việt bám Pāli.
  BẤT ĐỊNH: kệ `Tassuddānaṁ` 6.1–6.4 là kệ gợi nhớ, dịch tự do theo đúng khuôn `sn46.76:4.1–4.4` (mỗi vế một cụm danh từ, giữ dấu phẩy và dấu chấm phẩy của Pāli). `udāyino` dịch người hành trì.
  Bốn dấu lược ở 1.2, 2.7, 2.8, 2.9, 4.2 giữ đúng MỘT `…`.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy; technical_integrity 9.6 vì lát này không tự chạy bốn lệnh đó. Đã tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, và mô phỏng đúng `validateSegmentMap` của `scripts/validate.ts` (tiền tố khoá, orphan, requireComplete, non-Latin) — 316/316 khoá sạch.
