notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có 26 chương Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Hai tầng còn lại là Pāli root (authority) và bản Anh Bhikkhu Sujato đã ghim.
  - >-
    **Coverage tầng Anh 1,000** (20 Pāli có nội dung, 20 có chữ Sujato) — đầy đủ, cao hơn nhiều so với đa số tầng sn.
  - >-
    **Tiền lệ dùng lại, đếm được.** `:1.1` (4 lần) · `:1.3` *Sự đáng ưa … tai họa … lối thoát* (3) · `:1.4` (1) · `:1.5` *cảm thọ dễ chịu, cảm thọ khổ, cảm thọ vừa khổ vừa dễ chịu* (2) · `:1.9` (1) · `:1.10` *chánh kiến … chánh định* (6). Vì `:1.10` Pāli là `sammādiṭṭhi …pe… sammāsamādhi` (một dấu lược) nên bản Việt chỉ có **một** `…`; **không** chép bản 24 lần dùng hai `…` — bản đó lệch dấu lược.
  - >-
    **Ba tầng độ lắng dịu — phân biệt có chủ ý.** `niruddha` → *ngừng hẳn* (`:2.2 :2.3`) · `vūpasanta` → *lắng dịu* (`:2.5 :2.6`) · `paṭippassaddha` → *hoàn toàn lắng dịu* (`:2.8`–`:2.13`). Pāli cố ý leo thang ba bậc, bản Việt giữ đúng ba bậc.
  - >-
    **0 tiền lệ, đặt mới.** `anupubbasaṅkhārānaṁ` → *các phép tu tập* (`saṅkhāra` ở đây là *ānaṅkitta-saṅkhāra*, không phải *sanh hành*) · `passaddhi` → *an tịnh* (436) · `paṭippassaddhi` → *hoàn toàn lắng dịu* · `vitakkavicārā` → *suy tầm và tư duy* (*suy tầm* 73; theo cụm *suy tầm và tư duy* đã có trong kho — **tránh** dịch theo kiểu chú giải *sự hành trì tâm và sự nối tiếp* như bản Anh, vì đó là diễn giải chứ không phải nghĩa Pāli) · `pīti` → *hỷ* · `somanassaṁ` → *hoan hỷ* (1.127).
  - >-
    **Dấu lược — quyết định từng khoá.** `:1.10` (`…pe…` giữa câu) và `:2.2 :2.5` (`…pe…`) giữ mỗi khoá **một** `…`. Không khoá nào nén thêm.
  - >-
    **Tiêu đề.** `Paṭhamasambahulasutta` → *Kinh Nhiều Vị Tỳ-kheo (Một)*; tiền lệ chia hai kiểu: `sn36.18:0.3` *… (Hai)* với `sn36.12/13:0.3` *… (Một)* — theo **chính Sn 36** thì *(Một)*. `Rahogatavagga` → *2. Phẩm Về Trú Xa*, đúng như `sn36.16:0.2` và `sn36.18:0.2`.
  - >-
    **Khác kho, có chủ ý — số đếm.** `Saṁyutta Nikāya` → *Tương Ưng Bộ* (xem `sn35.105`).
  - >-
    `technical_integrity` 9.6 vì bốn lệnh cổng **do coordinator chạy**, lát này đã tự kiểm mọi thứ còn lại bằng `_hvi.kiểm` (NFC, dấu lược khớp từng khoá, nháy kép cân trên cả bài, không Pāli lọt): `npm run validate` · `npm test` · `npm run check` · `npm run build`.
