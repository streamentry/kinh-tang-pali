notes:
  - >-
    **Coverage tầng Anh 26/26 = 1,000 và bài này KHÔNG dùng bản lấp của dự án** — Sujato chỉ để trống `sn47.8:8.4` (*Aṭṭhamaṁ.*, không phải Pāli có nội dung). Triangulation là một lần đọc Anh độc lập.
  - >-
    **Công thức quán sát bốn từ xứ lấy y hệt `sn47.14:3.2`–`:3.5`** (và 114 cặp *tinh cần, tỉnh giác, có niệm* trong 39 tệp sn): *sống quán thân trên thân … xa lìa tham lam và buồn phiền nơi đời*. Riêng `:3.7` và `:7.7` dịch *sống quán thọ trên các cảm thọ …* để khớp `sn47.13:7.3` của chính lát này (cùng công thức, cùng sn47.14) — đã sửa một bản nháp ban đầu viết *các thọ*.
  - >-
    **Ba tính từ người đầu bếp, có số đếm.** `bālo` → *ngu dốt* và `abyatto` → *không khéo léo* đúng `dn4:8.5` và `dn23:21.51`; `akusalo` → *không khéo nghề* (0 tiền lệ trực tiếp, chọn để ba tính từ Pāli không lặp thành ba từ gần nghĩa). Phía bên kia: `paṇḍito` → *khôn ranh*, `byatto` → *thành thạo*, `kusalo` → *khéo nghề* (0 tiền lệ cho cụm, nhưng đối xứng với nhóm trên và với `idhekacco`/`idhekacco` ở `dn4`/`dn3`).
  - >-
    **Bất định đã ghi.** `:3.1` `ko chātako ko tasito` dịch *Ai cần dù, ai khát nước* theo cách đọc của bản Anh đã ghim (*Who needs an umbrella? Who is thirsty?*); theo nghĩa thường của `chātaka` thì là *khát*, còn `ko chattam` ở `:4.1` mới là *dù*. Cả hai cách đọc đều khả dĩ, chọn theo tầng Anh và ghi ở đây.
  - >-
    **`upakkilesā` → *cấu uế*** (`dn25:12.18`; glossary `aṅgaṇa` = *uế nhiễm*), **`:2.2`/`:6.2` `nimitta` → *dấu hiệu*** (`dn28:6.7`, và `an6.27:7.1` *tìm dấu hiệu*), **`Taṁ kissa hetu?` → *Vì sao vậy?*** (tiền lệ 284, ghi ở lát 55). **`:4.1`/`:8.1` `satisampajaññassa` → *chánh niệm và tỉnh giác*** (glossary: `sati` = *niệm*, `sampajañña` = *tỉnh giác*; 0 tiền lệ cho cụm này).
  - >-
    **Nhặc kép giữ y hệt Pāli, gồm chỗ trông lạ.** Pāli mở `“` ở `:1.1` và chỉ đóng `”` ở `:8.3`, vì lời Đức Thế Tôn trải suốt bài; nháy đơn `‘…’` ở `:2.2–:2.3` và `:6.2–:6.3`. Cùng cách này đã có ở `mn43` (`“` ở `:29.5`, `”` ở `:37.5`).
  - >-
    **Dấu lược:** `:2.3` và `:6.3` mỗi khoá có **sáu** `…` ở Pāli (`Tittakaggaṁ … kaṭukaggaṁ … madhuraggaṁ … khārikaṁ … akhārikaṁ … loṇikaṁ … aloṇikaṁ`), bản Việt giữ đúng sáu, không mở rộng (luật BRIEF_VI3 §10.1). `:3.7`, `:3.8`, `:7.7`, `:7.8` mỗi khoá một `…`.
  - >-
    **Tên phẩm và tiêu đề, có số đếm.** `0.1` giữ `Saṁyutta Nikāya` (1492/1493 tệp sn). `0.2` `Ambapālivagga` → *1. Phẩm Ambapālī* (6/6 trong sn47). `0.3` `Sūdasutta` → *Kinh Sūda*, giữ tên riêng theo khuôn sn47 (*Kinh Ukkacelā*, *Kinh Bāhiya*, *Kinh Uttiya*, *Kinh Sedaka*). **Không đối chiếu được tầng Việt hiện hành** (tại commit đã ghim chỉ có 26 chương Pháp Cú).
