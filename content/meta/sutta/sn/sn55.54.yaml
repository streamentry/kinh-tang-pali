notes: |-
  Đợt 19, lát l11. Dịch trọn bài, 67/67 khoá, từ Pāli root, đối chiếu English Sujato đã ghim, bản Việt nguyên bài của Hòa thượng Thích Minh Châu (nguồn tra cứu toàn văn trên SuttaCentral, không phân đoạn) và hai bài kinh cùng khuôn mở đầu là an11.13 và an11.12.

  **Coverage Anh trên Pāli có nội dung: 35/41 = 0,854** (mẫu số: khoá Pāli ≥ 40 ký tự, bỏ khối :0 và tiêu đề). Sujato để trống 6 khoá có nội dung (1.5, 1.6, 1.9, 1.10, 6.4, 7.2) — đều là câu lặp lại nguyên văn phần đã có ở chỗ khác trong bài (1.5/1.6/1.9/1.10 lặp 1.2–1.3; 6.4 và 7.2 lặp công thức của 5.7 và 6.2). Lớp english-project đã lấp cả 6 khoá ấy nhưng đó là bản của chính dự án, không phải cách đọc English độc lập; vì vậy triangulation chỉ 8,8 và bài không tuyên bố đã đối chiếu English độc lập cho 6 khoá này. 0,854 ≥ 0,80 nên không có blocker về coverage và không cần entry reference-gaps.

  **Số đối chiếu nội bộ.** Pāli trùng nguyên văn trong chính bài: 2 nhóm — `So ce evaṁ vadeyya:` (9 khoá: 3.3, 4.1, 4.4, 5.1, 5.4, 6.1, 7.1, 7.9, 8.1) và `‘āyasmā kho māriso maraṇadhammo.` (3.5, 4.6); cả hai nhóm bản Việt giống nhau tuyệt đối, 0 cặp lệch. Pāli trùng với bài khác trong tầng: 25 khoá, trong đó 7 khoá bản Việt giống nguyên văn; 18 khoá khác có lý do: 9 khoá `So ce evaṁ vadeyya:` tiền lệ duy nhất là dn29 (`Nếu vị ấy trả lời:`, 3 khoá, chủ thể là tỳ-kheo) nên đổi `vị ấy` thành `người ấy` cho nam cư sĩ, còn `trả lời` giữ theo tiền lệ; 9 khoá mở đầu: 1.2–1.6 và 1.9–1.10 khác an11.13 và an11.12 ở ba điểm có chủ ý — dùng `Thế Tôn` theo thói quen của sn55, bỏ `an cư` vì Pāli `temāsaccayena` chỉ nói `hết ba tháng` (`an cư` là chi tiết do an11.13 và Sujato thêm vào), và thêm `nghĩ rằng` ở 1.2 để đại diện cho quotative `ti`; còn 1.1 và 1.7 khác sn55.37 và sn55.21 chỉ ở dấu phẩy và ở cách gọi `người Thích-ca` / `người Sakka`.

  **Thuật ngữ (đếm trên tầng):** `sappañño` → `có trí` (14 khoá; `có trí tuệ` 4, `có tuệ` 2; tên phẩm vẫn là `Phẩm Có Tuệ` theo quy ước đã chốt cho Sappaññavagga). `ābādhiko dukkhito bāḷhagilāno` → `đang bệnh, khổ đau, bệnh nặng` (`khổ đau` 28 / `đau khổ` 20 / `đau đớn` 6). `Gilānasutta` → `Kinh Người Bệnh` (3/3). `aveccappasāda` → `niềm tín xác quyết` (sn55.53). `ariyakantāni sīlāni` → `giới được bậc Thánh yêu thích` (sn55.53). `pañca kāmaguṇā` → `năm dục trưởng dưỡng` (53 / `năm dục công đức` 23). `abhikkantatarā ca paṇītatarā ca` → `cao hơn và thù thắng hơn` (khớp ba khoá an về chư thiên). `sakkāya` → `hữu thân` (76 / `thân kiến` 74; mn, dn nghiêng về `hữu thân`; `sakkāyapariyāpanno` → `nằm trong hữu thân` theo sn22.78). Tên cõi trời theo sn56.11, cùng công thức rút gọn `…pe…`: `Tứ Đại Thiên Vương`, `Ba Mươi Ba`, `Yāma`, `Tusita`, `Nimmānaratī`, `Paranimmitavasavattī`; `brahmaloka` → `cõi Phạm thiên` (84). `maraṇadhammo` → `có bản tính phải chết` (an5.48). `Catutthaṁ.` → `Thứ bốn.` (sn55: 4 / `Thứ tư` 1; sn: 70 / 43). `Sakkesu` → `Thích-ca` và `Mahānāma người Thích-ca` (cùng sn55.37; sn55.21 và sn55.22 dùng `người Sakka` cho Mahānāma nhưng vẫn `Thích-ca` cho bộ tộc).

  **Bất định (không phân xử được hoàn toàn).**
  (1) 1.11–1.12 `Na kho netaṁ, bhante, bhagavato sammukhā sutaṁ sammukhā paṭiggahitaṁ / sappaññena upāsakena sappañño upāsako … ovaditabbo`. Nghĩa đen Pāli là mệnh đề đã trích dẫn ‘một nam cư sĩ có trí cần được …’ mà Mahānāma nói là chưa nghe trực tiếp, và Pāli không có từ hỏi `kathaṁ`; đọc sát nghĩa đen thì thành ‘con chưa nghe rằng nam cư sĩ có trí cần khuyên dạy…’, trái với văn cảnh vì Đức Phật liền xác nhận chính điều đó ở 2.1 và trả lời cách làm bằng bốn pháp an ủi. Sujato (`how a wise lay follower should advise`) và bản Thích Minh Châu (`cần phải được … giáo giới như thế nào?`) cùng đọc theo văn cảnh là hỏi cách thức. Bản này theo cách đọc văn cảnh và thêm `như thế nào` ở cuối 1.12; Không đổi giáo nghĩa nào, vì phần trả lời của Đức Phật nằm ở 2.1 trở đi.
  (2) `apekkhā` ở 3.2–5.5: chọn `lòng mong nhớ` theo tiền lệ sn3.10:4.4 (cùng Pāli `puttesu dāresu ca yā apekkhā` → `lòng mong nhớ vợ con`). Sujato dịch `concerned for`, Thích Minh Châu `lòng thương nhớ`; nghĩa gốc là sự ngó đến, còn bận tâm, thiên về mong đợi hơn là nhớ thương; chưa có chứng cứ độc lập cho bài này để phân xử.
  (3) 2.7 `ariyakantāni sīlāni …` không có `atthāyasmato` trong khoá; bản Việt thêm `Tôn giả có` theo mạch 2.3, 2.5 (Pāli các khoá đầu có `atthāyasmato`, 2.7 chỉ còn danh từ), như Sujato (`And you have`). Câu `Assāsatāyasmā` chỉ hiện ở 2.2 và 2.4; Tăng và giới nằm trong phần rút gọn bằng `…pe…`, bản Việt không mở rộng.
  (4) 7.3–7.6: dấu `…pe…` che phần vị ngữ `abhikkantatarā ca paṇītatarā ca`; bản Việt chỉ giữ `so với chư thiên cõi Ba Mươi Ba, chư thiên cõi Yāma …` và không điền thêm vị ngữ.
  (5) `māriso` ở 3.5, 4.6 dịch gộp vào lời xưng hô `Thưa Tôn giả`; `āvuso` ở 5.6, 6.3, 7.3, 7.7, 7.11 dịch `Này hiền giả`.
  (6) 8.3 `āsavā vimuttacittena bhikkhunā`: đọc `āsavā` là cách tách (ablative) → `tâm đã giải thoát khỏi các lậu`, khớp Sujato và Thích Minh Châu; 8.3–8.4 `yadidaṁ — vimuttiyā vimuttan` dịch `tức là— giữa một giải thoát với một giải thoát`, đúng khuôn an5.31:6.2.

  **Số Pāli.** Bài chỉ có hai số: `catūhi assāsanīyehi dhammehi` = bốn (khớp Sujato) và `tāvatiṁsā` = Ba Mươi Ba (tên cõi, khớp tiền lệ sn). Kiểm tra máy: 67/67 khoá khớp tập khoá Pāli, đúng thứ tự; dấu nháy đơn và kép khớp Pāli từng khoá, 0 lệch trên 67 khoá; dấu `…` khớp (mỗi `…pe…` của Pāli thành đúng một `…`), 0 lệch; NFC sạch; không khoá rỗng, không khoảng trắng thừa, không `…pe…` sót lại; không Pāli lọt sang bản Việt ngoài tên riêng.

  Technical gate: bị cấm chạy trong lát này nên technical_integrity = 9,6 và không tuyên bố đã pass. Người điều phối còn phải chạy bốn lệnh: npm run validate, npm test, npm run check, npm run build.
