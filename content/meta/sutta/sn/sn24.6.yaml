notes: |-
  Không có tầng Việt hiện hành để đối chiếu. Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Tầng đối chiếu còn lại là Pāli root và bản Anh Sujato đã ghim. budsas.org chỉ là tham khảo toàn văn, không cấp text cho tầng nào.
  Dấu lược theo đúng luật của tầng Việt: pe-lược của Pāli là MỘT dấu lược, và sau khi bỏ hết pe-lược thì đếm dấu lược còn lại. Chạy trên 315 khoá của lát: 0 khoá lệch. Không có khoá nào để trống trong bản dịch.
  Tên phẩm đo trên toàn tầng sn: 14 tệp cùng phẩm Sotāpattivagga, cả 14 đều là 1. Phẩm Nhập Lưu, không có phân kỳ. Tên bài Karotosutta chưa có tiền lệ; đặt mới theo Sujato (Acting), và vì karoto là danh từ người, tôi dịch Kinh Người Hành Động chứ không dịch Kinh Hành Động.
  Coverage Anh 16/16 khoá Pāli có nội dung, tức 100%, nhưng tầng english-project của bài đang published và do cùng một người ký, nên scorecard chấm triangulation thấp 8.8 và không tuyên bố đã đối chiếu Anh. Sáu khoá mà bản lấp im lặng đều là chỗ blockquote mà Sujato không dịch, không phải sự đồng thuận về cách dịch.
  Đo rồi mới dùng: 28 trong 45 khoá có Pāli trùng nguyên văn với bài đã mang trạng thái, và cả 28 đều dùng lại nguyên văn — không có khoá nào dịch lại lần hai. Danh sách: 1.2 (20 tiền lệ), 2.1 (10), 2.4 (7), 2.5 (15), 2.6 (17), 2.7 (11), 3.2 (18), 3.3 (12), 3.4 và 3.13 và 3.19 (8 mỗi khoá), 3.7 và 3.16 và 3.22 (45), 3.8 (14), 3.9 (36), 3.10 (35), 3.11 (17), 3.12 (5), 3.17 (6), 4.1 (5), 4.2 (6).
  Nguyên tắc bất lý trong bài này: không có khoá nào phải dịch khác nhau chỉ vì khác khoá. Cụm karoto kārayato lặp sáu lần (1.3, 2.2, 2.8, 3.5, 3.14, 3.20) và cụm không có công đức lặp năm lần, nên chỉ có một văn bản cho mỗi cụm; ba khoá trong đó Pāli chỉ ghi karoto thì tôi cắt bớt đúng tới chỗ Pāli lược, không mở rộng.
  Danh sách hành vi ở 1.3 có mười chín mệnh đề, Sujato gộp còn sáu. Tôi giữ đủ mười chín theo Pāli, mỗi cặp chủ động và sai-vi là một vế: chém chởi, giết, làm hại, hành hạ, làm khổ, rồi giết sinh vật, lấy của không cho, phá nhà, mang tẩu tên tánh, cướp nhà vắng, đứng chặn giữa đường, đi vào nhà kẻ khác phòng thân, nói dối. Nếu dịch theo Sujato sẽ mất mười ba hành vi.
  Sujato sai ở 3.19: ông viết by not grasping what is impermanent, suffering, and perishable, nhưng Pāli 3.19 y hệt 3.4 và 3.13, chỉ có taṁ anupādāya. Tôi theo Pāli và giữ câu đã có tiền lệ cho cả ba khoá.
  Review đối kháng bắt được và đã sửa: 1.3 bản nháp của tôi có ba chỗ dịch sai đối tượng (nillopaṁ harato thành đi cướp đồ chung, tôi đã tách thành mang tẩu tên tánh), và 1.5 suýt dịch pācento thành sai người hành hạ trong khi Pāli đang nối liên tiếp sáu vế không có động từ sai, đã sửa. Không còn khoá nào lệch tiền lệ.
