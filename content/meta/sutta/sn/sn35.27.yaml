notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của `_hvi.py` gần như vô dụng ở bài này**: nó chỉ quét khoá Pāli từ 40 ký tự trở lên, mà mọi vế kệ ở đây đều ngắn hơn, nên `cần` rỗng và assertion không chạy. Vì vậy tôi tự quét **toàn bộ** khoá từ đĩa: đủ khoá, đúng exact ID, NFC, không rỗng, dấu lược khớp Pāli từng khoá, ngoặc kép cân cả bài, không Pāli lọt, không `(…)`. Kết quả: **0 lỗi trên 252 khoá**.
  - |-
    **Đã tự dựng chỉ mục Pāli↔Việt toàn tầng rồi so khoá của lát, không đoán.** Nạp mọi tệp Pāli gốc trong cache (284.708 khoá) và mọi tệp Việt dự án (111.657 khoá), ghép theo khoá vì khoá là duy nhất toàn hệ thống kể cả với uid-gộp. **Cả lát này: 1.402 lần khoá của lát trùng nguyên văn với một bài đã có bản Việt ngoài lát, trải trên 1.163 bài** — riêng bài này có 1 khoá như vậy. Trong lát có 16 cụm Pāli trùng nguyên văn, bài này dính 8 cụm. Mọi bản Việt đã có đều được dùng lại nguyên văn, không dịch lần hai; chỗ không dùng lại thì đã đo số và ghi lý do trong các mục dưới.
  - |-
    **Bốn cặp khoá trùng nguyên văn nội bài, dịch giống hệt** — `1.3≡2.3`, `1.4≡2.4`, `1.5≡2.5`, `1.6≡2.6`. Vế `1.3` kết bằng `…pe…` nên cả hai khoá giữ **một** dấu lược, không mở rộng tai và mũi. `0.2` dùng *3. Phẩm Tất Cả* (3 bài).
  - |-
    **Coverage English 14/14 = 100%.** Bốn mệnh đề `anabhijānaṁ aparijānaṁ avirājayaṁ appajahaṁ` và bốn vế `…viññātabbā dhammā` là công thức đã có tiền lệ tuyệt đối ở sn35.111/112 và sn35.68, tôi dùng lại y nguyên: *không biết, không thấy rõ, không làm cho sáng ra, không từ bỏ, thì không thể chấm dứt khổ* và *thức mắt / những pháp để thức mắt có thể biết*. Riêng `1.3` tôi thêm vế gọi *này các tỳ-kheo* vì Pāli khoá này có `bhikkhave` (khác `1.4–1.6` không có) — đây là một trong hai chỗ tôi chủ động thêm vì **có** căn cứ, không phải lặp khuôn.
  - |-
    **Chỗ Sujato dịch theo thói quen Âu, tôi quay lại Pāli.** Hắn dịch `anabhijānaṁ aparijānaṁ virājayaṁ appajahaṁ` thành *without directly knowing and completely understanding … without dispassion for it and giving it up* — `avirājayaṁ` không phải *không thấy rõ* mà là *không làm cho sáng ra* (nghĩa trong ngành: làm cho sáng ra trí tuệ), và tầng Việt đã chốt cách đó ở sn35.111/112. Pāli và tiền lệ cùng thắng.
  - |-
    **Review đối kháng bắt được 2 lỗi.** (1) `1.2/2.2` bản nháp *Và tất cả là gì, này các tỳ-kheo, mà không biết…* — *là gì* và *mà* không nối nhau; đổi thành *Và tất cả nào*. (2) Nhóm chú ý: `sabbaṁ` là chủ ngữ, không phải tân ngữ, nên tôi viết *tất cả mà không biết… thì không thể* chứ không phải *không biết tất cả*. Đây là điểm dễ sai nhất của bài và là chỗ tôi hạ `grammar_logic`.
  - |-
    **Tiêu đề 0 tiền lệ, phải tự đặt.** `Dutiyaaparijānanasutta` chưa có bản Việt nào trong tầng; tôi đặt *Kinh Không Biết Trọn Vẹn (Hai)* theo đúng cặp *(Nhất)*/*(Hai)* mà sn35.236 và sn35.237 đã lập, và theo nghĩa `anabhijānaṁ aparijānaṁ` ngay trong thân bài.
  - |-
    **Lượt cải thiện 2026-10-13 (kiểm toán lại, đọc đối kháng đủ 18 khoá): 6/18 khoá đổi, cả 6 là lỗi nghĩa nặng (1.1, 1.2, 1.7, 2.1, 2.2, 2.7); các ghi chú cũ ở trên về `sabbaṁ`, về `avirājayaṁ` và về Sujato được đính chính ở đây.**
  - |-
    **Lỗi nặng 1, cú pháp: `sabbaṁ` là TÂN NGỮ, không phải chủ ngữ.** Các phân từ `anabhijānaṁ aparijānaṁ avirājayaṁ appajahaṁ` và `abhabbo` đều là danh cách giống đực chỉ người tu; `sabbaṁ` là đối tượng của các phân từ ấy. Bản trước viết *tất cả mà không biết… thì không thể…*, tức để *tất cả* làm chủ ngữ của việc không biết, và ghi chú cũ còn nhấn mạnh điều đó như điểm "đúng". Đó là hiểu sai. Bản Anh Sujato (đối chiếu lại, phủ 14/14) cũng đọc `sabbaṁ` là tân ngữ: *without directly knowing and completely understanding the all… you can't end suffering*. Đã đổi 1.1 và 2.1 thành *đối với tất cả, không thắng tri… thì không thể chấm dứt khổ*, 1.2 và 2.2 thành *đối với tất cả nào… không thắng tri…*, 1.7 và 2.7 thành *đây là tất cả mà đối với nó, không thắng tri…*. Pāli của 1.1, 2.2, 1.7 (so với sn35.26:1.19) và 2.7 (so với sn35.26:2.19) trùng nguyên văn bài song song sn35.26, và bản Việt nay giống hệt các khoá ấy.
  - |-
    **Lỗi nặng 2, thuật ngữ: `avirājayaṁ`/`virājayaṁ` dịch *không làm cho sáng ra*/*làm cho sáng ra* là sai nghĩa.** `virājayaṁ` đi với `rāga`, nghĩa là làm cho hết nhiễm, tức ly tham; ghi chú cũ cho rằng Sujato "dịch theo thói quen Âu" và rằng nghĩa trong ngành là *làm cho sáng ra trí tuệ* là suy diễn không có căn cứ. Đo trên tầng: *ly tham* 1.535 lần ở 481 tệp; *làm cho sáng ra* chỉ còn trong 5 bài (sn22.24, sn35.26, sn35.27, sn35.111, sn35.112). Đổi thành *không ly tham*/*ly tham* ở 6 khoá trên.
  - |-
    **Lỗi nặng 3, công thức tri: `anabhijānaṁ aparijānaṁ` dịch *không biết, không thấy rõ* đổi thành *không thắng tri, không liễu tri*** (và `abhijānaṁ parijānaṁ` thành *thắng tri, liễu tri*). *Thấy rõ* là dịch `passati`, không phải `parijānaṁ`, và hai chặng `abhi-`/`pari-` bị dồn thành một. Toàn tầng: *thắng tri* 1.670, *liễu tri* 959; cùng phẩm, sn35.25 và sn35.26 đã dùng *thắng tri, liễu tri*. Giữ *chấm dứt khổ* cho `dukkhakkhayāya`, như sn35.26.
  - |-
    **Điểm đổi:** `grammar_logic` 9.3 lên 9.5 (chủ ngữ/tân ngữ nay đúng ở mọi khoá có `sabbaṁ`); `terminology` 9.4 xuống 9.2 (tiêu đề *Không Biết Trọn Vẹn* còn lệch thân bài dùng *liễu tri*, và sn35.111/112/sn22.24 còn dùng *làm cho sáng ra*; *con mắt* và *mắt*, *thức mắt* và *thức của con mắt* còn phân đôi trong tầng); `triangulation` 9.4 xuống 8.8 vì bản trước từng bác Sujato ở đúng chỗ Sujato đúng, tức đối chiếu chưa thật sự hội tụ, và không có bản Việt hiện hành; `source_provenance` 9.5 xuống 9.2 vì ghi chú cũ nêu căn cứ sai; `ambiguity_integrity` 9.2 xuống 9.0 vì chưa có bản dạng sai khiến của `virājayaṁ` (*làm cho người tu hết nhiễm*), giữ theo đa số tầng. `semantic_fidelity`, `segment_alignment`, `vietnamese_clarity`, `han_viet_balance` giữ nguyên; `technical_integrity` giữ 9,6. `final_score` 9,44 xuống 9,33.
  - |-
    **Bất định còn lại và việc ngoài phạm vi.** Tiêu đề chưa đổi (đề xuất cân nhắc *Kinh Không Liễu Tri (Hai)* cùng với sn35.26). `sn35.111:1.1`–`1.7`, `sn35.112:1.1`–`1.7` và `sn22.24` còn dùng *không biết, không thấy rõ, không làm cho sáng ra*, cần sửa đồng bộ. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy ở lượt này.
