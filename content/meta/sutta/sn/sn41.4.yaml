notes: |-
  ĐỌC LẠI TỪNG CÂU TỪ PĀLI. Bản dịch có sẵn do phiên trước ghi, thiếu metadata; tôi đã đối
  chiếu 47/47 khoá với Pāli root đã ghim và sửa 9 khoá. Coverage English đo bằng đúng công
  thức `src/lib/canon/reference.ts`: 30/30 khoá Pāli có nội dung đều có chữ Anh Sujato =
  **100%**, không cần tầng lấp `english-project`. Trên ngưỡng 0.8 nên không phải ghi
  `content/meta/reference-gaps.yaml`.

  SỬA 9 KHOÁ:
  1.5. 4.9 và 6.3 bỏ mất mốc `pūjita` trong `Pūjitamettāvatā`, chỉ còn "Và đủ rồi" — mất
  đúng vế đối xứng với `Katamettāvatā` ngay khoá trước. Tiền lệ: `dn17:1.16.10` dịch "Đã cúng
  dường đủ chưa?", `mn129:40.12` dịch "Đã được tôn trọng chừng này rồi" — cả hai đều giữ mốc
  này. Đã sửa thành "Đã dâng dưng đủ rồi".
  1.6. 6.1, 6.2, 6.3 dịch vâng dẫp `bhante` thành "bạch Đại Ma-ha-ca", trong khi 5 chỗ khác
  của cùng bài (1.3, 3.3, 4.6, 5.2, 5.4) dịch "bạch ngài" và ngay 6.4 lại là "Xin ngài
  Ma-ha-ca". `bhante` không phải tên người, nên "Đại Ma-ha-ca" ở vế xưng hô là cách gọi sai
  vai. Đếm: "bạch ngài" 162 lần toàn kho so với "bạch Đại …" 13 lần. Đã chuẩn hóa.
  1.7. 5.3 và 5.4 dịch `ālinda` thành "hành lang"; `ālinda` là vỉa/hiên trước nhà (Sujato:
  "porch"), khác hẳn hành lang. Không có tiền lệ nào cho `ālinda` trên đĩa. Đã sửa thành
  "ở trước hiên".

  GIỮ NGUYÊN CÓ CHỦ ĐÍCH — và đây là chỗ đáng ghi nhất:
  1.8. 4.8 và 6.2 dịch `Katamettāvatā` thành "Việc đã xong chưa". Tôi ĐÃ nghi ngờ điểm này
  và định sửa, rồi tra tiền lệ thì thấy bản dịch có sẵn ĐÚNG NHƯ VẬY: `dn17:1.16.10` →
  "Bấy nhiêu đủ chưa, Đại vương? **Việc đã xong chưa?** Đã cúng dường đủ chưa?"; `mn39:3.4`
  (và 3:4, 4:6, 5:6, 6:6, 7:6, 8:13, 9:6, 10:8, 11:5) → "Như vậy là đủ, **việc cần làm đã
  làm xong**"; `dn10`, `mn129:40.10` cũng theo cùng cách. Giữ nguyên; sửa ở đây sẽ phá vỡ
  một công thức dùng ở 15 khoá đã công bố. Đây là lần "nghi sai rồi tra lại" — ghi ra để
  người đọc biết nó đã được kiểm, không phải bỏ sót.
  1.9. 1.6 dịch `nivāsetvā pattacīvaramādāya` thành "đắp y, cầm y bát" — đúng nguyên văn
  `sn16.10`, `sn19.1`, `sn20.9` (hai lần), `sn20.10`, `sn28.1`, `sn28.10`, `sn3.10`,
  `sn3.14`, `sn17.4`, `sn17.5`, `sn17.9` (65 khoá). `gokula` dịch "tiệm sữa" (Sujato: milkshed)
  cũng khớp.

  Thuật ngữ, kèm đếm: `sabbanavako` → vị mới nhất (đúng nguyên văn `sn41.2` cho cùng Pāli)
  · `mahākā`/`mahāko` → Đại Ma-ha-ca (thống nhất trong cả bài) · `thera` → trưởng lão (320
  lần) · `āvuso` → đạo hữu (223 lần) · `paccāsīsati` → mong chờ · `ussukkaṁ karissāmi` → chu
  đáo lo cho · `ñāṇavihāra` → hiểu biết. 0.1 giữ `Saṁyutta Nikāya 41.4` theo 1673 khoá
  `:0.1` đã có; 0.2 `Cittavagga` → "1. Phẩm Tâm" đúng 7 bài cùng phẩm (`sn41.1`, `2`, `5`,
  `7`, `8`, `9`, `10`).

  BẤT ĐỊNH, 0 tiền lệ trên đĩa:
  0.3 `Mahakapāṭihāriyasutta` → "Kinh Thần Thông Của Đại Ma-ha-ca". Chưa bài nào khác trong tầng
  mang `pāṭihāriya` trong tiêu đề để dựng theo. Với thân bài, kho đang dùng "nhiệm màu" cho
  `pāṭihāriya` (31 lần: `an3.60` dịch `iddhipāṭihāriyaṁ` → "thần thông nhiệm màu",
  `ādesanāpāṭihāriyaṁ` → "tha tâm nhiệm màu"), còn đây tôi dùng "Thần Thông" cho
  `pāṭihāriyasutta` và "thần thông" cho `idhipāṭihāriyaṁ` ở 5.2 (5.2 còn giữ nguyên cách của
  `an3.60`: "thần thông nhiệm màu vượt trên năng lực con người" → "một phép thần thông vượt
  khả năng con người"). **Người biên tập nên chốt một cách cho `pāṭihāriya` rồi áp lại cho
  `sn41.4:0.3` và `an3.60`;** tôi không tự tạo cách thứ N+1.
  4.6–4.9 và 6.1–6.3 là hai lượt hỏi `alamettāvatā` trần trụi (chỉ có đáp bằng cử chỉ), không
  có tầng tham chiếu nào cho cách nói; giữ nguyên cách hiện có.

  KHÔNG ĐỐI CHIẾU ĐƯỢC tầng `vietnamese-current` (Hòa thượng Thích Minh Châu): lớp Bilara
  tiếng Việt tại commit đã ghim chỉ có Pháp Cú. Giới hạn của bản chụp upstream, không phải
  thiếu sót của repo.

  `technical_integrity` = 9.6 vì lát này không được chạy `npm run validate|test|check|build`
  (bị cấm). Tự kiểm bằng `_hvi.kiểm()`: 47/47 khoá, không khoá thừa, không Pāli lọt, không
  trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, toàn bộ ký tự
  NFC.
