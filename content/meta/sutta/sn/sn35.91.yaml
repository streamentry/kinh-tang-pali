notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có 26 chương Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Hai tầng còn lại là Pāli root (authority) và bản Anh Bhikkhu Sujato đã ghim.
  - >-
    **Coverage tầng Anh 0,889** (18 Pāli có nội dung, 16 có chữ; trống `sn35.91:2.5` và `:2.6`) — trên ngưỡng 0,80. Hai đoạn trống trùng nguyên văn `sn35.90:2.7` và `sn35.90:3.6`, đã có bản Việt.
  - >-
    **Bài song song trùng Pāli, dùng lại nguyên văn — 9 khoá.** `sn35.90` (`Paṭhamaejāsutta`, đã `published`) là bài *Paṭhama* của chính cặp này: `:1.1 :1.2 :1.3 :1.4 :1.8 :2.1 :2.5 :4.3` và `:4.2` lấy nguyên văn. Tiêu đề `Dutiyaejāsutta` → *Kinh Dao Động Thứ Hai* theo `sn35.90:0.3`.
  - >-
    **Dấu lược — quyết định từng khoá.** Pāli lược ở `:1.5 :1.6 :1.7 :2.2 :2.3 :2.4 :3.1 :3.2 :3.3` (dấu `…` rời) và `:1.10 :2.6` (`…pe…`). Bản Việt giữ **một** `…` mỗi khoá. Riêng `:1.10`, `:2.6`, `:3.6` là câu *peyyāla* đã nêu đủ ngay trong chính bài (`:1.9`, `:2.6`, `:3.5`) nên giữ đủ chữ, không nén thêm (luật BRIEF_VI3 §10.2).
  - >-
    **Công thức `:1.9 / :2.6 / :3.5`** (`Yañhi, bhikkhave, maññati…`) dùng nguyên văn 3 tiền lệ trong kho. Nhánh thân–khẩu–ý (`:1.4`–`:4.1`) dùng đúng bộ từ của `sn35.90`: *mắt / các sắc / nhãn thức / nhãn xúc / lưỡi / các vị / thiệt thức / thiệt xúc / ý / ý thức / ý xúc*, và *vị ấy đừng tưởng nghĩ … / đừng tưởng nghĩ: ‘… là của ta’*.
  - >-
    **0 tiền lệ, đặt mới.** `bhavasatto loko bhavameva abhinandati` → *Thế giới chấp thủ vào sự tồn tại, chỉ ưa thích sự tồn tại, mà rồi trở thành điều khác* — `bhava` chưa có bản Việt nào trong kho; chọn *sự tồn tại* vì *tồn tại* đã dùng 608 lần. `khandhadhātuāyatanā` → *uẩn, sắc và căn* (theo *năm uẩn*, *sáu căn* đã có trong kho). `loke` → *thế giới* (1.068) thay vì *thế gian* (1.039).
  - >-
    **Khác kho, có chủ ý — số đếm.** `Saṁyutta Nikāya` → *Tương Ưng Bộ* (xem `sn35.105`).
  - >-
    `technical_integrity` 9.6 vì bốn lệnh cổng **do coordinator chạy**, lát này đã tự kiểm mọi thứ còn lại bằng `_hvi.kiểm` (NFC, dấu lược khớp từng khoá, nháy kép cân trên cả bài, không Pāli lọt): `npm run validate` · `npm test` · `npm run check` · `npm run build`.
