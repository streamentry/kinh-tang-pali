  - >-
    **Thuật ngữ cốt lõi của bài kinh Kāyasutta:** (1) *Thân tồn tại nhờ thức ăn*
    (`kāyo āhāraṭṭhitiko, āhāraṁ paṭicca tiṭṭhati, anāhāro no tiṭṭhati`): dịch
    thống nhất xuyên suốt bốn vị trí mở đầu và kết thúc (1.2–1.3, 7.1–7.2,
    8.1–8.2, 16.1–16.2). (2) *Năm triền cái và thức ăn tương ứng:* - Dục tham
    (`kāmacchanda`): tướng tịnh (`subhanimitta`). - Sân (`byāpāda`): tướng đối
    kháng (`paṭighanimitta`). - Hôn trầm thụy miên (`thinamiddha`): không hân
    hoan (`arati`), uể oải (`tandi`), biếng nhác (`vijambhitā`),
      say sau khi ăn (`bhattasammado`), và tâm suy nhược (`cetaso ca līnattaṁ`).
    - Trạo hối (`uddhaccakukkucca`): tâm không an tịnh (`cetaso avūpasamo`). -
    Hoài nghi (`vicikicchā`): các pháp làm nhân cho hoài nghi
    (`vicikicchāṭṭhānīyā dhammā`). (3) *Bảy giác chi và thức ăn tương ứng:* -
    Niệm giác chi (`satisambojjhaṅga`): các pháp làm nhân cho niệm giác chi
    (`satisambojjhaṅgaṭṭhānīyā dhammā`). - Trạch pháp giác chi
    (`dhammavicayasambojjhaṅga`): các pháp thiện và bất thiện (`kusalākusalā
    dhammā`),
      các pháp có tội và không có tội (`sāvajjānavajjā dhammā`), các pháp hạ liệt và cao thượng (`hīnapaṇītā dhammā`),
      các pháp có phần đen trắng đối ứng nhau (`kaṇhasukkasappaṭibhāgā dhammā`).
    - Tinh tấn giác chi (`vīriyasambojjhaṅga`): khởi phát giới (`ārambhadhātu`),
    tinh cần giới (`nikkamadhātu`),
      dũng mãnh giới (`parakkamadhātu`).
    - Hỷ giác chi (`pītisambojjhaṅga`): các pháp làm nhân cho hỷ giác chi
    (`pītisambojjhaṅgaṭṭhānīyā dhammā`). - Khinh an giác chi
    (`passaddhisambojjhaṅga`): thân khinh an và tâm khinh an (`kāyapassaddhi,
    cittapassaddhi`). - Định giác chi (`samādhisambojjhaṅga`): tướng tịnh chỉ
    (`samathanimittaṁ`), tướng bất loạn (`abyagganimittaṁ`). - Xả giác chi
    (`upekkhāsambojjhaṅga`): các pháp làm nhân cho xả giác chi
    (`upekkhāsambojjhaṅgaṭṭhānīyā dhammā`). (4) *Tác ý:*
    `ayonisomanasikārabahulīkāro` → *Thường xuyên không như lý tác ý ở đó—* (cho
    năm triền cái); `yonisomanasikārabahulīkāro` → *Thường xuyên như lý tác ý ở
    đó—* (cho bảy giác chi).
  - >-
    **Cấu trúc cú pháp và đối soát dấu câu:** Khớp chính xác 1:1 với Pāli root
