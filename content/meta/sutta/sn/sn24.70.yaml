notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở những chỗ có tiếng Anh. Coverage English tính bằng công thức `isSubstantive` = **16/19** khoá Pāli có nội dung = **0,842**, trên ngưỡng 0,8. Ba khoá trống (`3.4`, `3.5`, `3.16`) là chỗ Sujato im lặng sau `…pe…`; lớp lấp `english-project` có tiếng Anh cho cả ba nhưng **chưa có** `content/meta/en/sutta/sn/sn24.70.yaml` nên không được tính vào coverage. Tầng `vietnamese-current` không có cho bài này.
  TRIANGULATION KHÔNG ĐỘC LẬP Ở BA KHOÁ: `3.4`, `3.5`, `3.16` chỉ có tiếng Anh từ lớp lấp của chính dự án. Tiêu chí 6 đặt 8,6 và bài này không tuyên bố đã đối chiếu English cho toàn bài.
  Bài song parallel `sn24.45` (đã `published`, cùng phẩm) dùng lại nguyên văn: **24** khoá Pāli trùng nguyên văn, **22** dùng lại y nguyên văn — khối `1.2` · `1.4` · `2.1`–`2.6` · `3.1`–`3.9` · `3.11`–`3.20` (trong đó `3.7`–`3.9` lấy nguyên văn `sn24.45`, và `3.18`–`3.20` lặp lại nguyên văn `3.7`–`3.9` vì Pāli hai vòng giống hệt nhau). Tổng lát c37: 127 cặp trùng Pāli, 121 dùng lại nguyên văn.
  0 tiền lệ, đặt mới, ghi kèm lý do. `adukkhamasukhī attā hoti arogo paraṁ maraṇā` xuất hiện **11 lần** (1.3, 2.2, 2.7, 3.5, 3.9, 3.16, 3.20 cộng bản song song ở `sn24.44`) và **không bài nào trong kho đã dịch**, kể cả `sn24.44` và `sn24.96` vẫn chưa có bản Việt ⇒ dịch **một lần rồi dùng lại y nguyên văn cho cả 7**: *‘Tự thân vừa không khổ vừa không vui, sau khi tử vẫn không mang bệnh’*. Ba quyết định trong đó: (1) `adukkhamasukha` → *không khổ không vui* (mẫu có sẵn 4 khoá so với *không khổ không lạc* 3) · (2) `attā` giữ làm chủ ngữ và dịch *tự thân* chứ không quy về *ta* — đây chính là kiến chấp mà cả bài đang phủ nhận, làm mất nó là làm méo điểm chính của kinh · (3) `arogo paraṁ maraṇā` là vế đối lập với `attā` bất biến, dịch *sau khi tử vẫn không mang bệnh* chứ không dịch *và không bệnh* để khỏi lặp từ *vẫn*. Tên kinh `Adukkhamasukhīsutta` đặt theo Sujato (*The Self is Neither Happy Nor Suffering*) → *Kinh Tự Thân Vừa Khổ Vừa Vui*.
  `Chabbīsatimaṁ.` → *Chuỗi lặp thứ chín mươi tư.* và `Tatiyapeyyālo.` → *Chuỗi lặp thứ ba.* — `peyyāla` dịch *chuỗi lặp* theo tiền lệ `sn35.227:1.4` (*Chuỗi lặp thứ sáu mươi đã hoàn tất.*), và đây là lý do không để chữ Pāli `Tatiyapeyyālo` lọt vào bản Việt.
  SỬA NGOẶC KÉP CÓ CHỦ ĐÍCH: Pāli bài này lệch ngoặc ở chính nó — chạy `“`-`”` trên toàn bộ Pāli cho **−1**. Bản Việt phải cân, nên `3.14` bỏ dấu khép thừa (chỉ còn `“` mở, khuôn `…` đứng giữa), đúng như `sn24.45` đã làm cho cùng lỗi. Đây là lý do duy nhất `3.14` khác mọi khoá.
  Dấu lược: Pāli có `…pe…` ở **năm** khoá (`1.4`, `2.3`, `3.3`, `3.10`, `3.14`) và `…` trần ở bốn khoá (`2.4`, `2.5`, `3.11`, `3.12`); mỗi khoá Việt giữ **đúng một** `…`, không mở rộng.
  `notes` ở đây là khối literal `|-` thụt 2 đặt ở GỐC file, đúng như `content/meta/sutta/sn/sn24.45.yaml` (đã đọc mẫu đích trước khi ghi).
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy — lát agent này không chạy bốn lệnh đó, nên `technical_integrity` đặt 9.6 chứ không 10.0. Tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài.
