notes: |-
  **UID-gộp: đã đọc `path` và đếm thật.** 11 khoá, tiền tố thật là `sn55.61:`, `all` khớp 11/11, `thừa` bằng 0.

  **Tự kiểm.** Bài này **không có khoá nào dài từ 40 ký tự**, nên `kiểm()` của `_hvi.py` chạy assertion nào — kể cả cân ngoặc kép. Tôi tự quét MỌI khoá của cả lát (`_tvd7_2_chk.py`, 136 khoá): đúng tập khoá `all`, NFC, **số dấu lược khớp Pāli từng khoá**, ngoặc kép cân trên cả bài, không Pāli lọt, không `(…)`, không trùng Pāli, `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **`1.1` có HAI dấu lược, không phải một.** Pāli là `“…. Paññāvepullāya … saṁvattantī”ti.` — dấu `…` đầu là dấu lược viết tắt của phần bị lược, và dấu `…` sau `Paññāvepullāya` là dấu lược thứ hai, nên bản Việt phải có **hai** `…`. Bản anh em `sn55.60:1.1` chỉ có một vì Pāli bên đó chỉ có một — tôi đếm từng khoá chứ không sao chép. Cả hai đều giữ nguyên, không mở rộng (BRIEF_VI3 §10.1).

  **Tiêu đề đặt theo anh em.** `Sappaññavagga` → *Phẩm Có Tuệ* (đúng `sn55.60:0.2`). `Paññāvepullasutta` → *Kinh Bốn Pháp Dẫn Đến Chỗ Trí Tuệ Rộng Lớn*, theo `sn55.62:0.3` *Kinh Bốn Pháp Dẫn Đến Chỗ Trí Tuệ Lớn* (`mahāpaññāsutta`) chỉ khác chữ *rộng* cho `vepulla` — `vepulla` → *rộng lớn* (191 chỗ, `mn141:29.5`). `saṁvattantī` → *dẫn đến chỗ …* (đúng nguyên văn `sn55.60:1.1`).

  **Uddāna, và ba mục phải xử khác nhau — ghi rõ.**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: `Sagāthaka` lấy `translationTitle` của `sn55.51` (*Kinh Có Kệ*, `published`). `Caturo phalā` là **bốn** bài quả sn55.55–58, nên tôi dịch *Bốn bài Quả Vị* chứ không phải *bài Bốn Pháp …* như tiêu đề từng bài. Còn `Vassaṁvuttha`, `Dhammadinnā`, `Gilāna` (`sn55.52`–`54`) **chưa có bản Việt**; `Dhammadinnā` và `Gilāna` là **tên riêng** nên tôi giữ Pāli (tiền lệ: `sn2.30:18.4` giữ *Susīma* và *Nānātitthiya*; `sn55.50:2.4` giữ *Đại Danh*), còn `Vassaṁvuttha` là mô tả nên tôi dịch *Đã Vào Hành Vassa*. Nếu lát sau dịch ba bài đó với tiêu đề khác, uddāna ở đây sẽ lệch — cần biên tập thống nhất.

  **Mười một mục khớp mười một bài `sn55.51`–`61`**, và `1.2` `Ekādasamaṁ` là *Thứ mười một* (47 chỗ); `1.3` `Sappaññavaggo chaṭṭho` → *Phẩm Có Tuệ, thứ sáu* (`sn46.20:1.6`, `sn55.50:1.6`). `cāti` → *là vậy* (33 chỗ đếm được trong uddāna của tầng, vd `sn55.50:2.4`) — con số này chỉ tính các vế `… cāti.`.

  **Không có bản Việt tham khảo** tại commit đã ghim; `triangulation` là Pāli + English Sujato (4/11; Sujato **đã mở rộng** phần lược ở `1.1` thành *when four things are developed and cultivated*, nên chỗ đó tôi dịch theo Pāli chứ không theo).

  **`technical_integrity` 9,6** vì đợt này cấm `npm run validate|test|build`.
