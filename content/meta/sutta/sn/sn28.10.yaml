notes: |-
  TẦNG THAM KHẢO CÓ. `sn28.10_translation-en-sujato.json` có đủ 41/41 khoá; 23/26 khoá
  Pāli có nội dung ≥ 40 ký tự có chữ Sujato (88%), 3 khoá còn lại do lớp lấp
  `content/translation/en/project/sutta/sn/sn28.10_translation-en-project.json` của dự án bù,
  và lớp lấp ấy đang `published` (`content/meta/en/sn/sn28.10.yaml`) ⇒ **100%** coverage, không
  cần entry `reference-gaps`. Tầng `vietnamese-current` vắng.

  :0.1 `Saṁyutta Nikāya 28.10` (ṁ = U+1E41, 1482/1612 tệp sn). :0.2 trùng nguyên văn 9 tệp.
  :0.3 `Sucimukhīsutta` không có tiền lệ trùng giá trị Pāli; Sujato đọc With Sucimukhī →
  Kinh Với Sucimukhī, đồng bộ với sn47.29:0.3 (Kinh Với Sirivaḍḍha).

  TÊN RIÊNG KHAI VÀO BỘ NHỚ TIẾN TRÌNH: `Sucimukhī` (0.3) là tên riêng Pāli thật — có mặt
  nguyên văn ở 1.4 và 6.1 — nhưng chưa có ở tầng Việt; khai vào `_TỪ_VI` theo cơ chế
  `lọt_pāli(pāli_riêng=…)`, không sửa `_hvi.py`. Ở 7.6 Pāli viết `sūcimukhī` (dài), tôi dùng
  chữ ngắn `Sucimukhī` cho khớp với 0.3/1.4/6.1 trong cùng bài.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ: 6.5 (233/235 tệp), 7.0 (298/385 tệp dùng Tóm lược),
  7.3–7.4 TRÙNG NGUYÊN VĂN `sn40.11:7.3–7.4` (cùng công thức uddāna liệt kê tên các Tăng Bộ).

  THUẬT NGỮ ĐO ĐƯỢC.
  `veḷuvane kalandakanivāpe` → Trúc Lâm, chỗ nuôi dưỡng sóc (đa số: sn4.6, sn4.7, sn4.9,
  sn7.1, sn8.9; chỉ 2 tệp dùng rừng trúc Veḷuvana … Kalandaka).
  `sapadānaṁ piṇḍāya` → khất thực từng nhà một (sn6.3:3.2, sn7.8:2.2).
  `paribbājikā` → nữ du sĩ (ud2.6:1.4). `kuṭṭamūlaṁ` → chân tường (Sujato: by a wall).
  `rathiyāya rathiyaṁ, siṅghāṭakena siṅghāṭakaṁ` → từ đường này sang đường kia, từ ngã tư
  này sang ngã tư khác (tiền lệ y nguyên sn10.9:1.3). Bản nháp đầu ghi ngã ba/quảng trường —
  đã sửa theo tiền lệ.
  `micchājīvena jīvikaṁ kappenti` → sinh sống bằng … mạng sống sai quấy (an4.50:8.1).
  `dūteyyapahiṇagamanānuyogā` → việc làm người đưa thư và người gửi tin (sn56.93:1.1,
  an4.198:9.15). `tiracchāna` ở đây là tà quán (Sujato: a low lore), khác nghĩa `tiracchānayoni`
  (súc sanh) — tách hai nghĩa.
  `sakyaputtiyā` → dòng Thích tử (sn42.10:1.3).

  CẤU TRÚC HỎI ĐÁP — KHÔNG LẶP KHUÔN.
  2.1–2.8 là tám câu hỏi/đáp đối xứng theo BỐN phương (dưới / trên / bốn phương / bốn
  phương xen kẽ) của adhomukha, ubbhamukha, disamukha, vidisamukha. 3.1–3.4 là Sucimukhī
  nhắc lại đúng bốn cặp ấy theo `… puṭṭho samāno … vadesi`. Tôi viết tay từng cặp, không
  sinh bằng khuôn: 3.1 dùng mẫu dạng câu hỏi của 2.1, còn 3.2–3.4 dùng mẫu có Vậy thì của
  2.3/2.5/2.7 vì Pāli 3.2–3.4 bắt đầu bằng Tena hi còn 3.1 bắt đầu bằng Kiṁ nu. Nhúng `‘…’`
  như an9.14:11.x vì Pāli khoá 3.x không mở `“`.
  4.2–4.5 liệt kê bốn nghề sai quấy theo cùng thứ tự bốn phương, rồi 5.1 Sāriputta phủ
  định cả bốn. 5.1 lặp lại đủ bốn nghề — đúng như Pāli, KHÔNG lược bớt.

  TRÍCH DẪN KÉP: 2.1–2.8 mỗi cặp một `“`…`”`; 4.1 đóng ngoặc mở từ 4.2 (giống hệt cách
  Pāli làm); 5.3 đóng; 6.2–6.4 cặp riêng. Cân trên toàn bài.

  TẦNG THAM KHẢO ĐÃ ĐO.
