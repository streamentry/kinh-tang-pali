notes: |-
  Dịch từ Pāli root; đối chiếu Sujato đã ghim (coverage 20/20 = 100%). Tầng `vietnamese-current` không có cho bài này (bilara tại commit đã ghim chỉ có Pháp Cú).
  **Bản song parallel trùng Pāli: 10 khoá, dùng lại y nguyên văn 5.** `snp1.12:5.1–5.3` (kn) cho ba câu kệ `Sabbābhibhuṁ sabbaviduṁ sumedhaṁ` / `Sabbesu dhammesu anūpalittaṁ` / `Sabbañjahaṁ taṇhākkhaye vimuttaṁ` — **cùng Pāli, dùng lại nguyên văn**. `sn54.6:2.3` và `sn11.3:12.4` cho `suṇāhi … bhāsissāmī` và `Idaṁ vatvāna sugato athāparaṁ`. Tiêu đề phẩm `Bhikkhuvagga` → *1. Phẩm Tỳ-kheo* (10 bài). `Dasamaṁ.` → *Thứ mười.* (224/227).
  **Bốn chỗ cố ý viết khác, kèm số đếm.** (1) `ekamantaṁ nisinno … etadavoca` — kho có 47 cách; chọn *ngồi xuống một bên* (2/47) theo `sn21.4` **cùng bộ**. (2) `eko raho nisīdati` → *ngồi ở chỗ vắng* (raho = yên lặng), không dịch *cô đơn*. (3) `thaṁ suṇāhi, sādhukaṁ manasi karohi` → *hãy nghe, hãy khéo tác ý* thay vì *hãy lắng nghe và khéo tác ý* (`sn54.6:2.3`), vì cần khớp `sādhukaṁ manasi karohi` với một mệnh đề. (4) `satthā taṁ, āvuso thera, āmantetī` — `āvuso` là cách xưng hô kẻ dưới, dịch *Bạch người được tôn là trưởng lão, Đạo sư bảo mời ngài* thay vì *Reverend Senior*; chữ *thầy trưởng lão* trong `2.4` để dành cho `āyasmā thera`.
  **0 tiền lệ, đặt mới, ghi kèm lý do:** `Theranāmakasutta` → *Kinh Chỉ Có Tên Là Trưởng Lão* (Sujato: *Senior in Name Only*; `theranāmaka` là tiếng Hy Lạp *thēranomikos* mang nghĩa chỉ có danh nghĩa trưởng lão) · `ekavihāri` → *sống một mình* (0 khoá có chữ này; đã dùng *sống một mình* cho `eko vūpakaṭṭho` ở `sn22.159`, `sn35.64`, `sn47.15/16`) · `attabhāvapaṭilābha` → *sự hiện hữu* (đọc theo Sujato *present incarnations*) · `chandarāgo` → *sở thích cùng tham ái* (hai sắc tháo riêng trong một từ kép, không gộp làm một; bản nháp đầu gộp thành *sở thích tham ái*, đã sửa trong lượt review đối kháng).
  **Bất định đã ghi nhận.** `3.6`: `yaṁ atītaṁ taṁ pahīnaṁ, yaṁ anāgataṁ taṁ paṭinissaṭṭhaṁ` — hai vế đối xứng quá khứ/tương lai được dịch song song (*được nhường bỏ* / *được từ bỏ*); `paccuppannesu ca attabhāvapaṭilābhesu chandarāgo suppaṭivinīto` là mệnh đề thứ ba cùng chủ ngữ, không phải lời giải thích cho hai vế trước. `3.1` `attheso … neso natthīti vadāmi` là Đức Thế Tôn **không phủ nhận** (*Tôi không phủ nhận điều đó*), phải giữ dấu phủ định.
  Dấu lược: `3.4` có `…pe…` → giữ **một** `…`, không mở rộng. `notes` dùng khối literal `|-` thụt 2, đã đọc mẫu đích trước khi ghi. Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` (và `npm run build` vì có bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9.6 chứ không 10.0.
