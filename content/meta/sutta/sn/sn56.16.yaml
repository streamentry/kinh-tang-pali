notes:
  - >-
    **Cảnh báo về khuôn tải `Saṁyutta Nikāya` — đo lại, đúng nhưng số đã lệch.** Lệnh lát bảo `0.1` của bài `sn` là `Saṁyutta Nikāya` ở 1562/1562 tệp và tuyệt đối không dùng `Saṡyutta`. Tôi đo lại: **1.582/1.582** tệp `sn` có khoá `:0.1`, và **1.582** viết `Saṁyutta Nikāya` (chữ `ṁ` không dấu chấm). Tỷ lệ 100% và không tệp nào viết `Saṡyutta`, nên chốt đúng như lệnh lát; chỉ là con số 1.582 chứ không phải 1.562.
  - >-
    **Mọi trích dẫn trong `notes` này đã tra bằng script** trên chỉ mục Pāli↔Việt tự dựng (5.032 bài, 88.415 chuỗi Pāli khác nhau) — trong đó **loại 8 tệp của chính lát này**, để không tự đếm bản dịch của mình làm tiền lệ.
  - >-
    **Coverage Anh đo bằng script, không suy.** Đo theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ, cộng `english-sujato` và `english-project` khi status là published). Cách đo đã được **kiểm lại** bằng bài đã có sẵn: chạy lại đúng công thức này trên `an5.249` cho ra **16/21 = 0.7619**, khớp con số đã ghi trong `blocking_errors` của chính tệp đó. Bài này đạt 25/25 = 100%, nên không cần mục trong `content/meta/reference-gaps.yaml` và không có blocker về tầng tham khảo.
  - >-
    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo.** Tại commit đã ghim, tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) chỉ có Pháp Cú, nên **không có bản Thích Minh Châu để đối chiếu ở bất kỳ bài nào trong lát này**. Đối chiếu thuật ngữ vì vậy dựa vào Pāli root + bản Anh Sujato đã ghim + **tiền lệ đo được trong chính tầng Việt của kho**; `budsas.org` là tra cứu toàn văn, không dựng cột.
  - >-
    **Dấu lược — giữ đúng luật, không mở rộng.** Mọi khoá Pāli có `…pe…` đều giữ **đúng một** `…` trong bản Việt (luật §10.1 của BRIEF_VI3), và **không** khoá nào được thêm `…` để che chỗ thiếu. Ở những khoá lược, công thức bị nén đều là `peyyāla` mà bài đã phát lại đủ ở chỗ khác, nên nén thêm cũng không mất thông tin; tôi không mở rộng bất kỳ khoá lược nào.
  - >-
    **Bài này là bản song song của `sn56.15` (`Paṭhamadhāraṇasutta`), và tôi bám theo bài anh.** Đọc kỹ `sn56.15` đã có trong kho: cùng câu hỏi `Dhāretha no tumhe…`, cùng `ahaṁ kho, bhante, dhāremi…`, cùng thứ tự bốn Thánh đế, cùng khối `yo hi koci, bhante, samaṇo vā brāhmaṇo vā evaṁ vadeyya` và cùng câu `Tasmātiha… yogo karaṇīyo`. **11 khoá** của tôi trùng Pāli nguyên văn với `sn56.15` và dùng lại y hệt: *Này các tỳ-kheo, các ông có ghi nhớ bốn Thánh đế do Ta thuyết giảng chăng?* · *Khi được nói như vậy, một vị tỳ-kheo thưa với Thế Tôn:* · *Bạch Thế Tôn, con có ghi nhớ bốn Thánh đế do Thế Tôn thuyết giảng.* · *Này tỳ-kheo, ông ghi nhớ bốn Thánh đế do Ta thuyết giảng như thế nào?* · *Bạch Thế Tôn, đó là cách con ghi nhớ bốn Thánh đế do Thế Tôn thuyết giảng.* · *Lành thay, lành thay, này tỳ-kheo!* · *Lành thay khi ông ghi nhớ bốn Thánh đế do Ta thuyết giảng.* · *Khổ là Thánh đế thứ nhất do Ta thuyết giảng, hãy ghi nhớ như vậy.* · *Con đường đưa đến khổ diệt là Thánh đế thứ tư do Ta thuyết giảng, hãy ghi nhớ như vậy.* · *Do đó, này tỳ-kheo, hãy nỗ lực quán chiếu: ‘Đây là Khổ’ … hãy nỗ lực quán chiếu: ‘Đây là Con đường đưa đến khổ diệt.’*
  - >-
    **5 khoá cùng Pāli nhưng tôi cố ý không dùng lại y hệt — nói rõ từng khoá.** `2.6`/`2.12`/`3.7`/`3.14` (`netaṁ ṭhānaṁ vijjati`) có ba cách sẵn (*không có khả năng ấy* 6 bài, *điều ấy không thể xảy ra được* 2, *điều ấy không thể có* 1); tôi chọn **điều ấy không thể có** vì đây là lời của Đức Phật phủ nhận một khả năng, và câu đó nặng hơn. `2.8` có sẵn *con ghi nhớ Con đường đưa đến khổ diệt…* nhưng bản sẵn bắt đầu bằng chữ thường giữa chừng, đọc như trang trước; tôi viết lại theo đúng Pāli `dhāremi` (*…con cũng ghi nhớ*). Ngoài 5 khoá đó, **20** khoá còn lại là Pāli mới.
  - >-
    **Chỗ tôi không theo đa số, đã đo.** Tên kinh `Dutiyadhāraṇasutta`: trong `sn` đo được **(Hai) 107** lần và **Thứ Hai** 37 lần nên tôi dùng *Kinh Ghi Nhớ (Hai)* — nhưng bài anh `sn56.15` lại viết *Kinh Ghi Nhớ Thứ Nhất*, nên cặp đọc được sẽ lệch nhau. Nếu người điều phối muốn cặp *Thứ Nhất / Thứ Hai* thì phải đổi cả hai; tôi để theo đa số đo được và ghi ở đây. `Chaṭṭhaṁ.` dịch *Thứ sáu.* theo đa số `sn` (116 bài).
  - >-
    **Nhịp lặp ở đây là bắt buộc của nguồn, không phải lỗi khuôn.** Bài là `peyyāla` thuần: khối `2.3`–`2.13` và khối `3.4`–`3.15` phải phát lại đúng cùng một công thức, và Pāli ở `2.7` đã lược mất hai Thánh đế giữa. Tôi giữ đúng một `…` ở `2.7`, `3.8`, `3.9` và **không** bịa lại Thánh đế thứ hai và thứ ba — người đọc vẫn thấy đủ nghĩa vì `3.3`/`3.10` và `sn56.15` đã nêu tường minh.
  - >-
    **`technical_integrity` đặt 9.6 chứ không phải 10.0.** Đợt này lát bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên cổng kỹ thuật của repo **chưa chạy** và không thể tuyên bố là đã pass. Những gì đã quét bằng script riêng trên **mọi** khoá (không chỉ khoá ≥ 40 ký tự): JSON hợp lệ, đủ mọi khoá trong `all`, không khoá thừa so với Pāli, không khoá rỗng, NFC, không trùng nguyên văn Pāli, không Pāli lọt vào bản Việt, **số dấu lược khớp Pāli từng khoá**, và ngoặc kép cân trên cả bài (`ngoặc()` của `_hvi.py`). Cần chạy bốn lệnh trên trước khi merge.
