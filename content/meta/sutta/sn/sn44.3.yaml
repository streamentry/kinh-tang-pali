notes: |-
  Dịch từ Pāli root; đối chiếu bản Anh Bhikkhu Sujato ở commit đã ghim. Coverage Anh 22/38 đoạn Pāli có nội dung = 57,89%, thấp hơn ngưỡng 0,8; xem mục "Giải quyết draft 2026-10-12" ở cuối.
    Tầng Việt hiện hành không có bài này: translation/vi/phantuananh/ ở commit đã ghim
    chỉ chứa 26 chương Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu
    thuật ngữ; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo.
    budsas.org chỉ là tra cứu toàn văn, không cấp text cho tầng nào.
  16 đoạn Sujato để trống đều là bốn vế hỏi *hoti / na hoti / hoti ca na ca hoti / neva hoti na na hoti* lặp theo từng uẩn, và cùng công thức ấy đã có tiền lệ Việt trong chính tầng này.
  Tiền lệ dùng lại, đo bằng script: 1.1 có Pāli trùng nguyên văn bārāṇasiyaṁ viharanti isipatane migadāye với sn16.2, sn16.12, sn22.122, sn22.123, sn22.127 — cả năm đều dịch theo một cách là *trú ở Bārāṇasī, tại Isipatana, trong Vườn Nai*, nên bài này theo y vậy. sn44.4 ghi *trong Vườn Lộc Uyển* và sn44.5 ghi *trong khu rừng hương*, là hai cách lệch; người biên tập nên thống nhất.
  Tên riêng: mahākoṭṭhiko → *Mahākoṭṭhika*, là dạng đa số trong tầng (sn16.2, sn22.122, sn22.123, sn22.127, sn44.4, sn44.5:1.1); sn22.133 và sn44.5 dùng *Đại Cốt-thi-ka*, là cách lệch, cần thống nhất. Tên bài Paṭhamasāriputtakoṭṭhikasutta → *Kinh Sāriputta Và Koṭṭhita Thứ Nhất*, theo đúng hàng xóm sn44.4:0.3 (*Kinh Sāriputta Và Koṭṭhita Thứ Hai*).
  [Thay thế bởi mục "Giải quyết draft 2026-10-12": các cách dịch bốn vế hỏi và gatametaṁ ghi ở đó.]
  Tên phẩm 0.2 đo trong chính phẩm: 4 tệp sn44 đều ghi *1. Phẩm Không Tuyên Bố*, không phân kỳ. 0.1 đo trên 1.652 tệp sn: toàn bộ dùng Saṁyutta Nikāya, không có Saṡyutta.
  0 tiền lệ sạch cho câu *hoti ca na ca hoti* và *neva hoti na na hoti*: kho đang lẫn ba cách (*vừa còn vừa không còn*, *chẳng tồn tại chẳng không tồn tại*, *không phải có cũng không phải không có*); bài này dùng *vừa tồn tại vừa không tồn tại* và *không phải tồn tại, cũng không phải không tồn tại*, người biên tập nên thống nhất.
  Dấu lược: chỉ 3.2 có …pe… và giữ đúng một dấu lược; các khoá 2.3, 2.6, 2.9, 2.12, 3.2, 3.5 không có dấu lược nào trong Pāli thì bản Việt cũng không thêm, kể cả ở 3.2 nơi bản Anh có thêm dấu lược.
  Ngoặc kép cân trên cả bài: tám cặp mở/đóng theo đúng cấu trúc Pāli, gồm một cặp mở ở 3.1 và đóng ở 3.6, một cặp mở ở 4.1 và đóng ở 4.21.
