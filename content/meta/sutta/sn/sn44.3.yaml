  Giải quyết draft 2026-10-12: kiểm toán độc lập, đọc đối kháng 46 khoá với Pāli và bản Anh Sujato đã ghim.
    Lỗi nghĩa thật: tathāgato bị dịch thành "Tứ Thế Tôn" ở mọi chỗ xuất hiện (2.1, 2.3, 2.4, 2.6, 2.7, 2.9, 2.10, 2.12, 3.1, 3.2, 3.3, 3.5 và 4.1–4.20); đó là chữ hỏng, không có nghĩa trong Pāli và làm bốn vế hỏi về Như Lai thành vô nghĩa. Đã sửa thành "Như Lai" theo glossary (tathāgata) và theo sn44.1, sn44.2, sn44.4. Tổng 32 khoá lỗi nghĩa thật / 46 (8 ở nhóm 2, 4 ở nhóm 3, 20 ở nhóm 4); các khoá khác chỉ sửa câu chữ như liệt kê dưới đây.
    Các sửa khác: (a) thứ tự câu hỏi đổi từ "sau khi chết Như Lai có tồn tại" sang "Như Lai có tồn tại sau khi chết" theo sn44.1 (sn44.1:4.2, 4.5, 4.8, 4.11), và mở câu hỏi bằng "có phải" theo cùng bài; (b) 3.2 và 3.5 trước đây bỏ vadesi, nay thêm "ông nói vậy" như sn44.1:5.3, 5.6; (c) 3.1 bỏ "Này hiền giả" mở đầu không có trong Pāli (āvuso chỉ nằm trong hai lời trích); (d) 3.3 thêm "Vậy thì" (kiṁ pana) đã bị bỏ và gỡ "không … không?" thừa; (e) 1.2 bỏ "hôm ấy" không có trong Pāli, đổi "nhập thiền" thành "độc cư" cho paṭisallāna (10 nơi dùng "từ chỗ độc cư đứng dậy" so với 2 nơi "từ chỗ nhập thiền"), "Rồi vào buổi chiều" theo 24 nơi; (f) 1.3 gộp sammodanīya và sāraṇīya thành "lời chào hỏi thân hữu và xã giao đáng nhớ" thay vì chỉ "xã giao đáng nhớ" (18 nơi dùng "chào hỏi thân hữu", 5 nơi "xã giao đáng nhớ"); (g) 4.x thêm đại từ etaṁ: "điều ấy thuộc về sắc/cảm thọ/tưởng/các hành/thức"; (h) tên bài "Koṭṭhita" đổi thành "Koṭṭhika" cho khớp Pāli Paṭhamasāriputtakoṭṭhikasutta và tên nhân vật trong thân bài (Mahākoṭṭhika); sn44.4:0.3 vẫn ghi "Koṭṭhita", cần người biên tập thống nhất.
    Blocker cũ về coverage Anh 22/38 = 0,5789 (loại B): đã gỡ khỏi blocking_errors. 16 đoạn Sujato để trống là 2.5, 2.9, 2.12, 3.2, 3.3, 3.4, 3.5, 4.6, 4.7, 4.8, 4.10, 4.11, 4.12, 4.14, 4.15, 4.16 (2.3, 2.6, 2.8 Sujato cũng để trống nhưng Pāli dưới 40 ký tự nên không tính vào mẫu số). Đã đọc kỹ từng khoá này từ Pāli: đều là bốn vế công thức hoti / na hoti / hoti ca na ca hoti / neva hoti na na hoti lặp theo từng uẩn hoặc lặp câu "abyākataṁ … bhagavatā", cùng công thức đã có bản Anh ở các khoá lân cận (2.1–2.2, 2.4, 2.7, 2.10–2.11, 4.1–4.5, 4.9, 4.13, 4.17–4.20), nên bản Việt tự đứng vững từ Pāli, không có chỗ nghĩa chưa chắc. Mất mát này do bản Anh đã ghim và nên được ghi nhận ở content/meta/reference-gaps.yaml bằng npm run reference:gaps. triangulation đặt 7,8 (không cao hơn 8,0): tầng Anh chỉ phủ 22/38 đoạn có nội dung, Sujato còn dùng dấu lược ở 4.9, 4.13, và không có tầng english-project hay tầng Việt hiện hành cho bài này.
    Tầng Việt hiện hành (loại C) vắng: giới hạn của snapshot upstream, đã ghi ở trên; không phải lỗi văn bản.
    Điểm còn lại cần người biên tập quyết định, không đổi ở bài này: "phi tồn tại phi phi tồn tại" đo được 84 nơi trong tầng (sn41.3, sn44.1…) so với "không phải tồn tại, cũng không phải không tồn tại" ở bài này; giữ cách sau vì câu hỏi "có phải Như Lai phi tồn tại phi phi tồn tại" khó đọc với người đọc hiện đại, nhưng khác quy ước sn44.1. Đo tiền lệ khác: "không được Thế Tôn tuyên thuyết" là dạng chiếm đa số (23 nơi có dạng đơn, không có dạng khác). Lỗi tương tự ngoài phạm vi, chỉ báo: "Tứ Thế Tôn" còn ở sn44.5 (1.4, 1.9, 1.15), sn35.104 và sn36.20.
    Phép kiểm cục bộ: 46/46 khoá, tập khoá và thứ tự khớp Pāli, NFC, dấu lược …pe… → … đúng một ở 3.2, nháy đơn/kép ở 1.x–3.x khớp Pāli từng khoá (4.1–4.20 thêm ‘…’ quanh lời trích như bản Anh và các bài sn44 lân cận, Pāli dùng ’ti; cả hai nháy cân từng khoá), không còn "Tứ". Không có cặp Pāli trùng nguyên văn bị dịch khác nhau trong bài ngoài các vế công thức đã được dùng nhất quán cho từng uẩn. technical_integrity 9.6 giữ nguyên vì môi trường không cho chạy npm run validate, npm test, npm run check và npm run build.
