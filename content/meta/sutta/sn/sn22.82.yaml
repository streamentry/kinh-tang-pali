notes: |-
  Dịch trọn 121/121 khoá từ Pāli root đã ghim, đối chiếu English Sujato đã ghim, lớp `english-project` của chính bài này, bản Việt nguyên bài ở mục Tra cứu toàn văn (Hòa thượng Thích Minh Châu, Bình Anson hiệu đính) và bài song song `mn109` (Đại kinh Đêm Trăng Tròn, cùng khung hỏi đáp mười một câu, đã có bản Việt trong tầng).

  **Coverage English.** Mẫu số = 71 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Sujato phủ 70/71 = 0,9859, trên ngưỡng 0,80. Khoá Sujato để trống duy nhất là `3.2` (`Seyyathidaṁ—rūpupādānakkhandho …pe… viññāṇupādānakkhandho`), được lớp `english-project` đã published lấp, nâng cổng lên 71/71; nhưng khoá lấp đó là bản của chính dự án, **không phải đối chiếu độc lập**, nên phần độc lập chỉ là 70/71. Tầng `vietnamese-current` vắng (upstream chỉ có Pháp Cú); thay vào đó đã đọc bản Việt nguyên bài ở mục Tra cứu toàn văn để đối chiếu thuật ngữ, không có căn lề theo khoá. Vì phần English độc lập gần như trọn vẹn và có thêm `mn109` song song, `triangulation` đặt 9,3.

  **Pāli trùng nguyên văn trong chính bài: 7 nhóm / 12 cặp, cả 12 cặp có bản Việt y nguyên** (`3.3`=`10.15`; `4.5`=`5.6`; `6.3`=`11.3`; `6.4`=`11.4`; `6.5`=`11.5`; `6.8`=`7.11`=`8.9`=`9.9`; `14.3`=`14.8`).

  **Tiền lệ ngoài bài.** Đã dò 45 khoá có Pāli trùng nguyên văn với khoá đã dịch ở tầng (2.114 cặp, trong đó 807 cặp bản Việt khác); 38 khoá dùng lại nguyên văn ít nhất một bản đã có (đa số chọn theo dạng nhiều nhất ở phạm vi gần nhất `sn22`/`sn`: `14.1`, `14.2`, `14.7`, `14.10`, `14.12`–`14.16` đã có ở `sn22.80` và nhiều bài `sn22`/`sn35`; `6.3`–`6.5`, `11.3`–`11.5` "Mọi cảm thọ/tưởng/hành nào …" theo `sn22.91`/`sn22.92`; `11.1` y nguyên `sn22.71:1.3`; `14.9` "Cái gì vô thường là khổ hay lạc?" (`sn22` 5 khoá, `sn` 18 khoá, so với dạng "Cái gì vô thường, là khổ hay là lạc?" 0 khoá `sn22`, 11 khoá `sn`; nhưng cả tầng kể cả `mn` thì dạng có dấu phẩy 31 khoá so với 22 — hai phạm vi cho đa số khác nhau, đã chọn dạng gần nhất, và vì vậy `14.9` khác `sn22.80:10.4`); `14.11` giữ "chịu sự biến hoại, có hợp lý chăng khi quán xét điều ấy" (ở `sn22` hai dạng ngang nhau 2:2; ở `sn` dạng "có tính biến đổi, có nên xem như vầy" 12 khoá so với 7; chọn dạng đã dùng ở `sn22.59` và `sn22.80`); `2.3`, `2.5`, `5.3`, `5.4`, `7.6`, `7.9`, `8.8`, `9.1`, `9.8` y nguyên `mn109`; `14.14` y nguyên `sn22.83:4.9`). Bảy khoá cố ý khác với tiền lệ:
  - `2.6` kết bằng "?" thay vì "." của `mn109:4.4`, vì ở bài này `2.5`–`2.6` là **một câu hỏi** (Pāli mở `ime nu kho` ở `2.5`), và `mn109:4.2` (cùng chức năng) cũng kết bằng "?".
  - `8.4` "cảm thọ …" (11 cặp, 8 dạng khác nhau, không dạng nào áp đảo).
  - `8.7`, `9.7` đi theo khuôn "quán … là tự ngã, hay tự ngã có …" của `sn22.7`/`sn22.43` (ở `sn22` có hai khuôn: "thấy … là tự thân" 3 khoá và "quán … là tự ngã" ít nhất 4 khoá); `9.3`, `9.7` lặp "không quán" ở từng vế vì Pāli có `na` ở từng vế.
  - `10.3`, `10.4` "cái gì của tưởng/các hành …" thay cho "thế nào là của tưởng/các hành …" ở `sn22.5:6.2`–`6.3`, vì ở đó câu hỏi là *sự diệt tận*, ở đây là bộ ba *vị ngọt – nguy hại – xuất ly* và có `ko` ("cái gì") ở đầu.
  - `11.7` theo `sn22.91:2.7` ("thiên hướng mạn không sinh khởi") thay cho `mn109:13.7` ("mạn tùy miên"), vì ở 28 khoá `sn`/`mn` có `ahaṅkāramamaṅkāramānānusayā` thì 22 khoá dùng "chấp tôi" và 0 khoá dùng "ngã kiến".

  **Thuật ngữ, kèm số đếm.** `upādānakkhandha` → "thủ uẩn" (131/154 khoá trong `sn`/`mn`); `chandarāga` → "dục tham" (27/86, so với "ham muốn" 16 và "lòng dục" 4; là dạng nhiều nhất và `sn22.26` đã dùng cho đúng cụm `chandarāgavinayo chandarāgappahānaṁ`); `sakkāyadiṭṭhi` → "thân kiến" (35/42; "tà kiến về thân" 5 khoá, trong đó có `sn22.155`); `assutavā puthujjano` → "kẻ phàm phu chưa học" (22/24 ở `sn22`); `sutavā ariyasāvako` → "bậc Thánh đệ tử đa văn" (22/31 ở `sn22`, 84/117 ở `sn`/`mn`); `ādīnava` → "sự nguy hại" (17/17 ở `sn22`, 109/141 ở `sn`/`mn`); `assāda` → "vị ngọt" (63/92); `ahaṅkāramamaṅkāramānānusayā` → "chấp tôi, chấp của tôi, thiên hướng mạn" (theo `sn22.71`, `sn22.91`, `sn22.124`); `vedanā` đứng riêng → "cảm thọ" theo các khoá lược `sn22`, còn trong hợp từ → "thọ thủ uẩn", "thọ uẩn" (`mn109`, `sn22.105`); `sukhaṁ somanassaṁ` → "hỷ lạc" (`sn22.26`); `migāramātupāsāda` → "lầu của mẹ Migāra" (`sn48.41`, `sn51.14`, `sn48.45`).

  **Số Pāli.** `pañca` = năm (`pañcupādānakkhandhā` ở `2.5`, `3.1`, `4.1`…); `cattāro` = bốn (`7.6`, bốn đại); `pannarase` = mười lăm (`1.2`); `dasa`/`dasavidhā` = mười (`15.5`); `Dasamaṁ` = thứ mười (`15.7`); `tatiyo` = thứ ba (`15.8`); `dve`/`duve` = hai (`15.1`, `15.3`, `16.1`, `16.2`). Không có số lớn nào cần tính; không có `Tiṁsakappasahassa`.

  **Bất định đã ghi, không giấu.**
  - `5.2` `Siyā, bhikkhū`: hình thức `bhikkhū` có thể là số nhiều hô cách, nhưng cả cuộc đối thoại (`2.3`, `3.1`, `5.3`, `5.5`) chỉ có **một** vị tỳ-kheo hỏi, và bản Việt nguyên bài cũng ghi số ít; đã dịch "này tỳ-kheo". `mn109:7.2` dịch số nhiều "này các tỳ-kheo" cho khoá song song (Pāli hơi khác), nên đây là chỗ lệch có chủ ý với `mn109`.
  - `12.3`, `13.3` `kathamattānaṁ phusissantī` (`katham` + `attānaṁ`): Sujato dịch "how will … affect the self?", còn `mn109:14.3` có dị bản Pāli `kamattānaṁ` và dịch "tự ngã nào". Đã bám Pāli của bài này: "sẽ chạm đến tự ngã như thế nào?". Một cách đọc khác ("ngã nào lãnh thọ", Hòa thượng Thích Minh Châu ở bản nguyên bài) không thể loại trừ hoàn toàn nhưng không đổi nội dung giáo lý (nghiệp do vô ngã làm ra thì tác động thế nào đến cái được cho là ngã).
  - `13.4` `Paṭipucchāvinītā`: tầng không có tiền lệ cho dạng này; `mn109:14.8` dịch "dẫn dắt bằng cách hỏi lại" cho `paṭivinītā` (Pāli khác một thành tố). Đã giữ thành tố `paṭipucchā` ("hỏi lại") và `tatra tatra tesu tesu dhammesu` ("ở chỗ này chỗ kia, trong những pháp này pháp nọ"); Sujato dịch "educated by me in questioning", bản nguyên bài dịch "các câu vấn nạn đã được Ta khéo dạy cho các Ông". Không đổi nghĩa lớn, nhưng là chỗ ba bản đọc hơi khác nhau.
  - `6.1`, `6.7` `khandhādhivacanaṁ`: dịch "các uẩn có danh xưng là uẩn". Pāli không có dấu nháy ở đây nên không thêm nháy đơn như `mn109:8.1` ("danh từ ‘uẩn’"); nghĩa tương đương. Cùng lý do cho `15.2` "danh xưng".
  - `5.4` `evaṁrūpo siyaṁ` dùng lại dạng đã có ở `mn109:7.4`, `sn22.3:12.3` ("ta có sắc như thế này"); Pāli là ngụ ý ước ("mong rằng ta là người có sắc như thế này"), dạng tầng đã chọn hơi nén hơn.
  - `15.1`–`15.6` là bài kệ tóm lược mười câu hỏi của chính kinh (hai câu về uẩn: `2.5` và `4.1`; `taññeva`: `4.3`; `siyaṁ`: `5.1`; `adhivacana`: `6.1`; `hetu`: `7.1`; hai câu về `sakkāya`: `8.1`, `9.1`; `assāda`: `10.1`; `viññāṇaka`: `11.1` — đúng mười). Dịch ngắn như văn tóm lược, không thêm giải thích vào thân kinh; cách nối các từ khoá ở `15.1`–`15.4` là cách đọc của người dịch.
  - `16.1`–`16.4` bài kệ cho cả phẩm: `Assādo` (`sn22.73`), `dve samudayā` (`sn22.74`–`22.75`), `arahantehi apare dve` (`sn22.76`–`22.77`), `Sīho` (`sn22.78`), `khajjanī` (`sn22.79`), `piṇḍolyaṁ` (`sn22.80`), `pālileyyena` (`sn22.81`), `puṇṇamā` (`sn22.82`). Dịch `Assādo` thành "Vị ngọt" theo thân bài (tên bài `sn22.73` trong tầng là "Sự đáng ưa"); đây là chỗ tầng chưa thống nhất tên bài so với tên từ khoá.
  - `15.8` `Khajjanīyavaggo tatiyo` dịch "Phẩm Khajjanīya, thứ ba." theo khuôn "Phẩm Trưởng Lão, thứ tư." (`sn22.92:2.8`); Pāli ghi cả hai (`0.2` có số "8.", `15.8` có "tatiyo"), đã giữ nguyên cả hai, không suy diễn thêm về cách đánh số.
  - Không có `(…)` trần trong bài này.

  **Dấu lược và nháy.** `…pe…` và `…` trần ở 33 khoá Pāli thành đúng một `…` mỗi khoá (`12.2`, `13.2` mỗi khoá ba dấu như Pāli); không khoá Pāli nào kết `….` nên không có chỗ nào cần ` ….`. Nháy kép và nháy đơn khớp Pāli ở cả 121 khoá (đo từng khoá cho `“ ” ‘ ’`, 0 lệch); tập khoá Việt = tập khoá Pāli = 121, đúng thứ tự.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`, và `npm run build` vì bài sẽ `published`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
