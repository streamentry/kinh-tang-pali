notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim (đủ khoá) và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không căn theo segment nên chỉ dùng đối chiếu thuật ngữ và mạch lập luận, không dùng làm tầng cột). Tầng `vietnamese-current` căn theo segment không có cho bài này (tại commit đã ghim chỉ có 26 chương Pháp Cú); tầng `english-project` chưa có bản lấp cho bài này.
  Coverage English = **78/78** khoá Pāli có nội dung = **100%** (Pāli ≥ 40 ký tự, bỏ khối `:0`), cao hơn xa ngưỡng 0,8. Toàn bộ 78 khoá đều do bản Sujato đã ghim cung cấp (Sujato có key cho cả 117/117 khoá; chỉ `14.7`, colophon `Chaṭṭhaṁ.`, để trống và không đủ ngưỡng nội dung), nên đây là đối chiếu English độc lập chứ không phải bản lấp của dự án. Lưu ý các khoá lược `5.7`–`5.10`, `9.11`, `9.12`, `11.3`, `14.1` mà Sujato chỉ nối dấu `…`: Pāli ở đó ngắn hoặc cũng là lược, không phải chỗ Sujato bỏ trống nội dung. Vì vậy bài không cần entry trong `content/meta/reference-gaps.yaml`.
  **Số Pāli.** Bài không có số lượng nào để tính ngoài số thứ tự colophon `Chaṭṭhaṁ` = *Thứ sáu* (đúng vị trí `sn12.66` là bài thứ sáu của Phẩm Lớn, sau `sn12.61`–`sn12.65`; trong tầng 263/269 khoá Pāli `Chaṭṭhaṁ.` đã dùng *Thứ sáu.*). Không có phép nhân hay tích lũy nào.
  **Dùng lại nguyên văn đã có, đếm được.** 25 khoá của bài có Pāli trùng nguyên văn với khoá ở bài khác, tổng 1.626 cặp; 639 cặp trùng đúng văn bản Việt, 987 cặp khác. Phần khác chủ yếu là các công thức mở và đáp thoại, mỗi công thức có 3–6 cách dịch trong kho, không cách nào áp đảo: `1.3` (124 cặp: *Tại đó, Đức Phật gọi các vị tỳ-kheo:* 59, *Tại đó Đức Thế Tôn gọi các tỳ-kheo:* 15), `1.5` (95 cặp, cách giữ nhiều nhất chiếm 28/95), `1.6` và `2.6` (205 cặp: *Đức Phật nói:* 108, *Đức Thế Tôn nói:* 22), `2.5` (66 cặp). Bài này chọn *Đức Thế Tôn* xuyên suốt: bản đồng bài `sn12.60` ở cùng thị trấn Kammāsadhamma dùng *Đức Thế Tôn*, và nhóm `sn12` gần chia đôi ở `Bhagavā etadavoca:` (dạng *Đức Phật* 4 khoá, dạng *Thế Tôn* 3 khoá); lời bạch của tỳ-kheo và Ānanda cùng bài đều xưng *Thế Tôn*. Dùng lại nguyên văn ở `0.2` (18/18 cặp), `1.1` (225/432, dạng đa số), `1.4` (72/98), `14.7` (263/269). Trong chính bài có 21 cặp Pāli trùng nguyên văn (`1.6`/`2.6`, `3.2`/`3.5`, `3.4`/`4.3`, `3.8`/`4.6`, `4.1`/`5.1`, `8.3`–`8.5`/`9.14`–`9.16`, `9.1`–`9.4`, `9.6`, `9.7` với `13.1`–`13.4`, `13.6`, `13.7`, `10.2`–`10.5`/`13.14`–`13.17`, `12.2`–`12.4`/`14.3`–`14.5`) và cả 21 cặp bản Việt giống hệt nhau; hai cặp chỉ khác dấu câu ở Pāli (`9.5`/`13.5`, `9.8`/`13.8`) cũng cho cùng bản Việt.
  **Thuật ngữ chọn theo tiền lệ đếm được.** `upadhi` → *sanh y*: 73 khoá Pāli có `upadhi` trong tầng, 67 khoá viết *sanh y* (thêm 1 khoá viết hoa *Sanh y* ở `mn66:17.1`; còn lại là khoá không dùng `upadhi` làm thuật ngữ hoặc dịch bằng *chấp thủ*), không khoá nào viết *sinh y*; cũng là cách dịch của `mn105:29.9`. Bài này giữ chữ *sanh* trong riêng thuật ngữ này dù `jāti` viết *sinh*, vì *sinh y* sẽ không khớp với ai trong tầng. Bản Anh Sujato dịch `upadhi` là *attachment*, và Hòa thượng Thích Minh Châu viết *sanh y* ở chính bài này. `taṇhā` → *khát ái* (307 chỗ trong tầng, và theo `sn12.67`), `upādāna` không xuất hiện trong bài nên không có chỗ nào cần phân biệt với *sanh y*. `sammasati` → *dò xét* (xem bất định 1); `antaraṁ` → *bên trong*; `kiṁnidāno kiṁsamudayo kiṁjātiko kiṁpabhavo` → *lấy gì làm nhân, làm nguồn sinh, làm chỗ phát sinh và làm nguồn gốc* theo `sn12.11` và `mn38`; `kismiṁ sati … hoti` → *khi có cái gì thì … có* theo `sn12.49` (*khi có cái gì … có*); `sāruppagāminī paṭipadā` → *con đường thích hợp dẫn đến* theo `dn21:2.3` (2 khoá); `anudhammacārī` → *sống thuận theo pháp* theo `mn113`; `piyarūpaṁ sātarūpaṁ` → *đáng yêu, dễ chịu* (`dn22:19`; 27 khoá chứa cặp từ này; `sn35.244` viết *sắc thái đáng yêu, sắc thái khả lạc*); `niccato … ārogyato khemato` → *là thường còn, là lạc, là tự ngã, là không bệnh, là an ổn* (*là thường còn* 189, *là tự ngã* 135, *không bệnh* 93, *an ổn* 303); `aniccato … rogato bhayato` → *là vô thường, là khổ, là vô ngã, là bệnh tật, là hiểm họa* (*là vô thường* 445, *là vô ngã* 304; *bệnh tật* theo `sn22.122`, `sn22.123`; *hiểm họa* 4 chỗ — Sujato *dangerous*, Hòa thượng Thích Minh Châu *đáng sợ hãi*); `pajahati` → *từ bỏ*, `parimuccati` → *thoát khỏi* (`sn12.19:5.5`: *không thoát khỏi sinh, già, chết, sầu, bi, khổ, ưu, não* và *‘Không thoát khỏi khổ đau’, Ta nói vậy*); `samaṇā vā brāhmaṇā vā` → *sa-môn hay bà-la-môn* (172 chỗ trong sn/mn/dn/an so với *Sa-môn hay Bà-la-môn* 135 và *sa-môn hay Bà-la-môn* 83; `sn12`: 4 so với 10, chọn dạng chiếm đa số toàn tầng); `āpānīyakaṁso … visena saṁsaṭṭho` → *cốc đồ uống bằng đồng … trộn lẫn với chất độc* theo `mn46:19.1`–`19.2` (cùng Pāli; `mn105:29` viết *chén đồng đựng nước uống*); `chādessati vaṇṇenapi gandhenapi rasenapi` → *màu, mùi và vị đều hấp dẫn* theo `mn46:19.8`; `maraṇamattaṁ dukkhaṁ` → *khổ đau gần như chết* (`mn105:29.6` viết *khổ đau gần chết*, `mn46:19.8` viết *đau đớn gần chết*); `cittaṁ ārādhesi` → *làm tâm … hài lòng* (`mn51:5.11`, `mn94:5.8`, `mn79:7.2`); `etassa, bhagavā, kālo` → *đã đến lúc, bạch Thế Tôn* theo `mn152:3.3`; `ghammābhitatto ghammapareto kilanto tasito pipāsito` → *bị nắng nóng thiêu đốt và hành hạ, mệt mỏi, khát và khô cổ* theo `mn40:13.2`, `mn12:37.5` (phép chọn bản đủ nghĩa hơn bản `an5.162:4.3`).
  **Bất định đã ghi nhận, không che.** (1) `sammasati antaraṁ sammasaṁ` (`1.7`, `3.1`, `4.1`, `5.1`, …): `sammasati` có nghĩa chạm, nắm lấy, thẩm xét; `antaraṁ` là *bên trong*. Bản Anh Sujato dịch *probe within* (tiêu đề *Probing Within*); Hòa thượng Thích Minh Châu dịch *nắm giữ nội xúc*. Tầng không có tiền lệ cho động từ này: `an4.146` dịch `sammasanā` là *liễu tri*, `mil5.3.7` là *quán sát các hành*, `mil6.3.11` là *quét sạch*, mỗi nơi một cách. Bài này viết *dò xét … bên trong* (tầng có 12 chỗ dùng *dò xét* ở nghĩa khác, nên không có xung đột nghĩa) và giữ tên bài sát Pāli là *Kinh Dò Xét* thay vì thêm *Bên Trong* như Sujato. (2) `3.2`, `3.5` `… dukkhaṁ loke uppajjati jarāmaraṇaṁ`: `jarāmaraṇaṁ` đứng cuối câu như đồng vị với *dukkhaṁ*. Sujato dịch *starting with old age and death* (già chết là khởi đầu của nhiều loại khổ), Hòa thượng Thích Minh Châu dịch *với già chết*. Bài này viết *tức là già chết*, nghĩa đồng vị theo ngữ pháp, không thêm ý khác. (3) `13.10`: Pāli đã ghim đọc `na tvevāhaṁ taṁ piveyyaṁ, yaṁ mama assa dīgharattaṁ hitāya sukhāyā’ti`. Đọc theo chữ thì nghĩa là *ta không uống thứ vốn đem lại lợi ích và hạnh phúc lâu dài cho ta*, **trái hẳn văn cảnh**: thứ không nên uống là cốc độc, và ngay các câu `13.8`, `13.12` nói rõ uống thì chết hoặc khổ đau gần như chết. Bản Anh Sujato (*for it would be for my lasting harm and suffering*) và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (*nó khiến ta phải bất hạnh, đau khổ lâu dài*) đều hiểu là `ahitāya dukkhāya` (bất lợi và đau khổ), tức coi chữ ở đây là truyền bản có chỗ thiếu tiền tố phủ định. Bài này dịch theo nghĩa văn cảnh (*bất lợi và đau khổ cho ta lâu dài*); đây là một lựa chọn biên tập có căn cứ nhưng **không phải** nghĩa đen của chữ Pāli đã ghim, và người biên tập nên xác nhận khi có bản đối chiếu bản thảo khác. Không có chỗ nào khác trong bài phụ thuộc vào cách đọc này. (4) `13.10` `surāpipāsitā pānīyena vā vinetuṁ dadhimaṇḍakena vā …`: đọc theo chữ là *cơn khát rượu* (`surā` + `pipāsitā`) được làm dịu bằng bốn thứ: *nước uống* (`pānīya`), *nước sữa đông* (`dadhimaṇḍaka`), *muối rang* (`bhaṭṭhaloṇikā`), *cháo chua pha muối* (`loṇasovīraka`). Sujato dịch bốn thứ là *beer, buttermilk, salt lassi, salted infusion* và Hòa thượng Thích Minh Châu viết *uống rượu, sữa đông, ngậm muối, cháo chua*, tức cả hai coi `surā` hoặc `pānīya` là một trong các thức uống thay thế; Pāli đã ghim không cho phép chắc chắn cách tách này. Bài này giữ `surā` là *rượu* nằm trong *cơn khát*, mọi thức dùng làm dịu đều là thức uống không độc; nghĩa chính (có nhiều thức uống khác để dịu cơn khát mà không cần uống thứ độc) không đổi trong cả ba cách đọc. Tên bốn thứ đồ uống là món cụ thể, dịch sát nghĩa từng thành tố, không thêm giải thích. (5) `9.5`, `13.5` `ayaṁ te`: *dành cho anh* là cách phân giải của đại từ `te` (tặng cách), không thêm ý. (6) `1.12` `Yathā so bhikkhu byākāsi na so bhikkhu bhagavato cittaṁ ārādhesi`: Pāli không có từ *nhưng*; bài này dịch *Với cách vị tỳ-kheo ấy trả lời, vị ấy không làm tâm Đức Thế Tôn hài lòng* để giữ đúng cấu trúc, không thêm quan hệ đối lập. (7) `14.1`: Pāli lược ngay sau `anāgatamaddhānaṁ` mà chưa tới `samaṇā vā brāhmaṇā vā`, nên bản Việt viết *bất cứ ai trong tương lai cũng …* thay vì mở rộng thành *sa-môn hay bà-la-môn* (Sujato mở rộng chỗ này). (8) `paṭisaṅkhā` / `appaṭisaṅkhā` (*suy xét* / *không suy xét*) và `paṭinissajjeyya` (*từ chối*) theo `mn46:19.9`, `mn46:20.6`; *từ chối* là cách hiểu `paṭinissajjati` ở đây là buông không uống, Hòa thượng Thích Minh Châu viết *từ bỏ*. (9) Quy ước dấu lược `5.7`–`5.10`, `9.11`, `9.12`, `11.3`, `14.1`: `…pe…` → đúng một `…`; `5.8`–`5.10` là `…` trần ở Pāli (không có ngoặc), giữ `…`.
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 117/117, đúng thứ tự Pāli. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá, 117 khoá (mẫu số 117, 0 lệch). Dấu lược: 8 khoá Pāli có dấu lược (`5.7` và `9.11`, `9.12`, `11.3`, `14.1` là `…pe…`; `5.8`, `5.9`, `5.10` là `…` trần), cả 8 khoá Việt giữ đúng một `…`, không mở rộng. NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang bản Việt ngoài tên riêng *Kammāsadhamma*, *Ānanda*.
  Cổng kỹ thuật `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy, không chạy trong lát agent này; vì vậy `technical_integrity` đặt 9.6 chứ không 10.0.
