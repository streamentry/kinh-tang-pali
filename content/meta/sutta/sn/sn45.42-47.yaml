  - >-
    Lượt review đối kháng: (1) `1.1` Pāli mở ngoặc kép mà nháp không có — đã thêm. (2) `1.2` Pāli **không** có ngoặc kép (chỉ `‘…’ti`) mà nháp lại mở `“` — đã bỏ. (3) `1.3–1.8` nháp khép bằng `”` (harness chặn, vì Pāli chỉ có `‘…’ti`) — đã đổi sang `’`. (4) `1.2` nháp **bỏ mất** `kimatthiyaṁ` (vì lý do gì) — đây là chính từ hỏi của cả bài, đã bổ sung.
  - >-
    Bất định đã ghi: `vussatī` dịch *tuyên thuyết* (Sujato *proclaims*); cũng có thể là *phổ biến* — nghĩa *tuyên thuyết Phạm hạnh* hợp hơn vì bối cảnh là các du sĩ tán tỉnh.
