notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `2. Pāsādakampanavagga` → «2. Phẩm Vui Vẻ». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Sửa lan 2026-10-13: khoá 1.9 và 2.9 — `sappabhāsaṁ cittaṁ bhāveti`: «tâm tràn đầy quang minh rực rỡ» → «tâm tràn đầy quang minh». `sappabhāsa` chỉ có một từ «ánh sáng/quang minh», chữ «rực rỡ» là thêm ngoài Pāli. Căn cứ: Pāli root; cùng câu ở `sn51.11`, `sn51.20` dùng «quang minh».
  Khoá 3.1 (ngoài mô tả, phát hiện khi tự kiểm): Pāli kết `…pe….` (hai dấu lược) nhưng bản Việt chỉ có một `…` — thêm ` …` trước dấu chấm cuối theo quy ước dấu lược của tầng.
