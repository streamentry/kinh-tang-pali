notes: |-
  Dịch từ Pāli root, đối chiếu tầng Anh Sujato đã ghim ở mức từng segment; bản Việt hiện hành nguyên bài của Hòa thượng Thích Minh Châu (không phân đoạn) và các bản song song cùng tầng (sn35.74, sn35.75, sn35.87, sn46.15, sn12.68, sn22.88, sn22.90, sn22.102) chỉ dùng để tra thuật ngữ và cách hiểu.

  **Coverage English — đo thật, mẫu số khác 0.** Công thức `source/layers.yaml` (Pāli có nội dung ≥ 40 ký tự sau khi gộp khoảng trắng, loại khối tham chiếu `:0`): mẫu số **91** segment. Bản Sujato đã ghim phủ **73/91 = 0,8022**, trên ngưỡng 0,80 **chỉ bằng đúng 0,0022** — thiếu một khoá nữa là rơi xuống dưới ngưỡng, nên đây là con số mỏng, không phải dư dả. Bài này không có lớp `english-project` (không có tệp trong `content/translation/en/project/`), nên **không có khoá nào được tính nhờ bản lấp của dự án**: 73/91 hoàn toàn là English độc lập đã xuất bản. 18 khoá Sujato để trống dù Pāli có nội dung: 2.3, 3.3, 3.4, 3.5, 4.3, 4.4, 4.5, 5.3, 5.4, 5.5, 6.4, 6.5, 6.6, 6.7, 8.3, 8.4, 8.8, 8.9 (các khoá ngắn 2.2, 3.2, 4.2, 5.2, 6.2, 6.3, 8.2, 8.5–8.7, 14.4 nằm ngoài mẫu số). Tầng `vietnamese-current` ở bilara đã ghim chỉ có Pháp Cú nên bài này không có tầng Việt theo segment — giới hạn của ảnh chụp upstream, không phải thiếu sót của kho. Không cần entry trong `content/meta/reference-gaps.yaml` vì coverage ≥ 0,80.

  **`triangulation` đặt 8,7 và vì sao.** 73/91 khoá có nội dung được đối chiếu với bản Anh đã xuất bản. 18 khoá còn lại (phần lớn là các đoạn lặp nguyên văn của một công thức đã có ở khoá trước) chỉ có bản Việt hiện hành nguyên bài và các bài song song làm chứng cứ phụ, nên không tuyên bố đã đối chiếu English cho toàn bài. Ở ngay những khoá được đối chiếu, tầng Anh cũng có chỗ lệch Pāli: Sujato **mở rộng** dấu lược `…pe…` ở 1.9 và 1.10 (viết hẳn `hope you’re keeping well…` và `My pain is terrible and growing…`), dịch `kira` ở 4.10 thành `as it seems`, dịch `vaṇṇa` ở 10.2 theo hướng *stalk* trong khi `vaṇṇa` là *màu*, và dịch `adhigataṁ` ở 5.9/9.15/10.11 thành *not rid of the conceit* — một lời diễn giải, không phải nghĩa đen. Pāli là authority nên bản Việt không theo bốn chỗ này.

  **Pāli trùng nguyên văn ở nơi khác trong tầng: 35 khoá, 626 cặp; dùng lại y nguyên văn 28 khoá (457 cặp), 7 khoá dịch khác có lý do.** Chọn theo đa số từng khoá:
    - `0.2` *9. Phẩm Các Vị Trưởng Lão* **24** so với *Phẩm Trưởng Lão* 2 (26 cặp); `0.1`, `0.3` theo mẫu `Saṁyutta Nikāya <số>` và `Kinh <Tên>` của sn22.88 và sn22.90.
    - `2.7` *sắc thủ uẩn, thọ thủ uẩn, tưởng thủ uẩn, hành thủ uẩn, thức thủ uẩn.* 2/2 (sn38.15, mn149); `3.4`/`3.7`/`4.4`/`4.9`/`5.7`/`6.5` *sắc thủ uẩn … thức thủ uẩn.* 1/1 (sn56.13:2.3); `5.4` kết bằng `;` ở Pāli nên giữ `;` và không dùng lại.
    - `7.6`/`7.7`/`8.6`/`8.7`/`9.6`/`9.7` *tưởng …* **14** so với *Tưởng …* 8 và *các hành …* **15** so với *Các hành …* 8; `8.5`/`9.5` *Cảm thọ …* **13/15**.
    - `11.3`–`11.7` và `12.9`–`12.12`: *như vậy là sắc, như vậy là sự sanh khởi của sắc, như vậy là sự diệt mất của sắc;* (an8.2:16.2), *như vậy là cảm thọ …* 2, *như vậy là tưởng …* 4, *như vậy là các hành …* 5, *như vậy là thức … sự diệt mất của thức.’* **3** (sn22.78, an8.2). `12.8` (3 cặp, 3 dạng khác nhau): chọn dạng của sn22.102:12.2 vì cùng chương, cùng công thức.
    - `10.3` *“Thưa không, này hiền giả”.* **5** so với 1; `14.4` *Thứ bảy.* **123/126** trong sn (272/277 toàn tầng).
    - 7 khoá dịch khác: `7.5`, `9.11`–`9.13`, `10.7`–`10.9`. Tiền lệ của `Vedanaṁ …`/`na saññaṁ …` là *Cảm thọ …* và *không xem/không quán tưởng …*, nhưng ở đó phần Pāli bị lược nối với `passati`/`samanupassati`; ở bài này phần bị lược là `‘asmī’ti vadāmi`, nên bản Việt viết *Không nói về cảm thọ …* và dùng *thấy* chỉ ở nơi Pāli có `samanupassati`. `7.5` viết thường *cảm thọ …* vì nó nối tiếp 7.4 kết bằng dấu phẩy.
    - Pāli trùng **trong chính bài này**: 23 nhóm, 62 cặp; 1 nhóm bản Việt khác nhau và chỉ khác chữ hoa đầu câu (`vedanaṁ …` ở 7.5 so với `Vedanaṁ …` ở 8.5, 9.5), theo đúng hoa/thường của Pāli.

  **Số Pāli.** `pañca` 5 → *năm* (năm thủ uẩn, năm hạ phần kiết sử); `saṭṭhimattānaṁ` = `saṭṭhi` 60 + `-matta` → *khoảng sáu mươi* (mn148:41.10 *khoảng sáu mươi*; mn109 và snp3.12 bỏ *khoảng* ⇒ 1 so với 2, chọn bám Pāli, ghi lại ở đây); `Sattamaṁ` 7 → *Thứ bảy* (123/126 trong sn). Phép đo máy số Pāli của tầng không có từ khoá số ghép nào trong bài này nên **không đo được gì cho sn22.89**, mọi số ở đây tự tính.

  **Thuật ngữ — đếm trước khi chốt.**
    - `āvuso` → *hiền giả*; khi người nói là Tôn giả Dāsaka hoặc Khemaka quay sang nhiều vị trưởng lão thì viết *các hiền giả* (Pāli giữ số ít `āvuso`); `āyasmā` → *Tôn giả*; `therā bhikkhū` → *các vị trưởng lão tỳ-kheo* (sn22.90:1.1, sn41.1–4, sn56.30); `ghositārāme` → *tu viện Ghosita* **23/33** khoá chứa `ghositārām-`.
    - `Tena kho pana samayena` → *Lúc bấy giờ*: **79** so với *Bấy giờ* 57 trong sn (230 so với 170 toàn tầng). `ābādhiko dukkhito bāḷhagilāno` → *bị bệnh, khổ đau, bệnh nặng* (sn46.14, sn46.15, sn52.10).
    - `paṭisallānā vuṭṭhitā` → *từ chỗ độc cư đứng dậy* (sn52.4, sn47.26); `sammodi`/`sammodanīyaṁ kathaṁ sāraṇīyaṁ vītisāretvā` → *chào hỏi* / *trao đổi những lời chào đón và thăm hỏi thân thiện* (sn35.127:1.3, sn21.3:1.5); `daṇḍamolubbha` → *chống gậy* (an6.16:8.4, **15** khoá trong tầng chứa *chống gậy*).
    - `khamanīyaṁ`/`yāpanīyaṁ`/`paṭikkamosānaṁ`/`abhikkamosānaṁ` → *dễ chịu* / *đủ sức* / *thuyên giảm* / *gia tăng*, cùng công thức sn35.74, sn35.87, sn46.15 (đếm 59 khoá chứa `khamanīyaṁ`).
    - `samanupassati` → *thấy*: **247** so với *quán* 82 và *xem* 73 trên 401 cặp có chữ này; `attā`/`attaniya` → *tự ngã* / *thuộc về tự ngã* (sn22.33, sn35.101, mn22).
    - `pañcorambhāgiyāni saṁyojanāni` → *năm hạ phần kiết sử*: **64** so với *năm kết trói buộc hạ giới* 16; `ariyasāvaka` → *thánh đệ tử* (sn12.42, an9.28).
    - `māna` → *mạn*: **28** so với *ngã mạn* 16 trong sn; `anusaya` → *tùy miên*: **14** so với *thiên hướng* 12 trong sn (cân bằng, chọn *tùy miên* theo bản Thích Minh Châu và sn51.77); `chanda` → *dục* (108/245 trong sn).
    - `udayabbayānupassī` → *sống quán sát sự sinh diệt* (dn33, dn34, an8.2). `samugghātaṁ gacchati` → *được trừ khử tận gốc*, theo đúng sn35.59:1.2 (`anusayā samugghātaṁ gacchantī` → *các thiên hướng ấy được trừ khử tận gốc*); đo tầng: *nhổ tận gốc* 53 so với *trừ khử tận gốc* 12 và *trừ khử* 52 — hai nhóm cùng lớn, chọn dạng có tiền lệ cùng cấu trúc câu và áp dụng được cho cả mùi lẫn mạn.
    - `uppala`/`paduma`/`puṇḍarīka` → *sen xanh* / *sen hồng* / *sen trắng* (sn22.94:8.1, sn6.1:9.3). `badarikārāme` → *tu viện Badarikā* (không có tiền lệ trong tầng, đếm = 0; `badarikā` là cây táo ta, Sujato dịch *Jujube Tree Monastery*, bản Thích Minh Châu *vườn Badarica*).

  **Chỗ dịch mới không có tiền lệ trùng nguyên văn, và các bất định đã ghi (không thêm vào thân kinh).**
    - `adhigataṁ` ở 5.9, 6.7, 9.15, 10.11 (`‘asmī’ti adhigataṁ`): nghĩa đen là *đã đạt được, đã có được*. Câu này dễ đọc như một sự đắc chứng, trong khi văn cảnh (Khemaka nói rõ mình chưa phải bậc A-la-hán, rồi 11.1–12.13 nói đến mạn, dục, tùy miên *còn dư tàn*) cho thấy đây là *ý ‘tôi là’ vẫn có mặt*. Bản Việt viết *tôi có được ý ‘tôi là’*, bám nghĩa đen và không đẩy sang *chưa đoạn trừ* như Sujato. Bản Thích Minh Châu nguyên bài viết *dầu cho tôi có chứng được: “Tôi là”*. Đây là bất định có thật, không phải lỗi dịch; không thêm vào thân kinh.
    - `anusahagato` (11.1, 11.8, 12.3, 12.5, 12.6, 12.13) → *dư tàn*: bản Thích Minh Châu viết *dư tàn*, Sujato *lingering residue*, tầng chỉ có một tiền lệ không cùng ngữ cảnh (ps1.9:7.2 *vi tế*). Ở 11.8/12.6/12.13 Pāli đặt dấu phẩy sau `‘asmī’ti` đầu tiên (`anusahagato ‘asmī’ti, māno ‘asmī’ti, chando ‘asmī’ti anusayo`); bản Việt đọc thành **ba** mục (mạn, dục, tùy miên) như ở 11.1 không có dấu phẩy ấy, theo cả bản Thích Minh Châu lẫn Sujato. Cách đọc bốn mục (thêm `anusahagato ‘asmī’ti` riêng) có thể bảo vệ về dấu câu nhưng không có chứng cứ về nghĩa.
    - `kiñjakkha` (10.2) → *nhị hoa*: bản Thích Minh Châu viết *nhụy*, Sujato *pistil*; `kiñjakkha` là sợi nhị/phấn, nên chọn *nhị hoa*. `vaṇṇa` → *màu sắc*. Cả hai không có tiền lệ khớp trong tầng (đếm = 0).
    - `ūsa`/`khāra` (12.2, 12.3, 12.5) → *đất mặn* / *tro kiềm*: bản Thích Minh Châu viết *nước muối* / *tô đá*, Sujato *salt* / *lye*; không có tiền lệ trong tầng (đếm = 0).
    - 7.3–7.9: Pāli ở bảy khoá này **không có** dấu nháy quanh `asmīti`, trong khi 8.3 trở đi có `‘asmī’ti`. Để khớp nháy Pāli từng khoá, bản Việt viết *nói rằng tôi là* ở 7.x và *nói ‘tôi là’* ở 8.x–10.x; hơi nặng nên `vietnamese_clarity` ở 9,0.
    - 4.10 Pāli kết bằng dấu chấm nhưng nối thẳng sang 4.11 (`tenahāyasmā`); bản Việt đổi dấu chấm thành dấu phẩy để câu điều kiện đọc liền (`No ce kira …, tenahā…` → *Nếu quả thật …, thì …*), như 5.5 đã nối bằng dấu phẩy ở chính Pāli. `kira` dịch *quả thật*, Sujato *as it seems*.
    - 11.1 Pāli mở nháy đơn ở `‘yo ca` và chỉ đóng ở 11.7 (`atthaṅgamo’ti`), vắng nháy đóng ở khoá 11.1; bản Việt giữ nguyên cấu trúc đó.
    - `2.7` dùng *thọ thủ uẩn* (tiền lệ 2/2) trong khi các danh sách rút gọn viết *cảm thọ …* (đa số trong tầng); hai dạng cùng tồn tại trong tầng và đều có tiền lệ.

  **Dấu lược và nháy.** 13 khoá có `…pe…` (13/13 giữ **đúng một** `…`), 21 khoá có `…` trần (21/21 khớp), không khoá nào có `(…)` ở Pāli nên không có ở bản Việt. Nháy đơn `‘’` và ngoặc kép `“”` khớp Pāli **từng khoá**: 0/131 lệch (mẫu số 131).

  **Phép kiểm đã chạy, có mẫu số.** Tập khoá Việt = tập khoá Pāli: 131/131, thứ tự khoá trùng thứ tự Pāli. Nháy theo khoá: 0/131 lệch. `…pe…`/`…`: 0/131 lệch. NFC, khoảng trắng thừa, khoá rỗng, Pāli lọt sang bản Việt (chỉ có `Saṁyutta Nikāya` ở `0.1` theo mẫu tầng): 0 lỗi. Đã in cặp Pāli↔Việt cả 131 khoá để đọc đối kháng.

