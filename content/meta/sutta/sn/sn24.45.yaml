notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato cộng bản lấp English của dự án. Coverage English = 17/17 khoá Pāli có nội dung = 100%.
  TRIANGULATION KHÔNG ĐỘC LẬP: 2 trong 17 khoá Pāli có nội dung (3.15, 3.16) chỉ có tiếng Anh từ bản lấp `content/translation/en/project`, cùng tác giả với bản Việt này. Tiêu chí 6 đặt 8.0 và bài này không tuyên bố đã đối chiếu English. Tầng Việt hiện hành vắng ở commit đã ghim (chỉ có Pháp Cú).
  0.1 giữ `Saṁyutta Nikāya 24.45`; 0.2 theo tiền lệ `sn24.46-69` (3. Phẩm Tái Sinh Thứ Ba) và theo cả dãi Tái Sinh Thứ Hai / Thứ Tư đã có; 0.3 theo tiền lệ `sn24.19:0.3` cho tên `Vātasutta` → Kinh Gió, và Sujato dịch `Navātasutta` là Winds.
  24 khoá có PĀLI TRÙNG NGUYÊN VĂN với tệp đã có trong HEAD, dùng lại nguyên văn: 0.2 (`sn24.46-69`) · 1.1 (433 khoá) · 1.2 (`sn24.11`/`sn24.12`) · 1.4 (`sn35.105:2.1`) · 2.4 (`sn22.150:1.6`) · 2.5 (`sn22.150:1.7`) · 2.6 (`sn24.19:2.6`) · 2.7 (`sn24.19:2.7`) · 3.1 (`sn13.2`/`sn13.10`/`sn13.11`) · 3.2 (`sn22.150:1.10`) · 3.3 (`sn22.151:1.10`) · 3.4 (`sn24.37:3.3`) · 3.5 (`sn24.19:3.15`) · 3.6 (`sn18.11`) · 3.10 (`sn22.151:1.13`) · 3.11 (`sn22.106`) · 3.12 (`sn22.106`) · 3.13 (`sn22.150:1.19`) · 3.14 (`sn24.19:3.13`) · 3.15 (`sn24.10:2.4`) · 3.16 (`sn24.19:3.15`) · 3.17 (`sn18.11`) · 3.20 (`sn24.19:3.8`) · 3.21. Tổng lát c32: 143 cặp.
  Công thức gió ở 1.3 và 3.9 dùng nguyên văn `sn24.19:1.3`/`3.18` (Gió không thổi, sông không chảy, người có thai không sinh đẻ, mặt trăng mặt trời không mọc lên cũng không lặn xuống, đứng vững như cọc gỗ), chỉ bỏ dấu phẩy mà `sn24.19` có trước `esikaṭṭhāyiṭṭhitā` vì Pāli bài này không có.
  Bài song song `sn24.19` (Vātasutta, Tái Sinh Thứ Hai) có cùng khung nhưng Pāli khác ở chỗ 3.7–3.9: bài kia là `dukkhe sati, dukkhaṁ upādāya, dukkhaṁ abhinivissa`, bài này là `yadaniccaṁ taṁ dukkhaṁ. Tasmiṁ sati, tadupādāya`. Vì vậy 3.7–3.9 dịch khác hẳn (cái gì vô thường thì cái ấy là khổ; khi cái ấy có, chấp thủ vào cái ấy) chứ không dùng lại khung của bài kia.
  SỬA NGOẶC KÉP CÓ CHỦ ĐÍCH: Pāli bài này lệch ngoặc ở chính nó (chạy `“`-`”` trên toàn bộ Pāli cho −1: 3.16 và 3.20 khép một ngoặc không mở). Bản Việt bám đúng ý Pāli nhưng phải cân, nên 3.5 bỏ dấu khép thừa (chỉ còn nháy cong đơn) và 3.14 giữ một `“` mở cho tới 3.16. Đây là lý do duy nhất 3.5 và 3.16 cùng Pāli mà khác nhau một dấu nháy.
  Pāli trùng nguyên văn giữa hai bài của lát: `api nu taṁ anupādāya evaṁ diṭṭhi uppajjeyya:` ở 3.15 và `sn24.2:2.9` — dùng chung MỘT cách dịch.
  Mười bốn dấu lược giữ đúng MỘT `…` mỗi khoá; 3.14 có `…pe…` của Pāli nên giữ một `…`, không mở rộng.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy; technical_integrity 9.6 vì lát này không tự chạy bốn lệnh đó. Đã tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, và mô phỏng đúng `validateSegmentMap` của `scripts/validate.ts` (tiền tố khoá, orphan, requireComplete, non-Latin) — 316/316 khoá sạch.
