notes: |-
  Bài GỘP (tệp chung `sn18.12-20` = 9 bài Rāhula, Phẩm Thứ Hai; 63 khoá, khoá mang tiền tố `sn18.12-20:`), toàn văn peyyāla: chín dãy sáu mục (hai dãy cuối ngắn hơn) rút gọn bằng `…pe…` và `…`. Soạn từ Pāli root, đối chiếu Anh Sujato ở tệp gộp `sn18.12-20`. Không có bản Việt Thích Minh Châu trong tầng đã ghim (ngoài Pháp Cú); không dùng lớp `english-project` (không có tệp cho bài này).
  Coverage English: mẫu số của cổng = 0 — không khoá Pāli nào của bài có ≥ 40 ký tự (tất cả đều là nhãn/dãy rút gọn), nên cổng không đo được gì và `reference:gaps` không có gì để ghi nhận cho bài này. Đo thô trên toàn bộ khoá: Sujato có chữ ở 62/63 khoá (98,4%); khoá duy nhất để trống là 9.9 `Dasamaṁ`, bản Anh bỏ dòng số thứ tự. Tầng Anh vì vậy độc lập thật sự, nhưng phần lớn là dãy rút gọn nên mức triangulation không cao hơn 9,0.
  Dấu lược: mỗi `…pe…` thành đúng một `…`; khoá Pāli kết `….` thì Việt kết ` ….` (1.9, 2.6, 3.6, 4.6, 5.6, 6.6, 7.6, 8.6). Nháy kép/đơn khớp Pāli từng khoá: 1.2 mở `“`, 1.3 đóng `”`, 1.4 `“…”`, 2.1 mở `“` mà không đóng cho tới 9.5 `”`, 9.7 mở `“`, 9.8 có `’` và `”` mà không có `‘` (nháy mở nằm trong đoạn Pāli đã lược ở 9.7). 9.6 Pāli không có nháy nên Việt cũng không.
  Thuật ngữ, đo trên tầng: `phoṭṭhabba` → xúc chạm (134 khoá/68 bài; `những thứ đi chạm được` 32/27; `sắp xúc` là lỗi gõ ở sn18.2/6/7/8) và `samphassa` → xúc, để hai từ không trùng nhau (cặp có sẵn ở sn25.2 và dn22:20); `saddā` → tiếng (sn35.216-218, 35.145, 35.144, mn146; `âm thanh` ít hơn); `gandhā` → mùi; `manoviññāṇa` → thức ý, `mano-` → ý như sn18.11:1.16 (sibling sn18.3-8 viết `của tâm`); viññāṇa → `thức mắt…` (dn22, mn146) trong khi sn18.3/sn25.3 viết `thức của mắt`; `vedanā` → cảm thọ (17 so với 14 `thọ`); `taṇhā` → khát ái về… (sn18.8, sn25.8); `dhātu` → giới tánh (25 khoá/14 bài; `giới` 31/10 chủ yếu ở mn; `bảo chất` chỉ ở sn18.9) theo cách các tương ưng sn14, sn25, sn26, sn27 và uddāna sn18.22; `Dutiyavagga` → 2. Phẩm Thứ Hai (như sn18.11, sn18.21, sn18.22); `Sāvatthiyaṁ viharati` → Trú ở Sāvatthī (97 so với 52 `Đang sống tại`); `Taṁ kiṁ maññasi, rāhula` → Bạch Rāhula, ngươi nghĩ thế nào (cùng sn18.11, sn18.2); `thường còn hay vô thường` (25 khoá) cho `niccaṁ vā aniccaṁ vā`; `Dasamaṁ.` → Thứ mười (268 khoá; ở đây khớp đúng cách đếm của Phẩm Thứ Hai: sn18.11 là Thứ nhất, bài gộp này kết ở Thứ mười). Tên 0.3 `Rūpādisuttanavaka` → Chín Bài Kinh Sắc Và Các Bài Sau, theo mẫu `…ādisutta` → `Kinh … Và Các Bài Sau` (sn17.13-20, sn46.77-88) và Sujato *The Nine Discourses on Sights, Etc.*; 12–20 đúng là chín bài.
  Số: không có số lượng nào trong thân kinh; `Thứ mười` là số thứ tự khớp `Dasamaṁ`, `Chín` ở tên bài khớp 20 − 12 + 1 = 9.
  Pāli trùng nguyên văn trong chính bài: 0 cặp. Pāli trùng nguyên văn ở bài khác đã dò: 43 khoá có song sinh (kể cả khoá đã có từ sn18.2-10, sn25.2-9, sn35.x); ở 29 khoá bản Việt khác — chủ yếu vì cùng danh sách đã bị đặt các thuật ngữ không nhất quán ở các bài lân cận (`âm thanh`/`tiếng`, `thức của mắt`/`thức mắt`, `sắp xúc`/`xúc chạm`); chọn theo đa số và theo nghĩa Pāli, không sửa các bài khác.
  Ghi nhận bất định và lệch tầng (không sửa, thuộc người biên tập): (1) `sañcetanā` — dịch `tư` (volition, Sujato *intention*; dn22:20.42, sn22.57:11.4), khác `tập hợp` ở sn18.7, sn25.7, sn26.7, sn27.7, an11.310-357 (6 bài); Pāli `sañ-cetanā` không có nghĩa tập hợp nên không theo đa số 6/9, nhưng sibling nên được rà để thống nhất. (2) `rūpā` ở 1.3 dịch `các sắc` (tiếng sắc, đối tượng của mắt) theo số nhiều Pāli và mn147:3.2; sn18.2 viết `Sắc`. (3) Khoá 9.8 là nửa sau câu kết peyyāla: `nāparaṁ itthattāyā’ti pajānātī”ti` giữ nguyên ’ và ” của Pāli, dịch `không còn gì là tự thân nữa’, vị ấy biết rõ.”` — tiền lệ sn22.15:1.17 bỏ nháy đơn, nhưng quy ước từng khoá yêu cầu khớp Pāli. (4) 9.7 giữ `Rāhula` vì Pāli có hô cách, dù cụm đã bị lược phía sau.
