  **HAI CỤM DANH HIỆU CỦA ĐỨC PHẬT — `:2.5` ĐẦY ĐỦ, `:3.2` LƯỢC.**
  `:2.5` liệt kê đủ tám danh hiệu nên tôi dùng nguyên văn `dn24:1.6.2` (bản duy nhất đã dịch
  đủ, không bị `…pe…` cắt): *bậc A-la-hán, Chánh Đẳng Giác, Minh Hạnh Túc, Thiện Thệ, Thế Gian
  Giải, Vô Thượng Sĩ, Điều Ngự Trượng Phu, Thầy của trời và người, Phật, Thế Tôn*.
  `:3.2` ở Pāli **đã có** `…pe…` nên tôi dùng nguyên văn `sn55.39:3.3`, kết bằng *… bậc Thầy của
  chư thiên và loài người, Phật, Thế Tôn.* — **không** mở rộng.

  **DẤU LƯỢC — 7 khoá, mỗi khoá đúng một `…`, KHÔNG mở rộng:** `:2.6` `:2.7` `:2.8` `:3.2`
  `:3.3` `:3.4` `:3.5`.

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `pitaraṁ` (`:1.3`) — **0 tiền lệ** cho từ này. PED `pitara` = *cha*; đây là dạng chữ
    thay thế của `pitā` mà lối viết Pāli ở commit đã ghim dùng. Tôi dịch *người cha*.
  · `Dīghāvu` — **0 tiền lệ trong toàn tầng**. `Dīghāvu` là tên riêng của người đàn ông mà Đức
    Phật nói là tương lai sẽ trở thành Đại Kassapa; giữ nguyên Pāli. Cùng bộ có `Soṇḍinnā`
    là tên khác, không liên quan. `Jotika` (`:1.3`, `:4.4`) cũng 0 tiền lệ — giữ Pāli.
  · `vijjābhāgiya` (`:3.6`, `:4.1`) — **0 tiền lệ**. `vijjā` = *tri kiến*, `bhāgiya` = *có
    phần/góp phần*; tôi dịch *sáu pháp đưa đến chỗ thắng tri* (bản Anh đã ghim cũng dịch
    *"six things that play a part in realization"*). Nếu coordinator chốt cách khác thì phải sửa
    cả hai khoá.
  · Cụm năm vế `anicce dukkhasaññī, dukkhe anattasaññī pahānasaññī virāgasaññī
    nirodhasaññī` (`:3.7`, `:4.2`) — **0 tiền lệ cho cả cụm**. `saññī` dùng ở đây theo nghĩa
    *"có tưởng / thấy biết"*; tôi dịch *thấy biết …* (`thấy biết` có 150 lần / 71 tệp) và bám
    theo tiền lệ của từng danh từ: `virāga` → *ly tham* (`sn12.15:3.7`), `nirodha` → *diệt tận*,
    `pahāna` → *buông bỏ* (`sn14.31:2.4`), `anatta` → *vô ngã* (372 lần / 108 tệp).
  · `tātā` (`:1.9`, `:4.5`, `:4.6`) — 0 tiền lệ cho dạng xưng hô này (`tāta` là tiếng gọi thân
    mật của người lớn với người nhỏ, và ở đây Jotika gọi Dīghāvu). Tôi dịch *thưa con* ở `:1.9`
    (Jotika đáp lời con) và *thân thương* ở `:4.5`–`:4.6`.
  · `tāvatā` / `nivesanaṁ` (`:1.8`, `:2.1`) → *tư gia* (tiền lệ `sn41.2:1.6` dùng *nơi ở của
    gia chủ*; `tư gia` có 2 lần). `sādhukaṁ manasi karohī` (`:4.6`) → *hãy chăm chú tâm vào*;
    0 tiền lệ cho `sādhuka`.

  **LỖI BẢN NHÁP ĐÃ BẮT VÀ SỬA TRONG REVIEW ĐỐI KHÁNG.** Năm khoá:
  (a) `:2.2`–`:2.3` bản nháp đầu dùng *lắng dần / tăng dần / nặng dần* — **"nặng dần"** dễ bị
      đọc thành *nặng* (khối lượng), mà `abhikkamanti` là *gia tăng* về cường độ; đã sửa theo đúng
      công thức đã có ở `sn46.14:2.1` (*thuyên giảm / gia tăng*).
  (b) `:5.6` bản nháp đầu dịch `paccapādi dhammassānudhammaṁ` thành *đã hành trì theo pháp, theo
      pháp mà thực hành* — lặp ý vô nghĩa; đã sửa thành *đã hành trì đúng theo chánh pháp*.
  (c) `:1.3` bản nháp đầu viết *bảo ông cha là ông chủ nhà Jotika* — cúm cụm; đã sửa thành *nói
      với người cha, ông chủ nhà Jotika*.
  (d) `:4.4` bản nháp đầu viết *không phải vì con qua đời mà đau khổ thêm* — phủ định bị lệch
      (Pāli là *"mong rằng… sẽ không khổ đau"*); đã sửa thành *sẽ không khổ đau khi con qua đời*.

  **NGOẶC KÉP — giữ y hệt Pāli từng khoá, tự đếm: cân.** `“`/`”` = **12/12**. Nháy cong:
  `‘` mở 5 lần (`:1.5`, `:1.8`, `:1.13`, `:2.5`, `:4.4`), `’` đóng **4** lần (`:1.6`, `:2.8`,
  `:3.2`, `:3.5`) — đây là **đặc thù của tầng Pāli ở commit đã ghim**: `:1.5` mở `‘` nhưng
  lời dạt tới `:1.6` đóng bằng `’` (đúng), còn `:2.5` mở `‘` thì đóng ở `:2.8` bằng `’` (đúng);
  `:4.4` mở `‘` nhưng khoá `:4.5` mở `“` **không** đóng lại — tức một cặp nháy cong của Pāli
  đi vào `:4.4` không được khép lại, vì Pāli không có dấu đóng cho nó. Tôi dịch đúng theo Pāli và
  **không** tự thêm dấu.

