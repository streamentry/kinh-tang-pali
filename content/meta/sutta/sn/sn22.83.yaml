notes: |-
  Dịch từ Pāli root, có đối chiếu tầng Anh đã ghim.

  **Coverage.** Đo theo đúng công thức `source/layers.yaml` (Pāli có nội dung ≥ 40 ký tự, loại block
  tham chiếu `:0`): 12 segment có nội dung, Sujato phủ đủ 12 ⇒ 12/12 = 1,0000. Không cần entry trong
  `content/meta/reference-gaps.yaml`, và lớp lấp `english-project` không có cho bài này nên coverage
  không dựa vào bản lấp của chính dự án — đây là lý do `triangulation` giữ được 9,4.

  **Pāli trùng nguyên văn: 17 khoá, 933 cặp; dùng lại y nguyên văn 16.** Một khoá lệch: `1.4`
  `‘Āvuso”ti kho …` có hai bản đã dịch, mỗi bài 1 lần — an4.170:1.5 dịch *Kính bạch Tôn giả*,
  an9.37:1.4 dịch *Hiền giả*. Đã chọn *Hiền giả* vì `1.3` của chính bài này dùng lại y nguyên văn
  *Này các vị tỳ-kheo!* (3 bài), nên *Kính bạch Tôn giả* sẽ lệch ngay dòng sau.

  **Ba chỗ dịch mới, không có tiền lệ trùng nguyên văn — đã đo là 0:**
    - `navakānaṁ` (2.1, 4.12) dịch **mới xuất gia** (23 lần trong tầng Việt). Bản nháp đầu viết *mới
      mới xuất gia*, đã bỏ một chữ *mới* sau khi đếm tiền lệ.
    - `asmīti` (2.3, 2.5, 2.9, 3.2, 3.6) dịch **ý “Tôi là”**. Chuỗi `asmīti` không có bản dịch nào
      trong tầng Việt (đếm = 0); tiền lệ gần nhất là `sohamasmīti` → *ý nghĩ ‘Ta tốt hơn’* (sn35.108).
    - Ví dụ tấm gương và bát nước (3.1) dịch mới; `daharo yuvā maṇḍanakajātiko` → *trai trẻ, ham
      trang sức*, `ādāse vā parisuddhe pariyodāte acche vā udakapatte` giữ cả hai vật (*tấm gương
      trong sạch bóng loáng* và *bát nước trong suốt*) vì Pāli liệt kê cả hai.

  **Dấu lược và nháy kép.** `…pe…` của Pāli ở `4.8`, `4.9`, `4.10` và các dấu lược rời ở `2.6`–`2.8`,
  `3.3`–`3.5`, `4.4`–`4.6` đều giữ **đúng số lượng** Pāli (mỗi khoá một `…`), không mở rộng. Nháy kép
  đặt đúng như Pāli (mở/đóng ở 1.3, 1.4, mở ở 2.1, đóng ở 4.14 — tổng 3/3); `ngoặc()` báo cân.

  **Bất định đã ghi, không giấu.**
    - `4.2` và `4.7` kết bằng `vā’ti` — đây là cách Pāli nén `vā aniccaṁ vā`, nên bản Việt giữ nguyên
      dạng nén: *sắc là thường còn hay vô thường hay vô thường’ti?*. Sujato mở rộng thành *or
      impermanent?*, và kho đã có 13 bài dịch mở rộng (`sn24.3:3.2`). Đã chọn giữ dạng Pāli vì mở
      rộng ở đây sẽ lệch với các bài giữ, còn đọc vướng thì người biết Pāli vẫn hiểu. Đây là lý do
      `vietnamese_clarity` ở 9,2.
    - `4.11` `nāparaṁ itthattāyāti pajānātīti` dịch **không còn gì để nữa ở nơi này**. Cùng ý này ở
      `sn22.152:2.20` được dịch *không còn gì là tự thân nữa*, nhưng Pāli hai khoá **không trùng
      nguyên văn** (sn22.152 có thêm `”` trước `ti`), nên không bắt buộc dùng lại.
    - `upādāya` / `anupādāya` dịch **chấp thủ / không chấp thủ**, theo khuôn đã dùng ở sn22 và sn24
      (đếm 3, 7 và 2 khoá cho `api nu taṁ anupādāya evaṁ diṭṭhi uppajjeyya`).

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`, và `npm run build` vì bài sẽ `published`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
