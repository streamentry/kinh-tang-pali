notes: |-
  Dịch từ Pāli root; đối chiếu Sujato đã ghim (coverage 20/20 = 100%). Tầng `vietnamese-current` không có cho bài này.
  **Bản song parallel trùng Pāli: 15 khoá, dùng lại y nguyên văn cả 15.** Bài ngay trước cùng phẩm `sn22.53` (`Upayasutta`, đã `published`) cho `2.4`, `3.1`, `3.2`, `4.1`, `4.2`, `4.6`, `4.7`, `4.8` — **cùng Pāli, dùng lại nguyên văn**. `sn45.150:0.3` + `an10.104:0.3` cho tiêu đề `Bījasutta` → *Kinh Hạt Giống*. `sn22.21:2.1` cho `Aniccaṁ dukkhaṁ anattā`. Tiêu đề phẩm `Upayavagga` → *6. Phẩm Dính Mắc* (3 bài). `Dutiyaṁ.` → *Thứ hai.*
  **Cố ý bám `sn22.53` ở hai chỗ dù kho đang có hai cách khác.** (1) `Vimuttattā ṭhitaṁ. Ṭhitattā santusitaṁ …` — cùng Pāli với `sn22.53:3.9`, `sn22.45:1.19`, `sn22.46:2.9`; nhóm `sn22.45/46` dùng *Do giải thoát nên vững trú … tự mình nhập Niết-bàn*, `sn22.53` dùng *Do giải thoát nên kiên cố … tự mình chứng đắc tịch tịnh Niết-bàn*. Chọn theo `sn22.53` vì **ngay bài trước, cùng phẩm, cùng ẩn dụ**, để người đọc lật hai bài không thấy tự mâu thuẫn. (2) `Sāvatthinidānaṁ.` — kho đang có *Tại Sāvatthī.* (429) và *Duyên khởi ở Sāvatthī* (4, `sn22.53`); chọn đa số. Người biên tập nên thống nhất `sn22.53:1.1`.
  **0 tiền lệ, đặt mới, ghi kèm lý do.** `Mūlabījaṁ, khandhabījaṁ, aggabījaṁ, phalubījaṁ, bījabījaṁ` → *cây mọc từ rễ, từ thân, từ cành, từ đọt, và cây mọc từ hạt*; Sujato dịch *roots, trunks, cuttings, or joints*, và `agga` (ngọn/cành con) + `phalu` (đọt/móc) đã tách thành *cành* và *đọt*. **Đây là chỗ bất định:** `phalu` còn có thể là *cọc/chồi*; nếu người biên tập chọn cách khác thì phải sửa cả `1.4` cho khớp. `viññāṇaṭṭhiti` → *sở nương tựa của thức* (đọc theo `patiṭṭhā`/`arammaṇa` ở `4.2` mà `sn22.53` dịch *chỗ nương tựa*). `nandirāgo` → *sở thích và tham ái* (kho có *hỷ và tham* ở `sn22.103:2.2`). `viññāṇaṁ sāhāraṁ` → *thức cùng chất nuôi của nó*.
  **Sửa trong lượt review đối kháng:** `1.5` `avātātapahatāni` bản nháp đầu ghi *gió bão nắng mưa* — thêm *mưa* không có trong Pāli (`avāta` = gió, `ātap` = nắng/nóng), đã sửa thành *không hư hỏng vì gió và nắng*. `4.3` `Vedanādhātuyā ce …` dịch *cảm thọ giới* còn `sn22.53:3.3` dịch *thọ giới* cho đúng Pāli; chỗ khác trong bài này vẫn theo *cảm thọ* (xem `2.2`), chấp nhận sự khác nhau có chủ ý vì hai ngữ cảnh khác nhau.
  Dấu lược: `1.8` và `4.10` có `…pe…` → giữ **một** `…`; không nén thêm bằng `…`. `notes` dùng khối literal `|-` thụt 2, đã đọc mẫu đích trước khi ghi. Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` (và `npm run build` vì có bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9.6 chứ không 10.0.
