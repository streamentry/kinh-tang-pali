notes: |-
  **57 khoá** (0.1–0.3, 1.1–1.18, 2.1–2.14, 3.1–3.4, 4.1–4.11, 5.0–5.6), viết đủ cả 57, khớp 100% khoá Pāli root đã ghim; dump f202 == root JSON: 0 lệch.
  **Trùng nguyên văn (chỉ mục toàn kho 68.499 chuỗi Pāli): 13/57 khoá khớp tuyệt đối, đều dùng lại cách dịch đã có.** Sāvatthiyaṁ viharati → *Trú ở Sāvatthī.* (87 nơi) · vedanā … → *thọ …* (3 nơi) · Katamañca…dhātunānattaṁ → *Thế nào là sai biệt của giới tánh…* (6 nơi) · Rūpadhātu …pe… dhammadhātu— → *Giới tánh sắc … giới tánh pháp—* (3 nơi) · idaṁ vuccati → *cái này được gọi là…* (6 nơi) · Dasamaṁ → *Thứ mười.* (228 nơi) · Tassuddānaṁ → *Tóm lược:* (277 nơi) · 0.2 → *1. Phẩm Sai Biệt* (9 nơi).
  **Tiền lệ thuật ngữ đã tra kèm đếm:** `dhātu` → *giới tánh*, `nānatta` → *sai biệt*, `saṅkappa` → *tư duy*, `phassa` → *xúc chạm*, `chanda` → *ham muốn*, `pariḷāha` → *nóng nảy*, `pariyesanā` → *tìm cầu*, `lābha` → *đắc lợi* — toàn bộ theo chuỗi đã `published` của `sn14.9`/`sn14.2`/`sn14.7`/`sn14.8` (cùng Phẩm Sai Biệt); `paṭicca uppajjati` → *do … mà sinh khởi*, phủ định `no X paṭicca` → *không phải do … mà sinh khởi* (theo `sn14.8:3.2`). Kết đoạn phẩm `Nānattavaggo paṭhamo.` → *Phẩm Sai Biệt, thứ nhất.* (khuôn `sn35.237:2.9` *Phẩm Biển, thứ ba.*). Tiêu đề theo Pāli `Dutiyabāhiraphassanānattasutta` + khuôn "(Một)/(Hai)" của `sn14.4`/`sn14.5` và `sn35.236`/`sn35.237` → *Kinh Sai Biệt Của Xúc Bên Ngoài (Hai)*; Sujato đặt theo điểm cuối (*No Diversity of Gains*) — không theo. `0.1` giữ Pāli "Saṁyutta Nikāya 14.10" theo quyết định coordinator (note `sn1.1`).
  **Trùng nhưng không theo, có lý do:** `sn14.10:3.1` khớp Pāli tuyệt đối với `sn14.8:3.1`, nhưng bản `sn14.8` đã BUNG `…pe…` thành cả chuỗi dài — vi phạm luật "không bao giờ bung `…pe…` thành văn"; giữ dấu lược "…" và ghi tại đây. Không sửa `sn14.8` (ngoài phạm vi lát). **Uddāna 5.1–5.6:** `no cetaṁ` là tên rút của hai bài "No-" (`sn14.3` Nophassanānatta, `sn14.8` Nopariyesanānānatta); dịch theo đúng tiêu đề đã publish: *bài Không Sai Biệt* (14.3) và *bài Không Tìm Cầu* (14.8); `…apare duve` → *hai bài nữa*; kết `bāhirapañcakanti.` (iti dính, không dấu quote) → bỏ "ti" (khuôn `an8.38:2.3`).
  **Coverage Anh: 17/17 segment ≥40 ký tự có English Sujato.** Không có tầng Việt hiện hành (bilara tại commit đã ghim chỉ có Pháp Cú) — đã ghi vào scorecard.
  **Lược: mỗi khoá đếm lược(vi) == lược(pāli)** với `…pe…` = một dấu; tổng 4 `…pe…` (1.10, 1.17, 3.1, 3.2, 4.1) → giữ nguyên một "…"; không có `(…)`; không có khoá nào bắt đầu bằng `…` trần.
  **Bất định đã phân xử và ghi lại:** (1) uddāna `no cetaṁ` — cách giải nghĩa trên là suy từ hai tiêu đề "No-" thật, người biên tập có thể muốn soát lại văn luật kệ. (2) `2.14`/`4.9` chuỗi ngược đếm đủ 8 mắt xích đúng thứ tự Pāli. Không blocker.
