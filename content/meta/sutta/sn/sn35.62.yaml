  khoá, `(Một)` **60**, `(Nhất)` **38**, `(Nhị)` **0**. Trong riêng `sn35` tôi đếm được
  `Một` **5** vs `Nhất` **3**, `Hai` **8** vs `Thứ Hai` **1`. Vậy quy ước đa số của kho là
  `(Một)/(Hai)`, và tôi theo đó; `sn35.61:0.3` mới là ngoại lệ. Với `sn35.75:0.3`
  (`Dutiyagilānasutta`) thì Pāli trùng `sn46.15:0.3`, vốn đã đặt *Kinh Người Bệnh (Hai)*
  ⇒ y hệt, không có phân kỳ.

