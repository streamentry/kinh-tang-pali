  `āsavena duve vuttā` (2) + `Anusayā apare dve` (2) + `pariññā dve` (2) +
  `pariyādinnaṁ` (1) = **10**, khớp. Cách văn phong bám `sn35.83:4.1`–`4.2` (đúng cùng
