  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá sn15.8:2.10 — «Khởi điểm đầu tiên không thể tìm thấy của các chúng sinh bị vô minh che đậy, bị ái kiết sử trói buộc, phải lưu chuyển luân hồi» → «Không thấy được khởi điểm của các chúng sinh bị vô minh che lấp, bị khát ái trói buộc, trôi lăn và luân chuyển» (công thức `pubbā koṭi na paññāyati…`: 10/15 khoá toàn tầng; bỏ «đầu tiên» thừa vì `pubbā koṭi` đã là khởi điểm).
  Quyết định hội đồng biên tập 2026-10-16: B20 — `sn15.8:1.4`, `sn15.8:1.5`, `sn15.8:1.7`, `sn15.8:2.5`, `sn15.8:2.7` (`kappa` đứng riêng «đại kiếp» → «kiếp»).
