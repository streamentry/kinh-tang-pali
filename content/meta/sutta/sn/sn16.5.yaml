  · 23 khoá còn lại khớp 0 = 0.

  Nháy kép: Pāli mở `“` ở `1.4`, `2.1`, `3.1`, `4.1`, `7.1` và đóng `”` ở `1.5`, `2.1`,
  `3.8`, `6.8`, `7.3` — cân **5 = 5**; khối nháy kép mở ở `4.1` kéo dài qua `5.x` tới `6.8`.
  `5.2` mở `‘` và `5.11` đóng `’` (Pāli dùng nháy đơn cho lời nghĩ trong lòng của Kassapa
  rồi trở lại lời nói). Bản Việt giữ **đúng** nháy kép ở `5.2` và nháy đơn ở `5.11`; đây là
  lỗi chốt đã bắt trong lượt hiệu chỉnh — bản nháp đầu đóng `”` ở `5.11` và thành **6** dấu
  `”`, rồi `ngoặc()` của `_hvi.py` báo *ngoặc kép không cân trên cả bài*. Đã sửa.

  BẤT ĐỊNH (không chặn):
  · `5.3` `Ye kira te ahesuṁ buddhānubuddhasāvakā` — `buddhānubuddhasāvakā` là **hapax** (quét
    toàn bộ Pāli root: chỉ ở khoá này). Nghĩa chắc chắn là *đệ tử được giác ngộ sau Đức
    Phật* (`anubuddha` = đã giác ngộ theo/từ Phật), cấu tạo `buddha + anubuddha + sāvaka`.
    Tôi dịch *các đệ tử được giác ngộ sau Đức Phật*; không có mốc nào khác để đối chiếu.
  · `1.4`/`7.3` `nibbasanāni` — 0 tiền lệ cho cụm này. `nibbasana` = *đáng bỏ, đáng vứt bỏ*
    (nghĩa vứt bỏ của người tu, `vinaya`), nên câu nghĩa là *những tấm y này thôi đã đáng bỏ*.
    Tôi dịch *đã đáng bỏ đi* (1.4) và *đáng bỏ đi* (7.3) cho nhịp đúng; bản Anh đã ghim dùng
    *a burden* ở 1.4, tức *gánh nặng*, khớp với `garukāni` ngay trước đó.
  · `1.5` `gahapatāni` = *gia chủ* (đo được: `an4.53`, `sn1.8`, …); `nimantanāni ca bhuñjāhi`
    = *nhận lời mời dùng bữa* (0 tiền lệ cho cụm này; `nimantana` là lời mời).
  · `6.1` `Ime khvāhaṁ … dve atthavase` — số từ `ime` là **đôi** (hai lợi ích); tôi dịch *hai
    lợi ích ấy* để khớp `5.12` và với `dve` ở `4.1`.
  · `7.2` `devamanussānaṁ` → *chư thiên và loài người*; `Bahujanahitāya … bahujanasukhāya`
    là cặp *vì lợi ích … và an lạc của đa số* — tôi giữ đúng hai vế ấy (`bahujanahitāya` rồi
    `bahujanasukhāya`) và không thay bằng một cụm chung.

