    ghim `sn16.5:0.3` = *Old Age* xác nhận.
  · `Pañcamaṁ.` (7.4) → *Thứ năm.* (**250 tệp**).

  Dấu lược: đây là khuôn kệ lược dày nhất của lát — **26 khoá** có dấu lược ở Pāli:
  `1.1` (1 dấu `…` đơn), `3.1`–`3.7` (7), `4.1`–`4.7` (7), `5.3`–`5.10` (8), `6.1`–`6.7`
  (7) — tổng **30** dấu. Bản Việt giữ **đúng từng dấu, từng khoá**, không mở rộng ở đâu cả.
  Cụ thể:
  · `…pe…` (một dấu lược theo luật của `_hvi.py`, tức `…pe…` = MỘT `…`) ở `3.1`, `4.1`,
    `5.3`, `5.4`, `6.1` → bản Việt mỗi khoá một `…` ở cuối, **không** viết lại danh sách bị
