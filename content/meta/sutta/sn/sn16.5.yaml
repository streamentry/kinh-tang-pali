  · `3.1` `atthavasaṁ sampassamāno` → *do thấy lợi ích gì* theo `dn21:2.8.1`.
  · `7.1` `Sādhu sādhu` → *Lành thay, lành thay,* (**35 khoá** toàn cục) ⟵ *Tốt lắm, tốt
