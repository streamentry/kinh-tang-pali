  Danh sách chín pháp hạnh — dùng lại nguyên văn tiền lệ trên **cùng Pāli**:
  · `sn16.8:2.2` (đã published, cùng phẩm) liệt kê đúng chín hạnh: *sống ở rừng, đi khất
    thực, mặc y phấn tảo, chỉ dùng ba y, ít ham muốn, biết đủ, sống viễn ly, không giao du,
    tinh tấn* cùng cặp *vừa … vừa tán thán hạnh …*. Tôi dùng đúng bộ này cho `2.1`, `3.2`
    –`3.8`, `4.2`–`4.8`, `5.4`–`5.11`, `6.2`–`6.8`. Từ đó `āraññika` → *ở rừng*, `piṇḍapātika`
    → *khất thực*, `paṁsukūlika` → *y phấn tảo*, `tecīvarika` → *ba y*, `appiccha` → *ít ham
    muốn*, `santuṭṭha` → *biết đủ*, `pavivitta` → *sống viễn ly*, `asaṁsaṭṭha` → *không giao
    du*, `āraddhavīriya` → *tinh tấn*, `vaṇṇavādī` → *tán thán hạnh*.
  · ⚠ `sn16.8:2.2` dùng **vừa … vừa** cho cả chín hạnh; ở đây Pāli dùng **vừa … và vừa tán
    thán …** (`X ceva Y ca vaṇṇavādī`), nên tôi viết `X, và tán thán hạnh Y` — giữ đủ hai vế
    `…cEva … ca vaṇṇavādī` mà không lặp vừa. Ghi lại vì đây là lệch hình thức có chủ đích.
  · `1.3` dùng nguyên văn `sn16.6:1.2` / `sn16.8:1.2` (cùng Pāli).
  · `5.1` dùng nguyên văn `an2.30:1.3` (*Thấy rõ sự sống an lạc theo điều đã thấy biết của
    bản thân, và thương xót những đời sau*) — cùng Pāli.
  · `5.12` theo `sn16.8:4.4`–`4.5` (*Các vị ấy thực hành theo như vậy … mang lại lợi ích và
