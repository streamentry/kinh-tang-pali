    không có dấu lược; ở đây Pāli có `…` nên tôi giữ **đúng một** dấu, xem `Dấu lược`).

  ⚠ MỘT LỖI TIỀN LỆ — `1.2` `rājagahe veḷuvane.` `sn16.6:1.1` có **đúng Pāli này** và dịch
  *Trú ở Rājagaha, tại chỗ cho sóc ăn* — đó là dịch nhầm `kal Moe` (`kal Moe`, tên chỗ nuôi
  dưỡng sóc ở Rājagaha) vào chỗ `veḷuvane` (rừng trúc). Tôi **KHÔNG** sao chép lỗi ấy; theo
  đa số đo được cho `veḷuvane`: *Trúc Lâm* **17 khoá** ⟵ *rừng trúc Veḷuvana* 14 ⟵ *rừng
  Trúc* 5 ⟵ *vườn tre* 5 ⟵ *vườn Bambu* 4. Người biên tập nên sửa riêng `sn16.6:1.1` (ngoài
  lát này).

  Tên phẩm và tiêu đề — đa số ĐO ĐƯỢC:
  · `Saṁyutta Nikāya 16.5` (0.1): giữ nguyên Pāli — 100% tệp `sn` đã có giữ Pāli ở `0.1`.
  · `1. Kassapavagga` (0.2): *1. Phẩm Kassapa* **9/9 tệp** có cùng Pāli này (`sn16.6`,
