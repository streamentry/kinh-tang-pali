notes: |-
  Dịch trọn 79 khoá từ Pāli root, đối chiếu Anh Sujato, đối chiếu thêm bản Việt Thích Minh Châu nguyên bài (mục tra cứu toàn văn, không có ở tầng segment) và tiền lệ trong tầng.

  COVERAGE ENGLISH: khoá Pāli có nội dung (từ 40 ký tự, bỏ khối đánh số 0.x) có 61. Sujato đã ghim có chữ ở 60/61 = 0,984 (chỉ trống 15.3, là lần lặp lại nguyên chuỗi đã nêu ở 15.2). Khoá 15.3 do lớp english-project lấp (meta en published) nên cổng tính 61/61 = 1,000, nhưng khoá đó KHÔNG phải một lần đọc English độc lập. Sujato cũng trống ở 9.6, 16.2, 18.2 (dưới 40 ký tự, không vào mẫu số); 5.3 Sujato rút gọn bằng dấu lược nên 5.3 được dịch trực tiếp từ Pāli, không dựa English. Tầng vietnamese-current không có bài này (chỉ có Pháp Cú), nên không có ô đối chiếu Việt ở mức segment; bản Thích Minh Châu nguyên bài chỉ dùng để tra cứu. Vì vậy triangulation 9,2 chứ không cao hơn.

  SỐ PĀLI, tự tính: tiṁsamattā = khoảng ba mươi (2.1); sattāha = bảy ngày và aṭṭhamī = ngày thứ tám (13.2); catugguṇa = gấp bốn lớp (14.2); sattaratana = bảy và aḍḍhaṭṭhama = bảy rưỡi (tám trừ nửa), nên bảy thước hay bảy thước rưỡi, cùng cách đã dùng ở ud4.4 (17.2); navannaṁ = chín, pañcannaṁ = năm, cha = sáu (16.3, 17.2); tayo atthavasa = ba lợi ích (3.1, 3.3); Ekādasamaṁ = Thứ mười một (18.2). Không có cụm số chưa phân xử được.

  DẤU LƯỢC: Pāli chỉ có một …pe… ở 16.2, bản Việt giữ đúng một dấu …; không mở rộng. 16.3 là câu chú trong ngoặc đơn của chính Pāli (không phải (…) trần), dịch nguyên câu. Không có (…) trần ở khoá nào.

  DÙNG LẠI NGUYÊN VĂN TRONG CHÍNH BÀI (7 cặp Pāli trùng, 0 cặp Việt khác): 5.4=4.3, 5.5=4.4, 5.6=4.5, 10.1=11.1=12.1, 11.3=10.3 (12.3 khác Pāli vì có dấu nháy đóng). 5.3 gần trùng 4.1 + 4.2 nhưng có mở đầu Tathā hi pana nên không trùng nguyên văn. 15.2 và 15.3 có chung chuỗi trích dẫn, đã dịch giống hệt nhau (khớp ghi chú của lớp lấp English: dhammadāyādo là thừa tự Pháp).

  TIỀN LỆ ĐÃ ĐO (tầng, 46 cặp Pāli trùng với bài khác đã dịch; lệch có chủ ý ghi dưới):
  · bhikkhunī: tỳ-kheo-ni 301, tỳ-kheo ni 74, tỳ-kheo nữ 15, nữ tỳ-kheo 6. Chọn tỳ-kheo-ni. sn16.10 dùng nữ tỳ-kheo (nằm trong 6 chỗ ấy); đây là một chỗ lệch có chủ ý so với bài anh em.
  · tên: Pāli bài này là Thullanandā (Pāli sn16.10 là Thullatissā); giữ đúng Pāli, không theo bản Thích Minh Châu (Thullatissā).
  · abhiññā: trong tầng sn là thắng tri 129 so với thắng trí 57 (toàn tầng thắng trí 233 so với thắng tri 110); sn16.9 và sn16.10 dùng thắng tri; chọn thắng tri cho nhất quán với bài anh em. Hai chỗ khác sn16.10 vì tầng sn16.10 dùng sáu/năm tầng tri kiến (chỉ có ở đó): 16.3 với sn16.10:6.4 và 17.2 với sn16.10:9.1 (xem bất định bên dưới).
  · vivicceva kāmehi: ly dục 87, ly các dục 10, viễn ly khỏi tham dục 6 (sn16.9, sn16.10); chọn ly dục.
  · sikkhaṁ paccakkhāya hīnāyāvattā: từ bỏ học giới / hoàn tục trở về đời sống thấp kém (sn35.244, sn35.120).
  · saraṇo raṭṭhapiṇḍaṁ bhuñjiṁ, aññā udapādi: theo mn124:38 (còn mang nợ, chánh trí khởi sinh).
  · muddhāpi tassa vipateyya: nứt vỡ 18, vỡ 5, vỡ tung 1; chọn nứt vỡ.
  · catugguṇaṁ saṅghāṭiṁ: gấp làm bốn lớp, tăng-già-lê (sn4.13, sn1.38, dn16). kāsāya: áo cà-sa 87 so với y vàng nghệ/vàng sậm 4. sambādho gharāvāso: chật hẹp và bụi bặm 5 (mn51, mn36, mn38, mn125), nên 8.5 theo đúng cụm đó; Yannūnāhaṁ…: Thôi thì ta hãy cạo bỏ… (8 khoá, mn82, mn94, mn100, mn101), nên 8.7 theo cụm đó.
  · 8.6 (Nayidaṁ sukaraṁ… saṅkhalikhitaṁ): hai dạng gần ngang nhau, trắng bạch như vỏ ốc 5 (dn2, dn10, mn94, mn100, mn101) và như vỏ ốc được đánh bóng 6 (mn27, mn36, mn38, mn51, mn112, mn125); giữ dạng dn2/dn10 vì bám saṅkhalikhita sát hơn ở độ trắng sáng và trùng chữ thanh tịnh với 5 khoá cùng dạng. Đây là chỗ thuật ngữ 5-6 chưa phân định rõ nên terminology chỉ 9,1.
  · dummaṅkūnaṁ puggalānaṁ niggahāya, pesalānaṁ bhikkhūnaṁ phāsuvihārāya: tầng đã dịch ngăn hạ những người kém cỏ / tỳ-kheo tốt sống an ổn ở an2.280, an2.281-309, an10.31 (3 khoá); theo tầng dù kém cỏ chưa sát nghĩa dummaṅku (khó dạy, ngoan cố). Pāli ở 3.2 không có chữ ca giữa hai vế đầu nên giữ chúng thành một lý do, dấu chấm phẩy tách ba lý do.
  · nibbasana: đáng bỏ đi, theo sn16.5:1.4. kassapa: Phật xưng ngươi với Kassapa (sn16.5); Kassapa xưng ta và gọi Ānanda là ngươi/hiền giả như sn16.10:4.3; Ānanda gọi Kassapa là ngài, như sn16.10:1.4. 8.1: Kassapa nói với Ānanda, khác sn16.10:4.2 (bạch Tôn giả Ānanda), vì người trên nói với người dưới không dùng bạch.
  · địa danh: Veḷuvana = Trúc Lâm 36 so với rừng trúc 27; kalandakanivāpe: chỗ nuôi dưỡng các con sóc (15). Dakkhiṇagiri không có tiền lệ trong tầng, dịch vùng Nam Sơn (Hán–Việt cho dakkhiṇa + giri, cũng là cách Thích Minh Châu dùng).

  BẤT ĐỊNH ĐÃ PHÂN XỬ (ghi ở đây, không thêm vào thân kinh):
  · 5.2 Atha ca pana mayaṁ ajjāpi… kumārakavādā na muccāmā: nghĩa đen là tôi vẫn chưa thoát khỏi lời gọi là đứa trẻ. Bản Thích Minh Châu viết tôi không có phật lòng, đó là cách đọc khác; chọn nghĩa đen theo Pāli và Sujato (I still can't escape being called a boy), vì phản ứng của Thullanandā ở 6–7 cũng khớp với việc Ānanda không hài lòng.
  · 8.3 nābhijānāmi aññaṁ satthāraṁ uddisitā: uddisitā dịch là tôn ai khác làm bậc Đạo sư, theo cách tầng đã dùng ở mil4.6:1.4 (không tôn ai khác làm bậc Đạo Sư). Sujato viết dedicating myself to; Thích Minh Châu viết không chấp nhận một Đạo sư nào khác. Ba cách này gần nhau, không đổi giáo nghĩa.
  · 2.3/3.1/3.3 tikabhojanaṁ: Pāli chỉ là tika (nhóm ba) + bhojana. Sujato giải là bữa ăn theo nhóm hơn ba người (rule against eating in groups of more than three), Thích Minh Châu là Chỉ ba người ăn. Bản này giữ điều luật ba người cùng ăn, không thêm không quá hay hơn; chi tiết áp dụng thuộc Luật tạng.
  · 9.11 yo… evaṁ sabbacetasā samannāgataṁ sāvakaṁ ajānaññeva vadeyya jānāmīti: sāvakaṁ là tân ngữ của vadeyya (nói với một đệ tử dốc trọn tâm), nên người có đầu nứt vỡ là kẻ không biết mà tự nói là mình biết với đệ tử ấy, theo Sujato. Bản Thích Minh Châu đọc sāvakaṁ là chủ thể không biết. Chọn cách đọc ngữ pháp của Sujato. Câu dẫn jānāmīti bằng iti không có dấu nháy trong Pāli nên bản Việt không thêm nháy.
  · 17.2: đoạn Pāli này trùng sn16.10:9.1 nhưng không có đại từ tvaṁ; yo (ai) là chủ ngữ chung. Bản này dịch ai nghĩ rằng có thể che giấu sáu thắng tri của ta… theo Pāli, Thích Minh Châu và Sujato (Sujato dịch hơi hướng về Ānanda). sn16.10:9.1 thêm ngươi và nhất định (không có trong Pāli), và dùng sáu tầng tri kiến, lệch tầng; đề nghị rà lại sn16.10:9.1 và 6.4 (2 khoá). Tālapattikā là lá cọ (tầng cọ 35, thốt nốt 14, dừa 1 là sn16.10).
  · 5.3 Tathā hi pana tvaṁ…: Sujato rút gọn bằng dấu lược; Pāli đủ, dịch đủ. Tathā hi dịch Quả thật là vậy (đúng thế), không khẳng định quan hệ nhân quả.
  · 4.1: tỳ-kheo mới tu = nava (Sujato junior mendicants; navappāyā ở 4.4 là những vị phần nhiều còn mới). olujjati dịch rệu rã, palujjati dịch tan rã; hai chữ gần nghĩa, giữ hai chữ khác nhau để theo hai động từ Pāli.
  · 10.2 theresu navesu majjhimesu: các vị trưởng lão, các vị mới tu và các vị ở bậc trung (majjhima là bậc giữa về thâm niên, không phải tuổi nên không dịch trung niên). hirottappaṁ: tàm và quý (tầng tàm và quý 21, tàm quý 3, hổ thẹn 4).
  · 8.8 ye loke arahanto te uddissa: nhân danh các bậc A-la-hán trên đời (Sujato in the name of). Thích Minh Châu viết theo thông lệ các vị Ứng Cúng ở đời, thêm nghĩa so với Pāli. 8.8 kāretvā dịch làm (không có cho làm).
  · 18.1 Cavittha ca pana… brahmacariyamhā: sa cơ mất phạm hạnh theo cách của sn16.10:10.1; không đoán thêm nguyên nhân.

  KIỂM TRA: tập khoá 79/79 trùng Pāli, đúng thứ tự; nháy đơn và nháy kép khớp Pāli ở 79/79 khoá (so sánh từng khoá); dấu lược khớp 79/79 (Pāli có … ở 1 khoá, 16.2); NFC sạch, không khoá rỗng, không Pāli lọt sang Việt ngoài tên riêng; các cặp Pāli trùng với bài khác trong tầng: 46 cặp dò, 44 lệch mặt chữ (phần lớn là biến thể diễn đạt khác của chính tầng như ở 8.5–8.7), các điểm lệch có ý nghĩa đã ghi ở trên.

  technical_integrity 9,6: lát này không chạy cổng. Bốn lệnh còn lại phải chạy trước khi xuất bản: npm run validate, npm test, npm run check, npm run build.
