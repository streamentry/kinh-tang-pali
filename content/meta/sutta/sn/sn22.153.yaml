  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato (34/35 khoá có chữ). Coverage English = 12/12 khoá Pāli có nội dung = 100%.
  0.1 giữ `Saṁyutta Nikāya 22.153`; 0.2 theo tiền lệ 8 lần; 1.1 theo tiền lệ 403 lần.
  Bốn cặp khoá có Pāli trùng nguyên văn dùng lại nguyên văn: 1.2 (11 lần), 1.4 (5 lần), 1.5 (3 lần), 1.7, 1.8, 1.9 (khi có X …), 1.12, 1.13, 1.17, 1.19, 1.20, 1.23, 1.30, 1.31, cùng nhóm câu trả lời.
  0 tiền lệ cho công thức kiến chấp `no cassaṁ, no ca me siyā, nābhavissa, na me bhavissatī`. Dùng MỘT cách cho cả 1.3, 1.6, 1.11, 1.18, 1.28 vì Pāli lặp nguyên văn.
  BẤT ĐỊNH: `no cassaṁ` là câu cụt (không có chủ ngữ rõ ràng). Sujato đọc là I might not be. Chọn cách bám Pāli (Có thể chẳng có) thay vì thêm chủ ngữ Ta vào thân kinh, vì thêm là viết chữ không có nguồn.
  Dấu nháy kép đặt đúng như Pāli, tổng cân bằng trên toàn bài; 1.4 không có nháy trong Pāli và cũng không thêm. `…pe…` ở 1.4 và 1.30 giữ đúng MỘT dấu lược.
  Khung 1.2–1.11 của bài này khác bài song song `sn22.152` ở chỗ có cả `sati` cho từng mục, nên dịch Khi có cảm thọ / khi có tưởng / khi có các hành thay vì dùng chung công thức không có `sati` với bài kia.
