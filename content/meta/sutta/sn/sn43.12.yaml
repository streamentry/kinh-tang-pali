notes: |-
  Đợt 19, lát l38. Dịch từ Pāli root commit 11c9d708, đối chiếu English Sujato đã ghim và các bài cùng chùm đã published (sn43.1–sn43.11, sn43.13).

  **Coverage Anh trên Pāli có nội dung: 46/103 = 44,7%** — dưới sàn 0.80. Mẫu số = 103 khoá Pāli ≥ 40 ký tự (bỏ khối :0). Sujato lược hoặc để trống 57 khoá: toàn bộ các khoá lặp công thức (câu hỏi 'Katamo ca, bhikkhave, asaṅkhatagāmimaggo?' và 'Ayaṁ vuccati … …pe…') cùng 2.9 và 11.11, 11.14. Tầng english-project chưa có nội dung cho bài này (không lấp ở lát này, vì ngoài phạm vi hai tệp); tầng vietnamese-current chỉ có Pháp Cú nên vắng ở sn. Như vậy trong 57 khoá đó Pāli tự đứng vững; không coi chỗ English trống là sự đồng thuận về cách dịch. Theo luật cổng: dưới 0.80 thì status phải là draft kèm blocker; điểm cao không cứu được blocker.

  **Dịch trọn 131 khoá** (có 3 khoá tiêu đề :0.x và khoá đóng 11.20); không có khoá ngoài tập khoá Pāli. 63 cặp khoá Pāli trùng nguyên văn trong chính bài (chuẩn hoá khoảng trắng cuối), 0 cặp bản Việt khác nhau. Pāli viết thường ở đầu khoá (3.4, 3.7, 4.4, 4.7 …) là phần tiếp nối sau dấu lược; bản Việt viết hoa như câu độc lập và giữ nguyên văn cùng một câu cho mọi khoá Pāli lặp, còn mảnh vị ngữ (5.6, 8.6, 9.3, 10.3 …) viết thường. Dấu lược `…pe…` → đúng một `…`; 54/54 khoá Pāli có dấu lược khớp số lượng, `…pe….` (3.8, 4.8, 5.11, 6.11, 7.11, 8.14, 9.14, 10.10) → ` ….`.

  **Dấu nháy theo Pāli từng khoá, không tự cân.** Tại commit đã ghim, `“` mở ở 1.1 nhưng khoá 1.11 kết `anusāsanīti.` không có `”`; các khoá 2.x–11.18 không có dấu nháy; `”` đóng chỉ xuất hiện ở 11.19. Bản Việt khớp đúng từng khoá (0 lệch / 131 khoá) — đó là đặc điểm của tầng Pāli ghim, không phải lỗi dịch.

  **Dùng lại nguyên văn đã published:** công thức mở và kết bài (`Asaṅkhatañca vo … maggaṁ`, `Taṁ suṇātha` → *Hãy lắng nghe*, `Yo rāgakkhayo …`, `Katamo ca … asaṅkhatagāmimaggo?`, `Iti kho … desito asaṅkhatagāmimaggo`, `Yaṁ satthārā karaṇīyaṁ …`, `Etāni rukkhamūlāni …`) theo `sn43.1`, `sn43.11`; định có tầm có tứ / không tầm chỉ còn tứ / không tầm không tứ và định không / vô tướng / vô nguyện theo `sn43.3`, `sn43.4`; `Paṭhamaṁ` → *Thứ nhất*; `Dutiyavagga` → *2. Phẩm Thứ Hai* theo `sn43.13`.

  **Tiền lệ đã đo trước khi chọn:** `kāye kāyānupassī … ātāpī sampajāno satimā …` → *tinh cần, tỉnh giác, có niệm, xa lìa tham lam và buồn phiền nơi đời* (149 khoá so với 26 khoá *nhiệt tâm … nhiếp phục tham ưu* trong bộ sn); bốn chánh cần theo `sn51.13`/`sn49.1-12` (*khởi ý muốn, cố gắng, phát khởi tinh tấn, nâng đỡ tâm, nỗ lực để …*); `…padhānasaṅkhārasamannāgataṁ iddhipādaṁ` → *như ý túc đi cùng định do … và các hành tinh cần* theo `sn51.2` (giữ `saṅkhāra`; kiểu *sự chuyên cần về …* của `sn51.1` bỏ mất `saṅkhāra`); `vivekanissitaṁ …` → *y cứ vào viễn ly, y cứ vào ly tham, y cứ vào diệt tận, và hướng đến buông bỏ* theo `sn45.2`, `sn46.1`, `sn48.71-82`; giác chi theo `sn46.1`; `sammāsaṅkappa` → *chánh tư duy* theo `sn45.2`.

  **Bất định đã phân xử và ghi lại:** (1) `asaṅkhata` → *vô vi* theo `sn43.1`; vấn đề toàn kho (*vô vi* so với *bất tân*) còn mở, người biên tập quyết cuối. (2) `samatho` đứng riêng → *Chỉ* (Sujato *Serenity*; `sn43.11` uddāna *chỉ*); `vipassanā` → *Quán* (Sujato *Discernment*), tức hai khoá riêng 1.7 và 2.7, không phải cụm *chỉ và quán* của `sn43.2`. (3) `chanda` → *ham muốn* (theo cách dùng ở `sn43.11` và đa số `sn51`); `vīmaṁsā` → *quán sát* (Sujato *inquiry*; `sn51.1` *quán sát*, `sn51.2` *quán*). Dạng Pāli ở 7.11 là `vīmaṁsasamādhi…` (không có `ā` như ở sn51), nghĩa không đổi. (4) `vineyya loke abhijjhādomanassaṁ` → *xa lìa tham lam và buồn phiền nơi đời* (đa số trong sn; nghĩa chữ: nhiếp phục tham ưu ở đời). (5) `vivekanissitaṁ … vossaggapariṇāmiṁ` đứng sau `bhāveti`: Sujato đọc là tính từ của căn/lực/giác chi (*which relies on seclusion …*); bản Việt giữ cú pháp phẳng của tiền lệ, không phân xử thêm. (6) Số lượng: bài không có số Pāli cần tính (không `bốn/năm/bảy/tám` nào xuất hiện ở dạng số; tên các nhóm chỉ là danh xưng).

  **Lượt review đối kháng:** in cặp Pāli ↔ Việt cả 131 khoá và đọc lại. Không sửa được lỗi nào ở bản đã ghi; phép đo `…` trần: 0 khoá Pāli có `…` trần không phải `…pe…`, nên phép này chạy với mẫu số 0 cho dạng đó và không nói gì thêm.

  **Technical gate chưa chạy ở lát này** (bị cấm); `technical_integrity` đặt 9.6 và không tuyên bố pass. Còn phải chạy: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
