notes: |-
      Nguồn: đúng uid sn22.35, Pāli root bilara đã ghim, đọc trực tiếp từ tệp root-pli-ms của commit đã ghim. Tầng Anh đã ghim là bản Bhikkhu Sujato cùng commit; tầng Việt hiện hành (Hòa thượng Thích Minh Châu) không có ở bài này vì snapshot upstream chỉ phân phối Pháp Cú — ghi rõ đây là đặc điểm của snapshot, không phải thiếu sót của repo.
      Coverage đo bằng đúng quy tắc trong source/layers.yaml (Pāli có nội dung ≥ 40 ký tự, bỏ khối tham chiếu `:0`): 23/23 segment có tiếng Anh = 100%. Segment 1.4 trống ở bản Sujato đã ghim, nhưng lớp lấp English của dự án tại content/translation/en/project/sutta/sn/sn22.35_translation-en-project.json đã điền và có status published, nên tính vào coverage. Không có mất tầng tham khảo nào.
      Trùng nguyên văn: 11/40 khoá của bài này có Pāli TRÙNG TUYỆT ĐỐI (sau khi chuẩn hóa khoảng trắng) với khoá đã dịch ở sn22.63 — dùng lại nguyên văn bản Việt của sn22.63 cho 1.2, 2.1, 3.1, 3.2, 3.13, 4.1, 5.1, 5.2, 5.3; 0.3 theo sn36.23:0.3. Trong lát này không có cặp trùng nội bộ nào ở sn22.35 ngoài cặp 2.11/3.12 (cùng Pāli, đã dịch giống nhau có chủ ý).
      Tiền lệ đo được: `Saṁyutta Nikāya N.N` 1482/1612 bài `sn` ở khối `:0.1`; `4. Natumhākavagga` → «4. Phẩm Không Như Mình» 7/7; `Sāvatthinidānaṁ.` → «Tại Sāvatthī.» (sn22.64:1.1); `eko vūpakaṭṭho appamatto ātāpī pahitatto viharanto` → «một mình, viễn ly, không buông lung, nhiệt tâm, tinh cần» (sn22.63:1.4 và :4.2).
      Bất định đã ghi, không giấu:
        1) `anuseti` (1.5, 1.6, 2.2–2.7, 2.11, 3.3, 3.7, 3.8, 3.12) dịch là «có khuynh hướng về». Cách đọc khác có tiền lệ trong chính tầng này là «tiềm ẩn nơi» (dn15:24.3 `anusetīti` → «đang tiềm ẩn nơi người ấy») và «tùy miên … chi phối» (mn148:28.3 `rāgānusayo anuseti`). Chọn «khuynh hướng» vì Sujato dịch `underlying tendency` và vì câu phải lặp mười lần: «tiềm ẩn» khiến câu nặng và «tùy miên … chi phối» đổi cả nghĩa (chủ thể của `anuseti` ở đây là người tu, không phải tâm bị chi phối). Cả ba cách giữ nguyên scope của `tena` (tức là lý do).
        2) 1.7 — Pāli `“Aññātaṁ, bhagavā, aññātaṁ, sugatā”ti.` có đúng hai xưng hô (`bhagavā`, `sugatā`). Bản Việt đang có của sn22.64:1.6 (cùng Pāli tuyệt đối) bỏ mất `sugatā`. Ở đây giữ cả hai: «Bạch Thế Tôn, con đã hiểu rồi, bạch Đấng Thiện Thệ, con đã hiểu rồi». Có tiền lệ dạng này trong tầng (ví dụ một bản dịch khác của cùng Pāli này dùng «Bạch Thế Tôn, con đã hiểu! Bạch Đấng Thiện Thệ, con đã hiểu!»). Việc lệch với sn22.64 là có chủ ý, tính vào ambiguity_integrity.
        3) 2.12 — bản Việt của sn22.63:2.10 (cùng Pāli) dùng «tôi hiểu được»; ở đây dùng «con hiểu được» để giữ một xưng hô duy nhất với 1.3–1.4 trong chính bài này. Lệch một từ, không đổi nghĩa.
        4) `eko vūpakaṭṭho …` ở 1.4 và 5.1: an5.56:4.2 có Pāli mở đầu giống hệt nhưng dịch «thoát ly, không phóng dật, tinh cần, tự nỗ lực». Chọn theo họ bài song song sn22.63/sn22.64 để người đọc đối chiếu cùng công thức không thấy hai cách. Ghi ra đây để người biên tập gộp nếu muốn thống nhất toàn tầng.
      Dấu lược: Pāli có `…pe…` ở 6 khoá (2.8, 2.9, 2.10, 3.4, 3.5, 3.6, 3.9, 3.10, 3.11 — tính cả hai nhóm lặp). Mỗi khoá giữ đúng MỘT `…`, không mở rộng, không bịa chữ. Bản dịch ở các khoá lược không suy rộng nghĩa vì công thức `anuseti/nānuseti tena saṅkhaṁ gacchati` đã nêu đủ ở 2.2 và 3.3.
      Kiểm tra: `_hvi.py` bắt được 0 lỗi (đủ 40/40 khoá, NFC, ngoặc kép cân trên cả bài, dấu lược khớp từng khoá, không trùng nguyên văn Pāli ở khoá có nội dung, không lọt Pāli). 40 khoá đã đối chiếu từng cặp Pāli ↔ Việt trong một lượt review đối kháng riêng.

