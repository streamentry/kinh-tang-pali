notes: |-
  Dịch từ Pāli root (bilara đã ghim), đối chiếu Anh Bhikkhu Sujato. ĐO LẠI: 23/23 khoá Pāli có nội dung đều có chữ Anh ⇒ coverage 1,000. Bản lấp Anh của dự án (`sn22.35:1.4`, status published) là tầng duy nhất có chữ cho khoá đó.
  KHÔNG ĐƯỢC TUYÊN BỐ ĐỐI CHIẾU ĐỘC LẬP Ở TẦNG ANH. Bản lấp Anh và bản Việt cùng một người chấm (`OpenCode Space Bunny Free (agent)`), nên `triangulation` chỉ 9,0 và câu 1.4 dựa vào Pāli + tiền lệ Việt đã có, không phải vào một bản đọc Anh độc lập. Đây cũng là chỗ `validate` sẽ cảnh báo về `shared assessed_by`.
  Bản Việt hiện hành (Hòa thượng Thích Minh Châu) KHÔNG có ở bài này: tại commit đã ghim, tầng `vietnamese-current` chỉ có 26 chương Pháp Cú. Đối chiếu thuật ngữ vì vậy dựa vào Pāli + Anh Sujato + tiền lệ của chính tầng dự án.
  0.1 giữ `Saṁyutta Nikāya 22.35` — đo 1612/1613 tệp `sn` giữ nguyên Pāli ở khoá `:0.1`, `Saṡyutta` (sai dấu) = 0 lần trên đĩa. 0.2 theo tiền lệ 4 bài cùng phẩm (4. Phẩm Không Như Mình). 0.3 theo `sn36.23:0.3`. 1.1 theo tiền lệ 63 khoá (Tại Sāvatthī.).
  PĀLI TRÙNG NGUYÊN VĂN: 14/40 khoá có Pāli giống hệt tệp đã có; 13 khoá dùng lại NGUYÊN VĂN bản Việt — 1.2 (`sn12.16`/`sn15.5`/`sn22.63`) · 1.7, 2.1, 3.1, 3.2 (`sn22.63/64/65`) · 2.12 (`sn22.63:2.10`) · 4.1 (`sn22.63:4.1`) · 4.3 (`sn35.64:4.3`) · 4.4 (`sn22.63:4.4`) · 5.3 (`sn47.3`/`sn47.46`). Lát c51: 99 khoá có tiền lệ, 97 dùng lại nguyên văn.
  LỆCH CÓ CHỦ ĐÍCH, 1 khoá: 5.1 có Pāli giống `an8.63:11.2` nhưng CỐ Ý dịch khác, dùng đúng bộ tính từ đã dùng ở 1.4 (một mình, viễn ly, không phóng dật, nhiệt tâm, tinh cần). Lý do: 1.4 và 5.1 mang CÙNG một cụm Pāli `eko vūpakaṭṭho appamatto ātāpī pahitatto`; nếu 5.1 theo `an8.63` (tinh cần, quyết chí) thì bài này tự dịch hai cách cho cùng một cụm. Ưu tiên nhất quán nội bộ hơn tái dùng chéo bài — người biên tập có thể muốn thống nhất theo hướng ngược lại.
  BẤT ĐỊNH 1: 1.7 `sugatā` bị bỏ, dịch thành `đã hiểu rồi, đã hiểu rồi` — y hệt `sn22.64:1.6`/`sn22.65:1.6` đã publish (Pāli trùng nguyên văn nên phải dùng lại). Sujato dịch `Understood, Holy One!`, tức có giữ Cồng Đàn. Người biên tập nên khôi phục Cồng Đàn cho CẢ BA bài cho khớp.
  BẤT ĐỊNH 2: xưng hô loạng, vốn đã có sẵn trong tiền lệ và được giữ nguyên: Đức Thế Tôn gọi tỳ-kheo là `ngươi` (1.5, 1.6, 2.1, 3.2 và 2.2–3.12), còn tỳ-kheo tự nói `con` ở 1.3–1.4 nhưng `tôi` ở 2.12 (vì 2.12 phải dùng nguyên văn `sn22.63:2.10`). Ba bài `sn22.63/64/65` đã publish cũng lệch y hệt. Ghi ra đây để người biên tập quyết, không tự sửa vì phá vỡ nguyên văn đã có.
  BẤT ĐỊNH 3: 5.2 `nāparaṁ itthattāyā` dịch `không còn gì là tự thân nữa` — 86 khoá trên đĩa, còn 48 khoá dùng `không còn trở lại trạng thái này nữa`. Pāli `itthattāyā` là sự hiện hữu, không có chữ `tự thân`; `sn22.63` (Pāli trùng nguyên văn) cũng chọn cách 86 khoá nên ở đây phải theo. Người biên tập nên thống nhất hai cách này trên toàn tầng.
  THUẬT NGỮ đếm được trên toàn tầng Việt: `viễn ly` 460 > `thoát ly` 135; `không phóng dật` 398 > `không buông lung` 111; `nhiệt tâm` 352; cụm `tinh cần, quyết tâm` 17 > `tinh cần, quyết chí` 1 (cho `pahitatto`). `anusaya`→`thiên hướng` theo tiền lệ `sn35.58`/`sn35.59` (74 khoá); `tena saṅkhaṁ gacchati`→`bị tính là điều ấy` theo cùng nhóm tiền lệ (`tính là` 6 bài, `kể là`, `coi là`). `sugataṁ subhāvitaṁ…` không xuất hiện ở bài này.
  DẤU LƯỢC: bài này không có `…pe…`; năm khoá lược (2.8, 2.9, 2.10, 3.4, 3.5, 3.6, 3.9, 3.10, 3.11) giữ đúng MỘT `…` theo Pāli, và cũng theo tiền lệ `sn22.63:2.6` (`Tưởng …`) — công thức bị nén đã nêu đủ ở 2.2 và 2.7 ngay trong bài.
  DẤU NHÁY: 1.3 mở thì 1.4 khép · 1.5 mở thì 1.6 khép · 1.7 tự cân · 2.1 tự cân · 2.2 mở thì 2.12 khép · 3.1 mở thì 3.13 khép. Tổng cân trên toàn bài.
  CỔNG KỸ THUẬT: `npm run validate`, `npm test`, `npm run check`, `npm run build` do coordinator chạy; technical_integrity 9,6 vì lát này không tự chạy bốn lệnh đó. Đã tự kiểm bằng harness `_hvi.kiểm()` (NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, đủ khoá theo `all`) — 40/40 khoá sạch.
