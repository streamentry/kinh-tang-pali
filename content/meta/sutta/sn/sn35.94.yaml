notes: |-
  Dịch từ Pāli root của commit bilara đã ghim, đối chiếu trực tiếp với bản dịch tiếng
  Anh của Bhikkhu Sujato tại cùng commit. **Tầng Việt hiện hành (Hòa thượng Thích Minh
  Châu) không có ở bài này** — bilara tại commit đã ghim chỉ phân phối Pháp Cú cho
  tiếng Việt (`vietnamese-current` = 26 tệp, toàn bộ thuộc `kn`), đây là giới hạn của
  bản chụp upstream, không phải thiếu sót của kho. Vì không đối chiếu được tầng Việt
  nên `triangulation` 9,3.

  **Coverage Anh đo được: 10/10 khoá Pāli có nội dung = 1.0000** (đo bằng đúng công
  thức `src/lib/canon/reference.ts`: bỏ khối tham chiếu `:0`, ngưỡng Pāli ≥ 40 ký tự).
  Tệp Anh `sutta/sn/sn35/sn35.94_translation-en-sujato.json` có mặt trong
  `source/upstream-manifest.json`. **Số khoá Sujato im lặng = 1**, `10.5` (`Paṭhamaṁ.`,
  9 ký tự) — ngắn hơn ngưỡng nên không tính vào coverage. Không có khoá nào có nội
  dung mà Sujato im lặng, nên **không cần entry trong
  `content/meta/reference-gaps.yaml`**.

  **Lớp lấp `english-project`: `content/meta/en/sn/sn35.94.yaml` KHÔNG tồn tại, và
  tôi không tạo.** Lý do đo được: coverage đã 100% ngay tại tầng đã ghim, nên không
  còn khoá nào nằm trong `fillableSegments`.

  **Mẫu số coverage nhỏ — đọc để không hiểu nhầm:** bài này có **51** khoá Pāli nhưng
  chỉ **10** khoá đủ dài để tính, vì 32 khoa là **từng câu kệ** ngắn (27–38 ký tự).
  Đây chính là loại bài mà `BRIEF_VI4` §4 gọi là *"cổng không đo được gì"*. Tôi đo
  được 10/10 **không phải** bằng chứng rằng phần kệ đã dễ — nó vẫn phải dịch từ Pāli,
  và tôi đã dịch.

  **DÙNG LẠI NGUYÊN VĂN — đo được 7/51 khoá có Pāli trùng từng chữ với bài khác:**
  `0.2` (7 bài: `sn35.96`–`sn35.103` → *10. Phẩm Sáu*), `1.1` (438 bài → *Tại Sāvatthī.*),
  `1.3` và `2.2` (`Katame cha?`, 42 khoá / 31 bài → *Là sáu nào?*), `2.7`
  (`Idamavoca bhagavā …pe…`, 8 bài → *Đức Thế Tôn nói vậy …* — đo lại cụm này:
  **3** *Đức Thế Tôn nói vậy …* vs **2** *Đức Phật nói như vậy …* và **2** *Đức Thế
  Tôn đã nói như vậy …*, nên tôi theo số đông), `2.8` (`etadavoca satthā:`, 1 bài
  `sn22.78:2.14` → *Rồi bậc Đạo Sư nói tiếp:*), `10.5` (`Paṭhamaṁ.`, 294 bài →
  *Thứ nhất.*). **Còn lại 44 khoá là nội dung riêng của bài**, phần lớn là kệ.

  **⚠ BẤT ĐỊNH ĐÃ PHÂN XỬ — ngoặc kép của Pāli bài này vốn LỆCH, và tôi đã sửa.**
  Đếm trên chính Pāli: `1.2` mở `“`, `1.7` đóng `”`, `2.6` **đóng `”` thêm một lần
  nữa** mà không có dấu mở, `3.1` mở `“`, `10.4` đóng `”` — tổng chạy **−1**. Bản Việt
  buộc phải cân (`ngoặc()` chặn cả âm giữa chừng lẫn dư cuối bài). Tôi **thêm** dấu mở
  `“` vào `2.1` (lời thoại thứ hai vốn không có dấu mở) để `2.1`–`2.6` trở thành một
  cặp, thay vì **xoá** dấu `”` có sẵn ở `2.6`. Lý do: xoá sẽ mất luôn dấu báo kết
  thúc `”ti`, còn thêm thì giữ nguyên mọi dấu Pāli đã có và chỉ bổ sung dấu còn thiếu.
  Đây là ngoại lệ có chủ đích so với Pāli, người biên tập nên biết.

  **Về dấu lược:** `lược()` khớp từng khoá — 0 lệch. `1.4`, `1.5`, `2.3`, `2.4` mang
  `…pe…` ⇒ **một** dấu `…`; `2.7` mang `…pe…` ⇒ **một**. Không khoá nào có Pāli viết
  đủ mà tôi nén bằng `…`, nên không có chỗ nào cần người biên tập phán xử theo §10.2.
  Riêng `1.4` và `1.5`: Sujato đã điền đủ danh sách sáu căn, nhưng Pāli chỉ có *mắt*
  (`1.4`) rồi *lưỡi* (`1.5`) — tai, mũi, thân nằm sau `…pe…`. Tôi giữ đúng Pāli, không
  mở rộng danh sách. Cũng như vậy, Pāli của cả cụm `1.4`–`1.6` chỉ nêu ba căn; đó là
  lựa chọn của chính người khai kinh, không phải lược của bản dịch.

  **Công thức bốn vế, dùng đối xứng cả hai cực** — đây là phần dễ trôi dạt nhất của
  bài, nên tôi ghi rõ nguồn: `adanta / agutta / arakkhita / asaṁvuta` → *không được
  điều phục, không được phòng hộ, không được bảo vệ, không được thu thúc*; `sudanta /
  sugutta / surakkhita / susaṁvuta` → *được điều phục, được phòng hộ, được bảo vệ,
  được thu thúc*. **Tiền lệ: `an1.39:1.1` và `:1.2`** (`cittaṁ … adantaṁ aguttaṁ
  arakkhitaṁ asaṁvutaṁ …`) — đúng bốn vế ấy, đã `published`. Tôi theo nó cho cả hai
  cực, và vế thứ tư ở đây còn khớp thêm `sn35.97` (`asaṁvutassa` → *không phòng hộ
  căn mắt*). Đếm trên toàn tầng: *được điều phục* 83, *được bảo vệ* 53, *được thu
  thúc* (mục `được thu thúc`) — tức là vế "phòng hộ" và "thu thúc" là hai từ hiếm hơn
  hẳn; đó là lý do tôi bám `an1.39` chứ không tự đặt.

  **Thuật ngữ, kèm số đếm:** `phassāyatana` → *xứ xúc* (đếm: *sáu xứ xúc* 77, *xứ xúc*
  80, *sáu xứ xúc chạm* 67, *xúc xứ* 16 — tôi theo dạng *xứ xúc*, cũng là cách
  `sn35.103` và `sn54.11` dùng). `dukkhādhivāha / sukhādhivāha` → *đưa đến khổ / đưa
  đến lạc* (0 tiền lệ cho từ, nhưng động từ *đưa đến* là cách `an1.39` dịch `saṁvattati`
  = *mà đưa đến bất lợi lớn*). `upekkhā` → *bình thản* (đo lại trên 523 khoá: *xả*
  235 nhưng phần lớn là trong cụm *an trú xả* của thiền tứ; đứng riêng làm tính từ thì
  *bình thản* 68 vs *sự xả* 5). `saṁvaraṇa` → *thu thúc* (0 tiền lệ; tôi chọn để khớp
  `asaṁvuta` → *thu thúc* ở `3.2`, vì cùng một gốc). `chandā` → *ham muốn*
  (`an4.20:4.4` *không đi vì ái dục, sân hận, si mê và sợ hãi*; `mn21:6.2` *những ham
  muốn*). `nājjhosāya` → *nắm giữ lấy* (`sn35.63:3.2` *không bám chặt lấy chúng*;
  `sn35.64:3.2` *không nắm giữ lấy chúng*; `sn35.118:4.2`, `sn35.131:2.2` *không tham
  luyến, không chấp chặt vào chúng*). `sampavedhe` → *bối rối* (đếm: *bối rối* 33 vs
  *kinh động* 6, *hoảng loạn* 27). `majjhe` → *say mê* (98 khoá). `samucchita` → *mê
  hoặc* (21 khoá). `saññā` → *tưởng* (282 khoá / 154 bài). `padaṁsaye` → *khinh
  thường* (đếm: *chê bai* 148 nhưng là hành vi của người khác; `m-` phủ định ở đây nên
  *khinh thường* đúng nghĩa hơn *chê bai*).

  **Những chỗ 0 tiền lệ, tôi dịch mới và ghi lý do:** `0.3` `Adantaaguttasutta` →
  *Kinh Không Điều Phục, Không Phòng Hộ* (0 tiền lệ; theo cách đặt tên đã có của tầng
  sn — `Saṁvarasutta` → *Kinh Phòng Hộ*, `Paṭhamagilānasutta` → *Kinh Người Bệnh
  (Một)* — lấy chính bốn vế làm tên). `3.1` `Saḷeva … bhikkhavo` → *Chính sáu xứ xúc
  này, này các tỳ-kheo,* (`bhikkhavo` là cách gọi thân mật số nhiều; 10 khoá tiền lệ đều
  là *các tỳ-kheo* trong thơ, nên tôi dùng *này các tỳ-kheo* như phần thân trên).
  `3.4` `Saddhādutiyā viharantānavassutā` → *sống cùng đức tin, không mục rữa*
  (`anavassutā` = không gỉ mục; Sujato *"not festering"*; tôi dùng *mục rữa* vì đó là
  từ đã có 31 khoá trong tầng, còn *gỉ mục* thì 1 khoá và là của chính bản nháp đầu
  của tôi — đã bỏ trong lượt đối kháng). `9.3` `manomayaṁ gehasitaṃ` → *do tâm dựng
  ra, thứ tựa vào đời sống thế tục*. `10.1` `chassu … subhāvito` → *Hãy tu tập tâm
  như thế khi đã được huấn luyện chu đáo*. `10.4` `pāragā` → *đi qua bờ bên kia*
  (`iti46:4.4` *hãy vượt qua sanh và tử* là tiền lệ gần nhất).

  **⚠ Lỗi bản nháp của chính tôi, đã bắt và đã sửa trong lượt đối kháng** (ghi lại để
  không tái phạm): (1) `21.3` ở `sn35.74` ban đầu tôi dịch `dhammacakkhu` thành *con
  mắt của pháp* — **0 khoá** trong toàn tầng; đo lại thì *pháp nhãn* 19 và *con mắt
  của pháp* 0, nên đã sửa. (2) `sn35.94:3.2` ban đầu dịch `Asaṁvuto` thành *không hãm
  trói* trong khi `1.2`/`2.1` dùng *không thu thúc* — **tự mâu thuẫn trong cùng một
  bài**; đã sửa về *thu thúc*. (3) `7.3` ban đầu là *nín nhặt* (1 khoá, của chính bản
  nháp) trong khi `nājjhosāya` có 14 bài tiền lệ → đã sửa thành *nắm giữ lấy*. (4)
  `6.4` ban đầu là *dục* trong khi `chandā` có tiền lệ *ham muốn* → đã sửa.

  **`technical_integrity = 9,6`** vì bốn cổng kỹ thuật do coordinator chạy, tôi không
  được chạy (`npm run validate|test|check|build` bị cấm trong lát này): (1)
  `npm run validate` (qua `npm run build`) — kiểm metadata, scorecard,
  `blocking_errors` và nội dung; (2) `npm test` — unit tests; (3) `npm run check`;
  (4) `npm run build`. Những gì tôi **đã** tự kiểm bằng script: `set(khoá Việt) ==
  set(khoá Pāli)` (51 = 51), `lược()` khớp từng khoá, `ngoặc()` cân trên **toàn bộ**
  51 khoá đã dịch, NFC từng khoá, không khoá nào trùng nguyên văn Pāli, không Pāli lọt
  vào bản Việt (`lọt_pāli` với `pāli_riêng` của chính bài), không có `(…)` đứng một
  mình, và nháy đơn `‘…’` cân từng khoá.