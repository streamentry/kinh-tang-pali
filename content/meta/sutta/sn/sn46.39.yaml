  Bản dịch tiếng Việt mới cho bài kinh sn46.39.

  Ví dụ cây ký sinh to lớn hạt nhỏ: năm triền cái làm suy yếu trí tuệ, đối chiếu với bảy giác chi đưa đến minh và giải thoát.

