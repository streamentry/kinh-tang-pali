notes: |-
  Bản dịch mới từ Pāli root (snapshot SuttaCentral/Bilara đã ghim), đối chiếu bản Anh Bhikkhu Sujato và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không phân đoạn). Bài: Kinh Lõa Thể Kassapa (Acelakassapasutta), bài thứ bảy của Phẩm Đoàn Thực, Tương Ưng Nhân Duyên. 68/68 khoá, đúng thứ tự Pāli.

  COVERAGE ENGLISH (đo thật): Pāli có nội dung (từ 40 ký tự, bỏ khối :0) = 43 khoá. Bản Sujato phủ độc lập 38/43 = 0,884, cao hơn ngưỡng 0,80 của cổng. Năm khoá Sujato để trống (2.2, 4.2, 4.3, 4.4, 4.6) do lớp lấp english-project của dự án bù (đã published; xem content/meta/en/sn/sn12.17.yaml), nên cổng tính 43/43 = 1,00; nhưng năm khoá ấy KHÔNG phải cách đọc English độc lập (cùng một tác giả với bản Việt này) và bản Việt này không tuyên bố đã đối chiếu English độc lập ở năm khoá đó. Vì vậy triangulation hạ xuống 8,8. Tầng vietnamese-current: không có cho bài này ở mức segment; bản Thích Minh Châu chỉ có dạng nguyên bài, dùng để tra nghĩa, không căn lề vào segment.

  BẤT ĐỊNH VÀ CÁC CÂU NGHĨA ĐEN DỄ LỆCH VĂN CẢNH (không thêm vào thân kinh):
  - Khoá 3.12 và 4.6 (`Tena hi bhavaṁ gotamo dukkhaṁ na jānāti, na passatī’ti`): Pāli không có dấu hỏi và không có tiểu từ hỏi, đọc riêng là câu khẳng định (Thích Minh Châu viết khẳng định). Nhưng 4.6 nói `iti puṭṭho samāno` (được hỏi như vậy) nên đây là một câu hỏi; Sujato cũng đặt dấu hỏi. Bản Việt viết dạng hỏi `… chăng?`.
  - Khoá 4.1 `Kiṁ nu kho, bho gotama, ‘sayaṅkataṁ dukkhan’ti iti puṭṭho samāno …`: đọc nghĩa đen có thể thành câu hỏi `vì sao` nhưng đây là lời Kassapa thuật lại các câu hỏi đã hỏi ở 3.1–3.9 (4.2–4.4 cho thấy phần câu hỏi nằm trong dấu nháy). Bản Việt dựng 4.1 cùng dạng với 4.2–4.6: nêu lại câu hỏi trong nháy rồi `Khi được hỏi như vậy, ngài nói …`, đúng với Sujato và Thích Minh Châu (cả hai đều viết câu thuật lại, không viết `vì sao`).
  - `Mā hevaṁ, kassapā` (3.2, 3.4, 3.6, 3.8, 4.1–4.5): nghĩa đen là `Đừng nói như vậy` (cấm đoán). Ở đây là lời bác bỏ từng mệnh đề của câu hỏi, nên dịch `Không phải vậy` theo Sujato (`Not so`), Thích Minh Châu (`Không phải vậy`) và sn12.18 (cùng công thức, `mā hevaṁ, timbarukā`). Mất sắc thái cấm đoán, giữ nghĩa bác bỏ.
  - `ādito sato` (5.1) và `vedanābhitunnassa sato` (5.2): cùng khuôn `sato` ở sở hữu cách. Hiểu là người đã có sẵn từ đầu (nếu người làm và người cảm thọ là một) và người bị cảm thọ đánh trúng. Sujato: `one who has existed since the beginning` và `stricken by feeling`; Thích Minh Châu dịch lỏng (`như Ông gọi ban đầu`). Bản Việt dùng `người vốn có từ đầu` và `người bị cảm thọ chạm tới` (giữ đúng cách sn12.18:4.2 đã published); `abhitunna` nghĩa sát hơn là bị đâm hay bị giày vò, `chạm tới` hơi nhẹ. Ghi như một lựa chọn có ý thức, không sửa lời kinh.
  - `sassataṁ etaṁ pareti` / `ucchedaṁ etaṁ pareti` (5.1, 5.2): `etaṁ pareti` hiểu là đi đến, tức nói như vậy là rơi vào thuyết thường hay thuyết đoạn. Sujato `one implies this is eternal`. Thích Minh Châu `thường kiến` và `đoạn kiến`. Tầng chưa có `thường kiến` làm tiền lệ nên dùng `thuyết thường còn` và `thuyết đoạn diệt` (đo: sassata dịch `thường hằng` 49 khoá, `thường còn` 21 khoá; uccheda dịch `đoạn diệt` 21 khoá).
  - `adhiccasamuppannaṁ` (3.7, 4.4): `ngẫu nhiên` (đo toàn tầng 36 khoá, riêng bộ sn 8 khoá, kể cả sn12.25 và sn12.26) so với `bất thường` (2 khoá, trong đó có sn12.18). Chọn đa số. Lệch với sn12.18 là có chủ ý.
  - Xưng hô: Đức Phật tự xưng `Ta` theo dn8:23.1 và dn8:24.2 (cùng nhân vật Kassapa), dù sn12.18 dùng `tôi`; Kassapa xưng `chúng tôi` ở 1.7 và 2.8 (`mayaṁ`) rồi `con` khi nói `bhante` (4.9, 4.10, 6.x, 8.1), đúng như Pāli đổi từ xưng `bho gotama` sang `bhante`.
  - `antaragharaṁ paviṭṭhamhā` (1.9, 2.4, 2.6): `chúng ta đã vào nhà dân` theo ud1.10:5.6 (cùng cụm). Không thêm `vì` cho khớp dấu chấm phẩy của Pāli.
  - Hai khoá 2.5 và 2.6: `Tatiyampi kho acelo kassapo …pe…` giữ đúng một dấu lược; 2.6 Pāli không có dấu nháy nào nên Việt cũng không có. 6.3 có `…pe…` giữa câu (`ukkujjeyya …pe… ‘cakkhumanto …’`): giữ một dấu `…` ở giữa, không bung ra bốn ví dụ còn lại. Hai khoá 5.5 và 5.8 cũng giữ đúng một dấu lược; tổng 4 khoá có `…pe…` (2.5, 5.5, 5.8, 6.3), 4/4 đúng.
  - Số: `cattāro māse` và `catunnaṁ māsānaṁ` = bốn tháng (7.1, 8.1); `cattāri vassāni` và `catunnaṁ vassānaṁ` = bốn năm (8.1); thứ hai, thứ ba (2.1, 2.5), thứ bảy (9.5). Không có số lớn.
  - `parivasati` (7.1, 8.1): `sống thử thách` (đo: `thử thách` 8 khoá so với `biệt trú` 2 khoá kể cả dn8:24). Chọn đa số.
  - 9.3 `Sinh đã tận …`: viết `Sinh` thay `Sanh` như sn41.9:3.7 (cùng Pāli, cùng nhân vật). Tầng hiện có cả hai chính tả; ghi lại để người điều phối thống nhất.

  TIỀN LỆ DÙNG LẠI NGUYÊN VĂN: 9.2 theo sn41.9:3.6; 9.4 theo sn41.9:3.8; 9.1 theo dn8:24.4; 1.6 theo dn8:1.4; 6.2, 6.4, 6.5 theo tập hợp 5–6 khoá đã published (dn8, dn9, dn16); 5.4 đến 5.9 theo khuôn sn12.15:3.4–3.9 (cùng Pāli); 7.1, 8.1 theo mn75:27 và dn8:24 (thử thách, hài lòng, thọ cụ túc giới). Đã dò 21 khoá có Pāli trùng nguyên văn với bài khác; bản Việt giống hết ở 6 khoá, còn 15 khoá thì ít nhất một bản cùng Pāli khác (câu mở đầu và công thức nhân duyên có nhiều dạng, không dạng nào áp đảo, nên dùng khuôn gần nhất là sn12.15). Trong chính bài này có 6 nhóm khoá Pāli trùng nguyên văn (1.7 và 2.2; 1.8 và 2.3; 1.9 và 2.4; 2.7 và 6.1; 3.2, 3.4, 3.6, 3.8; 3.14 và 4.7) và bản Việt giống nhau trong cả 6 nhóm.

  Kiểm tra đã làm: tập khoá 68/68 khớp Pāli, thứ tự khớp; dấu nháy kép và nháy đơn khớp Pāli từng khoá (68 khoá, 0 lệch); NFC; không khoá rỗng; không Pāli lọt sang Việt ngoài tên riêng.

