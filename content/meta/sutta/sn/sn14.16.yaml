notes: |-
  Đối chiếu: Pāli root + English Sujato + các bản cùng công thức trong kho. Tầng HT. Thích Minh Châu không có cho SN.
  Số khoá: 56/56; mọi "…" và "…pe…" của Pāli giữ nguyên (4.8, 4.9, 6.1, 7.8, 7.9).
  Cặp Pāli trùng nguyên văn tái dùng: 1.2 = sn14.18:1.2; 1.3/3.2/4.7/4.11 = sn14.14:1.3/sn14.15:3.2; 1.4/5.3 = sn14.17:2.1; 1.5 = sn14.15:3.5; 2.1 = sn14.17:3.1; 2.2 = sn14.15:4.2; 3.1/6.2 = sn14.18:2.1 (6.2 có "bhikkhave" khớp; 4.10/7.10 không có "bhikkhave" nên không thêm "này các tỳ-kheo"); 5.2/6.3/7.7/7.11 = sn14.15:3.3/5.3. Tổng: 37/56 segment có segment Pāli trùng đã dịch; các cặp lặp trong bài (1.x = 3.2 = 4.7 = 4.11; 5.2 = 6.3 = 7.7) dịch khớp từng cặp, chỉ khác dấu câu cuối theo ngữ cảnh Pāli.
  Bài kệ 9.1-11.4 trùng nguyên văn Itivuttaka 78 (iti78:6-8) và Thag 2.14/3.16: tái dùng nguyên văn theo iti78 (cấu trúc kệ khớp sn14.16: "Giao du sinh ra bụi rậm / không giao du thì cắt đứt / như leo lên khúc gỗ nhỏ / sẽ chìm giữa biển lớn…"). 9.3-9.4: hai tiền lệ khác nhau cho cùng Pāli "Parittaṁ dārumāruyha, yathā sīde mahaṇṇave" — thag2.14:1.1-1.2 ("Hãy bám lấy khúc gỗ nhỏ, như kẻ ở giữa biển cả rộng lớn") và iti78:6.3-6.4 ("như leo lên khúc gỗ nhỏ, sẽ chìm giữa biển lớn"); chọn iti78 vì khớp ngữ cảnh so sánh của sn14.16 (thag2.14 dùng thể mệnh lệnh theo ngữ cảnh riêng của nó). Không sửa được thag2.14/iti78 (ngoài phạm vi), ghi lại để biên tập quyết.
  Tiêu đề: :0.2 "Dutiyavagga" -> "2. Phẩm Thứ Hai" (96 file tiền lệ); :0.3 "Sagāthāsutta" -> "Kinh Có Kệ" theo sn17.10:0.3 ("Sagāthakasutta" -> "Kinh Có Kệ"); 1.1 "Trú ở Sāvatthī." (93 file) so "Đang sống tại Sāvatthī." (56 file) — chọn số đông; 11.5 "Chaṭṭhaṁ." -> "Thứ sáu." (sn36.16/sn36.26/sn38.6); 8.1 = sn46.14:4.1 "Đức Thế Tôn nói như vậy."; 8.2 = dn31:3.9 "Sau đó, bậc Thiện Thệ, Bậc Đạo Sư nói thêm:".
  Similes 4.1-4.5 và 7.1-7.5 không có tiền lệ cùng segment; dịch từ Pāli với thuật ngữ có sẵn: "bơ tinh" (4 chỗ trong kho) cho sappi, "đường phèn" cho phāṇita (sn7.13:5.1-5.2).
