notes: |-
      **DÙNG LẠI NGUYÊN VĂN — 10 khoá Pāli trùng nguyên văn:** `0.2` = `sn55.21:0.2`
      (*3. Phẩm Quy Y*) · `1.1` = `sn35.124:1.1` (nguyên văn *Một thời Đức Thế Tôn trú tại
      Vesālī, ở Đại Lâm, trong ngôi giảng đường có nóc nhọn.*) · `2.2` = `sn55.11:2.2`
      (*Với bốn nào?*) · `2.4` = `sn55.11:2.4` · `2.5` = `sn55.11:2.5` · `2.6` = `sn55.11:2.6` ·
      `2.7` = `sn55.12:3.7` · `4.6` = `sn12.30:2.13` (*Thứ mười*) · `5.0` = `sn1.10:5.0`
      (*Tóm lược:*) · `5.6` = `sn35.123:2.6` (*phẩm ấy được gọi như vậy*).
      **Đã sửa sau khi đối kháng:** `avinipātadhammo` bản đầu tôi dịch *không còn bị rơi vào ác
      đạo*; đếm lại toàn tầng sn thấy **21** segment dùng *không rơi vào ác đạo* và chỉ **2**
      dùng *không còn bị rơi vào ác đạo* — tôi đã sửa sang đa số. Cùng lý do đó, `sn55.8:3.4`
      của lát này cũng đã sửa cho khớp.
      **Thuật ngữ, kèm đếm:** `nāññassa samaṇassa vā brāhmaṇassa vā sutvā vadāmi` → *không
      phải nghe từ một sa-môn hay Bà-la-môn nào khác rồi mới nói* (`mn130.29.1` nguyên văn;
      `iti70.3.1` cũng vậy) · `yānīka`/`vatthuka`/`anuṭṭhita`/`paricita`/`susamāraddha` → *lấy
      làm phương tiện / làm chỗ nương tựa / giữ gìn / tích tụ / chuyên sắc thực hành*
      (`dn34.1.7.39`) · `āḍīnava` → *tai họa* (`an5.241:1.1`) · `majāmatta` → *đại thần*
      (`sn42.10:1.2`, `mn77.9.14`) · `nahāna` (giữ nguyên Hán–Việt *tắm*; Sujato *bathe*).
      **0 tiền lệ, đặt mới:** `bhaṇe` → *bạn* (`bhaṇa` = chàng trai, lời xưng hô thân mật với
      người nhỏ tuổi; 0 tiền lệ cho dạng gọi này, khác `musāvādaṁ bhaṇeyya` = *nói dối*) ·
      `āyuna/vaṇṇa/sukha/yasa/ādhipateyya` cùng `saṁyutto` → *được ban cho tuổi thọ / sắc đẹp /
      hạnh phúc / danh tiếng / quyền làm chủ tể* (mỗi cụm 0 tiền lệ cho dạng `saṁyutto` này;
      `dn30.2.28.4` dùng *bằng tuổi thọ trời, bằng sắc trời, bằng lạc trời, bằng danh tiếng trời*
      cho `dibbenā āyunā …` — khác cấu trúc dative, nên tôi đặt mới).
      **⚠ Năm khoá `5.1`–`5.5` là THƠ `uddāna`**, không phải mô tả; tôi dịch thành thơ và giữ
      tên Pāli, đối chiếu các bài anh em đã publish: `Mahānāma` = `sn55.21`/`sn55.22`,
      `Kāḷigodhā` = `sn55.39` (*Kinh Bà Kāḷigodhā*), `Anāthapiṇḍika` = `sn55.28`/`sn55.29`,
      `Verabhaya` = `sn55.37`, `Nandaka` = chính bài này. `4.7` (`Saraṇānivaggo tatiyo`) → *Phẩm
      Quy Y là phẩm thứ ba.*
      **Tầng Anh 93.75%** (15/16 segment có nội dung) — vẫn **trên** ngưỡng 0.8 khai ở
      `source/layers.yaml`, nên **không** cần ghi vào `content/meta/reference-gaps.yaml`.
      Segment trống: `2.4` (`itipi so bhagavā …pe… satthā devamanussānaṁ…`) — đây chính là
      khoá tôi dùng lại **nguyên văn** của `sn55.11:2.4`, nên Pāli vẫn đứng vững; `triangulation`
      9.0 vì thế.
      **Không đối chiếu được tầng Việt hiện hành** (bilara ở commit đã ghim chỉ có Pháp Cú cho
      tiếng Việt).
      **technical_integrity = 9.6** vì bốn cổng kỹ thuật do coordinator chạy, tôi không được chạy (`npm run validate|test|check|build` bị cấm trong lát này): (1) `npm run validate` (qua `npm run build`) — kiểm metadata, scorecard, `blocking_errors` và nội dung; (2) `npm test` — unit tests; (3) `npm run check`; (4) `npm run build`. Ngoài ra `npm run reference:gaps:check` phải xanh sau khi chạy lại `npm run reference:gaps`.
