notes: |-
  **ĐỌC TOÀN BỘ PĀLI 44 KHOÁ TRƯỚC KHI VIẾT**, in lại từng cặp Pāli↔Việt sau khi ghi.

  **COVERAGE TẦNG ANH 39/39 = 1.00** trên Pāli có nội dung ⇒ `published` được phép.

  **KHÔNG CÓ KHOÁ PĦI TRÙNG NGUYÊN VĂN** với bài đã dịch (0/39 trong số 148 khoá ≥ 25 ký
  tự của lát rơi vào `sn41.8`), nên bài này dịch mới từ Pāli.

  **TÊN BÀI.** `Nigaṇṭhanāṭaputtasutta` → *Kinh Với Người Đạo Hành Họ Nāṭa*, theo khuôn
  *Kinh Với <tên>* đã có (`sn41.2`, `41.5`, `41.7`, `41.9`).

  **`avitakko avicāro samādhi` → «định không tầm không tứ».** Tiền lệ **đúng** ở `dn34:1.4.7`:
  *savitakko savicāro samādhi, avitakko vicāramatto samādhi, avitakko avicāro samādhi* →
  *định có tầm có tứ, định không tầm chỉ còn tứ, định không tầm không tứ*. Tôi dùng lại đúng
  cụm đó cho cả ba nơi (`:1.6` `:2.2` `:3.9`) để ba vế nói một cách; Sujato diễn giải dài
  (*a state of immersion without placing the mind and keeping it connected*) nhưng là lời
  giải thích, không phải thuật ngữ.

  **TÓM LƯỢC MƯỜI CÂU HỎI (:5.9–:5.18).** `Eko pañho, eko uddeso, ekaṁ veyyākaraṇaṁ.`
  → *Một câu hỏi, một tóm tắt, một cách giải thích.*, lặp tới mười. `veyyākaraṇa` có tiền lệ
  *lời giải đáp* / *câu trả lời* trong tầng `dn` (`dn11:85.17`), nhưng ở đây nó là **thành phần
  đồng ba** với `pañha` và `uddeso`, nên *cách giải thích* giữ được cả ba vế đồng dạng. Vế
  `veyyākaraṇānī` ở `:5.18` là số nhiều (10) — tôi dịch *mười cách giải thích* cho khớp
  số, không phải *mười cách* như bản nháp đầu.

  **⚠ BẤT ĐỊNH LỚN NHẤT CỦA BÀI NÀY — `:5.19`.** Pāli đã ghim đọc
  `ime dasa sahadhammike pañhe āpucchitvā uṭṭhāyāsanā pakkāmīti`, tức **“đã hỏi … rồi đi
  về”**. Đọc đó làm ngược lời kinh: `:5.8` vừa mời người đạo hành *“phản biện lại tôi
  cùng đám đông đạo hành”* (`saddhiṁ nigaṇṭhaparisāya`) thì không thể đã hỏi rồi đi; Sujato
  đọc *“left **without** asking”*; và Tạng Bộ Cưu Tứ (Cuṇḍaparibbāna) đọc
  `na abhijaññatthāya … pañhā pucchitvā … pakkāmi`. Tôi kết luận dạng ghi của tệp Pāli đã ghim
  thiếu tiền tố phủ định `an-` và **dịch theo ý định là “không hỏi”** (`mà không hỏi …`).
  Đây là bất định **có ảnh hưởng nghĩa**, nhưng đã phân xử được và ghi đầy đủ ở đây nên
  chưa đến mức blocking error; nếu coordinator muốn bám sát chữ, sửa `:5.19` thành *“đã hỏi
  … rồi đi về”* và hạ `ambiguity_integrity` thêm.

  **LẶP CỐ Ý Ở `:2.4`.** Pāli lặp `yo vitakkavicāre nirodhetabbaṁ maññeyya` **hai lần**
  (câu đối xứng với hai hình ảnh: lưới bắt gió, tay bịt sông Ganges). Sujato chỉ dịch một
  lần; tôi **giữ cả hai** theo luật repetition của `skill/translation.md` §9.

  **XƯNG HÔ.** `saddahasi tvaṁ, gahapati` → *ngài có tin theo*; `saccaṁ/micchā` ở `:5.5`–
  `:5.6` → *đúng/sai*; `vitakkavicārānaṁ nirodho` → *sự chấm dứt của tầm và tứ* (xem
  `sn41.8` ở `dn34:1.4.7` ở trên).

  **NGOẶC KÉP.** Cân trên cả bài: `“` ở `:1.2` (đóng ngay), `:1.5`→`:1.6`, `:2.1`→`:2.2`,
  `:2.4`, `:3.1`→`:3.2`, `:3.3`, `:3.4`→`:3.9`, `:4.2`, `:5.1`→`:5.18`; nháy cong `‘…’`
  ở `:5.2` và `:5.4`. Khớp Pāli về số `“ ” ‘ ’` ở **mọi** khoá.

  **DẤU LƯỢC.** `:3.5` `:3.6` `:3.7` là `…pe…` → **đúng mỗi khoá một** `…`.

