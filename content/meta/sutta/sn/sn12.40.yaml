notes: |-
  Dịch từ Pāli root của commit bilara đã ghim, đối chiếu trực tiếp với bản dịch tiếng
  Anh của Bhikkhu Sujato tại cùng commit, tệp
  `sutta/sn/sn12/sn12.40_translation-en-sujato.json` — tra `source/upstream-manifest.json`,
  tệp có mặt và **32/32 khoá có chữ**, trong đó **13/13 khoá Pāli có nội dung** (đo
  bằng đúng công thức `src/lib/canon/reference.ts`: Pāli ≥ 40 ký tự sau nén khoảng
  trắng, bỏ khối tham chiếu `:0`) ⇒ **coverage = 1,0000**, trên ngưỡng 0,8. Tầng Việt
  hiện hành (Hòa thượng Thích Minh Châu) không có ở bài này — bilara tại commit đã
  ghim chỉ phân phối Pháp Cú cho tiếng Việt; đây là giới hạn của bản chụp upstream.
  
  **DÙNG LẠI NGUYÊN VĂN, đo được 12/32 khoá.** Sáu khoá lặp nguyên văn **trong chính
  bài** (`2.2` = `1.3`, `2.3` = `1.4`, `2.4` = `1.5`, `2.5` = `1.6`, `2.6` = `1.7`,
  `2.7` = `1.8`) — dùng lại nguyên văn của chính khoá trước để bài không tự mâu thuẫn.
  Sáu khoá còn lại dùng lại từ bài khác:
  · `0.2` `4. Kaḷārakhattiyavagga` trùng nguyên văn ở **9** khoá → *4. Phẩm Kaḷāra*
    (**5** khoá cùng cách; `sn12.38:0.2`, `sn12.39:0.2` là bài anh em đã `published`).
  · `1.1` trùng **160** khoá → *Trú ở Sāvatthī.* (**84**).
  · `1.3` = `2.2` trùng `sn12.38:1.3` và `sn12.39:1.3` → *Khi có sở duyên thì có chỗ an
    lập cho thức.* (**4** khoá).
  · `3.1` trùng `sn12.38:3.1` và `sn12.39:3.1` → *Nhưng khi nào, này các tỳ-kheo, người
    ta không suy tư, không hoạch định, và cũng không còn ngủ ngầm, điều ấy không trở thành
    sở duyên cho sự an trú của thức.* (**2** khoá).
  · `3.2` trùng `sn12.38:3.2` và `sn12.39:3.2` → *Khi không có sở duyên thì không có chỗ
    an lập cho thức.* (**2**).
  · `3.4`, `3.5` trùng `mn144:11.6`, `mn144:11.7` (và `sn35.87`, `ud8.4` cùng Pāli) →
    *không có khuynh hướng thì không có đi đến đi lùi;* và *không có đi đến đi lùi thì
    không có chết đi sinh lại;*. Tôi giữ nguyên văn `mn144` **kể cả chữ thường đầu câu**,
    vì Pāli cũng viết thường và đó là bản `published`.
  
  **Thuật ngữ, kèm số đếm toàn tầng:** `nati` → *khuynh hướng* (**124** khoá) — `nati`
  **không có** tiền lệ nào trong bài nào khác ở dạng khẳng định (chỉ `mn144:11.5` dịch
  *có sự lắng tịnh thì không có khuynh hướng* theo nghĩa phủ định), nên `1.4`, `2.3`,
  `3.3` tôi dịch mới theo đúng cụm đó; `āgatigati` → *đi đến đi lùi* (**2**) hoặc *đến
  và đi* (**5**); `cutūpapāto` → *chết đi sinh lại* (**2**) hoặc *tử và sinh* (**2**). Vì
  `3.4`/`3.5` phải khớp nguyên văn `mn144`, tôi dùng *đi đến đi lùi* và *chết đi sinh
  lại* cho cả `1.5`, `1.6`, `2.4`, `2.5` — hai cặp này trong tầng đều chỉ có 2–5 khoá,
  nên số đếm không đủ phân định, còn tính cân nhất quán trong bài thì có. `ārammaṇa` →
  *sở duyên* (**23**); `patiṭṭhā` → *chỗ an lập*; `virūḷha` → *tăng trưởng*;
  `ceteti / pakappeti / anuseti` → *suy tư / hoạch định / ngủ ngầm* — `hoạch định` và
  `ngủ ngầm` chỉ có **6** khoá mỗi cụm và **đều nằm ở `sn12.38`/`sn12.39`**, tức là bài
  anh em cùng phẩm đã `published`, nên tôi giữ nguyên cho nhất quán và ghi rõ ở đây.
  `sokaparidevadukkhadomanassupāyāsā` → *sầu, bi, khổ, ưu, não*.
  
  **Tên bài và tên phẩm, cùng số đếm:** `0.3` `Tatiyacetanāsutta` → *Kinh Tư Tâm Thứ
  Ba*, theo đúng cặp đã có: `sn12.38:0.3` `Cetanāsutta` = *Kinh Tư Tâm*,
  `sn12.39:0.3` `Dutiyacetanāsutta` = *Kinh Tư Tâm Thứ Hai* (cả hai đã `published`).
  `3.9` `Kaḷārakhattiyavaggo catuttho.` → *Phẩm Kaḷāra, thứ tư.*: trên toàn tầng có
  **151** khoá dạng này, đo được **80** khoá dùng dạng *Phẩm X, thứ N.* và **18** khoá
  dùng *Phẩm X là phẩm thứ N*; trong chính `sn` đã có *Phẩm Mười Lực, thứ ba.*
  (`sn12.30`), *Phẩm Khổ, thứ sáu.* (`sn12.60`) — tôi theo đa số đo được.
  
  **Bất định đã ghi, không che — uddāna `4.0`–`4.4`.** `Tassuddānaṁ` → *Tóm lược:* (**377**
  khoá có dấu hai chấm, **21** không có; `sn12.50:6.0` và `sn12.60:7.0` đều có dấu hai
  chấm). Bốn câu kệ liệt kê đúng mười bài của phẩm: `sn12.31` Bhūta, `sn12.32` Kaḷāra,
  `sn12.33` + `sn12.34` hai ñāṇavatthu, `sn12.35` + `sn12.36` hai avijjāpaccaya,
  `sn12.37` Natumha, `sn12.38`–`sn12.40` ba bài cetanā. Trong đó **năm bài đã có tên**:
  `sn12.34` *Kinh Nền Tảng Của Trí (Hai)*, `sn12.36` *Kinh Vô Minh Là Điều Kiện (Hai)*,
  `sn12.37` *Kinh Không Phải Của Các Ông*, `sn12.38` *Kinh Tư Tâm*, `sn12.39` *Kinh Tư
  Tâm Thứ Hai* — tôi dùng lại đúng các tên ấy. **Còn `sn12.31` `Bhūtasutta`, `sn12.32`
  `Kaḷārasutta`, `sn12.33` `Ñāṇavatthusutta`, `sn12.35` `Avijjāpaccayasutta` đều chưa
  được dịch ở bất kỳ đâu trong tầng, nên 0 tiền lệ.** `4.1` `Bhūtamidaṁ kaḷārañca` tôi
  dịch *Bài Sự Tồn Tại này và bài Kaḷāra,* — đây là chỗ **ít tin cậy nhất của bài**:
  `bhūta` trong tầng chủ yếu được dịch *thật* trong công thức `bhūtaṁ tacchaṁ tathaṁ`
  (đếm được, xem `mn58:8.2`), chứ không phải *Sự Tồn Tại*; tôi chọn *Sự Tồn Tại* vì
  `sn12.31` nói về câu hỏi của A-jita "cái gì là bhūta, cái gì là sự từ bỏ", và **không
  thêm** lời giải thích nào vào thân kệ. Đề nghị người biên tập đổi tên bài `sn12.31`
  cho khớp khi lát dịch tới nó. `4.2` `duve ca ñāṇavatthūni` → *cùng hai bài về nền tảng
  của trí;* dựa trên `sn12.34:0.3` đã có, còn `ñāṇavatthu` đúng là "nền tảng của trí".
  
  **Dấu lược:** bài này Pāli không có `…` nào, nên bản Việt không có `…` nào — không thêm
  dấu lược và không bỏ. Không có `(…)` đứng một mình. Ngoặc kép cân trên cả bài: mở ở
  `1.2`, đóng ở `3.7`.
  
  **technical_integrity = 9,6** vì bốn cổng kỹ thuật do coordinator chạy, tôi không được
  chạy (`npm run validate|test|check|build` bị cấm trong lát này): (1) `npm run validate`
  (qua `npm run build`); (2) `npm test`; (3) `npm run check`; (4) `npm run build`. Ngoài
  ra `npm run reference:gaps:check` phải xanh. Tôi tự xác minh được: JSON hợp lệ, đủ 32
  khoá và `set(khoá Việt) == set(khoá Pāli)`, không orphan, không rỗng, mọi giá trị NFC,
  dấu lược khớp từng khoá, ngoặc kép cân, không có Pāli lọt vào bản Việt, YAML parse sạch.