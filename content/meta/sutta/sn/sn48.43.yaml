notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở commit 11c9d708. Không có bản Việt tham khảo: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên tầng `vietnamese-current` không phủ bài này và triangulation chỉ dựa trên Pāli + Sujato.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  0.2 `Jarāvagga` chọn 5. Phẩm Già theo đa số đếm được (sn48.41, sn48.45, sn48.46 ba phiếu) và bỏ 5. Phẩm Lão Hóa của sn48.44 (một phiếu); cả hai đều là cách dịch của jarā, ghi ở đây để người biên tập thống nhất với sn48.44.
  1.1 dùng lại nguyên văn an10.1 và an10.18. 1.2 dùng lại nguyên văn sn2.18:1.2 (Sāketa, rừng Añjana, vườn nai Migadāya). 2.1 dùng lại nguyên văn an11.19:2.2 cho cả câu Bhagavaṁmūlakā … paṭibhātu attho. 6.9 dùng lại khuôn của sn48.20:1.5 cho câu về năm căn, cạn lậu, giải thoát tâm và giải thoát tuệ.
  `pañca balāni` dịch là năm sức mạnh theo nguyên văn sn45.155:1.3; `saddhābala` và các bala kia dịch theo an4.163 (sức mạnh của niềm tin, của tinh tấn, của niệm, của định, của tuệ). Đếm được: sức mạnh của niềm tin 15 lần, của tinh tấn 26, của niệm 15, của định 16, của tuệ 33, so với 7 lần cho dạng tín lực của sn50.
  0 tiền lệ cho công thức saddhindriyaṁ taṁ saddhābalaṁ: 0 cặp Pāli trùng nguyên văn. Đặt mới theo cấu trúc song chiếu của Pāli (căn ấy chính là sức mạnh ấy, và ngược lại), giữ nguyên nghĩa hai chiều.
  0 tiền lệ cho ẩn dụ dòng sông và cù lau. Bất định đã ghi rõ: purimante và pacchimante là hướng đông và hướng tây, uttarante và dakkhiṇante là hướng bắc và hướng nam; bản Việt dùng phía trước, phía sau, phía bên trên, phía bên dưới để không gán phương hướng vô lý khi dòng sông đã được nói là chảy về hướng đông ở 4.7. Người đọc muốn phương hướng thì suy ra ngay từ 4.7.
  dīpo dịch là cù lau (đảo nổi giữa dòng sông); sototveva và sotānitveva dịch là được tính là chỉ có một dòng nước và được tính là có hai dòng nước, giữ đúng vì nói về cách đếm chứ không phải nói dòng sông thật sự chia đôi.
  Dấu lược: 2.1 có một …, khớp Pāli; đây là …pe… lược sự thốt nhất trong các bài đã đọc và bản Việt không mở rộng.
  Coverage tầng Anh trên Pāli có nội dung (25 segment) là 25/25 = 100%. Không cần ghi nhận gap.
