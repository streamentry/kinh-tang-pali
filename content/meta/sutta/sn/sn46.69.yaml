notes: |-
  Pāli đọc trực tiếp từ snapshot đã ghim; English Sujato có ở 1.1, trống ở
  1.2 là số thứ tự tatiyaṁ, giống hệt hai bài sibling đã published
  sn46.58 và sn46.70 nên không chặn published. Tầng Việt hiện hành vắng vì
  snapshot chỉ có Pháp Cú; đây là giới hạn của bản chụp upstream.
  Giữ …pe… nguyên dạng … theo quy ước kho, không mở rộng.
  Tiền lệ đếm được: āhāra thành thức ăn có 594 đoạn, trong đó an10.238
  dịch đúng cụm āhāre paṭikūlasaññā này là niệm tưởng không sạch trong thức
  ăn; paṭikūla thành đáng ghê tởm theo cụm quán điều đáng ghê tởm đã ổn
  định; Pāli 1.1 không có bhāvitā nên không thêm đã được tu tập;
  1.2 Thứ ba. có 212 đoạn.
  Thân kinh giữ cấu trúc Pāli là sự đáng ghê tởm của thức ăn thay vì mượn
  nguyên dạng không sạch của an10.238, vì an10.238 dùng niệm tưởng còn
  chương này đã chốt niềm tưởng; tiêu đề rút gọn tương ứng; ghi ở đây để
  người biên tập chọn một nếu muốn thống nhất hai chỗ.
