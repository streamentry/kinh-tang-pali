notes: |-
  Đợt 18, lát n188. Dịch từ Pāli root commit 11c9d708, đối chiếu English Sujato đã ghim.

  **Coverage Anh trên Pāli có nội dung: 51/51 = 100%** — trên sàn 0.8, không có gap.

  **Năm ví dụ nước về năm triền cái và bảy giác chi:**
  - 5 triền cái: tham dục (pha phẩm màu), sân hận (nước sôi), hôn trầm thụy miên (rong rêu bèo phủ), trạo cử hối quá (gió quấy động, cuộn sóng), hoài nghi (vẩn đục trong bóng tối).
  - Thuật ngữ đối chiếu sn46.56 (cùng phẩm Sākacchavagga) và các bài Saṅgārava tương đồng (an5.193).
  - Cân bằng dấu lược: 17 khoá có dấu lược đều khớp chính xác từng dấu lược so với Pāli (gồm cả các khoá có 2 dấu lược như 4.3, 11.1, 15.1, 16.3, 17.1, 18.3, 19.1, 20.3).

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.2, 1.3 — «Đức Thế Tôn … nói lời chào đón» → «Đức Phật; đến nơi, chào hỏi Đức Phật» (`sammodi`: 4 trong 6 khoá trùng); 1.3 «những lời chào đón và thăm hỏi thân tình» → «những lời chào hỏi thân thiện, đáng ghi nhớ» (bổ sung `sāraṇīya` bị sót; dùng đúng cách ở `an3.60:1.2`). Giữ viết hoa «Bà-la-môn» theo cách viết của cả bài (không theo chữ thường của nhóm đa số) và «bạch Đức Thế Tôn» ở 24.1.
