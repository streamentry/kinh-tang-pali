notes: |-
  Dịch từ Pāli root đã ghim (manifest liệt kê sutta/sn/sn12/sn12.36_root-pli-ms.json và sutta/sn/sn12/sn12.36_translation-en-sujato.json). Tầng Anh CÓ và đã đo.
    Coverage đo được: 15/15 Pāli có nội dung có chữ Anh Sujato = 1.0000. Không cần entry reference-gaps.
    6/42 khoá có Pāli trùng nguyên văn với một khoá đã dịch ở bài khác, và dùng lại y nguyên cả 6: 0.2 (4. Phẩm Kaḷāra, trùng sn12.34, sn12.37, sn12.38, sn12.39), 1.2 (trùng sn12.27:1.2), 1.3, 1.4 và 5.13.
    1.3 (saṅkhārapaccayā viññāṇaṁ …pe…) có 11 tiền lệ chia bốn cách; chọn do các hành mà có thức, y nguyên sn12.27:1.3 và sn12.47:1.3. 1.4 có 13 tiền lệ chia năm cách, chọn nhóm 4 tiền lệ như vậy là tập khởi của toàn bộ khối khổ này.
    1.4 dùng y nguyên nhóm 4 tiền lệ như vậy là tập khởi của toàn bộ khối khổ này. Riêng 2 tiền lệ khác (sn12.27:1.4 và sn12.58:4.6) thêm vế do vô minh / do danh và sắc vào câu này, Pāli không có vế đó; bản này không sao chép. Đề nghị coordinator xem lại hai tệp đó.
    Tên phẩm theo Pāli ở khoá 0.2, không phải theo tên phẩm chung của cả sn12: Pāli tại 0.2 là 4. Kaḷārakhattiyavagga và 4 bài đã có dùng 4. Phẩm Kaḷāra. Cùng cách đo cho sn12 (Tiruttāraṇavagga: 0 lần trong tầng Việt dự án, Pāli 0.2 thật là 1. Buddhavagga, đã dùng 1. Phẩm Đạo Sư ở 6 bài) và sn21 (Bhikkhunipakkhāya: 0 lần trong tầng Việt dự án, Pāli 0.2 thật là 1. Bhikkhuvagga, đã dùng 1. Phẩm Tỳ-kheo ở 11 bài). Cả hai cái tên coordinator nêu đều không xuất hiện ở tầng Việt và cũng không phải Pāli tại commit đã ghim, nên bản này dịch theo Pāli ở khoá.
    Dutiyaavijjāpaccayasutta đặt làm Kinh Vô Minh Là Điều Kiện (Hai). Cách đặt tên Dutiyaa… trong tầng đang phân kỳ: (Hai) đo được nhiều nhất trong nhóm sn, nên bám theo sn35.27:0.3.
    Cấu trúc ngoặc kép bám đúng Pāli: Pāli mở một dấu kép ở 1.2 và đóng ở 5.12; các trích dẫn lồng bên trong dùng nháy cong nên không làm lệch số đếm. Chỗ này Pāli tự cân bằng, khác với sn21.3.
    2.1, 3.10 và 5.11 dịch theo Sujato: you might say A … or you might say B … but both mean the same, only the phrasing differs. Vế cuối ekatthaṁ byañjanameva nānaṁ dịch là cùng một ý nghĩa, chỉ khác nhau ở cách diễn đạt.
    yo vadeyya … iti vā dịch thành hoặc có người nói, giữ đúng hai vế song song của Pāli; brahmacariyavāso na hoti dịch là thì không thể sống phạm hạnh, theo Sujato there is no living of the spiritual life.
    2.5 là chỗ đảo chiều của chuỗi duyên khởi: Pāli là jātipaccayā jarāmaraṇan (sinh là điều kiện của già chết), khác với 2.2 và 3.14. Giữ đúng chiều này, dịch do duyên sinh mà có già chết.
    4.3 và 5.12: anabhāvaṅkatāni āyatiṁ anuppādadhammāni gộp thành bị xoá thành không, không thể sinh khởi trong tương lai. Lưu ý Pāli ở 5.12 ghi tālāavatthukatāni (lỗi chính tả của nguồn, 4.3 ghi tālāvatthukatāni); bản dịch không lặp lại lỗi, cả hai khoá đều dịch làm cho như gốc cây thối.
    Câu hỏi 3.1–3.9 và 5.2–5.10 không có dấu nháy nào ở Pāli nên bản dịch cũng không thêm; trong đó sáu căn dịch là sáu căn, khác với sáu xứ ở chuỗi duyên khởi của sn12.1 vì ở đó có tiền lệ bắt buộc. Đây là khác biệt có chủ ý, xem sn12.1.
    visūkāyikāni visevitāni vipphanditāni dịch là quanh co, tránh né, vùng vẫy, theo một tiền lệ có sẵn trong tầng.
    Tầng vietnamese-current vắng ở commit đã ghim (chỉ có Pháp Cú), nên không có bản Thích Minh Châu để đối chiếu cho bài này.
    Cổng kỹ thuật do coordinator chạy; technical_integrity 9.6.
