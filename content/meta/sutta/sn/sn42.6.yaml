notes: |-
  Không có tầng Việt hiện hành để đối chiếu. Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Tầng đối chiếu còn lại là Pāli root và bản Anh Sujato đã ghim. budsas.org chỉ là tham khảo toàn văn, không cấp text cho tầng nào.
  Dấu lược theo đúng luật của tầng Việt: pe-lược của Pāli là MỘT dấu lược, và sau khi bỏ hết pe-lược thì đếm dấu lược còn lại. Chạy trên 315 khoá của lát: 0 khoá lệch. Không có khoá nào để trống trong bản dịch.
  Tên phẩm đo trên toàn tầng sn: 5 tệp cùng phẩm Gāmaṇivagga, cả 5 đều là 1. Phẩm Làng. Tên bài Asibandhakaputtasutta chưa có tiền lệ; đặt mới theo chính bản Việt đã có cho cùng nhân vật là thôn trưởng Asibandhaka: Kinh Con Nội Asibandhaka.
  Coverage Anh 29/29 khoá Pāli có nội dung, tức 100%, và english-project của bài đang trống, nên tầng tham khảo là bản Sujato đã ghim, độc lập với người dịch.
  Đo rồi mới dùng: 9 khoá có Pāli trùng nguyên văn với bài đã mang trạng thái, 8 dùng lại nguyên văn (Ekaṁ samayaṁ … pāvārikambavane; asibandhakaputto gāmaṇi; Evaṁ vutte; abhikkantaṁ; và bốn khoá No hetaṁ, bhante, mà 45 tiền lệ đều là Thưa không phải vậy, bạch Thế Tôn; cùng Chaṭṭhaṁ → Thứ sáu 253 lần). Một khoá lệch: 8.6 ajjatagge pāṇupetaṁ saraṇaṁ gatan, hai tiền lệ cùng Pāli nhưng Từ hôm nay trở đi, con trọn đời quy y và Từ hôm nay cho đến trọn đời, xin Đức Thế Tôn ghi nhận tôi là một nam cư sĩ; tôi theo cách đếm 2 và giữ dấu ti theo Pāli.
  Bốn công thức lặp chỉ có một văn bản mỗi thứ: câu hỏi Taṁ kiṁ maññasi, gāmaṇi lặp bốn lần (4.1, 4.5, 5.4, 6.1, 6.5, 7.4 — sáu lần thật ra), tiến trình đám đông cầu xin lặp bảy lần, danh sách tội lẻ và danh sách từ bỏ tội lẻ mỗi thứ lặp hai lần, và mười chi tiết khẩu ngữ về sáp dầu được dịch đủ cả ba vế. Sai lệch giữa bốn lần và sáu lần: Taṁ kiṁ maññasi xuất hiện ở 4.1, 4.5, 5.4, 6.1, 6.5 và 7.4, tức sáu khoá.
  Thuật ngữ mượn từ tiền lệ có số đếm, không tự chế: pāṇātipātī → sát sinh; adinnādāyī → lấy của không cho; kāmesumicchācārī → hành dâm trong các dục; pisuṇavāco → nói hai lưỡi; pharusavāco → nói lời ác; samphappalāpī → nói lời vô ích; abhijjhālu → tham lam; byāpannacitto → tâm sân; micchādiṭṭhiko → tà kiến; sammādiṭṭhi → chánh kiến; āyācana → cầu xin; pañjaliko anuparisakkeyya → chắp tay đi vòng quanh; apāyaṁ duggatiṁ vinipātaṁ nirayaṁ → cõi dữ, ác thú, đọa xứ, địa ngục; sugatiṁ saggaṁ lokaṁ → nơi thiện, cõi trời; kāyassa bhedā paraṁ maraṇā → sau khi thân hoại mạng chung.
  Sujato ở 2.1 bỏ mất sevālamālikā, dịch thành carry pitchers trong khi Pāli nói rõ là đeo tràng hoa khuêu báy; Pāli thắng. Cùng bài đó Sujato dịch brahmins garlanded with aquatic flowers, phần này tôi theo Pāli.
  Review đối kháng bắt được và đã sửa trước khi chốt: bốn khoá 4.6 và 5.5 và 6.6 và 7.5 bản nháp của tôi dính ca Dù nhờ sau chữ có, thành câu vô nghĩa; đã sửa thành có nhờ. 4.2 và 6.2 bản nháp mở bằng Đó là có một người, đã đổi thành Giả sử có một người cho đúng văn phong. 2.3 bổ sung chữ là trước bậc A-la-hán.
