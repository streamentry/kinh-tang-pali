notes: |-
  Đợt 19, lát l35. Dịch từ Pāli root commit 11c9d708, đối chiếu English Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (Bình Anson hiệu đính) ở mục tra cứu toàn văn. **107 khoá** (0.1–0.3, 1.1–1.5, 2.1–2.2, 3.1–3.6, 4.1–4.4, 5.1–5.4, 6.1–6.4, 7.1–7.3, 8.1–8.5, 9.1–9.4, 10.1–10.4, 11.1–11.5, 12.1–12.2, 13.1–13.6, 14.1–14.5, 15.1–15.4, 16.1–16.4, 17.1–17.3, 18.1–18.6, 19.1–19.5, 20.1–20.5, 21.1–21.18), đúng bằng tập khoá Pāli, đúng thứ tự Pāli, không khoá nào ngoài tập đó.

  **Coverage Anh trên Pāli có nội dung: 61/73 = 83,6% (≥ ngưỡng 0,80).** Mẫu số 73 là khoá Pāli ≥ 40 ký tự, bỏ khối :0. Sujato để trống 12 khoá có nội dung (13.2–13.6, 14.1, 14.2, 14.5, 15.1, 15.4, 16.1, 16.4): trong đoạn Đức Phật thuật lại, Sujato chỉ chèn một ghi chú trong ngoặc ở 13.1 (*the wanderers asked the Buddha the very same questions…*) rồi bỏ trống phần còn lại. Khoá 13.1 được cổng tính là có English dù đó là câu tóm tắt chứ không phải bản dịch của Pāli; nếu loại 13.1 thì còn 60/73 = 82,2%, vẫn trên ngưỡng. Lớp english-project không có tệp cho bài này nên không góp gì vào số đo: con số trên đều là Sujato độc lập. Tầng vietnamese-current vắng (bilara tại commit đã ghim chỉ có Pháp Cú); bản Hòa thượng Thích Minh Châu chỉ được đọc ở dạng nguyên bài, không căn lề theo khoá. 12 khoá Sujato bỏ trống là lặp nguyên văn hoặc gần nguyên văn các khoá đã có English (13.2–13.5 ≈ 3.2–3.5 đổi ngôi; 13.6 ≈ 3.6; 14.2 ≈ 4.1; 14.5 ≈ 8.5; 15.1/15.4 = 5.1/5.4; 16.1/16.4 = 6.1/6.4), nên được đối chiếu qua các khoá song song đó chứ không có English riêng; vì vậy `triangulation` đặt 9,1 chứ không cao hơn. Không có entry nào trong reference-gaps cho bài này và cũng không cần vì coverage đạt ngưỡng.

  **Pāli trùng nguyên văn trong chính bài: 10 nhóm trùng** (4.2 = 8.3 = 14.3; 4.3 = 8.4 = 14.4; 5.1 = 15.1; 6.1 = 16.1; 9.2 = 10.2 = 15.2 = 16.2; 9.3 = 10.3 = 15.3 = 16.3; 9.4 = 15.4; 18.4 = 19.3 = 20.3 = 21.7; 18.6 = 19.5 = 20.5; 19.1 = 20.1), 0 nhóm có bản Việt khác nhau. Dò tầng: Pāli trùng nguyên văn với khoá ở bài khác ở 0.2 (8/9 cùng *3. Phẩm Mười Lực*), 1.1 (3/3 *Trú ở Rājagaha, tại Rừng Trúc.*), 4.2/8.3/14.3 (*Do duyên gì?*), 4.3/8.4/14.4 (*Do duyên xúc.*), 9.2–10.3/15.2–16.3 (*Những ai …* / *những ai …*, 4 so với 2 *đối với những vị …*), 18.4/19.3/20.3/21.7 và 21.17 (nguyên văn tầng), 21.13–21.15 (dạng *do … diệt nên …* theo `sn12.12:7.x`), 21.18 (*Thứ tư.* 49 so với 72 *Thứ bốn*; trong riêng `sn12` là 5/5 *Thứ tư.*). Dùng lại nguyên văn tiền lệ cho các khoá trên.

  **Thuật ngữ và tiền lệ đã đếm:**
  - `kammavādā` → *chủ trương nghiệp quả* (12/12 khoá trong tầng, cùng công thức với `sn12.25`). `aññatitthiya paribbājaka` → *du sĩ ngoại đạo* (47 so với 18 *du sĩ thuộc giáo phái khác*, trong 84 khoá có *du sĩ*). `ārāma` của du sĩ → *tu viện* (tiền lệ `sn46.52`, `sn46.54`). Tên bài `Aññatitthiyasutta` → *Kinh Ngoại Đạo* (0 tiền lệ cho tên này; theo tên của Hòa thượng Thích Minh Châu *Ngoại Đạo* và khuôn *Kinh …* của tầng; Sujato *Followers of Other Religions*).
  - `sayaṅkataṁ / paraṅkataṁ / adhiccasamuppannaṁ dukkhaṁ` → *khổ do tự mình làm ra / do người khác làm ra / không do tự mình … không do người khác … ngẫu nhiên sinh khởi* (khuôn `sn12.25:2.x`, đổi *lạc khổ* thành *khổ* vì Pāli bài này chỉ có `dukkhaṁ`, khác `sn12.25` có `sukhadukkhaṁ`). `paṭiccasamuppannaṁ` → *do duyên khởi sinh* (như `sn12.25:3.1`). `phassapaccayā` → *do duyên xúc*.
  - Công thức `vuttavādī … abhūtena abbhācikkheyya … dhammassa cānudhammaṁ byākareyya … sahadhammiko vādānupāto gārayhaṁ ṭhānaṁ` → *nói đúng lời … không xuyên tạc … với điều không thật, giải thích đúng giáo pháp, và không có lập luận hợp pháp nào đưa đến chỗ bị khiển trách*. Tầng có hai dạng cho `sahadhammiko vādānupāto`: *lời nói thuận pháp* (`sn12.25:2.6`, `3.4`, `7.5`) và *lập luận hợp pháp / đồng đạo* (`sn22.86:3.3`, `sn45.5:2.5`, `sn35.81`); chọn *lập luận hợp pháp* vì đúng hơn với `vādānupāto` (hệ quả của một luận điểm), phù hợp Sujato (*legitimate grounds for rebuttal and criticism*). Hệ quả: bài này khác `sn12.25` (cùng công thức) ở chỗ này; chưa thống nhất toàn tầng.
  - `kiṁnidānaṁ kiṁsamudayaṁ kiṁjātikaṁ kiṁpabhavaṁ` → *lấy gì làm nhân, làm nguồn sinh, làm chỗ phát sinh và làm nguồn gốc* (`sn12.11:2.9`, `sn12.51:3.3`). `jāti` → *sinh*, `bhava` → *hữu*, `upādāna` → *thủ*, `taṇhā` → *ái*, `vedanā` → *thọ*, `phassa` → *xúc*, `saḷāyatana` → *sáu xứ*, `jarāmaraṇa` → *già chết* (trong câu hỏi) và *già-chết* (trong chuỗi diệt, theo `sn12.12:7.7`). `dukkhakkhandha` → *khối khổ đau* (4 so với 3 *khối khổ* trong `sn12`).
  - Chuỗi diệt `Channaṁ tveva … phassāyatanānaṁ asesavirāganirodhā` → theo `sn12.12:7.1–7.7`: *do sáu xúc xứ hoàn toàn ly tham và đoạn diệt không còn dư tàn nên xúc diệt; do xúc diệt nên thọ diệt; …* (3 bài `sn12.12`, `sn12.53`, `sn12.60` dùng *do … diệt nên …* so với 8 khoá dạng *diệt tận mà … diệt tận* ở `sn12.1` v.v.; chọn dạng gần nhất cùng phẩm).
  - `Acchariyaṁ bhante, abbhutaṁ bhante` → *Vi diệu thay, bạch Thế Tôn! Hy hữu thay, bạch Thế Tôn!* (4 khoá, `sn2.23`, `sn2.26`). `Sādhu sādhu, ānanda` → *Lành thay, lành thay, này Ānanda!* (`sn12.25:7.1`, `sn22.37`). `taññevettha paṭibhātu` → *chính ông hãy làm sáng tỏ vấn đề ấy* (`sn2.1:1.5`). `Sace maṁ, bhante, evaṁ puccheyyuṁ` → *Bạch Thế Tôn, nếu có người hỏi con như vầy* và `Evaṁ puṭṭhohaṁ, bhante, evaṁ byākareyyaṁ` → *Được hỏi như vậy, bạch Thế Tôn, con sẽ trả lời như vầy / như vậy* (2/2 khoá tầng).
  - `Sammodanīyaṁ kathaṁ sāraṇīyaṁ vītisāretvā` → *trao đổi những lời thân hữu và xã giao* (45 khoá tầng, `sn7.1` v.v.). `etadahosi` → *suy nghĩ như sau* (`sn4.12`, `sn4.23`). `atippago kho tāva … piṇḍāya carituṁ` → *Còn quá sớm để đi khất thực ở …* (`sn46.52:1.3`, 4 khoá).

  **Số Pāli:** `channaṁ phassāyatanānaṁ` (21.9) = 6 → *sáu* (đúng với tên sáu xứ `saḷāyatana`); `ekena padena` (17.2) = 1 → *một câu*. `Catutthaṁ` (21.18) → *Thứ tư.* (`sn12.24` là bài thứ tư của `Dasabalavagga`; 5/5 khoá cùng dạng trong `sn12`). Không có số đếm lớn nào khác.

  **Dấu câu và dấu lược (đo từng khoá):** nháy kép `“` mở ở 1.4 và `”` đóng ở 1.5; `“` mở ở 3.1 và `”` đóng ở 3.6; `“` mở ở 4.1 và `”` đóng ở 6.4; `“` mở ở 8.1 và đóng ở `’”` 16.4; `“` ở 17.1 và `”` ở 17.3; `“` ở 18.1 và `”` ở 18.1; `“` mở ở 18.2 và `”` đóng ở 21.17. Nháy đơn `‘…’` ở 11.4–11.5; 13.1–13.6; 14.2–16.4 (khoá 14.5 Pāli kết `āgaccheyyāti.` không có nháy nên bản Việt không thêm); 18.3, 18.5, 19.2, 19.4, 20.2, 20.4, 21.6, 21.8, 21.9–21.16. Cả bốn loại nháy khớp số lượng Pāli của từng khoá: 0 lệch trên 107 khoá. Dấu lược: 11 khoá Pāli có `…pe…` (9.2, 9.3, 10.2, 10.3, 15.2, 15.3, 16.2, 16.3, 21.2, 21.3, 21.4); mỗi khoá Việt đúng một `…`, không bung văn, không có `(…)`, không khoá nào kết `….` (lược rồi mới tới chấm). Không có `…` trần.

  **Bất định đã ghi, không đưa vào thân kinh:** (a) `17.3` `Siyā nu kho, bhante, esevattho vitthārena vuccamāno gambhīro ceva assa gambhīrāvabhāso ca`: Sujato đọc như câu hỏi về một bản giải thích chi tiết (*Could there be a detailed explanation … both deep and appears deep?*), Hòa thượng Thích Minh Châu dịch như lời tuyên bố (*nghĩa này sẽ sâu thẳm và có vẻ được xem là sâu thẳm*); giữ sát Pāli: câu hỏi *có thể chăng chính nghĩa lý này, khi được nói rộng ra, sẽ vừa sâu xa vừa có vẻ sâu xa*, không thêm gì. (b) `8.1` `yathā taṁ sāriputto sammā byākaramāno byākareyya`: Sujato *just as Sāriputta has so rightly explained*, Hòa thượng Thích Minh Châu *trả lời như vậy là trả lời một cách chơn chánh*; dịch *Sāriputta đã trả lời một cách chân chánh đúng như thế*. (c) `6.x` `te vata aññatra phassā paṭisaṁvedissantīti netaṁ ṭhānaṁ vijjati`: Hòa thượng Thích Minh Châu dịch *chắc chắn có thể tự cảm thọ không cần đến xúc; sự kiện như vậy không xảy ra*, nghĩa gần như ngược với Sujato (*it’s impossible that they will experience that without contact*); theo Pāli và Sujato (*không thể có việc họ sẽ cảm thọ ngoài xúc*); `vata` (*quả thật*) không dịch riêng, như `sn12.26:5.1`. (d) `kammavādā` dịch *chủ trương nghiệp quả* theo tầng; Sujato *teach the efficacy of deeds*; Hòa thượng Thích Minh Châu *chủ trương về nghiệp*. (e) `idheva rājagahe` ở 11.1 dịch *ngay tại Rājagaha này* vì Đức Phật đang nói với Ānanda tại chính thành này; không có từ nào thêm. (f) Khoá 12.2 và 14.1 có `maṁ` / `vuttāhaṁ` (ngôi thứ nhất); Sujato bỏ trống cả 14.x nên không có đối chiếu English trực tiếp cho 14.1, 14.2, 14.5.

  **Đối chiếu:** Pāli root là chuẩn; mọi cặp Pāli ↔ Việt đã in ra đọc đối kháng từng khoá (107/107), không phát hiện cặp nào lệch nội dung. Không có Pāli lọt sang tiếng Việt ngoài tên riêng (`Saṁyutta Nikāya`, `Rājagaha`, `Sāriputta`, `Ānanda`, `Gotama`).

  **Cổng kỹ thuật:** bốn cổng của AGENTS.md là `npm run validate`, `npm test`, `npm run check` và `npm run build`. **Lát này KHÔNG chạy bốn lệnh đó** (bị cấm); CI (`.github/workflows/ci.yml`) là cổng thật còn lại nên `technical_integrity` đặt 9.6 chứ không 10. Đã tự kiểm: đủ khoá và đúng thứ tự Pāli, nháy kép/đơn khớp từng khoá, dấu lược khớp từng khoá, NFC, không khoá rỗng, không khoảng trắng thừa; `blocking_errors` rỗng; coverage Anh 61/73 vượt ngưỡng 0,80 và không cần entry gap.
