notes: |-
      **DÙNG LẠI NGUYÊN VĂN — 20 khoá Pāli trùng nguyên văn.** Nguồn chính là **`sn55.43`**
      (`Tatiyaabhisandasutta`, **cùng phẩm**, đã `published`): `0.2` = `sn55.43:0.2` ·
      `1.1` = `sn55.43:1.1` · `1.5` = `sn55.43:1.5` · `3.2` = `sn55.43:3.2` (Pāli chỉ khác ở
      dấu phẩy, cùng nghĩa) · `3.3` = `sn55.43:3.3` · `4.1` = `sn55.43:4.1` · `4.2` =
      `sn55.43:4.2` · `4.3`/`5.6` = `sn55.43:4.3` · `5.5` = `sn55.43:4.2`. Ngoài ra: `1.2` =
      `sn55.43:1.2` (*Thế nào là bốn?*) · `1.3` = `sn55.12:3.3` · `1.4` = `sn55.11:2.4` ·
      `2.1` = `sn55.43:2.1` · `2.2` = `sn55.43:2.2` · `3.1` = `sn55.12:3.7` · `4.2` như trên ·
      `6.1` = `sn1.31:16.1` · `6.2` = `sn11.3:12.4` · `7.3` = `an4.51:7.3` · `7.4` =
      `an4.51:7.4` · `8.3` = `an4.51:8.3` · `8.4` = `an4.51:8.4` · `8.5` = `sn12.21:1.16`.
      **⚠ `puññābhisandā` — HAI CÁCH ĐANG CÙNG TỒN TẠI TRONG KHO, đã ghi để người biên tập
      quyết.** Đếm Pāli↔Việt: *dòng phước chảy tràn* chiếm **đa số** (`an4.51:1.2`,
      `an4.60.5.1`, `an5.45:1.1`, `an8.39:8.1`), còn *nguồn phước báu tràn đầy* dùng ở
      `sn55.43` (4 khoá). **Tôi theo `sn55.43`** vì (a) Pāli của 8 khoá ở đây **trùng nguyên văn**
      `sn55.43`, và quy tắc kho là dùng lại nguyên văn đã có; (b) `sn55.41`/`sn55.42`/`sn55.43`
      là **ba bài anh em cùng phẩm** — nếu tôi dịch khác thì chính phẩm đó tự mâu thuẫn.
      Người biên tập xem có muốn đổi **cả ba** `sn55.41`–`sn55.43` sang *dòng phước chảy tràn*
      cho khớp đa số kho không.
      **Đã sửa sau khi đối kháng:** (1) `7.2` bản đầu tôi dùng nguyên văn `an4.51:7.2`
      (*nơi ở của những **con vật** quý báu*) — nhưng `ratanagaṇānamālaya` là **đống ngọc quý**,
      không phải con vật; đã sửa thành *là nơi ở của những đống ngọc quý báu*. (2) `2.1`/`2.2`
      bản đầu tôi dùng *nơi Chánh pháp* / *nơi Tăng đoàn*; `sn55.43:2.1`/`2.2` (cùng phẩm, cùng
      Pāli) dùng *nơi Pháp* / *nơi Tăng* — đã sửa về nguyên văn `sn55.43` để ba bài anh em
      đọc như nhau.
      **Thuật ngữ, kèm đếm:** `asaṅkhyeyyo appameyyo mahāpuññakkhandho` → *khối phước báu lớn
      lao, không thể tính đếm, không thể đo lường* (`sn55.43:4.3` nguyên văn) ·
      `udakāḷhaka` → *bình nước* (`an5.45:6.2`; `an4.51:6.1` dùng *thùng đo nước* cho cùng Pāli
      ở một câu khác — **hai cách cùng tồn tại**, tôi theo `an5.45` vì câu `sn55.41:5.2` tách
      `udakāḷhaka` thành bốn vế như `an5.45`) · `Mahodadhiṁ aparimitaṁ mahāsaraṁ` → *Biển cả to
      lớn không thể đo lường, rất rộng* (`an4.51:7.1` nguyên văn; `an5.45:7.1` dùng *Biển lớn
      mênh mông vô biên, kho tàng các báu vật* nhưng câu đó **trộn vế của `7.2` vào**, nên tôi
      theo `an4.51` cho `7.1` và tự sửa `7.2`).
      **⚠ Tầng Anh 83.33%** (15/18 segment có nội dung) — **vẫn trên** ngưỡng 0.8, nên **không**
      cần ghi vào `content/meta/reference-gaps.yaml`. Ba segment trống: `1.4`, `1.5`, `3.2` — **cả
      ba đều trùng nguyên văn** `sn55.11:2.4` / `sn55.43:1.5` / `sn55.43:3.2` đã publish, nên
      Pāli vẫn đứng vững; `triangulation` 8.7 vì thế, và **không** nâng điểm để né.
      **Không đối chiếu được tầng Việt hiện hành.**
