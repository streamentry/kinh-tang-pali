notes: |-
  Bản dịch mới từ Pāli root (snapshot SuttaCentral/Bilara đã ghim), đối chiếu bản Anh Bhikkhu Sujato và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không phân đoạn, chỉ dùng tra nghĩa, không căn lề vào segment). Bài: Kinh Sakka (Sakkasutta), bài thứ mười của Phẩm Mục-kiền-liên, Tương Ưng Mục-kiền-liên. 199/199 khoá, đúng thứ tự Pāli, không có khoá nào ngoài tập khoá Pāli.

  COVERAGE ENGLISH (đo thật): Pāli có nội dung (từ 40 ký tự, bỏ khối :0) = 194 khoá. Bản Sujato phủ 66/194 = 0,340, dưới ngưỡng 0,80 của cổng. Lớp english-project chưa có bài này, nên cổng cũng ra 0,340 và không có phần nào bù. Một ô Anh rỗng không phải là sự đồng thuận về cách dịch: ở 128 khoá ấy Pāli phải tự đứng vững, và bản Việt chỉ dựa vào Pāli, vào tiền lệ trong chính tầng này (cùng công thức ở sn55.18/19, sn55.1, sn41.10, an8.36, dn30) và vào bản Việt nguyên bài của Hòa thượng Thích Minh Châu để tra nghĩa. Vì vậy triangulation hạ xuống 7,0 và bài giữ draft kèm blocker. Tầng vietnamese-current: không có cho bài này ở mức segment (bilara đã ghim chỉ có Pháp Cú).

  DỊCH ĐỦ DÙ SUJATO BỎ TRỐNG: bài là một chuỗi lặp. Moggallāna dạy Sakka rằng quy y Phật, Pháp, Tăng; thành tựu lòng tịnh tín bất động nơi Phật, Pháp, Tăng; thành tựu các giới được bậc Thánh yêu mến, mỗi vế là nhân khiến một số chúng sinh được sinh về cõi lành. Sakka đáp lại y hệt. Cả cặp hỏi đáp ấy lặp bốn lần theo số chư thiên đi cùng (năm trăm, sáu trăm, bảy trăm, tám trăm, tám mươi ngàn), rồi lặp thêm hai lần với vế phụ `Te aññe deve dasahi ṭhānehi adhigaṇhanti` (họ còn vượt qua các vị thiên khác về mười phương diện). Dấu lược `…pe…` được giữ đúng một dấu `…` theo từng khoá Pāli; không bung nội dung bị lược thành văn.

  SỐ PĀLI (tự tính): `pañcahi devatāsatehi` = 5 × 100 = 500 (năm trăm) · `chahi … satehi` = 6 × 100 = 600 · `sattahi … satehi` = 7 × 100 = 700 · `aṭṭhahi … satehi` = 8 × 100 = 800 · `asītiyā devatāsahassehi` = 80 × 1.000 = 80.000 (tám mươi ngàn). Bản Anh Sujato cũng ghi eighty thousand. Bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn ghi `8000 chư Thiên` cho cùng cụm này: không khớp phép tính từ Pāli (`asīti` là 80, không phải 8), nên bản mới theo Pāli và Sujato; đây là điểm bản truyền thống lệch, nêu ra chứ không sửa lời kinh. Cũng trong bài: `cattāri purisayugāni aṭṭha purisapuggalā` = bốn cặp, tám hạng cá nhân (4 và 8, theo công thức đã published ở sn55.1:2.7 và sn41.10:3.8); `dasahi ṭhānehi` = mười phương diện, và danh sách đi kèm đếm đúng mười (tuổi thọ, sắc, lạc, danh tiếng, quyền uy, rồi sắc, thanh, hương, vị, xúc).

  TIỀN LỆ (đã đo, không đoán): 34 khoá của bài có Pāli trùng nguyên văn với khoá đã dịch ở nơi khác trong tầng (476 cặp, trong đó phần lớn là câu kết `Dasamaṁ.`); 23 khoá dùng lại đúng nguyên văn bản Việt có sẵn, 11 khoá không dùng lại nguyên văn: `0.3` (tiêu đề `Sakkasutta`: tiền lệ duy nhất là `Kinh Thiên Tộc Sakk` ở an10.46, rõ ràng bị cụt chữ, nên đặt `Kinh Sakka`) và 10 khoá công thức rút gọn (`13.2, 14.2, 18.2, 19.2, 22.2, 23.2, 39.2, 43.2, 52.2, 53.2`). Với mười khoá đó, tiền lệ duy nhất là an6.25/26 và an3.70, mỗi nơi một cách khác nhau, không đa số; vì vậy bản rút gọn trong bài được dựng cùng mạch với bản đầy đủ ở 9.2 và 10.2 (đã đo: công thức Pháp đầy đủ dùng `Pháp được Đức Phật thuyết giảng hay, hiện tại thấy ngay …` ở sn55.1:2.5, sn41.10:3.6, sn12.41:9.2, an5.179:4.2, 4 khoá trong bộ sn/an gần nhất), để cả bài đọc một giọng. Trong chính bài, 433 cặp khoá có Pāli trùng nguyên văn, 0 cặp bản Việt khác nhau. Cặp 1.1 dùng lại nguyên văn sn55.18:1.2 và sn55.19:1.2 (cánh tay co duỗi, Kỳ-đà Lâm, cõi Ba Mươi Ba).

  THUẬT NGỮ (đo): `aveccappasāda` → `lòng tịnh tín bất động` (39 khoá trong bộ sn, so với `tín bất động` 14 khoá và `tịnh tín bất động` 14 khoá; theo cách của sn55.18/19, cùng công thức và cùng nhân vật). `samannāgamana` → `thành tựu` (29/32 khoá toàn tầng). `sādhu kho` → `Lành thay` (theo sn55.18/19; trong các khoá sn có `sādhu kho` ở đầu câu, dạng `Lành thay` vượt trội so với `Tốt thay` 6 khoá). `saraṇagamana` → `việc quy y` (tầng chưa có tiền lệ dịch danh từ này; chọn cách quen thuộc nhất: `quy y Phật`, `quy y Pháp`, `quy y Tăng`). `mārisa moggallāna` → `thưa Tôn giả Moggallāna` (sn55.18:3.1). `devānaminda` (hô cách) → `vua chư thiên` (đo trên 69 khoá có `devānaminda` ở nơi khác trong tầng: `vua chư thiên` 49, `Thiên chủ` 20). `adhigaṇhanti` → `vượt qua` (dn30:1.4.3 và dn30:2.28.4, cùng công thức mười phương diện). Danh sách mười mục ở 26.4 dùng lại nguyên văn an8.36:4.4 và an8.36:9.4 (2 khoá).

  BẤT ĐỊNH VÀ LỰA CHỌN CÓ Ý THỨC (không thêm vào thân kinh):
  - 26.4 và các khoá cùng danh sách: tiền lệ an8.36 dịch `vaṇṇa` là `sắc trời` và `rūpa` là `các sắc trời`, hai chữ `sắc` đứng gần nhau dễ lẫn (Sujato phân biệt `beauty` và `sights`). Dùng lại nguyên văn tiền lệ vì Pāli trùng; ghi lại như một điểm thuật ngữ cần thống nhất ở lần rà sau (nên cân nhắc `dung sắc` cho `vaṇṇa`, như an9.21:2.3), không đổi ở đây.
  - 12.2: Pāli chỉ giữ `itipi so` rồi lược `…pe…` (không có `bhagavā`, khác 17.2, 21.2, 38.2, 42.2, 51.2). Bản Việt viết `Quả thật vị ấy …`, vì `itipi so` là mở đầu của danh sách hiệu mà chủ ngữ còn lại hiểu là Thế Tôn; không tiền lệ trùng nguyên văn trong tầng (an6.25:1.4 khác ở chỗ giữ `bhagavā`).
  - 3.5 và 3.6: Pāli lược `saṅgha …pe…` rồi tiếp `sugatiṁ saggaṁ lokaṁ upapajjantī”ti`. Hai khoá nối thành một câu: `Lành thay, thưa Tôn giả Moggallāna, là việc quy y Tăng … được sinh về cõi lành, cõi thiên giới.”`; phần chủ ngữ `một số chúng sinh ở đây` nằm trong đoạn lược nên không được dựng lại ở 3.6.
  - 39.3, 40.3: Pāli kết `upapajjanti …pe….` (lược sau cùng, rồi mới tới dấu chấm); bản Việt kết ` ….` theo quy ước tầng (đa số 398/760).
  - Hai danh xưng gọi nhau: Moggallāna gọi `devānaminda` (vua chư thiên) và Sakka gọi `mārisa moggallāna` (thưa Tôn giả Moggallāna). Cả hai là hô cách trong lời nói trực tiếp và được giữ ở từng khoá, không bỏ.

  LƯỢT REVIEW ĐỐI KHÁNG: đọc lại cặp Pāli↔Việt cho cả 199 khoá (không chỉ chạy phép đo). Đã kiểm: số lượng chư thiên đi cùng khớp phép tính; mọi cặp `Lành thay … Chính do …` mỗi lần đúng đối tượng (Phật, Pháp, Tăng, giới) và đúng người nói (devānaminda ↔ mārisa moggallāna); không khoá nào lặp nhầm nội dung khoá bên cạnh (Pāli trùng nguyên văn trong bài: 0 cặp Việt khác nhau); dấu nháy kép và nháy đơn khớp Pāli ở 199/199 khoá; dấu lược cân bằng Pāli ở 199/199 khoá; không có Pāli lọt sang Việt ngoài tên riêng (Mahāmoggallāna, Moggallāna, Saṁyutta Nikāya).

  Kiểm kỹ thuật chưa được chạy ở lượt này, ghi rõ để người duyệt chạy bốn lệnh còn lại: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Vì vậy technical_integrity đặt 9,6 chứ không tuyên bố cổng kỹ thuật đã qua. Sau khi lớp english-project lấp 128 khoá còn trống và chấm lại, bài có thể được nâng khỏi draft.
