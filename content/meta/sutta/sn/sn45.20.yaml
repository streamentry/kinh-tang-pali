    **Coverage Anh 75%** (`2/8`) — đã ghi vào `content/meta/reference-gaps.yaml`; `triangulation` hạ theo đúng mức thiếu.
  - >-
    Câu chữ bám **sn45.19** (đã `published`, cùng tu viện Pāṭaliputta, cùng hai người hỏi Ānanda và Bhadda, cùng câu hỏi `brahmacariya`): `Sādhu sādhu, āvuso bhadda` → *Tốt đẹp, tốt đẹp, này hiền giả Bhadda* · `Bhaddako kho te … ummaṅgo, bhaddakaṁ paṭibhānaṁ, kalyāṇī paripucchā` → *Cách đặt vấn đề của ông thật tốt đẹp, … biện tài tốt đẹp, câu hỏi khéo* · `brahmacariya` → *Phạm hạnh*, `brahmacariyapariyosāna` → *cứu cánh Phạm hạnh* · `sammādiṭṭhi …pe… sammāsamādhi` → *chánh kiến, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm … chánh định* (`sn45.39:1.1/1.6*` cùng dãy).
  - >-
    Khác `sn45.19` ở chỗ Pāli thêm `katamo brahmacārī` (vị phạm hạnh) và câu `Yo kho … iminā ariyena aṭṭhaṅgikena maggena samannāgato` — bản Việt thêm *thế nào là vị phạm hạnh* và *ai được trang bị bằng Thánh đạo tám ngành này … thì được gọi là vị phạm hạnh*, không bỏ sót.
  - >-
    Lượt review đối kháng: (1) `0.2` nháp theo *Phẩm Tào Môn* (5/6 bài cùng phẩm) — `sn45.19` ghi *2. Phẩm Thiền*; đã ghi rõ lệch trong notes chung thay vì im lặng. (2) `0.3` nháp theo *Kukkuta* của `sn45.19`; `mn52:2.1*`/`dn16:2.6.6*` đã xuất bản dùng *Kukkuṭa* (giữ dấu `ṭ`) nên bài này dùng *Kukkuṭa* và ghi lệch. (3) `2.4` nháp thêm dấu nháy kép ở cuối trong khi Pāli `kukkuṭārāmena tayoti.` không có — đã bỏ. (4) `1.12/1.14` nháp thiếu vế *Này* cho `Yo kho, āvuso` — `sn45.19:1.12` có, đã sửa.
  - >-
    Uddāna `2.1–2.4` dịch chữ từng đề mục, độ chắc thấp. 0 tiền lệ: `uppādā` → *hai sự trở thành* (theo `sn48.60:2.4*` *sanh khởi*) · `sekkho` → *vị học trò* · `Parisuddhena` → *thanh tịnh*. **Người biên tập nên kiểm**.
