  - >-
    Bất định đã ghi: `Kiñca, rādha, aniccaṁ tatra te chando pahātabbo?` nháp dịch *Và cái gì vô thường, này Rādha, mà đối với đó ông cần từ bỏ dục?*; `sn22.137/138/139*` dịch `Kiñca…` thành *Cái gì là, …*. Ở đây Pāli lặp lại cả vế `tatra te chando pahātabbo` nên phải giữ, đã viết lại cho khớp nhịp. **Người biên tập nên thống nhất với `sn22.137–139`.**
  - >-
    Lượt review đối kháng: `1.8` kết `…pe…` ngay sau *Đối với đó ông cần từ bỏ dục* — bản Việt phải dừng ở đó, không lặp lại *Đối với đó ông cần từ bỏ dục* như ở `1.15`; đã giữ đúng.
