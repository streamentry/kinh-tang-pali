notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 21/21 = 100%.** Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ phân phối Pháp Cú cho tiếng Việt), nên `triangulation` 9.0 chứ không cao hơn. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **29 khoá có PĨI TRÙNG NGUYÊN VĂN ở bài khác — mật độ cao nhất lát này, vì `sn48.9` và `sn48.11` là hai bài cùng phẩm, ngay trước và ngay sau, cùng công thức peyyāla về năm căn.** 24 cặp dùng lại NGUYÊN VĂN: `0.2` theo 9/9 · `0.3` = `sn48.37:0.3` (Kinh Phân Tích Thứ Hai) · `1.1`–`1.7`, `2.1`, `2.2`, `2.7`, `3.1`–`3.2`, `3.7`, `4.1`, `4.7`, `5.1`, `5.4`, `5.5` theo `sn48.9`/`sn48.11` (16 khoá) · `2.4` = `dn22:21.21` · `2.5` = `dn22:21.22` · `3.4` = `sn52.7:2.4` · `3.6` = `sn52.7:2.6` · `4.3` = `dn10:2.13.1` · `4.4` = `dn33:1.11.21` · `5.6` = `sn38.10:1.14` · `6.0` = *Tóm lược:*.
  **`5.2` — CỐ Ý SỬA MỘT TIỀN LỆ SAI, và đây là khác biệt quan trọng nhất của bài.** `sn48.9:5.2` và `sn48.11:5.2` (cùng chương, cùng khuôn) dịch `udayatthagāminiyā paññāya samannāgato ariyāya nibbedhikāya, sammā dukkhakkhayagāminiyā` là *đầy đủ trí đưa đến sinh diệt của bậc Thánh, có khả năng quán triệt, chân chánh đưa đến đoạn tận khổ*. Cách đó **đọc sai `ariyāya nibbedhikāya`**: `ariyā` và `nibbedhikā` là hai tính chất của cái tuệ (*thánh* và *quán thẳng thấm*), không phải thứ mà tuệ *đưa đến*. Tôi theo `dn33:2.1.71` (`Paññavā hoti udayatthagāminiyā paññāya samannāgato ariyāya nibbedhikāya sammā dukkhakkhayagāminiyā` — PĀI TRÙNG NGUYÊN VĂN, 34 bản đều đọc *tuệ về sự sinh khởi và hoại diệt, tuệ Thánh đưa đến xuyên thấu, đưa đến tận cùng khổ đau đúng chánh*). **Hai tệp nói trên nằm ngoài lát nên tôi không sửa; người điều phối nên xử lý.**
  **Hai nơi nữa tôi cố ý không theo tiền lệ, vì tiền lệ lộ chữ Pāli.** (1) `3.3` và `3.5`: `dn16:2.26.5` dịch `citte …pe…` thành *sống quán tâm nơi tâm …pe…* — **lộ nguyên chữ `pe` trong bản Việt**, lỗi rõ ràng; `sn52.7:2.5` (trùng nguyên văn) dịch *sống quán tâm trên tâm …* thì sạch và còn khớp với ba khoá anh em của nó. Tôi theo `sn52.7` cho **cả** `3.3`–`3.6` để bốn tầng quán thọ trong bài đồng nhất (*trên thân / trên các cảm thọ / trên tâm / trên các pháp*) thay vì trộn *nơi* của `dn33` với *trên* của `sn52.7`. (2) `2.2`: `sn48.9:2.2` dịch `anikkhittadhuro` là *không đặt gánh nặng xuống đối với các pháp thiện* — đọc được, nhưng dễ hiểu là *bỏ gánh*; `dn33:3.3.26` và `an5.2:5.2` dịch *không bỏ gánh phần thiện pháp*. Tôi **vẫn theo `sn48.9` nguyên văn** ở khoá này, vì hai bài ngay trước/sau đã dùng nó và `anikkhittadhuro` (không *buông* gánh) nghĩa là không ngơi tay; hai tầng Anh này không đọc sai nghiêm trọng bằng `5.2`.
  **`0.1` không dùng tiền lệ.** 66/66 bản `sn48` đều viết `Saṁyutta Nikāya N`; toàn tầng Việt **0** tệp nào viết `Saṡyutta`, nên giữ chính xác dấu `ṁ` của Pāli.
  **`2.3`, `2.6` là khoá mới, không có bản trùng nguyên văn.** `2.6` theo `dn33:1.11.13` cho `ṭhitiyā asammosāya bhiyyobhāvāya vepullāya bhāvanāya pāripūriyā` = *được duy trì, không mất đi, tăng trưởng, mở rộng, được tu tập và viên mãn* (55 bản). `2.3` tôi dựng theo `dn33:1.11.10` nhưng **đảo vị trí mệnh đề mục đích về cuối** như Pāli, thay vì đặt trước như `dn33`; giữ nguyên `chandaṁ janeti vāyamati vīriyaṁ ārabhati cittaṁ paggaṇhāti padahati` = *khởi ý muốn, nỗ lực, phát khởi tinh tấn, nâng tâm và cố gắng*. `4.5` theo `dn33:1.11.22` cho *Xả, có niệm, an trú lạc* (36 bản).
  **Uddāna `6.0`–`6.4`, 0 tiền lệ, dịch theo nghĩa chữ.** `sotā` → *hai dòng nước* (`sn48.43:4.9`) · `apare` → *không còn lậu hoặc* (`an5.38:6.2`) · `daṭṭhabbaṁ` → *đáng được trông thấy* · `vibhaṅgā` → *hai phần phân tích*. Đây là kệ ghi tên các bài đầu phẩm, không phải mệnh đề giáo lý; tôi giữ dạng liệt kê và không diễn giải.
  **Dấu lược.** `1.3`, `3.4`, `3.5` giữ đúng một dấu `…`; `4.7` Pāli vốn đã có `…` trần nên bản Việt cũng một. Sujato **mở rộng** `1.3` thành đủ năm căn (*The faculties of faith, energy, mindfulness, immersion, and wisdom*), tôi giữ lược theo Pāli.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
