notes: |-
  Dịch từ Pāli root; đối chiếu Sujato đã ghim ở **21/29** segment Pāli có nội dung (coverage 0,7241 < 0,8). Tám khoá không có tiếng Anh: `2.4`, `3.2`, `3.3`, `3.4`, `4.4`, `5.4`, `7.1`, `7.2`, và lớp `english-project` của dự án chưa có mảng nào cho bài này — tức **gần một phần tư** bài chỉ có Pāli để đứng vững, và đúng những chỗ đó lại là các vế lặp lại. Vì vậy `triangulation` = 7,8 và bài ở `draft` (xem `blocking_errors`). Tầng `vietnamese-current` không có cho bài này.
  **Bản song parallel trùng Pāli: 3 khoá, dùng lại y nguyên văn 2.** `an3.53`/`an3.54` cho cụm `sandiṭṭhiko dhammo hoti akāliko ehipassiko opaneyyiko paccattaṁ veditabbo viññūhī` — **dùng lại y nguyên văn** cho `1.4`, `2.5`, `3.4`, `4.5`, `5.5`, `7.5`: *pháp có thể thấy ngay trong hiện tại, không hề thời hạn, có thể đến xem, hướng thượng, mỗi bậc trí tự mình hiểu được*. `an6.47` cho `sandiṭṭhiko dhammo, sandiṭṭhiko dhammo` — Pāli gần trùng nhưng khác (`‘…’ti, bhante, vuccati`), chọn *người ta nói* theo đa số chứ không phải *người ta thường nói*. Tiêu đề phẩm `Migajālavagga` → *7. Phẩm Migajāla* (7 bài). `Aṭṭhamaṁ.` → *Thứ tám.* (237).
  **0 tiền lệ, đặt mới, ghi kèm lý do.** `Upavāṇasandiṭṭhikasutta` → *Kinh Với Upavāṇa Về Pháp Có Thể Thấy Ngay*; ghép hai tiền lệ có sẵn: `Upavāṇasutta` → *Kinh Với Upavāṇa* (`sn12.26`, `an4.175`) và `Sandiṭṭhikadhammasutta` → *Kinh Pháp Có Thể Thấy Ngay* (`an9.46`). `rūpappaṭisaṁvedī / rūparāgappaṭisaṁvedī` → *cảm nhận sắc / cảm nhận tham dục với sắc*; 0 tiền lệ, đọc theo `pajānāti` ở kho sau ngay và theo Sujato *experience*. `ajjhattaṁ` trong `atthi me ajjhattaṁ rūpesu rāgo` → *trong bản thân tôi*; giữ `ajjhattaṁ` vì cả hai vế đều có nó và nó là mệnh đề tự thân chứng.
  **Bất định đã ghi nhận.** (1) `sandiṭṭhiko` dịch *có thể thấy ngay trong hiện tại* (đa số `an3.53`/`an3.54`); kho còn có *thiết thực hiện tại* (`an6.47`) — khác cả, đã theo đa số. (2) `rūpappaṭisaṁvedī ca hoti rūparāgappaṭisaṁvedī ca` là hai vế **đồng thời**, không phải luyên tiếp; giữ *và*. (3) `Yaṁ taṁ, upavāṇa …` ở `2.3`, `3.3`, `4.3`, `5.3`, `7.3` là mệnh đề dẫn lại (*Vì sự ấy …*) và vẫn thuộc lời Đức Thế Tôn, nên không thêm nháy kép. (4) Ở `6.1` Pāli chỉ nói rõ phần **nếm vị**; tai và mũi nằm trong `…pe…` — không mở rộng ra.
  Dấu lược: `1.1`, `2.5`, `3.4`, `4.5` (**hai** `…` trong một khoá), `5.5`, `6.1` giữ **một** `…` mỗi `…pe…`; không mở rộng. `notes` dùng khối literal `|-` thụt 2, đã đọc mẫu đích trước khi ghi. Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` (và `npm run build` vì có bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9.6 chứ không 10.0.
