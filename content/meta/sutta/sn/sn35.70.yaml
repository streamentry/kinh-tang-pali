notes: |-
  Dịch từ Pāli root; đối chiếu Sujato đã ghim ở **21/29** segment Pāli có nội dung (coverage 0,7241 < 0,8). Tám khoá không có tiếng Anh: `2.4`, `3.2`, `3.3`, `3.4`, `4.4`, `5.4`, `7.1`, `7.2`, và lớp `english-project` của dự án chưa có mảng nào cho bài này — tức **gần một phần tư** bài chỉ có Pāli để đứng vững, và đúng những chỗ đó lại là các vế lặp lại. Vì vậy `triangulation` = 7,8 và bài ở `draft` (xem `blocking_errors`). Tầng `vietnamese-current` không có cho bài này.
  **Bản song parallel trùng Pāli: 3 khoá, dùng lại y nguyên văn 2.** `an3.53`/`an3.54` cho cụm `sandiṭṭhiko dhammo hoti akāliko ehipassiko opaneyyiko paccattaṁ veditabbo viññūhī` — **dùng lại y nguyên văn** cho `1.4`, `2.5`, `3.4`, `4.5`, `5.5`, `7.5`: *pháp có thể thấy ngay trong hiện tại, không hề thời hạn, có thể đến xem, hướng thượng, mỗi bậc trí tự mình hiểu được*. `an6.47` cho `sandiṭṭhiko dhammo, sandiṭṭhiko dhammo` — Pāli gần trùng nhưng khác (`‘…’ti, bhante, vuccati`), chọn *người ta nói* theo đa số chứ không phải *người ta thường nói*. Tiêu đề phẩm `Migajālavagga` → *7. Phẩm Migajāla* (7 bài). `Aṭṭhamaṁ.` → *Thứ tám.* (237).
  **0 tiền lệ, đặt mới, ghi kèm lý do.** `Upavāṇasandiṭṭhikasutta` → *Kinh Với Upavāṇa Về Pháp Có Thể Thấy Ngay*; ghép hai tiền lệ có sẵn: `Upavāṇasutta` → *Kinh Với Upavāṇa* (`sn12.26`, `an4.175`) và `Sandiṭṭhikadhammasutta` → *Kinh Pháp Có Thể Thấy Ngay* (`an9.46`). `rūpappaṭisaṁvedī / rūparāgappaṭisaṁvedī` → *cảm nhận sắc / cảm nhận tham dục với sắc*; 0 tiền lệ, đọc theo `pajānāti` ở kho sau ngay và theo Sujato *experience*. `ajjhattaṁ` trong `atthi me ajjhattaṁ rūpesu rāgo` → *trong bản thân tôi*; giữ `ajjhattaṁ` vì cả hai vế đều có nó và nó là mệnh đề tự thân chứng.
  **Bất định đã ghi nhận.** (1) `sandiṭṭhiko` dịch *có thể thấy ngay trong hiện tại* (đa số `an3.53`/`an3.54`); kho còn có *thiết thực hiện tại* (`an6.47`) — khác cả, đã theo đa số. (2) `rūpappaṭisaṁvedī ca hoti rūparāgappaṭisaṁvedī ca` là hai vế **đồng thời**, không phải luyên tiếp; giữ *và*. (3) `Yaṁ taṁ, upavāṇa …` ở `2.3`, `3.3`, `4.3`, `5.3`, `7.3` là mệnh đề dẫn lại (*Vì sự ấy …*) và vẫn thuộc lời Đức Thế Tôn, nên không thêm nháy kép. (4) Ở `6.1` Pāli chỉ nói rõ phần **nếm vị**; tai và mũi nằm trong `…pe…` — không mở rộng ra.
  Dấu lược: `1.1`, `2.5`, `3.4`, `4.5` (**hai** `…` trong một khoá), `5.5`, `6.1` giữ **một** `…` mỗi `…pe…`; không mở rộng. `notes` dùng khối literal `|-` thụt 2, đã đọc mẫu đích trước khi ghi. Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` (và `npm run build` vì có bài `published`). Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9.6 chứ không 10.0.
  **Giải quyết draft 2026-10-12.** Thay thế các mục cũ về `rāga`, `Puna caparaṁ`, `Yaṁ taṁ` và `chỉ cảm nhận` ở trên. (1) Blocker độ phủ Sujato (21/29 = 0,7241) thuộc loại mất mát upstream, không phải lỗi văn bản: Sujato để trống `2.4`, `3.2`, `3.3`, `3.4`, `4.4`, `5.4`, `7.1`, `7.2` (và `2.3`, `4.3`, `5.3` chỉ có mẩu `Since this is so,`). Tám khoá trống đều là vế lặp lại nguyên công thức của `2.2`/`3.1`/`4.2`/`5.2`/`7.1`-`7.2` hay mệnh đề `Yaṁ taṁ … pajānāti`; đã đọc từng khoá từ Pāli, bản dịch tự đứng vững, nên gỡ blocker (mất mát được ghi nhận ở `content/meta/reference-gaps.yaml`). `triangulation` hạ xuống 7,6 vì không có bản Anh độc lập cho các khoá ấy và không có tầng Việt hiện hành (tầng này chỉ có Pháp Cú, là giới hạn tham chiếu chứ không phải lỗi văn bản). (2) Sửa lỗi nghĩa thật: `rāgaṁ` ở `2.2`, `2.4`, `3.2`, `3.4`, `4.2`, `4.4`, `5.2`, `5.4`, `6.1`, `7.2`, `7.4` (tức mọi khoá `Santañca/Asantañca ajjhattaṁ … rāgaṁ`) trước đây dịch *sự thích thú và tham ái* — thêm `thích thú`, không có trong Pāli (chỉ có `rāga`), và lệch khỏi `rūparāga` đã dịch *tham dục với sắc* ngay trong cùng bài; nay thống nhất *tham dục đối với các sắc/vị/pháp*, và `Santañca`/`Asantañca` dịch *đang có/không có trong bản thân* (`rūpesu` số nhiều → *các sắc*). `Puna caparaṁ` đã dịch *lại xét* (0 nơi khác dùng) → *Lại nữa* (974 khoá trong tầng) ở `3.1`, `4.1`, `6.1`, `7.1`; `Idha pana … bhikkhu` đã dịch *giả sử có* → *Ở đây … có* ở `2.1`, `5.1`. `5.3`, `6.1`, `7.1`, `7.3` bỏ chữ *chỉ* (`rūpappaṭisaṁvedīhi kho hoti, no ca …` chỉ là hai vế đối lập; `chỉ` là thêm nghĩa). (3) `Yaṁ taṁ, upavāṇa, bhikkhu … pajānāti` ở `2.3`-`2.4`, `3.3`-`3.4`, `4.3`-`4.4`, `5.3`-`5.4`, `7.3`-`7.4` trước đây dịch *Vì sự ấy, … có vị tỳ-kheo …*, tức đặt như một lý do và lặp lại thành câu độc lập; thực chất đó là mệnh đề danh từ (`yaṁ taṁ` + `pajānāti`) làm chủ đề của `evampi kho … sandiṭṭhiko dhammo hoti`, cùng cách đọc của Sujato (`Since this is so, this is how the teaching is apparent…`). Nay dịch *Này Upavāṇa, việc vị tỳ-kheo … [,] và biết rõ … — như vậy, này Upavāṇa, pháp có thể thấy ngay …*, ranh giới khoá giữ nguyên; `Evampi kho` → *như vậy* theo `an3.53`/`an3.54` (`Evampi kho, brāhmaṇa` → *Như vậy, này bà-la-môn*), thay *Cũng vậy*. Khoá đổi: `2.1`-`2.5`, `3.1`-`3.4`, `4.1`-`4.5`, `5.1`-`5.5`, `6.1`, `7.1`-`7.5`; 25/33 khoá có sửa nghĩa hoặc cấu trúc, 8 khoá không đổi (`0.1`-`0.3`, `1.1`-`1.4`, `7.6`). (4) Bất định còn lại: `rāga` dịch *tham dục* để thống nhất trong bài (tầng còn có *tham*, *ái*, và `rūparāga` ở nghĩa kiết sử là *tham sắc* — ở đây `rūpa-rāga` là tham dục đối với sắc trần chứ không phải kiết sử `rūparāga`); `hi kho` ở `5.3`, `6.1`, `7.1`, `7.3` (`…paṭisaṁvedīhi kho hoti`, nhấn mạnh) không dịch riêng. Dấu lược giữ một `…` mỗi `…pe…`; khoá nào Pāli kết `….` thì Việt kết ` …`. Kiểm: 33/33 khoá khớp Pāli, 0 Pāli lọt sang bản Việt, không số Pāli cần tính. Bốn lệnh cổng kỹ thuật vẫn chưa chạy ở lát này: `npm run validate`, `npm test`, `npm run check`, `npm run build`; `technical_integrity` giữ 9,6.

  **Sửa lan 2026-10-13:** `sn35.70:1.4`, `2.5`, `3.4`, `5.5`, `7.5` — *không hề thời hạn* → *không thời hạn* (`akāliko`; `hề` là thêm nghĩa không có trong Pāli; theo `an11.11:4.2`, `an11.13:7.2`, `sn12.41:9.2`, `sn55.1:2.5`, `sn41.10:3.6`). Mục trên viết bản này "dùng lại y nguyên văn" `an3.53`/`an3.54`; cả hai bài ấy cùng mang *không hề thời hạn* và chưa sửa (ngoài lane).
