notes:
  - >-
    Tên bài `Sirivaḍḍhasutta` → *Kinh Với Sirivaḍḍha*, theo mẫu `sn35.70:0.3` *Kinh Với … Về …* rút gọn vì không có mệnh đề phụ. Tên phẩm `Sīlaṭṭhitivagga` → *3. Phẩm Giới Và Trú* khớp Pāli tuyệt đối với `sn47.21:0.2` và `sn47.22:0.2`.
  - >-
    Bài này là **bản Việt thứ hai** của `sn47.30` (`Mānadinnasutta`) — cùng nhân vật, cùng khung cảnh, cùng bốn sợi trói buộc — nên đã dùng lại nguyên văn của nó.
  - >-
    **13 khoá có Pāli trùng nguyên văn và dùng lại nguyên văn** (đo bằng script, đã loại lát này khỏi chỉ mục): `0.2` (tên phẩm) · `1.7` ← `dn10:1.2.4` (*Rồi hãy nói thêm:*) · `1.11` ← `mn85:4.4` (*Và nói thêm:*) · `1.13` ← `mn88:6.1` (*Tôn giả Ānanda im lặng nhận lời.*) · `3.3`, `4.3` ← `an9.63:2.4` (*sống quán thọ trên các cảm thọ …*) · `3.4`, `4.4` ← `sn47.11:2.5` (*quán tâm trên tâm …*) · `4.5` ← `sn47.30:1.9` · `4.6`, `4.7`, `4.8` ← `sn47.30:1.10–1.12` · `4.9` ← `an10.109:6.5` (*Thứ chín.*). Ngoài ra `1.2` và `1.3` lấy từ `sn47.30:1.2–1.3` và `3.1`, `3.6` lấy từ `mn143:5.1` và `mn143:14.6` — cùng công thức nhưng **không** trùng byte vì đổi tên riêng và vì khoá `mn143:5.1` mở nháy kép ở đầu câu.
  - >-
    Tiền lệ đã dùng thêm: `anukampaṁ upādāyā` → *vì lòng thương xót* (3 lần) · `pubbaṇhasamayaṁ nivāsetvā pattacīvaramādāya` → *buổi sáng đắp y, mang bát và y ngoài* · `paññatte āsane nisīdi` → *ngồi xuống chỗ đã sắp đặt* · `khamanīyaṁ / yāpanīyaṁ` → *dễ chịu / còn sức để vượt qua* (theo `sn47.30:1.5`) · `sādhu kira, bhante, … tenupasaṅkamatu` → *xin Tôn giả Ānanda vui lòng đến nơi trú ngụ…*.
  - >-
    Bất định đã ghi: (a) `satipaṭṭhāna` chọn *niệm xứ* — trong SN47 đa số là *niệm xứ* (90 lần) so với *Chánh Trừng Phạt* (20 lần, `sn43.5`, `sn47.17`), và toàn tầng là 235 so với 56. **Người biên tập nên thống nhất hai cách đang cùng tồn tại trong SN47.** (b) `kāyānupassī viharissāmi` → *sống quán thân trên thân* theo `sn47.30:1.6`, nhưng `vedanāsu`/`citte` lại dùng nguyên văn của `an9.63` / `sn47.11` (*trên các cảm thọ* / *trên tâm*); hai bộ cách này chỉ khác ở giới từ *trên / trong*, không mâu thuẫn nhau, và giữ nguyên văn cho hai khoá trùng Pāli. (c) `te dhammā mayi saṁvijjanti` → *thì tôi có đủ* (Sujato *are found in me*). (d) `1.8` và `1.12` là lời người sai bảo tường truyền lại: giữ nháy đơn bên trong và đóng nháy kép ở `1.8`, `”ti.` ở `1.12`, đúng như Pāli.
  - >-
    Cấu trúc nháy kép: `1.4` mở → `1.8` đóng; `1.9` mở/đóng trong một khoá; `1.10` mở → `1.12` đóng; `2.2` mở/đóng, `2.3` mở/đóng; `3.1` mở → `3.6` đóng; `4.1` mở → `4.6` đóng; `4.7` mở → `4.8` đóng. Cân trên toàn bài 34 khoá.
  - >-
    Quy tắc dấu lược của BRIEF_VI3 §10: mọi khoá Pāli có `…pe…` hoặc `…` đều giữ **đúng một** `…`, không mở rộng; không khoá nào nén bằng `…` cả khi Pāli viết đủ. Đã đếm từng khoá. Coverage Anh đo được: 23/23 = 100% (sáu khoá do `english-project` lấp, trạng thái `published`)
  - >-
    Tầng `vietnamese-current` vắng: tại commit đã ghim, bilara chỉ có Pháp Cú cho tiếng Việt, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Ba tầng tham khảo còn lại là Pāli root (authority) + `english-sujato` đã ghim + `english-project` (lớp lấp của chính dự án, chỉ tính khi `published`).
  - >-
    Bốn cổng kỹ thuật của AGENTS.md: `npm run validate`, `npm test`, `npm run check` và `npm run build`. **Agent lát này KHÔNG chạy bốn lệnh đó** — BRIEF_VI3 §7 và lệnh của người điều phối cấm chạy `npm run validate|test|build|check`. Những gì đã chạy và xanh: `_hvi.py` (`save_vi` → `kiểm`) cho cả 9 bài — đủ khoá trong `all`, không thừa, NFC, không trùng nguyên văn Pāli (trừ 0.1 theo quy ước), không Pāli lọt, số dấu lược khớp từng khoá, nháy kép cân trên cả bài; quét lại 306 khoá bằng script độc lập; `notes` và `blocking_errors` parse sạch bằng thư viện `yaml` của kho. Cổng thật còn lại là CI (`.github/workflows/ci.yml`), nên `technical_integrity` chỉ 9.6 chứ không 10.
