    nisinno`; (2) `sn46.89-98:1.1` và `sn46.99-110:1.1` dùng `vitthāretabbaṁ` —
    dạng ngữ pháp cũ, tôi dịch *phải giảng giải chi tiết*; (3) `sn45.28:1.7` có
    `itipi saparikkhāro itipī”ti` — lặp `ti`, tôi dịch *cũng được soi xét như
    vậy*; (4) `sn23.13:1.3`–`sn23.21:1.3` viết `X, X’ti` (danh từ trần rồi mới
