  - >-
    **⚠ `ariyaṁ aṭṭhaṅgikaṁ maggaṁ`: ba cách dịch cạnh tranh trong kho, tôi chọn
    theo cùng chương.** `an3.61:17.2` dùng *bát thánh đạo*, `sn3.18:4.4` dùng
    *Thánh đạo Tám ngành*, còn `sn45.163:1.5` (đã `published`) dùng *bát chánh
    đạo*. Với **mười bài `sn45.*`** của loạt này tôi theo *bát chánh đạo* —
    **cùng chương thắng tiền lệ toàn kho** — và **ghi lại để người biên tập
    quyết**.
  - >-
    **⚠ Phát hiện một khiếm khuyết ở bản đã `published`, liên quan trực tiếp tới
    lát này.** `an1.296:1.1` (và `1.4`) có Pāli **bảy** vế `ekantanibbidāya
    virāgāya nirodhāya upasamāya abhiññāya sambodhāya nibbānāya` nhưng bản Việt
    chỉ có **sáu** — **thiếu hẳn `sambodhāya` (giác ngộ)**. Ở
    `sn47.32:1.1`/`2.6` tôi dịch đủ bảy vế, giữ nguyên sáu từ đã publish và
    **thêm vế bị thiếu**: *dẫn đến chán ngại hoàn toàn, ly tham, diệt tận, chân
    nhận, chứng ngộ, **giác ngộ**, Niết-bàn*. Đây là sự **lệch có chủ đích và đã
    ghi**, không phải tôi âm thầm sửa bản đã xuất bản; người biên tập xem có
    muốn vá `an1.296-305` hay không. Lưu ý thêm: `upasamāya` tôi dùng *chân
    nhận* (theo tiền lệ `an1.296`), trong khi `sn56.9:1.4` của PR #125 tôi dùng
    *hòa giải* — **hai chỗ trong kho đang lệch nhau, ghi ở đây để người biên tập
    chọn một**.
  - >-
    **Hai mươi sáu chỗ bản đầu tôi sai khi đọc đối kháng, tất cả đã sửa và ghi
    lại đây:** (1) `sn35.125/126/128:1.4` — tôi dịch `bhante` là *thương lão*,
    tức biến cách gọi **Đức Thế Tôn** thành cách gọi người bị dạy; (2) `sn35.*`
    — tôi dịch `gahapati` **không nhất quán**: *nông trại* ở `125`, *đại gia* ở
    `126`, trong khi đó là **cùng một từ**; chốt lại là *chủ nhà* và sửa cả tiêu
    đề phẩm (`13. Phẩm Chủ Nhà`); (3) `sn45.155:1.2` — `ākāse vividhā vātā` là
    **MƯỜI** cơn gió, tôi mới dịch tám, **bỏ mất** `sarajā`/`arajā` (có sương /
    không sương); (4) `sn46.31:2.2`, `sn46.32:2.2`, `sn46.49:1.4` — tôi **mở
    rộng** `…pe…` thành đủ bảy giác chi, trái với quy tắc của chính kho; (5)
    `sn46.7:2.2` — tôi mở rộng `…pe…` **và làm rơi** cả bốn vế `vivekanissitaṁ …
    vossaggapariṇāmiṁ` ở vế đầu; (6) `sn54.2:1.3` — tôi mở rộng `…pe…` thành năm
    giác chi, trong khi Pāli chỉ nêu một; (7) `sn23.6/7/8:1.5` và `sn23.6:1.6` —
    tôi mở rộng `…pe…` thành đủ năm uẩn và đủ câu định nghĩa sa-môn, tức **thêm
    nội dung không có trong Pāli**; (8) `sn26.6/7/8:1.2` và `:1.5` — tôi **bịa**
    cụm *do xúc chạp của mắt*, chỉ `sn26.5` mới có `cakkhusamphassajāya`; (9)
    `sn23.12`–`sn23.21:1.3` — tôi viết cả hai vế trong `‘X, X’ti` đều mang *là
    …*, trong khi vế đầu là **danh từ trần** (`aniccaṁ`) và chỉ vế sau mới mang
    `…’ti` (`là vô thường`); (10) `sn45.171:1.7` — tôi để lại **chuỗi ký tự thô
    `E_sà`** trong văn bản Việt; (11) `sn48.14:1.5` — tôi dịch `anāgāmī` là *bậc
    Bất Lưu*, đó là `anāgāmin` của SN 48.9, còn `anāgāmī` là *bậc không còn phải
    học thêm nữa*; (12) `sn48.21`/`sn48.28:1.4`–`1.5` — tôi dịch vế cuối
    `sadevamanussāya` thành *… và loài người*, lặp ý với vế trước; (13)
    `sn48.6:1.5`/`2.2` — tôi **bỏ hẳn** vế `sāmaññatthaṁ vā brahmaññatthaṁ vā`
    (*thân phận sa-môn / Bà-la-môn*); (14) `sn45.28:1.2` — tôi **bỏ**
    `saparikkhāraṁ` ở `1.2` dù có ở `1.4`; (15) `sn48.69:1.4` — tôi viết *dẫn
    đến để giác ngộ*, vô nghĩa; (16) `sn12.82:1.2`–`1.5` — tôi lặp hai lần *biết
    rõ như thật* cho cùng một ý trong mỗi vế; (17) `sn45.50-54:1.3` — *Đối với
    người sự thành tựu về giới* vô nghĩa; (18) `sn45.151:1.1` — *ngọn núi vua
    núi Himavan* lặp từ; (19) `sn47.17:0.3` — lỗi chính tả *Trừng Phạn*; (20)
    `sn46.89-98`/`sn46.99-110` — bài kệ liệt kê tên tôi dịch tự do, làm mất đúng
    cái bài kệ dùng để ghi nhớ là việc gì.
