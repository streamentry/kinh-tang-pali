    **sáu nhóm** tu tập (bốn Chánh Trừng Phạt, bốn Chánh Tinh Tấn, bốn tức địa,
    năm căn, năm sức mạnh, bảy giác chi); bản đầu tôi chỉ dịch tám cơn gió, đã
    sửa đủ mười.
