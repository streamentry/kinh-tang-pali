    `sn54.2`, `sn54.3` là những bài có tệp riêng; **hai mươi hai bài còn lại**
    trong lát này đều do tệp phạm vi phủ). Hệ quả trực tiếp: **bài kệ liệt kê
    uddāna ở `sn46.89-98:2.1`–`2.4` và `sn46.99-110:2.1`–`2.4` liệt kê *chữ đầu
    của tên từng bài trong phẩm*, mà 10 bài `sn46.89`–`sn46.98` và 12 bài
    `sn46.99`–`sn46.110` đều **không có tệp trong bản chụp** — tôi không thể đối
    chiếu từng cái tên, nên tôi **phiên âm** các âm tiết trong bài kệ (giữ
    nguyên dấu gạch nối) và dịch phần khung, vì dịch tên sẽ **phá vỡ đúng mục
    đích của bài kệ** là ghi nhớ. Bản Anh Sujato cũng để trống toàn bộ
    `2.0`–`2.4`, nên không có tầng tham khảo nào ở đây.
