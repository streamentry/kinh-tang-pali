  - >-
    **Khiếm khuyết ở tầng Pāli, ghi lại chứ không sửa:** (1) `sn35.125:1.2` dùng
    `tenupasaṅkami; upasaṅkamitvā` — có dấu chấm phẩy xen giữa hai vế của cùng
