notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá sn14.27:1.2 — *chính theo giới … hòa nhập và gặp
  gỡ nhau* → *chính do giới … hòa hợp và tụ hội* (`saṁsandanti samenti`: 152 khoá toàn tầng dùng
  *hòa hợp … tụ hội*, so với 26 khoá *hòa nhập … gặp gỡ*); cùng đổi ở 1.3, 1.9–1.12, 2.1, 2.7–2.10
  để cả bài dùng một cặp từ. Giữ *giới* cho `dhātu`, không theo *giới tánh* của các bài sn14 khác
  vì Pāli không có yếu tố *tánh*.
