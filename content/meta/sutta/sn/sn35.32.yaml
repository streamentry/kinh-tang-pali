notes: |-
  Dịch từ Pāli root commit 11c9d708.
  Đối chiếu bản dịch tiếng Anh của Bhikkhu Sujato đã ghim.
  Coverage tầng Anh đạt 22/22 substantive segments = 100.0%, không có gap dưới sàn.
  59/59 khoá khớp Pāli root tuyệt đối.
  Nháy kép và đơn khớp 1:1 với Pāli từng khoá.
  12 dấu lược … cân bằng chính xác với Pāli.
  Khảo sát tam pháp ấn trên sáu nội ngoại xứ và công thức ly tham giải thoát dịch chuẩn mực.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt quét lỏng): khoá 1.1, 1.3, 28.8 — “nhổ lên tất cả sự huyễn tưởng” → “nhổ tận gốc mọi sự tưởng nghĩ” (`sabbamaññitasamugghāta`: `maññita` là sự tưởng nghĩ, `sn35.30`, `sn35.31`, `sn35.248` đều dịch vậy; “huyễn” không có trong Pāli; vẫn giữ “thích hợp” cho `sappāya`, sát nghĩa hơn “đưa đến” ở `sn35.31`). Giữ nguyên khoá 6.1, 14.1, 26.1 (“chịu sự biến hoại, có hợp lý chăng khi quán xét” đúng `vipariṇāmadhammaṁ`, `kallaṁ nu taṁ samanupassituṁ`; chỉ khác công thức đa số 48/74 ở văn phong) và khoá 28.1, 28.2, 28.4, 28.6 (“nhàm chán”, “do nhàm chán nên ly tham…” đúng `nibbindati`; toàn tầng “nhàm chán” 443 chỗ, “chán nản” 362 chỗ). Tên kinh ở khoá 0.3 vẫn là “Nhổ Lên”, thuộc hồ sơ tên bài, chưa đổi.
