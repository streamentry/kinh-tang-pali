notes:
  - >-
    **Dùng lại nguyên văn đã `published`:** `nibbindati` → *chán nản* và
    `virajjati` → *ly tham* (`an10.2:1.24`) · `sīlasampadā` → *sự thành tựu về
    giới* (`an3.117:5.1`) · `Kāmesanā`/`Bhavesanā` → *sự tìm kiếm dục / sự tìm
    kiếm hữu* (`an4.38:5.1`) · `anticcānupassī`/`aniccānupassī` → *sống quán vô
    thường* (`an10.60:4.4`) · `mānānusaya` → *tùy miên ngã mạn* (`sn8.4:6.2`) ·
    `antimoyaṁ samussayo` → *thân cuối cùng ấy* (`dhp334-359:4`) · `Moggallāna`
    → *Mục-kiền-liên* (`sn8.10:0.3`) · `Candana` → *Chiên Đàn* (`dhp44-59`) ·
    `anāsavaṁ cetovimuttiṁ paññāvimuttiṁ diṭṭheva dhamme sayaṁ abhiññā
    sacchikatvā upasampajja` → *tự mình chứng tri, chứng ngộ trong hiện tại và
    an trú ở giải thoát tâm không lậu, giải thoát tuệ* (`an3.87:4.6`) ·
    `mālāgandhavilepanadhāraṇamaṇḍanavibhūsanaṭṭhānā` → *đeo hoa, xức hương,
    trang sức, điểm trang* (`an4.198:9.4`) · `hatthigavassavaḷavapaṭiggahaṇā` →
    *thọ nhận voi, bò, ngựa và ngựa cái* (`an4.198:9.13`) · `Tassuddānaṁ` → *Tóm
    lược:* (`an10.80:2.0`).
  - >-
    `āsavakkhaya` → *sự cạn lậu*; `bhāvitattā bahulīkatattā` → *đã được tu tập,
    đã được tăng cường* theo khuôn chung. `satipaṭṭhāna` → *Chánh Trừng Phạt* và
    `āvuso` → *anh hiền giả* theo quyết định chung của kho (PR #116–#117).
  - >-
    uddāna của `sn52.24` liệt kê **tên tám bài** trong phẩm (*thắng tri kiến,
    thần thông, thiên nhân, trí biết tâm / pháp / nghiệp, tri toàn pháp và giới
    pháp đạo pháp, giải thoát, căn, chứng ngộ, ba chứng ngộ*) — tôi dịch nguyên
    văn, không diễn giải.
  - >-
    **Quy ước dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
    `published` có `…` trong Pāli, chỉ 617 (40%) giữ đúng số, và cặp lệch phổ
    biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` → `…`). Quy tắc là
    **có/không có `…` phải khớp theo từng segment**.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng
    Thích Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã
    ghi ở `content/meta/reference-gaps.yaml`.
  - >-
    uddāna đếm số: *sự đạt được, ba sự rút gọn, ba sự trình bày đầy đủ, sự bước
    vào, sự viên mãn* → bài thứ mười là sự cạn lậu.
  - >-
    terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `2. Mudutaravagga` → «2. Phẩm Tầm Thấp Dần». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.
