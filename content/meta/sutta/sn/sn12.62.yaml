notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim. Coverage English = **27/27** khoá Pāli có nội dung = **100%** (đo bằng `isSubstantive` của `src/lib/canon/reference.ts`: Pāli ≥ 40 ký tự, bỏ khối `:0`). Tầng `vietnamese-current` không có cho bài này — `translation/vi/phantuananh` tại commit đã ghim chỉ có 26 tệp Pháp Cú.
  Bài song parallel đã `published` dùng lại nguyên văn — đây là peyyāla thứ hai, khung lặp nguyên văn. **19** khoá Pāli trùng nguyên văn với `sn12.61` (đã `published`), và **cả 19** dùng lại y nguyên văn bản Việt: `0.2` · `1.3`/`1.7`/`2.2` (`Taṁ kissa hetu?` → Vì sao vậy?) · `1.4` (`sn12.61:1.5`) · `1.5` (`1.6`) · `1.6` (`2.1`) · `1.8` (`2.3`) · `1.9` (`2.4`) · `1.10` (`2.5`) · `2.1` (`3.1`) · `2.3` (`3.3`) · `2.4` (`4.1`) · `3.1` (`5.1`) · `3.2` (`5.2`) · `5.2` (`6.2`) · `5.3` (`6.3`). Tổng lát c37: 127 cặp trùng Pāli, 121 dùng lại nguyên văn.
  Hai khoá khác `sn12.61` CHỈ ở dấu câu hoặc hoa-thường, nên vẫn dùng lại đúng cách dịch của bài kia: `1.2` (`Assutavā` vs `assutavā`) lấy nguyên văn `sn12.61:1.3`; `3.3` (`…nirodhā idaṁ nirujjhatī’ti.` vs `…nirujjhati—`) lấy `sn12.61:5.3` nhưng thêm `’ti.` vào cuối vì Pāli bài này có dấu khép ngoặc ở đó.
  0 tiền lệ, đặt mới, ghi kèm lý do: `Dutiyaassutavāsutta` → *Kinh Người Chưa Học (Hai)* — `sn12.61:0.3` đã có *Kinh Người Chưa Học* cho `Assutavāsutta`, và cách ghi thứ tự bài trong `sn` đang chạy là **Kinh X (Hai)**: `sn12.54` Kinh Sự Chấp Thủ (Hai), `sn13.8` Kinh Biển (Hai), `sn12.56` Kinh Đại Cây (Hai), `sn12.14/30` Kinh Sa-môn Bà-la-môn (Hai).
  Khối `3.4–4.6` là phần **không có bản Anh nào** ở bất kỳ bài nào trong kho: `sukhavedaniya` / `dukkhavedaniya` / `adukkhamasukhavedaniya` và cả `dvinnaṁ kaṭṭhānaṁ saṅghaṭṭanasamodhānā` (thành ẩn lửa khi cọ hai khúc củi). Thuật ngữ chọn theo tiền lệ đếm được: `sukhavedanā` → *cảm thọ dễ chịu* (35 khoá) · `dukkhavedanā` → *cảm thọ đau khổ* · `adukkhamasukhavedanā` → *cảm thọ không khổ không vui* (mẫu *không khổ không vui* 4 khoá so với *không khổ không lạc* 3) · `phassa` → *xúc* · `vedayita` → *được cảm nhận* · `nirodha` → *chấm dứt* · `vūpasammati` → *dừng lại*.
  Ba bản lặp `3.5` / `3.7` / `3.9` giữ nguyên **cả hai lần** lặp `sukhavedaniyaṁ phassaṁ paṭicca uppannā sukhavedanā` của Pāli — đó là vế tương ứng trong cấu trúc `X nirodhā / X paṭicca uppannā Y / Y nirujjhati`, cắt bớt là mất quan hệ nhân quả.
  Dấu lược: Pāli có `…pe…` ở **một** khoá (`4.3`) và `…` trần ở `4.4`; cả hai khoá Việt giữ **đúng một** `…`, không mở rộng, cũng không dùng `…` để nén thêm. Đếm bằng `lược()` của `_hvi.py`.
  `notes` ở đây là khối literal `|-` thụt 2 đặt ở GỐC file, đúng như `content/meta/sutta/sn/sn12.61.yaml` (đã đọc mẫu đích trước khi ghi).
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy — lát agent này không chạy bốn lệnh đó, nên `technical_integrity` đặt 9.6 chứ không 10.0. Tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài.
