    tầng sau khi sửa: Pāli có `nibbānapabbhāra*` ở 87 khoá / 32 bài, **0
    khoá** nào còn dịch vế ba bằng *có dòng*. Ghi chú cũ của tệp này có nêu *…
    bến …, … dòng về phía …* như nguyên văn dùng lại / như tiền lệ đếm được;
    nay bị mục này thay thế, không xoá, để lịch sử còn đọc được. Hạ
