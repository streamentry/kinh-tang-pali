notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato (34/35 khoá có chữ). Coverage English đo theo `source/layers.yaml` = 17/17 khoá Pāli có nội dung = 100%, trên ngưỡng 0.8, không cần ghi vào `content/meta/reference-gaps.yaml`.
  0.1 giữ `Saṁyutta Nikāya 15.13` nguyên văn như 1562 tệp `sn` khác trên đĩa. 0.2 theo tiền lệ 90 lần.
  Tiền lệ cho danh sách tu sành: `sn16.8:2.2` và `sn16.8:5.1` — āraññikā = sống ở rừng, piṇḍapātikā = đi khất thực, paṁsukūlikā = mặc y phấn tảo, tecīvarikā = chỉ dùng ba y. Dùng lại nguyên văn, cả ở 1.2 lẫn 1.4 (Pāli lặp nguyên văn).
  Cụm `… sandhāvataṁ saṁsarataṁ sīsacchinnānaṁ lohitaṁ passannaṁ paggharitaṁ` xuất hiện 5 lần với hai biến thể nhỏ; dịch nhất quán một cách ở cả năm.
  `…pe…` ở 3.4, 3.5, 3.14 giữ đúng MỘT dấu lược; 3.6–3.9 chỉ có `…` ở cuối nên chỉ một dấu, không thêm dấu ở đầu (lần đầu viết thêm đã bị `kiểm` bắt và sửa).
  BẤT ĐỊNH nhỏ: 2.2 `Pubbā koṭi na paññāyati` — dùng lại nguyên văn tiền lệ 5 lần (Không thấy được khởi điểm của các chúng sinh…), vốn không phiên dịch riêng `pubbā koṭi` (hàng trăm nghìn triệu); chọn theo đa số đo được.
  Ba khoá 3.10–3.12 phân biệt `gāmaghātā` / `pāripanthikā` / `pāradārikā` bằng ba cách Việt khác nhau (phá làng / đường / đội) để không làm phẳng ba tội nặng.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` do coordinator chạy; `npm run build` chỉ cần thêm cho bài `published`. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
