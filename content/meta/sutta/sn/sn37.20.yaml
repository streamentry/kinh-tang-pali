notes: |-
  Khuôn cùng phẩm Chuỗi Lặp Thứ Hai: sn37.19:1.1 Vị ấy không ham mua sắm,
  mà có tuệ … và sn37.21:1.1 Vị ấy đa văn, mà có tuệ ….
  sīlavā → có giới hạnh (giới hạnh 348 lượt, nhà thuật ngữ của kho).
  Đoạn …pe… lược dãy phẩm hạnh mẫu (Sujato mở rộng: faithful,
  conscientious, prudent, ethical, and wise); bản Việt giữ khung + … như
  hai bài kề, không mở rộng diễn giải vào thân kinh.
  Không có bản Việt hiện hành để đối chiếu; triangulation 8.5.
  technical 9.5 vì agent lát không được chạy npm validate, mới chỉ qua
  chốt _hvi (đủ khoá, NFC, ngoặc, dấu lược).
