notes: |-
  Đợt 19, lát l25. Dịch từ Pāli root đã ghim, đủ 85/85 khoá, không khoá nào ngoài tập khoá Pāli; đối chiếu bản Anh Sujato đã ghim ở mức từng segment, lớp lấp `english-project` của chính dự án (14 khoá Sujato để trống), và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (Bình Anson hiệu đính) ở mục tra cứu toàn văn — bản này không căn lề theo segment, chỉ dùng để đối chiếu thuật ngữ và mạch lập luận.

  **Trạng thái `draft` — vì sao.** Coverage Sujato đo thật trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`, theo `source/layers.yaml`): mẫu số **41**, Sujato phủ **27/41 = 0,6585**, dưới sàn 0,80. 14 khoá có nội dung do Sujato để trống: `4.2` `4.3` `4.4` `4.5` `4.6` `5.1` `5.2` `5.4` `5.5` `5.6` `5.7` `6.1` `6.2` `6.3` — chính là đoạn Anurādha kể lại toàn bộ cuộc trò chuyện với Đức Thế Tôn. Lớp lấp `english-project` (`content/meta/en/sn/sn22.86.yaml`, status `published`) bù đủ 14/14, nên cổng đếm tổng hai tầng là 41/41 = 1,0000; nhưng lớp lấp do cùng họ công cụ với bản Việt này viết, **không phải một lần đọc Anh độc lập**. Theo luật của lát — Sujato dưới 0,80 thì bài giữ `draft` kèm blocker, không nâng điểm để né — `triangulation` đặt 7,8 (≤ 8,0) và status `draft`. Tầng `vietnamese-current` không có bài này (manifest ghim chỉ 26 tệp Pháp Cú): đó là giới hạn của ảnh chụp upstream, không phải thiếu sót của kho. Hai khoá dưới ngưỡng 40 ký tự mà Sujato cũng để trống (`5.3` Pāli 39 ký tự, `13.3`) nằm ngoài mẫu số. Muốn lên `review`/`published`, cần một lần đọc Anh độc lập cho 14 khoá trên (hoặc người biên tập quyết định cổng nên tính lớp lấp là độc lập); bản dịch Việt không đổi theo quyết định đó.

  **Pāli trùng nguyên văn.** Trong tầng đã dịch (`sn`/`mn`/`dn`/`an`), 29 khoá của bài này có Pāli trùng nguyên văn (so sau khi chuẩn hoá khoảng trắng) với khoá ở nơi khác, tổng **3.138** cặp. Dùng lại đúng cách dịch đa số ở **23/29** khoá: `0.2` (19/21), `7.2` (25/35), `7.3` (40/66), `7.5` (29/70), `7.8` `8.3` `8.8` `9.3` `9.5` `9.14` `10.3` `11.3` `12.4` (57/254; trong sn22 là 17/23), `7.9` (18/23), `7.10` (46/53), `7.11` (44/53), `7.12` (23/30), `7.13` (16/18), `7.15` (5/6), `7.16` (1/1), `8.5` (10/24), `8.6` (11/26), `13.3` (xem dưới). Ba khoá khác đa số vì ngữ cảnh: `1.1` (Đức Phật 5/20 hoà với *an trú* 5/20, chọn dạng gần `sn22.60:1.2`), `7.4` (toàn tầng 25 so với 19 của dạng đã chọn; trong sn22 là 4/4 hoà) và `7.7` (toàn tầng 26 so với 23, nhưng trong sn là 23/31 và trong sn22 là 4/4 theo dạng đã chọn). `7.6` có Pāli trùng khi bỏ dấu phẩy: toàn tầng 29 *có tính biến đổi, có nên xem như vầy* so với 5 của dạng đã chọn; trong sn là 8 so với 5 và trong sn22 hoà 2/2 — chọn dạng gần cùng cụm 7.7 đã chọn của sn22. `9.8` và `9.10` dịch *ở trong …* vì ở đây là định vị của Như Lai (*Như Lai ở trong tưởng / các hành*), khác ngữ cảnh *đối với tưởng* của các bài khác. `13.3` *Catutthaṁ*: toàn tầng *Thứ tư* 151 so với *Thứ bốn* 89, nhưng trong sn22 là *Thứ bốn* 8 so với *Thứ tư* 5; chọn *Thứ tư* (tiếng Việt chuẩn, đa số toàn tầng) — người điều phối có thể gộp lại nếu muốn theo sn22.

  Pāli trùng nguyên văn **trong chính bài**: 2 nhóm — `Taṁ kiṁ maññasi, anurādha,` (5 khoá: `7.1` `8.1` `9.1` `10.1` `11.1`) và `No hetaṁ, bhante`. (9 khoá: `7.8` `8.3` `8.8` `9.3` `9.5` `9.14` `10.3` `11.3` `12.4`): 10 + 36 = **46** cặp, **0** cặp bản Việt khác. Ngoài ra `2.2`/`5.2`/`1.5`/`4.4`/`12.2` (khác nhau chỉ ở dấu câu và ngoặc, và ở `āvuso anurādha` so với `āvuso`) và `2.3`/`1.6`, `2.5`/`5.6` dùng cùng một cách dịch, chỉ khác nháy/ngoặc theo Pāli từng khoá.

  **Thuật ngữ — đếm trước khi chốt.**
    - `tathāgato` → *Như Lai* (theo sn44). Bốn lập trường: *Như Lai tồn tại / không tồn tại / vừa tồn tại vừa không tồn tại / phi tồn tại phi phi tồn tại sau khi chết*. Dạng *phi tồn tại phi phi tồn tại* là đa số trong sn44 và toàn tầng (27 khoá, trong sn cũng 27; so với *chẳng tồn tại chẳng không tồn tại* 8 và *không có Như Lai … mà cũng không không có* 14), cùng quy ước với *phi tưởng phi phi tưởng*.
    - `paññāpayamāno paññāpeti` / `paññapemi` → *tuyên bố* (mn22:37.5 cho đúng câu `Pubbe cāhaṁ … dukkhañceva paññāpemi, dukkhassa ca nirodhaṁ`); mn78 dùng *mô tả*, sn35.83 *trình bày*, nên đây là chọn có chủ ý, nhất quán trong cả bài (1.5, 2.2, 4.4, 5.2, 12.2, 13.2).
    - `uttamapuriso paramapuriso paramapattipatto` → *bậc tối thượng, bậc cao quý nhất, đã đạt đến chỗ tối thượng* (sn44.9:2.5, 3.8, 4.4 — 3 khoá cùng ba từ).
    - `aññatitthiyā paribbājakā` → *du sĩ ngoại đạo* (74/164 khoá toàn tầng, 20/38 trong sn; sn22 chưa có khoá nào cùng cụm; so với *du sĩ đạo khác* 36 toàn tầng và 6 trong sn); `araññakuṭikā` → *túp lều nơi hoang vắng* (mn125, mn136; sn4.20 *túp lều nơi rừng vắng*, sn2.25 *am thất*).
    - `vedanā` (uẩn) → *cảm thọ*: trong sn22 là 150/240 khoá chứa Pāli `vedan-` so với *thọ* 90; `saññā` → *tưởng*, `saṅkhārā` → *các hành*, `viññāṇa` → *thức*.
    - `bhante` → *bạch Thế Tôn* (Anurādha thưa Đức Phật); `āvuso` → *hiền giả* khi gọi một người, *các hiền giả* khi gọi cả nhóm du sĩ (2.2, 5.2, 12.2); Đức Phật gọi Anurādha là *ngươi* (sn22.88, sn22.97). `bhagavā` kể chuyện → *Đức Thế Tôn* (trong sn22: *Đức Thế Tôn* 32, *Thế Tôn* 18, *Đức Phật* 6; trừ công thức mở bài `Một thời, Đức Phật …` theo sn22.60:1.2).
    - `vuttavādī … dhammassa cānudhammaṁ byākareyyaṁ … sahadhammiko vādānuvādo gārayhaṁ ṭhānaṁ āgaccheyya` (3.3, 6.3) → *nói đúng lời Đức Thế Tôn, … giải thích đúng chánh pháp, … không có lập luận hợp pháp nào đưa đến chỗ đáng bị chê trách* theo sn45.5, sn42.10, sn12.25.
    - `kallaṁ nu` → *có hợp lý chăng* (7.6, 12.1); `samanupassasī` → *ngươi có xem … chăng* (mn144:9.1 dùng *xem*, sn35.72 dùng *quán sát*, bản Thích Minh Châu *quán*).

  **Số Pāli.** `catūsu ṭhānesu` / `catūhi ṭhānehi` = catu **4** → *bốn trường hợp*, và danh sách đủ đúng bốn mục (hoti / na hoti / hoti ca na ca hoti / neva hoti na na hoti); `Catutthaṁ` = **4** → *Thứ tư* (bài thứ tư của Phẩm Trưởng Lão: sn22.83 là bài thứ nhất, sn22.86 là bài thứ tư); `ekamantaṁ` = *một bên*. Không có số lớn, không có cụm số chưa phân xử.

  **Bất định đã ghi — không đưa vào thân kinh.**
    - **Chủ ngữ của `taṁ tathāgato … paññāpayamāno paññāpeti` (1.5, 2.2, 4.4, 5.2, 12.2).** Pāli đặt `tathāgato` ở chủ cách và `taṁ` (vị ấy) ở đối cách. Sujato đọc *khi một vị Như Lai tuyên bố về một vị Như Lai*; bản Thích Minh Châu đọc *bậc Như Lai ấy được xem là đã tuyên bố*. Bản Việt giữ đúng cấu trúc tương liên của Pāli (*vị Như Lai nào … thì khi Như Lai tuyên bố về vị ấy, Như Lai tuyên bố …*), không chọn nghĩa nào trong hai.
    - **Dấu hỏi ở `1.6`, `4.6`.** Pāli kết `vā”ti?` ở hai khoá mà Sujato và Thích Minh Châu đều dịch như lời trình bày, không phải câu hỏi (4.6 còn là lời Anurādha kể lại). Bản Việt kết bằng dấu chấm. Ngược lại `12.3` thật sự là câu hỏi (`kallaṁ nu te taṁ veyyākaraṇaṁ`) nên giữ dấu hỏi.
    - **`5.6` Pāli `na vo bhavissati`**, trong khi `2.5` là `navo bhavissati`. Cụm `na vo bhavissati acirapabbajito` không có ở nơi nào khác trong tầng Pāli đã ghim; `vo` không thể là chủ ngữ ngôi ba của `bhavissati`. Bản Việt đọc `na vo` là `navo` viết tách và dịch giống `2.5`; lớp lấp `english-project` cũng đọc như vậy. Đây là lựa chọn biên tập được nêu ra, không phải sự thật đã phân xử. `abyatto` → *thiếu năng lực* theo Sujato (*incompetent*); sn47.8 có *không khéo léo* cho `bālo abyatto akusalo`.
    - **`10.2`.** Pāli `rūpaṁ … vedanā … saññā … saṅkhārā … viññāṇaṁ tathāgatoti samanupassasī` — Thích Minh Châu đọc là cả năm uẩn gộp lại là Như Lai; Sujato đọc *one who has form …* (người có sắc …). Bản Việt giữ nguyên các dấu lược của Pāli (4 dấu `…`) nên không chọn nghĩa nào. `11.2` `ayaṁ so arūpī … aviññāṇo` → *cái ấy, không có sắc … không có thức* (Sujato *that one who is without form*, Thích Minh Châu *cái phi sắc, phi thọ …*); `ayaṁ so` dịch *cái ấy*, không *người ấy*, vì Pāli không nói là người.
    - **`7.16` `nāparaṁ itthattāyāti pajānāti`** → *vị ấy biết rõ: không còn gì là tự thân nữa* — theo đa số tầng (55 trong 83 khoá, trong sn22 là 16/19; sn22.95:7.3 giống hệt). Đây là quy ước của tầng và **không** diễn đạt sát `itthattāya` (*trạng thái này*): Sujato dịch *there is nothing further for this place*, bản Thích Minh Châu dịch *không còn trở lui trạng thái này nữa*. Chưa sửa theo luật *đo tiền lệ trước khi sửa*; người biên tập có thể cân nhắc thống nhất lại toàn tầng.
    - **`12.1` `ettha` … `saccato thetato … anupalabbhiyamāne`** → *và ở đây … như một sự thật chắc chắn* (mn22:25.5, an3.61:3.2); bản Thích Minh Châu đọc *thường còn, thường trú*. Bản Việt giữ nghĩa *thật, chắc chắn*.
    - **`13.2` *điều Ta tuyên bố chỉ là khổ và sự chấm dứt khổ*** theo mn22:37.5 cho cùng câu; Sujato ở đây không dịch *only* (`what I describe is suffering and the cessation of suffering`), nên chữ *chỉ* là của tiền lệ mn22, không phải của riêng bài này.
    - **Sujato mở rộng im lặng** ở `7.14` (`So you should truly see …`) và `7.16` (`They understand: '… there is nothing further for this place.'`) — thêm chữ không có ở Pāli, và bản Việt không bám theo; Pāli ở đó chỉ có `tasmātiha …pe…` và `nāparaṁ itthattāyāti pajānāti`.
    - **Chuẩn `5.2`.** Pāli mở `“` ở `5.2` mà khối 5 không đóng (khối 2 đóng ở `2.3`); `5.4` kết `’ti vāti.` không có `”`. Bản Việt bám đúng Pāli từng khoá, không tự cân.
    - Câu Pāli `1.2` `araññakuṭikāyaṁ` và `4.2` nói rõ Anurādha ở *không xa Đức Thế Tôn*; bản Việt không nói thêm đó là ở Vesālī hay ở Đại Lâm ngoài `1.1`.

  **Dấu lược và nháy.** `…pe…` ở 8 khoá (`4.1` `4.3` `5.3` `7.13` `7.14` `7.15` `9.6` `9.7`) đều thành **một** `…`; dấu `…` trần ở 15 khoá (`4.5` `7.9` `7.10` `7.11` `8.4` `8.5` `8.6` `9.8`–`9.12` `10.2` `11.2` `12.3`) giữ đúng số lượng (`10.2` và `11.2` mỗi khoá 4, `12.3` 3). Pāli không có `(…)` nên bản Việt cũng không có. Nháy đơn `‘’` và ngoặc kép `“”` khớp Pāli **từng khoá**: 0/85 lệch (mẫu số 85).

  **Phép kiểm đã chạy, có mẫu số.** Tập khoá Việt = tập khoá Pāli: 85/85, thứ tự khoá trùng thứ tự Pāli. Nháy theo khoá: 0/85 lệch. Dấu lược `…pe…` và `…` trần: 0/85 lệch. Pāli trùng nguyên văn trong chính bài: 2 nhóm / 14 khoá / 46 cặp / 0 cặp Việt khác. NFC, khoảng trắng đầu/cuối, hai dấu cách liền: 0 lỗi / 85. Pāli lọt sang Việt (trừ tên riêng): 0 / 85. Đã đọc đối chiếu cặp Pāli↔Việt cả 85 khoá. Phép kiểm số Pāli: bài này chỉ có số `catu` (bốn) và `Catutthaṁ` (bốn), đều tự tính ở trên; không có cụm số ghép nên phép đo máy cho bài này đóng góp 0 cặp.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` và `npm run build`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
