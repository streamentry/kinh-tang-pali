notes: |-
  Dịch mới từ Pāli root (snapshot SuttaCentral/Bilara đã ghim), đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không phải cột), rồi viết lại bằng tiếng Việt. Đủ 99/99 khoá, thứ tự khoá đúng thứ tự Pāli, không khoá thừa.

  COVERAGE ENGLISH (đo thật): Pāli có nội dung (từ 40 ký tự sau nén khoảng trắng, bỏ khối :0.x) = 81 khoá. Bản Sujato phủ độc lập 56/81 = 0,691, DƯỚI ngưỡng 0,80. Sujato để trống 25 khoá dù Pāli viết đầy đủ: 11.2–11.3, 12.1–12.3, 13.1–13.3, 14.1–14.2, 15.1–15.3, 16.2–16.3, 17.1–17.3, 18.1–18.3, 19.1–19.4 (toàn bộ phần định nghĩa bốn lỗi của tinh tấn và tâm, và phần lặp về tưởng ánh sáng). Lớp english-project của dự án chưa có tệp cho bài này nên không có gì lấp thêm; kể cả khi có, lớp đó do chính người dịch viết nên không phải cách đọc Anh độc lập. Vì vậy bài giữ status draft kèm blocker nêu rõ, triangulation hạ xuống 7,2 và các khoá trên chỉ dựa vào Pāli, vào chính các khoá song song trong bài (3.1–6.3 và 20.1–23.3 cùng khuôn với 11–19, Sujato dịch đủ) và vào bản Thích Minh Châu nguyên bài. Cần lấp 25 khoá bằng english-project (hoặc ghi nhận trong reference-gaps) rồi chạy lại cổng; không nâng điểm để né blocker.

  Pāli trùng nguyên văn TRONG CHÍNH bài: 8 nhóm (2.4/2.13, 2.5/2.14, 2.6/2.15, 2.8/2.17, 10.1/15.1, 10.2/15.2, 10.3/15.3, 19.4/23.4), cả 8 nhóm bản Việt giống nhau, 0 nhóm lệch. Pāli trùng với bài khác trong tầng: 24 khoá có cặp trùng (chủ yếu với sn51.11, sn51.12, sn51.14, sn51.21, sn51.31, mn119:7.2); dùng lại nguyên văn bản đã công bố cho 0.2, 0.3, 2.1, 2.2, 2.5, 2.6, 2.8, 2.9, 2.10, 2.14–2.17, 8.3 (cùng danh sách 31 phần thân với mn119:7.2), 23.5, 24.3, 25.0; chỗ khác tiền lệ có lý do ghi dưới đây.

  Thuật ngữ đã đo trên tầng: `iddhipāda` → như ý túc (đa số trong sn51); `chanda` → dục; `vīmaṁsā` → quán sát (7 so với 3 + 2 + 1 ở các khoá có cùng Pāli của sn51.18/19/23, sn51.12/14, sn51.25/26, sn51.15); `atilīna` → quá thụ động chùng chình và `atippaggahita` → quá nỗ lực căng thẳng (đúng như sn51.12:1.4, sn51.14, sn51.31: 3 khoá; sn51.11 viết quá chùng chình / quá căng thẳng: 4 khoá; sn51.21 viết quá thụ động / quá kích động: 2 khoá); `ajjhattaṁ saṅkhitta` → co rút bên trong (25 khoá); `bahiddhā vikkhitta` → phân tán ra bên ngoài; `sahagata` → câu hữu (34 khoá so với 6 khoá `đi cùng`); `sampayutta` → tương ưng; `kosajja` → biếng nhác (6 khoá ở 5 bài, so với lười nhác 8 khoá nhưng chỉ ở an10.76); `uddhacca` đứng riêng → trạo cử (18 khoá); `thinamiddha` → hôn trầm và buồn ngủ; `pañca kāmaguṇe` → năm dục trưởng dưỡng (24 khoá so với 7 khoá dục công đức); `ārabbha` → dựa vào (45 khoá); `ālokasaññā` → tưởng ánh sáng, `divāsaññā` → tưởng ban ngày (an4.41, an7.61, dn33); `suggahitā sumanasikatā sūpadhāritā suppaṭividdhā paññāya` → khéo nắm giữ, khéo tác ý, khéo thọ trì, khéo thấu suốt bằng tuệ (sn22.2:4.4); `cetovimutti paññāvimutti` → tâm giải thoát và tuệ giải thoát (34 khoá so với 13 khoá dạng ngắt phẩy). Tên phẩm `Pāsādakampanavagga` → Phẩm Vui Vẻ (9 khoá cùng Pāli ở sn51.11–19/21), tên kinh `Vibhaṅgasutta` → Kinh Phân Tích (3/3: sn12.2, sn45.8, sn47.40). Số: chỉ có bốn (cattāro iddhipādā), năm (pañca kāmaguṇe) và danh sách thân 31 phần (đếm: 5 + 5 + 5 + 5 + 5 + 6 = 31, khớp 31 mục Pāli của khoá 8.3).

  BẤT ĐỊNH VÀ CÁC CÂU NGHĨA ĐEN DỄ LỆCH VĂN CẢNH (không thêm vào thân kinh):
  - `anuvikkhitto anuvisaṭo` (6.2, 14.2, 19.2, 23.2) không có tiền lệ trong tầng (0 khoá). Tiền tố `anu-` có thể là lặp lại thường xuyên (Sujato: frequently scattered and diffused) hoặc là đi theo sau đối tượng; Thích Minh Châu viết bị phân tán, bị phân ly. Đã chọn bị phân tán, bị lan tỏa theo, không gánh nghĩa tần suất; không có bằng chứng độc lập để phân xử.
  - `atippaggahita`: Thích Minh Châu viết quá hăng say, tầng dự án đã chọn quá nỗ lực căng thẳng (sn51.12, 51.14, 51.31); giữ theo tầng để nhất quán trong cùng nhóm bài, nghĩa Pāli là quá được nâng đỡ / quá căng, đối lập với atilīna.
  - `yehi ākārehi yehi liṅgehi yehi nimittehi` (9.2–9.3): Thích Minh Châu viết hành tướng, đặc tướng, nhân tướng; tiền lệ dn15:20.2 viết hình thái, dấu hiệu, đặc trưng. Đã chọn hình thái, đặc điểm, dấu hiệu để ba từ không trùng nhau và `nimitta` vẫn là dấu hiệu như đa số (87 khoá) tầng; đây là lựa chọn biên tập, không có tiền lệ cùng bộ ba trong sn.
  - `svādhiṭṭhitā` (10.2/15.2): Thích Minh Châu viết khéo an trú, tiền lệ an4.41/an7.61 dùng quyết định cho `adhiṭṭhāti`; đã chọn khéo quyết định.
  - `Pacchāpuresaññī ca viharati` (2.4/2.13): sn51.12 thêm chữ bình đẳng (6 khoá), sn51.11 không thêm (6 khoá); Pāli không có từ ấy nên đã bỏ.
  - Không thêm ‘…’ quanh `iti me chando …` (2.3/2.12) dù sn51.12 có: Pāli ở khoá này không có dấu nháy; giữ khớp Pāli từng khoá.
  - Pāli 1.1 vừa mở vừa đóng nháy kép, 24.2 lại đóng thêm một lần (”ti): giữ đúng như Pāli từng khoá, không tự cân bằng.
  - `vīmaṁsā` còn nhiều cách dịch trong sn51 (quán, quán sát, khảo sát, thẩm sát, thẩm xét); đã chọn đa số trên các khoá cùng Pāli; chờ biên tập thống nhất nếu muốn.
  - 25.4 `Desanā` trong bài tóm lược đã dịch Lời Giảng, theo hình thức kệ tóm lược Phẩm Lá Câu (sn51.10).
  - Tên phẩm Phẩm Vui Vẻ lệch với Sujato (Shaking the Stilt Longhouse), phân kỳ đã nêu ở các bài cùng phẩm; giữ đa số.

  Dấu lược: Pāli có 6 khoá chứa dấu lược (2.9, 2.10, 14.2, 19.3, 23.3, 24.1; mỗi khoá 1 dấu); bản Việt khớp 6/6, `…pe…` → đúng một `…`, và 14.2 (Pāli kết …pe…. ) kết ` ….`. Không có `(…)`.

  Lượt đối chiếu cặp Pāli với Việt đã in và đọc đủ 99 khoá; nháy đơn và nháy kép khớp Pāli từng khoá 99/99; NFC, khoảng trắng và Pāli lọt sang bản Việt: 0 lỗi (ngoài `Saṁyutta Nikāya` ở 0.1, đúng theo tiền lệ).

