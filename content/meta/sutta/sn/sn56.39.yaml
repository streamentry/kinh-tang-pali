notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở commit 11c9d708. Không có bản Việt tham khảo: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên tầng `vietnamese-current` không phủ bài này và triangulation chỉ dựa trên Pāli + Sujato.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  0.2 `Sīsapāvanavagga` chọn 4. Phẩm Rừng Sīsapā theo đa số đếm được (sn56.31, sn56.32, sn56.35 ba phiếu), bỏ 4. Phẩm Cây Chày (một) và 4. Phẩm Rừng Huyết Dụ (một); cả ba đều là cách dịch của cùng một tên phẩm, ghi ở đây để người biên tập thống nhất.
  0 tiền lệ cho `Indakhīlasutta`: 0 cặp Pāli trùng nguyên văn. Đặt Kinh Cột Trụ Của Inda, giữ tên riêng theo bản Anh (Indra’s pillar) và dùng cột trụ vì tầng đã dùng cụm này 35 lần.
  Dùng lại nguyên văn sn56.43:3.2 cho 1.1; sn56.42:3.1 cho 3.1; sn56.47:3.5 cho 2.9; sn56.38:3.5 cho 4.11; sn56.38:4.1 cho 5.1; sn56.48:1.3 và mn129:24.2 cho 2.2 (gió đông tây bắc nam).
  `bhavanta` dịch là Đáng Kính theo đa số (51 lần) thay vì thánh đế; `yogo karaṇīyo` dịch là cần gắng sức theo nguyên văn sn56.38:4.1.
  Lượt review đối kháng bắt được 1 lỗi nghĩa chữ: `picu` là búi, bản nháp đầu dịch là túi (túi = túi đồ). Đã sửa cả 2.1 và 2.4.
  Bất định đã ghi: 4.4 trả lời lý do chỉ cho cột trụ của Inda, không cho cột trụ sắt, vì Pāli cũng vậy (indakhīlassa). Bản Việt giữ nguyên và không thêm lý do chung cho cả hai.
  Dấu lược: 4.2 có HAI …pe… nên bản Việt giữ hai …; 1.1, 2.5, 3.1, 4.5, 4.11, 5.1 mỗi khoá một …. Đã đối chiếu lại bằng hàm lược của harness.
  Coverage tầng Anh trên Pāli có nội dung (21 segment) là 21/21 = 100%. Không cần ghi nhận gap.
