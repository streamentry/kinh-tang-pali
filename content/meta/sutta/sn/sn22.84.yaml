notes: |-
  Đợt 19, lát l29. Dịch từ Pāli root đã ghim, đủ 93/93 khoá, không khoá nào ngoài tập khoá Pāli; đối chiếu bản Anh Sujato đã ghim ở mức từng segment, lớp lấp `english-project` của chính dự án (4 khoá Sujato để trống) và bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục tra cứu toàn văn — bản này không căn lề theo segment, chỉ dùng để đối chiếu thuật ngữ và mạch lập luận.

  **Coverage Anh.** Đo theo `source/layers.yaml` (Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`): mẫu số **35**, Sujato phủ **31/35 = 0,8857**, trên sàn 0,80. 4 khoá có nội dung do Sujato để trống: `2.2`, `2.3`, `4.7`, `7.7`. Lớp lấp `english-project` (`content/meta/en/sn/sn22.84.yaml`, status `published`, người chấm khác người dịch bản Việt này) bù đủ 4/4, nên tính cả hai tầng là 35/35 = 1,0000; nhưng cổng đã đạt chỉ với Sujato nên không dựa vào lớp lấp. Vì 4/35 khoá chỉ có lớp lấp của dự án làm tham khảo Anh (hai khoá `2.2`/`2.3` là lời kể lại `1.2`/`1.3`, hai khoá `4.7`/`7.7` là câu hỏi lặp công thức), `triangulation` đặt 9,0, không cao hơn. Tầng `vietnamese-current` không có bài này (manifest ghim chỉ 26 tệp Pháp Cú): đó là giới hạn của ảnh chụp upstream, không phải thiếu sót của kho. Các khoá dưới 40 ký tự mà Sujato cũng để trống (`4.4`–`4.6`, `5.1`, `5.2`, `7.4`–`7.6`, `8.1`–`8.2`) nằm ngoài mẫu số. Entry trong `content/meta/reference-gaps.yaml` không cần cho bài này vì coverage không dưới ngưỡng.

  **Pāli trùng nguyên văn.** Trong tầng đã dịch (`sn`/`mn`/`dn`/`an`/`kn`), 26 khoá nội dung của bài này có Pāli trùng nguyên văn với khoá ở nơi khác, tổng **2.530** cặp. Dùng đúng cách dịch đa số ở **21/26** khoá: `1.1` (449/470), `2.1` (5/21), `3.1` (4/13), `3.8` `3.11` `4.8` `5.4` (45/132), `4.5` `7.5` (9/27), `6.6` `7.8` (82/284), `8.5` (27/38), `8.6` `8.11` (46/74), `8.7` (20/25), `8.8` (48/55), `8.9` (47/56), `8.10` (24/32), `8.13` (6/7), `9.4` (5/26), `11.3` (280/284). Năm khoá khác dạng đa số vì lý do đã đo:
    - `4.4`/`7.4` `vedanāya …` — ba bản đã dịch đều chỉ 1 khoá mỗi dạng (*đối với thọ …*, *Với cảm thọ …*, *Này Vaccha, vì không thấy cảm thọ …*), không có đa số; chọn *đối với cảm thọ …* cho song song với `4.5` *đối với tưởng …* (đa số 9/27).
    - `8.12` `“Tasmātiha …pe…` — chỉ có 1 khoá trùng (`sn22.93:1.22`, *Nên, này các tỳ-kheo, …*) mà ở đó Đức Phật gọi các tỳ-kheo; ở bài này chỉ nói với Tissa và ngay trước đó `8.7`–`8.11` là hỏi đáp, nên dịch *Vì vậy …* theo `sn22.83:4.9` (cùng công thức trong sn22, 1 khoá).
    - `8.14` `nāparaṁ itthattāyāti pajānāti.` — toàn tầng 6 khoá trùng: *vị ấy biết: ‘Không còn trở lại trạng thái hiện hữu này nữa.’* 3 (đều ở dn/mn, là bản dịch theo Thích Minh Châu), *vị ấy biết rõ: không còn gì là tự thân nữa.* 1 (`sn35.150:15.4`), hai dạng khác 2. Trong sn thì đa số áp đảo (đo trên Pāli dài hơn có cùng cụm: 51/83 khoá là *không còn gì là tự thân nữa*), nên giữ quy ước của sn; không phải lần đầu: đây là quy ước của tầng chứ không sát chữ `itthattāya` (*trạng thái này*). Người biên tập có thể cân nhắc thống nhất lại toàn tầng.
    - `11.1` `Idamavoca bhagavā.` — toàn tầng *Đức Phật nói/đã nói như vậy* 108/192, *Đức Thế Tôn đã nói như vậy* 29, *Đức Thế Tôn nói như vậy* 31; trong sn22 là *Đức Thế Tôn đã nói như vậy* 3/5 (không có *Đức Phật*), nên chọn dạng gần.

  Pāli trùng nguyên văn **trong chính bài**: 9 nhóm — `Sādhu sādhu, tissa.` (5 khoá: `4.1` `5.1` `6.1` `7.1` `8.1`, tính đến dấu `“` đầu khoá thì đều giống nhau), `Evañhetaṁ, tissa, hoti.` (5), `“Evaṁ, bhante”.` (4), `“No hetaṁ, bhante”.` (2), `“Aniccaṁ, bhante”.` (2), `Taṁ kiṁ maññasi, tissa,` (2: `6.4` `8.4`), `vedanāya …` (2), `saññāya …` (2), `Tena muhuttaṁ gaccha.` (5) — tổng 20 cặp liên khoá, **0** cặp bản Việt khác. Hai khoá nhìn giống nhau nhưng Pāli khác nhau từng chữ (`3.9` có `“` đầu khoá so với `6.4`/`8.4`; `4.3`/`6.3` so với `7.3`/`8.3`: *avigata* và *vigata*) nên bản Việt cũng khác (*chưa hết* / *đã hết*).

  **Thuật ngữ — đếm trước khi chốt.**
    - `avigatarāgassa avigatacchandassa avigatapemassa avigatapipāsassa avigatapariḷāhassa avigatataṇhassa` → *chưa hết tham, chưa hết dục, chưa hết luyến ái, chưa hết khát khao, chưa hết nhiệt não, chưa hết khát ái*, theo đúng sáu mục này ở `sn23.2:2.2`–`2.3` (cùng cụm sáu từ, hai khoá); `sn22.3:10.2`–`11.2` dịch *thoát khỏi tham, ham muốn, yêu thích, khát khao, nhiệt não và khát ái*, `sn44.5:1.4` dịch *chưa hết tham, chưa hết ham muốn, chưa hết khốn khổ, chưa hết khát khô, chưa hết nóng bức, chưa hết ái* (2 khoá). Chọn dạng `sn23.2` vì khớp nhau ở cả sáu mục và có đủ cặp *chưa hết / đã hết* (`vigata-`).
    - `vipariṇāmaññathābhāvā uppajjanti sokaparidevadukkhadomanassupāyāsā` → *do sự biến hoại và trở thành khác của … ấy, sầu, bi, khổ, ưu, não có sanh khởi* (`sn22.8:1.7`, `sn22.43:2.5`; `sokaparidevadukkhadomanassupāyāsā` → *sầu, bi, khổ, ưu, não* 158 khoá trong tầng).
    - `madhurakajāto viya kāyo` → *thân … như bị dược chất làm cho uể oải* (`sn47.9:3.6`, `sn47.13:4.5`; `dn16:2.24.5` có *đờ đẫn*; `an5.56` có *nặng nề như say thuốc*, 4 khoá). `thinamiddhañca me cittaṁ pariyādāya tiṭṭhati` → *hôn trầm và buồn ngủ chiếm ngự tâm tôi* theo `an5.56:1.2`; `anabhirato ca brahmacariyaṁ carāmi` → *tôi sống phạm hạnh không vui thích* (`an5.56:1.2`). `abhirama` (10.14) → *hãy vui thích* để khớp `anabhirato` ở `1.3` (Sujato dịch *rejoice*; `ud3.2:10.1` *hãy vui thích*).
    - `pitucchāputto` → *con của cô* (pitucchā là chị/em gái của cha). `sn21.9:1.2` (khoá duy nhất trong tầng có cùng từ) dịch *con của dì*; Pāli nói cô (phía cha), Sujato dịch *cousin on his father's side*, nên đổi ở đây; số đếm: 1 khoá tiền lệ, không có đa số để theo.
    - `kodhūpāyāsa` → *sự giận dữ và bực bội* (`an4.122:2.12`, 10 khoá chứa `kodhūpāyās-`; `mn23` dịch *phẫn nộ và ưu não*). `kāmā` → *dục lạc* (`mn19:26.3` cho đúng câu `mahantaṁ ninnaṁ pallalanti … kāmānametaṁ adhivacanaṁ`); `mahantaṁ ninnaṁ pallalaṁ` → *khu đầm lầy thấp rộng lớn* (`mn19:25.1`, `mn19:26.3`). `dvedhāpatha` → *con đường hai ngã* (`mn23:4.16`; `dvidhāpatha` ở mn23, cùng nghĩa). `adhivacanaṁ` → *là tên gọi của* (`an8.85:1.1`, `mn23:4.6`).
    - `aṭṭhaṅgiko maggo` → *Thánh đạo tám ngành* (`sn12.27`, 399 khoá chứa `aṭṭhaṅgik-`); `micchāmagga` → *tà đạo tám ngành*; `micchādiṭṭhi … micchāsamādhi` → *tà kiến … tà định*, `sammādiṭṭhi … sammāsamādhi` → *chánh kiến … chánh định* (tầng: 5 và 2 khoá cho đúng đầu dòng `micchādiṭṭhiyā` / `sammādiṭṭhiyā`).
    - `Taṁ kiṁ maññasi, tissa` → *Này Tissa, ngươi nghĩ thế nào* theo sn22 (5 khoá dạng *ngươi* ở `sn22.86`, 1 dạng *ông*). `satthā` → *Bậc Đạo Sư* (`sn21.4:2.4`). `bhagavā` kể chuyện → *Đức Thế Tôn*; `āvuso` → *hiền giả*, *các hiền giả* khi Tissa nói với nhiều tỳ-kheo.
    - `Tena muhuttaṁ gaccha` → *Hãy đi theo đường ấy một lúc* (`mn107:14.12`, `14.21`; `muhutta` ở đó cũng là *một lúc*, Sujato ở bài này dịch *an hour*).

  **Số Pāli.** `dve purisā` = **2** người (một người không thông thạo đường, một người thông thạo; danh sách hai bên *hai người* và hai bên con đường: bên trái / bên phải). Các bước đường: ngã hai, rừng rậm, đầm lầy, vực, đất bằng — năm điểm, mỗi điểm đều có đúng một dòng `Tena muhuttaṁ gaccha` mở và một dòng `gantvā dakkhissasi` nối tiếp (5/5), và danh mục giải thích ở `10.5`, `10.6`–`10.9`, `10.10`–`10.13` đủ đủ năm điểm (ngã hai, rừng, đầm, vực, đất bằng) cộng hai đường trái/phải. `Dutiyaṁ` = **2** → *Thứ hai* (bài thứ hai của Phẩm Các Vị Trưởng Lão theo bản chụp; `sn22.83` là bài thứ nhất). Không có số lớn, không có cụm số chưa phân xử.

  **Bất định đã ghi — không đưa vào thân kinh.**
    - **`sobbhaṁ papātaṁ` (9.13, 10.12).** Dịch *vực thẳm*. Sujato dịch *large steep cliff*; bản Thích Minh Châu *vực nước sâu*. Pāli là hai từ (`sobbha` hố sâu / vũng; `papāta` vực, chỗ rơi xuống); không có tiền lệ cùng cụm trong tầng (0 khoá). Chữ *lớn, dốc đứng* của Sujato không có trong Pāli nên không đưa vào.
    - **`ahamovādena ahamanuggahena ahamanusāsaniyā` (10.15).** Pāli không có động từ. Bản Việt bổ sung *ở đây* và dạng *với …* theo Sujato (*I am here with advice, with support, with instruction*); bản Thích Minh Châu bổ sung động từ (*Ta giáo giới, Ta giúp đỡ, Ta giảng dạy*). Hai cách đọc đều khả dĩ; chưa phân xử.
    - **`anigatarāgassa` (5.3).** Hình thức Pāli đã ghim ở đây là `anigata-` chứ không phải `avigata-` như ở 3.10, 4.3, 5.3 (cụm sau); đây có vẻ là lỗi chép của bản ghim, vì ngữ cảnh và Sujato đều đọc *chưa ly tham* đối với các hành. Bản Việt dịch như `avigata-`. Không đoán `anigata-` là một từ khác.
    - **Dấu nháy của Pāli.** `8.12` mở `“` mà không đóng ở `8.14`; dấu đóng `”ti` nằm ở `10.15`. Bản Việt giữ đúng như Pāli từng khoá (8.12 mở, 10.15 đóng). `9.5` mở `‘` và `9.15` đóng `’`; `1.3` và `2.3` là cùng một lời của Tissa, một lần trực tiếp (`“…”`), một lần được các tỳ-kheo kể lại trong ngoặc đơn (`‘…’”`).
    - **`4.2`, `5.2`, `6.2`, `7.2`, `8.2` `Evañhetaṁ, tissa, hoti.`** → *Này Tissa, đúng là như vậy* theo Sujato (*That's how it is*); bản Thích Minh Châu *Như vậy là phải*. Cả hai cùng nghĩa.
    - **`4.3`–`4.7`, `5.3`, `7.3`–`7.7`.** Các khoá này bị lược nhiều dấu `…`; bản Việt giữ đúng số dấu lược của Pāli từng khoá (4.3 một, 4.4 một, 4.5 một, 4.6 một `…pe…`, 7.6 một) chứ không mở rộng. Sujato mở rộng thành câu đủ ở `4.3`, `6.3`, `7.3`, `8.3`; bản Việt không bám theo vì Pāli ở đó chỉ có dấu lược.
    - **`8.14` Sujato** thêm `They understand: ‘… there is nothing further for this place.’`; Pāli chỉ có `nāparaṁ itthattāyāti pajānāti` không có dấu nháy.

  **Dấu lược và nháy.** `…pe…` ở 4 khoá (`3.7`, `4.6`, `8.12`, `8.13`) và ở `10.7`, `10.9` đều thành **một** `…`; dấu `…` trần ở `4.3`, `4.4`, `4.5`, `7.3`, `7.4`, `7.5`, `7.6`, `8.7`, `8.8`, `8.9` giữ đúng số lượng Pāli (mỗi khoá một). Pāli không có `(…)` nên bản Việt cũng không có. Nháy đơn `‘’` và ngoặc kép `“”` khớp Pāli **từng khoá**: 0/93 lệch (mẫu số 93).

  **Phép kiểm đã chạy, có mẫu số.** Tập khoá Việt = tập khoá Pāli: 93/93, thứ tự khoá trùng thứ tự Pāli. Nháy theo khoá: 0/93 lệch. Dấu lược: 0/93 lệch. Pāli trùng nguyên văn trong chính bài: 9 nhóm / 20 cặp liên khoá / 0 cặp Việt khác. NFC, khoảng trắng đầu/cuối, hai dấu cách liền: 0 lỗi / 93. Pāli lọt sang Việt (trừ tên riêng *Tissa*): 0 / 93. Đã đọc đối chiếu cặp Pāli↔Việt cả 93 khoá.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check` và `npm run build` vì bài sẽ `published`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
