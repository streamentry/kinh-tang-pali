notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `18. Samuddavagga` → «18. Phẩm Biển». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 3.2, 3.5, 4.10 — «Do duyên cả hai mà khởi sanh dục tham, chính dục tham ấy mới là kiết sử nơi đó» → «Còn ham muốn và tham khởi lên ở đó do duyên cả hai ấy, thì chính điều ấy ở đó là kiết sử» (`yañca tattha tadubhayaṁ paṭicca uppajjati chandarāgo, taṁ tattha saṁyojanaṁ` — «ham muốn và tham» cho `chandarāgo` ở 62/156 khoá toàn tầng, «dục tham» chỉ 12; cấu trúc theo sn35.232:3.2, 3.6, 11.9). Giữ «kiết sử» (141/300 khoá chứa `saṁyojana` toàn tầng, và cả bài đã dùng) thay cho «sự trói buộc» của sn35.232; giữ nguyên khoá 3.4 vì cách đa số chỉ khác thuật ngữ này. Không đổi điểm.
