notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    **Mười bài anh em đã `published` có cùng Pāli hoặc cùng khung**, và bản Việt dùng lại **nguyên văn** của chúng: `sn22.111`/`sn22.112` (đúng Pāli `sn23.9`/`sn23.10`) · `sn29.10` (khung dāna-khetta, `sn29.3`/`sn29.11-20`) · `sn29.6` (`vossaṭṭhakāyā`) · `sn34.1` (khung bốn loại người tu định, `sn34.55`) · `sn34.6`/`sn34.7`/`sn34.15` (`gocarakusalo`, `abhinīhārakusalo`) · `sn34.53`/`sn34.54` (`sakkaccakārī`, `sātaccakārī`, `sappāyakārī`) · `sn35.78` (`anattā … chando pahātabbo`, `sn35.164`) · `sn35.166` (`kathaṁ nu kho, bhante, jānato …`, `sn35.165`/`sn35.167`) · `sn36.24`/`sn36.26` (cụm cảm thọ, `sn36.23`) · `sn38.8` (khung hỏi–đáp với Sāriputta, `sn38.2`/`sn38.4`/`sn38.7`) · `sn23.11` (`Nibbindaṁ virajjati…`, `sn35.60`) · `sn48.47` (`'khīṇā jāti…'`) · `sn45.42-47` (câu hỏi `samaṇe gotame`, `sn38.4`). **Những chỗ viết khác đều ghi rõ trong `notes` của từng bài.**
  - >-
    **Danh sách song song trong lát này đã bị lệch một chỗ và đã sửa** — ghi lại vì đó là loại lỗi mà máy không bắt được: ba danh sách được sinh bằng vòng lặp (mười món cho ở `sn29.11-20`, chín loại hương ở `sn31.4-12`, mười món cho ở `sn31.23-112`). Một `range` lệch một đơn vị làm **cả danh sách** dịch sai từ đó trở đi mà vẫn qua mọi chốt tự động. Đã đối chiếp từng khoá với Pāli sau khi sửa.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên **49.374 segment đã `published`**: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Khớp **49.179 / 49.374 = 99,14%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ (`hay` được miễn vì `vā…vā…vā` là cấu trúc).
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Sn 45–56 đã đủ: `Paṭhamamāravagga` → *1. Phẩm Ma Rối Lần Nhất* (`sn23.8`) · `Nāgavagga` → *1. Phẩm Rồng* (`sn29.1/10`) · `Supaṇṇavagga` → *1. Phẩm Kim Sí Điểu* (5 bài; `sn30.1` ghi *Phẩm Rồng* — **lệch**) · `Gandhabbavagga` → *1. Phẩm Càn-thát-bà* (3 bài) · `Jhānavagga` → *1. Phẩm Thiền Định* (`sn34.1`) · `Avijjāvagga` → *6. Phẩm Vô Minh* (`sn35.59`) · `Channavagga` → *9. Phẩm Channa* · `Yogakkhemivagga` → *11. Phẩm An Ổn Khỏi Ách* · `Navapurāṇavagga` → *15. Phẩm Cũ Mới* · `Nandikkhayavagga` → *16. Phẩm Đoạn Tận Hoan Hỷ* · `Devadahavagga` → *14. Phẩm Devadaha* · `Jambukhādakavagga` → *1. Phẩm Jambukhádaka*. **Ba phẩm 0 tiền lệ:** `Lokakāmaguṇavagga` → *12. Phẩm Dục Thuộc Thế Gian* · `Samuddavagga` → *18. Phẩm Biển* · `Khandhavagga` → *Phẩm Uẩn* (chỉ xuất hiện ở uddāna `sn34.55`). **Chỗ đang phân kỳ trong kho:** `Aṭṭhasatapariyāyavagga` — `sn36.28` ghi *Bát Pháp Chân Đắc*, `sn36.24/25/26` ghi *Một Trăm Linh Tám Cách*, `sn36.29/30` ghi *Tám Trăm Lần*; bài này theo `sn36.28` vì cùng nhóm số thứ tự. **Người biên tập nên thống nhất.**
  - >-
    **merged bundle** (9 bài `Sāragandhādidātāsuttanavaka`). Chín loại hương, theo **đúng thứ tự Pāli**: sắc hương · hương nước hoa · hương gỗ · hương vải vóc · hương lá · hương hoa · hương trái cây · hương vị · hương mùi hương.
  - >-
    **Lỗi lệch một chỗ đã bắt và sửa trong lượt review đối kháng:** vòng sinh `1.17–1.23` dùng `range` sai làm dịch lệch (`pheggugandhe` ra thành *hương gỗ*). Bản Việt nay khớp từng khoá với Pāli — đây là danh sách mà người đọc sẽ đối chiếu song song, lệch một là hỏng cả bảy.
  - >-
    Dùng lại **nguyên văn** `sn29.10:1.3/2.1–2.5*` cho khung hỏi–đáp. Tên phẩm `Gandhabbavagga` → *1. Phẩm Càn-thát-bà* (`sn31.2/3/13-22*`).
  - >-
    0 tiền lệ cho chín tên hương và `dātā` → *là người cho*; `adhivattha` → *trú ở* (viết gộp *sinh cộng trú với các vị thần trong …*). `1.16` mở ngoặc đơn và `1.24` đóng nó — phải giữ đúng vị trí vì đó là **một** lời hứa suốt tám khoá.
  - >-
    **Lượt cải thiện 2026-10-13 (kiểm toán mẫu).** Đọc đối kháng đủ 39 khoá thì bản cũ sai nặng, các ghi chú trên về "chín loại hương … đúng thứ tự Pāli" và "0 tiền lệ cho chín tên hương" **không còn đúng**. Đổi 32/39 khoá; 18 khoá sai nghĩa nặng, 14 khoá sai nhẹ (thuật ngữ, văn phong, dấu câu). **(1) Sai đối tượng của việc cho, `1.25–1.33`:** Pāli `so dātā hoti sāragandhānaṁ` là *người cho hương lõi cây* (sở hữu cách số nhiều của `gandha`, như `sn31.3:1.9` *người cho hương rễ*), bản cũ dịch thành *người cho các vị thần trong …*, tức đổi vật cho thành người nhận. **(2) Sai tên bốn loại hương đầu, `1.3–1.6`, `1.14`, `1.16–1.19`:** `sāragandha` đã dịch *sắc hương* (không có căn cứ; `sāra` là lõi cây), `pheggugandha` → *hương nước hoa*, `tacagandha` → *hương gỗ*, `papaṭikagandha` → *hương vải vóc*; sửa theo `sn31.1` đã published, cùng chuỗi Pāli: *hương lõi cây · hương giác cây · hương vỏ cây · hương vảy cây*. Vì thế `rasagandha` đổi *hương vị* → *hương nhựa cây* (`1.10`, `1.23`; Sujato *sap*), `gandhagandha` *hương mùi hương* → *hương thơm* (`sn31.1:1.15`), `pattagandha` *hương lá* → *hương lá cây*. **(3) `adhivatthānaṁ devānaṁ`** bản cũ *các vị thần trong …* làm rơi *adhivattha* (trú ở) và lệch `sn31.1`/`sn31.3` (*chư thiên trú ở hương rễ*); nay *chư thiên trú ở hương …* ở `1.3–1.11`, `1.14`, `1.16–1.24`, `1.34–1.35`. **(4) `1.12`** *sống lành thiện bằng thân, bằng lời, bằng tâm* → *làm thiện bằng thân, làm thiện bằng lời, làm thiện bằng tâm*, cùng Pāli với `sn31.2:1.4`, `sn31.3:1.4`, `sn31.13-22:1.4` (6/8 khoá cùng Pāli trong `sn` dùng *làm thiện*). **(5) `1.24`** bỏ dấu chấm thừa sau `!’` (Pāli `upapajjeyyan’ti.`; đa số theo `sn31.2:1.8`). **(6) `0.3`** tiêu đề *Người Cho Hương Và Người Nhận* thêm *người nhận* không có trong `Sāragandhādidātāsuttanavaka`; nay *Bộ Chín Bài Về Người Cho Hương Lõi Cây Và Các Hương Khác* (Sujato: *Givers of Fragrant Heartwood, Etc.*); đã đổi `translationTitle` và thẻ cho khớp. Điểm đổi: `semantic_fidelity` 9.4 → 9.0, `terminology` 9.2 → 9.0, `segment_alignment` 10.0 → 9.6, `triangulation` 9.2 → 8.6 (Sujato để trống 1.17–1.23 và 1.26–1.32, không có tầng Việt), `ambiguity_integrity` 9.4 → 9.0, `grammar_logic` 9.3 → 9.4 (nhận ra `dātā … gandhānaṁ`), `technical_integrity` 10.0 → 9.6 (không chạy `npm run validate` · `npm test` · `npm run check` · `npm run build` trong lượt này); `final_score` 9.47 → 9.23.
  - >-
    **Bất định còn lại.** `papaṭika`: giữ *vảy cây* theo `sn31.1` đã published; Sujato dịch *shoots* (chồi), nên nghĩa chưa phân xử được, không thêm vào thân kinh. `pheggu` *giác cây* (Sujato *softwood*) và `taca` *vỏ cây* thì ổn định. Phép lặp *sinh cộng trú với* ở `1.4–1.10`, `1.17–1.23` là lựa chọn biên tập (Pāli lược động từ sau `…`), giữ từ bản cũ. **Lỗi ngoài phạm vi:** `sn31.23-112:1.3–1.11` cùng danh sách sai bốn loại hương và cùng lỗi *các vị thần trong …*, và `1.12` còn *sống lành thiện*; cần sửa riêng.
