  DẤU LƯỢC §10. Không khoá nào trong lát này được MỞ RỘNG chỗ Pāli lược. Bản Anh Sujato đã ghim mở rộng nhiều chỗ `…pe…` (ví dụ `sn45.24:2.2` và `sn55.31:4.1` liệt kê đủ tám ngành Bát Chánh Đạo, `sn46.14:3.3` liệt kê đủ bảy giác chi) — tôi KHÔNG theo, vì mở rộng là thêm chữ không đánh dấu. Cũng không khoá nào bị nén thêm: mọi `…` trong bản Việt đều ăn đúng một dấu lược ứng với một `…pe…` của Pāli, đếm từng khoá.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC. **2 khoá có Pāli trùng nguyên văn** với
    `sn35.126:1.3` và `sn35.128:1.3` (cùng câu hỏi), và tôi theo đúng nguyên văn đã có cho phần
    lõi *trong thế giới này những người ấy … ngay trong hiện tại*, chỉ sửa lỗi của bản chụp: hai
    tệp kia để dấu nháy kép mở không đóng, và đóng `”ti?` thành `”?` — tôi giữ `”ti?` như
    Pāli và quy ước chung của tầng. `iṭṭhā kantā manāpā piyarūpā kāmūpasaṁhitā rajanīyā` →
    *đáng ưa, lấy lòng, khớp lòng, có dáng vẻ đẹp, phù hợp với ham muốn, quyến rũ*: đa số
    **trong chính SN35** (11 lần ở `sn35.104/122/123/229`). Họ khác là `mn122/mn139/mn145` với
    *đáng thích, dễ chịu, hấp dẫn, khơi dậy ham muốn* (6 bài) — tôi chọn của SN35 cho đúng
    bối cảnh. Riêng `cakkhuviññeyyā` tôi dịch *sắc do mắt nhận biết*, KHÔNG theo *những sắc
    mắt có thể nhận biết có thể nhận biết* của bốn bài kia — lặp đó là lỗi dịch, `cakkhuviññeyyā`
    chỉ là một từ. `abhinandati, abhivadati, ajjhosāya tiṭṭhati` → *ưa thích, tán thán, chấp
    thủ mà đứng giữ* theo `mn106:10.11`. `tannissitaṁ viññāṇaṁ hoti tadupādānaṁ` → *thức
    nương tựa nơi ấy và thủ nơi ấy* theo `mn106:10.12`. `Saupādāno/Anupādāno` → *còn bám
    thủ / không còn bám thủ*. Tên phẩm: `Lokakāmaguṇavagga` → *12. Phẩm Dục Thuộc Thế Gian*
    (2 bài, toàn bộ đồng thuận). 0 tiền lệ, đặt mới: `Pañcasikhasutta` → *Câu Hỏi Của
    Pañcasikha*; `gandhabbadevaputto` → *vị gandhabba* (tiền lệ *vị gandhabba* đã có ở `sn35`
    khác; `dn21` chỉ gọi tên); `m’idhekacce sattā` → *trong thế giới này những người ấy* theo
    `sn35.126/128` chứ không theo *những hữu tình* của `mn41/42`.
  REVIEW ĐỐI KHÁNG. Tôi in lại Pāli ↔ Việt từng cặp và đọc lại với mục tiêu tìm lỗi.
