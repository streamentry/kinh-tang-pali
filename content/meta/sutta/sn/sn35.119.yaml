      bám thủ*. **(2)** `1.7` bản nháp dịch theo `mn145` (*hoan hỉ, hoan lạc*) trong khi `mn145`
      dùng bộ động tử khác; đã theo `mn106:10.11` đúng bộ `abhinandati, abhivadati,
