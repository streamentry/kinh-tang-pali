notes:
  - >-
    **Cảnh báo về khuôn tải `Saṁyutta Nikāya` — đo lại, đúng nhưng số đã lệch.** Lệnh lát bảo `0.1` của bài `sn` là `Saṁyutta Nikāya` ở 1562/1562 tệp và tuyệt đối không dùng `Saṡyutta`. Tôi đo lại: **1.582/1.582** tệp `sn` có khoá `:0.1`, và **1.582** viết `Saṁyutta Nikāya` (chữ `ṁ` không dấu chấm). Tỷ lệ 100% và không tệp nào viết `Saṡyutta`, nên chốt đúng như lệnh lát; chỉ là con số 1.582 chứ không phải 1.562.
  - >-
    **Mọi trích dẫn trong `notes` này đã tra bằng script** trên chỉ mục Pāli↔Việt tự dựng (5.032 bài, 88.415 chuỗi Pāli khác nhau) — trong đó **loại 8 tệp của chính lát này**, để không tự đếm bản dịch của mình làm tiền lệ.
  - >-
    **Coverage Anh đo bằng script, không suy.** Đo theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ, cộng `english-sujato` và `english-project` khi status là published). Cách đo đã được **kiểm lại** bằng bài đã có sẵn: chạy lại đúng công thức này trên `an5.249` cho ra **16/21 = 0.7619**, khớp con số đã ghi trong `blocking_errors` của chính tệp đó. Bài này đạt 18/18 = 100%, nên không cần mục trong `content/meta/reference-gaps.yaml` và không có blocker về tầng tham khảo.
  - >-
    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo.** Tại commit đã ghim, tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) chỉ có Pháp Cú, nên **không có bản Thích Minh Châu để đối chiếu ở bất kỳ bài nào trong lát này**. Đối chiếu thuật ngữ vì vậy dựa vào Pāli root + bản Anh Sujato đã ghim + **tiền lệ đo được trong chính tầng Việt của kho**; `budsas.org` là tra cứu toàn văn, không dựng cột.
  - >-
    **Dấu lược — giữ đúng luật, không mở rộng.** Mọi khoá Pāli có `…pe…` đều giữ **đúng một** `…` trong bản Việt (luật §10.1 của BRIEF_VI3), và **không** khoá nào được thêm `…` để che chỗ thiếu. Ở những khoá lược, công thức bị nén đều là `peyyāla` mà bài đã phát lại đủ ở chỗ khác, nên nén thêm cũng không mất thông tin; tôi không mở rộng bất kỳ khoá lược nào.
  - >-
    **21 khoá có Pāli trùng nguyên văn ở bài khác và tôi dùng lại đúng chữ đã có; 2 khoá cùng Pāli nhưng cố ý khác; 13 khoá là Pāli mới.** Dùng lại nguyên văn: `0.2` (*3. Phẩm Ayoguḷa*, 11 bài) · `0.3` (*Kinh Các Bậc Như Lai*) · `1.1` (*Tại đó, Đức Phật gọi các vị tỳ-kheo:*) · `1.2` · `3.1` (*Bốn tức địa nào?*) · `3.4`/`3.13` (*Và vị ấy an trú với tưởng trước sau bình đẳng—*) · `3.5`/`3.14` (*như phía trước thế nào, phía sau thế ấy…*, **không có cách khác**) · `3.6`/`3.15` · `3.7`/`3.16` · `3.8`/`3.17` (*Như vậy, với tâm rộng mở không bị bao phủ…*) · `3.9` (`…về cố gắng và định …`) · `3.10` (`…về tâm và định …`) · `3.11` (`…về quán sát và định—`) · `4.3` (*Thứ mười hai.*, 35 bài) · `4.4` (*(Sáu thắng trí nên được thuyết rộng.)*, khớp `sn51.21`) · `5.0` (*Tóm lược:*, 240/281 khuôn `uddāna` toàn tầng). Hai khoá cố ý khác: `2.1` chọn *các pháp ấy lấy **Đức Phật** làm gốc* thay vì *lấy Đức Thế Tôn làm gốc* (6 bài) hay *…gốc rễ* (2 bài) — vì `bhagavā` trong `Bhagavaṁmūlakā` là danh xưng, và bài này tôi dùng **Đức Phật** cho `bhagavā` nhất quán; `3.3` dùng **Ham muốn** cho `chando` thay vì *Dục* (2 bài), vì cùng bài đã dịch `chando` là *ham muốn* ở `3.2`.
  - >-
    **`iddhipāda` → **tức địa**, và tôi cố ý không nhân bản lỗi của bài kề.** Đếm toàn tầng: *tức địa* **164** lần, *thần túc* 22 lần, còn *như ý túc* là cách sai (đó là `aṅkhuhatthu`, không phải `iddhipāda`). Bài liền kề `sn51.31` (cùng công thức, cùng phẩm) đang viết *bốn **như ý túc** này* cho `catunnaṁ iddhipādānaṁ` ở `3.1`, `3.14`, `4.1`, `4.2` — tức **4 khoá sai ngay trong bài kề**. Tôi theo đa số đo được và theo đúng dạng của `sn51.28` trong cùng phẩm: *vị tỳ-kheo tu tập tức địa đi cùng sự chuyên cần về ham muốn và định* / *…về cố gắng và định …* / *…về tâm và định …* / *…về quán sát và định—*. Ghi ra đây để người gộp sửa `sn51.31`.
  - >-
    **`uddāna` `5.1`–`5.4`: không phải đoán, mà đã đối chiếu từng tên kinh trong phẩm.** Đọc cả mười hai bài của `Āyoguḷavagga` (`sn51.21`–`sn51.32`) ra tên: `Maggo`=sn51.21 Maggasutta · `ayoguḷo`=sn51.22 · `bhikkhu`=sn51.23 · `suddhikañcāpi`=sn51.24 · `dve phalā`=sn51.25+26 · `Dve cānandā`=sn51.27+28 · `duve bhikkhū`=sn51.29+30 · `moggallāno`=sn51.31 · `tathāgato`=sn51.32. Đủ cả mười hai, không thừa không thiếu, nên tôi dịch **chữ-từng-chữ theo tên kinh** (*Con Đường, Viên Thạch, Tỳ-kheo, / Tinh Luyện nữa, và Hai Bài Quả; / Hai Bài Ānanda, Hai Bài Tỳ-kheo, / Moggallāna và Như Lai.*) đúng như quy ước `uddāna` đã có trong tầng (xem `an10.70`, `sn1.10`), **không** suy diễn thêm nghĩa giáo lý nào.
  - >-
    **Nháy kép: chỉ **một** khoá lệch Pāli, và Pāli ở chỗ đó tự nó không cân.** Cả bài, Pāli có 3 dấu `“` và 2 dấu `”`: dấu `“` thứ ba ở `2.2` không có `”` nào đóng, vì `…pe…` ở `2.1` đã ngụ ý chỗ đóng. Tôi **không** mở `“` ở `2.2`, để lời Đức Phật ở `2.2`–`4.2` là **một** lời liền, đúng như `sn51.28` và `sn51.29` đang làm. Ngoài `2.2` thì **29/30** khoá khớp Pāli từng khoá.
  - >-
    **Bất định đã ghi, đưa vào `notes` chứ không vào thân kinh.** `evaṁmahiddhiko evaṁmahānubhāvo` dịch *đại thần lực và đại uy lực* theo 6 tiền lệ có sẵn (thay vì *đại oai đức* ở `sn51.31`), vì `mahānubhāva` là *uy lực / oai lực* chứ không phải *oai đức*; hai bản đó không đổi nghĩa nhưng tôi chọn nhất quán theo đa số.
  - >-
    **`technical_integrity` đặt 9.6 chứ không phải 10.0.** Đợt này lát bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên cổng kỹ thuật của repo **chưa chạy** và không thể tuyên bố là đã pass. Những gì đã quét bằng script riêng trên **mọi** khoá (không chỉ khoá ≥ 40 ký tự): JSON hợp lệ, đủ mọi khoá trong `all`, không khoá thừa so với Pāli, không khoá rỗng, NFC, không trùng nguyên văn Pāli, không Pāli lọt vào bản Việt, **số dấu lược khớp Pāli từng khoá**, và ngoặc kép cân trên cả bài (`ngoặc()` của `_hvi.py`). Cần chạy bốn lệnh trên trước khi merge.
