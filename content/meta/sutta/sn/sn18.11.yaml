notes: |-
  Soạn từ Pāli root, đối chiếu Anh Sujato: 12/12 khoá có nội dung đều có Anh;
  bài này KHÔNG dùng lớp lấp `english-project`. Không có bản Việt Thích Minh Châu
  (ngoài Pháp Cú). Vì vậy đây là bài có tầng Anh độc lập thật sự trong lát.
  1.24-1.25 trùng PẢI sn18.10:1.11-1.12 nên dùng lại nguyên văn, đúng một bài trước
  trong cùng phẩm; khác duy nhất là thêm khoảng trắng mà sn18.10 gõ thiếu sau
  dấu nháy đơn (`nữa’vị ấy`) — lỗi khoảng trắng, không phải lựa chọn từ ngữ.
  1.3 trùng Pāli an4.177:1.1 nên dùng lại nguyên văn.
  Tiền lệ đếm được: Saṁyutta Nikāya giữ Pāli 1074/1408; `2. Dutiyavagga` →
  2. Phẩm Thứ Hai 89/89; `Evaṁ me sutaṁ—` → Tôi nghe như vầy. 211/392 (riêng tầng
  sn 41/67) — đa số có dấu chấm, 14 bài có gạch dài; chọn theo đa số;
  `Sāvatthiyaṁ viharati` → Trú ở Sāvatthī. 70/130;
  `“Taṁ kiṁ maññasi, rāhula,` → Bạch Rāhula, ngươi nghĩ thế nào 7/15;
  `mano nicco vā anicco vā”ti?` → ý là thường hay vô thường (mn146);
  `Paṭhamaṁ.` → Thứ nhất 246/248.
  1.23 theo sn18.9:1.11 đã có (thấy rõ như thế, bậc Thánh đa văn thì với … chán nản).
  1.12-1.16 giữ nguyên mạch Pāli: chỉ `Sotaṁ …pe… ghānaṁ … jivhā … kāyo …` có năm
  khoa rút gọn, nên bản Việt vẫn là 'Với tai … / với mũi … / với lưới … / với thân …'
  rồi mới hỏi về ý; KHÔNG nối thành một câu vì như vậy sẽ giấu mất chỗ lược.
  Ghi nhận bất định: 0.3 `Cakkhusutta` chia hai cách trong tầng — Kinh Mắt 3
  (sn25.1/26.1/…) và Kinh Con Mắt 1 (sn26.1); chọn theo đa số 3. 1.26 dùng mẫu câu
  peyyāla của sn30.17-46:1.17 (mẫu duy nhất có trong tầng) vì Pāli đây không có
  tiền lệ riêng.
  Nháy kép là danh sách xuyên suốt bài; dấu lược đếm khớp từng khoa với Pāli (một `…`
  cho mỗi `…pe…`).
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
