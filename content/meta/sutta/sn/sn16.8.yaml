notes: |-
  Soạn từ Pāli root, đối chiếu Anh Sujato (26/29; 4.3/7.3 do english-project lấp,
  7.8 Aṭṭhamaṁ là mốc kết cấu). Không có bản Việt Thích Minh Châu (ngoài Pháp Cú).
  Tiền lệ: 1. Phẩm Kassapa (2, gồm sn16.1/16.2); Tôn giả Mahākassapa (57 tệp giữ nguyên
  danh, thiểu số sn22.4 dịch Đại Kaccāyana); hãy giáo hóa (ovada); thuyết pháp thoại;
  khó khuyên dạy/dễ khuyên dạy; tán thán (sn16.1); y phục/đồ ăn khất thực/chỗ ở/thuốc men
  (sn16.1); mời ngồi; đắp thượng y một bên vai; Phạm thiên Sahampati.
  Cố ý KHÔNG thêm Trúc Lâm vào 1.1: Pāli Rājagahe kalandakanivāpe thiếu veḷuvane
  (tiền lệ mn77 có veḷuvane mới ghi Trúc Lâm). 0 tiền lệ: dhutaṅga 9 hạnh diễn đạt;
  bhaddaka→hiền lành, sikkhākāma→ham học, sabrahmacārikāma→mến bạn đồng phạm hạnh;
  câu 7.6–7.7 Pāli lặp công thức hai lần nên Việt giữ đủ hai lần (bản nháp đầu nén
  lần hai thành như vậy đã sửa). 7.7 Pāli tối nghĩa, bám sát Sujato, ghi nhận bất định.
  validate/test do coordinator chạy: npm run validate; npm test; npm run check; npm run build (vì có bài published).
