notes: >-
  Each member of the list is negated four times — `na maññati` (nothing is X to them), `-smiṁ na
  maññati` (not in X), `-to na maññati` (not from X), `-meti na maññati` (not "X is mine") — and
  the sutta's claim at 1.20–1.22 is that refusing all four is what prevents grasping. None of the six
  segments here is a verbatim repeat, so each is a complete fourfold built on the one the pinned
  edition spells out in full at 1.5: "They don’t conceive anything to be sights, they don’t conceive
  it in sights, they don’t conceive it as sights, and they don’t conceive that 'sights are mine.'"

  Sujato collapses most of the list to a noun and an ellipsis — 'eye consciousness … ' at 1.6,
  'eye contact … ' at 1.7, 'body … ' at 1.13, 'mind … ' at 1.14 — so as published the English column
  shows the whole fourfold twice, for the eye and for sights, and names the rest without their
  negations. The fill does not invent a shorter form for these; each of the six keeps all four
  clauses, because the fourfold is the content and 1.20–1.22 depend on it.

  The nouns follow Sujato. "tongue consciousness" and "tongue contact" are formed on his "eye
  consciousness" and "eye contact"; "mind consciousness" and "mind contact" are the words he uses for
  the same two members at sn35.26:1.16–1.17 and sn35.232:11.8. `dhammā` is "ideas", which is his word
  for the mental object throughout this vagga (sn35.26:1.15, sn35.232:2.3), not "qualities" or
  "Dhammas" — the vagga is named "Sabbavagga", "All", so "ideas" is also what keeps the list's
  plurality honest.

  Number is carried through the fourth clause rather than flattened: `rasā` and `dhammā` are plural, so
  1.10 and 1.15 end "tastes are mine" and "ideas are mine", while the four singular members end
  "… consciousness is mine" and "… contact is mine" — which is exactly how Sujato handles `rūpā` at
  1.5 against `cakkhu` at 1.4.

  Each of the six opens a fresh sentence in the reader, because each is preceded by an elision marker
  or a collapsed Sujato fragment rather than by a continuing clause. That is also why they are
  capitalised, following 1.5 and 1.19, while Sujato runs 1.6 and 1.7 on in lower case.

  Triangulation is capped at 8.0: Sujato translates none of these six passages.