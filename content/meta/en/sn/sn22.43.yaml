notes: |-
  2.7 giữ nguyên mẫu 2.4 ("But that form of theirs decays and perishes,") đổi "form"→"feeling"
  (vedanā, 2.6 đã ghim "They regard feeling as self …"), kết "." theo Pāli. 2.8 theo mẫu đủ 2.5
  ("which gives rise to sorrow, lamentation, pain, sadness, and distress." 70×) nhưng Pāli lược
  giữa (…pe…) nên giữ đầu "sorrow, lamentation" + một "…" + đuôi "distress", không mở rộng.
  3.4/3.7 Pāli đồng nhất 3.2 nên giữ nguyên bộ từ 3.2, chỉ thêm ‘…’ quanh "quenched in that
  respect" (cụm này 2× ở 3.2/3.9) vì Pāli có ‘…’ti mà Sujato bỏ (mo=1 dong=1).
  rven88.py báo "anxiety … anxiety" ở hai khoá này — đó là nguyên văn Sujato 3.2 ("there’s no
  anxiety. Without anxiety …"), giữ lại là đúng, cờ hợp lệ. Không blocker.
