notes: |-
  4.4 có PĀLI GIỐNG HỆT 3.3 (`Te iminā kāyena aṭṭīyamānā harāyamānā
  jigucchamānā satthahārakaṁ pariyesanti.`) và bản đã ghim đã dịch 3.3 thành “Becoming
  horrified, repelled, and disgusted with this body, they looked for a suicide weapon.”
  → luật 3 của lớp: dùng lại y nguyên, không dịch lại.

  4.5 thì Pāli KHÁC 3.4 (3.4 có `…pe…`, 4.5 có dấu lược TRẦN nằm giữa danh sách), nên
  không dịch lại từ đầu; giữ dấu lược đúng chỗ. Ở đây tôi CỐ Ý không dùng lại “Each day
  ten, twenty, or thirty mendicants committed suicide.” của 3.3 — câu đó là Sujato đã
  gộp cả đoạn lại, còn 4.5 đúng là Pāli ra `satthaṁ āharanti` HAI lần; dịch theo bản đã
  ghim sẽ là lược mất chữ có nguồn. `satthaṁ āharanti` dịch “took a weapon”: quét tầng
  Anh đã ghim, “weapon” chỉ xuất hiện trong cụm “suicide weapon” (2 lần, ở chính sn54.9
  này), nên không có mẫu riêng cho động từ này.

  Bất định còn lại: thì của `āharanti` là thì hiện tại; tôi dùng quá khứ để khớp với
  “looked for a suicide weapon” quá khứ mà bản đã ghim dùng ở 3.3 cho cùng một sự kiện.
  Hai câu mô tả cùng một việc ở hai mức chi tiết khác nhau (3.4 tóm tắt, 4.5 theo Pāli),
  không mâu thuẫn nhau — nhưng người đọc có thể thấy lặp. Ghi lại ở đây vì đó là chỗ duy
  nhất lát này lệch với bản đã ghim.
