notes: |-
  **Phân loại 13 khoá lấp: A = 5 · B = 6 · C = 2 · D = 0.** Mười một khoá `5.5`–`6.7` là lời gia chủ
  Nakulapitā **thuật lại** cho Tôn giả Sāriputta cuộc đối thoại ở `2.1`–`3.6`. Tầng đã ghim tóm cả đoạn này vào
  một câu ở `5.4` (“So Nakula’s father told Sāriputta all that had happened, and said,”) rồi để trống
  `5.5`–`6.7`. Đây là cơ chế **cắt cụt dãy** (13 khoá trống, 11 khoá liền nhau), không phải gộp khoá: lời
  `5.4` không mang chữ nào của `5.5`–`6.7`.

  **Nhóm A — 5 khoá, Pāli trùng nguyên văn, dùng lại nguyên văn lời đã ghim:**
  `5.6`←`2.2` · `5.7`←`2.3` · `5.8`←`2.4` · `6.3`←`3.2` · `6.4`←`3.3`. Lưu ý `2.2` đã ghim
  (“I hardly ever get to see the esteemed mendicants.”) không dịch `bhagavato` (thấy Đức Thế Tôn); vì
  luật A, `5.6` giữ đúng lời đó và **không** tự chèn lại, để hai lần lặp không lệch nhau.

  **Nhóm B — 6 khoá, Pāli chỉ khác dấu nháy/dấu câu (tỉ lệ khớp sau khi bỏ dấu = 1,00, riêng `6.6` 0,99):**
  `5.5`←`2.1`, `5.9`←`2.5`, `6.2`←`3.1`, `6.7`←`3.6`: lời giữ nguyên, chỉ đổi nháy kép thành nháy đơn
  vì Pāli thuật lại lồng trong lời nói (`‘ahamasmi…`, `…sukhāyā’ti`, `‘evametaṁ…`, `…sikkhitabban’ti`).
  `6.5`←`3.4`: Pāli `—` thay `:`; giữ dấu hai chấm của lời đã ghim vì câu sau là nội dung phải học.
  `6.6`←`3.5`: Pāli `bhavissatīti` **không** có nháy, nên lớp lấp bỏ cặp nháy `‘…’` của `3.5`.

  **Nhóm C — 2 khoá:** `6.1` `Evaṁ vutte, maṁ, bhante, bhagavā etadavoca` → “When I said this, sir, the
  Buddha said to me:” (`bhante` gọi Sāriputta, theo cách tầng đã ghim dịch `bhante` là “sir” ở `5.1`).
  `19.3` `Paṭhamaṁ.` → “First.” — nhãn thứ tự, khớp vị trí đầu phẩm (`sn22.2` mang `Dutiyaṁ.`).

  **Hệ quả đọc cần biết:** vì `5.4` đã ghim nói “told Sāriputta all that had happened”, người đọc cột Anh sẽ
  thấy câu tóm ấy rồi ngay sau là bản thuật lại đầy đủ. Lặp này là hệ quả của tầng đã ghim, lớp lấp không
  sửa `5.4` (sửa là che bản đã ghim). Pāli `6.8` đóng nháy kép `”ti`, lời đã ghim ở đó lại mở thêm `“`;
  cũng là của tầng đã ghim.

  **Nháy, dấu lược:** 13/13 khoá khớp nháy Pāli từng khoá (dấu `’` có chữ thường liền sau tính là dấu
  nháy lược của tiếng Anh). Không khoá nào có `…pe…` hay `…`; lớp lấp cũng không có `…`.
  Đã dò cặp Pāli trùng nguyên văn trong cả bài (tính cả lời đã ghim): 0 cặp có lời Anh khác nhau.

  **Coverage:** 79 khoá Pāli có nội dung; trước 70/79 = 0,8861; sau khi `published` 79/79 = 1,0. Lớp lấp phủ
  9 khoá có nội dung; 4 khoá còn lại (`5.7`, `5.8`, `6.7`, `19.3`) dưới 40 ký tự nên không vào mẫu số nhưng
  vẫn lấp để mạch thuật lại không bị thủng. Bài này **không** có record trong
  `content/meta/reference-gaps.yaml` (vốn đã trên ngưỡng 0,8).

  **Triangulation 8,0:** bản Việt canonical của `sn22.1` (`translators` và `quality.assessed_by` trong
  scorecard Việt) do cùng họ công cụ với lớp lấp này dịch và chấm, nên lớp lấp **không** phải một cách đọc English độc lập, và scorecard tiếng Việt
  của bài không được tuyên bố đã đối chiếu English nhờ lớp này. Đối chiếu có: Pāli root đã ghim + lời Sujato
  đã ghim của chính bài (khối `2.1`–`3.6`) + bản Việt canonical (chỉ để kiểm nghĩa).

  **technical_integrity 9,6:** lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`; bốn lệnh đó còn nợ, nên không tuyên bố technical gate pass.
