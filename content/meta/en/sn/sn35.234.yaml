notes: |-
  3.1: bản đã ghim 2.1 của chính bài dịch `“Yatheva nu kho, āvuso ānanda, …` thành "“Reverend
  Ānanda, the Buddha has explained, opened, and revealed in many ways how this body is not-self."
  — bỏ hẳn `Yatheva nu kho`. Nhưng Pāli 3.1 là `Yatheva kho` KHÔNG có `nu`, tức không phải câu hỏi
  (2.2 mới là câu hỏi), nên tôi giữ "Just as" — 57 bản Anh đã ghim mở đầu bằng "Just as", và
  `Yatheva … evameva` ở sn22.80:3.13 dịch là "as he did in the past". Đây là chỗ tôi CỐ Ý khác bản
  đã ghim của cùng bài, vì `nu` làm thay đổi nghĩa; ghi ra đây.

  5.3: chép cấu trúc từ 4.3 (`cakkhuviññāṇaṁ`) và 6.3 (`manoviññāṇaṁ`) của chính bài, đã ghim.
  Pāli 5.3 có dấu phẩy trước `api nu kho` (giống 6.3) nên "would" viết thường, đúng như 6.3.

  BẤT ĐỊNH ở 5.5: Pāli 5.5 GIỐNG HỆT 4.5 (đã so từng byte) và gần như giống 6.5; cả hai đã ghim
  thành "“In this way, too, it can be understood how consciousness is not-self." — Sujato GỘP cả
  vế trong dấu nháy vào câu ngoài, nên bản đã ghim mang 1 ngoặc mở / 0 ngoặc đóng. Lớp lấp thì
  phải khớp số ngoặc theo từng khoá: Pāli 5.5 có 2 ngoặc mở, 2 ngoặc đóng, 1 dấu lược. Tôi giữ
  NGUYÊN VĂN câu của Sujato rồi đặt cặp ngoặc quanh đúng vế mà Sujato đã dịch ở 2.2 là "how
  consciousness is not-self", và trả lại ` …` ở cuối. Mọi từ đều là từ Sujato đã dùng trong chính
  bài này; tôi không thêm nghĩa nào. Nhưng kết quả là "it can be understood, ‘how consciousness is
  not-self.’" — hơi vướng, vì nếu Sujato bỏ cặp ngoặc thì câu sạch hơn. Đây là điểm tôi hạ
  `semantic_fidelity` / `grammar_logic` / `vietnamese_clarity` / `ambiguity_integrity` 9.2: đây là
  chỗ phải hy sinh độ trôi chảy để giữ đúng cấu trúc Pāli.

  Ngoài ra 3.1 (của tôi) + 3.2 (đã ghim) sẽ đọc hơi gãy vì 3.2 của Sujato mở nháy kép `“` rồi bỏ
  dở. Chỗ gãy nằm ở bản đã ghim, không phải ở 3.1; tôi không sửa tệp đã ghim.
