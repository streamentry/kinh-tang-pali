notes: |-
  Câu này đã được bản Anh đã ghim viết ở 4.5 của CHÍNH bài, nguyên văn cả hai vế: "'I shall lead the
  mendicant Saṅgha,' or 'the Saṅgha of mendicants is meant for me,'" — chép lại. `Saṅgha` có dấu Pāli
  nhưng được phép vì bản đã ghim của chính bài này dùng (4.5, 4.8, 5.1, 6.7…), nên chốt không bắt. Duy
  nhất một điểm phải chỉnh: ở 4.5 câu còn tiếp nên vế cuối mang dấu phẩy bên trong dấu nháy như Sujato
  viết; ở 4.7 câu KẾT THÚC (Pāli `…‘mamuddesiko bhikkhusaṅgho’ti vā.`) nên dấu phẩy chuyển thành dấu
  chấm ở vế cuối, đúng cái đã có trong tiếng Anh. Vế đầu vẫn giữ dấu phẩy vì danh sách còn tiếp. Số
  ngoặc mở/đóng giữ nguyên 2/2 theo Pāli.
  
