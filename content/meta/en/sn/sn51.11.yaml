notes: |-
  Mười khoá lấp nằm ở mục 2 (vīriya) và mục 3 (citta) của sn51.11 — đúng hai mục mà bản Anh đã
  ghim đã lược hết. Phần còn lại của bài (mục 1 về chanda và mục 4 về vīmaṁsā) bản ghim dịch
  đầy đủ, và mục 5-10 có chữ ở mọi khoá.

  Tám khoá lấp NGUYÊN VĂN, không dịch lại. Phép đo bằng script: so byte Pāli giữa khoá lấp và
  mọi khoá đã ghim trong cùng bài, ra 8 khoá trùng tuyệt đối —
    2.4 ≡ 1.8 ≡ 4.4   "as before, so behind; as behind, so before;"
    2.5 ≡ 1.9 ≡ 4.5   "as below, so above; as above, so below;"
    2.6 ≡ 1.10 ≡ 4.6  "as by day, so by night; as by night, so by day."
    2.7 ≡ 3.7 ≡ 4.7   "And so, with an open and unenveloped heart, they develop a mind that’s
                      full of radiance."
    3.4 ≡ 1.8 ≡ 4.4,  3.5 ≡ 1.9 ≡ 4.5,  3.6 ≡ 1.10 ≡ 4.6
  Riêng 2.7/3.7 bỏ dấu `’` mà bản ghim đặt ở 4.7, vì Pāli của 2.7 và 3.7 KHÔNG có dấu đó
  (`cittaṁ bhāveti.`), còn Pāli của 4.7 thì có (`cittaṁ bhāveti’.`). Giữ dấu của bản ghim ở đó
  sẽ là dấu thừa không có nguồn.

  Hai khoá phải DỰNG LẠI, và chỉ dựng theo khuôn đã ghim trong chính bài này:
    2.2 = 1.6 / 4.2 với `chando`→`vīriyaṁ`
    3.2 = 1.6 / 4.2 với `chando`→`cittaṁ`
    1.6 (đã ghim): They think: “My enthusiasm won’t be too lax or too tense. And it’ll be
    neither constricted internally nor scattered externally.”
    4.2 (đã ghim): They think: “My inquiry won’t be too lax or too tense. And it’ll be
    neither constricted internally nor scattered externally.”
    Bất định phải ghi: bản ghim mở ngoặc kép `“…”` ở 1.6 và 4.2, nhưng Pāli của 1.6 và 4.2
    (`…bhavissati.` và `…bhavissati.`) KHÔNG có ngoặc nào, và Pāli của 2.2/3.2 cũng không.
    Lớp lấp phải khớp số ngoặc theo từng khoá, nên bỏ `“…”` và `They think:` — giữ đúng
    nghĩa mà phần còn lại của câu mang (`na ca atilīnaṁ / na ca atippaggahitaṁ / na ca
    ajjhattaṁ saṅkhittaṁ / na ca bahiddhā vikkhittaṁ`). Đây là hệ quả của cách bản ghim
    thêm ngoặc, không phải lựa chọn thẩm mỹ; ambiguity_integrity hạ 9.2 vì nó.

  `vīriyaṁ` dịch "energy", `cittaṁ` dịch "mind": cả hai lấy từ chính bản ghim — 2.1 để
  "They develop the basis of psychic power that has immersion due to energy …" và 3.1 để
  "mental development …". `vīriyaṁ` không dịch "effort" vì bản ghim đã dùng "active effort"
  cho `ppadhāna` ở 1.5; `cittaṁ` không dịch "consciousness" vì `viññāṇa` mới là chữ đó.

  Bản Việt hiện hành: KHÔNG có. Tầng `vietnamese-current` tại commit đã ghim chỉ có Pháp Cú,
  và `content/translation/vi/project/sutta/sn/` không có tệp cho sn51.11 — đo bằng script,
  0 tệp. Triangulation 8.0 vì vậy: tám khoá trùng nguyên văn với bản ghim (đối chiếu được),
  hai khoá dựng lại chỉ dựa vào Pāli + hai khuôn đã ghim trong bài (không có bản Anh độc lập
  phủ, vì chính hai khoá đó là chỗ bản ghim im lặng).

  Technical gate: bị cấm chạy. Còn lại bốn lệnh — `npm run validate`, `npm test`,
  `npm run check`, `npm run build`. technical_integrity 9.6 vì lý do đó, không phải 10.0.
