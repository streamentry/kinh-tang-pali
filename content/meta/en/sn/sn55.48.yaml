notes: |-
  2.5 có PĀLI GIỐNG HỆT bản đã ghim đã dịch ở sn55.40:4.3 và sn55.41:3.1 (“And
  they have the ethical conduct loved by the noble ones … leading to immersion.”) và với
  20 lần “And they have the ethical conduct loved by the noble ones … leading to
  immersion.” trong tầng đã ghim. Dùng lại đúng bộ từ đó, bỏ “And” vì Pāli ở 2.5 KHÔNG
  có từ nối (2.2–2.4 là `buddhe …pe… / dhamme …pe… / saṅghe …pe…`, ba mục không nối),
  nên bản Anh bắt đầu bằng chữ thường — đúng như bản đã ghim đã làm ở sn55.20:2.6.

  CỐ Ý KHÔNG dịch `akhaṇḍehi` (“không đứt đoạn”). Suy ra từ Pāli thì nên có “unbroken”,
  nhưng cùng vế Pāli này đã được bản đã ghim dịch không kèm “unbroken” ở sn55.40:4.3 và
  sn55.41:3.1, và bản Việt dự án của chính bài này (sn55.48:2.5) cũng có “không đứt đoạn”.
  Thêm “unbroken” sẽ làm bài kinh tự mâu thuẫn với hai chỗ kia trong cùng tầng — đúng
  cái lỗi luật 3 của lớp cảnh báo. Đây là quyết định có thể phản biện, nên ghi lại.

  2.6 là CÔNG THỨC `Imehi kho, X, catūhi dhammehi samannāgato ariyasāvako sotāpanno
  hoti avinipātadhammo niyato sambodhiparāyaṇo”ti.` Sujato dịch nó 7 lần trong đúng
  phẩm này và LUÔN BỎ TÊN XƯNG: sn55.2:2.7, sn55.6:17.7, sn55.11:2.8, sn55.30:2.8,
  sn55.39:2.8, sn55.46:2.7, sn55.47:2.7, sn55.51:2.7 — trong đó sn55.47:2.7 có Pāli
  giống hệt 2.6 của bài này, chỉ khác tên (`Imehi kho, nandiya,`), và Sujato vẫn bỏ. Tôi
  theo khuôn 8 lần đó: “A noble disciple who has these four things is a stream-enterer,
  not liable to be reborn in the underworld, assured, destined for awakening.”

  BẤT ĐỊNH CẦN GHI: hai thế đang chống nhau. (a) Bản Việt dự án của chính bài này
  (sn55.48:2.6) GIỮ “Bhaddiya,” — “Bhaddiya, vị Thánh đệ tử đầy đủ bốn pháp này…”, và
  Sujato ở 1.3 của chính bài này cũng giữ (““Bhaddiya, a noble disciple who has four
  things is a stream-enterer …””). (b) Nhưng toàn bộ 8 tiền lệ của đúng công thức `Imehi
  kho, …` đều bỏ tên xưng. Tôi chọn (b) vì nó là khuôn đã thành công thức cho cả phẩm;
  người biên tập nên biết là có thể chọn (a) và khi đó phải sửa cả tám chỗ kia cho
  nhất quán, không chỉ hai chỗ này. Vì vậy `ambiguity_integrity` hạ xuống 8.7.

  Bài này bản đã ghim chỉ dịch 6/13 khoá, nên 2.2–2.4 và 2.7 còn trống; 2.5/2.6 đọc
  được vì có bản Việt dự án và có khuôn ở bài khác. `triangulation` 8.0.
