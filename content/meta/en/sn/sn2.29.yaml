notes: |-
  Lớp lấp: 5 khoá `3.19`, `5.4`, `5.5`, `6.3`, `6.4`. Ba trong năm là **cùng một câu hỏi** và hai
  trong năm là **cùng một danh sách ca ngợi** — bài này kể Sāriputta ba lần.

  **Cặp Pāli trùng nguyên văn, dùng lại y nguyên bản đã ghim.** Câu hỏi `Kassa hi nāma … abālassa
  aduṭṭhassa amūḷhassa avipallatthacittassa … sāriputto na rucceyyā”ti?` xuất hiện ở `2.18` (đã
  ghim), `3.2` (đã ghim), `3.19`, `5.2` (đã ghim), `5.5`, `6.4`. Lớp lấp dùng lại y nguyên văn của bản
  đã ghim cho cả ba khoá còn lại:
  "Who on earth would not endorse Venerable Sāriputta unless they’re a fool, a hater, delusional, or
  mentally deranged?”

  - `3.19` khác `3.2` ở `bhante` → `ānanda`, và mất `āyasmā`; nhưng bản đã ghim ở `3.2` cũng đã bỏ
    cả hai (`3.2` đọc "…would not endorse Venerable Sāriputta…", không "Ānanda"), nên dùng lại y nguyên
    văn `3.2` là đúng nhất. `3.19` mở 0 – đóng 1 (`”`): ngoặc ngoài đã mở ở `3.1` đã ghim.
  - `5.5` và `6.4` mỗi khoá mở 1 – đóng 1, vì Pāli `5.5` không mang dấu đóng còn `6.4` mang `”ti?`.

  **Danh sách 15 danh từ ở `5.4` và `6.3`: đây là chỗ phải quyết định, và đã quyết định như sau.**
  Pāli là một chuỗi liệt kê, mỗi danh từ bị `bhante` (`5.4`) hoặc `āyasmā` (`6.3`) chen vào giữa,
  rồi kết bằng `āyasmā sāriputto`. Cả hai khoá có CÙNG một danh sách, nên lớp lấp dùng cùng một
  cách dựng: đưa chủ ngữ lên trước một lần, rồi liệt kê. Đây là cách dựng câu tiếng Anh, không phải
  dịch lại — không có mệnh đề nào được thêm vào. Cách đó cũng khớp với cách bản đã ghim dựng từng
  vế ở `2.2`–`2.17` ("Venerable Sāriputta is astute," / "he has great wisdom," …), nên đọc liền
  không gãy. Nếu giữ đúng thứ tự Pāli thì câu ở `5.4` sẽ mở đầu không chủ thể rồi kết bằng "… is
  Venerable Sāriputta", khó đọc và không giống bất kỳ câu nào của bản đã ghim.

  Mười lăm danh từ, đủ mười lăm vế: mahāpañño, puthupañño, hāsapañño, javanapañño, tikkhapañño,
  nibbedhikapañño, appiccho, santuṭṭho, pavivitto, asaṁsaṭṭho, āraddhavīriyo, vattā, vacanakkhamo,
  codako, pāpagarahī — lần lượt là "great wisdom, widespread wisdom, laughing wisdom, swift wisdom,
  sharp wisdom, penetrating wisdom, few wishes, content, secluded, aloof, energetic, a preacher,
  accepts advice, accuses, criticizes wickedness", theo đúng danh từ bản đã ghim dùng ở `2.2`–`2.17`.

  **`6.3` khép bằng MỘT dấu nháy đơn `’`, không phải `”`.** Pāli ở `6.2` mở `‘` (`‘paṇḍito āyasmā
  sāriputto;`) và đóng ở `6.3` bằng `sāriputto’ti.`. Bản đã ghim đã đóng ngoặc ngoài của lời nói ngay
  ở `6.1` ("…hear the same terms of praise.”), nên ngoặc còn treo ở `6.3` chính là ngoặc đơn mở ở `6.2`.
  `6.2` không thuộc lát này; khoá đó để trống và sẽ phải mở `‘` cho khớp.

  **Đối chiếu bản Việt đã có — bản này ĐÃ có, và nó khớp.** `sn2.29` là một trong ba bài trong lát này có
  bản Việt trong `content/translation/vi/project/` (trạng thái `published`): "Tôn giả là bậc đại trí
  tuệ, quảng trí tuệ, trí tuệ thông sáng, trí tuệ mau lẹ, trí tuệ sắc bén, trí tuệ thấu suốt, ít ham
  muốn, biết đủ, sống an tịnh, độc cư, không dính mắc, tinh tấn, giảng dạy, chấp nhận lời khuyên,
  quở trách, chỉ trích việc ác" cho `6.3` — cũng đặt chủ ngữ lên trước, cũng đủ mười lăm vế. Dùng để
  đối chiếu nghĩa, không dịch vòng qua. Vì đã đọc bản Việt, điểm này KHÔNG được tính là đối chiếu chéo
  bằng tiếng Anh.

  `triangulation` bị chặn ở 8.0: không có bản Anh độc lập nào để đối chiếu; ba câu hỏi là bản sao của
  bản đã ghim trong cùng tầng.
