notes: |-
  Năm khoá lấp là các vế của chuỗi tìm kiếm với lưỡi. Chính bài này đã ghim TRỌN chuỗi tương
  ứng cho mắt (1.1–1.9) và cho ý (1.21–1.29), nên năm vế lấp dùng lại nguyên văn, chỉ thay
  `cakkhussa`/`cakhu` → `jivhāya`.

  Tiền lệ đã đếm, từng vế:

  - 1.13 = 1.2 và 1.22 đã ghim: "and I found it."
  - 1.14 = 1.3 và 1.23 đã ghim: "I’ve seen clearly with wisdom the full extent of the
  eye’s/mind’s gratification." → thành "the tongue’s gratification."
  - 1.15 = 1.4 và 1.24 đã ghim: "I went in search of the eye’s/mind’s drawback,"
  - 1.17 = 1.6 và 1.26 đã ghim: "I’ve seen clearly with wisdom the full extent of the
  eye’s/mind’s drawback."
  - 1.18 = 1.7 và 1.27 đã ghim: "I went in search of escape from the eye/mind,"

  Số vế ghi trong tệp là 5, không phải 4: `sn35.15:1.13` KHÔNG nằm trong lát được giao
  (`e0.json` liệt kê 1.14, 1.15, 1.17, 1.18), và không lát nào khác trong đợt này nhận nó
  (đã đối chiếu cả `e1.json`, `e2.json`, `e3.json`). Vì 1.12 đã ghim là "tongue’s …" và dừng
  ở dấu ba chấm, bỏ 1.13 sẽ để lại một lỗ hổng đọc dở trong chính bài mình đang lấp, nên đã
  điền luôn bằng nguyên văn của 1.2. Đây là quyết định vượt phạm vi lát, ghi lại để người điều
  phối quyết định có giữ hay không.

  Bất định đã ghi nhận:

  - 1.16 và 1.19 đã bị lược, nên 1.17 và 1.18 mở câu mới thay vì nối ("and I found it.").
  - 1.20 đã ghim một cách lạ ("body’s …" cho cả đoạn dài), nên cột English của bài dừng ở
  1.18. Ghi lại vì đây là chỗ bản ghim đã tự mâu thuẫn, không phải lỗi bản lấp.
  - `triangulation` 8.0; `han_viet_balance` là giá trị mặc định của lớp lấp.
