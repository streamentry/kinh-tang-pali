notes: |-
  1.7 (đã ghim) đã dịch đúng câu: "‘Suffering includes whatever is felt.’" 1.8 (đã ghim) là câu hỏi
  của Ānanda đã đóng; 1.9 là lần Ānanda DẪN LẠI chính câu hỏi, nên phải y hệt 1.7. Pāli đóng hai
  ngoặc ở đây (`’”ti?`) vì 1.7 đã mở ngoặc kép rồi chuyển sang trích dấu — giữ nguyên để bản thể tự
  chỉ ra cấu trúc.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
