notes: >-
  The sutta is one sentence applied six times: knowing and seeing X as not-self, theory of self is
  given up. Sujato translates the first application at 1.4 and the last at 1.14, and leaves 1.5–1.10
  blank — so the English column as published shows the opening of the series and its close, with
  the whole middle missing. The fill is six renderings of the same formula.

  Two anchors govern the wording, and neither is invented here. 1.4 gives the pinned edition's
  nouns for the series — "the eye, sights, eye consciousness, and eye contact" for cakkhu, rūpe,
  cakkhuviññāṇa, cakkhusamphassa — and the fill uses those same nouns rather than reaching for
  "form", "eye--consciousness" or "eye-contact". 1.14 gives the pinned edition's wording for the
  closing clause, "the pleasant, painful, or neutral feeling that arises dependent on X as not-self",
  and 1.8 is that clause with the sense organ swapped to eye contact. Translating the six from the
  Pāli in isolation would have produced a second, competing English vocabulary for the same five
  aggregates inside one short sutta.

  `attānudiṭṭhi` is kept as "theory of self" throughout, the term the pinned edition fixes in the
  title and at 1.3; "not-self" for `anatta` and "is given up" for `pahīyati` likewise.

  The ellipsis is left where the Pāli puts it. 1.8 and 1.9 end `…pe…`, so both keep `…` and neither
  takes a closing quotation mark — the speech is still open at 1.10 and only 1.14 closes it, with the
  `”` the pinned edition already carries. Expanding the elision would put invented English into a
  layer that licenses nothing beyond the pinned Pāli.

  Triangulation is capped at 8.0: Sujato is blank throughout 1.5–1.10, so there is no independent
  English reading of these passages.