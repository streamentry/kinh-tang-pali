notes: |-
  1.2 đã ghim: "One meditator is skilled in the supports for immersion but not in the
  territory of immersion. …”". 1.3 đảo hai vế; 1.4 và 1.5 lấy "skilled neither in … nor in"
  và "skilled both in … and in". `ārammaṇakusalo` = "the supports for immersion" (1 lần
  trong SN đã ghim, chính 1.2 ở đây), `gocarakusalo` = "the territory of immersion"
  (7 lần, và sn34.46/1.2 + sn34.47:1.1 đã ghim lặp lại đúng cụm này).

  Bất định thật sự: Pāli 1.3–1.5 không có chủ ngữ; bản đã ghim đã gộp cả bốn vế vào 1.2.
  Bản lấp để mảnh câu không chủ ngữ cho khớp bản Việt canonical, nên `grammar_logic`,
  `ambiguity_integrity`, `vietnamese_clarity` hạ.

  `triangulation` 8.0 là đặc thù của lớp lấp. `vietnamese_clarity` và `han_viet_balance`
  mang giá trị mặc định của lớp lấp.
