notes: |-
  Bốn khoá lấp là vế thứ hai và vế thứ ba của chuỗi về lưỡi. Chính bài này đã ghim TRỌN chuỗi
  tương ứng cho mắt (1.5–1.10) và cho ý (1.17–1.22), nên bốn vế lấp được dùng lại nguyên văn
  với đúng hai phép thay: `cakkhudhātu` → `jivhādhātu`, `rūpā` → `rasā`.

  Tiền lệ đã đếm:

  - 1.13: 1.7 đã ghim "The eye element is found, as are disagreeable sights, and eye
  consciousness." → thay hai danh từ. `rasā` là "tastes" theo 1.10 đã ghim của bài này.
  - 1.14: 1.8 và 1.20 đã ghim đúng nguyên văn "Painful feeling arises dependent on a
  contact to be experienced as painful."
  - 1.15: 1.9 đã ghim "The eye element is found, as are sights that are a basis for
  equanimity, and eye consciousness." → thay hai danh từ.
  - 1.16: 1.10 và 1.22 đã ghim nguyên văn "Neutral feeling arises dependent on a contact
  to be experienced as neutral."

  Bất định đã ghi nhận:

  - 1.16 kết bằng `…pe…`; bản ghim 1.10 và 1.22 BỎ dấu lược, nhưng chốt bắt số dấu lược
  theo từng khoá, nên giữ đúng một `…` theo khuôn sn34.28-34:1.5. Không mở rộng.
  - 1.11 đã ghim là "The ear … nose … tongue … body …" và 1.17 là "mind element is
  found, as are agreeable ideas, and mind consciousness." — Sujato đã bỏ tiền tố "The" ở
  1.17 vì đó là phần nối của một danh sách. Bản lấp ở 1.13 và 1.15 giữ "The" vì hai vế đó
  tự đứng, khớp với 1.7 và 1.9 đã ghim. Ghi khác biệt này thay vì im lặng.
  - 1.12 đã bị lược, nên 1.13 mở câu mới. Cột English vẫn dừng ở 1.16 vì 1.17–1.23 đã
  ghim nhưng còn các khoá trung gian của chuỗi mắt.
  - `triangulation` 8.0; `han_viet_balance` là giá trị mặc định của lớp lấp.
