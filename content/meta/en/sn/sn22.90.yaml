  **D = 0, nhưng có ba nhóm Pāli trùng mà lớp lấp cố ý KHÁC lời tầng đã ghim — báo, không hòa.**
  Cùng một Pāli `vedanā …` / `saññā …` / `saṅkhārā …`, tầng đã ghim viết `feeling,` /
  `perception,` / `choices,` — tức **tầng đã ghim làm mất dấu lược** ở `2.8`, `2.9`, `2.10` —
  còn lớp lấp giữ `feeling …` / `perception …` / `choices …`. Dấu lược là thứ **không được bỏ**
  (Pāli ghi thì lớp lấp phải ghi), nên ở chỗ này lớp lấp giữ Pāli và **cố ý lệch** tầng đã ghim.

  **Tự nhất quán trong chính lát này — sáu tập Pāli trùng, tất cả dịch giống hệt nhau** (đo bằng máy):
  `3.4`=`3.8`=`5.8`=`6.5` · `3.5`=`3.9`=`5.9`=`6.6` · `3.6`=`5.10` · `3.10`=`5.12`=`6.7` ·
  `3.11`=`5.13`=`6.8` · `6.1`=`7.1`. Riêng `6.1` và `7.1` (`Tassa mayhaṁ, āvuso, etadahosi:`) là
  Pāli trùng **nằm trong lát này**, nên `7.1` lấy lại y nguyên lời `6.1`.

  **Dấu lược.** Lớp lấp mang **14** dấu lược; Pāli ở đúng 43 khoá này cũng mang **14** (đếm theo luật
  `…pe…` = **một** dấu: thô là 16, có 2 khoá `…pe…` là `5.11` và `6.3`). **0** khoá lấp thêm dấu
  lược nào Pāli không có. Ngược lại, riêng trong 43 khoá đã ghim, tầng ghim **nuốt 14** dấu lược
  và **tự thêm 1** ở `3.2`.

  **Ngoặc kép — cân ở mức codepoint, khớp Pāli từng khoá, 43/43.** Bốn mươi ba khoá lấp có ngoặc ở
  12 khoá: `3.3` `3.11` `5.1` `5.4` `5.6` `5.13` `6.2` `6.8` `6.12` `7.2` `7.4` `7.7`, và mỗi khoá
  khớp Pāli đúng **cả số lượng lẫn loại** (`“` U+201C, `”` U+201D, `‘` U+2018, `’` U+2019).
  **Cân dồn toàn bài** (tầng ghim + lớp lấp, theo thứ tự khoá): **nháy kép +0, nháy đơn +0** — cân.
  Riêng tầng ghim một mình cũng +0/+0, nên lớp lấp **không** làm lệch cán cân.
  ⚠️ **`’` làm hai việc**: vừa là nháy đóng Pāli vừa là dấu nhạt lượu tiếng Anh. Lớp lấp này có
