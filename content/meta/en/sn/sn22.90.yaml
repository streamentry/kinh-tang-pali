  đóng Pāli. Tự hiệu chuẩn luật bảy hậu ngữ trên **toàn bộ lớp lấp sẵn có**: 1.416 dấu `’`,
  **888** khớp nhạt lượu (`’s` 356, `’t` 292 tính cả `’t.`/`’t,`/`’s,`, `’re` 110, `’ve` 75,
  `’ll` 20, `’d` 20, `’m` 14), **527** đứng cuối khoá và **đúng 1** dạng `’ti` là nháy đóng Pāli
  đứng cạnh chữ — đúng ngoại lệ duy nhất. **Lớp lấp này không có `’ti`.**

