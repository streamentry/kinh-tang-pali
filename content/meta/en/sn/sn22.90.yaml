  **Một lệch người đọc sẽ thấy, nói thẳng vì lớp lấp không sửa được tầng đã ghim.** Tầng đã ghim dịch
  khoá **`7.5`** thành *"May Venerable Ānanda advise me and instruct me! May he give me a Dhamma talk
