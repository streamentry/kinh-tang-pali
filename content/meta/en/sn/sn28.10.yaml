notes: |-
  Ba khoá là ba vế được dẫn lại trong lời Sāriputta tóm tắt câu hỏi của Sucimukhī.
  Pāli mỗi vế có đúng hai cặp nháy ở cùng cấp: một cho câu hỏi, một cho câu trả lời.

  Tiền lệ và chỗ đã cố ý LỆCH:

    - Khuôn khung "When asked …, you answer …" lấy từ chính 3.1 của bài này (bản ghim
      duy nhất trong cả tầng có khuôn này).
    - Nhưng KHÔNG theo nội dung 3.1. Ở 3.1 Sujato dịch `adhomukho` thành "facing all
      these directions", trong khi 2.1 và 4.2 của chính bài dịch là "facing downwards" —
      đó là trượt của tầng tham khảo, và bản lấp không nhân bản. Sujato cũng cắt câu trả
      lời còn "no, sister", bỏ mất `ubbhamukho bhuñjāmī`; nếu cắt như vậy thì 3.2, 3.3, 3.4
      dịch ra giống hệt nhau và cột English mất hết thông tin. Bản lấp giữ trọn cả hai
      vế, lấy từ ngữ hướng từ 2.3/2.5/2.7 và 4.3/4.4/4.5 ("facing upwards", "facing the
      cardinal directions", "facing the intermediate directions").

  Bất định đã ghi nhận:

    - Hệ quả của chốt ngoặc: vì Pāli chỉ cho hai ngoặc mở, khuôn "When asked …, you
      answer …" buộc phải đứng NGOÀI hai cặp nháy đơn. Trong reader, 3.1 của bản ghim để
      lại một `“` chưa đóng, nên 3.2–3.4 trông như mở một lời thoại mới. Người đọc có
      thể thấy lạ; đây là hệ quả của quy ước đếm theo Pāli, nên `ambiguity_integrity` hạ
      9.1.
    - Bài này chưa có bản Việt của dự án, nên không có đối chiếu Việt; đây là lý do
      chính khiến `source_provenance` và `vietnamese_clarity` thấp hơn các bài khác.
    - `samaṇa` trong `Tena hi, samaṇa, …` bị bản ghim 2.3/2.5/2.7 bỏ ("Well then, do you
      eat …"), và bản lấp theo y như vậy. Dạng đầy đủ "Ascetic, do you eat …" chỉ có ở
      2.1 và 4.1. Đây là một lựa chọn có thể đảo ngược.
    - Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của
      lớp lấp. `triangulation` bị chặn ở 8.0 vì không có bản Anh độc lập.
