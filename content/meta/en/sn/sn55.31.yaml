notes: |-
  1.5 dùng khuôn chính thức 17 tệp (xem `sn55.18.yaml`).

  2.2 và 3.2 là HAI KHOÁ KHÔNG CÓ TIỀN LỆ, và đây là lý do hạ điểm mạnh nhất của lát này.
  Đã đếm: 80 khoá Pāli trong toàn tầng root chứa `paccattaṁ veditabbo viññūhi` hoặc
  `anuttaraṁ puññakkhettaṁ lokassā`, và Sujato lược HẾT cả 80 — không có chỗ nào trong
  tầng Anh đã ghim dịch `paccattaṁ veditabbo` hay `suppaṭipanno` thành một câu đầy đủ.
  Quét thêm “to be realized directly by the wise” và “known directly by the wise”: 0 kết
  quả. Quét cả tầng `en` của bản chụp: cũng 0. Bài cũng không có bản Việt dự án
  (`sn55.31` không có tệp trong `content/translation/vi/project/sutta/sn/`). Vậy nên hai
  câu này dịch thẳng từ Pāli, và mỗi thành phần được gắn với một tiền lệ đếm được:

    `svākkhāto bhagavatā dhammo` — Sujato dịch đúng vế này ở dn28:2.15 và mn89:10.2
        (“The teaching is well explained.”), và dùng “the teaching proclaimed by the
        Buddha” 2 lần, “proclaimed by the Realized One” 47 lần trong tầng sn. Chọn
        “The teaching is well proclaimed by the Blessed One”: giữ `svākkhāta` (well
        proclaimed) chứ không mất nó như “well explained”.
    `suppaṭipanno bhagavato sāvakasaṅgho` — “The Saṅgha of the Buddha’s disciples” có
        22 tiền lệ trong tầng sn; vế `suppaṭipanno …` Sujato dịch “is practicing well”
        (dn28:2.15, mn89:10.2). Ghép lại đúng hai nguồn đó.
    `anuttaraṁ puññakkhettaṁ lokassā` — “the supreme field of merit for the world.” có
        103 tiền lệ trong tầng đã ghim, dùng y nguyên.
    `paccattaṁ veditabbo viññūhi` — KHÔNG có tiền lệ. Dịch “to be realized directly by
        the wise” theo nghĩa từng chữ (`paccattaṁ` = trực tiếp/tự thân, `veditabbo` =
        điều cần biết chứng ngộ, `viññūhi` = bởi bậc hiểu biết). Đây là chỗ dễ sai
        nhất nên hạ `terminology` xuống 8.8.

  Cả hai khoá dùng dấu lược `…pe…` đúng một đơn vị, giữ nguyên vị trí. Hệ quả: câu
  Anh đọc cụt ngang ở giữa, vì phần bị lược ở 2.2 là `yathābhūtaṁ akaṇṭhāti … desayāmi`
  và ở 3.2 là `ujuppaṭipanno … añjalikaraṇīyo`. Không mở rộng. Ngoặc ở đuôi 2.2/3.2 để
  MỞ vì Pāli hai khoá này kết bằng `hīti.` / `lokassāti.` không có dấu đóng — cùng cách
  bản đã ghim để mở ở sn55.32:2.2.
