notes: |-
  Cả ba khoá lặp lại Pāli đã có bản dịch trong CHÍNH bài này:

    - 3.4 lặp 3.14, dùng lại nguyên văn bộ từ "But by not grasping what’s
      impermanent, suffering, and perishable, would such a view arise". Bản ghim ở 3.14
      có `“` và `?` mà Pāli không có, nên bản lấp bỏ ngoặc và kết bằng `:`.
    - 3.5 và 3.15 đều lặp 1.3, dùng lại nguyên văn kể cả khuôn `’”?` (Pāli kết
      `’”ti?`, chốt đếm hai ngoặc đóng).

  Bất định đã ghi nhận:

    - Dấu hai chấm ở 3.4 là hệ quả của chốt `?`-theo-Pāli, không phải lựa chọn thẩm mỹ.
    - 3.6 ("No hetaṁ, bhante") và 3.19 ("Aṭṭhārasamaṁ") trống ở bản ghim và dưới
      ngưỡng 40 ký tự, nên cột English của khối 3 vẫn đứt quanh 3.5. (3.8–3.11 đã có
      bản ghim.) Không bịa chữ để nối.
    - Bài này chưa có bản Việt của dự án, nên không có đối chiếu Việt.
    - Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của
      lớp lấp. `triangulation` bị chặn ở 8.0 vì không có bản Anh độc lập.
