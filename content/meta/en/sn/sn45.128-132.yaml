notes: |-
  Bài rút gọn của sn45.127 ("Slanting East"), và bản Anh đã ghim CÓ bản đầy đủ ở sn45.127. Cùng
  cách dựng như sn45.122-126:

  - 1.10: Pāli TRÙNG NGUYÊN VĂN với sn45.108:1.2, nên chép nguyên văn lớp lấp đã publish ở đó: "the
    Ganges, Yamunā, Aciravatī, Sarabhū, and Mahī, all of them slant, slope, and incline to the east".
  - 1.11 và 1.14: cùng Pāli với sn45.122-126:1.11/1.14 (chỉ khác ở 1.13) — dùng một bộ từ cho cả hai bài.
  - 1.12: chép nguyên văn sn45.97:1.3 đã publish.
  - 1.13 (`nibbānaninnaṁ nibbānapoṇaṁ nibbānapabbhāraṁ`) lấy từ sn45.127:1.4: "which slants, slopes, and
    inclines to extinguishment". Giữ ĐÚNG MỘT `…`, không mở rộng.

  SAI LỆCH ĐỦ ĐỂ GHI, không sửa ở đây: bản Việt dự án 1.10 dịch `pācīna` là "phía tây" (west). Cả Pāli
  (`pācīnaninnā pācīnapoṇā pācīnapabbhārā` = nghiêng về phía ĐÔNG), cả bản Anh đã ghim ở 1.1 ("slant,
  slope, and incline to the east"), lẫn tiêu đề "Slanting East" đều là ĐÔNG; "tây" là lỗi của tầng Việt.
  Lớp lấp ghi "east". Tệp Việt không nằm trong phạm vi lát này nên không sửa ở đây — cần một lát Việt.

  Cùng đường may như sn45.122-126: `bahulīkaronto` có ở 1.11 nhưng không ở 1.12/1.14, kế thừa từ bản đã
  publish.

  `triangulation` 8.0: người viết lớp lấp cũng là người chấm.
