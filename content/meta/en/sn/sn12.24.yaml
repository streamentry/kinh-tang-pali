notes: |-
  **Phân loại 23 khoá (đo bằng máy): A = 5 · B = 8 · C = 10 · D = 0.** Đã ghi 23/23 khoá `fillableSegments`.

  **A (5):** `14.3` ← `4.2`/`8.3`; `14.4` ← `4.3`/`8.4`; `15.1` ← `5.1`; `15.4` ← `9.4`; `16.1` ← `6.1`.

  **C (8) là tám khoá `Yepi te …pe…` / `yepi te …pe…` (`9.2`, `9.3`, `10.2`, `10.3`, `15.2`, `15.3`, `16.2`, `16.3`)**, đều 12 ký tự, dưới ngưỡng. Pāli chỉ có hai chữ + `…pe…` ⇒ lấp đúng “In the case of those …” / “in the case of those …” (cụm mở đầu Sujato dùng cho `Yepi te` ở `5.2`–`6.4`), **một** `…`, không mở rộng. Lưu ý tầng ghim: `9.1` và `10.1` Sujato tự thêm `…` ở cuối dù Pāli `9.1`/`10.1` viết đủ — không phải khoá của lát.

  **B nhóm 1 — câu hỏi của du sĩ gửi Đức Phật (`13.2`–`13.6`), nguồn `3.2`–`3.6` (0,79–0,95).** Tầng ghim thay cả `13.1`–`16.4` bằng một câu tóm ở `13.1` (“(The wanderers asked the Buddha the very same questions, and he gave the same answers.)”). Vì câu tóm ấy không có chủ ngữ `eke samaṇabrāhmaṇā kammavādā`, lớp lấp **không** chép trơn “Some of them assert…” của `3.2`–`3.4` (sẽ thành “them” không có tiền ngữ) mà dựng “Reverend Gotama, some ascetics and brahmins who teach the efficacy of deeds assert that …” — vế vị ngữ lấy nguyên của Sujato, chỉ chèn lại hô ngữ `āvuso gotama` và chủ ngữ mà Pāli `13.2`–`13.4` có thật. `13.5`, `13.6` đổi “the ascetic Gotama” thành “Venerable Gotama” theo Pāli `āyasmā gotamo`.

  **B nhóm 2 — lời Đức Phật đáp du sĩ (`14.2` ← `4.1`/`8.2`, `14.5` ← `8.5` 0,99, `16.4` ← `6.4`):** `14.2` dùng “I have said that suffering is dependently originated” của `8.2` vì người nói là Đức Phật, thêm “Reverends” cho `āvuso`; `16.4` chỉ thêm nháy đóng `’”` của Pāli.

  **C còn lại:** `14.1` “When they had said this, Ānanda, I said to those wanderers of other religions:”; `21.18` `Catutthaṁ.` ⇒ “Fourth.” (`sn12.24` là bài thứ tư của phẩm Dasabala `sn12.21`–`30`, khớp số).

  **Ngoặc và dấu lược:** 23/23 khoá khớp Pāli về nháy; dấu lược: 8 khoá `…pe…` ↔ 8 `…`, các khoá khác 0 ↔ 0. Hệ quả đọc: câu tóm đã ghim `13.1` đứng trước bản đầy đủ do lớp lấp cung cấp — lặp ý là của tầng ghim, hiện ra chứ không giấu.

  Triangulation 8.0: scorecard Việt của `sn12.24` (`content/meta/sutta/sn/sn12.24.yaml`) ghi `quality.assessed_by` thuộc **cùng họ công cụ hỗ trợ** với lớp lấp này (đối chiếu `source/tooling.yaml`). Vì vậy bản lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không** được tuyên bố là đã đối chiếu English nhờ lớp lấp. Đối chiếu thật sự có: Pāli root đã ghim + Sujato đã ghim (mọi khoá có lời) + bản Việt canonical (chỉ để đối chiếu nghĩa, không dịch vòng, không chép câu).

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; bốn lệnh đó còn nợ, nên không tuyên bố technical gate pass. Không đặt blocker vì chưa chạy không phải validation failure. Đã tự kiểm bằng máy: JSON parse, mọi khoá ⊆ `fillableSegments` của bài, 0 khoá shadow, NFC, 0 khoá rỗng, thứ tự khoá theo Pāli, Pāli trùng nguyên văn ⇒ English trùng (trừ các chỗ ghi ở trên), dấu lược và nháy so với Pāli từng khoá (dấu `’` có chữ thường đứng ngay sau tính là dấu nhạt lượu).

  Hai cơ chế khoá trống của tầng đã ghim (đo rồi báo, không sửa — sửa là shadow): **cắt cụt dãy** (dãy ≥ 4 khoá trống liên tiếp) = 1 dãy / 18 khoá / 1421 ký tự Pāli; **bỏ dòng song song** (chỉ xét khoá trống, thân từ = 6 chữ đầu của từ ≥ 4 chữ, khoá mở nhóm gom mọi khoá trống chưa vào nhóm có tỉ lệ chung ≥ 0,70, mỗi khoá thuộc đúng một nhóm) = 19/23 khoá. Khoá đã ghim có chữ nhưng ngắn dưới 25% Pāli (Pāli ≥ 40 ký tự): 0.

