notes: |-
  Lớp lấp: 5 khoá (`2.2`–`2.6`) nằm ở phần bản Anh đã ghim đã lược.

  **Bài kinh nói hai lần, và lần hai phải nghe y như lần một.** `2.2`–`2.6` là lời các vị chư
  thiên thuật lại cho Sakka đúng những gì họ đã nói với nhau ở `1.3`–`1.7`. Nếu dịch riêng
  `2.4`–`2.6` thành lời mới thì bài sẽ có hai hệ thống văn phong cho cùng một câu chuyện. Vì vậy
  từng khoá lấy lại đúng lời đã ghim, chỉ chèn xưng hô theo Pāli (`bhikkhave` → `mārisa`, tức
  "sir") và chỉnh dấu ngoặc theo đúng khoá:

  - `2.2` ← vế sau của `1.3` và `1.6`: "Here, sir, an ugly and deformed spirit is sitting on the
    throne of Sakka, the lord of gods." Dấu mở `‘` vì khoá này nằm trong lời dẫn của Đức Thế Tôn
    và báo lại lời chư thiên; ngoặc đóng của nó rơi vào `2.7`.
  - `2.3` ← `1.4` y nguyên văn đã ghim: "But the gods of the thirty-three complained, grumbled,
    and objected, sir:". Lưu ý bản đã ghim **không** dịch `Tatra sudaṁ` thành "it was heard" mà
    gộp vào "But"; lớp lấp theo y vì cùng một cụm Pāli.
  - `2.4` ← `1.5`: "Oh lord, how incredible, how amazing!" — dấu mở `“` theo Pāli khoá này (`1.5`
    mở bằng `‘`).
  - `2.5` ← `1.6` y nguyên văn đã ghim: "This ugly and deformed spirit is sitting on the throne
    of Sakka, the lord of gods.”" — đổi ngoặc đóng `’` thành `”` theo Pāli (`nisinno”ti.`), vì
    đây là lời trực tiếp của chư thiên chứ không phải lời dẫn.
  - `2.6` ← `1.7`: "But the more, sir, the gods complained, the more attractive, good-looking,
    and lovely that spirit became." Giữ "attractive, good-looking, and lovely" cho
    `abhirūpato dassanīyato pāsādikato`; không thu gọn thành một tính từ.

  **Vì sao `2.7` không thuộc lát này:** bản Anh đã ghim đã dịch `2.7` ("Surely, good fellow,
  that must be the anger-eating spirit!"), nên đó không phải chỗ trống của lớp lấp — ghi ra để
  không ai hiểu là bỏ sót.

  **Cần chạy lại `reference:gaps`.** Trước khi điền, `sn11.22` ở 70.6% (12/17 khoá có nội dung)
  và có record trong `content/meta/reference-gaps.yaml`; sau khi `published` là 100%. Test
  `a fill never leaves a gap record it has cured` sẽ đỏ cho tới khi `npm run reference:gaps` chạy
  lại. Việc này nằm ngoài lát.

  `triangulation` hạ vì không có bản Anh độc lập: cả năm khoá đều lấy lại từ chính bản đã ghim
  ở `1.3`–`1.7`, nên đây là bản sao một tầng chứ không phải hai bản độc lập. Bản Việt chỉ để đối
  chiếu nghĩa; người viết bản Việt của bài này (`Muse Spark`) không phải người viết lớp lấp này.