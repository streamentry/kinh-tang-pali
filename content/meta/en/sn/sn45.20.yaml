notes: |-
  1.8 TRÙNG NGUYÊN VĂN Pāli với 1.3 của CHÍNH bài (`Katamaṁ nu kho, āvuso, brahmacariyaṁ, katamo
  brahmacārī, katamaṁ brahmacariyapariyosānan”ti?`) nên chép nguyên văn bản Anh đã ghim: “What is
  the spiritual path? Who is someone on the spiritual path? And what is the culmination of the
  spiritual path?” `brahmacariyaṁ` → “the spiritual path” là khuôn của cả bài (1.2, 1.10, 1.13,
  1.15).

  BẤT ĐỊNH ĐÃ GHI — lỗi của Pāli gốc, không phải lựa chọn dịch: ở 1.7 Pāli viết `‘brahmacariyaṁ,
  brahmacariyanti, āvuso ānanda, vuccati.` — MẤT dấu `’ti` mà 1.2 có (`brahmacariyan’ti`). Hệ quả:
  1.7 chỉ còn 1 ngoặc mở / 0 ngoặc đóng, còn dấu `’` bị mất ấy lại xuất hiện ở CUỐI 1.8
  (`pariyosānan’”ti?`), nên 1.8 có 2 ngoặc đóng / 0 mở — lệch với 1.3 cùng câu (Pāli chỉ có 1 `”`)
  và lệch với bản Anh đã ghim ở 1.3. Bản Việt dự án 1.7 cũng để dấu nháy treo, nên hướng xử lý nhất
  quán.

  Cách xử lý: giữ dấu `‘` trước “the spiritual path” đúng vị trí Pāli, và đặt dấu `’` ở đúng cuối
  1.8 (chỗ Pāli đặt nó) để nó đóng ngoắc mở của 1.7. Đọc liền 1.7–1.8 vì thế hơi gượng; đây là hậu
  quả của Pāli hỏng, không có cách nào vừa bám Pāli vừa đọc trơn — hạ `vietnamese_clarity` xuống 8.6
  và `ambiguity_integrity` xuống 8.8. Người biên tập có thể đảo lựa chọn này nếu chấp nhận lệch số
  ngoặc.
