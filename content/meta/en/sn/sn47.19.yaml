notes: |-
  Tiền lệ: `attānaṁ rakkhanto paraṁ rakkhati, paraṁ rakkhanto attānaṁ rakkhati` đã có bản Anh đã
  ghim ở 2.4 và 3.9 của CHÍNH bài — “Looking after yourself, you look after others; and looking
  after others, you look after yourself.”; 3.1/3.4/3.2/3.5 cho cặp hỏi–đáp ngay trên và dưới.
  `rakkhati` → “look after” là khuôn của cả bài (1.11, 1.7, 2.2, 2.3, 3.7, 3.8).

  `evaṁ kho, bhikkhave,` → “In the same way, …”: đếm 319 khoá Pāli có vế này, khuôn chiếm nhiều nhất
  là “In the same way” (an7.55:2.7 7 lần, an4.112:2.1 5 lần, an6.5:3.1, an8.10:4.1, sn46.77-88:1.6
  …), khuôn “That’s how” chỉ vài lần. Chọn theo đa số.

  Không có bất định nào trong hai khoá này. 3.10 (`Navamaṁ.`) trống ở mọi tầng, ngoài lát đã giao.
