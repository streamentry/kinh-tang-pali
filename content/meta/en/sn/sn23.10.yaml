notes: |-
  1.6/1.9 lặp 1.4 và 1.11 (Sujato): "Thus that form/consulence will be given up, cut off at the
  root, made like a palm stump, obliterated, and unable to arise in the future." → dùng lại nguyên
  bộ vế. 1.5 gọi `vedanā` là "feeling", 1.8 gọi `saṅkhārā` là "choices".

  Số: `sā vedanā` số ít → "that feeling"; `te saṅkhārā` số nhiều → "those choices".

  Pāli 1.6/1.9 ở sn23.10 TRÙNG NGUYÊN VĂN với sn23.9:1.6/1.9, nên hai bài dùng đúng một lời
  (bản đã ghim ở sn23.10:1.11 cũng y hệt sn23.9:1.11, cùng dấu lược).

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
