notes: |-
  Khung 1.9–1.14 trùng nguyên văn sn38.1:2.7–2.12 (xem notes của sn38.6). Riêng `etāsaṁ tissannaṁ
  vedanānaṁ pariññāyā` khớp đúng từ đã ghim ở 1.7 của chính bài này: "for completely understanding these
  three feelings". `vedanā` → "feeling" cũng là từ đã ghim ở 1.1/1.2. Không có chỗ nào phải lệch.

  Bất định đã ghi nhận:

  - 1.8 (`sammādiṭṭhi …pe… sammāsamādhi.`) trống ở mọi tầng và không thuộc lát này, nên 1.10 dừng ở
    "that is—" rồi đứt. Hạ `vietnamese_clarity`.
  - `triangulation` 8.0: người viết lớp lấp cũng là người chấm.
