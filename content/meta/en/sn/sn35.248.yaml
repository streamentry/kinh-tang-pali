notes: |-
  KHÔNG có tiền lệ trong bản Anh đã ghim, và đây là lý do: quét toàn bộ Pāli đã ghim ra **40 khoá** colophon có `paṇṇāsako` hoặc `…vagge … samatto`, và **0/40** có chữ Anh ở commit đã ghim — Sujato không dịch dòng colophon nào. Nên phải tra trong chính dự án, và tiền lệ có hai khoá **cùng công thức** đã lấp và đã publish: `sn35.103:6.5` (`Saḷāyatanavagge dutiyapaṇṇāsako samatto.`) → “The second fifty in the Sixes Vagga is complete.” và `sn35.155:3.5` (`tatiyapaṇṇāsako`) → “The third fifty in the Sixes Vagga is complete.”; theo đúng luật dùng lại cách dịch đã có cho Pāli trùng.

  `Saḷāyatanavagga` giữ “the Sixes Vagga” vì Sujato dịch `Saḷavagga` là “The Sixes” (`sn35.103:0.2`), không phải “The Six Sense Bases” — cùng lý do đã ghi trong `content/meta/en/sn/sn35.103.yaml`. Khoá 9.5 của chính bài này CÓ chữ nhưng là công thức khác: “The Linked Discourses on the six sense fields are complete.” (`Saḷāyatanasaṁyuttaṁ samattaṁ`).

  Bất định còn lại: `catutthapaṇṇāsako` là “the fourth fifty” — tức nhóm thứ tư của năm mươi bài trong phẩm `Saḷāyatana`. Cách hiểu này kế thừa từ hai khoá trên; không tiến đoán thêm vì các khoá `saṅkhittaṁ`/`Tassuddānaṁ` của phẩm này cũng chưa ai lấp.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
