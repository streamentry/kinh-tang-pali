notes: |-
  4.3 trùng NGUYÊN VĂN Pāli với 3.2, 7.3 trùng với 6.2 — cả hai đều đã có lời Sujato, nên dùng
  lại nguyên văn lời ấy; chỉ bỏ dấu `‘` mở vì Pāli 4.3/7.3 không có (nháy kép do 4.2/7.2 mở,
  Sujato ở 4.2/7.2 cũng vậy).

  Quyết định cơ học đáng ghi: Sujato dùng `?` cho câu `ko nāmāyaṁ bhikkhu` ở 3.2/6.2, nhưng Pāli
  4.3/7.3 không có dấu hỏi, mà chốt kiểm tra `?` theo từng khoá. Bản lấp phải bỏ `?`, nên nối
  bằng gạch nối: "What is this mendicant’s name—this mendicant is good-natured". Mọi từ còn lại
  giữ y hệt Sujato.

  `vatāyaṁ` là dạng nhấn mạnh, Sujato không dịch riêng; giữ như vậy cho khớp bản đã ghim.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
