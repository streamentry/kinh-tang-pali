notes: |-
  **Tám trong chín khoá không dịch từ đầu, và có thể đo được.** Tám khoá `1.4`–`1.12`
  trùng **nguyên văn** ở ít nhất một bài nữa của cùng phẩm (đếm từng khoá trên 16 tệp Pāli
  của `sn33`): `1.4` 6 bài · `1.5` 5 · `1.7` 5 · `1.8` 4 · `1.9` 5 · `1.10` 5 · `1.11` 5 ·
  `1.12` 5; riêng `1.13` (`Tatiyaṁ.`) là duy nhất. Hai lớp lấp `published` cùng Pāli —
  `sn33.4` và `sn33.5` — khớp **từng ký tự cả tám khoá kia** (8/9; chỉ `1.13` khác, và khác
  đúng như nó phải khác). Nên lớp lấp này **tái dùng nguyên văn** tám câu đó, chỉ dịch riêng
  `1.13`. Đây là cùng kết luận mà lớp lấp `sn33.5` đã ghi trước cho bài này.

  **Bốn nhóm khoá (đo bằng so byte trên Pāli, in cả hai phạm vi).**
    - *Phạm vi trong bài, chỉ nhìn tầng Anh đã ghim*: **A 0 · B 2 · C 7 · D 0**.
      - **A = 0.** Không khoá lấp nào trùng Pāli với một khoá **đã có lời trong chính bài này**:
        ba khoá tầng ghim có chữ (`1.2`, `1.3`, `1.6`) không trùng với khoá nào trong tập lấp.
      - **B = 2.** `1.7` khớp `1.3` ở đoạn dài 48 ký tự `imāni anekavihitāni diṭṭhigatāni loke
        uppajjanti` (92,3% theo cửa sổ con chung dài nhất); `1.10` khớp `1.3` ở 61 ký tự
        (68,5%). Cả hai dựng lại từ lời `1.3` đã ghim.
      - **C = 7.** `1.4`, `1.8`, `1.11` (nhóm ba trùng byte), `1.5`, `1.9`, `1.12`, `1.13`.
      - **D = 0.** Đo được đúng một nhóm Pāli trùng byte trong bài — `1.4`/`1.8`/`1.11` — và cả
        ba đều **trống** ở tầng ghim, nên không có hai lời tầng để mâu thuẫn; cả ba dùng
        **nguyên văn** giống nhau.
    - *Phạm vi mở rộng, có tầng ghim **và** lớp lấp `published`*: **A 8 · B 0 · C 1 · D 0**.
      Tám khoá có lời ở nơi khác cho đúng Pāli đó; `1.13` là số thứ tự, tiền lệ trong lớp lấp là
      `Catutthaṁ.` → "Fourth." và `Pañcamaṁ.` → "Fifth." ⇒ "Third." (khớp cả bản Việt canonical
      "Thứ ba.").
    - Ngưỡng của phép đo B được nói thẳng: cửa sổ chung ≥ 50% chiều dài khoá lấp. Nếu hiểu B
      hẹp hơn là "cùng một mệnh đề, chỉ khác mạo từ hoặc dấu phẩy" thì `1.7` và `1.10` rơi sang
      C ⇒ **A 0 · B 0 · C 9**. Hai cách đếm đều cho cùng một kết luận: **không khoá nào phải dịch
      mà không có lời nào để bám.**

  **Nhóm B chi tiết, và phần tầng đã ghim nuốt mất mà lớp lấp chèn lại.**
    - `1.7` ← `1.3` ("…why **these various misconceptions arise in the world**? …”"): lấy nguyên
      vế giữa. Phần bị nuốt: vế dẫn `evamimāni` và dấu gạch dài `—` cuối Pāli. Sujato dịch cùng
      Pāli này ở `sn33.1:1.7`, `sn33.2:1.7`, `sn33.55:1.3` thành "**that** these various
      misconceptions arise in the world." — bản lấp bỏ `that` vì chính bản ghim của bài này đã
      đóng ngoặc quá sớm ở `1.6` (xem dưới), giữ lại sẽ sinh `…” that these various …`.
    - `1.10` ← `1.3` cho vế giữa, cộng "This is the cause, this is the reason" mà tầng ghim đã
      dịch đúng Pāli `Ayaṁ kho … hetu, ayaṁ paccayo` ở `sn33.1:1.10` và `sn33.2:1.10`.
      Phần bị nuốt ở tầng ghim: danh từ `vaccha` và **toàn bộ vế** `yānimāni … uppajjanti` —
      tầng ghim dừng ở "This is the cause, this is the reason.”" rồi **đóng ngoặc ở khoá Pāli
      không có ngoặc**. Giữ `vaccha` là hợp với lớp lấp của chính dự án: đo được **46** khoá tầng
      ghim có đúng công thức Pāli `Ayaṁ kho, X, hetu, ayaṁ paccayo, …` và **không** khoá nào
      trong số đó giữ từ gọi — tầng ghim rút thành "This is the cause, this is the reason why …";
      còn lớp lấp đã `published` giữ từ gọi ở **9** khoá ("This, mendicant, …" ở `sn29.4:1.5`,
      `sn29.5:1.5`, `sn29.8:1.5`, `sn29.9:1.5`; "This, householder, …" ở `sn35.125:1.6`,
      `sn35.126:1.6`; "This, Vaccha, …" ở `sn33.4:1.10`, `sn33.5:1.10`). Vế `yānimāni …` lấy từ
      chính `1.3` đã ghim của bài này, nên không phải cách dịch từ trí nhớ.

  **Dấu lược và ngoặc — đếm từng khoá, không dùng một khuôn chung.**
    - `…pe…` ở `1.4`/`1.8`/`1.11` là **một** đơn vị lược (Pāli đếm được hai ký tự `…`), nên lớp
      lấp ghi **đúng một** `…`; 11 khoá lấp khác trong tầng với đúng Pāli này cũng vậy, và
      `sn33.2:1.4` của tầng ghim cũng vậy. Sáu khoá còn lại Pāli không có `…` ⇒ lớp lấp không
      thêm ở đâu. Dấu gạch dài cuối `1.7` và `1.10` được giữ đúng như Pāli.
    - Ngoặc kép tính **theo từng khoá** và khớp Pāli ở 9/9: `1.9` (`…maraṇāti vāti.`) có 0/0 nên
      lớp lấp **không** có ngoặc nào; `1.5` (`…vā”ti?`) và `1.12` (`…vā”ti.`) có 0/1 nên lớp lấp
      kết `.”?` và `.”` — **một** ngoặc đóng, không phải hai. Đếm toàn tầng: 6 khoá lấp có Pāli
      kết `”ti.` đều dùng `.”`; 5 khoá có Pāli kết `”ti?` đều đặt dấu hỏi **ngoài** ngoặc đóng
      (3 dùng `.”?` ở `sn33.4`, `sn33.5`, `sn33.6-10`; 2 dùng `'”?`), nên `.”?` là hình thức
      đã thành quy ước của phẩm này. Chọn nó thay vì `”?` chỉ vì khớp **hai** bản lấp anh em có
      **cùng Pāli và cùng vị trí**; nếu đổi sang `”?` thì phải đổi cả hai bài kia, việc ngoài lát này.
    - Dấu chấm trong `.”?` là dấu kết câu tiếng Anh đặt trong ngoặc theo quy ước lớp lấp, không
      phải một nội dung Pāli thêm vào; Pāli khoá này không có `.` mà có `?`.

  **Cố ý lệch tầng Anh đã ghim, và lý do.**
    - `1.3` và `1.6` — hai khoá **không thuộc lớp lấp**, không sửa được. Tầng ghim ở cả hai đều
      **tự thêm `…`** nơi Pāli không có một ký tự lược nào (đếm: `1.3` Pāli 0 / Anh 1; `1.6` Pāli 0
      / Anh 1) và **tự thêm ngoặc đóng** (Pāli `1.3` và `1.6` đều có 1 ngoặc mở, 0 ngoặc đóng;
      tầng ghim 1/1). Hậu quả đo được: hai câu trích dẫn của bài này bị đóng sớm ở `1.3` và `1.6`,
      nên lớp lấp phải khớp Pāli (không ngoặc ở `1.7` và `1.10`, một ngoặc đóng ở `1.12`) và bốn
      bản trong reader sẽ **không** cân nhau về dấu câu ở hai khoá đó. Đây là lỗi của tầng đã ghim,
      **không** phải của lớp lấp; báo ở đây, không sửa.
    - `1.5` — tầng ghim dịch cùng Pāli ở `sn33.2:1.5` thành "**after death**, a realized one
      neither still exists nor no longer exists.”" (vế "after death" đứng trước) và ở `1.9`/
      `1.12` cùng bài thành "**after death**, …" (đứng trước). Lớp lấp đặt "after death" **cuối**
      câu theo **đa số đo được 11 với 2**: `sn33.1:1.9`, `sn33.1:1.12`, `sn33.4` (ba khoá), `sn33.5`
      (ba khoá), `sn33.6-10:1.5`, `sn33.55:1.5`, `sn33.55:1.7` đều đặt cuối; chỉ `sn33.2:1.9` và
      `sn33.2:1.12` đặt trước. Vế bị `…pe…` nuốt mất phải được chèn lại, vì `tathāgato paraṁ
      maraṇāti vā` là chỗ duy nhất mang nghĩa "sau khi mạng chung"; chữ `or` ở đầu là mạch nối
      với vế trước `hoti ca na ca hoti … vā` trong danh sách.

  **Số khoá đã ghi: 9/9. Còn trống: 0.** Mười sáu khoá Pāli của bài; bảy khoá không thuộc lớp lấp
  vì tầng ghim đã có chữ (`0.1`–`0.3`, `1.1`, `1.2`, `1.3`, `1.6`) — đếm lại tập lấp được, bằng
  **đúng** tập `fillableSegments` của bài. Không có khoá nào bị bỏ sót: khoá duy nhất dưới ngưỡng
  40 ký tự ngoài khối `:0` là `1.13` (`Tatiyaṁ.`, 8 ký tự) và nó **đã** được lấp; vì không vào mẫu
  số nên coverage đạt 1,0 bằng **tám** khoá lấp có nội dung, không phải chín.

  **Coverage đo trước/sau.** Mẫu số = Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = **11**.
  Trước: `english-sujato` có chữ ở `1.2`, `1.3`, `1.6` ⇒ 3/11 = **0,2727**, tám khoá không có
  lời Anh, đúng bằng record gap của bài. Sau khi lớp lấp này `published`: 11/11 = **1,0000**,
  `substantiveWithoutEnglish` = 0. **Độ nhạy ngưỡng 0,8**: ngưỡng cần **9** khoá có lời, nên trước
  đó phải lấp thêm **6** khoá mới qua (9/11 = 0,8182). Sau này biên độ là **2 khoá**: mất 2 khoá
  lấp thì còn 9/11 = 0,8182 vẫn qua, mất 3 khoá thì 8/11 = 0,7273 rớt dưới ngưỡng.

  **Hệ quả với `content/meta/reference-gaps.yaml`.** Bài này **có** record
  (`substantiveSegments: 11`, `substantiveWithoutEnglish: 8`, `coverage: 0.2727`). Vì lớp lấp
  `published` đưa bài lên 1,0, record đó **bị xoá khỏi danh sách** — một record mà lớp lấp đã chữa
  thì không được để lại. Phần thống kê đầu tệp (`textsConsidered`, `coverageDistribution`) **cần
  chạy lại `npm run reference:gaps`** để khớp; lát này không được chạy lệnh đó.
  ⚠️ **Ngoài lát, báo mà không sửa**: cùng tệp đó còn giữ record của **`sn33.4`** và **`sn33.5`**,
  trong khi cả hai bài ấy đã có lớp lấp `published` ⇒ hai record đó thành vô lý sau khi bài lên
  1,0; và `sn33.4` có tệp lớp lấp nhưng **chưa có** tệp metadata của riêng nó.

  **Còn một chỗ lệch trong chính phẩm `sn33` — báo, không tự ý hòa.** Đo toàn lớp lấp: **106**
  chuỗi Pāli bị lặp, **271** khoá lặp với **một** cách dịch (nhất quán), **16** nhóm lặp với
  **nhiều** cách dịch. Riêng cụm `sn33` còn **một** chỗ: `sn33.2:1.9` và `sn33.2:1.12` đặt "after
  death" ở đầu trong khi `sn33.1`, `sn33.4`, `sn33.5` (và bài này) đặt ở cuối, cho **cùng một
  Pāli**. Ngoài cụm này, một ví dụ cùng loại là `sn44.11:2.6` đặt dấu chấm bên trong ngoặc đơn
  (`death.’`) trong khi `sn16.12:1.15` dùng `death’.”`. Tất cả nằm ngoài lát này ⇒ **không sửa**,
  chỉ báo.

  **`triangulation` bị chặn ở 8,0 và bài này KHÔNG được tuyên bố là đã đối chiếu Anh.**
  Bản Việt canonical của `sn33.3` cùng mang alias `OpenCode Space Bunny Free (agent)`, nên lớp lấp
  này **không phải** một cách đọc Anh độc lập; nó chỉ đối chiếu được với Pāli root, với tầng ghim
  và với chính các lớp lấp `published` của bài anh em. Ở commit đã ghim không có tầng Việt hiện
  hành cho bộ này. `ambiguity_integrity` hạ 9,3 vì hai lựa chọn hình thức đã ghi ở trên
  (`.”?` và vị trí "after death") là chọn theo đa số đo được, không phải theo một tầng Anh thứ hai.

