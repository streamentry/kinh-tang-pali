notes: |-
  Đây là bộ "bốn loại người tu định" thứ hai của phẩm `Jhānavagga`, ngay sau `sn34.10` — cùng
  công thức `sappāyakārī`, chỉ đổi `samādhikusalo` → `samāpattikusalo`. Vì vậy bốn khoá đầu chép
  y lớp lấp của `sn34.10` (`content/translation/en/project/sutta/sn/sn34.10_…json`, đã `published`),
  thay đúng `immersion` → `entering immersion` theo cách bản ghim ở `sn34.19:1.4` dịch
  `samāpattikusalo`:

  - `1.5` ← `sn34.10:1.5`: "One meditator is skilled in doing what’s conducive to immersion but not
    in entering immersion."
  - `1.6` ← `sn34.10:1.6`: "One meditator is skilled neither in entering immersion nor in doing
    what’s conducive to it."
  - `1.7` ← `sn34.10:1.7`: "One meditator is skilled both in entering immersion and in doing what’s
    conducive to it."
  - `1.8` ← `sn34.10:1.8`: "Of these, the meditator skilled both in entering immersion and in doing
    what’s conducive to it is the foremost, best, leading, highest, and finest of the four."

  `1.9` là **bản sao nguyên văn** của lớp lấp ở `sn34.46:1.6`, vì Pāli hai khoá này **giống hệt
  từng chữ** (`Seyyathāpi, bhikkhave, gavā khīraṁ, khīramhā dadhi, … tatra aggamakkhāyati;`).
  Không dịch lại lần thứ hai. Cùng bộ đó còn `sn34.3`–`sn34.9` và `sn34.11` với 9 tệp lấp nữa,
  tất cả dùng đúng khuôn này. Đếm trên toàn tầng lấp **kể cả tệp của lát này**: 19 lần "One
  meditator is skilled both", 19 lần "…is skilled in", 19 lần "…is skilled neither", và **10
  tệp** mang đúng cụm "the foremost, best, leading, highest, and finest of the four".

  ⚠️ **Dãy danh hiệu `aggo seṭṭho mokkho uttamo pavaro` tôi chép y của dự án, và cách dịch đó
  không phải của Sujato — cần nói rõ.** Dự án dịch là "the foremost, best, leading, highest, and
  finest", tức `mokkho` (giải thoát) → **"leading"** và `pavaro` (chiến thắng) → **"finest"**.
  Bản Việt của chính dự án dịch rõ hơn: *"là nhất, là tốt nhất, là **giải thoát**, là tối thượng,
  là **chiến thắng**"* (`sn34.19:1.8`), cũng vậy ở `sn34.10:1.8`. Tức bản Anh của lớp lấp đã
  *mềm* đi hai từ so với bản Việt. Tôi giữ nguyên bản Anh của lớp lấp để `sn34.19` không lệch với
  9 tệp anh em trong cùng phẩm, và ghi lại ở đây để người biên tập cân nhắc sửa cả 10 tệp nếu
  thấy "giải thoát"/"chiến thắng" đúng hơn. Vì tiếng Anh không tự nói ra `mokkho`,
  `ambiguity_integrity` hạ 9,2.

  **`1.10` mang dấu `”` ở cuối, và điều đó gây lệch ngoặc — phải nói.** Pāli ở `1.10` kết
  `pavaro cā”ti. `, tức dấu ngoặc kép **đóng ở đây**, nên tôi đóng. Nhưng bản ghim ở `1.4` đã viết
  `…"”` (đóng sớm, vì Sujato không có chữ cho `1.5`–`1.10`). Kết quả: `1.2` mở một `“`, `1.4` đóng
  một, `1.10` đóng thêm một — cột English của `1.2`–`1.10` lệch ngoặc. Tôi **không** sửa được
  `1.4` (thuộc tầng đã ghim) và cũng không bỏ dấu `”` ở `1.10` (sẽ trái Pāli). Đây là hệ quả trung
  thực của việc lấp chỗ trống, không phải lỗi dịch; người đọc bốn cột sẽ thấy nó.

  **Dấu lược:** `1.5`–`1.8` Pāli **không** có `…pe…`, nên tôi không mang dấu `…` nào, kể cả dấu
  `…”` mà bản ghim đặt cuối `1.4`. Đây đúng là tiền lệ của chính `sn34.10` (bốn khoá lấp ở đó cũng
  không mang dấu lược). Ngược lại, `1.9` mở chữ thường "just as," vì chép y nguyên văn `sn34.46:1.6`
  và Pāli cũng viết thường.

  Lớp lấp: 6 khoá, tất cả nằm ở chỗ bản Anh đã ghim để trống. **Không khoá nào là blockquote
  tham chiếu và không khoá nào có Pāli rỗng**, nên không có khoá nào bị bỏ.

  Hai khoá bản Anh đã ghim để trống mà lát này KHÔNG lấp, vì Pāli **dưới 40 ký tự**: `1.11`
  (`Ekūnavīsatimaṁ.`, 15 — dòng đếm số thứ mười chín) và `1.12` (`(Samāpattimūlakaṁ.)`, 19).

  ⚠️ **Sai lệch cần người biên tập xử lý, tôi KHÔNG tự sửa.** Trước lát này coverage English của
  `sn34.19` là 1/7 = 0,1429, và **có** record ở `content/meta/reference-gaps.yaml:3119`
  (`substantiveSegments: 7`, `substantiveWithoutEnglish: 6`, `coverage: 0.1429`). Lớp lấp đưa nó
  lên 7/7 = 100%, nên record đó **thành thừa** và
  `tests/unit/english-fill.test.ts` ("a fill never leaves a gap record it has cured") sẽ đỏ. Tôi
  không chạy `npm run reference:gaps` và không sửa file đó. Người điều phối chạy lại trong worktree
  sạch.

