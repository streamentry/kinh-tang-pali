notes: |-
  Cả ba khoá đều TRÙNG NGUYÊN VĂN Pāli với khoá đã có bản Anh trong CHÍNH bài, nên chép nguyên văn
  theo luật 3: 1.8 ↔ 1.3/1.13 (`sutaṁ metaṁ, bhante, pubbakānaṁ ācariyapācariyānaṁ naṭānaṁ
  bhāsamānānaṁ:`), 1.9 ↔ 1.4/1.14 (`yo so naṭo raṅgamajjhe samajjamajjhe saccālikena janaṁ hāseti
  rameti, so kāyassa bhedā paraṁ maraṇā pahāsānaṁ devānaṁ sahabyataṁ upapajjatī’ti.`), và 1.11 ↔ 1.6
  (`“Alaṁ, gāmaṇi, tiṭṭhatetaṁ. Mā maṁ etaṁ pucchī”ti.` → “Enough, chief, let it be. Don’t ask me
  that.”).

  `ācariyapācariyānaṁ` → “tutors of tutors” và `raṅgamajjhe samajjamajjhe saccālikena` → “on a stage
  or at a festival with mixed truth and lies” đều là khuôn của chính bài, dùng y nguyên.

  Không có bất định nào trong ba khoá này. 1.10 (`Idha bhagavā kimāhā”ti?`, cũng trống) nằm ngoài
  lát.
