notes: |-
  Bốn nhóm khoá, đo bằng phép so Pāli TỪNG KHOÁ (không so tập khoá): A = 3 · B = 9 ·
  C = 0 · D = 0. Tổng 12, đúng bằng số khoá tầng Anh đã ghim để trống (đếm lại: 12/61 khoá
  trống, và cả 12 đều nằm trong mẫu số coverage). Không khoá nào thừa, không khoá nào thiếu.

  A — Pāli trùng BYTE với một khoá đã có lời ở tầng, nên dùng lại nguyên văn lời đó:
  3.2 · 4.2 · 5.2, cả ba lấy từ 2.2 ("Where is the Buddha staying at present?"), chỉ bỏ
  khoảng trắng cuối mà tầng ghim mang theo. Nhóm Pāli trùng byte đo được trong cả bài:
  3 nhóm / 8 khoá ({2.2,3.2,4.2,5.2} 43 ký tự · {10.2,12.2} 20 · {10.3,12.3} 20), và
  trong cả 3 nhóm lời tầng khớp nhau, nên không có D. Ngoài ra còn 4 cặp Pāli chỉ khác
  đúng MỘT dấu nháy, cũng đã dò: {9.4,9.7} {9.5,9.8} {10.1,12.1} {10.4,12.4}.

  B — Pāli gần trùng, dựng lại từ lời đã ghim ở khoá anh em (tỉ lệ khớp Pāli đo được):
    3.3 ← 2.3 (0,4978) · 4.3 ← 2.3 (0,6429) · 5.3 ← 2.3 (0,4796)
    3.4 ← 2.4 (0,7568) · 4.4 ← 2.4 (0,4080) · 4.5 ← 2.4 (0,5370)
    5.4 ← 1.4 (0,7000; so 2.4 là 0,6147)
    9.7 ← 9.4 (0,9896) · 9.8 ← 9.5 (0,9916)
  Phần tầng đã ghim nuốt mất mà lớp lấp phải chèn lại, theo từng khoá:
    - 4.5 là NỬA SAU của câu ở 2.4 ("cũng vậy—biến mất khỏi Jetavana và hiện ra trong
      Phạm Thiên giới ấy") vì 2.4 viết cả hai vế trong một khoá còn 4.4/4.5 tách đôi.
    - 4.3 và 5.3 viết lại vế cuối `tejodhātuṁ samāpannaṁ` mà chính lược của 3.3 đã nuốt.
    - 9.7/9.8 lặp lại đúng hai khoá 9.4/9.5 (vị quyến thuộc được hỏi câu đó hai lần).
  9.7 và 9.8 lấy NGUYÊN VĂN lời đã ghim, chỉ đổi dấu nháy theo Pāli từng khoá (xem dưới).

  C = 0: cả 12 khoá đều có khoá anh em trong cùng bài đã có lời ở tầng để dựng lại, nên
  không khoá nào phải tự dịch từ Pāli trong bóng tối.

  Dấu lược: 7 khoá Pāli ghi `…pe…`, lớp lấp ghi ĐÚNG MỘT `…` ở cả 7 (3.3 · 3.4 · 4.3 ·
  4.4 · 5.3 · 5.4), và 5 khoá Pāli không có lược thì lớp lấp không thêm. Đo lại: 0 lệch.

  Dấu nháy — đo từng khoá, kể cả `‘’`:
    3.2/4.2/5.2 → `“…”` như Pāli. 9.7 mở `“`, 9.8 đóng `”`: đây là CẶP THẳNG, khác hẳn
    9.4/9.5 vốn là cặp LỒNG (`‘…’”`), dù câu chữ Pāli hai cặp gần như trùng nhau (chỉ
    khác MỘT dấu nháy: 9.4 mở `‘` còn 9.7 mở `“`). Lớp lấp theo Pāli từng khoá, không
    chép theo 9.4/9.5, vì chép thì 9.7/9.8 sẽ lệch với chính Pāli ngay cạnh nó. Bỏ `ti?`
    theo đúng tầng đã ghim (2.2 cũng bỏ) nhưng GIỮ dấu `?` vì Pāli có.
    Tổng cân bằng nháy kép/nháy đơn của cả bài sau khi ghép lớp lấp: vẫn cân.

  Chỗ lớp lấp CỐ Ý LỆCH tầng Anh đã ghim, kèm lý do:
    - 5.3 (`Addasā kho āyasmā anuruddho …pe… tejodhātuṁ samāpannaṁ.`): lớp lấp nhắc lại
      "the Blessed One" là chủ ngữ của vế tính từ `tejodhātuṁ samāpannaṁ`, vì trong Pāli
      chủ ngữ đó nằm TRONG lược. Đây là gọi lại tông chỉ bị lược, KHÔNG phải dịch phần bị
      lược — lớp lấp không dịch `dibbena cakkhunā visuddhena…vehāsaṁ pallaṅkena nisinnaṁ`.
      Vì vậy 5.3 mở đầu bằng "Having seen" còn 3.3/4.3 mở bằng "saw": 5.3 Pāli không viết
      ra tân ngữ (`bhagavantaṁ dibbena cakkhunā` nằm trong lược) nên không thể đặt nó sau
      động từ hữu hạn.
    - 3.4/4.4/5.4 (`Disvāna`): tầng ghim dịch `Disvāna` là "Then," và bỏ luôn cả `evameva`
      ở 2.4. Lớp lấp giữ "Having seen it" và giữ "even so" ở 3.4/4.5, vì ở các khoá này
      lớp lấp phải cắt câu ngay giữa ẩn dụ, mất "Then," thì mất luôn dấu hiệu có vế mới.
    - 5.4: Pāli không có `evameva` (khác 3.4) nên lớp lấp không thêm; và lớp lấp KHÔNG
      dịch phần lược, nên câu kết không có chủ ngữ ("…reappeared in that realm of
      divinity."). Đúng như Pāli.
    - 3.4 viết hoa "Having" trong khi Pāli `disvāna` viết thường vì 3.3 không có dấu chấm
      (hai khoá là một câu). Lớp lấp viết hoa để mỗi dòng của bản đối chiếu tự đọc được;
      bản Việt hiện hành cũng viết hoa "Sau khi thấy". 4.5 Pāli viết thường `evameva` nên
      lớp lấp viết thường "even so".
    - 4.3/5.3 dùng "who had entered upon the fire element" thay cho "having entered upon
      the fire element" của 2.3: vế cuối ở đây là vị từ đứng sau chủ ngữ, quá khứ hoàn
      thành ("đã nhập hỏa giới") đúng sắc thái `samāpannaṁ` và đọc được sau dấu lược.

  Lỗi tầng Anh đã ghim đo được ở CHÍNH bài này (báo cáo, không sửa — không khoá nào
  thuộc lát này): 16/61 khoá.
    - 1.4: `…pe…` bị MỞ RỘNG thành "would extend or contract their arm" rồi còn thêm
      "he vanished from Jeta's Grove" — phần này Pāli gốc đã lược, tầng ghim tự viết ra.
    - Bịa dấu `…` nơi Pāli viết đủ, 5 khoá: 3.1 · 3.5 · 4.1 · 4.6 · 5.1. Bốn trong năm khoá
      đó còn bị mất nội dung (`etadahosi` = "thought" ở 3.1/4.1/5.1; `Atha kho āyasmā X` ở
      3.5/4.6). Bất đối xứng: hai khoá anh em 2.5 và 5.5 cùng loại thì tầng ghim viết đủ.
    - Vệt markup hỏng `<j>` sót trong lời ở 10.3 và 12.3.
    - ĐẢO THỨ TỰ theo từng khoá ở hai cặp kệ 10.1–10.4 và 12.1–12.4: mỗi khoá mang nội
      dung của một khoá Pāli khác (chu kỳ 4: 10.1←10.4, 10.2←10.1, 10.3←10.2, 10.4←10.3),
      nên bốn cột hiện lệch ô. Nguyên nhân là đảo cú pháp Anh buộc phải vậy (mệnh đề
      tương đối cần danh ngữ trước), nhưng hậu quả vẫn là mỗi dòng sai ô.
    - 2.3 bỏ tên `āyasmā mahāmoggallāno` ("he").
    - 9.5 (và 9.8 lớp lấp kế thừa) dịch `seyyathāpi` là "comparable to" thay vì "such
      as". Không đổi nghĩa câu hỏi nên không sửa: sửa thì 9.7/9.8 lệch 9.4/9.5 ngay cạnh.
    - 10.1/12.1 và 10.4/12.4 cùng Pāli (khác đúng một dấu nháy) nhưng lời tầng khác nhau;
      khác biệt nằm ở tầng lồng nháy nên có lý do, báo để không ai "hòa" nhầm.

  Còn lại 0 khoá trống. 12 trên 12 khoá trống của bài đều đã lấp; các khoá còn lại đều
