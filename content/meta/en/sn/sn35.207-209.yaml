notes: |-
  Hai khoá dùng câu khuôn của lớp lấp, đã publish ở sn35.204:1.8, sn35.210-212:1.5,
  sn35.216-218 và sn35.219-221:1.2, và Pāli ở đây trùng nguyên văn `Yadanattā, taṁ
  ‘netaṁ mama, nesohamasmi, na meso attā’ti evametaṁ yathābhūtaṁ sammappaññāya
  daṭṭhabbaṁ` — vế đó đã được Sujato dịch ở sn35.204:1.4, sn35.210-212:1.2 và
  sn35.219-221:1.2. 1.3 có `…pe…` nên giữ `…`; 1.7 không nên không.

  `sammappaññāya` = "right understanding" (cụm "should be truly seen with right
  understanding like this" 48 lần trong SN đã ghim, không có cách dịch cạnh tranh).

  1.4, 1.5, 1.6, 1.8, 1.9 vẫn để trống vì thuộc lát khác, nên đọc 1.3 và 1.7 cần bối
  cảnh cột Pāli; đó là giới hạn phân chia lát, không phải lỗi căn khoá.
  `triangulation` 8.0 là đặc thù của lớp lấp.
