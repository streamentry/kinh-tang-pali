notes: |-
  Bốn khoá lấp là hai cặp vế, mỗi cặp lặp lại y hệt cho `rūpesu` và `dhammesu`.

  Tiền lệ đã đếm, đủ để chốt cả hai cặp:

  - `Evaṁ passaṁ, bhikkhave, sutavā ariyasāvako … anapekkho hoti` — sn22.10:1.4 và
  1.12, sn22.11:1.4 và 1.12 đã ghim: "Seeing this, a learned noble disciple is not
  concerned with past …," (28 chỗ `sutavā ariyasāvako` có bản ghim, cùng một bộ từ).
  Lớp lấp cũng đã có sn35.11:1.3: "Seeing this, a learned noble disciple is not
  concerned with past sights;" — đúng khoá 1.3 của bài này.
  - `nibbidāya virāgāya nirodhāya paṭipanno hoti` — sn22.10:1.6 đã ghim: "and they
  practice for disillusionment, dispassion, and cessation regarding present form."
  28 chỗ cùng vế trong Pāli, mọi bản ghim đều dùng đúng cục "practice for
  disillusionment, dispassion, and cessation". Lớp lấp có thêm sn35.11:1.4 và
  sn35.7:1.10/1.12.

  `rūpā` dịch là "sights" vì 1.1 đã ghim của chính bài này ("sights of the past and future
  are impermanent"), và `dhammā` là "ideas" cũng vì 1.10 đã ghim ("ideas" là bản dịch
  Sujato chung cho `dhammā` trong sn35). Bản Việt dự án khớp nghĩa ở cả bốn vế.

  Bất định đã ghi nhận:

  - 1.4 (`anāgate rūpe nābhinandati;`) và 1.13 (`anāgate dhamme nābhinandati;`) KHÔNG
  thuộc lát này và đang trống. 1.5 và 1.14 vì thế mở chữ thường để nối tiếp, đúng như
  sn22.10:1.6 và sn35.11:1.4 đã làm. Khi lát khác điền hai khoá đó, cần dùng đúng một bộ
  từ với 1.3/1.12 để câu không đứt.
  - Toàn bộ 1.6–1.11 (`Saddā … gandhā … rasā … phoṭṭhabbā … dhammā aniccā …`) đã bị lược
  và dưới ngưỡng, nên cột English của bài vẫn dừng ở 1.5 và 1.14.
  - `triangulation` 8.0; `han_viet_balance` là giá trị mặc định của lớp lấp.
