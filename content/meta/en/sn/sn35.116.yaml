notes: |-
  **Phân loại 30 khoá (đo bằng máy; ngưỡng B = độ tương đồng Pāli ≥ 0,60 với một khoá đã có lời): A dùng lại nguyên văn = 2 · B dựng lại = 23 · C tự dịch = 3 · D Pāli trùng nhưng lời tầng khác nhau = 2.** Đã ghi 30/30 khoá `fillableSegments` (trong đó 27 khoá có nội dung ≥ 40 ký tự Pāli; 3 khoá còn lại dưới ngưỡng, không vào coverage). Số khoá trống còn lại của bài: 0 (mọi khoá tầng đã ghim để trống đều đã lấp). Pāli chứa 0 dấu lược (`…pe…` hoặc `…` = đúng một `…` mỗi nơi), bản lấp giữ đúng 0; 16 khoá có nháy trong Pāli. Trong bài có 12 nhóm Pāli trùng nguyên văn (29 khoá).

  **Nhóm 1 — `1.6`, `1.7`, dựng lại từ lời của chính Đức Phật ở `1.1`, `1.2` (0,98 · 0,99).** Sujato nuốt lời trích của các tỳ-kheo vào `1.5` (“…without explaining the meaning in detail. …”, kết bằng một `…` không có trong Pāli). `1.6` có nháy lồng của Pāli (‘“…” ) nên viết ‘“Mendicants, I say it’s not possible … by traveling.” — nháy đóng nằm sau “traveling”, trước `ti vadāmi` như Pāli `patteyyan”ti`, và bỏ “I say” lặp (Sujato ở `1.1` đã gộp “I say” vào câu).

  **Nhóm 2 — lượt báo với Ānanda (`4.1`–`4.12`), dựng lại từ `1.4`, `1.5`, `1.8`, `2.1`–`2.4`, `8.2`, `8.3`.** `4.1` ← `1.5` (0,96), `4.2` ← `8.2` (1,00), `4.3` ← `8.3` (0,99), `4.5` ← `1.5` (0,98), `4.6`/`4.7` theo `8.2`/`8.3` không nháy, `4.8` ← `1.8` (0,99; ’ đóng thay cho ”), `4.10` ← `2.2` (0,95; ‘ mở thay cho “), `4.12` ← `2.4` (0,99; ’ đóng thay cho ”). Pāli có hô cách `āvuso` ở `4.1`, `4.4`, `4.5`, `4.9`, `4.10` mà Sujato thường lược; lớp lấp giữ (“Reverend Ānanda,”, “Reverends,”).

  **Nhóm 3 — lượt báo với Đức Phật (`10.1`–`10.13`)** cùng cách, hô cách `bhante` thành “Sir”: `10.1` ← `8.1` (0,94), `10.10` ← `2.2` (mở ‘), `10.12` ← `2.4`, `10.13` ← `3.1` (0,72) với cụm “ask him about this matter” của `2.4`. Các khoá có Pāli trùng hẳn với nhóm 2 (`10.2`, `10.3`, `10.5`–`10.8`, `10.11`, `10.12`) mang đúng cùng lời với `4.x` tương ứng.

  **Nhóm 4 — `5.4`, `6.2` ← `5.3` (0,24: khoá nguồn dài gấp nhiều lần).** Sujato gộp `So hāvuso, bhagavā jānaṁ jānāti, passaṁ passati—` và `cakkhubhūto, … tathāgato` vào `5.3` (và `6.1`); lớp lấp lấy đúng đoạn đuôi “He is vision, he is knowledge, … the Realized One.” cho `5.4` và `6.2` (hai khoá Pāli trùng nhau). Cột Anh vì vậy lặp danh hiệu hai lần cạnh nhau; lặp do tầng đã ghim nuốt.

  **A — 2 khoá** (`4.2` và `10.2`, Pāli trùng `8.2`/`8.17`). **C — 3 khoá:** `4.9`, `10.9` (“Reverend/Sir, then we thought,”, theo khuôn `2.1`) và nhãn `11.4` “Third.” (Pāli `Tatiyaṁ`, số Pāli, chưa đối chiếu thứ tự thực). `4.4`, `10.4` tính là B (theo `1.4`, thay ngôi “those mendicants” bằng “we”); `5.4`, `6.2` tính là B vì nguồn rõ (`5.3`) dù độ tương đồng thấp.

  **D — `4.11`, `10.11` (báo, không tự hòa).** Pāli trùng `2.3` và `6.6`, nhưng Sujato dịch `2.3` “He is capable of explaining…” (lời nghĩ nói về Ānanda) còn `6.6` “You are capable of explaining…” (nói trực tiếp với Ānanda). Ở `4.11` và `10.11` câu nằm trong lời thuật lại ý nghĩ ‘ayaṁ kho āyasmā ānando …’ ở ngôi thứ ba, nên lớp lấp theo `2.3`.

  **Nháy:** 16 khoá có nháy, English khớp Pāli từng khoá (đã đo; nháy đơn lồng trong nháy kép ở `1.6`). Chỗ lệch có chủ ý: bản lấp giữ hô cách mà tầng đã ghim lược; thông tin nghĩa không đổi.

