notes: |-
  Bốn nhóm khoá, đo bằng máy trên đúng 26 khoá Pāli của bài: **A = 6 · B = 6 · C = 2 · D = 0.**

  **Nhóm A (6 khoá) — dùng lại nguyên văn lời đã ghim, không dịch lại.** `3.2` `4.2` `5.2` có Pāli **trùng byte** với `1.3` (135 ký tự, tỉ lệ khớp 1,0000) ⇒ lấy nguyên văn lời `1.3`. `3.3` `4.3` `5.3` trùng byte với `1.4` (132 ký tự, 1,0000) ⇒ lấy nguyên văn lời `1.4`.

  **Nhóm B (6 khoá) — dựng lại từ lời đã ghim, kèm tỉ lệ khớp và phần chèn lại.**
  · `3.1` `4.1` `5.1` ← `1.2`, tỉ lệ khớp **0,9967**, khác **đúng một** ký tự: Pāli `1.2` mở đầu bằng `“`, ba khoá kia không. Lấy lời `1.2` **bỏ** dấu `“` mở. Không có phần nào bị tầng đã ghim nuốt mất: lời `1.2` đã đủ cả ba vế (`pathaviṁ nissāya` · `pathaviyaṁ patiṭṭhāya` · `evamete … karīyanti`), nên **không chèn** gì.
  · `3.5` `4.5` ← `1.6`, tỉ lệ khớp **0,9926**, khác **một chữ**: `evaṁ` → `Evaṁ`. Pāli `3.5` và `4.5` trùng byte nhau (134 ký tự). Lấy lời `1.6` và **bỏ** dấu `”` cuối mà lời `1.6` mang, vì Pāli hai khoá này không có `”`.
  · `5.5` ← `1.6`, tỉ lệ khớp **0,9889**, khác `evaṁ` → `Evaṁ` **và** thêm `”` trước `ti`. Pāli `5.5` **có** `”` ⇒ giữ `”`, bỏ dấu `ti`. Quy ước này đo được toàn tầng: **13.233** khoá Pāli kết `”ti.`; trong **8.757** khoá tầng Anh đã ghim có chữ thì **8.240** khoá (**94,1%**) dịch ra vẫn kết `”` và rơi `ti`. Có tiền lệ đúng y vậy trong chính phẩm này: `sn45.139:1.8` (Pāli kết `iti.`) dịch ra **không** có `”`, còn `sn45.139:4.7` (Pāli kết `”ti.`) dịch ra **có** `”`.

  **Nhóm C (2 khoá) — tự dịch từ Pāli.**
  · `2.1` `(Paragaṅgāpeyyālīvaṇṇiyato paripuṇṇasuttanti vitthāramaggī.)` → “(The fully-recited suttas belonging to the peyyālā beyond the Ganges should be told in full.)” Đây là **parivetti** (nốt biên tập), không phải lời kinh. Đo toàn tầng Pāli: cụm này xuất hiện **đúng 1 lần** — chính khoá này — nên không có chứng cứ so sánh nào. Vế “told in full” theo quy ước **đã đo** của tầng đã ghim cho `vitthāretabba/-āni/-abbāni` (ví dụ `sn53.23-34:1.1` → “(Tell in full as in the chapter on hard work at SN 45.149–160.)”). `peyyālā` giữ nguyên dạng chuyển tự: toàn tầng có **6** khoá Pāli chứa `peyyālā`/`peyyālī`, và ở hai khoá mà tầng đã ghim có dịch (`sn49.1-12:3.1`, `sn40.11:6.1`) nó **thay** cụp bằng số hiệu SN; ở đây không có chứng cứ cho phép nêu số hiệu SN nào ⇒ **không bịa**. Đây là chỗ đọc từ Pāli một mình, `ambiguity_integrity` hạ vì thế.
  · `5.6` `Paṭhamaṁ.` → “First.” theo khuôn đã thành của lớp lấp, đo trên **16** khoá nhãn thứ tự đã lấp: `Paṭhamaṁ.` **3/3** “First.” · `Dutiyaṁ.` 1/1 “Second.” · `Tatiyaṁ.` 2/2 “Third.” · `Catutthaṁ.` 3/3 “Fourth.” · `Pañcamaṁ.` 2/2 “Fifth.” · `Aṭṭhamaṁ.` 2/2 “Eighth.” · `Dasamaṁ.` 2/2 “Tenth.” · `Dvādasamaṁ.` 1/1 “Twelfth.”. Khoá này dài **9** ký tự nên **dưới ngưỡng 40** và không vào coverage, vẫn lấp vì chỗ thiếu chữ ở đây hiện ra ngay trước mắt người đọc.

  **D = 0.** Đã dò **4** cặp Pāli trùng byte trong bài (`1.3`=`3.2`=`4.2`=`5.2`; `1.4`=`3.3`=`4.3`=`5.3`; `3.1`=`4.1`=`5.1`; `3.5`=`4.5`). Mỗi cặp chỉ có **một** lời tầng đã ghim, các khoá kia trống ⇒ không có cặp nào cùng Pāli mà lời tầng khác nhau.

  **Dấu lược.** Không khoá lấp nào chứa `…`; tổng dấu lược của bản lấp bài này bằng **0**. Pāli bài này có `…pe…` ở `1.5`, `3.4`, `4.4`, `5.4` — cả bốn đã có lời tầng đã ghim nên lớp lấp không đụng tới.

  **Nháy — bảng cân đọc tay.** Khớp Pāli **từng khoá** ở **14/14**: `3.1` `4.1` `5.1` 0/0 · `3.2`–`5.3` 0/0 · `3.5` `4.5` 0/0 · `5.5` 0/1 (Pāli có `”`) · `5.6` 0/0. Tổng: Pāli **0** `“` / **1** `”`; lớp lấp **0** `“` / **1** `”`. Nháy đơn `‘’`: không khoá nào có ở cả hai bên (khi đếm `’` chỉ tính khi **không** đứng giữa hai chữ cái, nên dấu nhạt lượu tiếng Anh không lẫn vào).

  **Chỗ lớp lấp cố ý lệch tầng Anh đã ghim.**
  1. `3.5` `4.5` **bỏ** dấu `”` mà lời `1.6` mang — Pāli hai khoá này không có `”`, và luật là khớp Pāli từng khoá. Đây cũng khớp với chính tầng đã ghim: `sn45.139:1.8` (cùng dạng câu `…bahulīkarotīti.`) dịch ra không có `”`.
  2. `3.1` `4.1` `5.1` **bỏ** dấu `“` mở mà lời `1.2` mang — Pāli ba khoá này không mở nháy.
  3. **Không** sửa lỗi nào của tầng đã ghim ở `1.2`–`1.6`, vì sửa tầng đã ghim là shadow và `validate` chặn.

  **Lỗi của tầng Anh đã ghim, đếm ở đúng bài này (báo, không sửa được).**
  1. **Mở rộng `…pe…` thành văn xuôi: 1 khoá** — `1.5`. Pāli kết `…pe…` (**1** dấu lược) và trong khoá này Pāli chỉ viết **một** yếu tố đường (`sammādiṭṭhiṁ`); tầng đã ghim có **0** dấu lược và liệt kê đủ **tám** ("right view, right purpose, right speech, right action, right livelihood, right effort, right mindfulness, and right immersion"), dài **235** ký tự so với Pāli **114** (tỉ lệ **2,06**).
  2. **Thêm dấu lược: 3 khoá** — `3.4` `4.4` `5.4`: Pāli **1** dấu lược, tầng đã ghim **2** (`“…”` bọc hai đầu).
  3. **Nén do chính quy ước bọc `…` ấy: 3 khoá** — `3.4` Pāli **205** → **65** ký tự (0,32) · `4.4` **161** → **84** (0,52) · `5.4` **161** → **52** (0,32); cả ba mất hẳn vế `sammāsamādhiṁ bhāveti …` vốn nằm trong `…pe…`.
  4. **Thêm nháy kép không có ở Pāli: 4 khoá** — `1.6` thêm `”`; `3.4` `4.4` `5.4` thêm cặp `“…”`. Tổng cân: Pāli **1** `“` / **1** `”`, tầng đã ghim **4** `“` / **4** `”`.
  5. **Đảo thứ tự vế kèm nén: 1 khoá** — `1.6`. Pāli `1.6` và `1.3` là **cùng một câu** (khác đúng chữ `e`/`E` đầu câu và vế kết `iti`), nhưng hai lời tầng đã ghim **khác nhau**: `1.3` giữ cả hai vế “depending on **and grounded on** ethics” và đặt chúng **sau** động từ, còn `1.6` chỉ còn “grounded on ethics” và đặt **trước** — vế `nissāya sīlaṁ` bị rơi. Lớp lấp lấy lời `1.6` nguyên văn cho `3.5` `4.5` `5.5` nên bài vẫn mang sự lệch đó; **không tự hòa**, vì hòa thì ba khoá kia lệch với chính khoá `1.6` đã ghim.
  6. **Rơi mạo từ `bhikkhave`: 3 khoá** — `1.3` `1.4` `1.6` có `bhikkhave` ở Pāli mà lời tầng đã ghim không dịch (`1.2` thì có, “Mendicants,”).
  7. **Rơi dấu hiệu giả định `Seyyathāpi`: 1 khoá** — `1.2`, lời tầng đã ghim mở thẳng bằng “Mendicants,” không có “Suppose”.
  8. **Đo ra 0 loại lỗi này:** gộp khoá **0** · thiếu khoá **0** (tập khoá Pāli và tầng Anh trùng khít **26/26**) · đảo khoá theo chu kỳ **0** · vệt markup `<j>` sót **0**.

  **Phạm vi phẩm `sn45` — đo, không suy.** `sn45` là Balāḍhitassa-saṃyutta. Tệp Pāli trong kho: **114** (gồm 4 tệp dải `104-108`, `110-114`, `116-120`, `141-145`). `:0.2` khác nhau **15** giá trị; các số phẩm **1–14** là số phẩm trong chính bộ. `sn45.149` nằm ở phẩm `12. Balakaraṇīyavagga` (tầng Anh đã ghim: “12. Hard Work”), phẩm này có **12** bài là `sn45.149`–`160`, và `sn45.149` là bài **thứ nhất**. Xác nhận độc lập không suy diễn: chính tầng Anh đã ghim dịch nốt biên tập `sn53.23-34:1.1` (`Balakaraṇīyavaggo vitthāretabbo`) thành “(Tell in full as in the chapter on hard work at **SN 45.149–160**.)” — đúng dải 12 bài đo được. Trong bài `sn45.149` có **5** khối (`:1` nidāna + udāna, `:2` nốt parivetti, `:3`–`:5` ba lần lặp trọn với ba vế giữa khác nhau) và **một** nhãn thứ tự duy nhất là `Paṭhamaṁ.` ở `5.6`. **Khối nào cũng không mở đầu bằng chữ số**; con số `12.` chỉ xuất hiện ở `:0.2` và là **số phẩm**, không phải số khối.

  **Coverage — trước/sau bằng số.** Mẫu số = khoá Pāli có nội dung = **21** (ngưỡng 40 ký tự, bỏ khối `:0`; đo lại: 26 khoá − 3 khoá `:0` − `1.1` 16 ký tự − `5.6` 9 ký tự). Trước: **8/21 = 0,3810** (8 khoá có lời: `1.2` `1.3` `1.4` `1.5` `1.6` `3.4` `4.4` `5.4`). Sau khi `published`: **21/21 = 1,0000**; lớp lấp đóng **13** trong 21 khoá đó, khoá thứ **14** (`5.6`) dưới ngưỡng nên không vào coverage. **Nếu chưa `published` thì coverage không đổi: vẫn 8/21 = 0,3810** — lớp lấp chỉ tính khi `published`. **Độ nhạy ngưỡng 0,8**: cần ≥ **17**/21, tức phải thêm ≥ **9** trong 13 khoá có nội dung đã lấp ⇒ **có thể thiếu tối đa 4**; thiếu **5** là rớt (16/21 = 0,7619).

  **Hệ quả với `content/meta/reference-gaps.yaml`.** Bài này **có** record: `substantiveSegments: 21`, `substantiveWithoutEnglish: 13`, `coverage: 0.381`. Sau khi `published` thì record đó thành thừa (coverage 1,0000 ≥ ngưỡng) và cần bộ sinh dọn lại. **Tệp đó không bị chạm** trong lát này — để người điều phốn sinh lại bằng `npm run reference:gaps`.

  **Triangulation 8,0.** Scorecard Việt của bài (`content/meta/sutta/sn/sn45.149.yaml`) ghi cả `quality.assessed_by` lẫn `translators` là `OpenCode Space Bunny Free (agent)` — **trùng** alias lớp lấp trong `source/tooling.yaml`, nên lớp lấp **không phải** một cách đọc English độc lập: **bài này không được tuyên bố là đã đối chiếu English.** 12 trong 14 khoá lấp là bản dựng lại từ lời tầng đã ghim trong chính bài; chỉ `2.1` và `5.6` là dịch từ Pāli. Bản Việt canonical đủ 26 khoá và chỉ được dùng để **đối chiếu nghĩa**, không dịch vòng qua nó.

