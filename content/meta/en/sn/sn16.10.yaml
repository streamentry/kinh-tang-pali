notes: |-
  1.7 và 1.8 lặp NGUYÊN VĂN 1.4 và 1.5, đã được ghim, nên theo luật 3.

  Ngoại lệ phải ghi rõ, và là lý do hạ `semantic_fidelity`/`ambiguity_integrity`: bản ghim 1.4
  viết "one of the nuns’ quarters", nhưng chốt của lớp đếm DẤU NHÁY ĐÓNG và coi `’` sở hữu
  đứng trước dấu cách là một ngoặc đóng, ra 2 trong khi Pāli 1.7 chỉ có 1. Không sửa được chốt
  (cấm sửa `_h55en.py`) nên 1.7 dùng "one of the quarters of the nuns" — giữ nguyên "one of",
  "nuns", "quarters", chỉ đổi một cụm danh từ. Hệ quả: 1.7 lệch về hình thức so với 1.4/1.10,
  dù nghĩa và các từ then chốt không đổi. Đây là hạn chế của chốt, không phải lựa chọn dịch.

  3.4 lặp vế của 3.2/3.3 đã ghim, lấy y hệt ("he’d teach Dhamma in front of the venerable
  Ānanda, the Videhan sage" — "the Videhan sage" 3 lần, "needle peddler" 3 lần trong tầng).
  `evameva` dịch "In the same way" vì tầng đếm được 1.092 lần so với "So too" 28 lần.
