notes: >-
  Every one of the six filled segments is a passage the text has already said, so nothing here
  was translated afresh. 3.2 repeats 1.3 verbatim; 3.3 repeats 1.4; 4.9 repeats 2.4; 5.1 repeats
  2.5; 3.6 repeats 1.7. 4.8 is 2.3 with the comma after `kira` dropped — the only difference
  between them. In all five exact cases the fill reuses the rendering Sujato already gave the
  first occurrence, which is what the standing rule in AGENTS.md requires: a text that renders
  the same clause two different ways contradicts itself.

  This is the `sn11.24` lesson in its purest form, and it cuts the other way too. Sujato left
  3.2, 3.3 and 3.6 blank because 3.1 closes with `…`, not because the sense was obscure — so
  the second round of the boy’s visit reads in the reader as a hole precisely where the sutta is
  most repetitive, and a fresh reading of the Pāli in isolation is what would have invented a
  difference that does not exist. The sense of the whole text is that the second visit produces
  the identical result to the first: the boy reports the same words, and the mother still gets
  no teaching until she stops putting on slippers and covering her head (4.3–5.3). Filling 3.6
  with something other than 1.7’s wording would have quietly broken that argument.

  Quotation marks follow the Pāli rather than the surrounding Sujato segments: 3.6 and 4.8 both
  carry a closing `”ti.`, so both keep the closing quote, and 4.8 additionally opens with `“`
  as `2.3` does. Triangulation is capped at 8.0 — no independent English edition covers these
  passages.