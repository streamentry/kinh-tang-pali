notes: |-
  Bốn khoá này là ca lặp lại của hai khoá đã ghim: 3.2 đã ghim đúng `sabbe te catunnaṁ
    iddhipādānaṁ bhāvitattā bahulīkatattāti` và 6.2 đã ghim đúng `sabbe te imesaṁyeva catunnaṁ
    iddhipādānaṁ bhāvitattā bahulīkatattā”ti.`. Pāli của 1.2/2.2 và của 4.7/5.2 giống hệt, chỉ
    khác ở `ti.` / `”ti.`, nên lấy lại nguyên văn bản đã ghim — trừ dấu `”`, vì Pāli của bốn khoá
    đang lấp không có ngoặc đóng nào (luật 4).

    Vì vậy 1.2/2.2 và 4.7/5.2 chỉ khác nhau ở "the four" / "these four", đúng như `catunnaṁ` /
    `imesaṁyeva catunnaṁ`. `sabbe te` ("all of them") không dịch riêng vì bản đã ghim đã nuốt nó
    vào mệnh đề trước; giữ nguyên tiền lệ hơn là thêm chữ.
