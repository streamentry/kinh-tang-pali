notes: |-
    Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược. `sn22.85` có **10** khoá để trống; lát này
    được giao 7.

    **Có một cạm bẫy thật trong bài này, và đã tránh được bằng cách đọc cả bài.** `sn22.85` kể
    chuyện một tỳ-kheo tên Yamaka tin rằng bậc A-la-hán `na hoti paraṁ maraṇā` — không còn gì sau
    khi chết. Suy nghĩ đó bị nêu lại **bảy lần** trong bài. Nếu dịch từng khoá một cách riêng lẻ,
    sẽ dễ trượt thành *"một tỳ-kheo là bậc trên về học"* hoặc thành *"không hề có gì sau khi chết"* ở
    nơi không có chủ thể — và nghe rất như một bài kinh khác, ngược hẳn với chính lời đã ghim. Vì
    vậy sáu khoá trong bảy không dịch lại từ đầu:

    - `2.2` và `4.4` — Pāli trùng **nguyên văn** `1.3` (và `2.2` trùng `4.4`, ba khoá cùng một câu)
      ⇒ chép nguyên văn lời đã ghim ở `1.3`: "“As I understand the Buddha’s teaching, a mendicant
      who has ended the defilements is annihilated and destroyed when their body breaks up, and
      doesn’t exist after death.”"
    - `3.4` và `4.2` — Pāli trùng **nguyên văn nhau**, và là **vế trích** của `3.2`: `‘khīṇāsavo bhikkhu
      kāyassa bhedā ucchijjati vinassati, na hoti paraṁ maraṇā’”ti.`. Lấy nguyên văn vế đã ghim ở `3.2`
      ("a mendicant who has ended the defilements is annihilated and destroyed when their body breaks
      up, and doesn’t exist after death") và **khôi lại đúng hai cặp ngoặc kép** mà Pāli khoá này có:
      `‘…’”`. Sujato ở `3.2` đã gộp ngoặc thành `'?”`, nên lớp lấp không chép nguyên văn khoá `3.2` mà
      chép **vế trích** rồi tự đặt ngoặc.
    - `13.5` — Pāli trùng **nguyên văn** `13.2` ⇒ chép nguyên văn lời đã ghim: "‘When their body breaks
      up, after death, what happens to a perfected one, who has ended the defilements?’"
    - `5.3` — Pāli **khác** `1.3` ở hai chỗ: không dấu phẩy sau `ājānāmi`, và ngoặc mở là `‘` chứ không
      phải `“`. Câu dài bên trong **giống hệt**, nên lấy nguyên văn lời đã ghim và chỉnh ngoặc theo
      Pāli khoá này: `‘As I understand the Buddha’s teaching, a mendicant who has ended the
      defilements is annihilated and destroyed when their body breaks up, and doesn’t exist after
      death.’`

    **Một khoá tự dịch: `5.2`** (`“yamakassa nāma, āvuso sāriputta, bhikkhuno evarūpaṁ pāpakaṁ
    diṭṭhigataṁ uppannaṁ:`) → "“Reverend Sāriputta, the mendicant named Yamaka has such a harmful
    misconception:". Mọi vế trích lấy từ lời đã ghim trong bài: `āvuso sāriputta` → "Reverend Sāriputta"
    (theo `11.4`), `evarūpaṁ pāpakaṁ diṭṭhigataṁ` → "such a harmful misconception" (theo `3.1`
    và `6.1`), `bhikkhuno` → "mendicant" (theo `5.4` "the mendicant Yamaka"), `nāma` → "named" (theo
    `1.2` "a mendicant named Yamaka"). Pāli `uppannaṁ` không có `hoti` như `1.2`, nên lớp lấp dùng
    "has", không dùng "had".

    **Còn 3 khoá trống lấp được mà lát này không được giao — báo lại.** `8.5`, `9.13`, `28.9`.
    - `8.5` = `“No hetaṁ, āvuso” … ` trùng nguyên văn `8.3`; lời đã ghim ở `8.3` là "“No, reverend.”",
      và khoá này phải **giữ dấu lược trần `…`** mà Pāli có (không có `pe`).
    - `9.13` = `“No hetaṁ, āvuso”. ` trùng nguyên văn `9.3` ⇒ chép nguyên văn lời `9.3`.
    - `28.9` = `Tatiyaṁ.` (8 ký tự) — colophon, **dưới** ngưỡng 40 nên coverage không đo tới.

