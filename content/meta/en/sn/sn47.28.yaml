notes: |-
  Cùng Pāli `Ekamantaṁ nisinno kho āyasmā sāriputto āyasmantaṁ anuruddhaṁ etadavoca:` với sn47.27, và
  cùng hai bất định đã ghi ở đó — đọc notes của sn47.27. Tóm tắt: (1) tiền lệ Sujato ở sn52.5:1.2 và
  sn52.6:1.2 dịch vế này thành "Sāriputta said to Anuruddha:", RÚT MẤT `Ekamantaṁ nisinno`; kiểm bối
  cảnh thì cả hai bài đó đều không nói "ngồi một bên" ở khoá nào khác, nên đó là lược chứ thực — lớp
  lấp dịng lại, và bản Việt canonical 1.2 cũng dịch vế này. (2) Bản Anh đã ghim của CHÍNH sn47.28
  không nhắc "Sāriputta" (chỉ có "Reverend Anuruddha, …"), nên chốt `_lọt_pāli` bắt `Sāriputta` là
  Pāli lọt; giữ tên và bỏ dấu macro. `Sariputta` không có tiền lệ nào trong bản đã ghim — cần người
  điều phổn quyết nới chốt hoặc chấp nhận dạng không dấu.
  
