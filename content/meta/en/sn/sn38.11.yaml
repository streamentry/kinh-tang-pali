notes: |-
  Năm khoá của lát này là MỘT khuôn năm vế — hỏi, trả lời, xác nhận, khen, dặn —
  và khuôn ấy lặp nguyên vẹn ở bảy bài kế bên trong `Jambukhādakavagga` (`sn38.4`,
  `sn38.5`, `sn38.10`–`sn38.15`), chỉ khác đúng danh từ. Cả tám bài phải dùng CÙNG một
  bộ năm câu, nếu không thì cùng một vế Pāli sẽ mang hai cách dịch trong cùng một
  `Jambukhādakavagga`. Riêng bài này chỉ đổi danh từ: `these floods` thay cho
  `these cravings` của `sn38.10`, lấy nguyên từ `1.4` và `1.6` của bản Anh đã ghim.

  - `1.8` ← khuôn của `1.6`: bản đã ghim hỏi "is there a path and a practice for
    completely understanding these floods?", nên `1.8` hỏi lại đúng bằng cụm đó.
  - `1.9`, `1.11`, `1.12` cũng dùng y "completely understanding these floods". KHÔNG thêm
    "four" như bản Việt ("bốn dòng chảy"), vì cột Anh phải nhất quán với chính nó.
  - `1.13` `Alañca panāvuso sāriputta, appamādāyā` → "And, reverend Sāriputta, don’t be
    heedless." Không theo `an3.71:5.8` của cùng người dịch ("Just this much is enough for
    diligence"), vì ở đó `appamādāyā` bị đọc thành câu định lượng, còn ở đây Pāli là
    lời dặn trực tiếp.

  BẤT ĐỊNH ĐÃ PHÂN XỬ, ghi ra để không ai phải phân xử lại:

  1. `pahānāyā` nghĩa là "từ bỏ". Bản Việt dịch đúng vậy ("từ bỏ bốn dòng chảy ấy"), nhưng
     bản Anh đã ghim đã dịch đúng vế đó ở `1.6` thành "completely understanding". Tôi theo
     bản Anh đã ghim chứ không theo bản Việt: đây là một cột dịch riêng của
     SuttaCentral, và lớp lấp nhiệm vụ là HOÀN TẤT cột ấy chứ không phải phán xét lại
     lựa chọn của người dịch khác; dịch "abandoning" sẽ khiến người đọc bốn cột thấy `1.6`
     và `1.8` dịch khác nhau cho một vế Pāli. Đây là đánh đổi có chủ ý, và là chỗ trừ điểm
     của `semantic_fidelity`.
  2. `Bhaddako … bhaddikā` ("tốt … tốt hơn") dịch "good … better", không theo "a fine path,
     a fine practice" của `an3.71:5.7`: `bhaddikā` là dạng so sánh, "fine … fine" làm mất
     đúng cái so sánh ấy.
  3. `seyyathidaṁ—` ở `1.9` giữ nguyên gạch nối, vì khoá kế `1.10`
     (`sammādiṭṭhi …pe… sammāsamādhi.`) bản Anh đã ghim để trống. Mở rộng nó là bịa.
  4. Dấu ngoặc kép mở ở `1.9` và khép lại ở `1.13`, y như Pāli `“Ayameva … appamādāyā”ti.`

  Lớp lấp: 5 khoá `1.8`, `1.9`, `1.11`, `1.12`, `1.13` nằm ở chỗ bản Anh đã ghim để
  trống. `1.10` cũng trống nhưng là đoạn lược dài 31 ký tự nên nằm ngoài lát này, và tôi
  không mở rộng nó. `1.14` (`Ekādasamaṁ.`) là số đếm, không tính vào lát. Không khoá nào là
  blockquote tham chiếu: bài này chỉ có khối `:0`, và Sujato đã dịch cả `:0`.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm. Tầng đối chiếu là
  Pāli đã ghim, các khoá `1.1`–`1.7` của chính bản Anh đã ghim, cùng khuôn Pāli giống
  hệt mà Sujato đã dịch ở `an3.71:5.1`–`5.8`; bản Việt dự án chỉ để đối chiếu nghĩa và do
  agent khác viết, không phải một lớp đọc Anh độc lập.

  Sau khi bài này `published`, coverage English của nó lên 100%, nên record của nó trong
  `content/meta/reference-gaps.yaml` sẽ thành record thừa và test `a fill never leaves a
  gap record it has cured` sẽ đỏ cho tới khi chạy `npm run reference:gaps`. Việc đó nằm
  ngoài lát này.
