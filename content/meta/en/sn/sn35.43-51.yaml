notes: |-
  Cả năm khoá đều lấy lại từ chính §1 hoặc từ tầng Anh đã ghim ở chỗ khác.

    - `1.8`: Pāli `Yampidaṁ jivhāsamphassapaccayā … tambhi` khớp `1.6` (chỉ khác cơ quan và
      `1.6` có `…pe…`). Bản đã ghim ở `1.6`: “And the pleasant, painful, or neutral feeling
      that arises dependent on eye contact is also impermanent.” Chỉ thay `eye`→`tongue`.
    - `1.13`: cùng vế với `1.6`, chỉ `cakkhusamphassapaccayā` và `tasmimpi nibbindati`.
      `1.12` bản đã ghim đã đặt `nibbindati` = “grows disillusioned”, `tasmimpi` = “with that
      too”. Giữ `…pe…` ở cuối.
    - `1.14`: Pāli `manasmimpi nibbindati, dhammesupi …` đi sau `…pe…` của `1.13`, nên đây là
      phần nối tiếp, không phải câu mới. Tôi viết thường và giữ dấu phẩy cuối, đúng như Pāli, thay
      vì viết hoa để cho “đẹp”. `dhammesupi`/`manoviññāṇepi`/`manosamphassepi` theo đúng
      `1.10`: “ideas”, “mind consciousness”, “mind contact”.
    - `1.15`: theo `1.11` (`manosamphassapaccayā`, cùng câu với `1.15`) → “the painful,
      pleasant, or neutral feeling that arises dependent on mind contact”.
    - `1.16`: `Nibbindaṁ virajjati; virāgā vimuccati; vimuttasmiṁ vimuttamiti ñāṇaṁ hoti.`
      — bản đã ghim đã dịch đúng chuỗi này ở năm chỗ: `mn147:9.7`, `mn148:41.6`, `sn12.70:17.2`,
      `sn22.12:1.6`, `sn22.136:1.4`, `sn22.14:1.4`, cùng một cách đọc. Tôi dùng lại nguyên văn.

  BẤT ĐỊNH CÒN LẦI (không chặn, đã ghi):
    Thứ tự `sukhaṁ / dukkhaṁ / adukkhamasukhaṁ`. Bản đã ghim TỰ KHÔNG NHẤT QUÁN: `1.6` (mắt)
    đọc “the pleasant, painful, or neutral feeling”, còn `1.11` (tâm) đọc “The painful, pleasant,
    or neutral feeling” — trong khi Pāli của cả hai đều là `sukhaṁ vā dukkhaṁ vā adukkhamasukhaṁ vā`,
    y hệt nhau. Tôi theo mẫu KHỚP CƠ QUAN: `1.8`/`1.13` (mắt, lưỡi) theo `1.6`;
    `1.15` (tâm) theo `1.11`. Không chuẩn hoá cả hai về một thứ tự vì như vậy tôi sẽ ghi đè lên
    `1.11`, mà lớp lấp không bao giờ được ghi đè bản đã ghim. Hệ quả: cột Anh có hai thứ tự xen
    kẽ. Đây là bất nhất có sẵn của bản đã ghim, tôi chọn bên nào đều lệch với một bên — ghi ra đây
    để người biên tập quyết nếu muốn chỉnh thống nhất cả §1.

  Lớp lấp: 5 khoá nằm ở chỗ bản Anh đã ghim để trống; `1.2`, `1.9`, `1.18`, và `sn35.44`–
  `sn35.51` cũng trống nhưng ngoài lát này. Triangulation bị chặn ở 8.0.
