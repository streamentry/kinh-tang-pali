notes: |-
  4.2/5.2 lặp lại vế `evameva kho mayaṁ āyasmato … yāvadeva upanikkhepanamattāya` của 4.1/5.1.

  Đã quét toàn bộ cache Pāli (root/pli/ms/sutta): mệnh đề `yāvadeva upanikkhepanamattāya` chỉ
  có ĐÚNG 4 khoá, tất cả trong sn21.3 (4.1, 4.2, 5.1, 5.2) — nên 0 tiền lệ cho vế lặp, và
  đây là lý do `ambiguity_integrity` bị hạ. Vế dựng từ chính 4.1/5.1: Sujato dịch `Seyyathāpi,
  āvuso, himavato pabbatarājassa parittā pāsāṇasakkharā …` = "next to Venerable Mahāmoggallāna
  I’m like a few pieces of gravel next to the Himalayas" và với Sāriputta "a few grains of salt
  next to a mound of salt"; vì vậy 4.2/5.2 dùng lại đúng hai cụm "a few pieces of gravel" /
  "a few grains of salt" cùng mạch "next to Venerable …", và `evameva kho` dịch "So too".

  Điểm chưa chắc chắn thật sự: `yāvadeva upanikkhepanamattāya` = "chỉ bằng lượng có thể đặt cạnh
  nhau", nên "just a few pieces of gravel" là nén ("chỉ vài mảnh sỏi") chứ không phải một lời
  so sánh đầy đủ; đó là cách ngắn nhất mà vẫn giữ được hình ảnh Sujato đã dựng.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
