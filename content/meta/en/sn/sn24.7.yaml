notes: |-
  Bài này có 4 khoá lấp, trong đó 3.5 và 3.6 không nằm trong lát 6 nhưng làfillable và thuộc
  chính bài này: 3.4 kết bằng dấu hai chấm mà câu hỏi chỉ đóng ở 3.6, nên lấp 3.5–3.6 là
  điều kiện để 3.4 đọc được, không phải lấp dư.

  3.13: Pāli trùng NGUYÊN VĂN với 3.19 (Sujato) = "“But by not grasping what’s impermanent,
  suffering, and perishable, would such a view arise?” → dùng lại y hệt, chỉ đổi `?` thành `:` theo
  Pāli và bỏ `“` mở (Pāli 3.13 không có; Sujato ở 3.19 đã thêm `“` và đặt `?` sớm, tức bản đã
  ghim tự lệch chốt ở cả hai điểm).

  3.4 có thêm vế dẫn `vipariṇāmadhammaṁ,` ở đầu khoá. Sujato đã xử lý đúng trường hợp giống hệt
  ở `sn24.45:3.4` và `sn24.2:2.16`: bỏ vế dẫn, còn chữ "perishable" vẫn còn trong cụm được lặp
  lại. Bản lấp theo đúng cách đó, nên "perishable" xuất hiện một lần ở 3.4 (trong cụm lặp) thay
  vì hai lần. Đây là quyết định biên tập thật sự nên `semantic_fidelity` và `ambiguity_integrity`
  bị hạ.

  3.5: `‘natthi hetu, natthi paccayo …pe…` → "‘There is no cause or reason …", đúng lời Sujato ở
  2.2 và 2.8. 3.6: `sukhadukkhaṁ paṭisaṁvedentī’”ti?` → "they experience pleasure and pain in
  the six classes of rebirth’?”, đúng lời Sujato ở 2.3/2.9 cộng `’` cho khớp `_đóng` = 2.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
