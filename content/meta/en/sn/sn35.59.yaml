notes: |-
  1.3: dựng từ sn35.55:1.2 (đã ghim) "“Mendicant, knowing and seeing the eye as not-self, the
  fetters are uprooted …”" với vế đích lấy từ 1.1 của chính bài, đã ghim ("the underlying
  tendencies are uprooted"). ` …` ở cuối là bắt buộc vì Pāli khoá này mang `…pe…`; lớp fill làm y
  vậy ở sn35.106:2.11 và sn35.138:1.7.

  1.12: ghép từ sn35.53:2.14 / sn35.79:6.4 cho mệnh đề `…tampi anattato jānato passato …`, với
  "the pleasant, painful, or neutral feeling that arises dependent on" (51 lần, thắng 49 lần dạng
  "painful, pleasant, or neutral").

  1.13: "That’s how to know and see so that" (10 lần) thắng "This is how …" (2 lần).

  0 tiền lệ cho `tampi anattato jānato passato anusayā samugghātaṁ gacchanti` (đếm 0 cặp) và cho
