notes: |-
  Tiền lệ: vế `Yepi te, bhikkhave, bhavissanti anāgatamaddhānaṁ arahanto sammāsambuddhā, … bhavissati`
  đã có bản Anh đã ghim ở ba bài khác, cùng một khuôn câu — an3.137:2.6 "Those who will be perfected
  ones, fully awakened Buddhas in the future will also teach the efficacy of deeds, action, and
  energy."; dn16:5.15.3 "… will also have attendants, who at best will be like Ānanda is for me.";
  dn20:4.4 "… will also have gatherings of deities that will be at best like the gathering for me
  now." Vế so sánh `etapparamaṁyeva sāvakayugaṁ bhavissati—seyyathāpi mayhaṁ sāriputtamoggallānā` lấy
  từ 2.4–2.5 của chính bài ("pairs of chief disciples who at best were like" / "Sāriputta and
  Moggallāna were to me"). Hai tên được phép vì bản đã ghim của chính bài dùng cả hai. Hạ
  `vietnamese_clarity` và `ambiguity_integrity` vì bản đã ghim ở 2.4 đã gộp SẴN mệnh đề tương lai vào
  ("The Buddhas of the past **or the future** have pairs of chief disciples…") trong khi Pāli 2.4 chỉ
  có `ahesuṁ atītamaddhānaṁ`. Lớp lấp không được sửa bản đã ghim, nên đọc liền 2.4–2.6 sẽ thấy vế
  tương lai nói hai lần. Lặp đó là do bản đã ghim, không phải do lớp lấp; giữ trung thành với Pāli 2.6
  là lựa chọn ít sai hơn việc bỏ bớt.
  
