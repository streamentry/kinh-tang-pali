notes: |-
  Cùng cơ chế với sn35.205, và Pāli ở đây trùng NGUYÊN VĂN sn35.205 (chỉ khác mệnh đề
  thời gian ở 1.1–1.1, không khác ở ba khoá này): 1.4 và 1.8 có `…pe…`, 1.12 không; cả ba
  cùng dùng câu khuôn của lớp lấp, đã publish ở sn35.204:1.8 và 1.12 cùng năm bài khác.

  `netaṁ mama, nesohamasmi, na meso attā` = "This is not mine, I am not this, this is not
  my self." — 131 lần trong SN đã ghim, không có cách dịch cạnh tranh.

  Bất định nhỏ: 1.4 của bài này viết `Yadanattā taṁ` (không có dấu phẩy) trong khi 1.8
  viết `Yadanattā, taṁ`; bản lấp dịch cả hai như nhau, vì dấu phẩy ấy không mang nghĩa.
  `ambiguity_integrity` vẫn 9.3. 1.3, 1.5–1.7, 1.9–1.11, 1.13, 1.14 vẫn trống vì thuộc lát
  khác. `triangulation` 8.0 là đặc thù của lớp lấp.
