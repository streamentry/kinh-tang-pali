notes: |-
  KHÔNG có tiền lệ: đã quét TOÀN BỘ tầng Anh đã ghim và không bài nào dịch
     `catūsu yonīsu cattālīsaṁ veyyākaraṇā` hay `paṇṇāsasuttantā` ("forty-two",
     "lines of exposition", "kinds of birth" đều 0 kết quả), và bài này cũng không có bản
     Việt dự án để đối chiếu. Vì vậy hai khoá dịch thẳng từ Pāli: `yonī` = "kinds of
     birth" (bản đã ghim 1.3–1.5 của chính bài này dùng "womb-born / moisture-born /
     spontaneously-born" cho bốn loại), `veyyākaraṇā` = "kinds of exposition" (kỹ thuật
     ngữ "cách trình bày" của Suttapitaka; Sujato chỉ có nghĩa `pañha-uddesa-veyyākaraṇa`
     ở an10.27, khác nghĩa). Đây là chỗ dễ sai nhất của lát này nên hạ terminology.
  
  3.3 giữ dấu `)` vì Pāli kết bằng `.)`. Nhưng bản đã ghim ở 3.1 đã đóng ngoặc tròn
     ngay ("…the same way.)") trong khi Pāli để ngoặc mở ở 3.1 — lỗi của bản đã ghim, không
     sửa được, và không thể bỏ `)` ở 3.3 vì luật 4 bắt ngoặc đơn khớp Pāli theo từng khoá.
