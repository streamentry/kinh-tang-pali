notes: |-
  4.4 là BẢN LẶP của 3.3: Pāli 3.3 kết bằng `”ti.` còn 4.4 kết bằng `’ti.` nên
  chuỗi không byte-giống, nhưng là CÙNG MỘT CÂU. Bản đã ghim đã dịch 3.3 thành “He was
  reborn in the Pink Lotus hell because of his resentment for Sāriputta and
  Moggallāna.” → luật 3 của lớp: dùng lại y nguyên. Dấu đóng ở 4.4 là `”` vì Pāli kết
  bằng `āghātetvā’ti.` (một `’` đóng ngoặc theo quy ước của tầng), và luật 4 đòi khớp.

  4.2 và 4.5 là phần Đức Thế Tôn KỂ LẠI chuyện Phạm Thiên Sahampati đêm đó, nên ngôi kể
  đổi sang “me” (`yenāhaṁ`, `maṁ`) thay cho “the Buddha” của 3.1/3.5. Bài CÓ bản Việt dự
  án (sn6.10) để đối chiếu từng khoá, và các cụm lấy từ bản đã ghim của chính bài:
    `brahmā sahampati` → “the divinity Sahampati” (nguyên văn 3.4);
    `kevalakappaṁ jetavanaṁ obhāsetvā` → “lighting up the entire Jeta’s Grove” (nguyên
        văn 3.1);
    `padakkhiṇaṁ katvā` → “respectfully circled … keeping him on his right” (nguyên văn
        3.5, chỉ đổi “him” thành “me” theo ngôi kể);
    `tatthevantaradhāyī` → “vanished right there” (nguyên văn 3.5);
    `Idamavoca` → “That is what … said” (nguyên văn 3.4).

  BẤT ĐỊNH ĐÁNG GHI: `abhikkantāya rattiyā abhikkantavaṇṇo` (2.5 của 4.2). Bản đã ghim ở
  3.1, nơi Pāli gần như giống hệt, đã GỘP cụm này thành “late at night” rồi thêm “glorious”
  vào “the glorious divinity Sahampati”. Tôi tách ra “glorious in the last part of the
  night” để giữ đủ hai thành phần (`abhikkantāya rattiyā` = cuối đêm, `abhikkantavaṇṇo` =
  rực rỡ) và khớp bản Việt dự án (“trong đêm gần tàn, với hào quang rực rỡ”). Hệ quả: 4.2
  đọc hơi lặp với chữ “night” hai lần (“Last night … in the last part of the night”), đó
  là do Pāli vốn vậy. Đây là chỗ duy nhất lát này lệch cách gom của bản đã ghim, nên hạ
  `ambiguity_integrity` xuống 8.6.

  4.2 kết bằng dấu hai chấm và Pāli không có ngoặc đóng ở khoá này, nên bản Anh cũng vậy.
  4.5 kết bằng `”ti.` nên có `”`.
