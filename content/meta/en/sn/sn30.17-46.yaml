notes: |-
  Lát mạnh nhất: cả 5 khoá đều có BẢN ĐÃ GHIM dịch sẵn một Pāli khác Y HỆT TỪNG KÝ TỰ
  (đã đối chiếu bằng script, không phải bằng mắt), nên đây là tái sử dụng có thể kiểm chứng, không
  phải suy đoán.

    - `1.6` `“Idha, bhikkhu, ekacco kāyena dvayakārī hoti, vācāya dvayakārī, manasā dvayakārī.`
      Y HỆT `sn29.10:2.1`, mà bản đã ghim đọc: ““Mendicant, it’s when someone does both kinds of
      deeds by body, speech, and mind.” Cũng y hệt `sn30.3:1.4`, `sn29.11-20:2.1`,
      `sn29.21-50:2.1`, `sn29.7:2.1`.
    - `1.8` `‘opapātikā supaṇṇā dīghāyukā vaṇṇavanto sukhabahulā’ti.` khác `sn29.10:2.3`
      (`…nāgā…`) đúng một chữ; bản đã ghim đọc ““The spontaneously-born dragons are long-lived,
      beautiful, and very happy.’” `sn30.3:1.6` (kim sí điểu trứng) là mẫu thứ hai.
    - `1.10` `‘aho vatāhaṁ …upapajjeyyan’ti.` ← `sn29.10:2.5` (`vatāhaṁ` → “If only”).
    - `1.14` `So kāyassa bhedā paraṁ maraṇā …upapajjati.` ← `sn29.10:2.6`.
    - `1.15` `Ayaṁ kho, bhikkhu, hetu, ayaṁ paccayo, yena midhekacco …` ← `sn29.10:2.7`.
      Bản đã ghim ở chính `1.3` cũng đã dùng đúng khuôn này: “what is the cause, what is the
      reason why someone, when their body breaks up, after death, is reborn in the company of the …”.

  Ba tầng danh từ đều theo đúng cách bản đã ghim đã dùng ngay trong `1.3`–`1.5`: `jalābuja` →
  “womb-born”, `saṁsedaja` → “moisture-born”, `opapātikā` → “spontaneously-born”. `1.8` và `1.10`
  nói về `opapātikā` nên tôi dùng “spontaneously-born”, không dùng lại “womb-born” của `1.3`.

  Bất định còn lại: không có. `dvayakārī` là từ khó của cả nhóm `sn29`/`sn30`, và bản đã ghim đã
  chốt “both kinds of deeds” nhất quán ở năm chỗ, nên tôi không cần tự quyết.

  Lớp lấp: 5 khoá nằm ở chỗ bản Anh đã ghim để trống. `1.7`, `1.9`, `1.11`–`1.13`, `1.16`,
  `1.18`, `2.0`–`2.4` cũng trống nhưng ngoài lát này. Triangulation bị chặn ở 8.0.
