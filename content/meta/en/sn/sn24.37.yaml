notes: |-
  Bài này là vòng hai của `sn24.36` (`Nevahotinanahotisutta`), chỉ khác nội dung ý kiến. Nên bốn
  khoá là **bản sao nguyên văn của Pāli đã có bản dịch** trong chính `sn24.36` (đã đo bằng script,
  Pāli giống hệt từng chữ):

  - `2.1` ← `sn24.36:2.1` (đã ghim): `"“When form exists, because of grasping form and insisting
    on form, the view arises:"`
  - `2.6` ← `sn24.36:2.6` (đã ghim): `"consciousness exists, because of grasping consciousness and
    insisting on consciousness, the view arises:"`
  - `3.6` ← `sn24.36:3.7` (đã ghim), và `3.10` ← chính `3.6` (Pāli hai khoá này **giống hệt nhau**):
    `"“And so, when suffering exists, because of grasping suffering and insisting on suffering, the
    view arises:"`

  Hai khoá phải tự ghép:

  - `3.1`: Pāli ở `sn24.36` bị tách làm hai khoá (`3.1` `Taṁ kiṁ maññatha, bhikkhave, ` và `3.2`
    `rūpaṁ niccaṁ vā aniccaṁ vā”ti? `), ở đây gộp làm một. Tôi nối đúng hai câu đã ghim: "What do
    you think, mendicants? Is form permanent or impermanent?”" Bản Việt `sn24.37:3.1` cũng là một
    mệnh đề: *"Điều ấy các ông nghĩ sao, này các tỳ-kheo, sắc là thường còn hay vô thường”ti?"*
  - `3.3`: Pāli `vipariṇāmadhammaṁ, api nu taṁ anupādāya evaṁ diṭṭhi uppajjeyya: ` gộp đuôi câu
    của `sn24.36:3.3` (vốn có `…pe…`) với công thức ở `sn24.36:3.4`. Tôi viết "Perishable, would
    such a view arise without grasping it:".

  ⚠️ **`3.3` là chỗ tôi CỐ Ý lệch với tiền lệ, và cần nói rõ.** Lớp lấp ở `sn24.36:3.4` đã viết
  *"But by not grasping what’s impermanent, suffering, and perishable, would such a view arise:"* —
  tức **bơm lại** các từ mà `…pe…` ở `3.3` đã lược. Tôi không lặp lại, vì ở `sn24.37:3.3` Pāli
  **không có** `…pe…` và chỉ còn `vipariṇāmadhammaṁ` + `api nu taṁ anupādāya …`; thêm "what’s
  impermanent, suffering" vào là thêm chữ không có trong nguồn. Tôi giữ lại đúng cụm "would such a
  view arise" của tiền lệ cho `evaṁ diṭṭhi uppajjeyya`. Hệ quả: `3.3` **không** giống `sn24.36:3.4`.
  Người biên tập nên xem đây là một chỗ lệch chủ ý giữa hai bài, không phải sơ suất.

  ⚠️ **`3.3` viết hoa "Perishable" trong khi Pāli viết thường** (`vipariṇāmadhammaṁ`, chữ thường
  vì nối sau `…pe…` ở `3.2`). Tôi vẫn viết hoa, vì `3.2` trống trong bản Anh đã ghim: để chữ thường
  ở đầu một ô đọc độc lập sẽ trông như lỗi gõ. Tiền lệ hai chiều trong tầng lấp đều tồn tại —
  `sn34.46:1.6` giữ chữ thường ("just as, mendicants…") cùng Pāli, còn `sn24.36:3.4` viết hoa
  ("But by not grasping…") dù Pāli cũng thường. Tôi chọn theo tiền lệ gần nhất về hình thức
  (`sn24.36:3.4`) và ghi lại ở đây.

  Lớp lấp: 6 khoá, tất cả nằm ở chỗ bản Anh đã ghim để trống. **Không khoá nào là blockquote
  tham chiếu và không khoá nào có Pāli rỗng**, nên không có khoá nào bị bỏ.

  **Mười bốn khoá bản Anh đã ghim để trống mà lát này KHÔNG lấp**, tất cả vì Pāli **dưới 40 ký
  tự**: `1.4` (39), `2.2` (38), `2.3` (18, có `…pe…`), `2.4` (14), `2.5` (17), `2.7` (38),
  `3.2` (22, có `…pe…`), `3.4` (39), `3.5` (19), `3.7` (39), `3.8` (12, có `…pe…`), `3.9` (19),
  `3.11` (39), `3.12` (15). Đáng nói: năm khoá `2.2`, `2.7`, `3.4`, `3.7`, `3.11` chỉ chậm
  ngưỡng 1–2 ký tự (`‘rūpī attā hoti arogo paraṁ maraṇā’ti.`, 38–39), tức nội dung *"The self is
  formed and is healthy after death"* mà `1.3` đã ghim sẽ **lặp lại năm lần** trong cột English mà
  bản đã ghim im lặng. Người đọc bốn cột sẽ thấy các ô trống đó; đó là lỗ hổng thật của bản dịch
  đã ghim, không phải chỗ tôi bỏ sót.

  ⚠️ **Sai lệch cần người biên tập xử lý, tôi KHÔNG tự sửa.** Trước lát này coverage English của
  `sn24.37` là 1/7 = 0,1429, thấp hơn nhiều so với ngưỡng 0,8, và **có** record ở
  `content/meta/reference-gaps.yaml:3114` (`substantiveSegments: 7`,
  `substantiveWithoutEnglish: 6`, `coverage: 0.1429`). Lớp lấp đưa nó lên 7/7 = 100%, nên record đó
  **thành thừa** và `tests/unit/english-fill.test.ts` ("a fill never leaves a gap record it has
