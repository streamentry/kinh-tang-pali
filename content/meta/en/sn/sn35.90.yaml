notes: |-
  Cùng công thức đã có CHỮ Sujato HAI lần trong chính bài này: 1.8 (`cakkhusamphassa`) và
  3.6 (`manosamphassa`), đều là "Let them not conceive anything to be the pleasant, painful, or neutral feeling
  that arises dependent on X contact. Let them not conceive it in that, let them not conceive it as that, and let
  them not conceive that 'that is mine.'" — 2.7 là vế lưỡi, dùng y hệt (luật 3).

  Bất định cơ học đã ghi: Pāli ở 2.7 KHÔNG đánh dấu ngoặc kép quanh `taṁ meti` (đếm được 0 ngoặc mở, 0
  ngoặc đóng), nên dấu nháy quanh "that is mine" ở đây phải là ngoặc THẲNG. Bản đã ghim ở 1.8/3.6 dùng
  ngoặc cong vì không chịu luật đếm này; đây là khác biệt hình thức, không phải khác nghĩa.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
