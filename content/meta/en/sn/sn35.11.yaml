notes: |-
  1.3–1.4 trùng NGUYÊN VĂN sn22.10:1.4–1.6, sn22.11:1.4, sn22.9:1.4 và sn35.7:1.3–1.5
     — tất cả đã ghim với cùng một bộ từ. Bất định đã ghi: những bài kia dịch `rūpa` là
     "form" (sn22.9/10/11) hoặc danh từ cụ thể (sn35.7 "the eye"), nhưng bản đã ghim CỦA
     CHÍNH bài này ở 1.1 dịch `rūpā` là "sights of the past and future". Theo luật 3 (cùng
     bài thì theo bản đã ghim của bài đó) chọn "sights", nên 1.3–1.4 là "past / future /
     present sights" chứ không phải "past form".
  
  `nibbidāya virāgāya nirodhāya paṭipanno hoti` = "practice for disillusionment,
     dispassion, and cessation" — theo sn12.16:2.2 và an4.185:5.5 đã ghim. 1.4 giữ `…` và
     ngoặc kép đóng vì Pāli có; 1.2 đã ghim đóng ngoặc kép sớm hơn Pāli một chút.
