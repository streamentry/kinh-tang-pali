notes: |-
  The passage the pinned English edition left blank.

  Khuôn dùng lại, KHÔNG phải lựa chọn của tôi: 17 tệp fill đã có trong kho (sn55.4/7/11/14/15/16/17/22/28/30/34/36/44/45/46/47/51) dịch nguyên văn `itipi so bhagavā …pe… satthā devamanussānaṁ buddho bhagavāti.` thành “That Blessed One is … teacher of gods and humans, awakened, blessed.” Sujato KHÔNG dịch vế này ở bất kỳ bài sn nào (0 kết quả khi quét “That Blessed One is … teacher of theos”), nên đây là khuôn chính thức của lớp lấp.

  2.2 và 3.2 có PĀLI GIỐNG NHAU và giống y hệt khuôn đã dùng ở 15 bài khác, nên phải dịch
  Y HỆT nhau — cùng một vế mà hai cách gọi thì bài kinh tự mâu thuẫn. Cả hai khoá nằm
  trong bài không có bản Việt dự án để đối chiếu (sn55.18 chưa có tệp
  `content/translation/vi/project/sutta/sn/sn55.18_*`).

  Bất định thuộc đặc thù của lớp lấp, không phải thiếu sót phát sinh: phần bị lược ở
  `…pe…` là danh sách mười mốc tiêu chuẩn (`vijjācaraṇasampanno sugato lokavidū
  anuttaro purisadammasārathi`) và KHÔNG thể phục hồi — tầng root bilara đã thay nó bằng
  chữ lược trước khi tôi đọc. Tôi không mở rộng, vì bổ sung chữ vào tầng Anh là chút
  không nguồn nào cấp phép. `ambiguity_integrity` hạ vì vậy, `triangulation` giữ ở 8.0
  theo đặc thù của lớp.
