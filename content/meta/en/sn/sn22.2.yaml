notes: |-
  8.14 lặp công thức của 8.15 (Sujato): "consciousness, when that consciousness decays and
  perishes it gives rise to sorrow, lamentation, pain, sadness, and distress." → dùng lại y hệt
  với "choices"; `tesaṁ saṅkhārānaṁ` số nhiều nên `uppajjanti` dịch "they give rise to" (8.15
  dùng "it" vì `viññāṇassa` số ít). Chuỗi "sorrow, lamentation, pain, sadness, and distress"
  đã được Sujato dùng ở 8.1–8.2 và 8.15, và 8.13 ("choices …") chỉ lặp lại danh từ.

  9.2: Pāli TRÙNG NGUYÊN VĂN với 1.2, mà Sujato dịch "astute aristocrats, brahmins, householders,
  and ascetics—". 4.3 và 6.3 tuy cùng nghĩa nhưng Pāli chỉ còn `…pe…` nên không đủ làm chỗ dựa
  cho một danh sách bốn mục; lấy 1.2.

  Chữ `—` ở cuối 9.2 theo đúng 1.2: Pāli kết bằng dấu chấm nhưng Sujato dùng gạch nối để nối
  sang mệnh đề kế tiếp (`Paṇḍitā hāvuso, manussā vīmaṁsakā:`).

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
