notes: >-
  The whole teaching is one sentence — the fetter is not the eye, and not sights, but the desire
  and greed arising from the pair — applied to all six bases and then restated four more times. The
  six blank segments this fill covers are all that sentence or its consequence, so five of the six
  reuse Sujato's rendering of that sentence word for word: 3.4, 9.2, 9.5 and 11.6 are the same
  Pāli clause as 3.2, 5.5, 11.2 or 11.9, differing only in initial case, one comma after `chandarāgo`,
  and the trailing marker. Nothing beyond the marker changes: where the Pāli ends `…pe…` the fill
  keeps `…` (3.4, 9.2), where it ends `”ti.` the closing quote belongs to Sujato's 11.9 and is not
  repeated here.

  9.4 is the Pāli of 3.5 and 5.4 exactly, and takes Sujato's words exactly: "mind is not the fetter
  of ideas, nor are ideas the fetter of the mind." Only the initial letter is raised. Sujato writes
  it lowercase because in his text it trails a collapsed list ("The ear … nose … tongue … body …");
  in the reader it follows 9.3, a segment below the substantive-Pāli threshold that carries Pāli
  but no English at all, so a lowercase opening would dangle off two elisions.

  7.2 is the one segment with no pinned counterpart, and it needed a judgement. Sujato renders the
  same construction at 6.2 and 8.2 as "However, since this is not the case, but" — a compressed
  anaphora back to the preceding hypothetical, not a translation of `na jivhā rasānaṁ saṁyojanaṁ,
  na rasā jivhāya saṁyojanaṁ`. Copying that compression here would have left the sentence referring
  to a hypothetical that Sujato himself collapses at 7.1 into "If the ear … nose … tongue … body …",
  so there would be nothing to refer back to. The fill therefore keeps Sujato's connective ("However,
  since"), his "but", his "the fetter there is the desire and greed that arises from the pair of them"
  and his "this living of the spiritual life for the complete ending of suffering is found", and
  states the negated fetters that the Pāli actually states — "the tongue is not the fetter of tastes,
  nor are tastes the fetter of the tongue". Same claim as 6.2–6.3, with its referent named instead of
  assumed. `rasānaṁ` follows Sujato's "sights" for `rūpānaṁ` as "tastes", and `dhammānaṁ` keeps
  his "ideas".

  Triangulation is capped at 8.0: Sujato translates none of these six passages.