notes: |-
  Tiền lệ: 2.6 dẫn lại `satiṁ, ayyaputta, upaṭṭhapehi, mā vippalapī”ti.` đã có bản Anh đã ghim ở 2.4
  của CHÍNH bài — “Be mindful, master! Don’t babble.”; 2.14 dẫn lại `paṇidhehi, gahapati,
  anāgatamaddhānaṁ rājā assaṁ cakkavattī”ti.` đã có ở 1.3, 2.10 và 2.20 — “Householder, make a wish
  to become a wheel-turning monarch in the future!”.

  Khác biệt bắt buộc: ở 2.6 và 2.14 hai vế ấy nằm trong lời hỏi của Citta (2.5 và 2.13 mở ngoặc kép)
  nên phải thêm dấu hỏi và hai ngoặc đóng. Khuôn `’”?` có tiền lệ rộng trong bản Anh đã ghim
  (sn22.171, sn44.20, sn41.3, sn16.12 … — hơn 60 lần), nên đây không phải cách dịch tự chế.

  Không có tiền lệ cho riêng cặp “trích lại + dấu hỏi” này; lựa chọn chỉ dựa trên việc bản Anh đã
  ghim ở 2.4/2.10 cộng với khuôn `’”?`. Đây là lý do hạ `ambiguity_integrity` một chút.
