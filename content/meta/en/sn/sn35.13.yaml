notes: |-
  1.16 trùng NGUYÊN VĂN 1.11 (con mắt) và 1.20 (tâm); 1.17 trùng 1.12 và 1.21 — cùng
     bài, đã ghim, khác nhau duy nhất ở `jivhā` thay `cakkh`/`mano`. Bản đã ghim dịch
     `jivhā` trong danh sách 1.4/1.6/1.8 là "tongue". Lấy nguyên văn.
  
  Ghi lại: `Yo jivhāya chandarāgavinayo …` ở 1.17 là dạng sở hữu (ablative `jivhāya`),
     khác 1.12 và 1.21 dạng cách (`cakkhusmiṁ`, `manasmiṁ`); bản đã ghim dùng cùng một
     cách diễn đạt cho cả ba nên giữ y nguyên.
