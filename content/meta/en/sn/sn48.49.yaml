notes: |-
  2.1: `Āyasmatā, bhante, … aññā byākatā:` — sn12.32:5.2 đã ghim đúng khuôn này là "Sir,
    Venerable Sāriputta has declared enlightenment:", nên ghép đúng như vậy (1× tiền lệ, nhưng
    cấu trúc `piṇḍolabhāradvājena aññā byākatā` đã xuất hiện 5× trong tầng sn với "declares
    enlightenment").

    2.2 và 3.6 trùng NGUYÊN VĂN 3.2 đã ghim, nên lấy lại nguyên văn bộ từ của 3.2. Nhưng bản
    đã ghim 3.2 dùng cặp ngoặc cong LỒNG NHAU (2 mở, 3 đóng) trong khi Pāli 2.2/3.6 chỉ có MỘT
    cặp `‘…’ti`, và luật 4 đếm từng khoá — nên bản lấp bỏ cặp trong, để nguyên vị trí ngoặc của
    Pāli. Cùng lý do, 2.4 theo 3.12 đã ghim với `?` (tiền lệ thứ hai: sn12.32:14.3 đã ghim đúng
    biến thể có dấu hỏi).

    Bất định thật ở 2.4: Pāli đóng ngoặc trong ở `itthattāyā’ti` (vì `’ti` là trích dẫn "iti") và
    đóng ngoặc ngoài ở `”ti?`, nên `pajānāmī` ("I understand") nằm NGOÀI cặp trong. Bản lấp đặt
    `’` và `”` đúng hai chỗ đó; vì 2.3 đã ghim kết bằng `?"`, người đọc sẽ thấy một `”` thừa ở
    đây — đó là hệ quả tất định của luật 4, không phải lỗi.
