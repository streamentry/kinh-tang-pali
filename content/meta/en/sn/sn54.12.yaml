notes: |-
  Tiền lệ: 8.2 và 11.2 của CHÍNH bài đã có bản Anh cho cùng danh sách — ““noble meditation”, or else
  “divine meditation”, or else “a realized one’s meditation”,”. Ba vế `ariyavihāro / brahmavihāro /
  tathāgatavihāro` dịch y hệt; khác biệt nằm ở dấu nháy, xem dưới.

  BẤT ĐỊNH ĐÃ GHI: ở 8.4 và 11.4 Pāli KHÔNG có dấu nháy nào (`ariyavihāro itipi, brahmavihāro itipi,
  tathāgatavihāro itipi.` và `…tathāgatavihāro itipīti.`), trong khi bản Anh đã ghim ở 8.2/11.2 —
  vốn có Pāli y hệt — lại đặt nháy kép. Luật 4 của lớp lấp bắt buộc số ngoặc phải khớp Pāli theo
  từng khoá, nên lớp lấp không được đặt nháy. 11.4 còn thêm lỗi Pāli: `itipīti` mất dấu `’` (8.4 và
  11.2 đều không có dấu này nên không thấy rõ, nhưng 11.4 vốn phải đóng ngoặc kép). Hệ quả: đọc liền
  8.1–8.4 sẽ thấy 8.2 có nháy rồi 8.4 không, trong khi Pāli hai khoá giống hệt nhau. Đây là lý do hạ
  `terminology`, `ambiguity_integrity` và `vietnamese_clarity`.

  Ghi rõ: hai khoá này KHÔNG có tiền lệ cho dạng không nháy — mọi tiền lệ của `ariyavihāro … itipi`
  đều có nháy. Lựa chọn bám Pāli là bắt buộc theo luật 4, không phải tự ý.

  Ngoài phạm vi lát: 11.7 (`Dutiyaṁ.`) trống ở mọi tầng, không thuộc b6.json.
