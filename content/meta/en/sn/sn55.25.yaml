notes: |-
  **Bốn nhóm khoá (đo bằng script trên Pāli root đã ghim): A = 4 · B = 7 · C = 7 · D = 0** — tổng 18,
  khớp đúng 18 khoá mà tầng Anh đã ghim để trống (không khoá nào thừa, không khoá nào thiếu).

  **Nhóm A — 4 khoá, dùng lại nguyên văn lời đã ghim trong cùng bài.** `1.9` và `2.2` trùng byte `1.3`
  (`So bhagavatā byākato:`) nên lấy đúng "The Buddha declared that he was"; `2.6` trùng `1.7`
  ("Who can’t become a stream-enterer these days?"); `2.7` trùng `1.8`.

  **`2.7` là chỗ lớp lấp CỐ Ý LỆCH tầng Anh đã ghim — ghi thẳng lý do.** `2.7` và `1.8` có cùng Pāli
  (`Yatra hi nāma saraṇāni sakko kālaṅkato.` = “Vì Sarakāni đã mất”), nhưng lời đã ghim ở `1.8` là
  *“For the Buddha even declared Sarakāni to be a stream-enterer after he passed away.”* — đó **không phải**
  nghĩa của Pāli `1.8`: tầng đã ghim đã **gộp** luôn `1.9` + `1.10` vào khoá `1.8` rồi để hai khoá đó
  trống. Chép nguyên lời ấy sang `2.7` sẽ khiến cột bản lấp nói **hai lần** cùng một phép tuyên bố
  (`2.7`, rồi `2.8`+`2.9`) trong khi Pāli chỉ nói **một** lần — đúng là lỗi gộp khoá phải tránh. Nên `2.7`
  dịch thẳng từ Pāli: “Since Sarakāni the Sakyan has passed away.” `sn55.24:2.8` có **cùng** Pāli và
  **cùng** lỗi gộp; bài đó không nằm trong lát này nên không chạm vào.

  **Nhóm B — 7 khoá, dựng lại từ lời đã ghim; tỉ lệ khớp đo được.**
  · `1.10` từ `1.4` — **0,9630**. Chỉ khác hai dấu nháy (`“…”`→`‘…’`); lớp lấp đổi đúng hai dấu ấy.
  · `2.3` từ `1.4` — **0,9630**, y hệt `1.10`; hai khoá lấy giống nhau từng chữ.
  · `2.4` từ `1.5` — **0,9448**. Tầng đã ghim nuốt mất vế từ `, bhante,`; lớp lấp chèn “sir”.
  · `2.5` từ `1.6` — **0,9750**. Chỉ khác nháy kép → nháy đơn.
  · `2.8` từ `1.3` — **0,9524**. Chỉ khác dấu Pāli (`—` thay `:`); lớp lấp dùng lại nguyên lời `1.3` vì
    `2.9` nối ngay bằng đúng lời của `1.4`.
  · `2.9` từ `1.4` — **0,9811**. Pāli `2.9` không có nháy nào (công thức đã nhập vào vế trước) nên bỏ nháy.
  · `2.10` từ `1.11` — **0,9895**. Pāli `2.10` thêm dấu `’` đóng nháy đơn mở ở `2.5`; lớp lấp đóng cả hai
    (`’”`) đúng như Pāli.

  **Nhóm C — 7 khoá, không khoá nào có lời ở tầng, nên dịch thật từ Pāli.**
  · `2.1` → ““Here, sir, Sarakāni the Sakyan has passed away.” Chọn “Here, sir,” theo tiền lệ đo được
    ngay trong tầng đã ghim: `sn3.19:2.1` (`“Idha, bhente, …kālaṅkato.`) → ““Sir, here in Sāvatthī …
    has passed away.”; `bhante` → “sir” theo `10.3` và `11.4` của chính bài này; `kālaṅkato` là thì hiện tại
    hoàn thành, khớp `1.2`.
  · `4.2` `5.2` `6.2` `7.2` — Pāli **trùng byte cả bốn khoá**, và trùng cả 33 khoá đã lấp ở tầng này cho
    đúng Pāli ấy (`sn55.19:2.2`, `sn55.30:2.4`, …), nên lấy nguyên văn khuôn của lớp lấp: “That Blessed One
    is … teacher of gods and humans, awakened, blessed.” Bốn khoá giống nhau từng chữ.
  · `11.2` → “And the heavens would provide plenty of rain.” ⚠ Đây là chỗ dễ **nén phủ định**: Pāli khoá
    song song `10.1` là `devo ca **na** sammā dhāraṁ anuppaveccheyya` (lời đã ghim: “the heavens **didn’t**
    provide enough rain”), còn `11.2` **không có `na`**. Lớp lấp giữ đúng cả hai vế — khẳng định **và** thể
    điều kiện — vì `11.3` hỏi tiếp “Would those seeds grow…?” và `11.4` trả lời ““Yes, sir.””.
  · `11.11` — nhãn thứ tự `Pañcamaṁ.` → **“Fifth.”** Đo toàn tầng lấp: 9 dạng nhãn thứ tự, 16 khoá, **mỗi
    dạng chỉ một cách dịch, không ngoại lệ nào** (`Paṭhamaṁ`→First. 3, `Tatiyaṁ`→Third. 3,
    `Catutthaṁ`→Fourth. 2, `Pañcamaṁ`→Fifth. 1, `Sattamaṁ`→Seventh. 2, `Aṭṭhamaṁ`→Eighth. 3,
    `Dasamaṁ`→Tenth. 1, `Ekādasamaṁ`→Eleventh. 1, `Dvādasamaṁ`→Twelfth. 1). Suy ra số 5 từ chính khuôn
    này, không phải từ suy đoán.

  **Ngoặc kép — đo từng khoá, cả hai số đều khớp Pāli.** `2.1` mở `“` không đóng (Pāli đóng ở `2.10`);
  `1.10` và `2.3` mở–đủ nháy **đơn** `‘’`; `2.5` mở nháy đơn không đóng (Pāli đóng ở `2.10`); `2.10` đóng
  **cả hai** `’”`; 13 khoá còn lại 0/0 ở cả hai tầng. Dấu `’` trong “didn’t” là dấu nhạc nên đã tách khỏi
  phép đếm nháy. Ở bài này không có ngoại lệ “nháy kép lồng nhau” nào phải học theo.

  **Dấu lược.** Bài có 19 khoá Pāli chứa `…pe…`, mỗi khoá tính là **một** dấu lược. Trong 18 khoá lấp chỉ có
  bốn khoá `…pe…` (`4.2` `5.2` `6.2` `7.2`) và cả bốn giữ **đúng một** `…`; 14 khoá còn lại Pāli không có dấu
  lược nào nên lớp lấp không thêm. Tổng dấu lược của lớp lấp bài này = **4**, bằng đúng số `…pe…` trong 18
  khoá ấy. Không mở rộng vệt lược thành văn xuôi.

  **Duy trì Pāli trùng nguyên văn.** Toàn bài 91 khoá có **18** nhóm Pāli trùng byte, gồm 46 khoá. Trong
  các nhóm có khoá lấp, mọi cặp bị đều nhận **cùng một lời** (đo được `fill distinct: 1` cho từng nhóm):
  `1.9`↔`2.2`, `1.10`↔`2.3`, và `4.2`↔`5.2`↔`6.2`↔`7.2`.

  **Ba chỗ cố ý khác lời đã ghim, đều có lý do; không có chỗ nào khác ngoài ba chỗ này.**
  1. `2.7` — xem mục nhóm A ở trên.
  2. `2.4` kết bằng `:` còn lời đã ghim ở `1.5` kết bằng `,`. Pāli `2.4` có `:` và `2.5` mở nháy, nên dấu
     hai chấm là đúng Pāli; để dấu phẩy sẽ ra “…objecting, ‘Oh lord…”.
  3. `2.5` giữ dấu `!` của lời đã ghim `1.6` dù Pāli `2.5` kết bằng `.`; giữ lại để hai khoá trùng Pāli đọc
     giống nhau, và `vata` ở đây là tiểu từ bậc cảm.
  Ngoài ra `2.8` **không** giữ dấu `—` mà Pāli có: lớp lấp đã có ở `an10.75:6.5` cũng bỏ (biến thành dấu
  phẩy), và `2.9` nối tiếp bằng đúng lời `1.4` nên không mất thông tin.

  **Lỗi tầng Anh đã ghim đo được ở chính bài này — lớp lấp không sửa được, ghi lại để biên tập biết.**
  · **Gộp khoá (2 chỗ).** Lời đã ghim ở `1.8` nuốt luôn `1.9`+`1.10`; lời đã ghim ở `11.1` nuốt luôn `11.2`
    (vế “And there’s plenty of rainfall.” không có trong Pāli `11.1`).
  · **Thêm vệt không có trong Pāli (1 chỗ).** `1.12` kết bằng “The Buddha said:” — vế ấy thuộc về `2.1`,
    không thuộc Pāli `1.12`.
  · **Dấu `—` đổi thành `…` (4 khoá).** `4.1` `5.1` `6.1` `7.1`.
  · **Bịa dấu lược (1 khoá).** `5.6` có **4** dấu `…` nơi Pāli liệt kê đủ bằng dấu phẩy.
  · **Mở rộng `…pe…` thành văn xuôi (2 khoá).** `8.6` và `9.6` thành “the faculties of faith, energy,
    mindfulness, immersion, and wisdom.” — mất hẳn dấu lược.
  · **Mất một vế phụ (1 nhóm).** `4.7` có **cùng Pāli** với `5.7` `6.7` `7.7` nhưng lời đã ghim ở `4.7`
    thiếu chữ “too” dù Pāli có `Ayampi`; ba khoá kia thì giữ. Đây là mâu thuẫn **trong chính tầng đã ghim**,
    ở khoá không thuộc lát này.
  · Ngược lại: 12 khoá `…pe…` mà lời đã ghim ghi **đúng một** `…` là chuẩn, không tính là lỗi.

  **Coverage: trước 43/54 = 0,7963 · sau khi `published` 54/54 = 1,0000.** Mẫu số là 54 khoá Pāli có nội
  dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`), đo bằng chính bộ đo của kho
  (`npm run store -- sn55.25`). **Độ nhạy:** ngưỡng 0,8 ⇒ cần ≥ 44 khoá. Trước lớp lấp chỉ thiếu **đúng
  một** khoá để qua ngưỡng; lấp xong 11 khoá có nội dung thì dư biên **10 khoá** — mất 10 khoá có nội
  dung vẫn còn 44/54 = 0,8148, mất 11 thì rớt 43/54 = 0,7963.

  **18 khoá nhưng chỉ 11 có nội dung ⇒ 7 khoá dưới 40 ký tự, lấp thêm không đổi coverage.** Đó là `1.9` (21),
  `2.2` (21), `2.8` (21), `11.11` (9) — và ba khoá chỉ thiếu 1–3 ký tự là `2.6` (38), `2.7` (39), `11.2` (37).
  Vẫn lấp cả bảy vì đó là chỗ người đọc thấy hụt rõ nhất: `2.6`/`2.7`/`11.2` là ba câu đứng giữa đoạn, ngay
  sau câu lớp lấp vừa thêm; `1.9`/`2.2`/`2.8` là vế nối của phép tuyên bố, để trống thì câu bị cụt ngay
