notes: |-
  1.9 lặp nguyên vân vế mà sn22.141:1.3 và sn22.142:1.3 (hai lát trước đã lấp và published)
  đã dịch thành "you should give up desire for what is <not-self/suffering>.”" — lấy y hệt,
  bao gồm dấu `”` mà Pāli đòi. Đó là luật 3 của lớp lấp, và nó còn là điều kiện để ba bài này
  đọc thành một chuỗi: 1.2 của chính bài đã mở đầu "Mendicants, you should give up desire for
  what is not-self. …”.

  1.4 và 1.8 lấy từ sn22.68:3.3 và 3.7 — bản Anh đã ghim, cùng cấu trúc `Rūpaṁ …, anattā;
  tatra … chando/rāgo/chandarāgo pahātabbo.` và cùng nghĩa vô ngã — ra
  "Form is not-self; you should give up desire for it." / "Consciousness is not-self; …".
  Lưu ý: bản ghim BỎ danh từ xưng `bhikkhave` trong Pāli 1.4. Tra đếm: "Form is not-self, …"
  không có trong tầng, còn "Form is not-self;" có, và "you should give up desire for it" có 17 lần
  (so với "there you should give up" 0 lần). Vì vậy lấy y hệt, kể cả chỗ bỏ danh từ xưng —
  làm khác đi thì bài này lệch với sn22.68/137/66/67 vốn dùng đúng khuôn đó.

  Bất định đã ghi nhận: 1.4 bỏ `bhikkhave` là hệ quả của luật 3, không phải lựa chọn của tôi;
  xem lý do đếm ở trên. Ngoài ra 1.5/1.6/1.7 (`Vedanā anattā …` v.v.) trống và thuộc lát
  khác, nên bản đọc bốn cột của riêng file này sẽ có ba chỗ trống giữa 1.4 và 1.8 cho tới khi
  lát kia ghi; đó là hạn chế của việc chia lát, không phải của bản dịch.
