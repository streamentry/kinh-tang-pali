notes: |-
  Tiền lệ rất chặt: sn14.14 là cùng công thức ba thì và Sujato đã ghim đủ, nên thì là nguồn
  duy nhất để bắt thì động từ:
    hiện tại → "join together and converge" (ghim ở 1.3 và 5.2 của chính bài này)
    quá khứ  → "came together and converged" (ghim ở sn14.14:2.1)
    tương lai → "will join together and converge" (ghim ở sn14.14:3.1)
  Nên 1.5 và 5.4 (quá khứ) cùng 2.2 (tương lai) giữ nguyên bộ từ ấy, chỉ đổi thì. Tra đếm:
  "inferior convictions" 21 lần, "good convictions" 20 lần trong tầng, và 1.3/5.2 của chính
  sn14.16 đã ghim đúng hai cụm đó.

  Dấu chấm: 2.1 và 5.3 của bài đã ghim là "In the future …" và "In the past …" với dấu lược ở
  cuối, nên khoá lấp đi ngay sau và mở đầu bằng "Those who have…", đọc liền mạch. Không có
  bất định nào khác.
