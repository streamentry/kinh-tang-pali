notes: |-
  **Phân loại 32 khoá (đo bằng máy): A = 25 · B = 3 · C = 1 · D = 3.** Cả 32 khoá nằm trong tập khoá tầng Anh đã
  ghim để trống. A = Pāli trùng nguyên văn với khoá đã có lời; B = dựng lại; C = tự dịch; D = Pāli trùng nhưng lời tầng
  đã ghim khác nhau (báo, không tự hoà).

  **Nhóm 1 — `2.2` ← `1.3` (0,67), B.** Tầng đã ghim gộp lời báo của vị tỳ-kheo vào `2.1` (“…went to Venerable Ānanda and
  told him what had happened.”) và để trống `2.2`. Lớp lấp dựng lại lời báo từ chính câu `1.3` của Sujato, đổi ngôi sang
  “has set out”, giữ “set his lodgings in order himself”, “without informing his supporters or taking leave of the mendicant
  Saṅgha”, “wandering alone, with no companion”, và thêm “Reverend Ānanda,” cho `āvuso ānanda`.

  **Nhóm 2 — vòng “saṅkhāro” ở `6`, `7`, `8` (mỗi vòng 9 khoá), `11.12–11.14`.** Tầng đã ghim ở `6.3`, `7.3`, `8.3` kết bằng “…”
  rồi để trống mười hai khoá sau; Pāli viết đủ.
  · A (từng vòng ×3): `n.5` ← `5.6`, `n.6` ← `5.7`, `n.7` ← `5.8`, `n.11` ← `5.11` (mọi ‘n’ ∈ {6, 7, 8}); `6.12`, `7.12` ← `5.12`;
    `11.12` ← `5.6`, `11.13` ← `5.7`. Pāli trùng nguyên văn (1,00).
  · D (3 khoá): `6.4`, `7.4`, `8.4`. Pāli `So pana saṅkhāro kiṁnidāno kiṁsamudayo kiṁjātiko kiṁpabhavo?` xuất hiện ở `5.5`
    (Sujato đủ bốn từ: “source, origin, birthplace, and inception”), `11.11` (“And what’s the source of that conditioned
    phenomenon? …”, thêm … dù Pāli không có) và `12.11` (chỉ “the source”). Ba lời khác nhau; lớp lấp dùng lời đủ bốn
    từ của `5.5` vì Pāli liệt kê đủ bốn, không tự hoà ba lời đã ghim.
  · A có thêm dấu lược (9 khoá): `6.8`–`6.10`, `7.8`–`7.10`, `8.8`–`8.10` ← `9.11`–`9.13` (“And that craving,” “that feeling,”
    “that contact,”). Pāli ở cả chín khoá và ở `9.11`–`9.13` đều viết `…` (`Sāpi taṇhā …`, `sāpi vedanā …`, `sopi phasso …`),
    nhưng lời đã ghim ở `9.11`–`9.13` không có `…` — tầng đã ghim mở rộng dấu lược thành một danh sách nối sang `9.14`.
    Lớp lấp thêm lại đúng một `…` cho từng khoá. Đo: Pāli 3/3 khoá `9.11`–`9.13` có `…`, lời đã ghim 0/3.

  **Nhóm 3 — B có dấu lược.** `8.12` ← `5.12` (0,78): Pāli `Evampi kho, bhikkhave, jānato …pe… āsavānaṁ khayo hoti` ⇒ “That’s
  how you should know … in order to end the defilements.”; `…` nuốt “evaṁ passato anantarā”, nên lời của `5.12` (“and see”,
  “without delay”) không được chép vào. `11.14` ← `5.8` (0,80): “So that conditioned phenomenon is impermanent …” (`…pe…` nuốt
  `saṅkhato paṭiccasamuppanno`).

  **C (1 khoá).** `12.20` “Ninth.” — nhãn thứ tự `Navamaṁ.`; đúng vị trí trong chuỗi (`sn22.79` mang `Sattamaṁ.`, `sn22.80`
  mang `Aṭṭhamaṁ.`).

  **Ngoặc kép:** không khoá nào trong 32 khoá có Pāli mang nháy kép hoặc nháy đơn, nên không có lệch nháy (đo 0/0 cả hai
  phía). Chỉ `2.2` có “ và ” (Pāli `“esāvuso … pakkanto”ti`): lớp lấp 1 mở, 1 đóng.

  **Dấu lược:** 11 khoá mang `…` trong Pāli (`6.8`–`6.10`, `7.8`–`7.10`, `8.8`–`8.10`, `8.12`, `11.14`); lớp lấp có đúng 11 dấu `…`
  (đo bằng máy, `…pe…` = 1).

  **Khoá trống còn lại: 0.** 14 khoá trong 32 khoá dưới ngưỡng 40 ký tự nên không vào coverage nhưng vẫn lấp:
  `6.6`, `7.6`, `8.6`, `11.13` (19 ký tự), `6.8`–`6.10`, `7.8`–`7.10`, `8.8`–`8.10` (12–13), `12.20` (8). 18 khoá còn lại vào coverage.

  **Cố ý lệch tầng đã ghim:** chín khoá thêm `…` (nhóm 2) và ba khoá D (`6.4`, `7.4`, `8.4`) chọn lời đủ bốn từ của `5.5`. Điểm ngoài lát, chỉ báo: `6.3`,
  `7.3`, `8.3`, `11.11` đã ghim thêm `…` trong khi Pāli viết đủ, và `12.11` rút ngắn còn “the source”.

  Triangulation 8.0: bản Việt canonical của bài (`content/meta/sutta/sn/sn22.81.yaml`) có cùng họ công cụ với lớp lấp này (đo bằng cách so `translators`/`reviewers`/`quality.assessed_by` với `source/tooling.yaml`), nên lớp lấp KHÔNG phải cách đọc English độc lập và bài này không được tuyên bố là đã đối chiếu English độc lập. Bản Việt chỉ được dùng để đối chiếu nghĩa, không dịch vòng qua nó.

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối; không đặt blocker vì “chưa chạy” không phải lỗi thật.

  Hệ quả với `content/meta/reference-gaps.yaml`: `sn22.81` CÓ record trong tệp đó (coverage 70/88 = 0.7955, thiếu 1 khoá có nội dung để đạt ngưỡng 0,8). Sau khi lớp lấp này `published`, coverage = 88/88 = 1,0000, nên record trở thành thừa; tôi KHÔNG chạm tệp đó — người điều phối chạy lại `npm run reference:gaps` khi gom. Độ nhạy: trước lớp lấp thiếu đúng 1 khoá (cần ⌈0,8×88⌉ = 71, có 70); sau lớp lấp
  thừa 17 khoá so với ngưỡng.
