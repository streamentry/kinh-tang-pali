notes: |-
  1.8 lặp 1.6 và 1.11 lặp 1.13 (Sujato): "but its cessation, settling, and disappearance is not
  brittle." Giữ nguyên cách dịch `nirodho vūpasamo atthaṅgamo` = "cessation, settling, and
  disappearance" và `appabhaṅgu` = "not brittle".

  Quyết định biên tập: 1.6 (`tassa`, số ít) giữ "its"; 1.11 (`tesaṁ`, số nhiều vì
  `saṅkhārā`) đổi thành "their". Động từ vẫn giữ "is not brittle" vì Pāli `idaṁ appabhaṅgu`
  có chủ ngữ số ít `idaṁ`, và Sujato ở cả 1.6 lẫn 1.13 đều dùng "is". Kết quả là
  "their … is not brittle" lệch số so với Sujato; đây là chỗ duy nhất lát 6 chọn số khác với
  bản đã ghim, nên hạ `grammar_logic` và `ambiguity_integrity`. Lựa chọn còn lại là giữ "its"
  như Sujato, nhưng `saṅkhārā` là số nhiều nên "its" sẽ sai rõ ràng.

  1.7 và 1.9–1.10 (Sujato) dùng "Feeling …", "perception …", "choices …" — giữ nguyên bộ đó.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
