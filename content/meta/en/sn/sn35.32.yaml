notes: |-
  Tiền lệ trong chính bài, hai khoá anh em về đúng cấu trúc này: `sn35.32:10.1` (mắt) “The pleasant, painful, or neutral feeling that arises dependent on eye contact: is that permanent or impermanent?” và `sn35.32:22.1` (tâm) “The pleasant, painful, or neutral feeling that arises dependent on mind contact: is that permanent or impermanent?”. Chỉ thay `jivhāsamphassa` → “tongue contact”; `jivhā` là “tongue” theo `sn35.71:5.3` và `sn35.72:6.1`. Dấu `”` đứng trước `?` y như Sujato (Pāli cũng là `”ti?`). `tampi niccaṁ vā aniccaṁ vā` giữ “is that permanent or impermanent”, không thu gọn. Không bất định.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
