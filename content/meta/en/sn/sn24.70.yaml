notes: |-
  Cả ba khoá lặp lại Pāli đã có bản dịch trong CHÍNH bài này:

    - 3.4 lặp 3.15, dùng lại nguyên văn bộ từ "But by not grasping what’s
      impermanent, suffering, and perishable, would such a view arise". Bản ghim ở 3.15
      có `“` và `?` mà Pāli không có, nên bản lấp bỏ ngoặc và kết bằng `:`.
    - 3.5 và 3.16 đều lặp 1.3, dùng lại nguyên văn kể cả khuôn `’”?`.

  Bất định đã ghi nhận — đây là chỗ đáng nói nhất của lát này:

    - Bản ghim không thống nhất giữa "and healthy after death" và "and is healthy after
      death". Đếm cả tầng Sujato: "and is healthy" 6 lần, "and healthy" 4 lần. Đếm riêng
      trong sn24.70: "and healthy" 3 lần (1.3, 2.7, 3.20) và "and is healthy" 2 lần
      (2.2, 3.9). Bản lấp theo số đếm TRONG CHÍNH bài đang dịch, vì 1.3 là cùng Pāli và
      cùng dấu kết `’”ti?` — đó là tiền lệ gần nhất. Người biên tập có thể chọn ngược
      lại theo số đếm toàn tầng; hai cách đều có tiền lệ, nên `terminology` hạ 9.3.
    - Dấu hai chấm ở 3.4 là hệ quả của chốt `?`-theo-Pāli.
    - 3.6 ("No hetaṁ, bhante"), 3.21 ("Chabbīsatimaṁ") và 3.22 ("Tatiyapeyyālo") trống ở
      bản ghim và dưới ngưỡng 40 ký tự, nên cột English của khối 3 vẫn đứt quanh 3.5.
      (3.10 đã có bản ghim.) Không bịa chữ để nối.
    - Bài này chưa có bản Việt của dự án, nên không có đối chiếu Việt.
    - Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của
      lớp lấp. `triangulation` bị chặn ở 8.0 vì không có bản Anh độc lập.
