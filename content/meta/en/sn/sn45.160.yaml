notes: |-
  Ghi chú biên tập trong ngoặc, cùng hình dạng với `sn44.5:1.2` ("(The same down as far as:)") và
  `sn46.175-184:1.1` ("(Tell in full as in SN 45.171–180.)").

  `balakaraṇīya` → "hard work": lấy đúng tiêu đề phẩm của CHÍNH bài này (0.2 = "12. Hard Work"), và đúng
  mn35:10.5 / sn49.23-34:1.1 của bản đã ghim ("all the hard work that gets done"). Cũng cần thế vì cụm này
  không có tiền lệ bản Anh nào dịch theo nghĩa đen "điều phải học thuộc" — nếu chọn nghĩa đen thì bài sẽ
  dạy hai điều khác nhau về cùng một phẩm. `tadapi … vitthāretabbaṁ` → "should be told in full": đúng
  sn46.175-184:3.2 của bản đã ghim.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
