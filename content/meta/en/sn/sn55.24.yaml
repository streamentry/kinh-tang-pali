  CỤM MƯỜI VẾ CỦA ĐỨC THẾ TÔN. `itipi so bhagavā …pe… satthā devamanussānaṁ
  buddho bhagavāti` có ở 4.2/5.2/6.2/7.2 của bài này, và cả bốn đều để trống ở tầng ghim.
  Bản Anh đã ghim có đúng Pāli có dấu lược này ở bốn chỗ khác — sn55.13:2.4, sn55.26:5.3,
  sn55.35:2.3, sn55.37:4.3 — nhưng ở cả bốn ông MỞ RỘNG `…pe…` thành văn đầy đủ. Lớp lấp
  không mở: giữ đúng MỘT `…`, dùng nguyên bộ từ Sujato cho hai vế không bị lược. Phần bị
  lược là `arahaṁ sammāsambuddho vijjācaraṇasampanno sugato lokavidū anuttaro
  purisadammasārathi` — KHÔNG mở. Đo toàn tầng lấp: 40 khoá đã dùng đúng một chuỗi này,
  nên bốn khoá ở đây dùng y hệt, cùng một chuỗi ⇒ không có chỗ nào của bài tự mâu thuẫn.

  DẤU CHẤM PHẨY Ở 7.2. Pāli 7.2 kết `;` (khác 4.2/5.2/6.2 kết `.`). Đo toàn tầng lấp: trong
  205 khoá mà Pāli kết `;` thì 114 khoá giữ `;`, 64 khoá đổi thành `.`, 26 khoá thành `,`.
  Riêng với cụm này thì CẢ HAI tiền lệ có Pāli kết `bhagavāti;` — sn55.7:11.2 và
  sn55.44:2.3, đúng vị trí danh sách bốn mục như 7.2 — đều dùng `.`, với lý do đã ghi ở
  notes của sn55.44: tiếng Anh không lấy dấu chấm phẩy ở cuối một mục danh sách, và vai
  trò nối mục đã do dấu lược treo của tầng ghim ở khoá kế đảm nhiệm. Theo tiền lệ.

  LỆCH CỐ Ý — MỘT CHỖ DUY NHẤT: 2.8 KHÔNG dùng lại lời của 1.8.
  Pāli 1.8/2.8 là `Yatra hi nāma saraṇāni sakko kālaṅkato;` và mệnh đề kế là
  `so bhagavatā byākato: ‘sotāpanno…’ti.` Tầng ghim dịch 1.8 thành "For the Buddha even
  declared Sarakāni to be a stream-enterer after he passed away." — câu đó nuốt mất vế
  `so bhagavatā byākato:` của khoá 1.9 và biến vế dẫn nhập thành mệnh đề đã kết. Hậu quả đo
  được: người đọc thấy ĐỨC THẾ TÔN tuyên bố Saraṇāni là sotāpanno HAI LẦN, trong khi Pāli
  nói MỘT lần; và `Yatra hi nāma` (="vì/lúc này…") mất hẳn. Cùng lỗi ấy lặp ở sn55.25:1.8.
  Nếu chép nguyên văn vào 2.8 thì lớp lấp sẽ mang luôn lỗi đó và bài sẽ tự mâu thuẫn, nên
  2.8 dịch lại từ Pāli: "For Sarakāni has indeed passed away," — giữ chữ "For" mà tầng ghim
  đã dùng cho `Yatra hi nāma`, chỉ sửa vế bị đảo. Đọc `yatra hi nāma` đã đối chiếu 25 chỗ
  trong AN và SN: nghĩa là "vì / khi / bởi vậy" (ví dụ an10.177:18.2 → "since it's never
  fruitless"; an10.75:2.1 → "when"; sn6.4:3.3 → "Because"). Vì khoá kế bắt đầu bằng `so`,
  dấu `;` của Pāli không dịch được thành chấm ở đây ⇒ dấu phẩy (26/205 khoá lấp cũng làm
  vậy), và `so` được giữ lại làm từ tương ứng. 1.8 không nằm trong tập lấp nên không sửa
  được; sự lệch này sẽ hiện ra ở bản đọc bốn cột và được ghi ở đây.

  NGOẶC KÉP, đo từng khoá: 2.2 mở `“` (Pāli có, khoá sau không đóng — vế đi tiếp sang
  2.11 kết `”`; nhịp nháy chạy qua ranh giới khoá là cố ý trong Pāli, nên theo đúng Pāli).
  1.10/2.4/2.10 kết `‘’` vì Pāli khoá đó dùng nháy đơn, dù 1.4 dùng nháy kép. 4.2/5.2/6.2/7.2
  không có ngoặc kép nào vì Pāli cũng không có (tầng ghim có `‘’` ở bốn chỗ kia là do bản
  ghim tự gộp ngoặc vào). 2.6 không mở ngoặc kép vì 2.2 đã mở sẵn — chép y nguyên 1.6 rồi
  bỏ `“` mở đầu. Đo tầng lấp: 355/383 khoá mà Pāli có nháy đơn thì lớp lấp giữ nháy đơn.

  VỀ DẤU `—`. 2.5 kết `—` và lớp lấp mang dấu nối xuống: đo toàn tầng lấp, 43/61 khoá mà
  Pāli kết `—` thì bản Anh cũng kết `—`. Câu còn mở sang 2.6, đúng như Pāli.

  THUẬT NGỮ. `saraṇāni sakko` → "Sarakāni the Sakyan", y như tầng ghim ở 1.2/3.4/9.11.
  `bhante` → "sir": đo tầng ghim chương sn55, `bhante` đều ra "sir"; tiền lệ lớp lấp tương
  ứng ở an5.55:2.2 ("Here, sir,") và ở đây `idha, bhante` → "Here, sir,". `bho` ở 2.6
  dùng y lời của 1.6 ("Oh lord"), vì 1.6 và 2.6 là cùng một lời Sakyans kể.

  TRIANGULATION — THẤP, VÀ NÊN RÕ. Bài này CHƯA CÓ bản Việt canonical trong kho: không
  có tệp `content/meta/sutta/sn/sn55.24.yaml` và không có tệp dịch Việt cho sn55.24, nên
  không có tầng Việt nào để đối chiếu nghĩa. Cũng không có bản Anh thứ hai. Vậy nên bài lấp
  này CHỈ dựa vào Pāli root + tầng Anh đã ghim, và KHÔNG ĐƯỢC tuyên bố là đã đối chiếu với
  một cách đọc Anh độc lập; vì vậy `triangulation` = 7,0, thấp hơn cả mức trần 8,0 mà lớp
  lấp dùng khi hai lớp trùng người làm. Ở đây còn không có bản Việt để so `assessed_by`.

  ĐO RIÊNG TẦNG ANH ĐÃ GHIM Ở CHÍNH BÀI NÀY (để đối chiếu, không sửa được — 1.8 không
  thuộc tập lấp). `…pe…` có ở 17 khoá Pāli; tầng ghim để trống 5 khoá có lược và thay bằng
  `…` ở 12 khoá (đúng một dấu, không mở). Ngược lại ở 4.1/5.1/6.1/7.1 Pāli viết đủ rồi bằng
  `—`, tầng ghim lại CHÈN `…` — 4 khoá. 9.6 có `…pe…` mà tầng ghim bung hết thành "the
  faculties of faith, energy, mindfulness, immersion, and wisdom." 2.1 có thêm vế "told him
  what had happened" mà Pāli không có ở khoá đó. 8.2/8.3 và 9.2/9.3 Pāli có tiền tố phủ định
  `na` mà tầng ghim BỎ (`na dhamme …pe…` → "the teaching … ") — nén phủ định, 4 khoá, và
  7.3 cùng 5.3/6.3/4.3/4.4/5.4/6.4 cũng không có `na` trong Pāli nên ở đó không lỗi. Lỗi
  nặng nhất là 1.8 (xem mục trên): đảo vế, làm một mệnh đề hiện ra hai lần.

