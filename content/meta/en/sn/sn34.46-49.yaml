notes: |-
  Bốn khoá đầu dùng lại đúng thuật ngữ bản đã ghim đã dịch: `gocarakusalo` → “skilled in
  the territory of immersion”, `abhinīhārakusalo` → “skilled in projecting the mind purified by
  immersion” (`sn34.46:1.2`, `sn34.50:1.2`, `an6.24:1.3`).

    - `1.3` là `1.2` đảo hai vế — cùng khuôn “One meditator is skilled in X but not in Y.”
    - `1.4` `neva … na ca …` → “skilled neither in X nor in Y.”
    - `1.5` `… ca hoti, … ca …` → “skilled both in X and in Y.” (`ca…ca`)
    - Cả ba giữ hình dạng `… . …”` của `1.2`, vì năm bản Anh đã ghim có cùng hình dạng — `sn34.46:1.2`,
      `sn34.47:1.1`, `sn34.48:1.1`, `sn34.49:1.1`, `sn34.50:1.2` — đều khép `… …”`. Bốn
      dòng `1.2`–`1.5` phải trông như bốn dòng cùng một lái.

    - `1.6`: Pāli `seyyathāpi, bhikkhave, gavā khīraṁ, … sappimhā sappimaṇḍo tatra
      aggamakkhāyati;` khớp `sn34.1:1.9`, `sn34.2:1.9`, `sn34.55:1.9` (chỉ khác chữ hoa đầu).
      Bản đã ghim đọc: “From a cow comes milk, from milk comes curds, from curds come butter, from
      butter comes ghee, and from ghee comes cream of ghee. And the cream of ghee is said to be the
      best of these.” Tôi dùng lại nguyên văn, hạ chữ đầu vì Pāli ở `1.6` viết thường, và đổi chấm
      cuối thành dấu chấm phẩy vì Pāli nối sang `1.7`.

    - `1.7`: cùng khuôn với `sn34.55:1.10`, `sn34.1:1.10`, `sn34.2:1.10`. Bản đã ghim ở đó
      dịch trọn `…ayaṁ imesaṁ catunnaṁ jhāyīnaṁ aggo ca seṭṭho ca mokkho ca uttamo ca pavaro
      cā”ti.` thành “is the foremost, best, leading, highest, and finest of the four.” Ở `1.7`
      của sn34.46, vế vị ngữ đó KHÔNG có: nó nằm trong `…pe…`, chỉ còn `uttamo ca pavaro cā”ti.`
      ở `1.8`. Tôi vì thế dừng ở “this one, of these four meditators …” và GIỮ DẤU LƯỢC. Dịch
      nốt “is the best of these four meditators” nghĩa là mở rộng `…pe…`, tức đẩy tiếng Anh bịa
      vào một tầng không nguồn nào cho phép.

  BẤT ĐỊNH CÒN LẠI (không chặn, đã ghi ra đây):
    1. `1.7` đọc lên sẽ dở câu, vì vế vị ngữ nằm trong `…pe…`. Bản Việt đã công bố ở repo đã mở
       rộng dấu lược đó (“là nhất, là tốt nhất, là giải thoát…”); tôi cố tình KHÔNG theo, vì bản Việt
       là tầng dự án còn tầng lấp Anh là tầng tham khảo, và luật của tầng lấp là giữ `…`.
    2. Pāli ở `1.7` viết `yvāyaṁ`, có vẻ là lỗi chính tả của Pāli gốc đã ghim cho `yāyaṁ`
       (“bất cứ ai trong số…”). Cùng lỗi ấy ở `sn34.1:1.8`, `sn34.1:1.10`, `sn34.55:1.10`,
       và bản đã ghim đều dịch là “whichever” / “the one who”. Tôi theo, không sửa Pāli.

  Lớp lấp: 5 khoá nằm ở chỗ bản Anh đã ghim để trống; `1.8`, `1.9`, `sn34.47:1.3`,
  `sn34.48:1.2`, `sn34.49:1.2`, `sn34.49:1.3` cũng trống nhưng ngoài lát này. Triangulation bị
  chặn ở 8.0.
