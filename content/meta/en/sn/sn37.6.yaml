notes: |-
  1.1 có PãI GIỐNG HỆT HAI bản ghim: sn37.5:2.1 và sn37.14:1.1, đều là "“Anuruddha, when ladies
  have five qualities, when their body breaks up, after death, they are reborn in a place of loss,
  a bad place, the underworld, hell." — chép nguyên văn theo luật 3. Hai nguồn độc lập trùng nhau.

  1.4 có Pāli GIỐNG HỆT CẢ HAI: sn37.5:2.4 và sn37.14:1.4, đều "When ladies possess these five
  qualities, when their body breaks up, after death, they are reborn in a place of loss, a bad
  place, the underworld, hell.”

  Ánh xạ 4 chữ: `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ` → "a place of loss, a bad place, the
  underworld, hell"; cụm 4 vế này xuất hiện 183 lần trong bản Anh đã ghim. Không có `…pe…` ở hai
  khoá này nên không phải giữ dấu lược nào — đây là lý do 1.1/1.4 ở bài này trôi hơn các bài cùng
  nhóm có `…pe…` (sn37.10/11/12/13).

  1.3 đã ghim (bản đã ghim, không phải của tôi) mở và đóng ngoặc kép riêng ("“… They’re faithless,
  shameless, imprudent, acrimonious, and witless. …”"), nên `“` ở 1.1 của tôi và `”` ở 1.4 là cặp
  đúng với Pāli.
