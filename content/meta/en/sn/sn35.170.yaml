notes: |-
  Tiền lệ: `sn35.170:1.1` (Sujato) “Mendicants, you should give up desire and greed for what is impermanent.”; cùng cụm đã được dùng ở `sn22.142:1.3` (lớp lấp đã publish) và ở `sn35.13:1.12` (“Removing and giving up desire and greed for the eye”). Khuôn câu chốt theo `sn35.168:1.6`. `chandarāgo` = “desire and greed”, không phải “greed” — xem 1.1 của chính bài. Không bất định.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
