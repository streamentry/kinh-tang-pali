notes: |-
  Tiền lệ mạnh nhất lát: sn35.7 là bài CÙNG KHUÔN 22 khoá và đã ghim đúng hai khoá trùng nguyên
    văn — 1.16 `Evaṁ passaṁ … atītasmiṁ manasmiṁ anapekkho hoti;` và 1.18 `paccuppannassa manassa
    … hotī”ti.` Cùng bài đó ghim 1.3 "is not concerned with the eye of the past" và 1.5
    "regarding the eye in the present".

    Bất định đã ghi, và là cố ý: sn35.7:1.16 dịch cùng vế Pāli bằng "doesn’t worry about the mind
    of the past", còn 1.3 của chính bài này dịch `atītasmiṁ cakkhusmiṁ anapekkho hoti` bằng "is not
    concerned with the eye of the past". Luật 3 là luật của CHÍNH BÀI ĐANG DỊCH, nên 1.16 ở đây
    theo 1.3 của sn35.8 ("is not concerned with the mind of the past") để bài tự nhất quán, dù bỏ
    qua tiền lệ của sn35.7. 1.10 và 1.12 cũng theo 1.3 và 1.5 của chính bài.

    1.18 Pāli có `”ti` còn 1.12 không, nên 1.12 không mang `”`.
