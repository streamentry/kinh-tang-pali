notes: |-
  Tiền lệ, đếm được: `Pañcahi, anuruddha, dhammehi samannāgato mātugāmo …pe… nirayaṁ upapajjati` có
  bản Anh đã ghim ở sn37.14:1.1 — “Anuruddha, when ladies have five qualities, when their body
  breaks up, after death, they are reborn in a place of loss, a bad place, the underworld, hell.”
  `mātugāmo` → “ladies” (an8.46:18.1, sn37.1/4/5/14/15); `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ
  upapajjati` → “in a place of loss, a bad place, the underworld, hell” (17× ở mn129:25.6, cộng 30+
  bài khác).

  Tiền lệ cho tiểu ngữ 1.4/1.5: bản Anh đã ghim ở sn37.14:1.4 dùng đúng khuôn “When ladies possess
  these five qualities, …”, và bản Việt dự án của chính bài này tách 1.4 kết bằng `…` / 1.5 mở đầu
  bằng động từ “sinh ra” + danh sách địa ngục — lớp lấp bám đúng cách tách đó.

  BẤT ĐỊNH đã ghi: 1.5 dịch `upapajjatī` thành “reborn in …” với chủ ngữ do `…` của 1.4 đảm nhiệm,
  nên đọc liền 1.4–1.5 là “When ladies possess these five qualities, … reborn in a place of loss …”.
  Có thể viết “they are reborn in …” cho rõ chủ ngữ, nhưng khi đó chữ “they” không có trong Pāli
  1.5; giữ bám Pāli là ít sai hơn. Đây là lý do hạ `grammar_logic` và `vietnamese_clarity`.

  Ngoài phạm vi lát: 1.2 (`Katamehi pañcahi?`) và 1.6 (`Aṭṭhamaṁ.`) cũng trống ở mọi tầng nhưng
  không thuộc b6.json, nên cột Anh của chúng vẫn trống. Không tự điền vì ngoài lát đã giao.
