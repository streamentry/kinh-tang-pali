notes: |-
  YẾU NHẤT CỦA LÁT NÀY, nên hạ điểm rõ ràng. Cả hai khoá lặp vế
     `tatra vo chando pahātabbo, rāgo pahātabbo, chandarāgo pahātabbo`, chỉ có một bản dịch
     đã ghim cho nó là 1.1 — và bản đó GIẢI QUYẾT ba mục bằng dấu lược
     ("you should give up desire … greed … desire and greed"). Pāli 1.8 và 1.9 KHÔNG có
     `…pe…` (0 đơn vị dấu lược), nên không được mượn cách viết đó; phải liệt kê thẳng cả
     ba mục, và bản Anh sẽ thành "desire, greed, and desire and greed" — lặp do chính Pāli
     lặp (`chando` rồi tới `chandarāgo`), không phải lỗi dịch.
  
  Bất định đã ghi: `tatra` không có tiền lệ trong tầng Anh đã ghim (bản đã ghim 1.1 bỏ
     hẳn), dịch "there"; `dhammā` ở 1.8 dịch "ideas" theo danh sách đã ghim ở 1.3. Câu 1.9
     vì thế đọc hơi cộc ("And what is not-self, mendicants, there you should give up …");
     giữ vì mọi cách khác đều phải thêm chữ mà Pāli không có.
