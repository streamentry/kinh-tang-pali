notes: |-
  Tiền lệ cho 7.8: `Imāsaṁ kho, bhikkhave, tissannaṁ esanānaṁ pahānāya … bhāvetabbo` đã có bản Anh
  đã ghim ở 7.5 của CHÍNH bài — “The noble eightfold path should be developed to give up …” — và mẫu
  `…bhāvetabboti` ở 1.9 — “This is the noble eightfold path that should be developed to directly
  know these three searches.” 7.8 ghép đúng hai khuôn ấy, đổi “directly know” thành “give up” theo
  7.5.

  Tiền lệ cho 7.7: `sammādiṭṭhiṁ bhāveti …pe… sammāsamādhiṁ bhāveti vivekanissitaṁ virāganissitaṁ
  nirodhanissitaṁ vossaggapariṇāmiṁ` có bản Anh đã ghim ở sn45.140:1.6, sn45.161:1.8 và sn3.18:5.2
  (22 lần) với cụm “which rely on seclusion, fading away, and cessation, and ripen as letting go”.

  BẤT ĐỊNH đã ghi: các bản Anh đã ghim kể trên đã MỞ RỘNG `…pe…` (liệt kê cả tám căn). Luật 2 của
  lớp lấp cấm mở rộng — bổ sung chữ vào tầng Anh là chữ không nguồn nào cấp phép — nên 7.7 giữ `…`
  và chỉ hiện “right view … and right immersion”. Hệ quả: đọc liền 7.7 với 1.8 (đã ghim) sẽ thấy 1.8
  liệt kê đủ tám căn còn 7.7 không; chênh lệch đó là do bản đã ghim, không phải do lớp lấp. Hạ
  `vietnamese_clarity` vì dòng đọc liền bị đứt.

  Ngoài phạm vi lát: 7.6 (`Katamo ariyo aṭṭhaṅgiko maggo?`) và 7.10 (`Paṭhamaṁ.`) trống ở mọi tầng,
  không thuộc b6.json nên không điền.
