notes: |-
  Tiền lệ: `sn35.177-179:1.1` (Sujato) đã dịch danh sách ba món `chando / rāgo / chandarāgo` thành “desire … greed … desire and greed”, nên bộ từ ở đây giữ nguyên theo đó.

  BẤT ĐỊNH CẦN GHI: bản đã ghim dùng `…` **làm dấu phẩy** trong danh sách, còn Pāli ở 1.6/1.9 là dấu phẩy thật và **không** có `…`; chốt của kho đòi số dấu lược khớp TỪNG KHOÁ, nên ở đây buộc phải dùng dấu phẩy thật. Tầng Việt của dự án cũng phẩy đúng ba món ở 1.1, nên đây là cách của chính kho chứ không phải lựa chọn mới. Hệ quả: cột Anh ở câu chốt dài hơn ở 1.1 và dùng dấu phẩy.

  Câu chốt theo khuôn `sn35.168:1.6` (bỏ xưng hô, viết hoa `You`). Mệnh đề `aniccaṁ` = “what is impermanent”, giữ theo 1.1.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
