notes: |-
    Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược. `sn12.68` có **18** khoá để trống; lát này
    được giao 7.

    **Bảy khoá trong bảy khoá: không có câu nào phải tự dịch.** Mỗi Pāli của khoá lấp đều trùng
    nguyên văn với một khoá đã ghim trong chính bài này, nên lớp lấp CHÉP lời đã ghim, không gõ tay:

    - `8.3`, `9.4`, `10.3`, `11.4` — Pāli giống **hệt** `1.5` (mười khoá trong bài, kể cả chính `1.5`, mang đúng một câu Pāli này: `1.5`, `2.12`, `3.3`,
      `4.12`, `5.3`, `8.3`, `9.4`, `10.3`, `11.4`, `12.3`). Lấy nguyên văn lời đã ghim ở `1.5`:
      “Reverend Saviṭṭha, apart from faith, endorsement, oral transmission, reasoned train of
      thought, or acceptance of a view after deliberation, I know and see that”. Sujato đã bỏ dấu
      hai chấm cuối Pāli ở `1.5`, nên bản lấp cũng không có — chép nguyên văn, không tự thêm.
    - `9.1`, `10.1`, `11.1` — Pāli giống `12.1` **đúng một ký tự**: `12.1` kết bằng `ñāṇaṁ: ` còn
      `9.1` kết bằng `ñāṇaṁ—`. Câu dẫn vì vậy là của Sujato đã viết, lấy nguyên văn:
      “Reverend Nārada, apart from faith, endorsement, oral transmission, reasoned train of thought,
      or acceptance of a view after deliberation, do you personally know that”. `10.1` và `11.1`
      trùng **nguyên văn** cả `12.1`.

    **Không có gì để dịch mới, nên cũng không có chỗ nào có thể tự mâu thuẫn.** Đây là hệ quả có lợi
    của lát này: bản lấp ở `sn12.68` là bản sao một tầng, không phải một bản dịch thứ hai.

    **Còn 11 khoá trống lấp được mà lát này không được giao — báo lại để người điều phốn xử lý.**
    `8.2`, `8.4`, `9.2`, `9.3`, `9.5`, `10.2`, `10.4`, `11.2`, `11.3`, `11.5`, `14.4`.
    - `8.2` và `8.4` trùng nguyên văn `1.4`/`1.6` ⇒ lấy lại đúng lời đã ghim.
    - `9.2`, `9.3`, `9.5`, `10.2`, `10.4`, `11.2`, `11.3`, `11.5` là các vế trong dãy
      `paccayā` với `…pe…`, đều có công thức đủ ngay ở `2.2`–`2.11` và `4.2`–`4.11` đã ghim ⇒ lấy
      lại nguyên văn lời đã ghim tương ứng, giữ đúng một `…` mỗi khoá.
    - `14.4` = `Aṭṭhamaṁ.` (4 ký tự) — colophon, **dưới ngưỡng đo 40 ký tự**, nên không tính vào
      coverage. Vẫn nên lấp: `Tatiyaṁ.` ở `28.9`-kiểu đã có tiền lệ trong lớp lấp.

    `triangulation` hạ vì không có bản Anh độc lập: cả bảy khoá là lời đã ghim của chính tầng
    ghim, và bài này **không có lớp Việt** (`content/translation/vi/project/sutta/sn/sn12.68…`
    vắng mặt, `content/meta/sutta/sn/sn12.68.yaml` vắng mặt) nên cũng không có tầng Việt để đối
    chiếu nghĩa. Bốn lệnh cổng còn lại **chưa** chạy vì lát này bị cấm: `npm run validate`,
    `npm test`, `npm run check`, `npm run build`.
