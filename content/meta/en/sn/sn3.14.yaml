notes: |-
  **Bốn nhóm khoá (đo trên cả 28 khoá của bài): A = 0 · B = 7 · C = 1 · D = 0.** Không khoá nào
  trong bài có Pāli trùng **nguyên văn** với khoá khác, nên nhóm A rỗng. `3.1`–`3.7` là các tỳ-kheo
  **dẫn lại** `1.2`–`1.8` cho Đức Thế Tôn, nên cả bảy khoá thuộc nhóm B. `1.4` là nhóm C: lời báo của
  vua Pasenadi, không khoá nào khác trong bài có lời để mượn, nên dịch thật từ Pāli.

  **Nhóm B — bảy khoá, dựng lại từ lời tầng đã ghim. Cột giữa là tỉ lệ khớp Pāli, cột cuối là tỉ lệ
  khớp English (đều đo bằng máy).**
  · `3.1` ← `1.2` — Pāli 0,9482 · English 0,9590. Chèn `“` mở + `Here, sir,` thay `Atha kho`.
  · `3.2` ← `1.3` — Pāli 0,8767 · English 0,9315. Chèn `sir` trước dấu hai chấm của Pāli.
  · `3.3` ← `1.4` — Pāli 1,0000 · English 0,9859. Chỉ khác dấu nháy (xem dưới).
  · `3.4` ← `1.5` — Pāli 0,9650 · English 0,6996. Chèn `Then, sir,` + chủ ngữ `King Pasenadi of
    Kosala`, và **trả lại** `rājānaṁ māgadhaṁ ajātasattuṁ vedehiputtaṁ` mà tầng đã ghim bỏ.
  · `3.5` ← `1.6` — Pāli 0,9486 · English 0,4218. Chèn `Then, sir,` + **trả lại tên đầy đủ cả hai
    vua**; tầng đã ghim nói “the two kings”.
  · `3.6` ← `1.7` — Pāli 0,9548 · English 0,5749. Chèn `sir` + tên đầy đủ hai vua + **chấm `.`**
    thay dấu phẩy (xem dưới).
  · `3.7` ← `1.8` — Pāli 0,9308 · English 0,6512. Chèn `And defeated, sir,` + chủ ngữ + dấu `”`.
  Ba tỉ lệ English thấp ở `3.5`–`3.7` là vì chỗ ấy tầng đã ghim nén danh xưng, nên phần chênh chính
  là **chỗ lớp lấp chèn lại** — đúng thứ nhóm B nên làm.

  **Danh xưng và thứ bậc, dùng thống nhất ở cả tám khoá.** `rājā māgadho ajātasattu vedehiputto`
  → “King Ajātasattu of Magadha, son of the princess of Videha”, lấy **nguyên văn** cụm này từ
  lời đã ghim ở `1.2`; `rājā pasenadi kosalo` → “King Pasenadi of Kosala”. Pāli `1.4` dùng `kira`
  (nghe nói) và `abbuhuyāto` (thì báo cáo), nên lớp lấp dịch `kira` → “it seems” và dùng thì hiện tại
  “has mobilized … and marched against me”, khác thì quá khứ của phần kể `1.2`–`1.8`. `mamaṁ`
  giữ thành “against me” vì đó là tiếng của chính vua Pasenadi, và khớp với bản Việt canonical.

  **Dấu lược: 0/0.** Không khoá nào trong tám khoá này chứa `…`, nên tổng dấu lược của bản lấp bài
  này bằng **0** — không có chỗ nào để mở rộng cũng không có chỗ nào để thêm. Bài có `…pe…` ở `4.4`
  nhưng khoá đó đã ghim và không thuộc lát này.

  **Ngoặc kép: khớp Pāli 8/8.** `1.4` `“…”` · `3.1` mở `“` · `3.2` `3.4` `3.5` `3.6` không nháy ·
  `3.3` `‘…’` · `3.7` đóng `”`. Tầng đã ghim của riêng bài này (20 khoá có lời) **không** dùng nháy
  kép lồng nhau ở bất kỳ khoá nào, nên ngoại lệ “theo quy ước nháy lồng của tầng đã ghim” không có
  gì để áp dụng: lớp lấp khớp Pāli từng khoá, lệch có chủ ý = **0**. Cùng hình trong cùng bộ đã
  dùng nháy đơn cho lời lồng: `sn3.8:2.3` `2.5` `2.8` (trong lời mở bằng `“` ở `2.2`) và
  `sn47.29:1.12`. Không có khoá nào trong tám khoá chứa dấu nháy bên trong từ.

  **Số Pāli: không khoá nào trong tám khoá này có cấu tạo số** (`navuti`, `tālīsa`, `sahassa`,
  `sata`…), nên không có số nào phải tự tính và không có chỗ nào có nguy cơ dịch sai số. Riêng
  `caturaṅginiṁ senaṁ` là “an army of four divisions”, lấy nguyên lời tầng đã ghim ở `1.2`.

  **Ba loại lỗi tầng Anh đã ghim mà người điều phốn nêu — ở đúng bài này: 0 mắc.**
  · *Mở rộng dấu lược* (Pāli viết đủ, tầng đã ghim thêm `…`): **0** khoá. Toàn tầng `sn` có **1.185**
    khoá kiểu này, không khoá nào thuộc `sn3.14`.
  · *Tự thêm nháy*: **0** khoá.
  · *Viết thêm câu chữ không có ở Pāli*: **0** khoá.
  Khác biệt duy nhất trên 20 khoá đã ghim của bài này là `4.4`: Pāli `Idamavoca …pe…` có **2** dấu
  lược, tầng đã ghim có **1** (và vì vậy thành 2 câu thay vì 1). Đếm toàn tầng `sn`: **1.657** khoá
  rút `…pe…` còn đúng một `…`, **1.472** khoá mất hẳn, **173** khoá giữ nguyên 2 — đây là quy ước
  của tầng, không phải lỗi riêng bài này.

  **Hai lựa chọn dịch đã cân, ghi ra để người đọc kiểm được.**
  1. `Idha, bhante,` → **“Here, sir,”**. Đếm trên lớp lấp `sn` đã publish, những khoá có
     `idha, bhante,`: `Sir,` **4** · `Here, sir,` **3** · `Sir, here` **1** — **không có đa số**; riêng
     `sn3` là **1/1/1** (nên hai phạm vi này cho ba số khác nhau, ghi cả hai). Chọn `Here, sir,` vì
     (a) `Idha` là chữ có nghĩa, bỏ đi là mất nghĩa — `sn3.10:2.3` là trường hợp đã bỏ; (b)
     `sn3.12:3.2` — cùng cấu trúc `“idha, bhante,` mở lời báo cáo cho Đức Phật, trong đúng bài này —
     dịch là `Here, sir,`.
  2. `kira` → **“it seems”**, đặt đúng chỗ Pāli đặt, tức ngay sau chủ ngữ. Đếm trên lớp lấp `sn`
     đã publish: `sambahulehi kira bhikkhūhi` → “Several mendicants, it seems, …” và
     `sambahulā kira bhikkhū` → “several mendicants, it seems, …”; cả hai đều đặt `it seems` ngay
     sau chủ ngữ, không đặt lên đầu câu.

  **Ba chỗ cố ý lệch tầng đã ghim, kèm lý do.** (i) `3.4`, `3.5`, `3.6` viết đủ
  `King Ajātasattu of Magadha, son of the princess of Videha` / `King Pasenadi of Kosala`, vì tầng
  đã ghim nén thành “against Ajātasattu”, “the two kings”, “Ajātasattu … Pasenadi”; ở `3.4`–`3.7` các
  khoá này là lời các tỳ-kheo kể lại nói **độc lập**, nên tên bị nén ở `1.5`–`1.8` sẽ mất thông tin
  có thật trong Pāli — và nhóm B cho phép chèn lại đúng phần đó. Khớp với bản Việt canonical.
  (ii) `3.6` kết bằng dấu chấm, không theo dấu phẩy của tầng đã ghim ở `1.7`, vì Pāli kết `3.6`
  bằng `.` và mở `3.7` bằng `Parājito ca` — hai câu riêng. (iii) `3.2` dùng dấu hai chấm `:` theo
  Pāli, tầng đã ghim dùng dấu phẩy ở `1.3`; giữ `:` thì `3.3` mới dẫn lời trích đúng kiểu.

  **Một chỗ sẽ hiện ra với người đọc, nói thẳng vì lớp lấp không sửa được tầng đã ghim.** Tầng đã
  ghim kết `1.3` bằng **dấu phẩy** (*When King Pasenadi heard of this,*) và mở `1.5` bằng chữ thường
  (*he mobilized …*), vì Sujato đã bỏ trọn khối trích dẫn `1.4`. Lớp lấp điền `1.4` đúng theo Pāli,
  tức khối `“…”` **có** dấu chấm; đọc `1.3` → `1.4` → `1.5` sẽ thấy `1.5` đứng sau dấu chấm mà vẫn
  bắt đầu bằng “he”. Pāli không cần vậy: `1.5` mở bằng `Atha kho` và là câu mới. Đây là seam của tầng
  đã ghim, không phải lỗi của lớp lấp. Khối `3.1`–`3.7` — toàn bộ do lớp lấp viết — đọc liền mạch.

  **Số khoá trống còn lại của bài: 0.** Bài này chỉ có **8** khoá tầng Anh đã ghim để trống, và cả 8
  đều dài trên 40 ký tự nên đều nằm trong mẫu số của coverage; lát này lấp hết, không có khoá nào
  dưới ngưỡng bị bỏ lại.

  **Coverage, đo trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 18 khoá.** Trước lớp lấp:
  **10/18 = 0,5556** (dưới ngưỡng 0,8, đúng bằng `coverage: 0.5556` mà `reference-gaps.yaml` ghi).
  Sau khi `published`: **18/18 = 1,0000**. Bài rời khỏi danh sách dưới ngưỡng. Độ nhạy: sau lát này
  không còn khoá Pāli có nội dung nào thiếu English, nên rớt ngưỡng 0,8 là bất khả thi.

  **Hệ quả với `content/meta/reference-gaps.yaml`:** bài **có** record trước lát này
  (`substantiveSegments: 18`, `substantiveWithoutEnglish: 8`, `coverage: 0.5556`) — và bài **có tới
  hai bản** của cùng một record, ở hai vị trí khác nhau trong file, thân giống hệt nhau. Sau khi
  `published`, coverage là 18/18 = 1,0000, đã vượt ngưỡng, nên record thành một lập đoạn sai
