notes: |-
  **Phân loại 36 khoá (đo bằng máy trên Pāli root và tầng Sujato đã ghim): A dùng lại nguyên văn = 20 · B dựng lại = 11 · C tự dịch = 4 · D báo = 1.** A gồm cả khoá lặp nguyên văn một khoá lấp trước đó trong cùng bài; B là Pāli gần (tỉ lệ khớp từ 0,6) một khoá đã có lời, chỉ chèn phần tầng ghim nuốt mất; D là Pāli trùng nguyên văn với khoá đã ghim nhưng lời đã ghim khác nhau, hoặc lớp lấp cố ý lệch (nêu từng khoá bên dưới).

  **Tầng đã ghim đã dồn câu trả lời lặp của Moggallāna vào 4.2** (“He asked Mahāmoggallāna the same questions, and received the same answers.”) và để trống 4.3–6.15; ngoài ra vài khoá lẻ ở phần Đức Phật. Lớp lấp lấp hai khối:
  · **Khối Đức Phật: 1.7, 2.2, 2.3, 2.5, 2.6, 3.7, 3.8, 3.15, 3.16.** Pāli `‘sassato loko’ti vā …pe…` / `‘neva hoti na na hoti tathāgato paraṁ maraṇā’ti vā` là phần liệt kê các luận đề; tầng ghim dịch phần dẫn “one of these” ở 2.1 / 3.6 / 3.14 và bỏ trống các khoá này. Lấp bằng đúng các cụm tầng ghim đã dịch ở 1.3 và 1.5: “‘the cosmos is eternal’” và “a realized one neither still exists nor no longer exists after death”. Một `…` mỗi khoá có `…pe…`.
  · **Khối Moggallāna: 4.3–4.7 (B, 0,85–0,91, nguồn 1.3–1.7) và 5.1–5.6 (B 0,95 / 0,87, nguồn 2.1, 2.4; còn lại lặp lại khoá lấp trước).** Đổi người gọi (Gotama thành Moggallāna), “me” thành “the Buddha” (4.4 và 4.6, `bhagavatā`), và “the ascetic Gotama” (5.4, `samaṇassa gotamassa`) theo Pāli.
  · **6.1–6.15.** 6.1–6.6 và 6.9–6.13 là khối Pāli trùng nguyên văn với 3.1–3.6 và 3.9–3.13, nên dùng lại nguyên văn lời đã ghim (A, 11 khoá); 6.7 và 6.8 giống 3.7 và 3.8 (khoá lấp) nên mang cùng lời. **6.15 (C)** là danh sách mười luận đề; dùng đúng cụm tầng ghim đã dịch cho cùng công thức ở sn44.7 (“the cosmos is not eternal”, “the soul and the body are one and the same”, “the soul is one thing, the body another”, “a realized one still exists / no longer exists / both … / neither … after death”).
  · **7.7 `Aṭṭhamaṁ.`** nhãn thứ tự, “Eighth.”: bài là sn44.8, nhãn khớp số mục.
  **Hai chỗ cố ý lệch lời đã ghim, có lý do:**
  · **6.14 (D).** Pāli trùng nguyên văn với 3.14, nhưng tầng ghim đóng nháy `”` ở cuối 3.14 (“…to be true.””) dù Pāli 3.14 kết bằng dấu hai chấm và chưa đóng; 6.14 cũng kết bằng dấu hai chấm. Lớp lấp bỏ `”` thừa để khớp Pāli. Đây là lệch cố ý, ghi nhận.
  · **4.3 (nháy).** Pāli `“kiṁ nu kho, bho moggallāna, sassato loko”ti?` không có nháy đơn bên trong; EN có một cặp ‘…’ quanh “the cosmos is eternal”, giống hệt cách tầng ghim đã dịch cùng câu hỏi ở 1.3 (Pāli cũng không có nháy đơn). Đo: Pāli 0 cặp, EN 1 cặp; lý do: giữ quy ước của khoá anh em 1.3 trong cùng bài.

  Dấu lược: 14 khoá lớp lấp có `…` (2.2, 2.5, 3.7, 3.15, 4.4, 5.2, 5.5, 6.2, 6.3, 6.4, 6.7, 6.10, 6.11, 6.12), khớp Pāli. Nháy: khớp Pāli, trừ ngoại lệ 4.3 ở trên.

  **Khoá còn trống:** 0 trong 36 khoá `fillableSegments` (đã lấp hết; đo bằng máy: không còn khoá Pāli nào của bài thiếu cả tầng Sujato lẫn lớp lấp). **Coverage** (Pāli ≥ 40 ký tự, bỏ khối `:0`): trước 21/43 = 0.4884; sau khi `published` 43/43 = 1.0000. Độ nhạy: ngưỡng 0,8 cho phép thiếu tối đa 8 khoá có nội dung (phần nguyên của 0,2 × 43); trước lát bài thiếu 22. `content/meta/reference-gaps.yaml` **có** record của `sn/sn44.8` (substantiveSegments 43, substantiveWithoutEnglish 22, coverage 0.4884). Khi lớp lấp `published` coverage lên 1,0 nên record đó thành thừa; người điều phối sinh lại bằng `npm run reference:gaps`, lát này không sửa tay tệp đó.

  **Triangulation 7.6.** Bản Việt canonical của bài (`content/meta/sutta/sn/sn44.8.yaml`) do cùng họ công cụ làm, rà soát hoặc chấm với lớp lấp (đối chiếu `translators` / `assessed_by` / `reviewers` với `source/tooling.yaml`), nên lớp lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English của lớp này. Đối chiếu thực có: Pāli root + tầng Sujato đã ghim (31/67 khoá có lời) + bản Việt canonical để đối chiếu nghĩa (không dịch vòng, không chép). Không có bản Anh độc lập nào cho 36 khoá lớp lấp, nên chấm không quá 8,0.

  **technical_integrity 9.6:** không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối. Không đặt blocker vì chưa chạy.
