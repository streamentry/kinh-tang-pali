notes: |-
  Cả ba khoá nằm trong danh sách `diṭṭhigata` đã có bản dịch ở nơi khác:

    - 1.4 (`sassato lokoti vā, asassato lokoti vā …pe…`) dùng nguyên văn bản ghim
      "the cosmos is eternal, or not eternal …" (cùng Pāli đã dịch ở sn33.2:1.4).
    - 1.7 là CÂU GIỐNG HỆT sn33.1:1.5, chỉ khác dấu kết (`…”ti.` thay vì `…”ti?`), và
      sn33.1:1.5 đã được Sujato dịch trọn. Bản lấp dùng lại nguyên văn bản dịch đó.
    - 1.5 lấy nguyên vế cuối của danh sách, thêm chủ ngữ, giữ "after death" — cùng cách
      làm như ở sn33.1:1.9, để hai bài cùng họ không tự mâu thuẫn.

  Bất định đã ghi nhận:

    - 1.7 không có tiền lệ trong CHÍNH bài này (bản ghim để trống cả danh sách), nên nó
      phụ thuộc hoàn toàn vào bản dịch ở bài khác. Đây là lý do `ambiguity_integrity` hạ
      9.3: người đọc không có cách nào trong bài này để soát lại lựa chọn dịch "the soul
      and the body are one and the same" cho `taṁ jīvaṁ taṁ sarīranti`.
    - Bản Việt của dự án dùng "mạng là thân, mạng khác thân" cho cùng hai mệnh đề, còn
      Sujato dùng "the soul and the body". Bản lấp giữ nguyên Sujato và KHÔNG sửa; khác
      biệt này đáng để người biên tập quyết, nên ghi ở đây thay vì im lặng.
    - 1.8, 1.9 và cả khối `tassuddāna` (2.0–2.6) trống ở bản ghim và dưới ngưỡng 40 ký
      tự, nên cột English của phần cuối bài vẫn trống. Không bịa chữ để nối.
    - Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của
      lớp lấp. `triangulation` bị chặn ở 8.0 vì không có bản Anh độc lập.
