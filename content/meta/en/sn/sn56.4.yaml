notes: |-
  2.3 và 2.5 là phần SuttaCentral tách riêng để lặp lại bộ ba quá khứ / vị lai / hiện
  tại ở 1.1–1.3. Sujato đã gộp cả bộ ba vào 1.1–1.3 (1.1 ““Mendicants, whatever
  gentlemen—past,” … 1.3 “or present—truly comprehend after rightly going forth from the
  lay life to homelessness, all of them truly comprehend the four noble truths.”) nên
  phần đã ghim không có chỗ nào để tra trực tiếp từng khoá.

  Bài CÓ bản Việt dự án (sn56.4), dùng để đối chiếu từng khoá:
    2.3 — VI: “Này các tỳ-kheo, các thiện nam tử nào trong quá khứ đã xuất gia, đã thông
         đạt đúng như thật …”. Tôi dịch “Mendicants, whatever gentlemen in the past,
         having rightly gone forth from the lay life to homelessness, truly comprehend …”.
         Cụm “rightly going forth from the lay life to homelessness” lấy NGUYÊN VĂN từ
         bản đã ghim ở 1.3. Khác bản đã ghim ở 1.1 ở chỗ tôi đặt dấu hiệu thời gian
         (“in the past”) TRƯỚC động từ thay vì để sau bằng gạch nối, vì ở 2.3 mệnh đề
         đứng một mình và `abhisamesuṁ` là thì quá khứ — cách của bản đã ghim chỉ đúng
         khi câu còn bị cắt.
    2.5 — Pāli có `imāni` (bốn Thánh đế NÀY) mà 1.3 của bản đã ghim không có, nên tôi
         dịch “these four noble truths”, khớp bản Việt dự án (“bốn Thánh đế này”) chứ
         không theo “the four noble truths” của 1.3.

  Thì của 2.5 là hiện tại (`abhisamenti`), 2.4 (thuộc lát khác) là tương lai
  (`abhisamessanti`), 2.3 là quá khứ — ba khoá nhất quán theo thì của Pāli.
  Bất định: cách đặt dấu hiệu thời gian là lựa chọn của tôi, không có mẫu nào ở tầng đã
  ghim cho đúng vị trí này; `ambiguity_integrity` hạ vì vậy.
