notes: |-
  **Phân loại 69 khoá (đo bằng máy trên Pāli root và tầng Sujato đã ghim): A dùng lại nguyên văn = 5 · B dựng lại = 4 · C tự dịch = 60 · D báo = 0.** A gồm cả khoá lặp nguyên văn một khoá lấp trước đó trong cùng bài; B là Pāli gần (tỉ lệ khớp từ 0,6) một khoá đã có lời, chỉ chèn phần tầng ghim nuốt mất; D là Pāli trùng nguyên văn với khoá đã ghim nhưng lời đã ghim khác nhau, hoặc lớp lấp cố ý lệch (nêu từng khoá bên dưới).

  **Tầng đã ghim cắt cụt dãy: nó dịch đến 3.2 rồi im, trừ 18.5.** 69 khoá còn lại từ 3.3 đến 18.6 đều trống, và SuttaCentral không có bản Anh nào khác cho bài này. Vì bài không còn lời nào để lấy giọng, lớp lấp mượn **thuật ngữ và khuôn câu của công thức** ở các bài tầng ghim đã dịch trọn cùng công thức (sn54.10, sn54.13 và mn118), không sao chép nguyên bài: “mindfulness of breathing”, “experiencing the whole body”, “stilling the physical process”, “meditating by observing an aspect of the body—keen, aware, and mindful, rid of covetousness and displeasure for the world”, “activated / develop / perfection through development”, “relies on seclusion, fading away, and cessation, and ripens as letting go”. Mỗi câu vẫn dịch từ Pāli của chính khoá.

  **Số đo:** 69 khoá, trong đó 58 khoá có nội dung, bài ở 9/67 = 0,134 trước lát.
  **Quyết định nhất quán trong bài:**
  · `āraddho` luôn là “activated” (một lựa chọn duy nhất, vì bài này không có động từ đã ghim để theo; tầng ghim ở sn54.13 dùng cả “initiated” lẫn “activated”).
  · `So … ajjhupekkhitā hoti` là “closely watch over” (khoá 15.1, 17.1 giống nhau từng chữ, 15.2 và 17.2 cũng vậy).
  · Hai cặp song song `sati hoti asammuṭṭhā` (9.2 / 16.3) và (9.3 / 16.4) cùng một cách dịch: “established and lucid”.
  **B (4 khoá):** 8.1 ← 3.1 (0,91), 9.1 ← 3.1 (0,61), 17.4 ← 18.5 (0,72), 18.1 ← 18.5 (0,89). Đó là các câu khung “That’s how … are developed and cultivated so as to fulfill …” và “And how are … developed and cultivated …?” mà tầng ghim đã dịch ở 3.1 và 18.5; lớp lấp đổi đối tượng cho đúng Pāli (bốn niệm xứ / bảy giác chi / minh giải thoát).
  **A (5 khoá, lặp nguyên văn một khoá lấp trước):** 5.6 và 6.6 (← 4.5 “Why is that?”), 17.1, 17.2, 17.3 (← 15.1, 15.2, 15.3).
  **C (60 khoá):** dịch từ Pāli với thuật ngữ trên.

  **Những chỗ khoá bị cụt vì `…pe…`.** Pāli cắt đoạn lặp nên nhiều khoá chỉ còn mệnh đề trần: 4.2 (“experiencing the whole body …”), 5.1–5.3, 6.1–6.2, 7.1–7.3, 16.1–16.2, 18.3. Lớp lấp giữ đúng *một* `…` ở mỗi khoá và không thêm khung “breathing in …” mà Pāli đã lược. Đọc riêng khoá nào ra mệnh đề thiếu đầu; đó là hệ quả của Pāli, giống cách tầng ghim xử lý sn54.13:6.2 (“bliss …”).
  **Quy ước `…pe….`:** 16.5 kết `gacchati …pe….` được dịch thành văn bản rồi `…`, bỏ dấu chấm sau `…` (giống các khoá lấp an6.54:6.5, sn35.101:2.14).
  **Ghi nhận bất định.** (a) `sādhukaṁ ajjhupekkhitā` ở 7.6 dùng “closely watch over it with equanimity”, sát hơn “watch closely over” của tầng ghim ở sn54.13:8.6 nhưng khác một chút; (b) 4.1 ghi hơi thở dài (vào, ra) và ngắn (vào, `rassaṁ`) rồi một `…`, đúng như Pāli, không mở rộng phần bị lược.

  **18.6 `Chaṭṭhaṁ.`** là nhãn thứ tự: “Sixth.”. Bài là sn54.16, thứ sáu của Dutiyavagga bắt đầu ở sn54.11, nên nhãn khớp số mục.

  Dấu lược: 15 khoá có `…` (3.3, 4.1, 4.2, 5.1–5.3, 6.1, 6.2, 7.1–7.3, 16.1, 16.2, 16.5, 18.3), khớp số dấu lược của Pāli (đo bằng máy). Nháy: khớp Pāli ở cả 69 khoá. Tầng ghim có một dấu `…` thừa ở 3.2 (Pāli không có) — ngoài lát, chỉ báo.

  **Khoá còn trống:** 0 trong 69 khoá `fillableSegments` (đã lấp hết; đo bằng máy: không còn khoá Pāli nào của bài thiếu cả tầng Sujato lẫn lớp lấp). **Coverage** (Pāli ≥ 40 ký tự, bỏ khối `:0`): trước 9/67 = 0.1343; sau khi `published` 67/67 = 1.0000. Độ nhạy: ngưỡng 0,8 cho phép thiếu tối đa 13 khoá có nội dung (phần nguyên của 0,2 × 67); trước lát bài thiếu 58. `content/meta/reference-gaps.yaml` **có** record của `sn/sn54.16` (substantiveSegments 67, substantiveWithoutEnglish 58, coverage 0.1343). Khi lớp lấp `published` coverage lên 1,0 nên record đó thành thừa; người điều phối sinh lại bằng `npm run reference:gaps`, lát này không sửa tay tệp đó.

  **Triangulation 7.5.** Bản Việt canonical của bài (`content/meta/sutta/sn/sn54.16.yaml`) do cùng họ công cụ làm, rà soát hoặc chấm với lớp lấp (đối chiếu `translators` / `assessed_by` / `reviewers` với `source/tooling.yaml`), nên lớp lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English của lớp này. Đối chiếu thực có: Pāli root + tầng Sujato đã ghim (12/81 khoá có lời) + bản Việt canonical để đối chiếu nghĩa (không dịch vòng, không chép). Không có bản Anh độc lập nào cho 69 khoá lớp lấp, nên chấm không quá 8,0.

  **technical_integrity 9.6:** không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối. Không đặt blocker vì chưa chạy.
