notes: |-
  Tiền lệ: 1.10 chép từ 1.3 của chính bài, đã ghim ("Seeing this, a learned noble disciple is not
  concerned with the eye of the past,") và 1.12 chép từ 1.5, đã ghim ("and they practice for
  disillusionment, dispassion, and cessation regarding the eye in the present.") — chỉ thay
  mắt→lưỡi, đúng nhánh mà 1.8 đã ghim mở đầu ("tongue …").

  Ghi rõ để người đọc không tưởng tôi lệch: lớp fill ở sn35.11:1.3/1.4 dùng thứ tự khác ("not
  concerned with past sights", "regarding present sights") vì đó là bài ngoài, nói về rūpa ngoài.
  Luật 3 bắt theo bản đã ghim của CHÍNH bài đang dịch, nên tôi theo sn35.7.

  1.11 (`anāgataṁ jivhaṁ nābhinandati;`) không thuộc lát này; theo 1.4 đã ghim nó phải là "they
  don’t look forward to enjoying the tongue in the future," để 1.10–1.12 liền mạch.

  1.12 dùng mạo từ "and" như 1.5 đã ghim; 1.9 (`ko pana vādo paccuppannāya.`) của lát khác sẽ là
  "let alone the present." theo 1.2/1.15 đã ghim.
