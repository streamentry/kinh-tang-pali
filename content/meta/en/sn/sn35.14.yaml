notes: |-
  LUẬT 1 — bảy khoá trong chín khoá này là Pāli TRÙNG NGUYÊN VĂN với bài đã ghim, và lớp lấp
  lấy y nguyên văn phong đã ghim, không dịch lại từ đầu:

  - 1.9–1.11 (sắc) đối chiếu `sn35.13:1.10–1.12` (nội xứ: mắt), bài song song đã ghim đủ. Khuôn
    dùng: “The pleasure and happiness that arise from …: this is …”,
    “That … is impermanent, suffering, and perishable: this is …”,
    “Removing and giving up desire and greed for …: this is …”. Chỉ đổi “the eye” → “form”, vì Pāli
    ở đây là `rūpānaṁ` (số nhiều) nên “the drawback/escape of forms”, khác “its” của bài nội xứ.
  - 1.16–1.18 (pháp) cùng khuôn. Chọn “ideas” vì Sujato đã dịch `dhammā` là “ideas” ngay tại
    1.7 của chính bài này (“and ideas?’ …”); dùng từ khác sẽ làm cột Anh đổi giọng giữa 1.7 và 1.16.
  - 2.1–2.2 lấy y nguyên văn `sn35.13:2.1–2.2`, chỉ đổi “interior” → “exterior”, vì Pāli là
    `bāhirānaṁ āyatanānaṁ` (đối chiếu `ajjhattikānaṁ` ở sn35.13).
  - 2.4 lấy y nguyên văn `sn35.13:2.4` và `sn14.31:4.3` — Pāli giống hệt ở cả ba bài, kể cả dấu
    `’”` lạ ở cuối. Giữ y vì sửa nó ở đây sẽ làm chính bài này lệch với hai bài kia. Hệ quả phải
    nói thẳng: Pāli khoá đó tự mang 1 dấu mở `‘` và 2 dấu đóng `’”`, nên trong cột Anh của bài
    này một `”` ấy không có dấu mở tương ứng. Đó là lỗi dấu câu có sẵn ở Pāli và ở hai bài đã ghim,
    không phải do lớp lấp; sửa được bằng cách sửa Pāli gốc cho cả ba bài, không sửa được bằng
    cách sửa riêng lớp lấp.

  Hệ quả phải nói thẳng: bản đã ghim ở 2.1–2.2 **không** dịch câu tuyên bố
  `‘anuttaraṁ sammāsambodhiṁ abhisambuddho’ti paccaññāsiṁ` thành trích dẫn riêng mà nói thẳng
  “my supreme perfect awakening”. Lớp lấp bám y văn phong đã ghim cho cùng công thức, nên người
  đọc không thấy lời tuyên bố dạng trích dẫn. Đây là lựa chọn biên tập của tầng đã ghim, không
  phải lỗi của lớp lấp; ghi vào đây để người đọc biết.

  Triangulation 7.5: scorecard Việt của `sn35.14` (`content/meta/sutta/sn/sn35.14.yaml`) cùng
  `assessed_by` “OpenCode Space Bunny Free (agent)” — cùng họ công cụ, nên bản lấp **không** phải
  lớp đọc Anh độc lập cho bài này, và không được tuyên bố đã đối chiếu Anh độc lập.

  Không có tầng Việt hiện hành cho bài này ở commit đã ghim (`vicKeys=0`), nên đối chiếu nghĩa
  chỉ có bản Việt canonical của dự án.

