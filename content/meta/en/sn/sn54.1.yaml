notes: |-
  Vế `passasissāmī` (thở ra) này đã được bản Anh đã ghim viết ở 4.5 của CHÍNH bài, và cùng khuôn đó
  lặp ở 5.2/5.3/5.4 (`virāgānupassī`, `nirodhānupassī`, `paṭinissaggānupassī`) — nên chép đúng "They
  practice like this: 'I'll breathe out observing impermanence.'" Bản Việt canonical 5.1 dùng đúng
  khuôn "‘Quán vô thường, ta sẽ thở ra’ như học tập". BẤT ĐỊNH đã ghi: bản đã ghim ở 4.5 đã viết CẢ
  HAI vế hít vào và thở ra, trong khi Pāli 4.5 chỉ có `assasissāmī` (hít vào) và sang 5.1 mới là
  `passasissāmī`. Đó là bản đã ghim đọc trước; lớp lấp không sửa được, nên vế thở ra xuất hiện hai lần
  ở 4.5 và 5.1. Hạ `vietnamese_clarity` vì đọc liền sẽ thấy lặp.
  
