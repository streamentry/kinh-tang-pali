notes: |-
  Bài này khác bảy bài kế bên ở một chỗ hình thức: lát lấp của nó TRÀI HAI phần của bài,
  `1.5` thuộc phần `1`, còn `2.1`–`2.5` thuộc phần `2`. Vì vậy câu hỏi ở `1.5` phải bám
  vào `1.3` (bản Anh đã ghim hỏi "is there a path and a practice for completely
  understanding this suffering?"), còn ba vế sau bám vào `1.4`. Cùng một khuôn năm vế ấy
  lặp nguyên vẹn ở `sn38.5` và `sn38.10`–`sn38.15`, chỉ khác danh từ.

  - `1.5` ← khuôn `1.3`, đổi `Atthi … atthi` thành `Katamo … katamā`.
  - `2.1` “This, reverend, is the noble eightfold path for completely understanding this
    suffering, that is—”. Gạch nối cuối khoá giữ nguyên, vì `2.2`
    (`sammādiṭṭhi …pe… sammāsamādhi.`) bản Anh đã ghim để trống; mở rộng là bịa.
  - `2.3`, `2.4` dùng y cụp "completely understanding this suffering" của `1.3`.
  - `2.5` `Alañca panāvuso sāriputta, appamādāyā` → "And, reverend Sāriputta, don’t be
    heedless." Dấu ngoặc kép mở ở `2.1` và khép ở `2.5`, y như Pāli.

  BẤT ĐỊNH ĐÃ PHÂN XỬ:

  1. Ở `1.5` Pāli vừa hỏi `Katamo … maggo` vừa hỏi `katamā paṭipadā`, tức hai câu hỏi
     cho hai danh từ. Tôi dịch thành một câu hỏi có hai vế ("what is the path and what is
     the practice") thay vì lặp lại "which" hai lần, vì Sujato trong `an3.71:5.3` — cùng
     khuôn Pāli — cũng rút gọn thành một câu hỏi ("Well, what is it?"). Cách rút gọn ấy
     của Sujato làm mất "maggo … paṭipadā", nên tôi giữ lại cả hai danh từ; đây là chỗ
     duy nhất lớp lấp cố ý dài hơn bản đã ghim.
  2. `pariññāyā` ở bài này không phải `pahānāyā` như `sn38.10`, nhưng bản Anh đã ghim đã
     dịch cả hai bằng "completely understanding", nên lớp lấp theo đúng từ đã ghim và không
     lấy "abandoning" chỉ để bám bản Việt ("từ bỏ" ở `sn38.10`; ở đây bản Việt là "liễu
     tri"). Đây là đánh đổi có chủ ý, và là chỗ trừ điểm của `semantic_fidelity`.
  3. `Bhaddako … bhaddikā` ("tốt … tốt hơn") dịch "good … better", không theo "a fine path,
     a fine practice" của `an3.71:5.7`, vì `bhaddikā` là dạng so sánh.

  Lớp lấp: 5 khoá `1.5`, `2.1`, `2.3`, `2.4`, `2.5` nằm ở chỗ bản Anh đã ghim để trống.
  `2.2` cũng trống nhưng là đoạn lược dài 31 ký tự nên nằm ngoài lát này, và tôi không mở
  rộng nó. `2.6` (`Catutthaṁ.`) là số đếm, không tính vào lát. Không khoá nào là blockquote
  tham chiếu: bài này chỉ có khối `:0`, và Sujato đã dịch cả `:0`.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm. Tầng đối chiếu là
  Pāli đã ghim, các khoá `1.1`–`1.4` của chính bản Anh đã ghim, và khuôn Pāli giống hệt mà
  Sujato đã dịch ở `an3.71:5.1`–`5.8`; bản Việt dự án chỉ để đối chiếu nghĩa và do agent
  khác viết.

  Sau khi bài này `published`, coverage English của nó lên 100%, nên record của nó trong
  `content/meta/reference-gaps.yaml` sẽ thành record thừa và test `a fill never leaves a
  gap record it has cured` sẽ đỏ cho tới khi chạy `npm run reference:gaps`. Việc đó nằm
  ngoài lát này.
