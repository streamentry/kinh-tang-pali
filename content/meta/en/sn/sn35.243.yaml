notes: |-
  Tiền lệ: `sn35.243:2.1` (Sujato) đã kể sẵn toàn bộ việc chuẩn bị ở ngôi thứ ba — “…they spread carpets all over, prepared seats, set up a water jar, and placed an oil lamp.” 2.2 là lời các người Sakyên nói với Đức Thế Tôn (`bhante`), nên phải sang điện 2 và dùng thứ tự động từ của Pāli: `santhāgāraṁ` → the town hall, `āsanāni paññattāni` → the seats, `udakamaṇiko patiṭṭhāpito` → the water jar, `telappadīpo āropito` → the oil lamp. `bhante` → “Sir,” theo `1.4` và `2.3` của chính bài.

  Bất định cần ghi: vì 2.1 đã nói trước, cột Anh ở 2.2 lặp lại nội dung 2.1 ở điện khác — cùng lý do như `sn35.241:2.2`, đây là dấu vết của Sujato gộp vượt ranh giới khoá chứ không phải chỗ lớp lấp lược chữ. `āropita` dịch “placed” theo `2.1` của Sujato, dù nghĩa gốc còn có thể là “được đặt vào / được thắp”.

  Khoá 9.4 (`Chaṭṭhaṁ.`) cũng fillable nhưng không thuộc lát này.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
