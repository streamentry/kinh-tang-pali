notes: |-
  5.1 (Sujato) “And what is that mirror of the teaching?” → 5.2 là CÁI ĐÁP ĐƯỢC HỎI, nên Pāli kết bằng `’?` chứ không phải `’.` như ở 4.4.

  Tiền lệ: cùng Pāli (khác đúng dấu chấm cuối) đã được Sujato dịch ở 4.4 và 6.7 của chính bài này, và ở `sn55.7:11.7`, `sn55.9:3.3`, `sn55.10:4.4` và `6.7` — chữ nghĩa giống hệt từng từ. Dùng lại nguyên văn, chỉ đổi dấu chấm cuối cho khớp Pāli. Sujato dùng "I am a stream-enterer!" (có dấu chấm than) trong cả sáu chỗ, nên giữ nguyên.

  `”ti` ở cuối Pāli được dịch thành `”` và bỏ `ti` — đúng quy ước Sujato dùng khắp các Nikāya (đã kiểm ở `sn56.11:12.2`, `snp3.7:1.6`, `ud2.6:8.4` của chính các bài này).

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
