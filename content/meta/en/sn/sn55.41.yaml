notes: |-
  The passage the pinned English edition left blank.

  Khuôn dùng lại, KHÔNG phải lựa chọn của tôi: 17 tệp fill đã có trong kho (sn55.4/7/11/14/15/16/17/22/28/30/34/36/44/45/46/47/51) dịch nguyên văn `itipi so bhagavā …pe… satthā devamanussānaṁ buddho bhagavāti.` thành “That Blessed One is … teacher of gods and humans, awakened, blessed.” Sujato KHÔNG dịch vế này ở bất kỳ bài sn nào (0 kết quả khi quét “That Blessed One is … teacher of theos”), nên đây là khuôn chính thức của lớp lấp.

  1.4 dùng khuôn 17 tệp. 1.5 và 3.2 dùng lại y nguyên câu bản đã ghim đã dịch ở chính
  bài này ở 4.2 (“this is the extent of their overflowing merit, overflowing goodness
  that nurtures happiness.”) và ở 3.3 (“These are the four kinds…”), cùng khuôn đã dùng
  ở sn55.31:1.6.

  Lưu ý: Pāli ở 1.5/3.2 có DẤU PHẨY (`puññābhisando, kusalābhisando, sukhassāhāro`)
  trong khi bản đã ghim ở 1.1/3.3 của cùng bài thì không. Dấu phẩy Pāli là dấu ngữ pháp
  đánh dấu ba thành phần song song, không phải dấu câu Anh, nên bản Anh chỉ có một dấu
  phẩy như bản đã ghim đã dùng. Đây là chỗ duy nhất tôi cố ý giữ khuôn của bản đã ghim
  thay vì bám dấu câu Pāli.

  Bài không có bản Việt dự án. `triangulation` 8.0 theo đặc thù của lớp.
