  BẤT ĐỊNH đã ghi: vế sau dấu lược ở 1.1 và 1.4 mở đầu bằng “reborn in …” / “… reborn.” với chủ ngữ
  do `…` đảm nhiệm, giống hệt cách lớp Việt của dự án đã làm ở sn37.9:1.1 và 1.4. Hạ `grammar_logic`
  và `vietnamese_clarity` vì lựa chọn này.

  Ngoài phạm vi lát: 1.2 và 1.5 trống ở mọi tầng, không thuộc b6.json.
