notes: |-
  Bài này là bài DUY NHẤT trong tám bài mà động từ không phải "completely understanding".
  Pāli ở đây là `sacchikiriyāyā` (chứng ngắm / thành tựu trực tiếp), và bản Anh đã ghim đã
  dịch vế đó ở `1.4` thành "is there a path and a practice for realizing this solace?". Vì
  vậy lớp lấp dùng "realizing" cho cả năm khoá, KHÔNG dàn năm câu về "completely
  understanding" cho khớp với bảy bài kế bên: khớp hình thức mà làm lệch nghĩa thì bài
  kinh tự mâu thuẫn. Bản Việt của bài này cũng tách hai nghĩa này ("cho chứng ngắm" ở
  đây, "liễu tri" ở `sn38.13`/`sn38.14`).

  - `1.6` ← khuôn của `1.4`, đổi `Atthi … atthi` thành `Katamo … katamā`.
  - `1.7` "“This, reverend, is the noble eightfold path for realizing this solace, that is—".
    Gạch nối cuối khoá giữ nguyên, vì `1.8` (`sammādiṭṭhi …pe… sammāsamādhi.`) bản Anh đã
    ghim để trống; mở rộng là bịa.
  - `1.9`, `1.10` dùng y cụm "realizing this solace" của `1.4`.
  - `1.11` `Alañca panāvuso sāriputta, appamādāyā` → "And, reverend Sāriputta, don’t be
    heedless." Dấu ngoặc kép mở ở `1.7` và khép ở `1.11`, y như Pāli.

  BẤT ĐỊNH ĐÃ PHÂN XỬ:

  1. Ở `1.6` Pāli vừa hỏi `Katamo … maggo` vừa hỏi `katamā paṭipadā`. Tôi dịch thành
     một câu hỏi hai vế ("what is the path and what is the practice") thay vì lặp "which"
     hai lần; Sujato ở `an3.71:5.3` — cùng khuôn Pāli — rút gọn còn "Well, what is it?",
     nhưng cách đó làm mất "maggo … paṭipadā", nên tôi giữ lại cả hai danh từ. Đây là chỗ
     duy nhất lớp lấp cố ý dài hơn bản đã ghim.
  2. `Bhaddako … bhaddikā` ("tốt … tốt hơn") dịch "good … better", không theo "a fine path,
     a fine practice" của `an3.71:5.7`, vì `bhaddikā` là dạng so sánh.
  3. `etassa assāsassa` là số ít ("sự yên ổn ấy"), nên dùng "this solace" chứ không phải
     "these solaces"; cũng bám đúng từ đã ghim ở `1.4`.

  Lớp lấp: 5 khoá `1.6`, `1.7`, `1.9`, `1.10`, `1.11` nằm ở chỗ bản Anh đã ghim để trống.
  `1.8` cũng trống nhưng là đoạn lược dài 31 ký tự nên nằm ngoài lát này, và tôi không mở
  rộng nó. `1.12` (`Pañcamaṁ.`) là số đếm, không tính vào lát. Không khoá nào là blockquote
  tham chiếu: bài này chỉ có khối `:0`, và Sujato đã dịch cả `:0`.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm. Tầng đối chiếu là
  Pāli đã ghim, các khoá `1.1`–`1.5` của chính bản Anh đã ghim, và khuôn Pāli giống hệt mà
  Sujato đã dịch ở `an3.71:5.1`–`5.8`; bản Việt dự án chỉ để đối chiếu nghĩa và do agent
  khác viết.

  Sau khi bài này `published`, coverage English của nó lên 100%, nên record của nó trong
  `content/meta/reference-gaps.yaml` sẽ thành record thừa và test `a fill never leaves a
  gap record it has cured` sẽ đỏ cho tới khi chạy `npm run reference:gaps`. Việc đó nằm
  ngoài lát này.
