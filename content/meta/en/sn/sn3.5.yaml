notes: |-
  Cùng cấu trúc với `sn3.4`: §2 là Đức Thế Tôn dẫn lại lời vua (`2.1`: “And he
  repeated the king’s statement, adding:”), nên mọi khoá lấp đều phải dùng lại cách dịch bản đã
  ghim đã dùng ở §1, không dịch lại từ đầu.

    - `2.2` ← `1.6` + `mahārāja`. Chênh một điểm: Pāli `2.2` mang `…pe…`, `1.6` không có.
      Tôi giữ dấu lược vì đây là luật riêng của tầng lấp.
    - `2.5` ← `1.11`: “Because such protection is exterior, not interior.”
    - `2.7` ← `1.13` + `mahārāja`
    - `2.9` ← `1.15`, Pāli Y HỆT, dùng lại nguyên văn: “Even if they’re not protected by a
      company of elephants, cavalry, chariots, or infantry,”
    - `2.12` ← `1.18`: “Because such protection is interior, not exterior.”

  Danh xưng “Great King” và vị trí đặt cũng theo `sn3.4`, dựa trên `an5.49:3.2` và `an10.30:1.9`.

  Vì sao `2.9` không cần chèn danh xưng: Pāli `2.9` không có `mahārāja`, và Pāli nó Y HỆT `1.15`
  — cùng `Kiñcāpi te neva hatthikāyo rakkheyya, na assakāyo rakkheyya, na rathakāyo rakkheyya, na
  pattikāyo rakkheyya;`. Thêm danh xưng vào đây là bịa thêm.

  Lớp lấp: 5 khoá nằm ở chỗ bản Anh đã ghim để trống; `2.3`, `2.4`, `2.6`, `2.8`, `2.10`,
  `2.11`, `2.13`, `2.14` cũng trống nhưng ngoài lát này. Triangulation bị chặn ở 8.0.
