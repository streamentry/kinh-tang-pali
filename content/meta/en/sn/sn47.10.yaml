notes: >-
  The shape of this sutta is the one `sn11.24` warned about: `4.1`–`4.6` are not new teaching, they are
  Venerable Ānanda telling the Buddha what the nuns said to him, in the first person, and the pinned
  edition leaves all six segments empty. `1.1`–`3.2` carry the same material in the third person and are
  fully translated, so reading `4.x` in isolation invites a fresh translation that then contradicts `1.x`
  word for word. Every filled segment therefore reuses the pinned rendering, changing only the person.

  - `4.1` = `1.1` in Ānanda's voice: "This morning, sir, I robed up and, taking my bowl and robe, went to
    the nuns’ quarters, and sat down on the seat spread out." `nivāsetvā` is the same "robed up" the pinned
    edition uses at `1.1`, and the order of the two objects (`pattacīvaramādāya`) is kept as "my bowl and
    robe" rather than reversed.
  - `4.2` = `1.2` in the same voice. The pinned edition compresses the arrival and the seating into one
    sentence; the Pāli of `4.2` has two, so "on arriving" and "Once seated to one side" are kept apart
    rather than merged, which is also what keeps `4.4` intelligible as a separate step.
  - `4.3` is verbatim the Pāli of `2.1` and takes its wording exactly: "several nuns meditate with their
    minds firmly established in the four kinds of mindfulness meditation. They have realized a higher
    distinction than they had before." `suppaṭṭhitacittā` is "firmly established", not "concentrated";
    the pinned reading is kept.
  - `4.5` is verbatim the Pāli of `2.2`: "That’s how it is, sisters! That’s how it is, sisters!" — which
    is the pinned wording, exclamation marks included, and not a fresh "Yes, sisters."
  - `4.6` is `2.3` and `2.4` combined into one segment, so the pinned "can expect to realize a higher
    distinction than they had before" is carried across whole, and the segment keeps the closing quotation
    mark its Pāli has in `’”ti.`.

  Two decisions worth recording. First, the Pāli of `4.3` and `4.5` opens with a single quotation mark,
  because Ānanda is quoting the nuns inside his own speech to the Buddha; the filled segments keep those
  single marks and close the outer double at `4.6`. Second, `4.4` (`Evaṁ vuttāhaṁ … etadavocaṁ`) has no
  rendering anywhere in the corpus to reuse — the same clause appears ten times in other texts and the
  pinned edition is empty at every one of them. It is read here as "Having been spoken to this way, sir,
  those nuns said this:", which keeps `vuttāhaṁ` as passive (Ānanda was addressed) rather than turning it
  into "they spoke" and losing who did the speaking.

  Triangulation is capped at 8.0: Sujato translates none of these six segments, so this is not an
  independent English reading of its own.