notes: >-
  A sutta in two halves that are negatives of each other. Half one (1.1–1.19): `anabhijānaṁ
  aparijānaṁ avirājayaṁ appajahaṁ abhabbo` — without knowing, without dispassion, you can't end
  suffering. Half two (2.1–2.19): `abhijānaṁ parijānaṁ virājayaṁ pajahaṁ bhabbo` — with them, you
  can. Each half runs the same list of twelve members. None of the six segments filled here is a
  verbatim repeat, so all six are built from templates the pinned edition states in full elsewhere in
  the same text.

  Four templates, none of them invented. From 1.3, 1.4, 1.14 and 1.18: "Without directly knowing and
  completely understanding X, without dispassion for it and giving it up, you can’t end suffering."
  From 2.1, 2.2, 2.3, 2.14 and 2.19: "By directly knowing and completely understanding X, having
  dispassion for it and giving it up, you can end suffering." From 1.7 and 1.18 and from 2.18, the
  feeling clause, which the fill reproduces with the sense organ swapped and the half's polarity
  swapped with it.

  The nouns are Sujato's, fixed by his own fragments at 1.4–1.6 and 2.15–2.17: "sights", "eye
  consciousness", "eye contact", "tongue contact". Rendering `rūpe` as "form" or `cakkhuviññāṇaṁ` as
  "eye-consciousness" would have given one sutta two English vocabularies for the twelve aggregates.

  Note that the feeling clause keeps Sujato's order "painful, pleasant, or neutral" even though the
  Pāli enumerates `sukhaṁ vā dukkhaṁ vā adukkhamasukhaṁ vā`, pleasant first. That is his rendering of
  a clause he already translated three times in this text, and matching him matters more than matching
  the Pāli's order; the three senses conveyed are the same either way.

  The ellipsis is kept where the Pāli has it: 2.7 ends `…pe…` and keeps `…`. 1.12 and 2.12 end on a
  plain full stop and take none. The two halves are mirrors, so every member filled here is the
  counterpart of a member Sujato translated on the other side — 1.12 against 1.7 and 1.18, 2.4–2.6
  against 1.4–1.6, 2.7 against 2.18, 2.12 against nothing — and the polarity is carried on every line
  so that no member of half two can be mistaken for half one.

  Triangulation is capped at 8.0: Sujato leaves all six of these passages blank.