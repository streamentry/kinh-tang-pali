notes: |-
  **Bốn nhóm khoá (đo bằng so byte trên Pāli, không suy đoán).** Lần đầu chỉ đối chiếu với
  tầng Anh đã ghim: **A 0 · B 0 · C 9 · D 0** — không khoá nào trùng Pāli với một khoá đã
  có lời *trong tầng ghim*, vì chính 9 khoá này Sujato để trống. Lần hai đếm trong chính bản
  lấp này và với các bản lấp `published` của cùng phẩm `sn33`: **A 2 · B 2 · C 5 · D 0**.

    - **A = 2** — `1.8` và `1.11` trùng **nguyên văn** `1.4` (`sassato lokoti vā, asassato
      lokoti vā …pe…`; đo được 3 khoá trùng byte trong bài). Cả ba dùng **nguyên văn**
      "the cosmos is eternal, or not eternal …", đúng như 5 khoá đã `published` ở
      `sn33.1`, `sn33.2` (hai khoá), `sn33.6-10`, `sn33.55`.
    - **B = 2** — `1.5` và `1.12` chỉ khác `1.9` ở dấu kết: Pāli `…maraṇāti vāti.`
      (`1.9`), `…maraṇāti vā”ti?` (`1.5`), `…maraṇāti vā”ti.` (`1.12`). Bản lấp dựng cả ba
      từ cùng một vế, **tỉ lệ khớp 100%** ngoài dấu kết: đo được 48 ký tự Pāli giống nhau
      (`neva hoti na na hoti tathāgato paraṁ maraṇāti vā`; ba khoá dài 51·52·52 ký tự),
      khác duy nhất là `?`/`.` cuối. Phần tầng đã ghim nuốt mất là **dấu ngoặc kép** — đếm
      ngoặc từng khoá: `1.9` có 0/0 nên bản lấp không có ngoặc nào (ngoặc của câu nói đang
      mở ở `1.6` chưa đóng); `1.5` và `1.12` có 0/1 nên bản lấp kết `.”?` và `.”`
      (một ngoặc đóng, không phải hai — khác Sn 24 vốn kết `’”ti`). Hình thức
      "or a realized one neither still exists nor no longer exists after death" chọn theo
      **đa số đo được**: 2 khoá trùng Pāli (`sn33.1:1.9`, `sn33.55:1.5`) dùng thứ tự này,
      1 khoá (`sn33.2:1.9`) đảo thành "after death, a realized one …".
    - **C = 5** — `1.4` (bản đầu của bộ ba trùng), `1.9`, `1.7`, `1.10`, `1.13`. Chỉ `1.7`
      và `1.10` là dịch thật từ Pāli không có lời nào ở tầng; `1.4` và `1.9` có lời ở
      bài anh em nên dựng lại; `1.13` (`Pañcamaṁ.`) là số thứ tự, tiền lệ trong lớp lấp là
      `Dasamaṁ.` → "Tenth." và `Chaṭṭhaṁ.` → "Sixth." ⇒ "Fifth."

  **Số khoá đã ghi: 9/9. Còn trống: 0.** Mười sáu khoá Pāli của bài, bảy khoá không thuộc
  lớp lấp vì tầng đã ghim có chữ (`0.1`–`0.3`, `1.1`, `1.2`, `1.3`, `1.6`). Không có khoá
  nào bỏ sót vì lý do "dưới ngưỡng 40 ký tự" — khoá duy nhất dưới ngưỡng là `1.13` và nó
  **đã** được lấp; nó không vào coverage nên coverage đạt 1,0 với 8 khoá lấp, không phải 9.

  **Coverage đo trước/sau.** Mẫu số = Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = **11**.
  Trước: `english-sujato` có chữ ở `1.2`, `1.3`, `1.6` ⇒ 3/11 = **0,2727**, tám khoá không
  có lời Anh. Sau khi lớp lấp `published`: 11/11 = **1,0000**, `substantiveWithoutEnglish`
  của bài = 0. **Độ nhạy ngưỡng 0,8**: trước đó phải lấp thêm **6** khoá mới qua ngưỡng
  (9/11 = 0,818). Sau này biên độ là **2 khoá**: mất 2 khoá lấp thì còn 9/11 = 0,818 vẫn qua,
  mất 3 khoá thì 8/11 = 0,727 rớt dưới ngưỡng.

  **Cố ý lệch tầng Anh đã ghim, và lý do.**
    - `1.7` (`evamimāni anekavihitāni diṭṭhigatāni loke uppajjanti—`): Sujato dịch cùng Pāli này
      ở `sn33.1:1.7`, `sn33.2:1.7`, `sn33.55:1.3` thành "that these various misconceptions arise
      in the world." Bản lấp bỏ `that` và viết "these various misconceptions arise in the
      world—" vì **chính bản ghim của bài này đóng ngoặc quá sớm ở `1.6`**: đếm ngoặc cho
      thấy `1.3` và `1.6` có 1/1 (Pāli: `1.3` có 1/0, `1.6` có 1/0) và Sujato **tự thêm một
      `…`** ở cả hai khoá mà Pāli không có. Đã đóng ngoặc thì không còn mệnh đề bất ngữ để
      `that` bám vào; giữ nó sẽ sinh `…” that these various …`. `evamimāni` là đại từ, không
      phải từ quan hệ, nên không mất nghĩa.
    - `1.10` (`Ayaṁ kho, vaccha, hetu, ayaṁ paccayo, yānimāni … uppajjanti—`): Sujato dịch
      cùng Pāli này ở `sn33.1:1.10`, `sn33.2:1.10`, `sn33.55:1.6` thành "This is the cause,
      this is the reason.”" — bỏ mất `vaccha`, bỏ mất vế `yānimāni … uppajjanti`, và **đóng
      ngoặc ở khoá không có ngoặc**. Bản lấp giữ đủ ba: "This, Vaccha, is the cause, this is
      the reason why these various misconceptions arise in the world—". Nếu đóng ngoặc ở
      đây thì `1.12` sẽ thành ngoặc đóng lơ lửng. `vaccha` cũng được giữ đúng như bản ghim
      dùng ở `1.6` ("Vaccha, it is because of not knowing consciousness …").
    - Dấu lược: `1.4`/`1.8`/`1.11` có `…pe…` (Pāli đếm được 2 ký tự `…`, tức **một** đơn vị
      lược) ⇒ bản lấp ghi **đúng một** `…`. `1.5`, `1.7`, `1.9`, `1.10`, `1.12`, `1.13` Pāli
      không có `…` ⇒ bản lấp không thêm. Dấu gạch dài cuối `1.7` và `1.10` được giữ theo Pāli.

  **Bài anh em cùng Pāli — đo được, để lát sau dùng lại chứ không dịch lại.** Trong cụm
  `sn33.1`–`sn33.5`, tám trong chín khoá lấp trùng **nguyên văn** ở ít nhất một bài nữa:
  `1.4`/`1.5`/`1.7`/`1.8`/`1.9`/`1.10`/`1.11`/`1.12` (đếm 4–5 bài mỗi khoá); riêng `1.13`
  (`Pañcamaṁ.`) là duy nhất. Đo lại tại lúc ghi `notes` này: lớp lấp `sn33.4` (cùng Pāli ở
  tám khoá kia) **trùng khớp từng ký tự cả tám khoá**; chỉ `1.13` khác, và khác đúng như nó
  phải khác (`Catutthaṁ.` → "Fourth." so với `Pañcamaṁ.` → "Fifth."). `sn33.3` chưa có lớp
  lấp; khi lấp phải dùng lại nguyên văn các câu ở đây. ⚠️ `sn33.2:1.9` và `sn33.2:1.12`
  dùng trật tự khác ("after death, a realized one …") cho **cùng Pāli**, nên cả phẩm hiện
  còn **một** chỗ lệch tiếng Anh đã `published`; **không sửa** (ngoài lát này), chỉ báo ở đây.

  **Hệ quả với `content/meta/reference-gaps.yaml`.** Bài này **có** record
