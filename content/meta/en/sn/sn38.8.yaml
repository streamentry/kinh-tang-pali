notes: |-
  Khung 1.8–1.13 trùng nguyên văn sn38.1:2.7–2.12 (xem notes của sn38.6).

  MỘT CHỖ LỆCH CÓ CHỦ Ý, đáng ghi rõ nhất trong lát này:

  - `etesaṁ āsavānaṁ pahānāyā` nghĩa là "để TỪ BỎ ba lậu". Bản đã ghim dịch nó ở 1.6 thành "for
    completely understanding these three defilements" — đó là nghĩa của `pariññāyā`, không phải của
    `pahānāyā`. Chính Sujato ở sn38.9:1.5 dịch cùng cách cấu này là "for giving up that ignorance", và
    bản Việt dự án ở 1.8/1.9/1.11/1.12 cũng "để từ bỏ ba lậu". Lớp lấp theo Pāli: "for giving up these
    three defilements". Hệ quả phải nói thẳng: cột English của bài sẽ có 1.6 (Sujato) là "completely
    understanding" còn 1.8/1.9/1.11/1.12 (lớp lấp) là "giving up" cho cùng một cụm. Đó là đường may
    có thật; giữ lại lỗi của bản ghim thì sai Pāli.

  Bất định đã ghi nhận:

  - `bhaddako … bhaddikā` bị làm phẳng thành "fine/fine" như sn38.6, theo tiền lệ sn38.1–38.5.
  - 1.8 (`sammādiṭṭhi …pe… sammāsamādhi.`) trống và không thuộc lát này, nên 1.9 dừng ở "that is—".
  - `triangulation` 8.0: người viết lớp lấp cũng là người chấm.
