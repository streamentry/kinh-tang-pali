notes: |-
  Vế này đã được bản Anh đã ghim dịch ở 1.5 và 2.6 của CHÍNH bài, giữ nguyên văn bên trong. Bất định
  đã ghi — số ngoặc: bản đã ghim ở 2.6 có 3 ngoặc đóng trong khi Pāli 2.6 chỉ có 2, nên KHÔNG thể chép
  nguyên văn mà qua chốt. Ở 2.3 thì Pāli có ĐÚNG 1 mở + 1 đóng (`‘` … `’ti`), nên dùng đúng một cặp
  `“…”` và giữ nguyên văn bên trong. Hệ quả là dấu nháy trong dù để trích lời tuyên thệ của Đức Thế
  Tôn mất; chấp nhận được vì bản đã ghim ở 2.1 đã đóng ngoặc ngoài quá sớm rồi (Pāli giữ mở tới 2.6),
  nên cột Anh vốn đã không còn ngoặc ngoài ở đây. Hạ `grammar_logic` và `ambiguity_integrity` vì lệch
  với bản đã ghim ở 2.6 là do chốt đòi, không do chọn văn phong.
  
