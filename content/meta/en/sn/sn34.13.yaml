notes: |-
  1.5, 1.6 và 1.7 là ba vị còn lại của danh sách bốn người tu định mà 1.4 đã mở
  ra. Chúng dùng CÙNG một khuôn Pāli: `Idha pana, bhikkhave, ekacco jhāyī …kusalo hoti,
  na …`.

  Tiền lệ đã đếm, và đủ để chốt cả ba khoá:

    - Cùng khuôn này đã được Sujato dịch TRỌN ở ba bài khác: sn34.1:1.5–1.7, sn34.2:1.5–1.7
      và sn34.55:1.5–1.7. Cả ba đều bắt đầu thẳng bằng "One meditator", tức là đều BỎ
      `Idha pana, bhikkhave,`. Bản lấp theo đúng khuôn đó. Hệ quả: xưng hô "mendicants" không
      lặp lại ở 1.5–1.7, nhưng nó vẫn có ở 1.2 và 1.4 nên không mất khỏi bài.
    - `neva … na ca` → "skilled neither in … nor in …" (sn34.1:1.6, sn34.2:1.6, sn34.55:1.6).
    - `… ca hoti, … ca` → "skilled both in … and in …" (sn34.1:1.7, sn34.2:1.7, sn34.55:1.7).
    - Ở 1.5 khuôn là "skilled in <mệnh đề> but not in entering it": mệnh đề đứng trước luôn
      ghi rõ "immersion", mệnh đề sau dùng đại từ — đúng như sn34.55:1.5.
    - Mệnh đề thứ hai của bài này là `kallita`, và từ 1.4 của chính bài đã có bản dịch
      ("positivity for immersion"). Bản lấp dùng lại nguyên văn từ 1.4.

  Bất định đã ghi nhận:

    - Bản ghim ở 1.4 kết bằng `…”` dù Pāli ở 1.4 không có ngoặc nào; cột English vì vậy
      hiện một `”` treo không cân ở 1.4. Bản lấp ở 1.5–1.7 không có ngoặc vì Pāli không có.
    - 1.8 (`Tatra …pe…`), 1.9 (`pavaro cā”ti.`) và 1.10 (số thứ tự) trống ở bản ghim và
      dưới ngưỡng 40 ký tự, nên cột English của bài vẫn dừng ở 1.7. Không bịa chữ để nối.
    - Bản Việt của dự án có ở cả bảy bài này và dùng "thành thạo trong việc chứng trạng /
      thoát / làm đẹp / chọn đối tượng / phạm vi / dẫn dắt / cẩn thận / bền tâm"; ý nghĩa khớp
      với bản lấp ở mọi mệnh đề, kể cả khi cách dùng từ khác (ví dụ Sujato dịch `kallita`
      là "positivity", Việt dịch là "làm đẹp"). Bản lấp theo Sujato vì bản 1.4 của chính bài
      đã dùng từ đó, và ghi khác biệt ở đây thay vì im lặng.
    - Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp
      lấp: bản lấp viết tiếng Anh, nên tiêu chí Hán–Việt không có nội dung để chấm.
      `triangulation` bị chặn ở 8.0 vì không có bản Anh độc lập để đối chiếu.
