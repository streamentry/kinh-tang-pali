notes: >-
  The sutta's whole shape is repetition: Māra's daughters propose a disguise, the Buddha does not
  look up, they try the next disguise, repeat. Sujato translates the first three rounds and then
  gives only the noun of each disguise after that — 'women who have given birth twice … ' at 8.4,
  'middle-aged women … ' at 8.9, 'old women … ' at 9.4 — so the narrative loses its engine. Six of the
  segments here are what that elision ate, and four of the six are one half of a round the pinned
  edition states in full elsewhere.

  7.6 is the same Pāli as 5.6 and 6.6, both translated by the pinned edition, and takes their wording
  exactly: "But the Buddha still ignored them, since he was freed with the supreme ending of
  attachments." It keeps "still" rather than the "But the Buddha ignored them" of 4.3, because 4.3 is
  the first attempt and 7.6 is the fourth — matching 5.6 and 6.6 is what stops the sutta implying the
  Buddha relents and then changes his mind.

  7.2 and 8.2 are the proposals for the third and fourth disguises, built on 5.3 and 6.3, which the
  pinned edition states in full: "Why don't we each manifest in the form of a hundred young maidens?"
  and "…a hundred women who have never given birth?" The disguise nouns come from Sujato's own
  fragments at 7.4 and 8.4 — "a hundred women who have given birth once", "…given birth twice" — so
  the four rounds are one series rather than four phrasings. `sakiṁ` is rendered "each", as at 5.3.

  8.5 is the reason clause alone. Sujato merges it with the main clause at 9.5 ("But the Buddha still
  ignored them, since…"), but 9.5's Pāli omits `yathā taṁ` and so needs him supplied; 8.5's does not,
  and the segment simply is the reason. The fill therefore gives only "since he was freed with the
  supreme ending of attachments", in lower case to continue the ellipsis Sujato leaves at 8.4, and
  does not add back the clause that is not in this segment.

  8.7 and 11.3 are fragments by the same token, and both close a quotation in the Pāli (`”ti.`), so
  both take a closing quote where 7.2 and 8.2 do not — their Pāli ends on a bare full stop. 11.3 reuses
  Sujato's verb triad from 11.2 — "dry up, wither away, and shrivel up" — in the conditional `-
  eyya` that Sujato also uses there. `evameva` is "in just the same way", matching the `seyyathā vā
  pana` simile of the green reed that 11.2 renders.

  Note that Sujato's fragments at 8.4, 8.9 and 9.4 are bare noun phrases with no verb, because he has
  elided the surrounding frame. 8.7 keeps "in the form of" from 5.3 and 6.3, since `abhinimmineyyāmā`
  governs exactly that idiom, but likewise adds no verb of its own.

  Triangulation is capped at 8.0: Sujato translates none of these six passages.