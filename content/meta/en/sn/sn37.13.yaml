notes: |-
  Hai khoá có Pāli GIỐNG HỆT sn37.10 và sn37.11, nên dùng lại y hệt bản dịch đã chốt.

  1.1: Pāli GIỐNG HỆT sn37.14:1.1, đã ghim thành "“Anuruddha, when ladies have five qualities,
  when their body breaks up, after death, they are reborn in a place of loss, a bad place, the
  underworld, hell." — Sujato đã MỞ RỘNG `…pe…`. Luật 2 cấm mở rộng, nên tôi giữ một `…` tại chỗ
  lược, chỉ dịch phần còn lại; `nirayaṁ` → "hell" (94 cặp tiền lệ, ví dụ dn34:2.1.124 `nirayaṁ
  upapanno hoti` → "reborn in hell").

  1.4: `…pe… nirayaṁ upapajjatī”ti.` — cùng cách, thêm `”` đóng theo Pāli. Hình mẫu khi không
  lược: sn37.5:2.4 và sn37.14:1.4, cả hai đã ghim.

  Hạ `semantic_fidelity` / `grammar_logic` 9.3: câu có dấu lược ở giữa, đọc hơi cụt vì chủ ngữ và
  "khi thân tan rãi, sau khi chết" nằm trong `…pe…`. Không bịa phần bị lược.
