notes: |-
  2.3 lặp lại 1.2 của chính bài nhưng ở thì hiện tại và ngôi thứ hai số nhiều
     (`idha, bhante` = các tỳ-kheo đang báo cáo), nên "here a grand sacrifice has been set
     up … have been led" chứ không phải "Now at that time … had been set up … had been
     led". Giữ nguyên bộ danh từ bản đã ghim ở 1.2: "Bulls, bullocks, heifers, goats and
     rams—five hundred of each—… to the pillar"; `an7.47:1.2` (đã ghim) xác nhận đúng danh
     sách con vật này, chỉ khác "post" thay "pillar" — theo bản đã ghim CỦA CHÍNH bài này.
  
  Bất định đã ghi ở 2.4: Pāli có `tepi` (= "họ thì cũng") nhưng bản đã ghim ở 1.3 đã lược
     mất, nếu giữ nguyên thì 1.3 và 2.4 dạy hai điều khác nhau về cùng một tình huống. Ở đây
     dịch lại "they too" và chấp nhận khác một chữ với 1.3; 1.3 không sửa được vì đó là
     bản đã ghim. Bản Việt dự án cũng bỏ `tepi` ở cả 1.3 và 2.4.
