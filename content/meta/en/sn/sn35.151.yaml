notes: |-
  Năm khoá lấp là hai cặp của chuỗi về lưỡi. Bài này lặp nguyên văn sáu chuỗi, và mọi vế
  trong lát này đều có bản ghim ở CHÍNH bài.

  Tiền lệ đã đếm:

  - 2.2 = 1.6 và 3.2 đã ghim: "Those qualities reside within. Since they have bad
  unskillful qualities residing within,"
  - 2.3 = 1.7 và 3.3 đã ghim: "they’re said to have a resident pupil."
  - 2.4 = 1.8 + 1.9 đã ghim, ghép lại: "Those qualities master them. Since they’re
  mastered by bad unskillful qualities," + "they’re said to have a teaching master."
  - 5.2 = 4.3 và 6.2 đã ghim: "Those qualities don’t reside within. Since they don’t have
  bad unskillful qualities residing within,"
  - 5.4 = 4.5 + 4.6 đã ghim (6.4 và 6.5 cũng vậy), ghép lại.

  Bất định đã ghi nhận:

  - 2.4 và 5.4 kết bằng `…pe….`; bản ghim 1.9 và 4.6 BỎ dấu lược, nhưng chốt bắt số dấu
  lược theo từng khoá, nên giữ đúng một `…` theo khuôn sn34.28-34:1.5. Không mở rộng.
  - `sn35.151:2.3` KHÔNG nằm trong lát được giao (`e0.json` liệt kê 2.2, 2.4, 5.2, 5.4) và
  không lát nào khác trong đợt này nhận nó (đã đối chiếu `e1.json`, `e2.json`, `e3.json`).
  Vì 2.2 kết bằng dấu phẩy và 2.4 mở câu mới, bỏ 2.3 sẽ để lại câu treo, nên đã điền
  bằng nguyên văn của 1.7. Đây là quyết định vượt phạm vi lát, ghi lại để người điều phối
  quyết định có giữ hay không.
  - 5.3 (`Tasmā anantevāsikoti vuccati.`) không thuộc lát này và đang trống, nên đoạn 5.2
  → 5.4 đang thiếu một vế. Khi lát khác điền 5.3, dùng nguyên văn của 4.4: "they’re said
  to not have a resident pupil."
  - `triangulation` 8.0; `han_viet_balance` là giá trị mặc định của lớp lấp.
