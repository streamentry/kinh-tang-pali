notes: |-
  1.6 trùng NGUYÊN VĂN 1.2 và 1.9 (cùng bài, đã ghim); 2.6 trùng NGUYÊN VĂN 2.2 (đã
     ghim). Lấy y nguyên bộ từ, chỉ đặt lại cặp `‘…’` mà Pāli có quanh `aparimutto /
     parimutto` — bản đã ghim đã lược mất, nhưng luật 4 bắt ngoặc khớp từng khoá.
  
  GHI NHẬN LỖI CỦA BẢN ĐÃ GHIM, không sao chép: 2.9 có Pāli giống hệt 1.6
     (`Yo dukkhaṁ nābhinandati, ‘aparimutto so dukkhasmā’ti vadāmi.`) nhưng lại dịch
     "you're free from suffering", tức lấy `nā` (không) cho mất. 2.6 ở đây dịch theo
     `parimutto` của 2.2 ("you're free from suffering"), đúng nghĩa, và không sửa được
     2.9 vì đó là bản đã ghim.
