notes: |-
  3.3 VÀ 3.7 (cùng bài, đều có CHỮ Sujato) dịch y hệt: "This is where these fetters, shackles, and
  attachments arise." — 3.5 là vế lặp lại giữa danh sách (3.4 đã gộp tai–mũi–lưỡi–thân vào một dòng bằng
  dấu lược), nên dùng y hệt (luật 3). Giữ đúng ba danh từ `saṁyojana vinibandha ajjhosāna`.

  `…pe…` phải còn đúng MỘT đơn vị dấu lược vì Pāli có nó; bản đã ghim ở 3.3 đã lược mất, nhưng đó là
  giới hạn của bản đã ghim, không phải quyền của lớp lấp bỏ dấu lược.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
