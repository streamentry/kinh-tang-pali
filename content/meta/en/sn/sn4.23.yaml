notes: |-
  1.7 chỉ khác 1.5 đã ghim ở `Atha kho` → `Dutiyampi kho`, nên lấy lại đúng câu 1.5
    ("But then he fell away from that temporary freedom of heart.").

    Điểm yếu thật của lát, ghi ra đây: ở 1.9 / 1.11 / 1.13, `…pe…` nuốt mất chủ ngữ vật của
    `parihāyi` (`sāmayikāya cetovimuttiyā`), mà lớp lấp không được mở rộng, nên dấu `…` buộc phải
    đứng lại đúng chỗ lỗ hổng và câu tiếng Anh bị cụt. Đã đếm 141 khoá có `…pe…` trong 481 tệp
    fill sẵn có: kho để dấu lược đứng đúng chỗ và chấp nhận câu cụt (sn22.133:1.2 "Then in the
    late afternoon Venerable Sāriputta …"; sn24.19:3.15 "Winds don’t blow … stand firm like a
    pillar"). Bản đã ghim của chính bài này cũng vậy: 1.10 "fourth …", 1.12 "fifth …".

    1.13 khác 1.9/1.11 ở chỗ `…pe…` nằm TRƯỚC `vimuttiyā`, nên nó nuốt cả tên Godhika; do đó
    1.13 dịch `āyasmā` thành "Venerable" rồi để `…` đứng sau, cho "But for a fifth time,
    Venerable … fell away from freedom." Đây là câu đọc gượng nhất của lát; đã hạ
    grammar_logic / vietnamese_clarity / ambiguity_integrity vì lý do đó chứ không vì sai nghĩa.
