notes: |-
  **Phân loại 34 khoá (đo bằng máy): A = 14 · B = 16 · C = 4 · D = 0. Điều chỉnh tay sau khi đọc bối cảnh: 5 khoá xử lý như D** (xem dưới). Đã ghi 34/34 khoá `fillableSegments`.

  **Vấn đề trung tâm — câu tóm `se āyatane veditabbe` có hai dạng cắt khoá trong cùng bài, và Sujato dịch theo dạng.** Dạng ba khoá (mắt / lưỡi / ý) ở `1.7`–`1.9`: Sujato `1.7` chỉ nói mắt, còn “ear … nose … tongue … body …” nằm ở `1.8`. Dạng hai khoá (mắt / ý) ở `8.2`–`8.3` và `8.6`–`8.7`: Sujato dồn “ear … nose … tongue … body …” vào khoá mắt `8.2`/`8.6`. Pāli khoá mắt **trùng nguyên văn** ở cả hai dạng (`2.3` = `5.2` = `8.2` = `8.9` = `10.2`; `5.7` = `10.6`). Nếu chép máy lời `8.2` vào `2.3`/`5.2`/`10.2` thì “ear … nose … tongue … body …” lặp hai lần liền (lần nữa ở khoá lưỡi kế tiếp). Vì thế lớp lấp **theo đúng cách Sujato tự phân bổ ở mỗi dạng**: khoá mắt đứng trước khoá lưỡi (`2.3`, `5.2`, `5.7`, `10.2`) lấy lời `1.7`; khoá mắt đứng ngay trước khoá ý (`8.9`, `10.6`) lấy lời `8.2`/`8.6`. Đây là 5 khoá có Pāli trùng nhưng English khác nhau **có chủ đích**, giống hệt sự khác nhau đã có giữa `1.7` và `8.2` của tầng ghim — báo ra, không tự hoà.

  **Hệ quả với dấu lược (lệch luật có chủ đích, ghi số):** Pāli mỗi khoá trong 10 khoá này có đúng một `…pe…`. Khoá mắt dạng ba (`2.3`, `5.2`, `5.7`, `10.2`): lớp lấp 0 `…` (như Sujato `1.7`) vì nội dung dấu lược được khoá lưỡi kế tiếp mang; khoá lưỡi (`2.4`, `5.3`, `5.8`, `10.3`, A/B từ `1.8`): 4 `…` (“ear … nose … tongue … body …”, danh sách giác quan rút gọn của Sujato); khoá mắt dạng hai (`8.9`, `10.6`): 4 `…` (như `8.2`). Lý do: luật A (Pāli trùng ⇒ dùng lại nguyên văn) và nhất quán với `1.7`–`1.9`, `8.2`–`8.3` đã ghim; lời Sujato ở đây là liệt kê giác quan bị lược, không bịa câu chữ. Các khoá còn lại khớp 0 ↔ 0.

  **A khác (7):** `2.5`, `5.4`, `8.10` ← `8.3`/`8.7` (“mind ceases and perception of ideas fades away.’”); `5.9`, `10.7` ← `1.9`; `5.13`, `10.11` ← `3.3`.

  **B — tường thuật lại (`5.1`, `5.5`, `5.6`, `5.10`, `5.12`, `5.14`, `10.1`, `10.4`, `10.5`, `10.8`, `10.10`, `10.12`, `10.13`), nguồn `2.1`, `2.2`, `2.6`, `3.2`, `3.4`, `8.1`, `1.9` (0,71–1,0):** dùng nguyên lời Sujato, chỉ đổi người nói/hô ngữ (“Reverend Ānanda”, “reverend”, “Sir”), đổi nháy kép/đơn theo tầng lồng của Pāli, và bỏ `…` mà Sujato tự thêm ở cuối `2.2` (Pāli `2.2` không có dấu lược). `10.4` ghép vế cuối câu tóm (“mind ceases and perception of ideas fades away.’”) với “Soon after the Buddha left, sir, we considered:” vì Pāli gộp hai vế vào một khoá.

  **C (4):** `5.11` “We thought, reverend,”; `10.9` “We thought, sir,”; `11.4` `Catutthaṁ.` ⇒ “Fourth.” (`sn35.117` là bài thứ tư của phẩm 12, `sn35.114`–`117` mang `Paṭhamaṁ`…`Catutthaṁ`); `8.13` `upasaṅkamitvā etamatthaṁ puccheyyātha.` ⇒ “Having gone to him, you may ask about this matter.” — **lặp ý có thật:** Sujato `8.12` đã gộp luôn vế này (“…go to the Buddha and ask him about this.”); lớp lấp dịch theo Pāli của chính khoá, để sự lặp hiện ra thay vì bỏ khoá thành orphan.

  **Ngoặc:** 34/34 khoá khớp Pāli về nháy kép/đơn (gồm ba tầng lồng ở `5.7`–`5.9`, `10.6`–`10.7`).

  Triangulation 8.0: scorecard Việt của `sn35.117` (`content/meta/sutta/sn/sn35.117.yaml`) ghi `quality.assessed_by` thuộc **cùng họ công cụ hỗ trợ** với lớp lấp này (đối chiếu `source/tooling.yaml`). Vì vậy bản lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không** được tuyên bố là đã đối chiếu English nhờ lớp lấp. Đối chiếu thật sự có: Pāli root đã ghim + Sujato đã ghim (mọi khoá có lời) + bản Việt canonical (chỉ để đối chiếu nghĩa, không dịch vòng, không chép câu).

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; bốn lệnh đó còn nợ, nên không tuyên bố technical gate pass. Không đặt blocker vì chưa chạy không phải validation failure. Đã tự kiểm bằng máy: JSON parse, mọi khoá ⊆ `fillableSegments` của bài, 0 khoá shadow, NFC, 0 khoá rỗng, thứ tự khoá theo Pāli, Pāli trùng nguyên văn ⇒ English trùng (trừ các chỗ ghi ở trên), dấu lược và nháy so với Pāli từng khoá (dấu `’` có chữ thường đứng ngay sau tính là dấu nhạt lượu).

  Hai cơ chế khoá trống của tầng đã ghim (đo rồi báo, không sửa — sửa là shadow): **cắt cụt dãy** (dãy ≥ 4 khoá trống liên tiếp) = 2 dãy / 27 khoá / 2746 ký tự Pāli; **bỏ dòng song song** (chỉ xét khoá trống, thân từ = 6 chữ đầu của từ ≥ 4 chữ, khoá mở nhóm gom mọi khoá trống chưa vào nhóm có tỉ lệ chung ≥ 0,70, mỗi khoá thuộc đúng một nhóm) = 31/34 khoá. Khoá đã ghim có chữ nhưng ngắn dưới 25% Pāli (Pāli ≥ 40 ký tự): 0.

  Hệ quả với `content/meta/reference-gaps.yaml`: `sn/sn35.117` **có** record trong tệp đó. Record đó sẽ thành thừa sau khi bài `published`; lát này **không** chạm tệp đó, để người điều phối sinh lại bằng `npm run reference:gaps`. Coverage đo trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): trước 37/67 = 0.5522; sau khi lớp lấp `published`: 67/67 = 1.0000 (30 khoá có nội dung được lấp, còn 0 khoá có nội dung thiếu English). Độ nhạy: phải mất thêm 14 khoá có nội dung nữa thì bài mới rớt dưới ngưỡng 0,8.
