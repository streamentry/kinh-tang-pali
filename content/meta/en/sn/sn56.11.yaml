notes: |-
  12.3 (Sujato) “Hearing the cry of the earth gods, the gods of the four great kings …” → 12.4 là LỜI CỦA HỌ, rồi 12.5 “the gods of the thirty-three …” nối tiếp. Đây là chuỗi thứ tự các cõi trời lần lượt cất tiếng sau khi Đức Thế Tôn chuyển pháp luân.

  Tiền lệ: 12.2 và 12.11 của chính bài này có Pāli GIỐNG HỆT (khác đúng một dấu phẩy sau `pavattitaṁ`) và Sujato dịch giống nhau từng từ ở cả hai chỗ. Dùng lại nguyên văn. Bất định đã ghi: dấu phẩy ở Pāli 12.4 không có ở Pāli 12.2/12.11 và cũng không có trong bản Sujato, nên không thêm vào — ưu tiên giữ nguyên một lời cho cả ba lần cất tiếng.

  `”ti` → `”`, cùng quy ước đã nêu ở sn55.8.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
