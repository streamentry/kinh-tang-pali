notes: >-
  This group is the second set of the "slanting to the ocean" peyyāla. Sutta 110 (Yamunā), 111 (Aciravatī),
  112 (Sarabhū) and 113 (Mahī) each give the river, then `evameva kho, bhikkhave, bhikkhu …pe…` — the
  whole eightfold-path passage reduced to an ellipsis. Only sutta 114, which lists "all the great rivers",
  spells it out. So the six filled segments are the only place in this group where the path itself is
  stated, and they are fillable precisely because they are spelled out.

  Every one of the five prose segments repeats a Pāli line that is already translated elsewhere, so all
  five reuse the pinned wording rather than being translated afresh:

  - `1.2` is verbatim the Pāli of `sn45.122-126:1.10`, the same "yā kācimā mahānadiyo, seyyathidaṁ—" list in
    the same vagga, and that text's fill already reads "the Ganges, Yamunā, Aciravatī, Sarabhū, and Mahī,
    all of them slant, slope, and incline to the ocean;". Taken over word for word, including the semicolon.
  - `1.3`, `1.4` and `1.6` are verbatim the Pāli of `sn45.103:1.2`, `1.3` and `1.5`, which the pinned
    edition translates. Hence "develops and cultivates" (not the bare "develops" that `sn45.146-148`
    would allow), and the triple "slants, slopes, and inclines" kept as three verbs rather than collapsed.
  - `1.5` is verbatim `sn45.139:2.5` and `sn45.70:1.7`. `rāgavinayapariyosānaṁ` is "culminate in the removal
    of greed, hate, and delusion" in both, so that clause is reused rather than re-worded to "giving up
    passion" — a fresh reading here would make this text's eightfold path sound different from every other
    sutta that states the same thing.

  `1.5` also keeps the Pāli's own `…pe…` unexpanded, as the fill layer must: Sujato expands it at
  `sn45.139:2.5`, but expanding here would put invented English into a layer with no licence for it, and
  the test "a fill leaves the Pāli ellipsis alone" exists for exactly this. The clauses on each side of
  the ellipsis are still rendered in full.

  `1.8` is the editorial note `(Rāgavinayadvādasakī dutiyakī samuddaninnanti.)`, not a colophon, so it is
  fillable on the same 40-character rule as any other segment and is translated here: "The second set of
  twelve, with the abandoning of passion, inclines to the ocean." `dvādasakī` is "the twelve" of the
  peyyāla and `dutiyakī` marks this as its second iteration, with `rāgavinaya` naming the mode the path is
  developed in. The matching note in `sn45.122-126:1.16` (`Amatogadhadvādasakī tatiyakī`) is left empty by
  both the pinned edition and the fill, so there is no rendering of this formula to reuse; the wording
  above is read from the Pāli alone. That is why `ambiguity_integrity` sits at 9.2 rather than higher —
  it is a parivetti, and "the second set of twelve" is the most plausible expansion of `dutiyakī` but not
  the only one.

  Triangulation is capped at 8.0: Sujato translates none of these six segments, so this fill is not an
  independent English reading of its own.