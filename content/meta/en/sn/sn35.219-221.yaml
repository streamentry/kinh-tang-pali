notes: |-
  Tiền lệ: 1.8 có Pāli GIỐNG HỆT 1.2 của chính bài này, đã ghim — chép nguyên văn. Đây chính là
  luật 3 của lớp lấp: dùng lại đúng từ khoá mà bản đã ghim dùng ở chỗ Pāli trùng.

  BẤT ĐỊNH ở 1.7: giống hệt sn35.216-218:1.8. Pāli `dhammā anattā atītā anāgatā paccuppannā.` có
  ba vế thời gian nhưng khoá không có dấu lược, nên không thể viết "in the past … future …
  present". 1.1 của chính bài đã ghim chính cụm `anattā atītā anāgatā paccuppannā` thành
  "…touches, and ideas are not-self."; sn35.183-185:1.3 và sn35.195-197:1.1 xác nhận quy ước hấp
  thụ đó. Vì vậy 1.7 dịch "and ideas are not-self." và ĐÃ LƯỜI `atītā anāgatā paccuppannā` — có
  chủ ý, theo tiền lệ. Hạ `semantic_fidelity` và `ambiguity_integrity` 9.3 vì lý do này.
