notes: |-
  Cùng cách làm sn56.4 và sn56.5, nhưng đây là bài khó nhất trong ba bài vì động từ
  khác: `abhisambuddhaṁ pakāsenti` là TUYÊN BỐ sự giác ngộ, không phải “giác ngộ” thuần.

  Bài CÓ bản Việt dự án (sn56.6), dùng làm chốt ngữ nghĩa:
    2.3 — VI: “Này các tỳ-kheo, các Sa-môn hay Bà-la-môn nào trong quá khứ đã tuyên thuyết
         sự giác ngộ đúng như thật …”. “tuyên thuyết … giác ngộ” dịch “have declared
         their true awakening”.
    2.5 — VI: “tuyên thuyết sự giác ngộ đúng như thật, tất cả tuyên thuyết đúng như thật
         bốn Thánh đế này.” → “declare their true awakening, all of them declare their
         true awakening to these four noble truths.” Giữ `imāni` (bốn Thánh đế NÀY).

  LỆCH CÓ CHỦ Ý, cần ghi: bản đã ghim ở 1.3 dịch cùng ý là “reveal that they are
  awakened, all of them reveal that they truly awakened to the four noble truths.” — dùng
  “reveal” và lấy “truly awakened” cho `abhisambuddhaṁ`. Tôi dùng “declare … true
  awakening” vì (a) khớp bản Việt dự án, (b) `pakāsenti` là hành động tuyên bố chứ
  không chỉ “lộ ra”, và (c) thì hiện tại ở 2.5 cần một mệnh đề chủ động, “they are
  awakened” sẽ đổi nghĩa. Đây là chỗ duy nhất lát này chọn bộ từ khác bản đã ghim, nên
  hạ `terminology` xuống 9.0 và `ambiguity_integrity` xuống 8.5. Người biên tập nên
  biết là bài sẽ đọc khác 1.3 một chút; nếu muốn đồng nhất thì phải sửa cả 1.3, vốn là
  tầng đã ghim.

  Bài còn một lệch của bản đã ghim không sửa được: 1.3 dùng thì quá khứ (“they truly
  awakened”) cho mệnh đề hiện tại `abhisambuddhaṁ pakāsenti`. 2.5 của tôi dùng thì
  hiện tại theo Pāli. Ghi lại để không bị coi là lỗi lặp.
