notes: |-
  Cả chín khoá đều là PāLI LẶP LẠI của chỗ tầng đã ghim đã dịch, nên lớp lấp tái dùng y nguyên
  câu chữ đã ghim, không dịch lại:

  - 2.2 trùng nguyên văn `sn35.235:1.5` (Pāli giống hệt từng chữ) ⇒ lấy y cả câu, kể cả dấu
    hai chấm ở cuối.
  - 2.4 / 3.5 / 4.5 trùng nguyên văn `1.7` và `5.5` ⇒ “I speak having seen this drawback. ” y nguyên.
  - 3.2 + 3.3 và 4.2 + 4.3: Ở đây Pāli **bị tách làm hai khoá** ở dấu chấm sau `kālaṁ kareyya.`,
    trong khi tầng ghim đã dồn **cả hai** vào 5.2. Lớp lấp không dồn: 3.2 mang vế trước (dấu
    phẩy), 3.3 mang vế sau (dấu hai chấm). Ghép 3.2+3.3 ra đúng bằng câu đã ghim ở 1.5/5.2, nên
    không mất một chữ nào và không mở rộng gì. Đây là cùng cách chia như `sn11.24:1.7/1.8` và
    `an4.36:3.3–3.8`.

  HỆ QUẢ PHẢI NÓI THẲNG — khoá 5.3: vế `Ṭhānametaṁ vijjati …` của tiết thân **đã bị 5.2 của
  tầng ghim dồn vào trước**, và 5.2 không trở lại. Lớp lấp vẫn dựng lại đúng câu chữ đó cho
  5.3 (giống tiền lệ `an10.20:13.2–13.3`, nơi tầng ghim cũng đã gộp cả ba thời vào 13.1). Hệ quả
  là người đọc sẽ thấy vế “it’s possible you would go to one of two destinations” **hai lần** ở
  tiết thân: một lần trong 5.2 đã ghim, một lần ở 5.3 của lớp lấp. Không có cách nào vừa giữ
  đủ chữ ở 5.3 vừa tránh lặp mà không bịa thêm dấu lược ở nơi Pāli không có — mà bịa dấu lược thì
  vi phạm luật của lớp lấp. Đây là hệ quả của việc tầng đã ghim dồn câu, **không phải** lỗi dịch;
  vì nó giảm khả năng đọc nên `vietnamese_clarity` hạ 9.2 và `ambiguity_integrity` hạ 9.2.

  Ngoài ra 2.3 và 3.4 (`nirayaṁ vā tiracchānayoniṁ vā.`, 30 ký tự) nằm dưới ngưỡng 40 ký tự nên
  **không** thuộc tập lấp và vẫn để trống ở cả tầng ghim lẫn lớp lấp. Người đọc sẽ thấy một
  lỗ hổng ngay sau dấu hai chấm ở 2.2/3.2+3.3/4.2+4.3. Không tự sửa luật đếm.

  Triangulation 8.0 (mức thường của lớp lấp). Bài này **không** có bản Việt project, cũng không
  có bản Việt hiện hành ở commit đã ghim, và `content/meta/sutta/sn/sn35.235.yaml` chưa tồn tại —
  nên không có lớp Việt nào để đối chiếu nghĩa, và cũng không có scorecard Việt cùng họ công cụ để
  lo ngại. Người đọc nên biết: đối chiếu ở đây là Pāli root + bản Anh đã ghim của chính bài.

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate
  pass. Bốn lệnh đó còn lại cho người điều phối.

