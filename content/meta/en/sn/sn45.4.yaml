notes: |-
  3.3 TRÙNG NGUYÊN VĂN Pāli với 1.4 của CHÍNH bài nên chép nguyên văn bản Anh đã ghim, kể cả cách
  Sujato dịch `vālabījaniyā` là “the chowry fanning him”.

  3.1 và 3.2 là lần Đức Ananda kể lại, nên đổi sang ngôi thứ nhất nhưng giữ nguyên bộ từ của
  1.2/1.3: `pubbaṇhasamayaṁ nivāsetvā pattacīvaramādāya … piṇḍāya pāvisi` → “robed up in the morning
  and, taking his bowl and robe, … for alms”; `jāṇussoṇiṁ brāhmaṇaṁ sabbasetena vaḷavābhirathena
  sāvatthiyā niyyāyantaṁ` → “the brahmin Jānussoṇi driving out of Sāvatthī in an all-white chariot
  drawn by mares”.

  Tiền lệ cho mở đầu câu: `Idhāhaṁ, bhante,` → “Sir, …” (dn28:2.12 “Sir, once I approached the
  Buddha…”, dn18:11.3 “Just now, sir, I…”); `Addasaṁ khvāhaṁ, bhente,` → “I saw, …” (sn56.41:2.7
  “Then I saw an army of four divisions…”). Cả hai chỉ có 1–2 tiền lệ và không có tiền lệ nào cho
  đúng vế “tôi thấy một người đang bị đưa ra khỏi thành”, nên hạ `grammar_logic` và
  `ambiguity_integrity`.

  `niyyāyantaṁ` chọn “driving out” để khớp 1.3 của chính bài, dù tiền lệ tiếng Anh trực tiếp cho
  dạng bị động này là “being escorted out”; cả hai đều trung thành, chọn theo nhất quán trong bài.

  Ngoài phạm vi lát: 3.4–3.6 và 11.5 trống ở mọi tầng nhưng không thuộc b6.json.
