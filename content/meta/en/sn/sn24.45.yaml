notes: |-
  3.15: Pāli trùng NGUYÊN VĂN với 3.4 (Sujato) = "“But by not grasping what’s impermanent,
  suffering, and perishable, would the view arise:" → dùng lại y hệt, chỉ bỏ `“` mở (Pāli 3.15
  không có). Trong chính bài này Sujato dùng "would the view arise" (không có "such"), khác
  sn24.7/sn24.10 dùng "would such a view arise" — bản lấp giữ khác biệt đó để mỗi bài nhất quán
  với bản đã ghim của nó.

  3.16: `‘na vātā vāyanti …pe… esikaṭṭhāyiṭṭhitā’”ti?`. Sujato ở 3.5 MỞ RỘNG `…pe…` thành
  "‘Winds don’t blow; rivers don’t flow; pregnant women don’t give birth; the moon and stars
  neither rise nor set, but stand firm like a pillar’?” — lớp lấp cấm mở rộng `…pe…`, nên chỉ
  dịch hai về đầu-cuối và giữ dấu lược: "‘Winds don’t blow … stand firm like a pillar’?”, cộng
  `’` cho khớp `_đóng` = 2 (cùng khuôn `sn24.19:3.15`).

  Khác biệt cần biết: bản lấp đã publish `sn24.19:3.15` có Pāli TRÙNG NGUYÊN VĂN với 3.16 và
  viết "the winds don’t blow" (chữ thường, có "the"). Bản lấp này viết "Winds don’t blow" (hoa
  đầu câu, không "the") để khớp 3.5 của chính sn24.45. Ưu tiên là tính nhất quán TRONG BÀI.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
