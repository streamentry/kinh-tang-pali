notes: |-
  **Bốn nhóm khoá (đo bằng script trên 129 khoá lấp).** Phép thô: A = 72 · B = 36 · C = 13 · D = 8.
  Sau khi đối chiếu từng khoá A với lời đã ghim: **A dùng lại nguyên văn = 53 · B dựng lại = 55 · C = 13 · D = 8**.
  19 khoá phép thô gọi A được tính lại thành B vì lời ghim của khoá trùng Pāli mang **dấu lược hoặc nháy không có
  trong Pāli** (xem mục cố ý lệch), nên lớp lấp lấy lời ấy **bỏ phần thừa** thay vì chép.

  Bài là một khuôn lặp: Moggallāna nói với Sakka (`devānaminda`), Sakka đáp (`mārisa moggallāna`), lặp cho 500 /
  600 / 700 / 800 / 80.000 chư thiên, qua bốn đề (quy y, bất động tịnh tín, giới, “vượt chư thiên khác ở mười
  điểm”). Tầng đã ghim chỉ dịch **lượt 500** của mỗi đề rồi chỉ dịch dòng “Then Sakka … with N deities …”; mọi
  lượt lặp đều trống. Lớp lấp dựng lại từng lượt **bằng đúng câu Sujato của lượt 500**:
  - lý do tái sinh (`…hetu kho … upapajjanti`) → “It’s the reason why some sentient beings, when their body breaks up,
    after death, are reborn in a good place, a heavenly realm.” — Sujato bỏ hô ngữ ở mọi khoá loại này, lớp lấp
    theo; khoá Pāli có `…pe…` cuối (`39.3`, `40.3`, `44.3`) đổi dấu chấm thành ` …`;
  - `Te aññe deve dasahi ṭhānehi adhigaṇhanti—` → nguyên văn `26.3`; danh sách mười điểm đủ → nguyên văn `26.4` /
    `28.4`; danh sách có `…pe…` → “heavenly lifespan … and touches.”;
  - công thức Phật/Pháp/Tăng đủ → nguyên văn `8.2` / `9.2` / `10.2`; bản lược cắt đúng chỗ `…pe…` của Pāli
    (`38.2` đã ghim là mẫu cho Phật: dùng nguyên văn). `12.2` Pāli thiếu `bhagavā` trước `…pe…` nên còn
    “‘That Blessed One … teacher of gods and humans, awakened, blessed.’”; `40.2`, `44.2` Pāli chỉ còn `lokassā’ti`
    sau `…pe…` nên còn “… for the world.’”;
  - hô ngữ mở thoại: `devānaminda` → “Lord of gods,” (`2.1`), `mārisa moggallāna` → “My good Moggallāna,” (`3.1`).
  Nhóm C (13 khoá) không phải dịch mới về ngữ liệu: 12 khoá là công thức Pháp/Tăng **dạng lược** mà tầng ghim không
  có khoá cùng Pāli (tỉ lệ khớp < 0,8 với `9.2`/`10.2`), dựng bằng cách cắt lời `9.2`/`10.2` đúng chỗ `…pe…`; khoá
  thứ 13 là nhãn `54.5` `Dasamaṁ.` → “Tenth.” (bài thứ mười của `1. Moggallānavagga`, khớp `sn40.10`).

  **D = 8 — báo, không tự ý hoà tầng ghim.** Tám khoá lấp có Pāli trùng byte với hai khoá đã ghim mà lời ghim khác
  nhau: `5.3` (`2.3` vs `27.1`), `6.1` (`3.1` vs `29.1`), `18.1`/`48.1` (`9.1` vs `39.1`), `19.1`/`49.1`
  (`10.1` vs `40.1`), `21.1`/`51.1` (`12.1` vs `42.1`). Trong mọi cặp, một bên ghim mang ` …` hoặc `”` mà Pāli
  không có. Lớp lấp chọn bên **khớp Pāli** (không dấu lược, không nháy đóng), và chính tầng ghim vẫn lệch giữa hai
  khoá anh em của nó — tự biến mất khi tầng ghim được sửa.

  **Cố ý lệch tầng ghim (đều có số đo).**
  1. Tầng ghim có **14** khoá mang `…` mà Pāli không có (`3.1`, `3.3`, `4.4`, `12.1`, `13.1`, `14.1`, `16.4`,
     `27.1`, …). Lớp lấp không chép dấu thừa: `6.1`/`21.1`/`51.1` ghi đủ câu, không ` …`.
  2. `38.5` đã ghim dịch **đủ** mười điểm dù Pāli `dibbena āyunā …pe… dibbehi phoṭṭhabbehi.` có một dấu lược.
     Chín khoá lấp cùng Pāli ấy ghi “heavenly lifespan … and touches.” — giữ đúng một `…`, không mở rộng.
  3. `13.1`, `14.1`, `15.1` đã ghim rút còn “the teaching …”, “the Saṅgha …”, “and to have the ethical
     conduct …” (chuỗi liệt kê nối nhau). Ở lượt lấp, câu kế tiếp được lấp đầy đủ nên một mảnh “the teaching …”
     sẽ treo; lớp lấp dùng câu đủ của khoá anh em `9.1`/`10.1`/`41.1` (“It’s good to have experiential
     confidence in the teaching:” …). `41.1` đã ghim còn mang `”` đóng mà Pāli không có; lớp lấp bỏ.
  4. Viết hoa `sādhu` thường đầu khoá (`6.4`, `36.2`, `36.3`) theo cách tầng ghim viết hoa `atha` thường ở `4.2`–`4.4`.

  **Nháy.** Mọi khoá lấp khớp Pāli từng khoá (đo: 0 lệch). Mở `“` ở `5.1`, `6.1`, `17.1`, `21.1`, `33.1`, `36.1`,
  `47.1`, `51.1`; đóng `”` ở các khoá `…”ti`. Hệ quả nhìn thấy được: lượt 500 của tầng ghim đóng `”` ở `3.6`/`15.2`,
  lớp lấp ở lượt sau đóng đúng chỗ Pāli đóng.

  **Hai cơ chế khoá trống (BRIEF §5d), đo trên 129 khoá trống.** Cắt cụt dãy (≥ 4 khoá trống liên tiếp): **6** dãy,
  **111** khoá, 10.049 ký tự Pāli. Bỏ dòng song song (nhóm ≥ 70% thân từ, mỗi khoá một nhóm): **9** nhóm, **128**
  khoá (≤ 129, phép không tự thừa). Tầng ghim còn **8** khoá có chữ nhưng < 30% độ dài Pāli (`3.3` 14/55, `4.4` 56/244,
  `13.1` 14/73, …) — dấu hiệu cắt cụt; coverage tính chúng là “đã phủ”, nên `ratio` ở đây có thể lạc quan.

  **Coverage.** Mẫu số 194 khoá Pāli có nội dung. Trước: 66/194 = **0,3402** (dưới ngưỡng 0,8). Sau khi `published`:
  194/194 = **1,0** (128 khoá lấp có nội dung; khoá thứ 129 `54.5` dưới 40 ký tự). Độ nhạy: phải mất ≥ 39 khoá lấp
  mới rớt dưới 0,8; nếu lớp lấp **không** `published` thì về lại 0,3402.
  Hệ quả với `content/meta/reference-gaps.yaml`: bài **có** record; sau khi lớp lấp `published` record thành thừa.
  Lát **không** chạm tệp đó — người điều phối chạy lại `npm run reference:gaps`.

  Triangulation 8.0: scorecard Việt của bài này (`content/meta/sutta/sn/sn40.10.yaml`) do **cùng họ công cụ** với lớp lấp chấm/dịch (đối chiếu alias trong `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập và scorecard Việt của bài **không** được tuyên bố là đã đối chiếu English độc lập. Nguồn đã đối chiếu: Pāli root đã ghim + Sujato đã ghim (mọi khoá có chữ) + bản Việt canonical (chỉ để đối chiếu nghĩa, không dịch vòng).

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối. Không đặt blocker vì “chưa chạy” không phải “chạy mà đỏ”. Đã tự kiểm bằng script: JSON parse, mọi khoá ⊆ tập lấp, 0 khoá trùng khoá đã ghim có chữ (không shadow), NFC, không khoá rỗng, nháy kép/đơn khớp Pāli từng khoá (nhận `’` + chữ thường là dấu nháy lược), số `…` khớp Pāli (`…pe…` = một), `final_score` = trung bình thô.
