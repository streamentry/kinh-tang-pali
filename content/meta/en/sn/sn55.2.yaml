notes: |-
  Vế KHÔNG lược, nên dịng trọn. Dùng đúng bộ từ bản Anh đã ghim dùng cho cùng vế Pāli ở 80 khoá (xem
  notes chung ở sn55.11), và khoá liền trước 2.2 của chính bài này dùng đúng cách gọi đó:
