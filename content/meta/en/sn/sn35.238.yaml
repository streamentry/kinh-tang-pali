notes: |-
  Tiền lệ: `sn35.238:5.2` và `5.3` (Sujato) đã dịch đúng nội dung này ở ngôi thứ ba — “He’d see a large deluge, whose near shore is dubious and perilous, while the far shore is a sanctuary free of peril.” + “But there’s no ferryboat or bridge for crossing over.” — và phần giải nghĩa ở 13.1/14.1/15.1 cho thêm “dubious and perilous”, “sanctuary free of peril”, “The raft”. 5.5 là LỜI NGHĨ CỦA CHÍNH NGƯỜI ẤY, nên phải sang ngôi thứ nhất, và “But” của Sujato không còn đối chiếu được nên dùng “And”.

  Bất định cần ghi: khoá `2.1` (Sujato) đã nuốt hết nội dung khoá 2.2 — cả tám vế — nên cột Anh ở 2.2 sẽ lặp lại phần Sujato đã nói ở 2.1. Đây là hệ quả trung thực của việc Sujato gộp vượt ranh giới khoá, không phải lỗi của lớp lấp; bỏ bớt thì mất nghĩa Pāli của chính khoá này. Ngoặc: 5.4 mở `‘`, 5.6 đóng bằng `’ti.`, nên 5.5 chỉ mở.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
