notes: |-
  Pāli của bốn khoá lấy Y HỆT sn35.10 (chỉ khác `aniccā`/`anattā` ở 1.1, vốn đã ghim), nên
  dùng lại nguyên văn bộ từ của sn35.10:1.3/1.5/1.12/1.14. Đây là điều luật 3 của lớp lấp
  đòi hỏi theo nghĩa rộng: hai bài kế nhau phải không tự mâu thuẫn.

  Tiền lệ y như sn35.10, và đã đếm: `sutavā ariyasāvako` → "a learned noble disciple" có
  28 chỗ Pāli kèm bản ghim; `nibbidāya virāgāya nirodhāya paṭipanno hoti` → "practice for
  disillusionment, dispassion, and cessation" có 28 chỗ, mọi bản ghim đều như vậy.

  Bản Việt dự án có ở 1.3 và 1.5 và dùng đúng nghĩa ("bậc Thánh đa văn thì không ham sắc
  đã qua", "đã hướng đến chán nản, ly tham, diệt tận với sắc đang có mặt").

  Bất định đã ghi nhận:

  - 1.4 và 1.13 (`nābhinandati`) không thuộc lát này; 1.5 và 1.14 mở chữ thường để nối.
  - 1.6–1.11 đã bị lược và dưới ngưỡng, cột English dừng ở 1.5 và 1.14. 1.15–1.16 và
  `Tassuddānaṁ` (2.0–2.4) cũng trống, không bịa.
  - `triangulation` 8.0; `han_viet_balance` là giá trị mặc định của lớp lấp.
