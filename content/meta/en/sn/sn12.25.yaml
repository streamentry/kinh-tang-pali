notes: |-
  Sáu khoá `12.1`, `12.2`, `12.4` (về `vacīsaṅkhāra`) và `13.1`, `13.2`, `13.4` (về
  `manosaṅkhāra`) là hai bản sao của khung đã dịch ở `11.1–11.4`, chỉ khác đúng danh từ. Vì vậy
  phần lớn vế phụ chép y bản đã ghim: `Sāmaṁ vā` → "By oneself", `Pare vā` → "Or else others",
  `Asampajāno vā` → "Or else one", `abhisaṅkharoti` → "instigates", `yaṁpaccayāssa` →
  "conditioned by which", `ajjhattaṁ sukhadukkhaṁ uppajjati` → "that pleasure and pain arise in
  oneself".

  **Chỗ phải tự quyết, và đây là điểm yếu thật của lát này: `vacīsaṅkhāraṁ` / `manosaṅkhāraṁ`.**
  Bản ghim ở `11.1` dịch `kāyasaṅkhāraṁ` thành *"the choice that gives rise to bodily, verbal, and
  mental action"* — tức Sujato đã **gộp cả ba vế** vào một khoá, vì `12.x`/`13.x` trống. Nếu tôi
  dịch `12.1` theo đúng khuôn đó ("the choice that gives rise to verbal action"), thì cột English
  sẽ lặp lại "verbal" và "mental" ngay sau `11.1` đã nói trọn, và người đọc tưởng `11.1` nói về cả
  ba vế. Vì vậy tôi dùng **"the verbal choice" / "the mental choice"**: giữ `saṅkhāra` → "choice"
  đúng như bản ghim ở `11.2–11.4` ("instigate the choice"), chỉ thêm danh từ chỉ nghiệp về mạch
  (`vacī`/`manas`), và **không** lặp lại cụm "gives rise to … action" mà `11.1` đã chiếm.

  Đây là lựa chọn thẩm mỹ trên cùng một tham chiếu, không phải bản dịch khác nghĩa: `vacīsaṅkhāra`
  và `manosaṅkhāra` đều là `saṅkhāra` (nghiệp chọn) có nghiệp làm tiếp theo. Vì không có bản Anh
  nào thứ hai ở commit đã ghim để đối chiếu (`grep "after deliberation"` trong toàn bộ
  `.cache/upstream/suttacentral/translation/en/sujato/` chỉ ra `sampajāno`/`asampajāno` ở đúng bài
  này và `manasikāro` ở MN), `terminology` hạ 8,8 và `ambiguity_integrity` hạ 8,8.

  **`sampajāno` (`12.3`, `13.3`) không thuộc lát này và tôi không lấp.** Pāli của chúng là
  `Sampajāno vā taṁ, ānanda …pe…` — 29 ký tự, **dưới** ngưỡng 40 ký tự nên nằm ngoài phép đo
  coverage, và bản Anh đã ghim cũng trống. Đó là lựa chọn của lát, không phải bỏ sót: lát này chỉ
  điền 6 khoá có Pāli ≥ 40 ký tự. Người đọc bốn cột vẫn thấy hai ô trống đó.

  Lớp lấp: 6 khoá, tất cả nằm ở chỗ bản Anh đã ghim để trống. **Không khoá nào là blockquote
  tham chiếu và không khoá nào có Pāli rỗng**, nên không có khoá nào bị bỏ.

  Bài này còn 9 khoá bản Anh đã ghim để trống mà lát này KHÔNG lấp, tất cả **dưới 40 ký tự**:
  tám khoá đuôi đoạn lược `4.2`, `4.3`, `5.2`, `5.3`, `8.2`, `8.3`, `9.2`, `9.3`
  (`Yepi te …pe…`, 12 ký tự), hai khoá `12.3`, `13.3` (`Sampajāno vā taṁ, ānanda …pe…`, 29), và
  `14.4` (`Pañcamaṁ.`, 9 — dòng đếm số thứ năm).

  **Bài này KHÔNG có bản Việt của dự án** (`content/translation/vi/project/sutta/sn/` không có
  `sn12.25`, cũng không có `content/meta/sutta/sn/sn12.25.yaml`), nên không có đối chiếu Việt cho
  khoá nào ở đây. `vietnamese_clarity` và `han_viet_balance` mang **giá trị mặc định của lớp lấp**
  (theo tiền lệ `sn24.36`: "hai tiêu chí mang giá trị mặc định của lớp lấp"), và `triangulation`
  hạ 7,4 vì tầng đối chiếu chỉ còn Pāli đã ghim + các khoá còn lại của chính bản Anh đã ghim.

  **Coverage và `content/meta/reference-gaps.yaml`.** Trước lát này coverage là 34/40 = 0,85,
  **đã trên** ngưỡng 0,8; bài cũng nằm ngoài phạm vi của file đó (chỉ "texts with project data
  under content/meta/sutta"). Nên lát này **không** làm record nào thành thừa. Sau lát này là
  40/40 = 100%. `validate` sẽ không có cảnh báo "same author" cho bài này: không có
  `content/meta/sutta/sn/sn12.25.yaml` để so tên.