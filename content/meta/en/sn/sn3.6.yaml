notes: >-
  The `…pe…` at sn3.6:2.4 is kept as an ellipsis rather than expanded, per the standing rule
  for fills: expanding it would put text into an English layer that no source licenses, and
  the reader is better served by seeing that a passage is elided than by invented context.

  The paired negatives and positives at 2.2 and 2.3 are rendered as four clauses each so
  that the pairing stays visible: `majjanti` (intoxicated), `pamajjanti` (heedless),
  `gedhaṁ āpajjanti` (take a liking to), `vippaṭipajjanti` (go against). The Pāli reverses
  the order between the two sentences — negatives then `kāmesu gedhaṁ āpajjanti, sattesu
  vippaṭipajjanti`; positives then `kāmesu ca gedhaṁ āpajjanti, sattesu ca vippaṭipajjanti` —
  and that order is preserved rather than smoothed, because the reversal is the rhetorical
  point of the verse. `sattā lokasmiṁ` is "in the world" throughout, not "beings in the
  world", so the negative clause and its positive counterpart share a subject and the
  contrast is a contrast in predicate. Triangulation is capped at 8.0.
