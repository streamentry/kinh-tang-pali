notes: |-
  **Phân loại 34 khoá (đo bằng máy): A = 0 · B = 0 · C = 34 · D = 0.** Không khoá nào trong tệp gộp này có Pāli trùng một khoá đã có lời Sujato (tầng ghim chỉ có các dòng mở `X:1.1` dạng rút gọn “the undefiled …”).

  **Cách dựng:** `Taṁ suṇātha. Katamañca, bhikkhave, X …pe….` ⇒ “Listen. And what is X? …” — khuôn câu lấy từ tầng ghim ở bài đầy đủ cùng phẩm (`sn43.12:1.2`/`1.3` “Listen …” / “And what is the unconditioned?”), nhưng **bỏ** dấu `…` sau “Listen” mà tầng ghim tự thêm (Pāli `Taṁ suṇātha.` viết đủ) và giữ **đúng một** `…` cho `…pe…`. Ba bài `sn43.23`, `sn43.29`, `sn43.36` Pāli tách hai khoá ⇒ “Listen.” / “And what is X? …”. Tên của 30 đối tượng lấy **nguyên** chữ tầng ghim ở `X:1.1` (the undefiled, the truth, the far shore, … extinguishment, … the refuge) để không lệch thuật ngữ.

  **Nhãn thứ tự:** `sn43.43:1.3` `Bāttiṁsatimaṁ.` ⇒ “Thirty-second.” Đếm từ `sn43.12` là bài thứ nhất của phẩm 2, nên `sn43.43` là thứ 32 — khớp số bài.

  **Nháy:** 34/34 khớp Pāli (0 nháy). **Dấu lược:** Pāli 30 dấu (đếm `…pe…` = 1), lớp lấp 30, khớp từng khoá.

  **Đo hai cơ chế khoá trống:** cắt cụt dãy = 0; bỏ dòng song song = 2 nhóm / 30 khoá. Tầng ghim tự thêm `…` ở cả 30 khoá `X:1.1` (Pāli viết đủ câu “Tôi sẽ giảng … và con đường đưa đến …”), và 6 trong số đó ngắn hơn 35% Pāli — tức tầng ghim **cắt cụt** chính câu mở; lớp lấp không chạm được vì khoá đã có chữ.

  **Coverage:** mẫu số 58; trước 30/58 = 0,5172 (**dưới ngưỡng**); sau khi `published` 58/58 = 1,0. Độ nhạy: mất thêm hơn 11 khoá mới rớt dưới 0,8. Lưu ý giới hạn: 30 khoá `X:1.1` được tính “đã phủ” dù lời ghim chỉ là cụm danh từ — `ratio` lạc quan ở bài này. Bài **có** record trong `content/meta/reference-gaps.yaml`; sau khi `published` record thành thừa — để người điều phối chạy lại `npm run reference:gaps`.

  Triangulation 8.0 (trần của luật): scorecard tiếng Việt của bài này (`content/meta/sutta/…`) ghi `quality.assessed_by` **trùng họ công cụ** với lớp lấp (alias khai trong `source/tooling.yaml`). Vì vậy bản lấp này **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English nhờ lớp lấp. Đối chiếu đã có: Pāli root (authority) + lời Sujato đã ghim của chính bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

  Tự kiểm bằng máy trước khi ghi: JSON parse; mọi khoá ⊆ `fillableSegments` của bài; không khoá nào trùng khoá tầng Sujato đã có chữ (0 shadow); NFC; không khoá rỗng; dấu lược đếm theo luật `…pe…` = đúng một `…` — khớp Pāli ở mọi khoá; nháy đếm theo luật `’` + chữ thường = dấu nháy lửng (apostrophe) tiếng Anh, còn lại là nháy đóng.

  technical_integrity 9.6: lát này không được chạy cổng kỹ thuật, nên **không** tuyên bố technical gate pass. Bốn lệnh còn nợ cho người điều phối: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Đây không phải blocker (cổng chặn ở validation failure, không chặn ở chưa chạy).
