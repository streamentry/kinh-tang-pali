notes: |-
  1.2 đã ghim: "One meditator is skilled in projecting the mind purified by immersion but
  not in practicing carefully for it. …”". `abhinīhārakusalo` = "projecting the mind
  purified by immersion" và `sakkaccakārī` = "practicing carefully for it", cả hai lấy từ
  1.2. Đếm trong SN đã ghim: "projecting the mind purified by immersion" 6 lần,
  "practicing carefully" 6 lần.

  Một lựa chọn có chủ ý, ghi lại: vế thứ hai ở 1.3 viết đủ "projecting the mind purified
  by immersion" chứ không rút "by it", vì "purified by it" trong câu phủ định sẽ trôi và còn
  gợi nhầm sang "mind". Ở 1.4 và 1.5 thì giữ "practicing carefully for it" đúng như 1.2 —
  đây là khuôn của bản đã ghim: vế là hành động tương đối với định thì dùng "for it"
  (1.2, sn34.51:1.1, sn34.52:1.1, sn34.54:1.1), còn vế là một phạm vi riêng thì gọi đủ
  danh từ. `grammar_logic` và `ambiguity_integrity` hạ nhẹ vì đây là lựa chọn dịch.

  Bất định thật sự: Pāli 1.3–1.5 không có chủ ngữ; bản đã ghim đã gộp cả bốn vế vào 1.2.
  Bản lấp để mảnh câu không chủ ngữ cho khớp bản Việt canonical, nên `vietnamese_clarity`
  hạ. `triangulation` 8.0 là đặc thù của lớp lấp.
