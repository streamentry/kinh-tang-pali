notes: |-
  1.5/1.7/1.9 lặp cấu trúc của 1.3, vế đã được ghim: "Thus that form will be given up, cut off
  at the root, made like a palm stump, obliterated, and unable to arise in the future." Chỉ thay
  danh từ, và tên danh từ lấy đúng từ các khoá liền kề đã ghim sẵn: 1.4 ghim "feeling",
  1.6 ghim "perception", 1.8 ghim "choices". Vế về bản dịch vì vậy là bản sao y hệt của lời ở
  1.3 chứ không phải bản dịch mới — đó là luật 3.

  Số nhiều ở 1.9: Pāli `te saṅkhārā pahīnā bhavissanti` là số nhiều (khác `sā vedanā` và
  `sā saññā` ở 1.5/1.7), nên dịch "those choices … will be given up" cho khớp.

  Tra đếm trong tầng: cụm "will be given up, cut off at the root, made like a palm stump,
  obliterated, and unable to arise in the future" có 10 lần, riêng với form/consciousness thì
  5 lần mỗi hình. Không có bất định.
