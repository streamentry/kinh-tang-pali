notes: |-
  Lớp lấp: 5 khoá `2.4`–`2.8`, là cặp "giả định – kết luận" của **phong giới** (cơn gió), cặp thứ ba
  trong bốn phần tử. Chúng lặp lại y hệt sáu khoá ở `1.2`–`1.7` về **thổ giới**, mà cả sáu đều đã
  được bản Anh đã ghim dịch. Nên lớp lấp thay đúng tên phần tử và giữ nguyên mọi cấu trúc khác:

  - `2.4` = `1.3` → "But since there is gratification in the air element, sentient beings are aroused
    by it."
  - `2.5` = `1.4` → "If the air element had no drawback, sentient beings wouldn’t grow disillusioned
    with it."
  - `2.6` = `1.5` → "But since the air element has a drawback, sentient beings do grow disillusioned
    with it."
  - `2.7` = `1.6` → "If there were no escape from the air element, sentient beings wouldn’t escape
    from it."
  - `2.8` = `1.7` → "But since there is an escape from the air element, sentient beings do escape
    from it."

  **Hai dạng câu giả định phải giữ khác nhau, và lớp lấp giữ theo bản đã ghim.** Vế về `assādo`
  ("vị ngọt") ở `1.2`/`2.3` là "If there were no gratification in the … element …", còn vế về `ādīnava`
  ở `1.4` là "If the … element had no drawback," — một dạng "had" khác hẳn. Vì `2.5` và `2.7` trùng với
  `1.4` và `1.6` chứ không trùng với `1.2`, lớp lấp theo đúng mẫu của từng vế. Đồng nhất hoá ba vế
  "giả định" thành một dạng là tuỳ ý văn phong, không phải lỗi, nhưng sẽ làm bài tự lệch với chính
  phần đã dịch.

  **Đối chiếu bản Việt đã có — bản này ĐÃ có, và nó khớp.** `sn14.33` là một trong ba bài trong lát
  này có bản Việt trong `content/translation/vi/project/` (trạng thái `published`): "Nhưng vì có vị
  ngọt nơi phong giới, nên các chúng sinh đắm nhiễm nơi phong giới" cho `2.4`, "…sẽ không nhàm chán
  nơi phong giới" cho `2.5`, "…sẽ xuất ly khỏi phong giới" cho `2.7`–`2.8`. Dùng để đối chiếu nghĩa,
  không dịch vòng qua. Vì đã đọc bản Việt, điểm này KHÔNG được tính là đối chiếu chéo bằng tiếng Anh.

  `triangulation` bị chặn ở 8.0: không có bản Anh độc lập nào để đối chiếu; năm khoá chỉ là bản sao
  của bản đã ghim trong cùng tầng.
