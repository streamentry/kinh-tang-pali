notes: |-
  **Phân loại 24 khoá (đo bằng máy): A = 1 · B = 17 · C = 6 · D = 0.**
  Bài có hai lượt **thuật lại**: các du sĩ nói phép tu của họ giống hệt (`4.2–4.6`), rồi các tỳ-kheo kể lại toàn bộ chuyện
  cho Đức Phật (`6.1–10.2`). Tầng đã ghim tóm cả lượt kể bằng `5.4` “…and told him what had happened.” và để trống
  `6.1–10.2`; Pāli viết đủ nên lớp lấp viết đủ, theo lời của chính tầng đã ghim ở `1.2–5.3`.

  **A — 1 khoá:** `9.1` ← `4.1` (“We too teach our disciples in just the same way.”).
  **B — 17 khoá:** `4.3`, `4.4`, `8.3`, `8.4`, `9.3`, `9.4` (0,90): chỉ cụm “a heart full of compassion / rejoicing” +
  `…`; `4.5`/`4.6`, `8.5`, `9.5` (0,90–1,00 với `3.5`); `6.1` (0,82 với `1.2`, chuyển ngôi “we”); `6.3` (1,00 với `1.4`,
  nháy đơn theo Pāli); `7.2` (0,92 với `2.2`); `8.1` (1,00 với `3.1`, nháy đơn); `8.2` (0,90 với `3.2`); `9.6` (1,00 với `4.7`,
  **không** đóng nháy vì Pāli `anusāsaninti?` không có `”`); `10.2` (1,00 với `5.3`, nháy `’”` theo Pāli).
  **C — 6 khoá:** `4.2` và `9.2` (Pāli **trùng nhau**, lời trùng nhau; khác `3.2` ở `āvuso` → “reverends”), `6.2`,
  `7.1` (vế đầu lấy lời `1.5`, vế sau lấy lời `2.1`), `10.1`, và nhãn `15.11` `Catutthaṁ.` → “Fourth.” (`sn46.54` là bài
  thứ tư của phẩm `sn46.51–60`, nhãn khớp vị trí).

  **Cố ý lệch tầng đã ghim (2 chỗ).** (1) `3.5` đã ghim viết “they spread a heart full of equanimity” — chữ “they” lạc
  trong một câu mệnh lệnh (`3.2–3.4` đều viết “spread …”); `4.6`, `8.5`, `9.5` viết “spread” theo `3.2–3.4` và theo Pāli
  `viharathā`. (2) `4.5`, `8.5`, `9.5` viết chữ thường “meditate spreading …” vì đứng sau khoá kết bằng `…`.

  **Nháy — một chỗ Pāli tự lệch.** `8.2` Pāli mở nháy **kép** `“etha tumhe, bhikkhave …` nhưng `8.5` đóng bằng nháy
  **đơn** `…viharathā’ti.` Lớp lấp khớp Pāli **từng khoá** (8.2 `“`, 8.5 `’`) theo luật, không tự cân. 24/24
  khoá khớp Pāli.
  **Dấu lược:** Pāli của các khoá lấp có 9 dấu (`…pe…` tính một), lớp lấp 9; không mở rộng chỗ lược nào.
  **Khoá trống còn lại: 0.**

  **Hai cơ chế khoá trống:** cắt cụt dãy = 2 dãy / 23 khoá / 2.434 ký tự Pāli; bỏ dòng song song = 4 nhóm / 12 khoá (≤ 24).

  **Coverage (đo theo quy tắc kho: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước lát: 57/73 = 0.7808; sau khi lớp lấp `published`: 73/73 = 1.0000 (16 khoá lấp có nội dung). Độ nhạy: ngưỡng 0,8 cần 59 khoá; còn dư 14, mất 15 khoá thì rớt ngưỡng. Nếu lớp lấp không `published` thì coverage giữ nguyên 0.7808.
  Hệ quả với `content/meta/reference-gaps.yaml`: `sn/sn46.54` **có** record (16 khoá thiếu, coverage 0,7808). Sau khi lớp
  lấp `published`, record này thành **thừa**; theo chỉ dẫn, lát **không** sửa tệp đó — người điều phối chạy lại
  `npm run reference:gaps` khi gom.

  Triangulation 8.0: metadata Việt của bài này (`content/meta/sutta/sn/sn46.54.yaml`) ghi `quality.assessed_by` cùng **họ công cụ** với lớp lấp (`source/tooling.yaml`), nên lớp lấp này **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English nhờ lớp này. Đối chiếu có: Pāli root + Sujato đã ghim + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng). Không có bản Anh thứ hai cho các khoá lấp. Không chạm tầng Việt.

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, để người điều phối chạy khi gom. Tự kiểm bằng máy đã làm: JSON parse, mọi khoá ⊆ `fillableSegments` của bài, không khoá nào trùng khoá Sujato có chữ (0 shadow), không khoá rỗng, NFC, dấu lược khớp quy tắc `…pe…` = một `…`, khoá theo thứ tự Pāli, YAML parse, `final_score` = trung bình số học thô.
