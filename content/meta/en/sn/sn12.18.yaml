notes: |-
  Lớp lấp: 5 khoá (`3.2`, `3.3`, `3.4`, `3.6`, `3.7`) nằm ở tiết ba, nơi bản Anh đã ghim đã lược.
  Cả năm đều nằm trong lời Timbaruka **kể lại** sáu câu hỏi ông đã đặt ở `2.1`–`2.8`.

  **Cặp Pāli trùng nguyên văn, dùng lại y nguyên bản đã ghim:**
  - `3.2` `‘Kiṁ pana, bho gotama, paraṅkataṁ sukhadukkhan’ti…` = câu hỏi ở `2.3` → "Then are
    pleasure and pain made by another?"
  - `3.3` `sayaṅkatañca paraṅkatañca` = `2.5` → "Well, are pleasure and pain made by both oneself
    and another?"
  - `3.4` `asayaṅkāraṁ aparaṅkāraṁ adhiccasamuppannaṁ` = `2.7` → "Then do pleasure and pain arise
    anomalously, not made by oneself or another?"

  **Không đặt dấu hỏi trong ngoặc.** Pāli ở `3.2`–`3.4` là `sukhadukkhan’ti`, không có `?` (chỉ
  `2.3`, `2.5`, `2.7` mới là `sukhadukkhanti?`). Bản đã ghim ở `3.1` cũng không dấu hỏi: "…you say
  ‘not so’." Vì vậy ba khoá mở bằng `When asked ‘…’, you say ‘not so’.` thay vì lặp lại khung
  `“Worthy Gotama, when asked …”` của `3.1`. Cùng luật, cùng hình dạng Pāli với lát `sn12.17`.

  **Bỏ danh xưng trong `mā hevaṁ, timbarukā’ti`.** Bản đã ghim ở `3.1` đã dịch chính câu đó thành
  "you say ‘not so’." — không có tên. Giữ "Timbaruka" ở `3.2`–`3.4` sẽ khiến bài tự mâu thuẫn với
  dòng ngay trên nó. Đây là lý do phải lệch, không phải ý bị bỏ.

  **`3.6` là chỗ bản đã ghim đã nén.** Pāli `3.5`–`3.6` là MỘT câu: `‘Kiṁ nu kho … natthi
  sukhadukkhan’ti iti puṭṭho samāno ‘na kho, timbaruka, natthi sukhadukkhaṁ; atthi kho, timbaruka,
  sukhadukkhan’ti vadesi.` Bản đã ghim gộp cả hai khoá thành một câu "Yet you say that there is such
  a thing as pleasure and pain." — tức đã nuốt mất `atthi kho, timbaruka, sukhadukkhan’ti`. Lớp lấp
  vẫn dịch `3.6`, nên **ý bị nói hai lần**. Giữ nguyên: bỏ đi thì cột Anh mất nghĩa so với Pāli;
  chèn "and indeed" để chững lại thì vô căn cứ. Dấu `’` đóng của lời trích dẫn nằm ở `3.6`, và
  `3.6` cũng giữ lại danh xưng `Timbaruka` mà `3.5` đã mất.

  **LỆCH CỐ Ý Ở `3.7` — biên tập cần biết.** Bản đã ghim dịch câu hỏi `Tena hi bhavaṁ gotamo
  sukhadukkhaṁ na jānāti, na passatīti?` ở `2.12` là "Then does the worthy Gotama not know or see
  **suffering**?" — rơi mất chữ "hỷ". Dùng lại y cụm đó ở `3.7` sẽ khiến câu hỏi nói "suffering"
  trong khi câu trả lời ngay sau nói "pleasure and pain" (`2.13` đã ghim, và `3.8`–`3.9` đã ghim
  cũng vậy). `sukhadukkha` là từ ghép = hỷ lạc và khổ đau. Vì vậy `3.7` giữ "pleasure and pain" ở
  CẢ câu hỏi lẫn câu trả lời, và đó là lệch so với bản đã ghim — cố ý, vì lý do tự mâu thuẫn nếu
  không lệch.

  **Số dấu nháy từng khoá** (đếm theo ba nghĩa của `’`): `3.2`, `3.3`, `3.4` mỗi khoá 2 mở – 2 đóng;
  `3.6` 1 mở – 1 đóng. `3.7` mở 2 – đóng 1: nửa còn lại đóng ở `3.9` (`sukhadukkhan’ti vadesi`), nên
  `3.7` dừng ở dấu chất câu chứ không đóng ngoặc, giống hệt `sn12.17:4.6`.

  **Bài này chưa có bản Việt trong `content/translation/vi/project/`.** Chỉ có tiêu đề
  `Timbarukasutta` ở khoá `:0.3` của bản Anh đã ghim; không có bản Việt đã công bố để đối chiếu
  nghĩa, nên `vietnamese_clarity` hạ. `triangulation` bị chặn ở 8.0 vì không có bản Anh độc lập nào
  để đối chiếu; không được hiểu là đã đối chiếu chéo bằng tiếng Anh.
