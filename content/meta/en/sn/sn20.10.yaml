notes: |-
  1.9 và 1.10 lặp NGUYÊN VĂN 1.4 và 1.5, đã được ghim, nên lấy y hệt (luật 3).

  1.7 là vế `idha, bhante, aññataro bhikkhu …` mới, nhưng bộ từ thì đã có sẵn ở 1.2 của chính
  bài: "a certain mendicant" + "had relations with families too often". Tra đếm trong tầng:
  "a certain mendicant" 25 lần. `idha, bhante` dịch "Sir," theo sn21.10:1.5 (cùng cụm Pāli,
  đã ghim "Sir, there’s a certain mendicant…"). Thì hiện tại `āpajjati` giữ "has", khác "had"
  của 1.2 vì 1.2 là `āpajjati` nhưng kể chuyện quá khứ.

  Bất định về hình thức đã ghi nhận: Pāli 1.9 kết `‘…’ti.` (nháy đơn + `ti`), còn 1.4 kết
  `“….”`. Lớp lấp đã có khuôn cho khuôn này và khuôn là `…’.` — ngoặc đóng rồi dấu chấm —
  (xem mn111:21.3, mn111:22.3, an5.176:2.3, an6.37:5.5, cùng hình với Pāli `‘…’ti.`). 1.9
  vì vậy kết `often’.` chứ không phải `often.”`. Vế trong nháy vẫn y hệt lời ở 1.4.
