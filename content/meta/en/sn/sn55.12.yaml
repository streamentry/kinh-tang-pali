notes: |-
  3.2: bản đã ghim đã dịch ĐÚNG vế này hai lần trong chính bài (2.3 và 3.9) thành
  “which does lead solely to disillusionment, dispassion, cessation, peace, insight,
  awakening, and extinguishment.” Giữ nguyên tiền tố và đuôi, rút gọn phần bị lược.
  Dấu hỏi ở cuối là của Pāli (`saṁvattati?`), giữ nguyên.

  3.4: vế `itipi so bhagavā arahaṁ sammāsambuddho …pe… satthā devamanussānaṁ buddho
  bhagavāti;` — Sujato đã dịch đúng dạng có `arahaṁ sammāsambuddho` HAI lần trong tầng
  đã ghim (sn40.10:38.2 và an8.76:5.3): “That Blessed One is perfected, a fully awakened
  Buddha … teacher of gods and humans, awakened, blessed.” Dùng lại đúng bộ từ đó.
  Dạng KHÔNG có `arahaṁ sammāsambuddho` thì dùng khuôn 17 tệp — cùng file này không thể
  dùng lẫn hai khuôn, và ở đây Pāli CÓ `arahaṁ sammāsambuddho` nên dạng Sujato là đúng.

  Pāli kết bằng `;` chứ không phải `ti.`, và không có ngoặc đóng ở khoá này, nên bản Anh
  cũng vậy: không thêm `”`. (Hai tệp fill đã có, sn55.7:11.2 và sn55.44:2.3, cũng chuẩn
  hoá `;` thành `.` — ở đây tôi cũng vậy.)
