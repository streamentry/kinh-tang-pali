notes: |-
  3.4/3.13 deliberately do NOT copy 3.19 verbatim even though the Pali is identical there.
  Sujato's 3.19 adds an opening quote, a question mark, and the expansion what's impermanent,
  suffering, and perishable. This segment's Pali has no quote, no question mark, and ends in
  a colon, so the fill follows Sujato's lead-in style at 1.2 (does the view arise: with a
  colon) and keeps that for tam, which at this point refers only to what was just asked.
  3.15/3.21 reuse the tail of 1.7 (... there is no merit or outcome of merit'?", Sujato
  merging natthi ... natthi ... into or). Triangulation is capped at 8.0.
