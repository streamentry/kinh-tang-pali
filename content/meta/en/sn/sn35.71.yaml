notes: |-
  Tiền lệ: `sn35.71:5.1` (mắt) và `sn35.71:9.1` (tâm) của **chính bài này** đã có chữ Sujato — ““Good, mendicant! And regarding the [eye|mind], you will truly see clearly with right wisdom that: ‘This is not mine, I am not this, this is not my self.’” 7.1 chỉ thay bằng `jivhā` = “tongue” (theo `5.3` của bài này và `sn35.72:6.1`). `sudiṭṭhaṁ bhavissati` → “will truly see clearly with right wisdom”, giữ nguyên; ở `sn35.5`/`sn35.6`/`sn35.210-212` cùng gốc `sammappaññāya` lại là “right understanding” — hai cách khác nhau theo bản đã ghim của từng bài, giữ nguyên để không tự mâu thuẫn.

  Ngoặc: `“` ngoài mở từ `3.1` và khép ở `9.2` (“…end of suffering.”), nên 7.1 chỉ mở và đóng ngoặc trong ở `self.’`. Khoá 6.1, 7.2, 9.3 cũng fillable nhưng không thuộc lát này.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
