notes: |-
  Tiền lệ: 2.5 chép từ 2.1 (`cakkhusamuddaṁ`) và 2.9 (`manosamuddaṁ`) của chính bài, đã ghim — chỉ
  thay eye→tongue; 2.3 đã ghim xác nhận jivhā = "tongue".

  2.6: Pāli `tiṇṇo pāraṅgato thale tiṭṭhati brāhmaṇo …pe…` GIỐNG HỆT 2.2, đã ghim, nhưng Sujato BỎ
  MẤT dấu lược ở đó. Luật 2 của lớp lấp cấm mở rộng `…pe…` và luật 4 bắt số dấu lược khớp từng
  khoá, nên 2.6 giữ đúng một `…` ở cuối. Lớp fill đã làm y vậy: sn35.106:2.11 ("…tastes …") và
  sn35.138:1.7 ("…welfare and happiness. …"). Đây là chỗ duy nhất trong lát này bản dịch CỐ Ý khác
  bản đã ghim, nên `ambiguity_integrity` 9.4.

  Lưu ý khi đọc: 2.3 đã ghim "For a person, the ear … nose … tongue … body …" và 2.4 (lát khác) là
  `tassa rasamayo vego.`, nên 2.5 của tôi rơi đúng vào nhánh lưỡi, không lệch.
