notes: |-
  **Phân loại 13 khoá (máy đo, so Pāli đã chuẩn hoá với các khoá đã có lời): A = 6 · B = 6 · C = 1 · D = 0.** Cả 13 khoá thuộc phần *thuật lại* (`5.1`–`7.2`, tức các tỳ-kheo kể với Đức Thế Tôn đúng những gì đã xảy ra ở `1.x`–`4.x`) và dòng đánh số cuối bài (`16.4`); tầng đã ghim bỏ trống chúng vì lặp.

  **Nhóm A (6 khoá): `5.3`, `5.4`, `6.2`, `6.3`, `6.4`, `7.2` — dùng lại từng chữ lời đã ghim ở `1.3`, `1.4`, `3.3`, `3.4`, `3.5`, `4.3`.** Pāli của mỗi cặp trùng từng chữ (chỉ khác dấu nháy). Lấp giữ nguyên văn lời Sujato; điều **duy nhất** đổi là dấu nháy, vì Pāli của khoá thuật lại lồng nháy một tầng sâu hơn so với khoá gốc: `1.3` mở nháy kép “, còn `5.3` mở nháy đơn ‘ (lời các tỳ-kheo nay nằm *trong* lời kể), và tương tự cho `5.4`, `6.3`, `6.4`, `7.2`. Số nháy của từng khoá đã đo khớp Pāli (xem bên dưới). `6.2` giống hệt `3.3` “We too teach our disciples:”.

  **Nhóm B (6 khoá): dựng lại từ lời đã ghim, đổi ngôi và bổ sung phần bị nuốt.** · `5.1` từ `1.1` (0,82): đổi “several mendicants … entered” thành “we robed up … entered”; Pāli `5.1` có thêm `Idha mayaṁ, bhante` nên thêm “Sir,”. · `5.2` từ `1.2` (0,62): Pāli `Tesaṁ no, bhante, amhākaṁ etadahosi` là “it occurred to us”; khoá đã ghim `1.2` dịch “it occurred to him” (dạng số ít) nên lấp dùng số nhiều “us” theo Pāli, **không** giữ “him”. · `5.5` từ `2.1` (0,90) và `5.6` từ `2.2` (0,93): chỉ đổi “they” thành “we”, “to them” thành “to us” (Pāli `pakkamiṁsu` → `pakkamimha`, `nisīdiṁsu` → `nisīdimha`). · `6.1` từ `3.1`+`3.2` (0,83 với `3.2`): Pāli `6.1` nhập lời Samaṇa Gotama (`3.1`) với lời dạy lồng trong nháy kép (`3.2`), nên lấp ghép đúng hai khoá đã ghim. · `7.1` từ `4.1`+`4.2` (0,70 với `4.1`): Pāli `7.1` nhập `4.1` và `4.2` vào một khoá; lấp ghép lại và đổi ngôi.

  **Nhóm C (1 khoá): `16.4`.** Pāli `Dutiyaṁ.` là nhãn thứ tự (mục 5e của quy ước lát): dùng khuôn “Second.” theo 41 khoá đã có. Khoá này dưới ngưỡng 40 ký tự, không tính coverage. Nhãn đứng một mình sau Pāli `16.3`, bài không có khối nào được đánh số để đối chiếu, nên không có cảnh báo lệch số mục.

  **Nháy.** Cả 13 khoá khớp Pāli từng khoá, đo bằng đếm: `5.1` “1 · `5.3` ‘1 · `5.4` ’1 · `6.1` ‘1 “1 ”1 · `6.3` “1 ”1 · `6.4` ’1 · `7.2` ‘1 ’1 ”1; các khoá còn lại 0. Pāli nháy chạy qua ranh giới khoá (`5.1` mở “ mà không đóng; `5.3` mở ‘ mà không đóng; `5.4` đóng ’; `6.4` đóng ’; `7.2` đóng ’” ) và lấp theo đúng như thế.

  **Dấu lược:** Pāli 13 khoá không có `…pe…`; lấp có 0 dấu `…`.

  **Số khoá trống còn lại: 0.** Cả 13 khoá `fillableSegments` đã lấp, trong đó 11 khoá có nội dung (≥ 40 ký tự).

  **Coverage — chạm sát ngưỡng, và là chỗ nhạy nhất của lát.** Mẫu số 57. Trước lớp lấp: 46/57 = **0,8070**; ngưỡng 0,8 cần tối thiểu 46 khoá, tức bài đạt đúng ngưỡng, không còn biên an toàn (mất thêm 1 khoá là 45/57 = 0,7895). Sau khi `published`: 57/57 = **1,0000**, cách ngưỡng 11 khoá. Bài `sn46.52` **không** có record trong `content/meta/reference-gaps.yaml` (và vì trước lớp lấp đã đạt ngưỡng) nên không record nào thành thừa vì lớp lấp.

