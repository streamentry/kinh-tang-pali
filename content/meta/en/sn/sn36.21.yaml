notes: |-
  3.9 và 3.11 có Pāli giống nhau: `Yathā kammavipākajānipi idhekaccāni vedayitāni uppajjanti;` Vế
  sau dịch theo 3.7 của chính bài, đã ghim ("Some feelings are the result of past deeds."). Mở đầu
  `Yathā …` đếm được trên toàn tầng: "as" 1105 lần mở đầu bản Anh đã ghim, "like" 403, "just as"
  72 → chọn "as".

  BẤT ĐỊNH: Ở phần 2 (2.2 và 2.3, đã ghim) Sujato ĐÃ BỎ HẲN mệnh đề `yathā … uppajjanti` — "You
  can know this from your own personal experience," và "and it is generally deemed to be true." Ở
  phần 3, Pāli tách mệnh đề đó thành khoá riêng (3.9, 3.11) nên tôi phải dịch, và sự lặp "as some
  feelings are the result of past deeds;" xuất hiện HAI LẦN là đúng Pāli (3.9 và 3.11 thật sự lặp
  lại câu đó). Tôi không gộp và không bỏ. Người đọc phần 2 sẽ thấy thiếu vế "as …" so với phần 3;
  chỗ thiếu đó ở bản đã ghim, không phải ở bản lấp. `ambiguity_integrity` 9.3 vì phải nói rõ sự
  lệch cấu trúc này.
