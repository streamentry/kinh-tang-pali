notes: |-
  1.2 đã ghim: "One meditator is skilled in positivity for immersion but not in the
  supports for immersion. …”". 1.3 đảo hai vế; 1.4 và 1.5 lấy "skilled neither in … nor
  in" (3 lần trong SN đã ghim) và "skilled both in … and in" (5 lần). `kallitakusalo` =
  "positivity for immersion" và `ārammaṇakusalo` = "the supports for immersion", cả hai lấy
  từ 1.2 đã ghim; đếm trong SN đã ghim: "positivity for immersion" 4 lần, "the supports
  for immersion" 1 lần (chính 1.2 ở đây).

  Bất định thật sự: Pāli 1.3–1.5 không có chủ ngữ (1.2 mới có, và bản đã ghim đã gộp luôn
  cả bốn vế vào 1.2). Bản lấp vì thế để mảnh câu không chủ ngữ, khớp với bản Việt
  canonical; `grammar_logic`, `ambiguity_integrity`, `vietnamese_clarity` hạ vì lý do đó.

  `triangulation` 8.0 là đặc thù của lớp lấp. `vietnamese_clarity` và `han_viet_balance`
  mang giá trị mặc định của lớp lấp.
