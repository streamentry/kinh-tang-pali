notes: |-
  Đây là vế `itipi so bhagavā …pe… satthā devamanussānaṁ buddho bhagavāti.` — CÙNG NGUYÊN VĂN Ở CẢ NĂM
  BÀI này, và bản Anh đã ghim đã dùng đúng vế đó 80 lần trong 12 bài khác: sn55.1:2.3, sn55.7:1.6,
  sn55.13:2.4, sn55.26:5.3, sn55.35:2.3, sn55.37:4.3, sn48.9:1.6, sn48.10:1.6, sn48.11:1.6,
  sn40.10:8.2, sn41.10:3.4, sn11.3:9.3 → "That Blessed One is perfected, a fully awakened Buddha,
  accomplished in knowledge and conduct, holy, knower of the world, supreme guide for those fit for
  training, teacher of gods and humans, awakened, blessed." Dạng có dấu lược ở giữa cũng đã có tiền
  lệ: sn40.10:38.2 giữ nguyên "…" đúng chỗ. Nên giữ đúng bộ từ đó, đặt `…` đúng vị trí Pāli lược mất
  (giữa `so bhagavā` và `satthā devamanussānaṁ`). Không mở rộng `…pe…` theo luật của lớp lấp: chữ bổ
  sung vào tầng Anh là chữ không nguồn nào cấp phép. Vì vậy vế này ngắn hơn hẳn vế không lược ở
  sn55.2:2.3, và đó là đúng, không phải lược chữ.
  
