notes: |-
  Bài này là một trong ba bài tệ nhất trong hàng đợi: **24/29** khoá bản Anh đã ghim trống, chỉ
  **5** khoá có chữ (`0.1`–`0.3`, `1.1`, `1.2`). Trong đó **14** khoá Pāli có nội dung (≥ 40 ký
  tự, bỏ khối `:0`) thì **13** trống ⇒ coverage **0,0714**. Lớp lấp này điền đủ **24** khoá.

  **Vì sao tầng ghim trống — đo, không đoán.** Không phải kiểu "gộp khoá" như ở `an4.183`:
  phép thực nghiệm (lời ghim của một khoá chứa ≥ 5 từ nội dung của khoá Pāli kế sau, đo **cả hai
  chiều** khoá kế và mọi khoá sau) cho ra **0** cặp. Giá trị dài nhất của cả tệp ghim là **61** ký
  tự (`1.1`). Tầng ghim **dừng sạch sau `1.2`**: 24 khoá còn lại trống, **1.095** ký tự Pāli nằm
  bị bỏ rơi. Nói cách khác đây là **cắt cụt**, không phải **dồn khối**; vì vậy không có nội dung
  nào bị in hai lần ở đây, và lớp lấp không phải chép lại phần đã có.

  **Bốn nhóm khoá (đếm bằng script, in ra cả bốn số): A = 0 · B = 10 · C = 14 · D = 0.**
  - **A = 0**: không khoá lấp nào trùng nguyên văn một khoá đã có lời ghim. Đo toàn bộ bài: **0**
    cặp Pāli trùng nhau (nên không có khoá nào buộc phải dùng lại nguyên văn).
  - **B = 10**: năm vế "tìm cầu" và năm vế "đã đạt được", dựng lại từ `1.1` và `1.2` của chính bài.
    Tỉ lệ khớp đo được (containment = |A∩B|/|A| trên tập từ của Pāli): `1.4` 0,50 · `1.7` 0,50 ·
    `1.14` **0,75** · `1.17` 0,50 · `1.20` 0,50 (mẫu `1.1`); `1.5` 0,75 · `1.8` 0,50 · `1.15`
    0,75 · `1.18` 0,50 · `1.21` 0,25 (mẫu `1.2`). Trung bình **0,550**. Phần tầng ghim nuốt mất
    và lớp lấp chèn lại: cả tên đối tượng ngoại xứ (`rūpānaṁ` → `sights` / `dhammānaṁ` →
    `ideas`), cả danh từ tìm cầu (`assāda`/`ādīnava`/`nissaraṇa`), cả `bhikkhave`.
  - **C = 14**: dịch thật từ Pāli, vì bài này không có lời ghim nào để dựa vào cho các vế đó.
    Containment với khoá ghim gần nhất đo được: sáu vế `Yāvatā … paññāya me so sudiṭṭho`
    (`1.3`, `1.6`, `1.9`, `1.16`, `1.19`, `1.22`) chỉ **0,00–0,29**; bốn vế bị lược `1.10`–`1.13`
    **0,00**; `2.1` **0,06**; `2.2`/`2.3`/`2.4` **0,00**. Nói thẳng: với 14 khoá này tầng ghim
    **không** phải bản dịch để đối chiếu, chỉ là tiền đề để giữ thuật ngữ.
  - **D = 0**: không có cặp Pāli trùng mà lời ghim khác nhau.

  **Nguồn chữ dùng để dựng lại, ghi rõ từng chỗ.** Bài anh em `sn35.15` (cùng phẩm, bản *Interior*
  của chính cặp này) đã ghim trọn công thức `Yāvatā … paññāya me so sudiṭṭho` (sáu lần) và
  đoạn kết `2.2`–`2.3`, nên lớp lấp dùng **đúng** khuôn của bản ghim ấy, chỉ thay đối tượng:
  - `1.3`/`1.6`/`1.9` ← khuôn ghim ở `sn35.15:1.3`/`1.6`/`1.9` ("…the full extent of the eye's …"),
    đổi `eye's` thành `sights`.
  - `1.16`/`1.19`/`1.22` ← khuôn ghim ở `sn35.15:1.23`/`1.26`/`1.29` ("…the mind's …"),
    đổi `mind's` thành `ideas` (`dhammānaṁ` = sáu ngoại xứ, không phải tâm).
  - `2.2` ← `sn35.15:2.3` ("Knowledge and vision arose in me:") — Pāli **trùng nguyên văn**.
  - `2.3` ← `sn35.15:2.4` ("'My freedom is unshakable; …'") — Pāli **trùng nguyên văn**.
  - Sáu xứ ngoại dùng đúng chữ của tầng ghim: `sights`, `sounds`, `smells`, `tastes`, `touches`,
    `ideas` (đếm trên tầng Anh đã ghim của cả phẩm: `sights` 194, `sounds` 55, `smells` 31,
    `tastes` 26, `touches` 27, `ideas` 139; và `six exterior sense fields` có **2** chỗ).
    `assāda` → "gratification", `āḍīnava` → "drawback", `nissaraṇa` → "escape": giữ nguyên chữ
    của `1.1`/`1.2` đã ghim.

  **Cố ý lệch bản Anh đã ghim, kèm lý do.**
  1. `1.5`/`1.8`/`1.15`/`1.18`/`1.21` viết `"and I found it."` **không** kèm `…` và **không** kèm
     `”`. Bản ghim ở `1.2` là `"and I found it. …” "` trong khi Pāli `1.2` = `Yo rūpānaṁ assādo
     tadajjhagamaṁ.` **không** có dấu lược và **không** có dấu nháy. Đây đúng loại lỗi mà lớp lấp
     phải sửa chứ không sao chép, nên năm vế lặp lại không mang theo hai dấu đó.
  2. `2.1` giữ **đúng một** `…` ở đúng chỗ Pāli có `…pe…`, và **không** dựng lại vế `Yato ca khvāhaṁ
     … abbhaññāsiṁ` mà bản ghim đã chèn vào `sn35.15:2.2`. Cụm "my supreme perfect awakening"
     lấy từ chính đoạn này được viết đủ ở `sn35.14:2.1`, không phải bịa; dấu `…` vẫn còn nguyên
     nên lược chưa bị xoá.
  3. `1.10`–`1.13` giữ hạt `-nāhaṁ` ("as for") và `bhikkhave`, dịch `"As for sounds, mendicants …"`.
     Bản ghim ở các bài khác trong phẩm hay bỏ `bhikkhave` ở chỗ liệt kê bị lược; ở đây bản Việt
     canonical giữ, nên giữ cho khớp.
  4. `2.1` đặt `bhikkhave` giữa câu ("As long as I didn't truly understand, mendicants, these six
     …") vì Pāli cũng đặt vậy; bản ghim ở `sn35.15:2.1` bỏ hẳn.

  **Dấu lược và nháy — đo trên từng khoá.** `…pe…` ở `2.1` ⇒ lớp lấp **một** `…` (Pāli khoá này có
  **2** ký tự `…` vì `…pe…`); bốn khoá `1.10`–`1.13` có `…` trần ⇒ mỗi khoá **một** `…`; mười
  khoá còn lại không `…` nên lớp lấp không thêm. Nháy kép Pāli mở ở `1.1` và đóng ở `2.3`, nháy
  đơn mở ở `2.3`: lớp lấp **không** khoá nào sinh nháy kép/đơn mới, và `2.3` mang đúng
  `’”`. Dấu nhạt lượu: lớp lấp có **11** dấu `’` = **9** dấu nhạt lượu (`I’ve` ×6, `didn’t` ×2,
  `there’ll`) + **2** dấu sở hữu (`fields’` ở `2.1`, và `…’”` ở `2.3` là nháy đóng Pāli). Quy tắc
  đo được trên tầng Anh đã ghim: `’` + (`s`|`t`|`ll`|`re`|`ve`|`d`|`m`) không theo sau bằng chữ cái
  (hiệu chuẩn trên cả phẩm: `’s` 568 · `’t` 310 · `’re` 174 · `’d` 56 · `’ve` 51 · `’m` 44 ·
  `’ll` 40). Bản ghim của riêng bài này có **0** dấu nhạt lượu, nên không có cái nào để đối chiếu.

  **Nhãn thứ tự.** `2.4` Pāli là `Catutthaṁ.` ⇒ `"Fourth."`, đúng khuôn 30 khoá nhãn đã có trong lớp
  lấp. Đếm toàn phẩm `sn35`: **129** khoá Pāli chỉ là nhãn thứ tự, **0** có lời ở tầng ghim,
  **129** trống. Bài này chỉ có **một** nhãn, và số của nó khớp: `sn35.15` kết `Tatiyaṁ.` (thứ
  ba), `sn35.16` kết `Catutthaṁ.` (thứ tư), `sn35.17` kết `Pañcamaṁ.` (thứ năm) — nhãn đếm bài
  trong phẩm, không đếm vế trong bài. **Không** có cảnh báo nào ở đây.

  **Coverage trước/sau và độ nhạy.** Mẫu số = **14** khoá Pāli có nội dung. Trước: **13** trống ⇒
