  trống, nên biên dự **11** khoá; đây không phải lá chắc mỏng. Ngược lại, nếu lớp lấp để `draft`
  thì `english-project` **không** được tính vào coverage và bài vẫn **0,0714**.
  **11/24** khoá trong lớp lấp có Pāli < 40 ký tự (`1.5`, `1.8`, `1.10`–`1.13`, `1.15`, `1.18`,
