notes: |-
  Tiền lệ mạnh: `sn37.15:2.1` có Pāli gần như y hệt và Sujato đã dịch "“Anuruddha, when ladies have
  five qualities, when their body breaks up, after death, they are reborn in a good place, a heavenly realm." —
  dùng y hệt. `mātugāmo` → "ladies" (số nhiều, đúng sn37.15:2.1/2.4 và sn37.5:2.1); `sugatiṁ saggaṁ lokaṁ` →
  "a good place, a heavenly realm" (đúng dn33:2.1.34 của bản đã ghim).

  `…pe…` không có ở khoá này nên không thêm gì cả.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
