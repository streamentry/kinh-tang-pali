  **Nhãn thứ tự `3.15`–`3.16` và tiêu đề `4.0` — theo khuôn, có tiền lệ đo được.**
  `Dasamaṁ.` → **"Tenth."**: tiền lệ **trùng byte** của chính lớp lấp là `an3.70:40.5` (`Dasamaṁ.` →
  "Tenth."). `Channavaggo catuttho.` → **"The Channa Chapter, fourth."**: tiền lệ cùng khuôn là
  `an7.43:7.8` (`Devatāvaggo catuttho.` → "The Deities Chapter, fourth.") và `an3.70:40.6`
  (`Mahāvaggo sattamo.` → "The Great Chapter, seventh."). `Tassuddānaṁ` → **"Its summary verse:"**:
  tiền lệ `an3.70:41.0` và `an7.43:8.0`. `catuttho` = **fourth** đã kiểm chéo hai cách: Pāli của bài anh em
  cùng phẩm `sn35.83:3.5` là `Gilānavaggo tatiyo.` (Sujato đặt vāgga ấy là "8.") ⇒ chữ số hiển thị của
  SuttaCentral và số thứ tự trong Pāli lệch nhau một bậc, `9.` của Channavagga phải ứng `catuttho`, và
  `Dasamaṁ.` ứng `sn35.92:1.7` `Navamaṁ.` (bài thứ chín) + `sn35.93` là bài thứ mười. Đo toàn tầng Anh đã
  ghim: **0** khoá nào có lời cho `Tassuddānaṁ`, `Dasamaṁ.` hay `…vaggo …tho.` — tức cả ba đều là khuôn
  **của lớp lấp**, không phải tiền lệ ở tầng ghim; ghi rõ để người đọc sau không tưởng lớp lấp sao chép
  tầng đã ghim.

  **Tám khoá dưới ngưỡng 40 ký tự không tính vào coverage — nói thẳng cả tám khoá đó.**
  Trong 19 khoá lấp, **11** khoá có nội dung (`2.3`–`2.13`, trong đó `2.3` đúng **40** ký tự và `2.2` chỉ
  **38** nên rớt) và **8** khoá dưới ngưỡng: `2.2` (38), `3.15` (`Dasamaṁ.` 9), `3.16` (21), `4.0` (12),
  `4.1` (23), `4.2` (23), `4.3` (19), `4.4` (21). Tám khoá này **không** góp một đơn vị nào cho coverage —
  ngưỡng 40 ký tự là quy tắc của kho, và `englishCoverageFor` bỏ chúng ra khỏi mẫu số **và** khỏi tử số.
  Vậy mà lát này vẫn lấp đủ chúng, và đây là lý do: đây đúng là **chỗ trống người đọc thấy rõ nhất** của bài.
  Người đọc đọc tới cuối bài sẽ thấy `1.15` có câu, `2.1` có câu, rồi `3.14` có câu, rồi **một dải trống
  không nhãn** — không có "Tenth.", không có "The Channa Chapter, fourth.", không có mục lục của phẩm; và
  dải trống ấy nằm **ngay dưới** hai câu đã dịch, nên nó đọc như bản dịch bị cắt cụt chứ không như chỗ lược.
  Đặc biệt `4.1`–`4.4` là **bảng mục lục của cả phẩm Channavagga** — thứ mà người đọc cần để biết mình đang
  ở đâu, và là nơi duy nhất mười tên bài của phẩm được liệt kê.

