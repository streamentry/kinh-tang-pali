notes: |-
  Lát 602. Mười tám khoá lấp = mười tám khoá tầng Anh đã ghim để trống; 16 khoá có nội dung, 2 khoá dưới ngưỡng
  (`8.3` `na saṅkhāravantaṁ vā attānaṁ;` 29 ký tự, nhãn `9.7` `Sattamaṁ.`) vẫn lấp.

  **Bốn nhóm khoá (đo bằng máy trên 58 khoá Pāli):** A **4** · B **4** · C **10** · D **0**.

  - **A — `3.5`, `4.6`** (Pāli trùng `2.7`/`5.5`) và **`7.5`, `8.7`** (trùng `6.7`/`9.5`): dùng lại nguyên văn
    “So they become frightened, worried, concerned, and anxious because of grasping.” và “So they don’t become
    frightened, worried, concerned, or anxious because of grasping.”
  - **B — `3.4`, `4.5`** (từ `2.6`, tỉ lệ 0,86) và **`7.4`, `8.6`** (từ `6.6`, 0,88): chỉ thay danh từ uẩn
    (`vedanā` → “feeling”, `saṅkhārā` → “choices”), giữ nguyên khung đã ghim (“Anxieties occupy their mind, born of
    latching on to the perishing of …, and originating in accordance with natural principles” / bản phủ định có
    gạch ngang).
  - **C — `3.2` `3.3` `4.3` `4.4` `7.2` `7.3` `8.4` `8.5`**: cặp “biến hoại → thức chạy theo”. Tầng đã ghim
    dịch cặp này cho sắc và thức (`2.4`/`2.5`, `5.2`/`5.3`, `6.4`/`6.5`, `9.2`/`9.3`) nhưng để trống cho thọ và hành
    ở cả hai vế. Lớp lấp dựng theo đúng khung ấy; `saṅkhārā` số nhiều ⇒ “those choices of theirs decay and perish”.
  - **C — `8.3`**: Pāli đặt `na saṅkhāravantaṁ vā attānaṁ` **sau** `8.2` (thứ tự khác `2.3`/`6.3`, nơi
    `rūpavantaṁ` đứng thứ hai). Lớp lấp giữ đúng vị trí Pāli (“nor self as having choices;”), không đảo lại.
  - **C — `9.7`** nhãn thứ tự “Seventh.”; bài là bài thứ bảy của phẩm (`0.2` “Nakula’s Father”), khớp nhãn.

  **D ở chính tầng đã ghim — báo, không hòa.** Pāli `2.4` và `6.4` trùng nguyên văn (`Tassa taṁ rūpaṁ vipariṇamati
  aññathā hoti.`) nhưng lời đã ghim khác nhau (“But that form …” / “When that form …”), vì vế khẳng định và vế phủ
  định có cú pháp nối khác nhau. Lớp lấp theo đúng vế của mình: `3.2`/`4.3` dùng “But …”, `7.2`/`8.4` dùng “When …”.
  Hệ quả đo được: 2 cặp Pāli trùng trong lớp lấp (`3.2`↔`7.2`, `4.3`↔`8.4`) có lời khác nhau đúng một chữ đầu câu,
  cùng kiểu với cặp đã ghim `2.4`↔`6.4`.

  **Dấu lược:** 0 trong Pāli của 18 khoá, 0 trong lớp lấp. **Nháy:** 18/18 khớp Pāli.

  **Coverage (đo bằng phép của `englishCoverageFor`: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước: 34/50
  = 0.6800. Sau khi lớp lấp `published`: 50/50 = 1.0. Độ nhạy: phải mất thêm 11
  khoá có nội dung nữa thì bài mới rớt dưới ngưỡng 0,8. Lớp lấp chỉ được tính khi `status: published`.
  `sn/sn22.7` **có** record trong `content/meta/reference-gaps.yaml` (substantive 50, thiếu 16); record đó sẽ thành thừa khi lớp lấp `published`. Lát này **không** chạm tệp đó; người điều phối sinh lại bằng `npm run reference:gaps`.

  **Hai cơ chế khoá trống ở tầng Anh đã ghim (đo, không sửa).** Cắt cụt dãy (≥ 4 khoá trống liên tiếp):
  4 dãy / 17 khoá / 1.269 ký tự Pāli. Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 16/18 khoá trống vào nhóm
  (kiểm `kết quả ≤ số khoá trống`: đạt).

  **Triangulation ≤ 8,0.** Scorecard Việt của bài (`content/meta/sutta/sn/sn22.7.yaml`) ghi `quality.assessed_by` là công cụ cùng họ với lớp lấp — **cùng
  alias công cụ** với lớp lấp này (khai trong `source/tooling.yaml`). Vì vậy bản lấp **không phải** cách đọc
  English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá lấp.
  Không có bản Anh thứ hai; đối chiếu có: Pāli root + Sujato đã ghim (cho khoá anh em) + bản Việt canonical (chỉ
  để đối chiếu nghĩa, không dịch vòng, không chép).

  **technical_integrity 9,6.** Lát này không được chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh
  còn nợ: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Tự kiểm đã làm: JSON parse, mọi khoá
  thuộc `fillableSegments`, không khoá nào trùng khoá Sujato có chữ (0 shadow), NFC, không khoá rỗng, dấu lược
  khớp Pāli (`…pe…` = một `…`), nháy khớp Pāli từng khoá trừ các ngoại lệ ghi ở trên.
