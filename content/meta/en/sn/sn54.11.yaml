notes: |-
  Tiền lệ: `‘ariyavihāro’ itipi, ‘brahmavihāro’ itipi, ‘tathāgatavihāro’ itipi` đã có bản Anh đã
  ghim ở 3.2 và 4.2 của CHÍNH bài — “‘a noble meditation’, or else ‘a divine meditation’, or else ‘a
  realized one’s meditation’,” — dùng đúng ba ngoặc kép đơn như Pāli.

  Khác biệt do Pāli quyết định: 3.4 kết bằng `.` nên bản dịch kết bằng dấu chấm (bản đã ghim ở 3.2
  kết bằng phẩy vì câu còn tiếp sang 3.3); 4.4 có `”ti` nên phải thêm một ngoặc kép đóng ngoài, cho
  ra `’”` ở cuối câu, không chêm dấu chấm vì Pāli không có. Ba vế trong ngoặc dùng y hệt 3.2/4.2.

  Không có bất định nào về nghĩa; chỉ có chênh lệch dấu câu với bản đã ghim, đã nêu ở trên. Hạ
  `vietnamese_clarity` vì đọc liền 3.2–3.4 sẽ thấy một danh sách lặp lại nguyên vẹn ba lần trong
  cùng một trang, và lặp đó là do bản đã ghim chứ không phải do lớp lấp.

  Ngoài phạm vi lát: 4.5 (`Paṭhamaṁ.`) trống ở mọi tầng, không thuộc b6.json.
