  **Phân loại 24 khoá (đo từng khoá): A = 3 · B = 20 · C = 1 · D = 0.** Đây là bài lặp theo công thức
  peyyāla thuần tuý: một danh sách bảy tính tánh được phát lại ở bốn khung thời gian (hiện tại `1.2`–
  `1.9`, quá khứ `2.1`–`2.8`, vị lai `3.1`–`3.8`, hiện tại lần hai `4.1`–`4.8`) rồi lặp lại ở `5.1`–`5.14`.
  Hệ quá: **23 trong 24 khoá này không phải dịch từ đầu** — chúng là chính vế mà tầng Anh đã ghim bỏ trống.

  **QUYẾT ĐỊNH LỚN NHẤT — vì sao lớp lấp viết danh từ trần, KHÔNG thêm động từ.** Mười chính vế lấp ở
  `2.2`–`2.8`, `3.2`–`3.8`, `4.2`–`4.8` đều viết “the faithless with the faithless,” v.v. — **không** có
  “came together and converged” hay “will join together and converge”. Ba lý do, đều đo được:
  (1) Tầng đã ghim trong **chính bài này** dịch cả mười vế danh sách bằng danh từ trần (`1.3`–`1.9` và
  `5.2`–`5.8`), nên thêm động từ vào 19 vế kia sẽ khiến **cùng một danh sách** hiện ra dưới hai hình thức
  ngữ pháp trong một bài. (2) Pāli ở các vế danh sách **không có động từ**; thì nằm ở khung mở đầu —
  `2.1` `saṁsandiṁsu samiṁsu`, `3.1` `saṁsandissanti samessanti`, `4.1` `saṁsandanti samenti` — và tầng
  đã ghim đã dịch đúng thì ấy cho từng khung. Nói cách khác, thì **không** mất ở đâu: nó đã nằm ở
  `2.1`/`3.1`/`4.1`. (3) Có tiền lệ đã publish cùng công thức: `sn14.18` lấp `2.2`–`2.6` bằng danh từ
  trần, và `sn14.18:2.3` của bài đó **có** động từ `saṁsandanti samenti` viết đủ trong Pāli mà lớp lấp
  vẫn giữ dạng danh từ trần. (Ngược lại `sn14.14` dùng động từ đầy đủ, nhưng vì tầng đã ghim của **bài
  đó** đã dịch động từ đầy đủ — không phải tiền lệ áp được sang đây.)

  **Nhóm A — 3 khoá, dùng lại NGUYÊN VĂN lời đã ghim** (Pāli trùng byte): `4.2` ← `1.3`, `4.7` ← `1.8`,
  `4.8` ← `1.9`; tỉ lệ khớp đo được **1,00**. Đây là ba khoá hiện tại mà Pāli y hệt phần đã ghim, nên lấp
  lại đúng câu chữ đã có, không dịch lại.

  **Nhóm B — 20 khoá, chia làm ba nhóm theo thời gian; tất cả dựng lại từ vế đã ghim cùng Pāli:**
  · `2.2`–`2.8` (quá khứ) dựng từ `1.3`–`1.9`, tỉ lệ khớp **0,60** cả bảy khoá. Chênh lệch duy nhất là
    `saṁsandanti samenti` → `saṁsandiṁsu samiṁsu`, tức thì, **không** phải danh từ — nên không có gì
    phải chèn lại.
  · `3.2`–`3.8` (vị lai) dựng từ `1.3`–`1.9`, tỉ lệ **0,60** cả bảy khoá; chênh lệch là
    `saṁsandanti samenti` → `saṁsandissanti samessanti`. `3.2` `3.3` `3.8` viết đủ động từ trong Pāli;
    `3.4`–`3.7` bị lược. Lớp lấp **chèn lại phần đã ghim nuốt mất**: cả vế sau `saddhiṁ` — tức “with
    the …” — rồi mới đặt `…`, vì Pāli viết đủ hai vế và chỉ cắt động từ.
  · `4.2`–`4.8` (hiện tại) dựng từ `1.4`–`1.9`, tỉ lệ **0,60** cho `4.3`–`4.6` (bị lược sau `saddhiṁ`)
    và **1,00** cho `4.2` `4.7` `4.8` (Pāli trùng byte).
  · `5.12` dựng từ `5.2` (“the faithful with the faithful,”), tỉ lệ **0,60**; chèn lại vế “with the
    faithful” trước `…`.
  · `5.13` dựng từ `5.8` (“and the wise with the wise.”), tỉ lệ **0,80**; chèn lại dấu đóng trích dẫn
    `”ti` mà Pāli mang ở `samentī”ti.`
  Tổng cộng **20** khoá nhóm B (7 + 7 + 4 + 1 + 1), cộng **3** khoá nhóm A và **1** khoá nhóm C là hết
  **24**. Không khoá nào phải dịch mới ngoài nhãn thứ tự ở `5.14`.

  **Nhóm C — 1 khoá, dịch thật từ Pāli: `5.14` = `Sattamaṁ.` → “Seventh.”** Đây là khoá nhóm C vì
