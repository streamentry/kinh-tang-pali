  và việc điền nhãn là việc của riêng lớp lấp. Ở bài này nhãn **khớp** chứ không lệch: đo vị trí
  `sn14.17` trong phẩm Hai theo dòng `:0.2` của từng bài thì nó là bài thứ **7** trong 12 bài của phẩm,
  và `Sattamaṁ.` là “thứ bảy” — khớp đúng. Danh sách bảy tính tánh ở `1.3`–`1.9` cũng dài đúng bảy, nên
  **không có cảnh báo nào phải ghi**. (Phẩm: tên Pāli `Dhātusaṁyutta` — chỉ xuất hiện **một** lần trong
  toàn tầng ghim, ở `sn14.39:3.5` `Dhātusaṁyuttaṁ samattaṁ.`. Phẩm có **39** bài trong **4** phẩm con
