  **DẤU LƯỢC:** Pāli có `…pe…` ở **9** khoá của lớp lấp này (`3.4`–`3.7`, `4.3`–`4.6`, `5.12`) và lớp lấp
  viết **đúng một** `…` mỗi khoá, tổng **9** dấu — không mở rộng, không thêm ở khoá nào Pāli viết đủ.
  (Hai khoá `…pe…` còn lại của bài, `5.9` `5.10`, đã ghim sẵn nên không thuộc lớp lấp.)

  **NGOẶC KÉP — chỗ cố ý LỆCH tầng đã ghim, nói thẳng vì không sửa được.** Pāli mở `“` ở `1.2` và đóng
  `”` ở `5.13` (`samentī”ti.`). Tầng đã ghim đóng sớm: `5.11` kết bằng `… because of an element. …”`.
  Lớp lấp vẫn giữ `”ti` ở `5.13` để khớp Pāli từng khoá, nên cột Anh hiện **hai** dấu `”`. Đây là hệ quả
  của tầng đã ghim nói trước, không phải lỗi của lớp lấp; bỏ `”ti` ở `5.13` thì mất `ti` của Pāli và
  lệch với bản Việt canonical (bản đó đóng ở `5.13` y như Pāli). Lớp lấp này **không** dùng nháy đơn ở
  khoá nào, nên không có chỗ nào phải đối chiếu quy ước nháy đơn.

  **`dhātu` — đo tiền lệ ở tầng Anh đã ghim, chọn theo ngữ cảnh.** Từ `dhātu` trong tiếng Pāli có ba nghĩa
  hay bị lẫn: sân khí/lati, yếu tố, và đất liền. Đo trên **4.168** tệp Anh đã ghim (đọc cặp Pāli–Anh theo
  đúng khoá, không suy từ tên tệp): `dhātusova` xuất hiện **25** lần ở phía Pāli, và ở **16** lời Anh
  có lời thì Sujato dịch là **“because of an element”** — không lần nào là “earth” hay “soil”. `dhātu`
  đứng riêng: **element** 19, **realm/domain** 6, **nature** 5. Với bài này ngữ cảnh quyết định: các
  chúng sinh hòa hợp **theo khuynh hướng của chúng** (assaddhā với assaddhā, duppaññā với duppaññā), đó
  là nghĩa sân khí, và tầng đã ghim đã chốt “element” ở `1.2`, `2.1`, `3.1`, `4.1`, `5.1`, `5.11`. Lớp lấp
  không dịch lại vế `Dhātusova` ở các khoá đó vì chúng **không** nằm trong tập lấp — nên câu hỏi này ở
  đây chỉ còn là: lớp lấp có phải giữ đúng nghĩa ấy qua `…saddhiṁ…` hay không. Có, và nó giữ.

