    `Dasamaṁ.` ⇒ **không có cảnh báo nào cần ghi**, nhãn khớp đúng vị trí.
  · `11.6` → `The Old Age Chapter, fifth.` — đo được **5** khoá dạng `…vaggo …o.` trong lớp lấp đã có:
    `Chapter` **3** / `chapter` **2**, và khuôn `, <số>th.` không có `the` là **3/5**; chọn theo đa số.
    Còn `5`/`398` = **0,00%** khoá dạng đó ở tầng ghim có lời (mẫu số 398), nên đây là tiền lệ của
    chính lớp lấp. Tên phẩm lấy nguyên từ tầng ghim: `sn48.50:0.2` = “5. Old Age”.
  · `12.0` → `Its summary verse:` — **6/6** khoá `Tassuddānaṁ` đã lấp trong lớp lấp dùng đúng câu này.
  · `12.1`–`12.4` → giữ tên riêng phiên âm, giữ dấu câu kệ, `ca` → “and”, `ca … ati` → “and then”.
    Đo trên **39** dòng kệ uddāna đã lấp trong lớp lấp: giữ tên riêng là đa số, chỉ `mn20` (4 dòng)
    dùng tiêu đề Anh của Sujato. `ca` → “and” có tiền lệ trực tiếp `an10.50:15.1`
    (`Vivādā dve ca mūlāni,` → “Dispute, and the two Roots of Dispute,”); `ca … ati` → “and then” có
    tiền lệ `an10.50:15.4` (`sarīraṭṭhā ca bhaṇḍanāti.` → “Sarīraṭṭhā, and then Bhaṇḑana.”).

  **BẤT ĐỊNH đã ghi, không đoán — cách đọc `12.1`.** `Jarā uṇṇābho brāhmaṇo,` được lớp lấp đọc là
  **hai** bài: `Jarā` = `sn48.41` *Jarādhammasutta* và `uṇṇābho brāhmaṇo` = `sn48.42`
  *Uṇṇābhabrāhmaṇasutta*. Căn cứ đo được: tên Pāli của `sn48.42` ghép liền đúng hai từ ấy, và cộng lại
  toàn uddāna ra **10** bài = số bài của phẩm (2 + 2 + 4 + 2). Lớp lấp **không** dịch `brāhmaṇo` thành
  một tên riêng thứ ba. ⚠ **Bản Việt canonical hiện tại dịch `12.1` thành ba tên** (*Già, un-nà-ba, Bà
  La Môn,*) nên tổng của nó là **11** thay vì 10. Đây là chỗ của bài Việt, **lớp lấp không sửa**.

  **`indriya` = “faculty”, không phải “sense” — đo tiền lệ ở CẢ HAI tầng.** Tầng Anh đã ghim: toàn bộ
  `sn` có **386** khoá Pāli chứa `indriya`, trong đó **322** lần “faculty” (ở 301 khoá) và **5** lần
  “sense” (ở 5 khoá) — và cả 5 lần ấy đều thuộc công thức *kiềm chế giác quan* `indriyagutto` /
  `indriyasaṁvaro` / `indriyasamvarā`, không phải năm căn của bậc Thánh đệ tử. Riêng phẩm `sn48`:
  **288 “faculty” · 0 “sense”**. Lớp lấp đã `published`: **12** lần “faculty” (9 khoá) và **2** lần
  “sense” (cùng một khoá `ne29:2.2`, `manindriyaṁ` theo nghĩa giác quan). Ba tài anh em trong đúng
  phẩm này cũng vậy: `sn48.9:1.3`/`sn48.10:1.3` “The faculties of faith, energy, mindfulness,
  immersion, and wisdom”, `sn48.46:2.6` “For their noble wisdom is the faculty of wisdom”, và lớp lấp
  `sn48.44:2.4` đã dùng “the faculties of faith … and wisdom”. ⇒ Chọn **“faculty”** cho cả năm căn ở
  `7.5` `8.2` `9.2` `10.6` `11.4`, đúng đa số có căn cứ.

  **Hai chỗ lớp lấp CỐ Ý LỆCH tầng ghim, kèm lý do.**
  1. `10.2` và `10.5`: Pāli ở hai khoá này **không** có dấu nháy nào, nhưng lớp lấp vẫn giữ `‘` mở ở
     `10.2` và `’` đóng ở `10.5` — đúng như tầng ghim đã làm ở cặp anh em `5.2`/`5.5`. Đây là hệ quả
     tất yếu của luật nhóm A (dùng lại nguyên văn), và bỏ thì `10.2`–`10.5` sẽ mất khung trích dẫn
     mà `10.1` đã mở bằng dấu hai chấm. Đếm cân đọc: **21/23** khoá khớp Pāli từng khoá, **2** khoá lệch,
     cả hai đều là cặp trích dẫn ấy.
  2. `7.4`: đây là chỗ **người đọc sẽ thấy**, nói thẳng vì lớp lấp không sửa được. Tầng ghim dịch khoá
     `7.3` (Pāli `Saddhassa hi, sāriputta, … viharissati—`) thành một câu biên tập: “The Buddha then
     repeated Sāriputta’s answer word for word.” — tức Sujato **thay cả lần lặp 7.3–11.4** bằng một câu
     tóm tắt, và bỏ trống **16** khoá ngay sau nó (`7.4`–`11.4`). Lớp lấp chỉ có thể phục hồi từ `7.4`
     trở đi, nên đọc liền sẽ thấy câu tóm tắt của Sujato rồi tới vế đuôi “giving up unskillful
     qualities …”. Không thêm lời vào `7.3` vì `7.3` không thuộc tập lấp được (sẽ là shadow). Chênh lệch
     do tầng ghim, không phải do lớp lấp; đây là lý do hạ `vietnamese_clarity` xuống 9,0.
  3. `7.2`: tầng ghim **tự thêm dấu lược** ở đúng khoá mà Pāli viết đủ — Pāli `7.2` có **0** dấu `…`,
