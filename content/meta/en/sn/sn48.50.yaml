  **Phân loại 23 khoá (đo bằng máy trên Pāli ghim + tầng Anh đã ghim của chính bài này):
  A nguyên từng chữ = 6 · B gần trùng = 10 · C tự dịch = 7 · D = 0.** Định nghĩa đếm để tái lập: D chỉ
  tính khi **cả hai** khoá trùng Pāli đều **có lời** ở tầng ghim mà lời **khác nhau** — một khoá để
  trống không phải “lời khác”, mà là lý do khoá kia thuộc nhóm A. Bài này có **6** cặp Pāli trùng nguyên
  văn và cả **6** đều là cặp *một bên có lời · một bên để trống*, nên **D = 0**; không có cặp nào buộc
  lớp lấp phải hoà hai lời khác nhau. Tổng: 6 + 10 + 7 + 0 = **23**, đúng bằng số khoá đã ghi.

  **Nhóm A — 6 khoá, dùng lại nguyên văn lời tầng ghim (Pāli trùng từng chữ, đã kiểm bằng máy):
  `10.2` = `5.2` · `10.3` = `5.3` · `10.4` = `5.4` · `10.5` = `5.5` · `11.2` = `6.2` · `11.3` = `6.3`.**
  Sáu lời ấy lấy nguyên văn từ khoá nguồn (đối chiếu từng chữ, 6/6 trùng). Đây là phần Đức Thế Tôn
  phát lại nguyên văn lời Sāriputta, nên dịch lại từ Pāli một lần nữa là bắt bài tự mâu thuẫn.

  **Nhóm B — 10 khoá, dựng lại từ khoá đã ghim; chín khoá ra lời TRÙNG NGUYÊN VĂN khoá nguồn
  (9/9 đã đối chiếu từng chữ), một khoá phải cắt.** Bảng, `tỉ lệ khớp` = đo bằng máy trên Pāli đã bỏ
  dấu câu, `phần chèn lại` = phần tầng ghim đã nuốt mất:

  | khoá | nguồn | tỉ lệ khớp | phần chèn lại |
  | --- | --- | --- | --- |
  | `7.5` | `2.3` | 0,87 | không có (khác mỗi `bhante`/`sāriputta`) |
  | `8.1` | `3.1` | 0,96 | không có |
  | `8.2` | `3.2` | 0,85 | không có |
  | `9.1` | `4.1` | 0,96 | không có |
  | `9.2` | `4.2` | 0,87 | không có |
  | `10.1` | `5.1` | 0,95 | không có |
  | `10.6` | `5.6` | 0,86 | không có |
  | `11.1` | `6.1` | 0,96 | không có |
  | `11.4` | `6.4` | 0,87 | không có |
  | `7.4` | `2.2` | 0,74 | **vế đuôi** `akusalānaṁ … anikkhittadhuro kusalesu dhammesu.` |

  `7.4` là khoá duy nhất phải **cắt**: tầng ghim dịch trọn vế `akusalānaṁ dhammānaṁ pahānāya …
  kusalesu dhammesu.` vào khoá `2.2`, nên lớp lấp chèn lại đúng phần đuôi đó, ngay sau dấu gạch dài
  `—` mà Pāli đặt ở cuối `7.3`. Lớp lấp bám đúng câu mà tầng ghim đã dùng cho Pāli kết bằng dấu chấm
  (`an8.2:6.1`, `an8.30:17.2`, `an7.4:3.2` …), tức `They’re strong, …` — đo được **31** khoá Pāli kết
  `…kusalesu dhammesu.` trong tầng ghim, trong đó dạng `They’re …` đa số.

  **Nhóm C — 7 khoá tự dịch từ Pāli:** `11.5` nhãn thứ tự · `11.6` dấu phẩm · `12.0` tiêu đề uddāna ·
  `12.1`–`12.4` bốn dòng kệ uddāna. Mỗi cái đều có tiền lệ đo được ở lớp lấp đã có:
  · `11.5` → **`Tenth.`** — `Dasamaṁ.` là nhãn thứ tự và **không** nằm ở khoá. Dò bằng giá trị Pāli
    khớp `^(Paṭhama|…|Terasama)ṁ\.$` trên 2.993 khoá Pāli ở tầng ghim (`sn` 1.396 · `an` 1.405 ·
    `kn` 192 · `dn` 0 · `mn` 0) cho ra **2.993**, và **0 / 2.993 = 0,00%** khoá nào tầng ghim có lời —
    đúng cái con số **tái lập được** của mục 5e. Lớp lấp đã có **45** khoá nhãn / **12** dạng bề mặt /
    **0** ngoại lệ, và `Tenth.` là dạng đã dùng. **Kiểm chứng khớp số mục**: `sn48.50` là bài thứ mười
    của phẩm Già — đo trên chính Pāli, mười bài `sn48.41`–`sn48.50` mang lần lượt `Paṭhamaṁ.`
