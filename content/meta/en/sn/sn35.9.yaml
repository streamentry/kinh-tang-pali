notes: |-
  Bài song song của sn35.8 (chỉ khác ở `dukkhā` ↔ `anattā`), và bốn khoá Pāli của nó TRÙNG
    NGUYÊN VĂN bốn khoá của sn35.8 — nên hai tệp fill này dùng cùng một bộ từ, và cùng lý do với
    sn35.8: sn35.7 (bài cùng khuôn 22 khoá) đã ghim 1.16 bằng "doesn’t worry about the mind of
    the past", nhưng luật 3 là luật của CHÍNH BÀI ĐANG DỊCH nên theo 1.3 của chính sn35.9
    ("is not concerned with the eye of the past") → "is not concerned with the mind of the past".
    Bất định này được ghi ở cả hai tệp.

    Vì 1.10/1.12/1.16/1.18 ở sn35.9 và sn35.8 có cùng Pāli và cùng nghĩa, hai bài không được tự mâu
    thuẫn. 1.18 có `”ti`, 1.12 không.
