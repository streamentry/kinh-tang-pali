notes: |-
  1.4 đã ghim: "One meditator is skilled in emerging from immersion but not in positivity
  for immersion. …”". 1.5–1.7 đảo và mở rộng đúng khuôn ấy. `kallitakusalo` = "positivity
  for immersion" và `vuṭṭhānakusalo` = "emerging from immersion" — cả hai lấy từ 1.4.

  Bất định thật sự, ghi rõ vì người đọc có quyền hỏi: Pāli ở 1.5–1.7 của bài này KHÔNG có
  `Idha pana, bhikkhave, ekacco jhāyī` (bản này chỉ có nó ở 1.4; xem sn34.20-27, bản Pāli gốn
  y hệt, có đủ cả ba vế). Vì vậy ba khoá này bắt buộc phải là mảnh câu không chủ ngữ, và
  bản lấp đã KHÔNG thêm chủ ngữ — thêm vào là bịa. Bản Việt canonical của chính dự án cũng
  bỏ chủ ngữ ở 1.5–1.7, nên hai lớp đọc cùng nhau. Hệ quả: `grammar_logic`, `ambiguity_integrity`
  và `vietnamese_clarity` hạ, vì đọc lẻ một ô English thì thấy câu không chủ ngữ.

  Số dấu lược giữ đúng từng khoá: 1.5 và 1.6 có `…` ở Pāli nên có `…` ở bản lấp; 1.7 không
  có nên không có. `triangulation` 8.0 là đặc thù của lớp lấp.
