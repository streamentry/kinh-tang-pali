notes: |-
  1.11 lặp vế của 1.13 và 1.17, đã được ghim với "But since …"; chỉ khác `saṅkhārānaṁ` thay
  `viññāṇassa`. Vì `sattā saṅkhārehi` là số nhiều nên dịch "escape from them" chứ không phải
  "escape from it" như 1.17 ("from consciousness" là số ít). Đây là chỗ duy nhất trong lát phải
  đổi đại từ so với bản ghim, và đổi vì Pāli đòi, không phải vì sở thích.

  2.2 và 2.4 là chỗ khó nhất của lát, và cần ghi rõ vì người đọc có thể tưởng là lỗi: bản Anh đã
  ghim 2.1 và 2.3 đã dịch TRỌN cả vế của 2.2 và 2.4 vào chính nó (Sujato gộp hai khoá Pāli
  làm một). 2.2 là phần cuối nguyên văn của câu ở 2.1, và 2.4 là phần cuối nguyên văn của câu ở
  2.3 — đã kiểm bằng so chuỗi. Vì vậy bản lấp buộc phải lặp lại đúng lời ấy; đó cũng là khuôn
  đã có trong lớp lấp: an10.54:5.4, an7.22:2.3, sn35.53:2.2, mn121:13.2 đều là trường hợp
  "bản ghim đã dịch trước hết cả vế của khoá sau, nên khoá sau lặp lại y hệt". Đã kiểm lại
  từng từ, không có chỗ nào tự sáng tác.

  Bất định đã ghi nhận, và là lý do hạ `ambiguity_integrity`/`semantic_fidelity`: vì 2.1/2.3
  đã gồm hết, bản đọc bốn cột sẽ hiện cùng một câu hai lần liên tiếp (2.1 rồi 2.2; 2.3 rồi
  2.4). Người biên tập nên biết đó là hệ quả của cách Sujato cắt đoạn, không phải lặp do lỗi
  lấp. Cách khác — viết lại 2.2/2.4 bằng lời khác — sẽ vi phạm luật 3 và làm hai lần lặp
  trong cùng bài không khớp nhau, nên không chọn.
