notes: |-
  Cùng cách làm sn56.4: 2.3 và 2.5 là phần SuttaCentral tách riêng để lặp lại bộ ba
  quá khứ / vị lai / hiện tại đã bị Sujato gộp vào 1.1–1.3.

  Bài CÓ bản Việt dự án (sn56.5), đối chiếu từng khoá:
    2.3 — VI: “Này các tỳ-kheo, các Sa-môn hay Bà-la-môn nào trong quá khứ đã giác ngộ
         đúng như thật …”. “samaṇā vā brāhmaṇā vā” dịch “ascetics and brahmins” theo
         đúng bản đã ghim 1.1. Thì quá khứ (`abhisambojjhiṁsu`) giữ quá khứ, khác bản đã
         ghim ở 1.1 vốn dùng thì hiện tại cho cả ba thời (“truly awaken—in the past,
         future, or present”) — cách đó chỉ đúng khi câu còn bị cắt bằng gạch nối.
    2.5 — `imāni` (bốn Thánh đế NÀY) có thật trong Pāli, khớp bản Việt dự án (“bốn Thánh
         đế này”), nên dịch “these four noble truths” chứ không theo “the four noble
         truths” của bản đã ghim ở 1.3.

  `abhisambojjhanti` (thì hiện tại ở 2.5) dịch “truly awaken”, dùng đúng từ Sujato đặt ở
  1.1 và 1.3. Bất định: vị trí dấu hiệu thời gian là lựa chọn của tôi, không có mẫu cho
  đúng vị trí này; `ambiguity_integrity` hạ vì vậy.
