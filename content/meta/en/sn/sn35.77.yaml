notes: |-
  1.13: Pāli 1.13 chỉ khác 1.1 đã ghim ở dấu ngoặc (`”ti`), nên lấy lại nguyên văn "Rādha,
    you should give up desire for what is suffering." và thêm `”`. 1.12 trùng cấu trúc với
    sn35.162:2.17 đã ghim ("…is also impermanent: you should give up desire for it") và với
    sn35.152:2.14 đã ghim cho đúng mạch "mind contact". 1.3 theo đúng khuôn 1.1.

    Bất định ở 1.7, và đây là chỗ yếu nhất của lát: `…pe…` nằm GIỮA, nuốt mất
    `paccayā uppajjati vedayitaṁ sukhaṁ vā dukkhaṁ vā`, nên chỉ dịnh được phần còn lại và phải giữ
    `…` đúng chỗ (2 đơn vị, khớp Pāli). Vì vậy câu mở đầu là "This eye contact …", và "or
    neutral" nối vào sau lỗ hổng chứ không phải đầu câu. Không có bản Anh nào đã ghim cho 1.7
    để đối chiếu; đã tra 141 khoá có `…pe…` trong 481 tệp fill sẵn có và đây là cách kho làm.
