notes: |-
  Hai khoá này dùng CHUNG một khuôn dịch với sn55.48: Pāli 2.5 giống hệt, và Pāli
  2.6 chỉ khác ở tên xưng (`Imehi kho, mahānāma,` thay cho `Imehi kho, bhaddiya,`) —
  hai bài song song trong cùng phẩm. Bản Việt dự án cũng có cả hai (sn55.49:2.5 và
  2.6). Dịch khác nhau ở hai khoá này sẽ làm hai bài tự mâu thuẫn.

  2.5: dùng lại đúng bộ từ mà bản đã ghim đã dùng cho cùng vế Pāli ở sn55.40:4.3 và
  sn55.41:3.1, và không dịch `akhaṇḍehi` — lý do đã nêu đầy đủ ở `sn55.48.yaml`; tóm
  lại: thêm “unbroken” sẽ mâu thuẫn với hai chỗ kia trong cùng tầng.

  2.6: theo khuôn 8 lần của công thức `Imehi kho, … catūhi dhammehi …` mà Sujato luôn
  bỏ tên xưng (sn55.2:2.7, 6:17.7, 11:2.8, 30:2.8, 39:2.8, 46:2.7, 47:2.7, 51:2.7).
  BẤT ĐỊNH CẦN GHI: bản Việt dự án sn55.49:2.6 giữ “Mahānāma,” và Sujato 1.3 của
  chính bài này cũng giữ, nên hướng ngược lại cũng có tiền lệ. Tôi chọn khuôn chung của
  công thức; nếu người biên tập chọn giữ tên xưng thì phải sửa cả tám chỗ kia.

  Bài này bản đã ghim chỉ dịch 6/13 khoá (2.2–2.4, 2.7 còn trống). `triangulation` 8.0.
