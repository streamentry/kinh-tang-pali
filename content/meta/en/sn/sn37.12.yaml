notes: |-
  1.1: Pāli GIỐNG HỆT sn37.14:1.1 (đã ghim) và sn37.10:1.1 (lớp fill) — dùng lại y hệt. Sujato đã
  mở rộng `…pe…` ở sn37.14:1.1; luật 2 của lớp lấp cấm, nên tôi giữ một `…` tại chỗ lược, chỉ dịch
  `nirayaṁ upapajjati` → "they are reborn in hell." (`nirayaṁ` → "hell": 94 cặp tiền lệ, ví dụ
  dn34:2.1.124).

  1.4 là khoá khác ba bài kia: Pāli `…pe… apāyaṁ duggatiṁ vinipātaṁ nirayaṁ upapajjatī”ti.` Phần
  bị lược ở đây chỉ là `kāyassa bhedā paraṁ maraṇā`, còn bốn chữ `apāyaṁ duggatiṁ vinipātaṁ
  nirayaṁ` còn lại nên dịch đủ: "in a place of loss, a bad place, the underworld, hell." Ánh xạ
  4↔4 này đếm được — "a place of loss, a bad place, the underworld, hell" xuất hiện 183 lần trong
  bản Anh đã ghim (sn37.5:2.1/2.4, sn37.14:1.1/1.4). Vậy `nirayaṁ` là "hell" và `vinipātaṁ` là
  "the underworld", khớp với cách tôi dịch ở 1.1.

  Hạ `semantic_fidelity` / `grammar_logic` 9.3: "… they are reborn in …" là câu có dấu lược ở
  giữa, đọc hơi cụt. Không bịa phần bị lược.
