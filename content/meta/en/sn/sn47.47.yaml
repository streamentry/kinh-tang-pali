notes: |-
  Tiền lệ: 1.5 của CHÍNH bài đã có bản Anh cho dạng thân — “Give up bad conduct by way of body,
  speech, and mind and develop good conduct by way of body, speech, and mind.”; `duccaritaṁ` → “bad
  conduct”, `sucaritaṁ` → “good conduct” (an2.11:1.7, an3.17:2.3, mn78:10.12, sn46.6:6.2 …).

  Riêng hai khoá này KHÔNG có tiền lệ nguyên văn: `Vacīduccaritaṁ pahāya vacīsucaritaṁ bhāvessasi`
  và `Manoduccaritaṁ pahāya manosucaritaṁ bhāvessasi` xuất hiện đúng 1 lần mỗi vế trong toàn
  snapshot và đều là chính hai khoá này. Lấy tiền lệ cho TIỀN TỪ theo từng căn: `kāya-` → “bodily
  conduct” (an10.23:2.5), `vacī-` → “verbal conduct” (an10.23:3.5, an6.108:1.7), `mano-` → “mental
  conduct” (an7.58:3.2 “no mental misconduct”, an3.101:2.1 “bad bodily, verbal, and mental
  conduct”). Đây là lựa chọn có cơ sở nhưng không phải chép nguyên văn — hạ `terminology` và
  `ambiguity_integrity` xuống 9.3.

  Ghi rõ: 1.5 đã ghim gộp cả ba căn vào một câu, nên đọc liền 1.5–1.7 câu 1.6–1.7 có vẻ lặp. Lặp đó
  là do bản đã ghim, và lớp lấp không được sửa bản đã ghim.
