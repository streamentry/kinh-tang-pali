notes: |-
  Tiền lệ: 1.6 và 1.15 dựng từ sn35.53:2.14 và sn35.79:6.4 (Pāli gần như trùng, đã ghim) cho mệnh
  đề `…tampi aniccato jānato passato X` → "And also knowing and seeing … as impermanent, X …". Vế
  `vedayitaṁ sukhaṁ vā dukkhaṁ vā adukkhamasukhaṁ vā` đếm được: "the pleasant, painful, or neutral
  feeling that arises dependent on" 51 lần thắng "the painful, pleasant, or neutral …" 49 lần, và
  khớp đúng thứ tự Pāli (sukha trước dukkha).

  1.16: vế đích lấy từ 1.1 và 1.2 của chính bài, đã ghim ("the fetters are given up"). Mở đầu
  `Evaṁ kho, bhikkhu, jānato evaṁ passato …` đếm được: "That’s how to know and see so that" 10 lần
  (mn109:13.7, sn22.91:2.7, sn22.125:2.6, sn22.71:1.9, sn22.124:2.6, sn22.92:2.6) thắng "This is
  how to know and see so that" 2 lần (sn35.165:2.6, sn35.166:1.9). Chọn "That’s how" — ghi ra vì
  hai bản ghim trong chính Saṃyutta lại dùng "This is how".

  0 tiền lệ cho đúng vế `tampi aniccato jānato passato saṁyojanā pahīyanti` (đếm 0 cặp), nên 1.6
  và 1.15 ghép từ hai khuôn nêu trên. `ambiguity_integrity` 9.3 vì ghép, không phải chép.
