notes: |-
  Bốn khoá lấp là bốn vế của chuỗi hỏi–đáp về lưỡi. Bài này lặp nguyên văn cấu trúc này
  SỐ LẦN cho mắt, cho thân, cho ý và cho vị ấy, và mỗi vế đều đã có bản ghim.

  Tiền lệ đã đếm, từng vế:

  - 27.1 = 15.1 đã ghim ("Anything included in feeling, perception, choices, and
  consciousness that arises dependent on eye contact: is that permanent or
  impermanent?"), chỉ thay `cakkhu` → `jivhā`. Cùng vế còn có ở 45.1 (ý) đã ghim.
  - 29.1 = 5.1, 17.1, 35.1, 47.1, 59.1 — năm bản ghim giống hệt ("But if it’s
  impermanent, is it suffering or happiness?"), lấy nguyên văn.
  - 31.1 = 7.1, 19.1, 37.1, 49.1, 61.1; 31.2 = 7.2, 19.2, 37.2, 49.2, 61.2 — nguyên văn.

  Ngoặc kép và dấu hỏi giữ y hệt Pāli từng khoá: 31.1 mở `“` và không đóng (Pāli cũng vậy,
  câu nối sang 31.2), 31.2 mở `‘` và đóng `’”` rồi `?`.

  Bất định đã ghi nhận:

  - 23.1–26.1 (`Jivhāviññāṇaṁ …`, `“Aniccaṁ, bhante” …pe….`, `Jivhāsamphasso nicco vā
  anicco vā”ti?`, `“Anicco, bhante” …pe….`) cùng 28.1, 30.1, 32.1 đã bị lược hoặc chưa
  ai lấp, nên các vế của lát này có dấu chấm câu theo bản ghim chứ không có văn cảnh nối
  trong cùng chuỗi. Đó là hệ quả của lược ở tầng trên, không phải lỗi bản lấp.
  - Có bản Việt hiện hành (Thích Minh Châu) cho bài này trong `translation/vi/sujato/`
  không dùng làm authority ở đây; Pāli + bản ghim là căn cứ.
  - `triangulation` 8.0; `han_viet_balance` là giá trị mặc định của lớp lấp.
