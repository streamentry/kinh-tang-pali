  `micchāājīvena`→*wrong livelihood* ⇒ **right livelihood** · `micchāvāyāmena`→*wrong effort* ⇒ **right
  effort** · `micchāsatiyā`→*wrong mindfulness* ⇒ **right mindfulness** · `micchāsamādhinā`→*wrong
  immersion* ⇒ **right immersion** · `micchāñāṇena`→*wrong knowledge* ⇒ **right knowledge**.
