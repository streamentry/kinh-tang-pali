notes: |-
  **Bốn nhóm, đo trước khi viết.** Quy tắc đo đã dùng: **A** = Pāli trùng nguyên văn (từng byte) với một khoá
  trong cùng bài đã có lời ở tầng ghim; **B** = không trùng byte, nhưng **mọi câu** của khoá đều khớp
  một khoá đã có lời ở tầng ghim với tỉ lệ ≥ 0,80; **C** = không có; **D** = trùng byte mà lời ghim
  khác nhau.
  - **A = 4**: `2.4` ← `2.2` · `4.4` ← `4.2` · `5.4` ← `5.2` · `7.2` ← `7.4`. Cả bốn trùng Pāli từng byte
    ⇒ chép **nguyên văn** lời đã ghim, không dịch lại.
  - **B = 4**: `3.2` (0,80 với `2.2`) · `3.3` (0,833 với `3.1`) · `3.4` (câu 1: 0,80 với `2.2`; câu 2 trùng
    **byte** với `2.5`) · `7.1` (0,846 với `7.3`).
  - **C = 1**: `7.6`.
  - **D = 0**: quét mọi cặp Pāli trùng trong bài (4 cặp `2.2/2.4`, `4.2/4.4`, `5.2/5.4`, `7.2/7.4`) — không
    cặp nào có **hai** lời ghim khác nhau, nên không có gì để hòa.

  **Nhóm B — khoá nguồn, tỉ lệ, và phần chèn lại.**
  - `3.2` ← `2.2` (0,80; chỉ khác `rūpesu→rasesu`, `rūpaṁ→rasaṁ`). Dựng lại từ *"There is desire for
    sights in them, and they understand that."* → *"…for **flavors**…"*. Chọn **flavor** vì đo toàn tầng
    đã ghim có **72** khoá dịch một từ `rasa` bằng "flavor"; số nhiều `rasesu` theo đúng cách tầng ghim
    làm với `rūpesu`→"sights" và `dhammesu`→"ideas".
  - `3.3` ← `3.1` (0,833) + `2.1` + `2.3`. Tầng ghim nuốt mất **toàn bộ** vế tỳ-kheo ở `2.3` và `4.3`
    (chỉ còn *"Since this is so, "*) và ở `3.1` biến cả câu Pāli thành chuỗi lược *"hears … smells … tastes …
    touches …"* vốn Pāli `3.1` **không** có dấu lược nào. Lớp lấp chèn lại: `Yaṁ taṁ` → *"Since this is
    so,"* (nguyên văn `2.3`), `bhikkhu jivhāya rasaṁ sāyitvā` → *"a mendicant who tastes a flavor with
    their tongue"* (thành ngữ đã ghim, y hệt `dn2:64.6`, `sn35.120:3.6`), `rasappaṭisaṁvedī ca hoti
    rasarāgappaṭisaṁvedī ca` → *"They experience both the flavor and the desire for the flavor."* (dựng
    từ `2.1`).
  - `3.4` = `3.2` + câu `Evampi kho…` trùng **byte** `2.5` ⇒ lấy nguyên văn lời `2.5`, chèn lại dấu lược
    mà tầng ghim đã bỏ (xem dưới).
  - `7.1` ← `7.3` (0,846): chép nguyên văn *"Next, take a mendicant who knows an idea with their mind.
    They experience the idea but no desire for the idea."*

  **Cố ý lệch tầng Anh đã ghim — ba chỗ, đều có số đi kèm.**
  1. **Dấu lược ở `3.4`**: Pāli kết `…pe….` (2 dấu) ⇒ lớp lấp ghi **một** `…`, đặt **sau** dấu chấm câu
     (đo lớp lấp: **12/12** khoá có Pāli kết `…pe….` đều kết ` …`). Tầng ghim ở `2.5`, `4.5`, `5.5` bỏ
     hẳn (Pāli 2, 4, 2 dấu → Sujato 0) — đó là lớp lỗi `sn22.76`, lớp lấp sửa chứ không sao chép. Hệ quả
     phải nói thẳng: cùng một câu đó hiện **có** dấu lược ở `3.4` và **không** có ở `2.5`/`4.5`/`5.5`.
  2. **Chữ hoa đầu câu ở `3.4`**: viết *"**T**his is how the teaching is apparent…"*. Tầng ghim dùng chữ
     thường ở **4/4** chỗ (`2.5`, `4.5`, `5.5`, `7.5`), nhưng cả bốn đều nằm giữa câu; ở `3.4` vế `Evampi
     kho…` mở đầu câu sau `pajānāti. ` nên phải hoa. Bản Việt canonical cũng hoa ở cả hai vị trí
     (`3.4` và `2.5`).
  3. **Nháy trong `‘atthi me … rāgo’ti pajānāti`**: Pāli có `‘…’` ở `2.4`, `3.2`, `3.4`, `4.4`, `5.4`,
     `7.2` (mỗi khoá 1 cặp), lớp lấp ghi **0**. Đo toàn tầng: cụm này chỉ nằm trong `sn35.70` (11 khoá), và
     **5/5** lời đã ghim của nó đều **không** giữ nháy trong. Theo đúng quy ước tầng đã ghim, đổi lại số
     nháy của 6 khoá này lệch Pāli; hai số đã ghi: Pāli 6 cặp, lớp lấp 0 cặp.

  **Bốn lỗi tầng ghim tìm được ở chính bài này (báo, không sửa — không khoá nào thuộc lát này).**
  - `4.5`: Pāli lược `akāliko ehipassiko opaneyyiko` bằng `…pe…`, tầng ghim **mở rộng** thành *"immediately
    effective, inviting inspection, relevant"* — đúng lớp lỗi `sn22.76` (ghi chữ ở chỗ Pāli đang lược).
  - `3.1` và `6.1`: Pāli `3.1` có **0** dấu lược mà Sujato ghi **4**; Pāli `6.1` có 2, Sujato 4 — tức
    Sujato thay cả câu Pāli bằng chuỗi lược, đúng lớp lỗi `an11.14`. Vế sau trong `6.1`
    (`Asantañca ajjhattaṁ rasesu rāgaṁ …`) bị bỏ trọn.
  - `7.3`/`7.5`: Sujato dịch nội dung Pāli của `7.1` vào `7.3`, rồi đẩy `Yaṁ taṁ` của `7.3` xuống đầu `7.5`.
  - Riêng `1.1` Pāli 2 dấu → Sujato 1 dấu là **đúng** luật (`…pe…` → đúng một `…`), không tính là lỗi.

  **Hệ quả phải nói thẳng — hai chỗ, không né được.**
  - `7.1` chép nguyên văn `7.3` nên người đọc thấy câu *"Next, take a mendicant who knows an idea with
    their mind…"* **hai lần** (một ở khoá lấp `7.1`, một ở khoá ghim `7.3`). **Pāli cũng lặp** (`7.1` và `7.3`
    chỉ khác `Puna caparaṁ` và `Yaṁ taṁ`); tầng ghim đã gộp hai khoá thành một. Không có cách nào vừa giữ
    đủ chữ ở `7.1` vừa tránh lặp mà không bịa thêm dấu lược ở nơi Pāli không có.
  - `3.3` lấp lại cả vế tỳ-kheo mà tầng ghim nuốt ở `2.3`/`4.3`, nhưng `2.3`/`4.3` **đã có lời ghim** nên
    không thuộc tập lấp và không được đụng. Kết quả: phần **vị** đọc đầy đủ hơn hai phần **mắt** và **tâm**.
    Đây là hệ quả của việc tầng ghim đã nén, không phải lỗi dịch; nó tự biến mất khi tầng ghim được sửa.

  **Còn lại bao nhiêu khoá trống**: không còn khoá trống nào của lát này — 9/9 khoá đã lấp, và cả 9 chính là
  toàn bộ chỗ tầng đã ghim im lặng trong bài này (đo: Pāli **33** khoá, bỏ khối `:0` còn **30**, trong đó
  **9** khoá dưới 40 ký tự hoặc không; tỉ lệ chính xác là **29** khoá có nội dung và **1** khoá `7.6` dưới
  ngưỡng). Lưu ý: `fillableSegments` so **chỉ** với tầng đã ghim, nên nó vẫn trả về đủ 9 khoá sau khi lớp lấp
  đã ghi — đó là cố ý của kho, không phải khoá trống còn sót.
  `7.6` (`Aṭṭhamaṁ.`) **dưới ngưỡng 40 ký tự** (9 ký tự) nên **không** tính vào coverage; nó vẫn được lấp
  vì là khoá của lát, và `"Eighth."` theo khuôn số thứ tự trần của lớp lấp — cùng khuôn với `ud5.8:6.5` (cũng
  `Aṭṭhamaṁ.` → "Eighth."), `ud6.1:17.5` "First.", `an3.70:40.5` "Tenth.".

  **Số trùng Pāli đã dò toàn tầng**: dựng chỉ mục Pāli→(khoá, có lời ghim không) trên **5.764** tệp Pāli
  đã ghim. Tám khoá có nội dung của lát này có **0** bản trùng byte ở bài khác — trùng byte duy nhất
  (`2.2`, `4.2`, `5.2`, `7.4`) đều nằm **trong chính bài này**. Ngoài khối `:0`, toàn bài chỉ có **hai** khoá
  từng trùng byte với bài khác: `1.3` (trùng `an6.47:1.3`, có lời ghim — không thuộc lát) và `7.6` (trùng
  **274** khoá ở **274** bài khác: 135 `an`, 121 `sn`, 10 `it`, 8 `ud`; **0** khoá nào trong số đó có lời
  Sujato). ⇒ ở phạm vi **gần** (cùng `sn35`) lớp lấp dùng lại **4** khoá nguyên văn; ở phạm vi **toàn
  tầng** cũng **4** — hai số bằng nhau ở đây, vì bài này không có bản song parallel nào ở tầng đã ghim.

  **Coi chừng tiền đề của người điều phốn**: đo thì `sn35.74` và `sn35.75` **không** phải văn xuôi song
  parallel của các câu ở đây. Cả hai thuộc `8. Gilānavagga` (`Paṭhamagilānasutta`, `Dutiyagilānasutta`),
  còn `sn35.70` thuộc `7. Migajālavagga`; và trong chỉ mục toàn tầng **không** có khoá nào của `sn35.74`/`75`
  trùng byte với khoá nào của `sn35.70`. Bài anh em thật sự của `sn35.70` là `sn35.71`/`72`/`73` (cùng
  `7. Migajālavagga`, `…chaphassāyatanasutta`), nhưng chúng cũng trùng byte **0** khoá nào với bài này —
  cùng cụm `sandiṭṭhiko dhammo hoti…` thì dùng **cách diễn đạt khác**. Vì vậy lớp lấp dựng 4 nhóm B từ
  chính các khoá đã ghim trong bài, không có tiền lệ bài ngoài nào để chép.

  **Suy ra từ đây**: `content/meta/sutta/sn/sn35.70.yaml` chấm `assessed_by: "OpenCode Space Bunny Free
  (agent)"` — **trùng alias** với lớp lấp, nên bản Việt canonical **không** phải một cách đọc English độc
  lập, và `triangulation` bị chặn ở **8,0**. Bài này **không** được tuyên bố là đã đối chiếu English. Bản Việt
  chỉ dùng để đối chiếu nghĩa (ví dụ xác nhận `Yaṁ taṁ` ở `2.3`/`3.3`/`4.3` là mệnh đề dẫn lại, và cả ba vị
  trí ở `3.2`–`3.4` phải là "vị" chứ không phải "mắt"), không dịch vòng qua nó.

  **Nguồn dùng làm tiền lệ và giới hạn**: `vietnamese-current` không có cho bài này ở commit đã ghim. Từ ngữ
  lấy từ tầng đã ghim của **chính bài này** (`2.1`, `2.2`, `4.2`, `5.2`, `7.3`) và của các bài khác **đã
  ghim** cho cụm `jivhāya rasaṁ sāyitvā` (72 khoá toàn tầng). Không tự sáng tác thuật ngữ mới.

  **Ghi về nguồn gốc, nói thẳng**: 5 khoá trong lát này (`2.4`, `4.4`, `5.4`, `7.2`, `7.1`) là **nguyên văn**
