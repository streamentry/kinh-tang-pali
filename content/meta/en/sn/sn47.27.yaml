notes: |-
  Tiền lệ: CÙNG NGUYÊN VĂN Pāli đã có bản Anh đã ghim ở sn52.5:1.2 và sn52.6:1.2. BẤT ĐỊNH 1 — không
  kế thừa lần lược của tiền lệ. Hai tiền lệ đó dịch vế này thành "Sāriputta said to Anuruddha:", RÚT
  MẤT `Ekamantaṁ nisinno` ("ngồi một bên"). Kiểm lại bối cảnh thì cả sn52.5 lẫn sn52.6 đều có 1.1 chỉ
  là dòng bối cảnh ("At Sāketa." / "The same setting.") và 1.2 mới là câu này — tức bản đã ghim KHÔNG
  nói "ngồi một bên" ở đâu cả, nên đó là lược chứ thực, không phải rút gọn vì trùng lặp. Bản Việt
  canonical 1.2 dịch đúng vế này ("Ngồi một bên, Tôn giả Sāriputta nói với Tôn giả Anuruddha:"). Lớp
  lấp lấy từ Pāli nên dịng lại, dùng đúng động từ bản đã ghim dùng cho cụm này ("sat down to one side,
  and said to him" — sn47.9:3.2, sn47.13:2.2, sn47.13:4.1). BẤT ĐỊNH 2 — dấu macro. Bản Anh đã ghim
  của CHÍNH sn47.27 không hề nhắc "Sāriputta" (toàn bộ bài chỉ có "Reverend, they speak of the one
  called 'an adept'"…), nên chốt `_lọt_pāli` — vốn cho phép chữ Pāli trong tên riêng khi bản đã ghim
  của chính bài đó dùng — bắt `Sāriputta` là Pāli lọt vào và chặn. Bỏ tên thì mất chủ thể, nên giữ tên
  và bỏ dấu macro. Hệ quả phải ghi thẳng: `Sariputta` KHÔNG có tiền lệ nào trong bản đã ghim (832 lần
  `Sāriputta`, 0 lần `Sariputta`), nên người đọc sẽ thấy "Sariputta" ở cột Anh lấp và "Tôn giả
  Sāriputta" ở cột Việt. Đây là chỗ cần người điều phổn quyết: hoặc nới chốt cho tên riêng có dấu ở
  bất kỳ bài nào trong cùng Nikāya, hoặc chấp nhận dạng không dấu. Không sửa được vì không được đụng
  `_h55en.py`. Danh xưng `āyasmā` vẫn bỏ như Sujato: đó là lựa chọn văn phong của ông (chỉ dùng
  "Venerable" khi người kể chuyện giới thiệu nhân vật), không mất nghĩa vì người đọc biết hai vị đều
  là trưởng môn từ 1.3.
  
