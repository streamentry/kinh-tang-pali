notes: |-
  1.1 có Pāli GIỐNG HỆT sn37.14:1.1, đã ghim: "“Anuruddha, when ladies have five qualities, when
  their body breaks up, after death, they are reborn in a place of loss, a bad place, the
  underworld, hell." Sujato đã MỞ RỘNG `…pe…` ở đó (Pāli sn37.14:1.1 chỉ còn `nirayaṁ
  upapajjati.`). Luật 2 của lớp lấp cấm mở rộng, nên tôi giữ đúng một `…` đặt tại chỗ lược và chỉ
  dịch phần còn lại.

  Vì vậy 1.1 = "“Anuruddha, when ladies have five qualities … they are reborn in hell." — "hell"
  là `nirayaṁ`: 94 cặp Pāli↔Anh đã ghim với `nirayaṁ` đứng riêng, ví dụ dn34:2.1.124 `nirayaṁ
  upapanno hoti` → "reborn in hell". `kāyassa bhedā paraṁ maraṇā apāyaṁ duggatiṁ vinipātaṁ` nằm
  trong phần bị lược nên không dịch.

  1.4: Pāli `imehi kho, anuruddha, pañcahi dhammehi samannāgato mātugāmo …pe… nirayaṁ
  upapajjatī”ti.` — cùng cách, thêm dấu `”` đóng vì Pāli đóng ở đây. Bản đã ghim 1.3 (" … They’re
  faithless, shameless, imprudent, unethical, and witless. …”") mở và đóng ngoặc kép của riêng nó,
  nên `“` ở 1.1 của tôi và `”` ở 1.4 là cặp đúng với Pāli.

  Tiền lệ 1.4 khi không có lược: sn37.5:2.4 và sn37.14:1.4 có Pāli giống hệt và CẢ HAI đều ghim
  "When ladies possess these five qualities, when their body breaks up, after death, they are
  reborn in a place of loss, a bad place, the underworld, hell.” — đó là hình mẫu tôi theo.

  Hạ `semantic_fidelity` / `grammar_logic` 9.3: "… they are reborn in hell." là câu có dấu lược ở
  giữa, đọc hơi cụt vì chủ ngữ và phần "khi thân tan rãi, sau khi chết" nằm trong `…pe…`. Giữ
  nguyên vì không được phép bịa phần bị lược.
