notes: |-
  **Phân loại theo máy trên 40 khoá: A 8 · B 25 · C 7 · D 0.** Dùng lại **nguyên văn** từ cùng bài: 8 khoá (đúng bằng số khoá nhóm A). Đã dò 10 nhóm Pāli trùng nguyên văn trong bài (tổng 20 khoá, gồm cả khoá đã ghim lẫn khoá lấp); với mỗi nhóm đó, mọi khoá lấp đều mang cùng lời với khoá còn lại của nhóm, ngoại trừ các khoá D đã nêu. Số khoá đã ghi: 40/40 khoá `fillableSegments`.

  **Hình dạng của chỗ trống.** Samiddhi kể lại toàn bộ cuộc gặp với vị thiên cho Đức Phật (`9.1`–`17.3`); tầng đã ghim dịch phần kể ở `8.3` chỉ bằng “He went to the Buddha, bowed, sat down to one side, and told him what had happened. Then he added:” rồi nhảy sang `17.4`, nên 23 khoá kể lại đều rỗng. Cộng với kết chương `28.5` và kệ tóm lược `29.0`–`29.6`: 40 khoá, 23 khoá có nội dung đo được.

  **Nhóm 1 — A nguyên văn (8 khoá).** `10.2`, `12.2` (← `2.2`, `3.2`), `10.3`, `12.3` (← `2.3`, `3.3`), `13.3` (← `4.3`), `14.4` (← `5.3`), `16.3`, `16.4` (← `7.3`, `7.4`). Pāli của các khoá kể lại giống hệt Pāli lúc kể chuyện nên giữ nguyên lời đã ghim.

  **Nhóm 2 — B (25 khoá).** Lời kệ của vị thiên và lời đối đáp dựng từ khoá nguồn tương ứng: `9.1`–`9.3` ← `1.3`–`1.5` (0,82–0,99); `10.1`, `10.4` ← `2.1`, `2.4`; `12.1`, `12.4` ← `3.1`, `3.4`; `13.2`, `13.4` ← `4.2`, `4.4`; `14.2`, `14.3`, `14.5` ← `5.1`, `5.2`, `5.4`; `15.2`, `15.3` ← `6.1`, `6.2`; `16.2`, `16.5` ← `7.1`, `7.5`; `17.2`, `17.3` ← `8.1`, `8.2`. Phần tầng ghim nuốt mất mà lớp lấp chèn lại: (i) `9.2` “in the hot springs” (`tapode`) ; (ii) `14.2` — tầng ghim ở `5.1` chỉ dịch “I’m not, respectable sir.” và bỏ cả vế `sandiṭṭhikaṁ hitvā kālikaṁ anudhāvāmi`, lớp lấp chèn lại theo `5.2` (“giving up what is apparent in the present to chase after what takes effect over time”); (iii) `16.2` ghép `7.1`+`7.2` vì Pāli gộp hai câu vào một khoá. Ngôi kể đổi sang “I”/“sir”/“me” theo Pāli (`ahaṁ`, `bhante`, `maṁ`). Dòng dẫn nhập `11.1`, `13.1`, `14.1`, `15.1`, `16.1`, `17.1` (B theo máy, 0,62–0,82): tầng ghim không dịch dạng lời kể ngôi thứ nhất; lấy lời của `18.1` (“that deity said to …”) và `4.1`, thành “When this was said, sir, …”. `14.1` = `16.1` và `15.1` = `17.1` giống nhau từng chữ vì Pāli của từng cặp giống nhau.

  **Nhóm 3 — kết chương `28.5` (B, 0,63 ← `0.2`) và kệ `29.0`–`29.6` (C, 7 khoá).** `28.5` `Nandanavaggo dutiyo.` → “The Garden of Delight chapter, the second.” (khuôn `an10.50:14.3`; tên chương lấy ở `0.2`). `29.0` → “Its summary verse:”; sáu dòng `29.1`–`29.6` dịch bằng tên mười bài `sn1.11`–`sn1.20` của tầng ghim (“The Garden of Delight”, “Delight”, “There’s Nothing Like a Child”, “Aristocrats”, “Resounding”, “Sleepiness and Sloth”, “Hard to Do”, “Conscience”, “Little Hut”, “With Samiddhi”).

  **Ngoặc kép — đo.** 40/40 khoá khớp Pāli từng khoá. Nhưng lời Sujato dùng làm nguồn (`2.1`–`8.2`) dùng nháy kép “…” vì ở đó vị thiên nói trực tiếp, còn Pāli của phần kể lại lồng một tầng **nháy đơn** ‘…’ trong lời Samiddhi (`9.1` mở “, các khoá `10.1`…`17.3` mở/đóng ‘ ’, `17.4` đóng ”). 12 khoá B (`10.1`, `10.4`, `12.1`, `12.4`, `13.2`, `13.4`, `14.5`, `15.2`, `15.3`, `16.5`, `17.2`, `17.3`) lấy lời Sujato có nháy kép và **đổi sang nháy đơn** để khớp Pāli; `14.2`, `16.2` viết mới với nháy đơn; `9.1` mở nháy kép như Pāli; các khoá còn lại không có nháy.

  **Cố ý lệch tầng đã ghim.** Tầng ghim bỏ phần kể lại; lớp lấp điền vào nên cột English hiện lại những câu vị thiên đã nói ở `2.x`–`8.x`. Do Pāli gốc lặp.

  **Ngoài lát.** Không khoá nào cắt cụt (đo: 0). Không có dấu “…” thừa ở tầng ghim.

  **Ngoặc kép / nháy — bảng đo tự động trên 40 khoá.** 40/40 khoá khớp Pāli từng khoá (đếm “ ” ‘ ’ đóng/mở; `’` có chữ thường đứng ngay sau tính là dấu nhạt lược). Không khoá nào lệch.

  **Dấu lược.** 0 khoá lấp có `…pe…` trong Pāli; tổng số `…` trong English của 40 khoá lấp = 0; khớp quy tắc `…pe…` = đúng một `…` (không khoá nào có `…` mà Pāli viết đủ).

  Không còn khoá rỗng nào: 40/40 khoá `fillableSegments` đã được viết (17 khoá dưới 40 ký tự vẫn viết).

  **Coverage (đo thật).** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 52. Trước: 29/52 = 0,5577. Sau khi `published`: 52/52 = 1,0000 (lớp lấp phủ 23 khoá có nội dung; 17 khoá dưới ngưỡng không tính). Độ nhạy: ngưỡng 0,8 cần ≥ 42 khoá có lời; sau lấp còn dư 10 khoá trước khi rớt ngưỡng; trước lấp thiếu 13 khoá. Bài đã dưới ngưỡng trước khi lấp.

  **Hệ quả với `content/meta/reference-gaps.yaml`.** `sn/sn1.20` **có** record trong file đó; sau khi lớp lấp `published`, coverage = 1,0000 nên record thành thừa (test `a fill never leaves a gap record it has cured` sẽ đỏ nếu để lại). Không chạm file ấy trong lát này; để người điều phối sinh lại bằng `npm run reference:gaps`.

  **Triangulation 8,5.** Scorecard của bản Việt `content/meta/sutta/sn/sn1.20.yaml` do công cụ **khác họ** với lớp lấp này chấm/dịch (xem `source/tooling.yaml`), nên về mặt tác giả đây là lớp đọc English độc lập; nhưng điểm vẫn ≤ 9,5 vì không có bản Anh thứ hai cho 23 khoá có nội dung nằm trong lát, và 8,5 vì chỉ có Pāli root + Sujato đã ghim (108 khoá) + bản Việt canonical để đối chiếu. Không chạm bản Việt.

  **technical_integrity 9,6.** Không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, giao cho người điều phối. Không đặt blocker.
