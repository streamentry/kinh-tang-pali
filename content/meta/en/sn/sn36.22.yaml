notes: |-
  CẢNH BÁO TRƯỚC — đây là khoảng dễ nhất lát e2: BA KHOÁ LẶP LẠI THỨ BẢN ĐÃ GHIM ĐÃ CÓ SẴN.

  `1.4` bản đã ghim dịch là: “Mendicants, in one explanation I’ve spoken of two feelings. In
  another explanation I’ve spoken of three feelings, or five, six, eighteen, thirty-six, or a
  hundred and eight feelings.” Nghĩa là bản đã ghim đã GỘP TRỌN `1.4`–`1.10` vào một câu, trong
  khi SuttaCentral cắt thành bảy khoá riêng. Vì vậy `1.8`/`1.9`/`1.10` (`aṭṭhārasāpi` /
  `chattiṁsāpi` / `aṭṭhasatampi`) khi tôi dịch sẽ nói lại đúng những gì `1.4` đã nói. Người đọc
  bốn bản sẽ thấy một câu bị lặp.

  Tôi vẫn điền, vì để trống cũng không phải cách thoát:

    1. `fillableSegments` cho phép ba khoá này và quy định của lớp lấp là chỉ điền chỗ bản đã ghim
       để trống. Bỏ trống nghĩa là một khoá Pāli có nội dung mà không tầng Anh nào đọc — đúng thứ
       AGENTS.md gọi là lỗ hổng, và `validate` cũng không cho giá trị rỗng.
    2. Lựa chọn còn lại là bịa một cách viết khác để tránh lặp, tức là đưa tiếng Anh không có nguồn
       vào tầng lấp. Tệ hơn nhiều.

  Cách viết của tôi là trung thành với từng khoá: `[X]pi mayā vedanā vuttā pariyāyena` → “In
  another explanation I’ve spoken of X feelings, too.” (`pi` là enclitic “cũng”). Cụm “In another
  explanation” là của chính bản đã ghim ở `1.4`. Ghi rõ ở đây để biên tập viết PR biết đây là
  lỗi CỦA CÁCH CẮT ĐOẠN upstream, không phải lỗi dịch — và nếu muốn, sửa đúng cách là sửa
  `sn36.22:1.4` ở tầng đã ghim, việc đó ngoài phạm vi lớp lấp.

  `2.16` và `2.19` thì sạch: chúng là công thức `imā vuccanti, bhikkhave, [số] vedanā.` mà bản
  đã ghim đã dịch ở `2.3` (“These are called the two feelings.”) và `2.22` (“These are called the
  hundred and eight feelings.”), nên tôi chỉ thay số: “These are called the eighteen feelings.” /
  “These are called the thirty-six feelings.” Dấu chấm ở `2.19` không có ở `2.16` là vì Pāli
  khác nhau đúng ở dấu chấm.

  Bất định còn lại: chỉ có vụ lặp nói trên, và nó đã được ghi nhận đầy đủ nên không chặn. Vì nó
  làm cột Anh đọc lên thấy lỗi, tôi hạ `vietnamese_clarity` xuống 8.4 — đây là tiêu chí bị tổn
  nhiều nhất, còn `segment_alignment` vẫn 10.0 vì khoá đúng và không có khoá mồ côi.

  Lớp lấp: 5 khoá nằm ở chỗ bản Anh đã ghim để trống; `1.2`, `1.5`, `1.6`, `1.7`,
  `2.6`, `2.9`, `2.13`, `2.24` cũng trống nhưng ngoài lát này. Triangulation bị chặn ở 8.0.
