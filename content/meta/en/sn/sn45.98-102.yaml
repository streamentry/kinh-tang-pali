notes: |-
  Bốn cột của bài này đều đã đọc, và **hai bài `sn45.98-102` / `sn45.134-138` là cùng một văn bản** (lần đầu là `sn45.91-96`; `sn45.97` là bản thứ ba của cùng Pāli). Năm khoá lấp trùng nhau bốn trên năm; tôi dùng **cùng một cách diễn đạt cho cả hai bài**. Chỉ `1.13` khác nhau, và khác đúng ở chỗ Pāli khác.

  Tiền lệ lấy từ chính tầng Anh đã ghim: `nibbānaninno hoti nibbānapoṇo nibbānapabbhāro` → "slants, slopes, and inclines to extinguishment" (`sn45.103:1.2/1.3/1.5` và **79 khoá Pāli trùng công thức**); danh sách năm dòng sông → "the Ganges, Yamunā, Aciravatī, Sarabhū, and Mahī" (`sn45.96:1.2`, `an10.15:10.1`). Riêng `1.13` dùng tiền lệ `sn45.139:1.7`, có **Pāli giống hệt**: vế `vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ` → "which relies on seclusion, fading away, and cessation, and ripens as letting go" (`sn45.2:3.2`, `sn3.18:5.2`).

  ⚠ **Không mở rộng `…pe…`.** Tầng ghim ở `sn45.139:1.7` **bung** `…pe…` thành đủ tám ngành chánh đạo. Lớp lấp làm ngược lại: `1.13` giữ đúng một `…`. Vì vậy `1.13` ngắn hơn hẳn bản ghim — có chủ ý.

  ⚠ **Một chỗ cố ý KHÔNG chép y nguyên tầng ghim.** `sn45.103:1.3` có **Pāli giống hệt** `1.12`, nhưng bản ghim bỏ mất `bahulīkaronto` (chỉ còn "develops"), trong khi `1.2` và `1.5` của chính bài ghim đó lại giữ đủ "develops **and cultivates**". Pāli root là authority nên `1.12` của tôi giữ cả hai động từ — `1.11` và `1.14` cũng vậy. Bất nhất đó thuộc tầng ghim, không phải lớp lấp; ghi ra đây để người sau không tưởng tôi sao chép thiếu.

  ⚠ **Cách mở đầu theo đúng nhà văn của tầng ghim.** `Idha, bhikkhave, bhikkhu X bhāveti` được Sujato dịch "It's when a mendicant develops…" (`sn46.48:1.5`, `sn46.13:2.2`, `sn45.2:3.2`, `sn45.139:4.6`), nên `1.13` cũng dùng cung ấy.

  ⚠ **Lớp lấp này KHÔNG phải lớp đọc Anh độc lập cho bài này.** `content/meta/sutta/sn/sn45.98-102.yaml` ghi `quality.assessed_by: "OpenCode Space Bunny Free (agent)"`, đúng công cụ đã viết lớp lấp này. Vì vậy `triangulation` hạ xuống **7.5**, và `validate` sẽ **cảnh báo** rằng phủ Anh ở bài này dựa trên bản lấp của chính người viết bản Việt. Tôi **không sửa** scorecard tiếng Việt.

  Điểm `technical_integrity` = 9.6 vì lát này bị cấm chạy cổng. Còn lại: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Bốn khoá `1.2/1.4/1.6/1.8` (`evameva kho, bhikkhave, bhikkhu …pe…`) để trống ở tầng ghim nhưng chỉ **37 ký tự**, dưới ngưỡng 40 nên cổng coverage không đo, và ngoài lát này. Chúng xen giữa các khoá tôi vừa lấp nên cột Anh của bài sẽ có lỗ trống ở `1.2`, `1.4`, `1.6`, `1.8`.
