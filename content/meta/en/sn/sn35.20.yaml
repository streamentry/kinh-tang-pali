notes: >-
  A two-part sutta. Part one: whoever takes pleasure in a sense base takes pleasure in suffering.
  Part two, opening with `nābhinandati`: whoever does not is likewise not free from suffering.
  The first member of each part is all the pinned edition translates, so what Sujato publishes is
  1.1–1.2 and nothing else, and the text looks like a single assertion rather than a symmetric pair
  stated over six bases twice.

  1.8 is the same Pāli as 1.2 and reuses Sujato's rendering of it word for word, minus the `…`
  and the closing quote he needed there because 1.2 is followed by the elided 1.3–1.6. 1.8 is not:
  it is followed by the second speech at 2.1, and the Pāli closes with a plain full stop.

  2.2 and 2.8 are likewise the same clause, and neither has a pinned rendering — so they are
  written once and used twice. The two halves of the sutta are mirrors, and the fill keeps them
  mirrors: every line of 2.7–2.8 is its 1.7–1.8 counterpart with `nābhinandati` in place of
  `abinandati`, and nothing else changed. Rendering the second half freshly would have invited
  exactly the drift the mirror structure forbids.

  Sujato's word for `rūpe` at 1.1 is "sights", and the fill keeps it at 2.1. `dhamme`, the sixth
  base, is rendered "Dhammas" in both 1.7 and 2.7 — the enumeration reads sights, sounds, smells,
  tastes, touches, Dhammas, and "Dhammas" is what keeps the sixth member in the same register as
  the other five.

  The scope of the negation is the point of the sutta and is carried consistently: `nābhinandati`
  governs both clauses of the line, so "you don’t take pleasure in X, you don’t take pleasure in
  suffering", not merely the first. Quotation marks follow the Pāli — `“` opens at 2.1, `”` closes
  at 2.8, and 2.2 stays open.

  Triangulation is capped at 8.0: Sujato translates only 1.1–1.2 here.