notes: |-
  1.5/1.6 lặp NGUYÊN VĂN Pāli của 1.2/1.3. Dùng lại nguyên bộ danh từ Sujato: "the land of the
  Sakyans, in the Great Wood near Kapilavatthu, together with a large Saṅgha of five hundred
  mendicants, all of whom are perfected ones" và "most of the deities from ten solar systems".
  `sannipatitā honti` là thì hiện tại, nên 1.6 dịch "have gathered" chứ không theo "had
  gathered" của 1.3.

  Quyết định biên tập đáng ghi: Sujato dùng thì QUÁ KHỨ ở 1.2/1.3 vì đó là tự sự của Đức Thế
  Tôn. Ở 1.5/1.6 đây là nội dung ý nghĩ của bốn vị thiên thần (`etadahosi` → "thought:" theo
  1.4), nên thì hiện tại mới đúng; giữ "had gathered" sẽ phá mạch. Đây là chỗ duy nhất lát 6
  cố ý lệch thì với bản đã ghim, và lý do đã nêu ở đây.

  `bhikkhusaṅgha` giữ "Saṅgha" vì đó là từ Sujato dùng xuyên suốt; `pañcamattehi bhikkhusatehi`
  = "five hundred mendicants", `sabbeheva arahantehi` = "all of whom are perfected ones".

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
