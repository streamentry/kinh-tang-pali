notes: |-
  Lát 602. Bốn mươi bảy khoá lấp = bốn mươi bảy khoá tầng Anh đã ghim để trống; 28 khoá có nội dung, 19 khoá dưới
  ngưỡng (các vế `‘sassato loko’”ti.`…, các câu đáp `Abyākataṁ kho etaṁ, vaccha, bhagavatā:` 39 ký tự, `4.5`
  `4.11` `6.2` `6.5` `7.5` có `…pe…`, nhãn `8.7`) vẫn lấp để bài liền mạch.

  **Bốn nhóm khoá (đo bằng máy trên 82 khoá Pāli):** A **14** · B **9** · C **24** · D **0**.

  Tầng đã ghim **tóm gọn** bài theo hai cách, và đó là lý do có 47 khoá trống: (1) ở `2.1`–`2.30` chỉ dịch câu hỏi,
  bỏ trống mọi câu đáp và mọi mệnh đề được nhắc lại; (2) ở `5.2` viết “He asked the Buddha the same questions, and
  received the same answers.” thay cho toàn bộ `5.3`–`7.11` (22 khoá liên tiếp). Lớp lấp dịch đủ các khoá ấy theo
  Pāli, nên cột English sẽ có cả câu tóm tắt của `5.2` lẫn phần được tóm tắt — hệ quả của tầng đã ghim, ghi lại.

  - **A (14), trong đó 12 khoá lệch có chủ đích ở dấu câu.** `2.8` `2.14` `2.20` `2.26` (= `2.2`) và `2.5` `2.11`
    `2.17` `2.23` (= `2.29`): lời đã ghim kết bằng `.”` dù Pāli kết bằng `:` và **không đóng nháy** (mệnh đề được
    nhắc lại nằm ở khoá sau). Lớp lấp giữ nguyên chữ (“Vaccha, this has not been declared by the Buddha” / “This too
    has not been declared by the Buddha”, kể cả việc `2.29` đã ghim bỏ `vaccha`) nhưng kết bằng `:` không đóng
    nháy, để khoá sau (`2.3`, `2.6`…) mang `’”` đúng Pāli. `7.1` `7.7` (= `4.1` `4.7`) và `7.2` `7.8` (= `4.2`
    `4.8`): lời đã ghim **mở rộng `…pe…` thành hai dấu** (“They regard the ear … nose …”, “tongue … body …”) và ở
    `4.2`/`4.8` bỏ luôn câu trích `‘etaṁ mama…’`; lớp lấp giữ đúng một `…` và giữ câu trích theo Pāli. Hai khoá A
    còn lại (`7.3`, `7.9`) nguyên văn.
  - **B (9)**: `5.3` (từ `2.1`, 0,88), `5.5` (`2.28`, 0,92), `5.6` (`2.29`, 0,80: “by me” thay “by the Buddha”
    vì `mayā`), `5.7` `2.30` (`2.28`, 0,82), `6.1` (`3.1`, 0,94) và `6.4` (`3.3`, 0,88): lời đã ghim kết bằng “…
    one of these to be true?” còn Pāli kết bằng `:` dẫn sang danh sách ở khoá sau ⇒ lớp lấp kết bằng “they
    declare:” / “he does not declare:”; `7.4` `7.10` (`4.4` `4.10`, 1,0) cùng lý do.
  - **C (24)**: mười mệnh đề được nhắc lại (`2.3`…`2.27`) dùng đúng chữ của tầng đã ghim ở câu hỏi liền trước
    (“the cosmos is eternal”, “a realized one neither still exists nor no longer exists after death”…); hai danh sách
    đủ mười mệnh đề `3.2` `3.4` không nháy (Pāli không nháy) và `7.11` mười cặp nháy đơn (Pāli 10/10); các mảnh có
    dấu lược `4.5` `4.11` `6.2` `6.5` `7.5` mỗi khoá đúng một `…`; nhãn `8.7` “Seventh.” (bài thứ bảy của phẩm, khớp).

  **Ngoại lệ nháy có chủ đích — đo trước, ghi cả hai số.** `5.3` và `5.5`: Pāli 0 nháy đơn, lớp lấp 1/1. Tầng đã
  ghim dịch mọi câu hỏi cùng khuôn (`2.1`, `2.4`) bằng nháy đơn lồng (“is this right: ‘the cosmos is eternal’?”), và
  16/82 khoá đã ghim của bài có số nháy khác Pāli vì quy ước ấy. Lớp lấp theo quy ước của khoá anh em để hai câu
  hỏi gửi Đức Phật không lệch hai câu hỏi gửi Moggallāna. Mọi khoá lấp khác khớp Pāli (45/47).

  **Dấu lược:** Pāli của 47 khoá có 10 dấu lược (`…pe…` tính một), lớp lấp 10.

  **Coverage (đo bằng phép của `englishCoverageFor`: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước: 31/59
  = 0.5254. Sau khi lớp lấp `published`: 59/59 = 1.0. Độ nhạy: phải mất thêm 12
  khoá có nội dung nữa thì bài mới rớt dưới ngưỡng 0,8. Lớp lấp chỉ được tính khi `status: published`.
  `sn/sn44.7` **có** record trong `content/meta/reference-gaps.yaml` (substantive 59, thiếu 28); record đó sẽ thành thừa khi lớp lấp `published`. Lát này **không** chạm tệp đó; người điều phối sinh lại bằng `npm run reference:gaps`.

  **Hai cơ chế khoá trống ở tầng Anh đã ghim (đo, không sửa).** Cắt cụt dãy (≥ 4 khoá trống liên tiếp):
  1 dãy / 22 khoá / 1.622 ký tự Pāli (`5.3`–`7.11`). Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 44/47 khoá trống vào nhóm
  (kiểm `kết quả ≤ số khoá trống`: đạt).

  **Triangulation ≤ 8,0.** Scorecard Việt của bài (`content/meta/sutta/sn/sn44.7.yaml`) ghi `translators` và `quality.assessed_by` là công cụ cùng họ với lớp lấp — **cùng
  alias công cụ** với lớp lấp này (khai trong `source/tooling.yaml`). Vì vậy bản lấp **không phải** cách đọc
  English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá lấp.
  Không có bản Anh thứ hai; đối chiếu có: Pāli root + Sujato đã ghim (cho khoá anh em) + bản Việt canonical (chỉ
  để đối chiếu nghĩa, không dịch vòng, không chép).

  **technical_integrity 9,6.** Lát này không được chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh
  còn nợ: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Tự kiểm đã làm: JSON parse, mọi khoá
  thuộc `fillableSegments`, không khoá nào trùng khoá Sujato có chữ (0 shadow), NFC, không khoá rỗng, dấu lược
  khớp Pāli (`…pe…` = một `…`), nháy khớp Pāli từng khoá trừ các ngoại lệ ghi ở trên.
