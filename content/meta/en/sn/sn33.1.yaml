notes: |-
  Cả ba khoá nằm trong danh sách `diṭṭhigata` mà Sujato đã dịch trọn ở 1.5 của
  CHÍNH bài này, nên bản lấp bám sát bộ từ đó:

    - 1.11 (`sassato lokoti vā, asassato lokoti vā …pe…`) dùng nguyên văn bản ghim
      "the cosmos is eternal, or not eternal …" — cùng Pāli đã được Sujato dịch ở
      sn33.2:1.4.
    - 1.9 và 1.12 chỉ còn mệnh đề cuối của danh sách. Lấy nguyên vế Sujato đã dùng ở
      1.5 ("or neither still exists nor no longer exists"), thêm chủ ngữ cho đứng một
      mình, và giữ "after death" — vì `…pe…` ở 1.8 đã nuốt mất mệnh đề dẫn "after death,"
      của danh sách.

  Bất định đã ghi nhận:

    - "or a realized one neither still exists nor no longer exists after death" chưa có
      tiền lệ nào trong tầng dưới dạng mệnh đề độc lập: Sujato chỉ dùng nó nằm trong
      danh sách 1.5 của chính bài này, và ở dn29:30.17 thì nó nằm trong câu hỏi "Then
      is this your view: …", không đứng một mình. Hình thức chọn ở đây là do bản lấp ghép,
      nên `ambiguity_integrity` hạ 9.3.
    - Đếm ngoặc: Pāli ở Sn 33 kết `”ti` (MỘT ngoặc đóng), khác Sn 24 kết `’”ti`
      (HAI ngoặc đóng). Vì vậy 1.12 kết bằng `.”` chứ không phải `’.”`. Đây là lý do
      bắt buộc phải đếm từng khoá chứ không dùng một khuôn chung cho cả hai bài.
    - Bản Việt của dự án dịch 1.9 là "hoặc không có Như Lai sau khi mạng chung mà cũng
      không không có" và 1.11 là "sau cùng là thế giới thường còn, hoặc không thường còn";
      hai bản cùng nghĩa với bản lấp. Lưu ý bản Việt dùng "linh hồn" cho `taṁ jīvaṁ
      taṁ sarīranti` ở 1.5, còn Sujato dùng "the soul and the body" — bản lấp không sửa,
      và cũng không dịch lại 1.5.
    - Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của
      lớp lấp. `triangulation` bị chặn ở 8.0 vì không có bản Anh độc lập.
