notes: |-
  Tiền lệ dồn: `Idha, bhikkhave, bhikkhu` + `araññagato` đã có bản Anh đã ghim ở 9 bài, cùng một khuôn
  — sn54.1:1.7, sn54.8:2.1, sn54.9:8.1, sn54.13:4.2, sn54.16:3.2, dn22:2.2, mn118:17.1, mn10:4.2,
  mn62:25.1 ("It's when a mendicant—gone to a wilderness, or to the root of a tree, or to an empty
  hut—sits down…"), và hai bài có vế `paṭisañcikkhati` nên dùng dạng động từ "has gone to a
  wilderness" — mn48:8.2, mn43:33.2. Ở đây danh sách bị `…pe…` cắt, nên `…` phải nằm GIỮA danh sách
  ngay sau "or", không đưa lên cuối. Không mở rộng `…`.
  
