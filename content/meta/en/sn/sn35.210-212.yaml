notes: |-
  Tiền lệ rất trực tiếp: Pāli của khoá này đã được bản Anh đã ghim dịch ngay trong cùng bài, chỉ khác ở phần bị lược ở đuôi — `sn35.210-212:1.2` (Pāli y hệt 1.5) (Sujato): “And what’s not-self should be truly seen with right understanding like this: ‘This is not mine, I am not this, this is not my self.’ …””. Bản lấp giữ nguyên câu đó, bỏ đúng phần `…` và `”` mà khoá này không có. Ba bài (`sn35.5`, `sn35.6`, `sn35.210-212`) dùng chung một chữ, vì Pāli giống nhau và bản đã ghim đã dịch giống nhau.

  `sammappaññāya` → “right understanding”, theo bản đã ghim của chính bài này — KHÔNG phải “right wisdom” như Sujato dùng cho `sammappaññā` ở `sn35.71`/`sn35.72`; khác ngữ cảnh nên giữ bản đã ghim. `anattā` giữ “not-self” (không dịch “non-self”) vì mọi bài anh em trong `sn35` và bản đã ghim đều dùng “not-self”. Không bất định.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
