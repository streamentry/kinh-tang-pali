  **Phân loại 15 khoá (đo bằng máy, mỗi khoá một nhóm): A y nguyên = 0 · B dựng lại = 14 · C tự dịch = 1 · D (Pāli trùng, lời Anh của tầng đã ghim khác nhau) = 0.** Đã ghi 15/15 khoá `fillableSegments` của bài (12 khoá có nội dung ≥ 40 ký tự Pāli, 3 khoá ngắn hơn ngưỡng). Số khoá Sujato để trống mà lát **không** lấp: 0.

  **Nhóm 1 — `8.2`–`8.7` (cảm thọ) và `9.3`–`9.8` (hành), dựng lại từ khuôn sắc `7.3`–`7.7`.** Ở khoá sắc, tầng đã ghim dịch đủ: “In the past I was
  also bitten by form just like now.” (`7.3`), “If I were to look forward to enjoying form in the future, I’d be bitten by form in the future just
  as I am today.’” (`7.4`), “Reflecting like this they are not concerned with past form,” (`7.5`), “they don’t look forward to enjoying future form,”
  (`7.6`), “and they practice for disillusionment, dispassion, and cessation regarding present form.” (`7.7`). Với cảm thọ và hành, Sujato chỉ viết
  `8.1` “Currently I’m bitten by feeling …” và `9.1`–`9.2` “perception … / choices …” rồi để trống phần còn lại. Bản lấp lấy đúng khuôn sắc, đổi “form” →
  “feeling” / “choices” (số nhiều, theo Pāli `saṅkhārehi`, `anāgate saṅkhāre`) và **tách `8.3`/`8.4`, `9.4`/`9.5`** theo Pāli (Pāli tách
  `Ahañceva … abhinandeyyaṁ;` và `anāgatampāhaṁ … khajjāmī’ti` thành hai khoá, còn `7.4` của tầng đã ghim thì gộp cả hai). Tỉ lệ khớp đo
  được: `8.2`←`7.3` 0,89 · `8.4`←`7.3` 0,83 · `8.5`←`7.5` 0,81 · `8.6`←`7.6` 0,86 · `8.7`←`7.7` 0,88 · `9.3`←`7.3` 0,82 ·
  `9.5`←`7.3` 0,77 · `9.6`←`7.5` 0,79 · `9.7`←`7.6` 0,75 · `9.8`←`7.7` 0,87.
  **`10.4`** (B, 0,91 với `10.2`): tầng đã ghim viết `10.3` gộp cả hai vế của Pāli `10.3` + `10.4` (“If I were to look forward to enjoying
  consciousness in the future, I’d be bitten by consciousness in the future just as I am today.’”). Bản lấp `10.4` chỉ dịch vế thứ hai
  (“I’d be bitten by consciousness in the future just as I am today.’”) — nên **vế này xuất hiện hai lần** (một lần trong `10.3`, một lần ở
  đây); đây là hệ quả của việc tầng đã ghim gộp khoá, hiện ra thay vì giấu.
  **`1.7`** (0,93 với `1.5`): “Recollecting thus, it’s only feeling that they recollect.” — khuôn `1.5`, `1.11`.
  **`9.3`**: Pāli kết bằng `khajjāmīti.` không có dấu nháy đóng; bản lấp không đóng nháy ở `9.3`. **`15.5`** nhãn `Sattamaṁ.` → “Seventh.”.

