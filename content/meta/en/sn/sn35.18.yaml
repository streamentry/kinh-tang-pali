notes: |-
  **Đây là lát tệ nhất của cột English trong phẩm `sn35`, và lớp lấp này vá gần như toàn bộ.**
  Bài có **22** khoá Pāli; bỏ khối tham chiếu `:0` (`0.1` `0.2` `0.3`) còn **19**. Ngưỡng nội dung **40** ký tự
  (đo đúng định nghĩa của kho: gộp khoảng trắng, `trim()`, rồi đếm) cho mẫu số **14** khoá; **5** khoá dưới
  ngưỡng: `1.7` (31), `1.8` (11), `1.9` (9), `1.10` (15), `2.3` (9). Tầng Anh đã ghim có chữ ở **đúng một** khoá
  không-`:0`, tức `1.1`; **18** khoá còn lại trống, và 18 khoá đó **bằng đúng** tập lấp của lát này ⇒ **không
  còn khoá trống nào**.

  **Vì sao tầng ghim trống — đo, không đoán.** Không phải chưa dịch, cũng không phải lỗi cắt segment. Tầng ghim
  đã in **đoạn `1.1`–`1.16` thành một khối trích dẫn và chỉ phát chữ câu đầu tiên**, rồi im; `2.1` `2.2` và
  nhãn `2.3` hẳn nữa không vào tầng ghim. Riêng `1.7`–`1.10` là bốn khoá **lược `…`**, tức đúng loại khoá mà tầng
  ghim hay bỏ trắng. Nói thẳng: tầng Anh của bài này **không hỏng ở vài chỗ, mà hỏng ở 18/19 khoá**.

  **Phép thực nghiệm mục 5d (gộp khoá) — đo ra 0, và đây là kết quả quan trọng.** Vì chỉ có `1.1` mang chữ,
  chỉ có **một** cặp cần kiểm, và câu `1.1` không in ra nội dung khoá kế tiếp: lời ghim ở `1.1` chứa **0** trong
  **12** cụm phân biệt của khoá kế (*but since · there is · are aroused · grow disillusioned · escape from ·
  these six · truly understand · haven't escaped · they've escaped · live detached · mind free of boundaries*).
  Đây **không** phải kết quả của phép đo yếu: chạy đúng phép đó trên hai bài cùng phẩm **có** gộp khoá thì lửa
  (`sn35.20:1.1` in trọn cả câu *"you're not free from suffering, I say."* của `1.2` vào `1.1`; `sn35.16:1.1`
  in *"and I found it."* của `1.2`). Vì vậy **người đọc sẽ không thấy nội dung nào lặp hai lần ở bài này** — đây là
  điểm tốt, và nó là lý do bài này an toàn hơn ba bài anh em mà người điều phốn kể.

  **Coverage: trước → sau, bằng số.** Trước: **1/14 = 0,0714** (trùng khớp tỉ lệ bản làm việc truyền vào).
  Mười ba khoá có nội dung còn trống đều nằm trong lát này. Sau khi lớp lấp này `published`: **14/14 = 1,0000**.
  **Độ nhạy ngưỡng 0,8**: với mẫu số 14, cần **12** khoá (11/14 = 0,7857 < 0,8; 12/14 = 0,8571 ≥ 0,8).
  Trước lớp lấp này thiếu **1**; sau lớp lấp này dư **2**. Không cần khoá nào nữa.

  **Bốn loại khoá, đếm trước khi viết. A = 3 · B = 12 · C = 3 · D = 0.**
  - **A = 3** — Pāli trùng **từng byte** với một khoá đã có lời ở tầng ghim, ở **bài khác**:
    `1.8` = `gandhānaṁ … ` trùng `sn35.136:1.13` (tầng ghim: *"smells … "*) ·
    `1.9` = `rasānaṁ … ` trùng `sn35.136:1.14` (*"tastes … "*) ·
    `1.10` = `phoṭṭhabbānaṁ … ` trùng `sn35.136:1.15` (*"touches … "*). Ba khoá này **chép nguyên văn** lời ghim.
  - **B = 12** — Pāli gần trùng khoá đã có lời ở tầng ghim, dựng lại từ lời đó:
    `1.2` `1.3` `1.4` `1.5` `1.6` `1.7` `1.11` `1.12` `1.13` `1.14` `1.15` `1.16`.
  - **C = 3** — không khoá nào ở tầng ghim có lời cho Pāli này, phải tự dịch từ Pāli: `2.1` `2.2` `2.3`.
  - **D = 0** — quét mọi cặp Pāli trùng byte trong bài: **không** cặp nào trùng Pāli *với nhau* (mười tám khoá
    trong lát này đều là Pāli duy nhất trong bài), nên không có cặp Pāli trùng mà lời ghim khác nhau ⇒ không có gì
    để báo, không có gì để hòa.

  **Nhóm B — khoá nguồn, tỉ lệ khớp đo được, và phần chèn lại.** Khoá nguồn là bài anh em **nội xứ** `sn35.17`
  (`Paṭhamanoceassādasutta`, cùng `2. Yamakavagga`): cùng khung câu, chỉ đổi một danh từ vị trí
  (`cakkhussa/cakkhusmiṁ/cakkhusmā` → `rūpānaṁ/rūpesu/rūpehi` ở `1.2`–`1.6`; `manassa/manasmiṁ/manasmā` →
  `dhammānaṁ/dhammesu/dhammehi` ở `1.11`–`1.16`). Tỉ lệ khớp Pāli (đo từng cặp, so sánh cấp từ):
  `1.2` 0,727 · `1.3` 0,800 · `1.4` 0,727 · `1.5` 0,800 · `1.6` 0,727 · `1.7` 0,667 · `1.11` 0,588 ·
  `1.12` 0,818 · `1.13` 0,800 · `1.14` 0,818 · `1.15` 0,800 · `1.16` 0,818. Phần chèn lại đúng **một mẹo** mỗi khoá:
  **the eye → sights** (và **the mind → ideas**), giữ nguyên mọi từ chức năng còn lại; riêng đại từ
  `it` → **`them`** vì Pāli bên ngoại dùng số nhiều `rūpesu`/`dhammesu`, và đại từ **`them`** là cách tầng ghim
  đã dùng ngay tại `1.1` của chính bài này.

  **Vì sao `2.1` `2.2` là C chứ không phải B, nói rõ để không ai đọc nhầm.** Pāli của chúng gần trùng `sn35.17`
  nhất trong cả bài — tỉ lệ **0,969** và **0,970**, chỉ khác **một từ**: `ajjhattikānaṁ` → `bāhirānaṁ`. Bản Anh
  đã ghim ở hai khoá song song ấy có chữ và đầy đủ, nên về mặt bằng chứng thì đây là nguồn tốt nhất có sẵn. Nhưng
  hai câu ấy dài **60** từ, và chép nguyên văn dài từ bản dịch bên thứ ba vào kinh văn canonical là điều bị cấm.
  ⇒ Lớp lấp **tự viết** hai câu này từ Pāli, dùng bản ghim kia để **đối chiếu nghĩa** (`yathābhūtaṁ` → *"for what
  they are"*, `neva tāva` → *"certainly not"*, `vimariyādīkatena cetasā` → *"with mind free of boundaries"*),
  và **cố ý lệch về hình thức**. Hệ quả phải nói thẳng: người đọc `sn35.17` và `sn35.18` ở hai cột khác nhau sẽ
  thấy hai cách diễn đạt khác nhau cho cùng một đoạn Pāli. Đó là hệ quả của luật chống chép, không phải lỗi dịch.

  **Thuật ngữ — mỗi từ đều có tiền lệ đo được ở tầng ghim, không tự sáng tác.**
  `rūpānaṁ/rūpesu` → **sights** (tầng ghim `1.1` của chính bài này) · `saddānaṁ` → **sounds** ·
  `gandhānaṁ` → **smells** · `rasānaṁ` → **tastes** · `phoṭṭhabbānaṁ` → **touches** ·
  `dhammānaṁ/dhammesu` → **ideas** (đo toàn tầng: `sn35.136:1.16` dịch `dhammānaṁ` thành "ideas", và lớp lấp
  `sn35.70` đã dùng "ideas" cho `dhammesu`) · `assādo` → **gratification** · `ādīnavo` → **drawback** ·
  `nissaraṇaṁ` → **escape** · `sārajjanti/nibbindanti/nissaranti` → **aroused / grow disillusioned / escape**
  (đủ ba có tiền lệ ở `sn35.17:1.2`–`1.6` và `1.17`–`1.21`) ·
  `bāhirānaṁ āyatanānaṁ` → **the six exterior sense fields** (đo: `mn146:12.4` "The 'outer hide' is a term for the
  six exterior sense fields" · `sn35.238:11.1` · `sn35.241:3.2`) ·
  `samārakā sabrahmakā` → **its gods, Māras, and divinities** (đo **62** khoá tầng ghim có `sassamaṇabrāhmaṇiyā`,
  và **6** khoá có `samārakā sabrahmakā`, tất cả cùng cách dịch này) ·
  `sassamaṇabrāhmaṇiyā pajāya` → **this population with its ascetics and brahmins** ·
  `sadevamanussāya` → **its gods and humans** · `vimariyādīkatena cetasā` → **with mind free of boundaries**
  (đo **14** khoá, ví dụ `mn111:4.5`) · `bhikkhave` → **mendicants** · `sattā` → **sentient beings**.
  `Māras` giữ dấu ăng: đó là chính tả danh từ của tầng ghim, không phải Pāli lọt vào bản dịch.

  **Cố ý lệch tầng Anh đã ghim — ba chỗ, đều có lý do và số đi kèm.**
  1. **Mạo từ `in` trước `sights`/`ideas`.** Tầng ghim dịch `rūpānaṁ assādo` thành *"gratification in sights"*
     (tức lấy `in` cho cách cú), nên `1.2` `1.3` `1.4` `1.5` `1.6` và `1.11`–`1.16` giữ đúng cách đó. Kết quả có
     một hệ quả người đọc phải biết: với `rūpānaṁ assādo` tầng ghim có **hai** cách trong cùng bài — *"no
     gratification in sights"* ở `1.1` (có `in`) và, ở bài anh em nội xứ, *"gratification in the eye"*; lớp lấp chọn
     cách **có** `in` vì nó là cách **cùng bài** đã in ra.
  2. **Ba mệnh đề `nissaṭā visaññuttā vippamuttā` ở `2.1`/`2.2` được giữ thành ba.** Tầng ghim ở `sn35.17:2.1`
     nén ba từ Pāli này thành hai (*"detached, liberated"*); đo toàn tầng thì cụm `nissaṭā visaññuttā vippamuttā`
     chỉ có **2** lời ghim, và **cả hai đều ở `sn35.17`** — tức không có chỗ nào khác để kiểm chứng cách dịch ba từ.
     Lớp lấp vì vậy dịch đủ ba (*"separated, wholly liberated, fully freed"*) và ghi bất định này vào đây thay vì
     bịa một tiền lệ.
  3. **`2.2` không chép dấu `ti`.** Pāli kết `viharantī”ti. ` (dấu công bố *"vậy là lời Như Lai nói"*). Đo toàn
     tầng Anh đã ghim: **8.765** khoá có Pāli kết `”ti.` và **không** khoá nào dịch chữ `ti` — tầng ghim đóng
     khối trích dẫn bằng `”` rồi bỏ. Lớp lấp theo đúng quy ước ấy.

  **Dấu lược — không mở rộng, và một bẫy đã tránh.** Pāli có `…` ở **4** khoá của lát này (`1.7` `1.8` `1.9`
  `1.10`, mỗi khoá **đúng một** dấu) và lớp lấp ghi **đúng một** `…` ở cả bốn, **tổng 4** — trùng khớp từng khoá.
  14 khoá còn lại Pāli viết đủ, lớp lấp không thêm `…` ở khoá nào.

  **Bẫy 5c đã tránh: dấu `…` ở cuối khối trích dẫn là QUY ƯỚC của tầng ghim, không phải lớp lỗi `an8.35`.**
  Pāli `1.1` có **0** dấu lược mà tầng ghim ghi **1** — trông như đúng lớp lỗi *"tự thêm `…` nơi Pāli viết đủ"*.
  Đo toàn tầng trước khi kết luận: **772** khoá của tầng ghim kết `…”`, và phân bố số dấu lược Pāli của chúng là
  **{0: 233, 1: 98, 2: 361, 3: 39, 4: 29, 6: 6, 8: 5, 9: 1}** — tức **233** khoá Pāli viết đủ mà tầng ghim vẫn
  ghi `…`, và **361** khoá Pāli có `…pe…` (2 dấu) được quy về đúng một `…`. Vậy `1.1` là **đúng luật**, không tính
  lỗi. Riêng trong phẩm `sn35`: **58** khoá kết `…”`, trong đó **28** khoá Pāli viết đủ — cùng kết luận.
  `1.1` không thuộc lát này nên không đụng; điều này được ghi lại để người sau không sửa nhầm.

  **Ngoặc kép — phép đo từng khoá, luật không phát sinh ngoại lệ nào.** Trong **18** khoá lấp, đối chiếu **từng
  khoá** với Pāli: `“` lớp lấp **0**, Pāli **0**; `”` lớp lấp **1** (`2.2`), Pāli **1** (`2.2`); `‘` lớp lấp **0**,
  Pāli **0**; `’` trong lớp lấp xuất hiện **5** lần, tất cả là dấu nhạt lượu tiếng Anh của *"wouldn’t"* (`1.3` `1.5`
  `1.11` `1.13` `1.15`), không phải nháy đóng Pāli — đo bằng luật đúng của lớp lấp (`’` + `s|t|ll|re|ve|d|m` và
  không theo sau bằng chữ cái) cho ra **0** dấu `’` lạ. Dấu nháy kép của **cả bài** vẫn cân: `1.1` mở `“` (tầng
  ghim), `2.2` đóng `”` (lớp lấp), và tầng ghim không đụng dấu ấy. Không có ngoại lệ nháy kép lồng nhau nào để theo.

  **Kiểm riêng lớp lỗi `2.1` mà người điều phốn chỉ định — đo ra 0 ở bài này.** Pāli `2.1` và `2.2` chỉ nói
  `channaṁ … āyatanānaṁ` (một chữ số + một danh từ), và **không** liệt kê bất kỳ yếu vị trí nào: đếm từ `rūpa`
  `sadda` `gandha` `rasa` `phoṭṭhabba` `dhamma` trong hai khoá Pāli đó cho ra **0** mục. Ở bài anh em nội xứ
  (`sn35.17:2.1`/`2.2`, Pāli trùng 0,969/0,970) tầng ghim cũng chỉ viết *"these six interior sense fields"* và
  **không** liệt kê yếu nào — chỉ có chữ "mind" từ vế *"mind free of boundaries"*. ⇒ Bài này **không** dính lớp lỗi
  `sn35.101:2.1` / `sn35.93:2.1`. Chuỗi lỗi ấy (chuỗi *"Ear consciousness / Nose consciousness / Tongue
  consciousness / Body consciousness"*) đo toàn tầng Anh đã ghim xuất hiện ở **8** tệp: `mn148` `mn18`
  `sn12.43` `sn12.44` `sn12.45` `sn25.3` `sn35.60` `sn35.93` — **không** có `sn35.18`. Báo để người biên tập biết
  lớp lỗi còn nở ở đâu; **không** khoá nào thuộc lát này nên không sửa được (sửa tầng ghim là shadow).

  **Một lỗi tầng ghim cùng họ, đo được ở bài khác có Pāli trùng byte — báo, không sửa.** `sn35.136:1.12` có Pāli
  **đúng một từ** là `Saddānaṁ … `, nhưng tầng ghim in cho nó **cả câu** *"The Realized One has truly understood
  the origin, disappearance, gratification, drawback, and escape of sounds … "* — tức nội dung của `1.10` bị đẩy
  sang. Cùng loại với `sn35.70:7.3`/`7.5`. Lớp lấp `sn35.136` hiện chỉ có **một** khoá (`1.4`), nên khoá này chưa
  được chữa; `sn35.136` không thuộc lát này nên **không** chạm.

  **Số trùng Pāli đã dò toàn tầng — và phát hiện một điều đáng nói về chính bài này.** Dựng chỉ mục Pāli→khoá
  trên toàn bộ **5.764** tệp Pāli đã ghim (**284.708** khoá): mười tám khoá của lát này có **0** bản trùng byte ở
  bài khác, trừ ba khoá `1.8` `1.9` `1.10` (mỗi khoá trùng **6**, **6**, **2** khoá ở bài khác, và phần lớn là
  `sn35.136`/`sn35.137` cùng chạy "sáu yếu") và `2.3` (trùng **290** khoá ở **290** bài khác — `Chaṭṭhaṁ.` là
  nhãn số thứ tự, xem dưới). Ba khoá `1.8`–`1.10` là nguồn của **3** khoá nguyên văn của lớp lấp (nhóm A);
  `sn35.137:1.13` và `sn35.137:1.14` có Pāli trùng byte `1.9`/`1.10` nhưng lớp lấp `sn35.137` chỉ có `1.7` `1.8`
  `1.15` `1.16` nên **không** có xung đột. **Ba khoá** lấy nguyên văn; **mười hai** khoá lấp dựng lại (nhóm B).
  Về mặt cơ chế, đây là bài có mật độ lặp cao: cùng một khung câu chạy **hai lần** cho *sights* và *ideas*, và cùng
  một khung chạy **hai lần** cho mỗi vế *gratification · drawback · escape* — bài sẽ tự mâu thuẫn nếu các bản dịch
  lệch nhau, nên nhóm A và nhóm B là bắt buộc chứ không phải lựa chọn.

  **Nhãn thứ tự `2.3` — điền theo khuôn, và CẢNH BÁO bắt buộc.** Pāli `2.3` là `Chaṭṭhaṁ. ` ⇒ **"Sixth."**;
  tiền lệ trùng khuôn của lớp lấp có `sn35.70:7.6` (`Aṭṭhamaṁ.` → "Eighth.") và `ud5.8:6.5`. Đo toàn tầng Anh
  đã ghim: **0** khoá nào trong **291** khoá `Chaṭṭhaṁ.` có chữ — tức đây là khuôn **của lớp lấp**, không phải tiền
  lệ ở tầng ghim; ghi rõ để người đọc sau không tưởng lớp lấp sao chép tầng ghim. **Cảnh báo:** `2. Yamakavagga`
  gồm mười bài (`sn35.13`–`sn35.22`) nhưng chỉ **3** bài mang nhãn số thứ tự trong Pāli (`sn35.17` `Pañcamaṁ.` ·
  `sn35.18` `Chaṭṭhaṁ.` · `sn35.20` `Aṭṭhamaṁ.`), nên người đọc sẽ thấy "Sixth." ở đây rồi bài kế tiếp **không** có
  nhãn. Đồng thời chữ số `2.` trong tiêu đề hiển thị là **số vāgga**, còn `Sixth.` là **thứ tự bài trong vāgga** —
  hai hệ số khác nhau, đừng đọc `2.` thành "bài thứ hai". `2.3` dưới ngưỡng 40 ký tự nên **không** tính coverage;
  nó vẫn được lấp vì đây là chỗ trống người đọc thấy ngay dưới hai câu đã có chữ.

  **Hệ thống, không chỉ bài này — số để người biên tập biết tầng Anh hỏng tới đâu.** Quét **201** tệp của phẩm
  `sn35`: **2.702** khoá có nội dung, **2.325** khoá có chữ ở tầng ghim ⇒ **0,8605** toàn phẩm. Nhưng **26** bài
  trong phẩm chỉ có **đúng một** khoá `:1.1` mang chữ, và `sn35.18` là một trong số đó — đây là khuôn bệnh của cả
  nhóm, không phải tai nạn riêng: `sn35.16` `sn35.56` `sn35.57` `sn35.58` `sn35.77` `sn35.78` `sn35.169`–`sn35.171`
  `sn35.187`–`sn35.203` `sn35.206`–`sn35.227` đều ở tình trạng y hệt. Đáng lưu ý: `sn35.17` (anh em nội xứ của bài
  này) thì **không** dính, vì Sujato đã in cả sáu vế của tam thức đầu. Cùng phẩm còn **5** bài có **0** khoá có nội
  dung nào có chữ và **17** bài dưới một nửa.

  **Suy ra từ đây — bài này KHÔNG được tuyên bố là đã đối chiếu English.** Scorecard Việt của `sn/sn35.18`
  (`content/meta/sutta/sn/sn35.18.yaml`) ghi cả `translators` lẫn `quality.assessed_by` là
  `OpenCode Space Bunny Free (agent)` — **trùng alias** của lớp lấp (`source/tooling.yaml`, `aliasInMetadata`), nên
  về mặt tác giả lớp lấp này **không** phải cách đọc English độc lập ⇒ `triangulation` bị đặt **8,0**, mức trần của
  luật lớp lấp khi chỉ trùng alias. Bản Việt canonical có đủ **22** khoá và được dùng để **đối chiếu nghĩa** cho
  mười tám khoá này (đặc biệt để xác nhận `1.7` mở câu mới còn `1.11` là **vế tiếp** của chính câu đó, và để xác
  nhận `2.3` là số thứ tự bài); nó **không** được dùng để dịch vòng và không có câu nào trong lớp lấp chép từ nó.
  Tầng Việt hiện hành của Hòa thượng Thích Minh Châu không phủ bài này ở commit đã ghim — đó là giới hạn của bản
  chụp upstream, không phải thiếu sót của kho, và không phải lý do hạ điểm lát này.

  **Ghi về nguồn gốc, nói thẳng.** Ba khoá trong lát này (`1.8` `1.9` `1.10`) là **nguyên văn** lời của bản Anh đã
  ghim, vì luật dùng lại bắt buộc thế khi Pāli trùng byte; mười hai khoá nhóm B theo sát lời của tầng ghim ở bài anh
  em song parallel. Ở reader, mỗi segment do lớp lấp cung cấp đều mang nhãn lớp lấp của dự án chứ không phải bản
  Sujato đã xuất bản; ranh giới giấy phép giữa hai tầng là việc của người biên tập, tầng đã ghim khai `NOASSERTION`
  trong khoá nguồn.

  **Hai tiêu chí không đo được gì ở một lớp lấp English — ghi thay vì giả vờ.** `vietnamese_clarity` và
  `han_viet_balance` là hai khoá của bảng chấm tầng Việt; bản lấp không có tiếng Việt và không có Hán–Việt nào để
  cân, nên chúng ở đây chỉ thừa hưởng hình dạng chung của lớp lấp chứ không phải phép đo. `vietnamese_clarity` bị
  hạ xuống **9,1** một cách có chủ đích vì câu `1.11` thật sự vướng: nó phải bắt đầu bằng vế từ *"gratification
  in ideas"*, là vế nối tiếp của câu mở ở `1.7`, và Pāli không cho phép thêm dấu lược ở `1.11` để làm nó rõ hơn. Bản
  Việt canonical xử lý cụm này bằng cách **nhắc lại** mệnh đề điều kiện (*"nếu không có vị ngọt của các pháp…"*),
  làm câu `1.7` bị bỏ treo — lớp lấp không chọn cách đó.

  **Bất định còn lại, nói thẳng thay vì đoán.** `sattā dhammesu sārajjeyyuṁ` (`1.11` `1.12`) dùng nghĩa **tại
  chỗ** với `dhammesu`, nhưng lớp lấp dịch *"by them"* để khớp đúng cách tầng ghim đã dùng cho `sattā rūpesu
  sārajjeyyuṁ` tại `1.1` của chính bài này. Đọc theo nghĩa địa phương thì phải là *"among ideas"*. Đây là một lựa
  chọn **ưu tiên nhất quán với tầng đã ghim** trước một lựa chọn **ưu tiên trung thành với ngữ pháp**, ở hai khoá,
  và người biên tập nên phán nếu muốn đổi. Không có chỗ nào trong lát này cần chứng từ dịch ngoài tầng đã ghim.

