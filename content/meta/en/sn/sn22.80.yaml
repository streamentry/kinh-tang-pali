notes: |-
  Năm khoá trên sáu là **bản sao nguyên văn** của Pāli đã có bản dịch trong chính bài này, và
  `2.6` là khoá thứ sáu:

  - `3.7` lặp `2.5` nguyên văn (`Seyyathāpi nāma vacchassa taruṇassa mātaraṁ apassantassa…`).
  - `3.9` lặp `2.7` nguyên văn (`Seyyathāpi nāma bījānaṁ taruṇānaṁ udakaṁ alabhantānaṁ…`).
  - `2.6` ghép `2.3` + `2.4` (Đức Thế Tôn), và `3.8`/`3.10` ghép `3.5` + `3.6` (Brahmā).

  **Hai chỗ tôi CỐ Ý lệch với bản ghim, cần nói rõ:**

  - `3.7`: bản ghim ở `2.5` viết *"If a young calf doesn’t see its mother it may change and fall
    apart. …"* — có dấu `…` ở cuối. **Pāli ở `2.5` và `3.7` không có `…pe…`**, nên dấu đó là dấu
    lược mang tính trang trí của Sujato chứ không phải ký hiệu lược của bilara. Tôi bỏ nó, theo
    đúng luật "không tự thêm `…` vào chỗ Pāli không có lược". Hệ quả: `3.7` không giống hệt `2.5`,
    dù Pāli giống hệt. Đây là đánh đổi có ý thức, và là lý do hạ `ambiguity_integrity` 9,2.
    (Cùng nguyên tắc này đã dùng cho `sn34.19:1.5–1.8`, nơi bản ghim `1.4` có `…”` còn lớp lấp
    không mang.)
  - `2.6` / `3.8` / `3.10`: Pāli `santettha` nghĩa là "ở đây". Đức Thế Tôn ở `2.3` và `2.8` được
    dịch "there are mendicants **here** who are junior…", nên `2.6` (của Đức Thế Tôn) có "here".
    Brahmā ở `3.5` **không** có "here" (*"But there are mendicants who are junior…"* — Sujato đã bỏ
    `hi`), nên `3.8`/`3.10` của Brahmā cũng không có. Tôi bám theo bản ghim **của từng người
    nói** để không tự mâu thuẫn trong lời một người, dù Pāli ở ba chỗ giống nhau.

  **`3.10` khác `3.8` ở dấu phẩy, và tôi giữ nguyên sự khác biệt đó.** Pāli `3.10` có dấu phẩy
  (`… imaṁ dhammavinayaṁ, tesaṁ bhagavantaṁ alabhantānaṁ dassanāya …`) nên tôi viết **một câu**:
  "In the same way, there are mendicants who are junior, recently gone forth, newly come to this
  teaching and training, not seeing the Buddha they may change and fall apart." Còn `2.6` và `3.8`
  Pāli có dấu chấm (`… vipariṇāmo.`) nên thành **hai câu**. `grammar_logic` ghi nhận việc giữ
  đúng dấu câu Pāli này.

  `3.6`: `Tesaṁ bhagavantaṁ apassantānaṁ…` → "Not seeing the Buddha they may change and fall
  apart." — `bhagavā` dịch "the Buddha" theo `3.4` đã ghim ("The Buddha has purged…"), và `not
  seeing me` theo `2.4`/`2.9`.

  Lớp lấp: 6 khoá, tất cả nằm ở chỗ bản Anh đã ghim để trống. **Không khoá nào là blockquote
  tham chiếu và không khoá nào có Pāli rỗng**, nên không có khoá nào bị bỏ.

  Bài này còn 1 khoá bản Anh đã ghim để trống mà lát này KHÔNG lấp: `10.16` (`Aṭṭhamaṁ.`, 9 ký
  tự) — dòng đếm số thứ tám, dưới ngưỡng 40 ký tự.

  **Bài này KHÔNG có bản Việt của dự án** (không có
  `content/translation/vi/project/sutta/sn/sn22.80_translation-vi-project.json`, cũng không có
  `content/meta/sutta/sn/sn22.80.yaml`), nên không có đối chiếu Việt cho khoá nào ở đây. Tôi cũng
  đã tra cả bài song song `sn22.81–87` cùng phẩm `Khajjanīyavagga`: `sn22.82` và `sn22.84` có lớp
  lấp nhưng **không** chứa đoạn Brahmā này, nên không có tiền lệ Anh nào khác.
  `vietnamese_clarity` và `han_viet_balance` mang **giá trị mặc định của lớp lấp** (tiền lệ
  `sn24.36`), và `triangulation` hạ 7,4.

