notes: |-
  Lớp lấp: 5 khoá (`2.2`, `4.2`, `4.3`, `4.4`, `4.6`) nằm ở phần bản Anh đã ghim đã lược.

  **`2.2` là PÁI nguyên văn bằng `1.7`** — Kassapa lặp nguyên văn lời xin phép hỏi, chỉ khác
  `Dutiyampi …` ở `2.1`. Lấy y nguyên văn đã ghim ("I’d like to ask the worthy Gotama about a
  certain point, if you’d take the time to answer."). Không dịch lại: dịch lại là chỗ dễ sinh ra
  một câu xin phép thứ hai khác hẳn câu đầu.

  **`4.2`, `4.3`, `4.4`, `4.6` là bốn vế mà Kassapa KỂ LẠI.** Mỗi vế lặp lại đúng một câu hỏi ở
  `3.3`, `3.5`, `3.7`, `3.12` và đúng câu trả lời ở `3.4`, `3.6`, `3.8`, `3.13`, rồi thêm
  `iti puṭṭho samāno … vadesi`. Nên lời trong ngoặc lấy y từ bản đã ghim:

  - 3.3 "Then is suffering made by another?" → 4.2 "…is suffering made by another"
  - 3.5 "Well, is suffering made by both oneself and another?" → 4.3 "…is suffering made by both
    oneself and another"
  - 3.7 "Then does suffering arise anomalously, not made by oneself or another?" → 4.4 "…does
    suffering arise anomalously, not made by oneself or another"
  - 3.12 "Then does the worthy Gotama not know or see suffering?" → 4.6 "…not know or see suffering"
  - 3.13 "It’s not that I don’t know or see suffering." → 4.6 "it’s not that I don’t know or see
    suffering"
  - và "not so" cho cả bốn vế, theo 4.1 đã ghim.

  **Không đặt dấu hỏi cho các câu hỏi nằm trong ngoặc.** Pāli ở `4.2`–`4.6` **không** có dấu `?`
  (`dukkhan’ti`, `na jānāti na passatī’ti`), và bản đã ghim ở `4.1` cũng vậy: "Worthy Gotama, when
  asked these questions, you say ‘not so’." — không dấu hỏi. Đặt dấu hỏi ở đây sẽ là thêm dấu
  câu mà không nguồn nào cho phép. Vì vậy bốn khoá mở bằng `When asked ‘…’, you say …` thay vì
  lặp lại khung `“Worthy Gotama, when asked …”` của `4.1`.

  **Số ngoặc khớp Pāli từng khoá** (kiểm bằng harness): `4.2`, `4.3`, `4.4` mỗi khoá 2 ngoặc
  mở và 2 ngoặc đóng; `4.6` có 2 ngoặc mở và **1** ngoặc đóng, vì phần đóng nằm ở `4.8`
  (`dukkhan’ti`) — bản đã ghim đã làm phẳng chỗ đó nên lớp lấp không được đóng sớm ở `4.6`.

  **Bài này chưa có bản Việt trong `content/meta/sutta/`.** Chỉ có tiêu đề `Acelakassapasutta`
  ("With Kassapa, the Naked Ascetic") ở khoá `:0.3` của bản Anh đã ghim; không có bản Việt đã
  công bố để đối chiếu, nên `triangulation` và `vietnamese_clarity` đều hạ. Người đọc không nên
  hiểu rằng đã có đối chiếu chéo bằng tiếng Việt cho khoá nào ở đây.

  `triangulation` hạ vì không có bản Anh độc lập: `2.2` là bản sao của bản đã ghim, và bốn khoá
  `4.x` chỉ ghép lại lời đã ghim ở `3.x` — cùng một tầng.