notes: >-
  `sn56.14` is the same discourse as `sn56.13`, with one term changed: the noble truth of suffering is "the
  six interior sense fields" instead of "the five grasping aggregates". The pinned edition translates
  `sn56.13` in full and leaves the corresponding segments of `sn56.14` empty, so every filled segment here
  is reusable from a text already in the same chapter.

  The Pāli is verbatim, not merely parallel:

  - `3.3` = `sn56.13:3.4`, `4.3` = `sn56.13:4.3`, `5.4` = `sn56.13:5.4`, `5.5` = `sn56.13:5.5` — taken over
    word for word.
  - `4.2` = `sn56.13:4.2` verbatim, including the Pāli's own closing dash, so the clause runs straight
    into `4.3` as "…not clinging to it—" / "This is called…".
  - `3.2` = `sn56.13:3.2` plus `sn56.13:3.3` fused. SuttaCentral split the three cravings into their own
    segment there; here the Pāli carries them in one segment, so they are joined into one English segment
    rather than split. The dash at the end is the Pāli's own, marking the list that follows.

  One rendering choice is worth recording: "craving for existence" for `bhavataṇhā`, following
  `sn56.13:3.3`. The pinned edition uses "craving for continued existence" at `sn56.11:4.5`, so both
  readings exist in the same edition for the same term. Since the text being filled here is the sense-field
  twin of `sn56.13`, its twin's wording is the closer precedent and is the one kept.

  Triangulation is capped at 8.0. It is worth being blunt about why this text scores as high as it does at
  all: the fill is not an independent reading here, it is `sn56.13`'s pinned English carried across a term
  substitution that the Pāli itself marks. That is exactly the kind of case where copying the rendered
  sibling is the correct act, but it is also the clearest example of a fill that cannot corroborate itself.