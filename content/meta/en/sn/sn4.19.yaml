notes: |-
  Tiền lệ: khuôn `Yattha ca kho, pāpima, natthi …, agati tava tattha, pāpima` đã có bản Anh đã ghim
  ở 3.2 của CHÍNH bài (mắt) và 3.10 (ý): “Where there is no eye, no sights, no eye contact
  consciousness—you have no place there, Wicked One!”. 3.4 và 3.6 là hai khoá còn lại của cùng dãy
  nên chép nguyên khuôn đó, đổi đúng ba danh từ.

  `saddā` → “sounds” (sn35.22:2.2, sn35.23:1.5, dn13:27.4, an5.113:1.3 …); `gandhā` → “smells”
  (sn25.2:1.4, dn13:27.5, mn107:16.2 …). `sotaṁ`/`ghānaṁ` → “ear”/“nose” đã có sẵn ở 3.3 và 3.5 của
  chính bài. Bản Việt dự án 3.4/3.6 dùng “không có tai / không có tiếng” và “không có mũi / không có
  hương” — khớp với lựa chọn này.

  Ghi rõ để người biên tập thấy: 3.4 và 3.6 kết bằng `Wicked One!` (không ngoặc kép) vì Pāli hai
  khoá này không có `”`, khác với 3.10 (`Wicked One!”`). Đây là chênh lệch với bản Anh đã ghim, do
  Pāli quyết định.
