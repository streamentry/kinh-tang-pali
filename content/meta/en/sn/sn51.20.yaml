notes: |-
  **Phân loại 32 khoá (đo bằng máy trên Pāli đã ghim và tầng Anh đã ghim của chính bài này, ngưỡng gần-trùng 0,75 trên Pāli đã bỏ dấu câu): A = 4 · B = 21 · C = 7 · D = 0.**
  Định nghĩa để tái lập: A khi Pāli chuẩn hoá trùng nguyên văn với khoá đã có lời và các khoá ấy chỉ có một dạng lời; D khi Pāli trùng nhưng các lời đã ghim
  khác nhau; B khi không trùng nhưng gần trùng (≥ 0,75); C là phần còn lại. Tổng 4 + 21 + 7 + 0 = 32, đúng bằng số khoá đã ghi (32/32
  khoá của `fillableSegments`). Cách xử lý thực tế: trong nhóm A, 4 khoá lấy lại **nguyên văn từng chữ** và 0 khoá có điều chỉnh (nêu bên dưới);
  28 khoá viết tay (gồm B, C, D và các A có điều chỉnh).

  **Cấu trúc bài.** Bốn cơ sở thần thông (dục, tinh tấn, tâm, quán sát) cùng một khuôn bốn câu “thế nào là
  quá chùng / quá căng / co rút bên trong / phân tán ra ngoài”. Tầng đã ghim dịch dục (`3.x`–`6.x`) và quán sát
  (`20.x`–`23.x`) nhưng bỏ trống gần như toàn bộ tinh tấn (`11.2`–`14.2`) và tâm (`16.2`–`19.3`).

  **Nhóm tinh tấn (B, `11.2`–`14.1`, 9 khoá).** Dựng lại từ các khoá quán sát tương ứng, đổi `vīmaṁsā` thành
  `vīriya` (“inquiry” → “energy”): `11.2` 0,86 (←`20.2`) · `11.3` 0,83 (←`20.3`) · `12.1` 0,85 (←`11.1`) · `12.2`
  0,87 (←`21.2`) · `12.3` 0,85 (←`21.3`) · `13.1` 0,86 (←`22.1`) · `13.2` 0,88 (←`22.2`) · `13.3` 0,87 (←`22.3`) ·
  `14.1` 0,86 (←`23.1`). `14.2` (C, 0,67 ←`23.2`) gộp trong Pāli cả vế “Yaṁ vīriyaṁ … anuvisaṭaṁ” lẫn câu kết
  “idaṁ vuccati … vīriyaṁ …pe….”, nên lớp lấp ghép `23.2` và `23.3` thành một khoá và kết bằng đúng một dấu
  lược.

  **Nhóm tâm (B, `16.2`–`19.3`, 11 khoá).** Dựng lại từ các khoá dục (`3.x`–`6.x`), đổi `chanda` thành `citta`
  (“enthusiasm” → “mental development”, đúng cách tầng đã ghim dịch `citta` ở `2.10` và `16.1`): `16.2` 0,84
  (←`3.2`) · `16.3` 0,80 (←`3.3`) · `17.1` 0,84 (←`16.1`) · `17.2` 0,85 (←`4.2`) · `17.3` 0,83 (←`4.3`) · `18.1` 0,84
  (←`5.1`) · `18.2` 0,86 (←`5.2`) · `18.3` 0,85 (←`5.3`) · `19.1` 0,84 (←`6.1`) · `19.2` 0,89 (←`6.2`) · `19.3` 0,83
  (←`23.3`) (kết bằng dấu lược như `23.3`).

  **Nhóm A (4 khoá).** `15.1`, `15.2`, `15.3` (←`10.1`–`10.3`) và `19.4` (←`10.3`, `23.4`), nguyên văn từng chữ.

  **Nhóm kết bài (`24.3`, `24.4`, `25.0`–`25.4`, C, 7 khoá có nội dung nhưng ngắn).** `Dasamaṁ.` → “Tenth.” (khuôn
  số thứ tự đã dùng ở các lớp lấp khác). `Pāsādakampanavaggo dutiyo.` → “The Chapter on Shaking the Stilt
  Longhouse, second.” (tên phẩm từ `0.2`). `Tassuddānaṁ` → “Its summary verse:”. Bốn dòng tóm lược (`25.1`–`25.4`)
  tầng đã ghim bỏ trống toàn bộ ở cả `sn51.10` lẫn `sn51.20` nên không có từ nào để mượn trừ tên các bài
  `sn51.11`–`sn51.20` (Before · Very Fruitful · Immersion Due to Enthusiasm · With Moggallāna · The Brahmin
  Uṇṇābha · Ascetics and Brahmins · A Mendicant · A Teaching on Psychic Power · Analysis). Lớp lấp dịch:
  “Before, fruitful, enthusiasm, / Moggallāna and Uṇṇābha; / the two ascetics and brahmins, the mendicant, /
  the teaching, and analysis.” Bốn dòng này là chỗ **ít kiểm chứng được nhất** của bài (không có bản Anh
  nào để đối chiếu), nên hạ `ambiguity_integrity`.

  **Dấu lược do tầng đã ghim thêm:** `11.1`, `16.1` kết bằng “…” dù Pāli viết đủ, và `24.1` có hai dấu lược
  so với một của Pāli; lớp lấp không chép.

  **Nháy kép “ ” và đơn ‘ ’ (không tính dấu nhạt lượu `’s`, `’t`…).** Đo từng khoá so với Pāli: 32/32 khoá khớp, không có ngoại lệ.

  **Dấu lược.** Pāli của 32 khoá có 2 dấu lược (`…pe…` đếm là **một**); lớp lấp ghi 2. Pāli viết đủ thì lớp lấp không thêm “…”.

  **Khoá trống còn lại.** Không còn: cả 32 khoá thuộc `fillableSegments` đã được lấp, kể cả các khoá dưới ngưỡng 40 ký tự (câu kết, nhãn thứ tự, dấu lược) vì chúng có thật trong Pāli; những khoá ấy không vào coverage nhưng bỏ trống sẽ để lại chỗ hổng giữa bài.

  **Coverage (đo thật, mẫu số khác 0).** Mẫu số: 81 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Trước lớp lấp: 56/81 = 0,6914. Sau khi lớp lấp `published`: 81/81 = 1,0000. Độ nhạy: ngưỡng 0,8 cho phép tối đa 16 khoá thiếu English; lớp lấp đưa số khoá thiếu từ 25 về 0 nên bài còn đệm 16 khoá. Bài này **có** record trong `content/meta/reference-gaps.yaml` (dưới ngưỡng 0,8 trước khi lấp); khi lớp lấp `published`, record trở nên **thừa**. Không sửa tay tệp đó; người điều phối chạy lại `npm run reference:gaps`.

  **Khoá có chữ nhưng ngắn hơn hẳn Pāli (dấu hiệu cắt cụt/gộp của tầng đã ghim).** Đo: 1 khoá mà lời Anh đã ghim < 30% độ dài Pāli (Pāli ≥ 60 ký tự). Đây là chỗ `ratio` có thể lạc quan; lớp lấp không sửa được các khoá đã ghim. Đã dò Pāli trùng nguyên văn trên cả bài: 8 nhóm (mỗi nhóm từ hai khoá trở lên).

  **Triangulation 8.0 (trần của bài).** Scorecard Việt của `sn51.20` (`content/meta/sutta/sn/sn51.20.yaml`) do cùng họ công cụ với lớp lấp chấm (alias khai ở `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập của bản Việt và **không** được tuyên bố là đã đối chiếu English. Đối chiếu thực có: Pāli root + bản Anh đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Tệp Việt và metadata Việt không bị chạm.

  **technical_integrity 9.6.** Không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh ấy còn lại cho người điều phối, và chưa chạy cổng không phải blocker. Đã tự kiểm bằng phép đo riêng: JSON parse, NFC, mọi khoá thuộc `fillableSegments`, không khoá nào che bản đã ghim, dấu lược khớp Pāli, nháy (kể các ngoại lệ đã nêu), Pāli trùng ⇒ lời trùng, và `final_score` bằng trung bình số học thô.
