notes: |-
  **Bốn nhóm khoá (đo bằng script trên 34 khoá lấp).** Phép thô: A = 20 · B = 10 · C = 4 · D = 0. Sau đối chiếu:
  **A nguyên văn = 19 · B = 11 · C = 4 · D = 0** (`8.13` trùng Pāli `7.10` nhưng xem mục nháy).

  **A nguyên văn (19):** `1.11` (= `1.7`), `4.15` (= `4.8`), `8.8` (= `5.10`), `8.12` (= `7.9`), và mọi khoá
  “I have no doubt of that.” / “I’m certain that what is impermanent is suffering.” / “And I’m certain that I have no
  desire …” ở `8.23`–`8.25`, `8.28`–`8.30`, `9.6`–`9.8`, `9.13`–`9.15` (= `8.19`–`8.21`, `8.32`–`8.34`), `9.5` (= `8.18`),
  `9.10`/`9.11` (= `4.10`/`4.11`).

  **B (11), khoá nguồn · tỉ lệ khớp:** `1.9` ← `1.5` 0,91 (gộp hai câu Sujato, đổi `‘` thành `“` theo Pāli) · `8.6` ←
  `7.3` 1,0 · `8.7` ← `5.9` 1,0 (nháy đơn theo Pāli) · `8.9` ← `5.11` 1,0 · `8.10` ← `7.7` 1,0 · `8.11` ← `7.8` 1,0 ·
  `8.13` ← `7.10` 1,0 · `9.2` ← `8.15` 1,0 · `9.3` ← `8.16` 0,80 · `9.9` ← `4.9` 1,0 · `9.12` ← `8.31` 1,0.

  **C (4):** `1.10` / `9.4` `evañca (pana) vadeti:` → “And he says:” (theo “And then say:” của `1.6`), `4.14`
  `eso me attāti?` → “this is my self?” (theo `4.7`, **không** nháy vì Pāli không có), `11.8` `Pañcamaṁ.` → “Fifth.”
  (bài thứ năm của `9. Theravagga`: `sn22.83`…`sn22.87`).

  **Đọc trong bối cảnh — ba chỗ quyết định.**
  1. `8.5` đã ghim tóm cả khối `8.5`–`8.13` thành “They repeated what the Buddha had said.” Lớp lấp vẫn lấp `8.6`–`8.13`
     vì Pāli có thật; người đọc sẽ thấy câu tóm rồi tới lời được lặp. Tương tự `1.8` (“They did as he asked.”, 59/206 ký tự)
     và `9.1` (“told him Vakkali’s message”) đã ghim tóm phần lời nhắn mà lớp lấp lấp ở `1.9`–`1.11`, `9.2`–`9.15`.
  2. `9.9` `Vedanā …` có Pāli **trùng** `4.9` (“Is feeling …”, câu hỏi của Đức Phật), nhưng ở `9.9` đây là lời **khẳng
     định** Vakkali gửi lại (sau `9.5` “Form is impermanent.”). Dịch “Is feeling …” là sai người nói; lớp lấp ghi
     “Feeling …”. `9.10`/`9.11` (“perception …”, “choices …”) trung tính nên dùng nguyên văn `4.10`/`4.11`.
  3. `8.6` Pāli có hô ngữ `āvuso`; lớp lấp giữ nguyên văn `7.3` (“One deity said to him,”) vì Sujato bỏ hô ngữ ấy ở
     chính khoá cùng khuôn.

  **Nháy — một lệch có lý do.** `7.10` đã ghim kết `”’”` (ba dấu) vì Sujato dùng nháy kép cho lời Đức Phật trong lời nhắn
  ở `7.8`; Pāli `7.10` và `8.13` đều kết `’”`. Lớp lấp mở `‘` ở `8.11` (khớp Pāli) nên kết `’”` ở `8.13` (khớp Pāli,
  đo 2/2). Mọi khoá lấp khớp nháy Pāli: 0 lệch.

  **Dấu lược:** `9.9`–`9.11` mỗi khoá một `…` như Pāli; tổng 3/3. Tầng ghim có 3 khoá mang `…` mà Pāli không có
  (`4.18`, `8.22`, `8.27`) — không thuộc lát.

  **Hai cơ chế khoá trống, đo trên 34 khoá:** cắt cụt dãy **2** dãy / **22** khoá / 843 ký tự; bỏ dòng song song **7**
  nhóm / **20** khoá (≤ 34).

  **Coverage.** Mẫu số 86. Trước 71/86 = **0,8256** (đã trên ngưỡng). Sau khi `published`: 86/86 = **1,0** (15 khoá có
  nội dung; 19 khoá lấp dưới 40 ký tự vẫn lấp để bài liền mạch). `content/meta/reference-gaps.yaml` **không** có
  record `sn22.87` — không record nào thành thừa vì lát này.

  Triangulation 8.0: scorecard Việt của bài này (`content/meta/sutta/sn/sn22.87.yaml`) do **cùng họ công cụ** với lớp lấp chấm/dịch (đối chiếu alias trong `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập và scorecard Việt của bài **không** được tuyên bố là đã đối chiếu English độc lập. Nguồn đã đối chiếu: Pāli root đã ghim + Sujato đã ghim (mọi khoá có chữ) + bản Việt canonical (chỉ để đối chiếu nghĩa, không dịch vòng).

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối. Không đặt blocker vì “chưa chạy” không phải “chạy mà đỏ”. Đã tự kiểm bằng script: JSON parse, mọi khoá ⊆ tập lấp, 0 khoá trùng khoá đã ghim có chữ (không shadow), NFC, không khoá rỗng, nháy kép/đơn khớp Pāli từng khoá (nhận `’` + chữ thường là dấu nháy lược), số `…` khớp Pāli (`…pe…` = một), `final_score` = trung bình thô.
