notes: |-
  **Bốn nhóm khoá (đo bằng script trên Pāli root đã ghim): A = 1 · B = 7 · C = 6 · D = 0** — tổng 14,
  khớp đúng 14 khoá mà tầng Anh đã ghim để trống (`fillableSegments` đo được 14). Tổng số khoá trống còn
  lại sau lát này: **0**.

  **Nhóm A — 1 khoá, dùng lại nguyên văn lời đã ghim trong cùng bài.** `2.5` trùng **byte** `1.8`
  (`‘sādhu kira, bhante, āyasmā ānando yena anāthapiṇḍikassa gahapatissa nivesanaṁ tenupasaṅkamatu
  anukampaṁ upādāyā’”ti.`) và lời đã ghim ở `1.8` dịch đúng nghĩa Pāli ấy — mục `1.8` là khoá cuối
  của tiết thứ nhất, nên tầng đã ghim không có khoá kế để nuốt. Lấy nguyên văn:
  `‘Sir, please visit him at his home out of sympathy.’”`

  **Nhóm B — 7 khoá, dựng lại từ lời đã ghim trong cùng bài; tỉ lệ khớp đo được.**
  · `2.2` từ `1.5` — **0,9841**. Chỉ khác **một** dấu: Pāli `2.2` mở `“` còn `1.5` mở `‘`; lớp lấp chèn
    đúng dấu `“`. Tầng đã ghim không nuốt mất từ nào của Pāli `2.2`.
  · `2.3` từ `1.6` — **0,9655**. Tầng đã ghim mang **một dấu `’` thừa** (nó đóng nháy đơn mở ở `1.5`);
    Pāli `2.3` không có nháy nào nên lớp lấp **bỏ** dấu ấy.
  · `2.4` từ `1.7` — **0,8571**. Đây là khoá lớp lấp **phải tự sửa ngữ**, không chép: Pāli `1.7` là
    `Evañca vadehi:` (mệnh lệnh, ngôi thứ hai — người tớ dặn), còn Pāli `2.4` là `Evañca vadati:`
    (ngôi thứ ba — người tớ đang kể). Chép lời `1.7` (“And then say:”) sẽ đổi chủ thể. Lớp lấp viết
    “And then he says:”, đúng ngôi của `vadati`.
  · `5.2` từ `4.4` — **0,9741**. Tầng đã ghim chỉ có lời cho `buddhe` (“distrust of the Buddha”); Pāli
    `5.2` là `dhamme`, lớp lấp chèn lại “the teaching” — đúng cách chính tầng đã ghim dịch `dhamme` ở `5.1`.
  · `6.2` từ `4.4` — **0,9655**. Cùng cách: `saṅghe` → “the Saṅgha”, khớp lời đã ghim ở `6.1`.
  · `9.3` từ `8.5` — **0,9769**. `buddhe` → “the teaching”, khớp lời đã ghim ở `9.1`.
  · `10.3` từ `8.5` — **0,9692**. `buddhe` → “the Saṅgha”, khớp lời đã ghim ở `10.1`.

  **Nhóm C — 6 khoá, không khoá nào có lời ở tầng; cả sáu đều neo được vào khuôn đã lấp và xuất bản cho
  đúng Pāli ấy ở bài khác.**
  · `8.4` và `12.4` — Pāli trùng byte với nhau và trùng với **40** khoá đã lấp ở tầng này cho đúng Pāli ấy
    (`sn55.11:2.4`, `sn55.14:1.4`, `sn55.15:1.4`, `sn55.16:1.4`, `sn55.17:1.4`, `sn55.18:2.2`, …), và cả
    **40** khoá ấy dùng **một** lời duy nhất, không ngoại lệ. Lớp lấp lấy nguyên văn khuôn đó: “That Blessed
    One is … teacher of gods and humans, awakened, blessed.”
  · `9.2` — Pāli trùng byte với `sn55.31:2.2` đã lấp và xuất bản, và ngữ cảnh cũng giống hệt: khoá liền
    trước (`9.1`) kết bằng `—` đúng như `sn55.31:2.1`. Lấy nguyên văn: “The teaching is well proclaimed by
    the Blessed One … to be realized directly by the wise.”
  · `10.2` và `12.7` — Pāli trùng byte với nhau và với `sn55.31:3.2` đã lấp và xuất bản; khoá liền trước
    (`10.1`) kết bằng `—` đúng như `sn55.31:3.1`. Lấy nguyên văn: “The Saṅgha of the Buddha’s disciples
    is practicing well … the supreme field of merit for the world.” **Chỉ một tiền lệ**, nên đây là ba khoá
    có bằng chứng đối chiếu mỏng nhất trong lát này.
  · `12.11` — nhãn thứ tự `Sattamaṁ.` → **“Seventh.”** Đo toàn tầng lấp: **18** khoá nhãn thứ tự trên
    **9** dạng Pāli, **mỗi dạng chỉ một cách dịch, không ngoại lệ nào** (`Paṭhamaṁ`→First. 3,
    `Dutiyaṁ`→Second. 1, `Tatiyaṁ`→Third. 2, `Catutthaṁ`→Fourth. 3, `Pañcamaṁ`→Fifth. 2,
    `Sattamaṁ`→Seventh. 2 ở `sn22.59:12.4` và `an4.187:9.2`, `Aṭṭhamaṁ`→Eighth. 2, `Dasamaṁ`→Tenth. 2,
    `Dvādasamaṁ`→Twelfth. 1; cộng thêm một dạng biến thể `Chaṭṭhaṁ`→Sixth. 1 ở `an4.116:2.2`). Suy ra số 7
    từ chính khuôn này, không phải từ suy đoán. Tầng Anh đã ghim để trống cả 18 khoá nhãn thứ tự ấy — đó là
    quy ước của Sujato, không phải lý do để bỏ trống.

  **Số khoá dùng lại nguyên văn từ cùng bài: 1** (`2.5` từ `1.8`). **Số nhóm Pāli trùng byte đã dò toàn
  bài: 4 nhóm / 8 khoá** (`4.2`≡`8.2`; `1.8`≡`2.5`; `8.4`≡`12.4`; `10.2`≡`12.7`). Trong cả bốn nhóm, mọi
  cặp có khoá lấp đều nhận **cùng một lời** (đo được `fill distinct: 1` cho từng nhóm) — bài không tự mâu
  thuẫn ở bất kỳ chỗ Pāli lặp lại.

  **Ba chỗ lớp lấp CỐ Ý LỆCH lời đã ghim của khoá sinh đôi, đều có lý do; không có chỗ nào khác ngoài ba.**
  1. `2.2` — đổi `‘` thành `“` cho khớp Pāli khoá này.
  2. `2.3` — bỏ dấu `’` thừa mà tầng đã ghim có ở `1.6`.
  3. `2.4` — đổi “And then say:” thành “And then he says:” vì `vadati` là ngôi thứ ba.
  Còn `5.2` `6.2` `9.3` `10.3` giữ nguyên văn phong của tầng đã ghim, chỉ thay đúng danh từ mà Pāli
  đổi; `8.4` `12.4` `9.2` `10.2` `12.7` `12.11` không có lời đã ghim nào để lệch.

  **Ngoặc kép — đo từng khoá, số lệch = 0.** Cả 14 khoá khớp Pāli từng khoá ở cả bốn trường `“` / `”` /
  `‘` / `’` đóng. `2.2` mở `“` không đóng trong khoá (Pāli đóng ở `2.5`), `2.5` mở `‘` rồi đóng **cả hai**
  `’”` đúng như Pāli, 12 khoá còn lại 0/0/0/0. Dấu `’` trong “they’re”, “don’t” là dấu nhạc nên đã tách
  khỏi phép đếm nháy (chỉ đếm `’` khi không đứng giữa hai chữ cái). Cân tổng cả lớp lấp: 1 `“`, 1 `”`,
  1 `‘`, 1 `’` đóng — cân, và trùng đúng cấu trúc Pāli ở đoạn văn `2.2`–`2.5`. Ở bài này không có ngoại lệ
  “nháy kép lồng nhau” nào phải học theo.

  **Dấu lược.** Bài có **7** khoá Pāli chứa `…pe…`, mỗi khoá tính là **một** dấu lược. Trong 14 khoá lấp có
  **5** khoá `…pe…` (`8.4` `9.2` `10.2` `12.4` `12.7`) và cả năm giữ **đúng một** `…`; 9 khoá còn lại Pāli
  không có dấu lược nào nên lớp lấp không thêm. Tổng dấu lược của lớp lấp bài này = **5**, bằng đúng số
  `…pe…` trong 5 khoá ấy. Không mở rộng vệt lược thành văn xuôi.

  **Không nén phủ định.** `9.3` và `10.3` mỗi khoá có **3** `na` trong Pāli
  (`na hoti uttāso, na hoti chambhitattaṁ, na hoti samparāyikaṁ maraṇabhayaṁ`) và lớp lấp giữ đủ ba vế
  phủ định theo đúng cách tầng đã ghim dùng ở `8.5`, khác hẳn với khuynh hướng nén “na dhamme”/“na saṅghe”.

  **Lỗi tầng Anh đã ghim đo được ở chính bài này — lớp lấp không sửa được, ghi lại để biên tập biết.**
  · **Bịa dấu lược (7 khoá).** `5.1` `6.1` kết bằng dấu `…` nơi Pāli kết bằng `.`; `8.3` `9.1` `10.1`
    `12.3` `12.6` kết bằng `…` nơi Pāli kết bằng dấu gạch dài `—`.
  · **Mở rộng `…pe…` thành văn xuôi (1 khoá).** `11.1` thành “…unbroken, impeccable, spotless, and
    unmarred, liberating, praised by sensible people, not mistaken…” — mất hẳn dấu lược.
  · **Gộp khoá: 0.** Quét toàn bài bằng phép “lời đã ghim có chứa ít nhất 5 từ nội dung của khoá Pāli kế
    sau” ⇒ **0** khoá trúng. Riêng công thức `Yatra hi nāma … saraṇāni sakko kālaṅkato` — thứ đã gây lỗi
    gộp ở `sn55.24:2.8` và `sn55.25:2.7` — **không xuất hiện trong bài này**: `saraṇāni sakko kālaṅkato`
    **0** lần, `kālaṅkato` **0** lần, và **0** khoá nào của tầng đã ghim tuyên bố sotāpanno hay sanh tái
    (quét `sotāpann|stream-enter|rebirth|not liable` cho toàn bài). Nên ở bài này không có khoá nào phải dịch
    lại từ Pāli để tránh chép lời đã ghim; khoá `2.5` dùng lại nguyên văn `1.8` là an toàn vì `1.8` là khoá
    cuối của tiết một. Công thức `itipi so bhagavā …pe… satthā devamanussānaṁ buddho bhagavāti` có mặt ở
    `8.4` và `12.4` nhưng cả hai đều **trống** ở tầng đã ghim, nên không có gì để bị gộp.

  **14 khoá nhưng chỉ 12 có nội dung ⇒ 2 khoá dưới 40 ký tự, lấp thêm không đổi coverage.** Đó là `2.4`
  (14 ký tự, `Evañca vadati:`) và `12.11` (9 ký tự, `Sattamaṁ.`). Vẫn lấp cả hai vì đó là **vá đúng hai chỗ
  trống người đọc thấy rõ nhất**: `2.4` là câu dẫn nối giữa `2.3` và `2.5`, để trống thì đoạn tin của người
  tớ bị cụt; `12.11` là nhãn đánh số cuối bài, để trống thì bốn mục trong `12.3`–`12.7` không biết đếm đến
  đâu.

  **Coverage: trước 32/44 = 0,7273 · sau khi `published` 44/44 = 1,0000.** Mẫu số là 44 khoá Pāli có nội
  dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`), đo bằng chính bộ đo của kho
