notes: |-
  2.1 (Sujato) “When you discuss, you should discuss: ‘This is suffering’ …” → 2.2 (`Taṁ kissa hetu?`, khoá của lát khác) → 2.3 là LÝ DO.

  Tiền lệ: 1.4 của chính bài này đã dịch sẵn đúng bộ thuật ngữ ở thể phủ định — `Nesā, bhikkhave, kathā atthasaṁhitā nādibrahmacariyakā na nibbidāya na virāgāya na nirodhāya na upasamāya na abhiññāya na sambodhāya na nibbānāya saṁvattati.` → “Because those discussions aren’t beneficial or relevant to the fundamentals of the spiritual life. They don’t lead to disillusionment, dispassion, cessation, peace, insight, awakening, and extinguishment.” Giữ nguyên cả tám danh từ theo đúng thứ tự Pāli.

  Bất định đã ghi: ở 2.3 Pāli chuyển sang thể khẳng định (`esā` ba lần) và TÁCH `atthasaṁhitā` / `ādibrahmacariyakā` thành hai vế riêng, nên không dùng lại câu phủ định của 1.4. `esā ādibrahmacariyakā` dịch “this is the basis of the spiritual life”: Sujato dịch `nādibrahmacariyakā` ở 1.4 là “the fundamentals of the spiritual life”, nhưng ở thể khẳng định thì “fundamentals” không làm chủ ngữ được, nên giữ ý `ādi` (nền tảng) thay vì bám chữ. Đây là chỗ duy nhất trong lát này không có tiền lệ từng chữ, nên hạ `terminology` 9.3 và `ambiguity_integrity` 9.2.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
