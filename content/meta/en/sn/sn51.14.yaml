notes: |-
  Vế này đã được bản Anh đã ghim dịch ở 5.8 của CHÍNH bài này, nguyên văn "it'll be neither
  constricted internally nor scattered externally." — chép lại, không dịch lại. BẤT ĐỊNH đã ghi: bản
  đã ghim ở 5.8 đã gộp SẴN nội dung 5.9 vào trong 5.8 (Pāli 5.8 chỉ có `na ca atilīnā bhavissati, na
  ca atippaggahitā bhavissati`, và 5.8 kết bằng `;` chứ không phải `ti`), đồng thời đóng luôn ngoặc mà
  5.9 lẽ ra phải tiếp. Nên khi 5.9 được lấp, cụm đó xuyên hiện HAI LẦN trong cột Anh, và 5.9 đọc ra
  như một mảnh vắt sau dấu nháy đã đóng. Không có cách nào vừa trung thành với Pāli vừa không lặp mà
  không bịa thêm chữ, nên chọn trung thành và ghi lại. Hạ `grammar_logic` và `vietnamese_clarity` vì
  đọc liền 5.8–5.9 sẽ thấy lặp.
  
