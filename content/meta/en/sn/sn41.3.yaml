notes: |-
  3.5 TRÙNG NGUYÊN VĂN Pāli với 4.11 của CHÍNH bài (chỉ khác dấu `‘` ở đầu), nên chép nguyên văn bản
  Anh đã ghim ở đó: “the cosmos is eternal, or not eternal, or finite, or infinite; the soul and the
  body are one and the same, or the soul is one thing, the body another; after death, a realized one
  still exists, or no longer exists, or both still exists and no longer exists, or neither still
  exists nor no longer exists.” Danh sách 10 kiến chếp thế giới này có tiền lệ ở 2.3 và 4.11 của
  chính bài.

  BẤT ĐỊNH đã ghi (3.6): Pāli 3.6 trùng nguyên văn 2.4 và 4.12 nhưng KHÔNG có dấu nháy nào, trong
  khi bản Anh đã ghim ở 2.4/4.12 là “… spoken of in ‘The Divine Net’.” (1 mở / 1 đóng). Lớp lấp bám
  Pāli nên phải bỏ nháy, và vì vậy viết “the Divine Net” (bỏ chữ “The” đầu câu) thay vì “The Divine
  Net”. Cả hai khuôn đều có tiền lệ trong chính bài này; khác biệt nằm ở dấu nháy, do Pāli quyết
  định. Đây là lý do hạ `terminology` và `ambiguity_integrity`.

  Ngoài phạm vi lát: 3.1–3.3, 3.8, 4.7, 8.5, 8.9 … có khoá trống ở mọi tầng nhưng không thuộc
  b6.json.
