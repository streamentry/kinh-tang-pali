notes: |-
  1.3 (Sujato) “Firstly, a noble disciple possesses experiential confidence in the Buddha …” → 1.4 là vế tiếp, rồi 1.5 mở sang chuỗi các cõi trời.

  Cụm `itipi so bhagavā …pe… satthā devamanussānaṁ buddho bhagavāti` xuất hiện ở MƯỜI HAI khoá của lát này, và cả MƯỜI HAI đều có Pāli giống hệt nhau. Bản Anh đã ghim ĐÃ dịch đúng Pāli có dấu lược này ở bốn chỗ khác — `sn55.13:2.4`, `sn55.26:5.3`, `sn55.35:2.3`, `sn55.37:4.3` — với một bộ từ thống nhất: "That Blessed One is perfected, a fully awakened Buddha, accomplished in knowledge and conduct, holy, knower of the world, supreme guide for those fit for training, teacher of gods and humans, awakened, blessed." Cùng bộ từ ấy còn xác nhận ở `dn12:3.4`, `dn13:7.4`, `dn24:1.6.2`, `dn33:2.1.67`, `dn3:1.2.5`, `mn7:5.33` và ở bản KHÔNG lược `sn55.7:1.6`, `snp3.7:1.6`.

  Sujato ở bốn chỗ đó đã MỞ RỘNG `…pe…` thành văn bản đầy đủ. Lớp lấp thì không được mở (bổ sung chữ vào tầng Anh là chút không nguồn nào cấp phép, và chốt của kho đòi số dấu lược khớp theo từng khoá). Nên ở đây giữ đúng MỘT `…` và dùng nguyên bộ từ Sujato cho hai vế không bị lược: `itipi so bhagavā` = "That Blessed One is", còn `satthā devamanussānaṁ buddho bhagavāti` = "teacher of gods and humans, awakened, blessed." Phần bị lược là `arahaṁ sammāsambuddho vijjācaraṇasampanno sugato lokavidū anuttaro purisadammasārathi` — KHÔNG mở.

  Ngoặc kép: Pāli các khoá này không có ngoặc kép nào, nên bản Anh cũng không có. (Sujato có `‘…’` vì bản ghim của ông tự gộp ngoặc vào; chốt của kho đòi khớp theo từng khoá, nên ở đây bỏ. Đây là khác biệt cơ học, không phải khác biệt ngữ nghĩa.)

  `vietnamese_clarity` và `han_viet_balance` ở đây được hiểu là độ rõ và độ súc của bản ANH, vì đây là scorecard của lớp lấp English chứ không phải của tầng Việt.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
