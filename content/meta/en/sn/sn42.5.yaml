notes: |-
  **Phân loại 27 khoá (máy đo, so Pāli đã chuẩn hoá với các khoá đã có lời của tầng Anh đã ghim): A = 0 · B = 0 · C = 27 · D = 0.** Tầng đã ghim chỉ có hai khoá ở bài này (`1.1`, `4.8`) và không khoá nào trong đó trùng hay gần trùng Pāli với 27 khoá trống, nên **toàn bộ 27 khoá phải tự dịch từ Pāli**. Vì không có lời đã ghim cùng bài nào để dùng lại, nhóm A/B của máy bằng 0 và luật “dùng lại lời cùng bài” chỉ áp dụng được **giữa các khoá lấp với nhau** (xem nhóm 1).

  **Nhóm 1 — các khoá lấp trùng Pāli với nhau: 10 khoá trong 4 nhóm, mỗi nhóm một lời duy nhất.** · `1.2` = `2.3` (lời người kỵ mã nhắc thầy xưa) · `1.3` = `2.4` = `4.6` (câu truyền thuật “yo so assāroho saṅgāme …”; `4.6` chỉ thêm dấu `”` đóng) · `1.4` = `2.5` (“What does the Buddha say about this?”) · `1.5` = `3.2` = `4.3` (“Enough, chief, let it be …”). Mỗi nhóm lấp **cùng một câu từng chữ**, chỉ khác dấu nháy theo Pāli của từng khoá. Phép kiểm chéo các nhóm này bằng script cho kết quả 0 cặp lệch. `3.8` là Pāli gần trùng `1.3` (đầu khoá giống, đuôi thêm `sāssa hoti micchādiṭṭhi`) và dùng lại nguyên câu của `1.3` rồi thêm “That is his wrong view.”

  **Nhóm 2 — bốn khoá nghi thức: `2.1`, `2.2`, `4.7`, `4.9`.** `2.1` Pāli `Dutiyampi kho …pe…` → “For a second time …” (đúng một `…`). `2.2` “And for a third time the cavalry chief said to the Buddha:”. `4.7` Pāli `“Abhikkantaṁ, bhante …pe…` → “Excellent, sir! Excellent! …”: Pāli viết `abhikkantaṁ` một lần trước dấu lược; “Excellent, sir! Excellent!” là cách dịch chuẩn của công thức quy y đầy đủ, mà `…pe…` ở đây rút gọn đúng công thức ấy, nên giữ hai tiếng — nhưng đây là chỗ **chữ lớp lấp nhiều hơn chữ Pāli ghi một lần**, nói thẳng. `4.9` `Pañcamaṁ.` → “Fifth.” (nhãn thứ tự, xem mục cảnh báo ở nhóm 4).

  **Nhóm 3 — mười hai khoá còn lại, tự dịch từ Pāli.** Thuật ngữ theo giọng Sujato của chính bài ở hai khoá đã ghim (`1.1` “cavalry chief”, “the Buddha”; `4.8` “the Buddha”, “lay follower”): “cavalry chief” cho `assāroho gāmaṇi`, “cavalrymen of the past, the tutors of tutors” cho `pubbakānaṁ ācariyapācariyānaṁ assārohānaṁ`, “wrong view” cho `micchādiṭṭhi`, “hell or the animal realm” cho `nirayaṁ vā tiracchānayoniṁ`. Bản Việt canonical (cùng bài) được dùng để đối chiếu nghĩa: không dịch vòng qua nó.

  **Cố ý lệch giọng của các bài song song đã ghim, nói thẳng.** (1) `parajita` dịch “defeated” (“the company of the defeated gods”, “the hell called the Defeated”), không dịch “fallen” như một bài song song trong cùng phẩm ở tầng đã ghim: Pāli `parajita` là *bị đánh bại*, và bản Việt cũng là “kẻ bại trận”. Hệ quả: người đọc đặt hai bài cạnh nhau sẽ thấy hai chữ khác nhau cho cùng một Pāli; đây là lựa chọn bám Pāli, không phải sự đồng thuận. (2) `3.6` không để tên địa ngục trong nháy đơn (“hell called ‘The Defeated’”), vì Pāli `3.6` không có nháy; nháy khớp Pāli từng khoá. (3) `3.4` `pubbe gahitaṁ dukkaṭaṁ duppaṇihitaṁ` — chữ `pubbe gahitaṁ` (*đã nắm giữ từ trước*) là chỗ **không phân xử được hoàn toàn**: lấp dịch sát chữ “the mind he has taken up beforehand is badly made and badly directed”; một cách đọc khác là *tâm đã định hướng sai từ trước khi vào trận*. Khác nhau ở sắc thái, không ở kết luận; không dịch ra thành nghĩa giải thích. (4) `4.5` `paluddho` dịch “enticed” (không “deceived” lần hai, vì `vañcito` đã mang nghĩa lừa).

  **Nháy.** Cả 27 khoá khớp Pāli từng khoá, đo bằng đếm, **trừ một ngoại lệ có lý do**: `4.7` Pāli mở nháy kép “ (Pāli `“Abhikkantaṁ …`), còn lớp lấp **không mở**. Lý do: khoá đã ghim liền sau `4.8` đã tự mang cả “ mở lẫn ” đóng trong cùng một khoá (“From this day forth … for life.”), nên mở thêm ở `4.7` sẽ in hai dấu mở liên tiếp. Số đo: `4.7` Pāli 1/0, lấp 0/0 (lệch 1 dấu mở). Các khoá nháy chạy qua ranh giới: `1.2` mở “ không đóng; `1.3` ‘ ’ cân; `1.4` đóng ”; `1.5` “ ” cân; `3.1` mở “; `3.2` ‘ ’; `3.8` ‘ ’; `3.10` đóng ”; `4.2` mở “; `4.3` ‘ ’ ”; `4.4` mở “; `4.6` ‘ ’ ”.

  **Dấu lược:** Pāli có `…pe…` ở `2.1` và `4.7`; lấp có đúng một `…` ở mỗi khoá đó (tổng 2), 0 ở các khoá còn lại.

  **Số khoá trống còn lại: 0.** Cả 27 khoá `fillableSegments` đã lấp; 17 khoá có nội dung (≥ 40 ký tự), 10 khoá dưới ngưỡng (`1.4`, `2.1`, `2.5`, `3.1`, `3.3`, `3.7`, `3.10`, `4.2`, `4.7`, `4.9`).

  **Cảnh báo nhãn thứ tự.** `4.9` `Pañcamaṁ.` → “Fifth.” Bài `sn42.5` là bài thứ năm của phẩm theo số mục (`sn42.1`–`sn42.13`), khớp nhãn; không có lệch số.

  **Coverage — đây là bài thấp nhất trong lát.** Mẫu số 18 (Pāli có nội dung, bỏ khối `:0`). Trước lớp lấp: 1/18 = **0,0556** (chỉ khoá `1.1`); sau khi `published`: 18/18 = **1,0000**. Ngưỡng 0,8 cần tối thiểu 15/18; lớp lấp dư 3 khoá. Bài `sn42.5` **có** record trong `content/meta/reference-gaps.yaml` (17 trong 18 đoạn có nội dung không có English, 0,0556); sau khi lớp này `published` record đó **thành thừa** và `npm run reference:gaps` cần chạy lại — lát này không được sửa tệp đó. Tầng đã ghim đạt 0,0556 là một ví dụ cắt cụt dãy: từ `1.2` đến hết bài tầng đó chỉ còn `4.8`, trong khi Pāli đủ; không có cơ chế gộp khoá nào ở đây.

  **Triangulation 8.0.** Bản Việt canonical của `sn42.5` (`content/meta/sutta/sn/sn42.5.yaml`) do công cụ khác dịch (`translators`), nhưng lượt chấm của nó (`quality.assessed_by`) thuộc cùng nhóm công cụ (theo `source/tooling.yaml`) với lớp lấp này, nên bản lấp **không** phải cách đọc English độc lập; scorecard Việt của bài **không được** tuyên bố đã đối chiếu English qua lớp này. Không có bản Anh nào khác để đối chiếu ở 27 khoá này.

