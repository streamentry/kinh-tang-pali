notes: |-
  Hai khoá có Pāli GIỐNG HỆT sn37.6 (chỉ khác ở danh sách tính từ ở 1.3), nên dùng lại y hệt bản
  dịch đã chốt — cùng lý do như sn37.11 và sn37.13.

  1.1: Pāli GIỐNG HỆT sn37.5:2.1 và sn37.14:1.1, cả hai đã ghim "“Anuruddha, when ladies have five
  qualities, when their body breaks up, after death, they are reborn in a place of loss, a bad
  place, the underworld, hell." — chép nguyên văn theo luật 3.

  1.4: Pāli GIỐNG HỆT sn37.5:2.4 và sn37.14:1.4, cả hai đã ghim "When ladies possess these five
  qualities, when their body breaks up, after death, they are reborn in a place of loss, a bad
  place, the underworld, hell.”

  Ánh xạ 4 chữ `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ` → "a place of loss, a bad place, the
  underworld, hell", xuất hiện 183 lần trong bản Anh đã ghim. Không có `…pe…` nên không phải giữ
  dấu lược.
