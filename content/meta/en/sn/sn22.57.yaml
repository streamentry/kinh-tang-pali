notes: |-
  Phân loại 18 khoá đã ghi (đo bằng script, theo Pāli đã có lời trong cùng bài): A y nguyên = 1 · B dựng lại = 11 · C tự dịch = 5 · D (Pāli trùng, lời đã ghim khác nhau; báo, không tự hòa) = 1. Script phân loại theo Pāli trùng nên các khoá tách ra từ một khoá đã ghim bị gộp sẵn (đếm là C) được nêu riêng bên dưới.
  Số khoá đã ghi: 18 trên 27 khoá tầng Anh đã ghim để trống (9 khoá còn trống).
  Khoá còn trống và lý do: 3.2, 3.4, 3.6, 7.2, 7.4, 7.6, 15.2, 15.4, 15.6 (9 khoá, đều dưới 40 ký tự, không vào coverage). Đây là ba vế `ayaṁ … assādo / ādīnavo / nissaraṇaṁ` mà tầng đã ghim nuốt vào khoá liền trước: 3.1 là “The pleasure and happiness that arise from form: this is its gratification.”, 3.3 là “…: this is its drawback.”, 3.5 là “…: this is its escape.”, và tương tự ở 7.x và 15.x (7.5 còn kết thúc bằng một `…` của Sujato). Lấp riêng sẽ in lại đúng câu mà khoá trước đã nói, nên không lấp. Ở nhóm saṅkhārā (12.1–12.6) cả sáu khoá đều trống, nên lấp đủ.
  Nhóm B (khoá ← khoá nguồn, tỉ lệ khớp do script đo): 8.1 ← 4.1 (0.90); 8.2 ← 4.2 (0.86); 9.2 ← 5.4 (0.84); 10.8 ← 2.7 (0.95); 10.9 ← 5.4 (0.84); 12.1 ← 3.1 (0.88); 12.3 ← 7.3 (0.85); 12.5 ← 7.5 (0.85); 13.1 ← 4.1 (0.75); 13.2 ← 4.3 (0.97); 13.3 ← 5.4 (0.84).
  Nhóm D: 8.3.
  Nháy: 0 khoá có số dấu nháy khác Pāli; các khoá còn lại khớp Pāli từng khoá.
  Dấu lược: 5 khoá chứa `…` (9.1, 10.8, 11.9, 13.1, 13.2); mỗi `…pe…` của Pāli tương ứng đúng một `…` của English, không khoá nào mở rộng.

  Nhóm B — 8.1, 8.2 dựng từ 4.1, 4.2 (0.90, 0.86): đổi `rūpaṁ` thành `vedanaṁ` (“feeling” theo 6.x đã ghim). 13.1 dựng từ 4.1 (0.75): Pāli có `…pe…` ở giữa nên lớp lấp giữ một `…` giữa “the practice that leads to their cessation” và “and are practicing for disillusionment, dispassion, and cessation regarding choices: they are practicing well”. 13.2 dựng từ 4.3 (0.97) với `…` cuối.
  Nhóm B — 9.2, 10.9, 13.3 dựng từ 5.4 (0.84): `vaṭṭaṁ tesaṁ natthi paññāpanāya` là “For consummate ones, there is no cycle of rebirths to be found.”; ba khoá này đứng sau một `…pe…` (9.1, 10.8, 13.2) đã bỏ mất `Ye kevalino`, nên lớp lấp viết “For them there is no cycle of rebirths to be found.” để `tesaṁ` có chỗ trỏ về.
  Nhóm B — 10.8 dựng từ 2.7 (0.95), giữ nguyên hai `…pe…` của Pāli: “right view … right immersion …”.
  Nhóm B — 12.1, 12.3, 12.5 dựng từ 3.1, 7.3, 7.5 (0.88, 0.85, 0.85): 12.2/12.4/12.6 là các vế “this is their gratification / drawback / escape.” (số nhiều vì `saṅkhārā` là “choices” theo 11.x đã ghim).
  Nhóm D (1 khoá, báo chứ không tự hòa) — 8.3 có Pāli y hệt 4.3 và 16.3; lời đã ghim của 4.3 và 16.3 chỉ khác nhau một khoảng trắng đôi (“a footing  in”), nên dùng lại nguyên văn 4.3, sửa khoảng trắng.
  Nhóm A — 11.9 có Pāli y hệt 2.7, 6.9 và 14.8, nhưng ba khoá ấy đều bị Sujato MỞ RỘNG `…pe…` thành cả tám chi “right view, right purpose, right speech, right action, right livelihood, right effort, right mindfulness, and right immersion.”. Lớp lấp KHÔNG sao chép: giữ đúng một `…` như Pāli, “right view … right immersion.”.
  Nhóm C — 18.5 `Pañcamaṁ.` là nhãn thứ tự: “Fifth.” theo khuôn của lớp lấp.
  Nháy: tất cả khoá khớp Pāli (không khoá nào chứa nháy).

  Cố ý lệch tầng đã ghim: 11.9 giữ `…` thay vì sao chép cách mở rộng thành tám chi của 2.7/6.9/14.8 (BRIEF 2.2). Hệ quả: Pāli giống hệt trong bài nhưng English khác nhau (11.9 so với ba khoá đã ghim).

