notes: |-
  Ba khoá lấp đều lặp lại Pāli đã có bản dịch trong CHÍNH bài này, nên cả ba dùng
  lại nguyên văn bản ghim (luật 3 của lớp lấp):

    - 3.4 và 3.13 lặp 3.19 ("But by not grasping what’s impermanent, suffering, and
      perishable, would such a view arise?"; cùng bộ từ này có 11 lần trong tầng
      Sujato). Không dùng nguyên văn được, vì bản ghim có `“` mở đầu và `?` cuối mà
      Pāli `api nu taṁ anupādāya evaṁ diṭṭhi uppajjeyya:` không có cái nào trong hai
      thứ đó. Bản lấp giữ nguyên bộ từ, bỏ ngoặc, kết bằng `:` — và đó là cách chính
      tầng tham khảo xử lý `evaṁ diṭṭhi uppajjati:` (1.2, 2.1).
    - 3.20 lặp 1.3/2.2/2.7, dùng lại nguyên văn kể cả khuôn `’”?`, vì Pāli kết
      `’”ti?` nên chốt đếm HAI ngoặc đóng.

  Bất định đã ghi nhận:

    - Dấu hai chấm cuối 3.4/3.13 nghe vướng, nhưng `?` bị chốt theo Pāli cấm. Đây là
      hệ quả của quy ước đếm theo Pāli, không phải lựa chọn thẩm mỹ; vì vậy
      `ambiguity_integrity` hạ xuống 9.2.
    - 3.5, 3.6, 3.7, 3.14, 3.15, 3.16 và 4.3 đều trống ở bản ghim VÀ dưới ngưỡng 40 ký
      tự nên không thuộc lớp lấp. Cột English của khối 3 vì vậy vẫn đứt đoạn giữa 3.4 và
      3.20, và phần "Tatiyaṁ" ở 4.3 vẫn trống. Không bịa chữ để nối.
    - Bài này chưa có bản Việt của dự án, nên không có đối chiếu Việt. Vì vậy
      `source_provenance` không đạt mức 9.6 như các bài có Việt.
    - Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của
      lớp lấp: bản lấp viết tiếng Anh, không có Hán–Việt để cân. `triangulation` bị
      chặn ở 8.0 vì không có bản Anh độc lập để đối chiếu.
