notes: |-
  Luật `sn11.24` áp dụng: **PāLI của 1.10 Y HỆT PĠLI 1.7**, nơi bản đã ghim đã có chữ — “Burning with the fires of greed, hate, and delusion. Burning with rebirth, old age, and death, with sorrow, lamentation, pain, sadness, and distress.” Giữ nguyên bộ từ đó. `vadāmi` lấy từ `1.13` (Sujato: “…and distress, I say.”).

  Khác 1.7 ở đúng hai chỗ, cả hai đều do Pāli: (1) ngoặc — Pāli đóng `’` **trước** `vadāmi`, nên “I say” nằm ngoài ngoặc trích, và `‘` mở đầu phải giữ; (2) dấu lược — 1.7 của Sujato bỏ luôn `…pe…`, còn 1.10 thì không được phép bỏ, nên thêm `…` cuối khoá theo đúng cách Sujato dùng ở `1.8` (“The ear … nose … tongue … body …”).

  Bất định cần ghi: Sujato ở 1.7 không có dấu `…` dù Pāli có `…pe…`, và ở 1.13 không có ngoặc kép dù Pāli có. Lớp lấp buộc phải khớp số dấu lược và số ngoặc **theo từng khoá**, nên không thể y hệt 1.7; ưu tiên bám Pāli và bộ từ của Sujato. Khoá 1.9 và 2.4 cũng fillable nhưng không thuộc lát này.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
