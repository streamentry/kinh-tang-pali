notes: |-
  Đây là **bản đầu tiên trong cặp** `sn46.50` / `sn46.49` (cùng khung, khác pháp nền tảng), và là **bản thứ tư** của cùng khuôn văn bản (`sn46.48` / `sn46.13`).

  **Cả ba khoá đầu dùng lại nguyên văn từ tầng ghim, vì Pāli trùng hệt:**
  - `sn46.48:1.3` có Pāli **giống hệt** `1.2` → "A mendicant with good friends can expect to develop and cultivate the seven awakening factors."
  - `sn46.48:1.4` giống hệt `1.3` → "And how does a mendicant with good friends develop and cultivate the seven awakening factors?"
  - `sn46.48:1.7` giống hệt `1.6` → "That’s how a mendicant with good friends develops and cultivates the seven awakening factors.”
  - Vế `vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ` → "which relies on seclusion, fading away, and cessation, and ripens as letting go" (`sn46.1:1.12`, 117 khoá Pāli trùng).

  ⚠ **Không mở rộng `…pe…`.** Tầng ghim ở `sn46.48:1.5` **bung** `…pe…` thành "mindfulness, investigation of principles, energy, rapture, tranquility, immersion". Lớp lấp giữ đúng một `…` ở `1.4`. Khác biệt **có chủ ý**.

  ⚠ **Lớp lấp này KHÔNG phải lớp đọc Anh độc lập cho bài này.** `content/meta/sutta/sn/sn46.50.yaml` ghi `quality.assessed_by: "OpenCode Space Bunny Free (agent)"`. `triangulation` hạ xuống **7.5**; `validate` sẽ **cảnh báo** rằng phủ Anh ở bài này dựa trên bản lấp của chính người viết bản Việt. Tôi **không sửa** scorecard tiếng Việt.

