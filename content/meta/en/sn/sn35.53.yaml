notes: |-
  Tiền lệ trong chính bài: Sujato ở `2.1` đã gộp bốn thành phần của mắt vào một khoá, nhưng các khoá `2.6`–`2.9` cho thấy đúng khuôn từng thành phần (“Knowing and seeing the ear … nose … tongue … body …”), và `2.10` cùng `2.14` cho khuôn đầy đủ (“Knowing and seeing the mind, ideas, mind consciousness, and mind contact as impermanent, ignorance is given up and knowledge arises.” / “And also knowing and seeing the pleasant, painful, or neutral feeling that arises dependent on mind contact as impermanent, …”). 2.2 là `Rūpe` (sắc) → “sights”, theo `2.1` và khắp `sn35.238`/`sn35.243`.

  Bất định cần ghi: vì 2.1 đã liệt kê “sights” trong câu gộp, cột Anh ở 2.2 sẽ lặp từ đó — đây là dấu vết của Sujato gộp vượt ranh giới khoá. `aniccato jānato passato` giữ “knowing and seeing … as impermanent”, không dịch “as they truly are”. Khoá 2.3, 2.4, 2.11, 2.12, 2.13, 2.16 cũng fillable nhưng không thuộc lát này.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
