notes: |-
  1.5, 1.6 và 1.7 là ba vị còn lại của danh sách bốn người tu định mà 1.4 đã mở ra. Cả ba
  dùng CÙNG khuôn Pāli, và khuôn đó đã có sẵn trong chính lớp lấp này:

  - sn34.17:1.5–1.7 (cùng `sakkaccakārī`, cùng bộ từ "carefully") — dùng nguyên văn, chỉ
  thay mạch thứ hai `samāpattikusalo` → `samādhikusalo` cho khớp bài này.
  - sn34.3:1.5–1.7 (`samādhikusalo`) cho cách đặt "skilled in X but not in immersion".
  - 1.8 dùng nguyên văn cụm "Of these, the meditator skilled both in … is the foremost,
  best, leading, highest, and finest of the four." — đã có ở 7 tệp fill (sn34.3, 34.4,
  34.5, 34.6, 34.7, 34.10, 34.11), tức 7/7.

  `sakkaccakārī` → "practicing carefully" là chính xác: 1.4 đã ghim của bài này dùng đúng
  cục đó. Bản Việt dự án ("cẩn thận làm trong định") khớp nghĩa.

  Bất định đã ghi nhận:

  - `mokkho` trong cụm `aggo ca seṭṭho ca mokkho ca uttamo ca pavaro ca` được dịch là
  "leading" trong cả 7 tệp fill sẵn có, trong khi bản Việt dự án dịch là "giải thoát"
  (tức liberation). Bản lấp bám 7/7 tiền lệ để lát này không tự mâu thuẫn; khác biệt
  này là của cả nhóm sn34, đã ghi ở đây thay vì im lặng.
  - 1.9 (`Seyyathāpi … …pe…`), 1.10 (`pavaro cā”ti.`) và 1.11 (số thứ tự) trống ở bản
  ghim và dưới ngưỡng 40 ký tự, nên cột English của bài dừng ở 1.8. Không bịa chữ nối.
  - `triangulation` bị chặn ở 8.0 vì không có bản Anh độc lập để đối chiếu; `han_viet_balance`
  mang giá trị mặc định của lớp lấp vì bản lấp viết tiếng Anh.
