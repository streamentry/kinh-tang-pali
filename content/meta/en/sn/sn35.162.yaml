notes: |-
  Cả ba khoá có tiền lệ NGUYÊN VĂN trong chính bài này, ở nhóm mắt:

  2.10 `Jivhāviññāṇaṁ aniccaṁ; tatra te chando pahātabbo.` trùng nguyên văn 2.5 đã ghim,
  và 2.5 được dịch thành mảnh danh từ "eye consciousness, ". Vì vậy 2.10 ở đây là
  "tongue consciousness," — không có mệnh đề. Đây là quy ước của bản đã ghim: Pāli lặp
  `tatra te chando pahātabbo` ở MỌI khoá của danh sách, còn bản Anh chỉ nói một lần ở
  khoá cuối (2.6, 2.16). Giữ đúng quy ước ấy, nếu không bài sẽ tự mâu thuẫn với 2.13
  ("The mind, ") và 2.15 ("mind consciousness, ") đã ghim.
  2.11 `Jivhāsamphasso anicco; tatra te chando pahātabbo.` trùng nguyên văn 2.6 đã ghim
  ("and eye contact are impermanent: you should give up desire for them.") → thay mắt
  bằng lưỡi. 2.12 trùng nguyên văn 2.7 đã ghim, thêm dấu lược `…` mà bản đã ghim đã bỏ.

  `Jivhāsamphasso` = "tongue contact" (đếm trong SN đã ghim: "tongue contact" 23 lần),
  `Jivhāviññāṇaṁ` = "tongue consciousness" (16 lần). "for them" ở 2.11 và "for it" ở 2.12
  giữ nguyên bản đã ghim, dù Sujato dùng hai đại từ khác nhau cho hai cấu trúc gần giống
  nhau — đây là lựa chọn của họ, bản lấp không tự sửa.

  Bất định thật sự: 2.10 là mảnh danh từ đứng một mình, đọc lẻ không thành câu. Thêm mệnh
  đề vào sẽ phải thêm chữ mà khoá trước (2.8, 2.9) đã gán cho 2.6. `vietnamese_clarity` hạ
  rõ nhất trong lát này vì lý do đó. 2.9 (`Rasā aniccā; …`) vẫn để trống vì thuộc lát khác.
  `triangulation` 8.0 là đặc thù của lớp lấp.
