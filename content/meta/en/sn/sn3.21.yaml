notes: |-
  All four keys carry identical Pali (Tathupamaham, maharaja, imam puggalam vadami) so all
  four take identical English, per the same-sutta repetition rule. The rendering follows
  mn30:22.3 (That's what this individual is like, I say). Sujato drops the vocative in this
  exact construction at mn30 (brahmana), sn22.80 (bhikkhave), and in the two neighbouring
  segments here (3.1, 3.3 drop maharaja), so great king is dropped for consistency.
  Triangulation is capped at 8.0.
