notes: |-
  **Phân loại theo máy trên 20 khoá: A 2 · B 17 · C 1 · D 0.** Dùng lại **nguyên văn** từ cùng bài: 2 khoá (đúng bằng số khoá nhóm A). Đã dò 2 nhóm Pāli trùng nguyên văn trong bài (tổng 4 khoá, gồm cả khoá đã ghim lẫn khoá lấp); với mỗi nhóm đó, mọi khoá lấp đều mang cùng lời với khoá còn lại của nhóm, ngoại trừ các khoá D đã nêu. Số khoá đã ghi: 20/20 khoá `fillableSegments`.

  **Hình dạng của chỗ trống.** Tầng đã ghim dịch câu hỏi và câu đáp đầu của từng khối rồi dùng “…” thay cho phần còn lại (`2.4`, `2.7`, `4.5`, `4.9`, `4.13` kết bằng “…”). Chỗ trống rơi vào ba nơi: các câu trả lời `2.3`/`2.5`/`2.6`/`2.8`/`2.9`/`2.12` của Sāriputta; đoạn Koṭṭhita nhắc lại `3.2`–`3.5`; và các dòng “is included in feeling/perception/choices” `4.6`–`4.16`.

  **Nhóm 1 — A nguyên văn (2 khoá).** `2.5` ← `2.11` “This too has not been declared by the Buddha.” và `2.8` ← `2.2` “Reverend, this has not been declared by the Buddha.”. Giữ “Buddha” cho `bhagavatā` như tầng ghim ở chính bài này.

  **Nhóm 2 — B (17 khoá).** `2.3`, `2.6`, `2.9`, `2.12` (← `4.2` 0,74, `2.4` 0,78, `4.3` 0,81, `2.10` 0,83): tầng ghim dịch `2.2` “this has not been declared” rồi nuốt phần nêu **điều gì** chưa được tuyên bố (`‘hoti tathāgato paraṁ maraṇā’ti` …); lớp lấp chèn lại bằng dạng khẳng định tương ứng với bốn câu hỏi đã ghim: “A realized one still exists after death.” / “no longer exists” / “both still exists and no longer exists” / “neither still exists nor no longer exists”. `3.2`–`3.5` (← `4.2` 0,71, `2.10` 0,82, `2.11` 0,93, `4.4` 0,83): `3.1` đã ghim gói cả đoạn nhắc lại vào một câu; lớp lấp tách theo Pāli, `3.2` giữ `…pe…` thành đúng một “…”. `4.6`–`4.8`, `4.10`–`4.12`, `4.14`–`4.16` (← `4.2`–`4.4` và `4.18`–`4.20`, 0,92–0,95): đổi “form/consciousness” thành “feeling/perception/choices” theo cách tầng ghim đã dịch `vedanā`, `saññā`, `saṅkhārā` ở `4.5`, `4.9`, `4.13`. **C:** nhãn `4.22` `Tatiyaṁ.` → “Third.”.

  **Ngoặc kép — đo và ngoại lệ có lý do (11 khoá lệch Pāli, 9 khoá khớp).** (a) `2.5`, `2.8`: Pāli mở `“` và không đóng (1/0); lời Sujato dùng lại nguyên văn đã tự đóng `”` (1/1) — chọn nguyên văn vì luật A. (b) `4.6`–`4.8`, `4.10`–`4.12`, `4.14`–`4.16`: Pāli **không** có nháy (0/0); tầng ghim bọc mỗi câu hỏi bằng ‘…’ ở `4.1`–`4.4`, `4.18`–`4.20` nên lớp lấp theo quy ước đó (0/2), nếu bỏ thì “Does a realized one no longer exist after death? is included in feeling.” đọc cụt. (c) `3.2` và `3.5`: Pāli chỉ có một `’` đóng đứng riêng (nháy mở nằm ở `3.1`/`3.4`); English cũng giữ đúng một nháy đóng — khớp, nhưng người đọc sẽ thấy nháy đóng không có nháy mở trong cùng khoá.

  **Cố ý lệch tầng đã ghim.** Tầng ghim ở `3.1` dịch cả đoạn nhắc lại thành câu tường thuật “you say that they have not been declared by the Buddha”; lớp lấp vẫn dịch `3.2`–`3.5` đầy đủ nên cột English hiện lặp lại ý. Lặp ấy do tầng ghim nói trước, Pāli gốc vốn lặp.

  **Ngoài lát.** 5 khoá đã ghim (`2.4`, `2.7`, `4.5`, `4.9`, `4.13`) kết bằng “…” ở nơi Pāli của chính khoá ấy viết đủ; lớp lấp không sao chép. Tầng ghim ở `4.17` chỉ có “consciousness.” (đã ghim, không phải khoá lát).

  **Ngoặc kép / nháy — bảng đo tự động trên 20 khoá.** 9/20 khoá khớp Pāli từng khoá (đếm “ ” ‘ ’ đóng/mở; `’` có chữ thường đứng ngay sau tính là dấu nhạt lược). Khoá lệch: `2.5`, `2.8`, `4.6`, `4.7`, `4.8`, `4.10`, `4.11`, `4.12`, `4.14`, `4.15`, `4.16` — lý do đã nêu ở trên.

  **Dấu lược.** 1 khoá lấp có `…pe…` trong Pāli (`3.2`); tổng số `…` trong English của 20 khoá lấp = 1; khớp quy tắc `…pe…` = đúng một `…` (không khoá nào có `…` mà Pāli viết đủ).

  Không còn khoá rỗng nào: 20/20 khoá `fillableSegments` đã được viết.

  **Coverage (đo thật).** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 38. Trước: 22/38 = 0,5789. Sau khi `published`: 38/38 = 1,0000 (lớp lấp phủ 16 khoá có nội dung; 4 khoá dưới ngưỡng không tính). Độ nhạy: ngưỡng 0,8 cần ≥ 31 khoá có lời; sau lấp còn dư 7 khoá trước khi rớt ngưỡng; trước lấp thiếu 9 khoá. Bài đã dưới ngưỡng trước khi lấp.

  **Hệ quả với `content/meta/reference-gaps.yaml`.** `sn/sn44.3` **có** record trong file đó; sau khi lớp lấp `published`, coverage = 1,0000 nên record thành thừa (test `a fill never leaves a gap record it has cured` sẽ đỏ nếu để lại). Không chạm file ấy trong lát này; để người điều phối sinh lại bằng `npm run reference:gaps`.

  **Triangulation 8,0 — không được tuyên bố là đối chiếu English độc lập.** Scorecard của bản Việt `content/meta/sutta/sn/sn44.3.yaml` do cùng họ công cụ với lớp lấp này chấm/dịch (xem `source/tooling.yaml`; `assessed_by` của lớp lấp trùng họ), nên bản lấp **không** phải một cách đọc English độc lập với bản Việt. Đối chiếu có: Pāli root + Sujato đã ghim (46 khoá) + bản Việt canonical (46 khoá, dùng để đối chiếu nghĩa, không dịch vòng, không chép). Bản Việt có khối `summary:` ở MN/DN nên **không chạm vào**; không sửa metadata Việt.

  **technical_integrity 9,6.** Không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, giao cho người điều phối. Không đặt blocker.
