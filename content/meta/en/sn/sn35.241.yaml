notes: |-
  Tiền lệ: bản đã ghim đã dịch đúng tám vế này hai lần, ở `sn35.241:1.6` (thân cây) và `sn35.241:7.3` (Nanda), cùng một bộ từ: “drift toward the near shore or the far shore”, “sink in the middle”, “get stranded on high ground”, “get taken by humans or non-humans”, “caught up in a whirlpool”, “rot away”. Giữ nguyên cả tám.

  BẤT ĐỊNH CẦN GHI: khoá `2.1` (Sujato) đã dịch TRỌN nội dung 2.2 (cả tám vế) vào 2.1, nên cột Anh ở 2.2 lặp lại gần như nguyên văn 2.1. Ta vẫn dịch riêng vì đó là nghĩa Pāli của khoá này, và lớp lấp không có quyền lược bớt.

  Không thêm “assume” (`sace`) vì 2.2 không có `sace` — nó chỉ tiếp nối mệnh đề của 2.1, nên câu mở bằng chữ thường, đúng như lớp lấp đã làm ở `sn35.168:1.4`. Trái lại sẽ thêm một mệnh đề không có trong Pāli.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
