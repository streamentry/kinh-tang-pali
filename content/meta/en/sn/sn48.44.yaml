notes: |-
  Tiền lệ: cụm `saddhindriyaṁ … paññindriyaṁ bhāvitaṁ bahulīkataṁ amatogadhaṁ hoti amataparāyaṇaṁ
  amatapariyosānaṁ` đã có bản Anh đã ghim ở 1.5, 2.2 và 2.8 của CHÍNH bài — “the faculties of faith,
  energy, mindfulness, immersion, and wisdom, when developed and cultivated, have freedom from death
  as their objective, destination, and culmination.” Dạng SỐ ÍT `the faculty of faith` có tiền lệ
  riêng (sn48.9:1.4, sn48.11:1.4, sn48.43:4.2, sn48.50:6.4 …).

  BẤT ĐỊNH đã ghi: bản Anh đã ghim ở 2.2 đã MỞ RỘNG `…pe…` (liệt kê đủ năm căn). Luật 2 của lớp lấp
  cấm mở rộng, nên 2.4 và 2.6 giữ `…` và viết “the faculties of faith … and wisdom, …”. Hệ quả: đọc
  liền 2.3–2.4 sẽ thấy 2.3 dẫn “…not known or seen … —” rồi 2.4 nhảy thẳng sang danh sách, và 2.2
  ngay trên đó lại liệt kê đủ năm. Chênh lệch do bản đã ghim, không phải do lớp lấp; hạ
  `vietnamese_clarity` xuống 9.0.

  3.3 khác 2.4/2.6 ở chỗ Pāli mang HAI vế đầy đủ (`saddhindriyaṁ … amatapariyosānaṁ …pe…
  paññindriyaṁ … amatapariyosānaṁ`, cả hai đều số ít với `hoti` số ít) nên phải dịch số ít và lặp
  lại vế hậu tố; đây là lý do hạ `grammar_logic`.

  2.4 và 2.6 có Pāli giống hệt nhau và cùng trùng 2.2, nên hai bản dịch của lớp lấp cũng giống hệt
  nhau — đúng như Pāli.
