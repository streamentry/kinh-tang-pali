notes: |-
  Lớp lấp: 5 khoá `1.13`, `1.14`, `1.17`, `1.18`, `2.3`. Bốn khoá đầu là **hai vế còn thiếu** trong
  chuỗi "vị ngọt – nguy hại – xuất ly" đi qua năm uẩn.

  **Cặp Pāli trùng nguyên văn, dùng lại y nguyên bản đã ghim.** Chuỗi `Yaṁ … aniccā/aniccā dukkhā/
  dukkhā vipariṇāmadhammā, ayaṁ … ādīnavo.` và `Yo … chandarāgavinayo chandarāgappahānaṁ, idaṁ …
  nissaraṇaṁ.` đã được bản đã ghim dịch cho sắc ở `1.10` và `1.11`. Lớp lấp y hệt, chỉ đổi tên uẩn:
  - `1.13` = `1.10` → "That feeling is impermanent, suffering, and perishable: this is its drawback."
  - `1.14` = `1.11` → "Removing and giving up desire and greed for feeling: this is its escape."
  - `1.17` = `1.10` → "Those choices are impermanent, suffering, and perishable: this is their drawback."
  - `1.18` = `1.11` → "Removing and giving up desire and greed for choices: this is their escape."

  **Số từ theo số của Pāli.** `vedanā` và `rūpā` là số ít nên "That form…" / "That feeling…" và "this
  is ITS drawback / escape", đúng như bản đã ghim ở `1.10`–`1.11`. `saṅkhārā` là số nhiều nên "Those
  choices…" và "THEIR drawback / escape". `s` của `saṅkhārānaṁ` và `idaṁ saṅkhārānaṁ` được giữ bằng
  "their", không ép thành "its" cho đều với `1.10`–`1.11`.

  **`2.3` lặp lại đúng nội dung `2.2`, và đó là của Pāli.** Pāli `2.2` và `2.3` cùng nói
  `anuttaraṁ sammāsambodhiṁ abhisambuddhoti paccaññāsiṁ`, nhưng `2.3` là **lời trực tiếp** của Đức Thế
  Tôn còn `2.2` là thuật lại gián tiếp của người tường thuật. Bản đã ghim đã viết cả nội dung ở
  `2.2` ("…I announced my supreme perfect awakening in this world with its gods, Māras, and divinities,
  this population with its ascetics and brahmins, its gods and humans."), nên `2.3` của lớp lấp nghe có
  lặp. Lớp lấp vẫn dịch vì Pāli có `abhisambuddhoti` ở đó, và giữ nguyên cụm danh từ về nơi chốn đã
  ghim ("in this world with its gods, Māras, and divinities, this population with its ascetics and
  brahmins, its gods and humans") để hai khoá không gọi tên nơi chốn khác nhau. Dấu `“…”` quanh lời
  trực tiếp là dấu báo cáo lời nói, không phải chữ thêm cho nghĩa.

  **Đối chiếu bản Việt đã có — bản này ĐÃ có, nhưng trạng thái `draft`.** `sn22.26` có bản Việt trong
  `content/translation/vi/project/`: `1.13`–`1.18` và `2.3` khớp với cách lớp lấp dựng. Vì bản Việt ở
  trạng thái `draft`, `vietnamese_clarity` hạ xuống 9.3, và vì đã đọc bản Việt thì điểm này KHÔNG được
  tính là đối chiếu chéo bằng tiếng Anh.

  `triangulation` bị chặn ở 8.0: không có bản Anh độc lập nào để đối chiếu; bốn khoá đầu là bản sao
  của bản đã ghim trong cùng tầng.
