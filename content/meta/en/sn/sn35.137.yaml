notes: |-
  Bốn khoá lấp là nửa cuối (về pháp) của bài. Có tiền lệ rất sát: sn35.136 là cùng một bài
  kinh ("Liking Sights (1st)") và đã ghim TRỌN cả bốn vế này với danh từ "ideas"; 1.1, 1.2,
  1.9 và 1.10 của chính bài này cũng đã ghim với danh từ "sights".

  Tiền lệ đã đếm:

  - 1.7 = sn35.136:1.8 đã ghim, và cùng khuôn với 1.1 đã ghim của bài này. Ở sn35.136,
  Sujato viết "ideas, they love them and enjoy them." vì chủ ngữ đã nói ở 1.3. Ở sn35.137
  các vế 1.3–1.6 (`Saddārāmā …`, `gandhārāmā …`, `rasārāmā …`, `phoṭṭhabbārāmā …`) đã
  bị lược, nên chủ ngữ `bhikkhave, devamanussā` — vốn CÓ trong Pāli của 1.7 — phải được
  nói. Đó là lý do bản lấp mở "Mendicants, gods and humans" thay vì bắt đầu bằng "ideas".
  - 1.8 = 1.2 đã ghim của bài này và = sn35.136:1.9 đã ghim, chỉ đổi sights → ideas.
  - 1.16 = 1.10 đã ghim của bài này và = sn35.136:1.17 đã ghim, chỉ đổi sights → ideas.

  Bất định đã ghi nhận — điểm quan trọng nhất của lát này:

  - 1.15 KHÔNG có chủ ngữ trong Pāli của nó: `Tathāgato ca, bhikkhave, arahaṁ
  sammāsambuddho` nằm ở 1.9, còn 1.11–1.14 chỉ là `Saddānaṁ …`, `gandhānaṁ …`,
  `rasānaṁ …`, `phoṭṭhabbānaṁ …`. Bản lấp vì thế KHÔNG thêm "The Realized One has truly
  understood", và dùng đúng cách đã ghim ở sn35.136:1.16: "ideas, so he doesn’t like,
  love, or enjoy them." Điều này cũng khớp bản Việt dự án của 1.15, vốn cũng bỏ chủ ngữ.
  Hệ quả: "he" phải bám vào 1.9; ai điền 1.11 nên mở lại chủ ngữ như sn35.136:1.12 để
  chuỗi đọc được.
  - 1.11–1.14 không thuộc lát này và đang trống, nên cột English của bài vẫn dừng ở 1.16.
  - `triangulation` 8.0; `han_viet_balance` là giá trị mặc định của lớp lấp.
