notes: |-
  2.9: Pāli trùng NGUYÊN VĂN với phần dùng chung của 2.16, mà Sujato đã dịch là "“But by not
  grasping what’s impermanent, suffering, and perishable, would the view arise:" — 2.16 chính là
  trường hợp Sujato bỏ vế dẫn `Yaṁ panāniccaṁ dukkhaṁ vipariṇāmadhammaṁ,` rồi dịch phần dùng
  chung; 2.9 có đúng phần dùng chung đó. Dùng lại y hệt, chỉ đổi dấu kết theo Pāli (`:`) và
  bỏ `“` mở (Pāli 2.9 không có).

  2.10: Pāli trùng NGUYÊN VĂN với 1.3 và 2.17 (Sujato): "‘This is mine, I am this, this is my
  self’?" → dùng lại y hệt. Pāli kết `’”ti?` nên chốt đếm `_đóng` = 2, bản lấp phải thêm `’`
  → `’”?`, đúng khuôn của bản lấp `sn24.19:3.15`. Sujato ở 1.3/2.17 chỉ dùng một `”`, tức bản
  đã ghim tự lệch chốt; hệ quả thẩm mỹ này là lý do hạ `ambiguity_integrity`.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
