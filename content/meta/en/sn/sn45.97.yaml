notes: |-
  1.3 và 1.5 TRÙNG NGUYÊN VĂN Pāli với sn45.103:1.3 và sn45.103:1.5 (đã có bản Anh), nên chép nguyên
  văn: “And how does a mendicant who develops the noble eightfold path slant, slope, and incline to
  extinguishment?” và “That’s how a mendicant who develops and cultivates the noble eightfold path
  slants, slopes, and inclines to extinguishment.” Mỗi khuôn có 9 lần trong toàn bài (sn45.103,
  sn46.77-88, sn48.125-136, sn50.1-12, sn53.1-12, sn55.22 …).

  Lưu ý thời: dạng câu hỏi (1.3) dùng SỐ ÍT “slant, slope, and incline”, còn dạng mệnh đề (1.5) dùng
  SỐ NHIỀU “slants, slopes, and inclines”. Đó là khuôn có tiền lệ, không phải lỗi nhất quán của lớp
  lấp; 1.2 của chính bài cũng dùng số nhiều cho dạng mệnh đề.

  1.4 giữ `…pe…` theo luật 2, dù bản Anh đã ghim ở sn45.161:1.8 đã mở rộng cùng khuôn này (xem notes
  của sn45.161). Hệ quả: 1.4 chỉ hiện “right view … and right immersion”. Hạ `vietnamese_clarity` vì
  dòng đọc liền 1.3–1.4 bị đứt ở dấu lược.

  Ngoài phạm vi lát: 1.6 (`Paṭhamaṁ.`) trống ở mọi tầng, không thuộc b6.json.
