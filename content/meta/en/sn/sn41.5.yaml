notes: |-
  5.16 (đã ghim) đã dùng đúng bộ từ này cho cùng công thức: "So, sir, that’s how I understand the
  detailed meaning of what the Buddha said in brief:" — 7.1 là lần Citta nói lại sau bài ca, nên giữ nguyên
  bộ từ đã ghim. Cùng công thức còn xuất hiện ở mn114:4.2/12.1 và dn21:2.5.16 với "the Buddha's brief
  statement"; ở đây lấy bản của chính bài này.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
