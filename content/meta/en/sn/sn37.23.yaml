notes: |-
  Tiền lệ mạnh: `sn37.15:2.4` có Pāli y hệt, Sujato đã dịch "When ladies possess these five qualities,
  when their body breaks up, after death, they are reborn in a good place, a heavenly realm.” — dùng y hệt.
  1.1 của chính bài này đã có CHỮ cho danh sách năm phẩm chất; 1.2 là vế dẫn lại sau đó.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
