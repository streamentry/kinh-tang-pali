notes: |-
  Tiền lệ: `sn35.69:2.7` (Sujato) đã dịch đúng vế này ở đầu câu — ““Reverend Sāriputta, there may be an impairment in body or deterioration of faculties for someone who thinks:” rồi `2.8`–`2.10` liệt kê, và `2.11` khép lại. Giữ nguyên bộ từ “impairment in body” / “deterioration of faculties” — không thêm mạo từ “your/my” như `2.2` và `2.16`, vì `2.7` cũng không có. `Tassa` = “for him”, chỉ đúng người `2.7` vừa nói tới. `siyā` (giả định) → “may be”, theo `2.7`.

  `Sāriputta` giữ nguyên dấu Pāli vì chính bản Anh đã ghim của bài này cũng dùng “Sāriputta” (`1.1`, `2.7`) — đây là tên riêng, không phải Pāli lọt vào bản Anh. Khoá 2.13, 2.14, 2.15, 3.9 cũng fillable nhưng không thuộc lát này.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
