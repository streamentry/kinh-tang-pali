notes: |-
  2.7–2.12 là Maṇicūḷaka chép lại nguyên văn cuộc trò chuyện ở 1.2–2.5, nên gần như toàn bộ là bản
  dịch lại của Pāli đã có tiếng Anh trong chính bài này:

  - 2.7 = 1.2: chép nguyên văn "while the king's retinue was sitting together in the royal compound this
    discussion came up among them".
  - 2.8 = 1.3 và 2.11 = 2.4: Pāli TRÙNG NGUYÊN VĂN, nên chép nguyên văn câu của bản đã ghim, kể cả cách
    Sujato gộp `sādiyanti` + `paṭiggaṇhanti` thành một "They accept and receive gold and currency".
  - 2.12 = 2.5 (`Asakkhi kho …` → "He was able to persuade that assembly."): đổi sang ngôi thứ nhất vì
    Maṇicūḷaka đang nói với Đức Thế Tôn.
  - 2.9 (`Evaṁ vutte, ahaṁ, bhante, taṁ parisaṁ etadavocaṁ:`) không có tiền lệ nên dịch mới; `etadavocaṁ`
    giữ "I said this", `parisaṁ` giữ "that assembly" như 2.5.

  Dấu nháy lồng nhau giữ đúng như Pāli: 2.7 mở ", 2.8 mở ', 2.9 trần, 2.10 mở ', 2.11 đóng ', 2.12 trần
  rồi 2.13 đóng ". Bản Việt dự án khớp nghĩa ở cả năm khoá.

  `triangulation` 8.0: người viết lớp lấp cũng là người chấm.
