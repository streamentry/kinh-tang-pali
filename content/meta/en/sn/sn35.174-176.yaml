notes: |-
  Bộ từ lấy từ bản lấp ĐÃ PUBLISH của chính lớp này, ở bài song song cùng phẩm
  Saṭṭhipeyyālavagga — không phải từ Sujato, vì Sujato đã gộp 1.3 và bỏ trống cả ba khoá:

  sn35.183-185:1.8, Pāli `dhammā anattā; tatra vo chando pahātabbo, rāgo pahātabbo,
  chandarāgo pahātabbo.` → "ideas are not-self; there you should give up desire, greed, and
  desire and greed." Cấu trúc y hệt 1.4 và 1.5 ở đây, chỉ khác danh từ.
  sn35.183-185:1.9, Pāli `Yo, bhikkhave, anattā tatra vo chando pahātabbo, rāgo
  pahātabbo, chandarāgo pahātabbo”ti.` — TRÙNG NGUYÊN VĂN 1.6 ở đây → "And what is
  not-self, mendicants, there you should give up desire, greed, and desire and greed.”"

  `anattā` = "not-self" (1.1, 1.2, 1.3 đã ghim); `Yo, bhikkhave` ở 1.6 dịch "And what is
  not-self, mendicants" đúng như 1.1 đã ghim dịch `Yo, bhikkhave, anattā` là "for what is
  not-self" sau "Mendicants". 1.4 và 1.5 viết hoa chữ đầu vì đứng lẻ trong danh sách đã bị
  1.3 ghim gộp trước đó; giữ chữ thường như sn35.183-185:1.8 sẽ đọc vô nghĩa khi cột
  English hiện riêng.

  Số dấu lược: 1.4 có `…pe…` nên có `…`; 1.5 và 1.6 không nên không có. Lặp "desire …
  desire" là của chính Pāli (`chando`, `rāgo`, `chandarāgo` — chanda, rāga, chandarāga), và
  `rven88.py` không báo vì khoảng cách ba từ chứ không phải một; cùng lý do ấy câu này đã
  được dùng ở bốn bài đã publish.

  `triangulation` 8.0 là đặc thù của lớp lấp. `vietnamese_clarity` và `han_viet_balance`
  mang giá trị mặc định của lớp lấp.
