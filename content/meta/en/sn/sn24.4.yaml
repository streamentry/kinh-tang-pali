notes: |-
  Lớp lấp: 5 khoá `3.4`, `3.5`, `3.12`, `3.13`, `3.18`.

  **Cặp Pāli trùng nguyên văn:**
  - Chuỗi `‘no cassaṁ, no ca me siyā, nābhavissa, na me bhavissatī’”ti?` trùng nguyên văn ở
    `1.3`, `3.5`, `3.13`, `3.18`. Bản đã ghim đã dịch `1.3`, nên cả ba khoá của lớp lấp dùng lại y
    nguyên văn: "‘I might not be, and it might not be mine. I will not be, and it will not be mine’?"
    Cả ba mở 1 – đóng 2, đúng bằng hình thức Pāli (`’”ti?`) và bằng chính `1.3` đã ghim.
  - Chuỗi `api nu taṁ anupādāya evaṁ diṭṭhi uppajjeyya:` trùng ở `3.4`, `3.12` và `3.17`. Bản đã
    ghim đã dịch `3.17` (rút gọn làm một khoá), nên lớp lấp lấy y nguyên văn đó, chỉ đổi dấu cuối
    từ `?”` thành `:` vì `3.4` và `3.12` kết bằng `:` còn lời trích dẫn nằm ở khoá kế.

  **`taṁ` ở `3.4` và `3.12` là "cái vô thường, có khổ, có sinh diệt" — không phải "nó".** Bằng chứng
  nằm ngay trong chính bài: bản đã ghim dịch đúng chuỗi Pāli đó ở `3.17` là "But by not grasping what’s
  impermanent, suffering, and perishable, would such a view arise?". Cụm đó đến từ `…pe…` ở `3.3` và
  `3.11`, vốn nuốt mất `Yaṁ panāniccaṁ dukkhaṁ vā taṁ sukhaṁ vā` → `Dukkhaṁ` → `Yaṁ panāniccaṁ
  dukkhaṁ vipariṇāmadhammaṁ`. Lớp lấp vì thế dùng y cụm đó thay vì đơn giản hoá thành "it". Cùng lý
  do này, lát `sn24.5` (bài song sinh) cũng lấy y y hệt — hai lát phải cho cùng một cách dịch.

  **`3.18` SẼ ĐỌC LẶP, VÀ ĐÓ LÀ HỆ QUẢ CẦN GHI.** Pāli ở `3.18` CÓ `‘no cassaṁ … na me
  bhavissatī’”ti?`, nhưng bản đã ghim đã gộp luôn `3.17` và `3.18` thành MỘT khoá Anh và đóng luôn
  ngoặc ở `3.17` ("…would such a view arise?”). Lớp lấp không bỏ `3.18`, vì bỏ thì cột Anh mất nghĩa
  so với cột Pāli ngay cạnh nó; nhưng phải nói thẳng là sẽ thấy hai dấu hỏi và nội dung lặp. Giữ
  nguyên Pāli là chọn ít giả định hơn.

  **Bài này chưa có bản Việt trong `content/translation/vi/project/`.** Chỉ có tiêu đề
  `Nocamesiyāsutta` ở khoá `:0.3` của bản Anh đã ghim; `vietnamese_clarity` hạ vì vậy.
  `ambiguity_integrity` hạ xuống 8.9 vì lỗi lặp ở `3.18` là thứ người đọc sẽ thấy, dù không chặn
  xuất bản. `triangulation` bị chặn ở 8.0: không có bản Anh độc lập nào để đối chiếu.
