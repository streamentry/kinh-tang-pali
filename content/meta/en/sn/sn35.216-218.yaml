notes: |-
  Tiền lệ: 1.3 và 1.10 có Pāli GIỐNG HỆT 1.2 của sn35.219-221 (đã ghim), nên chép nguyên văn câu
  đã ghim: "And what’s not-self should be truly seen with right understanding like this: ‘This is
  not mine, I am not this, this is not my self.’" Cùng câu đó đã ghim ở sn35.204:1.4,
  sn35.210-212:1.2, sn35.5:1.3, sn22.45:1.5, sn22.45:1.13 (21 cặp Pāli↔Anh có `yadanattā` đúng
  dạng) và lớp fill đã dùng y hệt ở sn35.204:1.8/1.12, sn35.210-212:1.5, sn35.5:1.10.

  BẤT ĐỊNH ở 1.8: Pāli là `dhammā dukkhā atītā anāgatā paccuppannā.` — có ba vế "quá khứ / tương
  lai / hiện tại", nhưng khoá này KHÔNG có dấu lược nào nên không thể viết "in the past … future …
  present" (sẽ vỡ bộ đếm dấu lược theo từng khoá). 1.1 của chính bài đã ghim chính cụm `dukkhā
  atītā anāgatā paccuppannā` thành "…touches, and ideas are suffering." — tức Sujato đã hấp thụ ba
  vế thời gian vào vế đầu. sn35.195-197:1.1 xác nhận đúng quy ước đó với Pāli `dhammā aniccā atītā
  anāgatā paccuppannā`, và sn35.180-182:1.8 / sn35.177-179:1.8 dùng đúng khuôn "and ideas are …"
  cho chỗ nhắc lại danh sách. Vì vậy 1.8 dịch "and ideas are suffering." và ĐÃ LƯỜI `atītā anāgatā
  paccuppannā` — có chủ ý, theo tiền lệ, không phải sót. Người đọc vẫn thấy "Three Times" ở tiêu
  đề bài và ở 1.1. Hạ `semantic_fidelity` 9.3 và `ambiguity_integrity` 9.3 vì lý do này.

  1.9 (`Yaṁ dukkhaṁ, tadanattā.`) không thuộc lát này nhưng nằm giữa 1.8 và 1.10; 1.2 đã ghim nó
  thành "What’s suffering is not-self …”" nên lát khác sẽ dịch 1.9 y hệt, không có xung đột.
