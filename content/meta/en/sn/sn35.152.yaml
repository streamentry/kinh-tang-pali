notes: |-
  2.6 / 2.8 / 2.13: Pāli trùng NGUYÊN VĂN 2.2 và 2.15 đã ghim, nên luật 3 bắt dùng lại
    nguyên văn "The goal of leading the spiritual life under the Buddha is to completely
    understand this." 2.13 mang thêm dấu lược đơn `…` mà Pāli có, nên giữ `…` (2.10 đã ghim
    có `…pe…` nhưng bản Anh bỏ dấu — lớp lấp không được bỏ, vì số dấu lược phải khớp từng khoá).

    2.4 là chỗ DUY NHẤT trong lát này không trùng nguyên văn: Pāli ghi `tesaṁ` (sở hữu số
    nhiều) chứ không phải `tassa` như 2.2/2.6/2.8/2.10/2.13/2.15, và `Rūpā` ở 2.3 là số
    nhiều — nên dịch "those" để giữ khác biệt số. Kho đã dùng số nhiều trong đúng khuôn câu
    này: "to completely understand these three feelings" (4×). Đây là bất định duy nhất của bài,
    không có bản Anh nào đã ghim cho 2.4 để đối chiếu.
