notes: |-
  1.13: Pāli `Yo kho, rādha, anattā tatra te chando pahātabbo”ti.` GIỐNG HỆT 1.1 của chính bài, đã
  ghim thành "“Rādha, you should give up desire for what is not-self. …”" — chép nguyên văn theo
  luật 3 (chỉ khác ở chỗ Pāli 1.13 đóng ngoặc sau nên không có ` …`).

  1.3: `Cakkhu kho, rādha, anattā. Tatra te chando pahātabbo.` — 0 tiền lệ cho đúng câu này (đếm 0
  cặp Pāli↔Anh có `Cakkhu kho, rādha`). Vế `Tatra te chando pahātabbo` dựng theo sn23.35:1.5 và
  sn23.34:2.3, vốn dịch `tatra te chando pahātabbo …pe…` thành "You should give up any desire …
  for it." — tức `tatra` hợp vào "for it". Ở bài này 1.1 đã ghim dạng "give up desire for …" không
  có "any", nên tôi theo 1.1.

  1.12: `tampi anattā` có 0 tiền lệ. "…feeling that arises dependent on mind contact" theo
  sn35.102:1.16 (Pāli gần trùng, `tampi na tumhākaṁ`); `tampi` → "also" theo sn35.235:7.4 (`tampi
  aniccaṁ` → "is also impermanent"); vế sau theo 1.3.

  Lưu ý khi đọc: 1.1 đã ghim kết bằng `…”`, còn 1.3 và 1.12 không mang ngoặc (Pāli cũng không
  mang) — chỗ gãy này ở bản đã ghim, không phải ở bản lấp.
