notes: |-
  Hai khoá này TRÙNG NGUYÊN VĂN Pāli với 2.2 và 2.3 của CHÍNH bài (luật 3 của lớp lấp — bản Anh đã
  ghim sẵn: `“‘dhātunānattaṁ, dhātunānattan’ti, bhante thera, vuccati.` → “Honorable Senior, they
  speak of ‘the diversity of elements’.” và `Kittāvatā nu kho, bhante, dhātunānattaṁ vuttaṁ
  bhagavatā”ti?` → “In what way did the Buddha speak of the diversity of elements?”`), nên chép
  nguyên văn, không dịch lại từ đầu.

  `dhātunānattaṁ` → “the diversity of elements” là khuôn của cả bài
  (2.2/2.3/2.10/2.11/3.6/3.7/3.9/3.12).

  Không có bất định nào trong hai khoá này. 2.8 (`Dutiyampi kho āyasmā thero tuṇhī ahosi.`) và 4.6
  (`Dutiyaṁ.`) vẫn trống ở mọi tầng nhưng ngoài lát đã giao nên không điền.
