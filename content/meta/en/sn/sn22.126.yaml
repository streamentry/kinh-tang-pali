notes: |-
  Lớp lấp: 9 khoá. Bản Anh đã ghim để trống **đúng chín khoá này**, không khoá nào khác, nên tệp lớp lấp
  không che khoá nào: `2.5`, `2.6`, `2.9`, `2.10`, `4.5`, `4.6`, `4.9`, `4.10`, `4.16`. Trong đó **8** khoá
  có Pāli ≥ 40 ký tự nên tính vào coverage; `4.16` là `Paṭhamaṁ.` (9 ký tự) nên dưới ngưỡng.

  **Bốn số A/B/C/D (đo bằng máy, ngưỡng “gần trùng” = 0,90 trên chuỗi đã bỏ dấu câu):
  A = 0 · B = 5 · C = 4 · D = 0.** A = 0 vì trong 43 khoá của bài **không có** cặp Pāli trùng byte nào;
  D = 0 vì cũng vậy, không có cặp Pāli trùng mà lời khác nhau, nên không có gì phải báo. Nhóm B: `2.6`,
  `2.9`, `2.10`, `4.6`, `4.10`. Nhóm C: `2.5`, `4.5`, `4.9`, `4.16`.

  **Nhóm B — dựng lại từ lời tầng đã ghim, và đây là phần tầng đã ghim đã nuốt mất.**
  · `2.6` ← `2.4` **0,94** (cùng danh từ, khác phần định ngữ) — lời đầy đủ lấy từ `2.3` và `2.13`.
  · `2.10` ← `2.8` **0,94** (*choices*) — lời đầy đủ lấy từ `2.3` và `2.13`.
  · `2.9` ← `2.8` **0,90** (*choices*) — lời đầy đủ lấy từ `2.2` và `2.12`.
  · `4.6` ← `4.4` **0,94** — lời đầy đủ lấy từ `4.3` và `4.13`.
  · `4.10` ← `4.8` **0,94** — lời đầy đủ lấy từ `4.3` và `4.13`.
  Tầng đã ghim ở `2.4`/`4.4` chỉ còn *“They don’t truly understand feeling …”*, và ở `2.8`/`4.8` chỉ còn
  *“choices …”*. Nghĩa là mất hẳn ba thứ, lớp lấp chèn lại cả ba ở từng khoá: (1) vị từ `yathābhūtaṁ …
  pajānāti` / `nappajānāti` của chính vế ấy; (2) **tên gọi** trong nháy đơn `‘samudayadhammā vedanā’ti`,
  `‘vayadhammā saṅkhārā’ti`; (3) vế `samudayavayadhammaṁ …` — *"which is liable to originate and
  vanish"*. Các vế *“don’t truly understand”* và *“truly understand”* giữ y nguyên lời đã ghim ở `2.1`–`2.3`
  và `4.1`–`4.3`.

  **Nhóm C.** `2.5` (0,90 với `2.4`), `4.5` (0,89 với `4.4`), `4.9` (0,90 với `4.8`) rớt ngưỡng **chỉ vì
  khác danh từ**, và danh từ ấy đã có lời ở chính khoá anh em, nên thực chất vẫn dựng lại từ lời đã ghim;
  phép đo không đếm ra là vì nó so `vedanaṁ`↔`rūpaṁ` và `saṅkhāre`↔`viññāṇaṁ`. `4.16` là **khoá duy nhất
  phải dịch thật từ Pāli**: `Paṭhamaṁ.` không có một tiền lệ nào ở tầng đã ghim — đo: cụm này có **320**
  khoá Pāli trong cache và bản Anh đã ghim có chữ ở **0** trong số đó (riêng `sn22`: 15 khoá, 15 trống;
  `Catutthaṁ.` 282 khoá và `Dutiyaṁ.` 293 khoá cũng 100% trống ở tầng đã ghim). Lớp lấp dịch *“First.”*,
  khớp với hai tiền lệ đã có của chính lớp lấp.

  **Thuật ngữ — dùng lại đúng lời tầng đã ghim, không tự đặt.** `vedanaṁ` → *feeling* (lời ở `2.4`) ·
  `saṅkhāre` → *choices* (lời ở `2.8`; đo trong `sn22`, **158** khoá tầng đã ghim dùng *choices* cho
  `saṅkhāra`) · `nappajānāti` → *“don’t truly understand”* (giống `2.1`–`2.3`) · `pajānāti` →
  *“truly understand”* (giống `4.1`–`4.3`).

  **Chỗ cố ý lệch tầng Anh đã ghim.**
  1. *Nháy đơn.* Lớp lấp giữ `as ‘feeling which is liable to vanish’`. Điều kiện của lớp lấp là khớp Pāli
     **từng khoá**, và Pāli có cặp nháy đơn ở cả tám khoá này. Số đo hai phạm vi: bản Anh đã ghim có **12** khoá
     mang đúng công thức `‘X’ti` trong bài này và **bỏ** nháy ở **12/12**; phạm vi gần `sn22` giữ **3** / bỏ
     **24**; cả bộ `sn` giữ **20** / bỏ **57**; toàn tầng Anh đã ghim giữ **87** / bỏ **369**. Chính lớp lấp
     này: `as ‘X’` **12** lần, trong đó **8** là của bài này, còn `as X` không nháy **141** lần. Giữ nháy vì
     (a) đúng luật từng khoá, (b) nháy làm lộ phân biệt có thật của Pāli giữa **tên gọi** trong `‘…’ti` và
     cùng những từ ấy dùng theo cách khác — điều tầng đã ghim đã làm phẳng.
  2. *Dạng đầy đủ, không nén theo khoá anh em.* `2.5` và `2.4` là hai vế riêng nhưng cùng nói một công thức;
     tầng đã ghim đã nén `2.4` thành *“…feeling …”*. Lớp lấp dịch đủ vế của `2.5` vì Pāli `2.5` là mệnh đề
     đầy đủ có vị từ riêng. Hệ quả có thật, nói thẳng: cột Anh sẽ lặp *“They don’t truly understand
     feeling”* hai lần liền; nguyên nhân là tầng đã ghim nén trước, không phải lớp lấp.
  3. *Dấu lược.* Lớp lấp **không** thêm `…` ở đâu cả: chín khoá này Pāli có **0** dấu lược và lớp lấp cũng
     **0**. Ngược lại, tầng đã ghim **tự thêm** `…` ở `2.4`, `2.8`, `4.4`, `4.8` — bốn khoá mà Pāli không có
     dấu lược. Đo cả phẩm `sn22`: tầng đã ghim thêm `…` ở **205** khoá và **bỏ** `…` ở **441** khoá. Đây là
     lỗi của tầng đã ghim, lớp lấp không sao chép.
  4. *Dấu chấm.* Pāli `2.5` và `2.9` kết bằng `;`, lớp lấp kết bằng `.` — đúng như tầng đã ghim đã làm ở
     `2.2` và `2.12`, vốn cũng kết Pāli bằng `;`.
  5. *Khoảng trắng cuối câu.* Lớp lấp không để khoảng trắng cuối, theo đa số của chính lớp lấp: đo **2900**
     giá trị không có, **307** giá trị có.

  **Số khoá trống còn lại: 0.** Tầng đã ghim để trống 9 khoá ở bài này (không tính khối `:0`) và lát này lấp
  đủ 9. `4.16` vẫn được lấp dù dưới ngưỡng 40 ký tự, vì nó nằm trong tập lấp được và để trống sẽ là lỗ hổng
  của chính lớp lấp; nó **không** tính vào coverage.

  **Số cặp Pāli trùng đã dò toàn tầng.** Chỉ `4.16` có Pāli trùng byte ở bài khác: `Paṭhamaṁ.` trùng ở
  **319** bài; tám khoá còn lại có **0**. Số khoá dùng lại **nguyên văn** từ chính bài này: **0**.

