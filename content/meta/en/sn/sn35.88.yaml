notes: |-
  5.2: `pharusā` có 0 tiền lệ TRONG ĐÚNG CÂU NÀY — cả sn35.88:5.2 lẫn bản song song mn145:5.4 đều
  bị bản Anh đã ghim bỏ trống. Nhưng chính từ này có tiền lệ mạnh và nhất quán: an5.58:4.3 `caṇḍā
  pharusā apānubhā` → "violent, harsh, and brash"; an7.63:12.3 `pharusā` → "harsh"; dn26:18.8 và
  mn114:6.11 → "harsh". Chọn "harsh".

  BẤT ĐỊNH ở 5.2: 5.1 đã ghim `Caṇḍā` thành "wild and rough" — tức Sujato đã dùng "rough" cho tính
  từ thứ nhất, nên "harsh" của tôi ở 5.2 chồng lấn một phần với "rough". Tôi vẫn dịch vì Pāli có
  HAI tính từ ở HAI khoá và luật 2 của lớp cấm bỏ chữ. Nếu người biên tập muốn bỏ tính từ thứ hai
  thì đó là thay đổi cần ghi vào notes, không phải chỗ để tôi tự lược.

  18.5 và 18.6: Pāli `Tenevantaravassena pañcamattāni upāsikāsatāni paṭivedesi.` và
  `Tenevantaravassena tisso vijjā sacchākāsi.` 18.4 của chính bài đã ghim "Within that rainy
  season he confirmed around five hundred male and five hundred female lay followers. And within
  that same rainy season he realized the three knowledges." — tức Sujato ĐÃ GỘP cả 18.4+18.5+18.6
  vào một câu (bằng chứng: mn145:7.4, Pāli gộp cả ba vế, dịch y hệt). Tôi không sửa tệp đã ghim,
  và cũng không bỏ 18.5/18.6, nên người đọc sẽ thấy nội dung đó HAI LẦN. Đây là hệ quả của lớp
  ghim bị nén, không phải lỗi lặp của bản lấp — nhưng người đọc cần biết, nên tôi ghi ra đây và hạ
  `semantic_fidelity` 9.2 cùng `ambiguity_integrity` 9.2 cho 18.5/18.6. Mẫu "And within that same
  rainy season" lấy từ 18.7 đã ghim; vế `tisso vijjā sacchākāsi` → "he realized the three
  knowledges" lấy từ mn145:7.4 (1 cặp, cùng Pāli). `upāsikāsatāni` cũng có 0 tiền lệ riêng; tôi
  dựng "around five hundred female lay followers" từ đúng mẫu 18.4 đã ghim.
