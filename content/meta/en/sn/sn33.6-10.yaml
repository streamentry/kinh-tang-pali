notes: |-
  Ba khoá lặp lại những đoạn đã có bản dịch trong CHÍNH bài này hoặc ở bài anh em:

    - 1.4 (`sassato lokoti vā, asassato lokoti vā …pe…`) dùng nguyên văn bản ghim
      "the cosmos is eternal, or not eternal …" (cùng Pāli đã dịch ở sn33.2:1.4).
    - 1.5 lấy nguyên vế cuối của danh sách, thêm chủ ngữ, giữ "after death" — cùng cách
      làm như sn33.1:1.9, để hai bài cùng họ không tự mâu thuẫn. Vì Pāli kết `…”ti?`,
      bản lấp kết `.”?`; đếm ngoặc ở Sn 33 là MỘT ngoặc đóng (khác Sn 24 là hai).
    - 1.7 (`rūpanirodhagāminiyā paṭipadāya adassanā …pe…`) dịch thành "because of not
      seeing the practice that leads to the cessation of form …". Tiền lệ từng từ:
      `adassanā` → "not seeing" (Sujato dùng đúng vậy ở 1.6 của bài này),
      `Xgāminiyā paṭipadāya` → "the practice that leads to the cessation of …".

  Bất định đã ghi nhận:

    - Ở 1.7 có thể chọn hình thức danh sách như Sujato làm ở 1.11 ("…and the practice
      that leads to its cessation …"), nhưng như vậy sẽ mất `adassanā` và mất quan hệ nhân
      quả đã mở ở 1.6 ("it is because of not seeing form"). Bản lấp giữ dạng nhân quả; đây
      là lựa chọn có thể đảo ngược, nên `ambiguity_integrity` hạ 9.2.
    - 1.8 và 1.9 chỉ là mệnh đề rút gọn, không có tiền lệ trong tầng cho dạng đầy đủ; bản
      ghim đã có "… feeling …" và "… perception …" nên không cần lấp.
    - 1.12 ("Dasamaṁ") trống và dưới ngưỡng nên không thuộc lớp lấp.
    - Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của
      lớp lấp. `triangulation` bị chặn ở 8.0 vì không có bản Anh độc lập.
