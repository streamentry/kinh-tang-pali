notes: |-
  Lát 602. Ba mươi bốn khoá lấp = ba mươi bốn khoá tầng Anh đã ghim để trống; 25 khoá có nội dung, 9 khoá dưới
  ngưỡng (`6.2` `7.3` câu hỏi `Katamehi …?`, `6.5` `7.6` `7.7` `Dhamme/saṅghe …pe…`, `8.8` `8.11` `8.14` `Yeneva
  bhagavā tenevāhaṁ assaṁ.`, nhãn `8.21` `Tatiyaṁ.`) vẫn lấp.

  **Bốn nhóm khoá (đo bằng máy trên 69 khoá Pāli):** A **16** · B **7** · C **11** · D **0**.

  - **A (16)**: `6.2` `6.5` `6.8` `7.3` `7.6` `7.7` `7.8` `8.8`–`8.15` dùng lại **nguyên văn** lời đã ghim của
    khoá Pāli trùng (`2.2` `2.5` `2.8` `3.3` `3.6` `3.7` `3.8` `8.5` `8.6`). **3 khoá A lệch có chủ đích ở dấu
    câu:** `6.3`, `7.4` (Pāli trùng `2.3`/`3.4`) và `6.6` (trùng `2.6`). Lời đã ghim ở `2.3`/`3.4`/`2.6` **tự thêm
    `…`** nơi Pāli viết đủ và kết bằng `—`, vì tầng đã ghim bỏ trống khoá công thức ngay sau. Ở lớp lấp khoá công
    thức sau (`6.4`, `6.7`, `7.5`) đã có lời, nên giữ `—` theo Pāli; `6.6` đổi “and the Saṅgha …” thành “and they
    have experiential confidence in the Saṅgha—” để đúng Pāli `saṅghe aveccappasādena samannāgato hoti—`.
  - **B (7)**: `5.2` (từ `1.3`, 0,86: đổi nháy kép thành nháy đơn vì đây là lời Mahānāma kể lại), `6.1` (`2.1`,
    1,0: chỉ bỏ `“` mở), `6.9` (`3.1`, 0,92: Pāli `katamehi` “những pháp nào” thay `katihi` “bao nhiêu” ⇒ “what
    things”; bỏ thẻ nhấn mạnh HTML của lời đã ghim), `7.2` `7.9` `8.2` `8.3` (`3.2` `3.9` `4.1` `4.2`, đều 1,0:
    chỉ đổi nháy kép thành nháy đơn theo Pāli).
  - **C — công thức Phật/Tăng** `2.4` `3.5` `6.4` `7.5` (`itipi so bhagavā …pe… satthā devamanussānaṁ buddho
    bhagavāti.`) và `2.7` `6.7`: tầng đã ghim ở các bài anh em (`sn55.13`, `sn55.26`) **mở rộng** dấu lược và thêm
    nháy đơn; lớp lấp giữ đúng một `…` và không thêm nháy (Pāli không có), chỉ dịch phần Pāli viết ra: “That Blessed
    One is … teacher of gods and humans, awakened, blessed.”
  - **C — lời dẫn** `5.1` `5.3` `7.1` `8.1`. Lời đã ghim gọi Godhā là “her” (`1.2`), nhưng Pāli dùng giống đực
    (`godhā sakko`, `godhā ca sakko`); lớp lấp **tránh đại từ** thay vì chọn một bên. Ghi lại để người biên tập phân xử,
    không sửa tầng đã ghim.
  - **C — `8.21`** nhãn “Third.”; bài thứ ba của phẩm (`0.2` “About Sarakāni”), khớp.

  **Ghi chú về tầng đã ghim.** `2.1`/`2.8`/`3.1`/`3.9` bỏ chuỗi `avinipātadhammaṁ niyataṁ sambodhiparāyaṇaṁ`;
  lớp lấp theo đúng lời đã ghim ở các khoá B/A tương ứng (`6.1`, `6.8`, `7.2`, `7.9`) để không lệch khoá anh em,
  riêng `5.2` giữ đủ vì nguồn của nó là `1.3` (đã ghim có đủ chuỗi). `8.4` đã ghim mở `“` dù Pāli không mở.

  **Dấu lược:** Pāli của 34 khoá có 10 dấu lược, lớp lấp 10. **Nháy:** 34/34 khớp Pāli.

  **Coverage (đo bằng phép của `englishCoverageFor`: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước: 24/49
  = 0.4898. Sau khi lớp lấp `published`: 49/49 = 1.0. Độ nhạy: phải mất thêm 10
  khoá có nội dung nữa thì bài mới rớt dưới ngưỡng 0,8. Lớp lấp chỉ được tính khi `status: published`.
  `sn/sn55.23` **có** record trong `content/meta/reference-gaps.yaml` (substantive 49, thiếu 25); record đó sẽ thành thừa khi lớp lấp `published`. Lát này **không** chạm tệp đó; người điều phối sinh lại bằng `npm run reference:gaps`.

  **Hai cơ chế khoá trống ở tầng Anh đã ghim (đo, không sửa).** Cắt cụt dãy (≥ 4 khoá trống liên tiếp):
  1 dãy / 24 khoá / 1.570 ký tự Pāli (`5.1`–`8.3`). Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 29/34 khoá trống vào nhóm
  (kiểm `kết quả ≤ số khoá trống`: đạt).

  **Triangulation ≤ 8,0.** Scorecard Việt của bài (`content/meta/sutta/sn/sn55.23.yaml`) ghi `translators` và `quality.assessed_by` là công cụ cùng họ với lớp lấp — **cùng
  alias công cụ** với lớp lấp này (khai trong `source/tooling.yaml`). Vì vậy bản lấp **không phải** cách đọc
  English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá lấp.
  Không có bản Anh thứ hai; đối chiếu có: Pāli root + Sujato đã ghim (cho khoá anh em) + bản Việt canonical (chỉ
  để đối chiếu nghĩa, không dịch vòng, không chép).

  **technical_integrity 9,6.** Lát này không được chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh
  còn nợ: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Tự kiểm đã làm: JSON parse, mọi khoá
  thuộc `fillableSegments`, không khoá nào trùng khoá Sujato có chữ (0 shadow), NFC, không khoá rỗng, dấu lược
  khớp Pāli (`…pe…` = một `…`), nháy khớp Pāli từng khoá trừ các ngoại lệ ghi ở trên.
