notes: |-
  1.4 và 1.12 dùng câu khuôn của lớp lấp — "And what’s not-self should be truly seen
  with right understanding like this: ‘This is not mine, I am not this, this is not my
  self.’" — đã publish ở sn35.204:1.8 và 1.12 (1.4 ở đây trùng NGUYÊN VĂN 1.4 của
  sn35.204), cùng sn22.15:1.9, sn35.1:2.12, sn35.5:1.10, sn35.6:1.8 và sn35.210-212:1.5;
  vế đó đã được Sujato dịch ở sn35.204:1.4, sn35.210-212:1.2 và sn35.219-221:1.2. Cả hai
  khoá này KHÔNG có `…pe…` nên không có dấu lược (khác sn35.205 và sn35.206, cùng câu
  nhưng có).

  1.9 là khoá DUY NHẤT trong cả lát không có tiền lệ: `dhammā aniccā atītā anāgatā
  paccuppannā.` không xuất hiện ở bài nào khác trong SN đã ghim (đã dò 36.786 vế), vì
  sn35.216-218:1.8 và sn35.219-221:1.7 — hai bản song song — cũng để trống. Chỉ dùng được
  hai điều đã ghim trong chính bài này: `dhammā` = "ideas" (1.1, và sn35.162:2.14 dịch
  "Dhammā aniccā" là "ideas,") và cụm thời gian "in the past … future … present" (1.1;
  cụm này 10 lần trong SN đã ghim, và 1.1 của sn35.207-209 / sn35.216-218 dùng y hệt).
  Vì vậy 1.9 dựng thành "Ideas are impermanent in the past, future, and present." — thứ tự
  ba danh từ thời giữ nguyên như Pāli `aniccā atītā anāgatā paccuppannā`. Đây là dựng lại,
  không phải dịch lại, nên `terminology` và `ambiguity_integrity` hạ rõ nhất trong lát này.

  1.5–1.8 và 1.10, 1.11, 1.13, 1.14 vẫn để trống vì thuộc lát khác.
  `triangulation` 8.0 là đặc thù của lớp lấp. `vietnamese_clarity` và `han_viet_balance`
  mang giá trị mặc định của lớp lấp.
