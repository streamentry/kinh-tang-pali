notes: |-
  Bài này có **tiền lệ gần như trùng khít** là `sn56.62` — cùng công thức bụi trên đầu móng tay, cùng cách đối chiếu với mặt đất lớn, và `sn13.1` cũng vậy. Tôi lấy tiếng Anh từ đó:
  - `sn56.62:1.1` / `sn13.1:1.3` có Pāli **giống hệt** `1.1` → "Then the Buddha, picking up a little bit of dirt on his fingernail, addressed the mendicants:"
  - `sn56.62:1.3` → "Which is more: the little bit of dirt on my fingernail, or this great earth?”"
  - `sn56.62:1.4` / `sn13.1:2.2` → "The little bit of dirt on your fingernail is tiny."
  - `sn56.62:1.5` có Pāli **giống hệt** `1.7` → "Compared to the great earth, it doesn’t count, there’s no comparison, it’s not worth a fraction.”"

  Hai chỗ tôi **cố ý không chép y nguyên**, và ghi lại để người sau không tưởng là sót:
  1. `1.3` có `mayā` ("ta bốc") — tôi giữ thành "the little bit of dirt **I lifted** onto my fingernail". Bản ghim bỏ mất chủ thể `mayā`.
  2. `1.6`–`1.7` có `bhagavatā paritto` (tác giả là Đức Thế Tôn, thì vị đang nói với Ngài) — bản ghim dùng "on **your** fingernail". Ở đây Đức Phật đang nói, không ai hỏi Ngài, nên "your" là nhầm người đọc; tôi dùng "on **his** fingernail" / "lifted **by the Blessed One**".

  ⚠ **Hai lỗ trống nằm ngay giữa lát.** `1.4` (`"Etadeva, bhante, bahutaraṁ, yadidaṁ—`) và `1.5` (`mahāpathavī;`) để trống ở tầng ghim, nhưng chỉ **37 và 13 ký tự** nên dưới ngưỡng 40, không vào lát này. Hậu quả trên reader: sau `1.3` (…this great earth"?) sẽ thiếu lời đáp *the great earth is certainly more* trước khi tới `1.6`. Tôi **không** tự ý lấp vì ngoài lát được giao, nhưng đây là chỗ nên giao tiếp.

  ⚠ **Lớp lấp này KHÔNG phải lớp đọc Anh độc lập cho bài này.** `content/meta/sutta/sn/sn56.102.yaml` ghi `quality.assessed_by: "OpenCode Space Bunny Free (agent)"`. `triangulation` hạ xuống **7.5**; `validate` sẽ **cảnh báo** rằng phủ Anh ở bài này dựa trên bản lấp của chính người viết bản Việt. Tôi **không sửa** scorecard tiếng Việt.

