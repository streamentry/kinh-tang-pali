notes: |-
    Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược. `sn36.19` có **16** khoá để trống; lát này
    được giao 7.

    **Bốn khoá chép nguyên văn lời đã ghim.**
    - `2.4` và `3.4`: Pāli giống **hệt** `1.4` (`Sukhā vedanā, dukkhā vedanā, adukkhamasukhā vedanā—`)
      ⇒ lấy nguyên văn lời đã ghim: "pleasant, painful, and neutral."
    - `2.10` và `3.10`: Pāli giống **hệt** `1.10` ⇒ "The Buddha said that neutral feeling is included
      as a peaceful and subtle kind of pleasure.”" Dấu ngoặc kép đóng `”` ở đây là của chính khoá
      này (`vuttā bhagavatā”ti.`), nên lớp lấp giữ, dù khoá kế tiếp lại mở lời.

    **Ba khoá mới, nhưng dựng đúng trên lời đã ghim ở `5.3`, không dịch lại từ đầu.**
    `5.4`–`5.9` (`tisso… pañca… cha… aṭṭhārasā… chattiṁsā… aṭṭhasata… mayā vedanā vuttā
    pariyāyena`) là sáu khoá liên tiếp, và Sujato đã **nén cả sáu** vào một câu ở `5.3`: "In one
    explanation I’ve spoken of two feelings. In another explanation I’ve spoken of three feelings, or
    five, six, eighteen, thirty-six, or a hundred and eight feelings." Lớp lấp giữ nguyên vế dẫn
    **"In another explanation I’ve spoken of … feelings"** và chỉ thay số:
    - `5.7` `Aṭṭhārasāpi` → "In another explanation I’ve spoken of eighteen feelings, too."
    - `5.8` `Chattiṁsāpi` → "In another explanation I’ve spoken of thirty-six feelings, too."
    - `5.9` `Aṭṭhasatampi` → "In another explanation I’ve spoken of a hundred and eight feelings, too."
    `-pi` = "too/also"; `5.3` không có `-pi` nên chữ "too" không xuất hiện ở đó — đây là chỗ duy nhất
    lớp lấp thêm, và nó là chữ có nguồn. Cách đếm: `layers.yaml` khai `substantivePaliMinChars: 40` và phép kiểm là `>= 40`, nên đo
    đúng ba khoá này (độ dài sau khi bỏ khoảng trắng thừa: **41**, **41**, **42** ký tự).

    **Còn 9 khoá trống lấp được mà lát này không được giao — báo lại.** `2.5`, `2.9`, `3.5`, `3.9`,
    `5.4`, `5.5`, `5.6`, `6.7`, `16.7`.
    - `2.5`, `3.5` trùng nguyên văn `1.5`; `2.9`, `3.9` trùng nguyên văn `1.9` ⇒ lấy lại nguyên văn
      lời đã ghim (`"The Buddha has spoken of these three feelings.”"` và `"pleasant and painful."`).
    - `5.4`, `5.5`, `5.6` cùng công thức với ba khoá vừa viết ⇒ lấy lại nguyên văn lời vừa viết với
      số tương ứng.
    - `6.7` = `idaṁ vuccati kāmasukhaṁ.` (24 ký tự, **dưới** ngưỡng 40) — nên vẫn nên lấp về sau;
      `16.7` = `Navamaṁ.` (10 ký tự) — colophon, dưới ngưỡng.

    `triangulation` hạ vì không có bản Anh độc lập: bốn khoá là lời đã ghim của chính tầng ghim,
    ba khoá còn lại dựng trên câu đã ghim ở `5.3`. Bài này **không có lớp Việt**
    (`content/translation/vi/project/sutta/sn/sn36.19…` và `content/meta/sutta/sn/sn36.19.yaml`
    đều vắng mặt) nên cũng không có tầng Việt để đối chiếu nghĩa. Bốn lệnh cổng còn lại **chưa** chạy
    vì lát này bị cấm: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
