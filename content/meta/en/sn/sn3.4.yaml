notes: |-
  ĐÚNG BẪY sn11.24, và bài này là bản thuần tuý của nó.

  `2.2`–`2.16` là Đức Thế Tôn DẪN LẠI chính lời vua (bản đã ghim đã nói thẳng ở `2.1`: “And
  he repeated the king’s statement, adding:”). Vì vậy `2.2` = `1.6` + `mahārāja`,
  `2.5` = `1.9`, `2.7` = `1.11` + `mahārāja`, `2.9` = `1.13` + `mahārāja`,
  `2.15` = `1.18` + `mahārāja`. Tôi dùng lại đúng câu bản đã ghim đã dịch cho §1, chỉ chèn
  danh xưng.

    - `2.2`: “Those who do bad things by way of body, speech, and mind” (=`1.6`)
    - `2.5`: ““I love myself”, they don’t really.” (=`1.9`)
    - `2.7`: “It’s because they treat themselves like an enemy.” (=`1.11`)
    - `2.9`: “Those who do good things by way of body, speech, and mind” (=`1.13`)
    - `2.15`: “It’s because they treat themselves like a loved one.” (=`1.18`)

  ĐỦA `mahārāja`: bản đã ghim dùng “Great King” (`2.1`) và đặt danh xưng ngay sau vế dẫn
  (`an5.49:3.2` `pañcimāni, mahārāja, alabbhanīyāni ṭhānāni` → “Great king, there are five
  things…”; `an10.30:1.9` `Eso, mahārāja, vihāro` → “Great king, that’s his dwelling”). Tôi
  theo đúng cách đó: `Ye hi keci, mahārāja, kāyena…` → “Great King, those who do bad things…”
  và `Yañhi, mahārāja, appiyo appiyassa kareyya…` → “It’s because, Great King, they treat
  themselves like an enemy,”.

  BẤT ĐỊNH CÒN LẠI (không chặn): vị trí danh xưng. Pāli đặt `mahārāja` giữa chủ ngữ và vị ngữ
  (`Ye hi keci, mahārāja, kāyena duccaritaṁ caranti`), không có cách nào dịch ra tiếng Anh mà
  giữ nguyên vị trí đó mà vẫn thành câu. Tôi đặt sau vế dẫn như `an5.49`. Lựa chọn còn lại —
  cuối câu — cũng đúng ngữ pháp nhưng lệch tông quy ước của bản đã ghim.

  Lớp lấp: 5 khoá nằm ở chỗ bản Anh đã ghim để trống. `2.3`, `2.4`, `2.6`, `2.8`, `2.10`–
  `2.14`, `2.16`, `2.17` cũng trống nhưng không thuộc lát này, nên khi đọc cột Anh người đọc
  thấy các đoạn nối bị đứt; đó là lỗ hổng của bản đã ghim, không phải của lớp lấp. Triangulation
  bị chặn ở 8.0.
