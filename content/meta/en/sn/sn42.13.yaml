notes: |-
  **Phân loại 76 khoá. Script (so Pāli đã chuẩn hoá dấu câu): A = 43 · B = 7 · C = 7 · D = 19. Đọc lại bằng tay: A = 59 ·
  B = 10 · C = 7 · D = 0 (19 khoá script báo D đều được phân xử, xem dưới).** Lấp đủ 76/76 khoá tầng Anh đã ghim để trống (không
  còn khoá trống nào của bài): 33 khoá đủ ngưỡng 40 ký tự (sau khi bỏ khoảng trắng cuối) và 43 khoá dưới ngưỡng. Phần lớn khoá dưới ngưỡng là
  những dòng ngắn của phần công thức (“Joy springs up in them.”, “Tamenaṁ evamāhaṁsu:”, … ) và colophon/kệ tóm lược; chúng là mắt xích của
  câu nên được lấp, chúng không vào coverage.

  **Nhóm A — 59 khoá, dùng lại nguyên văn lời đã ghim của cùng bài.**
  · Bốn phần “vị thánh đệ tử tự nhủ” ở tâm xả (`28`, `29`, `30`, `31`): phần Pāli trùng từng chữ với bốn phần tâm từ đã ghim (`23`–`26`). Lấy y
  nguyên: `28.2`, `29.2`, `30.2` = `23.2` · `28.3`, `29.3`, `30.3`, `31.3` = `23.3` · `28.4` = `23.4`, `29.4` = `24.4`, `31.4` = `26.4` ·
  `28.5`, `29.5`, `30.9` = `23.5` · `28.6`, `29.6`, `30.10` = `23.6` · `28.7`–`28.13`, `29.7`–`29.13`, `30.11`–`30.17` = `23.7`–`23.13` ·
  `30.5`–`30.8` = `25.5`–`25.8` · `31.5`–`31.8` = `26.5`–`26.8`.
  · Ba khoá cuối của các vòng hỏi đáp: `13.3` = `6.3` · `13.7` = `6.7` · `14.3` = `7.3` (Pāli trùng từng chữ).
  · Mười một khoá `Tamenaṁ evamāhaṁsu:` (`9.2`, `9.4`, `10.3`, `11.2`, `11.4`, `12.2`, `12.4`, `13.2`, `13.4`, `14.2`, `14.4`): cùng một câu Pāli
  đứng ở **hai chỗ khác vai** — trước câu hỏi và trước câu đáp — và tầng đã ghim đã dịch hai cách tùy vai: `6.2`, `7.2` “You might ask someone:”,
  `6.4`, `7.4` “And they’d reply:”. Lớp lấp theo vai: `9.2`, `11.2`, `12.2`, `13.2`, `14.2` hỏi (đứng liền trước câu `‘ambho, ayaṁ puriso kiṁ akāsi …`); `9.4`,
  `10.3`, `11.4`, `12.4`, `13.4`, `14.4` đáp. Script báo “D” vì cùng Pāli mà có hai lời; thực ra không mâu thuẫn.

  **Nhóm B — 10 khoá, dựng lại từ lời đã ghim.**
  · `29.1`, `30.1`, `31.1` ← `23.1` (thay “love” bằng “equanimity”; Pāli của ba khoá trùng `28.1` từng chữ). **Cố ý không dùng lại `28.1`:** lời đã ghim ở
  `28.1` là mảnh tiếp nối sau `27.1`/`27.2` (“equanimity to one direction, and to the second …”, viết thường, mở đầu bằng chữ “equanimity”) vì
  Sujato ngắt tâm bi–hỷ–xả bằng dấu lược; ghép mảnh ấy vào đầu một khoá sau khoá `28.13` thì thành câu cụt. Nên ba khoá này dịch đủ câu, theo `23.1`.
  · `30.4` ← `25.4` (khớp 0,99): Pāli `chedato chedāpayato` (so với `chindato chedāpayato` ở `25.4`) là cùng một ý; lời lấp lấy nguyên lời `25.4`.
  · `9.3`, `11.3` (Pāli trùng nhau, `…pe…`) ← `6.3` + `6.1`; `9.7`, `11.7` ← `6.7`; `10.2`, `12.3` ← `7.1`. Vì Pāli của các khoá này ghi `…pe…` thay cho
  phần mô tả, luật là giữ **đúng một** “…”: “‘My man, what did that man do, garlanded and adorned … taking his pleasure with women as if he were a king?’”,
  “That’s why he’s garlanded and adorned … taking his pleasure with women as if he were a king.’”, và (người bị xử tử) “‘My man, what did that man do, that
  they bind him with a strong rope … and chop off his head to the south of the city?’”. **Hệ quả người đọc sẽ thấy:** tầng đã ghim ở `6.3`/`7.3` (và vì
  vậy ở `13.3`, `14.3` tôi dùng lại nguyên văn) rút gọn câu hỏi thành “‘My man, what did that man do?’” dù Pāli của `6.3`/`13.3` viết đủ phần mô tả,
  còn khoá `9.3`/`11.3` mà Pāli lược bằng `…pe…` lại nhận lời có phần mô tả. Tức là lời lấp ở khoá lược dài hơn lời đã ghim ở khoá viết đủ; đây là do tầng đã ghim rút
  gọn `6.3`, không sửa.

  **Nhóm C — 7 khoá, tự dịch.** `32.4` `Terasamaṁ.` → “Thirteenth.” (**nhãn thứ tự — cảnh báo theo luật của lát:** nhãn trùng số bài, đây là bài thứ 13 của
  phẩm, nên khớp). `32.5` `Gāmaṇivaggo paṭhamo.` → “The Chapter on Chiefs, the first.” (theo “1. Chiefs” ở `0.2` và khuôn “The Deities Chapter, fourth.” đã lấp ở `an7.43:7.8`).
  `33.0`–`33.4` kệ tóm lược: “Its summary verse:” + tên mười ba kinh của phẩm theo tầng đã ghim (“Fury”, “Tālapuṭa”, “A Warrior”, “An Elephant Marshal”,
  “A Cavalryman”, “Asibandhaka’s Son”, “A Horn Blower”, “Families”, “Maṇicūḷaka”, “Bhadraka”, “Rāsiya”, “Pāṭaliya”). **Một chỗ không phân xử chắc được:** `Desanā` ở
  `33.3` có nghĩa đen là “the Teaching”; kệ liệt kê đúng mười ba tên, và `Khettūpama` (`sn42.7`) là tên kinh duy nhất không xuất hiện, nên có khả năng `Desanā` đứng cho
  nó. Lớp lấp dịch nghĩa đen “the Teaching” và không gán tên kinh.

  **Nhóm D — script báo 19, không có mâu thuẫn thật.** 11 khoá `Tamenaṁ evamāhaṁsu:` (nhóm A, theo vai); `28.4`, `29.4`, `30.8`, `31.8` (Pāli khác nhau chỉ ở dấu nháy:
  nháy đơn ở `16.2`/`17.2`/`18.6`/`19.6`, nháy kép ở `23.4`/`24.4`/`25.8`/`26.8`): lấy lời của khoá có Pāli giống từng chữ kể cả nháy; `31.4` cũng vậy.
  `28.5`, `29.5`, `30.9` (cùng Pāli với `23.5`, `24.5`, `25.9`, `26.9`, `31.9`): bốn khoá đầu của lời đã ghim giống hệt nhau, riêng `31.9` bắt đầu bằng một nháy đơn mở ‘ mà
  Pāli không có. Lớp lấp theo bốn khoá kia, **không** chép nháy lạc của `31.9` (tầng đã ghim, không sửa).

  **Nháy.** 76/76 khoá khớp Pāli (đo đủ bốn loại: nháy kép mở/đóng, nháy đơn mở/đóng). Không có chỗ lệch có chủ đích về nháy.

  **Dấu lược.** Sáu khoá có `…pe…` ở Pāli (`9.3`, `9.7`, `10.2`, `11.3`, `11.7`, `12.3`) đều có đúng một “…” trong lời lấp; không khoá nào khác chứa dấu lược.

  **Cố ý lệch tầng đã ghim:** (1) ba khoá `29.1`, `30.1`, `31.1` dịch đủ câu thay vì mảnh của `28.1`; (2) không chép nháy lạc ở `31.9`;
  (3) hai khoá lược `9.3`/`11.3`, `10.2`/`12.3` giữ phần mô tả trước dấu lược mà `6.3`/`7.3` đã ghim rút gọn.

  **Coverage (mẫu số = khoá Pāli ≥ 40 ký tự, bỏ `:0`; không phải mọi khoá):** trước 140/173 = **0,8092**; sau 173/173 = **1,0000** (sau khi
  `published`). Độ nhạy: ngưỡng 0,8 cần ≥ 139/173, bài đã vượt ngưỡng từ đầu với dư 1 khoá, nên lớp lấp không quyết định bài trên hay dưới ngưỡng.
  Bài này **không** `below` và không có record trong `content/meta/reference-gaps.yaml`; không chạm tệp đó.

