notes: |-
  Bài này đi qua đúng năm phẩm: `rūpa` (2) → `vedanā` (3) → `saññā` (4.1) + `saṅkhārā` (4.2) →
  `viññāṇaṁ` (5). Tầng Anh đã ghim dịch **hai** vòng (`rūpa`, `viññāṇa`) và **bỏ trống** hai vòng
  (`vedanā`, `saṅkhārā`) — đúng hai vòng mà `saññā` ở `4.1` bị lược. Lớp lấp điền đủ hai vòng
  còn thiếu, cộng khoá đếm số thứ tư bảy.

  **Bốn số A/B/C/D (đo được, không ước lượng).**

  | nhóm | số | khoá |
  |---|---|---|
  | A — Pāli trùng nguyên văn với khoá đã có lời trong bài | **2** | `4.6` (≡ `4.4`), `3.5` (≡ `3.3`) |
  | B — Pāli gần trùng khoá đã có lời | **6** | `3.2`, `3.4`, `4.3`, `4.5`, và `3.3`, `4.4` |
  | C — không có lời nào ở tầng, tự dịch từ Pāli | **1** | `12.4` |
  | D — Pāli trùng nhau nhưng lời tầng khác nhau | **0** | — |

  Nhóm A là **hai** khoá, không phải bốn: `3.3` và `4.4` trùng byte với `3.5` và `4.6`, nhưng vợ
  trước của mỗi cặp **không** có lời ở tầng (chính Sujato để trống), nên chúng thuộc nhóm B; `3.5`
  và `4.6` mới là khoá *dùng lại nguyên văn* lời đã có. Đo lại toàn bài: `sn22.59` có **11** nhóm
  Pāli trùng byte, và **0** nhóm nào có lời tầng khác nhau ⇒ **D = 0** thật, không phải vì bỏ sót.

  **Nhóm B — khoá nguồn, tỉ lệ khớp đo được, phần chèn lại.** Tỉ lệ ghép bằng so khác ký tự trên
  Pāli đã bỏ dấu câu và khoảng trắng.

  - `3.2` ← `2.2` (`rūpa`, đã ghim), khớp **0,833**; khoá thứ hai gần nhất `5.2` (`viññāṇa`, đã
    ghim) khớp **0,825**. Phần chèn lại: chỉ đổi danh từ `rūpa` → `vedanā` ("feeling"). Mẫu câu, dấu
    hai chấm và `wouldn’t` / `couldn’t` giữ nguyên như tầng đã ghim.
  - `3.4` ← `2.4`, khớp **0,821**; `5.4` khớp **0,812**. Chèn lại: `rūpaṁ` → `vedanā` và `rūpe` →
    `vedanāya` ("feeling" hai chỗ).
  - `4.3` ← `2.2` khớp **0,787**; `5.2` khớp **0,749**. Chèn lại: `saṅkhārā` → "choices".
  - `4.5` ← `2.4` khớp **0,798**; `5.4` khớp **0,756**. Chèn lại: `saṅkhārā` / `saṅkhāresu` → "choices".
  - `3.3` ← `2.3` và `2.5` (trùng byte, đều đã ghim) khớp **0,763**; `5.3`/`5.5` khớp **0,756**.
  - `4.4` ← `5.3` khớp **0,659** (khoá gần nhất **có** lời; `2.3`/`2.5` chỉ **0,659** và bị kém vì
    `hontu`/`ahesun` khác `hotu`/`ahosī`).

  **Dấu số nhiều là chỗ không được chép y — đã dựng lại từ Pāli, không chép tầng đã ghim.**
  `rūpa` và `viññāṇa` là số ít nên tầng đã ghim dùng "it" và "compel **form**" / "compel
  **consciousness**". `saṅkhārā` là **số nhiều**: Pāli đổi cả động từ (`abhavissaṁsu`, `saṁvatteyyuṁ`,
  `hontu`, `mā ahesun`) và tân ngữ (`saṅkhāresu` số nhiều). Vì vậy `4.3` và `4.5` dùng "**they**"
  chứ không "it", `4.4` dùng "May **they** not be like that" chứ không "May **it**", còn `3.2`/`3.4`
  (cảm thọ, số ít) giữ "it" đúng như hai vòng đã ghim. Nếu chép y `2.2` thì `4.3` sẽ sai số — đó là
  loại lỗi đếm mà `semantic_fidelity` và `grammar_logic` phải trả giá.

  **Thuật ngữ lấy nguyên từ chính bài này, không bịa.** Đo trong bản Anh đã ghim của đúng bài này:
  `vedanā` → "feeling" (`3.1`, `6.9`, `8.1`, `11.1`), `saṅkhārā` → "choices" (`4.2`, `6.11`, `9.2`,
  `11.1`), `ābādhāya saṁvatteyya` → "lead to affliction", `labbhetha` → "you could compel",
  `na ca labbhati` → "you can't compel", `anattā` → "not-self". Không có từ nào trong 9 khoá này là
  lựa chọn mới.

  **`12.4` (`Sattamaṁ.`, 9 ký tự) — khoá C, tự dịch, và tiền lệ rất mỏng nên phải nói thẳng.**
  Đo toàn tầng: Pāli `Sattamaṁ.` xuất hiện **130** lần (trong đó **15** ở `sn22`), nhưng bản Anh đã
  ghim để trống **128/128** khoá có tệp — Sujato **không** dịch nhan đếm số thứ tự ở bất kỳ bài nào
  trong năm bộ. Kiểm rộng hơn: mười dạng `Paṭhamaṁ.`…`Dasamaṁ.` có **2.744** khoá trong năm bộ và
  **0** khoá nào có chữ. Nên **không** có tiền lệ tầng đã ghim để noi theo; tiền lệ duy nhất là
  chính lớp lấp này: `an4.187:9.2` `Sattamaṁ.` → "Seventh." và `an3.70:40.5` `Dasamaṁ.` → "Tenth.",
  `an4.116:2.2` → "Sixth.", `ud5.8:6.5` → "Eighth.". Lớp lấp dùng **"Seventh."** — cùng dạng với
  `an4.187`, dấu chấm đủ vì Pāli kết `ṁ.`.
  ⚠️ Hệ quả thật: `12.4` **không** vào coverage (9 ký tự < ngưỡng 40), nên lấp nó **không** cộng thêm
  một điểm coverage nào. Cột English ở `12.4` hiện đầy, nhưng cổng vẫn là 34/34 chứ không phải 35/35.

  **Dấu lược: 9 khoá lấp này Pāli có 0 dấu `…`, lớp lấp cũng 0.** Không có khoá nào trong lát này
  chứa `…pe…` hay `…` trần, nên không có chỗ nào để bung hay rút. Nhưng kiểm đúng lớp lỗi mà `sn22.76`
  và `an8.35` để lại, thì **chính bài này có lỗi, ở tầng đã ghim, không phải ở lớp lấp**:
  tổng số `…` trong bài là Pāli **11**, Sujato **9**. Hai khoá **Sujato tự thêm** dấu `…` nơi Pāli
  viết đủ: `3.1` (`Vedanā anattā.` → "Feeling is not-self … ") và `4.2` (`saṅkhārā anattā.` →
  "Choices are not-self … "). Còn lại `4.1`, `8.1`, `9.1`, `9.2` Pāli có **2** dấu (`…pe…`) và
  Sujato có **1** — đúng một `…` cho một `…pe…`, **đúng** luật, không phải lỗi. Không khoá nào bị
  Sujato rút thành 0 dấu như `sn22.76`. Hai lỗi ở `3.1`/`4.2` **không sửa được ở lát này** (ngoài lát,
  và `validate` chặn ghi đè tầng đã ghim) — **báo lại cho người điều phốn**.
  Ngoặc kép/nháy đơn: lớp lấp khớp Pāli **từng khoá** — `3.3`/`3.5`/`4.4`/`4.6` có Pāli `‘…’` (1
  cặp nháy đơn) và lớp lấp có **đúng một** cặp `‘’`; năm khoá còn lại không nháy nào ở Pāli và lớp
  lấp cũng không. Dấu `’` trong `wouldn’t` / `can’t` của bốn khoá số ít là **dấu nháy bộc** (đứng
  giữa hai chữ cái), không phải nháy — đếm bằng cách kiểm ký tự liền kề, cho ra **0** nháy lạ.

  **`triangulation` = 7,4 và đây là lý do phải báo.** Bài này **không có bản Việt của dự án**: không
  có `content/translation/vi/project/sutta/sn/sn22.59_translation-vi-project.json`, cũng không có
  `content/meta/sutta/sn/sn22.59.yaml`; tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) tại
  commit đã ghim chỉ có `kn`. Nên **không** có một tầng đối chiếu Việt nào cho bài này, và lớp lấp
  **không** được tuyên bố là đã đối chiếu English — ở đúng tám khoá có nội dung, đó là các khoá mà
  tầng Anh đã ghim đã lược. `vietnamese_clarity` và `han_viet_balance` mang **giá trị mặc định của
  lớp lấp** (tiền lệ `sn22.60`, `sn24.36`), vì không có Việt để đối chiếu.

  **Khoá trống còn lại: 0.** Lát này được giao đúng **9** khoá và `fillableSegments` của bài đúng
  bằng **9** — tức **mọi** khoá trống của bài đã được lấp. `validate` chặn ghi vào khoá ngoài tập đó
  nên không có chỗ nào bị bỏ sót có thể bỏ.

  **Coverage và `content/meta/reference-gaps.yaml`.** Đo trên Pāli có nội dung (≥ 40 ký tự, bỏ khối
  `:0`): mẫu số **34**. Trước lát này **26/34 = 0,7647** (thiếu đúng 8 khoá `3.2`–`3.5` và
  `4.3`–`4.6`); sau khi `published` là **34/34 = 1,0000**. Độ nhạy ngưỡng 0,8: cần ≥ **28/34**, nên
  sau lát này còn **6** khoá có thể trắng mà vẫn không rớt. `sn22.59` **không có** record trong
  `content/meta/reference-gaps.yaml` (bài chỉ nằm trong phạm vi file đó nếu có dữ liệu dự án dưới
  `content/meta/sutta`, mà bài này không có), và sau lát này coverage đã lên 1,0 nên cũng **không**
  cần record mới ⇒ **không** có record nào thành thừa, không cần chạy lại `npm run reference:gaps`.

