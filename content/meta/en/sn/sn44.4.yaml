notes: |-
  Pāli y hệt 2.9, nơi bản đã ghim đã dịch vế trong dấu nháy là "‘a realized one neither still exists nor
  no longer exists after death.’" và KHÔNG dịch riêng `tipissa na hoti` — chính mệnh đề ấy đã thành chữ
  "or" nối bốn cách đặt câu hỏi ở 2.6–2.8. Giữ nguyên vế trong dấu nháy cho khớp 2.9.

  BẤT ĐỊNH CƠ HỌC đã ghi: Pāli mở đúng MỘT ngoặc (`‘`) và không đóng ngoặc nào, vì `’` trong `’ti` là
  AVAGRAHA (lược của `ti`), không phải ngoặc đóng. Bản Anh vì thế buộc phải mở `‘` mà không đóng; đúng
  hình dạng `sn35.238:5.5` đã merge. Câu đọc lên tiếng sẽ thấy dấu nháy treo ở cuối.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
