notes: |-
  **Bốn số (đo bằng máy, ngưỡng 0,80, có xét ghép hai khoá): A = 11 · B = 13 · C = 5 · D = 0.** Ghi 28/29 khoá.

  Cơ chế ở tầng đã ghim: mỗi lượt Dāsaka đi lại được tóm bằng “told them what had happened” (`2.1`, `4.1`, `6.1`)
  hoặc “He relayed the message to Khemaka, who replied:” (`3.1`, `5.1`, `8.1`), và lời nhắn thật bị bỏ trống. Bản
  lấp dịch lại lời nhắn. **Cảnh báo người đọc, ghi thẳng:** vì `3.1`/`5.1`/`8.1` đã ghim kết bằng “who replied:”,
  lời Dāsaka chen ở `3.2`–`3.5`, `5.2`–`5.5`, `8.2`–`8.9` đứng ngay sau chữ đó. Bản lấp mở mỗi lời nhắn bằng hô ngữ
  “Reverend Khemaka, the seniors say this:” để người nói không thể nhầm là Khemaka. Không sửa được lời đã ghim
  (sửa là shadow). Hạ `grammar_logic` 9,0.

  **A (11 khoá):** `3.4`, `4.4`, `6.5` (`rūpupādānakkhandho …pe… viññāṇupādānakkhandho.`), `6.4` ← `2.6`,
  `6.6` ← `5.8`, `6.7` ← `5.9`, `8.3` ← `9.3`, `8.5`–`8.7` ← `9.5`–`9.7`, `8.9` ← `9.9`.
  🔴 **Cố ý lệch luật A ở 3 khoá `3.4`, `4.4`, `6.5`:** lời đã ghim của Pāli trùng (`3.7`, `4.9`, `5.7`) **mở rộng**
  dấu lược thành đủ năm uẩn. Luật dấu lược thắng: bản lấp giữ đúng một `…` và giữ hai đầu của lời đã ghim — “the
  grasping aggregates of form … consciousness.” — nên hai cách viết khác nhau ở dấu lược chứ không ở nghĩa. Cùng
  lý do, `2.3` (B ← `1.10`, 0,91) giữ `…` trong khi `1.10` đã ghim mở rộng.

  **B (13 khoá):** `3.2`/`5.2`/`8.2` ← `1.5` (1,00); `3.3`/`4.3`/`5.3` ← `3.6` (Pāli chỉ khác chữ hoa); `3.5` ← `2.8`;
  `4.5` ← `3.8`; `5.4` ← `3.7` (giữ `…`, dấu `;` theo Pāli); `5.5` ← `4.10`+`4.11` (1,00, Pāli gộp hai khoá);
  `8.4` ← `9.4`, `8.8` ← `9.8`.

  **C (5 khoá, ghi 4):** `2.2`/`4.2`/`6.3` “Reverends, the mendicant Khemaka said this:” (dưới 40 ký tự, nhưng cần
  để biết ai nói lời kế tiếp); `14.4` nhãn thứ tự “Seventh.”. **Không lấp `6.2`** (`there bhikkhū etadavoca:`, 24 ký
  tự): lời đã ghim `6.1` đã gói phần này (“told them what had happened. They said:”), lấp thêm sẽ lặp.

  Nháy: 24/28 khoá khớp Pāli; lệch ở `8.3`, `8.4`, `8.8`, `8.9` vì lời đã ghim (`9.3`/`9.4`/`9.8`/`9.9`) chỉ giữ một
  cặp `‘I am’` trong khi Pāli có hai — theo luật A/B giữ lời đã ghim. Dấu lược: Pāli/bản lấp `2.3` 1/1, `3.4` 1/1,
  `4.4` 1/1, `5.4` 1/1, `6.5` 1/1, `8.5`–`8.7` 1/1; khác 0/0.

  Coverage: mẫu số 91; trước 73/91 = 0,8022 (sát ngưỡng), sau 91/91 = 1,0. Độ nhạy: thêm 18 khoá trống mới rớt.
  `sn22.89` **không** có record trong `content/meta/reference-gaps.yaml`.

  Triangulation ≤ 8,0: scorecard Việt của bài này (`content/meta/sutta/sn/sn22.89.yaml`) ghi `assessed_by`/`translators` thuộc **cùng họ công cụ** với lớp lấp (cùng khai trong `source/tooling.yaml`). Vì vậy bản lấp **không** phải cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root + lời Sujato đã ghim của cùng bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

  technical_integrity 9.6: lát này không được chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn nợ cho người điều phối: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
