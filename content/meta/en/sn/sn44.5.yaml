notes: |-
  Pāli y hệt `sn44.4:2.2` (`…’tipissa hoti.` thay vì `…’tipissa na hoti.`), và vế trong dấu nháy
  đã có CHỮ Sujato Y HỆT ở 1.10 và 1.16 của chính bài này: "‘a realized one neither still exists nor no longer
  exists after death.’" — 1.5 là lần đầu của cụm đó (ở nhóm `avigata…`, tức chưa sẵn sàng). Cùng cách dịch,
  cùng lý do mở ngoặc không đóng (xem `sn44.4`).

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
