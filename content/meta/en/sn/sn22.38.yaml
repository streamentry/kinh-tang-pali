notes: |-
  Lớp lấp: 5 khoá `2.14`, `2.17`, `3.4`, `3.7`, `4.6`. Cả năm là **vế thứ hai của một mệnh đề**, và
  cả năm đều lặp y hệt vế mà bản Anh đã ghim đã dịch cho sắc và thức.

  **Cặp Pāli trùng nguyên văn, dùng lại y nguyên bản đã ghim.**
  - `2.14` `tassā uppādo paññāyittha, vayo paññāyittha, ṭhitāya aññathattaṁ paññāyittha.` = `2.12`
    (đã ghim) → "its arising, vanishing, and change while persisting were evident."
  - `3.4` `tassā uppādo paññāyissati…` = `3.2` (đã ghim) → "…will be evident."
  - `4.6` khác `4.2` (đã ghim) ở `tesaṁ` thay vì `tassa` → "…is evident."

  **CHỖ PHẢI QUYẾT ĐỊNH — `tesaṁ` dịch là "their", còn `tassa`/`tassā` là "its".** `2.17`, `3.7`,
  `4.6` là vế của **các hành** (`ye saṅkhārā …`), mà `saṅkhārā` là số nhiều; `tassa`/`tassā` ở `2.14`,
  `3.4` và ở mười hai khoá đã ghim là số ít. Trong toàn bộ tầng Anh đã ghim có mười hai chỗ "its
  arising, vanishing, and change while persisting …" và KHÔNG có chỗ nào "their arising" — vì bản đã
  ghim chưa từng phải dịch vế số nhiều. Lớp lấp dùng "their" vì "its arising" với danh từ số nhiều là
  lỗi, và số của Pāli là một đơn vị ngữ nghĩa thật. Hệ quả phải nói thẳng: trong bản Anh của bài này
  đọc liền sẽ thấy its / its / their / its — không đều. Đó là hệ quả của cách lớp lấp dựng, đã được
  chọn có ý thức; nếu biên tập muốn đều tuyệt đối thì đổi ba khoá này thành "its" là một quyết định
  duy nhất, không ảnh hưởng khoá nào khác.

  **`ṭhitassa` và `ṭhitāya` dịch giống nhau.** Bản đã ghim dùng "while persisting" cho cả hai ở `2.12`
  và `4.2`, nên lớp lấp theo.

  **`2.14` và `3.4` dùng "its" chứ không phải "their"** vì `tassā` ở đây chỉ thọ (`Yā vedanā …` ở
  `2.13`/`3.3`), là số ít.

  **Bài này chưa có bản Việt trong `content/translation/vi/project/`.** Chỉ có tiêu đề
  `Dutiyaānandasutta` ở khoá `:0.3` của bản Anh đã ghim; `vietnamese_clarity` hạ vì vậy.
  `triangulation` bị chặn ở 8.0: không có bản Anh độc lập nào để đối chiếu; bốn khoá là bản sao của
  bản đã ghim trong cùng tầng. `ambiguity_integrity` hạ vì quyết định "their" ở trên là điểm biên tập
  cần nhìn lại, dù không chặn xuất bản.
