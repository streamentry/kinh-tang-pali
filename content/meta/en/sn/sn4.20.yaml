notes: |-
  2.2 (đã ghim) đã dịch trọn lời Māra; 2.3 (đã ghim) là câu hỏi của Đức Thế Tôn; 2.4 là lần Ngài DẪN
  LẠI đúng lời ấy. Pāli ở 2.4 khác 2.2 chỉ ở dấu phẩy sau `kāretu` (`kāretu sugato`), không khác nghĩa — dùng
  y hệt bản đã ghim. Pāli đóng HAI ngoặc (`dhammenā’”ti?`), bản Anh cũng phải có hai dấu đóng trước `?`.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
