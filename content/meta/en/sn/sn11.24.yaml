notes: >-
  The whole of 1.7–1.8 is the mendicants quoting the opening of the sutta back to the
  Buddha: 1.7 repeats 1.2 and 1.3 combined, and 1.8 repeats 1.4 and 1.5 combined. The fill
  therefore reuses the rendering Sujato already gave those segments — "clashed",
  "transgressed against the other", "confessed", "didn't accept" — rather than translating
  the repeated Pāli afresh.

  That decision was not free. Read in isolation, `tatreko bhikkhu accasarā` looks like
  "one of the mendicants is the more senior in learning", and `accayaṁ accayato deseti`
  looks like "he defines the term 'junior'" — which would make this a sutta about seniority
  and would have contradicted the project's published Vietnamese. It is neither: Sujato
  titles the sutta `Accayasutta` → "Transgression", and the identical clauses at 1.2–1.5
  carry the same sense. The isolated reading is a textbook instance of taking a segment out
  of context, and it is recorded here because a later translator will hit it too. The
  standing rule this establishes: a fill segment whose Pāli already appears elsewhere in
  the text must reuse the rendering given there, or the text contradicts itself.
  Triangulation is capped at 8.0.
