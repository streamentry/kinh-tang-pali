notes: |-
  Tiền lệ: 1.3 của CHÍNH bài đã có bản Anh cho tên chướng ngại — “Sensual desire, ill will, dullness
  and drowsiness, restlessness and remorse, and doubt.” — nên 1.6 lấy đúng “restlessness and
  remorse”. 1.1 và 1.8 của chính bài cho vế tính từ: “… are destroyers of sight, vision, and
  knowledge. They block wisdom, they’re on the side of distress, and they don’t lead to
  extinguishment.”

  BẤT ĐỊNH ĐÃ GHI: ở 1.7 các tính từ Pāli là SỐ ÍT (`andhakaraṇaṁ acakkhukaraṇaṁ aññāṇakaraṇaṁ
  paññānirodhikaṁ vighātapakkhiyaṁ anibbānasaṁvattanikaṁ`, chủ ngữ `vicikicchānīvaraṇaṁ` số ít) nên
  dịch số ít: “a destroyer of sight, vision, and knowledge. It blocks wisdom, it’s on the side of
  distress, and it doesn’t lead to extinguishment.” Tra `andhakaraṇaṁ acakkhukaraṇaṁ aññāṇakaraṇaṁ`
  trong toàn snapshot: chỉ 6 khoá, 5 khoá trống Anh, và khoá duy nhất có bản Anh (1.3) đã BỎ vế tính
  từ; dạng số nhiều `andhakaraṇā …` chỉ có 4 khoá, cả 4 đều là số nhiều. Nghĩa là KHÔNG có tiền lệ
  số ít cho vế tính từ này ở mọi tầng — đây là lý do hạ `terminology` và `ambiguity_integrity` xuống
  9.1.

  1.6 kết bằng `…` vì Pāli kết `…pe…`; lớp lấp không mở rộng. 1.4 và 1.5 (hai chướng ngại còn lại)
  cũng trống ở mọi tầng nhưng không thuộc b6.json nên danh sách tiếp tục bị ngắt ở dấu lược.
