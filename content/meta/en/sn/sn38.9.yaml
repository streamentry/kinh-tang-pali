notes: |-
  Khung 1.7–1.12 trùng nguyên văn sn38.1:2.7–2.12 (xem notes của sn38.6). `etissā avijjāya
  pahānāyā` → "for giving up that ignorance" khớp đúng từ đã ghim ở 1.5 của chính bài này, `avijjā` →
  "ignorance" khớp 1.1/1.2. Đây là bài trong bốn bài sn38.6–38.9 ít phải can thiệp nhất.

  Bất định đã ghi nhận:

  - 1.9 (`sammādiṭṭhi …pe… sammāsamādhi.`) trống ở mọi tầng và không thuộc lát này, nên 1.8 dừng ở
    "that is—" rồi đứt. Hạ `vietnamese_clarity`.
  - `bhaddako … bhaddikā` làm phẳng như sn38.6. `triangulation` 8.0: người viết lớp lấp cũng là người chấm.
