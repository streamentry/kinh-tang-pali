notes: |-
  BẢN LẤP NÀY KHÔNG DỊCH GÌ CẢ — NÓ DÙNG LẠI ĐÚNG CÁCH DỊCH BẢN ĐÃ GHIM.

  1) `3.4` và `3.13`: Pāli `api nu taṁ anupādāya evaṁ diṭṭhi uppajjeyya:` — Y HỆT `3.19`, chỗ bản
     đã ghim đã dịch. Ở `3.19` bản đã ghim đọc: “But by not grasping what’s impermanent, suffering,
     and perishable, would such a view arise?”. Tôi dùng lại NGUYÊN VĂN câu đó.

     Vì sao bản đã ghim lại có thêm “impermanent, suffering, and perishable” trong khi Pāli ở
     `3.19` cũng không có? Vì `…pe…` ở `3.18` (`"Aniccaṁ, bhente …pe…`) nuốt mất đúng chuỗi
     `Yaṁ panāniccaṁ dukkhaṁ vā taṁ sukhaṁ vā` → `Dukkhaṁ` → `Yaṁ panāniccaṁ dukkhaṁ
     vipariṇāmadhammaṁ`, đúng như `sn24.1:3.10–3.13`, nơi bản đã ghim dịch đủ và cho thấy `taṁ`
     là “cái vô thường, có khổ, có sinh diệt”. `3.3` và `3.12` có CÙNG một `…pe…`, nên `taṁ`
     ở `3.4` và `3.13` cũng chỉ là form và ý thức — cùng nghĩa với `3.19`.

     Tôi cũng đối chiếu 5 chỗ khác trong tầng Anh đã ghim có Pāli TRẦN y hệt (không tiền tố
     `Yaṁ panāniccaṁ`): `sn24.10:2.9`, `sn24.36:3.14`, `sn24.3:3.19`, `sn24.7:3.19`,
     `sn24.8:3.10` — cả năm đều được dịch y hệt `3.19`. Đó là mẫu của bản đã ghim cho đúng
     chuỗi Pāli này, không phải lựa chọn của tôi.

  2) `3.6`, `3.15`, `3.22`: Pāli kết bằng `kāyassa bhedā ucchijjanti vinassanti na honti paraṁ
     maraṇā’”ti?` — Y HỆT `1.12`, và bản đã ghim đã dịch `1.12`. Tôi dùng lại nguyên văn
     “Both the foolish and the astute are annihilated and destroyed when their body breaks up, and
     don’t exist after death’?”.

     Ba khoá này khác `2.3`/`2.9` ở dấu câu: `2.3`/`2.9` khép bằng `’ti.` (một dấu nháy +
     chấm) nên bản đã ghim đọc `…death.’`, còn `3.6`/`3.15`/`3.22` khép bằng `’”ti?` (hai
     dấu nháy + dấu hỏi) nên phải là `…death’?”`. Số dấu nháy theo đúng Pāli của từng khoá.

     “Both the foolish and the astute” lấy từ đâu khi Pāli `3.6`/`3.15` không có `bāle ca
     paṇḍite ca`? Nó nằm trong `…pe…` của `3.5`/`3.14`. Bằng chứng: `3.21`–`3.22` lộ nguyên
     văn `ye keci atthikavādaṁ vadanti; bāle ca paṇḍite ca kāyassa bhedā ucchijjanti…`, và cả ba
     `3.5`/`3.14`/`3.20` đều mở đúng bằng `‘natthi dinnaṁ, natthi yiṭṭhaṁ`. Bản đã ghim cũng
     tự làm y như vậy ở `2.3`/`2.9`, nơi Pāli khoá cũng không có `bāle ca paṇḍite ca` mà bản
     đã ghim vẫn viết “Both the foolish and the astute”. Thiếu chủ ngữ thì câu ở `3.6`/`3.15` sẽ
     mở đầu không chủ thể, nên đây không phải lựa chọn dịch mà là điều kiện để câu đúng ngữ pháp.

  BẤT ĐỊNH CÒN LẠI (không chặn): `3.4` khép câu hỏi bằng `?”`, và `3.6` lại khép bằng
  `’?”`. Vế đóng thừa là do bản đã ghim đóng sớm ở `3.19` (vì `3.20`/`3.21` trống) rồi `3.22`
  lại mang dấu đóng của chính nó; tôi giữ nguyên vì sửa `3.4` thành `… arise:` sẽ lệch với
  chính `3.19` ngay dưới nó. Mẫu dấu `?’”` kép này đã có sẵn trong lớp lấp: `sn24.19:3.14`
  (bản đã ghim) + `3.15` (lớp lấp) cho đúng hình dạng này.

  Lớp lấp: 5 khoá nằm ở chỗ bản Anh đã ghim để trống, không phải ở phần nguyên văn bị mất.
  `3.7`/`3.16` (`"No hetaṁ, bhente"`) cũng trống nhưng không thuộc lát này. Triangulation bị
  chặn ở 8.0 vì không có bản Anh độc lập nào để đối chiếu.
