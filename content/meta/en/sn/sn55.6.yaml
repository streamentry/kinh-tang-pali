notes: |-
  **Phân loại 34 khoá: A = 20 · B = 11 · C = 3 · D = 12.**

  - **D (12) — báo, không hoà tầng ghim:** Pāli `Yadā pana mayaṁ, bhante, bhagavantaṁ suṇāma:` xuất hiện ở
    7 khoá có chữ; Sujato dịch “And when we hear that” ở 6 khoá (`4.4`, `5.1`, `5.4`, `6.1`, `9.4`, `13.4`) và
    “But when we hear that” ở `9.1` (chỗ chuyển từ “xa” sang “gần”). 12 khoá lấp (`6.4`, `7.1`, `7.4`, `8.1`,
    `8.4`, `10.1`, `10.4`, `11.1`, `11.4`, `12.1`, `12.4`, `13.1`) đều không phải chỗ chuyển ⇒ dùng “And when we
    hear that”. 12 khoá này **cũng** được tính trong A.
  - **A (20):** 12 khoá trên; `6.3`, `7.3`, `8.3` = `4.3`; `6.6`, `7.6` = `4.6`; `10.3`, `11.3`, `12.3` = `9.3`.
  - **B (11):** `6.5`, `7.5`, `10.5`, `11.5`, `12.5` dựng từ `5.5`/`13.2` (0,82–0,91), đổi tên xứ theo Pāli và
    **không** chép dấu `…` mà Sujato tự thêm ở `6.2`, `7.2`, `9.5`, `10.2`… (Pāli viết đủ); `9.6`–`12.6` từ `13.6`
    (Pāli không có `”`); `1.6` từ `1.2` (0,67), `1.7` từ `1.3` (1,00), giữ lời trực tiếp.
  - **C (3):** `17.3`/`18.2` (khuôn `itipi so bhagavā …pe…` → “That Blessed One is … teacher of gods and
    humans, awakened, blessed.”, giữ đúng một `…`), nhãn `18.11` “Sixth.”.
  - **Ngoặc — lệch có chủ đích ở 17 khoá:** Pāli đặt các ý nghĩ `‘dūre no bhagavā …’ti`, `‘… pakkanto’ti` trong
    nháy đơn (mỗi khoá 1 mở/1 đóng); tầng đã ghim dịch **toàn bộ** chuỗi `4.x`–`13.x` thành lời gián tiếp “we hear
    that you …”, không nháy. Lớp lấp theo quy ước ấy (0/0) để không lệch với 19 khoá anh em đã ghim. Hai số:
    Pāli 17 mở/17 đóng, lớp lấp 0/0. `1.6`/`1.7` thì giữ nháy đúng Pāli (lời trực tiếp).

