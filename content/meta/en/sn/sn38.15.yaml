notes: |-
  Năm khoá của lát này là MỘT khuôn năm vế — hỏi, trả lời, xác nhận, khen, dặn —
  và khuôn ấy lặp nguyên vẹn ở bảy bài kế bên trong `Jambukhādakavagga` (`sn38.4`,
  `sn38.5`, `sn38.10`–`sn38.15`), chỉ khác đúng danh từ. Cả tám bài phải dùng CÙNG một
  bộ năm câu, nếu không thì cùng một vế Pāli sẽ mang hai cách dịch trong cùng một
  `Jambukhādakavagga`. Riêng bài này là bài DUY NHẤT dùng số ít: `etassa sakkāyassa`
  ("hữu thân ấy"), nên danh từ là `this substantial reality` chứ không phải "these …".

  - `1.8` ← khuôn của `1.6`: bản đã ghim hỏi "is there a path and a practice for completely
    understanding this substantial reality?", nên `1.8` hỏi lại đúng bằng cụm đó.
  - `1.9`, `1.11`, `1.12` dùng y "completely understanding this substantial reality". Giữ
    đúng từ "substantial reality" của bản đã ghim ở `1.1`–`1.6`, KHÔNG dùng "the five
    grasping aggregates" (bản Việt: "năm thủ uẩn"), vì `1.8` hỏi lại đúng câu ở `1.6` và
    hai cách gọi khác nhau cho cùng một vế sẽ làm cột Anh tự mâu thuẫn.
  - `1.13` `Alañca panāvuso sāriputta, appamādāyā` → "And, reverend Sāriputta, don’t be
    heedless." Không theo `an3.71:5.8` của cùng người dịch ("Just this much is enough for
    diligence"), vì ở đó `appamādāyā` bị đọc thành câu định lượng, còn ở đây Pāli là
    lời dặn trực tiếp.

  BẤT ĐỊNH ĐÃ PHÂN XỬ, ghi ra để không ai phải phân xử lại:

  1. `sakkāya` là điểm mấu chốt của cả bài và bản Anh đã ghim đã chọn "substantial reality"
     (một cách dịch khá hiếm, vì `sakkāya` còn đọc là "hiện hữu thực tại"). Tôi giữ nguyên
     lựa chọn ấy ở năm khoá mới, vì nếu đổi sang "the five grasping aggregates" thì bản Việt
     và bản Anh sẽ dùng hai danh từ khác nhau cho cùng một vế Pāli mà `1.3`–`1.6` đã đặt
     sẵn. Đây là quyết định bám tầng đã ghim, không phải đánh giá riêng từ này.
  2. Pāli ở đây là `pariññāyā`, nên "completely understanding" là dịch đúng nghĩa. Với các
     bài dùng `pahānāyā` (`sn38.10`–`sn38.12`) thì đó là đánh đổi có chủ ý đã ghi ở file
     kia.
  3. `Bhaddako … bhaddikā` ("tốt … tốt hơn") dịch "good … better", không theo "a fine path,
     a fine practice" của `an3.71:5.7`: `bhaddikā` là dạng so sánh.
  4. `seyyathidaṁ—` ở `1.9` giữ nguyên gạch nối, vì khoá kế `1.10`
     (`sammādiṭṭhi …pe… sammāsamādhi.`) bản Anh đã ghim để trống. Mở rộng nó là bịa.
  5. Dấu ngoặc kép mở ở `1.9` và khép lại ở `1.13`, y như Pāli `“Ayameva … appamādāyā”ti.`

  Lớp lấp: 5 khoá `1.8`, `1.9`, `1.11`, `1.12`, `1.13` nằm ở chỗ bản Anh đã ghim để
  trống. `1.10` cũng trống nhưng là đoạn lược dài 31 ký tự nên nằm ngoài lát này, và tôi
  không mở rộng nó. `1.14` (`Pannarasamaṁ.`) là số đếm, không tính vào lát. Không khoá nào là
  blockquote tham chiếu: bài này chỉ có khối `:0`, và Sujato đã dịch cả `:0`.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm. Tầng đối chiếu là
  Pāli đã ghim, các khoá `1.1`–`1.7` của chính bản Anh đã ghim, cùng khuôn Pāli giống
  hệt mà Sujato đã dịch ở `an3.71:5.1`–`5.8`; bản Việt dự án chỉ để đối chiếu nghĩa và do
  agent khác viết, không phải một lớp đọc Anh độc lập.

