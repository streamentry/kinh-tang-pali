notes: |-
  3.4 trùng NGUYÊN VĂN 2.6 và 4.5 đã ghim ("Aren’t they understood by seeing them with
  wisdom?”), nên dùng lại y nguyên; chốt in cảnh báo trùng Pāli ở cả hai khoá kia.

  3.2 là câu đối xứng của 2.4 và 4.3 đã ghim, khác nhau đúng một vế
  (`bhikkhu cakkhunā rūpaṁ disvā` ↔ `jivhāya rasaṁ sāyitvā`, và `. Api` ↔ `; api`) — nên
  hai khoá kia dùng MỘT câu tiếng Anh duy nhất cho cả ba. Bản lấp dùng lại y nguyên câu
  ấy. Hệ quả phải nói thẳng: bản Anh ở 3.2 KHÔNG lặp lại hai vế `atthi me … pajānāti`
  và `asantaṁ vā … pajānāti` mà Pāli 3.2 có, vì bản đã ghim cũng đã lược chúng ở 2.4 và 4.3
  (chúng đã được 2.2–2.3 và 4.1–4.2 nói trước đó). Cột Pāli vẫn hiện đủ. Vì đây là nén
  theo quy ước của bản đã ghim chứ không phải bỏ ý, `semantic_fidelity` và
  `ambiguity_integrity` hạ.

  3.6 ghép 4.7 và 4.8 (cả hai đã ghim) thành một khoá. Một khác biệt kỹ thuật có chủ ý:
  4.8 đã ghim dùng dấu nháy thẳng `"` cho lớp trong, vì 4.7 và 4.8 là hai khoá riêng và mỗi
  khoá có ngân sách ngoặc riêng; 3.6 là MỘT khoá nên Pāli có ba ngoặc mở (`“ ‘ “`) và hai
  ngoặc đóng, và bản lấp phải viết ngoặc cong `‘ “ ” ’` để khớp, nếu không sẽ lệch số.

  `pariyāyo` = "a method", `paññāya disvā` = "seeing them with wisdom", `saddhāya /
  ruciyā / anussavena / ākāraparivitakkena / diṭṭhinijjhānakkhantiyā` = "faith,
  endorsement, oral transmission, reasoned train of thought, acceptance of a view after
  deliberation" — cả năm lấy nguyên từ 1.1, 2.4 và 4.7 đã ghim. `triangulation` 8.0 là đặc
  thù của lớp lấp; `vietnamese_clarity` và `han_viet_balance` là giá trị mặc định của lớp.
