  **Thuật ngữ — bám đúng lời tầng ghim của chính bài này.** `rūpī` → "formed" · `arūpī` →
  "formless" · `neva rūpī nārūpī` → "neither formed nor formless" (Sujato dịng y hệt vậy ở `dn1` cho
  cùng danh sách) · `ekantasukhī` → "absolutely happy" và `ekantadukkhī` → "absolutely suffering"
  (đúng tiêu đề tầng ghim `sn24.41:0.3` "The Self Is Absolutely Happy" và `sn24.42:0.3` "Absolutely
  Suffering") · `sukhadukkhī` → "happy and suffering" (theo `sn24.43:0.3`) · `adukkhamasukhī` →
  "neither happy nor suffering" (theo `0.3` và `1.1` của chính bài này). `bhikkhave` → "mendicants",
  `bhante` → "sir", `abhinivissa` → "insisting on", `anupādāya` → "without grasping", `…pe…` giữ
  nguyên một dấu lược. `mahādiṭṭhena aṭṭhamaṁ` ở `4.4` dịch "seen with great insight, the
  eighth." vì `Adukkhamasukhīsutta` (tức bài này, `0.3`) là **tám** trong mười kiến chếp về tự thân
  ở `6.1`–`7.4`, nên `aṭṭhamaṁ` ở đây là số thứ tự của kiến chế, không phải của bài.

