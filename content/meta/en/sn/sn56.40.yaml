notes: |-
  1.7 có PĀLI GIỐNG HỆT 1.3, mà bản đã ghim đã dịch 1.3 thành “However
  ‘I’ll refute their doctrine!’ …” — chính xác là: “‘I’ll refute their doctrine!’ It’s
  simply impossible for them to legitimately make that mendicant shake or rock or
  tremble.” Luật 3 của lớp: dùng lại y nguyên, không dịch lại.

  1.6 và 2.10 là hướng NAM (`dakkhiṇāya`) trong danh sách bốn hướng mà Sujato đã GỘP vào
  1.2 và 2.7 (“might come from the east, west, north, or south wanting to debate, seeking
  a debate, thinking:”). Vì đã gộp, bản đã ghim không có câu riêng cho hướng nam, nên
  tôi dựng lại từ Pāli nhưng bám nguyên bộ danh từ của 1.2/2.7:
    `vādatthiko vādagavesī` → “wanting to debate, seeking a debate, thinking” (nguyên văn
        bản đã ghim 1.2);
    `samaṇo vā brāhmaṇo vā` → “an ascetic or brahmin” (nguyên văn bản đã ghim 1.2);
    `…ṁ vāti—netaṁ ṭhānaṁ vijjati` → “It’s simply impossible for them to legitimately
        make that mendicant shake or rock or tremble” (nguyên văn bản đã ghim 1.3).

  Khác biệt giữa 1.6 và 2.10 có chủ ý: 1.6 là khoá tiếp nối trong danh sách nên viết
  thường, không có mệnh đề dẫn nhập lại; 2.10 mở đầu một mục riêng nên viết hoa và có
  dấu phẩy. Cả hai giữ `cepi` theo cách lặp của bản đã ghim ở 2.3 (hướng bốn phương được
  giữ đủ). Bài không có bản Việt dự án.

  Bất định: bản đã ghim đã gộp bốn hướng, nên 1.4–1.7 và 2.8–2.10 (bốn khoá không thuộc
  lát này, vẫn trống) sẽ lặp lại cấu trúc của 1.6/1.7/2.10. Người biên tập cần dịch
  nốt bốn khoá đó theo đúng khuôn này, nếu không bài sẽ đọc lệch.
