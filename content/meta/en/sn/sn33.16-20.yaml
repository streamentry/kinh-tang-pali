notes: |-
  Ba khoá rải ở hai bài trong tệp gộp (sn33.16 và sn33.20):

    - sn33.16:1.2 (`Ekamantaṁ nisinno kho vacchagotto paribbājako bhagavantaṁ
      etadavoca—`) dùng nguyên văn "Then the wanderer Vacchagotta said to the Buddha:",
      vì cùng Pāli đó đã được Sujato dịch 5 lần (sn33.2, 3, 4, 5, 6-10 đều ở 1.2).
      Pāli ở đây kết bằng `—` còn bản ghim kết bằng `:`; Sujato cũng vậy ở sn33.1:1.4
      (`…uppajjanti—` → "…That is:"), nên bản lấp theo bản ghim.
    - sn33.16:1.3 dùng lại bộ từ "What is the cause, worthy Gotama, what is the reason"
      của sn33.1:1.4 và sn33.6-10:1.3. Pāli ở 1.3 không có dấu mở ngoặc nào (dấu `“` của
      lời thoại chỉ mở ở 1.4), nên bản lấp cũng không mở — khác hai khoá kia, và đó là
      hệ quả của chốt đếm theo từng khoá chứ không phải lựa chọn riêng.
    - sn33.20:1.3 (`viññāṇanirodhagāminiyā paṭipadāya ananubodhā …pe…`) dịch thành
      "because of not understanding the practice that leads to the cessation of
      consciousness …". Tiền lệ từng từ: `ananubodhā` → "not understanding" (Sujato
      dùng đúng vậy ở sn33.16:1.4), `Xgāminiyā paṭipadāya` → "the practice that leads to
      the cessation of …" (121 lần trong tầng).

  Bất định đã ghi nhận:

    - Ở sn33.20:1.3 có thể chọn hình thức danh sách như Sujato làm ở sn33.6-10:1.11
      ("…and the practice that leads to its cessation …"), nhưng như vậy sẽ mất `ananubodhā`
      và mất quan hệ nhân quả đã mở ở 1.2. Bản lấp giữ dạng nhân quả. Đây là lựa chọn có
      thể đảo ngược, nên `ambiguity_integrity` hạ 9.2.
    - Bản ghim ở sn33.20:1.2 chỉ có "consciousness …”" và bỏ mất cả mệnh đề nhân quả; 1.4
      ("vīsatimaṁ") trống và dưới ngưỡng nên không thuộc lớp lấp. Cột English của sn33.20
      vì vậy vẫn thiếu mệnh đề "it is because of".
    - Bản Việt của dự án dịch sn33.20:1.3 là "vì không thấy biết con đường đưa đến sự chấm
      dứt của thức" — trùng nghĩa với bản lấp. Lưu ý bản Việt dùng "thấy biết" cho
      `ananubodhā` còn Sujato dùng "understanding"; bản lấp theo Sujato và ghi lại ở đây.
    - Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của
      lớp lấp. `triangulation` bị chặn ở 8.0 vì không có bản Anh độc lập.
