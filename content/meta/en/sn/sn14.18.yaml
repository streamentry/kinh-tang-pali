notes: |-
  BẢN LẤP NÀY KHÔNG DỊCH GÌ CẢ — NÓ DÙNG LẠI ĐÚNG CÁCH DỊCH BẢN ĐÃ GHIM.

  Lớp lấp: 5 khoá `2.2`–`2.6`, là phần "hiện tại" (`Etarahipi kho … paccuppannaṁ addhānaṁ`) mà bản
  Anh đã ghim đã lược. Sáu vế của nó **trùng nguyên văn** với sáu vế ở `1.3`–`1.8`, và cả sáu vế ở
  `1.3`–`1.8` đều đã được bản đã ghim dịch. Nên lớp lấp lấy y nguyên văn, chỉ ghép lại:

  - `2.2` = `1.3` → "the faithless with the faithless,"
  - `2.3` = `1.4` + `1.5` ghép trong MỘT khoá (Pāli có dấu phẩy nối, không phải dấu chấm) →
    "the unconscientious with the unconscientious, the witless with the witless;"
  - `2.4` = `1.6` → "the faithful with the faithful,"
  - `2.5` = `1.7` → "the conscientious with the conscientious,"
  - `2.6` = `1.8` → "and the wise with the wise."

  **Dấu câu ở `2.3` là dấu chấm phẩy, không phải dấu phẩy.** Pāli `2.3` kết bằng `;` còn `1.4` và
  `1.5` kết bằng `;` từng vế — bản đã ghim dùng dấu phẩy cho các vế giữa danh sách. Vế cuối của một
  danh sách trong bản đã ghim đóng bằng dấu chấm (`1.8`: "and the wise with the wise."; `3.7` cũng
  vậy), nên `2.3` — vốn là vế giữa — ghép hai vế bằng dấu phẩy và khép bằng dấu chấm phẩy theo hình
  thức Pāli. `2.6` khép bằng `samentīti` (`iti` báo lời trích) nên mang dấu chấm như `1.8`.

  **Sáu vế ở `2.2`–`2.6` khác sáu vế ở `3.2`–`3.7` Ở MỘT CHỖ, và đó là chỗ đã ghim, không phải chỗ
  lớp lấp.** `3.3` là `anottappino` (bản đã ghim: "the imprudent") trong khi `1.4`/`2.3` là `ahirikā`
  ("the unconscientious"). Lớp lấp KHÔNG đồng nhất hoá hai danh sách: mỗi danh sách phải đúng với
  Pāli của nó.

  **Bài này chưa có bản Việt trong `content/translation/vi/project/`.** Chỉ có tiêu đề
  `Assaddhamūlakasutta` ở khoá `:0.3` của bản Anh đã ghim; `vietnamese_clarity` hạ vì vậy.
  `triangulation` bị chặn ở 8.0: năm khoá đều là bản sao của bản đã ghim trong cùng tầng, không có
  bản Anh độc lập nào để đối chiếu, nên không được hiểu là đã đối chiếu chéo bằng tiếng Anh.
