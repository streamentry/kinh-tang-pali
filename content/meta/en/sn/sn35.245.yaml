  Độ nhạy: bài có 59 khoá substantive; ngưỡng 0,8 chịu được tối đa 11 khoá vắng English. Trước lát thiếu 21 (cần ít nhất 10 khoá lấp để chạm 0,8). Lớp lấp chỉ tính khi `published` (`draft`/`review` thì coverage giữ nguyên 0,6441).

