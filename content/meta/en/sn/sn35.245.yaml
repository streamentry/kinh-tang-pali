notes: |-
  **Phân loại 29 khoá (đo bằng máy, mỗi khoá một nhóm): A y nguyên = 18 · B dựng lại = 3 · C tự dịch = 6 · D (Pāli trùng, lời Anh của tầng đã ghim khác nhau) = 2.** Đã ghi 29/29 khoá `fillableSegments` của bài (21 khoá có nội dung ≥ 40 ký tự Pāli, 8 khoá ngắn hơn ngưỡng). Số khoá Sujato để trống mà lát **không** lấp: 0.

  **Bài này có ba nhóm khoá, đều trùng Pāli với khoá đã có lời.**
  **Nhóm 1 — lặp lời hỏi và lời đáp ở phần các tỳ-kheo (`2.2`, `3.1`, `3.2`, `4.1`, `4.2`).** Tầng đã ghim viết `2.1` “Not content with that answer, that
  mendicant went up to a series of other mendicants and received the following answers:” và dùng nó **cho cả một chuỗi**; ba khoá `2.1`/`3.1`/`4.1` có Pāli
  giống nhau từng chữ. `3.1`, `4.1` dùng lại nguyên văn `2.1`; `2.2`, `3.2`, `4.2` dùng nguyên văn `1.2` (“Reverend, at what point is a mendicant’s
  vision well purified?”). Chọn dùng lại nguyên văn (luật A) dù “a series of other mendicants” là lời tóm cả chuỗi chứ không mô tả riêng từng lượt.
  **Nhóm 2 — lời tường thuật lại với Đức Phật (`5.2`–`5.11`).** `5.2`, `5.6` (Pāli `‘kittāvatā …’ti?`) và `5.4` (Pāli `‘yato kho, āvuso, … channaṁ phassāyatanānaṁ …’ti`) là các lời đã ghim ở `1.2`, `1.3`
  trong dấu “ ” kép; ở đây Pāli dùng ‘ ’ đơn nên đổi nháy kép → đơn: ‘Reverend, at what point is …?’ (nguyên văn trừ nháy) và ‘When a mendicant truly understands the
  origin and disappearance of the six fields of contact, at that point their vision is well purified.’. `5.3`, `5.7` “When this was said, sir, that mendicant said to me:”. `5.5` (B, 0,93 với `2.1`): “Not content with that answer, sir, I went up to another
  mendicant and said to him:” — bỏ “a series of other mendicants” của `2.1` vì Pāli `5.5` nói **một** vị tỳ-kheo (`yenaññataro bhikkhu`). **`5.8`–`5.10` rất cô đọng:**
  Pāli viết `pañcannaṁ upādānakkhandhānaṁ …pe…` / `catunnaṁ mahābhūtānaṁ … pajānāti …pe…` / `yaṁ kiñci samudayadhammaṁ … pajānāti, ettāvatā …`; bản lấp **không mở rộng** phần `…pe…`,
  chỉ dịch những gì có mặt trong từng khoá: `5.8` “‘When a mendicant, with regard to the five grasping aggregates …”, `5.9` “truly understands the origin and disappearance of the four principal
  states …”, `5.10` (B, 0,92 với `4.3`) “truly understands that everything that is liable to arise is liable to cease, at that point their vision is well purified.’”. Ba khoá này đọc nối tiếp
  cứng nhưng đúng với Pāli. `5.11` giữ nguyên dấu `(…)` của Pāli: “Not content with that answer, sir, I went up to the Buddha (…).”
  **Nhóm 3 — ví dụ người đi hỏi cây kiṁsuka (`7.2`–`7.13`) và người giữ cổng (`8.11`–`8.13`).** `7.2`, `7.7`, `7.12` dùng `6.3`; `7.3`, `7.8`, `7.13`, `8.12` dùng `6.4`/`8.5` (cùng “They’d say,”);
  `7.6`, `7.11` dùng `7.1`; `8.11` (B, 0,88 với `8.4`) dùng `8.4` vì Pāli chỉ bỏ chữ `nagarassa`; `8.13` dùng `8.6`. **`7.5` và `7.10` là nhóm D**: Pāli của chúng
  trùng với `6.6` (“… may well have been just as that person saw it.”, số ít) và với `7.15` (“… at each of those times … just as those people saw them.”, số nhiều, câu tổng kết). Chọn `6.6` vì
  ở `7.5`/`7.10` mỗi lần chỉ có **một** người nói (đúng bối cảnh `6.6`); `7.15` là câu khép cả ba người. **`9.13`** nhãn `Aṭṭhamaṁ.` → “Eighth.”.

  Bảng B theo máy (khoá lấp←khoá nguồn, tỉ lệ khớp Pāli): `5.5`←`2.1` 0,93; `5.10`←`4.3` 0,92; `8.11`←`8.4` 0,88.
  Nhóm D theo máy: `7.5`, `7.10` — đã nêu cách chọn ở trên, **không** tự hòa các lời khác nhau của tầng đã ghim.

  Nháy: 0/29 khoá lệch Pāli; `5.2`, `5.4`, `5.6` đổi “ ” của lời Sujato thành ‘ ’ cho khớp Pāli.
  Dấu lược: 3/29 khoá lấp có `…`/`…pe…` ở Pāli; đo từng khoá, số `…` của English bằng số `…` của Pāli (`…pe…` tính một), 0 khoá lệch; không mở rộng chỗ nào.

