notes: |-
  2.4/2.5 trùng cấu trúc với 1.3/1.4, chỉ khác tên dhātu. Sujato dịch 1.3 (drawback): "I went in
  search of the earth element’s drawback, and I found it. I’ve seen clearly with wisdom the full
  extent of the drawback in the earth element." và 1.4 (escape): "I went in search of escape from
  the earth element, and I found it. I’ve seen clearly with wisdom the full extent of escape from
  the earth element." → dùng lại y hệt với "the air element", đúng cách Sujato gọi `vāyodhātu`
  ở 2.1–2.3.

  Ghi chú về chỗ chưa có tiền lệ: 2.1/2.2/2.3 đều bị Sujato lược, nên "air element" được xác
  nhận từ chính 2.1–2.3 của bài này chứ không phải từ bài khác.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
