notes: |-
  **Phạm vi thật của lát — đo, không kế thừa tiền đề.** Bài này thuộc **`10. Saḷavagga`** (`Paṭhamanatumhākasutta`,
  "It's Not Yours (1st)"), **không** phải `8. Gilānavagga`. Chữ số `8.` trong các khoá `8.1`–`8.10` là **số khối
  trong chính bài** (khối tổng kết), không phải số hiệu vāgga — đây là chỗ dễ nhầm nhất của lát này. Đo lại trong
  cùng `10. Saḷavagga`: `sn35.102` (`Dutiyanatumhākasutta`) là bài kế, có **4** khoá trùng nguyên văn cụm
  `Taṁ vo pahīnaṁ hitāya sukhāya bhavissati.` và **1** khoá trùng nguyên văn `Te vo pahīnā hitāya sukhāya
  bhavissanti.`; nhưng **không** khoá nào trùng nguyên văn `So vo pahīno …` (khoá `1.15` của nó mang thêm
  `…pe…`). `sn35.95` (`Mālukyaputtasutta`, 181 khoá) cùng vāgga nhưng dạy về tỉnh thức, **không** phải văn song
  parallel.
  **Bài song parallel thật sự đo được là `sn35.138`** — cùng tên `Paṭhamanatumhākasutta`, ở `14. Devadahavagga`,
  24 khoá, và là bản **văn xuôi** của cùng bài giảng này. Nó trùng nguyên văn `sn35.101` ở các khoá
  `“Yaṁ, bhikkhave, na tumhākaṁ, taṁ pajahatha.` · `Kiñca, bhikkhave, na tumhākaṁ?` · `Taṁ vo pahīnaṁ …` ·
  `So vo pahīno …` · `‘amhe jano harati vā ḍaheyya…’` · `“No hetaṁ, bhante”.` · `“Taṁ kissa hetu”?` ·
  `“Na hi no etaṁ…attaniyaṁ vā”ti.`. Bản đó **cũng thủng**: `1.7` và `1.18` (`Sā vo pahīnā …pe…`) để trống.
  Cụm số nhiều `Te vo pahīnā … bhavissanti.` có tiền lệ ghim **bài khác** là `sn35.139:1.11`
  (`14. Devadahavagga`), được dùng ở nhóm B.

  **Bốn nhóm, đo trước khi viết.** Quy tắc đo: **A** = Pāli **trùng từng byte** với một khoá **trong cùng bài**
  đã có lời ở tầng ghim; **B** = không trùng byte, nhưng khớp một khoá đã có lời ở tầng ghim với tỉ lệ ≥ 0,80
  (đo bằng một phép duy nhất: đối chiếu chuỗi đã bỏ mọi ký tự không phải chữ/số, hạ chữ thường, `ṁ`→`ṃ`);
  **C** = không có tiền lệ nào trong bài; **D** = trùng byte mà lời ghim khác nhau.
  - **A = 6**: `1.12` · `2.9` · `3.9` (trùng byte `1.2`/`1.6`/`1.18`/`3.15`) · `1.15` · `2.12` · `3.12`
    (trùng byte `3.3`). Cả sáu chép **nguyên văn** lời đã ghim, không dịch lại.
  - **B = 12**: `1.9` (0,925 với `1.18`) · `2.6` (0,925) · `3.6` (0,925) · `2.3` (0,939 với `3.3`) ·
    `2.4` (0,846 với `1.7`) · `2.7` (0,780 với `1.10`; 0,824 với `2.1`) · `2.10` (0,809 với `1.13`) ·
    `2.13` (0,950 với `1.16`) · `2.14` (0,835 với `8.3`) · `8.4` (1,000 với `1.7`) ·
    `8.5` (0,727 với `1.10`) · `8.6` (0,732 với `1.13`).
  - **C = 18**: 16 khoá mệnh lệnh `Taṁ pajahatha.` / `Te pajahatha.` + `1.19` (`…pe…`) + `8.10` (`Aṭṭhamaṁ.`).
  - **D = 1 nhóm** (xem mục riêng bên dưới).

  **Nhóm B — khoá nguồn, tỉ lệ, và phần chèn lại.**
  - `1.9`/`2.6`/`3.6` ← `1.18` (0,925) + tiền lệ **trùng byte ở bài khác** `sn35.139:1.11`. Số nhiều là bắt
    buộc: `Te … pahīnā … bhavissanti` là số nhiều ở cả chủ ngữ và động từ, nên *"Giving **them** up…"*. Khớp đúng
    với lớp lấp đã `published` của bài anh em `sn35.102:1.9` (cùng Pāli, cùng cách dịch).
  - `2.3` ← `3.3` (0,939): `Sā … pahīnā` là số ít (chủ ngữ `Jivhā` ở `2.1` là giống cái) ⇒ *"Giving it up…"*,
    y hệt `1.2`.
  - `2.4` ← `1.7` (0,846): `Rūpā`→"Sights" ⇒ `Rasā`→"Tastes". Đo toàn tầng đã ghim cho `rasa*`: **"taste" 220**
    khoá, **"flavor" 69** ⇒ chọn **tastes**. Chốt lựa chọn số nhiều theo đúng cách tầng ghim làm với
    `Rūpā`/`Dhammā` ở `1.7`/`3.4`.
  - `2.7` ← `1.10` "Eye consciousness …" + `3.7` "Mind consciousness …"; `2.10` ← `1.13` "Eye contact …" +
    `3.10` "Mind contact …". Xương từ lấy nguyên từ tầng ghim trong chính bài này.
  - `2.13` ← `1.16`/`3.13` (0,950): chép nguyên văn *"The pleasant, painful, or neutral feeling that arises
    dependent on … isn’t yours: give it up."*, chỉ thay "eye"→"tongue" (và "mind"→"tongue" ở `3.13`); đo từ
    khoá chung với hai bản ghim: cả **8/8** từ khoá (pleasant · painful · neutral · feeling · arises ·
    dependent · contact · give it up) đều có ở cả `1.16`, `3.13` **và** `2.13`.
  - `2.14` = `Taṁ pajahatha.` (mệnh lệnh, chèn lại) + `Taṁ vo pahīnaṁ hitāya sukhāya bhavissati.` (trùng byte
    `1.2`) + dấu lược mà tầng ghim đã nuốt.
  - `8.4` ← `1.7` (1,000 sau khi bỏ dấu lược): lấy nguyên văn "Sights" rồi ghi dấu lược **vì Pāli `8.4` có thật**.
  - `8.5`/`8.6` **dưới** ngưỡng 0,80 (0,727 / 0,732) nhưng có tiền lệ ghim **trùng byte ở bài khác**:
    `sn35.91:1.6` và `sn35.80:6.6` → "eye consciousness …" (2 khoá); `sn35.89:9.3` → "eye contact …" (2 khoá).
    Chữ thường ở đầu câu là theo đúng Pāli (`cakkhuviñāṇaṁ`, `cakkhusamphasso` viết thường vì nối tiếp danh sách
    `8.4`–`8.6`) và đúng cả bốn tiền lệ ghim vừa dẫn.

  **Số cặp Pāli trùng đã dò toàn tầng.** Dựng chỉ mục Pāli→danh sách khoá trên toàn bộ tầng Anh đã ghim của `sn`:
  **1.819** tệp, **26.164** chuỗi Pāli phân biệt, **4.791** nhóm trùng nguyên văn, tức **361.618** cặp trùng byte.
  Trong đó **24** nhóm có chứa một khoá của `sn35.101`. Ở phạm vi **gần** (cùng `sn35`) lớp lấp dùng lại **6** khoá
  nguyên văn; ở phạm vi **toàn tầng** cũng **6** — hai số bằng nhau, vì `sn35.138`/`sn35.139` là văn xuôi nên ở các
  khoá trùng byte chúng vẫn cắt đoạn khác đi.
  Ba ngoại lệ đáng ghi: `Sā vo pahīnā hitāya sukhāya bhavissati.` của `2.3` trùng byte ở **3** bài khác
  (`sn35.138:1.7`, `sn35.138:1.18`, `sn22.33:1.8`, `sn22.33:2.10`) nhưng **cả bốn** khoá đó đều **để trống** ở tầng
  ghim — đó là lý do `2.3` buộc phải dựng từ cặp song song **trong bài** là `3.3` chứ không có tiền lệ chép nguyên
  văn nào ở nơi khác. Tương tự, `Te vo pahīnā … bhavissanti.` trùng byte ở `sn22.33:1.11` nhưng khoá đó để trống.

  **Nhóm C — không có lời nào ở tầng, nhưng từ khoá vẫn có căn cứ đo được.**
  - 16 mệnh lệnh `Taṁ pajahatha.` / `Te pajahatha.`: đo toàn tầng Anh đã ghim, **không** có khoá nào dịch
    đứng riêng hai Pāli này (0/1.819 tệp). Nhưng tầng ghim **gộp** chúng vào khoá trước: đo trong chính bài này
    có **6** khoá ghim đã mang sẵn "give it up" cho khoá lấp kế tiếp (`1.4`→`1.5`, `1.16`→`1.17`, `3.1`→`3.2`,
    `3.13`→`3.14`, `8.1`→`8.2`, `8.7`→`8.8`). Vì vậy lớp lấp dùng đúng hai từ khoá đó: `Taṁ pajahatha.` →
    *"Give it up."*; `Te pajahatha.` → *"Give them up."* (số nhiều, vì khoá trước là `Rūpā`/`Dhammā`/`Rasā`).
    Đo toàn tầng Anh đã ghim: 18 cặp Pāli "… na tumhākaṁ." + "pajahatha." , trong đó **6** cặp bị gộp; và
    `"give them up"` có tiền lệ ghim ở `sn35.139:1.13`.
  - `1.19` (`…pe…` trần): lớp lấp đã có **2** tiền lệ đúng khuôn — `vv69:1.2` và `vv69:3.2` đều ghi đúng `"…"`.
    Tầng ghim ở chỗ này ghi *(Tell all in full.)* — tức **mở rộng** chỗ lược, đúng lớp lỗi `sn22.76`; lớp lấp không
    chép theo.
  - `8.10` (`Aṭṭhamaṁ.`): tầng ghim **không** dịch enumerator nào trong toàn bộ SN (0 khoá). Lớp lấp đã có
    **2** tiền lệ cùng dạng: `sn35.70:7.6` và `ud5.8:6.5` đều `Aṭṭhamaṁ.` → **"Eighth."** ⇒ chép nguyên văn khuôn.

  **D = 1 nhóm — báo, không tự ý hòa.** Pāli `Taṁ vo pahīnaṁ hitāya sukhāya bhavissati.` trùng **từng byte** ở
  tám khoá (`1.2`, `1.6`, `1.12`, `1.18`, `2.9`, `3.9`, `3.15`, `8.3`). Bốn khoá đã có lời ghi
  *"Giving it up will be for your welfare and happiness."* **không** dấu lược; `8.3` ghi **có** dấu lược
  (*"… happiness. …"*) trong khi Pāli `8.3` **không** có dấu lược nào. `8.3` **không** thuộc tập lấp (đã có lời
  ghim) nên không được chạm. Lớp lấp chọn lời không-dấu-lược cho `1.12`/`2.9`/`3.9` vì đó là lời ghim của 4/4
  bản còn lại **và** vì Pāli của ba khoá đó viết đủ. Hệ quả phải nói thẳng: cùng một câu đó hiện **có** dấu lược
  ở `8.3` và **không** có ở `1.2`/`1.6`/`1.18`/`3.15` + ba khoá lấp. Tự biến mất khi tầng ghim được sửa.

  **Cố ý lệch tầng Anh đã ghim — bốn chỗ, đều có số đo kèm theo.**
  1. **Không thêm dấu lược ở `2.4`, `2.7`, `2.10`.** Ba khoá này Pāli viết **đủ** (`Rasā na tumhākaṁ.`,
     `Jivhāviññāṇaṁ na tumhākaṁ.`, `Jivhāsamphasso na tumhākaṁ.`), nên lớp lấp ghi *"… aren’t yours."* và **không**
     thêm `…` — dù tầng ghim ở ba khoá anh em `1.7`, `1.10`, `1.13`, `3.4`, `3.7`, `3.10` đều ghi kèm ` …`.
     Đo toàn tầng Anh đã ghim của SN: **1.185** khoá Pāli không dấu lược mà Sujato có dấu lược (**3,12%** trong
     38.011 khoá đo được) ⇒ đây là **quy ước gộp** của tầng ghim, không phải dấu lược của Pāli; lớp lấp sửa chứ
     không sao chép. Hệ quả: `2.4`/`2.7`/`2.10` đọc dạng đầy đủ, còn `1.7`/`3.4`/`3.7` đọc dạng ` …`.
  2. **`2.13` không nuốt "give it up".** Tầng ghim ở `1.16`, `3.13`, `8.7` gộp luôn vế `Taṁ pajahatha.` của khoá
     kế vào chính câu đó. Ở `2.13` lớp lấp **không** gộp, vì khoá kế `2.14` mở đầu bằng chính `Taṁ pajahatha.`
     và phải mang vế đó; gộp sẽ lặp. Đây là quyết định duy nhất về chỗ cắt câu trong 36 khoá này.
  3. **Dấu lược ở `2.14`, `1.19`, `8.6`.** Pāli `2.14` kết `…pe….` (**2** dấu) và `8.6` là `…pe…` (**2** dấu) ⇒
     lớp lấp ghi **đúng một** `…`, đặt **sau** dấu chấm câu; đo lớp lấp hiện có: mọi khoá Pāli kết `…pe….` đều kết
     ` …`. `8.4` và `8.5` có `…` trần trong Pāli ⇒ giữ **một** `…`.
  4. **Chữ hoa đầu câu ở `8.5`/`8.6`**: viết chữ thường (*"eye consciousness …"*, *"eye contact …"*) vì Pāli viết
     thường — đúng bốn tiền lệ ghim đã dẫn ở trên.

  **Bốn lớp lỗi tầng Anh đã ghim, đo ở đúng phẩm `sn35` này — báo, không sửa (không khoá nào thuộc lát này).**
  - **Gộp khoá (cùng lớp lỗi `7.3`/`7.5` ở `sn35.70`)**: **6** khoá ghim đã dịch sẵn nội dung của khoá lấp kế tiếp
    (`1.4`, `1.16`, `3.1`, `3.13`, `8.1`, `8.7`). Hệ quả trực tiếp: người đọc thấy "give it up" **hai lần** ở
    sáu cặp khoá đó (một lần trong khoá ghim, một lần trong khoá lấp). **Pāli chỉ nói một lần.** Không có cách nào
    vừa giữ đủ chữ ở khoá lấp vừa tránh lặp mà không bịa thêm dấu lược ở nơi Pāli không có.
  - **Dấu lược (cùng lớp lỗi `3.1`/`6.1` ở `sn35.70`)**: `2.1` có Pāli **0** dấu lược mà Sujato ghi **4** — và
    nội dung cũng **lệch**: Pāli `2.1` là `Jivhā na tumhākaṁ.` ("cái lưỡi không phải của các ngươi") trong khi
    Sujato ghi *"The ear … nose … tongue … body …"*. Đo toàn tầng Anh đã ghim của SN: **20** khoá ghi đúng câu đó,
    trong đó **17** khoá Pāli chỉ nói tới **lưỡi** (`jivhā`/`rasā`) ở **5** bài khác nhau (`sn35.138` ×2,
    `sn35.109`, `sn35.110`, `sn35.129`) ⇒ đây là **lỗi lệch khoá có hệ thống**, không phải sơ suất một chỗ.
    Chứng cứ khiến nó là lỗi chứ không phảa quy ước: ngay trong bài song parallel `sn35.138`, Sujato dịch
    `mano na tumhākaṁ; taṁ pajahatha.` (`1.8`, `1.19`) **đúng** thành *"mind isn’t yours: give it up."* còn `jivhā
    na tumhākaṁ; taṁ pajahatha.` (`1.6`, `1.17`) lại nhận **cùng** chuỗi sai *"The ear … nose … tongue … body …"*
    ⇒ lỗi bám vào `jivhā`, không bám vào khuôn câu.
    Ngược lại, Sujato **bỏ** dấu lược ở **5** khoá mà Pāli có: `1.19`, `2.14`, `8.4`, `8.5`, `8.6` — cả năm đều
    nằm trong tập lấp này và đã được lớp lấp chữa.
  - **Dấu nháy**: `5.1` và `6.1` có `“…”` cân ở Pāli nhưng Sujato bỏ (`6.1` mất **cả hai** dấu, thành *"Why is
    that?"*); `7.1` đổi `“Na hi no…` thành *"Because"* và thừa **hai** khoảng trắng. Không khoá nào trong 36
    khoá lấp nào có Pāli mang nháy (đo: **0/36** có `“‘”’`), nên luật khớp-nháy không phát sinh ở lát này.
  - **Câu tiếp vốn đã lỗi**: riêng `1.1` Pāli **0** dấu lược → Sujato **0** là **đúng luật**, không tính lỗi.

  **Bốn lỗi tự bắt trong chính phép đo của lát này.**
  1. Phép đo dấu lược đầu tiên đếm `…` và `…` là hai ký tự khác nhau nên báo đội vọt; sửa bằng cách chuẩn hoá
     về một dấu rồi đếm lại (số cuối cùng: **13** khoá lệch dấu lược, **8** thêm · **5** mất).
  2. Phép đo "gộp khoá" đầu tiên sắp khoá theo thứ tự **từ điển**, nên `3.1` bị nhìn thành khoá kế của `3.10`
     và bỏ sót; đo lại theo **thứ tự đọc** (số khối, rồi số khoá) cho **6** cặp, thay vì 4.
  3. Phép tính "khoá có nội dung" đầu tiên **xoá** khoảng trắng thay vì **gộp** về một, nên ra mẫu số **8** thay
     vì **22** và báo coverage trước là 0,75 thay vì **0,6364**. Sửa theo đúng định nghĩa của kho rồi tính lại.
  4. Lần đo đầu dùng tỉ lệ khớp giữa hai chuỗi đã chuẩn hoá khác nhau giữa hai lần chạy, nên `2.7` và `2.10`
     đổi chỗ số. Đã chốt **một** phép đo duy nhất cho toàn bảng ở trên.

  **Còn lại bao nhiêu khoá trống**: **không còn** — 36/36 khoá của lát đã lấp, và 36 khoá đó **chính là toàn bộ**
  chỗ tầng Anh đã ghim im lặng trong bài này (đo: Pāli **67** khoá, bỏ khối `:0` còn **64**, tầng ghim có lời ở
  **28**, trống **36**). Trong đó **8** khoá có nội dung (≥ 40 ký tự) và **28** khoá **dưới** ngưỡng 40 ký tự —
  28 khoá đó được lấp đủ nhưng **không** tính vào coverage, vì ngưỡng 40 ký tự là quy tắc của kho. Lưu ý:
  `fillableSegments` so **chỉ** với tầng đã ghim nên nó vẫn trả về đủ 36 khoá sau khi lớp lấp đã ghi; đó là cố ý
  của kho, không phải khoá trống còn sót.

  **Coverage: trước → sau, bằng số.** Mẫu số = **22** khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`).
  Trước: **14/22 = 0,6364**. Sau khi lớp lấp này `published`: **22/22 = 1,0000**. Cả tám khoá có nội dung còn
  trống đều nằm trong lát này, nên không cần khoá nào nữa.
  **Độ nhạy ngưỡng**: ngưỡng 0,8 với mẫu số 22 là **18** khoá. Trước lớp lấp này thiếu **4**; sau lớp lấp này dư
  **4**. Mỗi khoá có nội dung = **0,0455** của tỉ lệ.

  **Hệ quả với `content/meta/reference-gaps.yaml` — cần người điều phốn xử lý.** Bài này **không có** record
  (đo: 0 lần `sn35.101` trong tệp đó), vì phạm vi tệp là "texts with project data under `content/meta/sutta`"
  mà `sn35.101` không có tệp Việt ở đó. Sau khi `published`, coverage là **1,0000** ⇒ vẫn **không** cần record,
  nên không có record thừa nào phát sinh và không có gì để xoá. Lát này bị cấm chạy `npm run reference:gaps`
  nên **không** chạm tệp đó; nhắc lại để người điều phốn sinh lại khi gom.

  **Suy ra từ đây — bài này không được tuyên bố là đã đối chiếu English.** Đo: `sn35.101` **không có tầng Việt nào** —
  không có tệp Việt của dự án, không có `content/meta/sutta/sn/sn35.101.yaml`, và tầng Việt hiện hành của Hòa
  thượng Thích Minh Châu không phủ bài này ở commit đã ghim. Nghĩa là **không có** bản Việt canonical để đối
  chiếu, và cũng không có bản Việt nào cùng nhóm người làm. Với tám khoá có nội dung từng trống, nguồn đối
  chiếu chỉ có **Pāli root** cộng các khoá ghim còn lại trong chính bài. Vì vậy `triangulation` bị đặt **7,6** —
  thấp hơn mức trần 8,0 mà lớp lấp dùng khi chỉ trùng alias, vì ở đây còn thiếu **cả** tầng Việt.
  `vietnamese_clarity` và `han_viet_balance` cũng bị hạ xuống 9,0 với lý do như vậy: **không có** văn bản Việt nào
  để mà hai tiêu chí đó có thể được chứng minh, chúng chỉ được chấm trên sự trong sẽc và súc tích của tiếng Anh.

  **Nguồn dùng làm tiền lệ và giới hạn**: toàn bộ từ ngữ lấy từ chính các khoá đã ghim trong bài này
  (`1.2`–`1.18`, `3.1`–`3.15`, `8.3`, `8.7`, `8.9`) cộng với tiền lệ ghim ở bài khác đã nêu từng khoá, và với
  lớp lấp đã có (`sn35.70`, `sn35.102`). Không tự sáng tác thuật ngữ mới.

  **Ghi về nguồn gốc, nói thẳng**: 18 khoá trong lát này là **nguyên văn** lời của bản Anh đã ghim hoặc của
  lớp lấp đã có, vì luật dùng lại bắt buộc thế. Ở reader, mỗi segment do lớp lấp cung cấp đều mang nhãn lớp lấp
  của dự án chứ không phải bản Sujato đã xuất bản; ranh giới giấy phép giữa hai tầng là việc của người biên tập,
  tầng đã ghim khai `NOASSERTION` trong khoá nguồn.

  **Bốn lệnh cổng kỹ thuật CHƯA chạy** vì lát này bị cấm: `npm run validate`, `npm test`, `npm run check`,
  `npm run build`. Vì vậy `technical_integrity` đặt 9,6 chứ không 10,0, và không tuyên bố technical gate pass.
