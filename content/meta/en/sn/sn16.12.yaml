notes: |-
  1.12/1.15 lặp lại vế của 1.10 và 1.13 (Sujato): "does a realized one both still exist and no
  longer exist after death?" và "…neither still exist nor no longer exist after death?". Phần
  trong nháy kép lấy nguyên vế của Sujato, thêm chủ ngữ "a realized one" vì đây là mệnh đề
  được dẫn lại chứ không phải câu hỏi.

  Về ngoặc kép, đây là điểm cơ học đáng nói: Pāli kết `’”ti.` nên chốt đếm `_đóng` = 2 (một
  `”` từ `ti` + một `’` đứng trước `”`). Sujato ở 1.10/1.13 chỉ dùng một `”`, tức bản đã ghim
  tự lệch chốt. Bản lấp phải giữ đủ hai, nên kết bằng `’.”` — đúng cùng khuôn đã dùng ở bản
  lấp `sn24.19:3.15` (`’”?`). Đây là hệ quả của quy ước đếm theo Pāli, không phải lựa chọn
  thẩm mỹ; `ambiguity_integrity` hạ vì người đọc có thể thấy nháy kép thừa.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
