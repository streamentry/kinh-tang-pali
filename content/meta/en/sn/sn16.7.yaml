  **Dấu lược — đo từng khoá, `…pe…` tính đúng một `…`.** Trong 43 khoá: Pāli có `…pe…` ở **5** khoá,
  chỉ có `…` trần ở **26**, không có `…` ở **12**. Tổng `…` bên Pāli = **31**, bên lớp lấp = **31**,
  và khớp **43/43 khoá**. Ba chỗ lớp lấp **cố ý không** chép lỗi của tầng ghim: tầng ghim **mở rộng**
  lược ở `3.2` và `6.2` (Pāli có `…pe…` và `…`, lời ghim **0** dấu `…`), và **bỏ mất** dấu lược ở
  `1.2` (Pāli `…pe…`, lời ghim không có dấu nào). Lớp lấp ở `9.3`/`11.2` cũng **không** mở rộng lược
  như tầng ghim đã mở rộng ở `8.2`/`10.1`.

  **Ngoặc kép và nháy — đo trước, ghi cả hai số và lý do.** Điều kiện đúng là *khớp Pāli từng khoá*.
  Sau khi loại dấu nhạt lượu tiếng Anh bằng luật đã hiệu chuẩn (`’` + `s|t|ll|re|ve|d|m`, **không**
  theo sau bằng chữ cái), lớp lấp khớp Pāli **43/43 khoá**: `9.8` `9.14` `12.1` `12.7` mỗi khoá
  1 `‘` + 1 `’`; `9.1` và `11.1` chỉ có dấu nhạt lượu `It’s`; 36 khoá còn lại 0/0.
  ⚠️ Luật này **không** loại nháy đóng Pāli `purisapuggalo’ti` (vì sau `t` còn chữ `i`), cũng **không**
  loại nháy đóng ở khoá đồng đoạn — đã kiểm bằng máy trên đúng 43 khoá này.
  Lệch có chủ đích: tầng ghim ở bài này dùng **0** nháy đơn trong **38** giá trị không trống, tức đã
