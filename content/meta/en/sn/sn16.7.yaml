  **Phạm vi lát.** `sn16.7` = Dutiyaovādasutta, mục 7 trong Kassapavagga của Đại-phẩm (Mahā-āyāma,
  Saṃyutta 16). Đo phạm vi phẩm thay vì giả định: phẩm này có **13** bài, tất cả cùng một vagga, và
  **13** bài đều mang đúng một nhãn thứ tự ở khoá cuối — `sn16.1` Paṭhamaṁ · `sn16.2` Dutiyaṁ ·
  `sn16.3` Tatiyaṁ · `sn16.4` Catutthaṁ · `sn16.5` Pañcamaṁ · `sn16.6` Chaṭṭhaṁ · `sn16.7` Sattamaṁ ·
  `sn16.8` Aṭṭhamaṁ · `sn16.9` Navamaṁ · `sn16.10` Dasamaṁ · `sn16.11` Ekādasamaṁ ·
  `sn16.12` Dvādasamaṁ · `sn16.13` Terasamaṁ. ⇒ **Nhãn ở phẩm này đánh số BÀI TRONG CHƯƠNG, không
  đánh số mục trong bài.** Vì vậy `Sattamaṁ.` = "Seventh." là **đúng**, và bài này **không** dính kiểu
  lệch của `an6.27` (nhãn "Seventh" ngay dưới câu "…six occasions…"): ở đây bài có 12 mục và "Seventh"
  là vị trí thứ 7 trong chương, hai thứ không đụng nhau. Vẫn điền khoá, không bỏ.
  Đo toàn bộ `sn` với cùng phép (giá trị khoá chỉ gồm chữ kết `ṁ.` cộng dấu chấm, đã loại
  `Sāvatthinidānaṁ.` vì đó không phải nhãn thứ tự): **1491** khoá nhãn thứ tự ở **1464 / 1819** bài.
  Con số này là của lát này, không chép từ bản dựa.

