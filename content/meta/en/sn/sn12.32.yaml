notes: |-
  Phân loại 31 khoá đã ghi (đo bằng script, theo Pāli đã có lời trong cùng bài): A y nguyên = 8 · B dựng lại = 8 · C tự dịch = 13 · D (Pāli trùng, lời đã ghim khác nhau; báo, không tự hòa) = 2. Script phân loại theo Pāli trùng nên các khoá tách ra từ một khoá đã ghim bị gộp sẵn (đếm là C) được nêu riêng bên dưới.
  Số khoá đã ghi: 31 trên 31 khoá tầng Anh đã ghim để trống (0 khoá còn trống).
  Khoá còn trống: không còn khoá nào trong danh sách khoá để trống của bài này.
  Nhóm B (khoá ← khoá nguồn, tỉ lệ khớp do script đo): 16.8 ← 16.7 (0.79); 16.10 ← 16.9 (0.79); 16.12 ← 16.11 (0.80); 16.14 ← 16.13 (0.80); 16.16 ← 16.15 (0.79); 17.8 ← 16.7 (0.77); 18.2 ← 16.5 (0.72); 18.9 ← 16.17 (0.87).
  Nhóm D: 8.3, 14.7.
  Nháy: 2 khoá có số dấu nháy khác Pāli (8.3, 14.7); các khoá còn lại khớp Pāli từng khoá.
  Dấu lược: 19 khoá chứa `…` (16.8, 16.10, 16.12, 16.14, 16.16, 17.6, 17.7, 17.8, 17.9, 17.10, 17.11, 17.12, 18.2, 18.3, 18.4, 18.5, 18.6, 18.7, 18.8); mỗi `…pe…` của Pāli tương ứng đúng một `…` của English, không khoá nào mở rộng.

  Nhóm A — 8.2 (từ 7.2), 9.5 (từ 9.2), 10.5 (từ 10.2), 11.7 (từ 11.4), 14.6 (từ 14.2): Pāli y hệt, dùng lại nguyên văn.
  Nhóm D (2 khoá, báo chứ không tự hòa) — 8.3 và 14.7 có Pāli trùng với 7.3, 8.7 và 14.3, nhưng lời đã ghim của ba khoá ấy KHÁC nhau: 7.3 là `“I understand: ‘Rebirth is ended, … for this place.’”’` (ba lớp nháy), 8.7 là `I understand: “Rebirth is ended, …”’` (hai lớp, vì nằm trong lời đáp), 14.3 là `“I understand: ‘Rebirth …’”?’` (có dấu hỏi). 8.3 và 14.7 nằm ở đúng vị trí cấu trúc của 7.3 (lời câu hỏi được nhắc lại), nên dùng lại 7.3 nguyên văn; không dùng 8.7 vì 8.7 đứng trong vế đáp. Nháy của hai khoá này vì vậy khác Pāli ở bốn dấu (Pāli 0 mở / 1 đóng ’, English 1 “ / 1 ” / 1 ‘ / 2 ’), đúng với quy ước lồng nháy của chính bài đã ghim ở 7.3.
  Nhóm B — 16.8, 16.10, 16.12, 16.14, 16.16 dựng từ 16.7, 16.9, 16.11, 16.13, 16.15 (0.79–0.80): tầng đã ghim chỉ dịch vế “hỏi” (“for two days and nights,” “for three,” …) và bỏ vế “đáp” `…ānipāhaṁ bhagavato etamatthaṁ byākareyyaṁ …pe…`; lớp lấp chèn lại vế đáp theo 16.4/16.17: “I could answer for two days and nights …”, và giữ một `…` cho mỗi `…pe…`.
  Nhóm C — 17.6–17.12 (dãy `rattiñcepi … / rattindivañcepi … / dve rattindivāni … / tīṇi … / cattāri … / pañca … / cha …`): Pāli của 17.9–17.12 chỉ là số đếm. Dịch “If all night …”, “If the Buddha were to question me all day and night …”, “… for two days and nights …”, “three …”, “four …”, “five …”, “six …” theo đúng cách tầng đã ghim dịch dãy song song ở 16.5–16.15 (“If he were to question me all night,” “for three,” “four,” “five,” “six,”).
  17.4, 17.5, 17.13 là A theo từng chữ so với 16.3, 16.4, 16.17; nháy bỏ ‘ mở đầu (và ’ đóng ở 17.13) vì Pāli của các khoá này không có nháy đơn lồng (Pāli 16.4 cũng không có; ‘ ở 16.4 là của Sujato).
  Nhóm B — 18.2 dựng từ 16.5 (0.72), 18.9 dựng từ 16.17 (0.87): đổi chủ thể thành “I … Sāriputta” và giữ cụm “on this matter”, “in different words and ways” của 16.4. 18.3–18.8 là cùng khuôn, mỗi khoá một số ngày đêm, và giữ `…` cuối của Pāli. 18.1 đã ghim chỉ tóm “up to the seventh day and night”; 18.2–18.9 tách lại từng bước đúng Pāli.
  18.10 `Dutiyaṁ.`: “Second.” (nhãn thứ tự).

  Cố ý lệch tầng đã ghim: 17.5 và 17.13 bỏ nháy đơn mở đầu và ’ cuối của lời đã ghim ở 16.4/16.17, để nháy khớp Pāli từng khoá. 17.6 dịch “If all night …” (không “he”) vì Pāli chỉ còn `rattiñcepi …pe…`.

  Coverage đo bằng mẫu số là các khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): trước 80/103 = 0.7767; sau khi `published` 103/103 = 1.0000. Ngưỡng 0.8 cần 83/103; trước lớp lấp còn thiếu 3 khoá, lớp lấp thêm 23 khoá có nội dung.

