notes: |-
  1.11 và 1.15 nằm giữa một danh sách mà phần lớn CHƯA được lấp: 1.8–1.10 và 1.12–1.14 vẫn
  trống (fillable nhưng không thuộc lát 6). 1.15 nhất thiết phải đọc được khi ghép vào chúng,
  nên nó dùng đúng bộ từ Sujato đã đặt ở 1.3–1.7: "meditate observing not-self in form,
  feeling, perception, choices, and consciousness".

  `parijānāti` dịch "fully understands": tiền lệ `snp1.11:10.3` (Sujato) dịch đúng
  `So kho naṁ parijānāti` = "fully understands it,". `parimuccati` và dạng `…mhā`/`…yā`
  dịch "freed from …" theo 1.16 (Sujato): `‘parimuccati dukkhasmā’ti vadāmī”ti.` = "They’re freed
  from suffering, I say."; chủ ngữ `they’re` giữ theo 1.16.

  `jāti jarā maraṇa soka parideva dukkha domanassa upāyāsa` dịch "rebirth, old age, and death,
  with sorrow, lamentation, pain, sadness, and distress" — đúng bộ từ bản lấp đã publish ở
  `sn35.28:1.10` và `sn35.29:1.11`. "old age" (không phải "aging") là lựa chọn của Sujato:
  285 lần so với 24 trong toàn bộ SN đã ghim.

  Bất định thật sự: 1.15 dài và phải khớp với các khoá trống chưa ai lấp, nên còn phụ thuộc
  khoá sau; `terminology` và `ambiguity_integrity` hạ vì lý do đó. 1.11 cũng phụ thuộc 1.8–1.10.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
