notes: |-
  KHÔNG có tiền lệ nguyên văn: đã dò toàn bộ SN đã ghim (36.786 vế Pāli có bản Anh)
  và không vế nào trùng 2.2, 2.3 hay 2.4. Lý do: ở bài này bản đã ghim đã gộp CẢ 2.1–2.4
  vào một câu duy nhất ở 2.1 ("knowing and seeing the eye, sights, eye consciousness, and
  eye contact as impermanent, wrong view is given up."), nên không còn chỗ nào dịch riêng.

  Vì vậy ba khoá này phải dựng lại từ bộ từ bản đã ghim đặt sẵn ở 2.1, tách theo từng
  khoá: `Rūpe` = "sights", `Cakkhuviññāṇaṁ` = "eye consciousness",
  `Cakkhusamphassaṁ` = "eye contact" (cả ba đã xuất hiện đúng thế ở 2.1 và ở sn35.102:1.10
  / 1.13 đã ghim); `aniccato jānato passato` = "knowing and seeing … as impermanent";
  `micchādiṭṭhi pahīyati` = "wrong view is given up" (cũng là cách 1.3 và 2.6 dùng).
  Vế danh từ đứng đầu câu, nên viết hoa chữ đầu cho đọc được khi cột English hiện lẻ.

  Hệ quả phải ghi: 2.2–2.4 lặp lại nội dung mà 2.1 đã ghim, nên đọc cả bài sẽ thấy lặp.
  Lặp đó có trong chính Pāli (bốn mệnh đề riêng), nên đây là hệ quả của việc bản đã ghim
  gộp sớm, không phải lỗi bản lấp. `ambiguity_integrity` hạ vì không có tiền lệ để
  đối chiếu từng khoá. `triangulation` 8.0 là đặc thù của lớp lấp.
