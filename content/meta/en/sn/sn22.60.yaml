notes: |-
  Bốn khoá là **bản sao nguyên văn** của Pāli đã có bản dịch trong chính bài này:

  - `6.5` và `7.6`: Pāli `Ayampi kho, mahāli, hetu[,] ayaṁ paccayo sattānaṁ saṅkilesāya. `
    giống `8.4` (chỉ khác dấu phẩy) → chép y `8.4`.
  - `6.6` và `7.7`: Pāli `Evampi sahetū sappaccayā sattā saṅkilissanti. ` giống `8.5` (khác `”ti`
    thôi) → chép y `8.5` nhưng **không** mang dấu `”` vì Pāli ở `6.6` không có.

  Hai khoá phải tự viết:

  - `6.2` chép khuôn `5.2` (rūpa) và `8.2` (viññāṇa), đổi danh từ: "But because feeling is
    pleasurable—soaked and steeped in pleasure and not steeped in pain—sentient beings are aroused
    by it;" (`8.2` dùng đúng câu này với "consciousness").
  - `7.3` chép cùng khuôn với `saṅkhārā`/`saṅkhāresu`: "But because choices are pleasurable—…—
    sentient beings are aroused by them;" Chỗ khác: `saṅkhāresu` là số nhiều nên dịch **"by them"**,
    còn `rūpasmiṁ`/`viññāṇasmiṁ` ở `5.2`/`8.2` là số ít nên bản ghim dùng "by it". `saṅkhāra` →
    "choices" là tiền lệ đã ghim ngay trong bài: `7.2` ("choices …").

  ⚠️ **Một sự lựa chọn phải nói thẳng: `-pi` bị bỏ ở `6.5`, `6.6`, `7.6`, `7.7`.** Pāli có `Ayampi`
  và `Evampi`, nghĩa là "**cũng** vậy" — đúng nghĩa nhấn mạnh rằng sắc thọ và hành cũng là nhân như
  sắc và thức. Bản ghim ở `8.4`/`8.5` **đã bỏ** `pi` ("This is a cause and reason…", "This is how…"),
  và Pāli ở đó giống hệt. Tôi chép y bản ghim thay vì tự thêm "too", vì nếu thêm thì cùng một Pāli
  sẽ có hai cách dịch trong cùng bài — đúng cái bẫy mà AGENTS.md và
  `tests/unit/english-fill.test.ts` (`sn11.24:1.7`) ghi lại. Đánh đổi: một tiểu từ Pāli không được
  dịch ở bốn khoá này. `semantic_fidelity` hạ 9,3 và `ambiguity_integrity` hạ 9,0 cho việc này.
  Người biên tập nếu muốn giữ "too" thì phải sửa cả tầng đã ghim, việc đó ngoài lát này.

  Lớp lấp: 6 khoá, tất cả nằm ở chỗ bản Anh đã ghim để trống. **Không khoá nào là blockquote
  tham chiếu và không khoá nào có Pāli rỗng**, nên không có khoá nào bị bỏ.

  **Bốn khoá bản Anh đã ghim để trống mà lát này KHÔNG lấp** vì Pāli **dưới 40 ký tự**:
  `6.3`/`7.4` (`sārāgā saṁyujjanti;`, 19) và `6.4`/`7.5` (`saṁyogā saṅkilissanti.`, 22). Hệ quả
  thật, phải nói: cột English quanh `6.2` và `7.3` **đứt** — câu của tôi ở `6.2` dừng ở dấu `;`
  rồi hai ô trống rồi tới `6.5`. Bản ghim ở `5.3` và `8.3` đã gộp ba vế này thành một câu
  ("Since they are aroused by it, they’re caught up in it, and so they become corrupted."), còn ở
  `6` và `7` nó không gộp. Tôi **không** bịa hai vệt đó để nối, vì chúng không nằm trong lát. Người
  đọc bốn cột sẽ thấy lỗ hổng đó, và đó là lỗ hổng thật của bản dịch đã ghim. Còn `10.9`
  (`Aṭṭhamaṁ.`, 9) là dòng đếm số thứ tám.

  **Bài này KHÔNG có bản Việt của dự án** (không có
  `content/translation/vi/project/sutta/sn/sn22.60_translation-vi-project.json`, cũng không có
  `content/meta/sutta/sn/sn22.60.yaml`), nên không có đối chiếu Việt cho khoá nào ở đây.
  `vietnamese_clarity` và `han_viet_balance` mang **giá trị mặc định của lớp lấp** (tiền lệ
  `sn24.36`), và `triangulation` hạ 7,4: tầng đối chiếu chỉ còn Pāli đã ghim + các khoá còn lại
  của chính bản Anh đã ghim.

  **Coverage và `content/meta/reference-gaps.yaml`.** Trước lát này coverage là 34/40 = 0,85,
  **đã trên** ngưỡng 0,8; bài cũng nằm ngoài phạm vi của file đó (chỉ "texts with project data
  under content/meta/sutta"). Lát này **không** làm record nào thành thừa. Sau lát này là
  40/40 = 100%.