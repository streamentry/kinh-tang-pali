notes: |-
  2.7 trùng NGUYÊN VĂN 2.18 của chính bài (bản đã ghim) — dùng lại nguyên văn, kể cả
     việc Sujato lược `So`. `aṇḍajāna` = "egg-born" theo 2.5 và 1.2 đã ghim.
  
  2.8 là 2.19 rút gọn: `ayaṁ paccayo, yena … upapajjati` nằm trong `…pe…`, nên chỉ còn
     "This is the cause" + "is reborn", với HAI dấu lược rời đúng như Pāli. Đọc 2.8 là một
     mảnh câu là tự nhiên ở đây vì 2.6 và 2.9 đã ghim cũng là mảnh ("They give food …",
     "drink …"). Bản Việt dự án dịch vế `…pe…` thứ nhất thành "… được …", hơi lệch; ở đây
     bám theo bản đã ghim 2.19.
