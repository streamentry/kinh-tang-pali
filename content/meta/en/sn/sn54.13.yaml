notes: |-
  **Phân loại 9 khoá (đo bằng máy trên Pāli root và tầng Sujato đã ghim): A dùng lại nguyên văn = 1 · B dựng lại = 4 · C tự dịch = 4 · D báo = 0.** A gồm cả khoá lặp nguyên văn một khoá lấp trước đó trong cùng bài; B là Pāli gần (tỉ lệ khớp từ 0,6) một khoá đã có lời, chỉ chèn phần tầng ghim nuốt mất; D là Pāli trùng nguyên văn với khoá đã ghim nhưng lời đã ghim khác nhau, hoặc lớp lấp cố ý lệch (nêu từng khoá bên dưới).

  **Tám khoá `X.3` (11.3, 12.3, 13.3, 14.3, 15.3, 16.3, 17.6, 18.3) là mệnh đề thứ ba của mỗi mắt xích** (`satisambojjhaṅgo tasmiṁ samaye bhikkhuno āraddho hoti, … bhāveti, … bhāvanāpāripūriṁ gacchati`). Tầng đã ghim dồn trọn nội dung này vào khoá `.2` liền trước (“At such a time, a mendicant has activated the awakening factor of X; they develop it and perfect it”) và để khoá `.3` trống. Lớp lấp dịch mệnh đề đó từ Pāli, một khuôn duy nhất cho cả tám khoá, dùng chữ của tầng ghim: “activated / initiated”, “develop”, “perfect”, “awakening factor of X”. Chi tiết:
  · 13.3, 15.3, 16.3, 17.6 là B (tỉ lệ khớp 0,78–0,84 với 10.4, khoá đã ghim mang cùng công thức cho niệm giác chi): lấy khung 10.4, thay yếu tố và dịch trọn ba vế thay vì gộp thành một.
  · 11.3, 12.3, 14.3 là C (0,54–0,56): cùng khuôn nhưng Pāli không gần khoá đã ghim nào.
  · 18.3 lặp nguyên văn 16.3 (cùng Pāli `upekkhāsambojjhaṅgo …`): đó là khoá A duy nhất.
  · **Động từ `āraddho`**: tầng ghim dùng cả “initiated” lẫn “activated” (12.2 và 13.2 dùng “initiated”; các khoá còn lại “activated”). Lớp lấp theo đúng động từ của khoá `.2` kề bên (12.3 và 13.3 “initiated”; 11.3, 14.3, 15.3, 16.3, 17.6, 18.3 “activated”) để hai khoá đứng cạnh nhau không nói hai điều khác nhau. Đây là lựa chọn nhất quán *cục bộ*, không phải một quyết định về thuật ngữ cho cả bộ.
  · Hệ quả: vì tầng ghim đã dồn nội dung vào `.2`, mỗi khoá `.3` mới nhắc lại nội dung ấy; sự lặp là do tầng ghim, hiện ra chứ không giấu.
  **19.6 `Tatiyaṁ.`** là nhãn thứ tự. Dịch “Third.” theo khuôn nhãn (First…Twelfth). Cảnh báo nhãn thứ tự: bài này là sn54.13, thứ ba của Dutiyavagga bắt đầu ở sn54.11, nên nhãn khớp số mục (không có chỗ lệch).

  Dấu lược: 0 khoá của lớp lấp có `…`. Tầng ghim có 4 khoá lệch số dấu lược so với Pāli (6.1, 17.5 thừa `…`; 6.3 thừa một; 19.3 thiếu một) — ngoài lát, chỉ báo. Nháy: khớp Pāli ở cả 9 khoá.

  **Khoá còn trống:** 0 trong 9 khoá `fillableSegments` (đã lấp hết; đo bằng máy: không còn khoá Pāli nào của bài thiếu cả tầng Sujato lẫn lớp lấp). **Coverage** (Pāli ≥ 40 ký tự, bỏ khối `:0`): trước 57/65 = 0.8769; sau khi `published` 65/65 = 1.0000. Độ nhạy: ngưỡng 0,8 cho phép thiếu tối đa 13 khoá có nội dung (phần nguyên của 0,2 × 65); trước lát bài thiếu 8. `content/meta/reference-gaps.yaml` **không** có record của bài này (coverage trước đã ≥ 0,8), nên không có record nào thành thừa vì lát này.

  **Triangulation 7.8.** Bản Việt canonical của bài (`content/meta/sutta/sn/sn54.13.yaml`) do cùng họ công cụ làm, rà soát hoặc chấm với lớp lấp (đối chiếu `translators` / `assessed_by` / `reviewers` với `source/tooling.yaml`), nên lớp lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English của lớp này. Đối chiếu thực có: Pāli root + tầng Sujato đã ghim (75/84 khoá có lời) + bản Việt canonical để đối chiếu nghĩa (không dịch vòng, không chép). Không có bản Anh độc lập nào cho 9 khoá lớp lấp, nên chấm không quá 8,0.

  **technical_integrity 9.6:** không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối. Không đặt blocker vì chưa chạy.
