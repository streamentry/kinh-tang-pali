notes: |-
  12.19/12.20 là lần lặp của 12.2–12.17. Sujato dịch 12.2 `sarāgaṁ vā cittaṁ sarāgaṁ cittanti
  pajānāmi` = "I understand mind with greed as ‘mind with greed’" và 12.17 `avimuttaṁ vā cittaṁ
  avimuttaṁ cittanti pajānāmi` = "unfreed mind …". Giữ nguyên cụm từ "mind with greed" /
  "unfreed mind" cho khớp lát 12.2–12.17.

  Bất định thật sự: Pāli 12.19/12.20 KHÔNG có `‘`/`’`, nên bản lấp không được khoanh lời
  trong `‘…’` như Sujato ở 12.2. Hệ quả: "they understand mind with greed as mind with greed"
  đọc lặp vụng, và "they understand unfreed mind as unfreed mind" thì ngắn gọn đến mức
  khó đọc. Giữ nguyên văn thanh vì đó là lời Sujato đã dùng cho danh sách này — đổi sang
  "a greedy mind as a greedy mind" sẽ phá thuật ngữ. Đây là chỗ tệ nhất của lát 6 về độ rõ,
  nên hạ `grammar_logic` và `ambiguity_integrity`.

  `pajānāti` (thì hiện tại, chủ ngữ Kassapa) dịch "they understand", khớp 12.18 "And so does
  Kassapa" và 12.3 "and mind without greed as ‘mind without greed’;".

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
