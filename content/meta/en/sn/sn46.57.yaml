notes: |-
  Bài trong `Ānāpāna` (và bản Việt đã đặt tên bốn phẩm con: `Aññataraphalasutta` → Kinh Quả (Một) · `Mahatthasutta` → Kinh Lợi Ích Lớn · `Yogakkhemasutta` → Kinh An Ổn Khỏi Ách Phược · `Saṁvegasutta` → Kinh Xúc Động · `Phāsuvihārasutta` → Kinh An Trú Ổn) nên tiêu đề Anh của từng bài con bám đúng vế `mahato …` của chính nó, khác bốn vế gộp làm một của `sn46.76:3.1` ("great benefit … great sanctuary from the yoke … great inspiration … great ease").

  BỐN SỐ A/B/C/D, đo bằng thân từ (từ ≥ 4 chữ, lấy 4 chữ cuối):
  - A = 5. `2.4/3.4/4.4/5.4/6.4` có Pāli TRÙNG NGUYÊN VĂN với `1.5`, mà `1.5` tầng đã ghim đã có lời ⇒ dùng lại **nguyên văn** lời `1.5` cho cả năm, không dịch lại. Cùng Pāli ấy còn xuất hiện ở `sn46.76:1.4/2.6/3.4` và `mn2:21.8`, `dn33:1.11.97`.
  - B = 0. Không khoá nào khớp ≥ 0,50 với lời tầng đã ghim. Đo được **vì sao**: `1.4` của tầng ghim đã BUNG dấu lược, nên lời nó dài hơn hẳn Pāli, và độ khớp thân từ với Pāli `2.3` là **0,00**. Đo ở mức Pāli thì `2.3` và `1.4` dùng chung **93,6%** tiền tố. Hai số này trả lời hai câu khác nhau nên ghi cả hai: theo phép thân từ là nhóm C, theo cấu trúc Pāli là bản rút gọn của `1.4` — lớp lấp xử lý như bản rút gọn, cắt đúng chỗ dấu lược.
  - C = 16.
  - D = 0. Trong bài không có cặp Pāli trùng nào mà tầng ghim cho hai lời khác nhau.

  MƯỜI KHOÁ LẶP NGUYÊN VĂN TRONG CHÍNH BÀI, đo được: `2.3/3.3/4.3/5.3/6.3` là **một** Pāli (5 khoá) · `1.5/2.4/3.4/4.4/5.4/6.4` là **một** Pāli khác (6 khoá). Lớp lấp dịch mỗi Pāli đúng một lần rồi dùng lại, y hệt cách Pāli lặp. Đây là điều `sn11.24` đã dạy: đọc `2.3` tách khỏi bài rất dễ thành một câu khác hẳn, vì `…pe…` giấu mất năm giác chi còn lại.

  DẤU LƯỢC: trong 21 khoá lấp có **5** khoá Pāli ghi `…pe…` (`2.3/3.3/4.3/5.3/6.3`) ⇒ lớp lấp ghi **đúng một** `…` ở mỗi khoá, tổng **5** dấu. Đếm thô Pāli ra **10** vì `…pe…` bị đếm là hai dấu — đó là cái bẫy. Không khoá Pāli nào ở 21 khoá này viết `…` trần, nên không có chỗ nào bị bịa dấu lược.

  ⚠ LỆCH CÓ CHỦ Ý so với tầng đã ghim, bốn chỗ:
  1. KHÔNG mở rộng `…pe…`. Tầng ghim ở `1.4` bung thành "mindfulness, investigation of principles, energy, rapture, tranquility, immersion"; `sn46.76:1.3/2.5/3.3` cũng bung y hệt. Tiền lệ giữ lược ngay trong lớp lấp này: `sn46.49:1.4`.
  2. Vì không mở rộng, `2.3–6.3` dùng SỐ ÍT "the awakening factor of mindfulness", khác "the awakening factors" của tầng ghim. Pāli `satisambojjhaṅgaṁ` là số ít; tiền lệ số ít ở tầng ghim: `sn43.12:10.2`, `dn16:1.9.1`, và ở lớp lấp: `sn46.49:1.4`.
  3. `6.5` dịch "great ease", còn `6.1` của tầng ghim dịch "dwelling in great ease". Cùng cụm `mahato phāsuvihārāya saṁvattati`. Chọn "great ease" vì `sn46.76:3.1/3.5` — bài cùng khung — dịch đúng cụm đó là "great ease", và vì bốn khoá kết `3.5/4.5/5.5/6.5` phải thành một loạt đều nhau. Chênh lệch với `6.1` là do tầng ghim tự viết khác, không phải do lớp lấp; người biên tập nên thống nhất `phāsuvihāra` giữa `sn46.57` và `sn46.76`, cả tiếng Anh lẫn tiếng Việt.
  4. Dấu nháy đóng `”` đặt ở `2.5/3.5/4.5/5.5/6.5`, đúng chỗ Pāli có `”ti`. Tầng ghim dồn dấu này sang `2.2/3.2/4.2/5.2/6.2` ("How so? …”"), nên đọc liền sẽ thành hai dấu đóng trong một câu. Đây là lỗi của tầng đã ghim, đã biết và đã ghi ở `sn46.76`; điều kiện đúng là khớp Pāli **từng khoá**, nên giữ dấu ở `…5`. Lớp lấp không sửa được `2.2–6.2` vì tầng ghim đã có lời ở đó ⇒ ghi ra đây, không tự ý hòa.

  BA TIÊU ĐỀ KHÔNG CÓ TIỀN LỆ, đặt theo thân chính nó: `3.0 Mahatthasutta` → "Great Benefit" và `5.0 Saṁvegasutta` → "Inspiration" bám đúng lời tầng ghim ở `3.1` ("leads to great benefit") và `5.1` ("leads to great inspiration"); `4.0 Yogakkhemasutta` → "Safety from the Yoke" bám `4.1` ("great sanctuary from the yoke"). Cả ba là hapax trong snapshot, không khoá nào khác có lời Anh. `6.0 Phāsuvihārasutta` thì có tiền lệ nguyên văn: `an5.94:0.3` và `an5.105:0.3` đều "Living Comfortably". `2.0 Aññataraphalasutta` cũng là hapax và không có tiền lệ; dịch "One of Two Fruits" vì thân bài chính là `dvinnaṁ phalānaṁ aññataraṁ phalaṁ`, mà tầng ghim đã dịch câu đó là "one of two results". Có một quy ước khác trong tầng ghim — `sn51.25:0.3`/`sn51.26:0.3` (`Paṭhamaphalasutta`/`Dutiyaphalasutta`) dịch "Fruits (1st)"/"Fruits (2nd)" — nhưng `Aññatara` không mang số thứ tự, nên không theo. Đây là chỗ duy nhất trong lát này là lựa chọn biên tập không có tiền lệ, và là lý do hạ `ambiguity_integrity` xuống 9,1.

  NHÃN THỨ TỰ: `6.6` là khoá nhãn (Pāli `Paṭhamaṁ.`), dò ở **giá trị** Pāli theo phép của lớp lấp; dò ở khoá thì ra 0. Điền `First.`. ⚠ **CẢNH BÁO**: bài này có **năm** bài con (`2`–`6`) nhưng chỉ **một** nhãn thứ tự, đúng kiểu lệch đã gặp ở `an4.107`. Tầng ghim có lời ở **0** khoá nhãn trên toàn tầng, nên không có mẫu nào để bám; lớp lấp dùng đúng một dạng cho mọi dạng (0 ngoại lệ trong các khoá nhãn đã có). Không tự bỏ nhãn.

  COVERAGE, đo đúng theo quy tắc của kho (Pāli ≥ 40 ký tự sau khi chuẩn hoá khoảng trắng, bỏ khối tham chiếu `:0`): mẫu số **30**, trước **15/30 = 0,5000**, sau **30/30 = 1,0000**. Biên an toàn: mất tới **6** khoá phủ vẫn còn 0,8000; mất **7** là rớt (23/30 = 0,7667). Trong số 21 khoá lấp có **6** không vào mẫu số vì Pāli < 40 ký tự (năm tiêu đề `.0` và nhãn `6.6`) — chúng vẫn được điền vì thuộc tập lấp được. 🔴 Lớp lấp **chỉ** tính vào coverage khi `published`: nếu để `draft`/`review` thì ratio của bài **vẫn là 0,5000** dù tệp đã đủ 21 khoá.

