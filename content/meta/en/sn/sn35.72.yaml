notes: |-
  Tiền lệ: `sn35.72:5.1` + `5.2` (mắt) và `11.1` + `11.2` (tâm) của **chính bài này** đã có chữ Sujato, lần lượt là “…with right wisdom that: ‘This is not mine, …’” và “In this way you will give up the [first|sixth] field of contact, so that there are no more future lives.” 8.1 gộp cả hai vế cho `jivhā` + `catutthaṁ`; `paṭhamaṁ`/`chaṭṭhaṁ` ở 5.2/11.2 là “first”/“sixth”, nên `catutthaṁ` là “fourth”.

  Pāli ở 8.1 viết `nesohamasmi na meso attā’ti` (thiếu dấu phẩy so với `5.1` và `9.1`); Sujato ở 5.1 đã tự chèn dấu phẩy, ta theo bản đã ghim. Dấu `…` cuối khoá ứng với `…pe….`; `“` ngoài khép ở `11.2`, nên ở 8.1 không đóng ngoặc ngoài. Khoá 7.1 và 11.3 cũng fillable nhưng không thuộc lát này.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
