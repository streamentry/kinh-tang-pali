notes: |-
  1.4 đã ghim sẵn cả bộ từ: "One meditator is skilled in remaining in immersion but not
  in emerging from it." 1.5 đảo hai vế trên đúng khuôn ấy; 1.6 và 1.7 lấy "skilled neither
  in X nor in Y" (3 lần trong SN đã ghim, sn34.2:1.6) và "skilled both in X and in Y"
  (5 lần, sn34.2:1.7). `jhāyī` = "meditator" theo chính 1.2 và 1.4 của bài này.

  Khác bản đã ghim ở 1.4 một chỗ có chủ ý: 1.4 dùng "emerging from it", còn 1.5–1.7 ở đây
  viết "emerging from immersion" / "remaining in immersion" đủ danh từ. Lý do: ở 1.4 danh
  từ "immersion" đã đứng trước nên "it" rõ; ở 1.5–1.7 mỗi vế là một mệnh đề độc lập đọc
  trong cột English của trình đọc bốn bản, nên "it" sẽ trôi. Đây cũng là khuôn chiếm ưu
  thế trong 37 câu "skilled in X but not in Y" đã ghim, phần lớn đều gọi đủ danh từ.

  `ṭhitikusalo` = "remaining in immersion", `vuṭṭhānakusalo` = "emerging from immersion":
  lấy từ 1.4 đã ghim. `triangulation` 8.0 là đặc thù của lớp lấp, không phải thiếu sót.
  `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp, vì đây là
  bản Anh chứ không phải bản Việt.
