notes: |-
  1.3 của chính bài đã ghim, cho CẢ BA vế Pāli: "A lady lives at home with heart full of the stain
  of stinginess in the morning, jealousy in the afternoon, and sexual desire in the evening." 1.4
  và 1.5 của tôi là hai khoá riêng, nên tôi dịch lại từng khoá — lặp, nhưng Pāli cũng lặp, và luật
  2 của lớp cấm lược.

  Tiền lệ và MỘT CHỖ TÔI CỐ Ý LỆCH: an3.129:2.3 có Pāli gộp đúng ba vế này và được dịch "A lady
  lives at home with a heart full of the stain of stinginess in the morning, jealousy at midday,
  and sexual desire in the evening." Tôi theo bản đã ghim của CHÍNH bài đang dịch (luật 3), nên
  giữ "with heart full" (không có mạo từ) và "in the afternoon" cho `majjhanhikasamayaṁ` — an3.129
  dịch là "at midday". Ghi rõ vì đây là khác biệt có thể bị coi là sai.

  Từ ngữ: `issāpariyuṭṭhitena` → "jealousy" và `kāmarāgapariyuṭṭhitena` → "sexual desire" lấy từ
  chính 1.3 đã ghim. Lưu ý: `kāmarāgapariyuṭṭhitena` nói riêng còn 19 cặp dịch "overcome and mired
  in sensual desire" (mn64:5.11, sn46.55, sn46.56) — nhưng ở đây 1.3 đã ghim "sexual desire" cho
  đúng cụm trong cùng câu, nên tôi theo 1.3. `sāyanhasamayaṁ` → "in the evening" (an3.19:1.3,
  an3.129:2.3). `majjhanhikasamayaṁ` → "in the afternoon" theo 1.3 đã ghim.

  Hạ `grammar_logic` / `vietnamese_clarity` 9.3 vì "with heart full of jealousy" lặp y nguyên cụm
  của 1.3; đó là hệ quả của việc bản đã ghim gộp sẵn ba vế.
