notes: |-
  3.8 / 3.9 / 3.10 trùng NGUYÊN VĂN 3.2 / 3.3 / 3.4 đã ghim, luật 3 bắt chép y hệt — kể cả
    việc 3.2 mở đầu bằng chữ thường, nên khi đọc liền 3.7 ("…might happen.") sang 3.8 sẽ thấy
    chữ thường giữa câu. Đó là hệ quả của luật 3, không phải lỗi đánh vần; 3.11 (lát khác)
    nối tiếp bằng "before driving them away." nên cả đoạn vẫn đọc được.

    4.28 `viññāṇaṁ samanvesato yāvatā viññāṇassa gati` là mục CUỐI của danh sách 4.25–4.28
    (4.26 `saññaṁ …`, 4.27 `saṅkhāre …` thuộc lát khác). Bất định: 4.24 đã ghim cùng idiom
    `yāvatā … gati` là "anywhere they might be reborn" — cách diễn giải mở rộng của Sujato; còn
    kho đang dùng "as far as X" (19×) và "range of vision" / "range of the mind" (10×) cho
    đúng idiom này. Chọn "as far as the range of consciousness" vì 4.25 đã ghim sẵn "search"
    rồi và vì đây là cách đọc trung thày. Kết bằng dấu phẩy vì 4.29 đã ghim bắt đầu bằng
    chữ thường ("their ideas of 'I' or 'mine'…").
