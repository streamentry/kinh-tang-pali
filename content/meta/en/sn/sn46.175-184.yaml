notes: |-
  Dòng colophon phẩm. Khuôn lấy từ bản Anh đã ghim của CHÍNH bài này: 3.3
  (`Bojjhaṅgasaṁyuttaṁ dutiyaṁ.`) → "The Linked Discourses on the Awakening Factors, the second section.";
  cùng khuôn ở sn45.180:6.6, sn47.95-104:4.5, sn48.169-178:2.5, sn56.131:4.5.

  Bất định đã ghi: Pāli đảo trật tự so với khuôn trên — `Bojjhaṅgasaṁyuttassa` (sở hữu) đứng trước,
  `punaoghavaggo` (chủ ngữ) đứng sau. Không có cách nào dịch theo khuôn mà không làm sai nghĩa, nên đặt
  tên phẩm làm chủ ngữ. Tên phẩm lấy đúng 0.2 của bài: "Another Chapter on Floods". `aṭṭhārasamo` = thứ
  mười tám, khớp số 18 ở 0.2.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
