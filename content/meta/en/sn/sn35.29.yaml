notes: |-
  Luật `sn11.24` áp dụng: **PĀLI của 1.11 Y HỆT PĀLI 1.15**, nơi bản đã ghim đã có chữ — “Overcome by greed, hate, and delusion. Overcome by rebirth, old age, and death, by sorrow, lamentation, pain, sadness, and distress, I say.” Giữ nguyên bộ từ đó, và đặt “I say” ngoài ngoặc vì Pāli đóng `’` trước `vadāmi`.

  **BẤT ĐỊNH LỚN NHẤT CỦA LÁT NÀY, CẦN NGƯỜI BIÊN TẬP PHÁN XỬ:** Pāli của 1.11 khác với 1.8 ở chỗ **không** có vế `Rāgagginā, dosagginā, mohagginā`, nhưng Sujato vẫn dịch 1.15 như thể có. Đây là chỗ lệch giữa Pāli gốc (chân lý) và bản đã ghim. Ta chọn giữ vế của Sujato, vì (a) luật `sn11.24` nói rõ phải dùng lại cách dịch đã có cho Pāli trùng chứ không dịch lại từ Pāli lẻ, (b) 1.11 và 1.15 trả lời **cùng một câu hỏi** “Kena addhabhūtaṁ?”, nên phải cho cùng một câu trả lời, và (c) bỏ vế đó sẽ làm bài tự mâu thuẫn với 1.15 mà không ai có thể sửa. Lựa chọn ngược lại sẽ bị coi là thêm chữ không có trong Pāli — nên đây là điểm cần ghi, không phải điểm đã chắc. Hệ quả trung thực: cột Pāli ở 1.11 ngắn hơn cột Anh một vế, và người đọc sẽ thấy điều đó.

  Khoá 1.10 và 1.20 cũng fillable nhưng không thuộc lát này.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
