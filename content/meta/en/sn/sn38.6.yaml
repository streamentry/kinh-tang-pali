notes: |-
  Cấu trúc 1.6–1.11 TRÙNG NGUYÊN VĂN với sn38.1:2.7–2.12, sn38.2, sn38.3, sn38.4 và sn38.5 — cùng một loại
  `Katamo pana…` / `Ayameva kho…` / `Ayaṁ kho…` / `Bhaddako…` / `Alañca panāvuso sāriputta…`, chỉ khác mã
  `paramassāsappatto`. Bản Anh đã ghim của chính sn38.1 cho sẵn cả năm câu, nên lớp lấp dựng lại trên đó:
  "noble eightfold path", "This is the path…", "a fine path, a fine practice", "Just this much is enough
  for diligence". Riêng `paramassāsappatto` dùng đúng từ đã ghim ở 1.1/1.3 ("ultimate solace").

  Hai chỗ CỐ Ý LỆCH khỏi bản đã ghim, và đều vì Pāli:

  - Ở sn38.1:2.7–2.8 Sujato bỏ vế `etassa … sacchikiriyāyā` ("for realizing …") vì nó đã nằm ở câu hỏi 2.5.
    Ở đây 1.5 của chính bài này là `“There is.” …`, nên bỏ vế ấy là mất một semantic unit; lớp lấp giữ
    lại "for realizing this ultimate solace" ở cả 1.6 và 1.7.
  - Ở sn38.1:2.12 Sujato bỏ luôn cách xưng hô `panāvuso sāriputta`. 1.11 giữ nó: "Reverend Sāriputta".

  Bất định đã ghi nhận:

  - `bhaddako … bhaddikā` ("tốt … tốt hơn") bị làm phẳng thành "a fine path, a fine practice" vì bản đã
    ghim dùng như vậy cho đúng câu đó ở sn38.1–38.5 và bản Việt dự án cũng tách "tốt/tốt hơn". Lớp lấp
    chọn giữ tiền lệ đã ghim để ngang hàng với 1.1–1.5, đổi lại mất dấu so sánh. Đề nghị một lượt
    Việt sau ghi nhận điểm này.
  - 1.8 (`sammādiṭṭhi …pe… sammāsamādhi.`) trống ở mọi tầng và KHÔNG thuộc lát này, nên 1.7 dừng ở
    "that is—" rồi đứt. Hạ `vietnamese_clarity`.
  - `triangulation` 8.0: người viết lớp lấp cũng là người chấm, không có bản Anh độc lập để đối chiếu ở
    đúng những segment này.
