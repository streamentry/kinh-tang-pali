notes: |-
  Lát 602. Hai mươi tám khoá lấp = hai mươi tám khoá tầng Anh đã ghim để trống; 23 khoá có nội dung, 5 khoá dưới
  ngưỡng (`6.9` `6.13` `6.18` `Mayhaṁ kho satthā evaṁvādī evaṁdiṭṭhi—`, `8.6`, nhãn `14.4` `Aṭṭhamaṁ.`) vẫn lấp.

  **Bốn nhóm khoá (đo bằng máy trên 105 khoá Pāli):** A **8** · B **10** · C **8** · D **2**.

  - **A (8)**: `6.8` `6.12` `6.17` (= `6.22`), `6.16` (= `6.21`), `8.7` `9.6` (= `7.15`), `8.8` `9.7` (= `7.16`), đều
    nguyên văn lời đã ghim.
  - **B (10)**: `3.3` (từ `2.3`, 0,84) và `4.2` (từ `5.2`, 0,80): chỉ thay hành vi (“stealing”, “committing sexual
    misconduct”); `6.9` `6.13` `6.18` (từ `6.5`, 1,0): bỏ nháy `‘` mở vì Pāli không mở; `6.10` `6.19` (từ `6.6`,
    0,80): lời đã ghim ở `6.6` **gộp cả bốn giới** vào một câu trong nháy kép, trong khi Pāli `6.6` chỉ nói sát sinh
    và không có nháy — lớp lấp tách đúng từng giới, không nháy (“Everyone who steals goes to a place of loss, to
    hell.”); `8.2` (từ `10.2`, 0,80), `8.5` (từ `7.13`, 0,83), `9.5` (từ `10.4`, 0,80).
  - **C (8)**: `6.14` (giới thứ ba, có `’` đóng theo Pāli `nerayiko’ti`), `8.3` `9.3` (khuôn `7.10` đã ghim “That’s
    not right, it’s not good,” — lời đã ghim bỏ mệnh đề quan hệ `yaṁ kho pana mayā … yāvatakaṁ vā tāvatakaṁ vā`; lớp
    lấp theo khuôn đó cho khớp `7.10`/`10.3`), `8.4` `9.4` (Pāli = `7.11` + `7.12` gộp ⇒ ghép đúng hai lời đã ghim),
    `8.6` (khuôn `7.14`), `9.2`, nhãn `14.4` “Eighth.” (bài thứ tám của phẩm, khớp).

  **D (2) — báo, không hòa: `3.4`, `4.3`.** Pāli trùng nguyên văn `2.4` và `5.3`, nhưng tầng đã ghim dịch hai khoá
  đó khác nhau: `2.4` “the Jain ascetic of the Ñātika clan”, `5.3` “the Jain Ñātika”. Lớp lấp chọn cách của `5.3`
  vì đó là cách tầng đã ghim dùng ở 4/6 lần nhắc tên trong bài (`1.4`, `1.7`, `1.8`, `5.3`; cách dài chỉ ở `1.3`,
  `2.4`). Hệ quả: `3.4`/`4.3` khác `2.4` đúng ở cụm tên ấy; không sửa `2.4`.

  **Dấu lược:** 0 trong Pāli của 28 khoá, 0 trong lớp lấp. **Nháy:** 28/28 khớp Pāli (`3.4`/`4.3` mở `“‘`, đóng
  `’` như Pāli).

  **Coverage (đo bằng phép của `englishCoverageFor`: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước: 65/88
  = 0.7386. Sau khi lớp lấp `published`: 88/88 = 1.0. Độ nhạy: phải mất thêm 18
  khoá có nội dung nữa thì bài mới rớt dưới ngưỡng 0,8. Lớp lấp chỉ được tính khi `status: published`.
  `sn/sn42.8` **có** record trong `content/meta/reference-gaps.yaml` (substantive 88, thiếu 23); record đó sẽ thành thừa khi lớp lấp `published`. Lát này **không** chạm tệp đó; người điều phối sinh lại bằng `npm run reference:gaps`.

  **Hai cơ chế khoá trống ở tầng Anh đã ghim (đo, không sửa).** Cắt cụt dãy (≥ 4 khoá trống liên tiếp):
  3 dãy / 17 khoá / 1.098 ký tự Pāli. Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 21/28 khoá trống vào nhóm
  (kiểm `kết quả ≤ số khoá trống`: đạt).

  **Triangulation ≤ 8,0.** Scorecard Việt của bài (`content/meta/sutta/sn/sn42.8.yaml`) ghi `translators` và `quality.assessed_by` là công cụ cùng họ với lớp lấp — **cùng
  alias công cụ** với lớp lấp này (khai trong `source/tooling.yaml`). Vì vậy bản lấp **không phải** cách đọc
  English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá lấp.
  Không có bản Anh thứ hai; đối chiếu có: Pāli root + Sujato đã ghim (cho khoá anh em) + bản Việt canonical (chỉ
  để đối chiếu nghĩa, không dịch vòng, không chép).

  **technical_integrity 9,6.** Lát này không được chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh
  còn nợ: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Tự kiểm đã làm: JSON parse, mọi khoá
  thuộc `fillableSegments`, không khoá nào trùng khoá Sujato có chữ (0 shadow), NFC, không khoá rỗng, dấu lược
  khớp Pāli (`…pe…` = một `…`), nháy khớp Pāli từng khoá trừ các ngoại lệ ghi ở trên.
