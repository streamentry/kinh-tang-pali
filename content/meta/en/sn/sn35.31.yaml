notes: |-
  1.13 trùng NGUYÊN VĂN 1.7 và 1.19 → lấy lại đúng câu đã ghim. 1.12 theo đúng khuôn 1.18 đã
    ghim (cùng khuôn với 1.6 cho mắt), chỉ đổi cơ quan. 1.11 / 1.17 theo bộ từ kho đã dùng
    ("tongue consciousness", "tongue contact", "mind consciousness", "mind contact" — đếm được
    trong tầng sn).

    Bất định đã ghi, hai chỗ:
    (1) 1.6 đã ghim `cakkhuviññāṇaṁ na maññati, cakkhusamphassaṁ na maññati` = "eye consciousness
    … eye contact." — có dấu lược giữa hai vế. Pāli 1.11/1.17 KHÔNG có dấu lược, mà luật 4 đòi
    số dấu lược khớp từng khoá, nên không thể chép `…`; dùng dấu phẩy, cũng là cách Pāli lược
    lặp `na maññati`. Đọc liền với 1.9/1.10 đã ghim ("…tongue …") và 1.15/1.16 ("mind …") thì
    vẫn thành một danh sách.
    (2) Ngoặc kép: Pāli 1.12 và 1.13 không có ngoặc nào, còn bản đã ghim 1.6/1.18/1.19 dùng ngoặc
    cong; luật 4 chỉ đếm `“` và `‘` nên không thể chép. Kho đã gặp đúng bài này ở sn35.90:2.7 và
    sn35.91:2.5 (cùng Pāli, cùng chỗ) và dùng ngoặc thẳng — theo đúng tiền lệ đó.
