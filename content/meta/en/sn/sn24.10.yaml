notes: |-
  2.4: Pāli trùng NGUYÊN VĂN với 2.9 (Sujato) = "But by not grasping what’s impermanent,
  suffering, and perishable, would such a view arise?” → dùng lại y hệt, chỉ đổi `?` thành `:`
  theo Pāli và bỏ `“` mở (Pāli 2.4 không có).

  2.7: Pāli trùng NGUYÊN VĂN với `sn24.2:2.12` và `sn24.7:3.17`, cả hai đều là Sujato: "“That
  which is seen, heard, thought, known, attained, sought, and explored by the mind: is that
  permanent or impermanent?” → dùng lại y hệt. Pāli kết `”ti?` nên chốt đếm `_đóng` = 2, bản
  lấp thêm `’` → `’?`, đúng khuôn của `sn24.19:3.15`. Đây là hệ quả thẩm mỹ của quy ước đếm
  theo Pāli, không phải lựa chọn; `ambiguity_integrity` hạ vì vậy.

  Lưu ý 2.2 (`viññāṇaṁ niccaṁ vā aniccaṁ vā”ti?`) và 2.3, 2.5, 2.6, 2.8 vẫn trống: chúng
  fillable nhưng không thuộc lát 6, nên cột Anh của lát này ở sn24.10 vẫn có lỗ hổng.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
