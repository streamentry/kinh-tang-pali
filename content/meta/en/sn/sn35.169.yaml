notes: |-
  Tiền lệ: `sn35.169:1.1` (Sujato) đã dịch `“Yaṁ, bhikkhave, aniccaṁ, tatra vo rāgo pahātabbo.` thành “Mendicants, you should give up greed for what is impermanent.”; 1.9 là chính câu đó, thêm `”ti.` nên phải đóng ngoặc. Khuôn câu chốt lấy từ `sn35.168:1.6` — cùng phẩm `Saṭṭhipeyyālavagga`, cùng hình dạng `Yaṁ, bhikkhave, aniccaṁ, …”ti.`, nơi Sujato bỏ xưng hô và viết hoa `You` để mở lại lời nói. `rāgo` = “greed” theo 1.1 của chính bài này. Không bất định.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
