notes: |-
  22 khoá = **đúng** tập khoá mà tầng Anh đã ghim để trống, đo bằng máy: Pāli 100 khoá, ghim
  trống 22, lớp lấp 22 — không dư, không thiếu, không khoá nào shadow. **Không còn khoá trống nào.**

  BỐN SỐ A/B/C/D (mục 2.1) — **A 6 · B 7 · C 9 · D 0**, tổng 22.
  - A (6): `2.9` + `2.13` (Pāli hai khoá này **trùng byte**), và `16.5` `16.7` `16.9` `16.24`
    (Pāli `"No hetaṁ, bhante". ` trùng byte với 10 khoá đã có lời: `8.1` `14.1` `16.3` `16.11`
    `16.14` `16.16` `16.26` `17.3` `17.6` `17.11`, và trùng byte với nhau). Cả bốn lấy **y nguyên
    văn** `“No, sir.” ` của `16.3`; `2.9` và `2.13` lấy **y nhau** — máy đo ra đúng một lời.
  - B (7), dựng lại từ lời đã có; tỉ lệ khớp đo bằng chuỗi ký tự đã bỏ dấu câu:
    `2.6`←`1.3` 0,841 · `2.7`←`1.4` 0,913 · `2.8`←`1.5` 1,000 · `2.12`←`17.8` 1,000 ·
    `2.15`←`1.9` 0,814 · `2.16`←`1.10` 1,000 · `2.17`←`1.11` 0,863.
    Phần tầng ghim nuốt mất mà lớp lấp chèn lại: `2.6` mượn “with him” của 1.3 và sửa thành
    “went up to **me** … **with me**” (`mayā saddhiṁ`); `2.7` 1.4 gộp vế thứ hai vào “and said to
    him”, lớp lấp mở lại thành “Seated to one side, sir, … said this to me”; `2.15` chèn `bhante`
    → “sir” và `maṁ` → “to me”; `2.17` chèn `maṁ` → “me” và `bhante` → “sir”.
  - C (9): `2.5` `2.10` `2.11` `2.14` `2.18` `2.19` `9.2` `17.10` `17.14` — dịch từ Pāli.
  - D (0): đã dò mọi nhóm Pāli trùng byte **trong chính bài** — nhóm `“No, taṁ…bhante”. ` gồm 14
    khoá, 10 khoá đã có lời và cả 10 đều mang **cùng** một lời `“No, sir.” `. Không có mâu thuẫn để
    báo, nên không hòa gì cả.

  ĐỐI CHIẾU CHéo MẠNH NHẤT CỦA LÁT: `sn22.86` (cùng bài Anurādha, 16 khoá lấp đã `published`) có
  Pāli **trùng byte** với `2.11` `2.15` `2.17` `2.18` của bài này. Lớp lấp kia đã xử những đoạn ấy,
  nên đây là tiền lệ đo được chứ không phải phỏng đoán.

  MỘT LỖI ĐÃ BẮT KHI KIỂM LẠI (đã sửa): `2.15` đọc **“When he had said this”**, bắt từ `1.9` của
  tầng ghim. Nhưng Pāli `Evaṁ vutte, bhante, te aññatitthiyā paribbājakā maṁ etadavocuṁ:` có chủ
  thể **số nhiều** — những kẻ lang thang vừa nói, và chính chúng nói tiếp `etadavocuṁ`. Đã sửa thành
  **“they”**, khớp với lớp lấp đã publish cho Pāli trùng byte tại `sn22.86:5.5`. Vế đối chiếu ngay
  bên cạnh xác nhận: `2.11` (`vuttāhaṁ`, ngôi một) đúng là “When **I** had said this”, nên hai
  vế phải khác ngôi. Sửa lỗi số của tầng ghim, không đổi nghĩa.

  DẤU NHÁY — đo trước, ghi cả hai số. Trên 22 khoá: Pāli có `“` 9 · `”` 10 · `‘` 5 · `’` 5; lớp lấp
  có `“` 11 · `”` 11 · `‘` 5 · `’` 5. **Có đúng hai khoá lệch, đều có chủ đích:**
  - `2.17`: Pāli **không** có dấu nháy nào, lớp lấp đặt `“junior”` `“foolish”`. Đây là ngoại lệ
    được phép: tầng ghim dịch đúng câu Pāli ấy ở `1.11` bằng đúng hai nháy kép ấy, và lớp lấp đã
    publish cho Pāli trùng byte (`sn22.86:5.7`) cũng vậy. Bám khoá anh em trong bài, không tự sửa.
  - `17.10`: Pāli có `‘` `’` **và** `”`; lớp lấp giữ `‘…’`, **bỏ đúng một** `”`. Lý do: `”` ấy
    đóng lớp vỏ ngoài `“` mở ở `17.7`, nhưng tầng ghim đã đóng sớm nó ngay ở `17.9` (Sujato mở
    rộng `…pe…` thành đủ bốn vế và dấu `’?”` bị kéo lên `17.9`). Giữ `”` ở `17.10` sẽ để lại một
    dấu đóng không có dấu mở. Cùng cách xử đã dùng ở `sn44.11` và `sn22.86:6.3`.
  Ngược lại, **năm** khoa đã sửa vì lệch Pāli: `2.9` `2.13` `2.10` `2.14` (thiếu cặp `“…”` bao
  mỗi vế `ṭhāna`) và `17.10` (thiếu `‘…’`). Đo toàn tầng lấp đã publish: trong các khoá mà Pāli có
  cặp nháy bên trong một khoá, **412** khoá giữ dấu nháy và chỉ **10** khoá bỏ hết; riêng họ mệnh đề
  `… tathāgato paraṁ maraṇā …` thì **36/47** khoá có lời. Lớp lấp `sn22.86` — cùng bài, đã publish
  — làm đúng như vậy ở `4.5/4.6` (Pāli không có nháy thì không thêm) và ở `5.3/5.4` (Pāli có `‘…’`
  thì giữ). Lớp lấp này bám theo đúng quy ước đó. Hệ quả phải nói thẳng: cột English đọc liền sẽ
  thấy `1.6`/`17.9` (tầng ghim) không nháy quanh danh sách bốn vế, còn `2.9`/`2.10` của lớp lấp thì
  có — đó là hệ quả của tầng ghim, không sửa được mà không đụng tầng ghim (tức là shadow). Hạ
  `vietnamese_clarity` 9.0 vì việc này.

  DẤU LƯỢC: Pāli có `…pe…` ở `2.9` `2.13` `9.2` — mỗi khoá **đúng một** `…`. Lớp lấp: 3 dấu `…`,
  không mở rộng chỗ nào. Dấu nhạt lượu: toàn bộ lớp lấp **không có** dấu nhạt lượu tiếng Anh nào
  (0 dấu `’` đứng sau một trong bảy hậu ngữ `s/t/re/ve/ll/d/m`); mọi `’` trong tệp đều là dấu đóng
  nháy của Pāli, kể cả `’` cuối `2.10` `2.14` và `’?”` cuối `2.19`.

  HAI CƠ CHẾ GÂY RA KHOÁ TRỐNG (đo riêng, không kết luận "gộp khoá"):
  - **A — cắt cụt dãy** (dãy ≥ 4 khoá trống liên tiếp): **1 dãy**, `2.5`–`2.19`, **15 khoá**,
    **1.478 ký tự** Pāli. Tầng ghim dịch tới `2.4` rồi im luôn đúng một khối lớn; đây là nguyên nhân
    gần như toàn bộ khoá trống của bài.
  - **B — bỏ dòng song song** (≥ 2 khoá trống trùng ≥ 70% thân từ): **18 cặp**, trên **13 khoá**,
    **789 ký tự** Pāli. Nói thẳng để không bị hiểu sai: ở bài này phép B ra lễp vì **lặp của
    abeyyākata**, không phải vì tầng ghim bỏ dòng diễn giải song song — các cặp là nhóm bốn vế
    `2.9/2.10/2.13/2.14/17.10` và nhóm đáp trả lời lặp `16.5/16.7/16.9/16.24`. Đo rồi báo, không
    sửa: sửa tầng ghim là shadow.
  - Lỗ hổng của bộ đo coverage (mục 5d) xuất hiện ở đây **2** khoá của **tầng ghim** có lời nhưng
    ngắn hơn Pāli quá nửa: `2.1` (85→43 ký tự, 51%) và `15.2` (42→21, 50%). Không phải lỗi lớp lấp.

  NHÃN THỨ TỰ (mục 5e, dò ở **giá trị Pāli**): `17.14` `Dutiyaṁ.` → **“Second.”**. Bài này đúng là
  bài thứ hai của Ābyākatavagga, nên **không** có cảnh báo lệch số mục. Đo lại toàn tầng: **2.993**
  khoá nhãn thứ tự (chỉ ở `an` `sn` `iti` `ud`), tầng Anh đã ghim có lời ở **0** khoá = **0,00%**;
  lớp lấp nay có **45** khoá, 45/45 đã điền, **13** dạng bề mặt, **0** ngoại lệ. Lỗi ngoài lát, báo
  không sửa: `an10.86:20.3` viết `"Sixth. "` có dấu trắng thừa, lệch với 44 khoá còn lại.

  COVERAGE (mẫu = Pāli ≥ 40 ký tự, bỏ khối `:0`; mẫu số **49**): trước **35/49 = 0,7143**, sau khi
  lớp lấp `published` là **49/49 = 1,0000**. Ngưỡng 0,8 cần 40 ⇒ biên **9**; phải mất thêm **10**
  khoá đã phủ (xuống 39/49 = 0,796) mới rớt. Tám khoá trong 22 khoá lấp **dưới** ngưỡng 40 ký tự
  (`2.9` `2.13` `9.2` `16.5` `16.7` `16.9` `16.24` `17.14`) nên vốn không vào coverage; sau lớp lấp
  không còn khoá Pāli có nội dung nào thiếu English. Trong `content/meta/reference-gaps.yaml`
  **không** có record cho `sn44.2`, nên không có gì thành thừa ở file đó.

  TRIANGULATION 8,0 — mức thường của lớp lấp. Bài này **không** có bản Việt project,
  `content/meta/sutta/sn/sn44.2.yaml` không tồn tại, và ở commit đã ghim `vietnamese-current` chỉ có
  Pháp Cú — **không có lớp Việt nào** để đối chiếu, và cũng không có scorecard Việt cùng nhóm công
  cụ. Vì vậy bài này **không** được tuyên bố là đã đối chiếu English. Đối chiếu thực tế là: Pāli
  root + tầng Anh đã ghim của chính bài + lớp lấp đã publish của `sn22.86` cho bốn khoá Pāli trùng
  byte.

  `technical_integrity` 9,6: không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build` trong lát này, nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho
  người điều phốn.