notes: |-
  1.1 có Pāli GIỐNG HỆT sn37.24:1.1, đã ghim "“Anuruddha, when ladies have five qualities, when
  their body breaks up, after death, they are reborn in a good place, a heavenly realm." — chép
  nguyên văn theo luật 3. Không có `…pe…` ở hai khoá này nên không phải giữ dấu lược nào.

  1.4 có Pāli GIỐNG HỆT CẢ HAI bản ghim: sn37.24:1.4 và sn37.15:2.4, đều là "When ladies possess
  these five qualities, when their body breaks up, after death, they are reborn in a good place, a
  heavenly realm.” — hai nguồn độc lập trùng nhau nên độ tin cậy cao. Lớp fill sn37.23:1.2 cũng
  dùng đúng câu này cho cùng Pāli.

  Vế `sugatiṁ saggaṁ lokaṁ` → "a good place, a heavenly realm" lấy từ ba bản ghim nói trên; đây là
  nghĩa ngược với `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ` ("a place of loss, a bad place, the
  underworld, hell") ở các bài cùng nhóm, nên hai chiều đã được kiểm chéo với nhau.
