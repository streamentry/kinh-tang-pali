notes: |-
  KHÔNG có tiền lệ nguyên văn cho 1.5, 1.6, 1.7 — đã dò toàn bộ SN đã ghim và không vế
  nào trùng. Lý do giống sn35.165: bản đã ghim đã gộp cả 1.4 vào một câu ("knowing and
  seeing the eye, sights, eye consciousness, and eye contact as suffering,
  substantialist view is given up.").

  Ba khoá dựng lại từ đúng bộ từ 1.4 đặt sẵn. `sakkāyadiṭṭhi` = "substantialist view" theo
  1.3, 1.4 và 1.9 đã ghim (không dùng "self-view" hay "personal view"); `dukkhato` =
  "as suffering" theo 1.4 và 1.8 đã ghim. Đối chiếu chéo: sn35.165 dùng đúng khuôn "knowing
  and seeing … , <view> is given up" với "as impermanent" và "wrong view", nên hai bài
  đọc song song.

  Hệ quả phải ghi: 1.5–1.7 lặp nội dung 1.4 đã ghim, nhưng lặp đó có trong Pāli.
  `ambiguity_integrity` hạ vì không có tiền lệ từng khoá. 1.10 (`Ekādasamaṁ.`) và 1.2
  vẫn để trống vì thuộc lát khác. `triangulation` 8.0 là đặc thù của lớp lấp.
