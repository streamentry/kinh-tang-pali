notes: |-
  2.2, 3.2, 4.2 và 5.2 có Pāli GIỐNG HỆT NHAU (cả bốn đều là `evameva kho, bhikkhave,
  attavadhāya devadattassa lābhasakkārasiloko udapādi, parābhavāya devadattassa
  lābhasakkārasiloko udapādi.`), và 5.2 đã được ghim thành "In the same way, possessions,
  honor, and popularity came to Devadatta for his own ruin and downfall." Luật 3 bắt ba khoá
  lấp lấy y hệt cụm ấy.

  Đây là bài lặp nhiều nhất trong lát (Pāli giống hệt ở bốn chỗ), nên cả ba khoá lấp trùng
  nhau là ĐÚNG, không phải lỗi lặp. Người đọc bốn cột sẽ thấy Pāli giống nhau ở 2.2/3.2/4.2/
  5.2 — đó chính là cái tệp Pāli thật sự có, và giấu nó đi mới là sai.

  Không có bất định: mọi từ đều lấy từ bản ghim của chính bài, không tự dịch.
