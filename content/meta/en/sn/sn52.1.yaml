notes: |-
  Cả bảy khoá này là **chép lại nguyên văn** cách dịch đã có, vì Pāli của chúng **trùng byte** với khoá đã được tầng Anh đã ghim dịch. Đây không phải lần dịch mới mà là luật "dùng lại cách dịch đã có" của lớp lấp: bài sẽ tự mâu thuẫn nếu tôi dịch lại từ đầu.

  Đối chiếu từng khoá (Pāli lấy từ Pāli root đã ghim; bản Anh từ `translation/en/sujato/sutta/sn/sn52/sn52.1_translation-en-sujato.json` tại cùng commit đã ghim trong `source/upstream-manifest.json`):
  - `6.1` ≡ `4.1` `So sace ākaṅkhati: 'appaṭikūle paṭikūlasaññī vihareyyan'ti, paṭikūlasaññī tattha viharati;` → chép y nguyên "If they wish: 'May I meditate perceiving the repulsive in the unrepulsive,' that's what they do."
  - `6.2` ≡ `4.2` → chép y nguyên vế `paṭikūle appaṭikūlasaññī`.
  - `6.3` ≡ `4.3` → chép y nguyên vế `appaṭikūle ca paṭikūle ca`.
  - `6.4` ≡ `4.4` → chép y nguyên vế `paṭikūle ca appaṭikūle ca`.
  - `6.5` ≡ `4.5` → chép y nguyên, kể cả "shunning" (đối lập với "ignoring" ở `10.2`; Sujato dùng hai từ này cho cùng Pāli, và tôi giữ nguyên sự phân biệt đó thay vì hòa vào một).
  - `8.1` ≡ `10.1` (cả hai đều kết bằng `…pe…`) → chép y nguyên, giữ đúng một dấu lược ` … `.
  - `8.2` ≡ `10.2` `upekkhako tattha viharati sato sampajāno.` → chép y nguyên.

  ⚠ Vì sao `8.2` vẫn lấy nguyên văn câu "If they wish: 'May I meditate staying equanimous...'" dù Pāli khoá `8.2` chỉ có vế sau. Lý do: Sujato ở `10.2` đã gộp luôn vế trước (nằm trong `…pe…` của `10.1`) vào một câu; nếu tôi dịch `8.2` theo đúng phạm vi Pāli ("abide equanimous there, mindful and aware") thì cột Anh của chính bài này sẽ có hai cách nói khác nhau cho **cùng một câu Pāli** ở `8.2` và `10.2`. Bản Việt canonical cũng vậy: `6.5` và `8.2` đều dịch cùng một vế. Đây là ưu tiên tính nhất quán nội bộ của lớp lấp, không phải mở rộng `…pe…` — dấu lược ở `8.1` vẫn còn nguyên, người đọc vẫn thấy chỗ bị nén.

  Dấu lược: đếm từng khoá trên cả 39 khoá của bài. Có tám khoá Pāli mang dấu lược: `…pe…` ở `7.1`, `7.2`, `8.1`, `9.1`, `9.2`, `10.1`, và `…` trần ở `7.3`, `9.3`. Trong số đó chỉ `8.1` là khoá lấp của đợt này, và nó giữ **đúng một** `…` — chép từ `10.1` vốn đã vậy. Sáu khoá lấp còn lại (`6.1`-`6.5`, `8.2`) có Pāli **không** dấu lược nào, nên không khoá nào được thêm dấu lúc nào.

  ⚠ **Lớp lấp này KHÔNG phải lớp đọc Anh độc lập cho sn52.1.** `content/meta/sutta/sn/sn52.1.yaml` ghi `quality.assessed_by: "OpenCode Space Bunny Free (agent)"`, đúng công cụ đã viết lớp lấp này, nên `triangulation` hạ xuống **7.5**. Tôi **không sửa** scorecard tiếng Việt. Ngoài ra bài đó còn ghi `blocking_errors`: coverage Anh = 23/30 = 0.767 dưới ngưỡng 0.8 ở `source/layers.yaml`. Lớp lấp này **chữa đúng** chỗ đó — có bảy khoá thì bảy khoá đó có chữ, coverage thành 30/30 = 1.0 — nhưng tôi bị cấm sửa `content/meta/sutta/sn/sn52.1.yaml`, nên trạng thái của bài Việt vẫn là `draft` cho tới khi người điều phối chấm lại.

  Tầng `vietnamese-current` không có cho bài này (đã ghi trong notes bài Việt), nên bản Việt hiện hành cũng không phải tầng đối chiếu được ở đây; đối chiếu chỉ là bản Việt canonical của chính dự án.

  ⚠ **Record gap sẽ thành thừa — cần chạy lại `npm run reference:gaps`.** `content/meta/reference-gaps.yaml` hiện có entry cho bài này, và số trong entry đó **khớp đúng** số tôi đo lại bằng phép của kho. Khi lớp lấp này ở `status: published`, `englishCoverageFor` sẽ tính nó vào coverage và tỷ số thành 1.0; test `a fill never leaves a gap record it has cured` trong `tests/unit/english-fill.test.ts` sẽ **báo đỏ** vì entry ấy không còn mô tả đúng hiện trạng. Tôi bị cấm sửa `content/meta/reference-gaps.yaml`, nên việc gỡ entry nằm ngoài tầm của lát này.

