notes: |-
  BÀI NÀY CÓ BẪY `sn11.24` — đọc 3.4/3.7/3.10 lẻ sẽ thành ba câu hỏi mới, nhưng 3.1–3.12 là
  **Kaccāna kể lại** đúng bốn cặp hỏi–đáp đã nói ở 1.4–2.5. Không tái dùng câu chữ đã ghim thì
  bài tự mâu thuẫn. Vì vậy chín khoá đều **dựa trên** câu chữ đã ghim (một khoá y nguyên văn từng
  chữ, hai khoá là mảnh văn câu, sáu khoá là câu dựng lại từ các cụm đã ghim — không khoá nào dịch
  từ một lời hiểu riêng):

  - 3.4 = y **nguyên văn từng chữ** 1.7, đã kiểm bằng máy. 3.7 và 3.10 lấy y 2.1 và 2.4 nhưng
    **phải sửa một chỗ**, và điều này phải nói rõ: tầng ghim dịch `hoti ca na ca hoti` thành
    “still exists and no longer **exist**”, `neva hoti na na hoti` thành “neither still exists nor
    no longer **exist**” — lệch ngôi động từ ở vế sau. Pāli (`hoti ca na ca hoti`) đòi “still exists
    and no longer **exists**”, và chính 2.3/2.6 của lớp lấp cũng dùng “exists”. Nếu y nguyên văn cả
    “exist”, bài sẽ tự mâu thuẫn: cùng một mệnh đề mà 2.3 nói “no longer exists” còn 3.7 nói “no
    longer exist”. Vì vậy 3.7/3.10 giữ “exists” ở cả hai vế; phần còn lại y nguyên văn. Đây là
    sửa lỗi ngữ pháp của tầng ghim, không phải đổi nghĩa — hệ quả nên hạ nhẹ `ambiguity_integrity`.
  - 3.6 / 3.9 / 3.12 dựng theo đúng khuôn `…iti puṭṭho samāno: … vadesi.` mà tầng ghim đã dùng
    ở `sn44.6:1.5` (“Reverend, when asked these questions, you say that this has not been
    declared by the Buddha.”) cộng với vế “…’ he says.” — không tự phát minh khung mới.
  - 3.11 = y 2.5/1.8, chỉ đổi dấu chấm hai chấm thành gạch ngang `—` vì Pāli 3.11 kết bằng
    gạch ngang và nối thẳng vào 3.12.
  - 2.3 / 2.6: vế trích lại mệnh đề sau câu trả lời đã ghim ở 2.2 / 2.5, lấy y cụm đã ghim.

  Dấu nháy — ghi lại vì đây là chỗ lệch thật: Pāli 2.3, 2.6, 3.6, 3.9, 3.11, 3.12 dùng **nháy
  đơn**, còn tầng ghim dịch đúng câu Pāli ấy ở 1.8 và 2.5 bằng **nháy kép**. Lớp lấp bám dấu
  nháy của chính khoá nó đang dịch, nên đọc 2.5 (nháy kép) rồi tới 2.6 (nháy đơn) thấy hai
  kiểu. Không thống nhất được mà không sửa tầng đã ghim, nên hạ `vietnamese_clarity` 9.0 và
  `ambiguity_integrity` 9.1 cho việc này.

  Một dấu `”` bị bỏ có chủ đích: Pāli 2.3 và 2.6 kết bằng `’”`, vì lớp vỏ ngoài (`“`) của 2.1
  và 2.4 đã bị tầng ghim đóng sớm ở 2.2 và 2.5. Giữ nguyên `’”` sẽ để lại một dấu đóng nháy kép
  không có dấu mở. Lớp lấp dùng cặp nháy đơn khép kín và bỏ **đúng một** dấu `”` thừa ở mỗi khoá;
  đây là biên tập dấu câu, không phải đổi nghĩa. Cùng cách xử lý đã dùng ở `an10.95:1.5/2.3/3.10`
  trong lát này.

  Hệ quả gộp vế — 3.6 và 3.9: vế đầu `‘abyākataṁ kho etaṁ, vaccha, bhagavatā—` nằm ở 3.5 và
  3.8, Pāli chỉ 38 ký tự nên **dưới ngưỡng 40** và không thuộc tập lấp (tầng ghim cũng để trống).
  Nếu không gộp, 3.6 sẽ mở đầu bằng “a realized one no longer exists after death,’ he says.” —
  mất vế “chưa được tuyên bố” và để một dấu nháy không đóng. Vì vậy lớp lấp gộp vế đầu vào
  khoá sau. Đây là hệ quả của ngưỡng đếm, được nói thẳng ở đây; sửa được bằng cách sửa luật đếm
  hoặc Pāli gốc, không sửa được bằng cách sửa lớp lấp. Ngược lại 3.11/3.12 đều trên ngưỡng nên
  được chia đúng mốc Pāli.

  Triangulation 8.0 (mức thường của lớp lấp). Bài này **không** có bản Việt project, không có
  bản Việt hiện hành ở commit đã ghim, và `content/meta/sutta/sn/sn44.11.yaml` chưa tồn tại — không
  có lớp Việt nào để đối chiếu, và cũng không có scorecard Việt cùng họ công cụ. Đối chiếu ở đây
  là Pāli root + bản Anh đã ghim của chính bài.

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate
  pass. Bốn lệnh đó còn lại cho người điều phối.

  Coverage: sau khi lớp lấp này `published`, `sn/sn44.11` lên 23/23 = 1.0. Trong
