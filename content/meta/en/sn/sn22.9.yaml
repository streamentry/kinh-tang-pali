notes: |-
  1.11/1.13 lặp đúng bộ ba khoá mà Sujato đã dịch cho `rūpe` ở 1.4/1.5/1.6 (và lặp lại cho
  `viññāṇe` ở 1.16–1.18): "Seeing this, a learned noble disciple is not concerned with past …," /
  "doesn’t look forward to enjoying future …," / "and they practice for disillusionment,
  dispassion, and cessation regarding present …." `saṅkhārā` = "choices" theo 1.9 (Sujato).

  1.12 (`anāgate saṅkhāre nābhinandati`) nằm GIỮA 1.11 và 1.13 nhưng không thuộc lát 6, nên để
  trống. Hệ quả: 1.11 kết bằng dấu phẩy và 1.13 bắt đầu bằng "and", đúng như 1.4/1.6 để chờ
  1.12 ghép vào. Nếu khoá 1.12 sau này dùng lời khác thì cả ba sẽ không khớp — ghi lại đây
  là phụ thuộc bên ngoài, vì vậy `ambiguity_integrity` không cho điểm tối đa.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
