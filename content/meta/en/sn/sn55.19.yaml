notes: |-
  The passage the pinned English edition left blank.

  Khuôn dùng lại, KHÔNG phải lựa chọn của tôi: 17 tệp fill đã có trong kho (sn55.4/7/11/14/15/16/17/22/28/30/34/36/44/45/46/47/51) dịch nguyên văn `itipi so bhagavā …pe… satthā devamanussānaṁ buddho bhagavāti.` thành “That Blessed One is … teacher of gods and humans, awakened, blessed.” Sujato KHÔNG dịch vế này ở bất kỳ bài sn nào (0 kết quả khi quét “That Blessed One is … teacher of theos”), nên đây là khuôn chính thức của lớp lấp.

  2.2 và 3.2 dùng CHUNG một khuôn dịch với sn55.18 (cùng Pāli, cùng vị trí trong cấu
  trúc, và cả hai bài đều không có bản Việt dự án). Ba bài sn55.18/19/20 là ba bài
  song song nên khuôn phải như nhau.

  Khác sn55.18 một chỗ đáng nêu: ở bài này Sujato dùng QUÁ KHỨ — “have been reborn in a
  good place” (2.3, 3.3) — trong khi sn55.18 dùng hiện tại “are reborn”. Đó là khác biệt
  của bản đã ghim ở hai bài khác nhau, không phải của lớp lấp; hai khoá của tôi nằm ở
  vế danh xưng nên không bị đụng tới. Ghi lại để người biên tập không tưởng là lỗi lặp.

  Phần bị lược `…pe…` là danh sách mười mốc tiêu chuẩn, không phục hồi được; không mở
  rộng. `triangulation` 8.0 theo đặc thù của lớp.
