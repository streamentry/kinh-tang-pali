notes: |-
  **Bốn số (đo bằng máy, ngưỡng 0,80, có xét ghép hai khoá): A = 13 · B = 34 · C = 12 · D = 0.** Ghi 59/59 khoá.

  Ba cơ chế ở tầng đã ghim: (1) `4.3`/`4.6`/`4.9`/`4.12` đã **đóng ngoặc** và để trống mệnh đề bị hỏi (`4.4`, `4.7`,
  `4.10`, `4.13`); (2) `5.1`–`5.2` tóm cả bốn lượt nhắc lại thành “when asked these questions, you say that this has
  not been declared by the Buddha.” rồi bỏ trống `5.3`–`5.12`; (3) `10.1` tóm toàn bộ cuộc hỏi Đức Phật thành “He
  asked the Buddha exactly the same questions … and received the same answers.” rồi bỏ trống `10.2`–`12.4`.

  **Mệnh đề và câu hỏi lấy theo lời đã ghim** `4.2`/`4.5`/`4.8`/`4.11` (“still exist / no longer exist / both … /
  neither …”); B từ đó cho `4.4`–`4.13`, `5.4`–`5.12`, `10.2`–`10.18` (0,80–0,95). Câu “I/me” của Đức Phật
  (`abyākataṁ … mayā`) dịch “has not been declared by me”. `10.19` ← `5.13` (0,95), `11.2` ← `6.2`+`6.3` (1,00),
  `11.10` ← `6.11`, `12.1` ← `9.1` (1,00), `7.2`/`8.3` ← `6.12` (0,92/0,95) chỉ thay “feeling”/“choices”.
  **A (13):** `5.8` ← `5.2`; `7.3`, `8.4`, `11.12`, `12.3` ← `6.13`; `7.4`, `8.5` ← `6.14`; `11.1` ← `6.1`; `11.5` ← `6.6`;
  `11.8` ← `6.9`; `11.11` ← `6.12`; `12.2` ← `9.2`; `12.4` ← `9.4`.

  **Nháy — lệch có lý do, đo từng khoá:** 52/59 khớp Pāli. Lệch 7: `7.4`, `8.5`, `12.4` (Pāli 4 cặp `‘…’` của bốn
  mệnh đề, lời đã ghim `6.14`/`9.4` diễn gián tiếp không nháy — luật A); `11.13`, `11.14` (cùng công thức, theo quy
  ước gián tiếp của `6.14` để không lệch khoá anh em); `5.8` (Pāli `‘`, lời đã ghim `5.2` không nháy — luật A);
  `11.8` (Pāli `“…”`, lời đã ghim `6.9` không nháy — luật A). **Ghi nhận Pāli:** `11.9` mở `“` không đóng và `11.10`
  (lời Đức Phật, `mahārāja`) không mở — bản lấp theo đúng Pāli; người nói ở `11.10` rõ nhờ hô ngữ “Great King”.

  **Cố ý lệch:** `11.9` dịch `Mahā, bhante, samuddo` là “the ocean is vast, sir, …” — lời đã ghim `6.10` (cùng cấu
  trúc `Mahāyye`) bỏ chữ `mahā`. Pāli là authority. **C (12):** khung “namely, that … That’s what you say.” cho `5.3`/`5.6`/`5.9`/`10.15` (cùng khung, `5.12`/`10.18` máy xếp
  B vì gần `4.11`; câu hỏi `5.4`/`5.7`/`5.10`/`10.14`/`10.16` dựng theo khung “When asked, ‘…’ you reply:”); `11.3`/`11.6` giữ `…` của `…pe…`;
  `11.4`/`11.7` “No, sir.”; `11.13`/`11.15`/`11.16` giữ `…` (`11.16` có hai `…pe…` ⇒ hai `…`); `13.11` “First.”.
  Dấu lược: Pāli 7, bản lấp 7 (`10.15` 1, `11.3` 1, `11.6` 1, `11.13` 1, `11.15` 1, `11.16` 2).

  Hệ quả biết trước: câu tóm của tầng đã ghim (`5.1`–`5.2`, `10.1`) **và** lời đầy đủ của bản lấp cùng hiện; nội
  dung trùng nhưng là Pāli có thật. Hạ `grammar_logic` 9,0 và độ sáng English 8,9.

  Coverage: mẫu số 85; trước 46/85 = 0,5412 (**dưới ngưỡng**), sau khi `published` 85/85 = 1,0. Độ nhạy: thêm 17
  khoá trống mới rớt. `sn44.1` **có** record trong `content/meta/reference-gaps.yaml`; record thành thừa sau khi
  `published` — để người điều phối sinh lại.

  Triangulation ≤ 8,0: scorecard Việt của bài này (`content/meta/sutta/sn/sn44.1.yaml`) ghi `assessed_by`/`translators` thuộc **cùng họ công cụ** với lớp lấp (cùng khai trong `source/tooling.yaml`). Vì vậy bản lấp **không** phải cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root + lời Sujato đã ghim của cùng bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

