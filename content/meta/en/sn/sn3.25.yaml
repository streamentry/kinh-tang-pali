notes: |-
  4.5 đi theo cụm ba vế đã ghim ở 4.10/4.12/4.14 ("But there is no place, no domain for
     such X battles when old age and death are advancing."). Bản đã ghim TỰ LẮP bất nhất ở
     đây: 4.10 (bộ binh) bỏ mất danh từ, còn 4.12 và 4.14 giữ ("diplomatic", "monetary").
     4.5 giữ "elephant" theo đa số, vì 4.4 ngay trước đã định danh "battles of elephants" và
     4.10 phải xem ngữ cảnh danh sách mới biết nói về loại nào.
  
  Bất định đã ghi: chữ "But" ở 4.5 không có trong Pāli (`tesampi` = "và những cái ấy
     nữa"). Thêm vào vì ba bản đã ghim cùng cấu trúc đều mở bằng "But"; đây là liên từ
     liên kết, không mang khẳng định nội dung. Đây là lý do hạ ambiguity_integrity.
  
  4.6 phải mở lại danh sách để dẫn 4.7–4.9 (cavalry / chariots / infantry, đã ghim);
     giữ đúng bộ từ bản đã ghim ở 4.4 là "anointed aristocratic kings".
