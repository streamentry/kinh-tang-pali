notes: |-
  Bốn khoá lấp là hai cặp, mỗi cặp ghép vế "Tañce bhikkhu …" với vế kết "ayaṁ vuccati …
  Baddho so / Mutto so …".

  Tiền lệ đã đếm, mọi vế đều có bản ghim trong CHÍNH bài này:

  - `Tañce bhikkhu abhinandati abhivadati ajjhosāya tiṭṭhati—` y hệt ở 1.2 và 3.2.
  - `ayaṁ vuccati … āvāsagato mārassa …` y hệt ở 1.3 và 3.3.
  - `Baddho so mārabandhanena …` là 1.4 đã ghim; `Mutto so mārabandhanena …` là 4.4 đã
  ghim. Cả hai cũng lặp nguyên văn ở 6.3/6.4.

  Bất định đã ghi nhận — điểm quan trọng nhất của lát này:

  - Pāli của 2.2 trùng HAI khoá đã ghim, và HAI bản ghim KHÁC NHAU một chữ:
  1.2 dịch "keeps clinging", còn 3.2 dịch "keep clinging". Đã chọn "keep" theo đếm
  ("keep clinging" 3 lần: 3.2, 4.2, 6.2; "keeps clinging" 1 lần: 1.2). Hệ quả: câu ở
  2.2 không thuận ngữ ("approves, welcomes, and keep clinging") — nhưng đó CHÍNH LÀ
  cách Sujato đã viết ở 3.2, 4.2 và 6.2, nên sửa lại thành "keeps" sẽ làm bài này tự mâu
  thuẫn. Không sửa bản ghim, và ghi lại ở đây để người biên tập thấy đây là lỗi cú pháp
  có sẵn chứ không phải lỗi của bản lấp.
  - 2.3 và 5.3 kết bằng `…pe….`; bản ghim 1.4 và 4.4 BỎ dấu lược, nhưng chốt của kho bắt
  số dấu lược phải khớp theo từng khoá, nên bản lấp giữ đúng một dấu `…` theo khuôn
  sn34.28-34:1.5. Không mở rộng phần bị lược.
  - Cột English của bài vẫn dừng ở 2.3 và 5.3: 1.5–1.6 (`Saddānaṁ …`, `gandhānaṁ …`)
  và 6.4–6.5 không thuộc lát này và còn trống.
  - `triangulation` 8.0; `han_viet_balance` là giá trị mặc định của lớp lấp.
