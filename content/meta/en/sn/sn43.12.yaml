  **Cấu trúc.** Bài là một dãy câu hỏi–đáp “Katamo ca … asaṅkhatagāmimaggo?” / “Ayaṁ vuccati … asaṅkhatagāmimaggo …pe…” cho các nhóm pháp giác ngộ (định, niệm xứ, chánh cần, thần túc, căn, lực, giác chi, đạo chi). Pāli có 25 chỗ lược; lớp lấp ghi đúng 25 `…`.

