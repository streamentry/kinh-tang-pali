notes: |-
  Tiền lệ trong chính bài, hai khoá anh em: `sn35.33:1.9` (mắt) và `sn35.33:1.17` (tâm), cả hai đều là “And the pleasant, painful, or neutral feeling that arises dependent on [eye|mind] contact is also liable to be reborn.” Pāli 1.14 không có chữ “And”, nhưng Sujato vẫn mở vế bằng “And” ở cả hai khoá kia, nên giữ cho khớp. `jātidhammaṁ` = “liable to be reborn” theo 1.4 và 0.2 của chính bài. Không bất định.

  Lớp lấp `english-project`: mỗi bài đúng MỘT khoá, khoá đó nằm ở chỗ bản Anh đã ghim đã lược, không phải ở chỗ nguyên văn bị mất. `triangulation` = 8.0 vì khi viết không có bản Anh độc lập nào để đối chiếu.
