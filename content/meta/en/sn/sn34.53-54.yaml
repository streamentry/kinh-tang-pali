notes: |-
  1.2 đã ghim: "One meditator is skilled in practicing carefully for immersion but not in
  practicing persistently for it. …”". `sakkaccakārī` = "practicing carefully",
  `sātaccakārī` = "practicing persistently", lấy từ 1.2. Đếm trong SN đã ghim:
  "practicing carefully" 6 lần, "practicing persistently" 11 lần — "persistently" thắng
  không phải vì đếm mà vì 1.2 đã ghim dùng nó cho đúng cặp này.

  1.3 đảo hai vế nên vế đứng trước lấy "for immersion" và vế sau lấy "for it", đúng như
  1.2 đã làm; 1.4 và 1.5 giữ nguyên bộ từ ấy. Đây là khuôn của bản đã ghim: vế đứng trước
  được gọi đủ ("for immersion"), vế sau là hành động tương đối với định thì rút "for it".

  Bất định thật sự: Pāli 1.3–1.5 không có chủ ngữ; bản đã ghim đã gộp cả bốn vế vào 1.2.
  Bản lấp để mảnh câu không chủ ngữ cho khớp bản Việt canonical, nên `grammar_logic`,
  `ambiguity_integrity`, `vietnamese_clarity` hạ. `triangulation` 8.0 là đặc thù của lớp lấp.
