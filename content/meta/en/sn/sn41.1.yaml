  **Triangulation 8,0 — bài này KHÔNG được tuyên bố là đã đối chiếu English.** Scorecard Việt của
  `sn41.1` ghi cả `translators` lẫn `quality.assessed_by` là `OpenCode Space Bunny Free (agent)`, trùng
