notes: |-
  **Phân loại 14 khoá (đo bằng script trên Pāli ghim, không suy từ bản dựa): A nguyên từng
  chữ = 5 · B dựng lại = 8 · C tự dịch = 1 · D phải hòa = 0.** Bài này là mẫu thuần của nhóm lặp:
  một câu hỏi và hai câu trả lời về `saṁyojana` được phát ra ba lần (1.3–1.7, 2.3–2.7, 3.3–3.6),
  nên 9 trong 14 khoá là **dùng lại lời đã có trong chính bài này**, không phải dịch mới.

  **Nhóm A — 5 khoá, Pāli trùng byte, lấy nguyên văn lời đã ghim (1,0000):** `2.3`←`1.3`,
  `2.5`←`1.5`, `2.7`←`1.7`, `3.5`←`1.5`, `4.16`←`4.11`. Riêng `4.16` còn khớp `4.18`, khoá mà tầng
  đã ghim đã viết đúng câu ấy kèm dấu `”` đóng — nên ba khoá này in ra một câu, đúng như Pāli nói
  một câu.

  **Nhóm B1 — `2.4` (0,9485 với `1.4`), `2.6` (0,9438 với `1.6`), `3.4` (0,9438 với `1.6`).** Pāli
  của ba khoá này y hệt khoá nguồn **trừ đúng chữ `hoti`** ở cuối. Lớp lấp lấy nguyên lời đã ghim
  (“Some / But some senior mendicants answered like this:”) và **không chèn thêm gì**, vì “answered”
  đã gánh sẵn `hoti`; phần tầng đã ghim nuốt mất ở đây chỉ là dạng công thức, không phải nghĩa.
  `3.4` còn trùng byte với `2.6`, nên hai khoá này lấp giống nhau từng chữ.

  **Nhóm B2 — `3.3` (0,9959 với `1.3`).** Khác `1.3` đúng **một** dấu: `“` mở đầu. Xem mục ngoặc kép.

  **Nhóm B3 — `3.6` (0,9749 với `1.6`+`1.7` nối lại; chỉ 0,8225 với `1.7` riêng).** Pāli gộp dẫn
  `Ekaccehi therehi bhikkhūhi evaṁ byākataṁ` **với** lời đáp vào một khoá. Lớp lấp ghép đúng lời đã
  ghim của `1.6` và `1.7`: “But some senior mendicants answered like this: “Reverends, … the phrasing.””
  Không ghép thì `3.6` mất hẳn vế dẫn, và `3.4` sẽ thành hai dẫn giống hệt nhau.

  **Nhóm B4 — `4.13` (0,6667 với `4.12`; 0,2885 với `4.10`), `4.14` (0,5641 với `4.12`),
  `4.15` (0,6133 với `4.10`).** Ba khoá này dựng lại từ khuôn đã ghim ở `4.10` và `4.17`
  (“the eye is not the fetter of sights, nor are sights the fetter of the eye”), đổi đúng ba
  đôi từ và giữ nguyên khuôn. Cụm danh từ đã đo trên toàn tầng Anh đã ghim trước khi dùng:
  `gandhānaṁ`→smells (275 chỗ), `rasānaṁ`→tastes (285 chỗ), `phoṭṭhabbānaṁ`→touches (282 chỗ).
  Phần tầng đã ghim **nuốt mất** mà lớp lấp chèn lại, ở `4.13` và `4.14`:
  · dấu phủ định `na` — Pāli viết `Na sotaṁ saddānaṁ … ` ở `4.12`, lời đã ghim là “The ear …”, **không
    có phủ định**; `4.13`/`4.14` cũng có `na`, nên lớp lấp viết “Nor is the nose …” / “Nor is the
    tongue …”;
  · danh từ senses — Pāli viết `gandhānaṁ` và `rasānaṁ`, lời đã ghim bỏ mất, lớp lấp trả lại;
  · dấu lược — `4.13` và `4.14` mỗi khoá giữ **đúng một** `…` (Pāli một, lớp lấp một);
  · `4.15` Pāli viết **đủ** (`na kāyo … saṁyojanaṁ;`) nên lớp lấp **không** thêm `…`, và giữ dấu `;`
    của Pāli. Đo toàn tầng: lớp lấp giữ `;` 186/282 = 66%, tầng đã ghim chỉ 782/13713 = 5,7%.

  **Nhóm C — 1 khoá, `4.21` `Paṭhamaṁ.`→“First.”.** Tầng đã ghim để trống **cả 320** khoá `Paṭhamaṁ.`
  trong toàn bộ Pāli đã đọc, nên không có lời nào để dựng lại. Quy ước của lớp lấp đã được đo, không
  đoán: `Paṭhamaṁ.`→“First.” (3 khoá) · `Dutiyaṁ.`→“Second.” · `Tatiyaṁ.`→“Third.” ·
  `Catutthaṁ.`→“Fourth.” · `Pañcamaṁ.`→“Fifth.” · `Sattamaṁ.`→“Seventh.” · `Aṭṭhamaṁ.`→“Eighth.” ·
  `Dasamaṁ.`→“Tenth.” · `Ekādasamaṁ.`→“Eleventh.” Tất cả kèm dấu chấm.

  **Nhóm D = 0.** Đã quét cả 45 khoá của bài: có đúng **5** lớp Pāli trùng byte
  (`1.3`=`2.3` · `1.5`=`2.5`=`3.5` · `1.7`=`2.7` · `2.6`=`3.4` · `4.11`=`4.16`), và trong mỗi lớp chỉ
  **một** khoá đã ghim mang lời ⇒ không có chỗ nào phải hòa. Quét toàn tầng Pāli: 284.708 khoá, 32.111
  lớp trùng byte.

  **Cố ý lệch tầng đã ghim — hai chỗ, đều ghi lý do.**

  1. **Nháy kép ở `3.3`.** Bảng cân đọc tay: Pāli từng khoá ở `3.3` là **0 mở / 1 đóng** (dấu `“` mở
     nằm ở `3.2`), lớp lấp viết **1 mở / 1 đóng**; 13 khoá còn lại cân đúng Pāli từng khoá. Lý do: tầng
     đã ghim **đã đóng** ngoặc ở `3.2` (“… only in the phrasing.” `), nên bám Pāli từng khoá sẽ in ra
     một dấu `”` không có dấu mở. Thêm nữa Pāli `3.3` trùng `2.3` khác đúng dấu `“`, mà `2.3` lấp nguyên
     văn từ `1.3`; giữ nguyên lệch ấy là bài tự mâu thuẫn trong **một cột**. Tầng đã ghim tự cân ở
     `1.3`, `1.5`, `1.7` (cùng câu hỏi, cùng hai câu đáp) và ở `4.1`…`4.20` chạy nháy qua ranh giới
     khoá đúng như Pāli. Đây là lựa chọn có lý do về quy ước tầng, không phải sửa Pāli.
  2. **`4.13` và `4.14` viết đủ** những gì Pāli viết, trong khi tầng đã ghim ở `4.12` nén cả đoạn thành
     “The ear … nose … tongue … body … ”. Lớp lấp không sao chép cái nén ấy vì nó mất nghĩa phủ định, và
     `4.13`–`4.15` là ba khoá Pāli **thật sự** có nội dung riêng.

  **Lỗi tầng Anh đã ghim đếm được ở đúng bài này (báo, không sửa — sửa tầng đã ghim là shadow):**

  · `3.2` **đóng dấu nháy kép sớm một khoá**: Pāli `3.2` có 1 mở / 0 đóng và `3.3` có 0 mở / 1 đóng, còn
    lời đã ghim đặt 1/1 ngay ở `3.2`.
  · `4.12` **mở rộng dấu lược**: Pāli `Na sotaṁ saddānaṁ … ` có **một** `…`, lời đã ghim viết
    “The ear … nose … tongue … body … ” với **bốn** `…` — thêm 3 dấu và thêm ba danh từ không có ở
    Pāli khoá đó (nose, tongue, body nằm ở `4.13`–`4.15`). Đây là khuôn **thói quen** của Sujato, không
    phải sự cắt bỏ riêng bài này: cùng dụ ngôn ở `sn35.233:2.2`, `:3.3` và `:4.8` cũng ra đúng câu
    “The ear … nose … tongue … body … ” cho Pāli đã lược.
  · `4.12` **nén phủ định**: Pāli có `Na`, lời đã ghim không có phủ định nào.
  · `4.10` và `4.17` **đổi dấu `;` cuối khoá thành `.`**.
  · `4.6` **bỏ cặp nháy đơn**: Pāli có 1 cặp `‘…’`, lời đã ghim có 0.
  · **Không** tính là lỗi: `3.7`, `4.9`, `4.19`, `4.20` có thêm một `’` — đó là dấu nháy bộ tiếng Anh
    (That’s, they’re, You’re), không phải nháy Pāli.

  **Dấu lược:** bài này **không** có `…pe…` nào. Đo từng khoá trên cả 14 khoá lấp: tổng `…` của Pāli = 2
  và của lớp lấp = 2, lệch 0; không khoá nào thêm `…` nơi Pāli viết đủ, không khoá nào bỏ `…`.

  **Số khoá đã ghi: 14. Số khoá trống còn lại của bài: 0** — tập `fillableSegments` đã cạn. Trong 14 khoá
  có 3 khoá **dưới ngưỡng 40 ký tự** nên không vào coverage: `4.13` (21 ký tự Pāli), `4.14` (18) và
  `4.21` (9). Vẫn lấp cả ba, vì người đọc cột English sẽ thấy ba ô trống ngay giữa dãy sáu căn và ngay
  cuối bài.

  **Coverage — mẫu số = 34 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`):** trước lớp lấp là
  **23/34 = 0,6765** (11 khoá không có một chữ Anh nào). Sau khi `published` là **34/34 = 1,0000**.
  **Độ nhạy:** ngưỡng 0,8 của `source/layers.yaml` ⇒ sau lớp lấp phải mất **7** khoá có nội dung mới rớt
  xuống dưới ngưỡng (6 khoá còn ở 28/34 = 0,8235; 7 khoá rớt còn 27/34 = 0,7941).

  **Hệ quả với `content/meta/reference-gaps.yaml`:** bài này **có** record (dòng 3650:
  `substantiveSegments: 34`, `substantiveWithoutEnglish: 11`, `coverage: 0.6765`). Sau khi lớp lấp
