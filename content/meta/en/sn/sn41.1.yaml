  **dùng lại nguyên văn** lời tầng đã ghim, nên lớp lấp không phải một cách đọc English độc lập. Chỉ
  `4.13`, `4.14`, `4.15` và `4.21` là chữ do lớp lấp tự viết, và chúng chỉ được đối chiếu bằng Pāli root
  cộng bản Việt canonical — cũng của cùng nhóm người làm.

