notes: |-
  3.4 mở ngoặc kép rồi dừng ở dấu hai chấm, vì Pāli 3.4 mở `“` và đóng ở 3.6 (3.5/3.6
     vẫn để trống). Nguyên văn lấy từ 3.10 đã ghim y hệt, chỉ đổi `?` thành `:`.
  
  Bất định đã ghi ở 3.12: vế `nibbeṭhiyamānā sukhadukkhaṁ palentī` bản đã ghim dịch HAI
     cách trong chính bài này — 1.15 "roll away unraveling as far as pleasure and pain
     extend" nhưng 2.3 và 2.9 lại dịch thành "will make an end of suffering". Chọn 1.15 vì
     đó là lần dịch đúng nghĩa `palentī` (sống dai, tiếp tục kéo dài), còn 2.3/2.9 coi
     `sukhadukkhaṁ palentī` là một khối "khổ". 3.12 vì thế đọc là một mảnh câu treo: chủ ngữ
     `sattime kāyā akaṭā akaṭavidhā` nằm ở 3.11 vẫn để trống, và `akaṭā akaṭavidhā` KHÔNG
     có tiền lệ nào trong toàn bộ tầng Anh đã ghim (đã quét: "cannot be covered",
     "seven ways", "seven types of sense experience" đều 0 kết quả), nên không dịch phần đó.
  
  Lớp lấp: 2 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
