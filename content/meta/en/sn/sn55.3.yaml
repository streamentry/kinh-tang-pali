notes: |-
  Hai khoá này là BẢN LẶP NGUYÊN VĂN của lời thoại đã có sẵn trong chính bài này,
  nên luật 3 bắt buộc dùng lại y nguyên:

    1.10 ← 1.5, Pāli chỉ khác ở dấu mở ngoặc (`‘` / `“`) vì 1.5 là Dīghāvu nói nhờ
         (“dīghāvu, bhante, upāsako…”) còn 1.10 là Jotika đang nói với Đức Thế Tôn.
         Bản đã ghim 1.5 = “Sir, the lay follower Dīghāvu is sick, suffering, gravely ill.”
    1.13 ← 1.8, PĀLI GIỐNG HỆT TỪNG KÝ TỰ. Bản đã ghim 1.8 = “Sir, please visit him at
         his home out of sympathy.’” (kèm cả hai dấu ngoặc kép, vì đây là lời thoại
         trong lời thoại).

  Vì vậy 1.10 mở bằng `“` và 1.13 đóng bằng `’”` — khác nhau, nhưng đó là hệ quả cơ
  học của luật 4 (số ngoặc phải khớp Pāli theo từng khoá), không phải lỗi. Nếu đồng nhất
  hai khoá thì một trong hai sẽ phải bẻ ngoặc sai Pāli.

  `upāsako` dịch “the lay follower” vì đó là từ Sujato dùng ở 1.5, 2.1, 5.4 của chính
  bài này. Bài không có bản Việt dự án. `triangulation` 8.0 theo đặc thù của lớp.
