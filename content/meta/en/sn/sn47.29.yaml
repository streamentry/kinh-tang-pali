notes: |-
  1.12 TRÙNG NGUYÊN VĂN Pāli với 1.8 của CHÍNH bài nên chép nguyên văn bản Anh đã ghim: “‘Sir,
  please visit him at his home out of sympathy.’”

  1.10 ghép hai vế đã có bản Anh đã ghim trong CHÍNH bài: 1.5 → “Sir, the householder Sirivaḍḍha is
  sick, suffering, gravely ill.” và 1.6 → “He bows with his head to your feet.”; bỏ ngoặc kép vì
  Pāli 1.10 chỉ có `“` mở, đóng ở 1.12. `sirivaḍḍho … ābādhiko dukkhito bāḷhagilāno` giữ nguyên bộ
  “sick, suffering, gravely ill” của 1.2.

  Không có bất định nào trong hai khoá này. 1.11 (`Evañca vadeti:`) và 4.9 trống ở mọi tầng, ngoài
  lát đã giao.
