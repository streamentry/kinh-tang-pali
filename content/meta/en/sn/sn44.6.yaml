notes: |-
  1.6: `etampi kho, āvuso, abyākataṁ bhagavatā` → “this too has not been declared by the Buddha” —
  tiền lệ 8 lần ở sn16.12:1.8, cùng tiêu đề “Abyākata”; 1.5 của chính bài đã mở đầu “Reverend, when
  asked these questions, you say that this has not been declared by the Buddha.” nên 1.6 nối tiếp
  bằng `‘` + chữ thường.

  1.7 và 3.2: `neva hoti na na hoti tathāgato paraṁ maraṇā` → “a realized one neither still exists
  nor no longer exists after death” — khuôn của chính bài ở 2.9, 3.7, 4.6, 5.4, 6.4, 6.6.

  BẤT ĐỊNH ĐÃ GHI — chỗ này ảnh hưởng thực sự đến cách đọc: ở 3.2, Pāli viết `maraṇā’tipissa` (dấu
  `’` đi trước `tipissa`), nên theo quy ước đếm của tầng, Pāli 3.2 có 1 ngoặc mở / 0 ngoặc đóng —
  khác với 3.7/4.6/6.6 có Pāli `…maraṇā’tipissa na hoti.` giống hệt nhưng bản Anh đã ghim lại có
  `.’` (1 mở / 1 đóng). Lớp lấp bám Pāli nên 3.2 để dấu nháy trong, đọc liền 3.1–3.2 sẽ thấy một
  ngoặc kép chưa đóng. Lựa chọn này bị ép bởi Pāli, không phải do lớp lấp; nhưng nó làm giảm khả
  năng đọc, nên hạ `vietnamese_clarity` xuống 8.8 và `ambiguity_integrity` xuống 9.0. Người biên tập
  nên biết: sửa được bằng cách sửa Pāli gốc, không sửa được bằng cách sửa lớp lấp.
