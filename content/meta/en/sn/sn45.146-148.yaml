notes: >-
  Third and last sutta of the "abbreviated texts on diligence" peyyāla: stars, the sun in the rainy season,
  and cloth from Kāsi. Each opens with "best of its kind" (`aggamakkhāyati`) and then pivots to diligence.
  The filled segments are the third pivot and its consequence, and they are fillable because `sn45.139` —
  the full-length version of this same peyyāla — is where the pinned edition leaves them empty.

  Five of the six filled segments repeat Pāli verbatim from `sn45.139`, which the pinned edition translates,
  so their wording is taken from there rather than translated afresh:

  - `3.2`, `3.3` = `sn45.139:1.3–1.4`: "all skillful qualities are rooted in diligence and meet at diligence,"
    and "and diligence is said to be the best of them." Note that `3.3` opens with "and" in the pinned
    wording, because `3.2` ends on a comma. Rendering `3.3` as a fresh sentence would read as a new claim
    rather than the completion of `3.2`'s clause, so the conjunction is kept.
  - `3.4` = `sn45.139:1.5`: "can expect to develop and cultivate the noble eightfold path." `pāṭikaṅkhaṁ`
    is "can expect", and `bhāvessati … bahulīkarissati` is future, so the modal is kept rather than turned
    into a statement of fact.
  - `3.5` = `sn45.139:1.6`: "And how does a mendicant who is diligent develop and cultivate the noble
    eightfold path?" — again "develops and cultivates", not the bare "develops".
  - `3.7` = `sn45.139:1.8`, which the pinned edition closes with a closing quotation mark. `sn45.146-148:3.7`
    does the same, since its Pāli ends `”ti.`.

  `3.6` is the one filled segment with no verbatim precedent, because its Pāli carries a second `…pe…` at
  the very end that `sn45.139:1.7` lacks. The clause on each side is still given in full and in the pinned
  wording — "which rely on seclusion, fading away, and cessation, and ripen as letting go" — with the Pāli's
  own ellipsis kept verbatim rather than expanded, as the fill layer must. Sujato does expand it at
  `sn45.139:1.7`; doing so here would put English into a layer no source licenses, and would also leave the
  last `…pe…` of this segment with nothing to stand for.

  Triangulation is capped at 8.0: Sujato translates none of these six segments.