    ## 10. Coverage trước / sau và độ nhạy

    Mẫu số = khoá Pāli **có nội dung** (≥40 ký tự theo `source/layers.yaml`, bỏ khối `:0`) =
    **41** khoá.

    - **Trước:** 27/41 = **0,6585** (đúng bằng `ratio` của bản làm việc).
    - **Sau (lớp lấp `published`):** 41/41 = **1,0000**.

    **Độ nhạy ngưỡng 0,80:** cần ≥ **33** khoá có lời; tầng ghim một mình cho **27**, nên lớp lấp
    phải bù **6** khoá. Bỏ **một** khoá có nội dung ⇒ 40/41 = 0,9756. Bỏ **tám** ⇒ 33/41 = 0,8049
    (vẫn trên ngưỡng). Bỏ **chín** ⇒ 32/41 = 0,7805 (**rớt**). ⇒ có thể bỏ tối đa **8** khoá;
    mỗi khoá có nội dung mất đi là **0,0244** tỉ lệ.

