    ## 2. Nhóm B — dựng lại từ lời đã ghim, đo được tỉ lệ khớp

    Phép đo là trùng **thân từ** (bỏ dấu câu và cả 4 loại nháy) giữa Pāli khoá lấp và Pāli khoá
    cho lời, nên "khớp" nghĩa là *mọi thân từ của khoá lấp đều xuất hiện trong khoá cho lời*
    ⇒ lớp lấp **dựng lại**, không dịch từ đầu.

    | khoá lấp | khoá cho lời | thân từ thiếu / thừa | trùng chuỗi | phần tầng ghim nuốt mất, lớp lấp chèn lại |
    |---|---|---|---|---|
    | `4.4` | `1.5` | 0 / 0 | **1,000** | mở `“` thành `‘`, và `paññāpeti:` → `paññāpeti—` |
    | `4.5` | `12.3` | 0 / 3 | 0,500 | vế đầu `After death,` và hai mục `still exists` / `no longer exists` |
    | `4.6` | `12.3` | 0 / 2 | 0,737 | hai mục `both still exists and no longer exists` / `neither … nor no longer exists`, mở đầu bằng `or` |
    | `5.2` | `2.2` | 0 / 0 | **1,000** | dấu phẩy ở `āvuso,` và `paramapattipatto,` (Pāli khoá này có, khoá `2.2` không) |
    | `5.3` | `12.3` | 0 / 4 | 0,400 | mục thứ nhất `After death, a realized one still exists`, nằm **trong** nháy đơn, dấu lược **ngoài** nháy |
    | `5.4` | `12.3` | 0 / 3 | 0,545 | mục thứ tư `neither still exists nor no longer exists` |
    | `6.2` | `3.2` | 0 / 0 | **1,000** | mở `“` thành `‘` |
    | `6.3` | `3.3` | 0 / 0 | **1,000** | `”` thành `’”` |

    **Bốn khoá trùng chuỗi thân từ 1,000** (`4.4` `5.2` `6.2` `6.3`) chép **nguyên văn** lời đã
    ghim, chỉnh đúng những dấu câu Pāli khoá lấp có mà khoá cho lời không có. Đã kiểm: **mọi**
    thân từ của lời đã ghim đều còn trong lớp lấp, không rớt từ nào.

    ## 3. Nhóm C — dịch thật từ Pāli, mượn ngữ vựng đã có trong bài

    Không khoá C nào có khoá Pāli trùng hay gần trùng đã có lời, nên tám khoá này dịch từ
    Pāli. Nhưng cả tám vẫn **bám ngữ vựng của chính bài này**, đo được từng cụm:

    - `4.2` mượn `bhagavato avidūre araññakuṭikāyaṁ` của `1.2` (*"not far from the Buddha in a
      wilderness hut"*); chỉ đổi ngôi: `viharāmi` ngôi một, lớp lấp dùng *"I stay"*.
    - `4.3` mượn `sambahulā aññatitthiyā paribbājakā` của `1.3` (*"several wanderers of other
      religions"*) và `yenā…tenupasaṅkamiṁsu` (*"went up to"*); đổi thành *"came up to me"*.
    - `5.1` mượn khuôn `2.1` (*"When they said this, … said to those wanderers:"*), nhưng Pāli
      đổi ngôi: `vuttāhaṁ` + `etadavocaṁ` ngôi một, lớp lấp dùng *"Having said this, … I said this to
      those wanderers:"*.
    - `5.5` Pāli có `maṁ etadavocuṁ` (nói **với tôi**) và `te … paribbājakā` thay cho
      `āyasmantaṁ anurādhaṁ`; lớp lấp dùng *"those wanderers of other religions said this to me:"*.
    - `5.6` xem mục 5 dưới.
    - `5.7` mượn `navavādena ca bālavādena ca apasādetvā … uṭṭhāyāsanā pakkamiṁsu` của `2.6`;
      Pāli đổi tân ngữ `maṁ` (nói với **tôi**) nên lớp lấp dùng *"me"*, không dùng
      *"Venerable Anurādha"* như tầng ghim.
    - `6.1` mượn `acirapakkantesu tesu aññatitthiyesu paribbājakesu etadahosi` của `3.1`
      (*"Soon after they had left, Anurādha thought:"*); Pāli đổi sang `Tassa mayhaṁ`, lớp lấp dùng
      *"this occurred to me"*.
    - `13.3` xem mục 6.

    ## 4. 🔴 `5.6` — chỗ duy nhất **không** phân xử trọn, đã ghi thay vì đoán

    Pāli `5.6` viết `so cāyaṁ bhikkhu **na vo** bhavissati acirapabbajito`, còn `2.5` viết
    `so cāyaṁ bhikkhu **navo** bhavissati acirapabbajito` — khác nhau đúng ở `navo` / `na vo`.
    Đo toàn tầng Pāli đã ghim: cụm `na vo bhavissati` có **0** lần; cụm `navo bhavissati
    acirapabbajito, thero vā pana bālo abyatto` có **3** lần (`2.5`, `an6.62:4.1` và một khoá anh
    em), và tầng ghim dịch cả ba giống nhau: *"must be junior, recently gone forth, or else a
    foolish, incompetent senior mendicant"*.

    `vo` không thể là chủ ngữ ngôi ba của `bhavissati`, và `na vo bhavissati acirapabbajito` khớp
    `navo bhavissati acirapabbajito` từng thân từ. Lớp lấp vì vậy đọc `na vo` là **chính từ `navo`
    viết tách**, và dịch theo lời đã ghim ở `2.5` — đây là **một lựa chọn biên tập được nêu ra**,
    không phải sự thật đã phân xử. Lớp lấp **không** tự hoà hai khoá: `5.6` giữ `’ti.` với dấu
    nháy đơn của Pāli khoá này, và dùng *"That mendicant"* (theo `an6.62:4.1`) thay vì *"This
    mendicant"* (theo `2.5`), vì `so` ở đây là hồi tưởng với Đức Thế Tôn. Câu cuối lặp chữ
    *"senior mendicant"* là **do tầng ghim thêm** ở `2.5`, lớp lấp giữ nguyên để hai khoá không
    trái nhau.

    ## 5. 🔴 Cố ý lệch tầng Anh đã ghim — **một** chỗ, đã đo

    **Nháy kép ở `5.7`.** Pāli `5.7` có **0** dấu nháy kép; lớp lấp có **2** (`“junior”` và
    `“foolish”`). Đây là ngoại lệ **có chủ đích** mà luật cho phép: khoá anh em `2.6` — **cùng một
    câu thoại**, chỉ khác chỗ người nói và tân ngữ — có Pāli **0** dấu nháy và lời đã ghim **2**
    (`by calling him “junior” and “foolish”`). Quy ước này không phải phát minh của lát này:
    đo toàn tầng, tầng đã ghim có **17.761** khoá mà lời Anh có nháy còn Pāli thì không, và lớp
    lấp hiện có **433** khoá như vậy. Lý do: `2.5`+`2.6` và `5.6`+`5.7` là **một** lời thoại
    được nói lại; để hai bản dịch khác nhau là bài kinh tự mâu thuẫn trong chính bốn cột đối
    chiếu. Tất cả 15 khoá còn lại khớp Pāli **từng khoá** (`“` 2/2, `”` 2/2, `‘` 5/5, `’` 5/5).

    ⚠️ **Bất đối xứng có thật trong Pāli khối 5, không sửa.** `5.2` mở `“` mà Pāli khối 5
    **không** đóng (khối 2 đóng ở `2.3`). Lớp lấp chép nguyên trạng: `5.2` mở `“` không đóng,
    `5.3` và `5.4` mỗi khoá tự cân `‘…’`. Đây là thiếu sót của tầng Pāli, không phải của lớp lấp;
    lớp lấp không bịa dấu `”`.

    ## 6. 🔴 Nhãn thứ tự — dò ở **giá trị Pāli**, và đã ghi cảnh báo

    Phép đo dùng giá trị Pāli khớp `^(Paṭhama|Dutiya|Tatiya|Catuttha|Pañcama|Chaṭṭha|Sattama|
    Aṭṭhama|Navama|Dasama|Ekādasama|Dvādasama|Terasama)ṁ\.$` trên **284.708** khoá Pāli `pli/ms`
    (quét **đệ quy**): **2.993** khoá nhãn; tầng Anh đã ghim có lời ở **0** khoá = **0,00%**; lớp
    lấp đã có **41** khoá / **41** có lời / **12** dạng bề mặt, **mỗi nhãn đúng một cách, 0 ngoại lệ**.
    Đó chính là con số **2.993** của phép đo trước, và chỗ tái lập được là **0,00%**.

    `sn22.86` có **đúng một** khoá nhãn: `13.3` = `Catutthaṁ.` ⇒ **`Fourth.`**, khớp cả **5**
    tiền lệ đã có (`an10.84:15.3`, `sn22.56:15.4`, `sn33.4:1.13`, `sn35.16:2.4`, `sn55.24:9.12`),
    cùng dạng, cùng cách viết, không có khoá nào viết kèm dấu cách thừa.

    ⚠️ **Cảnh báo bắt buộc:** bài này liệt kê **bốn** cách (`imesu catūsu ṭhānesu`, `aññatra imehi
    catūhi ṭhānehi`) nhưng chỉ có **một** khoá nhãn, và nó đứng ở cuối bài. `Catuṭthaṁ.` ở đây
    trỏ về cách thứ **bốn**. Lớp lấp **không tự bỏ** và **không tự thêm** nhãn cho ba mục kia vì
    Pāli không có khoá nào ở đó.

    ## 7. Dấu lược — giữ, không mở rộng

    Bài có **8** khoá Pāli chứa `…pe…` và **15** khoá có `…` trần. Lớp lấp chỉ chạm hai khoá có
    dấu lược, và ở cả hai số dấu khớp Pāli: `4.3` (`…pe…` ⇒ **một** `…`), `4.5` (`…` trần ⇒
    **một** `…`), `5.3` (`…pe…` ⇒ **một** `…`). Tổng cộng phía lấp **3**, phía Pāli **3**.
    ⚠️ Đếm thô `.count("…")` trên 16 khoá này ra **5** vì `…pe…` bị tính là hai — bẫy đo 5c.3 đã
    tránh. Lớp lấp **không** mở rộng `…pe…` của `5.3` thành ba mục, và **không** viết đủ bốn
    mục vào `4.5`/`4.6`; chỗ nào Pāli viết đủ thì lớp lấp viết đủ.

    ## 8. 🔴 Nguyên nhân khoá trống — đo **cả hai** cơ chế

    - **Gộp khoá (giả thuyết cũ của mục 5d): 0 cặp.** Đo bằng phép ≥50% thân từ của khoá trống
      nằm trong lời Anh của khoá **liền trước** ⇒ **0** cặp đủ điều kiện. Bài này **không** phải
      bài gộp khoá.
    - **Cơ chế A — cắt cụt dãy (≥4 khoá trống liên tiếp): 1 dãy.** `4.2` … `6.3`, tức **15** khoá
      liên tiếp, **1.350** ký tự Pāli. Tầng ghim dịch tới `4.1` rồi im luôn, và quay lại ở `7.1`.
      Đây là phần lớn bài: Anurādha kể lại **toàn bộ** cuộc trò chuyện với Đức Thế Tôn mà tầng
      ghim bỏ trống.
    - **Cơ chế B — bỏ dòng song song (≥2 khoá trống trùng cấu trúc ≥70% thân từ): 1 cặp.**
      `4.6` ~ `5.4`, trùng 0,875 ⇒ **2** khoá / **126** ký tự Pāli, và cả hai **nằm trọn trong**
      dãy của cơ chế A (không có khoá nào chỉ thuộc B).
    - ⚠️ **Lỗ hổng của bộ đo coverage, đã kiểm ở bài này: không có.** Cả 27 khoá có lời đều viết
      đủ nghĩa; không có khoá nào chữa ít hơn mức đáng kể so với Pāli, nên `ratio` ở đây không lạc
      quan theo kiểu cắt cụt. (Hai khoá dưới ngưỡng 40 ký tự nằm trong **tập lấp** và đã lấp đủ.)

