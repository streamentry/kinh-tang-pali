notes: |-
  Vế cuối của danh sách mà bản Anh đã ghim đã dịch trọn ở 5.1 của CHÍNH bài này, nên giữ đúng bộ từ đó
  cho `vimuttiñāṇadassanakkhandhaṁ`: "the knowledge and vision of freedom".
  `vimuttiñāṇadassanakkhandhaṁ` xuất hiện đúng 2 khoá trong toàn bộ root và chỉ 5.1 có bản Anh, nên
  đây là tiền lệ duy nhất. BẤT ĐỊNH đã ghi: `vā ādāya parinibbuto` ở đây là ĐỘNG TỪ chung cho cả danh
  sách ("hoặc … rồi viên tịch trọn vẹn"), khác với ở 5.1/2.3/6.6 nơi `parinibbuto` là mệnh đề phụ mà
  bản đã ghim dịch "fully quenched" / "fully extinguished". Chọn "and fully pass away" vì giữ được cả
  `ni` ("fully") mà "fully quenched" sẽ phải đổi thành "be fully quenched", lệch cả thì. "fully pass
  away" KHÔNG có tiền lệ nguyên văn trong bản đã ghim (chỉ có "pass away" trong câu về luân hồi) — đây
  là chỗ hạ `terminology` và `ambiguity_integrity`, và là lựa chọn có thể bị đảo nếu biên tập muốn bám
  "fully quenched" cho nhất quán với 2.3/6.6. Lưu ý phạm vi: 5.3 và 5.4 (`paññākkhandhaṁ vā …pe…`,
  `vimuttikkhandhaṁ vā …pe…`) trống ở MỌI tầng và không thuộc lát nào trong 8 lát, nên cột Anh của
  5.3–5.4 vẫn trống. Không tự điền vì ngoài lát đã giao.
  
