notes: |-
  2.6 lặp NGUYÊN VĂN 1.7, đã được ghim thành "But these senior mendicants think they can go
  to visit families, so why can’t I?" — lấy y hệt vế trong nháy (luật 3). Khác ở chỗ 2.6 mở
  bằng `‘` và kết `’”ti.` (1 mở, 2 đóng) trong khi 1.7 mở `“` kết `”ti.`, và Pāli 2.6 KHÔNG
  có dấu hỏi (dấu hỏi của 1.7 là Sujato thêm theo ngữ pháp Anh; 2.6 là phần trong nháy kép
  của 1.6 nên phải bỏ). Khuôn `…’”` đã có trong lớp lấp: an4.45:3.3, an4.45:5.3, mn103:2.4,
  sn16.12:1.12.

  2.2 là vế `idha, bhante, aññataro navo bhikkhu …` mới; bộ từ lấy từ 1.3 của chính bài:
  "a certain junior mendicant" + "went to visit families too often" ("a certain mendicant" 25
  lần trong tầng; `idha, bhante` → "Sir," như sn20.10:1.7 và sn21.10:1.5).

  3.7 là khoá duy nhất chưa có lời nào ở đâu: vế `Tatonidānaṁ maraṇaṁ vā nigacchanti maraṇamattaṁ
  vā dukkhaṁ` bị Sujato dồn vào 3.4 và 3.6 ("wouldn’t result in death or deadly pain" /
  "resulted in death or deadly pain"). Đây là lý do hạ `ambiguity_integrity`: không có tiền lệ
  cho chính vế động từ này. `nigacchanti` nghĩa là "rơi vào / gặp phải", `vā … vā` là
  "hoặc … hoặc"; dịch "They fall into either death or deadly pain." và giữ nguyên cụm "or
  deadly pain" của 3.4/3.6 ("death or deadly pain" 45 lần trong tầng). Đây là phán đoán dịch
  của tôi dựa trên nghĩa từ điển và tiền lệ của phần còn lại, không phải tiền lệ trực tiếp.
