notes: |-
  1.6/1.9 lặp 1.4 (Sujato): "Thus that form will be given up, cut off at the root, made like a
  palm stump, obliterated, and unable to arise in the future." → dùng lại nguyên bộ vế
  `ucchinnamūlaṁ tālāvatthukataṁ anabhāvaṅkataṁ āyatiṁ anuppādadhammaṁ`. 1.5 gọi `vedanā` là
  "feeling", 1.8 gọi `saṅkhārā` là "choices", 1.10 gọi `viññāṇe` là "consciousness" — giữ đúng.

  Số: 1.6 `sā vedanā` số ít nên "that feeling … will be given up"; 1.9 `te saṅkhārā` số nhiều
  nên "those choices … will be given up".

  Pāli 1.6/1.9 ở sn23.9 TRÙNG NGUYÊN VĂN với sn23.10:1.6/1.9, nên hai bài dùng đúng một lời.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
