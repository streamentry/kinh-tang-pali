notes: |-
  Đây là tiền lệ mạnh nhất của lát: sn12.82 là CÙNG công thức `… ajānatā apassatā yathābhūtaṁ …
  yathābhūtaṁ ñāṇāya satthā pariyesitabbo` và Sujato đã ghim đủ bốn vế, kể cả vế
  `saṅkhāranirodhagāminiṁ paṭipadaṁ`:
    "One who does not truly know or see X should seek the Teacher so as to truly know X."
  Nên 1.2/1.3/1.4 lấy đúng khuôn đó, chỉ thay X.

  Tra đếm trong tầng để chốt từng từ: "seek the Teacher" là cách duy nhất (0 lần "must be
  sought", 0 lần "to be sought", 0 lần "the Teacher must") → dùng y hệt. `saṅkhāra` đã ghim là
  "choices" (sn12.72-81:10.1, sn22.25:1.8); `samudaya` là "the origin of" và `nirodha` là "the
  cessation of" (sn12.33:2.12 ghim đủ bốn, trong đó "the practice that leads to the cessation
  of choices"); `yathābhūtaṁ … ñāṇāya` là "so as to truly know". Cả bốn đều có tiền lệ đếm
  được nên đây là lát ít bất định nhất: không có mục nào phải tự dịch vì không có tiền lệ.

  Không có `…pe…` nào trong ba khoá này nên không có rủi ro mở rộng dấu lược. Triangulation
  bị chặn ở 8.0 như mọi bài của lớp lấp.
