notes: |-
  2.5: chép NGUYÊN VĂN (kiểm tra byte-for-byte) từ sn35.90:2.7 của lớp fill — cùng công thức
  `…tampi na maññeyya, tasmimpi …, tatopi …, taṁ meti na maññeyya.` và CÙNG nhánh lưỡi. Đó là tiền
  lệ gần nhất và đúng nhất.

  BẤT ĐỊNH VỀ DẤU NHÁY (đã biết, ghi rõ): bản đã ghim của chính bài này (1.8, 3.4) dùng nháy cong
  cho `‘that is mine.’`, nhưng Pāli 2.5 và 2.6 KHÔNG mang dấu nháy nào, mà luật 4 bắt số ngoặc
  phải khớp từng khoá — dùng nháy cong sẽ vỡ bộ đếm. Lớp fill đã gặp đúng tình huống này và chọn
  nháy thẳng ở sn35.90:2.7; tôi theo đúng tiền lệ đó. Hệ quả: cột English của bài này sẽ hiện
  "that 'that is mine.'" ở 2.5/2.6 (nháy thẳng) nhưng "that ‘that is mine.’" ở 1.8/3.4 (nháy cong
  của bản đã ghim). Đây là khác biệt HÌNH THỨC do tầng đã ghim gây ra, không phải do tôi chọn
  thuật ngữ. `ambiguity_integrity` 9.3 vì thay đổi bản dịch thì phải sửa notes này.

  2.6: ghép 1.9 và 1.10 của chính bài, đã ghim ("For whatever you conceive it to be, … that
  becomes something else." + "The world is attached to being, taking pleasure only in being, yet
  it becomes something else."), rồi trả lại ` …` cho `…pe….` ở cuối khoá. Cùng cách làm như
  sn35.11:1.4.
