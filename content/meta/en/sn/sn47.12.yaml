notes: |-
  5.4 chép lại 1.4 của CHÍNH bài — “I believe there’s no other ascetic or brahmin—whether past,
  future, or present—whose direct knowledge is superior to the Buddha when it comes to awakening.” —
  rồi thêm `’?` vì 5.2 đã mở ngoặc kép và 5.3–5.4 là lời hỏi. Pinned 1.6–1.7 của chính bài đã có
  đúng cặp `‘` … `’` cho cùng câu.

  BẤT ĐỊNH ĐÃ GHI (5.4): Pāli ở 5.4 có một DẤU LẠC không có ở 1.4/1.7 — `bhagavatā’
  bhiyyobhiññataro` (dấu `’` bị lạc vào giữa, đứng một mình giữa hai từ). Nó làm số ngoặc đóng của
  5.4 thành 2, nên lớp lấp phải giữ một dấu đóng; đặt đúng chỗ Pāli đặt, tức ngay sau “Buddha”, để
  không thêm chữ nào. Đọc sẽ thấy “Buddha’ when” — vẻ lạ nhưng là hình ảnh trung thành của lỗi Pāli.
  Đây là lý do hạ `vietnamese_clarity` và `ambiguity_integrity`.

  6.10 và 6.11 lấy bộ từ của 6.9 đã ghim ở chính bài cho “give up the five hindrances, corruptions
  of the heart that weaken wisdom / firmly established in the four kinds of mindfulness meditation /
  correctly develop the seven awakening factors / … the supreme perfect awakening”, và `cetaso
  upakkilese paññāya dubbalīkaraṇe` có thêm tiền lệ ở dn25:17.1 (16 lần), an6.57:13.5 và mn112:18.1.

  Lựa chọn thời đã ghi: 6.9 đã ghim (Pāli mô tả quá khứ `ahesuṁ`) lại dịch ở thì hiện tại và thêm cả
  “whether past, future, or present” — nhưng ở 6.10 Pāli là `bhavissanti … abhisambujjhissanti`
  (tương lai rõ ràng) nên lớp lấp dịch “will …”, và 6.11 là `abhisambuddho` (aorist về chính Đức Thế
  Tôn) nên dịch “has …”. Kết quả: 6.9 “give up” / 6.10 “will give up” / 6.11 “has given up” — ba thì
  khác nhau nhưng đúng thì Pāli. `bhagavāpi … etarahi arahaṁ sammāsambuddho` lấy từ sn6.2:7.6.

  BẤT ĐỊNH ĐÃ GHI (6.11): Pāli kết `’”ti` (HAI ngoặc đóng, 0 mở) nên phải có hai dấu đóng liền nhau
  ở cuối câu (`’”`), không chêm dấu chấm vì Pāli không có; dấu `’` ấy không có ngoặc mở tương ứng
  nên đọc sẽ thấy một dấu nháy thừa ở cuối. Hạ `vietnamese_clarity` vì lý do đó.
