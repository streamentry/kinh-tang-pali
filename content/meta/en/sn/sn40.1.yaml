notes: |-
  Ba bài `sn40.1/2/9` có Pāli y hệt ở khoá cần lấp, nên dùng CHUNG một cách dịch. Ở cả ba, khoá
  ngay trước (3.6/2.6/2.6) đã có CHỮ Sujato "a disciple who attained to great direct knowledge with help from
  the Teacher, it’s me.” — bản đã ghim đã nuốt luôn vế `’ti` của khoá kế tiếp vào câu trước; khoá cần lấp
  chỉ còn lại chuỗi được gọi tên. Tiền lệ đã merge: `sn21.1:3.6` (cùng Pāli) dùng `‘…Teacher’”`.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
