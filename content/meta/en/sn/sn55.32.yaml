notes: |-
  The passage the pinned English edition left blank.

  Khuôn dùng lại, KHÔNG phải lựa chọn của tôi: 17 tệp fill đã có trong kho (sn55.4/7/11/14/15/16/17/22/28/30/34/36/44/45/46/47/51) dịch nguyên văn `itipi so bhagavā …pe… satthā devamanussānaṁ buddho bhagavāti.` thành “That Blessed One is … teacher of gods and humans, awakened, blessed.” Sujato KHÔNG dịch vế này ở bất kỳ bài sn nào (0 kết quả khi quét “That Blessed One is … teacher of theos”), nên đây là khuôn chính thức của lớp lấp.

  1.5 (`Ayaṁ paṭhamo puññābhisando kusalābhisando sukhassāhāro.`) có tiền lệ trực tiếp
  và đã được bản đã ghim dịch ở chính bài này ở 3.2: “This is the fourth kind of
  overflowing merit, overflowing goodness that nurtures happiness.” Dùng lại y nguyên,
  chỉ đổi “fourth” → “first” theo Pāli. Cùng khuôn đó đã dùng ở sn55.31:1.6.

  Bài CÓ bản Việt dự án (sn55.32) để đối chiếu; ở 1.5 Pāli không dấu lược nên bản Anh
  cũng không có. 2.2 của bài (`saṅghe …pe….`) để nguyên dấu lúc, không đụng tới — nó
  thuộc lát khác.

  `rven88.py` báo “lặp cụm, một từ ngăn: overflowing … overflowing” ở 1.5. Đây là CỜ
  SAI: Pāli có HAI phép chương ghép khác nhau — `puññābhisando` (overflowing merit) và
  `kusalābhisando` (overflowing goodness) — và Sujato dùng chung một từ “overflowing” cho
  cả hai. Bỏ lặp là lược mất một phép chương ghép của nguyên văn.
