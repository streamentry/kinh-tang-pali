notes: |-
  1.9 trùng cấu trúc 1.2 (con mắt) và 1.15 (tâm), cùng bài, đã ghim; `jivhāyapi` dịch
     "with the tongue" theo 1.2 ("with the eye"), còn `manasmimpi` ở 1.15 bản đã ghim cũng
     lược mất chữ "too" — giữ đúng bộ từ đã ghim.
  
  1.12 trùng NGUYÊN VĂN 1.5, cùng bài, đã ghim. Ghi lại: Pāli động từ `suvimuttanti` số
     nhiều trong khi chủ ngữ `cittaṁ` số ít; bản đã ghim 1.5 và 1.18 đều dịch "the mind is
     said to be well freed", nên giữ y nguyên. 1.10 và 1.11 (cùng mẫu, `Nandikkhayā rāgakkhayo`
     / `rāgakkhayā nandikkhayo`) vẫn để trống và không thuộc lát này.
