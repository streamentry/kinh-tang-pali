notes: |-
  `pācīnaninnā pācīnapoṇā pācīnapabbhārā` đã có CHỮ ngay trong bài này: 1.1 → "slants, slopes, and
  inclines to the east"; `sn45.160:1.1/1.8` (cùng cụm) dùng y hệt và `sn45.160:1.17` xác nhận nghĩa ba
  vế là "slanted, sloped, and inclined to …".

  Lựa chọn tên sông: `yamunā/aciravatī/sarabhū/mahī` có CHỮ trong bản đã ghim của chính bài này
  ("Yamunā River", "Aciravatī River", "Sarabhū River", "Mahī River"); `gaṅgā` thì KHÔNG có — bản đã ghim
  chỉ dùng "Ganges" ở 0.2 ("Abbreviated Texts on the Ganges") — nên lấy "Ganges", không bịa "Gaṅgā". Pāli ở
  khoá này không có `nadī` nên không thêm chữ "River". `sabbā tā` → "all of them".

  Cùng Pāli y hệt ở `sn45.116-120:1.2`, nên hai bài dùng chung một cách dịch.

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
