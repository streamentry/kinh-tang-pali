notes: |-
  Bài rút gọn của sn45.121, và bản Anh đã ghim CÓ bản đầy đủ ở sn45.121. Đó là nguồn đối chiếu tốt
  nhất, dùng cho cả năm khoá:

  - 1.11 và 1.14 khớp bản ghim `sn45.97:1.2` ("In the same way, a mendicant who develops and cultivates
    the noble eightfold path slants, slopes, and inclines to extinguishment.") và bản ghim sn45.121:1.2.
    `nibbāna` → "extinguishment" là quy ước chung của cả bản đã ghim lẫn các lớp lấp đã có (sn45.97,
    sn45.161 …), không phải lựa chọn riêng.
  - 1.13 lấy "whose objective, destination, and culmination is freedom from death" cho
    `amatogadhaṁ amatoparāyanaṁ amatapariyosānaṁ` từ sn45.121:1.4; mở đầu "It's when a mendicant develops
    right view …" dùng đúng khuôn lớp lấp đã có ở sn45.97:1.4.
  - 1.10 theo lớp lấp đã publish ở sn45.108:1.2 (Pāli giống hệt, chỉ khác `samuddaninnā` thay
    `pācīnaninnā`): "the Ganges, Yamunā, Aciravatī, Sarabhū, and Mahī, all of them slant, slope, and incline
    to the ocean". `gaṅgā` → "Ganges" vì bản đã ghim của chính bài này chỉ dùng "Ganges" (ở 0.2); bản Việt
    dự án dùng "Gaṅgā", lớp lấp theo tiền lệ sn45.108.
  - 1.12 chép nguyên văn lớp lấp đã publish ở sn45.97:1.3 (Pāli trùng nguyên văn).

  Dấu lược: 1.13 giữ ĐÚNG MỘT `…`, không mở rộng, nên tên tám chánh điều không hiện — cùng hậu quả đã
  ghi ở sn45.97.

  Đường may đã ghi nhận: `bahulīkaronto` ("develops and cultivates") có ở 1.11 nhưng KHÔNG có ở 1.12 và
  1.14, vì bản ghim sn45.97:1.3 và lớp lấp sn45.97:1.5 (đã publish, Pāli trùng nguyên văn) cũng bỏ nó.
  Giữ nguyên văn đã có hơn là tự sửa một bản đã xuất bản; nên ghi lại để một lượt rà sau sửa cả ba.

  `triangulation` 8.0: người viết lớp lấp cũng là người chấm.
