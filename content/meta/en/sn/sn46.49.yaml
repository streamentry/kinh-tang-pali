notes: |-
  Đây là **bản thứ hai** của cặp song trùng với `sn46.50`, và **bản thứ ba** sau `sn46.13`. Cả ba có cùng khung `pāṭikaṅkhaṁ → Kathañca → Idha … bhāveti → Evaṁ`.

  Tiền lệ lấy từ chính tầng Anh đã ghim, và ở đây Pāli **trùng nguyên văn** nên tôi dùng lại đúng cách dịch đã có:
  - `sn46.13:1.3` có Pāli **giống hệt** `1.2` → "A mendicant accomplished in rational application of mind can expect to develop and cultivate the seven awakening factors."
  - `sn46.13:2.1` giống hệt `1.3` → "And how does a mendicant with rational application of mind develop and cultivate the seven awakening factors?"
  - `sn46.13:2.4` giống hệt `1.6` → "That’s how a mendicant with rational application of mind develops and cultivates the seven awakening factors.”
  - `sn46.48:1.3` là khuôn của cả `1.3/1.6` với `kalyāṇamitta` → dùng làm mẫu cho `sn46.50`.
  - Vế `vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ` → "which relies on seclusion, fading away, and cessation, and ripens as letting go" (`sn46.1:1.12`, `sn54.2:1.3`, `dn33:1.11.97` — 117 khoá Pāli trùng).

  ⚠ **Không mở rộng `…pe…`.** Tầng ghim ở `sn46.48:1.5` và `sn46.13:2.2` **bung** `…pe…` ra thành "mindfulness, investigation of principles, energy, rapture, tranquility, immersion". Lớp lấp giữ đúng một `…` ở `1.4`. Đây là khác biệt **có chủ ý** so với bản ghim, và là hệ quả trực tiếp của quy tắc không mở rộng dấu lược.

  ⚠ **Lớp lấp này KHÔNG phải lớp đọc Anh độc lập cho bài này.** `content/meta/sutta/sn/sn46.49.yaml` ghi `quality.assessed_by: "OpenCode Space Bunny Free (agent)"`, đúng công cụ đã viết lớp lấp này. `triangulation` hạ xuống **7.5**; `validate` sẽ **cảnh báo** rằng phủ Anh ở bài này dựa trên bản lấp của chính người viết bản Việt. Tôi **không sửa** scorecard tiếng Việt.

  Điểm `technical_integrity` = 9.6 vì lát này bị cấm chạy cổng. Còn lại: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
