notes: |-
  Cả ba khoá đều có tiền lệ NGUYÊN VĂN, không phải tiền lệ dựng lại:

  1.12 `Taṁ vo pahīnaṁ hitāya sukhāya bhavissati.` trùng nguyên văn 1.2, 1.6 và 1.18
  đã ghim trong chính bài này ("Giving it up will be for your welfare and happiness."),
  nên dùng lại y nguyên — luật 3 của lớp lấp, và chốt đã in ra cảnh báo trùng Pāli.
  1.9 `Te vo pahīnā … bhavissanti.` trùng nguyên văn sn35.139:1.11 (Sujato) →
  "Giving them up will be for your welfare and happiness." Số nhiều là bắt buộc:
  `pahīnā … bhavissanti` là số nhiều, và `Te` là chủ ngữ số nhiều.
  1.15 `So vo pahīno …` trùng nguyên văn sn35.101:3.3 và sn35.138:1.9 (Sujato) →
  cùng câu đó; Pāli 1.15 có thêm `…pe…` nên bản lấp giữ đúng một dấu lược.

  `hitāya sukhāya` = "for your welfare and happiness" giữ nguyên bản đã ghim; đếm trong
  SN đã ghim cụm này là khuôn duy nhất, không có cách dịch cạnh tranh.

  Lưu ý về bối cảnh: 1.8, 1.11, 1.14, 1.17 (`Taṁ pajahatha.` / `Te pajahatha.`) vẫn để
  trống vì thuộc lát khác, nên đọc 1.9 và 1.12 cần biết vế "give it up" đã nằm ở khoá
  trước trong bản Pāli. `segment_alignment` vẫn 10.0 vì đây là giới hạn phân chia lát, không
  phải lỗi căn khoá. `triangulation` 8.0 là đặc thù của lớp lấp.
