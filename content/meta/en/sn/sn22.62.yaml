notes: |-
    Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược. `sn22.62` có **13** khoá để trống; lát này
    được giao 7.

    **Sáu khoá lấy lại nguyên văn lời đã ghim, theo đúng cặp đã có trong bài.** Bài này đi qua
    `rūpa` → `vedanā` → `saññā` + `saṅkhārā` → `viññāṇa`, mỗi vòng ba thì đã qua / chưa sinh / đã sinh,
    và mỗi vòng kết bằng cặp phủ định. Lớp lấp điền đúng sáu vế phủ định mà Sujato đã bỏ trống, lấy
    lời ở vòng tương ứng đã ghim — cùng một mẫu câu, khác đúng danh từ:

    - `2.2` (`tassā`, `vedanā`, đã qua) ← `1.5`: "It’s not ‘is’ or ‘will be’."
    - `3.3` (`tesaṁ`, `saṅkhārā`, đã qua) ← `1.5`: "It’s not ‘is’ or ‘will be’."
    - `6.2` (`tassā`, `vedanā`, chưa sinh) ← `5.2`: "It’s not ‘is’ or ‘was’."
    - `7.3` (`tesaṁ`, `saṅkhārā`, chưa sinh) ← `5.2`: "It’s not ‘is’ or ‘was’."
    - `10.2` (`tassā`, `vedanā`, đã sinh) ← `9.2`: "It’s not ‘was’ or ‘will be’."
    - `11.3` (`tesaṁ`, `saṅkhārā`, đã sinh) ← `9.2`: "It’s not ‘was’ or ‘will be’."

    Vế `na tesaṁ saṅkhā` có `tesaṁ` (số nhiều) chứ không phải `tassa`, nhưng tiếng Anh
    "It’s not …" không mang dấu số nhiều, và tầng đã ghim đã đặt danh từ ở khoá trước
    (`3.2`, `7.2`, `11.2` = "choices …") nên câu đọc liền mạch. `11.3` có thêm dấu phẩy lạ
    (`na tesaṁ saṅkhā, ‘bhavissantī’ti`) — lỗi chính tả trong Pāli tại commit đã ghim, **không** sửa
    Pāli và **không** nhân thêm dấu câu vào bản dịch.

    **Một khoá không có tiền lệ nào: `13.5`.** Pāli là `Majjhimapaṇṇāsakassa upayavaggo paṭhamo.`
    Đếm trên **143.886** khoá của tầng Anh đã ghim (toàn bộ `translation/en/sujato` trong cache
    đã ghim): chuỗi `paṇṇāsakassa` xuất hiện **0** lần, `Middle Fifty` **0** lần. Đây là cổng chương
    (`13.5` = **40** ký tự, và phép kiểm là `>= 40` nên coverage **có** đo) và tầng ghim im lặng ở
    đúng chỗ này.
    Bản lấp dịch: "The Involvement chapter is the first of the Middle Fifty."
    - `upayavaggo` → "the Involvement chapter": `upayavagga` đã được tầng ghim dịch là
      "6. Involvement" ở `0.2`, và Sujato dùng "chapter" cho `vagga` trong chú thích biên tập
      ("Tell in full as in the chapter on searches…").
    - `Majjhimapaṇṇāsakassa` → "the Middle Fifty": **đây là lựa chọn biên tập của lớp lấp**, ghi ra
      đây vì tầng ghim không có mẫu nào để đối chiếu. Tiền lệ gần nhất trong tầng ghim là
      `sn45.180:6.6` (`Maggasaṁyuttaṁ paṭhamaṁ.` → "The Linked Discourses on the Path, the first
      section."), cho thấy Sujato cũng để nhan đề cột vào một danh xưng riêng. Nếu người điều phốn có
      cách gọi khác cho `Majjhimapaṇṇāsaka` thì đây là chỗ cần sửa — không phải chỗ khác.

    **Còn 6 khoá trống lấp được mà lát này không được giao — báo lại.** `14.0`, `14.1`, `14.2`,
    `14.3`, `14.4`, `14.5`.
    - `14.1`–`14.5` là kệ `tassuddāna` của phẩm (`Tassuddānaṁ / Upayo bījaṁ udānaṁ, …`), tức bản
      tóm lược danh sách bài trong phẩm. `14.0` = `Tassuddānaṁ` (11 ký tự) và `14.2` = `Upādānaparivattaṁ;`
      (18 ký tự) đều **dưới** ngưỡng 40; `14.3` (25), `14.4` (19) cũng dưới ngưỡng; `14.1`
      = `Upayo bījaṁ udānaṁ,` (19 ký tự) dưới ngưỡng. Nghĩa là **cả năm khoá kệ đều không được
      coverage đo tới** — đây là "cổng không đo được gì", không phải "không cần ghi nhận".
      Tiền lệ lớp lấp đã có: `an3.70:41.0` (`Tassuddānaṁ`) → "Its summary verse:".
    - `14.5` = `Vaggo niruttipathena cāti.` (26 ký tự) — dưới ngưỡng.

    **`triangulation` hạ xuống 7.5, và đây là lý do phải báo.** Bản Việt của bài này
    (`content/meta/sutta/sn/sn22.62.yaml`) ghi `quality.assessed_by: "OpenCode Space Bunny Free
    (agent)"` — **trùng đúng** công cụ đang viết lớp lấp này. Nên bản Việt và bản lấp không phải hai
    lớp đọc độc lập. Lớp lấp **không** tuyên bố đã đối chiếu English. File Việt đang ở
    `status: draft`; **không** sửa file đó (nằm ngoài lát này).

