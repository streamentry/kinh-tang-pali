notes: >-
  The sutta is a long ladder: a wise lay follower consoles a gravely ill one, and the consolation is a
  sequence of "you should turn your mind away from X and fix it on Y", one rung above the last — human
  sensual pleasures, the gods of the four great kings, the thirty-three, Yama's realm, the joyful gods,
  those who love to create, those who control what others create, and finally the realm of divinity, which
  is itself impermanent, so that the mind ends at the cessation of reality. The pinned edition translates the
  first rung in full and the rest only in outline, which flattens exactly the shape the sutta is built on.

  `6.4` and `7.2` are the two rungs the pinned edition lost, and both are filled by reusing the pinned
  wording of the rungs that survived rather than by translating fresh:

  - `6.4` is structurally identical to `5.7` ("It would be good to turn your mind away from human sensual
    pleasures and focus it on the gods of the four great kings.’") and to `7.8` ("…the gods who control
    what is created by others and focus it on the gods of the realm of divinity.’"). The fill keeps that
    frame — "turn your mind away from … and focus it on …" — and substitutes only the two terms the Pāli
    names, so the three rungs read as one series rather than three phrasings.
  - `7.2` is the reply rung, structurally identical to `6.2` and `7.10`, both of which the pinned edition
    reduces to "‘I have done so,’ they should say: ". The fill takes that sentence verbatim. Expanding the
    reply's content here while `6.2` and `7.10` stay collapsed would make this one rung louder than the two
    on either side of it for no gain in meaning, since the content is already stated by the counsel each
    reply answers.

  `1.5`–`1.6` and `1.9`–`1.10` are the same report of the robe-making heard twice: once as Mahānāma
  recalls it to himself (`1.4` "Mahānāma the Sakyan heard about this."), once as he tells the Buddha
  (`1.8` "sutametaṁ, bhante:"). Their Pāli is the Pāli of `1.2`–`1.3`, which the pinned edition translates
  as "several mendicants were making a robe for the Buddha, thinking that / when his robe was finished and
  the three months of the rains residence had passed the Buddha would set out wandering." The fill reuses
  that wording, adds only `kira` as "it seems", and keeps the pinned past tense so the three occurrences do
  not disagree about whether the robe is finished. The two pairs differ only in their quotation marks — the
  second is nested one level deeper inside Ānanda-free dialogue — and each pair takes the marks its own
  Pāli carries, including the `ti` that closes the report.

  `ambiguity_integrity` is 9.0 because two decisions here are judgement without an English witness. The
  first is tense: `1.6` and `1.10` report a future (`pakkamissatī`) in Pāli, and rendering that as the
  pinned past "would set out wandering" reads as remembered speech rather than a report of what was said,
  which is defensible but not forced. The second is `6.4`'s "the gods of the thirty-three": Pāli
  `tāvatiṁsa` is a numeral compound, and the pinned edition spells it out in words at `6.3` and `7.3`
  ("the gods of the thirty-three"), so the numerals are followed here.

  Triangulation is capped at 8.0: Sujato translates none of these six segments.