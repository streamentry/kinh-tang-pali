notes: |-
    Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược. `sn3.18` có đúng **7** khoá để trống, lát
    này giao hết.

    **Sáu khoá trong bảy là lời đã ghim, chép lại — và đó là chuyện bắt buộc, không phải tiện lợi.**
    Bài này nói vua Pasenadi `kalyāṇamitta` ba lần cho ba nhóm người (phi tần nội cung `9.1`–`9.3`,
    quý tộc tùy tùng `10.1`–`10.3`, quân đội `11.1`–`11.3`), rồi nói lần thứ tư cho dân thành thị
    và thôn quê `12.1`–`12.3`. Nếu dịch riêng ba lần đầu thì bài sẽ có ba bản dịch khác nhau cho
    **một** câu, và người đọc sẽ tưởng vua nói khác đi với từng nhóm. Vì vậy:

    - `9.2` — Pāli trùng **nguyên văn** `12.2` (`‘rājā kho appamatto viharati, appamādaṁ
      upanissāya.`) ⇒ chép nguyên văn lời đã ghim: "‘The king lives diligently, supported by
      diligence."
    - `10.2` và `11.2` — Pāli khác `12.2` **đúng một dấu phẩy** (`viharati appamādaṁ` thay cho
      `viharati, appamādaṁ`), và hai khoá này trùng nguyên văn **nhau**. Câu tiếng Anh không đổi, nên
      vẫn lấy nguyên văn lời đã ghim. Ghi dấu phẩy đó ra vì đó là khác biệt duy nhất giữa Pāli của
      ba khoá và Pāli của khoá đã ghim.
    - `9.3`, `10.3`, `11.3` — ba khoá trùng nguyên văn nhau, Pāli giống `12.3` đúng dấu chấm hỏi
      (`…upanissāyā’ti?`) khác `…upanissāyā’ti.`. Chép lời `12.3` rồi **đổi dấu kết** cho khớp Pāli
      từng khoá: `!’` → `.’`. Vì vậy ba khoá đều là
      "We’d better live diligently, supported by diligence.’"

    **Một khoá phải tự dịch: `2.2`.** Đức Thế Tôn chép lại lời vua. Pāli khoá này **không có dấu
    nháy kép nào** (mở bằng `Svākkhāto` trần), nên bản lấp cũng không có — `2.1` đã đóng nháy kép
    của Đức Thế Tôn bằng câu "That’s so true, Great King! That’s so true!” said the Buddha".
    Vế `So ca kho kalyāṇamittassa kalyāṇasahāyassa kalyāṇasampavaṅkassa, no pāpamittassa no
    pāpasahāyassa no pāpasampavaṅkassā` **trùng nguyên văn** vế ở `1.4`, nên chép nguyên văn lời
    đã ghim, chỉ đổi `svākkhāto bhagavatā dhammo` → `svākkhāto mayā dhammo`:
    "The teaching is well explained by me, Great King. But it’s for someone with good friends,
    companions, and associates, not for someone with bad friends, companions, and associates."
    Giữ "But" vì đó là lời Sujato đã dịch cho đúng Pāli ấy ở `1.4`; đổi sang "And" sẽ khiến cùng
    một vế Pāli mang hai cách dịch trong một bài.

    **Thuật ngữ — không khoá nào tự đặt.** `kalyāṇamitta/sahāya/sampavaṅka` → "good friends,
    companions, and associates"; `appamāda` → "diligence"; `upanissāya` → "supported by"; đều lấy từ
    lời đã ghim. Bản Việt dùng *bạn tốt, bạn đồng hành tốt, bạn thân tín tốt* và *không phóng dật* —
    chỉ để đối chiếu nghĩa, không phải nguồn lấy chữ.

    **`triangulation` hạ xuống 7.5, và đây là lý do phải báo.** Bản Việt của bài này
    (`content/meta/sutta/sn/sn3.18.yaml`) ghi `quality.assessed_by: "Muse Spark"` — đó là **tên
    phát hành của chính công cụ đang viết lớp lấp này** (`source/tooling.yaml`:
    `opencode-space-bunny`, `release: "Muse Spark 1.3 Free"`, `modelId: space-bunny-free`). Nên bản
    Việt và bản lấp **không phải hai lớp đọc độc lập** cho bài này. Lớp lấp **không** tuyên bố đã
    đối chiếu English. Không sửa file Việt — chỉ báo lại. (Người viết bản Việt là
    `Lê Việt Hồng (Cư Sĩ Chánh Niệm)` với `ChatGPT (OpenAI)` hỗ trợ, nên phần *dịch* vẫn độc lập;
    phần *chấm điểm* thì không.)

