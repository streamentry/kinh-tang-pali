    ## Bốn nhóm khoá (đo bằng cách so Pāli **từng khoá** trong cùng bài, dấu lược coi là ký tự đại diện)

    | nhóm | số | khoá |
    |---|---|---|
    | **A** — Pāli trùng nguyên văn khoá đã có lời trong bài | **6** | `6.8`, `7.2`, `10.8`, `11.2`, `12.2`, `12.3` |
    | **B** — Pāli gần trùng (thay danh từ, hoặc lược nuốt mất đoạn giữa) | **8** | `1.7`, `7.1`, `8.1`, `8.2`, `9.8`, `9.9`, `11.1`, `12.1` |
    | **C** — Pāli không có lời nào ở tầng, phải tự dịch | **1** | `15.4` |
    | **D** — Pāli trùng nhau nhưng lời tầng khác nhau | **0** | — |

    **D = 0 là kết quả đo, không phải đoán.** Bài này có **5** nhóm khoá trùng Pāli byte-for-byte, nhưng
    trong mọi nhóm thì các khoá còn lại đều là **chính các khoá lấp** — tầng đã ghim im lặng ở cả hai
    vế, nên không có "lời tầng" nào để mâu thuẫn. Lớp lấp viết **giống hệt nhau** trong từng nhóm:
    `8.2` = `9.9`, `6.8` = `10.8`, `7.2` = `11.2`; và `12.2`/`12.3` chép nguyên văn `15.2`/`5.3`.

    ## Nhóm A — lấy nguyên văn lời đã ghim ở khoá anh em

    - `7.2`, `11.2` ← Pāli trùng nguyên văn `4.2` và `14.2`: "Those who practice well have a
      footing in this teaching and training."
    - `12.2` ← trùng nguyên văn `15.2`: "Those who are well freed are consummate ones."
    - `12.3` ← trùng nguyên văn `5.3`: "For consummate ones, there is no cycle of rebirths to be found."
    - `6.8`, `10.8` ← trùng nguyên văn `3.7` và `13.8`, **nhưng cố ý lệch**: xem mục "lệch có chủ ý" dưới.

    **4** giá trị trong lớp lấp trùng byte với một câu đã ghim ngay trong bài này; thêm `6.8`/`10.8`
    thì có **6** giá trị trùng byte với một câu nào đó của tầng Anh đã ghim **trong toàn tầng `sn`**.

    ## Nhóm B — dựng lại từ lời đã ghim, chèn lại phần bị lược nuốt

    Tỉ lệ khớp đo bằng so sánh chuỗi Pāli đã gộp dấu lược:
    - `1.7` ← `1.5`: Pāli `1.7` là **hậu tố nguyên văn** của `1.5` (khớp tuyệt đối). Lớp lấp
      "To the gods and humans I announced my supreme perfect awakening." — `sadevamanussāya` là
      cách ngữ **số nhiều cách gián**, nên nó phải đứng sau `paccaññāsiṁ` ("I announced"), không
      nằm trong danh sách địa phương như cách Sujato đọc ở `1.5` ("…its gods and humans"). Cả hai cách
      đọc đều chỉ cùng một chủ thể; lớp lấp chọn cách đọc cú pháp.
    - `7.1` ← `4.1` (khớp 0,813): thay `rūpaṁ` → `vedanaṁ`. Chèn lại `vedanāsamudayaṁ`,
      `vedanānirodhaṁ`, `vedanāya` mà cụm `rūpa…` ở `4.1` đã che.
    - `11.1` ← `4.1` (khớp 0,805): thay `rūpaṁ` → `saṅkhāre`, `rūpassa` → `saṅkhārānaṁ`.
    - `12.1` ← `5.1` (khớp 0,766): thay như trên, và `12.1` **viết đủ** cả giữa (`samudaya`,
      `nirodha`) nên lớp lấp không đặt dấu lược nào.
    - `8.1` ← `5.1` (khớp 0,738): Pāli `8.1` có **hai** `…pe…`. Lớp lấp giữ **đúng hai** `…`.
    - `8.2`, `9.9` ← `5.3` (khớp 0,842): Pāli hai khoá này **mất** mảng `Ye kevalino` vì nó nằm
      trong dấu lược của `8.1`/`9.8`, nên lớp lấp bỏ mảng đó: "There is no cycle of rebirths to be found."
      Hai khoá trùng byte, lớp lấp viết giống nhau.
    - `9.8` ← `3.7`/`13.8` (khớp 0,945): Pāli có **hai** `…pe…`, lớp lấp giữ **đúng hai** `…`.

    **Tiền lệ chéo trong chính tầng Anh đã ghim, đếm trên toàn tầng `sn`** — dùng để kiểm rằng lớp lấp
    không bịa cách diễn đạt riêng:
    - `sammādiṭṭhi …pe… sammāsamādhi.` — **46** khoá, **31** khoá có lời đã ghim.
    - `Ye suppaṭipannā, te imasmiṁ dhammavinaye gādhanti.` — **7** / **4**.
    - `Ye suvimuttā, te kevalino.` — **4** / **3**.
    - `Ye kevalino vaṭṭaṁ tesaṁ natthi paññāpanāya.` — **4** / **3**.
    - `vaṭṭaṁ tesaṁ natthi paññāpanāya.` — **5** / **0** ⇒ đây là lý do `8.2` và `9.9` phải tự dựng
      từ `5.3` chứ không có câu nào để chép.
    - `sammādiṭṭhi …pe… sammāsamādhi …pe…` — **2** / **0**, cả hai đều để trống.

    Bài anh em `sn22.57` có **cùng** những lỗ hổng này ở vị trí tương ứng (`9.1`, `9.2`, `10.8`, `10.9`,
    `13.1`–`13.3` đều trống) ⇒ đây là lỗ hổng có hệ thống ở commit đang ghim, không phải sự cố riêng
    của `sn22.56`. `sn22.57` **không** thuộc lát này, không sửa.

    ## Nhóm C — một khoá tự dịch, và nó **không có tiền lệ nào** trong tầng Anh đã ghim

    `15.4` = `Catutthaṁ.` Đếm trên toàn bộ tầng Anh đã ghim trong cache đã ghim (5 bộ `an`, `dn`,
    `kn`, `mn`, `sn`, **3.903** tệp ghép cặp với Pāli): **1.107** khoá có Pāli đúng bằng một nhãn
    thứ tự trần trục, và Sujato để trống **1.107/1.107** — `Paṭhamaṁ` 301, `Dutiyaṁ` 274, `Tatiyaṁ` 269,
    `Catutthaṁ` 263. ⇒ **không có tiền lệ tiếng Anh nào trong tầng đã ghim**, ở cả phạm vi `sn22` lẫn
    toàn tầng, nên không thể "đếm cả hai số" cho công thức này: **0 và 0**.
    Lớp lấp viết "Fourth." theo đúng **một** tiền lệ có thật của chính lớp lấp trong kho
    (`sn33.4:1.13`, Pāli `Catutthaṁ.` → "Fourth."). Ở phạm vi `sn22` thì lớp lấp có **0** tiền lệ.
    🔴 Nói rõ để người biên tập phán: đây là lựa chọn biên tập của lớp lấp, không phải kế thừa từ
    tầng đã ghim. Đối chiếu để biết dự án đọc `Catutthaṁ` là "thứ tư" như thế nào (tầng Việt dự án):
    `sn22` → "Thứ bốn." **75** vs "Thứ tư." **40**; toàn tầng Việt → "Thứ tư." **134** vs "Thứ bốn."
    **95** ⇒ hai phạm vi đảo chiều đa số, nên ghi cả hai số. Bài này không có tầng Việt (xem dưới), nên
    hai số đó **không** phải tiền lệ cho bài, chỉ là bối cảnh về cách dự án đọc nhãn thứ tự.
    Đừng nhầm `Catutthaṁ` ở đây với `catutthaṁ jhāna` ("the fourth absorption"): trong tầng đã ghim chỉ
    có **4** khoá Pāli chứa chuỗi `Catutthaṁ` mà Sujato có lời, và cả **4** đều là nghĩa "tu chứng
    thứ tư", không phải nhãn thứ tự.

    ## Cố ý lệch tầng Anh đã ghim — đo được, và lý do

    1. **`6.8`, `10.8` giữ `…` nơi tầng đã ghim bỏ.** Pāli `sammādiṭṭhi …pe… sammāsamādhi.` có
       **một** dấu lược; lời đã ghim ở `3.7`/`13.8` **không** dấu nào. Lớp lấp: "right view … right
       immersion." Đây không phải sáng tạo: ngay trong tầng đã ghim, `sn22.84:10.9` (Pāli
       `sammādiṭṭhiyā …pe… sammāsamādhissa.`) được Sujato viết **"right view … right immersion."**
       ⇒ lớp lấp giữ đúng quy ước của chính tầng đã ghim, chỉ áp dụng nhất quán sang hai khoá mà
       tầng đã ghim im lặng. **Số đo:** lớp lấp **6** dấu `…`; Pāli có **13** dấu lược cả bài;
       tầng đã ghim chỉ còn **6**.
    2. **`1.7` đọc lệch với cách Sujato đọc ở `1.5`/`1.6`.** Tầng đã ghim đã **âm thầm mở rộng** dấu
       lược ở `1.6`, nên câu của `1.7` đã bị nói *trước* một lần trong lời `1.6`. Người đọc bốn bản
       sẽ thấy mảng đó lặp. Lớp lấp **không** thêm dấu lược để che (Pāli `1.7` không có dấu lược) và
       **không** sửa lời đã ghim. Đây là hệ quả nhìn thấy được của lỗi tầng đã ghim, ghi ra đây thay
       vì che.
    3. **`8.2`, `9.9` bỏ mảng "For consummate ones,"** mà `5.3` có. Không phải tùy chọn: Pāli hai khoá
       này không chứa mảng đó (nó nằm trong dấu lược của khoá trước). Giữ lại sẽ thêm từ không có
       trong Pāli.
    4. **`12.1` dùng gạch dài như `5.1`** dù Pāli `12.1` viết đủ, không có dấu lược — vì `4.1`
       (Pāli cũng viết đủ) tầng đã ghim vẫn dùng gạch dài. Lớp lấp theo hình thức đã ghim, không
       theo hình thức của riêng Pāli khoá này.

    **Ngoặc kép và nháy: lệch 0, không cần ngoại lệ.** Đếm từng khoá trên cả bài: `“` Pāli **1** ở
    `1.2` / tầng đã ghim **1** ở `1.2`; `”` Pāli **1** ở `15.3` / tầng đã ghim **1** ở `15.3`;
    `‘’` Pāli **0** / tầng đã ghim **0**. Lớp lấp cũng **0**. (Tầng đã ghim có **2** ký tự `’` ở
    `1.5`, nhưng đó là dấu nháy đơn trong "didn’t", không phải nháy kép — không phải lệch.) Vì vậy
    không có chỗ nào cố ý lệch quy ước nháy của tầng đã ghim.

    ## 🔴 Lỗi kiểu `sn22.76` — có **ngay trong bài này**, cả hai chiều

    Đếm từng khoá trên cả bài, so số dấu lược (mỗi `…pe…` tính là **một** dấu):
    - **Mở rộng âm thầm** (Pāli có, tiếng Anh không): **4** khoá — `1.6`, `3.7`, `5.1`, `13.8`.
    - **Bịa thêm** (Pāli không có, tiếng Anh có): **3** khoá — `6.7`, `9.7`, `10.7`. Cả ba Pāli kết
      bằng `seyyathidaṁ—`, tức gạch dài, và Sujato đặt `…` vào chỗ không có dấu lược.
    Pāli là authority; lớp lấp không sửa được bốn khoá có lời đã ghim (không được shadow) và không
    đụng ba khoá kia (ngoài lát) — nên **báo lại**, không sửa ở đây.

    ## 🔴 `triangulation` hạ xuống 7,8, và đây là lý do phải báo

    `sn22.56` **không có lớp Việt**: cả `content/translation/vi/project/sutta/sn/` lẫn
    `content/meta/sutta/sn/sn22.56.yaml` đều vắng mặt. ⇒ **không có tầng Việt nào để đối chiếu
    nghĩa**, và đây là hình hạng yếu hơn hẳn trường hợp "bản Việt trùng công cụ" mà mục 4 nói tới.
    Với 15 khoá này, tầng Anh đã ghim **im lặng đúng 15/15**, nên **không có một câu tiếng Anh
    độc lập nào** để đối chiếu. Lớp lấp **không** tuyên bố `sn22.56` đã đối chiếu English.
    Điều duy nhất giữ được sự nhất quán là các khoá anh em **trong chính bài này** và các câu trùng
    byte ở `sn22.57`/`sn22.84`.
    🔴 **Còn phải nói thẳng: tiền đề "cả phẩm `sn22` đã `published` toàn bộ" không đúng.** Trong
    **159** bài của `sn22` mà catalog khai, có **23** bài không có tệp dịch Việt, kể cả `sn22.56`
    (`22.1 2 3 5 7 38 49 55 56 57 59 60 79 80 81 82 84 85 86 87 89 90 101`). Cùng kiểu, trong
    lớp lấp `sn22` có **38** tệp, nhưng **0** trong số đó chứa khoá nhãn thứ tự trần trục — nên
    `Catutthaṁ.` **không** có tiền lệ `sn22` nào để bắt chước, dù tiền đề nói ngược lại.

