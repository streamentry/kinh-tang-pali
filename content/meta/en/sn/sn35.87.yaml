notes: |-
    Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược. `sn35.87` có **9** khoá để trống; lát này
    được giao 7.

    **Ba khoá trùng nguyên văn nhau trong chính bài, nên một bản dịch cho cả ba.** `3.3`, `3.5`,
    `3.7` đều là `Na me, āvuso, khamanīyaṁ, na yāpanīyaṁ …pe… no paṭikkamo.` — Channa kêu ba lần
    giữa ba hình ảnh đau (gió bào trên đầu, dây da quanh đầu, dao mổ bụng). Ba khoá này **phải**
    giống nhau từng chữ, nếu không bài sẽ tự mâu thuẫn:
    "I’m not keeping well, I’m not getting by … its fading is not evident."
    - `khamanīyaṁ, na yāpanīyaṁ` → "I’m not keeping well, I’m not getting by": nguyên văn từ `3.1`
      và `3.9` đã ghim (đếm trên toàn tầng Anh đã ghim: cụm này **18** lần, và không tồn tại cách dịch nào khác cho
      `khamanīyaṁ, na yāpanīyaṁ`).
    - `no paṭikkamo` → "its fading is not evident": `3.1` đã ghim cặp `abhikkamosānaṁ paññāyati no
      paṭikkamo` thành "its growing is evident, not its fading", nên lớp lấp giữ đúng hai từ
      **fading / evident** và chỉ rút gọn mệnh đề.
    - Dấu lược: Pāli có `…pe…` ⇒ bản lấp giữ **đúng một** `…`, không kể lại khoản đau đã nêu ở
      `3.2`/`3.4`/`3.6`.

    **Bốn khoá `9.2`, `9.3`, `10.2`, `10.3` dựng trên hai câu đã ghim, chỉ đổi giác quan.**
    Sujato đã nén ở `9.1`/`10.1` (`Cakkhusmiṁ… cakkhuṁ cakkhuviññāṇaṁ cakkhuviññāṇaviññātabbe
    dhamme…` → "in these things that you regard them in this way"), nên lớp lấp giữ đúng cách nén ấy
    và chèn cụm giác quan đã dùng sẵn trong bài ("in relation to X", đếm **18** lần ở tầng ghim, gồm
    `sn22.85:9.2`…`9.12`):
    - `9.2` (lưỡi) và `9.3` (tâm/trí): "in relation to the tongue/mind, what have you seen, what have
      you directly known in these things that you regard them in this way: ‘This is not mine, I am not
      this, this is not my self’ …" / `…’?”`
    - `10.2` (lưỡi) và `10.3` (tâm/trí): "in relation to the tongue/mind, after seeing cessation, after
      directly knowing cessation in these things I regard them in this way: ‘This is not mine, I am not
      this, this is not my self’ …" / `…’.”`
    Dấu kết bám **đúng** Pāli từng khoá, và chỗ này lớp lấp đã tự sửa một lỗi trong lượt đầu:
    `9.2` kết bằng `’samanupassasi … ` và `10.2` kết bằng `’samanupassāmi …pe… ` — **không** có dấu
    nháy kép nào, nên bản lấp kết bằng `’ …` chứ không phải `’” …`. Lượt đầu lớp lấp đã đóng ngoặc
    kép ở hai khoá này, lệch một dấu so với Pāli và lệch cả với cách tầng ghim đã làm ở `9.1`
    (Sujato đóng `’?”` ngay trong `9.1`, xem `sn35.87:9.1`), nên ngoặc kép ở `9.3` và `10.3` mới là
    chỗ đúng (Pāli hai khoá đó **có** `”ti?` và `”ti.`).

    **Còn 2 khoá trống lấp được mà lát này không được giao — báo lại.** `13.12`, `13.13`.
    - `13.12` = `evametaṁ, sāriputta, dhārehī”ti.` (32 ký tự) — **dưới** ngưỡng 40; và Pāli khoá này
      trùng nguyên văn với `5.9` đã ghim ("You should remember this: ‘The mendicant Channa will commit
      suicide blamelessly.’”"), nên lấy lại nguyên văn lời đã ghim.
    - `13.13` = `Catutthaṁ.` (10 ký tự) — colophon, dưới ngưỡng.

    Bài này **không có lớp Việt** (`content/translation/vi/project/sutta/sn/sn35.87…` và
    `content/meta/sutta/sn/sn35.87.yaml` đều vắng mặt), nên không có tầng Việt để đối chiếu nghĩa;
    `triangulation` hạ vì không có bản Anh độc lập. Bốn lệnh cổng còn lại **chưa** chạy vì lát này bị
    cấm: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
