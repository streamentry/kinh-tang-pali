notes: >-
  Two halves. The first (1.1–1.9) says all is contaminated, and Sujato translates it almost in full.
  The second (1.10–1.15) is the consequence — the noble disciple grows disillusioned — and Sujato
  gives it one sentence, 1.10, then stops: 'Seeing this, a learned noble disciple grows disillusioned …
  '. Every later segment of the consequence is blank, so as published the sutta asserts a
  consequence and never works out. Four of the six filled segments are that missing working-out.

  The wording is Sujato's wherever Sujato states it. 1.6 reuses 1.4 and 1.9 verbatim with the sense
  organ swapped to tongue contact — same "And the pleasant, painful, or neutral feeling that arises
  dependent on X is also contaminated", which is why 1.6 keeps its position as the tongue member of a
  series the pinned edition already frames. 1.11 and 1.13 reuse 1.4's frame for the `nibbindati` half,
  and the verb is Sujato's "grows disillusioned" from 1.10. 1.12 takes its four nouns from 1.8, which
  he states in full: "The mind, ideas, mind consciousness, and mind contact". The `-pi` on each member
  is rendered once, at the front — four "even with"s in a row would misread as four separate stresses
  where the Pāli carries one.

  1.14 is the only segment with no anchor anywhere in the pinned edition, and it is a consequence
  claim in its own right: nibbidā → virāga → vimutti. It is rendered directly from the Pāli. The risk
  in it is not the words but the scope — `vimuttasmiṁ vimuttamiti ñāṇaṁ hoti` is a statement about
  what is known of the released one, not the released one declaring itself; the fill keeps it as
  "there is the knowledge that they are released" for that reason, and does not resolve it into "I am
  released".

  Two things a human editor should look at, recorded here rather than acted on.

  2.7 is a colophon, not teaching: `Saḷāyatanavagge paṭhamapaṇṇāsako samatto` closes the first set
  of fifty in the six-sense-base vagga. It is filled because it is a segment of the pinned Pāli, is
  blank in the pinned edition, and measures 41 characters — one over the `substantivePaliMinChars`
  threshold of 40. That also puts it in an awkward position: the neighbouring vagga colophon at 1.17,
  `Sabbaaniccavaggo pañcamo`, measures 25 and so falls outside the fill entirely. The English column
  therefore gains one colophon and not the other. This is a property of the character-count rule, not
  a judgement made here, and the right place to change it is `source/layers.yaml` or
  `reference.ts`, not this file.

  On 1.11 and 1.13, "is also one they grow disillusioned with" keeps the subject-first frame of 1.4 and
  1.9 so that the contaminated half and the disillusioned half read as mirrors. A verb-first
  alternative was available and would read more easily, but it would have split one formula in two
  inside a sutta that uses one formula.

  Triangulation is capped at 8.0: Sujato translates none of these six passages.