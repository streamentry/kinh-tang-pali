  · `4.3` ← `1.3` — 0,9806 / **1,0000**: trùng nguyên văn, chỉ khác dấu nháy (`“…”` ở `1.3`, `‘…’` ở `4.3`).
  · `4.4` ← `1.4` — 0,9650. Chèn `Then, sir,` + chủ ngữ `King Pasenadi of Kosala`, và **trả lại**
    `rājānaṁ māgadhaṁ ajātasattuṁ vedehiputtaṁ` mà tầng đã ghim nén thành “against Ajātasattu”.
  · `4.5` ← `1.5` — 0,9486. Chèn `Then, sir,` + **trả lại tên đầy đủ cả hai vua**; tầng đã ghim nói
