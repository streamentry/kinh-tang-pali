  **Phần tầng đã ghim nuốt mất mà lớp lấp chèn lại, tính từng khoá.**
  · Như nguyên văn, ở **mọi** khoá: `rājā māgadho ajātasattu vedehiputto` và `rājā pasenadi kosalo` được
    viết **đầy đủ**, vì tầng đã ghim nén ở `1.5`–`1.8` thành “Ajātasattu”, “against Ajātasattu”,
    “the two kings”. Trong `4.1`–`4.9` và `5.1` đó là lời các tỳ-kheo kể lại nói **độc lập**, nên tên bị nén
    sẽ mất thông tin có thật trong Pāli — và nhóm B cho phép chèn lại đúng phần đó.
  · `4.2`, `4.4`, `4.5`, `4.6`, `4.7`, `5.1`: `bhante` — tầng đã ghim bỏ hết, lớp lấp dựng lại thành “sir”.
  · `4.4`: chủ ngữ `King Pasenadi of Kosala` (tầng đã ghim dùng đại từ “he”).
  · `4.5`: tên đầy đủ **cả hai** vua (tầng đã ghim: “the two kings”).
  · `4.7`: chữ `this` cho `etadahosi` (tầng đã ghim: “thought,”).
  · **Không** có phủ định nào bị nén ở bài này. Đếm từng khoá: `4.8` giữ đúng **1** phủ định cho
    `adubbhantassa` (“I’ve never betrayed”), khớp với `1.8`; mười khoá còn lại của lớp lấp có **0** phủ định
    và Pāli của chúng cũng không có phủ định từ nào.

  **Danh xưng và thứ bậc, thống nhất ở cả mười một khoá.** `rājā māgadho ajātasattu vedehiputto` →
  “King Ajātasattu of Magadha, son of the princess of Videha”, lấy **nguyên văn** cụm này từ lời đã ghim ở
  `1.1`; `rājā pasenadi kosalo` → “King Pasenadi of Kosala”; `caturaṅginiṁ senaṁ` → “an army of four
  divisions”, cũng lấy nguyên lời đã ghim ở `1.1`. Pāli `1.3` và `4.3` dùng `kira` (nghe nói) và
  `abbuhuyyāto` (thì bị động), nên lớp lấp dịch `kira` → “it seems” và dùng thì hiện tại “has mobilized … and
  marched against me”, khác thì quá khứ của phần kể `1.1`/`4.1`. `mamaṁ` giữ thành “against me” vì đó là
  tiếng của chính vua Pasenadi.

  **Một điểm Pāli phải nói thẳng: `4.9` bị lược ba lần, `5.1` thì không.** Câu liệt kê bốn loại quân xuất
  hiện **hai lần** trong bài với hai hình thế khác nhau, và đây là khác biệt của chính bản Pāli đã ghim, không
  phải lỗi cắt segment: `1.9`, `2.1`, `5.1` viết `pariyādiyitvā` sau **cả bốn** vế, còn `4.9` chỉ viết sau
  vế đầu (`sabbaṁ assakāyaṁ sabbaṁ rathakāyaṁ sabbaṁ pattikāyaṁ pariyādiyitvā`). Lớp lấp dịch cả hai theo
  cùng một cách — “vanquished all of the elephant troops, cavalry, chariots, and infantry” — vì đây là lược
  **bằng văn phạm** chứ không phải dấu lược, và cả hai câu chứa **đúng một** danh sách; mở rộng nó ra không
  thêm ý nào. Lời tầng đã ghim ở `1.9` cũng vậy. Ghi ra ở đây vì người đọc bốn cột sẽ thấy hai đoạn tiếng
  Anh gần như trùng nhau dù Pāli khác nhau.

  **Dấu lược — 0, khớp Pāli.** Không khoá Pāli nào trong 11 khoá này chứa `…` (đo từng khoá), nên tổng dấu
  lược của bản lấp bài này bằng **0**: không có chỗ nào để thêm và cũng không có chỗ nào để mở rộng.

  **Ngoặc kép — khớp Pāli 11/11 khoá.** `1.3` `“…”` · `4.1` mở `“` · `4.3` `‘…’` · `4.8` mở `‘` ·
  `4.9` đóng `’”` · `5.1` `“…”` · `4.2` `4.4` `4.5` `4.6` `4.7` không nháy. Riêng `4.9` có **3** dấu `’`
  nhưng chỉ **1** là dấu đóng nháy, hai dấu kia là phồng âm trong `I’ve` và `don’t` — đã loại khi đếm.
  Ngoại lệ “theo quy ước nháy lồng của tầng đã ghim” không có gì để áp dụng ở đây: bài này có **29** khoá đã
  ghim lời và **0/29** khoá nào dùng nháy kép lồng. Lớp lấp khớp Pāli từng khoá, lệch có chủ ý = **0**.

