  có lời để mượn. Nhưng nó chính là **nguồn** của khoá B `4.3` (Pāli giống hệt, chỉ khác dấu nháy), nên
  không có khoá nào trong bài phải dịch “không có tiền lệ”.

  **Nhóm B — mười khoá `4.1`–`5.1`, dựng lại từ lời tầng đã ghim. Cột giữa là tỉ lệ khớp Pāli đo được
