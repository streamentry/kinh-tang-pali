notes: |-
  Cùng một khuôn với sn35.140/sn35.141/sn35.142 và lặp bốn lần cho (con mắt → lưỡi →
     thân → tâm). 1.5 và 1.6 lặp 1.2 và 1.3 của chính bài (đã ghim) với `jivhā` thay cho
     `cakkh`; `jivhā` = "tongue" theo 1.4 đã ghim. Ba bài chỉ khác nhau ở
     anicca/dukkhā/anattā, nên cùng một cách dịch cho cả ba — nếu không, ba bài sẽ dạy ba
     điều khác nhau về cùng một chủ đề.
  
  Ghi lại hai điểm cơ học: bản đã ghim ở 1.3 đã bỏ dấu `?` và bỏ luôn `…pe…` dù Pāli có
     đủ hai; 1.6 phải giữ `…` (luật 4) và bỏ `?` (Pāli 1.6 không có). Vì vậy 1.6 đọc là một
     mảnh câu không dấu hỏi — đó là hình thức bắt buộc, không phải lỗi dịch.
