notes: |-
  1.4 trùng NGUYÊN VĂN sn35.204:1.4, mà bản lấp đã publish tại đó dùng đúng câu
  "And what’s not-self should be truly seen with right understanding like this: ‘This is
  not mine, I am not this, this is not my self.’ …” — cộng thêm `…` ở cuối theo Pāli (bản
  đã ghim có thêm `…”` mà Pāli không có, nên lớp lấp không sao chép ngoặc thừa ấy).
  1.8 và 1.12 dùng lại y nguyên câu ấy; 1.12 không có `…pe…` nên không có dấu lược.

  Đếm được để người đọc kiểm lại: vế `… ‘netaṁ mama, nesohamasmi, na meso attā’ti evametaṁ
  yathābhūtaṁ sammappaññāya daṭṭhabbaṁ` xuất hiện ở 63 vế của SN đã ghim. Trong 78 vế có
  bản Anh đã ghim, 73 vế dùng y hệt "This is not mine, I am not this, this is not my
  self."; 5 vế còn lại (sn22.59:8.1, sn22.59:9.2, sn35.72:6.1, sn35.87:8.2, sn44.7:4.8)
  bị Sujato nén thành danh sách ("…ear … nose … tongue … body …"), không phải cách dịch
  khác. Cụm đó xuất hiện 131 lần trong SN đã ghim; "I am not of it" 0 lần.
  Với dạng `Yadanattā, taṁ …` (có dấu phẩy) bản đã ghim có chữ ở sn35.204:1.4,
  sn35.210-212:1.2 và sn35.219-221:1.2; dạng `Yadanattā` không dấu phẩy ở sn35.1, sn35.2,
  sn35.3, sn35.4, sn35.5, sn35.6.

  `sammappaññāya` = "right understanding" và `daṭṭhabbaṁ` = "should be truly seen" theo
  đúng câu khuôn. 1.3, 1.5–1.7, 1.9–1.11, 1.13, 1.14 vẫn để trống vì thuộc lát khác, nên
  đọc 1.4 và 1.8 cần biết vế trung gian nằm ở các khoá đó trong cột Pāli; đó là giới hạn
  phân chia lát, không phải lỗi căn khoá. `triangulation` 8.0 là đặc thù của lớp lấp.
