notes: |-
  Cả 2.2–2.10 là lời Samiddhi kể lại cho Đức Thế Tôn, và bản Anh đã ghim nén toàn bộ thành một câu ở
  2.1: "told him what had happened". Năm khoá lấp ở đây gần như là bản dịch lại của chính các segment
  1.2/1.3/1.7/1.9/1.10 mà Sujato đã dịch, nên lớp lấp dùng lại đúng bộ từ đó:
  "meditating not far from the Buddha, diligent, keen, and resolute" (1.2), "was in private retreat …
  this thought came to" (1.3), "gone forth in a teaching and training so well explained" (1.7),
  "spiritual companions who are ethical and of good character" (1.9).

  - 2.2 và 2.3 đổi sang ngôi thứ nhất vì Samiddhi đang nói (`viharāmi`, `mayhaṁ`); 2.7 và 2.9 giữ
    thì hiện tại (`pabbajito`) vì đó là nguyên văn thôi tự trong tâm ông.
  - 2.4/2.5/2.6/2.8 (`lābhā vata me, suladdhaṁ vata me,` …) trùng 1.4–1.9 nhưng NGẮN HƠN 40 ký tự nên
    không thuộc lát này; chúng vẫn trống. Dòng English của bài vì thế đứt ở các khoá đó.

  MỘT CHỖ LỆCH CÓ CHỦ Ý ở 2.10: Pāli `mahābhayabheravasaddo` là tiếng động vừa LỚN vừa HÃI HÙNG vừa
  KHIẾP SỢ; `sadda` không có nghĩa "loud". Bản đã ghim ở 1.10 dịch là "made a terrifyingly loud noise
  close by him" — thêm "loud" không có ở Pāli và bỏ mất ba tính từ. Lớp lấp giữ "a great, frightening,
  terrible noise", còn "it seemed as if the earth was shattering" thì chép nguyên văn từ 1.10. Bản Việt
  dự án ("một tiếng động to hãi hùng") đứng về phía Pāli.

  `triangulation` 8.0: người viết lớp lấp cũng là người chấm, và scorecard tiếng Việt của bài (Muse
  Spark) không được tuyên bố đã đối chiếu English.
