notes: |-
  Bài này là mẫu thuần tuý của luật “dùng lại cách dịch đã có”. §1 đi theo đúng một khuôn
  sáu vế cho mỗi căn: `assādo` → `āḍīnavo` → `nissaraṇaṁ`, mỗi vế có `No cedaṁ …` và `Yasmā ca
  kho …`. Bản đã ghim đã dịch trọn mắt cho `cakkhu` (`1.1`–`1.6`) và `manas` (`1.16`–`1.21`),
  và lược `sota`/`ghāna`/`kāya` cùng cả `jivhā`. Năm khoá lấp là sáu vế của `jivhā`, nên tôi
  chỉ thay `cakkhu`/`manas` bằng `tongue` và giữ nguyên phần còn lại:

    - `1.10` ← `1.17` (cùng dấu phẩy sau `assādo`, cùng cấu “gratification … aroused”)
    - `1.11` ← `1.18`, `1.12` ← `1.19` (drawback … disillusioned)
    - `1.13` ← `1.20`, `1.14` ← `1.21` (escape)

  Tôi ưu tiên `1.17`–`1.21` (mắt-không, có dấu phẩy sau `assādo`/`āḍīnavo`/`nissaraṇaṁ`) hơn là
  dùng `1.2`/`1.4`/`1.6` (mắt-có, Pāli không có dấu phẩy), vì Pāli của `1.10`/`1.12`/`1.14`
  CÓ dấu phẩy — cùng hình dạng với `1.17`/`1.19`/`1.21`. Cả hai đều là bản đã ghim, nhưng chọn
  theo hình dạng Pāli thì không lệch ở đâu.

  Thuật ngữ giữ nguyên của bản đã ghim: `assāda` → “gratification”, `āḍīnava` → “drawback”,
  `nissaraṇa` → “escape”, `sattā` → “sentient beings”, `sārajjanti` → “are aroused”,
  `nibbindanti` → “grow disillusioned”, `nissaranti` → “escape”. `jivhā` → “tongue”, đúng như
  `2.1`–`2.2`, nơi bản đã ghim dùng “six interior sense fields”.

  Bất định còn lại: không có. Đây là lát sạch nhất — không có khoá nào có `…pe…`, không có chỗ
  nào phải đoán, và cả năm khoá đều có `1.17`–`1.21` đứng ngay trong cùng bài làm mẫu.

  Lớp lấp: 5 khoá nằm ở chỗ bản Anh đã ghim để trống; `1.7`/`1.8`/`1.9` (tai, mũi), `1.15`
  (thân), `2.3` trống nhưng ngoài lát này. Triangulation bị chặn ở 8.0.
