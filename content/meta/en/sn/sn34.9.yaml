notes: |-
  Cùng loạt với sn34.8 nhưng CỐ Ý khác: đây là `sātaccakārī`, không phải `sakkaccakārī`, và
  1.4 đã ghim của chính bài này dịch nó là "practicing persistently". Vì vậy lát này KHÔNG dùng
  "carefully" của sn34.8/sn34.17, mà dùng đúng khuôn của sn34.18:1.5–1.7 (cùng
  `sātaccakārī`, cùng bộ từ "persistently"). Đếm được: "persistently" 6 lần, "carefully" 9 lần
  trong 481 tệp fill, nhưng con số quyết định ở đây là bản đã ghim CỦA BÀI NÀY.

  1.8 dùng nguyên văn cụm "Of these, the meditator skilled both in … is the foremost, best,
  leading, highest, and finest of the four." — 7/7 tệp fill đã có dùng như vậy.

  Bất định đã ghi nhận:

  - `mokkho` → "leading" theo 7 tệp tiền lệ, còn bản Việt dự án dịch là "giải thoát".
  - 1.9–1.11 trống và dưới ngưỡng, cột English dừng ở 1.8.
  - `triangulation` 8.0; `han_viet_balance` là giá trị mặc định của lớp lấp.
