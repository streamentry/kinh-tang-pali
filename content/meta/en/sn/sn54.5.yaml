notes: |-
  2.4 và 2.6 là hai vế `no ce …` mà bản đã ghim bỏ trống. KHÔNG có tiền lệ cho
  dạng phủ định này: quét toàn tầng Anh đã ghim, “don’t attain enlightenment” cho 0
  kết quả. Bản dịch dựng lại từ hai câu bản đã ghim dịch sẵn ở chính bài này — 2.3
  “You attain enlightenment early on in this very life.” và 2.5 “If not, you attain
  enlightenment at the time of death.” — và dùng lại NGUYÊN VĂN “early on in this
  very life” cùng “at the time of death”.

  Quyết định biên tập cần nêu: 2.4/2.6 là MỆNH ĐỀ ĐIỀU KIỆN, không phải quả thứ hai và
  thứ ba. Bảy quả của `ānāpānassati` là 2.3 · 2.5 · 2.7 · 2.8 · 2.9 · 2.10 · 2.11 —
  đúng bảy, nếu 2.4/2.6 là quả thì sẽ thành chín. Vì vậy dịch với dấu phẩy treo ở cuối
  và KHÔNG thêm “If not,” của riêng mình: Pāli ở 2.4/2.6 không có `Atha`. Hệ quả không
  tránh được là tiếng Anh có hai “if” liền nhau, vì bản đã ghim đã dịch `Atha` ở 2.5 và
  2.7 thành “If not,” — đó là lựa chọn của bản đã ghim, không sửa được, và không thể bỏ
  đi ở phía mình.

  `no ce` dịch thẳng bằng mệnh đề quan từ “If you don’t …” (giữ “you” cho khớp 2.3/2.5
  của bản đã ghim). Đây là chỗ dễ sai nhất của lát này nên hạ `grammar_logic` và
  `ambiguity_integrity`.
