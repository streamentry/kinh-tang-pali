notes: |-
  Chép lại nguyên văn vế đã được bản Anh đã ghim dịch ở 2.2 và 2.8 của CHÍNH bài này ("enlightenment
  in this very life, or if there's residue left behind, non-return."). 2.4 là DẠNG CÂU HỎI của 2.2 —
  Pāli kết bằng `?` nên giữ nguyên chữ, chỉ thêm dấu hỏi. Tra `diṭṭheva dhamme aññā, sati vā upādisese
  anāgāmitā?` trong toàn bộ root: chỉ 2 khoá (2.4 đây và sn46.57:2.2) và sn46.57 bị Sujato lược, nên 0
  tiền lệ dạng câu hỏi; tiền lệ dạng mệnh đề ở chính 2.2/2.8 là đủ để bám. Hạ `grammar_logic` vì 2.3
  của bản đã ghim đã tự mang dấu hỏi ("How so?"), nên đọc liền sẽ ra "How so? enlightenment in this
  very life, … non-return?". Sai đó là do bản đã ghim dồn dấu câu sang 2.3, không phải do lớp lấp; giữ
  chữ thì vẫn đúng và đọc được.
  
