notes: |-
  **0 tiền lệ trong toàn corpus**: cụm `Tathāpahīno` chỉ xuất hiện đúng ở ba khoá này (sn46.14:4.4,
  sn46.15:4.4, sn46.16:3.4) và cả ba đều trống trong bản Anh đã ghim, nên không có chỗ nào để đối chiếu.

  Khoá ngay trước (4.3, đã ghim) là "And that's how he recovered from that illness." — 4.4 là câu chốt
  kiểu colophon, dịch theo nghĩa chức năng `so ābādho ahosī` = bệnh ấy đã chấm dứt. Sự lặp ý có sẵn
  trong Pāli, không phải do bản dịch. Danh xưng lấy đúng dạng bản đã ghim dùng ở 4.2: "Venerable
  Mahākassapa".

  Cả lát này chỉ có 20 bài Saṃyutta, mỗi bài một khoá, và KHÔNG bài nào có bản Việt dự án — nên không có lớp Việt để đối chiếu nghĩa. Đối chiếu chỉ chạy được trên Pāli root + Anh đã ghim của chính bài đó.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
