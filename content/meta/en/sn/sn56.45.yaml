notes: |-
  Bốn khoá này là bản kể lại (ngôi thứ nhất) của 1.2 / 1.3 / 1.5 / 1.6 đã ghim, cùng Pāli.
    2.2: `pubbaṇhasamayaṁ nivāsetvā pattacīvaramādāya vesāliṁ piṇḍāya pāvisi` đã ghim 11× trong
    tầng sn là "robed up in the morning and, taking his bowl and robe, entered Vesālī for alms";
    đổi sang ngôi thứ nhất theo "Then I robed up in the morning and, taking my bowl and robe…"
    đã ghim sẵn. `idhāhaṁ, bhante` đã ghim là "Today, sir" (2×).
    2.3: theo 1.3 đã ghim, gộp thành một câu vì Pāli của 2.3 là một câu.
    2.5: lấy lại nguyên văn 1.5, chỉ đổi ngoặc mở `“` thành `‘` cho khớp Pāli 2.5.
    2.6: lấy lại nguyên văn 1.6, nhưng Pāli 2.6 là `’”ti` (HAI ngoặc đóng) nên bản lấp phải có
    `’”`, không chép được `”` đơn của 1.6.

    Không có bất định nào khác; điểm duy nhất cần người biên tập nhìn là dấu `’”` ở 2.6.
