notes: |-
  Lớp lấp: 5 khoá (`4.4`, `4.5`, `4.9`, `22.2`, `22.3`), tất cả nằm ở chỗ bản Anh đã ghim để trống.
  `4.4`–`4.5` và `4.9` là ba khoá của **một tin đồn**: `4.3` (`Assosi kho āyasmā susimo`) nói Susīma
  nghe được, và `kira` ở `4.4` là dấu hiệu nghe đồn. Vì vậy `4.4` dịch thì hiện tại "have declared"
  chứ không quá khứ "had declared" như `4.1` đã ghim: `4.1` do người tường thuật kể, `4.4` do Susīma
  kể lại điềng vừa nghe.

  **Cặp Pāli trùng nguyên văn, dùng lại y nguyên bản đã ghim.** Chuỗi `‘khīṇā jāti, vusitaṁ
  brahmacariyaṁ, kataṁ karaṇīyaṁ, nāparaṁ itthattāyā’ti` xuất hiện NGUYÊN VĂN ở ba khoá của chính bài
  này: `4.2` (đã ghim), `4.5` và `4.9` (lớp lấp). Lớp lấp dùng lại y nguyên văn "Rebirth is ended, the
  spiritual journey has been completed, what had to be done has been done, there is nothing further
  for this place." ở cả hai — dịch lại là chỗ dễ sinh ra ba cách gọi khác nhau cho một câu.

  **Động từ `pajānāmā` dịch là "understand", theo bản đã ghim.** Bản đã ghim dịch chính từ này ở
  `4.2` là "We understand:" và ở `17.3` là "They understand:". Ba chỗ phải dùng cùng một động từ, nên
  `4.5` = "they understand:" và `4.9` = "do they understand?". Có thể dịch "declare" cũng hiểu được,
  nhưng như thế bài sẽ có hai động từ cho một từ Pāli.

  **Số dấu nháy:** `4.4` mở 1 (`“`) – đóng 0, vì Pāli khép ở `4.5`. `4.5` và `4.9` mỗi khoá mở 1 –
  đóng 2, đúng như Pāli (`‘…’ti pajānāmā”ti.`).

  **`22.2`–`22.3` là đầu và cuối một danh sách bị lược.** `22.1` đã ghim kết bằng dấu lược "…". Danh
  sách các loại tâm nằm nguyên vẹn ở `7.2`–`7.17`, nên lớp lấp lấy y cách gọi của bản đã ghim cho
  vế đầu (về `sarāgaṁ vā cittaṁ`) và vế cuối (về `vimuttaṁ vā cittaṁ`): "mind with greed as ‘mind with
  greed’ …" và "and freed mind as ‘freed mind’?". Dấu `…` của `…pe…` ở `22.2` được giữ nguyên, không
  mở rộng — đây là luật riêng của lớp lấp.

  **Bất định còn lại, không chặn — danh sách ở `22.3` KẾT THÚC Ở “freed mind”.** Bản song song `7.17`
  kết thúc bằng "and unfreed mind as ‘unfreed mind’?", nhưng Pāli đã ghim ở `22.3` là
  `vimuttaṁ vā cittaṁ vimuttaṁ cittanti pajānāsī”ti?` — hết ở `vimuttaṁ`. Người đọc dễ tưởng lớp lấp
  bỏ sót vế cuối; không bỏ, vì Pāli là chuẩn. Cũng lưu ý: `22.3` khép bằng `?”` trong khi `22.1` đã
  đóng ngoặc sớm — hình dạng này lặp lại đúng cách bản đã ghim làm ở `20.1`, `21.1`, `23.1`, `24.1`.

  **Bài này chưa có bản Việt trong `content/translation/vi/project/`.** `vietnamese_clarity` hạ vì vậy.
  `triangulation` bị chặn ở 8.0: không có bản Anh độc lập nào để đối chiếu, và `4.5`/`4.9` chỉ ghép
  lại y nguyên văn đã ghim ở `4.2` — cùng một tầng, không phải hai tầng độc lập.
