notes: |-
  **Phân loại 27 khoá (đo bằng máy; ngưỡng B = độ tương đồng Pāli ≥ 0,60 với một khoá đã có lời): A dùng lại nguyên văn = 19 · B dựng lại = 7 · C tự dịch = 1 · D Pāli trùng nhưng lời tầng khác nhau = 0.** Đã ghi 27/27 khoá `fillableSegments` (trong đó 17 khoá có nội dung ≥ 40 ký tự Pāli; 10 khoá còn lại dưới ngưỡng, không vào coverage). Số khoá trống còn lại của bài: 0 (mọi khoá tầng đã ghim để trống đều đã lấp). Pāli chứa 0 dấu lược (`…pe…` hoặc `…` = đúng một `…` mỗi nơi), bản lấp giữ đúng 0; 6 khoá có nháy trong Pāli. Trong bài có 13 nhóm Pāli trùng nguyên văn (38 khoá).

  **A — 19 khoá dùng lại nguyên văn** (Pāli trùng nguyên văn một khoá đã có lời): `4.4`←`1.3`; `5.1`–`5.4`←`2.1`–`2.4`; `6.1`←`3.1`; `11.2`–`11.6`←`7.3`–`7.7`; `12.3`–`12.6`←`8.3`, `8.5`, `7.4`/`8.4`, `7.6`/`8.6`; `13.1`–`13.4`←`2.1`–`2.4`. Các nhóm Pāli trùng đều cho cùng một lời (D = 0).

  **B — 7 khoá.** `4.2` ← `6.2` (0,95; Sujato gộp lần im lặng thứ hai vào lần thứ ba: “For a second time, Sāriputta kept silent.”); `11.7` ← `7.8` (0,79), `12.1` ← `8.1` (0,84), `12.2` ← `8.2` (0,89), `12.8` ← `8.8` (0,84), `12.9` ← `8.9` (0,88), `12.7` ← `8.7` (0,99). Ở `7.x`/`8.x` Sāriputta nói với Đức Phật (“sir”, ngôi “one”), còn `11.x`/`12.x` là Đức Phật nói lại với Sāriputta; lớp lấp giữ ngôi “one … sees” của Sujato nhưng thay hô cách `bhante` bằng “Sāriputta” đúng như Pāli (Sujato bỏ hô cách ở `7.8`/`8.8`, lớp lấp giữ vì Pāli có). Khoá `12.7` Pāli viết `sammappaññā disvā` (thiếu `-ya`, lỗi chính tả của nguồn), nghĩa vẫn như `8.7`.

  **C — `14.2`**: nhãn `Paṭhamaṁ.` → “First.”; nhãn là số Pāli, chưa đối chiếu với thứ tự thực trong phẩm.

  **Nháy:** 6 khoá có nháy; `4.4` và `12.9` mang thêm cặp nháy đơn quanh tên sách (“‘The Way to the Far Shore’, in ‘The Questions of Ajita’”, trùng `1.3`/`8.9` đã ghim, Pāli không có nháy ở đó), đã đo và trừ riêng khi so với Pāli. Không có chỗ cố ý lệch Sujato.

  **Lệch tầng đã ghim cần biết:** khoá `11.1` có một chú thích trong ngoặc đơn của Sujato (“The Buddha repeated all of Sāriputta’s explanation, concluding:”) không có trong Pāli; lớp lấp không động tới.

