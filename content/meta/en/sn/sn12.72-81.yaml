notes: >-
  Vế `sayaṁ abhiññā sacchikatvā upasampajja viharantī”ti.` xuất hiện ở BỐN bài và cả bốn
  đều bị bản đã ghim lược, nên không có chữ nào ở bất kỳ bài nào để đối chiếu. Bốn khoá phải
  dịch Y HỆT nhau — cùng một vế mà bốn cách gọi thì bộ kinh tự mâu thuẫn. Ở dự án, cách dịch
  đó đặt trong harness (`CHUẨN_SAHA_MU_KHONG_BEN`) để bảo đảm bằng cấu trúc chứ không phải
  bằng ghi chú.
  
  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
