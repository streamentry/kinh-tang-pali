notes: |-
  **Bốn nhóm khoá — đo bằng so byte trên Pāli, và phạm vi đo nói rõ.** Chín khoá lấp của bài này
  trùng **nguyên văn** với các bài anh em: `sn33.2`, `sn33.3`, `sn33.5` mỗi bài **8/9** (khác nhau
  duy nhất ở `1.13`), `sn33.1` **7/9**, `sn33.55` **6/9**, `sn33.6-10` **4/9**. Vì vậy đếm ở ba
  phạm vi cho tới khi con số nói rõ đang đo cái gì:

  - **Chỉ tầng Anh đã ghim, đọc `sn33.4` một mình: A 0 · B 0 · C 9 · D 0.** Sujato có chữ ở
    `0.1`–`0.3`, `1.1`, `1.2`, `1.3`, `1.6` và để trống **đúng chín** khoá lấp, nên trong bài không
    có khoá nào đã có lời để dùng lại.
  - **Cùng bài, sau khi chính bản lấp này đã viết: A 2 · B 2 · C 5 · D 0.**
    - **A = 2** — `1.8` và `1.11` trùng **nguyên văn** `1.4` (`sassato lokoti vā, asassato lokoti
      vā …pe…`; đo được 3 khoá trùng byte trong bài). Cả ba dùng **nguyên văn** "the cosmos is
      eternal, or not eternal …" — đúng lời đã `published` ở tám khoá trùng Pāli:
      `sn33.1:1.11`, `sn33.2:1.4` (Sujato) / `1.8` / `1.11`, `sn33.5:1.4` / `1.8` / `1.11`,
      `sn33.55:1.4`, `sn33.6-10:1.4`.
    - **B = 2** — `1.5` và `1.12` là bản gần trùng của `1.9`, khác nhau **duy nhất ở dấu kết**:
      Pāli `…maraṇāti vā”ti?` (`1.5`), `…maraṇāti vāti.` (`1.9`), `…maraṇāti vā”ti.` (`1.12`).
      Tỉ lệ khớp đo được: `1.5`↔`1.9` **0,971**, `1.5`↔`1.12` **0,981**, `1.9`↔`1.12` **0,990**;
      48 ký tự lõi `neva hoti na na hoti tathāgato paraṁ maraṇāti vā` giống nhau tuyệt đối. Phần
      phải chèn lại là **dấu ngoặc kép**: đếm ngoặc **theo từng khoá** cho thấy Pāli `1.9` có
      0 mở / 0 đóng, `1.5` có 0 / 1, `1.12` có 0 / 1 ⇒ bản lấp kết `.”?` ở `1.5`, **không** ngoặc
      ở `1.9`, kết `.”` ở `1.12`. Sn 24 vốn kết `’”ti` (**hai** ngoặc đóng); đó là lý do phải đếm
      từng khoá chứ không dùng một khuôn chung cho cả hai bài.
    - **C = 5** — `1.4`, `1.9`, `1.7`, `1.10`, `1.13`.
    - **D = 0** — không khoá nào trùng Pāli *trong cùng bài* mà lời tầng khác nhau: chín khoá
      Sujato để trống, nên trong bài không có hai lời để mâu thuẫn nhau.
  - **Toàn tầng (Sujato + lớp lấp `published`, mọi bài `sn`): A 8 · B 0 · C 1 · D 0.** Tám khoá
    kia trùng nguyên văn ít nhất một khoá đã có lời ở bài khác; `1.13` (`Catutthaṁ.`) là khoá duy
    nhất **không** có lời ở bất kỳ đâu trong tầng (đo được: Sujato để trống **269/269** khoá
    `Catutthaṁ.` và **2466/2466** khoá thứ tự trên toàn tầng; lớp lấp có tiền lệ `Dasamaṁ.` →
    "Tenth.", `Tatiyaṁ.` → "Third.", `Pañcamaṁ.` → "Fifth.") ⇒ "Fourth.". Trong tám khoá A,
    **sáu** dùng lại nguyên văn lời đã có; **hai** khoá `1.7` và `1.10` phải dựng lại vì lời
    Sujato cho đúng Pāli đó **nuốt mất** một phần — xem mục lệch có chủ đích.

  **Cùng Pāli với `sn33.5` — trùng khớp từng ký tự cả tám khoá.** `sn33.4` và `sn33.5` khác nhau ở
  `1.6` (`Saṅkhāresu` so với `Viññāṇe`) và ở `1.13` (`Catutthaṁ.` so với `Pañcamaṁ.`); tám khoá
  lấp còn lại trùng nguyên văn, và bản lấp hai bài khớp **từng ký tự** ở cả tám, chỉ khác đúng ở
  `1.13` ("Fourth." so với "Fifth."). `sn33.3` chưa có lớp lấp; khi lấp phải dùng lại nguyên văn các
  câu ở đây cho tám khoá đó.

  **Số khoá đã ghi: 9/9. Còn trống: 0.** Mười sáu khoá Pāli của bài; bảy khoá không thuộc lớp lấp vì
  tầng đã ghim có chữ (`0.1`–`0.3`, `1.1`, `1.2`, `1.3`, `1.6`). `1.13` (`Catutthaṁ.`, 10 ký tự) là
  khoá **dưới ngưỡng 40 ký tự** nên không vào coverage — nó vẫn được lấp, nhưng coverage đạt 1,0 với
  **tám** khoá lấp có nội dung, không phải chín.

  **Coverage đo trước/sau.** Mẫu số = Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = **11** khoá.
  Trước: `english-sujato` có chữ ở `1.2`, `1.3`, `1.6` ⇒ 3/11 = **0,2727**, tám khoá không lời
  Anh, khoá lớn nhất là `1.10`. Sau khi lớp lấp `published`: 11/11 = **1,0000**,
  `substantiveWithoutEnglish` = 0. **Độ nhạy ngưỡng 0,8**: trước đó phải lấp thêm **6** trong tám
  khoá mới qua ngưỡng (9/11 = 0,818); sau này biên độ là **2 khoá** — mất 2 khoá lấp thì còn
  9/11 = 0,818 vẫn qua, mất 3 khoá thì 8/11 = 0,727 rớt dưới ngưỡng.

  **Cố ý lệch tầng Anh đã ghim, kèm lý do.**
    - `1.7` (`evamimāni anekavihitāni diṭṭhigatāni loke uppajjanti—`): Sujato dịch đúng Pāli này ở
      `sn33.1:1.7`, `sn33.2:1.7`, `sn33.55:1.3` thành "that these various misconceptions arise in
      the world." Bản lấp bỏ `that` và giữ dấu gạch dài: "these various misconceptions arise in
      the world—". (a) Bản ghim của **chính bài này** đã đóng ngoặc quá sớm ở `1.6`, nên không còn
      mệnh đề bất ngữ để `that` bám vào; (b) `…uppajjanti—` mở một liệt kê còn tiếp ở `1.8`, đổi
      thành dấu chấm câu sẽ để `1.8` thành mảnh văn. `evamimāni` là đại từ chỉ hệu, đã gộp vào
      "these", nên không mất nghĩa.
    - `1.10` (`Ayaṁ kho, vaccha, hetu, ayaṁ paccayo, yānimāni anekavihitāni diṭṭhigatāni loke
      uppajjanti—`): Sujato dịch đúng Pāli này ở `sn33.1:1.10`, `sn33.2:1.10`, `sn33.55:1.6` thành
      "This is the cause, this is the reason.”" — **bỏ mất** `vaccha`, **bỏ mất** vế 38 ký tự
      `yānimāni … uppajjanti`, và **đóng ngoặc ở khoá mà Pāli không có ngoặc**. Bản lấp giữ đủ ba:
      "This, Vaccha, is the cause, this is the reason why these various misconceptions arise in
      the world—". Nếu đóng ngoặc ở đây thì `1.12` thành ngoặc đóng lơ lửng. `vaccha` được giữ
      đúng như bản ghim dùng ở `1.6` ("Vaccha, it is because of not knowing choices …").
    - `1.5` và `1.12`: chọn thứ tự "or a realized one neither still exists nor no longer exists
      after death" theo **đa số đo được** — ở `1.9` có bốn khoá trùng Pāli đã có lời thì **3–1**
      nghiêng thứ tự này (`sn33.1:1.9`, `sn33.5:1.9`, `sn33.55:1.5`) và một khoá đảo
      (`sn33.2:1.9`); ở `1.12` là **2–1**. ⚠️ `sn33.2:1.9` và `sn33.2:1.12` vì thế **vẫn lệch**
      với bài này cho **cùng một Pāli**; nằm ngoài lát này nên **không sửa**, chỉ báo ở đây.
    - Dấu lược: `1.4` / `1.8` / `1.11` Pāli có `…pe…` tức **một** đơn vị lược ⇒ bản lấp ghi
      **đúng một** `…`. `1.5`, `1.7`, `1.9`, `1.10`, `1.12`, `1.13` Pāli không có `…` ⇒ bản lấp
      không thêm.
    - Hạt `ti` ở `”ti?`, `”ti.` và `vāti.` bị bỏ, đúng như lời Sujato đã dùng ở `sn33.1:1.5` và
      `sn33.2:1.5`.

  **Sai lệch của chính tầng ghim ở bài này — báo, không sửa (sửa là lớp lấp shadow).**
    - `1.3` và `1.6`: Pāli **không** có `…` (viết đủ; `1.3` kết bằng `—`), Sujato **tự thêm** một
      `…` ở **cả hai** khoá. Đây là loại lỗi đã có tiền lệ ở chính đợt này.
    - `1.3` và `1.6`: Pāli có **một** `“` và **không** có `”` (ngoặc đóng thật nằm ở `1.5` và
      `1.12`), Sujato đóng ngoặc ngay tại chỗ. Hệ quả: hai ngoặc kép `”` của lớp lấp ở `1.5` và
      `1.12` nhìn **lơ lửng** trong cột English. Không sửa được — sửa `1.3`/`1.6` là shadow.
    - Ngược lại: **không** khoá lấp nào bị Sujato mở rộng `…pe…` hay bịa `…`, vì chín khoá đó
      Sujato để trống — không có gì để mở rộng. Danh sách kiến chấp ở `1.6` cũng giữ **đúng thứ tự**
      Pāli: `aññāṇā [saṅkhāresu]` → `saṅkhārasamudaye aññāṇā` → `saṅkhāranirodhe aññāṇā` →
      `saṅkhāranirodhagāminiyā paṭipadāya aññāṇā`.

