notes: |-
  **Bốn số (đo bằng máy, ngưỡng 0,80): A = 0 · B = 3 · C = 103 · D = 0.** Ghi 106/106 khoá.

  Tầng đã ghim chỉ dịch phần mở và câu hỏi (`1.x`–`5.x`, `6.1`, `7.1`) rồi kết `7.1` bằng “…” …”; toàn bộ phần
  giảng `8.1`–`44.6` để trống (cắt cụt dãy). A = 0 vì mọi khoá có Pāli trùng nhau trong bài (3 nhóm, 20 khoá: câu
  `Ākaṅkheyya ce …`, `Taṁ kissa hetu?`, `Tathā hi so dhammacārī samacārī.`) đều nằm **trong** lát, không có lời đã
  ghim để dùng lại; bản lấp cho mỗi nhóm **một** lời, đã kiểm bằng máy.

  **B (3):** `10.7` ← `5.1` (0,98) và `14.7` ← `5.2` (0,97): câu kết luận lặp lại câu trả lời ngắn, thêm “That’s how”
  cho `Evaṁ`. `11.1` ← `7.1` (0,97): bỏ phủ định và bỏ “…” …” của lời đã ghim (Pāli `11.1` đủ, không lược).

  **C (103) — dịch từ Pāli, theo thuật ngữ của chính bài:** “unprincipled and immoral conduct” / “principled and
  moral conduct” (`5.1`/`5.2`), “a place of loss, a bad place, the underworld, hell”, “a good place, a heavenly
  realm”, “worthy Gotama”. Cụm “a person of unprincipled … is threefold by way of body” theo cách lời đã ghim `7.1`
  diễn `tividhaṁ kāyena adhammacārī`. Các **công thức chuẩn** (mười hiệu Như Lai `2.5`, `2.6`, `2.7`; tên các cõi trời
  `18-42.x`; `44.4`) theo cách tầng đã ghim dịch cùng công thức ở `mn41` (bài song song gần như từng chữ) — là
  thuật ngữ, không chép đoạn văn dài: các khoá giảng của `mn42` Pāli **lược** khác `mn41`, nên câu được viết lại
  theo đúng chỗ lược của `mn42`. Bỏ hô ngữ `gahapatayo` trong từng mục liệt kê, giữ ở câu mở `11.1` và `15.1` …
  (theo cách lời đã ghim bỏ trong bài).

  Dấu lược: Pāli 37 (đếm `…pe…` = 1), bản lấp 37, khớp từng khoá. **Phân biệt có chủ đích:** `10.5` Pāli không có
  `sayaṁ abhiññā` ⇒ “after realizing it”, còn `14.5` có ⇒ “after realizing it with their own insight”.
  Nháy: 106/106 khoá khớp Pāli. **Ghi nhận Pāli:** `43.3` mở `‘` trước `yaṁ so …` và `43.5` đóng `’”` — bản lấp theo
  đúng, dù dấu `‘` ở `43.3` trông lạ trong English.

  Triangulation hạ thêm (7,5) vì 103/106 khoá là bản dịch mới, không có lời đã ghim nào trong bài để đối chiếu.

  Coverage: mẫu số 85; trước 13/85 = 0,1529 (**dưới ngưỡng**), sau khi `published` 85/85 = 1,0. Độ nhạy: thêm 17
  khoá trống mới rớt. `mn42` **có** record trong `content/meta/reference-gaps.yaml`; record thành thừa sau khi
  `published` — để người điều phối sinh lại.

  Triangulation ≤ 8,0: scorecard Việt của bài này (`content/meta/sutta/mn/mn42.yaml`) ghi `assessed_by`/`translators` thuộc **cùng họ công cụ** với lớp lấp (cùng khai trong `source/tooling.yaml`). Vì vậy bản lấp **không** phải cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root + lời Sujato đã ghim của cùng bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

