notes: |-
  **Phân loại 9 khoá (đo bằng phép so chuẩn hoá Pāli với các khoá đã có lời): máy đo A = 2 · B = 6 · C = 1 · D = 0; sau khi đọc từng khoá trong bối cảnh bài, phân loại thực tế của bản lấp là A = 1 · B = 7 · C = 1 · D = 0.** Hai con số khác nhau ở đúng một khoá, `5.15`, và lý do nằm ở nhóm 3 bên dưới.

  **Nhóm 1 — `2.5`, `2.6`, `3.4`, `3.5` (4 khoá): bốn khoá lặp của công thức “trong quá khứ / vị lai / hiện tại”.** Pāli viết ba đoạn song song cho Chư Phật quá khứ (`2.3`–`2.4`, `3.2`–`3.3`), vị lai (`2.5`–`2.6`, `3.4`–`3.5`) và hiện tại; tầng đã ghim chỉ dịch phần quá khứ cùng nửa “hiện tại”, rồi để trống phần vị lai. · `3.5` là **A**: Pāli trùng nguyên văn với `3.3` (“seyyathāpi etarahi mayā …”), lấp dùng lại nguyên văn “like I do in the present.” · `2.6` dựng lại từ `2.4` (tỉ lệ khớp 0,98); khác duy nhất là Pāli `2.6` đóng nháy `”ti` còn `2.4` đã ghim thì đã mang sẵn dấu `”`, nên giữ đúng một dấu `”`. · `2.5` dựng lại từ `2.3` (0,90) và `3.4` từ `3.2` (0,90): hai khoá đã ghim đó dịch “in the past or the future … do so”, tức đã **gộp** cả quá khứ lẫn vị lai vào lời của khoá quá khứ. Lấp chèn lại đúng phần bị nuốt — Pāli `bhavissanti anāgatamaddhānaṁ` — thành “in the future who will lead … will do so”, nên **không** lặp “past”.

  **Nhóm 2 — `5.13`, `5.14` (2 khoá), dựng lại.** `5.13` từ `5.12` (0,92), `5.14` từ `5.8` (cùng cụm “mortifies themselves and others, committed to the practice of mortifying themselves and others”; điểm khớp Pāli với `5.14` thấp hơn là 0,79 vì ứng viên gần nhất do máy chọn lại là câu hỏi `10.1`, không dùng). Khoá đã ghim `5.12` dịch “Sir, I don’t like the sound of the first three individuals.”, tức Sujato dồn cả ba câu “người này không làm con hài lòng” (`5.12`, `5.13`, `5.14`) vào một câu rồi bỏ trống hai khoá sau. Lấp tách lại đúng từng người theo Pāli, dùng cụm đã ghim ở `5.7` và `5.8` cho “mortifies others” và “mortifies themselves and others”, thêm “also” cho `ayampi`. **Lệch có chủ ý nhỏ:** “first three individuals” ở `5.12` là cách gộp của tầng đã ghim; lấp không sửa nó (sửa là shadow), nên người đọc sẽ thấy `5.12` nói “three” rồi `5.13`–`5.14` lại nêu riêng từng người — đó là hệ quả của tầng đã ghim, Pāli vốn nêu từng người một.

  **Nhóm 3 — `5.15`, `6.9` (2 khoá), hai nửa của cùng một khối bị nuốt.** `6.8` đã ghim dịch cả Pāli `6.8` và nội dung `6.9` thành một câu: “The individual who doesn’t mortify either themselves or others—living without wishes, quenched, cooled, experiencing bliss, with self become divine—does not torment themselves or others, both of whom want to be happy and recoil from pain.” Pāli `5.15` trùng `6.8` đến từng chữ (chỉ khác dấu phẩy và `;` so với `—`), nên máy đo xếp `5.15` vào **A**. Nhưng dùng lại nguyên văn lời `6.8` cho `5.15` là **sai**: nó sẽ đặt vào `5.15` đoạn “does not torment themselves or others, both of whom want to be happy …” vốn thuộc Pāli `6.9`, trong khi `5.16` đã ghim ngay sau đó chốt bằng “I only like the sound of the last individual …”. Vì vậy `5.15` được dựng lại từ lời đã ghim ở `5.9` và `5.10` (“doesn’t mortify either themselves or others … live without wishes in this very life, quenched, cooled, experiencing bliss, with self become divine”) và **không** mang vế “torment”; `6.9` lấy đúng vế đó, dùng cụm “want to be happy and recoil from pain” đã ghim ở `6.2`–`6.8`. Đây là chỗ A thực tế chuyển thành B, và là **lệch có lý do** với nguyên tắc “dùng lại nguyên văn”.

  **Nhóm 4 — `28.5` (1 khoá), C.** Dòng kết bài `Kandarakasuttaṁ niṭṭhitaṁ paṭhamaṁ.` (33 ký tự, dưới ngưỡng 40) được dịch sát nghĩa theo tên bài đã ghim ở `0.2` (“With Kandaraka”): “The Discourse With Kandaraka, the first, is finished.” Khoá này không tính vào coverage.

  **Nháy.** Cả 9 khoá khớp Pāli từng khoá: `2.6` Pāli đóng `”` (1 đóng, 0 mở) và lấp 0/1; các khoá còn lại 0/0. Không dùng nháy đơn.

  **Dấu lược:** Pāli 9 khoá không có `…pe…`; lấp không có `…` (0/0).

  **Số khoá trống còn lại: 0** — cả 9 khoá `fillableSegments` đã lấp; 8 khoá có nội dung (≥ 40 ký tự), `28.5` dưới ngưỡng.

  **Coverage.** Mẫu số 153 (Pāli có nội dung, bỏ khối `:0`). Trước lớp lấp: 145/153 = **0,9477**; sau khi `published`: 153/153 = **1,0000**. Độ nhạy: ngưỡng 0,8 cần ít nhất 123/153; bài cách ngưỡng 30 khoá, nên không nhạy. Bài `mn51` **không** có record trong `content/meta/reference-gaps.yaml`, nên không record nào thành thừa vì lớp lấp này.

