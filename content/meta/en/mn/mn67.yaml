notes: |-
  9.6 trùng nguyên văn 7.8, vế đã được bản Anh ghim dịch sẵn, nên lấy y hệt — đây là lần thứ
  hai trong bài (7.8 cũng vậy) và luật 3 của lớp lấp yêu cầu đúng thế.

  3.4 và 4.8 lặp vế đã ghim ở 2.2; 4.8 chỉ khác 3.4 một mũi `me` (`Teme` vs `Te`). Cả hai lấy
  y hệt 2.2, KỂ CẢ chữ "And" mở đầu: đó là lời Sujato đã dùng cho chính vế này, và bỏ đi sẽ
  làm hai lần lặp trong cùng bài không khớp nhau. Đây cũng là chỗ duy nhất trong lát phải giữ
  một chữ "And" không có trong Pāli (`Te`/`Teme` chỉ là danh từ chỉ định) — giữ vì luật 3
  thắng, và ghi lại đây để người đọc sau không tưởng là thừa.

  Không có bất định còn lại. Triangulation bị chặn ở 8.0 vì đây là lớp lấp: khi viết không có
  bản Anh độc lập nào để đối chiếu.
