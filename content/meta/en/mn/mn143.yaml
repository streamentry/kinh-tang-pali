  Phân loại 53 khoá đã ghi (đo bằng script, theo Pāli đã có lời trong cùng bài): A y nguyên = 34 · B dựng lại = 6 · C tự dịch = 2 · D (Pāli trùng, lời đã ghim khác nhau; báo, không tự hòa) = 11. Script phân loại theo Pāli trùng nên các khoá tách ra từ một khoá đã ghim bị gộp sẵn (đếm là C) được nêu riêng bên dưới.
  Số khoá đã ghi: 53 trên 53 khoá tầng Anh đã ghim để trống (0 khoá còn trống).
  Khoá còn trống: không còn khoá nào trong danh sách khoá để trống của bài này.
  Nhóm B (khoá ← khoá nguồn, tỉ lệ khớp do script đo): 2.16 ← 2.8 (0.97); 2.17 ← 2.9 (0.92); 19.2 ← 17.1 (0.83); 19.3 ← 17.2 (0.82); 19.20 ← 18.1 (0.74); 19.21 ← 18.4 (0.92).
  Nhóm D: 5.7, 5.10, 5.13, 5.16, 6.4, 7.4, 8.4, 9.4, 10.4, 11.4, 12.4.
  Nháy: 1 khoá có số dấu nháy khác Pāli (19.21); các khoá còn lại khớp Pāli từng khoá.
  Dấu lược: 0 khoá chứa `…`; mỗi `…pe…` của Pāli tương ứng đúng một `…` của English, không khoá nào mở rộng.

  Nhóm A — 2.12, 2.13, 2.15 (từ 2.4, 2.5, 2.7), 2.18 (từ 2.10): lời của người sứ nhắc lại nguyên văn lời của Anāthapiṇḍika. Nháy khớp Pāli: 2.12 và 2.15 mở “ (Pāli mở “), 2.13 đóng ” (Pāli `vandatī”ti`), 2.18 đóng ’” (Pāli `…upādāyā’”ti`).
  Nhóm B — 2.16, 2.17 dựng từ 2.8, 2.9 (0.97, 0.92): chia hai nửa `So āyasmato sāriputtassa pāde sirasā vandati; evañca vadeti:` thành “He bows with his head to your feet,” và “and says:”. Tầng đã ghim ở 2.11 chỉ tóm “He did as Anāthapiṇḍika asked.”.
  Nhóm C — 2.14: “Then he went to Venerable Sāriputta, bowed, sat down to one side, and said to him,” theo khuôn các câu đi-đến-ngồi-nói đã ghim của chính bài (3.1).
  Nhóm A — 4.3, 4.5, 4.7 dùng lại 4.1 (bỏ “ mở đầu vì Pāli không có). Các khoá 5.6–12.4 (22 khoá): `Evañhi te, gahapati, sikkhitabbaṁ.` là “That’s how you should train.” và `Tasmātiha te, gahapati, evaṁ sikkhitabbaṁ:` là “You should train like this:”. Nhóm D (11 khoá, báo chứ không tự hòa): Pāli của câu thứ hai trùng với 5.1 và 12 khoá đã ghim khác; lời đã ghim là “That’s why, householder, you should train like this:” ở 5.1 và “You should train like this:” ở 5.4, 6.1, … 14.4. Chọn dạng của 11 trong 12 khoá đã ghim; chỉ 5.1 mang “That’s why, householder,”, và 5.1 là câu mở đầu của chuỗi nên không dùng làm khuôn.
  Nhóm B — 19.2, 19.3 dựng từ 17.1, 17.2 (0.83, 0.82): đổi ngôi (godling kể cho Phật, Phật kể lại cho tỳ-kheo) và `imaṁ rattiṁ` là “last night”: “Mendicants, last night, late at night, a certain glorious godling, lighting up the entire Jeta’s Grove, went up to me, bowed, and stood to one side.” và “Standing to one side, that godling addressed me in verse:”.
  Nhóm A — 19.4–19.19 (16 khoá) dùng lại nguyên văn 17.3–17.18 của bài kệ, chỉ đổi “ thành ‘ ở 19.4 và ” thành ’ ở 19.19 để khớp Pāli (Pāli 19.4 mở ‘, 19.19 đóng ’).
  Nhóm B — 19.20 dựng từ 18.1 (0.74): “Mendicants, that is what that godling said.”; 19.21 dựng từ 18.4 (0.92): khoá có cả lời trích `‘Samanuñño me satthā’ti`; Sujato dịch cùng lời trích ở 18.4 thành mệnh đề gián tiếp (“knowing that the Teacher concurred”), nên lớp lấp theo đúng cách đó, đổi ngôi sang “me”. Nháy: Pāli 19.21 có 1 mở và 1 đóng ’ cộng ” (`‘…’ti … ”ti`), English chỉ có ” (1 đóng), vì mệnh đề gián tiếp không mang nháy.
  Nhóm C — 20.9 `Anāthapiṇḍikovādasuttaṁ niṭṭhitaṁ paṭhamaṁ.`: “Advice to Anāthapiṇḍika is finished—the first.”
  Nháy 2.14–4.7, 5.x–12.x: khớp Pāli (không khoá nào chứa nháy).

