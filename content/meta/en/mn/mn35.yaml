notes: |-
  Phân loại 13 khoá (đo bằng máy, Pāli chuẩn hoá bỏ dấu câu, so với mọi khoá Sujato có chữ trong bài):
  A 2 · B 4 · C 7 · D 0.

  Nhóm A, dùng lại nguyên văn lời Sujato (2 khoá):
  - 13.8 `‘rūpaṁ me attā’ti, vattati te tasmiṁ rūpe vaso—` trùng Pāli với 13.3 và 15.3 (hai khoá này cùng lời
    Sujato): “‘Form is my self,’ do you have power over that form to say:”.
  - 13.9 `evaṁ me rūpaṁ hotu, evaṁ me rūpaṁ mā ahosī”ti?` trùng Pāli với 13.4 và 15.4 (cùng lời Sujato):
    ‘May my form be like this! May it not be like that’?” (một nháy kép đóng ở cuối). Nháy: Pāli khoá này chỉ có một nháy kép đóng, còn
    lời Sujato dùng nháy đơn lồng trong nháy kép (vì lấy câu nói của người hỏi làm một câu trích). Đo: Pāli
    (kép mở 0, kép đóng 1, đơn mở 0, đơn đóng 0); bản lấp (0, 1, 1, 1). Đây là chỗ lệch có lý do duy nhất:
    giữ y như các khoá 13.4/15.4 để cùng một Pāli có cùng một lời trong bài.

  Nhóm B, dựng lại từ khoá gần trùng (4 khoá):
  - 12.6 ← 12.4 (tỉ lệ khớp Pāli 0,95) và 12.3. Sujato dồn vế “ví dụ Pasenadi hay Ajātasattu” vào 12.3 và
    chỉ để phần “execute / fine / banish” ở câu hỏi 12.4. Bản lấp lặp lại đúng ba mệnh đề của 12.4 và chèn lại vế
    `seyyathāpi rañño pasenadissa kosalassa … vedehiputtassa` mà 12.5 (“would have such power”) bỏ.
  - 12.10 ← 12.4 (tỉ lệ 0,62): chỉ ba mệnh đề `ghātetāyaṁ … pabbājetāyaṁ vā pabbājetuṁ`, không có vế ví dụ
    vì Pāli khoá này không có; khớp 12.9 “have such power in their own realm.”
  - 13.7 ← 13.1 + 13.2 (ghép hai khoá Sujato cùng cắt một Pāli `taṁ kiṁ maññasi, aggivessana, yaṁ tvaṁ evaṁ
    vadesi:`; ghép lại thì Pāli trùng 1,00; ghép riêng thì phép đo B chỉ ra 0,67 với 12.2): “What do you think,
    Aggivessana? When you say,”. Giữ nháy kép mở như Pāli.
  - 21.7 ← 20.10 (tỉ lệ 0,92): cũng là `‘etaṁ mama, esohamasmi, eso me attā’`, nhưng khoá này có thêm
    `samanupassasī` (“do you regard”) mà 21.6 của Sujato đã gộp. Bản lấp chèn lại: “‘This is mine, I am this,
    this is my self’—do you regard it that way?” (nháy khớp Pāli: kép đóng 1, đơn mở 1, đơn đóng 1). Có lặp
    câu hỏi với 21.6 vì Sujato đã dịch gộp cả hai khoá vào 21.6; hiện ra thay vì giấu.

  Nhóm C, tự dịch từ Pāli (7 khoá), dùng thuật ngữ của chính bài (“ascetic Gotama”, “to and fro and round
  about”, “brewer’s mixer”, “growth, increase, and maturity”, “hard work”):
  - 5.5, 5.7, 5.9, 5.11: bốn vế `evamevāhaṁ samaṇaṁ gotamaṁ …` đóng bốn ví dụ so sánh ở 5.4, 5.6, 5.8, 5.10. Sujato
    đã dồn vế sau vào vế trước (ví dụ 5.4: “I’ll take him on in debate and drag him to and fro and round about”),
    nên đây là chỗ lặp nhiều nhất. 5.5 và 5.7 có Pāli trùng nguyên văn ⇒ cùng một lời (kiểm bằng máy).
    5.11 `maññe` dịch “I reckon”, vì Sujato bỏ nó.
  - 10.4, 10.6: hai vế `evamete …` đóng hai ví dụ ở 10.3 và 10.5. Lấy lại cụm “growth, increase, and maturity”
    (10.3) và “hard work” (10.5).
  - 30.8: dòng kết bài, theo khuôn của các bài Trung Bộ đã lấp, tên bài theo 0.2 của Sujato.

