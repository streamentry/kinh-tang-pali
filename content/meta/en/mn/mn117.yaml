notes: >-
  Dòng colophon. Bản Anh đã ghim không dịch dòng nào trong số **152 dòng** `…suttaṁ
  niṭṭhitaṁ N` của Majjhima — đây là lỗ hổng có hệ thống của bản đã ghim, không phải lỗi
  lẻ. Tên kinh lấy từ Sujato ở khoá `:0.2` (khoá `:0.3` của Majjhima để trống). Sujato dùng
  "The Great Forty", không phải "The Great Forty-Two", dù Pāli là `Mahācattārīsaka`; giữ
  nguyên cách gọi đã ghim.
  
  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
