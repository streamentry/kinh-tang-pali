notes: |-
  2.4 trùng NGUYÊN VĂN 2.2, chỉ khác ở dấu câu (`ti?` và `ti.`) → lấy nguyên văn 2.2:
  "‘The ascetic Gotama teaches the Dhamma for the sake of robes, almsfood, lodgings,
  or rebirth in this or that state.’”".

  2.6 và 2.7 là một bản lược: `…pe…` ở 2.6 nuốt mất `piṇḍapātahetu vā samaṇo
  gotamo dhammaṁ deseti, senāsanahetu vā samaṇo gotamo dhammaṁ deseti,`, nên 2.7 chỉ
  còn vế cuối `itibhavābhavahetu vā samaṇo gotamo dhammaṁ desetī’ti;`. Giữ NGUYÊN
  dấu lược, tuyệt đối không viết lại phần bị lược.

  Vì 2.7 phải nối vào giữa danh sách đã cắt, nó mở đầu bằng "or …" cho nối mạch:
  2.6 "‘The ascetic Gotama teaches the Dhamma for the sake of robes, …" + 2.7 "or
  rebirth in this or that state, the ascetic Gotama teaches the Dhamma’;". Bộ từ
  "for the sake of rebirth in this or that state" và "the ascetic Gotama teaches the
  Dhamma" lấy nguyên văn 2.2. Giữ cặp ngoặc `‘` (2.6) – `’` (2.7) đúng như Pāli; cặp
  `“` (2.5) – `”` (2.8) là của bản đã ghim.

  BẤT ĐỊNH ĐÃ GHI: phần bị lược không nhìn thấy, nên điểm nối giữa hai nửa của danh
  sách là dựng lại chứ không phải đọc được. Câu 2.6+2.7 dài và hơi gượng — đó là hậu
  quả thật của một `…pe…` ở giữa danh sách, không phải lỗi dịch, và không thể sửa mà
  không bịa. `grammar_logic` 9.0, `vietnamese_clarity` 8.6, `ambiguity_integrity` 8.8
  vì đúng lý do đó.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
