notes: |-
  **Phân loại theo máy trên 56 khoá: A 25 · B 19 · C 8 · D 4.** Dùng lại **nguyên văn** từ cùng bài: 25 khoá (đúng bằng số khoá nhóm A). Đã dò 17 nhóm Pāli trùng nguyên văn trong bài (tổng 55 khoá, gồm cả khoá đã ghim lẫn khoá lấp); với mỗi nhóm đó, mọi khoá lấp đều mang cùng lời với khoá còn lại của nhóm, ngoại trừ các khoá D đã nêu. Số khoá đã ghi: 56/56 khoá `fillableSegments`.

  **Hình dạng của chỗ trống.** Bài có bốn dạng người “xuất gia vì đức tin” (`8`, `9`, `10`, `11`; `12` là dạng đúng) và bốn dụ lõi cây (`3`–`6`; `7` là dạng đúng). Tầng đã ghim dịch trọn `3.x`, `7.x`, `8.x`, `12.x`, rồi ở `4.1`/`5.1`/`6.1` và `9.1`/`10.1`/`11.1` dùng “…” thay cho phần còn lại. Hai bộ khoá `4.2`–`4.5`, `5.2`–`5.5`, `6.2`–`6.5` (dụ) và `9.2`–`9.15`, `10.2`–`10.19`, `11.2`–`11.23` (người) đều rỗng, cộng thêm kết bài `24.4`, `24.5` và kệ `25.0`–`25.4`. 56 khoá, 47 khoá có nội dung đo được.

  **Nhóm 1 — dụ lõi cây `4.x`–`6.x` (A/B).** `4.2`, `5.2`, `6.2` ← `3.2` và `4.3`, `5.3`, `6.3` ← `3.3` (**A nguyên văn**); `4.5`, `5.5`, `6.5` ← `3.5` (A, giữ `’` đóng). `4.4` ← `3.4` (0,95), `5.4` ← `3.4` (0,89), `6.4` ← `7.4` (0,90): tầng ghim dịch `3.4` “That’s why he passed them over, cut off the branches and leaves, …” với “them” chỉ vào danh sách ở `3.3`; ở khoá riêng không còn antecedent, lớp lấp nêu rõ phần bị bỏ qua và phần bị lấy (“passed over the heartwood, softwood, and bark, cut off the shoots”, “… and softwood, cut off the bark”, “… the heartwood, cut out the softwood”) theo cách `4.1`, `5.1`, `6.1` đã ghim dịch “cut off the shoots/bark”, “cut out the softwood”.

  **Nhóm 2 — vế “Seyyathāpi so, brāhmaṇa, puriso …” (B, `8.9`, `9.13`, `10.17`, `11.21`, 0,95–0,98) và vế kết “Yañcassa …” (`8.10`, `9.14`, `10.18`, `11.22` ← `3.5`, 0,97–0,98).** Dựng lại thành “It’s like that person in need of heartwood who, while wandering in search of heartwood, came across a large tree standing with heartwood. But, passing over …, he cut … and left imagining …”; dùng thì quá khứ vì Pāli là `pakkanto`; bỏ `‘…’` quanh “heartwood” (Pāli có `‘sāran’ti`) theo tầng ghim, xem mục ngoặc. Vế kết bỏ `’` cuối của `3.5` vì Pāli của các khoá này không có nháy.

  **Nhóm 3 — các khoá thân trong `9.x`–`11.x` (A 16 khoá, B 7 khoá, D 4 khoá ở nhóm 4).** `9.2`, `10.2` ← `8.2`; `10.4`, `11.4` ← `8.4`/`9.4`/`12.4`; `10.5`, `11.5` ← `12.5`/`9.5`; `10.6`, `11.6` ← `9.6`; `10.10`, `11.10` ← `12.10`; `10.11`, `11.11` ← `12.11`; `11.9`, `11.13`, `11.14`, `11.15` ← `12.9`, `12.13`–`12.15`; `10.9` ← `12.9` (B theo máy, 0,99: Pāli chỉ khác dấu phẩy, nên dùng nguyên văn): **A nguyên văn**. B: `10.13` ← `9.9` (0,94) — tầng ghim `9.9` “They’re happy with that” không nói “với cái gì”; ở `10.13` khoá liền trước (`10.12`) chỉ là mảnh “and immersion. …”, nên chèn lại “that accomplishment in immersion” (Pāli `tāya samādhisampadāya`); `10.14` ← `9.10` (0,94); `10.15` ← `8.7` (0,65) và `11.19` ← `8.7` (0,65): Pāli đổi nội dung câu tự khen (định/tri kiến), nên dịch mới theo khuôn của `9.11` — “immersed, with unified mind … not immersed, with straying minds”, “lives knowing and seeing … lives without knowing or seeing”; `11.17` ← `12.17` (0,92) và `11.18` ← `12.18` (0,93): Pāli khác `12.17` ở chỗ không có `no ca kho` nên viết vế khẳng định “… and they’ve got all they wished for.”.

  **Nhóm 4 — D (4 khoá, báo, không tự hòa).** Pāli giống hệt nhưng lời đã ghim khác nhau: (i) `9.3`, `10.3` ← `8.3` “make an end” và `12.3` “find an end” (Pāli `antakiriyā paññāyethā`: `antakiriyā` là “làm cho chấm dứt”, `paññāyetha` là “được thấy/được nhận ra” — cả hai cách đều có cơ sở); (ii) `10.7`, `11.7` ← `9.7` “regarding” và `12.7` “on account of” (Pāli `lābhasakkārasilokena ca … tesaṁ dhammānaṁ sacchikiriyāya chandaṁ janeti`). Lớp lấp chọn lời của khoá **gần nhất phía trước** trong cùng bài (`8.3` cho `9.3`/`10.3`; `9.7` cho `10.7`/`11.7`) để không thêm một cách đọc thứ ba; người điều phối cần phân xử nếu muốn đồng nhất cả bốn khoá.

  **Nhóm 5 — C (8 khoá).** `11.2` (Pāli `…pe…`): “‘I’m swamped by rebirth, old age, and death …” (đúng một “…”, lấy từ `8.2`); `11.3` (mảnh Pāli `antakiriyā paññāyethā’ti` còn lại sau `…pe…`): “an end might be found.’”; `24.4`, `24.5` kết bài và kết chương theo khuôn đã có (“… is finished, the tenth.”, “The chapter on Similes is finished, the third.”); `25.0`–`25.4` kệ tóm lược theo khuôn “Its summary verse:”. **Bất định ghi thẳng ở kệ:** `Moḷiyaphaggunariṭṭhañca nāmo`, `Rāsikaṇerumahāgajanāmo` — các chữ `nāmo` mang nghĩa “theo tên”, tôi để tên riêng nguyên và dịch từ thường (“the Heap, the Cow Elephant, and the Great Elephant by name”); không đối chiếu được từng chữ với tên mười bài của vagga vì tên uddāna khác tên bài.

  **Số liệu A/B/C/D theo máy:** A 25 · B 19 · C 8 · D 4 (trên 56 khoá).

  **Ngoặc kép — đo và ngoại lệ có lý do.** 49/56 khoá khớp Pāli. 7 khoá lệch: `4.4`, `5.4`, `6.4` (Pāli `“sāran”ti`: 1 cặp “ ”) và `8.9`, `9.13`, `10.17`, `11.21` (Pāli `‘sāran’ti`: 1 cặp ‘ ’) mà English 0 — theo tầng ghim, vốn dịch cụm `‘sāran’ti maññamāno` bằng lời gián tiếp “imagining they were heartwood” ở `3.1`, `3.4`, `4.1`–`6.1`, `7.1`, `7.4`.

  **Cố ý lệch tầng đã ghim.** Không đổi chữ nào của tầng ghim; chỉ (1) chèn lại phần bị bỏ qua/bị lấy ở `4.4`–`6.4`, (2) chọn lời “gần nhất” cho bốn khoá D.

  **Ngoài lát.** 14 khoá đã ghim (như `4.1`, `8.8`, `9.12`) có “…” ở nơi Pāli viết đủ; lớp lấp không sao chép. Không khoá nào cắt cụt (đo: 0).

  **Ngoặc kép / nháy — bảng đo tự động trên 56 khoá.** 49/56 khoá khớp Pāli từng khoá (đếm “ ” ‘ ’ đóng/mở; `’` có chữ thường đứng ngay sau tính là dấu nhạt lược). Khoá lệch: `4.4`, `5.4`, `6.4`, `8.9`, `9.13`, `10.17`, `11.21` — lý do đã nêu ở trên.

  **Dấu lược.** 1 khoá lấp có `…pe…` trong Pāli (`11.2`); tổng số `…` trong English của 56 khoá lấp = 1; khớp quy tắc `…pe…` = đúng một `…` (không khoá nào có `…` mà Pāli viết đủ).

  Không còn khoá rỗng nào: 56/56 khoá `fillableSegments` đã được viết (9 khoá dưới 40 ký tự vẫn viết).

  **Coverage (đo thật).** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 139. Trước: 92/139 = 0,6619. Sau khi `published`: 139/139 = 1,0000 (lớp lấp phủ 47 khoá có nội dung; 9 khoá dưới ngưỡng không tính). Độ nhạy: ngưỡng 0,8 cần ≥ 112 khoá có lời; sau lấp còn dư 27 khoá trước khi rớt ngưỡng; trước lấp thiếu 20 khoá. Bài đã dưới ngưỡng trước khi lấp.

  **Hệ quả với `content/meta/reference-gaps.yaml`.** `mn/mn30` **có** record trong file đó; sau khi lớp lấp `published`, coverage = 1,0000 nên record thành thừa (test `a fill never leaves a gap record it has cured` sẽ đỏ nếu để lại). Không chạm file ấy trong lát này; để người điều phối sinh lại bằng `npm run reference:gaps`.

  **Triangulation 8,0 — không được tuyên bố là đối chiếu English độc lập.** Scorecard của bản Việt `content/meta/sutta/mn/mn30.yaml` do cùng họ công cụ với lớp lấp này chấm/dịch (xem `source/tooling.yaml`; `assessed_by` của lớp lấp trùng họ), nên bản lấp **không** phải một cách đọc English độc lập với bản Việt. Đối chiếu có: Pāli root + Sujato đã ghim (163 khoá) + bản Việt canonical (163 khoá, dùng để đối chiếu nghĩa, không dịch vòng, không chép). Bản Việt có khối `summary:` ở MN/DN nên **không chạm vào**; không sửa metadata Việt.

  **technical_integrity 9,6.** Không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, giao cho người điều phối. Không đặt blocker.
