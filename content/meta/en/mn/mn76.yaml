notes: |-
  Phân loại 33 khoá đã ghi (đo bằng script, theo Pāli đã có lời trong cùng bài): A y nguyên = 19 · B dựng lại = 7 · C tự dịch = 5 · D (Pāli trùng, lời đã ghim khác nhau; báo, không tự hòa) = 2. Script phân loại theo Pāli trùng nên các khoá tách ra từ một khoá đã ghim bị gộp sẵn (đếm là C) được nêu riêng bên dưới.
  Số khoá đã ghi: 33 trên 39 khoá tầng Anh đã ghim để trống (6 khoá còn trống).
  Khoá còn trống và lý do: 52.2, 52.8, 52.10, 52.12, 52.14, 52.16 (6 khoá, đều dưới 40 ký tự, không vào coverage). Đó là các lời trích `‘khīṇā me āsavā’ti` và `‘chinnā me hatthapādā’ti` mà tầng đã ghim nuốt vào khoá liền trước (52.1 “…knowledge and vision that their defilements are ended …”, 52.6 “…aware that their hands and feet had been amputated…”, 52.9, 52.11, 52.13, 52.15). Lấp riêng sẽ in lại đúng câu đó.
  Nhóm B (khoá ← khoá nguồn, tỉ lệ khớp do script đo): 8.5 ← 7.4 (0.74); 11.3 ← 10.2 (0.79); 14.3 ← 13.2 (0.72); 14.4 ← 13.4 (0.73); 14.5 ← 13.7 (0.80); 17.8 ← 16.6 (0.99); 17.15 ← 16.12 (0.76).
  Nhóm D: 43.2, 44-45.2.
  Nháy: 1 khoá có số dấu nháy khác Pāli (17.15); các khoá còn lại khớp Pāli từng khoá.
  Dấu lược: 0 khoá chứa `…`; mỗi `…pe…` của Pāli tương ứng đúng một `…` của English, không khoá nào mở rộng.

  Nhóm A — 8.3 (từ 7.2), 8.4 (từ 7.3), 8.6–8.10 (từ 7.6–7.10), 11.4–11.6 (từ 10.4–10.6), 17.3 (từ 16.2), 17.6, 17.7, 17.11–17.14, 17.16, 17.17 (từ 16.4, 16.5, 16.8–16.11, 16.14, 16.15) dùng lại nguyên văn lời đã ghim, chỉ bỏ ‘ mở đầu ở 8.3/17.3 vì Pāli của 8.3/17.3 không mở nháy (nháy mở ở 8.2/17.2 và đã được ghim).
  Nhóm B — 8.5 là ghép 7.4+7.5 (0.74): Pāli gộp hai vế `Āsandipañcamā … yāvāḷāhanā padāni paññāyanti` thành một khoá. 11.3 ghép 10.2+10.3 (0.79): Pāli 11.3 là một khoá dài gộp hai khoá 10.2/10.3, và có biến thể `socato` (10.2 là `socayato`); không phân xử được sắc thái khác biệt một chữ nên giữ “aggrieve” như 10.2. 14.3, 14.4, 14.5 ghép 13.2+13.3, 13.4+13.5, 13.6+13.7 (0.72, 0.73, 0.80). 17.8 dựng từ 16.6 (0.99, chỉ khác khoảng trắng `sattakāyā` / `satta kāyā`). 17.15 ghép 16.12+16.13 (0.76): Pāli ghép hai khoá thành một câu, và nhắc lại cách nhập của tầng đã ghim: “for that cannot be” của 16.12 đã dịch `hevaṁ natthi` của 16.13.
  Nhóm B tách (nhóm C theo script) — 17.4/17.5 và 17.9/17.10: Pāli 16.7 gộp `Te na iñjanti … byābādhenti. Nālaṁ aññamaññassa …` còn 17.4/17.5 tách đúng hai câu đó. Lớp lấp dùng đúng hai câu của 16.7 đã ghim, mỗi câu một khoá.
  Nhóm D (2 khoá, báo chứ không tự hòa) — 43.2 và 44-45.2 có Pāli trùng với 35-42.4, 46.2, 47.3, 48.3; lời đã ghim của bốn khoá đó là “… with a teacher under whom they achieve such a high distinction …” ở 35-42.4, 47.3, 48.3, nhưng 46.2 là “… under a teacher who achieves such a high distinction …”. Chọn dạng của ba khoá (3 trên 4).
  Nhóm C — 54.5 `Sandakasuttaṁ niṭṭhitaṁ chaṭṭhaṁ.`: “With Sandaka is finished—the sixth.”
  Nháy: 17.15 có 1 cặp “ ” (Pāli 0) vì Pāli viết lời trích bằng `iti` không dấu nháy, đúng như 16.12 đã ghim. Các khoá còn lại khớp Pāli.

  Cố ý lệch tầng đã ghim: 43.2 và 44-45.2 theo dạng đa số (3/4) của bốn khoá có Pāli trùng. 17.15 có cặp “ ” vì lời trích `…karissāmīti` được dịch như 16.12 đã ghim.

