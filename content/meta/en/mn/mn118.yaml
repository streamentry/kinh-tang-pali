notes: |-
  **Bốn số (đo bằng máy, ngưỡng gần trùng 0,80): A = 7 · B = 1 · C = 1 · D = 0.** Ghi 9/9 khoá.

  **A (7 khoá) — dùng lại nguyên văn lời Sujato của khoá có Pāli trùng từng chữ:** `13.2` ← `9.2`
  (“There are such mendicants in this Saṅgha.”, Pāli trùng ở 6 khoá đã ghim, cùng một lời); `38.4` ← `31.1`;
  `38.6` ← `32.1`; `38.8` ← `33.1`; `38.10` ← `34.1`; `38.12` ← `35.1`; `39.1` ← `36.1`. Khối `38.x`/`39.1` là
  lượt nhắc lại chuỗi bảy giác chi (lần thứ hai, gắn với pháp niệm xứ); tầng đã ghim chỉ dịch các khoá
  `Yasmiṁ samaye …` rồi bỏ trống các câu nối `So tathāsato …`, `Tassa taṁ dhammaṁ …` — những câu ấy đã có lời ở
  `31.1`–`36.1`, nên lấy lại đúng lời đó để bài không tự mâu thuẫn.

  **B (1 khoá) — `5.2` ← `4.4` (0,80).** Pāli `5.2` là lời đồn của tỳ-kheo các xứ lặp lại câu Đức Phật nói ở
  `4.4`, chuyển sang ngôi thứ ba (`āgamessatī`) và thêm `kira` (“nghe nói”). Lấy nguyên cụm của `4.4`
  “wait … in Sāvatthī for the Komudī full moon of the fourth month”, thêm “It seems” cho `kira`, “right there” cho
  `tattheva`. Tầng đã ghim ở `5.1` dừng ở “heard about this,” rồi nhảy sang `5.3`, tức là nội dung lời đồn bị nuốt;
  bản lấp chèn lại đúng nội dung ấy.

  **C (1 khoá) — `43.4`, colophon** `Ānāpānassatisuttaṁ niṭṭhitaṁ aṭṭhamaṁ.` → “Mindfulness of Breathing is
  finished—the eighth.”, theo khuôn colophon đã có trong lớp lấp MN (tên bài lấy từ `0.2` của Sujato).

  Nháy: 9/9 khoá khớp Pāli (đo từng khoá). Dấu lược: không khoá nào có `…` trong Pāli, bản lấp cũng 0.

  Coverage (khoá Pāli ≥ 40 ký tự, bỏ khối `:0`): mẫu số 137; trước 129/137 = 0,9416, sau khi `published`
  137/137 = 1,0. Độ nhạy: phải mất thêm 27 khoá có nội dung mới rớt dưới 0,8. `mn118` **không** có record trong
  `content/meta/reference-gaps.yaml`.

  Triangulation ≤ 8,0: scorecard Việt của bài này (`content/meta/sutta/mn/mn118.yaml`) ghi `assessed_by`/`translators` thuộc **cùng họ công cụ** với lớp lấp (cùng khai trong `source/tooling.yaml`). Vì vậy bản lấp **không** phải cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root + lời Sujato đã ghim của cùng bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

