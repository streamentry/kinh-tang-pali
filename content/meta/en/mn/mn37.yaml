notes: |-
  **Phân loại 16 khoá (đo bằng máy trên Pāli đã ghim và tầng Anh đã ghim của chính bài này, ngưỡng gần-trùng 0,75 trên Pāli đã bỏ dấu câu): A = 3 · B = 4 · C = 3 · D = 6.**
  Định nghĩa để tái lập: A khi Pāli chuẩn hoá trùng nguyên văn với khoá đã có lời và các khoá ấy chỉ có một dạng lời; D khi Pāli trùng nhưng các lời đã ghim
  khác nhau; B khi không trùng nhưng gần trùng (≥ 0,75); C là phần còn lại. Tổng 3 + 4 + 3 + 6 = 16, đúng bằng số khoá đã ghi (16/16
  khoá của `fillableSegments`). Cách xử lý thực tế: trong nhóm A, 3 khoá lấy lại **nguyên văn từng chữ** và 0 khoá có điều chỉnh (nêu bên dưới);
  9 khoá viết tay (gồm B, C, D và các A có điều chỉnh).

  **Nhóm D — sáu khoá `15.4`, `15.6`, `15.7`, `15.9`, `15.15`, `15.16` (Đức Phật thuật lại cho Moggallāna).**
  Pāli của chúng trùng nguyên văn với hai chỗ đã ghim (lần Sakka thưa ở `2.2`–`3.x` và lần Sakka kể lại ở
  `12.5`–`13.x`), nhưng hai chỗ ấy tầng đã ghim dịch **khác nhau**: `3.1` “take a mendicant who has heard” so
  với `13.2` “it’s when a mendicant has heard”; `3.2` nháy đơn so với `13.3` nháy kép; `3.9`, `3.10` so với
  `13.10`, `13.11`; `2.2` “freed through the ending of craving” so với `12.5` “freed with the ending of
  craving”. Báo, không hoà: **không** sửa khoá nào đã ghim. Cách chọn cho khoá lấp là cơ học: lấy lời của chỗ
  đã ghim có **nháy khớp Pāli của khoá lấp**. Vì thế `15.6` ← `13.2`, `15.7` ← `13.3`, `15.15` ← `13.10`,
  `15.16` ← `13.11`, bốn khoá lấy nguyên văn.
  Hai khoá còn lại phải viết tay: `15.4` (Pāli nháy đơn, chỉ `12.5` khớp nháy) lấy lời của `12.5` nhưng thay
  “with” bằng “through”, vì ba trong bốn chỗ mang mệnh đề `taṇhāsaṅkhayavimutto …` (`2.2`, `3.10`, `13.11`; riêng `12.5` khác) đều
  dịch “freed through the ending of craving”; đó là **lệch một chữ có chủ đích** so với `12.5`. `15.9` (Pāli “sabbe dhammā …”ti, nháy kép) giữ
  lời đã ghim của `13.5`/`3.4` nhưng **đóng nháy** như Pāli: “nothing is worth insisting on,” — tầng đã ghim
  gộp câu này vào mệnh đề trước nên không có nháy.

  **Nhóm B/C (`5.5`, `10.2`, `15.5`, `15.8`, `15.12`, `15.13`, `15.20`).** `5.5` (0,83 với `5.3`) là vế sau của
  câu hỏi tự vấn của Moggallāna; tầng đã ghim đã đóng nháy ” ở `5.4` dù Pāli đóng ở `5.5`, nên khoá lấp đóng
  nháy ” theo Pāli (1/1) và khi đọc liền sẽ thấy ” hai lần. `10.2` là vế “evameva” của phép so sánh con dâu
  với cha chồng ở `10.1`, dùng “being discreet and prudent, each went to her own bedroom” của `9.3`.
  `15.5` đảo ngôi theo khuôn `13.1` (“When I had spoken …”). `15.8` (0,96 với `3.3`) thêm lại vocative
  “Lord of gods,” mà tầng đã ghim nuốt. `15.12`/`15.13`: Pāli ngắt giữa chuỗi bốn `viharanto`; lớp lấp tách câu
  “Meditating in this way, they don’t grasp at anything in the world.” của `13.8` đúng ở chỗ Pāli tách.
  `15.20` là câu kết, lấy tên bài của `0.2`.

  **Nháy kép “ ” và đơn ‘ ’ (không tính dấu nhạt lượu `’s`, `’t`…).** Đo từng khoá so với Pāli: 16/16 khoá khớp, không có ngoại lệ.

  **Dấu lược.** Pāli của 16 khoá có 0 dấu lược (`…pe…` đếm là **một**); lớp lấp ghi 0. Pāli viết đủ thì lớp lấp không thêm “…”.

  **Khoá trống còn lại.** Không còn: cả 16 khoá thuộc `fillableSegments` đã được lấp, kể cả các khoá dưới ngưỡng 40 ký tự (câu kết, nhãn thứ tự, dấu lược) vì chúng có thật trong Pāli; những khoá ấy không vào coverage nhưng bỏ trống sẽ để lại chỗ hổng giữa bài.

  **Coverage (đo thật, mẫu số khác 0).** Mẫu số: 94 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Trước lớp lấp: 81/94 = 0,8617. Sau khi lớp lấp `published`: 94/94 = 1,0000. Độ nhạy: ngưỡng 0,8 cho phép tối đa 18 khoá thiếu English; lớp lấp đưa số khoá thiếu từ 13 về 0 nên bài còn đệm 18 khoá. Bài này **không** có record trong `content/meta/reference-gaps.yaml`, nên không có record nào thành thừa vì lát này.

  **Khoá có chữ nhưng ngắn hơn hẳn Pāli (dấu hiệu cắt cụt/gộp của tầng đã ghim).** Đo: 0 khoá mà lời Anh đã ghim < 30% độ dài Pāli (Pāli ≥ 60 ký tự). Đây là chỗ `ratio` có thể lạc quan; lớp lấp không sửa được các khoá đã ghim. Đã dò Pāli trùng nguyên văn trên cả bài: 13 nhóm (mỗi nhóm từ hai khoá trở lên).

  **Triangulation 8.0 (trần của bài).** Scorecard Việt của `mn37` (`content/meta/sutta/mn/mn37.yaml`) do cùng họ công cụ với lớp lấp chấm (alias khai ở `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập của bản Việt và **không** được tuyên bố là đã đối chiếu English. Đối chiếu thực có: Pāli root + bản Anh đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Tệp Việt và metadata Việt không bị chạm.

  **technical_integrity 9.6.** Không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh ấy còn lại cho người điều phối, và chưa chạy cổng không phải blocker. Đã tự kiểm bằng phép đo riêng: JSON parse, NFC, mọi khoá thuộc `fillableSegments`, không khoá nào che bản đã ghim, dấu lược khớp Pāli, nháy (kể các ngoại lệ đã nêu), Pāli trùng ⇒ lời trùng, và `final_score` bằng trung bình số học thô.
