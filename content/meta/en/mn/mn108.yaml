notes: |-
  Phạm vi: 24 khoá lấp, là toàn bộ khoá Sujato để trống có Pāli (21 khoá có nội dung ≥ 40 ký tự; 3 khoá ngắn hơn). Không còn khoá trống nào của bài ngoài danh sách. Vùng chính: lời Ānanda kể lại cuộc trò chuyện còn dở với Gopaka Moggallāna (6.6–6.12) và các lần Vassakāra nhắc lại câu hỏi và câu đáp (10.2–10.11, 11.4–12.5); Sujato gộp bằng lời gián tiếp ở 6.5, 10.1, 10.5–10.7 và 10.10.

  Bốn nhóm (đo bằng máy, Pāli chuẩn hoá): A=6 · B=12 · C=4 · D=2. Xử lý thực tế: 3 khoá dùng lại nguyên văn Sujato (6.6 từ 5.1 chỉ đổi “…” thành ‘…’; 6.9; 10.11); 21 khoá viết mới.

  Nhóm B (khoá ← khoá nguồn gần nhất, tỉ lệ khớp Pāli): 7.4 ← 7.2 (0.78); 8.4 ← 10.6 (0.8); 10.3 ← 7.3 (0.88); 10.4 ← 7.2 (0.74); 10.8 ← 10.6 (0.8); 10.9 ← 10.12 (0.67); 11.5 ← 7.3 (0.88); 12.1 ← 7.2 (0.74); 12.5 ← 10.6 (0.76); 26.6 ← 26.4 (0.88); 26.8 ← 26.4 (0.88); 26.10 ← 26.4 (0.88). Phần tầng ghim nuốt mà lớp lấp chèn lại: (a) 7.4, 8.2, 8.4: dạng trực tiếp `‘This one will be your/our refuge when/after …,’ to whom we/you would now turn.”` dựng từ 7.2, vì Pāli ở các khoá này có cặp ‘…’ của chính câu trích; 8.2/8.4 lấy `after the Buddha has passed away` theo 10.6. (b) 10.2–10.4, 10.8, 10.9, 11.4, 11.5, 12.1, 12.5: Pāli có dạng `ayaṁ vo mamaccayena … bhavissatīti, yaṁ … paṭipādeyyāthā’ti—` không có dấu mở cho câu lồng nên chỉ có dấu đóng; dựng theo lời gián tiếp của Sujato ở 10.6 (`who serves as your refuge after the Buddha passed away, to whom you now turn,`), giữ đúng một dấu `’` đóng, không thêm dấu mở.

  Nhóm D (Pāli trùng, lời Sujato khác nhau; không tự hoà): 6.8 (5.2 `“No, brahmin, there is not.` — lời Sujato đã nuốt phần sau — so với 29.4 `‘There is no single mendicant who has all the same qualities …`): lấy 29.4 vì đó là bản đầy đủ của cùng Pāli; 6.10 (5.4 `…they acquire it later.”` so với 29.6 `…later.’”`): lấy 5.4 rồi đổi nháy cho khớp Pāli `’`.

  Chỗ cố ý lệch, kèm lý do: (1) 6.8 dùng `worthy Gotama` của 29.4 cho `bhagavā` trong khi 5.3 ghi `Blessed One`: theo luật A (nguyên văn khoá có Pāli trùng) và ghi nhận ở đây. (2) 10.3 (và 11.5): `there is not a single mendicant who has been appointed by the Blessed One, who knows and sees, the perfected one, the fully awakened Buddha—` dựng từ 7.3 + 5.1 vì Sujato 10.7 rút gọn thành `‘No, there is not.’`. (3) 6.7 gọi `the brahmin Moggallāna the Guardian` theo 6.1; 6.11 `the conversation between us and Moggallāna the Guardian that was left unfinished` theo 6.1.

  Quan sát tầng ghim (ngoài lát, không sửa): 7.3 và 8.3 đóng nháy `”` ngay sau `There is not.` dù Pāli của chúng kết bằng dấu hai chấm; lớp lấp 7.4 và 8.4 (Pāli `…paṭipādeyyāmā”ti`) kết bằng `”` đúng Pāli, nên đọc ghép sẽ thấy `”` thừa ở khoá trước (2 khoá). Sujato cũng tự thêm `…` ở 16 khoá mà Pāli viết đủ (20.4–20.16, 26.5, 26.7, 26.9) và thay `…` của Pāli bằng chữ ở 27.3, 27.4.

  Nháy: đo từng khoá, khớp Pāli ở mọi khoá.

  Coverage (≥ 40 ký tự, bỏ khối `:0`): trước 116/137 = 0.8467; sau (khi `published`) 137/137 = 1.0000. Độ nhạy: có thể thiếu tối đa 27 khoá có nội dung mà vẫn ≥ 0,80. Bài không có record trong `content/meta/reference-gaps.yaml` (đã trên ngưỡng). Số khoá trống còn lại sau lớp lấp: 0.

  Triangulation 8.0: `content/meta/sutta/mn/mn108.yaml` (bản Việt) ghi cùng họ công cụ với lớp lấp này (khai trong `reviewers`/`quality.assessed_by`, đối chiếu `source/tooling.yaml`), nên bản lấp KHÔNG phải cách đọc English độc lập, và scorecard tiếng Việt của bài này không được tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu có thật: Pāli root + Sujato đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Không chạm tầng Việt.

  technical_integrity 9.6: không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối) nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, không đặt blocker.
