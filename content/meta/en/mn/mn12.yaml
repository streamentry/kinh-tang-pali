notes: |-
  **Phân loại 55 khoá (đo bằng script, so Pāli đã chuẩn hoá dấu câu; đọc lại bằng tay từng nhóm):
  A = 35 · B = 19 · C = 1 · D = 0 (script báo 4 khoá D, xem dưới — đều không phải mâu thuẫn thật).**
  Lấp đủ 55/55 khoá tầng Anh đã ghim để trống (không còn khoá trống nào của bài): 52 khoá đủ ngưỡng 40 ký tự
  (sau khi bỏ khoảng trắng cuối) và 3 khoá dưới ngưỡng (`48.8`, `53-55.10`, `64.9`); ba khoá này là mắt xích
  của câu (“Why is that?”, “You might think that …”, colophon) nên được lấp, chúng không vào coverage.

  **Nhóm A — 35 khoá, dùng lại nguyên văn lời đã ghim của cùng bài.**
  · Lời Sunakkhatta (`3.2`–`3.11`, Tôn giả Sāriputta thuật lại): `3.3` = `2.3` · `3.4` = `3.10` = `2.4` · `3.5` = `2.5` ·
  `3.8` = `2.2` · `3.9` = `21.2` (và `43.2`). Pāli của `3.3`, `3.5`, `3.8` trùng *từng chữ* với `2.3`, `2.5`, `2.2`.
  · `28.4`, `31.4`, `34.4` = `21.5`; `28.5`, `31.5`, `34.5` = `21.6` (hậu quả của lời nói/tư tưởng/tà kiến, ba lần
  lặp ở các hội chúng và loài sinh).
  · Năm khoá `37.9`, `38.9`, `39.9`, `40.9`, `41.10` = `42.10` (“In the same way, when I’ve comprehended the mind of an
  individual, I understand:”).
  · `37.10` = `37.2` · `37.11` = `37.3` · `38.11` = `38.3` · `39.11` = `39.3` · `40.11` = `40.3` · `41.12` = `41.3`
  (vế “I see that they have indeed been reborn …” của năm cặp người–cảnh giới).
  · `48.8` = `48.4` · `48.9` = `48.5` (“Why is that?”, “So that I wouldn’t see them, nor they me.”).
  · `53-55.10`, `53-55.12` = `52.8`, `52.10`; `53-55.15` … `53-55.22` = `52.13` … `52.20` (tám vế “Due to eating so little …”).

  **Nhóm B — 19 khoá, dựng lại từ lời đã ghim.**
  · `3.7` ← `2.1` (khớp 0,77): “Now at that time Sunakkhatta the Licchavi had recently left …” đổi sang lời thưa ngôi
  thứ hai (“Sir, Sunakkhatta the Licchavi has recently left this teaching and training.”) — thêm `bhante`, đổi
  thì kể (`hoti`) sang hiện tại theo Pāli (`acirapakkanto`, không còn `hoti`).
  · `3.11` ← `2.5` (khớp 1,00): chính câu của `2.5`, chỉ khác dấu đóng: Pāli `…dukkhakkhayāyā’”ti` đóng *cả hai*
  tầng nháy (‘ ở `3.9`, “ ở `3.7`) nên lời lấp kết bằng ’” thay vì ”.
  · `36.4` ← `36.2` (0,81) và `36.8` ← `36.2` (0,80): công thức `yathā paṭipanno … upapajjati tañca pajānāmi` của
  địa ngục dựng cho súc sinh/người, thay “a place of loss, a bad place, the underworld, hell” bằng “the animal
  realm” / “among human beings”. `36.5` ← `36.1` (0,84): “I understand hell, and the path and practice that leads to
  hell” đổi thành “the ghost realm”. **Lưu ý người đọc:** tầng đã ghim dịch `36.3`, `36.6`, `36.7` chỉ là mảnh ghi
  nhớ (“I understand the animal realm …”, “the ghost realm …”, “humanity …”), lệch một khoá so với Pāli, nên lời
  lấp ở `36.4`/`36.5` đứng ngay cạnh mảnh đã ghim `36.6` “the ghost realm …” — hai chỗ nhắc cùng một cõi.
  · `38.10` ← `37.2` (0,87), `39.10` (0,90), `40.10` (0,86), `41.11` (0,90): lấy khung “‘This individual is practicing
  in such a way and is riding upon such a path that when their body breaks up, after death, they will be reborn in …’”
  của `37.2`, thay cảnh giới bằng “the animal realm”/“the ghost realm”/“among human beings”/“a good place, a
  heavenly realm” theo đúng lời đã ghim ở `38.3`, `39.3`, `40.3`, `41.3` (cùng cảnh giới). **Cố ý lệch lời đã ghim:**
  tầng đã ghim ở `38.2`, `39.2`, `40.2` (cùng Pāli với `38.10`, `39.10`, `40.10`) — và `41.2` (Pāli gần trùng) — dịch ngắn
  bằng “‘This individual … will be reborn in the animal realm.’” (cũng ghi dấu lược) dù Pāli viết đủ, không có
  `…pe…`. Lớp lấp **không** chép dấu lược bịa ấy mà dịch đủ, vì Pāli ở đó viết đủ; hai khoá cùng Pāli ở `38.2`/`38.10`
  (và `39.2`/`39.10`, `40.2`/`40.10`) do đó không còn “giống nhau từng chữ” mà chỉ khác ở chỗ lớp lấp **không có “…”**.
  · `48.7` ← `48.3` (0,92): “When I saw a cowherd or a shepherd …” thêm dẫn “In the same way,” cho `evameva kho`.
  · `53-55.7`, `.8`, `.9`, `.11`, `.13`, `.14` ← `52.5`, `.6`, `.7`, `.9`, `.11`, `.12` (khớp 0,84 · 0,92 · 0,94 · 0,91 · 0,93
  · 0,96). **Phép đo này là tráo từ:** Pāli ở `53-55` là *gạo* (`taṇḍula`), không phải táo dại (`kola`) như `52`, nên lớp
  lấp thay “jujube” bằng “ordinary rice” / “rice” / “grain of rice” (theo đúng “ordinary rice” mà tầng đã ghim
  dùng cho `taṇḍulehi` ở `53-55.6`). `53-55.14` không có chữ cần thay (tầng đã ghim ghi “Eating so very little”, không
  nêu tên thực phẩm) nên lấy y nguyên `52.12`.
  · `58.4` ← `57.4` (0,94) và `59.4` ← `57.4` (0,96): thay “transmigrated to” bằng “been reborn among” (`upapajjeyyaṁ`)
  và “abided among” (`āvaseyyaṁ`, theo “abided” đã ghim ở `59.3`).
  · `63.3` ← `63.2` (0,88): khoá `63.2` đã ghim **gộp** cả lời trích lẫn vế “it’s of me that this should be said.”
  vào một câu; lớp lấp lấy riêng lời trích “‘A being not liable to delusion has arisen in the world …’” (cùng từ
  ngữ của `63.2`), kết bằng ’” khớp Pāli.

  **Nhóm C — 1 khoá, tự dịch.** `64.9` colophon `Mahāsīhanādasuttaṁ niṭṭhitaṁ dutiyaṁ.` — “The Longer Discourse on the
  Lion’s Roar is finished—the second.”, theo khuôn colophon đã lấp ở `mn20`, `mn117`, `mn123`, với tên kinh của
  tầng đã ghim (`0.2`).

  **Nhóm D — script báo 4 khoá (`3.3`, `3.5`, `3.9`, `3.11`), nhưng không có mâu thuẫn thật.** Sau khi chuẩn hoá bỏ dấu
  nháy, mỗi khoá trùng với 2–3 khoá đã ghim có lời khác nhau **chỉ ở loại nháy** (`2.3` nháy kép “, `21.2` và `43.2`
  nháy đơn ‘; `2.5` ”, `4.5` ’). Lớp lấp dùng lời của khoá có Pāli giống *từng chữ* (kể cả nháy): `3.3`=`2.3`,
  `3.5`=`2.5`, `3.9`=`21.2`, `3.11` dựng từ `2.5` có thêm ’.

  **Nháy.** 47/55 khoá khớp Pāli (đo đủ bốn loại: nháy kép mở/đóng, nháy đơn mở/đóng). **Lệch có chủ đích ở 8 khoá,
  đều do giữ quy ước của khoá anh em đã ghim:** (1) `37.10`, `38.10`, `39.10`, `40.10`, `41.11` — Pāli không có nháy nhưng
  lời đã ghim ở `37.2`, `38.2`, `39.2`, `40.2` đặt cả vế “This individual …” trong nháy đơn; lớp lấp theo; (2) `53-55.11`,
  `53-55.21`, `53-55.22` — Pāli có nháy đơn cho ý nghĩ trong lòng (một, hai, một cặp) nhưng tầng đã ghim ở `52.9`,
  `52.19`, `52.20` bỏ nháy và dùng câu nối trực tiếp, lớp lấp theo vì `53-55.10` “You might think that” nối thẳng vào
  `53-55.11` (đặt nháy giữa câu sẽ lệch với `52.8`+`52.9`).

  **Dấu lược.** Không khoá nào trong 55 khoá chứa `…` ở Pāli, nên tổng dấu lược của lớp lấp bằng 0 và không ở đâu
  mở rộng dấu lược. (Dấu lược tầng đã ghim ở `38.2`, `39.2`, `40.2`, `41.2` không được sao chép: xem nhóm B.)

  **Cố ý lệch tầng đã ghim:** (1) bỏ “…” ở `38.10`, `39.10`, `40.10`, `41.11` như trên; (2) thay từ ở `53-55`
  (rice ≠ jujube); (3) lời `3.11` và `63.3` đóng nháy ’” khớp Pāli, khác lời đã ghim của `4.5` (’) và `63.2` (”).

  **Coverage (mẫu số = khoá Pāli ≥ 40 ký tự, bỏ `:0`; không phải mọi khoá):** trước 260/312 = **0,8333**; sau
  312/312 = **1,0000** (sau khi `published`). Độ nhạy: ngưỡng 0,8 cần ≥ 250/312, bài đang ở 260 nên **chỉ còn
  dư 10 khoá** — lớp lấp không quyết định bài trên hay dưới ngưỡng, nhưng đưa bài từ sát ngưỡng lên 1,0.
  Bài này **không** `below`, nên `content/meta/reference-gaps.yaml` không có record phải xoá vì lát này; không chạm tệp đó.

  **Triangulation 8.0 — bản lấp không phải cách đọc English độc lập.** Scorecard Việt của `mn12`
  (`content/meta/sutta/mn/mn12.yaml`) ghi `quality.assessed_by` **trùng họ công cụ** với lớp lấp này (đối chiếu
  theo `source/tooling.yaml`); bài này **không** được tuyên bố là đã đối chiếu English độc lập. Bản Việt
  canonical được dùng để đối chiếu nghĩa ở 55 khoá, không dịch vòng qua nó.

