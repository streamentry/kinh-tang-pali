notes: |-
  Phạm vi: 42 khoá lấp, là toàn bộ khoá Sujato để trống có Pāli (33 khoá có nội dung ≥ 40 ký tự; 9 khoá ngắn hơn). Không còn khoá trống nào của bài ngoài danh sách. Hai vùng: ba lần cha mẹ và bạn bè nài Raṭṭhapāla ở ăn (7.12–10.18) và bốn tuyên bố của Pháp ở các khoản 38–41; Sujato gộp cả nhóm vào lần đầu rồi để trống lần lặp.

  Bốn nhóm (đo bằng máy, Pāli chuẩn hoá): A=26 · B=6 · C=2 · D=8. Xử lý thực tế: 25 khoá dùng lại nguyên văn Sujato; 17 khoá viết mới (nhóm B dựng lại, nhóm C tự dịch, nhóm D chọn tay).

  Nhóm B (khoá ← khoá nguồn gần nhất, tỉ lệ khớp Pāli): 8.13 ← 9.1 (0.83); 8.17 ← 8.5 (0.75); 10.14 ← 10.2 (0.61); 10.16 ← 10.6 (0.69); 10.17 ← 10.8 (0.7); 41.25 ← 41.10 (0.77). Phần tầng ghim nuốt mà lớp lấp chèn lại: 8.17 = nối 8.4 + 8.5; 10.14 = nối 10.2 + 10.3 + 10.4 (Pāli 10.14 dồn ba khoá thành một câu); 10.16 = 10.6 + 10.7; 10.17 = 10.8 + 10.9; 8.13 `And for a second time, Raṭṭhapāla kept silent.` theo 9.1/10.19 (Sujato gộp vào 8.12).

  Nhóm D (Pāli trùng, lời Sujato khác nhau; không tự hoà): 7.16 và 8.15 (7.6 `But, dear Raṭṭhapāla, …` so với 8.2 `Dear Raṭṭhapāla, …`): mỗi khoá theo khoá anh em cùng chương (7.16 từ 7.6, 8.15 từ 8.2). 7.18 và 8.21 (7.8 `Even when you die …` so với 8.4/8.9 `When you die …`): cùng cách (7.18 từ 7.8, 8.21 từ 8.4). 38.18, 39.22, 40.16, 41.39 (Sujato có ba dạng: 36.x `‘…’`, 38.1 `“‘…’`, 38.14 `‘…’”`): dùng dạng trần `‘…’` khớp Pāli (hai dấu), không chép dạng có ” hoặc “ thừa.

  Chỗ cố ý lệch, kèm lý do: (1) 7.15 KHÔNG chép nguyên văn 8.14 (Pāli trùng) mà viết `For a third time, Raṭṭhapāla’s parents said to him:`; lời đã ghim ở 8.14 `and a third time, Raṭṭhapāla’s parents made the same request.` đúng với lần cha mẹ nài ăn ở chương 8 nhưng sai khi chép vào chương 7 nơi cha mẹ là bên đáp lời xin xuất gia. Đây là chỗ lệch có chủ ý so với luật A. (2) 10.14: `you are the only child of your parents` thay `your parents’ only child` của 10.2 để dấu `’` sở hữu số nhiều không bị bộ đếm nháy đọc thành nháy đóng; nghĩa không đổi. (3) 40.9: câu trích `‘I will continue to amuse myself in the same way, supplied and provided with these same five kinds of sensual stimulation.’` dựng từ 40.7 (Sujato dùng ngôi thứ hai trong câu hỏi; ở đây là lời nhà vua, nên chuyển ngôi). (4) 41.25 theo 41.10 (`I come from the east` đổi thành `over the ocean`), không mở rộng.

  Quan sát tầng ghim (ngoài lát, không sửa): 38.14, 39.18 và 40.12 của Sujato đóng nháy `”` ngay sau `’` dù Pāli đóng `”` ở khoá kế (38.15, 39.19, 40.13, các khoá thân có Pāli `pabbajito”ti`); vì lớp lấp chép nguyên 41.36 (đóng `”` đúng chỗ Pāli) nên khi đọc ghép sẽ thấy hai dấu `”`: lỗi nằm ở tầng ghim (3 khoá). Sujato cũng thay các `…` của Pāli bằng chữ ở 5 khoá (7.8, 8.12, 41.20–41.22).

  Nháy: đo từng khoá, khớp Pāli ở mọi khoá.

  Coverage (≥ 40 ký tự, bỏ khối `:0`): trước 255/288 = 0.8854; sau (khi `published`) 288/288 = 1.0000. Độ nhạy: có thể thiếu tối đa 57 khoá có nội dung mà vẫn ≥ 0,80. Bài không có record trong `content/meta/reference-gaps.yaml` (đã trên ngưỡng). Số khoá trống còn lại sau lớp lấp: 0.

  Triangulation 8.0: `content/meta/sutta/mn/mn82.yaml` (bản Việt) ghi cùng họ công cụ với lớp lấp này (khai trong `reviewers`/`quality.assessed_by`, đối chiếu `source/tooling.yaml`), nên bản lấp KHÔNG phải cách đọc English độc lập, và scorecard tiếng Việt của bài này không được tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu có thật: Pāli root + Sujato đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Không chạm tầng Việt.

