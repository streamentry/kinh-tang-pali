notes: |-
  **Phân loại 15 khoá (đo bằng máy trên Pāli root và tầng Sujato đã ghim): A dùng lại nguyên văn = 5 · B dựng lại = 10 · C tự dịch = 0 · D báo = 0.** A gồm cả khoá lặp nguyên văn một khoá lấp trước đó trong cùng bài; B là Pāli gần (tỉ lệ khớp từ 0,6) một khoá đã có lời, chỉ chèn phần tầng ghim nuốt mất; D là Pāli trùng nguyên văn với khoá đã ghim nhưng lời đã ghim khác nhau, hoặc lớp lấp cố ý lệch (nêu từng khoá bên dưới).

  **Nhóm 1 — sáu khoá `ṭhānena` (6.16, 6.18, 6.20, 7.16, 7.18, 7.20), dựng lại từ 6.7 / 6.9 / 6.11 và 7.7 / 7.9 / 7.11 (tỉ lệ khớp 0,93 mỗi khoá).** Pāli của sáu khoá chỉ khác ba khoá nguồn ở một chữ: `therā` thành `navā`. Tầng đã ghim dịch ba khoá nguồn chỉ còn “This is the first / second / third ground.” — nuốt mất vế `therā bhikkhū gārayhā / pāsaṁsā bhavanti`. Lớp lấp giữ khung của tầng ghim và chèn lại phần bị nuốt: “on which the junior mendicants should be criticized / praised”. “junior mendicants” lấy từ 6.14 / 7.14 đã ghim (`navā bhikkhū`), còn “criticized / praised” lấy từ 6.12 / 7.12.

  **Nhóm 2 — 6.21 và 7.21, dựng lại từ 6.12 và 7.12 (0,94).** Chỉ đổi `Therā` thành `Navā`, tức “senior” thành “junior”, theo cách 6.14 / 7.14 đã ghim dịch `navā`.

  **Nhóm 3 — 6.19, dựng lại từ 6.10 (cùng Pāli, chỉ thêm `honti` và bỏ nháy; khớp 6.4 ở 0,98).** Lấy nguyên lời 6.10 đã ghim, nháy đơn khớp Pāli của 6.19. Chữ `honti` không làm đổi nghĩa.

  **Nhóm 4 — 9-15.15 (câu kết bài).** Tự dịch theo khuôn đã dùng ở các bài lấp khác (mn107, mn117, mn123, mn136): “<tên bài> is finished—the <thứ tự>.”, tên bài lấy từ 0.2 đã ghim (“Heirs in the Teaching”).

  **A (5 khoá, dùng lại nguyên văn): 6.15 ← 6.6, 6.17 ← 6.8, 7.15 ← 7.6, 7.17 ← 7.8, 7.19 ← 7.10.** Pāli trùng từng chữ nên lấy từng chữ lời đã ghim.

  **Cảnh báo về 7.19 (và lỗi của tầng đã ghim mà lớp lấp thừa hưởng).** Pāli 7.19 là `na ca bāhulikā, na sāthalikā okkamane nikkhittadhurā paviveke pubbaṅgamā` — hai vế sau (`okkamane nikkhittadhurā`, `paviveke pubbaṅgamā`) là vế *khẳng định* (đã đặt gánh nặng về sự thối lui; đi đầu trong viễn ly). Tầng đã ghim ở 7.4 và 7.10 dịch cả chuỗi thành “They’re not indulgent and slack, leaders in backsliding, neglecting seclusion”, tức là lời của vế *đối lập* 6.4 chồng lên một phủ định, nên đọc ra gần như nghịch nghĩa với Pāli. Luật của lớp lấp là dùng lại nguyên văn khi Pāli trùng, nên 7.19 theo 7.10 để bài không tự mâu thuẫn; chỗ này **không** được coi là đã giải quyết mà được ghi nhận như bất định. Vì vậy hạ `semantic_fidelity` xuống 8.9 và nêu rõ ở đây; sửa phải bắt đầu từ 7.4 và 7.10 ở tầng đã ghim (ngoài lát này).

  Dấu lược: 0 khoá của lớp lấp có `…` (đã đo: Pāli của 15 khoá không chứa `…`). 6.13 và 7.13 có `…pe…` nhưng đã nằm ở tầng ghim. Nháy: khớp Pāli ở cả 15 khoá, không có ngoại lệ.

  **Khoá còn trống:** 0 trong 15 khoá `fillableSegments` (đã lấp hết; đo bằng máy: không còn khoá Pāli nào của bài thiếu cả tầng Sujato lẫn lớp lấp). **Coverage** (Pāli ≥ 40 ký tự, bỏ khối `:0`): trước 84/98 = 0.8571; sau khi `published` 98/98 = 1.0000. Độ nhạy: ngưỡng 0,8 cho phép thiếu tối đa 19 khoá có nội dung (phần nguyên của 0,2 × 98); trước lát bài thiếu 14. `content/meta/reference-gaps.yaml` **không** có record của bài này (coverage trước đã ≥ 0,8), nên không có record nào thành thừa vì lát này.

  **Triangulation 7.8.** Bản Việt canonical của bài (`content/meta/sutta/mn/mn3.yaml`) do cùng họ công cụ làm, rà soát hoặc chấm với lớp lấp (đối chiếu `translators` / `assessed_by` / `reviewers` với `source/tooling.yaml`), nên lớp lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English của lớp này. Đối chiếu thực có: Pāli root + tầng Sujato đã ghim (113/128 khoá có lời) + bản Việt canonical để đối chiếu nghĩa (không dịch vòng, không chép). Không có bản Anh độc lập nào cho 15 khoá lớp lấp, nên chấm không quá 8,0.

  **technical_integrity 9.6:** không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối. Không đặt blocker vì chưa chạy.
