notes: |-
  **Phân loại 19 khoá (đo bằng máy; ngưỡng B = độ tương đồng Pāli ≥ 0,60 với một khoá đã có lời): A dùng lại nguyên văn = 9 · B dựng lại = 9 · C tự dịch = 1 · D Pāli trùng nhưng lời tầng khác nhau = 0.** Đã ghi 19/19 khoá `fillableSegments` (trong đó 15 khoá có nội dung ≥ 40 ký tự Pāli; 4 khoá còn lại dưới ngưỡng, không vào coverage). Số khoá trống còn lại của bài: 0 (mọi khoá tầng đã ghim để trống đều đã lấp). Pāli chứa 0 dấu lược (`…pe…` hoặc `…` = đúng một `…` mỗi nơi), bản lấp giữ đúng 0; 9 khoá có nháy trong Pāli. Trong bài có 15 nhóm Pāli trùng nguyên văn (51 khoá).

  **Nhóm 1 — `7.5`, `7.6`, dựng lại từ `7.4` (0,67 · 0,66).** Pāli `7.4` chỉ nói *kāyakamma*, nhưng Sujato dịch cả ba nghiệp thân–khẩu–ý vào một câu (“with kindness by way of body, speech, and mind, both in public and in private”). Lớp lấp giữ cụm “both in public and in private” và chèn lại phần bị nuốt: `7.5` = *vacīkamma* (“kindness by way of speech …”), `7.6` = *manokamma* (“and kindness by way of mind …”). Hệ quả người đọc phải biết: cột Anh in ba nghiệp ở `7.4` rồi lặp lại khẩu, ý ở `7.5`–`7.6`; đó là lặp do tầng đã ghim nuốt, Pāli vốn nêu ba lần.

  **Nhóm 2 — `7.16`–`7.18` (lời Kimbila), dựng lại từ `7.4` (0,99 · 0,66 · 0,66).** `7.16` gần như trùng Pāli `7.4` (chỉ khác `;`/`,`) nhưng không sao chép nguyên văn vì lời đã ghim ở `7.4` đã gộp cả ba nghiệp; chép sẽ nói thân–khẩu–ý hai lần trong một chuỗi Pāli chỉ có ba vế. `7.16` = thân, `7.17` = khẩu, `7.18` = ý, cùng cách chia như `7.4`–`7.6`.

  **Nhóm 3 — `7.12` ← `3.3` (0,69) và `7.13` ← `7.1` (0,85).** Khoá đã ghim `7.11` (“the venerables Nandiya and Kimbila spoke likewise, and they added”) gộp lượt của Nandiya và Kimbila nên lượt riêng của Kimbila bị nuốt. `7.12` theo khuôn `3.3` (“and said to the Buddha”), `7.13` theo `7.1`, thêm “also” cho `mayampi`.

  **Nhóm 4 — `20.6`, `20.8` ← `20.5` (0,64 mỗi khoá).** Sujato nuốt hai lời báo (“these venerables have gained …”) vào `20.5`/`20.7`. Lớp lấp dùng cụm đã ghim ở `20.3` (“such and such meditations and attainments”) và không thêm gì khác.

  **A — 9 khoá dùng lại nguyên văn:** `7.14`←`7.2`, `7.15`←`7.3`, `7.19`←`7.7`, `7.20`←`7.8`, `7.21`←`7.9`, `7.22`←`7.10`, `21.6`←`21.16`, `21.7`←`21.3`/`21.17`, `21.8`←`21.4`/`21.18` (mỗi nhóm Pāli trùng đã cho đúng một lời).

  **C — `22.16`**: colophon (33 ký tự, dưới ngưỡng), “The Shorter Discourse at Gosiṅga is finished—the first.”, theo tiêu đề đã ghim `0.2`.

  **Nháy:** 9 khoá có nháy trong Pāli, English khớp từng khoá. `7.20` có “venerables’” (sở hữu cách số nhiều, không phải nháy đóng; giống `7.8` đã ghim). Không có chỗ cố ý lệch Sujato.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài không có record (coverage trước đã trên ngưỡng 0,80), nên không có record nào thành thừa. Coverage trên Pāli có nội dung: trước 86/101 = **0,8515**, sau (khi `published`) 101/101 = **1,0000**. Độ nhạy: ngưỡng 0,80 cho phép thiếu tối đa 20/101 khoá có nội dung; bản đã ghim đang thiếu 15, bản lấp bù đủ 15. Chỉ tính khi `status: published`; nếu hạ xuống `review`/`draft` thì coverage quay về mức trước.

  Triangulation: scorecard Việt của `mn31` (`content/meta/sutta/mn/mn31.yaml`) có `translators`/`reviewers`/`quality.assessed_by` cùng họ công cụ với lớp lấp (đối chiếu `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập và scorecard Việt của bài này **không** được tuyên bố đã đối chiếu English ở các khoá này; triangulation bị chặn ở mức thấp. Bản Việt canonical chỉ được dùng để đối chiếu nghĩa, không dịch vòng qua nó.

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, không đặt blocker.
