notes: |-
  **Phân loại 18 khoá (đo bằng script, in ra cả bốn số): A dùng lại nguyên văn = 11 · B dựng lại = 0 ·
  C tự dịch từ Pāli = 7 · D cùng Pāli mà lời tầng khác nhau = 0.** Không có nhóm B và không có nhóm D.
  Bài này là mẫu thuần của nhóm A: toàn bộ phần thân đã ghim lặp lại y nguyên, và tầng Anh đã ghim để
  trống **đúng** những lần lặp đó.

  **Nhóm A — 11 khoá, lấy lại nguyên văn lời đã ghim ở khoá trùng Pāli (byte-for-byte, đã kiểm).**
  · `3.6` ← `3.2` · `4.8` ← `4.3` — cùng Pāli `Tassa … te pahīyanti te abbhatthaṁ gacchanti.`
  · `4.7` ← `4.2` — cùng Pāli `‘itipime vitakkā akusalā, …’ti.`
  · `3.7` ← `3.3` · `4.9` ← `4.4` · `5.7` ← `5.3` · `6.23` ← `6.3` · `8.2`/`8.4`/`8.6`/`8.8` ← `8.10` —
  tám khoá cùng Pāli `Tesaṁ pahānā ajjhattameva cittaṁ santiṭṭhati …`. Câu này xuất hiện **15 lần**
  trong bài; tầng đã ghim dịch 8 lần, để trống 7 lần, và cả 8 lần đã ghim **giống nhau từng chữ**, nên
  lớp lấp chỉ có một cách đúng duy nhất.

  **Toàn bộ 18 khoá có Pāli trùng nguyên văn ở nơi khác trong cùng bài: 11 cặp.** Đếm trên cả tầng
  Pāli của bài (87 khoá): **7 nhóm trùng nguyên văn**, trong đó nhóm lớn nhất là 15 khoá kể trên. Bốn
  cặp còn lại — `3.2`+`3.6`, `4.2`+`4.7`, `4.3`+`4.8`, `6.5`+`6.9`+`6.13`+`6.17` — đều đã ghim ở cả hai
  vế hoặc đã ghim ít nhất một vế, nên không khoá lấp nào bị bỏ sót.

  **Nhóm C — 7 khoá: dòng colophon + bài kệ tóm lược tên các kinh trong phẩm (`8.16`, `8.17`, `9.0`
  –`9.4`).** Tầng đã ghim để trống **cả khối đuôi** của bài, đây là lỗ hổng có hệ thống của bản đã ghim:
  nó không dịch dòng colophon nào trong Majjhima.

  · `8.16` `Vitakkasaṇṭhānasuttaṁ niṭṭhitaṁ dasamaṁ.` → "How to Stop Thinking is finished—the tenth."
    `dasamaṁ` là số thứ tự (thứ mười), nên "the tenth". Tên kinh lấy từ `:0.2` **của chính bài này** đã
    ghim, đúng như tiền lệ `mn117` và `mn14`. Dịch chặt `Vitakkasaṇṭhāna` thành "The Discourse on
    Stilling Thoughts" cũng có thể đúng, nhưng lớp lấp ưu tiên tên mà bốn cột đối chiếu đang hiện.
  · `8.17` `Sīhanādavaggo niṭṭhito dutiyo.` → "The Lion’s Roar Chapter, finished—the second."
    `dutiyo` là số thứ tự của **phẩm**, không phải của bài — đây là phẩm Sư Tử Hống thứ hai trong
    Majjhima. Khuôn `Xvaggo` → "The X Chapter" theo `an3.70`, `an7.43`.
  · `9.0` `Tassuddānaṁ` → "Its summary verse:" — nguyên văn theo ba tiền lệ `sn35.93`, `an3.70`,
    `an7.43`.
  · `9.1`–`9.4` — bốn câu kệ tóm lược, **không** dịch từng chữ mà dịch thành tên các kinh trong phẩm.
    Mỗi tên được đối chiếu với dòng colophon `…suttaṁ niṭṭhitaṁ N` của chính các bài anh em trong tầng
    Pāli đã ghim, và cả mười tên đều khớp đúng thứ tự:
    `Cūḷasīhanāda`=mn11(1) · `lomahaṁsa`=mn12(2) · `Mahādukkhakkhandha`=mn13(3) ·
    `Cūḷadukkhakkhandha`=mn14(4) · `Anumāna`=mn15(5) · `Khilapattha`=mn16 `Cetokhila`(6) ·
    `Madhupiṇḍika`=mn18(8) · `Dvidhāvitakka`=mn19(9) · `Pañcanimittakathā`=mn20(10) — bài này dạy
    đúng `pañca nimittāni` ở `2.1`.
    Chỗ **không** dùng tên tiếng Anh đã ghim ở `:0.2` của các bài kia (Sujato dịch `Cetokhila` là
    "Hard-heartedness", `Anumāna` là "Measuring Up" — vế từ không liên hệ gì với Pāli), vì ở đây tên
    phải dịch **từ Pāli**; chỉ `8.16` mượn tên của chính mình.

  **Hai điều trong kệ tóm lược phải nói thẳng, không giấu.**
  1. `9.1` là một chữ chạy liền: `Cūḷasīhanādalomahaṁsavaro`. Lớp lấp tách thành hai tên —
    "The Shorter Lion’s Roar, the Longer Lion’s Roar, called Goose-Bumps" — vì có hai bằng chứng nội
    tại: `lomahaṁsanapariyāyo` là cách `mn12` gọi đúng bài dạy của chính nó (`mn12:64.6`), và `Mahā` +
    `sīhanāda` của `mn12` bị uddāna nén lại đúng như `mn30:25.1` (`Moḷiyaphaggunariṭṭhañca nāmo`) và
    `mn142:15.1` (`Bhaddekānandakaccāna`) nén ba tên vào một chữ. `varo` ("tốt nhất") là phụ từ uddāna
    và lớp lấp **không** dịch nó; nếu sau này người biên tập muốn dịch, "…the foremost" là cách đọc
    có thể bảo vệ được. Đây là **lựa chọn biên tập có chứng cứ**, không phải bằng chứng máy.
  2. Kệ tóm lược nêu **chín** tên cho phẩm mười bài: `mn17 Vanapattha` không được nêu. Đây là đặc
     tính của Pāli đã ghim — các uddāna Majjhima khác cũng vậy (`mn30` nêu chín tên, `mn50` tám,
     `mn142` năm). Lớp lấp **không** bịa thêm tên thứ mười, và cũng không sửa được tầng đã ghim.

  **Số khoá đã lấp: 18/18; không còn khoá trống nào của tầng Anh đã ghim ở bài này.** Nhưng chỉ **12**
  trong 18 khoá đó tính vào `coverage`, vì **6** khoá dưới ngưỡng 40 ký tự Pāli có nội dung: `8.17`
  (30), `9.0` (11), `9.1` (26), `9.2` (38), `9.3` (37), `9.4` (29). Lớp lấp vẫn điền cả sáu vì cùng một
  lý do: người đọc bốn cột sẽ thấy tiêu đề bài và bài kệ tóm lược có Pāli mà **không** có một chữ
  English nào, và đó là hốt trống thị giác, không chỉ hốt trống số đo. `8.16` đo **40** ký tự — đúng
  ngưỡng, nên có tính.

  **Coverage trước/sau và độ nhạy.** Mẫu số = Pāli có nội dung = **56** khoá (không tính khối `:0`).
  Trước lớp lấp: 44/56 = **0,7857**. Sau khi `published`: 56/56 = **1,0000**. Độ nhạy: ngưỡng 0,8
  cần ≥ 45 khoá được phủ, nên chỉ cần lấp **một** trong 12 khoá có nội dung là đã qua (45/56 = 0,8036);
  thiếu **hai** khoá thì rớt. Lớp lấp này lấp đủ 12, dư biên độ 11 khoá. Sáu khoá dưới 40 ký tự nêu
  trên **không** góp vào coverage dù đã lấp.

  **Ngoặc kép — đo, không ước lượng.** Quy tắc đo: `’` chỉ tính khi **không** đứng giữa hai chữ cái
  (nếu không thì dấu nhạt lượu `don’t` bị tính nhầm). So từng khoá với Pāli: **17/18 khớp tuyệt đối**;
  `4.7` là khoá duy nhất lệch, và lệch vì Pāli đóng nháy bằng **sandhi** `dukkhavipākā’ti` — dấu `’` đó
  nằm giữa `ā` và `t` nên phép đo coi là dấu nhạt lượu. Lớp lấp đặt đúng 1 nháy đơn mở + 1 nháy đơn
  đóng, **giống byte** lời đã ghim ở `4.2`. Bài không có `…pe…` trần cắt qua ranh giới khoá.

  **Dấu lược: tổng của lớp lấp bài này = 0.** Không khoá Pāli nào trong 18 khoá lấp có `…`; bài cũng
  không có `…pe…` ở đâu. Không có chỗ nào lớp lấp thêm dấu lược.

  **Lỗi của tầng Anh đã ghim đếm được ở đúng bài này — không sửa được, vì sửa là shadow.** Báo lại
  để người đọc bốn cột biết:
  1. **9 khoá bịa dấu lược** nơi Pāli viết đủ: `3.5` (2), `4.6` (2), `5.6` (2), `6.22` (2), `7.6` (1),
     `8.1` (1), `8.3` (1), `8.5` (1), `8.7` (1) — Pāli tương ứng **0** đơn vị lược ở cả chín khoá.
  2. **1 cặp Pāli trùng nguyên văn mà lời đã ghim khác nhau**: `7.2` và `7.7` cùng Pāli, nhưng `7.7`
     bỏ chủ ngữ ("**they** should squeeze" ở `7.2` thành "should squeeze" ở `7.7`). Đây là nhóm D
     **giữa hai khoá đã ghim**, không phải giữa khoá lấp và khoá đã ghim.
  3. Cặp `7.3`/`7.8` cùng Pāli và lời đã ghim **khớp** — đếm để loại trừ.
  Thứ tự khoá trong tệp đã ghim **khớp** thứ tự Pāli từng khoá (87/87, cả 10 khối `0`–`9`), không có
  khoá trùng/mất/thừa, không có vệt markup `<j>` hay `<b>` sót, không có ký tự lệch NFC.
  4. Ngoài ra, `8.1` và `8.3`–`8.9` là dãy liệt kê `evameva kho` rút gọn mà tầng đã ghim dịch theo
     đúng một mẫu `a mendicant …` — hợp lệ, chỉ là khoá `8.9` gộp thêm vế "When they succeed in each
     of these things" vào trong khoá mà Pāli không có.

  **Triangulation 9,2.** Scorecard Việt của `mn20` (`content/meta/sutta/mn/mn20.yaml`) ghi
  `quality.assessed_by` là `Muse Spark` và `translators` là `Kinh Tạng Pāli Project` — **khác** họ
  công cụ của lớp lấp (`source/tooling.yaml`:
  `aliasInMetadata: "OpenCode Space Bunny Free (agent)"`), nên về mặt tác giả đây là lớp đọc độc lập, và
  bản Việt canonical đủ 87 khoá để đối chiếu nghĩa. Hạ còn 9,2 vì lớp lấp vẫn **không** có bản Anh
  thứ hai: 11 khoá lấy lại nguyên văn lời Sujato (xem cảnh báo dưới), và 7 khoá colophon/uddāna không
  có bản Anh nào độc lập đối chiếu. Bài này **không** được tuyên bố là đã đối chiếu English ở 7 khoá
  cuối. Tệp Việt có khối `summary:` nên **không chạm vào**.

  **Cảnh báo về chính lớp lấp, nói thẳng vì người đọc sẽ tưởng nó độc lập.** 11 trong 18 khoá của
  lớp lấp này **tái tạo nguyên văn lời của bản Anh đã ghim**, vì Pāli trùng nguyên văn và bài không
  được tự mâu thuẫn (luật của lớp lấp). Lớp lấp do đó **không phải** một bản dịch English độc lập ở
  những khoá đó; nó vẫn là tầng `project` của dự án, không phải ấn bản của SuttaCentral, và
  `tests/unit/english-fill.test.ts` không chặn việc này vì nó không shadow khoá nào.

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build` trong lát này (cấm của người điều phốn), nên **không** tuyên bố technical gate pass.
  Bốn lệnh đó còn lại cho người điều phốn. Các kiểm chạy bằng script trên tệp này đều xanh: tập khoá
  lớp lấp **bằng đúng** 18 khoá của bản làm việc, không khoá nào có lời ở tầng đã ghim (0 shadow),
  không khoá nào rỗng, không khoá nào thiếu trong Pāli, 100% NFC, 0 lệch dấu lược, 17/18 khoá khớp
  ngoặc, 0 vệt markup.

  Hệ quả với `content/meta/reference-gaps.yaml`: `mn/mn20` **có** record trong file đó
  (`substantiveSegments: 56`, `substantiveWithoutEnglish: 12`, `coverage: 0.7857`). Sau khi lớp lấp
  này `published`, coverage là 1,0000 ⇒ record đó **phải biến mất**, nếu không
  `npm run reference-gaps:check` sẽ đỏ. Lớp lấp **không chạm** file đó; người điều phốn sinh lại bằng
  `npm run reference:gaps` trên worktree sạch.
