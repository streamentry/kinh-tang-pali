notes: |-
  13.2/13.3 lặp lại cấu trúc `parisuddhaṁ paramānuttaraṁ suññataṁ upasampajja vihari…`
  của 13.1, nên dùng lại đúng bộ "pure, ultimate, supreme emptiness" và
  "enter and remain in this same…" mà Sujato đã dùng. `viharissanti` (tương lai) dịch
  "will enter and remain" — 13.4 (Sujato) đã xác nhận `viharissāmā` = "will enter and remain".

  Bất định thật sự: Sujato ở 13.1 đã BỎ danh xưng `ānanda`, còn ở 13.4 thì giữ
  ("So, Ānanda, you should train like this"). Bản lấp GIỮ ở 13.2/13.3 — bỏ danh xưng là mất
  một đơn vị ngữ nghĩa, và 13.4 chứng minh cách giữ ấy đúng. Hệ quả: 13.1 (đã ghim) không có
  danh xưng còn 13.2/13.3 có; đây là khác biệt với bản đã ghim, không phải lỗi.

  Cụm "whether in the future / whether in the present" kế thừa cấu trúc gạch nối của 13.1
  ("whether in the past, future, or present"); nghe calque một chút, nên hạ `grammar_logic`.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
