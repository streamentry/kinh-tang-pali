notes: |-
  2.3 đã ghim gộp hai mệnh đề nguyện ("We will practice in the way that is proper for an
  ascetic. That way our label will be accurate and our claim correct."), nên 2.4/2.5 tách đúng
  hai mệnh đề ấy (mở ‘ ở 2.4, viết thường ở 2.5, ";" theo Pāli). 4.1 đã ghim gộp nội dung 4.2
  ("…that has been covered and wrapped in an outer robe") nên 4.2 tách thành "It has been
  covered and wrapped in an outer robe." 4.3 (tathūpamāhaṁ … vadāmi) theo mẫu mn25:8.4/9.16
  đã ghim ("X is just like Y, I say."): "This mendicant’s going forth is just like that, I say."
