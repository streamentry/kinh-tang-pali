notes: |-
  **Phân loại theo máy trên 75 khoá: A 25 · B 38 · C 12 · D 0.** Dùng lại **nguyên văn** từ cùng bài: 25 khoá (đúng bằng số khoá nhóm A). Đã dò 6 nhóm Pāli trùng nguyên văn trong bài (tổng 44 khoá, gồm cả khoá đã ghim lẫn khoá lấp); với mỗi nhóm đó, mọi khoá lấp đều mang cùng lời với khoá còn lại của nhóm, ngoại trừ các khoá D đã nêu. Số khoá đã ghi: 75/75 khoá `fillableSegments`.

  **Hình dạng của chỗ trống.** Phần giữa của bài lặp một khuôn cho mười đối tượng (cha mẹ, vợ con, người làm công, bạn bè, thân tộc, khách, tổ tiên, chư thiên, vua, thân xác): khối “hell” (`6`–`15`) và khối “which is better” (`16`–`25`). Tầng đã ghim dịch khối đầu của mỗi chuỗi (cha mẹ ở `6.x`, thân xác ở `15.x`; `16.x` và `25.x` cho khối sau) và mỗi nhóm giữa chỉ còn “…” ở khoá `X.1`; mọi khoá `X.2`–`X.6` còn lại rỗng. Thêm sáu khoá kể lại thông điệp của Dhanañjāni `27.12`–`27.17` (tầng ghim gói bằng “He did as Dhanañjāni asked.” ở `27.11`) và kết bài `38.8`. 75 khoá, 55 khoá có nội dung đo được.

  **Nhóm 1 — khối “hell” (`7.3`, `8.2`, `9.2`, `10.2`, `11.2`, `12.2`, `13.2`, `14.2` — B ← `6.3`, 0,62–0,93, riêng `7.3` 0,54 (C theo máy); `7.4`/`7.5`, `8.3`/`8.4` … `14.3`/`14.4` — A nguyên văn ← `6.4`/`6.5` và `15.3`/`15.4`).** Các khoá `Labheyya nu kho so …` chỉ khác nhau danh từ người phụ thuộc (tỉ lệ khớp thấp ở `7.3` 0,54 vì Pāli `puttadāra` dài; ở `10.2` 0,62 vì `ñātisālohita`) nên dựng từ `6.3`: “Could they get out of being dragged to hell by pleading that they had acted for the sake of … ? Or could … save them by pleading that the acts had been done for their sake?”, thay “their parents” bằng từng nhóm theo đúng chữ của `7.2`/`8.1`/…/`14.1`: “their wives and children”, “their bondservants and workers”, “their friends and colleagues”, “their relatives and kin”, “their guests”, “their ancestors”, “the deities”, “the king”.

  **Nhóm 2 — khối “which is better” (`16.2`, `16.4`, `17.2`–`17.6`, …, `24.2`–`24.6`, `25.2`, `25.4`).** `17.5`, `18.5`, …, `24.5` **A nguyên văn** ← `16.5`/`25.5`. `17.6`, …, `24.6` B ← `16.6` (0,87–0,95): “it’s possible to provide for your parents, avoid bad deeds, …” đổi đối tượng; với `19`–`24` (Pāli `X-karaṇīyaṁ kātuṁ`) dùng “make the proper offerings to …” theo cách tầng ghim đã dịch ở `5.4`. **Phát hiện về tầng đã ghim, ghi thẳng:** khoá đã ghim `16.3` (Pāli: người sống phi pháp vì cha mẹ “không tốt hơn”) lại mang lời của **khoá kế**: “Someone who behaves in a principled and moral manner for the sake of their parents.”; tương tự `25.3`. Vì vậy `17.3`/`17.4`, … (tính theo máy là B ← `16.3`, 0,69–0,95) và `16.4`, `25.4` thực ra là **dịch từ Pāli của chính khoá** (“… in an unprincipled and immoral manner … is not better;”, “but someone who behaves in a principled and moral manner … is better in this case.”), chỉ mượn thuật ngữ của `16.3`; không thể “dựng lại từ `16.3`” mà không tự mâu thuẫn. Các khoá `X.2` (Pāli `katamaṁ seyyo”ti?`) cùng mang một lời “Which is better?” vì tầng ghim đã gộp câu hỏi đầy đủ vào `16.1` (“Who do you think is better, …?”); lặp ấy là hệ quả của tầng ghim.

  **Nhóm 3 — thông điệp (B/A, `27.12`–`27.17`).** `27.12`, `27.15` ← `27.4` (0,98), `27.13` ← `36.3` (0,99), `27.14` ← `38.1` (0,77), `27.16` ← `27.8` (0,83), `27.17` **A** ← `27.10`. Đổi ‘ thành “ ở `27.12`/`27.15` vì Pāli mở nháy kép ở đây (lời người hầu nói với Đức Phật), còn tầng ghim ở `27.4` đã lồng trong lời Dhanañjāni.

  **C:** `38.8` kết bài → “The discourse with Dhanañjāni is finished, the seventh.”. Nhãn `sattamaṁ` ghi đúng như Pāli (số thứ tự bài trong chuỗi).

  **Số liệu A/B/C/D theo máy:** A 25 · B 38 · C 12 · D 0 (trên 75 khoá). Mười khoá `16.2`, `17.2`–`24.2`, `25.2` (`katamaṁ seyyo”ti?`) là “C” theo máy nhưng chỉ là câu hỏi ngắn; `7.3` cũng là “C” theo máy dù dựng từ `6.3`.

  **Ngoặc kép — đo và ngoại lệ có lý do.** 67/75 khoá khớp Pāli. 8 khoá lệch: `7.3`, `8.2`, `9.2`, `10.2`, `11.2`, `12.2`, `13.2`, `14.2` — Pāli có hai cặp nháy đơn lồng trong ” (đo: 0/1/2/2), English 0/1/0/0, theo cách tầng ghim đã dịch cùng khuôn ở `6.3` và `15.2` bằng lời gián tiếp.

  **Cố ý lệch tầng đã ghim.** (1) `16.4`, `25.4`, `17.3`–`24.4` không lấy lời của `16.3`/`25.3` vì lời ấy đã bị tầng ghim đẩy lệch một khoá (xem trên). (2) Đổi nhóm người phụ thuộc theo từng khối.

  **Ngoài lát.** 18 khoá đã ghim có chữ nhưng ngắn dưới 20% Pāli (ví dụ `8.1`–`14.1` chỉ còn “bondservants and workers … ” cho 169 ký tự Pāli; `29.3`, `29.5`, `29.7` “I’m not keeping well.”) — `ratio` ở bài này lạc quan. 16 khoá ghim kết bằng “…” nơi Pāli viết đủ; lớp lấp không sao chép.

  **Ngoặc kép / nháy — bảng đo tự động trên 75 khoá.** 67/75 khoá khớp Pāli từng khoá (đếm “ ” ‘ ’ đóng/mở; `’` có chữ thường đứng ngay sau tính là dấu nhạt lược). Khoá lệch: `7.3`, `8.2`, `9.2`, `10.2`, `11.2`, `12.2`, `13.2`, `14.2` — lý do đã nêu ở trên.

  **Dấu lược.** 0 khoá lấp có `…pe…` trong Pāli; tổng số `…` trong English của 75 khoá lấp = 0; khớp quy tắc `…pe…` = đúng một `…` (không khoá nào có `…` mà Pāli viết đủ).

  Không còn khoá rỗng nào: 75/75 khoá `fillableSegments` đã được viết (20 khoá dưới 40 ký tự vẫn viết).

  **Coverage (đo thật).** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 182. Trước: 127/182 = 0,6978. Sau khi `published`: 182/182 = 1,0000 (lớp lấp phủ 55 khoá có nội dung; 20 khoá dưới ngưỡng không tính). Độ nhạy: ngưỡng 0,8 cần ≥ 146 khoá có lời; sau lấp còn dư 36 khoá trước khi rớt ngưỡng; trước lấp thiếu 19 khoá. Bài đã dưới ngưỡng trước khi lấp.

  **Hệ quả với `content/meta/reference-gaps.yaml`.** `mn/mn97` **có** record trong file đó; sau khi lớp lấp `published`, coverage = 1,0000 nên record thành thừa (test `a fill never leaves a gap record it has cured` sẽ đỏ nếu để lại). Không chạm file ấy trong lát này; để người điều phối sinh lại bằng `npm run reference:gaps`.

  **Triangulation 8,0 — không được tuyên bố là đối chiếu English độc lập.** Scorecard của bản Việt `content/meta/sutta/mn/mn97.yaml` do cùng họ công cụ với lớp lấp này chấm/dịch (xem `source/tooling.yaml`; `assessed_by` của lớp lấp trùng họ), nên bản lấp **không** phải một cách đọc English độc lập với bản Việt. Đối chiếu có: Pāli root + Sujato đã ghim (232 khoá) + bản Việt canonical (232 khoá, dùng để đối chiếu nghĩa, không dịch vòng, không chép). Bản Việt có khối `summary:` ở MN/DN nên **không chạm vào**; không sửa metadata Việt.

  **technical_integrity 9,6.** Không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, giao cho người điều phối. Không đặt blocker.
