notes: |-
  Lớp lấp: 7 khoá, và **cả bảy đều dùng lại nguyên văn bản dịch đã có** — không có khoá nào
  lớp lấp tự viết câu mới.

  **Vì sao cả bảy đều là bản sao.** `mn140:19` liệt kê vòng thọ cảm lần thứ hai (`19.14`–`19.23`)
  sau ngụ ý hai cây gỗ, lặp lại đúng vòng đã liệt kê ở `19.4`–`19.13`. Đối chiếu từng khoá bằng máy:

  | khoá lấp | khoá đã ghim | Pāli |
  | --- | --- | --- |
  | `19.15` | `19.5` | nguyên văn bằng nhau |
  | `19.16` | `19.6` | nguyên văn bằng nhau |
  | `19.17` | `19.7` | nguyên văn bằng nhau |
  | `19.18` | `19.8` | nguyên văn bằng nhau |
  | `19.19` | `19.9` | nguyên văn bằng nhau |
  | `19.20` | `19.10` | nguyên văn bằng nhau |
  | `19.21` | `19.11` | nguyên văn bằng nhau |

  Script ghi file kiểm `pal[k] == pal[src]` trước khi mượn, nên không thể mượn nhầm; và in ra bảng
  cân ngoặc kép (mở/đóng) cho từng khoá: `19.15` 1/1 · `19.16` 1/1 · `19.17` 0/0 · `19.18` 1/1 ·
  `19.19` 1/1 · `19.20` 0/0 · `19.21` 1/1 — khớp Pāli từng khoá.

  **Đây đúng là bẫn `sn11.24`, và ở mức đậm đặc nhất của cả lớp lấp.** Đọc riêng `19.16` thì
  `Tasseva sukhavedaniyassa phassassa nirodhā …` rất dễ thành *"với sự diệt của xúc cảm ấy, thọ lạc
  do duyên xúc cảm ấy mà sinh ra, nó diệt, nó lắng dịu"* — nghe như một mệnh đề mới về sự diệt của
  thọ. Không phải vậy: `19.14`–`19.23` là bản lặp của `19.4`–`19.13` sau ngụ ý hai cây gỗ, và bản
  đã ghim đã dịch đúng vòng ấy một lần. Dịch lại từ đầu là cách chắc chắn nhất để làm bài kinh tự
  mâu thuẫn với chính nó.

  **Thuật ngữ vì vậy không phải do lớp lấp đặt ra một lần nào**; nó là thuật ngữ đã được tầng đã ghim
  định nghĩa và dùng nhất quán trong chính bài này: `sukha` → "pleasant", `dukkha` → "painful",
  `adukkhamasukha` → "neutral", `phassa` → "contact", `vedanā` → "feeling", `nirujjhati` →
  "ceases", `vūpasammati` → "stops", `pajānāti` → "they know: ‘…’". Bản Việt đã công bố dùng
  *thọ lạc / thọ khổ / thọ không khổ không lạc*, *xúc*, *khởi lên*, *diệt*, *lắng dịu* — chỉ dùng
  để đối chiếu nghĩa.

  **Một điểm về dấu lược, không phải về lớp lấp.** Bản Anh đã ghim kết `19.14` bằng dấu lược
  ("…to be experienced as pleasant. …") để báo rằng vòng lặp còn tiếp. Bảy khoá của lớp lấp **không**
  mang `…pe…` nên không sinh dấu lược nào, và tổng số dấu lược của lớp lấp bài này bằng 0. Lược do
  bản đã ghim đặt ở `19.14` là của tầng đã ghim, không đụng tới khoá nào của lát này.

  **Không có bất định nào.** Bảy khoá đều là bản sao của lời đã có, không có chỗ nào phải chọn giữa
  hai cách hiểu. Không blocker.

  **Ba khoá còn trống ngoài lát này, và phân biệt đúng hai loại.** Bản Anh đã ghim để trống 10 khoá
  có nội dung ở `mn140`; lát này nhận 7. Còn lại `22.5`, `22.7` và `36.8` (dòng colophon).

  1. Chúng **lấp được** — `fillableSegments` chỉ so với prose của các tầng đã ghim, không áp ngưỡng
     40 ký tự. Chúng không thuộc lát này, nên lớp lấp không đụng tới.
  2. Chúng **không được `coverage` đo** — `substantivePaliMinChars` = 40 loại cả ba.

  Tổng số khoá có nội dung của `mn140` là 190, nên sau khi lớp lấp `published` tỉ lệ Anh của bài này
  Tỉ lệ Anh **trước** lớp lấp là (190 − 7) / 190 = **0,9632**, **sau** lớp lấp `published` là **1,0000**.

  `triangulation` hạ vì không có bản Anh độc lập: bản Anh đã ghim để trống đúng bảy khoá này, và
  lớp lấp chỉ sao chép lời đã ghim của cùng bài. Đây là lát mà `triangulation` **thấp nhất** trong tám
  bài của lát cắt này — không có một câu nào của lớp lấp được đối chiếu bằng bất kỳ bản Anh nào
  độc lập; tính đúng 8,0 là đã hào phóng. Người viết bản Việt của bài này
  (`GLM-5.3 Flash (ZCode)`) không phải người viết lớp lấp này. Bốn lệnh cổng còn lại **chưa** chạy
  vì lát này bị cấm: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
