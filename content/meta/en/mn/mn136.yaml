notes: |-
  Lớp lấp: 5 khoá (`14.8`, `14.9`, `15.8`, `15.9`, `21.4`) nằm ở phần bản Anh đã ghim đã lược.

  **Bốn khoá là Pāli trùng nguyên văn — lấy lại y nguyên bản đã ghim, không dịch lại.**

  - `14.8` ≡ `13.8` (nguyên văn từng chữ) → lấy y `13.8`.
  - `14.9` ≡ `13.9` **và** ≡ `16.9` (cả hai cùng nguyên văn) → lấy y `13.9`; hai bản đã ghim
    giống nhau nên không có phải chọn.
  - `15.8` ≡ `13.8` → lấy y `13.8`.
  - `15.9` ≡ `13.9` ≡ `16.9` → lấy y `13.9`.

  Cặp `11.8`/`11.9` cũng có cùng nội dung nhưng **không** nguyên văn bằng: `11.8` thiếu vế
  `idamassa nānujānāmi;` và `11.9` mở bằng `Iti so` chứ không phải `yampi so`. Nên `15.8`/`15.9`
  theo `13.8`/`13.9` (nguyên văn), không theo `11.8`/`11.9`. Đây là lý do phải so **nguyên văn**,
  không chỉ so "cùng nghĩa".

  **Vì sao 13 và 14 phải đọc cùng nhau.** Ở `13.x` và `14.x`, Đức Thế Tôn lần lượt **không** chấp
  nhận (nānujānāmi) các phát biểu của một vị trượng phương: `13.8`/`14.8` ("ai biết như vậy là
  biết đúng") và `13.9`/`14.9` ("chỉ đây là thật, còn lại đều vô dụng"). Dịch riêng `14.8` thành
  "I also grant them that" là **đảo nghĩa** và làm bài tự mâu thuẫn ở `13.8`. Bản đã ghim ở `13.8`
  và `16.8` đều là `I also don’t grant them that`, nên khoá mới giữ y đúng vế đó.

  **Colophon `21.4`.** `Mahākammavibhaṅgasuttaṁ niṭṭhitaṁ chaṭṭhaṁ.` → "The Longer Analysis
  of Deeds is finished—the sixth." Khuôn lấy từ `mn117:38.6` (cùng lớp lấp của kho); tiêu đề lấy
  từ khoá `:0.2` đã ghim ("The Longer Analysis of Deeds"). Bản Anh đã ghim không dịch **một**
  dòng nào trong 165 dòng `…suttaṁ niṭṭhitaṁ N` của Majjhima, nên đây là lỗ hổng có hệ thống
  của bản đã ghim, không phải lỗi lẻ.

  **Chữ `chaṭṭhaṁ` giữ y "the sixth".** Pāli ở commit đã ghim bảo thứ sáu, dù `mn136` là bài thứ
  136 của Trường Bộ; bản Việt đã công bố cũng dịch `bài thứ sáu`. Giữ theo Pāli — không sửa số
  thứ tự để khớp với vị trí trong Nikāya.

  `triangulation` hạ vì không có bản Anh độc lập: bốn khoá là bản sao của bản đã ghim, và dòng
  colophon thì bản đã ghim không có chữ nào. Bản Việt chỉ để đối chiếu nghĩa; người viết bản Việt
  của bài này (`GLM-5.3 Flash (ZCode)`) không phải người viết lớp lấp này.