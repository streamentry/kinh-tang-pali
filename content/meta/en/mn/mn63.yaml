notes: |-
  **Phân loại 70 khoá (đo bằng máy, mỗi khoá một nhóm): A y nguyên = 19 · B dựng lại = 27 · C tự dịch = 5 · D (Pāli trùng, lời Anh của tầng đã ghim khác nhau) = 19.** Đã ghi 70/70 khoá `fillableSegments` của bài (31 khoá có nội dung ≥ 40 ký tự Pāli, 39 khoá ngắn hơn ngưỡng). Số khoá Sujato để trống mà lát **không** lấp: 0.

  **Cấu trúc.** Bài có ba mạch lặp: (i) mười kiến cố định của Māluṅkyaputta, lặp ở `2.8`–`2.13`, `3.4`–`3.16`, `4.3`–`4.16`; (ii) các lời “Sace bhagavā jānāti / No ce bhagavā jānāti” ở `3.26`–`3.48`;
  (iii) các câu “mayā abyākataṁ / byākataṁ” ở `7.x`, `9.x`. Tầng đã ghim viết một lần rồi bỏ các lần lặp; quan trọng nhất là Sujato **bỏ nháy** ở những chỗ Pāli có nháy.
  **Nhóm 1 — `…pe…` mười kiến (`2.8`, `2.9`, `2.12`, `2.13`, `3.4`, `3.5`, `3.10`, `3.11`, `3.14`, `3.15`, `4.11`, `4.15`).** Pāli `‘sassato loko’ti vā ‘asassato loko’ti vā …pe…` → “‘the cosmos is eternal’ or ‘the cosmos is not eternal’ …”, đúng một `…`;
  khoá kết `‘neva hoti na na hoti tathāgato paraṁ maraṇā’ti vā—` → “or ‘a realized one neither still exists nor no longer exists after death’—” (chữ của `7.21`, 0,98). `4.11`/`4.15` dùng nháy kép “ ” theo Pāli.
  **Nhóm 2 — lời nói với Đức Phật (`3.2`–`3.16`).** `3.2`←`2.1` (0,79): “Sir, as I was in private retreat this thought came to my mind—” (khoá mở nháy “). `3.3`, `3.6`–`3.9`, `3.12`, `3.13` dùng nguyên văn `2.2`, `2.4`–`2.7`, `2.10`, `2.11`
  (**giữ ngôi thứ ba “the Buddha … he”** như tầng đã ghim ở `3.17`; nháy “ ở đầu `2.2` bỏ vì Pāli `3.3` không mở nháy). `3.16`←`2.14` (0,99), không đóng nháy vì Pāli `3.16` kết bằng `…hīnāyāvattissāmīti.`.
  **Nhóm 3 — `3.26`–`3.48` (17 khoá).** Pāli `Sace bhagavā jānāti:` có mặt 10 lần trong bài (3 lần đã có lời: `3.17`, `3.19`, `3.24`; 7 lần thuộc lát); `No ce bhagavā jānāti:` 3 lần thuộc lát. **Nhóm D (7 khoá `3.26`, `3.31`, `3.33`, `3.38`, `3.40`, `3.45`, `3.47`) và ghi chú:** tầng đã ghim dịch
  Pāli này là “If the Buddha knows” (`3.17`) và “If you know” (`3.19`, `3.24`): lời Anh **tự đổi ngôi**. Chọn “If you know” (`3.19`, `3.24`) cho mọi lần lặp, vì ở các khoá lặp này tầng đã ghim luôn dùng “you”; không tự hòa hai cách.
  `3.28`, `3.35`, `3.42`: “If you don’t know” (`3.21`, `3.49`, đồng nhất). `3.29`, `3.36`, `3.43` (B 0,90 · 0,72 · 0,90 với `3.22`, `3.22`, `3.50`): lấy khung “it is straightforward … to simply say:” của tầng đã ghim và **chèn lại `ajānato apassato`**
  (“for someone who neither knows nor sees”), phần mà Sujato ở `3.22`/`3.50` không dịch. `3.30`, `3.37`, `3.44`: “‘I neither know nor see.’” (`3.23`; `3.51` thêm ” ở cuối nên không dùng). `3.48` (B 0,91 với `3.46`):
  “that a realized one neither still exists nor no longer exists after death, tell me.” — tầng đã ghim ở `3.46` gộp cả hai vế cuối vào một khoá và không có nháy; **bản lấp theo cùng quy ước không nháy** (xem phần nháy).
  **Nhóm 4 — `4.3`, `4.7`.** Pāli cùng một câu mười kiến trong dấu “ ” kép lồng trong ‘ ’ … ” . Tầng đã ghim gói cả danh sách vào “these things” ở `4.2`/`4.6`; bản lấp dịch **đủ mười kiến** theo từ của `2.3` và `7.x`
  (“the cosmos” như `3.18`, `6.6`; `7.9` của Sujato viết “the world is infinite” — **lệch từ trong chính tầng đã ghim**, bản lấp theo “cosmos” vì ở `3.25`, `3.27` và `6.x` Sujato dùng “cosmos”). `4.12`, `4.16` kết bằng đúng ”’ như Pāli (một ” của mục thứ mười, một ’ đóng lời `ehi tvaṁ …`).
  **Nhóm 5 — `5.12`–`5.28` (9 khoá `so evaṁ vadeyya:`) — nhóm D**: lời Sujato `5.8` “But the man would say:” và `5.10` “He’d say:”. Chọn `5.10` vì đây là các lần lặp sau lần đầu (`5.8`). Không tự hòa.
  **Nhóm 6 — `6.7`–`6.16`.** `6.7`←`6.3` 0,94, `6.11`, `6.15` (dấu lược `…pe…` giữ đúng một `…`): “When there is the view ‘…’ or ‘…’, there is rebirth …” . `6.8`, `6.16` dùng nguyên văn `6.4`/`6.20`. **`6.12`: “I advocate the defeat.”** — Pāli chỉ còn `nighātaṁ paññapemi.`
  vì phần `yesāhaṁ diṭṭheva dhamme` nằm trong `…pe…` của `6.11`; không mở rộng, nên câu ngắn hơn `6.4` (“And it is the defeat of these things in this very life that I advocate.”) có chủ ý.
  **Nhóm 7 — `7.6`–`7.22` (9 khoá `mayā abyākataṁ;`), `9.4`–`9.8` (`mayā byākataṁ`).** Tầng đã ghim viết `7.4` “I have not declared the following:” rồi liệt kê, bỏ lặp. Bản lấp dịch từng khoá: “I have not declared that;” … “I have not declared that.”,
  “I have declared that;” — lặp mười hai lần đúng như Pāli (B, 0,72–0,74 với `8.3`, `10.3`). **`10.8`** “The Shorter Discourse With Māluṅkyaputta is finished—the third.”

