  Nháy: đo 1/70 khoá lệch Pāli — `3.48`, theo **ngoại lệ có lý do**: Pāli có hai cặp ‘ ’ nhưng tầng đã ghim viết các khoá anh em `3.18`, `3.20`, `3.25`, `3.27`, `3.32`, `3.34`, `3.39`, `3.41`, `3.46` không nháy (“that the cosmos is eternal, please tell me.”); bản lấp theo quy ước ấy để không lệch với chuỗi. 69 khoá còn lại khớp. Các khoá A của `5.3`/`5.33` (không nháy) được thêm nháy cho khớp Pāli ở `2.8`, `2.12`, `3.4`, `3.10`, `3.14`, `4.11`, `4.15` — nên đây không phải bản chép nguyên chữ của `5.3`.
