notes: |-
  **Phân loại 50 khoá (đo bằng máy trên Pāli đã ghim và tầng Anh đã ghim của chính bài này, ngưỡng gần-trùng 0,75 trên Pāli đã bỏ dấu câu): A = 9 · B = 37 · C = 4 · D = 0.**
  Định nghĩa để tái lập: A khi Pāli chuẩn hoá trùng nguyên văn với khoá đã có lời và các khoá ấy chỉ có một dạng lời; D khi Pāli trùng nhưng các lời đã ghim
  khác nhau; B khi không trùng nhưng gần trùng (≥ 0,75); C là phần còn lại. Tổng 9 + 37 + 4 + 0 = 50, đúng bằng số khoá đã ghi (50/50
  khoá của `fillableSegments`). Cách xử lý thực tế: trong nhóm A, 9 khoá lấy lại **nguyên văn từng chữ** và 0 khoá có điều chỉnh (nêu bên dưới);
  41 khoá viết tay (gồm B, C, D và các A có điều chỉnh).

  **Nhóm “gộp khoá” có thật — 36 khoá (`14.3`–`14.11`, `15.3`–`15.11`, `16.3`–`16.11`, `17.3`–`17.11`).** Tại `14.2`, `15.2`,
  `16.2`, `17.2` tầng đã ghim dịch **cả mười mệnh đề** (sát sinh, trộm cắp, tà hạnh, nói dối, nói chia rẽ,
  nói thô ác, nói vô ích, tham, sân, tà kiến — hoặc mười điều ngược lại) vào đúng **một** khoá, rồi bỏ
  trống chín khoá kế. Đây là bốn chỗ gộp khoá thật, mỗi chỗ nuốt chín khoá; vì thế người đọc phải biết là
  lời của khoá đầu đã ôm sẵn nội dung các khoá sau, và bản lấp lặp lại từng điều. Máy xếp 33/36 khoá vào B
  (0,75–0,83 với khoá gộp) và 3 khoá (`15.11` 0,748, `17.9` 0,746, `17.11` 0,746) vào C vì sát dưới ngưỡng 0,75, nhưng không có khoá nào trong đó có lời nguyên văn để dùng lại: lớp lấp **tách**
  lời của khoá gộp theo từng mệnh đề của Pāli. Công thức duy nhất cho cả 36: “[In pain and sadness | With
  pleasure and happiness] they [hành vi], and because of [danh từ] they experience [pain and sadness |
  pleasure and happiness];” (khoá cuối kết bằng dấu chấm như Pāli). Hành vi và danh từ lấy nguyên chữ của
  khoá gộp: `14.2`/`15.2` “steal”, “commit sexual misconduct”, “use false/backbiting/harsh/nonsensical speech”, “are
  covetous”, “are malicious”, “have wrong view”; `16.2`/`17.2` các vế phủ định và “are contented”, “are
  kind-hearted”, “have right view” (cách tầng đã ghim dịch `anabhijjhālu`, `abyāpannacitto`, `sammādiṭṭhi`).
  `veramaṇī-paccayā` dịch “because of refraining from …”.

  **Nhóm A (9 khoá).** `7.5`, `7.6`, `8.5`, `8.6`, `9.2`, `11.5`, `11.6`, `12.5`, `12.6` lấy nguyên văn từ `3.5`/`4.5`/`6.5`/`9.5`/
  `10.5`/`13.5` (“Why is that?”), `3.6`/`6.6`/`9.6` và `4.6`/`10.6`/`13.6` (hai dạng “Because that’s what it’s like for
  the ignorant./knowledgable.”) và `13.2`. Chữ “knowledgable” (không phải “knowledgeable”) là **chính tả của tầng
  đã ghim**; giữ nguyên để lời của `11.6` và `12.6` giống từng chữ với `4.6`, `10.6`, `13.6`.

  **Nhóm B ngắn (4 khoá: `7.2`, `8.2`, `11.2`, `12.2`).** Tuyên bố “‘This is the way of taking up practices that is
  … now but results in future …’” dựng từ `6.2`/`13.2`/`10.2` và các tiêu đề `15.1`/`16.1` (“pleasant now but results in
  future pain”, “painful now but results in future pleasure”). Tầng đã ghim viết “an ignoramus …” ở `7.1`, `8.1`,
  `9.1`, `11.1`, `12.1` nên ba bài lặp ở giữa thiếu vế này.

  **Khoá `22.5`** là câu kết, lấy tên bài của `0.2`.

  **Dấu lược do tầng đã ghim thêm:** 15 khoá (`7.1`, `7.3`, `7.4`, `8.1`, `8.3`, `8.4`, `9.1`, `9.3`, `9.4`, `11.1`, `11.3`,
  `11.4`, …) có “…” dù Pāli viết đủ — tầng đã ghim tự rút gọn các khoá này (Pāli đầy đủ). Hệ quả: `ratio` của
  bài lạc quan (xem số khoá “có chữ nhưng ngắn hơn hẳn Pāli” bên dưới). Lớp lấp dịch **đủ** các khoá trống
  nhưng không sửa được các khoá bị rút gọn.

  **Nháy kép “ ” và đơn ‘ ’ (không tính dấu nhạt lượu `’s`, `’t`…).** Đo từng khoá so với Pāli: 50/50 khoá khớp, không có ngoại lệ.

  **Dấu lược.** Pāli của 50 khoá có 0 dấu lược (`…pe…` đếm là **một**); lớp lấp ghi 0. Pāli viết đủ thì lớp lấp không thêm “…”.

  **Khoá trống còn lại.** Không còn: cả 50 khoá thuộc `fillableSegments` đã được lấp, kể cả các khoá dưới ngưỡng 40 ký tự (câu kết, nhãn thứ tự, dấu lược) vì chúng có thật trong Pāli; những khoá ấy không vào coverage nhưng bỏ trống sẽ để lại chỗ hổng giữa bài.

  **Coverage (đo thật, mẫu số khác 0).** Mẫu số: 148 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Trước lớp lấp: 102/148 = 0,6892. Sau khi lớp lấp `published`: 148/148 = 1,0000. Độ nhạy: ngưỡng 0,8 cho phép tối đa 29 khoá thiếu English; lớp lấp đưa số khoá thiếu từ 46 về 0 nên bài còn đệm 29 khoá. Bài này **có** record trong `content/meta/reference-gaps.yaml` (dưới ngưỡng 0,8 trước khi lấp); khi lớp lấp `published`, record trở nên **thừa**. Không sửa tay tệp đó; người điều phối chạy lại `npm run reference:gaps`.

  **Khoá có chữ nhưng ngắn hơn hẳn Pāli (dấu hiệu cắt cụt/gộp của tầng đã ghim).** Đo: 10 khoá mà lời Anh đã ghim < 30% độ dài Pāli (Pāli ≥ 60 ký tự). Đây là chỗ `ratio` có thể lạc quan; lớp lấp không sửa được các khoá đã ghim. Đã dò Pāli trùng nguyên văn trên cả bài: 24 nhóm (mỗi nhóm từ hai khoá trở lên).

  **Triangulation 8.0 (trần của bài).** Scorecard Việt của `mn46` (`content/meta/sutta/mn/mn46.yaml`) do cùng họ công cụ với lớp lấp chấm (alias khai ở `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập của bản Việt và **không** được tuyên bố là đã đối chiếu English. Đối chiếu thực có: Pāli root + bản Anh đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Tệp Việt và metadata Việt không bị chạm.

  **technical_integrity 9.6.** Không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh ấy còn lại cho người điều phối, và chưa chạy cổng không phải blocker. Đã tự kiểm bằng phép đo riêng: JSON parse, NFC, mọi khoá thuộc `fillableSegments`, không khoá nào che bản đã ghim, dấu lược khớp Pāli, nháy (kể các ngoại lệ đã nêu), Pāli trùng ⇒ lời trùng, và `final_score` bằng trung bình số học thô.
