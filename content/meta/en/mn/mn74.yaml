notes: |-
  11.1 (Sujato) đã gộp cả ba vế thành một câu; 11.2/11.3 phải tách ra, nên lấy đúng bộ tính từ
  Sujato đã dùng: "impermanent, conditioned, dependently originated, liable to end, vanish,
  fade away, and cease" cho `aniccā saṅkhatā paṭiccasamuppannā khayadhammā vayadhammā
  virāgadhammā nirodhadhammā`, và "painful"/"neutral" cho `dukkhā`/`adukkhamasukhā` theo 10.2,
  10.5, 10.7, 12.1. Vế 11.2 giữ dấu chấm phẩy như Pāli để thành chuỗi song song.

  Quyết định biên tập, ghi ra: danh xưng `aggivessana` bị BỎ. Sujato bỏ nó ở 10.7, 11.1, 12.1
  (ba khoá liền nhau cùng cấu trúc `… aggivessana, …`) nhưng giữ ở 2.5, 3.1. Bản lấp theo
  11.1 và 12.1 để lát 10–13 không tự mâu thuẫn; hệ quả là mất một danh xưng ở 11.2/11.3, nên
  hạ `semantic_fidelity` và `ambiguity_integrity`.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp.
