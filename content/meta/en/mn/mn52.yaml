  Tỉ lệ Anh **trước** lớp lấp là (49 − 7) / 49 = **0,8571**, **sau** lớp lấp `published` là
  **1,0000** (49 khoá có nội dung, lớp lấp lấp 7, không còn khoá nào trống ở mức đo).

  Không có bất định thuật ngữ nào đáng kể. Không blocker.

  `triangulation` hạ vì không có bản Anh độc lập: bản Anh đã ghim để trống đúng bảy khoá này,
  và lớp lấp chỉ mượn lời đã ghim của cùng công thức. Bản Việt chỉ dùng để đối chiếu nghĩa;
