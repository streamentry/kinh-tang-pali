notes: |-
  Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.

  **Ba khoá dùng lại nguyên văn bản dịch đã có (luật `sn11.24`).**

  1. `11.4` và `13.4` — Pāli **nguyên văn bằng nhau** và bằng cả `4.4`, `8.4`, `12.4`, `14.4`:
     `Yaṁ kho pana kiñci abhisaṅkhataṁ abhisañcetayitaṁ tadaniccaṁ nirodhadhamman’ti
     pajānāti.` Bản Anh đã ghim đã dịch câu này bốn lần. Lớp lấp **lấy nguyên văn** bản `8.4`
     (cho `11.4`) và `12.4` (cho `13.4`), tức bản **có** dấu lược ở cuối — không phải bản `4.4`/`14.4`.
     Lý do chọn bản này là hình thức chứ không phải ý thích: `8.4` và `12.4` là hai chỗ mà khoá
     ngay sau (`So tattha ṭhito …pe…` rồi `anuttaraṁ yogakkhemaṁ anupāpuṇāti.`) cũng trống, nên
     bản đã ghim kết bằng lược; `11.4` và `13.4` có đúng cặp khoá trống ấy ngay sau, nên phải
     mang lược như hai khoá kia. Ngược lại `4.4` và `14.4` không có lược vì `4.5` và `14.5`
     ("Abiding in that they attain the ending of defilements.") đã được dịch. Chọn sai giữa hai
     bản cùng một câu là chọn sai ngữ cảnh.
  2. `11.3` — cùng công thức với `8.3` đã ghim (`‘ayampi kho mettācetovimutti …’` →
     "‘Even this heart’s release by love is produced by choices and intentions.’"), nên giữ nguyên
     cách gọi của tầng đã ghim và chỉ đổi đối tượng. Cùng vế ấy đã được bản đã ghim dịch y hệt ở
     `an11.16:7.6` (bài song song, cùng công thức `idampi kho/ayampi kho … abhisaṅkhatā
     abhisañcetayitā`).
  3. `5.3`, `6.3`, `7.3` — cùng công thức với `an11.16:4.4` ("Even this first absorption …") và
     `an11.16:5.5` ("Even this fourth absorption is produced by choices and intentions."). Riêng
     `7.3` (`catutthaṁ jhānaṁ`) trùng **nguyên văn** với `an11.16:5.5`, chỉ khác ở chỗ Pāli
     `mn52` mang `…pe…` nên không đóng ngoặc; giữ lược, bỏ ngoặc đóng.

  **Một lựa chọn phải ghi: ngoặc đóng ở `11.3` và `13.3`.** Pāli mở `‘` ở hai khoá này và **không**
  đóng trong khoá — dấu `’` của lớp lấp là do đóng sớm như `8.3` của chính bài đã ghim, và như
  `an11.16:7.6`. Nguyên nhân là trong Pāli của `mn52` lời suy xét ấy là **một** trích dẫn ngoài
  kéo dài qua hai khoá (`11.3` + `11.4`, `13.3` + `13.4`), trong khi bản đã ghim tách nó thành hai
  trích dẫn độc lập. Giữ ngoặc treo sẽ lệch với chính bản đã ghim ngay cạnh; đóng sớm thì người
  đọc hiểu đúng. Ghi rõ ở đây vì đây là chỗ bản lấp khác cấu trúc Pāli.

  **Dấu lược.** Ba khoá `5.3`, `6.3`, `7.3` mang `…pe…` ở Pāli nên giữ đúng một lược ở cuối và
  **không** mở rộng, dù ngay sau chúng là `anuttaraṁ yogakkhemaṁ anupāpuṇāti.`. Hai khoá `11.4`
  và `13.4` mang lược theo bản đã ghim. Tổng: 5 khoá có lược, 2 khoá không — đếm được, khớp
  Pāli từng khoá.

  **Thuật ngữ lấy nguyên từ tầng đã ghim của chính bài, không tự đặt:** `jhāna` → "absorption";
  `mettācetovimutti` / `upekkhācetovimutti` → "heart’s release by love" / "heart’s release by
  equanimity"; `viññāṇañcāyatana` → "dimension of infinite consciousness" (theo `13.1` đã ghim);
  `samāpatti` → "attainment" (theo `an11.16:8.3`, `an11.16:9.4` đã ghim); `abhisaṅkhataṁ
  abhisañcetayitaṁ` → "produced by choices and intentions"; `tadaniccaṁ nirodhadhamman` →
  "impermanent and liable to cessation"; `pajānāti` → "They understand:" (đúng cách bản đã ghim
  đặt ngoài dấu nháy và đặt trước, như repo đã làm ở `sn12.70:4.5`). Bản Việt đã công bố dùng
  *tạo tác và được chủ ý tạo thành*, *vô thường, có bản chất đoạn diệt*, *Thức vô biên xứ* —
  chỉ để đối chiếu nghĩa, không phải nguồn lấy chữ.

  **Mười hai khoá còn trống ngoài lát này, và phân biệt đúng hai loại.** Bản Anh đã ghim để trống 19
  khoá có nội dung ở `mn52`; lát này nhận 7. Còn lại 12 khoá: 7 khoá `anuttaraṁ yogakkhemaṁ
  anupāpuṇāti.` (`5.4`, `6.4`, `7.4`, `8.6`, `11.6`, `12.6`, `13.6`; 35 ký tự) và 5 khoá `So iti
  paṭisañcikkhati:` (`5.2`, `6.2`, `7.2`, `11.2`, `13.2`; 24 ký tự).

  Hai sự thật phải tách bạch, vì nếu gộp thì kết luận sai:

  1. Chúng **lấp được** — `fillableSegments` chỉ so với prose của các tầng đã ghim, không áp
     ngưỡng 40 ký tự. Chúng không thuộc lát này (`e1.json` không giao), nên lớp lấp dừng ở dấu lược
     thay vì bịa thêm vế sau.
  2. Chúng **không được `coverage` đo** — `substantivePaliMinChars` = 40 loại cả 12. Điều đó có
     nghĩa là coverage không dịch chuyển vì những khoá này, **không** phải vì chúng không quan trọng.

