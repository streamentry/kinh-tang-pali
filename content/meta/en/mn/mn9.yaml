notes: |-
  Phân loại 60 khoá (đo bằng máy, Pāli chuẩn hoá bỏ dấu câu, so với mọi khoá Sujato có chữ trong bài):
  A 12 · B 12 · C 12 · D 24. Các cụm Pāli trùng nhau giữa chính những khoá cần lấp cũng giữ cùng một lời (kiểm bằng máy):
  12 khoá `ettāvatāpi … saddhammaṁ.` (21.3, 25.3, 29.3, 33.3, 37.3, 41.3, 45.3, 49.3, 53.3, 57.3, 61.3, 65.2); 12 khoá `sammādiṭṭhi …pe… sammāsamādhi.` (22.10,
  26.5, 30.5, 34.5, 38.5, 42.5, 46.5, 50.5, 54.9, 58.5, 62.5, 66.2); 12 khoá `ettāvatāpi … saddhamman”ti.` (23.2, 27.2, …, 67.2); 11 khoá `“Sādhāvuso”ti kho …pe… apucchuṁ—`
  (24.1, 28.1, …, 64.1).

  Cơ chế khoá trống: Sujato dịch trọn ba vòng đầu của công thức (8.1–8.2, 12.1–12.2, 19.1–19.2), rồi từ 13.x trở đi nén các lần lặp bằng `…` và để trống các câu Pāli
  đã viết `…pe…` hoặc lặp nguyên văn. Mỗi mắt xích trong mười hai mắt xích (jarāmaraṇa → … → āsava) vì thế thiếu đúng bốn nhóm khoá: câu `yato kho … so sabbaso rāgānusayaṁ pahāya …pe…`,
  câu kết `ettāvatāpi kho … saddhamman”ti.`, câu `“Sādhāvuso”ti kho …pe… apucchuṁ—` và dòng `sammādiṭṭhi …pe… sammāsamādhi.`.

  Nhóm A, dùng lại lời Sujato nguyên văn (12 khoá): 23.2, 27.2, 31.2, 35.2, 39.2, 43.2, 47.2, 51.2, 55.2, 59.2, 63.2, 67.2 ← 8.2, 12.2, 19.2, 71.2 (bốn nguồn cùng một lời, có nháy kép đóng):
  “When they’ve done this, they’re defined as a noble disciple who has right view, whose view is correct, who has experiential confidence in the teaching, and has come to the true teaching.”

  Nhóm B, dựng lại từ khoá gần trùng (12 khoá): 23.1, 27.1, 31.1, 35.1, 39.1, 43.1, 47.1, 51.1, 55.1, 59.1 ← 12.1 (tỉ lệ khớp 0,66) và 63.1, 67.1 ← 12.1 (0,88). Câu mẫu của 12.1:
  “A noble disciple understands in this way fuel, its origin, its cessation, and the practice that leads to its cessation. They’ve completely given up the underlying tendency to greed, dispelled the underlying tendency to aversion,
  and eradicated the underlying tendency to the view and conceit ‘I am’. They’ve given up ignorance and given rise to knowledge, and make an end of suffering in this very life.” Bản lấp đổi “fuel” thành đúng danh từ mắt xích
  theo từng chữ Sujato của khoá `x.2`/`x.1` liền kề (21.2 “old age and death, their …”; 25.2 “rebirth”; 29.2 “continued existence”; 33.2 “grasping”; 37.2 “craving”; 41.2 “feeling”; 45.2 “contact”; 49.2 “the six sense fields, their …”;
  53.2 “name and form, their …”; 57.2 “consciousness”; 61.2 “choices, their …”; 65.1 “ignorance”), đổi “its/their” theo số. Phần Sujato nuốt mà bản lấp chèn lại: câu thứ nhất của Pāli (`evaṁ jarāmaraṇaṁ pajānāti …`),
  vì ở các khoá nguồn lân cận Sujato đã dồn vào khoá `x.2` rồi để `…`. Vế `…pe…` của Pāli ở 23.1–59.1 (10 khoá) được ghi đúng một `…`: “They’ve completely given up the underlying tendency to greed … and make an end of suffering in this very life.”;
  63.1 và 67.1 có Pāli viết đủ nên giữ cả hai câu đủ như 12.1.

  Nhóm C, tự dịch từ Pāli (12 khoá): 24.1, 28.1, 32.1, 36.1, 40.1, 44.1, 48.1, 52.1, 56.1, 60.1, 64.1 (`“Sādhāvuso”ti kho …pe… apucchuṁ—`) và 71.5 (`Sammādiṭṭhisuttaṁ niṭṭhitaṁ navamaṁ.` → “Right View is finished—the ninth.”).
  Mười một khoá đầu ghi “Saying “Good, reverend,” those mendicants … asked another question:” (đúng một `…`, đúng nháy kép mở-đóng của Pāli), đúng chữ Sujato đã dùng ở 13.1 và 20.1 (hai khoá đã ghim cho cùng một câu Pāli
  viết đủ), nên không có lệch với tầng đã ghim.

  Nhóm D, báo, không tự hoà (24 khoá): 21.3, 25.3, 29.3, 33.3, 37.3, 41.3, 45.3, 49.3, 53.3, 57.3, 61.3, 65.2 và 22.10, 26.5, 30.5, 34.5, 38.5, 42.5, 46.5, 50.5, 54.9, 58.5, 62.5, 66.2.
  - 12 khoá `ettāvatāpi kho … saddhammaṁ.` cùng Pāli với 3.2, 10.3, 14.3, 69.3: ba khoá (3.2, 10.3, 69.3) cùng lời đầy đủ; 14.3 viết “…a noble disciple who … has come to the true teaching.” (Sujato nén bằng `…` nơi Pāli viết đủ).
    Bản lấp dùng lời đầy đủ của 3.2/10.3/69.3.
  - 12 khoá `sammādiṭṭhi …pe… sammāsamādhi.` cùng Pāli với 18.3 và 70.5: 18.3 là “right view … right immersion.” (một `…`), còn 70.5 là danh sách tám chi đầy đủ (Sujato mở rộng `…pe…`). Bản lấp dùng 18.3 để giữ
    dấu lược: Pāli `…pe…` ⇒ đúng một `…`. Đây là lựa chọn của người dịch.

  Dấu lược: các khoá nhóm B (10 khoá), nhóm C (11 khoá), nhóm D (12 khoá) có `…pe…` ở Pāli, bản lấp ghi đúng một `…` mỗi khoá (kiểm bằng máy: bốn dạng khớp). Lưu ý (tầng đã ghim, đo bằng máy, không sửa): Sujato tự thêm `…` nơi Pāli viết đủ ở 28 khoá
  (13.1, 13.2, 14.3, 20.1, 20.2, 21.2, 22.9, 25.2, 26.4, 30.4, 33.2, 34.4, 37.2, 38.4, 41.2, 42.4, 45.2, 46.4, 49.2, 50.4, 53.2, 54.8, 57.2, 58.4, 61.2, 62.4, 65.1, 66.1) và bỏ `…` nơi Pāli có `…pe…` ở 12 khoá
  (24.2, 28.2, 32.2, 36.2, 40.2, 44.2, 48.2, 52.2, 56.2, 60.2, 64.2, 70.5).

