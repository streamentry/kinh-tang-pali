  người đọc sẽ thấy `19.5` và `19.7` liền nhau mà thiếu đúng vế “các vị không biết—”. Tổng số khoá tầng
  Anh đã ghim để trống ở bài này là 14 không tính `:0`; lát này lấp 11, còn 3 khoá nêu trên.

