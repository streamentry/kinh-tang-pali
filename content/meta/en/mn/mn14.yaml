  Đo lại con số (vì con số đã cho là 461, `BRIEF_VI4.md` §7 nói tin phép đo của mình): dưới
  `content/meta/sutta` có **474 tệp** chứa chuỗi `Muse Spark`; trong đó **439** dòng attribution ghi
  đúng `- "Muse Spark"`, thêm **10** dòng `- "Muse Spark 1.3 Free (agent)"`, **2** dòng `- "Muse Spark
  (adversarial re-audit 2026-09-11: rasa vi->huong vi)"`, **1** dòng `- "Muse Spark (adversarial
  re-audit 2026-09-11: nidana aligned to MN11)"` ⇒ 452 dòng attribution. Con số **461 không khớp với
  phép đo nào**; số đúng quan trọng hơn số đã nói.

  **Phân loại 11 khoá (đo bằng `eng/_e15_class.py`): A y nguyên từng chữ = 1 · B dựng lại = 9 ·
  C tự dịch = 1.**
  · **A (1):** `2.5` = `2.3` (Pāli `‘lobho cittassa upakkileso, doso cittassa upakkileso, moho cittassa
    upakkileso’ti.` **giống nhau từng chữ**; bản lấp lấy nguyên văn lời `2.3`).
  · **B (9):** `19.2` (0,79 với `18.3`) · `19.3` (0,71 với `18.3`) · `19.4` (0,86 với `18.9`) ·
    `19.5` (lõi y hệt `18.12`) · `19.7` (lõi y hệt `18.15`) · `20.4` (lõi y hệt `20.1`) ·
    `20.5` và `20.9` (lõi y hệt `20.2`) · `21.24` (0,77 với `0.2`).
    Nhóm `19.2`–`19.7` là **Đức Phật chép lại chính năm câu hỏi** của `18.2`–`18.15` đã ghim rồi nói
    thẳng là các vị **không biết**; vì vậy phải dùng lại đúng lời đã ghim, chỉ đổi dấu `?` thành `—` và
    thêm vế `na jānātha`. Nhóm `20.4`/`20.5` là **các tu sĩ tự trích lại** lời của chính họ ở `20.1`/
    `20.2`, nên lấy nguyên văn và **giữ đúng dấu nháy theo Pāli của từng khoá**: `20.4` mở `“` (Pāli mở
    `“`), `20.5` đóng `”` (Pāli đóng `”`), `20.9` không có dấu (Pāli không có dấu). Ba khoá này lệch
    đúng **một** dấu so với lời đã ghim ở `20.1`/`20.2`, và lý do là nguồn.
  · **C (1):** `2.4`.

  **`2.4` — khoá tự dịch duy nhất, và là chỗ phải phán đoán.** Pāli `Evañcāhaṁ, bhante, bhagavatā
  dhammaṁ desitaṁ ājānāmi:`. Lớp lấp dịch “And I have understood, sir, the Dhamma taught by the Blessed
  One like this: ”. Căn cứ từng từ, tất cả đều là lời đã ghim trong bài: `ājānāmi` → “I have
  understood” (`2.2`), `bhante` → “sir” (`2.2`), `bhagavā` → “Blessed One” (quy ước của tầng ghim, ví dụ
  `dn6:1.7`), `dhammaṁ desitaṁ` → “the Dhamma taught by”, `evaṁ` → “like this” (`2.2`). Bất định ghi
  thẳng: Pāli ở `2.2` là `bhagavatā evaṁ dhammaṁ desitaṁ` (Sujato dịch “your teaching”), còn ở `2.4`
  là `bhagavatā dhammaṁ desitaṁ` — vế từ xác định “của Đức Phật” không có ở đây, nên lớp lấp giữ nó
  thay vì theo khuôn “your teaching”. Đây là mối lo ngại thật: `2.4` và `2.5` lặp lại `2.2`/`2.3` nhưng
  người đọc không thấy `your` ở `2.4`; ghi ra đây, không che.

  **`21.24` — colophon, chỗ không có tiền lệ nào để bám, ghi thẳng.** Pāli `Cūḷadukkhakkhandhasuttaṁ
  niṭṭhataṁ catutthaṁ.`. Đo trên **toàn bộ** tầng Anh đã ghim: **0** khoá nào có Pāli chứa `niṭṭhataṁ`
  mà vẫn được dịch — tức là **colophon mức bài kinh không được tầng đã ghim dịch ở đâu cả**; và trong lớp
  lấp English đã có của kho cũng **0** khoá nào là colophon. Vì vậy đây là câu do lớp lấp tự dựng. Lớp
  lấp theo đúng hình thức colophon mà tầng đã ghim **có** dùng cho cấp sách và cấp phẩm: `dn34:2.4.11`
  “The Long Discourses are complete.”, `mn152:20.7` “The Middle Discourses are complete.”,
  `an9.113-432:1.28` “The Book of the Nines is finished.”, `dn22:17.4` “The first recitation section is
  complete.”; lấy tiêu đề từ `0.2` đã ghim: “The Shorter Discourse on the Mass of Suffering”. Bất định:
  cụm `niṭṭhataṁ catutthaṁ` có thể là “…kết thúc, bài thứ tư” nhưng chỗ này không có mệnh đề chủ ngữ,
  lớp lấp chọn cách đặt hai vế thành hai câu. Bản Việt canonical ghi “Tiểu Kinh Khổ Uẩn, bài thứ tư,
  kết thúc.”

  **Ngoặc kép:** `2.5` cân 1/1 (đếm bỏ dấu nháy đơn kiểu apostrophe); `20.4` 1/0, `20.5` 0/1, `20.9` 0/0 —
  khớp Pāli từng khoá; `2.4`, `19.2`–`19.5`, `19.7`, `21.24` không có ngoặc ở cả hai phía.

  **Dấu lược:** không khoá nào trong 11 khoá này chứa `…` (đo bằng script), nên tổng dấu lược của bản
  lấp bài này bằng **0**. Bài có `…pe…` ở `6.5`, `21.6` nhưng các khoá đó đã ghim hoặc dưới ngưỡng.

  **Một lệch của tầng đã ghim mà người đọc sẽ thấy, nói thẳng vì lớp lấp không sửa được.** Pāli của
  khoá `20.8` **đã ghim** chứa **hai** vế: vế tự thú `Addhāvuso gotama, amhehi sahasā appaṭisaṅkhā vācā
  bhāsitā,` rồi tới `na kho, āvuso gotama, sukhena sukhaṁ adhigantabbaṁ, dukkhena kho sukhaṁ
  adhigantabbaṁ;`. Lời đã ghim ở `20.8` chỉ dịch vế **thứ nhất**. Vế thứ hai đó đúng bằng vế mà bản lấp
  `20.4` vừa dựng lại, và lớp lấp đã dựng nó **ở đúng chỗ Pāli của nó** (`20.4`), không nhân bản vào
  `20.9`. Hệ quả: ở lần thứ hai các tu sĩ nói lại, người đọc sẽ thấy thiếu vế “Reverend Gotama,
  pleasure is not gained through pleasure; pleasure is gained through pain.” Lớp lấp không bịa thêm vào
  `20.9` vì Pāli của `20.9` không có vế ấy. Bản Việt canonical gộp cả hai vào một khoá, nên đây là
  chỗ lớp lấp **không** bám theo bản Việt — và đó là đúng, vì Pāli là authority.

  **Ba khoá trống còn lại, đều dưới ngưỡng 40 ký tự nên `coverage` không tính và lát này không lấp:**
