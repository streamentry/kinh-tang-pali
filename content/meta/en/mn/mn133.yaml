notes: |-
  **Phân loại 86 khoá (đo bằng máy trên Pāli root và tầng Sujato đã ghim): A dùng lại nguyên văn = 50 · B dựng lại = 28 · C tự dịch = 3 · D báo = 5.** A gồm cả khoá lặp nguyên văn một khoá lấp trước đó trong cùng bài; B là Pāli gần (tỉ lệ khớp từ 0,6) một khoá đã có lời, chỉ chèn phần tầng ghim nuốt mất; D là Pāli trùng nguyên văn với khoá đã ghim nhưng lời đã ghim khác nhau, hoặc lớp lấp cố ý lệch (nêu từng khoá bên dưới).

  **Cấu trúc của bài:** lời thiên nữ (2.x), Samiddhi kể lại cho Đức Phật (3.x–4.x), bài kệ (5.x), các tỳ-kheo kể lại cho Mahākaccāna (7.x), bài giải của Mahākaccāna (12.x–19.x) và các tỳ-kheo kể lại với Đức Phật (20.x). Cùng một đoạn Pāli lặp ở nhiều nơi với nháy khác nhau (kép / đơn) và người nói khác nhau; tầng ghim đã nuốt nhiều khoá lặp vào khoá trước hoặc sau.
  **A (50 khoá, dùng lại nguyên văn):** (i) 4.9, 4.10, 4.11, 4.14 (từ 2.9–2.11, 2.14, lời thiên nữ); (ii) 7.4–7.18, 7.29, 7.30, 7.35, 7.36, 19.4, 19.5, 20.5, 20.6 (các dòng kệ, từ 5.2–5.16 và 12.4, 12.5); (iii) 20.9–20.24 (bài kệ trọn, từ 5.1–5.16); (iv) 20.27–20.29 lặp lại 8.3–8.5, và bốn khoá `…pe…` (7.34, 12.3, 19.3, 20.4) lặp lại 7.28.
  **B (28 khoá), tách theo nhóm:**
  · **3.2–3.5 (B 0,84 / 0,99 / 0,89 / 1,0, nguồn 1.3, 1.4, 1.5, 2.1).** Samiddhi kể lại sự việc ở ngôi thứ nhất: lấy lời 1.3–1.5 của tầng ghim và đổi ngôi (“Samiddhi” thành “I”, “went up to Samiddhi” thành “came up to me”, “said to Samiddhi” thành “said to me”). Tầng ghim ở 3.1 đã dồn nội dung này vào “told him what had happened”, nên đây là phần bị nuốt. 3.5 đóng nháy đơn khớp Pāli.
  · **4.2–4.8, 4.12, 4.13 (B 1,0 / 0,84, nguồn 2.1–2.8, 2.12, 2.13); 4.1 là C (`Evaṁ vutte, ahaṁ, bhante, taṁ devataṁ etadavocaṁ:`, tối đa 0,48 với khoá đã ghim), dịch “When this was said, sir, I said to that deity:”.** Samiddhi kể lại lời thiên nữ; Pāli giống 2.x chỉ khác nháy (nháy đơn thay cho nháy kép) và 4.1 / 4.13 thêm `bhante`. Lấy lời 2.x đã ghim và đặt nháy theo Pāli; **4.6 và 4.8** có `gāthāti` — Pāli thiếu nháy đóng — nên EN cũng không đóng.
  · **7.26, 7.31, 7.32, 20.2, 20.7, 20.8 (B 0,97 / 0,71 / 1,0, nguồn 7.1, 7.2, 12.1).** Các tỳ-kheo tả lại với Mahākaccāna và với Đức Phật; lấy khung 7.2 / 12.1 (“the Buddha gave this brief summary recital, then entered his dwelling without explaining the meaning in detail”), thêm “Reverend Kaccāna” (7.26, 7.31) hoặc “sir” (20.2, 20.7) theo vocative của Pāli.
  · **8.1–8.5 và 20.25–20.30 (B 0,62–1,0, nguồn 7.19–7.24).** Câu hỏi “Who can explain in detail the meaning of this brief summary given by the Buddha?” và ba câu “ayaṁ kho āyasmā mahākaccāno …” đã ghim ở 7.19–7.23; lớp lấp lấy nguyên lời đó với nháy đơn khớp Pāli. **8.1** có `vibhajeyyāti` (thiếu nháy đóng ở Pāli) nên EN cũng không đóng.
  · **19.6 (B, 1,0, nguồn 12.6).** “This is how I understand the detailed meaning of this brief summary recital given by the Buddha.” Tầng ghim đã đưa chính câu này vào 19.1 (“This is how I understand … of that brief summary recital …”); lớp lấp dùng cách dịch của 12.6 (cùng Pāli) và đồng ý với 19.1.
  · **21.6 (B, 0,75).** “Mahākaccāna and One Fine Night is finished—the third.”
  **C (3 khoá): 4.1, 7.28 và 8.2.** 7.28 là `…pe…` lược giữa bài kệ (một `…`); 8.2 “Then, Reverend Kaccāna, we thought:” tự dịch theo giọng 7.20. Bốn khoá `…pe…` còn lại (7.34, 12.3, 19.3, 20.4) giống 7.28 nên mang cùng lời.
  **D (5 khoá): 7.3, 7.27, 7.33, 19.2, 20.3 (`‘Atītaṁ nānvāgameyya,`).** Pāli trùng nguyên văn với 12.2, mà tầng ghim dịch 12.2 là “‘Don’t run back to the past …” — thêm `…` mà Pāli viết đủ (không có dấu lược). Lớp lấp bỏ `…` thừa: “‘Don’t run back to the past,”. Đây là cố ý lệch (luật: lớp lấp sửa dấu lược thừa của tầng ghim, không sao chép), và 12.2 vẫn còn lỗi ở tầng ghim (ngoài lát).

  Dấu lược: 5 khoá lớp lấp có `…` (7.28, 7.34, 12.3, 19.3, 20.4), khớp Pāli. Tầng ghim có 2 khoá thừa `…` (7.2, 12.2) — ngoài lát, chỉ báo. Nháy: khớp Pāli ở cả 86 khoá.

  **Khoá còn trống:** 0 trong 86 khoá `fillableSegments` (đã lấp hết; đo bằng máy: không còn khoá Pāli nào của bài thiếu cả tầng Sujato lẫn lớp lấp). **Coverage** (Pāli ≥ 40 ký tự, bỏ khối `:0`): trước 94/128 = 0.7344; sau khi `published` 128/128 = 1.0000. Độ nhạy: ngưỡng 0,8 cho phép thiếu tối đa 25 khoá có nội dung (phần nguyên của 0,2 × 128); trước lát bài thiếu 34. `content/meta/reference-gaps.yaml` **có** record của `mn/mn133` (substantiveSegments 128, substantiveWithoutEnglish 34, coverage 0.7344). Khi lớp lấp `published` coverage lên 1,0 nên record đó thành thừa; người điều phối sinh lại bằng `npm run reference:gaps`, lát này không sửa tay tệp đó.

  **Triangulation 7.7.** Bản Việt canonical của bài (`content/meta/sutta/mn/mn133.yaml`) do cùng họ công cụ làm, rà soát hoặc chấm với lớp lấp (đối chiếu `translators` / `assessed_by` / `reviewers` với `source/tooling.yaml`), nên lớp lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English của lớp này. Đối chiếu thực có: Pāli root + tầng Sujato đã ghim (146/232 khoá có lời) + bản Việt canonical để đối chiếu nghĩa (không dịch vòng, không chép). Không có bản Anh độc lập nào cho 86 khoá lớp lấp, nên chấm không quá 8,0.

  **technical_integrity 9.6:** không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối. Không đặt blocker vì chưa chạy.
