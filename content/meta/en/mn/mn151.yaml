notes: |-
  Phân loại 30 khoá (đo bằng máy, Pāli chuẩn hoá bỏ dấu câu, so với mọi khoá Sujato có chữ trong bài):
  A 15 · B 12 · C 3 · D 0. Các cụm Pāli trùng nhau giữa chính những khoá cần lấp cũng giữ cùng một lời (kiểm bằng máy):
  13.3 = 14.3 = 15.3 = 16.3 = 17.3; 13.5 = 14.5 = 15.5 = 16.5 = 17.5; 14.1 = 15.1 = 16.1 = 17.1 = 18.1.

  Nhóm A, dùng lại lời Sujato (15 khoá), nguyên văn:
  - x.1 (14.1, 15.1, 16.1, 17.1, 18.1) ← 4-8.1, 9.1, 10.1, 11.1, 12.1, 13.1, 19.1, 20.1 (“Furthermore, a mendicant should
    reflect:”).
  - x.3 (13.3 … 17.3) ← 3.4, 4-8.7, 9.3, 10.3, 11.3, 12.3, 18.3, 19.3, 20.3 (“Suppose that, upon checking, a mendicant knows
    that”); x.5 (13.5 … 17.5) ← 3.6, 4-8.9, 9.5, 10.5, 11.5, 12.5, 18.5, 19.5, 20.5 (“But suppose that, upon checking, a mendicant
    knows that”). Các nguồn đều có cùng một lời Sujato, nên không có khoá nhóm D.

  Nhóm B, dựng lại từ khoá gần trùng (12 khoá):
  - x.4 và x.6 của các khoản 13–17 (10 khoá). Nguồn: 13.4 ← 12.4 (0,83), 13.6 ← 12.6 (0,93), 14.4 ← 12.4 (0,83),
    14.6 ← 12.6 (0,93), 15.4 ← 11.4 (0,64), 15.6 ← 11.6 (0,85), 16.4 ← 9.4 (0,67), 16.6 ← 9.6 (0,86), 17.4 ← 12.4 (0,67),
    17.6 ← 12.6 (0,86). Phần Sujato nuốt: ở các khoá nguồn Sujato viết “them”/“it” thay danh từ, vì danh từ đã nằm trong
    câu hỏi ở khoá `x.2`. Ở 13–17 chính khoá `x.2` của Sujato lại bị gộp thành mạch dài kết thúc bằng `…` (13.2 “‘Have I developed
    the four right efforts …”, 14.2 “the four bases of psychic power …”, …), nên “them” sẽ không chỉ rõ cái gì. Bản lấp chèn lại
    danh từ mà Pāli ghi trong chính khoá: “the four right efforts” (13), “the four bases of psychic power” (14), “the five
    faculties” (15), “the five powers” (16), “the seven awakening factors” (17), theo từng chữ của `x.2` Sujato; phần còn lại giữ đúng
    mẫu của Sujato (“they haven’t developed …, they should make an effort to do so.” / “they have developed …, they should
    meditate with rapture and joy, training day and night in skillful qualities.”).
  - 21.2 và 21.3 ← 21.1 (0,78): Sujato đã dồn cả ba thì (quá khứ, tương lai, hiện tại) vào 21.1 (“Whether in the past, future, or
    present, all those who purify their almsfood do so by continually checking in this way.”). Bản lấp tách đúng Pāli: 21.2 =
    `anāgatamaddhānaṁ … parisodhessanti` (tương lai), 21.3 = `etarahi … parisodhenti` (hiện tại), mỗi khoá dùng lại
    “continually checking in this way” của 21.1, và chèn lại “ascetics or brahmins” (`samaṇā vā brāhmaṇā vā`), mà Sujato bỏ.
    Hệ quả của tầng ghim hiện ra thay vì giấu: người đọc gặp ba thì hai lần (21.1 gộp, 21.2–21.3 tách).

  Nhóm C, tự dịch từ Pāli (3 khoá):
  - 2.7 `suññatā.`: phần cuối của `yadidaṁ—` ở 2.6, mà Sujato dồn vào 2.6 (“For emptiness is the meditation of a great man.”).
    Bản lấp ghi “Namely, emptiness.” (từ `yadidaṁ` mà 2.6 để mở), để khoá không mồ côi.
  - 21.5 `evañhi vo, sāriputta, sikkhitabban”ti.`: Sujato đã gộp nó vào 21.4 (“you should all train like this: ‘We shall purify our
    almsfood by continually checking.’”), kể cả nháy kép đóng. Bản lấp ghi “That is how you should train, Sāriputta.”” với nháy kép
    đóng của Pāli; nên bài có hai nháy kép đóng liên tiếp (một ở 21.4 của Sujato, một ở 21.5 của bản lấp): hệ quả của tầng ghim.
  - 21.8 dòng kết bài theo khuôn các bài Trung Bộ đã lấp, tên bài theo 0.2 của Sujato.

  Nháy ở 10 khoá x.4/x.6: Pāli mỗi khoá có một cặp nháy đơn (`‘abhāvitā kho me …’ti`); lời Sujato ở các khoá nguồn (9.4, 10.4, 11.4,
  12.4, 18.4, 19.4, 20.4 và các x.6 tương ứng) dùng lời gián tiếp, không nháy (đã ghép với “Suppose that, upon checking, a mendicant
  knows that” ở khoá x.3). Đo: Pāli (đơn mở 1, đơn đóng 1); bản lấp (0, 0). Đây là chỗ lệch có lý do duy nhất: giữ quy ước của
  Sujato để các khoá x.3, x.4, x.5, x.6 cùng một câu văn.

  Dấu lược `…`: Pāli của 30 khoá không có `…` và bản lấp không thêm. Lưu ý (tầng đã ghim, đo bằng máy, không sửa): Sujato tự thêm `…` ở
  13.2, 14.2, 15.2, 16.2 và 17.2 nơi Pāli viết đủ (5 khoá).

  Số khoá trống còn lại: 0 (30/30 khoá `fillableSegments` đã lấp, trong đó 2 khoá không vào coverage vì dưới 40 ký tự Pāli).

