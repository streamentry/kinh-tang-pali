notes: |-
    Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược. `mn89` có **12** khoá để trống; lát này
    được giao 7.

    **Sáu khoá trong bảy: Pāli trùng nguyên văn với `14.3`–`14.11` đã ghim, nên chép nguyên văn.**
    `mn89` kể hai lần chuyện các vị Sát-đế-lợi lên kế hoạch đối đáp Đức Phật: lần đầu `14.2`–`14.13`
    (khattiya, đã ghim), lần sau `17.1`–`17.21` (samaṇa, phần lớn đã lược). Hai lần **cùng một bộ
    chiêu**, nên phải nghe y hệt:
    - `17.3` ← `14.3`: "‘So, gentlemen, that ascetic Gotama will come down to such-and-such village or
      town.’"
    - `17.5` ← `14.5`: "‘We’ll approach the ascetic Gotama and ask him this question."
    - `17.6` ← `14.6`: "If he answers like this, we’ll refute him like that;"
    - `17.7` ← `14.7`: "and if he answers like that, we’ll refute him like this.’"
    - `17.9` ← `14.9`: "he has come down"
    - `17.11` ← `14.11`: "The Buddha educates, encourages, fires up, and inspires them with a Dhamma
      talk."

    **`17.9` cố ý giữ nguyên văn dù đọc lên đứt — và đó là hệ quả của luật dùng lại, đã báo ở đây.**
    Tầng đã ghim đã **nén** `14.3` thành `14.9` thành "he has come down" (vì `14.8` đã ghim sẵn
    "When they hear that"). Ở cặp `17.8`/`17.9` thì `17.8` (`Te suṇanti:`) lại **để trống** và **không
    thuộc lát này**, nên lớp lấp chỉ có thể chép nguyên văn `14.9` — hoặc tự dịch lại thành một câu
    đầy đủ, tức là phá luật "Pāli trùng thì dùng lại lời đã có". Lớp lấp chọn chép nguyên văn, và
    **giao việc nối lại mạch ở `17.8` cho người điều phốn** (xem phần khoá còn trống bên dưới).
    **Hệ quả phải nói thẳng:** đây là khoá duy nhất trong 56 khoá của lát này mà số dấu nháy **không**
    khớp Pāli — Pāli `17.9` có hai dấu nháy đơn (`‘…’ti.`) còn bản lấp có **0**. Đây là hệ quả trung
    thực của việc chép nguyên văn một lời đã bị tầng ghim nén, **không** phải lỗi cân nháy; và nó tự
    biến mất ngay khi `17.8` được lấp. Nếu người điều phốn chọn dịch lại `17.9` thành câu đầy đủ thì
    phải sửa luôn ghi chú này.

    **Một khoá tự dịch: `13.6`** (`Tassa mayhaṁ, bhante, antarantarā kathaṁ opātenti.`) → "Yet they
    interrupt me." Vế `antarantarā kathaṁ opātenti` lấy nguyên văn từ `13.3` đã ghim ("Yet when I’m
    sitting in court they interrupt me."); Pāli khoá này bỏ hẳn mệnh đề `aḍḍakaraṇe nisinnassa`
    ("khi ngồi xử kiện") nên chỉ còn "Yet they interrupt me." `Tassa` ở đây là "nhưng/thế mà" — dùng
    "Yet" như `13.3`. `bhante` bị bỏ như Sujato đã bỏ ở `13.3` (đếm: `12.3`, `13.13` cũng bỏ).

    **Còn 5 khoá trống lấp được mà lát này không được giao — báo lại.**
    `17.2`, `17.4`, `17.8`, `17.10`, `21.9`.
    - `17.2` (`Te suṇanti:`) và `17.4` (`Te pañhaṁ abhisaṅkharonti:`) trùng nguyên văn `14.2` và
      `14.4` đã ghim ("They hear:" / "They formulate a question, thinking:") ⇒ lấy lại nguyên văn lời
      đã ghim. **`17.8` là khoá quan trọng**: nó là mắt xích nối `17.9` (xem trên), và cũng trùng
      nguyên văn `14.8`; điền nó là `17.9` đọc liền mạch ngay.
    - `17.10` (`Te yena bhagavā tenupasaṅkamanti.`) trùng nguyên văn `14.10` đã ghim ("they approach
      him.") ⇒ lấy lại nguyên văn lời đã ghim.
    - `21.9` = `Dhammacetiyasuttaṁ niṭṭhitaṁ navamaṁ.` — đo lại thì **37** ký tự, tức **dưới**
      ngưỡng 40, nên coverage **không** đo tới (lượt đầu lớp lấp đã ghi nhầm là 41 và "trên ngưỡng";
      đã sửa ở đây). `niṭṭhitaṁ <thứ tự>` không có tiền lệ trong tầng Anh đã ghim — đếm trên
      143.886 khoá, mọi cụm `…suttaṁ niṭṭhitaṁ …` đều để trống — nên khi lấp cần một quyết định
      biên tập riêng và nên thống nhất trên toàn tầng.

