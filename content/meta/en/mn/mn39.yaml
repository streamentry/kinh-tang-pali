notes: |-
  **Phân loại 32 khoá (đo bằng máy): A = 13 · B = 9 · C = 8 · D = 2.**

  **A — 13 khoá chép nguyên văn:** `5.4` `6.4` ← `4.4` (“Now, mendicants, you might think,”); `5.7` `6.7` `8.14`
  `9.7` `10.9` `11.6` ← `4.7`; `5.8` `6.8` `8.15` ← `4.8`; `6.1` `7.1` ← `5.1`.

  **D — 2 khoá, báo chứ không hoà: `5.6`, `6.6`.** Pāli trùng nguyên văn với năm khoá đã ghim (`4.6`, `7.6`,
  `8.13`, `9.6`, `11.5`; `10.8` chỉ khác một dấu phẩy), nhưng lời đã ghim **không đồng nhất**: `7.6` dịch đủ
  “This is sufficient; enough has been done. We have achieved the goal of life as an ascetic. There is nothing more
  to do.’ And you might rest content with just that much.”, còn `4.6` `8.13` `9.6` `10.8` `11.5` chỉ ghi “This is
  sufficient …’”. Pāli của `5.6`/`6.6` viết **đủ**, nên theo luật dấu lược lớp lấp không được chép `…`; lớp lấp
  dùng lời đầy đủ của `7.6` (lời duy nhất không lược). Năm khoá đã ghim kia **không** sửa — đây là bất nhất của
  tầng đã ghim, chỉ báo.

  **B — 9 khoá.** `5.3` `6.3` (0,92 với `4.3`): đổi “bodily” → “verbal”/“mental”, giữ nguyên phần còn lại; vế
  `evañhi vo … sikkhitabbaṁ` tầng đã ghim đã đưa lên đầu khoá trước (“You should train like this:” ở `5.2`, `4.2`).
  `5.5` (0,83 với `4.5`) và `6.5` (0,90 với `7.5`): dựng theo đúng khuôn liệt kê của `7.5` “our bodily, verbal, and
  mental behavior is pure”, cắt ở chỗ Pāli dừng. `9.8` `10.10` `11.7`: Pāli chỉ khác `3.6` một dấu phẩy → lời `3.6`
  nguyên văn. `14.6` (0,62 với `14.3`): đổi lời `14.3` sang ngôi thứ nhất (“I have paid off the original loan …”).
  `2.5` (máy xếp B, 0,73 với `3.2`): `Evañhi vo, bhikkhave, sikkhitabbaṁ.` đứng riêng → “That’s how you should
  train.”, đúng lời Sujato đã ghim cho câu Pāli này ở `mn21` (bảy chỗ).

  **C — 8 khoá.** Năm khoá suy nghĩ của người được giải thoát trong năm ví dụ (`14.5`, `14.11`, `14.16`, `14.21`,
  `14.26`+`14.27`) — tầng đã ghim viết “Thinking about this,” rồi nhảy thẳng tới “he’d be filled with joy”, bỏ cả lời
  suy nghĩ; lớp lấp dịch lời ấy ở ngôi thứ nhất, **dùng đúng chữ của chính các khoá kể** (`14.1`–`14.3`, `14.8`–`14.9`,
  `14.13`–`14.14`, `14.18`–`14.19`, `14.23`–`14.24`): “got into debt”, “gravely ill”, “safe and sound, with no loss of
  wealth”, “bondservant … indentured to another”, “desert road”. `21.8`: **đây là một chỗ gộp khoá thật** — lời đã
  ghim ở `21.7` đã chứa trọn nội dung `21.8` (“A person with clear eyes standing on the bank would see the clams
  …”); lớp lấp ghi lại đúng câu ấy cho `21.8` vì Pāli khoá đó có thật, nên người đọc sẽ thấy câu lặp hai lần — hệ
  quả của tầng đã ghim, không sửa `21.7`. `29.6` colophon “The Longer Discourse at Assapura is finished—the ninth.”

  **Nháy và dấu lược:** khớp Pāli ở cả 32 khoá; 0 dấu lược (Pāli của 32 khoá không có `…`). 4 khoá dưới ngưỡng 40
  ký tự (`2.5` `6.1` `7.1` `29.6`) vẫn lấp.

  **Cơ chế khoá trống (đo, không sửa):** dãy ≥ 4 khoá trống liên tiếp: 2 dãy / 14 khoá / 1.093 ký tự Pāli; nhóm
  dòng song song (ngưỡng 0,70): 23/32 khoá. Bài có 173 cặp khoá Pāli trùng nguyên văn.

  **Triangulation 8.0.** Scorecard Việt của bài (`content/meta/sutta/mn/mn39.yaml`) có
  `quality.assessed_by` trùng đúng alias của lớp lấp này (alias khai trong `source/tooling.yaml`), nên bản
  lấp **không** phải cách đọc English độc lập với bản Việt, và scorecard Việt của bài **không** được tuyên
  bố là đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root đã ghim + Sujato đã ghim (ở các khoá
  có chữ của chính bài) + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng). Không sửa tệp Việt hay
  metadata Việt.

  **technical_integrity 9.6.** Lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều phối. Đã tự kiểm
  bằng máy: JSON parse; mọi khoá thuộc tập khoá tầng Anh đã ghim để trống (không shadow); NFC; không khoá rỗng;
  khoá theo thứ tự Pāli; nháy kép/đơn và dấu lược so **từng khoá** với Pāli (`…pe…` tính là một `…`; `’` có
  chữ thường đứng ngay sau là dấu nhạt lượu, còn lại là nháy đóng).

  **Coverage và gap.** `mn/mn39` **không** có record trong `content/meta/reference-gaps.yaml`, nên không record nào thành thừa vì lát này. Coverage English (mẫu số = khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`):
  trước lớp lấp 131/159 = 0.8239; sau khi `published` 159/159 = **1,0000** (không còn khoá có nội dung
  nào trống). Độ nhạy: lớp lấp chỉ được tính khi `published`; nếu bài rơi về `review`/`draft` thì coverage quay về
  0.8239. Ở trạng thái `published`, phải mất 32 khoá có nội dung
  nữa mới rớt ngưỡng 0,8.
