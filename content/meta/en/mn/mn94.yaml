notes: |-
  Lát 602. Mười một khoá lấp, đúng mười một khoá tầng Anh đã ghim để trống (`fillableSegments`); 8 khoá có nội
  dung (≥ 40 ký tự), 3 khoá dưới ngưỡng (`32.7` `tiṁsāya yojanesu …`, `32.8` `cattārīsāya yojanesu …`, colophon
  `33.11`) vẫn lấp để bài liền mạch, không ảnh hưởng coverage.

  **Bốn nhóm khoá (đo bằng máy trên 203 khoá Pāli):** A **1** · B **1** · C **9** · D **0**.

  - **A — `7.6`**: Pāli trùng nguyên văn `5.7`; dùng lại nguyên văn lời đã ghim “They live without wishes in this
    very life, quenched, cooled, experiencing bliss, with self become divine.”
  - **B — `5.12`** (máy chỉ `7.9`, tỉ lệ 0,89; nguồn thật sự dùng là `6.8` + `5.6` + `5.7`): Pāli `5.12` là
    `5.6` + `5.7` ghép làm một vế trả lời. Lời đã ghim ở `5.9` và `5.13` tóm gọn cả `5.9`–`5.12` (“I don’t like the
    sound of the first three individuals … I only like the sound of the last individual”), nên khoá này bị nuốt.
    Lớp lấp dựng lại từ đúng cụm của `5.6`/`5.7` (“doesn’t mortify either themselves or others, committed to the
    practice of not mortifying themselves or others”, “live without wishes … with self become divine”).
  - **C — `5.10`, `5.11`**: hai vế giữa của câu trả lời bốn vế. Dịch từ Pāli theo đúng cụm đã ghim ở `5.4`/`5.5`
    (“mortifies others”, “committed to the practice of mortifying …”) và đúng “I don’t like the sound of” của `5.9`.
    Vì `5.9` đã ghim tóm gọn, người đọc cột English sẽ thấy ý “ba hạng đầu” xuất hiện hai lần — đó là hệ quả của
    tầng đã ghim, hiện ra thay vì giấu.
  - **C — `7.8`**: hai vế “đoàn người” lấy nguyên cụm đã ghim ở `7.3`/`7.4` (“being obsessed with jeweled
    earrings”, “has given up partner and children … and goes forth from the lay life to homelessness”). Nháy kép
    đóng `”` khớp Pāli (`pabbajitā”ti?`); lời đã ghim ở `7.7` cũng tự đóng `?”` dù Pāli `7.7` không đóng — ghi lại,
    không sửa.
  - **C — `32.6`–`32.10`**: chuỗi hai mươi/ba mươi/bốn mươi/năm mươi/trăm do-tuần. Lời đã ghim ở `32.5` đã gộp
    “ten leagues, or twenty, or even up to a hundred leagues away” vào một khoá, trong khi Pāli `32.5` chỉ nói mười
    do-tuần. Lớp lấp theo Pāli từng khoá, giữ đúng ba dấu lược `…` ở `32.6` `32.7` `32.8` (Pāli viết `…`, không
    `…pe…`); `32.9` `32.10` Pāli viết đủ nên không thêm `…`. “the perfected one, the fully awakened Buddha” lấy từ
    `32.3` đã ghim.
  - **C — `33.11`**: colophon theo khuôn các colophon đã lấp ở `mn` (“… is finished—the fourth.”), tên bài lấy
    từ `0.2` đã ghim (“With Ghoṭamukha”).

  **Dấu lược:** Pāli của 11 khoá có 3 dấu lược, lớp lấp 3. **Nháy:** 11/11 khoá khớp Pāli. **Cặp Pāli trùng
  toàn bài:** 12; khoá lấp có Pāli trùng khoá khác đều cùng lời (0 lệch).

  Grammar 9,3 và clarity 9,2 vì `5.10`–`5.12` và `32.6`–`32.10` lặp lại ý mà khoá đã ghim liền kề đã tóm gọn.

  **Coverage (đo bằng phép của `englishCoverageFor`: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước: 158/166
  = 0.9518. Sau khi lớp lấp `published`: 166/166 = 1.0. Độ nhạy: phải mất thêm 34
  khoá có nội dung nữa thì bài mới rớt dưới ngưỡng 0,8. Lớp lấp chỉ được tính khi `status: published`.
  `mn/mn94` **không** có record trong `content/meta/reference-gaps.yaml`, nên lát này không làm record nào thành thừa.

  **Hai cơ chế khoá trống ở tầng Anh đã ghim (đo, không sửa).** Cắt cụt dãy (≥ 4 khoá trống liên tiếp):
  1 dãy / 5 khoá / 389 ký tự Pāli (`32.6`–`32.10`). Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 9/11 khoá trống vào nhóm
  (kiểm `kết quả ≤ số khoá trống`: đạt).

  **Triangulation ≤ 8,0.** Scorecard Việt của bài (`content/meta/sutta/mn/mn94.yaml`) ghi `quality.assessed_by` là công cụ đã chấm lượt review đối kháng MN/DN — **cùng
  alias công cụ** với lớp lấp này (khai trong `source/tooling.yaml`). Vì vậy bản lấp **không phải** cách đọc
  English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá lấp.
  Không có bản Anh thứ hai; đối chiếu có: Pāli root + Sujato đã ghim (cho khoá anh em) + bản Việt canonical (chỉ
  để đối chiếu nghĩa, không dịch vòng, không chép).

  **technical_integrity 9,6.** Lát này không được chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh
  còn nợ: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Tự kiểm đã làm: JSON parse, mọi khoá
  thuộc `fillableSegments`, không khoá nào trùng khoá Sujato có chữ (0 shadow), NFC, không khoá rỗng, dấu lược
  khớp Pāli (`…pe…` = một `…`), nháy khớp Pāli từng khoá trừ các ngoại lệ ghi ở trên.
