notes: |-
  Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.

  **Bốn khoá dùng lại nguyên văn lời đã ghim (luật `sn11.24`), mỗi khoá kiểm bằng so khớp
  chứ không bằng mắt:**

  1. `2.13` — vế đầu **trùng nguyên văn** `2.2` (`‘acchariyaṁ, āvuso, abbhutaṁ, āvuso,
     tathāgatassa mahiddhikatā mahānubhāvatā`), chỉ khác ở dấu: Pāli `2.2` kết `mahānubhāvatā.`
     còn Pāli `2.13` kết `mahānubhāvatā,` vì nối tiếp. Vì vậy lớp lấp giữ nguyên lời `2.2` đã
     ghim ("It’s incredible, reverends, it’s amazing! The Realized One has such psychic power and
     might") và **đổi dấu `!` thành `,`**. Vế sau (`yatra hi nāma tathāgato atīte buddhe …`) lấy
     từ `dn14:1.13.3` đã ghim, vốn dịch đúng bộ vế này dài hơn: "…of the Buddhas of the past who
     have become fully quenched, cut off proliferation, cut off the course, finished off the cycle,
     and passed beyond all suffering". Lặp "cut off … cut off" là **cố ý**: đó là lời của tầng đã
     ghim, `mn123` không có chỗ nào khác để đối chiếu nên phải dùng lại nguyên văn.
     `yatra hi nāma` dịch bằng "for he is able to know that" chứ không dịch "namely" — cùng cách
     `dn14:1.13.3` đã dịch vế mở đầu tương ứng thành "For he is able to recollect …". `jānissati`
     ("sẽ biết") dịch "is able to know", không phải "recollect": `anussarati` mới là "recollect",
     và `mn123` không có nó.
  2. `2.14` — lõi `evaṁjaccā … evaṁvimuttā te bhagavanto ahesuṁ itipī’ti` **trùng nguyên văn**
     `dn14:1.13.4`, đã ghim: "Such is the birth, names, clans, conduct, teachings, wisdom,
     meditation, and freedom of those Blessed Ones." Lớp lấp lấy nguyên lõi ấy. Khác ở ngoặc:
     Pāli `mn123:2.14` **không mở** ngoặc (ngoặc trong đã đóng ở `itipī’ti` giữa khoá), trong khi
     Pāli `dn14:1.13.4` mở bằng `‘` và đóng hai ngoặc. Nên bản lấp không mở ngoặc, chỉ đóng `’` ở
     đúng chỗ Pāli đóng. Sáu dấu `…` của Pāli là dấu liệt kê, KHÔNG phải lược `…pe…`, nên liệt kê
     đủ tám mục như lời đã ghim — không nén.
     `Evaṁ vutte, bhante, āyasmā ānando amhe etadavoca:` dịch theo khuôn đã ghim ở `mn32:11.8`
     ("When I had spoken, Ānanda said to me:"), giữ `amhe` thành "to us"; `āyasmā ānando` → "Venerable
     Ānanda" theo chính bài này (`23.5` đã ghim "Venerable Ānanda").
  3. `2.15` và `2.16` — Pāli **trùng nguyên văn** `2.6` và `2.7`, chỉ khác ở loại ngoặc: `2.6` mở
     bằng `“`, `2.15` mở bằng `‘`; `2.7` đóng bằng `”ti`, `2.16` đóng bằng `’ti`. Lớp lấp lấy
     nguyên văn lời đã ghim rồi đổi đúng loại ngoặc theo Pāli:
     "‘The Realized Ones are incredible, reverends, and they have incredible qualities." /
     "They’re amazing, and they have amazing qualities.’"
  4. `2.17` — Pāli trùng `dn14:1.14.13` và `dn1:1.4.9` (khác đúng dấu phẩy/hằng). Lớp lấy nguyên
     văn "This was our conversation that was unfinished when the Buddha arrived." rồi bỏ ngoặc
     mở, vì Pāli `mn123:2.17` chỉ **đóng** ngoặc ngoài đã mở ở `2.11`. `no` → "our" là điểm khác
     với `dn14:1.2.7` ("This is the conversation that was unfinished"), nên lấy từ `1.4.9`/`1.14.13`
     chứ không lấy từ `1.2.7`.

  **`2.18`** dùng khuôn đã ghim của chính Pāli này: `Atha kho bhagavā āyasmantaṁ ānandaṁ
  āmantesi:` đã được dịch ở `an5.166:11.1`, `an6.29:3.1`, `an8.70:5.1`, `dn16:1.4.2`, `dn16:2.1.1`
  (thành "Then the Buddha said to Venerable Ānanda:"); giữ dấu hai chấm vì Pāli kết bằng `:`.

  **`23.8`** là dòng colophon, và khuôn của lớp lấp đã ổn định ở 6/8 chỗ: lấy **nguyên văn** tiêu đề
  bản Anh đã ghim ở `0.2` (`Acchariyaabbhutasutta` → "Incredible and Amazing"), rồi thêm
  " is finished—the Nth." (đối chiếu `mn107:17.5`, `mn117:38.6`, `mn136:21.4`, `mn137:28.5`,
  `mn147:9.14`, `mn150:7.6`). Tầng `name/` của SuttaCentral **im lặng** ở `mn123`
  (`mn-name:139.mn123` là chuỗi rỗng), nên không có nguồn tên thứ ba để cân; tiêu đề lấy từ
  chính bản Anh đã ghim là nguồn duy nhất có bằng chứng.

  **Ngoặc kép — kỳ vọng đọc tay từ Pāli, không đếm tự động.** Phép đếm không phân biệt được
  `itipī’ti` và `anuppatto”ti` (ngoặc đóng đứng ngay sau một chữ) với dấu luyến tiếng Anh `It’s`.
  Vì vậy bảng cân ngoặc được ghi tay trong script ghi file và in ra, để người đọc kiểm lại được:
  `2.13` 1/0 · `2.14` 0/1 · `2.15` 1/0 · `2.16` 0/1 · `2.17` 0/1 · `2.18` 0/0 · `23.8` 0/0.

  **Không khoá nào trong bảy khoá này mang `…pe…`**, nên tổng số dấu lược của lớp lấp bài này bằng 0.

  **Không có khoá trống nào khác ngoài lát này.** Bản Anh đã ghim để trống đúng 7 khoá có nội dung
  ở `mn123` và lát này lấp hết; không có khoá trống nào dưới ngưỡng 40 ký tự. Tổng số khoá có nội
  dung là 97. Tỉ lệ Anh **trước** lớp lấp là (97 − 7) / 97 = **0,9278**, **sau** lớp lấp `published` là
  **1,0000**.

  Không có bất định thuật ngữ nào đáng kể. Không blocker.

  `triangulation` hạ vì không có bản Anh độc lập: bản Anh đã ghim để trống đúng bảy khoá này.
  Lớp lấp mượn lời đã ghim của `mn123`, `dn1`, `dn14` và của các bài `an` cho hai công thức trình
  bày, nhưng đó chỉ là **cùng công thức đã có tiếng Anh**, không phải một bản Anh độc lập đối
  chiếu từng câu. Bản Việt chỉ dùng để đối chiếu nghĩa; người viết bản Việt của bài này
  (`GLM-5.3 Flash (ZCode)`) không phải người viết lớp lấp này. Bốn lệnh cổng còn lại **chưa** chạy
  vì lát này bị cấm: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
