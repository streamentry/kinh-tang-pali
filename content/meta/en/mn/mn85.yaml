notes: |-
  Phạm vi: 53 khoá lấp, là toàn bộ khoá Sujato để trống có Pāli (35 khoá có nội dung ≥ 40 ký tự; 18 khoá ngắn hơn: các đơn vị thời gian `…` ở khoản 59 và nhãn kết bài). Không còn khoá trống nào của bài ngoài danh sách.

  Bốn nhóm (đo bằng máy, Pāli chuẩn hoá): A=2 · B=15 · C=32 · D=4. Xử lý thực tế: 2 khoá dùng lại nguyên văn Sujato (51.18, 51.19); 4 khoá chép lại từ khoá lấp có Pāli trùng (18.12, 18.13 từ 17.2, 17.3; 59.26, 59.30 từ 59.16); 47 khoá viết mới. Đa số là C vì Sujato kể gộp ba đoạn: lời nhắn của Hoàng tử Bodhi (3.2 gộp 3.3), việc Sañjikāputta chuyển lời (4.1 gộp 4.2–4.5, 4.8 gộp 4.9–4.11) và các thời hạn của khoản 59.

  Nhóm B (khoá ← khoá nguồn gần nhất, tỉ lệ khớp Pāli): 4.5 ← 3.5 (0.8); 4.11 ← 3.5 (0.8); 5.5 ← 5.3 (0.67); 21.6 ← 21.4 (0.84); 22.6 ← 22.4 (0.84); 23.6 ← 23.4 (0.84); 24.6 ← 24.4 (0.84); 25.6 ← 25.4 (0.84); 30.3 ← 30.2 (0.78); 30.4 ← 30.2 (0.78); 59.14 ← 59.3 (0.75); 59.17 ← 59.13 (0.62); 59.27 ← 59.2 (0.62); 59.28 ← 59.3 (0.75); 61.3 ← 60.2 (0.75). Phần tầng ghim nuốt mà lớp lấp chèn lại: (a) 17.2/17.3, 18.12/18.13, 19.11/19.12: Sujato gộp “dù có hay không có cảm thọ đau đớn …” vào một câu `Regardless of whether or not they suffer …`; bản lấp tách hai vế đúng Pāli (`Opakkamikā cepi` · `No cepi …`) bằng cùng một cụm `painful, sharp, severe, acute feelings due to exertion` và đổi `incapable`/`capable` đúng theo `abhabbāva`/`bhabbāva`. (b) 21.6–25.6: câu `evameva kho me …` dựng đúng từ phần tả 21.4/22.4/23.4/24.4/25.4, theo khuôn đã có ở lớp lấp của mn100 (`Just the same, … when breathing through my mouth … was blocked, …`), đổi hô ngữ sang `Prince`. (c) 30.3, 30.4: tách đúng hai vế tương lai và hiện tại mà Sujato gộp vào 30.2, theo khuôn 27.3/27.4 của mn100. (d) 59.x: xem dưới.

  Nhóm D (Pāli trùng, lời Sujato khác nhau; không tự hoà): 51.17 (51.3/51.10 `The Realized One is Perfected, a fully awakened Buddha.` so với 52.4 có `‘` thừa): lấy 51.3/51.10; 59.15, 59.25, 59.29 (Sujato 59.4 `they could` so với 59.12 `when a mendicant with these five factors that support meditation has the Realized One as trainer, they could`): lấy lời đầy đủ của 59.12, đúng vị trí `Let alone … , when a mendicant …`.

  Chỗ cố ý lệch, kèm lý do: (1) 59.16/59.26/59.30 (`that supreme goal for which gentlemen rightly go forth from the lay life to homelessness—`) và 59.17/59.27/59.31 (`the culmination of the spiritual path—realize it with their own insight in this very life and live having achieved it, in six months …`) dựng từ 59.2 và 51.5 của Sujato; cách cắt khoá của Pāli (`tadanuttaraṁ—` | `brahmacariyapariyosānaṁ …`) đặt câu quan hệ lên trước động từ nên bản English là các mảnh nối, không phải câu độc lập. (2) `rattindivāni` dịch `days` (Sujato 59.36 dùng `one day` cho `ekaṁ rattindivaṁ`), không phải `days and nights`. (3) 59.6–59.9, 59.17–59.22, 59.31–59.35: Pāli có `…` trực tiếp (không phải `…pe…`), giữ đúng một `…`. (4) 4.3/4.9: ngôi thứ ba (`Prince Bodhi bows … and asks if he is …`), vì lời nhắn đã chuyển sang lời kể lại. (5) 61.3: `‘Oh, the Buddha! … teaching!’ is what he says,` để nối với 61.4 do Sujato đã ghim. (6) 4.11: bắt đầu bằng chữ thường (`may the worthy Gotama …’`) vì khoá liền trước kết bằng dấu gạch.

  Quan sát tầng ghim (ngoài lát, không sửa): Sujato tự thêm `…` ở 3 khoá mà Pāli viết đủ (51.14, 51.16, 51.21) và thay `…` của Pāli bằng dấu phẩy ở 59.5.

  Nháy: đo từng khoá, khớp Pāli ở mọi khoá.

  Coverage (≥ 40 ký tự, bỏ khối `:0`): trước 347/382 = 0.9084; sau (khi `published`) 382/382 = 1.0000. Độ nhạy: có thể thiếu tối đa 76 khoá có nội dung mà vẫn ≥ 0,80. Bài không có record trong `content/meta/reference-gaps.yaml` (đã trên ngưỡng), nên lớp lấp không tạo record thừa. Số khoá trống còn lại sau lớp lấp: 0.

  Triangulation 8.0: `content/meta/sutta/mn/mn85.yaml` (bản Việt) ghi cùng họ công cụ với lớp lấp này (khai trong `reviewers`/`quality.assessed_by`, đối chiếu `source/tooling.yaml`), nên bản lấp KHÔNG phải cách đọc English độc lập, và scorecard tiếng Việt của bài này không được tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu có thật: Pāli root + Sujato đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Không chạm tầng Việt.

