notes: |-
  **Phân loại 60 khoá (đo bằng máy): A = 2 · B = 27 · C = 31 · D = 0.**

  **Cơ chế:** hai đoạn liệt kê mười sáu cấu uế của tâm (`4.1`–`4.31` từ bỏ; `5.1`–`5.31` đã từ bỏ). Tầng đã ghim
  dịch mục đầu, viết `4.2` “A mendicant who understands that ill will …” rồi nhảy tới mục cuối `4.30` “negligence is
  a corruption of the mind gives it up.”; ở đoạn sau, `5.1`+`5.2` tóm cả đoạn (“When they have understood these
  corruptions of the mind for what they are, and have given them up,”). Đo: 2 dãy ≥ 4 khoá trống liên tiếp / 56
  khoá / 2.318 ký tự Pāli; nhóm dòng song song (ngưỡng 0,70): 59/60 khoá.

  **Khuôn lấp (57 khoá của hai đoạn liệt kê).** Mỗi mục Pāli tách làm hai khoá, lớp lấp giữ đúng ranh giới ấy:
  - `‘X cittassa upakkileso’ti—` (B, 26 khoá, máy đo 0,67 với `4.2`; khoá thứ 27 cùng dạng là `5.30`, máy xếp A — xem dưới) → “‘X is a corruption of the mind’—”, nháy
    đơn đúng Pāli;
  - `iti viditvā Xṁ cittassa upakkilesaṁ pajahati;` (C, 15 khoá `4.3`–`4.31`) → “understanding this, they give up
    X, a corruption of the mind;”;
  - `iti viditvā X cittassa upakkileso pahīno hoti;` (C, 15 khoá `5.3`–`5.31`) → “understanding this, X, a
    corruption of the mind, has been given up;” — giữ thể bị động của Pāli, khác với `pajahati` ở đoạn trước.
  Tên mười lăm cấu uế lấy **đúng** danh sách tầng đã ghim ở `3.2`: ill will, anger, acrimony, disdain, contempt,
  jealousy, stinginess, deceit, deviousness, obstinacy, aggression, conceit, arrogance, vanity, negligence. Dấu
  chấm phẩy theo Pāli; khoá cuối mỗi đoạn (`4.31`, `5.31`) kết bằng dấu chấm như Pāli.

  **Một khoá A cố ý không dùng lại: `5.30`.** Pāli `‘pamādo cittassa upakkileso’ti—` trùng nguyên văn `4.30`, nhưng
  lời đã ghim ở `4.30` (“negligence is a corruption of the mind gives it up.”) **đã nuốt động từ của `4.31`** — đó là
  một chỗ gộp khoá thật. Chép sang `5.30` sẽ đặt “gives it up” vào đoạn mà Pāli nói “đã được từ bỏ” (`pahīno hoti`),
  tức sai nghĩa. Lớp lấp dùng khuôn chung “‘Negligence is a corruption of the mind’—” như 13 khoá anh em của đoạn
  `5`. Đây là lệch có chủ đích với lời đã ghim của khoá Pāli trùng; `4.30` không sửa. Hệ quả nhỏ: `4.30`+`4.31`
  đọc lặp “gives it up / give up negligence”.

  **Hai khoá ngoài liệt kê:** `8.2` (B, 1,00 với `11.2`) và `10.2` (A, trùng `11.2`) → lời `11.2` nguyên văn (“When
  they’re joyful, rapture springs up …”). Tầng đã ghim gộp ba vòng Phật–Pháp–Tăng của `8.1`–`10.1` thành một câu,
  nên `8.2` chen giữa “Buddha …” và “the teaching …” — Pāli thật sự có chuỗi hỷ lạc ở vòng thứ nhất; giữ đúng Pāli.
  `22.5` colophon “The Simile of the Cloth is finished—the seventh.” (C).

  **Nháy và dấu lược:** khớp Pāli ở cả 60 khoá; 0 dấu lược. 28 khoá dưới ngưỡng 40 ký tự (27 khoá
  `‘X cittassa upakkileso’ti—` ở `4.4`–`4.28` và `5.4`–`5.30`, cùng `22.5`) — không vào coverage, nhưng phải lấp để
  mỗi mục còn đủ hai nửa. Bài có 17 cặp khoá Pāli trùng nguyên văn.

  `vietnamese_clarity` (ở lớp này là độ rõ của tiếng Anh) 9,0: các khoá mở bằng chữ thường vì Pāli là một câu dài
  nối bằng `—` và `;`, ghép với lời đã ghim cắt ngang ở `4.2` và `4.30` thì đọc không mượt.

  **Triangulation 8.0.** Scorecard Việt của bài (`content/meta/sutta/mn/mn7.yaml`) có
  `quality.assessed_by` trùng đúng alias của lớp lấp này (alias khai trong `source/tooling.yaml`), nên bản
  lấp **không** phải cách đọc English độc lập với bản Việt, và scorecard Việt của bài **không** được tuyên
  bố là đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root đã ghim + Sujato đã ghim (ở các khoá
  có chữ của chính bài) + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng). Không sửa tệp Việt hay
  metadata Việt.

  **technical_integrity 9.6.** Lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều phối. Đã tự kiểm
  bằng máy: JSON parse; mọi khoá thuộc tập khoá tầng Anh đã ghim để trống (không shadow); NFC; không khoá rỗng;
  khoá theo thứ tự Pāli; nháy kép/đơn và dấu lược so **từng khoá** với Pāli (`…pe…` tính là một `…`; `’` có
  chữ thường đứng ngay sau là dấu nhạt lượu, còn lại là nháy đóng).

  **Coverage và gap.** `mn/mn7` **có** record trong `content/meta/reference-gaps.yaml`; sau khi bản lấp `published`, record đó thành thừa — lát này **không** chạm tệp đó, để người điều phối chạy lại `npm run reference:gaps`. Coverage English (mẫu số = khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`):
  trước lớp lấp 44/76 = 0.5789; sau khi `published` 76/76 = **1,0000** (không còn khoá có nội dung
  nào trống). Độ nhạy: lớp lấp chỉ được tính khi `published`; nếu bài rơi về `review`/`draft` thì coverage quay về
  0.5789 — dưới ngưỡng 0,8. Ở trạng thái `published`, phải mất 16 khoá có nội dung
  nữa mới rớt ngưỡng 0,8.
