notes: >-
  Lần thứ hai Đức Thế Tôn từ chối; bản đã ghim chỉ gom về 3.11 là "And for a second time, the
  Buddha gave the same reply." Câu này phải ở thì hiện tại với chủ ngữ là Saṅgha, vì đó là
  lời từ chối chứ không phải lời xin — đọc sai ngôi thì hai bên đổi vai. Giữ "1,250 mendicants"
  và "devoted to the brahmins" như bản đã ghim đã dùng ở 3.7 và 3.9.
  
  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
