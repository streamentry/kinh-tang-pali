notes: |-
  **Phân loại 57 khoá (đo bằng máy, theo Pāli của từng khoá so với khoá có lời Sujato trong cùng bài):
  A = 31 · B = 21 · C = 1 · D = 4.** Bài kể lại cùng một chuyện ba lần (vua Maghadeva, con của vua, vua
  Nimi); tầng đã ghim dịch đủ lần đầu (4.1–6.2) rồi ở lần hai và lần ba viết “And all unfolded as in the case
  of his father.” (7.3) / “And all unfolded as before.” (16.7) và để trống phần còn lại. Pāli viết đủ cả ba
  lần, nên lớp lấp lấp đủ.

  **A (31 khoá) — dùng lại nguyên văn.** 8.2–8.12 và 16.15–16.23 = 4.10–4.20; 7.8, 16.12 = 4.7; 9.2, 9.4,
  9.5 và 17-19.2, 17-19.4, 17-19.5 = 5.2, 5.4, 5.5; 13.15, 15.8 = 13.3; 16.9 = 15.3 (“and said to him:” —
  giữ nguyên chữ thường đầu câu vì Pāli 16.9 trùng nguyên văn 15.3).

  **B (21 khoá) — dựng lại, chỉ đổi chủ thể.** 7.4, 16.8 từ 4.4 (0,97/0,92); 7.5 từ 4.5; 7.6+7.7 và
  16.10+16.11 từ 4.6 (Pāli tách `‘pātubhūtā … devadūtā;` / `dissanti … jātānī’ti.` thành hai khoá, tầng đã
  ghim để một khoá); 8.1, 16.14 từ 4.9; 9.1, 17-19.1 từ 5.1; 9.6, 17-19.6 từ 6.1 (0,96); 13.14, 15.7 và
  13.17, 15.10 từ 13.2/13.5 — Pāli chỉ khác nháy (`“…”` thay `‘…’` vì lời chư thiên được Sakka thuật lại),
  nên lời Sujato giữ nguyên, chỉ đổi nháy cho khớp Pāli; 16.24 từ 4.19, 16.25 từ 4.20. Phần tầng đã ghim
  nuốt mà lớp lấp chèn lại: ở 7.9 và 16.13 Pāli kể đủ việc nhổ tóc bạc bằng nhíp và đặt vào tay chắp, tầng
  đã ghim ở 4.8 rút thành “and he did as the king said”; lớp lấp dịch đủ theo Pāli, lấy chữ của 4.7
  (“carefully … with tweezers … cupped hands”). Danh xưng “King Maghadeva’s son” lấy của Sujato ở 7.1, 9.7.

  **D (4 khoá) — báo, không tự hòa tầng đã ghim.** (1) `Karuṇāsahagatena cetasā …` (9.3, 17-19.3): tầng đã
  ghim có hai lời — 5.3 “He meditated spreading a heart full of compassion …” và 11.1 “compassion …”. Lớp
  lấp lấy 5.3 vì 9.3/17-19.3 nói về **một** vị vua giống 5.3, còn 11.1 thuộc đoạn số nhiều. (2)
  `dhammaṁ carati …` (13.16, 15.9): Pāli trùng 3.2, 12.2 (Sujato thì quá khứ “treated”) và 13.4 (hiện tại
  “treats”). Lớp lấp lấy 13.4, vì 13.16/15.9 là lời chư thiên khen vua đang trị vì, đúng vị trí của 13.4.
  Hai nhóm D này là bất nhất sẵn có của tầng đã ghim; lớp lấp không sửa.

  **C (1 khoá).** 21.20 kết bài: “About King Maghadeva is finished—the third.”

  **Ngoặc (đo bằng máy).** Khớp Pāli 56/57. Lệch có chủ đích: 8.12 dùng nguyên văn A của 4.20, vốn có nháy
  kép lồng (“…”’) trong khi Pāli của cả hai khoá chỉ có `’ti`. Giữ A để khoá trùng Pāli có cùng lời; 16.25
  thì Pāli có `“…”’ti` nên khớp. **Dấu lược:** Pāli 4, lớp lấp 4.

  **Lỗ hổng của bộ đo.** 3 khoá có lời Sujato ngắn dưới 30% Pāli (`10.2`, `13.8`, `21.9`), tính là đã phủ.

  Triangulation 8,0: scorecard Việt của `mn83` ghi `quality.assessed_by` **trùng** alias của lớp lấp này
  (khai trong `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập, và scorecard Việt
  không được tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu có: Pāli root, Sujato đã ghim, bản Việt
  canonical (đủ khoá). Không chạm tầng Việt.

  technical_integrity 9,6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`
  trong lát này, nên không tuyên bố technical gate pass. Bốn lệnh còn lại cho người điều phối.

  Hệ quả với `content/meta/reference-gaps.yaml`: `mn/mn83` **có** record (dưới ngưỡng). Coverage trước
  99/138 = 0,7174; sau khi `published` 138/138 = 1,0000, nên record sẽ thành thừa — để người điều phối sinh
  lại tệp, lát này không chạm. Đã lấp đủ 57/57 khoá trống, trong đó 39 khoá có nội dung.
