notes: |-
  **Phân loại 120 khoá (đo bằng máy, so mọi khoá đã có lời Sujato, kể cả cửa sổ 2–4 khoá): A = 19 · B = 91 · C = 10 · D = 0.**

  **A (19):** `8.16` ← `8.2` (nguyên văn) và 18 khoá `evaṁ no ettha hoti—` (`18.9 … 18.48`, `21.9 … 21.49`) ← `18.4`/`18.53`/`21.4`/`21.54` “That’s how we see it.” — **giữ nguyên chữ, bỏ cặp ngoặc kép**: tầng ghim đặt câu này thành một lời đáp riêng có `“…”`, còn Pāli khoá này không có nháy và nằm **giữa** một câu đáp (`“X, bhante, Y; evaṁ no ettha hoti— X Y”ti`). Nếu giữ `“…”` thì mỗi bộ ba lấp đủ sẽ lệch nháy. Đây là chỗ hai luật (dùng lại nguyên văn / nháy khớp Pāli) xung đột; lớp lấp giữ chữ, theo nháy Pāli.

  **B (91) — ba nhóm:**
  1. `3.2–4.16` (lời các tỳ-kheo thuật lại cho Đức Phật): dựng từ `2.1`, `3.4–3.11` của tầng ghim (0,81–1,00); chỉ đổi ngôi (“we”, “us”), chèn “sir” cho `bhante`, “It seems”/“rumour” cho `kira`, và đổi tầng nháy theo Pāli (`4.8` Pāli `“…”’ti?` ⇒ lời Anh “…”?’). `3.12`, `4.10`, `4.15` dùng lại nguyên chữ `3.7` (“Indeed, reverends. …”).
  2. `8.17–8.21` ← `8.3–8.7` (Pāli chỉ khác dấu `;`/`,`/`.` và hoa đầu câu): nguyên văn. Tầng ghim ở `8.15` tự thêm `…` (Pāli viết đủ) rồi bỏ trống sáu thức; lớp lấp viết đủ, không mang `…`.
  3. Các khoá duyên khởi `18.x` (thuận) và `21.x` (diệt): câu điều kiện lấy nguyên từ tầng ghim của chính bài ở `19.4–19.14` (“X is a requirement for Y”, số nhiều cho “name and form”, “the six sense fields” như tầng ghim) và `20.1–20.11` (“When X ceases, Y ceases”); câu hỏi `…no vā, kathaṁ vā ettha hotī”ti?` dùng nguyên “Is that how you see this or not?”” của `18.2`/`18.51`/`21.2`/`21.52`.

  **C (10):** `4.9` (“When we said this, sir, Sāti said to us,”) và `4.16` (“Since we were unable to dissuade Sāti from his view, sir, we are reporting this matter to the Buddha.”) thuộc nhóm 1 nhưng tỉ lệ khớp dưới 0,80 (0,54 / 0,66), từ vựng lấy từ `4.1` của tầng ghim; `18.3`, `18.5`, `18.11`, `18.30`, `18.45`, `21.3`, `21.5` theo đo máy là C (0,59–0,79) nhưng dựng cùng khuôn với nhóm 3; colophon `41.14` (43 ký tự): “The Longer Discourse on the Ending of Craving is finished—the eighth.”

  **Cố ý lệch nháy Pāli — có lý do, đã đo:** 16 khoá `“X-paccayā Y-nti iti kho panetaṁ vuttaṁ;` (`18.11/16/20/25/30/35/40/45`, `21.11/16/21/26/31/36/41/46`): Pāli 1 `“`, lời lấp 1 `“` + 1 cặp `‘…’`. Theo quy ước của tầng ghim ở `18.1`, `18.6`, `18.50`, `21.1`, `21.6`, `21.51` (đều bọc mệnh đề trích lại bằng `‘…’`, “That’s what I said.”). Bỏ `‘…’` sẽ lệch với sáu khoá anh em trong bài. Mọi khoá khác (104/120) khớp Pāli từng khoá.

  **Pāli bất thường, giữ nguyên:** `21.32` kết `hotīti?` **không** có `”`, và `21.33` **không** mở `“` (mọi bộ khác đều có). Lời lấp `21.32`, `21.33` theo đúng Pāli (không nháy).

  **Dấu lược:** Pāli 120 khoá không có `…` nào; lớp lấp 0. (Tầng ghim tự thêm `…` ở `8.15`, `18.6`, `21.6`.)

  **Hệ quả dễ thấy:** `4.1` của tầng ghim tóm “told him what had happened”, nên đọc liền thấy toàn bộ lời thuật lại `4.2–4.16`; và ở `18.3–18.5`, `18.52–18.54`, `21.3–21.5`, `21.53–21.55` câu giữa là “That’s how we see it.” **có** ngoặc kép của tầng ghim, nên lời lấp hai bên trông như hai câu nói rời. Không sửa được mà không shadow.

  **Đo hai cơ chế khoá trống:** cắt cụt dãy = 4 dãy / 108 khoá / 5.927 ký tự Pāli; bỏ dòng song song = 10 nhóm / 91 khoá (≤ 120 khoá trống). 10 khoá tầng ghim có chữ nhưng ngắn hơn 35% Pāli (vd. `3.4`, `6.7`, `16.2`…) — dấu hiệu nén.

  **Coverage:** mẫu số 279; trước 215/279 = 0,7706 (**dưới ngưỡng**); sau khi `published` 279/279 = 1,0. Độ nhạy: mất thêm hơn 55 khoá mới rớt dưới 0,8. Bài **có** record trong `content/meta/reference-gaps.yaml`; sau khi `published` record thành thừa — **không** sửa tay, để người điều phối chạy lại `npm run reference:gaps`.

  Triangulation 8.0 (trần của luật): scorecard tiếng Việt của bài này (`content/meta/sutta/…`) ghi `quality.assessed_by` **trùng họ công cụ** với lớp lấp (alias khai trong `source/tooling.yaml`). Vì vậy bản lấp này **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English nhờ lớp lấp. Đối chiếu đã có: Pāli root (authority) + lời Sujato đã ghim của chính bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

  Tự kiểm bằng máy trước khi ghi: JSON parse; mọi khoá ⊆ `fillableSegments` của bài; không khoá nào trùng khoá tầng Sujato đã có chữ (0 shadow); NFC; không khoá rỗng; dấu lược đếm theo luật `…pe…` = đúng một `…` — khớp Pāli ở mọi khoá; nháy đếm theo luật `’` + chữ thường = dấu nháy lửng (apostrophe) tiếng Anh, còn lại là nháy đóng.

  technical_integrity 9.6: lát này không được chạy cổng kỹ thuật, nên **không** tuyên bố technical gate pass. Bốn lệnh còn nợ cho người điều phối: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Đây không phải blocker (cổng chặn ở validation failure, không chặn ở chưa chạy).
