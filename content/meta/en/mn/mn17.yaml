notes: |-
  Lớp lấp: 5 khoá (`5.4`, `24.7`, `24.8`, `25.7`, `25.8`) nằm ở phần bản Anh đã ghim đã lược.

  **Bẫn `sn11.24`: ba cặp Pāli trùng nguyên văn, đều lấy lại cách dịch đã có.**

  1. `5.4` (`‘ahaṁ kho imaṁ vanapatthaṁ upanissāya viharāmi.`) — vế mở đầu này cũng mở `3.5`,
     `4.5`, `6.5`, nơi bản đã ghim dịch "While living close by this jungle thicket,". Giữ y vậy,
     nhưng dừng ở dấu phẩy: vế còn lại của câu nằm ở `5.5`, thuộc lát khác, và Pāli khoá này
     không có `…pe…`.
  2. `24.7` và `25.7` là **nguyên văn bằng nhau và nguyên văn bằng `5.7`**. Bản đã ghim ở `5.7`
     (và `4.7`) dịch "But I didn’t go forth from the lay life to homelessness for the sake of a
     robe, almsfood, lodgings, or medicines and supplies for the sick." — tức đã **mở rộng** hai
     `…pe…` của Pāli. Lớp lấp không được mở rộng dấu lược, nên giữ nguyên lời đã ghim nhưng để
     hai chỗ lược còn nguyên:
     "But I didn’t go forth from the lay life to homelessness for the sake of a robe, not for the
     sake of almsfood … not for the sake of lodgings … not for the sake of medicines and supplies
     for the sick." Ba vế `na … na … na` được giữ thành ba vế phủ định, vì cụm "for the sake of a
     robe, almsfood, lodgings, or …" của bản đã ghim đã gộp mất ba lần phủ định. Đây là khác biệt
     **cố ý, có ghi**: hai khoá cùng Pāli mà hai lớp cho hai cách trình bày khác nhau, vì luật của
     tầng đã ghim và luật của tầng lấp khác nhau.
  3. `24.8` và `25.8` là hai vế `Atha ca pana me …` của phiên bản `puggala`. Bản đã ghim dịch vế
     mở đầu của chính câu đó ở `26.5` ("While living supported by this individual"), và dịch đủ
     bốn mệnh đề ở `3.2` ("my mind does not become immersed in samādhi, my defilements do not
     come to an end, and I do not arrive at the supreme sanctuary from the yoke"). Ghép hai nguồn
     đó, đổi `their` thành `I`/`my` vì ở đây tỳ-kheo tự nói.

  **Số ngoặc và dấu lược khớp Pāli từng khoá** (kiểm bằng harness, không ước lượng): `24.7` và
  `25.7` mỗi khoá đúng 2 đơn vị lược; `24.8`/`25.8` mỗi khoá đúng 1 ngoặc đóng, 0 ngoặc mở;
  `5.4` đúng 1 ngoặc mở, 0 ngoặc đóng.

  **Không khoá trùng Pāli nào bị bỏ sót:** `5.4` không trùng nguyên văn với khoá nào đã ghim
  (các khoá `3.5`/`4.5`/`6.5` gộp `ahaṁ kho … viharāmi.` vào vế sau bằng dấu chấm); `24.8`/`25.8`
  cũng không trùng nguyên văn với `23.x` hay với nhau.

  `triangulation` hạ vì không có bản Anh độc lập: `24.7`/`25.7` là bản sao chỉnh sửa của bản đã
  ghim ở `5.7`, `5.4`/`24.8`/`25.8` chỉ mượn lời đã ghim chứ không có bản Anh nào độc lập đối
  chiếu. Bản Việt chỉ để đối chiếu nghĩa; người viết bản Việt của bài này (`GPT-5.6 Sol`)
  không phải người viết lớp lấp này.