notes: |-
  **Phân loại 32 khoá (đo bằng máy trên Pāli root và tầng Sujato đã ghim): A dùng lại nguyên văn = 9 · B dựng lại = 10 · C tự dịch = 12 · D báo = 1.** A gồm cả khoá lặp nguyên văn một khoá lấp trước đó trong cùng bài; B là Pāli gần (tỉ lệ khớp từ 0,6) một khoá đã có lời, chỉ chèn phần tầng ghim nuốt mất; D là Pāli trùng nguyên văn với khoá đã ghim nhưng lời đã ghim khác nhau, hoặc lớp lấp cố ý lệch (nêu từng khoá bên dưới).

  **B (10 khoá), tách theo nhóm:**
  · **4.3, 4.6, 5.7, 5.10, 6.6 (B, 0,99–1,0, nguồn 3.4, 3.7); 6.3 lặp lại 4.3 (A).** Lời Māra nhắc lại lời Moggallāna “nikkhama, pāpima … Mā te ahosi dīgharattaṁ ahitāya dukkhāya”. Pāli chỉ khác khoá nguồn ở nháy (nháy kép `”ti` thành nháy đơn `’ti` hay `’”ti`). Lớp lấp lấy lời đã ghim (“Come out, Wicked One,” / “Don’t create lasting harm and suffering for yourself!”) và đặt nháy theo từng khoá Pāli. **5.10** có `dukkhāyāti` — Pāli ở đây thiếu nháy đóng — nên EN cũng không có nháy đóng (khớp từng khoá, không “sửa” Pāli).
  · **12.7, 17.2 (B, 1,0, nguồn 12.4 và 18.3 / 16.3).** Lời Māra Dūsī xúi các Bà-la-môn gia chủ. 12.4 và 16.3 đã dịch “Come, all of you, abuse… / honor, respect…” bằng nháy kép lồng; ở 12.7 và 17.2 Pāli dùng nháy đơn ở cấp một, nên lớp lấp dùng nháy đơn. **18.3** của tầng ghim dịch thành gián tiếp (“He told them to venerate you”); lớp lấp không theo vì 17.2 là Māra nói trực tiếp.
  · **12.8 (D) và 17.3 (B, 1,0, nguồn 16.4 / 18.4).** 12.8 trùng nguyên văn Pāli với 12.5, nhưng 12.5 mang nháy `”’` (nháy kép lồng) còn Pāli 12.8 chỉ có `’`; nên 12.8 lấy từng chữ lời 12.5 và bỏ `”` thừa. 17.3 cũng vậy, so với 16.4. Đây là cố ý lệch có lý do (khớp nháy theo Pāli từng khoá); 12.8 xếp vào D vì Pāli trùng nguyên văn mà lời khác một dấu nháy, còn 17.3 chỉ gần (khác `”’ti` / `’ti`) nên xếp B.
  · **13.4, 13.6, 13.8 (B, 0,99, nguồn 13.10).** Vế `evamevime muṇḍakā …` giống 13.10; tầng ghim kết 13.10 bằng `’` (Pāli `apajjhāyantī’ti`), còn 13.4, 13.6 và 13.8 kết bằng dấu chấm; lớp lấp bỏ nháy đóng. Nháy kép trong “We practice absorption meditation!” khớp Pāli.
  · **31.21 (B, 0,65)** “The Warning to Māra is finished—the tenth.” và **31.22 (C)** “The Shorter Chapter on Pairs is finished, the fifth.” (tầng ghim không có tên phẩm; dịch `Cūḷayamakavagga` sát nghĩa).
  **C (12 khoá): 32.0–32.4 và 33.0–33.5 (hai bài kệ mục lục).** Dịch theo khuôn an7.43 / an10.50 (“Its summary verse:”). Tên lấy từ tiêu đề đã ghim: mn1 (The Root of All Things), mn21 (The Simile of the Saw), mn32, mn41 (The People of Sālā) và mn41–mn50 cho bài kệ của phẩm; `sīhanādo` dịch “the Lion’s Roar”. Bài kệ thứ hai (33.x) liệt kê năm phẩm của Mūlapaṇṇāsaka, nên “The Root of All Things … and Sāleyya” là tên phẩm đặt theo bài đầu của mỗi phẩm. **Ghi nhận bất định:** (i) `tuṭṭhi` ở 32.1 dịch “Contentment”, không xác định được bài nào của phẩm ứng với chữ này từ tiêu đề đã ghim; (ii) `verañjaduve` dịch “Verañja, the two”, nghĩa của “the two” chưa xác định; (iii) `dasamo ca vaggo` ở 32.4 dịch sát nghĩa (“the tenth, the chapter”). Cả ba đều là chỗ lớp lấp không phân xử được và đã ghi nhận, nên hạ `ambiguity_integrity` xuống 9.0 và `semantic_fidelity` xuống 9.1.
  **A (9 khoá, dùng lại nguyên văn):** 4.4, 4.5, 5.8, 5.9, 6.4, 6.5 (từ 3.5, 3.6) và ba khoá lặp lại một khoá lấp trước (6.3 ← 4.3, 13.6 và 13.8 ← 13.4).

  Dấu lược: 0 khoá của lớp lấp có `…`. Tầng ghim có một `…` thừa ở 15.1 — ngoài lát, chỉ báo. Nháy: khớp Pāli ở cả 32 khoá.

  **Khoá còn trống:** 0 trong 32 khoá `fillableSegments` (đã lấp hết; đo bằng máy: không còn khoá Pāli nào của bài thiếu cả tầng Sujato lẫn lớp lấp). **Coverage** (Pāli ≥ 40 ký tự, bỏ khối `:0`): trước 83/96 = 0.8646; sau khi `published` 96/96 = 1.0000. Độ nhạy: ngưỡng 0,8 cho phép thiếu tối đa 19 khoá có nội dung (phần nguyên của 0,2 × 96); trước lát bài thiếu 13. `content/meta/reference-gaps.yaml` **không** có record của bài này (coverage trước đã ≥ 0,8), nên không có record nào thành thừa vì lát này.

  **Triangulation 7.8.** Bản Việt canonical của bài (`content/meta/sutta/mn/mn50.yaml`) do cùng họ công cụ làm, rà soát hoặc chấm với lớp lấp (đối chiếu `translators` / `assessed_by` / `reviewers` với `source/tooling.yaml`), nên lớp lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English của lớp này. Đối chiếu thực có: Pāli root + tầng Sujato đã ghim (207/239 khoá có lời) + bản Việt canonical để đối chiếu nghĩa (không dịch vòng, không chép). Không có bản Anh độc lập nào cho 32 khoá lớp lấp, nên chấm không quá 8,0.

  **technical_integrity 9.6:** không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối. Không đặt blocker vì chưa chạy.
