notes: |-
  **Phân loại 47 khoá (đo bằng máy): A = 14 · B = 29 · C = 4 · D = 0.** Đã ghi 47/47 khoá `fillableSegments`.

  **A (14):** `11.5` ← `4.4`; `16.9`–`16.19` ← `9.7`–`9.17` (bài ví dụ rương y của Sāriputta, nguyên văn, kể cả “At midday,” cụt của Sujato ở `9.8`/`9.12`/`9.16`); `16.24`, `16.25` ← `9.7`/`9.15`, `9.8`/`9.16`. Lưu ý: Sujato `16.8` và `16.23` tự kết bằng `…` dù Pāli viết đủ — dấu hiệu tầng ghim cắt cụt ngay trước dãy khoá lát này lấp.

  **B nhóm 1 — câu hỏi lặp “sal forest park … What kind of mendicant would grace this park?” (`5.4`/`5.5`, `6.4`/`6.5`, `7.4`/`7.5`, `8.4`/`8.5`, `12.4`/`12.5`, `13.3`, `14.4`, `15.4`), nguồn `4.5` (0,95–0,97) và `4.6` (0,90–0,95):** chỉ đổi hô ngữ theo người được hỏi (Revata, Anuruddha, Kassapa, Moggallāna) và nháy theo Pāli (`‘…’”` khi còn trong lời Sāriputta kể; `’` ở khối kể lại cho Đức Phật). Giữ đúng việc Sujato bỏ hô ngữ ở vế hỏi (`4.6`) để mọi vế hỏi giống nhau từng chữ.

  **B nhóm 2 — “… has answered according to his own inspiration / And now we ask you” (`12.2`, `12.3`, `13.2`, `14.2`, `14.3`, `15.2`, `15.3`), nguồn `5.2`–`8.3` (1,0) và `16.4`:** `12.3` theo `16.4` (“And now we ask you:”) vì Pāli kết bằng gạch ngang dẫn câu hỏi, không đóng nháy như `5.3`. `13.2`, `14.3`, `15.3` dừng đúng chỗ `…pe…` của Pāli: “‘Reverend Anuruddha, Revata has answered …”, “And now we ask you …”.

  **B nhóm 3 — tường thuật (`3.4`–`3.6` ← `2.2`–`2.4`; `6.8` ← `6.6`; `11.2`–`11.4` ← `4.1`–`4.3`; `11.15` ← `4.8`; `16.26` ← `9.9`):** đổi người (Revata thay Kassapa; “I” thay Sāriputta), chèn vế song song bị nuốt (`6.8` “In the same way, Reverend Sāriputta, a mendicant surveys …” — tầng ghim nhập ví dụ và kết luận vào `6.6`/`6.7`), thêm nháy đóng Pāli (`11.15`, `16.26`).

  **C (4):** `11.1` “Sir, Venerable Revata and Venerable Ānanda came to me to hear the teaching.”; `11.10` `anusayasamugghātāya.` ⇒ “in order to uproot the underlying tendencies.” (thực chất là mảnh cuối của `4.8`, lấy nguyên cụm Sujato; máy xếp C vì khoá chỉ một từ); `13.6` “Reverend Sāriputta, just as a person with clear eyes …” (theo `6.7`, một `…` cho `…pe…`); `17.10` colophon ⇒ “The Longer Discourse at Gosiṅga is finished—the second.”

  **Ngoặc và dấu lược:** 47/47 khoá khớp Pāli; 4 khoá `…pe…` ↔ 4 `…`. **Hệ quả đọc của tầng ghim (không sửa):** Sujato `5.3`, `6.3`, `7.3`, `8.3` đóng nháy (“And now we ask you the same question.”) ngay trước khoá hỏi mà lớp lấp mở `‘` theo Pāli; `10.6` tóm “how he had asked Ānanda:” rồi `11.6` mở `“‘` dù `11.1`–`11.5` (lớp lấp) đã mở nháy; `11.14` đóng `”` trước `11.15` (lớp lấp, Pāli đóng ở đây); `12.1`, `13.1`, `14.1`, `15.1` là câu tóm “Next I asked … the same question.” đứng trước bản đầy đủ của lớp lấp.

  Triangulation 8.0: scorecard Việt của `mn32` (`content/meta/sutta/mn/mn32.yaml`) ghi `quality.assessed_by` thuộc **cùng họ công cụ hỗ trợ** với lớp lấp này (đối chiếu `source/tooling.yaml`). Vì vậy bản lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không** được tuyên bố là đã đối chiếu English nhờ lớp lấp. Đối chiếu thật sự có: Pāli root đã ghim + Sujato đã ghim (mọi khoá có lời) + bản Việt canonical (chỉ để đối chiếu nghĩa, không dịch vòng, không chép câu).

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; bốn lệnh đó còn nợ, nên không tuyên bố technical gate pass. Không đặt blocker vì chưa chạy không phải validation failure. Đã tự kiểm bằng máy: JSON parse, mọi khoá ⊆ `fillableSegments` của bài, 0 khoá shadow, NFC, 0 khoá rỗng, thứ tự khoá theo Pāli, Pāli trùng nguyên văn ⇒ English trùng (trừ các chỗ ghi ở trên), dấu lược và nháy so với Pāli từng khoá (dấu `’` có chữ thường đứng ngay sau tính là dấu nhạt lượu).

  Hai cơ chế khoá trống của tầng đã ghim (đo rồi báo, không sửa — sửa là shadow): **cắt cụt dãy** (dãy ≥ 4 khoá trống liên tiếp) = 3 dãy / 20 khoá / 1804 ký tự Pāli; **bỏ dòng song song** (chỉ xét khoá trống, thân từ = 6 chữ đầu của từ ≥ 4 chữ, khoá mở nhóm gom mọi khoá trống chưa vào nhóm có tỉ lệ chung ≥ 0,70, mỗi khoá thuộc đúng một nhóm) = 33/47 khoá. Khoá đã ghim có chữ nhưng ngắn dưới 25% Pāli (Pāli ≥ 40 ký tự): 13 (`3.1`, `3.3`, `9.8`, `9.12`, `9.16`, `11.14`, `12.6`, `12.7`, `12.11`, `13.4`, `14.5`, `14.10`, `15.5`) — chủ yếu là câu tóm thay cho đoạn lặp, nên `ratio` trước khi lấp đã lạc quan.

  Hệ quả với `content/meta/reference-gaps.yaml`: `mn/mn32` **có** record trong tệp đó. Record đó sẽ thành thừa sau khi bài `published`; lát này **không** chạm tệp đó, để người điều phối sinh lại bằng `npm run reference:gaps`. Coverage đo trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): trước 110/153 = 0.7190; sau khi lớp lấp `published`: 153/153 = 1.0000 (43 khoá có nội dung được lấp, còn 0 khoá có nội dung thiếu English). Độ nhạy: phải mất thêm 31 khoá có nội dung nữa thì bài mới rớt dưới ngưỡng 0,8.
