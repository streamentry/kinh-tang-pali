notes: |-
  Mười khoá lấp đều là vế lặp, không có khoá nào trong đây có Pāli trùng nguyên văn với khoá
  khác của cùng bài (đo bằng máy trên 306 khoá Pāli: 0 khoá). Nhưng luật “đừng dịch khi tách
  khỏi bài” vẫn áp dụng đầy đủ, và ở bài này nó quyết định gần như từng chữ:

  - **6 khoá `evameva kho …` (18.6, 19.6, 20.6, 21.6, 22.6 và — tính cả 27.3/27.4 sau) là
    vế sau của một câu đã ghim ở khoá liền trước**, và vế sau ấy đã có sẵn ở tầng Sujato:
    18.4/18.5 · 19.4/19.5 · 20.4/20.5 · 21.4/21.5 · 22.4/22.5. Nên lấy lại đúng vế sau đó,
    chỉ thêm dẫn “Just the same, Bhāradvāja,” cho `evameva kho`. Cụ thể:
    18.6 → “came out my ears making a severe noise” (của 18.4) ·
    19.6 → “severe winds ground my head” (19.4) ·
    20.6 → “I got a severe headache” (20.4) ·
    21.6 → “severe winds carved up my belly” (21.4) ·
    22.6 → “there was a severe burning in my body” (22.4).
    Lưu ý 18.6 bị lặp “severe” hai lần (“severe winds … a severe noise”) vì Pāli có
    `adhimattā vātā` lẫn `adhimatto saddo` — hai mức độ khác nhau, và cả hai đều là
    `adhimatta-`. Đã đối chiếu bản Việt canonical (18.4 “những cơn gió mạnh … tiếng động lớn”)
    để giữ đúng hai tầng này.
  - **27.3 và 27.4** là hai vế sau của 27.2 đã ghim, và tầng ghim đã gộp cả quá khứ/tương lai/
    hiện tại vào một câu: “Whether in the past, future, or present—this is as far as it goes,
    no-one has done more than this.” Bản lấp tách đúng Pāli: 27.3 = `anāgatamaddhānaṁ`
    (tương lai) + `vedayissanti` (sẽ cảm), 27.4 = `etarahi … vedayanti` (hiện tại, đang cảm);
    vế sau `etāvaparamaṁ, nayito bhiyyo` lấy nguyên của 27.2. Bốn tính từ
    “painful, sharp, severe, acute” cũng lấy nguyên của 27.2.
  - **30.3** là nửa sau của 30.2 đã ghim, và Sujato đã gộp luôn cả hai vào 30.2
    (“…Why don’t I eat some solid food, some rice and porridge?”). Bản lấp giữ đúng Pāli
    `Yannūnāhaṁ … odanakummāsan’ti`, tức là phần “Why don’t I eat…” ấy; không có gì để mở rộng.
  - **5.3** tự dịch, nhưng dùng lại từ của tầng ghim: 5.4 đã dịch `tāta bhadramukha` là
    “dearest boy”, và `bhagavā` là “Blessed One” trong quy ước của tầng đã ghim (ví dụ `dn21`
    “Blessed One”). `so bhagavā` là Đức Phật đang được nói đến ⇒ “That Blessed One”.
  - **23.7** tự dịch: `arahaṁ samaṇo gotamo, vihāro tveva so arahato evarūpo hotī’ti.` BẤT ĐỊNH
    GHI THẲNG, vì đây là chỗ đáng lẽ không nên phải dịch: khoá **23.6 ngay trước đã ghim sẵn**
    “He’s not dead or dying. The ascetic Gotama is a perfected one, for that is how the
    perfected ones live.” — tức tầng ghim đã lấy trộm nội dung 23.7 sang 23.6. Nếu bỏ 23.7 thì
    nó thành orphan; nếu dịch y nguyên theo 23.6 thì người đọc gặp cùng một câu hai lần. Tôi dịch
    theo Pāli của chính khoá này (“such is the conduct of a perfected one”, lấy chữ
    “conduct” vì Pāli nói `vihāro`), nên **sự lặp là hệ quả của tầng đã ghim, hiện ra thay vì
    giấu**. Vì vậy hạ `grammar_logic` 9.3 và `ambiguity_integrity` 9.3.

  Không có dấu lược trong Pāli của cả mười khoá (đã kiểm: không khoá nào chứa `…`). Ở bài này
