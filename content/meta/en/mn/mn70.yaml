notes: |-
  **Bốn nhóm khoá (đo bằng script trên 18 khoá lấp): A = 3 · B = 4 · C = 10 · D = 1.**

  **Bối cảnh.** `5.1` đã ghim tóm cả lời trình của các tỳ-kheo `5.2`–`5.12` thành “and told him what had happened.” Lời trình
  là bản **thuật lại** cuộc đối thoại `4.3`–`4.11` (đã ghim), và Đức Phật hỏi lại nguyên văn ở `6.8`–`6.16` (đã ghim). Vì
  thế lớp lấp dùng lại hai bản ấy, chọn bản `6.x` khi Pāli của khoá lấp mang nháy **đơn** lồng (như `6.x`).
  - A (3): `5.6` (= `6.11`), `5.9` (= `4.9`/`6.14`), `5.10` (= `4.10`/`6.15`).
  - B (4), tỉ lệ 1,0 (chỉ khác hoa/thường, `;`/`.`, nháy): `5.3` ← `4.3`/`6.8`, `5.4` ← `4.4`/`6.9`, `5.8` ← `4.8`/`6.13`,
    `5.11` ← `4.11`/`6.16`.
  - **D (1) — báo, không tự ý hòa.** `5.5` `Etha, tumhepi, āvuso, aññatreva rattibhojanā bhuñjatha.` trùng byte `4.5`
    (“You too should abstain from eating at night.”) và `6.10` (“You too should never eat at night.”). Lớp lấp theo
    `6.10` vì `5.3`–`5.6` lặp lại đúng khối nháy đơn `6.8`–`6.11`.
  - C: `5.2` (mở lời trình), `5.7` (dựng từ `4.7`, đổi ngôi “to us”), `5.12` (“… we are reporting this matter to the
    Buddha.””), và khối đuôi phẩm `27.11`–`28.4`.

  **Khối đuôi phẩm (7 khoá) — theo tiền lệ `mn20` của lớp lấp.** `27.11` → “At Kīṭāgiri is finished—the tenth.”;
  `27.12` `Bhikkhuvaggo niṭṭhito dutiyo.` → “The Mendicants Chapter, finished—the second.”; `28.0` → “Its summary verse:”;
  `28.1`–`28.4` dịch sát chữ uddāna, giữ tên riêng, không đổi thành tên tiếng Anh của từng kinh: `Kuñjara` (con voi — ví
  dụ voi chúa của `mn61`), `rāhula` (`mn61`/`mn62`), `sassataloko` (`mn63`), `Mālukyaputto` (`mn64`, viết
  “Māluṅkyaputta” theo `:0.2` đã ghim của `mn63`), `bhaddāli` (`mn65`), `Khudda dija` (con chim nhỏ, chim cun cút —
  `mn66`), `sahampatiyācaṁ` (lời thỉnh của Sahampati ở `mn67`), `Nāḷaka` (`mn68` Naḷakapāna), `raññi` (vị sống ở rừng —
  `mn69` Gulissāni), `kiṭāgiri` (`mn70`). BẤT ĐỊNH ghi thẳng: các tham chiếu kinh là cách đọc uddāna, đối chiếu bằng tên
  `:0.2` của mười bài; bản Việt canonical đọc giống.

