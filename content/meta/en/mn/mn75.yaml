notes: |-
  Cả ba khoá lặp lại Pāli đã được bản Anh ghim ở 8.2, 8.3, 8.5 — đây là bài có Pāli lặp nhiều
  nhất trong lát, và mọi lần lặp đều đã có sẵn một bản dịch Anh để dùng lại:
    8.12 ↔ 8.2 (chỉ khác `Taṁ` → `Sā`, ngang/giống cái) → lấy y hệt lời ở 8.2.
    8.13 ↔ 8.3 và 8.22 → lấy y hệt lời ở 8.3.
    8.15 ↔ 8.5 và 8.24 → lấy y hệt lời ở 8.5.
  Dịch lại từ đầu ở đây là sai luật 3, và cũng làm bài tự mâu thuẫn.

  Bất định đã ghi nhận: 8.12 dùng "That’s" (giống 8.2) trong khi Pāli 8.12 là `Sā` (giống cái,
  ngang với `jivhā` ở 8.11). Sujato đã ghim 8.21 — vế nốt y hệt 8.2 với `So` — bằng cùng lời
  đó, nên giữ "That’s" cho nhất quán với chính bài; đổi sang "She" sẽ phá khuôn đã ghim.
  Dấu câu ở 8.13 và 8.15 cũng lấy y hệt bản ghim (8.3 không có dấu chấm dù Pāli kết `:`;
  8.5 có dấu chấm). Không có bất định nào chưa phân xử được.
