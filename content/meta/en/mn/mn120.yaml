notes: |-
  Phân loại 57 khoá đã ghi (đo bằng script, theo Pāli đã có lời trong cùng bài): A y nguyên = 30 · B dựng lại = 5 · C tự dịch = 22 · D (Pāli trùng, lời đã ghim khác nhau; báo, không tự hòa) = 0. Script phân loại theo Pāli trùng nên các khoá tách ra từ một khoá đã ghim bị gộp sẵn (đếm là C) được nêu riêng bên dưới.
  Số khoá đã ghi: 57 trên 70 khoá tầng Anh đã ghim để trống (13 khoá còn trống).
  Khoá còn trống và lý do: 13-16.2, 13-16.3, 17.2, 17.3, 18.2, 18.3, 18.4, 19.2, 19.3, 19.4, 37.2, 37.3, 37.4 (13 khoá, đều dưới 40 ký tự, không vào coverage). Pāli ở những khối này cắt dòng liệt kê `saddhāya … sīlena … sutena … cāgena … paññāya samannāgato hoti` thành nhiều khoá, nhưng tầng đã ghim đặt cả câu “Furthermore, take a mendicant who has faith, ethics, learning, generosity, and wisdom.” vào khoá `.1` của khối ấy (13-16.1, 17.1, 18.1, 19.1, 37.1); lấp riêng sẽ in lại các mục “learning …”, “generosity …”, “and wisdom.” sau khi câu đầy đủ đã có.
  Nhóm B (khoá ← khoá nguồn, tỉ lệ khớp do script đo): 19.11 ← 6.5 (0.92); 20.10 ← 6.5 (0.91); 21-30.13 ← 6.5 (0.90); 31.8 ← 33-36.9 (0.93); 32.8 ← 33-36.9 (0.94).
  Nháy: 0 khoá có số dấu nháy khác Pāli; các khoá còn lại khớp Pāli từng khoá.
  Dấu lược: 15 khoá chứa `…` (20.1, 20.2, 20.3, 21-30.1, 21-30.2, 21-30.3, 31.1, 31.2, 31.3, 32.1, 32.2, 32.3, 33-36.1, 33-36.2, 33-36.3); mỗi `…pe…` của Pāli tương ứng đúng một `…` của English, không khoá nào mở rộng.

  Nhóm A — 19.10, 20.9, 21-30.12, 31.7, 32.7 (`Tassa evaṁ hoti:` = “They think:” theo 3.2); 20.5, 21-30.5, 31.5, 32.5, 33-36.5 (`Tassa sutaṁ hoti` = “And they’ve heard:” theo 6.2); 19.12–19.14, 20.11–20.13, 21-30.14–16, 31.9–31.11, 32.9–32.11 (ba câu `So taṁ cittaṁ dahati …`, `Tassa te saṅkhārā …`, `Ayaṁ, bhikkhave, maggo …`): dùng lại nguyên văn 3.2, 6.2, 3.4, 3.5, 3.6.
  Nhóm B — 19.11, 20.10, 21-30.13, 31.8, 32.8: câu `aho vatāhaṁ … sahabyataṁ upapajjeyyan’ti` dựng từ 6.5 (0.91, 0.91, 0.90) và 33-36.9 (0.93, 0.94): chỉ đổi tên chư thiên, lấy từ chính dòng liệt kê đã ghim ngay trước mỗi khối: “the gods of sublime luminosity” (19.9), “the gods of universal beauty” (20.8), “the gods of Akaniṭṭha” (21-30.11), “the gods of the dimension of infinite space” (31.6), “the gods of the dimension of infinite consciousness” (32.6).
  Nhóm khối `Puna caparaṁ …`: 20.1, 21-30.1, 31.1, 32.1, 33-36.1 là A (Pāli y hệt 18.1, 19.1, 37.1) nhưng tầng đã ghim ở ba khoá đó MỞ RỘNG `sīlena …` thành cả năm mục (“faith, ethics, learning, generosity, and wisdom”), còn Pāli viết `…`. Lớp lấp không sao chép: dịch “Furthermore, take a mendicant who has faith, ethics …” giữ đúng một `…`, và các khoá `.2`, `.3`, `.4` (“learning …”, “generosity …”, “and wisdom.”) lấp đủ cho năm khối này vì khoá `.1` của chúng trống. Hệ quả: năm khối này mô tả dòng liệt kê khác cách ba khối đã ghim (13-16, 17, 18, 19, 37).
  Nhóm C — 37.11 `Saṅkhārupapattisuttaṁ niṭṭhitaṁ dasamaṁ.`: “Rebirth by Choice is finished—the tenth.”; 37.12 `Anupadavaggo niṭṭhito dutiyo.`: “The One by One Chapter, finished—the second.” (khuôn của mn20:8.17 “The Lion’s Roar Chapter, finished—the second.”).
  Nhóm C — 38.0–38.4, bài kệ tóm lược (`Tassuddānaṁ`): “Its summary verse:” như mn20:9.0; bốn dòng kệ liệt kê tên các bài MN111–120 theo tên của Sujato (“One by One”, “The Sixfold Purification”, “A True Person”, “What Should Be Cultivated”, “Many Elements”, “The Great Forty”, “Mindfulness of Breathing”, “Mindfulness of the Body”, “Rebirth by Choice”). CHƯA PHÂN XỬ ĐƯỢC hai chỗ: (a) `vibhatti` ở 38.2 (“Many Elements, the analysis;”) có thể là một danh hiệu riêng hoặc vị ngữ của `bahudhātu`; (b) `Buddhassa kittināma` ở 38.3 là cách nói trỏ tới MN116 “At Isigili” (bài kể tên các vị đã được ca ngợi); lớp lấp dịch sát chữ, “the Buddha’s renowned names”, không gán tên bài. Cả năm khoá đều dưới 40 ký tự nên không vào coverage.
  Dấu lược: các khoá chứa `…` đều là dấu lược của Pāli (`sutena …`, `cāgena …`); không khoá nào mở rộng. Nháy: tất cả khoá khớp Pāli (không khoá nào chứa nháy ngoài lời `aho vatāhaṁ …’ti`, khớp từng khoá).

  Cố ý lệch tầng đã ghim: 20.1, 21-30.1, 31.1, 32.1, 33-36.1 không sao chép cách mở rộng của 18.1/19.1/37.1. 38.2 và 38.3 dịch sát chữ, không gán tên bài cho `vibhatti` và `Buddhassa kittināma`.

  Coverage đo bằng mẫu số là các khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): trước 88/114 = 0.7719; sau khi `published` 114/114 = 1.0000. Ngưỡng 0.8 cần 92/114; trước lớp lấp còn thiếu 4 khoá, lớp lấp thêm 26 khoá có nội dung.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài này CÓ record; sau khi `published` coverage vượt ngưỡng nên record thành thừa, người điều phối sinh lại bằng `npm run reference:gaps`.

  Triangulation: Bản Việt canonical của mn120 có `quality.assessed_by` (xem `content/meta/sutta/…/mn120.yaml`) cùng họ công cụ với lớp lấp, nên triangulation chấm 8.0 và bài này không được tuyên bố là đã đối chiếu English độc lập (bản lấp không phải cách đọc English độc lập của bản Việt).

