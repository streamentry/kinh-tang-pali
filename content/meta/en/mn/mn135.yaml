notes: |-
  **Phân loại 42 khoá (đo bằng máy, mỗi khoá một nhóm): A y nguyên = 12 · B dựng lại = 21 · C tự dịch = 9 · D (Pāli trùng, lời Anh của tầng đã ghim khác nhau) = 0.** Đã ghi 42/42 khoá `fillableSegments` của bài (30 khoá có nội dung ≥ 40 ký tự Pāli, 12 khoá ngắn hơn ngưỡng). Số khoá Sujato để trống mà lát **không** lấp: 0.

  **Cấu trúc lặp 14 lần.** Mỗi con đường nghiệp có khoá `Xsaṁvattanikā esā, māṇava, paṭipadā yadidaṁ—` + khoá liệt kê hạnh. Tầng đã ghim chỉ dịch ba khoá
  `5.4`, `6.4`, `18.8` (“For killing living creatures is the path leading to a short lifespan.” …), gộp luôn hạnh vào câu, rồi để trống mười một khoá tương ứng.
  **Nhóm 1 — mười một khoá dẫn nhập kiểu `X.4/X.5/X.8` (`7.4`, `8.4`, `9.5`, `10.5`, `11.5`, `12.5`, `13.4`, `14.4`, `15.5`, `16.5`, `17.8`).** Đo bằng máy: B với `18.8`/`5.4`/`6.4` (0,88–0,93). Bản lấp
  **không** gộp hạnh vào câu như Sujato (vì Pāli kết bằng `yadidaṁ—` và hạnh nằm ở khoá kế), mà dịch đúng phần có trong khoá: “For this is the path leading to being sickly, that is—”,
  giữ khuôn “For … is the path leading to …” của tầng đã ghim và dùng đúng từ kết quả mà tầng đã ghim dùng ở khoá `X.3` kế bên (sickly, healthy, ugly, lovely, insignificant, illustrious, poor, rich,
  “reborn in a low class family”, “reborn in an eminent family”, witless). **Cố ý lệch kiểu câu so với `5.4`/`6.4`/`18.8`** (Sujato dịch hạnh vào chính khoá đó). Dấu `—` giữ theo Pāli.
  **Nhóm 2 — khoá liệt kê hạnh.** `5.5`, `6.5`, `7.5`, `8.5`, `13.5`, `14.5` dựng lại từ khoá nguồn `5.1`, `6.1`, `7.1`, `13.1` (đổi “Take some woman or man who …” → “They …”): `5.5`←`5.1` 0,80 · `6.5`←`6.1`
  0,85 · `7.5`←`7.1` 0,79 · `8.5`←`7.1` 0,79 · `13.5`←`13.1` 0,85 · `14.5`←`13.1` 0,84. `9.6`, `10.6`, `11.6`, `15.6`, `16.6` là các vế `kodhano hoti …;` — “They’re irritable and bad-tempered;” (`9.1`).
  **Nhóm 3 — A, dùng nguyên văn:** `9.7`←`9.2`, `10.7`←`10.2`, `11.7`←`11.2`, `15.7`←`15.2`, `17.10`–`17.13`←`17.2`–`17.5`, `18.10`–`18.13`←`18.2`–`18.5` (12 khoá). `12.2`, `12.7`
  (B, 0,95 với `11.2`): “They don’t envy, resent, or begrudge the possessions, honor, respect, reverence, homage, and veneration given to others.” — đảo phủ định của `11.2`. `16.2`, `16.7`: đảo `15.2`
  (“They bow to those they should bow to. They rise up for them, offer them a seat, make way for them, and honor, respect, esteem, and venerate those who are worthy of such.”).
  `17.9`, `18.9` (0,75 và 0,73 với `17.1`): “They don’t / do approach an ascetic or brahmin to ask:”. `8.5` “They would never hurt living creatures …” theo `8.1`.
  **`21.6`**: `Cūḷakammavibhaṅgasuttaṁ niṭṭhitaṁ pañcamaṁ.` → “The Shorter Analysis of Deeds is finished—the fifth.” (khuôn các bài đã lấp).

