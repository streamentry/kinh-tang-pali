notes: |-
  **Bốn số (đo bằng máy, ngưỡng 0,80): A = 2 · B = 5 · C = 7 · D = 0.** Ghi 14/14 khoá.

  **Điệp khúc đau (`5.3`, `5.5`, `5.7`).** `5.5` và `5.7` có Pāli trùng từng chữ với `5.9` (A) ⇒ lời `5.9`
  nguyên văn. `5.3` chỉ khác `5.5` **một dấu phẩy** (`paññāyati no` thiếu `,`), máy xếp B 1,00 với `5.1`; bản lấp
  **cố ý** dùng lời `5.9` chứ không dùng lời `5.1`, vì lời `5.1` mở ngoặc và mang hô ngữ “Reverend Sāriputta,” đúng
  cho câu mở lời, còn `5.3` là điệp khúc giữa chừng như `5.5`/`5.7`/`5.9`. Hệ quả: hô ngữ `āvuso sāriputta` của ba
  khoá này **không** hiện trong English — giống hệt cách tầng đã ghim xử lý ở `5.9`. Hạ `semantic_fidelity` 9,4.

  **B (4 khoá) — `10.2`–`10.5` ← `9.2`–`9.5` (0,90–0,91).** Pāli đổi đối cách (`sotaṁ … viññāṇaṁ`) sang vị trí
  cách (`sotasmiṁ … viññāṇe`) vì câu hỏi `10.1` là “đã thấy gì *trong* …”. Bản lấp dựng theo `9.2` (“Do you regard
  the ear …”) nhưng đổi thành “What have you seen in the ear, ear consciousness …”, rồi `nose, nose consciousness …`
  v.v. Bỏ hô ngữ `āvuso channa` như tầng đã ghim bỏ ở `9.2`–`9.5`.

  **C (7 khoá).** `10.6` và `10.12` là hai khoá kết của hai lượt hỏi/đáp; dịch từ Pāli, lấy khung câu của lời đã
  ghim ở `10.1` (“what have you seen, what have you directly known … that you regard them in this way”) và `10.7`
  (“after seeing cessation, after directly knowing cessation …”), và lấy nguyên câu ‘This is not mine, I am not this,
  this is not my self’ của `9.12`. `10.8`–`10.11` (lời Channa) dựng song song: “After seeing cessation in the ear, ear
  consciousness …”, rồi `nose …`, `tongue …`, `body …`. `13.14` colophon “Advice to Channa is finished—the second.”

  Dấu lược: Pāli `10.2`–`10.5`, `10.8`–`10.11` mỗi khoá một `…`, bản lấp mỗi khoá đúng một `…`; các khoá khác 0/0.
  Nháy: 14/14 khoá khớp Pāli. Ghi nhận ngoài lát: lời đã ghim `10.7` đặt `”` đóng ngoặc ngay cuối khoá dù Pāli
  `10.7` không đóng — bản lấp `10.12` vẫn đóng `’”` theo Pāli.

  Coverage: mẫu số 58; trước 49/58 = 0,8448, sau 58/58 = 1,0. Độ nhạy: thêm 11 khoá trống mới rớt ngưỡng.
  `mn144` **không** có record trong `content/meta/reference-gaps.yaml`.

  Triangulation ≤ 8,0: scorecard Việt của bài này (`content/meta/sutta/mn/mn144.yaml`) ghi `assessed_by`/`translators` thuộc **cùng họ công cụ** với lớp lấp (cùng khai trong `source/tooling.yaml`). Vì vậy bản lấp **không** phải cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root + lời Sujato đã ghim của cùng bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

