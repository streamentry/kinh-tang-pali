notes: |-
  **Phân loại 98 khoá (đo bằng script trên Pāli đã ghim, khớp ≥ 0,80 sau chuẩn hoá là B): A = 50 · B = 36 · C =
  12 · D = 0.** 60/98 khoá lớp lấp trùng nguyên văn một lời đã ghim của cùng bài.

  **Bối cảnh.** Tầng đã ghim dịch đầy đủ các khối 3, 4–6, 7, 8, 16–20, 21, 22–24, 28 nhưng ở các khối 9–15 (nghe
  nhiều, trì luật, thuyết pháp, ở rừng, mặc y phấn tảo, khất thực, ở gốc cây) và 25–27 (ba xứ vô sắc đầu) chỉ
  dịch câu mở `X.1` rồi đặt `…`, trong khi Pāli viết **đủ** mười khoá còn lại của mỗi khối. Lớp lấp dựng lại đủ,
  không thêm `…` nào (Pāli các khoá này không có `…pe…`).

  **Nhóm A (50 khoá) — dùng lại nguyên văn.** `So iti paṭisañcikkhati:` → lời `8.2`/`28.2`; `Ayampi, bhikkhave,
  asappurisadhammo.` → `8.5`; `Sappuriso ca kho … paṭisañcikkhati:` → `8.6`; `so ca hoti
  dhammānudhammappaṭipanno …’ti.` → `8.9`; `Ayampi, bhikkhave, sappurisadhammo.` → `8.11`; `Yena yena hi
  maññanti …’ti.` → `28.8`. Pāli của các khoá này trùng từng ký tự với khoá đã ghim.

  **Nhóm B (36 khoá, khớp Pāli 0,82–0,98).** `X.4` (từ `7.4`/`8.4`/`16-20.8`/`28.4`) lấy nguyên “And they
  glorify themselves and put others down on account of that.” — tầng đã ghim dịch mọi khối bằng đúng câu này;
  `X.7` (từ `7.7`/`8.7`/`16-20.11`) và `X.10` (từ `7.10`/`8.10`/`16-20.14`) giữ nguyên khuôn “‘It’s not because
  of … that thoughts of greed, hate, or delusion come to an end.” và “Keeping the practice to themselves, they
  don’t glorify themselves and put others down on account of ….”; `12.3`/`15.3` (từ `16-20.7`) và
  `25.3`/`26.3`/`27.3` (từ `28.3`) theo khuôn “‘…, unlike these other mendicants.’”; `25.7`/`26.7`/`27.7` và
  `25.9`/`26.9`/`27.9` theo `28.7`/`28.9`; `12.8` (từ `16-20.12`). Phần chèn lại chỉ là tên phẩm chất, lấy đúng
  chữ tầng đã ghim dùng ở `X.1` (“very learned”, “an expert in the monastic law”, “a Dhamma teacher”, “dwells in
  the wilderness”, “a rag robe wearer”, “eats only almsfood”, “stays at the root of a tree”) và tên ba xứ vô sắc
  ở `25.1`/`26.1`/`27.1`.

  **Nhóm C (12 khoá).** Năm khoá `9.3`, `10.3`, `11.3`, `13.3`, `14.3` (máy đo khớp 0,73–0,80 với `16-20.7`,
  dưới ngưỡng B) dựng theo cùng khuôn “‘…, unlike these other mendicants.’”; sáu khoá `No cepi … hoti;` (`9.8`,
  `10.8`, `11.8`, `13.8`, `14.8`, `15.8`, đều dưới 40 ký tự) và `12.8` (B) dịch thẳng “Even if someone is not /
  doesn’t …,” — **không** theo kiểu diễn ý của `16-20.12` (“eats in more than one sitting per day”), vì Pāli chỉ
  phủ định phẩm chất. Colophon `29.5` `Sappurisasuttaṁ niṭṭhitaṁ tatiyaṁ.` → “A True Person is finished—the
  third.”, theo khuôn colophon đã có ở lớp lấp (tên bài lấy từ `0.2`).

  **Nhóm D: 0.**

  **Dấu và ngoặc (kiểm bằng script, từng khoá).** `…pe…` = đúng một `…`; số `“ ” ‘` và `’` đóng (không kể `’` +
  chữ thường) của lớp lấp khớp Pāli ở 98/98 khoá. NFC, không khoá rỗng, mọi khoá ⊆ `fillableSegments`, không
  khoá nào trùng khoá đã ghim có chữ. Pāli trùng nguyên văn trong bài ⇒ English trùng (kể cả lời đã ghim): đạt.

  **Đo nguyên nhân khoá trống.** Tầng đã ghim để trống 98 khoá (không tính `:0`) — đúng bằng số khoá của lát,
  nên sau lát này bài **không còn khoá trống nào** ngoài khối `:0`. Cắt cụt dãy (≥ 4 khoá trống liền nhau): 10
  dãy / 97 khoá / 5929 ký tự Pāli. Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 87 khoá (≤ 98).
  Ngoài hai phép trên, cơ chế thấy rõ khi đọc là **tóm tắt nội dung** vào một khoá đã ghim (nêu ở trên) — phép
  đo thân từ không bắt được nó.

  Triangulation 8.0: scorecard Việt của `mn113` (`content/meta/sutta/mn/mn113.yaml`) có `quality.assessed_by`
  **trùng** alias của lớp lấp (`source/tooling.yaml`) — tức bản Việt canonical và bản lấp do cùng một công cụ
  làm/chấm. Vì vậy bản lấp **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài này
  **không** được tuyên bố là đã đối chiếu English ở 98 khoá này. Đối chiếu có: Pāli root đã ghim (authority),
  lời Sujato đã ghim của chính bài (dùng làm khuôn chữ cho nhóm A/B) và bản Việt canonical (chỉ đối chiếu nghĩa,
  không dịch vòng). Không chạm tầng Việt hay metadata Việt.

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run
  build` (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều
  phối. Không đặt blocker vì cổng chưa chạy không phải lỗi kiểm định.

  Hệ quả với `content/meta/reference-gaps.yaml`: `mn/mn113` **có** record (dưới ngưỡng 0,8); sau khi `published`
  record ấy thành thừa — lát này **không** sửa tệp đó, để người điều phối sinh lại bằng `npm run
  reference:gaps`. Coverage trên Pāli có nội dung (≥ 40 ký tự, bỏ `:0`): trước 76/136 = 0,5588; sau khi
  `published` 136/136 = 1,0000. Lát ghi 98 khoá, trong đó 60 khoá có nội dung và 38 khoá dưới 40 ký tự (không
  vào coverage nhưng vẫn là khoá trống thật, nên vẫn lấp). Độ nhạy: phải mất 28 khoá có English nữa thì mới rớt
  dưới 0,8.
