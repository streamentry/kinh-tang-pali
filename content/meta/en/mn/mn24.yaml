notes: |-
  **Phân loại 21 khoá (đo bằng máy trên Pāli root và tầng Sujato đã ghim): A dùng lại nguyên văn = 0 · B dựng lại = 9 · C tự dịch = 7 · D báo = 5.** A gồm cả khoá lặp nguyên văn một khoá lấp trước đó trong cùng bài; B là Pāli gần (tỉ lệ khớp từ 0,6) một khoá đã có lời, chỉ chèn phần tầng ghim nuốt mất; D là Pāli trùng nguyên văn với khoá đã ghim nhưng lời đã ghim khác nhau, hoặc lớp lấp cố ý lệch (nêu từng khoá bên dưới).

  **C (7 khoá) và B (9 khoá), tách theo nhóm:**
  · **2.5 (C).** Pāli lược `…pe…` giữa danh sách đức tính của Puṇṇa; tầng ghim đã dịch cả danh sách ở 2.3 với “they” (là lời hỏi của Đức Phật). Ở 2.5 các tỳ-kheo trả lời về Puṇṇa nên lớp lấp dùng “he”, giữ “Personally having few wishes, … speaks to the mendicants on having few wishes” của 2.3, một `…` thay `…pe…`, rồi vế cuối “an adviser and counselor, one who educates, encourages, fires up, and inspires his spiritual companions”.
  · **10.2, 10.7, 12.2, 12.7, 12.8 (B, tỉ lệ 0,93 / 0,95 / 0,92 / 0,94 / 0,84, nguồn 10.1 và 12.1).** Tầng đã ghim gộp cả chuỗi câu hỏi của Sāriputta vào “When asked each of these questions, you answered, ‘Certainly not.’” và nuốt chính các câu hỏi. Lớp lấp dựng lại từng câu hỏi bằng lời đã ghim ở 9.5 (“Well, is the spiritual life lived under the Buddha for the sake of purification of mind?”) hoặc 11.1 và 11.15 (“Is purification of … complete extinguishment with no fuel for grasping?”; “Then is complete extinguishment … something apart from these things?”), rồi mới đến vế “When asked this, you answered, ‘Certainly not.’”.
  · **10.3–10.6 và 12.3–12.6.** Phần Pāli lược `…pe…` chỉ còn tên các loại thanh tịnh. Tầng ghim đã xử lý đúng chỗ tương ứng ở 11.5–11.13 bằng cụm trần (“purification of view …”, “purification by traversing doubt …”…). Lớp lấp dùng đúng cụm đó (10.4–10.6, 12.4–12.6: C hoặc B 0,53–0,60) và với 10.3, 12.3 giữ nguyên khung câu hỏi cho đến chỗ lược.
  · **17.6 (C), ‘āyasmā sāriputto’ti.** Một cụm không có động từ. Dịch “‘It’s Venerable Sāriputta.’”: tầng ghim đã đẩy nội dung này vào 17.5 (“I had no idea I was consulting with <em>the</em> Venerable Sāriputta”), nên đây là chỗ lặp do tầng ghim chứ không phải lớp lấp thêm ý.
  · **17.14 (B, 0,60).** Câu kết bài: “Chariots at the Ready is finished—the fourth.”

  **D (5 khoá): 11.4, 11.6, 11.8, 11.10, 11.12 (`“No hidaṁ, āvuso”.`).** Pāli trùng nguyên văn với 9.4, 9.6, …, 9.16, 11.2, 11.14 và 11.16, nhưng tầng đã ghim dịch 14 khoá là “Certainly not.” còn 11.2 là “Certainly not, reverend.”. Lớp lấp dùng “Certainly not.”, cách dịch của 14/15 khoá, trong đó có hai khoá sát nhất (11.14 và 11.16, ngay sau cùng khối). Không tự hòa hai cách dịch: đã ghi lại để người điều phối quyết định.

  Dấu lược: 9 khoá lớp lấp có `…` (2.5, 10.3–10.6, 12.3–12.6), đều đúng số dấu lược của Pāli. Tầng ghim có 19 khoá lệch số dấu lược so với Pāli (11.3, 11.5, 11.7, 11.9, 11.11, 13.2–13.6, 14.6–14.9 và các khoá kế đó thừa `…`) — ngoài lát, chỉ báo. Nháy: khớp Pāli ở cả 21 khoá.

  **Khoá còn trống:** 0 trong 21 khoá `fillableSegments` (đã lấp hết; đo bằng máy: không còn khoá Pāli nào của bài thiếu cả tầng Sujato lẫn lớp lấp). **Coverage** (Pāli ≥ 40 ký tự, bỏ khối `:0`): trước 99/107 = 0.9252; sau khi `published` 107/107 = 1.0000. Độ nhạy: ngưỡng 0,8 cho phép thiếu tối đa 21 khoá có nội dung (phần nguyên của 0,2 × 107); trước lát bài thiếu 8. `content/meta/reference-gaps.yaml` **không** có record của bài này (coverage trước đã ≥ 0,8), nên không có record nào thành thừa vì lát này.

  **Triangulation 7.8.** Bản Việt canonical của bài (`content/meta/sutta/mn/mn24.yaml`) do cùng họ công cụ làm, rà soát hoặc chấm với lớp lấp (đối chiếu `translators` / `assessed_by` / `reviewers` với `source/tooling.yaml`), nên lớp lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English của lớp này. Đối chiếu thực có: Pāli root + tầng Sujato đã ghim (118/139 khoá có lời) + bản Việt canonical để đối chiếu nghĩa (không dịch vòng, không chép). Không có bản Anh độc lập nào cho 21 khoá lớp lấp, nên chấm không quá 8,0.

  **technical_integrity 9.6:** không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối. Không đặt blocker vì chưa chạy.
