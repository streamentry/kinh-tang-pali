notes: |-
  **Phân loại 124 khoá: A = 34 · B = 69 · C = 21 · D = 16.** Hai lần tầng đã ghim thay cả đoạn Đức Phật lặp lại
  lời Tôn giả Sāriputta bằng một câu tóm lược (`14.1`, `32-36.1`, `51-58.1`: “And the Buddha went on to repeat
  and endorse Venerable Sāriputta’s explanation in full.”). Lớp lấp dịch đủ phần lặp ấy từ lời Sujato của chính
  phần Sāriputta (`5.x`–`11.x`, `24.x`, `30.x`, `41.x`, `48.x`). Khoá dẫn `14.1` (đã ghim, mang câu tóm lược) **không
  thể** lấp, nên khối `14.2`… bắt đầu sau câu tóm lược mà không có vế “I say that there are two kinds of bodily
  behavior”.

  - **Xưng hô và người nói:** Sujato bỏ `bhante` ở phần Sāriputta; lớp lấp bỏ `sāriputta` ở các vế song song cho
    cùng giọng (giữ ở `21.8`, `38.7`, `59.10`, `60.2`–`60.4`). **Cố ý lệch nguyên văn A:** `Kiñcetaṁ paṭicca
    vuttaṁ?` (≡ `5.5` “but why did he say it?”) ở `14.5`, `20.5`, `32-36.4`, `51-58.4`, `59.4` dịch “but why did I
    say it?” vì người nói là Đức Phật nói về lời của chính mình (`mayā`); ở `41.4` (lời Sāriputta) giữ “he”.
  - **D (16) — báo, không hoà:** cùng Pāli mà Sujato dịch khác nhau: `sevitabbampi, asevitabbampī’ti—` (“that
    which …” ở `24.2`/`24.8`/`29.2`/`30.4`/`48.2`, “those who …” ở `48.8`) — bản lấp dùng “those who” cho người
    (`59.2`, `59.8`) và “that which” cho phần còn lại; `‘Puggalaṁpāhaṁ …` (`48.1` “individual:” rút gọn vs `48.7`
    đủ câu) — dùng `48.7`; tương tự `24.1`/`24.7`, `29.1`/`30.3`, `41.1`/`51-58.1`, `5.1`/`5.18`/`14.1`.
  - **Cố ý lệch tầng ghim:** `21.3` bỏ câu hỏi “And what kind of incarnation causes …?” mà Sujato tự thêm ở `11.12`
    (Pāli không có); `41.7`, `51-58.7` dùng `:` chứ không chép `…` Sujato tự thêm ở `41.1`; `37.4`, `37.6` (Pāli ≡
    `26.1`, `27.1`) dịch đúng Pāli “you should not cultivate that kind of …” thay vì chép lời Sujato “two kinds of
    smell/taste …” vốn lệch khoá; `37.1` (Pāli ≡ `25.1`) bỏ `‘` vì Pāli không mở nháy.
  - **Peyyāla:** `17-19.1`–`.5`, `25.2`…`28.1`, `37.x`, `38.1`–`38.2`, `42.x`–`47.x`, `51-58.11`–`.16` giữ đúng một `…`
    mỗi khoá như Pāli; `51-58.10` là ghi chú của Pāli `(Yathā paṭhamaṁ tathā vitthāretabbaṁ)` → “(This should be
    expanded as in the first case.)”. `60.2`–`60.4` lặp nội dung mà tầng ghim đã gộp vào `60.1`.

  Dấu lược: Pāli 35, bản lấp 35. Ngoặc khớp Pāli 124/124. Khoá dưới 40 ký tự đã lấp: 57. Cơ chế khoá trống: cắt
  cụt dãy ≥ 4 = 4 dãy / 99 khoá / 6.235 ký tự; bỏ dòng song song = 106/124. Tầng ghim tự thêm `…` ở 5 khoá.

