notes: |-
  **Phân loại 60 khoá (đo bằng script trên Pāli đã ghim, khớp ≥ 0,80 sau chuẩn hoá là B): A = 36 · B = 6 · C =
  18 · D = 0.** 36/60 khoá lớp lấp trùng nguyên văn một lời đã ghim của cùng bài.

  **Bối cảnh.** Ở mỗi khối 11–27, tầng đã ghim dịch câu ước (`X.2`) và câu “But it’s possible that …” (`X.3`)
  rồi đặt `…`, bỏ cả bốn khoá còn lại; ở `17.2`, `21.2`, `25.2` nó còn **gộp nội dung** của các khối lược 18–20,
  22–24, 26–27 vào một câu (“the monks, nuns, laymen, and laywomen”, “robes, almsfood, lodgings, and
  medicines”). Lớp lấp dịch theo Pāli của từng khoá, nên ở các khối 18–20, 22–24, 26–27 người đọc sẽ gặp lại nội
  dung mà câu gộp của tầng đã ghim nói trước — **lặp do tầng đã ghim, không phải do Pāli**.

  **Nhóm A (36 khoá) — nguyên văn.** Ba khoá đuôi của mỗi khối (`iti so kupito hoti appatīto.` → “they get angry
  and bitter.”; `Yo ceva kho … appaccayo—` → “And that anger and that bitterness”; `ubhayametaṁ aṅgaṇaṁ.` → “are
  both blemishes.”), lấy từ `10.6–10.8` = `26-27.7–9`; và ba khoá mở `18-20.1`, `22-24.1`, `26-27.1` = lời
  `11.1`.

  **Nhóm B (6 khoá theo máy, khớp 0,81–0,94).** `13.4`, `15.4`, `17.3`, `21.3`, `22-24.4`, `26-27.4`. Khuôn
  “Thinking, ‘…,’” lấy của `10.5` và `26-27.6`; các vế lấy nguyên chữ tầng đã ghim ở `X.2`/`X.3` cùng khối
  (“accuse … in the middle of the Saṅgha”, “by repeatedly questioning”, “putting … at the very front”, “the best
  seat, the best drink, and the best almsfood in the refectory”, “give the verses of appreciation”, “honor,
  respect, revere, and venerate”). Phần chèn lại là vế `na so bhikkhu …`/`na taṁ bhikkhuṁ …` (“not that
  mendicant”) mà tầng đã ghim thay bằng `…`; Pāli viết đủ nên lớp lấp **không** đặt `…`.

  **Nhóm C (18 khoá).** Các câu `‘…’ti—` `11.4`, `12.4`, `14.4`, `16.4`, `17.4`, `18-20.6`, `21.4`, `22-24.6`,
  `25.4`; khoá lược `18-20.2`, `18-20.3`, `22-24.2`, `22-24.3`, `26-27.2`, `26-27.3` (mỗi khoá `…pe…` → đúng một
  `…`); `18-20.4`, `26-27.5`; colophon `33.5`.

  **Cố ý lệch tầng đã ghim.** (1) `17.3`, `17.4`, `21.3`, `21.4` dịch `bhikkhūnaṁ`/`bhikkhū` là “the monks”,
  không mở rộng thành bốn chúng như `17.2`/`21.2` đã ghim, vì Pāli các khoá này chỉ nói tỳ-kheo. (2) `18-20.2`
  và `26-27.2` dịch `aho vata ahameva` là “Oh, I hope that I alone …” theo cách tầng đã ghim dịch ở `15.2`,
  không theo `17.2`/`25.2` (bỏ “Oh”/“alone”). (3) `25.4` dùng “has got” như `26-27.6` đã ghim, nhưng giữ vế
  `nāhaṁ lābhī` (“not me”) mà `26-27.6` bỏ.

  **Nhóm D: 0.**

  **Dấu và ngoặc (kiểm bằng script, từng khoá).** `…pe…` = đúng một `…`; số `“ ” ‘` và `’` đóng (không kể `’` +
  chữ thường) của lớp lấp khớp Pāli ở 60/60 khoá. NFC, không khoá rỗng, mọi khoá ⊆ `fillableSegments`, không
  khoá nào trùng khoá đã ghim có chữ. Pāli trùng nguyên văn trong bài ⇒ English trùng (kể cả lời đã ghim): đạt.

  **Đo nguyên nhân khoá trống.** Tầng đã ghim để trống 60 khoá (không tính `:0`) — đúng bằng số khoá của lát,
  nên sau lát này bài **không còn khoá trống nào** ngoài khối `:0`. Cắt cụt dãy (≥ 4 khoá trống liền nhau): 11
  dãy / 59 khoá / 3421 ký tự Pāli. Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 46 khoá (≤ 60).
  Ngoài hai phép trên, cơ chế thấy rõ khi đọc là **tóm tắt nội dung** vào một khoá đã ghim (nêu ở trên) — phép
  đo thân từ không bắt được nó.

  Triangulation 8.0: scorecard Việt của `mn5` (`content/meta/sutta/mn/mn5.yaml`) có `quality.assessed_by`
  **trùng** alias của lớp lấp (`source/tooling.yaml`) — tức bản Việt canonical và bản lấp do cùng một công cụ
  làm/chấm. Vì vậy bản lấp **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài này
  **không** được tuyên bố là đã đối chiếu English ở 60 khoá này. Đối chiếu có: Pāli root đã ghim (authority),
  lời Sujato đã ghim của chính bài (dùng làm khuôn chữ cho nhóm A/B) và bản Việt canonical (chỉ đối chiếu nghĩa,
  không dịch vòng). Không chạm tầng Việt hay metadata Việt.

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run
  build` (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều
  phối. Không đặt blocker vì cổng chưa chạy không phải lỗi kiểm định.

  Hệ quả với `content/meta/reference-gaps.yaml`: `mn/mn5` **có** record (dưới ngưỡng 0,8); sau khi `published`
  record ấy thành thừa — lát này **không** sửa tệp đó, để người điều phối sinh lại bằng `npm run
  reference:gaps`. Coverage trên Pāli có nội dung (≥ 40 ký tự, bỏ `:0`): trước 117/150 = 0,7800; sau khi
  `published` 150/150 = 1,0000. Lát ghi 60 khoá, trong đó 33 khoá có nội dung và 27 khoá dưới 40 ký tự (không
  vào coverage nhưng vẫn là khoá trống thật, nên vẫn lấp). Độ nhạy: phải mất 31 khoá có English nữa thì mới rớt
  dưới 0,8.
