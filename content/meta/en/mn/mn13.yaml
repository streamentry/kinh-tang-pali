notes: |-
  **Phân loại 23 khoá (đo bằng máy trên Pāli đã ghim và tầng Anh đã ghim của chính bài này, ngưỡng gần-trùng 0,75 trên Pāli đã bỏ dấu câu): A = 8 · B = 7 · C = 6 · D = 2.**
  Định nghĩa để tái lập: A khi Pāli chuẩn hoá trùng nguyên văn với khoá đã có lời và các khoá ấy chỉ có một dạng lời; D khi Pāli trùng nhưng các lời đã ghim
  khác nhau; B khi không trùng nhưng gần trùng (≥ 0,75); C là phần còn lại. Tổng 8 + 7 + 6 + 2 = 23, đúng bằng số khoá đã ghi (23/23
  khoá của `fillableSegments`). Cách xử lý thực tế: trong nhóm A, 4 khoá lấy lại **nguyên văn từng chữ** và 4 khoá có điều chỉnh (nêu bên dưới);
  21 khoá viết tay (gồm B, C, D và các A có điều chỉnh).

  **Khoá `3.5`.** Tầng đã ghim dịch cả câu hỏi “What, then, is the difference between the ascetic Gotama’s
  teaching and instruction and ours?” vào `3.4` và đóng nháy ” ở đó, nuốt luôn vế `yadidaṁ dhammadesanāya vā
  dhammadesanaṁ, anusāsaniyā vā anusāsanin”ti?` của `3.5`. Lớp lấp dịch riêng vế ấy (“that is, comparing
  teaching with teaching, or instruction with instruction?”), đóng nháy ” như Pāli; hệ quả là ” in hai lần khi
  đọc liền `3.4`+`3.5`.

  **Nhóm thuật lại cho Đức Phật (`5.2`–`5.14`, 13 khoá).** Các tỳ-kheo kể lại đúng chuỗi `2.1`–`4.3` đổi ngôi
  (they → we) và thêm `bhante`. Máy phân loại: A = `5.4` (←`2.3`), `5.5` (←`2.4`), `5.8` (←`3.1`), `5.9` (←`3.2`),
  `5.10` (←`3.3`), `5.14` (←`4.3`); B = `5.2` (0,82 ←`2.1`), `5.6` (0,90 ←`2.5`), `5.7` (0,93 ←`2.6`), `5.12`
  (0,86 ←`4.1`), `5.13` (0,94 ←`4.2`); C = `5.3` (0,62 ←`2.2`), `5.11` (0,72 ←`3.4`). Pāli ở đây có nháy lồng
  nhau (kép mở ở `5.2`, đơn bên trong) nên lớp lấp theo **Pāli**, không theo tầng đã ghim: bốn khoá A
  (`5.4`, `5.5`, `5.8`, `5.14`) vì vậy đổi nháy kép của khoá nguồn thành nháy đơn mà giữ nguyên chữ — đây
  là A có điều chỉnh, không phải A nguyên văn. `5.11` gộp cả `3.4` lẫn `3.5` nên dùng cùng cách dịch với
  `3.5` (“comparing teaching with teaching, or instruction with instruction”).

  **Khoá `21.2`.** Tầng đã ghim đã gộp vế “And it had been dead for one, two, or three days, bloated, livid,
  and festering.” vào `21.1`; khoá `21.2` vì vậy bị bỏ trống. Lớp lấp dịch lại đúng vế đó theo Pāli và dùng
  chữ của `21.1`, nên câu lặp **hiện ra** chứ không bị giấu (đây là hệ quả của khoá gộp, không phải lỗi lặp).

  **Khoá `22.2`** liệt kê các loài ăn xác (quạ, diều hâu, kền kền, cò, chó, hổ, báo, chó rừng). Tầng đã ghim
  kết `22.1` bằng dấu lược dù Pāli `22.1` kết bằng `—` không có `pe` (một dấu lược do tầng ghim thêm); lớp lấp
  **không** chép dấu lược ấy.

  **Nhóm D — `22.5` và `23-28.6`.** Pāli “Ayampi, bhikkhave, rūpānaṁ ādīnavo.” có bốn lời đã ghim: `19.6` “This
  is the drawback of forms.” và `20.5`, `21.6`, `29.6` “This too is the drawback of forms.” Báo, không hoà. Cả
  hai khoá lấp cùng vị trí với ba khoá “Puna caparaṁ …” nên chọn “This too is …” (3/4).

  **Ngoại lệ nháy (6 khoá: `22.3`, `22.4`, `22.5`, `23-28.4`, `23-28.5`, `23-28.6`).** Tầng đã ghim dùng nháy kép
  để đóng lời Đức Phật (`19.4`, `20.3`, `21.4`, `29.4`), mở lời đáp (`19.5` “Yes, sir.” dù Pāli là nháy đơn
  `‘Evaṁ, bhante’`) và mở lời kết (`19.6`, `20.5`, `21.6`, `29.6`) ở **toàn bộ năm khối anh em**, trong khi Pāli
  không đóng/mở đúng chỗ ấy. Lớp lấp theo đúng quy ước đó để sáu khoá không lệch với năm khối còn lại: đo
  được (kép mở/kép đóng/đơn mở/đơn đóng) `22.3` và `23-28.4` Pāli 0/0/0/0, lấp 0/1/0/0; `22.4` và `23-28.5`
  Pāli 0/0/1/1, lấp 1/1/0/0; `22.5` và `23-28.6` Pāli 0/0/0/0, lấp 1/0/0/0.

  **Khoá `38.5`** là câu kết: “The Longer Discourse on the Mass of Suffering is finished—the third.”

  **Nháy kép “ ” và đơn ‘ ’ (không tính dấu nhạt lượu `’s`, `’t`…).** Đo từng khoá so với Pāli: 6 khoá lệch có chủ đích (`22.3`, `22.4`, `22.5`, `23-28.4`, `23-28.5`, `23-28.6`), mỗi khoá có lý do và số đo ở nhóm tương ứng bên trên; 17 khoá còn lại khớp Pāli.

  **Dấu lược.** Pāli của 23 khoá có 0 dấu lược (`…pe…` đếm là **một**); lớp lấp ghi 0. Pāli viết đủ thì lớp lấp không thêm “…”.

  **Khoá trống còn lại.** Không còn: cả 23 khoá thuộc `fillableSegments` đã được lấp, kể cả các khoá dưới ngưỡng 40 ký tự (câu kết, nhãn thứ tự, dấu lược) vì chúng có thật trong Pāli; những khoá ấy không vào coverage nhưng bỏ trống sẽ để lại chỗ hổng giữa bài.

  **Coverage (đo thật, mẫu số khác 0).** Mẫu số: 110 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Trước lớp lấp: 92/110 = 0,8364. Sau khi lớp lấp `published`: 110/110 = 1,0000. Độ nhạy: ngưỡng 0,8 cho phép tối đa 22 khoá thiếu English; lớp lấp đưa số khoá thiếu từ 18 về 0 nên bài còn đệm 22 khoá. Bài này **không** có record trong `content/meta/reference-gaps.yaml`, nên không có record nào thành thừa vì lát này.

  **Khoá có chữ nhưng ngắn hơn hẳn Pāli (dấu hiệu cắt cụt/gộp của tầng đã ghim).** Đo: 1 khoá mà lời Anh đã ghim < 30% độ dài Pāli (Pāli ≥ 60 ký tự). Đây là chỗ `ratio` có thể lạc quan; lớp lấp không sửa được các khoá đã ghim. Đã dò Pāli trùng nguyên văn trên cả bài: 17 nhóm (mỗi nhóm từ hai khoá trở lên).

  **Triangulation 8.0 (trần của bài).** Scorecard Việt của `mn13` (`content/meta/sutta/mn/mn13.yaml`) do cùng họ công cụ với lớp lấp chấm (alias khai ở `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập của bản Việt và **không** được tuyên bố là đã đối chiếu English. Đối chiếu thực có: Pāli root + bản Anh đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Tệp Việt và metadata Việt không bị chạm.

  **technical_integrity 9.6.** Không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh ấy còn lại cho người điều phối, và chưa chạy cổng không phải blocker. Đã tự kiểm bằng phép đo riêng: JSON parse, NFC, mọi khoá thuộc `fillableSegments`, không khoá nào che bản đã ghim, dấu lược khớp Pāli, nháy (kể các ngoại lệ đã nêu), Pāli trùng ⇒ lời trùng, và `final_score` bằng trung bình số học thô.
