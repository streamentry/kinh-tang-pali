notes: |-
  Đoạn 31–32 là cặp "voi không thuần" / "voi đã thuần". Bản đã ghim đã gộp ba tuổi vào
  một danh sách ở `mn125:31.1` và `32.1`, nên các vế riêng cho từng tuổi bị bỏ trống:

  * 31.3 (`daharo`) → "youthful", 32.3 → "youthful": lấy đúng từ Sujato dùng trong
    danh sách "whether elderly, middle aged, or youthful" (2 lần trong tầng `mn`, cả hai
    đều ở chính bài này). Không dùng "young" vì "young bull" có 0 tiền lệ.
  * 31.6 (`navo`) → "junior", 32.6 → "junior": lấy từ danh sách "whether senior, middle,
    or junior" của `mn125:31.4`/`32.4` đã ghim. "junior mendicant" có 3 lần trong tầng
    `mn`.
  * `adanto avinīto` / `sudanto suvinīto` → "untamed and untrained" / "tamed and trained"
    theo `31.1` và `32.1` đã ghim. `akhiṇāsavo` → "without having ended the defilements"
    (31.4), `khīṇāsavo` → "having ended the defilements" (32.4).

  **Bất định thật sự ở 32.2.** Pāli chỉ còn một vế cụt: `majjhimo cepi, aggivessana,
  rañño nāgo …`. Dịch "Even a middle aged royal bull elephant …" và giữ đúng một dấu
  lược. `aggivessana` bị bỏ theo bản đã ghim: chữ này **không xuất hiện lần nào** trong
  bản Anh Majjhima (0 lần trong toàn tầng), kể cả ở 31.1/32.1 đã ghim. Đọc cạnh
  `32.1` đã ghim ("whether elderly, middle aged, or youthful") thì câu này có vẻ thừa,
  nhưng đó là hệ quả của việc bản đã ghim gộp trước rồi bỏ trống vế sau; bịt khoá lại
  thì lại là lược chữ.

  Dấu ngoặc: 31.3, 31.6, 32.3, 32.6 mở `‘` vì Pāli mở `‘` quanh công thức
  `‘…kālaṅkato’tveva` và không đóng trong cùng khoá (chỉ 32.6 có `”ti.` bên ngoài). Tôi
  đặt dấu mở ở đầu câu thay vì giữa câu — cùng cách Sujato xử lý ở `an6.32:3.3` và
  `an7.50:1.6` — vì tiếng Anh không mang được dấu mở treo giữa câu mà vẫn đúng nghĩa.
  Sujato ở 31.1/32.1/31.4 đã lược dấu nháy, nhưng lưuật đếm ngoặc của lớp lấp bắt buộc
  phải khớp từng khoá, nên không thể lược.

  Lớp lấp: 5 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn
  bị mất.