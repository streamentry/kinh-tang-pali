notes: |-
  **Phân loại 17 khoá (đo bằng script trên Pāli đã ghim, khớp ≥ 0,80 sau chuẩn hoá là B): A = 2 · B = 13 · C = 2
  · D = 0.** 2/17 khoá lớp lấp trùng nguyên văn một lời đã ghim của cùng bài.

  **Bối cảnh.** Ở `11.10`, `12.12`, `13.22`, `14.5` tầng đã ghim gộp lời dẫn và lời hứa của Upāli thành câu gián
  tiếp đã đóng `”` (“But you said that you would debate on the basis of truth.”), bỏ trống hai khoá trích nguyên
  văn sau đó. Lớp lấp dịch hai khoá ấy theo Pāli — nên người đọc gặp lại nội dung đã nói và có thêm một dấu đóng
  `’”`; cả hai là hệ quả của tầng đã ghim.

  **Nhóm A (2 khoá).** `21.17`/`21.21` = `20.11` (vế cuối của lời Nigaṇṭha Nāṭaputta sau đoạn lược).

  **Nhóm B (13 khoá, khớp 0,83–1,00).** Bốn cặp `11.11/11.12`, `12.13/12.14`, `13.23/13.24`, `14.6/14.7` (1,00
  với `10.7`/`10.8`, đổi ngoặc kép → đơn vì là lời được trích lại; Pāli `11.11` có dấu phẩy thay chấm phẩy, cùng
  lời); `22.12`/`22.13` (1,00 với `22.9`/`22.10`, ngoặc kép); `23.6`/`23.7` (1,00 với `23.3`/`23.4`); `21.16`
  (0,83 với `21.19`, chuyển lời gián tiếp của `21.19` đã ghim thành lời trực tiếp như Pāli).

  **Nhóm C (2 khoá).** `24.1` (“Then the householder Upāli—”, mở câu mà `24.2` đã ghim nối tiếp) và colophon
  `31.2`.

  **Nhóm D: 0.**

  **Dấu và ngoặc (kiểm bằng script, từng khoá).** `…pe…` = đúng một `…`; số `“ ” ‘` và `’` đóng (không kể `’` +
  chữ thường) của lớp lấp khớp Pāli ở 17/17 khoá. NFC, không khoá rỗng, mọi khoá ⊆ `fillableSegments`, không
  khoá nào trùng khoá đã ghim có chữ. Pāli trùng nguyên văn trong bài ⇒ English trùng (kể cả lời đã ghim): đạt.

  **Đo nguyên nhân khoá trống.** Tầng đã ghim để trống 17 khoá (không tính `:0`) — đúng bằng số khoá của lát,
  nên sau lát này bài **không còn khoá trống nào** ngoài khối `:0`. Cắt cụt dãy (≥ 4 khoá trống liền nhau): 0
  dãy / 0 khoá / 0 ký tự Pāli. Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 10 khoá (≤ 17). Ngoài
  hai phép trên, cơ chế thấy rõ khi đọc là **tóm tắt nội dung** vào một khoá đã ghim (nêu ở trên) — phép đo thân
  từ không bắt được nó.

