notes: |-
  **Phân loại 88 khoá (đo bằng máy; ngưỡng B = độ tương đồng Pāli ≥ 0,60 với một khoá đã có lời): A dùng lại nguyên văn = 72 · B dựng lại = 10 · C tự dịch = 1 · D Pāli trùng nhưng lời tầng khác nhau = 5.** Đã ghi 88/88 khoá `fillableSegments` (trong đó 85 khoá có nội dung ≥ 40 ký tự Pāli; 3 khoá còn lại dưới ngưỡng, không vào coverage). Số khoá trống còn lại của bài: 0 (mọi khoá tầng đã ghim để trống đều đã lấp). Pāli chứa 0 dấu lược (`…pe…` hoặc `…` = đúng một `…` mỗi nơi), bản lấp giữ đúng 0; 20 khoá có nháy trong Pāli. Trong bài có 39 nhóm Pāli trùng nguyên văn (141 khoá).

  **Cấu trúc.** Bài có năm vòng “thí dụ + áp dụng”; mỗi vòng áp dụng (`2.14`–`2.20`, `4.1`–`4.12`, `4.16`–`4.24`, `4.34`–`4.47`, `5.2`–`5.13`, `5.25`–`5.41`, `6.23`–`6.38`) lặp nguyên các khoá của vòng đầu, mà Sujato nén thành dấu lược. Lớp lấp dùng lại đúng lời của khoá trùng Pāli trong cùng bài (72 khoá A), nên bài không tự mâu thuẫn.

  **A — 72 khoá dùng lại nguyên văn:** lời suy nghĩ ‘otiṇṇomhi …’ và ‘appeva nāma …’ (←`2.2`, `2.3`), các vế “They’re happy with that …”, “They’re not happy with that …”, “They don’t glorify themselves …”, “Nor do they become indulgent …”, “Being diligent, they achieve …” (←`2.5`, `2.8`, `3.5`–`3.12`, `4.26`–`4.29`, `5.15`, `5.16`, `5.19`, `6.5`–`6.16`).

  **B — 10 khoá.** (1) Câu mở áp dụng `Evameva kho, bhikkhave, idhekacco kulaputto …` (`2.14`, `4.1`, `4.34`, `5.25`, `6.23`) ← `2.1` (0,90): “In the same way, mendicants, take the case of a gentleman who has gone forth out of faith from the lay life to homelessness, thinking,”. (2) `2.19` ← `2.6`+`2.7` (0,72): Pāli gộp hai vế ở một khoá (“And they glorify themselves and put others down because of that: ‘I’m the one with possessions …’”). (3) `4.22`, `4.41` ← `6.8` (0,99; chỉ khác dấu phẩy). (4) `4.24` ← `3.7` / vế đầu của `6.10` (0,82): “Nor do they become indulgent and fall into negligence regarding that accomplishment in ethics.” (5) `5.40` ← `5.17`+`5.18` (0,73): Pāli gộp hai câu (“‘I’m the one who meditates knowing and seeing. These other mendicants meditate without knowing and seeing.’”).

  **C — `7.6`**: colophon `Mahāsāropamasuttaṁ niṭṭhitaṁ navamaṁ.` (“The Longer Simile of the Heartwood is finished—the ninth.”), theo tiêu đề `0.2` đã ghim.

  **D — 5 khoá (báo, không tự hòa): `2.17`, `4.4`, `4.37`, `5.28`, `6.26`.** Pāli `So evaṁ pabbajito samāno lābhasakkārasilokaṁ abhinibbatteti.` xuất hiện ở `2.4`, `3.4`, `6.4` (Sujato: “When they’ve gone forth they generate possessions, honor, and popularity.”) và ở `4.18`, `5.4` (cùng câu nhưng có đuôi “ …”). Pāli không có dấu lược ở bất kỳ nơi nào; lớp lấp theo bản không có `…`.

  **Nháy:** 20 khoá có nháy, English khớp từng khoá. Không có chỗ cố ý lệch Sujato ngoài chỗ D nêu trên.

  **Lệch tầng đã ghim cần biết:** các khoá `x.1` mở các vòng của Sujato (“Next, take a gentleman who has gone forth … …”) kết bằng `…` mà Pāli viết đủ; bản lấp viết đủ từng khoá áp dụng.

