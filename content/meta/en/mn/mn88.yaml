notes: |-
  **Phân loại 23 khoá (đo bằng script trên Pāli đã ghim, khớp ≥ 0,80 sau chuẩn hoá là B): A = 1 · B = 19 · C = 3
  · D = 0.** 9/23 khoá lớp lấp trùng nguyên văn một lời đã ghim của cùng bài.

  **Bối cảnh.** Tầng đã ghim dịch đủ chuỗi hỏi–đáp về thân hành (`10.2`–`10.9`, `14.2`–`14.9`) rồi ở `11.2`,
  `15.2` đặt `…` và bỏ cả chuỗi ý hành; Pāli viết **đủ** chuỗi ý hành. Ở `8.3` tầng đã ghim gộp thân, khẩu, ý
  vào một câu hỏi.

  **Nhóm A (1 khoá).** `5.4` = `4.5`.

  **Nhóm B (19 khoá, khớp 0,91–0,98).** Mười sáu khoá `11.3`–`12.3`, `15.3`–`16.5` dựng từ đúng khoá thân hành
  tương ứng (`10.2`–`10.9`, `14.2`–`14.9`), chỉ đổi “bodily” → “mental”; các câu trả lời ngắn (“Unskillful
  behavior.” …) giữ nguyên vì tầng đã ghim không nêu thân/khẩu/ý trong câu trả lời. `5.2` (0,98 với `4.3`, ngoặc
  kép vì người đưa tin nói trực tiếp), `5.3` (0,92 với `4.4`, “and he says:”), `8.7` (0,95 với `8.4`, thêm
  “mental”).

  **Nhóm C (3 khoá).** `8.5` (`…pe…` → đúng một `…`), `8.6`, colophon `22.6`.

  **Nhóm D: 0.**

  **Dấu và ngoặc (kiểm bằng script, từng khoá).** `…pe…` = đúng một `…`; số `“ ” ‘` và `’` đóng (không kể `’` +
  chữ thường) của lớp lấp khớp Pāli ở 23/23 khoá. NFC, không khoá rỗng, mọi khoá ⊆ `fillableSegments`, không
  khoá nào trùng khoá đã ghim có chữ. Pāli trùng nguyên văn trong bài ⇒ English trùng (kể cả lời đã ghim): đạt.

  **Đo nguyên nhân khoá trống.** Tầng đã ghim để trống 23 khoá (không tính `:0`) — đúng bằng số khoá của lát,
  nên sau lát này bài **không còn khoá trống nào** ngoài khối `:0`. Cắt cụt dãy (≥ 4 khoá trống liền nhau): 2
  dãy / 16 khoá / 712 ký tự Pāli. Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 18 khoá (≤ 23).
  Ngoài hai phép trên, cơ chế thấy rõ khi đọc là **tóm tắt nội dung** vào một khoá đã ghim (nêu ở trên) — phép
  đo thân từ không bắt được nó.

