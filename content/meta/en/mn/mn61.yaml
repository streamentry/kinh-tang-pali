notes: |-
  **Phân loại 43 khoá (đo bằng máy, theo Pāli của từng khoá so với khoá có lời Sujato trong cùng bài):
  A = 2 · B = 31 · C = 4 · D = 6.** Tầng đã ghim dịch đủ phần thân nghiệp (9.1–11.10), rồi ở khẩu nghiệp và
  ý nghiệp chỉ dịch câu dẫn và khoá đầu (12.2, 15.2, viết thêm `…’ …`) cùng phần “sau khi làm” (14.4–14.10,
  17.4–17.10). Khoảng giữa (12.3–14.3, 15.3–17.3) trống dù Pāli viết đủ.

  **A (2 khoá).** 12.4, 15.4 `Sace tvaṁ, rāhula, …` = 9.4 “If, while checking in this way, you know:”.

  **B (31 khoá) — dựng từ phần thân nghiệp, chỉ đổi “act with the body”.** Khẩu nghiệp lấy từ 9.x/10.x/11.x
  và thay bằng “act of speech” (chữ Sujato dùng ở 12.2, 14.5); ý nghiệp thay bằng “act of mind” (Sujato dùng
  ở 15.2, 17.5; riêng 17.9 Sujato viết “act with the mind” — bất nhất của tầng đã ghim, lớp lấp theo số
  đông). Câu dẫn 13.1/14.1/16.1/17.1 dựng từ 10.1/11.1, đổi “with the body” thành “with speech”/“with the
  mind” theo 12.1/15.1 của Sujato. Tỉ lệ khớp Pāli với khoá nguồn 0,93–0,98.

  **Lệch Pāli có lý do — 12.8.** Pāli MS ở khoá này **chỉ có hai vế** (`nevattabyābādhāyapi …, na
  parabyābādhāyapi …—`), thiếu `na ubhayabyābādhāyapi` mà mọi khoá song song đều có. Lớp lấp dịch đúng
  Pāli của khoá: “doesn’t lead to hurting myself or hurting others.”, không tự thêm vế thứ ba. Có thể là
  lỗi bản Pāli; ghi lại để người đọc biết vì sao khoá này ngắn hơn khoá anh em.

  **D (6 khoá) — báo, không tự hòa.** `Sace pana tvaṁ, rāhula, paccavekkhamāno evaṁ jāneyyāsi:` trùng
  nguyên văn ở 12 khoá; tầng đã ghim dịch 10.4 là “If, …” nhưng 9.7, 10.7, 11.8, 14.8, 17.8 là “But if, …”.
  Lớp lấp theo vị trí song song: khoá ở vị trí `.4` (trường hợp bất thiện, như 10.4) → “If, …” (13.4,
  16.4); khoá ở vị trí `.7` (trường hợp thiện) → “But if, …” (12.7, 13.7, 15.7, 16.7).

  **C (4 khoá).** 7.11 và 18.5 `evañhi te, rāhula, sikkhitabbaṁ` → “That’s how you should train, Rāhula.”
  (18.5 có `”` đóng như Pāli). Tầng đã ghim đã gộp ý này vào 7.10/18.4 (“So you should train like this:”),
  nên câu sẽ lặp ý ngay sau khoá đã ghim, và ở 18.4–18.5 người đọc sẽ thấy hai dấu `”` đóng. 18.2/18.3:
  tầng đã ghim gộp quá khứ–vị lai–hiện tại vào 18.1 (“All the ascetics and brahmins of the past, future, and
  present …”); lớp lấp tách đúng Pāli: 18.2 vị lai (“of the future who will purify … will do so”), 18.3 hiện
  tại. Pāli 18.2 kết bằng `parisodhessan”ti.` (nháy kép đóng giữa lời Phật, là cách chấm của bản MS); lớp lấp
  giữ `”` cho khớp Pāli. 18.8 kết bài: “Advice to Rāhula at Ambalaṭṭhika is finished—the first.”

  **Ngoặc:** khớp Pāli 43/43. **Dấu lược:** Pāli 0, lớp lấp 0 (không thêm `…` dù tầng đã ghim viết `…’ …`).

  **Lỗ hổng của bộ đo.** 1 khoá có lời Sujato ngắn dưới 30% Pāli (`7.3`), tính là đã phủ.

  Triangulation 8,0: scorecard Việt của `mn61` ghi `quality.assessed_by` **trùng** alias của lớp lấp này
  (khai trong `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập, và scorecard Việt
  không được tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu có: Pāli root, Sujato đã ghim, bản Việt
  canonical (đủ khoá). Không chạm tầng Việt.

  technical_integrity 9,6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`
  trong lát này, nên không tuyên bố technical gate pass. Bốn lệnh còn lại cho người điều phối.

  Hệ quả với `content/meta/reference-gaps.yaml`: `mn/mn61` **có** record. Coverage trước 76/117 = 0,6496;
  sau khi `published` 117/117 = 1,0000, nên record sẽ thành thừa — để người điều phối sinh lại tệp. Đã lấp
  đủ 43/43 khoá trống, trong đó 41 khoá có nội dung.
