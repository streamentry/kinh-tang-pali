notes: |-
  **Bốn số (đo bằng máy, ngưỡng 0,80): A = 4 · B = 9 · C = 10 · D = 0.** Ghi 17/23 khoá.

  **A (4 khoá):** `12.14`–`12.17` ← `12.3`–`12.6`, nguyên văn. Pāli có nháy đơn (`‘khattiyo’tveva` …) nhưng lời
  đã ghim không có nháy; theo luật A giữ nguyên văn ⇒ **lệch nháy 4 khoá** (Pāli 1/1, English 0/0), có chủ đích
  để hai lần nói cùng một câu Pāli ra cùng một câu English.

  **B (9 khoá).** `3.5`/`3.8`/`3.11`/`3.15` ← `3.3`/`3.6`/`3.9`/`3.12` (0,93–0,94): câu kết `Idaṁ kho … paññapenti`
  dựng từ câu mở `Tatridaṁ … paññapenti` (“This is the service they prescribe for …”), bỏ hô ngữ `bho gotama` như
  tầng đã ghim bỏ ở câu mở. `10.6`/`10.9`/`10.12`/`10.15` ← `10.4`/`10.7`/`10.10`/`10.13` (0,82–0,84) tương tự với
  “wealth”. `15.4` ← khung `15.2`/`15.8` (0,83): “An aristocrat is capable of taking some bathing cleanser, going to
  the river, and rinsing off dust and dirt;” (lấy nguyên cụm của `15.2`).

  **C (10 khoá, ghi 4).** `15.5`–`15.7` (“so is a brahmin …”, “a peasant …”, “a menial …”) giữ đúng một `…` mỗi
  khoá như Pāli. `17.4` colophon “With Esukārī is finished—the sixth.”

  **Sáu khoá cố ý không lấp, đều dưới 40 ký tự nên không vào coverage:** `8.6`, `8.8` (Pāli chỉ là `pe…`, mảnh
  sau của dấu lược mà khoá trước đã có `…` ở tầng đã ghim — lấp thêm sẽ thành hai dấu lược cho một chỗ lược),
  `8.9` (`micchādiṭṭhi hoti.` — tầng đã ghim đã **gộp** vế này vào `8.7`: “… and have wrong view.”, lấp sẽ lặp),
  `14.5`–`14.7` (`brāhmaṇopi hi, bho gotama …` v.v. — tầng đã ghim đã gộp cả bốn giai cấp vào `14.4`:
  “Aristocrats, brahmins, peasants, and menials can all do so.”). Cùng cấu trúc ở `15.4`–`15.7` thì tầng đã ghim để
  trống **cả** `15.4`, nên ở đó bản lấp dịch sát từng khoá thay vì gộp; hai đoạn song song vì vậy trình bày khác
  nhau — hệ quả của tầng đã ghim, ghi ra thay vì giấu. Hạ `segment_alignment` 9,4 và `grammar_logic` 9,1.

  Dấu lược: `15.5`–`15.7` Pāli 1, bản lấp 1; các khoá khác 0/0. Nháy: 13/17 khoá khớp, 4 lệch nêu ở A.

