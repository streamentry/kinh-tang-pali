notes: |-
  8.12 và 9.10 lặp NGUYÊN VĂN 8.10, vế đã được bản Anh ghim dịch thành "That’s how powerful
  is Baka the Divinity, how illustrious and mighty." Luật 3 của lớp lấp bắt dùng lại đúng lời
  đó, nên cả hai khoá lấp mang y hệt lời ấy. Chỉ khác dấu: 9.10 kết `”ti.` (1 ngoặc mở,
  1 ngoặc đóng), 8.12 kết `”’ti?` (1 mở, 2 đóng, 1 dấu hỏi) — chốt của lớp đòi đúng như vậy.
  Bản Việt canonical (mn49:9.10) chia ba vế theo cùng kiểu: "Phạm thiên Baka có thần lực đến
  mức ấy, uy lực đến mức ấy, quyền thế đến mức ấy."

  31.2 là công thức `<Tên>suttaṁ niṭṭhitaṁ <thứ tự>` và đây là lần đầu trong lát này gặp nó:
  tra đếm cho thấy tầng Anh đã ghim có 0 tiền lệ cho công thức này (không có mục nào trong
  tầng dịch `<tên>… is finished, <thứ tự>`), nên phải dựng từ hai nguồn đếm được: (a)
  `niṭṭhitaṁ` đã ghim là "is finished" (7 lần trong tầng, vd. "The Great Book is finished."),
  và (b) tiêu đề bài ở mn49:0.2 đã ghim là "On the Invitation of Divinity" — dùng đúng hai lời
  đó, không tự dịch lại tên bài. Bản Việt canonical (mn49:31.2) là "Kinh Phạm Thiên Cầu Thỉnh
  kết thúc, bài thứ chín.", cùng cấu trúc và cùng cách đặt thứ tự ở cuối.
