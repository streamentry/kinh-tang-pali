notes: |-
  21.3 và 22.3 chứa NGUYÊN VĂN Pāli của 21.2 và 22.2, chỉ khác vế `sāriputtameva taṁ sammā
  vadamāno vadeyya` nằm ở 21.2/22.2. Vì vậy lấy đúng lời Sujato: "they have attained mastery
  and perfection in noble ethics, immersion, wisdom, and freedom" và "the Buddha’s bosom son,
  born from his mouth, born of the teaching, created by the teaching, heir in the teaching,
  not in things of the flesh".

  22.3 bỏ "they’re" mà Sujato dùng ở 22.2: trong 22.3 phần trong nháy kép là danh từ từ
  vị (vế `vadeyya` đứng ngoài, ở 22.1/22.2), có "they’re" thì thành câu "they’re the Buddha’s
  bosom son" đọc như vế phụ. 21.3 giữ "they have attained" vì Pāli vế đó là mệnh đề.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp: bản
  lấp này không chứa văn xuôi tiếng Việt.
