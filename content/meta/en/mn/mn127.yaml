notes: |-
  **Phân loại 26 khoá. Script (so Pāli đã chuẩn hoá dấu câu): A = 8 · B = 5 · C = 13 · D = 0. Đọc lại bằng tay: A = 5 ·
  B = 18 · C = 1 · D = 2.** Hai phép cho số khác nhau vì script chỉ so Pāli với từng khoá đã ghim riêng lẻ, còn Sujato ở
  bài này **gộp** nội dung nhiều khoá Pāli vào một khoá (xem `14.4`, `14.6`, `14.9`, `2.4`–`2.7`), nên 12 khoá hỏi–đáp ở
  `14.x` mà script gọi là C thực chất đã có chữ ở khoá gộp, và ba khoá `2.10`–`2.12` mà script gọi là A không thể
  dùng lại nguyên văn (xem dưới). Lấp đủ 26/26 khoá tầng Anh đã ghim để trống (không còn khoá trống nào của bài):
  25 khoá đủ ngưỡng 40 ký tự (sau khi bỏ khoảng trắng cuối) và 1 khoá dưới ngưỡng (`18.4`, colophon).

  **Nhóm A — 5 khoá, dùng lại nguyên văn.** `8.5`, `8.7`, `8.9`, `8.11`, `8.13` = `8.15` (Pāli trùng từng chữ): “This too
  is called the expansive release of the heart.”

  **Nhóm B — 18 khoá, dựng lại từ lời đã ghim.**
  · `2.9` ← `2.3` (khớp 0,91): lời thưa của người đưa tin, Pāli `…vandati, evañca vadeti:` — chuyển ngôi
  thứ ba “bows with his head to your feet” và thêm “and he says:”; nháy kép mở khớp Pāli.
  · `2.12` ← `2.7` (khớp 1,00): cùng câu “for Pañcakaṅga has many duties, and much work to do for the king.”; nháy đóng
  đổi ” thành ’” vì Pāli `…rājakaraṇīyenā’”ti` đóng cả nháy đơn của `2.10` lẫn nháy kép của `2.9`.
  · Sáu khoá câu hỏi `14.5`, `14.10`, `14.14`, `14.18`, `14.22`, `14.26` (Pāli trùng nhau từng chữ, nên lời lấp **giống
  hệt nhau**): “Which of these two kinds of mental development is more expansive?” — vế cuối câu hỏi mà tầng
  đã ghim đã gộp vào khoá liền trước (`14.4`, `14.9`: “Which of these two kinds of mental development is more
  expansive: when a mendicant meditates …”). Lấy đúng cụm từ ấy, chỉ tách thành khoá riêng.
  · Sáu khoá chốt câu trả lời `14.7`, `14.12`, `14.16`, `14.20`, `14.24`, `14.28` (cùng một câu Pāli; trong đó `14.28`
  ở Pāli kết bằng `”ti?` — dấu hỏi là thừa vì đây là câu trả lời, nên lớp lấp dịch như các khoá kia, kết bằng dấu chấm):
  “This one is the more expansive of these two kinds of mental development.” Tầng đã ghim gộp vế này vào `14.6` và
  `14.27` (“When a mendicant meditates on two or three tree roots.”).
  · Bốn khoá vế đầu câu trả lời `14.11` (0,84 so với `14.6`), `14.15` (0,94), `14.19` (0,83), `14.23` (0,93): “Sir, the
  mendicant who meditates focused on pervading as expansive the extent of a single village district / two or three village
  districts / a single kingdom / two or three kingdoms—” — các cụm “focused on pervading as expansive the extent of …” lấy từ
  `14.4`, phạm vi từ mảnh đã ghim ở `14.9`, `14.13`, `14.17`, `14.21`.

  **Nhóm D — 2 khoá, báo.** `2.10` và `2.11` có Pāli **trùng từng chữ** với `2.5` và `2.6` nhưng **không** dùng lại lời
  đã ghim. Lý do (đọc trong bối cảnh, như bài học `sn11.24`): tầng đã ghim dịch `2.4`–`2.7` là lời dặn gián tiếp
  (“And then ask him whether he / would please accept tomorrow’s meal … / And ask whether he might please come earlier
  than usual,”), nhưng `2.9`–`2.12` là chính lời người đưa tin nói trực tiếp với Tôn giả Anuruddha (Pāli `adhivāsetu kira,
  bhante, āyasmā anuruddho …`). Dùng lại nguyên văn `2.5`/`2.6` sau “and he says:” thành mảnh không có chủ ngữ. Nên lời lấp
  chuyển sang trực tiếp: “‘Sir, would Venerable Anuruddha please accept tomorrow’s meal … together with three other mendicants?”
  và “And might Venerable Anuruddha please come earlier than usual,”.
  **Chỗ lệch có tên: `attacatuttho`.** Tầng đã ghim ở `2.5` dịch “together with the mendicant Saṅgha”, nhưng `attacatuttho`
  là “với ba vị khác” (bản thân là người thứ tư), và chính tầng đã ghim dịch đúng cụm này là “together with three other
  monks” ở `mn58:4.5` và `an5.33:2.1`. Lớp lấp dịch theo Pāli (“together with three other mendicants”) nên hai khoá
  cùng Pāli ở `2.5` và `2.10` **không** giống nhau; đây là chỗ báo cho người điều phối, không sửa tầng đã ghim.

  **Nhóm C — 1 khoá, tự dịch.** `18.4` colophon `Anuruddhasuttaṁ niṭṭhitaṁ sattamaṁ.` — “With Anuruddha is finished—the
  seventh.”, theo khuôn colophon đã lấp ở `mn20`, `mn117`, `mn123`, với tên kinh của tầng đã ghim (`0.2`).

  **Nháy.** 22/26 khoá khớp Pāli (đo đủ bốn loại: nháy kép mở/đóng, nháy đơn mở/đóng). **Lệch có chủ đích ở 4 khoá
  `14.11`, `14.15`, `14.19`, `14.23`:** Pāli có cặp nháy đơn quanh `‘mahaggatan’ti`, tầng đã ghim bỏ cặp nháy ấy ở `14.4`,
  `14.6`, `14.9`, `14.27` (“focused on pervading as expansive …”), nên lớp lấp theo để ba chỗ cùng cụm đọc cùng một kiểu.

  **Dấu lược.** Không khoá nào trong 26 khoá chứa `…` ở Pāli; tổng dấu lược của lớp lấp bằng 0. (Dấu lược của tầng
  đã ghim ở `14.9`, `14.13`, `14.17`, `14.21`, `14.25` là mảnh của chính các khoá hỏi mà lớp lấp vừa dựng; không sao chép.)

  **Cố ý lệch tầng đã ghim:** (1) `2.10`, `2.11` dịch trực tiếp, và `attacatuttho` = “three other mendicants” như trên;
  (2) `14.28` kết bằng dấu chấm thay cho `?` của Pāli; (3) cặp nháy đơn quanh `mahaggatan` ở bốn khoá `14.x` như trên.

  **Coverage (mẫu số = khoá Pāli ≥ 40 ký tự, bỏ `:0`; không phải mọi khoá):** trước 104/129 = **0,8062**; sau 129/129 =
  **1,0000** (sau khi `published`). **Độ nhạy: ngưỡng 0,8 cần ≥ 104/129 — bài đang đúng ở 104, không còn khoá dư nào;**
  chỉ cần mất 1 khoá là rớt ngưỡng. Vì chưa dưới ngưỡng nên `content/meta/reference-gaps.yaml` không có record
  phải xoá vì lát này; không chạm tệp đó, và người điều phối nên đo lại bài trước khi gom.

  **Triangulation 8.0 — bản lấp không phải cách đọc English độc lập.** Scorecard Việt của `mn127`
  (`content/meta/sutta/mn/mn127.yaml`) ghi `quality.assessed_by` **trùng họ công cụ** với lớp lấp này (đối chiếu
  theo `source/tooling.yaml`); bài này **không** được tuyên bố là đã đối chiếu English độc lập. Bản Việt
  canonical được dùng để đối chiếu nghĩa ở 26 khoá (ví dụ `attacatuttho` = “cùng ba vị nữa”), không dịch vòng qua nó.

  technical_integrity 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát
  này (cấm của người điều phối), nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối.
