notes: |-
  Phân loại 15 khoá đã ghi (đo bằng script, theo Pāli đã có lời trong cùng bài): A y nguyên = 4 · B dựng lại = 7 · C tự dịch = 1 · D (Pāli trùng, lời đã ghim khác nhau; báo, không tự hòa) = 3. Script phân loại theo Pāli trùng nên các khoá tách ra từ một khoá đã ghim bị gộp sẵn (đếm là C) được nêu riêng bên dưới.
  Số khoá đã ghi: 15 trên 15 khoá tầng Anh đã ghim để trống (0 khoá còn trống).
  Khoá còn trống: không còn khoá nào trong danh sách khoá để trống của bài này.
  Nhóm B (khoá ← khoá nguồn, tỉ lệ khớp do script đo): 9.4 ← 9.24 (0.97); 9.8 ← 9.24 (0.97); 9.12 ← 9.24 (0.97); 9.16 ← 9.24 (0.97); 9.20 ← 9.24 (0.97); 31.2 ← 30.2 (0.71); 31.3 ← 30.3 (0.72).
  Nhóm D: 9.7, 9.11, 9.15.
  Nháy: 0 khoá có số dấu nháy khác Pāli; các khoá còn lại khớp Pāli từng khoá.
  Dấu lược: 0 khoá chứa `…`; mỗi `…pe…` của Pāli tương ứng đúng một `…` của English, không khoá nào mở rộng.

  Nhóm A — 9.9, 9.13, 9.17, 9.21 dùng lại nguyên văn 9.1/9.5: “And you didn’t realize this situation:” (đã bỏ khoảng trắng cuối của lời đã ghim).
  Nhóm B — 9.4, 9.8, 9.12, 9.16, 9.20 dựng từ 9.24 (khớp 0.97): Pāli của 9.24 kết thúc bằng `ahosī”ti`, còn năm khoá này kết thúc bằng `ahosi.`, nên bỏ nháy đóng: “You also didn’t realize this situation.”
  Nhóm B — 31.2 dựng từ 30.2 (0.71) và 31.3 dựng từ 30.3 (0.72). 31.1 đã ghim chỉ dịch tới “until the Saṅgha has attained a great size,”; 31.2 là vế `Yato ca kho … saṅgho mahattaṁ patto hoti, atha idhekacce āsavaṭṭhānīyā dhammā saṅghe pātubhavanti` mà tầng đã ghim nuốt, và 31.3 là vế `Atha satthā … paññāpeti`. Dựng từ 30.3 (“the Teacher lays down training rules for disciples to protect against them”) đổi `yato ca kho … atha` thành “But when … then”, theo đúng cách 31.5 đã ghim dịch cùng khuôn ở cuối nhóm.
  Nhóm D (3 khoá, báo chứ không tự hòa) — 9.7, 9.11, 9.15 có Pāli y hệt 9.3 và 9.19, nhưng lời đã ghim của hai khoá ấy KHÁC nhau: 9.3 là “as the mendicant named Bhaddāli who doesn’t fulfill the training according to the Teacher’s instructions.’”, còn 9.19 kết thúc bằng “… instructions. …” (có thêm một dấu `…` mà Pāli 9.19 không có). Chọn 9.3 vì Pāli của 9.19 viết đủ và 9.3 là bản sạch; lời chọn không mang `…`. Hệ quả hiển thị: sau 9.6/9.10/9.14 đã ghim (kết thúc bằng `…` của Sujato) người đọc thấy “as the mendicant named Bhaddāli …”; đó là hệ quả của dấu lược do tầng đã ghim thêm, không phải do lớp lấp.
  Nhóm C — 34.7 `Bhaddālisuttaṁ niṭṭhitaṁ pañcamaṁ.`: dịch theo khuôn colophon đã có của lớp lấp (“<tên bài> is finished—the <thứ tự>.”) với tên bài đã ghim “With Bhaddāli”: “With Bhaddāli is finished—the fifth.”
  Nháy: cả 15 khoá khớp Pāli; 9.7/9.11/9.15 đóng bằng ’ đúng như `ti` của Pāli.

  Cố ý lệch tầng đã ghim: 9.7/9.11/9.15 chọn lời của 9.3 thay vì 9.19 (nhóm D) vì 9.19 mang dấu `…` không có ở Pāli.

