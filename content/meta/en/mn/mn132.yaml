notes: |-
  **Phân loại 59 khoá (đo bằng máy): A = 15 · B = 16 · C = 28 · D = 0.**

  **Bối cảnh:** tầng ghim chỉ dịch câu hỏi (`4.1`, `5.1`, …, tự thêm `…` ở bảy khoá Pāli viết đủ) rồi bỏ trống toàn bộ phần phân tích, hai câu kệ lặp ở `10.x`, và thay `13-19.1` bằng một câu tóm “And the Buddha repeated the verses and analysis once more.” Lớp lấp dịch đủ phần Pāli có thật.

  **A (15):** kệ `10.3–10.14` ← `3.4–3.15` (Pāli trùng nguyên văn, chép nguyên lời tầng ghim); `12.3`, `13-19.15` ← `3.16`; `12.4` ← `10.16`.

  **B (16):** `12.1`, `13-19.13` ← `10.1` (1,00, gồm cả `‘`); `13-19.16` ← `10.16` (1,00, thêm `”` theo Pāli); `4.3`, `5.3`, `6.6`, `7.6`, `8.8` dựng theo khuôn “That’s how you … ” của `9.8` (0,81–0,97); `13-19.2`, `13-19.3`, `13-19.5`, `13-19.7`, `13-19.9–13-19.12` dựng từ câu hỏi `4.1–9.1` và `9.8` (0,82–0,96), giữ hô ngữ “Ānanda” vì người nói đã đổi sang Đức Phật (tầng ghim bỏ hô ngữ `āvuso` ở `4.1`/`9.8`, nhưng ở đây tên người nghe mang thông tin).

  **C (28):** phần phân tích `4.2`, `5.2`, `6.2–6.5`, `7.2–7.5`, `8.2–8.7`, `9.2–9.7`; `13-19.4`, `13-19.6`, `13-19.8` (cùng khuôn “That’s how you …, Ānanda.”, tỉ lệ dưới 0,80); `12.2`/`13-19.14` (chỉ `…pe…` ⇒ `…`); colophon `13-19.19`. Từ vựng theo tầng ghim (“muster delight”, “run back to the past”, “anticipate the future”, “falter amid presently arisen phenomena”, “choices” cho `saṅkhārā`, “unlearned ordinary person”, “true persons”).

  **Cố ý không theo dạng trích dẫn quen thuộc:** Pāli `4.2`, `5.2`, `6.2`, `6.5`, `7.2`, `7.5` viết `…ahosiṁ atītamaddhānanti` **không** có dấu nháy. Để nháy khớp Pāli từng khoá (0 = 0), lớp lấp dịch thành lời gián tiếp (“thinking that you had such form in the past”) thay vì `‘I had such form in the past.’`. Nghĩa không đổi; ghi lại để người sau biết đây là lựa chọn có lý do.

  **Pāli viết đủ ⇒ lớp lấp viết đủ:** `4.2` và `5.2` viết đủ năm uẩn (không `…pe…`), nên lớp lấp viết đủ năm vế, không rút gọn. **Dấu lược:** Pāli 19 dấu (đếm `…pe…` = 1), lớp lấp 19, khớp từng khoá.

  **Nháy:** 59/59 khoá khớp Pāli.

  **Đo hai cơ chế khoá trống:** cắt cụt dãy = 7 dãy / 54 khoá / 2.202 ký tự Pāli; bỏ dòng song song = 18 nhóm / 46 khoá.

  **Coverage:** mẫu số 40; trước 16/40 = 0,40 (**dưới ngưỡng**); sau khi `published` 40/40 = 1,0. Độ nhạy: mất thêm hơn 8 khoá mới rớt dưới 0,8. 35/59 khoá lấp dưới 40 ký tự (dòng kệ, `…`) nên không vào mẫu số. Bài **có** record trong `content/meta/reference-gaps.yaml`; sau khi `published` record thành thừa — để người điều phối chạy lại `npm run reference:gaps`.

  **Vì sao điểm thấp hơn:** 28 khoá C dịch thật; lời gián tiếp ở các khoá `nandiṁ samanvāneti` kém tự nhiên hơn dạng trích dẫn ⇒ `vietnamese_clarity` (rõ nghĩa ngôn ngữ đích) 9.1, `grammar_logic` 9.2.

  Triangulation 8.0 (trần của luật): scorecard tiếng Việt của bài này (`content/meta/sutta/…`) ghi `quality.assessed_by` **trùng họ công cụ** với lớp lấp (alias khai trong `source/tooling.yaml`). Vì vậy bản lấp này **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English nhờ lớp lấp. Đối chiếu đã có: Pāli root (authority) + lời Sujato đã ghim của chính bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

  Tự kiểm bằng máy trước khi ghi: JSON parse; mọi khoá ⊆ `fillableSegments` của bài; không khoá nào trùng khoá tầng Sujato đã có chữ (0 shadow); NFC; không khoá rỗng; dấu lược đếm theo luật `…pe…` = đúng một `…` — khớp Pāli ở mọi khoá; nháy đếm theo luật `’` + chữ thường = dấu nháy lửng (apostrophe) tiếng Anh, còn lại là nháy đóng.

  technical_integrity 9.6: lát này không được chạy cổng kỹ thuật, nên **không** tuyên bố technical gate pass. Bốn lệnh còn nợ cho người điều phối: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Đây không phải blocker (cổng chặn ở validation failure, không chặn ở chưa chạy).
