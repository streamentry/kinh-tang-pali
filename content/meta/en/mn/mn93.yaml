notes: |-
  **Phân loại 52 khoá (đo bằng máy trên Pāli root và tầng Sujato đã ghim): A dùng lại nguyên văn = 32 · B dựng lại = 18 · C tự dịch = 1 · D báo = 1.** A gồm cả khoá lặp nguyên văn một khoá lấp trước đó trong cùng bài; B là Pāli gần (tỉ lệ khớp từ 0,6) một khoá đã có lời, chỉ chèn phần tầng ghim nuốt mất; D là Pāli trùng nguyên văn với khoá đã ghim nhưng lời đã ghim khác nhau, hoặc lớp lấp cố ý lệch (nêu từng khoá bên dưới).

  **Cấu trúc của bài:** Assalāyana tranh luận bốn lần, mỗi lần Đức Phật hỏi lại cùng một câu “Ettha, assalāyana, brāhmaṇānaṁ kiṁ balaṁ …” rồi Assalāyana nhắc lại luận điểm “brāhmaṇova seṭṭho vaṇṇo, hīno añño vaṇṇo …pe… brahmadāyādā”. Tầng đã ghim dồn luận điểm vào một câu (“Even though you say this, still the brahmins maintain their belief.”) ở 6.1, 7.1, … và nuốt hai khoá tiếp theo (hai nửa của luận điểm). Hai phần này chiếm 25 trong 52 khoá lớp lấp.
  **B (18 khoá), tách theo nhóm:**
  · **6.2 (B 0,96, nguồn 5.4) và 11 khoá lặp lại nguyên văn (A): 6.8, 7.2, 7.15, 8.2, 8.13, 9.2, 9.13, 10.2, 10.12, 11.2, 12.2.** `‘brāhmaṇova seṭṭho vaṇṇo, hīno añño vaṇṇo …pe…` được dịch “‘Only brahmins are the best class; other classes are inferior …” — lấy nguyên lời 5.4, một `…` thay `…pe…`. Mười hai khoá này giống nhau từng chữ.
  · **6.3 và 6.9 (B, nguồn 18.5; còn lại là A lặp lại 6.3: 7.3, 8.3, 9.3, 10.3, 11.3, 12.3, và 6.9: 7.16, 8.14, 9.14, 10.13).** `brahmadāyādā’”ti.` / `…’”ti?` dịch “heirs of the Divinity.’”” và “heirs of the Divinity’?”” (lấy chữ cuối của 18.5; 18.5 đã ghim trọn cả câu “Only brahmins are the Divinity’s bosom sons … heirs of the Divinity.’”). Đây là phần Pāli *sau* `…pe…`, nên lớp lấp chỉ dịch chữ Pāli có trong khoá; câu dài ở 18.5 là do tầng ghim mở rộng `…pe…`.
  · **7.10–7.12, 9.8–9.10, 10.7 (B 0,70–0,75, nguồn 5.3, 9.6, 10.10); 8.8–8.10 và 10.8, 10.9 lặp lại 7.10–7.12 và 9.9, 9.10 (A).** Chuỗi “brāhmaṇopi hi … vessopi hi … suddopi hi …” sau khi lược. Tầng ghim đã dồn nghĩa vào 7.9, 8.7, 9.7, 10.10 (“If they acted the same way, the same result would befall an aristocrat, a brahmin, a peasant, or a menial.”). Lớp lấp dịch từng cụm “For a brahmin, too, worthy Gotama …” bằng các danh xưng của tầng ghim (aristocrat, brahmin, peasant, menial). 10.7 thêm vế “is capable of taking some bathing cleanser, going to the river, and rinsing off dust and dirt” lấy từ 10.5.
  · **11.19 (B, 1,0, nguồn 5.7).** `brāhmaṇāva brahmuno puttā …’”ti?` lấy nguyên lời 5.7 (“Only brahmins are the Divinity’s bosom sons …”), đóng nháy theo Pāli.
  · **18.7, 18.8, 18.16, 18.17, 18.60, 18.65 (B, 0,93 / 0,74 / 1,0 / 0,99 / 0,95 / 1,0).** Lời Devala đã ghim ở 18.12–18.13, 18.58, 18.63, 18.39 và 5.4; lớp lấp dùng lại đúng cụm. **18.7** có `kira` (“it is said”), nên dịch “Apparently, …” thay cho “I heard that” (của 18.39, chứa `sutaṁ metaṁ, bho`, không có ở 18.7).
  · **19.4 (B, 0,61)** “With Assalāyana is finished—the third.”
  **C (1 khoá): 3.3.** Pāli `… tiṇṇaṁ vedānaṁ pāragū …pe… anavayo.` — sau chỗ lược chỉ còn `anavayo` (“không thiếu gì”). Tầng ghim ở 3.1 dịch cả đoạn thành “well versed in cosmology and the marks of a great man”, nhưng phần “cosmology…” nằm trong khúc Pāli bị lược. Lớp lấp dịch trần: “He has mastered the three Vedas … and lacks nothing.”, không kéo thêm “cosmology…”. Ghi nhận bất định.
  **A (32 khoá):** 4.13, 4.14, 4.15, 11.16, 11.17, 11.18 (từ khoá đã ghim) và 26 khoá lặp lại một khoá lấp trước (nhóm B ở trên).
  **D (1 khoá): 18.9.** Pāli `brahmadāyādā’ti.` trùng nguyên văn với 18.5, mà tầng ghim đặt ở 18.5 cả câu dài “Only brahmins are the Divinity’s bosom sons, born from his mouth, …, heirs of the Divinity.’” (nuốt luôn vế đã lược ở 18.4). Lấy nguyên văn sẽ lặp một câu đã dài gấp bảy lần Pāli của khoá; lớp lấp dịch đúng chữ Pāli của 18.9 (“heirs of the Divinity.’”). Đây là cố ý lệch, ghi nhận, và là bằng chứng 18.3–18.5 đã mở rộng `…pe…` (ngoài lát).

  Dấu lược: 26 khoá lớp lấp có `…`, khớp Pāli. Tầng ghim có 3 khoá lệch số dấu lược với Pāli (7.6, 18.3, 18.4 thiếu `…`) — ngoài lát, chỉ báo. Nháy: khớp Pāli ở cả 52 khoá.

  **Khoá còn trống:** 0 trong 52 khoá `fillableSegments` (đã lấp hết; đo bằng máy: không còn khoá Pāli nào của bài thiếu cả tầng Sujato lẫn lớp lấp). **Coverage** (Pāli ≥ 40 ký tự, bỏ khối `:0`): trước 127/150 = 0.8467; sau khi `published` 150/150 = 1.0000. Độ nhạy: ngưỡng 0,8 cho phép thiếu tối đa 30 khoá có nội dung (phần nguyên của 0,2 × 150); trước lát bài thiếu 23. `content/meta/reference-gaps.yaml` **không** có record của bài này (coverage trước đã ≥ 0,8), nên không có record nào thành thừa vì lát này.

  **Triangulation 7.8.** Bản Việt canonical của bài (`content/meta/sutta/mn/mn93.yaml`) do cùng họ công cụ làm, rà soát hoặc chấm với lớp lấp (đối chiếu `translators` / `assessed_by` / `reviewers` với `source/tooling.yaml`), nên lớp lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English của lớp này. Đối chiếu thực có: Pāli root + tầng Sujato đã ghim (192/244 khoá có lời) + bản Việt canonical để đối chiếu nghĩa (không dịch vòng, không chép). Không có bản Anh độc lập nào cho 52 khoá lớp lấp, nên chấm không quá 8,0.

  **technical_integrity 9.6:** không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối. Không đặt blocker vì chưa chạy.
