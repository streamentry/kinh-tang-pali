notes: |-
  20.2 và 22.2 là hai vế sau hai câu ẩn dụ đã ghim ở 20.1 và 22.1 ("It’s like how the
  sunlight fills the space when the shadow leaves, or the shadow fills the space when
  the sunshine leaves. …"). `evameva kho, bhikkhave` dịch "In the same way,
  mendicants," theo khuôn đã ghim 4 lần ("In the same way, mendicants, give up what
  isn’t yours"…). Phần vế sau lấy nguyên văn:
  - 20.2 ← 19.4 / 20.7: "when pleasure not of the flesh ceases, the rapture of
    seclusion arises; and when the rapture of seclusion ceases, pleasure not of the
    flesh arises."
  - 22.2 ← 21.4 / 22.7: "when neutral feeling ceases, pleasure not of the flesh
    arises; and when pleasure not of the flesh ceases, neutral feeling arises."

  4.3 = `yadi rūpasaññānaṁ yadi arūpasaññānaṁ yadi ekattasaññānaṁ yadi nānattasaññānaṁ.`
  — danh sách `saññānaṁ`. Bản đã ghim đã dịch đúng danh sách này ở 4.4 ("…whether of
  form or of formlessness or of unity or of diversity"), nên lấy nguyên bộ từ đó.

  BẤT ĐỊNH VÀ HỆ QUẢ NGƯỜI ĐỌC THẤY, ghi thẳng: vì 4.4 đã mang sẵn danh sách ấy,
  bản dịch của 4.3 sẽ khiến người đọc gặp nó HAI LẦN liền nhau. Pāli 4.2–4.4 vốn là
  một câu: 4.2 kết bằng `akkhāyati—` (gạch dài), 4.3 là phần "yadi… yadi… yadi… yadi…",
  4.4 mới sang câu mới. Nhưng bản đã ghim ở 4.2 đã thay gạch dài bằng dấu chấm, và 4.4
  đã nhảy cóc sang giữa danh sách ấy. Dịch 4.3 một mình không có chỗ bám khác, và bỏ
  thì khoá thành orphan. Vì vậy viết thành câu độc lập, chữ hoa đầu, với đúng bộ từ của
  4.4. `vietnamese_clarity` hạ 8.8 và `ambiguity_integrity` 9.0 vì lựa chọn này.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
