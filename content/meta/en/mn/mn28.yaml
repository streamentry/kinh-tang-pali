notes: |-
  BẢN DỊCH LẤP 6 KHOÁ, TẤT CẢ ĐỂ TRỐNG Ở TẦNG ĐÃ GHIM; không blockquote tham chiếu, không Pāli rỗng, không `…pe…`, nên không có khoá nào bị bỏ.

  5/6 KHOÁ LÀ GHÉP CÁC CÂU ĐÃ GHIM, KHÔNG DỊCH LẠI:
  - 10.6 = 25.1 + tiền tố `evameva kho` + 25.2. Dùng y nguyên “While recollecting the Buddha, the teaching, and the Saṅgha in this way, equanimity based on the skillful may not become stabilized in them.” và “In that case they stir up a sense of urgency:”.
  - 10.7 = 10.3 + 10.4 ghép làm một. Dùng y nguyên “‘It’s my loss, my misfortune, ” và “that while recollecting the Buddha, the teaching, and the Saṅgha in this way, equanimity based on the skillful does not become stabilized in me.’”
  - 25.6 = 25.1 + tiền tố `evameva kho`.
  - 25.8 = 25.3 **nguyên văn, kể cả dấu phẩy cuối** (Sujato đã ghim 25.3 là `‘It’s my loss, my misfortune, ` — có dấu phẩy dù Pāli kết bằng dấu chấm; giữ nguyên để 25.8 không lệch).
  - 25.9 = 25.4 **nguyên văn** (Pāli 25.9 chỉ khác 25.4 một dấu phẩy sau `saṅghaṁ anussarato`).
  Thuật ngữ đếm được: `upekkhā kusalanissitā` → “equanimity based on the skillful” (đã ghim ở 10.1 / 10.4 / 25.1 / 25.4 và lặp lại ở 13–14, 18–20, 38 — dùng y hệt); `saṁvegaṁ āpajjati` → “stir up a sense of urgency”; `suṇisā sasuraṁ` → “a daughter-in-law … father-in-law”.

  BẤT ĐỊNH ĐÃ GHI — 38.15 KHÔNG CÓ TIỀN LỆ NÀO Ở BẤT CỨ ĐÂU:
  `Mahāhatthipadopamasuttaṁ niṭṭhitaṁ aṭṭhamaṁ.` Đếm bằng script trên toàn bộ corpus Pāli đã ghim: có **186** khoá Pāli khớp `suttaṁ niṭṭhitaṁ`, và **186/186** đều để trống ở tầng Anh đã ghim — nghĩa là Sujato không dịch dòng kết bài nào, và thư mục tra cứu toàn văn `.cache/upstream/suttacentral/ref/en` rỗng. Vì vậy đây là khoá **không có** bản Anh nào để đối chiếu, và nó là lý do `triangulation` của bài này không cao hơn 8.0 cùng `ambiguity_integrity` hạ 9.0. Cách dịch đã chọn, và tiền lệ đo được trong chính lớp lấp: `an3.70:40.6` (`Mahāvaggo sattamo.`) → “The Great Chapter, seventh.” — cùng cấu trúc “tên + số thứ tự”. Dùng tiêu đề đã ghim ở 0.2 (“The Longer Simile of the Elephant’s Footprint”) và giữ cả `niṭṭhitaṁ` (“is concluded”), vì bản Việt cũng có “kết thúc”.

  HỆ QUẢ NGƯỜI ĐỌC SẼ THẤY — 25.7 VẪN ĐỂ TRỐNG:
  `So tena saṁvijjati saṁvegaṁ āpajjati:` (25.7) dài **39** ký tự, dưới ngưỡng Pāli có nội dung 40 ký tự khai ở `source/layers.yaml`, nên không tính coverage và không vào lát này — dù Sujato cũng để trống nó. Kết quả: đọc cột Anh sẽ thấy 25.6 (lớp lấp) → 25.7 rỗng → 25.8 (lớp lấp) “‘It’s my loss, my misfortune,” mà mất câu “In that case they stir up a sense of urgency:”. Báo lại để coordinator; lát này không tự thêm khoá ngoài danh sách.

  TRIANGULATION 8.0, KHÔNG CAO HƠN: lớp lấp do chính người chấm viết; riêng 38.15 còn không có bản Anh nào phủ ở commit đang ghim.

