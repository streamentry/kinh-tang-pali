notes: |-
  Phạm vi: 75 khoá lấp, là toàn bộ khoá Sujato để trống có Pāli (68 khoá có nội dung ≥ 40 ký tự; 7 khoá ngắn hơn gồm nhãn kết bài `20.5` và các khoá `…pe…` ngắn). Không còn khoá trống nào của bài ngoài danh sách. Bài dựng hai lần cùng một khuôn (bốn đàn nai 3–6, bốn nhóm sa-môn bà-la-môn 8–11) nên phần lớn khoá lặp lại câu đã ghim ở nửa kia.

  Bốn nhóm (đo bằng máy trên Pāli chuẩn hoá, bỏ dấu câu và hoa/thường, `…pe…` giữ làm một mã): A=39 · B=25 · C=8 · D=3. Xử lý thực tế: 38 khoá dùng lại nguyên văn lời Sujato của khoá có Pāli trùng (chỉ đổi loại nháy cho khớp Pāli khoá đích, vd. `‘The first …` thành `“The first …` ở 5.5/6.5/6.11); 6 khoá chép lại từ một khoá lấp khác cùng Pāli; 31 khoá viết mới (nhóm B dựng lại, nhóm C tự dịch, nhóm D chọn tay).

  Nhóm B (khoá ← khoá nguồn gần nhất, tỉ lệ khớp Pāli): 4.3 ← 8.2 (0.9); 4.11 ← 8.2 (0.9); 5.13 ← 8.2 (0.9); 5.18 ← 5.16 (0.81); 6.19 ← 5.16 (0.87); 6.20 ← 5.16 (0.71); 6.21 ← 5.19 (0.92); 6.22 ← 5.20 (0.76); 6.23 ← 5.21 (0.76); 6.26 ← 5.24 (0.96); 6.30 ← 5.16 (0.81); 9.6 ← 9.7 (0.9); 10.8 ← 9.7 (0.67); 10.9 ← 4.6 (0.71); 10.12 ← 9.12 (0.69); 10.18 ← 8.1 (0.64); 10.19 ← 8.2 (0.76); 11.5 ← 6.2 (0.83); 11.8 ← 9.7 (0.62); 11.12 ← 11.10 (0.92); 11.15 ← 9.7 (0.62); 11.17 ← 10.17 (0.78); 11.20 ← 8.1 (0.64); 11.24 ← 10.20 (0.71); 11.30 ← 11.28 (0.83). Phần tầng ghim nuốt mà lớp lấp chèn lại: (a) 4.3, 4.11, 5.13: Sujato gộp “anupakhajja … madaṁ āpajjiṁsu …” vào 3.1/4.2 và để trống khoá thân; bản lấp dựng từ lời 3.1 (encroached · recklessly enjoyed eating · indulgent · negligent · the sower was able to do what he wanted). (b) 5.18, 6.20, 6.30, 10.19, 11.30, 11.20–11.23: câu “dựng chỗ ở · ăn không buông thả · không say sưa · không phóng dật · không bị sai khiến” dựng từ lời 5.16/6.28/10.16/11.28 đổi sang thì quá khứ (Pāli `bhuñjiṁsu`, `ahesuṁ`). (c) 6.19 = nối đúng 5.15 + 5.16 (Pāli 6.19 dồn hai khoá). (d) 6.22/6.23 tách đúng chỗ Pāli ngắt (`paribhuñjanti.` | `Na ca nesaṁ jānāma…`) từ lời 5.20/5.21. (e) 10.12 = 9.10 + 9.11 + 9.12 nối. (f) 10.14 (Māra) giữ lời 8.2.

  Nhóm D (Pāli trùng, lời Sujato khác nhau, không tự hoà mà chọn theo ngữ cảnh và báo): 5.12 và 10.13 (Sujato 4.10 `Encroaching, they recklessly enjoyed eating it …` so với 9.13 `Intruding on that place, they recklessly enjoyed eating them …`): lấy theo nửa bài (đàn nai / Māra) và BỎ dấu `…` thừa vì Pāli viết đủ; 6.13 (Pāli = 5.4 = 6.4, Sujato `and second herds of deer …` / `second …`): không chép mảnh vỡ, dịch đủ câu `And the second herd of deer thought up a plan,`.

  Chỗ cố ý lệch, kèm lý do: (1) `ananupakhajja amucchitā` (5.16, 6.28, 10.16, 11.28 đã ghim) được Sujato dịch `encroach … without being reckless` (không dịch phủ định `an-`); bản Việt canonical dịch là “không xông vào, không mê say”. Lớp lấp theo lời Sujato để bài không tự mâu thuẫn, nhưng đây là BẤT ĐỊNH CHƯA PHÂN XỬ: nếu đọc sát chữ thì là `without encroaching`; nếu tầng ghim đổi, các khoá 5.18, 6.19, 6.20, 6.30, 10.18, 10.19, 11.17, 11.18, 11.20–11.23, 11.30 phải xem lại. Vì vậy hạ semantic_fidelity và ambiguity_integrity. (2) 9.6: Pāli `vihareyyāmāti` (động từ ước + `ti`, không dấu nháy) trong khi 9.5 đã đóng nháy và 9.7 lặp lại với `vihariṁsu`; nghi vấn văn bản, không phân xử được. Dịch sát chữ: `…thinking they would live there`. (3) 11.18: Pāli `lokāmiseti` không có dấu nháy nhưng khoá anh em 11.28 đã ghim đóng bằng `’`; chép nguyên 11.28, nên ở khoá này Pāli có 0 dấu nháy còn English có 1 (`’`): ngoại lệ theo khoá anh em, đã đo. (4) 11.24 và 11.25 không đặt ‘…’ quanh các quan điểm vì Pāli không có dấu (Sujato 10.21–10.24 có): giữ đúng một `…` cho `…pe…`. (5) 11.5 thêm danh từ `group of ascetics and brahmins` (Pāli có `samaṇabrāhmaṇā`) trong khi các khoá A 6.5, 6.11, 6.14 dùng nguyên văn `The first …` (bỏ danh từ) như Sujato ở 6.2. (6) 10.10: `…pe…` giữa câu, `survived` lấy từ động từ `yāpesuṁ` bị lược, theo 9.8.

  Quan sát tầng ghim (ngoài lát, không sửa): Sujato tự thêm `…` ở 9 khoá mà Pāli viết đủ (4.2, 4.10, 5.4, 6.4, 6.10, 9.2, 9.13, 10.4, 11.4); lớp lấp không sao chép dấu đó.

  Nháy: đo từng khoá, khớp Pāli ở mọi khoá trừ 11.18 (ngoại lệ trên).

