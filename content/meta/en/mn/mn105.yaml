notes: |-
  BẢN DỊCH LẤP 6 KHOÁ (2.4, 2.5, 4.3, 4.4, 5.1, 5.2), TẤT CẢ ĐỂ TRỐNG Ở TẦNG ĐÃ GHIM; không blockquote tham chiếu, không Pāli rỗng, không `…pe…`, nên không có khoá nào bị bỏ.

  `pajānāmā` PHẢI GIỮ — ĐÂY LÀ CHỖ SỬA ĐƯỢC RA TỪ MÁY KIỂM LUẬT 3:
  Chuỗi `khīṇā jāti, vusitaṁ brahmacariyaṁ, kataṁ karaṇīyaṁ, nāparaṁ itthattāyāti pajānāmā` lặp **bốn** lần trong bài (2.2, 2.5, 4.3, 5.2) và Pāli giữ `pajānāmā` ở cả bốn. Bản dịch đầu tiên của lát đã bỏ mất “We understand”, và kiểm tra tự động (so từng từ nội dung của bản đã ghim với bản lấp) bắt được ngay. Đã sửa, không giấu.

  CÁCH ĐÃ CHỌN, CÓ TIỀN LỆ ĐẾM ĐƯỢC:
  - `mn80:15.4` (đã ghim) dịch đúng chuỗi `khīṇā jāti … nāparaṁ itthattāyāti—pajānāmā’ti` thành `‘We understand: “Rebirth is ended, the spiritual journey has been completed, what had to be done has been done, there is nothing further for this place.”’` — tức Sujato đưa `pajānāmā` lên đầu và đặt công thức trong ngoặc kép. Lấy **nguyên văn** chuỗi này cho cả ba khoá.
  - `mn105:2.2` (đã ghim, cùng bài) là ảnh phản: `“We understand: ‘Rebirth is ended, … this place.’”`. Vì 2.5 có `’”ti` (ngoặc trong ngoặc) nên lấy hình của mn80:15.4; 4.3 và 5.2 trùng nhau tuyệt đối từng chữ nên phải y hệt nhau và cũng lấy hình đó.
  - Đối chiếu: Sujato ở 4.5 (đã ghim) **lược** cả công thức lẫn `pajānāmā`, chỉ dịch phần sau dấu phẩy. Không nhân bản cách lược đó ở 4.3, vì 4.3 là khoá phải mang nghĩa và không có phần sau dấu phẩy nào để dựa vào.

  Đo bằng cách so từng khoá với toàn bộ Pāli của bài: 4.3 và 5.2 **trùng nhau tuyệt đối** từng chữ, 2.5 khác chỗ đóng ngoặc. Tiền lệ chéo khác: `an6.60:11.3` dịch cùng công thức (không kèm `pajānāmā`) thành “Rebirth is ended; … there is nothing further for this place.” với dấu chấm phẩy — ta giữ dấu phẩy theo 2.2 vì 2.2 nằm cùng bài.

  BA KHOÁ DẪN NHẬP:
  - 2.4 (`“sambahulehi kira bhikkhūhi bhagavato santike aññā byākatā hoti:`): 4.2 đã ghim đúng cụm này thành “several mendicants have declared their enlightenment in the Buddha’s presence.” Đếm `sambahulehi kira bhikkhūhi` trong tầng Anh đã ghim: chỉ **1** chỗ (4.2 của chính bài này), nên lấy y hệt. `kira` → “It seems”; `byākatā` → “declared”.
  - 4.4 (`Ye te, bhente, bhikkhū bhagavato santike aññaṁ byākaṁsu:`) và 5.1 (cùng cấu trúc, `mama` thay `bhagavato`): dùng “declared their enlightenment” cho `aññaṁ byākaṁsu` — cùng từ Sujato dùng ở 2.1, 4.2, 4.5. 4.4 giữ “Sir” cho `bhante`; 5.1 giữ “Sunakkhatta” đúng như 5.3 đã ghim (“Some of them did so rightly, Sunakkhatta, …”).

  BẤT ĐỊNH ĐÃ GHI — LỚP NGOẶC Ở BA KHOÁ:
  2.4 mở lời dẫn bằng `“`, 2.5 là lời các vị tỳ-kheo trong `s overheard` mà người kể nghe được, nên 2.5 mang `‘…’”ti` (dấu nháy đơn ngoài, nháy kép trong). 4.3 và 5.2 có Pāli đóng `’ti.` và mở lời dẫn bằng `“` / không mở dấu, nhưng vì 4.3 và 5.2 **trùng nhau tuyệt đối** nên phải dịch giống hệt, và hình đã ghim ở mn80:15.4 cho phép dùng chung hình với 2.5. Hệ quả người đọc bốn cột sẽ thấy: 2.5, 4.3, 5.2 có cùng nội dung Pāli và cùng lớp ngoặc — đúng luật 3 — nhưng khác với 2.2 đã ghim (ảnh phản: ngoặc kép ngoài, nháy đơn trong). `ambiguity_integrity` 9.3 vì lớp lấp phải tự quyết lớp ngoặc ở cả ba khoá.

  TRIANGULATION 8.0, KHÔNG CAO HƠN: lớp lấp do chính người chấm viết.

