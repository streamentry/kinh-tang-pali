notes: |-
  BẢN DỊCH LẤP 6 KHOÁ, TẤT CẢ ĐỂ TRỐNG Ở TẦNG ĐÃ GHIM; không blockquote tham chiếu, không Pāli rỗng, nên không có khoá nào bị bỏ.

  DẤU LƯỢC — 3.3 VÀ 4.8 CÓ `…pe…`, GIỮ **ĐÚNG MỘT** `…`:
  `Tassa kālaṅkiriyāya bhinnā nigaṇṭhā dvedhikajātā …pe… bhinnathūpe appaṭisaraṇe”ti.`
  Không mở rộng `…pe…` thành liệt kê (đây là ký hiệu lược của bilara, không phải chữ). Vế đầu chép y nguyên 2.2 đã ghim (“With his passing the Jain ascetics split, dividing into two factions”), vế sau chép y nguyên cụm 2.5 đã ghim (“with broken monument and without a refuge”). Dấu lược làm nhiệm vụ của `bhaṇḍanajātā kalahajātā vivādāpannā aññamaññaṁ mukhasattīhi vitudantā viharanti` ở 2.2 — đúng như Sujato đã làm với các đoạn lược khác.

  LUẬT 3 — 3.2 = 4.7 (Pāli đồng nhất từng chữ, chỉ khác `“` / `‘`) nên chép một bản, và 3.3 = 4.8 (tương tự). Cả hai cặp đều là Cunda nói với Ānanda rồi Ānanda nói lại với Đức Thế Tôn, nên bắt buộc phải giống nhau — nếu dịch lại riêng thì bài tự mâu thuẫn.

  THUẬT NGỮ ĐẾM ĐƯỢC:
  - `nigaṇṭho nāṭaputto` → Sujato đã ghim ở 2.1 là “the Jain ascetic of the Ñātika clan” (2.2 / 2.5 dùng “the Jain ascetics” và “the Jain Ñātika”). Dùng y hệt 2.1.
  - `bhinnathūpe appaṭisaraṇe` → “with broken monument and without a refuge” (2.5 đã ghim).
  - 5.5: chuỗi `cattāro satipaṭṭhānā … ariyo aṭṭhaṅgiko maggo` chép **nguyên văn** 5.3 đã ghim (“the four kinds of mindfulness meditation, the four right efforts, the four bases of psychic power, the five faculties, the five powers, the seven awakening factors, and the noble eightfold path”), vế `dvepi bhikkhū nānāvāde` lấy đúng cách Sujato dịch ở 5.2 (“two mendicants whose opinion differs”). Đếm `nānāvāde` trong tầng Anh đã ghim: chỉ có **1** chỗ (chính 5.3 của bài này), nên không có tiền lệ nào khác để bịa.
  - `samaṇuddeso` → “novice” (3.1 đã ghim). `adhimānena` ở 4.5 đã ghim “out of overestimation”.

  BẤT ĐỊNH ĐÃ GHI:
  - 4.6 (`“ayaṁ, bhante, cundo samaṇuddeso evamāha:`) đứng ngay sau 4.5 đã ghim (“Ānanda informed him of what Cunda had said. He went on to say, ”). Vì vậy 4.6 chỉ cần mở lời dẫn tiếp: ““Sir, this novice Cunda said this:”. Bản Việt dùng “sa-di Cunda này nói như sau”, cùng cấu trúc.
  - `ayaṁ` có thể là “this” (chỉ hành động) hoặc “as follows”; chọn “this … said this” vì 4.7 / 4.8 là nội dung lời nói, không phải hành việc.

  TRIANGULATION 8.0, KHÔNG CAO HƠN: lớp lấp do chính người chấm viết; không có bản Anh độc lập phủ cho các khoá này ở commit đang ghim.

