notes: |-
  **Phân loại 11 khoá (đo bằng máy, so Pāli từng khoá với mọi khoá đã có lời Sujato trong bài, kể cả cửa sổ 2–4 khoá liền nhau): A = 1 · B = 6 · C = 1 · D = 3.**

  **A (1):** `3.17` Pāli trùng nguyên văn `3.10` ⇒ lấy nguyên văn “Still they meet their end by Aṅgulimāla’s hand.”

  **D (3) — báo, không tự hòa:** `3.15`, `10.3`, `10.4`. Pāli của chúng trùng nguyên văn với `2.2`/`2.3` (người kể, quá khứ: “He laid waste … He was constantly murdering …”) **và** với `3.7`/`3.8`, `8.3`/`8.4` (lời nói trực tiếp, hiện tại: “He has laid waste … He is constantly murdering …”). Tầng đã ghim tự chia thì theo người nói. Lớp lấp **không** hòa hai dạng mà chọn theo ngữ cảnh: cả ba khoá đều là lời nói trực tiếp (dân chăn bò ở `3.x`, vua Pasenadi ở `10.x`) ⇒ lấy dạng hiện tại của `3.8`/`8.3`/`8.4`.

  **B (6):**
  - `3.14` ← `3.5`+`3.6`+`3.7` (tỉ lệ khớp 1,00 sau chuẩn hoá dấu): Pāli `3.14` gộp ba câu mà lần nói thứ nhất tách thành ba khoá. Lớp lấp ghép nguyên lời ba khoá ấy; không thêm gì.
  - `3.16` ← `3.9` (1,00, chỉ khác dấu phẩy). Lấy nguyên văn.
  - `14.7` ← `3.1`/`14.1` (0,89): đổi ngôi sang “I” và thêm “Sir,” cho `bhante`.
  - `14.8` ← `14.2` (0,88): chèn “in Sāvatthī” (`sāvatthiyaṁ`) và “sir” — tầng ghim ở `14.2` không dịch `sāvatthiyaṁ`.
  - `14.9` ← `14.3` (0,82): “Seeing this, it occurred to me,”.
  - `14.10` ← `14.4`+`14.5`: lặp đúng câu “Oh, beings undergo such travail!” hai lần như Pāli.

  **C (1):** `18.67` (colophon, 36 ký tự, dưới ngưỡng 40): “With Aṅgulimāla is finished—the sixth.”, theo khuôn colophon đã có ở lớp lấp MN và tiêu đề Sujato `0.2`.

  **Đo hai cơ chế khoá trống (báo, không sửa):** cắt cụt dãy (≥ 4 khoá trống liền) = 2 dãy / 8 khoá / 737 ký tự Pāli; bỏ dòng song song = 1 nhóm / 2 khoá. Tầng ghim còn **tự thêm `…`** ở `10.2` (Pāli viết đủ) và có 3 khoá lời Anh ngắn hơn 35% Pāli (`10.1`, `12.5`, `12.7`) — dấu hiệu nén, không phải lỗi dịch. Lớp lấp không sao chép dấu `…` của `10.2`.

  **Hệ quả dễ thấy:** `14.6` của tầng ghim đã tóm “told him what had happened”, nên đọc liền `14.7–14.10` sẽ thấy câu chuyện được kể lại — đó là nội dung có thật trong Pāli, hiện ra thay vì bị giấu.

  **Nháy:** 11/11 khoá khớp Pāli từng khoá. **Dấu lược:** Pāli 11 khoá không có `…`; lớp lấp cũng 0.

  **Coverage (`englishCoverageFor`):** mẫu số 94 khoá Pāli có nội dung; trước 85/94 = 0,9043; sau khi `published` 94/94 = 1,0. Độ nhạy: phải mất thêm hơn 18 khoá mới rớt dưới 0,8. Bài **không** có record trong `content/meta/reference-gaps.yaml` (đã trên ngưỡng), nên không có record nào thành thừa vì lát này.

  Triangulation 8.0 (trần của luật): scorecard tiếng Việt của bài này (`content/meta/sutta/…`) ghi `quality.assessed_by` **trùng họ công cụ** với lớp lấp (alias khai trong `source/tooling.yaml`). Vì vậy bản lấp này **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English nhờ lớp lấp. Đối chiếu đã có: Pāli root (authority) + lời Sujato đã ghim của chính bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

  Tự kiểm bằng máy trước khi ghi: JSON parse; mọi khoá ⊆ `fillableSegments` của bài; không khoá nào trùng khoá tầng Sujato đã có chữ (0 shadow); NFC; không khoá rỗng; dấu lược đếm theo luật `…pe…` = đúng một `…` — khớp Pāli ở mọi khoá; nháy đếm theo luật `’` + chữ thường = dấu nháy lửng (apostrophe) tiếng Anh, còn lại là nháy đóng.

  technical_integrity 9.6: lát này không được chạy cổng kỹ thuật, nên **không** tuyên bố technical gate pass. Bốn lệnh còn nợ cho người điều phối: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Đây không phải blocker (cổng chặn ở validation failure, không chặn ở chưa chạy).
