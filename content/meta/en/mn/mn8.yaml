notes: |-
  **Bốn nhóm khoá (đo bằng script trên 43 khoá lấp): A = 0 · B = 0 · C = 43 · D = 0.** Không khoá nào trùng Pāli với
  khoá đã ghim có chữ, vì tầng ghim chỉ dịch **mục đầu và mục cuối** của mỗi chuỗi 44 phẩm chất ở phần 3–5.

  **C thật nhưng không dịch mới từ vựng.** Mỗi phẩm chất xấu/tốt đã có lời Sujato ở `12.2`–`12.45` (“steal”,
  “backbite”, “talk nonsense”, “covetous”, “acrimonious”, “offensive”, “contemptuous”, “pompous”, “conscienceless”,
  “imprudent”, “witless”…). Lớp lấp chỉ đặt từ ấy vào khuôn câu mà chính tầng ghim dùng ở khoá đầu của chuỗi:
  - `16.6`–`16.46` theo `16.5`: “An individual who kills extinguishes it by not killing.” → mỗi khoá một câu
    “… extinguishes it by …”;
  - `14.4` (một khoá Pāli chứa mười mệnh đề, chánh kiến → chánh giải thoát) theo `14.3`: “… bypasses it by …”, mười câu.
  - Mặt tốt dùng đúng chữ mặt tốt của `12.x` khi Pāli có danh từ riêng (`sovacassatā` → “being easy to admonish”,
    `kalyāṇamittatā` → “having good friends”, `bāhusaccaṁ` → “being well learned”, `paññāsampadā` → “being
    accomplished in wisdom”); `veramaṇī` → “not …-ing”, như `16.5` (“by not killing”).
  - `17.10` colophon → “Self-Effacement is finished—the eighth.” (tên từ `:0.2` đã ghim).

  **Cố ý lệch / điều phải nói thẳng.**
  1. `16.5` đã ghim kết bằng ` …` dù Pāli không có dấu lược (tầng ghim tự lược phần còn lại). Lớp lấp lấp đúng các
     khoá kế; vì thế cột English sẽ hiện `…` rồi vẫn có câu kế — hệ quả của tầng ghim, không sửa được mà không shadow.
  2. `14.5` đã ghim chỉ dịch **mục cuối** (chấp thủ kiến) của một khoá Pāli liệt kê **24** mục (202/1.519 ký tự);
     `14.3` chỉ dịch hai mục đầu của mười (121/718). Hai khoá này không thuộc tập lấp (đã có chữ) nên coverage tính
     chúng là “đã phủ” — dấu hiệu cắt cụt, **báo, không sửa**.
  3. `abrahmacariyā veramaṇī` → “by not being unchaste”, theo `12.5` (“we will not be unchaste”), không “by being chaste”.

  **Dấu lược / nháy:** Pāli 43 khoá không có `…` và không có nháy; lớp lấp 0 `…`, 0 nháy (đo).

  **Hai cơ chế khoá trống, đo trên 43 khoá:** cắt cụt dãy **1** dãy / **41** khoá (`16.6`–`16.46`) / 2.605 ký tự; bỏ dòng
  song song **3** nhóm / **42** khoá (≤ 43). Tầng ghim có 2 khoá có chữ < 30% Pāli (`14.3`, `14.5`).

  **Coverage.** Mẫu số 140. Trước 98/140 = **0,7000**. Sau khi `published`: 140/140 = **1,0** (42 khoá có nội dung; `17.10`
  dưới 40 ký tự). Độ nhạy: mất ≥ 29 khoá lấp mới rớt ngưỡng; không `published` ⇒ 0,70.
  `content/meta/reference-gaps.yaml` **có** record `mn8`; thành thừa sau khi `published` — lát không chạm.

  Triangulation 8.0: scorecard Việt của bài này (`content/meta/sutta/mn/mn8.yaml`) do **cùng họ công cụ** với lớp lấp chấm/dịch (đối chiếu alias trong `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập và scorecard Việt của bài **không** được tuyên bố là đã đối chiếu English độc lập. Nguồn đã đối chiếu: Pāli root đã ghim + Sujato đã ghim (mọi khoá có chữ) + bản Việt canonical (chỉ để đối chiếu nghĩa, không dịch vòng).

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối. Không đặt blocker vì “chưa chạy” không phải “chạy mà đỏ”. Đã tự kiểm bằng script: JSON parse, mọi khoá ⊆ tập lấp, 0 khoá trùng khoá đã ghim có chữ (không shadow), NFC, không khoá rỗng, nháy kép/đơn khớp Pāli từng khoá (nhận `’` + chữ thường là dấu nháy lược), số `…` khớp Pāli (`…pe…` = một), `final_score` = trung bình thô.
