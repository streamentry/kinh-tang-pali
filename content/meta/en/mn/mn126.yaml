notes: |-
  **Phân loại 62 khoá (đo bằng máy): A = 30 · B = 27 · C = 2 · D = 3.** Cả 62 khoá nằm trong tập khoá tầng Anh đã
  ghim để trống. Bài là Bhūmija kể lại cho Đức Phật (`7.x`), rồi sáu ví dụ ngược/xuôi (dầu, sữa, bơ, lửa) lặp công thức
  “āsañca anāsañca… ”; tầng đã ghim dịch phần mở và nửa đầu các ví dụ, rút gọn nửa sau bằng `…`.

  **Nhóm 1 — `7.2`–`7.24`, kể lại (23 khoá), dựng lại từ `2.1`–`5.1`.** Tầng đã ghim gộp cả đoạn kể lại vào `7.1`.
  · B: `7.2` ← `2.1` (0,67); `7.3` ← `3.1` (0,70); `7.4` ← `3.2` (0,86); `7.21` ← `4.10` (0,84); `7.24` ← `5.1` (0,97); `7.7` ← `3.5` (0,40), `7.19`
    ← `4.8` (0,36), `7.20` ← `4.9` (0,46) có `…pe…`.
  · A: `7.5` ← `3.3`, `7.6` ← `3.4`, `7.9` ← `3.7`, `7.10` ← `3.8`, `7.12` ← `4.11`, `7.13` ← `4.2`, `7.14`–`7.17` ← `4.3`–`4.6`, `7.18` ← `4.7`, `7.22` ← `4.11`,
    `7.23` ← `4.12` (tất cả 1,00), đổi nháy kép sang đơn khi Pāli mở/đóng nháy đơn (`7.5`, `7.10`, `7.12`, `7.24`) và bỏ nháy mở
    của lời đã ghim khi Pāli không có (`7.6`, `7.14`).
  · C: `7.11` “When he said this, sir, I said to Prince Jayasena,”.
  · D: `7.8` — Pāli `āsañca anāsañcepi karitvā brahmacariyaṁ caranti, abhabbā phalassa adhigamāya;` có hai lời đã ghim khác nhau:
    `3.6` “If you both make a wish and don’t make a wish and lead the spiritual life, you can’t win the fruit.” (ngôi “you”) và `9.3`
    “they both do and do not make a wish,” (ngôi “they”, mảnh nối). Ngữ cảnh `7.8` là học thuyết của Jayasena (“you”), nên dùng `3.6`.

  **Nhóm 2 — D, `10.9`, `10.10`.** Cùng cặp Pāli trùng (`3.5`/`9.2` cho `10.9`; `3.6`/`9.3` cho `10.10`) nhưng ở đây ngữ cảnh là sa-môn/bà-la-môn tà kiến
  (“they”) giống `9.x`, nên dùng `9.2`, `9.3`: “they don’t make a wish,” và “they both do and do not make a wish,”. A: `10.11` ← `9.4`
  “or they neither do nor don’t make a wish.”.

  **Nhóm 3 — năm ví dụ áp dụng (`11`, `12`, `13`: tà kiến; `15`–`18`: chánh kiến).** Với mỗi ví dụ, tầng đã ghim có `…` ở đoạn mở “And so it
  is for any ascetics and brahmins who have wrong view …”, rồi để trống phần còn lại:
  · B: `11.9`, `12.9`, `13.9` ← `9.1` (0,55) “and wrong immersion. If they lead the spiritual life, they can’t win the fruit, regardless of
    whether they make a wish,” (lấy nguyên cấu trúc, chỉ cắt vế danh sách bát chánh đạo đã có ở `N.8`);
    `15.9`, `17.9`, `18.9` ← `14.1` (0,55) “and right immersion. If they lead … they can win the fruit, …”;
    `16.9` ← `14.1` (0,28) “and right immersion. Regardless of whether they make a wish …” (Pāli `sammāsamādhino te āsañcepi karitvā …pe…`).
  · B có `…`: `N.10`, `N.11` (N = 11, 12, 13, 15, 16, 17) ← `9.2`/`9.3` hoặc `14.2`/`14.3` (0,40–0,55): “they don’t make a wish …” và “they both do and do not make
    a wish …”. Pāli là `anāsañcepi karitvā …pe…` (hoặc `…` ở `17.10`, `17.11`).
  · A: `11.12`, `12.12`, `13.12` ← `9.4`; `15.12`, `16.12`, `17.12`, `18.12` ← `14.4` (“or they neither do nor do not make a wish.”);
    `18.10`, `18.11` ← `14.2`, `14.3`; mọi `N.13` ← `9.5`/`14.5` “Why is that?”.
  · C: `19.5` “With Bhūmija is finished—the sixth.” (đúng vị trí: `mn125` `pañcamaṁ`, `mn127` `sattamaṁ`).

  **Cố ý lệch tầng đã ghim — 15 khoá `…`.** Pāli `anāsañcepi karitvā …pe…`/`āsañca anāsañcepi karitvā …pe…` (và dạng `…` ở `17.10`–`17.11`)
  trùng nguyên văn với `11.3`, `11.4`, `12.3`, `12.4`, `13.3`, `13.4`, `15.3`, `15.4`, `16.3`, `16.4`, `17.3`, `17.4`, `18.3`, `18.4` ở phần ví dụ (đo: 14 khoá đã ghim có Pāli trùng — 7 khoá `anāsañcepi karitvā` và 7 khoá `āsañca anāsañcepi karitvā` — và lời đã ghim không có `…`), nơi tầng đã ghim dịch “didn’t make a wish,” / “both did and did not make a wish,” (quá khứ, ngôi ví dụ) và bỏ luôn `…`. Ở phần áp dụng
  chủ ngữ là “they” (hiện tại), nên chép nguyên văn sẽ sai thì/ngôi, và bỏ `…` là mở rộng dấu lược. Lớp lấp dùng “they don’t
  make a wish …” (theo `9.2`/`14.2`), giữ đúng một `…`. Ở `7.7`, `7.19`, `7.20` cũng vậy (“you … …”). Đếm: 16 khoá Pāli mang `…`, 16 dấu `…` ở lớp lấp.

  **Ngoặc.** Trong 62 khoá lấp có 7 khoá Pāli mang nháy (`7.2` mở “; `7.5` mở ‘; `7.9` ’; `7.10` ‘…’; `7.12` mở ‘; `7.23` ’; `7.24` ‘…’); đo bằng máy:
  lớp lấp khớp 7/7 từng khoá. Không có khoá lấp nào lệch nháy.

  **Khoá trống còn lại: 0.** 24 khoá trong 62 khoá dưới ngưỡng 40 ký tự Pāli nên không vào coverage nhưng vẫn lấp (đa số là `…pe…` hoặc `Taṁ kissa hetu?` 15 ký tự).
  38 khoá vào coverage.

  Triangulation 8.0: bản Việt canonical của bài (`content/meta/sutta/mn/mn126.yaml`) có cùng họ công cụ với lớp lấp này (đo bằng cách so `translators`/`reviewers`/`quality.assessed_by` với `source/tooling.yaml`), nên lớp lấp KHÔNG phải cách đọc English độc lập và bài này không được tuyên bố là đã đối chiếu English độc lập. Bản Việt chỉ được dùng để đối chiếu nghĩa, không dịch vòng qua nó.

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối; không đặt blocker vì “chưa chạy” không phải lỗi thật.

