notes: |-
  **Phân loại 201 khoá (đo bằng máy): A = 11 · B = 116 · C = 47 · D = 27.** Bài có 16 phẩm chất khiến khó/dễ
  được góp ý, đi qua bốn lượt: khó góp ý (`3.x`), dễ góp ý (`5.x`), soi vào người khác (`6.x`), tự xét (`7.x`). Tầng đã
  ghim dịch phẩm chất đầu và cuối của mỗi lượt, các phẩm chất giữa chỉ còn một câu kết bằng `…` (Pāli **không** lược), và
  để trống mọi khoá còn lại. Lớp lấp dựng 16 phẩm chất từ **chính lời mô tả của tầng đã ghim ở lượt `3.x`** (“glorifies
  themselves and puts others down”, “irritable, and acrimonious due to anger”, “when accused, they object to / rebuke /
  retort to the accuser”, “dodge the issue …”, “unable to account for the evidence”, “offensive and contemptuous”,
  “jealous and stingy”, “devious and deceitful”, “obstinate and arrogant”) rồi chia theo bốn khuôn câu đã ghim của bốn
  lượt — nên một phẩm chất đọc giống nhau ở cả bốn lượt.

  **D — 27 khoá, báo không hòa:**
  - 14 khoá `ayampi dhammo dovacassakaraṇo.` (`3.7` … `3.46`): đã ghim dịch hai cách — `3.4` “This is a quality …”
    và `3.49` “This too is a quality …”. Lớp lấp chọn lời `3.49` vì Pāli `ayampi` = “this **too**”.
  - 13 khoá `Sace panāvuso, bhikkhu paccavekkhamāno evaṁ jānāti:` (`7.11` … `7.85`): đã ghim `7.5` “But suppose …” và
    `7.91` “Suppose …”. Lớp lấp chọn `7.5` vì Pāli có `pana`.
  **A — 11 khoá:** `Sace, āvuso, … jānāti:` ← `7.3`/`7.89` (cùng lời “Suppose that, upon checking, a mendicant knows that”).
  **B — 116 khoá (tỉ lệ đo được theo lượt):** `3.x` 16 khoá 0,84–0,95 (khoá `Yaṁpāvuso …—` dựng từ lời câu nêu, khuôn
  “The fact that a mendicant …—” như lớp lấp `ud5.5`/`an8.20`); `5.x` 46 khoá 0,81–0,98 (phủ định của lời `3.x`; “easy to
  admonish” lấy của `5.50`); `6.x` 14 khoá 0,76–0,79 (khuôn `6.2`/`6.3`/`6.4`/`6.47–6.49`); `7.x` 40 khoá 0,76–0,90 (khuôn
  `7.1`/`7.2`/`7.4`/`7.6`). **C — 47 khoá:** `6.x` 28 khoá và `7.x` 18 khoá có tỉ lệ < 0,75 so với khoá gần nhất (đều dựng
  theo cùng khuôn trên, chỉ là dưới ngưỡng đo), cộng colophon `8.10` (“Measuring Up is finished—the fifth.”).

  **Bố cục Pāli không đều — đã kiểm bằng máy:** ở phẩm chất 4 Pāli **gộp** câu `Sace … jānāti` với kết luận vào một khoá ở
  cả hai vế (`7.21`, `7.22`); ở phẩm chất 7 và 8 chỉ gộp vế đầu (`7.37`, `7.42`), vế sau vẫn tách hai khoá. Lớp lấp đi theo đúng ranh giới khoá của Pāli
  (khoá gộp mang cả “Suppose that … knows that … Then …”), không dồn hay tách.

  **Cố ý lệch tầng đã ghim.** (1) Không mang theo `…` mà tầng đã ghim **tự thêm** ở 17 khoá (`3.5`, `3.8` … `3.44`, `5.2`,
  `6.4`, `7.6`; đo bằng máy: lời đã ghim có `…` mà Pāli không có). (2) Phủ định viết “or” (“isn’t irritable or overcome by anger”) cho cặp `na … na …`, như `5.47`/`7.92`
  đã ghim. (3) `6.3` đã ghim bỏ `pāpiccho` (“if I were to fall under the sway …”); lớp lấp ở `6.6`–`6.45` giữ đủ cả hai vế
  của Pāli từng phẩm chất.

  **Nháy — lệch có lý do, đo được.** 173/201 khoá khớp Pāli. 28 khoá kết luận ở lượt `7.x` (`7.10`, `7.12`, …,
  `7.86`) có Pāli `‘…’ti` (1/1) nhưng lớp lấp 0/0, vì tầng đã ghim dịch đúng khuôn ấy thành lời **gián tiếp** không nháy ở
  `7.4`, `7.6`, `7.90`, `7.92` (4 khoá), và khoá A đứng trước (“… a mendicant knows that”) bắt buộc lời gián tiếp. Mọi
  khoá câu hỏi `7.x` và mọi khoá `6.x` giữ nháy đơn khớp Pāli.
  **Dấu lược:** Pāli của 201 khoá có 0 dấu, lớp lấp 0. **Khoá trống còn lại: 0** (201/201).

  **Hai cơ chế khoá trống:** cắt cụt dãy = 3 dãy / 168 khoá / 13.192 ký tự Pāli; bỏ dòng song song = 30 nhóm / 187 khoá
  (≤ 201). Thêm: 15 khoá đã ghim ở `3.x`/`5.2` có chữ nhưng chỉ là câu nêu + `…` — được tính “đã phủ” dù phần còn lại của
  phẩm chất ấy đã bị cắt.

  **Coverage (đo theo quy tắc kho: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước lát: 49/212 = 0.2311; sau khi lớp lấp `published`: 212/212 = 1.0000 (163 khoá lấp có nội dung). Độ nhạy: ngưỡng 0,8 cần 170 khoá; còn dư 42, mất 43 khoá thì rớt ngưỡng. Nếu lớp lấp không `published` thì coverage giữ nguyên 0.2311.
  Hệ quả với `content/meta/reference-gaps.yaml`: `mn/mn15` **có** record (163 khoá thiếu, coverage 0,2311). Sau khi lớp lấp
  `published`, record này thành **thừa**; lát **không** sửa tệp đó — người điều phối chạy lại `npm run reference:gaps` khi gom.

  Triangulation 8.0: metadata Việt của bài này (`content/meta/sutta/mn/mn15.yaml`) ghi `quality.assessed_by` cùng **họ công cụ** với lớp lấp (`source/tooling.yaml`), nên lớp lấp này **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English nhờ lớp này. Đối chiếu có: Pāli root + Sujato đã ghim + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng). Không có bản Anh thứ hai cho các khoá lấp. Không chạm tầng Việt.

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, để người điều phối chạy khi gom. Tự kiểm bằng máy đã làm: JSON parse, mọi khoá ⊆ `fillableSegments` của bài, không khoá nào trùng khoá Sujato có chữ (0 shadow), không khoá rỗng, NFC, dấu lược khớp quy tắc `…pe…` = một `…`, khoá theo thứ tự Pāli, YAML parse, `final_score` = trung bình số học thô.
