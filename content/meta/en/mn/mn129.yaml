notes: |-
  Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.

  **Năm khoá dùng lại nguyên văn lời đã có, kiểm bằng so khớp chứ không bằng mắt.**

  1. `14.2` — Pāli **nguyên văn bằng cả `10.3` và `15.4`**. Lấy nguyên văn lời đã ghim, và lời
     ấy hai chỗ ấy **giống nhau từng chữ**, nên không có chỗ nào phải chọn:
     "And there they feel painful, sharp, severe, acute feelings—but they don’t die until that bad
     deed is eliminated." `dukkhā tibbā kharā kaṭukā` → "painful, sharp, severe, acute";
     `na ca tāva kālaṁ karoti yāva na taṁ pāpakammaṁ byantīhoti` → "but they don’t die until that
     bad deed is eliminated" — tất cả từ lời đã ghim, không tự dịch lại.
  2. `7.3` — vế trích `‘ekantaṁ aniṭṭhaṁ ekantaṁ akantaṁ ekantaṁ amanāpan’ti` là **nguyên văn phần
     đầu** của `7.2`. Bản Anh đã ghim ở `7.2` đã **bỏ luôn cặp ngoặc kép** và viết:
     "it is utterly unlikable, undesirable, and disagreeable, it is of hell that this should be
     said." Lớp lấp lấy nguyên văn vế trích ấy, **khôi lại** ngoặc theo Pāli (`7.3` mở `‘` và đóng
     `’` ngay trong khoá này), và kết bằng dấu chấm vì Pāli kết bằng `.`:
     "‘it is utterly unlikable, undesirable, and disagreeable’."
     `ekantaṁ` → "utterly", `aniṭṭhaṁ akantaṁ amanāpan` → "unlikable, undesirable, and
     disagreeable": lấy nguyên văn từ `7.2`.
  3. `32.3` — cùng cách, với vế trích của `32.2`: "‘it is utterly likable, desirable, and
     agreeable’."
  4. `45.3` — Pāli giống `45.1` (`Puna caparaṁ` → `evameva kho`). Lấy nguyên văn lời `45.1`
     ("a wheel-turning monarch is as dear and beloved to the brahmins and householders") và dịch
     `evameva kho` thành "In the same way", đúng như tầng đã ghim đã dịch cùng từ ấy ở `5.3` và
     `10.3` của chính bài này.
  5. `45.6` — Pāli giống `45.4` (`Raññopi, bhikkhave,` → `evameva kho, bhikkhave, raññopi`). Lấy
     nguyên văn lời `45.4` ("the brahmins and householders are as dear to the wheel-turning
     monarch") cộng vế dẫn. `brāhmaṇagahapatikā` → "the brahmins and householders" theo `45.1`,
     `45.4` đã ghim; `piyo hoti manāpo` → "is as dear and beloved" (45.3) và `piyā honti manāpā` →
     "are as dear" (45.6) — hai chiều khác nhau, giữ đúng như tầng đã ghim đã chia.

  **Hai khoá `4.5` và `4.8` là khoá lược, và lớp lấp không mở rộng.** Pāli:
  `4.5` = `kasāhipi tāḷenti …pe… asināpi sīsaṁ chindanti;` và
  `4.8` = `kasāhipi tāḷeyyuṁ …pe… jīvantampi sūle uttāseyyuṁ, asināpi sīsaṁ chindeyyun’ti.`
  Danh sách hình phạt dài nằm ở `4.2` (đã ghim đủ); bản lấp **giữ đúng một dấu lược mỗi khoá** và
  không kể lại danh sách. Cách dịch hai vế theo **tiền lệ đã có trong chính lớp lấp**: `an2.1:3.5`
  (Pāli gần như y hệt, `kasāhipi tāḷeyyuṁ …pe… asināpi sīsaṁ chindeyyun’ti.`) đã được dịch thành
  "they would beat him with whips … and behead him with a sword." Vì vậy:

  - `4.5` (thì hiện tại, chủ thể là các vị vua theo `4.4`) → "they whip … and behead him with a sword;"
  - `4.8` (thì tương lai, chủ thể là các vị vua theo `4.7`) → "they will whip … and impale him alive
    on stakes, and behead him with a sword.’"
    `jīvantampi sūle uttāseyyuṁ` lấy từ `an2.1:3.3` đã lấp ("impale him alive on stakes") và từ
    `4.2` đã ghim ("being impaled alive").

  **Thuật ngữ.** `pāpakāni kammāni` → "bad deeds" (đã ghim ở `5.1`, `5.3` cho đúng cụm `pubbe pāpakāni
  kammāni`, và ở `18.5`, `19.11`, `20.4`, `21.4`, `22.7` cho `pāpakāni kammāni`); `pāpakammaṁ` → "bad
  deed" (`10.3`, `15.4`). Đếm trong bản Anh đã ghim của chính bài này: "bad deed" 9 lần, "bad deeds" 7
  lần — hai số khác nhau chỉ vì số lượng, và cả hai đều là cách đã dùng. `cakkavattī rājā` → "a
  wheel-turning monarch" theo `45.1` đã ghim. Không thuật ngữ nào ở bảy khoá này là do lớp lấp tự đặt. Bản Việt đã công bố dùng *ác nghiệp*, *khổ, gay gắt, dữ dội, cay nghiệt*,
  *bà-la-môn và gia chủ*, *Chuyển luân vương* — chỉ để đối chiếu nghĩa, không phải nguồn lấy chữ.

  **Ngoặc kép — bảng cân đọc tay, in ra trong script ghi file**: `4.5` 0/0 · `4.8` 0/1 · `7.3` 1/1 ·
  `14.2` 0/0 · `32.3` 1/1 · `45.3` 0/0 · `45.6` 0/0. Khớp Pāli từng khoá.

  **Dấu lược**: đúng hai khoá (`4.5`, `4.8`), mỗi khoá đúng một `…`, khớp Pāli từng khoá.

  **Còn ba khoá trống lấp được mà lát này không được giao — báo lại để người điều phối xử lý.**
  `mn129:11.2`, `12.2`, `13.2` đều trống ở bản Anh đã ghim, đều dài hơn ngưỡng 40 ký tự (nên
  `coverage` **có** đo chúng), và `fillableSegments` **có** mở chúng — nhưng không nằm trong
  `e1.json` nên lát này không đụng tới. Nội dung: cả ba là `So tattha dukkhā tibbā …pe…
  byantīhoti.`, tức *"Ở đó, vị ấy cảm thọ các cảm thọ khổ, gay gắt … cho đến khi ác nghiệp ấy
  được tận cùng"* theo bản Việt; `14.2` của lát này đã dịch đúng vế không lược của cùng công thức
  nên dùng làm gốc cho cả ba. Cũng còn hai khoá trống dưới ngưỡng đo: `15.2` và `49.7` (colophon).

  Tổng số khoá có nội dung của `mn129` là 249; tầng Anh đã ghim để trống 10. Ba con số phải tách bạch:
  **trước** lớp lấp (249 − 10) / 249 = **0,9598**; **sau** lát này, còn 3 khoá trống
  (249 − 3) / 249 = **0,9880**; nếu `11.2`, `12.2`, `13.2` cũng được lấp thì (249 − 0) / 249 = **1,0000**.

  Không có bất định thuật ngữ nào đáng kể. Không blocker.

  `triangulation` hạ vì không có bản Anh độc lập: bản Anh đã ghim để trống đúng bảy khoá này, và
  lớp lấp chỉ mượn lời đã ghim của cùng bài cùng một câu, cộng tiền lệ đã có ở `an2.1` cho hai khoá
  lược. Bản Việt chỉ dùng để đối chiếu nghĩa; người viết bản Việt của bài này
  (`GLM-5.3 Flash (ZCode)`) không phải người viết lớp lấp này. Bốn lệnh cổng còn lại **chưa** chạy
  vì lát này bị cấm: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
