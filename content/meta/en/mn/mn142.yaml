notes: |-
  **Phân loại 19 khoá (máy đo, so Pāli đã chuẩn hoá với các khoá đã có lời): A = 6 · B = 7 · C = 6 · D = 0.** Hai khoá B của máy (`14.23`, `15.5`) thực chất dựng từ *tên bài* ở `0.2`, không phải từ một câu Pāli gần trùng, nên nếu đọc theo cách khoá ấy thì phân loại thực là A = 6 · B = 5 · C = 8.

  **Nhóm A (6 khoá): `2.8`, `2.9`, `2.11`, `2.12`, `4.5`, `4.7` — dùng lại từng chữ.** `2.8`, `2.9`, `2.11`, `2.12` là lần cúng thứ hai của Mahāpajāpatī Gotamī và lời đáp của Đức Thế Tôn; Pāli trùng từng chữ với lần thứ nhất (`2.2`, `2.3`, `2.5`, `2.6`) và lần thứ ba (`2.14`, `2.15`, `2.17`, `2.18`), và **hai lần đó đều đã được ghim cùng một lời** (cả hai cặp Sujato đồng nhất), nên không có xung đột nội bộ cần hoà giải. `4.5` và `4.7` trùng Pāli với `4.3` và `4.9` (cụm `abhivādanapaccuṭṭhāna… parikkhārānuppadānena`, “bowing down… medicines and supplies for the sick”), và hai khoá đã ghim đó cũng đồng nhất; lấp dùng lại nguyên văn. Nháy `2.8` “1 · `2.9` ”1 · `2.11` “1 · `2.12` ”1 khớp Pāli.

  **Nhóm B (7 khoá).** · `2.10` dựng lại từ `2.16` (0,96): Pāli `Dutiyampi kho bhagavā …` song song với `Tatiyampi kho bhagavā …` ở `2.16`, chỉ thay “third” bằng “second” (“And for a second time, the Buddha said to her,”). Tầng đã ghim ở `2.7` dịch lần thứ hai của bà bằng một câu “For a second time …” mang dấu `…` **dù Pāli `2.7` viết đủ, không có dấu lược**; đây là lệch của tầng đã ghim, lấp không sửa và không sao chép dấu `…` ấy. · `10.3`, `11.3`, `12.3`, `13.3` dựng lại từ `9.3`, `9.4`, `9.5`, `9.6` (0,92–0,93). Pāli `evaṁ kho, ānanda, dakkhiṇā …` là câu **kết** của từng trường hợp; tầng đã ghim dịch các câu tóm lược `9.3`–`9.6` (“There’s a religious donation that’s purified by …”) nhưng để trống bốn câu kết. Lấp giữ nguyên cụm đã ghim “a religious donation is purified by …”, chỉ thay vế mở bằng “That’s how …”, theo đúng cách tầng đã ghim dịch câu kết `Tadamināpetaṁ …` ở những bài song song (“That’s how what is concisely referred to … becomes twofold”). Không thêm nghĩa nào ngoài Pāli. · `14.23` dựng từ tên bài `0.2` (0,66): “The Analysis of Religious Donations is finished—the twelfth.” · `15.5`: Pāli `Dakkhiṇāvibhaṅgasuttanti` là tên bài đóng bài kệ tóm lược, dựng từ `0.2` (0,93).

  **Nhóm C (6 khoá): `14.24`, `15.0`–`15.4`.** Khối kết bài — dòng chương, nhan đề kệ tóm lược và bốn dòng kệ. Dịch từ Pāli, theo khuôn của các bài kết chương đã có ở lớp lấp (“… is finished—the fourth”, “Its summary verse:”). `14.24` “The Analysis Chapter, finished—the fourth.” (Pāli `Vibhaṅgavaggo niṭṭhito catuttho`). `15.0` `Tassuddānaṁ` → “Its summary verse:”. Bốn dòng kệ liệt kê tên các bài mn131–mn142 trong phẩm theo cách dịch tên đã ghim ở `0.2` của từng bài (“One Fine Night”, “Ānanda”, “Kaccāna”, “Lomasakaṅgiya”, “the Longer Analysis of Deeds”, “the Six Sense Fields”, “A Summary Recital and its Analysis”, “No Strife”, “Elements”, “Truths”). **Ba chỗ không phân xử được hoàn toàn, nói thẳng:** (1) `Bhaddekānandakaccāna` là ba tên viết liền (Bhaddekaratta, Ānanda, Kaccāna — mn131–mn133); lấp tách ba tên theo thứ tự đó, “One Fine Night” theo `0.2` của mn131. (2) `subho` ở `15.2` — theo tôi hiểu là người đối thoại của mn135 (Cūḷakammavibhaṅga, “The Shorter Analysis of Deeds” ở tầng đã ghim); Pāli của kệ gọi bài bằng tên người, nên lấp giữ **tên Pāli** “Subha” chứ không thay bằng nhan đề Sujato; (3) `vibhaṅgā` ở `15.3` — số nhiều dính vào chuỗi trước, và có thể phủ cả `Mahākamma`, `Saḷāyatana` lẫn các bài sau; lấp dịch “the Analyses” và để nguyên cấu trúc. Dịch kệ như thế là dịch tên, không thêm nghĩa.

  **Nháy:** 19 khoá khớp Pāli; chỉ bốn khoá nêu ở nhóm A có nháy, còn lại 0/0. **Dấu lược:** Pāli 19 khoá không có `…pe…`; lấp có 0 dấu `…`.

