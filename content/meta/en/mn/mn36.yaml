notes: |-
  **Phân loại 9 khoá (đo bằng máy; ngưỡng B = độ tương đồng Pāli ≥ 0,60 với một khoá đã có lời): A dùng lại nguyên văn = 0 · B dựng lại = 8 · C tự dịch = 1 · D Pāli trùng nhưng lời tầng khác nhau = 0.** Đã ghi 9/9 khoá `fillableSegments` (trong đó 8 khoá có nội dung ≥ 40 ký tự Pāli; 1 khoá còn lại dưới ngưỡng, không vào coverage). Số khoá trống còn lại của bài: 0 (mọi khoá tầng đã ghim để trống đều đã lấp). Pāli chứa 0 dấu lược (`…pe…` hoặc `…` = đúng một `…` mỗi nơi), bản lấp giữ đúng 0; 0 khoá có nháy trong Pāli. Trong bài có 32 nhóm Pāli trùng nguyên văn (105 khoá).

  **Nhóm 1 — `17.12`, dựng lại từ `17.11` (độ tương đồng Pāli 0,29: khoá nguồn dài gấp ba).** Sujato gộp hai vế Pāli vào một câu ở `17.11` (“Regardless of whether or not they suffer painful, sharp, severe, acute feelings due to exertion, they are incapable of knowledge and vision, of supreme awakening”), nên vế `no cepi te bhonto … vedayanti, abhabbāva te …` của `17.12` bị nuốt. Lớp lấp giữ nguyên cụm đã ghim “painful, sharp, severe, acute feelings due to exertion” và “incapable of knowledge and vision, of supreme awakening”, chỉ đổi điều kiện sang phủ định (“if … don’t suffer … still incapable”) vì Pāli `no cepi`.

  **Nhóm 2 — năm khoá `evameva kho me … uparuddhesu`: `21.6`, `22.6`, `23.6`, `24.6`, `25.6`, dựng lại từ `21.4`, `22.4`, `23.4`, `24.4`, `25.4` (0,93 · 0,93 · 0,93 · 0,93 · 0,92).** Mỗi khoá là vế “như vậy” của hình ảnh đã ghim ở `x.5`; Sujato đã dịch phần kết quả (gió thoát qua tai, gió mạnh xoáy đầu, đau đầu, gió cắt bụng, nóng rát thân) ở `x.4` và vế chặn hơi thở ở `x.3`. Lớp lấp ghép hai vế đã ghim và thêm khung “In the same way, when …” cho `evameva kho me … uparuddhesu`. Từ vựng khớp khoá nguồn: “strong winds ground my head”, “severe headache”, “strong winds carved up my belly”, “severe burning in my body”; `21.6` theo `21.4` (“winds came out my ears making a loud noise”).

  **Nhóm 3 — `30.3`, `30.4`, dựng lại từ `30.2` (0,92 · 0,90).** Sujato gộp quá khứ, tương lai, hiện tại vào `30.2` (“whether in the past, future, or present”). Lớp lấp tách đúng Pāli: `30.3` = `anāgatamaddhānaṁ … vedayissanti` (tương lai), `30.4` = `etarahi … vedayanti` (hiện tại); vế `etāvaparamaṁ, nayito bhiyyo` và bốn tính từ lấy lại của `30.2`.

  **C — `48.18`**: colophon `Mahāsaccakasuttaṁ niṭṭhitaṁ chaṭṭhaṁ.` (38 ký tự, dưới ngưỡng) dịch theo khuôn các colophon đã có của lớp lấp và tiêu đề đã ghim ở `0.2` (“The Longer Discourse With Saccaka is finished—the sixth.”). Nhãn thứ tự là số Pāli; chưa đối chiếu với vị trí thực của bài trong bộ.

  **Nháy:** không khoá nào trong 9 khoá chứa nháy trong Pāli (nháy ‘ mở ở `30.2`, đóng ở `30.6`, đã ghim); bản lấp cũng không có nháy. Không có chỗ cố ý lệch Sujato ngoài các chỗ chia nhỏ nêu trên.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài không có record (coverage trước đã trên ngưỡng 0,80), nên không có record nào thành thừa. Coverage trên Pāli có nội dung: trước 285/293 = **0,9727**, sau (khi `published`) 293/293 = **1,0000**. Độ nhạy: ngưỡng 0,80 cho phép thiếu tối đa 58/293 khoá có nội dung; bản đã ghim đang thiếu 8, bản lấp bù đủ 8. Chỉ tính khi `status: published`; nếu hạ xuống `review`/`draft` thì coverage quay về mức trước.

