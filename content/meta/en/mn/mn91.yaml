notes: |-
  **Phân loại 24 khoá (đo bằng máy): A = 7 · B = 7 · C = 10 · D = 0.**

  **Cơ chế thật ở bài này là tóm lược, không phải cắt cụt.** Tầng đã ghim ba lần thay cả một khối Pāli bằng một
  câu kể: `4.2` “Brahmāyu told Uttara of the Buddha’s presence … and added:” (thay `4.3`–`4.6`); `4.7`, `5.1`,
  `8.7`, `8.9` gói luôn vế `tādiso` (`4.8`, `5.2`, `8.8`, `8.10`); `26.17` “He did as he was asked, and the Buddha
  said,” (thay `26.18`–`26.28`, tức toàn bộ lời nhắn của người học trò). Lớp lấp dịch đúng từng khoá Pāli, nên
  người đọc sẽ thấy nội dung tóm lược ở khoá đã ghim **rồi** nội dung đầy đủ ở khoá lấp — lặp là hệ quả của tầng
  đã ghim, hiện ra thay vì giấu. Riêng `26.17`→`26.18` đọc gượng (“and the Buddha said, | When the greetings …”)
  vì lời đã ghim đã nhảy tới câu đáp `26.29`; vì vậy `grammar_logic` 9,2.

  **A — 7 khoá chép nguyên văn:** `4.4` ← `3.3`; `26.21` ← `26.9`; `26.22` ← `26.10`; `26.23` ← `26.11`;
  `26.25` ← `26.13`; `26.27` ← `26.15`; `26.28` ← `26.16`.

  **B — 7 khoá.** `4.3` (0,84 với `3.2`): lấy nguyên lời `3.2`, thay dẫn `samaṇo khalu bho` bằng lời gọi
  `tāta uttara` → “Dear Uttara,” (cách tầng đã ghim dịch `tāta uttara` ở `5.3`). `4.6` (1,00 với `3.7` sau chuẩn hoá
  hoa/thường): “It’s good to see such perfected ones.’” — đổi nháy đóng `”` thành `’` đúng Pāli. `26.12` `26.14`
  `26.24` `26.26` (0,62 với `26.10`): vế `brahmāyu tesaṁ brāhmaṇo aggamakkhāyati—` lấy đúng phần đuôi của `26.10`
  “Brahmāyu is said to be the foremost in”, để danh sách “wealth, / hymns, / lifespan, and fame.” đọc như Pāli
  (lặp ba lần). `9.2` (0,70 với `9.33`): máy xếp B, nhưng lời đã ghim ở `9.33` **bỏ** vế `idampi … mahāpurisalakkhaṇaṁ
  bhavati`, nên thực chất là tự dịch: “This too is a mark of a great man that the worthy Gotama has.”

  **C — 10 khoá tự dịch, giữ giọng tầng đã ghim:** `4.5` “‘That Blessed One is perfected, a fully awakened
  Buddha …” (Pāli `…pe…` → một `…`); `4.8`, `5.2`, `8.8`, `8.10` (`tādiso … no aññādiso` → “really like that,
  and not otherwise”; bộ Sujato đã ghim không có câu nào dịch cụm này — ở `dn3` cũng gói vào câu khác — nên
  không có lời để dùng lại); `26.7`, `26.19` (lời hỏi thăm sức khoẻ theo đúng chữ tầng đã ghim dùng ở `26.6` và
  các bài song song: “healthy and well, nimble, strong, and living comfortably”); `26.18` (theo `6.3`, đổi
  “sat down” → “stood” vì Pāli `aṭṭhāsi`); `26.20` “And he says this:”; `39.10` colophon “With Brahmāyu is
  finished—the first.”

  **Nháy và dấu lược:** khớp Pāli ở cả 24 khoá; một `…` duy nhất ở `4.5` đúng một `…pe…` của Pāli. 11 khoá dưới
  ngưỡng 40 ký tự (`8.10` `26.12` `26.14` `26.20` `26.23` `26.24` `26.25` `26.26` `26.27` `26.28` `39.10`) được lấp
  để lời nhắn liền mạch; không vào coverage.

  **Cơ chế khoá trống (đo, không sửa):** dãy ≥ 4 khoá trống liên tiếp: 2 dãy / 15 khoá / 1.065 ký tự Pāli; nhóm
  dòng song song (ngưỡng 0,70): 11/24 khoá. Bài có 41 cặp khoá Pāli trùng nguyên văn.

  **Triangulation 8.0.** Scorecard Việt của bài (`content/meta/sutta/mn/mn91.yaml`) có
  `quality.assessed_by` trùng đúng alias của lớp lấp này (alias khai trong `source/tooling.yaml`), nên bản
  lấp **không** phải cách đọc English độc lập với bản Việt, và scorecard Việt của bài **không** được tuyên
  bố là đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root đã ghim + Sujato đã ghim (ở các khoá
  có chữ của chính bài) + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng). Không sửa tệp Việt hay
  metadata Việt.

  **technical_integrity 9.6.** Lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều phối. Đã tự kiểm
  bằng máy: JSON parse; mọi khoá thuộc tập khoá tầng Anh đã ghim để trống (không shadow); NFC; không khoá rỗng;
  khoá theo thứ tự Pāli; nháy kép/đơn và dấu lược so **từng khoá** với Pāli (`…pe…` tính là một `…`; `’` có
  chữ thường đứng ngay sau là dấu nhạt lượu, còn lại là nháy đóng).

  **Coverage và gap.** `mn/mn91` **không** có record trong `content/meta/reference-gaps.yaml`, nên không record nào thành thừa vì lát này. Coverage English (mẫu số = khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`):
  trước lớp lấp 203/216 = 0.9398; sau khi `published` 216/216 = **1,0000** (không còn khoá có nội dung
  nào trống). Độ nhạy: lớp lấp chỉ được tính khi `published`; nếu bài rơi về `review`/`draft` thì coverage quay về
  0.9398. Ở trạng thái `published`, phải mất 44 khoá có nội dung
  nữa mới rớt ngưỡng 0,8.
