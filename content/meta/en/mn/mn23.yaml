notes: |-
  **Phân loại 15 khoá (đo bằng script, so Pāli đã chuẩn hoá dấu câu): A = 9 · B = 3 · C = 2 · D = 1.**
  Lấp đủ 15/15 khoá tầng Anh đã ghim để trống (không còn khoá trống nào của bài), gồm 9 khoá đủ ngưỡng
  40 ký tự (tính sau khi bỏ khoảng trắng cuối) và 6 khoá dưới ngưỡng. Khoá dưới ngưỡng cũng được lấp vì
  chúng là mắt xích của câu: nếu để trống thì cặp `3.4`/`3.5` (“The brahmin said, / “Dig, …”) và
  `3.7` (câu kết lời vị trời) đứt giữa chừng.

  **Nhóm A — 9 khoá, dùng lại nguyên văn lời đã ghim của cùng bài.**
  · `3.3` = `2.1` (Pāli trùng) — chỉ đổi nháy mở “ → ‘ cho khớp Pāli `3.3` (xem phần nháy).
  · `3.4` = `2.2` · `3.9` = `2.46`.
  · Sáu khoá `4.15`, `4.18`, `4.22`, `4.26`, `4.34`, `4.37` có Pāli trùng nguyên văn `4.12`
  (`abhikkhaṇa, sumedha, satthaṁ ādāyāti ayametassa attho.`) nên lấy y nguyên lời `4.12`:
  “dig, clever one, having picked up the sword.’”. Tầng đã ghim ở mỗi vế `Ukkhipa …` (`4.14`, `4.17`,
  `4.21`, `4.25`, `4.33`, `4.36`) kết bằng dấu lược “ …” thay cho vế `abhikkhaṇa …` kế tiếp; lớp lấp
  dựng lại vế đó đúng chỗ Sujato bỏ qua. Dấu nháy đơn đóng ’ ở cuối là di sản của việc dùng lại
  nguyên văn `4.12` (ở `4.12` nó đóng nháy mở ‘give up ignorance …’), nên ở sáu khoá này nó không
  có nháy mở tương ứng trong cùng khoá — xem phần nháy.

  **Nhóm B — 3 khoá, dựng lại từ lời đã ghim.**
  · `3.2` ← `1.4` (khớp 0,78). `1.4` là lời kể ngôi thứ ba (“went up to Kassapa the Prince, stood to
  one side, and said”); `3.2` là lời Tôn giả Kassapa thuật lại ngôi thứ nhất (`yenāhaṁ`, `maṁ
  etadavoca`), nên lớp lấp đổi sang “came to me … said to me” và thêm hai chi tiết Pāli có mà `1.4` không
  có: `imaṁ rattiṁ` → “last night”, và vị ngữ ngôi thứ nhất `bhante`/“Sir”. Giữ “glorious deity,
  lighting up the entire Dark Forest” của `1.4`.
  · `3.6` ← `2.8`/`2.9` (khớp 0,85). Pāli `Abhikkhaṇanto sumedho satthaṁ ādāya …pe…` là dạng lược của
  `2.9`; lớp lấp lấy “Picking up the sword and digging” của `2.9` rồi **một** dấu lược “ …”.
  · `3.8` ← `2.45` (khớp 0,84): thêm `bhante` thành “sir,” và bỏ dấu chấm cuối (khác Pāli ở chỗ chỉ là
  dấu câu) để nối liền vào `3.9` “before vanishing right there.”, đúng cách `2.45`+`2.46` đã nối.

  **Nhóm C — 2 khoá, tự dịch từ Pāli.**
  · `3.7` `ito vā pana sutvā’ti.` — vế chót của lời vị trời, mà `3.6` đã lược giữa chừng. Dịch “or someone
  who has heard it from them.’” theo lời đã ghim của `2.44` (“or someone who has heard it from
  them”), thêm nháy đơn đóng khớp Pāli (`’ti`, đóng nháy mở ở `3.3`).
  · `4.42` colophon `Vammikasuttaṁ niṭṭhitaṁ tatiyaṁ.` — “The Termite Mound is finished—the third.”,
  theo khuôn của các colophon đã lấp ở các bài khác của dự án (`mn20`, `mn117`, `mn123`).

  **Nhóm D — 1 khoá, báo.** `3.5` (Pāli `“abhikkhaṇa, sumedha, satthaṁ ādāyā”ti.`) trùng, sau khi bỏ
  dấu nháy, với tám khoá `2.3 2.8 2.13 2.18 2.23 2.28 2.33 2.38`, mà lời đã ghim **khác nhau ở một
  khoá**: bảy khoá là “having picked up the sword”, riêng `2.28` là “having taken up the sword”.
  Lớp lấp dùng cách bảy khoá (“picked up”) và **không** sửa `2.28` (tầng đã ghim, sửa là shadow).

  **Nháy.** Pāli `3.2` mở “ (lời vị trời nói với Kassapa, kéo qua nhiều khoá), `3.3` mở ‘, `3.5` mở và
  đóng “ ”, `3.7` đóng ’ — lớp lấp theo đúng từng khoá (đo cả bốn loại: khớp ở 9 khoá). **Lệch có chủ
  đích ở sáu khoá `4.x`:** Pāli không có nháy nào, lời lấp có một ’ vì dùng lại nguyên văn `4.12`
  (luật “Pāli trùng thì lời giống nhau” được ưu tiên hơn “khớp nháy từng khoá” vì có sáu khoá anh em
  đã ghim/đối chiếu cùng một Pāli).

  **Dấu lược.** Duy nhất `3.6` có `…pe…` ở Pāli ⇒ đúng một “…”. Không khoá nào khác chứa dấu lược.

  **Một chỗ người đọc sẽ thấy lặp, nói thẳng.** Tầng đã ghim ở `3.1` đã **gộp** nội dung `3.2`–`3.9` vào
  một câu (“… sat down to one side, and told him what had happened. Then he asked:”). Lớp lấp dịch đủ
  `3.2`–`3.9` theo Pāli nên người đọc thấy lời kể được nhắc hai lần (một lần tóm tắt, một lần chi tiết).
  Đó là do tầng đã ghim, không phải lỗi của lớp lấp; không sửa tầng đã ghim.

  **Cố ý lệch tầng đã ghim:** (1) dùng “picked up” thay cho “taken up” của `2.28` (nhóm D); (2) bỏ dấu
  chấm cuối ở `3.8` để nối `3.9`, khác Pāli mỗi chỗ dấu câu; (3) sáu ’ lẻ ở `4.x` như trên.

  **Coverage (mẫu số = khoá Pāli ≥ 40 ký tự, bỏ `:0`; không phải mọi khoá):** trước 44/53 = **0,8302**;
  sau 53/53 = **1,0000** (sau khi `published`). Độ nhạy: ngưỡng 0,8 cần ≥ 43/53, bài có 10 khoá dư —
  mất tối đa 10 khoá lấp thì mới rơi lại dưới ngưỡng. Bài này **không** `below`, nên
  `content/meta/reference-gaps.yaml` không có record phải xoá vì lát này; không chạm tệp đó.

  **Triangulation 8.0 — bản lấp không phải cách đọc English độc lập.** Scorecard Việt của `mn23`
  (`content/meta/sutta/mn/mn23.yaml`) ghi `quality.assessed_by` **trùng họ công cụ** với lớp lấp này
  (đối chiếu theo `source/tooling.yaml`); bài này **không** được tuyên bố là đã đối chiếu English độc lập.
  Bản Việt canonical (đủ khoá) được dùng để đối chiếu nghĩa, không dịch vòng qua nó.

  technical_integrity 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`
  trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại
  cho người điều phối.
