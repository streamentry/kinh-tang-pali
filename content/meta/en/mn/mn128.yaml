notes: |-
  **Phân loại 43 khoá (đo bằng máy): A = 20 · B = 18 · C = 5 · D = 0.**

  **Nhóm A — 20 khoá chép nguyên văn:** `4.9` ← `4.2`/`4.16`; `4.11–4.14` ← `4.4–4.7`/`4.18–4.21` (lần thứ hai của
  lời can ngăn, tầng đã ghim viết “For a second time …” ở `4.8` rồi để trống); `12.14`, `12.15`, `12.16`, `12.20`, `12.21`
  ← `12.2`, `12.3`, `12.4`, `12.8`, `12.9` (lời Kimbila lặp lời Anuruddha); tám khoá `Samādhimhi cute …` (`18.4`, `19.7`,
  `20.7`, `21.4`, `22.7`, `23.7`, `24.4`, `25.4`) ← 7 khoá đã ghim cùng lời “When immersion falls away, the light and
  vision of forms vanish.”; `28.7`, `29.7` ← `28.11`/`29.13`.

  **Nhóm B — 18 khoá:**
  - `3.2` (0,91 với `2.1`): lời kể của người dẫn chuyện ở `2.1` chuyển thành lời tỳ-kheo thưa (“Sir, here in Kosambī …”).
  - `4.10` (0,96 với `4.17`): chỉ đổi “third” → “second”.
  - `12.12`, `12.13`, `12.19`, `12.22`: `12.12` theo khuôn “said to the Buddha”; tên “Kimbila” theo tầng đã ghim
    (`12.11`), không theo chính tả Pāli `kimilo`. `12.22` (0,99 với `12.10`) bỏ nháy đóng vì Pāli `cittanti` không có `”`.
  - tám khoá `tassa mayhaṁ, anuruddhā, etadahosi:` (`18.2` … `25.2`): Pāli khớp `17.3`/`17.5`/`28.8` (“It occurred to
    me:”) chỉ khác chữ hoa; lớp lấp viết chữ thường “it occurred to me:” vì khoá đứng ngay sau “While meditating …”
    đã ghim. ⚠️ Cùng Pāli (chỉ khác hoa/thường) tầng đã ghim còn dịch “I thought:” ở `28.4`, `29.4`, `31.1` — tức một
    nhóm **D mềm**; lớp lấp theo “It occurred to me:” vì đó là lời của chuỗi `16`–`17` liền kề, **không** hòa hai lời đã ghim.
  - `22.6`, `23.6` (0,82 / 0,85): tầng đã ghim viết `19.6`, `20.6` bằng “In the same way, … arose in me …” có `…`; Pāli
    `22.6`, `23.6` viết **đủ** nên lớp lấp viết đủ vế “and because of that my immersion fell away” (lấy của `22.3`/`23.3`)
    và **không** thêm `…`.
  - `28.6`, `29.6` (1,00 với `28.2`/`29.2`, chỉ khác dấu): xem “cố ý lệch”.
  **C — 5 khoá:** `12.5`, `12.6`, `12.17`, `12.18` và colophon `32.6` (“Corruptions is finished—the eighth.”).

  **Gộp khoá có thật (đọc tay).** (1) `12.4` đã ghim dịch “by way of body, speech, and mind” trong khi Pāli `12.4` chỉ
  có `kāyakammaṁ`; `12.5` (`vacīkammaṁ`) và `12.6` (`manokammaṁ`) trống. Lớp lấp dịch đúng từng khoá, nên khẩu và ý xuất
  hiện hai lần; `12.16`–`12.18` lặp đúng như vậy (A + C), giữ hai khối đối xứng. (2) `3.1` đã ghim tóm “told him what was
  happening, adding:” nên `3.2` lấp sẽ lặp nội dung ấy. (3) `12.11` đã ghim tóm “Nandiya and Kimbila spoke likewise”;
  `12.12–12.22` là lời Kimbila nói đủ — Pāli viết đủ, nên lớp lấp viết đủ. (4) `28.5`, `29.5` đã ghim kết câu hỏi bằng
  `’` sớm, nên câu hỏi ở `28.6`/`28.7` hiện ra sau dấu đóng; `28.7`/`29.7` lại có `’` theo Pāli.

  **Cố ý lệch tầng đã ghim.** `28.6`, `29.6` dùng thì hiện tại (“or I see forms, but do not perceive light—”) thay cho thì
  quá khứ của `28.2`/`29.2` (“or I saw forms, but did not see light.”): Pāli hai khoá này nằm **trong câu tự hỏi** bắt đầu
  ở `28.5`/`29.5` (`yvāhaṁ … sañjānāmi … passāmi`), và chính tầng đã ghim dùng thì hiện tại trong câu tự hỏi ở `28.9`
  (“I perceive light and do not see forms”). Chữ “perceive” cho `sañjānāmi` lấy của `28.9`.

  **Hai cơ chế khoá trống:** cắt cụt dãy = 2 dãy / 17 khoá / 931 ký tự Pāli; bỏ dòng song song = 8 nhóm / 31 khoá (≤ 43).

  **Nháy:** 42/43 khoá khớp Pāli. Ngoại lệ duy nhất `12.20` là **dương tính giả** của bộ đếm: “venerables’
  ideas” là sở hữu cách số nhiều (chép nguyên văn `12.8`), không phải nháy đóng. **Dấu lược:** Pāli 0, lấp 0.
  **Khoá trống còn lại: 0.**

  **Coverage (đo theo quy tắc kho: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước lát: 150/179 = 0.8380; sau khi lớp lấp `published`: 179/179 = 1.0000 (29 khoá lấp có nội dung). Độ nhạy: ngưỡng 0,8 cần 144 khoá; còn dư 35, mất 36 khoá thì rớt ngưỡng. Nếu lớp lấp không `published` thì coverage giữ nguyên 0.8380.
