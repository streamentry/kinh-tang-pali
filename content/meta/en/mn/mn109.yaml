notes: >-
  Danh sách năm thủ uẩn. Bản đã ghim đã dịch đúng danh sách này ở 4.1–4.2 ("form, feeling,
  perception, choices, and consciousness") nhưng lược mất 4.3–4.4. 4.4 là lần Đức Thế Tôn lặp
  lại, nên dùng lại nguyên bộ từ ấy.
  
  Lưu ý thuật ngữ: tầng Việt của dự án dùng **thủ uẩn** cho `upādānakkhandha` (theo
  `sn22.104:1.7`), và "choices" là cách Sujato dịch `saṅkhāra`. Ở tầng Anh thì giữ "choices"
  để không lệch bản đã ghim trong cùng cột.
  
  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
