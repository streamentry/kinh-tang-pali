notes: |-
  14.2/27.2 đã ghim gộp cả ba nghiệp ("with kindness by way of body, speech, and mind, both
  in public and in private"), nên bốn mảnh chỉ tách đúng nghiệp của mình: 14.3/27.3 speech,
  14.4/27.4 mind, giữ nguyên động từ "consistently treat(s)" và đuôi "both in public and in
  private" (viết thường theo Pāli; ";" và "." cuối câu theo Pāli). "them" (các tỳ-kheo trưởng
  lão ở tesu/14.2) là thành phần phải thêm cho câu Anh đọc độc lập được.
  Bất định: "them" không có trong Pāli của mảnh, và mảnh viết thường là kiểu liệt kê (tiền lệ
  an8.7), nên terminology, grammar_logic, vietnamese_clarity và ambiguity_integrity hạ 9.3.
  Không blocker.
