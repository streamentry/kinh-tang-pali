notes: |-
  Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.

  **Công thức lặp lại và việc dùng lại nguyên văn bản dịch đã có.** `mn16` là bài Ceto-khila
  (Trường Chai Tâm), nên bảy khoá này đều là các mệnh đề công thức đã xuất hiện nhiều lần trong
  chính bài. Bản Anh đã ghim đã dịch sẵn đúng những mệnh đề ấy ở chỗ khác, nên lớp lấp **dùng
  lại nguyên văn** lời đã ghim thay vì dịch lại:

  1. `6.2` và `11.2` — vế `tassa cittaṁ na namati ātappāya anuyogāya sātaccāya padhānāya`
     đã ghim ở `3.3`, `7.2`, `12.2` là "This being so, their mind doesn’t incline toward
     keenness, commitment, persistence, and striving." Lấy nguyên văn.
  2. `23.2` — vế `tassa cittaṁ namati …` đã ghim ở `15.3`, `19.2`, `24.2` là "This being so,
     their mind inclines toward keenness, commitment, persistence, and striving." Lấy nguyên văn.
  3. `23.3` — `evamassāyaṁ catuttho cetasovinibandho susamucchinno hoti` là cùng dòng công thức
     với `20.4` và `24.3` (`susamucchinno`), bản đã ghim dịch "shackle of the heart they’ve
     severed". Giữ đúng cách ấy; chỉ đổi số thứ tự.
  4. `16.2`, `17.2`, `18.2` — cùng dòng `cetokhilo pahīno` với `15.4` và `19.3`, bản đã ghim
     dịch "kind of hard-heartedness they’ve given up". Giữ nguyên.

  **Một lựa chọn phải ghi: lược vế lặp ở `6.2`.** Sáu khoá của tôi bỏ vế tương đối
  `Yo so, bhikkhave, bhikkhu <đối tượng>` ở đầu câu, chỉ dịch vế sau. Lý do đo được, không phải
  thói quen: cả hai tầng tham khảo đã dịch cùng công thức này cũng lược y hệt — bản Anh đã ghim
  ở `3.3` (chính nguyên văn ở đó có đủ vế tương đối) vẫn chỉ viết "This being so, …", và
  trong toàn tầng Anh đã ghim có 20 lần "This being so, their mind doesn’t incline toward …",
  **không lần nào** mở rộng vế tương đối; bản Việt đã công bố cũng vậy. Ngoài ra `6.1` ngay
  trước đã nói rõ điều kiện bằng tiếng Anh. Đây là peyyāla: vế lặp không mang thông tin mới.

  **Thuật ngữ lấy nguyên từ tầng đã ghim**, không tự đặt: `cetokhilo` → "kind of
  hard-heartedness"; `cetasovinibandho` → "shackle of the heart"; `ātappāya anuyogāya sātaccāya
  padhānāya` → "keenness, commitment, persistence, and striving"; `asamucchinno` /
  `susamucchinno` → "they haven’t severed" / "they’ve severed"; `pahīno` → "given up".
  Bản Việt dùng *trạng thái khiến tâm chai cứng*, *trói buộc của tâm*, *nhiệt tâm, tận lực,
  kiên trì và nỗ lực* — chỉ dùng để đối chiếu nghĩa, không phải nguồn lấy chữ.

  **Dấu lược.** Không khoá nào trong bảy khoá này có `…pe…`, nên không khoá nào sinh dấu lược;
  số dấu lược bằng 0, khớp Pāli từng khoá. Bảy khoá đều dài hơn ngưỡng 40 ký tự Pāli, tức
  đúng là các khoá mà `coverage` đo.

  **Một khoá còn trống ngoài lát này, và phân biệt đúng hai loại.** Bản Anh đã ghim để trống 8 khoá
  có nội dung ở `mn16`; lát này nhận 7. Còn lại `27.10` (dòng colophon).

  1. Nó **lấp được** — `fillableSegments` chỉ so với prose của các tầng đã ghim, không áp ngưỡng
     40 ký tự. Nó không thuộc lát này, nên lớp lấp không đụng tới.
  2. Nó **không được `coverage` đo** — `substantivePaliMinChars` = 40 loại nó.

  Tổng số khoá có nội dung của `mn16` là 72, nên sau khi lớp lấp `published` tỉ lệ Anh của bài này
  Tỉ lệ Anh **trước** lớp lấp là (72 − 7) / 72 = **0,9028**, **sau** lớp lấp `published` là **1,0000**.

  Không có bất định thuật ngữ nào đáng kể. Không blocker.

  `triangulation` hạ vì không có bản Anh độc lập: bản Anh đã ghim để trống đúng bảy khoá này,
  và lớp lấp chỉ mượn lời đã ghim của cùng công thức chứ không có bản Anh nào độc lập để đối
  chiếu. Người viết bản Việt của bài này (`Muse Spark`) không phải người viết lớp lấp này.
  Bốn lệnh cổng còn lại **chưa** chạy vì lát này bị cấm: `npm run validate`, `npm test`,
  `npm run check`, `npm run build`.
