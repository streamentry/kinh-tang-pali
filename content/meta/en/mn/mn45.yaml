notes: |-
  **Phân loại 17 khoá (đo bằng máy, không lọc độ dài): A dùng lại nguyên văn = 7 · B dựng lại = 9 · C tự dịch = 1 · D = 0.**
  Cấu trúc bài: ví dụ dây leo māluvā (`4.1–4.21`) rồi phần áp dụng (`4.22–4.33`) **lặp lại gần nguyên văn** đoạn
  `3.2–3.12`; tầng đã ghim dịch `4.22` rồi kết bằng `…` và để trống `4.23–4.33`. Vì vậy gần như toàn bộ lát là dựng lại.

  **Nhóm A — 7 khoá có Pāli trùng nguyên văn khoá đã ghim:** `4.23`, `4.28` ← `3.4`; `4.25`, `4.31` ← `3.6`/`3.11`
  (cùng lời “They say,”); `4.26` ← `3.7`; `4.29` ← `3.9`; `4.30` ← `3.10`. Chép nguyên văn từng chữ. Hệ quả nhìn thấy
  được: `4.28` mang dấu phẩy cuối của `3.4` (“…sensual pleasures,”) trong khi khoá kế `4.29` bắt đầu bằng chữ hoa — vì ở
  `3.4` câu nối sang `3.5`, còn ở `4.28` nối sang `4.29`. Giữ nguyên để luật “Pāli trùng ⇒ English trùng” không vỡ.

  **Nhóm B — 9 khoá:**
  - `4.20` (0,90 với `4.6`; nguồn thật là cặp `4.11`+`4.12`): Pāli gộp lời trấn an và danh sách rủi ro vào một khoá; ghép
    nguyên lời của `4.11` và `4.12`, nháy kép theo Pāli (1 mở / 1 đóng).
  - `4.24` (0,95 với `3.5`): Pāli chỉ thiếu `kho`; lời `3.5` dùng y nguyên.
  - `4.27` (0,90 với `3.8`): `3.8` đã ghim gộp cả vế `te kāmesu pātabyataṁ āpajjanti` vào; ở `4.27` vế ấy tách ra khoá
    `4.28`, nên chỉ lấy nửa đầu của `3.8`.
  - `4.32` + `4.33` (0,94 / 0,90 với `3.7`/`3.12`): `3.12` đã ghim **nuốt** vế `kāmesu … kāmānaṁ pahānamāhaṁsu,
    kāmānaṁ pariññaṁ paññapenti`; lớp lấp chèn lại vế ấy bằng đúng lời của `3.7`.
  - `6.3`, `6.4`, `7.3`, `7.4` (0,82–0,83 với `6.2`/`7.2`): xem mục “gộp khoá” dưới.
  **C — 1 khoá:** `7.14` (colophon) theo khuôn lớp lấp đã có: “The Shorter Discourse on Taking Up Practices is
  finished—the fifth.”, dùng tên Anh của chính tầng đã ghim ở `0.2`.

  **Cố ý lệch tầng đã ghim (2 chỗ).** (1) `4.33`: Pāli `ime hi mayaṁ … vedayāmā` là **số nhiều**; `3.12` đã ghim dịch
  “I’m feeling”. Lớp lấp viết “we’re feeling” theo Pāli. (2) Không mang theo chữ “…” mà `4.22` đã ghim tự thêm.

  **Gộp khoá có thật ở bài này (đọc tay, không phải phép đo stem).** `6.2` đã ghim dịch cả ba (“greed, hate, and
  delusion”) trong khi Pāli `6.2` chỉ có `rāga`; `6.3` (`dosa`) và `6.4` (`moha`) để trống. `7.2`/`7.3`/`7.4` y hệt.
  Lớp lấp dịch đúng Pāli của từng khoá (“…acute hate…”, “…acute delusion…”), nên người đọc sẽ thấy sân và si **xuất
  hiện hai lần**: một lần trong lời gộp của `6.2`/`7.2`, một lần ở khoá lấp. Lặp do tầng đã ghim nói trước, không sửa
  được mà không shadow.

  **Hai cơ chế khoá trống (định nghĩa: tập từ ≥ 4 chữ cái của Pāli; nhóm khi giao ≥ 0,70; mỗi khoá một nhóm):**
  cắt cụt dãy (≥ 4 khoá trống liền) = 1 dãy / 11 khoá / 695 ký tự Pāli; bỏ dòng song song = 5 nhóm / 12 khoá (≤ 17 khoá trống).

  **Nháy:** 17/17 khoá khớp Pāli (nháy kép và đơn, `’` có chữ thường liền sau tính là dấu nhạt lượu).
  **Dấu lược:** Pāli của 17 khoá có 0 dấu, lớp lấp 0. **Khoá trống còn lại: 0** — lát lấp đủ 17/17.

  **Coverage (đo theo quy tắc kho: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước lát: 61/74 = 0.8243; sau khi lớp lấp `published`: 74/74 = 1.0000 (13 khoá lấp có nội dung). Độ nhạy: ngưỡng 0,8 cần 60 khoá; còn dư 14, mất 15 khoá thì rớt ngưỡng. Nếu lớp lấp không `published` thì coverage giữ nguyên 0.8243.
  Hệ quả với `content/meta/reference-gaps.yaml`: `mn/mn45` **không** có record, nên không record nào thành thừa vì lát này.

  Triangulation 8.0: metadata Việt của bài này (`content/meta/sutta/mn/mn45.yaml`) ghi `quality.assessed_by` cùng **họ công cụ** với lớp lấp (`source/tooling.yaml`), nên lớp lấp này **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English nhờ lớp này. Đối chiếu có: Pāli root + Sujato đã ghim + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng). Không có bản Anh thứ hai cho các khoá lấp. Không chạm tầng Việt.

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, để người điều phối chạy khi gom. Tự kiểm bằng máy đã làm: JSON parse, mọi khoá ⊆ `fillableSegments` của bài, không khoá nào trùng khoá Sujato có chữ (0 shadow), không khoá rỗng, NFC, dấu lược khớp quy tắc `…pe…` = một `…`, khoá theo thứ tự Pāli, YAML parse, `final_score` = trung bình số học thô.
