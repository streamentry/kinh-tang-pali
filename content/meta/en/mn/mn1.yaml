notes: |-
  Phân loại 9 khoá (đo bằng máy, so Pāli đã chuẩn hoá bỏ dấu câu với mọi khoá Sujato có chữ trong bài):
  A 0 · B 0 · C 9 · D 0. Cả chín khoá là dòng kết (colophon) của các phần: tám dòng `…nayabhūmiparicchedo
  niṭṭhito` (26.5, 50.5, 74.5, 98.5, 122.5, 146.5, 170.5, 194.7) và dòng kết bài `Mūlapariyāyasuttaṁ
  niṭṭhitaṁ paṭhamaṁ` (194.10). Tầng Sujato để trống cả chín và không có khoá nào trong bài có Pāli
  trùng hay gần trùng, nên không có gì để dùng lại; mọi khoá tự dịch từ Pāli.

  Cách dịch:
  - Tám dòng phần dùng một khuôn duy nhất: “The Nth section on the ground of the method, regarding X, is
    finished.” (`nayabhūmi` = nền/lĩnh vực của phương pháp, `pariccheda` = phần phân định). Chỉ đổi số thứ tự
    và đối tượng: `puthujjana` = the ordinary person (26.5); `sekkha` = the trainee (50.5); `khīṇāsava` =
    one with defilements ended (74.5, 98.5, 122.5, 146.5); `tathāgata` = the Realized One (170.5, 194.7).
    Các từ này lấy đúng theo lời Sujato của chính bài (3.1 “ordinary person”, 27.1 “a mendicant who is a
    trainee”, 51.1 “defilements ended”, 147.1 “The Realized One”).
  - 194.10 theo đúng khuôn của các bài Trung Bộ đã lấp (“… is finished—the first.”), tên bài lấy theo 0.2
    của Sujato (“The Root of All Things”).
  - Không có dấu lược `…` trong Pāli của chín khoá; không có nháy kép hay nháy đơn nào ở Pāli, bản lấp cũng
    không dùng.

  Chỗ cố ý lệch Sujato: không có (cả chín khoá Sujato để trống, nên không có chỗ nào để lệch).

  Số khoá trống còn lại: 0. Tất cả 9 khoá `fillableSegments` của bài đã được lấp.

  Hệ quả với `content/meta/reference-gaps.yaml`: mn1 không có record trong tệp đó (coverage trước đã
  trên ngưỡng 0,8). Coverage trên Pāli có nội dung: trước 60/68 = 0.8824; sau khi `published` 68/68 = 1.0.
  Độ nhạy: trước đo được, nếu mất thêm hơn 5 khoá có chữ thì dưới 0,8; sau, mất thêm hơn 13 khoá thì dưới 0,8.

  Triangulation 7.5: scorecard Việt của mn1 (`content/meta/sutta/mn/mn1.yaml`, `quality.assessed_by`) ghi
  cùng họ công cụ với bản lấp này, nên bản lấp **không** là cách đọc English độc lập và bài này **không** được
  tuyên bố đã đối chiếu English. Đối chiếu có: Pāli root, bản Sujato đã ghim ở các khoá lân cận, bản Việt
  canonical (chỉ để đối chiếu nghĩa, không dịch vòng).

  technical_integrity 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong
  lượt này (cấm của người điều phối); bốn lệnh đó còn nợ, chưa tuyên bố technical gate pass.
