notes: |-
  **Phân loại 21 khoá (đo bằng máy): A = 10 · B = 10 · C = 1 · D = 0.** Cả 21 khoá nằm trong tập khoá tầng Anh đã
  ghim để trống. Bài là chuỗi sáu vòng “X là ngã không hợp lý” cho `cakkhu`…`mano` (khoá `10.x`–`11.x`), rồi lặp lại cho
  `dhammā`, `manoviññāṇaṁ`, `manosamphasso`, `vedanā` (khoá `12.x`–`15.x`). Tầng đã ghim dịch đủ `10.x` và `11.x`, còn
  ở `12`–`15` chỉ dịch khoá `.1` dưới dạng rút gọn (và `15.7`–`15.12`) rồi để trống `.2`–`.6`.

  **A — dùng lại nguyên văn (10 khoá).** `12.3`, `13.3`, `14.3`, `15.3` ← `10.3` (1,00): “so it would follow that one’s
  self arises and vanishes.”; `12.4`, `13.4`, `14.4`, `15.4` ← `10.4` (1,00): “That’s why it’s not tenable to claim that”;
  `15.2` ← `10.26` (1,00): “The arising and vanishing of feeling is evident,”; `15.5` ← `10.29` (1,00): “feeling is self.”.

  **B — dựng lại, thay thuật ngữ theo Pāli (10 khoá).**
  · `12.2` ← `10.2` (0,75), `13.2` ← `10.14` (0,75), `14.2` ← `10.20` (0,75): “The arising and vanishing of X is evident,”
    với X = ideas (Pāli `dhammānaṁ`; “ideas” là cách tầng đã ghim dịch `dhamme` ở `6.x`), mind consciousness, mind contact.
  · `12.5` ← `10.11` (0,80), `13.5` ← `10.17` (0,80), `14.5` ← `10.23` (0,80): “X is self.” (đúng dạng đã ghim ở `10.5`,
    `10.11`… không kèm nháy).
  · `12.6`, `13.6`, `14.6`, `15.6` ← `15.12` (0,56 · 0,70 · 0,82 · 0,92): danh sách cộng dồn “So the mind, ideas, … are
    not self.” cắt đúng độ dài Pāli của từng khoá (Pāli `12.6` chỉ có `mano`, `dhammā`; `15.6` thêm `vedanā`) — tầng đã ghim chỉ
    có dạng đủ sáu thành tố ở `15.12`.
  **C (1 khoá).** `41.11` “Six By Six is finished—the sixth.”: lời kết `Chachakkasuttaṁ niṭṭhitaṁ chaṭṭhaṁ.`; theo khuôn
  “<tên> is finished—the <thứ tự>.” của các bản lấp đã có, tên lấy ở `0.2` đã ghim; đúng vị trí (`mn147` mang `pañcamaṁ`,
  `mn149` mang `sattamaṁ`).

  **Ngoặc — đo hai số.** 8 khoá (`12.3`, `12.5`, `13.3`, `13.5`, `14.3`, `14.5`, `15.3`, `15.5`) có Pāli ‘…’ (1 mở/1 đóng) còn
  lớp lấp 0/0. Lý do: tầng đã ghim cũng bỏ nháy ở đúng các khoá song song (10.3, 10.5, 10.9, 10.11…: đo trên toàn bài, 72
  khoá Sujato có Pāli mang ‘ thì 36 khoá bỏ nháy) và Pāli trùng nguyên văn với `10.3`/`10.29` nên phải giống lời đã ghim.
  Đây là ngoại lệ có lý do theo §2.3, không phải thiếu sót.

  **Dấu lược:** Pāli 21 khoá không có `…`/`…pe…` (0), lớp lấp 0.

  **Khoá trống còn lại: 0.** Trong 21 khoá chỉ 9 khoá có Pāli ≥ 40 ký tự (vào coverage); 12 khoá dưới ngưỡng (`12.2` 36,
  `12.4` 24, `12.5` 27, `12.6` 31, `13.4` 24, `13.5` 33, `14.4` 24, `14.5` 34, `15.2` 35, `15.4` 24, `15.5` 27, `41.11` 35) vẫn
  được lấp để chuỗi đọc liền.

  **Cố ý lệch tầng đã ghim:** không. Điểm ngoài lát, chỉ báo: khoá đã ghim `12.1`, `13.1`, `14.1`, `15.1` thêm `…` cuối câu
  (“…’ …”) dù Pāli viết đủ (không có `…pe…`); đây là chỗ Sujato rút gọn, không phải chỗ lớp lấp được sửa.

  Triangulation 8.0: bản Việt canonical của bài (`content/meta/sutta/mn/mn148.yaml`) có cùng họ công cụ với lớp lấp này (đo bằng cách so `translators`/`reviewers`/`quality.assessed_by` với `source/tooling.yaml`), nên lớp lấp KHÔNG phải cách đọc English độc lập và bài này không được tuyên bố là đã đối chiếu English độc lập. Bản Việt chỉ được dùng để đối chiếu nghĩa, không dịch vòng qua nó.

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối; không đặt blocker vì “chưa chạy” không phải lỗi thật.

  Hệ quả với `content/meta/reference-gaps.yaml`: `mn148` KHÔNG có record trong tệp đó (coverage trước 139/148 = 0.9392, đã ≥ 0,8), nên không có record nào thành thừa. Sau khi `published`, coverage = 148/148 = 1,0000. Độ nhạy: sau lớp lấp thừa 29 khoá so với ngưỡng 0,8 (cần ⌈0,8×148⌉ = 119).
