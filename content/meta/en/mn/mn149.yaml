notes: |-
  **Phân loại 33 khoá (đo bằng máy, theo Pāli của từng khoá so với khoá có lời Sujato trong cùng bài):
  A = 30 · B = 2 · C = 1 · D = 0.** Pāli lặp lại nguyên khối 9.2–11.13 (phần mắt) cho phần năm căn còn lại
  (19.1–26.2); tầng đã ghim dịch phần mắt rồi kết 12-18.5 bằng `…` và để trống khối lặp.

  **A (30 khoá) — dùng lại nguyên văn.** 19.1–19.6 = 9.2–9.7; 20.1–20.7 = 10.1–10.7; 21.1 = 10.8;
  22.1–22.6 = 10.9–10.14; 23.1, 23.4 = 11.1, 11.4; 24.1–24.3 = 11.5–11.7; 25.1–25.3 = 11.8–11.10;
  26.1–26.2 = 11.11–11.12.

  **B (2 khoá) — chỉ khác chỗ cắt khoá.** Pāli 23.2 gộp `‘Pañcupādānakkhandhā’ tissa vacanīyaṁ,
  seyyathidaṁ—` (ở 11.2 + đầu 11.3), còn 23.3 chỉ còn danh sách. Lớp lấp cắt lời Sujato đúng theo đó:
  23.2 “You should say: ‘The five grasping aggregates.’ That is:” (0,85 với 11.2), 23.3 “form, feeling,
  perception, choices, and consciousness.” (0,95 với 11.3). Không thêm, không bớt chữ nào của Sujato.

  **C (1 khoá).** 26.6 kết bài: “The Great Discourse on What Relates to the Six Sense Fields is finished—the
  seventh.”

  **Ngoặc:** khớp Pāli 33/33. **Dấu lược:** Pāli 0, lớp lấp 0.

  **Lỗ hổng của bộ đo.** 11 khoá có lời Sujato ngắn dưới 30% Pāli (vd. `3.5` “torment,”, `4-7.2` “nose …”),
  tính là đã phủ; đây là cách rút gọn có chủ đích của tầng đã ghim, không phải lỗi dịch.

  Triangulation 8,0: scorecard Việt của `mn149` ghi `quality.assessed_by` **trùng** alias của lớp lấp này
