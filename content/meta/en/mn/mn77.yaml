notes: |-
  Bài này là **peyyāla thuần**: ba danh sách lặp, và tầng Sujato đã ghim gần hết danh sách đầu
  rồi để trống phần lặp lại. Đo bằng máy trên 390 khoá Pāli: **5 khoá** trong mười khoá lấp có
  Pāli **trùng nguyên văn** với một khoá khác của cùng bài, và cả năm đều được dịch **y nguyên
  từng chữ** theo khoá đã ghim — đây là luật 2 của lớp lấp, là đường mà luật này dạy:
  12.10 = 12.4 · 12.11 = 12.5 · 13.10 = 13.2 · 33.20 = 33.2 · 33.35 = 33.17.
  (Dịch lại từ đầu năm khoá này là bốn cách khác nhau cho cùng một danh sách — đúng thứ
  `sn11.24` đã dạy.)

  **13.11** là khoá duy nhất trong cặp lặp phải tự dịch có chỗ bám: Pāli giống hệt vế sau của
  13.3 đã ghim, nhưng thiếu tiền tố `su-` và bị cắt ở gạch dài (`… niggaṇhissatīti—`), vế đóng
  `netaṁ ṭhānaṁ vijjati’` nằm ở 13.12 (trống ở tầng ghim, thuộc tập lấp được nhưng **không
  thuộc lát này**). Nên lấy lại đúng câu của 13.3 và cắt sau gạch dài, bỏ chữ “legitimately and”
  vì `su-` không có ở khoá này: “he would fail to foresee grounds for future criticism, or to
  completely refute the doctrines of others that come up—”. 13.10 giữ nguyên dấu `‘` mở để câu
  này nối tiếp, và 13.12 sẽ đóng. Khoá kết bằng gạch dài giữ gạch dài `—` như Pāli (Pāli ở đây
  không có `…`); tầng ghim ở 33.19 lại hạ gạch dài thành `…` cho cùng một hình dạng câu — khác
  nhau, nhưng ở khoá của mình lớp lấp bám Pāli.

  **14.8, 14.9, 14.10** là phần lặp của 14.1–14.5 đã ghim. 14.6 và 14.7 trống ở tầng ghim và
  thuộc tập lấp được nhưng không thuộc lát này. Hệ quả người đọc thấy: 14.8 mở đầu bằng
  “and the practice that leads to the cessation of suffering.” mà không có vế “They ask how the
  noble truths of the origin of suffering, the cessation of suffering,” đứng trước — đó là
  lỗ hổng của tầng đã ghim, không phải của bản lấp. Cụm “the practice that leads to the
  cessation of suffering” lấy nguyên từ 14.4 đã ghim; vế “I provide them with a satisfying
  answer” cũng lấy từ đó.

  **33.20 / 33.35** nằm giữa một danh sách dài mà tầng ghim đã dịch ở 33.2–33.17 rồi để trống
  ở 33.21–33.34 (`…pe…` và các vế bị lược). 33.21 có `…pe…` trong Pāli: nếu lát sau lấp 33.21 thì
  phải **giữ** `…` và không mở rộng; lát này không lấp 33.21 nên chưa phải quyết định ở đây, nhưng
  ghi lại để người điều phốn không bỏ sót. 33.20 giữ dấu phẩy và 33.35 giữ dấu chấm đúng như
  33.2 và 33.17 đã ghim.

  **38.4** là colophon `Mahāsakuludāyisuttaṁ niṭṭhitaṁ sattamaṁ.` (40 ký tự — vừa đúng ngưỡng
  `substantivePaliMinChars`, xem BRIEF_VI4 §4: colophon ngắn lọt vào tập lấp, và nếu bài ngắn
  thì cổng coverage không đo được gì). Tầng Sujato **không** dịch bất kỳ colophon nào trong toàn
  bộ kho (đã tra: 186 khoá Pāli kết bằng `…suttaṁ niṭṭhitaṁ`, không khoá nào có văn bản
  Anh), nên đây là bản dịch mới. Nó lấy **đúng tiêu đề tầng đã ghim ở `mn77:0.2`**
  (“The Longer Discourse with Sakuludāyī”), không tự đặt tên, và giữ `sattamaṁ` là “the
  seventh” theo bản Việt canonical.

  Triangulation 7.5: scorecard Việt của `mn77` (`content/meta/sutta/mn/mn77.yaml`) ghi
  `quality.assessed_by` là **hai** tên: “GPT-6 Astra Pro” và “OpenCode Space Bunny Free
  (agent)”. Tên thứ hai chính là lớp lấp này (`source/tooling.yaml`: `aliasInMetadata`), nên
  bản lấp **không** phải lớp đọc Anh độc lập cho bài này, và không được tuyên bố đã đối chiếu
  Anh độc lập. Tệp Việt có khối `summary:` nên **không chạm vào**; cũng không sửa metadata Việt.
  Đối chiếu có: Pāli root + Sujato đã ghim (390 khoá) + bản Việt canonical (390 khoá).

  Không có dấu lược trong Pāli của cả mười khoá lấp (đã kiểm: không khoá nào chứa `…`).

