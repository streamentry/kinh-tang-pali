notes: |-
  **Phân loại 55 khoá (đo bằng máy): A = 12 · B = 39 · C = 4 · D = 0.** Cả 55 khoá nằm trong tập khoá tầng Anh đã
  ghim để trống. Bài có mười sáu “pariyāya” song song: bốn phần đầu (thân, khẩu, ý, mạng sống) ở `4`–`7`, mười hai phần còn lại ở `8`–`19`.
  Sujato dịch trọn phần đầu và phần cuối; ở `8`–`18` chỉ dịch đoạn mở `N.2` và `N.4` kèm `…`, để trống `N.1` (từ `9`), `N.3`, `N.5`, `N.6`;
  phần `19` được dịch trọn trừ `19.1` và colophon `19.7`.

  **Nhóm 1 — `2.6`, `2.7`, `2.11`, `2.12` (B).** Đức Phật lặp lại lời bà-la-môn bằng ngôi thứ nhất: `2.6` ← `2.3` (0,57), `2.7` ← `2.4` (0,82),
  `2.11` ← `3.2` (0,95), `2.12` ← `2.9` (0,93). Đổi “Worthy Gotama… you” thành “Brahmin… me/my” theo Pāli `brāhmaṇa`/`mamaṁ`/`ahaṁ`.

  **Nhóm 2 — `5.2`, `5.3` (C, có `…pe…`).** Pāli `aparisuddhavacīkammantā …pe…` và `aparisuddhamanokammantā …pe…`: “unpurified conduct of
  speech …” và “with unpurified conduct of mind …”. Lưu ý (không sửa được): lời đã ghim `4.2`, `4.5`, `4.6` đã dịch cả ba “conduct of
  body, speech, and mind” dù Pāli `4.2` chỉ nêu `kāya` (đo: `vacī`, `mano` 0 lần ở `4.x`); lớp lấp ở `5.2`–`5.3` nêu từng thành tố đúng
  Pāli, nên người đọc thấy trùng lặp với `4.2`. Đây là lỗi tầng đã ghim.

  **Nhóm 3 — mười một phần `8`–`18` (B + A).** Khuôn từ `4.3`/`4.5`/`4.6` (Sujato) áp từng thành tố, mô tả lấy nguyên từ đoạn mở
  Sujato đã ghim ở `N.2` và `N.4` của chính phần đó (“full of desire for sensual pleasures, with acute lust”, “full of ill will, with
  malicious intentions”, “overcome with dullness and drowsiness”, “restless, with minds unsettled”, “doubting and uncertain”,
  “glorify themselves and put others down”, “cowardly and craven”, “enjoy possessions, honor, and popularity”, “lazy and lack
  energy”, “unmindful and lack situational awareness”, “lack immersion, with straying minds”) và chuyển sang dạng tính từ/phân từ
  như Sujato làm ở `19.3`/`19.5` (“witless and idiotic”, “accomplished in wisdom”). Mỗi phần có ba khoá B:
  · `N.3` ← `4.3` (0,78–0,88): “But I don’t frequent remote lodgings in the wilderness and the forest <X>.” (X = tính chất xấu);
  · `N.5` ← `4.5` (0,88–0,92): “I am one of those noble ones who frequent remote lodgings in the wilderness and the forest
    <Y>.’” (Y = tính chất tốt);
  · `N.6` ← `4.6` (0,84–0,89): “Seeing this <Y’> in myself I felt even more unruffled about staying in the forest.”
  với N = 8 (cả `8.3`, `8.5`, `8.6`), N = 9…18. A: `9.1`…`19.1` (11 khoá) “Then I thought,” ← `4.1` (Pāli `Tassa mayhaṁ, brāhmaṇa, etadahosi:`
  trùng nguyên văn) và `20.6` ← `20.3` (1,00) “the fourteenth, fifteenth, and eighth of the fortnight.”.
  Chỗ ít chắc chắn nhất (lời của lớp lấp, không có tiền lệ nguyên văn ở bản đã ghim): `8.6` “lack of desire”, `9.6` “heart full of
  love”, `10.6` “freedom from dullness and drowsiness”, `11.6` “settled state of mind”, `12.6` “going beyond doubt”, `15.6` “fewness of
  wishes”, `16.6` “this energy” — chọn các từ trung tính theo Pāli (`anabhijjhālutaṁ`, `mettacittataṁ`, `vigatathinamiddhataṁ`,
  `vūpasantacittataṁ`, `tiṇṇavicikicchataṁ`, `appicchataṁ`, `āraddhavīriyataṁ`); đã trừ vào điểm `ambiguity_integrity`.

  **Nhóm 4 — phần cuối.** `20.7` ← `20.4` (0,76) “On such nights I stayed in awe-inspiring and hair-raising shrines in parks, forests,
  and trees, in such lodgings.” (Pāli `viharāmi`, thì hiện tại lịch sử; chuyển sang quá khứ theo cách Sujato dịch cả đoạn);
  `21.6` ← `21.5` (0,83) lặp lại nguyên câu trích “A being not liable to delusion has arisen in the world …” (Pāli lặp câu trích hai lần;
  Sujato gộp cả hai vào `21.5` — lớp lấp lặp đúng chỗ Pāli lặp).
  **C (4 khoá).** `5.2`, `5.3` (nhóm 2), `19.7` “The Sixteen-Method Section is finished.” (`Soḷasapariyāyaṁ niṭṭhitaṁ.`; Pāli không có nhãn thứ tự),
  `35.6` “Fear and Dread is finished—the fourth.” (đúng vị trí: `mn3` `tatiyaṁ`, `mn5` `pañcamaṁ`).

  **Ngoặc — đo hai số.** `21.6` có Pāli ‘…’ (1 mở/1 đóng), lời đã ghim ở `21.5` không có nháy; lớp lấp giữ ‘…’ đúng Pāli. Trong 55 khoá lấp
  có 14 khoá Pāli mang nháy (`2.7`, `5.2`, `8.5`…`18.5`, `21.6`); lớp lấp khớp 14/14 (đo bằng máy). Toàn bài: 26 khoá Sujato mà Pāli mang ‘, 2 khoá đã ghim bỏ nháy.

  **Dấu lược:** Pāli 2 khoá có `…pe…` (`5.2`, `5.3`); lớp lấp có đúng 2 dấu `…`.

  **Khoá trống còn lại: 0.** 14 khoá dưới ngưỡng 40 ký tự nên không vào coverage nhưng vẫn lấp: `9.1`…`19.1` (11 khoá, 34 ký tự), `5.3` (28), `19.7` (26), `35.6` (39).
  41 khoá vào coverage.

  **Cố ý lệch tầng đã ghim:** không ghi đè khoá nào. Điểm ngoài lát, chỉ báo: lời đã ghim `8.2`, `9.2`, `10.2`, `11.2`, `12.2`, `13.2`, `14.2`,
  `15.2`, `16.2`, `17.2`, `18.2` (và `8.4`…`18.4`) kết bằng `…` nơi Pāli viết đủ (không có `…pe…`).

  Triangulation 8.0: bản Việt canonical của bài (`content/meta/sutta/mn/mn4.yaml`) có cùng họ công cụ với lớp lấp này (đo bằng cách so `translators`/`reviewers`/`quality.assessed_by` với `source/tooling.yaml`), nên lớp lấp KHÔNG phải cách đọc English độc lập và bài này không được tuyên bố là đã đối chiếu English độc lập. Bản Việt chỉ được dùng để đối chiếu nghĩa, không dịch vòng qua nó.

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối; không đặt blocker vì “chưa chạy” không phải lỗi thật.

  Hệ quả với `content/meta/reference-gaps.yaml`: `mn4` CÓ record trong tệp đó (coverage 85/126 = 0.6746, thiếu 16 khoá có nội dung để đạt ngưỡng 0,8). Sau khi lớp lấp này `published`, coverage = 126/126 = 1,0000, nên record trở thành thừa; tôi KHÔNG chạm tệp đó — người điều phối chạy lại `npm run reference:gaps` khi gom. Độ nhạy: trước lớp lấp thiếu 16 khoá (cần ⌈0,8×126⌉ = 101, có 85); sau lớp lấp thừa 25 khoá
  so với ngưỡng.
