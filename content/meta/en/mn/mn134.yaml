notes: |-
  **Phân loại 53 khoá (máy đo, so Pāli đã chuẩn hoá với các khoá đã có lời): A = 33 · B = 13 · C = 5 · D = 2.** Sau khi đọc từng khoá trong bối cảnh bài, phân loại thực tế của bản lấp là: **dùng lại nguyên văn 36** (33 khoá A + 2 khoá D đã giải + `5.16`, máy xếp B nhưng chỉ khác chữ `kho`) · **dựng lại từ lời đã ghim 5** (`5.3`, `5.4`, `5.6`, `5.26`, `14.19`) · **dịch theo công thức đã ghim ở các bài anh em 11** (`8-13.2`–`8-13.12`) · **dấu lược 1** (`5.18`). Cả 53 khoá nằm trong **ba dãy liên tiếp bị tầng đã ghim cắt cụt** (`5.3`–`5.27` 25 khoá; `8-13.2`–`8-13.12` 11 khoá; `14.1`–`14.16` 16 khoá) cộng một dòng kết bài (`14.19`); không có cơ chế gộp khoá nào, chỉ là dãy bỏ trống.

  **Nhóm 1 — `5.5`, `5.7`–`5.15`, `5.19`–`5.25`, `5.27`: các tỳ-kheo Lomasakaṅgiya kể lại điều xảy ra ở `2.x`–`4.x` (18 khoá, A).** Phần thuật lại trùng Pāli từng chữ với lời đối thoại ở `2.2`–`2.11` và với lời kệ ở `4.1`–`4.5`, `4.7` (đã kiểm bằng máy). Lấp dùng lại **từng chữ** lời đã ghim; chỉ đổi dấu nháy theo Pāli, vì lời kể nằm sâu hơn một tầng nháy: các khoá `2.x` mở “ thì `5.x` mở ‘ (`5.5`, `5.7`, `5.9`, `5.11`, `5.13`, `5.14`, `5.15`), và các khoá đóng ” thì `5.x` đóng ’ (`5.8`, `5.10`, `5.12`, `5.25`). Chữ đã ghim ở `2.3`–`2.9` rút gọn tân ngữ (“No, reverend, I do not.”, “Do you?”) và lấp giữ đúng cách rút gọn ấy để bài không tự mâu thuẫn, dù Pāli viết đủ `bhaddekarattassa uddesañca vibhaṅgañca`; đây là rút gọn của tầng đã ghim chứ không phải lựa chọn của lớp lấp.

  **Nhóm 2 — `5.3`, `5.4`, `5.6`, `5.16`, `5.26` (5 khoá, máy: B).** · `5.3` từ `1.3` (0,72): Pāli `Ekamidāhaṁ, bhante, samayaṁ sakkesu viharāmi …` là lời nói ngôi thứ nhất; lấp đổi ngôi và giữ nguyên cụm “in the Sakyan country at Kapilavatthu in the Banyan Tree Monastery”, thêm “Sir,” cho `bhante`. · `5.4` từ `2.1` (0,73): đổi ngôi (“he said to me”), `aññataro devaputto` → “a certain glorious godling” (bỏ tên Candana vì Pāli `5.4` chưa nêu tên), giữ nguyên “lighting up the entire Banyan Tree Monastery”, “went up to”, “stood to one side. Standing to one side, he said …”. · `5.6` (máy: B 0,66 với `6.2`, thực tế là câu dẫn lời): Pāli `Evaṁ vutte, ahaṁ, bhante, taṁ devaputtaṁ etadavocaṁ:` — dịch sát. · `5.16` từ `2.12` (0,98): chỉ khác chữ `kho`, dùng lại nguyên văn `2.12`. · `5.26` từ `4.6` (0,82): Pāli `Idamavoca, bhante, so devaputto` — lời đã ghim `4.6` “That is what the godling Candana said”; lấp đổi “Candana” thành “that” theo Pāli `so devaputto` (không nêu tên) và thêm “, sir,”.

  **Nhóm 3 — `5.17` và `14.1` (2 khoá, D).** Pāli trùng `3.1` và `7.1`, nhưng lời đã ghim khác ở nháy: `3.1` mở ‘ còn `7.1` mở “. Đây không phải khác nghĩa mà là khác tầng nháy. Phân xử bằng nháy của Pāli từng khoá: Pāli `5.17` mở “ (lời Đức Thế Tôn nằm trong lời thiên tử, trong lời tỳ-kheo) nên lấp mở “; Pāli `14.1` **không** mở nháy nên lấp không mở. Hệ quả: `14.1` là chữ “Don’t run back to the past,” không có nháy mở, đúng Pāli. Lời đã ghim `7.1` ở ngay trên mở “ và không đóng cho đến `8-13.1`, nên nháy ” ở `14.16` là cái đóng của lời Đức Thế Tôn mở từ `7.1`.

  **Nhóm 4 — `14.2`–`14.16` (15 khoá, A) và `5.20` (A).** Mười bốn dòng kệ cuối bài lặp đúng kệ ở `7.2`–`7.15`; lấp dùng lại nguyên văn lời `7.2`–`7.15`. `14.16` Pāli `santo ācikkhate munī”ti` (khác `7.16` `muni.` ở nguyên âm và có `ti` đóng nháy) nên lấp dùng lời `7.16` “so declares the peaceful sage.” và thêm ” đóng theo Pāli; `5.20` cùng Pāli dạng `munī”ti` nên cùng dạng “… the peaceful sage.”” (khác `3.16` đã ghim đóng ’ vì ở đó kệ nằm trong lời một tầng nháy). Số nháy khớp Pāli từng khoá.

  **Nhóm 5 — `8-13.2`–`8-13.12` (11 khoá, máy: B/C, thực tế dịch theo công thức đã ghim ở bài anh em).** Pāli bài này rút ngắn đoạn phân tích sáu vế ở `8`–`13` bằng `…pe…`: khoá `8-13.1` đã ghim chỉ dịch vế đầu (“And how do you run back to the past? …”), rồi bỏ trống mười một khoá còn lại. Các công thức này **không** có lời nào khác trong cùng bài, nên lấp dùng công thức tầng đã ghim dịch ở các bài có cùng đoạn (mn131 và mn133): “And how do you run back to the past?”, “That’s how you run back to the past.”, “falter amid presently arisen phenomena”, “anticipate the future” (khớp “don’t anticipate the future” ở `7.2`). Các khoá `Kathañca … …pe…` kết bằng đúng một `…` như Pāli (`8-13.3`, `8-13.5`, `8-13.7`, `8-13.9`, `8-13.11`); các khoá `evaṁ kho …` kết bằng dấu chấm. Đây là lấp dùng **thuật ngữ của chính tầng đã ghim ở bài anh em**, không phải câu chép lại, nhưng người đọc đối chiếu sẽ thấy cùng một công thức.

  **Nhóm 6 — `5.18` (1 khoá, C).** Pāli `…pe…` — một khoá chỉ gồm dấu lược (chỉ báo kệ `Atītaṁ nānvāgameyya … santo ācikkhate munī` được rút gọn ở giữa). Lấp: đúng một “…”. Khoá dưới ngưỡng 40 ký tự.

  **Nhóm 7 — `14.19` (1 khoá, B).** Dòng kết bài `Lomasakaṅgiyabhaddekarattasuttaṁ niṭṭhitaṁ catutthaṁ.` → “Lomasakaṅgiya and One Fine Night is finished—the fourth.”, từ tên bài đã ghim ở `0.2`.

  **Nháy.** 53 khoá khớp Pāli từng khoá (script: 0 khoá lệch): `5.3` mở “ · `5.5`, `5.13`, `5.14` ‘ ’ · `5.7`, `5.9`, `5.11`, `5.15` mở ‘ · `5.8`, `5.10`, `5.12`, `5.25` đóng ’ · `5.17` mở “ · `5.20`, `14.16` đóng ” · các khoá còn lại 0. **Dấu lược:** Pāli có `…pe…` ở `5.18` và 5 khoá `8-13.x`; lấp có đúng một `…` ở mỗi khoá đó (tổng 6), 0 ở các khoá còn lại.

