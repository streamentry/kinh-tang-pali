  **Coverage — bài dưới ngưỡng nặng nhất của lát.** Mẫu số 58 (Pāli có nội dung, bỏ khối `:0`). Trước lớp lấp: 29/58 = **0,5000**; sau khi `published`: 58/58 = **1,0000**. Ngưỡng 0,8 cần tối thiểu 47/58; nếu lớp lấp thiếu 11 khoá có nội dung nữa thì bài vẫn dưới ngưỡng. Bài `mn134` **có** record trong `content/meta/reference-gaps.yaml` (29 trong 58 đoạn có nội dung không có English, 0,5000); sau khi lớp này `published` record đó **thành thừa** và `npm run reference:gaps` cần chạy lại — lát này không được sửa tệp đó. Nguyên nhân của khoảng trống là **cắt cụt dãy** của tầng đã ghim (ba dãy kể trên), không phải gộp khoá và không phải khác biệt về cách dịch.

