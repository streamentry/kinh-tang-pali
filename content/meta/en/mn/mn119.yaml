notes: |-
  **Phân loại 29 khoá (đo bằng máy): A = 4 · B = 7 · C = 18 · D = 0.** Đã ghi 29/29 khoá `fillableSegments`; 8 khoá có nội dung (≥ 40 ký tự), 21 khoá ngắn (dấu lược, danh sách tâm, colophon).

  **A (4):** `7.8` ← `7.2` (danh sách 31 thể trược, nguyên văn); `11-14.5` ← `9.2`; `11-14.6` ← `9.3`; `11-14.8` ← `10.5`/`19.6` (cùng lời).

  **B — lời các tỳ-kheo kể lại (`2.8`, `2.9` ← `2.2`, `2.3`, chuẩn hoá trùng 1,0):** chỉ đổi nháy kép của `2.2`/`2.3` sang nháy đơn đúng Pāli (`‘…’` lồng trong lời trình). `2.10` (C theo máy, 0,45) dựng từ “conversation was left unfinished” của `2.4`: “Sir, this was our conversation that was left unfinished when the Buddha arrived.” **Lưu ý tầng ghim:** `2.7` Sujato tóm “So the mendicants told him what they had been talking about. The Buddha said:” — cụm “The Buddha said:” vốn dẫn sang `3.1`; khi `2.8`–`2.10` được lấp, người đọc gặp “The Buddha said:” ngay trước lời của các tỳ-kheo. Lớp lấp theo Pāli, không sửa `2.7`.

  **B — bốn khoá `Tassa evaṁ appamattassa …pe…` (`10.4`, `11-14.7`, `19.5`, `20.5`), nguồn `15-17.7`/`18.5` (chuẩn hoá trùng):** ở hai nguồn ấy Pāli chỉ có `Tassa evaṁ appamattassa …` mà Sujato **mở rộng** đủ câu (“As they meditate like this—diligent, keen, and resolute—memories and thoughts tied to lay life are given up.”, Pāli 1 dấu lược ↔ Sujato 0). Lớp lấp **không** sao chép phần mở rộng: dịch đúng phần Pāli có rồi đặt **một** `…`: “As they meditate like this—diligent …”. Bốn khoá lấp giống nhau từng chữ.

  **B — `15-17.1` ← `11-14.1` (0,76):** “Furthermore, suppose they were to see a corpse discarded in a charnel ground—”, giữ gạch ngang của Pāli; không thêm dấu lược vì Pāli không có.

  **C — 16 khoá tâm (`39.2`–`39.17`).** Tầng ghim kết `39.1` bằng `…` và bỏ trống cả danh sách. Thuật ngữ lấy từ chính Sujato ở đoạn song song `dn2:91.3`–`91.18` và `mn77:33.2`–`33.17` (mind with/without greed, hate, delusion; constricted/scattered; expansive/unexpansive; not supreme/supreme; immersed/unimmersed; freed/unfreed). Dấu lược theo Pāli **từng khoá**: `39.3` (`…pe…`) và `39.4`–`39.16` (`…`) mỗi khoá đúng một `…`; `39.2` và `39.17` viết đủ, không `…`. Nháy `‘…’` ở `39.2`, `39.17` khớp Pāli; dấu phẩy đặt ngoài nháy như `mn77:33.2`.

  **C — `43.4`** colophon ⇒ “Mindfulness of the Body is finished—the ninth.” (tên theo `0.2` của Sujato).

  **Ngoặc và dấu lược:** 29/29 khoá khớp Pāli. Lưu ý tầng ghim (không thuộc lát): `7.7`, `39.1` Sujato thêm `…` nơi Pāli viết đủ; `15-17.7`, `18.5` mở rộng dấu lược; `4.7`–`9.4` dùng “domestic life” còn `15-17.7`/`18.5` dùng “lay life” cho cùng `gehasitā` — lớp lấp không chạm vế đó vì nó nằm sau dấu lược.

  Triangulation 8.0: scorecard Việt của `mn119` (`content/meta/sutta/mn/mn119.yaml`) ghi `quality.assessed_by` thuộc **cùng họ công cụ hỗ trợ** với lớp lấp này (đối chiếu `source/tooling.yaml`). Vì vậy bản lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không** được tuyên bố là đã đối chiếu English nhờ lớp lấp. Đối chiếu thật sự có: Pāli root đã ghim + Sujato đã ghim (mọi khoá có lời) + bản Việt canonical (chỉ để đối chiếu nghĩa, không dịch vòng, không chép câu).

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; bốn lệnh đó còn nợ, nên không tuyên bố technical gate pass. Không đặt blocker vì chưa chạy không phải validation failure. Đã tự kiểm bằng máy: JSON parse, mọi khoá ⊆ `fillableSegments` của bài, 0 khoá shadow, NFC, 0 khoá rỗng, thứ tự khoá theo Pāli, Pāli trùng nguyên văn ⇒ English trùng (trừ các chỗ ghi ở trên), dấu lược và nháy so với Pāli từng khoá (dấu `’` có chữ thường đứng ngay sau tính là dấu nhạt lượu).

  Hai cơ chế khoá trống của tầng đã ghim (đo rồi báo, không sửa — sửa là shadow): **cắt cụt dãy** (dãy ≥ 4 khoá trống liên tiếp) = 2 dãy / 21 khoá / 637 ký tự Pāli; **bỏ dòng song song** (chỉ xét khoá trống, thân từ = 6 chữ đầu của từ ≥ 4 chữ, khoá mở nhóm gom mọi khoá trống chưa vào nhóm có tỉ lệ chung ≥ 0,70, mỗi khoá thuộc đúng một nhóm) = 6/29 khoá. Khoá đã ghim có chữ nhưng ngắn dưới 25% Pāli (Pāli ≥ 40 ký tự): 0.

