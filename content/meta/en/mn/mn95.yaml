notes: |-
  **Phân loại 72 khoá. Script (so Pāli đã chuẩn hoá dấu câu): A = 7 · B = 51 · C = 12 · D = 2. Đọc lại bằng tay: A = 5 · B = 25 · C = 42
  (41 khoá C là dựng theo khuôn của lời đã ghim, xem Nhóm C; 1 khoá là colophon) · D = 0.** Lấp đủ 72/72 khoá tầng Anh đã ghim để trống
  (không còn khoá trống nào của bài): 56 khoá đủ ngưỡng 40 ký tự (sau khi bỏ khoảng trắng cuối) và 16 khoá dưới ngưỡng. Khoá dưới ngưỡng
  vẫn được lấp vì là mắt xích của chuỗi nhân–quả `23`–`32` (câu “If you don’t …”, “You … because you …”) và của hai vế trích dẫn `13.15`–`13.19`.

  **Nhóm A — 5 khoá, dùng lại nguyên văn lời đã ghim của cùng bài.** `13.15`, `13.18` = `13.2` (“‘I know this, I see this:”) · `17.9`, `18.7`,
  `19.7` = `17.5` (“that they know, even though they don’t know, or that they see, even though they don’t see;”, Pāli trùng từng chữ).

  **Nhóm B — 25 khoá, dựng lại từ lời đã ghim (khớp ≥ 0,69).**
  · `6.9`, `6.10` ← `6.6`, `6.7` (khớp 1,00): người hầu thuật lại lời Caṅkī: “Sirs, the brahmin Caṅkī says:” … “‘Sirs, please wait, for the brahmin Caṅkī will
  also go to see the ascetic Gotama.’”; `7.7` ← `7.3`/`7.5` (0,81): “‘I am going to see the ascetic Gotama.’” — lời lấp thêm ’” khớp Pāli, trong khi tầng
  đã ghim ở `7.6` đã gộp cả “It is true” lẫn lời trả lời và đóng nháy kép.
  · `9.29` ← `9.26` (0,80), `9.30` ← `9.28` (0,92). **Phần tầng đã ghim nuốt mất:** Pāli `9.28` có bốn động từ tôn kính (`sakkātabbā garukātabbā mānetabbā
  pūjetabbā`), tầng đã ghim ở `9.28` chỉ dịch hai (“honored and respected”). Lớp lấp ở `9.30` dịch đủ bốn (“honored, respected, esteemed, and venerated”)
  vì Pāli ở đó viết đủ, nên `9.28` và `9.30` không giống nhau về độ dài; không sửa `9.28`.
  · `13.16`, `13.19` ← `13.22` (1,00, cùng Pāli): “this is the only truth, anything else is futile’;” — lời ấy khác `13.22` chỉ ở dấu chấm phẩy cuối.
  · `14.6` ← `14.3` (0,85): “These five things can be seen to turn out in two different ways in this very life.” (câu tổng kết sau danh sách năm pháp).
  · `15.2`, `16.3`, `21.3` ← `34.1`, `34.3`, `34.5` (0,69–0,71) và `22.3` ← `34.7`: “I ask the worthy Gotama about …” (`mayaṁ … pucchāmā`; tầng đã ghim dùng “I”
  cho `mayaṁ` ở `21.1`, `22.1`, `34.1`–`34.10`, trừ `16.1` dùng “We”).
  · `17.10`, `18.8`, `19.8` ← `19.4` (0,98): “or that they might encourage others to do what is for their lasting harm and suffering.” — lời `19.4` đã ghim kết bằng
  dấu hỏi và nháy đơn đóng vì ở `17.4`–`19.4` đó là câu hỏi; Pāli của ba khoá này kết bằng dấu chấm và không có nháy, nên lấp kết bằng dấu chấm.
  · Mười khoá câu hỏi `24.1`–`33.1` ← `23.1` (0,81–0,94): “But what quality is helpful for [Y]?”, với [Y] là phẩm của câu trước:
  weighing up the teachings · making an attempt · enthusiasm · accepting the teachings after deliberation · examining the meaning of the
  teachings · remembering the teachings · hearing the teachings · active listening · paying homage · approaching a teacher, đều theo
  đúng cụm từ mà tầng đã ghim dùng ở `23.3`–`33.3`. Nháy kép mở ở `x.1` và đóng ở `x.2` như Pāli (tầng đã ghim ở `23.1` đóng nháy ngay sau câu hỏi).

  **Nhóm C — 42 khoá, dựng theo khuôn (ratio thấp) hoặc tự dịch.**
  · 11 khoá `23.2`–`33.2` (khớp 0,58–0,61 với `34.x`) “I ask the worthy Gotama about the quality that is helpful for [Y].” — khuôn câu của `34.1`–`34.7` và cụm
  “what quality is helpful for” của `22.2`/`23.1`.
  · 30 khoá `23.4`–`32.6` — mười bộ ba “If you don’t [Z], you won’t [Y].” / “You [Y] because you [Z].” / “That’s why [Z] is helpful for [Y].” (khớp 0,55–0,79 với
  `22.5`–`22.7` và `33.4`–`33.6`, hai bộ ba duy nhất đã ghim đủ). Mỗi bộ ba lấp đúng cặp (Y, Z) của phẩm mà tầng đã ghim nêu ở `x.3`: striving ← weighing up the teachings ←
  making an attempt ← enthusiasm ← accepting the teachings after deliberation ← examining the meaning of the teachings ← remembering the teachings ← hearing the
  teachings ← active listening ← paying homage ← approaching a teacher ← faith. Cách dịch động từ: `padahati` = “strive”, `tuleti` = “weigh up the teachings”,
  `ussahati` = “make an attempt”, `chando jāyati` = “enthusiasm springs up”, `dhammā nijjhānaṁ khamanti` = “accept the teachings after deliberation”, `atthaṁ upaparikkhati`
  = “examine their meaning”, `dhammaṁ dhāreti` = “remember the teachings”, `dhammaṁ suṇāti` = “hear the teachings”, `sotaṁ odahati` = “actively listen”, `payirupāsati` = “pay
  homage”, `upasaṅkamati` = “approach a teacher” — tất cả theo từ vựng đã ghim ở `20.2`, `22.4`–`22.7`, `23.3`–`33.6` của chính bài.
  · `35.3` colophon `Caṅkīsuttaṁ niṭṭhitaṁ pañcamaṁ.` — “With Caṅkī is finished—the fifth.”, theo khuôn colophon đã lấp ở `mn20`, `mn117`, `mn123`, với tên kinh của `0.2`.

  **Nhóm D — script báo 2 khoá (`13.16`, `13.19`), không có mâu thuẫn thật:** Pāli trùng tám khoá có lời khác nhau chỉ ở chữ hoa/dấu câu (`12.12`, `13.3`, `13.7`,
  `13.12`, `13.22`, `14.15`, `15.6`, `15.13`); lớp lấp lấy lời của khoá có Pāli giống từng chữ nhất (`13.22`).

  **Chỗ người đọc sẽ thấy lạ, nói thẳng (không sửa tầng đã ghim).** Tầng đã ghim ở `17.8`, `18.6`, `19.6` bỏ vế “… yathārūpehi … dhammehi pariyādinnacitto ajānaṁ vā vadeyya—”
  (“that, with the mind overwhelmed by them, they might say”) nên `17.9` “that they know, even though they don’t know …;” và `17.10` “or that they might encourage …” đứng sau câu
  “‘This venerable has no such qualities that arouse greed.” như hai mảnh không có chủ ngữ. Lớp lấp dịch đúng Pāli của hai khoá chứ không điền lại vế bị bỏ, vì vế ấy thuộc
  khoá `17.8` đã ghim.

  **Nháy.** 72/72 khoá khớp Pāli (đo đủ bốn loại: nháy kép mở/đóng, nháy đơn mở/đóng). Không có chỗ lệch có chủ đích về nháy.

  **Dấu lược.** Không khoá nào trong 72 khoá chứa `…` ở Pāli; tổng dấu lược của lớp lấp bằng 0 (tầng đã ghim có “…” ở `23.3`–`32.3` thay cho các khoá `x.4`–`x.6` mà lớp lấp vừa dựng lại; không sao chép).

  **Cố ý lệch tầng đã ghim:** (1) `9.30` dịch đủ bốn động từ tôn kính; (2) `x.1` mở nháy ở khoá câu hỏi và đóng ở `x.2` (Pāli), khác `23.1` đã ghim đóng ngay sau câu hỏi;
  (3) `17.10`, `18.8`, `19.8` kết bằng dấu chấm thay cho dấu hỏi của `19.4`.

  **Coverage (mẫu số = khoá Pāli ≥ 40 ký tự, bỏ `:0`; không phải mọi khoá):** trước 187/243 = **0,7695** (dưới ngưỡng); sau 243/243 = **1,0000** (sau khi `published`).
  Độ nhạy: ngưỡng 0,8 cần ≥ 195/243; lớp lấp thêm 56 khoá nên dư 48 khoá. Bài này **có** record trong `content/meta/reference-gaps.yaml`
  (`coverage` ≈ 0,7695); sau khi `published` record đó trở thành thừa — không chạm tệp ấy, để người điều phối sinh lại bằng `npm run reference:gaps`.

  **Triangulation 8.0 — bản lấp không phải cách đọc English độc lập.** Scorecard Việt của `mn95` (`content/meta/sutta/mn/mn95.yaml`) ghi `quality.assessed_by` **trùng họ công cụ**
  với lớp lấp này (đối chiếu theo `source/tooling.yaml`); bài này **không** được tuyên bố là đã đối chiếu English độc lập. Bản Việt canonical được dùng để đối chiếu nghĩa ở 72 khoá,
  không dịch vòng qua nó. Phần lớn khoá Nhóm C chỉ dựa vào Pāli và khuôn của bài; đó là lý do `ambiguity_integrity` bị hạ.

  technical_integrity 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối.
