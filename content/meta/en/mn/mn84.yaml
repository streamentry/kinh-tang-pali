notes: |-
  **Phân loại 40 khoá (đo bằng máy; ngưỡng B = độ tương đồng Pāli ≥ 0,60 với một khoá đã có lời): A dùng lại nguyên văn = 4 · B dựng lại = 35 · C tự dịch = 1 · D Pāli trùng nhưng lời tầng khác nhau = 0.** Đã ghi 40/40 khoá `fillableSegments` (trong đó 20 khoá có nội dung ≥ 40 ký tự Pāli; 20 khoá còn lại dưới ngưỡng, không vào coverage). Số khoá trống còn lại của bài: 0 (mọi khoá tầng đã ghim để trống đều đã lấp). Pāli chứa 23 dấu lược (`…pe…` hoặc `…` = đúng một `…` mỗi nơi), bản lấp giữ đúng 23; 19 khoá có nháy trong Pāli. Trong bài có 28 nhóm Pāli trùng nguyên văn (108 khoá).

  **Cấu trúc.** Phân đoạn Pāli lặp cùng một câu cho bốn đẳng cấp (khattiya/bà-la-môn/vessa/sudda), mỗi lần liệt kê bốn hạng người “dậy trước, ngủ sau, vâng lệnh, làm điều vừa ý, nói lời dễ nghe”. Tầng đã ghim chỉ dịch trọn câu ở `5.10` và `5.35`, rút gọn các câu trả lời thành “There would, worthy Kaccāna.” (`5.14`) và để `5.19`, `5.27` dở dang. Lớp lấp dịch từng khoá từ Pāli, mượn khung câu của `5.10`: “who would get up before him and go to bed after him, and be obliging, behaving nicely and speaking politely”.

  **A — 4 khoá dùng lại nguyên văn:** `5.2`–`5.5` ← `4.2`–`4.5` (`9.19`–`9.21` cho `5.2`–`5.4`). `5.5` cố ý **không** chép lỗi lặp “the the Divinity’s” của `4.5` mà dùng “the Divinity’s” như `9.22`.

  **B — nhóm `5.7`, `5.8`, `5.49`, `5.50`, `6.23`, `7.21`, `8.23`:** `5.7`/`5.49` ← `4.2` (0,93), giữ một `…` cho `…pe…`; `5.8`/`5.50` = “heirs of the Divinity.’” (đuôi `4.5`; `brahmadāyādā’ti`); `6.23`/`7.21`/`8.23` ← `4.2` (0,77) với một `…` giữa hai đầu. Ba khoá cuối có ’” đóng khớp Pāli.

  **B — nhóm các câu về người sung túc (`5.11`–`5.13`, `5.15`–`5.17`, `5.20`–`5.26`, `5.28`–`5.34`, `5.36`–`5.38`, `5.40`–`5.42`).** Nguồn: `5.10` (0,57–0,63 với khoá mang đủ danh sách) và `5.19`, `5.27`, `5.35`. Từng khoá chỉ chứa một hạng người (“brahmins …”, “peasants …”, “menials …”) hoặc câu kết (“and menials who would get up …”). Khoá mở câu trả lời `5.23`, `5.31` (0,95 / 0,87 với `5.19`, `5.27`) dịch thật từ Pāli: “Worthy Kaccāna, if a brahmin prospers in money, grain, silver, or gold, there would be brahmins who would get up before him … politely …”. Pāli `5.39` lược dấu nháy (`piyavādīti …`) nhưng khoá đó đã ghim, lớp lấp không chạm.

  **B — `11.2`, `11.3` ← `11.1` (0,80 · 0,87).** Sujato gộp “ten … twenty … up to a hundred leagues” vào `11.1`, nuốt hai dãy số của Pāli `11.2` (hai mươi … năm mươi) và `11.3` (một trăm); lớp lấp dịch đúng hai dãy ấy, thêm “the perfected one, the fully awakened Buddha” của `arahantaṁ sammāsambuddhaṁ` mà tầng đã ghim lược.

  **C — `11.6`**: colophon `Madhurasuttaṁ niṭṭhitaṁ catutthaṁ.` (“At Madhurā is finished—the fourth.”; tiêu đề lấy từ `0.2`).

  **Nháy.** Nháy theo Pāli từng khoá: 8 khoá kết (`5.13`, `5.17`, `5.22`, `5.26`, `5.30`, `5.34`, `5.38`, `5.42`) kết thúc bằng ” như Pāli `”ti`. Tầng đã ghim lại đặt ” ở `5.10`, `5.14`, `5.18`, `5.35`, `5.39` (Pāli ở đó không có ”); vì vậy cột Anh có ” dư so với cân tổng nhưng khớp Pāli từng khoá. Mở ngoặc ở `5.23`, `5.31` theo Pāli. Không sửa được tầng đã ghim.

  **Cố ý lệch / báo:** `5.5` khác `4.5` ở chữ lặp “the the” (lỗi của tầng đã ghim, không chép). Nhiều khoá chỉ vài chữ (“menials …”) vì Pāli viết lược `…`; đó là trung thực với cấu trúc nguồn, không phải thiếu sót.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài không có record (coverage trước đã trên ngưỡng 0,80), nên không có record nào thành thừa. Coverage trên Pāli có nội dung: trước 82/102 = **0,8039**, sau (khi `published`) 102/102 = **1,0000**. Độ nhạy: ngưỡng 0,80 cho phép thiếu tối đa 20/102 khoá có nội dung; bản đã ghim đang thiếu 20, bản lấp bù đủ 20. Chỉ tính khi `status: published`; nếu hạ xuống `review`/`draft` thì coverage quay về mức trước.

