notes: |-
  **Phân loại 20 khoá (đo bằng máy, theo Pāli của từng khoá so với khoá có lời Sujato trong cùng bài):
  A = 10 · B = 3 · C = 6 · D = 1.**

  **A (10 khoá).** 7.5, 7.6, 7.8, 7.9 = 4.7, 4.8, 4.11, 4.12 (dấu chân thứ tư lặp lại dấu chân thứ nhất);
  22.3, 23.4, 24.4 = 19.4 “But a noble disciple does not yet come to the conclusion,”; 22.4, 23.5, 24.5 =
  3.6/4.16/7.19 (cùng một lời).

  **B (3 khoá).** 7.3 từ 4.4 (Pāli chỉ khác dấu phẩy, 1,00); 7.4 = 4.5 + 4.6 nối liền vì Pāli gộp hai khoá
  ấy làm một (0,82); 7.7 từ 4.9 + 4.10: tầng đã ghim ở 4.9/4.10 rút thành “When they hear that / he has come
  down” và **bỏ nháy**, còn Pāli 7.7 có lời thuật `‘… osaṭo’ti`, nên lớp lấp dịch đủ lời thuật trong nháy đơn
  (“When they hear, ‘So, worthy sir, the ascetic Gotama has come down to such-and-such village or town,’”),
  nối với 7.8 đã lấy theo A (“they approach him.”).

  **D (1 khoá).** `Te suṇanti:` (7.2) trùng 4.3 (“They hear,”) và 4.9 (“When they hear that”). Lớp lấp lấy
  4.3 vì 7.2 đứng đúng vị trí của 4.3 (trước lời đồn “sẽ đến”). Không tự hòa tầng đã ghim.

  **C (6 khoá).** 10.7, 10.13, 10.19 `So tamanugacchati.` → “They follow it.” (tầng đã ghim gộp ý này vào
  khoá sau: “They keep following the track until …”). 20.3, 21.3 — đuôi `suppaṭipanno … ’ti` của câu kết
  luận bị `…pe…` của khoá trước cắt ra — lấy đúng vế cuối của lời Sujato ở 19.5: “The Saṅgha is practicing
  well.’”. 27.6 kết bài: “The Shorter Simile of the Elephant’s Footprint is finished—the seventh.”

  **Ngoặc:** khớp Pāli 20/20. **Dấu lược:** Pāli 0, lớp lấp 0.

  **Lỗ hổng của bộ đo.** 2 khoá có lời Sujato ngắn dưới 30% Pāli (`4.10`, `12.3`), tính là đã phủ.

  Triangulation 8,0: scorecard Việt của `mn27` ghi `quality.assessed_by` **trùng** alias của lớp lấp này
  (khai trong `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập, và scorecard Việt
  không được tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu có: Pāli root, Sujato đã ghim, bản Việt
  canonical. Không chạm tầng Việt.

  technical_integrity 9,6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`
  trong lát này, nên không tuyên bố technical gate pass. Bốn lệnh còn lại cho người điều phối.

