notes: |-
  **Phân loại 28 khoá (đo bằng máy): A = 9 · B = 14 · C = 5 · D = 0.**

  **A (9) — nguyên văn từ cùng bài:** `5.3`, `6.4`, `23.3` ← `22.2`; `5.4`, `6.5`, `23.4` ← `22.3`; `6.9` ← `3.2`; `6.13`, `23.12` ← `8.5`.

  **B (14), tỉ lệ khớp đo được:** `6.3` ← `5.2` (0,97, chèn “Reverend Kaccāna,” cho `āvuso kaccāna`) · `6.7`, `23.6` ← `5.2` (1,00) · `6.8`, `23.7` ← `22.2` (1,00) · `23.8` ← `3.2` (1,00) · `6.10`, `23.9` ← `5.5` (1,00) · `6.12`, `23.11` ← `5.7` (1,00) · `6.14`, `23.13` ← `5.9` (1,00) · `23.2` ← `9.4` (0,95, thay “Reverends” bằng “Sir” cho `bhante`) · `23.14` ← `6.1` + `5.9` (0,86): “Then, sir, we went to Venerable Mahākaccāna and asked him about this matter.”
  Ở B, chữ giữ nguyên; chỉ đổi **dấu nháy** cho khớp tầng lồng của Pāli (vd. `6.8` Pāli mở `“` vì lồng trong `‘` của `6.7`; `23.7`/`23.8` Pāli không có nháy). Ở `6.7`, `23.6` dùng dấu hai chấm như `9.4`/`22.1` của tầng ghim (Pāli `:`/`—` dẫn câu tóm lược), không dùng dấu chấm của `5.2`.

  **C (5):** `6.6`, `23.5` (dựa từ vựng `5.1` “Soon after the Buddha left … considered”), `6.11`, `23.10` (`Tesaṁ no … etadahosi:` ⇒ “Reverend Kaccāna, we thought,” / “Sir, we thought,”), `24.6` colophon (40 ký tự): “A Summary Recital and its Analysis is finished—the eighth.”

  **Hệ quả dễ thấy:** tầng ghim ở `6.2` và `23.1` đã tóm “told him what had happened”, nên đọc liền sẽ thấy lời kể lại đầy đủ ngay sau — đó là Pāli thật. Pāli `6.14` kết bằng `’ti—` nối vào `6.15` của tầng ghim (“May Venerable Mahākaccāna please explain this.” — tầng ghim tự mở `“` ở đó).

  **Nháy:** 28/28 khoá khớp Pāli. **Dấu lược:** Pāli 0, lớp lấp 0.

  **Đo hai cơ chế khoá trống:** cắt cụt dãy = 2 dãy / 25 khoá / 3.049 ký tự Pāli; bỏ dòng song song = 7 nhóm / 26 khoá. Tầng ghim tự thêm `…` ở `19.1`.

  **Coverage:** mẫu số 124; trước 97/124 = 0,7823 (**dưới ngưỡng**); sau khi `published` 124/124 = 1,0. Độ nhạy: mất thêm hơn 24 khoá mới rớt dưới 0,8. Bài **có** record trong `content/meta/reference-gaps.yaml`; sau khi lát này `published`, record ấy thành thừa — **không** sửa tay, để người điều phối chạy lại `npm run reference:gaps`.

  Triangulation 8.0 (trần của luật): scorecard tiếng Việt của bài này (`content/meta/sutta/…`) ghi `quality.assessed_by` **trùng họ công cụ** với lớp lấp (alias khai trong `source/tooling.yaml`). Vì vậy bản lấp này **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English nhờ lớp lấp. Đối chiếu đã có: Pāli root (authority) + lời Sujato đã ghim của chính bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

  Tự kiểm bằng máy trước khi ghi: JSON parse; mọi khoá ⊆ `fillableSegments` của bài; không khoá nào trùng khoá tầng Sujato đã có chữ (0 shadow); NFC; không khoá rỗng; dấu lược đếm theo luật `…pe…` = đúng một `…` — khớp Pāli ở mọi khoá; nháy đếm theo luật `’` + chữ thường = dấu nháy lửng (apostrophe) tiếng Anh, còn lại là nháy đóng.

