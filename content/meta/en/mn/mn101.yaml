notes: |-
  **Phân loại theo máy trên 72 khoá: A 18 · B 48 · C 1 · D 5.** Dùng lại **nguyên văn** từ cùng bài: 18 khoá (đúng bằng số khoá nhóm A). Đã dò 18 nhóm Pāli trùng nguyên văn trong bài (tổng 56 khoá, gồm cả khoá đã ghim lẫn khoá lấp); với mỗi nhóm đó, mọi khoá lấp đều mang cùng lời với khoá còn lại của nhóm, ngoại trừ các khoá D đã nêu. Số khoá đã ghi: 72/72 khoá `fillableSegments`.

  **Hình dạng của chỗ trống.** Bài lặp bốn lần cặp “nếu các vị biết / không biết” (`5`, `6`, `8`, `9`), ba lần đoạn trích Pāli của người Jain (`5.8`–`5.10`, `6.8`–`6.10`, `8.8`–`8.10`, `9.8`–`9.10`, `13.4`–`13.6`, `14.4`–`14.6`, `15.4`–`15.6`), vế thuật lại dụ mũi tên độc (`7.18`–`7.24`), hai bộ mười căn cứ (`22`, `46`) và vài khoá lẻ. 72 khoá, 69 khoá có nội dung đo được.

  **Nhóm 1 — A nguyên văn (18 khoá).** `3.4`, `5.9`, `6.9`, `8.9`, `9.9`, `13.5`, `14.5`, `15.5` ← `2.6`/`10.7` (giống nhau từng chữ); `5.10`, `6.10`, `8.10`, `13.6`, `14.6` ← `10.8`; `27.10` ← `29.14`; `29.9` ← `27.5`, `29.11` ← `27.7`, `29.12` ← `27.8`/`29.2`, `29.13` ← `27.9`.

  **Nhóm 2 — D (5 khoá, báo).** `5.8`, `6.8`, `8.8`, `9.8`, `14.4` có Pāli giống hệt `13.4` và `15.4`, nhưng hai khoá đã ghim ấy khác nhau về lời: `13.4` “… is because of past deeds. …”” và `15.4` “… is because of past deeds. …”?’”; cả hai kết bằng “…” ở nơi Pāli của chính khoá viết đủ (“…” ấy thay cho các khoá `13.5`/`13.6`, `15.5`/`15.6` mà tầng ghim bỏ trống). Lớp lấp dùng **phần lõi chung** của hai lời, không có “…” và không đóng nháy, đúng với Pāli của khoá (mở “ và không đóng): “Everything this individual person experiences—pleasurable, painful, or neutral—is because of past deeds.”. `3.3` dùng cùng lõi nhưng **không** mở nháy (Pāli `3.3` không có nháy).

  **Nhóm 3 — B (48 khoá).** `3.3` ← `2.5` (1,00), `3.5` ← `2.7` (0,99), `9.10`/`15.6` ← `2.7` (1,00; đóng thêm `”` vì Pāli kết `”’ti`); `5.2`–`5.6`, `6.2`–`6.6`, `8.2`–`8.6`, `9.2`–`9.6` ← `4.3`, `4.6`, `4.9`, `4.12`, `4.15` (0,84–0,96): Pāli của năm vế đã ghim ở `4.x` là câu **hỏi** “Do you know for sure that …?”; ở `5.x`–`9.x` Pāli là mệnh đề + `na jānātha—` / `jāneyyātha—` nên lớp lấp lấy lại mệnh đề đã ghim (bỏ `?’`) và gắn “—you don’t know this—” / “—if you knew this—”. **Phần tầng ghim nuốt:** ở `4.6` (“for sure that you did bad deeds in the past?”) Pāli còn `na nākaramhā` (“không phải là không làm”) — chèn lại thành “and it is not the case that you did not do them”. `7.18`–`7.24` ← `7.5`–`7.11` (0,91–0,94): Pāli ngôi thứ nhất quá khứ; tầng ghim gói cả bảy bước vào `7.17` (“At each step, the treatment was painful.”); dựng thành “The scalpel cutting open the wound caused me painful feelings, sharp and severe.” và các dòng tương ứng. `15.2` ← `13.2` (0,99): tầng ghim `13.2` chỉ là “not without intense exertion.”; chèn lại “at a time without intense exertion and striving you don’t suffer painful, sharp, severe, acute feelings due to exertion”. `22.14`, `22.16`, `22.18`, `22.20`, `22.22` ← `22.13`/`22.15`/`22.17`/`22.19`/`22.21` (0,88–0,89) và `46.14`, `46.16`, `46.18`, `46.20`, `46.21` ← `46.13`/`46.15`/`46.17`/`46.19`/`46.22` (0,88–0,89): tầng ghim gộp “whether or not” vào khoá `sace`; vế `no ce … gārayhā`/`pāsaṁso` được chèn lại thành câu điều kiện phủ định (“If sentient beings don’t experience … because of …, the Jains deserve criticism.”). `23.6`/`26.5` ← `23.9` (0,81), Pāli giống nhau ⇒ English giống nhau từng chữ (“But for whichever source of suffering they become dispassionate by developing equanimity, they develop equanimity there.”); tầng ghim ở `23.5` gộp `23.5`+`23.6` thành một câu “either actively strive or develop equanimity as appropriate”. `24.8`, `25.12` ← `25.3` (0,92–0,93): hai vế kết luận của ví dụ người đàn ông (có/không khởi sầu bi). `29.4` ← `28.1` (0,81), `29.10` ← `27.6` (0,99).

  **C (1 khoá).** `46.27` kết bài “The discourse at Devadaha is finished, the first.”.

  **Số liệu A/B/C/D theo máy:** A 18 · B 48 · C 1 · D 5 (trên 72 khoá).

  **Cố ý lệch tầng đã ghim.** (1) D: lấy lõi chung, bỏ “…” (xem nhóm 2). (2) `3.5` Pāli kết `…bhavissatī’ti?` có dấu hỏi — câu hỏi đã được tầng ghim đóng ở `3.2`, nên dịch như `2.7` (khẳng định + `’`). (3) `22.x`/`46.x` viết lại thành câu điều kiện đầy đủ thay vì “or …” mảnh của tầng ghim.

  **Ngoặc kép.** 72/72 khoá khớp Pāli từng khoá (đã tự đo).

  **Ngoài lát.** 5 khoá đã ghim (gồm `13.4`, `15.4`) có “…” ở nơi Pāli của chính khoá viết đủ; lớp lấp không sao chép. 1 khoá đã ghim có chữ nhưng dưới 20% độ dài Pāli.

  **Ngoặc kép / nháy — bảng đo tự động trên 72 khoá.** 72/72 khoá khớp Pāli từng khoá (đếm “ ” ‘ ’ đóng/mở; `’` có chữ thường đứng ngay sau tính là dấu nhạt lược). Không khoá nào lệch.

  **Dấu lược.** 0 khoá lấp có `…pe…` trong Pāli; tổng số `…` trong English của 72 khoá lấp = 0; khớp quy tắc `…pe…` = đúng một `…` (không khoá nào có `…` mà Pāli viết đủ).

  Không còn khoá rỗng nào: 72/72 khoá `fillableSegments` đã được viết (3 khoá dưới 40 ký tự vẫn viết).

  **Coverage (đo thật).** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 301. Trước: 232/301 = 0,7708. Sau khi `published`: 301/301 = 1,0000 (lớp lấp phủ 69 khoá có nội dung; 3 khoá dưới ngưỡng không tính). Độ nhạy: ngưỡng 0,8 cần ≥ 241 khoá có lời; sau lấp còn dư 60 khoá trước khi rớt ngưỡng; trước lấp thiếu 9 khoá. Bài đã dưới ngưỡng trước khi lấp.

  **Hệ quả với `content/meta/reference-gaps.yaml`.** `mn/mn101` **có** record trong file đó; sau khi lớp lấp `published`, coverage = 1,0000 nên record thành thừa (test `a fill never leaves a gap record it has cured` sẽ đỏ nếu để lại). Không chạm file ấy trong lát này; để người điều phối sinh lại bằng `npm run reference:gaps`.

  **Triangulation 8,0 — không được tuyên bố là đối chiếu English độc lập.** Scorecard của bản Việt `content/meta/sutta/mn/mn101.yaml` do cùng họ công cụ với lớp lấp này chấm/dịch (xem `source/tooling.yaml`; `assessed_by` của lớp lấp trùng họ), nên bản lấp **không** phải một cách đọc English độc lập với bản Việt. Đối chiếu có: Pāli root + Sujato đã ghim (362 khoá) + bản Việt canonical (362 khoá, dùng để đối chiếu nghĩa, không dịch vòng, không chép). Bản Việt có khối `summary:` ở MN/DN nên **không chạm vào**; không sửa metadata Việt.

  **technical_integrity 9,6.** Không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, giao cho người điều phối. Không đặt blocker.
