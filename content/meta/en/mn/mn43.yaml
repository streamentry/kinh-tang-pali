notes: |-
  Sáu khoá, và **bốn trong sáu là bản sao nguyên văn** của Pāli đã có bản dịch trong chính bài
  này (đối chiếu bằng script, khớp từng chữ sau khi cắt khoảng trắng cuối):

  - `21.4` lặp `21.1` nguyên văn → lấy y nguyên văn đã ghim, kể cả dấu `“` mở đầu.
  - `21.5`, `22.2`, `22.5` đều lặp `21.2` nguyên văn → cùng một câu.
  - `22.4` lặp `22.1` nguyên văn → cùng một câu.

  Sāriputta ở `21.4–21.5` **dẫn lại nguyên văn** câu hỏi của Mahākoṭṭhita ở `21.1–21.2` rồi mới
  trả lời ở `21.6` ("have recourse to the mind"). Mahākoṭṭhita ở `22.1–22.2` hỏi lại, Sāriputta đáp
  ở `22.3`, rồi Mahākoṭṭhita hỏi lần nữa ở `22.4–22.5`. Nếu dịch lại từng câu, bài sẽ tự mâu thuẫn.

  **Chỗ phải tự quyết: `seyyathidaṁ` ở `22.1` và `22.4`.** Ở `21.1` bản ghim viết "That is," vì đó là
  câu mới sau dấu chấm. Ở `22.1`/`22.4` Pāli là một mệnh đề (`Pañcimāni, āvuso, indriyāni,
  seyyathidaṁ—`) nên tôi viết "that is," (thường). Tiền lệ trong chính tầng lấp: `an4.35:4.5` và
  `an4.35:5.4` — hai khoá duy nhất trong 681 tệp `content/meta/en/` có "that is," — đều thường vì
  đứng giữa câu. Bản Việt `content/translation/vi/project/sutta/mn/mn43.yaml` cũng không có dấu
  phẩy: `“Này hiền giả, năm căn này là:`.

  Dấu cách ở cuối bản ghim (`21.1` có `"That is, "`) không mang theo: **0 trên 2.475 giá trị** trong
  689 tệp `content/translation/en/project/sutta/*/` kết thúc bằng khoảng trắng, kể cả hai tệp lấp
  dùng đúng công thức lặp này (`sn22.51:1.8`, `sn24.36:3.4`).

  Lớp lấp: 6 khoá, tất cả nằm ở chỗ bản Anh đã ghim để trống (đã kiểm: không khoá nào che một
  khoá đã ghim có chữ). **Không khoá nào là blockquote tham chiếu và không khoá nào có Pāli rỗng**,
  nên không có khoá nào bị bỏ.

  Bài này còn 3 khoá bản Anh đã ghim để trống mà lát này KHÔNG lấp, vì Pāli của chúng **dưới 40
  ký tự** nên nằm ngoài ngưỡng đo coverage: `6.3` (33 ký tự, `“Yā cāvuso, paññā yañca viññāṇaṁ—`),
  `6.5` (26, `Idaṁ nesaṁ nānākaraṇan”ti.`), `37.8` (36, dòng colophon
  `Mahāvedallasuttaṁ niṭṭhitaṁ tatiyaṁ.`). Người đọc bốn cột VẪN thấy các ô này trống, và đó là
  đúng: một ô tham chiếu trống là lỗ hổng của bản dịch đó, khác với bản vắng mặt cả bài.

  **Coverage và `content/meta/reference-gaps.yaml`.** Trước lát này coverage English của `mn43` là
  132/138 = 0,9565, **đã trên** ngưỡng 0,8, nên bài không có record trong
  `content/meta/reference-gaps.yaml` và lát này **không** làm thay đổi file đó. Sau lát này là
  138/138 = 100%. `validate` sẽ không có cảnh báo "same author" cho bài này: scorecard Việt của
  `content/meta/sutta/mn/mn43.yaml` ghi `translators: ["Kinh Tạng Pāli Project"]` và
  `assessed_by: ["GPT-5.6 Sol"]`, không trùng tên người viết lớp lấp.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm, nên đây KHÔNG phải một
  lớp đọc Anh độc lập. Bốn khoá chép y từ chính bản Anh đã ghim — cùng một tầng, không phải
  nguồn thứ hai. Tầng đối chiếu là Pāli đã ghim + bản Việt dự án (`mn43` đã `published`,
  `assessed_by: GPT-5.6 Sol`) chỉ để so nghĩa.