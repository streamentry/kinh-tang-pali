notes: |-
  9.5 mở lại đúng cụm Sujato đã ghim ở 9.3 — "This is the ultimate splendor, this is the
  ultimate splendor." — rồi mới hỏi `katamo so paramo vaṇṇo`. Tra đếm trong tầng: "ultimate
  splendor" 22 lần, "splendor" 66 lần; cụm `ayaṁ paramo vaṇṇo, ayaṁ paramo vaṇṇo` đã ghim ở
  9.3 và 19.5 đều ra "This is the ultimate splendor, this is the ultimate splendor.", nên lấy
  y hệt. Câu hỏi `katamo so paramo vaṇṇo` dịch "what is that ultimate splendor" theo 9.4/9.7.

  19.3 và 23.3 trùng nhau và trùng 19.1/23.1; Pāli 19.1 kết `”ti.` (dấu chấm), 19.3 kết
  `’”ti?` nên chốt đòi thêm một ngoặc đóng `’` và dấu hỏi — vế trong nháy lấy y hệt lời ở
  19.1/23.1 ("The Blessed One has cut short the discussion! The Holy One has cut short the
  discussion!", tra đếm "cut short the discussion" 4 lần trong tầng).

  Bất định đã ghi nhận, và đây là lý do hạ `semantic_fidelity`/`ambiguity_integrity`:
  9.5 dùng cụm "This is the ultimate splendor, this is the ultimate splendor" ở đầu câu rồi
  lặp lại "ultimate splendor" ở vế hỏi — nghe lặp. Nhưng Pāli `‘ayaṁ paramo vaṇṇo, ayaṁ
  paramo vaṇṇo’ti, katamo so paramo vaṇṇo”ti?` đúng là lặp ba lần `paramo vaṇṇo`, và Sujato
  đã chọn lặp ở chính bài này (9.3). Giữ lặp là giữ nghĩa; làm "smooth" hơn là bịa. Đã giữ
  nguyên và ghi lại để người biên tập đọc thấy đây là cố ý, không là lỗi.
