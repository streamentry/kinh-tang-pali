notes: |-
  **Phân loại 21 khoá (đo bằng máy trên Pāli đã ghim và tầng Anh đã ghim của chính bài này, ngưỡng gần-trùng 0,75 trên Pāli đã bỏ dấu câu): A = 14 · B = 0 · C = 7 · D = 0.**
  Định nghĩa để tái lập: A khi Pāli chuẩn hoá trùng nguyên văn với khoá đã có lời và các khoá ấy chỉ có một dạng lời; D khi Pāli trùng nhưng các lời đã ghim
  khác nhau; B khi không trùng nhưng gần trùng (≥ 0,75); C là phần còn lại. Tổng 14 + 0 + 7 + 0 = 21, đúng bằng số khoá đã ghi (21/21
  khoá của `fillableSegments`). Cách xử lý thực tế: trong nhóm A, 14 khoá lấy lại **nguyên văn từng chữ** và 0 khoá có điều chỉnh (nêu bên dưới);
  7 khoá viết tay (gồm B, C, D và các A có điều chỉnh).

  **Nhóm 1 — tám khoá vòng tranh luận thứ hai và thứ ba (`2.4`, `2.5`, `2.9`, `2.10`, `3.4`, `3.5`, `3.9`, `3.10`) = A.**
  Udāyī và Pañcakaṅga nói lại đúng từng chữ điều đã nói ở vòng đầu (`1.6`, `1.7`, `1.11`, `1.12`); Pāli
  chuẩn hoá trùng 8/8 và lời đã ghim của bốn khoá nguồn là **một** dạng duy nhất, nên cả tám khoá lấy lại
  nguyên văn từng chữ: “pleasant, painful, and neutral.” · “The Buddha has spoken of these three feelings.” ·
  “pleasant and painful.” · “The Buddha said that neutral feeling is included as a peaceful and subtle kind of
  pleasure.” Tầng đã ghim chỉ dịch vòng một nên người đọc đang thấy một cuộc tranh luận “ba lần” mà chỉ có
  một lần có lời.

  **Nhóm 2 — sáu khoá điệp khúc “Idaṁ kho, ānanda, etamhā sukhā aññaṁ sukhaṁ …” (`8.6`, `9.5`, `10.5`, `11.5`,
  `12.5`, `13.5`) = A.** Cả sáu có Pāli trùng với `7.6`, `14.5`, `15.6`; ba khoá nguồn cùng một lời “This is a
  pleasure that is finer than that.”, lấy nguyên văn. Đây là câu kết của từng bậc thiền và vô sắc ngay
  trước đó, nên nếu thiếu thì sáu bậc ở giữa không có câu chốt.

  **Nhóm 3 — sáu khoá mở đầu bằng dấu lược (`9.1`, `10.1`, `11.1`, `12.1`, `13.1`, `14.1`) = C.** Pāli là
  `Yo kho, ānanda, evaṁ vadeyya …` (đúng **một** dấu lược mỗi khoá). Lớp lấp dịch “There are those who would
  say …”, lấy đúng phần mở đầu của `8.1`/`15.1` (“There are those who would say that this is the highest
  pleasure and happiness that sentient beings experience…”) và cắt ở chỗ Pāli cắt. Lưu ý một dịch chuyển
  của tầng đã ghim: lời “There is another pleasure that is finer than that.” nằm ở khoá `9.2`, `10.2`, … mà
  Pāli của các khoá ấy chỉ là dấu hiệu rút gọn `pe….`; tức tầng đã ghim đã dời nội dung sang khoá liền kề và
  bỏ trống khoá `X.1`. Lớp lấp **không chạm** các khoá `X.2` đó.

  **Khoá 16.9** là câu kết (`Bahuvedanīyasuttaṁ niṭṭhitaṁ navamaṁ.`): “The Many Kinds of Feeling is
  finished—the ninth.”, lấy tên bài của tầng đã ghim ở `0.2`. Khoá này chỉ 37 ký tự nên **không** vào
  coverage; vẫn lấp để người đọc không thấy một khoá bỏ trống ở cuối bài.

  **Nháy kép “ ” và đơn ‘ ’ (không tính dấu nhạt lượu `’s`, `’t`…).** Đo từng khoá so với Pāli: 21/21 khoá khớp, không có ngoại lệ.

  **Dấu lược.** Pāli của 21 khoá có 6 dấu lược (`…pe…` đếm là **một**); lớp lấp ghi 6. Pāli viết đủ thì lớp lấp không thêm “…”.

  **Khoá trống còn lại.** Không còn: cả 21 khoá thuộc `fillableSegments` đã được lấp, kể cả các khoá dưới ngưỡng 40 ký tự (câu kết, nhãn thứ tự, dấu lược) vì chúng có thật trong Pāli; những khoá ấy không vào coverage nhưng bỏ trống sẽ để lại chỗ hổng giữa bài.

  **Coverage (đo thật, mẫu số khác 0).** Mẫu số: 76 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Trước lớp lấp: 64/76 = 0,8421. Sau khi lớp lấp `published`: 76/76 = 1,0000. Độ nhạy: ngưỡng 0,8 cho phép tối đa 15 khoá thiếu English; lớp lấp đưa số khoá thiếu từ 12 về 0 nên bài còn đệm 15 khoá. Bài này **không** có record trong `content/meta/reference-gaps.yaml`, nên không có record nào thành thừa vì lát này.

  **Khoá có chữ nhưng ngắn hơn hẳn Pāli (dấu hiệu cắt cụt/gộp của tầng đã ghim).** Đo: 0 khoá mà lời Anh đã ghim < 30% độ dài Pāli (Pāli ≥ 60 ký tự). Đây là chỗ `ratio` có thể lạc quan; lớp lấp không sửa được các khoá đã ghim. Đã dò Pāli trùng nguyên văn trên cả bài: 15 nhóm (mỗi nhóm từ hai khoá trở lên).

  **Triangulation 8.0 (trần của bài).** Scorecard Việt của `mn59` (`content/meta/sutta/mn/mn59.yaml`) do cùng họ công cụ với lớp lấp chấm (alias khai ở `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập của bản Việt và **không** được tuyên bố là đã đối chiếu English. Đối chiếu thực có: Pāli root + bản Anh đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Tệp Việt và metadata Việt không bị chạm.

  **technical_integrity 9.6.** Không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh ấy còn lại cho người điều phối, và chưa chạy cổng không phải blocker. Đã tự kiểm bằng phép đo riêng: JSON parse, NFC, mọi khoá thuộc `fillableSegments`, không khoá nào che bản đã ghim, dấu lược khớp Pāli, nháy (kể các ngoại lệ đã nêu), Pāli trùng ⇒ lời trùng, và `final_score` bằng trung bình số học thô.
