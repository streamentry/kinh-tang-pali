notes: |-
  **Phân loại 31 khoá (đo bằng script trên Pāli đã ghim, khớp ≥ 0,80 sau chuẩn hoá là B): A = 6 · B = 14 · C = 9
  · D = 2.** 8/31 khoá lớp lấp trùng nguyên văn một lời đã ghim của cùng bài.

  **Bối cảnh.** Tầng đã ghim tóm tắt các lời nhắn chuyển qua người đưa tin (`2.7` “He did as the king asked.”,
  `4.4` “So Pasenadi explained the circumstances of the message.”) và bỏ cả phần cuối phẩm (`18.2`–`19.6`). Lớp
  lấp dịch theo Pāli, nên sau `4.4` đã ghim người đọc gặp lại chính lời giải thích ấy (`4.5`–`4.8`).

  **Nhóm A (6 khoá).** `2.10` = `2.6`; `10.3` = `9.1`; `10.5` = `9.3`; `17.7`/`17.9`/`17.11` = `17.5`.

  **Nhóm D (2 khoá) — báo, không tự hòa.** `9.5` và `10.4` Pāli `khattiyā, brāhmaṇā, vessā, suddā.` trùng `9.2`,
  `10.16`, `11.2`, `12.3`; tầng đã ghim dịch ba khoá là “… peasants, and menials.” nhưng `12.3` là “… peasants,
  and workers.”. Lớp lấp chọn “menials” (đa số, và là cách dịch của `9.2` ngay trong cùng lượt hỏi–đáp). Không
  sửa `12.3` đã ghim.

  **Nhóm B (14 khoá, khớp 0,84–1,00).** `2.4`/`2.8` (0,86/0,84 với `4.2`, đổi chủ ngữ sang vua Pasenadi, theo
  khuôn câu chào của `4.2`); `2.9` (0,92 với `2.5`); `3.2`/`4.5` (0,97 với `2.6`, thêm `kira` → “It seems”, ngôi
  thứ ba); `3.5` (1,00 với `4.2`, ngoặc `‘…’”` theo Pāli); `4.6`, `4.7` (0,84/1,00 với `3.3`/`3.4`); `4.8` (0,97
  với `4.2`); `7.5` (1,00 với `7.3`; dịch `taṁ` là “you”); `8.7` (1,00 với `8.5`); `9.4` (1,00 với `10.15`, thêm
  “Great king”); `13.4`/`15.8` (1,00 với `13.2`/`15.6`).

  **Nhóm C (9 khoá).** Colophon `18.2`, cuối phẩm `18.3` (“The Chapter on Kings is finished—the fourth.”),
  `19.0` (“Its summary verse:” theo khuôn lớp lấp đã có), và kệ tóm tắt `19.1`–`19.6`: tên bài lấy từ tiêu đề
  tầng đã ghim của `mn81`–`mn90` (“Born From the Beloved”, “The Foreign Cloth”, “the Shrines to the Teaching”;
  viết `Ghaṭīkāra` như tầng đã ghim).

  **Ngoặc.** `3.5`, `13.4`, `15.8`: Pāli đóng `’”`, nhưng khoá liền trước đã ghim (`3.4`, `13.3`, `15.7`) đã tự
  đóng `”`; lớp lấp theo Pāli từng khoá, không sửa khoá đã ghim.

  **Dấu và ngoặc (kiểm bằng script, từng khoá).** `…pe…` = đúng một `…`; số `“ ” ‘` và `’` đóng (không kể `’` +
  chữ thường) của lớp lấp khớp Pāli ở 31/31 khoá. NFC, không khoá rỗng, mọi khoá ⊆ `fillableSegments`, không
  khoá nào trùng khoá đã ghim có chữ. Pāli trùng nguyên văn trong bài ⇒ English trùng: đạt, trừ nhóm D đã báo.

  **Đo nguyên nhân khoá trống.** Tầng đã ghim để trống 31 khoá (không tính `:0`) — đúng bằng số khoá của lát,
  nên sau lát này bài **không còn khoá trống nào** ngoài khối `:0`. Cắt cụt dãy (≥ 4 khoá trống liền nhau): 2
  dãy / 13 khoá / 661 ký tự Pāli. Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 14 khoá (≤ 31).
  Ngoài hai phép trên, cơ chế thấy rõ khi đọc là **tóm tắt nội dung** vào một khoá đã ghim (nêu ở trên) — phép
  đo thân từ không bắt được nó.

  Triangulation 8.0: scorecard Việt của `mn90` (`content/meta/sutta/mn/mn90.yaml`) có `quality.assessed_by`
  **trùng** alias của lớp lấp (`source/tooling.yaml`) — tức bản Việt canonical và bản lấp do cùng một công cụ
  làm/chấm. Vì vậy bản lấp **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài này
  **không** được tuyên bố là đã đối chiếu English ở 31 khoá này. Đối chiếu có: Pāli root đã ghim (authority),
  lời Sujato đã ghim của chính bài (dùng làm khuôn chữ cho nhóm A/B) và bản Việt canonical (chỉ đối chiếu nghĩa,
  không dịch vòng). Không chạm tầng Việt hay metadata Việt.

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run
  build` (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều
  phối. Không đặt blocker vì cổng chưa chạy không phải lỗi kiểm định.

  Hệ quả với `content/meta/reference-gaps.yaml`: `mn/mn90` **không** có record trong tệp đó, nên không có record
  nào thành thừa vì lát này. Coverage trên Pāli có nội dung (≥ 40 ký tự, bỏ `:0`): trước 100/115 = 0,8696; sau
  khi `published` 115/115 = 1,0000. Lát ghi 31 khoá, trong đó 15 khoá có nội dung và 16 khoá dưới 40 ký tự
  (không vào coverage nhưng vẫn là khoá trống thật, nên vẫn lấp). Độ nhạy: phải mất 24 khoá có English nữa thì
  mới rớt dưới 0,8.
