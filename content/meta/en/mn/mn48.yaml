notes: |-
  Lớp lấp: 5 khoá (`3.2`, `6.7`, `6.9`, `6.11`, `6.13`) nằm ở phần bản Anh đã ghim đã lược.

  **Bốn khoá là PÁI trùng nguyên văn — lấy y nguyên văn đã ghim, không dịch lại.**
  `6.7`, `6.9`, `6.11`, `6.13` đều bằng nguyên văn `6.5` **và** `6.15`, hai khoá đã ghim
  ("This warm-hearted quality makes for fondness and respect, conducing to inclusion, harmony,
  and unity, without quarreling."). Đây là công thức lặp lại sau mỗi phẩm chất trong sáu phẩm
  chất, nên bất kỳ cách dịch nào khác ở bốn khoá này sẽ làm bài tự mâu thuẫn với chính hai khoá
  đã ghim. `6.2` và `6.16` là hai khoá **cùng ý** nhưng không nguyên văn bằng (số nhiều "these
  six" và `Ime kho …`), nên không lấy làm mẫu.

  **`3.2` dịch mới nhưng mượn lời đã ghim.** Đây là lời vị tỳ-kheo báo lại cho Đức Thế Tôn
  (`idha, bhante, kosambiyaṁ bhikkhū …`), và nội dung y hệt `2.1`–`2.2` (người kể) và
  `4.7`–`4.8` (chính Đức Thế Tôn hỏi lại). Bản đã ghim đã có sẵn đúng câu ở cả hai nơi:

  - "fighting, quarreling, and disputing, continually wounding each other with barbed words"
    (`2.1`, `4.7`) — lấy y.
  - "can’t persuade each other or be persuaded, nor can they convince each other or be
    convinced" (`4.8`) — lấy y; bản đã ghim ở `2.2` dùng thì quá khứ ("couldn’t") vì đó là
    người kể, còn ở đây là lời tỳ-kheo đang nói nên dùng thì hiện tại, khớp `viharanti`.
  - `mukhasattīhi` giữ "barbed words", không dịch "lời sắc"; `Kosambī` giữ dấu `ī` vì tầng `mn`
    dùng dạng có dấu cho tên riêng này.

  **Số ngoặc khớp Pāli từng khoá:** `3.2` đúng 1 ngoặc mở `“` và 1 ngoặc đóng `”`; bốn khoá
  `6.x` không có ngoặc nào, cũng như Pāli.

  `triangulation` hạ vì không có bản Anh độc lập: bốn khoá là bản sao của bản đã ghim, và `3.2`
  thì chỉ ghép lại hai câu đã ghim ở `2.1`–`2.2` và `4.7`–`4.8` — cùng một tầng, không phải đọc
  lại độc lập. Bản Việt chỉ để đối chiếu nghĩa; người viết bản Việt của bài này (`GPT-5.6 Sol`)
  không phải người viết lớp lấp này.