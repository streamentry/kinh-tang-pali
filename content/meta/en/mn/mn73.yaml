notes: |-
  **Bốn nhóm khoá (đo bằng script trên 27 khoá lấp): A = 8 · B = 4 · C = 15 · D = 0.**

  **A nguyên văn (8):** bốn khoá `evamidaṁ brahmacariyaṁ aparipūraṁ abhavissa tenaṅgena.` (`13.6`, `13.10`, `13.14`,
  `13.18`) = `13.22` “then this spiritual path would be incomplete in that respect.”; bốn khoá `… paripūraṁ tenaṅgena.`
  (`13.8`, `13.12`, `13.16`, `13.20`) = `13.4` “this spiritual path is complete in that respect.”

  **B (4), nguồn · tỉ lệ:** `13.7` ← `13.3` 0,90 · `13.15` ← `13.23` 0,82 · `13.19` ← `13.23` 0,92 · `28.8` ← `28.6` 0,91.
  Chuỗi `13.7`/`13.11`/`13.15`/`13.19` (`13.11` phép thô gọi C) theo khuôn của `13.23` “But because … have all
  succeeded in this teaching,”, chỉ liệt kê đúng các nhóm có trong Pāli của từng khoá. `28.8` = lời chư thiên
  “‘Sir, the mendicant Vacchagotta has the three knowledges, and is very mighty and powerful.’”” (từ `28.6`).

  **C (15).**
  - `5.3`–`5.10` (8 khoá): Pāli là từng cặp “X là bất thiện, tránh X là thiện”. **Tầng ghim đã gộp cả mười cặp vào `5.1`
    (danh sách bất thiện) và `5.2` (danh sách thiện)** — đọc thẳng: `5.1` Pāli chỉ nói sát sinh nhưng lời ghim liệt kê đủ
    mười. Lấp theo Pāli nghĩa là cột English sẽ lặp nội dung đã có ở `5.1`/`5.2`; lớp lấp chấp nhận lặp vì khoá Pāli có
    thật, và dùng đúng từ của `5.1`/`5.2` (“sexual misconduct”, “backbiting”, “nonsensical/talking nonsense”,
    “covetousness” ↔ “contentment”, “ill will” ↔ “good will”).
  - `19.3`, `21.19`, `22.3`, `23.3`, `24.3` `tatra tatreva sakkhibhabbataṁ pāpuṇissasi, sati satiāyatane.` → “In each and
    every case you will be capable of realizing it, since it is within range.” Tầng ghim đã **kéo** mệnh đề này lên
    khoá `…1` (“you will be capable of realizing these things, since each and every one is within range:”) và bỏ trống
    khoá `…3`; ở `20.2` Pāli chứa cả mệnh đề này mà lời ghim cũng bỏ. Lớp lấp dùng lại từ “capable of realizing”,
    “within range” để không thành cách đọc khác. Hệ quả: ý lặp với khoá `…1` đã ghim.
  - `13.11` (chuỗi “But because …”, xem trên; tỉ lệ khớp < 0,8).
  - `28.11` colophon → “The Longer Discourse With Vacchagotta is finished—the third.” (tên từ `:0.2` đã ghim).

  **Nháy:** `24.3` Pāli kết `”ti` ⇒ lớp lấp kết `”`, dù `24.2` đã ghim đã đóng `’”` sớm; cột English sẽ có hai `”` —
  khớp Pāli từng khoá, đo 0 lệch. `28.8` `‘…’”` khớp Pāli. **Dấu lược:** Pāli 27 khoá 0 dấu lược, lớp lấp 0.
  Tầng ghim có 4 khoá mang `…` mà Pāli không có (`13.5`, `13.9`, `13.13`, `13.17`) và 4 khoá có chữ < 30% Pāli
  (`13.9` 15/214, `13.13`, `13.17`, `13.21`) — cắt cụt, báo không sửa.

