notes: |-
  Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.

  **Bốn khoá dùng lại nguyên văn lời đã ghim, mỗi khoá kiểm bằng so khớp chứ không bằng mắt.**

  1. `3.6` và `3.9` — Pāli **nguyên văn bằng nhau và bằng `3.3`**. Lấy nguyên văn `3.3`:
     "“Mendicants, those gentlemen who have gone forth out of faith from the lay life to
     homelessness in my name—I trust they’re satisfied with the spiritual life?”" Đây đúng là
     bẫn `sn11.24`: đọc riêng `3.6`/`3.9` rất dễ thành *"các tỳ-kheo ấy có hoan hỷ với đời phạm
     hạnh không?"* ở nghĩa là một câu hỏi mới, trong khi nó là **câu hỏi thứ hai và thứ ba y hệt
     câu thứ nhất**, và cả ba đều im lặng. Giữ nguyên văn bản đã ghim là cách nói đúng việc đó.
  2. `7.5` — Pāli **nguyên văn bằng `7.2`** (`appahīnā`). Lấy nguyên văn: "‘The Realized One has
     not given up the defilements that are corrupting, leading to future lives, hurtful, resulting
     in suffering and future rebirth, old age, and death." Chỉ một dấu phẩy khác `7.8` (`pahīnā` →
     "has given up"), nên **không** được dùng lời `7.8` cho `7.5` — đó là lỗi đảo nghĩa đã biết.
     `saṅkilesikā` → "corrupting", `ponobbhavikā` → "leading to future lives", `dukkhavipākā` →
     "hurtful", `āyatiṁ jātijarāmaraṇiyā` → "future rebirth, old age, and death", `tathāgatassa` →
     "the Realized One": tất cả lấy từ lời đã ghim của `7.2`/`7.8`, không tự đặt.
  3. `7.6` — lõi Pāli giống hệt `7.3` (`tasmā tathāgato … saṅkhāyekaṁ vinodetī`), khác ở chỗ
     `7.3` đóng **hai** ngoặc (`’”ti?`) còn `7.6` đóng **một** (`’ti.`). Lấy lời `7.3` rồi bỏ đúng
     một ngoặc: "That’s why, after appraisal, he uses some things, endures some things, avoids some
     things, and dispels some things.’" `saṅkhāya` → "after appraisal" theo `7.3` đã ghim.
  4. `9.2` — Pāli **nguyên văn bằng `24.2`** (`asu amutra upapanno, asu amutra upapanno’ti.`).
     Lấy nguyên văn `24.2`: "‘This one is reborn here, while that one is reborn there.’" `8.3` là
     câu hỏi nên không dùng lại được (thêm dấu `?` và `”`).

  **`3.8`** dựng từ hai nơi đã ghim, và vì sao không dùng lời `3.5`: Pāli `3.5` và `3.8` chỉ khác
  `Dutiyampi kho` / `Tatiyampi kho`, nhưng bản Anh đã ghim ở `3.5` lại **gộp cả hai lần hỏi** thành
  một câu ("For a second and a third time the Buddha asked the same question.") — lấy nguyên văn
  câu đó cho `3.8` sẽ sinh ra một câu không có trong Pāli. Nên lớp lấp dùng vế `bhagavā te kulaputte
  ārabbha bhikkhū āmantesi:` đúng như tầng đã ghim dịch ở `3.2` ("the Buddha spoke to the mendicants
  about those gentlemen:"), dịch `Tatiyampi kho` thành "For a third time,".

  **Hệ quả người đọc sẽ thấy, nói thẳng:** cột Anh của `3.5`–`3.10` sẽ lặp. `3.5` (đã ghim) đã
  nói "For a second and a third time…", `3.8` của lớp lấp lại nói "For a third time…", và `3.9`
  lặp lại câu hỏi. Nguyên nhân là tầng đã ghim nén ba đoạn Pāli vào một, còn Pāli gốc vốn lặp
  đúng ba lần. Giữ lặp là giữ đúng Pāli; bỏ thì mất `Tatiyampi kho`.

  **`5.7` — `nanu` dịch theo đúng khuôn của tầng đã ghim.** Bài song song `mn21:5.7` có đúng
  công thức `nanu … saddhā agārasmā anagāriyaṁ pabbaji…` và đã ghim thành "Phagguna, are you not
  a gentleman who has gone forth out of faith from the lay life to homelessness?" — tức `nanu` là
  "are you not" và danh xưng được đưa lên đầu câu. Lớp lấp theo y vậy: "Anuruddha, are you not
  ones who have gone forth out of faith from the lay life to homelessness just like that?”
  `evaṁ saddhā … pabbajitā` lấy nguyên văn cụm "out of faith from the lay life to homelessness"
  đã dùng ở `2.1` và `3.3`.

  **Một ngoặc đóng "mồ côi" ở `5.7`, giữ theo tiền lệ có sẵn.** Pāli `5.1` mở `"` và `5.7` đóng
  `”ti?`, nên Pāli `5.1`–`5.7` cân (một `"`, một `”`). Nhưng bản Anh đã ghim đã đóng **cả hai**
  ngoặc sớm ở `5.6` ("…this entire mass of suffering’?”"). Bỏ dấu `”` ở `5.7` thì lệch số ngoặc
  với Pāli, nên giữ — đúng như `ud2.2` đã phán cho trường hợp cùng loại (bản đã ghim đóng sớm ở
  `3.1`, bản lấp giữ ngoặc đóng ở `3.3`). Hệ quả: người đọc thấy `”` ở `5.7` không có ngoặc mở
  tương ứng trong cột Anh. Đây là hệ quả đã biết và được ghi, không phải lỗi sót.

  **Ngoặc kép — bảng cân đọc tay, in ra trong script ghi file**: `3.6` 1/1 · `3.8` 0/0 · `3.9` 1/1 ·
  `5.7` 0/1 · `7.5` 1/0 · `7.6` 0/1 · `9.2` 1/1. Khớp Pāli từng khoá.

  **Không khoá nào trong bảy khoá này mang `…pe…`**, nên tổng số dấu lược của lớp lấp bài này bằng 0.

  **Hai khoá còn trống ngoài lát này, và phân biệt đúng hai loại.** Bản Anh đã ghim để trống 9 khoá
  có nội dung ở `mn68`; lát này nhận 7. Còn lại `3.7` (`Dutiyampi kho te bhikkhū tuṇhī ahesuṁ.`,
  39 ký tự) và `24.8` (dòng colophon `Naḷakapānasuttaṁ niṭṭhitaṁ aṭṭhamaṁ.`, 37 ký tự).

  1. Chúng **lấp được** — `fillableSegments` chỉ so với prose của các tầng đã ghim, không áp ngưỡng
     40 ký tự. Chúng không thuộc lát này, nên lớp lấp không đụng tới.
  2. Chúng **không được `coverage` đo** — `substantivePaliMinChars` = 40 loại cả hai. Điều đó có
     nghĩa là coverage không dịch chuyển vì chúng, **không** phải vì chúng không quan trọng.

  Tổng số khoá có nội dung của `mn68` là 118, nên sau khi lớp lấp `published` tỉ lệ Anh của bài này
  Tỉ lệ Anh **trước** lớp lấp là (118 − 7) / 118 = **0,9407**, **sau** lớp lấp `published` là
  **1,0000**.

  Không có bất định thuật ngữ nào đáng kể. Không blocker.

  `triangulation` hạ vì không có bản Anh độc lập: bản Anh đã ghim để trống bảy khoá này, và lớp lấp
  chỉ mượn lời đã ghim của cùng bài và của `mn21` cho một công thức. Bản Việt chỉ dùng để đối chiếu
  nghĩa; người viết bản Việt của bài này (`GLM-5.3 Flash (ZCode)`) không phải người viết lớp lấp
  này. Bốn lệnh cổng còn lại **chưa** chạy vì lát này bị cấm: `npm run validate`, `npm test`,
