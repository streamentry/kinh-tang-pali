notes: |-
  **Phân loại 11 khoá (đo bằng `eng/_e15_class.py`): A y nguyên từng chữ = 11 · B dựng lại = 0 ·
  C tự dịch = 0.** Đây là bài thuần vế lặp: mười một khoá lấp ở đây **không dịch thêm một câu nào**,
  chỉ đặt lại lời đã ghim ở đúng chỗ Pāli lặp lại. Đo so khớp chuỗi sau khi bỏ khoảng trắng thừa:

  · `3.3` và `3.14` (Pāli **giống nhau từng chữ**) = `3.7`
  · `5.9`, `5.12`, `5.15`, `5.18`, `5.21`, `5.24` (sáu khoá Pāli **giống nhau từng chữ**) = `5.3`
    (là `5.6` và `5.27` nữa — tức là tầng đã ghim đã dịch cùng một câu ấy ba lần, chỉ để trống sáu lần)
  · `10.8` = `10.3` · `11.8` = `11.3` · `12.8` = `12.3`

  **Vì sao phải lặp y hệt chứ không diễn giải lại:** `3.3`/`3.14` nằm trong hai lần trả lời du sĩ
  thuộc đạo khác, và `5.9`…`5.24` là sáu vế dẫn của sáu câu hỏi luân phiên về tham–sân–si–ái–chấp
  thủ–vô minh. Nếu mỗi vế một cách, bài sẽ tự mâu thuẫn ở chính chỗ nó cố ý lặp.

  **Ba khoá trống còn lại — và một cái số cần báo, đo bằng script:** `3.4` **38** ký tự,
  `3.15` **38**, `17.6` **38**. Cả ba đều **thiếu 2 ký tự** so với ngưỡng 40 mà `coverage` đo. Hai khoá
  `3.4`/`3.15` là **vế sau** của câu `3.3`/`3.14` vừa lấp (`suññā parappavādā samaṇebhi aññehī’ti?` /
  `…aññehī’ti.` ⇒ “Other sects are empty of ascetics”), tức là nửa đóng của tiếng sư tử hống. Vì
  chúng dưới ngưỡng nên trống ở **cả** tầng đã ghim lẫn lớp lấp, và người đọc sẽ thấy câu `3.3` mở
  `“` rồi không có gì đóng. Lớp lấp **không** tự ý lấp hai khoá này vì lát được giao đúng 11 khoá;
  nhưng về mặt kỹ thuật chúng **lấp được** (`fillableSegments` chỉ so với prose của tầng đã ghim) —
  người điều phốn nên biết đây là 38 ký tự, không phải 41 như `sn35.52:2.7` và `sn45.114:1.8` trong
  `BRIEF_VI4.md` §4 (hai khoá kia lọt vào tập lấp vì dài hơn ngưỡng). Ở đây hướng ngược: chúng **rơi
  ra** vì ngắn hơn.

  **Ngoặc kép — hai hệ quả, cả hai đều do ba khoá 38 ký tự kia trống, in ra để kiểm.**
  · `3.3` Pāli không có dấu nào, lớp lấp mở `“` — vì **nguyên văn** của `3.7` đã ghim mở `“`. Dấu `“`
    ấy được `3.8` đã ghim đóng (`Other sects are empty of ascetics.”`), nên cân trong khối 3.6–3.8.
  · `3.14` cũng mở `“` (Pāli `3.3`/`3.14` giống nhau từng chữ nên phải dịch giống nhau từng chữ), nhưng
    khoá đóng `“` ứng với nó là `3.15` — trống. Vậy `3.14` để lại một `“` mở. Cùng kiểu, **tầng đã ghim
    đã** để lại một `‘` mở không đóng ở `3.6` vì `3.4` trống (`3.6` mở `‘`, `3.7` mở `“`, `3.8` đóng
    `“`). Không sửa được tầng đã ghim; vì vậy hạ `ambiguity_integrity` 9.2.
  · Năm khoá còn lại (`5.9`…`5.24`, `10.8`, `11.8`, `12.8`) không có ngoặc nào ở cả hai phía.

  **Dấu lược:** không khoá nào trong 11 khoá này chứa `…` (đo bằng script), nên tổng dấu lược của bản
  lấp bài này bằng **0**. Bài không có `…pe…` ở đâu.

