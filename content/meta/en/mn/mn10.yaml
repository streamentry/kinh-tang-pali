notes: |-
  **Phân loại 41 khoá (đo bằng script, so Pāli đã chuẩn hoá dấu câu; ba nhóm B/C đã đọc lại bằng tay):
  A = 11 · B = 6 · C = 23 · D = 1.** Lấp đủ 41/41 khoá tầng Anh đã ghim để trống (không còn khoá trống nào
  của bài): 15 khoá đủ ngưỡng 40 ký tự (sau khi bỏ khoảng trắng cuối) và 26 khoá dưới ngưỡng. Khoá dưới
  ngưỡng vẫn được lấp vì đa số là colophon từng phần (`… pabbaṁ niṭṭhitaṁ`) và các vế `Tiṭṭhatu …` của
  chuỗi “năm/tháng”, nếu bỏ thì chuỗi đọc bị đứt; chúng không vào coverage.

  **Nhóm A — 11 khoá, dùng lại nguyên văn lời đã ghim của cùng bài.**
  · `4.10` = `4.6` · `4.11` = `4.7` (hai công thức `sikkhati` ngôi thứ nhất của thở vào/thở ra).
  · `12.5` = `12.2` (liệt kê bốn đại) · `24.2` = `14.2` · `24.3` = `14.3` (so sánh với chính thân, dùng lại ở
  phần chín nghĩa địa) · `25.1` = `9.1` (công thức nội/ngoại, giữ dấu “ …” vì Pāli `…pe…`).
  · `39.2` = `37.2` · `41.2` = `37.2` · `39.3` = `37.3` · `41.3` = `37.3` (hai công thức quán pháp
  của uẩn và xứ, trùng với phần triền cái).
  · `46.12` = `46.2` (“enlightenment in this very life, or if there’s residue left behind, non-return.”).

  **Nhóm B — 6 khoá, dựng lại từ lời đã ghim.**
  · `4.9` ← `4.4`+`4.5` (khớp 0,93 so với hai khoá ghép). Pāli `evameva kho … dīghaṁ vā assasanto …` là vế
  kết của ví dụ người thợ tiện (`4.8`) và lặp lại bốn công thức biết-thở của `4.4`/`4.5`; lớp lấp ghép
  đúng lời hai khoá ấy (“Breathing in heavily … Breathing out lightly …”) rồi thêm dẫn “In the same way,
  a mendicant …” cho `evameva`. Bốn cặp nháy đơn khớp Pāli (4/4).
  · `10.4` ← `10.1` (0,93) và `12.4` ← `12.1` (0,90): Pāli `Evameva kho … paccavekkhati:` lặp `Puna caparaṁ …
  paccavekkhati:` đã ghim ở `10.1`/`12.1`; chỉ đổi “Furthermore,” thành “In the same way,” và để dấu hai chấm
  theo Pāli (lời đã ghim kết bằng dấu chấm vì ‘…’ nằm ở khoá kế).
  · `10.5` ← `10.2` (mọi chữ Pāli còn lại của `10.5` — `kesā lomā … muttan` — đều có trong `10.2`): lấy đầu
  và cuối danh sách “head hair, body hair” … “urine”, giữa là **một** dấu lược “…” theo Pāli `…pe…`.
  · `46.10` ← `46.3` (0,79) và `46.13` ← `46.3` (0,92): `Tiṭṭhatu … ekaṁ vassaṁ.` / `Tiṭṭhantu … satta
  māsāni.` lặp `46.3` với số khác, nên dựng “Let alone one year,” / “Let alone seven months,” theo đúng
  khuôn “Let alone seven years,” (cùng cách tầng đã ghim bỏ `bhikkhave`).

  **Nhóm C — 23 khoá, tự dịch từ Pāli.** Toàn bộ là phần đóng của kinh chứ không phải lời Phật dạy:
  · 16 colophon từng phần (`3.6 5.5 7.5 9.3 11.3 13.3 31.5 31.6 33.5 35.5 37.5 39.5 41.5 43.5 45.5 45.6`):
  “The section on the … is finished.”, dịch theo tiêu đề tầng đã ghim của chính từng phần (“Mindfulness of
  Breathing”, “The Postures”, “Situational Awareness”, “Focusing on the Repulsive”, “Focusing on the
  Elements”, “The Aggregates”, “The Sense Fields”, “The Awakening Factors”, “The Truths”…). Riêng `31.5`
  `navasivathika` là “nine charnel ground contemplations” (số `nava` có thật ở Pāli), và `31.6`
  `Cuddasakāyānupassanā` là “fourteen sections on observing the body” (đếm lại: hơi thở, tư thế, tỉnh giác,
  bất tịnh, các đại = 5 phần, cộng chín nghĩa địa = 14).
  · `47.5`, `47.6`: “Mindfulness Meditation is finished—the tenth.” / “The Chapter on the Root of All
  Things is finished—the first.”, theo khuôn colophon đã lấp ở `mn20`, `mn117`, `mn123`.
  · `48.0`–`48.4`, kệ tóm lược của phẩm đầu. Dịch **tên kinh** theo tầng đã ghim (“Fear and Dread”,
  “Unblemished”, “Wishes”, “The Simile of the Cloth”, “Self-Effacement”, “Right View”, “Mindfulness
  Meditation”), như tầng đã ghim dịch kệ tóm lược ở `mn20`. Hai chỗ **không phân xử chắc được** và để
  nguyên theo nghĩa đen: (a) `Mūlasusaṁvara` lấy là “The Root, Restraint” (kinh thứ hai tên chính là
  `Sabbāsava`, “All the Defilements”, nhưng kệ gọi bằng `susaṁvara`, nên không đổi sang tên kinh);
  (b) `Vaggavaro asamo susamatto` là “the excellent chapter, unequalled, perfectly complete” — ba tính
  từ của phẩm, dịch đủ ba, không gán nghĩa nào hơn.

  **Nhóm D — 1 khoá, báo.** `25.2` (Pāli `evampi kho, bhikkhave, bhikkhu kāye kāyānupassī viharati.`) trùng
  tám khoá `5.4 7.4 9.2 11.2 13.2 15.2 17.2 31.4`, mà lời đã ghim khác nhau ở một khoá: `5.4` là
  “That’s how a mendicant meditates …”, bảy khoá kia là “That too is how a mendicant meditates …”.
  Lớp lấp dùng cách bảy khoá (“That too is how”) vì `25.2` đứng ở phần nghĩa địa, sau sáu phần trước đã
  đọc “That too”; `5.4` là lần đầu tiên nên “That’s how” hợp. Không sửa `5.4` (tầng đã ghim).

  **Nháy.** 39/41 khoá khớp Pāli từng khoá (đo đủ bốn loại: nháy kép mở/đóng, nháy đơn mở/đóng).
  **Lệch có chủ đích ở hai khoá `39.3` và `41.3`:** Pāli có `‘Atthi dhammā’ti` (một cặp nháy đơn) nhưng lời đã
  ghim ở `37.3` — Pāli trùng — bỏ cặp nháy (“mindfulness is established that principles exist”), nên
  lớp lấp dùng y nguyên `37.3` để ba khoá cùng Pāli (`37.3`, `39.3`, `41.3`) cùng một câu Anh.

  **Dấu lược.** `10.5` và `25.1` có `…pe…` ở Pāli, mỗi khoá đúng một “…” ở lời lấp; không khoá nào khác có
  dấu lược. Pāli của `4.9` không có `…`.

  **Cố ý lệch tầng đã ghim:** (1) hai khoá `39.3`, `41.3` mất nháy như trên; (2) `10.4`, `12.4` kết bằng dấu hai
  chấm theo Pāli thay vì dấu chấm của `10.1`/`12.1`.

  **Coverage (mẫu số = khoá Pāli ≥ 40 ký tự, bỏ `:0`; không phải mọi khoá):** trước 153/168 = **0,9107**; sau
  168/168 = **1,0000** (sau khi `published`). Độ nhạy: ngưỡng 0,8 cần ≥ 135/168, bài đã vượt ngưỡng từ
  đầu nên lớp lấp **không** quyết định bài có dưới ngưỡng hay không. Bài này **không** `below`, nên
  `content/meta/reference-gaps.yaml` không có record phải xoá vì lát này; không chạm tệp đó.

  **Triangulation 8.0 — bản lấp không phải cách đọc English độc lập.** Scorecard Việt của `mn10`
  (`content/meta/sutta/mn/mn10.yaml`) ghi `quality.assessed_by` **trùng họ công cụ** với lớp lấp này (đối chiếu
  theo `source/tooling.yaml`); bài này **không** được tuyên bố là đã đối chiếu English độc lập. Bản Việt
  canonical được dùng để đối chiếu nghĩa ở 41 khoá, không dịch vòng qua nó. Chỉ 41 khoá trong 235 của bài do
  lớp lấp, nên phần còn lại của bài vẫn dựa vào bản Sujato đã ghim.

  technical_integrity 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát
  này (cấm của người điều phối), nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối.
