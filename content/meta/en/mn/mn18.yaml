notes: |-
  **Phân loại 48 khoá (đo bằng máy): A = 10 · B = 26 · C = 12 · D = 0.**

  **Cơ chế thật: tóm lược bằng câu kể.** Ba khối Pāli lớn bị tầng đã ghim thay bằng một câu: `6.2` “and told the
  mendicants what had happened.” (thay lời Đức Phật kể lại `6.3`–`6.13`); `11.2` “They told him what had happened,
  and said:” (thay `11.3`–`11.17`); `20.1` “… and told him what had happened, adding:” (thay `20.2`–`20.16`); thêm
  `19.1` đã ghim mang luôn câu kết của `19.3` (“This is how I understand …”). Lớp lấp dịch đúng từng khoá Pāli, nên
  có lặp với các câu kể ấy — hệ quả của tầng đã ghim, không sửa.

  **A — 10 khoá chép nguyên văn:** `10.3` `11.4` `20.3` ← `15.2`; `10.4` `11.5` `11.11` `20.4` `20.10` ← `8.2`;
  `20.11` ← `8.3`; `20.12` ← `8.4`.

  **B — 26 khoá.** Lời Đức Phật kể lại (`6.4`–`6.9`, `6.11`–`6.13`; khớp 0,76–1,00 với `2.2`–`5.1`): giữ nguyên chữ
  của đoạn kể đã ghim, đổi sang ngôi thứ nhất (“I wandered for alms … I plunged deep into the Great Wood …”), đổi
  `“ ”` thành `‘ ’` ở `6.9` `6.11` `6.12` đúng Pāli; `6.8` giữ thêm câu `Ekamantaṁ ṭhito kho, bhikkhave, daṇḍapāṇi
  sakko maṁ etadavoca` mà lời `3.3` đã ghim gộp; `6.13` “When I had spoken, mendicants, …”. Câu tụng tóm tắt lặp
  (`10.6` `11.7` `11.13` `20.6` ← `8.4`, đổi `”` thành `’`/`”’` đúng Pāli); `11.10` `20.9` ← `8.1`; `11.3` `11.9`
  `20.2` `20.8` ← `10.2`/`15.1` (thêm lời gọi đúng Pāli: “Reverend Kaccāna,” / “Reverends,” / “Sir,”); `11.14`
  `20.13` ← `10.7`; `11.16` ← `10.9`+`10.10` (0,72); `11.17` ← `10.11`; `20.16` (0,64 với `10.11`) đổi sang thuật
  lại; `19.2` (0,78 với `15.3`) = ba vế `15.2`+`8.2`+đầu `8.3`, giữ một `…` của `…pe…`; `19.3` (1,00 với `15.4`) chỉ
  giữ phần thuộc khoá này của Pāli — lời `15.4` đã ghim lệch một khoá (mang luôn phần `esevanto …` của `15.3`).

  **Lệch nhỏ có lý do, ghi để người sau biết:** tầng đã ghim dịch cùng một câu Pāli `yatonidānaṁ, bhikkhu, …`
  hai cách — `8.1` có “Mendicant,”, `15.2` bỏ. Lớp lấp chép `15.2` cho ba khoá mở bằng `‘` (`10.3` `11.4` `20.3`,
  Pāli trùng nguyên văn `15.2`) và `8.1` cho hai khoá mở bằng `“` (`11.10` `20.9`, Pāli chỉ khác `8.1` ở chữ hoa).
  `11.14`: Pāli `vibhajeyyāti?` **không** có nháy đóng (khác `20.13` `vibhajeyyā’ti?`), nên lớp lấp cũng không đóng
  nháy ở `11.14` — đúng Pāli từng khoá, dù dấu `‘` mở ở `11.9` vì thế không có cặp trong khoá này.

  **C — 12 khoá:** `6.3` (lời mở kể lại, theo `2.1`); `6.10`; `10.5` `11.6` `11.12` `20.5` (`Esevanto rāgānusayānaṁ
  …pe…` → “just this is the end of the underlying tendencies to desire …”, chữ của `8.3`, một `…`); `11.8` `20.7`
  (theo `10.1`); `11.15` `20.14` (theo `10.8`); `20.15` (= `11.16` + `11.17`, Pāli gộp làm một khoá); `22.8` colophon
  “The Honey-Cake is finished—the eighth.”

  **Nháy và dấu lược:** khớp Pāli ở cả 48 khoá; 5 dấu `…`, mỗi dấu ứng đúng một `…pe…` (`10.5` `11.6` `11.12`
  `19.2` `20.5`). 7 khoá dưới ngưỡng 40 ký tự (`6.9` `10.5` `11.6` `11.12` `20.5` `20.14` `22.8`) vẫn lấp.

  **Cơ chế khoá trống (đo, không sửa):** dãy ≥ 4 khoá trống liên tiếp: 4 dãy / 45 khoá / 4.189 ký tự Pāli; nhóm
  dòng song song (ngưỡng 0,70): 38/48 khoá. Bài có 43 cặp khoá Pāli trùng nguyên văn.

  **Triangulation 8.0.** Scorecard Việt của bài (`content/meta/sutta/mn/mn18.yaml`) có
  `quality.assessed_by` trùng đúng alias của lớp lấp này (alias khai trong `source/tooling.yaml`), nên bản
  lấp **không** phải cách đọc English độc lập với bản Việt, và scorecard Việt của bài **không** được tuyên
  bố là đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root đã ghim + Sujato đã ghim (ở các khoá
  có chữ của chính bài) + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng). Không sửa tệp Việt hay
  metadata Việt.

  **technical_integrity 9.6.** Lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều phối. Đã tự kiểm
  bằng máy: JSON parse; mọi khoá thuộc tập khoá tầng Anh đã ghim để trống (không shadow); NFC; không khoá rỗng;
  khoá theo thứ tự Pāli; nháy kép/đơn và dấu lược so **từng khoá** với Pāli (`…pe…` tính là một `…`; `’` có
  chữ thường đứng ngay sau là dấu nhạt lượu, còn lại là nháy đóng).

  **Coverage và gap.** `mn/mn18` **có** record trong `content/meta/reference-gaps.yaml`; sau khi bản lấp `published`, record đó thành thừa — lát này **không** chạm tệp đó, để người điều phối chạy lại `npm run reference:gaps`. Coverage English (mẫu số = khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`):
  trước lớp lấp 86/127 = 0.6772; sau khi `published` 127/127 = **1,0000** (không còn khoá có nội dung
  nào trống). Độ nhạy: lớp lấp chỉ được tính khi `published`; nếu bài rơi về `review`/`draft` thì coverage quay về
  0.6772 — dưới ngưỡng 0,8. Ở trạng thái `published`, phải mất 26 khoá có nội dung
  nữa mới rớt ngưỡng 0,8.
