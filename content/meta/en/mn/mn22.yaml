notes: |-
  Phân loại 49 khoá (đo bằng máy, Pāli chuẩn hoá bỏ dấu câu, so với mọi khoá Sujato có chữ trong bài):
  A 25 · B 11 · C 7 · D 6. Các cụm Pāli trùng nhau giữa chính những khoá cần lấp cũng giữ cùng một lời (kiểm bằng máy):
  2.4 = 3.25; 2.5 = 3.23 = 3.26 = 3.29; 3.20 = 3.31 = 3.39; 10.18 = 11.18; 41.5 = 41.7; 43.1 = 44.1 = 45.1 = 46.1.

  Nhóm A, dùng lại lời Sujato (25 khoá):
  - Nguyên văn (21 khoá): 3.20 ← 3.4; 3.34 ← 3.7; 3.36 ← 8.7 (“With the similes of a skeleton …”, một `…`, đúng một `…` cho `…pe…`);
    8.11 ← 6.3; 10.18 ← 10.2 và 11.2 (chín thể loại văn bản); 10.19–10.22 ← 10.3–10.6; 11.18 ← 10.2 và 11.2; 11.19–11.22 ← 11.3–11.6;
    13.23 ← 13.15; 37.4 ← 37.2; 41.23 ← 40.2, 41.3, 41.11, 41.20, 41.28 (năm nguồn cùng một lời); 43.1, 44.1, 45.1, 46.1 ← 42.1 và 47.1
    (cùng lời “The teaching well-explained thus by me is clarified, revealed, illuminated, and stripped of patchwork.”).
  - Đổi dấu nháy hoặc dấu câu cuối cho khớp Pāli (4 khoá): 3.28 ← 3.2 (nháy kép mở thành nháy đơn mở, “:” thành “—”, vì Pāli
    `‘saccaṁ kira te …uppannaṁ—`); 3.31 và 3.39 ← 3.4 (Pāli `‘evaṁ byā kho …’ti`, nên bọc bằng nháy đơn thay cho nháy kép);
    3.33 ← 3.6 (nháy đơn mở thay cho nháy kép). Từ ngữ giữ nguyên Sujato; đo nháy: 3.28 Pāli (đơn mở 1) bản lấp (đơn mở 1);
    3.31/3.39 Pāli (đơn mở 1, đơn đóng 1) bản lấp (1, 1); 3.33 Pāli (đơn mở 1) bản lấp (1).

  Nhóm B, dựng lại từ khoá gần trùng (11 khoá):
  - 2.4 ← 2.1 (tỉ lệ 0,73), 3.22 ← 2.1 (0,73), 3.25 ← 2.1 (0,73): câu `ariṭṭhassa (kira) nāma … bhikkhuno gaddhabādhipubbassa evarūpaṁ pāpakaṁ diṭṭhigataṁ
    uppannaṁ`. Sujato đã nuốt 2.4–2.5 vào 2.3 (“Several mendicants heard this rumour.”). Bản lấp chèn lại phần bị nuốt bằng đúng chữ
    của 2.1 (“a mendicant named Ariṭṭha, who had previously been a vulture trapper, … the following harmful misconception:”), thêm
    “Apparently” cho `kira` và “Sir,” cho `bhante`.
  - 3.27 ← 3.1 (0,71): “Then we went up to Ariṭṭha and said to him,” (ngôi thứ nhất, theo `tenupasaṅkamimha … etadavocumha`).
  - 3.32 ← 3.5 (0,64): “Then, sir, wishing to dissuade Ariṭṭha from his view, we pursued, pressed, and grilled him,”.
  - 3.38 ← 3.19 (0,88): “But even though we pursued, pressed, and grilled him in this way, sir, Ariṭṭha obstinately stuck to his misconception and insisted on it:”.
  - 8.12 ← 6.4 (0,89): `…pe…` nên cùng “With the similes of a skeleton …”, một `…`.
  - 13.9 ← 13.6 (0,70): chuyển lời mô tả của Sujato (“They’d see a large deluge, whose near shore was dubious and perilous, …”)
    thành lời tự nói trong nháy đơn; 13.10 ← 13.7 (0,78): “And there is no ferryboat or bridge for crossing over.”
  - 41.5 và 41.7 ← 40.2 (0,71): `sā vo pahīnā …` giống 40.2 trừ giống cái; tiếng Anh dùng lại “Giving it up will be for your lasting welfare and happiness.”

  Nhóm C, tự dịch từ Pāli (7 khoá):
  - 3.24 `assumha kho mayaṁ, bhante`: “Sir, we heard:”; 3.30 `evaṁ vutte, bhante, ariṭṭho … etadavoca`: “When this was said, sir, Ariṭṭha said to us,”;
    4.1 `yato kho mayaṁ … ārocemā”ti`: “Since we weren’t able to dissuade Ariṭṭha from his harmful misconception, sir, we are reporting this matter to the Buddha.”
    (nháy kép đóng của Pāli giữ nguyên); 3.22–3.39 là toàn bộ lời tường thuật của chư tỳ-kheo mà Sujato nén vào một câu ở 3.21.
  - 8.5 `alañca pana te paṭisevato antarāyāya`: Sujato đã gộp vào 8.4 (“…that obstructive acts are obstructive, and that they really do obstruct the one who performs
    them.”). Bản lấp ghi “and that they really do obstruct the one who performs them.” theo đúng từ của 3.7 và 6.2; hệ quả của tầng ghim hiện ra thay vì giấu:
    người đọc gặp mệnh đề này hai lần.
  - 25.7: “Is this not, mendicants, a totally foolish teaching?” (nháy kép đóng của Pāli, lấy “totally foolish teaching” của 25.8).
  - 41.9: số nhiều của `te vo pahīnā`: “Giving them up will be for your lasting welfare and happiness.”
  - 47.5 `Alagaddūpamasuttaṁ niṭṭhitaṁ dutiyaṁ.`: “The Simile of the Cobra is finished—the second.”

  Nhóm D, báo, không tự hoà (6 khoá): 2.5, 3.23, 3.26, 3.29, 3.35, 3.37.
  - 2.5, 3.23, 3.26, 3.29 cùng Pāli `tathāhaṁ bhagavatā dhammaṁ desitaṁ ājānāmi …` với 2.2, 3.3 và 5.8; lời Sujato giống từng chữ (“As I understand the Buddha’s teaching,
    the acts that he says are obstructions are not really obstructions for the one who performs them”) nhưng khác dấu câu và nháy: 2.2 “…”, 3.3 và 5.8 ‘…’?”. Bản lấp dùng đúng cụm chữ ấy và chỉ đổi dấu theo Pāli từng khoá:
    2.5 ‘…’” (đơn mở, đơn đóng, kép đóng), 3.23 ‘…’, 3.26 …’, 3.29 …’? Đo nháy: 2.5 Pāli (đơn mở 1, đơn đóng 1, kép đóng 1), bản lấp (1, 1, 1).
  - 3.35 ← 3.8 (“The Buddha says that sensual pleasures …”) và 8.6 (“The Buddha has said that …”); 3.37 ← 3.18 (“…the Buddha says that …”) và 8.8 (“…the Buddha has said that …”).
    Hai lời Sujato khác thì (“says” / “has said”). Bản lấp chọn “says” (3.8, 3.18) vì ở 3.35/3.37 chư tỳ-kheo đang lặp lại đúng lời mình đã nói với Ariṭṭha ở 3.8/3.18.
    Đây là lựa chọn của người dịch, không phải sự đồng thuận có sẵn.

  Chỗ cố ý lệch Sujato: dấu câu và nháy ở năm khoá nhóm A/D nêu trên (3.28, 3.31, 3.33, 3.39 và nhóm 2.5), và lựa chọn “says” ở 3.35 và 3.37. Không sửa chữ nào khác của Sujato.

  Dấu lược: Pāli của hai khoá có `…pe…` (3.36, 8.12), bản lấp ghi đúng một `…`; 47 khoá còn lại không có `…` ở Pāli và bản lấp không thêm. Lưu ý (tầng đã ghim, đo bằng máy,
  không sửa): Sujato tự thêm `…` nơi Pāli viết đủ ở 8.10, 10.17, 11.17, 13.22, 15.5, 15.6, 15.7, 16.3, 16.4, 16.5, 41.4, 41.6, 41.8, 41.22, 42.2, 43.2, 44.2, 45.2 (18 khoá).

