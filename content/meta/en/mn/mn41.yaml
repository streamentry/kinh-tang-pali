notes: |-
  **Phân loại 17 khoá (đo bằng máy): A = 12 · B = 4 · C = 1 · D = 0.**

  **A — 12 khoá chép nguyên văn lời đã ghim.** Bài lặp một khuôn bốn vế cho mỗi cõi tái sinh (ước nguyện —
  “có thể xảy ra” — “vì sao?” — “vì người ấy sống đúng Pháp”). Tầng đã ghim dịch đủ khuôn ở `15.1`–`15.5`,
  rồi ở `16-17` và `18-42` chỉ giữ tên cõi và để trống phần còn lại: `16-17.5` `18-42.4` `18-42.14` `18-42.19` ←
  `15.4` (“Why is that?”); `16-17.6` `18-42.5` `18-42.15` `18-42.20` ← `15.5`; `18-42.1` `18-42.6` `18-42.16`
  `18-42.21` ← `15.1`.

  **B — 4 khoá `ṭhānaṁ kho panetaṁ vijjati, yaṁ so … sahabyataṁ upapajjeyya.`** (`16-17.4`, `18-42.3`, `18-42.13`,
  `18-42.18`; khớp 0,92–0,93 với `15.3` và `18-42.38`). Pāli lặp lại tên cõi (`gahapatimahāsālānaṁ`,
  `cātumahārājikānaṁ devānaṁ`, `brahmakāyikānaṁ devānaṁ`, `ābhānaṁ devānaṁ`). Tầng đã ghim dịch **cả ba**
  khoá anh em đã có lời (`15.3`, `18-42.38`, `43.3`) bằng cùng một câu rút gọn “It’s possible that this might
  happen.” — không nhắc lại tên cõi. Lớp lấp theo đúng quy ước ấy để bốn khoá này không lệch ba khoá anh em; đổi
  lại, tên cõi chỉ hiện ở khoá ước nguyện liền trước. Đây là lựa chọn nhất quán, ghi thẳng là có mất chi tiết
  lặp nên `semantic_fidelity` 9,3.

  **C — 1 khoá: `44.6` colophon** `Sāleyyakasuttaṁ niṭṭhitaṁ paṭhamaṁ.` → “The People of Sālā is finished—the
  first.” (tên bài lấy đúng `0.2` của tầng đã ghim; khuôn “… is finished—the …” theo các colophon đã lấp ở `mn`).

  **Dấu lược và nháy:** không khoá nào trong 17 khoá có `…` ở Pāli; bản lấp 0 dấu lược. Nháy khớp Pāli từng
  khoá (17/17). 9 khoá dưới ngưỡng 40 ký tự (`16-17.5` `16-17.6` `18-42.4` `18-42.5` `18-42.14` `18-42.15`
  `18-42.19` `18-42.20` `44.6`) vẫn được lấp để khuôn lặp không đứt; chúng không vào coverage.

  **Cơ chế khoá trống (đo, không sửa):** dãy ≥ 4 khoá trống liên tiếp: 4 dãy / 16 khoá / 802 ký tự Pāli; nhóm
  dòng song song (ngưỡng 0,70): 16/17 khoá. Bài có 57 cặp khoá Pāli trùng nguyên văn.

  **Triangulation 8.0.** Scorecard Việt của bài (`content/meta/sutta/mn/mn41.yaml`) có
  `quality.assessed_by` trùng đúng alias của lớp lấp này (alias khai trong `source/tooling.yaml`), nên bản
  lấp **không** phải cách đọc English độc lập với bản Việt, và scorecard Việt của bài **không** được tuyên
  bố là đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root đã ghim + Sujato đã ghim (ở các khoá
  có chữ của chính bài) + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng). Không sửa tệp Việt hay
  metadata Việt.

  **technical_integrity 9.6.** Lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều phối. Đã tự kiểm
  bằng máy: JSON parse; mọi khoá thuộc tập khoá tầng Anh đã ghim để trống (không shadow); NFC; không khoá rỗng;
  khoá theo thứ tự Pāli; nháy kép/đơn và dấu lược so **từng khoá** với Pāli (`…pe…` tính là một `…`; `’` có
  chữ thường đứng ngay sau là dấu nhạt lượu, còn lại là nháy đóng).

  **Coverage và gap.** `mn/mn41` **không** có record trong `content/meta/reference-gaps.yaml`, nên không record nào thành thừa vì lát này. Coverage English (mẫu số = khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`):
  trước lớp lấp 77/85 = 0.9059; sau khi `published` 85/85 = **1,0000** (không còn khoá có nội dung
  nào trống). Độ nhạy: lớp lấp chỉ được tính khi `published`; nếu bài rơi về `review`/`draft` thì coverage quay về
  0.9059. Ở trạng thái `published`, phải mất 18 khoá có nội dung
  nữa mới rớt ngưỡng 0,8.
