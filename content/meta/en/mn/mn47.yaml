notes: |-
  10.3 và 10.4 trùng nguyên văn 9.6 và 9.7 → lấy nguyên văn, kể cả cách Sujato dịch
  `abhayūparato` thành "securely stilled" chứ không phải "devoted to removing fear"
  (cách dịch lấy từ `abhayūpamāna`, và đó là tiền lệ của chính bài này, nên không
  phải sửa):
  - 10.3 = 9.6: "that venerable is securely stilled, not insecurely stilled;"
  - 10.4 = 9.7: "The reason they don’t indulge in sensual pleasures is that they’re
    free of greed because greed has ended.”" (10.4 mang dấu ngoặc đóng vì Pāli kết
    bằng `’ti.`).

  15.3 trùng nguyên văn 14.4 → lấy nguyên văn bộ từ "The Blessed One is a fully
  awakened Buddha! The teaching is well explained! The Saṅgha is practicing well".
  Dấu `Saṅgha` giữ dấu vì 14.4 của chính bài đã ghim dùng.

  BẤT ĐỊNH ĐÃ GHI, và đây là lựa chọn duy nhất trong lát này không cơ hếp: 15.3 là
  CÂU HỎI (`’ti?`) trong khi 14.4 là câu kể (`’ti.`). Dấu cuối vì vậy phải là `?`
  thay cho `!`. Cân nhắc viết `!?` cho đúng 14.4 nhưng đã bỏ: đếm `!?` trong toàn
  bộ bản Anh đã ghim = 0 lần, và chính 15.8 đã ghim cũng vướng ("…practicing well!”’").
  Giữ `!”` rồi thêm `?”` sẽ thành `!?”`, trông như lỗi. Dùng `?”` là quy ước tiếng
  Anh đúng, và đọc chuỗi 14.4 → 15.3 vẫn thấy rõ ba vế của công thức.

  Hệ quả người đọc thấy: dấu `”` ở 15.3 là ngoặc đóng "mồ côi" vì bản đã ghim ở
  15.2 đã đóng ngoặc của mình ("…for saying this?’") trong khi Pāli 15.2 để mở `‘`
  không đóng. Pāli 15.2–15.3 thì cân. Bỏ dấu ở 15.3 thì lệch số ngoặc với Pāli, nên
  giữ. `vietnamese_clarity` hạ 8.8.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
