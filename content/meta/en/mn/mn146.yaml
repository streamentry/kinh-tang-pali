notes: |-
  Lát 602. Một trăm bảy mươi tám khoá lấp = một trăm bảy mươi tám khoá tầng Anh đã ghim để trống; 90 khoá có nội
  dung, 88 khoá dưới ngưỡng (các câu đáp `“Aniccaṁ, bhante”.`, `“No hetaṁ, bhante”.`, `“Taṁ kissa hetu”?`, các mảnh
  `jivhā …`, `kāyo …`…) vẫn lấp để hai buổi giảng đối xứng nhau.

  **Vì sao bài này trống nhiều.** Tầng đã ghim viết ở `16.4` “And the next day he went to those nuns, and all
  unfolded just like the previous day.” rồi để trống **157 khoá liên tiếp** `16.5`–`26.15` — toàn bộ buổi giảng thứ
  hai mà Pāli viết lại gần như nguyên văn. Thêm một dãy 6 khoá `8.3`–`8.8` (tầng đã ghim dịch câu hỏi về nhãn thức
  rồi bỏ trống chuỗi đáp). Lớp lấp dịch đủ; cột English vì vậy có cả câu tóm tắt của `16.4` lẫn phần được tóm tắt.

  **Bốn nhóm khoá (đo bằng máy trên 361 khoá Pāli):** A **99** · B **49** · C **5** · D **25**.

  - **A (99): 76 nguyên văn, 23 lệch có chủ đích ở dấu câu, không đổi chữ.** Buổi một đã ghim dùng quy ước nháy
    riêng: 42 khoá đã ghim của bài có số nháy khác Pāli (ví dụ `6.24` “No, sir. / `6.25` Why is that? / `6.26`
    Because …” liền một lời, trong khi Pāli đóng-mở nháy ở từng khoá). Lớp lấp theo **Pāli từng khoá**: 8 khoá
    `“Taṁ kissa hetu”?` → “Why is that?” trong nháy kép (`17-18.21` `19-20.23` `21.18` `22.7` `22.15` `23.7`
    `23.15` `24.7`); 3 khoá `“Pubbeva no etaṁ …` và 4 khoá `“Amussa hi …`/`“Tajjaṁ tajjaṁ …` mở `“` (`17-18.22`
    `19-20.24` `21.19` `22.8` `22.16` `23.8` `23.16`). 5 khoá giác chi `26.4`–`26.8`: lời đã ghim ở `13.4`–`13.8`
    (“investigation of principles,” “energy,” …) **bỏ dấu lược** dù Pāli có `…pe…`/`…` ⇒ lớp lấp giữ một `…` mỗi khoá.
    3 khoá `17-18.10` `19-20.10` `21.5`: Pāli viết đủ câu hỏi (`ghānaṁ niccaṁ vā aniccaṁ vā”ti?`), lời đã ghim ở khoá
    trùng (`6.12`, `7.12`, `8.11`) chỉ là mảnh “nose …” với dấu lược tự thêm ⇒ lớp lấp viết đủ câu hỏi, đóng `”`.
  - **D (25) — báo, không hòa; chọn theo ngữ pháp, không theo tần suất.** (1) `Yaṁ panāniccaṁ dukkhaṁ vā taṁ sukhaṁ
    vā”ti?` (6 khoá) và `… kallaṁ nu taṁ samanupassituṁ:` (6 khoá): tầng đã ghim dùng “is it” cho nội xứ/thức và
    “are they” cho ngoại xứ số nhiều (`7.4`, `7.6`…). Đây không phải bất nhất mà là hòa hợp số với danh từ của câu hỏi
    trước; lớp lấp theo đúng quy tắc ấy: số ít ở `8.4` `8.6` `17-18.3` `17-18.5` `17-18.16` `17-18.18` `21.13` `21.15`,
    số nhiều ở `19-20.3` `19-20.5` `19-20.18` `19-20.20`. (2) `“No hetaṁ, bhante”.` (11 khoá): tầng đã ghim có “No,
    sir.” (2/10 khoá, đóng nháy: `6.8`, `7.8`) và “No, sir. (8/10 khoá, không đóng, nối sang “Why is that?”). Pāli đóng nháy ở mọi khoá ⇒
    lớp lấp dùng “No, sir.” đóng nháy, tức là theo Pāli chứ không theo đa số của tầng đã ghim. (3) `‘tathevāyaṁ gāvī …’ti;` (`24.4`, `24.11`): tầng đã ghim kết `11.4` bằng
    dấu chấm, `11.11` bằng dấu phẩy; lớp lấp theo khoá cùng vị trí ở buổi một (`24.4` ↔ `11.4`, `24.11` ↔ `11.11`).
  - **B (49)**: chủ yếu là câu đáp lược `“Aniccaṁ/Aniccā, bhante …pe…` / `“Aniccaṁ, bhante” …` (23 khoá; “Impermanent,
    sir …” hoặc “Impermanent, sir.” …, nháy và dấu lược theo Pāli từng khoá) và 11 câu hỏi về từng xứ/thức, trong đó
    câu hỏi ghép `Taṁ kiṁ maññatha, bhaginiyo, cakkhu …”ti?` (Pāli gộp `6.1`+`6.2` vào một khoá ⇒ “What do you think,
    sisters? Is the eye …?”). 15 khoá B còn lại là câu văn, chép lại lời đã ghim của khoá nguồn (`16.14` `16.15`
    `22.11` `22.12` `23.5` `25.2` `25.4` `26.10`: tỉ lệ 0,9–1,0, chỉ khác dấu phẩy/hoa thường) hoặc như sau.
    Các B có thêm chữ: `16.13` (từ `5.2`, 1,0): lời đã ghim ở `5.2` **bỏ** hai câu trích `‘ājānāmā’`/`‘na ājānāmā’`;
    Pāli `16.13` có hai cặp nháy đơn ⇒ lớp lấp chèn lại “you should say: ‘We understand.’ … ‘We don’t understand.’”.
    `11.8` `24.8` (từ `11.1`, 0,87): “Sir, that deft butcher … would carve it …” — `amu` “người ấy” và mở `“` theo Pāli.
    `23.3` `23.4` (từ `10.3`, 0,93/0,90): lời đã ghim ở `10.3` gộp cả hai vế trong một khoá; lớp lấp tách đúng chỗ Pāli
    tách. `23.12` (từ `10.11`, 0,97): Pāli **không có** `cha` ⇒ bỏ “six”. `25.1` (từ `12.1`, 0,89): Pāli gộp `12.1`+`12.2`.
  - **C (5)**: `17-18.12` `17-18.13` (`jivhā …`, `kāyo …` ⇒ “the tongue …”, “the body …”), `19-20.1` `19-20.8` (câu hỏi
    ghép về sắc/thanh, khuôn của `7.1`+`7.2` đã ghim) và colophon `27.8` (“Advice from Nandaka is finished—the
    fourth.”, tên bài lấy từ `0.2` đã ghim).

  **Dấu lược:** Pāli của 178 khoá có 30 dấu lược (`…pe…` tính một), lớp lấp 30. **Nháy:** 178/178 khoá khớp Pāli.
  **Cặp Pāli trùng toàn bài:** 818. Sau khi lấp, mọi nhóm Pāli trùng có **cùng chữ**; khác biệt còn lại chỉ ở nháy/dấu
  lược/số ngữ pháp như kê trên.

  Segment 9,4, clarity 9,1, grammar 9,3 vì cột English của buổi hai theo quy ước nháy của Pāli, khác quy ước của
  buổi một đã ghim, và vì `16.4` đã ghim tóm tắt chính phần lớp lấp viết ra.

  **Coverage (đo bằng phép của `englishCoverageFor`: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước: 104/194
  = 0.5361. Sau khi lớp lấp `published`: 194/194 = 1.0. Độ nhạy: phải mất thêm 39
  khoá có nội dung nữa thì bài mới rớt dưới ngưỡng 0,8. Lớp lấp chỉ được tính khi `status: published`.
  `mn/mn146` **có** record trong `content/meta/reference-gaps.yaml` (substantive 194, thiếu 90); record đó sẽ thành thừa khi lớp lấp `published`. Lát này **không** chạm tệp đó; người điều phối sinh lại bằng `npm run reference:gaps`.

  **Hai cơ chế khoá trống ở tầng Anh đã ghim (đo, không sửa).** Cắt cụt dãy (≥ 4 khoá trống liên tiếp):
  2 dãy / 163 khoá / 9.032 ký tự Pāli (`8.3`–`8.8`, `16.5`–`26.15`). Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 149/178 khoá trống vào nhóm
  (kiểm `kết quả ≤ số khoá trống`: đạt).

  **Triangulation ≤ 8,0.** Scorecard Việt của bài (`content/meta/sutta/mn/mn146.yaml`) ghi `quality.assessed_by` là công cụ đã chấm lượt review đối kháng MN/DN — **cùng
  alias công cụ** với lớp lấp này (khai trong `source/tooling.yaml`). Vì vậy bản lấp **không phải** cách đọc
  English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá lấp.
  Không có bản Anh thứ hai; đối chiếu có: Pāli root + Sujato đã ghim (cho khoá anh em) + bản Việt canonical (chỉ
  để đối chiếu nghĩa, không dịch vòng, không chép).

  **technical_integrity 9,6.** Lát này không được chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh
  còn nợ: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Tự kiểm đã làm: JSON parse, mọi khoá
  thuộc `fillableSegments`, không khoá nào trùng khoá Sujato có chữ (0 shadow), NFC, không khoá rỗng, dấu lược
  khớp Pāli (`…pe…` = một `…`), nháy khớp Pāli từng khoá trừ các ngoại lệ ghi ở trên.
