notes: |-
  14.20–14.23 là lần lặp thứ hai của **đúng** lời dặn đường mà bản đã ghim đã dịch ở
  `mn107:14.11–14.13`. Pāli hai vòng giống nhau từng vế (`14.20` ≡ `14.11`;
  `14.21`+`14.22` là hai nửa của `14.12`; `14.23` ≡ `14.13`), nên lấy lại y nguyên bản
  đã ghim, kể cả "Here, my man," cho `ehambho purisa` và cách chia câu bằng `;` ở
  `14.21`/`14.22` (vế đã ghim vốn gộp cả hai bằng dấu chấm).

  Tra tiền lệ cho `ehambho purisa`: toàn tầng có "Please, my man," 30 lần, "Please,
  my friend," 7 lần, "Come now, my man," 1 lần — nhưng ở chính bài này `mn107:14.11`
  đã ghim "Here, my man," cho đúng câu Pāli đó, nên theo luật `sn11.24` mà giữ "Here,
  my man," chứ không đổi sang dạng được đếm nhiều hơn.

  17.5 là dòng colophon. Bản đã ghim không dịch **một** dòng nào trong 152 dòng
  `…suttaṁ niṭṭhitaṁ N` của Majjhima — đây là lỗ hổng có hệ thống của bản đã ghim, và
  nó là lý do hạ `ambiguity_integrity`. Tiền lệ nằm trong chính lớp lấp của kho:
  `mn117:38.6`, `mn137:28.5`, `mn141:32.5`, `mn147:9.14`, `mn150:7.6` đều dùng cùng khuôn
  "<tiêu đề đã ghim> is finished—the <thứ tự>.". Tiêu đề lấy từ khoá `:0.2` đã ghim
  ("With Moggallāna the Accountant"); khoá `:0.3` của Majjhima để trống.

  Lớp lấp: 5 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn
  bị mất.