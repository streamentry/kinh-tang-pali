notes: |-
  **Phân loại 18 khoá (đo bằng máy): A = 0 · B = 8 · C = 10 · D = 0.**

  **Bối cảnh:** ở `16.1/16.2`, `17.1/17.2`, `18.1/18.2`, `19.5/19.6` tầng Sujato đã **gộp** thân–khẩu–ý vào một câu (“bad conduct of body, speech, and mind”), còn Pāli viết riêng khẩu (`vacī-`, kèm `…pe…`) và ý (`mano-`) ở các khoá kế tiếp. Lớp lấp dịch đúng những khoá Pāli ấy; người đọc sẽ thấy khẩu/ý được nói lại — đó là cấu trúc thật của Pāli, không phải lớp lấp lặp ý.

  **B (8)** — các khoá `mano-` (`16.4` ← `16.1` 0,86 · `16.6` ← `16.2` 0,84 · `17.4` ← `17.1` 0,86 · `17.6` ← `17.2` 0,84 · `19.2` ← `18.1` 0,90 · `19.4` ← `18.2` 0,90 · `19.8` ← `19.5` 0,91 · `19.10` ← `19.6` 0,89): giữ nguyên từ vựng tầng ghim (“likable, desirable, agreeable result”, “for that reason alone, when their body breaks up, after death”, “a place of loss, a bad place, the underworld, hell”, “a good place, a heavenly realm”), chỉ thay chủ thể bằng `mano-` và nối với khoá `vacī-` liền trước bằng “or”. `pajānāti` ở cuối khoá Pāli ⇒ “They understand this.” đặt cuối khoá, không đẩy lên đầu như tầng ghim.

  **C (10):**
  - 8 khoá `vacī- …pe…` (`16.3`, `16.5`, `17.3`, `17.5`, `19.1`, `19.3`, `19.7`, `19.9`): dịch phần Pāli có mặt, giữ **đúng một** `…` cho `…pe…`, không mở rộng.
  - `2.13` `evañhi vo, bhikkhave, sikkhitabban”ti.` ⇒ “That’s how you should train.”” Tầng ghim ở `2.12` đã tự đóng ngoặc kép, nên khi đọc liền sẽ thấy hai dấu `”` — dấu của `2.13` khớp Pāli, dấu thừa thuộc tầng ghim.
  - `20.7` colophon (37 ký tự): “Many Elements is finished—the fifth.”

  **Ngoặc — khớp Pāli 18/18, kể cả chỗ Pāli bất thường:** Pāli `16.5` **không** mở `‘` và `16.6` viết `vijjatīti` **không** đóng `’` (trong khi `17.5`/`17.6`, `19.3`/`19.4` đều có). Lớp lấp theo đúng Pāli từng khoá nên `16.5`/`16.6` không có nháy. Ghi lại để người sau không “sửa” thành cân.

  **Dấu lược:** Pāli 8 dấu (8 × `…pe…`) — lớp lấp 8.

  **Đo hai cơ chế khoá trống:** cắt cụt dãy = 4 dãy / 16 khoá / 1.368 ký tự Pāli; bỏ dòng song song = 5 nhóm / 16 khoá. Tầng ghim tự thêm `…` ở `13.4` (Pāli viết đủ).

  **Coverage:** mẫu số 112; trước 96/112 = 0,8571; sau khi `published` 112/112 = 1,0. Độ nhạy: mất thêm hơn 22 khoá mới rớt dưới 0,8. Bài **không** có record trong `content/meta/reference-gaps.yaml`.

  **Vì sao điểm thấp hơn các bài lặp:** cách nối “… or bad conduct of mind to have …” là lựa chọn câu tiếng Anh của lớp lấp, không có tiền lệ trong tầng ghim của chính bài; hạ `vietnamese_clarity` (tiêu chí rõ nghĩa của ngôn ngữ đích) xuống 9.1 và `semantic_fidelity`/`grammar_logic` 9.3.

  Triangulation 8.0 (trần của luật): scorecard tiếng Việt của bài này (`content/meta/sutta/…`) ghi `quality.assessed_by` **trùng họ công cụ** với lớp lấp (alias khai trong `source/tooling.yaml`). Vì vậy bản lấp này **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English nhờ lớp lấp. Đối chiếu đã có: Pāli root (authority) + lời Sujato đã ghim của chính bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

  Tự kiểm bằng máy trước khi ghi: JSON parse; mọi khoá ⊆ `fillableSegments` của bài; không khoá nào trùng khoá tầng Sujato đã có chữ (0 shadow); NFC; không khoá rỗng; dấu lược đếm theo luật `…pe…` = đúng một `…` — khớp Pāli ở mọi khoá; nháy đếm theo luật `’` + chữ thường = dấu nháy lửng (apostrophe) tiếng Anh, còn lại là nháy đóng.

  technical_integrity 9.6: lát này không được chạy cổng kỹ thuật, nên **không** tuyên bố technical gate pass. Bốn lệnh còn nợ cho người điều phối: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Đây không phải blocker (cổng chặn ở validation failure, không chặn ở chưa chạy).
