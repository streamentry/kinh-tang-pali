notes: |-
  **Phân loại 58 khoá: A = 17 · B = 36 · C = 5 · D = 0.**

  - **Khuôn `7.x`–`12.x` (42 khoá):** tầng đã ghim dịch đủ khối `6.x` (sát sinh) và `13.x` (kiêu mạn), còn khối
    trộm cắp, nói dối, nói ly gián, tham dục, chê bai mắng nhiếc, sân hận chỉ có khoá dẫn `X.1` rút gọn
    (“‘Stealing …”, “lying …” — Sujato **tự thêm** `…` ở 6 khoá này, Pāli viết đủ). Lớp lấp dựng sáu khối từ khuôn
    `6.2`–`6.8` (0,92 với `6.3`/`13.3`): `X.2`, `X.8` dùng nguyên (A); `X.3`–`X.7` thay đúng tên hạnh theo danh
    sách `4.5`–`4.10` của tầng ghim (“stealing … relying on not stealing”, “lying … relying on speaking the truth”,
    “backbiting”, “greed and lust”, “blaming and insulting”, “anger and distress”) (B).
  - **Khuôn ví dụ `16.x`–`20.x` (15 khoá):** `16.6`, `17.5`, `18.9`, `20.10` = `15.9` (A); `19.3` từ `15.9` bỏ `“`
    (Pāli không mở); `16.8` = `21.22` (A); `17.7`, `18.11`, `19.5`, `20.12` giữ `…` của Pāli và dịch
    `tamevūpekkhaṁ bhāveti` “they develop only that equanimity”.
    **Cố ý lệch tầng ghim:** lời Sujato `15.10`/`21.21` viết “give little gratification and much suffering” nhưng
    Pāli chỉ có `bahudukkhā bahupāyāsā` (không có `appassādā`). Năm khoá `16.7`, `17.6`, `18.10`, `19.4`, `20.11`
    **bỏ** vế “little gratification” (“give much suffering and distress, and they are all the more full of
    drawbacks”), tên ví dụ theo Pāli: miếng thịt, bó đuốc cỏ, hố than hồng, giấc mộng, đồ vay mượn.
  - **C (5):** `17.7`, `18.11`, `19.5`, `20.12` (vế `tamevūpekkhaṁ bhāveti`) và colophon `26.5`.
  - Lệch sẽ hiện ra: các khoá dẫn `X.1` của tầng ghim kết bằng `…` rồi bản lấp viết đủ ngay sau.

