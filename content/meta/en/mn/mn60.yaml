  Triangulation ≤ 8,0: scorecard Việt của bài này (`content/meta/sutta/mn/mn60.yaml`) ghi `assessed_by`/`translators` thuộc **cùng họ công cụ** với lớp lấp (cùng khai trong `source/tooling.yaml`). Vì vậy bản lấp **không** phải cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root + lời Sujato đã ghim của cùng bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

