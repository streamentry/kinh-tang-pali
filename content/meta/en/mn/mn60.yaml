notes: |-
  **Bốn số (đo bằng máy, ngưỡng 0,80, có xét ghép hai khoá liền nhau): A = 8 · B = 4 · C = 8 · D = 0.**
  Ghi 20/20 khoá.

  **A (8 khoá):** `15.3` ← `13.3`; `18.3` ← `14.3`; `23.3`–`23.5` ← `21.3`–`21.5`; `26.3`–`26.5` ← `22.4`–`22.6`.
  Đây là các học thuyết được Đức Phật *nhắc lại* trước khi phân tích (`15.x`, `18.x`, `23.x`, `26.x`); tầng đã ghim
  chỉ dịch câu dẫn rồi tóm bằng “etc.” (`15.2`, `18.2`, `23.2`, `26.2`) và bỏ trống phần còn lại.

  **B (4 khoá):** `18.4` ← `14.4` (1,00, chỉ khác `;`/`,`) — lời nguyên văn. `18.5` ← `14.5`+`14.6` (1,00): Pāli
  `18.5` **gộp** hai khoá của bản gốc học thuyết, nên lời lấp ghép đúng hai lời đã ghim. `23.6` ← `21.6`+`21.7`
  (1,00) và `26.6` ← `22.7`+`22.8` (1,00) cùng cơ chế. Không thêm chữ nào ngoài hai lời ghép, trừ dấu `’` đóng
  theo Pāli.

  **C (8 khoá).** `15.4` Pāli lược `…pe…` giữa “giết hại, khiến giết hại” và “bố thí … không có phước”: dịch hai vế
  còn lại theo lời `13.4`/`13.6`, **giữ đúng một `…`**. `57.6` colophon “A Sure Bet is finished—the tenth.” (bỏ
  khoảng trắng kép trong tên bài của tầng đã ghim). `57.7` “The Chapter on Householders is finished—the first.”
  `58.0`–`58.4` là kệ tóm (uddāna) của phẩm Gia Chủ; theo khuôn đã có trong lớp lấp (`mn20:9.0` “Its summary
  verse:”) và dùng **tên bài theo `0.2` của Sujato** cho `mn51`–`mn60` (With Kandaraka, The Wealthy Citizen,
  A Trainee, Potaliya, Jīvaka, Upāli, The Ascetic Who Behaved Like a Dog, Prince Abhaya, The Many Kinds of Feeling,
  A Sure Bet). BẤT ĐỊNH GHI THẲNG: `jīvakabhacco` ở `58.2` là đuôi của biệt hiệu `komārabhacca` (đã kiểm: `mn55`
  gọi Jīvaka là `komārabhacca`), không phải một bài riêng; bản lấp chỉ ghi “Jīvaka”. `Upālidamatho` (`58.3`) dịch
  sát là “the taming of Upāli”. Vì vậy hạ `ambiguity_integrity` 9,1.

  Nháy: 20/20 khoá khớp Pāli; `15.4`, `18.5`, `23.6`, `26.6` mang `’` đóng của học thuyết mà Pāli mở ở `15.2` …
  (tầng đã ghim bỏ `‘` mở ở `15.2`/`18.2`/`23.2`/`26.2`, nên ở English dấu đóng không có cặp — lệch của tầng đã ghim,
  không sửa vì sửa là shadow). Dấu lược: Pāli 1 (`15.4`), bản lấp 1.

  Coverage: mẫu số 244; trước 235/244 = 0,9631, sau 244/244 = 1,0. Độ nhạy: thêm 48 khoá trống mới rớt ngưỡng.
