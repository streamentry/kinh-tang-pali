notes: |-
  Phạm vi: 74 khoá lấp, là toàn bộ khoá Sujato để trống có Pāli (54 khoá có nội dung ≥ 40 ký tự; 20 khoá ngắn hơn: `…pe…` ngắn, các khoá `3.2`…`12.2` và nhãn kết bài). Không còn khoá trống nào của bài ngoài danh sách. Bài là mười câu hỏi lặp cùng một khuôn (3–12), phần nhắc lại mười câu hỏi (13), phần nhắc lại mười quan điểm (14) và bốn lần “không áp dụng” (20); Sujato gộp mỗi câu hỏi vào khoá `x.1` (kể cả phần đuôi `evaṁdiṭṭhi bhavaṁ gotamo`) và gộp cả khoản 13 vào 13.1, khoản 14 vào 14.1.

  Bốn nhóm (đo bằng máy, Pāli chuẩn hoá): A=17 · B=37 · C=20 · D=0. Chỉ 6 khoá thật sự dùng lại nguyên văn Sujato (20.7, 20.11, 20.15 `like the ocean.` và 20.8, 20.12, 20.16 mười hai chữ “‘They’re reborn’, … none of these apply.”). 11 khoá thuộc nhóm A theo máy KHÔNG chép nguyên văn mà dựng lại: 13.4, 13.7, 13.10, 13.13, 13.16, 13.19, 13.22, 13.25, 13.28 (Pāli giống `x.1` nhưng lời Sujato của `x.1` là câu hỏi ĐÃ GỘP cả `x.2`, chép nguyên sẽ lặp phần đuôi và sai dấu nháy) và 19.5, 19.14 (lời Sujato là câu hỏi `…?”`, còn Pāli ở đây là câu trả lời kể lại, kết bằng dấu chấm). Còn lại: câu hỏi x.2 chung một lời `Is this your view, worthy Gotama?”`; x.4 dựng từ phần trong nháy của `x.1` (`‘<view>. This is the only truth, anything else is futile.’”`); 13.(3n+1), 13.(3n+2), 13.(3n+3) dựng theo đúng chỗ Pāli ngắt giữa chừng câu.

  Nhóm B (khoá ← khoá nguồn gần nhất, tỉ lệ khớp Pāli): 3.4 ← 3.1 (0.67); 4.4 ← 4.1 (0.71); 5.4 ← 5.1 (0.67); 6.4 ← 6.1 (0.71); 7.4 ← 7.1 (0.74); 8.4 ← 8.1 (0.78); 9.4 ← 9.1 (0.74); 10.4 ← 10.1 (0.8); 11.4 ← 11.1 (0.81); 12.4 ← 12.1 (0.85); 13.2 ← 3.3 (0.62); 13.3 ← 3.1 (0.62); 13.5 ← 3.3 (0.62); 13.6 ← 4.1 (0.67); 13.8 ← 3.3 (0.62); 13.9 ← 5.1 (0.62); 13.11 ← 3.3 (0.62); 13.12 ← 6.1 (0.67); 13.14 ← 3.3 (0.62); 13.15 ← 7.1 (0.7); 13.17 ← 3.3 (0.62); 13.18 ← 8.1 (0.74); 13.20 ← 3.3 (0.62); 13.21 ← 9.1 (0.7); 13.23 ← 3.3 (0.62); 13.24 ← 10.1 (0.76); 13.26 ← 3.3 (0.62); 13.27 ← 11.1 (0.79); 13.29 ← 3.3 (0.62); 13.30 ← 12.1 (0.81); 14.10 ← 14.1 (0.84); 17.2 ← 17.1 (0.73); 17.3 ← 17.1 (0.62); 17.4 ← 17.1 (0.62); 20.6 ← 20.2 (0.86); 20.10 ← 20.2 (0.86); 20.14 ← 20.2 (0.86). Phần tầng ghim nuốt mà lớp lấp chèn lại: phần đuôi `evaṁdiṭṭhi bhavaṁ gotamo`, phần đáp `‘<view> …’ti vadesi`, mười đề mục của 14 (chỉ nêu thesis rồi `…`, đúng như Pāli `…pe…`), vế `vimutto … gambhīro appameyyo duppariyogāḷho` của 20.6/20.10/20.14 (đổi `form` thành `feeling`/`perception`/`choices` từ 20.2).

  Nhóm D: không có.

  Chỗ cố ý lệch, kèm lý do: (1) 20.8, 20.12, 20.16: Pāli không có dấu nháy nhưng khoá anh em 20.4/20.20 đã ghim có bốn cặp ‘…’; chép nguyên theo khoá anh em: Pāli 0 dấu, English 8 dấu mỗi khoá; ngoại lệ có đo. (2) Trong 13.x, dấu nháy theo Pāli từng khoá (mở ở một khoá và đóng ở khoá sau, 13.2, 13.5 … đóng `’` rồi mở `‘`), nên các khoá 13.3, 13.6 … kết bằng `’—that’s what you say.` mà không có dấu mở: đó là hệ quả của việc khớp Pāli từng khoá, không phải lỗi gõ. (3) 14.10: `diṭṭhigata` dịch `conviction`, theo cách Sujato dùng ở 14.1 (`these ten convictions`); các thành phần `thicket of views … fetter of views` lấy nguyên từ 14.1. (4) 17.2–17.4: Pāli lồng `‘…’ti iti puṭṭho samāno ‘…’ti vadesi`; dịch thành `‘Well then, are they not reborn?’ When asked this, you say: ‘That they’re not reborn doesn’t apply, Vaccha.’`, không thêm cặp nháy phụ. (5) `Worthy Gotama` hoa chữ đầu khi đứng đầu câu, `worthy Gotama` khi giữa câu, theo Sujato (13.1 so với 19.4).

  Quan sát tầng ghim (ngoài lát, không sửa): Sujato tự thêm `…` ở 3 khoá mà Pāli viết đủ (20.5, 20.9, 20.13); lớp lấp không sao chép.

  Nháy: đo từng khoá, khớp Pāli ở mọi khoá trừ 20.8, 20.12, 20.16 (ngoại lệ trên).

