notes: |-
  **Bốn số (đo bằng máy, ngưỡng 0,80, có xét ghép hai khoá): A = 9 · B = 17 · C = 9 · D = 0.** Ghi 35/35 khoá.

  **Khối `4.3`–`4.16` (14 khoá) — người cha kể lại cho bọn cờ bạc.** Tầng đã ghim tóm cả khối thành một câu ở `4.2`
  (“That householder approached them and told them what had happened.”) rồi để trống. Pāli kể lại **nguyên văn**
  cuộc đối thoại `3.1`–`3.13`, chỉ đổi ngôi và chèn hô ngữ `bhonto`. Vì vậy: `4.8` A ← `3.5`; B (1,00) `4.4` ← `3.2`,
  `4.6` ← `3.3`, `4.9` ← `3.6`, `4.10` ← `2.4`, `4.11` ← `3.8`, `4.12` ← `3.9`, `4.13` ← `3.10`, `4.15` ← `3.12`;
  `4.7` ← `3.4` (0,98, `ekaputtako` thay `ekaputto`, cùng nghĩa); `4.14` ← `5.4` (0,98). Chỉ đổi dấu ngoặc theo Pāli
  (lời dẫn lồng ⇒ `‘ ’`). C: `4.3`, `4.5`, `4.16` là khung kể mới (“Gentlemen, I went to the ascetic Gotama …”,
  “When he said this, gentlemen, I said …”, “And so, gentlemen, disagreeing …”), dựng theo lời `3.1`/`3.13`.
  Hệ quả biết trước: người đọc thấy câu tóm “told them what had happened” **rồi** lời kể đầy đủ — trùng ý, nhưng
  lời kể là Pāli có thật.

  **`3.11` (B ← `5.4`, 1,00).** Câu trích `‘piyajātikā …’ti?` dùng nguyên lời `5.4`; giữ `?` của Pāli dù lời đã ghim
  `3.10` kết bằng `!`. `4.14` cùng lời nhưng không nháy (Pāli `4.14` không nháy).

  **`5.9`–`5.11`, `6.3`.** `5.11` A ← `5.7`. `5.10` B ← `5.6` (0,91). `5.9` C: “‘That’s so true, tutor! …’” — giữ
  “tutor” theo lời `5.8` cho `ācariya`. `6.3` B ← `6.11` (0,88), đổi ngôi xưng cho lời hoàng hậu nhắn.

  **`15-21.3`–`.5`:** A ← `15-21.12`, `8.4`, `15-21.1`. **`22.5`–`22.6`** C: lời người vợ (`ayyaputta` → “My lord”).
  **`25.3`–`25.7`, `26.2`–`26.6`:** tầng đã ghim chỉ dịch câu hỏi (`25.2` “Do you love Queen Vāsabhā? …”, `26.1`) rồi
  bỏ trống; dựng theo khối `24.x`/`27.x` đã ghim: `25.4`/`26.3` ← `27.3`+`27.4` (0,91/0,89), `25.5` ← `24.6` (0,92),
  `26.4` ← `27.5` (0,90), `25.6`/`25.7`/`26.5`/`26.6` A; `25.3`/`26.2` C theo lời `24.3`/`27.2` (“Indeed I do, Mallikā.”). Tên `viṭaṭūbha` viết theo dạng tầng đã ghim dùng ở `26.1`
  (“Viḍūḍabha”). `29.8` colophon “Born From the Beloved is finished—the seventh.”

