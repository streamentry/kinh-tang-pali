notes: |-
  Bối cảnh phải nói trước cho người đọc: bản Anh đã ghim ở `1.3` đã GỘP cả năm vế vào một câu
  ("It's when a mendicant is personally accomplished in ethics, immersion, wisdom, freedom, and the
  knowledge and vision of freedom. And they encourage others in these qualities."), nên `1.4`–`1.6` của
  tôi lặp lại bốn vế. Không thể rút gọn: Pāli `1.4`–`1.6` không có `…pe…`, và mỗi khoá phải đứng được
  riêng. Đây là hệ quả của cách bản đã ghim xử lý `1.3`, không phải lỗi lặp.

  Từ vựng lấy từ `1.3` (đã ghim): ethics / immersion / wisdom / freedom / "the knowledge and vision of
  freedom", và `parañca … samādapeti` = "encourage others in …". Lớp Việt `an5.20:1.4`–`1.6` (dự án) dùng
  đúng cấu trúc "tự mình viên mãn … và khuyến tấn người khác đạt đến sự viên mãn …" cho từng vế, nên
  "encourages others in" là tương đương chứ không phải lược.

  Ba khoá bắt đầu bằng chữ thường vì chúng tiếp nối vế `attanā ca …` đã nằm ở `1.3`; đây là cách nối
  câu theo Pāli, không phải lỗi chính tả.

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
