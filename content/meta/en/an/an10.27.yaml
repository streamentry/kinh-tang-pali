notes: |-
  **Phân loại 55 khoá (đo bằng máy; ngưỡng B = độ tương đồng Pāli ≥ 0,60 với một khoá đã có lời): A dùng lại nguyên văn = 0 · B dựng lại = 53 · C tự dịch = 2 · D Pāli trùng nhưng lời tầng khác nhau = 0.** Đã ghi 55/55 khoá `fillableSegments` (trong đó 45 khoá có nội dung ≥ 40 ký tự Pāli; 10 khoá còn lại dưới ngưỡng, không vào coverage). Số khoá trống còn lại của bài: 0 (mọi khoá tầng đã ghim để trống đều đã lấp). Pāli chứa 1 dấu lược (`…pe…` hoặc `…` = đúng một `…` mỗi nơi), bản lấp giữ đúng 1; 22 khoá có nháy trong Pāli. Trong bài có 4 nhóm Pāli trùng nguyên văn (14 khoá).

  **Cấu trúc.** Bài lặp công thức “Hai/ba/…/chín câu hỏi, lời tóm lược, lời giải đáp” cho tám con số (`11`–`18`); Sujato chỉ dịch trọn hai vòng (`10` “one thing” và `19` “ten things”) và nén các vòng giữa thành dấu lược. Khoá có Pāli giống nhất (0,98–0,99 trong `19.3`/`19.6`) mang chữ “ten”, nên lớp lấp lấy khung `19.3`/`19.6` và **đổi số đếm theo Pāli** (`dvīsu` two … `navasu` nine); `10.3`/`10.6` xác nhận cách dịch “one thing … its limits”.

  **B — vòng `11`–`18` (mỗi vòng 5 khoá `x.1`, `x.2`, `x.3`, `x.6`, `x.7`):** `x.1` ‘N things: question, summary recital, and answer.’ That’s what I said. (nguồn `10.1`/`19.1`, 0,58–0,66); `x.2` “But why did I say it?” (← `10.2`, 0,67); `x.3`/`x.6` ← `19.3`/`19.6` (0,98–0,99); `x.7` ← `10.7`+`10.8` (0,49–0,66). `x.1` của vòng `13` rơi dưới 0,6 nhưng cùng khuôn, tính là B. `17.6` có một chỗ lược (`…pe…`), lớp lấp giữ một `…` (“Regarding these eight things, a mendicant, becoming completely disillusioned … makes an end of suffering in this very life.”).

  **B — lượt báo của các tỳ-kheo (`6.1`–`8.3`)**, dựng lại từ `1.2`–`1.5`, `2.1`, `2.2`, `3.1`–`3.5`, `4.1`–`4.3` (0,81–0,99), đổi ngôi “they” của Sujato thành “we” vì Pāli là lời tỳ-kheo kể lại (`mayaṁ`, `amhe`, `bhante`).

  **C — 2 khoá:** `6.2` (“Then, sir, it occurred to us,” theo `1.3`) và nhãn `19.9` “Seventh.” (Pāli `Sattamaṁ`; số Pāli, chưa đối chiếu với thứ tự trong phẩm). D = 0.

  **Nháy:** 22 khoá có nháy trong Pāli, khớp từng khoá. `7.2` và `7.4` thiếu nháy đóng trong Pāli (`viharathāti`), nên bản lấp không có nháy dù `3.2`/`3.4` đã ghim có; `7.2` “Meditate …” và `7.4` “Live …” theo đúng lời `3.2` và `3.4` (tầng đã ghim tự dịch `viharatha` hai cách).

  **Lệch tầng đã ghim cần biết:** `11.5`, `12.5`, … đã ghim kết bằng `…` ở nơi Pāli viết `—`; không chạm.

