notes: |-
  Tiền lệ: 1.7 trùng nguyên văn `an5.241:2.7` (đã ghin "When your body breaks up, after
  death, you're reborn in a good place, a heavenly realm."), nên dùng lại nguyên văn. 1.8 trùng
  nguyên văn lớp fill đã publish `an5.248:1.8` ("These, mendicants, are the five benefits of
  good mental conduct.”"), nên dùng lại đúng câu đó.
  Bất định đã ghi nhận từ lớp trước và vẫn còn ở đây: bản Pāli đã ghin ở 1.3–1.6 lệch cản —
  1.3 `Attāpi attānaṁ na upavadati` (lợi) nhưng 1.1 lại mở đầu bằng "ādīnavā manoduccarite"
  (bất lợi), và 1.7 lại là lợi ích (`sugatiṁ saggaṁ lokaṁ`) chứ không phải bất lợi. Bản dịch
  bám theo vế lặp lại ở 1.8 (`pañca ānisaṁsā manosucarite`), vì đó là chỗ Pāli tự xác nhận
  danh sách này là lợi ích. Ghi lại vì một bản hiệu đính Pāli sau này có thể sửa, và khi đó
  bản Anh này phải theo.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
