notes: |-
  Phạm vi: 30 khoá lấp, là toàn bộ khoá Sujato để trống có Pāli (18 khoá có nội dung ≥ 40 ký tự; 12 khoá ngắn hơn: các khoá `…pe…` và nhãn kết bài). Không còn khoá trống nào của bài ngoài danh sách. Bài là chuỗi các lần kể lại (các tỳ-kheo bàn nhau 2–3, thưa Ānanda 5–7, thưa Đức Phật 18–20), mỗi lần Sujato gộp bằng lời gián tiếp (`They told him what had happened, and said,`) nên các khoá tường thuật để trống.

  Bốn nhóm (đo bằng máy, Pāli chuẩn hoá): A=10 · B=7 · C=9 · D=4. Xử lý thực tế: 10 khoá dùng lại nguyên văn Sujato (chỉ đổi loại nháy cho khớp Pāli khoá đích); 20 khoá viết mới hoặc chọn tay.

  Nhóm B (khoá ← khoá nguồn gần nhất, tỉ lệ khớp Pāli): 5.1 ← 2.2 (0.97); 5.2 ← 16.2 (0.6); 6.2 ← 2.2 (0.93); 6.3 ← 16.2 (0.6); 18.1 ← 11.1 (0.96); 18.2 ← 16.2 (0.83); 19.3 ← 16.2 (0.83). Phần tầng ghim nuốt mà lớp lấp chèn lại: 5.1, 6.1, 6.2, 7.1, 18.1, 19.1, 20.1 là các câu dẫn `āvuso`/`bhante` (`Reverend Ānanda, the Buddha gave …`, `Soon after the Buddha left, reverend, we considered,`), dựng từ 2.1 và 2.2; 5.2/5.3, 6.3/6.4, 18.2/18.3, 19.3/19.4 là trích dẫn lời Phật bị rút bằng `…pe…`, dựng từ 16.2 và 16.3 (`You should know bad principles …` · `and practice accordingly.’`).

  Nhóm D (Pāli trùng, lời Sujato khác nhau; không tự hoà): 2.3 (1.1 `“Mendicants, you should know …` so với 11.2 `‘You should know …`) và 2.5 (1.3 kết `”` so với 11.4 kết `’`): lấy 11.2 và 11.4 vì cùng cặp nháy với Pāli `‘…’ti`. 7.3 và 20.3 (3.3 `He is capable of …` so với 9.5 `You are capable of …`): lấy 3.3 vì cùng là lời các tỳ-kheo nghĩ trước khi đến gặp Ānanda (nói về ngài ở ngôi thứ ba); 9.5 là lời nói trực tiếp với Ānanda.

  Chỗ cố ý lệch, kèm lý do: (1) 6.3 và 19.3 (Pāli `adhammo ca … veditabbo …pe…`, không có dấu nháy) viết bằng chữ thường `you should know bad principles …` vì khoá liền trước kết bằng dấu gạch; hô ngữ `bhikkhave` không dịch, giống cách Sujato rút lời Phật ở 11.2 và 16.2. (2) 19.2 chép nguyên 2.2 nên kết bằng dấu chấm trong khi Pāli kết bằng dấu gạch: theo luật A. (3) 6.5 và 19.5 chép 2.6, chỉ đổi nháy ” thành ’ cho khớp Pāli.

  Nháy: đo từng khoá, khớp Pāli ở mọi khoá.

  Coverage (≥ 40 ký tự, bỏ khối `:0`): trước 42/60 = 0.7000; sau (khi `published`) 60/60 = 1.0000. Độ nhạy: có thể thiếu tối đa 12 khoá có nội dung mà vẫn ≥ 0,80. Bài hiện có record trong `content/meta/reference-gaps.yaml` (substantiveWithoutEnglish 18, coverage 0.7000); record thành thừa sau khi `published`, để người điều phối chạy lại `npm run reference:gaps`. Số khoá trống còn lại sau lớp lấp: 0. Scorecard Việt của bài hiện ghi nợ chính khoảng trống này; không sửa tầng Việt.

  Triangulation 8.0: `content/meta/sutta/an/an10.115.yaml` (bản Việt) ghi cùng họ công cụ với lớp lấp này (khai trong `reviewers`/`quality.assessed_by`, đối chiếu `source/tooling.yaml`), nên bản lấp KHÔNG phải cách đọc English độc lập, và scorecard tiếng Việt của bài này không được tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu có thật: Pāli root + Sujato đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Không chạm tầng Việt.

