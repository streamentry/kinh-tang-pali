notes: >-
  2.4 đã có chữ Sujato cho đúng vế này; 3.2 là lần Ānanda lặp lại trong câu hỏi.
  Giữ nguyên bốn cụm khoá ("freedom of heart", "freedom by wisdom", ba thành phần
  của `ahaṅkāramamaṅkāramānusayā`). Một chi tiết: bản đã ghim 2.4 dịch
  `ahaṅkāramamaṅkāramāna` thành ba mục rồi bỏ `-anusayā`; bản này giữ đủ ba
  ("I-making, mine-making, and the underlying tendency to conceit") vì Pāli có đủ
  ba và vì bỏ đi sẽ mất nghĩa kỹ thuật của `anusayā`.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
