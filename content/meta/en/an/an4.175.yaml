notes: |-
  Tiền lệ: `4.1`, `6.1`, `8.1` (đã ghim) đã dịch sẵn ba câu hỏi mà `10.3`, `10.5`, `10.7` dựa
  lại; `10.1` (đã ghim) cho khuôn mở đầu "Reverend Sāriputta, when asked whether …,". Vì ba khoá của
  tôi chỉ hỏi từng vế một (`caraṇenantakaro`, `vijjācaraṇenantakaro`, `aññatra vijjācaraṇenantakaro`) nên
  tôi dùng đúng ba câu hỏi đó, không gộp thành một như `10.1`.

  Đối chiếu chéo để chắc nghĩa: `11.1`–`11.5` (đã ghim) lặp lại từng vế và giải thích — `vijjā` =
  "because of knowledge", `caraṇa` = "because of conduct", `vijjācaraṇa` = "because of both knowledge
  and conduct", `aññatra vijjācaraṇa` = "for some reason other than knowledge and conduct". Nghĩa tôi
  dịch ở `10.3`, `10.5`, `10.7` khớp với cả bốn câu giải thích đó, nên `vijjācaraṇenantakaro` ở `10.5`
  chắc chắn là "cả hai" chứ không phải "một trong hai".

  Bất định đã biết: `10.4`, `10.6`, `10.8` (`‘no hidaṁ, āvuso’ti vadesi.`) trống ở bản Anh đã ghim và
  ngoài lát này, nên ba khoá của tôi kết bằng dấu phẩy và câu trả lời "that's not it" vắng mặt ở cột
  Anh. Đây là lỗ hổng của bản chụp, không phải của lớp lấp.

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
