notes: |-
  Tiền lệ: 21.9 (cùng nguyên văn, chỉ khác `”ti` ở cuối) đã ghin "The spiritual life is
  lived under the Buddha to know, see, attain, realize, and comprehend this.”" và 21.1 đã
  ghim cùng khung với "that which is unknown, unseen, unattained, unrealized, and
  uncomprehended". 21.4 và 21.7 trùng NGUYÊN VĂN NHAU và trùng 21.9, nên dùng lại nguyên văn;
  hai khoá này bỏ dấu `”` vì Pāli không có.
  Bất định nhỏ: `tassa` ở 21.4/21.7 trỏ về "điều vừa nói" (lần lượt là "This is suffering" và
  "This is the practice that leads to the cessation of suffering"), bản đã ghin ở 21.9 dùng
  "this"; giữ "this" cho cả ba để bài không tự mâu thuẫn.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
