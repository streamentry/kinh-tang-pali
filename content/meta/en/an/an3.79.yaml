notes: |-
  Hai khối `5.2`–`5.4` và `6.2`–`6.4` là CÙNG một danh sách được lặp lại, và cả hai đều chép lại các
  khoá đã có chữ ở `4.1`–`4.3`:

  - `5.2` lấy đúng vế của `4.1` ("in some village or town, a woman or man has gone for refuge to the
  Buddha, the teaching, and the Saṅgha"), bỏ tiền tố "It’s when, Ānanda," vì Pāli ở `5.2` không có nó.
  - `5.3`, `6.3` lấy nguyên văn `4.2`; `5.4`, `6.4` lấy nguyên văn `4.3`.
  - Dấu nháy: `4.1` mở bằng `"` vì đó là lời Đức Thế Tôn nói trực tiếp; `5.2` và `6.2` mở bằng `'` vì Pāli
  đặt sau `vaṇṇaṁ bhāsanti:` (samaṇabrāhmaṇā và devatā đang ca ngợi, tức lời tường thuật). `5.4`/`6.4`
  đóng bằng `'` ứng với `’ti` của Pāli.

  `6.3` là khoá DUY NHẤT trong cả lát e5 có `…pe…`. Pāli lược mất `adinnādānā … musāvādā`, nên tôi giữ
  đúng một dấu `…` ("They don’t kill living creatures … or consume intoxicants of beer, wine, and liquor.")
  chứ không mở rộng thành liệt kê.

  Ba khoá `5.2`/`5.3`/`5.4` tôi viết thành ba câu độc lập, đúng như bản đã ghim đã làm ở `4.1`–`4.3`: bản đã
  ghim đổi dấu phẩy cuối Pāli thành dấu chấm và viết hoa đầu câu kế. Lớp lấp bám theo đó, vì lớp lấp nhiệm
  vụ HOÀN TẤT cột ấy chứ không phán xét lại lựa chọn dấu câu của người dịch khác.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm, nên đây KHÔNG phải một lớp đọc Anh độc lập. Tầng đối chiếu là Pāli đã ghim, các khoá còn lại của chính bản Anh đã ghim, và bản Việt dự án (do agent khác viết) chỉ để đối chiếu nghĩa.

  Lớp lấp: 6 khoá, tất cả đều nằm ở chỗ bản Anh đã ghim để trống. Không khoá nào là blockquote tham chiếu và không khoá nào có Pāli rỗng.

  Bài này còn 1 khoá mà bản Anh đã ghim để trống và lát này KHÔNG lấp, vì Pāli của chúng dưới 40 ký tự nên nằm ngoài ngưỡng đo coverage: `7.5`. Phần lớn là đuôi đoạn lược (`…pe…`, `Navamaṁ.`, `parinibbāyati.`) và bài thơ `udāna` cuối bài. Người đọc bốn cột VẪN thấy các ô này trống, và đó là đúng: một ô tham chiếu trống là lỗ hổng của bản dịch đó, khác với bản vắng mặt cả bài.

  Lớp lấp làm coverage English của bài này lên 100% (từ 11/17 = 0.6471). Bản ghi của nó trong `content/meta/reference-gaps.yaml` sẽ thành record thừa và test `a fill never leaves a gap record it has cured` sẽ đỏ cho tới khi chạy `npm run reference:gaps`. Tôi không sửa tệp đó và không chạy lệnh đó; việc đó nằm ngoài lát này.
