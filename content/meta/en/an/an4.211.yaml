notes: |-
    Đây là lát khó nhất của lát e6, và lý do là bản đã ghim đã nén mất đúng cái phần
    cần để dịch.

    Vấn đề: 1.3 của Sujato là "A monk, nun, layman, or laywoman who is unethical, of
    bad character." — tức đã gộp CẢ 1.3+1.4+1.5+1.6 vào một khoá. Nhưng Pāli chia
    thành bốn vế có dấu chấm phẩy, mỗi vệ một tông đồ, và 1.7 đếm "cattāro". Nếu tôi
    chép y 1.3 thì 1.4/1.5/1.6 sẽ phải là ba bản sao tiếng Anh của 1.3, cột Anh của bài
    sẽ lặp bốn lần cùng một câu, và bốn vế có dấu phẩy sẽ biến thành ba câu rời rạc
    không nối vào 1.7. Vì vậy tôi TÁCH bốn vế, mượn đúng hai cụm danh tính của 1.3
    ("unethical, of bad character") và hai động từ đã ghim ở 1.7 và 2.7 ("corrupts an
    assembly" / "grace an assembly"). 2.4–2.6 làm y vậy với "ethical, of good character"
    của 2.3.

    Đây là quyết định cấu trúc câu của lớp lấp, không phải hệ quả cơ học, nên
    grammar_logic hạ 9.1 và ambiguity_integrity hạ 9.0. Đọc 1.4–1.6 không có nghĩa độc
    lập: nó là phần còn lại của một danh sách bốn, và đó là cách Pāli dựng nó.

    Vế đầu mỗi câu hạ ngữ ("a nun, mendicants, who is unethical, of bad character,
    corrupts an assembly") là dựng mới: không có tiền lệ byte-trùng trong toàn bộ bản
    đã ghim cho `bhikkhunī / upāsako / upāsikā` đứng đầu. "nun / layman / laywoman" thì
    có: 1.3 đã dùng đúng ba từ đó.

    Lớp lấp: 6 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị
    mất. Triangulation 8.0: người viết lớp lấp cũng là người chấm, nên đây không phải
    một cách đọc Anh độc lập.
