notes: |-
  3.3/3.4/3.5/3.6 Sujato dịch Pāli gần đồng chữ với 4.5/4.6/4.7/4.8 (khác chủ ngữ:
    3.x “they” chung, 4.x “Āyasmā ānando”). Giữ nguyên bộ từ Sujato (“teach others
    in detail”, “make them recite in detail”, “rehearse … in detail”, “think about
    and consider the teaching in the heart, examining it with the mind”, “enter the
    rains retreat …”, “From time to time … go up to those mendicants and ask them
    questions”), đổi they -> Venerable Ānanda / he / himself / his cho hợp chủ ngữ
    tên riêng. 4.8 = 3.6 Pāli đồng chữ -> nguyên văn (“Why, sir, does it say this?
    What does that mean?”), chốt in ra đã xác nhận.

    BẤT ĐỊNH: đổi đại từ theo chủ ngữ tên riêng là điều chỉnh của dự án;
    mn146:5.4 xác nhận độc lập mẫu câu hỏi (“Why, sir, does it say this?”) —
    terminology 9.3, ambiguity_integrity 9.3.

    rven88.py cờ “time … time” ở 4.7 (“From time to time”): HỢP LỆ, cụm cố định
    của Sujato ở 3.5.

    Lớp lấp: 4 khoá nằm ở phần bản đã ghim đã lược. Triangulation 8.0: không có
    bản Anh độc lập phủ.
