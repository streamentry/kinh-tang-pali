notes: |-
  Tiền lệ: cùng công thức `sammato na pesetabbo / bālo veditabbo / khataṁspathataṁ attānaṁ
  pariharati / yathābhataṁ nikkhitto evaṁ niraye…sagge` đã được Sujato dịch trọn ở
  `an5.272:3.1` (cùng vagga 27 Sammutipeyyāla): "should not be called upon … should be called
  upon … should be known as a fool … should be known as astute … they keep themselves broken
  and damaged … they keep themselves unbroken and undamaged … is placed in hell as if
  delivered there … is placed in heaven as if delivered there." Giữ nguyên bộ từ ấy. 14.4 của
  chính bài này cũng đã ghim vế cuối "is placed in heaven as if delivered there.”".
  Bất định: `veditabbo` ở đây được Sujato dịch "should be known as", còn `jānāti` ở 14.3 được
  dịch "they know if a novice has been supervised or not" — hai động từ cùng gốc nhưng khác
  sắc thái; bản dịch bám theo bản đã ghin vì cùng công thức, và ghi lại vì đó là điểm dễ bị
  hiểu là "bị loại". Số dấu lược 5 ở 14.1 và 2 ở 13.2 giữ nguyên theo Pāli.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
