notes: |-
  `2.12`, `2.15`, `2.16`, `2.18` là bản sao nguyên văn của `2.3`, `2.6`, `2.7`, `2.9`: Pāli giống
  hệt từng chữ, và cả bốn nằm trong lần lặp thứ hai (cho tỳ-kheo trưởng) của một danh sách ba so sánh.

  `1.2` và `1.3` là chỗ phải tự quyết, và tôi đã CỐ Ý lệch với bản đã ghim — cần nói rõ:

  - Pāli là `majjhimopi, bhikkhave, potthako dubbaṇṇo ca hoti dukkhasamphasso ca appaggho ca;` và
  `jiṇṇopi, …` — mỗi vế là MỘT mệnh đề đầy đủ, chỉ khác chủ từ chỉ tuổi, với `pi` mang nghĩa "dù".
  - Nhưng bản đã ghim đã GỘP cả ba vế vào `1.1`: "Jute canvas is ugly, unpleasant to touch, and worthless
  whether it’s new, worn in, or worn out." Tức là `1.1` đã nói trọn, và `1.2`/`1.3` thành lặp.
  - Tôi vẫn dịch đủ hai vế, vì bỏ vế thì hai khoá thành orphan, còn thêm dấu lược vào là bịa `…pe…` mà Pāli
  không mang. Vị ngữ thì chép y nguyên của `1.1`: "ugly, unpleasant to touch, and worthless".
  - `majjhimo` tôi dịch "half-worn", KHÔNG dịch "worn in" như `1.1` đã dùng. Lý do đếm được: trong toàn bộ
  tầng `translation/en/sujato/`, "worn in" xuất hiện đúng HAI lần và cả hai đều là `1.1`/`4.1` của chính bài
  này; "middle-aged" xuất hiện hai lần nhưng đều nói về người, không nói về vải. "Worn in" là cụm động từ
  trong tiếng Anh, đứng trước danh từ thì đọc thành động từ ("a canvas that is worn in"), nên tôi chọn
  "half-worn". Đây là chỗ hạ `terminology` và `ambiguity_integrity`: hai từ này không còn trùng khớp y hệt
  với từ `1.1` đã ghim.
  - Hệ quả trung thực: người đọc bốn cột sẽ thấy `1.1` đã liệt kê cả ba rồi `1.2`/`1.3` lặp lại từng vế.
  Đó là hệ quả của việc bản đã ghim gộp, không phải lỗi dịch.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm, nên đây KHÔNG phải một lớp đọc Anh độc lập. Tầng đối chiếu là Pāli đã ghim, các khoá còn lại của chính bản Anh đã ghim, và bản Việt dự án (do agent khác viết) chỉ để đối chiếu nghĩa.

  Lớp lấp: 6 khoá, tất cả đều nằm ở chỗ bản Anh đã ghim để trống. Không khoá nào là blockquote tham chiếu và không khoá nào có Pāli rỗng.

  Bài này còn 3 khoá mà bản Anh đã ghim để trống và lát này KHÔNG lấp, vì Pāli của chúng dưới 40 ký tự nên nằm ngoài ngưỡng đo coverage: `2.14`, `2.17`, `6.7`. Phần lớn là đuôi đoạn lược (`…pe…`, `Navamaṁ.`, `parinibbāyati.`) và bài thơ `udāna` cuối bài. Người đọc bốn cột VẪN thấy các ô này trống, và đó là đúng: một ô tham chiếu trống là lỗ hổng của bản dịch đó, khác với bản vắng mặt cả bài.

  Lớp lấp làm coverage English của bài này lên 100%. Trước lát này nó đã là 28/34 = 0.8235, tức đã trên ngưỡng 0.8, nên bài KHÔNG có record trong `content/meta/reference-gaps.yaml` và không sinh record thừa nào.
