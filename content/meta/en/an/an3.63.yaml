notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI, KHÔNG PHẢI VÀI KHOÁ, VÀ ĐÂY KHÔNG PHẢI BLOCKER:
  bài này CÓ bản Anh đã ghim ở commit đã ghim, nhưng các khoá tôi điền đều là đúng
  những khoá mà bản ghim ĐỂ TRỐNG — tức bản thân những khoá này không có bản Anh độc
  lập nào để đối chiếu. Vì vậy `triangulation` vẫn ở 8.0, và lý do là giới hạn thiết kế
  của lớp lấp chứ không phải thiếu sót của bài. Tôi ghi rõ điều này vì bốn lời tuyên bố
  đã từng lệch nhau trong dự án, và một lời tuyên bố sai về tầng nguồn tệ hơn im lặng.

  LUẬT 3 TỰ GIỮ (máy KHÔNG bắt được ở lát này): `save_fill` chỉ cảnh báo "Pāli trùng"
  khi Pāli trùng ở khoá khác ĐÃ CÓ bản Anh đã ghim; 12/15 bài của lát không có bản ghim
  nào nên nó im lặng hoàn toàn. Tôi tự đếm bằng `_dup_re1.py` (so Pāli của 15 bài này
  với nhau và với CẢ tầng `english-project`): 78 cặp trùng trong lát. 77 cặp dùng MỘT
  lời duy nhất; 36 cặp còn lại là nhãn `Jātaka` ở 0.1 của chín bài, khác nhau ĐÚNG ở
  số bài — đó là dữ liệu, không phải khác biệt cách dịch, và cùng khuôn với 27 tệp `ja`
  đã commit trong tầng.

  PHẠM VI: `sutta/an/an3/an3.63_translation-en-sujato.json`, 79 khoá / 73 khoá có chữ; năm
  khoá tôi điền (3.4, 3.6, 4.2, 10.7, 10.8) đều là khoá bản ghim ĐỂ TRỐNG. Đây là tình huống
  thuận lợi nhất của lát, và năm khoá này là năm khoá DUY NHẤT có bản Anh đã ghim ở ngay bên
  cạnh để đối chiếu.

  LUẬT 3, BA NƠI, VÀ HARNESS ĐÃ TỰ BÁO:
  - 3.4 và 3.6 có PāLI Y HỆT 3.8 (mà 3.8 ĐÃ CÓ bản ghim). `save_fill` in cảnh báo "Pāli trùng
    3.8" cho cả hai khoá, và tôi dùng lại NGUYÊN VĂN lời của 3.8: "In the same way, your
    faculties are so very clear, and the complexion of your skin is pure and bright." Đây
    chính là luật của `sn11.24`.
  - 4.2 lặp lại danh sách nện của 3.10 với tiền tố Pāli giống hệt 120 ký tự, nên tôi dùng
    lại đúng bộ từ Sujato đã dùng. Pāli 4.2 có 0 ngoặc mở / 0 ngoặc đóng (câu ngoặc của cả
    đoạn mở ở 4.1 và đóng ở 5.1), nên tôi KHÔNG thêm ngoặc kép nào ở 4.2.
  - 10.7 và 10.8 lặp đúng công thức của 10.6 (đã ghim) với `doso`/`moho` thay cho `rāgo`.

  VẤN ĐỀ BIÊN TẬP PHẢI BIẾT, TÔI KHÔNG GIẤU: bản ghim 10.6 dịch CẢ BA vế `rāgo … doso …
  moho me pahīno` thành MỘT câu ("I’ve given up greed, hate, and delusion…"), rồi để trống
  10.7 và 10.8. Như vậy bản ghim vỡ căn đối chiếu ở đúng ba khoá này. Tôi dịch 10.7 và 10.8
  theo Pāli, MỘT vế một khoá, nên người đọc sẽ thấy câu 10.6 của bản ghim rồi tới hai câu
  nữa cùng công thức — đó là hệ quả trung thực của việc lấp chỗ trống, và tôi ghi ra đây thay
  vì im lặng. Tôi KHÔNG sửa 10.6 vì luật 1 chặn ghi đè bản ghim.

  MỘT CHỖ TÔI CỐ Ý KHÔNG SAO CHÉP LỖI CHÍNH TẢ: bản ghim 3.10 ghi "wollen carpets" (thiếu
  một o). Tôi viết "woollen". Sao chép cả lỗi chính tả để giữ "một lời" thì sai — luật một-lời
  nhằm chống bài kinh TỰ MÂU THUẪN, mà lỗi chính tả không gây mâu thuẫn. Người biên tập nên sửa
  3.10 (khoá đã ghim, chỉ người điều phối mới sửa được) để hai khoá khớp tuyệt đối.
  Số từ cũng vậy: bản ghim dùng "them" (số nhiều, vì gộp ba vế); Pāli mỗi khoá một vẻ nên tôi
  dùng "it". Giữ nguyên chuỗi từ vựng — "given up … cut off at the root … made … like a palm
  stump … obliterated … unable to arise in the future" — vì đó là phần mang nghĩa.

  QUÉT: `rven88.py` không báo cờ nào cho an3.63.

  CỔNG KỸ THUẬT: `save_fill` PASS (khẳng định cả 5 luật cơ học cho từng khoá: chỉ
  điền khoá Pāli có chữ và bản ghim để trống; số dấu lược/ngoặc mở/ngoặc đóng/dấu hỏi
  khớp Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không
  khoảng trắng đôi) và `rven88.py` quét xong (xem mục QUÉT). CHƯA chạy — `npm run
  validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm chạy vì
  chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity` chấm
  9.8 chứ không 10.0, và đây là việc NGƯỜI ĐIỀU PHỐI phải chạy lại trước khi coi bài là
  xuất bản — ghi thẳng ra đây thay vì để trong im lặng.
