notes: |-
  Tiền lệ: 2.1 của chính bài đã ghin "all those who have not declined in skillful qualities
  do so because of these six qualities", và đã gộp cả ba thời (quá khứ, tương lai, hiện tại)
  vào một khoá. 2.2 và 2.3 tách lại theo đúng Pāli: `anāgatamaddhānaṁ` và `etarahi`, nên bản
  dịch dùng lại nguyên văn "will do so because of these six qualities" / "do so because of
  these six qualities". 2.3 mang `”ti` nên đóng ngoặc kép.
  Bất định nhỏ: `chahi` ở 1.3 và `sabbe imeheva chahi dhammā` ở 2.3 — bản đã ghin dùng "these
  six qualities" (không "same"), bản dịch giữ nguyên vì cùng cụm `imeheva chahi dhammehi`.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
