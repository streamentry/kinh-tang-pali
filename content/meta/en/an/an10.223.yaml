notes: |-
  **Phân loại 18 khoá (đo bằng máy, mỗi khoá một nhóm): A y nguyên = 0 · B dựng lại = 16 · C tự dịch = 2 · D (Pāli trùng, lời Anh của tầng đã ghim khác nhau) = 0.** Đã ghi 18/18 khoá `fillableSegments` của bài (18 khoá có nội dung ≥ 40 ký tự Pāli, 0 khoá ngắn hơn ngưỡng). Số khoá Sujato để trống mà lát **không** lấp: 0.

  **Tầng đã ghim gộp cả mười mục của hai danh sách vào một khoá.** `1.3` (Pāli: chỉ mục sát sinh) được Sujato dịch thành
  “They kill living creatures, steal, and commit sexual misconduct. They use speech that’s false, backbiting, harsh, or
  nonsensical. They’re covetous, malicious, with wrong view. They encourage others to do these things. And they approve of these
  things.” — tức **tóm cả mười mục × ba cách (tự làm / khuyến khích / tán đồng)** vào một khoá, rồi để chín khoá `1.4`–`1.12` trống;
  tương tự `2.3` → `2.4`–`2.12`. Đây không phải gộp hai khoá liền nhau mà là tóm một danh sách (đo: không khoá nào trong lát có Pāli
  trùng nguyên văn với một khoá khác, A = 0).
  **Cách dịch.** Máy xếp 16/18 khoá vào nhóm B vì Pāli giống `1.3`/`2.3` ở mức 0,70–0,84 (cùng khung `attanā ca … hoti, parañca …
  samādapeti, … ca samanuñño hoti`); thực chất không khoá nào được dựng lại từ lời Sujato vì lời của `1.3`/`2.3` là bản tóm nhiều mục. Vì thế
  cả 18 khoá được **dịch từ Pāli theo khung ba vế** và chữ của chính `1.3`/`2.3`: “encourage others to …” (`samādapeti`),
  “approve of …” (`samanuñño hoti`), “covetous” (`abhijjhālu`), “malicious” (`byāpannacitta`), “wrong view / right view”, “contented”
  (`anabhijjhālu`, theo `2.3`: “contented, kind-hearted, with right view”), “kind-hearted” (`abyāpannacitta`). Hai khoá `2.11`, `2.12` được dịch
  theo khuôn `1.11`, `1.12` đối nghĩa. Các mục trong nhóm “đức” dùng “abstain from” (`paṭivirato`, `veramaṇiyā`) thay cho “don’t” của `2.3`
  để giữ phân biệt `paṭivirato` / `veramaṇī` mà lời “don’t” của tầng đã ghim che mất.
  Dấu `—` ở cuối `1.12` và `2.12` giữ theo Pāli. Nhãn không có trong lát này.

