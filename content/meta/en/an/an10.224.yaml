notes: |-
  **Phân loại 18 khoá lấp: A = 0 · B = 0 · C = 18 · D = 0.** Bài là danh sách “bốn mươi pháp” = mười nghiệp
  đạo × bốn cách (tự mình làm · khuyến khích người khác · tán đồng · khen ngợi). Pāli viết đủ mười dòng ở mỗi
  vế (`1.3`–`1.12` dẫn xuống địa ngục, `2.3`–`2.12` dẫn lên cõi trời). Tầng đã ghim dồn **cả mười nghiệp đạo
  và cả bốn cách** vào một khoá (`1.3`, `2.3`) dù Pāli của `1.3`/`2.3` chỉ nói về sát sinh, rồi để trống chín
  khoá còn lại mỗi vế. Đây là cơ chế **bỏ dòng song song**: phép đo gộp khoá (≥ 50% thân từ Pāli của khoá
  trống có trong lời khoá trước) không áp dụng được vì lời đã ghim là bản tóm, không phải bản dịch từng dòng.

  **Vì sao C chứ không B:** Pāli mỗi khoá khác khoá đã ghim ở đúng phần nội dung (tên nghiệp đạo), tỉ lệ khớp
  đo trên Pāli đã bỏ dấu chỉ 0,66–0,84. Không khoá nào trùng hay gần trùng nguyên văn một khoá đã có lời. Lớp
  lấp tự dịch từ Pāli, nhưng lấy **từ vựng của chính lời `1.3`/`2.3` đã ghim**: “steal”, “commit sexual
  misconduct”, “false, backbiting, harsh, nonsensical” speech, “covetous”, “malicious”, “wrong view”;
  vế thiện: “contented”, “kind-hearted”, “right view”; và bốn động từ “encourage others”, “approve”,
  “praise”. Khuôn mỗi khoá: *they themselves X, encourage others to/in X, approve of X, and praise X*.
  Pāli `attanā ca` → “they themselves”, để giữ đối lập tự mình / người khác mà bản tóm đã làm phẳng.

  **Chỗ cần nói thẳng:**
  · `abyāpāda` ở `2.11` dịch “good will” (danh từ) trong khi tính từ `abyāpannacitto` theo lời đã ghim là
  “kind-hearted”; Pāli dùng hai dạng khác nhau nên lớp lấp giữ hai chữ khác nhau.
  · `samādapeti` với vị cách (`adinnādāne samādapeti`) dịch “encourage others to steal” cho động từ, “encourage
  others in covetousness” cho danh từ trừu tượng; nghĩa như nhau, chỉ khác cấu trúc tiếng Anh.
  · `2.8` Pāli có thêm `ca` (`veramaṇiyā ca samādapeti`), không đổi nghĩa; lớp lấp không phản ánh.
  · **Hệ quả đọc:** người đọc cột Anh sẽ thấy bản tóm của `1.3`/`2.3` (đã nói hết mười nghiệp đạo) rồi chín dòng
  đầy đủ. Lặp này do tầng đã ghim; lớp lấp không sửa `1.3`/`2.3`.
  · Dấu câu khớp Pāli: chữ thường đầu khoá, `;` cuối khoá, `—` ở `1.12` và `2.12`.

  **Nháy, dấu lược:** Pāli 18 khoá 0 nháy, 0 `…pe…`; lớp lấp 0 nháy, 0 `…`. Bài không có cặp Pāli trùng nguyên
  văn nào dính tới khoá lấp.

  **Coverage và `content/meta/reference-gaps.yaml`:** 24 khoá Pāli có nội dung; trước 6/24 = 0,25; sau khi
  `published` 24/24 = 1,0 (dư 4 khoá so với ngưỡng 0,8 — thiếu 5 khoá là rớt). Bài **có** record trong
  `content/meta/reference-gaps.yaml`; sau khi lớp này `published` record đó thành thừa — để người điều phối
  sinh lại tệp bằng `npm run reference:gaps`, lát này không chạm tệp đó.

  **Triangulation 8,5:** `quality.assessed_by` trong scorecard Việt của `an10.224` thuộc một họ công cụ
  khác với lớp lấp, nên về mặt tác giả đây là lớp đọc Anh riêng; nhưng không có bản Anh thứ hai
  để đối chiếu từng dòng (bản đã ghim chỉ có bản tóm), nên không chấm cao hơn. Đối chiếu có: Pāli root + lời
  Sujato đã ghim (`1.3`, `2.3`, `1.13`, `2.13`) + bản Việt canonical (kiểm nghĩa, không dịch vòng).

  **technical_integrity 9,6:** lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`; bốn lệnh đó còn nợ, nên không tuyên bố technical gate pass.
