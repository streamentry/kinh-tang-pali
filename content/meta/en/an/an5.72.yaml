notes: |-
  **Cơ chế hỏng tầng Anh ở bài này: CẮT CỤT, không phải gộp khoá. Đo cả hai phép, kể cả
  phép ra 0.**

  Phép *gộp khoá*. (a) "dấu lược + khoá kế bị trống": **1 khoá** (`1.6` → `2.1`) — nhưng kiểm
  nội dung thì không phải gộp: lời ghim ở `1.6` kết bằng đúng năm danh xưng mà Pāli `1.6`
  liệt kê, không mang gì thuộc `2.1`. (b) "số yếu tố Pāli ở khoá trống / số yếu tố English ở
  khoá trước": chỉ **một** cặp có mẫu số khác 0, là `1.6` → `2.1` = 3/6 = **0,50**; 15 cặp
  còn lại không đo được vì lời ghim ở khoá trước rỗng. Không cặp nào vượt 1 ⇒ không khoá nào
  nuốt khoá kế. (c) phép cảnh báo "lời ghim chứa ≥ 5 từ Pāli của khoá kế": **0** (đo cho ra,
  không dùng để kết luận).

  Phép *cắt cụt*. Tầng ghim viết trọn `0.1`–`1.6` rồi **im lặng từ `2.1`**: 16 khoá trống
  liên tiếp tính từ cuối tệp, **1.158 / 1.867 ký tự Pāli bị bỏ rơi**, trong đó **1.134** ký tự
  nằm ở các khoá ≥ 40 ký tự, tức là đúng phần đo vào coverage.

  Bằng chứng quyết định cho kết luận trên: toàn bộ phần `2.1`–`6.3` của bài này là **bản lặp
  nguyên văn** của `an5.71:3.1`–`7.3` (bài "(1st)" cùng phẩm Yodhājīvavagga), và tầng Anh đã
  ghim dịch **đủ** ở `an5.71` — đo được: `an5.71` chỉ có **1** khoá trống (`7.4 Paṭhamaṁ.`)
  so với **16** khoá của `an5.72`. Lỗ hổng cấu trúc của tầng ghim thì `an5.71` phải trống ở
  đoạn đó; nó không trống. ⇒ Đây là một tệp bị cắt, và lớp lấp có thể dựng lại chữ từ chính
  lời tầng ghim đã viết cho bài anh em.

  **Bốn nhóm khoá — đo hai phạm vi, vì "cùng bài" và "cả tầng" cho hai con số khác nhau.**

  Trong đúng `an5.72`: **A = 0 · B = 0 · C = 16 · D = 0.** Đo bằng cách so Pāli từng khoá lấp
  với từng khoá đã có lời ở tầng ghim của chính bài này: 0 cặp trùng nguyên văn, tỉ lệ khớp
  cao nhất chỉ **0,53** ⇒ không khoá nào thuộc A hay B. Duyệt riêng các cặp Pāli trùng nguyên
  văn trong bài: **0**.

  Trên cả tầng Anh đã ghim (phép đo dùng được, vì phạm vi "cùng bài" ở đây rỗng):
  **A = 14 · B = 1 · C = 1 · D = 0.**
  A (trùng nguyên văn từng byte) = 14 khoá `2.2 2.3 3.1 3.2 3.3 4.1 4.2 4.3 5.1 5.2 5.3
  6.1 6.2 6.3`, Pāli giống hệt `an5.71:3.2`…`7.3`.
  B = `2.1`: Pāli `2.1` là Pāli `an5.71:3.1` cộng đúng dấu `“` mà tầng ghim chỉ đặt ở bài này
  ⇒ tỉ lệ khớp token **1,000**; phần lớp lấp phải chèn lại là dấu `“`.
  C = `6.4` (`Dutiyaṁ.`): không khoá nào ở tầng ghim mang lời cho Pāli này ⇒ tự dịch từ Pāli.
  D = 0: không có cặp Pāli trùng nào mà lời tầng khác nhau.

  **Nói thẳng: 15/16 khoá lấp không phải bản dịch mới, mà là lời của chính tầng đã ghim, dùng
  lại cho Pāli trùng nguyên văn.** Đây là chọn có chủ đích, không phải sao chép để đổ chiếu:
  `an5.72:1.6` của chính bài này đã ghim sẵn năm danh xưng, nên dịch khác đi là bài tự mâu
  thuẫn với cột tầng ghim, và `an5.71` với `an5.72` sẽ trái nhau trên cùng một câu Pāli.
  Người đọc bốn bản ở đây được đúng thứ bản tham khảo bị mất. Ai muốn một bản dịch hoàn toàn
  độc lập thì phải đọc `an5.71` cùng `an5.72` như một cặp, và cặp đó lớp lấp này **không** tuyên bố
  là đã đối chiếu hai bản Anh.

  **Thuật ngữ bị khoá cứng bởi tầng đã ghim của chính bài.** `an5.72:1.6` dịch năm danh xưng
  thành "one who has lifted the cross-bar", "one who has filled in the moat", "one who has pulled
  up the pillar", "one who is unimpeded", "a noble one with banner lowered and burden dropped,
  detached". Lớp lấp dùng **đúng bộ từ đó** ở toàn bộ `2.x`–`6.x`.

  **Ba chỗ cố ý lệch tầng đã ghim, mỗi chỗ một lý do.**
  `2.1`: chèn dấu `“` mở — Pāli `2.1` mang `“` còn Pāli `an5.71:3.1` không, và luật là khớp
  Pāli **từng khoá**.
  `6.1`: tầng ghim ở `an5.71:7.1` viết lỗi **"a noble one with with banner lowered"** (chữ
  *with* lặp); lớp lấp viết một *with*. Sửa lỗi chính tả của nguồn tham khảo, không phải shadow,
  và không nhân bản lỗi.
  `6.2`: Pāli `asmimāno` không mang chữ trong ngoặc, còn tầng ghim dịch thành "the conceit ‘I
  am’" (đúng vậy ở `an5.71:7.2`, `an4.200:18.2`, `an4.38:4.2`). Giữ nguyên nháy đơn `‘I am’`
  ⇒ đây là **lệch duy nhất** so với phép đo "nháy khớp Pāli từng khoá", và lệch vì lời tầng ghim
  chứ không vì lớp lấp tự thêm. Trong khoá ấy nháy đơn cân 1/1.

  **Dấu lược: 0.** Không khoá Pāli nào trong 16 khoá lấp chứa `…` (đo bằng máy, `…pe…` tính đúng
  một dấu) ⇒ lớp lấp ghi **0** dấu lược, không thêm, không mở rộng. Dấu `…` duy nhất của bài nằm
  ở lời ghim `1.6` (`detached’. …”`) trong khi Pāli `1.6` viết đủ — lớp lấp không sửa được vì sửa
  là shadow; người đọc sẽ thấy nó, và nó **không** phải dấu của phần đã bị cắt.

  **Cân nháy cả bài:** `“` mở 1 (ở `2.1`) / `”` đóng 1 (ở `6.3`) — khớp Pāli từng khoá. Nháy
  đơn: 1 cặp `‘…’` ở `6.2`. Đếm `’` bằng luật đo được trên tầng ghim (dấu nhạt lượu = `’` +
  s/t/ll/re/ve/d/m và không theo sau bằng chữ cái): **15** dấu nhạt lượu + **1** nháy đóng Pāli
  = 16 tổng. Không lỗi nháy nào khác.

  **Nhãn thứ tự: 1 khoá, không lệch, không cảnh báo.** `6.4` Pāli là `Dutiyaṁ.`, lấp theo khuôn
  `First.`…`Twelfth.` thành "Second.". Bài này là bản thứ hai của một bài đôi (`an5.71` =
  `Paṭhamaṁ.`, tiêu đề "(1st)"; `an5.72` = `Dutiyaṁ.`, tiêu đề "(2nd)"), nên nhãn "thứ hai"
  khớp đúng số mục ⇒ **không có cảnh báo nào phải ghi**.

  **Khoá trống còn lại: 0.** Lớp lấp lấp hết 16 khoá mà tầng ghim để trống, không bỏ khoá nào có
  thật. Riêng `6.4` dưới ngưỡng 40 ký tự (8 ký tự) nên không vào coverage, nhưng vẫn lấp. Ba khoá
  dưới ngưỡng khác của bài — `1.2` "Katame pañca?" (13 ký tự) và ba khoá `:0` — đã có lời ở tầng
  ghim nên không thuộc tập lấp, và không thể lấp vì lấp là shadow.

  **Coverage trước / sau.** Mẫu số = Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0` = **20** khoá.
  Trước: **5 / 20 = 0,2500**. Sau khi lớp lấp ở trạng thái `published`: **20 / 20 = 1,0000**.
  Độ nhạy: còn chịu được mất **4** khoá có nội dung (16/20 = 0,8000, đúng ngưỡng); mất khoá thứ
  **5** là rớt (15/20 = 0,7500).

  **Hệ quả với `content/meta/reference-gaps.yaml`.** Bài này **có** record (`an/an5.72`,
  `substantiveSegments: 20`, `substantiveWithoutEnglish: 15`, `coverage: 0.25`) — khớp đúng phép
  đo ở trên, tức bản sinh cũng đo cùng một cách. Sau khi lớp lấp `published`, record đó thành
  thừa và cần bộ sinh dọn; lát này **không** chạm tệp đó, vì tệp ấy sinh tự động từ
  `npm run reference:gaps` trên worktree sạch.

  **Triangulation 9,2.** Scorecard Việt của `an5.72` ghi `quality.assessed_by` là `GLM 5.3 Flash`
  và `translators` là `Kinh Tạng Pāli Project` — **khác** họ công cụ của lớp lấp, nên về mặt tác
  giả đây không phải lớp đọc Anh độc lập. Nhưng 15/16 khoá dùng lại lời tầng ghim cho Pāli trùng
  nguyên văn ở `an5.71`, tức đây là **lấp lại một lời đọc Anh đã có** chứ không phải đối chiếu hai
  bản Anh; không có bản Anh thứ hai nào phủ phần `2.1`–`6.4`. Bản Việt canonical có đủ 25 khoá
  và đã dùng để đối chiếu nghĩa cho cả 16 khoá. Vì vậy điểm đặt dưới mức trần 9,5 mà lớp lấp
  thường có, và **không** tuyên bố bài này đã được đối chiếu English.

  **technical_integrity 9,6.** Lát này không được chạy `npm run validate`, `npm test`,
  `npm run check`, `npm run build` (cấm của người điều phốn), nên **không** tuyên bố technical
  gate pass. Bốn lệnh đó còn lại cho người điều phốn. Không đặt blocker vì lý do này: quality
  gate chặn ở *validation failure*, không chặn ở *chưa chạy* — và blocker ở đây sẽ giữ bài ở
  `draft`, mà `english-project` chỉ tính vào coverage khi `published`, tức là bài sẽ vẫn ở 0,2500
  dù đã lấp đủ.