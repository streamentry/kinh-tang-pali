notes: |-
  Tiền lệ: 2.1 và 3.4 của chính bài đã ghin "you have supplied the mendicant Saṅgha with
  robes, almsfood, lodgings, and medicines and supplies for the sick". 2.3 và 3.6 chỉ đổi
  `tumhe kho, gahapati` thành `mayaṁ` ("us"), nên phải dùng lại đúng bộ từ ấy; đổi tên tạp
  "của chúng tôi" sang "của chúng tôi" là chủ ý, vì `mayaṁ` ở đây là sở hữu của tầng lấp.
  2.3 có `‘…’ti` nên có một cặp ngoặc đơn; 3.6 viết `āti` không có avagraha nên không có
  ngoặc nào — chốt đếm đúng, và sự khác này là của Pāli chứ không phải lỗi dịch.
  Bất định nhỏ: `paccupaṭṭhitā` là động từ, Sujato dịch "supplied"; giữ nguyên.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược, không phải ở phần nguyên văn bị mất.
  
