notes: |-
  Tiền lệ: `12.1` (đã ghim) dịch đúng `brahmā sahampati abhikkantāya rattiyā abhikkantavaṇṇo
  kevalakappaṁ jetavanaṁ obhāsetvā … ekamantaṁ ṭhito kho … etadavoca` thành "the glorious divinity
  Sahampati, lighting up the entire Jeta's Grove, went up to the Buddha, bowed, stood to one side, and
  said to him,"; `12.3` dịch `kālaṅkato ca … padumaṁ nirayaṁ upapanno sāriputtamoggallānesu cittaṁ
  āghātetvā` thành "He was reborn in the Pink Lotus hell because of his resentment for Sāriputta and
  Moggallāna."; `12.5` dịch `padakkhiṇaṁ katvā tatthevantaradhāyi` thành "respectfully circled the Buddha,
  keeping him on his right, before vanishing right there."

  Vì sao không chép y nguyên `12.3` và `12.5` cho `13.4` và `13.6`: hai khoá `13.3` và `13.5` trống ở
  bản đã ghim và nằm ngoài lát này, nên chúng sẽ vắng mặt trong cột Anh. Nếu chép y nguyên thì `kālaṅkato`
  ("has passed away") và `Idaṁ vatvā` ("Having said this") sẽ mất hẳn trong cột Anh, vì không còn khoá
  nào định nghĩa chúng. Tôi vì vậy dịch trọn vẹn từng khoá, dù lặp lại nội dung mà `13.3` và `13.5`
  lẽ ra phải mang.

  Dấu ngoặc: `’` ở `13.4` đóng ngoặc `‘` mà Pāli `13.3` mở, còn `”` ở `13.6` đóng ngoặc `"` mà
  `13.2` mở — đúng như Pāli. Vì `13.3` trống nên `’` ở `13.4` không có ngoặc mở hiện diện; cùng kiểu
  với `an3.61:4.4` và `an3.61:6.4`.

  Bất định đã biết: `abhikkantāya rattiyā` ở `12.1` được Sujato dịch "late at night". Ở `13.2` không
  dùng lại được như vậy vì `imaṁ, bhikkhave, rattiṁ` đã chiếm chỗ bằng "This night", nên tôi dịch vế
  đó là "toward dawn" (cùng nghĩa: về giữa đêm, trước bình minh). `kevalakappaṁ` dịch "the entire" —
  chép theo `12.1`.

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
