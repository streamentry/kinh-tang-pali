notes: >-
  1.7 (`viditā saññā …pe…`) để trống, nên 1.8 phải tự đứng cho vế thứ ba của bộ ba
  ở 1.6. `uppajjanti` không mang chủ ngữ trong tiếng Anh vì chủ ngữ là `vitakkā`
  đứng ở 1.7 — dịch thành mệnh đề danh ngữ cho đúng. Giữ "as they remain" và "as
  they go away" nguyên văn bản đã ghim.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
