notes: >-
  Kesi trả lời bằng ba vế `saṇhena … pharusena … saṇhapharusena` rồi 1.7 mới nói
  tới việc giết ngựa. Ba vế `na upeti` phải giữ đủ — đây là ba phép thử đã thử,
  không phải một phép thử lặp lại. Câu kết bằng dấu phẩy chấm phẩy vì Pāli 1.6
  cũng vậy; khoảng trống trước "I kill it" là do chính cách cắt segment.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
