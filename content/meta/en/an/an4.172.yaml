notes: |-
  `3.2`–`3.4` và `4.2`–`4.4` lặp lại ba vế đã có chữ ở `2.2`–`2.4`, và lặp lại `2.2`/`2.3`/`2.4`
  MỘT LẦN NỮA ở `5.2`/`5.3`/`5.4`. Cả ba khối cùng một Pāli, chép nguyên văn.

  Điều đáng báo nhất của lát này: CHÍNH BẢN ĐÃ GHIM không nhất quán với chính nó.

  - `2.3` dịch `Yassa kho panassa kaṅkhā vā vimati vā, so maṁ pañhena.` thành "Whoever has any doubt or
  uncertainty, let them ask me,"
  - `5.3` dịch CÙNG vế đó thành "If anyone has any doubt or uncertainty, let them ask me,"

  Hai vế Pāli giống nhau từng chữ, hai bản dịch khác nhau. Lớp lấp không có cách nào sửa được (nó không được
  chạm vào tầng tham chiếu), nên tôi theo LUẬT: dùng lại cách đã có, và lấy bản SỚM HƠN — `2.3`, "Whoever
  has any doubt or uncertainty". Lý do chọn bản sớm: một bài đọc từ đầu sẽ gặp `2.3` trước, và nếu `3.3`/`4.3`
  đải ngược lại thì cột Anh đổi giọng giữa chỗ đọc thứ nhất và chỗ đọc lại. Hệ quả phải nói ra: `5.3` (bản
  đã ghim, không phải của tôi) vẫn khác `3.3`/`4.3` của tôi, và người đọc bốn cột sẽ thấy sự lệch đó. Tôi ghi
  nó ở đây thay vì che; đây là lý do `ambiguity_integrity` hạ xuống 9.0.

  Ba vế còn lại không có vấn đề: `3.2`/`4.2` ← `2.2`, `3.4`/`4.4` ← `2.4`.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm, nên đây KHÔNG phải một lớp đọc Anh độc lập. Tầng đối chiếu là Pāli đã ghim, các khoá còn lại của chính bản Anh đã ghim, và bản Việt dự án (do agent khác viết) chỉ để đối chiếu nghĩa.

  Lớp lấp: 6 khoá, tất cả đều nằm ở chỗ bản Anh đã ghim để trống. Không khoá nào là blockquote tham chiếu và không khoá nào có Pāli rỗng.

  Bài này còn 1 khoá mà bản Anh đã ghim để trống và lát này KHÔNG lấp, vì Pāli của chúng dưới 40 ký tự nên nằm ngoài ngưỡng đo coverage: `5.5`. Phần lớn là đuôi đoạn lược (`…pe…`, `Navamaṁ.`, `parinibbāyati.`) và bài thơ `udāna` cuối bài. Người đọc bốn cột VẪN thấy các ô này trống, và đó là đúng: một ô tham chiếu trống là lỗ hổng của bản dịch đó, khác với bản vắng mặt cả bài.

  Lớp lấp làm coverage English của bài này lên 100% (từ 12/18 = 0.6667). Bản ghi của nó trong `content/meta/reference-gaps.yaml` sẽ thành record thừa và test `a fill never leaves a gap record it has cured` sẽ đỏ cho tới khi chạy `npm run reference:gaps`. Tôi không sửa tệp đó và không chạy lệnh đó; việc đó nằm ngoài lát này.
