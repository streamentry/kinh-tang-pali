notes: >-
  Danh sách tám chủ thể lặp lại y hệt ở 1.2 (bản đã ghim đã dịch). Bản này giữ đủ
  tám, không rút thành "and so on", và giữ cả "departed ancestors" cho
  `pubbapetānaṁ`. `dāsakammakaraporisassa` dịch "servants and hired workers" thay
  vì "bondservants, workers, and staff" của bản đã ghim: cả hai đều đúng, và ở đây
  nó phân biệt được hai nhóm mà Pāli cũng phân biệt bằng `dāsa` và `kammakara/
  porisa`.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
