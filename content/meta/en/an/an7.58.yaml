notes: |-
  Sáu khoá trùng nhau: 6.5 = 7.5 = 8.4 = `Nimittametaṁ, bhikkhave, na samanupassāmi.`
  Chỉ một cách dịch cho cả ba.

  BẤT ĐỊNH ĐÃ TRA, PHẢI NÓI THẲNG: câu này KHÔNG có tiền lệ bản Anh nào ở
  commit đã ghim. Đã đếm `Nimittameta` trong toàn bộ Pāli đã ghim — chỉ hai bài có:
  an7.58 và mil6.3.5, mà mil6.3.5:1.2 là `“Nimittametaṁ, mahārāja, supinaṁ nāma…`
  ("dấu hiệu này, tôn chúa, tức là một giấc mơ") — nghĩa khác hẳn, không dùng được.
  an4.8 và mn12 có cùng ý nhưng bản đã ghim NHỒI mất vế `…’ti nimittametaṁ,
  bhikkhave, na samanupassāmi` vào cuối khoá trước nên không còn chữ để bám. Đếm
  `nimittameta` trong bản Anh đã ghim: 0 lần.

  Vì vậy chọn cách bám vào khoá kế 6.6 / 7.6 / 8.5 — "Since I see no such reason, I
  live secure, fearless, and self-assured" — và dịch `Nimittametaṁ … na samanupassāmi`
  thành "I do not see that reason." Dùng "that reason" chứ không phải "such a reason"
  để không lặp nguyên văn với 6.6 ngay dòng kế. Đồng thời bám cả cách Sujato BỎ
  dạng xưng `bhikkhave` trong lời Đức Thế Tôn ở chính bài này: 6.2, 7.1, 8.1 đều
  không có "Mendicants" dù Pāli có `bhikkhave`.

  Nếu biên tập khác sẽ dịch "I do not see that reason, mendicants", thì cũng bảo vệ
  được. `terminology` hạ 9.0 và `ambiguity_integrity` hạ 8.6 vì đây là khoá duy
  nhất trong lát không có tiền lệ để đếm.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
