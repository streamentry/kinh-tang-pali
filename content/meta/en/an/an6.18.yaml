notes: |-
  Cả ba khoá là cùng một câu hỏi, chỉ khác loài vật bị giết (`macchiko` cá / `goghātako`
  bò / `māgaviko` hươu). Bản đã ghim đã dịch trọn câu ở 2.3, 3.3 và 4.6, nên ba khoá
  này lấy lại NGUYÊN VĂN bản dịch ở khoá đối chiếu — luật 3 của lớp lấp. Danh từ
  đầu câu: "a fish dealer selling fish…" (2.3), "a butcher of cattle selling cattle…"
  (3.3), "a deer-hunter selling deer…" (4.6).

  Danh sách vế sau `tena kammena tena ājīvena` lấy nguyên văn từ 2.3 / 3.3 / 4.6 /
  4.13: "to travel by elephant, horse, chariot, or vehicle, or to enjoy wealth, or to
  live off a large fortune". Đếm cả bản đã ghim: cụm này 4 lần, không tồn tại cách
  dịch thứ hai cho `hatthiyāyī … bhogakkhandhaṁ ajjhāvasanto`.

  Hai lựa chọn biên tập, đều ghi ra đây vì chúng không cơ hếp:
  - Chữ hoa đầu câu. Pāli 2.7 / 3.7 / 4.10 mở bằng `‘macchiko` (chữ thường) vì nối
    tiếp 2.2 ("Have you ever seen or heard"). Nhưng ở 2.7 / 3.7 / 4.10, khoá trước là
    2.6 / 3.6 / 4.9 ("I too have never seen or heard of such a thing.") — đã là câu
    trọn, nên bản Anh viết hoa. Giữ chữ thường sẽ tạo lỗi kiểu chữ sau dấu chấm.
  - Lặp từ ở 3.7. `rven88.py` báo "cattle … cattle". Lặp nằm sẵn trong Pāli
    (`goghātako gāvo … gāvo vadhitvā vadhitvā`) và Sujato đã dịch y hệt ở 3.3 ("of a
    butcher of cattle selling cattle that he killed himself"). Không sửa: sửa là
    phá luật 3.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn
  bị mất. Triangulation 8.0: không có bản Anh độc lập phủ cho ba khoá này.
