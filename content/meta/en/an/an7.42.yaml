notes: |-
  Mười khoá lấp đều nằm ở mục 3, là chỗ Tôn giả Sāriputta kể lại buổi sáng của chính
  mình cho Đức Thế Tôn. Pāli ở mục 1–2 kể việc ấy ở ngôi thứ ba; mục 3 đổi sang ngôi thứ nhất
  (`khvāhaṁ`, `mayhaṁ`) và lặp lại đúng các mệnh đề ấy. Vì vậy **không dịch mới**: mười khoá
  lấy lại bộ từ đã dùng ở mục 1–2 của chính bài này, chỉ đổi chủ ngữ và thêm `sir` cho
  `bhante` — dải tương ứng đo được bằng máy là
  3.1 ← 1.1 · 3.3 ← 1.3 · 3.4 ← 1.4 · 3.5 ← 1.5 · 3.6 ← 1.6 ·
  3.7 ← 1.7 · 3.8 ← 1.8 · 3.9 ← 2.1 · 3.10 ← 2.2 · 3.11 ← 2.3.
  Trong đó **3 khoá y nguyên từng chữ** với tầng đã ghim (3.3 = 1.3, 3.4 = 1.4, 3.8 = 1.8 —
  vì các mệnh đề ấy không đổi ngôi), và 7 khoá còn lại là bản chuyển sang ngôi thứ nhất của
  đúng dải ấy. Đây là luật 2 của lớp lấp: Pāli đã xuất hiện ở nơi khác trong cùng bài thì phải
  dùng lại cách dịch đã có, không dịch lại từ đầu.

  3.7 khác 1.7 đúng một tiếng `bhente` và dấu hai chấm ở cuối (1.7 kết `,` vì còn dẫn 1.8),
  nên 3.7 giữ nguyên câu của tầng ghim và thêm `, sir`. 3.8 khác 1.8 chỉ ở vị trí dấu nháy
  (`niddaso bhikkhūti` thay cho `‘niddaso bhikkhū’ti`) — cùng một lời, nên y nguyên.

  BẤT ĐỊNH CẦN GHI: 3.2 (`Tassa mayhaṁ, bhante, etadahosi:`) cũng trống ở tầng đã ghim và nằm
  trong tập lấp được, nhưng **không thuộc lát này**, nên cột Anh của người đọc sẽ đọc 3.3
  (“It’s too early to wander for alms in Sāvatthī.”) ngay sau 3.1, mà thiếu vế dẫn “Then it
  occurred to me:”. Đây là hệ quả của tầng đã ghim, không phải lỗi dịch; ghi thẳng thay vì
  bịa vế dẫn. Cùng lý do, 3.10 giữ `thinking:` như tầng ghim ở 2.2 để 3.11 (trong dấu nháy)
  còn có chỗ bám.

  3.11 là trường hợp nháy lồng nhau: Pāli mở `"` rồi mở `‘` cho ý nghĩ, đóng `’` rồi `ti.`
  Bản lấp vì vậy là `"'…’"` — vế trong lấy nguyên của 2.3.

  Không có dấu lược trong Pāli của cả mười khoá (đã kiểm: không khoá nào chứa `…`), nên luật
  giữ `…` không phát sinh ở bài này.

  Triangulation 7.5: scorecard Việt của `an7.42` (`content/meta/sutta/an/an7.42.yaml`) ghi
  `translators` và `quality.assessed_by` đều là “OpenCode Space Bunny Free (agent)” — cùng họ
  công cụ với lớp lấp (xem `source/tooling.yaml`: `aliasInMetadata`), nên bản lấp **không** phải
  lớp đọc Anh độc lập cho bài này, và không được tuyên bố đã đối chiếu Anh độc lập. Bản Việt
  hiện hành (`vietnamese-current`) không phủ bài này ở commit đã ghim; đối chiếu chỉ có Pāli +
  tầng Sujato đã ghim + bản Việt canonical (36 khoá).

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`,
