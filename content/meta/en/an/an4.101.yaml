notes: |-
  an4.101 là `Paṭhamavalāhakasutta` — bốn loại người ví như mây, mỗi loại một vòng bốn khoá (`Evaṁ kho …` →
  `Seyyathāpi so …` → `tathūpamāhaṁ …`). Trong mỗi vòng, Sujato dịch vòng một (`3.3`, `3.4`) và **bỏ trống**
  vòng hai, ba, bốn.

  **Bốn khoá chép nguyên văn, không dịch lại** — đây là phần quan trọng nhất của lát này:
  - `3.5`, `4.5`, `5.5`, `6.5` đều mang Pāli **trùng byte** `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi.`.
    Cùng Pāli ấy đã được dịch và **published** trong chính kho này ở `an5.75` (5 khoá) và `an5.249` (5 khoá),
    cả hai đều dùng một cách: `I say that this individual is like that.` Tôi chép y nguyên cả 10 khoá đã có.
  - Vì sao không dịch lại lần thứ mười một: nếu tôi tự viết, chỉ cần trượt một chữ là cột Anh của dự án sẽ có
    hai cách dịch cho cùng một khoá Pāli ở bốn bài khác nhau. Bốn bài đó đã `published` và đã có người đọc.

  **Sáu khoá còn lại là chép câu đã ghim rồi đổi đúng cặp tính từ**, theo khuôn của vòng một:
  - `4.3` ← `3.3`; `5.3` ← `5.1`; `6.3` ← `6.1` (cùng khuôn `Evaṁ kho, bhikkhave, puggalo …`).
  - `4.4` ← `3.4`; `5.4` và `6.4` cũng trên khuôn `3.4` (`That individual is like a cloud that …, I say.`),
    vì Sujato không dịch `Seyyathāpi so` nào ở ba vòng sau (đều trống), nên không có mẫu thứ hai để chọn.

  **Hai chỗ tôi cố ý KHÔNG đồng hoá, và vì sao:**
  1. `Seyyathāpi so` ở `3.4` là `gajjitā, no vassitā` (có dấu phẩy) còn `6.4` là `gajjitā ca vassitā ca`
     (không dấu phẩy). Tôi giữ nguyên sự khác đó của Pāli trong tiếng Anh: `thunders but doesn’t rain` vs
     `both thunders and rains`. Bản Việt canonical cũng giữ (`sấm rền nhưng không mưa` vs `vừa sấm rền vừa mưa`).
  2. `tathūpamāhaṁ … vadāmi` đứng **sau** câu `…, I say.` mà bản ghim đã đóng bằng `I say.` — đọc liền sẽ thấy
     `I say.` hai lần. Đó **không phải** lỗi của tôi: `I say.` nằm sẵn trong bản Anh đã ghim ở `3.4`, và tôi
     không được sửa bản ghim. Cách sửa đúng là bỏ `, I say.` ở các khoá `Seyyathāpi`, nhưng việc đó thuộc tầng
     `english-sujato` và nằm ngoài lát này — tôi báo để người biên tập quyết.

  **Dấu lược:** không khoá Pāli nào của an4.101 trong tập lấp mang `…pe…` hay `…` trần, nên không khoá lấp
  nào được thêm dấu lược. (Các `…` trong `2.5` và `6.2` của bản ghim là của chính bản ghim, không liên quan.)

  **Khoá trống còn lại:** `an4.101:6.7` = `Paṭhamaṁ.` → `First.` (9 ký tự Pāli, dưới ngưỡng 40 nên không tính
  coverage). Lấp được, nhưng ngoài lát `e11`.

  Điểm: `triangulation` = 8.0 vì `content/meta/sutta/an/an4.101.yaml` ghi `assessed_by: GLM-5.3 Flash (ZCode)`
  (khác họ công cụ `OpenCode Space Bunny Free` nên chưa phải 7.5). Nhưng bốn trong mười khoá là bản dịch đã
  xuất bản của chính dự án, không phải bản dịch mới — chúng là bằng chứng về tính nhất quất. Sáu khoá còn lại
  mới là chỗ tôi tự viết, và chỉ là chép khuôn có sẵn trong cùng bài.

