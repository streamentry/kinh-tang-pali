notes: |-
  **Bốn nhóm khoá (đo bằng script trên 10 khoá lấp): A = 5 · B = 1 · C = 4 · D = 0.**

  - A (5): `3.3`, `5.3` (= `2.3`), `3.4`, `4.4`, `5.4` (= `2.4`) — câu “‘I’m swamped by rebirth, old age, and death …”
    / “Hopefully I can make an end to this entire mass of suffering.’”. Tầng ghim kết `3.2`, `4.2`, `5.2` bằng ` …` dù
    Pāli không có dấu lược, rồi bỏ trống hai khoá kế; lớp lấp lấp đủ.
  - B (1): `4.3` ← `2.3`, tỉ lệ 1,0 — Pāli `4.3` khác `2.3` đúng **vị trí một dấu phẩy** (`paridevehi, dukkhehi … upāyāsehi dukkhotiṇṇo`
    thay vì `paridevehi dukkhehi … upāyāsehi, dukkhotiṇṇo`); nghĩa không đổi ⇒ dùng nguyên lời `2.3`.
  - C (4): `3.9`–`3.11` và nhãn `5.13`.

  **`3.9`–`3.11` — tầng ghim đã gộp.** Pāli `3.8` chỉ nói `khādāma` (ăn), nhưng lời ghim `3.8` là “we used to eat,
  consume, taste, and drink what we wanted, not what we didn’t want.” — tức đã nuốt `3.9` (`bhuñjāma`), `3.10`
  (`sāyāma`), `3.11` (`pivāma`). Lớp lấp dịch đúng phần từng khoá bằng chính động từ Sujato: “we consumed …”, “we
  tasted …”, “we drank what we wanted, not what we didn’t want.” Hệ quả: cột English nhắc lại ba động từ đã có ở `3.8`.
  Tỉ lệ khớp với `3.8` đo được 0,64 nên phép thô gọi C.
  - `5.13` `Dutiyaṁ.` → “Second.” (bài thứ hai của `13. Bhayavagga`, `an4.121`…`an4.130`).

  **Nháy / dấu lược:** mọi khoá khớp Pāli (0 lệch); Pāli 10 khoá 0 dấu lược, lớp lấp 0.

  **Hai cơ chế khoá trống, đo trên 10 khoá:** cắt cụt dãy **0** (không dãy nào ≥ 4); bỏ dòng song song **2** nhóm / **6** khoá.

  **Coverage.** Mẫu số 50. Trước 41/50 = **0,8200** (đã trên ngưỡng, sát). Sau khi `published`: 50/50 = **1,0** (9 khoá có
  nội dung; `5.13` dưới 40 ký tự). `content/meta/reference-gaps.yaml` **không** có record `an4.122`.

  Triangulation 8.8: scorecard Việt của bài này (`content/meta/sutta/an/an4.122.yaml`) do **khác họ công cụ** với lớp lấp chấm/dịch (đối chiếu alias trong `source/tooling.yaml`), nên về tác giả đây là lớp đọc English độc lập; vẫn dưới 9,5 vì lớp lấp không có bản Anh thứ hai để đối chiếu ở chính các khoá đã lấp. Nguồn đã đối chiếu: Pāli root đã ghim + Sujato đã ghim + bản Việt canonical (đối chiếu nghĩa, không dịch vòng).

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối. Không đặt blocker vì “chưa chạy” không phải “chạy mà đỏ”. Đã tự kiểm bằng script: JSON parse, mọi khoá ⊆ tập lấp, 0 khoá trùng khoá đã ghim có chữ (không shadow), NFC, không khoá rỗng, nháy kép/đơn khớp Pāli từng khoá (nhận `’` + chữ thường là dấu nháy lược), số `…` khớp Pāli (`…pe…` = một), `final_score` = trung bình thô.
