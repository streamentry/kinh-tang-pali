notes: >-
  Pāli ở 1.3 và 1.6 GIỐNG HỆT NHAU — Hatthaka lặp lại lời hứa sau khi Đức Thế Tôn
  khuyên. Bản đã ghim đã dịch 1.3; bản này giữ các từ khoá "stand before", "sank",
  "melted down", "stay still" nhưng diễn đạt lại ("the Blessed One", "was unable")
  để đây là chữ của dự án chứ không phải bản sao nguyên văn của Sujato. Cùng Pāli
  thì cùng nghĩa; không cần, và không nên, trùng từng chữ.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
