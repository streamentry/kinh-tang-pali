  lỗi giả với số âm; (2) phép so công thức bốn lần với lời đã publish bỏ dấu chấm ở một bên và không
  bỏ ở bên kia, nên báo lệch khi hai chuỗi thực ra **giống nhau từng byte**.

  **Không phân xử được thì nói thẳng:** không có mục nào. Bốn khoá tự dịch đều là câu đơn giản, không
  có danh từ lạ, không có con số phải tự tính, không có cụm `Tiṁsakappasahassa` kiểu `vv32:8.3`.