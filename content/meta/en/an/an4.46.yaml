  nấy). Bốn cặp "gần trùng" — `1.7`/`3.1`, `1.8`/`3.2` (chỉ khác dấu câu và dấu `‘`), và
  `1.5`/`3.3`/`4.1` — cũng lấp giống nhau, chỉ chỗ dấu nháy mở mà Pāli yêu cầu.

  **Nguyên nhân khoá trống, đo cả hai cơ chế (mục 5d) — và phép gộp khoá ra 0 ở đây.**
  · **Gộp khoá** (≥50% thân từ Pāli của khoá trống nằm trong lời Anh của khoá **trước**):
    **1 cặp liền khoá đủ điều kiện, 0 cặp khớp** ⇒ **0 khoá**. Ở bài này gần như không thể có cặp nào
    khác, vì tầng đã ghim im suốt từ `1.4` trở đi nên không có khoá "trước" nào mang lời.
  · **Cơ chế A — cắt cụt dãy:** dãy ≥ 4 khoá trống liên tiếp = **1 dãy, 28 khoá, 2.081 ký tự Pāli**
    (`1.4` → `6.5`, tức **toàn bộ thân bài** sau `1.3`). Tầng đã ghim dịch `1.1`–`1.3` rồi bỏ luôn, và
    in ra đọc thì **không** thấy khoá nào bị nuốt: mỗi khoá trống vẫn giữ Pāli riêng và phải dịch riêng.
  · **Cơ chế B — bỏ dòng song song:** **9 khoá / 4 nhóm** · `1.4`+`3.4` · `1.5`+`3.3`+`4.1` ·
    `1.7`+`3.1` · `1.8`+`3.2`. Kiểm chống tự thừa: 9 ≤ 28 khoá trống ✓.
  ⇒ Nguyên nhân ở bài này là **A là chính**, không phải gộp khoá.

  **Nhãn thứ tự (mục 5e).** Quét **giá trị** Pāli theo `^(Paṭhama|…|Terasama)ṁ\.$` cho **một** nhãn:
  `6.5` = `Chaṭṭhaṁ.` ⇒ điền **"Sixth."**. **Không có cảnh báo lệch** ở bài này, và đây là điều đã
  đo chứ không phải điều giả định: đọc nhãn ở `an4.41`…`an4.47` ra đúng chuỗi `Paṭhamaṁ · Dutiyaṁ ·
  Tatiyaṁ · Catutthaṁ · Pañcamaṁ · Chaṭṭhaṁ · Sattamaṁ`, và `0.2` ghi `5. Rohitassavagga`. `Chaṭṭhaṁ`
  là nhãn thứ sáu của một chuỗi bảy bài, khớp vị trí. ⚠️ Lưu ý khi đọc: nhãn bài không phải số thứ tự
  **trong phẩm `an4`** mà là số thứ tự trong phẩm.

  **Dấu lược:** 28 khoá này và **toàn bộ** bài `an4.46` có **0** dấu `…` ở Pāli (không có `…pe…`), nên
  lớp lấp có **0** dấu lược. Không có khoá nào bị bịa hay mở rộng.

  **Ngoặc kép — bảng cân đọc tay, in ra để kiểm.** Điều kiện là **khớp Pāli từng khoá**, không phải mỗi
  khoá tự cân cũng không phải cân tổng. Lớp lấp có `‘` ở `1.5` `1.7` `2.5` `3.3` `4.1` (5 khoá), `’`
  đóng ở `1.5` `1.9` `2.5` `3.3` `4.1` (5 khoá), và `”` ở `6.4` (1 khoá) — **khớp Pāli từng khoá 28/28**,
  đo bằng máy. `3.1` cố ý **không** có `‘` vì Pāli ở `3.1` không có.
  ⚠️ **Một hệ quả sẽ hiện ra với người đọc:** dấu `“` mở ở `1.2` đã bị tầng đã ghim đóng ngay tại `1.3`
  (`…’ …”`), trong khi Pāli giữ nó mở tới `6.4`. Lớp lấp vẫn viết `”` ở `6.4` theo Pāli, nên người đọc
  sẽ thấy hai dấu đóng kép trong cùng một bài. Bỏ dấu thứ hai thì lệch Pāli ở đúng khoá đó; giữ thì lệch
  với khoá `1.3` mà lớp lấp không được sửa. Lớp lấp đã publish của `an4.45` chịu đúng cái hệ quả này ở
  `5.3`, nên đây là hệ quả cơ học của luật đánh dấu theo từng khoá, không phải lựa chọn văn phong.

  **Dấu nhạt lượu `’`, đếm bằng luật đúng (mục 5c.4) và kết quả.** Luật: `’` có chữ thường đứng ngay
  sau ⇒ dấu nhạt lượu; không có ⇒ nháy đóng. Lớp lấp bài này có **14** dấu nhạt lượu, **tất cả** đều là
  `’s`. Pāli 28 khoá này có **4** dấu `’` đi kèm chữ thường, và **cả bốn đều là `’ti`** — tức nháy đóng
  Pāli trước phụ từ `ti`, **không** phải dấu nhạt lượu. Đây đúng là ngoại lệ `’ti` mà brief ghi, và đã
  được xử lý bằng cách đối chiếu dấu `’` với Pāli từng khoá thay vì đếm máy.

  **Chỗ lớp lấp cố ý lệch tầng Anh đã ghim, kèm lý do — ba chỗ.**
  1. `2.1` `bhojaputto` ⇒ "**son of Bhoja**", không phải "son of the benefactors" như tầng đã ghim ở
     `an4.45:4.1` và `sn2.26:3.1`. Pāli là authority: `bhoja` ở đây là **tên riêng** (vua Bhoja), và
     chính tầng đã ghim cũng dịch `bhojaputtā` ở `cp20:4.1` thành "the Bhojans" — tức hai lời trái nhau
     cho một từ. Bản Việt canonical của chính bài này ghi "con của Bhoja". Chỉ có **một** từ bị đổi;
     phần còn lại của khoá dựng lại nguyên văn.
  2. `1.7` và `3.1` giữ **cả hai** `bhante` ⇒ "sir … sir". Tầng đã ghim bỏ `bhante` thứ hai ở **17/17**
     khoá cùng dạng `Acchariyaṁ, bhante, abbhutaṁ, bhante.` (đo toàn tầng). Bản Việt canonical giữ cả
     hai ("bạch Thế Tôn" × 2), và đây là tiêu chí "không bớt ý", nên lớp lấp giữ. Dấu câu cũng đổi: Pāli
     kết chấm ở cả hai khoá và nối tiếp bằng `—` (`1.8`) hoặc `:` (`3.2`), nên lớp lấp dùng `!` như
     `sn46.30:2.1` của chính tầng đã ghim; giữ dấu phẩy như tầng đã ghim sẽ để lại "sir, it's amazing,"
     rồi "how well…" — đọc như lỗi.
  3. `5.2` kết **chấm** (`be reached by traveling.`) thay vì dấu chấm phẩy của Pāli `kudācanaṁ;`. Đây là
     lựa chọn **theo hướng ngược lại** với hai chỗ trên: tầng đã ghim cũng dùng chấm ở `an4.45:7.2`,
     và "can never" ở `5.1` đã gộp sẵn nghĩa `kudācanaṁ` ("dù lâu đến bao lâu"), nên chấm là cách đúng
     của tiếng Anh và không mất ý. Đổi phẩy thành chấm phẩy sẽ buộc `5.3` phải bỏ chữ hoa "But".
     Cùng hiện tượng ấy xảy ra **kế thừa** ở `6.2` (Pāli `vusitabrahmacariyo;` → chấm), nhưng đó không
     phải lựa chọn của lớp lấp mà là lời đã dịch sẵn của tầng đã ghim ở `an4.45:8.2`; nói ra để không
     ai đọc `5.2` thành tiêu chuẩn duy nhất rồi thấy `6.2` "lệch".

