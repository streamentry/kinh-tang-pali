notes: |-
  **Phân loại 11 khoá (đo bằng `eng/_e15_class.py`): A y nguyên từng chữ = 6 · B dựng lại = 2 ·
  C tự dịch = 3.** Bài này là ví dụ rõ nhất về luật “Pāli trùng nguyên văn thì phải dùng lại cách
  dịch đã có”: sơ thiền được tầng đã ghim dịch đủ, **riêng tứ thiền thì không**, và 9 khoá lấp ở đây
  phần lớn chỉ là tiếng vang của sơ thiền.

  - **A (6):** `4.6` = `2.4`/`3.3` · `4.8` = `2.6`/`3.5`/`6.6`/`8.7`/`9.5` · `4.9` = `2.7`/`3.6`/`6.7`/
    `8.8`/`9.6` · `4.10` = `2.8`/`3.7`/`6.8`/`8.9`/`9.7` · `4.11` = `2.9`/`3.8`/`6.9`/`8.10`/`9.8` ·
    `5.1` = `3.1`/`7.1`/`9.1`. Đo bằng so khớp chuỗi sau khi bỏ khoảng trắng thừa: trùng tuyệt đối.
    Riêng `4.6` lấy bản **có `rūpagataṁ`** (ngũ xứ), đúng với Pāli của chính khoá — bản `6.4`/`8.5`/
    `9.3` bỏ `rūpagataṁ` vì ở các khoa ấy Pāli cũng không có.
  - **B (2):** `5.2` (0,62 với `7.2`) và `5.5` (0,77 với `4.3` + `3.10`).
  - **C (3):** `4.5`, `5.3`, `7.3`.

  **`4.5` — chỗ duy nhất phải dựng câu.** Pāli là công thức tứ thiền đầy đủ:
  `sukhassa ca pahānā dukkhassa ca pahānā pubbeva somanassadomanassānaṁ atthaṅgamā adukkhamasukhaṁ
  upekkhāsatipārisuddhiṁ catutthaṁ jhānaṁ upasampajja viharati`. Trong **chính bài này** không có khoá
  nào đã ghim chứa công thức ấy, nhưng tầng Anh đã ghim có nó ở **22 khoá Pāli khác trong AN** (đo:
  24 khoá AN chứa `sukhassa ca pahānā`, 22 đã dịch, 2 để trống — `an5.14:5.5`, `an9.36:5.2`). Lớp lấp
  ghép lời đã ghim ấy, đổi mệnh đề danh từ (`Idha, bhikkhave, bhikkhu … viharati`) thành vế mệnh đề
  quan hệ để khớp với khoá: “Here, mendicants, a mendicant who has given up comfort and pain, and
  has dispelled former happiness and sadness, enters and remains in the fourth absorption, without
  pleasure or pain, with pure equanimity and mindfulness.” Từ “comfort and pain”, “former happiness
  and sadness”, “enters and remains in the fourth absorption, without pleasure or pain, with pure
  equanimity and mindfulness” đều là của tầng đã ghim (đối chiếu `an4.38:3.2`, `an10.20:10.2`,
  `an4.123:4.1`, `an9.35:6.2`).

  **`5.2` — chọn “a mendicant”, và đây là số đếm chứ không là sở thích.** Công thức `evamevaṁ kho,
  bhikkhave, bhikkhu … upasampajja viharati` bị tầng đã ghim dịch không nhất quán: đo trên AN · DN · MN
  · SN được **5** khoá dùng “a mendicant” và **1** khoá dùng “a noble disciple”; ngay trong bài này,
  `3.2` dùng “a noble disciple” còn `7.2` và `9.2` dùng “a mendicant”. Lớp lấp theo đa số đo được và
  theo hai khoá anh em trong cùng bài ⇒ **“a mendicant”**. Ghi ra đây vì đây là chỗ người đọc có thể
  thấy “vành” giữa `3.2` và `5.2`; không sửa tầng đã ghim.

  **Dấu lược — giữ, không mở rộng (3 khoá, đếm bằng script):** `5.2`, `5.3`, `7.3` đều có `…pe…`.
  · `5.2` lược mất `dukkhassa ca pahānā pubbeva … upekkhāsatipārisuddhiṁ`, nên lớp lấp dịch đúng hai
    mảnh còn lại: “In the same way a mendicant who has given up comfort and pain … enters and remains
    in the fourth absorption.” (đối chiếu `3.2`, tầng đã ghim đã **mở rộng** dấu lược ở đó — lớp lấp
    không làm vậy, và không sửa tầng đã ghim).
  · `5.3` và `7.3` là **cùng một chuỗi Pāli** (`So yadeva tattha hoti vedanāgataṁ saññāgataṁ …pe…`)
    ⇒ hai khoá lấp giống nhau từng chữ. Đây là hệ quả của dấu lược ở nguồn: phần bị lược chính là
    `saṅkhāragataṁ viññāṇagataṁ, te dhamme aniccato … anattato samanupassati` mà tầng đã ghim dịch
    đầy đủ ở `6.4`/`8.5`/`9.3`. Lớp lấp chỉ dịnh phần **còn lại** và giữ `…`:
    “So whatever state there is there, included in feeling, perception … ”. Cũng chính vì thế tầng đã
    ghim để trống `7.3` mà `6.4`/`8.5`/`9.3` lại đủ.
  Tổng dấu lược của bản lấp bài này = **3**.

  **Cân ngoặc kép: cân tuyết, 0 sai lệch** (đếm bỏ dấu nháy đơn kiểu apostrophe như `don’t`).

  **Năm khoá trống còn lại, đều dưới ngưỡng 40 ký tự nên `coverage` không tính và lát này không lấp:**
  `4.4` (24, `Kiñcetaṁ paṭicca vuttaṁ?`), `4.7` (35, `So tehi dhammehi cittaṁ paṭivāpeti.`), `5.4` (26),
  `7.4` (26), `10.4` (9). Hai chỗ người đọc sẽ thấy thiếu câu: `4.7` lẽ ra phải có “They turn their
  mind away from those things,” giữa `4.6` và `4.8`; `5.4`/`7.4` lẽ ra phải có vế “and are not liable
  to return from that world.” Tổng số khoá tầng Anh đã ghim để trống ở bài này là 16 không tính `:0`;
  lát này lấp 11, còn 5 khoá nêu trên. Vì những chỗ thiếu này hiện ra với người đọc chứ không được
  che, hạ `ambiguity_integrity` 9.2.

