notes: >-
  Cụm liệt kê `diṭṭhaṁ sutaṁ mutaṁ viññātaṁ pattaṁ pariyesitaṁ anuvicaritaṁ manasā`
  xuất hiện HAI LẦN trong chính bài này (3.1 và 4.2) và cả hai đều bị bản đã ghim
  lược thành câu "It could be, Ānanda." — nên không có chữ nào trong bài để đối
  chiếu. Bộ từ đã dùng ở `an11.9:7.3` cho đúng cụm này ("seen, heard, thought, known,
  attained, sought, or explored by the mind") được dùng lại để cả kho nhất quán.
  Nếu không, cùng một liệt kê sẽ có hai cách gọi khác nhau ở hai bài kề nhau.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
