notes: |-
  Đoạn 3.2–3.8 là lần thuật lại đúng lời thiên thần nói ở 1.1–2.7, y như `an6.32`.
  Bốn khoá dùng lại y nguyên bản đã ghim của chính bài này:

  * 3.2 — Pāli giống hệt `an7.33:1.1` đã ghim, và cùng mẫu với `an6.33:1.1`,
    `an6.69:2.2`.
  * 3.3 — vế mở của `an7.32:2.1` đã ghim ("Sir, these seven things don’t lead to the
    decline of a mendicant."); Pāli chỉ khác ở dấu mở `“` → `‘`.
  * 3.5 — danh sách của `an7.32:2.3` đã ghim; khác `an6.32` ở chỗ có thêm `samādhigāravatā`
    ("for immersion") nên bảy phẩm thay vì sáu.
  * 3.6 — vế chốt của `an7.32:2.4` đã ghim.
  * 3.8 — Pāli giống hệt `an6.33:1.7` đã ghim.

  Bất định đã xử lý ở 3.5: giữ dấu `—` ở cuối thay vì đổi thành `.` như xu hướng
  đo được của bản đã ghim (570 câu so với 41 câu giữ `—` trong tầng `an`), vì ở đây câu
  còn tiếp ngay ở 3.6 và `.` sẽ khẳng định sai ranh giới câu. Pāli là authority.

  Bất định đã xử lý ở 3.8: Pāli kết `aradhāyīti.` không có `’` trước `ti` (dữ liệu
  bilara), nên số ngoặc đóng theo từng khoá là 0 và bản Anh không mang dấu đóng.

  Lớp lấp: 5 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn
  bị mất.