notes: >-
  A householder asks the Buddha for four things worth having and hard to get — wealth, fame, long life, and a
  good rebirth — and is told they come from four accomplishments: faith, ethics, generosity, and wisdom. The
  third, wisdom, is then explained at length: five corruptions of mind each spoil a life, each is given up,
  and what remains is called "a noble disciple of great wisdom".

  The seven filled segments are the two places where the pinned edition's compression breaks the sequence it
  had itself set up, and both are repetition inside the text, so both are filled by reusing what the pinned
  edition already wrote.

  - `10.5`, `10.7` and `10.9` are verbatim `10.3` and `10.11` — the same five words standing alone after each
    of the five corruptions: "Akiccaṁ karonto kiccaṁ aparādhento yasā ca sukhā ca dhaṁsati." The pinned
    edition renders that clause once, at `10.3` and again at `10.11`, as "Your fame and happiness fall to
    dust." The fill takes that sentence for all three blanks. This matters more than it looks: `dhaṁsati` is
    the consequence clause, and giving it three different wordings would read as three different consequences
    of covetousness, sloth, and agitation than of the next corruption. Note that the pinned edition keeps
    second person here ("your fame") although the surrounding clauses at `10.2`–`10.4` have already moved to
    third person ("a mendicant… their fame"); the fill does not silently repair that, because doing so would
    make the fill disagree with the two pinned segments that state the identical sentence.

  - `12.2`–`12.5` are the four remaining corruptions in the closing sequence, each verbatim in structure
    after `12.1` ("When a noble disciple has given up these things, ") and after the pinned `11.2`–`11.5`
    ("Knowing that ‘ill will …’ …"). The fill keeps the "corruption of the mind" phrase the pinned edition
    uses throughout `11.x` and `12.1`, and changes only the verb: `pahīno hoti` rather than `pajahati`, since
    the sequence here is about what has been given up, not about what is being abandoned. The nouns are the
    pinned edition's own — "ill will", "dullness and drowsiness", "restlessness and remorse", "doubt" — so the
    five corruptions do not change name between the list at `10.2`–`10.10` and the list at `11.1`–`11.5`.

  `ambiguity_integrity` is 9.3 because the second-person wording inherited at `10.5`/`10.7`/`10.9` is a
  deliberate inconsistency with the surrounding third-person narration, carried over on purpose so the fill
  agrees with the pinned segments that state the same sentence. It is a real tension in the English column and
  is recorded rather than smoothed away.

  Triangulation is capped at 8.0: Sujato translates none of these seven segments.