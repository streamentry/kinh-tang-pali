notes: |-
  Không có tiền lệ “Yampi, bhikkhave”: bài song song ud5.5 cũng để trống các khoá
    tương ứng (ud5.5:10.2/11.2 trống đã kiểm). Bộ từ lấy từ khoá Sujato ngay trước
    mỗi khoá (7.3, 8.1, 9.4, 9.8: “gradually slants, slopes, and inclines, with no
    abrupt precipice”, “leviathans, leviathan-gulpers, leviathan-gulper-gulpers,
    titans, dragons, and centaurs”, “a hundred leagues long … five hundred leagues
    long”, “gradual training, progress, and practice”, “the stream-enterer … the
    perfected one, and the one practicing for perfection”); mở đầu “The fact that,
    mendicants,” theo trật tự Pāli; giữ “;” cuối; 8.2/9.9 giữ MỘT dấu lược …
    (chốt cấm chữ pe trong bản lấp), không mở rộng.

    BẤT ĐỊNH: khung “The fact that, mendicants,” là của dự án; câu 8.2/9.9 ngắt
    giữa chừng bằng … nên mạch Anh cụt — terminology 9.3, ambiguity_integrity 9.2,
    vietnamese_clarity 9.2.

    rven88.py cờ “leviathan … leviathan” ở 8.2: HỢP LỆ, tên hợp chất của Sujato ở 8.1.

    Lớp lấp: 4 khoá nằm ở phần bản đã ghim đã lược. Triangulation 8.0: không có
    bản Anh độc lập phủ.
