notes: |-
    Đây là lát mà luật "dùng lại cách dịch đã có" áp dụng gần như tuyệt đối: 4.3–4.8 là
    Moggallāna kể lại nguyên văn cuộc nói với Vappa, và bản đã ghim đã dịch sẵn 2.1–2.5
    trong chính bài. Nên 4.3 mượn y nguyên 2.1, 4.4 mượn y 2.2, 4.7 mượn y 2.4, 4.8
    mượn y 2.5 — không dịch lại từ Pāli trong cô lập. 4.7 còn có thêm tiền lệ chéo
    (an4.195:2.4, cùng chuỗi Pāli).

    Dấu ngoặc bám từng khoá: 4.3 mở `‘` và 4.4 đóng `’`, 4.6 (của Sujato) mở `‘` và
    4.8 đóng `’` — y hệt cách bản Việt đã publish xử lý. Ở 5.5, bản đã ghim đã gộp
    5.5+5.6 vào 5.3 và đóng sẵn cả `’?”`; tôi vẫn viết `‘Sir, why is this? What's the
    meaning of that'?` theo đúng dấu của Pāli ở 5.5, cùng cách bản Việt đóng `‘` ngay
    tại 5.5. Hệ quả là cột Anh có một `'` thừa so với bản đã ghim; giữ nguyên Pāli là
    hơn làm cho vế đóng trông đẹp.

    4.5 là khoá duy nhất không có tiền lệ byte-trùng: `Evaṁ vutte, bhante, … maṁ
    etadavoca:`. Sujato thường rút gọn cụm này thành "He said to me:" (14 chỗ khớp
    Pāli trong bản đã ghim, dn2:17.1 là ví dụ), còn dn21:1.7.10 giữ "When I finished, …
    said to me,". Tôi theo dn21:1.7.10 ("When that was said, sir, …") vì giữ mạo từ và
    tên người nói, đồng thời theo cách gọi tên đã ghim ở 1.2: "Vappa of the Sakyans, a
    disciple of the Jains".

    Lớp lấp: 6 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị
    mất. Triangulation 8.0: người viết lớp lấp cũng là người chấm, nên đây không phải
    một cách đọc Anh độc lập.
