notes: |-
    Sáu khoá là sáu vế của một khuôn lặp, và bản đã ghim đã dịch hai vế đầu-cuối đủ để
    khoá cả khuôn: 1.1–1.3 cho `saddhā`, 2.1 gộp bốn mệnh đề thành "You don't become
    unskillful as long as conscience … prudence … energy … wisdom is established in
    skillful qualities", và 5.2–5.3 cho `paññā`. Sáu khoá của tôi là sáu mệnh đề mà bản
    đã ghim đã lược.

    Thuật ngữ lấy từ tiền lệ có đếm, không tự đặt:
    `hirī` → "conscience" (Sujato dùng ở dn34:1.8.37, dn33:2.3.13, mn53:12.1,
    mn110:16.2; đếm 54 đoạn khớp Pāli, 187 đoạn có chữ).
    `ottappa` → "prudence" (66 đoạn khớp Pāli, 158 đoạn có chữ).
    `vīriya` → "energy" và `paññā` → "wisdom" theo đúng 2.1 và 5.2 của bài.
    `duppaññā` → "witlessness" theo 5.2.
    `kosajja` → "laziness" (an6.65:1.3 và 2.3 cho "laziness"; an1.84:1.1–1.2).

    BẤT ĐỊNH, và đây là điểm yếu thật của lát: `ahirikaṁ` và `anottappaṁ` không có một
    chuỗi Sujato nào dùng độc lập. Sujato phủ định chúng theo kiểu liệt kê phối hợp —
    an6.65:1.3 và 2.3 dịch cả ba `assaddhiyaṁ, ahirikaṁ, anottappaṁ` thành "Lack of
    faith, conscience, and prudence", dn33:1.9.7 và sn45.1:2.1 cũng vậy — chứ không có
    "lack of conscience" (15 đoạn) hay "lack of prudence" (0 đoạn) đứng riêng. Tôi dựng
    "lack of conscience" và "lack of prudence" để giữ đối xứng với "conscience" và
    "prudence" mà bản đã ghim đã dùng, nhưng đây là cấu pháp của lớp lấp. "shamelessness"
    chỉ đếm 1 lần nên tôi không dùng. Vì vậy terminology hạ 9.1 và ambiguity_integrity
    hạ 9.1.

    Cụm "But when X vanishes and Y takes over," mượn nguyên khuôn 1.2 ("But when faith
    vanishes and faithlessness takes over,") và 5.2.

    Triangulation 8.0: người viết lớp lấp cũng là người chấm, nên đây không phải một
    cách đọc Anh độc lập.

    Lớp lấp: 6 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị
    mất.
