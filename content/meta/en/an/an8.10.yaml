notes: |-
  Tiền lệ: 3.2 đã ghin trọn ba vế bằng "Its roots, stem, and leaves would look just the same
  as the healthy barley." 3.3 (`nāḷaṁ`) và 3.4 (`pattaṁ`) là hai vế còn lại; bản dịch dùng
  lại đúng ba từ "stem", "leaves", "would look just the same as the healthy barley" mà bản
  đã ghin dùng, nên ba khoá đọc liền như một danh sách.
  Bất định: `seyyathāpi aññesaṁ bhaddakānaṁ yavānaṁ` là "giống như cây lúa tốt khác", nhưng
  bản đã ghin rút gọn thành "the healthy barley"; giữ theo bản đã ghin và ghi lại vì đây là
  chỗ có thể đọc khác.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
