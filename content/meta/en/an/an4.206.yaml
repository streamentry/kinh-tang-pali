notes: |-
  `3.3` và `5.3` là vế thứ mười (`attanā ca …vimutti hoti, parañca …vimuttiyā
  samādapeti`) của danh sách mười phẩm chất, và Sujato đã nuốt luôn chúng vào 3.2 và
  5.2. Bản đã ghim đã đặt `micchāvimutti` thành "wrong freedom" và `samādapeti`
  thành "encourage" (… "And they encourage others in these same qualities"), nên bản
  này giữ nguyên hai từ đó và chỉ tách vế ra: "They themselves have wrong freedom,
  and they encourage others in wrong freedom." Ba bài `an4.206`/`an4.208`/`an4.210`
  có Pāli giống hệt nhau, nên dùng chung một cách dịch.

  KHÔNG có tiền lệ: đã tra toàn cache Pāli của SuttaCentral và tìm cụm này — chỉ có
  đúng sáu khoá (hai khoá trong ba bài trên), và bản đã ghim để trống cả sáu. Vì vậy
  hai khoá này là chỗ DUY NHẤT trong lát của tôi không có bản Anh nào để đối chiếu
  kể cả gián tiếp, nên `triangulation` bị chặn ở 8.0 theo đặc thù của lớp lấp và
  `ambiguity_integrity` hạ: cách chia câu ("themselves … others") là lựa chọn biên
  tập, không có tiền lệ bắt buộc.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
