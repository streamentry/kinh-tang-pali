notes: |-
  **Phân loại 23 khoá (đo bằng máy trên Pāli root và tầng Sujato đã ghim): A dùng lại nguyên văn = 4 · B dựng lại = 10 · C tự dịch = 5 · D báo = 4.** A gồm cả khoá lặp nguyên văn một khoá lấp trước đó trong cùng bài; B là Pāli gần (tỉ lệ khớp từ 0,6) một khoá đã có lời, chỉ chèn phần tầng ghim nuốt mất; D là Pāli trùng nguyên văn với khoá đã ghim nhưng lời đã ghim khác nhau, hoặc lớp lấp cố ý lệch (nêu từng khoá bên dưới).

  **B (10 khoá) và A (4 khoá), tách theo nhóm:**
  · **3.4, 4.4, 5.3, 6.5 (B, tỉ lệ 0,90–0,94, nguồn 2.5).** Pāli `ujugatamevassa tasmiṁ samaye cittaṁ hoti X ārabbha` chỉ đổi `tathāgataṁ` thành `dhammaṁ / saṅghaṁ / sīlaṁ / cāgaṁ`. Lớp lấp lấy lời 2.5 (“At that time their mind is quite unswerving, based on the Realized One.”) và thay vế cuối: “the teaching”, “the Saṅgha”, “their ethical precepts” (đúng chữ của 5.1 và 5.2 đã ghim), “their generosity” (6.1, 6.4).
  · **7.4, 7.5, 7.6, 7.7 (B, 0,88–0,92, nguồn 7.3).** Tầng ghim gộp cả năm đức (faith, ethics, learning, generosity, wisdom) vào 7.3 và để 7.4–7.7 trống: “When those deities passed away … because of their faith, ethics, learning, generosity, and wisdom.” Lớp lấp dịch từng đức từ Pāli (`yathārūpena sīlena samannāgatā …`) thành “Those deities who were endowed with that kind of ethics / learning / generosity / wisdom passed away from here and were reborn there. I, too, have the same kind of …”. Lớp lấp bám sát Pāli (`samannāgatā` là “endowed with”) thay vì chữ “because of” mà tầng ghim đã dùng để gộp. Vì 7.3 vẫn mang cả năm đức, bài hiện lặp ý ở 7.3 và 7.4–7.7: lặp ấy do tầng ghim, hiện ra chứ không giấu. 7.7 đóng nháy đơn khớp `saṁvijjatī’ti`.
  · **8.3 (B, 0,72)** “The Worthy of Offerings chapter, the first.” theo khuôn các khoá lấp an5.180, mil3.3.14; tên chương lấy từ 0.2 (“Worthy of Offerings”). 8.2 là nhãn thứ tự: “Tenth.”; bài là an6.10 nên nhãn khớp số mục (không có chỗ lệch).
  · **9.0–9.4 (C và B 0,61, bài kệ mục lục).** Dịch theo đúng khuôn các bài lấp an7.43, an5.180, an10.50: “Its summary verse:” rồi mỗi dòng. Tên các bài lấy từ tiêu đề đã ghim của an6.1–an6.10 (Worthy of Offerings, Faculties, Powers, The Thoroughbred, Unsurpassable, Topics for Recollection, With Mahānāma). `dve āhuneyyā` là “Two on Worthy of Offerings” và `tayo ājānīyā` là “three on the Thoroughbred”.
  · **A (4 khoá): 3.5, 4.5, 5.4, 6.6.** Pāli trùng với 2.6 và 7.10; dùng lại nguyên văn “A noble disciple whose mind is unswerving finds inspiration in the meaning and the teaching, and finds joy connected with the teaching.”.
  **D (4 khoá): 3.6, 4.6, 5.5, 6.7.** Pāli trùng nguyên văn với 2.7 và 7.11 nhưng tầng ghim dịch 2.7 là “When they’re joyful … they feel bliss” còn 7.11 là “When you’re joyful … you feel bliss”. Cả ba khối 3–6 nói về “a noble disciple” ở ngôi thứ ba nên lớp lấp dùng “they” (như 2.7); không tự hòa hai cách dịch, đã ghi lại.

  Dấu lược: 0 khoá của lớp lấp có `…`. Tầng ghim có `…` thừa ở 3.3, 4.3, 5.2, 6.4 (bốn khoá, Pāli không có) — ngoài lát, chỉ báo. Nháy: khớp Pāli ở cả 23 khoá.

  **Khoá còn trống:** 0 trong 23 khoá `fillableSegments` (đã lấp hết; đo bằng máy: không còn khoá Pāli nào của bài thiếu cả tầng Sujato lẫn lớp lấp). **Coverage** (Pāli ≥ 40 ký tự, bỏ khối `:0`): trước 35/51 = 0.6863; sau khi `published` 51/51 = 1.0000. Độ nhạy: ngưỡng 0,8 cho phép thiếu tối đa 10 khoá có nội dung (phần nguyên của 0,2 × 51); trước lát bài thiếu 16. `content/meta/reference-gaps.yaml` **có** record của `an/an6.10` (substantiveSegments 51, substantiveWithoutEnglish 16, coverage 0.6863). Khi lớp lấp `published` coverage lên 1,0 nên record đó thành thừa; người điều phối sinh lại bằng `npm run reference:gaps`, lát này không sửa tay tệp đó.

  **Triangulation 7.7.** Bản Việt canonical của bài (`content/meta/sutta/an/an6.10.yaml`) do cùng họ công cụ làm, rà soát hoặc chấm với lớp lấp (đối chiếu `translators` / `assessed_by` / `reviewers` với `source/tooling.yaml`), nên lớp lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English của lớp này. Đối chiếu thực có: Pāli root + tầng Sujato đã ghim (45/68 khoá có lời) + bản Việt canonical để đối chiếu nghĩa (không dịch vòng, không chép). Không có bản Anh độc lập nào cho 23 khoá lớp lấp, nên chấm không quá 8,0.

  **technical_integrity 9.6:** không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối. Không đặt blocker vì chưa chạy.
