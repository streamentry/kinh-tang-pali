  **Chỗ lớp lấp CỐ Ý lệch tầng Anh đã ghim, kèm lý do.** (1) **Khung câu.** Lời ghim `3.2`/`5.2` kết bằng “And they encourage others **in these same qualities**”, còn mười hai khoá lấp kết bằng “… and they encourage others **to be X too**”. Lý do đo được: `3.2`/`5.2` đã in **trọn** bảy mục trong một ô, nên câu của nó có chủ ngữ và danh sách ngay trong ô và không cần gọi tên lại; mười hai khoá lấp thì mỗi ô phải **đứng được một mình** khi người đọc quét cột Anh — gọi “these same qualities” ở từng ô sẽ bắt người đọc phải nhớ ô trước. Tôi đo tần suất cả lớp lấp `published` (792 tệp) để chọn: “encourage others to …” **40** khoá, “encourage others in …” **18**, “encourage others to refrain …” **18**, “to do the same” **9**, “to be …” **2**. (2) **“They themselves”.** Tôi **giữ** `attanā` thành “themselves”, vì cặp tự–khác chính là ý của câu (`attanā` = tự mình, `parañca` = người khác). Đo trong đúng khuôn `attanā … parañca … samādapeti` của họ `an4` 200: **6** khoá lấp đã xuất bản giữ “themselves” (`an4.206`, `an4.208`, `an4.210` × “They themselves have wrong freedom, and they encourage others in wrong freedom.”) và chỉ **2** khoá bỏ nó (`an4.204`), nên tôi theo đa số. (3) **`5.5` và `5.7` lệch tính từ của tầng ghim** (“learned” → “learn much”, “mindful” → “established mindfulness”), vì Pāli ở hai khoá đó nói **hai từ khác** với Pāli ở `4.2`; xem mục “Ba chỗ phải tự phân xử”. (4) Vì `3.2`/`5.2` của tầng ghim đã in trọn danh sách, người đọc bốn cột sẽ thấy nội dung của `3.3`–`3.8` và `5.3`–`5.8` in **hai lần**: một lần dồn trong lời `3.2`/`5.2`, một lần ở lớp lấp. Lặp ấy là do tầng ghim nói trước; giữ đúng một vế mỗi khoá là giữ đúng Pāli, và tôi không thể sửa tầng ghim.

