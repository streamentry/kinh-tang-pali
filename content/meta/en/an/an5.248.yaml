notes: >-
  `ānisaṁsā manosucarite` ở 1.8 lệch cản: `ānisaṁsā` là số nhiều cái, `manosucarite`
  là số nhiều giống đực. Lệch này nằm trong bản Pāli đã ghim, không phải lỗi đọc.
  Nghĩa vẫn rõ: năm lợi ích của thiện hạnh tâm. Bản đã ghim ở 1.1 đã dịch vế này
  là "benefits in good mental conduct", và 1.8 là câu chốt lặp lại. Ghi lại vì một
  bản hiệu đính Pāli sau này có thể sửa cản này, và khi đó bản Anh này phải theo.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
