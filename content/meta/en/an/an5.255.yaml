notes: >-
  Bản đã ghim ở 1.3 đã gộp CẢ năm loại keo kiệt vào một câu ("Stinginess with
  dwellings, families, material things, praise, and the teachings."). Nếu 1.4 dịch
  lại trọn danh sách thì hai khoá kề nhau lặp. Ở đây dịch đúng ba dấu lược mà Pāli
  để — `…` ngăn ba vị, không phải lược nội dung. `lābha` dịch "gain" (bản đã ghim
  dịch "material things", cũng được nhưng kém trực tiếp hơn vì `lābha` là thu
  nhập, không phải vật chất).
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
