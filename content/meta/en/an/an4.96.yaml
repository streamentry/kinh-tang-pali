notes: |-
  an4.96 và an4.99 có **cùng tiêu đề** trong tầng Anh đã ghim ("10. Titans" ở `0.2`, "Training Rules"/"Removing Greed" ở `0.3` khác nhau) và cùng bốn loại cá nhân theo lợi ích của mình và của người khác. Khung bốn khoản là: `2` = chỉ vì mình, `3` = chỉ vì người khác, `4` = không vì ai, `5` = vì cả hai. Mỗi khoản có bộ ba `rāga/dosa/moha vinaya`, và Sujato nhét cả ba vào khoá đầu (`2.2`, `3.2`, `4.2`, `5.2`) rồi để trống `dosa`, `moha`.

  Đây là **dịch mới từ Pāli**, bám đúng khung của bản ghim:
  - `rāgavinaya` giữ là **"practice to remove their own greed"** (Sujato dùng `remove`, không dùng `abandon` hay `overcome`); `dosa` → **hatred**, `moha` → **delusion**, cùng hệ với "greed, hate, and delusion" ở `2.2`.
  - `no paraṁ … samādapeti` giữ là **"don’t encourage others to do the same"** (khung `2.2`).
  - `paraṁ … samādapeti` giữ là **"encourage others to remove theirs"** (khung `3.2` và `5.2`).
  - `no paraṁ … samādapeti` ở khoản `4` giữ là **"nor do they encourage others to remove theirs"** (khung `4.2`), **không** đổi thành "but don’t" — vì `4.2` đã dùng "nor" và Pāli cũng là `no … no …`.

  Phủ định giữ đúng phạm vi: `attanā na … paṭipanno` = **không** tự thực hành (khoản `3`, `4`); `na … paṭipanno` ở khoản `4` là **không** thực hành **và** **không** khích lệ. Không khoá lấp nào đảo thứ tự `attanā` với `paraṁ`.

  ⚠ Một điểm tôi **không** chép từ bản ghim, và nói rõ để không ai tưởng là sót: bản ghim dùng "their own hatred" nhưng `vinaya` thì không có "their own" — tức "practice to remove their own hatred" là cách nói của tôi cho `attanā dosavinayāya`, giữ đúng mức độ của "greed, hate, and delusion" ở `2.2`. Người đọc cột Anh vẫn thấy cùng một chủ thể `an individual`/`they` xuyên suốt.

  Dấu lược: quét cả 31 khoá — **không** khoá Pāli nào của an4.96 mang `…pe…` hay `…` trần, nên không khoá lấp nào được thêm dấu lược. (an4.99 mới có `…pe…` ở `4.2` và `5.2`.)

  ⚠ **Lớp lấp này KHÔNG phải lớp đọc Anh độc lập cho an4.96.** `content/meta/sutta/an/an4.96.yaml` ghi `quality.assessed_by: "GLM-5.3 Flash (ZCode)"` cùng một dòng review đối kháng, **khác** công cụ đã viết lớp lấp này, nên `triangulation` để **8.0**. Tôi **không sửa** scorecard tiếng Việt.

  Coverage đo lại bằng phép của kho: Pāli có nội dung 23 khoá, `english-sujato` phủ 15 (0.652), thêm tám khoá lấp thành 23/23 = 1.0, vượt ngưỡng 0.8.

  ⚠ **Record gap sẽ thành thừa — cần chạy lại `npm run reference:gaps`.** `content/meta/reference-gaps.yaml` hiện có entry cho bài này, và số trong entry đó **khớp đúng** số tôi đo lại bằng phép của kho. Khi lớp lấp này ở `status: published`, `englishCoverageFor` sẽ tính nó vào coverage và tỷ số thành 1.0; test `a fill never leaves a gap record it has cured` trong `tests/unit/english-fill.test.ts` sẽ **báo đỏ** vì entry ấy không còn mô tả đúng hiện trạng. Tôi bị cấm sửa `content/meta/reference-gaps.yaml`, nên việc gỡ entry nằm ngoài tầm của lát này.

  Điểm `technical_integrity` = 9.6 vì lát này bị cấm chạy cổng. Còn lại: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
