notes: |-
  Tiền lệ: 3.6 đã ghin "However their faith, conscience, prudence, energy, and wisdom don't
  last or grow, but dwindle away." và 4.6 đã ghin "And their faith, conscience, prudence,
  energy, and wisdom lasts, neither dwindling nor growing." 3.9 và 4.10 lấy lại đúng hai mẫu
  đó, với `paññā` thay cho danh sách năm phẩm chất.
  Bất định nhỏ: `neva tiṭṭhati no vaḍḍhati hāyatiyeva` là phủ định kép, bản đã ghin dịch
  "don't last or grow" (giữ "don't"), bản dịch theo đúng vậy.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
