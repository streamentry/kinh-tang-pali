notes: |-
  **Bốn loại khoá (đo bằng script trên từng khoá, so Pāli↔Pāli chứ không Pāli↔Anh):
  A = 0 · B = 9 · C = 1 · D = 0.** Không khoá nào có Pāli trùng nguyên văn với một khoá đã có lời
  trong cùng bài, nên không có khoá nào buộc phải chép nguyên văn; chín khoá là dựng lại, và chỉ
  `10.3` là dịch từ đầu.

  **Nhóm B — chín khoá `3.1`–`4.4`, dựng lại từ khối `2.1`–`2.4` đã ghim.** Khối Pāli `2.x`, `3.x`,
  `4.x` là cùng một công thức, chỉ khác ở gốc từ: `kāyasaṅkhāraṁ` → `vacīsaṅkhāraṁ` → `manosaṅkhāraṁ`.
  Bốn nhân tố `Sāmaṁ` / `Pare` / `sampajāno` / `asampajāno` giữ nguyên qua cả ba khối. Tỉ lệ khớp đo
  được, Pāli đối Pāli: `3.1`←`2.1` 0,967 · `3.4`←`2.3` 0,968 · `3.5`←`2.4` 0,973 · `4.1`←`2.1` 0,967 ·
  `4.2`←`2.2` 0,968 · `4.3`←`2.3` 0,968 · `4.4`←`2.4` 0,973.
  Hai khoá còn lại đo kiểu khác vì chúng bị cắt khác: `3.2` là **tiền tố** của `2.2` bỏ vế kết quả
  (tỉ lệ 0,920 với đúng tiền tố ấy; vế kết quả đó là `3.3`), và `3.3` là **đuôi nguyên văn** của `2.1`
  — cùng một vế `yaṁpaccayāssa taṁ uppajjati ajjhattaṁ sukhadukkhaṁ`, khác đúng dấu kết `;`/`.`.
  Vế kết quả này có mặt ở **14** khoá của bài này.

  **Phần tầng đã ghim nuốt mất mà lớp lấp chèn lại, tính từng khoá:**
  · cả chín khoá: mệnh đề `yaṁpaccayāssa …` mà tầng đã ghim **không** dịch ở `2.2`–`2.4` vì đã bịa
    dấu lược `…` cắt mất; lớp lấp dịch đủ và dùng **nguyên văn** cụm của tầng đã ghim ở `2.1`/`5.2`/`5.3`:
    "conditioned by which that pleasure and pain arise in oneself" (cụm này xuất hiện nguyên văn trong
    **8** trên 10 khoá của lớp lấp).
  · `3.1`, `3.4`, `3.5`, `4.1`–`4.4`: gốc từ. Tầng đã ghim ở `2.1` đã nới "the choice" thành
    "the choice that gives rise to bodily, verbal, and mental action", nên nếu lớp lấp chép y hệt thì
    `3.x` và `4.x` sẽ mất hẳn thông tin *là khối nào* — tức là đúng thứ mà tầng đã ghim đã nuốt. Lớp lấp
    dựng lại "the verbal choice" / "the mental choice".
  · `3.4`, `4.3`: tầng đã ghim chỉ còn "after deliberation" / "without deliberation" ở `2.3`/`2.4` rồi bịa
    `…`. Lớp lấp giữ nguyên hai cụm ấy và nối tiếp bằng vế kết quả.
  · `3.2`: vì `2.2` bị bỏ trống phần sau, lớp lấp phải tự dựng "Or else others instigate the verbal choice;"
    và **không** thêm vế kết quả — vì Pāli của `3.2` kết ở `abhisaṁkharonti;`.

  **Nhóm C — `10.3` (`Paṭhamaṁ.`), dịch "First."** Đây là khoá dưới ngưỡng 40 ký tự (9 ký tự) nên
  **không** vào mẫu số của coverage; nó được lấp vì nằm trong `fillableSegments` và vì nguyên nhân
  tầng đã ghim để trống ở đây là có thật và đo được: trong toàn tầng Anh đã ghim có **301** khoá Pāli
  là `Paṭhamaṁ.` và **301/301** đều trống. Cần nói thẳng: đây là khoá đầu tiên trong toàn bộ tầng lấp
  của dự án đặt trên một khoá liệt kê thuần (`Paṭhamaṁ.`/`Dutiyaṁ.`/…) — đo trên các tệp lấp hiện có
  trước lát này là **0**. Nó không làm thay đổi một điểm coverage nào.

  **Không khoá trống nào còn lại.** Tổng số khoá tầng Anh đã ghim để trống ở bài này là **10**, tất cả
  đều nằm trong lát này và đều đã lấp. (Bài có 49 khoá Pāli; 3 khoá `:0` là khối tham chiếu.)

  **Cặp Pāli trùng byte trong bài: 2, đo toàn tầng.** `8.4`≡`9.2` và `8.5`≡`9.3`. Cả hai đều **không**
  nằm trong tập lấp, và tầng đã ghim dịch chúng **giống hệt nhau**, nên không phát sinh nhóm D. Nhóm D
  = 0, và cũng không có cặp Pāli trùng nào trong tập lấp.

  **Ngoặc kép — 0/0 khớp Pāli ở cả 10 khoá.** Pāli của `3.1`–`4.4` và `10.3` không có `“”` lẫn `‘’`
  (đo từng khoá), nên lớp lấp không khoá nào có dấu nào. Đây là kết quả đo, không phải lựa chọn: bốn cột
  của bài đặt cạnh nhau, mà `1.1` và `6.1` đã ghim mở ngoặc kép ở đúng chỗ Pāli mở.

  **Dấu lược — 0 ở cả 10 khoá, khớp Pāli.** Pāli của cả 10 khoá không có `…` nào, nên lớp lấp không thêm
  dấu lược nào. Ngược lại, tầng đã ghim ở chính bài này có lỗi dấu lược ở **4** khoá, đếm được:
  `2.2`, `2.3`, `2.4` **bịa** `…` ở nơi Pāli viết đủ; `5.3` **mở rộng** cả ba `…pe…` của Pāli thành văn
  xuôi (Pāli 6 dấu `…`, tầng đã ghim 0). Hai lỗi sau đều là lớp lấp phải sửa chứ không sao chép, và khoá
  `5.3` là khoá đã ghim nên lớp lấp không có cách nào chữa.

  **Một lỗi nữa của tầng đã ghim, đáng kể hơn dấu lược: `2.1` nới số ít thành ba.** Pāli `2.1` là
  `kāyasaṅkhāraṁ` — **một** danh từ — nhưng tầng đã ghim dịch thành "the choice that gives rise to
  bodily, verbal, and mental action". Đếm toàn tầng Anh đã ghim, cụm "bodily, verbal, and mental" ứng với
  Pāli số ít `…saṅkhāraṁ` xuất hiện ở đúng **2** khoá: `an4.171:2.1` và bài song song `sn12.25:11.1`.
  Cùng một cặn bài ấy, `sn12.25:12.1`–`13.4` (Pāli giống hệt `3.1`–`4.4` của bài này, chỉ khách xưng
  `ānanda`) cũng trống ở tầng đã ghim — nên lớp lấp của bài đó đã có tiền lệ trong chính tầng lấp của
  dự án, và lớp lấp này bám đúng lựa chọn ấy: "the verbal choice", "the mental choice", số ít.

  **Xưng `bhikkhave`: đo trước khi quyết, và quyết theo số đo.** Trong chính bài này Pāli có `bhikkhave`
  ở **16** khoá; tầng đã ghim dịch thành "Mendicants" ở đúng **2** khoá — `1.1` và `6.1` — và đó là hai
  khoá duy nhất mà Pāli **mở ngoặc kép** (`“`). 14 khoá còn lại tầng đã ghim bỏ. Đó là quy ước nội bộ
  nhất quán (gọi một lần lúc mở đoạn trích, không gọi lại khi lặp), không phải lỗi. Cả 10 khoá của lớp
  lấp đều **không** mở ngoặc kép, nên lớp lấp theo đúng quy ước ấy và không thêm "Mendicants". Lý do phụ
  nữa cũng đo được: tầng lấp của dự án đã làm thế cho `sn12.25:12.x`–`13.x` — cùng Pāli, khác
  `ānanda`/`bhikkhave` — và nếu lát này thêm "Mendicants," vào giữa các vế vụn (`3.2`, `3.3`, `4.2`…)
  thì cột Anh sẽ lệch với chính tiền lệ đã có trong dự án. Đây là điểm lớp lấp **cố ý lệch** với dũng
  khí của Pāli theo nghĩa đen, nên ghi ra ở đây.

  **Điểm phải nói thẳng vì người đọc bốn cột sẽ thấy: `3.2` đọc như một câu dở.** Pāli ở khối `3` cắt
  **một** câu của `2.2` thành hai khoá — vế `Pare vāssa … abhisaṁkharonti;` ở `3.2`, vế kết quả ở `3.3` —
  trong khi ở khối `4` cùng câu đó nằm trọn trong `4.2`. Đó là cách upstream cắt segment, không phải
  lỗi dịch. Lớp lấp bám đúng ranh giới khoá; nếu đọc `3.2` đứng riêng thì dễ tưởng Pāli đang nói về
  hành động không kèm hậu quả, và đó là cái bẫy đã bắt một lát trước ở `sn11.24`. Ghép `3.2` với `3.3`
  mới là câu đầy đủ, và nối lại được trọn vẹn (đo được: `3.2` + `3.3` khớp `4.2` ở mức 0,963 với hai
  khác biệt duy nhất là đổi gốc từ và dấu kết).

  **`triangulation` 8,0 — và bài này không được tuyên bố là đã đối chiếu English.** Hai lý do, một
  lý do giảm, một lý do tăng. Giảm: chín trong mười khoá là **dựng lại** từ chính lời của tầng đã ghim,
  nên ở những khoá ấy lớp lấp không phải một lớp đọc Anh độc lập; và tại commit đang ghim
  SuttaCentral không có bản Anh thứ hai phủ bài này. Tăng: scorecard Việt của `an4.171` ghi
  `quality.assessed_by` là `GLM-5.3 Flash (ZCode)` và `translators` là `Kinh Tạng Pāli Project` —
  **khác** công cụ lớp lấp (`source/tooling.yaml`: `aliasInMetadata: "OpenCode Space Bunny Free
  (agent)"`), và bản Việt canonical có đủ cả 10 khoá này để đối chiếu nghĩa. Nhưng người viết lớp lấp
  cũng là người chấm, nên vẫn không nâng quá 8,0.

  **Coverage — đo trước và sau bằng số.** Mẫu số là Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`):
  49 khoá Pāli − 3 khoá `:0` = 46, trong đó **44** khoá đủ ngưỡng. Trước lớp lấp: **35/44 = 0,7955**,
  thiếu đúng 9 khoá là `3.1`–`4.4`. Sau khi `published`: **44/44 = 1,0000**.
  Độ nhạy ngưỡng 0,8: cần **36/44**, nên chỉ cần lấp **1** trong 9 khoá là qua (36/44 = 0,8182); lấp
  đủ 9 thì lên 1,0000 và **không còn biên độ nào** — mọi khoá Pāli có nội dung đều có chữ Anh.

  **Hệ quả với `content/meta/reference-gaps.yaml`: bài này CÓ record, và record ấy sẽ thành thừa.**
  Record của `an4.171` ghi `substantiveSegments: 44`, `substantiveWithoutEnglish: 9`, `coverage: 0.7955`
  — khớp đúng phép đo trên. Sau khi lớp lấp này `published`, bài đạt 1,0000 nên record đó là một tuyên bố
  sai (nói rằng vẫn thiếu 9 khoá English trong khi không còn khoá nào). Tôi **không** chạm tệp đó: nó
  sinh tự động từ `npm run reference:gaps`, và đây là việc của người điều phốn khi gom lát.

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build` trong lát này (cấm của người điều phốn), nên **không** tuyên bố technical gate pass.
  Bốn lệnh đó còn lại cho người điều phốn. Phép đo trong ghi chú này chỉ đọc tệp, không sửa gì ngoài hai
  tệp của lát.