notes: |-
  **Phân loại theo máy trên 17 khoá: A 0 · B 16 · C 1 · D 0.** Dùng lại **nguyên văn** từ cùng bài: 0 khoá (đúng bằng số khoá nhóm A). Đã dò 0 nhóm Pāli trùng nguyên văn trong bài (tổng 0 khoá, gồm cả khoá đã ghim lẫn khoá lấp); với mỗi nhóm đó, mọi khoá lấp đều mang cùng lời với khoá còn lại của nhóm, ngoại trừ các khoá D đã nêu. Số khoá đã ghi: 17/17 khoá `fillableSegments`.

  **Hình dạng của chỗ trống.** Mười sáu khoá `Yampi, bhikkhave, … ayampi dhammo …` là câu kết của từng mục trong hai chuỗi (mười mục “không đưa đến thương mến” `3–10`, và mười mục “đưa đến” `15–22`). Tầng đã ghim dịch ở khoá `X.1` của mỗi mục rồi đóng khoá bằng dấu “…”, nên câu `Yampi …` hoàn toàn rỗng; chỉ hai mục đầu của mỗi chuỗi (`2.2`, `14.2`) và mục cuối (`11.2`, `23.2`) được dịch trọn. Một khoá còn lại là nhãn thứ tự `26.5`.

  **Cách dựng lại (B, 16 khoá).** Nguồn là câu kết đã ghim của cùng chuỗi: `2.2` (0,88–0,91 với `3.2`–`8.2`), `11.2` (0,87 với `9.2`, 0,90 với `10.2`), `14.2` (0,88 với `15.2`, 0,69–0,73 với `16.2`–`20.2`), `21.1` (0,74 với `21.2`), `23.2` (0,73 với `22.2`). Tỉ lệ thấp ở nhóm `16.2`–`22.2` đo sự khác nhau của dạng Pāli (có `…pe…`), không phải sự khác nhau về nghĩa. Phần mà tầng đã ghim nuốt mất là **vế điều kiện** `Yampi, bhikkhave, bhikkhu X hoti Y na vaṇṇavādī` (tầng ghim chỉ dịch vế kết “This quality …”); lớp lấp chèn lại vế ấy bằng đúng lời của khoá `X.1` đã ghim cùng mục (bỏ “Furthermore,” và dấu “…” cuối) rồi gắn câu kết chuẩn: “When a mendicant is not eager to train, and doesn’t praise taking up the training, this quality too doesn’t conduce to …”. Chữ “too” dịch `ayampi`, mà tầng đã ghim bỏ ở `2.2`/`14.2`.

  - Chín khoá `3.2`–`10.2` và `15.2`: Pāli viết **đủ** `ayampi dhammo … saṁvattati` ⇒ English viết đủ “fondness, respect, esteem, harmony, and unity”, không thêm “…”.
  - Bảy khoá `16.2`–`22.2`: Pāli có `ayampi dhammo …pe… ekībhāvāya saṁvattati` ⇒ đúng **một** “…”: “this quality … conduces to unity.” (`…pe…` = 1).

  **Nhãn thứ tự `26.5` `Sattamaṁ.` → “Seventh.”** theo khuôn nhãn đã dùng trong lớp lấp (mỗi dạng một cách, không ngoại lệ). Cảnh báo: nhãn là số thứ tự của bài trong chuỗi bài `an10`, bài này không tự mang đủ bảy mục nên không có gì trong bài để đối ứng; giữ vì bỏ đi là mất một khoá có thật.

  **Cố ý lệch tầng đã ghim.** (1) Thêm vế điều kiện “When a mendicant …” vào đầu câu kết, nơi tầng đã ghim chỉ có “This quality …”; (2) thêm “too”. Cả hai đều là phần Pāli có thật mà tầng ghim đã bỏ.

  **Ngoài lát / quan sát tầng đã ghim.** 16 khoá `X.1` đã ghim (`3.1`–`10.1`, `15.1`–`22.1`) đóng bằng “…” ở nơi Pāli của chính khoá ấy viết đủ (Pāli không có `…pe…` ở đó); lớp lấp không sao chép dấu ấy. Không phát hiện khoá có chữ nhưng bị cắt cụt (đo: 0 khoá có English < 20% Pāli).

  **Ngoặc kép / nháy — bảng đo tự động trên 17 khoá.** 17/17 khoá khớp Pāli từng khoá (đếm “ ” ‘ ’ đóng/mở; `’` có chữ thường đứng ngay sau tính là dấu nhạt lược). Không khoá nào lệch.

  **Dấu lược.** 7 khoá lấp có `…pe…` trong Pāli (`16.2`, `17.2`, `18.2`, `19.2`, `20.2`, `21.2`, `22.2`); tổng số `…` trong English của 17 khoá lấp = 7; khớp quy tắc `…pe…` = đúng một `…` (không khoá nào có `…` mà Pāli viết đủ).

  Không còn khoá rỗng nào ngoài các khoá đã lấp: 17/17 khoá `fillableSegments` đã được viết (không khoá nào dưới ngưỡng bị bỏ).

  **Coverage (đo thật).** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 60. Trước: 44/60 = 0,7333. Sau khi `published`: 60/60 = 1,0000 (lớp lấp phủ 16 khoá có nội dung; 1 khoá dưới ngưỡng không tính). Độ nhạy: ngưỡng 0,8 cần ≥ 48 khoá có lời; sau lấp còn dư 12 khoá trước khi rớt ngưỡng; trước lấp thiếu 4 khoá. Bài đã dưới ngưỡng trước khi lấp.

  **Hệ quả với `content/meta/reference-gaps.yaml`.** `an/an10.87` **có** record trong file đó; sau khi lớp lấp `published`, coverage = 1,0000 nên record thành thừa (test `a fill never leaves a gap record it has cured` sẽ đỏ nếu để lại). Không chạm file ấy trong lát này; để người điều phối sinh lại bằng `npm run reference:gaps`.

  **Triangulation 8,0 — không được tuyên bố là đối chiếu English độc lập.** Scorecard của bản Việt `content/meta/sutta/an/an10.87.yaml` do cùng họ công cụ với lớp lấp này chấm/dịch (xem `source/tooling.yaml`; `assessed_by` của lớp lấp trùng họ), nên bản lấp **không** phải một cách đọc English độc lập với bản Việt. Đối chiếu có: Pāli root + Sujato đã ghim (72 khoá) + bản Việt canonical (72 khoá, dùng để đối chiếu nghĩa, không dịch vòng, không chép). Bản Việt có khối `summary:` ở MN/DN nên **không chạm vào**; không sửa metadata Việt.

  **technical_integrity 9,6.** Không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, giao cho người điều phối. Không đặt blocker.
