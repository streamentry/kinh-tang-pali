notes: >-
  Sáu nguồn tai nạn được Pāli ghi bằng `-to` (nguồn gốc), nên dịch đều "by …" và
  giữ dấu gạch dài vì 3.3 còn chưa kết thúc. `dāyādato` = từ người thừa kế không
  được yêu, dịch "an unloved heir" theo đúng bản đã ghim đã dùng ở 3.1. Nếu dịch
  lệch thì 3.1 và 3.2 sẽ liệt kê hai bộ sáu khác nhau.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
