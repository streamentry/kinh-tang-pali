  của `an10.50` (`content/meta/sutta/an/an10.50.yaml`) ghi `quality.assessed_by` là
  `OpenCode Space Bunny Free (agent)` — **trùng** alias lớp lấp trong `source/tooling.yaml`. Tức lớp
  lấp này **không** phải cách đọc English độc lập: cùng một nhóm người làm cả hai lớp. Ngoài ra tại
  commit đã ghim **không** có bản Anh nào khác phủ các khoá này, nên trần 8,0 của lớp lấp là trần
  chung. Bản Việt canonical có đủ **51/51** khoá (khớp Pāli) và được dùng để **đối chiếu nghĩa** cho cả
  24 khoá — nó không phải nguồn dịch: mọi câu trong lớp lấp này dựng từ Pāli, và **14/24** khoá lấy
  nguyên văn hoặc dựng lại từ **lời tầng Anh đã ghim** (6 khoá A chép nguyên văn `4.5` + 8 khoá B dựng
  lại từ `X.1`); 10 khoá còn lại là colophon, dịch từ Pāli vì không có lời nào ở tầng để dựng lại. `vietnamese-current` chỉ có Pháp Cú nên
  **không** có bản Thích Minh Châu cho Tăng Chi Bộ — giới hạn của bản chụp upstream, đã ghi ở
  `content/meta/reference-gaps.yaml`.
  ⚠ Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` không có đối tượng ở một lớp lấp English;
  chúng được chấm theo cùng dải số như các lát lấp cùng loại, theo **dễ đọc và độ súc tích của bản
  Anh** với người đọc Việt, chứ không phải theo văn phong Việt.

  **Đối chiếu chéo trong bài, không sửa gì.** `an10.50:5.2` `6.2` `9.2` `11.2` có Pāli trùng **byte**
  với lớp lấp `an10.17` (`2.2` `3.2` `6.2` `8.2`); `an10.17` dùng "In that respect" còn lát này dùng
  "When" (xem mục lệch có chủ đích số 2) ⇒ **hai lớp lấp đọc cùng một Pāli theo hai cách**, đã ghi ở
  đây. Tương tự, `an10.86:20.3` lấp `Chaṭṭhaṁ.` = "Sixth." và lát này lấp `Dasamaṁ.` = "Tenth." — mỗi
  bài theo đúng Pāli của nó, không va chạm. `an10.84:15.3` = "Fourth.", `an3.70:40.5` = "Tenth."
  (`Dasamaṁ.` y hệt Pāli `an10.50:14.2`) — ba cách dùng một Pāli, một cách đọc.

  **Chưa phân xử được, không đoán.** `15.3` `abhiṇhaṁ` là **trạng từ** (“thường xuyên”) trong Pāli, ở
  đây đóng vai danh-mnemonic cho `an10.48` `Pabbajitaabhiṇhasutta` (tiêu đề đã ghim: *Ten Regular
  Reflections for a Renunciate*). Lớp lấp giữ nó ở dạng danh-mnemonic **Abhiñha** để khớp với cách
  `15.1`/`15.4` đã đặt tên các bài (`Vivādā` → *Dispute*, `bhaṇḍanā` → *Bhaṇḍana*), còn bản Việt
  canonical dịch mô tả (*Xem Xét Thường Xuyên*). Cả hai cách đều chấp nhận được; tôi ghi ra thay vì
  im lặng. Tương tự `15.2` `kusinārapavesane` nén **hai** bài (`an10.44` `Kusinārasutta` và `an10.45`
  `Rājantepurappavesanasutta`); lớp lấp dùng đúng tiêu đề Anh đã ghim của hai bài ấy (*At Kusinārā* /
  *Entering a Royal Compound*) để vệ `uddāna` liệt kê đủ mười bài của phẩm, và bản Việt canonical cũng
  đọc như vậy. Không còn điểm nào khác chưa phân xử.

  ⚠ **Hệ quả người đọc thấy được, nói thẳng:** vì tầng ghim bỏ trống cả vế `.2` và `.3` của tám mục,
  cột Anh sẽ hiện “Furthermore, a mendicant …” rồi ngay dưới là câu **đầy đủ** do lớp lấp viết, đồng
  thời `4.4` và `13.2` vẫn là hai câu bị rút còn 20–30% Pāli. Đó là hệ quả của việc bản đã ghim nuốt mất
  nội dung rồi bỏ trống, không phải lỗi dịch; bỏ thì 14 khoá có nội dung này lại trở về trống và
  coverage rơi lại 21/35.

