notes: >-
  Câu này GIỐNG HỆT `an4.168:3.3` — hai bài chỉ khác ở chỗ Sāriputta đã chọn
  `dukkhā khippābhiññā` còn Moggallāna chọn `sukhā khippābhiññā` (3.5 của mỗi bài,
  đã có chữ). `dandhābhiññā` dịch "slow insight" để đối lập với `khippābhiññā` mà
  bản đã ghim dịch là "swift insight"; `paṭipadā` dịch "practice", `dukkhā`/`sukhā`
  dịch "painful"/"pleasant" theo đúng hai từ bản đã ghim đã dùng. Trường hợp này
  là lý do luật của `sn11.24` tồn tại: nếu hai bài dịch lệch nhau, người đọc sẽ
  thấy Đức Thế Tôn dạy hai hệ thống phân loại khác nhau.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
