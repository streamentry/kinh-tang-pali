notes: |-
  Tiền lệ: `6.1`, `7.1`, `8.1` (đã ghim) đã dịch sẵn ba câu hỏi mà `6.3`, `7.3`, `8.3` dựa
  lại, và `5.3` (đã ghim) cho khuôn "This is the individual who …". Vì vậy ba khoá này giữ nguyên cả
  "but not" của `6.1`, cả "and … but not" của `7.1`, cả "…, …, and …" của `8.1` — dấu hiệu quan trọng
  vì nó nói lên cái nào đã được từ bỏ và cái nào chưa.

  Cờ `lặp cụm, một từ ngăn` ở `8.3` ("fetters … fetters") là HỢP LỆ, không phải lỗi: Pāli lặp
  `saṁyojanāni` ba lần cho ba nhóm kết trói, và câu này chép y nguyên bản đã ghim ở `5.3` và `8.1`.
  Không thể viết khác mà không phá vỡ sự khớp với bản đã ghim.

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
