notes: |-
  Phân loại 18 khoá đã ghi (đo bằng script, theo Pāli đã có lời trong cùng bài): A y nguyên = 0 · B dựng lại = 15 · C tự dịch = 3 · D (Pāli trùng, lời đã ghim khác nhau; báo, không tự hòa) = 0. Script phân loại theo Pāli trùng nên các khoá tách ra từ một khoá đã ghim bị gộp sẵn (đếm là C) được nêu riêng bên dưới.
  Số khoá đã ghi: 18 trên 18 khoá tầng Anh đã ghim để trống (0 khoá còn trống).
  Khoá còn trống: không còn khoá nào trong danh sách khoá để trống của bài này.
  Nhóm B (khoá ← khoá nguồn, tỉ lệ khớp do script đo): 1.4 ← 1.3 (0.75); 1.5 ← 1.3 (0.70); 1.6 ← 1.3 (0.77); 1.7 ← 1.3 (0.73); 1.8 ← 1.3 (0.70); 1.9 ← 1.3 (0.74); 1.10 ← 1.3 (0.71); 1.11 ← 1.3 (0.75); 2.4 ← 2.3 (0.82); 2.5 ← 2.3 (0.78); 2.6 ← 2.3 (0.84); 2.7 ← 2.3 (0.82); 2.8 ← 2.3 (0.78); 2.9 ← 2.3 (0.81); 2.11 ← 1.3 (0.73).
  Nháy: 0 khoá có số dấu nháy khác Pāli; các khoá còn lại khớp Pāli từng khoá.
  Dấu lược: 0 khoá chứa `…`; mỗi `…pe…` của Pāli tương ứng đúng một `…` của English, không khoá nào mở rộng.

  Tầng đã ghim gộp mười điều của mỗi nửa bài vào một khoá duy nhất: 1.3 (“They kill living creatures, steal, and commit sexual misconduct. They use speech that’s false, backbiting, harsh, or nonsensical. They’re covetous, malicious, with wrong view. And they encourage others to do these things.”) và 2.3 cho nửa lên cõi trời. Pāli thì tách chúng thành 1.3–1.12 và 2.3–2.12. Vì vậy 18 khoá lấp (1.4–1.12 và 2.4–2.12) đều ≥ 40 ký tự, nằm trong mẫu số coverage, và đều thừa nội dung so với 1.3/2.3 ở nghĩa rằng chúng nhắc lại điều mà khoá gộp đã nói; đây là lặp do tầng đã ghim nói trước, Pāli gốc tách từng điều nên lớp lấp tách theo.
  Từ vựng lấy hoàn toàn từ 1.3 và 2.3: “kill living creatures”, “steal”, “sexual misconduct”, “false / backbiting / harsh / nonsensical speech”, “covetous”, “malicious”, “wrong view”; nửa tích cực dùng “refrain from …”, “contented”, “kind-hearted”, “right view” đúng như 2.3 đã dịch. Thêm “They themselves …, and encourage others to …” để giữ cặp `attanā ca … parañca … samādapeti` của Pāli, mà 1.3/2.3 chỉ nén thành “they encourage others to do these things”.
  Ratio gốc 0.25 là hệ quả đúng của việc Sujato chỉ để lời ở 1.3 và 2.3 (mỗi khoá nén cả mười điều) và để trống 18 khoá còn lại.
  Nháy và dấu lược: khớp Pāli (không khoá nào chứa nháy hay `…`).

  Cố ý lệch tầng đã ghim: Không có chỗ cố ý lệch tầng đã ghim.

  Coverage đo bằng mẫu số là các khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): trước 6/24 = 0.2500; sau khi `published` 24/24 = 1.0000. Ngưỡng 0.8 cần 20/24; trước lớp lấp còn thiếu 14 khoá, lớp lấp thêm 18 khoá có nội dung.

