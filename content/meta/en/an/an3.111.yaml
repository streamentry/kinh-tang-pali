notes: |-
  Follows Sujato's 1.4/2.4 frame exactly, narrowing only the subject term as
    the P demands (dosa, moha, adosa, amoha): Sujato's 1.4 lists all three roots
    even though its P names only lobha-terms, but copying the triple list into 1.5
    would erase the P's own distinction, so each fill names one root. Term mapping
    is Sujato's own from 1.3/2.3 (hate, delusion; love, understanding). Partial
    support: "Any deed that emerges from hate …" in an3.34:6.1. The narrowing is a
    real choice, hence terminology 9.3 and ambiguity 9.3.
    Triangulation is capped at 8.0 for every text of the fill layer.
