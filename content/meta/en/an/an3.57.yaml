notes: |-
  `1.8`–`1.12` là Vacchagotta **dẫn lại nguyên văn** bốn câu ông vừa đọc, và bản Việt canonical cũng vậy. Bốn câu Pāli đó đã có bản Anh ghim ở `1.4`–`1.7`, nên tôi **dùng lại nguyên văn** đúng những cách dịch ấy, chỉ đổi vỏ ngoài theo dấu câu Pāli:
  - `1.4` (`mayhameva dānaṁ …;`, mở `‘`) ↔ `1.9` (`mayhameva dānaṁ ….`, mở `"`) → "Gifts should only be given to me, not to others."
  - `1.5` ↔ `1.10` → "Gifts should only be given to my disciples, not to the disciples of others."
  - `1.6` ↔ `1.11` → "Only what is given to me is very fruitful, not what is given to others."
  - `1.7` (`…mahapphalan’ti.`) ↔ `1.12` (`…mahapphalan”’ti.`) → "Only what is given to my disciples is very fruitful, not what is given to the disciples of others.”’"

  `1.8`: Pāli `evamāhaṁsu` (số nhiều) khác `evamāha` ở `1.3`, nên dịch "Those who say", đúng như cách Sujato dịch `2.1` (`"Vaccha, those who say this`). Cụt `‘the ascetic Gotama says this:` chép từ `1.3`.

  `2.4` là **phần đuôi sau `…pe…`** ở `2.3`, nên bắt đầu bằng chữ thường và không thêm chủ ngữ. `nāññesaṁ sāvakānaṁ` là "… của người khác", không phải "… cho người khác" — bản Việt canonical ở `2.4` dịch là "không nên bố thí cho đệ tử của người khác", hơi lệch; tôi theo Pāli: "not to the disciples of others.”’".

  ⚠ **Hai lỗ trống nằm ngay trước `2.4`.** `2.2` (`‘samaṇo gotamo evamāha:`, 24 ký tự) và `2.3` (`“mayhameva dānaṁ dātabbaṁ …pe…`, 31 ký tự) để trống ở tầng ghim nhưng dưới ngưỡng 40 nên không vào lát này. Đây là chỗ tệ nhất của lát: `2.1` (đã ghim) → **hai lỗ trống** → `2.4` (lấp của tôi), nên cột Anh mất luôn mệnh đề dẫn. Tôi **không** tự ý lấp vì ngoài lát được giao, nhưng đây là chỗ nên giao tiếp.

  ⚠ **Hai chỗ dễ sai, đã soi kỹ.** (1) Thứ tự nháy: Pāli và bản Việt canonical đều đóng `”’` (kép rồi đơn) ở `1.12` và `2.4`; còn `an11.12` đóng `’”` (đơn rồi kép) vì ở đó có nháy lồng — tôi ban đầu viết sai chiều ở `an11.12:2.3` và đã sửa. (2) `1.8` giữ `bho gotama` → "worthy Gotama", đúng như tầng ghim dịch `1.3`; bản Việt canonical bỏ mất danh xưng này ở `1.8`.

  **Triangulation ở đây là 8.0, không phải 7.5** — hai bài `an3.57` / `an3.65` là hai bài duy nhất trong lát mà metadata tiếng Việt do `GLM-5.3 Flash (ZCode)` chấm, khác công cụ của lớp lấp. Vẫn không có bản Anh độc lập phủ cho các khoá lấp, nên 8.0 là trần của lớp này.

  Điểm `technical_integrity` = 9.6 vì lát này bị cấm chạy cổng. Còn lại: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
