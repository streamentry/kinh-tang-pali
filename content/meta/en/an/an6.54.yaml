notes: |-
  Bài là Dhammikasutta. Cùng một đoạn được kể bốn lần (mục 1, 2, 4, 6) với nội dung y hệt, và
  bản Anh đã ghim đã lược nguyên vệt của mục 4 và mục 6. Đây là lát lấp thuần theo luật 2:
  Pāli trùng byte thì lấy nguyên văn bản ghim.

  Mười khoá lấy NGUYÊN VĂN, không dịch lại. Phép đo bằng script (so byte Pāli giữa khoá lấp và
  mọi khoá đã ghim trong cùng bài) cho ra:
    4.2 ≡ 2.2,  4.3 ≡ 2.3,  4.4 ≡ 2.4,  4.5 ≡ 2.5,  4.6 ≡ 2.6,  4.8 ≡ 2.8
    6.2 ≡ 2.2,  6.3 ≡ 2.3,  6.4 ≡ 2.4
  Còn 4.7 ≡ 2.7 ≡ 1.4 ≡ 3.6 ≡ 5.6 — xem bất định (1) bên dưới, vì năm khoá này KHÔNG cùng
  một cách dịch trong bản ghim.
  6.5 là khoá DUY NHẤT phải dựng, xem (2).

  (1) BẤT ĐỊNH PHẢI GHI — bản ghim tự mâu thuẫn, và đây là lựa chọn của lớp lấp:
  Pāli của 4.7 trùng byte với 2.7, 1.4, 3.6 và 5.6, nhưng bản ghim dịch hai kiểu:
    2.7 (và 4.7 theo lớp lấp này): "…do not stay. They leave, abandoning the monastery."
    1.4 / 3.6 / 5.6:                 "…did not stay. They left, abandoning the monastery."
  Thật ra khác biệt là CŨNG HỢP LÝ về mặt ngữ pháp: 1.4/3.6/5.6 kể việc đã xảy ra (thì quá khứ),
  2.7 đang nêu điều kiện để hỏi nguyên nhân (thì hiện tại). Lớp lấp chọn theo 2.7 vì mục 4 là bản
  LẶP CỦA MỤC 2 — 4.2 ≡ 2.2, 4.3 ≡ 2.3, 4.4 ≡ 2.4, 4.5 ≡ 2.5, 4.6 ≡ 2.6, 4.8 ≡ 2.8 đều đã
  được chọn theo 2.x, nên 4.7 chọn theo 2.7 là nhất quán trong chính mục. Nhưng đây là lựa chọn
  biên tập, không phải điều Pāli bắt buộc, nên ambiguity_integrity hạ 9.2. Người đọc bốn cột sẽ
  thấy 1.4/3.6/5.6 và 4.7 dùng hai thì khác nhau cho cùng một câu Pāli.

  (2) 6.5 là khoá dựng: Pāli `Atha kho jātibhūmakānaṁ upāsakānaṁ etadahosi: "ayaṁ kho āyasmā
  dhammiko āgantuke bhikkhū akkosati …pe….` ghép 2.5 với NỬA ĐẦU của 2.6 rồi lược mất phần
  giữa (`paribhāsati vihiṁsati vitudati roseti vācāya`). Bản lấp dịch phần có mặt và GIỮ NGUYÊN
  một `…`, không mở rộng — chỗ bị lược có dấu, người đọc biết là thiếu. Không viết tiếp
  "he insults, harms, attacks, and harasses them" vì đó là chữ không nguồn nào cấp phép ở đúng
  khoá này.

  (3) LỆCH DẤU HỎI CÓ CHỦ Ý Ở 4.8 — phải ghi vì đây là nơi hai luật của lớp lấp xung đột:
  Pāli 4.8 là `Yannūna mayaṁ āyasmantaṁ dhammikaṁ pabbājeyyāmā”ti.` — KHÔNG có dấu hỏi.
  Nhưng bản ghim dịch 2.8 là "Why don’t we banish Venerable Dhammika?”" — CÓ dấu hỏi, và đó
  là dịch đúng của một câu hỏi tiếng Anh. Bỏ `?` sẽ ra "Why don’t we banish Venerable
  Dhammika”." — tiếng Anh hỏng. Đo bằng script trên 2986 khoá fill đã publish: 2962 khớp, 24
  lệch (99.2% khớp); cả hai trường hợp lệch CÓ khoá trùng Pāli đã được ghim
  (sn24.5:3.4 và 3.13 lấy nguyên văn 3.19) — tức tiền lệ của kho là tái dùng nguyên văn, giữ
  cả dấu câu. Lớp lấp chọn nguyên văn của bản ghim và ghi lệch này ra thay vì giấu.

  Bản Việt hiện hành: KHÔNG có. `content/translation/vi/project/sutta/an/` không có tệp cho
  an6.54 và `content/meta/sutta/an/an6.54.yaml` cũng không tồn tại — đo bằng script, 0 tệp cả
  hai. Tầng `vietnamese-current` tại commit đã ghim chỉ có Pháp Cú. Triangulation 8.0: mười
  khoá nguyên văn từ bản ghim, một khoá dựng từ Pāli cộng hai khoá đã ghim làm khuôn. Không có
  scorecard Việt nào để rơi vào trường hợp "cùng công cụ" — nên 8.0, không hạ xuống 7.5.

  Technical gate: bị cấm chạy. Còn lại bốn lệnh — `npm run validate`, `npm test`,
  `npm run check`, `npm run build`. technical_integrity 9.6 vì lý do đó, không phải 10.0.
