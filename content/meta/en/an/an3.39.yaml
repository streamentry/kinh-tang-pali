notes: |-
  Bộ `7.1`–`7.3` là bản rút gọn của bộ `6.4`–`6.8`: Sujato đã gộp cả ba vào `7.1`
  ("Intoxicated with the vanity of youth, health, or life, a mendicant resigns the
  training…"), còn `6.6` đã dịch vế "ārogyamadamatto" thành "Intoxicated with the
  vanity of health …". Vì vậy:

  * `7.2` chép lại đúng lời của `6.6` ("Intoxicated with the vanity of health"), rồi
  để dấu lược `…` ở đúng chỗ Pālli đặt nó (`bhikkhu …pe…`).
  * `7.3` chép lại đúng vế của `7.1` ("a mendicant resigns the training and returns
  to a lesser life"), và KHÔNG thêm dấu nháy đóng: Pāli ở 7.3 không mang `”`.

  Hệ quả: cột Anh đọc lên sẽ lặp "of life" hai lần liền. Giữ vì bỏ là mất nghĩa.

  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
