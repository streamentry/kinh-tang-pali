notes: >-
  Câu y hệt `an10.53:7.4`, chỉ khác dấu chấm và ngữ cảnh (`paṭilābhāya` ở 5.5 =
  "để đạt được"). Hai bài nằm ở hai vị trí khác nhau trong Aṅguttara nên phải viết
  lại, nhưng bộ từ phải y hệt — nếu lệch thì người đọc so sánh hai bài sẽ tưởng
  đó là khác biệt ý nghĩa.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
