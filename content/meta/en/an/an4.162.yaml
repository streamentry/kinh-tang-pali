notes: |-
  Đây là lát **dịch mới thật**, không phải chép lại. an4.162 hỏi bốn câu hỏi (`khổ/lạc` × `chậm/nhanh`), và mỗi câu trả lời có **một** bản tiêu chuẩn ba mục: `Idha, bhikkhave, ekacco pakatiyāpi [tibba-]X-jātiko hoti, abhikkhaṇaṁ X-jaṁ dukkhaṁ domanassaṁ paṭisaṁvedeti.` Sujato dịch **cả ba mục** vào **một** khoá đầu tiên của mỗi cặp (`2.2`, `3.2`, `4.2`, `5.2`) rồi để trống mục `dosa` và `moha` (`2.3`-`2.4`, `3.3`-`3.4`, `4.3`-`4.4`, `5.3`-`5.4`).

  Vì vậy tôi dịch tám khoá từ Pāli, nhưng **bám khung của chính bản ghim** để cột Anh không đổi giọng giữa `2.2` và `2.3`:
  - Khung dương: `2.2` ghim là "It's when someone is ordinarily full of acute greed, hate, and delusion. They often feel the pain and sadness that greed, hate, and delusion bring." — tôi giữ nguyên "ordinarily full of acute", "often feel the pain and sadness that … bring", chỉ thay danh từ.
  - Khung âm: `4.2` ghim là "It's when someone is not ordinarily full of acute greed, hate, and delusion. They rarely feel the pain and sadness that greed, hate, and delusion bring." — tôi giữ "not ordinarily full of acute", "rarely feel …".
  - `tibba-` giữ là **"acute"** vì đó là từ Sujato đã dùng cho `tibbarāga`; `nābhikkhaṇaṁ` giữ là **"rarely"** vì đó là từ Sujato đã dùng cho nó ở `4.2`.

  ⚠ Bốn cặp khoá có Pāli **trùng byte** trong chính bài, nên cách dịch phải trùng tuyệt đối:
  - `3.2` ≡ `2.2` (Pāli) ⇒ `3.3` phải y hệt `2.3`, `3.4` phải y hệt `2.4`.
  - `5.2` ≡ `4.2` (Pāli) ⇒ `5.3` phải y hệt `4.3`, `5.4` phải y hệt `4.4`.
  Bốn khoá này **không** phải bản dịch riêng, chúng là bản lặp bắt buộc.

  ⚠ Một điểm tôi **không** chép từ bản ghim, và nói rõ để người đọc không tưởng là sót: bản ghim ở `2.2` nói "greed, hate, and delusion" cho **cả ba** mục, tức người đọc cột Anh ở `2.2` đã biết trước hai mục còn lại. Tôi không lặp lại danh sách đó ở `2.3` và `2.4`, vì Pāli mỗi mục chỉ nhắc **một** nguyên nhân (`dosajaṁ`, `mohajaṁ`) — lặp lại danh sách sẽ là thêm chữ không có nguồn. Bản Việt canonical cũng làm đúng như vậy: `2.3` chỉ nói "khổ não do sân sanh ra", `2.4` chỉ nói "do si sanh ra".

  Dấu lược: quét cả 43 khoá, **một** khoá Pāli mang `…pe…` là `4.6` `saddhindriyaṁ …pe… paññindriyaṁ.` (không thuộc lát này; Sujato đã dịch đủ "faith, energy, mindfulness, immersion, and wisdom"). Tám khoá lấp không mang dấu lược nào trong Pāli, nên không khoá nào được thêm.

  Nghĩa thuật ngữ: `dukkhā/sukhā paṭipadā` = "painful/pleasant practice", `dandhābhiññā` = "slow insight", `khippābhiññā` = "swift insight" — giữ nguyên hệ từ của bản ghim ở `2.1`, `3.1`, `4.1`, `5.1`. `pañcindriyāni mudūni/adhimattāni pātubhavanti` = "manifest weakly/strongly" ở `2.5`/`3.5`/`4.5`/`5.5` — không nhắc lại ở các khoá lấp vì Pāli các khoá lấp không có câu đó.

  ⚠ **Lớp lấp này KHÔNG phải lớp đọc Anh độc lập cho an4.162.** `content/meta/sutta/an/an4.162.yaml` ghi `quality.assessed_by: "GLM-5.3 Flash (ZCode)"` cùng một dòng review đối kháng, **khác** công cụ đã viết lớp lấp này, nên `triangulation` để **8.0**. Tôi **không sửa** scorecard tiếng Việt. Trung thực mà nói: tám khoá ở đây là bản dịch của chính tôi, và bản Anh đã ghim **không** phủ chúng (đó là lý do chúng nằm trong lát này), nên không có bản Anh nào độc lập để đối chiếu. Bản Việt canonical là tầng đối chiếu duy nhất.

  Coverage đo lại bằng phép của kho: Pāli có nội dung 32 khoá, `english-sujato` phủ 24 (0.750), thêm tám khoá lấp thành 32/32 = 1.0, vượt ngưỡng 0.8.

  ⚠ **Record gap sẽ thành thừa — cần chạy lại `npm run reference:gaps`.** `content/meta/reference-gaps.yaml` hiện có entry cho bài này, và số trong entry đó **khớp đúng** số tôi đo lại bằng phép của kho. Khi lớp lấp này ở `status: published`, `englishCoverageFor` sẽ tính nó vào coverage và tỷ số thành 1.0; test `a fill never leaves a gap record it has cured` trong `tests/unit/english-fill.test.ts` sẽ **báo đỏ** vì entry ấy không còn mô tả đúng hiện trạng. Tôi bị cấm sửa `content/meta/reference-gaps.yaml`, nên việc gỡ entry nằm ngoài tầm của lát này.

