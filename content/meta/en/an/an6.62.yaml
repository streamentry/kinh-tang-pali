notes: |-
  **Phân loại 39 khoá (đo bằng máy): A = 29 · B = 5 · C = 2 · D = 3.** Cả 39 khoá nằm trong tập khoá tầng Anh đã
  ghim để trống. Bài là Ānanda kể lại (`3.x`) rồi sáu lần lặp công thức “imassa kho puggalassa…” ở `7`–`12`; tầng đã ghim
  chỉ dịch phần mở và phần ví dụ, để trống phần “Evamevaṁ kho ahaṁ…” áp dụng.

  **Nhóm 1 — `3.2`–`3.8`, kể lại cho Đức Phật (từ phần dẫn chuyện `2.1`–`2.6`).** Tầng đã ghim gộp vào `3.1`.
  · B: `3.2` ← `2.1` (0,67), `3.3` ← `2.2` (0,89), `3.4` ← `2.3` (0,67), `3.6` ← `2.5` (0,67; Pāli gần như giống `2.5`, chỉ khác chỗ
    đặt nháy: `3.6` không có ‘ trước `āpāyiko` và đóng ’ ở cuối).
  · A: `3.5` ← `2.4` (1,00) “Reverend Ānanda, when the Buddha declared that Devadatta was”; `3.8` ← `2.6` (1,00) “You’re right,
    reverend, that’s how the Buddha declared it.” với ’” theo Pāli (`byākatan’”ti`).
  · C: `3.7` “When he said this, sir, I said to that mendicant,”.

  **Nhóm 2 — công thức lặp (A, 27 khoá).** Pāli trùng nguyên văn (1,00) với khoá đã có lời nên lấy nguyên lời:
  · “Both skillful and unskillful qualities are found in this individual.” ← `7.2` cho `7.11`, `8.11`, `9.9`, `10.18`, `11.15`, `12.9`;
  · “After some time I encompass their mind and understand:” ← `7.3` cho `7.12`, `8.12`, `9.10`, `10.19`, `11.16`, `12.10`;
  · `7.13`, `10.20` ← `7.4`; `8.13`, `11.17` ← `8.4`; `7.14` ← `7.5`; `8.14` ← `8.5`; `10.21` ← `10.8`; `11.18` ← `11.5`;
  · `8.17`, `9.13`, `10.24`, `11.21` ← `7.17`; `8.18`, `10.25`, `11.22` ← `7.18`.
  B (1 khoá): `9.14` ← `7.18` (0,87): Pāli kết bằng `hotī”ti` nên thêm ” cuối.

  **Nhóm 3 — D (3 khoá): `9.12`, `10.23`, `11.20`.** Pāli `Evampi kho, ānanda, tathāgatassa purisapuggalo cetasā ceto paricca
  vidito hoti.` xuất hiện ở `7.16` và `12.12` (lời đã ghim đủ: “This is how another individual is known to the Realized One by
  encompassing their mind.”) và ở `8.16` (lời đã ghim “This is how another individual is known to the Realized One …” — thêm … dù
  Pāli đủ, và rụng “by encompassing their mind”). Hai lời khác nhau; lớp lấp dùng lời đủ của `7.16`/`12.12`, không hoà.

  **C (1 khoá còn lại).** `13.3` “Eighth.” — nhãn `Aṭṭhamaṁ.`; đúng vị trí (`an6.61` mang `Sattamaṁ.`, `an6.63` mang `Navamaṁ.`).

