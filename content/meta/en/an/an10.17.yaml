notes: |-
  Mười khoá lấp ở đây đều là vế `Yampi …` lặp lại vế `Idha/Puna caparaṁ …` ngay trước nó.
  Nên **mọi** câu chữ ở đây lấy y từ bản đã ghim của chính X.1, không dịch lại:
  3.2 = 3.1 · 6.2 = 6.1 · 7.2 = 7.1 · 8.2 = 8.1 · 9.2 = 9.1 · 10.2 = 10.1, và
  1.6 / 2.2 / 4.2 lấy hai mảnh còn lại của 1.5 / 2.1 / 4.1. Đã kiểm bằng máy: trong mười khoá này
  có 14 mảnh câu (tách tại mỗi dấu lược), 12 mảnh là chuỗi con nguyên văn của X.1; hai mảnh còn
  lại đều thuộc 5.2 (xem dưới).

  `Yampi` dịch “In that respect”, bám cách Việt canonical của dự án cho đúng công thức này
  (`Dù trong phương diện ấy`, dùng y hệt ở `an10.17` và `an10.50`). Vế sau `ayampi dhammo
  nāthakaraṇo.` đã ghim sẵn: “This is a quality that serves as protector. ” / “This too is a
  quality that serves as protector. ”, nên “In that respect, …” nối vào đó đọc liền mạch.

  Dấu lược: 1.6, 2.2, 4.2, 5.2 có `…pe…` ⇒ GIỮ `…`, chỉ dịnh hai mảnh Pāli còn lại. Tầng đã ghim
  ở `an10.18:2.5` (cùng danh sách, không có vế `Yampi`) đã **mở rộng** dấu lược ấy; lớp lấp không
  được làm vậy, và không sửa tầng đã ghim.

  ĐIỂM DUY NHẤT KHÔNG LẤY Y NGUYÊN VĂN — 5.2: Pāli còn lại là `yāni tāni sabrahmacārīnaṁ` rồi
  `…pe…` rồi `alaṁ kātuṁ alaṁ saṁvidhātuṁ`; phần bị lược gồm cả `uccāvacāni kiṅkaraṇīyāni`,
  cả vị từ nối (`dakkho hoti analaso tatrūpāyāya vīmaṁsāya samannāgato`). Vì vậy bản lấp là một
  **mảnh văn câu** có `…` ở giữa: “a mendicant in the duties of their spiritual companions …
  able to complete and organize the work. ” — hai cụm đó vẫn là của tầng ghim (“duties for their
  spiritual companions”, “complete and organize the work”), nhưng không thể nối thành câu vì
  chính Pāli ở khoá này không có chủ ngữ với vị từ nối. Đây là hệ quả của dấu lược trong nguồn, đã
  ghi thẳng; vì vậy hạ `grammar_logic` 9.3 và `ambiguity_integrity` 9.2.

  Dấu chấm cuối: Pāli cả mười khoá kết bằng dấu phẩy, nhưng vế kế `ayampi dhammo nāthakaraṇo.`
  đã ghim là một câu mới. Dùng dấu chấm ở cả mười khoá cho đọc liền — cùng cách tầng ghim kết
  8.1 của `an10.18`, vốn cũng kết dấu chấm dù Pāli kết `dhammesu.`

  Triangulation 7.5: scorecard Việt của `an10.17` (`content/meta/sutta/an/an10.17.yaml`) ghi
  `assessed_by` “OpenCode Space Bunny Free (agent)” — cùng họ công cụ với lớp lấp, nên bản lấp
  **không** phải lớp đọc Anh độc lập cho bài này, và không được tuyên bố đã đối chiếu Anh độc
  lập. Bản Việt hiện hành (`vietnamese-current`) không có cho bài này ở commit đã ghim.

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate
  pass. Bốn lệnh đó còn lại cho người điều phối.

