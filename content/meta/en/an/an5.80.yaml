notes: |-
  Năm khoá (2.7, 3.6, 4.6, 5.6, 6.6) có Pāli **giống hệt nhau**:
  `paṭibujjhitvā ca tassa pahānāya vāyamitabbaṁ.` — y hệt `an5.79`, và cùng dùng
  chung một khuôn dịch.

  Tiền lệ: `an5.80:1.3` và `an5.80:7.3` đã ghim cùng mẫu câu với `tesaṁ` là "and
  try to give them up."; mười khoá của tôi là `tassa` nên đổi "them" → "it".
  `an5.79` cho cùng kết quả.

  `paṭibujjhitvā ca` bị nén theo đúng cách Sujato đã nén, vì vế trước `Taṁ vo
  paṭibujjhitabbaṁ;` đã gánh nghĩa "look out for".

  Phụ thuộc cần nói rõ: năm vế trước (`2.6`, `3.5`, `4.5`, `5.5`, `6.5`) đang trống ở
  **cả hai** tầng, tức là thuộc lát khác; đọc nối phụ thuộc cách họ dịch vế đó.

  Lớp lấp: 5 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn
  bị mất.