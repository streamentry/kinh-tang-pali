notes: |-
  an4.100 là `Potaliyasutta`: bốn loại người về tán thán / chê trách. Mười khoá lấp nằm ở **hai lần Potaliya
  kể lại** (`3.1`–`3.7`, `5.1`–`5.2`) và một vòng của Đức Phật (`4.1`–`4.2`).

  **Ba khoá chép nguyên văn bản Anh đã ghim**, vì Pāli trùng byte:
  - `4.1` ≡ `2.1` → y nguyên.
  - `5.1` ≡ `3.1` → y nguyên (hai khoá này cùng Pāli nên cùng cách dịch).
  - `5.2` ≡ `4.2` → y nguyên.

  **Bảy khoá còn lại là lặp lại Pāli đã có bản dịch**, nên tôi chép câu ghim rồi chỉ chèn xưng ngữ `bho gotama`:
  - `3.3`–`3.6` lặp `2.3`–`2.6`; `3.1` lặp `2.1`; `3.7` lặp `2.7`; `4.2` lặp `3.2` + `2.7`.
  - Xưng ngữ đặt **trước câu** (`Worthy Gotama, …`) vì đó là cách chính bản đã ghim tự dùng ở `3.8` và `3.11`
    (`“Worthy Gotama, of these four individuals, …`). Không chèn `Here` / `Furthermore` cho `Idha` / `Idha pana`
    vì bản ghim đã bỏ hai từ ấy; thêm vào thì lớp lấp lệch khỏi bản đã ghim ở chỗ không cần thiết.

  **Dấu lược — có một chỗ tôi CỐ Ý thêm dấu lược mà Pāli khoá đó không có, và phải nói rõ:**
  - `3.4` và `3.5`: Pāli hai khoá này viết **đủ** `bhūtaṁ tacchaṁ kālena` hai lần, **không có** dấu `…` nào;
    bản ghim ở `2.4` và `2.5` lại **thay** cụm đó bằng hai dấu `…` mỗi khoá. Tôi chép y nguyên hai dấu lược ấy.
    Lý do: vế trong `3.4` **trùng vế** trong `2.4` (chỉ khác xưng ngữ `potaliya` / `bho gotama`). Nếu tôi viết đủ
    `at the right time, truthfully and correctly` ở `3.4` trong khi `2.4` của Sujato vẫn lược, thì cùng một vế Pāli
    sẽ có hai cách dịch Anh ngay trong một bài — đúng thứ quy tắc dùng lại cấm. Đây là nơi lớp lấp **tiếp tay** một
    lựa chọn của bản ghim, nên người đọc phải biết: hai khoá này lược nhiều hơn Pāli, và nguyên nhân nằm ở `2.4`/`2.5`.
  - `4.2` và `5.2` mang `…pe…` trong Pāli nên tôi viết `What four? …` rồi nối tiếp — không mở ra bốn loại người
    (tức `2.3`–`2.6` không bị lặp lại ở đây). Đo trên bản ghim: `…pe…` ở cuối khoá thì Sujato để **một** dấu
    (787 mẫu trong `an`), nên một dấu là đúng với tiền lệ.
  - Ngược lại, **không** khoá lấp nào ở bài này có Pāli mang `…` mà tôi bỏ mất: đã kiểm đủ 10 khoá.

  **Một chỗ tôi không đồng hoá, có chủ ý:**
  - `3.6` (Pāli `… vaṇṇārahassa ca vaṇṇaṁ bhāsitā hoti`) — bản ghim ở `2.6` tách thành hai câu với `And they praise …`,
    còn bản ghim ở `3.8` và `5.3` cho cùng cấu trúc đó dùng dấu chấm phẩy `;` và vế sau cũng có `at the right time,
    truthfully and correctly`. Tôi theo `3.8` / `5.3` (dấu chấm phẩy + lặp lại cụm) vì `3.6` nằm ngay cạnh
    `3.8`, và vì `3.7` của tôi cũng dùng dấu chấm câu như `3.8`. Hai kiểu đều là của bản đã ghim; tôi chọn kiểu
    đứng liền khoá mình.

  **Dấu nháy kép ở `3.1`, `4.1`, `5.1`: tôi cố ý KHÔNG mở `“`.** Đo trên chính bản ghim:
  Pāli mở `“` ở `2.1`, `3.1`, `4.1`, `5.1` và đóng ở `2.8`, `3.11`, `4.6`, `6.4` — cân bằng 4/4.
  Nhưng Sujato, khi `3.1`–`3.7`, `4.1`–`4.2`, `5.1`–`5.2` còn trống, đã **dời dấu mở** sang chính khoá nó
  dịch đầu tiên trong mỗi lời: `3.8`, `4.3`, `5.3`. Đo cột Anh **trước** khi lớp lấp này: 4 `“` / 4 `”` —
  cân bằng, nhưng vị trí lệch hẳn Pāli. Nếu tôi mở thêm `“` ở `3.1`, `4.1`, `5.1` theo đúng Pāli thì cột Anh
  thành 7 `“` / 4 `”`. Tôi chọn **theo bản ghim** (như tiền lệ `an4.11`), vì một dấu nháy treo còn tệ hơn vị trí lệch,
  và vì tôi không có quyền sửa tầng `english-sujato`. Người đọc cần biết: dấu `“` của mỗi lời thoại hiện nằm ở
  `3.8` / `4.3` / `5.3`, không ở khoá mở đầu theo Pāli.

  Điểm: `triangulation` = 8.0 vì `content/meta/sutta/an/an4.100.yaml` ghi `assessed_by: GLM-5.3 Flash (ZCode)`
  (khác họ công cụ `OpenCode Space Bunny Free` nên chưa phải 7.5). Nhưng mười khoá lấp ở đây **không phải** bản dịch
  độc lập: tất cả đều là câu đã có trong bản Anh đã ghim, chỉ chèn xưng ngữ. Chúng là bằng chứng về tính nhất quất.
  Cột Anh của bài này vì thế gần như không có câu nào là do lớp lấp tự dịch từ Pāli — điều đó nên nói thẳng.

