notes: |-
  an4.108 là `Balibaddūpamāsutta` — bốn loại người ví như trâu bò (`balībadda`), mỗi loại một vòng
  ba khoá: `Evaṁ kho, bhikkhave, puggalo …` → `Seyyathāpi so, bhikkhave, balībaddo …` →
  `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi.` Sujato dịch vòng một (`2.1`–`2.4`) và **bỏ trống**
  vòng hai, ba, bốn (`3.3`–`3.5`, `4.3`–`4.5`, `5.3`–`5.5`). Bốn vòng này không có sẵn câu nào để dịch
  lại, nên tám khoá là chép khuôn của vòng một trong chính bài này; xem hai lựa chọn cố ý bên dưới.

  **Bốn khoá chép nguyên văn, không dịch lại — đây là phần quan trọng nhất của lát này.**
  `2.5`, `3.5`, `4.5`, `5.5` đều mang Pāli **trùng byte** `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ
  vadāmi.`. Đo bằng script trên toàn bộ lớp fill: Pāli ấy đã xuất hiện ở **26 khoá đang `published`**
  (`an4.101` 4, `an4.103` 4, `an4.104` 4, `an4.105` 4, `an5.249` 5, `an5.75` 5), và **cả 26** đều dịch
  bằng một câu duy nhất: `I say that this individual is like that.` Tôi chép y nguyên cả bốn.
  Vì sao không dịch lại lần thứ ba mươi: nếu tôi tự viết, chỉ cần trượt một chữ là cột Anh của dự án có
  hai cách dịch cho cùng một khoá Pāli ở bảy bài khác nhau. Sáu bài kia đã `published` và đã có người đọc.

  **Sáu khoá còn lại chép khuôn vòng một của chính bài, đổi đúng cặp tính từ:**
  - `3.3` ← `2.3` (`That’s how an individual is hostile to their own herd, not others.`), đảo hai vế.
  - `4.3` theo khuôn `ca … ca` (`sagavacaṇḍo ca … paragavacaṇḍo ca`) — đúng như `4.1` đã ghim
    (`hostile to both their own herd and others`), và đúng như bản Việt canonical `vừa … vừa`.
  - `5.3` theo khuôn `neva … no` — đúng như `5.1` đã ghim (`neither their own herd nor others`).
  - `3.4`, `4.4`, `5.4` ← `2.4` (`That individual is like an ox that’s hostile to its own herd, not others.`).

  **Hai lựa chọn cố ý, nói rõ để người biên tập đảo được nếu thấy sai:**
  1. `Seyyathāpi so` ở `2.4` của bản ghim **không** có `, I say.` (khác `an4.109:2.5` của chính Sujato,
     vốn có). Tôi theo vòng một của chính bài: **không** thêm `, I say.` ở `3.4`, `4.4`, `5.4`. Lý do cụ
     thể: khoá kế đã mang `I say` của chính nó, nên thêm nữa sẽ đọc liền thấy `I say` hai lần. Với `an4.109`
     tôi giữ `, I say.` vì bản ghim của bài ấy có. Hệ quả: hai bài anh em lệch nhau đúng một dấu phẩy —
     đây là hệ quả của bản ghim, không phải lựa chọn thẩm mỹ của tôi; người biên tập muốn đồng hoá thì sửa
     tầng `english-sujato`, không sửa ở đây.
  2. `4.4` dùng `their own herd` (nhân) còn `3.4`/`5.4` dùng `its own` (con trâu), vì `2.4` của bản ghim đã
     phân biệt đúng thế: người → `their`, con trâu → `its`. Tôi giữ nguyên sự phân biệt ấy.

  **Dấu lược:** không khoá Pāli nào của an4.108 trong tập lấp mang `…pe…` hay `…` trần, nên không khoá lấp
  nào được thêm dấu lược. Cột Anh của bốn vòng 2–4 vì vậy là văn xuôi liền, không có chỗ lược nào bị cắt.

  **Khoá trống còn lại:** `an4.108:5.7` = `Aṭṭhamaṁ.` — **9** ký tự Pāli, dưới ngưỡng 40 nên không tính
  coverage. Lấp được, nhưng ngoài lát `e12`.

  Điểm: `triangulation` = 8.0 vì `content/meta/sutta/an/an4.108.yaml` ghi `assessed_by: GLM-5.3 Flash
  (ZCode)` — khác họ công cụ `OpenCode Space Bunny Free`, nên chưa phải 7.5. Bốn trong mười khoá là bản
  dịch đã xuất bản của chính dự án; sáu khoá kia là chép khuôn có sẵn trong cùng bài, không phải tự dịch
  từ đầu.

