  Sáu khoá lấp của bài này **không phải dịch mới** — chúng là bốn sự an ổn được nói lần thứ hai. Nên tôi **chép thẳng từ tầng ghim bằng script**, không gõ tay, để không lệch một chữ:
  - `48.4` ← `43.3` (Pāli **giống hệt**)
  - `49.1` ← `44.1` (Pāli **giống hệt**)
  - `50.1` ← `45.1` + `45.2` (Pāli **ghép lại** y hệt; `45.2` là phần đuôi câu)
  - `51.1` ← `46.1` (Pāli **giống hệt**)
  - `52.1` ← `48.2` (Pāli **giống hệt**)
  - `52.2` ← `47.2` (chỉ khác `hontī”ti.` / `honti.`)

  Riêng `52.2` tôi bỏ dấu `…` mà bản ghim ở `48.3` có, vì ở `48.3` phần bị lược là chính `48.4`–`51.1` mà lát này đã lấp; bỏ đi thì bài không còn lỗ trống giữa `52.2` và `53.2`.

  ⚠ **Một chỗ đáng nói về dấu lược.** Tầng ghim ở `31.2` / `31.3` (Pāli có `…pe…`) **bung** thành "Does love come up in a person…" / "Does understanding come up in a person…" — đã có ba ngọn lửa bị mang nhầm sang bài khác trong dự án. Lớp lấp không làm thế ở bất kỳ khoá nào: hai khoá có `…pe…` trong lát là `sn45.134-138:1.13` và `sn45.98-102:1.13`, và cả hai giữ nguyên một `…`.

  **Triangulation ở đây là 8.0, không phải 7.5** — `content/meta/sutta/an/an3.65.yaml` do `GLM-5.3 Flash (ZCode)` chấm, khác công cụ của lớp lấp. Nhưng sáu khoá lấp ở đây lại **lấy thẳng từ chính bản Anh đã ghim trong cùng bài**, nên đây là lát mạnh nhất về sự nhất quán và yếu nhất về tính độc lập: đây là bản lặp, không phải lớp đọc Anh mới.

