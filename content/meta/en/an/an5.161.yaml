notes: |-
  Luật 3: Pāli của `1.6`, `1.8`, `1.10` trùng nguyên văn với `1.4` và `1.14`, bản Anh đã ghim
  đã dịch cả hai, nên ba khoá này chép y nguyên. Đây là cấu trúc có chủ ý của bài: mỗi khoá trong năm
  cách đều kết bằng cùng một câu.

  Đối chiếu lớp Việt: `an5.161:1.4`, `1.6`, `1.8`, `1.10`, `1.14` đều là "như vậy, sự bực bội nơi người
  ấy sẽ được trừ diệt", tức cùng một nghĩa với "That's how to get rid of resentment for that individual."
  Bản Anh đã ghim ở `1.9` và `1.11` xác nhận hai vế trước đó là "disregard … paying no attention" và
  "focus on the ownership of deeds", nên bốn khoá lấp đúng là các vế "love / compassion / equanimity /
  disregard" theo thứ tự.

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
