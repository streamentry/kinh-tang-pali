notes: >-
  The sutta teaches four things that can be known in four situations (ethics by living together, purity by
  dealing, resilience in hardship, wisdom by discussion), and then proves each one twice: first with a person
  observed directly, then with the same person observed through a simile — a small fish and a big fish rising
  in a lake. Six of the seven filled segments are the second proofs, and each is the same Pāli as the first
  proof earlier in the text, which the pinned edition translates. They therefore reuse that wording exactly.

  - `9.7` is verbatim `8.6`, `9.9` is verbatim `8.8`, `11.7` is verbatim `10.4`, `11.9` is verbatim `10.6`.
    Taken over word for word, so the four attributes of a profound saying ("peaceful, sublime, beyond the
    scope of logic, subtle, comprehensible to the astute") and the pair of verdicts ("witless, not wise" /
    "wise, not witless") stay identical across both halves of each proof. `9.7` and `8.6`, and `11.7` and
    `10.4`, are each verbatim identical in Pāli, checked rather than assumed, so there is no room for the two
    halves to drift.
  - `9.8` and `11.8` repeat `8.7` and `10.5` with only the polarity flipped (`na paṭibalo` / `paṭibalo`), and
    reuse the seven-verb series — "teach it, assert it, establish it, clarify it, analyze it, and reveal it"
    — with the negative polarity carried by "they’re not able to" and "can’t" rather than by rewriting each
    verb. Rewriting them into per-verb negatives is what would make the second proof read as a different
    claim from the first.

  `7.6` is the odd one out. It is the trailing clause of a sentence whose main clause the pinned edition
  already gave at `7.5`: "That’s why I said that you can get to know a person’s resilience in times of
  trouble. …". So `7.6` (`iti yaṁ taṁ vuttaṁ idametaṁ paṭicca vuttaṁ.`) is only "on account of this", given
  as a lower-case fragment behind the ellipsis Sujato leaves at `7.5`. The nearest precedent in the corpus is
  `mn131:11.2`, "That’s what I said, and this is why I said it.” — but that segment carries the whole clause,
  whereas here the pinned edition has already said "That’s why I said…", so repeating it would double the
  statement. Rendering only the missing half is why `ambiguity_integrity` is 9.3 and not higher.

  Two segments in this text are left blank and stay blank: `9.6` and `11.6` are `Taṁ kissa hetu?` — 17
  characters of Pāli, below the 40-character threshold that defines a substantive segment, so they are
  outside the coverage metric and outside this fill. The reader of the four-column view still sees those two
  cells empty, which is correct: an empty cell is a gap in that edition, not an absence of the text. The
  threshold itself is declared in `source/layers.yaml` and has not been touched.

  Triangulation is capped at 8.0: Sujato translates none of these seven segments.