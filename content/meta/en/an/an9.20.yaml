notes: |-
  **Phân loại 15 khoá (đo bằng máy, theo Pāli của từng khoá so với khoá có lời Sujato trong cùng bài):
  A = 0 · B = 6 · C = 9 · D = 0.**

  **Bối cảnh — tầng đã ghim dời nội dung.** Pāli 9.1–9.9 là đoạn **tóm lại** cả thang so sánh (Velāma → kiến
  cụ túc → … → tâm từ) rồi mới nói câu kết `yo ca accharāsaṅghātamattampi aniccasaññaṁ bhāveyya, idaṁ tato
  mahapphalataraṁ` ở cuối 9.9. Tầng đã ghim đặt nguyên câu kết ấy (“It would be more fruitful to develop the
  perception of impermanence …”) vào 9.1 và để trống 9.2–9.9. Lớp lấp dịch đúng Pāli từng khoá: 9.2–9.8 là
  các vế liệt kê (dạng “feeding …”, chữ thường đầu khoá vì Pāli là chuỗi `yo ca … bhojeyya`), 9.9 kết bằng câu
  so sánh và dấu `”` đóng như Pāli. Hệ quả: người đọc sẽ thấy câu kết hai lần (9.1 đã ghim và 9.9 lấp), và
  9.2 không nối ngữ pháp với 9.1 đã ghim. Không sửa được mà không shadow.

  **B (6 khoá) — từ vựng lấy nguyên của Sujato ở 7.1–8.9.** 9.2 (0,84 với 7.1), 9.3–9.6 (0,98 với 8.1–8.4),
  9.8 (0,77 với 8.7): “a hundred of those accomplished in view”, “once-returner”, “non-returner”, “perfected
  one”, “independent Buddha”, “a Realized One, a perfected one, a fully awakened Buddha”, “with a confident
  heart”, “undertake the training rules”.

  **C (9 khoá).** 9.7 (gộp 8.5 + 8.6), 9.9 (danh sách giới lấy của 8.8, tâm từ của 8.9, vô thường của 9.1).
  Ở 9.9, `idaṁ tato mahapphalataraṁ` dịch là “this is more fruitful than all of that” — chữ “all” theo cách
  hiểu của chính tầng đã ghim ở 9.1 (“than to do all of these things”); Pāli chỉ nói `tato` (“hơn thế”).
  9.10 `Dasamaṁ.` → “Tenth.”; 9.11 → “The Lion’s Roar Chapter, second.” (khuôn `an7.43`, `an3.70`); tổng tụng
  10.0–10.4 theo khuôn “Its summary verse:”, tên kinh lấy theo nhan đề Sujato của `an9.11`–`an9.20`. Bất
  định ghi thẳng: tổng tụng gọi `an9.18` là `mettā`, trong khi nhan đề Sujato là “The Sabbath with Nine
  Factors”; lớp lấp dịch theo chữ của tổng tụng (“Love”).

  **Ngoặc:** khớp Pāli 15/15. **Dấu lược:** Pāli 7 (`…pe…` tính một), lớp lấp 7.

  Triangulation 8,5: scorecard Việt của `an9.20` ghi `quality.assessed_by` là một công cụ **khác** alias
  của lớp lấp này, nên về mặt tác giả đây là lớp đọc Anh độc lập; vẫn thấp vì không có bản Anh thứ hai và 9.9
  dựa vào cách hiểu của tầng đã ghim. Đối chiếu có: Pāli root, Sujato đã ghim, bản Việt canonical. Không chạm
  tầng Việt.

  technical_integrity 9,6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`
  trong lát này, nên không tuyên bố technical gate pass. Bốn lệnh còn lại cho người điều phối.

