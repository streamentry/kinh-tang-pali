  **Mục 10 — lỗi tôi tự bắt trong chính phép đo, ghi lại vì người sau cần tin số nào.** (1) Đo cực
  nghĩa bằng `not` báo nhầm **9** khoả lệch; nguyên nhân: `not` không phải chuỗi con của `doesn't`, nên
  phải đếm `n't`. Số đúng là **0**. (2) Đo dấu nhạt lượng bằng `’(?=ti)` thì bỏ sót `doesn’t`. Sửa theo
  luật đã hiệu chuẩn. (3) Bộ dò "lời tầng ghim nuốt khoá kế" bản đầu dựng run trống từ chính khoá
  trống đầu tiên nên khoá "đứng trước" lại là khoá trống; sửa thì bắt đúng 2/2 ở `an4.202` và 2/2 ở
  `an4.203`. (4) Bộ dò thứ hai dựa trên đồng xuất hiệp toàn tầng thì báo đúng **8** lần nuốt giả trên
  `sn55.27`; nguyên nhân: `bhikkhave`, `eva`, `kho`, `puggala` đi với gần như mọi từ tiếng Anh nên
  không phân biệt được. (5) Bộ dò thứ ba lấy chững từ khoá khác **cùng bài** thì còn 2 lần giả ở
  `sn55.27` vì tôi không rễ gốc Pāli (`appasādena` ≠ `appasādaṁ`). Cả ba đều **không** dùng để kết luận;
  kết luận "0 lần gộp khoá" chỉ dựa trên đọc trực tiếp và kiểm kê độ dài nêu ở trên.