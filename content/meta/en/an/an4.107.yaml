notes: |-
  an4.107 là `Mūsikasutta` — bốn loại "cá nhân ví như con chuột", mỗi loại một vòng bốn khoá:
  `Evaṁ kho, bhikkhave, puggalo …` → `Seyyathāpi sā, bhikkhave, mūsikā …` →
  `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi.`, và mỗi vòng mở đầu bằng
  `Idha, bhikkhave, ekacco puggalo dhammaṁ (na) pariyāpuṇāti—` + danh sách chín thể loại. Bài có
  **46** khoá Pāli; tầng Anh đã ghim có lời ở **32**, để trống **14** — và 14 khoá đó chính là tập lấp
  này, không thêm không bớt (đo bằng phép so tập khoá: 14/14, không thiếu không thừa).

  **Bốn nhóm khoá, đếm được:** A = **3** · B = **10** · C = **1** · D = **0**.

  **A = 3 — chép nguyên văn, không dịch lại.** `3.3`, `4.3`, `5.3` mang Pāli **trùng byte** với
  `2.3`, và `2.3` là khoá đã có lời trong chính bài này. Ba khoá chép **nguyên văn** lời `2.3`.
  Đo toàn tầng: Pāli `suttaṁ, geyyaṁ, veyyākaraṇaṁ …` xuất hiện ở **6** khoá tầng Anh đã ghim với
  **1** cách dịch duy nhất, và **3** khoá đã `published` của `an4.102` dùng đúng chuỗi ấy. Ở đây không
  có lựa chọn thứ hai để mắc vào.

  **B = 10, chia làm hai kiểu, và đây là phần quan trọng của lát này.**

  **B1 — dựng lại khung của chính bài (6 khoá).** Sujato dịch vòng hai (`2.5`, `2.6`) rồi để trống
  vòng ba, bốn, năm; nhưng `3.1`–`5.1` (câu hỏi `Kathañca`) vẫn có lời, nên **cặp tính từ** của từng
  loại đã có tiếng Anh ở đúng bài này. Sáu khoá dựng lại từ khung `Evaṁ kho` (`2.5`) và
  `Seyyathāpi sā` (`2.6`), chỉ đổi đúng cặp tính từ:

  | khoá | nguồn khung | khớp với `Kathañca` cùng phần | tỉ lệ khớp đo được |
  |---|---|---|---|
  | `3.5` | `2.5` | `3.1` 0,879 | 0,879 với `3.1` · 0,793 với `2.5` |
  | `4.5` | `2.5` | `4.1` 0,880 | 0,880 với `4.1` · 0,959 với `2.5` |
  | `5.5` | `2.5` | `5.1` 0,883 | 0,883 với `5.1` · 0,915 với `2.5` |
  | `3.6` | `2.6` | `3.1` 0,750 | 0,750 với `3.1` · 0,773 với `2.6` |
  | `4.6` | `2.6` | `4.1` 0,760 | 0,760 với `4.1` · 0,919 với `2.6` |
  | `5.6` | `2.6` | `5.1` 0,758 | 0,758 với `5.1` · 0,909 với `2.6` |

  **Phần tầng đã ghim thiếu mà lớp lấp chèn lại:** Sujato để trống cả sáu khoá này, nên trong cột Anh
  của bài, vòng ba, bốn, năm chỉ có câu hỏi mà **không** có câu trả lời, và `mūsikā` ("con chuột")
  chỉ xuất hiện đúng một lần ở `2.6`. Lớp lấp đưa cặp tính từ vào cả hai khung `Evaṁ kho` và
  `Seyyathāpi sā`, và giữ dạng động từ `-s` của danh sách `1.3`–`1.6` đã ghim (`lives`/`doesn't`,
  `neither makes`/`nor lives`, `both makes`/`and lives`) chứ không dùng dạng mệnh lệnh của câu hỏi
  (`live`, `make`). Vì sao: hai dạng đều đúng, nhưng `2.5`/`2.6` đã ghim dùng dạng `-s`, và bốn vòng
  đọc cạnh nhau sẽ lệch nhau nếu tôi tự chọn dạng khác.

  **B2 — cố định bằng quy ước của cả lớp lấp (4 khoá): `2.7`, `3.7`, `4.7`, `5.7`.** Đây là bẫy thật của
  lát này: **không** khoá nào trong bốn khoá ấy có lời ở tầng ghim, nên không có "nguồn trong bài" để
  chép. `2.7`, `4.7`, `5.7` trùng **byte** với nhau; `3.7` khác đúng **một** dấu phẩy lạc chỗ
  (`imaṁ, puggalaṁ`), khớp `0,989` với hai khoá kia. Tôi dịch cả bốn thành **một** câu:
  `I say that this individual is like that.` — dấu phẩy lạc ở `3.7` là lỗi phân đoạn của tầng Pāli
  ghim, không phải ý nghĩa, nên `3.7` phải dịch giống `2.7`, không được dịch khác.
  Đo toàn tầng: Pāli này **không** có khoá nào ở tầng Anh đã ghim, nhưng có **41** khoá lớp lấp đang
  `published` ở **10** bài với **1** cách dịch duy nhất — đúng câu tôi dùng. `an4.101` `an4.102`
  `an4.103` `an4.104` `an4.105` `an4.108` `an4.109` `an4.110` `an5.249` `an5.75`. Nếu tôi tự viết câu
  thứ hai thì cột Anh của dự án sẽ có hai cách dịch cho cùng một khoá Pāli ở mười một bài.

  **C = 1 — `5.9`, dịch từ Pāli.** `Sattamaṁ.` là nhãn thứ tự, không có gì để tái dùng. Theo khuôn
  `First.`…`Twelfth.` của lớp lấp (đã có **29** khoá như vậy) tôi ghi `Seventh.`

  ⚠ **Cảnh báo nhãn thứ tự — bài này rơi đúng vào bẫy đã mô tả.** Đo toàn tầng Anh đã ghim: **3.103**
  khoá Pāli là nhãn thứ tự, **3.054** khoá trống, tức **100%**; phân bổ `an` **1.401** · `sn` **1.386**
  · `kn` **267**. Con số brief nêu là 2.402/2.402; phép đo của tôi cho 3.103/3.054 vì tôi kể cả
  `Ekādasamaṁ…Caturasiṁ`, và dù brief nêu số nào thì phép đo của tôi là con số tôi đứng sau. Kết luận
  không đổi: **toàn bộ** nhãn thứ tự đều trống ở tầng ghim.
  Riêng `an4.107` chỉ có **một** nhãn (`5.9`), trong khi bài liệt kê **bốn** loại ở `1.3`–`1.6` và mở
  vòng thứ năm ở `5.1`. Người đọc sẽ thấy chữ "Seventh" đúng dưới câu `1.13` *"one both makes a hole
  and lives in it"* — tức dưới mục thứ **tư**. Tôi **không** bỏ khoá này: bỏ là mất một khoá có thật,
  và nhãn thứ tự trong tầng này là văn bản trích trong Kinh Tăng Chi Bộ, không phải biến số của kho.
  Người biên tập muốn hiện "Fifth." thì phải sửa **tầng Pāli**, không sửa ở đây — vì sửa tầng đã ghim
  là shadow.

  **D = 0.** Không khoá nào trùng Pāli với một khoá khác mà tầng ghim cho hai lời khác nhau, nên không
  có gì để báo.

  **Không có dấu lược.** Không khoá Pāli nào trong tập lấp mang `…pe…` hay `…` trần, nên không khoá
  lấp nào được thêm hay bớt dấu lược (đo: 14/14 khoá có 0 dấu ở cả hai vế).

  **Nháy kép và nháy đơn: 0/14.** Không khoá Pāli nào trong tập lấp mang nháy kép `“”` hay nháy đơn
  `‘’`, và lớp lấp cũng không thêm nháy nào — nên phép đo khớp từng khoá cho ra 0/14 ở cả hai vế, tức
  điều kiện được thoả bằng chính nó, không phải bằng ngoại lệ nào.

  **Dấu nhạt lượu.** Mọi `’` trong lớp lấp đều là phần của phép rút gọn `doesn’t` (đo: `’t` **6**,
  `’s` **0**); không có `’` trần nào. Đã kiểm bằng luật đo được trên tầng ghim (`’` + `s|t|ll|re|ve|d|m`,
  không theo sau bằng chữ cái) — không phải `’` giữa hai chữ cái, vì luật đó giết nhầm nháy đóng Pāli.

  **Nguyên nhân phổ biến nhất của khoá trống: tầng Anh gộp khoá — bài này KHÔNG dính, số đo = 0.**
  Đo bằng hai cách độc lập. (1) **Đọc trực tiếp**: cả **32** giá trị tiếng Anh đã ghim của bài này
  dài khoảng 1.800 ký tự; tôi đọc từng giá trị và so với Pāli của các khoá trống kế sau — không giá
  trị nào chứa nội dung của khoá trống nào. (2) **Kiểm kê tỉ lệ độ dài**: không khoá nào vượt 1,76×
  (trung vị của bài = 1,00), và ba khoá đứng trước các đoạn trống dài ba (`3.4` `4.4` `5.4`) có
  tiếng Anh **ngắn hơn** Pāli (0,47) — chiều ngược hẳn dấu hiệu gộp khoá.
  ⚠ Tôi **không** dùng hai bộ dò tự động đầu tiên để kết luận số 0: cả hai đều **chưa hiệu chuẩn** —
  một cách thì trả 0 ngay cả ở `an4.202`/`an4.203` vốn chắc chắn có gộp khoá, một cách thì báo đúng 8
  "lần nuốt" giả trên `sn55.27` nơi số thật là 0. Bỏ cả hai, chỉ báo cáo cái đo được bằng đọc trực tiếp
  và bằng kiểm kê độ dài. (Xem mục 10.)

  **Lỗi tầng Anh đã đo ở đúng phẩm `an4` — đối chiếu ở bài của tôi, cả bốn đều không xuất hiện.**
  `an4.183` đảo cực nghĩa ở `4.2`: **0** khoá lệch cực ở đây (đo trên 32 khoá có lời; phải đếm
  `n't`/`doesn’t` chứ không được đếm `not`, vì `not` không phải chuỗi con của `doesn't` — lần đầu tôi
  dùng cách sai và báo nhầm 9 khoả). `an4.202` `an4.203` gộp khoá: **0**. Mất danh xưng `brāhmaṇa`:
  **0** — bài này không có `brāhmaṇa` ở khoá nào (0/46). Bất đối xứng dấu lược: `an4.202` mất một
  `…`, `an4.203` mất dấu `"`: **không đo được ở bài này**, vì không khoá Pāli nào của tập lấp có dấu
  lược; nhưng tôi có ghi nhận một bất đối xứng **cùng loại** trong chính tầng ghim của bài này:
  `2.4` và `4.4` mang Pāli **trùng byte** (`So ‘idaṁ dukkhan’ti … nappajānāti …pe… …`) nhưng Sujato
  dịch khác nhau — `2.4` bung lược ra **3** dấu `…` và in đủ bốn sự thật, `4.4` chỉ giữ **1** dấu và
  in một sự thật. Không khoá nào trong hai khoá ấy thuộc tập lấp nên tôi không đụng vào; để ở đây.

  **Số lượng.** Bài này không có cụm số lớn nào (`navuti`, `tālīsa`, `sahassa`, `kappasahassa`) nên
  không có bẫy đếm số. Con số duy nhất là bốn loại ở `1.7` và bốn cá nhân ở `1.8`, và cả hai đã có
  lời ở tầng ghim.

  **Không dùng bản Việt để dịch vòng.** Bản Việt canonical chỉ dùng để đối chiếu nghĩa; cả **14** khoá
  đều dựng từ Pāli và từ lời đã ghim trong chính bài này.

  **Xung đột với `an4.102` (cùng phẩm `an4`, đang chạy song song): đo ra 8 cặp Pāli trùng byte, và
  mâu thuẫn là 0.** `an4.102` có **14** khoá trống và chia sẻ với tôi **8** khoá Pāli trùng byte:
  danh sách chín thể loại (4 khoá) và `tathūpamāhaṁ … vadāmi.` (4 khoá). Cả hai chuỗi ấy đều chỉ có
  **một** cách dịch duy nhất trong toàn tầng, và bốn khoá của `an4.102` đã `published` với **đúng**
  những chuỗi tôi dùng. Nên không có chỗ nào để lệch. Nhóm B1 thì không chia sẻ Pāli byte nào với
  `an4.102` (mỗi bài mang cặp tính từ riêng theo `neva`, `ca … ca` của nó).

