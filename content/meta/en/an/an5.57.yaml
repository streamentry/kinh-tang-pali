notes: >-
  Cụm `itthiyā vā purisena vā gahaṭṭhena vā pabbajitena vā` GIỐNG HỆT 1.9, nơi
  bản đã ghim dịch "A woman or a man, a layperson or a renunciate should often
  review this." — giữ đúng bốn chức sắc ấy. Đoạn này cũng đóng nốt lời tuyên xưng
  mở từ 6.5, bằng avagraha `’ti` đứng sau chữ `ī`.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
