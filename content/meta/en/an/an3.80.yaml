notes: |-
  Sáu khoá này không phải bản dịch mới. Chúng là BẢN SAO NGUYÊN VĂN của các khoá đã có chữ ở
  `1.2`–`1.5`, theo đúng cơ chế lặp của bài: Đại vương hỏi ba lần (`Dutiyampi` ở `2.1`, `Tatiyampi` ở `3.1`),
  mỗi lần đều đưa ra đúng một bộ bốn câu hỏi.

  - `2.2` ← `1.2`, `2.3` ← `1.3`, `2.4` ← `1.4`, `2.5` ← `1.5`
  - `3.2` ← `1.2`, `3.3` ← `1.3`

  Tôi soát từng khoá một và Pāli của từng cặp giống hệt nhau, kể cả dấu nháy. Đây là lát dễ nhất của tôi: ở đây
  không có chỗ nào phải tự quyết, và cũng không có chỗ nào để bịa.

  Đáng ghi là bản đã ghim KHÔNG nhất quán ở `2.4` và `3.4` cho cùng một vế Pāli: `1.4` viết "I wonder how far…"
  còn `3.4` viết "… I wonder how far…". Tôi chép `1.4` cho cả `2.4` và không kéo dấu lược của `3.4` sang, vì
  `2.4` không có `…pe…` trong Pāli — bỏ dấu lược vào đó là bịa.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm, nên đây KHÔNG phải một lớp đọc Anh độc lập. Tầng đối chiếu là Pāli đã ghim, các khoá còn lại của chính bản Anh đã ghim, và bản Việt dự án (do agent khác viết) chỉ để đối chiếu nghĩa.

  Lớp lấp: 6 khoá, tất cả đều nằm ở chỗ bản Anh đã ghim để trống. Không khoá nào là blockquote tham chiếu và không khoá nào có Pāli rỗng.

  Bài này còn 7 khoá mà bản Anh đã ghim để trống và lát này KHÔNG lấp, vì Pāli của chúng dưới 40 ký tự nên nằm ngoài ngưỡng đo coverage: `9.10`, `9.11`, `10.0`, `10.1`, `10.2`, `10.3`, `10.4`. Phần lớn là đuôi đoạn lược (`…pe…`, `Navamaṁ.`, `parinibbāyati.`) và bài thơ `udāna` cuối bài. Người đọc bốn cột VẪN thấy các ô này trống, và đó là đúng: một ô tham chiếu trống là lỗ hổng của bản dịch đó, khác với bản vắng mặt cả bài.

  Lớp lấp làm coverage English của bài này lên 100%. Trước lát này nó đã là 32/38 = 0.8421, tức đã trên ngưỡng 0.8, nên bài KHÔNG có record trong `content/meta/reference-gaps.yaml` và không sinh record thừa nào.
