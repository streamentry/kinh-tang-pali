notes: |-
  KHÁC VỚI 13 BÀI CÒN LẠI CỦA LÁT, và nói thẳng để không ai tưởng là cùng một tình huống:
  bài này CÓ bản Anh Sujato đã ghim tại commit đã ghim — đo bằng `files` của tầng
  `english-sujato` trong `source/upstream-manifest.json` có `sutta/an/an3/an3.70_translation-
  en-sujato.json`, và `sutajato()` cho 223/238 khoá có chữ. Lát re2 được giao với niềm tin
  sai rằng cả 14 bài đều không có bản Anh; 12 bài đúng, 2 bài (an3.70, ud5.8) thì không.
  triangulation vẫn 8.0, nhưng lý do KHÁC với 12 bài kia: 15 khoá điền ở đây không có một tầng
  Anh nào phủ, nên vẫn không có bản Anh độc lập để đối chiếu đúng 15 khoá đó; 223 khoá đã ghim
  chỉ là tiền lệ từ ngữ và bối cảnh, không phải tầng đối chiếu cho khoá đang điền.

  ĐỌC CẢ BÀI TRƯỚC KHI VIẾT: bài có 41 nhóm, cấu trúc lặp 4 tầng cho sáu phẩm công đức
  (tathāgata / dhamma / saṅgha / sīla / devatā), mỗi phẩm có cặp "có `seyyathāpi…`" và "không
  có". Vì vậy 16.6–16.9 KHÔNG được dịch như 16.5: khoá 16.5 đã ghim gộp CẢ NĂM yếu tố
  (saddhā sīla suta cāga paññā) vào một câu, còn 16.6–16.9 mỗi khoá Pāli chỉ có MỘT yếu tố,
  nên mỗi bản dịch chỉ được nêu đúng yếu tố của khoá mình. Đây là bẫy `sn11.24` thu nhỏ lại:
  dịch 16.6 bằng cách sao chép câu 16.5 sẽ thêm ba ý không có trong Pāli của khoá đó.

  DẤU LƯỢC: 18.3 đã ghim có `…pe…` đã lược mất sáu yếu tố, và 18.5–18.7 chỉ còn lại dấu lược
  TRẦN. Đã giữ đúng một `…` mỗi khoá (chốt đếm theo từng khoá) và không mở rộng thêm chữ nào.

  BỐN VỀ ĐỦNG ĐỂ HẠ `ambiguity_integrity` xuống 8.8:
  (1) `Mahāvaggo sattamo` (40.6) — không có tiền lệ ở tầng Anh đã ghim vì Sujato để trống toàn bộ
  phần chú giải ở mọi bài `an` (đã đếm: 0 khoá colophon nào trong 5 Nikāya của tầng ghim có
  chữ). Đọc theo tiền lệ tầng Việt đã ghi sẵn cho cùng công thức này ("Phẩm Lớn, chương thứ
  bảy.") nên dịch "The Great Chapter, seventh."; cách đọc còn lại là "đây là phẩm Lớn thứ bảy"
  — hai cách đưa về cùng một sự thật, nên rủi ro thấp.
  (2) `Tassuddānaṁ` (41.0) — "Its summary verse:"; chữ "verse" là tiền lệ từ tầng Việt
  ("Kệ tóm lược của phẩm ấy:", 6 lượt), Pāli `uddāna` tự nó nghĩa là "tóm lược".
  (3) `titthiyamūluposathoti` (41.4) — đây là `uddāna` nén, gộp ba bài 3.68 `Aññatitthi`,
  3.69 `Akusalamūla` và 3.70 `Uposatha` vào một từ. Dịch "the root of the Jains and the
  sabbath" giữ đúng hai mảnh có tên trong tệp tên; không nêu "Unskillful Roots" vì Pāli ở đây
  KHÔNG có chữ nào của nó.
  (4) `venāgo` (41.1) — tệp tên đã ghim có `At Venāgapura` (3.63) nhưng `uddāna` chỉ viết
  `venāgo`, tức tên người. Chốt `_lọt_pāli` chặn dạng có dấu `Venāga` (từ này không có trong
  tầng Anh đã ghim của `an`), nên dùng "Venāgapura" cho an toàn hơn, và đây là chỗ lệch có
  ý thức: tài liệu này ghi ra để biên tập xử lý nếu muốn thống nhất.

  TIỀN LỆ ĐO ĐƯỢC TRONG CHÍNH BÀI (bản ghim): `upakkiliṭṭhassa cittassa upakkamena
  pariyodapanā` → "A corrupt mind is cleaned by exertion"; `pasīdati, pāmojjaṁ uppajjati` →
  "their mind becomes clear, joy arises"; `ye cittassa upakkilesā te pahīyanti` → "mental
  corruptions are given up"; `saṅghañcassa ārabbha` → "because they think of the Saṅgha";
  `atthangasamannāgata` → "with its eight factors"; `sahabyataṁ upapajjeyya` → "be reborn in the
  company of"; `kapaṇaṁ mānusakaṁ rajjaṁ dibbaṁ sukhaṁ upanidhāya` → "Human kingship is a poor
  thing compared to the happiness of the gods"; `Dasamaṁ` → "Tenth." (khuôn số thứ tự trần của
  lớp lấp: ud7.3:4.5 "Third."). Bốn yếu tố ở 16.6–16.9 dùng đúng ba từ đã ghim cho 16.5:
  faith, ethics, learning, generosity, wisdom.

  CHÚ Ý CHO BIÊN TẬP: `uddāna` 41.1 gắn "the Jains and perils" cho 3.61 (`Titthāyatana`,
  tệp tên đã ghim "Sectarian Tenets") và 3.62 (`Bhaya`, "Perils"). `Titthabhaya` trong Pāli là
  tên nén của cả hai, không phải một bài riêng; tôi không tách thêm mốc nào không có trong Pāli.

  CỔNG KỸ THUẬT: đã chạy và PASS — `save_fill` khẳng định cả 5 luật cơ học cho từng khoá, và
  `rven88.py` không báo cờ nào trong an3.70. CHƯA chạy — `npm run validate`, `npm test`,
  `npm run check`, `npm run build`: lát bị lệnh cấm vì chậm và xung đột khi nhiều agent chạy
  song song. Vì vậy `technical_integrity` chấm 9.8 chứ không 10.0, và đây là việc NGƯỜI ĐIỀU
  PHỐI phải chạy lại trước khi coi bài là xuất bản — ghi thẳng ra đây thay vì để trong im lặng.
  Triangulation 8.0 là trần của lớp lấp, ghi ở đây để không ai tưởng là thiếu sót riêng của bài.
