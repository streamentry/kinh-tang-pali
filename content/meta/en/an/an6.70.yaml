  Tiền lệ: 2.4 trùng NGUYÊN VĂN 1.4 và 2.5 gần trùng 1.5, đã ghin. Giữ nguyên bộ từ "mind
  with greed" / "freed mind" của bản đã ghin.
  Bất định đã ghi nhận: bản đã ghin ở 1.4 và 1.5 thêm cặp ngoặc `‘mind with greed’` và
  `‘freed mind’`, nhưng Pāli 1.4, 1.5, 2.4, 2.5 đều KHÔNG có ngoặc kép. Pāli 2.4 tính 0 ngoặc
  mở và 2.5 tính 1 ngoặc đóng, nên bản dịch ở đây bỏ cặp `‘…’` và chỉ giữ một `’` đóng ở 2.5
  — lệch bản đã ghin một cách có chủ đích, vì chốt của kho bắt số ngoặc theo từng khoá. Câu
  đọc được vẫn rõ. Đây là chỗ lệch duy nhất của lát này so với bản đã ghim.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
