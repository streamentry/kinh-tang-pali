  **Triangulation 8.0 — trần của lớp lấp, và bài này KHÔNG được tuyên bố là đã đối chiếu English.**
  `content/meta/sutta/an/an10.84.yaml` ghi cả `translators` lẫn `quality.assessed_by` đều là
  `OpenCode Space Bunny Free (agent)`, **trùng** alias của lớp lấp trong `source/tooling.yaml`. Nghĩa là
  bản Việt canonical và lớp lấp này cùng một nhóm người làm, nên lớp lấp **không phải** cách đọc Anh
  độc lập; 15 khoá lấp này **không** được tính là đã đối chiếu English. Bản Việt đủ 47/47 khoá và chỉ
  được dùng để **đối chiếu nghĩa**, không dịch vòng qua nó. Tầng `vietnamese-current` không có gì để
  dùng: tại commit đã ghim nó chỉ chứa Pháp Cú.

  **Đo lại `translationTitle` của tầng Việt ở `an`** (phép đo đo trước, báo đúng số đo):
  trong `content/meta/sutta/an/*.yaml` có **1.657** tệp; so **bằng** với Pāli `0.3` thì **1** tệp giữ
  nguyên Pāli (`an7.95`) và **1.656** tệp dịch nghĩa — `an10.84` thuộc nhóm dịch nghĩa (*"Kinh Tuyên
  Bố"*). Đếm bằng phép "trông như Pāli thô" (có dotanta/macron, không dấu Việt) cho **40** tệp. Hai
  con số này lệch với 47/1.167 đã được nêu trước đó; tôi ghi phép đo của mình, không sửa gì ở tầng Việt.
  Lớp lấp chỉ cần `englishTitle`, và `englishTitle` ở đây lấy từ tiêu đề **Declaration** mà tầng Anh
  đã ghim dịch cho `0.3`.

