notes: |-
  **Phân loại 15 khoá (luật 2.1): A y nguyên từng chữ = 0 · B dựng lại từ khoá anh em = 14 ·
  C tự dịch = 1 · D lệch lời = 0.**
  Nhóm A rỗng **không phải** vì lười: Pāli của cả 15 khoá này được so với **32** khoá đã có lời trong
  chính bài, và **không** khoá nào trùng byte với khoá nào. Bài lặp theo **công thức**, không lặp theo
  **chữ**: mỗi mục trong `5`–`13` là ba khoá, và danh từ đầu câu thay đổi mỗi mục. D cũng rỗng — không
  có cặp trùng chữ nào để lệch lời. Nhóm C chỉ có `15.3`, xem dưới.

  **Nhóm B — 14 khoá, dựng lại từ `5.2`/`5.3` và `13.2`/`13.3`, bốn khoá đã có lời trong chính bài này.**
  Độ khớp đo được (so trên xương câu, giữ nguyên dấu câu Pāli):
  `6.2`←`5.2` **0.911** · `6.3`←`5.3` **0.947** · `7.2`←`5.2` **0.944** · `7.3`←`5.3` **0.953** ·
  `8.2`←`5.2` **0.899** · `8.3`←`5.3` **0.940** · `9.2`←`13.2` **0.943** · `9.3`←`13.3` **0.966** ·
  `10.2`←`13.2` **0.923** · `10.3`←`13.3` **0.954** · `11.2`←`5.2` **0.901** · `11.3`←`5.3` **0.940** ·
  `12.2`←`13.2` **0.920** · `12.3`←`13.3` **0.952**.
  **Phần tầng đã ghim nuốt mất mà lớp lấp chèn lại là cả vế cố định của hai công thức**, vì Sujato dịch
  `5.2` và `13.2` thành *"and often lives with a heart full of anger/desire."* và `5.3`, `13.3` thành
  *"But being full of anger/desire means decline in the teaching and training proclaimed by the Realized
  One."*; lớp lấp giữ **nguyên văn** vế cố định đó (đối chiếu byte: tiền tố và hậu tố khớp 100% với
  `5.2`, và mệnh đề ` means decline in the teaching and training proclaimed by the Realized One. `
  khớp byte với `5.3`) và **chỉ** thay danh từ. Danh từ lấy từ Pāli của chính khoá, đối chiếu với tính
  từ mà tầng đã ghim dịch ở khoá `.1` ngay phía trên, để hai cột không mâu thuẫn:
  `upanāha` ↔ "acrimonious" → **harsh speech** · `makkhā` ↔ "prone to disdain" → **contempt** ·
  `paḷāsa` ↔ "contemptuous" → **abuse** · `issā` ↔ "jealous" → **jealousy** ·
  `macchera` ↔ "stingy" → **stinginess** · `sāṭheya` ↔ "devious" → **craftiness** ·
  `māyā` ↔ "deceitful" → **deceit**.

  **Cùng hai công thức, hai bài — không mâu thuẫn được, đo rồi.** Lát `an10.86` chạy song song và lấp
  **cùng hai công thức** ấy với bốn danh từ khác (`byāpāda`, `thinamiddha`, `uddhacca`, `vicikicchā`)
  cùng bốn khoá `Xārāmatā kho pana tathāgatappavedite dhammavinaye parihānametaṁ.`. Đo trùng Pāli giữa
  15 khoá của bài này và **toàn bộ** 57 khoá của `an10.86`: **0** chuỗi trùng byte, nên không có cặp nào
  mà hai lớp lấp bắt buộc phải cho ra cùng một lời. Vế cố định thì lớp lấp chọn **đúng lời tầng Anh đã
  ghim** ở `5.3`/`13.3` (không phải lời tự đặt), nên hai lát hội tụ về một câu.

  **Nhóm C — `15.3` `Catutthaṁ.` (10 ký tự), dịch thành `Fourth.`**
  Dưới ngưỡng 40 ký tự của `source/layers.yaml` nên lấp cũng **không** đổi coverage. Vẫn lấp vì đây là
  khoá trống cuối cùng của bài, và lớp lấp đã có sẵn **34** khoá nhãn thứ tự viết đúng khuôn
  `First.`…`Twelfth.` (trong đó **4** khoá đã là đúng `Fourth.`).

  **🔴 Cảnh báo: khoá này sẽ hiện ra như một lỗi, và đó là lỗi của Pāli, không phải của lớp lấp.**
  Bài đếm **mười** pháp (`15.1` `ime dasa dhamme`, và đúng mười mục ở `5.1`–`14.1`) rồi hết;
  `Catutthaṁ.` là "thứ tư", không thuộc nội dung bài. Đo trong `an10`: **196/211** bài kết bằng một nhãn
  thứ tự trần, và chúng **đánh số bài trong chương** — `an10.81` `Paṭhamaṁ.` → `an10.82` `Dutiyaṁ.` →
  `an10.83` `Tatiyaṁ.` → `an10.84` `Catutthaṁ.` → `an10.85` `Pañcamaṁ.` → `an10.86` `Chaṭṭhaṁ.` →
  `an10.87` `Sattamaṁ.` → `an10.88` `Aṭṭhamaṁ.` → `an10.89` `Navamaṁ.` → `an10.90` `Dasamaṁ.`
  Đo toàn tầng trong phạm vi catalog của năm Nikāya: **2.746** khoá Pāli là nhãn thứ tự trần, tầng Anh đã
  ghim để trống **2.403** và có lời **3** — tức nó không dịch nhãn thứ tự ở hầu hết mọi bài (con số
  2.402 đã được nêu trước đó lệch đúng một khoá với phép đo này). Thêm **340** khoá nhãn thứ tự thuộc
  bài **không có tệp Anh ghim** (`kn` 214 · `an` 107 · `sn` 19) — đó là giới hạn của snapshot, không
  phải khoá trống để lấp. Lớp lấp **không bỏ** khoá, không thêm `…`, không thêm số: bỏ là mất một khoá có
  thật trong nguồn. Bản Việt canonical cũng viết *"Thứ tư."*, nên hai cột không mâu thuẫn.

  **Chỗ lớp lấp cố ý lệch tầng Anh đã ghim, kèm lý do.** (1) **Không** thêm dấu lược vào bất kỳ khoá
  lấp nào: tổng dấu lược của lớp lấp = **0**, và Pāli của cả 15 khoá cũng = **0** (cả bài không có
  `…pe…` nào). (2) **Không** dùng dạng *"means decline …"* mà bài `an10.85` đã chép: ở bài đó câu đầy đủ
  đã nói ở `6.3` và `15.2`, còn ở **bài này** hai khoá anh em `5.3` và `13.3` nói **đủ** mệnh đề, nên lấp
  đủ là khớp anh em; làm vậy cũng đúng luật 2.2 (Pāli viết đủ thì không thêm `…`). (3) `8.2`/`8.3`
  dùng **abuse** cho `paḷāsa` trong khi khoá `8.1` đã ghim dịch "contemptuous" — đây là chỗ **duy nhất**
  lớp lấp hơi lệch sắc thái với khoá trên; chọn vì `makkhā` đã lấy **contempt** và hai danh từ này gần
  nghĩa nhau, còn nghĩa gốc của `paḷāsa` là lời lẽu gai gắt. Không phải mâu thuẫn: một người
  "contemptuous" nói lời abusive. Ghi ra đây để không ai tưởng là sót.

  **Lỗi của tầng Anh đã ghim ở đúng bài này, đo được, không sửa được — sửa tầng đã ghim là shadow.**
