notes: |-
  an4.201 đối xứng hai khối: `2.2` kể **người xấu** (sát sinh, trộm cắp, hành dâm, nói dối, rượu) rồi `3.2`-`3.6` thêm "và còn khuyến khích người khác làm nữa"; `4.2` kể **người tốt** rồi `5.2`-`5.6` thêm "và còn khuyến khích người khác từ bỏ nữa". Sujato gộp **cả năm** mục vào `3.2` và `5.2` rồi để trống bốn mục còn lại mỗi khối.

  Đây là **dịch mới từ Pāli**, nhưng bám đúng hệ danh từ của bản ghim để cột Anh không đổi giọng:
  - Bản ghim `3.2` dùng "kills living creatures, steals, commits sexual misconduct, lies, and consumes intoxicants of beer, wine, and liquor" và "And they encourage others to do these things." → tôi giữ nguyên "steal", "sexual misconduct", "lie", "intoxicants of beer, wine, and liquor".
  - Bản ghim `5.2` dùng "doesn't kill living creatures, steal, commit sexual misconduct, lie, or consume intoxicants of beer, wine, and liquor. And they encourage others to refrain from these things." → tôi giữ `paṭivirato` = "refrain from", `veramaṇiyā samādapeti` = "encourage others to refrain from".
  - `pāṇātipāta` giữ là **"kill living creatures"**, `adinnādāna` là **"steal"**, `musāvāda` là **"lie"** — cùng cách gọi Sujato đã dùng, không tự đặt từ mới.

  Hai khuôn khác nhau, có chủ ý không đồng nhất:
  - `3.3`-`3.5` + `3.6`: "encourage others to X" với X lặp lại ("to steal", "to lie", "to do the same"). `samādapeti` là "khuyến khích làm", nên lặp hành vi cụ thể rõ hơn "to do these things" khi đã nói trước danh sách ở `3.2`.
  - `5.4`-`5.6`: "encourage others to refrain from it" dùng **it** thay vì lặp lại cụm, vì `5.2` đã nói "refrain from these things" và chủ ngữ `they` vừa đứng trong câu. `5.3` vẫn lặp "refrain from stealing" vì đó là mục đầu tiên và người đọc còn chưa có danh sách nào trong câu.

  Dấu chấm câu: `3.3`-`3.5` và `5.3`-`5.5` là Pāli `;` (nối tiếp) nên tôi dùng `;`; `3.6` và `5.6` là Pāli `.` (kết khối) nên tôi dùng `.`. Khớp với `3.7` "This is called an even more untrue person." và `5.7` "This is called an even truer person."

  Dấu lược: quét cả 29 khoá — **không** khoá Pāli nào của an4.201 mang `…pe…` hay `…` trần, nên không khoá lấp nào được thêm dấu lược. Không ký tự `…` nào trong tám khoá này.

  Ngoặc kép: an4.201 không có khoá trích dẫn nào trong tám khoá lấp (khác `an4.11` và `sn52.1`), nên không có ngoặc `‘’` nào để cân.

  ⚠ **Lớp lấp này KHÔNG phải lớp đọc Anh độc lập cho an4.201.** `content/meta/sutta/an/an4.201.yaml` ghi `quality.assessed_by: "GLM-5.3 Flash (ZCode)"` cùng một dòng review đối kháng, **khác** công cụ đã viết lớp lấp này, nên `triangulation` để **8.0**. Tôi **không sửa** scorecard tiếng Việt. Bản Anh đã ghim không phủ tám khoá này (đó là lý do chúng ở lát này), nên bản Việt canonical là tầng đối chiếu duy nhất.

  Có một điểm không trùng tuyệt đối mà tôi để nguyên và nói ra: bản ghim ở `3.2` viết "And they encourage others to do these things." — dùng **những việc ấy** trong khi danh sách vừa nói là việc làm; các khoá của tôi dùng "to steal"/"to lie" cụ thể. Cả hai đều đúng `samādapeti`; tôi chọn cách cụ thể vì các khoá lấp phải tự đứng được khi người đọc đọc lướt cột Anh.

