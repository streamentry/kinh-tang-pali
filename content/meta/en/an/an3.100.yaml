notes: |-
  **Phân loại 22 khoá lấp được: A = 15 · B = 5 · C = 2 · D = 0; đã ghi 21, để trống 1 (`10.5`, lý do bên dưới).**
  Bài có ba ví dụ (chén nước / sông Hằng, nửa đồng tiền, người buôn chiên); sau mỗi ví dụ Pāli lặp lại
  nguyên khối hỏi–đáp `2.1`–`3.3` (ai làm nghiệp ác nhỏ mà đọa địa ngục, ai làm nghiệp ác như thế mà trả ngay
  hiện tại). Tầng đã ghim dịch khối này một lần ở `2.1`–`3.3`, rồi ở `5.2`, `10.6`, `15.7` **tự đặt `…`** ở
  cuối câu (Pāli ở ba khoá ấy viết đủ, không có `…pe…`) và để trống các khối lặp `6.x`–`7.x`, `11.x`–`13.x`,
  `16.x`–`17.x`. Đó là cơ chế **cắt cụt dãy**, không phải gộp khoá.

  **Nhóm A — 15 khoá, Pāli trùng nguyên văn với khoá đã ghim, lời dùng lại nguyên văn:**
  `6.1` `16.1` ←`2.1` · `6.3` `16.3` ←`2.3` ·
  `7.1` `12.1` `17.1` ←`3.1` · `7.2` `12.2` `13.1` `17.2` ←`3.2` · `7.3` `12.3` `13.2` `17.3` ←`3.3`.
  **`13.1`–`13.2` là Pāli lặp y hệt `12.2`–`12.3`** ngay liền sau (bản Pāli đã ghim tự lặp hai câu này, không có
  câu hỏi `Kathaṁrūpassa…` dẫn vào). Lớp lấp dịch đúng như Pāli, không gộp, không bỏ; người đọc sẽ thấy hai
  câu xuất hiện hai lần liền nhau, và đó là hình dạng của nguồn.

  **Nhóm B — 5 khoá (tỉ lệ khớp đo trên Pāli đã bỏ dấu):**
  · `6.2` `11.2` `16.2` ←`2.2` (0,98): Pāli thiếu `pana` (`Idha, bhikkhave` thay `Idha pana, bhikkhave`); lời
  đã ghim vốn không dịch `pana`, nên lời giữ nguyên.
  · `11.1` ←`2.1` (0,98): Pāli `appamattakaṁ … kataṁ,` thay `appamattakampi … kataṁ`; lời giữ nguyên
  “does a trivial bad deed, but it lands them in hell”, đúng như tầng đã ghim dịch câu không có `-pi` ở `10.4`.
  · `11.3` ←`2.3` (0,91): Pāli chèn `tādisaṁyeva`; lớp lấp chèn lại đúng phần ấy bằng chữ của chính tầng
  đã ghim ở `3.3` (“the same”): “That kind of individual does the same trivial bad deed, but it lands them in hell.”

  **Nhóm C — 2 khoá:** `18.5` `Navamaṁ.` → “Ninth.” (nhãn thứ tự khớp chuỗi: `an3.99` mang `Aṭṭhamaṁ.`,
  `an3.101` mang `Dasamaṁ.`). `10.5` `Tamenaṁ nirayaṁ upaneti.` **cố ý không lấp**: đây là chỗ hiếm hoi tầng
  đã ghim **thật sự gộp khoá** — lời `10.4` đã ghim kết bằng “but they go to hell”, tức đã mang nội dung `10.5`.
  Lấp `10.5` sẽ làm cột Anh nói hai lần “đọa địa ngục”; khoá này 25 ký tự, dưới ngưỡng 40 nên không vào
  coverage. Ghi lại để người điều phối quyết.

  **Lỗi của tầng đã ghim, chỉ báo, không sửa (sửa là che bản đã ghim):**
  · Ba dấu `…` tự thêm ở `5.2`, `10.6`, `15.7` (Pāli 0 dấu lược). Sau khi lớp lấp `published`, cột Anh sẽ hiện
  `…` rồi ngay sau là phần đã được lấp đầy đủ.
  · Cặp **D trong chính tầng đã ghim**: Pāli `1.6` và `15.7` trùng nguyên văn nhưng lời khác nhau (`15.7` có
  `…`, `1.6` không). Không khoá lấp nào dính vào cặp này.

  **Nháy, dấu lược:** 21/21 khoá lấp khớp nháy Pāli từng khoá (cả Pāli lẫn lời đều 0 nháy). Không khoá lấp nào
  có `…pe…`; lớp lấp 0 dấu `…`. Dò toàn bài các cặp Pāli trùng nguyên văn có lời Anh (đã ghim + lấp): 0 cặp
  có lời khác nhau dính tới khoá lấp.

  **Coverage và `content/meta/reference-gaps.yaml`:** 60 khoá Pāli có nội dung; trước 40/60 = 0,6667; sau
  khi `published` 60/60 = 1,0 (dư 12 khoá so với ngưỡng 0,8). Bài **có** record trong
  `content/meta/reference-gaps.yaml`; sau khi lớp này `published` record đó thành thừa — để người điều phối
  sinh lại tệp bằng `npm run reference:gaps`, lát này không chạm tệp đó.

  **Triangulation 8,5:** `quality.assessed_by` trong scorecard Việt của `an3.100` thuộc một họ công cụ
  khác với lớp lấp, nên về mặt tác giả đây là một lớp đọc Anh riêng; nhưng không có bản Anh thứ hai để
  đối chiếu, và mọi khoá lấp đều dựng từ lời Sujato của chính bài, nên không chấm cao hơn. Đối chiếu có: Pāli
  root + lời Sujato đã ghim (`2.1`–`3.3`) + bản Việt canonical (kiểm nghĩa, không dịch vòng).

  **technical_integrity 9,6:** lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`; bốn lệnh đó còn nợ, nên không tuyên bố technical gate pass.
