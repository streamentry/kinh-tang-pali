notes: |-
  NĂM/BA KHOÁ NÀY LẤP CHỖ TRỐNG QUANH MỘT BẢN ANH ĐÃ GHIM, không phải bản Anh tự
  dịch từ đầu: `an3.128` có 35/42 khoá có chữ trong tầng đã ghim, `an5.249` 26/34,
  `ud6.2` 29/34 (đo bằng `sutajato()`). Tuy vậy `triangulation` vẫn đặt 8.0 cho CẢ bài
  để lát đồng nhất, và **lý do ở đây khác**: các khoá phải điền đều là **lần nhắc lại
  mà bản đã ghim đã lược**, nên không có câu nào độc lập để so. Bộ từ lấy lại từ đúng
  bản Anh đã ghim của chính bài này — không phải từ bản Anh nào khác, và không phải
  từ bản Việt.

  LUẬT 3 "PĦLI TRÙNG THÌ DÙNG LẠI LỜI ĐÃ CÓ" — MÁY KHÔNG BẤT ĐƯỢC Ở LÁT NÀY, TỰ GIỮ
  BẰNG SCRIPT: `save_fill` chỉ in cảnh báo khi Pāli trùng ở khoá khác **có bản Anh đã
  ghim**; 12 bài của lát không có bản ghim nên nó im lặng hoàn toàn. Đã viết
  `_re0_dup.py` đếm Pāli trùng giữa 15 bài của lát với toàn bộ tầng `en/project`
  (822 khoá): 9 cụp trùng trong chính lát (24 khoá là bản lặp) và 18 cụp trùng với
  bài khác; mỗi cụp giữ **một lời duy nhất**, và cụp nào đã có tiền lệ commit thì dùng
  đúng lời đó.

  BẢN VIỆT DỰ ÁN `content/translation/vi/project/sutta/an/an5.249_translation-vi-project.json` KHÔNG có tệp nào; dùng để **đối chiếu nghĩa**, không làm nguồn — nó cùng do một agent chấm nên không phải là lớp đọc độc lập, và `vietnamese_clarity` / `han_viet_balance` ở đây chấm theo bản Việt ấy chứ không theo một bản Việt đã xuất bản. Chỗ nào hai lớp bất đồng thì Pāli là authority và bất đồng được ghi ở mục dưới.

  CẢ 5 KHOÁ CÓ PĀLI **GIỐNG HỆT NHAU**:
  `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi.` ở 2.8, 3.4, 4.4, 5.4, 6.5. Máy KHÔNG
  bắt được — luật 3 của `save_fill` chỉ so với chỗ **có bản ghim**, mà
  `tathūpamāhaṁ` xuất hiện ở 67 khoá của 13 bài khác (an3.99, an4.101–110, an5.75,
  an5.76, an8.14) và **cả 67 đều bị bản đã ghim để trống**. Đã tự tra và tự giữ: tiền lệ
  ĐÃ COMMIT trong chính tầng là an5.75:7.2 / 9.3 / 11.3 / 13.2 / 17.2 → "I say that
  this individual is like that." Dùng lại **đúng câu đó** cho cả 5 khoá: một lời duy
  nhất cho một Pāli duy nhất, không sáng táng "I say to you, mendicants…".

  BẢN ĐÃ GHIM CỦA CHÍNH BÀI NÀY ĐỦ ĐỂ DỰNG: 2.7 "That individual is just as filthy as
  a charnel ground", 3.3 "…just as stinky…", 4.3 "…just as frightening…", 5.3 "…just
  as much a gathering place of savage monsters…", 6.4 "…just as much a weeping place
  for many people…". Tiền lệ chữ `vadāmi` ngay trong bài: `Idamassa asucitāya vadāmi` →
  "This is how they're filthy, I say." (2.6), `Idamassa duggandhatāya vadāmi` →
  "This is how they're stinky, I say." (3.2), cùng 4.2 / 5.2 / 6.3. Nên
  `Idamassa X vadāmi` = "This is how they're X, I say." và `tathūpamāhaṁ … vadāmi` =
  "I say that this individual is like that." — hai khuôn đã có sẵn trong bài.

  RÀNH GIỚI KHÔNG CHẠM VÀO: 2.4, 2.5, 6.7 của bài này cũng fillable nhưng thuộc lát
  khác, tôi không ghi vào.

  CỔNG KỸ THUẬT: `save_fill` PASS cho từng khoá (5 luật cơ học: chỉ điền khoá Pāli có
  chữ và bản Anh đã ghim để trống; số dấu lược / ngoặc mở / ngoặc đóng / dấu hỏi khớp
  Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không khoảng
  trắng đôi). Quét bổ sung trên riêng 15 tệp của lát: 0 cờ "từ Pāli lọt", 0 cờ "sót
  `pe…`", 0 cỗ "ngoặc treo", 0 cờ khoảng trắng đôi; 3 cờ "lặp cụm" đều hợp lệ và đã
  giải trình trong `notes` (xem `mil3.7.13.yaml` và `ud6.2.yaml`). CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm
  chạy vì chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity`
  chấm 9.8 chứ không 10.0, và đây là việc NGƯỜI ĐIỀU PHỐI phải chạy lại trước khi coi
  bài là xuất bản — ghi thẳng ra đây thay vì để trong im lặng.

