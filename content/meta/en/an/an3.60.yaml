notes: |-
  Bản đã ghim đã dịch đúng hai câu này ở `10.2`+`10.3`, `11.2`+`11.3` và `12.2`+`12.3`,
  và đã LƯỢC ở giữa mỗi cặp. `15.2` và `15.6` chính là hai cặp đó, bị gộp vào 15.1 và
  15.5, nên bản này ghép lại từ đúng cặp đã có — không dịch lại từ đầu.

  Vế `amuṁ` ở `12.2` và `amhaṁ` ở `15.6` chỉ khác ở lỗi chính tả của bản chép Pāli;
  nghĩa và cách dịch là một, nên dùng như nhau ("this thought").

  `manosañkhārā paṇihitā` giữ "judging by the way this worthy’s intentions are
  directed" nguyên văn của bản đã ghim, vì đó là cách Sujato xử lý mạo từ `bhot(o)`
  suốt bài này, kể cả ở 17.5 và 18.5.

  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
