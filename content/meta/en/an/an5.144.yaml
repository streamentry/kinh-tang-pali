notes: |-
  Tiền lệ về khung câu: `7.3` (đã ghim) đã dịch đúng `idaṁ kho, bhikkhave, bhikkhu atthavasaṁ
  paṭicca … vihareyya` thành "For this reason a mendicant should meditate …". Tôi theo `7.3` chứ không
  theo `3.3` (cũng đã ghim, dịch "… for this reason" ở CUỐI câu), vì ở `4.3`/`5.3`/`6.3` vế sau `idaṁ …`
  đã bị bản đã ghim lược ở `4.2`/`5.2`/`6.2`; nếu đặt "for this reason" ở cuối thì nó dính vào một
  mệnh đề vốn không có trong khoá. Lớp Việt `4.3`/`5.3`/`6.3` cũng đặt "vì lý do này" ở đầu câu.

  Chỗ dễ sai nhất của bài là cặp ghê tởm / không ghê tởm bị LẬT NGƯỢC, và đây là lý do tôi đối chiếu
  từng cặp chứ không dịch theo trí nhớ: `4.3` Pāli là `paṭikūle appaṭikūlasaññī` (thấy cái không ghê
  tởm TRONG cái ghê tởm) và câu hỏi `4.1` (đã ghim) xác nhận đúng vậy; `5.3` là
  `appaṭikūle ca paṭikūle ca` → "the unrepulsive in both the repulsive and the unrepulsive"; `6.3` là
  `paṭikūle ca appaṭikūle ca appaṭikūlasaññī` → "the repulsive in both the repulsive and the
  unrepulsive". Cả ba đối chiếu khớp với `5.1` và `6.1` (đã ghim).

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
