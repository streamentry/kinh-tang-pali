notes: |-
    Lát mạnh nhất của e6: CẢ SÁU khoá đều trùng byte Pāli với một khoá mà Sujato đã dịch
    ở hai bài khác, nên không phải đoán một từ nào.

    an4.233 ("Deeds in Detail") lặp nguyên văn cả sáu câu này, và Sujato đã dịch:
    4.3 = 2.3 "Having made these choices, they're reborn in a hurtful world,"
    4.4 = 2.4 "where hurtful contacts strike them."
    5.3 = 3.3 "Having made these choices, they're reborn in a pleasing world,"
    5.4 = 3.4 "where pleasing contacts strike them."
    6.3 = 4.3 "Having made these choices, they are reborn in a world that is both hurtful
    and pleasing,"
    6.4 = 4.4 "where hurtful and pleasing contacts strike them."
    an3:23 có đúng hai câu đầu nữa (1.4, 1.5). Đã so từng khoá bằng script.

    Dấu phẩy ở cuối 4.3/5.3/6.3 và dấu chấm ở 4.4/5.4/6.4 không phải lỗi gõ: Pāli đặt
    `lokaṁ upapajjati.` rồi `phassā phusanti.` thành hai mệnh đề, và chúng nối tiếp với
    "Touched by hurtful contacts…" ở 4.5/5.5/6.5 của bản đã ghim. Đó cũng chính là cách
    bản Việt đã publish.

    Vì có hai bài song song của chính Sujato, đây là lát ít phải suy đoán nhất trong e6.
    Triangulation vẫn để 8.0 vì người viết lớp lấp cũng là người chấm, nên không thể coi
    là một cách đọc Anh độc lập — dù ở đây nó chỉ là chọn lại cách đọc đã có.

    Lớp lấp: 6 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị
    mất.
