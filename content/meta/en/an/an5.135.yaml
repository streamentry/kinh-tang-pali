notes: >-
  Công thức tanh chứng `itipi so bhagavā arahaṁ sammāsambuddho …pe… satthā
  devamanussānaṁ buddho bhagavā` xuất hiện y hệt ở `an7.6:2.3`, và cả hai đều bị
  lược. Hai khoá này dịch giống nhau cố ý. `itipi` là "dù vậy nữa / cũng vậy nữa",
  nên câu phải nối chứ không được khép lại — và 4.2 (Sujato) đã mở nốt bằng
  "I am a person of faith; I have faith in the Realized One's awakening …".
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
