notes: |-
  Bối cảnh phải nói trước: bản Anh đã ghim ở `1.3` đã GỘP cả bốn dấu chân Pháp thành một câu
  ("Contentment, good will, right mindfulness, and right immersion."), trong khi Pāli tách mỗi dấu chân
  ra một khoá riêng. Vì `2.1`, `3.1`, `4.1` không có `…pe…`, tôi dịch trọn vẹn từng khoá; hệ quả là cột
  Anh đọc lên sẽ có phần lặp với `1.3`. Đó là hệ quả của cách bản đã ghim xử lý `1.3`, không phải lỗi.

  Thuật ngữ đã cân nhắc và ghi lại vì đây là điểm dễ sai nhất của bài: `Abyāpādo` tôi dịch "Good will".
  Tiền lệ quyết định: `an4.30:2.4` (đã ghim) đã định nghĩa đúng tên bốn dấu chân là Contentment / Good
  will / Right mindfulness / Right immersion, và `an4.30:7.5`/`7.6` (đã ghim) dùng "the Dhamma footprint
  of right mindfulness" / "of right immersion". Đếm được trong tầng `en`: Sujato dùng "good will" 68 lần
  và "non-hatred" 0 lần. Nói thẳng phần còn lại: Pāli nghĩa gốc là "không sân hận", lớp Việt
  `an4.29:2.1` (dự án) ghi "Không sân hận" — hai cách đều đúng, tôi chọn cái kho đã dùng để cột Anh
  đồng nhất. `Sammāsati` và `Sammāsamādhi` theo cùng tiền lệ, không có bất định.

  Vế sau `dhammapadaṁ aggaññaṁ …` lấy từ `1.1` (đã ghim), đổi số ít theo chủ ngữ: "is a footprint of the
  Dhamma that is …" / "It is uncorrupted …" / "don't look down on it".

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
