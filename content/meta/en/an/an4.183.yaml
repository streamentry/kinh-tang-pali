notes: |-
  **Bốn nhóm khoá (đo bằng máy, in ra để kiểm): A y nguyên từng chữ = 0 · B dựng lại = 12 ·
  C tự dịch = 1 · D Pāli trùng mà lời khác nhau = 0.** Dò toàn tầng: trong 33 khoá của bài **không có
  hai khoá nào trùng nguyên văn Pāli**, nên không có khoá A và cũng không có khoá D. Đây là bài mà
  mọi vế đều là **chép lại có thứ tự** với thứ tự khác, nên B chiếm 12/13.

  **Nhóm B1 — sáu khoá `3.3`–`3.8`, dựng lại từ `3.1`/`3.2`.** Tỉ lệ khớp Pāli đo được: `3.3`/`3.5`/
  `3.7` với `3.1` = 0,897 · 0,897 · 0,891; `3.4`/`3.6`/`3.8` với `3.2` = 0,934 · 0,934 · 0,912.
  Phần tầng đã ghim nuốt mất mà lớp lấp chèn lại: (1) **danh xưng `brāhmaṇa`** — tầng đã ghim có
  "Brahmin" ở `3.1` nhưng **rơi mất** ở `3.2`; (2) dạng `bhāsitabba` — tầng đã ghim dịch
  `bhāsitabbanti vadāmi` thành câu tường thuật "you should talk about", lớp lấp giữ lại dạng bị
  buộc "should be spoken"; (3) **ranh giới khoá**: Pāli `3.1` chỉ nói `sabbaṁ diṭṭhaṁ` (mọi điều
  **đã thấy**), nhưng tầng đã ghim liệt kê cả bốn ("see, hear, think, and know") — tức lời `3.1` đã
  gộp sẵn bốn khoá `3.1+3.3+3.5+3.7` vào một ô. Lớp lấp vì vậy mỗi khoá chỉ nện **đúng một** phạm
  vi, khớp Pāli từng khoá: `3.3`/`3.4` = heard, `3.5`/`3.6` = thought, `3.7`/`3.8` = known. Đếm lại
  bằng máy: mỗi khoá trong 12 khoá nêu đúng **một** trong bốn danh từ, không khoá nào kể cả bốn.

  **Nhóm B2 — sáu khoá `5.1`–`7.2`, dựng lại từ `4.1`/`4.2`.** Tỉ lệ khớp: `5.1`/`6.1`/`7.1` với
  `4.1` = 0,938 · 0,938 · 0,932; `5.2`/`6.2`/`7.2` với `4.2` = 0,941 · 0,941 · 0,925. Cùng cấu trúc
  với B1: tầng đã ghim gộp `4.1+5.1+6.1+7.1` và `4.2+5.2+6.2+7.2` vào hai ô, để trống sáu khoá này.
  Phần tầng đã ghim nuốt mất mà lớp lấp chèn lại: (1) `Yañhi` và `Yañca khvassa` — tầng đã ghim bỏ
  cả hai, lớp lấp dựng lại thành "For brahmin," và "But brahmin, … other things"; (2) danh xưng
  `brāhmaṇa`, bị rơi ở **cả** `4.1` và `4.2`; (3) **phủ định `abhāsato`** của các khoá `.2` — tầng
  đã ghim dịch thành "When talking about", tức **mất dấu phủ định**, lớp lấp giữ "when **not**
  talking about"; (4) `evarūpaṁ … sutaṁ`, tầng đã ghim làm phẳng thành "those things", lớp lấp
  viết rõ "what has been heard in that way" để người đọc thấy định ngạo mà Pāli có.

  🔴 **Hệ quả buộc phải cố ý khác tầng đã ghim ở `4.2`, và nói thẳng vì nó làm đổi nghĩa.** Pāli `4.2`
  là `kusalā dhammā parihāyanti, akusalā dhammā abhivaḍḍhanti` — **thiện thoái, bất thiện tăng**. Tầng
  đã ghim dịch **ngược**: "unskillful qualities decline while skillful qualities grow". Vì `4.2` chính
  là khuôn của `5.2`/`6.2`/`7.2`, lớp lấp **không** chép khuôn ấy: sáu khoá `5.x`–`7.x` giữ đúng
  cực Pāli, và đo lại bằng máy cho thấy `5.2`/`6.2`/`7.2` đều có `skillful … decline` **trước**
  `unskillful … grow`, ngược hẳn với các khoá `.1`. Đây là lý do lớp lấp chọn dựng lại từ Pāli ở
  câu thứ hai thay vì bám sát lời đã ghim.

  **Nhóm C — một khoá `8.2` `Tatiyaṁ.`**, tự dịch: "Third." Đây là nhãn thứ tự, và lớp lấp đã điền
  các nhãn thứ tự theo khuôn của chính lớp lấp (đối chiếu tại chỗ: `an4.171:10.3` = "First.",
  `an4.244:4.12` = "Second.", `an4.203:5.10` = "Third.", `an4.116:2.2` = "Sixth."). Bằng chứng rằnh
  "Third." đúng, không phải suy đoán: chuỗi bài anh em trong cùng phẩm là `an4.181` = `Paṭhamaṁ.`,
  `an4.182` = `Dutiyaṁ.`, `an4.183` = `Tatiyaṁ.`, `an4.184` = `Catutthaṁ.`, `an4.185` = `Pañcamaṁ.`
  ⇒ "Third." là số thứ ba, đúng chỗ.

  **Dấu lược:** cả bài **không có `…` nào** — đo trên Pāli 33 khoá cho 0, trên tầng đã ghim 33 khoá
  cho 0, trên 13 khoá lấp cho 0. Không dấu nào bị bịa và không lược nào bị mở rộng.

  **Ngoặc kép — đo từng khoá, in ra để kiểm.** Pāli mở `“` ở `3.1` và đóng `”` ở `7.2`
  (`vadāmī”ti.`); mười một khoá `3.3`–`7.1` không có dấu nháy nào. Lớp lấp khớp **từng khoá**: 12 khoá
  `3.3`–`7.1` có 0 dấu, `7.2` có đúng 1 dấu `”`. Nhưng **tầng đã ghim đóng sớm**: `4.2` kết bằng
  `things.”` trong khi Pāli `4.2` **không** có dấu đóng nào. Hệ quả sẽ hiện ra với người đọc: cột
  English in ra dấu đóng ở `4.2` rồi lại đóng lần nữa ở `7.2`. Lớp lấp chọn **khớp Pāli từng khoá**
  (điều kiện đúng của luật nháy kép) thay vì bỏ dấu ở `7.2`, vì bỏ thì ô `7.2` lệch Pāli mà người đọc
  không có cách nào phân biệt với lỗi thật; còn thêm dấu thì hậu quả là **lỗi của tầng đã ghim** đã
  được ghi ở đây. Sửa tầng đã ghim thì thành shadow, nên lớp lấp không sửa được.

  **Đo phủ định từng khoá (bộ đo hiệu chuẩn 15/15 OK trước khi dùng).** So số phủ định Pāli với số
  phủ định tiếng Anh: lớp lấp lệch **0** khoá trên 13. Cụ thể `3.3`/`3.5`/`3.7` = 1→1, `3.4`/`3.6`/
  `3.8` = 2→2, `5.1`–`7.2` = 1→1, `8.2` = 0→0. (Phải coi `na panāhaṁ` là **một** phủ định, không phải
  hai, và `abhāsato` là một phủ định vì tiền tố `a-`; đo sai hai chỗ này là ra số lệch giả — đã sửa.)

  **Sáu lỗi tầng Anh đã ghim đo được ở đúng bài này — không sửa được, chỉ báo.** Đếm trên 20 khoá có
  chữ của tầng đã ghim, so với Pāli từng khoá:
  · **9 khoá lệch số phủ định.** `2.2` `2.4` `2.6` `2.8`: Pāli **không** phủ định, tầng đã ghim thêm
    "There’s **nothing** wrong" — tức **thêm** một mệnh đề phủ định không có trong Pāli. `2.3` `2.5`
    `2.7` `2.9`: Pāli có `natthi tato doso` (không có lỗi ở đó), tầng đã ghim **rơi mất** cả vế ấy ở
    bốn khoá ⇒ chủ trương của vị Bà-la-môn hiện ra thiếu mất nửa. `4.2`: `abhāsato` bị rơi (xem trên).
  · **`4.2` đảo cực nghĩa** (xem trên) — lỗi làm thay đổi nghĩa ở khoá đã ghim.
  · **4 khoá thêm chữ không có trong Pāli:** `2.2` `2.4` `2.6` `2.8` dài 22–25 ký tự Pāli thành 66–69
    ký tự tiếng Anh (tỉ lệ 2,6–3,1) vì thêm "There’s nothing wrong with … saying:".
  · **4 khoá rơi nháy:** Pāli mở `‘` ở `2.2` `2.4` `2.6` `2.8`, tầng đã ghim không có dấu nào; ngược
    lại tầng đã ghim thêm cặp `‘…’` ở `2.3` `2.5` `2.7` và thêm một dấu `‘` nữa ở `2.9`.
  · **4 khoá gộp:** `3.1` gộp `3.1+3.3+3.5+3.7`, `3.2` gộp `3.2+3.4+3.6+3.8`, `4.1` gộp
    `4.1+5.1+6.1+7.1`, `4.2` gộp `4.2+5.2+6.2+7.2`. Đây chính là nguyên nhân 13 khoá trống.
  · **3 khoá rơi danh xưng `brāhmaṇa`:** `3.2` `4.1` `4.2`.
  · **Nén dài đo được:** `độ dài tiếng Anh / độ dài Pāli` trên 20 khoá có chữ. Bốn khoá nén nặng nhất
    **chính là** bốn khoá mất `natthi tato doso`: `2.9` = 0,46 · `2.3` = 0,47 · `2.5` = 0,53 ·
    `2.7` = 0,59. Ngay sau đó là `0.2` = 0,71 và `1.3` = 0,72. Hai khoá dài nhất (`1.2`, `8.1`) đúng
    tỉ lệ 1,00. Không có khoá nào rơi vào kiểu nén 239 → 42 ký tự đã đo ở bài khác; mức nén cao nhất ở
    đây là 0,46.
  · Đo thêm, **không** thấy lỗi nào của các loại đã đo ở 16 bài trước: **0** dấu lược bịa, **0** lược
    bị mở rộng, **0** vệt markup `<j>`, **0** đảo thứ tự khoá (thứ tự khoá trong tệp tầng đã ghim
    **giống hệt** thứ tự Pāli, 33/33), **0** khoá trùng Pāli (xem nhóm A ở đầu `notes`).

  **Chống chép nguyên văn — đo được, không chỉ hứa.** 253 từ trong 13 khoá lấp thì 195 từ (77,1%)
  cũng xuất hiện ở đâu đó trong tầng đã ghim, phần lớn là chức từ và thuật ngữ kỹ thuật. Cụm dài
  nhất dùng chung liên tiếp là **11 từ** (`unskillful qualities grow while skillful qualities
  decline`) ở `6.1`/`7.1` so với `4.1` — đây là **collocation bắt buộc** của cặp `abhivaḍḍhanti` /
  `parihāyanti`, bất kỳ bản dịch nào của Pāli này cũng ra; câu thứ hai của cả sáu khoá `5.x`–`7.x`
  được lớp lấp viết lại theo dạng `bhāsitabba` + `vadāmi` nên **không** dùng lại lời tầng đã ghim.
  Nói thẳng: lớp lấp dựng lại **quyết định dịch** (thuật ngữ, thì, ngôi, cách xưng hô) từ khoá anh em
  theo luật dựng lại, chứ không bê nguyên câu — và đó là điểm khác với việc chép.

  **Không còn khoá trống nào của lát.** Tổng số khoá tầng đã ghim để trống ở bài này là 13 (không tính
  khối `:0`); lát lấp đủ 13 ⇒ **0** khoá trống còn lại. Lưu ý: trong 13 khoá đó chỉ **12** khoá có
  Pāli ≥ 40 ký tự nên vào mẫu số coverage; `8.2` (`Tatiyaṁ.`, 8 ký tự) **không** vào coverage, lấp vì
  người đọc cần nhãn thứ tự chứ không phải vì chỉ số.

  **Coverage, đo trước và sau bằng số.** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) =
  **22** khoá; tôi tự dựng lại đúng công thức của kho và đối chiếu với record đã có trong
  `content/meta/reference-gaps.yaml` (`substantiveSegments: 22`, `substantiveWithoutEnglish: 12`,
  `coverage: 0.4545`) — **khớp 22/12/0,4545**, nên phép đo là tái lập được.
  · Trước: `10/22 = 0,4545`, `substantiveWithoutEnglish = 12`, khoá hụt nặng nhất `7.2`.
  · Sau (lớp lấp `published`): `22/22 = 1,0000`, `substantiveWithoutEnglish = 0`.
  · **Độ nhạy ngưỡng 0,8:** 0,8 × 22 = 17,6 ⇒ cần ≥ **18** khoá có phủ. Sau khi lấp đủ thì **mất được
    tối đa 4 khoá** vẫn còn trên ngưỡng (18/22 = 0,8182); **mất khoá thứ 5 là rớt** (17/22 = 0,7727).

  **Hệ quả với `content/meta/reference-gaps.yaml`:** bài này **có** record (`coverage: 0.4545` ở trên).
  Sau khi lớp lấp `published` thì record ấy **thành thừa** và bộ sinh sẽ bỏ đi khi chạy lại
