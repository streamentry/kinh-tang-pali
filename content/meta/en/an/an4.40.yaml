notes: |-
  `an4.39` là bài SONG SONG TỪNG CHỮ với `an4.40`, và bản đã ghim đã dịch TRỌN nó:
  `an4.39:1.9` trùng nguyên văn `an4.40:1.8`, `an4.39:2.4` trùng nguyên văn
  `an4.40:2.4`. Chép lại y nguyên, kể cả chữ "Because" và cả cụm
  "perfected ones … those who are on the path to perfection" cho `arahanto vā
  arahattamaggaṁ vā samāpannā`.

  Bất định phải nói rõ: ở `an4.39`, "Because" nối với "Why is that?" ở 1.8/2.3. Ở
  `an4.40` hai khoá `Taṁ kissa hetu?` đó không có chữ trong bản đã ghim (và ngắn hơn
  40 ký tự nên không tính vào coverage), nên người đọc sẽ đọc vào một "Because" mà
  không có câu hỏi dẫn trước. Bỏ chữ "Because" thì hai bài song song lại lệch nhau; giữ
  thì câu hơi cụt. Tôi chọn giữ, vì bản song song là tiền lệ trực tiếp và khớp từng
  chữ, còn sự cụt là hệ quả của bản đã ghim chứ không phải của bản dịch. Đây là lý do
  `ambiguity_integrity` hạ xuống 8.8 — mức thấp nhất của lát này.

  `sārambhaṁ`/`nirārambhaṁ` = "violent"/"non-violent", `upasaṅkamanti` = "attend",
  lấy nguyên văn từ `an4.39`.

  Còn một chỗ dễ sai, nên ghi rõ: ở `1.8` có `na upasaṅkamanti`, và phủ định có thể bám
  vào chủ ngữ (`arahanto`) lẫn vào động từ. Bản đã ghim của `an4.39:1.9` — cùng nguyên
  văn — chọn cách phủ định động từ ("will NOT attend"), và `2.4` ở đây vốn đã là khẳng
  định (`ni` chỉ thuộc `nirārambhaṁ`, không có `na` nào), nên cặp 1.8/2.4 của bài này chỉ
  đọc được như một cặp khẳng định–phủ định nếu giữ đúng cách phủ định ấy. Đây là lý do
  thứ hai để `ambiguity_integrity` hạ.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
  Ghi chú cho người điều phối: bài này đang có bản ghi trong
  `content/meta/reference-gaps.yaml` (9 khoá có nội dung, 2 không có Anh, coverage
  0.7778). Hai khoá vừa lấp đúng hai khoá thiếu đó, nên bản ghi sẽ thành thừa sau khi
  lớp này `published` và cần chạy lại `npm run reference:gaps` — tôi không tự chạy vì
  tệp đó không thuộc lát của tôi.
