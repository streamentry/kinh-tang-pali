notes: |-
  BÀI NÀY LÀ `sn11.24`/`sn47.10` THỨ BA trong lát này: 4.2 của tầng ghim chỉ nói chung “and told
  him what had happened”, nên 5.1–7.3 là **Ānanda kể lại nguyên văn** cuộc trò chuyện với nữ cư
  sĩ Migasālā. Đọc lẻ 6.2/6.4 sẽ thành hai vế lạ lõm về cha chú, không ai hiểu vì sao được hỏi.
  Vì vậy chín khoá lặp lại đều lấy y từ bản đã ghim, chỉ đổi ngôi kể và xưng hô:

  - 6.2 = 2.2, 6.3 = 2.3, 6.4 = 2.4, 6.5 = 2.5 — **y nguyên văn từng chữ**, đã kiểm bằng máy
    (4/4 khớp tuyệt đối). Lời này vốn đã là lời Migasālā ở ngôi thứ nhất nên không phải đổi gì.
  - 7.1 = 3.1, lấy y nguyên văn **phần trong**; chỉ đổi **dấu nháy đóng** từ `”` của 3.1 thành
    `’`, vì trong Pāli dấu `’` ở 7.1 đóng đúng cái `‘` mà 6.1 đã mở (6.1 là lời Migasālā lồng
    trong lời Ānanda). Giữ `”` ở 7.1 thì đọc 5.1–7.3 sẽ thấy `“` mở ở 5.1 mà không có `”` đóng.
  - 6.1 = 2.1 với nháy mở đơn (Pāli 6.1 mở bằng `‘`, còn 2.1 mở bằng `“`), phần trong y nguyên văn.
  - 7.3 = 3.2 với nháy đơn (Pāli 7.3 dùng `‘…’”`, khác 3.2 dùng `“….”`), phần trong y nguyên văn;
    `’”` ở cuối đóng cả nháy trong lẫn nháy ngoài mà 5.1 đã mở — y hệt cách Pāli làm. Như vậy
    5.1–7.3 cân bằng nháy từ đầu đến cuối, đã kiểm bằng máy.
  - 5.1 ↔ 1.2 và 5.2 ↔ 1.3 là ngôi kể đổi thứ ba → thứ nhất, dựng theo đúng khuôn lớp lấp đã có ở
    `sn47.10:4.1–4.2` (cùng tình huống: Ānanda kể lại một cuộc trò chuyện với người nữ tín đồ) —
    “This morning, sir, I robed up and, taking my bowl and robe, … where I sat down on the seat
    spread out. ” và “Then, sir, the laywoman Migasālā came up to me; on arriving, she bowed to me
    and sat down to one side. Once seated to one side, sir, … said to me: ”.
  - 7.2 là câu nối **mới**, không có Pāli lặp (`Evaṁ vutte, ahaṁ, bhante, migasālaṁ upāsikaṁ
    etadavocaṁ:`) ⇒ dựng mới theo khuôn “Having been spoken to this way, sir, …” của `sn47.10:4.4`.

  Điểm ghi lại cho người đọc: 6.5 mang dấu gạch ngang `—` trong Pāli, nhưng bản lấp dùng dấu phẩy
  vì lấy y nguyên văn 2.5 đã ghim; 4.2 đã ghim đã gộp cả 5.1–7.3 thành một câu nên không có chỗ nào
  bám, đây là lựa chọn của tầng ghim chứ không phải thiếu sót.

