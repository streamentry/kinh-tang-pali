notes: >-
  Câu này xuất hiện ba lần (13.4, 14.2, 15.6); 13.4 và 15.6 đã có chữ, chỉ 14.2 bị
  lược. Giữ "they do not die until" và "that bad deed is eliminated" nguyên văn.
  Chỉ đổi phần tính từ: bản đã ghim dùng "sharp, severe, acute" cho `tibbā kharā
  kaṭukā`; ở đây `tibbā` = "harsh" và `kaṭukā` = "bitter", vì "sharp" đã ăn vào
  `tibbā` và "acute" không nói lên gì về vị khó chịu của địa ngục. Cùng Pāli thì
  nghĩa phải như nhau, không bắt buộc từ phải như nhau.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
