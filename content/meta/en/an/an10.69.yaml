notes: |-
  `3.4` là CÙNG danh sách 26 mẫu chuyện phiếm ở `1.3` (chỉ khác `iti vā`/`iti vāti` ở
  cuối), và bản đã ghim đã dịch trọn danh sách đó. Chép lại y nguyên — đây là luật của
  `sn11.24`. Không tự đặt lại tên cho các mẫu (`visikhākathā` = chuyện lôi đổ
  tiền, `kumbhaṭṭhānakathā` = chuyện nơi đổ nước): tự đặt sẽ khiến hai cột Anh của
  chính bài này gọi cùng một danh sách bằng hai bộ từ.

  `3.2` là 3.1 + `…pe…`, nên chỉ dịch phần nhìn thấy: hai mẫu đầu và mẫu cuối, với
  đúng một dấu lược `…`. `rājakathaṁ`/`corakathaṁ` lấy từ 1.3 ("talk about kings,
  bandits"), `itibhavābhavakathaṁ` lấy từ đó ("talk about being reborn in this or that
  place"). Không mở rộng `…pe…`: chữ bổ sung vào tầng Anh là chữ không nguồn nào cấp phép.

  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
