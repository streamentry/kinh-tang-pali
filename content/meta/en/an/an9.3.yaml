notes: |-
  **Phân loại 11 khoá (đo bằng `eng/_e15_class.py`, `difflib` trên tầng Anh đã ghim của chính bài):
  A y nguyên từng chữ = 4 · B dựng lại từ lời đã ghim = 7 · C tự dịch = 0.** Không có khoá nào
  phải tự dịch từ đầu, nhưng luật “đừng dịch khi tách khỏi bài” vẫn quyết định gần như từng chữ ở
  đây, vì 11 khoá này **không phải 11 câu mới**: chúng là lời Meghiya kể lại, ngôi thứ nhất.

  - **A (4): `4.7` = `2.6` nguyên văn · `9.2` = `7.3` · `9.5` = `7.6` · `9.6` = `7.7`.** Đo bằng
    so khớp chuỗi sau khi bỏ khoảng trắng thừa: trùng tuyệt đối.
  - **B (7) dựng lại, và mỗi khoá lấy từ đâu:**
    · `4.1` từ `2.1` — chỉ đổi ngôi và dẫn `Idhāhaṁ, bhante`. Giữ nguyên “robed up in the morning”,
      “taking his bowl and robe”, “entered Jantu village for alms” ⇒ đổi thành “in the morning I
      robed up”, “taking my bowl and robe”, “entered Jantu village for alms”.
    · `4.2` từ `2.2` (0,95) — chỉ `he`→`I`, `his`→`my`.
    · `4.3` từ `2.3` (0,93) — `he`→`I`, và thêm “sir” cho `bhante` mà tầng đã ghim ở `2.3` đã bỏ.
    · `4.6` là **vế sau** của `2.5` đã ghim (“Oh, this mango grove is lovely and delightful! This is
      good enough for striving for a gentleman wanting to strive.”). Vế trước nằm ở `4.5`, dưới ngưỡng
      40 ký tự nên trống ở cả hai tầng. Chỉ lấy vế sau, nguyên văn.
    · `9.1` từ `7.2` (0,82) — `Idha mayhaṁ, bhante` là chỗ **không** được dịch vòng: nó là “còn về
      phần tôi thì…”, nên lớp lấp dịch `As for me, sir, while I was meditating…` chứ không lặp
      “But while Meghiya…”.
    · `9.4` lõi y hệt `7.5`, **chỉ khác đúng dấu nháy**, và khác ở chỗ có lý do: Pāli `7.5` mở bằng
      `“` còn Pāli `9.4` mở bằng `‘` (nháy đơn, lồng trong `“` của `9.1`). Nên `9.4` dùng `‘`.
    · `9.7` lõi y hệt `7.8`, thêm dấu `’` vì Pāli `9.7` là `’”ti` (đóng nháy đơn rồi nháy kép) trong
      khi Pāli `7.8` chỉ là `”ti`.

  **Cân ngoặc kép, in ra để kiểm:** `4.1` 1/0 · `4.2` 0/0 · `4.3` 0/0 · `4.6` 0/0 · `4.7` 0/1
  (theo bộ đếm bỏ dấu nháy đơn kiểu apostrophe như `I’ll`) · `9.1` 1/0 · `9.2` 0/0 · `9.4` 0/0 nháy
  đơn 1/0 · `9.5` 0/0 · `9.6` 0/0 · `9.7` 0/1 nháy kép và 0/1 nháy đơn. Khớp Pāli từng khoá **trừ một
  chỗ có chủ đích, ở `4.7`.** Pāli `4.7` đóng nháy đơn `’` (nháy mở ở `4.5`), nhưng `4.5` dưới
  ngưỡng 40 ký tự nên trống ở cả tầng đã ghim lẫn lớp lấp ⇒ nháy đơn ấy không có chỗ mở để người đọc
  thấy. Lớp lấp dùng `”` như tầng đã ghim ở `2.6` (cùng câu, nguyên văn Pāli) để đóng nốt `“` mở ở
  `4.1`, nhờ vậy khối 4 cân ngoặc. Đây là **hệ quả của ngưỡng 40 ký tự**, đã ghi thẳng; vì vậy hạ
  `grammar_logic` 9.2 và `ambiguity_integrity` 9.2.

  **Bốn khoá trống còn lại, đều dưới ngưỡng 40 ký tự nên `coverage` không tính và lát này không lấp:**
  `4.4` (21 ký tự, `Disvāna me etadahosi:`), `4.5` (39, vế mở đầu của `4.6`), `9.3` (32, `Tassa mayhaṁ,
  bhante, etadahosi:`), `19.5` (8, `Tatiyaṁ.`). Tổng số khoá tầng Anh đã ghim để trống ở bài này là 15
  không tính `:0`; lát này lấp 11, còn 4 khoá nêu trên.

  **Dấu lược:** không khoá nào trong 11 khoá này chứa `…` (đo bằng script), nên tổng dấu lược của bản
  lấp bài này bằng **0**. Bài có `…pe…` ở `15.2`, `16.2`, `17.1`, `18.1` nhưng cả bốn khoá đó đã ghim.

  **Bất định, ghi thẳng:** `Idhāhaṁ` ở `4.1` và `Idha mayhaṁ` ở `9.1` không có bản Anh nào đã ghim
  để đối chiếu (đo trên AN · DN · MN · SN của tầng Anh đã ghim: 32 khoá chứa `Idhāhaṁ` được dịch, nhưng **không**
  khoá nào chứa `Idha mayhaṁ`). Tầng đã ghim thường **bỏ** `Idhāhaṁ` hơn là dịch (`an5.167` → “Take a
  case where…”, `an8.86` → “Take mendicants I see…”, `mn12:37.1` → “When I’ve comprehended…”). Lớp
  lấp dịch “Here, sir,” và “As for me, sir,” vì bỏ hẳn thì ngôi kể của Meghiya mất dấu. Đây là lựa chọn
  có căn cứ nhưng **không** có bản Anh độc lập nào xác nhận.

  Triangulation 8.0: bài này **không có** bản dịch Việt của dự án (`content/translation/vi/project/
