     `english-sujato` — sửa là `SHADOWING`, nên tôi **báo để người biên tập quyết**. Người đọc sẽ thấy
     hai thứ tự khác nhau giữa `1.13` và `5.6`; đó là hệ quả của việc không được sửa tầng ghim.
  2. `3.3` `4.3` `5.3` **không** thêm dấu lược nào. Pāli liệt kê đủ chín món và kết `.`, nên theo luật
