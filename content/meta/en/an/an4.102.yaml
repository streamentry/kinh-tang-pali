  ## Nhóm B — khoá nguồn, tỉ lệ khớp đo được, phần chèn lại

  Sáu khoá B dựng lại từ khuôn `2.5`/`2.6`, vốn **đã có lời sẵn trong bài** ở tầng đã ghim. Tỉ lệ khớp
  đo bằng tập từ (bỏ dấu câu), mẫu số là số từ hợp nhất:

  | khoá | khuôn | khớp | tỉ lệ | phần tầng đã ghim không có, lớp lấp chèn lại |
  |---|---|---|---|---|
  | `3.5` | `2.5` | 8/8 | 1.000 | đảo thứ tự cặp `gajjitā`/`vassitā` |
  | `3.6` | `2.6` | 7/7 | 1.000 | đảo thứ tự cặp `gajjitā`/`vassitā` |
  | `4.5` | `2.5` | 8/9 | 0.889 | thêm `neva` vào **cả hai** vế |
  | `4.6` | `2.6` | 7/8 | 0.875 | thêm `neva` vào **cả hai** vế |
  | `5.5` | `2.5` | 7/9 | 0.778 | bỏ `no`, thêm `ca … ca` (cả hai vế) |
  | `5.6` | `2.6` | 6/8 | 0.750 | bỏ `no`, thêm `ca` (cả hai vế) |

  ⚠ `3.5` và `3.6` có tỉ lệ 1.000 nhưng **vẫn là B, không phải A**: tập từ giống hệt, **thứ tự từ
  thì đảo**. Nếu chép y `2.5` vào `3.5` thì bài sẽ nói "sấm rền nhưng không mưa" ở cả `2.5` lẫn `3.5`,
  tức là đảo cực nghĩa của bài. Đây là bẫy đúng như `sn11.24:1.7` — đọc một khoá lặp lại mà không
  biết nó lặp **cặp nghĩa** nào.

  **Bằng chứng rằng phần dựng lại không phải phỏng đoán**: cả sáu khoá B đều **trùng byte** với một
  khoá đã `published` ở bài khác — `3.5`≡`an4.101:4.3`, `3.6`≡`an4.101:4.4`, `4.5`≡`an4.101:5.3`,
  `4.6`≡`an4.101:5.4`, `5.5`≡`an4.101:6.3`, `5.6`≡`an4.101:6.4` — và bản Việt canonical của chính
  an4.102 nói đúng như vậy (`3.5` = "một cá nhân mưa nhưng không sấm rền"; `5.6` = "vừa sấm rền vừa mưa").

  ## Nhãn thứ tự `5.9`

  `Dutiyaṁ.` = "Second." **đúng chỗ**. Đo toàn tầng: tầng Pāli đã ghim của bộ `an` có **1.407** khoá
  mang nhãn thứ tự, trong đó **1.401** không có một chữ nào ở tầng Anh đã ghim. Lớp lấp đã có sẵn
  **30** giá trị thuần nhãn thứ tự. Ở an4.102 nhãn khớp: an4.101 là `Paṭhamavalāhakasutta` (thứ nhất),
  an4.102 là `Dutiyavalāhakasutta` (thứ hai), và Phẩm Mây gồm đúng 10 bài an4.101–an4.110.
  ⇒ **Không có cảnh báo nào ở đây** — khác `an6.27`, nơi `Sattamaṁ.` đứng trên chỉ sáu dịp.
  `5.9` dài 8 ký tự Pāli, dưới ngưỡng 40 nên **không tính vào coverage**, dù đã lấp.

