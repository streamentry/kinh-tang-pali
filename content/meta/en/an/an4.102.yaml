  ## Song song với an4.107 — đã dựng chỉ mục Pāli→English để không mâu thuẫn

  Đo cả hai bài: chúng chia **8** chuỗi Pāli trùng byte. Trong 14 khoá của tôi, **6** khoá trùng với
  một khoá trống của an4.107 (`Mūsikasutta`, cùng Phẩm Mây, cũng 14 khoá trống):
  `2.7` `4.7` `5.7` ≡ `an4.107:2.7` `4.7` `5.7` (chuỗi `tathūpamāhaṁ…`) và
  `3.3` `4.3` `5.3` ≡ `an4.107:3.3` `4.3` `5.3` (danh sách chín món).
  Tôi lấy nguyên văn từ bản đã `published`, nên lát an4.107 **phải** lấy lại đúng những giá trị ấy cho
  sáu khoá đó, nếu không hai bài sẽ tự mâu thuẫn.

  ⚠ **Cạm bẫy đo được**: `an4.107:3.7` là `tathūpamāhaṁ, bhikkhave, imaṁ, puggalaṁ vadāmi.` —
  **thừa một dấu phẩy** sau `imaṁ`, nên **không** trùng byte với `an4.102:2.7`. Nếu lát kia đối chiếu
  bằng so khớp "gần giống" thì sẽ dịch lại và tự tạo ra hai cách dịch cho cùng một câu. Nên đối chiếu
  **byte**, và chép lại `I say that this individual is like that.`

  Sáu khoá `Evaṁ kho…` / `Seyyathāpi so…` của tôi **không** trùng với an4.107, vì an4.107 dùng
  `Seyyathāpi sā … mūsikā` và `no gādhaṁ kattā` thay cho `valāhako` và `gajjitā`. Nên chúng không thể
  mâu thuẫn với lát kia — nhưng chúng phải nhất quán **với nhau**, và việc chép nguyên văn từ
  an4.101 bảo đảm điều đó.