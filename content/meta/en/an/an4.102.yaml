  Đo bằng hai phép độc lập, cả hai đều **0** ⇒ an4.102 **không** dính (như `sn55.27`).

  1. *Thực nghiệm*: với mỗi khoá trống, đếm số từ nội dung (≥4 ký tự) của Pāli khoá đó có xuất hiện
     trong lời của khoá **đã điền gần nhất**. Ngưỡng cảnh báo là ≥5. Kết quả: **0/14** khoá trống đạt
     ngưỡng (mọi khoá đều 0 từ trùng).
  2. *Tỉ lệ độ dài*: trung vị số từ Anh / số từ Pāli của 28 khoá đã điền là **1.29**; ngưỡng cảnh báo
     là `max(2.5, 2.2 × trung vị) = 2.84`. **0** khoá vượt ngưỡng. Cao nhất là `1.1` (2.67) — đó là câu
     mở đầu có `bhikkhave`, không phải khoá nuốt khoá.

  ⇒ **Không có nội dung nào bị in hai lần ở bài này.** Sửa tầng đã ghim là `SHADOWING`, nên tôi chỉ đo
  và báo.

  ## Lỗi tầng Anh đã ghim tìm được ở an4.102 (đếm, không sửa)

  1. **Bịa dấu lược nơi Pāli viết đủ — 4 khoá, 6 dấu.** `2.4` có Pāli viết đủ cả Tứ Thánh Tế Đế
     không lược gì, Sujato chèn **3** dấu `…` giữa bốn vế. `3.2` `4.2` `5.2` có Pāli kết bằng gạch
     ngang `—`, Sujato đổi thành ` … `. Đáng chú ý: `2.2` cùng khuôn `Idha, bhikkhave, ekacco puggalo
     dhammaṁ pariyāpuṇāti—` lại **giữ nguyên** `—`, nên đây là thiếu nhất quán **trong cùng một bài**.
  2. **Đảo thứ tự — 2 khoá ở bài này, và đó là thói quen của cả tầng.** Pāli `gajjitā ca vassitā ca`
     (sấm rền **rồi** mưa) được Sujato dịch `one both rains and thunders` ở `1.6` và `1.13`. Đo toàn
     tầng Pāli `an`: có **6** khoá chứa đúng chuỗi này, **4** khoá bị đảo, **0** khoá giữ thứ tự Pāli.
     ⇒ có tính hệ thống, không phải lỗi đánh nhầm một chỗ.
  3. **Nén chữ nhấn `neva` — 1 khoá.** `4.2` Pāli `neva dhammaṁ pariyāpuṇāti` nghĩa là "không học thuộc
     Pháp **chút nào**"; Sujato ghi "doesn't memorize the teaching", mất chữ nhấn. Cùng bài, `4.1`
     vẫn giữ "neither" cho `neva`, nên lệch trong chính bài. Nhẹ, nhưng đọc `4.2` sẽ khiến `neva` ở
     `4.1` trông thừa.
  4. **Lệch số cặp nháy đơn ở `3.4` `4.4` `5.4` — KHÔNG phải lỗi.** Pāli mỗi khoá có hai cụm trong
     nháy đơn với `…pe…` ở giữa; Sujato dựng cụm đầu + **đúng một** `…`. Đây là lược chạy đúng quy
     tắc, tôi ghi ra để người sau không sửa nhầm thành lỗi.

  Đo lại bằng quy tắc nháy đúng (dấu nhạt lượu = `’` + `s|t|ll|re|ve|d|m`, không theo sau bằng chữ
  cái): tệp `an4.102` của tầng Anh đã ghim có **21** dấu `’`, **14** là nháy lượu (`’t` 9, `’s` 5),
  **7** là nháy đóng thật. Sau khi trừ nháy lượu, chỉ còn **3** khoá lệch (mục 4 ở trên).

  ## Chỗ lớp lấp **cố ý lệch** tầng Anh đã ghim

  1. `5.6` đọc `thunders and rains` (giữ thứ tự Pāli) trong khi `1.13` của tầng ghim đọc
