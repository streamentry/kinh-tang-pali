  Bốn lệnh đó còn lại cho người điều phốn. Những gì đã tự kiểm bằng phép đo trên tệp: JSON hợp
  lệ, **19/19** khoá nằm trong tập lấp (đúng bằng tập khoá tầng đã ghim để trống) và **không** khoá
  nào tầng đã ghim đã có lời (không shadow), thứ tự khoá trong tệp **đúng** thứ tự Pāli, toàn bộ 19
  giá trị ở dạng NFC, không có vệt markup, không khoá nào thêm hay mất dấu lược, nháy khớp Pāli
  **19/19**, và **12/12** khoá công thức dùng **cùng một** lõi. Các phép đo trong ghi chú này chỉ đọc
  tệp, không sửa gì ngoài hai tệp của lát.