notes: >-
  Bản đã ghim đã dịch đúng câu này ở 2.2; 1.4 chỉ khác ở chỗ mở đầu bằng `Ime kho`
  = "these". Giữ nguyên "rightly developed and rightly reiterated" — đây là cặp
  `sammā bhāviyamānā` / `sammā anuparivattiyamānā`, và `anuparivattiyamānā` là "lặp
  lại có trật tự", không phải "tiếp nối".
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
