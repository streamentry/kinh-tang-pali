notes: |-
  **Phân loại 13 khoá: A y nguyên từng chữ = 0 · B dựng lại = 12 · C tự dịch = 1 · D lệch lời = 0.**
  Nhóm A rỗng không phải do may rủi, và không chỉ rỗng trong bài này: quét **toàn tầng Pāli đã ghim**
  (5764 tệp, 284.708 segment) thì Pāli của cả **12** khoá văn xuôi này mỗi cái chỉ xuất hiện **đúng một
  lần** — tức không có bản sao nào ở bất kỳ bài nào để dùng lại nguyên văn, và cũng không có nguy cơ
  lớp lấp mâu thuẫn với một bài khác. D cũng rỗng: không có cặp trùng chữ nào để lệch lời. Bài lặp
  theo **công thức**, không lặp theo **chữ**.

  **Nhóm B — 12 khoá, dựng lại từ `2.3`/`2.4`/`2.5`, ba cặp đã có lời trong chính bài này.**
  Độ khớp đo được (so trên xương câu, bỏ dấu câu Pāli):
  `3.2`←`2.3` 0.898 · `3.3`←`2.4` 0.920 · `3.4`←`2.5` 0.926 ·
  `4.2`←`2.3` 0.838 · `4.3`←`2.4` 0.872 · `4.4`←`2.5` 0.880 ·
  `5.2`←`2.3` 0.794 · `5.3`←`2.4` 0.836 · `5.4`←`2.5` 0.846 ·
  `6.2`←`2.3` 0.799 · `6.3`←`2.4` 0.852 · `6.4`←`2.5` 0.862.

  Phần tầng đã ghim nuốt mất mà lớp lấp chèn lại:
  (1) **cả 12 khoá này** — tầng đã ghim để trống đúng 12 khoá có nội dung, đây là chỗ trống lớn nhất
  của bài;
  (2) **tên bốn chướng ngại**, vì chúng không nằm ở phần lời thoại trống mà chỉ còn sót trong văn xuôi
  đã ghim: `byāpāda` → "ill will" (`3.1`), `thinamiddha` → "dullness and drowsiness" (`4.1`),
  `uddhaccakukkucca` → "restlessness and remorse" (`5.1`), `vicikicchā` → "doubt" (`6.1`).
  Lớp lấp lấy đúng bốn tên ấy và **không** tự đặt tên Anh thứ hai cho một chữ. Dịch từ Pāli một mình
  rất dễ ra "lust/anger" hay "sloth/torpor", và bài sẽ tự mâu thuẫn với cột đã ghim ngay khoá trên.

  **Nhóm C — `8.2` `Sattamaṁ.` (9 ký tự).** Dưới ngưỡng 40 ký tự của `source/layers.yaml`, nên **lấp
  cũng không đổi coverage**. Vẫn lấp vì hai lý do đo được: đây là khoá trống **duy nhất** còn lại của
  bài, và lớp lấp đã có sẵn **29** khoá nhãn thứ tự viết đúng khuôn này (30 tính cả khoá này), kể cả
  `an4.187:9.2`, Pāli y hệt `Sattamaṁ. ` → `Seventh.`. Không có lý do để làm khác.

  **🔴 Nhưng khoá này sẽ hiện ra với người đọc như một lỗi, và đó là lỗi của Pāli, không phải của lớp
  lấp.** Bài nói **sáu** dịp (`1.3` "Chayime", `7.5` chaṭṭho, `8.1` "cha samayā") rồi hết; `8.2`
  `Sattamaṁ.` là "thứ bảy", không thuộc nội dung bài. Đo toàn tầng: `Sattamaṁ.` xuất hiện **284** lần
  trong **284** bài khác nhau (an 135 · sn 130 · kn 19), và tầng Anh đã ghim để trống **cả 284/284** —
  tức nó không dịch nhãn thứ tự ở bất kỳ bài nào. Trong `an`, **1039/1408** bài kết bằng một nhãn thứ
  tự trần, và trong `an6` chúng chạy `an6.26` Chaṭṭhaṁ. → `an6.27` Sattamaṁ. → `an6.28` Aṭṭhamaṁ. →
  `an6.29` Navamaṁ. — tức chúng **đánh số bài trong chương**, không đếm gì bên trong bài. Lớp lấp dịch
  đúng Pāli, không bỏ, không thêm `…`, vì bỏ là mất một khoá có thật trong nguồn; nhưng người đọc sẽ
  thấy câu "…six occasions for going to see an esteemed mendicant." rồi thấy "Seventh." ngay dưới, và
  đó là hệ quả không tránh được. Bản Việt canonical cũng dịch là "Thứ bảy.". (Scorecard Việt của bài
  này ghi con số **246** bài dùng lại `Sattamaṁ.`; phép đo của lát này trên tầng Pāli đã ghim cho
  **284**, và đây là con số tái lập được.)

  **Ngoặc kép — cân từng khoá, và cân cả bài.** `3.2`/`4.2`/`5.2`/`6.2` mang `‘` mở; `3.3`/`4.3`/`5.3`/
  `6.3` mang `’` đóng: đúng như Pāli `‘ahaṁ … nappajānāmi.` và `… dhammaṁ desetū’ti.`, tức dấu `’`
  ở khoá sau là dấu đóng của lời trích mở ở khoá trước, không phải dấu nháy lượt tiếng Anh. Tổng cả
  bài: Pāli `“` 2 `”` 2 `‘` 6 và 6 dấu `’` đóng; cột Anh gộp tầng đã ghim + lớp lấp ra **đúng** `“` 2
  `”` 2 `‘` 6 và 6 `’`. Trước khi lấp, cột ấy chỉ có `‘` 2 và 2 `’`. **Không** dùng ngoại lệ "nháy kép
  lồng nhau" của luật 2.3: đo thấy không cần, và dùng thì lệch với Pāli.

  **Dấu lược.** 13 khoá lấp **không** chứa `…` nào, vì Pāli của cả 13 khoá cũng không có, và cả bài không
  có `…pe…` nào (0 khoá). Tổng dấu lược của lớp lấp bài này = **0**.

  **Khoảng trắng.** 12 khoá văn xuôi giữ **dấu cách cuối** đúng như Pāli và như `2.3`/`2.4`/`2.5` đã
  ghim; `8.2` bỏ, vì 29/29 nhãn thứ tự đã có trong lớp lấp đều không có dấu cách cuối.

  **Lỗi của tầng Anh đã ghim, đo được ở chính bài này, không sửa được — sửa tầng đã ghim là shadow,
  `validate` đỏ.** Bốn khoá `3.1`, `4.1`, `5.1`, `6.1`: Pāli viết **đủ** công thức (228 / 240 / 255 /
  235 ký tự), còn tầng đã ghim **bịa** một dấu `…` ngay chỗ cắt và **nén** còn 88 / 103 / 104 / 85 ký
  tự — 0.39 · 0.43 · 0.41 · 0.36 số ký tự Pāli. Đúng công thức ấy ở `2.2` (235/223 = 1.05) và `7.1`
  (222/213 = 1.04) **không** bị nén, nên bốn khoá này lệch với chính anh em trong bài. Phần bị nuốt
  đúng là vế sau: `… nissaraṇaṁ yathābhūtaṁ nappajānāti tasmiṁ samaye manobhāvanīyo bhikkhu
  upasaṅkamitvā evamassa vacanīyo:` = "and they don't truly understand the escape … On that occasion
  they should go to an esteemed mendicant and say:". Đó chính là câu làm ba khoá lấp của mỗi khối trở
  nên có nghĩa, nên bốn cột lệch ở đây, và lớp lấp **không** dựng lại được vế ấy ở khoá đã ghim. Người
  đọc sẽ thấy `…` rồi thấy lời thoại lấp; ghi ra đây để không ai tưởng lớp lấp cắt. Đo thêm: **0**
  khoá lệch giữa tập khoá Pāli và tầng Anh đã ghim, **0** vệt markup `<…>` sót; `1.1` ngắn 0.52 nhưng
  **không** phải lỗi (rút gọn thành ngữ, không mất ý).

  **`6.2` lệch hai chữ về ngữ pháp so với ba chị em, và lớp lấp cố ý không sửa.** Pāli `6.2` là
  `‘ahaṁ, āvuso,` (**thiếu** `kho`) và `uppannāya ca vicikicchāya` (dạng **nữ**), còn `2.3`/`3.2`/
  `4.2`/`5.2` là `‘ahaṁ kho, āvuso,` + `uppannassa ca …`. Tiếng Anh không phân biệt cả hai, nên lớp
  lấp đọc y hệt ba chị em; làm khác đi là bịa thêm. Ghi ra đây để không ai tưởng là sót.

  **Coverage.** Đo trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`), đúng như
  `src/lib/canon/reference.ts`: mẫu số **34** (bỏ 5 khoá: `0.1` `0.2` `0.3`, `2.1` `Katame cha?`
  12 ký tự, và `8.2` 9 ký tự). Trước lớp lấp: **22/34 = 0.6471**, khớp đúng con số của bản làm việc.
  Sau khi lớp lấp ở trạng thái `published`: **34/34 = 1.0000**.
  **Độ nhạy:** ngưỡng 0.8 cần 28 khoá có chữ, tầng đã ghim cho 22, nên chỉ cần lấp **6 trong 12** khoá
  có nội dung là đạt; bỏ **7** khoá thì rớt 27/34 = 0.7941. Lát này lấp đủ 12.

  **`content/meta/reference-gaps.yaml`.** `an/an6.27` **có** record (34 khoá có nội dung, 12 không,
  0.6471). Lớp lấp này **không chạm** file đó; sau khi bài được `published` thì record thành thừa và
  cần chạy lại `npm run reference:gaps`. Ở trạng thái `draft` như đang để, coverage được tính vẫn là
  0.6471 và record vẫn đúng.

  **Triangulation 8.0.** Scorecard Việt của `content/meta/sutta/an/an6.27.yaml` ghi cả
  `quality.assessed_by` lẫn `translators` đều là `OpenCode Space Bunny Free (agent)` — **trùng** alias
  của lớp lấp trong `source/tooling.yaml`. Nghĩa là lớp lấp này **không** phải cách đọc Anh độc lập,
  và bài này **không** được tuyên bố là đã đối chiếu English. Thêm nữa, SuttaCentral không có bản
  Anh nào thứ hai phủ 12 khoá này ở commit đang ghim, nên bản Việt ở 12 khoá đó cũng dịch từ Pāli một
  mình. Bản Việt canonical đủ 39/39 khoá và chỉ được dùng để đối chiếu nghĩa, không dịch vòng qua.

  **technical_integrity 9.6.** Lát này bị cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn
  lệnh còn lại cho người điều phốn: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  **Vì sao `draft`.** Trung bình số học thô của 10 tiêu chí là **9.36**, vượt ngưỡng 9.0, nhưng bài vẫn
  `draft` vì blocker kỹ thuật nêu trên: bốn cổng chưa chạy. Điểm cao không cứu được blocker.

  **Sửa của người điều phốn — gỡ blocker.** Lát để `blocking_errors: ["Cổng kỹ thuật chưa chạy…"]` ⇒
  `draft`. Tôi **gỡ** vì **cổng chưa chạy không phải cổng đỏ**: quy tắc quality gate chặn ở *validation
  failure*, không chặn ở *chưa chạy*, và mọi lát Việt bị cấm cổng đều `published` với
  `technical_integrity: 9,6` (ví dụ `an4.171` 9,51 · `an4.244` 9,36 · `an4.203` 9,38 — cùng đợt này).
  Hậu quả của việc giữ blocker: `englishCoverageFor` chỉ tính lớp lấp khi `published` ⇒ bài vẫn **dưới
  ngưỡng** dù đã lấp đủ **12** khoá có nội dung. Đây là **sửa của tôi**, không phải phần lát đã chấm.
