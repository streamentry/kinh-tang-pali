notes: |-
  `1.9` TRÙNG NGUYÊN VĂN `1.5` và `1.10` TRÙNG NGUYÊN VĂN `1.6` (chỉ khác chữ `ti`
  trong `”ti.` của bản Pāli MS ở 1.10). Bản đã ghim đã dịch cả hai, nên chép lại y
  nguyên — đúng luật của `sn11.24`. Giữ luôn `“` mở ở `1.9` và `”` đóng ở `1.10`,
  vì Pāli mang đúng hai dấu ấy ở hai khoá khác nhau và luật 4 đòi khớp theo từng khoá.

  `sakyaputtikānaṁ` giữ "the ascetics who follow the Sakyan" nguyên văn, đúng như 1.5.

  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
