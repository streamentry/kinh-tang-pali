notes: |-
  Tiền lệ: `2.2` (đã ghim) dịch `byāpannacitto` = "malicious" và `micchādiṭṭhiko` = "with wrong
  view"; `4.2` (đã ghim) dịch `abyāpannacitto` = "kind-hearted" và `sammādiṭṭhiko` = "with right view";
  `3.2` và `5.2` (đã ghim) dịch `parañca … samādapeti` = "And they encourage others to do these things".
  Dấu `;` nối hai vế lấy từ lớp Việt `an4.204:3.3` và `5.3`, vốn dùng đúng cấu trúc này.

  Khác biệt có chủ ý so với bản đã ghim: tôi dịch `parañca byāpāde samādapeti` thành "encourage others
  to be malicious" chứ không phải "encourage others to do these things". Lý do: ở Pāli mục đích được
  nói rõ (`byāpāde`, `micchādiṭṭhiyā`, `abyāpāde`, `sammādiṭṭhiyā`), và bản Anh đã ghim chỉ gộp chung
  vì nó đã lược phần giữa bằng `…pe…` — còn ở `3.3`, `5.3`, `5.4` không có `…pe…`, không được lược.

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
