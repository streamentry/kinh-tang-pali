notes: |-
  Bốn khoá trong năm là lặp lại đúng Pāli đã có bản dịch, nên dùng lại nguyên văn:

  * 12.4 — Pāli giống hệt `an6.55:11.4` đã ghim, chỉ khác `nekkhammādhimutto` →
    `pavivekādhimutto`; dùng đúng từ "seclusion" mà `an6.55:12.2` đã ghim dùng cho
    chính `paviveka`.
  * 13.4 — cũng giống 11.4, khác `abyāpajjādhimutto`; dùng "kindness" theo
    `an6.55:13.2` đã ghim.
  * 17.14 — Pāli giống `an6.55:17.2` và `17.20` đã ghim (chỉ khác dấu phẩy), dùng lại
    nguyên văn "Their mind is quite untainted. It is steady, imperturbable, observing
    disappearance."
  * 17.19 — Pāli **giống hệt** `an6.55:17.7` đã ghim; dùng lại nguyên văn.

  **Bất định thật sự ở 17.11.** Pāli là `atha uttarāya cepi disāya āgaccheyya bhusā
  vātavuṭṭhi …` — một vế đầy đủ về phía bắc, kết bằng dấu lược. Nhưng bản đã ghim ở
  `an6.55:17.10` đã gộp sẵn cả bốn hướng: "Even if violent storms were to blow up out
  of the east, the west, the north, and the south," — tức "the north" đã bị tiêu ở
  17.10, còn 17.11 thì bị bỏ trống. Đọc cạnh nhau trong reader sẽ thấy "the north" hai
  lần.

  Tôi giữ vế của chính khoá này, chỉ dùng lại cụm của 17.10 và giữ đúng một dấu lược.
  Lựa chọn còn lại là bịt khoá này lại (chỉ ghi "…"), nhưng đó là lược chữ trong kinh
  để bớt lặp — đúng cái `…` ở Pāli đang đánh dấu, và vi phạm nguyên tắc không lược.
  Đây là điểm bất định giữ lớp lấp và bản đã ghim, không phải lỗi dịch; nó là lý do hạ
  `ambiguity_integrity`.

  Lớp lấp: 5 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn
  bị mất.