notes: >-
  Cùng công thức tanh chứng `itipi so bhagavā arahaṁ sammāsambuddho …pe… satthā
  devamanussānaṁ buddho bhagavā’ti` đã dùng ở `an5.135:4.3` và `an7.6:2.3`; đây là lần thứ
  ba, và cả ba đều bị bản đã ghim lược. Ba khoá dịch như nhau. `…pe…` giữ nguyên một dấu
  lược.
  
  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
