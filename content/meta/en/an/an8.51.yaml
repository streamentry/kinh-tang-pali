  ghin ở cả ba bốn chỗ với cùng một bản dịch. Dùng lại nguyên văn, kể cả dấu `“`/`”` và
  `don’t`, vì bốn lần lặp phải đọc như một mẫu câu duy nhất.
  Lớp lấp: 2.3 (`“Alaṁ, gotami.`) cũng trống trong bản đã ghin nhưng KHÔNG thuộc lát này, nên
  bản đọc 2.2–2.4 còn thiếu một vế — ghi lại để người đọc không tưởng bản lấp đã đầy đủ.
  
