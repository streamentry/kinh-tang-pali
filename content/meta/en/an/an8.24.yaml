notes: |-
  Tiền lệ: 1.18 đã ghin "Whether in the past, future, or present, all those who have brought
  together a large congregation have done so by using these four ways of being inclusive.”
  1.19 và 1.20 tách lại theo `anāgatamaddhānaṁ` và `etarahi`, dùng lại đúng "bring together a
  large congregation" và "these four ways of being inclusive". 1.20 mang `”ti` nên đóng ngoặc.
  Bất định: `saṅgahavatthūhi` ở đây là "bốn cách để quy tụ", bản đã ghin dịch "four ways of
  being inclusive"; giữ nguyên vì 1.18 đã ghin.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
