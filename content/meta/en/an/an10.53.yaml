notes: >-
  Câu này là vế thứ hai của ví dụ 7.3 (áo hoặc đầu cháy), và bản đã ghim đã gộp
  nó vào 7.3. Bộ từ `adhimatto chando ca vāyāmo ca ussāho ca ussoḷhī ca appaṭivānī
  ca sati ca sampajaññañca` đã có chữ ở 7.2 và 7.5, nên dùng lại nguyên văn cho
  tính nhất quán. `nibbāpanāya` = "để dập tắt", khác `an10.54:5.4` cũng dùng chữ
  này nhưng nghĩa là "để có được".
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
