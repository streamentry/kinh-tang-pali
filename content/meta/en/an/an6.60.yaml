notes: |-
  BẢN DỊCH LẤP 6 KHOÁ, TẤT CẢ ĐỂ TRỐNG Ở TẦNG ĐÃ GHIM. Không khoá nào là blockquote tham chiếu hay Pāli rỗng, nên không có khoá nào bị bỏ.

  LUẬT 3 (DÙNG LẠI CÁCH DỊCH ĐÃ CÓ) — 3/6 KHOÁ LÀ CHÉP NGUYÊN VĂN BẢN ĐÃ GHIM:
  - 3.6 = Pāli trùng `2.3` → chép y nguyên “But when they’re separated from the Teacher …”.
  - 8.11 = Pāli trùng `8.2` → chép y nguyên “Thinking, ‘I get the signless immersion of the heart!’ …”.
  - 8.12 = Pāli trùng `2.4` **và** `3.7` **và** `8.3` (ba khoá đã ghim, cả ba đều dịch giống hệt nhau) → chép y nguyên “As they mix closely, they become familiar and loose …”.
  Đo được bằng cách so từng khoá với toàn bộ Pāli của bài: 3.6 khớp `2.3`, 8.11 khớp `8.2`, 8.12 khớp ba khoá.

  3 KHOÁ CÒN LẠI (9.6 / 9.8 / 9.10) DỰNG TỪ 9.4 VÀ 10.2 ĐÃ GHIM, KHÔNG DỊCH LẠI TỪ ĐẦU: Đếm `vihārasamāpattīnaṁ` trên toàn corpus Pāli đã ghim: **9** khoá, **5** để trống, **4** có bản dịch đã ghim — và cả 4 đều là một trong hai cụm: “this and that meditative attainments” (đúng 9.4 và 10.2 của bài này) hoặc “such and such meditations and attainments” (mn31:20.3 và 20.5). Vì đây là bài của chính mình nên lấy y hệt cụm của 9.4/10.2. Mệnh đề `hīnāyāvattissatī` đã ghim ở 9.4 là “would still resign the training and return to a lesser life”, dùng lại nguyên văn. Khung `‘citto, bhante, hatthisāriputto …’` dựng theo 10.2 (“Sir, Citta Hatthisāriputta, who had gained …”), với `bhante` → “Sir” như 10.2.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU — 9.6 VÀ 9.10 CÙNG PĀLI CHỈ KHÁC DẤU CÂU:
  Hai khoá đồng nhất từng chữ (`’”?` so với `’”.`), nên theo luật 3 lẽ ra phải dịch giống hệt. Nhưng chúng không cùng chức năng: 9.6 đứng sau 9.5 `udāhu devatā etamatthaṁ ārocesuṁ:` (“Or did deities tell you about it?”) nên phải là **câu hỏi**; 9.10 đứng sau 9.9 `Devatāpi me etamatthaṁ ārocesuṁ:` (“And deities also told me.”) nên phải là **mệnh đề**. Vì vậy 9.6 kết bằng `?’`, còn 9.10 và 9.8 kết bằng `.’`. Người đọc bốn cột sẽ thấy hai khoá cùng Pāli nhưng dấu cuối khác nhau — đó là chủ ý, và là điểm phải nói rõ. 9.8 bỏ `bhante` vì 9.7 (`Cetasā ceto paricca vidito me, āvuso:`) đã ghim là “Reverends, I encompassed his mind and knew this.”; giữ “Sir” sẽ thành “Reverends, Sir”.

  DẤU LƯỢC: bài không có `…pe…` trong 6 khoá này; không phát sinh chính sách.

  TRIANGULATION 8.0, KHÔNG CAO HƠN: đây là lớp lấp, và người viết lớp lấp cũng chính là người chấm scorecard, nên đây KHÔNG phải một cách đọc English độc lập. Mọi khoá đều dựa từ Pāli root + bản Anh đã ghim TRONG CHÍNH BÀI NÀY; không có bản Anh độc lập nào phủ cho chúng ở commit đang ghim. Điểm này nằm sẵn trong bản chất của lớp lấp, không phải thiếu sót phát sinh từ bản dịch này.

