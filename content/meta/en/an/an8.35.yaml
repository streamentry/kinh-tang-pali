notes: |-
  Tiền lệ: 2.7 trùng NGUYÊN VĂN 1.8/3.11/4.7 và 2.8 trùng NGUYÊN VĂN 1.9/3.12/4.8, đã
  ghin ở cả ba chỗ với cùng một bản dịch. Dùng lại nguyên văn — đây là luật của `sn11.24`:
  cùng một Pāli lặp lại thì phải dùng lại đúng bản dịch đã có, không dịch lại.
  Bất định nhỏ: `hīne vimuttaṁ, uttari abhāvitaṁ` là "mới dừng ở mức thấp hơn, chưa tu tập
  thêm"; bản đã ghin dịch "they've settled for less and not developed further", giữ nguyên.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
