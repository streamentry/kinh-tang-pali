notes: >-
  `bālo veditabbo` ở 1.5 và `paṇḍito veditabbo` ở 1.7 đều bị lược, nên cặp "người
  ngu / bậc giải thoát — người hiểu biết / đáng được biết là" chỉ còn một nửa.
  `veditabbo` dịch thành "is to be known as" thay vì "should be regarded as": đây là
  tuyên bố về sự phân định, không phải lời khuyên, và `veditabba` ở 1.5 cũng vậy.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
