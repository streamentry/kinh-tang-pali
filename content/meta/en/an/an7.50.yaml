notes: |-
  Năm khoá này là các vế `Napi …` mà Sujato đã gộp vào vế trước kèm `…pe….`, nên mỗi
  khoá lấy lại đúng bộ từ của vế đã ghim trong chính bài này:

  * 1.6 — bộ tính từ lấy từ `an7.50:1.5` đã ghim: "live the chaste life intact,
    impeccable, spotless, and unmarred, full and pure". `ahañhi` → "For I".
  * 4.1 — vế còn lại của `an7.50:3.2` đã ghim ("However, they giggle and play and have
    fun with ladies."); `Napi` → "Nor do they", đúng như `an7.50:3.1` đã ghim dùng
    "Nor do they" cho `napi`.
  * 5.1 — vế còn lại của `an7.50:4.2` đã ghim ("they gaze into a lady’s eyes.").
  * 6.1 — vế còn lại của `an7.50:5.2` đã ghim.
  * 7.1 — vế còn lại của `an7.50:6.2` đã ghim.

  Dấu ngoặc ở 1.6: Pāli mở `‘` và đóng bằng **`’”ti.`** (hai dấu: đóng lồng + đóng
  ngoài), nên bản Anh mang `‘For I, … full and pure.’”`. Đây đúng là khuôn Sujato đã
  dùng ở `an7.50:10.3` đã ghim, với cùng cấu trúc `’”ti.`. Ngược lại `mn125:32.6`
  chỉ có `”ti.` nên bản Anh ở đó chỉ mang một dấu đóng — hai bài không bị ép về cùng
  một hình thức.

  Bất định: cách đặt dấu nháy bám sát Pāli khiến các khoá `Napi …` mở đầu bằng `;`
  chứ không phải câu tròn trải, nhưng đó là hệ quả trực tiếp của việc tách vế theo
  segment của nguồn, và giữ nguyên còn hơn viết lại thành câu.

  Lớp lấp: 5 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn
  bị mất.