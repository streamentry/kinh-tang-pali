notes: |-
  Tiền lệ: `1.2` (đã ghim) đã dịch `sāvatthiyaṁ vassāvāsaṁ upagantukāmo hoti` thành "wanted to
  commence the rains residence at Sāvatthī", nên `2.2` dùng đúng cụm "commence the rains residence at
  Sāvatthī". `4.6`+`4.7` (đã ghim) ghép lại chính là `4.2`+`4.3`, nên hai khoá này chép y nguyên theo
  luật 3, kể cả thì quá khứ "would set out wandering".

  Khác biệt có chủ ý: `4.6` của bản đã ghim BỎ `kira`, còn `2.2` của tôi GIỮ "they say". Lý do:
  `kira` không phải dấu lược, bỏ đi là mất một thành phần có nghĩa; và `2.1` của bản đã ghim đã ghi
  "Nandiya the Sakyan heard about this," nên "they say" không lặp ý. Ở `4.2` tôi theo bản đã ghim và
  bỏ `kira` như `4.6`, để hai chỗ đi cùng một kiểu.

  Dấu ngoặc: `4.3` kết bằng `’”` vì Pāli đóng hai ngoặc cùng lúc — `‘` của lời trong báo và `"` của
  lời Đức Phật mở ở `4.2`. Lớp Việt của kho dùng đúng khuôn này ở `an3.61:6.7` (`’”.`).

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
