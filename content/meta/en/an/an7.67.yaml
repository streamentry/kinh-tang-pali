notes: >-
  Cùng danh sách mười bối loại binh chủng ở `dn2:14.2` và `dn2:34.3`, hai nơi bản
  đã ghim đã dịch theo đúng thứ tự Pāli (elephant marshals → sons of
  bondservants), nên bản này dùng lại bộ từ ấy để cả kho không tự lệch. Chỗ bản
  đã ghim có vẻ đáng ngờ: `pakkhandino` dịch "chargers" (ngựa chiến) trong khi Pāli
  xếp nó giữa `rājaputtā` và `mahānāgā` — theo vị trí, nhiều khả năng là "người cầm
  giáp/hiệu sĩ". Giữ "chargers" vì đổi thì bài này lệch Dīgha; ghi lại ở đây như
  một nghi vấn cho người biên tập. Vế mục đích `abbhantarānaṁ guttiyā bāhirānaṁ
  paṭighātāya` chỉ có ở bài này, không có ở Dīgha, và dịch "to guard the inner gate
  and repel the attackers".
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
