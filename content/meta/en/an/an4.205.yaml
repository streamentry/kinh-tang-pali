  **Chỗ lớp lấp CỐ Ý lệch tầng Anh đã ghim, kèm lý do.** Đúng **một** chỗ, và là hệ quả trực tiếp của lỗi gộp khoá: lời ghim `3.2`/`5.2` kết bằng “And they encourage others **in these same qualities**”, còn mười bốn khoá lấp mỗi khoá **đứng một mình** và gọi tên yếu tố: “… and they encourage others **to have wrong purpose too**”. Lý do đo được: `3.2`/`5.2` đã in **trọn tám** mục trong một ô nên câu của nó không cần gọi tên lại; mười bốn khoá lấp thì mỗi ô phải tự đứng được khi người đọc quét cột Anh — gọi “these same qualities” ở từng ô sẽ bắt người đọc phải nhớ ô trước, và `3.9` (`samādhi`) thì còn cách ô `3.2` tới sáu ô. Hệ quả người đọc thấy được: nội dung của `3.3`–`3.9` và `5.3`–`5.9` in **hai lần**, một lần dồn trong lời `3.2`/`5.2`, một lần ở lớp lấp. Lặp ấy là do tầng ghim nói trước; giữ đúng một vế mỗi khoá là giữ đúng Pāli, và tôi không thể sửa tầng ghim. Ngoài ra lớp lấp giữ **“themselves”** cho `attanā` trong khi lời ghim không có từ này — xem mục “Khung câu”.

  **⚠ Lớp lấp này KHÔNG phải lớp đọc Anh độc lập cho an4.205, và 14 khoá thân KHÔNG được tuyên bố là đã đối chiếu English.** `content/meta/sutta/an/an4.205.yaml` ghi `quality.assessed_by: "GLM-5.3 Flash (ZCode)"`, **khác** công cụ đã viết lớp lấp này, nên `triangulation` không phải bị trần 8,0 như trường hợp trùng công cụ. Nhưng mức đó vẫn chỉ là **8,6** và lý do rất cụ thể: tầng Anh đã ghim có chữ ở **10** khoá nhưng **không khoá nào trong 14 khoá thân** — chỉ mục Pāli→English toàn tầng (**91.547** chuỗi có lời) cho thấy **14/14** khoá thân không xuất hiện ở bất kỳ đâu với lời nguyên văn. Quét gần trùng toàn tầng đưa mức cao nhất chỉ tới **0,7603–0,8640**, và cả 14 mức ấy đều là **khuôn câu**, không phải cùng nghĩa: nguồn gần nhất là lớp lấp `published` của chính chuỗi anh em (`an4.206:3.3` “They themselves have wrong freedom…”, `an4.202:3.4`, `an4.203:3.6`, `an4.201:3.4`, `an4.204:5.4`) — cùng cấu trúc `attanā … parañca … samādapeti`, nhưng danh từ của chúng là thứ khác (freedom · shameless · sexual misconduct · malicious), **không** phải tám yếu tố ở đây. Nếu chỉ quét riêng tầng đã ghim thì mức cao nhất là **0,6933–0,7833**, và nguồn gần nhất là `an8.25:4.3`/`4.4`/`4.6` “They’re accomplished in ethical conduct and encourage others to do the same.” — cũng không `attanā`, không “to have X”, và nói về bối cảc khác. Nghĩa của 14 khoá ấy được dựng từ **Pāli** + danh sách tám từ đã có sẵn ở chính bài này + bản Việt canonical, **không** từ một bản Anh nào. Tôi không sửa scorecard tiếng Việt.

