  **Bốn số phân loại 15 khoá: A = 1 · B = 14 · C = 0 · D = 0.** Tổng 1 + 14 + 0 + 0 = **15**, khớp đúng số khoá tầng Anh đã ghim để trống ở bài này (đo trên toàn bộ **32** khoá Pāli, không phải trên danh sách lát).

  **Nhóm A = 1 khoá, `5.11`, lấy nguyên văn “Fifth.”** Chỉ mục Pāli→English dựng trên toàn tầng Anh đã ghim (**4.168** tệp, tất cả đều tra được Pāli) cộng lớp lấp `published` (**797** tệp, trong tổng **798**; tệp `dhp44-59` là `draft` nên không tính) cho **91.547** chuỗi Pāli khác nhau có lời, trong đó **16.501** chuỗi mang nhiều hơn một khoá, tổng **139.007** cặp. Chuỗi `Pañcamaṁ.` có **2** nơi đã có lời — `sn33.5:1.13` và `sn55.25:11.11`, cả hai đều lớp lấp đã `published`, cùng đọc **“Fifth.”**, tỉ lệ khớp **1,0000** (trùng từng ký tự). 14 khoá thân không xuất hiện ở bất kỳ đâu trong chỉ mục.
  *(Ghi lại phép đo: quy mô chỉ mục của tôi là **91.547** chuỗi, trong khi lát `an4.202` ghi **47.268** cho cùng một phép dựng. Tôi không sửa con số của lát trước; tôi chỉ báo hai phép đo lệch nhau. Chênh lệch này không đổi kết luận của lát này — chỉ mục của tôi là **siêu tập** của phép kia theo phạm vi lớp lấp, nên nó chỉ có thể tìm ra **thêm** xung đột, không thể bỏ sót. Lý do đoán được: lớp lấp `published` hiện đã có **797** tệp, và chỉ mục phải nối được lớp lấp với Pāli qua **tên tệp**, trong khi thư mục Pāli của kho lồng theo chương còn thư mục lớp lấp thì phẳng — nối sai thư mục sẽ âm thầm rơi hết lớp lấp.)*

  **Nhãn thứ tự `5.11` — đo trước khi điền, và lý do không bỏ.** Tầng Anh đã ghim bỏ trống **mọi** nhãn thứ tự: quét **4.168** tệp Pāli có tầng Anh, các nhãn `Paṭhamaṁ.` **320** · `Dutiyaṁ.` **293** · `Tatiyaṁ.` **288** · `Sattamaṁ.` **284** · `Dasamaṁ.` **287** · `Catutthaṁ.` **282** · `Pañcamaṁ.` **281** · `Aṭṭhamaṁ.` **275** · `Navamaṁ.` **274** · `Ekādasamaṁ.` **62** · `Dvādasamaṁ.` **40** ⇒ **2.686** khoá nhãn, và **0** khoá nào có chữ ở tầng Anh đã ghim. (Con số này **cao hơn 2.402** ghi trong bản bàn giao. Tôi đo lại **hai** phạm vi độc lập — toàn bộ **5.764** tệp Pāli đã ghim, và chỉ **4.168** tệp có tầng Anh — và cả hai đều ra **2.686**, nên đây không phải sai số của phép quét. Tôi **không** đoán nguyên nhân chênh lệch và **không** sửa con số của người điều phốn. Một dữ kiện đáng ghi: ngoài mười một dạng tôi liệt kê, tầng Pāli còn có ít nhất **23** dạng nhãn thứ tự khác — `Terasamaṁ.` **16** · `Cuddasamaṁ.` **10** · `Pannarasamaṁ.` **7** · `Vīsatimaṁ.` **5** · `Sattarasamaṁ.` **5** · `Tiṁsatimaṁ.` **3** … — nên một phép đếm có thể ra con số khác tuỳ nó tính đến dạng thứ mấy.) Lớp lấp đã có `published` đọc nhãn thứ tự nhất quán 1:1 — `Paṭhamaṁ.`→“First.”, `Dutiyaṁ.`→“Second.”, `Tatiyaṁ.`→“Third.”, `Catutthaṁ.`→“Fourth.”, `Pañcamaṁ.`→“Fifth.” — **không có cách viết nào khác**. Chuỗi anh em `an4.201`–`an4.204` mang `Paṭhamaṁ.` `Dutiyaṁ.` `Tatiyaṁ.` `Catutthaṁ.` và đã lấp “First.” “Second.” “Third.” “Fourth.”; `an4.205` mang `Pañcamaṁ.` nên “Fifth.” là mắt xích thứ năm đúng chỗ. Bản Việt canonical `an4.205:5.11` dịch “Thứ năm.”, độc lập xác nhận. `5.11` dài **9** ký tự nên **không** vào mẫu số coverage: lấp nó không nâng tỷ số, nhưng để trống thì cột Anh hụt nhãn khối.

  **⚠ Cảnh báo nhãn thứ tự theo mục 5e — bài này ĐỦ số mục, nên KHÔNG có cảnh báo.** `Pañcamaṁ.` = “thứ năm”, và bài có **đủ tám** mục của con đường trung đạo ở `2.2` (`4.2` lặp lại y hệt): `diṭṭhi` kiến · `saṅkapp` tư duy · `vāc` ngữ · `kamma` nghiệp · `ājīva` mệnh · `vāyāma` tinh tấn · `sati` niệm · `samādhi` định. Người đọc sẽ thấy đúng tám mục rồi mới tới “Fifth.”, không có chỗ nào lệch. Với `an6.27` thì không được như vậy; ở đây thì có.

  **Nhóm B — 14 khoá dựng lại, kèm tỉ lệ khớp đo được và phần phải chèn lại.** Nguồn là **hai** khoá mà tầng đã ghim đã nuốt nội dung của mười bốn khoá này:
  · `3.3`–`3.9` (7 khoá) dựng từ lời ghim `3.2`
  · `5.3`–`5.9` (7 khoá) dựng từ lời ghim `5.2`
  **Phần tầng đã ghim nuốt mất** là chính mười bốn vế `attanā ca …, parañca … samādapeti` ấy. Lời ghim `3.2` viết “It’s someone who has wrong view, wrong purpose, wrong speech, wrong action, wrong livelihood, wrong effort, wrong mindfulness, and wrong immersion. **And they encourage others in these same qualities.**” — tức đã in ra trọn **tám** mục của khối `3.x` rồi để trống bảy khoá `3.3`–`3.9`; lời ghim `5.2` làm đúng như vậy với `5.3`–`5.9`. Đây là nguyên nhân trực tiếp của cả **14** lỗ coverage của bài.
  Tỉ lệ khớp đo được — cùng phép với `an4.202`, tức tỉ lệ chuỗi **Pāli của khoá lấp** so với **Pāli của khoá nguồn** đã có lời: `3.3` **0,6710** · `3.4` **0,6980** · `3.5` **0,6710** · `3.6` **0,6980** · `3.7` **0,7020** · `3.8` **0,7248** · `3.9` **0,7051** so với `3.2`; `5.3` **0,6579** · `5.4` **0,6849** · `5.5` **0,6579** · `5.6` **0,6849** · `5.7` **0,6892** · `5.8` **0,7123** · `5.9` **0,6928** so với `5.2`. Khoảng **0,6579–0,7248**, cao hơn chút khoảng của `an4.202` (0,5584–0,7403). Nhưng **nguyên nhân thì y hệt**: lời ghim gộp danh sách của cả khối vào ô đầu.
  Lớp lấp chèn lại **đúng một vế mỗi khoá** và giữ **nguyên từ của tầng đã ghim**, đọc thẳng từ hai danh sách tám mục đã có sẵn ở chính bài này: `2.2` cho cả tám từ khối `micchā-` và `4.2` cho cả tám từ khối `sammā-`. Nghĩa từng mục được đối chiếu với bản Việt canonical `an4.205:2.2`/`4.2`/`3.x`/`5.x` (tà kiến · tà tư duy · tà ngữ · tà nghiệp · tà mệnh · tà tinh tấn · tà niệm · tà định; chánh kiến · chánh tư duy · chánh ngữ · chánh nghiệp · chánh mệnh · chánh tinh tấn · chánh niệm · chánh định) — khớp **8/8** mục ở cả hai khối, không mục nào lệch.

  **Khung câu — lấy từ tiền lệ đã xuất bản, không sáng tác.** Chính bài này không có khoá nào đã lấp nên không có lời để mượn trong bài; tôi mượn **khuôn** của `an4.202`, là bài anh em có **đúng** cấu trúc Pāli `attanā ca X hoti, parañca X samādapeti` giống hệt `3.3`–`3.9`/`5.3`–`5.9` và đã `published` với 12 khoá cùng hình dạng: “They themselves are X, and they encourage others to be X too”. Tôi giữ `attanā` thành **“themselves”** và `parañca` thành **“others”**, vì đó là ý cả vế của câu. Đo trong đúng khuôn `attanā … parañca … samādapeti` của họ `an4` 200: `an4.206` và `an4.208` đã xuất bản giữ “themselves” (“They themselves have wrong freedom, and they encourage others in wrong freedom.”), `an4.204` bỏ nó, `an4.202` giữ nó — đa số giữ. Dấu `;` nối các vế và dấu `.` ở vế cuối cũng theo đúng `an4.202`.
  Vì **tám** danh từ đều đứng sau “have”, lớp lấp dùng **“have wrong purpose”** v.v. chứ không phải “are wrong in purpose”: Pāli `micchāsaṅkappo`/`sammāvāco`/`micchākammanto` là **tính từ** có mệnh đề danh từ (`-o`), và `diṭṭhiko`/`ājīvo`/`vāyāmo` cũng vậy; đây cũng chính là cách tầng đã ghim dịch `micchādiṭṭhiko` ở `2.2`/`3.2` (“has wrong view”), nên tôi theo tầng đã ghim thay vì dựng vế khác. Chữ “too” ở vế sau lấy từ `an4.202`; Pāli không có dạng phủ định nào ở mười bốn khoá này nên “too” chỉ là cách Sujato đã dùng cho cặp tự–khác, không thêm nghĩa phủ định nào.

