notes: |-
  an6.25 là `Anussatisaṅkhāpana` — sáu chỗ quán nhớ (quán nhớ Đức Như Lai, Pháp, Tăng chúng, giới của
  mình, sự hào phóng của mình, các chư thần). Mỗi chỗ có một `Yasmiṁ … rāgapariyuṭṭhitaṁ cittaṁ hoti …`
  rồi bốn khoá kết bằng **cùng một cụm bốn khoá**. Sujato dịch vòng 1 (`1.6`–`1.8`) và vòng chung
  (`7.2`–`7.4`), bỏ trống vòng 2, 3, 4 và vế cuối của mục quán nhớ chư thần.

  **Chín khoá trong mười là chép nguyên văn — đo bằng script, không đoán.** Ba cụm sau **trùng byte**
  với bản Anh đã ghim, mỗi cụm có tới bốn bản sao trong chính bài:
  - `2.4` `3.4` `4.3` ≡ `1.6` ≡ `7.2` → `At that time their mind is quite unswerving. They’ve left behind
    greed; they’re free of it and have risen above it.`
  - `2.5` `3.5` `4.4` ≡ `1.7` ≡ `7.3` → `‘Greed’ is a term for the five kinds of sensual stimulation.`
  - `2.6` `3.6` `4.5` ≡ `1.8` ≡ `7.4` → `Relying on this, some sentient beings are purified in this way.`
  Tôi chép y nguyên, **kể cả dấu nháy cong `‘’`** — đã kiểm byte: bản ghim ở `1.7` cũng dùng `‘’`, nên
  không phải chuyện tôi phải sửa dấu nháy cho khớp. Chín khoá này tự nó đã cho bản Việt canonical và bản Anh
  đã ghim ba lần mỗi cụm; tôi tự viết lần thứ tư sẽ chỉ sinh ra cách dịch thứ N+1.

  **Một khoá thật sự phải tự dịch: `6.7`.** Nó là phần cuối của danh sách
  `saddhā → sīlā → sutā → cāgā → paññā` mà ba đoạn `6.4` `6.5` `6.6` (`Yathārūpena sīlena …`,
  `sutena …`, `cāgena …`) lược đi mà Sujato cũng bỏ trống. Tôi dịch từ Pāli, bám câu đã ghim ở `6.3`
  (`When those deities passed away from here, they were reborn there because of their faith … I, too,
  have the same kind of faith …`): giữ mạch `samannāgatā` = `endowed with`, `saṁvijjati` = `have`, và
  đóng bằng đúng một dấu `’` như `6.3` của bản ghim (Pāli kết `saṁvijjatī’ti.` ⇒ một ngoặc đóng, không có
  ngoặc mở — đã kiểm bằng bộ đo của lớp lấp).

  **Dấu lược — chỗ dễ làm hỏng nhất của bài này, nói rõ:** `6.7` **không** mang dấu lược nào trong Pāli, nên
  bản Anh của tôi cũng không có. Hệ quả thấy được trong reader: `6.4`–`6.6` trống (chưa ai lấp), `6.7` đứng
  một mình với câu `Endowed with wisdom, those deities, …`. Tôi **không** mở đầu bằng `…` để "nối" — bởi
  thêm `…` vào tầng Anh là thêm chữ không nguồn nào cấp phép, đúng lý do BRIEF_VI3 §10 nêu.

  **Khoá trống còn lại:** `an6.25:6.4` (20 ký tự), `6.5` (8), `6.6` (8) — đều **dưới** ngưỡng 40 nên không
  tính coverage; `5.5` `Evam’idhekacce sattā visujjhanti.` (33) và `8.2` `Pañcamaṁ.` (9) cũng vậy.
  Lấp được, nhưng ngoài lát `e12`. Ba khoá `6.4`–`6.6` đáng cắt lát riêng vì chúng là lược **trong chính
  mục chư thần**, đứng ngay cạnh khoá `6.7` tôi vừa lấp; nếu không lấp thì bản Anh của mục 6 đọc lênh
  động. Tôi báo, không tự làm — lát này đã đủ việc.

  ⚠ **`content/meta/sutta/an/an6.25.yaml` ghi `assessed_by: OpenCode Space Bunny Free (agent)` —
  CÙNG họ công cụ với lớp lấp, và còn trùng đúng chuỗi.** Đó là lý do `triangulation` của tôi hạ xuống
  **7.5** thay vì 8.0: bản lấp không phải là lớp đọc Anh độc lập cho bài này. Tôi **không sửa** tệp Việt ấy.
