notes: |-
  **Phân loại 30 khoá. Script (so Pāli đã chuẩn hoá dấu câu): A = 19 · B = 2 · C = 6 · D = 3. Đọc lại bằng tay: A = 18 ·
  B = 7 · C = 1 · D = 4.** Khác biệt đến từ chỗ Sujato ở bài này **gộp** nội dung nhiều khoá Pāli vào một khoá (`2.7`–`2.11`, `5.2`,
  `13.2`) hoặc để dấu lược (`7.2`, `9.2`, `11.2`), nên các khoá `5.3`, `7.3`, `9.3`, `11.3`, `13.3` mà script gọi là C thực chất đã có chữ ở
  khoá liền trước. Lấp đủ 30/30 khoá tầng Anh đã ghim để trống (không còn khoá trống nào của bài): 25 khoá đủ ngưỡng 40 ký
  tự (sau khi bỏ khoảng trắng cuối) và 5 khoá dưới ngưỡng (`7.6`, `9.6`, `10.1`, `12.1`, `16.3`).

  **Nhóm A — 18 khoá, dùng lại nguyên văn lời đã ghim của cùng bài.**
  · Phần học xong–tìm học phí–đúng pháp, lặp ở bốn hạng bà-la-môn: `7.5`, `9.5`, `11.5` = `5.5` · `7.6`, `9.6`, `10.1`, `12.1` = `6.1` ·
  `7.7`, `9.7`, `12.2` = `6.2` · `9.8` = `7.8`.
  · Phần bà-la-môn “giữ giới hạn” (`10.3`–`10.9`) = `8.3`–`8.9` (Pāli trùng từng chữ): chỉ có nữ bà-la-môn, không gần người mang
  thai, cho con bú, v.v.

  **Nhóm B — 7 khoá, dựng lại từ lời đã ghim.**
  · `5.3`, `7.3`, `9.3`, `11.3`, `13.3` (cùng một câu Pāli, nên lời lấp **giống hệt nhau**) ← `5.2`/`13.2`: Pāli `mātito ca pitito ca,
  saṁsuddhagahaṇiko, yāva sattamā …` là vế sau của `ubhato sujāto hoti—`. Tầng đã ghim dịch **gộp** vế ấy vào `5.2`/`13.2`
  (“… well born on both his mother’s and father’s side, stemming from a clean vessel, with irrefutable and impeccable genealogy
  back to the seventh paternal generation.”) và để `7.2`, `9.2`, `11.2` kết bằng dấu lược. Lớp lấp lấy nguyên cụm từ ấy của
  `5.2`. **Người đọc sẽ thấy lặp** ở `5.2`+`5.3` và `13.2`+`13.3`: đó là hệ quả của tầng đã ghim.
  · `2.9` ← `2.11` (khớp 0,92): vế mô tả giả định (“‘a brahmin well born on both sides … anavayo’”) mà Pāli dùng ngôi thứ ba rồi kết
  `mameva taṁ … sammā vadamāno vadeyya`; lớp lấp lấy lời `2.11` (ngôi thứ nhất của Doṇa) đổi sang ngôi thứ ba (“He recites and
  remembers the hymns …”), đóng nháy đơn ’ khớp Pāli, và thêm vế cuối “It’s of me, Worthy Gotama, that this should rightly be said.”
  (`2.8` đã ghim chỉ có “a brahmin, it’s me.”). `2.10` (Pāli `Ahañhi, bho gotama, brāhmaṇo ubhato sujāto—`) ← cùng nguồn: “For I,
  Worthy Gotama, am a brahmin well born on both sides—”; **tầng đã ghim ở `2.11` đã mở đầu bằng “For I am well born on both my mother’s and
  father’s side”, nghĩa là vế “For I am well born” vốn của `2.10` nằm ở `2.11`** nên hai khoá đọc gần như lặp.

  **Nhóm C — 1 khoá.** `16.3` `Dutiyaṁ.` → “Second.” **Nhãn thứ tự — cảnh báo theo luật của lát:** `Dutiyaṁ` là đánh số bài trong chuỗi
  (`an5.191` `Paṭhamaṁ`, `an5.192` `Dutiyaṁ`, `an5.193` `Tatiyaṁ`), không phải số mục trong bài; bài liệt kê **năm** hạng
  bà-la-môn nên nhãn không đối ứng với số mục. Giữ khoá, không bỏ.

  **Nhóm D — 4 khoá, báo, và xử lý khác nhau.**
  · `7.4`, `9.4`, `11.4` (Pāli `So aṭṭhacattālīsavassāni komārabrahmacariyaṁ carati mante adhīyamāno.`) trùng `5.4` và `13.4`, mà tầng đã
  ghim dịch hai khoá ấy **khác nhau**: `5.4` “For forty-eight years he leads the boy’s spiritual life studying the hymns.” và `13.4`
  “… the virginal spiritual life …”. Lớp lấp theo `5.4` (khoá đã ghim gần nhất đứng trước ba khoá này, và trước `13.4`), nên cả bốn
  khoá `5.4`, `7.4`, `9.4`, `11.4` cùng một câu, còn `13.4` do tầng đã ghim khác đi. Không tự hòa: đây là chỗ báo.
  · `10.10` (Pāli `Tassa sā hoti brāhmaṇī neva kāmatthā … pajatthāva brāhmaṇassa brāhmaṇī hoti.`) trùng `8.10`, nhưng lời đã ghim ở `8.10`
  bắt đầu bằng một câu hỏi **không có ở Pāli**: “And why does the brahmin not have sex outside the fertile phase of the menstrual cycle? Because
  his brahmin wife is not there …”. Lớp lấp dịch **đúng Pāli**: “His brahmin wife is not there for sensual pleasure, fun, and enjoyment, but
  only for procreation.”, theo khuôn của `12.5`/`14.3` đã ghim (“His brahmin wife is there for … as well as for procreation.”). Không sao chép câu
  hỏi thêm của Sujato; hai khoá `8.10` và `10.10` do đó không giống nhau từng chữ.

  **Một chỗ nghi lỗi Pāli (báo, không sửa):** ở `11.5`, `12.1`, `12.2` Pāli lặp công thức “chỉ bằng cách đúng pháp” của hạng giữ giới hạn
  (`dhammeneva, no adhammena`; `Tattha ca, doṇa, ko dhammo?`), rồi đến `12.3` mới chuyển sang “cả đúng pháp lẫn phi pháp”, trong khi hạng
  “phá vỡ giới hạn” lẽ ra dùng `dhammenapi adhammenapi` ngay từ `11.5` như `13.5`. Lớp lấp dịch theo Pāli đã ghim (dùng lại `5.5`, `6.1`, `6.2`), không
  đoán điều Pāli không viết.

  **Nháy.** 30/30 khoá khớp Pāli (đo đủ bốn loại: nháy kép mở/đóng, nháy đơn mở/đóng). Không có chỗ lệch có chủ đích về nháy.

  **Dấu lược.** Không khoá nào trong 30 khoá chứa `…` ở Pāli; tổng dấu lược của lớp lấp bằng 0 và không chép dấu lược của tầng đã ghim ở `7.2`, `9.2`, `11.2`.

  **Cố ý lệch tầng đã ghim:** (1) `10.10` không chép câu hỏi thêm của `8.10`; (2) `7.4`, `9.4`, `11.4` theo `5.4` chứ không theo `13.4`;
  (3) `2.9`, `2.10` đọc ngôi thứ ba/ngôi thứ nhất theo Pāli thay vì gộp như `2.8`/`2.11`.

  **Coverage (mẫu số = khoá Pāli ≥ 40 ký tự, bỏ `:0`; không phải mọi khoá):** trước 68/93 = **0,7312** (dưới ngưỡng); sau 93/93 =
  **1,0000** (sau khi `published`). Độ nhạy: ngưỡng 0,8 cần ≥ 75/93; lớp lấp thêm 25 khoá nên dư 18 khoá. Bài này **có** record trong
  `content/meta/reference-gaps.yaml` (`coverage` 0,7312); sau khi `published` record đó trở thành thừa — không chạm tệp ấy, để người điều
  phối sinh lại bằng `npm run reference:gaps`.

  **Triangulation 7.5 — bản lấp không phải cách đọc English độc lập.** Scorecard Việt của `an5.192` (`content/meta/sutta/an/an5.192.yaml`) ghi **cả**
  `translators` **lẫn** `quality.assessed_by` trùng họ công cụ với lớp lấp này (đối chiếu theo `source/tooling.yaml`); bài này **không** được
  tuyên bố là đã đối chiếu English độc lập. Bản Việt canonical được dùng để đối chiếu nghĩa ở 30 khoá, không dịch vòng qua nó.

  technical_integrity 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không
  tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối.
