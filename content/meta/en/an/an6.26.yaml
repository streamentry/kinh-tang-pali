  **Bốn nhóm khoá (đo bằng script trên 21 khoá lấp): A = 16 · B = 0 · C = 5 · D = 0.**

  **A nguyên văn (16).** Bốn khoá điệp khúc của mỗi tùy niệm (Pháp `3.4`–`3.7`, Tăng `4.4`–`4.7`, giới `5.3`–`5.6`, thí
  `6.5`–`6.8`) trùng byte với `2.5`–`2.8` **và** `7.9`–`7.12` đã ghim, lời ghim hai nơi giống nhau ⇒ dùng nguyên văn
  “At that time their mind is quite unswerving. …” / “‘Greed’ is a term …” / “That noble disciple meditates with a heart
  just like space …” / “Relying on this, some sentient beings become pure in this way.” Tầng ghim kết `3.3`, `4.3`,
  `5.2`, `6.4` bằng ` …` dù Pāli không có dấu lược, rồi để trống bốn khoá kế; lớp lấp lấp đủ.

  **C (5).**
  - `7.4`–`7.7`: **tầng ghim đã gộp** cả năm phẩm chất (tín, giới, văn, thí, tuệ) vào `7.3` (“because of their faith,
    ethics, learning, generosity, and wisdom. I, too, have the same kind of faith, ethics, …”), trong khi Pāli `7.3` chỉ
    nói tín. Lớp lấp dịch đúng phần của từng khoá: `7.4` “Because of their ethics …”, `7.5` “learning …”, `7.6`
    “generosity …” (Pāli mỗi khoá một `…` thật, không phải `…pe…`), `7.7` dựng từ câu `7.3` đổi `faith` → `wisdom`
    (tỉ lệ khớp Pāli 0,72): “When those deities passed away from here, they were reborn there because of their wisdom. I,
    too, have the same kind of wisdom.’” Hệ quả: nội dung tuệ hiện hai lần trong cột English.
  - `8.3` `Chaṭṭhaṁ.` → “Sixth.” (bài thứ sáu của `3. Anuttariyavagga`, `an6.21`…`an6.30`).

  **Nháy / dấu lược:** `7.7` đóng `’` khớp `’ti` của Pāli; mọi khoá 0 lệch nháy. Dấu lược 3/3 (`7.4`–`7.6`).

