notes: |-
  Luật 3: Pāli của `5.7` và `5.8` trùng nguyên văn với `5.4` và `5.5` (và với `7.2`, `7.3`),
  bản Anh đã ghim đã dịch cả bốn, nên hai khoá này chép y nguyên.

  Bất định đã phân xử: Pāli giống nhau nhưng bản Anh đã ghim ở `7.2`/`7.3` dùng "when they have right
  view …" / "when they've ended defilements …", còn ở `5.4`/`5.5` dùng "They have right view …". Tôi theo
  `5.4`/`5.5` vì `5.7`/`5.8` đứng đúng chỗ liệt kê sau `5.6` ("When a mendicant has these three kinds
  of seclusion,") — cùng vị trí ngữ pháp với `5.4`/`5.5` sau `5.3` — trong khi `7.2`/`7.3` nối tiếp
  mệnh đề "In the same way, when a mendicant is ethical, …". Nếu theo `7.2` thì câu ở `5.7` sẽ đứt
  đoạn.

  `6.8`: `bhusika` là vỏ trấu vụn phải nhặt ra sau khi đã đập, khác `thusa` ở `6.12` mà bản Anh đã ghim
  dịch "the husks" — nên tôi dịch "the chaff" để hai thứ không bị làm một. Lớp Việt `an3.93:6.8` (dự án)
  ghi "sai nhặt trấu vụn", khớp. `palālāni` ở `6.7` là "the straw" theo bản đã ghim. Cụm
  "Sīghaṁ sīghaṁ … uddharāpeyya" dịch "… swiftly," như mọi khoá còn lại của đoạn 6, và dấu phẩy cuối
  khớp với `6.7` và `6.9`.

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
