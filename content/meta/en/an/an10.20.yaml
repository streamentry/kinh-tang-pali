notes: |-
  `13.2` và `13.3` là hai vế song song của `13.1` (`atītamaddhānaṁ`, quá khứ).
  Sujato đã gộp CẢ BA thời vào 13.1 ("whether in the past, future, or present"), nên
  hai khoá này không còn chỗ nào để bám vào và phải tự đứng. Bộ từ lấy lại từ chính
  13.1 và 13.4: "abodes of the noble ones" (`ariyāvāse`) và "these same ten abodes of
  the noble ones" (`imeva dasa ariyāvāse`), để cột Anh của bài không đổi giọng giữa
  13.1 và 13.4.

  Hệ quả trung thực phải nói ra: người đọc sẽ thấy 13.1 đã nói trọn ba thời rồi lại
  đọc lại từng thời ở 13.2–13.3. Đó là hệ quả của việc bản đã ghim gộp, không phải lỗi
  dịch — bỏ thì hai khoá thành orphan, gộp thêm vào 13.1 thì vượt quá phạm vi một
  segment. `ambiguity_integrity` hạ vì lựa chọn này là biên tập, không cơ học.

  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
