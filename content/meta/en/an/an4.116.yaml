notes: >-
  Sujato translates an4.116:1.3 as a single sentence carrying all three items — "by way of
  body, speech, and mind" — which leaves 1.5 and 1.7 blank because he has already said them.
  The project's canonical Vietnamese deliberately keeps body, speech and mind in three
  separate segments, so the fill has to as well: a translator checking `hành động khẩu ác`
  at 1.5 needs to see that this segment, and only this one, is about speech. The wording
  therefore mirrors Sujato's own construction at 1.3 segment for segment ("by way of
  body, speech, and mind" → "by way of speech" / "by way of mind"). The repeated `tattha
  ca mā pamādattha` follows Sujato at 1.10, who uses the singular "this" for a single
  referent, rather than his plural "these things" at 1.4, where he had just listed three.
  `Chaṭṭhaṁ` is "Sixth.": Sujato systematically drops bare Pāli enumerators, so there is
  no in-edition precedent and the project's Vietnamese "Thứ sáu." is the cross-check.
  Triangulation is capped at 8.0 because no independent English edition covers this
  passage at the pinned commit.
