notes: |-
  an4.103 là `Kumbhasutta` — bốn loại người ví như bình (`tuccho/pihito` = có nắp đậy / không nắp đậy,
  `pūro/vivaṭo` = rỗng / đầy). Bốn vòng: vòng một Sujato dịch (`2.4`, `2.5`), vòng hai đến bốn bỏ trống.

  **Bốn khoá chép nguyên văn, không dịch lại:** `2.6`, `3.6`, `4.6`, `5.6` đều là Pāli
  `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi.` — trùng byte với nhau và với mười khoá đã `published`
  trong kho ở `an5.75` và `an5.249`, tất cả đều dịch `I say that this individual is like that.`

  **Sáu khoá còn lại chép khuôn đã ghim rồi đổi đúng cặp tính từ:**
  - `3.4` ← `2.4`; `4.4` ← `4.1`; `5.4` ← `5.1` (khuôn `That’s how an individual is ….`)
  - `3.5`, `4.5`, `5.5` ← khuôn `2.5` = `That individual is like a pot that’s …, I say.`
    Sujato bỏ trống cả ba `Seyyathāpi so` này nên không có mẫu thứ hai để chọn; tôi dùng khuôn của vòng một.

  **Hai điểm cần nói rõ, không giấu:**
  1. Cột `So ‘idaṁ dukkhan’ti …` (`2.3`, `3.3`, `4.3`, `5.3`) là nơi bản ghim **đã mở rộng `…pe…`**: từ Pāli
     chỉ còn `‘idaṁ dukkhan’ti …pe… ‘ayaṁ dukkhanirodhagāminī paṭipadā’ti`, bản ghim viết ra bốn mệnh đề
     (`This is suffering` … `origin` … `cessation` … `practice`). Tôi **không** chép và **không** mở rộng thêm:
     các khoá lấp của tôi không chứa `…` nên không được thêm `…`, và cũng không được bịa phần đã bị bản ghim
     nuốt mất. Hệ quả: bản lấp và bản ghim không cùng độ rộng ở cùng một câu — nhưng đó là thuộc về bản ghim.
     Bản Việt canonical cũng chỉ giữ hai vế, nên ba tầng lệch nhau ở chỗ này; ghi ra đây để không ai tưởng là do lớp lấp.
  2. Câu `…, I say.` ở các khoá `Seyyathāpi` rồi lại tới `I say that this individual is like that.` ở khoá
     kế bên — đọc liền thấy `I say` hai lần. `, I say.` nằm sẵn trong bản ghim ở `2.5`; tôi không được sửa bản ghim.

  **Dấu lược:** không khoá Pāli nào của an4.103 trong tập lấp mang `…pe…` hay `…` trần.

  **Khoá trống còn lại:** `an4.103:5.8` = `Tatiyaṁ.` → `Third.` (8 ký tự Pāli, dưới ngưỡng 40). Lấp được,
  nhưng ngoài lát `e11`.

  Điểm: `triangulation` = 8.0 vì `content/meta/sutta/an/an4.103.yaml` ghi `assessed_by: GLM-5.3 Flash (ZCode)`
  (khác họ công cụ `OpenCode Space Bunny Free` nên chưa phải 7.5). Bốn trong mười khoá là bản dịch đã xuất bản
  của chính dự án; sáu khoá kia là chép khuôn có sẵn trong cùng bài. Không khoá lấp nào ở đây là bản dịch mới
  từ Pāli — điều đó nên nói thẳng thay vì cho điểm `triangulation` cao.

