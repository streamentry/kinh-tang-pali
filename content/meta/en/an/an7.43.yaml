  **Bốn khoá lượt review đối kháng này phải sửa — nói thẳng là có, không phải không.**
  · `4.1` **“This morning, sir, I robed up …” → “Sir, in the morning I robed up …”**. Hai lỗi: dùng
    “This morning” trong khi toàn tầng không có khoá nào dùng cụm ấy (0 khoá, đối chiếu 146 khoá “in the
    morning”), và đảo thứ tự Pāli — `Idhāhaṁ, bhante,` đứng **đầu** câu. Quan trọng hơn cả hai: `1.3` của
    chính bài này đã ghim câu **cùng đó** là “Then Venerable Ānanda robed up **in the morning** and,
    taking his bowl and robe, entered Kosambī for alms.” — để nguyên “This morning” là bài tự mâu thuẫn
    với ba dòng trên. Tiền lệ cùng cấu trúc `Idhāhaṁ, bhante,` mở lời tường thuật ngôi thứ nhất:
    `an7.53:6.1` → “Sir, last night I rose …”, đặt “Sir,” lên đầu.
  · `4.2` **bỏ mất `bhante`** (“Then it occurred to me,” → “Then it occurred to me, sir:”). Cùng một lượt
    kể đã dịch `bhante` thành “sir” ở `5.1` và `5.3`; bỏ ở `4.2` là thiếu. Dấu chấm cũng đổi `,` → `:`
    cho khớp Pāli (`etadahosi:`) và khớp với khuôn chọn ở bài kế (`Assosi kho, bhante,` → “…, sir: ”),
    đồng thời để hai khoá dẫn lời trích `4.2`/`5.4` dùng cùng một dấu.
  · `8.3` **bỏ mất “of speech”**: Pāli `Dve paṭisambhidā dve vasā`. `vasā` ở đây **không** phải “mastery of
    speech”. Hai bài mà udāna này đếm — `an7.40` (`Paṭhamavasasutta`) và `an7.41` (`Dutiyavasasutta`) —
    tầng đã ghim dịch tiêu đề là “Mastery of the **Mind** (1st)/(2nd)”, và Pāli `cittaṁ vase vatteti`
    được dịch “masters their mind”. Lớp lấp sửa thành “two masteries,”.
  · `8.4` **“are the two qualifications for graduation.” → “two qualifications for graduation.”** Đây là
    lỗi nghĩa nặng nhất của lát. Vế cuối của udāna **không** phải mệnh đề nói về các vế trước; nó là
    **mục đếm** như `8.2` và `8.3`. Phẩm Chư Thiên của Tăng Bộ Trung Bộ là `an7.34`–`an7.43`, đúng **10** bài
    đi thành **5** đôi, và tiêu đề tầng đã ghim xác nhận từng đôi: `an7.34`/`an7.35` “Easy to Admonish
    (1st)/(2nd)”, `an7.36`/`an7.37` “A Friend (1st)/(2nd)”, `an7.38`/`an7.39` “Textual Analysis
    (1st)/(2nd)”, `an7.40`/`an7.41` “Mastery of the Mind (1st)/(2nd)”, `an7.42`/`an7.43` lần lượt
    `Paṭhamaniddasasutta`/`Dutiyaniddasasutta` (“Graduation (1st)/(2nd)”). Vậy `duve niddasavatthu` là
    “hai bài về tiêu chí tốt nghiệp”, đứng cùng loạt với `dve suvacā duve mittā` và `Dve paṭisambhidā
    dve vasā`. Lời cũ thêm động từ “are” (Pāli không có), biến bốn món của `8.3` thành chủ ngữ, rồi gọi
    chúng là “the two” — tức bốn thành hai và gán một vị thứ không có ở Pāli.

  **Hai chỗ còn lại trong udāna đã đối chiếu và giữ nguyên, có phép đo.**
  · `8.1` `Appamādo hirī ceva` → “Diligence and conscience,”. `appamāda` → “diligence” là vựn từ đo
    được của tầng đã ghim (`an1.83:1.2` “Diligence is very beneficial”, `dhp31:1` “A mendicant who loves
    diligence”, `dn34:1.2.3` “Diligence in skillful qualities”); `hirī` → “conscience” cũng vậy, kể cả
    trong đúng danh sách tiêu chí ở `an6.83:2.3` và `an7.15:3.2`. Ở `7.2` tầng đã ghim dịch `hirīmā` là
    “conscientious” — khác vì đó là tính từ đi kèm `hoti`, còn `8.1` là danh từ.
  · `8.2` `dve suvacā duve mittā` → “two easy to admonish, two friends;”, theo đúng hai tiêu đề
    “Easy to Admonish (1st)” và “A Friend (1st)”.
  · `8.3` `dve paṭisambhidā` → “two kinds of textual analysis”, theo `an7.38:1.1` của tầng đã ghim, dịch
    `catasso paṭisambhidā` là “the four kinds of textual analysis”.

  **Bất định chưa phân xử được, ghi thẳng chứ không đoán: `-nāti` ở `8.4`.** Đó là iti-versal (asatthi-bhāṣā)
  `na iti`. Toàn bộ Tăng Bộ có **165** khoá `Tassuddānaṁ` và **0/165** khoá nào có lời ở tầng đã ghim, nên
  **không có tiền lệ Anh nào** cho vế cuối của udāna. Cùng cấu trúc `duveti` ở `an6.116:2.4` và
  `tajjhānā apare duveti` ở `an6.74:3.4` cho thấy các vế cuối ấy chỉ là cách đóng vè. Lớp lấp **bỏ** hậu tố
  này (như tầng đã ghim bỏ `ti` ở mọi nơi) và chỉ dịnh phần nội dung `duve niddasavatthu`. Nếu sau này
  người biên tập chọn dịch `nāti` thành “and so on”, đó là quyết định dịch, **không** phải sửa nghĩa — mệnh đề
  đếm vẫn là hai. Vế `duve` cũng ghi nhận: hình thức là số nữ, số nhiều, trong khi `niddasavatthū` là danh từ
  đực, nên đây là biến thể chính tả của ngành; `8.2` và `8.3` cũng dùng số trần như vậy (`dve suvacā`,
  `duve mittā`, `Dve paṭisambhidā dve vasā`), nên lớp lấp dịch “hai” theo đúng số đó.

