  · `5.4`: tầng đã ghim ở `3.2` **nuốt mất cả hai phủ định** của Pāli `Anabhinanditvā appaṭikkositvā`
    (chỉ còn “He rose from his seat, thinking,”). Lớp lấp trả lại đủ: “Neither approving nor rejecting it,”
