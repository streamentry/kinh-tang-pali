notes: >-
  Tên mười một hình phạt không có bản dịch Việt hay chú giải nào đáng tin: chúng là
  tên riêng của kỹ thuật tra tấn trong ý chí, và bản đã ghim đã đặt tên chúng ở 4.3
  (bilaṅgathālikā = "porridge pot" … palālapīṭhakā = "straw mat"). Bản này dùng lại
  đúng những tên ấy — không phải vì chúng dễ hiểu, mà vì tự đặt tên mới sẽ khiến
  cột Anh của chính bài này tự mâu thuẫn. Nhưng đây là những tên trong tiếng
  Anh của Sujato, giữ nguyên trong một tầng CC0 cần được nói rõ. `rāhumukha` là
  tên đặt theo miệng Rāhu (hành tinh nuốt mặt trời trong thần thoại Ấn), và cách
  dịch "a Rāhu's mouth" giữ đúng hình ảnh mà tên Pāli gợi.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
