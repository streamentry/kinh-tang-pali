notes: |-
  **Phân loại 9 khoá (đo bằng máy, mỗi khoá một nhóm): A y nguyên = 0 · B dựng lại = 0 · C tự dịch = 9 · D (Pāli trùng, lời Anh của tầng đã ghim khác nhau) = 0.** Đã ghi 9/9 khoá `fillableSegments` của bài (8 khoá có nội dung ≥ 40 ký tự Pāli, 1 khoá ngắn hơn ngưỡng). Số khoá Sujato để trống mà lát **không** lấp: 0.

  **Cả tám khoá substantive là cùng một câu Pāli.** `10.5`, `11.6`, `12.5`, `13.4`, `14.4`, `15.4`, `16.4`, `17.7`
  đều là `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi.` (giống nhau từng chữ, đã kiểm bằng máy), nên cả tám
  lấp **giống nhau từng chữ**: “I say this individual is comparable to that, mendicants.” Vì sao tầng đã ghim để
  trống: ở mỗi khoá liền trước (`10.4`, `11.5`, `12.4`, `13.3`, `14.3`, `15.3`, `16.3`, `17.6`) Sujato đã viết luôn câu
  “I say that this individual is comparable to the wild colts who …” — tức gộp vế `tathūpamāhaṁ … vadāmi` vào khoá
  trước và bỏ khoá này. Bản lấp dịch đúng phần Pāli của chính khoá: `tathūpamā` “comparable (to that)”, `vadāmi`
  “I say”, `imaṁ puggalaṁ` “this individual”, `bhikkhave` “mendicants”; “individual” theo chữ của Sujato ở khoá kế
  trước. Hệ quả của việc tầng đã ghim gộp khoá: người đọc thấy cùng ý hai lần (một lần trong khoá trước, một lần
  ở đây); đây là hệ quả của tầng đã ghim, hiện ra thay vì giấu (cùng cách xử lý như `mn100:23.7`).
  Khoá `17.11` là nhãn thứ tự `Catutthaṁ.` → “Fourth.” theo khuôn 41 khoá đã có; bài chỉ có một nhãn
  (không kiểm đếm thứ tự của nhóm bài trong chương).


