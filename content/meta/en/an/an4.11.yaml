notes: |-
  an4.11 đi **tám tư thế**: đi (`carato`), đứng (`ṭhito`), ngồi (`nisinno`), nằm (`sayāna`) — lặp lại hai vòng, một vòng `1-4` kết bằng `adhivāseti` (chịu đựng) và một vòng `5-8` kết bằng `nādhivāseti` (không chịu đựng, mà từ bỏ). Sujato dịch vòng một ở `1.2`, `1.3`, `4.2`, `4.3` và vòng hai ở `5.2`, `5.3`, `8.2`, `8.3`, rồi **bỏ trống** đúng sáu khoá còn lại: `2.2`, `2.3`, `3.2`, `3.3` (vòng một) và `6.2`, `6.3`, `7.2`, `7.3` (vòng hai).

  Bốn khoá **chép y nguyên** vì Pāli trùng byte:
  - `2.2` ≡ `1.2` ≡ `4.2` → "They tolerate it and don't give it up, dispel it, eliminate it, and obliterate it."
  - `3.2` ≡ `1.2` → như trên.
  - `6.2` ≡ `5.2` ≡ `8.2` → "They don't tolerate it, but give it up, dispel it, eliminate it, and obliterate it."
  - `7.2` ≡ `5.2` → như trên.

  Bốn khoá **chép câu rồi đổi đúng một từ**, vì Pāli khác khoá mẫu chỉ ở chữ từ tư thế:
  - `2.3`: Pāli `ṭhitopi, bhikkhave, bhikkhu evaṁbhūto …` so với `1.3` `carampi, bhikkhave, bhikkhu evaṁbhūto …` → lấy câu đã ghim ở `1.3` và đổi "when walking" thành **"when standing"**.
  - `3.3`: `nisinnopi` → **"when sitting"**.
  - `6.3`: `ṭhitopi` trên khuôn `5.3` → **"when standing"**.
  - `7.3`: `nisinnopi` trên khuôn `5.3` → **"when sitting"**.

  Vì sao đổi từ chứ không viết lại: `an4.11` có **tám** câu cùng khuôn, và Sujato đã dịch bốn câu trong số đó. Nếu tôi viết lại từ Pāli, chỉ cần trượt một từ là cột Anh sẽ có "when standing" ở một chỗ và "when standing still" ở chỗ khác cho cùng một `ṭhitopi`. Bản Việt canonical cũng giữ đúng bốn từ này: `đang đi` / `đang đứng` / `đang ngồi` / `đang nằm trong khi thức`, và dùng lại y nguyên bốn mẫu đó.

  Hai điểm tôi **không** đồng nhất hoá, có chủ ý:
  - `4.3` (nằm) và `8.3` (nằm) — Sujato viết "when lying down while awake"; không khoá lấp nào nằm trong cặp đó nên tôi không suy ra "when lying down" từ đâu cả.
  - `1.3` và `4.3` dùng **cùng** một vế trích dẫn (‘not keen or prudent, always lazy, and lacking energy') cho đi và nằm, và `5.3`, `8.3` dùng cùng vế ('keen and prudent, always energetic and resolute') cho đi và nằm. Vì vậy `2.3`, `3.3`, `6.3`, `7.3` mang **đúng** vế trích đó, không phải vế mới.

  Ngoặc: `2.3`, `3.3`, `6.3`, `7.3` giữ ngoặc nháy đơn `‘’` quanh vế trích, và ngoặc đóng `’ti.` ở Pāli được Sujato nuốt thành câu — giữ nguyên như bản ghim.

  Dấu lược: **không** khoá Pāli nào của an4.11 mang `…pe…` hay `…` trần (đã quét cả 42 khoá), nên không khoá lấp nào được thêm dấu lược. Tám khoá lấp không có ký tự `…`.

  ⚠ **Lớp lấp này không phải lớp đọc Anh độc lập một cách tuyệt đối** cho an4.11. `content/meta/sutta/an/an4.11.yaml` ghi `quality.assessed_by: "GLM-5.3 Flash (ZCode)"` và một dòng review đối kháng, **khác** công cụ đã viết lớp lấp này, nên `triangulation` để ở **8.0**. Nhưng phải nói rõ: bốn trong tám khoá lấp là **chép nguyên văn** từ chính bản Anh đã ghim, nên chúng **không** phải bằng chứng đối chiếu độc lập — chúng là bằng chứng về tính nhất quán, không phải về tính đúng. Riêng bốn khoá `2.3`, `3.3`, `6.3`, `7.3` là chỗ tôi tự dịch một từ, và chỗ đó mới là bản dịch độc lập thực sự.

  Coverage đo lại bằng phép của kho: Pāli có nội dung 24 khoá, `english-sujato` phủ 16 (0.667), thêm tám khoá lấp thành 24/24 = 1.0, vượt ngưỡng 0.8.

