notes: |-
  an4.110 là `Āsīvisūpamāsutta` — bốn loại người ví như rắn độc, mỗi loại một vòng ba khoá:
  `Evaṁ kho, bhikkhave, puggalo …` → `Seyyathāpi so, bhikkhave, āsīviso …` →
  `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi.` Cặp tính từ là `āgataviso` (nọc tác động nhanh) ×
  `ghoraviso` (nọc chết người); chúng được đo bằng thời gian cơn giận, không phải bằng ý nghĩa của người.

  **Bốn khoá chép nguyên văn, không dịch lại.** `2.6`, `3.6`, `4.6`, `5.6` đều là Pāli trùng byte
  `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi.`; đo bằng script thì Pāli ấy đã có **26 khoá
  `published`** trong kho (`an4.101` 4, `an4.103` 4, `an4.104` 4, `an4.105` 4, `an5.249` 5, `an5.75` 5)
  và cả 26 đều dùng `I say that this individual is like that.` Chép y nguyên cả bốn.

  **Sáu khoá còn lại chép khuôn vòng một của chính bài:**
  - `3.4` ← `3.1` (`venom lethal but not fast-acting?`) đổi dấu hỏi thành mệnh đề, theo khuôn `2.4` đã ghim.
  - `4.4` theo khuôn `ca … ca` (`āgataviso ca hoti ghoraviso ca`) — đúng như `4.1` đã ghim.
  - `5.4` theo khuôn `neva … na` — đúng như `5.1` đã ghim.
  - `3.5`, `4.5`, `5.5` ← `2.5` (`That individual is like a viper whose venom is fast-acting but not lethal.`),
    giữ nguyên cả mạch `whose venom is …` của bản ghim. `2.5` của bài này **không** có `, I say.`
    (khác `an4.109:2.5`), nên tôi cũng không thêm — cùng lý do và cùng hệ quả đã ghi ở an4.108.

  **Sắc thái "nọc" — điểm dễ làm hỏng nhất của bài này, nói rõ để người đọc biết đã cân nhắc:**
  `āgataviso` / `ghoraviso` là tính từ **của nọc**, không phải của người, nên mọi khoá `Evaṁ kho` của tôi đều
  giữ mạch `an individual’s venom` chứ không rút thành `an individual is fast-acting`. Đây cũng là cách
  bản ghim đã làm ở `2.4`, `2.5`, `3.1`, `4.1`, `5.1` — và là cách bản Việt canonical làm
  (`nọc của một cá nhân tác động nhanh nhưng không chết người`). Phủ định ở `5.5` là `nevāgataviso na
  ghoraviso` (không … và không), nên `neither … nor` chứ không phải `not … but`. `3.5` và `5.5` dùng `not`
  đơn giản vì Pāli ở đó là `X, na Y`.

  **Thuật ngữ:** `āsīviso` → `viper`, `āgata`/`ghora` về nọc → `fast-acting` / `lethal`. Cả hai đều là từ
  của bản Anh đã ghim ở chính bài này.

  **Dấu lược:** không khoá Pāli nào của an4.110 trong tập lấp mang `…pe…` hay `…` trần.

  **Khoá trống còn lại — bài này nhiều nhất trong lát, và tôi cố ý KHÔNG lấp:**
  `5.8` `Dasamaṁ.` (8 ký tự), `5.9` `Valāhakavaggo paṭhamo.` (22), `6.0` `Tassuddānaṁ` (11),
  `6.1`–`6.4` bốn câu uddāna (24, 24, 24, 20). Tất cả **dưới** ngưỡng 40 nên không tính coverage, và `5.9`–`6.4`
  là khối `:0`-kiểu liệt kê về mặt ngữ pháp, tức colophon (BRIEF_VI4 §4) — lấp chúng chỉ là điền cho có.
  Các khoá này ngoài lát `e12`; tôi báo để người điều phối quyết có cắt lát riêng cho `uddāna` hay không.

  Điểm: `triangulation` = 8.0 vì `content/meta/sutta/an/an4.110.yaml` ghi `assessed_by: GLM-5.3 Flash
