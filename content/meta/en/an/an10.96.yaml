notes: |-
  Bài là "10 quan điểm sai" của Kokanada hỏi Ānanda. Mười một khoá lấp rơi vào ba chỗ bản Anh
  đã ghim đã lược: các vế Ānanda đáp lại (5.3, 6.3, 7.10), các vế Kokanada tóm lại (9.4, 10.4,
  11.11) và phần khung "được hỏi như vậy" (9.2, 10.2, 10.1).

  Sáu khoá lấy NGUYÊN VĂN bộ từ từ bản ghim, không dịch lại. Phép đo bằng script (đo giao tập
  từ, không đoán):
    5.3  = vế trong 5.1, trùng 100% từ: `‘The cosmos is eternal. This is the only truth,
           anything else is futile’`
    6.3  = vế trong 6.1, trùng 100% từ (thêm "not")
    7.10 = vế trong 7.8, trùng 100% từ
    11.7 = 7.7 nguyên văn byte (đo bằng so chuỗi: `hoti ca na ca hoti tathāgato paraṁ maraṇā …`),
           chỉ khác ở chấm câu, vì Pāli 11.7 không có ngoặc và chỉ có một `…`
    11.8 = tiền tố của 7.8, trùng 100% từ
    11.11 = 11.8 + `’ti vadesi`, trùng 90% từ, thêm "you say."
  Cả sáu khoá đó không có nguồn nào độc lập phủ — chính chỗ bản ghim im lặng — nên chỉ dựa
  vào bản ghim và Pāli.

  Năm khoá DỰNG LẠI, dựng từ Pāli:
    9.2 / 10.2 = `evaṁdiṭṭhi bhavan’ti, iti puṭṭho samāno:` → "that you hold such a view,” being
        asked,". Khuôn lấy từ 12.1 đã ghim: `‘Tena hi bhavaṁ na jānāti na passatī’ti, iti puṭṭho
        samāno:` → "Yet when asked whether you neither know nor see,". Đóng bằng `”` chứ không
        phải `’` là có chủ ý: Pāli hai khoá này chỉ có MỘT ngoặc đóng, và ở 9.1 bản ghim đã mở
        `“` ("When asked about all these points, you say that’s not your view.") rồi không đóng
        lại; 10.1 là khoá của lát này nên mở `“` cho cân. Dùng `’` sẽ để lại một ngoặc kép
        `“` treo ngay sau 9.1 trong cột tiếng Anh.
    9.4 / 10.4 = phần Ānanda đáp, giữ `’ti vadesi` → "…futile,’ you say." Bản ghim ở 8.3 bỏ mất
        `’ti vadesi` ("I do know and see.” chỉ có một vế) — ở đây không bỏ, vì ở 9.4/10.4 còn một
        vế nữa (`saccāya vadesi` = "ngươi nói") mà mất đi thì câu thành mệnh lệnh vô chủ thể.
    10.1 = `‘Kiṁ pana, bho, asassato loko, idameva saccaṁ moghamaññanti—` → "Then is this your
        view: the cosmos is not eternal, this is the only truth, anything else is futile—".
        Khuôn lấy từ 6.1/7.1 đã ghim ("Then is this your view: ‘The cosmos is not eternal…").
        Pāli khoá này dùng `moghamaññanti` (động từ) ở 9.1 và 10.1, còn 5.1/6.1 dùng
        `moghamaññan’ti` (danh từ + `ti`); bản ghim dịch cả hai như nhau ("anything else is
        futile"), giữ nguyên như vậy để bài không tự mâu thuẫn.

  Dấu lược: 11.7 giữ đúng MỘT `…` như Pāli (`maraṇā … `), không thêm dấu thứ hai mà bản ghim
  ở 7.7 có (`…’ … `). Pāli 11.7 có một đơn vị lược, bản ghim 7.7 có hai — đây là chỗ bản ghim
  tự thêm, lớp lấp không sao chép.

  Bất định phải ghi:
  1. 11.7 trùng NGUYÊN VĂN với 7.7, nhưng bản ghim đặt ngoặc kép bao cả vế và thêm một `…`
     nữa, còn Pāli của cả 7.7 và 11.7 đều KHÔNG có ngoặc (`hoti ca na ca hoti tathāgato
     paraṁ maraṇā … `). Luật khớp ngoặc theo từng khoá buộc bản lấp không có ngoặc, nên cột
     tiếng Anh ở 11.7 sẽ khác ở 7.7. Giữ đúng nghĩa, bỏ phần trang trí; ambiguity_integrity
     hạ 9.0 vì người đọc bốn cột sẽ thấy hai khoá cùng Pāli mà hai cách trình bày.
  2. 9.1 đã ghim ("When asked about all these points, you say that’s not your view.") đã ăn
     mất phần lặp lại của chính nó; 9.2 rồi phải đóng ngoặc và nối tiếp. Đọc 9.1 + 9.2 sẽ thấy
     hai vế "not your view" — một vế do bản ghim thêm. Đây là giới hạn của bản ghim, không sửa
     được; chỉ ghi ra.
  3. 10.1/10.2 (`asassato loko`) trùng công thức với 6.1/6.3 (`asassato loko`), nhưng 6.1 đã
     ghim đủ cả câu hỏi lẫn `evaṁdiṭṭhi bhavan”ti?`, còn 10.1/10.2 bị cắt làm hai. Không có
     cách nào vừa khớp ngoặc từng khoá vừa tránh lặp; giữ lặp vì đó là cấu trúc Pāli.

