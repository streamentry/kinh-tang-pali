notes: |-
  Không có tiền lệ cho câu kết luận Evaṁ kho: cả an4.78 lẫn bài song song mn142
    đều để trống toàn bộ câu kết (mn142:10.3/11.3/12.3/13.3 trống đã kiểm). Bộ từ
    dựng từ chính câu hỏi của Sujato ở 2.1/3.1/4.1/5.1 (“how is a religious
    donation purified by …”) + mở đầu “That’s how”. Bốn câu chỉ khác nhau cụm
    giver/recipient/neither/both đúng như Pāli.

    BẤT ĐỊNH: “That’s how … is purified” là khung do dự án đặt, không có câu Sujato
    nào để đối chiếu trực tiếp — terminology 9.3, ambiguity_integrity 9.2.

    Lớp lấp: 4 khoá nằm ở phần bản đã ghim đã lược. Triangulation 8.0: không có
    bản Anh độc lập phủ.
