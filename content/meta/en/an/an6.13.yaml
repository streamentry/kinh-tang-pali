  Nhóm B (khoá ← khoá nguồn, tỉ lệ khớp do script đo): 2.5 ← 1.7 (0.97); 2.6 ← 1.8 (0.92); 3.5 ← 1.7 (0.98); 3.6 ← 1.8 (0.91); 4.5 ← 1.7 (0.97); 4.6 ← 1.8 (0.95); 5.5 ← 1.7 (0.98); 5.6 ← 1.8 (0.71).
  Nháy: 0 khoá có số dấu nháy khác Pāli; các khoá còn lại khớp Pāli từng khoá.
