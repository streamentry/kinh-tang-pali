  Nhóm 1 — 2.5, 3.5, 4.5, 5.5 dựng từ 1.7 (khớp 0.97, 0.98, 0.97, 0.98): Pāli chỉ đổi `mettāya` thành `karuṇāya` / `muditāya` / `upekkhāya` / `animittāya`. Tầng đã ghim rút 1.7 thành vế “developed and properly implemented” (bỏ chuỗi `bahulīkatāya yānīkatāya …`) và lớp lấp giữ đúng cách rút ấy thay vì mở rộng; chỉ đổi tên giải thoát (compassion, rejoicing, equanimity; “the signless release of the heart” theo 5.2 đã ghim).
  Nhóm 2 — 2.6, 3.6, 4.6, 5.6 dựng từ 1.8 (0.92, 0.91, 0.95, 0.71): chỉ đổi cái chiếm tâm. Từ ngữ lấy từ vế đối xứng đã ghim ngay trong bài: “the thought of harming” (2.3), “discontent” (3.3), “desire” (4.3), “consciousness … follows after signs” (5.3). 5.6 chỉ khớp 0.71 vì Pāli đổi động từ (`bhavissati` thay `ṭhassati`); lấy 5.3 làm gốc, và dịch “still follows” như 1.8 dịch `ṭhassati` là “still occupies”.
  Nhóm 3 — 7.2 `Tatiyaṁ.` là nhãn thứ tự: dịch “Third.” theo khuôn của lớp lấp. Bài là bài thứ ba của phẩm (an6.11–13), nên nhãn khớp.
  Nháy: cả 9 khoá đều khớp Pāli (không khoá nào chứa nháy). Dấu lược: không khoá nào chứa `…`; Pāli của chín khoá cũng không có.

