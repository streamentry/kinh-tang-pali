notes: |-
  Tiền lệ: `2.16` (đã ghim) dịch đúng vế của `2.20` thành "of an anointed aristocratic king who
  rules his whole life, dear and beloved to the country, while indulging in the pleasures of sleeping,
  lying down, and drowsing as much as he likes?"; `3.7` (đã ghim) dịch đúng vế của `3.11` thành "or a
  guild head who runs the guild his whole life, dear and beloved to the guild, …". `4.3` (đã ghim) có
  Pāli TRÙNG NGUYÊN VĂN với `4.7` (chỉ khác `’”ti?` và `’ti.`), nên `4.7` chép y nguyên theo luật 3.

  Hai việc phải làm khác bản đã ghim, và đây là chỗ dễ sai: (1) `2.20` và `3.11` là câu khẳng định
  (Pāli kết bằng `’ti.`) nên tôi đổi dấu hỏi của `2.16` và `3.7` thành dấu chấm; (2) `3.11` có HAI `vā`
  (`yāvajīvaṁ pūgagāmaṇikattaṁ vā kārento pūgassa vā piyo manāpo`) trong khi `3.7` chỉ có một, nên phải
  dịch "either … or". Bỏ một `vā` là mất một phương án của Pāli.

  Từ vựng: `3.3` (đã ghim) dịch `raṭṭhiko` là "an appointed official", `3.7` dịch `pūgagāmaṇiko` là "a
  guild head", `4.3` dịch `samaṇo vā brāhmaṇo vā` là "an ascetic or brahmin" — tôi dùng đúng các mẫu
  đó. Vì `pūgagāmaṇikattaṁ kārento` ở `3.11` có `vā` đi kèm nên tôi dịch "either runs the guild" thay
  vì lặp y nguyên "who runs the guild".

  Bất định đã ghi: ở `2.20` và `3.11` kho KHÔNG có tiền lệ Pāli→Việt — tệp Việt của bài này không có
  ở hai khoá đó — nên hai khoá này chỉ dựa vào bản Anh đã ghim của chính bài.

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
