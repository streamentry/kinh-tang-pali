notes: |-
  Tiền lệ: 1.5 đã ghin "She wouldn't go somewhere she'd never been before, or eat grass and
  drink water that she'd never tried before." và 3.5 đã ghin cùng câu với "She'd … and eat
  grass and drink water that she'd never tried before." 1.7 và 3.7 lặp lại đúng hai câu đó
  (một câu trong lời con bò, có `‘…’`), nên dùng lại nguyên văn, kể cả "or" ở 1.7 và "and" ở
  3.7. `If only I could` là cách Sujato dịch `yannūnāhaṁ` (đã dùng ở mn66:11.6 và mn41:43.2).
  Bất định nhỏ: `paccāgaccheyya` là optative, bản dịch dùng "doesn't return safely" / "does
  return safely" cho cân với 1.6/3.6 đã ghin ("she'd never return safely" / "she'd return
  safely"). Ghi lại vì có thể đọc là "sẽ không quay lại an toàn".
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
