notes: |-
  Bài là Sīhasenāpatisutta: bảy câu hỏi của Đức Thế Tôn về một người bốc xấu và một người bốc
  tốt, và Sīha đáp bảy lần. Bản Anh đã ghim đã dịch đủ câu hỏi (X.1) và đáp (X.4) ở mục 2, 8,
  9; ở mục 4-7 nó lược đúng vế lựa chọn và nửa đầu câu đáp.

  BẢY KHOÁ NGUYÊN VĂN THEO NHAU. Phép đo bằng script: `yo vā so puriso assaddho maccharī
  kadariyo paribhāsako, yo vā so puriso saddho dānapati anuppadānarato` trùng byte ở CẢ BẢY
  khoá 2.6, 4.2, 5.2, 6.2, 7.2, 8.2, 9.2 — cùng một Pāli thì phải cùng một bản dịch (luật 2).
  Bộ từ lấy từ 2.4 đã ghim, nơi hai người được Đức Thế Tôn định nghĩa lần đầu: "One is faithless,
  stingy, miserly, and abusive. One is a faithful donor who loves charity."
  `yo vā … yo vā …` là "hoặc … hoặc", nên mở đầu vế bằng "either".

  Bốn khoá DỰNG, mỗi khoá dựng từ đáp của chính nó đã ghim:
    4.3 ← 4.4 "They’d first approach the faithful donor who loves charity."
    5.3 ← 5.4 "They’d receive alms first from the faithful donor who loves charity."
    6.3 ← 6.4 "They’d first teach the Dhamma to the faithful donor who loves charity."
    7.3 ← 7.4 "The faithful donor who loves charity would get a good reputation."
  Vế đầu `Yo so, bhante, puriso assaddho maccharī kadariyo paribhāsako` lấy nguyên văn bộ từ
  bản ghim dùng ở 8.3 và 9.3 ("the person who is faithless, stingy, miserly, and abusive"), và
  `kintaṁ` là tiểu từ hỏi, dịch "How could" theo 8.3.

  BẤT ĐỊNH PHẢI GHI — LỆCH DẤU HỎI Ở 4.3, 5.3, 6.3, 7.3. Ở bốn khoá này Pāli kết bằng dấu
  CHẤM, không có `?` (`…upasaṅkamissanti.`), còn bản lấp có `?`. Lý do: đây là câu hỏi tu từ
  (`kintaṁ`), bản ghim đặt `?` cho đúng công thức ở 3.1 (`kintaṁ … anukampantā
  anukampissanti.` cũng kết bằng chấm, và bản ghim dịch "Why would the perfected ones first
  show sympathy for…?"), 8.3 và 9.3 — cả ba đều thêm `?`. Bỏ `?` sẽ ra câu không dấu câu.
  Đo bằng script trên 2986 khoá fill đã publish: 2962 khớp `?`, 24 lệch (99.2% khớp), và cả
  hai trường hợp lệch trong tầng đều là khoá có Pāli trùng đã được ghim. Ở đây bốn khoá này
  theo đúng tiền lệ ấy. Ghi ra thay vì giấu; ambiguity_integrity hạ 9.2 vì lựa chọn này.

  Điểm nhất quán khác đáng nói: 7.3 dùng "How could … would get a good reputation?" còn 8.3/9.3
  cũng vậy, nhưng bản ghim ở 3.1 lại dùng "Why would …" cho `kintaṁ`. Cả "How could" và "Why
  would" đều dịch được `kintaṁ`; chọn "How could" vì 8.3 và 9.3 — hai khoá đã ghim gần nhất
  và cùng là `kiṁ so`/`kintaṁ` — đều dùng "How could"/"Why would" theo cặp. Đây là lựa chọn biên
  tập, đã ghi.

  Bản Việt hiện hành: KHÔNG có. `content/translation/vi/project/sutta/an/` không có tệp cho
  an7.57 và `content/meta/sutta/an/an7.57.yaml` cũng không tồn tại — đo bằng script, 0 tệp cả
  hai. Tầng `vietnamese-current` tại commit đã ghim chỉ có Pháp Cú. Triangulation 8.0: bảy
  khoá dùng bộ từ đã ghim ở 2.4 và bốn khoá dựng từ chính câu đáp đã ghim của mục; không có bản
  Anh độc lập phủ vì chính các khoá đó là chỗ bản ghim im lặng. Không có scorecard Việt nào để
  rơi vào trường hợp "cùng công cụ" — nên 8.0, không hạ xuống 7.5.

  Technical gate: bị cấm chạy. Còn lại bốn lệnh — `npm run validate`, `npm test`,
  `npm run check`, `npm run build`. technical_integrity 9.6 vì lý do đó, không phải 10.0.
