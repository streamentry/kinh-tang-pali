notes: >-
  English fill for the three segments the pinned Sujato edition leaves blank. Rendered from
  the Pāli root with the project's existing Vietnamese as a meaning cross-check. The
  Pāli's own elisions are preserved rather than expanded, so an4.59:1.5 keeps the
  `…` between the three gifts exactly as the root has them; the surrounding Vietnamese
  expands them, and expanding here would have been an editorial addition. `bhāgī hoti`
  ("becomes a partaker") is rendered "partakes" in both 1.4 and 1.5 so the repeated formula
  stays recognisable. Triangulation is capped at 8.0 because no independent English edition
  exists for these passages at the pinned commit.
