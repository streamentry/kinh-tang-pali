notes: |-
  Hai khoá này TRÙNG NGUYÊN VĂN NHAU, và cùng câu đó đã có tiền lệ gần nhất ngay
  trong chính lớp lấp này: `an10.53:7.4` và `an10.54:5.4` ("To extinguish that clothing
  or that head, they should apply extraordinary enthusiasm, effort, zeal, vigor,
  perseverance, mindfulness, and situational awareness"). Dùng lại y nguyên để ba bài
  cùng một hình ví dụ không đổi cách gọi từng phẩm chất. Bản Sujato đã ghim thì lặp
  "In order to extinguish it…" ở 8.2 và 9.2 vì đã nuốt luôn nội dung 8.3/9.3 vào đó.

  `tasseva` dịch "that" chứ không phải "the same": "the same" đòi hỏi một mốc
  tham chiếu đã nêu, và ở đây bản đã ghim không có mốc nào cho câu độc lập.
  `celassa … sīsassa` = "that clothing … that head" (mạo từ `tassa` đi với cả hai).

  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
