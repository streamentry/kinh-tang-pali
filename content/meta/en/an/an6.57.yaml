notes: |-
  Tiền lệ: 13.3 là vế còn lại của cụm đã ghin ở 11.3 ("And they're ugly, unsightly, deformed,
  sickly…"); Pāli 13.3 chỉ còn `dubbaṇṇo duddasiko okoṭimako` nên bản dịch dừng ở "deformed",
  không kéo theo "sickly" đã thuộc về 11.3. 16.3 trùng NGUYÊN VĂN 14.3, đã ghin trọn, nên
  dùng lại nguyên văn.
  Bất định: `pāsādiko` ở 16.3 được Sujato dịch "lovely" (còn `abhirūpo dassanīyo` là
  "attractive, good-looking"), hơi lệch nghĩa thường thấy của "pāsādika" là "đáng kính /
  trang nghiêm". Giữ theo bản đã ghin vì 16.3 trùng nguyên văn 14.3, và ghi lại vì đây là
  chỗ một bản đọc lại độc lập có thể phản đối.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
