notes: |-
    Sáu khoá, và bốn trong sáu là Pāli TRÙNG BYTE với một khoá mà bản đã ghim đã dịch
    trong chính bài, nên phải dùng lại nguyên văn: 7.2 trùng 6.2, 8.5 trùng 6.5. Ngược
    lại 8.2 và 9.2 trùng NHAU, 7.5 trùng 9.5, nên bốn khoá này thành hai cặp bắt buộc
    phải giống hệt nhau — kiểm bằng script, không bằng mắt.

    7.5 và 9.5 là 6.5 có thêm ba `na`, nên lấy đúng danh sách của 6.5 rồi phủ "not" lên
    `issati / upadussati / issaṁ bandhati`. Danh sách sáu chữ hạng của Sujato ở 6.5 là
    "possessions, honor, respect, reverence, homage, and veneration" cho bảy chữ Pāli
    `paralābha, sakkāra, garu, kāra, māna, vandana, pūjana`; tôi giữ nguyên sáu chữ đó
    thay vì tự bổ sung, vì tự sửa sẽ làm cột Anh của bài tự mâu thuẫn với 6.5.

    8.2 không có tiền lệ byte-trùng: nó là 6.2 (`Bahumpi` thay `Appampi`, toàn bộ mệnh
    đề phủ phủ định). Tôi dựng từ khuôn 6.2 rồi đổi chiều: "a little bit" → "a lot" và
    phủ "not/isn't" lên `abhisajjati, kuppati, byāpajjati, patitthīyati` cùng
    `kopañca dosañca appaccayañca`, giữ nguyên các từ then chốt mà Sujato dùng ở 6.2
    (loses her temper, annoyed, hostile, hard-hearted, displaying annoyance, hate,
    bitterness). 9.2 dùng lại y nguyên 8.2.

    Triangulation 8.0: người viết lớp lấp cũng là người chấm, nên đây không phải một
    cách đọc Anh độc lập; bốn khoá chỉ có tiền lệ trong chính bài chứ không có bản Anh
    thứ hai nào để đối chiếu.

    Lớp lấp: 6 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị
    mất.
