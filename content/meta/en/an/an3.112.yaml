notes: |-
  **Phân loại theo máy trên 31 khoá: A 6 · B 18 · C 7 · D 0.** Dùng lại **nguyên văn** từ cùng bài: 6 khoá (đúng bằng số khoá nhóm A). Đã dò 4 nhóm Pāli trùng nguyên văn trong bài (tổng 10 khoá, gồm cả khoá đã ghim lẫn khoá lấp); với mỗi nhóm đó, mọi khoá lấp đều mang cùng lời với khoá còn lại của nhóm, ngoại trừ các khoá D đã nêu. Số khoá đã ghi: 31/31 khoá `fillableSegments`.

  **Hình dạng của chỗ trống.** Tầng đã ghim chỉ dịch **khối “quá khứ”** của hai chuỗi (`1.3`–`1.11` “desire comes up”, `5.1`–`5.5` “desire doesn’t come up”) và gộp cả ba thì vào một lời “in the past, future, or present”; khối “tương lai” `2.x`, khối “hiện tại” `3.x`, hai khoá liệt kê `1.4`/`1.5`, `4.4`/`4.5`, hai khối `6.x`/`7.x`, nhãn `7.5`, kết chương `7.6` và kệ tóm lược `8.0`–`8.4` đều rỗng. 31 khoá, 22 khoá có nội dung đo được.

  **Nhóm 1 — tách ba thì (B, `1.4`, `1.5`, `4.4`, `4.5`; ← `1.3` 0,94/0,88, `4.3` 0,94/0,89).** Tầng đã ghim dịch `1.3` “Desire comes up for things that stimulate desire and greed in the past, future, or present.” cho **một** khoá Pāli (`atīte`); lớp lấp tách đúng: “in the future;” cho `anāgate` và “in the present.” cho `paccuppanne`, giữ nguyên “things that stimulate desire and greed” của tầng ghim.

  **Nhóm 2 — hai khối “desire comes up” (B, `2.1`–`2.3`, `2.6`, `3.1`–`3.3`, `3.6`; ← `1.6`–`1.8`, `1.11`, 0,92–0,97).** Chỉ thay “past, future, or present” bằng thì đúng của khoá. Phần tầng ghim nuốt ở `1.8` (“When you do this, desire comes up,” bỏ mất `chandarāgaṭṭhāniye dhamme ārabbha`) được chèn lại: “When you do this with things that stimulate desire and greed in the future, desire comes up,”. **A nguyên văn (4 khoá):** `2.4`, `3.4` ← `1.9`; `2.5`, `3.5` ← `1.10`.

  **Nhóm 3 — hai khối “desire doesn’t come up” (B/A/C, `6.1`–`6.5`, `7.1`–`7.3`).** `6.1`, `6.2`, `6.5`, `7.1`, `7.3` dựng từ `5.1`, `5.2`, `5.5` (0,93–0,96); `6.3`, `6.4` **A nguyên văn** ← `5.3`, `5.4`. `7.2` (C theo máy, 0,54): Pāli gộp `5.2`+`5.3`+`5.4` vào **một** câu, nên lớp lấp ghép đúng ba mảnh lời đã ghim bằng dấu chấm phẩy (“You understand the future result of … in the present; when you know this, you grow disillusioned, your heart becomes dispassionate, and you see it with penetrating wisdom.”). Chữ “future” xuất hiện hai lần ở `6.2` (“the future result of things … in the future”) vì Pāli có cả `āyatiṁ vipākaṁ` lẫn `anāgatānaṁ`; giữ nguyên.

  **Nhóm 4 — nhãn, kết chương, kệ tóm lược (7 khoá: `7.5`, `7.6` B/C, `8.0`–`8.4`).** `7.5` `Dasamaṁ.` → “Tenth.”. `7.6` `Sambodhavaggo paṭhamo.` → “The Awakening chapter, the first.” theo khuôn đã có ở `an10.50:14.3` (“The Abuse chapter, the fifth.”), lấy “Awakening” của tầng ghim ở `0.2`. `8.0` → “Its summary verse:” và bốn dòng `8.1`–`8.4` theo khuôn đã có ở `an10.50`, `an3.70`, `an5.180` (dịch từng dòng bằng tên bài của tầng đã ghim, `an3.103`–`an3.112`): “Before Awakening, and two on Gratification, / Ascetics, and Wailing as the fifth; / Satisfaction, and the two that were mentioned, / and the other two Sources.” **Bất định ghi thẳng:** `Atitti dve ca vuttāni` — tôi đọc `dve` là hai bài tiếp theo `an3.109`, `an3.110` (Unprotected, Fallen) vì `an3.108` là `Atitti`; phép ghép này chỉ dựa trên thứ tự bài, không có nguồn nào ghim sẵn.

  **Số liệu A/B/C/D theo máy:** A 6 · B 18 · C 7 · D 0 (trên 31 khoá). Bảy khoá “C” theo máy là `7.2`, `7.5`, `8.0`–`8.4`; `7.6` là B (0,67 ← `0.2`).

  **Cố ý lệch tầng đã ghim.** (1) Tách “in the past, future, or present” của `1.3`/`4.3` thành ba thì (tầng ghim gộp). (2) `7.2` nối ba khoá `5.2`–`5.4` thành một câu theo Pāli.

  **Ngoài lát.** Không có khoá nào có chữ nhưng cắt cụt (đo: 0). Không có dấu “…” thừa ở tầng ghim.

  **Ngoặc kép / nháy — bảng đo tự động trên 31 khoá.** 31/31 khoá khớp Pāli từng khoá (đếm “ ” ‘ ’ đóng/mở; `’` có chữ thường đứng ngay sau tính là dấu nhạt lược). Không khoá nào lệch.

  **Dấu lược.** 0 khoá lấp có `…pe…` trong Pāli; tổng số `…` trong English của 31 khoá lấp = 0; khớp quy tắc `…pe…` = đúng một `…` (không khoá nào có `…` mà Pāli viết đủ).

  Không còn khoá rỗng nào: 31/31 khoá `fillableSegments` đã được viết (9 khoá dưới 40 ký tự — nhãn, kết chương, kệ — vẫn viết vì bỏ đi sẽ để lại khoá mồ côi trong bảng đối chiếu).

  **Coverage (đo thật).** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 38. Trước: 16/38 = 0,4211. Sau khi `published`: 38/38 = 1,0000 (lớp lấp phủ 22 khoá có nội dung; 9 khoá dưới ngưỡng không tính). Độ nhạy: ngưỡng 0,8 cần ≥ 31 khoá có lời; sau lấp còn dư 7 khoá trước khi rớt ngưỡng; trước lấp thiếu 15 khoá. Bài đã dưới ngưỡng trước khi lấp.

  **Hệ quả với `content/meta/reference-gaps.yaml`.** `an/an3.112` **có** record trong file đó; sau khi lớp lấp `published`, coverage = 1,0000 nên record thành thừa (test `a fill never leaves a gap record it has cured` sẽ đỏ nếu để lại). Không chạm file ấy trong lát này; để người điều phối sinh lại bằng `npm run reference:gaps`.

  **Triangulation 8,5.** Scorecard của bản Việt `content/meta/sutta/an/an3.112.yaml` do công cụ **khác họ** với lớp lấp này chấm/dịch (xem `source/tooling.yaml`), nên về mặt tác giả đây là lớp đọc English độc lập; nhưng điểm vẫn ≤ 9,5 vì không có bản Anh thứ hai cho 22 khoá có nội dung nằm trong lát, và 8,5 vì chỉ có Pāli root + Sujato đã ghim (53 khoá) + bản Việt canonical để đối chiếu. Không chạm bản Việt.

  **technical_integrity 9,6.** Không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, giao cho người điều phối. Không đặt blocker.
