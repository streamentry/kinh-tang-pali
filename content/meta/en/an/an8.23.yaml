  nhận ở tầng Anh đã ghim và lớp lấp **phải sửa chứ không sao chép**: lớp lấp giữ **đúng một** `…` mỗi
  khoá, theo đúng quy ước đã thành ở tầng lấp. Lý do ghi thẳng vì nó làm lớp lấp **khác** năm khoá anh
  em ngay phía trên: nhưng đó là sự khác bắt buộc, không phải lựa chọn.

  **Một chỗ lớp lấp chèn lại nội dung mà tầng đã ghim đã nuốt: `6.4`.** Pāli `6.4` là `‘Sādhu, bhante,
  yadettha na koci gihī ahosi odātavasano’”ti.`; tầng đã ghim ở khoá `3.13` chỉ còn `"“That’s good, sir.” "
