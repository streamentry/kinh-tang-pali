  nên đây là khoá A **duy nhất** dùng lại nguyên văn lời đã có. `5.7` trùng `3.4`, `5.8` trùng `3.5`,
  `5.9` trùng `3.6`, `5.10` trùng `3.7`, `5.11` trùng `3.8`: cũng là A, nhưng **không** dùng nguyên văn
  lời đã ghim vì tầng đã ghim đã bung dấu lược thành chữ — xem mục lệch có chủ đích bên dưới.

