  **Nhóm C — 2 khoá, tự dịch từ Pāli.** `6.1` (`Evaṁ vutte, bhante, hatthako maṁ etadavoca:`) và
  `7.5` (`Tatiyaṁ.`): tỉ lệ khớp cao nhất lần lượt là **0,5610** và **0,3448**, tức không có tiền lệ
