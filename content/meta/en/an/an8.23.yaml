  đơn 4 mở / 4 đóng. Ghi rõ điều này vì bài này **không** có ngoại lệ lồng nháy kép: chính Pāli ở đoạn
  `5.x`–`6.x` dùng `“` cho lời tỳ-kheo và `‘’` cho lời Hatthaka lặp lại, trong khi ở đoạn `3.x` Pāli
