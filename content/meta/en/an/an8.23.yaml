  **Nhóm D = 0.** Sáu **nhóm** Pāli trùng nguyên văn trong bài (đếm cả 56 khoá, không chỉ tầng lấp): một
  nhóm ba khoá `1.4`/`3.2`/`5.5` và năm nhóm hai khoá `3.4`–`3.8` với `5.7`–`5.11`. Ở mỗi nhóm, các
