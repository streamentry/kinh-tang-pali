  **Bất định đã ghi, không đoán.**
  · `Idhāhaṁ` (`5.1`) là dạng rút gọn `idha ahaṁ`; dịch “Here, sir, I …”. Nhánh đọc khác là `idha
    āhaṁ`, không có gì trong bài để phân xử.
  · `yadettha` (`6.4`) = *yat ettha*, “that here”; **không có** bản Anh nào ở đâu trong bài cho vế này
    vì tầng đã ghim nuốt mất nó ở `3.13`. Dịch “that there were no white-clothed lay people here”
    theo nghĩa của cả vế. Ghi rõ vì đây là chỗ duy nhất lớp lấp thêm lời mà không có tiền lệ tiếng Anh.
  · `Evaṁ vutte` (`6.1`) và `Tatiyaṁ.` (`7.5`) không có tiền lệ; dịch “Having spoken thus, sir …” và
    “Third.” theo nghĩa văn dụng thông thường.
  · `sādhu` dịch “That’s good, sir.” — dùng lại đúng lời đã ghim ở `3.13` cho `Sādhu`.

