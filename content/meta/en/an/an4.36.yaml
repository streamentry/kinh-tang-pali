notes: >-
  Doṇa sees the Buddha's thousand-spoked footprints and asks four times whether he might be a god, a centaur,
  a spirit, or a human. The Buddha denies all four, and then explains that if the defilements had not been
  abandoned, he would indeed have become one of those four — so the answer to "what are you" is that he is
  the one for whom none of the four is left.

  `3.3`–`3.8` are the summary of those four exchanges, and the pinned edition compresses them into two
  segments at `3.1`–`3.2`: "“When asked whether you might be a god, centaur, spirit, or human, you answer that
  you will not be any of these." The six filled segments rebuild the pairs one at a time using exactly the two
  frames that summary supplies — "…being asked," and "you answer that you will not be…" — so the summary and
  the detail read as the same sentence at two resolutions. The individual terms are taken from the pinned
  wording of the questions and answers themselves at `2.3`–`2.8` ("“Might you be a centaur?” / "“I will not be
  a centaur.”"), including Sujato's renderings of `gandhabba` as "centaur" and `yakkha` as "spirit".

  `4.2` is the second half of the Buddha's explanation. `4.1` is already translated by the pinned edition as
  one long sentence that runs "…I might have become a god … a centaur … a spirit … or a human. But I have given
  up those defilements, cut them off at the root, made them like a palm stump, obliterated them so they are
  unable to arise in the future." Its Pāli mentions only `devo bhaveyyaṁ`; `4.2`'s Pāli carries the other three
  and then repeats the tail verbatim. The fill therefore takes the pinned sentence and keeps only the three
  cases Pāli actually names, with an ellipsis at the front for the `devo` case already given at `4.1` — it
  does not restore the fourth item Sujato's compression had merged into the earlier segment.

  `ambiguity_integrity` sits at 9.0 because two points are judgement without an English witness. The six
  question-and-answer segments are reconstructed from a summary rather than translated from the Pāli's own
  wording, so their internal phrasing is inference from the pinned text — reliable, since the Pāli of each is
  a near-verbatim copy of what `2.3`–`2.8` already have, but inference nonetheless. And `4.2`'s opening
  ellipsis is an editorial device: the Pāli of that segment begins cleanly, and the ellipsis marks only that
  Sujato's `4.1` had already carried the first case.

  Triangulation is capped at 8.0: Sujato translates none of these seven segments.