notes: |-
  **Phân loại 19 khoá. Script (so Pāli đã chuẩn hoá dấu câu): A = 10 · B = 8 · C = 1 · D = 0. Đọc lại bằng tay:
  A = 8 · B = 10 · C = 1 · D = 0.** Hai khoá `1.5`, `1.6` script gọi là A (Pāli trùng `2.3`, `1.3`) nhưng không thể dùng
  lại nguyên văn, xem dưới. Lấp đủ 19/19 khoá tầng Anh đã ghim để trống (không còn khoá trống nào của bài): 18 khoá
  đủ ngưỡng 40 ký tự (sau khi bỏ khoảng trắng cuối) và 1 khoá dưới ngưỡng (`8.13`, nhãn thứ tự `Paṭhamaṁ.`).

  **Nhóm A — 8 khoá, dùng lại nguyên văn.** Bốn lần lặp công thức “tâm thẳng” của bốn phần nhớ tưởng
  Pháp, Tăng, giới, thí: `4.5`, `5.5`, `6.4`, `7.6` = `3.14`; `4.6`, `5.6`, `6.5`, `7.7` = `3.15`
  (“A noble disciple whose mind is unswerving finds inspiration …” và “When they’re joyful, rapture springs up …”).
  Cũng chính lời `8.10`/`8.11` đã ghim cho phần chư thiên.

  **Nhóm B — 10 khoá, dựng lại từ lời đã ghim.**
  · `4.4` ← `3.13` (khớp 0,92), `5.4` ← `3.13` (0,92), `6.3` ← `8.9` (0,92), `7.5` ← `3.13` (0,94): vế “At that time their
  mind is quite unswerving, based on …” — thay đối tượng nhớ tưởng: “the teaching” (`dhammaṁ ārabbha`), “the Saṅgha”
  (`saṅghaṁ`), “their ethical conduct” (`sīlaṁ`, theo “ethical conduct” ở `6.1` và `6.6` của tầng đã ghim), “their
  generosity” (`cāgaṁ`, theo “their generosity” ở `7.4`). `3.13` và `8.9` ở đây đã nêu đối tượng “the Realized One”/“the
  deities”; nên chỉ thay chữ chỉ đối tượng.
  · `8.4`, `8.5`, `8.6`, `8.7` ← `8.3` (khớp 0,88 · 0,88 · 0,88 · 0,92). **Phần tầng đã ghim nuốt mất:** Pāli `8.3`–`8.7` là
  năm vế song song (tín, giới, văn, thí, tuệ) mỗi vế một khoá, nhưng tầng đã ghim dịch gộp cả năm vào `8.3`
  (“… because of their faith, ethics, learning, generosity, and wisdom. I, too, have the same kind of faith, ethics,
  learning, generosity, and wisdom.’”). Lớp lấp dịch riêng từng vế còn lại theo đúng khuôn câu ấy: “ethics”, “learning”,
  “generosity”, “wisdom”. **Hệ quả người đọc sẽ thấy lặp**: `8.3` đã ghim đã chứa đủ năm phẩm, rồi bốn khoá `8.4`–`8.7`
  lặp lại từng phẩm; đây là do tầng đã ghim. Dấu nháy đơn đóng ’ ở `8.3` (đã ghim) và ở `8.7` (lớp lấp, khớp Pāli
  `saṁvijjatī’ti`) đều có: tầng đã ghim đóng nháy sớm hơn Pāli bốn khoá.
  · `1.5`, `1.6` — dựng từ `2.3`/`2.4` và `1.3`, **không** dùng lại nguyên văn. Lý do (đọc trong bối cảnh): `1.4` đã ghim
  kết bằng “Mahānāma the Sakyan heard about this.”, còn `1.5`–`1.6` là chính lời nghe được dưới dạng trực tiếp (nháy kép
  mở ở `1.5`, nháy đơn lồng nhau ở `1.6`, đóng ’” ở `1.6`). Lời đã ghim ở `2.3`/`2.4` và `1.2`/`1.3` là lời kể gián tiếp (“several
  mendicants are making a robe for the Buddha, thinking that / when his robe was finished … the Buddha would set out
  wandering”): dùng lại nguyên văn sẽ thành mảnh câu chữ thường đứng sau một câu đã kết thúc. Nên lớp lấp giữ các
  cụm từ của tầng đã ghim (“several mendicants are making a robe for the Buddha”, “the three months of the rains
  residence”) nhưng chuyển sang lời trực tiếp: “I hear that …, thinking:” và “‘When his robe is finished and the three
  months of the rains residence have passed, the Buddha will set out wandering.’”. `1.5` khớp 1,00 với `2.3` và `1.6` khớp 1,00 với `1.3`
  về chuẩn hoá Pāli; khác ở thì và nháy.

  **Nhóm C — 1 khoá.** `8.13` `Paṭhamaṁ.` → “First.” **Nhãn thứ tự — cảnh báo theo luật của lát:** đây là nhãn đánh số bài trong
  chuỗi chứ không phải số mục trong bài; nó đi đôi với `an11.12:5.17` `Dutiyaṁ.` (hai bài Mahānāma liền nhau trong phẩm
  `Anussativagga`), và bài này liệt kê **sáu** phần nhớ tưởng, không phải một; nhãn không đối ứng số mục nên không có gì để
  đối chiếu, và đừng đọc “First.” là “phần nhớ tưởng thứ nhất”.

  **Nháy.** 19/19 khoá khớp Pāli (đo đủ bốn loại: nháy kép mở/đóng, nháy đơn mở/đóng). Không có chỗ lệch có chủ đích về nháy.

  **Dấu lược.** Không khoá nào trong 19 khoá chứa `…` ở Pāli; tổng dấu lược của lớp lấp bằng 0. (Tầng đã ghim có “…” ở `4.3`, `5.3`,
  `6.2`, `7.4` thay cho vế `ujugatam…` kế tiếp — chính là các khoá `4.4`, `5.4`, `6.3`, `7.5` mà lớp lấp vừa dựng lại.)

  **Cố ý lệch tầng đã ghim:** (1) `1.5`/`1.6` dịch trực tiếp thay vì dùng lại lời gián tiếp của `2.3`/`2.4`/`1.3`; (2) `8.4`–`8.7`
  lặp lại từng phẩm đã được `8.3` gộp.

  **Coverage (mẫu số = khoá Pāli ≥ 40 ký tự, bỏ `:0`; không phải mọi khoá):** trước 42/60 = **0,7000** (dưới ngưỡng);
  sau 60/60 = **1,0000** (sau khi `published`). Độ nhạy: ngưỡng 0,8 cần ≥ 48/60; lớp lấp thêm 18 khoá nên dư 12 khoá.
  Bài này **có** record trong `content/meta/reference-gaps.yaml` (`substantiveWithoutEnglish: 18`, `coverage: 0.7`);
  sau khi `published` record đó trở thành thừa — không chạm tệp ấy, để người điều phối sinh lại bằng
  `npm run reference:gaps`.

  **Triangulation 7.5 — bản lấp không phải cách đọc English độc lập.** Scorecard Việt của `an11.11`
  (`content/meta/sutta/an/an11.11.yaml`) ghi **cả** `translators` **lẫn** `quality.assessed_by` trùng họ công cụ với lớp lấp
  này (đối chiếu theo `source/tooling.yaml`); bài này **không** được tuyên bố là đã đối chiếu English độc lập. Bản Việt
  canonical được dùng để đối chiếu nghĩa ở 19 khoá, không dịch vòng qua nó.

  technical_integrity 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát
  này (cấm của người điều phối), nên không tuyên bố technical gate pass. Bốn lệnh đó còn lại cho người điều phối.
