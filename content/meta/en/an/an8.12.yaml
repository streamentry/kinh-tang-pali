notes: |-
  **Phân loại 13 khoá (đo bằng máy; ngưỡng B = độ tương đồng Pāli ≥ 0,60 với một khoá đã có lời): A dùng lại nguyên văn = 8 · B dựng lại = 3 · C tự dịch = 1 · D Pāli trùng nhưng lời tầng khác nhau = 1.** Đã ghi 13/13 khoá `fillableSegments` (trong đó 12 khoá có nội dung ≥ 40 ký tự Pāli; 1 khoá còn lại dưới ngưỡng, không vào coverage). Số khoá trống còn lại của bài: 0 (mọi khoá tầng đã ghim để trống đều đã lấp). Pāli chứa 1 dấu lược (`…pe…` hoặc `…` = đúng một `…` mỗi nơi), bản lấp giữ đúng 1; 12 khoá có nháy trong Pāli. Trong bài có 15 nhóm Pāli trùng nguyên văn (48 khoá).

  **B — 3 khoá.** `4.3` ← `2.3` (0,96): Pāli `4.3` lặp `2.3` nhưng có một chỗ lược (`dhammassa …pe… saṅghassa`); lớp lấp lấy lời `2.3` và giữ đúng một `…` (“his teaching … the Saṅgha”). `5.2` ← `3.2` (0,99), chỉ khác dấu phẩy trong Pāli. `24.5` ← `16.2` (0,99): khoá kết của dãy tám “pariyāya” cuối (`assāsako …`), Sujato đã gộp vào `24.4`; lớp lấp lấy lời `16.2` (“I’m ambitious, I teach ambition, and I guide my disciples in that way.”).

  **A — 8 khoá dùng lại nguyên văn:** `4.6`←`2.6`, `5.1`←`3.1`, `18.6`←`10.2`, `19.6`←`11.2`, `20.6`←`12.2`, `21.6`←`13.2`, `22.7`←`14.2`, `23.6`←`15.2`. Sáu khoá cuối (`18.6`–`23.6`) là công thức `‘… samaṇo gotamo, … dhammaṁ deseti, tena ca sāvake vinetī’ti` — lời Đức Phật tự nhận (“I believe in …, I teach …”), đúng như các khoá anh em đã ghim.

  **D — `17.6` (báo, không tự hòa).** Pāli `17.6` trùng `8.2` và `9.2`, nhưng lời đã ghim khác nhau: `8.2` là lời người ta nói về Đức Phật (ngôi thứ ba: “The ascetic Gotama believes in a doctrine of inaction …”), `9.2` là điều Đức Phật nhận (ngôi thứ nhất: “I believe in inaction …”). Bài `17.5` mở bằng “In this sense you could rightly say that I teach inaction” và `17.2` đã ghim theo ngôi thứ nhất, nên lớp lấp theo `9.2`/`17.2`. Cả hai cách đọc của tầng đã ghim đều đúng trong ngữ cảnh riêng.

  **C — `33.4`**: nhãn `Dutiyaṁ.` → “Second.” (khuôn của các nhãn đã có). Nhãn là số Pāli; chưa đối chiếu với thứ tự thực của bài trong phẩm.

  **Cố ý lệch (có đo):** 8 khoá `17.6`–`24.5` có cặp nháy ‘ ’ trong Pāli (mỗi khoá 1 ‘ và 1 ’), bản lấp 0 và 0. Lý do: các khoá anh em cùng công thức đã ghim (`9.2`, `10.2`, `11.2`, `12.2`, `13.2`, `14.2`, `15.2`, `16.2`) không có nháy và nháy đóng của lời trích đã đặt ở `24.4` (” đã ghim); thêm nháy sẽ lệch với tám khoá anh em và làm cột Anh dư nháy. Ghi rõ ở đây để người duyệt thấy chủ ý.

  **Lệch tầng đã ghim cần biết (không sửa được):** ở `4.1` Pāli có hai chỗ lược `…pe…` nhưng Sujato mở rộng thành văn đầy đủ (0 dấu lược). Khoá `4.3` của lớp lấp có một chỗ lược và giữ lại một `…`; hai khoá kề nhau trong cột Anh vì vậy xử lý lược khác nhau.

