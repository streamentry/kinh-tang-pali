  `12.11` đã có lời ở tầng đã ghim nên cả hai vế đều **không** lấp, và cặp cuối (`10.2`≡`12.9`) có
  **cả hai** khoá đều thuộc tập lấp. Nhóm D = 0 vì không cặp Pāli trùng nào mà hai bên lời tầng khác nhau
  (hai cặp **khác chữ hoa/thường** mới có, xem riêng ở dưới). Nhóm C chỉ có `13.3` `Navamaṁ.` — nhãn
  thứ tự, không có lời ở bất kỳ tầng nào để mượn (đo toàn tầng: **2402** khoá nhãn thứ tự, **0/2402**
  có lời ở tầng Anh đã ghim).

  **Nhóm B — mười sáu khoá, dựng lại từ lời tầng đã ghim. Tỉ lệ khớp Pāli đo được (thô, `difflib`).**
  · `3.4` ← `3.2` — 0,9180 (bỏ nháy: 0,9171). Tầng đã ghim nuốt mất `sāriputta` và dấu chấm; lớp lấp
    chèn lại cả hai, và mở lại nháy kép đóng `”` mà Pāli `3.4` mang.
  · `3.6` ← `3.5` — 0,9298 (bỏ nháy: 0,9381). **Phần bị nuốt lớn nhất của lát**: tầng đã ghim ở `3.5` chỉ
    còn “Sir, what is the cause, what is the reason for this?” và bỏ trọn vế sau `yena`, tức mất **3**
    cụm Pāli (`midhekaccassa tādisaṁyeva dānaṁ dinnaṁ`, `na mahapphalaṁ hoti`, `na mahānisaṁsaṁ`)
    cùng **2** phủ định. Lớp lấp trả về đủ, dựng trên đúng vế kết của tầng đã ghim ở `13.2`
    (“while someone else gives exactly the same gift and it is very fruitful and beneficial.”).
  · `7.1` ← `6.2` — 0,7945. `8.1` ← `7.2` — 0,9261. `9.1` ← `8.2` — 0,9223.
    `10.1` ← `9.2` — 0,9474. `10.2` ← `9.3` — 0,9797. `12.5`←`6.2` 0,7945 · `12.6`←`7.2` 0,9261 ·
    `12.7`←`8.2` 0,9223 · `12.8`←`9.2` 0,9474 · `12.9`←`9.3` 0,9797 · `12.10`←`11.1` 0,9889.
  · `12.2` ← `4.1`/`5.1` — chỉ **0,4691** theo phép đo tự động vì khoá này ngắn (30 ký tự) và
