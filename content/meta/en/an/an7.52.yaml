  **Bốn loại khoá (đo từng khoá trên cả 17 khoá của lát): A = 0 · B = 16 · C = 1 · D = 0.**
  Nhóm A rỗng vì **không khoá lấp nào có Pāli trùng byte với một khoá đã có lời ở tầng đã ghim**:
  đo trên cả 58 khoá của bài, có **5** cặp Pāli trùng byte, và cả **5** đều không đưa được nhóm A —
