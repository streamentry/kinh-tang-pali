    nó xếp `12.2` vào nhóm gần với `11.2` (0,4691), trong khi nguồn đúng là `4.1`.

  **Tiền lệ Anh ở bài khác, dùng để đối chiếu nghĩa — đo trên toàn tầng Anh đã ghim.**
  · `sāhu dānan` xuất hiện ở **5** khoá Pāli toàn kho; ngoài `an7.52` còn có `an8.31:1.7`
    (“Or they give thinking, ‘It’s good to give.”) — **giống hệt** lời lớp lấp dùng ở `7.1`.
  · `porāṇaṁ kulavaṁsaṁ` — **4** khoá; `an8.33:1.3` dịch `dinnapubbaṁ katapubbaṁ pitupitāmahehi na
    arahāmi porāṇaṁ kulavaṁsaṁ hāpetun’ti` thành “… ‘Giving was practiced by my father and my father’s
    father. It would not be right for me to abandon this family custom.’” — đúng lời lớp lấp dùng ở
    `8.1` và `12.6`.
  · `pacanto apacantānaṁ` — **5** khoá; `an8.31:1.8` (“Or they give thinking, ‘I cook, they don’t. It
    wouldn’t be right for me to not give to them.’”) — đúng lời lớp lấp dùng ở `9.1` và `12.7`.
  · `cittālaṅkāracittaparikkhāraṁ` và `dānasaṁvibhāgo`: **không có tiền lệ nào ngoài chính bài này**
    (lần lượt 2 và 3 khoá Pāli toàn kho, tất cả đều ở `an7.52`). Nói thẳng: hai cụm ấy lớp lấp dịch
    theo nghĩa chữ cộng với lời tầng đã ghim ở chính các khoá `11.2`/`12.11`/`9.3`, **không** có bản Anh
    thứ hai nào để đối chiếu.

  **Phần tầng đã ghim nuốt mất mà lớp lấp chèn lại — đếm từng khoá.**
  · `3.4`: mất `sāriputta` (tầng đã ghim ở `3.2` cũng bỏ luôn `bhante`) và mất dấu `”` đóng cả câu hỏi.
  · `3.6`: mất trọn vế `yena midhekaccassa … mahānisaṁsan`, tức **3** cụm và **2** phủ định, như trên.
  · `7.1`, `8.1`, `9.1`: tầng đã ghim nuốt **đúng cái đầu** `Napi ‘…’ti` của từng mục, tức mất cả ý
    phủ định lẫn lời trong ngoặc; lớp lấp trả về “Nor thinking, ‘…’ do they give a gift;”.
  · `10.1`/`10.2`: tầng đã ghim ở `9.2` nuốt mất toàn bộ vế dẫn `yathā tesaṁ pubbakānaṁ isīnaṁ tāni
    mahāyaññāni ahesuṁ, seyyathidaṁ—` (tức phần “như các đại hiến tế ấy của các bậc thánh đời trước, tức là—”)
    và dồn danh sách mười vị tiên vào `9.2`; lớp lấp trả về đúng thứ tự Pāli: mở ngoặc ở `10.1`, tên
    mười vị tiên ở `10.2`, rồi mệnh đề `evaṁ me ayaṁ dānasaṁvibhāgo bhavissatī` — tên vị tiên giữ
    **nguyên văn** như tầng đã ghim (`Aṭṭhaka, Vāmaka, Vāmadeva, Vessāmitta, Yamadaggi, Aṅgīrasa,
    Bhāradvāja, Vāseṭṭha, Kassapa, and Bhagu`) và vế cuối giữ nguyên lời tầng đã ghim ở `9.3`
    (“just as they performed great sacrifices, I will share a gift”).
  · `12.2`–`12.10`: tầng đã ghim để trống **cả danh sách chín** mục của lớp lấp sau, dù `12.1` và
    `12.11` đã có lời; lớp lấp dựng lại từng mục từ lời tầng đã ghim đã dùng cho cùng mệnh đề ở
    `4.1`, `6.1`, `7.2`, `8.2`, `9.2`, `10.3`, `11.1`.

  **Hai khoá 3.4 và 3.6 — hai quyết định ngữ pháp phải ghi, không phải chỗ dịch lệch.**
  · `3.4`: lớp lấp viết “while, Sāriputta, …”. `siyā pana` đã được tầng đã ghim dịch là “while” ở
    `3.2` và “while” ở `13.2`, nên lớp lấp **bám** lời ấy và chỉ chèn `Sāriputta` mà tầng đã ghim đã bỏ.
    Hệ quả đã biết và chấp nhận: `siyā nu kho` ở `3.1` được tầng đã ghim dịch “could it be”, nên hai
    vế không dùng cùng một cách mở đầu. Đó là đặc điểm của tầng đã ghim, không phải của lớp lấp.
  · `3.6`: lớp lấp viết “why is it that giving exactly the same gift is very fruitful and beneficial,
    sir?” chứ **không** lặp lại “what is the cause, what is the reason”. Lý do: `3.5` đã ghim sẵn
    đúng cụm ấy cho vế thứ nhất, và Pāli `3.5`–`3.6` chỉ là **một** câu hỏi có hai vế; lặp nguyên văn
    sẽ sinh “Sir, what is the cause, what is the reason for this? … what is the cause, what is the
    reason why…?”. `bhante` thứ hai lớp lấp **trả lại** thành “sir” — tầng đã ghim đã bỏ nó ở `3.2`
    và ở phần nuốt mất của `3.5`, mà trong một lượt hỏi của người đệ tử thì xưng hô phải nhất quán.
    `heto ko paccayo` của vế thứ hai do dạng câu hỏi “why is it that” mang, không lặp.

  **Cặp Pāli trùng mà lời khác nhau — bốn cặp, đo được, và lý do.**
  `7.1`≡`12.5` · `8.1`≡`12.6` · `9.1`≡`12.7` · `10.1`≡`12.8` chỉ khác **một chữ hoa** ở `Napi`
  (Pāli `10.1` và `12.8` cũng vậy). Lớp lấp dịch khác nhau ở **khung**, giống hệt ở **phần trong ngoặc**:
  đo được phần trong ngoặc trùng byte ở cả bốn cặp (`It’s good to give,` · `Giving was practiced…
  custom,` · `I cook, they don’t… to them,` · `Just as the seers of the past performed those great
  sacrifices, namely—`), còn khung thì `Nor thinking,` ở vế `Napi` đầu câu so với `not giving a gift
  thinking,` ở mục trong danh sách mà `12.1` mở ra. Khung **bắt buộc** phải khác, vì Pāli khoá liền
  trước đã khác; hòa hai bên lại sẽ sinh một câu sai. Cặp thứ năm `11.1`≡`12.10` cùng hình dạng:
  lớp lấp giữ nguyên mệnh đề của tầng đã ghim (“When giving this gift my mind becomes clear, and I
  become happy and joyful”) và chỉ đổi dấu chấm cuối ngoặc từ `.` sang `,` — vì `11.1` kết câu còn
  `12.10` thì không. ⚠️ Cặp `10.2`≡`12.9` là cặp Pāli trùng **byte** mà cả hai khoá đều thuộc tập lấp:
  đo được `12.9` là **tiền tố đúng** của `10.2`, phần chỉ thêm ở `10.2` là “ do they give a gift;”.
  Cùng cấu trúc với bốn cặp trên.

  **Nhãn thứ tự `13.3` `Navamaṁ.` → “Ninth.”** Nhãn thứ tự bị tầng đã ghim bỏ là **thói quen của
  Sujato**, không phải của lớp lấp: đo toàn cache Pāli đã đồng bộ, có **2402** khoá nhãn thứ tự và
  **0/2402** khoá nào có lời ở tầng Anh đã ghim (`Paṭhama` 320 · `Dutiya` 293 · `Tatiya` 288 ·
  `Dasama` 287 · `Catuttha` 282 · `Pañcama` 281 · `Aṭṭhama` 275 · `Navama` **274** · `Ekādasama` 62 ·
  `Dvādasama` 40). Lớp lấp của dự án đã điền **27** khoá nhãn thứ tự theo đúng khuôn, với **11** giá
  trị khác nhau (`First.`…`Twelfth.`); “Ninth.” là khuôn ấy và là lần đầu giá trị này xuất hiện.

  🔴 **Udāna và bảng mục lục — đo lại ở đúng bài này, và đo lại toàn tầng. Kết quả: bài này KHÔNG có
  khoá udāna nào.** `an7.52` kết bài ở `13.3 Navamaṁ.` rồi hết; không có `Tassuddānaṁ`, không có
  khoá nào chứa `vaggo`, không có khoá nào kết bằng `suttaṃ` (tên sutta `0.3` là `Dānamahapphalasutta`,
  không có mũi `ṃ`). Khối “tên phẩm + udāna” chỉ xuất hiện ở bài **cuối** mỗi phẩm: `an7.52` là
  bài thứ **9** của phẩm `Mahāyaññavagga` và kết ở `Navamaṁ.`, đúng như `an7.43` kết ở `Ekādasamaṁ.`
  và `an7.47` kết ở `Catutthaṁ.` ⇒ lát này **không** có việc viết udāna để làm.
  ⇒ Nhưng con số toàn tầng thì **lớn hơn** hai con số đã được đưa cho tôi, và tôi báo theo phép đo
  của mình: khoá `Tassuddānaṁ` có **542** (trong đó **412** nằm ở những bài mà tầng Anh đã ghim thật
  sự có tệp) và **542/542 trống**; khoá chứa chuỗi `vaggo` có **687**, trong đó **659 trống**, và
  **28** khoá có lời đều là dòng dẫn chiếu ở `sn` (`…vaggo vitthāretabbo`, `vaggo tena pavuccatīti`)
  hoặc văn xuôi (`ñātigaṇavaggo`), **không khoá nào là nhãn đóng phẩm của một Nikāya**. Nói cách khác:
  **không nhãn đóng phẩm nào và không `Tassuddānaṁ` nào trong toàn bộ kho có lời ở tầng Anh đã ghim.**
  ⇒ Đây là số liệu để biên tập quyết có để lớp lấp viết udāna cho *mọi* bộ hay không: việc ấy **không**
  chữa được từng bài, và phép đo cho thấy quy mô là **542** bảng mục lục, không phải 165.

  **Ngoặc kép — khớp Pāli 17/17 khoá, đếm từng khoá.** `3.4` và `3.6` mỗi khoá mang **một** `”` đóng
  (Pāli hai khoá ấy đóng nháy kép của cả câu hỏi mở ở `3.1`, và tầng đã ghim đóng sớm ở `3.3` và `3.5`
  ⇒ bốn cột sẽ lệch ô nếu lớp lấp không trả lại `”` ở đúng hai khoá này). `7.1` `8.1` `9.1` `12.4`
  `12.5` `12.6` `12.7` `12.10` mỗi khoá có đúng một cặp `‘’`. `10.1` và `12.8` chỉ có `‘` mở (đóng ở
  `10.2`/`12.9`), `10.2` và `12.9` chỉ có `’` đóng. `12.2` `12.3` `13.3` không nháy. ⚠️ Khi đếm phải loại
  dấu `’` **nhạt lượu tiếng Anh**: lớp lấp này có **9** dấu `’` ấy (`It’s` ×2, `I’ll`, `don’t`,
  `wouldn’t` ×3, `father’s` ×4) cùng **10** dấu `’` đóng nháy thật; cộng lại `“` 2 + `‘’` 10 + `’` 10.

  **Dấu lược — 0, khớp Pāli.** Không khoá nào trong 17 khoá này có `…` ở Pāli, và lớp lấp **không**
  thêm dấu lược nào (đếm được: 0 khoá). Phần lớt của bài nằm ở năm khoá **không** thuộc lát này
  (`6.2` `7.2` `8.2` `9.3` `10.3`), mỗi khoá có `…pe…` ở Pāli và tầng đã ghim ghi **đúng một** `…` —
  đo được **5/5** đúng, không mất và không bịa.

  **Các lớp lỗi tầng Anh đã ghim, đo trên toàn bộ 58 khoá của bài này.**
  · *Bịa `…` nơi Pāli viết đủ*: **0** khoá (Pāli có 5 `…pe…` = 10 dấu thô; tầng đã ghim có đúng 5 `…`).
  · *Mở rộng `…pe…` thành văn xuôi*: **0**. *Mất một dấu lược*: **0**.
  · *Vệt markup `<j>` sót*: **0** (quét cả 58 khoá).
  · *Đảo mùa đêm–ngày*: **0** — bài này không có `ratti`/`ahorā`/`divāva` nào để đảo.
  · *Đảo khoá theo chu kỳ / gộp khoá*: **0**. Mốc đo là thứ tự các mốc nội dung, và nó **tăng đơn điệu**
    trong bản Anh đã ghim: `1.5`–`1.6` sabbath → `3.1`–`3.2` hỏi về phẩm quả → `3.3`–`3.6` nhân quả →
    `4.x`–`5.x` tặng với ý định → `6.x`–`11.x` các ý định còn lại → `12.12` “gods of the Divinity’s
    host” → `12.13` “non-returner” → `13.1`–`13.2` kết luận. Không có mốc nào lệch thứ tự Pāli.
  · *Nén phủ định*: **2** khoá — `3.3` và `3.5`. Cả hai đều mất các mệnh đề Pāli kèm phủ định: đo được
    `3.3` có **2** phủ định Pāli (`na mahapphalaṁ`, `na mahānisaṁsaṁ`) và **0** phủ định Anh; `3.5`
    cũng **2** và **0**.
  · *Nén dữ kiện*: **4** khoá có tỉ lệ từ Anh trên từ Pāli dưới 0,75 — `3.3` **0,31** (13→4 từ),
    `5.1` **0,53** (17→9, nuốt cả bốn mục `sāpekho`/`patibaddhacitto`/`sannidhipekho`/`imaṁ pecca`),
    `3.5` **0,58** (19→11), `9.3` **0,63** (19→12). Không có khoá nào rơi tới mức kiểu “239 → 42 ký
    tự”; tệ nhất ở đây là `3.3`.
  · *Thêm vệt không có trong Pāli*: **2** khoá — `11.2` và `12.11`. Pāli `api ca kho
    cittālaṅkāracittaparikkhāraṁ dānaṁ deti` **không** có nháy nào, còn tầng đã ghim bọc nó trong
    `‘…’` và thêm cả từ **thinking** trước nháy; tức thêm **2** dấu nháy và **1** mệnh đề không có ở Pāli.
  · *Đóng nháy kép sớm*: **2** khoá — `3.3` và `3.5` đóng `”` trong khi Pāli để mở tới `13.2`; đây
    cũng là lý do `3.4` và `3.6` của lớp lấp phải mang `”` (xem mục ngoặc kép ở trên).
  · Điểm tích cực đáng ghi: **5/5** khoá `…pe…` còn nguyên một `…`, **58/58** khoá có đúng khoá trong
