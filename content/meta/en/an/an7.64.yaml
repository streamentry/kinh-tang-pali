notes: |-
  1.8 và 2.6 là hai vế đối xứng, đứng ngay sau khoá đã ghim mô tả dài:
  - 1.8 = `atha kho so dubbaṇṇova hoti kodhābhibhūto` sau 1.7 ("…is ugly, even though
    they’re nicely bathed and anointed, with hair and beard dressed, and wearing
    white clothes."). Dịch: "but they are ugly indeed, overcome by anger."
  - 2.6 = `atha kho so dukkhaññeva seti kodhābhibhūto` sau 2.5 ("…sleeps badly, even
    though they sleep on a couch spread with woolen covers…"). Dịch: "but they sleep
    badly indeed, overcome by anger."

  Tiền lệ đã đếm: `dubbaṇṇo` đã ghim ở 1.4 là "ugly" (và "ugly" 144 lần trong bản
  đã ghim); `dukkhaṁ seti` ở 2.5 là "sleeps badly"; `kodhābhibhūto` là "overcome and
  overwhelmed by anger" (7 lần), nhưng ở 1.8 / 2.6 chỉ có `kodhābhibhūto` không kèm
  `kodhapareto`, nên dịch "overcome by anger". Hạt `ova` dịch "indeed" (31 lần
  "is indeed"). Sujato dùng "they" cho cá nhân trong chính bài này (1.7, 2.5, 7.5),
  nên 1.8 / 2.6 cũng "they", không dùng "he".

  7.6 = `So kāyena duccaritaṁ caritvā vācāya …pe…` — giữ NGUYÊN dấu lược, KHÔNG mở
  rộng. Bộ từ lấy từ 7.5 của chính bài: "do bad things by way of body, speech, and
  mind". Rút thành hai khoảng "by way of body, speech, …" vì phần bị lược là
  `manasā duccaritaṁ caritvā`; viết trọn "and mind" là bịa chữ. Cụt thành một
  khoảng "by way of …" thì mất mạch với 7.7. Hạt `So` giữ thành "So," vì bỏ đi là
  mất một từ Pāli.

  BẤT ĐỊNH: phần bị lược ở 7.6 không nhìn thấy, nên không biết có còn từ nào sau
  `vācāya` hay không — nhưng dấu lược thay cho phần đó, nghĩa được giữ nguyên.
  `vietnamese_clarity` 9.0 và `ambiguity_integrity` 9.0 vì 7.6 là câu nối qua chỗ lược.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
