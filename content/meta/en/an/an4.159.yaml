notes: |-
  `2.1`–`2.3` là lần thứ hai của người đàn ông đọc lại lời tỳ-kheo-ni, sau `1.4`–`1.7`. Chênh lệch
  giữa hai lần chỉ nằm ở dấu nháy và ở vài từ, và đó là chỗ tôi phải quyết:

  - `2.1` chép y nguyên `1.5` ("Sir, the nun named so-and-so is sick, suffering, and gravely ill."), nhưng
  đổi dấu mở: `1.5` nằm trong lời thầy gửi lại nên mở bằng `'`; `2.1` là lời người đàn ông nói thẳng với
  Đại vương Ānanda nên mở bằng `"`, đúng như Pāli mang.
  - `2.2` lấy "She bows with her head to your feet" từ `1.6`, rồi dịch `evañca vadeti:` thành "and says:".
  Tôi giữ "your feet" vì người đàn ông đang nói với Ānanda, và `1.6` đã ghim đúng như vậy.
  - `2.3` chép nguyên văn `1.7`, kể cả dấu đóng kép.

  `5.7`, `6.9`, `7.10` là ba khoá khó nhất của lát này, vì bản đã ghim đã TÁCH công thức ra hai khoá: `5.1`
  cho "‘This body is produced by food. Relying on food," và `5.2` cho "you should give up food.’". Ba khoá lấp
  đả lại toàn bộ công thức vào MỘT khoá, nên phải ghép lại và dùng dấu nháy của chính Pāli khoá lấp:

  - `5.7` → "‘This body is produced by food. Relying on food, you should give up food,’"
  - `6.9` → "‘This body is produced by craving. Relying on craving, you should give up craving,’"
  - `7.10` → "‘This body is produced by conceit. Relying on conceit, you should give up conceit,’"

  Tôi bám theo `5.1`/`6.1`/`7.1` (bản trích lại) chứ không theo `4.1`/`4.3`/`4.5` (lần nói đầu), và vì vậy
  không dịch chữ xưng "Sister," dù Pāli có `bhagini` — bản đã ghim cũng đã bỏ nó ở `5.1`. Giữ lại "Sister,"
  sẽ khiến cột Anh tự mâu thuẫn giữa `4.1` và `5.7` cho cùng một vế Pāli. Đây là đánh đổi có chủ ý và là chỗ
  trừ điểm của `ambiguity_integrity`.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm, nên đây KHÔNG phải một lớp đọc Anh độc lập. Tầng đối chiếu là Pāli đã ghim, các khoá còn lại của chính bản Anh đã ghim, và bản Việt dự án (do agent khác viết) chỉ để đối chiếu nghĩa.

  Lớp lấp: 6 khoá, tất cả đều nằm ở chỗ bản Anh đã ghim để trống. Không khoá nào là blockquote tham chiếu và không khoá nào có Pāli rỗng.

  Bài này còn 1 khoá mà bản Anh đã ghim để trống và lát này KHÔNG lấp, vì Pāli của chúng dưới 40 ký tự nên nằm ngoài ngưỡng đo coverage: `9.7`. Phần lớn là đuôi đoạn lược (`…pe…`, `Navamaṁ.`, `parinibbāyati.`) và bài thơ `udāna` cuối bài. Người đọc bốn cột VẪN thấy các ô này trống, và đó là đúng: một ô tham chiếu trống là lỗ hổng của bản dịch đó, khác với bản vắng mặt cả bài.

  Lớp lấp làm coverage English của bài này lên 100%. Trước lát này nó đã là 40/46 = 0.8696, tức đã trên ngưỡng 0.8, nên bài KHÔNG có record trong `content/meta/reference-gaps.yaml` và không sinh record thừa nào.
