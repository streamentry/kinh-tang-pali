notes: |-
  Năm khoá (7.2, 9.3, 11.3, 13.2, 17.2) có Pāli **giống hệt nhau**:
  `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi.`

  **KHÔNG có tiền lệ, và đây là lý do hạ `triangulation` và `ambiguity_integrity`.**
  Đã quét toàn cache Pāli: cụm này nằm ở 67 khoá của 13 bài (`an3.99`, `an4.101`
  đến `an4.110`, `an5.75`, `an5.76`, `an8.14`) và **cả 67 khoá đều bị bản Anh đã ghim
  để trống** — không có chỗ nào để đối chiếu chữ nào.

  Vì vậy dựng từ chính bản đã ghim của bài này: vế trước (`Seyyathāpi so …`) đã được
  Sujato dịch "I say that this individual is like the warrior who …" (7.1, 9.1,
  11.1, 13.1, 17.1), và vế sau là "Some individuals are like that." (7.3, 9.4,
  11.4, 13.4, 17.3). `tathūpamāhaṁ` rút gọn hai vế đó thành "I say that this
  individual is like that." Cụm "I say that this individual is" xuất hiện 16 lần
  trong tầng `an`, "like that" 7 lần — giữ nguyên bộ từ đã ghim.

  Bất định còn lại: hai chữ `I say` liền nhau ở 7.1/7.2, 9.1/9.3, 11.1/11.3,
  13.1/13.2, 17.1/17.2 nghe lặp — nhưng Pāli cũng vậy (`Seyyathāpi so` đã mang nghĩa
  "ta như người kia", rồi `āhaṃ` mới lại tuyên). Không nén, vì nén là tuỳ biến.

  Lớp lấp: 5 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn
  bị mất.