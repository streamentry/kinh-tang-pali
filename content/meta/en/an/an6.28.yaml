notes: |-
  Cả ba khoá là CÙNG một câu `Tasmā so asamayo manobhāvanīyassa bhikkhuno dassanāya
  upasaṅkamituṁ`, nên chỉ một cách dịch. Ghép từ hai khoá đã ghim của chính bài:
  `so samayo … upasaṅkamitun` đã ghim ở 2.2 / 3.5 / 4.5 là "That is the proper
  occasion for going to see an esteemed mendicant", và `na kho, āvuso, so samayo …`
  đã ghim ở 3.2 / 4.2 / 5.2 là "that’s not the proper occasion for going to see an
  esteemed mendicant". `Tasmā so asamayo` = "So that is not the proper occasion…".

  5.4 là khoá khép lời thoại nên mang một dấu ngoặc đóng, đúng như Pāli `”ti.`.

  Cần nói thẳng một hệ quả người đọc sẽ thấy: bản đã ghim ở 5.3 đã kết bằng `”` trong
  khi Pāli 5.3 KHÔNG có ngoặc nào. Nên ở 5.4 bắt buộc phải thêm dấu đóng thứ hai (luật
  "số ngoặc phải khớp Pāli theo từng khoá"), và người đọc sẽ thấy hai `”` liền nhau ở
  5.3–5.4. Đây là lỗi của bản đã ghim, không phải của lớp lấp; bỏ dấu đóng ở 5.4
  thì 5.4 lệch số ngoặc với Pāli. `ambiguity_integrity` hạ 9.0 vì lựa chọn ở đây là
  né hệ quả của bản đã ghim chứ không phải biên tập tự do.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
