notes: |-
  `4.8` TRÙNG NGUYÊN VĂN `1.6`, và bản đã ghim đã đặt tên năm ngọc quý ở đó
  ("The elephant-treasure, the horse-treasure, the jewel-treasure, the woman-treasure,
  and the householder-treasure"). Chép lại y nguyên — đúng luật của `sn11.24`. Tự đặt
  lại tên (ví dụ "treasure of the noble woman") sẽ khiến hai cột Anh của chính bài này
  gọi cùng một danh sách bằng hai bộ từ, và người đọc không biết đó là cùng một danh
  sách.

  Bất định phải ghi: Pāli ở 4.8 là công thức lặp "…assa pātubhāvo dullabho lokasmiṁ"
  năm lần ("sự xuất hiện của ngọc quý ấy hiếm ở thế gian"), còn bản đã ghim đã NÉN nó
  thành một danh sách trần. Chép y nguyên là đúng luật, nhưng nghĩa `pātubhāvo
  dullabho` không còn hiện ra ở 4.8 — nó hiện ở 4.6 và 4.9, nên cả đoạn vẫn đủ nghĩa.
  Vì vậy `ambiguity_integrity` hạ.

  `4.9` trùng với `1.7` (chỉ khác dấu `’”ti.`), và bản đã ghim đã dịch ở 1.7, nên
  chép lại y nguyên, giữ đúng hai dấu đóng mà Pāli mang.

  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
