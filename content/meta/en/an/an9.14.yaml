notes: |-
  BẢN DỊCH LẤP 6 KHOÁ (11.3–11.8), TẤT CẢ ĐỂ TRỐNG Ở TẦNG ĐÃ GHIM; không blockquote tham chiếu, không Pāli rỗng, không có `…pe…`, nên không có khoá nào bị bỏ.

  MỖI KHOÁ DỰNG TỪ CẶP HỎI–ĐÁP ĐÃ GHIM TRONG CHÍNH BÀI, KHÔNG DỊCH LẠI:
  - 11.3 ← 4.1/4.2 (`kiṁsamudayā` / `phassasamudayā`) → “what is their origin” / “contact is their origin”
  - 11.4 ← 5.1/5.2 (`kiṁsamosaraṇā` / `vedanāsamosaraṇā`) → “what is their meeting place” / “feeling is their meeting place”
  - 11.5 ← 6.1/6.2 (`kiṁpamukhā` / `samādhippamukhā`) → “what is their chief” / “immersion is their chief”
  - 11.6 ← 7.1/7.2 (`kiṁadhipateyyā` / `satādhipateyyā`) → “what is their ruler” / “mindfulness is their ruler”
  - 11.7 ← 8.1/8.2 (`kiṁuttarā` / `paññuttarā`) → “what is their overseer” / “wisdom is their overseer”
  - 11.8 ← 9.1/9.2 (`kiṁsārā` / `vimuttisārā`) → “what is their core” / “freedom is their core”
  Khung câu lấy từ 11.2 đã ghim (“When you were asked …”) và 11.9 đã ghim (“what is their objective, you answered ‘freedom from death’.”). Cả 11.9 lẫn 11.1 đã ghim đều **không** dịch `bhante` trong mạch này, nên sáu khoá cũng không dịch — giữ đúng bản đã ghim quan trọng hơn giữ riêng một từ kính ngữ.

  ĐỐI CHIẾU CHÉO ĐẾM ĐƯỢC, KHÔNG BỊA: cùng chuỗi tám câu hỏi này xuất hiện ở `an8.83` (`kiṁsamosaraṇā … kiṁsārā`) và `an10.58` (có thêm `kiṁogadhā`, `kiṁpahāmanā`); Sujato dịch hai bài đó y hệt (“What is their meeting place? What is their chief? What is their ruler? What is their overseer? What is their core?”). Đếm trong tầng Anh đã ghim: `kiṁsamosaraṇā` **5** bản dịch, cả 5 đều “meeting place”; `kiṁpamukhā` **5** → “chief”; `kiṁadhipateyyā` **4** → “ruler”; `kiṁuttarā` **5** → “overseer”; `kiṁsārā` **5** → “core”. Thuật ngữ chọn xong khớp toàn bộ số đếm, nên không có chỗ nào phải tự chế.

  ĐỐI CHIẾU LỚP VIỆT: `content/translation/vi/project/sutta/an/an9.14_translation-vi-project.json` có sẵn 11.3–11.8 và dùng đúng nhịp “hội tụ ở cảm thọ · đứng đầu là định · chánh niệm làm người chỉ huy · trí tuệ là bậc tối thượng · cốt lõi là giải thoát” — khớp với “meeting place / chief / ruler / overseer / core” mà lớp lấp dùng. Bản Việt đó không có mặt trong lát sinh sẵn, đã đọc trực tiếp từ tệp canonical.

  TRIANGULATION 8.0, KHÔNG CAO HƠN: lớp lấp do chính người chấm viết. Sáu khoá này có đủ Pāli root + cặp hỏi–đáp đã ghim trong bài + bài song song `an8.83`, nhưng không có bản Anh độc lập phủ riêng.

  ⚠ CẢNH BÁO PHẢI BÁO LẠI, KHÔNG TỰ SỬA: scorecard Việt `content/meta/sutta/an/an9.14.yaml` (dòng 5 `translators` và dòng 29 `assessed_by`) đều ghi `"OpenCode Space Bunny Free (agent)"` — TRÙNG đúng tác giả của lớp lấp này. Khi lớp lấp đạt `published`, `scripts/validate.ts` (nhánh “An English fill authored by whoever wrote the Vietnamese”) sẽ in cảnh báo: coverage ở đây dựa trên lớp lấp của chính dự án, chấm bởi cùng tác giả với bản Việt, nên scorecard Việt **không được** tuyên bố đã đối chiếu English. Lát này không sửa tệp Việt ngoài phạm vi.

