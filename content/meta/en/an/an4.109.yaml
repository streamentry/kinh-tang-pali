notes: |-
  an4.109 là `Rukkhūpamāsutta` — bốn loại người ví như cây, mỗi loại một vòng ba khoá:
  `Evaṁ kho, bhikkhave, puggalo …` → `Seyyathāpi so, bhikkhave, rukkho …` →
  `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi.` Cặp tính từ là `pheggu` (gỗ mềm) × `sāro` (gỗ cứng).

  **Chỗ bản ghim đã dịch nhiều hơn hẳn an4.108.** Ở bài này Sujato dịch **cả** `2.5`
  (`That individual is like a softwood tree that’s surrounded by softwoods, I say.`) **và** `5.3`
  (`and their followers are the same.`) — hai chỗ mà bản ghim của an4.108 im lặng. Nhờ vậy bài này có
  **mẫu thứ hai** để chọn, và đó là lý do tôi ghi rõ bên dưới.

  **Bốn khoá chép nguyên văn, không dịch lại.** `2.6`, `3.6`, `4.6`, `5.6` đều là Pāli trùng byte
  `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi.`; đo bằng script trên toàn lớp fill thì Pāli ấy đã có
  **26 khoá `published`** (`an4.101` 4, `an4.103` 4, `an4.104` 4, `an4.105` 4, `an5.249` 5, `an5.75` 5)
  và cả 26 đều dùng `I say that this individual is like that.` Chép y nguyên cả bốn.

  **Sáu khoá còn lại chép khuôn đã ghim trong chính bài:**
  - `3.4` ← `3.1` (`an individual a softwood surrounded by hardwoods?`) đổi dấu hỏi thành mệnh đề, theo
    khuôn `2.4` đã ghim (`That’s how an individual is a softwood surrounded by softwoods.`).
  - `4.4`, `5.4` cùng khuôn; `5.4` có `5.1` đã ghim làm mẫu (`a hardwood surrounded by hardwoods`).
  - `3.5`, `4.5`, `5.5` ← `2.5`, giữ nguyên `, I say.` **vì `2.5` của bài này có**, và giữ nguyên cả
    mạch `a softwood tree that’s surrounded by …` của bản ghim.

  **Hai điểm cần nói thẳng, không giấu:**
  1. **Hai bài anh em lệch nhau đúng một dấu phẩy, và đó là do bản ghim.** `an4.109:2.5` của Sujato có
     `, I say.`; `an4.108:2.4` của Sujato thì không. Tôi chép đúng mẫu của từng bài ⇒ an4.109 có `, I say.`
     ở `3.5`/`4.5`/`5.5`, còn an4.108 không có ở `3.4`/`4.4`/`5.4`. Hệ quả: ở an4.109 đọc liền sẽ thấy
     `I say` hai lần (`…, I say.` rồi `I say that this individual is like that.`). Tôi **không** tự bỏ
     `, I say.` vì bản ghim không cho phép, và cũng không thêm vào an4.108 vì bản ghim bài ấy không có.
     Muốn đồng hoá thì sửa tầng `english-sujato` — ngoài lát này.
  2. `sāro` tôi dịch `a hardwood tree` ở các khoá `Seyyathāpi` để đối xứng với `a softwood tree` của
     bản ghim, dù tiếng Anh hơi lặp. Ở các khoá `Evaṁ kho` tôi theo đúng bản ghim: `a hardwood`, không
     thêm `tree` (đó là lý do hai khuôn hơi khác nhau, và tôi không đồng hoá).

  **Thuật ngữ:** `pheggu` → `softwood`, `sāro` → `hardwood`, `…parivāro` → `surrounded by`, `pariṣā` →
  `followers`. Cả bốn đều là từ của bản Anh đã ghim ở chính bài này, không phải lựa chọn mới.

  **Dấu lược:** không khoá Pāli nào của an4.109 trong tập lấp mang `…pe…` hay `…` trần.

  **Khoá trống còn lại:** `an4.109:5.8` = `Navamaṁ.` — **8** ký tự Pāli, dưới ngưỡng 40 nên không tính
  coverage. Lấp được, nhưng ngoài lát `e12`.

  Điểm: `triangulation` = 8.0 vì `content/meta/sutta/an/an4.109.yaml` ghi `assessed_by: GLM-5.3 Flash
  (ZCode)` — khác họ công cụ `OpenCode Space Bunny Free`, nên chưa phải 7.5. Bốn trong mười khoá là bản
  dịch đã xuất bản của chính dự án; sáu khoá kia là chép khuôn có sẵn trong cùng bài.

