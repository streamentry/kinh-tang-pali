notes: |-
  Tiền lệ: cùng cấu trúc với an7.12 nhưng dùng `saṁyojana` (fetter) thay `anusaya`
  (underlying tendency). 1.9 đã ghin "The spiritual life is lived to give up and cut out
  these seven fetters." và 1.10 đã ghin trọn vế `ucchinnamūlaṁ tālāavatthukataṁ anabhāvaṁ
  kataṁ āyatiṁ anuppādadhammaṁ`. Giữ đúng hai mẫu ấy, kể cả "fetter" (không "underlying
  tendency"), để hai bài không tự mâu thuẫn về cùng một danh sách bảy món.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
