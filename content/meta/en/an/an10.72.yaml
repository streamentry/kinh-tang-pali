notes: |-
  Tiền lệ: bản Anh đã ghim của chính bài này đã dịch sẵn đúng nội dung Pāli của cả ba khoá.
  `2.3`+`2.4`+`2.5`+`2.6` ghép lại chính là `4.2` (chỉ khác chữ `ime`), nên `4.2` chép lại y nguyên
  theo luật 3 của lớp, kể cả "But the Buddha has said that sound is a thorn to absorption" và
  "Gosiṅga Sal Wood". `2.7` và `2.8` là tiền lệ trực tiếp cho `4.3`+`4.4`.

  Câu Pāli của `4.2` chạy liền một mạch, không ngắt ở `dassanāya`; tiếng Anh buộc phải có ranh giới
  câu nên tôi tách thành bốn câu, đúng như bản đã ghim tách `2.3`–`2.6`. Đây là chấn đoạn Pāli, không
  phải lược chữ.

  `, bhante,` ở `4.3` dịch "sir" theo tiền lệ `an10.89:12.2` và `an10.89:14.2` của cùng tầng.

  Bất định đã biết: `4.4` mang dấu `”` vì Pāli đóng ngoặc `"` mở ở `4.1`, nhưng bản Anh đã ghim
  của `4.1` ("And the mendicants told him what had happened.") đã bỏ dấu mở, nên dấu `”` ở đây không
  có ngoặc mở hiện diện. Tôi vẫn giữ `”` vì đó là dấu Pāli dùng, và viết `4.4` thành câu trọn vẹn
  để người đọc không phải nối với một câu đã bị đóng ở `4.2`.

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
