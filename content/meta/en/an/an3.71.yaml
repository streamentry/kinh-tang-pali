notes: |-
  Bản đã ghim đã gộp CẢ BA vế vào `4.9`: "This is the drawback we’ve seen in greed,
  hate, and delusion, and this is why we advocate giving them up." — với số nhiều
  "them". Ở `4.10` và `4.11` mỗi vế chỉ nói về MỘT cảm thọ, nên "giving it up" (số ít)
  là đúng; giữ số nhiều sẽ là dịch sai số lượng, và đây là tiêu chí dễ sai nhất khi
  dịch theo trí nhớ.

  Khác với `4.9`, Pāli ở `4.11` mang dấu `”` đóng còn `4.10` thì không, nên `4.11`
  kết bằng `.”` và `4.10` kết bằng `.` — luật 4 đòi khớp theo từng khoá.

  Bộ từ "This is the drawback we’ve seen in …, and this is why we advocate …" lấy
  nguyên văn từ `4.9` để bốn khoa trong cùng bài đọc như một chuỗi.

  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
