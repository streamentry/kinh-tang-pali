notes: >-
  Đây là lời đáp của Vassakāra sau khi Ajātasattu sai đi, nên phải ở ngôi thứ ba
  ("bows … and asks") chứ không phải mệnh lệnh "bow and ask". Bốn điều kiện sức
  khoẻ phải giữ đủ và giữ nguyên thứ tự mà bản đã ghim đã dùng. `appābādhaṁ
  appātaṅkaṁ` là hai từ riêng (không bệnh, không khỏe), dịch "healthy and well"
  thay vì gộp thành một.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
