notes: |-
  **Phân loại 20 khoá (đo bằng máy, so Pāli từng khoá với khoá có lời Sujato trong cùng bài): A = 19 · B = 0 ·
  C = 1 · D = 0.**

  **A — 19 khoá dùng lại lời đã ghim.** Bài lặp nguyên công thức cho lợi ích thứ hai, thứ ba, thứ tư; tầng
  đã ghim dịch đủ ở lần đầu rồi đặt `…` ở `2.16`, `2.19`, `3.16`, `3.19`, `4.18`, `4.21` và để trống phần sau.
  17 khoá chép **nguyên văn**: `2.17` `3.17` `4.19` ← `1.4` (chín thể loại giáo pháp); `2.18` `3.18` `4.20` ← `1.5`;
  `2.20` ← `2.5`; `2.21` ← `2.6`; `2.22` `3.22` ← `2.7`; `2.23` `3.23` ← `2.8`; `3.21` ← `3.6`; `4.23` ← `4.6`;
  `4.24` ← `4.7`; `4.25` ← `4.8`; `4.26` ← `4.9`.

  **Hai khoá A cố ý lệch lời đã ghim — dấu lược.** `3.20` (Pāli trùng `3.5`) và `4.22` (Pāli trùng `4.5`): Pāli viết
  **đủ** `napi bhikkhu iddhimā cetovasippatto …`, nhưng lời đã ghim ở `3.5` và `4.5` chèn `…` thay cho
  “who has achieved mastery of the mind”. Theo luật dấu lược, lớp lấp không sao chép `…` mà Pāli không có: giữ
  nguyên từng chữ còn lại của `3.5`/`4.5`, chỉ trả lại vế “who has achieved mastery of the mind” (lấy đúng chữ của
  `2.6`). Hệ quả: hai khoá này khác lời đã ghim của khoá có Pāli trùng — đây là lệch có chủ đích, đã đo.

  **C — 1 khoá: `4.31` `Paṭhamaṁ.` → “First.”** Nhãn thứ tự (giá trị Pāli khớp dạng `…ṁ.`), tầng đã ghim không
  dịch nhãn nào; điền theo khuôn “First.”. Bài là bài đầu của phẩm 20 (`0.2` “20. The Great Chapter”) nên nhãn
  khớp vị trí; không có cảnh báo về số mục.

  **Dấu lược và nháy:** không khoá nào trong 20 khoá có `…` ở Pāli, nên bản lấp có 0 dấu lược. Nháy khớp Pāli
  ở cả 20 khoá (ví dụ `2.23` `3.23`: Pāli ‘…’ti → lấp ‘…’).

  **Cơ chế khoá trống (đo, không sửa):** dãy ≥ 4 khoá trống liên tiếp: 3 dãy / 13 khoá / 794 ký tự Pāli; nhóm
  dòng song song (ngưỡng 0,70, mỗi khoá một nhóm): 13/20 khoá. Bài có 122 cặp khoá Pāli trùng nguyên văn.
  Không khoá trống nào còn lại: lát này lấp cả 20 khoá, gồm 6 khoá dưới ngưỡng 40 ký tự (`2.22` `3.22` `4.23`
  `4.25` `4.26` `4.31`) — các khoá này không vào coverage nhưng được lấp để bài liền mạch.

  **Triangulation 8.6.** Scorecard Việt của bài (`content/meta/sutta/an/an4.191.yaml`) do một công cụ **khác** họ
  với lớp lấp chấm, nên về tác giả đây là lớp đọc Anh độc lập với bản Việt; nhưng không có bản Anh thứ hai, và 19/20
  khoá là lời Sujato dùng lại, nên không chấm cao hơn. Bản Việt canonical có đủ 96 khoá và được dùng để kiểm nghĩa.
  Không sửa tệp Việt hay metadata Việt.

  **technical_integrity 9.6.** Lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều phối. Đã tự kiểm
  bằng máy: JSON parse; mọi khoá thuộc tập khoá tầng Anh đã ghim để trống (không shadow); NFC; không khoá rỗng;
  khoá theo thứ tự Pāli; nháy kép/đơn và dấu lược so **từng khoá** với Pāli (`…pe…` tính là một `…`; `’` có
  chữ thường đứng ngay sau là dấu nhạt lượu, còn lại là nháy đóng).

  **Coverage và gap.** `an/an4.191` **không** có record trong `content/meta/reference-gaps.yaml`, nên không record nào thành thừa vì lát này. Coverage English (mẫu số = khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`):
  trước lớp lấp 58/72 = 0.8056; sau khi `published` 72/72 = **1,0000** (không còn khoá có nội dung
  nào trống). Độ nhạy: lớp lấp chỉ được tính khi `published`; nếu bài rơi về `review`/`draft` thì coverage quay về
  0.8056. Ở trạng thái `published`, phải mất 15 khoá có nội dung
  nữa mới rớt ngưỡng 0,8.
