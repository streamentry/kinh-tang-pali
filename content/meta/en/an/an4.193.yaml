notes: |-
    Sáu khoá nằm ở phần bản đã ghim đã lược, và cả sáu đều bám được tiền lệ.

    9.4 là chiếc gương dương của 4.4 và 5.4: Pāli `aluddho … lobhena anabhibhūto
    apariyādinnacitto neva pāṇaṁ hanati …` giữ đúng cái khung mà bản đã ghim dùng ở
    10.3 ("An individual who is benevolent—not overcome by aggression—doesn't kill living
    creatures, steal, … Is that for their lasting welfare and happiness?"). `aluddha`
    dịch "contented" theo "contentment" mà Sujato đã dùng cho `alobho` ở 9.2 (đếm 109
    lần trong bản đã ghim); riêng cụm "contented individual" thì chưa có tiền lệ (0
    lần), nên đó là cách đặt của lớp lấp. Câu hỏi ở đuôi — Pāli kết bằng `”ti` — được
    giữ làm câu hỏi vì 4.4, 5.4 và 10.3 của bản đã ghim đều vậy, và 9.5 trả lời
    "Evaṁ, bhante".

    10.1 giữ đúng hai dấu lược theo Pāli (`adoso … amoho … asārambho`, hai `…pe…`) và
    theo khuôn 5.1+5.2 của chính bài: "What do you think, Bhaddiya, does hate … or
    delusion … or aggression come up in a person for their welfare or harm?" → thay ba
    mô tả tiêu cực bằng "non-hatred … or non-delusion … or non-aggression".

    BẤT ĐỊNH: bản đã ghim dịch `asārambho` ở 9.2 là "benevolence", và 10.3 (Pāli
    `asāraddha`) là "benevolent", nhưng 5.2 lại dịch `sārambho` là "aggression". Ở
    10.1 tôi theo 5.2 ("non-aggression") vì đó là khuôn của chính danh sách ba khoản
    tối này; hệ quả là cột Anh của bài có "non-aggression" ở 10.1 cạnh "benevolent"
    ở 10.3. Không sửa được vì 10.3 thuộc bản đã ghim. Vì vậy terminology hạ 9.2 và
    ambiguity_integrity hạ 9.1.

    13.7 và 13.9 giữ nguyên bộ từ của 13.3 ("Then you won't act out of greed by way of
    body, speech, or mind."), chỉ đổi danh từ. Dấu ngoặc bám từng khoá: 13.7 không có
    ngoặc (Pāli cũng không), 13.9 đóng cả `’` (mở ở 13.2) lẫn `”`, đúng như Pāli
    `’”ti` và như bản Việt đã publish.

    15.11 và 16.3 là hai khoá khó nhất, vì bản đã ghim đã GỘP chúng vào khoá trước:
    15.10 của Sujato là "If all the aristocrats, brahmins, peasants, and menials were to
    be converted by this, …", tức đã dịch sẵn cả 15.11. Tôi vẫn dịch 15.11 theo đúng
    Pāli của nó và giữ hai dấu lược, vì bỏ qua thì cột Anh sẽ trống ở nơi Pāli có chữ.
    Hệ quả là người đọc thấy lặp ở 15.10–15.11; đó là hệ quả của cách cắt segment của
    bản đã ghim, không phải lỗi của lớp lấp, và tôi không sửa vì bản đã ghim là tầng
    tham chiếu. `vessā` dịch "peasants" và `suddā` dịch "menials" theo đúng hai chỗ
    Sujato đã dịch nguyên văn danh sách bốn tầng lớp `khattiyā brāhmaṇā vessā suddā`
    (dn3:1.14.4 và dn27:5.2, cùng cho ra "aristocrats, brahmins, peasants, and
    menials"), chứ không phải "merchants".

    16.3 giữ vế `akusaladhammappahānāya kusaladhammūpasampadāya` theo cách Sujato dịch
    ở 16.4 ("for giving up unskillful qualities and embracing skillful qualities"); ở
    16.2 bản đã ghim đã lướt mất vế này.

    Lớp lấp: 6 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị
    mất. Triangulation 8.0: người viết lớp lấp cũng là người chấm, nên đây không phải
    một cách đọc Anh độc lập.
