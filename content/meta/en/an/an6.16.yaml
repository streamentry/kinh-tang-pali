notes: |-
  Bài là Nakulapitusutta: người mẹ của Nakula khuyên chồng đang nằm liệt đừng lo âu. Cấu trúc
  lặp sáu lần, mỗi lần hai vế `Dukkhā, gahapati, sāpekkhassa kālakiriyā;` +
  `garahitā ca bhagavatā sāpekkhassa kālakiriyā.`, và bản Anh đã ghim đã lược đúng mười vế đó.

  Mười khoá lấp NGUYÊN VĂN, không dịch lại. Phép đo bằng script (so byte Pāli giữa khoá lấp và
  mọi khoá đã ghim trong cùng bài):
    2.10 ≡ 3.6 ≡ 4.6 ≡ 5.7 ≡ 6.7 ≡ 2.2 ≡ 7.7   `Dukkhā, gahapati, sāpekkhassa kālakiriyā;`
    2.11 ≡ 3.7 ≡ 4.7 ≡ 5.8 ≡ 6.8 ≡ 2.3 ≡ 7.8   `garahitā ca bhagavatā sāpekkhassa kālakiriyā.`
    Bản ghim 2.2: "Such concern is suffering,"   2.3: "and it’s criticized by the Buddha."
  Cả hai vế đều có sẵn ở 2.2/2.3 (đầu bài, câu hỏi của Nakula-mẹ) và ở 7.7/7.8 (cuối bài,
  câu trả lời của Đức Thế Tôn) — hai chỗ đã ghim cho CÙNG một cách dịch, nên lấy nguyên văn không
  mất gì.

  Riêng 2.11/3.7/4.7/5.8/6.8 bỏ dấu `”` mà bản ghim đặt ở 7.8 (`kālakiriyā”ti.`), vì Pāli của
  năm khoá này không có dấu đó — chỉ 7.8 mới khép lại lời Đức Thế Tôn. Giữ dấu của 7.8 sẽ là
  năm dấu thừa không có nguồn.

  Một khoá DỰNG: 8.3 `tathā pahīno ca pana nakulapituno gahapatissa so ābādho ahosi.`
  Bối cảnh liền kề:
    8.1 (đã ghim) "…his illness died down on the spot."
    8.2 (đã ghim) "And that’s how Nakula’s father recovered from that illness."
    8.3 → "And so that illness of the householder Nakula’s father was gone for good."
  `tathā pahīno … ahosi` là câu kết nhấn bệnh ấy đã HẾT hẳn, không phải chỉ tạm yếu — cùng nghĩa
  với "his illness died down on the spot" ở 8.1 nhưng ở dạng khẳng định đã xảy ra. "gone for good"
  chọn vì `pahīno` là thân phát từ `pahā` (bỏ hẳn, không phải `bhiyyā`/giảm dần).
  Lưu ý bất định: bản ghim ở 8.2 đã dịch `Vuṭṭhahi … tamhā ābādhā` là "recovered from that
  illness", nên 8.3 lặp lại ý — đúng theo Pāli, vì Pāli cũng lặp. Không nén.

  Bản Việt hiện hành: KHÔNG có. `content/translation/vi/project/sutta/an/` không có tệp cho
  an6.16 và `content/meta/sutta/an/an6.16.yaml` cũng không tồn tại — đo bằng script, 0 tệp cả
  hai. Tầng `vietnamese-current` tại commit đã ghim chỉ có Pháp Cú. Triangulation 8.0: mười
  khoá lấy nguyên văn từ bản ghim, một khoá dựng từ Pāli cộng hai câu liền kề đã ghim. Không có
  scorecard Việt nào để rơi vào trường hợp "cùng công cụ" — nên 8.0, không hạ xuống 7.5.

  Technical gate: bị cấm chạy. Còn lại bốn lệnh — `npm run validate`, `npm test`,
  `npm run check`, `npm run build`. technical_integrity 9.6 vì lý do đó, không phải 10.0.
