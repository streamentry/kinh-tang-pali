notes: |-
  Tiền lệ: 2.1 và 4.1 của chính bài đã ghin "relishes work, talk, sleep, company,
  closeness, and proliferation" và "They love these things and like to relish them." Một khoá
  đơn lẻ cùng cấu trúc đã được ghin ở `an10.86:15.1` ("This venerable relishes work. They
  love it and like to relish it"), nên 2.5 và 4.5 theo đúng khuôn đó.
  Bất định nhỏ: `rāma / rato / rāmataṁ anuyutto` là bộ ba, Sujato gộp thành hai vế ("relish
  work… They love it and like to relish it"). Bản dịch giữ đúng hai vế đó; nếu đọc `rato` là
  "delighting in" thì sẽ thành ba vế và lệch bản đã ghin.
  Lớp lấp: 4 khoá (2.2–2.4, 4.2–4.4) cùng nằm trong phần bản đã ghin đã lược; lát này chỉ
  lấp 2.5 và 4.5.
  
