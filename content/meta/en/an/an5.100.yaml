notes: |-
  Phạm vi: 18 khoá lấp, là toàn bộ khoá Sujato để trống có Pāli (8 khoá có nội dung ≥ 40 ký tự; 10 khoá ngắn hơn: nhãn `Dasamaṁ.`, nhãn phẩm, dòng `Tassuddānaṁ` và bốn dòng kệ tóm tắt cùng câu kết quyển). Không còn khoá trống nào của bài ngoài danh sách. Sujato gộp toàn bộ lời Mahāmoggallāna kể lại cho Đức Phật (4.1–4.9) vào 3.1 (`and told him what had happened`), nên chín khoá này không có chữ nào.

  Bốn nhóm (đo bằng máy, Pāli chuẩn hoá): A=5 · B=5 · C=8 · D=0. Xử lý thực tế: 2 khoá dùng lại nguyên văn Sujato (4.3 từ 1.5; 4.7 từ 2.4, đổi nháy ” thành ’); 16 khoá viết mới.

  Nhóm B (khoá ← khoá nguồn gần nhất, tỉ lệ khớp Pāli): 4.1 ← 1.3 (0.67); 4.2 ← 1.4 (0.86); 4.4 ← 2.1 (0.73); 4.8 ← 2.5 (0.86); 4.9 ← 2.6 (0.67). Phần chèn lại: lời kể của Mahāmoggallāna song song từng câu với phần tả ở 1.3–1.5 và 2.1–2.6 nên dựng từ đó, đổi ngôi (`my supporter`, `came up to me`, `circled me`) và dùng lại `Magadhan village with its fields`, `host of mind-made gods`, `fixed desire`. 4.2 chép 1.4 (Pāli chỉ bỏ `hoti`). 5.4 dựng từ 5.2 thành câu trích trực tiếp.

  Nhóm D: không có.

  Chỗ cố ý lệch, kèm lý do: (1) 4.6 (`ahaṁ bhikkhusaṅghaṁ pariharissāmīti`): Pāli ở khoá này không có dấu nháy (khác 2.3 có ‘…’), nên English không có nháy: `I shall lead the mendicant Saṅgha.` (2) 4.8 thêm `sir` (Pāli `bhante`). (3) Các khoá ngắn: 11.11 `Tenth.`; 11.12 `The Kakudha Chapter, fifth.` theo khuôn `The Deities Chapter, fourth.` của Sujato ở an7.43; 12.0 `Its summary verse:` theo các khoá `Tassuddānaṁ` đã có ở lớp lấp (sn24.44, sn35.93, mn20); bốn dòng kệ dịch theo tên các bài mà Sujato đã đặt cho an5.91–99 (`Accomplishments`, `Declarations`, `Living Comfortably`, `Unshakable`, `Talk`, `In the Wilderness`, `The Lion`); 12.5 `The second fifty is finished.` Các khoá này dưới 40 ký tự nên không vào coverage.

  Nháy: đo từng khoá, khớp Pāli ở mọi khoá.

  Coverage (≥ 40 ký tự, bỏ khối `:0`): trước 65/73 = 0.8904; sau (khi `published`) 73/73 = 1.0000. Độ nhạy: có thể thiếu tối đa 14 khoá có nội dung mà vẫn ≥ 0,80. Bài không có record trong `content/meta/reference-gaps.yaml` (đã trên ngưỡng). Số khoá trống còn lại sau lớp lấp: 0.

  Triangulation 8.8: `content/meta/sutta/an/an5.100.yaml` (bản Việt) ghi `quality.assessed_by` là một công cụ KHÁC họ công cụ của lớp lấp này (đối chiếu `source/tooling.yaml`), nên đây là lớp đọc English độc lập hơn về mặt tác giả; nhưng vẫn chỉ 8,8 vì bản lấp không có bản Anh thứ hai để đối chiếu: 18 khoá lấp được dựng từ Pāli root + bản Việt canonical + hệ danh từ của Sujato ở chính bài, không từ một bản Anh nào. Đối chiếu có thật: Pāli root + Sujato đã ghim + bản Việt canonical (kiểm nghĩa, không dịch vòng, không chép). Không chạm tầng Việt.

