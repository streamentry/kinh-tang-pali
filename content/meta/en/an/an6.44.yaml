notes: |-
  an6.44 là `Migasālāyasutta` — bà Migasālā hỏi Đức Thế Tôn về chỗ sanh của người trai tế và kẻ trai tế, rồi
  Đức Thế Tôn bảo đừng phán xét cá nhân. Mười khoá của lát này là **phần Đức Thế Tôn nghe kể lại**:
  `4.1`–`4.10` là lời Đức Thế Tôn kể lại chuyện đã xảy ra ở `1.1`–`2.7` — cùng một sự kiện, chỉ đổi ngôi.

  **Bài này không có tầng Việt nào — đã đo, không phải tôi bỏ sót.** Không có
  `content/translation/vi/project/sutta/an/an6.44_…json` và không có `content/meta/sutta/an/an6.44.yaml`
  (hai bài anh em gần nhất trong thư mục là `an6.41` và `an6.46`). Nên tôi **không** đối chiếu được bản Việt
  hiện hành hay bản Việt canonical, và đây là lý do `source_provenance` của tôi thấp hơn các bài kia trong lát.
  Thay vào đó tôi đối chiếu với **bản Anh đã ghim của chính phần trước của bài này** — một tầng Anh độc lập
  với lớp lấp, đúng commit đã ghim. Đó là cách đối chiếu mạnh, nhưng nó chỉ là **một** nguồn và là **cùng một
  văn bản**; vì vậy `triangulation` = 8.0 chứ không hơn, và tôi không tuyên bố đã đối chiếu ba tầng.

  **Đo từng cặp `2.x`/`4.x` bằng script trước khi dịch**, vì đây chính là chỗ dễ sinh hai cách dịch cho
  cùng một câu:
  - **trùng byte** ⇒ chép nguyên: `4.4` ≡ `2.2`, `4.6` ≡ `2.4`, `4.7` ≡ `2.5`.
  - **khác một chữ** ⇒ chép rồi sửa đúng chữ ấy: `4.5` = `2.5` bỏ `pi` (`sakadāgāmī satto` →
    `sakadāgāmipatto`) ⇒ bỏ chữ `too`. Nhờ vậy `4.5` ("…since he was a once-returner…") và `4.7`
    ("…since he **too** was…") là hai câu khác nhau, đúng với `So` vs `Sopi` của Pāli. Nếu tôi chép đại
    `2.5` vào cả hai thì `4.5` sẽ thừa một chữ `too` mà Pāli không có.
  - **khác dấu câu** ⇒ chép rồi sửa dấu: `4.3` = `2.1` đổi `?` thành `.` (Đức Thế Tôn đang **kể lại**
    câu hỏi của Migasālā, không hỏi lại); `4.8` = `2.6` với ký tự ngoặc đóng `’` thay `”`.
  - **bốn khoá phải tự dịch** vì không có bản ghim song song: `4.1`, `4.2`, `4.9`, `4.10`.

  **Cái giá của luật "dùng lại cách dịch đã có" — nói thẳng, không giấu.** Ở `4.4` và `4.6` bản ghim **không**
  dịch `bhante`, nên bản chép nguyên của tôi cũng không có. Ở `4.3` và `4.8` bản ghim lại dịch (`bhante ānanda`
  → `Honorable Ānanda`). Hệ quả: trong chính đoạn Đức Thế Tôn kể lại, xưng hô **không đều** — có nơi có
  `venerable sir`, có nơi không. Tôi **cố ý** chịu điều đó: thêm `venerable sir` vào `4.4`/`4.6` sẽ khiến
  cùng một Pāli (`Pitā me, bhante, purāṇo …`) có hai bản dịch trong một bài, đúng cái bẫy luật này sinh ra để
  chặn. Sửa thì phải sửa tầng `english-sujato`, ngoài lát này.

  **`4.1` — chỗ tôi tự dịch và cần nói cách chọn.** `Idhāhaṁ, bhante` (= "idha ahaṁ") là cách mở lời kể
  "chuyện tôi đã làm là thế này", không phải `Atha kho āyasmā ānando` của `1.1`. Tôi dịch
  `This is what I did, venerable sir:` và giữ `;` của Pāli trước `upasaṅkamitvā`. `paññatte āsane` tôi dịch
  `sit down on the seat spread out`, y hệt `1.1` của bản ghim.

  **`4.10` — dấu câu phải khớp Pāli, nên trông hơi lạ.** Pāli là `‘evaṁ … byākatan’”ti.` tức **một** ngoặc
  mở và **hai** ngoặc đóng (lời Đức Thế Tôn lồng trong lời Đức Thế Tôn). Tôi viết
  `‘Yes, sister, but that’s how the Buddha declared it.’”` — cùng số ngoặc, và dấu `'` bên trong là
  dấu bỏ trong `that’s`, không phải ngoặc. Đã đo bằng bộ đo ngoặc của lớp lấp; nếu viết `“…”` thì số ngoặc
  đóng lệch Pāli và `validate` sẽ bắt.

  **Dấu lược:** **không** khoá Pāli nào trong mười khoá này mang `…pe…` hay `…` trần (đã đo), nên không
  khoá lấp nào được thêm dấu lược.

  **Khoá trống còn lại:** không có. Mười khoá lấp của lát này **là** toàn bộ phần Pāli có nội dung mà bản
  Anh đã ghim bỏ trống — đo bằng bộ đo coverage (≥40 ký tự, bỏ khối `:0`): 62 segment có nội dung, 10
  trống, sau khi publish là **0 trống ⇒ coverage 1.0**.

