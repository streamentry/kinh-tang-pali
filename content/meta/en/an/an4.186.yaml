notes: |-
  Sáu khoá này là ba câu hỏi của tỳ-kheo, được hỏi LẶP LẠI, mỗi câu hỏi gồm hai khoá: một câu
  định nghĩa và một câu hỏi "Kittāvatā … hotī?". Tôi chép nguyên văn bản đã ghim ở lần hỏi đầu:

  - `4.4` ← `3.2`, `4.5` ← `3.3`  (bahussuto dhammadharo)
  - `6.4` ← `5.2`, `6.5` ← `5.3`  (sutavā nibbedhikapañño)
  - `8.4` ← `7.2`, `8.5` ← `7.3`  (paṇḍito mahāpañño)

  Điều phải nói ra, và đây là lý do `ambiguity_integrity` hạ: PĀLI GỐC Ở BẢN LẶP CÓ DẤU NHÁY KHÔNG CÂN
  BẰNG, chứ không phải lớp lấp tự thêm bớt.

  Lần hỏi đầu: `3.2` mở bằng HAI dấu (`“‘`) và `3.3` đóng bằng MỘT (`”ti?`).
  Lần hỏi lại: `4.4` chỉ mở bằng MỘT dấu (`‘`) nhưng `4.5` lại đóng bẰNG HAI (`’”ti?`).
  Cùng kiểu lệch ở `6.4`/`6.5` và `8.4`/`8.5`. Nói cách khác: ở lần lặp, bản gốc đóng một dấu nháy mà
  không mở dấu nào tương ứng — đó là lỗi của bản gốc đã ghim, không phải lỗi dịch.

  Tôi chọn cách sửa là CHÉP Y HỆT `3.2`/`3.3` (mở `"`, khép `”` ở khoá sau). Như vậy cột Anh tự nhất quán
  trên ba vòng hỏi, và người đọc không thấy một dấu nháy "thừa". Tôi không sửa được bản gốc và cũng không
  muốn nhân bản lỗi của nó vào một tầng tham chiếu mới.

  Lưu ý thêm: Pāli ở `4.4` là `bahussuto dhammadharoti` (dấu `’ti` dính vào chữ cuối), còn ở `3.2` là
  `bahussuto dhammadharo’ti`. Chênh lệch đó cũng thuộc bản gốc; bản Anh không lệ theo vì hai bên cùng một câu.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm, nên đây KHÔNG phải một lớp đọc Anh độc lập. Tầng đối chiếu là Pāli đã ghim, các khoá còn lại của chính bản Anh đã ghim, và bản Việt dự án (do agent khác viết) chỉ để đối chiếu nghĩa.

  Lớp lấp: 6 khoá, tất cả đều nằm ở chỗ bản Anh đã ghim để trống. Không khoá nào là blockquote tham chiếu và không khoá nào có Pāli rỗng.

  Bài này còn 7 khoá mà bản Anh đã ghim để trống và lát này KHÔNG lấp, vì Pāli của chúng dưới 40 ký tự nên nằm ngoài ngưỡng đo coverage: `4.3`, `4.6`, `6.3`, `6.6`, `8.3`, `8.6`, `8.9`. Phần lớn là đuôi đoạn lược (`…pe…`, `Navamaṁ.`, `parinibbāyati.`) và bài thơ `udāna` cuối bài. Người đọc bốn cột VẪN thấy các ô này trống, và đó là đúng: một ô tham chiếu trống là lỗ hổng của bản dịch đó, khác với bản vắng mặt cả bài.

  Lớp lấp làm coverage English của bài này lên 100%. Trước lát này nó đã là 26/32 = 0.8125, tức đã trên ngưỡng 0.8, nên bài KHÔNG có record trong `content/meta/reference-gaps.yaml` và không sinh record thừa nào.
