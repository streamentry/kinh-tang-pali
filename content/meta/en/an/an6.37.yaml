notes: |-
  Tiền lệ: 5.5 trùng NGUYÊN VĂN 4.2, và 4.2 đã ghin trọn: "this is the extent of their
  overflowing merit, overflowing goodness that nurture happiness and is conducive to heaven,
  ripening in happiness and leading to heaven. And it leads to what is likable, desirable,
  agreeable, to welfare and happiness." Dùng lại nguyên văn, chỉ thêm cặp ngoặc `‘…’` mà
  Pāli 5.5 có và bản đã ghin ở 4.2 đã bỏ. 5.6 là vế kết của 4.3 ("It's simply reckoned as an
  incalculable, immeasurable, great mass of merit.") và 5.6 mang `”ti` nên đóng ngoặc kép.
  Cờ "lặp cụm, một từ ngăn: overflowing … overflowing" của rven88 là HỢP LỆ: Pāli lặp
  `puññābhisando kusalābhisando`, và đó là câu đã ghin ở 4.2 — bản dịch phải lặp theo.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
