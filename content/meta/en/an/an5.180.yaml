notes: |-
  Bốn nhóm khoá, đo bằng script trên đúng 26 khoá của lát (không suy đoán):

  A = 6 — Pāli trùng **byte** với một khoá đã có lời trong chính bài: `5.4` (trùng `4.4` và `8.2`),
  `5.6` (`4.6`, `8.4`), `5.7` (`4.7`), `6.6` (`4.6`, `8.4`), `6.7` (`4.7`), `6.14` (`5.14`).
  Trong sáu khoá này, **bốn** chép nguyên văn lời đã ghim (`5.4`, `5.7`, `6.7`, `6.14`).

  B = 4 — Pāli gần trùng khoá đã có lời:
  · `6.4` ← `4.4`/`8.2`: Pāli khác **đúng một mạo từ** (`amhākaṁ` bị tầng ghim nuốt ở `6.4`), nên tôi
    bỏ "our": "‘Master Gavesī is a helper, leader, and adviser,".
  · `5.8` ← khung của `4.8`, mệnh đề tuân thay bằng bộ từ đã có lời ở `5.14`.
  · `6.8` ← khung của `4.8`, mệnh đề tuân thay bằng bộ từ đã có lời ở `6.16`.
  · `9.5` ← vế cuối của `7.4`: đo token-LCS giữa vế cuối `7.4` và `9.5` = **0,875**, khác **đúng một
    từ** — động từ số ít `vihāsi` thành số nhiều `vihariṁsu`, vì chủ thể bây giờ là năm trăm vị tỳ-kheo.

  C = 16 — không khoá nào có lời để mượn, phải dựng từ Pāli: `5.5`, `5.11`, `5.12`, `5.13`, `6.5`,
  `6.11`, `6.12`, `6.13`, `6.15`, `10.5`, `10.6`, `11.0`–`11.4`.

  D = 0 — trong mỗi nhóm Pāli trùng byte ở bài này, các khoá đã có lời đều mang **cùng một** tiếng Anh
  (`4.4` = `8.2`; `4.6` = `8.4`), nên không có chỗ nào bắt buộc phải báo mà không tự ý hòa.

  **Năm cặp Pāli trùng byte nằm trong chính lớp lấp** (10 khoá), và tôi để mười giá trị ấy **giống hệt
  nhau**: `5.6`=`6.6`, `5.7`=`6.7`, `5.11`=`6.11`, `5.12`=`6.12`, `5.13`=`6.13`. Đây là vì sao `6.11`–`6.13`
  vẫn là C chứ không phải B: khoá anh em của chúng cũng trống, không có lời nào để mượn.

  **Đo cả hai cơ chế của mục 5d, kể cả khi ra 0.**
  A — cắt cụt dãy (≥ 4 khoá trống liên tiếp): **22 khoá / 1.165 ký tự Pāli**, bốn dãy:
  `5.4`–`5.8` (5), `6.4`–`6.8` (5), `6.11`–`6.15` (5), `10.5`–`11.4` (7). Hai dãy ngắn hơn ngưỡng:
  `5.11`–`5.13` (3) và `9.5` (1).
  B — bỏ dòng song song (thân từ ≥ 4 chữ lấy 4 chữ cuối, `|S(a)∩S(b)|/|S(a)| ≥ 0,70`, mỗi khoá đúng
  một nhóm): **15 khoá / 777 ký tự Pāli / 7 nhóm**; kiểm `kết quả ≤ số khoá trống` → 15 ≤ 26 đạt.
  ⚠ Báo trung thực: một trong bảy nhóm là **sai số của phép đo**, không phải dòng song song thật —
  nhóm `10.5` + `11.2` chỉ trùng vì thân từ 4 chữ cuối của `Dasamaṁ` và của `caṇḍālapañcamaṁ` đều là
  `amaṁ`. Nếu bỏ nhóm đó thì B = 13 khoá. Bốn nhóm còn lại (`5.4`+`6.4`, `5.7`+`6.7`, `5.11`+`6.11`,
  `5.12`+`6.12`+`6.14`) là dòng song song thật: đó đúng là các vòng lặp của cùng một ý.
  Nhóm `5.6`+`6.6` và `5.13`+`6.13` cũng thật.

  **Nhãn thứ tự — dò ở giá trị Pāli, không ở khoá.** `10.5` có giá trị `Dasamaṁ.` khớp
  `^(Paṭhama|…|Terasama)ṁ\.$` ⇒ điền `Tenth.`, theo khuôn **41/41** khoá nhãn đã có trong tầng lấp
  (đo lại: 41 khớp, 0 lệch, 4 khoá không tra được Pāli trong cache). Tầng Anh đã ghim có lời ở nhãn thứ
  tự: **0** — khớp với con số 0,00% đo toàn tầng.
  ⚠ Cảnh báo theo yêu cầu: **không cần bỏ nhãn nào**, và có bằng chứng nội bộ rằng nhãn khớp danh sách:
  `Dasamaṁ` là bài thứ mười của `Upāsakavagga`, mà `11.1`–`11.4` (uddāna) liệt **đúng mười** tên
  (`Sārajja·Visārado·Niraya`, `Vera·Caṇḍāla`, `Pīti·Vaṇijjā·Rājāno`, `Gihī·Gavesin`) — mười tên ấy là
  `an5.171`–`an5.180` theo đúng tiêu đề `0.3` mà tầng ghim đã dịch. Nên "Thứ mười" ở đây là số thứ tự
  **trong phẩm**, không phải trong cả Tăng Chi Bộ; tôi ghi rõ để không ai đọc nhầm.

  **Dấu lược:** **0** trong 26 khoá Pāli của lát có `…pe…` hay `…` trần ⇒ **không** khoá lấp nào được
  thêm `…` (đếm: 0/26). Ngược lại, tầng ghim đã tự thêm lược ở `5.3` và `6.3` ("did the same. …") nơi Pāli
  viết đủ; đó là lỗi tầng ghim, tôi không chép.

  **Dấu nháy — đo cả hai số như yêu cầu, và nói rõ chỗ tôi cố ý lệch.**
  Cách đếm dấu nhạt lượu: `’` có chữ thường đứng ngay sau là dấu nhạt lượu (`’s ’t ’re ’ve ’ll ’d ’m`),
  không có là nháy đóng. Tự đo lại trên **toàn tầng lấp**: `’` tổng **1.428**; có chữ thường đứng sau
  **894**; trong đúng bảy hậu ngữ **893**; ngoại lệ duy nhất `’ti` **1** — đúng là ngoại lệ đã ghi.
  ⚠ Bẫy mới đo được ở lát này: dạng `’ti` **không phân biệt được bằng mã ký tự**. Ở `5.8`/`6.8` nó là
  **nháy đóng + `ti`** (`gāmadhammā’ti.`, sau danh từ, đối chiếu `dhārethā’ti` ở `4.2`), còn ở `5.6`/`6.6` nó là
  **dấu lược của `mayam`** trong `mayan’ti.` — sau đại từ tân thi. Cùng một codepoint, hai nghĩa. Nên phép đo
  phải đọc chữ, không được chạy máy: chạy máy ra **4** khoá "lệch", trong đó **2** là lệch giả
  (`5.8`/`6.8`), và chỉ **2** là lệch thật (`5.6`/`6.6`, xem dưới). Đọc bằng chữ: **26/26 khoá khớp Pāli
  từng khoá**, lệch **0**.
  Nhưng hai khoá `5.6`/`6.6` tôi **cố ý lệch tầng ghim**: Pāli chúng trùng byte `4.6`/`8.4`, mà tầng ghim
  ở hai khoá kia đóng nháy (`…the same?’`) trong khi Pāli `Kimaṅgaṁ pana mayan’ti.` **không** có nháy nào
  (`’` ở đây là lược của `mayam`+`ti`). Tôi theo Pāli nên hai khoá này mất đúng **một** dấu `’` so với bản
  ghim, đổi lại không sinh nháy nào mà Pāli không có. Hệ quả phải nói thẳng: cột Anh ở `4.6` và `8.4` đóng
  ngoặc còn ở `5.6`/`6.6` thì không — sửa hai khoá kia thuộc tầng `english-sujato`, không thuộc lát này.

  **Một hệ quả còn lại mà lớp lấp không sửa được, nói rõ:** tầng ghim đặt câu "They lived having achieved…"
  vào `9.4` và để trống `9.5`, nên câu ấy hiện xuất hiện hai lần trong cột Anh (`9.4` và `9.5` của lớp lấp).
  Tương tự, `5.14`/`6.14` của tầng ghim mở đầu bằng vế ("are chaste, set apart…") nối từ `5.10`/`6.10`
  vốn đã bị tầng ghim rút gọn thành "These five hundred lay followers …"; khoá `5.13`/`6.13` của lớp lấp nằm
  giữa nên vế mở đầu ấy không còn tiền đối chiếu ngay. Tôi giữ `5.13`/`6.13` là câu trọn vẹn
  ("I am chaste, set apart, refraining from the vulgar act of sex.") thay vì bịa một chủ ngữ cho vế của tầng
  ghim — bịa thì sẽ vi phạm luật chỉ dựng từ Pāli.

  **Bảng thuật ngữ — mượn nguyên bộ từ của tầng ghim, không tự chế:** `sīlesu paripūrakārī` → "fulfilled the
  precepts" (theo `4.2`/`4.8`); `brahmacārī ārācārī virato methunā gāmadhammā` → "chaste, set apart,
  refraining from the vulgar act of sex" (theo `5.2`/`5.14`); `ekabhattiko rattūparato virato
  vikālabhojanā` → "eats in one part of the day, abstaining from eating at night, and food at the wrong
  time" (theo `6.2`/`6.16`); `ayyo` → "Master" (theo `4.4`/`8.2`/`4.8`); `bhavissati` → "will be" (theo `4.5`).
  `11.0` `Tassuddānaṁ` → "Its summary verse:" và `10.6` `Upāsakavaggo tatiyo.` → "The Lay Follower chapter,
  the third." theo đúng hai khuôn đã có trong tầng lấp (`an10.50`, `an3.70`, `an7.43`). Mười tên trong uddāna
  lấy từ tiêu đề `0.3` mà tầng ghim đã dịch, để cột Anh tự nhất quán với chính danh sách bài trong phẩm.

