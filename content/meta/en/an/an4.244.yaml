notes: |-
  an4.244 là bài thứ tư của `Āpattibhayavagga`, và cấu trúc của nó là **một** hình thứ lặp
  bốn lần: mỗi khoản kể một hình thức trừng phạt, cho một người "đóng vai" tội nhân ra
  tỏ lời trước đám đông, rồi có **người đứng đường** (`Tatraññatarassa thalaṭṭhassa
  purisassa`, Pāli trùng byte ở `1.9`/`2.3`/`3.4`/`4.4`) đọc lại đúng những gì vừa được nói.
  Bốn khoản lần theo thứ tự `pārājika` → `saṅghādisesa` → `pācittiya` → `pāṭidesanīya`.

  Sujato dịch **mỗi khoản một lần** (lời người tội nhân ở `2.2`, `3.2`+`3.3`, `4.2`+`4.3`;
  lời người đứng đường ở `2.4`, `3.5`, `4.5`) rồi **bỏ trống** đúng lần đọc lại: chín khoá
  của lát này. Bản lấp không dịch mới chuyện nào; nó **dựng lại** lần đọc lại từ lời đã ghim.

  **Bốn số phân loại (đo bằng phép so chuỗi trên Pāli từng khoá): A=0 · B=9 · C=1 · D=0.**
  - **A = 0.** Quét cả 47 khoá tìm cặp Pāli trùng byte *mà một bên là khoá lấp*: chỉ ra
    **một** cặp, `3.8` ≡ `4.8` (cả hai đều là khoá lấp). Không có khoá lấp nào trùng byte
    với một khoá **đã có lời**, nên không có khoá nào bắt buộc chép y nguyên.
  - **B = 9.** Tỉ lệ khớp đo được với khoá nguồn đã có lời:
    `2.6`←`2.2` 0,980 · `3.7`←`3.2` 0,963 · `4.7`←`4.2` 0,962 · `3.8`←`3.3` 0,957 ·
    `4.8`←`3.3` 0,957 · `1.11`←`1.8` 0,938 · `3.6`←`3.1` 0,849 · `2.5`←`2.1` 0,845 ·
    `4.6`←`4.1` 0,806.
  - **C = 1.** `4.12` = `Dutiyaṁ.` — không có lời nào ở tầng để dựng lại.
  - **D = 0.** Không có cặp Pāli trùng byte nào mà lời tầng **khác** nhau.

  **Nhóm B — khoá nguồn, tỉ lệ khớp, và phần tầng đã ghim nuốt mất mà lớp lấp chèn lại:**
  - `1.11` ← `1.8` (0,938): Pāli `1.8` lặp **nguyên** danh sách hình phạt của `1.7`, nhưng
    Sujato **nén** `1.8` còn *"The king’s men would do as they were told."* (42 ký tự cho
    239 ký tự Pāli). Danh sách vì thế chỉ còn trong tiếng Anh ở `1.7`, và ở thế **mệnh lệnh**.
    Lớp lấp chèn lại toàn bộ danh sách ở `1.11` (281 ký tự), giữ **nguyên thứ tự sáu hành
    động** của Pāli và chỉ đổi đúng hai chỗ: mệnh lệnh → chủ ngữ ngôi thứ ba, và bỏ chữ
    *"Then"* — Pāli `1.11` không có từ nối ở đó (`1.7` thì có).
  - `2.5`←`2.1` (0,845), `3.6`←`3.1` (0,849), `4.6`←`4.1` (0,806): `Yatra hi nāma` mở khung
    *"For it’s certainly …"* cho **cả bốn** khoá lấp (kể cả `1.11`), và phần thân dựng lại
    từ `2.1`/`3.1`/`4.1` — *"put on a black cloth, messed up his hair, put a club / a sack of
    ashes on his shoulder, approached the large crowd, and says:"*. Cả ba chuyển `"mess up … and
    put …"` (nguyên văn hai câu của bản ghim) thành một danh sách phân từ quá khứ vì Pāli
    `2.5`/`3.6`/`4.6` là **một** câu kết bằng `evaṁ vakkhati`. `4.6` không có món thứ ba vì
    `4.1` cũng không.
  - `2.6`←`2.2` (0,980), `3.7`←`3.2` (0,963), `4.7`←`4.2` (0,962): phần *"‘Sirs, I’ve done a
    bad and reprehensible deed, deserving of …’"* chép theo bản ghim, kèm dấu chấm câu
    theo Pāli (`;` ở `3.7`/`4.7`).
  - `3.8`←`3.3` (0,957) và `4.8`←`3.3` (0,957): **đây là chỗ tôi cố ý lệch** (xem dưới).

  🔴 **Một chỗ tôi cố ý lệch tầng Anh đã ghim, và lý do.** Pāli của `2.6`, `3.8`, `4.8`
  kết bằng `yena me āyasmanto attamanā honti taṁ karomī` — *"điều gì làm các đồng tu môn
  hài lòng thì ta làm điều đó"*. Bản ghim dịch vế đó thành *"I submit to your pleasure."*
  (`2.2`, `3.3`, `4.3`) — tức là **câu khác**: đó là cách Sujato dịch công thức
  `yena maṁ bhañjeyyanti`, công thức **vắng mặt** ở ba khoá Pāli này. Nếu chép y nguyên thì
  các khoá lấp **không** dịch vế `attamanā honti taṁ karomī` — mà đó mới là chỗ biến thiên
  của phần tứ trong bốn hình thức: mỗi khoản khác nhau ở hình phạt, và vế này là chỗ buộc
  hình phạt vào hành động. Tôi dịch thẳng: **"I do whatever makes my fellow monks happy."**
  Hệ quả phải nói ra: cột Anh của bài này giờ đọc *"I submit to your pleasure."* ở `2.2`/
  `3.3`/`4.3` và *"I do whatever makes my fellow monks happy."* ở `2.6`/`3.8`/`4.8` cho cùng
  một vế Pāli. Tôi **không sửa** ba khoá đã ghim. Về `āyasmanto` thì Sujato dùng *"venerables"*
  ở 41 chỗ trong tầng `an`, nhưng ở đây `me āyasmanto` là **ngôi thứ nhất** đang nói với
  chính những người đó, nên *"my fellow monks"* mới đúng thanh và tự đứng được.

  **Ngoặc kép — đây là phần tôi dựng lại, và nó là lý do lớn nhất của lát này.** Pāli của
  `2.6`, `3.7`, `4.7` mở **ngoặc kép `“`** chứ không phải ngoặc đơn `‘` như `2.2`, `3.2`,
  `4.2`; `2.6` đóng ngay tại nó, `3.7`/`4.7` đóng ở `3.8`/`4.8`. Đây là **ngoặc kép lồng
  nhau có lý do**: ngoặc đơn bên ngoài là lời người đứng đường (`2.4`, `3.5`, `4.5` mở;
  `2.7`, `3.9`, `4.9` đóng — toàn bộ bốn khoá mở và bốn khoá đóng **đều do bản ghim viết**),
  còn ngoặc kép bên trong là lời người tội nhân được dẫn lại. Vì bản ghim để trống đúng
  `2.6`, `3.7`, `3.8`, `4.7`, `4.8`, nên nếu không lấp thì **không có cặp `“…”` nào còn
  lại** và các ngoặc đơn bên ngoài sẽ thành ngoặc mở không đóng. Sau khi ghép hai tầng:
  Pāli `“` 4 / `”` 4 và cột Anh `“` 4 / `”` 4; ngoặc đơn 9/9 ở cả hai, và **danh sách vị trí
  đóng-mở theo khoá khớp Pāli từng khoá một** (18 dấu). Đây là điều kiện đúng của luật 2.3
  (*khớp Pāli từng khoá*), không phải *mỗi khoá tự cân*.

  **Dấu lược:** quét cả 47 khoá — Pāli của an4.244 có **0** `…pe…` và **0** `…` trần, nên
  **không** khoá lấp nào được thêm dấu lược. Ngược lại, bản ghim **bịa** `…` ở **3** khoá
  (`2.4`, `3.5`, `4.5`) nơi Pāli viết đủ (`…gārayhaṁ mosallaṁ.`). Tôi **không sửa** vì sửa
  là shadow; tôi cũng **không** mang dấu lược ấy sang khoá của mình.

  **Lát đã chốt: bỏ trống `4.12` (`Dutiyaṁ.`, 8 ký tự)** ⇒ `fillableSegments` gồm 10 khoá,
  lát ghi **9**. Nó là dấu hiệu bài lặp, **dưới ngưỡng 40 ký tự** nên không bao giờ vào
  coverage, và tầng Anh đã ghim bỏ trống **mọi** `Paṭhamaṁ.`/`Dutiyaṁ.` (như
  `source/layers.yaml` ghi). Đo toàn lớp lấp hiện có: **2.305** khoá trống còn bỏ lại so với
  **48** khoá dưới ngưỡng mà vẫn được ghi, và trong số 48 khoá đã ghi có những cặp kiểu
  `an10.212:4.12` (`Dutiyaṁ.`) bị **bỏ** — tức quy ước chủ đạo của lớp này là bỏ khoá dưới
  ngưỡng, và lát này đi theo đa số ấy.
