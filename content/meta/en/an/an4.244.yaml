  ⚠ **Hai bất định của Pāli mà tôi KHÔNG tự phân xử, chỉ ghi nhận:**
  1. `kāḷavatthaṁ paridhāya` (`2.1`/`2.5`/`3.1`/`3.6`/`4.1`/`4.6`). Cả hai tầng tham khảo
     đọc là *"put on a black cloth"* và tôi giữ nguyên để bài không tự mâu thuẫn; nhưng
     `kāḷavattha` cũng là tên **hình phạt** và là **cái đe** của thợ rèn, `paridhāya` là
     *"hâm nóng"*. Nếu đọc theo nghĩa thứ hai thì người tội nhân **đóng vai cái đe** chứ
     không đóng vai kẻ bị đánh — tức cả hình thức của ẩn dụ đổi chiều. Người đọc cột Anh
     sẽ không thấy điều đó, nên đây là điểm cần người biên tập quyết.
  2. `musalaṁ/bhasmapuṭaṁ khandhe āropetvā` (`2.5`, `3.6`). Cả hai tầng tham khảo đọc là
     *"on his shoulder"* (Việt: *"vác… trên vai"*), tôi giữ theo đó cho khớp `2.1`/`3.1`;
     nhưng `khandha` cũng có nghĩa **"tay"**, và `āropetvā` là *"đặt vào"*. Bản Việt
     canonical đi theo tầng Anh ở cả hai chỗ.
  Cả hai là chỗ **hai tầng tham khảo cùng một cách**, không phải chỗ tôi chọn khác họ.

  **Một lỗi khác của tầng đã ghim, đếm được, không sửa được:** `3.10` và `4.10` có Pāli
  **khác nhau** (`pācittiyesu`/`pācittiyaṁ` vs `pāṭidesanīyesu`/`pāṭidesanīyaṁ`) nhưng Sujato
  cho **cùng một lời** — *"confessable offenses"* cho cả hai. Bản Việt canonical phân biệt
  (`PĀCITTIYA` / `PĀṬIDESANĪYA`), nên đây là tầng Anh làm phẳng mất một phân biệt pháp luật
  mà Pāli nói rõ. Cùng kiểu, `1.8` bị nén 239→42 ký tự như đã nêu.

