notes: |-
  1.4 reuses 1.3 verbatim ("... for his own ruin and downfall."): Sujato
    renders even the single term attavadhāya with the full doublet, and the list
    rule says a parallel line the pinned edition already translated keeps its
    wording, so parābhavāya alone is not re-split here ("ruin and downfall" 8x;
    "own downfall" 0x, so splitting would be invention). 2.2/3.2/4.2 reuse 5.2
    verbatim. The doublet flattening is Sujato's own, recorded here rather than
    fixed, hence terminology 9.3 and ambiguity 9.3.
    Triangulation is capped at 8.0 for every text of the fill layer.
