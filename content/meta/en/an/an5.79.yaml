notes: |-
  Năm khoá (2.13, 3.12, 4.7, 5.8, 6.9) có Pāli **giống hệt nhau**:
  `paṭibujjhitvā ca tassa pahānāya vāyamitabbaṁ.`

  Tiền lệ rất chặt, ngay trong chính bài này: `an5.79:1.3` và `an5.79:7.3` đã ghim
  cùng mẫu câu với `tesaṁ` (số nhiều) là "and try to give them up." Mười khoá của tôi
  là `tassa` (số ít, trỏ `taṁ`), nên chỉ đổi "them" → "it", còn bộ từ "and try to
  give … up" giữ nguyên. `an5.80` dùng đúng cùng khuôn và cho cùng kết quả.

  `paṭibujjhitvā ca` ("đã thấy trước") bị Sujato nén thành "and try to", vì vế trước
  `Taṁ vo paṭibujjhitabbaṁ;` đã nói "look out for". Tôi giữ đúng cách nén ấy để hai
  bài không tự mâu thuẫn.

  Phụ thuộc cần nói rõ: năm vế trước (`2.12`, `3.11`, `4.6`, `5.7`, `6.8` —
  `Taṁ vo paṭibujjhitabbaṁ;`) đang trống ở **cả hai** tầng, tức là thuộc lát khác.
  Nếu lát đó dịch "You should look out for it;" thì đọc nối với "and try to give it
  up." là đúng; nếu họ dịch khác thì vế của tôi vẫn đúng vì nó tự đứng vững.

  Lớp lấp: 5 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn
  bị mất.