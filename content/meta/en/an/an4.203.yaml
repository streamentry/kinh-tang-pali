  **Chỗ lớp lấp CỐ Ý lệch tầng Anh đã ghim, kèm lý do.** (1) Sáu khoá nhóm B tách vế theo **ranh giới khoá Pāli**, nên người đọc bốn cột sẽ thấy nội dung của `3.3`–`3.8` in **hai lần**: một lần dồn trong lời `3.2`, một lần ở lớp lấp. Lặp ấy là do tầng đã ghim nói trước; giữ đúng một vế mỗi khoá là giữ đúng Pāli, và tôi không thể sửa tầng đã ghim. (2) Lời `3.2` của tầng đã ghim bỏ mất cặp chủ thể–đối tượng ở mục đầu tiên: Pāli `attanā ca pāṇātipātī hoti, parañca pāṇātipāte samādapeti` là “tự mình … và khuyến khích người khác”, còn lời ghim chỉ còn “It's someone who kills living creatures … And they encourage others”. Lớp lấp không sửa được `3.2`; nó giữ cấu trúc “And they …” ở sáu khoá sau để cặp tự–khác của chính Pāli ấy còn đọc được. (3) Trong khối `3.x`, lớp lấp **không** làm đồng nhất ba khung: `3.3`/`3.5` dùng động từ (“steal”, “lie”), `3.4` dùng danh từ hoạt động (“engage in sexual misconduct”), `3.6`–`3.8` dùng “use … speech”. Lý do: ba khoá đầu lấy **nguyên văn** từ bài anh em cùng Pāli nên không được đổi, còn ba khoá sau không có Pāli nào cho phép đổi — đây là hệ quả đo được của luật dùng lại nguyên văn, tôi để nguyên và nói ra thay vì hòa. (4) Khối `5.x` kết mỗi khoá bằng “refrain from it” trừ `5.3` lặp đủ cụm, vì `5.3` là mục đầu tiên của khối và câu chưa có danh sách nào; cũng là nguyên văn từ bài anh em.

