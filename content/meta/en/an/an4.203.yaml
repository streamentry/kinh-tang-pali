notes: |-
  **Bốn số phân loại 13 khoá.** A nguyên văn **cùng bài** = **0** · A′ nguyên văn **bài khác trong tầng**, dùng lại nguyên văn lời = **7** · B gần trùng, dựng lại từ lời một khoá trong cùng bài = **6** · C tự dịch từ Pāli không có lời nào ở đâu = **0** · D cùng Pāli mà lời tầng khác nhau = **0**. Tổng 0 + 7 + 6 + 0 + 0 = **13**, khớp số khoá tầng Anh đã ghim để trống ở bài này (đo trên toàn bộ 30 khoá Pāli, không phải trên danh sách lát).

  **Nhóm A′ — 7 khoá dùng lại nguyên văn lời đã có, đo được bằng chỉ mục Pāli→English dựng trên toàn tầng Anh đã ghim cộng lớp lấp `published`.** Sáu khoá có Pāli **trùng từng ký tự** với bài anh em cùng loạt: `3.3`→`an4.201:3.3`, `3.4`→`an4.201:3.4`, `3.5`→`an4.201:3.5`, `5.3`→`an4.201:5.3`, `5.4`→`an4.201:5.4`, `5.5`→`an4.201:5.5` — cùng khuôn “`attanā ca … hoti, parañca … samādapeti`”, cùng tỉ lệ khớp **1,0000** (đo bằng so khớp ký tự). Lớp lấp chép **nguyên văn** sáu lời ấy, không dịch lại: “And they steal, and encourage others to steal; ”, “And they engage in sexual misconduct, and encourage others to do the same; ”, “And they lie, and encourage others to lie; ”, “And they refrain from stealing, and encourage others to refrain from stealing; ”, “And they refrain from sexual misconduct, and encourage others to refrain from it; ”, “And they refrain from lying, and encourage others to refrain from it; ”. Khoá thứ bảy là `5.10` (`Tatiyaṁ.`): hai nơi khác trong tầng đã có lời cho **cùng Pāli này** và **cùng một lời** — “Third.” — nên lấp “Third.”.

  **Nhóm B — 6 khoá dựng lại từ lời khoá liền trước trong cùng bài, có tỉ lệ khớp đo được và phần phải chèn lại.** Nguồn là hai khoá mà tầng đã ghim đã **nuốt** nội dung của sáu khoá này:
  · `3.6` (0,6207 so với `3.2`) · `3.7` (0,5986) · `3.8` (0,6164) — dựng từ lời `3.2`
  · `5.6` (0,7216 so với `5.2`) · `5.7` (0,6939) · `5.8` (0,7053) — dựng từ lời `5.2`
  **Phần tầng đã ghim nuốt mất** là chính sáu vế `attanā ca …, parañca …` ấy: lời `3.2` viết “It's someone who kills living creatures, steals, commits sexual misconduct, and uses speech that's false, backbiting, harsh, or nonsensical. And they encourage others to do these things.” — tức lời `3.2` đã in ra **cả sáu mục** của `3.3`–`3.8` rồi để trống sáu khoá ấy; lời `5.2` làm đúng như vậy với `5.3`–`5.8`. Lớp lấp chèn lại **đúng một vế mỗi khoá**, giữ nguyên ba từ của tầng đã ghim — “backbiting”, “harsh”, “nonsensical” — và giữ nguyên khung “encourage others to do these things” / “encourage others to refrain from these things” mà tầng đã ghim dùng ở `3.2`/`5.2`. Riêng sáu khoá này Pāli **không có động từ** (`pisuṇavāco`, `pharusavāco`, `samphappalāpī`, `pisuṇāya vācāya`, `pharusāya vācāya`, `samphappalāpā` đều là danh từ/tính từ), nên lớp lấp phải chọn động từ; chọn “use … speech” / “refrain from … speech” là để **giữ nguyên tính từ của tầng đã ghim** và không tự đặt từ mới.

  **Đếm cặp Pāli trùng.** Chỉ mục Pāli→English dựng trên toàn tầng Anh đã ghim cộng 660 tệp lấp `published` cho **87.682** chuỗi Pāli khác nhau có lời, trong đó **15.792** chuỗi được nhiều hơn một khoá mang, tổng **137.902** cặp. Bên trong `an4.203` **không có** Pāli trùng nguyên văn giữa hai khoá nào (0/30), nên không có nguy cơ bài tự mâu thuẫn và cổng “lấp lại lời đã có trong cùng bài” không bắn. Trong số 13 khoá lấp, **7** khoá trùng nguyên văn với bài khác và đã dùng lại nguyên văn; **6** khoá còn lại không trùng chỗ nào.

  **Nhãn thứ tự `5.10` — đo trước khi điền, và lý do không bỏ.** Tầng Anh đã ghim bỏ trống **mọi** nhãn thứ tự: quét toàn bộ bộ `an` trong tầng đã ghim cho thấy **0** khoá nào dịch một nhãn thứ tự đứng một mình. Đó là quy ước của tầng đã ghim, không phải luật của lớp lấp, nên `5.10` được điền. Ba lý do đo được: (1) quét lớp lấp `published` cho thấy cặp Pāli→English của nhãn thứ tự **nhất quán 1:1** — `Paṭhamaṁ.`→“First.” (4), `Tatiyaṁ.`→“Third.” (3), `Aṭṭhamaṁ.`→“Eighth.” (3), `Catutthaṁ.`→“Fourth.” (3), `Dasamaṁ.`→“Tenth.” (2), `Sattamaṁ.`→“Seventh.” (2), `Pañcamaṁ.`→“Fifth.” (2), `Chaṭṭhaṁ.`→“Sixth.”, `Dutiyaṁ.`→“Second.”, `Dvādasamaṁ.`→“Twelfth.”, `Ekādasamaṁ.`→“Eleventh.”, **không có cách viết nào khác**; (2) `Tatiyaṁ.` đúng là nhãn thứ ba của **loạt bốn bài liền nhau** đo được từ Pāli: `an4.201` mang `Paṭhamaṁ.`, `an4.202` mang `Dutiyaṁ.`, bài này mang `Tatiyaṁ.`, `an4.204` mang `Catutthaṁ.`; (3) hai nơi khác trong tầng đã có lời “Third.” cho **đúng Pāli này** và dùng y hệt. Khuôn lấy: “Third.” — không kèm dấu chấm kép, không giãi dòng. `5.10` dài **8** ký tự nên **không** vào mẫu số coverage, tức lấp nó không nâng tỷ số; nó vẫn được lấp vì để trống thì cột Anh hụt nhãn khối.

  **Dấu lược: 0.** Quét cả 30 khoá của `an4.203` cho thấy **13/13** khoá trong lát này Pāli có **0** dấu `…` và **0** dấu nháy, nên lớp lấp ghi **0** dấu lược — không mở rộng, không bịa. (Dấu lược duy nhất của cả bài nằm ở `1.2`, không thuộc lát này: xem mục lỗi tầng đã ghim bên dưới.) Ngoặc kép: không khoá lấp nào có nháy nên không có gì để cân; 13/13 khớp Pāli (0/0).

  **Số khoá đã ghi: 13/13. Số khoá trống còn lại của bài: 0.** Bài này không còn khoá trống nào. Năm khoá dưới ngưỡng 40 ký tự (không vào coverage) là `2.1` (34), `2.3` (36), `4.3` (35), `4.1` (32) — bốn khoá này tầng đã ghim **đã có lời**, không phải chỗ trống; và `5.10` (8) đã lấp ở trên.

  **Coverage đo lại bằng đúng phép của kho.** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự sau khi gộp khoảng trắng, bỏ khối `:0`) = **22**; khối `:0` chỉ có 3 khoá tiêu đề. Trước lớp lấp: `english-sujato` phủ **10/22 = 0,4545**; `english-project` **không** tính vì chưa `published`. Sau khi `published`: **22/22 = 1,0000**. **Độ nhạy:** ngưỡng 0,8 với mẫu số 22 cần ≥ **18** khoá có chữ, tức còn thiếu **8** trong 12 lỗ; lấp 8 khoá có nội dung là 18/22 = **0,8182** (đạt), lấp 7 là 17/22 = **0,7727** (không đạt). Lớp lấp này lấp đủ 12 nên vượt ngưỡng. Cả 12 khoá còn lại đều là cùng một cơ chế: tầng đã ghim gộp chúng vào khoá trước.

