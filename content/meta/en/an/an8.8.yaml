notes: |-
  **Phân loại 27 khoá (đo bằng máy, mỗi khoá một nhóm): A y nguyên = 22 · B dựng lại = 1 · C tự dịch = 3 · D (Pāli trùng, lời Anh của tầng đã ghim khác nhau) = 1.** Đã ghi 27/27 khoá `fillableSegments` của bài (9 khoá có nội dung ≥ 40 ký tự Pāli, 18 khoá ngắn hơn ngưỡng). Số khoá Sujato để trống mà lát **không** lấp: 0.

  **Nhóm 1 — `2.3`–`2.6` (4 khoá), dùng lại nguyên văn `1.3`–`1.6`.** Vessavaṇa nghe lại đúng bốn câu mà
  Uttara đã nói với các tỳ-kheo ở `1.3`–`1.6`; tầng đã ghim chỉ viết ở `2.2` “He heard Venerable Uttara teaching this
  to the mendicants” và bỏ bốn khoá lời. Lấy nguyên bốn câu Sujato ở `1.3`–`1.6` (kể cả “Mendicants,” ở đầu `1.3`
  và dấu “ … ” ở hai đầu, khớp dấu của Pāli `2.3` và `2.6`). **`2.3` là nhóm D**: Pāli của `2.3` trùng với cả `1.3`,
  `3.5` và `5.2`, mà ba lời Anh khác nhau (`1.3` là lời nói trực tiếp, `3.5` và `5.2` là câu trích trong lời kể, có
  dấu lược và có ‘ mở). Chọn `1.3` vì cùng lời nói, cùng người nghe (các tỳ-kheo) và cùng dấu “ mở.
  **Nhóm 2 — bảy khoá `10.2`–`10.8`, `11.3`–`11.7` và bảy khoá `11.10`–`11.16`**: các vế lặp “loss … fame … disgrace …
  honor … dishonor … corrupt wishes … bad friendship” đã có ở `9.2`–`9.8` (cùng Pāli, cùng lời). Dùng lại nguyên văn.
  Hai sai biệt dấu câu, ghi thẳng: `10.8` là **câu hỏi** (Pāli kết bằng `?`) nên “bad friendship?” thay cho “bad friendship.”
  của `9.8`; còn `11.16` giữ dấu chấm như `9.8`.
  **`11.2`** (`Yaṁ hissa, bhikkhave, uppannaṁ alābhaṁ …pe…`): chỉ lấy vế “loss …”, vì `Yaṁ hissa, bhikkhave, uppannaṁ`
  đã nằm trong lời `11.1` của tầng đã ghim.
  **`11.8` (nhóm B, 0,87 với `11.1`)**: khoá này gồm vế “bad friendship” + cả vế điều kiện “anabhibhuyya viharato … na honti”.
  Tầng đã ghim ở `11.1` gộp vế ấy vào một câu cho “these eight things”. Bản lấp dùng lại đúng khung `11.1` (“the distressing and
  feverish defilements that might arise in someone who lives without overcoming … do not arise when they have overcome …”),
  chỉ thay đối tượng bằng “it” (= bad friendship) và nối bằng dấu phẩy sau “bad friendship”, vì khoá `11.7` ngay trước
  kết bằng “corrupt wishes …”.
  **`13.3`** (tự dịch): `Nāyaṁ dhammapariyāyo kismiñci upaṭṭhito.` → “This exposition of the teaching is not established in any of
  them.” — tầng đã ghim ở `13.1` đã gộp “not established anywhere in the four assemblies—” vào khoá đầu và để `13.3` trống;
  `kismiñci` là “in any (of them)” nên chọn “in any of them” để không lặp “anywhere in the four assemblies”. **`13.8`** nhãn thứ tự
  `Aṭṭhamaṁ.` → “Eighth.”.

  Bảng B theo máy (khoá lấp←khoá nguồn, tỉ lệ khớp Pāli): `11.8`←`11.1` 0,87.
