notes: |-
  **Phân loại 21 khoá (đo bằng script trên Pāli đã ghim, khớp ≥ 0,80 sau chuẩn hoá là B): A = 5 · B = 10 · C = 6
  · D = 0.** 5/21 khoá lớp lấp trùng nguyên văn một lời đã ghim của cùng bài.

  **Bối cảnh.** Ở `5.2` tầng đã ghim tóm “told him what had happened, adding:” và bỏ toàn bộ lời Tôn giả
  Anuruddha thuật lại (`6.1`–`9.1`), vốn lặp `1.2`–`5.1` ở ngôi thứ nhất có `bhante`. Lớp lấp dịch đủ theo Pāli,
  nên sau câu tóm tắt ấy người đọc gặp lại câu chuyện — đúng như Pāli.

  **Nhóm A (5 khoá).** `6.4`/`6.5`/`6.6` = `1.5`/`1.6`/`1.7`; `8.2`/`8.3` = `4.2`/`4.3`.

  **Nhóm B (10 khoá, khớp 0,87–1,00).** `6.3`/`6.7` (1,00 với `1.4`/`1.8`; ngoặc đơn vì nằm trong lời thuật);
  `6.9` (1,00 với `2.2`); `6.10`/`7.5` (0,87–0,88 với `2.3`/`3.5`, đổi “Anuruddha’s” → “my”, thêm “sir”);
  `7.2`/`7.4` (1,00 với `3.2`/`3.4`); `7.3` (0,93); `8.1` (0,95 với `4.1`); `9.1` (0,95 với `5.1`, ngoặc đơn).

  **Nhóm C (6 khoá).** `6.1`, `6.2`, `6.8`, `7.1`, `8.4`, và nhãn thứ tự `22.5` `Chaṭṭhaṁ.` → “Sixth.” (khuôn
  nhãn của lớp lấp; `an8.46` là bài thứ sáu của phẩm Uposatha, khớp nhãn).

  **Cố ý lệch tầng đã ghim.** (1) `6.3`/`6.7` viết “deities of the Agreeable Host” (chữ của `1.3`) thay vì “the
  deities called ‘Agreeable’” của `1.4`/`1.8`, vì Pāli không có ngoặc ở đó và trong lời thuật ngoặc đơn đã dùng
  cho lời chư thiên. (2) `7.4`: tầng đã ghim ở `3.4` tự thêm `…` (“would all turn white …”) dù Pāli viết đủ
  `odātavaṇṇā odātavatthā odātālaṅkārā`; lớp lấp dịch đủ và không đặt `…`. (3) `6.10`/`7.5` giữ cách tầng đã
  ghim rút gọn ở `2.3`/`3.5` (“all turned blue/white”) để hai lời kể song song đọc giống nhau.

  **Nhóm D: 0.**

  **Dấu và ngoặc (kiểm bằng script, từng khoá).** `…pe…` = đúng một `…`; số `“ ” ‘` và `’` đóng (không kể `’` +
  chữ thường) của lớp lấp khớp Pāli ở 21/21 khoá. NFC, không khoá rỗng, mọi khoá ⊆ `fillableSegments`, không
  khoá nào trùng khoá đã ghim có chữ. Pāli trùng nguyên văn trong bài ⇒ English trùng (kể cả lời đã ghim): đạt.

  **Đo nguyên nhân khoá trống.** Tầng đã ghim để trống 21 khoá (không tính `:0`) — đúng bằng số khoá của lát,
  nên sau lát này bài **không còn khoá trống nào** ngoài khối `:0`. Cắt cụt dãy (≥ 4 khoá trống liền nhau): 1
  dãy / 20 khoá / 1577 ký tự Pāli. Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 10 khoá (≤ 21).
  Ngoài hai phép trên, cơ chế thấy rõ khi đọc là **tóm tắt nội dung** vào một khoá đã ghim (nêu ở trên) — phép
  đo thân từ không bắt được nó.

  Triangulation 7.8: scorecard Việt của `an8.46` (`content/meta/sutta/an/an8.46.yaml`) có `translators` **và**
  `quality.assessed_by` cùng họ công cụ với lớp lấp — tức bản Việt canonical và bản lấp do cùng một công cụ
  làm/chấm. Vì vậy bản lấp **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài này
  **không** được tuyên bố là đã đối chiếu English ở 21 khoá này. Đối chiếu có: Pāli root đã ghim (authority),
  lời Sujato đã ghim của chính bài (dùng làm khuôn chữ cho nhóm A/B) và bản Việt canonical (chỉ đối chiếu nghĩa,
  không dịch vòng). Không chạm tầng Việt hay metadata Việt.

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run
  build` (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều
  phối. Không đặt blocker vì cổng chưa chạy không phải lỗi kiểm định.

