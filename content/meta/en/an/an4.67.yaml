notes: |-
  `3.3` và `3.4` lặp lại `2.1` và `2.2` (chỉ khác `imāni cattāri` / `cattāri`), và bản
  đã ghim đã dịch cả hai. Giữ nguyên mọi từ đã ghim: "spread a mind of love to the four
  royal snake families" và "he wouldn’t have died due to a snake bite".

  Một chỗ phải mở rộng: ở `2.2`, Sujato dịch vế điều kiện bằng "If he had, …" vì mệnh
  đề đầu đã nằm ở 2.1. Ở `3.4` mệnh đề đầu NẰM TRONG CHÍNH khoá này, nên "If he had,"
  đứng một mình sẽ hụt. Vì vậy bản này mở vế điều kiện ra: "If he had spread a mind of
  love to these four royal snake families, …". Đây là lựa chọn biên tập — giữ nguyên
  cách rút gọn của Sujato sẽ sinh ra một câu không tự đứng vững — nên `ambiguity_integrity`
  hạ.

  Bốn tên họ rắn (Virūpakkha, Erāpatha, Chabyāputta, Kaṇhāgotamaka) không xuất hiện
  trong hai khoá này, nên không phải lo chuyện dấu Pāli lọt vào bản Anh.

  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
