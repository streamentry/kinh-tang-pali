notes: >-
  Câu này xuất hiện hai lần (7.3 và 7.9) và 7.3 đã có chữ — bản đã ghim dịch `khattiya`
  là "aristocrats", không phải "noble warriors". Bản đầu tiên của lát này dịch
  "noble warriors", sai; đã sửa thành "aristocrats" để khớp. Cũng lưu ý Pāli ở 7.9
  mở ngoặc `‘` trong khi 7.7 đã đóng một ngoặc khác: nguồn có hai vòng trích dẫn
  lồng nhau và phải giữ nguyên, không cân bằng lại.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
