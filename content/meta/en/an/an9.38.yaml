notes: >-
  Đức Thế Tôn dẫn lại câu hỏi của hai Bà-la-môn ở 2.9 để phá đi. Bản đã ghim đã dịch 2.9
  ("These two claim to speak from knowledge, but they directly contradict each other.
  Which one of them speaks the truth, and which falsehood?") nên phải giữ đúng ba từ khoá ấy.
  
  Một điểm dấu câu đáng ghi: Pāli 2.9 kết bằng `?` — đó là câu hỏi các Bà-la-môn tự nói ra.
  Pāli 3.3 kết bằng `.` — vì đây là lời Ngài dẫn lại. Sự phân biệt ấy có thật trong nguồn,
  nên bản này tách thành hai câu văn dẫn lời và kết bằng dấu chấm, thay vì dịch thành một
  câu hỏi với dấu `?`.
  
  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
