notes: |-
  Đây là lát khó nhất của tôi, và có hai quyết định phải nói rõ.

  Một: Sujato ở `2.6` dịch cùng danh sách này thành DANH TỪ ("whipping, caning, and
  clubbing; cutting off hands or feet, or both; … and being beheaded") dù Pāli mang
  động từ (`tāḷenti`, `chindanti`, `karonti`). Nhưng `3.3` nằm GIỮA `3.2` ("…for
  which the kings arrested that bandit, that criminal,") và `3.4` ("the rulers would
  arrest me and subject me to the same punishments.'") — hai vế đều là mệnh đề động từ.
  Đặt một danh từ vào giữa đó làm câu gãy. Vì vậy bản này GIỮ ĐỘNG TỪ và chỉ mượn
  nguyên tên từng hình phạt của Sujato; cách dùng động từ của khoá song song
  `an4.121:5.3` trong lớp lấp ("They would make him a Rāhu's mouth, …") được dùng làm
  khuôn cho `3.3`.

  Hai: KHÔNG đặt dấu nháy quanh tên hình phạt. Luật 4 của `english-fill.test.ts` bắt
  số ngoặc mở phải khớp Pāli theo từng khoá, và Pāli ở `3.3` không mang ngoặc nào;
  bản đã ghim có 8 cặp nháy vì đã gộp cả câu hỏi vào. Đây là hệ quả cơ học của quy tắc
  đánh dấu, không phải lựa chọn văn phong — vì vậy `ambiguity_integrity` hạ.

  Ba: `3.5` là `…pe…`, chỉ dịch `kasāhipi tāḷeyyuṁ` và `asināpi sīsaṁ chindeyyun’ti`,
  giữ nguyên một dấu lược và dấu `’` đóng mà Pāli mang.

  `Rāhu’s mouth` giữ nguyên vì bản đã ghim của chính bài (`2.6`) đã dùng tên này.
  Triangulation 8.0: các tên hình phạt không có bản dịch Việt hay chú giải nào đáng
  tin — đây là tên riêng của kỹ thuật tra tấn trong ý chí, và chính vì vậy bản này chép
  tên của Sujato thay vì tự đặt.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
