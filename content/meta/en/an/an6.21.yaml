notes: |-
    3.3 và 3.6 trùng byte với 2.1 và 2.4 của chính bài ("three qualities lead to the
    decline of a mendicant"), nên dùng lại y nguyên.

    3.2 là bản Thế Tôn kể lại đúng cảnh ở 1.1–1.2, và bản đã ghim đã dịết cảnh đó
    ("Then, late at night, a glorious deity, lighting up the entire lotus pond, went up
    to the Buddha, bowed, stood to one side, and said to him,"). Tôi mượn đúng "glorious
    deity", "lighting up the entire lotus pond", "stood to one side" (đếm lần lượt 17,
    55, 140 đoạn trong bản đã ghim) và đổi sang ngôi thứ nhất vì Thế Tôn đang kể.
    `abhikkantavaṇṇā` ("dung sắc tuyệt hảo") được gộp vào "glorious" đúng như Sujato
    gộp ở 1.2.

    BẤT ĐỊNH, và tôi ghi rõ vì đây là chỗ duy nhất tôi phải cầu nối: 3.8 (`Idaṁ vatvā
    maṁ abhivādetvā padakkhiṇaṁ katvā tatthevantaradhāyi.`) không có chủ ngữ riêng —
    chủ ngữ `sā devatā` nằm ở 3.7, mà 3.7 bản đã ghim để trống và không thuộc lát này.
    Tôi dựng "the deity" để câu đọc được, lấy từ chính 3.7; đây là nối từ vựng, không
    phải thêm ý. Bản Việt đã publish làm y vậy ("vị ấy"). Phần còn lại mượn an4.21:12.2
    ("respectfully circled me, keeping me on his right side, before vanishing right
    there"), đổi sang ngôi thứ nhất. Vì vậy ambiguity_integrity hạ 9.1.

    5.2 và 5.3 là vị lai và vị hiện tại của câu mà Sujato đã nén hết vào 5.1 ("Whether
    in the past, future, or present, all those who decline in skillful qualities do so
    because of these six qualities."). Tôi giữ nguyên "because of these six qualities"
    của 5.1 để ba vế đọc liền nhau, và bỏ dấu nhấn `imeheva` ("chính sáu pháp này" ở bản
    Việt) — đánh đổi này có chủ ý, vì giữ `imeheva` sẽ tách cột Anh khỏi khoá 5.1 ngay
    cạnh nó. Độ lặp do 5.1 nén là của bản đã ghim, không sửa được.

    Lớp lấp: 6 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị
    mất. Triangulation 8.0: người viết lớp lấp cũng là người chấm, nên đây không phải
    một cách đọc Anh độc lập — đáng lưu ý với bài này hơn phần lớn lát, vì scorecard
    Việt của chính an6.21 cũng do "OpenCode Space Bunny Free (agent)" chấm
