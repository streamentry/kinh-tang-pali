notes: |-
  Pāli của `3.3`, `3.4`, `3.5` TRÙNG NGUYÊN VĂN với `1.3`, `1.4`, `1.5`, và bản Anh đã ghim
  đã dịch cả ba. Luật 3 của lớp bắt buộc dùng lại đúng cách dịch đã có, nên ba khoá này chép y nguyên —
  kể cả việc `1.4` và `1.5` của Sujato đã lược chủ ngữ và dùng đại từ "they" trong khi `1.3` giữ
  "a mendicant dedicated to the higher mind".

  Hệ quả phải nói rõ cho người đọc: cột Anh lặp gần như nguyên văn `1.3`–`1.5`. Đó là cấu trúc Pāli
  của bài này (mục 3 dựng lại từ chính mục 1), không phải lỗi lặp của người dịch. Không thể rút gọn:
  Pāli `3.3`–`3.5` không có `…pe…`.

  Đối chiếu lớp Việt: `an3.102:3.3` và `3.5` (dự án) dùng đúng nghĩa "giải đãi" / "phóng dật" /
  "không chánh đáng thành tựu định để cạn lậu hoặc", khớp với "laziness" / "restlessness" / "won't
  properly become immersed in samādhi for the ending of defilements".

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
