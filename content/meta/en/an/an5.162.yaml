notes: |-
    2.6, 2.8, 2.10 trùng byte với 2.4 và 2.12 của chính bài, nên dùng lại nguyên văn
    "you should get rid of resentment for that kind of individual." — cả ba, không dịch
    lại.

    5.10 và 8.2/8.3 mới là phần phải dựng, và chúng đụng phải cùng một vấn đề: bản đã
    ghim đã nuốt sẵn chúng vào khoá trước. 5.9 của Sujato là "In the same way, at that
    time you should ignore that individual's impure behavior by way of speech and body,"
    — trong khi Pāli 5.9 chỉ nói về THÂN (`aparisuddhakāyasamācāratā`), và 5.10 mới nói
    về KHẨU. Còn 8.1 của Sujato đã gộp cả 8.1+8.2+8.3 vào một câu. Viết đúng Pāli thì
    cột Anh lặp; bỏ thì khoá trống ở nơi Pāli có chữ. Tôi chọn viết đúng Pāli, dùng
    đúng khuôn "ignore … impure behavior by way of …" mà Sujato đặt ở 3.3, và ghi rõ ở
    đây rằng độ lặp là do bản đã ghim nén, không phải do lớp lấp.

    8.3 trùng nội dung với 5.11 (chỉ khác `so`→`pi` và `tamevassa`→`tampissa`), và 5.11
    đã được Sujato dịch, nên 8.3 dùng lại y nguyên: "and focus on the fact that they get
    an openness and clarity of heart from time to time." (`openness and clarity of
    heart` đếm 9 lần trong bản đã ghim).

    BẤT ĐỊNH: thêm "at that time" vào 5.10 và 8.2. Pāli có `tasmiṁ samaye`, và Sujato
    đặt "at that time" ở đầu câu ở 3.3 và 4.5; đặt ở cuối mệnh đề là cách tôi giữ được
    cả hai vế mà không lặp. Vì vậy ambiguity_integrity hạ 9.0 và grammar_logic hạ 9.2.

    Triangulation 8.0: người viết lớp lấp cũng là người chấm, nên đây không phải một
    cách đọc Anh độc lập.

    Lớp lấp: 6 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị
    mất.
