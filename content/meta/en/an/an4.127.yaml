notes: |-
  Sáu khoá này là hai vế lặp đúng ba lần. Bài kể bốn điều kỳ lạ, và mỗi điều kết bằng CÙNG một
  đoạn bốn khoá; chỉ phần "Và cả ánh sáng ấy…" mới bị lặp lại vì nó thuộc về con đường của Đức Thế Tôn, không
  phải của người tu.

  - `2.3` ← `1.5`, `2.4` ← `1.6` (sanh ra trong bào thai)
  - `3.3` ← `1.5`, `3.4` ← `1.6` (chứng ngộ)
  - `4.3` ← `1.5`, `4.4` ← `1.6` (xoay bánh pháp)

  Tôi soát Pāli từng cặp và chép nguyên văn `1.5`/`1.6`, không dịch lại. Bài này không có chỗ nào phải tự
  quyết; nó chỉ là một ca chép lại có kiểm soát. Đó là lý do `semantic_fidelity` và `terminology` của lát này
  cao hơn các lát khác trong e5.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm, nên đây KHÔNG phải một lớp đọc Anh độc lập. Tầng đối chiếu là Pāli đã ghim, các khoá còn lại của chính bản Anh đã ghim, và bản Việt dự án (do agent khác viết) chỉ để đối chiếu nghĩa.

  Lớp lấp: 6 khoá, tất cả đều nằm ở chỗ bản Anh đã ghim để trống. Không khoá nào là blockquote tham chiếu và không khoá nào có Pāli rỗng.

  Bài này còn 1 khoá mà bản Anh đã ghim để trống và lát này KHÔNG lấp, vì Pāli của chúng dưới 40 ký tự nên nằm ngoài ngưỡng đo coverage: `4.7`. Phần lớn là đuôi đoạn lược (`…pe…`, `Navamaṁ.`, `parinibbāyati.`) và bài thơ `udāna` cuối bài. Người đọc bốn cột VẪN thấy các ô này trống, và đó là đúng: một ô tham chiếu trống là lỗ hổng của bản dịch đó, khác với bản vắng mặt cả bài.

  Lớp lấp làm coverage English của bài này lên 100% (từ 16/22 = 0.7273). Bản ghi của nó trong `content/meta/reference-gaps.yaml` sẽ thành record thừa và test `a fill never leaves a gap record it has cured` sẽ đỏ cho tới khi chạy `npm run reference:gaps`. Tôi không sửa tệp đó và không chạy lệnh đó; việc đó nằm ngoài lát này.
