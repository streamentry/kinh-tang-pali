notes: |-
  Phạm vi: 20 khoá lấp, là toàn bộ khoá Sujato để trống có Pāli (17 khoá có nội dung ≥ 40 ký tự; 3 khoá ngắn hơn: `…` ở khoản 6 và nhãn kết bài). Không còn khoá trống nào của bài ngoài danh sách. Hai lượt tranh luận lặp (lần hai 3.2–3.11, lần ba 4.2–4.8): Sujato rút lần hai thành `For a second time …` và lần ba thành một dòng.

  Bốn nhóm (đo bằng máy, Pāli chuẩn hoá): A=10 · B=1 · C=3 · D=6. Xử lý thực tế: 16 khoá dùng lại nguyên văn Sujato; 4 khoá viết mới (3.5 nhóm B; 6.4, 6.5, 7.7 nhóm C). Máy báo 6 khoá D vì chuẩn hoá bỏ dấu câu; khi so chuỗi Pāli nguyên văn có dấu thì D tan: 2.4, 3.8, 4.8 (Pāli kết `’ti`) trùng đúng 4.11; 3.4, 3.11, 4.4 (Pāli kết `’”ti`) trùng đúng 1.6 và 2.7 (hai khoá này cùng lời Sujato). Nên mỗi khoá chép đúng khoá anh em của mình.

  Nhóm B (khoá ← khoá nguồn gần nhất, tỉ lệ khớp Pāli): 3.5 ← 4.5 (0.86). Phần chèn lại: 3.5 chỉ đổi `third` thành `second` so với 4.5.

  Chỗ cố ý lệch, kèm lý do: (1) Sujato bọc lời tuyên bố vào nháy lồng (`“I understand: ‘Rebirth is ended … for this place.’”’”`) mà Pāli không có dấu cho câu lồng đó; sáu khoá lấp (2.4, 3.4, 3.8, 3.11, 4.4, 4.8) chép nguyên theo khoá anh em: Pāli 1 dấu (2.4, 3.8, 4.8) hoặc 2 dấu (3.4, 3.11, 4.4), English 5 hoặc 6 dấu; ngoại lệ theo khoá anh em, đã đo, thuộc loại “nháy lồng nhau”. (2) 6.4 và 6.5 (Pāli `atha pacchimāya …`, `atha uttarāya …`) dịch `And from the west …`, `And from the north …`: Sujato gộp bốn hướng vào 6.3 (`out of the east, the west, the north, and the south`), nên khoá lấp chỉ mang hướng của riêng nó.

  Quan sát tầng ghim (ngoài lát, không sửa): Sujato tự thêm `…` ở 10 khoá mà Pāli viết đủ (3.1, 4.1, 5.3–5.10); lớp lấp không sao chép. 4.11 của Sujato đóng nháy khác 1.6 và 2.7 (`’”’` so với `’”’”`) dù cùng cấu trúc.

  Nháy: đo từng khoá, khớp Pāli ở mọi khoá trừ sáu khoá ngoại lệ trên.

  Coverage (≥ 40 ký tự, bỏ khối `:0`): trước 38/55 = 0.6909; sau (khi `published`) 55/55 = 1.0000. Độ nhạy: có thể thiếu tối đa 11 khoá có nội dung mà vẫn ≥ 0,80. Bài hiện có record trong `content/meta/reference-gaps.yaml` (substantiveWithoutEnglish 17, coverage 0.6909); record thành thừa sau khi `published`, để người điều phối chạy lại `npm run reference:gaps`. Số khoá trống còn lại sau lớp lấp: 0.

  Triangulation 8.0: `content/meta/sutta/an/an9.26.yaml` (bản Việt) ghi cùng họ công cụ với lớp lấp này (khai trong `reviewers`/`quality.assessed_by`, đối chiếu `source/tooling.yaml`), nên bản lấp KHÔNG phải cách đọc English độc lập, và scorecard tiếng Việt của bài này không được tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu có thật: Pāli root + Sujato đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Không chạm tầng Việt.

  technical_integrity 9.6: không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối) nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, không đặt blocker.
