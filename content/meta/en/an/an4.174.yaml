notes: |-
  Tiền lệ mạnh nhất là bài song song: `an4.173` có Pāli ở `10.2`, `10.4`, `10.6` TRÙNG NGUYÊN
  VĂN với `10.3`, `10.5`, `10.7` của bài này, và bản Anh đã ghim đã dịch cả sáu khoá đó. Ở `an4.173`
  Sujato dùng đúng khuôn "When asked whether …," cho `iti puṭṭho samāno:`, nên tôi theo khuôn đó.

  Vế gốc `channaṁ phassāyatanānaṁ asesavirāganirodhā` ở đây KHÔNG có `…pe…`, nên không được lược — khác
  với `an4.173:10.2`/`10.4`/`10.6`, nơi Sujato đã lược vế này vì nó xuất hiện ở `10.1`. Để không phải
  thêm một cặp ngoặc thứ hai mà Pāli không có, tôi dùng đúng khuôn gạch dài của `an4.173:10.1`:
  "when asked whether—when the six fields of contact have faded away and ceased with no residue left
  behind—something else no longer exists". Bốn mệnh đề lấy từ bản Anh đã ghim của chính bài này:
  `natthaññaṁ kiñcī` = `11.2`, `atthi ca natthi ca aññaṁ kiñcī` = `11.3`, `nevatthi no natthaññaṁ kiñcī`
  = `11.4`, và vế `asesavirāganirodhā` = `11.1`.

  Bất định đã biết: `10.4`, `10.6`, `10.8` (`‘mā hevaṁ, āvuso’ti vadesi.`) trống ở bản Anh đã ghim và
  ngắn hơn 40 ký tự nên không vào lát này. Vì vậy `10.3`, `10.5`, `10.7` kết bằng dấu phẩy đúng như
  Pāli, và câu trả lời "don't put it like that" của các vị ấy vắng mặt trong cột Anh — người đọc sẽ thấy
  một lỗ hổng sau mỗi khoá. Cùng lý do này, `10.1` (đã ghim) cũng đã bỏ dấu hai chấm cuối.

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
