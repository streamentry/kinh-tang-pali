notes: >-
  Câu này xuất hiện ba lần trong bài (3.15, 5.4, 7.5); 3.15 và 7.5 đã có chữ, chỉ
  5.4 bị lược. Đọc riêng 5.4, `sabrahmakā sapajāpatikā` rất dễ bị dịch sai — đây là
  Brahmà cùng những vị đồng minh của Ngài (tức Indra và Brahmà), không phải "cùng
  Brahmà và con cái". Vì hai khoá kia đã có chữ nên bản này giữ nguyên cách gọi
  "Indra, the Divinity, and the Progenitor" mà bản đã ghim dùng. Đây đúng là trường
  hợp `sn11.24` dạy: dịch lại từ trí nhớ một segment lặp sẽ khiến bài tự mâu thuẫn.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
