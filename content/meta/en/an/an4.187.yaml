notes: |-
  QUAN TRỌNG — LỆCH VỚI GIẢ ĐỊNH CỦA BRIEF: bài này CÓ bản Anh đã ghim. Đo lại
  bằng cách dò trực tiếp `.cache/upstream/suttacentral/translation/en/sujato/sutta/an/an4/
  an4.187_translation-en-sujato.json`: 44/63 khoá có chữ, 19 khoá Sujato để trống và 19
  khoá đó CHÍNH LÀ `fillableSegments`. Vậy đây là lớp lấp đúng nghĩa, có tầng Anh đã
  ghim trong chính bài để đối chiếu. `triangulation` vẫn để 8.0 vì các khoá phải lấp
  CHÍNH LÀ các khoá Sujato đã lược, nên ở đúng những câu này tôi vẫn không có tầng Anh
  độc lập; đây là đặc thù của lớp lấp, đã nói sẵn trong chính scorecard.

  TIỀN LỆ, DÙNG LẠI ĐÚNG TỪ CỦA BẢN ĐÃ GHIM (đo được trong chính tệp của bài):
  `asappuriso` → "an untrue person" và `sappuriso` → "a true person", 8 lượt ngay trong
  `an4.187_translation-en-sujato.json`; `aṭṭhānaṁ anavakāso` → "That’s impossible … it can’t
  happen"; `ṭhānaṁ vijjati` → "That … is possible"; `alamatthadasatarehi` → "even better
  than the experts"; tên sáu người thị vệ → "Yamaka, Moggallo, Ugga, Nāvindakī, Gandhabba,
  and Aggivessa" (đúng chữ tại 6.3 kề bên). Tôi viết lại từ Pāli rồi đối chiếu từng
  cụm với những lời đó; không dịch vòng qua tiếng Việt.

  LUẬT 3, ĐÁNH SỐ: trong lát này có 90 cặp khoá trùng Pāli (46 khoá dính), và riêng bài
  này 7 cặp trong 3.4–3.10 / 8.4–8.10 — đó là ĐÚNG HAI LẦN đọc lại cùng một đoạn trích của
  Đức Thế Tôn, nên 3.4≡8.4, 3.5≡8.5, 3.6≡8.6, 3.8≡8.8, 3.9≡8.9, 3.10≡8.10, và
  3.6≡3.8. Mỗi cặp nhận ĐÚNG MỘT lời. 2.4 và 2.16 trùng nhau, 2.8 và 2.12 trùng nhau —
  cũng một lời mỗi cặp. Riêng 2.4/2.8/2.12/2.16 không trùng 2.10/2.14 được vì Pāli hai
  bên khác Ở DẤU CÂU (`ti.` so với `ti?`), nên tôi giữ `.’` cho bốn khoá của mình và `’?”`
  cho hai khoá đã ghim: đúng luật đếm theo từng khoá.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU, HAI CHỖ:
  (1) `an4.187:6.2` `paṇḍitā rañño eḷeyyassa parihārakā—` là chủ ngữ của câu hỏi, nhưng
  Sujato đã nhét cả chủ ngữ vào 6.3 và BỎ RỚT `paṇḍitā`. Tôi trả lại cả hai vế ("the wise,
  the attendants of King Eḷeyya—") và cố tình KHÔNG dùng lại "the king’s men" của 6.3 để
  không lặp ngay hai lần. Hệ quả: câu 6.1–6.3 bắt đầu bằng "…? the wise, the attendants of
  King Eḷeyya— When it comes to…" — đứt đoạn là do chỗ Sujato lược, không phải lỗi dịch;
  `grammar_logic` hạ vì vậy.
  (2) `an4.187:3.7` và `8.7` (ĐÃ GHIM, không phải khoá của tôi) kết bằng `…’`, tức Sujato
  đóng dấu nháy ở giữa đoạn trích, trong khi Pāli giữ mở tới `’ti` ở 3.10/8.10. Tôi không
  sửa được (luật 1 chặn ghi đè) và cũng không thêm ngoặc giả ở 3.8–3.10, vì luật đếm ngoặc
  là theo từng khoá và Pāli 3.8/3.9 không có ngoặc nào. Đọc liền sẽ thấy dấu nháy đóng
  sớm; đó là di sản của tầng đã ghim, ghi ở đây để người biên tập biết mà không ai tưởng
  là bản dịch của tôi.

  `Sattamaṁ.` → "Seventh.": KHÔNG có tiền lệ vì Sujato để trống MỌI khoá số thứ tự đứng
  riêng trong AN/SN/Ud — đếm được: `Sattamaṁ.` có 145 khoá trong Pāli root `an`+`kn`+`sn`,
  tệp `an4.87:7.3`, `an4.7:3.7`, `an4.27:3.5`, `an4.67:10.7`, `sn18.7:2.5`, `ud1.1:4.5`
  đều trả về rỗng. Vậy đây là lựa chọn mới của dự án ở loại khoá chưa từng có tiền lệ;
  `ambiguity_integrity` hạ vì lý do đó, không phải vì bất định nghĩa.

  KHÔNG CHẠY ĐƯỢC CỔNG KỸ THUẬT — ĐÃ HẠ `technical_integrity` XUỐNG 9.8. Đợt này cấm
  chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tôi KHÔNG
  tuyên bố technical gate pass. Bốn lệnh đó xin người điều phối chạy; nếu chúng đỏ thì
  `status: published` phải hạ xuống `draft`.

  CHỐT CỦA KHO ĐÃ CHẠY VÀ PASS: `save_fill` kiểm đủ 5 luật cơ học cho 131 khoá này —
  (1) không khoá nào nằm ngoài `fillableSegments`; (2) không mở rộng `…pe…`; (3) đếm
  dấu lược / ngoặc mở / ngoặc đóng / dấu hỏi khớp PẪN NHIÊU TỪNG KHOÁ; (4) không chữ
  Pāli có dấu nào lọt vào bản Anh (danh sách cho phép lấy theo CẢ TẦNG, nên `Nāvindakī`
  và `Sudassana`… hợp lệ); (5) NFC, không khoảng trắng đôi. `tests/unit/english-fill.test.ts`
  cũng đòi mỗi fill có metadata + 10 tiêu chí — đây là 14 tệp đó.

  LUẬT 3 ("Pāli trùng thì dùng lại lời đã có") — MÁY KHÔNG BẮT ĐƯỢC Ở LÁT NÀY, TÔI TỰ
  ĐẾM. `save_fill` chỉ in cảnh báo khi Pāli trùng ở khoá khác **có bản Anh đã ghim**.
  Tôi tự viết script so Pāli của 14 bài này với (a) nhau, (b) toàn bộ fill đã có trong
  tầng, (c) Pāli root của mọi bài trong tầng `an`/`kn` — kết quả đính kèm ở báo cáo.
