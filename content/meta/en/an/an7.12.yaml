notes: |-
  Tiền lệ: 1.9 đã ghin "The spiritual life is lived to give up and cut out these seven
  underlying tendencies." 2.1 đã ghin trọn vế `ucchinnamūlo tālāvatthukato anabhāvaṅkato
  āyatiṁ anuppādadhammo` bằng "cut them off at the root, made them like a palm stump,
  obliterated them, so they are unable to arise in the future—". Cả hai khoá lấp lại đúng bộ
  từ ấy, và tự đứng được vì 1.3/2.1 đã ghim danh sách.
  Bất định: `anusaya` ở bản đã ghin là "underlying tendency" (số ít) và "underlying
  tendencies" (số nhiều); bản dịch theo đúng số của từng khoá.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
