notes: |-
  an3.91 là `Saṅkavāsutta`: Kassapagotta bất mãn với Đức Phật, rồi đi tìm xưng tội. Tám khoá lấp nằm
  ở đúng lời xưng tội đó (`3.1`–`3.10`) và hai khoá ở phần tán thán (`6.4`, `8.4`).

  **Bốn khoá chép nguyên văn từ bản Anh đã ghim**, vì Pāli trùng byte:
  - `3.8` ≡ `2.3` → lấy y nguyên câu ghim ở `2.3`.
  - `3.5` ≡ `1.7` + dấu lược `(…)` → lấy y nguyên `1.7` rồi giữ `(…)`.
  - `3.10` ≡ `2.5` → lấy y nguyên `2.5`, chỉ đổi ngoặc đóng theo Pāli: `”ti.` ở `2.5` thành `’ti.` ở `3.10`.
  - `6.4` ≡ `5.3`; `8.4` ≡ `7.3` → chép y nguyên, kể cả `ahitāya dukkhāyā` / `hitāya sukhāyā`.

  **Hai khoá phải tự dịch** vì bản ghim không phủ, hoặc phủ thiếu:
  - `3.7`: vế `dulladdhaṁ vata me, na vata me suladdhaṁ;` **đã bị Sujato rơi ở `2.2`** — `2.2` ghim chỉ còn
    `It’s my loss, my misfortune,`. Tôi giữ nguyên nửa đầu đó rồi dịch nửa sau, vì chép nguyên bản ghim ở đây
    là **chép cả sự mất mát**, không phải tái sử dụng. Bản Việt canonical cũng nén chỗ này (`tôi đã gặp điều khó gặp`),
    nhưng bản Anh lấp phải đủ cả hai vế của Pāli.
  - `3.3`: Pāli không trùng byte khoá nào, nhưng vế cuối trùng vế cuối `3.11` (đã ghim), nên tôi dùng đúng bốn
    động từ `educating, encouraging, firing up, and inspiring` mà `3.11` đã dùng, để `3.2`–`3.3` và `3.11`
    không tự mâu thuẫn trong cùng một lời xưng tội.

  **Bất định phải ghi, không giấu:**
  1. **Dấu nháy kép ở `3.1`: tôi cố ý KHÔNG mở `“`.** Pāli mở `“` ở `3.1` và đóng ở `3.9`
     (`“adhisallikhatevāyaṁ samaṇo”ti.`). Nhưng bản ghim đã dời dấu mở của lời xưng tội này sang `3.11`
     (vì `3.1`–`3.10` bị bỏ trống), và `3.9` **vẫn trống**, nằm ngoài lát `e11`. Nếu tôi mở thêm `“` ở `3.1`
     thì cột Anh sẽ có 5 `“` mà chỉ 4 `”` — một dấu nháy treo. Đo lại trên **chính bản ghim**: trước khi lớp
     lấp này, an3.91 cân bằng 4/4. Tôi chọn cân bằng, và theo đúng tiền lệ đã ghi ở `content/meta/en/an/an4.11.yaml`
     (nơi ngoặc đóng `’ti.` bị Sujato nuốt thành câu thì lấy theo bản ghim, không tự tính lại từ Pāli).
     Hệ quả người đọc phải biết: dấu `“` của lời xưng tội hiện nằm ở `3.11` chứ không ở `3.1`.
  2. Sujato dịch vế `yassa me bhagavati …` hai lần theo **hai kiểu khác nhau**: `2.3` nén thành `was talking about
     the training rules`, còn `3.11` giữ đủ bốn động từ. Tôi chọn theo quy tắc dùng lại: `3.8` trùng byte `2.3`
     nên chép `2.3`. Hệ quả tất yếu: cột Anh của bài này vẫn có hai cách dịch cho cùng một vế — đó là mâu thuẫn có
     sẵn trong bản đã ghim, không phải do lớp lấp.
  2. `an3.91:3.4`, `3.9`, `4.2` (Pāli `‘adhisallikhatevāyaṁ samaṇo’ti.`) và `3.12` (đã ghim) là **bốn lần xuất hiện
     cùng một vế** với hai cách đã ghim: `1.6` và `3.12` dịch `This ascetic is much too strict.`, còn `2.4` dịch
     `he was much too strict.` — đọc `2.4` như vậy là sai (Pāli `adhisallikhatevāyaṁ` là tính từ bổ nghĩa cho
     `samaṇo`, không phải động từ). Tôi **không** sửa `2.4` (thuộc bản đã ghim) và `3.4`/`3.9` nằm ngoài lát này.
     Đây là điểm cần người biên tập quyết, không phải chỗ tôi tự ý đồng hoá.
  3. `an3.91:3.4`, `3.9`, `4.2`, `6.3`, `8.3`, `8.6`, `8.7`, `9.0`–`9.4` vẫn **trống** trong tầng Anh đã ghim.
     Tất cả đều dưới 40 ký tự Pāli nên ngoài tập `substantiveSegments` (40 khoá) và không ảnh hưởng coverage.
     Chúng **lấp được** (`fillableSegments` chỉ đòi tầng đã ghim để trống), nhưng không nằm trong lát `e11`.

  Điểm: `triangulation` = 8.0 vì `content/meta/sutta/an/an3.91.yaml` ghi `assessed_by: GLM-5.3 Flash (ZCode)`
  (khác họ công cụ `OpenCode Space Bunny Free` nên chưa phải 7.5), nhưng bốn trong mười khoá lấp là **chép nguyên văn
  từ bản Anh đã ghim** — chúng là bằng chứng về tính nhất quất, không phải về tính đúng. Ba khoá tự dịch
  (`3.1`, `3.2`, `3.6`) cùng `3.7` mới là bản dịch độc lập thực sự.

