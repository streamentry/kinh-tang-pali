notes: |-
  Tiền lệ: 4.4 và 4.5 trùng NGUYÊN VĂN 3.4 và 3.5, đã ghin trọn, nên dùng lại nguyên văn.
  4.11/4.12 (cùng cấu trúc với `kalyāṇamitta`) đã ghin "encourage other mendicants who lack
  good friends to develop good friendship" / "praise other mendicants who have good friends…",
  nên 4.4/4.5 giữ đúng mẫu "encourage/praise other mendicants who…".
  Cờ "lặp cụm, một từ ngăn: respect … respect" của rven88 là HỢP LỆ: Pāli lặp
  `na satthugāravā … satthugāravatāya`, và đây là câu đã ghin ở 3.4.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
