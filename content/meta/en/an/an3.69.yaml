notes: |-
  Bốn trong sáu khoá là CHÉP LẠI y nguyên một vế đã có chữ trong chính bài này, không phải bản dịch mới:

  - `7.3` và `8.3` (`Kāyassa ca bhedā paraṁ maraṇā duggati pāṭikaṅkhā.`) lấy nguyên văn từ `6.2`/`7.6`.
  - `16.3` (`Diṭṭheva dhamme sukhaṁ viharati …`) lấy từ `14.2`, KHÔNG lấy từ `15.11`: bản đã ghim ở `15.11`
  có lỗi gõ hai dấu cách liên tiếp ("free of  distress"), và chép lại cái lỗi đó là chép lại lỗi.
  - `16.2` lấy vị ngữ của `14.1` — "are cut off at the root, made like a palm stump, obliterated, and
  unable to arise in the future" — rồi hẹp về một gốc.

  `7.2` và `8.2` là chỗ duy nhất phải tự quyết. Pāli ở đó chỉ còn `mohajehi` (gốc si), vì phần `lobhajehi …
  pe…` đã nằm trong khoá `7.1`/`8.1` mà bản đã ghim để trống. Bản đã ghim ở `6.1` và `7.5` viết
  "Such an individual—overcome with bad, unskillful qualities born of greed, hate, and delusion—suffers in
  this very life, with distress, anguish, and fever." — dùng số ít "suffers" vì Pāli kia có chủ thể `puggalo`
  đứng trước. Ở `7.2`/`8.2` Pāli KHÔNG có chủ thể, nên tôi dùng "they suffer" thay vì bịa một danh từ mà Pāli
  không có. Hệ quả phải nói thẳng: cột Anh ở `7.2`/`8.2` không điệp lại y hệt `6.1`, chỉ điệp lại đúng vế ngữ
  "in this very life, with distress, anguish, and fever". Vì vậy `grammar_logic` hạ.

  `16.2` mở đầu bằng chữ hoa vì khoá `16.1` (`Dosajā …pe…`) trống trong bản đã ghim; để chữ thường thì ô Anh
  mở đầu bằng "bad" giữa câu.

  `triangulation` bị chặn ở 8.0: người viết lớp lấp cũng là người chấm, nên đây KHÔNG phải một lớp đọc Anh độc lập. Tầng đối chiếu là Pāli đã ghim, các khoá còn lại của chính bản Anh đã ghim, và bản Việt dự án (do agent khác viết) chỉ để đối chiếu nghĩa.

  Lớp lấp: 6 khoá, tất cả đều nằm ở chỗ bản Anh đã ghim để trống. Không khoá nào là blockquote tham chiếu và không khoá nào có Pāli rỗng.

  Bài này còn 9 khoá mà bản Anh đã ghim để trống và lát này KHÔNG lấp, vì Pāli của chúng dưới 40 ký tự nên nằm ngoài ngưỡng đo coverage: `7.1`, `8.1`, `15.1`, `15.2`, `15.3`, `15.4`, `16.1`, `16.4`, `16.6`. Phần lớn là đuôi đoạn lược (`…pe…`, `Navamaṁ.`, `parinibbāyati.`) và bài thơ `udāna` cuối bài. Người đọc bốn cột VẪN thấy các ô này trống, và đó là đúng: một ô tham chiếu trống là lỗ hổng của bản dịch đó, khác với bản vắng mặt cả bài.

  Lớp lấp làm coverage English của bài này lên 100%. Trước lát này nó đã là 55/61 = 0.9016, tức đã trên ngưỡng 0.8, nên bài KHÔNG có record trong `content/meta/reference-gaps.yaml` và không sinh record thừa nào.
