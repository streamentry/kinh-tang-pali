notes: |-
  `3.3` TRÙNG NGUYÊN VĂN `2.3` và `5.3` TRÙNG NGUYÊN VĂN `4.3` của chính bài này —
  đúng luật của `sn11.24`. Chép lại y nguyên, kể cả dấu gạch dài và `they’re`/`don’t`
  của bản đã ghim. Dịch lại ở đây sẽ khiến cột Anh của bài tự mâu thuẫn: 3.4 và 3.5 nói
  người ấy làm điều thiện, nên 3.3 buộc phải mô tả đúng những gì người ấy CÓ, không phải
  những gì người ấy KHÔNG có.

  Bản đã ghim ở 3.2 và 5.2 kết bằng dấu lược "…" (`…difficult`), nên ba khoá này đọc
  như một câu bị cắt; đó là cấu trúc Pāli, không phải lỗi lấp. Không mở rộng dấu lược.

  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
