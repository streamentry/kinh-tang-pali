notes: |-
  `3.3` và `5.3` trùng với `2.2` (chỉ khác `“Yattha` ở 2.2 so với `‘yattha` ở đây),
  và bản đã ghim đã dịch câu đó HAI LẦN trong chính bài này: ở `2.2` và ở `6.1`. Bản
  này chép lại y nguyên một trong hai, chỉ đổi `“…”` thành `‘…’”` cho khớp dấu nháy
  Pāli mang ở 3.3 và 5.3 (`’”ti.` → hai dấu đóng: một `”` và một `’`).

  Bất định phải ghi: hệ quả là hai khoá kết bằng `.’”` — một dấu đóng trong dấu nháy
  và một dấu ngoặc đóng từ `’”ti.`. Ở `5.2` bản đã ghim đã tự đóng ngoặc sớm ("…by the
  Buddha.”") trong khi Pāli ở 5.2 không có dấu đóng, nên người đọc sẽ thấy hai dấu
  đóng liền nhau. Bỏ một dấu thì chốt của repo báo lệch số ngoặc đóng; đây là hệ quả
  cơ học của quy tắc đánh dấu theo từng khoá, không phải lựa chọn văn phong.

  `ñāteyyaṁ daṭṭheyyaṁ patteyyanti` giữ nguyên "know or see or reach" như bản đã ghim.
  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
