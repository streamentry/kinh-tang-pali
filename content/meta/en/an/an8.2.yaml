notes: |-
  10.2 theo mẫu mn146:5.4 (Pāli đồng mẫu “idaṁ, bhante, kathaṁ; imassa kvattho” mà
    Sujato dịch “Why, sir, does it say this? What does that mean?”), đổi ngoặc
    ‘ ’ thành “ ” cho khớp Pāli an8.2. 10.3 Pāli gần đồng chữ an6.51:3.7 và 4.9:
    3.7 Sujato lược tân ngữ (“reveal what is hidden”), 4.9 giữ tân ngữ (“reveal to
    Ānanda what is hidden”); ở đây tân ngữ là “them” (vị thầy ở 10.1) nên theo 4.9:
    “reveal to them what is hidden …”. 16.2/16.6 theo mẫu dn22 (“Such is
    form/consciousness, such is the origin of …, such is the disappearance of …”;
    “disappearance” cho atthaṅgama đã đếm); 16.2 giữ “;” cuối như Pāli.

    BẤT ĐỊNH: giữ hay lược tân ngữ ở 10.3 là phán đoán (hai tiền lệ Sujato ngược
    nhau) — terminology 9.3, ambiguity_integrity 9.2.

    Lớp lấp: 4 khoá nằm ở phần bản đã ghim đã lược. Triangulation 8.0: không có
    bản Anh độc lập phủ.
