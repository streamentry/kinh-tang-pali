notes: |-
  Mười khoá lấp đều nằm ở mục 3: Tôn giả Sāriputta kể lại buổi sáng của chính mình cho Đức
  Thế Tôn. Pāli ở mục 1–2 kể việc ấy ở ngôi thứ ba, mục 3 đổi sang ngôi thứ nhất (`ahaṁ`,
  `mayhaṁ`) và lặp lại đúng các mệnh đề ấy. Vì vậy **không dịch mới**: lấy lại bộ từ của mục
  1–2 trong chính bài này, chỉ đổi chủ ngữ và thêm `sir` cho `bhante` —
  3.1 ← 1.1 · 3.3 ← 1.4 · 3.4 ← 1.5 · 3.5 ← 1.6 · 3.6 ← 1.7 ·
  3.7 ← 2.1 · 3.8 ← 2.2 · 3.9 ← 2.3 · 3.10 ← 2.4 · 3.11 ← 2.5.
  Đo bằng máy: **2 khoá y nguyên từng chữ** với tầng đã ghim (3.7 = 2.1 — Pāli hai khoá này
  **trùng nguyên văn**, nên bắt buộc phải dùng lại; 3.8 = 2.2, chỉ khác vị trí dấu nháy
  `saupādiseso … ’ti` thay cho `… ”ti`), và 8 khoá còn lại là bản chuyển sang ngôi thứ nhất của
  đúng dải ấy.

  3.4 giữ chữ thường đầu câu vì Pāli khoá này bắt đầu bằng `yannūnāhaṁ` nối tiếp 3.3 (Pāli 3.3
  kết `;`, và ở mục 1 tầng ghim cũng tách `;` / `”ti` thành hai khoá y hệt thế này).

  BẤT ĐỊNH CẦN GHI: 3.2 (`Tassa mayhaṁ, bhante, etadahosi:`) cũng trống ở tầng đã ghim và nằm
  trong tập lấp được, nhưng **không thuộc lát này**. Vì vậy cột Anh của người đọc đọc 3.3 ngay
  sau 3.1 mà thiếu vế dẫn “Then it occurred to me:”. Ghi thẳng thay vì bịa vế dẫn. 3.10 giữ
  `thinking:` như tầng ghim ở 2.4 để 3.11 (trong dấu nháy) còn chỗ bám. 3.11 là nháy lồng: Pāli
  mở `"` rồi `‘`, đóng `’` rồi `ti.` — bản lấp là `"'…’"`, vế trong lấy nguyên của 2.5.

  Không có dấu lược trong Pāli của cả mười khoá (đã kiểm: không khoá nào chứa `…`).

  TRIANGULATION THẤP NHẤT TRONG LÁT, VÀ LÝ DO ĐO ĐƯỢC: bài này **chưa có bản Việt nào** —
  không có `content/translation/vi/project/sutta/an/an9.12_translation-vi-project.json` và cũng
  không có `content/meta/sutta/an/an9.12.yaml`. Nên lớp lấp không có tầng Việt nào để đối chiếu
  nghĩa, kể cả bản Việt hiện hành (`vietnamese-current`) cũng không phủ bài này ở commit đã
  ghim. Vì vậy `triangulation` 7.5 — thấp bằng mức dùng cho bài có cùng họ công cụ, và
  **không** tuyên bố đã đối chiếu Anh độc lập: hai tầng đối chiếu là Pāli root và bản Sujato
  đã ghim (60 khoá, trong đó 48 khoá có văn bản).

