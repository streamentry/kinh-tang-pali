notes: |-
  **Phân loại 23 khoá (đo bằng máy): A = 9 · B = 12 · C = 2 · D = 0.** Cả 23 khoá nằm trong tập khoá tầng Anh đã
  ghim để trống. Bài là lời kể lại của Sāriputta (`4.x`) lặp lại các suy nghĩ ở `1.x`–`2.x`, rồi các cặp “tôn trọng / không
  tôn trọng” rút gọn bằng `…pe…`.

  **Nhóm 1 — `4.1`–`4.16`, kể lại.** Tầng đã ghim gộp cả đoạn kể lại vào `3.1` (“told the Buddha of his thoughts while on
  retreat”) và để trống `4.1`–`4.16`. Lớp lấp dựng lại bằng lời của Sujato ở `1.x`–`2.x`:
  · A: `4.2` ← `1.2` (1,00; đổi “→‘ vì Pāli mở nháy đơn), `4.9` ← `2.2`, `4.10` ← `2.3`, `4.11` ← `2.4`, `4.12` ← `2.5`, `4.13` ← `2.6`,
    `4.14` ← `2.7`, `4.15` ← `2.8`, `4.16` ← `2.9` (tất cả 1,00): lấy nguyên lời.
  · B: `4.1` ← `1.1` (0,63) “Sir, as I was in private retreat this thought came to my mind,”; `4.3` và `4.8` ← `1.3` (0,55) “Then, sir,
    I thought,”; `4.6` ← `1.10` (0,44) “A mendicant should honor and respect and rely on hospitality …”.
  · C: `4.7` “develop the skillful.’” — mảnh `kusalaṁ bhāveyyā’ti.` nối sau `…pe…` của `4.6`.
  **Ngoặc.** `4.13` bỏ ‘ mở và `4.14` bỏ ’ đóng của lời đã ghim vì Pāli `4.13`–`4.14` không có nháy (lời đã ghim `2.6`–`2.7`
  có vì Pāli `2.6` mở ‘); `4.16` thêm ’ trước ” vì Pāli là `cā’”ti` còn `2.9` đã ghim chỉ có ”.

  **Nhóm 2 — hai khoá cố ý lệch tầng đã ghim (`4.4`, `4.5`).** Pāli `4.4` trùng nguyên văn với `1.4`, `4.5` với `1.5`; nhưng
  lời đã ghim `1.4` là “A mendicant should honor and respect and rely on the Teacher …” — cắt bỏ vế “to give up the
  unskillful and develop the skillful” của Pāli và thêm `…` dù Pāli `1.4` không có `…pe…` — còn `1.5` là mảnh “the teaching …”
  nối từ `1.4`. Chép nguyên văn sẽ cho `4.4`–`4.5` hai mảnh cụt. Lớp lấp viết thành câu đủ: `4.4` ← `5.2` (0,96) “A mendicant
  should honor and respect and rely on the Teacher, to give up the unskillful and develop the skillful.” (đây là lời đã ghim ở
  `5.2`, nơi Pāli có đủ), `4.5` ← `5.3` (0,35) “…the teaching …” (Pāli `4.5` có `…pe…`, giữ một `…`). Đo: Pāli `1.4` 0 dấu `…`,
  lời đã ghim 1; Pāli `1.5` có `…pe…`, lời đã ghim 1.

  **Nhóm 3 — sáu khoá `So vata, … bhavissatīti …` với `…pe…` (B).** `13.1` ← `12.1` (0,59), `15.1` ← `14.1` (0,57), `17.4` ← `10.2` (0,94),
  `18.1` ← `11.1` (0,95), `20.1` ← `13.1` (0,88), `22.1` ← `15.1` (0,90). Với `13.1`, `15.1`, `20.1`, `22.1` Pāli có `…pe…` giữa
  chuỗi (“satthari sagāravo …pe… appamāde sagāravo”): lớp lấp giữ đúng một `…` (“… and diligence”) thay vì mở rộng danh
  sách. `17.4`, `18.1` Pāli viết đủ nên chép lời `10.2`, `11.1` (chỉ khác `bhante` ↔ `sāriputta`, Sujato bỏ hô cách).

  **C (1 khoá còn lại).** `23.2` “Sixth.” — nhãn `Chaṭṭhaṁ.`; đúng vị trí (`an7.65` `Paṭhamaṁ`, …, `an7.69` `Pañcamaṁ`, `an7.71` `Sattamaṁ`).

  **Dấu lược:** Pāli 6 khoá có `…pe…` (`4.5`, `4.6`, `13.1`, `15.1`, `20.1`, `22.1`); lớp lấp có đúng 6 dấu `…`. Điểm ngoài lát,
  chỉ báo: lời đã ghim `13.2` mở rộng `…pe…` của Pāli (“respects the Teacher, the teaching, the Saṅgha, the training,
  immersion, and diligence respects hospitality”), `20.2`/`22.2` cũng vậy.

  **Khoá trống còn lại: 0.** 5 khoá dưới ngưỡng 40 ký tự nên không vào coverage nhưng vẫn lấp: `4.5` (24), `4.6` (39), `4.7` (20),
  `4.12` (15), `23.2` (9). 18 khoá vào coverage.

