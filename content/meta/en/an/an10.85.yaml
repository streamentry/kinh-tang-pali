notes: |-
  Tám khoá này là **chép lại nguyên văn**, vì Pāli của chúng **trùng byte** với tám khoá đã được tầng Anh đã ghim dịch. an10.85 nói một công thức **hai lần**: một lần ở `4.2`-`15.2` (Tathāgata soi tâm người khoe khoang), và một lần nữa ở `19.2`-`30.2` (tức `21.1` mở lại). Sujato dịch vòng đầu `6.3`, `7.2`-`15.2` rồi **bỏ trống** vòng sau `21.3`, `22.2`-`29.2` — đúng tám chỗ, cùng thứ tự, cùng mười nguyên nhân.

  Đối chiếu từng khoá (Pāli root đã ghim; bản Anh `translation/en/sujato/sutta/an/an10/an10.85_translation-en-sujato.json` tại commit đã ghim trong `source/upstream-manifest.json`):
  - `22.2` ≡ `7.2` `assaddhiyaṁ kho pana tathāgatappavedite dhammavinaye parihānametaṁ.` → "and lack of faith means decline …"
  - `23.2` ≡ `8.2` `appasaccaṁ …` → "and lack of learning means decline …"
  - `24.2` ≡ `9.2` `dovacassatā …` → "and being hard to admonish means decline …"
  - `25.2` ≡ `10.2` `pāpamittatā …` → "and bad friends mean decline …"
  - `26.2` ≡ `11.2` `kosajjaṁ …` → "and laziness means decline …"
  - `27.2` ≡ `12.2` `muṭṭhassaccaṁ …` → "and unmindfulness means decline …"
  - `28.2` ≡ `13.2` `kohaññaṁ …` → "and deceitfulness means decline …"
  - `29.2` ≡ `14.2` `dubbharatā …` → "and being burdensome means decline …"

  ⚠ Vì sao giữ dấu ` … ` ở cả tám khoá dù Pāli không có `…pe…`. Đó là **dấu lược của chính bản ghim**: Sujato viết `parihānametaṁ` thành "means decline …" ở `7.2`-`14.2` vì câu đầy đủ ("means decline in the teaching and training proclaimed by the Realized One") đã nói ở `6.3` và lại ở `15.2`. Bỏ dấu `…` đi thì cột Anh sẽ có hai cách phát âm khác nhau cho **cùng một Pāli**, và người đọc sẽ tưởng `29.2` không nói gì về giới hạnh luật của Đức Thế Tôn. Đây là chép lại cách dịch đã có, không phải bịa thêm chữ. (Ngược lại: `30.2` — không thuộc lát này — Sujato viết đủ "in the teaching and training proclaimed by the Realized One", khớp với `15.2`; tôi để nguyên sự phân biệt đó.)

  Nhịp câu tiếng Anh không lặp khuôn: tám khoá là tám mệnh đề **khác nhau** về nội dung (saddhi / pasacca / docasaccatā / pāpamittatā / kosajja / muṭṭhassacca / kohañña / dubbhara), và mỗi mệnh đề được chép đúng như bản ghim — kể cả khi Sujato dùng số ít "means" (`7.2`, `8.2`, `9.2`) xen với số nhiều "mean" (`10.2`-`14.2`). Không đồng nhất hoá, vì đồng nhất hoá là sửa bản ghim trong lớp lấp.

  ⚠ **Bài này không có bản Việt canonical.** Không có tệp `content/translation/vi/project/sutta/an/an10.85*` và cũng không có `content/meta/sutta/an/an10.85.yaml`. Nên "đối chiếu bản Việt hiện hành" **không thực hiện được cho bài này** — tôi ghi rõ thay vì giả vờ đã đối chiếu. Tầng `vietnamese-current` chỉ có Pháp Cú nên cũng không có. Vì không có tầng Việt nào, tôi cũng **không** dùng `7.5`: điều kiện hạ điểm là scorecard Việt cùng công cụ, mà ở đây không có scorecard Việt để so. `triangulation` = **8.0** là trần của lớp lấp nói chung: không có bản Anh độc lập nào phủ các khoá này tại commit đã ghim, nên viết ra không có gì để đối chiếu.

  Dấu lược: đếm từng khoá. **Hai** khoá Pāli của an10.85 mang `…pe…` là `4.3` và `19.3`, và Sujato **giữ** dấu lược ở cả hai ("I enter and emerge from the first absorption … "). Tám khoá lấp ở đợt này không mang `…pe…` nào, nên không khoá nào được phép thêm dấu lược; tám khoá giữ nguyên dấu ` … ` sẵn có trong cách dịch đã chép.

  Coverage đo lại bằng phép của kho (`≥ 40` ký tự, bỏ khối `:0`): Pāli có nội dung 54 khoá, `english-sujato` phủ 46 (0.852), thêm tám khoá lấp này thành 54/54 = 1.0, vượt ngưỡng 0.8 ở `source/layers.yaml`.

  Bài này **không** có entry trong `content/meta/reference-gaps.yaml` — coverage trước lớp lấp là 46/54 = 0.852, đã trên ngưỡng 0.8 — nên không có record thừa nào phải gỡ sau khi lớp lấp này `published`.

