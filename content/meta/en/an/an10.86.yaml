  tập lấp của lát này hay của lát kia ⇒ **không có nguy cơ hai lớp lấp mâu thuẫn ở cùng Pāli**.
  Khung câu thì hai lát dùng chung (`But … means decline in the teaching and training proclaimed by
  the Realized One.`, lấy từ `10.3`/`13.3`/`5.3` của `an10.84`), và bốn danh từ `-ārāmatā` của lát
  này không xuất hiện trong `an10.84` nên không va chạm. `an10.84` lấp `Catutthaṁ.` = "Fourth." còn
  lát này `Chaṭṭhaṁ.` = "Sixth." — mỗi bài theo đúng Pāli của nó.

  **Chưa phân xử được, không đoán:** không có. Nhưng một điểm đáng nói là `13.2`/`13.3` chỉ có
  `uddhacca` (xao động) chứ **không** có `kukkucca` (hối tiếc) như `an1.14`; tôi dịch "restlessness"
  theo đúng `13.1` của tầng ghim và không tự thêm vế thứ hai.

  Điểm `technical_integrity` = **9,6** vì lát này bị cấm chạy cổng, nên **không** tuyên bố technical
  gate pass. Còn lại: `npm run validate`, `npm test`, `npm run check`, `npm run build`.