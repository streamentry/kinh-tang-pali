notes: |-
  NĂM/BA KHOÁ NÀY LẤP CHỖ TRỐNG QUANH MỘT BẢN ANH ĐÃ GHIM, không phải bản Anh tự
  dịch từ đầu: `an3.128` có 35/42 khoá có chữ trong tầng đã ghim, `an5.249` 26/34,
  `ud6.2` 29/34 (đo bằng `sutajato()`). Tuy vậy `triangulation` vẫn đặt 8.0 cho CẢ bài
  để lát đồng nhất, và **lý do ở đây khác**: các khoá phải điền đều là **lần nhắc lại
  mà bản đã ghim đã lược**, nên không có câu nào độc lập để so. Bộ từ lấy lại từ đúng
  bản Anh đã ghim của chính bài này — không phải từ bản Anh nào khác, và không phải
  từ bản Việt.

  LUẬT 3 "PĦLI TRÙNG THÌ DÙNG LẠI LỜI ĐÃ CÓ" — MÁY KHÔNG BẤT ĐƯỢC Ở LÁT NÀY, TỰ GIỮ
  BẰNG SCRIPT: `save_fill` chỉ in cảnh báo khi Pāli trùng ở khoá khác **có bản Anh đã
  ghim**; 12 bài của lát không có bản ghim nên nó im lặng hoàn toàn. Đã viết
  `_re0_dup.py` đếm Pāli trùng giữa 15 bài của lát với toàn bộ tầng `en/project`
  (822 khoá): 9 cụp trùng trong chính lát (24 khoá là bản lặp) và 18 cụp trùng với
  bài khác; mỗi cụp giữ **một lời duy nhất**, và cụp nào đã có tiền lệ commit thì dùng
  đúng lời đó.

  BẢN VIỆT DỰ ÁN `content/translation/vi/project/sutta/an/an3.128_translation-vi-project.json` có đủ 42/42 khoá; dùng để **đối chiếu nghĩa**, không làm nguồn — nó cùng do một agent chấm nên không phải là lớp đọc độc lập, và `vietnamese_clarity` / `han_viet_balance` ở đây chấm theo bản Việt ấy chứ không theo một bản Việt đã xuất bản. Chỗ nào hai lớp bất đồng thì Pāli là authority và bất đồng được ghi ở mục dưới.

  TIỀN LỆ ĐẾM ĐƯỢC, lấy từ đúng bản Anh đã ghim của bài này: `kaṭuviya` →
  "bitter" (2.1, 4.5), `āmagandha` → "putrefaction" (2.2, 4.6), `makkhikā` → "flies"
  (2.2, 4.6), `saṁvegamāpādi` → "struck with a sense of urgency" (2.3; 16 lượt trong cả
  tầng Sujato), `nivāsetvā pattacīvaramādāya` → "robed up … taking his bowl and robe"
  (1.2), `goyogapilakkha` → "cow-hitching place at the wavy leaf fig" (1.3),
  `rittassāda bāhirassāda` → "looking for pleasure in external things" (1.3),
  `asampajāna asamāhita vibbhantacitta pākatindriya` → "unmindful, without situational
  awareness or immersion, with straying mind and undisciplined faculties" (1.3),
  `bhikkhave` → "mendicants" (4.3). `ovadito` gộp vào "by this advice of mine" đúng như
  2.3 gộp "Hearing this advice of the Buddha"; `netaṁ ṭhānaṁ vijjatī` ở 4.2 dịch
  "This is not the case.", cùng cách bản đã ghim dùng ở 4.7 và 5.4.

  BIÊN TẬP ĐÃ CHỌN, GHI RÕ: 3.1–4.3 là lần Đức Thế Tôn **nhắc lại** lời mình vừa nói
  (3.1↔1.2, 3.2↔1.3, 4.1↔2.1, 4.2↔2.2, 4.3↔2.3), nên phải đổi sang ngôi thứ nhất ("I
  robed up", "I saw"). Giữ nguyên thì bài sẽ tự mâu thuẫn với chính phần đã ghim.

  LƯỢT REVIEW ĐỐI KHÁNG ĐÃ BẮT ĐƯỢC 1 LỖI: 3.2 ban đầu thiếu "mendicants" — Pāli 3.2 có
  `bhikkhave` (Pāli 1.3 thì không, nên bản đã ghim ở 1.3 không có, và bản nháp của tôi
  lúc đầu cũng bỏ sót ở 3.2). Đã sửa.

  BẤT ĐỊNH ĐÃ GHI: 3.3 (`Disvā taṁ bhikkhuṁ etadavocaṁ`) và 9.5 (`Chaṭṭhaṁ.`) cũng
  fillable nhưng KHÔNG thuộc lát này (lát khác đang ghi) — tôi không chạm vào. Ngoặc
  đóng của 3.1 rơi vào 4.2 chứ không phải 4.3, vì Pāli 4.2 kết thúc bằng `’ti.`; bản Anh
  giữ đúng vị trí đó, và số ngoặc phải khớp Pāli theo từng khoá.

  CỔNG KỸ THUẬT: `save_fill` PASS cho từng khoá (5 luật cơ học: chỉ điền khoá Pāli có
  chữ và bản Anh đã ghim để trống; số dấu lược / ngoặc mở / ngoặc đóng / dấu hỏi khớp
  Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không khoảng
  trắng đôi). Quét bổ sung trên riêng 15 tệp của lát: 0 cờ "từ Pāli lọt", 0 cờ "sót
  `pe…`", 0 cỗ "ngoặc treo", 0 cờ khoảng trắng đôi; 3 cờ "lặp cụm" đều hợp lệ và đã
  giải trình trong `notes` (xem `mil3.7.13.yaml` và `ud6.2.yaml`). CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm
  chạy vì chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity`
  chấm 9.8 chứ không 10.0, và đây là việc NGƯỜI ĐIỀU PHỐI phải chạy lại trước khi coi
  bài là xuất bản — ghi thẳng ra đây thay vì để trong im lặng.

