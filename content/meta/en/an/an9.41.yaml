notes: |-
  Bốn khoá là Ānanda dẫn lại nguyên văn 3.1-3.4 cho Thế Tôn, nên giữ nguyên bộ từ đã ghim:
  6.2 gộp 3.1+3.2 ("Honorable Ānanda, we are laypeople … But renunciation seems like an abyss."),
  6.3 giữ bộ từ 3.3 ("there are very young mendicants whose minds leap forth … They see it as
  peaceful."), thêm "sir" vì Pāli có "bhante"; 6.4 giữ nguyên 3.4 ("Renunciation is the dividing
  line …"). 6.1 theo "says this: " (19×) và "The householder Tapussa" ở 2.1 đã ghim.
  Dấu ngoặc làm theo từng khoá: 6.1 mở “ (mo=1 dong=0), 6.2 ‘…’ (mo=1 dong=1), 6.3 chỉ mở ‘
  (đóng ở 6.4), 6.4 đóng ’ (lớp 6.2) rồi ” (lớp 6.1) thành ’.” (mo=0 dong=2).
  Bất định: phép gộp 3.1+3.2 vào một khoá và ngoặc kép lồng nhau là quyết định của người lấp,
  nên ambiguity_integrity hạ 9.3. Không blocker.
