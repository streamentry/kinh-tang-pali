notes: |-
  `1.10` và `2.10` lặp lại gần như trùng nguyên văn hai câu mở đầu `1.1` và `2.1`
  (`1.10` khác `1.1` ở dấu `“` mở đầu; `2.10` khác `2.1` ở chữ `pana`). Bản đã ghim
  đã dịch cả hai câu gốc, nên bản này chép lại y nguyên — chỉ bỏ cặp `“…”` vì hai khoá
  lặp lại không mang dấu nháy. Giữ nguyên cả dấu gạch dài và `they’re`/`there’s` của
  bản đã ghim: cột Anh phải là MỘT cột, không phải hai bản dịch cạnh nhau.

  Lưu ý cho người đọc: `1.10` nằm sau `1.9` (rỗng ở bản đã ghim, ngắn hơn 40 ký tự
  nên không tính vào coverage) nên câu lặp trông như đột ngột. Đó là cấu trúc Pāli:
  bài này dựng bằng cách trích lại chính nó.

  Triangulation 8.0: không có bản Anh độc lập phủ cho hai khoá này.

  Lớp lấp: 2 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
