notes: |-
  Reuses Sujato's 2.5/2.10 and 3.5/3.10 word for word except two mechanical
    necessities. First, "…pe…" is kept as a bare "…" exactly where the P has it,
    never expanded. Second, the inner curly quotes of "No!" and "Thank you!" cannot
    be kept: the P has 0 openers and 1 closer per key, so the fill says "by saying
    no" and "but say thank you" ("saying "No"" occurs only 2x upstream, both in the
    full sentences). Meaning is preserved; the loss of quotation marks is recorded
    here, hence ambiguity 9.3. "a middle … or a junior mendicant" follows Sujato's
    own article use in 2.7 ("a middle or a junior mendicant"). 2.11/3.11 use a bare
    "…" where 2.6/3.6 use "…pe…" but abbreviate the same passage, so all four share
    two renderings.
    Triangulation is capped at 8.0 for every text of the fill layer.
