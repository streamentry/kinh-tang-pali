notes: |-
  Năm khoá 2.3–2.7 lặp lại **đúng nguyên văn** năm khoá 1.2–1.6 của chính bài này
  (trừ 2.7 khác `hoti.`) — đây là lần dịch thứ hai của `mahāmegho` ở 2.1–2.7, nên
  luật của `sn11.24` bắt dùng lại y hệt. Cả hai vòng đều khớp với `an8.38:1.2` đã
  ghim, là nơi cụm `mātāpitūnaṁ / puttadārassa / dāsakammakaraporisassa /
  mittāmaccānaṁ / samaṇabrāhmaṇānaṁ` được dịch thành "mother and father / children
  and partners / bondservants, workers, and staff / friends and colleagues /
  ascetics and brahmins".

  2.3 lặp lại cụm "For the benefit, welfare, and happiness of" dù 2.2 đã kết bằng
  "…happiness of the people. …" — đúng như Sujato đã làm ở 1.2 sau 1.1, nên giữ.

  Bất định đã xử lý: Pāli ở 2.7 kết `hotīti.` — cache bilara ghi `hotīti` (dấu sắc
  dài trên chữ `i`) chứ KHÔNG có `’` trước `ti`, khác hẳn 1.6 là `hoti.`. Số ngoặc
  đóng theo từng khoá vì thế là 0, nên bản Anh không mang dấu ngoặc đóng. Đây là
  dữ liệu nguồn, không phải lựa chọn của tôi.

  Lớp lấp: 5 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn
  bị mất.