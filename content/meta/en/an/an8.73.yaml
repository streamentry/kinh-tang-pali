notes: |-
  BẢN DỊCH LẤP 6 KHOÁ, TẤT CẢ ĐỂ TRỐNG Ở TẦNG ĐÃ GHIM; không có blockquote tham chiếu hay Pāli rỗng, nên không có khoá nào bị bỏ.

  ĐO ĐƯỢC TRƯỚC KHI DỊCH — chỉ có ĐÚNG HAI DẢNG PĀLI TRONG SÁU KHOÁ:
  - 10.4 = 10.8 = 10.12 = 11.3, đều là `Yo cāyaṁ, bhikkhave, bhikkhu evaṁ maraṇassatiṁ bhāveti:`
  - 10.6 = 10.10, đều là `yo cāyaṁ, …` (chữ thường)
  Luật 3 vì thế bắt buộc một bản cho mỗi nhóm, và bốn khoá kia phải y hệt nhau.

  TIỀN LỆ ĐẾM ĐƯỢC, KHÔNG BỊA MÔT TỪ:
  - Trong chính bài này Sujato đã ghim đúng cụm này hai lần: 10.2 → “The mendicants who develop mindfulness of death by wishing”, 11.1 (Pāli có thêm `ca khvāyaṁ`) → “But the mendicants who develop mindfulness of death by wishing”. Lấy y hệt cụm của 10.2.
  - Trong tầng lấp của chính dự án đã có tiền lệ gần như trùng: `an6.19` (bài song song, cùng công thức niệm tức) đã lấp 9.1/10.1/11.1/14.1 bằng “As to the mendicants who develop mindfulness of death by wishing”. Đếm cụm `develop mindfulness of death` trong `content/translation/en/project/sutta/` **trước khi lát này viết** = **4** lần, cả 4 ở an6.19 (sau lát này là 10). Cụm ở đây khớp tiền lệ đã ghim trong bài (`The mendicants …`), chỉ khác mạo từ dẫn nhập.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU — CHỮ THƯỜNG Ở 10.6 VÀ 10.10:
  Pāli viết `yo cāyaṁ` (chữ thường) ở 10.6 và 10.10 vì hai khoá này nối tiếp mệnh đề trước đó dấu chấm phẩy (10.5 và 10.11 kết bằng `assā’ti;`), còn bốn khoá kia viết hoa vì mở câu mới (sau `assā’ti.`). Không có tiền lệ Sujato nào cho cặp chữ thường / chữ hoa này ở đúng công thức, nên đây là lựa chọn biên tập của lớp lấp: nhóm hoa → “The mendicants …” (khớp 10.2 đã ghim), nhóm chữ thường → “and the mendicants …” để nối đúng mệnh đề. Hệ quả người đọc thấy: 10.5 “or to live for a day …” → 10.6 “and the mendicants who develop mindfulness of death by wishing”. `ambiguity_integrity` hạ 9.1 và `vietnamese_clarity` 9.2 vì cột Anh ở mục 10–11 lặp lại gần như nguyên văn sáu lần — đó là cấu trúc Pāli của bài (Sujato đã dịch sẵn 10.3/10.5/10.7/10.9/10.11/11.2/11.4 và 10.2/11.1), không phải lỗi lặp của người dịch, và không thể rút gọn.

  DẤU LƯỢC: không có `…pe…` trong sáu khoá này.

  TRIANGULATION 8.0, KHÔNG CAO HƠN: lớp lấp do chính người chấm viết, không có bản Anh độc lập phủ cho các khoá này ở commit đang ghim; mọi khoá dựa từ Pāli root + cụt đã ghim trong bài.

