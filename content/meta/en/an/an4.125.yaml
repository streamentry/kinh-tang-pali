notes: >-
  Bản đã ghim đặt mệnh đề sinh vào 2.7, trong khi Pāli đặt nó ở 2.6. Bản này phải
  đặt lại "they're reborn" ở đầu 2.6, nếu không câu sẽ đứt. `Ābhassarānaṁ` và
  `subhakiṇhānaṁ` dịch theo đúng cặp mà bản đã ghim dùng cho `vehapphalānaṁ`:
  "abundant light" và "spacious radiance" — `subhakiṇhā` không phải "abundant fruit"
  (mà `vehapphala` mới là). `kappā` giữ "eon" vì đó là đơn vị của cả ba tầng trời
  trong đoạn này.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
