notes: |-
  2.5 = 1.7, 2.6 = 1.8 = 3.5, 2.7 = 1.9 = 3.6 (Pāli đồng chữ) -> nguyên văn Sujato
    (“So they don’t frequent other mendicants,” / “they don’t hear the true
    teaching,” / “and they fall away from the true teaching.”), kể cả dấu phẩy
    nối mạch. 2.3 theo mẫu trích dẫn 1.5 (“This individual dear and beloved to me
    has been … by the Saṅgha.”) + động từ 2.1 (“makes them sit at the end of the
    line”) chuyển bị động: “has been made to sit at the end of the line”.

    BẤT ĐỊNH: thể bị động ở 2.3 không có tiền lệ trực tiếp trong Sujato —
