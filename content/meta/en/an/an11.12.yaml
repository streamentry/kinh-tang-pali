notes: |-
  **Tiền lệ mạnh nhất của lát này là `an6.10`** — cùng khung, cùng phần `devatānussati`, và Pāli `5.7` / `5.11` **giống hệt** `an6.10:7.3` / `7.7`. Tầng ghim đã dịch `an6.10:7.2` và `7.3`, còn `7.4`–`7.7` thì để trống.

  `1.4` / `2.2` / `2.3`: Pāli `1.4` **giống hệt** `2.3`, và `2.2` + `2.3` **ghép lại** chính là `2.6` + `2.7` đã ghim. Nên tôi dùng lại nguyên văn cách dịch đã ghim ở `2.6`/`2.7`: "when his robe was finished and the three months of the rains residence had passed the Buddha would set out wandering".

  ⚠ **Một dấu lưới có chủ ý: bỏ `kira`.** Ở `2.2` và `2.6`, Pāli có `sambahulā **kira** bhikkhū`; bản ghim ở `2.6` không có "they say", và `2.2` có **cùng Pāli**. Tôi theo bản ghim để bài không tự mâu thuẫn. Hệ quả: bản Việt canonical có "Nghe nói" (giữ `kira`) nên hai cột lệch nhau ở một chỗ — đã ghi ở đây thay vì im lặng. Lựa chọn còn lại là giữ "they say" và chấp nhận bài nói hai cách cho cùng một câu Pāli; tôi cho rằng bất nhất bên trong bài nặng hơn bất nhất giữa hai lớp.

  `5.6`–`5.11`: bám `an6.10:7.2` ("the gods of the four great kings …"). Ở `5.7` và `5.11` tôi **chỉ dịch đúng một phẩm chất mà Pāli nêu** (`saddhā` / `paññā`), khác bản ghim ở `an6.10:7.3` vì bản ghim ấy phải bung cả danh sách bị lược. Cú pháp `samannāgatā … saddhāya` là "đầy đủ (cái làm công cụ)", **không** phải quan hệ nhân quả, nên tôi không dịch là "because of their faith". `mayhampi tathārūpā saddhā saṁvijjati` là "lòng tin như thế ấy cũng sinh khởi nơi Ta", dịch "I, too, have faith of that sort".

  ⚠ **Ba lỗ trống nằm ngay giữa lát.** `5.8` (`Yathārūpena sīlena …`), `5.9` (`sutena …`), `5.10` (`cāgena …`) để trống ở tầng ghim nhưng chỉ **21, 9 và 9 ký tự** nên dưới ngưỡng 40, không vào lát này. Trên reader sẽ thấy `5.7` nhảy thẳng sang `5.11`, mất ba vế giới hạnh / sự đã học / bố thí. Tôi **không** tự ý lấp vì ngoài lát được giao.

  ⚠ **Lớp lấp này KHÔNG phải lớp đọc Anh độc lập cho bài này.** `content/meta/sutta/an/an11.12.yaml` ghi `quality.assessed_by: "OpenCode Space Bunny Free (agent)"`. `triangulation` hạ xuống **7.5**; `validate` sẽ **cảnh báo** rằng phủ Anh ở bài này dựa trên bản lấp của chính người viết bản Việt. Tôi **không sửa** scorecard tiếng Việt.

