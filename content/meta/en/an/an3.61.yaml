notes: |-
  Tiền lệ: `1.4`, `1.6`, `1.8` (đã ghim) đã dịch sẵn cụm `yaṁ kiñcāyaṁ purisapuggalo
  paṭisaṁvedeti sukhaṁ vā dukkhaṁ vā adukkhamasukhaṁ vā sabbaṁ taṁ …` thành "Everything this individual
  person experiences—pleasurable, painful, or neutral—is because of …". `2.2`, `4.2`, `6.2` (đã ghim) dùng
  "an individual person", nên tôi theo "an individual person" cho ba khoá này vì chúng nằm ngay trong
  cùng câu, và theo cách gạch dài của `1.4`–`1.8` cho vế "pleasurable, painful, or neutral" (Sujato đã
  lược vế này ở `2.2`).

  Bất định về dấu câu, ghi lại đầy đủ vì người đọc sẽ thấy: ba khoá này là câu hỏi và Pāli mang `?`.
  `2.4` có HAI dấu đóng (`”’ti?`): `”` đóng lời của các Sa-môn Bà-la-môn, còn `’` đóng ngoặc ngoài mà
  `2.3` mở. Vì vậy bản Anh phải kết bằng `”?’` cho khớp số ngoặc theo từng khoá. `4.4` và `6.4` chỉ có
  một dấu đóng (`’ti?`) vì ngoặc ngoài mở ở `4.3` và `6.3`, nên bản Anh kết bằng `’?`. Lớp Việt của
  chính kho làm y hệt: `2.4` = `”?’`, `4.4` và `6.4` = `’?`. Vì bản Anh đã ghim ở `2.3`/`4.3`/`6.3`
  kết bằng `?’` (Sujato đóng câu hỏi sớm hơn Pāli, vốn dùng dấu hai chấm), ba khoá của tôi bắt đầu bằng
  chữ thường — đó là cách nối tiếp câu, không phải lỗi chính tả.

  Triangulation 8.0: đây là lớp lấp, không có bản Anh độc lập phủ cho các khoá này nên viết ra không có gì để đối chiếu; điểm này nằm sẵn trong bản chất của lớp, không phải thiếu sót phát sinh.
