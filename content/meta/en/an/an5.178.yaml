notes: |-
  an5.178 là `Rājāsutta` — năm tội lớn, mỗi tội một vòng sáu khoá: Đức Thế Tôn đặt câu hỏi
  (`X.1`–`X.4`) → `Mayāpi kho etaṁ, bhikkhave, neva diṭṭhaṁ na sutaṁ` (`X.7`) → **Đức Thế Tôn lặp lại
  đúng câu hỏi ấy nhưng đổi thành mệnh đề** (`X.8`–`X.9`) → nhưng báo cáo lại với tội khác (`X.10` trở đi).
  Sujato dịch cả vế hỏi và vế mệnh đề ở bốn vòng đầu, và **bỏ trống** vế lặp lại ở cả năm vòng.

  **Năm khoá `X.8` chép nguyên văn — đo bằng script, không đoán.** `1.8`, `2.8`, `3.8`, `4.8`, `5.8` đều
  trùng **byte** với `X.3` của chính nó, mà `X.3` đã có bản Anh ghim. Nên năm khoá tôi chép y nguyên, chỉ
  thêm dấu nháy mở `‘` mà Pāli có:
  - `1.8` ← `1.3` `of a person who has given up killing living creatures,`
  - `2.8` ← `2.3` `of a person who has given up stealing,`
  - `3.8` ← `3.3` `of a person who has given up sexual misconduct,`
  - `4.8` ← `4.3` `of a person who has given up lying,`
  - `5.8` ← `5.3` `of a person who has given up intoxicants of beer, wine, and liquor,`

  Chữ `‘` mở đầu câu mà vế sau vẫn chữ thường (`‘of a person …`) trông lạ, nhưng đó **là** hình dạng của
  Pāli: `X.3` cũng bắt đầu bằng `‘ayaṁ puriso …` nối tiếp câu trước, và bản ghim cũng viết thường. Tôi giữ
  đúng cả hai tầng ấy thay vì tự sửa cho "đẹp".

  **Năm khoá `X.9` dựng lại, và chỗ này tôi cố ý KHÔNG chép bản ghim:**
  `X.9` khác `X.4` **đúng ba ký tự cuối** — `…karontī’”ti?` thành `…karontī’ti.`; phần chữ thì y hệt. Nên tôi
  lấy câu của `X.4` rồi đổi `?”` thành `.”`. Nhưng bản ghim ở `2.4`, `3.4`, `4.4` có **dấu lược `…`** ở
  giữa (`and the kings have them arrested for that …?”`) mà Pāli `2.9`/`3.9`/`4.9` **không hề có** — Pāli viết
  đủ cả `hananti vā bandhanti vā pabbājenti vā yathāpaccayaṁ vā karontī`. Theo BRIEF §10.1 (không bao giờ
  mở rộng lược) và luật của lớp lấp (dấu lược phải khớp Pāli **theo từng khoá**), tôi **không** chép dấu
  lược ấy; tôi dùng mẫu đầy đủ của `1.4` và `5.4` — hai nơi bản ghim cũng viết đủ. Hệ quả cần nói rõ:
  cột Anh ở `2.4` (ghim) hẹp hơn ở `2.9` (lấp) trong khi Pāli hai khoá ấy rộng như nhau. Chỗ lệch ấy là
  của bản ghim; sửa nó thuộc tầng `english-sujato`.

  **Một chỗ tôi đã phải chọn, và nói ra để người biên tập kiểm được:** `veramaṇihetu` (vì việc đã từ bỏ
  tội ấy) tôi dịch `for that`, theo đúng cách bản ghim dịch `veramaṇihetu` ở `1.4` và `5.4`. Lựa chọn còn
  lại là ghi rõ tội (`for abandoning theft`) như bản ghim làm với `pāṇātipātahetu` ở `1.12`; tôi không chọn
  cách ấy vì nó làm cột Anh của cả năm vòng không đều nhau, trong khi Pāli dùng đúng một công thức cho cả
  năm.

  **Dấu lược:** không khoá Pāli nào của an5.178 trong tập lấp mang `…pe…` hay `…` trần, nên không khoá lấp
  nào được thêm dấu lược.

  **Khoá trống còn lại:** `an5.178:5.18` = `Aṭṭhamaṁ.` — **9** ký tự Pāli, dưới ngưỡng 40 nên không tính
  coverage. Lấp được, nhưng ngoài lát `e12`.

  Điểm: `triangulation` = 8.0 vì `content/meta/sutta/an/an5.178.yaml` ghi `assessed_by: GLM-5.3 Flash
  (ZCode)` — khác họ công cụ `OpenCode Space Bunny Free`, nên chưa phải 7.5. Năm trong mười khoá là bản dịch
  đã xuất bản của chính dự án (chép nguyên từ `X.3`); năm khoá `X.9` là chép câu đã ghim ở `X.4` cùng khuôn,
  trừ việc bỏ dấu lược mà Pāli không có. Không có khoá nào phải tự dịch từ đầu.

