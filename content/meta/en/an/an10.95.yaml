notes: |-
  Quote-back thứ tư của lát này (sau `sn47.10`, `an10.75`): 4.1 đã ghim chỉ nói chung “When
  asked about all these points, worthy Gotama says that they have not been declared by him. ”,
  nên 4.2–6.10 là **Đức Phật kể lại** đúng mười cặp ở 1.3–3.9. Đọc lẻ sẽ thành mười câu hỏi
  trùng lặp vô nghĩa, nên mọi khoá lặp đều lấy y từ bản đã ghim (đã kiểm bằng máy, 10/10 mảnh câu
  là chuỗi con nguyên văn của bản ghim):

  - 6.1 = 3.1 và 6.7 = 3.7 **y nguyên văn trọn khoá**, kể cả dấu lược `…` (Pāli 6.1 y hệt 3.1
    với `…pe…`, 6.7 y hệt 3.7). KHÔNG mở rộng dấu lược.
  - 1.5 ← 1.3, 4.2 ← 1.3, 2.3 ← 2.1, 3.10 ← 3.8, 5.1 ← 2.1, 5.2 ← 2.1/2.2, 6.8 ← 3.8,
    6.10 ← 3.8/3.9.
  - Khung `…iti puṭṭho samāno:` dựng theo `sn44.6:1.5` (đã ghim) và lớp lấp `an4.36:3.3`
    (“‘Might you be a centaur?’ being asked, ”) — không phát minh khung mới.
  - 4.2 không dịch lại `vadesi` vì 4.1 đã ghim “says that …”; cùng cách `sn44.6:1.6–1.7`.

  HAI CHỖ LỆCH CẦN NÓI THẲNG:

  1. `etampi` (5.2, 6.10 cùng câu Pāli với 2.2 và 3.9): tầng ghim dịch “This has not been
     declared by me, Uttiya.” — **không** có “too”, dù Pāli là `etampi`. Lớp lấp bám y và cũng
     không thêm “too”, vì thêm vào thì cùng một câu Pāli mà 2.2/3.9 đã dịch sẽ bị dịch hai kiểu
     trong cùng một bài. (Ở `sn44.11` tầng ghim lại giữ “This too has not been declared by the
     Buddha. ” cho `etampi kho, vaccha, abyākataṁ bhagavatā` — khác bài, không áp được sang.)
  2. Dấu nháy: Pāli 1.5 / 2.3 / 3.10 kết bằng `’”`, vì lớp vỏ ngoài (`“`) của 1.3 / 2.1 / 3.8 đã
     bị tầng ghim đóng sớm ở 1.4 / 2.2 / 3.9. Giữ nguyên `’”` sẽ để lại một dấu đóng nháy kép
     không có dấu mở. Lớp lấp dùng cặp nháy đơn khép kín và **bỏ đúng một dấu `”` thừa** ở ba
     khoá đó. Đây là biên tập dấu câu, không phải đổi nghĩa; ghi ra đây để không ai tưởng là sót.
  3. Hệ quả của việc tái dùng **nguyên văn** 6.1 (= 3.1): trong cột ghim, dấu `“` mở ở 3.1 được
     đóng bằng `”` ở 3.8; trong đoạn kể lại 6.1–6.8 thì không có 3.8, nên `“` mở ở 6.1 không
     có dấu đóng. Pāli 6.1 dùng nháy đơn và đóng nó ngay ở 6.8, nhưng đổi sang nháy đơn sẽ ra
     `‘Then is this right: ‘The cosmos is finite …’` — hai dấu giống nhau liền nhau. Chọn giữ nguyên
     văn bản ghim và chấp nhận một `“` chưa đóng, vì luật tái dùng cách dịch đã có là bắt buộc còn
     hơn là đồng nhất nháy. Người đọc nên biết: đây là dấu vết của việc trích lại ở mức segment.

  Hệ quả gộp vế — 6.10: vế đầu `‘etampi kho, uttiya, abyākataṁ mayā—` nằm ở 6.9, Pāli chỉ 38 ký
  tự nên **dưới ngưỡng 40** và không thuộc tập lấp (tầng ghim cũng để trống). Không gộp thì 6.10
  mở đầu bằng vế thứ hai với một dấu nháy không đóng. Vì vậy lớp lấp gộp vế đầu vào 6.10; đây là
  hệ quả của ngưỡng đếm, sửa được bằng cách sửa luật đếm hoặc Pāli gốc chứ không sửa được bằng
  cách sửa lớp lấp. Vì hai chỗ trên, hạ `vietnamese_clarity` 9.1 và `ambiguity_integrity` 9.1.

  Triangulation 8.0 (mức thường của lớp lấp). Bài này **không** có bản Việt project, không có
  bản Việt hiện hành ở commit đã ghim, và `content/meta/sutta/an/an10.95.yaml` chưa tồn tại — không
  có lớp Việt nào để đối chiếu, và cũng không có scorecard Việt cùng họ công cụ. Đối chiếu ở đây
  là Pāli root + bản Anh đã ghim của chính bài.

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate
  pass. Bốn lệnh đó còn lại cho người điều phối.

  Coverage: sau khi lớp lấp này `published`, `an/an10.95` lên 36/36 = 1.0. Trong
