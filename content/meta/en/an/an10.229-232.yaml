notes: >-
  Bản âm (1.5) và bản dương (1.6) là một cặp đối xứng, nhưng bản âm đã bị lược về
  còn "forty …”". Nghĩa là chỉ còn một nửa cặp được đọc. `saggaṁ lokaṁ` dịch "the
  world of the gods" thay vì "heaven" để cân với `apāyaṁ duggatiṁ vinipātaṁ
  nirayaṁ` ở 1.5 — dùng "hell" ở cả hai vế sẽ làm mất nét đối xứng.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
