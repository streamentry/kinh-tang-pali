notes: |-
  7.2/9.2: “amukamhā vā amukamhā vā devanikāyā” theo “which orders of gods those
    deities came from” (5.3/6.3/7.1 cùng bài); “amuka” -> “such-and-such” (dn9,
    dn23 đã đếm). 9.3: “imassa kammassa vipākena” theo “as a result of that deed”
    (sn3.20:4.1), đổi số ít thành số nhiều “such deeds” như cách hỏi 8.4 (“what
    deeds”); phần còn lại theo “reborn there after passing away from here”
    (7.6/8.4). 9.4 theo “such food and such an experience of pleasure and pain”
    (7.10/8.5). Ba khoá 9.2/9.3/9.4 là câu tường thuật (“…’—and I knew those
    deities:”) vì Pāli “…’ti, tā ca devatā jānāmi:”, khác câu hỏi ở 8.x (“find
    out …?”).

    BẤT ĐỊNH: chuyển câu hỏi Sujato (8.x) thành câu tường thuật, chọn số nhiều
    “deeds”, và “knew” cho jānāmi trong mạch quá khứ đều là quyết định của dự án —
    terminology 9.3, ambiguity_integrity 9.2.

    rven88.py cờ “such … such” ở 7.2/9.2 (“such-and-such”): HỢP LỆ, thành ngữ Anh
    cố định cho “amukamhā vā amukamhā vā”.

    Lớp lấp: 4 khoá nằm ở phần bản đã ghim đã lược. Triangulation 8.0: không có
    bản Anh độc lập phủ.
