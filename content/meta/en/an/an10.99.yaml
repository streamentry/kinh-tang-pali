notes: >-
  `kaṇṇasandho` và `piṭṭhisandho` là hai việc vệ sinh mà Pāli đã cũ — với Moggallāna
  đang sống trong rừng, đây là cách ông giải thích sự bất an của mình. `sandho` là
  "rửa/vệ sinh", `khiḍḍaṁ kīḷitvā` là "nghịch ngợm". Bản đã ghim 3.5 dùng thì thứ
  nhất ("When I've bathed…") cho lời hứa của ông; 3.6 là chú giải của Đức Thế Tôn ở
  thì hiện tại. 3.7 phải theo 3.6 — nếu vẫn dùng "I'll" thì bài tự mâu thuẫn về thì
  của hành động. Đây là lỗi dễ mắc và đã tránh được.
  
  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
