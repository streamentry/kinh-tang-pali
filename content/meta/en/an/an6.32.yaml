notes: |-
  Đoạn 3.2–3.8 là lần thuật lại đúng lời thiên thần nói ở 1.1–2.7 (bài chia đôi: rồi
  Đức Thế Tôn kể lại cho chúng Tỳ-kheo). Vì thế bốn khoá dùng lại y nguyên bản đã ghim
  của chính bài này:

  * 3.2 — Pāli giống hệt `an6.33:1.1` đã ghim ("Tonight, a glorious deity, lighting up
    the entire Jeta’s Grove, came to me, bowed, stood to one side, and said to me:"),
    và cùng mẫu với `an6.69:2.2`, `an7.33:1.1`.
  * 3.3 — vế mở của `an6.32:2.1` đã ghim ("Sir, these six things don’t lead to the
    decline of a mendicant."); Pāli chỉ khác ở dấu mở `“` → `‘`.
  * 3.5 — danh sách của `an6.32:2.3` đã ghim, dùng đúng bộ từ "Respect for the
    Teacher, for the teaching, for the Saṅgha, for the training, for diligence, and
    for hospitality".
  * 3.6 — vế chốt của `an6.32:2.4` đã ghim.
  * 3.8 — Pāli giống hệt `an6.33:1.7` đã ghim ("Then he bowed and respectfully circled
    me, keeping me on his right side, before vanishing right there."), kể cả cách
    Sujato dùng "he" cho `sā devatā` (giống cả `an6.32:2.7` đã ghim).

  Bất định đã xử lý ở 3.5: Pāli kết bằng `—` (dấu nối, câu còn tiếp ở 3.6) trong khi
  Pāli ở 2.3 kết bằng `.`. Bản đã ghim có xu hướng đổi `—` cuối Pāli thành `.` (đếm
  được 570 câu so với 41 câu giữ `—` trong tầng `an`), nhưng ở đây đổi thành `.` là
  **khẳng định sai** một ranh giới câu mà Pāli không có, giữa hai vế liên tiếp 3.5 và
  3.6. Pāli là authority, nên giữ `—`.

  Bất định đã xử lý ở 3.8: Pāli kết `tatthevantaradhāyīti.` — cache bilara viết
  `aradhāyīti`, **không** có `’` trước `ti` (khác `an6.32:3.6` là `saṁvattantī’ti.`).
  Số ngoặc đóng theo từng khoá vì thế là 0 và bản Anh không mang dấu đóng. Đây là dữ
  liệu nguồn, không phải lựa chọn của tôi.

  Lớp lấp: 5 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn
  bị mất.