notes: |-
  Ba khoá này trùng NGUYÊN VĂN với 2.2, 2.3, 2.4, và cả ba khoá đối chiếu đều đã
  được bản Anh đã ghim dịch đầy đủ. Luật 3 của lớp lấp áp dụng trọn vẹn, nên lấy
  nguyên văn, không dịch lại:
  - 2.8 = 2.2: "‘It might not be, and it might not be mine. It will not be, and it
    will not be mine. I am giving up what exists, what has come to be.’ They gain
    equanimity."
  - 2.9 = 2.3: "They’re not attached to life, or to creating a new life. And they see
    with right wisdom that there is a peaceful state beyond."
  - 2.10 = 2.4: "But they haven’t completely realized that state. They haven’t totally
    given up the underlying tendencies of conceit, desire for continued existence,
    and ignorance."

  Bất định phải ghi: Pāli của 2.10 GIỐNG HỆT Pāli của 3.4 và 8.4, nhưng bản đã ghim
  dịch hai bài kia KHÁC NHAU ở một chỗ — 2.4 để "completely realized … totally given
  up", còn 3.4 và 8.4 để "totally realized … completely given up". Cả hai vế Pāli đều
  là `na sabbena sabbaṁ`, nên đây là chỗ Sujato tùy tiện đảo trạng từ, không có nghĩa
  khác nhau. 2.10 lấy theo 2.4 vì cùng mục "2" và là khoá đối chiếu đứng trước.
  `ambiguity_integrity` hạ 9.0 vì lựa chọn này là biên tập.

  Ghi thêm để người đọc hiểu vì sao bài có một bản dịch lặp: đây là hệ quả của cách
  bản đã ghim cắt khúc — nó dịch vế `‘no cassa no ca me siyā…’` ở 2.2 nhưng lược vế
  đó ở 4.2 / 5.2 / 6.2 / 7.2 / 8.9. Người đọc sẽ gặp cùng một đoạn hai lần. Bỏ thì
  hai khoá thành orphan, gộp thêm vào 2.2 thì vượt quá phạm vi một segment.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
