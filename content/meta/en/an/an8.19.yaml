notes: |-
  **Phạm vi phẩm đo được, không suy từ tên.** Catalogue `an` có **1.781** mục; `an8` = **96** mục, trong đó
  **93** bài riêng (`an8.1`–`an8.90`, `an8.118`, `an8.119`, `an8.120`) và **3** mục dải
  (`an8.91-117`, `an8.121-147`, `an8.148-627`) mà bilara đã ghim chỉ còn tiêu đề, không có segment thân bài.
  Tầng lấp `an8` đã có: **11** tệp, **11/11** `published` (`an8.2 .7 .10 .20 .23 .24 .35 .38 .51 .64 .73`),
  **0** cho `an8.19` ⇒ đây là lát thứ **12**. Công thức lặp của bài này: **16** khoá tầng Anh đã ghim để
  trống đều mở bằng `Yampi` (`Yampi, bhante, …` ở `2.7`–`9.2`; `Yampi, pahārāda, …` ở `10.8`–`18.3`),
  tức **một dòng tóm tắt lại vế ngay trước**; cộng một nhãn thứ tự ở `19.2`. Danh sách `acchariyo abbhuto
  dhammo` được đánh số **hai lần** (`paṭhama`–`aṭṭhama` ở `2.8`–`9.3`, rồi `paṭhama`–`aṭṭhama` ở
  `10.9`–`18.4`): **16** mục được đánh dấu, mỗi bên lặp đúng tám.

  **`an8` KHÔNG phải Kalyāṇamitta-saṃyutta — đo thì ra vậy.** `an8.19:0.3` = `Pahārādasutta`,
  `an8.19:0.2` = `2. Mahāvagga`. 93 tiêu đề `an8` đo được là `Mettāsutta`, `Paññāsutta`, appiya ×2,
  lokadhamma ×2, bandhana ×2, uggha ×2, hatthaka ×2, bala ×2, dāna ×2, khetta, puñña, sappurisadāna,
  Uposatha, Visākhā ×2, Bojjha, āhuneya ×2, icchā ×2, alaṁ ×2, Parisā, Bhūmicāla, saddhā ×2,
  maraṇasati ×2, sampadā ×2, Puṇṇiya, Mūlaka, Cora, Samaṇa, Yasa, Pattanikujjana… — một bộ tà tâm
  loại nhiều, không phải một saṃyutta. Trong **93** bài `an8`, chỉ **5** bài có `kalyāṇamitta` trong Pāli
  (`an8.54` 5 lần, `an8.55` 4, `an8.57` 1, `an8.75` 1, `an8.76` 3); `an8.19` có **0** lần `kalyāṇamitt`
  và **0** lần `mitta*` ⇒ cảnh báo thuật ngữ này **không** áp dụng cho lát này.

  **Tiền lệ thuật ngữ, đếm ở tầng Anh đã ghim (cả hai số như yêu cầu).** `kalyāṇamitta`: quét **155.293**
  khoá segment Anh đã ghim — Pāli có `kalyāṇamitt` ở **147** khoá, **128** khoá ấy có lời, và lời dịch là
  **“good friend(s)”** ở **127** khoá (`’good friends’` 123, số ít 4). `mittakalyāṇā`: **0** — cụm này
  **không hề xuất hiện** trong toàn bộ **5.764** tệp Pāli đã ghim, nên không có tiền lệ nào để bắt chước.

  **Bốn số A/B/C/D (đo bằng script, in ra cả bốn).** A trùng **nguyên văn** với khoá đã có lời trong cùng
  bài = **0**. B gần trùng khoá đã có lời (ngưỡng tương đồng chuỗi ≥ 0,85) = **14**. C Pāli không có lời
  nào ở tầng ⇒ tự dịch từ Pāli = **3** (`7.2`, `9.2`, `19.2` — tương đồng lần lượt 0,84 / 0,75 / 0,40).
  D khoá trùng Pāli khoá khác mà lời tầng khác nhau = **0**.

  **Nhóm B — 14 khoá, dựng lại từ khoá anh em ngay trước, tỉ lệ khớp đo được.** `2.7`←`2.6` 0,90 ·
  `3.2`←`3.1` 0,88 · `4.2`←`4.1` 0,93 · `5.3`←`5.1`+`5.2` 0,95 · `6.2`←`6.1` 0,95 · `8.2`←`8.1` 0,94 ·
  `10.8`←`10.7` 0,94 · `11.3`←`11.2` 0,91 · `13.2`←`13.1` 0,96 · `14.3`←`14.2` 0,96 · `15.3`←`15.2` 0,95 ·
  `16.3`←`16.2` 0,87 · `17.3`←`17.2` 0,88 · `18.3`←`18.2` 0,96. **Phần tầng đã ghim nuốt mất mà lớp lấp chèn
  lại** chính là dẫn `Yampi` và dạng `;` cuối: tầng đã ghim không dịch dòng tóm tắt, nên dẫn `Yampi` không có
  ở đâu để mượn — lớp lấp dựng lại nó, và dẫn `bhante`/`pahārāda` đổi thành **“sir”**/**“Pahārāda”**
  đúng như tầng đã ghim dịch hai dạng xưng hô ấy trong chính bài này (`2.2` “Sir, they do indeed.”,
  `10.2` “They do indeed, Pahārāda.”).

  **Nhóm C — 3 khoá.** `7.2` là tóm tắt `7.1`; chữ tự chỉ của nó là `ekaraso loṇaraso`, tầng đã ghim dịch cụm
  đó ở `16.1` là “has just one taste, the taste of salt”, lấy lại nguyên văn cụm ấy. `9.2` xem dưới.
  `19.2` là nhãn thứ tự.

  **Khung “The fact that, …” là của dự án, và nó được kế thừa có chủ đích từ bài song song đã
  `published`.** `an8.20` là cùng một bài kinh (Pahārāda ↔ bhikkhave) và lớp lấp của nó đã dịch bốn khoá
  `Yampi` bằng đúng khung này; tôi **không** đổi khung ở một bài mà giữ ở bài kia, vì làm vậy là tự tạo mâu
  thuẫn giữa hai bài. BẤT ĐỊNH cần ghi thẳng: `Yampi` (`yaṃpi` = “chính là / tức là”) sát nghĩa hơn là
  “namely, sir” hoặc “that is to say”; “The fact that” là cách diễn đạt đã in trong tầng lấp của bài kia.
  Đây là lý do `terminology` 9,3 và `ambiguity_integrity` 9,2. Người biên tập có thể đổi cả hai bài cùng lúc.

  **Dấu lược ở `9.2` — đo đúng luật, không mở rộng.** Pāli `9.2` có **4** ký tự `…` thô nhưng chỉ là **3**
  dấu lược theo luật: **1** từ `…pe…` (tính đúng một `…`) + **2** dấu trần đứng sau `tiyojana` và `catuyojana`.
  Lớp lấp ghi **3** `…`, và **không** mở rộng phần `…pe…` thành “two hundred leagues” như tầng đã ghim đã làm
  ở bài song song `an8.20:8.1` (Pāli `…pe…`, tầng ghim ra “two hundred, three hundred, four hundred”). Vì thế
  mạch Anh ở `9.2` **cụt**: “a hundred leagues long … three hundred … four hundred … and life-forms five
  hundred leagues long”. Đây là hệ quả của luật “không mở rộng”, không phải lỗi dịch — và nó là lý do
  `vietnamese_clarity` 9,0. Tổng dấu lược của bài lấp này = **3**; **16** khoá còn lại có **0**.

  **Nhãn thứ tự: dò ở giá trị Pāli, đo lại được.** Quét **284.708** khoá Pāli `pli/ms` theo
  `^(Paṭhama|Dutiya|Tatiya|Catuttha|Pañcama|Chaṭṭha|Sattama|Aṭṭhama|Navama|Dasama|Ekādasama|Dvādasama|Terasama)ṁ\.$`
  trên **giá trị**: **2.993** khoá (`an` **1.405** + `sn` **1.396** + `iti` **112** + `ud` **80**). Tầng Anh đã
  ghim có lời trên các khoá ấy: **0**, tức **0,00%** — tái lập đúng con số có thể dùng lại, còn phép đếm thì
  mỗi lát ra số khác nên không chép. Lớp lấp đã có: **51** khoá / **51** có lời / **12** dạng bề mặt.
  `an8.19` có **1** nhãn: `19.2` = `Navamaṁ.` ⇒ lấp `Ninth.`

  ⚠️ **Cảnh báo nhãn không khớp danh sách — ghi ra, không tự bỏ.** `Navamaṁ.` là số thứ tự *bài* trong
  `Mahāvagga` (`an8.11`–`an8.19` ⇒ bài thứ chín), nhưng bài này đánh dấu **16** mục
  `acchariyo abbhuto dhammo` vì danh sách tám điều được lặp hai lần. `Ninth.` vẫn được giữ đúng như Pāli.

  **Nguyên nhân khoá trống: đo cả ba phép, không kết luận bằng đoạn cũ.** Phép “gộp khoá” (≥50% thân từ
  Pāli của khoá trống nằm trong lời Anh của khoá **trước**): `an8.19` = **0 cặp**. Đo lại toàn tầng Anh đã
  ghim bằng cùng phép trên **18.972** khoá trống / **4.168** tệp: **0** — đúng là gộp khoá gần như không
  tồn tại, nên **không** dùng nó làm lý do. Cơ chế **A** (dãy ≥ 4 khoá trống liên tiếp): `an8.19` =
  **0** dãy, **0** ký tự. Cơ chế **B** (bỏ dòng song song; thân từ = từ ≥ 4 chữ, lấy 4 chữ cuối; ngưỡng
  ≥ 0,70; **mỗi khoá đúng một nhóm**): `an8.19` có **13** lần mở nhóm, trong đó **2** nhóm nhiều thành viên,
  gom **6** khoá trong tổng **17** khoá trống — kiểm tự thừa: 6 ≤ 17 ✔. Hai nhóm: `7.2`+`8.2` (0,75) rồi
  `9.2` (0,75); `16.3`+`17.3` (0,80) rồi `18.3` (0,80). ⇒ nguyên nhân thật ở bài này là **tầng đã ghim bỏ
  trọn dòng `Yampi`**, vừa là B vừa không phải A. Đo và báo, không sửa tầng đã ghim (sửa là shadow).

  **Dấu hiệu cắt cụt: đếm và báo.** Một khoá có lời nhưng ngắn hơn Pāli ≥ một nửa: **1** — `10.2`
  (Pāli 56 ký tự, lời 27, 0,48). Đọc kỹ thì **không phải** cắt cụt mà là thói qua của chính tầng đã ghim ở
  bài này: `2.2` cũng vậy (Pāli 43, lời 22) vì câu hỏi `2.1` đã nêu sẵn chủ ngữ `asurā mahāsamudde`.

  **Ngoặc kép — cân từng khoá, in ra để kiểm.** Chỉ `5.3` và `14.3` có nháy trong Pāli, và cả hai đều là
  nháy **đơn** `‘…’` quanh một danh từ; lớp lấp theo đúng từng khoá: `‘the ocean’` và
  `‘ascetics who follow the Sakyan’`. **15** khoá còn lại có **0** nháy kép và **0** nháy đơn ở cả hai vế.
  Đo dấu nhạt lượu bằng luật `’` có chữ thường đứng ngay sau là dấu nhạt lượu, không có là nháy đóng:
  tổng **8** dấu `’` = **6** dấu nhạt lượu (`doesn’t` ×3, `world’s`, `wouldn’t`, `they’re`) + **2** nháy
  đóng (đúng hai khoá có nháy trong Pāli). Ngoại lệ `’ti`: **0**.

  **Coverage — đo trước và sau bằng số.** Mẫu số = Pāli có nội dung theo luật kho (≥ 40 ký tự sau khi
  nén khoảng trắng, bỏ khối `:0`) = **69** khoá. Trước lớp lấp: **53/69 = 0,7681**. Sau khi `published`:
  **69/69 = 1,0000**. **Độ nhạy:** ngưỡng 0,8 của kho cần **56** khoá có lời ⇒ trước lớp lấp thiếu **3**
  khoá; hai khoá mới được 0,7971 (vẫn dưới ngưỡng), ba khoá mới được 0,8116. Sau khi lấp đủ **17/17**,
  không còn khoá trống nào của bài.

  **Hai khoá trong lát không vào coverage — nói thẳng vì sao vẫn lấp.** `19.2` (`Navamaṁ.`, **8** ký tự)
  dưới ngưỡng 40 nên không tính mẫu số; nó vẫn được lấp vì nó nằm trong tập khoá tầng Anh đã ghim để trống và
  bỏ nó là mất một khoá có thật. `2.5` và `10.5` (`Katame aṭṭha?`, 13 ký tự) cũng dưới ngưỡng và **không**
  nằm trong lát (tầng đã ghim đã có lời “What eight?”), nên không lấp.

  **Triangulation 8,0, và thẳng thắn: bài này không có tầng đối chiếu nào.** Lớp lấp là bản dịch English
  của chính dự án nên về mặt tác giả không bao giờ là cách đọc Anh độc lập — trần **8,0**. Riêng `an8.19`
  còn yếu hơn một mức nữa vì **không có bản Việt canonical nào để đối chiếu**: `content/translation/vi/
  project/sutta/an/` có **65** tệp `an8.*` nhưng **không** có `an8.19`, `content/meta/sutta/an/` có
  **65** tệp `an8.*` nhưng **không** có `an8.19.yaml`, và tầng `vietnamese-current` chỉ phủ `kn` ⇒ **0**
  bản Thích Minh Châu cho bài này. **Vì vậy không được tuyên bố bài này đã đối chiếu English.** Đối chiếu
  duy nhất là Pāli đã ghim và lời của tầng Anh đã ghim ở đúng các khoá anh em trong cùng bài. Bản Việt
  không có nên cũng không sửa gì ở tầng Việt.

  **Hệ quả với `content/meta/reference-gaps.yaml`:** bài này **không** có record trong file đó (đã dò
