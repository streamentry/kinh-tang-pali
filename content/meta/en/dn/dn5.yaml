notes: |-
  **Phân loại 45 khoá (đo bằng máy): A = 5 · B = 24 · C = 12 · D = 4.**

  **A (5):** `12.8` ← `12.5`; `17.15`, `17.34` ← `17.10`; `17.33` ← `17.4`. **Khoá thứ năm theo máy là `17.38` (Pāli trùng `17.31`) nhưng KHÔNG dùng lại** — báo như một ca D: lời ghim ở `17.31` (“that the high priest does not possess the four factors.”) là câu **tóm** cả đoạn `17.31–17.41`, không dịch Pāli của chính khoá ấy (`‘rājā kho mahāvijito mahāyaññaṁ yajati.`). Chép nó vào `17.38` sẽ đặt một lời tóm trước ba khoá liệt kê chi tiết. Lớp lấp dịch Pāli: “King Mahāvijita performs a great sacrifice.”

  **D (4) — báo, không tự hòa:** `17.17`, `17.36` (Pāli trùng `17.7`/`17.12`/`17.29`; tầng ghim có “Let the king know this as …” ở `17.7` và “… this too as …” ở `17.12`, `17.29`) ⇒ chọn dạng “this too” vì `Imināpetaṁ` có `pi` và các khoá này không phải lần đầu. `17.18`, `17.37` (Pāli trùng `17.8`/`17.13`/`17.30`; tầng ghim chỉ khác dấu phẩy cuối) ⇒ chọn dạng có dấu phẩy của `17.8` vì khoá sau mở lời trích.

  **B (24):** `4.12`/`4.13` ← `4.9`/`4.10` (1,00/0,98) · `7.40` ← `7.38` (nguyên văn; `7.39` dựng từ `7.36`) · `11.17` ← `11.11`+`11.12` (0,90, chuyển sang quá khứ), `11.18` ← `11.21` (0,97) · `12.7` ← `12.2` (1,00, đổi `“…”’` của tầng ghim thành `‘…’` theo Pāli) · `15.4`, `15.6` ← `15.2`/`17.30` (0,92/0,97): viết thường, nối vào chuỗi “… or” của tầng ghim ở `15.3`/`15.5` · `17.16`, `17.35` ← `6.6`/`7.4` · `17.19–17.22`, `17.25` ← `13.3–13.6`, `13.8` · `17.32` ← `7.4` · `17.39` ← `14.3` · `25.2`, `26.2` ← `24.2` (“There is, brahmin.”), `25.3`, `26.3`, `27.3` ← `24.3` (“But what is it?”) · `25.5`, `26.6` ← `24.1`/`27.7`: viết rõ các tế lễ đã so (ba thể thức + mười sáu tư cụ, bố thí thường xuyên, dâng tinh xá, và ở `26.6` thêm quy y), vì Pāli nêu đủ chứ không nói `purimehi`.

  **C (12):** `5.8`, `7.39`, `11.15`, `11.16`, `12.6`, `17.23`, `17.24`, `17.26`, `17.40`, `17.41`, `19.4`, colophon `30.11`.

  **Cố ý lệch nháy Pāli — đã đo (6 khoá):** đoạn `17.x` tầng ghim mở `‘` ở `17.2` cho lời vị tế sư (Pāli không có lớp nháy ngoài này) rồi dùng `“…”` cho lời người chê (`17.3`, `17.4`, `17.9`). Lớp lấp theo đúng quy ước ấy để không lệch khoá anh em: `17.19`, `17.38` Pāli `‘` ⇒ `“`; `17.26`, `17.33`, `17.41` Pāli `’` ⇒ `”`; `17.25` Pāli `“…”` ⇒ `‘…’` (lùi một tầng). 39/45 khoá còn lại khớp Pāli.

  **Khoá lặp nội dung tầng ghim — hiện ra, không giấu:** `19.4` (`tañca vo hotu, ito ca bhiyyo harathā’ti.`) đã bị tầng ghim **gộp** vào `19.3` (“… Let this be for you; and here, take even more!’”). Lớp lấp vẫn dịch `19.4` (khoá có thật, 40 ký tự) bằng đúng nửa câu ấy, nên người đọc thấy câu này hai lần. Tương tự `5.7` tầng ghim đã đóng `”`, và `25.4`, `26.5` đã đóng `”` trước khi `25.5`, `26.6` của Pāli kết lời. **Lỗi ngoài lát:** tầng ghim ở `12.4` ghi “And all of the people who were thus informed responded by saying:” trong khi Pāli `12.4` là lời vua tuyên bố `‘icchāmahaṁ…’` — lệch một khoá; không sửa (sửa là shadow).

  **Dấu lược:** Pāli 10 dấu (đếm `…pe…` = 1) trên 45 khoá, lớp lấp 10, khớp từng khoá.

  **Đo hai cơ chế khoá trống:** cắt cụt dãy = 3 dãy / 26 khoá / 2.589 ký tự Pāli; bỏ dòng song song = 6 nhóm / 20 khoá. 11 khoá tầng ghim ngắn hơn 35% Pāli (vd. `17.14` “that he does not possess the eight factors.” cho 217 ký tự Pāli).

  **Coverage:** mẫu số 321; trước 279/321 = 0,8692; sau khi `published` 321/321 = 1,0. Độ nhạy: mất thêm hơn 64 khoá mới rớt dưới 0,8. Bài **không** có record trong `content/meta/reference-gaps.yaml`.

  Triangulation 8.0 (trần của luật): scorecard tiếng Việt của bài này (`content/meta/sutta/…`) ghi `quality.assessed_by` **trùng họ công cụ** với lớp lấp (alias khai trong `source/tooling.yaml`). Vì vậy bản lấp này **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài **không được** tuyên bố đã đối chiếu English nhờ lớp lấp. Đối chiếu đã có: Pāli root (authority) + lời Sujato đã ghim của chính bài + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng).

  Tự kiểm bằng máy trước khi ghi: JSON parse; mọi khoá ⊆ `fillableSegments` của bài; không khoá nào trùng khoá tầng Sujato đã có chữ (0 shadow); NFC; không khoá rỗng; dấu lược đếm theo luật `…pe…` = đúng một `…` — khớp Pāli ở mọi khoá; nháy đếm theo luật `’` + chữ thường = dấu nháy lửng (apostrophe) tiếng Anh, còn lại là nháy đóng.

  technical_integrity 9.6: lát này không được chạy cổng kỹ thuật, nên **không** tuyên bố technical gate pass. Bốn lệnh còn nợ cho người điều phối: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Đây không phải blocker (cổng chặn ở validation failure, không chặn ở chưa chạy).
