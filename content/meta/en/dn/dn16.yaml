notes: |-
  **Phân loại 95 khoá (đo bằng máy trên Pāli đã ghim và tầng Anh đã ghim của chính bài này, ngưỡng gần-trùng 0,75 trên Pāli đã bỏ dấu câu): A = 39 · B = 21 · C = 24 · D = 11.**
  Định nghĩa để tái lập: A khi Pāli chuẩn hoá trùng nguyên văn với khoá đã có lời và các khoá ấy chỉ có một dạng lời; D khi Pāli trùng nhưng các lời đã ghim
  khác nhau; B khi không trùng nhưng gần trùng (≥ 0,75); C là phần còn lại. Tổng 39 + 21 + 24 + 11 = 95, đúng bằng số khoá đã ghi (95/95
  khoá của `fillableSegments`). Cách xử lý thực tế: trong nhóm A, 31 khoá lấy lại **nguyên văn từng chữ** và 8 khoá có điều chỉnh (nêu bên dưới);
  60 khoá viết tay (gồm B, C, D và các A có điều chỉnh).

  **Nhóm công thức `Evaṁ, bhante`/`Bhagavā etadavoca` (A, 8 khoá).** `1.7.2`, `1.7.3`, `1.8.12`, `1.8.13`, `1.10.3`, `1.10.4`, `1.11.2`, `1.11.3`
  nguyên văn từ `1.6.9`/`1.6.10`/`4.7.5`/`4.7.6`/`5.26.10` (“Yes, sir,” they replied. · The Buddha said this:).

  **Khoá gộp thật ở phần Ajātasattu và Sāriputta.** `1.2.3` đã bị gộp vào `1.2.2` (“Ask him if he is healthy and well …”):
  lớp lấp dịch lại như `1.3.4`, đổi sang ngôi “your feet” theo cách tầng đã ghim dịch `bhagavato` ở `5.22.4`. `1.17.9` ghim
  một lời duy nhất cho cả ba thì (“whether past, future, or present”) nuốt `1.17.10`, `1.17.11`; lớp lấp tách thành hai
  khoá, dùng lại chữ của `1.17.9` (“give up the five hindrances …”), `1.17.10` ở tương lai, `1.17.11` ở hiện tại và thêm lại
  chủ ngữ “the Buddha, sir” của `Bhagavāpi, bhante`. `1.16.18` ghép `1.16.5`+`1.16.6`. `1.21.2` (←`1.21.1`) và `1.28.2` (←`1.26.1`,
  0,91) cũng là phần tầng đã ghim nuốt.

  **Bảy khoá `(…)` (`1.11.11`, `1.22.4`, `2.10.7`, `3.33.20`, `3.49.5`, `4.19.6`, `4.38.11`).** Đây là chỗ Pāli ghi dấu lược biên tập `(…)`;
  trong toàn bộ Trường Bộ đã ghim chỉ có đúng 7 khoá như vậy, đều ở bài này, và cả bảy đều bị bỏ trống (7/7). Lớp lấp ghi đúng `(…)` (một dấu lược), không mở
  rộng. Các khoá này dưới ngưỡng 40 ký tự nên không vào coverage.

  **Cuộc “Māra thỉnh lần hai” thuật lại (`3.36.2`–`3.36.10`, 9 khoá).** Tầng đã ghim nuốt cả đoạn vào `3.36.1`. Lớp lấp dùng chữ
  của `3.7`, `3.8`, `3.34`, `3.35`: `3.36.3` (A), `3.36.9` (A ←`3.8.17`); `3.36.2` và `3.36.10` (D, `3.7.2`/`3.8.x`/`3.34.3`/`3.8.18`
  khác nhau ở chữ “Sir,” và nháy) → chọn “Sir, may the Blessed One now be fully extinguished! …” như `3.7.2`/`3.34.3`, cho cả hai
  khoá cùng một lời (khoá đầu có ‘ mở, khoá cuối có ’ đóng); `3.36.4`–`3.36.7` (C) “until I have monk/nun/layman/laywoman
  disciples …” (mỗi khoá một dấu lược, theo `3.35.1`–`3.35.4`); `3.36.8` (0,88 ←`3.8.16`).

  **Nhóm D (11 khoá: `3.36.2`, `3.36.10`, `3.45.2`, `3.45.4`, `3.45.5`, `3.45.6`, `5.4.9`, `5.5.6`, `5.6.5`, `5.24.16`, `6.11.11`).** Pāli trùng với các khoá đã
  ghim có lời **khác nhau**; báo, không hoà. Cách chọn cơ học là lấy lời đã ghim có nháy khớp Pāli: `3.45.4` (bản không nháy như Pāli), `3.45.5` (bản có ’ đóng như Pāli),
  `5.6.5`, `6.11.11` (bản nháy đơn ‘…’) lấy nguyên văn; các khoá còn lại phải viết hoặc chọn theo ngữ cảnh. `3.45.2` có hai lời đã ghim (“There I
  said to you:” ở chỗ một địa danh; “And in each place I said to you:” ở chỗ nhiều địa danh); chọn “There I said to you:” vì `3.45.1` chỉ một
  địa danh. `3.45.6` có hai lời (`3.41.6`/`3.44.3` kết bằng dấu chấm, `3.47.5` thêm “, saying:”); chọn bản có “saying:” vì khoá liền sau
  (`3.45.7`) là lời trích. `3.36.2`, `3.36.10` xem nhóm Māra ở trên. `5.4.9`, `5.5.6`, `5.24.16` xem bên dưới.
  `3.40.7`, `3.41.7`, `3.44.4`, `3.45.7` (A có điều chỉnh): Pāli nháy đơn, nhưng lời “may the Blessed One please remain …” đã ghim ở
  `3.38.2`/`3.39.3` dùng nháy kép; lấy nguyên văn từ `3.47.6` (cũng đã ghim, nháy đơn, Pāli của nó chỉ thiếu `bhante`). `3.44.1` ←`3.3.1` kết
  bằng một dấu lược, `3.45.3` ←`3.41.3`, `3.45.8` ghép `3.40.8`+`3.40.9`.

  **Cây sāla trổ hoa (`5.3.2`–`5.3.11`).** Pāli `5.2.x` (kể) và `5.3.x` (lời Đức Phật) lặp từng chữ ở thì hiện tại; tầng đã ghim
  dịch `5.2.x` ở thì quá khứ. Các khoá `5.3.3`–`5.3.7` (A) nguyên văn nên ở quá khứ; `5.3.2` do đó dịch “The twin sal trees
  were in full blossom …” (quá khứ, ←`5.2.1`) để cả chuỗi cùng thì.

  **Nhóm “apehi, bhikkhu” (`5.4.9`, `5.5.6`).** Hai khoá giống hệt Pāli; đã ghim có hai lời (‘…’ ở `5.4.7`/`5.5.4`, “…” ở `5.4.3`).
  Cần cả ‘ ’ và ” (Pāli `’”ti?`) nên viết tay: “‘Move over, mendicant, don’t stand in front of me’?”” — dấu hỏi giữ như Pāli.

  **Deities “ở trên đất” (`5.6.4`, `6.11.10`).** `5.6.2`/`6.11.8` đã ghim gộp “ākāse” (trong không gian) và “pathaviyaṁ” (trên đất)
  vào một câu “both in space and on the earth”; lớp lấp dịch riêng khoá thứ hai là “on the earth”, nên câu này xuất hiện hai lần.

  **Bốn pháp lạ lùng của Ānanda (`5.16.7`–`5.16.37`).** Tầng đã ghim ghi chữ cho khối thứ nhất (tỳ-kheo) và ngắt bằng dấu lược ở các khối kế;
  khối “Evameva … ānande” (`5.16.27`–`5.16.37`) bỏ trống hoàn toàn. A: `5.16.7`, `5.16.10`, `5.16.27`, `5.16.28`, `5.16.34`. Viết tay:
  `5.16.8`, `5.16.11` (“And when he falls silent, they’ve never had enough.” như `5.16.5`, `5.16.14`) · `5.16.29`/`5.16.30` và `5.16.35`/`5.16.36` tách
  `Atittāva … hoti. Atha kho ānando tuṇhī hoti.` thành hai (“The assembly of monks has never had enough, / when Ānanda falls silent.”) ·
  `5.16.31`, `5.16.32`, `5.16.33` dùng lại “If an assembly of nuns …”, “laymen …”, “or laywomen goes to see Ānanda …” của `5.16.6`, `5.16.9`, `5.16.12` ·
  `5.16.37` ←`5.16.15` thêm nháy ” như Pāli.

  **Lệch có chủ đích so với tầng đã ghim.** `5.24.12` (Subhadda) dịch `paribbājakānaṁ` là “wanderers” chứ **không** “brahmins”: `5.23.5` và
  `5.24.2` đã ghim ghi “brahmins of the past who were elderly and senior, the tutors of tutors” cho đúng cụm Pāli `paribbājakānaṁ vuḍḍhānaṁ …`,
  mà chính tầng đã ghim dịch `paribbājaka` là “wanderer” ở mọi chỗ khác trong đoạn (“a wanderer named Subhadda”). Pāli là chuẩn cuối. Đây là
  lỗi của tầng đã ghim ở hai khoá `5.23.5`, `5.24.2` (ngoài lát, báo chứ không sửa); sau lớp lấp, ba khoá cùng Pāli đọc khác nhau.
  `5.24.16` (D, `5.23.9`/`5.24.6`) lấy lời `5.24.6` (không đóng ”), Pāli có nháy đơn trong (0 vs 1/1; ngoại lệ nháy theo cả hai khoá anh em, vốn dịch
  gián tiếp).

  **Các khoá còn lại.** `4.10.11` (“If, when compared with the discourse, they …”, một dấu lược) · `4.18.6` · `4.23.6` (0,99 ←`4.22.6`) · `5.3.11` ·
  `5.18.6` (0,87 ←`5.18.4`) · `5.22.6` (nháy ‘ ’ của `5.22.4` đổi sang “ ” như Pāli) · `5.26.6` (“‘According to their own claims, …?’”, nháy đơn như Pāli) ·
  `6.14.7`, `6.21.5` (0,97 ←`6.14.4`, `6.21.2`) · `3.23.10` (0,84 ←`3.23.9`, “And my voice became just like theirs.”) · `2.25.7` (←`2.25.5`) ·
  `2.9.11` (←`2.8.4` thêm ” đóng) · `5.24.18` · `6.28.21` (câu kết).

  **Dấu lược do tầng đã ghim thêm/bỏ:** 24 khoá có “…” dù Pāli viết đủ (`1.7.1`, `1.7.5`–`1.7.9`, `1.8.11`, `1.10.2`, `1.11.1`, `1.11.4`, `3.8.4`, `3.8.8`, …) và
  14 khoá bỏ dấu lược mà Pāli có (`2.6.7`–`2.6.12`, `2.7.6`–`2.7.11`, `4.10.5`, `4.10.6`); lớp lấp chỉ sửa trong khoá của mình.

  **Nháy kép “ ” và đơn ‘ ’ (không tính dấu nhạt lượu `’s`, `’t`…).** Đo từng khoá so với Pāli: 1 khoá lệch có chủ đích (`5.24.16`), mỗi khoá có lý do và số đo ở nhóm tương ứng bên trên; 94 khoá còn lại khớp Pāli.

  **Dấu lược.** Pāli của 95 khoá có 15 dấu lược (`…pe…` đếm là **một**); lớp lấp ghi 15. Pāli viết đủ thì lớp lấp không thêm “…”.

  **Khoá trống còn lại.** Không còn: cả 95 khoá thuộc `fillableSegments` đã được lấp, kể cả các khoá dưới ngưỡng 40 ký tự (câu kết, nhãn thứ tự, dấu lược) vì chúng có thật trong Pāli; những khoá ấy không vào coverage nhưng bỏ trống sẽ để lại chỗ hổng giữa bài.

  **Coverage (đo thật, mẫu số khác 0).** Mẫu số: 1194 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Trước lớp lấp: 1118/1194 = 0,9363. Sau khi lớp lấp `published`: 1194/1194 = 1,0000. Độ nhạy: ngưỡng 0,8 cho phép tối đa 238 khoá thiếu English; lớp lấp đưa số khoá thiếu từ 76 về 0 nên bài còn đệm 238 khoá. Bài này **không** có record trong `content/meta/reference-gaps.yaml`, nên không có record nào thành thừa vì lát này.

  **Khoá có chữ nhưng ngắn hơn hẳn Pāli (dấu hiệu cắt cụt/gộp của tầng đã ghim).** Đo: 40 khoá mà lời Anh đã ghim < 30% độ dài Pāli (Pāli ≥ 60 ký tự). Đây là chỗ `ratio` có thể lạc quan; lớp lấp không sửa được các khoá đã ghim. Đã dò Pāli trùng nguyên văn trên cả bài: 152 nhóm (mỗi nhóm từ hai khoá trở lên).

  **Triangulation 8.0 (trần của bài).** Scorecard Việt của `dn16` (`content/meta/sutta/dn/dn16.yaml`) do cùng họ công cụ với lớp lấp chấm (alias khai ở `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập của bản Việt và **không** được tuyên bố là đã đối chiếu English. Đối chiếu thực có: Pāli root + bản Anh đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Tệp Việt và metadata Việt không bị chạm.

  **technical_integrity 9.6.** Không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh ấy còn lại cho người điều phối, và chưa chạy cổng không phải blocker. Đã tự kiểm bằng phép đo riêng: JSON parse, NFC, mọi khoá thuộc `fillableSegments`, không khoá nào che bản đã ghim, dấu lược khớp Pāli, nháy (kể các ngoại lệ đã nêu), Pāli trùng ⇒ lời trùng, và `final_score` bằng trung bình số học thô.
