notes: |-
  **Phân loại 172 khoá (đo bằng máy): A = 61 · B = 87 · C = 20 · D = 4.** Đã ghi 172/172 khoá `fillableSegments`; 141 khoá có nội dung. Gần như toàn bộ khoá trống của bài là đoạn **lặp** mà tầng ghim thay bằng câu tóm, nên 148/172 khoá dựng được từ lời Sujato của chính bài.

  **D (4) — Pāli trùng nguyên văn, tầng ghim dịch khác nhau; chọn theo bối cảnh, không hoà:** `1.32.2` (`1.31.8` đủ câu / `1.33.2` cụt “…a wheel-turning monarch.”) ⇒ theo `1.31.8` vì `1.32.3`–`1.32.6` tiếp theo lặp đúng `1.31.9`–`1.31.12`; `3.20.2` (`3.12.2` “‘Excellent, sir! Excellent!” / `3.16.2` có thêm `’` đóng vì Sujato tóm phần sau) ⇒ theo `3.12.2`, khớp Pāli (không có nháy đóng); `3.20.3` (`3.12.3` / `3.16.3` là câu tóm “And just like Khaṇḍa and Tissa …”) ⇒ theo `3.12.3`; `3.32.12` (`1.12.23` “my birth mother…” do Đức Phật nói / `3.30.11` “your birth mother…” do chư thiên nói) ⇒ theo `3.30.11` vì người nói là chư thiên.

  **A (61)** gồm: `1.14.7` ← `1.13.3`; bảy báu `1.32.3`–`1.32.6`, `1.33.3`–`1.33.6` ← `1.31.9`–`1.31.12`; `2.13.4`–`2.13.7` ← `2.1.3`–`2.1.6`; bài kệ `3.4.12`–`3.4.17` ← `3.2.3`–`3.2.8`; `3.4.6`–`3.4.8` ← `3.1.5`–`3.1.7`; giáo pháp thứ lớp `3.19.1`–`3.19.7` ← `3.15.x`; `3.17.2`, `3.17.3`, `3.21.2`–`3.21.4` ← `3.13.x`/`3.17.4`; lời dạy du hành ← `3.22.x`/`3.26.x`; lời chư thiên về Phật Vipassī và về Đức Phật hiện tại ← `3.29.x`, `3.30.x`.

  **B (87), theo nhóm:** (1) báo cáo của các tỳ-kheo `1.2.5`, `1.2.6`, `1.14.5`–`1.14.12`, `1.15.2`, `1.15.4` ← `1.1.3`/`1.1.4`, `1.13.1`–`1.13.4`, `1.15.1`/`1.15.3` (0,79–1,0): `1.14.9` và `1.14.11` dịch **đủ** danh sách mà Sujato rút gọn ở `1.13.5`/`1.13.6` (“recollect all these things”, “Or did deities tell him?”), lấy nguyên danh sách Sujato đã viết ở `1.13.3`; câu `evaṁjaccā …` theo `1.13.4` (“Such is the birth, names, …”), nháy theo Pāli từng khoá. (2) ba lần người đánh xe kể lại cho vua (`2.3.6`–`2.3.16`, `2.7.6`–`2.7.16`, `2.11.6`–`2.11.23`) ← `2.2.x`, `2.6.x`, `2.10.x` (0,71–1,0): tầng ghim tóm cả ba bằng “And the charioteer told the king about seeing the … and the prince’s reaction.” (`2.3.5`, `2.7.5`, `2.11.5`); lớp lấp dựng đủ, nháy kép theo Pāli; `Disvā maṁ etadavoca` (trùng ở ba khối, máy xếp C 0,67) = “Seeing this, he said to me:” ở cả ba; `“Evaṁ, devā”ti kho ahaṁ, deva …` = “… I replied to the prince, Your Majesty, and did so.” (hô ngữ `deva` thứ hai là nói với vua); `2.11.13`/`2.11.14` tách lời `2.10.9` đúng chỗ Pāli cắt khoá. (3) `1.34.7`, `1.35.3` vế `evameva` mà Sujato nhập vào ví dụ. (4) thỉnh pháp và cải đạo `3.4.5`, `3.4.10`, `3.4.11`, `3.4.18`, `3.5.3`, `3.9.6`, `3.16.4`, `3.16.5`, `3.17.1`, `3.19.6`, `3.20.4`, `3.20.5`, `3.21.1` ← `3.1.4`, `3.2.x`, `3.3.x`, `3.9.4`, `3.12.x`, `3.13.1`, `3.15.6` (0,72–1,0): chèn lại `bhikkhusaṅghañca` (“and to the mendicant Saṅgha”) mà `3.16.4`/`3.20.4` có còn `3.12.4` không có. (5) lời Đức Phật Vipassī kể lại cho chúng tăng `3.23.8`, `3.24.2`–`3.24.8`, `3.25.1`–`3.25.12` ← `3.22.x`, `3.23.x` (0,73–1,0): đổi người (“me”, “my”), giữ việc Sujato không lặp con số 6.800.000 và hô ngữ ở `3.22.3`/`3.23.4`; `3.25.8` dừng ở `…pe…`: “Teach the Dhamma …”. (6) lời chư thiên ở Akaniṭṭha `3.31.4`–`3.31.26`, `3.32.1`–`3.32.15` ← `3.29.x`, `3.30.x`: tách `3.29.8`/`3.29.13`/`3.30.8` theo đúng khoá Pāli (`3.31.5`/`3.31.6`; `3.31.11`–`3.31.15`; `3.32.8`/`3.32.9`).

  **C (20):** câu `yathā … micchā assa vacanan` (`2.4.4`, `2.8.4`, `2.12.4`, giống nhau từng chữ) “‘so that Prince Vipassī would rule the kingdom, … would prove false.’” — chèn giữa câu đã ghim `2.4.3` (kết bằng dấu phẩy) và `2.4.5` (“with which the prince amused himself.”), nên đọc liền hơi gãy; lớp lấp theo Pāli, không sửa lời ghim. `3.24.4`, `3.25.5` (lời thỉnh/ý định khuyến khích du hành); `3.31.6`, `3.31.12`–`3.31.14`, `3.32.8`, `3.32.9` (khoá tách từ câu Sujato đã gộp); bốn khoá Phật quá khứ có `…pe…` `3.31.22`–`3.31.25` (tên và số kiếp theo `1.4.2`–`1.4.6` của Sujato, mỗi khoá đúng một `…`). **Bất định ghi thẳng:** `3.31.23` Pāli nén `te mayaṁ, mārisā, sikhimhi bhagavati tasmiññeva …` — vế “chúng tôi … dưới Phật Sikhī” bị cắt mà **không** có `…pe…`; lớp lấp dịch đúng phần có (“we, good fellow, under the Buddha Sikhī; in the same thirty-first eon, …”) và không tự bù vế bị cắt. `3.33.2`, `3.33.4` (`Evaṁnāmā …`) = “Such are the names, …” vì Pāli tách `evaṁjaccā` sang `3.33.1`. Colophon `3.33.7` ⇒ “The Great Discourse on Traces Left Behind is finished—the first.”

  **Ngoặc và dấu lược:** 171/172 khoá khớp Pāli về nháy; **lệch có chủ đích 1 khoá** `3.20.3`: Pāli có `“cakkhumanto rūpāni dakkhantī”ti` (1/1 nháy kép), lớp lấp 0/0 vì dùng lại nguyên văn `3.12.3` (Pāli trùng) mà Sujato diễn không nháy — ưu tiên luật Pāli trùng ⇒ English trùng. Dấu lược khớp Pāli ở cả 172 khoá. **Hệ quả đọc của tầng ghim (không sửa):** các câu tóm `1.2.4`, `2.3.5`, `2.7.5`, `2.11.5`, `2.13.2`, `3.16.3`, `3.18.3`, `3.31.3`, `3.33.1` đứng trước bản đầy đủ của lớp lấp, nên một số ý xuất hiện hai lần.

  Triangulation 8.0: scorecard Việt của `dn14` (`content/meta/sutta/dn/dn14.yaml`) ghi `quality.assessed_by` thuộc **cùng họ công cụ hỗ trợ** với lớp lấp này (đối chiếu `source/tooling.yaml`). Vì vậy bản lấp **không phải** cách đọc English độc lập, và scorecard Việt của bài **không** được tuyên bố là đã đối chiếu English nhờ lớp lấp. Đối chiếu thật sự có: Pāli root đã ghim + Sujato đã ghim (mọi khoá có lời) + bản Việt canonical (chỉ để đối chiếu nghĩa, không dịch vòng, không chép câu).

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; bốn lệnh đó còn nợ, nên không tuyên bố technical gate pass. Không đặt blocker vì chưa chạy không phải validation failure. Đã tự kiểm bằng máy: JSON parse, mọi khoá ⊆ `fillableSegments` của bài, 0 khoá shadow, NFC, 0 khoá rỗng, thứ tự khoá theo Pāli, Pāli trùng nguyên văn ⇒ English trùng (trừ các chỗ ghi ở trên), dấu lược và nháy so với Pāli từng khoá (dấu `’` có chữ thường đứng ngay sau tính là dấu nhạt lượu).

  Hai cơ chế khoá trống của tầng đã ghim (đo rồi báo, không sửa — sửa là shadow): **cắt cụt dãy** (dãy ≥ 4 khoá trống liên tiếp) = 14 dãy / 158 khoá / 13663 ký tự Pāli; **bỏ dòng song song** (chỉ xét khoá trống, thân từ = 6 chữ đầu của từ ≥ 4 chữ, khoá mở nhóm gom mọi khoá trống chưa vào nhóm có tỉ lệ chung ≥ 0,70, mỗi khoá thuộc đúng một nhóm) = 98/172 khoá. Khoá đã ghim có chữ nhưng ngắn dưới 25% Pāli (Pāli ≥ 40 ký tự): 17 (`1.4.5`, `1.5.1`, `1.5.2`, `1.5.4`, `1.5.5`, `1.6.2`, `1.6.3`, `1.6.5`, `1.6.6`, `1.13.5`, `1.13.6`, `1.15.3`, `1.32.7`, `3.1.3`, `3.8.4`, `3.31.2`, `3.33.3`) — chủ yếu là câu tóm, nên `ratio` của tầng ghim lạc quan; ví dụ `1.32.7` gánh cả vế “xuất gia thì thành Phật” lẫn tướng thứ nhất nhưng chỉ dịch “He has well-planted feet.”.

  Hệ quả với `content/meta/reference-gaps.yaml`: `dn/dn14` **có** record trong tệp đó. Record đó sẽ thành thừa sau khi bài `published`; lát này **không** chạm tệp đó, để người điều phối sinh lại bằng `npm run reference:gaps`. Coverage đo trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): trước 539/680 = 0.7926; sau khi lớp lấp `published`: 680/680 = 1.0000 (141 khoá có nội dung được lấp, còn 0 khoá có nội dung thiếu English). Độ nhạy: phải mất thêm 137 khoá có nội dung nữa thì bài mới rớt dưới ngưỡng 0,8.
