notes: |-
  Phân loại 78 khoá đã ghi (đo bằng script, theo Pāli đã có lời trong cùng bài): A y nguyên = 41 · B dựng lại = 21 · C tự dịch = 6 · D (Pāli trùng, lời đã ghim khác nhau; báo, không tự hòa) = 10. Script phân loại theo Pāli trùng nên các khoá tách ra từ một khoá đã ghim bị gộp sẵn (đếm là C) được nêu riêng bên dưới.
  Số khoá đã ghi: 78 trên 81 khoá tầng Anh đã ghim để trống (3 khoá còn trống).
  Khoá còn trống và lý do: 1.17.6, 1.18.29, 2.3.7 (3 khoá `Sacepissa evamassa—`, 20 ký tự, dưới 40 nên không vào coverage). Khoá liền trước đã ghim kết thúc bằng “… face to face, otherwise” và khoá liền sau là “his head may explode.”, nên Sujato đã nén `Sacepissa evamassa—` vào chữ “otherwise”; lấp “If he thinks he can” sẽ lặp và làm câu hỏng. Ở các chuỗi mà cả ba khoá đều trống (1.18.3–5, 1.18.7–9, …) thì lấp đủ.
  Nhóm B (khoá ← khoá nguồn, tỉ lệ khớp do script đo): 1.4.9 ← 1.4.3 (1.00); 1.4.11 ← 1.4.6 (1.00); 1.5.9 ← 1.5.3 (0.99); 1.5.11 ← 1.5.6 (0.99); 1.6.3 ← 1.6.1 (0.75); 1.6.6 ← 1.6.4 (0.77); 1.6.9 ← 1.6.7 (0.77); 1.14.2 ← 1.13.18 (0.86); 1.16.2 ← 1.15.2 (0.85); 1.18.7 ← 1.18.28 (0.99); 1.18.15 ← 1.18.28 (0.99); 1.18.35 ← 1.18.28 (0.99); 1.20.7 ← 1.20.5 (0.87); 1.21.2 ← 1.20.2 (0.89); 1.21.3 ← 1.20.3 (0.87); 1.21.6 ← 1.15.5 (0.98); 2.1.7 ← 1.15.4 (0.78); 2.4.7 ← 1.15.4 (0.78); 2.4.19 ← 1.17.7 (1.00); 2.6.8 ← 2.6.5 (0.93); 2.6.9 ← 2.6.6 (0.96).
  Nhóm D: 1.18.3, 1.18.5, 1.18.11, 1.18.13, 1.18.17, 1.18.33, 1.18.37, 1.21.4, 2.1.14, 2.4.14.
  Nháy: 19 khoá có số dấu nháy khác Pāli (1.4.9, 1.4.11, 1.5.9, 1.5.11, 1.13.4, 1.17.3, 1.18.7, 1.18.9, 1.18.15, 1.18.17, 1.18.35, 1.18.37, 1.21.5, 1.21.7, 1.22.3, 2.1.7, 2.1.8, 2.4.7, 2.4.8); các khoá còn lại khớp Pāli từng khoá.
  Dấu lược: 3 khoá chứa `…` (1.21.6, 2.1.7, 2.4.7); mỗi `…pe…` của Pāli tương ứng đúng một `…` của English, không khoá nào mở rộng.

  Cấu trúc bài. Bài lặp lại cùng một công thức nhiều lần với nhiều người nói khác nhau; điểm dịch khó nhất không phải là chữ mà là AI NÓI. Pāli của các khoá `abhabbo … mama sammukhībhāvaṁ āgantuṁ` và `ahaṁ taṁ vācaṁ appahāya … muddhāpi tassa vipateyyāti` y hệt ở mọi chỗ, nhưng Sujato dịch “mama” và “samaṇassa gotamassa” theo người nói: “meeting me” (Phật nói), “meeting the Buddha” (Sunakkhatta hoặc chư thiên nói với Phật), “meeting him” (sứ giả nói với Pāṭikaputta). Lớp lấp theo đúng quy tắc đó chứ không dùng lại máy móc một câu cho mọi nơi; đây là cái bẫy của `sn11.24` được áp dụng.
  Nhóm A (số do script đếm xem phía trên): phần lớn là cụm 1.16.4–1.16.11 dùng lại 1.15.4–1.15.11; 1.19.10–1.19.11; 1.21.8/9; 2.1.9 và 2.4.9; 1.7.10 và 1.13.4; 2.8.8 và 2.9.10 dùng lại 2.10.10; 2.20.22 dùng lại 2.18.22.
  Nhóm B — 1.6.3, 1.6.6, 1.6.9 dựng từ 1.6.1, 1.6.4, 1.6.7 (0.75, 0.77, 0.77): `Iti kho te, sunakkhatta, anekapariyāyena X vaṇṇo bhāsito vajjigāme.` là “That’s how, Sunakkhatta, in many ways you have praised X in the Vajjian capital.” 1.16.2 dựng từ 1.15.2 (0.85): lời tường thuật ở quá khứ (“was residing … had reached”) đổi thành hiện tại trong lời nói trực tiếp (“is residing … has reached”). 1.21.2, 1.21.3 dựng từ 1.20.2 và 1.20.3 (0.89, 0.87). 1.21.6 dựng từ 1.15.5 (0.98), giữ một `…`. 2.6.8 và 2.6.9 dựng từ 2.6.5 và 2.6.6 (0.93, 0.96) ở thì quá khứ. 2.4.19 dựng từ 1.17.7 (0.997), đổi sang ngôi thứ hai “your head” vì sứ giả nói với Pāṭikaputta.
  Nhóm B tách phần bị nuốt — 1.4.9, 1.4.11, 1.5.9, 1.5.11: tầng đã ghim nén ở 1.4.8 và 1.5.8 (“I did not ask this of you, and you did not require it of me.”) cả bốn câu trích; lớp lấp dựng lại từ 1.4.3/1.4.6 và 1.5.3/1.5.6. 1.4.10 và 1.5.10 `napi kira maṁ tvaṁ vadesi—` lệch có chủ đích khỏi lời đã ghim ở 1.3.13 (“nor did you say you would”), vì ở 1.4.x khoá tiếp theo là cả một câu trích: viết “nor did you say to me:”.
  Nhóm D (10 khoá, báo chứ không tự hòa): (1) 1.18.5, 1.18.13, 1.18.17, 1.18.33, 1.18.37, 2.1.14 — Pāli y hệt 1.17.7 và 1.18.30, lời đã ghim chỉ là “his head may explode.” nhưng khác ở dấu nháy; lớp lấp dịch đầy đủ theo người nói (xem trên). (2) 1.21.4 — Pāli trùng 1.20.11, 2.1.6, 2.4.6, nhưng 1.20.11 là “For you stated this in the assembly at Vesālī:” còn 2.1.6 và 2.4.6 là “You said you’d meet the ascetic Gotama half-way.”; chọn 1.20.11 vì 1.21.x là bản nhắc lại của 1.20.x trong cùng lời nhắn. (3) 1.18.3 và 1.18.11 — 1.17.5 và 2.4.12 khác nhau (“meeting the Buddha” / “meeting him”); chọn theo người nói.
  Nhóm C hoặc gần C — 1.9.2 (kira, “It seems that …” theo 1.20.2 đã ghim), 1.14.2 (script đếm B vì Pāli gần 1.13.18, nhưng 1.13.18 chỉ là “And that’s exactly what happened.”, nên đây thực chất là dịch từ Pāli với từ vựng của 1.13.17), 1.20.7, 1.22.3 (đổi thành mệnh đề phụ “although he said … he only wriggled there, unable to get up from his seat,” để đi liền với “that Pāṭikaputta had lost,” đã ghim ở 1.22.2), 2.17.13 (“less long-lived, less beautiful, and less illustrious” đối xứng với 2.17.12), 2.21.17 (“About Pāṭikaputta is finished—the first.”).
  Nháy: các khoá lệch Pāli đều do cùng một nguyên nhân, là tầng đã ghim nén hoặc đóng nháy ở khoá liền trước nên khoá lấp phải tự mở/đóng một cặp để đọc được: cặp “ ” cho lời `…karissāmīti` (1.4.9, 1.4.11, 1.5.9, 1.5.11, như 1.4.3 đã ghim), cặp “ ” quanh lời chư thiên (1.18.7–9, 1.18.15–17, 1.18.35–37), cặp “ ” quanh lời Pāṭikaputta (1.21.5–7, 2.1.7–8, 2.4.7–8), 1.13.4, 1.17.3, 1.22.3. Danh sách đo bằng script ở đầu phần này.
  Dấu lược: các khoá chứa `…` đều là dấu lược của Pāli (`…pe…` ở 1.21.6, 2.1.7, 2.4.7); không khoá nào mở rộng.

  Cố ý lệch tầng đã ghim: Dịch theo người nói chứ không dùng lại một câu cho mọi nơi (“me” / “the Buddha” / “him”); 1.4.10 và 1.5.10 khác 1.3.13; 1.16.3 dùng hiện tại “tells” thay vì “was telling” của 1.15.3; 1.18.14 “Deities also told me about it:” khác 1.18.34 “and deities told me about it.” (thêm “also” cho `-pi`).

