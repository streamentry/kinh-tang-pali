notes: |-
  **Phân loại 87 khoá (đo bằng máy): A = 36 · B = 48 · C = 3 · D = 0.** Cả 87 khoá nằm trong tập khoá tầng Anh đã
  ghim để trống; 8 khoá ở phần 1 và 79 khoá ở phần 2.

  **Nhóm 1 — tám khoá kết ví dụ “evameva kho, ānanda, …” (B).** Sujato dịch cả ví dụ và phần áp dụng bằng một câu duy nhất (“It was just like Āḷakamandā …”;
  “like a quintet …”) và để trống dòng áp dụng. Lớp lấp viết dòng áp dụng bằng “In the same way,” + lời đã ghim của vế đó:
  `1.3.9` ← `1.3.7` (0,87); `1.6.12` ← `1.6.10` (0,84) và `1.32.12` ← `1.32.10` (0,84), hai khoá Pāli trùng nguyên văn nên lời giống hệt;
  `1.21.3` ← `1.21.1` (0,78); `1.21.6` ← `1.21.4` (0,75); `1.29.6` ← `1.29.4` (0,84); `1.29.10` ← `1.29.9` (0,32; “Palace of Principle” lấy từ `1.33.1`).
  `1.23.11` ← `1.23.9` (0,91): cùng danh sách Pāli với `1.23.9` (đã ghim “so that those in need of food, drink, … can get what they need?”),
  đổi sang trần thuật (“got what they needed”), bỏ nháy.

  **Nhóm 2 — `2.6.5`–`2.6.7`.** Sujato `2.6.4` chỉ còn một câu (“He instructed the commander-treasure to do this, and so it was done.”) cho cả lệnh,
  vâng lời và thực hiện. Lớp lấp dịch từng bước: `2.6.5` ← `2.6.3` (0,81) với “Dear commander-treasure,” (như `2.8.2`) và “royal elephants” (như `2.6.1`);
  `2.6.6` (C) “‘Yes, Your Majesty,’ replied …” (như `2.9.3`); `2.6.7` (C) “…42,000 … at a time came to attend on him …”.

  **Nhóm 3 — ba bản liệt kê tài sản (`2.10.6`–`2.10.30`, `2.11.10`–`2.11.34`, `2.12.7`–`2.12.31`: 75 khoá).** Mỗi bản, Sujato chỉ dịch dòng thành phố và câu
  lặp đầu, gộp phần còn lại thành một câu tóm tắt ở dòng cung điện (`2.10.5`, `2.11.9`, `2.12.6`) và để trống 25 khoá. Pāli `Imāni te, deva, caturāsīti X-sahassāni Y.` (12 mục:
  chambers, couches, bull elephants, horses, chariots, jewels, women, householders, aristocrat vassals, milk-cows, cloths, servings of food) là lời nói
  hiện tại của hoàng hậu, song song với `2.5.3`–`2.5.14` (“He had 84,000 …”, quá khứ). Lớp lấp dùng đúng thuật ngữ `2.5.x` đã ghim
  (“chambers … Chamber of the Grand Tower”, “bull elephants … Sabbath”, “horses … Thundercloud”, “chariot named Triumph”, “woman-treasure”,
  “householder-treasure”, “commander-treasure”, “8,400,000,000 cloths”, “servings of food”), đổi sang “Your Majesty, you have …” và hiện tại (“are
  spread”, “are presented to you”). 36 khoá B (12 mục × 3 bản), tỉ lệ khớp Pāli với `2.5.x` từ 0,40 đến 0,86; `2.11.23` (Pāli `subhaddādevippamukhāni`) dịch
  “with Queen Subhaddā foremost” (theo `2.5.9`) còn `2.10.19`, `2.12.20` (Pāli `itthiratanappamukhāni`) dịch “woman-treasure”.
  39 khoá câu lặp “Ettha, deva, chandaṁ …” (36 A + 3 B): A ← `2.10.4` (“Arouse desire for these! Take an interest in life!”, 13 khoá của `2.10`) và ← `2.11.8`/`2.12.5` (“Give up
  desire for these! Take no interest in life!”, 26 khoá của `2.11`, `2.12`). Ba khoá cuối mỗi bản (`2.10.30`, `2.11.34`, `2.12.31`) là B (0,80) vì kèm nháy đóng.

  **Ngoặc.** Lời đã ghim `2.10.4` đóng ’ ngay sau câu lặp đầu, nhưng Pāli `2.10.4` KHÔNG có nháy; nháy mở ở `2.10.3` chỉ đóng ở `2.10.30` (`karohī’ti`). Lớp lấp
  theo Pāli: bỏ ’ ở 12 khoá giữa, đặt ’ ở `2.10.30`. Tương tự `2.11.34` đóng ”’ (Pāli `mākāsī”’ti`) và `2.12.31` đóng ’ (`mākāsī’ti`). Hai lời đã ghim `2.11.8`
  (kết bằng ”’) và `2.12.5` (kết bằng ’) chỉ khác nháy nên không tính D. Đo: trong 87 khoá lấp có 5 khoá Pāli mang nháy (`2.6.5`, `2.6.6`, `2.10.30`, `2.11.34`, `2.12.31`);
  lớp lấp khớp 5/5.

  **C (3 khoá).** `2.6.6`, `2.6.7`, `2.17.9` “King Mahāsudassana is finished—the fourth.” (`Mahāsudassanasuttaṁ niṭṭhitaṁ catutthaṁ.`; tên theo `0.2` đã ghim; đúng vị trí: Pāli ghi `catutthaṁ`).

  **Dấu lược:** Pāli 87 khoá không có `…`/`…pe…`; lớp lấp 0. Điểm ngoài lát, chỉ báo: lời đã ghim `2.10.5`, `2.11.9`, `2.12.6` (câu tóm tắt “And she likewise urged
  the king…”, “And so on for all the king’s possessions.”, “And she continued, listing all the king’s possessions.”) không dịch Pāli của chính khoá ấy
  (`Imāni te, deva, caturāsīti pāsādasahassāni dhammapāsādappamukhāni.`) — lớp lấp không thể ghi đè (sẽ là shadow).

  **Khoá trống còn lại: 0.** Cả 87 khoá đều có Pāli ≥ 40 ký tự nên đều vào coverage; không có khoá ngắn.

  Triangulation 8.0: bản Việt canonical của bài (`content/meta/sutta/dn/dn17.yaml`) có cùng họ công cụ với lớp lấp này (đo bằng cách so `translators`/`reviewers`/`quality.assessed_by` với `source/tooling.yaml`), nên lớp lấp KHÔNG phải cách đọc English độc lập và bài này không được tuyên bố là đã đối chiếu English độc lập. Bản Việt chỉ được dùng để đối chiếu nghĩa, không dịch vòng qua nó.

