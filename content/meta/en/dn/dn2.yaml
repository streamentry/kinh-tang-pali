notes: |-
  **Phân loại 69 khoá (máy đo, so Pāli đã chuẩn hoá với các khoá đã có lời): A = 26 · B = 36 · C = 7 · D = 0.** Sau khi đọc từng khoá trong bối cảnh bài, phân loại thực tế của bản lấp là: **dùng lại nguyên văn 14** (`16.4`, `16.5`, `84.7`–`84.9`, `88.5`, `92.4`, `92.5`, `92.19`, `94.3`, `96.3`, `98.5`–`98.7`) · **dịch đủ chữ Pāli ở chỗ lời đã ghim bị rút thành dấu `…` 13** (`92.6`–`92.18`) · **dựng lại từ lời đã ghim 40** (xem nhóm 3–6) · **tự dịch 2** (`13.4`, `102.7`). Hai con số máy A = 26 và thực tế “nguyên văn” = 14 lệch nhau ở 13 khoá `92.6`–`92.18`, vì lời đã ghim ở các khoá trùng Pāli (`91.5`–`91.17`) chỉ là **mảnh rút gọn kết bằng `…`** (xem nhóm 2), không thể dùng nguyên văn; và ở `16.4`, nơi một khoá Pāli gộp hai khoá đã ghim.

  **Nhóm 1 — dùng lại nguyên văn (14 khoá).** `16.5` = `14.4` = `34.5` (ba khoá đã ghim đồng nhất); `16.4` ghép đúng hai khoá đã ghim `14.2` và `14.3` (Pāli `16.4` gộp hai khoá ấy làm một); `84.7`–`84.9` = `83.2`–`83.4`; `88.5` = `87.2`; `94.3` = `93.2` (Pāli trùng từng chữ, đã kiểm bằng máy); `96.3` = `95.2` (Pāli khác `95.2` chỉ ở chuẩn hoá dấu); `98.5`–`98.7` = `97.4`–`97.6`; `92.4` = `91.3` và `92.5` = `91.4`; `92.19` = `91.18`. **Một ngoại lệ nháy có lý do:** `98.6` Pāli `vimuttasmiṁ ‘vimuttam’iti ñāṇaṁ hoti` có một cặp nháy đơn (Pāli 1/1) còn lời đã ghim của khoá trùng Pāli `97.5` (“When they’re freed, they know they’re freed.”) **không** có nháy; lấp dùng lại nguyên văn `97.5` nên 0/0. Ghi cả hai số để người đọc thấy lệch.

  **Nhóm 2 — `92.6`–`92.18` (13 khoá): dịch đủ chữ Pāli, KHÔNG sao chép dấu `…` của tầng đã ghim.** Mười ba khoá `91.5`–`91.17` đã ghim dịch Pāli **viết đủ** (`sadosaṁ vā cittaṁ ‘sadosaṁ cittan’ti pajānāti, …`) thành mảnh “They understand mind with hate …”, “mind without hate …”, … “freed mind …” — tức thêm 13 dấu `…` ở nơi Pāli không có dấu lược nào. Lấp đối xử với `92.6`–`92.18` đúng như Pāli: viết đủ công thức “X as ‘X’” theo khuôn mà tầng đã ghim giữ nguyên ở `91.3`–`91.4` và `91.18` (“They understand mind with greed as ‘mind with greed’, | and mind without greed as ‘mind without greed’.”), nên các cặp đối lập vẫn đi thành cặp (`92.6`–`92.7` hate, `92.8`–`92.9` delusion, `92.10`–`92.11` constricted/scattered, `92.12`–`92.13` expansive, `92.14`–`92.15` supreme, `92.16`–`92.17` immersed). Thuật ngữ lấy từ các mảnh đã ghim: “constricted”, “scattered”, “expansive”, “unexpansive”, “not supreme”/“supreme”, “immersed”, “unimmersed”, “freed”. **Hệ quả cần nói thẳng:** hai bản (đã ghim `91.x` và lấp `92.x`) cùng dịch một Pāli nhưng khác dạng bề mặt; đây là cách lấp **sửa** chứ không sao chép một lỗi của tầng đã ghim. `92.18` kết bằng dấu chấm để cặp `92.18`–`92.19` đóng câu, vì `92.19` dùng nguyên văn `91.18` vốn mở bằng “They understand”.

  **Nhóm 3 — `16.3`, `16.6`, `19.3`, `19.4`, `22.3`, `22.4`, `25.3`, `25.4`, `28.3`, `28.4`, `31.3`, `31.4` (12 khoá): câu hỏi của vua A-xà-thế với sáu vị thầy.** Dựng lại từ `14.1` và `14.5` (0,84–0,96): đây là lời vua A-xà-thế hỏi sáu vị thầy ngoại đạo, y hệt lời vua hỏi Đức Phật ở `14.1` và `14.5` — chỉ đổi người nghe, và đổi nháy kép “ thành nháy đơn ‘ (vì lời hỏi nằm trong lời kể của vua). `bhante` ở `14.x` là “sir”, còn `bho kassapa`/`bho gosāla`/`bho ajita`/`bho kaccāyana`/`bho aggivessana`/`bho sañcaya` — thưa với vị thầy ngoại đạo — dịch “Worthy Kassapa …” v.v., theo cách tầng đã ghim ở bài `dn4` dịch `bho gotama` là “worthy Gotama”. Khoá `16.2`, `19.2`, … đã ghim chỉ dịch “asked him the same question” (nuốt cả câu hỏi `16.3`–`16.6`), nên lấp chèn lại câu hỏi. `19.3`, `22.3`, `25.3`, `28.3`, `31.3` Pāli kết bằng `…pe…` — mỗi khoá giữ đúng một `…`: “… many different professional fields …” (khác `16.3` có đủ danh sách ở `16.4`). `16.4` ghép hai khoá `14.2`+`14.3` đã ghim; không có `…`.

  **Nhóm 4 — `18.3`, `21.3`, `24.3`, `27.3`, `30.3`, `33.3` (6 khoá): câu kết của từng vị thầy.** Dựng lại từ `18.1`, `21.1`, `24.1`, `27.1`, `30.1`, `33.1` (0,94–0,95): mỗi khoá Pāli `evameva kho me, bhante, X … byākāsi` là vế đối của so sánh “mango/breadfruit” ở khoá liền trước (`18.2`…); lấp giữ nguyên danh xưng và tên học thuyết đã ghim (“the bamboo-staffed ascetic Gosāla”, “Ajita of the hair blanket”, “the Jain Ñātika”, “Sañjaya Belaṭṭhiputta”, “the doctrine of inaction” …), chỉ thay câu mở bằng “In the same way, sir, when I asked …”.

  **Nhóm 5 — `35.13`–`35.15`, `37.16`–`37.18` (6 khoá): lời các quân hầu tâu vua về người nô bộc / nông phu đã xuất gia.** Dựng lại từ `35.2`, `35.10`, `35.11`, `37.5`, `37.14` (0,79–0,94). Pāli `yagghe, deva, jāneyyāsi` dịch “Your Majesty, you should know that …” (tầng đã ghim ở `dn14` dịch `deva` là “Your Majesty”). Hai khoá `35.14` và `37.17` Pāli trùng nhau từng chữ; `35.15` và `37.18` Pāli trùng nhau từng chữ; lấp dùng cùng một lời cho mỗi cặp. Người xuất gia là “they”, theo đúng ngôi trung tính mà tầng đã ghim dùng ở `35.10`–`35.11` (Pāli là ngôi thứ ba số ít). Pāli `35.15` dùng hiện tại `viharati` (“lives”), còn `35.11` đã ghim dùng điều kiện “they’d live”; lấp dịch hiện tại, theo Pāli.

  **Nhóm 6 — `69.5`–`73.5` (13 khoá): năm ví dụ nợ nần – bệnh – tù – nô lệ – sa mạc.** Dựng lại từ khoá mô tả ngôi thứ ba ở ngay trước (`69.1`–`69.3`, `70.1`–`70.2`, `71.1`–`71.2`, `72.1`–`72.2`, `73.1`–`73.2`), đổi sang lời tự nhủ ngôi thứ nhất theo Pāli (`ahaṁ kho pubbe …`, `somhi etarahi …`). Lấp giữ nguyên chữ đã ghim — “got into debt and applied myself to work”, “efforts proved successful”, “pay off the original loan and have enough left over to support my partner”, “sick, suffering, gravely ill”, “lose their appetite and get physically weak” (đổi “lose their” thành “lost my”), “released from jail, safe and sound, with no loss of wealth”, “not their own master, but indentured to another, unable to go where they wish”, “crossed over the desert safely, arriving within a village, a sanctuary free of peril” — chỉ đổi ngôi và thì. Mỗi cụm tự nhủ mở ‘ ở khoá đầu (`69.5`, `70.4`, `71.4`, `72.4`, `73.4`) và đóng ’ ở khoá cuối (`69.7`, `70.7`, `71.5`, `72.5`, `73.5`), đúng Pāli.

  **Nhóm 7 — `74.3` (1 khoá).** Pāli `evameva kho, mahārāja, bhikkhu ime pañca nīvaraṇe pahīne attani samanupassati` — khoá đã ghim `74.2` đã nuốt nghĩa này vào “But when these five hindrances are given up inside themselves, a mendicant regards this as freedom from debt …”. Lấp dựng lại vế song song với `74.1` (“In the same way, as long as these five hindrances are not given up inside themselves, a mendicant regards them as …”): “In the same way, Great King, a mendicant regards these five hindrances as given up inside themselves.” Có thể người đọc thấy ý này lặp với `74.2` đã ghim, do tầng đã ghim gộp.

  **Nhóm 8 — `98.3`, `98.4` (2 khoá): lời các Thánh đế và lậu hoặc viết đủ.** Khoá `97.2` và `97.3` đã ghim dịch cùng Pāli (`‘So idaṁ dukkhan’ti yathābhūtaṁ pajānāti, …` ×4) thành “They truly understand: ‘This is suffering’ … ‘This is the origin of suffering’ … ‘This is the cessation of suffering’ …” — tức thêm 3 dấu `…` nơi Pāli viết đủ bốn lần `yathābhūtaṁ pajānāti`. Lấp dịch đủ bốn vế (“They truly understand: ‘…’; they truly understand: ‘…’; …”), không thêm `…`; nháy đơn 4 cặp, khớp Pāli (4/4).

  **Nhóm 9 — `13.4` và `102.7` (2 khoá), C.** `13.4` Pāli `sace me bhagavā okāsaṁ karoti pañhassa veyyākaraṇāyā”ti` — khoá đã ghim `13.3` đã gộp “if you’d take the time to answer” và đóng ”; lấp dịch riêng phần còn lại (“if the Buddha would give me the opportunity to have my question answered.””) và đóng ” theo Pāli, nên có hai dấu đóng liền nhau ở `13.3`–`13.4` — do tầng đã ghim gộp. `102.7` “The Fruits of the Ascetic Life is finished—the second.” (dòng kết bài, dưới ngưỡng 40).

  **Nháy.** 69 khoá khớp Pāli từng khoá (script: 0 khoá lệch), **trừ `98.6`** đã nêu ở nhóm 1. **Dấu lược:** Pāli có `…pe…` ở `19.3`, `22.3`, `25.3`, `28.3`, `31.3`; lấp có đúng một `…` ở mỗi khoá (tổng 5); 0 ở các khoá còn lại.

  **Số khoá trống còn lại: 0.** Cả 69 khoá `fillableSegments` đã lấp; 63 khoá có nội dung (≥ 40 ký tự) và 6 khoá dưới ngưỡng (`69.6`, `70.6`, `71.5`, `84.7`, `98.6`, `102.7`).

  **Cảnh báo nhãn thứ tự:** bài không có khoá chỉ là nhãn thứ tự.

  **Coverage.** Mẫu số 499 (Pāli có nội dung, bỏ khối `:0`). Trước lớp lấp: 436/499 = **0,8737**; sau khi `published`: 499/499 = **1,0000**. Độ nhạy: ngưỡng 0,8 cần tối thiểu 400/499; bài trước lớp lấp cách ngưỡng 36 khoá, không nhạy. Bài `dn2` **không** có record trong `content/meta/reference-gaps.yaml`, nên không record nào thành thừa vì lớp lấp này. Lỗ hổng của bộ đo: các khoá `91.5`–`91.17` được tính là đã phủ vì không rỗng, dù chỉ giữ vài chữ trong mỗi dòng Pāli.

