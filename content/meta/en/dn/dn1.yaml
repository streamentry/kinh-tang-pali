notes: |-
  **Phân loại 31 khoá (máy đo, so Pāli đã chuẩn hoá với các khoá đã có lời): A = 3 · B = 26 · C = 1 · D = 1.** Sau khi đọc từng khoá trong bối cảnh bài, phân loại thực tế của bản lấp là: **dùng lại nguyên văn 4** (`1.4.5`, `1.4.6`, `1.4.7` sau khi giải D, `1.4.8`) · **dựng lại / tự dịch theo thuật ngữ cùng bài 25** · **tự dịch 2** (`1.10.2`, `3.74.7`). Phần lớn máy xếp B vì khoá lấp ở đây là **câu dài song song** với khoá đã ghim nhưng dùng một vế chữ khác.

  **Nhóm 1 — `1.4.4`–`1.4.8` (5 khoá): các tỳ-kheo kể lại với Đức Thế Tôn điều ở `1.3`.** `1.4.5` và `1.4.6` (máy: A, dùng nguyên văn `1.3.2` và `1.3.3`); `1.4.8` (A với `1.3.5`) dùng nguyên văn lời `1.3.5` — chỉ đổi dấu nháy theo Pāli: `1.3.2` mở “, còn `1.4.5` mở ‘ (lồng một tầng sâu hơn, vì lời các tỳ-kheo nằm *trong* lời kể), và `1.3.5` đóng ” còn `1.4.8` đóng ’. · `1.4.7` là **D**: Pāli trùng `1.1.5`, `1.2.4`, `1.3.4`, nhưng lời đã ghim khác nhau (`1.1.5` và `1.2.4` đều “but his pupil Brahmadatta praised them in many ways”, còn `1.3.4` “while his pupil Brahmadatta praises them in many ways”). Khác ở thì (quá khứ so với hiện tại) và liên từ (“but” so với “while”). Phân xử: `1.4.7` cùng thể lời **trực tiếp của các tỳ-kheo ở thì hiện tại** với `1.3.4` (cùng lời nói của các tỳ-kheo, đang kể điều đang diễn ra), nên dùng lại nguyên văn `1.3.4`; `1.1.5`/`1.2.4` là lời kể của người viết kinh ở thì quá khứ, khác bối cảnh. · `1.4.4` dựng lại từ `1.3.1` (0,87): Pāli `idha, bhante, amhākaṁ …` là lời nói ngôi thứ nhất của các tỳ-kheo (“we”), còn `1.3.1` là lời kể ngôi thứ ba (“several mendicants rose”). Lấp đổi ngôi và giữ nguyên cụm đã ghim “at the crack of dawn”, “sat together in the pavilion”, “the topic of judgmentalism came up”; thêm “Sir,” cho `bhante`. Khoá đã ghim `1.4.3` đã dịch “The mendicants told him what had happened, adding,” nên `1.4.4` mở bằng nháy kép “ như Pāli.

  **Nhóm 2 — `1.10.2` (1 khoá), tự dịch, có dấu lược.** Pāli `iti vā hi, bhikkhave …pe….` — nửa đầu của công thức “iti vā hi, bhikkhave, puthujjano tathāgatassa vaṇṇaṁ vadamāno vadeyya” rồi bỏ phần còn lại. Tầng đã ghim dịch đủ công thức ở 25 chỗ (“Such is an ordinary person’s praise of the Realized One.”). Ở đây lấp **không** mở rộng dấu lược: chỉ dịch phần Pāli viết (“Such, mendicants …”) và giữ đúng một `…`. Mở rộng thành câu đủ sẽ là chèn chữ không có trong Pāli.

  **Nhóm 3 — `2.6.2` (1 khoá), B.** Pāli `Ye pana te sattā pacchā upapannā, te appāyukatarā ca honti dubbaṇṇatarā ca appesakkhatarā ca` — vế đối của `2.6.1` đã ghim (“the being who was reborn first is more long-lived, beautiful, and illustrious than those who arrived later”). Tầng đã ghim đã **nuốt** vế này vào lời “than those who arrived later”. Lấp dựng lại vế đối bằng cùng ba chữ đã ghim ở `2.6.1` (“long-lived”, “beautiful”, “illustrious”) ở dạng so sánh thấp: “shorter-lived, less beautiful, and less illustrious”. `dubbaṇṇa` dịch “less beautiful” để đối xứng với “beautiful” đã ghim (`vaṇṇavantataro`), không phải “ugly”.

  **Nhóm 4 — `3.58.1`–`3.69.1` (12 khoá) và `3.71.1`–`3.71.11` (11 khoá): hai khối Pāli lặp mười hai/mười một nhóm “Tatra, bhikkhave, ye te samaṇabrāhmaṇā …”.** · **Khối “netaṁ ṭhānaṁ vijjati” (`3.58.1`–`3.69.1`):** mỗi khoá là một nhóm tà kiến (thường hằng, bán thường, hữu biên/vô biên, ngụy biện, ngẫu nhiên sinh, tiền tế, hậu tế …) kèm “te vata aññatra phassā paṭisaṁvedissantīti netaṁ ṭhānaṁ vijjati” (*điều ấy không thể có: họ cảm thọ ngoài xúc*). Tầng đã ghim dịch **chính câu kết** ấy ở `3.70.1` (“Now, when those ascetics and brahmins … on these sixty-two grounds, it is not possible that they should experience these things without contact.”), nên lấp dùng đúng khung câu đó, chỉ đổi vế “when those ascetics and brahmins …” theo từng nhóm. Cụm mô tả từng nhóm lấy nguyên từ cách tầng đã ghim dịch ở các phần tương ứng: `2.1.1` (“assert that the self and the cosmos are partially eternal and partially not eternal on four grounds”), `2.16.1`, `2.23.1` (“endless flip-floppers … verbal flip-flops and endless flip-flops”), `2.30.1`, `1.29.1`, `3.1.1`, `3.17.1` (“annihilation, eradication, and nonexistence of an existing being”), `3.19.1` (“ultimate extinguishment for an existing being in this life”), `2.37.1`. Số căn cứ (bốn, bốn, bốn, bốn, hai, mười tám, mười sáu, tám, tám, bảy, năm, bốn mươi bốn) khớp Pāli từng khoá. **Lệch có chủ ý so với tầng đã ghim ở khối song song `3.45`–`3.56` (cùng cấu trúc, câu kết “tadapi phassapaccayā”):** tầng đã ghim dịch mười hai khoá ấy thành các mảnh một mệnh đề kết bằng `…` dù Pāli của mỗi khoá viết đủ, không có dấu lược (`3.45.1`–`3.56.1`, 12 khoá thừa dấu `…`). Lấp **không** sao chép các dấu `…` ấy. · **Khối “yepi te samaṇabrāhmaṇā …” (`3.71.1`–`3.71.11`):** một câu duy nhất được ngắt qua mười hai khoá (khoá `3.71.12` đã ghim là vế kết “all of them experience this by repeated contact …”). Mười một khoá lấp là các vế “and those ascetics and brahmins who …” kết bằng dấu lược, đúng như Pāli (`3.71.1` kết bằng `…pe…`, các khoá `3.71.2`–`3.71.11` kết bằng `…`); mỗi khoá có đúng một `…`. Mô tả nhóm ngắn hơn khối trước vì Pāli ngắn hơn (chỉ tên nhóm).

  **Nhóm 5 — `3.74.7` (1 khoá), C.** Dòng kết bài `Brahmajālasuttaṁ niṭṭhitaṁ paṭhamaṁ.` (dưới ngưỡng 40) → “The Divine Net is finished—the first.” theo khuôn các bài đã có và tên bài đã ghim ở `0.2`.

  **Nháy.** 31 khoá khớp Pāli từng khoá, đo bằng đếm (script: 0 lệch): `1.4.4` mở “ · `1.4.5` mở ‘ · `1.4.8` đóng ’; các khoá còn lại 0/0. **Dấu lược:** Pāli có `…pe…` ở `1.10.2`, `3.71.1` và `…` ở `3.71.2`–`3.71.11` (11 khoá); lấp có đúng một `…` ở mỗi khoá đó, tổng 12; các khoá còn lại 0.

