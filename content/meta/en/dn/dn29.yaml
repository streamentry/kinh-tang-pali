notes: |-
  **Phân loại 61 khoá (đo bằng máy trên Pāli đã ghim và tầng Anh đã ghim của chính bài này, ngưỡng gần-trùng 0,75 trên Pāli đã bỏ dấu câu): A = 37 · B = 15 · C = 9 · D = 0.**
  Định nghĩa để tái lập: A khi Pāli chuẩn hoá trùng nguyên văn với khoá đã có lời và các khoá ấy chỉ có một dạng lời; D khi Pāli trùng nhưng các lời đã ghim
  khác nhau; B khi không trùng nhưng gần trùng (≥ 0,75); C là phần còn lại. Tổng 37 + 15 + 9 + 0 = 61, đúng bằng số khoá đã ghi (61/61
  khoá của `fillableSegments`). Cách xử lý thực tế: trong nhóm A, 25 khoá lấy lại **nguyên văn từng chữ** và 12 khoá có điều chỉnh (nêu bên dưới);
  36 khoá viết tay (gồm B, C, D và các A có điều chỉnh).

  **Nhóm báo tin Nigaṇṭha Nāṭaputta (C, 4 khoá: `2.2`, `2.3`, `3.2`, `3.3`).** Tầng đã ghim nuốt cả lời kể của Cunda và lời
  Ānanda thuật lại vào “told him what had happened” ở `2.1`, `3.1`. Lớp lấp dịch theo Pāli, dùng chữ của `1.3`
  (“the Jain ascetic of the Ñātika clan has recently passed away at Pāvā”), `1.4` (“With his passing the Jain
  ascetics split, dividing into two factions”) và `1.7` (“with broken monument and without a refuge”); Pāli
  `…pe…` ở `2.3` và `3.3` thành đúng một “…”. `3.2` thêm “this novice Cunda” theo `2.1`. Máy xếp C (0,55–0,71 với
  `1.3`/`1.4`).

  **Nhóm A thuần (25 khoá nguyên văn).** `12.2`, `12.5`, `13.2`, `15.2` (←`11.2`, “who can rightly explain the true teaching …”) ·
  `16.17`, `16.24`, `16.27`, `16.28` · `34.6`, `36.28`, `37.2` (“Shall I explain them to you in the wrong way?”, ba chỗ Pāli giống hệt) ·
  `36.16`, `36.17`, `36.18`, `36.20`, `36.21` · `37.5` · `39.3`, `39.5`–`39.10`, `39.13`. Tất cả có lời nguồn duy nhất (D = 0); bốn khoá
  `16.28`, `36.20`, `36.21`, `39.13` nguyên văn nhưng thuộc nhóm ngoại lệ nháy bên dưới.

  **Nhóm danh sách quan điểm (`36.2`–`36.16`, `39.2`–`39.13`) — A có điều chỉnh (12 khoá).** Pāli viết mỗi dòng danh sách
  kèm `…`; tầng đã ghim ở `34.10`–`34.23` **bỏ** các dấu lược đó (13 khoá không có “…” dù Pāli có), còn ở `37.6`–`37.11`
  thì có. Lớp lấp lấy chữ của `34.x`, thêm “ …” cuối khoá để khớp số dấu lược của Pāli (`36.3`, `36.5`, `36.6`, `36.7`,
  `36.9`–`36.15`) — đó là điều chỉnh, không phải nguyên văn. `36.2`, `36.4`, `36.8`, `39.4` là B (0,95/0,99/0,79/0,98).
  `39.2` Pāli giống `37.6` nhưng lớp lấp viết “‘The self is formless …” chứ không “or formless …”: `37.6` nối tiếp câu
  mở ở `37.4`, còn `39.2` mở danh sách mới sau tóm tắt `39.1`; đó là **lệch có chủ đích** so với lời `37.6`.

  **Nhóm “Yes!” và nháy (QEXC, 8 khoá: `16.7`, `16.25`, `16.26`, `16.28`, `36.20`, `36.21`, `39.12`, `39.13`).** (i) `16.4`–`16.6`
  đã ghim dịch lời trích trực tiếp `‘sabbākārasampannaṁ …’ti` thành lời gián tiếp (“it’s endowed with all good
  qualities, … and fully revealed,”), không dùng nháy; Pāli có nháy đơn. Bốn khoá lấp theo đúng cách đó để câu
  liền mạch (đo nháy đơn mở/đóng: Pāli 1/1 ở `16.7`, `16.28`; 1/0 ở `16.25`; 0/1 ở `16.26`; lấp 0/0). (ii) `35.6`/`38.6` và `35.7`/`38.7`
  đã ghim dịch `Yañca kho te evamāhaṁsu:` / `‘idameva saccaṁ moghamaññan’ti.` thành “But when they say, ‘Yes! … This is the
  only truth, anything else is futile,’” — chữ “Yes!” là **thêm của tầng đã ghim** (Pāli không có), và nháy mở nằm ở `X.6`
  chứ không ở `X.7`. Lớp lấp giữ nguyên văn cho `36.20`, `36.21`, `39.13` (và thêm “Cunda,” ở `39.12`, 0,88 ←`35.6`) để các
  khoá cùng Pāli đọc giống nhau; đo nháy đơn mở/đóng: `36.20` Pāli 0/0, lấp 1/0; `36.21` Pāli 1/1, lấp 0/1; `39.12` Pāli 0/0, lấp
  1/0; `39.13` Pāli 1/1, lấp 0/1.

  **Nhóm B còn lại.** `17.5` (0,91 ←`17.2`, lấy vế “come together and recite in concert …” của `17.1`, vì tầng đã ghim bỏ vế
  `yattha …` ở `17.2`) · `28.5`, `28.6`, `28.7` (0,93/0,93/0,95 ←`28.1`–`28.3`, đổi “the past” thành “the present”; `28.4` đã ghim
  nuốt ba khoá này bằng “replies to questions about the future or the present in the same way”) · `30.5`, `30.10`,
  `30.15`, `30.20` (0,88–0,92 ←`30.7`, `30.12`, `30.17`, bốn quan điểm về Như Lai sau khi chết, nháy kép lồng nháy đơn khớp Pāli) · `36.19`
  (0,81) · `39.11` (0,78) · `16.3` (C, 0,68 ←`16.1`, đã bị `16.2` nuốt) · `41.9` (câu kết, “An Impressive Discourse is
  finished—the sixth.”).

  **Dấu lược do tầng đã ghim thêm/bỏ:** 1 khoá có “…” thừa (`37.4`) và 43 khoá bỏ dấu lược mà Pāli có (phần lớn các dòng
  danh sách `12.6`–`15.x`, `34.11`–`34.23`); lớp lấp chỉ sửa trong khoá của mình.

  **Nháy kép “ ” và đơn ‘ ’ (không tính dấu nhạt lượu `’s`, `’t`…).** Đo từng khoá so với Pāli: 8 khoá lệch có chủ đích (`16.7`, `16.25`, `16.26`, `16.28`, `36.20`, `36.21`, `39.12`, `39.13`), mỗi khoá có lý do và số đo ở nhóm tương ứng bên trên; 53 khoá còn lại khớp Pāli.

  **Dấu lược.** Pāli của 61 khoá có 24 dấu lược (`…pe…` đếm là **một**); lớp lấp ghi 24. Pāli viết đủ thì lớp lấp không thêm “…”.

  **Khoá trống còn lại.** Không còn: cả 61 khoá thuộc `fillableSegments` đã được lấp, kể cả các khoá dưới ngưỡng 40 ký tự (câu kết, nhãn thứ tự, dấu lược) vì chúng có thật trong Pāli; những khoá ấy không vào coverage nhưng bỏ trống sẽ để lại chỗ hổng giữa bài.

  **Coverage (đo thật, mẫu số khác 0).** Mẫu số: 323 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Trước lớp lấp: 291/323 = 0,9009. Sau khi lớp lấp `published`: 323/323 = 1,0000. Độ nhạy: ngưỡng 0,8 cho phép tối đa 64 khoá thiếu English; lớp lấp đưa số khoá thiếu từ 32 về 0 nên bài còn đệm 64 khoá. Bài này **không** có record trong `content/meta/reference-gaps.yaml`, nên không có record nào thành thừa vì lát này.

  **Khoá có chữ nhưng ngắn hơn hẳn Pāli (dấu hiệu cắt cụt/gộp của tầng đã ghim).** Đo: 12 khoá mà lời Anh đã ghim < 30% độ dài Pāli (Pāli ≥ 60 ký tự). Đây là chỗ `ratio` có thể lạc quan; lớp lấp không sửa được các khoá đã ghim. Đã dò Pāli trùng nguyên văn trên cả bài: 74 nhóm (mỗi nhóm từ hai khoá trở lên).

  **Triangulation 8.0 (trần của bài).** Scorecard Việt của `dn29` (`content/meta/sutta/dn/dn29.yaml`) do cùng họ công cụ với lớp lấp chấm (alias khai ở `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập của bản Việt và **không** được tuyên bố là đã đối chiếu English. Đối chiếu thực có: Pāli root + bản Anh đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Tệp Việt và metadata Việt không bị chạm.

  **technical_integrity 9.6.** Không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh ấy còn lại cho người điều phối, và chưa chạy cổng không phải blocker. Đã tự kiểm bằng phép đo riêng: JSON parse, NFC, mọi khoá thuộc `fillableSegments`, không khoá nào che bản đã ghim, dấu lược khớp Pāli, nháy (kể các ngoại lệ đã nêu), Pāli trùng ⇒ lời trùng, và `final_score` bằng trung bình số học thô.
