  **Nhóm 1 — `4.3`–`4.7` (5 khoá).** Tầng đã ghim gộp cả chuỗi “some … some … while some kept silent” vào `4.2`; bản lấp dịch từng vế theo chữ của `4.2` và `4.1` (“held up their cupped palms toward Kassapa the Prince”, “announced their name and clan”, “greetings and polite conversation were over”).
  `3.16`←`3.11` (0,87): “Worthy sir, the chieftain Pāyāsi asks you to wait, as he will also go to see the ascetic Kassapa the Prince.” (lời `3.10`+`3.11`, đổi ‘ ’ thành “ ” theo Pāli).
