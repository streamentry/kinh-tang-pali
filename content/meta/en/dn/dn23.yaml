  (ba câu), `6.2`, `6.21` và `33.6` (một câu ba vế), và dạng **cắt cụt** “there is no afterlife.” ở **14 khoá** (`8.2`, `8.21`, `10.2`, `10.19`, `12.2`, `12.14`, `14.2`, `14.16`, `16.2`, `16.15`, `18.2`, `18.35`, `20.2`, `20.17`); 7 khoá còn lại là khoá của lát. Dạng cắt cụt này bỏ hai vế Pāli có thật — vì vậy bản lấp **không** theo dạng cắt cụt,
  mà dùng dạng đầy đủ: `5.6` theo `5.3` (cùng bối cảnh “doctrine and view”), `6.4`, `6.6`, `8.4`, `8.6` theo `6.2`, `33.8` theo `33.6` (liền kề). `22.4` cùng Pāli nhưng trong ‘ “ ” ’ lồng, theo `5.3`. **Đây là chỗ cố ý lệch lời Sujato ở các khoá cắt cụt (đo, không sửa)**: những khoá đó đã được coi là đã phủ, nên `ratio` của bài lạc quan.
