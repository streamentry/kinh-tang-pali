notes: |-
  **Phân loại 283 khoá lấp: A = 217 · B = 40 · C = 14 · D = 12.** Gần hết các khoá thuộc phần tụng thứ hai
  (`12.2`–`12.279`): sáng hôm sau Đức Phật **thuật lại nguyên văn** cho các tỳ-kheo toàn bộ phần tụng thứ nhất
  (`1.3`–`11.5`), kể cả trọn bài kệ hộ trì. Tầng đã ghim tóm cả phần này vào một câu ở `12.1` (“the Buddha told
  the mendicants all that had happened, repeating all the verses spoken. Then he added:”) và để trống 278 khoá
  `12.2`–`12.279`. Đó là **cắt cụt dãy** (một dãy 278 khoá trống liền nhau), không phải gộp khoá: lời `12.1`
  không mang chữ nào của `12.2` trở đi. Năm khoá còn lại: `9.6`, `9.7`, `10.20`, `10.21` (vế “cũng vậy” và
  lời kêu cứu lặp lại trong phần tụng thứ nhất) và `13.7` (dòng kết).

  **Căn theo vị trí, đã kiểm bằng máy.** `12.15`–`12.230` (216 khoá) ứng với `3.2`–`7.90` theo đúng thứ tự;
  `12.231`–`12.274` ứng với `8.1`–`11.4` (riêng `12.232` = `8.2` + `8.3` gộp làm một khoá Pāli, và `12.245`,
  `12.246`, `12.269`, `12.270` ứng với các khoá lấp `9.6`, `9.7`, `10.20`, `10.21`). Trên 216 cặp kệ, Pāli
  khớp hoàn toàn sau khi bỏ dấu ở 214 cặp; hai cặp lệch là `12.146` `nāpi` / `7.6` `napi` và `12.201`
  `Sukasāḷika saddettha` / `7.61` `Sukasāḷikasaddettha` — lời giữ nguyên.

  **Nhóm A — 217 khoá, Pāli trùng nguyên văn một khoá đã ghim:** 206 khoá dùng lại **nguyên văn** từng chữ.
  11 khoá giữ nguyên chữ nhưng đổi mức nháy hoặc chữ hoa: `10.20`, `12.269` viết hoa chữ đầu (“One ought to
  yell…”) vì khoá trước kết bằng dấu chấm, còn `9.9` đã ghim viết thường vì nối tiếp dấu phẩy của `9.8`;
  `12.70` `12.100` `12.136` `12.226` (“Do you bow to Gotama the victor?”), `12.197` `12.198` `12.202`
  (tiếng chim “Live, live!”…), `12.251` `12.268` (dãy tên dạ-xoa) đổi nháy đơn của lời đã ghim thành
  nháy kép, vì ở phần tụng thứ hai bài kệ nằm lồng **thêm một tầng** trong lời Đức Phật: Pāli mở `“` ở `12.2`
  (lời Phật), `‘` ở `12.5`/`12.15` (lời Vessavaṇa), và các trích dẫn bên trong thành `“…”` (ví dụ `12.44`
  `“divaso”ti`, `12.249` `“ayaṁ yakkho…”ti`). Lớp lấp hạ đúng một mức như Pāli; dấu `’` có chữ thường liền sau
  là dấu nháy lược của tiếng Anh nên không đổi.

  **Nhóm D — 12 khoá: chỉ báo, không hòa.** Ba câu Pāli lặp nhiều lần mà tầng đã ghim dịch không đồng nhất:
  `Vijjācaraṇasampannaṁ,` (“…conduct,” ở `3.24`, “…conduct!” ở `4.35` `5.29` `6.35` `7.89`),
  `mahantaṁ vītasāradaṁ.` (“great of heart and intrepid.” ở `3.25`, “the one great of heart and intrepid.” ở
  `4.26` `5.20` `6.26` `7.80`), `Rahadopi tattha gambhīro,` (“there is a deep lake,” ở `4.7`, “…in that place,”
  ở `6.7`). Lớp lấp **không** chọn một bản để hòa; mỗi khoá lấy đúng lời của khoá song song **cùng vị trí** ở
  phần tụng thứ nhất (`12.37`←`3.24`, `12.38`←`3.25`, `12.45`←`4.7`, `12.111`←`6.7`, …), nên phần tụng thứ hai
  lặp lại phần thứ nhất y như tầng đã ghim viết nó. Sự không đồng nhất là của tầng đã ghim.

  **Nhóm B — 40 khoá.** (a) 30 khoá Pāli chỉ khác dấu nháy (mức lồng), lời giữ nguyên chữ, đổi mức nháy:
  `12.15`, `12.44`, `12.48`, `12.49`, `12.54`, `12.71`–`12.72`, `12.74`, `12.79`, `12.84`, `12.101`–`12.102`,
  `12.104`, `12.110`, `12.114`–`12.115`, `12.120`, `12.137`–`12.138`, `12.140`, `12.183`, `12.205`, `12.210`,
  `12.227`–`12.228`, `12.230`, `12.249`, `12.270`, `12.272`, `12.273`. (b) 4 khoá khác một chữ không đổi nghĩa,
  lời giữ nguyên: `12.146`, `12.201`, `12.237` (`attāhi` / `attāhipi`), `12.271` (thiếu `sā`).
  (c) 6 khoá đổi ngôi kể chuyện hoặc đổi từ nối, dựng lại từ lời đã ghim và chỉ thay phần Pāli thay:
  `12.2`←`1.3` (0,93; `imaṁ, bhikkhave, rattiṁ` → “Mendicants, late last night”; `yena bhagavā` → “came to
  me”), `12.3`←`1.4` (0,88; `maṁ`, `mayā saddhiṁ`, `yenāhaṁ` → “to me”, “with me”, “toward me”),
  `12.14`←`3.1` (0,90; `me adhivāsanaṁ` → “that I had consented”; dùng `:` như Pāli thay dấu chấm của lời đã
  ghim), `12.274`←`11.4` (0,90), `9.6` và `12.245`←`9.1` (0,94; `Evameva kho` → “In the same way” thay “For”).

  **Nhóm C — 14 khoá, tự dịch từ Pāli bằng từ vựng của chính bài:**
  `12.4` (“Seated to one side, mendicants, the Great King Vessavaṇa said to me,”, theo `2.1`) ·
  `12.13` (“Mendicants, I consented with silence.”, theo `2.16`) ·
  `12.5` — Pāli rút gọn sáu câu `2.2`–`2.7` thành câu đầu `…pe…` câu cuối; lớp lấp giữ **đúng một** `…`. Lưu ý
  lời đã ghim ở `2.2`–`2.7` **đảo** thứ tự từng cặp (Pāli nói “không tín tâm” trước, lời đã ghim nói “have
  confidence … some do not”); `12.5` dịch theo thứ tự Pāli: “Sir, some high spirits have no confidence in the
  Buddha … some low spirits have confidence in the Buddha.” ·
  `12.8`, `12.9` — Pāli có `…` (dấu lược đơn, không phải `…pe…`) giữa giới đầu và giới cuối; lời giữ một `…`.
  `12.9` dịch đủ hai giới Pāli nêu, trong khi `2.11` đã ghim chỉ viết “such things” ·
  `12.12` = Pāli `2.14` + `2.15` gộp làm một khoá; ghép nguyên văn hai lời đã ghim, đổi `”` thành `’` ·
  `12.232` = `8.2` + `8.3` gộp, có ba `…pe…`: lời đã ghim `8.3` đã **mở rộng** danh sách chúng phi nhân
  (“including males, females, boys, girls…”), nên không dùng được; lớp lấp dịch theo Pāli, giữ **ba** `…` ·
  `12.247` ứng với `9.8` nhưng Pāli có **bốn** `…pe…` (thêm một sau `nāgī vā`) và `upagaccheyya` thay
  `anugaccheyya`; lời đã ghim `9.8` mở rộng cả ba dấu lược, nên lớp lấp dịch lại, giữ bốn `…` ·
  `12.275`–`12.279` = năm khoá Pāli tách từ một khoá `11.5`; dịch từng khoá, lấy chữ “bowed and respectfully
  circled … keeping … on their right side”, “exchanged greetings and polite conversation”, “held up their cupped
  palms”, “announced their name and clan”, “kept silent”, “vanishing right there” của `11.4`/`11.5` ·
  `13.7` dòng kết → “The Āṭānāṭiya Discourse, the ninth, is finished.”

  **Nháy — đo, ghi cả hai số.** 255/283 khoá khớp nháy Pāli từng khoá; 28 khoá lệch, **cố ý**. 20 khoá trong số đó
  lệch **y hệt** khoá song song đã ghim lệch với Pāli của nó: tầng đã ghim không đặt nháy quanh tên/định nghĩa
  (`‘divaso’ti`, `‘dhataraṭṭho’ti`, `Ito ‘sā purimā disā’`…) và lại thêm nháy nơi Pāli không có (`‘Live, live!’`,
  `‘Do you bow…’`, dãy tên `‘Indra … Serīsaka.’`). 8 khoá còn lại (`12.71`–`12.72`, `12.101`–`12.102`,
  `12.137`–`12.138`, `12.227`–`12.228`) ở khổ “Jinaṁ vandatha …”: phần tụng thứ nhất Pāli có **hai** trích
  dẫn, phần thứ hai Pāli gộp thành **một**; lời đã ghim đã dời dòng (câu hỏi “Do you bow…?” đặt ở dòng
  `vademase`), nên lớp lấp giữ cấu trúc hai trích dẫn của lời đã ghim. Tổng trên 283 khoá: Pāli 23 mở / 22
  đóng; lớp lấp 20 mở / 19 đóng (mở thừa một ở cả hai là lời Phật mở ở `12.2`, đóng ở `13.4` đã ghim).

  **Hệ quả đọc cần biết (của tầng đã ghim, lớp lấp không sửa):** `12.1` đã ghim nói Đức Phật “repeating all
  the verses spoken” rồi cột Anh hiện đầy đủ bản thuật lại; `13.1` đã ghim lại mở `“` mới trong khi lời Phật đã
  mở ở `12.2`. Lời đã ghim cũng dời câu giữa các dòng kệ (ví dụ `3.22`/`3.23`, `7.7`/`7.8`, `7.26`–`7.29`,
  `7.63`/`7.64`); vì luật A, phần tụng thứ hai dời y như thế. Các cách đọc tên riêng của tầng đã ghim cũng đi
  theo: `Ālakamandā` (`8.5` → `12.234`, Pāli `āḷakamandāya`), `Nāṭapuriyā` (Pāli `Nāṭasuriyā`), `Kapīvanta`
  (Pāli `kasivanto`), `Suppagedha` (Pāli `supparodho`). Không sửa ở đây vì sẽ làm hai phần tụng lệch nhau;
  ghi để biên tập sau.

  **Dấu lược:** Pāli 283 khoá có 10 dấu lược (`12.5` 1, `12.8` 1, `12.9` 1, `12.232` 3, `12.247` 4 — tính
  `…pe…` là một); lớp lấp có đúng 10, khớp từng khoá. Không khoá nào thêm `…` nơi Pāli viết đủ.
  Dò toàn bài các nhóm Pāli trùng nguyên văn có lời Anh: 10 nhóm có lời khác nhau theo chữ, 7 trong số đó chỉ
  khác mức nháy/chữ hoa (do lồng trích dẫn), 3 nhóm là nhóm D ở trên.

  **Coverage và `content/meta/reference-gaps.yaml`:** 93 khoá Pāli có nội dung; trước 47/93 = 0,5054; sau khi
  `published` 93/93 = 1,0 (dư 18 khoá so với ngưỡng 0,8). Lớp lấp phủ 46 khoá có nội dung; 237 khoá lấp còn
  lại là dòng kệ và câu ngắn dưới 40 ký tự, không vào mẫu số nhưng vẫn lấp để phần tụng thứ hai đọc liền
  mạch. Bài **có** record trong `content/meta/reference-gaps.yaml`; sau khi lớp này `published` record đó thành
  thừa — để người điều phối sinh lại tệp bằng `npm run reference:gaps`, lát này không chạm tệp đó.

  **Triangulation 8,0:** `quality.assessed_by` trong scorecard Việt của `dn32` trùng công cụ với lớp lấp, nên lớp lấp **không** phải một cách đọc English độc lập, và scorecard tiếng Việt của bài
  không được tuyên bố đã đối chiếu English nhờ lớp này. Đối chiếu có: Pāli root + lời Sujato đã ghim của phần
  tụng thứ nhất + bản Việt canonical (kiểm nghĩa, không dịch vòng).

  **technical_integrity 9,6:** lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`; bốn lệnh đó còn nợ, nên không tuyên bố technical gate pass.
