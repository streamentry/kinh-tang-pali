notes: |-
  **Phân loại 31 khoá (đo bằng máy): A = 8 · B = 12 · C = 9 · D = 2.** Bài này tầng đã ghim **tóm và cắt cụt**
  nhiều nhất trong lát, nên lớp lấp buộc phải đi theo các mảnh câu của tầng đã ghim để khoá lấp đọc nối được.

  **Nhóm A — 8 khoá chép nguyên văn:** `8.5`, `8.6`, `8.7` ← `9.2`, `9.3`, `9.4`; `18.7`, `20.3` ← `14.5` (“and not even
  the ancient seers”); `18.8`, `20.4` ← `14.6` (“claimed to know where he is.”); `20.6` ← `18.10`.

  **Nhóm D — 2 khoá `Teva tevijjā brāhmaṇā evamāhaṁsu:` (`20.5`, `22.10`).** Tầng đã ghim dịch Pāli này hai cách: `14.7`
  “Yet the brahmins proficient in the three Vedas say:” và `18.9` “they still claim”. **Báo, không hòa.** Lớp lấp chọn
  “they still claim” vì khoá kế (`20.6`, `22.11`) là lời của `18.10` (“to teach the path to …”), tức chuỗi `20.5–20.6` và
  `22.10–22.11` trùng Pāli với chuỗi `18.9–18.10`.

  **Nhóm B — 12 khoá:**
  - `8.3` (0,80 với `3.1`): lời người dẫn chuyện ở `3.1` chuyển sang ngôi “we” và thêm “Here, worthy Gotama”.
  - `14.2–14.4` (0,88–0,90 với `12.3`, `12.5`, `12.7`): câu hỏi ở `12.x` chuyển thành vế phủ định nối tiếp lời đã ghim
    `14.1` (“none of those brahmins have seen …,”) → “nor even a single one of their tutors, / … tutors’ tutors, / nor
    anyone back to the seventh generation of tutors,”, rồi nối vào `14.5` đã ghim.
  - `18.2` (1,00 với `17.3`): bỏ dấu hỏi và `”` vì Pāli `18.2` là câu khẳng định đóng bằng `’ti`.
  - `18.4–18.6`, `20.2` (0,90): `20.2` có Pāli **trùng nguyên văn** `18.6` nên lời giống hệt (“nor anyone back to the
    seventh generation of tutors,”). ⚠️ Hệ quả: `20.1` đã ghim chỉ còn ““In the same way,” — **cắt cụt** ba vế đầu — nên
    `20.2` bắt đầu giữa chuỗi phủ định. Lỗi tự bắt: bản nháp đầu viết `20.2` thành câu riêng (“Nor, it seems, has anyone
    …”), lệch với `18.6` cùng Pāli; đã sửa về một lời.
  - `22.8`, `22.9`, `22.11` (1,00 / 0,99 / 1,00): lấy lời `14.5`, `14.6`, `18.10`. `22.7` đã ghim cũng chỉ còn “In the same
    way,” (cắt cụt cả bốn vế).
  **C — 9 khoá:** `8.4` (“I say that”, để nối vào lời gián tiếp của `8.5` chép từ `9.2`); colophon `82.6` (“Experts in
  the Three Vedas is finished—the thirteenth.”), `82.7` và `83.5` dùng tên phẩm Anh của chính tầng đã ghim (“The Chapter on
  the Entire Spectrum of Ethics”, lấy từ tệp tên phẩm của Sujato); bài kệ tóm tắt `83.0–83.4` theo khuôn “Its summary
  verse:” của lớp lấp và dùng tên Anh của DN1–13 do tầng đã ghim đặt (Pāli viết tắt: `Brahmā` = The Divine Net, `Soṇa` =
  Soṇadaṇḍa, `Kūṭa` = Kūṭadanta, `Jālinī` = Jāliya, `Sīha` = the Lion’s Roar, `kevaṭṭo` = Kevaḍḍha theo chính tả của Sujato).

  **Nháy — lệch có lý do, đo được.** 23/31 khoá khớp Pāli. 8 ngoại lệ: `14.3`, `18.5` là **dương tính giả**
  (sở hữu cách “tutors’ tutors”). 6 khoá còn lại — `8.5`, `8.7`, `18.8`, `20.4`, `20.6`, `22.11` — Pāli có cặp `‘…’ti`
  (1/1) mà lớp lấp có 0/0, vì tầng đã ghim dịch **chính Pāli ấy** thành lời gián tiếp không nháy ở `9.2`, `9.4`, `14.6`,
  `18.10` (4 khoá đã ghim). Khi chép nguyên văn (A) hoặc dựng lại (B) từ các khoá đó, thêm nháy vào lời gián tiếp sẽ sai ngữ
  pháp. **Dấu lược:** Pāli 0, lấp 0. **Khoá trống còn lại: 0.**

  **Gộp/tóm có thật (đọc tay).** `8.2` đã ghim tóm “Vāseṭṭha told him of their conversation, adding:” rồi `8.8` mở `“`
  lần nữa — nên `8.3` lấp (mở `“` theo Pāli) và `8.8` đã ghim cùng mở `“`; lặp nháy mở do tầng đã ghim, không sửa được.
  Đọc nối các khoá A ở `18.x`, `20.x`, `22.x` vẫn có chỗ chữ thường đứng sau dấu chấm (“…where he is. they still claim …”)
  — đúng như chuỗi đã ghim `18.8–18.9`.

  **Hai cơ chế khoá trống:** cắt cụt dãy = 5 dãy / 27 khoá / 2.610 ký tự Pāli; bỏ dòng song song = 7 nhóm / 20 khoá (≤ 31).
  Ngoài ra **cắt cụt trong khoá có chữ** (BRIEF §5d): `20.1` và `22.7` đã ghim chỉ còn “In the same way,” (17 ký tự) cho Pāli dài 209
  / 294 ký tự — hai khoá này được tính là “đã phủ”, nên `ratio` của bài **lạc quan** ở mức đó.

  **Coverage (đo theo quy tắc kho: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước lát: 157/176 = 0.8920; sau khi lớp lấp `published`: 176/176 = 1.0000 (19 khoá lấp có nội dung). Độ nhạy: ngưỡng 0,8 cần 141 khoá; còn dư 35, mất 36 khoá thì rớt ngưỡng. Nếu lớp lấp không `published` thì coverage giữ nguyên 0.8920.
  Hệ quả với `content/meta/reference-gaps.yaml`: `dn/dn13` **không** có record.

  Triangulation 8.0: metadata Việt của bài này (`content/meta/sutta/dn/dn13.yaml`) ghi `quality.assessed_by` cùng **họ công cụ** với lớp lấp (`source/tooling.yaml`), nên lớp lấp này **không phải** cách đọc English độc lập, và scorecard Việt của bài **không được** tuyên bố đã đối chiếu English nhờ lớp này. Đối chiếu có: Pāli root + Sujato đã ghim + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng). Không có bản Anh thứ hai cho các khoá lấp. Không chạm tầng Việt.

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, để người điều phối chạy khi gom. Tự kiểm bằng máy đã làm: JSON parse, mọi khoá ⊆ `fillableSegments` của bài, không khoá nào trùng khoá Sujato có chữ (0 shadow), không khoá rỗng, NFC, dấu lược khớp quy tắc `…pe…` = một `…`, khoá theo thứ tự Pāli, YAML parse, `final_score` = trung bình số học thô.
