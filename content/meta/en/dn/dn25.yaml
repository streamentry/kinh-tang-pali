notes: |-
  **Phân loại 37 khoá (đo bằng máy trên Pāli đã ghim và tầng Anh đã ghim của chính bài này, ngưỡng gần-trùng 0,75 trên Pāli đã bỏ dấu câu): A = 9 · B = 15 · C = 12 · D = 1.**
  Định nghĩa để tái lập: A khi Pāli chuẩn hoá trùng nguyên văn với khoá đã có lời và các khoá ấy chỉ có một dạng lời; D khi Pāli trùng nhưng các lời đã ghim
  khác nhau; B khi không trùng nhưng gần trùng (≥ 0,75); C là phần còn lại. Tổng 9 + 15 + 12 + 1 = 37, đúng bằng số khoá đã ghi (37/37
  khoá của `fillableSegments`). Cách xử lý thực tế: trong nhóm A, 9 khoá lấy lại **nguyên văn từng chữ** và 0 khoá có điều chỉnh (nêu bên dưới);
  28 khoá viết tay (gồm B, C, D và các A có điều chỉnh).

  **Nhóm “Yampi” (B, 10 khoá: `9.3`, `9.6`, `9.9`, `10.2`, `10.5`, `10.8`, `12.4`, `12.13`, `13.2`, `15.12`; thêm `15.4` do máy xếp C).**
  Pāli lặp từng mệnh đề của khoá liền trước rồi mở bằng `Yampi, nigrodha, …` (“khi …”), sau đó mới tới
  “Ayampi kho … upakkileso hoti” (“điều này cũng là một cấu uế”). Tầng đã ghim dịch dòng “Puna caparaṁ …” và
  dòng kết nhưng bỏ dòng “Yampi …” (cơ chế bỏ dòng song song). Lớp lấp dùng đúng lời của khoá nguồn, thay
  “Furthermore, …” bằng “Nigrodha, when …”. Tỉ lệ khớp: `9.3` 0,96 (←`9.2`) · `9.6` 0,93 (←`9.5`) · `9.9` 0,93
  (←`9.8`) · `10.2` 0,96 (←`10.1`) · `10.5` 0,96 (←`10.4`) · `10.8` 0,96 (←`10.7`) · `12.4` 0,86 (←`12.3`) ·
  `12.13` 0,81 (←`12.12`) · `13.2` 0,96 (←`13.1`) · `15.12` 0,83 (←`15.11`) · `15.4` 0,64 (←`15.3`). Phần tầng đã
  ghim nuốt mất và lớp lấp chèn lại là toàn bộ vế “khi …” đó. `12.4` và `15.3` còn có một **dấu lược do tầng đã
  ghim thêm** (“… irritable and acrimonious …”) dù Pāli viết đủ; lớp lấp không chép dấu lược ấy.

  **Khoá D `12.5`.** Pāli “Ayampi kho, nigrodha, tapassino upakkileso hoti.” có hai dạng đã ghim: `9.4` “This is
  a defect in that mortifier.” (1 khoá) và “This too is a defect in that mortifier.” (14 khoá). Báo, không
  hoà; chọn “This too is …” (14/15).

  **Nhóm “Evameva suññāgārahatā” (`5.6`, `5.7`, `5.8`, `5.9`, `20.8`).** Câu của Nigrodha ở `5.3`–`5.5` được Pāli
  lặp ở `5.6`–`5.9` thành bốn mảnh. `5.9` = A (←`5.4` “He just lurks on the periphery.”); `5.6`–`5.8` máy xếp C
  (0,43–0,60) vì Pāli chia nhỏ, lớp lấp cắt câu “Staying in empty huts has destroyed the ascetic Gotama’s
  wisdom. Not frequenting assemblies, he is unable to hold a discussion.” của `5.3` đúng theo ranh Pāli.
  `20.8` (0,96 ←`20.6`) thêm “In the same way,” và dùng chữ của `20.6`.

  **Khoá `4.4`, `21.7`, `21.12`.** `Seyyathidaṁ—rājakathaṁ (corakathaṁ) …pe… itibhavābhavakathaṁ iti vā.` rút gọn
  danh sách đầy đủ ở `2.2` (“talk about kings, bandits, and chief ministers; … and talk about being reborn in
  this or that place.”). `21.7` và `21.12` có Pāli trùng (chỉ khác dấu phẩy cuối) nên cùng một lời; `4.4` bỏ
  `corakathaṁ` nên bỏ “bandits”.

  **Khoá `14.13`, `14.15`.** `‘nakkhamatī’ti.`/`‘khamatī’ti.` là hai lời đáp mà tầng đã ghim gộp vào `14.12` (“they say
  it isn’t when it isn’t”). Lớp lấp dịch “‘It isn’t acceptable.’” và “‘It is acceptable.’”, lấy chữ
  “acceptable” của `14.12`.

  **Nhóm bốn pháp chế ngự (`18.4`–`18.7`, `19.4`–`19.7`).** `18.4`, `19.4` (0,95 ←`16.4`) thêm vocative “Nigrodha,” và
  một dấu lược (Pāli `…pe…`); `18.5`, `18.6`, `19.5`, `19.6` là A (←`16.10`, `16.11`); `18.7`, `19.7` máy xếp C
  (0,47), dịch “They frequent a secluded lodging …” lấy mệnh đề đầu của `16.12`.

  **Khoá `13.7`, `13.9`, `13.11`** là A (“So they’re pure on that point.”, 12 khoá nguồn cùng một lời).

  **Nhóm “Tiṭṭhatu” (`22.18`, `22.19`, `22.21`).** Tầng đã ghim dịch lệch khoá ở đây: khoá `22.20` mang lời “seven
  months …” dù Pāli `22.20` là câu “Yathānusiṭṭhaṁ …” dài, còn `22.21` (Pāli `Tiṭṭhantu, nigrodha, satta māsāni …`)
  bị bỏ trống. Lớp lấp dịch `22.21` theo Pāli: “Let alone seven months …” (đúng một dấu lược) và `22.18`
  “Let alone one year.” (0,79 ←`22.10`); `22.19` là A (←`22.8`, `22.11`, `22.30`).

  **Khoá `24.8`** là câu kết, lấy tên bài của `0.2`.

  **Nháy kép “ ” và đơn ‘ ’ (không tính dấu nhạt lượu `’s`, `’t`…).** Đo từng khoá so với Pāli: 37/37 khoá khớp, không có ngoại lệ.

  **Dấu lược.** Pāli của 37 khoá có 8 dấu lược (`…pe…` đếm là **một**); lớp lấp ghi 8. Pāli viết đủ thì lớp lấp không thêm “…”.

  **Khoá trống còn lại.** Không còn: cả 37 khoá thuộc `fillableSegments` đã được lấp, kể cả các khoá dưới ngưỡng 40 ký tự (câu kết, nhãn thứ tự, dấu lược) vì chúng có thật trong Pāli; những khoá ấy không vào coverage nhưng bỏ trống sẽ để lại chỗ hổng giữa bài.

  **Coverage (đo thật, mẫu số khác 0).** Mẫu số: 274 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Trước lớp lấp: 252/274 = 0,9197. Sau khi lớp lấp `published`: 274/274 = 1,0000. Độ nhạy: ngưỡng 0,8 cho phép tối đa 54 khoá thiếu English; lớp lấp đưa số khoá thiếu từ 22 về 0 nên bài còn đệm 54 khoá. Bài này **không** có record trong `content/meta/reference-gaps.yaml`, nên không có record nào thành thừa vì lát này.

  **Khoá có chữ nhưng ngắn hơn hẳn Pāli (dấu hiệu cắt cụt/gộp của tầng đã ghim).** Đo: 9 khoá mà lời Anh đã ghim < 30% độ dài Pāli (Pāli ≥ 60 ký tự). Đây là chỗ `ratio` có thể lạc quan; lớp lấp không sửa được các khoá đã ghim. Đã dò Pāli trùng nguyên văn trên cả bài: 38 nhóm (mỗi nhóm từ hai khoá trở lên).

  **Triangulation 8.0 (trần của bài).** Scorecard Việt của `dn25` (`content/meta/sutta/dn/dn25.yaml`) do cùng họ công cụ với lớp lấp chấm (alias khai ở `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập của bản Việt và **không** được tuyên bố là đã đối chiếu English. Đối chiếu thực có: Pāli root + bản Anh đã ghim + bản Việt canonical (dùng để kiểm nghĩa, không dịch vòng, không chép). Tệp Việt và metadata Việt không bị chạm.

  **technical_integrity 9.6.** Không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh ấy còn lại cho người điều phối, và chưa chạy cổng không phải blocker. Đã tự kiểm bằng phép đo riêng: JSON parse, NFC, mọi khoá thuộc `fillableSegments`, không khoá nào che bản đã ghim, dấu lược khớp Pāli, nháy (kể các ngoại lệ đã nêu), Pāli trùng ⇒ lời trùng, và `final_score` bằng trung bình số học thô.
