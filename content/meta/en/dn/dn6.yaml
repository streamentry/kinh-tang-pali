notes: |-
  **Phân loại 11 khoá (đo bằng `eng/_e15_class.py`): A y nguyên từng chữ = 0 · B dựng lại = 11 ·
  C tự dịch = 0.** Không khoá nào phải dịch từ đầu, và đây là bài nhiều vế lặp nhất trong lát: 4 khoá
  (`16.11`, `17.7`, `18.6`, `19.5`) là **cùng một câu** Pāli lặp bốn lần.

  **Nhóm 1 — `4.5` (1 khoá), dựng lại từ `4.2` (0,83).** Pāli `4.5` là bản lặp của `4.3` bỏ chữ `kassapa`
  và bỏ vế `sādhu …` (vế ấy là khoá `4.6`, đã ghim riêng). Tầng đã ghim đã **gộp** `4.5` vào lời `4.2`
  (lời `4.2` kết bằng câu “It’d be good if these people got to see the Buddha.” vốn thuộc `4.6`). Lớp lấp
  dựng lại riêng `4.5`, lấy nguyên “these several brahmin emissaries from Kosala and Magadha”, “and
  also Oṭṭhaddha the Licchavi together with a large assembly of Licchavis”, “have come here to see the
  Buddha”, chỉ đổi dẫn `ete, bhante` thành “Sir,” — theo đúng cách tầng đã ghim dịch `Sādhu, bhante` ở
  `4.6` là “Sir,”.

  **Nhóm 2 — sáu khoá `So … samādhimhi` + kết quả (7.5, 7.6, 9.5, 9.6, 11.5, 11.6), dựng lại từ các
  cặp đã ghim ở phía Đông.** Ba cặp đã ghim là `6.3`+`6.4`, `8.2`+`8.3`, `10.2`+`10.3`, và cặp song
  song của chúng là `11.4`+`11.5`… cùng loại. Lớp lấp ghép đúng vế “kết quả” của tầng đã ghim và **chèn
  phương `uddhamadho tiriyaṁ`** — vì ở phía trên/dưới/ngang, Pāli gộp công thức `So …` và kết quả vào
  **một** khoá, nên nếu không chèn phương thì ba khoá kết quả sẽ mất thông tin có thật trong nguồn:
  · `7.5` (0,75 với `6.2`) · `7.6` (0,85 với `6.4`)
  · `9.5` (0,77 với `8.1`) · `9.6` (0,85 với `8.3`)
  · `11.5` (0,65 với `6.2`) · `11.6` (0,84 với `10.3`)
  Vế “When they have developed immersion … in one aspect / in both aspects, so as to …” bám sát lời đã
  ghim; khác ở chỗ tầng đã ghim dịch `So …` thành “for that purpose” (`6.3`, `8.2`, `10.2`), còn lớp lấp
  dịch thẳng `uddhamadho tiriyaṁ` thành “above, below, across”. Lý do ghi thẳng: ở các khoá này khoá
  `Idha …` liền trước (`7.4`, `9.4`, `11.4`) chỉ được tầng đã ghim dịch còn “above, below, across …”
  — **không nói mục đích** — nên “for that purpose” sẽ trỏ vào câu không tồn tại. Tức là đây là lựa chọn
  có lý do về ngữ cảnh, không phải hành động dịch vòng qua tiếng Anh.

  **Nhóm 3 — bốn khoá `‘taṁ jīvaṁ taṁ sarīran’ti vā ‘aññaṁ jīvaṁ aññaṁ sarīran’ti vāti.`**
  (`16.11`, `17.7`, `18.6`, `19.5`). Pāli của bốn khoá **khác nhau đúng một dấu phẩy** (`16.11` có
  `vā,` còn ba khoá kia không; đã kiểm bằng máy), nên cả bốn lấp **giống nhau từng chữ**:
  “The soul and the body are one and the same” or “The soul is one thing, the body another”.
  Đây là lời của chính tầng đã ghim — `19.8` có **Pāli giống hệt** (`… vā”ti.`) và lời đã ghim là
  `“The soul and the body are one and the same” or “The soul is one thing, the body another”.’”`;
  bốn khoá này chỉ khác ở chỗ không có dấu `”` đóng trước `ti`, nên lấp bỏ đúng dấu `’` ấy.

  **Ngoặc kép — bảng cân đọc tay, in ra để kiểm.** `4.5` 1/0 (khớp Pāli: Pāli mở `“` ở `4.5` và không
  đóng) · `7.5` `7.6` `9.5` `9.6` `11.5` `11.6` đều 0/0 khớp Pāli · `16.11` `17.7` `18.6` `19.5`: Pāli
  2/0 **nháy đơn**, lớp lấp 2/2 **nháy kép** — lệch **có chủ đích**: tầng đã ghim dịch cặp
  `‘taṁ jīvaṁ…’ti vā ‘aññaṁ jīvaṁ…’ti vāti?` bằng **nháy kép** lồng nhau ở `16.9`, `17.5`, `18.3`,
  `19.3` và `19.8`, và lớp lấp theo đúng quy ước ấy. Nếu giữ nháy đơn thì sẽ lệch với năm khoá anh
  em ngay trong bài.

  **Dấu lược:** không khoá nào trong 11 khoá này chứa `…` (đo bằng script), nên tổng dấu lược của bản
  lấp bài này bằng **0**. Bài có `…pe…` ở `7.1`, `9.1`, `11.1`, `16.6`, `16.14`, `17.10`, `18.4`,
  `18.9`, `21.6` nhưng các khoá `…pe…` đều dưới ngưỡng 40 ký tự hoặc đã ghim.

  **Sáu khoá trống còn lại, đều dưới ngưỡng 40 ký tự nên `coverage` không tính và lát này không lấp:**
  `7.7`, `9.7`, `11.7` (mỗi khoá 15 ký tự, `Taṁ kissa hetu?` — cả ba đều lẽ ra phải có “Why is
  that?”), `16.6` và `18.4` (4 ký tự, chỉ là `…pe…`), `19.11` (32, colophon `Mahālisuttaṁ niṭṭhataṁ
  chaṭṭhaṁ.`). Ba khoá `Taṁ kissa hetu?` là chỗ người đọc rõ nhất sẽ thấy thiếu câu, vì lớp lấp vừa
  thêm `7.5`/`9.5`/`11.5` (vế trả lời dài) ngay trước. Tổng số khoá tầng Anh đã ghim để trống ở bài này
  là 17 không tính `:0`; lát này lấp 11, còn 6 khoá nêu trên.

  **Một lệch sẽ hiện ra với người đọc, nói thẳng vì lớp lấp không sửa được tầng đã ghim.** Tầng đã ghim
  dịch khoá `16.10`, `17.6`, `18.5` — Pāli là câu hỏi `Yo so … kallaṁ tassetaṁ vacanāya:` — thành *đáp
  lời* “‘It would, reverend.’”, nuốt luôn dấu hỏi của `16.9`. Hệ quả: `16.9` đã ghim in ra cặp câu hỏi
  rồi, và bản lấp `16.11` in ra **chính cặp ấy** lần nữa ngay dưới. Đây là lặp do tầng đã ghim nói
  trước, Pāli gốc vốn phát lại đúng câu ấy bốn lần; giữ lặp là giữ đúng Pāli, nhưng người đọc phải
  biết là do đó.

