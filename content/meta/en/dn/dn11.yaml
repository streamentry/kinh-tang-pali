notes: |-
  Phân loại 38 khoá (đo bằng máy, Pāli chuẩn hoá bỏ dấu câu, so với mọi khoá Sujato có chữ trong bài):
  A 12 · B 20 · C 1 · D 5. Các cụm Pāli trùng nhau giữa chính những khoá cần lấp cũng được giữ cùng một lời (kiểm bằng máy):
  6.5 = 6.9 = 7.4; mười hai khoá “yatthime cattāro mahābhūtā …” (68.6, 68.9, 69.5, 69.8, 70.5, 70.8, 71.5, 78.3, 79.5, 79.8,
  80.6, 80.9) cùng một câu, chỉ khác nháy theo Pāli từng khoá.

  Nhóm A, dùng lại lời Sujato (12 khoá):
  - Nguyên văn (7 khoá): 2.8 ← 1.8; 2.9 ← 1.9; 3.2 ← 2.2; 3.3 ← 2.3; 3.5 ← 1.5 và 2.5 (cùng lời); 6.5 ← 6.3; 70.4 ← 68.5, 69.4 và 80.5
    (“‘Mendicant, we too do not know this.”; ba nguồn cùng một lời).
  - Đổi dấu nháy cho khớp Pāli (2 khoá): 6.9 và 7.4 ← 6.3. Lời Sujato của 6.3 chỉ có nháy đơn, nhưng Pāli 6.9/7.4 là `“…cittan”’ti`
    (nháy kép mở, kép đóng, rồi nháy đơn đóng). Bản lấp: “This is what you’re thinking, such is your thought, and thus is your state of
    mind.”’ Đo: Pāli (kép mở 1, kép đóng 1, đơn đóng 1), bản lấp (1, 1, 1).
  - Đổi dấu câu cuối cho khớp Pāli (3 khoá): 69.7 ← 68.8, 79.7; 70.7 và 78.2 ← 80.8. Sujato kết ba chỗ này bằng “They/He might
    know.’” (nháy đơn đóng ở cuối câu, vì đã dồn câu hỏi `yatthime …` vào khoá trước và đóng nháy luôn). Pāli của ba khoá này là
    `Te kho etaṁ jāneyyuṁ:`/`So kho etaṁ jāneyya:` không có nháy nào, và nháy đơn đóng của Pāli nằm ở khoá liền sau (69.8, 70.8, 78.3).
    Bản lấp ghi “They might know:”/“He might know:” để khớp nháy từng khoá. Đo: Pāli (0, 0, 0, 0), bản lấp (0, 0, 0, 0);
    nếu giữ nguyên Sujato thì bản lấp (0, 0, 0, 1). Lệch duy nhất so với Sujato ở nhóm này là dấu câu cuối (“.’” → “:”).

  Nhóm B, dựng lại từ khoá gần trùng (20 khoá):
  - 68.6, 68.9, 69.5, 69.8, 70.5, 70.8, 71.5, 78.3, 79.5, 79.8, 80.6, 80.9 ← 83.9 (0,78) cùng 82.5/83.5 và 68.3: câu `yatthime cattāro
    mahābhūtā aparisesā nirujjhanti, seyyathidaṁ—pathavīdhātu āpodhātu tejodhātu vāyodhātū`. Sujato nuốt cả câu vào 68.5/69.4… (“we too do
    not know this”) rồi vào 68.8… (“They might know.’”), nên các khoá `“yatthime …”ti` của Pāli không có lời. Bản lấp chèn lại phần bị nuốt:
    “where these four principal states cease without remainder, namely, the elements of earth, water, fire, and air.” (từ của 68.3, 82.5),
    trong nháy kép theo Pāli; các khoá 68.9, 69.8, 70.8, 78.3, 79.8, 80.9 thêm nháy đơn đóng (`”’ti`).
  - 70.1 ← 68.2 (0,85); 71.1 ← 68.2 (0,69); 79.1 ← 68.2 (0,69): dựng lại câu “Then he approached …” cho đúng đối tượng (the gods of the thirty-three;
    Sakka, lord of gods; the godling named Vasavattī), theo từ ngữ của chính Sujato ở 69.6, 70.6, 78.1.
  - 70.3 ← 68.4 (0,88); 71.3 ← 81.4 (0,75); 79.3 ← 81.4 (0,75): “When he said this, … said to him,”.
  - 71.4 và 79.4 ← 68.5 (0,60): số ít (`ahampi … na jānāmi`) nên “I too do not know this.” thay cho “we too”.

  Nhóm D, báo, không tự hoà (5 khoá): 3.4, 69.2, 70.2, 71.2, 79.2. Ở cả năm khoá, lời Sujato của cùng một Pāli khác nhau, đo bằng máy:
  - 3.4 ← 1.4 và 2.4: cùng chữ “Sir, this Nāḷandā is successful and prosperous, populous and full of people.”, chỉ khác nháy (1.4 nháy kép, 2.4 nháy
    đơn). Pāli 3.4 mở nháy đơn nên lấy 2.4 (0 chữ lệch).
  - 69.2, 70.2, 71.2, 79.2 ← 68.3, 80.3, 81.3, 82.5, 83.5: 68.3 và 80.3 là “Respectable sirs, where do these four principal states …?”;
    81.3 là “Respectable sir, …?” (số ít); 82.5 và 83.5 là “where these four principal states cease without remainder.’”, một mệnh đề phụ,
    bỏ “namely …”. Bản lấp chọn theo người nghe: 69.2 (bốn đại thiên vương) và 70.2 (chư thiên Tāvatiṁsa) dùng số nhiều như 68.3;
    71.2 (Sakka) và 79.2 (một vị thiên tử) dùng số ít như 81.3. Đây là lựa chọn của người dịch, không phải sự đồng thuận có sẵn.

  Nhóm C, tự dịch từ Pāli (1 khoá): 85.30 `Kevaṭṭasuttaṁ niṭṭhitaṁ ekādasamaṁ.` → “With Kevaḍḍha is finished—the eleventh.” (khuôn các bài
  Trường Bộ/Trung Bộ đã lấp, tên bài theo 0.2 của Sujato).

  Chỗ cố ý lệch Sujato: ba khoá 69.7, 70.7, 78.2 (chỉ dấu câu cuối, nêu ở nhóm A) và bốn khoá nhóm D (chọn số ít/số nhiều theo
  người nghe). Không sửa chữ nào của Sujato.

  Dấu lược: 38 khoá cần lấp không có `…`/`…pe…` ở Pāli; bản lấp không thêm. Lưu ý (tầng đã ghim, đo bằng máy, không sửa): Sujato tự thêm `…` nơi
  Pāli viết đủ ở 69.6, 70.6, 78.1 và 9-66.3, và bỏ `…` nơi Pāli có `…pe…` ở 4.6, 5.3, 9-66.4, 9-66.8, 9-66.10 (tổng 9 khoá).

