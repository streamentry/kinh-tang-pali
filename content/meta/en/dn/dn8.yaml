notes: |-
  **Phân loại 54 khoá (đo bằng máy, mỗi khoá một nhóm): A y nguyên = 23 · B dựng lại = 7 · C tự dịch = 13 · D (Pāli trùng, lời Anh của tầng đã ghim khác nhau) = 11.** Đã ghi 54/54 khoá `fillableSegments` của bài (49 khoá có nội dung ≥ 40 ký tự Pāli, 5 khoá ngắn hơn ngưỡng). Số khoá Sujato để trống mà lát **không** lấp: 0.

  **Cấu trúc.** Bài lặp ba lần một khung (mục 15, 16, 17) với từng loại khổ hạnh; tầng đã ghim dịch **một** chuỗi mỗi mục và bỏ các lặp.
  **Nhóm 1 — A, dùng nguyên văn.** `8.2`, `12.2` ← `7.2`/`11.2` (“There are things that are skillful, … bright …”); `6.2`, `10.2` ← `9.2`. Pāli của `6.2`/`10.2` dùng ‘ ’ đơn như `9.2` (còn `5.4` dùng “ ”),
  nên đây không phải nhóm D thật mà chỉ là khác loại nháy. `13.4` (A với `13.2`; **thêm dấu hỏi** theo Pāli `…vinayavādī’ti?`: ‘Only the ascetic Gotama’s words … training’?). Khoá `15.5`, `16.13`, `17.13`: `Sākabhakkho cepi, kassapa, hoti, sāmākabhakkho …pe… pavattaphalabhojī.` — “Kassapa, someone may eat herbs, millet … or survive on forest roots and fruits, or eating fallen fruit,”
  (lấy chữ của `14.9`, đúng một `…`; **không** mở danh sách mười món).
  **Nhóm 2 — `15.6`, `15.12` ← `15.2` (0,77).** Sujato gộp `15.2` hai câu Pāli (`Tassa cāyaṁ … asacchikatā.` + `Atha kho so ārakāva …`) thành một câu; bản lấp **tách đúng ranh giới Pāli**:
  `15.6`/`15.12` “but if they haven’t developed and realized any accomplishment in ethics, mind, and wisdom,” và `15.7`/`15.13` “they are far from being a true ascetic or brahmin.” — hai nửa nguyên văn của `15.2`.
  **Nhóm 3 — chuỗi lặp hai chiều “hard to be” / “hard to know” (`16.14`–`16.30`, `17.14`–`17.30`).** A: `16.14`, `16.23` ← `16.5`; `16.15`, `16.19`, `16.24`, `16.28` ← `16.6`/`16.10`; `16.16`, `16.25` ← `16.7`; `16.18`, `16.27` ← `16.9`; và bản “know” ←
  `17.5`–`17.10` (máy xếp 23 khoá A: `8.2`, `12.2`, `13.4`, `16.14`–`16.16`, `16.18`, `16.19`, `16.23`–`16.25`, `16.27`, `16.28` và 10 khoá tương ứng của mục 17). `17.5` của tầng đã ghim có **khoảng trắng đôi** (“by that  course”) — bản lấp chép thành một khoảng trắng (lệch cố ý, vì lỗi hình thức). `16.17`, `16.26`, `17.17`, `17.26` (Pāli `‘handāhaṁ …’ti` / `‘ayaṁ …’ti`): “‘Well then, I’ll eat herbs or millet …’”,
  “‘This one eats herbs or millet …’” — tự dịch (`handa` “well then”, `ayaṁ` “this one”), chữ theo `14.9`, `14.11`, `14.23`; `17.26`←`14.23` (0,71).
  **Nhóm 4 — D, 11 khoá.** `15.8`, `15.14`: “But take a mendicant who …” (lời `15.3`); `16.20`, `16.29`, `17.20`, `17.29`: “Take a mendicant who …” (lời `16.11`, `17.11`); Pāli giống nhau từng chữ, Sujato dùng “But take” ở `15.3` và “Take” ở `16.11`, `17.11`.
  Chọn theo bối cảnh: `15.8`, `15.14` đứng sau câu kết ngược “far from being a true ascetic or brahmin” nên dùng “But take” như `15.3`; `16.20`… đứng sau “it’s hard to be …” như `16.11`. `15.9`, `16.21`, `17.21` (`Ayaṁ vuccati, kassapa, bhikkhu samaṇo itipi brāhmaṇo itipi.`): lời Sujato ở `15.4` và `16.12` kết bằng “… ”” (dấu lược và nháy đóng mà Pāli đặt ở khoá **sau**), còn ở `17.12` chỉ có ”: nên ba khoá lấp **bỏ** “… ”” (Pāli của chúng không có dấu lược cũng không có nháy đóng), còn ba khoá kết bằng `itipī”ti.` (`15.15`, `16.30`, `17.30`; B 0,97 với `15.4`) thêm ” ở cuối. Hai nháy ‘true ascetic’ / ‘a true brahmin’ là của Sujato, Pāli không có nháy (xem phần nháy).
  **Nhóm 5 — `15.10`, `15.11`, `16.22`, `17.22`.** “Kassapa, someone may wear robes of sunn hemp or mixed hemp … or be devoted to ritual bathing three times a day, including at dusk.” (`14.11`, `14.23` đã dịch; `15.11`←`14.23` 0,97).
  **`19.2`**: `Seyyathidaṁ—santikammaṁ paṇidhikammaṁ …pe… osadhīnaṁ patimokkho` → “This includes rites for propitiation, for granting wishes … and herbal bandages.” — lấy đúng cách Sujato dịch câu này ở `dn1:1.27.2`, `dn2:62.2`, `dn10:1.28.2` (không phải cùng bài; chữ không bị D). **`24.8`**: “The Lion’s Roar to the Naked Ascetic Kassapa is finished—the eighth.”

  Bảng B theo máy (khoá lấp←khoá nguồn, tỉ lệ khớp Pāli): `15.6`←`15.2` 0,77; `15.11`←`14.23` 0,97; `15.12`←`15.2` 0,77; `15.15`←`15.4` 0,97; `16.30`←`15.4` 0,97; `17.26`←`14.23` 0,71; `17.30`←`15.4` 0,97.
  Nhóm D theo máy: `6.2`, `10.2`, `15.8`, `15.9`, `15.14`, `16.20`, `16.21`, `16.29`, `17.20`, `17.21`, `17.29` — đã nêu cách chọn ở trên, **không** tự hòa các lời khác nhau của tầng đã ghim.

  Nháy: đo 14/54 khoá lệch Pāli, đều theo **ngoại lệ có lý do** (khoá anh em của tầng đã ghim): (i) 8 khoá `16.15`, `16.19`, `16.24`, `16.28`, `17.15`, `17.19`, `17.24`, `17.28` — Pāli có một cặp ‘ ’ (`‘dukkaraṁ sāmaññaṁ dukkaraṁ brahmaññan’ti.`) nhưng tầng đã ghim viết `16.6`, `16.10`, `17.6`, `17.10` không nháy (“it’s hard to be a true ascetic or brahmin.”); (ii) 6 khoá `15.9`, `15.15`, `16.21`, `16.30`, `17.21`, `17.30` — lời Sujato `15.4` có ‘true ascetic’ và ‘a true brahmin’ (nháy chữ, Pāli không có nháy). 40 khoá còn lại khớp.
  Dấu lược: 11/54 khoá lấp có `…`/`…pe…` ở Pāli; đo từng khoá, số `…` của English bằng số `…` của Pāli (`…pe…` tính một), 0 khoá lệch; không mở rộng chỗ nào.

