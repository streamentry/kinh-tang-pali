  **C (35) — dịch từ Pāli, nhưng ghép bằng từ vựng Sujato của chính bài.** Lời nhắn của Subha (`1.2.3`, `1.3.4`,
  `1.4.6`, `1.4.7`, `1.4.9`) dùng “healthy and well, nimble, strong, and living comfortably” của `1.2.2`; ý nghĩ
  của năm ví dụ (`2.7.5`–`2.11.5`) đổi ngôi lời Sujato ở `2.7.1`–`2.11.2` sang “I”; các khoá `yampi` thiền và
  thắng trí dựng từ `2.21.1`…`2.35.3`; `1.28.5` rút từ `1.28.2` đúng chỗ `…pe…`; `2.37.11` colophon → “With Subha is
  finished—the tenth.” theo khuôn colophon MN/DN của lớp lấp (tên lấy từ `:0.2` đã ghim).

  **Một lựa chọn cú pháp phải nói thẳng: `Yampi, māṇava, bhikkhu …` → “Take a mendicant who …”.** Pāli là mệnh đề
  chủ đề (“việc vị tỳ-kheo … — điều ấy cũng thuộc về giới/định/tuệ”), và khoá kế tiếp đã ghim “This pertains to their
  ethics / immersion / wisdom.” bắt đầu bằng chữ hoa. Dịch “When a mendicant …” sẽ để lại một mệnh đề phụ cụt trước câu
  đã ghim; lớp lấp chọn “Take a mendicant who …” để mỗi khoá là câu trọn mà vẫn giữ quan hệ chủ đề. Đây là chỗ
  `grammar_logic` bị hạ. `1.28.4` tách thành “Take a mendicant. There are some ascetics and brahmins who …” để dùng lại
  nguyên văn `1.28.1`. Tầng ghim ở `2.26.4`, `2.31.2` đã nuốt mệnh đề `yampi` vào câu “In the same way …”.

  **Cố ý lệch tầng ghim.**
  1. `1.28.6`: bỏ ` …` của `1.28.3` (Pāli không có dấu lược). Tầng ghim có **17** khoá mang `…` mà Pāli không có.
  2. `2.29.5`, `2.29.6`, `2.36.4`, `2.36.5`: Pāli **không** có nháy (`sarāgaṁ cittanti`, `idaṁ dukkhanti`), khác `2.28.3`
     (`‘sarāgaṁ cittan’ti`) đã ghim; lớp lấp theo Pāli, **không** thêm nháy.
  3. `2.22.9` `ettha paṭibaddhanti.` → “tied to it.” không nháy, vì Pāli không có `’`.
  4. `2.12.3` dịch riêng “In the same way, a mendicant sees that these five hindrances have been given up inside
     themselves.” — tầng ghim đã **gộp** nội dung khoá này vào `2.12.2` (“But when these five hindrances are given up …
     a mendicant regards this as …”). Đọc liền thì ý lặp; giữ vì Pāli `2.12.3` có thật.
  5. `2.7.4`/`2.8.3` đã ghim dịch `Tassa evamassa:` là “Thinking about this,” và `2.7.8` “he’d be filled with joy …”:
     tầng ghim đã nén ý nghĩ trong ngoặc. Lớp lấp dịch ý nghĩ ấy ở `2.7.5`–`2.11.5`, giữ nháy `‘ … ’` đúng Pāli.

