  **Coverage.** Mẫu số 245 (Pāli có nội dung, bỏ khối `:0`). Trước lớp lấp: 211/245 = **0,8612**; sau khi `published`: 245/245 = **1,0000**. Độ nhạy: ngưỡng 0,8 cần tối thiểu 196/245; bài trước lớp lấp cách ngưỡng 15 khoá. Bài `dn4` **không** có record trong `content/meta/reference-gaps.yaml`, nên không record nào thành thừa vì lớp lấp này. Lỗ hổng của bộ đo: tầng đã ghim không rỗng nhưng ngắn bất thường ở những khoá gộp (`3.12`, `4.6`, `14.1`, `14.10` …) — các khoá này được tính là đã phủ dù đã nuốt Pāli của khoá kế; lớp lấp phải bù phần bị nuốt đó, không phải bộ đo.

