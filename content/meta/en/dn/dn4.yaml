notes: |-
  **Phân loại 39 khoá (máy đo, so Pāli đã chuẩn hoá với các khoá đã có lời): A = 17 · B = 11 · C = 1 · D = 10.** Sau khi đọc từng khoá trong bối cảnh bài, phân loại thực tế của bản lấp là: **dùng lại nguyên văn 15** (`10.2`–`10.15` và `26.11`) · **dùng lại nguyên văn sau khi giải quyết D 10** (xem nhóm 3) · **dựng lại từ lời đã ghim 13** · **tự dịch 1**. Không khoá nào phải “dịch từ đầu” ngoài `27.2`.

  **Nhóm 1 — `10.2`–`10.15` (14 khoá) + `26.11`: dùng lại nguyên văn từng chữ.** Hai khối “nỗi sợ mất danh” của Soṇadaṇḍa (hỏi sai · trả lời sai) ở `8.2`–`8.15` lặp lại đúng ở `10.2`–`10.15`, và Pāli trùng từng chữ (đã kiểm bằng máy: 0 cặp lệch). Các khoá đã ghim `8.2`–`8.15` đã có lời đồng nhất với nhau ở những cặp lặp (`8.6`=`8.13`=`8.18`; `8.7`=`8.14`=`8.19`; `8.8`=`8.15`; `8.3`=`8.10`), nên lấp dùng lại đúng lời ấy cho `10.2`–`10.15`; `26.11` lấy lời `26.6` (`8.8`, `8.15`, `26.6` cùng một lời). **Một điều phải nói thẳng:** các khoá đã ghim `8.6`–`8.8`, `8.13`–`8.15`, `26.4`–`26.6` dịch ngôi thứ ba của Pāli (`tassa hāyetha`, `bhogāpi tassa`) thành ngôi thứ hai “you’re disparaged … your reputation diminishes” rồi chốt bằng “my wealth relies on my reputation” — tức đổi ngôi ngay giữa một lời tự nói. Lấp giữ nguyên cách ấy để bài không tự mâu thuẫn và vì sửa tầng đã ghim là shadow; đây là **đặc điểm của tầng đã ghim, không phải lựa chọn của lớp lấp**.

  **Nhóm 2 — mười ba khoá dựng lại từ lời đã ghim.** · `3.13`, `3.14` (máy xếp A với `3.10`, `3.11`): khoá đã ghim `3.10`–`3.11` dịch lời nhắn của Soṇadaṇḍa thành gián tiếp, tách giữa hai khoá (“Sirs, the brahmin Soṇadaṇḍa asks | you to wait, as he will also go …”). Pāli `3.13`–`3.14` lại giữ lời nhắn là **trích dẫn trực tiếp lồng nháy** (`3.13` mở “, `3.14` mở ‘ rồi đóng ’” ). Dùng nguyên văn `3.10`–`3.11` sẽ làm gãy nháy lồng hoặc buộc chữ “‘you” vô nghĩa, nên lấp dùng **cùng từ vựng** (“Sirs”, “the brahmin Soṇadaṇḍa”, “wait”, “will also go to see the ascetic Gotama”) nhưng dựng thành trực tiếp: “Sirs, the brahmin Soṇadaṇḍa says this:” rồi “‘Please wait, sirs, …’”. · `4.7` (máy: B với `6.47`, 0,79; thực tế dựng từ `3.11`): Pāli `ahampi samaṇaṁ gotamaṁ dassanāya upasaṅkamissāmī` — cùng cấu trúc với lời ở `3.11`; khoá đã ghim `4.6` dịch cả `4.6` và `4.7` thành “Yes, gentlemen, it is true.” rồi đóng ”, nên lấp `4.7` chèn lại phần bị nuốt (lời hứa đi gặp Đức Phật). Hệ quả: `4.7` mở bằng ‘ và đóng ’” trong khi `4.6` đã ghim đã đóng ” — một dấu đóng thừa mà người đọc sẽ thấy, do tầng đã ghim gộp. · `5.20` từ `5.19` (0,97): Pāli `Yampi bhavaṁ …` là câu lặp của `Bhavañhi …` ở `5.19` với `yampi` (*cả việc … cũng …*). Lấp dùng lại nguyên cụm “Campā, a crown property given by King Seniya Bimbisāra of Magadha, teeming with living creatures, full of hay, wood, water, and grain, a royal park endowed to a brahmin” và thêm “This too:” cho `yampi` (đúng cách tầng đã ghim dịch `Yampi` thành “For this reason” ở `5.4`, `5.7`, rồi “For this reason, too” ở `5.21`). · `6.39` từ `6.36` (0,76), `6.40` từ `6.38` (0,92): Pāli `Yampi, bho, samaṇo gotamo campaṁ anuppatto …, atithimhākaṁ samaṇo gotamo` — cụm “has arrived at Campā and is staying …” lấy nguyên từ `6.36` đã ghim, thêm “is our guest”. `6.40` — **lệch có chủ ý so với `6.38`**: Pāli `6.38` và `6.40` đều có đủ năm động từ (`sakkātabbo garukātabbo mānetabbo pūjetabbo apacetabbo`) nhưng tầng đã ghim ở `6.38` chỉ viết “honored and respected”, rút còn hai. Lấp `6.40` dịch đủ năm theo đúng bảng mà tầng đã ghim dùng ở `5.17` (“honored, respected, revered, venerated, and esteemed”) để không mất chữ có thật trong Pāli. Hệ quả: `6.38` đã ghim ngắn hơn `6.40` lấp. · `12.3` từ `10.16` (0,80): lời ước ở `10.16` đã ghim (“If only the ascetic Gotama would ask me about my own tutor’s scriptural heritage … Then I could definitely satisfy his mind with my answer.”) được dùng lại trong nháy đơn (Pāli `12.3` mở ‘ và đóng ’ trước `ti`), rồi thêm vế `tatra maṁ samaṇo gotamo … pañhaṁ pucchati` (“And now the ascetic Gotama is asking me …”). Tầng đã ghim ở `12.2` đã nói trước một phần (“The ascetic Gotama has asked me about exactly what I wanted … that is, my own scriptural heritage.”) và `12.4` lặp lời ước; không mâu thuẫn. · `14.6`–`14.8`, `15.6`, `15.7` (máy: B 0,96–0,98 với `13.5`, `13.6`, `13.8`): các khoá `14.6`, `15.6` lặp công thức “brāhmaṇo ubhato sujāto …” của `13.5`; tầng đã ghim dịch `Yato kho, bho gotama, brāhmaṇo …` thành “It’s when a brahmin is …” ở `16.6` và `20.11`, nên lấp dùng cùng “It’s when a brahmin is well born …”, bỏ vocative “bho gotama” đúng như `16.6`. `14.7` dùng lại nguyên văn `13.6` (hymns/Vedas/cosmology); `14.8`, `15.7` dùng lại `13.8` — chỉ đổi chữ hoa đầu thành chữ thường và dấu chấm thành chấm phẩy, theo đúng cách tầng đã ghim viết các dòng tiếp liền ở `16.6`–`16.7`. · `26.10`: Pāli gom `26.4` và `26.5` vào **một khoá**; tầng đã ghim đã dịch hai khoá ấy riêng. Lấp nối đúng hai lời đã ghim (“And when you’re disparaged by the assembly, your reputation diminishes. When your reputation diminishes, your wealth also diminishes.”) — máy đo chỉ 0,69 vì chỉ khớp một nửa khoá.

  **Nhóm 3 — D: mười khoá mà Pāli trùng nhau nhưng lời đã ghim khác nhau.** Hai loại và cả hai đã phân xử: (a) tám khoá `14.2`, `15.2`, `16.2`, `21.2` (kết bằng `”ti?`) và `14.11`, `15.10`, `16.9`, `20.14` (kết bằng `”ti.`) trùng Pāli với `11.6` và `13.11`; lời đã ghim của hai khoá này giống nhau từng chữ **ngoài dấu cuối** “?” và “.”, tức đúng theo dấu của Pāli. Lấp dùng lời `11.6` cho bốn khoá hỏi và lời `13.11` cho bốn khoá kể. (b) hai khoá `14.9` và `15.8` trùng Pāli với `13.9`, `16.7`, `20.12`; lời đã ghim chỉ khác ở “and” đầu (`13.9` “He’s astute …” là dòng thứ năm của danh sách, `16.7`/`20.12` “and he’s astute …” là dòng cuối của danh sách ngắn). Hai khoá lấp này đứng sau một dòng kết bằng `;` đúng như `16.7`/`20.12`, nên dùng lời `16.7`/`20.12` (“and he’s astute and intelligent …”). Không có chỗ nào lời đã ghim mâu thuẫn về nghĩa.

  **Nhóm 4 — `27.2` (1 khoá), C.** Dòng kết bài `Soṇadaṇḍasuttaṁ niṭṭhitaṁ catutthaṁ.` (32 ký tự, dưới ngưỡng) → “With Soṇadaṇḍa is finished—the fourth.”, theo khuôn của các bài kết đã có và tên bài đã ghim ở `0.2`.

  **Một lệch người đọc sẽ thấy, ghi thẳng.** Tầng đã ghim ở `14.1`, `15.1`, `16.1`, `21.1` đã đóng nháy kép sau “…as a brahmin?”” rồi bỏ trống `14.2` v.v.; các khoá lấp ngay sau đó kết bằng ”. Dấu đóng thứ hai ở cuối mỗi khoá lấp là theo Pāli từng khoá (khoá Pāli đóng ”), còn dấu đóng ở khoá trước là của tầng đã ghim; đây là hệ quả tầng đã ghim gộp `14.1` và `14.2` vào một khoá.

  **Nháy.** 39 khoá khớp Pāli từng khoá, đo bằng đếm (script: 0 khoá lệch, kể cả bốn dạng “ ” ‘ ’). Khoá có nháy: `3.13` mở “ · `3.14`, `4.7` ‘ ’ ” · `10.2` mở “ · `10.4`, `10.5`, `10.11`, `10.12`, `12.3` ‘ ’ · tám khoá kết bằng `”ti` (`14.2`, `14.11`, `15.2`, `15.10`, `16.2`, `16.9`, `20.14`, `21.2`) đóng ” · `3.14` và `4.7` còn đóng ’ trước ”; các khoá còn lại 0. Không dùng nháy kép lồng nhau.

