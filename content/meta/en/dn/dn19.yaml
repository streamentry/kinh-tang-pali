  **Phân loại 82 khoá (máy đo, so Pāli đã chuẩn hoá với các khoá đã có lời): A = 30 · B = 30 · C = 4 · D = 18.** Sau khi đọc từng khoá trong bối cảnh bài, phân loại thực tế của bản lấp là: **dùng lại nguyên văn 52** (kể cả 18 khoá D đã giải, các khoá nháy chỉ đổi dấu, và các khoá cắt một câu của khoá đã ghim) · **dựng lại từ lời đã ghim 27** · **tự dịch 3** (`22.2`, `27.2`, `62.8`). Máy xếp B nhiều vì Pāli của bài này thường **gộp hai khoá đã ghim làm một** hoặc **tách một khoá đã ghim làm hai**; việc của lấp là cắt/ghép lại đúng ranh giới Pāli.

  **Nhóm 1 — lời tán thán của Sakka và của Phạm thiên Sanaṅkumāra (`8.3`, `13.6`, `13.7`, `15.4`, `16.4`, `16.11`, `17.2`, `20.1`–`28.1`).** · `13.6`, `13.7`, `16.4`, `20.2`, `20.3`, `21.1`, `21.2`, `23.1`, `23.2`, `23.4`, `24.3`, `25.2`, `26.3`, `27.1`: Pāli trùng từng chữ với khoá đã ghim `13.3`, `13.4`, `16.2`, `5.2`, `5.3`, `6.1`, `6.2`, `8.1`, `8.2`, `8.4`, `9.2`, `10.3`, `11.2`, `12.1`; lấp dùng lại nguyên văn. · `20.1` dựng từ `5.1` (0,62): Pāli `Taṁ kiṁ maññati, bhavaṁ mahābrahmā?` là số ít kính ngữ, còn `5.1` là số nhiều (“What do the good gods of the thirty-three think?”); lấp “What does the Great Divinity think?” theo “Great Divinity” mà tầng đã ghim dùng ở `19.8`. · `8.3` và `23.3` là hai khoá Pāli trùng nhau (vế “evameva …” của so sánh sông Gaṅgā–Yamunā); khoá đã ghim `8.1` đã nuốt cả vế đầu lẫn vế “evameva” vào một câu. Lấp dựng lại vế “In the same way, the Buddha has well described the practice … and extinguishment converges with the practice.” — hai khoá dùng **cùng một lời**. · `15.4`: khoá `15.3` đã ghim đã nuốt câu “For this is the harbinger for the appearance of the Divinity, namely light arising and radiance appearing.’”; lấp tách lại đúng câu ấy cho `15.4` (Pāli `15.4` không có nháy, nên không có ’). · `16.11` từ `16.9` (0,92) và `17.2` từ `16.15` (0,94): vế “evameva” của hai so sánh; lấp dùng lại chữ đã ghim ở các khoá `16.9` và `16.15` trong cấu trúc “In the same way, …”. · `22.1`: Pāli gộp hai khoá đã ghim `7.1`+`7.2`; lấp ghép nguyên văn hai khoá ấy. · `22.2`/`22.3`, `27.2`/`27.3`: Pāli `7.3` và `12.2` đã ghim là **một** câu “I don’t see any Teacher, past or present, who so clearly describes all these things, apart from the Buddha.” còn Pāli `22.2`/`22.3` và `27.2`/`27.3` là **hai khoá**. Lấp dịch phần đầu (`22.2` “As for one who so clearly describes all these things,”; `27.2` “As for one who has gone beyond doubt, got rid of indecision, and achieved all he wished for regarding the fundamental goal of the spiritual life,”) và phần sau “I don’t see any Teacher, past or present, with these qualities, apart from the Buddha.” (Pāli `imināpaṅgena samannāgataṁ satthāraṁ …` = “with these qualities”, đúng chữ tầng đã ghim không tách được). Lấp không dùng nguyên văn `7.3`/`12.2` vì sẽ lặp một câu đã chứa cả hai nửa. · `24.1`/`24.2`: `9.1` đã ghim gộp hai khoá Pāli (“… thrill even the aristocrats. But he takes his food free of vanity.”); lấp tách đúng hai câu. `25.1`: dựng từ `10.1` (0,78) và `10.2`: khoá `10.2` đã ghim dịch “The Buddha is committed to the joy of solitude, but doesn’t send them away.” còn Pāli `25.1` gộp `10.1`+`10.2`; lấp ghép “… completed their journey. But he sets them aside and lives committed to the joy of solitude.” theo đúng thuật ngữ “committed to the joy of solitude” của `10.3`. `26.1`/`26.2`: Pāli tách `11.1` đã ghim thành hai khoá; lấp tách lại hai nửa câu. · `28.1` từ `12.3` (“These are the eight genuine praises of the Buddha proffered by Sakka.”) và `19.8`: thêm “to the divinity Sanaṅkumāra”.

  **Nhóm 2 — Mahāgovinda (`30.5`, `33.2`–`33.6`, `35.5`, `39.2`–`42.9`, `47.43`, `49.8`–`54.5`).** · `30.5` từ `30.3` (1,00) và `35.5` từ `35.3`: lời nhắn trong nháy; Pāli `30.5` mở “ và đóng ”, trong khi `30.3` đã ghim lồng ‘ ’” và `35.3` dịch gián tiếp “King Reṇu summons him.”. Lấp đổi thành trực tiếp đúng nháy Pāli (“King Reṇu summons you, sir.”, vì `taṁ` là “you”). · `33.2`–`33.6`: lời sáu vị sát-đế-lợi nói với Reṇu, lặp lại `32.5`–`32.8`. `33.4`, `33.5`, `33.6` dùng nguyên văn `32.6`, `32.7`, `32.8`; `33.6` bỏ ’ vì Pāli `33.6` chỉ có ” đóng (còn `32.8` đóng ’”). `33.4` là D (Pāli trùng `32.2` và `32.6`; `32.2` mở nháy kép, `32.6` thì không): chọn `32.6` vì Pāli `33.4` không mở nháy. `33.2`/`33.3` từ `32.5` (0,70) — khoá `32.5` đã ghim gộp hai khoá Pāli: lấp tách “Prince Reṇu, we are your friends, dear, beloved, and cherished;” và “we share your joys and sorrows.” · `39.2`–`39.6`, `40.2`–`40.6`, `41.2`–`41.6`, `42.2`–`42.6`: lời Đại Điển Tôn nói **bốn lần** với vua, sáu vị sát-đế-lợi, bảy Bà-la-môn và bốn mươi phu nhân. Các khoá `38.2`, `38.4`, `38.5`, `38.6`, `38.7`, `38.8` đã ghim dịch cùng Pāli trong lần nghĩ thầm đầu, nhưng với **gộp khác nhau**: `38.4` và `38.5` tách “I have the reputation | of seeing the Divinity in person, and discussing with him in person.” (một câu cắt đôi); `38.6` chỉ “But I don’t.”; `43.4` và `43.5` đã ghim lại nuốt vế khác (“I have heard that brahmins of the past said that | whoever goes on retreat …”). Lấp phân xử theo Pāli từng khoá: `x.3` dùng lời `38.2` đổi “ thành ‘ (Pāli mở ‘); `x.5` dùng nguyên văn `38.7` và `x.6` nguyên văn `38.8` (D đã giải: trùng Pāli với `43.4`/`43.5`, nhưng chỉ `38.7`/`38.8` là khoá trọn vẹn Pāli); `x.2` dịch “… I have got this good reputation:” (Pāli `mayhaṁ kho, bho, evaṁ kalyāṇo kittisaddo abbhuggato:` ngắn hơn `38.4` vì ngữ liệu sau dấu hai chấm là khoá riêng) và `x.4` mở rộng đủ vế Pāli “But I don’t see the Divinity, and I don’t discuss, converse, or consult with the Divinity.” — **lệch có chủ ý** so với `38.6` “But I don’t.”, vì Pāli các khoá `39.4`, `40.4`, `41.4`, `42.4` viết đủ bốn động từ. Người nghe đổi tên gọi: “Sir” (vua), “Sirs” (sát-đế-lợi, Bà-la-môn), “Ladies” (`bhotī`, các phu nhân). `38.8` và `x.6` dịch `so brahmānaṁ passati … brahmunā mantetī` thành “sees the Divinity and discusses with him”, rút bốn động từ Pāli xuống hai; đây là **cách rút gọn của tầng đã ghim** ở `38.8`, và lấp dùng lại để hai nơi khớp nhau. · `40.7`, `41.8`, `42.7` từ `39.7` (0,99): đổi “Sir” thành “Sirs”/“Ladies” và bỏ ngoặc “ mở vì Pāli các khoá này không mở. `40.8`, `42.8` (D với `39.8` và `41.9`): lấy lời `39.8` — `41.9` đã ghim là “And they too said,” (lời dẫn của người điều, không phải lời Pāli của khoá), nên không dùng được. `40.9`, `42.9` (nguyên văn `39.9`=`41.10`=`46.23`). · `47.43` là nửa sau của câu đã ghim ở `47.42` (“If the Steward is going forth … Your destiny shall be ours.”); lấp “Your destiny shall be ours.”” — lặp lại cụm đã nằm sẵn trong `47.42`, do tầng đã ghim gộp. · `49.8`, `49.17`, `51.6`, `53.4`, `54.4` (nguyên văn `47.4`=`48.4`=`55.4`=…, sáu khoá đã ghim đồng nhất); `49.9`, `49.18`, `53.5`, `54.5` là D: Pāli trùng `46.22`, `47.5`, `48.5`, `51.7`, `55.5`, `56.5`, `56.14`, lời đã ghim khác nhau ở dấu cuối (“!” và “.”) và độ dài (`51.7` “I shall go forth.”). Lấp chọn dạng “I shall go forth from the lay life to homelessness.” có ” đóng (`55.5`, `56.5`, `56.14`) vì Pāli các khoá này đóng nháy kép. · `53.1`, `54.1` từ `51.3` (0,84–0,93): thay “Seven years” bằng “One year” / “Seven months”; `53.2`, `53.3`, `54.2`, `54.3` nguyên văn `51.4`, `51.5`. Các khoá `53.6`, `54.6` đã ghim chỉ là “seven months,” / “six months,” (mảnh của vòng rút ngắn `…pe…`); lấp không động vào.

