notes: |-
  Mười khoá lấp rơi vào ba loại, đều đo được bằng máy:

  1. **1 khoá y nguyên từng chữ.** `1.10.9` có Pāli **trùng nguyên văn** với `1.10.4`, đã ghim
     sẵn: `"sakko, bhente, devānamindo sāmacco saparijano bhagavato pāde sirasā vandatī"’ti.`
     Lấy y nguyên dải đã ghim, kể cả dấu `’` đóng ngoặc ở cuối. Ở 1.10.4 dấu `’` đó mở lời
     trích của Vakkacchanta; ở 1.10.9 nó đóng lời trích của Sakka — cùng hình dạng, khác vai,
     nên giữ nguyên là đúng.

  2. **6 khoá cùng một câu.** Đo bằng máy trên toàn bộ 515 khoá Pāli của `dn21`: **5 khoá**
     có Pāli đồng nhất `iti yaṁ taṁ vuttaṁ, idametaṁ paṭicca vuttaṁ.` — 2.3.24, 2.3.32,
     2.4.16, 2.4.23, 2.4.30, và cả năm đều thuộc lát này; `2.3.16` là chính câu ấy chỉ khác
     chữ `I` đầu. Sáu khoá vì vậy phải có **một** bản dịch, và tôi dùng chung:
     “That is what I said; that is the reason for saying it.” Bốn trong sáu khoá bắt đầu bằng
     `iti` thường vì Pāli nối tiếp khoá trước; tôi vẫn viết hoa đầu câu ở cả sáu, vì ưu tiên
     một chuỗi duy nhất cho cùng một Pāli trên một dòng đọc. Không có khoá nào trong tầng đã
     ghim dịch câu này (Sujato gộp nó vào khoá trước, xem `2.3.15` = “That’s why I said there
     are two kinds of happiness.”), nên đây là bản dịch mới, không phải y nguyên.

  3. **2 khoá cùng một câu** (2.4.18 và 2.4.25, Pāli trùng nguyên văn với nhau). Đây là chỗ
     **phải đọc bối cảnh trước khi dịch**, và đây là bất định thật sự của lát này:
     - Pāli này cũng xuất hiện ở `2.3.9`, `2.3.17`, `2.3.25`, `2.4.9` — bốn khoá **đã ghim**,
       dịch thành “Why did I say that there are two kinds of happiness/sadness/equanimity/
       bodily behavior?”. Luật 2 về nguyên tắc sẽ bảo lấy y nguyên dải ấy.
     - Nhưng tầng ghim **đã bỏ mất** vế `sevitabbampi, asevitabbampīti` (2.3.4/2.3.6/2.3.8 và
       2.4.14 mới dịch vế ấy: “that which you should cultivate, and that which you should not
       cultivate.”). Nếu lấy y nguyên, bản lấp sẽ **âm thầm mất một vế có thật trong Pāli**.
     - Ngoài ra khoá liền trước — 2.4.17 và 2.4.24, cũng đã ghim — đã bị Sujato dịch thành
       đúng câu hỏi ấy rồi (em-dash ở cuối Pāli khoá đó được Sujato kéo câu hỏi từ khoá sau lên
       trước). Nên lấy y nguyên sẽ tạo ra hai ô tiếng Anh **giống hệt nhau** ở 2.4.17/2.4.18.
     - Quyết định: giữ vế bị bỏ, giữ từ khoá đã ghim, và trả lời đúng hai câu hỏi mà Pāli đặt ra
       ở khoá này — “that which you should cultivate and that which you should not; and why did
       I say that? On what basis did I say that?”. Câu hỏi bị lặp ở 2.4.17/2.4.18 là hệ quả của
       lựa chọn phân đoạn của tầng đã ghim, hiện ra thay vì giấu; vì vậy hạ `grammar_logic` 9.2
       và `ambiguity_integrity` 9.2.

  4. **1 khoá tự dịch**: `2.2.25` `papañcasaññāsaṅkhāya asati vitakko na hotī"ti.` Lấy bộ từ
     của tầng ghim ở `2.2.23` (“proliferation of perceptions”, `vitakko` = “thought”) và theo
     khuôn vế đối xứng mà tầng ghim dùng ở `2.2.3`/`2.2.4` (“When what exists is there … / When
     what doesn’t exist is there no …”). BẤT ĐỊNH GHI THẲNG: vế `sati` (`2.2.24`) cũng trống ở
     tầng ghim và nằm trong tập lấp được nhưng **không thuộc lát này**, nên khoá 2.2.25 đọc đứng
     một mình sau 2.2.23; không bịa vế vắng mặt.

  Không có dấu lược trong Pāli của cả mười khoá (đã kiểm: không khoá nào chứa `…`).

