notes: |-
  Lát 602. Hai mươi hai khoá lấp = hai mươi hai khoá tầng Anh đã ghim để trống; 16 khoá có nội dung, 6 khoá dưới
  ngưỡng (`25.3` `25.5` `25.7` câu trích `‘… me … attā’ti`, `34.6` `34.9` `“No hetaṁ, bhante”.`, colophon `36.6`)
  vẫn lấp.

  **Bốn nhóm khoá (đo bằng máy trên 277 khoá Pāli):** A **5** · B **14** · C **3** · D **0**.

  - **A (5)**: `25.3` `25.5` `25.7` (= `23.3` `23.5` `23.7`) và `34.6` `34.9` (Pāli trùng 25 khoá đã ghim, tất cả cùng
    lời “No, sir.” trong nháy kép) — nguyên văn.
  - **B — mười khoá ngã luận (`24.5` `24.6` `24.8` `24.9` `26.2` `26.3` `26.5` `26.6` `26.8` `26.9`).**
    Tầng đã ghim dịch đủ vế đầu và vế cuối của mỗi chuỗi bốn (`24.2`/`24.3`, `24.11`/`24.12`, `26.11`/`26.12`) và
    bỏ trống hai vế giữa. Khẳng định: dựng từ `24.2` (0,93) và `24.3` (0,89), chỉ thay cặp tính từ (“formed and
    infinite”, “formless and limited”). Phủ định: dựng từ `26.11` (0,88–0,94; máy chỉ `24.2` cho `26.2` vì cùng
    khung, nhưng `26.11` mới mang phủ định `na … na hoti`) và `26.12` (0,78–0,89). Tầng đã ghim tự dùng hai khuôn
    hơi khác nhau ở `24.2` (“in the present as formed and limited … sure to be in some other place”) và `24.11`
    (“as formless and infinite in the present … sure to become”); lớp lấp theo `24.2` cho vế khẳng định và `26.11`
    cho vế phủ định — tức là theo khoá đã ghim **gần nhất cùng chiều**.
  - **B — `29.2` `29.3`** (từ `29.1`, 0,91). Lời đã ghim ở `29.1` **gộp** ba loại thọ vào một câu (“Pleasant
    feelings, painful feelings, and neutral feelings are all impermanent …”) trong khi Pāli `29.1` chỉ nói lạc thọ.
    Lớp lấp tách đúng Pāli: `29.2` khổ thọ, `29.3` thọ không khổ không lạc, giữ nguyên chuỗi “impermanent,
    conditioned, dependently originated, liable to end, vanish, fade away, and cease”. Người đọc cột English sẽ thấy
    khổ thọ và xả thọ được nói hai lần — hệ quả của `29.1` đã ghim.
  - **B — `34.5` `34.8`** (từ `34.2`, 0,84). `34.2` đã ghim nói về “these seven planes … and two dimensions” số nhiều
    (vì `34.1` đã ghim gộp cả mục); Pāli `34.5`/`34.8` là `tañca … tassa` số ít, về **một** xứ ⇒ “understands it — and
    its origin …”. Pāli của hai khoá trùng nhau ⇒ lời trùng nhau.
  - **C (3)**: `34.4`, `34.7` (“Now, Ānanda, as for the dimension of …”, tên xứ lấy nguyên của `33.17` đã ghim; mở
    `“` theo Pāli) và colophon `36.6` theo khuôn colophon các bài đã lấp (“… is finished—the second.”), tên bài lấy
    từ `0.2` đã ghim.

  **Ghi chú về tầng đã ghim.** `34.3` đã ghim “No, sir.” bỏ dấu lược `…pe…` của Pāli — đó là chỗ tầng đã ghim
  lược cả đoạn hỏi về trú xứ thứ hai đến thứ bảy; không thuộc lát.

  **Dấu lược:** 0 trong Pāli của 22 khoá, 0 trong lớp lấp. **Nháy:** 22/22 khớp Pāli. **Cặp Pāli trùng toàn bài:**
  360; khoá lấp có Pāli trùng khoá khác đều cùng lời (0 lệch).

  **Coverage (đo bằng phép của `englishCoverageFor`: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước: 183/199
  = 0.9196. Sau khi lớp lấp `published`: 199/199 = 1.0. Độ nhạy: phải mất thêm 40
  khoá có nội dung nữa thì bài mới rớt dưới ngưỡng 0,8. Lớp lấp chỉ được tính khi `status: published`.
