notes: |-
  **Phân loại 38 khoá (đo bằng script trên Pāli đã ghim, khớp ≥ 0,80 sau chuẩn hoá là B): A = 5 · B = 15 · C =
  18 · D = 0.** 5/38 khoá lớp lấp trùng nguyên văn một lời đã ghim của cùng bài.

  **Bối cảnh.** 38 khoá rải rác. Phần lớn là chỗ tầng đã ghim **gộp nội dung** vào khoá trước: `1.3.3` (“told
  him of their preparations”), `1.7.1` (“told the mendicants about these things”), `1.10.63` (gộp thân, khẩu,
  ý), `3.1.43` (gộp `3.1.44`), `3.1.65` (gộp `3.1.66`), `3.1.95` (gộp `3.1.96`), `3.1.145` (gộp `3.1.146`),
  `3.3.82` (gộp tham, sân, si). Lớp lấp dịch theo Pāli từng khoá, nên ở các chỗ ấy người đọc sẽ gặp lại nội dung
  đã nói; ghi ra vì đó là hệ quả của tầng đã ghim.

  **Nhóm A (5 khoá).** `1.10.66`/`1.10.68` = `1.10.64`; `1.11.67`/`1.11.69` = `1.11.65`; `2.2.63` = `2.2.53`.

  **Nhóm B (15 khoá, khớp 0,89–0,99).** `1.7.8` (0,99 với `1.7.6`, đổi thành mệnh đề quan hệ nối `1.7.7` “And
  what is that teaching?”); `1.10.65`/`1.10.67` (0,94 với `1.10.63`, tách riêng khẩu và ý); `2.2.62` (0,89 với
  `2.2.52`, chèn phẩm chất “attached to their own views …” của `2.2.61`); `2.2.81`/`88`/`95`/`102` (0,97–0,98
  với `2.2.74`) và `2.2.82`/`89`/`96` (0,91–0,95 với `2.2.75`), chỉ đổi tên tâm giải thoát và tên phiền não lấy
  từ `2.2.79/86/93/100/104` đã ghim; `3.3.6`/`3.3.12` (0,98/0,91 với `3.3.5`/`3.3.11`); `3.3.83`/`3.3.84` (0,90
  với `3.3.82`) tách sân và si.

  **Nhóm C (18 khoá).** `1.3.4` (lời lấy từ phần kể `1.3.1`: “spread carpets … water jar … oil lamp”), `1.7.2`,
  `1.7.3` (`…pe…` → đúng một `…`), `2.1.86`, `2.2.103`, `3.1.44`, `3.1.66` (`…pe…` → `…`), `3.1.96`, `3.1.146`,
  tám khoá `Yaṁpāvuso, bhikkhu … …pe… …` (`3.3.9`, `3.3.15`, `3.3.18`, `3.3.21`, `3.3.24`, `3.3.27`, `3.3.30`,
  `3.3.33`; mỗi khoá đúng một `…`, phần hai đầu lấy chữ của khoá `Puna caparaṁ` đã ghim ngay trước), colophon
  `3.4.6`.

  **Cố ý lệch / quy ước.** (1) **Ngoặc, ngoại lệ có lý do:** `1.11.67` và `1.11.69` Pāli có `‘…’` (1/1) nhưng
  lớp lấp 0/0, vì đây là nhóm A — dùng lại nguyên văn lời `1.11.65` (và `1.11.71`) đã ghim, vốn bỏ ngoặc; giữ
  ngoặc thì hai khoá anh em lệch nhau. (2) `2.2.81` … `2.2.102` giữ cách tầng đã ghim rút gọn chuỗi bảy phân từ
  thành “developed and properly implemented” (như `2.2.74`), để bốn câu song song đọc giống nhau. (3) Mười khoá
  `3.3.6`–`3.3.33` kết bằng `—` vì khoá tiếp theo đã ghim (“This too is a quality that serves as protector.”) là
  câu riêng; Pāli là mệnh đề `Yaṁ …` nối vào đó.

  **Nhóm D: 0.**

  **Dấu và ngoặc (kiểm bằng script, từng khoá).** `…pe…` = đúng một `…`; số `“ ” ‘` và `’` đóng (không kể `’` +
  chữ thường) của lớp lấp khớp Pāli ở 36/38 khoá; hai khoá lệch là ngoại lệ nhóm A đã nêu. NFC, không khoá rỗng,
  mọi khoá ⊆ `fillableSegments`, không khoá nào trùng khoá đã ghim có chữ. Pāli trùng nguyên văn trong bài ⇒
  English trùng (kể cả lời đã ghim): đạt.

  **Đo nguyên nhân khoá trống.** Tầng đã ghim để trống 38 khoá (không tính `:0`) — đúng bằng số khoá của lát,
  nên sau lát này bài **không còn khoá trống nào** ngoài khối `:0`. Cắt cụt dãy (≥ 4 khoá trống liền nhau): 1
  dãy / 4 khoá / 256 ký tự Pāli. Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 15 khoá (≤ 38).
  Ngoài hai phép trên, cơ chế thấy rõ khi đọc là **tóm tắt nội dung** vào một khoá đã ghim (nêu ở trên) — phép
  đo thân từ không bắt được nó.

  Triangulation 8.0: scorecard Việt của `dn33` (`content/meta/sutta/dn/dn33.yaml`) có `quality.assessed_by`
  **trùng** alias của lớp lấp (`source/tooling.yaml`) — tức bản Việt canonical và bản lấp do cùng một công cụ
  làm/chấm. Vì vậy bản lấp **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài này
  **không** được tuyên bố là đã đối chiếu English ở 38 khoá này. Đối chiếu có: Pāli root đã ghim (authority),
  lời Sujato đã ghim của chính bài (dùng làm khuôn chữ cho nhóm A/B) và bản Việt canonical (chỉ đối chiếu nghĩa,
  không dịch vòng). Không chạm tầng Việt hay metadata Việt.

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run
  build` (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều
  phối. Không đặt blocker vì cổng chưa chạy không phải lỗi kiểm định.

  Hệ quả với `content/meta/reference-gaps.yaml`: `dn/dn33` **không** có record trong tệp đó, nên không có record
  nào thành thừa vì lát này. Coverage trên Pāli có nội dung (≥ 40 ký tự, bỏ `:0`): trước 654/687 = 0,9520; sau
  khi `published` 687/687 = 1,0000. Lát ghi 38 khoá, trong đó 33 khoá có nội dung và 5 khoá dưới 40 ký tự (không
  vào coverage nhưng vẫn là khoá trống thật, nên vẫn lấp). Độ nhạy: phải mất 138 khoá có English nữa thì mới rớt
  dưới 0,8.
