notes: |-
  Tiền lệ: 2.2 lặp lại 1.2 ("At one time the Buddha was staying in the land of the Sakyans,
  in the Great Wood near Kapilavatthu, together with a large Saṅgha of five hundred mendicants,
  all of whom were perfected ones.") nhưng ở trong lời tưởng tượng của bốn vị thần, nên thì
  hiện tại: `viharati` và `sabbeheva arahantehi` cho "is staying" / "are perfected ones".
  Tiền lệ cho thì này có ngay trong chính bài: 4.2 dùng y hệt cấu trúc
  `sannipatitā honti … dassanāya` và Sujato dịch "have gathered". Vì vậy 2.3 dùng "have
  gathered" chứ không theo "had gathered" của 1.3.
  Bất định đã ghi nhận: 1.3 và 2.3 có Pāli TRÙNG NGUYÊN VĂN nhưng Sujato dịch khác thì
  ("had gathered" so với "have gathered") — đó là Sujato tự làm vậy trong chính bài này, vì
  1.3 là thì quá khứ của người kể chuyện còn 2.3 là lời thần đang nghĩ. Bản dịch bám theo
  4.2. Đây là chỗ duy nhất trong lát này cố ý không dùng lại nguyên văn bản đã ghin, và lý do
  đã được đo bằng tiền lệ 4.2. Ghi lại vì người đọc bốn cột sẽ thấy hai khoá cùng Pāli nhưng
  khác thì.
  Lớp lấp: 2 khoá nằm ở phần bản đã ghin đã lược.
  
