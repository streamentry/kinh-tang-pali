  1.2.2/1.3.2 Pāli đồng nhất nhau ("Sace agāraṁ ajjhāvasati, rājā hoti cakkavattī …pe…") nên
  dùng một bản: giữ đầu câu đã ghim ở dn14:1.31.8 ("If he stays at home he becomes a king,
  a wheel-turning monarch" 6×) rồi cắt bằng một "…" — không mở rộng …pe… theo luật lớp lấp.
  1.2.3/1.3.3 Pāli đồng nhất 1.1.13 (trừ hoa/thường đầu câu) nên giữ nguyên "But if he goes
  forth from the lay life to homelessness, he becomes a perfected one, a fully awakened Buddha,
  who has cast off the world’s veil. " (mẫu "world’s veil" 6×, thắng mẫu "veil from the world" 2×
  của dn14). Không có bất định thuật ngữ nào đáng kể. Không blocker.
