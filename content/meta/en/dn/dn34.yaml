notes: |-
  **Phân loại 140 khoá (đo bằng máy, theo Pāli của từng khoá so với khoá có lời Sujato trong cùng bài):
  A = 1 · B = 108 · C = 31 · D = 0.** Phép đo dùng tỉ lệ giống chuỗi Pāli ≥ 0,70 cho nhóm B. Đọc lại tay,
  10 khoá máy xếp C thật ra là dựng lại từ lời Sujato đã gộp vào khoá liền trước (2.1.80, 2.1.109,
  2.1.162/165/168/171 và 2.3.101–2.3.104, xem nhóm 4), và 4 khoá `Yaṁpāvuso, bhikkhu …pe…`
  (2.3.23/26/29/32) máy xếp B chỉ vì khoá ngắn trùng ký tự với `1.1.4`, thật ra là C. Số đọc tay:
  A 1 · B 114 · C 25 · D 0.

  **Nhóm 1 — 99 khoá tổng kết `Ayaṁ eko dhammo …` / `Ime N dhammā …` (B, 0,88–0,93).** Tầng đã ghim
  dịch câu hỏi `Katamo/Katame … ?` (in đậm) rồi bỏ câu tổng kết ở cuối mỗi mục, ở cả mười nhóm. Không
  có khoá nào trong bài để Sujato dịch câu tổng kết này (0 trên 99), nên mỗi khoá dựng lại từ đúng câu hỏi
  của mục mình, đổi `What N things …?` thành `These N things ….` (với `eko`: `This one thing ….`). Động từ
  lấy nguyên của Sujato: *is helpful · should be developed · should be completely understood · should be
  given up · makes things worse · leads to distinction · is hard to comprehend · should be produced ·
  should be directly known · should be realized*. Dựng bằng máy từ câu hỏi liền trước rồi in ra kiểm tay
  đủ 99 khoá; không bỏ thẻ `<b>` vào lớp lấp.

  **Nhóm 2 — A: `1.6.27`.** Pāli `Yassa cittaṁ na namati ātappāya …` trùng nguyên văn `1.6.33`, nên dùng
  lại nguyên văn lời `1.6.33`: “This being so, their mind doesn’t incline toward keenness, commitment,
  persistence, and striving.” Hệ quả hiện ra với người đọc: tầng đã ghim đã đặt đúng câu này ở `1.6.26`
  (dịch vế `tassa cittaṁ na namati …` của khoá đó), nên câu sẽ lặp hai lần liền nhau. Pāli gốc vốn lặp
  (`1.6.26` nói rồi `1.6.27` nói lại); giữ lặp là theo Pāli và theo luật A.

  **Nhóm 3 — năm khoá `Yaṁpāvuso …pe… ‘khīṇā me āsavā’ti.` (1.8.62/64/66/68/70).** Dựng từ `1.8.60`/
  `1.8.73`: “Reverends, that … ‘My defilements have ended.’” Giữ đúng một `…` cho `…pe…`, không mở rộng thành
  “This is a power that … relies on to claim”. Mười khoá `Yaṁpāvuso, bhikkhu …` ở nhóm mười
  (2.3.5–2.3.32) theo cùng khuôn “Reverends, that a mendicant …”, phần đuôi lấy từ lời Sujato của khoá
  `Puna caparaṁ …` liền trước (vd. 2.3.11 “… has good associates.” từ 2.3.10; 2.3.20 “… is full of joy in
  the teaching and training.” từ 2.3.19). Tầng đã ghim bỏ cả loại khoá này ở mọi bài song song (đo trên
  `dn33`, `an10.17`: 0 khoá có lời), nên không có cách dịch có sẵn để dùng lại; khuôn “that …” là lựa chọn
  của lớp lấp, câu cụt có chủ đích vì vế chính `ayampi dhammo nāthakaraṇo` nằm ở khoá sau.

  **Nhóm 4 — tầng đã ghim gộp nội dung khoá sau vào khoá trước (đo được trong bài này, khác nhận định
  chung "gộp khoá gần như không có").** `2.1.79` mang luôn nghĩa `2.1.80` (“My body is weak and unfit for
  work. I’d better have a lie down.’”); `2.1.108` mang luôn `2.1.109`; `2.3.100` gộp cả tham, sân, si nên
  `2.3.101`–`2.3.104` trống; `2.1.161` mang luôn “they perceive” của `2.1.162`. Lớp lấp vẫn dịch đúng Pāli
  từng khoá, lấy lại chữ của Sujato: 2.1.80 = đuôi của 2.1.79; 2.1.109 = “My body is strong and fit for work.
  I’d better preemptively rouse up energy …”; 2.3.101/103 “‘I’ve given up hate …” / “‘I’ve given up delusion …”;
  2.3.102 = 2.3.104 “so it’s unable to arise in the future,’ they understand.”; bốn khoá `evaṁsaññī hoti.`
  (2.1.162/165/168/171) giống nhau từng chữ: “That is how they perceive.” Hệ quả: người đọc sẽ thấy câu
  lặp ngay sau khoá đã ghim; không sửa được mà không shadow.

  **Nhóm 5 — C còn lại.** `1.7.88`/`1.7.89` lấy chữ của Sujato ở `dn2:91.3`/`91.18` (“They understand mind
  with greed as …”, “unfreed mind as unfreed mind”) nhưng **bỏ nháy đơn**, vì Pāli của hai khoá này viết
  `cittanti` không có nháy (khác `dn2`). Kết bài và tổng tụng (2.3.133–2.4.10, 13 khoá) theo khuôn lớp lấp
  đã dùng (“… is finished—the eleventh.”, “Its summary verse:”); tên kinh trong tổng tụng lấy theo nhan đề
  Sujato của `dn24`–`dn34` (What Came First, Inspiring Confidence, Reciting in Concert, Up to Ten…), riêng
  `Pāthika` giữ chính tả Pāli của tổng tụng. `2.4.10` nối với `2.4.11` đã ghim (“The Long Discourses are
  complete.”).

  **Ngoặc và dấu lược (đo bằng máy, đủ 140 khoá).** Nháy kép/đơn khớp Pāli 140/140 (dấu nhạt lượu tính là
  `’` + chữ thường). Dấu lược: Pāli 19 (`…pe…` tính một), lớp lấp 19, khớp từng khoá.

  **Lỗ hổng của bộ đo.** 13 khoá có lời Sujato ngắn dưới 30% Pāli (vd. `2.1.6`, `2.1.11`, `1.8.52`) — dấu
  hiệu cắt cụt, được tính là đã phủ. Không sửa (sẽ là shadow), chỉ báo.

  Triangulation 7,8: scorecard Việt của `dn34` ghi `quality.assessed_by` **trùng** alias của lớp lấp này
  (khai trong `source/tooling.yaml`), nên bản lấp **không** phải cách đọc English độc lập, và scorecard Việt
  của bài không được tuyên bố đã đối chiếu English ở các khoá này. Đối chiếu có: Pāli root, Sujato đã ghim
  (cùng bài và `dn2`, `dn33`, `an10.17`), bản Việt canonical (đủ khoá). Không chạm tầng Việt.

  technical_integrity 9,6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`
  trong lát này, nên không tuyên bố technical gate pass. Bốn lệnh còn lại cho người điều phối.

  Hệ quả với `content/meta/reference-gaps.yaml`: `dn/dn34` **không** có record. Coverage trước 390/398 =
  0,9799; sau khi `published` 398/398 = 1,0000. 140 khoá lấp chỉ có 8 khoá có nội dung (≥ 40 ký tự); 132
  khoá còn lại ngắn nên không đổi coverage, lấp để bài đọc liền. Không còn khoá trống nào của tầng Anh.
