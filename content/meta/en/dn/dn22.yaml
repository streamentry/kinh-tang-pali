notes: |-
  Phân loại 97 khoá (đo bằng máy, Pāli chuẩn hoá bỏ dấu câu, so với mọi khoá Sujato có chữ trong bài):
  A 56 · B 19 · C 20 · D 2. Các cụm Pāli trùng nhau giữa chính những khoá cần lấp cũng giữ cùng một lời (kiểm bằng máy):
  14.10 = 15.10; 14.11 = 15.11; 18.40 = 18.42 = 18.44.

  Nhóm A, dùng lại lời Sujato nguyên văn (56 khoá):
  - 49 khoá của phần Diệt đế (4.5.3): 20.7–20.10, 20.12–20.16, 20.18–20.22, 20.24–20.28, 20.30–20.34, 20.36–20.40, 20.42–20.46, 20.48–20.52, 20.54–20.58, 20.60–20.64,
    mỗi khoá 20.n ← 19.(n+1) của phần Tập đế (Pāli của hai phần là cùng một chuỗi các chữ `…pe…`/`…` về mắt, tai, mũi, lưỡi, thân… sắc, thinh, … tầm, tứ). Sujato đã dịch phần Tập đế đủ (“The ear …”,
    “nose …”, “Sights …”, “Eye consciousness …”, …) rồi để trống phần Diệt đế, nên lấy lại nguyên văn: 49 khoá đều có đúng một `…` (dạng `…pe…` ở 20.7 cũng là đúng một `…`).
  - 6.5 ← 6.2 (“‘In this body there is the earth element, the water element, the fire element, and the air element.’”); 9.5 ← 7.2, 8.2, 10.4 (“They’d compare it with their own body:”); 9.6 ← 7.3, 8.3, 10.5;
    9.7 ← 4.2, 5.6, 7.4, 8.4 (“And so they meditate observing an aspect of the body internally …”); 22.12 ← 22.2 (“enlightenment in this very life, or if there’s residue left behind, non-return.”);
    14.11 và 15.11 ← 13.11, 16.12, 21.40 (“Or mindfulness is established that principles exist, to the extent necessary for knowledge and mindfulness. They meditate independent, not grasping at anything in the world.”).
    Nháy: Pāli 14.11 và 15.11 có `‘Atthi dhammā’ti` (một cặp nháy đơn) nhưng cả ba khoá nguồn của Sujato dùng lời gián tiếp, không nháy. Đo: Pāli (đơn mở 1, đơn đóng 1), bản lấp (0, 0). Lệch có lý do duy nhất ở nhóm A:
    giữ y lời Sujato để cùng một Pāli có cùng một lời.

  Nhóm B, dựng lại từ khoá gần trùng (19 khoá):
  - 2.9 ← 2.4 và 2.5 (0,60) và 2.10 ← 2.6 và 2.7 (0,73): hai khoá `evameva …` kết ví dụ người thợ tiện (2.8). Sujato chỉ dịch vế ví dụ (2.8) và bỏ vế kết;
    bản lấp dựng lại bằng chính câu Sujato đã dùng cho bốn hơi thở ở 2.4–2.7 (“Breathing in heavily they know: ‘I’m breathing in heavily.’ …”, “They practice like this: ‘I’ll breathe in …’ …”), thêm “In the same way”.
  - 5.4 ← 5.1 (0,87) và 6.4 ← 6.1 (0,80): vế `evameva kho …` của hai ví dụ (hạt trong túi; người đồ tể), dùng lại câu Sujato của 5.1/6.1 với “In the same way, a mendicant examines their own body, …”.
  - 18.39 ← 18.35 (0,83): “‘Oh, if only we were not liable to grow old! If only old age would not come to us!’” (“grow old” theo 18.38 của Sujato).
  - 18.40, 18.42, 18.44 ← 18.36 và 18.37 (0,71): `na kho panetaṁ icchāya pattabbaṁ, idampi yampicchaṁ na labhati tampi dukkhaṁ.` Sujato dịch hai vế ở hai khoá (“But you can’t get that by wishing.” và
    “This is what is meant by ‘not getting what you wish for is suffering’.”); Pāli ở 18.40/42/44 gộp một khoá. Bản lấp ghép hai câu ấy. Nháy: Pāli ba khoá không có nháy nào, còn lời Sujato của 18.37 có nháy đơn quanh cụm “not getting
    what you wish for is suffering” (vì nêu lại tên một khổ). Đo: Pāli (0, 0, 0, 0), bản lấp (đơn mở 1, đơn đóng 1). Lệch có lý do, theo quy ước của Sujato ở các khoá 18.37, 18.47.
  - 20.3 ← 19.4 (0,64): “But where is that craving given up and where does it cease?”
  - 20.11, 20.17, 20.23, 20.29, 20.35, 20.41, 20.47, 20.53, 20.59 ← 20.4 (0,91; 20.35: 0,87) cùng khoá Tập đế tương ứng 19.12, 19.18, 19.24, 19.30, 19.36, 19.42, 19.48, 19.54, 19.60: lời Sujato của Tập đế
    (“mind in the world seems nice and pleasant, and it is there that craving arises and settles.”) chỉ đổi “arises and settles” thành “is given up and ceases” theo 20.4 của Sujato (“…craving is given up and ceases.”).
  - 22.10 ← 22.9 (0,67): `tiṭṭhatu, bhikkhave, ekaṁ vassaṁ.` → “Let alone one year,” (khuôn “Let alone seven years,” 22.3 và “Let alone a fortnight,” 22.21).

  Nhóm C, tự dịch từ Pāli (20 khoá):
  - 16 dòng kết phần (nhãn của kho Pāli, tự dịch, theo tên phần của chính Sujato ở các khoá tiêu đề `x.0`): 1.13 “The summary is finished.” (`uddeso`); 2.15 “The section on mindfulness of breathing is finished.”; 3.7 “…the postures…”; 4.4 “…situational awareness…”;
    5.8 “…focusing on the repulsive…”; 6.8 “…focusing on the elements…”; 10.10 “…the charnel ground contemplations…”; 10.11 “The fourteen kinds of observing the body are finished.” (`cuddasa kāyānupassanā`); 11.15 “Observing the Feelings is finished.”;
    12.22 “Observing the Mind is finished.”; 13.13 “…the hindrances…”; 14.13 “…the aggregates…”; 15.13 “…the sense fields…”; 16.14 “…the awakening factors…”; 21.42 “…the truths…”; 21.43 “Observing Principles is finished.”.
  - 22.28 `Mahāsatipaṭṭhānasuttaṁ niṭṭhitaṁ navamaṁ.` → “The Longer Discourse on Mindfulness Meditation is finished—the ninth.” (tên bài theo 0.2 của Sujato; Dīgha Nikāya Mahāvagga có bài thứ chín là dn22, nhãn khớp).
  - 5.5 `‘atthi imasmiṁ kāye kesā lomā …pe… muttan’ti.`: “‘In this body there is head hair, body hair … urine.’” (đúng một `…`; danh sách mở đầu và kết lấy từ 5.2 của Sujato).
  - 9.8 `viharati.` (động từ kết của câu mà 9.7 để lửng ở `…pe…`): “They meditate.” Một khoá ngắn nhất, dịch nghĩa đen; không mở rộng thành câu đầy đủ.
  - 22.13 `tiṭṭhantu, bhikkhave, satta māsāni.`: “Let alone seven months,” theo khuôn 22.3 và 22.21.

  Nhóm D, báo, không tự hoà (2 khoá): 14.10 và 15.10, cùng Pāli với 13.10, 16.11 và 21.39. Lời Sujato khác nhau: 13.10 “They meditate observing the principles as liable to originate, as liable to fall, and as liable to both originate and vanish.”;
  16.11 và 21.39 “They meditate observing, with respect to the principles, the liability to originate, to vanish, and to originate and vanish.”. Bản lấp chọn lời của 16.11/21.39 (hai nguồn, và cùng khuôn với 2.12, 11.12, 12.19 của Sujato). Đây là lựa chọn của người dịch, không phải sự đồng thuận có sẵn.

  Chỗ cố ý lệch Sujato: không sửa chữ nào của Sujato. Lệch nháy ở năm khoá đã đo (14.11, 15.11, 18.40, 18.42, 18.44), chọn lời cho nhóm D, và các khoá nhóm C/B tự dựng.

  Dấu lược: các khoá có `…pe…` hoặc `…` ở Pāli (9.7, 20.7–20.64 và 5.5) đều ghi đúng một `…`; mọi khoá khác không có `…` ở Pāli và bản lấp không thêm. Lưu ý (tầng đã ghim, đo bằng máy, không sửa): Sujato tự thêm `…` nơi Pāli viết đủ ở 18 khoá
  (9.4, 14.9, 15.4, 15.5, 15.6, 15.7, 15.9, 16.4, 16.5, 16.6, 16.7, 16.8, 17.3, 18.38, 18.41, 18.43, 20.6, 22.11); và nhiều khoá ghim bị cắt cụt (ví dụ 22.11 “seven months …” cắt cả câu Pāli) nhưng được tính là đã phủ vì khoá không rỗng.

