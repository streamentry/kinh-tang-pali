notes: |-
  BẢN DỊCH LẤP 6 KHOÁ, TẤT CẢ ĐỂ TRỐNG Ở TẦNG ĐÃ GHIM; không blockquote tham chiếu, không Pāli rỗng, không `…pe…`, nên không có khoá nào bị bỏ.

  LUẬT 3 — 6/6 KHOÁ DỰNG TỪ BẢN ĐÃ GHIM TRONG CHÍNH BÀI:
  - 1.19 = 1.6 + 1.7 ghép lại (Sujato đã ghim đúng hai vế: “‘I have such confidence in the Buddha that” + “I believe there’s no other ascetic or brahmin—whether past, future, or present—whose direct knowledge is superior to the Buddha when it comes to awakening.’”), và trùng y nguyên 1.4 vốn đã ghép sẵn cả hai vế. Dấu `’?` đặt theo quy ước Sujato trong bài (2.7 kết `.’` bên trong ngoặc).
  - 2.10 và 2.11 = thân của 2.9 đã ghim, giữ nguyên cụm thuật ngữ: “the five hindrances, corruptions of the heart that weaken wisdom” · “firmly established in the four kinds of mindfulness meditation” · “correctly develop the seven awakening factors” · “the supreme perfect awakening”. Chỉ đổi thì và đại từ theo Pāli: 2.10 là tương lai (`bhavissanti … abhisambujjhissanti`) nên “will …”; 2.11 là quá khứ với chủ thể **một người** (`suppatiṭṭhitacitto … abhisambuddho`) nên “His … was … He … he …”. Tiền lệ: 2.9 đã ghim “give up / awaken” ở thì hiện tại cho cả nhóm, nên 2.10 phải tương lai và 2.11 phải quá khứ — nếu giữ “is/are” ở 2.11 thì lệch thì so với “gave up”. `semantic_fidelity` 9.4 vì có chỗ phải canh thì. `Yepi te` → “And all the perfected ones…”; `Bhagavāpi … etarahi arahaṁ sammāsambuddho` → “And the Blessed One, who is now the perfected one, the fully awakened Buddha”. `bhante` **bị bỏ** ở cả 2.10 và 2.11, đúng như 2.9 đã ghim bỏ `bhente` trong cùng khung `… te, bhante, …`. Bản dịch đầu tiên của lát giữ “sir” ở 2.11 trong khi bỏ ở 2.10 — lệch trong chính cặp khoá anh em; đã sửa cho cả hai cùng cách. (Sujato vẫn dịch `bhante` là “Sir” ở 2.1 và 2.12, nhưng ở 2.9 — khoá gần nhất — thì bỏ, nên 2.9 thắng.)
  - 19.7 và 19.11 là bản “tương lai” của 19.6 và 19.10 đã ghim, giữ nguyên khung “‘Reverend Sāriputta, … whose direct knowledge is superior/equal to the Buddha when it comes to awakening?’ I would tell them ‘No.’/‘Yes.’”, chỉ thay phạm vi thời gian.
  - 19.8 là bản “hiện tại” của cùng nhóm, giữ “at present” đúng như 19.12 đã ghim.

  BẤT ĐỊNH ĐÃ GHI — 19.8 CỐ Ý KHÔNG CHÉP NGUYÊN 19.12:
  19.8 và 19.12 có cùng khung (`Kiṁ panāvuso sāriputta, atthetarahi …, evaṁ puṭṭho ahaṁ, bhante, ‘no’ti vadeyyaṁ`) và Sujato đã ghim 19.12 với tiền tố thừa “But if they were to ask: ”. Nhưng 19.8 nằm ở **nhóm superior** (19.6–19.8) mà 19.6 đã ghim không có tiền tố đó, còn 19.12 nằm ở **nhóm equal** (19.10–19.12) mà 19.10 cũng không có. Vì vậy 19.8 chép 19.6 (không tiền tố) và 19.11 chép 19.10 (không tiền tố). Hệ quả: người đọc sẽ thấy 19.8 không có “But if they were to ask:” còn 19.12 có — đó là điểm lệch **có sẵn trong bản đã ghim**, không phải lỗi của lớp lấp; ghi ra để người đọc không tưởng lớp lấp sửa bản đã ghim. `ambiguity_integrity` 9.2 vì lựa chọn này.

  Ngoài ra 19.6 đã ghim `ahesuṁ atītamaddhānaṁ` (chỉ quá khứ) thành “whether past, future, or present”, và 19.10 (`ahesuṁ`, chỉ quá khứ) thành “whether past or future” — Sujato thêm tầm thời gian không có trong Pāli. Lớp lấp không nhân bản lỗi đó: 19.7 và 19.11 chỉ ghi “in the future”, đúng với `bhavissanti anāgatamaddhānaṁ`. Đây là chỗ duy nhất trong lát này cố ý không dùng lại nguyên văn bản đã ghim.

  TRIANGULATION 8.0, KHÔNG CAO HƠN: lớp lấp do chính người chấm viết; không có bản Anh độc lập phủ cho các khoá này ở commit đang ghim.

