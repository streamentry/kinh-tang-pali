notes: |-
  **Phân loại 99 khoá (đo bằng máy): A = 52 · B = 35 · C = 12 · D = 0.**

  **A — 52 khoá chép nguyên văn**, gần hết ở ba khối lặp: `36.2`–`36.21` và `38.2`–`38.20` (cuộc chất vấn
  “thế giới hoàn toàn hạnh phúc”, lặp `34.2`–`34.21`: 19 + 15 khoá); `41.2`–`41.6` và `42.2`–`42.6` ← `40.2`–`40.6`;
  `32.13` ← `31.10`; `47.8` ← `45.7`; `49.14` `49.15` ← `49.9` `49.10`; `50.9` ← `50.4`; `51.5` `53.4` ← `49.6`; và
  `32.7` (xem lệch có chủ đích bên dưới).

  **B — 35 khoá.** Câu hỏi về mười điểm không tuyên bố (`24.4` `25.2` ← `24.2`; `25.5` ← `25.3`; `26.3` ← `26.1`;
  `27.10` ← `27.8`) — lấy nguyên lời đã ghim, chỉ đổi nháy theo Pāli (tầng đã ghim đóng ngoặc ở khoá trước, nên các
  khoá lấp mang dấu đóng `’”` đúng Pāli). Lời Poṭṭhapāda thuật lại (`32.5` `32.6` `32.10` `32.12` `32.14` ← `31.2`
  `31.3` `31.7` `27.8` `31.11`, đổi tầng nháy: Pāli lồng thêm một lớp). `34.5` `36.5` `38.5` (Pāli `“ekantasukhī …”’ti?`
  → ““The self is absolutely happy and free of disease after death”?’”, chữ của `34.2`). `38.14` = `34.14`+`34.15`
  (Pāli gộp làm một khoá); `38.17` `38.19` ← `34.18` `34.20` (khác một dấu cách). `41.1` `42.1` (0,88 với `40.1`): tầng
  đã ghim dịch `40.1` khái quát cho cả ba loại (“these three kinds of incarnation”); lớp lấp dịch đúng từng loại
  “I also teach the Dhamma for the giving up of a mind-made / formless incarnation:”. `47.1` `47.3`; `47.7` =
  `45.5`+`45.6`; `49.13` `50.7` `50.8` `51.2` `51.4` `53.3` (Pāli chỉ khác hoa/thường hoặc dấu câu với `49.8` `50.2`
  `50.3` `49.2` `49.5`); `51.3` `53.2` (`…pe…` → “When reincarnated in a mind-made incarnation …”).

  **Ba lệch có chủ đích với lời đã ghim, kèm lý do:**
  - `32.7` (Pāli trùng `31.4`): lời `31.4` đã ghim kết bằng “… regarding whether the cosmos is eternal and so
    on.”” — vừa tóm lược danh sách (vì tầng đã ghim để trống `31.5`), vừa đóng `”` mà Pāli khoá này không có. Ở
    `32.7` danh sách nằm ngay khoá sau (`32.8`), nên lớp lấp giữ phần đầu của `31.4` và bỏ “regarding whether … and
    so on” cùng dấu `”`: “We understand that the ascetic Gotama didn’t give any categorical teaching at all:”.
    `32.10` theo cùng cách với `31.7`.
  - `47.4`, `47.6`: Pāli viết **đủ** vế `yassa … pahānāya dhammaṁ desetha/desema, yathāpaṭipannānaṁ vo …
    viharissathā’ti`, còn lời đã ghim cho câu song song (`45.2`, `45.4`) chỉ còn “what is that formless incarnation?”
    / “<em>This</em> is that formless incarnation.” Lớp lấp dịch đủ Pāli (chữ của `40.2` và `43.2`), không chép
    bản rút gọn; không dùng thẻ `<em>`.
  - `33.22`–`33.24`: **ngoại lệ nháy có lý do.** Pāli 0 nháy (`dukkhasamudayoti` …), lớp lấp 1/1 nháy đơn. Tầng đã
    ghim đặt bốn chân lý trong nháy đơn ở khoá anh em `33.21` (và mười điểm ở `33.6`–`33.15`), nên lớp lấp theo quy
    ước ấy. Lời đã ghim `33.21` gói cả bốn chân lý, nên ba khoá lấp lặp lại ba chân lý sau — hệ quả của tầng đã ghim.

  **Nháy kế thừa từ khoá A (đã đo, không sửa):** `36.4` `38.4` (Pāli ‘ mở, không đóng; lời chép từ `34.4` có thêm
  `’` đóng) và `36.15` (Pāli `“…”’ti?`; lời chép từ `34.15` bỏ nháy kép). Đây là quy ước của tầng đã ghim ở `34.4`/
  `34.15`; giữ nguyên văn để khoá A không lệch khoá anh em.

  **C — 12 khoá.** `8.1` `…pe…` → “…”. `31.5` `32.8` (mười điểm, đủ theo Pāli, chữ của `27.1`–`27.8`; nháy đơn ở
  `31.5`, nháy kép + `’` cuối ở `32.8` đúng Pāli); `31.8` `32.11` (hai điểm đầu + `…`); `31.9` (B) và `32.12` (B) điểm
  cuối. `32.4` `32.9` (lời thuật lại, theo `31.1` `31.6`). `44.3` `45.3` `47.5` `Tesaṁ mayaṁ evaṁ puṭṭhā evaṁ
  byākareyyāma:` → “Asked this, we’d answer like this:” — **gộp khoá thật**: lời đã ghim ở `44.2` `45.2` đã mang
  “We’d answer like this,” (theo khuôn `43.2`, nơi Pāli quả thật gộp vế này vào một khoá), nên bản lấp lặp nhẹ.
  `47.2` (`…pe…`). `56.5` colophon “With Poṭṭhapāda is finished—the ninth.”

  **Cơ chế thật ở bài này: tóm lược.** `32.3` “Poṭṭhapāda told the Buddha what had happened after he left.” thay cả
  `32.4`–`32.14`; `51.1` và `53.1` thu ba loại “incarnation” thành một câu; `31.4`/`31.7` “and so on” thay danh sách.
  Đo: dãy ≥ 4 khoá trống liên tiếp: 6 dãy / 74 khoá / 5.869 ký tự Pāli; nhóm dòng song song (ngưỡng 0,70): 85/99
  khoá. Bài có 295 cặp khoá Pāli trùng nguyên văn.

  **Dấu lược:** 7 dấu `…` trong bản lấp, mỗi dấu ứng đúng một `…pe…` của Pāli (`8.1` `31.8` `32.11` `47.2` `47.3`
  `51.3` `53.2`); không thêm `…` ở khoá Pāli viết đủ. 24 khoá dưới ngưỡng 40 ký tự (phần lớn là “I say to them,”
  / “Asked this, they say, ‘No.’” trong khối `36`/`38`, cùng `8.1` `41.3` `42.3` `49.15` `56.5`) vẫn lấp.

  **Triangulation 8.0.** Scorecard Việt của bài (`content/meta/sutta/dn/dn9.yaml`) có
  `quality.assessed_by` trùng đúng alias của lớp lấp này (alias khai trong `source/tooling.yaml`), nên bản
  lấp **không** phải cách đọc English độc lập với bản Việt, và scorecard Việt của bài **không** được tuyên
  bố là đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root đã ghim + Sujato đã ghim (ở các khoá
  có chữ của chính bài) + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng). Không sửa tệp Việt hay
  metadata Việt.

  **technical_integrity 9.6.** Lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều phối. Đã tự kiểm
  bằng máy: JSON parse; mọi khoá thuộc tập khoá tầng Anh đã ghim để trống (không shadow); NFC; không khoá rỗng;
  khoá theo thứ tự Pāli; nháy kép/đơn và dấu lược so **từng khoá** với Pāli (`…pe…` tính là một `…`; `’` có
  chữ thường đứng ngay sau là dấu nhạt lượu, còn lại là nháy đóng).

  **Coverage và gap.** `dn/dn9` **có** record trong `content/meta/reference-gaps.yaml`; sau khi bản lấp `published`, record đó thành thừa — lát này **không** chạm tệp đó, để người điều phối chạy lại `npm run reference:gaps`. Coverage English (mẫu số = khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`):
  trước lớp lấp 277/352 = 0.7869; sau khi `published` 352/352 = **1,0000** (không còn khoá có nội dung
  nào trống). Độ nhạy: lớp lấp chỉ được tính khi `published`; nếu bài rơi về `review`/`draft` thì coverage quay về
  0.7869 — dưới ngưỡng 0,8. Ở trạng thái `published`, phải mất 71 khoá có nội dung
  nữa mới rớt ngưỡng 0,8.
