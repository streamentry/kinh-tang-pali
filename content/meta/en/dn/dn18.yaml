notes: |-
  **Phân loại 48 khoá (đo bằng script trên Pāli đã ghim, khớp ≥ 0,80 sau chuẩn hoá là B): A = 10 · B = 30 · C =
  8 · D = 0.** 16/48 khoá lớp lấp trùng nguyên văn một lời đã ghim của cùng bài.

  **Bối cảnh.** Bài này lặp nguyên văn lời tuyên bố của Đức Phật về người Ñātika ba lần (`1.3–1.7` lời Ngài;
  `2.2–2.6` người Ñātika nghe lại; `3.2–3.7` Tôn giả Ānanda nghe lại; `5.3–5.8` Ānanda thuật lại) và lời Ānanda
  tự nghĩ ở `4.2–4.18` lặp lại khi Ngài thưa với Đức Phật ở `5.9–6.9`. Tầng đã ghim chỉ dịch lần đầu, còn các
  lần sau thay bằng **câu tóm tắt** (`2.1`+`2.7`, `3.1`, `5.1` “told the Buddha of his concerns”, `6.9`, `9.1`,
  `16.3` “did likewise”). Vì vậy câu `2.1` đã ghim (“When the devotees of Ñātika heard about the Buddha’s”) và
  `2.7` (“answers to those questions, …”) giờ bị lớp lấp chen vào giữa; và `6.9` đã ghim nhắc lại nội dung
  `6.7`/`6.8` của lớp lấp. **Seam và lặp này do tầng đã ghim, không sửa được mà không shadow** — ghi ra để người
  đọc biết.

  **Nhóm A (10 khoá).** `2.4`, `3.4`, `5.5` = `1.5`; `5.4` = `1.4`; `5.6` = `1.6`; `5.10` = `4.3`; `5.14` =
  `4.8`; `6.2` = `4.11`; `6.3` = `4.12`; `11.4` = `7.3` (Pāli trùng cả ngoặc).

  **Nhóm B (30 khoá, khớp 0,89–1,00).** Phần lớn khác Pāli nguồn **chỉ ở ngoặc/dấu phẩy** (tỉ lệ 1,00 sau chuẩn
  hoá): `2.3`/`3.3` (= `1.4`, ngoặc `‘`), `2.5`/`3.5` (= `1.6`), `2.6`/`3.6`/`5.7` (= `1.7`, đóng `’”` / `’` /
  không đóng theo đúng Pāli), `4.18` (vế sau của `6.9`), `5.12`/`6.5` (= `4.6`/`4.14`), `6.4` (= `4.13`), `16.4`
  (= `16.2`), `9.2` (= `7.3`, ngoặc đơn). Các khoá thêm `bhante`: `5.9` (`4.2`, 0,96), `5.13` (`4.7`, 0,97),
  `6.1` (`4.10`, 0,96), `6.6`–`6.8` (`4.15`–`4.17`, 0,91–0,97) — chèn “sir”. `2.2`/`3.2`/`5.3` (0,92 với `1.3`)
  thêm `kira` → “It seems”. `3.7`/`5.8` (0,99 với `2.7`) dựng thành câu trọn vì không còn câu `2.1` đứng trước.
  `17.5`, `18.2`, `23.11`, `24.6`, `25.9` là vế `evameva kho …` của ví dụ: dựng từ câu tầng đã ghim ở `17.3`,
  `17.9`, `23.9`, `24.4`, `25.7`, thêm “In the same way”. `25.5` (0,99 với `25.2`). `4.18`: máy chỉ ra `6.9`
  (1,00), nhưng lời `6.9` đã ghim là câu tóm gộp `6.7`–`6.9`, nên vế `yena … na byākareyyā”ti?` được dịch thẳng
  từ Pāli.

  **Nhóm C (8 khoá).** `5.2` (“Sir, I have heard this:”); `5.11` (0,78 với `4.4`) ghép lời `4.4`+`4.5` đã ghim
  đúng như Pāli gộp hai câu, thêm “sir”; `5.15`/`5.16` tách lời `4.9` đã ghim đúng chỗ Pāli tách; `7.5`/`11.6`
  (Pāli trùng nhau ⇒ cùng một câu “their destiny, where they were reborn in the next life.”, lấy vế sau của
  `7.3`); `9.3`; colophon `29.5`.

  **Cố ý lệch tầng đã ghim.** (1) `25.5` giữ ngoặc đơn `‘…’` của Pāli và dịch thẳng từng cặp (“This is
  blameworthy, this is blameless; …”), trong khi `25.2` đã ghim bỏ ngoặc; giữ ngoặc để khớp Pāli từng khoá. (2)
  `17.5`, `23.11`, `24.6`, `25.9` không dịch `bhante`/`bho` vì tầng đã ghim bỏ hô ngữ ấy ở mọi khoá anh em
  `17.1–17.9`, `23.9–25.11`. (3) `4.18`: Pāli đóng `”` ở đây, nhưng `4.17` đã ghim đã tự đóng `”` trước — nên
  khoảng `4.17–4.18` có hai dấu đóng; lớp lấp theo Pāli, không sửa `4.17`.

  **Nhóm D: 0.**

  **Dấu và ngoặc (kiểm bằng script, từng khoá).** `…pe…` = đúng một `…`; số `“ ” ‘` và `’` đóng (không kể `’` +
  chữ thường) của lớp lấp khớp Pāli ở 48/48 khoá. NFC, không khoá rỗng, mọi khoá ⊆ `fillableSegments`, không
  khoá nào trùng khoá đã ghim có chữ. Pāli trùng nguyên văn trong bài ⇒ English trùng (kể cả lời đã ghim): đạt.

  **Đo nguyên nhân khoá trống.** Tầng đã ghim để trống 48 khoá (không tính `:0`) — đúng bằng số khoá của lát,
  nên sau lát này bài **không còn khoá trống nào** ngoài khối `:0`. Cắt cụt dãy (≥ 4 khoá trống liền nhau): 3
  dãy / 34 khoá / 3625 ký tự Pāli. Bỏ dòng song song (nhóm thân từ ≥ 0,70, mỗi khoá một nhóm): 28 khoá (≤ 48).
  Ngoài hai phép trên, cơ chế thấy rõ khi đọc là **tóm tắt nội dung** vào một khoá đã ghim (nêu ở trên) — phép
  đo thân từ không bắt được nó.

  Triangulation 8.0: scorecard Việt của `dn18` (`content/meta/sutta/dn/dn18.yaml`) có `quality.assessed_by`
  **trùng** alias của lớp lấp (`source/tooling.yaml`) — tức bản Việt canonical và bản lấp do cùng một công cụ
  làm/chấm. Vì vậy bản lấp **không phải** cách đọc English độc lập, và scorecard tiếng Việt của bài này
  **không** được tuyên bố là đã đối chiếu English ở 48 khoá này. Đối chiếu có: Pāli root đã ghim (authority),
  lời Sujato đã ghim của chính bài (dùng làm khuôn chữ cho nhóm A/B) và bản Việt canonical (chỉ đối chiếu nghĩa,
  không dịch vòng). Không chạm tầng Việt hay metadata Việt.

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run
  build` (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều
  phối. Không đặt blocker vì cổng chưa chạy không phải lỗi kiểm định.

  Hệ quả với `content/meta/reference-gaps.yaml`: `dn/dn18` **có** record (dưới ngưỡng 0,8); sau khi `published`
  record ấy thành thừa — lát này **không** sửa tệp đó, để người điều phối sinh lại bằng `npm run
  reference:gaps`. Coverage trên Pāli có nội dung (≥ 40 ký tự, bỏ `:0`): trước 163/208 = 0,7837; sau khi
  `published` 208/208 = 1,0000. Lát ghi 48 khoá, trong đó 45 khoá có nội dung và 3 khoá dưới 40 ký tự (không vào
  coverage nhưng vẫn là khoá trống thật, nên vẫn lấp). Độ nhạy: phải mất 42 khoá có English nữa thì mới rớt dưới
  0,8.
