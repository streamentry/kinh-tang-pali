notes: |-
  **Phân loại 44 khoá: A = 7 · B = 24 · C = 13 · D = 0.**

  - **Lời mời (`4.3`–`7.6`):** tầng đã ghim đã gói lời nhắn vào `4.2`/`4.5` và tóm lược phần Rosika truyền lời
    (“He did as he was asked, and | the Buddha consented with silence.”). Lớp lấp dịch `4.3`, `5.2`–`5.4`,
    `6.3`–`6.5`, `7.5`, `7.6` theo Pāli (C/B, từ vựng “healthy and well, nimble, strong, and living comfortably”
    của `4.2`). Hệ quả sẽ hiện ra: câu `5.1` của tầng ghim kết bằng “and”, bản lấp chen vào trước `5.5`.
  - **Tà kiến (`8.3`–`8.8`, `15.4`–`15.6`):** B từ `2.1`–`2.4`/`9.7`. `8.6` = `2.3` (A); `15.4` = `13.4` (A).
    **Cố ý lệch:** `8.7` có Pāli ≡ `16.13`, nhưng lời Sujato `16.13` đã gộp luôn vế `kiñhi …` của `16.14`; lớp lấp
    chỉ giữ “That’s the consequence of such a wicked, greedy deed, I say—” để vế ấy nằm ở `8.8`. Ngược lại
    `16.14` (lấp) in lại “for what can one person do for another?’” ngay sau `16.13` đã nói câu ấy — lặp do tầng
    ghim nói trước.
  - **Lohicca / Pasenadi (`12.2`–`15.11`):** tầng ghim tóm cả đoạn vào `12.1` (“…either of Lohicca or of King
    Pasenadi,”) và `13.2` (“that is wrong view.”). `14.2`, `14.3` = `11.5`, `11.6` (A); `12.2`, `12.3`, `13.1`,
    `15.1` từ `10.5`–`11.7` (B). **Cố ý lệch:** `14.1` (Pāli ≡ `12.1`) và `15.2` (Pāli ≡ `13.2`) **không** chép
    lời tóm lược ấy — chép sẽ thành câu cụt sai chỗ; `14.1` giữ “So it seems, Lohicca, that should someone say:”,
    `15.2`/`15.9` dựng từ đuôi lời Sujato `13.7` (“They’re acting unkindly, their heart is full of hostility, and
    they have wrong view.”). `15.7`/`15.8` tách đúng lời `13.7` theo ranh giới Pāli.
  - **Ba đạo sư:** `16.10`, `17.7`, `18.8` từ `16.6` (nháy kép theo Pāli); `16.16`, `17.11`, `18.13` từ `16.2` /
    `20-55.5` (“such a teacher … true, correct, legitimate, and blameless”); `18.7` C.
  - `56-62.1`, `63-77.1`, `63-77.4` là `…pe…` đơn → `…`. Colophon `78.8`.

