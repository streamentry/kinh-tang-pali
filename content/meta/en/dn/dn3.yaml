notes: |-
  Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.

  **Bốn khoá là lời đã ghim, lấy lại nguyên văn — kiểm bằng so khớp, không bằng mắt.** (`1.4.4`,
  `1.4.5`, `1.4.6`, `2.1.5`; ba khoá nữa là lời đã ghim nhưng phải điều chỉnh, xem dưới.)

  1. `1.4.4` — lõi Pāli **bằng `1.2.5`**: `itipi so bhagavā arahaṁ sammāsambuddho … buddho
     bhagavā` khác `1.4.4` đúng hai chỗ: có thêm dấu phẩy sau `bhagavā`, và `1.2.5` đóng ngoặc
     ngay trong khoá (`bhagavā.’`) còn `1.4.4` thì không (ngoặc kéo dài tới `1.4.7`). Bản đã ghim ở
     `1.2.5` là "‘That Blessed One is perfected, a fully awakened Buddha, accomplished in knowledge
     and conduct, holy, knower of the world, supreme guide for those fit for training, teacher of
     gods and humans, awakened, blessed.’" Lớp lấp lấy nguyên văn và **bỏ đúng ngoặc đóng** ấy.
     Dấu phẩy của Pāli không thêm vào tiếng Anh vì tiếng Anh không cần dấu phẩy giữa chủ ngữ và
     vị ngữ danh sách; đó là lựa chọn dấu câu, không phải bỏ nghĩa.
  2. `1.4.5` — Pāli **nguyên văn bằng `1.2.6` và `2.2.3`**, và lời đã ghim của hai khoá ấy **giống
     nhau từng chữ**. Lấy nguyên văn. Đây là chỗ dễ sai: đọc riêng `1.4.5` thì `So imaṁ lokaṁ …
     pavedeti` rất dễ thành *"Ngài đã chứng ngộ thế giới này bằng thắng trí của chính mình"* như một
     mệnh đề mới, trong khi nó là **lời khen thứ hai** của Pokkharasāti về Đức Thế Tôn, lặp nguyên
     văn `1.2.6`.
  3. `1.4.6` — Pāli giống `2.2.4` và `1.2.7` **của chính bài này**, mỗi chỗ chỉ lệch **đúng vị trí của
     một dấu phẩy** (`sabyañjanaṁ kevalaparipuṇṇaṁ` với `sabyañjanaṁ, kevalaparipuṇṇaṁ`); bỏ hết
     dấu phẩy thì ba chuỗi bằng nhau (đã kiểm). Lời đã ghim ở cả `1.2.7` và `2.2.4` **giống nhau từng
     chữ**: "He teaches Dhamma that’s good in the beginning, good in the middle, and good in the end,
     meaningful and well-phrased. And he reveals a spiritual practice that’s entirely full and pure."
     Lớp lấp nguyên văn. Cùng cách ấy còn có `dn2:40.3`, `dn10:1.7.3`, `dn12:3.6`, `dn14:3.22.6` —
     nghĩa là đây là khuôn cố định của cả tầng, không phải lựa chọn của riêng lát này.
     `ādikalyāṇa` / `majjhekalyāṇa` / `pariyosānakalyāṇa` → "good in the beginning / middle / end",
     `sātthaṁ sabyañjanaṁ` → "meaningful and well-phrased", `kevalaparipuṇṇaṁ parisuddhaṁ
     brahmacariyaṁ` → "a spiritual practice that’s entirely full and pure" — tất cả từ lời đã ghim.
  4. `2.1.5` — Pāli **nguyên văn bằng `2.1.3`** (`‘arahasi vā maṁ tvaṁ, na vā maṁ tvaṁ
     arahasī’ti.`). Lấy nguyên văn: "‘You deserve me’ or ‘You don’t deserve me.’"
  5. `1.20.8` — ghép **nguyên văn** lời `1.20.4` và `1.20.5` đã ghim. Pāli `1.20.4` và `1.20.5` là
     hai khoá (`Taṁ kiṁ maññasi, ambaṭṭha,` / `kinti te sutaṁ brāhmaṇānaṁ …`), còn `1.20.8` là
     **một** khoá chứa cả hai; nên lớp lấp ghép đúng hai lời ấy, thêm `“` ở đầu theo Pāli.
  6. `1.18.6` — vế `ambaṭṭho māṇavo mayā saddhiṁ paṭimantetū”ti.` bị tầng đã ghim **gộp vào
     `1.18.5`**: lời `1.18.5` kết bằng "then you should stand aside and let him debate with me.”"
     Lớp lấp dựng lại đúng vế bị gộp, giữ dấu `”` mà Pāli đặt ở cuối khoá này, và **nói tên
     Ambaṭṭha** như Pāli (Sujato dùng đại từ "him"): "let Ambaṭṭha debate with me.”"

  **Chỉ `2.14.5` là khoá lớp lấp tự dịch**, và đây là chỗ duy nhất phải phán đoán. Pāli:
  `kacci pana so bhavaṁ gotamo tādiso no aññādiso”ti?` — `kacci` = "hay", `so bhavaṁ gotamo` = "Tôn
  giả Gotama" (theo `2.14.6` và `1.19.1` đã ghim), `tādiso` = "đúng như đã nói ở trên", `no
  aññādiso` = "hay không". Vế trước `2.14.4` đã hỏi "does he live up to his reputation or not?"
  (đã ghim), nên `tādiso` chỉ được hiểu là thuộc về `tathā santaṁyeva saddo abbhuggato`. Vì vậy
  bản lấp dùng lại **đúng cụm của tầng đã ghim** cho mệnh đề ấy: "or is the worthy Gotama living
  up to his reputation, or not?”" Đây là một chỗ mở rộng có chủ đích, có căn cứ ở `2.14.4` cùng
  lời thoại, và được ghi ở đây.

  **Một cảnh báo từ quét tự động, giữ nguyên vì có lý do.** Quét `rven88` báo "lặp cụm, một từ
  ngăn" ở `1.20.8`: "tutors … tutors". Đó là cụm **"the tutors of tutors"**, dịch của
  `ācariyapācariyānaṁ` và lấy **nguyên văn** từ `1.20.5` đã ghim. Không sửa: sửa thì lớp lấp lệch
  tầng đã ghim, và nghĩa vẫn đúng.

  **Hệ quả người đọc sẽ thấy ở `1.20.8`, nói thẳng.** `1.20.7` (đã ghim) đã viết "For a second time,
  the Buddha put the question," nên `1.20.8` sẽ lặp lại câu hỏi. Nguyên nhân là tầng đã ghim nói
  trước nội dung rồi để trống chỗ phát lại; Pāli gốc vốn phát lại đúng câu ấy. Giữ lặp là giữ
  đúng Pāli.

  **Ngoặc kép — bảng cân đọc tay, in ra trong script ghi file.** `1.4.4` 1/0 · `1.4.5` 0/0 ·
  `1.4.6` 0/0 · `1.18.6` 0/1 · `1.20.8` 1/1 · `2.1.5` 2/2 · `2.14.5` 0/1. Khớp Pāli từng khoá,
  **trừ `2.1.5` lệch có chủ đích**: Pāli bọc cả hai vế trong một cặp `‘…’`, còn tiếng Anh tách thành
  hai cặp trích dẫn — đó là lời của tầng đã ghim ở `2.1.3`, lớp lấp giữ nguyên.

  **Không khoá nào trong bảy khoá này mang `…pe…`**, nên tổng số dấu lược của lớp lấp bài này bằng 0.

  **Hai khoá còn trống ngoài lát này**: `2.10.1`, `2.10.4`, `2.10.7`, `2.10.10`, `2.22.9`, đều dưới
  ngưỡng đo 40 ký tự nên `coverage` không tính, và đều **lấp được** (fillableSegments chỉ so với
  prose của tầng đã ghim). Tổng số khoá có nội dung của `dn3` là 308; tầng Anh đã ghim để trống 7;
  lát này lấp hết. Tỉ lệ Anh của bài này **trước** lớp lấp là (308 − 7) / 308 = **0,9773** và **sau**
  lớp lấp `published` là **1,0000** — hai con số phải tách bạch, không được gọi nhầm tên.

  **Một điểm phải báo, không tự sửa.** Metadata Việt `content/meta/sutta/dn/dn3.yaml` ghi
  `quality.assessed_by` có phần tử `Space Bunny Free (OpenCode) — re-scored 2026-10-05 …`, tức
  cùng họ công cụ với lớp lấp này đã từng chấm lại bài Việt. Nhãn viết khác
  `OpenCode Space Bunny Free (agent)` nên không trùng chuỗi, nhưng là cùng công cụ. Vì vậy bài này
  **không** nên được tính là đã đối chiếu Anh độc lập toàn bài; `triangulation` hạ vì lý do đó cộng
  với việc bản Anh đã ghim để trống bảy khoá này. Lớp lấp không sửa tệp Việt.

  Không có blocker nào khác.

  `triangulation` hạ vì không có bản Anh độc lập: bản Anh đã ghim để trống đúng bảy khoá này; sáu
  khoá trong bảy là lời đã ghim, chỉ `2.14.5` là do lớp lấp tự dịch và không có bản Anh nào độc lập
  để đối chiếu. Người viết bản Việt của bài này và công cụ chấm lại bài Việt không nên được coi là
  độc lập với lớp lấp. Bốn lệnh cổng còn lại **chưa** chạy vì lát này bị cấm: `npm run validate`,
  `npm test`, `npm run check`, `npm run build`.
