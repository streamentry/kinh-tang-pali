notes: |-
  **Phân loại 36 khoá (đo bằng máy): A = 9 · B = 9 · C = 18 · D = 0.**

  **A — 9 khoá chép nguyên văn:** `4.2`–`4.5` ← `4.8`–`4.11` (lời bà-la-môn tự xưng là giai cấp cao nhất; tầng đã
  ghim dịch ở lần thứ hai, để trống lần thứ nhất); `18.8` ← `12.8` (“and years and seasons.”); `19.8`–`19.10` ←
  `19.2`–`19.4` (lần bắt người lấy trộm thứ ba); `26.2` ← `26.6` (“‘I will be an ascetic.’”).

  **B — 9 khoá, đều trong lời than của chúng sinh ở `18`** (kể lại ở ngôi thứ nhất những gì `12`–`16` đã kể ở ngôi
  thứ ba): `6.7` (0,89 với `6.2`, bỏ câu “Such things are exhibited in some aristocrats.” vì Pāli khoá này dừng ở
  `viññuppasatthā;`); `18.9` `18.14` `18.19` `18.25` (0,70–0,82 với `14.6`/`16.5`: “with that as our food and
  nourishment, we remained for a very long time”); `18.16` (0,62 với `14.13`, bỏ ví dụ quả kadam mà Pāli khoá này
  không có); `18.21`–`18.23` (0,80–0,90 với `16.1`–`16.3`, đổi “they took” → “we took”).

  **C — 18 khoá.** `18.5` `18.6` `18.7` `18.11` `18.12` `18.13` `18.17` `18.18` `18.24`: dịch từ Pāli ngôi thứ nhất,
  dùng đúng chữ của khoá ngôi thứ ba tương ứng (“the earth’s nectar”, “ground-fungus”, “bursting pods”, “ripe
  untilled rice”, “breaking it into lumps”, “No trace was left showing”). `18.6` giữ `hatthehi` (“with our hands”)
  mà lời `12.1` đã ghim bỏ. `5.8`–`5.10` và `6.6`, `6.8` (vòng thứ tư — người hạ tiện — của các pháp đen/trắng; Pāli
  `5.8` có `…pe…` → một `…`). `11.5` “That’s how it appeared.”, `11.8` “That’s how sweet it was.”, `13.8`
  “Gathered together, they bemoaned:” — **ba chỗ gộp khoá thật**: lời đã ghim ở `11.4`, `11.7`, `13.7` đã mang
  động từ của khoá kế (“appeared”, “as sweet as”, “bemoaned”), nên bản lấp lặp nhẹ; giữ vì Pāli khoá ấy có thật.
  `32.14` colophon “What Came First is finished—the fourth.”

  **Một cặp Pāli trùng mà lời khác nhau, cố ý:** `18.5` và `18.17` cùng là `Sā ahosi vaṇṇasampannā gandhasampannā
  rasasampannā.` nhưng chủ ngữ khác: `18.5` là vị đất (tầng đã ghim: “It was …”, `11.6`), `18.17` là dây leo
  `padālatā` mà tầng đã ghim dịch số nhiều “bursting pods” (“They were …”, `14.14`). Lớp lấp theo đúng số của tầng
  đã ghim: “It was beautiful, fragrant, and delicious.” / “They were beautiful, fragrant, and delicious.”

  **Cơ chế thật ở `18`: tóm lược.** Lời than `18.4`–`18.26` bị tầng đã ghim thu thành một câu chạy qua bốn khoá
  (`18.10` “…the earth’s nectar vanished,” · `18.15` “then the ground-fungus vanished,” · `18.20` “the bursting pods
  vanished,” · `18.26` “and now the rice grains …”). Lớp lấp đặt lại các câu Pāli ở giữa, nên dấu câu của các khoá
  đã ghim (dấu phẩy cuối) đứng cạnh câu trọn của bản lấp; `grammar_logic` 9,3 vì vậy. `18.7` kết bằng dấu phẩy để
  nối với `18.8` (“and years and seasons.”) đúng như cặp `12.7`/`12.8` đã ghim.

  **Nháy và dấu lược:** khớp Pāli ở cả 36 khoá; 1 dấu `…` (`5.8`). 11 khoá dưới ngưỡng 40 ký tự (`4.4` `5.9` `5.10`
  `6.8` `11.5` `11.8` `13.8` `18.24` `19.8` `26.2` `32.14`) vẫn lấp.

  **Cơ chế khoá trống (đo, không sửa):** dãy ≥ 4 khoá trống liên tiếp: 5 dãy / 22 khoá / 1.586 ký tự Pāli; nhóm
  dòng song song (ngưỡng 0,70): 17/36 khoá. Bài có 98 cặp khoá Pāli trùng nguyên văn.

  **Triangulation 8.0.** Scorecard Việt của bài (`content/meta/sutta/dn/dn27.yaml`) có
  `quality.assessed_by` trùng đúng alias của lớp lấp này (alias khai trong `source/tooling.yaml`), nên bản
  lấp **không** phải cách đọc English độc lập với bản Việt, và scorecard Việt của bài **không** được tuyên
  bố là đã đối chiếu English ở các khoá này. Đối chiếu thực có: Pāli root đã ghim + Sujato đã ghim (ở các khoá
  có chữ của chính bài) + bản Việt canonical (chỉ để kiểm nghĩa, không dịch vòng). Không sửa tệp Việt hay
  metadata Việt.

  **technical_integrity 9.6.** Lát này không được chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều phối. Đã tự kiểm
  bằng máy: JSON parse; mọi khoá thuộc tập khoá tầng Anh đã ghim để trống (không shadow); NFC; không khoá rỗng;
  khoá theo thứ tự Pāli; nháy kép/đơn và dấu lược so **từng khoá** với Pāli (`…pe…` tính là một `…`; `’` có
  chữ thường đứng ngay sau là dấu nhạt lượu, còn lại là nháy đóng).

