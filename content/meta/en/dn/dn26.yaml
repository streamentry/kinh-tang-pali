notes: |-
  **Phân loại theo máy trên 24 khoá: A 9 · B 15 · C 0 · D 0.** Dùng lại **nguyên văn** từ cùng bài: 9 khoá (đúng bằng số khoá nhóm A). Đã dò 9 nhóm Pāli trùng nguyên văn trong bài (tổng 20 khoá, gồm cả khoá đã ghim lẫn khoá lấp); với mỗi nhóm đó, mọi khoá lấp đều mang cùng lời với khoá còn lại của nhóm, ngoại trừ các khoá D đã nêu. Số khoá đã ghi: 24/24 khoá `fillableSegments`.

  **Hình dạng của chỗ trống.** Tầng đã ghim dịch chuyến đi phương Đông (`6.x`) và phương Bắc (`7.9`–`7.15`) nhưng bỏ phương Tây (`7.3`–`7.8`) khi dùng “…” cho `7.1`/`7.2`; bỏ cả đoạn Chuyển Luân Vương thứ bảy dặn người hầu và xuất gia (`8.7`–`8.17`), vì khoá `8.6` đã ghim gói cả thành “And after many years the seventh wheel-turning monarch went forth, handing the realm over to the crown prince.”; và bỏ ba vế `evameva kho` (`19.7`, `19.12`, `20.8`), ba khoá thơ `20.9`–`20.11` và dòng kết `28.32`. 24 khoá, 20 khoá có nội dung đo được.

  **Nhóm 1 — A nguyên văn (9 khoá).** `7.3` ← `7.10`; `7.5` ← `7.12`; `7.6`, `7.7` ← `7.13`, `7.14` (và `6.6`, `6.7`); `8.7` ← `3.2`; `8.16` ← `3.12`; `20.9`, `20.10`, `20.11` ← `20.4`, `20.5`, `20.6`. Với ba khoá `20.x`: lời đã ghim ở `20.6` chỉ có “brother for sister, and sister for brother.” — bỏ phần `tibbo āghāto … vadhakacittaṁ` mà Pāli của `20.6` có; lớp lấp giữ nguyên văn (luật A) vì phần ấy đã được tầng ghim dịch ở `20.3` và `20.4` (“Even a mother will feel like this”).

  **Nhóm 2 — B (15 khoá).** `7.4`, `7.8` ← `6.4` (0,97), `6.8` (0,97), đổi “eastern” thành “western”. `8.8` ← `3.3` (0,91): chèn lại `rañño cakkavattissa` (“to the wheel-turning monarch”) mà `3.3` bỏ. `8.9` ← `3.4` (0,77): `3.4` nuốt cụm `bahunnaṁ vassānaṁ …` thành “After many thousand years”; chèn lại đủ ba cụm của `3.1` (“After many years, many hundred years, many thousand years had passed”). `8.10` ← `4.4` (0,73) và `3.4`. `8.11` ← `3.5` (0,99). `8.12` ← `3.6` (0,91). `8.13` ← `3.7`+`3.8` (0,84): khoá Pāli gộp hai câu. `8.14` ← `3.9` (1,00). `8.15` ← `3.10`+`3.11` (0,69): khoá Pāli gộp hai câu. `8.17` ← `3.13` (0,95), đổi tên riêng thành “the wheel-turning monarch”. `19.7` ← `19.5` (0,77), `19.12` ← `19.10` (0,88), `20.8` ← `20.3` (0,88): ba vế `evameva kho` dựng thành “In the same way, …” (chữ “finger millet”, “disrespects mother and father, ascetics and brahmins, and fails to honor the elders in the family”, “full of hostility toward each other, with acute ill will, malevolence, and thoughts of murder” lấy nguyên của tầng ghim). `28.32` ← `0.2` (0,60): “The Wheel-Turning Monarch is finished, the third.”.

  **Số liệu A/B/C/D theo máy:** A 9 · B 15 · C 0 · D 0 (trên 24 khoá). Không khoá nào phải dịch từ đầu.

  **Dấu hiệu bất định ghi thẳng.** `8.11` Pāli kết bằng `…cutan’ti?` (dấu hỏi) trong khi `3.5`, cùng câu, kết bằng dấu chấm; tôi xem đó là lỗi dấu câu của bản Pāli và dịch khẳng định như `3.5`. `8.13`: Pāli có `—` cuối khoá, English kết bằng “I’ve heard that” (không dấu gạch) theo `3.8`.

  **Cố ý lệch tầng đã ghim.** (1) Lớp lấp dịch lại đoạn người hầu/đời vua thứ bảy dù `8.6` đã gói; do Pāli có đủ mười một khoá. (2) `8.9` chèn đủ ba cụm năm.

  **Ngoài lát.** Tầng ghim bỏ dấu `…pe…` ở `8.1` (“And for a second time,”) và ở `17.3`, nơi Pāli có `…pe…` (đo: 2 khoá); không sửa được. 16 khoá có chữ nhưng ngắn dưới 20% độ dài Pāli (dấu hiệu cắt cụt ở các chuỗi liệt kê) — `ratio` của tầng ghim có thể lạc quan ở bài này.

  **Ngoặc kép / nháy — bảng đo tự động trên 24 khoá.** 24/24 khoá khớp Pāli từng khoá (đếm “ ” ‘ ’ đóng/mở; `’` có chữ thường đứng ngay sau tính là dấu nhạt lược). Không khoá nào lệch.

  **Dấu lược.** 0 khoá lấp có `…pe…` trong Pāli; tổng số `…` trong English của 24 khoá lấp = 0; khớp quy tắc `…pe…` = đúng một `…` (không khoá nào có `…` mà Pāli viết đủ).

  Không còn khoá rỗng nào: 24/24 khoá `fillableSegments` đã được viết (4 khoá dưới 40 ký tự vẫn viết).

  **Coverage (đo thật).** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 279. Trước: 259/279 = 0,9283. Sau khi `published`: 279/279 = 1,0000 (lớp lấp phủ 20 khoá có nội dung; 4 khoá dưới ngưỡng không tính). Độ nhạy: ngưỡng 0,8 cần ≥ 224 khoá có lời; sau lấp còn dư 55 khoá trước khi rớt ngưỡng; trước lấp thiếu -35 khoá. Bài đã đạt ngưỡng trước khi lấp.

