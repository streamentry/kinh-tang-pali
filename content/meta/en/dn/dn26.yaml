  **Triangulation 8,0 — không được tuyên bố là đối chiếu English độc lập.** Scorecard của bản Việt `content/meta/sutta/dn/dn26.yaml` do cùng họ công cụ với lớp lấp này chấm/dịch (xem `source/tooling.yaml`; `assessed_by` của lớp lấp trùng họ), nên bản lấp **không** phải một cách đọc English độc lập với bản Việt. Đối chiếu có: Pāli root + Sujato đã ghim (355 khoá) + bản Việt canonical (355 khoá, dùng để đối chiếu nghĩa, không dịch vòng, không chép). Bản Việt có khối `summary:` ở MN/DN nên **không chạm vào**; không sửa metadata Việt.

  **technical_integrity 9,6.** Không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, giao cho người điều phối. Không đặt blocker.
