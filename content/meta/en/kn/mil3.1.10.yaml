notes: |-
  Phân loại 13 khoá: A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 1 · C (tự dịch từ Pāli) = 12 · D (trùng Pāli nhưng dịch khác) = 0. B (dựng lại từ lời có sẵn) = 0, vì không có tầng Anh nào để dựng. Các nhóm Pāli trùng: 1.6 = 3.4.

  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`); bản lấp là bản dịch độc lập của dự án, viết từ Pāli root một mình, dùng bản Việt canonical chỉ để kiểm nghĩa. Vì vậy mọi khoá Pāli đều “để trống” ở tầng Anh, và không có khuôn B (dựng lại từ lời Sujato). Tiền lệ thuật ngữ lấy từ các bài mil đã có lớp lấp (mil3.1.7, mil3.3.1, mil3.4.7, mil3.6.5…: “Great King”, “venerable sir”, “the Blessed One”, “lay follower”, “dispensation”, “Saṅgha”, “mendicants”) và từ bản Anh Sujato của các bài cùng họ (sn5.10, sn3.20, dn17, sn22.5…), chỉ làm tiền lệ chữ, không chép câu.

  Thuật ngữ: `sampasādana` → “clarifying” (nghĩa làm trong, theo ví dụ viên ngọc lọc nước, không dịch “confidence”); `sampakkhandana` → “leaping in” (cùng cách ở mil3.1.11); `acchaṁ vippasannaṁ anāvilaṁ` → “clear, serene, and unclouded” — dùng đúng một cụm ở 1.5, 2.4, 3.2, 3.3 để vế ví dụ và vế áp dụng khớp nhau; `udakappasādako maṇi` → “water-clearing jewel”; `yogāvacara` → “meditator”; `cakkavattī` → “wheel-turning king”; `nīvaraṇa` → “hindrances”.

  Bất định thật: `saṅkhasevālapaṇaka` (2.4, 3.1, 3.2) dịch “shells, moss, and algae” — `saṅkha` đứng đầu hợp từ có thể là vỏ ốc hay một loại bọt/rong khác; đọc theo nghĩa vật thể trôi trong nước đục; không đổi lập luận.

  2.2: Pāli `luḷitaṁ kalalībhūtaṁ` → “disturbed, and turned to mud”. Chỗ cố ý khác tiền lệ: chính tả “Nāgasena” có dấu (1.2).

  Khoá trống còn lại: bài có 20 khoá Pāli, đã lấp 13; 7 khoá còn trống đều dưới ngưỡng 40 ký tự (tiêu đề, câu ngắn, mục danh sách ngắn, kệ ngắn, colophon) nên không vào coverage và lát này không lấp; toàn bộ 13 khoá có nội dung (≥ 40 ký tự) đã có lời.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài này CÓ record (substantiveSegments 13, substantiveWithoutEnglish 13, coverage 0); sau khi `published` coverage của `kn/mil3.1.10` lên 13/13 = 1.0 (trước: 0/13 = 0.0), nên record thành thừa — để người điều phối sinh lại, bản lấp không chạm tệp đó. Độ nhạy: ngưỡng 0,80 cần ít nhất 11/13 khoá; còn dư 2 khoá.

  Triangulation 7.5: bài không có bản Anh độc lập nào để đối chiếu; bản Việt canonical của bài do họ công cụ khác làm, nhưng nó và bản lấp cùng đọc một Pāli và không có bản Anh nào đứng giữa, nên bản lấp này KHÔNG phải cách đọc English độc lập và KHÔNG được tuyên bố là đã đối chiếu bản Anh. Đối chiếu thực có: Pāli root và bản Việt canonical (chỉ để kiểm nghĩa).

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối.
