  harness: 0/124 khoá trong 12 bài của lát này có chữ trong tầng Anh đã ghim (mỗi bài đều
  `fillable == số khoá Pāli`). Vì vậy đây KHÔNG phải lấp chỗ trống quanh một bản Anh đã ghim, mà
  là **bản Anh của chính dự án, viết từ Pāli một mình**: không có tầng Anh nào độc lập để đối
  chiếu cú pháp, sắc thái hay cách dịch thuật ngữ. Bản Việt dự án của 12 bài này **chưa tồn
  tại** (`content/translation/vi/project/sutta/kn/<uid>*.json` — không có tệp nào trong 12 uid),
  và bản Việt hiện hành tại commit đã ghim chỉ có Pháp Cú, nên cũng không có tầng Việt nào để đối
  chiếu. Cùng lý do, `save_fill` KHÔNG in cảnh báo "Pāli trùng" cho một khoá nào ở lát này (không
