  LUẬT 3 TỰ GIỮ (quan trọng nhất của lát này, và máy KHÔNG bắt được):
  1. `Bhagavatoupasampadāpañha` ở colophon 3.1 dùng lại đúng tiêu đề 0.3, vì Pāli lặp lại tên
     bài. Cả hai đều dùng "The Question on the Ordination of the Buddha" — xem mục 0 TIỀN LỆ.
  2. `upasampadā` ở 1.2, 1.3, 1.4, 1.5 dùng lại đúng "the ordination" ở cả bốn chỗ, kể cả ở 1.5
     khi Pāli nói "không có ai khác cho ngài nghi phép" — không đổi sang "attainment" ở chỗ đó.
  3. `natthi … aññehi dinnā` (1.5) → "no ordination given by others", giữ đúng phủ định và chủ thể;
     không nới thành "the Buddha alone was ordained".
  4. `mahārāja` ở 1.3 và 1.5 → "Great King" y hệt.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO:
  - Tệp TÊN của SuttaCentral (mil-name:75.mil3.6.5) đặt tiêu đề là "The Question on the
     Buddha’s Ordination". Tôi dùng "The Question on the Ordination of the Buddha" thay vì giữ
     nguyên, vì khoá 0.3 và 3.1 không có bất kỳ ngoặc nào trong Pāli mà chốt của lớp lấp ĐẾM `’`
     như một ngoặc đóng; giữ "Buddha’s" sẽ làm chốt báo lệch. Đây là hệ quả trực tiếp của luật 4,
     ghi ra đây thay vì lách chốt bằng dấu nháy thẳng `’` cho khác.
  - `bodhirukkhamūla` → "the foot of the awakening tree": 0 tiền lệ cho cụm này ("awakening tree"
     0 lượt). Chọn vì `bodhirukkha` là "cây thức tỉnh" và `mūla` là "gốc/chân"; "foot of the
     awakening tree" giữ cả hai và tránh cả "awakening" (1072 lượt) lẫn "Bodhi tree" (0). Đây là
     đặt mới.
  - `sabbaññutañāṇena` → "full omniscient knowledge": `omniscience` 10 lượt trong tầng đã ghim,
     `omniscient` 0 lượt; ghép "full" để giữ `saha …` (không phải "cùng với một vị" mà là "với
     đầy đủ"). Sáng tạo có chủ đích, ghi rõ.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU:
  - 1.5 `yathā sāvakānaṁ, mahārāja, bhagavā sikkhāpadaṁ paññapeti yāvajīvaṁ anatikkamanīyan`:
     tôi nối bằng dấu chấm phẩy ("…given by others; just as, Great King, he teaches…") vì `yathā`
     ở đây so sánh, không phải bổ sung. Có thể đọc khác là `yathā … sāvakānaṁ` = "y như với các
     đệ tử", khi đó câu còn trôi hơn; vì không có bản Anh nào để so, tôi hạ grammar_logic và ghi ở
     đây.CỔNG KỸ THUẬT: đã chạy và PASS — `save_fill` (khẳng định cả 5 luật cơ học cho từng khoá: chỉ
