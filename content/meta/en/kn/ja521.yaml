notes: |-
  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`): tầng Anh Sujato không có tệp cho bài, mọi khoá Pāli đều để trống ở tầng đó. Bản lấp là bản dịch độc lập của dự án, viết từ Pāli root, không phải lấp chỗ trống quanh một bản Anh đã ghim.

  PHÂN LOẠI KHOÁ (bốn số): tổng khoá cần dịch 1 · A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 0 · C (tự dịch từ Pāli) = 1 · D (trùng Pāli nhưng buộc dịch khác) = 0.

  BÀI: Tesakuṇajātaka (Cattālīsanipāta), 203 khoá Pāli, chỉ `1.1` đạt ngưỡng 40 ký tự: câu lễ kính (Pāli không có nháy). Dịch theo công thức thuật ngữ của tầng: `Homage to that Blessed One, the Perfected One, the Fully Awakened Buddha` (giữ `that`, vì Pāli có `tassa`).
  BẤT ĐỊNH THẬT: không có.

  TRIANGULATION 7,5: không có bản Anh độc lập nào để đối chiếu, và bản Việt canonical của bài do cùng nhóm công cụ làm ra. Bản lấp này vì vậy KHÔNG phải cách đọc English độc lập, và bài này KHÔNG được tuyên bố là đã đối chiếu bản Anh. Bản Việt chỉ được dùng để kiểm nghĩa, không dịch vòng Việt → Anh.

  COVERAGE: mẫu số = 1 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); tầng Sujato phủ 0/1, `english-project` trước lượt này 0/1, nên trước = 0/1 = 0,00. Sau khi bài `published`: 1/1 = 1,00. Độ nhạy: ngưỡng 0,8 đòi tối thiểu 1/1 khoá; không được thiếu khoá nào. Mẫu số chỉ 1 khoá nên cổng coverage gần như không đo được gì về chất lượng tầng tham khảo của bài này; đó là quy tắc đo của kho, không phải bằng chứng rằng bài không cần tầng tham khảo. Mục của bài trong bản ghi gap hiện có (coverage 0); sau khi lấp và `published` mục đó thành thừa, việc sinh lại bản ghi thuộc người điều phối. 202 khoá còn lại của bài (203 khoá Pāli) để trống: đều dưới ngưỡng 40 ký tự (tiêu đề, dòng kệ ngắn, câu dẫn ngắn) nên không vào coverage và không được lấp ở lượt này.

