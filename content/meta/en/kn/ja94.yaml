notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI: không có tệp `english-sujato` cho `ja94` tại commit đã ghim
  (`sutajato()` = 0/9 khoá). Bản Anh của chính dự án, viết từ Pāli một mình; tầng Việt hiện
  hành ở commit đã ghim chỉ có Pháp Cú. Giới hạn thiết kế của lớp lấp, KHÔNG phải blocker.

  TIÊU ĐỀ: ja-name:105.ja94 = "Hair-raising" trong tệp tên đã ghim. 0.3 `Littavagga` →
  "A Smear of Poison" theo ja-name:101.ja-littavagga. ĐÂY LÀ MỘT SỬA CHÍNH THỨC: tầng đang
  lệch 9 tệp "A Smear of Poison" (đúng tệp tên) và 8 tệp "We Drank", mà "We Drank" là tên của
  `Apāyimhavagga` — MỘT phẩm KHÁC (ja-name:90.ja-apayimhavagga = "We Drank"), nên dùng nó cho
  Littavagga là gắn nhầm tên phẩm. Ja94 và ja98 của lát này nằm trong phe 9 tệp.

  CÓ MỘT BẢN ANH CÙNG CÔNG THỨC ĐÃ ĐỐI CHIẾU ĐƯỢC, VÀ NÓ SAI — nên Pāli phải thắng:
  mn12:50.7–50.10 có cùng bốn vế với cùng nhịp kệ. 1.1 `sosindo` ở đây là "cháy bừng/nóng
  rực", còn mn12 dùng `sosinno` (bị lạnh buốt), nên dịch "Scorched and burning as well,"
  chứ không theo bản mn12. 1.3–1.4 bản mn12 dịch sai nghĩa (`Naggo na caggimāsīno` thành "lõa
  thể, không có lửa sưởi"; `esanāpasuto` thành "vị ẩn sĩ vẫn tiếp tục tìm cầu" trong khi
  `pasuto` là ĐÃ DỪNG), nên dịch lại từ Pāli. Đây là lý do triangulation của bài này cao hơn
  vài bài Jātaka khác trong lát.

  CHỖ PHẢI LÀM NGƯỢC VỚI CHÍNH MÌNH, GHI LẠI ĐỂ KHÔNG AI "SỬA LẠI": tầng Việt đã mở dấu
  nháy kép ở 1.1 cho bài này (vì chỗ đó không có `“` trong Pāli) để câu cân ngoặc như mọi bài
  Jātaka khác. Chốt của lớp lấp đếm ngoặc mở/ngoặc đóng THEO TỪNG KHOÁ, và Pāli ở 1.1 có 0
  dấu mở, 1.4 mới có 1 dấu đóng. Vì vậy 1.1 ở đây cố tình KHÔNG mở nháy kép, và 1.4 đóng
  một mình. Ở đây chốt và Pāli thắng, không phải tiền lệ tầng.

  0 TIỀN LỆ, ĐẶT MỚI: `naggo` → "The noble one" (0 lượt riêng trong tầng lấp); `caggimāsīno`
  → "one who longs for dung" (0 tiền lệ; chữ "dung" giữ nghĩa chửi thật của Pāli chứ không
  làm nhẹ đi); `esanāpasuto` → "who has stopped seeking"; `munī` → "the sage" (tầng Việt giữ
  "hiền trí", tầng Anh đã dùng "sage" nhiều lần).

  CỔNG KỸ THUẬT: `save_fill` PASS 9/9 khoá; `rven88.py` không báo cờ nào. CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát bị lệnh cấm).
  `technical_integrity` 9.8; NGƯỜI ĐIỀU PHỐI phải chạy lại bốn lệnh đó.
  Triangulation 8.0 là trần của lớp lấp.
