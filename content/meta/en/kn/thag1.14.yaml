notes: |-
  Đoạn văn xuống (attribution) sau bài kệ. Trong chính bộ Theragāthā đã ghim, cùng khuôn này có ở `thag1.13:1.5`, `thag1.15:1.5`, `thag1.16:1.7` (`… <Tên> thero …. `) — và Sujato để trống CẢ BA, nên không có chữ Anh nào ở bất kỳ chỗ nào để đối chiếu cho khuôn này. Đó là 0 tiền lệ về hình thức, không phải về nghĩa.

  Pāli ở đây khác ba khuôn kia: nó là genitive `Vanavacchassa therassa (siviko) sāmaṇero` = “tập sự của Trưởng lão Vanavaccha (Sivaka)”, trong đó `(siviko)` là biến thể chú thích cho tên tập sự. Bản Việt canonical của chính khoá này — “… của Trưởng lão Vanavaccha (Sivaka), tập sự ….” — xác nhận cấu trúc đó, nên giữ đúng thứ tự: `sāmaṇero` ở cuối. Hai dấu lược và cặp ngoặc đơn giữ nguyên.

  Bất định đã ghi (vì vậy hạ `ambiguity_integrity` 8.8 và `terminology` 9.0): 1. `thera` dịch “senior monk” chứ không phải “elder”: đó là từ Sujato dùng 286 lần trong chính bộ thag đã ghim (“Senior” 265, “senior” 21) và KHÔNG dùng “elder” lần nào. Bản Việt canonical dùng “Trưởng lão”, nên hai lớp dùng khác từ — chọn theo bản Anh đã ghim để không lệch cột. 2. Tên tập sự viết “Sivaka” (không dấu) như tiêu đề 0.4 của chính bài này, chứ không phải “Sīvaka” như ở 1.2. Bản Anh đã ghim TỰ MÂU THUẪN ở chính bài này (0.4 dùng “Sivaka”, 1.2 dùng “Sīvaka”). Chọn hình thức của 0.4 vì `(siviko)` ở 1.7 là một dạng xưng hô ngôi thứ ba, giống tiêu đề, chứ không phải cách gọi trực tiếp như 1.2. 3. Cách đọc `(siviko)` là biến thể thay cho `sāmaṇero` (theo bản Việt canonical) chứ không phải cho `therassa`; hai cách đọc đều có thể, và vì bản Anh đã ghim không dịch khuôn này ở đâu nên không có cách nào kiểm lại bằng tiền lệ Anh.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
