notes: |-
  **Phân loại 71 khoá (bài này không có bản Anh upstream ở snapshot đã ghim, `noEnglishEditionUpstream`; bản lấp là bản dịch độc lập của dự án): A = 6 · B = 0 · C = 65 · D = 0.** A là khoá có Pāli trùng nguyên văn với một khoá đã dịch, dùng lại nguyên văn lời đã dịch: 2 khoá trùng trong chính bài, 4 khoá trùng với khoá của bài khác trong cùng đợt (bốn bài `cnd14`–`cnd17`): `7.3` (= `cnd14:28.3`), `11.2` (= `8.2`), `18.7` (= `cnd14:22.7`), `18.11` (= `cnd14:16.10`), `30.6` (= `18.7`), `34.2` (= `cnd14:33.2`). B = 0 vì không có Sujato để dựng lại từ lời đã ghim. D = 0: mọi cặp Pāli trùng nguyên văn trong đợt đều mang cùng một lời Anh. Phép dò chạy trên cả 344 khoá của bốn bài, không chỉ trên bài này.

  **Phạm vi.** Danh sách khoá của bài là 71 khoá Pāli có nội dung (đủ ngưỡng 40 ký tự theo `source/layers.yaml`, bỏ khối `0.x`) mà tầng Anh đã ghim để trống; lớp lấp ghi đủ 71/71, không khoá nào ngoài danh sách, cùng thứ tự Pāli. Còn 111 khoá không lấp, đều dưới ngưỡng 40 ký tự tính trên văn bản gốc kể cả thẻ in đậm (dài nhất 39 ký tự); ngược lại, một vài khoá lemma có thẻ in đậm đủ 40 ký tự kể cả thẻ nên nằm trong danh sách khoá dù chỉ dài dưới 40 sau khi bỏ thẻ: dòng kệ in đậm, dòng kệ nhắc lại trong ngoặc kép, câu dẫn `Tenāha …`, đoạn lemma ngắn, cụm `…pe…` đứng riêng và tiêu đề; chúng không vào coverage và để trống, không ghi thêm.

  **Phương pháp.** Dịch từ Pāli root (`cnd15` ở bản đã ghim), có đọc bản Việt canonical để kiểm nghĩa nhưng không dịch vòng Việt → Anh và không chép từ nó. Bài kệ gốc `snp5.12` (do Sujato dịch, đã ghim) và các bài cùng họ dùng làm tiền lệ thuật ngữ, không chép câu; lời giải ở Cūḷaniddesa là chú giải từng cụm nên lời Anh theo cấu trúc *Từ được giải: lời giải* của bản Việt, và vì Pāli không có dấu nháy ở các lemma ấy nên lời Anh cũng không dùng dấu nháy để đánh dấu lemma. Chữ Pāli giữ trong lời Anh ở 3 chỗ: `Iccā` (`5.2`) và `ādicca`/`sūriya` (`12.1`), vì lời giải nói về chính hình thức của từ; còn lại chỉ là tên riêng (Jatukaṇṇī).

  **Thuật ngữ dùng chung bốn bài `cnd14`–`cnd17` (tiền lệ từ bản Anh đã ghim của bài cùng họ, không chép câu):** `saṁsāra` transmigration; `pubbā`/`purimā koṭi` first point và `pacchimā koṭi` last point (như `sn15.1`); `anamataggo` no known beginning; `vaṭṭa` the cycle; `nibbāna` extinguishment; `amata` the deathless; `dīpa` island (`snp5.11`); `sabbe saṅkhārā` all conditions, nhưng `saṅkhāra` trong năm uẩn và `abhisaṅkhāra` là choices, còn `sabbasaṅkhārasamatho` là the stilling of all activities (như `an10.60`); chuỗi `ācikkhati deseti paññāpeti paṭṭhapeti vivarati vibhajati uttānīkaroti` = explains, teaches, asserts, establishes, clarifies, analyzes, discloses (như `sn12.20`, `sn14.13`), thêm `brūhi` = speak/declare và `pakāseti` = reveal (như `an10.99`); `ādikalyāṇaṁ … parisuddhaṁ brahmacariyaṁ` như `an10.99`; `upayupādānā cetaso adhiṭṭhānābhinivesānusayā` như `sn22.112`; `tālāvatthukata anabhāvaṅkata āyatiṁ anuppādadhamma` như `an3.34`; `nābhinandati nābhivadati na ajjhoseti` = does not approve, welcome, or cling (như `mn145`); `pajahati vinodeti byantīkaroti anabhāvaṁ gameti` = gives up, dispels, eliminates, obliterates (như `an3.101`); `khattiya brāhmaṇa vessa sudda` = aristocrats, brahmins, peasants, menials (như `mn63`, `mn93`); `satipaṭṭhāna sammappadhāna iddhipāda indriya bala bojjhaṅga ariyo aṭṭhaṅgiko maggo` theo cách `sn`/`an` đã dịch (kinds of mindfulness meditation, right efforts, bases of psychic power, faculties, powers, awakening factors, noble eightfold path); `vitakka` thought (`snp5.14`); `jhāna` absorption; `kukkucca` remorse; `thina` dullness; `maccudheyya` Death’s dominion (`an10.117`).

  **Chỗ cố ý lệch tiền lệ Sujato, kèm lý do:** (1) `rāga` là greed (như `sn22.112`) nên `gedha` không thể cũng là greed khi cả hai cùng xuất hiện trong lời giải của đợt này (`cnd15:30.7` liệt kê `-gedha-` rồi `-rāga-` thành hai chuỗi song song); `gedha` → avidity (Sujato `snp5.12` dịch `vītagedha` là rid of greed), `sārāga` → intense greed, `lobha` → avarice, `abhijjhā` → covetousness. (2) `kilesa` → corruptions và `āsava` → defilements (như `snp5.12:5.3`); `upakkilesa` → impurity (Sujato `an3.101` dịch corruptions, nhưng trong cùng bài `kilesa` đã giữ chữ ấy). (3) `kiñcana` → possession; Sujato dịch `sakiñcana` là with attachments (`ud2.5`) và `kiñcanaṁ` ở `snp5.12:3.5` là anything at all, nhưng lời giải ở đây liệt kê bảy loại `-kiñcana` (rāga, dosa, moha, māna, diṭṭhi, kilesa, duccarita) nên cần một danh từ giữ được cấu trúc "loại nào của sở hữu"; đây là cách đọc theo lời giải, không phải kết luận về nghĩa gốc. (4) `hāsapañña` → joyful (tiền lệ `an1.600-615` dịch laughing wisdom, nghe như một khả năng hài hước). (5) `ādāna` → taking up (Sujato `snp5.13:3.1` dịch attachments) vì lời giải `cnd16:17.3` giải thích chính động từ `ādiyanti`. (6) `anavaññattipaṭisaṁyutto vitakko` → thoughts connected with not being looked down on (Sujato `an3.101` dịch thoughts of status). (7) `vīra` → hero, `sahajanetta` → one with an innate eye (Sujato `snp5.12:1.4` dịch natural visionary): lời giải `cnd15:7.10` định nghĩa `netta` là con mắt trí toàn tri, nên giữ eye.

  **Bất định (không thêm vào lời Anh).**
  1. `4.9` `kāmakāmino rāgarāgino saññāsaññino` → those who desire desires, those who are greedy in their greed, those who are percipient in their perceptions: 0 tiền lệ cho `rāgarāgin` và `saññāsaññin`; dịch theo cấu tạo lặp của từ ghép, chưa chắc đây là nghĩa nhuốm theo hay đắm theo.
  2. `13.1` `chatukkapañño` → wretched wisdom: nghĩa gốc của `chatukka` chưa phân xử được; chọn theo vị trí trong chuỗi bốn tính từ chỉ trí kém (little, inferior, base, wretched).
  3. `13.2` `hāsapañña` → joyful (xem mục lệch tiền lệ).
  4. `7.10`, `7.11` `netta` → eye (cũng có thể là guide/leader); `jinabhāva` → the state of being a victor.
  5. `12.3` kết giữa câu (`sabbaṁ abhisaṅkhārasamudayaṁ …pe…`); bản Anh giữ đúng đoạn cắt ấy, `12.4` tiếp bằng các gerund; động từ chính nằm ở khoá `12.4`.
  6. `nijjhātattā` → burned out và `vigatattā` → removed (`27.2`), cùng bất định như `cnd14`.
  7. `19.2` `daṭṭhuṁ passitvā …` được đọc là phần bổ nghĩa cho `nibbānañca nibbānagāminiñca paṭipadaṁ`, tức *thấy* Niết-bàn và đạo như `khema` … `nibbāna`, rồi *quán xét*; không phải là một phần của danh sách thực hành.
  8. `kiñcana` → possession (xem mục lệch tiền lệ).

  **Dấu lược và nháy.** 12 khoá có `…` (mỗi `…pe…` của Pāli thành đúng một `…`, và số `…` trong từng khoá khớp Pāli); 1 khoá có ngoặc kép, khớp Pāli từng khoá (số nháy mở và đóng), 0 khoá có nháy đơn, 0 khoá lệch có chủ đích; dấu `’` trong lời Anh chỉ là sở hữu cách (Māra’s, brahmin’s, world’s) hoặc `’s`, không nháy đóng. Không khoá nào rỗng, không khoá nào thừa, NFC.

  **Triangulation 7.0:** không có bản Anh độc lập nào của bài này ở snapshot đã ghim, và bản Việt canonical (`content/meta/sutta/kn/cnd15.yaml`) cùng do nhóm công cụ hỗ trợ khai ở `source/tooling.yaml` làm, nên bản lấp này không phải cách đọc English độc lập và không được tuyên bố là đã đối chiếu bản Anh. Bản Anh của bài kệ gốc `snp5.12` là bản của bài khác, chỉ dùng làm tiền lệ thuật ngữ, không tính là đối chiếu.

  technical_integrity 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, không đặt blocker vì lý do ấy.

