notes: |-
  **Phân loại 27 khoá (đo bằng máy, theo Pāli của từng khoá so với khoá có lời Sujato trong cùng bài):
  A = 15 · B = 8 · C = 4 · D = 0.**

  **A (15 khoá) — dùng lại nguyên văn, kể cả khi lời đã ghim là diễn ý.** Bảy khoá `Santeke …` (4.1, 6.1,
  8.1, 10.1, 12.1, 14.1, 16.1) và 21.1 = 2.1 “There were some ascetics and brahmins who had this doctrine
  and view:”. Bảy khoá `Santi paneke …` (5.1, 7.1, …, 17.1) = 3.1 “Others held views such as the following,
  each regarding their own view as true and others as silly.” Lưu ý: lời 3.1 của tầng đã ghim **không bám
  Pāli của 3.1** — nó chuyển vế `idameva saccaṁ moghamaññan` (vốn ở mọi khoá `.2`) lên câu dẫn, rồi bỏ vế ấy ở
  các khoá `.2`. Luật A buộc lớp lấp dùng lại nguyên văn, nên câu này lặp bảy lần trước các kiến chẵn; ghi
  thẳng ở đây để người đọc biết đó là diễn ý của tầng đã ghim, không phải Pāli của khoá.

  **B (8 khoá).** 20.1 từ 1.3 (0,93), đổi sang lời tỳ-kheo trình bày ở thì hiện tại; 21.2 từ 2.2 (0,97),
  đổi nháy kép thành nháy đơn theo Pāli và giữ một `…` cho `…pe…`; 21.3 và 22.3 từ 18.1 (thì hiện tại, chữ
  thường đầu khoá ở 21.3 theo Pāli); 21.4/21.5, 22.4/22.5 từ 18.2/18.3, nháy đổi thành `‘…’”` theo Pāli.

  **C (4 khoá).** 19.3 “Seated to one side, those mendicants said to the Buddha:” — khuôn lớp lấp đã dùng ở
  `ud6.8`, `ud7.3`; tầng đã ghim gộp ý này vào 19.2 (“… and told him what was happening”). 22.1, 22.2 lấy
  nguyên lời Sujato ở bài song song `ud6.4:16.1–16.3` (Pāli gần trùng), để hai bài liền nhau đọc như nhau;
  22.3 cũng theo `ud6.4:16.3` nhưng giữ dấu `:` của Pāli. 24.5 `Pañcamaṁ.` → “Fifth.”

  **Ngoặc:** khớp Pāli 27/27. **Dấu lược:** Pāli 1, lớp lấp 1.

  Triangulation 8,6: scorecard Việt của `ud6.5` ghi `quality.assessed_by` là một công cụ **khác** alias
  của lớp lấp này, nên về mặt tác giả đây là lớp đọc Anh độc lập; vẫn dưới 9 vì không có bản Anh thứ hai.
  Đối chiếu có: Pāli root, Sujato đã ghim (bài này và `ud6.4`), bản Việt canonical (đủ khoá). Không chạm
  tầng Việt.

  technical_integrity 9,6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`
  trong lát này, nên không tuyên bố technical gate pass. Bốn lệnh còn lại cho người điều phối.

