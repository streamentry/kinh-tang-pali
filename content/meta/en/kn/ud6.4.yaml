notes: |-
  **Phân loại 18 khoá: A = 12 · B = 4 · C = 2 · D = 0.**

  - **A (12):** tám khoá dẫn `Santeke …` / `Santi paneke …` (`4.1`–`11.1`) lấy nguyên lời `2.1` / `3.1`;
    `15.1` = `2.1`; `15.4`, `16.4` = `31.4`; `15.5` = `31.5`.
    Cố ý **không** sửa: lời Sujato `3.1` (“Others held views such as the following, each regarding their own
    view as true and others as silly.”) đã đưa nghĩa của vế `idameva saccaṁ moghamaññan` (vốn ở `3.2`) vào
    khoá dẫn. Lớp lấp dùng lại **nguyên văn** ở `5.1`/`7.1`/`9.1`/`11.1` theo luật A, nên người đọc gặp câu ấy
    năm lần; đây là hệ quả của tầng đã ghim, không phải ý thêm của lớp lấp. Hạ `semantic_fidelity` 9.2.
  - **B (4):** `14.1` từ `1.3` (0,73, chuyển sang lời tường thuật hiện tại của các tỳ-kheo); `15.2` từ `2.2`
    (0,91, đổi nháy kép → đơn theo Pāli, thêm `…` cho `…pe…`); `15.3` từ `12.1` (chỉ khác chữ hoa);
    `16.5` từ `31.5` (Pāli không có `”`).
  - **C (2):** `13.3` (khuôn “Seated to one side … said to the Buddha:”) và nhãn `33.5` “Fourth.” (bài thứ tư
    của phẩm; khuôn nhãn thứ tự của lớp lấp).
  - Lệch sẽ hiện ra: tầng đã ghim ở `13.2` đã tóm lược (“and told him what was happening. The Buddha said:”),
    nên lời các tỳ-kheo `13.3`–`15.5` của bản lấp nằm sau câu tóm lược ấy; giữ vì Pāli có đủ.

