notes: |-
  6.2 và 6.3 là một bản lược: `…pe…` ở 6.2 nuốt mất phần giữa, nên 6.3 mở đầu bằng
  `idamavoca`. Chỉ một dấu lược trần ở 6.2, KHÔNG mở rộng.

  6.2 = `“imaṁ, bhikkhave, rattiṁ brahmā sahampati abhikkantāya rattiyā …pe…`.
  Khuôn mở đầu này đã ghim bốn lần, đều cho cùng một cách: sn2.20:7.2 ("Mendicants,
  tonight, a certain glorious godling, lighting up the entire Jeta’s Grove, came to
  me, …"), sn2.8:8.2, an6.69:2.2 ("Tonight, a glorious deity, …"), an4.46:1.2. Ở
  bốn khoá đó Sujato GỘP `imaṁ rattiṁ` với `abhikkantāya rattiyā` thành một "tonight".
  Ở đây không gộp được, vì phần bị lược BẮT ĐẦU SAU `abhikkantāya rattiyā` — nên cả
  hai vế đều phải còn. Dịch: "“This night, mendicants, the divinity Sahampati, after
  spending the night, …". `brahmā sahampati` chọn "the divinity Sahampati" (đếm 38
  lần) chứ không phải "glorious divinity Sahampati" (5 lần), và 5.4 của chính bài đã
  ghim là "the divinity Sahampati".

  BẤT ĐỊNH LỚN NHẤT TRONG LÁT NÀY, ghi rõ thay vì giấu: phần bị lược ở 6.2 không
  nhìn thấy, nên hình dạng câu ở 6.3 là DỰNG LẠI chứ không phải đọc được. Pāli ở
  6.3 là `idamavoca, bhikkhave, brahmā sahampati, idaṁ vatvā maṁ padakkhiṇaṁ
  katvā tatthevantaradhāyī` — dịch: "said this, mendicants, the divinity Sahampati,
  who, having said this, bowed and respectfully circled me, and vanished right
  there.”". `padakkhiṇaṁ katvā` lấy đúng cụm đã ghim "bowed and respectfully circled"
  (49 lần "bowed and respectfully circled the Buddha", 6 lần "…circled me"). Dấu
  ngoặc đóng ở 6.3 khớp Pāli `”ti.`, và cân với ngoặc mở ở 6.2.

  Vì 6.3 phải bắt đầu giữa chừng sau dấu lược, câu đọc hơi gượng — đó là hệ quả thật
  của một `…pe…` giữa danh sách, không phải lỗi dịch. `ambiguity_integrity` hạ 8.4 và
  `grammar_logic` 9.0 vì đúng lý do đó.

  Lớp lấp: 2 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
