  LUẬT 3 TỰ GIỮ (quan trọng nhất của lát này, và máy KHÔNG bắt được):
  TỚNG THỨC JĀTAKA: 0.1–0.4 (tiêu đề) + 1.1–1.6 (sáu nhịp của một câu kệ) + 2.1 (lời dẫn đóng
  `…jātakaṁ <thứ>ṁ.`). Giữ nguyên cấu trúc đó, không gộp, không thêm khoá nào.

  1. 0.1 `Jātaka` → "Stories of Past Lives 104" và 0.2 `Ekakanipāta` → "The Book of the Ones": tiền
     lệ đếm được trong tầng `kn` (`Jātaka` 83/83 tệp `ja*_translation-en-sujato.json`,
     `Ekakanipāta` 80/83).
  2. 0.3 `Parosatavagga` → "Over a Hundred": KHÔNG có khoá segment nào đã ghim cho vagga này
     (trong 83 tệp `ja*` đã ghim không có bài nào thuộc `Parosatavagga`), nên tôi lấy từ tệp TÊN
     của chính SuttaCentral tại commit đã ghim: ne… ja-name:112.ja-parosatavagga = "8. Over a
     Hundred", bỏ số thứ tự theo cùng tiền lệ. Cùng người dịch, cùng commit, nên đây là tiền lệ có
     bằng chứng chứ không phải phỏng đoán.
  3. 0.4 `4. Mittavindakajātaka` → "On Mittavindaka: a past life story" và colophon 2.1 →
     "On Mittavindaka: Fourth.": tên bài lấy từ ja-name:116.ja104 = "On Mittavindaka", theo đúng
     khuôn dùng ở 82/83 tệp `ja*` đã ghim ("<Tiêu đề>: a past life story", số thứ tự bị bỏ). Số
     thứ tự "Fourth." là vì Pāli `catutthaṁ` và tiền lệ `ja124:2.1` → "Fourth."
  4. `Icchāhatassa posassa` (1.5) và `cakkaṁ bhamati matthake` (1.6) — `posassa` (người) và `matthake`
     (trục xe) dùng mỗi từ đúng một lần, không có chỗ nào lặp Pāli để kiểm tra luật 3.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO:
  - `matthake` → "on its axle": "axle" 16 lượt trong tầng Anh đã ghim, "nave" 2 lượt, nên đếm cho
     "axle".
  - `atriccha` → "unmeasured": 0 tiền lệ; giữ vì nghĩa gốc là "không có giới hạn", và đó là điểm
     mà câu kệ đang nhấn.
  - `aṭṭhajjhagamā` → "having traveled eight": XEM MỤC BẤT ĐỊNH — đây là chỗ khó nhất của bài.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU:
  - `aṭṭhajjhagamā` (1.1), `aṭṭhāhi` (1.2), `soḷasāhi` (1.3) — Pāli CHỈ có con số (tám, mười
     sáu, ba mươi hai) mà KHÔNG có đơn vị đo. Tôi KHÔNG thêm "leagues"/"yojanas" vào bản kinh, vì đó
     là thông tin không có trong nguồn; nhưng tiếng Anh không có đơn vị thì câu trông vô nghĩa.
     Đây là lý do hạ semantic_fidelity và grammar_logic. Cách sửa khi có người biên tập: thêm
     "leagues" và ghi vào chú thích, hoặc thêm ngoặc vuông [leagues] theo quy ước chú giải.
  - `Catubbhi` (1.1) = "by four": chỉ có ở đây, không có "bốn cái gì" trong chính câu kệ này; câu
     đầy đủ của truyện nằm ngoài lát này. Tôi dịch sát ("By four") thay vì đoán "bốn loại tham",
     vì đoán là bịa.
  - `aṭṭhāhi` (1.2) đọc là "hoặc tám" (dạng thay thế của `aṭṭhā vā`) nên 1.1–1.3 thành dãy
     "tám, hoặc tám-mười sáu, mười sáu-hoặc-ba mươi hai". Dãy số này trông thừa ở bản Anh nhưng
     đó đúng là Pāli; nếu đọc khác thì phải sửa cả ba khoá cùng lúc, nên tôi ghi ra đây thay vì
     im lặng.CỔNG KỸ THUẬT: đã chạy và PASS — `save_fill` (khẳng định cả 5 luật cơ học cho từng khoá: chỉ
  điền khoá Pāli có chữ và bản ghim để trống; số dấu lược/ngoặc mở/ngoặc đóng/dấu hỏi khớp
  Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không khoảng trắng đôi),
  và `rven88.py` (0 cờ "từ Pāli lọt", 0 cờ "sót chữ tắt", 0 cỗ "ngoặc mở treo"). CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm chạy
  vì chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity` chấm 9.8 chứ
  không 10.0, và đây là việc NGƯỜI ĐIỀU PHỐI phải chạy lại trước khi coi bài là xuất bản — ghi
  thẳng ra đây thay vì để trong im lặng.Triangulation 8.0 là trần của lớp lấp, ghi ở đây để người biên tập không tưởng là thiếu sót riêng
  của bài.
