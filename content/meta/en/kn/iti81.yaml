notes: |-
  6.1 / 7.1 / 8.1 lặp lại ba câu đã mở bài ở 2.1 / 3.1 / 4.1, mỗi khoá có đúng
  một khoá đối chiếu trùng nguyên văn, nên lấy nguyên văn từng cặp theo luật 3:
  - 6.1 = 2.1 (`sattā sakkārena`): "I’ve seen, mendicants, sentient beings whose
    minds are overcome and overwhelmed by honor. …"
  - 7.1 = 3.1 (`sattā asakkārena`): "I’ve seen sentient beings … by not being
    honored. …"
  - 8.1 = 4.1 (`sattā sakkārena ca asakkārena ca tadubhayena`): "I’ve seen sentient
    beings … by both honor and by not being honored. …", thêm dấu ngoặc đóng vì Pāli
    kết bằng `”ti.`.
  Vế sau lấy nguyên văn: "When their body broke up, after death, they were reborn in
  a place of loss, a bad place, the underworld, hell." (đếm cụm này 172 lần trong bản
  đã ghim; không có cách nào khác).

  BẤT ĐỊNH ĐÃ THỪA NHẬN, và đây là điểm mà bài sẽ nghe hai giọng: bản đã ghim ở
  2.1 CÓ "I’ve seen, mendicants, sentient beings" còn 3.1 và 4.1 KHÔNG có "mendicants".
  Sujato tự lệch ở đây. Mỗi khoá lấp lấy theo đúng khoá trùng nguyên văn của nó,
  nên 6.1 giữ "mendicants" còn 7.1 / 8.1 không — và bài sẽ đọc "I've seen,
  mendicants," ở 6.1 rồi "I've seen sentient beings" ở 7.1. Sửa cho đều là sửa bản
  đã ghim, vi phạm luật 3. `vietnamese_clarity` hạ 9.0 vì lỗi này người đọc thấy
  được.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
