notes: |-
  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`): tầng Anh Sujato không có tệp cho bài, mọi khoá Pāli đều để trống ở tầng đó. Bản lấp là bản dịch độc lập của dự án, viết từ Pāli root, không phải lấp chỗ trống quanh một bản Anh đã ghim.

  PHÂN LOẠI KHOÁ (bốn số): tổng khoá cần dịch 1 · A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 0 · C (tự dịch từ Pāli) = 1 · D (trùng Pāli nhưng buộc dịch khác) = 0.

  BÀI: Venasākhajātaka (Pañcakanipāta), 27 khoá Pāli, chỉ `1.1` đạt ngưỡng 40 ký tự. `1.1` mở lời nhắc của vị thầy trong truyện, nháy `“` mở ở `1.1` và không đóng trong cùng khoá (đóng ở `2.6`). Bối cảnh (`1.2`–`1.4`): an ổn, lương thực dồi dào, thân thể an lạc rồi chớ mê muội khi tổn thất xảy đến.
  BẤT ĐỊNH THẬT: `Nayidaṁ niccaṁ bhavitabbaṁ` đọc `na` + `idaṁ niccaṁ bhavitabbaṁ`, tức `This won’t last forever`; cách đọc khác `this should not go on` (nghĩa gần nhưng nhẹ hơn). Chọn `won’t last forever` vì mạch kệ nói về tổn thất sẽ đến.

  TRIANGULATION 7,5: không có bản Anh độc lập nào để đối chiếu, và bản Việt canonical của bài do cùng nhóm công cụ làm ra. Bản lấp này vì vậy KHÔNG phải cách đọc English độc lập, và bài này KHÔNG được tuyên bố là đã đối chiếu bản Anh. Bản Việt chỉ được dùng để kiểm nghĩa, không dịch vòng Việt → Anh.

  COVERAGE: mẫu số = 1 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); tầng Sujato phủ 0/1, `english-project` trước lượt này 0/1, nên trước = 0/1 = 0,00. Sau khi bài `published`: 1/1 = 1,00. Độ nhạy: ngưỡng 0,8 đòi tối thiểu 1/1 khoá; không được thiếu khoá nào. Mẫu số chỉ 1 khoá nên cổng coverage gần như không đo được gì về chất lượng tầng tham khảo của bài này; đó là quy tắc đo của kho, không phải bằng chứng rằng bài không cần tầng tham khảo. Mục của bài trong bản ghi gap hiện có (coverage 0); sau khi lấp và `published` mục đó thành thừa, việc sinh lại bản ghi thuộc người điều phối. 26 khoá còn lại của bài (27 khoá Pāli) để trống: đều dưới ngưỡng 40 ký tự (tiêu đề, dòng kệ ngắn, câu dẫn ngắn) nên không vào coverage và không được lấp ở lượt này.

  Cổng kỹ thuật chưa chạy trong lượt này: còn nợ `npm run validate`, `npm test`, `npm run check`, `npm run build`; vì vậy `technical_integrity` đặt 9.6, không đặt blocker.
