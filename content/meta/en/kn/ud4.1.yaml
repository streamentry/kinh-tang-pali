notes: |-
  **Phân loại 16 khoá (đo bằng máy): A = 6 · B = 8 · C = 2 · D = 0.** A = Pāli trùng nguyên văn với khoá đã có lời
  trong cùng bài ⇒ dùng lại nguyên văn; B = dựng lại từ khoá gần trùng; C = tự dịch từ Pāli; D = Pāli trùng nhưng lời tầng
  đã ghim khác nhau (không có). Cả 16 khoá nằm trong tập khoá tầng Anh đã ghim để trống.

  **Nhóm 1 — Meghiya kể lại cho Đức Phật (4.1–4.7), dựng lại từ phần dẫn chuyện 2.1–2.6.** Tầng đã ghim gộp cả đoạn kể
  lại vào `3.1` (“and told him what had happened, adding,”) rồi để trống `3.2` và toàn bộ `4.1–4.7`. Lớp lấp dựng lại bằng
  chính từ của Sujato ở phần dẫn chuyện, chỉ đổi ngôi (he/Meghiya → I) và thêm vế Pāli đã bị nuốt (`bhante` → “Sir,”):
  · `4.1` ← `2.1` (0,56) · `4.2` ← `2.2` (0,90) · `4.3` ← `2.3` (0,79) · `4.4` ← `2.4` (0,40, câu ngắn)
  · `4.5` và `4.6` ← `2.5` (0,67 mỗi khoá): Pāli tách “Oh, this mango grove is lovely and delightful!” (`4.5`) khỏi
    “This is good enough for striving…” (`4.6`), còn tầng đã ghim gộp cả hai vào `2.5`; lớp lấp cắt đúng chỗ Pāli cắt.
  · `4.7` là A: Pāli trùng `2.6` (1,00), lấy nguyên lời “If the Buddha allows me, I’ll come back to this mango grove to
    meditate.”, chỉ đổi nháy đóng ” thành ’ cho khớp Pāli (`padhānāyā’ti`).

  **Nhóm 2 — `3.2` ← `6.1` (0,77).** “Sitting to one side, Venerable Meghiya said to the Buddha,” dựng theo “said to the
  Buddha,” của `6.1`. Tầng đã ghim đã nói “sat down to one side, and told him what had happened, adding,” ở `3.1`, nên
  người đọc sẽ thấy hơi lặp; đó là do tầng đã ghim gộp, Pāli vốn có hai câu.

  **Nhóm 3 — `10.2` ← `8.2` (0,74)** (“beset mostly by three kinds of bad, unskillful thoughts, namely,”): đổi ngôi
  (he → I) và thêm “Sir,” cho `bhante`. **A (6 khoá):** `10.3` ← `8.3`; `10.5` ← `9.2`; `10.6` ← `9.3`; `10.7` ← `9.4`;
  `10.8` ← `9.5`; (cộng `4.7` ở trên): Pāli trùng nguyên văn (1,00) nên lấy nguyên lời, kể cả dấu phẩy cuối `10.6`
  (nối vào `10.7`). **C (2 khoá):** `10.4` “Sir, it occurred to me,” (Pāli `Tassa mayhaṁ, bhante, etadahosi:` không có
  khoá song song) và `24.5` “First.” (nhãn thứ tự `Paṭhamaṁ.`; đúng vị trí: `ud4.2` mang `Dutiyaṁ.`).

  **Ngoặc kép — đo từng khoá.** Pāli `4.1` mở “ (không đóng), `4.5` mở ‘, `4.7` đóng ’, `4.8` đóng ” (khoá đã ghim); `10.2`
  mở “, `10.5` mở ‘, `10.8` đóng ’ rồi ”. Lớp lấp khớp Pāli từng khoá: `4.1` 1/0 kép, `4.5` 1 đơn mở, `4.7` 1 đơn đóng,
  `10.2` 1 kép mở, `10.5` 1 đơn mở, `10.8` ’” (đơn đóng + kép đóng). Khác bản ghim ở hai chỗ có lý do: `10.5` đổi
