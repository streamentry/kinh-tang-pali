notes: |-
  5.2 và 6.2 lặp lại đúng công thức `…bhikkhu evaṁbhūto ātāpī ottāpī satataṁ samitaṁ
  āraddhavīriyo pahitattoti vuccati` mà Sujato đã dịch ở 4.2 (đi lúc đi) và 7.2 (nằm khi
  thức), nên dùng lại nguyên lời: "keen and prudent, always energetic and resolute".

  Bất định thật sự, ghi ra đây: Pāli 5.2/6.2 KHÔNG có dấu `‘`, còn Sujato ở 4.2/7.2 thì có —
  chốt đếm ngoặc kép theo từng khoá nên bản lấp buộc phải bỏ cặp nháy kép, và thuật ngữ
  định nghĩa (`ātāpī ottāpī … pahitatto`) thành câu không nháy. Giữ lời đúng bằng cách
  sửa câu là ưu tiên cao hơn giữ dấu câu. Vế `-pi` (`Ṭhitopi`, `Nisinnopi`) Sujato ở 4.2
  cũng không dịch thành "and/also", nên ở đây bỏ nhất quán.

  Hai tiêu chí `vietnamese_clarity` và `han_viet_balance` mang giá trị mặc định của lớp lấp:
  bản lấp này không chứa văn xuôi tiếng Việt nào để chấm.
