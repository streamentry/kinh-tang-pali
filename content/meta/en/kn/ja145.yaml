notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI: không có tệp `english-sujato` cho `ja145` tại commit đã ghim
  (`sutajato()` = 0/9 khoá). Bản Anh của chính dự án, viết từ Pāli một mình; tầng Việt hiện
  hành ở commit đã ghim chỉ có Pháp Cú. Giới hạn thiết kế của lớp lấp, KHÔNG phải blocker.

  TIÊU ĐỀ: ja-name:161.ja145 = "The Tale of Rādha" trong tệp tên đã ghim; giữ dấu `Rādha` vì
  chốt `_lọt_pāli` cho phép (từ này có trong tầng Anh đã ghim của `kn`). Tệp JSON của bài này
  đã tồn tại từ một lượt chạy trước của lát với "About Radha" và không có metadata; đã ghi đè.
  0.3 `Kakaṇṭakavagga` dùng tên phẩm của tệp tên đã ghim — xét riêng trong ghi chú của ja141,
  cùng một mâu thuẫn tầng.

  BA BẤT ĐỊNH CHƯA PHÂN XỬ ĐƯỢC, VÌ VẬY ĐÂY LÀ BÀI ĐIỂM THẤP NHẤT CỦA LÁT:
  (1) `Abyayataṁ` (1.3) → "ceaselessly": 0 tiền lệ trong tầng. Tôi đọc là a + `vyaya` (không
  ngớt); cách đọc khác là "vô ích / hỏng". Không có bản Anh độc lập để phân xử.
  (2) `kosiyāyane` (1.4) → "the owl's roost": `kosiya` là cú, `āyana` là chỗ ở. Cách đọc khác
  là "nhà của người tên Kosiya". Tầng Việt cũng ghi là chưa phân xử được. LƯU Ý SỬA: bản nháp
  đầu của tôi (và bản đang nằm trong tệp từ lượt chạy trước) bỏ mất `kosiya`, chỉ còn "the
  nest"; đã sửa lại thành "the owl's roost" vì bỏ từ là mất nghĩa.
  (3) `virattā` (1.4) — chủ thể của vế này không nêu. Tôi dựng là "roost abandoned" (trạng
  thái bị bỏ rơi) thay vì chủ thể là người, vì cú pháp Pāli không xác định; đây là lý do
  `semantic_fidelity` hạ xuống 9.0.
  Vì ba bất định này chưa phân xử được, `ambiguity_integrity` ở 8.4 và `terminology` ở 9.0.

  CỔNG KỸ THUẬT: `save_fill` PASS 9/9 khoá; `rven88.py` không báo cờ nào. CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát bị lệnh cấm).
  `technical_integrity` 9.8; NGƯỜI ĐIỀU PHỐI phải chạy lại bốn lệnh đó.
  Triangulation 8.0 là trần của lớp lấp.
