notes: |-
  BẢN DỊCH LẤP 6 KHOÁ (4.1, 4.2, 4.4, 4.5, 4.6, 4.7), TẤT CẢ ĐỂ TRỐNG Ở TẦNG ĐÃ GHIM; không blockquote tham chiếu, không Pāli rỗng, không `…pe…`, nên không có khoá nào bị bỏ.

  LUẬT 3 — 4/6 KHOÁ CHÉP NGUYÊN VĂN BẢN ĐÃ GHIM TRONG BÀI (đối chiếu từng khoá với toàn bộ Pāli của ud5.1):
  - 4.2 = 1.5 (`atthi nu kho te, mallike, kocañño attanā piyataro`) → chép y nguyên “‘Mallikā, is there anyone more dear to you than yourself?’”
  - 4.4 = 2.1 (`Natthi kho me, mahārāja, kocañño attanā piyataro`) → “‘No, Great King, there isn’t.”
  - 4.5 = 2.2 (`Tuyhaṁ pana, mahārāja, atthañño koci attanā piyataro`) → “But is there anyone more dear to you than yourself?’”
  - 4.7 = 2.3 (`Mayhampi kho, mallike, natthañño koci attanā piyataro`) → “‘For me also, Mallikā, there’s no one.’”
  Dấu ngoặc kép đổi theo dấu của Pāli từng khoá (`“` ở mục 2, `‘` ở mục 4).

  2 KHOÁ MỚI:
  - 4.1 (`Idhāhaṁ, bhante, mallikāya deviyā saddhiṁ uparipāsādavaragato mallikaṁ deviṁ etadavocaṁ:`): dùng y hệt cụm 1.3 đã ghim — “upstairs in the royal longhouse together with Queen Mallikā”. Đếm `uparipāsādavaragato` trên toàn corpus Pāli đã ghim: **7** khoá, 2 để trống, 5 có bản dịch; trong 5 khoá đó có **3** dùng đúng “upstairs in the royal longhouse” (ud5.1:1.3, dn2:1.3, mn83:13.9) — đếm được, không bịa. `bhante` → “Sir” đúng như 1.5.
  - 4.6 (`Evaṁ vutte, ahaṁ, bhante, mallikaṁ deviṁ etadavocaṁ:`): đếm `Evaṁ vutte, ahaṁ, bhante` trong tầng Anh đã ghim cho **5** tiền lệ — mn66:6.24 “When she said this, I said to her, ”, an8.21:9.3 “When they say this I say to them: ”, mn32:12.1/13.1/14.1 ““Next I asked … the same question.” Lấy khuôn “When she said this, …”.

  BẤT ĐỊNH ĐÃ GHI — 4.6 GIỮ “sir”, LỆCH NĂM TIỀN LỆ KỂ TRÊN:
  Cả năm tiền lệ đều **bỏ** `bhante`. Ở đây giữ “sir” vì 4.6 là lời vua báo lại với Đức Thế Tôn, và nếu bỏ thì câu đọc thành như vua đang nói với hoàng hậu Mallikā, đảo ngược chủ thể. `grammar_logic` hạ 9.3 vì đây là chỗ cố ý lệch tiền lệ.

  LỆCH NGỮ PHÁP ĐÃ CÓ SẴN TRONG BẢN ĐÃ GHIM, GHI LẠI ĐỂ ĐỌC GIẢ BIẾT: Sujato dịch cùng một công trình cho hai tiền tố khác nhau — 1.3 `uparipāsādavaragato` → “upstairs in the **royal** longhouse”, còn 3.1 `pāsādā orohitvā` → “came downstairs from the **stilt** longhouse”. Lớp lấp bám 1.3 vì đó là khoá có cùng cụm Pāli (`uparipāsādavaragato`); `ambiguity_integrity` 9.2 vì người đọc bốn cột sẽ thấy hai cách gọi cùng một kiến trúc.

  Ngoài ra `ud5.1:4.3` (`Evaṁ vutte, mallikā devī maṁ etadavoca:`) và `6.5` (`Paṭhamaṁ.`) **cũng để trống** ở tầng đã ghim nhưng không nằm trong lát này: 4.3 dài 39 ký tự và 6.5 dài 11 ký tự, đều dưới ngưỡng Pāli có nội dung 40 ký tự khai ở `source/layers.yaml`, nên không tính coverage và không vào lát. Hệ quả người đọc sẽ thấy: 4.2 (câu hỏi của vua) → 4.3 rỗng → 4.4 (câu trả lời của Mallikā). Báo lại để coordinator cân nhắc.

  TRIANGULATION 8.0, KHÔNG CAO HƠN: lớp lấp do chính người chấm viết.

