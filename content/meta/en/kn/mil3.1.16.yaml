notes: |-
  Phân loại 6 khoá: A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 0 · C (tự dịch từ Pāli) = 6 · D (trùng Pāli nhưng dịch khác) = 0. B (dựng lại từ lời có sẵn) = 0, vì không có tầng Anh nào để dựng.

  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`); bản lấp là bản dịch độc lập của dự án, viết từ Pāli root một mình, dùng bản Việt canonical chỉ để kiểm nghĩa. Vì vậy mọi khoá Pāli đều “để trống” ở tầng Anh, và không có khuôn B (dựng lại từ lời Sujato). Tiền lệ thuật ngữ lấy từ các bài mil đã có lớp lấp (mil3.1.7, mil3.3.1, mil3.4.7, mil3.6.5…: “Great King”, “venerable sir”, “the Blessed One”, “lay follower”, “dispensation”, “Saṅgha”, “mendicants”) và từ bản Anh Sujato của các bài cùng họ (sn5.10, sn3.20, dn17, sn22.5…), chỉ làm tiền lệ chữ, không chép câu.

  Thuật ngữ: `nānā santā` → “though diverse”; `ekaṁ atthaṁ abhinipphādenti` → “accomplish a single purpose”; `kilese hananti` → “destroy the defilements”. 4.1 tên bài: `Nānādhammānaṁ ekakiccaabhinipphādanapañho` → “The Question on Diverse Qualities Accomplishing a Single Task: Sixteenth.” — `ekakicca` dịch “single task”, khác “single purpose” ở thân bài vì hợp từ tên bài dùng `kicca`, không phải `attha`; đây là chỗ cố ý không đồng nhất chữ vì Pāli dùng hai từ khác nhau.

  2.1 mở nháy kép, đóng ở 2.2 (khoá ngoài danh sách). Không có chỗ cố ý khác tiền lệ ngoài chính tả “Nāgasena” có dấu.

  Khoá trống còn lại: bài có 14 khoá Pāli, đã lấp 6; 8 khoá còn trống đều dưới ngưỡng 40 ký tự (tiêu đề, câu ngắn, mục danh sách ngắn, kệ ngắn, colophon) nên không vào coverage và lát này không lấp; toàn bộ 6 khoá có nội dung (≥ 40 ký tự) đã có lời.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài này CÓ record (substantiveSegments 6, substantiveWithoutEnglish 6, coverage 0); sau khi `published` coverage của `kn/mil3.1.16` lên 6/6 = 1.0 (trước: 0/6 = 0.0), nên record thành thừa — để người điều phối sinh lại, bản lấp không chạm tệp đó. Độ nhạy: ngưỡng 0,80 cần ít nhất 5/6 khoá; còn dư 1 khoá.

  Triangulation 7.5: bài không có bản Anh độc lập nào để đối chiếu; bản Việt canonical của bài do họ công cụ khác làm, nhưng nó và bản lấp cùng đọc một Pāli và không có bản Anh nào đứng giữa, nên bản lấp này KHÔNG phải cách đọc English độc lập và KHÔNG được tuyên bố là đã đối chiếu bản Anh. Đối chiếu thực có: Pāli root và bản Việt canonical (chỉ để kiểm nghĩa).

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối.
