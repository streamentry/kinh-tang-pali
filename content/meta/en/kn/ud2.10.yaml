notes: |-
  Ba khoá lặp lại đúng những câu đã ghim ở 1.3, 2.4, 2.5:
  - 3.2 lặp 1.3 → lấy nguyên văn phần sau tên: "even in the wilderness, at the
    foot of a tree, or in an empty dwelling, frequently expressed this heartfelt
    sentiment:".
  - 3.4 lặp 2.4 → lấy nguyên văn: "Without a doubt, Venerable Bhaddiya leads the
    spiritual life dissatisfied." (bỏ ngoặc mở vì Pāli 3.4 không có).
  - 3.5 lặp 2.5 → lấy nguyên văn: "It’s when recalling the pleasures of royalty he
    formerly enjoyed as a layperson that, even in the wilderness, at the foot of a
    tree, or in an empty dwelling, he frequently expresses this heartfelt sentiment:".
    3.5 chỉ khác 2.5 ở chữ `Y` đầu câu, nên chữ hoa đầu là hệ quả tất định.

  Cách xưng hô: Pāli 3.2 và 3.4 mở bằng `āyasmā, bhante,`. Khuôn này đã ghim 6 lần và
  luôn ra "Sir, Venerable X" — sn47.13:2.3 ("“Sir, Venerable Sāriputta has become
  fully quenched."), an6.56:1.3, an6.56:7.4, an5.159:1.6, ud3.6:1.5, mn73:28.3. Đếm
  `“Venerable, sir` trong bản đã ghim: 0 lần. Vì vậy 3.2 là "“Sir, Venerable Bhaddiya
  son of Kāḷīgodhā, …".

  BẤT ĐỊNH ĐÃ CHỌN, và cần nói vì bài sẽ lệch: 3.2 dùng dạng đầy đủ "Bhaddiya son
  of Kāḷīgodhā" (theo 1.3) còn 3.4 dùng dạng ngắn "Venerable Bhaddiya" (theo 2.4,
  vì 2.4 đã bỏ `kāḷīgodhāya putto`). Mỗi khoá bám khoá trùng nguyên văn của nó; hòa
  cả hai thành một dạng là sửa bản đã ghim. `grammar_logic` hạ 9.2 vì lệch này người
  đọc thấy được.

  3.2 mở ngoặc `“` mà khoá 3.3 (`‘aho sukhaṁ, aho sukhan’ti.`) không thuộc lát này
  nên trong bài sẽ thấy ngoặc mở chưa đóng. Đó là ranh giới lát, không phải lỗi.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
