notes: |-
  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`): tầng Anh Sujato không có tệp cho bài, mọi khoá Pāli đều để trống ở tầng đó. Bản lấp là bản dịch độc lập của dự án, viết từ Pāli root, không phải lấp chỗ trống quanh một bản Anh đã ghim.

  PHÂN LOẠI KHOÁ (bốn số): tổng khoá cần dịch 7 · A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 0 · C (tự dịch từ Pāli) = 7 · D (trùng Pāli nhưng buộc dịch khác) = 0.

  BÀI VÀ CÁCH ĐỌC. Đầu phần dẫn nhập của Milindapañha: câu lễ kính, đoạn tả thành Sāgala (`7.2`–`7.3`, hai khoá rất dài, mỗi khoá là một chuỗi tính từ ghép), và phần mục lục sáu phần của bộ sách (`8.1`–`9.2`). Các khoá ngắn (kệ mở đầu, tiêu đề) không lấp. `7.2` và `7.3` Pāli là một câu liệt kê không có chủ ngữ; bản Anh `7.2` dùng `There is a city …` (Pāli `atthi … nagaraṁ`) và `7.3` dùng `Its … are …` rồi chuỗi định ngữ để câu đọc được, không thêm nội dung.
  THUẬT NGỮ: `yonaka` = `Greeks`; `maṭṭālakoṭṭhaka` = `watchtowers and gatehouses`; `gopuratoraṇa` = `gates and archways`; `antepura` = `inner city`; `dānagga` = `almshall`; `himagiri` = `the Himalaya`; `kahāpaṇa` giữ phiên âm (tiền tệ); `khattiya, brāhmaṇa, vessa, sudda` = `aristocrats, brahmins, merchants, workers` (Sujato); `pañha` = `question` (số nhiều khi tên bộ phận). 1.1 dùng đúng dạng lễ kính của các bài khác trong tầng (`Homage to that Blessed One, the Perfected One, the Fully Awakened Buddha`).
  BẤT ĐỊNH THẬT: (1) `7.2` `nānāpuṭabhedanaṁ` = `where bales of goods of many kinds are opened` (nơi mở các kiện hàng, tức đầu mối buôn bán); cách đọc đúng nghĩa đen chưa phân xử. (2) `7.2` `sutavantanimmitaṁ` = `built by learned people`; `paccāmittānupapīḷitaṁ` = `not oppressed by hostile foes`. (3) `7.3` `vividhasamaṇabrāhmaṇasabhājanasaṅghaṭitaṁ` = `filled with the hospitality shown to ascetics and brahmins of many kinds` (`sabhājana` = tiếp đãi, kính trọng; cách đọc khác là `assemblies`); `kaṁsapattharaparipūraṁ` = `bronze and stone` (`patthara` không chắc); `siṅgāravāṇijagaṇānucaritaṁ` = `merchants of ornaments`; `āsīsanīya` = `desirable`. (4) `8.1` `tesaṁ` (`their`) chỉ hai nhân vật của phần kệ trước (vua Milinda và Nāgasena); bản Anh dịch `their` và không thêm chủ ngữ. (5) `8.3` `pubbayogo` = `the past practice`, và `opammakathāpañhaṁ` = `the questions by similes` (nghĩa đen `discussion of similes`). (6) `9.1`, `9.2` `yogikathāpañhaṁ` = `the questions on the account of the yogis`; `mahāvaggo` = `the Great Chapter`.
  CÁC CHỖ CỐ Ý KHÁC TIỀN LỆ: `7.3` `himagirisikharasaṅkāsa` dịch `peaks of the Himalaya` (không dịch `Snowy Mountains`); không có tiền lệ Anh cho đoạn tả Sāgala ở tầng đã ghim nên đây là cách dịch của dự án.
  DẤU LƯỢC VÀ NHÁY: Pāli của bảy khoá này không có `…`, `(…)` hay nháy; bản Anh cũng không có. TỰ KIỂM: tập khoá = `keys` (7/7); NFC; không khoá rỗng; A = 0 (khoá `1.1` trùng Pāli với khoá lễ kính của bài khác nhưng không trùng trong cùng bài; lời dịch giống `ja521:1.1`); D = 0.

  TRIANGULATION 7,0: không có bản Anh độc lập nào để đối chiếu, và bản Việt canonical của bài do cùng nhóm công cụ làm ra. Bản lấp này vì vậy KHÔNG phải cách đọc English độc lập, và bài này KHÔNG được tuyên bố là đã đối chiếu bản Anh. Bản Việt chỉ được dùng để kiểm nghĩa, không dịch vòng Việt → Anh.

  COVERAGE: mẫu số = 7 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); tầng Sujato phủ 0/7, `english-project` trước lượt này 0/7, nên trước = 0/7 = 0,00. Sau khi bài `published`: 7/7 = 1,00. Độ nhạy: ngưỡng 0,8 đòi tối thiểu 6/7 khoá; bỏ quá 1 khoá thì rớt ngưỡng. Mục của bài trong bản ghi gap hiện có (coverage 0); sau khi lấp và `published` mục đó thành thừa, việc sinh lại bản ghi thuộc người điều phối. 24 khoá còn lại của bài (31 khoá Pāli) để trống: đều dưới ngưỡng 40 ký tự (tiêu đề, dòng kệ ngắn, câu dẫn ngắn) nên không vào coverage và không được lấp ở lượt này.

  Cổng kỹ thuật chưa chạy trong lượt này: còn nợ `npm run validate`, `npm test`, `npm run check`, `npm run build`; vì vậy `technical_integrity` đặt 9.6, không đặt blocker.
