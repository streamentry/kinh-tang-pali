notes: |-
  KHÁC 12 BÀI `kn` KHÁC CỦA LÁT: bài này CÓ bản Anh Sujato đã ghim — đếm `files` của tầng
  `english-sujato` trong `source/upstream-manifest.json` có
  `sutta/kn/ud/vagga5/ud5.8_translation-en-sujato.json`, và `sutajato()` cho 16/21 khoá có
  chữ. Niềm tin ban đầu của lát là sai cho bài này. triangulation vẫn 8.0, nhưng lý do khác:
  5 khoá điền không có tầng Anh nào phủ; 16 khoá đã ghim là tiền lệ từ ngữ và bối cảnh.

  ĐÂY LÀ BẪN `sn11.24` THẬT SỰ, VÀ MÁY KHÔNG BẮT ĐƯỢC: 4.1–4.4 lặp lại đúng nội dung 2.1–2.3
  nhưng là lời Ānanda KỂ LẠI nên ngôi thứ nhất (`Idhāhaṁ` → `maṁ` → `ahaṁ`), và 2.3 đã ghim
  là câu kể ngôi thứ ba. Nếu dịch 4.4 bằng cách chép y nguyên 2.3 thì sẽ ra "I shall perform"
  trong khi người nói là Ānanda — đúng nghĩa, nhưng mất hoàn toàn vế giới từ mà chính bài
  đang dùng để dựng cảnh. Vì vậy 4.1–4.3 dịch lại ở ngôi thứ nhất ("Here, sir, I robed up…",
  "Devadatta, sir, saw ME", "On seeing ME, he approached ME") nhưng giữ NGUYÊN VĂN mọi danh từ
  mà bản ghim đã dùng: "Reverend Ānanda", "the sabbath", "legal proceedings of the Saṅgha",
  "apart from the Buddha and the Saṅgha of mendicants". 4.4 là lời Devadatta được trích lại
  nên nháy kép phải LỒNG (`‘…’` trong `“…”`), và đó cũng là điều Pāli yêu cầu: 4.4 mở bằng
  `‘` và đóng bằng `’ti`, trong khi 4.1 mở `“` và 4.5 (đã ghim) đóng `”ti`. Chốt đếm ngoặc
  theo từng khoá nên 4.1 có 1 mở 0 đóng, 4.4 có 1 mở 1 đóng — đúng bằng Pāli từng khoá.

  6.5 `Aṭṭhamaṁ.` → "Eighth." theo khuôn số thứ tự trần của lớp lấp (ud7.3:4.5 "Third.").
  Tệp tên đã ghim ud-name:53.ud5.8 để TRỐNG, nên không có tiêu đề để tra ở khoá này; 0.1 và
  0.2 không thuộc lát (đã có chữ trong bản ghim).

  CỔNG KỸ THUẬT: `save_fill` PASS 5/5 khoá; `rven88.py` không báo cờ nào. CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát bị lệnh cấm).
  `technical_integrity` 9.8; NGƯỜI ĐIỀU PHỐI phải chạy lại bốn lệnh đó.
  Triangulation 8.0 là trần của lớp lấp.
