notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI: không có tệp `english-sujato` cho `ja113` tại commit đã ghim
  (`sutajato()` = 0/9 khoá; đếm `files` của tầng đó trong `source/upstream-manifest.json`).
  Bản Anh của chính dự án, viết từ Pāli một mình; không có tầng Anh độc lập để đối chiếu,
  và tầng Việt hiện hành ở commit đã ghim chỉ có Pháp Cú. Giới hạn thiết kế của lớp lấp,
  KHÔNG phải blocker.

  TIÊU ĐỀ: ja-name:126.ja113 = "The Jackal" trong tệp tên đã ghim; tầng đã có sẵn "The
  Jackal" ở ja142:0.4 và ja148:0.4 cho cùng tên `Siṅgālajātaka`, nên 0.3 `Haṁcivagga` giữ
  "The Swan" (9 tệp; tệp tên đã ghim ja-name:123.ja-hamcivagga = "The Swan").

  0 TIỀN LỆ, ĐẶT MỚI:
  - `sippikā` (1.3) → "cowries": tầng đã có đúng một lượt "a hundred cowries", nên bám kho đó
    thay vì "shells". `sataṁ natthi` → "There are not even a hundred cowries," giữ phủ định.
  - `kaṁsasatā` (1.4) → "two hundred coins": `kaṁsa` là một loại tiền; tầng Việt đã ghi chú
    giải thích xác định nó với hai trăm `kahāpaṇa`, nên tôi dịch "coins" và KHÔNG thêm "gold"
    vì Pāli không nêu.
  - `kuto` (1.4) → "where would … come from": giữ dấu hỏi cảu nhãn, vì đây là lời chê của
    vị Bà-la-môn.

  BẤT ĐỊNH: `Saddahāsi` (1.1) đọc là "You trusted", theo chú giải `pattiyāyasi` mà tầng Việt
  đã ghi; cách đọc khác là "hãy tin". Chọn "trusted" vì câu kệ cả tiếng Anh đọc liền được và
  câu 1.2–1.4 là lời chê. Vì vậy `ambiguity_integrity` ở 8.8 chứ không cao hơn.

  CỔNG KỸ THUẬT: `save_fill` PASS 9/9 khoá; `rven88.py` không báo cờ nào. CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát bị lệnh cấm).
  `technical_integrity` 9.8; NGƯỜI ĐIỀU PHỐI phải chạy lại bốn lệnh đó.
  Triangulation 8.0 là trần của lớp lấp.
