notes: |-
  6.1 (Sujato) “Then several mendicants went up to the Buddha, bowed, sat down to one side, and told him what had happened.” → 6.2 là LỜI BÁO CỦA HỌ.

  Tiền lệ trong chính bài này, từng vế: 5.2 (Sujato) “Then the cowherd served and satisfied the mendicant Saṅgha headed by the Buddha with his own hands with a thick milk-rice and fresh ghee.” 5.5 (Sujato) “But soon after the Buddha had left, the cowherd was killed by a certain man in the gap between village perimeters.” 6.2 gộp đúng hai vế ấy — `santappito sampavārito` và `aññatarena purisena sīmantarikāya jīvitā voropito` — cộng thêm `ajja` = “today”. Bản Việt canonical của khoá này có cùng cấu trúc, nên hai vị ngữ tách bằng dấu chấm ở đây là đúng.

  Bất định đã ghi (hạ `terminology` 9.1 và `ambiguity_integrity` 9.0): `so kira` là 0 tiền lệ tuyệt đối — đây là khoá DUY NHẤT trong toàn kho đã ghim mang đúng cụm `so kira`, nên không có bản Anh nào để đối chiếu. Sujato dịch `kira` chủ yếu là “it seems”. Ở đây chọn “I hear” vì `kira` ở đây đánh dấu tin đồn: các tỳ-kheo không chứng kiến vụ giết, mà chỉ nghe nói, và cả bài đặt trọng tâm vào đúng cái khoảng khắc Ngài vừa rời đi thì người chăn bò chết. Bản Việt canonical cũng dùng “mà nghe nói”. Hạ `grammar_logic` 9.3 vì Pāli có `bhante` HAI lần (4.1 và 4.2) mà tiếng Anh đọc hơi nặng; giữ cả hai thì trung thành, bỏ một thì mất dấu hiệu định vị.

  `”ti` → `”`, cùng quy ước đã nêu ở sn55.8.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
