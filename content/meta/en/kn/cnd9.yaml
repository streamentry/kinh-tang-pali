notes: |-
  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`): tầng Anh Sujato không có tệp cho bài, mọi khoá Pāli đều để trống ở tầng đó. Bản lấp là bản dịch độc lập của dự án, viết từ Pāli root, không phải lấp chỗ trống quanh một bản Anh đã ghim.

  PHÂN LOẠI KHOÁ (bốn số): tổng khoá cần dịch 122 · A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 16 · C (tự dịch từ Pāli) = 106 · D (trùng Pāli nhưng buộc dịch khác) = 0.

  BÀI VÀ CÁCH ĐỌC. Đây là phần Cūḷaniddesa chú giải bài kệ Câu hỏi của thanh niên Dhotaka (Pārāyana). Cấu trúc: dẫn từng đoạn kệ (in đậm trong Pāli), giải từng cụm theo lối `Từ được giải: lời giải`, rồi nhắc lại đoạn kệ trong ngoặc kép. Các thẻ in đậm của Pāli không được đưa vào bản Anh. Pāli không dùng dấu hai chấm ở ranh giới lemma/lời giải, nên bản Anh dùng dấu hai chấm theo lối của các bài Niddesa liền kề trong cùng đợt (cnd7, cnd20, cnd21); các dấu `—` cuối khoá giữ đúng khoá Pāli có `—`.
  THUẬT NGỮ (đo trước khi dịch). Các dòng kệ lấy tiền lệ thuật ngữ từ bản Anh Sujato của kệ gốc (snp5.6): Blessed One, great seer, All-seer, Sakyan, indecisions, flood, mindfully, extinguishment; câu chữ được dịch lại từ Pāli, không chép. Chuỗi từ đồng nghĩa và công thức theo các bài Niddesa liền kề trong cùng đợt: `a term of respect … a designation arising from realization, namely, Blessed One`; `cut off at the root, made like a palm stump, obliterated, unable to arise in the future`; `tell, explain, teach, proclaim, establish, disclose, analyze, make plain, and reveal`; `whatever is lust, passion … covetousness, greed, an unskillful root`; `anger … acrimony … disdain … contempt … jealousy … stinginess … deceit … deviousness … obstinacy … aggression … conceit … arrogance … vanity … negligence`; `one-constituent / four-constituent / five-constituent existence`; `mindfulness meditation` (satipaṭṭhāna); `right efforts`, `bases of psychic power`, `awakening factors`; `the great aggregate of ethics`; `Sir` cho `bhante`. Tiền lệ Sujato ngoài kệ: `the stilling of all activities, the letting go of all attachments, the ending of craving, fading away, cessation, extinguishment`; `substantialist view`, `misapprehension of precepts and observances`; `barred out` cho `bāhita` (an7.87); `independent Buddha`; `aristocrat, brahmin, merchant, worker`; `specific conditionality`. Phân biệt có chủ ý: `saṅkhārā` = activities (`sabbe saṅkhārā aniccā`) nhưng `abhisaṅkhārā` = choices (`all unskillful choices`); `rāga` = lust trong chuỗi `rāgo sārāgo` nhưng = greed trong bộ ba `rāga, dosa, moha` (6.5, 13.5, 43.1); `kathaṅkathā` = indecision còn `vicikicchā` = doubt, `kaṅkhā` = doubt.
  BẤT ĐỊNH THẬT (không bịa, không phân xử được): (1) `23.2`–`23.7` chơi chữ `sakko` (người Sakya / có khả năng / giàu có): tiếng Anh không mang được; dịch nhất quán là `Sakyan` cho cả ba nghĩa, cách này bám cấu trúc Pāli chứ không tuyên bố cả ba là nghĩa từ nguyên đúng; cách đọc khác là `able` cho hai nghĩa sau. (2) `23.10` chuỗi đồng nghĩa của nghi: `āsappanā`, `parisappanā` (`groping`, `groping around`), `anekaṁsaggāho` (`taking sides without certainty`), `chambhitattaṁ cittassa` (`the trembling of the mind`), `manovilekho` (`mental scratching`) chưa phân xử được sắc thái. (3) `32.1` `sakhilaṁ` = `with rigidity` (khila = cứng/hoang), cách đọc khác là `with barrenness`. (4) `45.2`–`45.3` `diṭṭhe dhamme` dịch `in the seen teaching` trong lời giải, trong khi kệ (snp5.6) được Sujato dịch `apparent in the present`; hai cách đọc cùng một cụm Pāli, giữ cả hai ở đúng chỗ. (5) `40.2`/`40.4` `santo` chơi chữ: `being` (từ `atthi`) ở 40.2, `peaceful` ở 40.4. (6) `47.1`/`47.3` `visattikā` = clinging; chơi chữ `visaṭā vitthatā` (`diffused and spread out`) không giữ được trong tiếng Anh. (7) `59.4` chuỗi `bhavābhavāya … kammabhavāya punabbhavāya kāmabhavāya, …`: dịch đúng dạng liệt kê các danh từ cách `-āya`, `kamma-existence` giữ như thuật ngữ; cách ghép từng cặp cõi–tái hữu không phân xử được. (8) `26.6` `moceyyuṁ` đọc `they would be freed` (họ tự được giải thoát), đối ứng `31.6`; cách đọc `they would free (others)` không hợp mạch lập luận nhưng không loại trừ tuyệt đối. (9) `40.10` `vimariyādikatena cetasā` = `a mind free of limits`, `anajjhosito` = `not fixated`: hình thái hiếm. (10) `16.13` `gaṇigaṇī`, `sīhasīho`, `nāganāgo`, `munimunī`, `rājarājā` = `X of Xs`; `nāga` = `elephant`. (11) `20.3` `anvatthapaṭipatti` = `practicing in line with the meaning`. (12) `11.2` `ādāya` = `adoption`, `pāvacana` = `doctrine`, `attabhāva` = `individual existence`. (13) `6.5`/`13.5` Pāli `attano` nên dịch `one’s own`, trong khi lemma là lời Dhotaka nên mở bằng `my own extinguishment`.
  CÁC CHỖ CỐ Ý KHÁC TIỀN LỆ: không có chỗ nào cố ý lệch tiền lệ Sujato ở kệ; `4.1`/`50.2` dịch `vācā`/`vacana` là `words`/`word` thay vì `voice` của snp5.6, vì lời giải liệt kê `vacanaṁ byappathaṁ desanaṁ …` là lời nói chứ không phải giọng; `nigghosa` dịch `message` theo snp5.6. `61.2` dùng `Sir` cho `bhante` (lời nói với Đức Thế Tôn).
  DẤU LƯỢC. Đo từng khoá: số `…` của bản Anh bằng số của Pāli (`…pe…` = một dấu); 30 khoá có dấu lược. Không có chỗ lược nào được mở rộng. Nháy kép `“”` khớp Pāli từng khoá (8 khoá có nháy: `27.2` mở, `27.3` đóng, `31.2` mở, `46.2`, `46.5`, `52.2`, `52.3`, `52.4`); Pāli không có nháy đơn.
  TỰ KIỂM: tập khoá = tập `keys` của bài (122/122); không khoá nào ngoài danh sách; NFC; không khoá rỗng; 16 khoá A có lời giống từng chữ với khoá trước (trừ dấu cuối khoá); D = 0; chữ Pāli lọt vào lời Anh chỉ còn tên riêng (Dhotaka, Cunda, Sakyan…).

  TRIANGULATION 7,0: không có bản Anh độc lập nào để đối chiếu, và bản Việt canonical của bài do cùng nhóm công cụ làm ra. Bản lấp này vì vậy KHÔNG phải cách đọc English độc lập, và bài này KHÔNG được tuyên bố là đã đối chiếu bản Anh. Bản Việt chỉ được dùng để kiểm nghĩa, không dịch vòng Việt → Anh.

  COVERAGE: mẫu số = 122 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); tầng Sujato phủ 0/122, `english-project` trước lượt này 0/122, nên trước = 0/122 = 0,00. Sau khi bài `published`: 122/122 = 1,00. Độ nhạy: ngưỡng 0,8 đòi tối thiểu 98/122 khoá; bỏ quá 24 khoá thì rớt ngưỡng. Mục của bài trong bản ghi gap hiện có (coverage 0); sau khi lấp và `published` mục đó thành thừa, việc sinh lại bản ghi thuộc người điều phối. 242 khoá còn lại của bài (364 khoá Pāli) để trống: đều dưới ngưỡng 40 ký tự (tiêu đề, dòng kệ ngắn, câu dẫn ngắn) nên không vào coverage và không được lấp ở lượt này.

