notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI, KHÔNG PHẢI VÀI KHOÁ: tại commit đã ghim SuttaCentral KHÔNG xuất bản
  bản Anh nào cho bài này — đo bằng `upstreamPublishes('english-sujato', 'kn/<uid>')` trên
  `source/upstream-manifest.json`, và kiểm lại bằng cách dò trực tiếp
  `.cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/` (83 tệp có mặt, trong đó có
  `ja126` nhưng không có bài này). Vì vậy đây KHÔNG phải lấp chỗ trống quanh một bản Anh đã ghim, mà
  là **bản Anh của chính dự án, viết từ Pāli một mình**: không có tầng Anh nào độc lập để đối chiếu
  cú pháp và sắc thái. Bản Việt dự án đã dịch đủ 9/9 khoá nhưng KHÔNG phải tầng Anh, và lại cùng do
  một agent chấm, nên không thay được tầng đối chiếu. Cùng lý do, `save_fill` không in cảnh báo
  "Pāli trùng" cho khoá nào ở lát này — không có chỗ nào đã có bản ghim để so — nên luật 3 của lớp
  phải tự giữ bằng mắt (xem các ghi chú tiền lệ bên dưới).

  TỚNG THỨC: mỗi bài có 0.1–0.4 (tiêu đề) + 1.1–1.4 (một câu kệ bốn nhịp) + 2.1
  (lời dẫn đóng `…jātakaṁ <thứ>ṁ.`); giữ nguyên cấu trúc đó, không gộp, không thêm
  một khoá truyện nào.

  TIỀN LỆ ĐẾM ĐƯỢC, dùng chung cho cả lát (đếm trong tầng `kn` của bản Anh đã ghim):
  `Jātaka` → "Stories of Past Lives N " 83/83 tệp `ja*_translation-en-sujato.json`;
  `Ekakanipāta` → "The Book of the Ones " 80/83; `N. Xjātaka` → "<Tiêu đề>: a past
  life story " 82/83 (số thứ tự bị bỏ, giữ đuôi câu); khoá 2.1 (lời dẫn đóng
  `…jātakaṁ <thứ>ṁ.`) bị Sujato ĐỂ TRỐNG ở 79/83 tệp — nên đây đúng là những khoá
  phải lấp. Còn tên phẩm
  và tên bài thì lấy từ tệp TÊN của chính SuttaCentral tại commit đã ghim,
  `name/sutta/ja-name_translation-en-sujato.json` — cùng một người dịch, cùng một
  commit, nên đây là tiền lệ có bằng chứng chứ không phải phỏng đoán.

  TIỀN LỆ ĐẾM ĐƯỢC riêng cho bài này: tên bài theo `ja-name:138.ja124` =
  "Mangoes ". `amba` → "mangoes" (129 lượt trong tầng). `vāyāma` → "effort" (774 lượt)
  thay vì "exertion" (113 lượt). `phala` → "fruit" (giữ hình ảnh quả, không rút thành
  "kết quả"). `eva` nhấn mạnh ở 1.1 dịch bằng "simply", không thành một từ riêng.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO: `anītihan` — 0 lượt trong tầng. Đọc là
  `anīti` + `han` = "không gây hại", dịch "do no harm". Bản Việt dự án dịch
  "không gặp tai ương" cũng từ cùng một cấu tạo (a + īti = tai ương); hai tầng
  độc lập nên cùng một chân nhưng khác chữ.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU: `anītihan` là từ hiếm và hình thái cuối `han`
  (có thể là `hana`) không chắc chắn; cũng có thể là "không mang lại tai ương"
  chứ không phải "không gây hại" — hai cách gần như trùng nghĩa ở đây nhưng không
  đồng nhất. Vì vậy `ambiguity_integrity` hạ điểm và ghi ở đây.

  CỐ Ý KHÔNG THÊM: Pāli chỉ nói quả đã được ăn (`bhuttā ambā`), không nói ai ăn,
  không nói ăn ở đâu, không nói vì sao. Bản Việt dự án cũng vậy. Không suy thêm câu
  chuyện cây xoài.

  Triangulation 8.0: xem lý do ở đầu notes.
