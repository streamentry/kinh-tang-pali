notes: |-
  **Bài này không có bản Anh upstream ở snapshot đã ghim** (`noEnglishEditionUpstream`: tầng `english-sujato` không phát hành tệp nào cho `mil`, xem `source/upstream-manifest.json`). Vì vậy cả 13 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) đều nằm trong `fillableSegments`, và bản lấp này là **bản dịch độc lập của dự án**, viết từ Pāli root; bản Việt canonical chỉ dùng để kiểm nghĩa, không dịch vòng qua nó. Không có bản Anh để đối chiếu, nên bản lấp **không** phải cách đọc English độc lập và **không** được tuyên bố là đã đối chiếu bản Anh.

  **Phân loại 13 khoá (đo bằng máy): A = 0 · B = 0 · C = 13 · D = 0.** B (dựng lại từ lời đã ghim) bằng 0 vì không có lời đã ghim nào để dựng lại. A = 0: không có cặp Pāli trùng nguyên văn trong các khoá đã lấp.

  **Khoá trống còn lại: 4 (trên tổng 17 khoá không tính `:0`).** Tất cả đều dưới ngưỡng 40 ký tự (dài nhất 29): tiêu đề, câu nối, lời đáp ngắn, colophon — không vào coverage nên không lấp; đã đo: không còn khoá nào ≥ 40 ký tự chưa lấp.

  **Thuật ngữ và bất định.**

  - `attha` ở 2.3 và 3.2 đa nghĩa (mục đích · lợi ích · ý nghĩa). Tôi chọn “goal” (`atthika` → “concerned with the goal”) để khớp với `paramattha` → “ultimate goal” ở cùng đoạn; bản Việt đọc là “lợi ích chánh pháp”. Đây là bất định có thật ở 2.3, ghi lại chứ không giấu; không phải blocker vì cả đoạn hỏi–đáp vẫn đọc nhất quán theo nghĩa “goal”.

  - 4.2: `rājābhinītā`, `corābhinītā` dịch theo tiền lệ Sujato ở mn68:5.4 và iti91:2.4 (“a summons by a king … a summons for a bandit”) thành “to escape a summons by the king … a summons for a bandit”; Pāli ở đây không có `bhayaṭṭā` như hai bài kia. Câu mở `Na hi, mahārāja, keci etadatthāya pabbajanti, keci …` còn có thể đọc là “some do not go forth for this purpose”; tôi đọc “some go forth for this purpose; some … ” vì câu chốt liền sau (“those who go forth rightly go forth for this purpose”) chỉ nhất quán với cách đọc này. Bất định có thật, đã ghi.

  - 3.4 `kinti … uppajjeyyāti` là một mệnh đề mục đích liền mạch, trong Pāli không có nháy; bản lấp dịch “The purpose is that …” chứ không thêm nháy. `samaṇā sakyaputtiyā` (5.2) → “ascetics who follow the Sakyan” (dn27:9.2); `anupādā parinibbānaṁ` (3.5) → “final extinguishment through not grasping” (Sujato dịch `upādāna` là “grasping”).

  **Thuật ngữ chung của loạt Milindapañha** (nhất quán với các bản lấp `mil` đã có): `mahārāja` → “Great King” (tiền lệ Sujato: 198 lượt, ở `kn` 6), `bhante` đứng riêng → “venerable sir”, `bhante nāgasena` → “Venerable Nāgasena”. Điểm này **cố ý lệch** các bản lấp `mil` đã có (dùng “Sir Nagasena” / “venerable Nagasena” không dấu): quy ước của loạt này là tên riêng giữ dạng Pāli có dấu và “Venerable” theo Sujato. `Kallosi` ở cuối bài là khoá ngắn nên không lấp ở đây.

  **Nháy và dấu lược (đo từng khoá):** số nháy kép mở/đóng và nháy đơn mở/đóng của 13/13 khoá khớp Pāli (dấu `’` có chữ thường đứng ngay sau được loại ra như dấu nhạt lược), không có ngoại lệ lệch. Dấu lược `…`: Pāli 0 (tính `…pe…` là một), bản lấp 0. Không thêm khoá ngoài danh sách; không khoá rỗng; NFC.

  **Triangulation 7.5 (trần của lớp lấp).** Tầng Anh đã ghim không có bài này và bản Việt canonical của bài do cùng nhóm công cụ hỗ trợ của dự án làm ra (xem `source/tooling.yaml`), nên không có cách đọc English hay tiếng Việt độc lập nào để đối chiếu cú pháp và sắc thái. Bản Việt chỉ giúp phát hiện chỗ hiểu sai, và đã được dùng như vậy (những chỗ bản lấp lệch bản Việt, nếu có, đã nêu ở mục thuật ngữ và bất định). Đây là giới hạn của bản lấp, không phải thiếu sót riêng của bài.

  **Coverage (đo theo `src/lib/canon/reference.ts`, mẫu số là khoá Pāli ≥ 40 ký tự bỏ `:0` = 13).** Trước: 0/13 = 0,0000 (Sujato không phát hành, chưa có lớp lấp). Sau, khi `published`: 13/13 = 1,0000. Độ nhạy: ngưỡng 0,8 đòi tối thiểu 11/13 khoá có lời; bài chịu được mất tối đa 2 khoá mà vẫn qua ngưỡng; nếu `status` không phải `published` thì lớp lấp tồn tại mà coverage vẫn 0.

  **Hệ quả với `content/meta/reference-gaps.yaml`:** bài có record (`kn/mil3.1.5`, 13/13 khoá không có English, coverage 0). Sau khi lớp lấp `published` record ấy thành thừa; tôi không chạm tệp đó, người điều phối chạy lại `npm run reference:gaps`.

