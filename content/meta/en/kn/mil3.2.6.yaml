notes: |-
  **Bài này không có bản Anh upstream ở snapshot đã ghim** (`noEnglishEditionUpstream`: tầng `english-sujato` không phát hành tệp nào cho `mil`, xem `source/upstream-manifest.json`). Vì vậy cả 31 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) đều nằm trong `fillableSegments`, và bản lấp này là **bản dịch độc lập của dự án**, viết từ Pāli root; bản Việt canonical chỉ dùng để kiểm nghĩa, không dịch vòng qua nó. Không có bản Anh để đối chiếu, nên bản lấp **không** phải cách đọc English độc lập và **không** được tuyên bố là đã đối chiếu bản Anh.

  **Phân loại 31 khoá (đo bằng máy): A = 2 · B = 0 · C = 29 · D = 0.** B (dựng lại từ lời đã ghim) bằng 0 vì không có lời đã ghim nào để dựng lại. A (Pāli trùng nguyên văn với một khoá đã lấp trong cùng bài, nên dùng lại từng chữ): `3.6` ← `2.3`; `3.10` ← `2.7`. Ngoài ra có 2 khoá thuộc 1 nhóm Pāli gần trùng (chỉ khác hoa/thường, dấu câu hoặc nháy): mỗi nhóm dùng cùng một cách dịch cho phần trùng.

  **Khoá trống còn lại: 23 (trên tổng 54 khoá không tính `:0`).** Tất cả đều dưới ngưỡng 40 ký tự (dài nhất 38): tiêu đề, câu nối, lời đáp ngắn, colophon — không vào coverage nên không lấp; đã đo: không còn khoá nào ≥ 40 ký tự chưa lấp.

  **Thuật ngữ và bất định.**

  - `appaccakkhāya` (2.6, 3.9) là bất định có thật: tôi dịch “since he cannot disown the earlier mango/fire” (không thể chối bỏ trái/ngọn lửa trước, vì cái sau sinh từ cái trước); bản Việt đọc là “chưa trông thấy”. Nếu đọc kiểu Việt thì lập luận của Nāgasena mờ hơn, nên tôi giữ cách đọc “disown” và ghi lại.

  - `deva` → “Your Majesty” (Sujato); `daṇḍappatto` → “liable to punishment”; `suṅka` → “bride-price”; `vāretvā` → “betroth”; `aṭṭaṁ dhāreyyāsi` → “whose case would you uphold”; `khīraghaṭa` → “pot of milk” (bản Việt dịch “sữa đặc”). `na mutto` (2.7, 3.10, 4.6) → “not free”, còn `na parimutto` (5.9, 6.10) → “not wholly free”.

  - Khoá 3.3 (`ucchuṁ avahareyya …pe…`, 25 ký tự) dưới ngưỡng 40 nên để trống: người đọc sẽ thấy 3.2 kết bằng `…` rồi nhảy sang 3.4 mà không có ví dụ mía. Đó là hệ quả của ngưỡng, không phải sót. 2.3 và 3.6 là hai khoá Pāli trùng nguyên văn; 2.7 và 3.10 cũng vậy — mỗi cặp cùng một lời Anh.

  **Thuật ngữ chung của loạt Milindapañha** (nhất quán với các bản lấp `mil` đã có): `mahārāja` → “Great King” (tiền lệ Sujato: 198 lượt, ở `kn` 6), `bhante` đứng riêng → “venerable sir”, `bhante nāgasena` → “Venerable Nāgasena”. Điểm này **cố ý lệch** các bản lấp `mil` đã có (dùng “Sir Nagasena” / “venerable Nagasena” không dấu): quy ước của loạt này là tên riêng giữ dạng Pāli có dấu và “Venerable” theo Sujato. `Kallosi` ở cuối bài là khoá ngắn nên không lấp ở đây.

  **Nháy và dấu lược (đo từng khoá):** số nháy kép mở/đóng và nháy đơn mở/đóng của 31/31 khoá khớp Pāli (dấu `’` có chữ thường đứng ngay sau được loại ra như dấu nhạt lược), không có ngoại lệ lệch. Dấu lược `…`: Pāli 1 (tính `…pe…` là một), bản lấp 1. Không thêm khoá ngoài danh sách; không khoá rỗng; NFC.

  **Triangulation 7.5 (trần của lớp lấp).** Tầng Anh đã ghim không có bài này và bản Việt canonical của bài do cùng nhóm công cụ hỗ trợ của dự án làm ra (xem `source/tooling.yaml`), nên không có cách đọc English hay tiếng Việt độc lập nào để đối chiếu cú pháp và sắc thái. Bản Việt chỉ giúp phát hiện chỗ hiểu sai, và đã được dùng như vậy (những chỗ bản lấp lệch bản Việt, nếu có, đã nêu ở mục thuật ngữ và bất định). Đây là giới hạn của bản lấp, không phải thiếu sót riêng của bài.

  **Coverage (đo theo `src/lib/canon/reference.ts`, mẫu số là khoá Pāli ≥ 40 ký tự bỏ `:0` = 31).** Trước: 0/31 = 0,0000 (Sujato không phát hành, chưa có lớp lấp). Sau, khi `published`: 31/31 = 1,0000. Độ nhạy: ngưỡng 0,8 đòi tối thiểu 25/31 khoá có lời; bài chịu được mất tối đa 6 khoá mà vẫn qua ngưỡng; nếu `status` không phải `published` thì lớp lấp tồn tại mà coverage vẫn 0.

  **Hệ quả với `content/meta/reference-gaps.yaml`:** bài có record (`kn/mil3.2.6`, 31/31 khoá không có English, coverage 0). Sau khi lớp lấp `published` record ấy thành thừa; tôi không chạm tệp đó, người điều phối chạy lại `npm run reference:gaps`.

  **technical_integrity 9.6** là điểm chưa qua cổng: trong lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ người điều phối. Không đặt blocker vì lý do đó.
