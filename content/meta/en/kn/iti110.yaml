notes: |-
  Bốn nhóm khoá, đo bằng script trên cả 47 khoá của bài: A = 2 · B = 5 · C = 1 · D = 2.

  NHÓM A (2 khoá) — Pāli TRÙNG NGUYÊN VĂN với một khoá đã có lời, lấy lại nguyên văn lời đó.
  `3.2` và `4.2` có Pāli giống hệt `2.2`, `5.2` (một nhóm trùng 4 khoá). Lấy từ `5.2`, vì
  `5.2` là khoá **1:1** — lời tầng đã ghim phủ đúng một khoá Pāli; `2.2` thì bị gộp hai khoá
  (`2.2` + `2.3`) vào một giá trị. Cả hai khoá nhận đúng một câu:
  "They tolerate it and don’t give it up, dispel it, eliminate it, and obliterate it."

  NHÓM B (5 khoá) — Pāli gần trùng, chỉ khác từ chỉ tư thế ở đầu câu, dựng lại từ lời đã có.
  Tỉ lệ khớp đo được (So sánh chuỗi trên Pāli đã chuẩn hoá khoảng trắng):
  `2.3` 0.9223 với `5.3` · `3.3` 0.9223 với `5.3` · `4.3` 0.9231 với `5.3` ·
  `7.3` 0.9505 với `6.3` · `8.3` 0.9412 với `6.3`.
  Phần tầng đã ghim nuốt mất, và lớp lấp chèn lại: tầng đã ghim KHÔNG có mẫu nào viết vế
  đuôi "when standing" hay "when sitting" — đếm toàn tầng Anh đã ghim của bộ `iti`, cụm
  "Such a mendicant is said to be ‘…’" xuất hiện **6** lần và vế đuôi chỉ có **2** dạng
  ("when walking" 3 lần, "when lying down while awake" 3 lần). Tức là hai từ "when
  standing" / "when sitting" ở đây là phần **lớp lấp phải tự ghép**, lấy từ vốn từ chỗ
  tầng đã ghim dùng đúng từ chỉ ấy: `3.1`/`7.1` viết "while standing", `4.1`/`8.1` viết
  "sitting". Bản lấp `iti111` của chính lớp này cũng đã ghép đúng hai vế đuôi này.
  Cả 5 khoá B đều chỉ là **một câu của tầng đã ghim với đúng vế đuôi thay thế**, không
  thêm bớt gì khác.

  NHÓM D (2 khoá) — ⚠️ BÁO, KHÔNG TỰ Ý HÒA. `7.2` và `8.2` có Pāli trùng nguyên văn với
  `6.2` và `9.2`, nhưng tầng đã ghim cho **hai lời khác nhau** cho cùng một câu Pāli:
  `6.2` = "They don’t tolerate **them**, but give them up, dispel them, eliminate them, and
  obliterate them." còn `9.2` = "They don’t tolerate **it**, but give it up, dispel it,
  eliminate it, and obliterate it." Đo toàn tầng Anh đã ghim của bộ `iti`: cụm "don’t
  tolerate" chỉ xuất hiện **2** lần, toàn bộ đều ở chính bài này (`6.2` "them", `9.2`
  "it") ⇒ **không có đa số để mà theo**, không thể dùng phép đo tầng để phân xử.
  Phân xử bằng Pāli: `7.2`/`8.2` = "Tañce, bhikkhave, bhikkhu **nādhivāseti pajahati
  vinodeti byantīkaroti** anabhāvaṁ gameti" — chủ ngữ `bhikkhu` số ít và cả bốn động từ
  số ít, nên "it" đúng và "them" của `6.2` là lỗi số của tầng đã ghim. Lớp lấp vì thế dựng
  `7.2`/`8.2` từ `9.2`, **cố ý lệch `6.2`** (xem mục kế).

  NHÓM C (1 khoá, để trống) — `13.2` = "Ekādasamaṁ.", 11 ký tự sau khi chuẩn hoá khoảng
  trắng, **dưới ngưỡng 40** nên không vào mẫu số coverage và lấp cũng không đổi được tỉ lệ.
  Đo toàn tầng Anh đã ghim của bộ `iti`: có **15** khoá Pāli kết bằng "…samaṁ." và **15/15**
  đều để trống trong bản đã ghim ⇒ đây là quy ước của chính tầng đã ghim với khoá đánh số
  cuối Itivuttaka, không phải lỗ hổng dịch. Điền vào đây sẽ là thêm một từ mà không bản
  dịch nào trong tầng đã ghim có, để đổi lấy **0** điểm coverage. Để trống.

  DẤU LƯỢC — đếm trên cả 47 khoá: Pāli có **0** khoá chứa `…`, và **0** khoá chứa
  `…pe…` (47 khoá viết đủ). Tầng đã ghim có **4** khoá tự thêm `…` nơi Pāli viết đủ:
  `3.1`, `4.1`, `7.1`, `8.1` (ví dụ `4.1` chỉ có "sitting …" trong khi Pāli `4.1` viết
  đủ "Nisinnassa cepi, bhikkhave, bhikkhuno uppajjati kāmavitakko vā …"). Đây đúng là
  dạng lỗi đã đo ở bài khác. Lớp lấp vì thế ghi **0** dấu lược: 9 khoá đã ghi không có `…`.

  NGOẶC KÉP — đếm trên cả 47 khoá: Pāli có `“` ở **2** khoá (`2.1`, `10.1`) và `”` ở
  **2** khoá (`9.3`, `12.6`), và **0** khoá nào có `‘’`. Tầng đã ghim có thêm 4 cặp `‘’`
  quanh định nghĩa `anātāpī … hīnavīriyo` / `ātāpī … pahitatto` (`2.2`, `5.3`, `6.3`,
  `9.3`); 4 dấu `’` còn lại là dấu nháy trong "don’t"/"Brahmin’s", không phải ngoặc.
  Lớp lấp **giữ** cặp `‘’` ở 5 khoá B (`2.3`, `3.3`, `4.3`, `7.3`, `8.3`) — đây là ngoại lệ
  có lý do nêu ở quy tắc: 9 khoá lấp **không phải lời tôi sáng tác**, mà là câu của chính
  tầng đã ghim cắt lại đúng ranh giới khoá Pāli, nên bỏ ngoặc là cắt bỏ dấu câu của
  nguồn. Đo toàn tầng Anh đã ghim của bộ `iti`: cấu trúc "Such a mendicant is said to be
  …" xuất hiện **6** lần và **6/6** đều có `‘’`, **0** lần không có. Bỏ ngoặc ở đây thì
  người đọc sẽ thấy cùng một công thức có ngoặc ở `5.3`/`6.3`/`9.3` mà không ở
  `2.3`/`3.3`/`4.3`/`7.3`/`8.3`. Lưu ý cho lát sau: bản lấp `iti111` của lớp này đã chọn
  hướng ngược lại (bỏ `‘’` để khớp Pāli từng khoá) ⇒ hai bài anh em lệch nhau về dấu
  câu, mỗi bài tự nhất quán trong nội bộ mình.

  CỐ Ý LỆCH TẦNG ĐÃ GHIM — đúng một chỗ: `7.2`/`8.2` lấy số ít từ `9.2` thay vì số nhiều
  từ `6.2` (lý do ở nhóm D). `6.2` là tầng đã ghim, không sửa được và cũng không sửa.

  COVERAGE — mẫu số là Pāli có nội dung: **26** khoá (47 khoá trừ khối `:0` và trừ những
  khoá dưới 40 ký tự), không phải 47. Trước: 17/26 = **0.6538**. Sau khi `published`:
  26/26 = **1.0000**. Độ nhạy: ngưỡng 0.8 cần 21/26, tức cần lấp tối thiểu **4** trong 9
  khoá; dư **5** khoá trước khi rớt ngưỡng. Riêng `13.2` không đổi tỉ lệ nào vì nằm ngoài
  mẫu số.

  `content/meta/reference-gaps.yaml` **có** record cho `iti110` (substantiveSegments 26,
  substantiveWithoutEnglish 9, coverage 0.6538). Sau khi bản lấp này `published` thì record
  đó thành thừa và bộ sinh sẽ bỏ; tệp đó không được chạm tay ở lát này.

  TRIANGULATION = 9.5 (trần của lớp lấp) vì hai lý do đo được: cả 9 khoá đều lấy từ lời
  của chính tầng Anh đã ghim cho đúng Pāli đó (4 khoá trùng nguyên văn, 5 khoá chỉ thay
  vế đuôi), và bản Việt canonical của bài này được chấm bởi `deepseek-v4.1-flash`, khác
  alias `OpenCode Space Bunny Free (agent)` của lớp lấp. Lớp lấp này **không** được tuyên
  bố là đã đối chiếu với một bản Anh thứ hai — nó không có bản Anh thứ hai nào.

  `vietnamese_clarity` = 9.0 theo tiền lệ `iti81`: điểm trừ không phải văn xuôi tiếng Việt
  (lớp lấp không có văn xuôi tiếng Việt nào để chấm) mà vì người đọc **thấy được** chỗ
  chuyển số: `6.2` đã ghim viết "them", `7.2`/`8.2`/`9.2` viết "it".
  `han_viet_balance` = 9.4 là giá trị mặc định của lớp lấp, vì lý do trên.

  `technical_integrity` = 9.6 vì bị cấm chạy cổng, nên **không** tuyên bố technical gate
  pass. Bốn lệnh còn lại cho người điều phốn: `npm run validate` · `npm test` ·
  `npm run check` · `npm run build`.

  **Sửa của người điều phốn — khoá `13.2`.** Lát để trống `13.2` (`Ekādasamaṁ.`), lý do là *toàn tầng
  Anh đã ghim trong `iti` để trống 15/15 khoá kết nhãn thứ tự*. Tôi đo lại và **bác lý do này**: đó là
  **quy ước của Sujato** (ông ta lược nhãn thứ tự), không phải quy ước của lớp lấp — và lớp lấp của dự án
  đã điền **14** khoá nhãn thứ tự (`an3.70:40.5`→"Tenth", `an4.116:2.2`→"Sixth", `an4.171:10.3`→"First",
  `an4.187:9.2`→"Seventh", `ud5.8:6.5`→"Eighth", `ud6.1:17.5`→"First"). Tôi điền `13.2` = **"Eleventh."**
  theo tiền lệ đó. Đây là **sửa của tôi**, không phải phần lát đã chấm — nói rõ ở đây để không ai đọc
  `notes` là toàn bộ ý của lát. Khoá này **11** ký tự nên **không** vào mẫu số coverage ⇒ `ratio` **không**
  đổi (26/26 = 1,0000 vẫn đúng trước và sau).
