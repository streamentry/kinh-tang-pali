notes: |-
  **Phân loại 20 khoá (đo bằng máy): A = 1 · B = 17 · C = 2 · D = 0.**
  Bài có tám phẩm chất của biển và tám của Pháp-Luật; mỗi phẩm chất Pāli nói **hai lần**: một lần nêu, một lần khởi bằng
  `Yampi, bhikkhave, …;` rồi `ayaṁ … paṭhamo acchariyo …`. Tầng đã ghim dịch lần nêu và câu kết, để trống **mọi** khoá
  `Yampi` (16 khoá). Cùng khoảng trống ấy có ở `an8.19`/`an8.20`, và lớp lấp đã lấp `an8.20` bằng khuôn “The fact that,
  mendicants, …;” — lát này theo đúng khuôn đó để hai bài song song đọc như nhau.

  **B — 17 khoá:** 16 khoá `Yampi` (0,86–0,98 với lần nêu cùng phẩm chất: `10.2`←`10.1`/`19.1`, …, `26.3`←`26.2`), chép
  lời lần nêu và đặt “The fact that, mendicants,” cho `Yampi, bhikkhave`, kết `;` theo Pāli. Chỗ chèn lại phần tầng đã ghim
  nuốt: `22.3` thêm “in the teaching and training proclaimed by the Realized One” (`tathāgatappavedite dhammavinaye`, có ở
  Pāli `22.2` nhưng lời đã ghim `22.2` bỏ); `17.2` giữ `…pe…` của Pāli thành một `…` (“or even two hundred … five hundred
  leagues long”) thay vì chép bản đủ của `17.1`/`26.1`. `5.3` (1,00 với `4.4`): lời Đức Phật được trích lại trong ý nghĩ
  của Mahāmoggallāna, nháy `‘…’?”` theo Pāli.
  **A — 1 khoá:** `6.3` ← `5.8` (“You can’t live in communion with the monks.”). Hệ quả: `6.1`/`6.2` đã ghim **tóm** lần
  thứ hai và thứ ba thành “For a second time and a third time, he asked that monk to leave.” không mở nháy, nên `”` của
  `6.3` (theo Pāli) đứng một mình; lặp do tầng đã ghim tóm.
  **C — 2 khoá:** `6.4` `Dutiyampi kho …pe…` → “For a second time …” (một `…`); nhãn `28.5` `Pañcamaṁ.` → “Fifth.”
  (`ud5.5` là bài thứ năm của phẩm 5, khớp vị trí).

  **Không có lệch nghĩa nào với tầng đã ghim**; khác biệt duy nhất là phần chèn ở `22.3` nói trên.

  **Hai cơ chế khoá trống:** cắt cụt dãy = 0; bỏ dòng song song = 0 nhóm (các khoá `Yampi` trống song song với khoá **đã
  dịch**, không song song với nhau ở mức ≥ 0,70 — phép đo B chỉ xét khoá trống với khoá trống).

  **Nháy:** 20/20 khoá khớp Pāli (gồm `‘the ocean’` ở `13.2` ứng với `’tveva` của Pāli). **Dấu lược:** Pāli
  2, lấp 2. **Khoá trống còn lại: 0.**

  **Coverage (đo theo quy tắc kho: Pāli ≥ 40 ký tự, bỏ khối `:0`).** Trước lát: 69/85 = 0.8118; sau khi lớp lấp `published`: 85/85 = 1.0000 (16 khoá lấp có nội dung). Độ nhạy: ngưỡng 0,8 cần 68 khoá; còn dư 17, mất 18 khoá thì rớt ngưỡng. Nếu lớp lấp không `published` thì coverage giữ nguyên 0.8118.
  Hệ quả với `content/meta/reference-gaps.yaml`: `kn/ud5.5` **không** có record.

  Triangulation 8.8: metadata Việt của `ud5.5` (`content/meta/sutta/kn/ud5.5.yaml`) ghi `quality.assessed_by` là một công
  cụ **khác họ** với lớp lấp (`source/tooling.yaml`), nên về mặt tác giả đây là lớp đọc Anh độc lập. Vẫn ≤ 9,5 vì không có
  bản Anh thứ hai cho khoá lấp; điểm giữ ở 8,8 vì cả 16 khoá `Yampi` dựa vào lời của chính tầng đã ghim. Đối chiếu có:
  Pāli root + Sujato đã ghim + bản Việt canonical + khuôn lấp `an8.20`. Không chạm tầng Việt.

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, để người điều phối chạy khi gom. Tự kiểm bằng máy đã làm: JSON parse, mọi khoá ⊆ `fillableSegments` của bài, không khoá nào trùng khoá Sujato có chữ (0 shadow), không khoá rỗng, NFC, dấu lược khớp quy tắc `…pe…` = một `…`, khoá theo thứ tự Pāli, YAML parse, `final_score` = trung bình số học thô.
