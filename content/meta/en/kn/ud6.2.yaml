notes: |-
  NĂM/BA KHOÁ NÀY LẤP CHỖ TRỐNG QUANH MỘT BẢN ANH ĐÃ GHIM, không phải bản Anh tự
  dịch từ đầu: `an3.128` có 35/42 khoá có chữ trong tầng đã ghim, `an5.249` 26/34,
  `ud6.2` 29/34 (đo bằng `sutajato()`). Tuy vậy `triangulation` vẫn đặt 8.0 cho CẢ bài
  để lát đồng nhất, và **lý do ở đây khác**: các khoá phải điền đều là **lần nhắc lại
  mà bản đã ghim đã lược**, nên không có câu nào độc lập để so. Bộ từ lấy lại từ đúng
  bản Anh đã ghim của chính bài này — không phải từ bản Anh nào khác, và không phải
  từ bản Việt.

  LUẬT 3 "PĦLI TRÙNG THÌ DÙNG LẠI LỜI ĐÃ CÓ" — MÁY KHÔNG BẤT ĐƯỢC Ở LÁT NÀY, TỰ GIỮ
  BẰNG SCRIPT: `save_fill` chỉ in cảnh báo khi Pāli trùng ở khoá khác **có bản Anh đã
  ghim**; 12 bài của lát không có bản ghim nên nó im lặng hoàn toàn. Đã viết
  `_re0_dup.py` đếm Pāli trùng giữa 15 bài của lát với toàn bộ tầng `en/project`
  (822 khoá): 9 cụp trùng trong chính lát (24 khoá là bản lặp) và 18 cụp trùng với
  bài khác; mỗi cụp giữ **một lời duy nhất**, và cụp nào đã có tiền lệ commit thì dùng
  đúng lời đó.

  BẢN VIỆT DỰ ÁN `content/translation/vi/project/sutta/kn/ud6.2_translation-vi-project.json` có đủ 34/34 khoá; dùng để **đối chiếu nghĩa**, không làm nguồn — nó cùng do một agent chấm nên không phải là lớp đọc độc lập, và `vietnamese_clarity` / `han_viet_balance` ở đây chấm theo bản Việt ấy chứ không theo một bản Việt đã xuất bản. Chỗ nào hai lớp bất đồng thì Pāli là authority và bất đồng được ghi ở mục dưới.

  BỐN KHOÁ NÀY LÀ LẦN NHẮC LẠI, KHÔNG PHẢI ĐOẠN MỚI. Bản Anh đã ghim của chính
  ud6.2 đã dịch 5.1–6.4; 7.3 nhắc lại 5.1, 7.4 nhắc lại 6.1 rồi để `…pe…`, 7.5 nhắc lại
  6.4, 7.6 nhắc lại vế sau của 6.4. Vì vậy bộ từ lấy lại **nguyên văn** từ bản đã ghim
  của chính bài này, đổi chỉ chỗ Pāli khác.

  BẤT ĐỊNH ĐÃ GHI, VÀ NÓ LÀ CHỖ TÔI PHẢI CHỌN GIỮA HAI LỚP: `dujjānaṁ kho etaṁ … tayā
  gihinā …` ở 7.3 **không có** `kāmabhoginā` ("thọ hưởng các dục") — vế đó chỉ có ở 5.1.
  Tôi bỏ "enjoying sensual pleasures" khỏi 7.3 vì Pāli ở đây không có, và vì không được
  thêm chữ vào kinh. **BẢN VIỆT DỰ ÁN LẠI CÓ "một gia chủ thọ hưởng các dục" ở 7.3** —
  tức là đã chép từ 5.1 sang. Hai lớp sẽ hiện ra khác nhau ở đúng khoá này; ghi ra đây cho
  người biên tập, vì đây là chỗ bản Việt có vẻ thêm chữ ngoài Pāli.

  `…pe…` ở 7.4: giữ **đúng một** dấu lược `…` (luật của lớp: không bao giờ mở rộng
  `…pe…`), đúng cách bản đã ghim làm ở 2.4 và 7.2. Không dịch phần bị lược.

  `Kāsi` (7.3) giữ dấu Pāli vì bản Anh đã ghim của chính ud6.2 dùng `Kāsi` ở 5.1 và chốt
  của repo cho phép tên riêng có dấu khi tầng đã ghim dùng.

  Ngoặc kép ở 7.6 kết thúc bằng `”’`: Pāli kết thúc `duppaññenā”’ti.` — `”` đóng ngoặc
  trong, `’` đóng ngoặc ngoài. Số ngoặc phải khớp Pāli theo từng khoá nên giữ nguyên. Quét
  tự động báo "lặp cụm when … when" ở 7.6: **cờ hợp lệ**, vì Pāli có `manasikarotā no
  amanasikarotā` (khi có ý thức / khi không có ý thức) và bản đã ghim cũng lặp đúng vậy.

  10.5 (`Dutiyaṁ.`) cũng fillable nhưng thuộc lát khác — không chạm vào.

  CỔNG KỸ THUẬT: `save_fill` PASS cho từng khoá (5 luật cơ học: chỉ điền khoá Pāli có
  chữ và bản Anh đã ghim để trống; số dấu lược / ngoặc mở / ngoặc đóng / dấu hỏi khớp
  Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không khoảng
  trắng đôi). Quét bổ sung trên riêng 15 tệp của lát: 0 cờ "từ Pāli lọt", 0 cờ "sót
  `pe…`", 0 cỗ "ngoặc treo", 0 cờ khoảng trắng đôi; 3 cờ "lặp cụm" đều hợp lệ và đã
  giải trình trong `notes` (xem `mil3.7.13.yaml` và `ud6.2.yaml`). CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm
  chạy vì chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity`
  chấm 9.8 chứ không 10.0, và đây là việc NGƯỜI ĐIỀU PHỐI phải chạy lại trước khi coi
  bài là xuất bản — ghi thẳng ra đây thay vì để trong im lặng.

