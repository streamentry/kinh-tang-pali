notes: |-
  BẢN ANH ĐÃ GHIM KHÔNG CÓ cho `mil*` (dò trực tiếp `.cache/.../en/sujato/
  sutta/kn/`, không tệp nào chứa `"mil3.6.6:`), nên đây là bản Anh của chính dự án viết
  từ Pāli một mình: không có tầng Anh độc lập để đối chiếu. `triangulation` 8.0 cho CẢ
  bài. Bản Việt dự án có đủ 9/9 khoá nhưng dùng để đối chiếu NGHĨA, không phải nguồn.

  TIỀN LỆ ĐẾM ĐƯỢC trong tầng fill `mil*` (12 tệp): 0.1 "Questions of King Milinda";
  0.2 theo phẩm — mil3.6.5 CÙNG PHẨM `Sativagga` → "Mindfulness", khớp `mil-name:70.
  mil-sativagga` = "Mindfulness "; 0.3 giữ số thứ tự khi Pāli có (mil3.5.4 "4.", mil3.4.9
  "9.", mil3.4.8 "8.", mil3.7.13 "13.", mil3.3.9 "9.", mil3.3.14 "14."); 3.1 theo mẫu
  mil3.6.5 (cùng phẩm, số kề) "<Tiêu đề>: <Số thứ>."; `mahārāja` → "Great King".

  LUẬT 3, HAI CẶP ĐO ĐƯỢC, VÀ MỘT CÁI GIÁ:
    · `Rājā āha—` (1.1) trùng nguyên văn 14 khoá `mil*` trong tầng. Đếm: 8× "The King
      said—" và 6× "The king said—". Theo luật "đếm được thì đếm thắng", tôi dùng "The
      King said—". GIÁ PHẢI TRẢ: mil3.6.5 — cùng phẩm, số liền kề, Pāli 1.1 y hệt — vẫn
      ghi "The king said—". Tôi không sửa được tệp đó (ngoài lát), nên tầng hiện còn hai
      lời cho cùng một Pāli; người điều phối cần một lượt chuẩn hoá.
    · `“Kallosi, bhante nāgasenā”ti.` (2.1) trùng nguyên văn 17 khoá. Đếm: 10× "“Good is
      it, sir Nagasena”." và 7× "“Well done, venerable Nagasena!”". Tôi theo đa số. Cũng vì
      lý do trên, mil3.6.5 vẫn ghi bản kia.

  BẤT ĐỊNH ĐÃ PHÂN XỬ VÀ GHI, KHÔNG GIẤU — đây là bài khó nhất của lát, nên
  `ambiguity_integrity` = 8.8:
    · `rāgadosamohehi` (1.3). PTS (T.W. Rhys Davids — chính bản SuttaCentral dùng cho
      Milindapañha) dịch "the three fires of passion". Cả hai điểm đều không được: Pāli có
      "ba" ở đâu đâu trong câu, và Pāli nói rõ CẢ `rāga` LẪN `dosa`. Tôi giữ cả hai:
      "mixed with passion and aversion". `samalaṁ uṇhaṁ` → "wholly impure and hot" (PTS:
      "stained and hot"), `vimalaṁ sītalaṁ` → "pure and cool" (PTS: "stainless and cool") —
      cặp "impure/pure" đối xứng với "hot/cool", và cả hai từ đều có tiền lệ trong tầng
      ("impure" 30+ lượt, "stainless" 54 lượt). `pītisomanassena` → "gladness and mental
      ease" ("gladness" 8 lượt); `bhesajja` → "medicine" (5 lượt trong tầng `kn`), không
      dùng "cure" của PTS.
    · `mātari matāya` (1.2). PTS dịch "at the death of his mother" — thêm "death" ở ngoài
      Pāli. Tôi chỉ dịch "for his mother". Lý do bỏ cách đọc "trong sữa mẹ": nếu đúng vậy
      thì hành động là khóc như trẻ sơ sinh, và Nagasena không phân biệt được hai người;
      còn nếu là "khóc vì mẹ" thì trạng thái tâm kèm theo là `rāga` (bám víu) — nước mắt
      "nóng, ô nhiễm" — và người khóc vì Pháp thì "mát, trong sạch". Cặp `uṇha`/`sītala` ở
      1.3–1.4 chỉ có nghĩa nếu hiểu hai người theo cách này.

  KHÔNG CHẠY ĐƯỢC CỔNG KỸ THUẬT — ĐÃ HẠ `technical_integrity` XUỐNG 9.8. Đợt này cấm
  chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tôi KHÔNG
  tuyên bố technical gate pass. Bốn lệnh đó xin người điều phối chạy; nếu chúng đỏ thì
  `status: published` phải hạ xuống `draft`.

  CHỐT CỦA KHO ĐÃ CHẠY VÀ PASS: `save_fill` kiểm đủ 5 luật cơ học cho 131 khoá này —
  (1) không khoá nào nằm ngoài `fillableSegments`; (2) không mở rộng `…pe…`; (3) đếm
  dấu lược / ngoặc mở / ngoặc đóng / dấu hỏi khớp PẪN NHIÊU TỪNG KHOÁ; (4) không chữ
  Pāli có dấu nào lọt vào bản Anh (danh sách cho phép lấy theo CẢ TẦNG, nên `Nāvindakī`
  và `Sudassana`… hợp lệ); (5) NFC, không khoảng trắng đôi. `tests/unit/english-fill.test.ts`
  cũng đòi mỗi fill có metadata + 10 tiêu chí — đây là 14 tệp đó.

  LUẬT 3 ("Pāli trùng thì dùng lại lời đã có") — MÁY KHÔNG BẮT ĐƯỢC Ở LÁT NÀY, TÔI TỰ
  ĐẾM. `save_fill` chỉ in cảnh báo khi Pāli trùng ở khoá khác **có bản Anh đã ghim**.
  Tôi tự viết script so Pāli của 14 bài này với (a) nhau, (b) toàn bộ fill đã có trong
  tầng, (c) Pāli root của mọi bài trong tầng `an`/`kn` — kết quả đính kèm ở báo cáo.

  BẢN ANH ĐÃ GHIM: tại commit đã ghim SuttaCentral KHÔNG xuất bản bản Anh nào cho bài
  này. Đo lại bằng cách dò trực tiếp cache, không tin `upstreamPublishes`:
  `grep -rl '"ja108:' .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/` rỗng
  (83 tệp `ja*` có mặt, không tệp nào chứa bài này), và cùng cách cho `mil3.6.6`, `ne27`,
  `pv48`. Vì vậy đây KHÔNG phải lấp chỗ trống quanh một bản ghim, mà là **bản Anh của
  chính dự án, viết từ Pāli một mình**: không có tầng Anh nào độc lập để đối chiếu cú
  pháp, sắc thái hay thuật ngữ. Đây là giới hạn thiết kế của lớp `english-project` ở
  những bài không được xuất bản, KHÔNG phải thiếu sót của bài này và KHÔNG phải blocker.
  Bản Việt dự án ở `content/translation/vi/project/sutta/kn/<uid>.json` chỉ dùng để đối
  chiếu NGHĨA, không phải nguồn; nó lại cùng do một agent chấm nên không thay được tầng
  đối chiếu. Tầng `vietnamese-current` (HT. Thích Minh Châu) `absent` — đặc điểm của
  snapshot upstream, đã ghi ở `skill/translation.md` §7.

