notes: |-
  Phân loại 8 khoá: A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 0 · C (tự dịch từ Pāli) = 8 · D (trùng Pāli nhưng dịch khác) = 0. B (dựng lại từ lời có sẵn) = 0, vì không có tầng Anh nào để dựng.

  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`); bản lấp là bản dịch độc lập của dự án, viết từ Pāli root một mình, dùng bản Việt canonical chỉ để kiểm nghĩa. Vì vậy mọi khoá Pāli đều “để trống” ở tầng Anh, và không có khuôn B (dựng lại từ lời Sujato). Tiền lệ thuật ngữ lấy từ các bài mil đã có lớp lấp (mil3.1.7, mil3.3.1, mil3.4.7, mil3.6.5…: “Great King”, “venerable sir”, “the Blessed One”, “lay follower”, “dispensation”, “Saṅgha”, “mendicants”) và từ bản Anh Sujato của các bài cùng họ (sn5.10, sn3.20, dn17, sn22.5…), chỉ làm tiền lệ chữ, không chép câu.

  Thuật ngữ: `paññā` → “wisdom”; `chedana` → “cutting”, `obhāsana` → “illuminating”; `avijjandhakāra` → “the darkness of ignorance”, `vijjobhāsa` → “the radiance of true knowledge”, `ñāṇāloka` → “the light of understanding” (tách `vijjā` “true knowledge” khỏi `ñāṇa` “understanding” để hai vế song song không trùng chữ); `ariyasacca` → “noble truths”. 1.7 và 2.4: ba cặp nháy đơn quanh `aniccaṁ / dukkhaṁ / anattā` khớp Pāli (“impermanent”, “suffering”, “not-self”).

  1.4 mở một cặp nháy đơn rồi đóng nháy kép; 1.3 (ngoài danh sách) là dẫn vào. Bất định: không có từ hiếm đáng ghi.

  Khoá trống còn lại: bài có 17 khoá Pāli, đã lấp 8; 9 khoá còn trống đều dưới ngưỡng 40 ký tự (tiêu đề, câu ngắn, mục danh sách ngắn, kệ ngắn, colophon) nên không vào coverage và lát này không lấp; toàn bộ 8 khoá có nội dung (≥ 40 ký tự) đã có lời.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài này CÓ record (substantiveSegments 8, substantiveWithoutEnglish 8, coverage 0); sau khi `published` coverage của `kn/mil3.1.15` lên 8/8 = 1.0 (trước: 0/8 = 0.0), nên record thành thừa — để người điều phối sinh lại, bản lấp không chạm tệp đó. Độ nhạy: ngưỡng 0,80 cần ít nhất 7/8 khoá; còn dư 1 khoá.

  Triangulation 7.5: bài không có bản Anh độc lập nào để đối chiếu; bản Việt canonical của bài do họ công cụ khác làm, nhưng nó và bản lấp cùng đọc một Pāli và không có bản Anh nào đứng giữa, nên bản lấp này KHÔNG phải cách đọc English độc lập và KHÔNG được tuyên bố là đã đối chiếu bản Anh. Đối chiếu thực có: Pāli root và bản Việt canonical (chỉ để kiểm nghĩa).

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối.
