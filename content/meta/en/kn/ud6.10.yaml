notes: |-
  `ud6.10:1.4` là khuôn `Ekamantaṁ nisinno kho āyasmā ānando bhagavantaṁ etadavoca:`.
  Bản đã ghim có HAI cách cho đúng khuôn này: `sn55.9:1.1` và `sn55.10:1.1` dịch
  "Ānanda said to the Buddha:", còn `sn23.11:1.2`… (cho `āyasmā rādho`) dịch
  "Seated to one side, Venerable Rādha said to the Buddha:". Lấy cách thứ hai vì ở đây
  `ekamantaṁ nisinno` ("ngồi sang một bên") chưa được nói ở 1.3 — 1.3 đã gộp nó vào
  "sat down to one side, and said to him" — nên bỏ nó đi sẽ mất một mệnh đề.

  Đây là lựa chọn biên tập thật, không phải lựa chọn cơ học, nên `ambiguity_integrity`
  bị hạ. Triangulation 8.0: không có bản Anh độc lập phủ cho khoá này.

  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
