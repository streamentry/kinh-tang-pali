notes: |-
  **Bài này không có bản Anh upstream ở snapshot đã ghim** (`noEnglishEditionUpstream`: tầng `english-sujato` không phát hành tệp nào cho `mil`, xem `source/upstream-manifest.json`). Vì vậy cả 11 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) đều nằm trong `fillableSegments`, và bản lấp này là **bản dịch độc lập của dự án**, viết từ Pāli root; bản Việt canonical chỉ dùng để kiểm nghĩa, không dịch vòng qua nó. Không có bản Anh để đối chiếu, nên bản lấp **không** phải cách đọc English độc lập và **không** được tuyên bố là đã đối chiếu bản Anh.

  **Phân loại 11 khoá (đo bằng máy): A = 2 · B = 0 · C = 9 · D = 0.** B (dựng lại từ lời đã ghim) bằng 0 vì không có lời đã ghim nào để dựng lại. A (Pāli trùng nguyên văn với một khoá đã lấp trong cùng bài, nên dùng lại từng chữ): `3.3` ← `2.3`; `4.3` ← `2.3`. Ngoài ra có 4 khoá thuộc 1 nhóm Pāli gần trùng (chỉ khác hoa/thường, dấu câu hoặc nháy): mỗi nhóm dùng cùng một cách dịch cho phần trùng.

  **Khoá trống còn lại: 17 (trên tổng 28 khoá không tính `:0`).** Tất cả đều dưới ngưỡng 40 ký tự (dài nhất 37): tiêu đề, câu nối, lời đáp ngắn, colophon — không vào coverage nên không lấp; đã đo: không còn khoá nào ≥ 40 ký tự chưa lấp.

  **Thuật ngữ và bất định.**

  - `sīla` → “ethics”; `kusalā dhammā` → “skillful qualities” (khớp mil3.1.7 đã có). Dãy ở 1.5 (`indriyabalabojjhaṅga…samāpattīnaṁ`) dịch theo tiền lệ Sujato: faculties · powers · awakening factors · factors of the path · kinds of mindfulness meditation · right efforts · bases of psychic power · absorptions · liberations · immersions · attainments.

  - Nháy: 5.3 không đóng `”` vì Pāli để câu đó chạy sang `Bhāsitampetaṁ …` (5.4) rồi mới đóng ở khoá kệ; bản lấp khớp Pāli ở từng khoá (đã đo).

  **Thuật ngữ chung của loạt Milindapañha** (nhất quán với các bản lấp `mil` đã có): `mahārāja` → “Great King” (tiền lệ Sujato: 198 lượt, ở `kn` 6), `bhante` đứng riêng → “venerable sir”, `bhante nāgasena` → “Venerable Nāgasena”. Điểm này **cố ý lệch** các bản lấp `mil` đã có (dùng “Sir Nagasena” / “venerable Nagasena” không dấu): quy ước của loạt này là tên riêng giữ dạng Pāli có dấu và “Venerable” theo Sujato. `Kallosi` ở cuối bài là khoá ngắn nên không lấp ở đây.

  **Nháy và dấu lược (đo từng khoá):** số nháy kép mở/đóng và nháy đơn mở/đóng của 11/11 khoá khớp Pāli (dấu `’` có chữ thường đứng ngay sau được loại ra như dấu nhạt lược), không có ngoại lệ lệch. Dấu lược `…`: Pāli 0 (tính `…pe…` là một), bản lấp 0. Không thêm khoá ngoài danh sách; không khoá rỗng; NFC.

  **Triangulation 7.5 (trần của lớp lấp).** Tầng Anh đã ghim không có bài này và bản Việt canonical của bài do cùng nhóm công cụ hỗ trợ của dự án làm ra (xem `source/tooling.yaml`), nên không có cách đọc English hay tiếng Việt độc lập nào để đối chiếu cú pháp và sắc thái. Bản Việt chỉ giúp phát hiện chỗ hiểu sai, và đã được dùng như vậy (những chỗ bản lấp lệch bản Việt, nếu có, đã nêu ở mục thuật ngữ và bất định). Đây là giới hạn của bản lấp, không phải thiếu sót riêng của bài.

  **Coverage (đo theo `src/lib/canon/reference.ts`, mẫu số là khoá Pāli ≥ 40 ký tự bỏ `:0` = 11).** Trước: 0/11 = 0,0000 (Sujato không phát hành, chưa có lớp lấp). Sau, khi `published`: 11/11 = 1,0000. Độ nhạy: ngưỡng 0,8 đòi tối thiểu 9/11 khoá có lời; bài chịu được mất tối đa 2 khoá mà vẫn qua ngưỡng; nếu `status` không phải `published` thì lớp lấp tồn tại mà coverage vẫn 0.

  **Hệ quả với `content/meta/reference-gaps.yaml`:** bài có record (`kn/mil3.1.9`, 11/11 khoá không có English, coverage 0). Sau khi lớp lấp `published` record ấy thành thừa; tôi không chạm tệp đó, người điều phối chạy lại `npm run reference:gaps`.

  **technical_integrity 9.6** là điểm chưa qua cổng: trong lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ người điều phối. Không đặt blocker vì lý do đó.
