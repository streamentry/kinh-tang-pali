notes: |-
  Lớp lấp: 7 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.

  **Hai khoá dùng lại nguyên văn bản dịch đã có (luật `sn11.24`).**

  1. `16.3` và `16.4` — Pāli trùng với `17.7` và `17.8`; `16.3` chỉ khác `17.7` đúng một dấu phẩy
     sau `pariggaṇhanti` (`…vatthūni pariggaṇhanti, majjhimānaṁ…`). Bản Anh đã ghim dịch hai câu ấy
     ở `17.7`/`17.8`, nên lớp lấp **lấy nguyên văn**: "Middling rulers or royal chief ministers
     inclined to build houses at sites possessed by middling deities." và "Lesser rulers or royal
     chief ministers inclined to build houses at sites possessed by lesser deities." Dùng lại còn
     giữ được `mahesakkhā` → "illustrious" / `majjhimā` → "middling" / `nīcā` → "lesser" đúng như
     `17.6`–`17.8` đã ghim, và giữ `raññaṁ rājamahāmattānaṁ` → "rulers or royal chief ministers"
     không dịch lệch sang một cách khác trong cùng bài.
  2. `17.4` — mệnh đề lõi trùng nguyên văn với `17.2` (`sunidhavassakārā magadhamahāmattā
     pāṭaligāme nagaraṁ māpenti vajjīnaṁ paṭibāhāyā`), chỉ khác vế dẫn `evamevaṁ kho, ānanda`.
     Bản đã ghim ở `17.2` là "the Magadhan chief ministers Sunidha and Vassakāra are building a
     citadel to keep the Vajjis out."; lớp lấp dùng lại đúng cụm đó, chỉ thêm vế dẫn. Hệ quả có
     ghi: `pāṭaligāme` không được dịch ở `17.4` vì `17.2` đã ghim cũng bỏ nó ("a citadel", không phải
     "a citadel at Pāṭali Village"). Giữ nhất quán với tầng đã ghim còn hơn tự thêm địa danh.

  **Công thức `Ekamantaṁ … etadavocuṁ:` ở `1.6` và `18.3` dùng đúng cách lớp lấp đã lập.** Trong
  `content/translation/en/project/sutta` đã có 4 lần "Seated to one side, … said to the Buddha:"
  (`ud6.8:2.3`, `ud7.3:2.3`, `ud7.10:2.3`, `ud8.9:1.4`) và 3 lần "Standing to one side, … said to
  me/to him" cho `ṭhitā`. Vì vậy `1.6` = "Seated to one side, the lay followers of Pāṭali Village
  said to the Buddha:" và `18.3` = "Standing to one side, the Magadhan chief ministers Sunidha and
  Vassakāra said to the Buddha:" — không phát minh cách thứ N+1.

  **Thuật ngữ đếm trong chính bài này, không đoán:** `bhagavā` → "the Buddha" (24 lần trong bản Anh
  đã ghim của bài, "the Blessed One" 0 lần); `bhante` → "Sir" (2 lần "Sir," + 1 lần "sir,");
  `pāṭaligāmiyā upāsakā` → "the lay followers of Pāṭali Village" (3 lần, lấy nguyên văn từ `1.3`,
  `2.1`, `3.3`); `magadhamahāmattā` → "chief ministers" (7 lần) chứ không phải "ministers" (2 lần);
  `āvasathāgāram` → "the guest house" (theo `1.7`); `sabbasantharisanthataṁ` / `āsanāni
  paññattāni` / `udakamaṇiko patiṭṭhāpito` / `telappadīpo āropito` lấy nguyên văn động từ của
  bản đã ghim ở `2.1` ("spread carpets all over", "prepared seats", "set up a water jar", "placed
  an oil lamp"). `kira` giữ làm "it seems" — đúng cách bản Anh đã ghim làm ở `ud3.2:12.2`,
  `ud6.4:33.1`, `ud6.5:24.1`; ở hai chỗ khác của tầng `ud` (bản tin của dân `ud1.8:1.5` và
  `ud8.5:2.1`) Sujato **bỏ** `kira`, nhưng bỏ thì mất một đơn vị nghĩa của Pāli nên lớp lấp giữ.

  **Ngoặc kép cân đúng Pāli từng khoá.** `1.4` tự mở **và** đóng ngoặc trong khoá; `2.2` chỉ mở,
  đóng ở `2.3` (nơi tầng đã ghim có `”ti`); `1.6`, `16.3`, `16.4`, `17.4`, `18.3` không có ngoặc nào
  — vì Pāli của năm khoá ấy cũng không có. `2.2` vì vậy kết câu không có dấu chấm.

  **Không khoá nào trong bảy khoá này mang `…pe…`**, nên không khoá nào sinh dấu lược; tổng số dấu
  lược của lớp lấp bài này bằng 0.

  **Hai khoá còn trống ngoài lát này, và phân biệt đúng hai loại.** Bản Anh đã ghim để trống 9 khoá
  có nội dung ở `ud8.6`; lát này nhận 7. Còn lại `18.5` (`Adhivāsesi bhagavā tuṇhībhāvena.`,
  33 ký tự) và `30.5` (`Chaṭṭhaṁ.`, 10 ký tự — dòng colophon báo hết sáu tiết).

  1. Chúng **lấp được** — `fillableSegments` chỉ so với prose của các tầng đã ghim, không áp ngưỡng
     40 ký tự. Chúng không thuộc lát này, nên lớp lấp không đụng tới.
  2. Chúng **không được `coverage` đo** — `substantivePaliMinChars` = 40 loại cả hai.

  Tổng số khoá có nội dung của `ud8.6` là 82, nên sau khi lớp lấp `published` tỉ lệ Anh của bài này
  Tỉ lệ Anh **trước** lớp lấp là (82 − 7) / 82 = **0,9146**, **sau** lớp lấp `published` là
  **1,0000**.

  Không có bất định thuật ngữ nào đáng kể. Không blocker.

  `triangulation` hạ vì không có bản Anh độc lập: bản Anh đã ghim để trống đúng bảy khoá này,
  và lớp lấp chỉ mượn lời đã ghim của cùng bài và cùng công thức. Bản Việt chỉ dùng để đối chiếu
  nghĩa; người viết bản Việt của bài này (`deepseek-v4.1-flash`) không phải người viết lớp lấp này.
  Bốn lệnh cổng còn lại **chưa** chạy vì lát này bị cấm: `npm run validate`, `npm test`,
  `npm run check`, `npm run build`.
