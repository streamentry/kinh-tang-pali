notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI, KHÔNG PHẢI VÀI KHOÁ: tại commit đã ghim SuttaCentral KHÔNG xuất bản
  bản Anh nào cho bài này — đo bằng `upstreamPublishes('english-sujato', 'kn/<uid>')` trên
  `source/upstream-manifest.json`, và kiểm lại bằng cách dò trực tiếp
  `.cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/` (83 tệp có mặt, trong đó có
  `ja126` nhưng không có bài này). Vì vậy đây KHÔNG phải lấp chỗ trống quanh một bản Anh đã ghim, mà
  là **bản Anh của chính dự án, viết từ Pāli một mình**: không có tầng Anh nào độc lập để đối chiếu
  cú pháp và sắc thái. Bản Việt dự án đã dịch đủ 9/9 khoá nhưng KHÔNG phải tầng Anh, và lại cùng do
  một agent chấm, nên không thay được tầng đối chiếu. Cùng lý do, `save_fill` không in cảnh báo
  "Pāli trùng" cho khoá nào ở lát này — không có chỗ nào đã có bản ghim để so — nên luật 3 của lớp
  phải tự giữ bằng mắt (xem các ghi chú tiền lệ bên dưới).

  TỚNG THỨC: mỗi bài có 0.1–0.4 (tiêu đề) + 1.1–1.4 (một câu kệ bốn nhịp) + 2.1
  (lời dẫn đóng `…jātakaṁ <thứ>ṁ.`); giữ nguyên cấu trúc đó, không gộp, không thêm
  một khoá truyện nào.

  TIỀN LỆ ĐẾM ĐƯỢC, dùng chung cho cả lát (đếm trong tầng `kn` của bản Anh đã ghim):
  `Jātaka` → "Stories of Past Lives N " 83/83 tệp `ja*_translation-en-sujato.json`;
  `Ekakanipāta` → "The Book of the Ones " 80/83; `N. Xjātaka` → "<Tiêu đề>: a past
  life story " 82/83 (số thứ tự bị bỏ, giữ đuôi câu); khoá 2.1 (lời dẫn đóng
  `…jātakaṁ <thứ>ṁ.`) bị Sujato ĐỂ TRỐNG ở 79/83 tệp — nên đây đúng là những khoá
  phải lấp. Còn tên phẩm
  và tên bài thì lấy từ tệp TÊN của chính SuttaCentral tại commit đã ghim,
  `name/sutta/ja-name_translation-en-sujato.json` — cùng một người dịch, cùng một
  commit, nên đây là tiền lệ có bằng chứng chứ không phải phỏng đoán.

  LUẬT 3 TỰ GIỮ (quan trọng nhất của lát này), ba dấu hiệu cụ thể:
  1. `kusanāḷi` ở 1.4 dùng lại đúng chữ đã dùng cho tiêu đề 0.4 của chính bài này
  ("clump of grass"), vì cùng một Pāli. Nếu dịch 1.4 là "kusa grass" còn 0.4 là
  "The Spirit in the Clump of Grass" thì bài tự mâu thuẫn.
  2. Cả ba động từ `Kare` / `kareyya` / `Kareyyuṁ` ở 1.1–1.3 đều là "let them
  befriend": đây là lặp có chủ đích của bài kệ, giữ lại thay vì lược.
  3. Colophon 2.1 dùng lại đúng tiêu đề của 0.4 với dấu hai chấm và số thứ tự, vì
  Pāli cũng lặp lại tên bài ở 2.1. Tiền lệ cho số thứ tự đứng riêng là
  `an4.116:2.2` → "Sixth." và `ud7.3:4.5` → "Third." (cùng tầng `kn`, cùng lớp lấp).
  0.3 `Kusanāḷivagga` → "The Reed-stalk Chapter" lấy từ đúng một khoá segment đã
  ghim của cùng phẩm là `ja126:0.3`; 0 tiền lệ ở tệp segment cho `Asampadānavagga`
  nên phẩm đó dùng chữ riêng của nó (xem ja131).

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO:
  - `Kusanāḷi` → "the clump of grass": Sujato có hai cách cho cùng một từ ở commit
  đã ghim — `ja126:0.3` "The Reed-stalk Chapter" và `ja-name:134.ja-kusanalivagga`
  "The Spirit in the Clump of Grass ". Chọn "clump of grass" cho thân bài vì
  `kusanāḷi` là bụi/lõm cỏ, và đó cũng chính là chữ Sujato dùng trong tiêu đề.
  - `Kareyyumete … uttamatthaṁ` → "let them befriend these for the highest good":
  Pāli không có động từ cho `uttamatthaṁ`, tiếng Anh buộc phải có; "for" là
  cách ngắn nhất để không bịa thêm động từ ("yield"/"give") và không bỏ mất vế
  này. Đây là quyết định biên tập, đã hạ điểm grammar_logic.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU: `rucāyan` ở 1.4 có hai cách đọc thật sự khác nhau —
  `ruca` (nhuộm / xoa) cho "being dyed", và gốc `ruc` (yêu thương) cho "being
  cherished"; bản Việt dự án chọn cách sau ("được quý mến"). Tầng Anh chọn cách
  trước vì kusa là cây nhuộm và vì tiêu đề của chính Sujato xoay quanh bụi cỏ này.
  Không thêm chú thích vào thân kinh; ambiguity hạ điểm cho cả hai tầng.

  Triangulation 8.0 là trần của lớp lấp, ghi ở đây để người biên tập không tưởng
  là thiếu sót riêng của bài.
