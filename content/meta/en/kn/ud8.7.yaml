notes: |-
  3.3 = `Ekamantaṁ nisinno kho āyasmā nāgasamālo bhagavantaṁ etadavoca:` → "Seated to
  one side, Venerable Nāgasamāla said to the Buddha:" (cùng khuôn 26 lần như
  `ud7.10:2.3`). Giữ "Venerable" vì 1.2 của chính bài đã ghim "with Venerable
  Nāgasamāla as his second monk".

  3.4 = `“idha mayhaṁ, bhante, tena panthena gacchantassa antarāmagge corā
  nikkhamitvā hatthehi ca pādehi ca ākoṭesuṁ, pattañca bhindiṁsu,
  saṅghāṭiñca vipphālesun”ti.` — lặp lại 3.1 ở thì trực tiếp nên lấy đúng bộ từ 3.1
  của chính bài, đổi sang ngôi thứ nhất: "going down that road", "struck me with
  fists and feet", "broke my bowl", "tore up my outer robe".

  BẤT ĐỊNH NHỎ ĐÃ GHI: `corā nikkhamitvā` nghĩa là bọn cướp đã đi ra. Bản đã ghim ở
  3.1 dùng thì bị động "he was set upon by bandits", không dùng được ở thì trực tiếp;
  đếm `came out of` trong bản đã ghim thì phần lớn là "came out of retreat" (nghĩa
  khác), nên dịch tự do là "bandits came out and struck me". Không có cách nào đếm
  được cho cụm này ở thì trực tiếp. `ambiguity_integrity` 9.2 vì lý do đó.

  Hệ quả người đọc thấy: bản đã ghim ở 3.2 đã gộp SẴN nội dung của 3.3 ("…went to
  the Buddha and told him what had happened."), nên 3.3 lặp lại. Bỏ thì 3.3 thành
  orphan. `vietnamese_clarity` hạ 8.8.

  Lớp lấp: 2 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
