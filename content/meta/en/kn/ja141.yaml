notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI: không có tệp `english-sujato` cho `ja141` tại commit đã ghim
  (`sutajato()` = 0/9 khoá). Bản Anh của chính dự án, viết từ Pāli một mình; tầng Việt hiện
  hành ở commit đã ghim chỉ có Pháp Cú. Giới hạn thiết kế của lớp lấp, KHÔNG phải blocker.

  TIÊU ĐỀ 0.4/2.1: ja-name:157.ja141 = "The Iguana Who Befriended a Chameleon" trong tệp tên
  đã ghim. Tệp JSON của bài này đã tồn tại từ một lượt chạy trước của lát với "The Lizard" và
  không có metadata; đã ghi đè bằng lời của lát này.

  MÂU THUẪN CẦN BIÊN TẬP XỬ LÝ, GHI THẲNG RA ĐÂY: ở 0.3 (tên phẩm `Kakaṇṭakavagga`) tầng
  đang lệch thành hai phe. Tệp tên đã ghim nói ja-name:156.ja-kakantakavagga = "The Iguana
  Who Befriended a Chameleon"; 5 tệp trong tầng (kể cả ja141 và ja145 của lát này) theo đúng
  tệp tên, còn 4 tệp dùng "Chameleons" — một chữ không có trong bất kỳ tệp tên nào tại commit
  đã ghim. Tôi chọn tệp tên vì đó là bằng chứng, và vì nó còn làm 0.3 khác 0.4 (nếu dùng
  "Chameleons" cho cả hai thì mất dấu vết phẩm Kakaṇṭaka, đúng lỗi mà một ghi chú tầng đã
  cảnh báo ở Kusanāḷivagga). Lát khác có thể đã ghi "Chameleons"; nếu biên tập muốn giữ đa số
  4 tệp thì phải sửa cả 5 tệp kia trong một lượt — việc đó ngoài lát của tôi.

  0 TIỀN LỆ, ĐẶT MỚI: `pāpajanasaṁsevī` → "Associating with the wicked"; `accantasukha-
  medhati` → "does not attain lasting comfort" (tầng Việt "an lạc lâu bền", giữ `accanta` là
  "bền"). `kaliṁ pāpeti attanan` → "brings itself to ruin": chủ ngữ là chính cái tội đàn đã
  giao du, nên giữ `attanan` và dịch giới từ.

  BẤT ĐỊNH: `kakaṇṭa` là loài thằn lằn nào — tầng Việt ghi "tắc kè" và nói rõ chưa kiểm
  chứng được loài nào. Tiêu đề 0.4 theo tệp tên đã ghim nên không phải tự dịch, nhưng `kakaṇṭāva`
  ở 1.3 tôi vẫn dịch "chameleons" theo nghĩa chữ; đây là chỗ chưa phân xử được.
  `Godhākulaṁ kakaṇṭāva` là ẩn dụ "bầy kỳ đà giữa bầy tắc kè", tôi dịch "the Godha clan
  among the chameleons" và không thêm chữ nào cho "giữa".

  CỔNG KỸ THUẬT: `save_fill` PASS 9/9 khoá; `rven88.py` không báo cờ nào. CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát bị lệnh cấm).
  `technical_integrity` 9.8; NGƯỜI ĐIỀU PHỐI phải chạy lại bốn lệnh đó.
  Triangulation 8.0 là trần của lớp lấp.
