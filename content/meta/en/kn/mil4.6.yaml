notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI, KHÔNG PHẢI VÀI KHOÁ: tại commit đã ghim SuttaCentral KHÔNG xuất
  bản bản Anh nào cho bài này — đo bằng `upstreamPublishes('english-sujato', 'kn/<uid>')` trên
  `source/upstream-manifest.json`, và kiểm lại bằng cách đếm trực tiếp qua `sutajato()` của
  harness: 0/124 khoá trong 12 bài của lát này có chữ trong tầng Anh đã ghim (mỗi bài đều
  `fillable == số khoá Pāli`). Vì vậy đây KHÔNG phải lấp chỗ trống quanh một bản Anh đã ghim, mà
  là **bản Anh của chính dự án, viết từ Pāli một mình**: không có tầng Anh nào độc lập để đối
  chiếu cú pháp, sắc thái hay cách dịch thuật ngữ. Bản Việt dự án của 12 bài này **chưa tồn
  tại** (`content/translation/vi/project/sutta/kn/<uid>*.json` — không có tệp nào trong 12 uid),
  và bản Việt hiện hành tại commit đã ghim chỉ có Pháp Cú, nên cũng không có tầng Việt nào để đối
  chiếu. Cùng lý do, `save_fill` KHÔNG in cảnh báo "Pāli trùng" cho một khoá nào ở lát này (không
  có chỗ nào đã có bản ghim để so), nên luật 3 của lớp phải tự giữ bằng mắt — xem mục LUẬT 3.

  TIỀN LỆ ĐẾM ĐƯỢC, dùng chung cho cả lát (đếm trong tầng Anh đã ghim, toàn bộ 5 Nikāya;
  `kn` là số lượt riêng trong tầng `kn`, nơi 12 bài này nằm):
  `yonisomanasikāra` → "rational application of mind" 185 (kn 3; sn46.13:2.1 dùng đúng cụm này
  cho `yonisomanasikārasampanno`) · `mahārāja` → "Great King" 198 (kn 6) · `bhante` → "venerable
  sir", "Venerable sir" 106 (kn 3) · `jarāmaraṇa` → "old age and death" 284 (kn 15) ·
  `sokaparidevadukkhadomanassupāyāsā` → "sorrow, lamentation, pain, sadness, and distress" 213
  (kn 5; sn12.53:1.6 đúng cụm này) · `nāmarūpa` → "name and form" 231 (kn 18) · `saḷāyatana` →
  "the six sense fields" 175 (kn 8) · `sammādiṭṭhi` → "right view" 515 (kn 5) · `sammāsaṅkappo`
  → "right purpose" 259 (kn 0) · `satisampajañña` → "mindfulness and situational awareness" 176
  (kn 5; sn47.8:4.1 đúng cụm này) · `sampajāno` → "mindful and aware" 161 (kn 5; sn36.7:2.1) ·
  `upāsaka` → "lay follower" 316 (kn 26) thắng "layman" 52 (kn 4) · `sikkhāpada` → "training
  rules" 54 (kn 1) · `anatikkamanīya` → "not to be transgressed" 5 · `saraṇa` → "has gone for
  refuge" 127 (kn 5) · `bhagavā` → "the Blessed One" 335 (kn 138) · `sāsana` → "the
  dispensation" 7, **toàn bộ 7 lượt nằm trong tầng `kn`** · `samudaya`/`nirodha` → "origin"
  1071 / "cessation" 1609 (kn 67 / 36) · `cakkhuviññāṇa` → "eye consciousness" 111 ·
  `cakkhusamphasso` → "contact through the eye" (sn12.2:9.3) · `sati` → "mindfulness"
  (sn38.1:2.9) · `avijjā` → "ignorance" (sn38.8:1.4) · `vitakko` → "thought" (sn36.11:1.2) ·
  `suparikammakata` → "well-wrought" (an3.63:3.7) · `dhammādhipateyya` → tiền lệ gần nhất là
  an5.133:2.1 ("having principle as his flag, banner, and authority").

  LUẬT 3 TỰ GIỮ (quan trọng nhất của lát này, và máy KHÔNG bắt được):
  1. `Upāsakaguṇa` ở 1.1, 1.2, 1.5 và `Upāsakaguṇavagga` ở 0.3 đều dùng lại đúng cụm "qualities
     of a lay follower" — cả 0.3 và 0.4 cùng ra một chuỗi, vì tệp TÊN của SuttaCentral đặt tên
     chương (mil-name:102.mil-upasakagunavagga) và tên bài (mil-name:108.mil4.6) giống hệt nhau.
     `paridīpesi` (1.1) và phần "These … are the ten qualities" (1.2, 1.5) dùng lại cùng cụm.
  2. `buddhaṁ/dhammaṁ/saṅghaṁ saraṇaṁ goto` ở 1.4 dùng lại y hệt "has gone for refuge in the
     Buddha / the Dhamma / the Saṅgha" ba lần, vì Pāli lặp ba vế; đây cũng là lý do đã hạ
     han_viet_balance — bản Anh nghe lặp, nhưng bỏ lặp là mất cấu trúc liệt kê.
  3. `jinasāsanaparihāni` ở 1.3 và 1.5 dùng lại y hệt "the decline of the dispensation of the
     Buddhas"; `vāyamati` (1.3) và `abhivaḍḍhiṁ icchasi` (1.5) đều giữ "zeal"+"strives", không đổi
     sang "longs to" ở chỗ thứ hai.
  4. `Meṇḍakapañhārambhakathā` ở 0.2 và 2.1 dùng lại y hệt "The Question of Mendaka"; `niṭṭhitā`
     → "is finished" y hệt với cách dùng "is finished" cho `niṭṭhitā` ở tầng `kn`.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO:
  - `sādhū` (1.1) → "Good!": tiền lệ TRỰC TIẾP, an9.33:1.9 ("They'd say 'Good!'"). Đây là lý do
    tôi KHÔNG dùng "Well done!" ở đây, dù dùng nó cho `Kallosi` ở các bài khác: `sādhū` khen một
    lời, `Kallosi` khen một câu trả lời.
  - `koṭūhalamaṅgala` (1.4) → "idle curiosity and grumbling": 0 tiền lệ cho cụm này ("idle
     curiosity" 0, "grumbling" 2). `maṅgala` là "lẩm bẩm/khó chịu"; "silly fuss" (bản nháp đầu) quá
     mơ hồ nên đã đổi. Vì đặt mới nên hạ terminology.
  - `anucchavika` (1.5) → "appropriate"; `patirūpa` → "suitable"; `yutta` → "fitting". Ba từ này
     không có tiền lệ đếm được; cả ba được giữ thành ba vế khác nhau vì Pāli liệt kê ba từ khác
     nhau, và làm phẳng thành một từ là mất phân biệt.
  - `dhammādhipateyya` (1.3) → "is a master of the Dhamma": tiền lệ gần nhất là an5.133:2.1, nơi
     Sujato dịch `dhammādhipateyyo` bằng "authority". "master of the Dhamma" giữ nghĩa "có thầy
     là Dhamma" mà vẫn là tiếng Anh tự nhiên. Đây là quyết định biên tập.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU:
  - 1.3 `Katame dasa, idha, mahārāja, upāsako …` — Pāli đặt câu hỏi nhưng KHÔNG có dấu `?` ở khoá
    này (chốt của lớp lấp đòi số dấu hỏi khớp từng khoá). Tôi vì thế dùng dấu hai chấm ("Which
     are the ten: here, Great King, …") để giữ cả tính câu hỏi lẫn danh sách trả lời. Đây là hệ quả
    trực tiếp của luật 4 và là lý do hạ grammar_logic.
  - 1.5 `te sabbe guṇā tayi saṁvijjanti` = "all of those qualities are present in three ways".
     Pāli không nói "ba cách" là ba cái gì; câu trả lời nằm ngoài lát này (bài mil4.7 trở đi). Tôi
     KHÔNG bịa ba cách đó, và ghi ra đây để người đọc không tưởng là lớp lấp bỏ sót.
  - 1.4 `apagata` + `jīvitahetupi` = "even for the sake of his life", giữ đúng mức độ "kể cả
     mạng cũng không". Không nới thành "không bao giờ".CỔNG KỸ THUẬT: đã chạy và PASS — `save_fill` (khẳng định cả 5 luật cơ học cho từng khoá: chỉ
  điền khoá Pāli có chữ và bản ghim để trống; số dấu lược/ngoặc mở/ngoặc đóng/dấu hỏi khớp
  Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không khoảng trắng đôi),
  và `rven88.py` (0 cờ "từ Pāli lọt", 0 cờ "sót chữ tắt", 0 cỗ "ngoặc mở treo"). CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm chạy
  vì chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity` chấm 9.8 chứ
  không 10.0, và đây là việc NGƯỜI ĐIỀU PHỐI phải chạy lại trước khi coi bài là xuất bản — ghi
  thẳng ra đây thay vì để trong im lặng.Triangulation 8.0 là trần của lớp lấp, ghi ở đây để người biên tập không tưởng là thiếu sót riêng
  của bài.
