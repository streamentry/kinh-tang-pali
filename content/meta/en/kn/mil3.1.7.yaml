  TIỀN LỆ ĐẾM ĐƯỢC, dùng chung cho cả lát (đếm trong tầng Anh đã ghim, toàn bộ 5 Nikāya;
  `kn` là số lượt riêng trong tầng `kn`, nơi 12 bài này nằm):
  `yonisomanasikāra` → "rational application of mind" 185 (kn 3; sn46.13:2.1 dùng đúng cụm này
  cho `yonisomanasikārasampanno`) · `mahārāja` → "Great King" 198 (kn 6) · `bhante` → "venerable
  sir", "Venerable sir" 106 (kn 3) · `jarāmaraṇa` → "old age and death" 284 (kn 15) ·
  `sokaparidevadukkhadomanassupāyāsā` → "sorrow, lamentation, pain, sadness, and distress" 213
  (kn 5; sn12.53:1.6 đúng cụm này) · `nāmarūpa` → "name and form" 231 (kn 18) · `saḷāyatana` →
  "the six sense fields" 175 (kn 8) · `sammādiṭṭhi` → "right view" 515 (kn 5) · `sammāsaṅkappo`
  → "right purpose" 259 (kn 0) · `satisampajañña` → "mindfulness and situational awareness" 176
  (kn 5; sn47.8:4.1 đúng cụm này) · `sampajāno` → "mindful and aware" 161 (kn 5; sn36.7:2.1) ·
  `upāsaka` → "lay follower" 316 (kn 26) thắng "layman" 52 (kn 4) · `sikkhāpada` → "training
  rules" 54 (kn 1) · `anatikkamanīya` → "not to be transgressed" 5 · `saraṇa` → "has gone for
  refuge" 127 (kn 5) · `bhagavā` → "the Blessed One" 335 (kn 138) · `sāsana` → "the
  dispensation" 7, **toàn bộ 7 lượt nằm trong tầng `kn`** · `samudaya`/`nirodha` → "origin"
  1071 / "cessation" 1609 (kn 67 / 36) · `cakkhuviññāṇa` → "eye consciousness" 111 ·
  `cakkhusamphasso` → "contact through the eye" (sn12.2:9.3) · `sati` → "mindfulness"
  (sn38.1:2.9) · `avijjā` → "ignorance" (sn38.8:1.4) · `vitakko` → "thought" (sn36.11:1.2) ·
