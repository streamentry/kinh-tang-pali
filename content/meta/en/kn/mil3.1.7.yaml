  LUẬT 3 TỰ GIỮ (quan trọng nhất của lát này, và máy KHÔNG bắt được):
  1. `Yonisomanasikārapañha` dùng lại đúng cụm đã có ở khoá 0.3 ("The Question on Proper
     Attention") cho colophon 3.1, vì Pāli cũng lặp lại tên bài ở 3.1. Bỏ "(1st)" mà tệp TÊN của
     SuttaCentral có (mil-name:13.mil3.1.7) vì Pāli `7. Yonisomanasikārapañha` không có nó, và tiền
     lệ lớp lấp (ja121–134) cũng bỏ số thứ tự ở khoá 0.4.
  2. `yo na paṭisandahati` (1.2) và `na paṭisandahatī` (1.5) — cùng một động từ, dùng lại đúng
     "recollect" ở cả hai chỗ, không đổi thành "remember"/"call to mind" ở chỗ thứ hai.
  3. `manasikāra` xuất hiện ở 1.2, 1.3, 1.4, 1.5 — dùng lại đúng "rational application of mind"
     ở cả bốn, kể cả khi nó nói về dê/bò/sơn dương ở 1.5.
  4. `bhante` đứng riêng (1.4) → "venerable sir"; `bhante nāgasena` (1.2) và `bhante nāgasenā`
     (2.1) → "venerable Nagasena", vì `bhante` ở đây là danh xưng đi kèm tên chứ không phải "thưa
     ngài". Sự phân biệt này không có tiền lệ (0 lượt `bhante` trong toàn bộ tầng Anh đã ghim),
     nên đây là quyết định biên tập; xem mục BẤT ĐỊNH.
  5. `mahārāja` ở 1.3 và 1.5 → "Great King" y hệt cả hai lần.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO:
  - `Kallosi` → "Well done!": 0 lượt trong tầng Anh đã ghim. Không dùng "Good!" (16 lượt) vì
    "Good!" là cách Sujato dịch `sādhū` (an9.33:1.9) — tức khen một lời tuyên bố — còn `Kallosi`
    là lời ngợi khen một câu trả lời. Vì vậy `sādhū` ở mil4.6:1.1 mới dịch "Good!".
  - `ajeḷakagoṇamahiṁsaoṭṭhagadrabhāna` → "goats, cows, buffaloes, camels, and horses".
    `mahiṁsa` dịch "buffaloes" là chọn của tôi: Sujato dùng "buffalo" 10 lượt nhưng không có
    khoá nào chứa danh sách năm con vật này để so, nên đây là suy đoán có chỗ dựa, không phải
    tiền lệ dịch.
  - `āha—` → "The king said—": 0 tiền lệ. Toàn bộ 89 khoá Pāli có `Rājā āha—` trong corpus đã
    ghim đều nằm ở Milindapañha, và không khoá nào có bản Anh đã ghim; Sujato cũng không dùng
    `said—` (0 lượt) mà dùng "said this:" / "replied.". Giữ gạch dài vì đó là dấu câu Pāli báo
    hiệu lời nói trực tiếp đi ngay sau; đây là quyết định biên tập và đã hạ grammar_logic.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU:
  - 1.3 `Yoniso ca, mahārāja, manasikārena paññāya ca aññehi ca kusalehi dhammehī` là vế trả lời
    KHÔNG có động từ, cũng không có `yena`; tiếng Anh không đứng được nên tôi thêm "By" để câu trả
    lời khớp câu hỏi 1.2 (`yoniso manasikārena`). Đây là chỗ duy nhất trong bài mà tiếng Anh phải
    thêm từ nối chủ ngữ, nên đã hạ grammar_logic.
  - 1.5 Pāli nói các con vật kia CÓ `manasikāra` nhưng KHÔNG có `paññā`. Tôi dịch đúng đối xứng
    này, không "làm mềm" thành "chỉ có trí khôn". Người đọc có thể thấy câu lạ; đó là lạ của
    Pāli, và sửa nó là bịa.CỔNG KỸ THUẬT: đã chạy và PASS — `save_fill` (khẳng định cả 5 luật cơ học cho từng khoá: chỉ
  điền khoá Pāli có chữ và bản ghim để trống; số dấu lược/ngoặc mở/ngoặc đóng/dấu hỏi khớp
  Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không khoảng trắng đôi),
  và `rven88.py` (0 cờ "từ Pāli lọt", 0 cờ "sót chữ tắt", 0 cỗ "ngoặc mở treo"). CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm chạy
  vì chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity` chấm 9.8 chứ
