notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI, KHÔNG PHẢI VÀI KHOÁ: tại commit đã ghim SuttaCentral KHÔNG xuất bản
  bản Anh nào cho bài này — đo bằng `upstreamPublishes('english-sujato', 'kn/<uid>')` trên
  `source/upstream-manifest.json`, và kiểm lại bằng cách dò trực tiếp
  `.cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/` (83 tệp có mặt, trong đó có
  `ja126` nhưng không có bài này). Vì vậy đây KHÔNG phải lấp chỗ trống quanh một bản Anh đã ghim, mà
  là **bản Anh của chính dự án, viết từ Pāli một mình**: không có tầng Anh nào độc lập để đối chiếu
  cú pháp và sắc thái. Bản Việt dự án đã dịch đủ 9/9 khoá nhưng KHÔNG phải tầng Anh, và lại cùng do
  một agent chấm, nên không thay được tầng đối chiếu. Cùng lý do, `save_fill` không in cảnh báo
  "Pāli trùng" cho khoá nào ở lát này — không có chỗ nào đã có bản ghim để so — nên luật 3 của lớp
  phải tự giữ bằng mắt (xem các ghi chú tiền lệ bên dưới).

  TỚNG THỨC: mỗi bài có 0.1–0.4 (tiêu đề) + 1.1–1.4 (một câu kệ bốn nhịp) + 2.1
  (lời dẫn đóng `…jātakaṁ <thứ>ṁ.`); giữ nguyên cấu trúc đó, không gộp, không thêm
  một khoá truyện nào.

  TIỀN LỆ ĐẾM ĐƯỢC, dùng chung cho cả lát (đếm trong tầng `kn` của bản Anh đã ghim):
  `Jātaka` → "Stories of Past Lives N " 83/83 tệp `ja*_translation-en-sujato.json`;
  `Ekakanipāta` → "The Book of the Ones " 80/83; `N. Xjātaka` → "<Tiêu đề>: a past
  life story " 82/83 (số thứ tự bị bỏ, giữ đuôi câu); khoá 2.1 (lời dẫn đóng
  `…jātakaṁ <thứ>ṁ.`) bị Sujato ĐỂ TRỐNG ở 79/83 tệp — nên đây đúng là những khoá
  phải lấp. Còn tên phẩm
  và tên bài thì lấy từ tệp TÊN của chính SuttaCentral tại commit đã ghim,
  `name/sutta/ja-name_translation-en-sujato.json` — cùng một người dịch, cùng một
  commit, nên đây là tiền lệ có bằng chứng chứ không phải phỏng đoán.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU, VÀ ĐÂY LÀ CHỖ HẠ ĐIỂM NHIỀU NHẤT CỦA LÁT:
  `Anivattitattābhayabhīrutāya` là hợp chất kép, và tiền tố phủ định `a-` trong
  `abhayabhīru` là điểm mấu chốt.
  - Tôi đọc `abhayabhīru` là "không sợ điều nguy hiểm", nên 1.2 là "and not being
  afraid of danger". Có tiền tố `a-` phủ định, và `abhayabhīru` là mệnh từ tính
  của "hiền lành / không dữ dằng".
  - Bản Việt dự án đọc ngược lại là "biết sợ điều nguy hiểm" (không có tiền tố `a-`
  trong cách đọc đó) — về mặt hình thúc, cách đọc của tôi bám Pāli hơn vì tiền tố
  `a-` có mặt và là chữ nối bất biến của tiếng Pāli. Tôi KHÔNG sửa bản Việt (ngoài
  lát của tôi) và ghi ở đây để người đọc bốn cột thấy ngay là có hai tầng khác nhau.
  Vì bất định này có thể đảo ngược một vế của câu kệ, `ambiguity_integrity` 8.9 và
  `semantic_fidelity` 9.2.

  TIỀN LỆ ĐẾM ĐƯỢC riêng cho bài này: `sotthibhāvo` → "safety": đúng 3 chỗ trong
  tầng đều là "safety", mn35:27.3–27.5 ("a person might find safety after attacking
  a blazing mass of fire"), nên đây là tiền lệ chính xác chứ không phải đoán. `rakkhasī`
  → "rakshasis" (giữ hình thái Anh thông dụng; `yakkha` đã có tiền lệ riêng nên không
  dùng, và tầng Anh đã ghim không có "yakkha"/"rakshasa" nào để theo — đặt mới).
  `dhitiyā daḷhāya` → "firm resolve": hai từ dính nhau trong Pāli thành một cụm nghĩa
  (`dhiti` = bền, `daḷha` = vững), dịch một cụm thay vì hai; ghi rõ vì có thể đọc là
  hai danh từ.

  Tên bài theo `ja-name:147.ja132` = "Unshaken ". Lưu ý: `Bhīrukajātaka` nghĩa gốc
  là "kẻ nhút nhát" (bản Việt dự án dịch vậy), còn Sujato đặt tên theo kết quả của
  câu chuyện là "không bị lay chuyển". Hai cách đặt tên khác nhau và đều có căn cứ;
  tầng này theo tệp tên của Sujato, không trộn lẫn.

  `Sa sotthibhāvo mahatā bhayena me` dịch "that state of safety is my great fear" —
  giữ `mahatā` là "great" và `bhayena` là "fear" như hai từ riêng; không rút thành
  "sotthibhāvo" là điều tôi không chắc nên cứ nói thẳng là nặng, và đó là nghĩa gốc.
