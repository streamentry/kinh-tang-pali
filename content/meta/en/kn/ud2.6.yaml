notes: |-
  4.1 (Sujato) “Knowing this, the wanderer thought,” → 4.2 là NỘI TÂM của kẻ lang thang, rồi 4.3 (Sujato) “Why don’t I go to the king’s storehouse, drink as much oil as I can…” là câu hỏi tiếp theo. Vì 4.2 mở `“` và 4.3 mới đóng, bản Anh ở đây cũng chỉ mở ngoặc, không đóng.

  Tiền lệ: 3.1 của chính bài này có đúng nội dung này (`rañño pasenadissa kosalassa koṭṭhāgāre samaṇassa vā brāhmaṇassa vā sappissa vā telassa vā yāvadatthaṁ pātuṁ dīyati, no nīharituṁ.`) và Sujato đã dịch: “Now at that time ghee and oil were being given away to any ascetic or brahmin at the storehouse of King Pasenadi of Kosala. But it was only to drink there, not to take away.” Giữ nguyên bộ từ đó. `yāvadatthaṁ pātuṁ` dịch “as much as they can” — Sujato dịch `telassa yāvadatthaṁ pivitvā` ở 4.3 là “drink as much oil as I can”.

  Bất định đã ghi: 3.1 là MÔ TẢ SỰ ĐÃ XẢY RA (Sujato dùng “were being given away”), còn 4.2 là NỘI TÂM hiện tại và Pāli ở đây dùng `dīyati` (bị động sự hiện tại), nên bản lấp dùng “are given away”. Giữ thì số ít thì khác, nên hạ `grammar_logic` 9.3; đổi thì số ít thì lệch với bản đã ghim ở 3.1, nên hạ `ambiguity_integrity` 9.3.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
