notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI: không có tệp `english-sujato` cho `ja117` tại commit đã ghim
  (`sutajato()` = 0/9 khoá). Bản Anh của chính dự án, viết từ Pāli một mình; tầng Việt hiện
  hành ở commit đã ghim chỉ có Pháp Cú. Giới hạn thiết kế của lớp lấp, KHÔNG phải blocker.

  TIÊU ĐỀ: ja-name:130.ja117 = "The Partridge" trong tệp tên đã ghim, và 1.4 cũng dịch
  `tittira` là "partridge" để câu kệ khớp với tiêu đề của chính bài đó. Trước đó tôi viết
  "The Tittira" (giữ tên) vì tầng Việt ghi 0 tiền lệ cho tên chim này; đã sửa theo bằng chứng
  của tệp tên. `tittira` mà Cowell dịch "partridge" cũng nghiêng về cùng cách đọc.

  BẤT ĐỊNH ĐÃ GHI:
  (1) `Accuggatātilapatā` (1.1) — bản viết khác đọc `atibalatā`/`atilapanā`; cả hai đọc đều
  hướng "nói lắm lời", và `accuggatā` = "vượt quá cao". Tôi dịch "Exceeding all bounds,
  overly talkative," và ghi biến thể ở đây vì không có bản Anh nào độc lập để phân xử.
  (2) `ativelaṁ pabhāsitā` (1.2) → "have spoken beyond all measure": `pabhāsitā` là thì quá
  khứ ("đã thốt ra"), tôi giữ thì quá khứ vì cả 1.1–1.2 là một cụm.
  (3) `ativassita` (1.4) → "cries too much": 0 tiền lệ trong tầng; theo nghĩa `vassati`
  (kêu). Vì đặt mới nên hạ `terminology` xuống 9.1.
  (4) `tittira` là chim nào: tầng Việt ghi "tu hú/gà gô rừng", Cowell ghi "partridge". Tôi
  theo tệp tên đã ghim ("Partridge") vì đó là chỗ có bằng chứng, và ghi ở đây là chỗ chưa
  phân xử được.

  CỔNG KỸ THUẬT: `save_fill` PASS 9/9 khoá; `rven88.py` không báo cờ nào. CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát bị lệnh cấm).
  `technical_integrity` 9.8; NGƯỜI ĐIỀU PHỐI phải chạy lại bốn lệnh đó.
  Triangulation 8.0 là trần của lớp lấp.
