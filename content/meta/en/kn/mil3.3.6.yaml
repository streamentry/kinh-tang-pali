notes: |-
  **Bài này không có bản Anh upstream ở snapshot đã ghim** (`noEnglishEditionUpstream`: tầng `english-sujato` không phát hành tệp nào cho `mil`, xem `source/upstream-manifest.json`). Vì vậy cả 21 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) đều nằm trong `fillableSegments`, và bản lấp này là **bản dịch độc lập của dự án**, viết từ Pāli root; bản Việt canonical chỉ dùng để kiểm nghĩa, không dịch vòng qua nó. Không có bản Anh để đối chiếu, nên bản lấp **không** phải cách đọc English độc lập và **không** được tuyên bố là đã đối chiếu bản Anh.

  **Phân loại 21 khoá (đo bằng máy): A = 0 · B = 0 · C = 21 · D = 0.** B (dựng lại từ lời đã ghim) bằng 0 vì không có lời đã ghim nào để dựng lại. A = 0: không có cặp Pāli trùng nguyên văn trong các khoá đã lấp.

  **Khoá trống còn lại: 14 (trên tổng 35 khoá không tính `:0`).** Tất cả đều dưới ngưỡng 40 ký tự (dài nhất 37): tiêu đề, câu nối, lời đáp ngắn, colophon — không vào coverage nên không lấp; đã đo: không còn khoá nào ≥ 40 ký tự chưa lấp.

  **Thuật ngữ và bất định.**

  - `vedagū` là chỗ then chốt của bài và cũng là bất định có thật. Tầng Sujato dịch `vedagū` là “knowledge master” (mn91:32.11, nghĩa bà-la-môn). Ở đây vua tự định nghĩa nó ở 1.4 là “linh hồn ở bên trong” thấy, nghe, ngửi, nếm, chạm, biết qua sáu cửa, nên tôi dịch theo vai trò ngữ cảnh là “an experiencer” chứ không dùng “knowledge master”; bản Việt dịch “bậc thông đạt Veda”. Không đặt blocker vì khoá 1.4 tự giải nghĩa từ này, nhưng nếu người biên tập muốn bám tiền lệ Sujato thì phải sửa cả bài (1.2, 7.2, 7.3).

  - 4.1 và 4.3 `ayaṁ dinno`: tôi đọc `dinna` là tên người (như `sabbadinno` ở mil3.1.4), vì động từ là đi ra, đứng, đi vào; bản Việt đọc là “món đồ”. Bất định có thật, ảnh hưởng nhỏ.

  - 1.4 `uttarena` ở 1.4 và 2.2 dịch là cửa sổ phía bắc (không phải “phía trên” như bản Việt); 4.7 là câu hỏi (động từ cầu khiến `jāneyya`; 4.8 trả lời `Na hi`), dù Pāli không ghi dấu hỏi. `manasikāra` → “application of mind” (7.2, 7.3); 3.1 có ba dấu `…` khớp Pāli; 7.2 kết bằng một `…` khớp `…pe…`.

  **Thuật ngữ chung của loạt Milindapañha** (nhất quán với các bản lấp `mil` đã có): `mahārāja` → “Great King” (tiền lệ Sujato: 198 lượt, ở `kn` 6), `bhante` đứng riêng → “venerable sir”, `bhante nāgasena` → “Venerable Nāgasena”. Điểm này **cố ý lệch** các bản lấp `mil` đã có (dùng “Sir Nagasena” / “venerable Nagasena” không dấu): quy ước của loạt này là tên riêng giữ dạng Pāli có dấu và “Venerable” theo Sujato. `Kallosi` ở cuối bài là khoá ngắn nên không lấp ở đây.

  **Nháy và dấu lược (đo từng khoá):** số nháy kép mở/đóng và nháy đơn mở/đóng của 21/21 khoá khớp Pāli (dấu `’` có chữ thường đứng ngay sau được loại ra như dấu nhạt lược), không có ngoại lệ lệch. Dấu lược `…`: Pāli 4 (tính `…pe…` là một), bản lấp 4. Không thêm khoá ngoài danh sách; không khoá rỗng; NFC.

  **Triangulation 7.5 (trần của lớp lấp).** Tầng Anh đã ghim không có bài này và bản Việt canonical của bài do cùng nhóm công cụ hỗ trợ của dự án làm ra (xem `source/tooling.yaml`), nên không có cách đọc English hay tiếng Việt độc lập nào để đối chiếu cú pháp và sắc thái. Bản Việt chỉ giúp phát hiện chỗ hiểu sai, và đã được dùng như vậy (những chỗ bản lấp lệch bản Việt, nếu có, đã nêu ở mục thuật ngữ và bất định). Đây là giới hạn của bản lấp, không phải thiếu sót riêng của bài.

  **Coverage (đo theo `src/lib/canon/reference.ts`, mẫu số là khoá Pāli ≥ 40 ký tự bỏ `:0` = 21).** Trước: 0/21 = 0,0000 (Sujato không phát hành, chưa có lớp lấp). Sau, khi `published`: 21/21 = 1,0000. Độ nhạy: ngưỡng 0,8 đòi tối thiểu 17/21 khoá có lời; bài chịu được mất tối đa 4 khoá mà vẫn qua ngưỡng; nếu `status` không phải `published` thì lớp lấp tồn tại mà coverage vẫn 0.

  **Hệ quả với `content/meta/reference-gaps.yaml`:** bài có record (`kn/mil3.3.6`, 21/21 khoá không có English, coverage 0). Sau khi lớp lấp `published` record ấy thành thừa; tôi không chạm tệp đó, người điều phối chạy lại `npm run reference:gaps`.

