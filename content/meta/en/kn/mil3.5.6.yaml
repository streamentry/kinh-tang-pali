notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI: không có tệp `english-sujato` cho `mil3.5.6` tại commit đã
  ghim (`sutajato()` = 0/9 khoá). Bản Anh của chính dự án, viết từ Pāli một mình; tầng Việt
  hiện hành ở commit đã ghim chỉ có Pháp Cú. Giới hạn thiết kế của lớp lấp, KHÔNG phải blocker.

  TIÊU ĐỀ: `name/sutta/mil-name_translation-en-sujato.json` tại commit đã ghim cho
  mil-name:65.mil3.5.6 = "The Question on the One Who Knows", và khuôn của lớp lấp là tên
  Sujato + số thứ tự do Pāli mang: đối chiếu 17 câu hỏi Milinda đã có trong tầng thì 4 trùng
  tuyệt đối và 13 khác đúng cái số thứ tự ở đầu. Nên 0.3 = "6. The Question on the One Who
  Knows" và colophon 3.1 = "The Question on the One Who Knows, sixth."

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO:
  - `vedagū` → "one who knows the Vedas": 0 tiền lệ trong tầng Anh (chỉ có một "Jātaveda").
    Pāli chỉ nói người thông đạt Veda chứ không nêu ba hay bốn bộ, nên không thêm số.
  - `paramatthena` → "In truth": 0 tiền lệ riêng cho `paramatthena` trong tầng lấp (chữ
    "in fact"/"in reality" không có lượt nào), đặt mới; chữ "bản chất" của tầng Việt tương ứng.

  TIỀN LỆ ĐẾM ĐƯỢC: `Milindapañha` → "Questions of King Milinda" (20/20 tệp mil trong tầng);
  `Buddhavagga` → "The Chapter on the Buddha" (mil3.5.4, cùng quyển 3 cùng phẩm); `Rājā āha—`
  → "The King said—" (đa số 9 trước khi tôi thêm, so với 5 "The king said—"); `Thero āha—` →
  "The Elder said—"; `mahārāja` → "Great King"; `Kallosi, bhante nāgasenā` → "“Good is it, sir
  Nagasena”." (10/16 trước khi tôi thêm, đối chiếu 6 "“Well done, venerable Nagasena!”"), và
  `bhante` → "sir" đa số 13 so với 8 "Venerable".

  GIỮ CẢ HAI VẾ CỦA PHÉP PHỦ ĐỊNH, ĐÂY LÀ TRỌNG TÂM CỦA BÀI: vua HỎI `upalabbhatī` (có
  hay không), trưởng lão ĐÁP `nupalabbhatī` (không có) — nhưng vế đáp có `paramatthena` nên là
  "không có VỀ MẶT BẢN CHẤT", không phải không có tuyệt đối. Đã dịch 1.2 "does … exist" và
  1.4 "does not exist" với "In truth" ở 1.4, đúng mức độ chắc chắn của Pāli.

  CỔNG KỸ THUẬT: `save_fill` PASS 9/9 khoá; `rven88.py` không báo cờ nào. CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát bị lệnh cấm).
  `technical_integrity` 9.8; NGƯỜI ĐIỀU PHỐI phải chạy lại bốn lệnh đó.
  Triangulation 8.0 là trần của lớp lấp.
