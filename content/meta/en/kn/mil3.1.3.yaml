notes: |-
  Phân loại 7 khoá: A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 0 · C (tự dịch từ Pāli) = 7 · D (trùng Pāli nhưng dịch khác) = 0. B (dựng lại từ lời có sẵn) = 0, vì không có tầng Anh nào để dựng.

  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`); bản lấp là bản dịch độc lập của dự án, viết từ Pāli root một mình, dùng bản Việt canonical chỉ để kiểm nghĩa. Vì vậy mọi khoá Pāli đều “để trống” ở tầng Anh, và không có khuôn B (dựng lại từ lời Sujato). Tiền lệ thuật ngữ lấy từ các bài mil đã có lớp lấp (mil3.1.7, mil3.3.1, mil3.4.7, mil3.6.5…: “Great King”, “venerable sir”, “the Blessed One”, “lay follower”, “dispensation”, “Saṅgha”, “mendicants”) và từ bản Anh Sujato của các bài cùng họ (sn5.10, sn3.20, dn17, sn22.5…), chỉ làm tiền lệ chữ, không chép câu.

  Bất định thật ở 1.5: sáu danh từ hành động `āveṭhana`, `nibbeṭhana`, `niggaha`, `paṭikamma`, `vissāsa`, `paṭivissāsa` dịch “entangling / disentangling, refutation / correction, trust / trust in return”. Cặp đầu (quấn/gỡ lập luận) và `paṭikamma` (sửa lại / đáp trả) là chỗ nghĩa kỹ thuật chưa chắc; đã chọn nghĩa sát gốc và không thêm giải thích. `bhadanto` → “the Reverend” (1.8, xưng với trưởng lão), `vissaṭṭho` → “freely”. 1.7 `vatthu` → “position” (điều khẳng định mà vua giữ).

  Bản Việt canonical dịch cặp đầu là “mở gút thắt / tháo gút gỡ”, nghĩa gần với bản lấp. Không phát hiện lệch nghĩa. Chỗ cố ý khác tiền lệ: chính tả “Nāgasena” có dấu.

  Khoá trống còn lại: bài có 20 khoá Pāli, đã lấp 7; 13 khoá còn trống đều dưới ngưỡng 40 ký tự (tiêu đề, câu ngắn, mục danh sách ngắn, kệ ngắn, colophon) nên không vào coverage và lát này không lấp; toàn bộ 7 khoá có nội dung (≥ 40 ký tự) đã có lời.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài này CÓ record (substantiveSegments 7, substantiveWithoutEnglish 7, coverage 0); sau khi `published` coverage của `kn/mil3.1.3` lên 7/7 = 1.0 (trước: 0/7 = 0.0), nên record thành thừa — để người điều phối sinh lại, bản lấp không chạm tệp đó. Độ nhạy: ngưỡng 0,80 cần ít nhất 6/7 khoá; còn dư 1 khoá.

  Triangulation 7.5: bài không có bản Anh độc lập nào để đối chiếu; bản Việt canonical của bài do họ công cụ khác làm, nhưng nó và bản lấp cùng đọc một Pāli và không có bản Anh nào đứng giữa, nên bản lấp này KHÔNG phải cách đọc English độc lập và KHÔNG được tuyên bố là đã đối chiếu bản Anh. Đối chiếu thực có: Pāli root và bản Việt canonical (chỉ để kiểm nghĩa).

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối.
