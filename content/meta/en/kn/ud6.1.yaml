notes: |-
  QUAN TRỌNG — LỆCH VỚI GIẢ ĐỊNH CỦA BRIEF: bài này CÓ bản Anh đã ghim. Đo lại
  trực tiếp `.cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ud/vagga6/
  ud6.1_translation-en-sujato.json`: 56/61 khoá có chữ, 5 khoá Sujato để trống và 5 khoá
  đó chính là `fillableSegments`. Đây là lớp lấp đúng nghĩa.

  `triangulation` 8.0 vì lý do đặc thù của lớp: 5 khoá phải lấp CHÍNH LÀ 5 khoá Sujato đã
  lược, nên ở đúng những câu này không có tầng Anh độc lập.

  LUẬT 3 Ở ĐÂY RẤT NẶNG, VÀ LẦN NÀY MÁY CÓ BÁO: cả 5 khoá tôi viết đều TRÙNG NGUYÊN
  VĂN với một khoá đã ghim trong chính bài này, nên bắt buộc chép lại y nguyên, không dịch
  lại. `save_fill` in ra 5 cảnh báo và tôi đã đọc từng cảnh báo:
    · 10.4 và 11.4 trùng 9.5 và 12.4 (đã ghim) → chép y nguyên "May the Blessed One now be
      fully extinguished! …" KHÔNG thêm dấu `”` ở cuối, vì Pāli 10.4/11.4 không đóng ngoặc
      (Pāli đóng ở 13.4 bằng `”ti`, và 13.4 đã ghim).
    · 11.1 và 12.1 trùng CẢ BA khoá 9.2, 10.1, 13.1 (đã ghim) → chép y nguyên "Sir, you
      once made this statement:". 11.1/12.1 PẢI SINH từ đây: nếu tôi viết riêng, bài sẽ tự
      trái nhau ở năm chỗ nói cùng một câu.
    · 17.5 `Paṭhamaṁ.` là khoá DUY NHẤT phải viết mới. Tiền lệ: KHÔNG có — Sujato để
      trống mọi khoá số thứ tự đứng riêng trong Ud (17 khoá `Paṭhamaṁ.` trong các bài Ud
      đã ghim, tất cả rỗng). Đây là lựa chọn mới của dự án, ghi rõ ở đây và hạ
      `ambiguity_integrity` vì lý do đó.

  KHÔNG CHẠY ĐƯỢC CỔNG KỸ THUẬT — ĐÃ HẠ `technical_integrity` XUỐNG 9.8. Đợt này cấm
  chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tôi KHÔNG
  tuyên bố technical gate pass. Bốn lệnh đó xin người điều phối chạy; nếu chúng đỏ thì
  `status: published` phải hạ xuống `draft`.

  CHỐT CỦA KHO ĐÃ CHẠY VÀ PASS: `save_fill` kiểm đủ 5 luật cơ học cho 131 khoá này —
  (1) không khoá nào nằm ngoài `fillableSegments`; (2) không mở rộng `…pe…`; (3) đếm
  dấu lược / ngoặc mở / ngoặc đóng / dấu hỏi khớp PẪN NHIÊU TỪNG KHOÁ; (4) không chữ
  Pāli có dấu nào lọt vào bản Anh (danh sách cho phép lấy theo CẢ TẦNG, nên `Nāvindakī`
  và `Sudassana`… hợp lệ); (5) NFC, không khoảng trắng đôi. `tests/unit/english-fill.test.ts`
  cũng đòi mỗi fill có metadata + 10 tiêu chí — đây là 14 tệp đó.

  LUẬT 3 ("Pāli trùng thì dùng lại lời đã có") — MÁY KHÔNG BẮT ĐƯỢC Ở LÁT NÀY, TÔI TỰ
  ĐẾM. `save_fill` chỉ in cảnh báo khi Pāli trùng ở khoá khác **có bản Anh đã ghim**.
  Tôi tự viết script so Pāli của 14 bài này với (a) nhau, (b) toàn bộ fill đã có trong
  tầng, (c) Pāli root của mọi bài trong tầng `an`/`kn` — kết quả đính kèm ở báo cáo.
