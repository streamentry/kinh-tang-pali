notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI: không có tệp `english-sujato` cho `ja136` tại commit đã ghim
  (`sutajato()` = 0/9 khoá). Bản Anh của chính dự án, viết từ Pāli một mình; tầng Việt hiện
  hành ở commit đã ghim chỉ có Pháp Cú. Giới hạn thiết kế của lớp lấp, KHÔNG phải blocker.

  TIÊU ĐỀ: ja-name:151.ja136 = "The Golden Goose" trong tệp tên đã ghim, và tầng Việt cũng
  dịch "Kinh Ngỗng Vàng" (`ngỗng` = goose). Vì vậy 1.3 `Haṁsarājaṁ` dịch "the goose king" chứ
  không phải "swan king", để câu kệ khớp với tiêu đề của chính bài. Tệp JSON của bài này đã
  tồn tại từ một lượt chạy trước của lát, ghi "The Golden Swan" và không có tệp metadata;
  đã ghi đè bằng lời của lát này.

  TIỀN LỆ ĐẾM ĐƯỢC: 0.3 `Asampadānavagga` → "Refusing a Gift" (9 tệp; tệp tên đã ghim
  ja-name:145.ja-asampadanavagga = "Refusing a Gift"); 2.1 theo khuôn "X Story, the sixth"
  của ja135/ja137.

  0 TIỀN LỆ, ĐẶT MỚI: `tuṭṭhabba` → "you should be content" (0 tiền lệ riêng trong tầng Anh
  của lớp lấp; chọn theo nghĩa `tuṭṭhi` là hài lòng). `suvaṇṇā parihāyathā` → "may you fall
  away from the gold": `parihāyathā` là thể nguyệm/thể mệnh lệnh ngôi thứ hai số nhiều, tôi
  dịch bằng "may you" để giữ cảm giác cảnh cáo mà Pāli đang nói; tầng Việt đọc thành mệnh lệnh
  quá khứ ("các ngươi đã mất vàng") — hai cách, tôi ghi ở đây vì chưa phân xử được dạng ngữ.

  BẤT ĐỊNH: `haṁsa` là thiên nga hay vịt ("The Golden Goose" của tệp tên, "Ngỗng Vàng" của
  tầng Việt, còn "swan" là cách dùng phổ biến khác) — tiêu đề lấy theo tệp tên đã ghim, và
  đây là chỗ chưa có bản Anh độc lập để đối chiếu. Vì vậy `ambiguity_integrity` ở 8.9.

  CỔNG KỸ THUẬT: `save_fill` PASS 9/9 khoá; `rven88.py` không báo cờ nào. CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát bị lệnh cấm).
  `technical_integrity` 9.8; NGƯỜI ĐIỀU PHỐI phải chạy lại bốn lệnh đó.
  Triangulation 8.0 là trần của lớp lấp.
