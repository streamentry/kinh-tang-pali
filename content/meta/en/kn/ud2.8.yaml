notes: |-
  **Phân loại 22 khoá (đo bằng máy): A = 8 · B = 5 · C = 7 · D = 2.**

  **A (8):** `3.6`, `3.7`, `3.8` ← `2.6`, `2.7`, `2.8`; `8.4`, `10.3` ← `6.6`/`9.6`; `8.5`, `10.4` ← `6.7`/`9.7`; `8.6` ← `6.8` — chép nguyên văn.

  **D (2) — báo, không tự hòa:** `3.5`, `8.3` có Pāli trùng `2.5` và `6.5`, nhưng tầng ghim dịch hai khoá ấy khác nhau theo thời điểm câu chuyện: `2.5` “has been pregnant for seven years, and in obstructed labor for seven days.” (đang khó sinh) và `6.5` “who was pregnant … for seven days,” (đã sinh, nối sang `6.6` “is now happy and healthy …”). Lớp lấp chọn theo ngữ cảnh: `3.5` (người chồng thuật lời nhắn **trước** khi sinh) ⇒ dạng `2.5`; `8.3` (thuật lời nhắn **sau** khi sinh, nối với `8.4` ⇒ `6.6`) ⇒ dạng `6.5`. Hệ quả: hai khoá Pāli trùng mang hai lời Anh khác — có chủ đích, theo đúng sự phân chia của tầng ghim.

  **B (5):** `3.4`, `8.2` ← `6.4` (0,92): `vadeti` (bà nói) thay cho mệnh lệnh `vadehi` ⇒ “And she says:” · `3.9` ← `2.9` (Pāli bỏ `taṁ`; nguyên văn) · `10.2` ← `9.5` (0,98; đổi `‘` thành `“` theo Pāli) · `10.5` ← `9.8` (1,00; đổi `’` thành `”`).

  **C (7):** `2.3`, `3.3`, `6.3`, `8.1` (lời đảnh lễ, từ vựng `2.2` “bow with your head to his feet … healthy and well, nimble, strong, and living comfortably”), `3.2`, `7.2` (“Seated to one side, the Koliyan gentleman said to the Buddha,” — “Koliyan gentleman” lấy từ `5.1`), `18.5` nhãn `Aṭṭhamaṁ.` ⇒ “Eighth.” (bài thứ 8 của phẩm, khớp số).

  **Cố ý lệch nháy Pāli — đã đo (2 khoá):** `3.7` Pāli 0 nháy, lời lấp có `“`; `3.9` Pāli `’”`, lời lấp `”’”`. Lý do: đây là khoá A, chép nguyên `2.7`/`2.9`, nơi tầng ghim bọc ba ý nghĩ của Suppavāsā bằng một tầng `“…”` mà Pāli không có. Bỏ đi thì lệch với khoá anh em `2.7–2.9`. 20/22 khoá còn lại khớp Pāli.

  **Hệ quả dễ thấy:** tầng ghim ở `3.1` đã tóm “told him of his wife’s struggles. The Buddha said:” và ở `7.1` “told him the good news, and conveyed his wife’s invitation.”, nên lời thuật đầy đủ `3.2–3.9`, `7.2–8.6` hiện ngay sau. Dấu “The Buddha said:” của `3.1` vì vậy đứng trước lời người chồng — lệch do tầng ghim gộp, không sửa được mà không shadow.

  **Dấu lược:** Pāli 0, lớp lấp 0.

  **Đo hai cơ chế khoá trống:** cắt cụt dãy = 3 dãy / 19 khoá / 1.297 ký tự Pāli; bỏ dòng song song = 7 nhóm / 15 khoá.

  **Coverage:** mẫu số 73; trước 54/73 = 0,7397 (**dưới ngưỡng**); sau khi `published` 73/73 = 1,0. Độ nhạy: mất thêm hơn 14 khoá mới rớt dưới 0,8. Bài **có** record trong `content/meta/reference-gaps.yaml`; sau khi `published` record thành thừa — để người điều phối chạy lại `npm run reference:gaps`.

  **Triangulation 8.5:** scorecard tiếng Việt của bài này ghi người dịch và người chấm thuộc **họ công cụ khác** với lớp lấp (đối chiếu `source/tooling.yaml`), nên lớp lấp là một cách đọc English độc lập về tác giả. Vẫn giữ dưới 9 vì không có bản Anh thứ hai để đối chiếu ở 22 khoá này; đối chiếu có: Pāli root + lời Sujato đã ghim của chính bài + bản Việt canonical (chỉ kiểm nghĩa).

  Tự kiểm bằng máy trước khi ghi: JSON parse; mọi khoá ⊆ `fillableSegments` của bài; không khoá nào trùng khoá tầng Sujato đã có chữ (0 shadow); NFC; không khoá rỗng; dấu lược đếm theo luật `…pe…` = đúng một `…` — khớp Pāli ở mọi khoá; nháy đếm theo luật `’` + chữ thường = dấu nháy lửng (apostrophe) tiếng Anh, còn lại là nháy đóng.

