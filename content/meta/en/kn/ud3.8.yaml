notes: |-
  Lớp lấp: 5 khoá (`5.1`, `5.2`, `5.4`, `5.6`, `5.7`) nằm ở phần bản Anh đã ghim đã lược.

  **Bẫn `sn11.24` đã dùng đúng chỗ.** `ud3.8:5.1–5.7` là Kassapa **thuật lại nguyên văn** thứ
  các vị tỳ-kheo đã nói ở `2.1–2.6`. Đọc `5.1` tách khỏi bài thì `“Piṇḍapātiko, āvuso, bhikkhu
  piṇḍāya caranto …”` trông như một mệnh đề mới, và rất dễ dịch thành một câu khác với `2.1`.
  Vì vậy:

  - `5.1` lấy y nguyên văn bản đã ghim ở `2.1`, chỉ đổi dấu mở theo Pāli khoá này (`2.1` mở
    bằng `“`, còn `5.1` nằm trong lời dẫn của Kassapa nên mở bằng `‘`).
  - `5.2` là bản **nguyên văn bằng** `2.2` (Pāli giống hệt từng chữ) — lấy y nguyên văn đã ghim.
  - `5.6` lấy y bản đã ghim ở `2.5`, đổi dấu đóng `”` theo Pāli khoá này (`…carissāmā’ti.`).
  - `5.4` chỉ có một vế rồi `…pe…`, nên dừng đúng chỗ Pāli dừng: "From time to time we too will
    get to see pleasing sights …" Dấu lược **được giữ nguyên**, không mở rộng — luật riêng của
    tầng lấp.
  - `5.7` dịch mới, nhưng dùng lại đúng từ của bản đã ghim cho `vippakatā` ở `2.6`
    ("left unfinished"), để hai bản không tự mâu thuẫn.

  **Hai khoá trống nữa của bài nằm ngoài lát này.** `5.3` (`Handāvuso, mayampi piṇḍapātikā
  homa.`) và `5.5` (`kāyena phoṭṭhabbe phusituṁ.`) cũng trống ở bản đã ghim, nhưng ngắn hơn
  ngưỡng `substantivePaliMinChars` (36 và 26 ký tự Pāli), nên không thuộc lát e0 và không tính
  vào `coverage`. Ghi ra đây để không ai hiểu là đã bị bỏ sót.

  **Cần chạy lại `reference:gaps`.** Trước khi điền, `ud3.8` ở 72.2% (13/18 khoá có nội dung) và
  có record trong `content/meta/reference-gaps.yaml`; sau khi `published` là 100%. Test
  `a fill never leaves a gap record it has cured` sẽ đỏ cho tới khi `npm run reference:gaps` chạy
  lại. Việc này nằm ngoài lát, nên để lại cho người gom.

  `triangulation` hạ vì không có bản Anh độc lập nào cho các khoá này — bản Anh đã ghim để
  trống, và 4 trong 5 khoá lấy lại chính bản đã ghim ở chỗ trùng Pāli nên không phải đọc lại
  độc lập. Bản Việt chỉ để đối chiếu nghĩa; người viết bản Việt của bài này
  (`deepseek-v4.1-flash`) không phải người viết lớp lấp này.