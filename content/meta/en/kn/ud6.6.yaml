notes: |-
  Phân loại 27 khoá (đo bằng máy, Pāli chuẩn hoá bỏ dấu câu, so với mọi khoá Sujato có chữ trong bài):
  A 20 · B 3 · C 4 · D 0. Các cụm Pāli trùng nhau giữa chính những khoá cần lấp cũng được giữ cùng một lời
  (kiểm bằng máy): 4.1 = 6.1 = 8.1 = 10.1 = 12.1 = 14.1 = 16.1 = 21.1; 5.1 = 7.1 = 9.1 = 11.1 = 13.1 = 15.1 =
  17.1; 21.4 = 22.4; 21.5 = 22.5.

  Nhóm A, dùng lại lời Sujato (20 khoá):
  - 4.1, 6.1, 8.1, 10.1, 12.1, 14.1, 16.1, 21.1 ← 2.1 (“There were some ascetics and brahmins who had this
    doctrine and view:”); 5.1, 7.1, 9.1, 11.1, 13.1, 15.1, 17.1 ← 3.1 (“Others held views such as the following, each
    regarding their own view as true and others as silly.”). Nguyên văn. Lưu ý: ở 3.1 Sujato đã đưa vế `idameva
    saccaṁ moghamaññan` (“mỗi người cho kiến của mình là đúng, của người khác là ngớ ngẩn”) lên khoá đầu, và các khoá
    `x.2` (4.2, 5.2, …) của Sujato không lặp vế ấy. Bản lấp theo đúng quy ước ấy để 14 cặp `x.1`/`x.2` của bài cùng
    một giọng.
  - 21.3 ← 18.1 (“They were fighting, quarreling, and disputing, continually wounding each other with barbed
    words:”), nguyên văn, kể cả thì quá khứ của Sujato dù ở 21.3 là lời tường thuật của chư tỳ-kheo.
  - 21.4, 22.4 ← 18.2 và 21.5, 22.5 ← 18.3 (“Such is Truth, such is not Truth!” / “Such is not Truth, such is
    Truth!”), chỉ đổi nháy: ở 18.2–18.3 Pāli có một tầng nháy kép; ở 21.4–21.5 và 22.4–22.5 Pāli có hai tầng
    (nháy đơn mở ở 21.4/22.4; nháy đơn đóng rồi nháy kép đóng ở 21.5/22.5). Đo: 21.4 Pāli (đơn mở 1) bản lấp (đơn mở 1);
    21.5 Pāli (đơn đóng 1, kép đóng 1) bản lấp (đơn đóng 1, kép đóng 1).

  Nhóm B, dựng lại từ khoá gần trùng (3 khoá):
  - 20.1 ← 1.3 (tỉ lệ 0,73): `idha, bhante, sambahulā …` là cùng một câu với 1.3, nhưng ở thì hiện tại và lời của chư tỳ-kheo.
    Bản lấp giữ nguyên chuỗi từ của Sujato (“several ascetics, brahmins, and wanderers who follow various other
    religions … holding different views, beliefs, and opinions, relying on different views”), đổi “were residing”
    thành “are residing” và chèn lại “Sir,” (`bhante`); nháy kép mở theo Pāli.
  - 21.2 ← 2.2 (tỉ lệ 0,94): cùng câu `sassato attā ca loko ca, idameva saccaṁ moghamaññan` nhưng Pāli ở 21.2 dùng nháy đơn
    và kết bằng `…pe…`; bản lấp dùng lời Sujato của 2.2 (“The self and the cosmos are eternal. This is the only truth,
    anything else is futile.”) trong nháy đơn, rồi đúng một `…`.
  - 22.3 ← 18.1 (tỉ lệ 0,67) và 22.2: phần `bhaṇḍanajātā … viharanti` lấy từ 18.1; phần “không biết lợi, bất lợi, pháp,
    phi pháp” (`te atthaṁ ajānantā …`) chèn lại cho khớp 22.2.

  Nhóm C, tự dịch từ Pāli (4 khoá), theo thuật ngữ của Sujato ở bài Udāna 6.4 đã ghim (cùng đoạn Pāli):
  - 19.3 `ekamantaṁ nisinnā kho te bhikkhū …etadavocuṁ`: “Seated to one side, those mendicants said to the Buddha,”.
  - 22.1 `aññatitthiyā, bhikkhave, paribbājakā andhā acakkhukā` và 22.2 `te atthaṁ na jānanti …` dùng lại, từng chữ
    của Sujato ở ud6.4:16.1 và ud6.4:31.2 (“the wanderers of other religions are blind and sightless”; “They don’t
    understand what is beneficial or what is not beneficial, nor what is the truth and what is not the truth.”), vì
    Pāli trùng và đây là cùng một Udāna; chỉ thêm “Mendicants,” (`bhikkhave`) và nháy kép mở.
  - 26.5 `Chaṭṭhaṁ.` → “Sixth.” theo khuôn nhãn thứ tự đã lấp. Ud 6.6 là bài thứ sáu của phẩm 6 nên nhãn khớp số
    thứ tự, không có cảnh báo.

  Dấu lược: 21.2 là khoá duy nhất có `…pe…` trong 27 khoá; bản lấp ghi đúng một `…`. Mọi khoá khác không có `…` trong Pāli
  và bản lấp không thêm.

  Chỗ cố ý lệch Sujato: không sửa chữ nào của Sujato. Chỉ đổi dấu nháy ở bốn khoá (21.4, 21.5, 22.4, 22.5) cho khớp Pāli, đổi thì
  “were residing” → “are residing” ở 20.1, và ở 22.3 đổi “They were fighting” thành “Not understanding … they are fighting” để mệnh đề `ajānantā` có chỗ đứng.

  Số khoá trống còn lại: 0 (27/27 khoá `fillableSegments` đã lấp, trong đó 5 khoá không vào coverage vì dưới 40 ký tự Pāli).

