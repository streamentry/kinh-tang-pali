  Triangulation 8.5: scorecard Việt của ud6.6 (`content/meta/sutta/kn/ud6.6.yaml`) do tác giả và công cụ chấm khác họ với bản lấp
  này, nên có cơ sở đối chiếu độc lập về tác giả. Nhưng bản lấp không có bản Anh thứ hai (Sujato để trống đúng các khoá
  này), nên không cao hơn 8.5. Đối chiếu có: Pāli root, Sujato đã ghim ở các khoá lân cận và ở ud6.4, bản Việt canonical (chỉ đối chiếu nghĩa).

