notes: |-
  2.4 trùng nguyên văn 1.3 → lấy nguyên văn 1.3, chỉ đổi `Tena kho pana samayena`
  ("Now at that time") thành `idha, bhante` ("Sir"): "“Sir, while King Udena was
  visiting a park, his royal compound burned down. Five hundred women died, with
  Queen Sāmāvatī at their head." Giữ dấu trong "Sāmāvatī" vì bản Anh đã ghim của
  chính bài đã dùng; cơ chế lớp lấp cho phép tên riêng có dấu khi bản đã ghim của
  cùng tầng dùng.

  2.3 = `Ekamantaṁ nisinnā kho te bhikkhū bhagavantaṁ etadavocuṁ:`. Khuôn
  `Ekamantaṁ nisinno/nisinnā … bhagavantaṁ etadavoca(et)` đã ghim 26 lần với hình
  thức "Seated to one side, Venerable X said to the Buddha:" (vd sn47.13:4.3,
  ud2.10:3.1, ud3.2:2.1). Số nhiều thì dùng "those mendicants" cho khớp 3.1 của
  chính bài ("Then those mendicants went up to the Buddha"). Dịch: "Seated to one
  side, those mendicants said to the Buddha:".

  Hệ quả người đọc thấy, nói thẳng thay vì giấu: bản đã ghim ở 2.2 đã gộp SẴN nội
  dung của 2.3 vào ("…sat down to one side, and told him had happened. They asked the
  Buddha," — câu cuối còn lỗi chính tả "told him had happened", thiếu "what"). Nên
  đọc 2.2 → 2.3 sẽ thấy lặp "sat down to one side" rồi "Seated to one side". Bỏ thì
  2.3 thành orphan, gộp thêm vào 2.2 thì vượt quá phạm vi một segment. Tương tự,
  ngoặc mở ở 2.4 không được đóng trong lát này vì khoá kế 2.5 đã đã ghim với một
  cặp ngoặc riêng. `vietnamese_clarity` hạ 8.8 vì hai hệ quả này người đọc thấy
  được.

  Lớp lấp: 2 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
