  LUẬT 3 TỰ GIỮ (quan trọng nhất của lát này, và máy KHÔNG bắt được):
  TỚNG THỨC JĀTAKA: 0.1–0.4 (tiêu đề) + 1.1–1.6 (sáu nhịp) + 2.1 (lời dẫn đóng). Giữ nguyên cấu
  trúc, không gộp, không thêm khoá nào.

  1. 0.1 và 0.2 dùng lại y hệt hai tiền lệ đếm được của lát Jātaka: "Stories of Past Lives 112"
     (83/83 tệp `ja*` đã ghim) và "The Book of the Ones" (80/83).
  2. 0.3 `Haṁcivagga` → "The Swan": không có khoá segment nào đã ghim cho vagga này, nên lấy từ tệp
     TÊN của chính SuttaCentral tại commit đã ghim, ja-name:123.ja-hamcivagga = "The Swan" — cùng
     người dịch, cùng commit.
  3. 0.4 `2. Amarādevīpañhajātaka` → "The Question of Queen Ambrosia: a past life story" và colophon
     2.1 → "The Question of Queen Ambrosia: Second.": tên lấy từ ja-name:125.ja112 = "The Question of
     Queen Ambrosia"; số thứ tự bị bỏ ở 0.4 và giữ ở 2.1, đúng khuôn dùng ở 82/83 tệp `ja*` đã ghim
     và ở 12 tệp `ja121`–`ja134` của lớp lấp.
  4. `Yena` (1.1, 1.3, 1.4) lặp ba lần với ba nghĩa: "by which" (cái đã vẽ nên bị nung) và "by
     which I give / by which I do not give". Tôi dùng lại y hệt "by which … by that …" cho cả 1.3
     và 1.4, vì đối xứng `yena … tena …` chính là ý của nhịp kệ; rven88.py không báo lỗi ở đây vì
     từ khác nhau, nhưng đây là chỗ tôi tự giữ luật 3.
  5. `yavamajjhakassa` (1.5) dùng lại y hệt với 1.5/1.6 của cùng câu kệ: "barley-eater", không đổi
     thành "bird"/"sparrow" ở chỗ thứ hai.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO:
  - `channapatha` → "six-footed path": 0 tiền lệ trong tầng Anh đã ghim. Chọn vì `channa` là sáu
     và `patha` là chân, và đây là ẩn dụ quen thuộc cho sáu giác. Không thêm "(the six senses)" vào
     bản kinh vì Pāli không nói ở đây.
  - `sattubilaṅgā` → "seven doubles" và `diguṇapalāso` → "doubly scorched and blooming": KHÔNG có
     tiền lệ nào cho cả hai (0 lượt). Xem mục BẤT ĐỊNH.
  - `dadāmi`/`vadāmi` ở 1.3 và 1.4 giữ nguyên "give"/"say", theo đối xứng của Pāli.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU:
  - 1.1–1.2 `Yena sattubilaṅgā ca, Diguṇapalāso ca pupphito` là câu hỏi của con thú trong truyện,
     mà câu trả lời nằm ở 1.3–1.4. Nghĩa của `bilaṅga` (bộ đôi/kép) và `diguṇapalāsa` (bị
     thiêu đốt ở cả hai đầu, hay cháy xanh) ở đây rất khó; tôi dịch sát chữ và KHÔNG thêm "con
     thồng" hay "bộ lông" vào, vì đoán sẽ là bịa. Đây là lý do ambiguity hạ xuống 8.8.
  - `Amarādevī` chỉ xuất hiện trong tên bài; thân truyện (vua Bặc Xà, hoàng hậu hạnh phúc) nằm
     ngoài lát này, nên "Queen Ambrosia" là bản dịch tên của SuttaCentral đã ghim, không phải do
     tôi bịa.CỔNG KỸ THUẬT: đã chạy và PASS — `save_fill` (khẳng định cả 5 luật cơ học cho từng khoá: chỉ
  điền khoá Pāli có chữ và bản ghim để trống; số dấu lược/ngoặc mở/ngoặc đóng/dấu hỏi khớp
  Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không khoảng trắng đôi),
  và `rven88.py` (0 cờ "từ Pāli lọt", 0 cờ "sót chữ tắt", 0 cỗ "ngoặc mở treo"). CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm chạy
  vì chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity` chấm 9.8 chứ
  không 10.0, và đây là việc NGƯỜI ĐIỀU PHỐI phải chạy lại trước khi coi bài là xuất bản — ghi
  thẳng ra đây thay vì để trong im lặng.Triangulation 8.0 là trần của lớp lấp, ghi ở đây để người biên tập không tưởng là thiếu sót riêng
