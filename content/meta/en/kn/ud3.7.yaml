notes: |-
  4.6 / 4.7 / 4.8 lặp 4.2 / 4.3 / 4.4 — cả ba khoá đối chiếu đều đã được bản Anh đã
  ghim dịch — nên lấy nguyên văn theo luật 3, chỉ giữ đúng số ngoặc mà từng khoá Pāli
  yêu cầu: 4.6 có `“` (mở), 4.7 không ngoặc, 4.8 có `”` (đóng, vì Pāli `”ti.`).

  Vì sao bài có hai bộ ba câu giống hệt nhau, và điều đó ĐÚNG chứ không phải lỗi
  lặp: 4.1 nói Sakka "expressed this heartfelt sentiment three times" và cho bộ ba
  đầu ở 4.2–4.4. 4.5 thì ĐỨC THẾ TÔN nghe `tikkhattuṁ udānaṁ udānaṁ udānaṁ
  udānentassa` — `tikkhattuṁ` nghĩa là "ba lần" — nên bộ ba thứ hai ở 4.6–4.8 chính
  là thứ Đức Thế Tôn nghe. Sujato dịch 4.5 làm rơi chữ "three times" ("…while
  sitting in the sky."), nên bộ ba thứ hai trông như lặp; các khoá 4.6–4.8 lấp lại
  đúng số lần làm nó đọc ra cấu trúc thật của kinh. Chỉ dịch phần thấy được, không
  thêm chữ nào.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ. `ambiguity_integrity` 9.4 vì đây là lát ít phải quyết định
  nhất: mọi khoá đều là sao chép nguyên văn từ khoá đối chiếu.
