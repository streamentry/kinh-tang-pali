notes: |-
  4.1 mở `“` và toàn bộ 4.1–5.25 là MỘT lời nói của các tỳ-kheo; 5.25 đóng `”ti.` nên bản Anh ở đây chỉ đóng ngoặc, không mở.

  Tiền lệ, hai nguồn kéo nhau: 1. Cả câu `Ayaṁ kho no, bhante, antarākathā vippakatā, atha bhagavā anuppatto` đã được Sujato dịch ở `dn1:1.4.9` và `dn14:1.14.13`: “This was our conversation that was unfinished when the Buddha arrived.” 2. Vế `antarākathā hoti vippakatā` nằm trong chuỗi các bài Udāna và đã được Sujato dịch “was left unfinished” ở `ud2.2:1.5`, `ud3.8:2.6` và — trong CHÍNH bài này — ở `ud3.9:2.25`. Chọn “left unfinished” của nguồn (2) vì người đọc Udāna gặp hai khoá đó trong cùng một bài; cùng bộ khoá 5.x kia thì ở Nikāya khác. Ghi rõ đây là bất định có thật, nên hạ `ambiguity_integrity` 9.2.

  `”ti` → `”`, cùng quy ước đã nêu ở sn55.8.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
