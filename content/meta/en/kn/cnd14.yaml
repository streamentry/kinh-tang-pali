notes: |-
  **Phân loại 90 khoá (bài này không có bản Anh upstream ở snapshot đã ghim, `noEnglishEditionUpstream`; bản lấp là bản dịch độc lập của dự án): A = 4 · B = 0 · C = 86 · D = 0.** A là khoá có Pāli trùng nguyên văn với một khoá đã dịch, dùng lại nguyên văn lời đã dịch: 4 khoá trùng trong chính bài, 0 khoá trùng với khoá của bài khác trong cùng đợt (bốn bài `cnd14`–`cnd17`): `6.5` (= `3.9`), `17.1` (= `8.1`), `17.2` (= `8.2`), `24.2` (= `22.7`). B = 0 vì không có Sujato để dựng lại từ lời đã ghim. D = 0: mọi cặp Pāli trùng nguyên văn trong đợt đều mang cùng một lời Anh. Phép dò chạy trên cả 344 khoá của bốn bài, không chỉ trên bài này.

  **Phạm vi.** Danh sách khoá của bài là 90 khoá Pāli có nội dung (đủ ngưỡng 40 ký tự theo `source/layers.yaml`, bỏ khối `0.x`) mà tầng Anh đã ghim để trống; lớp lấp ghi đủ 90/90, không khoá nào ngoài danh sách, cùng thứ tự Pāli. Còn 84 khoá không lấp, đều dưới ngưỡng 40 ký tự tính trên văn bản gốc kể cả thẻ in đậm (dài nhất 35 ký tự); ngược lại, một vài khoá lemma có thẻ in đậm đủ 40 ký tự kể cả thẻ nên nằm trong danh sách khoá dù chỉ dài dưới 40 sau khi bỏ thẻ: dòng kệ in đậm, dòng kệ nhắc lại trong ngoặc kép, câu dẫn `Tenāha …`, đoạn lemma ngắn, cụm `…pe…` đứng riêng và tiêu đề; chúng không vào coverage và để trống, không ghi thêm.

  **Phương pháp.** Dịch từ Pāli root (`cnd14` ở bản đã ghim), có đọc bản Việt canonical để kiểm nghĩa nhưng không dịch vòng Việt → Anh và không chép từ nó. Bài kệ gốc `snp5.11` (do Sujato dịch, đã ghim) và các bài cùng họ dùng làm tiền lệ thuật ngữ, không chép câu; lời giải ở Cūḷaniddesa là chú giải từng cụm nên lời Anh theo cấu trúc *Từ được giải: lời giải* của bản Việt, và vì Pāli không có dấu nháy ở các lemma ấy nên lời Anh cũng không dùng dấu nháy để đánh dấu lemma. Chữ Pāli giữ trong lời Anh ở 2 chỗ: `vāna` (`24.1`, `24.3`), vì lời giải dựa vào từ nguyên của `nibbāna`, và `Iti` (`24.4`), là chính từ được giải. Không còn chữ Pāli nào khác ngoài tên riêng (Kappa, Māra, Namuci).

  **Thuật ngữ dùng chung bốn bài `cnd14`–`cnd17` (tiền lệ từ bản Anh đã ghim của bài cùng họ, không chép câu):** `saṁsāra` transmigration; `pubbā`/`purimā koṭi` first point và `pacchimā koṭi` last point (như `sn15.1`); `anamataggo` no known beginning; `vaṭṭa` the cycle; `nibbāna` extinguishment; `amata` the deathless; `dīpa` island (`snp5.11`); `sabbe saṅkhārā` all conditions, nhưng `saṅkhāra` trong năm uẩn và `abhisaṅkhāra` là choices, còn `sabbasaṅkhārasamatho` là the stilling of all activities (như `an10.60`); chuỗi `ācikkhati deseti paññāpeti paṭṭhapeti vivarati vibhajati uttānīkaroti` = explains, teaches, asserts, establishes, clarifies, analyzes, discloses (như `sn12.20`, `sn14.13`), thêm `brūhi` = speak/declare và `pakāseti` = reveal (như `an10.99`); `ādikalyāṇaṁ … parisuddhaṁ brahmacariyaṁ` như `an10.99`; `upayupādānā cetaso adhiṭṭhānābhinivesānusayā` như `sn22.112`; `tālāvatthukata anabhāvaṅkata āyatiṁ anuppādadhamma` như `an3.34`; `nābhinandati nābhivadati na ajjhoseti` = does not approve, welcome, or cling (như `mn145`); `pajahati vinodeti byantīkaroti anabhāvaṁ gameti` = gives up, dispels, eliminates, obliterates (như `an3.101`); `khattiya brāhmaṇa vessa sudda` = aristocrats, brahmins, peasants, menials (như `mn63`, `mn93`); `satipaṭṭhāna sammappadhāna iddhipāda indriya bala bojjhaṅga ariyo aṭṭhaṅgiko maggo` theo cách `sn`/`an` đã dịch (kinds of mindfulness meditation, right efforts, bases of psychic power, faculties, powers, awakening factors, noble eightfold path); `vitakka` thought (`snp5.14`); `jhāna` absorption; `kukkucca` remorse; `thina` dullness; `maccudheyya` Death’s dominion (`an10.117`).

  **Chỗ cố ý lệch tiền lệ Sujato, kèm lý do:** (1) `rāga` là greed (như `sn22.112`) nên `gedha` không thể cũng là greed khi cả hai cùng xuất hiện trong lời giải của đợt này (`cnd15:30.7` liệt kê `-gedha-` rồi `-rāga-` thành hai chuỗi song song); `gedha` → avidity (Sujato `snp5.12` dịch `vītagedha` là rid of greed), `sārāga` → intense greed, `lobha` → avarice, `abhijjhā` → covetousness. (2) `kilesa` → corruptions và `āsava` → defilements (như `snp5.12:5.3`); `upakkilesa` → impurity (Sujato `an3.101` dịch corruptions, nhưng trong cùng bài `kilesa` đã giữ chữ ấy). (3) `kiñcana` → possession; Sujato dịch `sakiñcana` là with attachments (`ud2.5`) và `kiñcanaṁ` ở `snp5.12:3.5` là anything at all, nhưng lời giải ở đây liệt kê bảy loại `-kiñcana` (rāga, dosa, moha, māna, diṭṭhi, kilesa, duccarita) nên cần một danh từ giữ được cấu trúc "loại nào của sở hữu"; đây là cách đọc theo lời giải, không phải kết luận về nghĩa gốc. (4) `hāsapañña` → joyful (tiền lệ `an1.600-615` dịch laughing wisdom, nghe như một khả năng hài hước). (5) `ādāna` → taking up (Sujato `snp5.13:3.1` dịch attachments) vì lời giải `cnd16:17.3` giải thích chính động từ `ādiyanti`. (6) `anavaññattipaṭisaṁyutto vitakko` → thoughts connected with not being looked down on (Sujato `an3.101` dịch thoughts of status). (7) `vīra` → hero, `sahajanetta` → one with an innate eye (Sujato `snp5.12:1.4` dịch natural visionary): lời giải `cnd15:7.10` định nghĩa `netta` là con mắt trí toàn tri, nên giữ eye.

  **Bất định (không thêm vào lời Anh).**
  1. `koṭi` làm số đếm (`3.6`–`3.8`, `3.10`, `4.5`–`4.8`, `5.5`–`5.8`, `7.4`) → ten millions (10^7). Giá trị ấy là quy ước chú giải, bản văn không nêu; độ lớn không đổi ý nghĩa của chuỗi vì đây là dãy liệt kê để nói luân hồi không có điểm đầu hay điểm cuối.
  2. `saro` → stream (`2.1`, `15.1`), theo `snp5.11` dịch mid-stream; chuỗi từ đồng nghĩa trong lời giải (transmigration, coming, going, time, destination …) cho thấy đây là ẩn dụ dòng chảy luân hồi, nhưng chưa phân xử được `saro` là dòng chảy hay hồ nước.
  3. `kāla` → time (có thể là cái chết), `bhavābhava` → one existence after another, `nibbatti` → reappearance: ba từ trong chuỗi `2.1` giữ nghĩa gần nhất với từ điển, không có tiền lệ độc lập.
  4. `nijjhātattā` → burned out (`29.4`); nghĩa gốc có thể là quieted. `santattā samitattā` → calmed, settled.
  5. `paṭisandhi` → rebirth-linking (`12.1`), không dịch conception để khỏi mang nghĩa phôi thai.
  6. `vāna` (`24.1`, `24.3`) giữ chữ Pāli vì lời giải dựa trên từ nguyên của `nibbāna`; tiếng Anh không giữ được phép chơi chữ ấy.
  7. `samannāgata` ở `9.1`, `9.2` → afflicted theo văn cảnh (chuỗi bị già chết bủa vây); nghĩa thường là endowed with.

  **Dấu lược và nháy.** 10 khoá có `…` (mỗi `…pe…` của Pāli thành đúng một `…`, và số `…` trong từng khoá khớp Pāli); 4 khoá có ngoặc kép, khớp Pāli từng khoá (số nháy mở và đóng), 0 khoá có nháy đơn, 0 khoá lệch có chủ đích; dấu `’` trong lời Anh chỉ là sở hữu cách (Māra’s, brahmin’s, world’s) hoặc `’s`, không nháy đóng. Không khoá nào rỗng, không khoá nào thừa, NFC.

  **Triangulation 7.0:** không có bản Anh độc lập nào của bài này ở snapshot đã ghim, và bản Việt canonical (`content/meta/sutta/kn/cnd14.yaml`) cùng do nhóm công cụ hỗ trợ khai ở `source/tooling.yaml` làm, nên bản lấp này không phải cách đọc English độc lập và không được tuyên bố là đã đối chiếu bản Anh. Bản Anh của bài kệ gốc `snp5.11` là bản của bài khác, chỉ dùng làm tiền lệ thuật ngữ, không tính là đối chiếu.

  technical_integrity 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, không đặt blocker vì lý do ấy.

