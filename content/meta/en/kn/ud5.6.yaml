notes: |-
  Phân loại 19 khoá (đo bằng máy, Pāli chuẩn hoá bỏ dấu câu, so với mọi khoá Sujato có chữ trong bài):
  A 9 · B 8 · C 2 · D 0. Hai cụm Pāli trùng nhau giữa các khoá cần lấp (không có lời Sujato để dùng lại) cũng
  được giữ cùng một lời: 3.2 = 7.5; 4.1 = 8.1 = 12.1; 4.2 = 8.2; 4.3 = 8.3 (kiểm bằng máy).

  Nhóm A, dùng lại lời Sujato (9 khoá), chỉ đổi dấu nháy để khớp Pāli từng khoá:
  - 4.2 và 8.2 ← 2.2 (và 7.2); 4.3 và 8.3 ← 2.3 (và 7.3). Lời giống hệt Sujato, nhưng Sujato dịch lần
    đầu (2.2–2.3) với một tầng nháy kép; ở 4.x/8.x Pāli có hai tầng (4.1 mở nháy kép, 4.2 mở nháy đơn, 4.3 đóng
    nháy đơn, 4.4 đóng nháy kép). Bản lấp theo Pāli: 4.2 mở bằng nháy đơn (thay “), 4.3 kết bằng nháy đơn
    (thay ”). Đo: 4.2 Pāli (đơn mở 1), bản lấp (đơn mở 1); 4.3 Pāli (đơn đóng 1), bản lấp (đơn đóng 1).
  - 6.3 và 6.4 ← 5.2 và 5.3, nguyên văn, kể cả nháy.
  - 12.2 ← 10.2, đổi nháy kép mở thành nháy đơn mở (Pāli `‘na kho me so …`); 12.3 ← 10.3, thêm nháy đơn đóng
    mà Pāli có (`…cā’ti`) và Sujato không có ở 10.3 (vì 10.2–10.3 của Sujato là câu trích một tầng); 12.4 ← 10.4
    nguyên văn (nháy kép đóng).

  Nhóm B, dựng lại từ khoá gần trùng (8 khoá):
  - 3.2 và 7.5 ← 14.3 (tỉ lệ 0,62): khuôn `ekamantaṁ nisinno … etadavoca`; bản lấp chèn lại phần Sujato đã
    dồn vào 3.1 (“sat down to one side”) và danh xưng đầy đủ “the layman Soṇa of the Sharp Ears” (1.4),
    “Venerable Mahākaccāna”.
  - 11.2 ← 14.3 (tỉ lệ 0,80): cùng khuôn, chủ ngữ là Soṇa đã xuất gia (`āyasmā soṇo`).
  - 4.1, 8.1 và 12.1 ← 2.1 (tỉ lệ 0,60): `idha mayhaṁ, bhante, rahogatassa …` chuyển người nói thành ngôi thứ nhất
    “Sir, while I was in private retreat this thought came to my mind,”; Sujato dịch 2.1 ở ngôi thứ ba.
  - 6.2 ← 5.1 (tỉ lệ 0,75): thêm “For a second time” (`dutiyampi`) và nêu đối tượng là Soṇa.
  - 6.5 ← 5.4 (tỉ lệ 0,90): khác ở chỗ Pāli `dutiyampi` thay `atha`, nên “For a second time, Soṇa’s aspiration to go
    forth died down.”

  Nhóm C, tự dịch từ Pāli (2 khoá):
  - 12.5 `(…)` giữ nguyên là `(…)`: một dấu lược trong ngoặc, đúng một `…`, không mở rộng thành câu nào.
  - 20.5 `Chaṭṭhaṁ.` → “Sixth.” theo khuôn của các nhãn thứ tự đã lấp. Ud 5.6 là bài thứ sáu của phẩm nên nhãn khớp
    số thứ tự, không có cảnh báo.

  Ngoài ra: 6.1 là khoá `Dutiyampi kho …pe…` mà Sujato đã dịch (“For a second time … the outcome was the same”) nên không thuộc lát.

  Chỗ cố ý lệch Sujato: không sửa chữ nào của Sujato. Chỉ đổi dấu nháy ở sáu khoá nhóm A nêu trên cho khớp Pāli,
  và thêm một nháy đơn đóng ở 12.3.

  Số khoá trống còn lại: 0 (19/19 khoá `fillableSegments` đã lấp, trong đó 3 khoá không vào coverage vì dưới 40 ký tự Pāli).

