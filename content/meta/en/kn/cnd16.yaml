notes: |-
  **Phân loại 72 khoá (bài này không có bản Anh upstream ở snapshot đã ghim, `noEnglishEditionUpstream`; bản lấp là bản dịch độc lập của dự án): A = 5 · B = 0 · C = 67 · D = 0.** A là khoá có Pāli trùng nguyên văn với một khoá đã dịch, dùng lại nguyên văn lời đã dịch: 2 khoá trùng trong chính bài, 3 khoá trùng với khoá của bài khác trong cùng đợt (bốn bài `cnd14`–`cnd17`): `3.6` (= `cnd14:22.7`), `4.2` (= `3.6`), `17.19` (= `cnd14:16.10`), `25.11` (= `17.13`), `28.2` (= `cnd14:33.2`). B = 0 vì không có Sujato để dựng lại từ lời đã ghim. D = 0: mọi cặp Pāli trùng nguyên văn trong đợt đều mang cùng một lời Anh. Phép dò chạy trên cả 344 khoá của bốn bài, không chỉ trên bài này.

  **Phạm vi.** Danh sách khoá của bài là 72 khoá Pāli có nội dung (đủ ngưỡng 40 ký tự theo `source/layers.yaml`, bỏ khối `0.x`) mà tầng Anh đã ghim để trống; lớp lấp ghi đủ 72/72, không khoá nào ngoài danh sách, cùng thứ tự Pāli. Còn 136 khoá không lấp, đều dưới ngưỡng 40 ký tự tính trên văn bản gốc kể cả thẻ in đậm (dài nhất 39 ký tự); ngược lại, một vài khoá lemma có thẻ in đậm đủ 40 ký tự kể cả thẻ nên nằm trong danh sách khoá dù chỉ dài dưới 40 sau khi bỏ thẻ: dòng kệ in đậm, dòng kệ nhắc lại trong ngoặc kép, câu dẫn `Tenāha …`, đoạn lemma ngắn, cụm `…pe…` đứng riêng và tiêu đề; chúng không vào coverage và để trống, không ghi thêm.

  **Phương pháp.** Dịch từ Pāli root (`cnd16` ở bản đã ghim), có đọc bản Việt canonical để kiểm nghĩa nhưng không dịch vòng Việt → Anh và không chép từ nó. Bài kệ gốc `snp5.13` (do Sujato dịch, đã ghim) và các bài cùng họ dùng làm tiền lệ thuật ngữ, không chép câu; lời giải ở Cūḷaniddesa là chú giải từng cụm nên lời Anh theo cấu trúc *Từ được giải: lời giải* của bản Việt, và vì Pāli không có dấu nháy ở các lemma ấy nên lời Anh cũng không dùng dấu nháy để đánh dấu lemma. Chữ Pāli giữ trong lời Anh ở 6 chỗ: `nāga` (`1.5`, `6.1`, `6.3`, `6.4`), `āgu` (`6.3`), `jāgu`, `indagu` (`20.2`), `Iti` (`25.12`); tên riêng và tên các xứ ở `9.3`.

  **Thuật ngữ dùng chung bốn bài `cnd14`–`cnd17` (tiền lệ từ bản Anh đã ghim của bài cùng họ, không chép câu):** `saṁsāra` transmigration; `pubbā`/`purimā koṭi` first point và `pacchimā koṭi` last point (như `sn15.1`); `anamataggo` no known beginning; `vaṭṭa` the cycle; `nibbāna` extinguishment; `amata` the deathless; `dīpa` island (`snp5.11`); `sabbe saṅkhārā` all conditions, nhưng `saṅkhāra` trong năm uẩn và `abhisaṅkhāra` là choices, còn `sabbasaṅkhārasamatho` là the stilling of all activities (như `an10.60`); chuỗi `ācikkhati deseti paññāpeti paṭṭhapeti vivarati vibhajati uttānīkaroti` = explains, teaches, asserts, establishes, clarifies, analyzes, discloses (như `sn12.20`, `sn14.13`), thêm `brūhi` = speak/declare và `pakāseti` = reveal (như `an10.99`); `ādikalyāṇaṁ … parisuddhaṁ brahmacariyaṁ` như `an10.99`; `upayupādānā cetaso adhiṭṭhānābhinivesānusayā` như `sn22.112`; `tālāvatthukata anabhāvaṅkata āyatiṁ anuppādadhamma` như `an3.34`; `nābhinandati nābhivadati na ajjhoseti` = does not approve, welcome, or cling (như `mn145`); `pajahati vinodeti byantīkaroti anabhāvaṁ gameti` = gives up, dispels, eliminates, obliterates (như `an3.101`); `khattiya brāhmaṇa vessa sudda` = aristocrats, brahmins, peasants, menials (như `mn63`, `mn93`); `satipaṭṭhāna sammappadhāna iddhipāda indriya bala bojjhaṅga ariyo aṭṭhaṅgiko maggo` theo cách `sn`/`an` đã dịch (kinds of mindfulness meditation, right efforts, bases of psychic power, faculties, powers, awakening factors, noble eightfold path); `vitakka` thought (`snp5.14`); `jhāna` absorption; `kukkucca` remorse; `thina` dullness; `maccudheyya` Death’s dominion (`an10.117`).

  **Chỗ cố ý lệch tiền lệ Sujato, kèm lý do:** (1) `rāga` là greed (như `sn22.112`) nên `gedha` không thể cũng là greed khi cả hai cùng xuất hiện trong lời giải của đợt này (`cnd15:30.7` liệt kê `-gedha-` rồi `-rāga-` thành hai chuỗi song song); `gedha` → avidity (Sujato `snp5.12` dịch `vītagedha` là rid of greed), `sārāga` → intense greed, `lobha` → avarice, `abhijjhā` → covetousness. (2) `kilesa` → corruptions và `āsava` → defilements (như `snp5.12:5.3`); `upakkilesa` → impurity (Sujato `an3.101` dịch corruptions, nhưng trong cùng bài `kilesa` đã giữ chữ ấy). (3) `kiñcana` → possession; Sujato dịch `sakiñcana` là with attachments (`ud2.5`) và `kiñcanaṁ` ở `snp5.12:3.5` là anything at all, nhưng lời giải ở đây liệt kê bảy loại `-kiñcana` (rāga, dosa, moha, māna, diṭṭhi, kilesa, duccarita) nên cần một danh từ giữ được cấu trúc "loại nào của sở hữu"; đây là cách đọc theo lời giải, không phải kết luận về nghĩa gốc. (4) `hāsapañña` → joyful (tiền lệ `an1.600-615` dịch laughing wisdom, nghe như một khả năng hài hước). (5) `ādāna` → taking up (Sujato `snp5.13:3.1` dịch attachments) vì lời giải `cnd16:17.3` giải thích chính động từ `ādiyanti`. (6) `anavaññattipaṭisaṁyutto vitakko` → thoughts connected with not being looked down on (Sujato `an3.101` dịch thoughts of status). (7) `vīra` → hero, `sahajanetta` → one with an innate eye (Sujato `snp5.12:1.4` dịch natural visionary): lời giải `cnd15:7.10` định nghĩa `netta` là con mắt trí toàn tri, nên giữ eye.

  **Bất định (không thêm vào lời Anh).**
  1. `okañjaha` → one who has left the abode (`2.2`): Sujato (`snp5.13:1.1`) dịch bastion-leaver; `oka` là nơi ở, chỗ trú; lời giải `2.2` nói đến chandarāga, upayupādāna … ở năm giới chứ không nói đến thành lũy, nên giữ abode.
  2. `jāgu`, `indagu` (`20.2`) là từ hiếm trong chuỗi đồng nghĩa của `jantu`; không có tiền lệ độc lập để phân xử, nên giữ chữ Pāli thay vì bịa một chữ Anh.
  3. `nāga` (`1.5`, `6.1`, `6.3`, `6.4`) giữ chữ Pāli vì lời giải `6.3` chơi chữ `āguṁ na karoti` / `na gacchati` / `na āgacchati`; Sujato dịch spiritual giant ở `snp5.13`. Ở `26.4` `nāgadanta` là ngà voi, nên cùng một chữ `nāga` mang hai nghĩa trong bài. `āgu` giữ chữ Pāli và dịch là no wrong theo `āguṁ na karoti`.
  4. `5.8` `sādiyāmi` → I consent (như `an3.156`), `jappāmi` → I wish for, `abhijappāmi` → I hanker for; hai động từ cuối là từ khó, không có tiền lệ độc lập.
  5. `24.1` lemma `Bhikkhu sato kiñcanaṁ sabbaloke` thiếu động từ; lời Anh mượn động từ `na upādiyetha` của dòng liền trước (như bản Việt, như `snp5.13:4.1`–`4.2`), nên mệnh đề *should not grasp* là bổ sung do ngữ pháp chứ không có trong khoá này.
  6. `9.3` danh sách mười bảy xứ ở dạng danh từ số nhiều nên dịch là *the people of …*; lemma `janapadehi saṅgatā` là *gathered from the nations*.
  7. `20.1` `paṭisandhiko` → bound up with relinking; `kammābhisaṅkhāra` → the choices of deeds.
  8. `18.10`, `18.16` `abyākata` và `adukkhamasukhā` cùng là neutral (hai từ Pāli khác nhau, một chữ Anh): `abyākatā dhammā` → neutral things, `adukkhamasukhā vedanā` → neutral feeling (như Sujato).
  9. Mười hai khoá lemma ngắn (`1.5`, `3.2`, `3.5`, `6.1`, `10.1`, `18.1`, `18.4`, `18.7`, `18.10`, `22.4`, `24.1`, `26.1`) nằm trong danh sách khoá vì độ dài tính trên văn bản gốc kể cả thẻ in đậm (dưới 40 ký tự sau khi bỏ thẻ); lời Anh không mang thẻ.

  **Dấu lược và nháy.** 14 khoá có `…` (mỗi `…pe…` của Pāli thành đúng một `…`, và số `…` trong từng khoá khớp Pāli); 2 khoá có ngoặc kép, khớp Pāli từng khoá (số nháy mở và đóng), 0 khoá có nháy đơn, 0 khoá lệch có chủ đích; dấu `’` trong lời Anh chỉ là sở hữu cách (Māra’s, brahmin’s, world’s) hoặc `’s`, không nháy đóng. Không khoá nào rỗng, không khoá nào thừa, NFC.

  **Triangulation 7.0:** không có bản Anh độc lập nào của bài này ở snapshot đã ghim, và bản Việt canonical (`content/meta/sutta/kn/cnd16.yaml`) cùng do nhóm công cụ hỗ trợ khai ở `source/tooling.yaml` làm, nên bản lấp này không phải cách đọc English độc lập và không được tuyên bố là đã đối chiếu bản Anh. Bản Anh của bài kệ gốc `snp5.13` là bản của bài khác, chỉ dùng làm tiền lệ thuật ngữ, không tính là đối chiếu.

  technical_integrity 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này (cấm của người điều phối), nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ, không đặt blocker vì lý do ấy.

  **Hệ quả với `content/meta/reference-gaps.yaml`:** `kn/cnd16` có record (substantiveSegments 72, substantiveWithoutEnglish 72, coverage 0). Sau khi bài `published`, English phủ 72/72 = 1,0000 (trước lớp lấp là 0/72 = 0,0000); độ nhạy: ngưỡng 0,8 cho phép thiếu tối đa 14 khoá, thiếu 15 là rớt. Record thành thừa, `npm run reference:gaps` sẽ bỏ nó khi người điều phối sinh lại; lát này không đụng tệp ấy.
