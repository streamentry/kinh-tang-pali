notes: >-
  Bản lược (colophon) của Dhammapada. Bản Anh đã ghim để trống cả vế này lẫn 423:9–11
  (`Satevīsacatussatā` / `catusaccavibhāvinā` / `Satattayañca vatthūnaṁ`).
  
  **Tên phẩm dùng tên tiếng Anh của Sujato, không dùng tên Pāli.** Lý do là cơ chế: lớp lấp
  chỉ chấp nhận một từ có dấu Pāli khi bản Anh đã ghim của chính bài đó cũng dùng từ đó, và
  Sujato không dùng `Yamaka`, `Taṇhā`… trong bài này. Dùng tên Pāli sẽ bị chính chốt của
  dự án báo là Pāli lọt vào bản Anh. Danh sách 26 tên: Pairs · Diligence · The Mind ·
  Flowers · The Fool · The Astute · The Perfected Ones · The Thousands · Wickedness · The Rod
  · Old Age · The Self · The World · The Buddhas · Happiness · The Beloved · Anger · Stains ·
  The Just · The Path · Miscellaneous · Hell · Elephants · Craving · Mendicants · Brahmins.
  
  Số lấy thẳng từ Pāli theo thứ tự, không cộng tay: 14, 9, 9, 12, 15, 11, 10, 14, 12, 11, 9,
  10, 11, 9, 8, 9, 8, 12, 10, 12, 9, 9, 8, 12, 12, 40.
  
  **Dừng đúng chỗ Pāli dừng.** `iti pañcādhikāni tīṇi vatthusatāni` nối sang 423:9 mà 423:9
  đang trống; ghép hai khoá lại để ra một tổng hoàn chỉnh sẽ là bịa — Pāli ở commit đã ghim
  không xác nhận tổng ấy.
  
  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
