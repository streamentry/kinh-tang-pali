notes: |-
  TIÊU ĐỀ: `ja-name:158.ja142` = "The Jackal ", khớp `siṅgāla`; "jackal" 31 lượt
  trong tầng Anh đã ghim. 0.3 `Kakaṇṭakavagga` → "Chameleons": đây là dạng đa số trong tầng
  (6 tệp, gồm cả ja142/146 của lát này) chống lại "The Iguana Who Befriended a Chameleon"
  (3 tệp, ja148/149) — theo luật "đếm được thì đếm thắng". Ghi lại vì tệp tên của
  SuttaCentral lại chọn vế kia; tôi theo tầng vì nó là tiền lệ số lượng nhiều hơn và
  đã ghim, còn vế kia chỉ là tiêu đề tóm tắt cốt truyện.

  CHỈ SỬA 2.1: "The Jackal Story, the second." → "The Jackal: Second." (định dạng đa số
  của tầng, xem notes chung).

  BẤT ĐỊNH ĐÃ GHI: `Yassa te kaḍḍhamānassa` (1.3) — "trong lúc ngươi bị kéo đi", tức
  `kaḍḍhamāna` là dạng đang bị kéo (chịu động từ). Tôi dịch "while you are being dragged
  away", không thêm chủ thể nào. `matasāyikaṁ` (1.2) là "có vẻ như đã chết / nằm bất
  động"; tôi dịch "lie as still as a corpse" — thêm "as … as" là cách nói tiếng Anh, không
  thêm mệnh đề. `hatthā daṇḍo na muccatī` (1.4) → "the club does not leave your hand"
  (`muccati` = thoát ra, `daṇḍa` = gậy; "club" 7 lượng, "gậy" là nghĩa thô hơn).

  KHÔNG CHẠY ĐƯỢC CỔNG KỸ THUẬT — ĐÃ HẠ `technical_integrity` XUỐNG 9.8. Đợt này cấm
  chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tôi KHÔNG
  tuyên bố technical gate pass. Bốn lệnh đó xin người điều phối chạy; nếu chúng đỏ thì
  `status: published` phải hạ xuống `draft`.

  CHỐT CỦA KHO ĐÃ CHẠY VÀ PASS: `save_fill` kiểm đủ 5 luật cơ học cho 131 khoá này —
  (1) không khoá nào nằm ngoài `fillableSegments`; (2) không mở rộng `…pe…`; (3) đếm
  dấu lược / ngoặc mở / ngoặc đóng / dấu hỏi khớp PẪN NHIÊU TỪNG KHOÁ; (4) không chữ
  Pāli có dấu nào lọt vào bản Anh (danh sách cho phép lấy theo CẢ TẦNG, nên `Nāvindakī`
  và `Sudassana`… hợp lệ); (5) NFC, không khoảng trắng đôi. `tests/unit/english-fill.test.ts`
  cũng đòi mỗi fill có metadata + 10 tiêu chí — đây là 14 tệp đó.

  LUẬT 3 ("Pāli trùng thì dùng lại lời đã có") — MÁY KHÔNG BẮT ĐƯỢC Ở LÁT NÀY, TÔI TỰ
  ĐẾM. `save_fill` chỉ in cảnh báo khi Pāli trùng ở khoá khác **có bản Anh đã ghim**.
  Tôi tự viết script so Pāli của 14 bài này với (a) nhau, (b) toàn bộ fill đã có trong
  tầng, (c) Pāli root của mọi bài trong tầng `an`/`kn` — kết quả đính kèm ở báo cáo.

  BẢN ANH ĐÃ GHIM: tại commit đã ghim SuttaCentral KHÔNG xuất bản bản Anh nào cho bài
  này. Đo lại bằng cách dò trực tiếp cache, không tin `upstreamPublishes`:
  `grep -rl '"ja108:' .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/` rỗng
  (83 tệp `ja*` có mặt, không tệp nào chứa bài này), và cùng cách cho `mil3.6.6`, `ne27`,
  `pv48`. Vì vậy đây KHÔNG phải lấp chỗ trống quanh một bản ghim, mà là **bản Anh của
  chính dự án, viết từ Pāli một mình**: không có tầng Anh nào độc lập để đối chiếu cú
  pháp, sắc thái hay thuật ngữ. Đây là giới hạn thiết kế của lớp `english-project` ở
  những bài không được xuất bản, KHÔNG phải thiếu sót của bài này và KHÔNG phải blocker.
  Bản Việt dự án ở `content/translation/vi/project/sutta/kn/<uid>.json` chỉ dùng để đối
  chiếu NGHĨA, không phải nguồn; nó lại cùng do một agent chấm nên không thay được tầng
  đối chiếu. Tầng `vietnamese-current` (HT. Thích Minh Châu) `absent` — đặc điểm của
  snapshot upstream, đã ghi ở `skill/translation.md` §7.

  TIỀN LỆ ĐẾM ĐƯỢC (chung cho cả 9 bài Jātaka của lát):
  `Jātaka` → "Stories of Past Lives <số>": 82/83 tệp Sujato đã ghim trong tầng `kn`;
  `Ekakanipāta` → "The Book of the Ones": 80/83; khoá 0.4 `N. Xjātaka` → "<Tiêu đề>: a past
  life story" (bỏ số thứ tự): 82/83; khoá 2.1 `Xjātakaṁ <thứ>ṁ.` bị Sujato ĐỂ TRỐNG ở
  79/83 — đúng là những khoá phải lấp. Riêng khoá 2.1 thì lớp fill của dự án đang KHÔNG
  thống nhất vì nhiều agent chạy song song: 21/37 tệp dùng "<Tiêu đề>: <Số thứ>.",
  4 tệp dùng "<Tiêu đề>, <số thứ>.", 12 tệp dùng "The <X> Story, the <số thứ>.".
  Tôi chọn định dạng đa số (21/37) và áp cho CẢ 9 bài của lát, kể cả 4 bài đã có sẵn trên
  đĩa — nếu không, chính lát của tôi sẽ mang hai định dạng. Phần còn lại của tầng cần một
  lượt chuẩn hoá riêng; tôi không sửa tệp lát khác.
