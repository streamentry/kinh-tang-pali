notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI: không có tệp `english-sujato` cho `ja107` tại commit đã ghim
  (đếm `files` của tầng đó trong `source/upstream-manifest.json`; `sutajato()` = 0/9 khoá).
  Đây là bản Anh của chính dự án viết từ Pāli một mình, không có tầng Anh độc lập để đối
  chiếu; tầng Việt hiện hành ở commit đã ghim chỉ có Pháp Cú. Đây là giới hạn thiết kế của
  lớp lấp, KHÔNG phải blocker.

  TIÊU ĐỀ: ja-name:119.ja107 = "The Benefits of Good Aim" trong tệp tên đã ghim.
  `Sālittaka` là tên riêng của câu chuyện; tầng Việt đã xếp vào nhóm nghĩa cụm không chắc,
  nên tôi KHÔNG dịch nghĩa `Sālittaka-` mà để tiêu đề của chính SuttaCentral đứng ra.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO:
  - `sippakaṁ nāma` (1.1) → "The craft is good indeed": 0 lượt trong tầng. `nāma` là "quả
    thật là", `sippaka` là khéo léo. 1.2 `api yādisa kīdisaṁ` → "however good or bad it may
    be" giữ cả hai mệnh đề của Pāli.
  - `khañjappahārena` (1.3) → "by the lame man's blow": 0 tiền lệ cho `khañja`; tầng Việt đọc
    là người què. Tôi chỉ dịch "a blow" và KHÔNG thêm ném đá, dù tên câu chuyện gợi ý thế.
  - `laddhā gāmā` (1.4) → "the villages won": giữ `laddhā` là "được", không thêm chủ thể
    chiếm đoạt (câu kệ không nêu).

  CỔNG KỸ THUẬT: `save_fill` PASS 9/9 khoá; `rven88.py` không báo cờ nào. CHƯA chạy —
