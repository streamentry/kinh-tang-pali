notes: |-
  `ud5.3:8.2` là khuôn `Ekamantaṁ nisinnā kho te bhikkhū bhagavantaṁ etadavocuṁ:`.
  Pāli TRÙNG NGUYÊN VĂN `ud7.3:2.3`, và khoá đó đã có trong chính lớp lấp này
  ("Then, seated all together, the mendicants said to the Buddha:"). Dùng lại nguyên
  văn: nếu dịch lại từ đầu, hai bài Udāna trong cùng một tầng sẽ gọi cùng một khung
  bằng hai cách, và người đọc sẽ không biết đó là cùng một công thức.

  Lưu ý: Sujato đã gộp sẵn nội dung 8.2 vào 8.1 ("…and said to him,"), nên cột Anh của
  bài này có hai vế "said to him" liền nhau. Giữ nguyên vì 8.2 có Pāli riêng; bỏ đi thì
  khoá này lại thành orphan. Triangulation 8.0: tại commit đã ghim không có bản Anh
  nào khác phủ cho câu này.

  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
