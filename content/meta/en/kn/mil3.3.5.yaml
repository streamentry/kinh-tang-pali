notes: |-
  **Bài này không có bản Anh upstream ở snapshot đã ghim** (`noEnglishEditionUpstream`: tầng `english-sujato` không phát hành tệp nào cho `mil`, xem `source/upstream-manifest.json`). Vì vậy cả 21 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) đều nằm trong `fillableSegments`, và bản lấp này là **bản dịch độc lập của dự án**, viết từ Pāli root; bản Việt canonical chỉ dùng để kiểm nghĩa, không dịch vòng qua nó. Không có bản Anh để đối chiếu, nên bản lấp **không** phải cách đọc English độc lập và **không** được tuyên bố là đã đối chiếu bản Anh.

  **Phân loại 21 khoá (đo bằng máy): A = 2 · B = 0 · C = 19 · D = 0.** B (dựng lại từ lời đã ghim) bằng 0 vì không có lời đã ghim nào để dựng lại. A (Pāli trùng nguyên văn với một khoá đã lấp trong cùng bài, nên dùng lại từng chữ): `6.6` ← `5.6`; `8.6` ← `5.6`. Ngoài ra có 6 khoá thuộc 2 nhóm Pāli gần trùng (chỉ khác hoa/thường, dấu câu hoặc nháy): mỗi nhóm dùng cùng một cách dịch cho phần trùng.

  **Khoá trống còn lại: 18 (trên tổng 39 khoá không tính `:0`).** Tất cả đều dưới ngưỡng 40 ký tự (dài nhất 38): tiêu đề, câu nối, lời đáp ngắn, colophon — không vào coverage nên không lấp; đã đo: không còn khoá nào ≥ 40 ký tự chưa lấp.

  **Thuật ngữ và bất định.**

  - Bất định có thật ở các bộ phận nhạc cụ và đồ nhóm lửa, vì từ vựng hiếm và không có tiền lệ trong tầng Sujato: 5.2/5.4 `patta · camma · doṇi · daṇḍa · upavīṇa · tantiyo · koṇa` → “bowl · skin · frame · neck · bridge · strings · plectrum”; 6.2/6.4 `araṇi · araṇipotaka · araṇiyottaka · uttarāraṇi · coḷaka` → “fire-stick · fire-stick base · fire-stick cord · upper fire-stick · tinder cloth”; 7.2 `maṇi` → “crystal”. Các danh từ này có thể đã đúng hướng nhưng không phân xử được tên chính xác từng bộ phận; nghĩa của cả ví dụ (mỗi thứ phải có đủ điều kiện thì tiếng/lửa mới sinh) không bị ảnh hưởng.

  - 8.2/8.4 `attā` (trong `jāyeyya attā`) dịch “a reflection of oneself”: cách đọc theo ngữ cảnh gương – ánh sáng – khuôn mặt; bản Việt đọc là “bản ngã”. Đây là bất định có thật, vì `attā` cũng là chữ “self”. Tôi chọn “reflection” vì ví dụ gương chỉ có nghĩa nếu cái sinh ra là hình phản chiếu.

  - `abhavantā jāyanti` → “come to be without having existed”, `bhavantāyeva … jāyanti` → “only … that already exist … come to be”. Các khoá 5.6, 6.6, 8.6 trùng Pāli nguyên văn; 2.4 và 4.3 (khác chữ hoa đầu câu), 7.6 (khác một dấu phẩy) và 3.3 (thêm `te`, nên “those formations”) gần trùng — đều dùng cùng một lời Anh.

  **Thuật ngữ chung của loạt Milindapañha** (nhất quán với các bản lấp `mil` đã có): `mahārāja` → “Great King” (tiền lệ Sujato: 198 lượt, ở `kn` 6), `bhante` đứng riêng → “venerable sir”, `bhante nāgasena` → “Venerable Nāgasena”. Điểm này **cố ý lệch** các bản lấp `mil` đã có (dùng “Sir Nagasena” / “venerable Nagasena” không dấu): quy ước của loạt này là tên riêng giữ dạng Pāli có dấu và “Venerable” theo Sujato. `Kallosi` ở cuối bài là khoá ngắn nên không lấp ở đây.

  **Nháy và dấu lược (đo từng khoá):** số nháy kép mở/đóng và nháy đơn mở/đóng của 21/21 khoá khớp Pāli (dấu `’` có chữ thường đứng ngay sau được loại ra như dấu nhạt lược), không có ngoại lệ lệch. Dấu lược `…`: Pāli 0 (tính `…pe…` là một), bản lấp 0. Không thêm khoá ngoài danh sách; không khoá rỗng; NFC.

  **Triangulation 7.5 (trần của lớp lấp).** Tầng Anh đã ghim không có bài này và bản Việt canonical của bài do cùng nhóm công cụ hỗ trợ của dự án làm ra (xem `source/tooling.yaml`), nên không có cách đọc English hay tiếng Việt độc lập nào để đối chiếu cú pháp và sắc thái. Bản Việt chỉ giúp phát hiện chỗ hiểu sai, và đã được dùng như vậy (những chỗ bản lấp lệch bản Việt, nếu có, đã nêu ở mục thuật ngữ và bất định). Đây là giới hạn của bản lấp, không phải thiếu sót riêng của bài.

  **Coverage (đo theo `src/lib/canon/reference.ts`, mẫu số là khoá Pāli ≥ 40 ký tự bỏ `:0` = 21).** Trước: 0/21 = 0,0000 (Sujato không phát hành, chưa có lớp lấp). Sau, khi `published`: 21/21 = 1,0000. Độ nhạy: ngưỡng 0,8 đòi tối thiểu 17/21 khoá có lời; bài chịu được mất tối đa 4 khoá mà vẫn qua ngưỡng; nếu `status` không phải `published` thì lớp lấp tồn tại mà coverage vẫn 0.

  **Hệ quả với `content/meta/reference-gaps.yaml`:** bài có record (`kn/mil3.3.5`, 21/21 khoá không có English, coverage 0). Sau khi lớp lấp `published` record ấy thành thừa; tôi không chạm tệp đó, người điều phối chạy lại `npm run reference:gaps`.

  **technical_integrity 9.6** là điểm chưa qua cổng: trong lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ người điều phối. Không đặt blocker vì lý do đó.
