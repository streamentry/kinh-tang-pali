notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI: không có tệp `english-sujato` cho `ja98` tại commit đã ghim
  (`sutajato()` = 0/9 khoá). Bản Anh của chính dự án, viết từ Pāli một mình; tầng Việt hiện
  hành ở commit đã ghim chỉ có Pháp Cú. Giới hạn thiết kế của lớp lấp, KHÔNG phải blocker.

  TIÊU ĐỀ: ja-name:109.ja98 = "The Cheating Merchant" trong tệp tên đã ghim. 0.3 `Littavagga`
  → "A Smear of Poison" theo ja-name:101.ja-littavagga; xét lý do sửa cùng ghi chú của ja94
  ("We Drank" là tên của phẩm khác).

  CHỖ PHẢI LÀM NGƯỢC VỚI CHÍNH MÌNH, GHI LẠI: Pāli ở 1.4 kết bằng `upakūḷitoti.` — có `ti`
  nhưng KHÔNG có avagraha, nên không đóng nháy kép. Chốt đếm ngoặc theo từng khoá, vì vậy 1.4
  ở đây dịch "he was embraced in my heart." KHÔNG có dấu `”`, dù câu vẫn mở nháy từ 1.1. Tương
  tự, ja94:1.1. Ở đây chốt và Pāli thắng.

  TIỀN LỆ ĐẾM ĐƯỢC: `paṇḍita` → "wise" và `atipaṇḍita` → "extremely wise" (tầng Việt đã đếm
  34 và 8 lượt cho hai chữ này). `upakūḷita` → "embraced" (tầng Việt "ôm lấy", 13 lượt).

  BẤT ĐỊNH VÀ ĐIỀU CHỈNH:
  (1) `tveva` ở 1.2 khuếch đại lực phủ định của `na`, nên dịch "but not to be called extremely
  wise;" chứ không phải "merely" — giữ mức độ. Đây là điều chỉnh cố ý so với cách lược bớt.
  (2) `manamhi upakūḷitoti` là thể bị động; chủ thể là NGƯỜI CON (vế 1.3 nêu công cụ
  `Atipaṇḍitena puttena`), còn `manamhi` ("trong tâm") là nơi chứ không phải chủ sở hữu của
  `ta`. Vì vậy 1.3 dịch công cụ "By a son who is extremely wise," và 1.4 dịch "he was embraced
  in my heart." chứ không dịch thành mối quan hệ sở hữu. Đây là chỗ dễ làm sai nhất của bài.
  (3) `Kūṭavāṇija` tầng Việt xếp vào nhóm nghĩa cụm không chắc; nhưng tiêu đề đã lấy từ tệp
  tên của SuttaCentral tại commit đã ghim nên không phải tự dịch.

  CỔNG KỸ THUẬT: `save_fill` PASS 9/9 khoá; `rven88.py` không báo cờ nào. CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát bị lệnh cấm).
  `technical_integrity` 9.8; NGƯỜI ĐIỀU PHỐI phải chạy lại bốn lệnh đó.
  Triangulation 8.0 là trần của lớp lấp.
