notes: |-
  **Phân loại 1 khoá (`bv26:52.1`, đo bằng máy): A = 0 · B = 0 · C = 1 · D = 0.** A và D: không có khoá nào khác trong bài có Pāli trùng với khoá này. B: không có lời đã ghim nào để dựng lại. C: tự dịch từ Pāli.

  **Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`); bản lấp là bản dịch độc lập của dự án**, viết từ Pāli, không phải lấp quanh một bản Anh đã xuất bản. Vì vậy mọi khoá Pāli có nội dung đều đang để trống ở tầng Anh đã ghim, không có khoá nào bị shadow, và không có bản Anh nào để đối chiếu cú pháp hay sắc thái.

  **Số khoá đã ghi: 1/1 khoá của `keys`.** Pāli có 215 khoá; chỉ khoá `bv26:52.1` đạt ngưỡng 40 ký tự, vì phần còn lại của bài là câu kệ ngắn (mỗi dòng dưới 40 ký tự) và tiêu đề. Các khoá còn lại để trống: dưới ngưỡng nên không vào coverage, và đây là cách phân tách hợp lệ của lát chứ không phải thiếu sót của bản lấp. Khoá lấp không chứa `…`, nháy kép, nháy đơn hay ngoặc; Pāli cũng không có.

  **Khoá là câu kết phẩm `<Tên Phật> bhagavato vaṁso <số thứ tự>`.** `vaṁso` dịch *chronicle* (bản Việt dùng *dòng kế thừa*, vì `vaṁsa` còn nghĩa *dòng dõi*; chưa phân xử được giữa hai cách đọc, chọn *chronicle* vì đây là tên của bộ Buddhavaṁsa). Số thứ tự là thứ tự của vị Phật trong chuỗi hai mươi lăm vị (Atthadassī thứ mười bốn, Dhammadassī thứ mười lăm, Vipassī thứ mười chín, Vessabhū thứ hai mươi mốt, Kakusandha thứ hai mươi hai, Koṇāgamana thứ hai mươi ba, Kassapa thứ hai mươi tư, Gotama thứ hai mươi lăm), không phải số của phẩm `bv26`; số thứ tự dịch đúng theo chữ Pāli (`catuvīsatimo.`). Tên riêng giữ đúng dạng Pāli có dấu và dạng chính tả của khoá Pāli (-ī, -ū cho thân từ).

  **Thuật ngữ.** `bhagavā` → *Blessed One*; `vaṁso` → *chronicle*; số thứ tự Pāli → số thứ tự Anh viết bằng chữ. Không có chỗ cố ý lệch tiền lệ Sujato ngoài những điều nêu ở trên (Sujato không dịch Buddhavaṁsa nên không có tiền lệ cho khoá kết phẩm).

  **Bất định.** Không có bất định về nghĩa của khoá; bất định duy nhất là chọn *chronicle* hay *lineage* cho `vaṁso`, không ảnh hưởng nghĩa của câu.

  **Triangulation 7.5: đây KHÔNG phải cách đọc English độc lập và bài KHÔNG được tuyên bố là đã đối chiếu bản Anh.** Không có bản Anh Sujato của bài này; bản Việt canonical của bài do cùng họ công cụ (theo `source/tooling.yaml`) thực hiện (`content/meta/sutta/kn/bv26.yaml`), nên hai bản không độc lập. Bản Việt chỉ dùng để kiểm nghĩa. Điểm hơi cao hơn các bài `cnd` vì khoá chỉ có một câu rất ngắn, không có chỗ để chọn thuật ngữ khó.

  Hệ quả với `content/meta/reference-gaps.yaml`: `kn/bv26` CÓ record (substantiveSegments 1, substantiveWithoutEnglish 1, coverage 0). Sau khi `published`, coverage của `kn/bv26` là 1/1 = **1,0000**; trước lớp lấp là 0/1 = 0. Bài đang ở `published`. Mẫu số chỉ là 1 nên cổng này gần như không có độ nhạy: thiếu một khoá là coverage về 0. Record sẽ thừa khi bài `published`; việc sinh lại `reference-gaps.yaml` là của người điều phối.

  technical_integrity 9.6: trong lát này không được chạy `npm run validate`, `npm test`, `npm run check` và `npm run build`, nên không tuyên bố technical gate đã pass. Bốn lệnh đó còn nợ, giao cho người điều phối khi gom; không đặt blocker vì lý do này.
