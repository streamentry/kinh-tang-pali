notes: |-
  Phân loại 25 khoá: A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 5 · C (tự dịch từ Pāli) = 20 · D (trùng Pāli nhưng dịch khác) = 0. B (dựng lại từ lời có sẵn) = 0, vì không có tầng Anh nào để dựng. Các nhóm Pāli trùng: 1.6 = 2.4; 1.7 = 2.5; 1.8 = 2.6; 3.3 = 4.7; 3.4 = 4.8.

  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`); bản lấp là bản dịch độc lập của dự án, viết từ Pāli root một mình, dùng bản Việt canonical chỉ để kiểm nghĩa. Vì vậy mọi khoá Pāli đều “để trống” ở tầng Anh, và không có khuôn B (dựng lại từ lời Sujato). Tiền lệ thuật ngữ lấy từ các bài mil đã có lớp lấp (mil3.1.7, mil3.3.1, mil3.4.7, mil3.6.5…: “Great King”, “venerable sir”, “the Blessed One”, “lay follower”, “dispensation”, “Saṅgha”, “mendicants”) và từ bản Anh Sujato của các bài cùng họ (sn5.10, sn3.20, dn17, sn22.5…), chỉ làm tiền lệ chữ, không chép câu.

  BẤT ĐỊNH THẬT: `apilāpana` / `apilāpeti` (1.3–1.8, 2.x) dịch “reminding / reminds one of”. Nghĩa Vism của `sati` là “không trôi nổi/không để rơi mất” (apilāpana), nhưng trong chính bài này vế áp dụng và hai ví dụ (người giữ kho `sarāpeti` vua, câu `taṁ devo saratū`) đòi nghĩa “nhắc / làm nhớ lại”, nên chọn “reminding”. Bản Việt canonical dịch “không bị gọi hỏi” — đọc khác, báo ngoài lane. `upaggaṇhana` → “taking up”, `apanudeti` → “rejects”. `sappaṭibhāga` → “together with their counterparts”.

  Thuật ngữ theo tiền lệ Sujato: `pariṇāyakaratana` → “commander-treasure” (dn17:1.18.1); `satipaṭṭhāna` → “kinds of mindfulness meditation”, `iddhipāda` → “bases of psychic power”, `vipassanā` → “discernment”, `vimutti` → “freedom”, `vijjā` → “knowledge”. `hirañña` → “money”, `yasa` → “glory” (2.2). Bản Việt canonical dịch `pariṇāyakaratana` là “người giữ dây cương” — lệch; báo ngoài lane.

  Pāli 4.9 có lỗi chính tả nguồn `upakāre damme` (đúng ra `dhamme`); English dịch như 3.5 vì nghĩa không đổi. 1.7 và 2.5 Pāli chỉ khác dấu phẩy nên English giống nhau. A = 5 cặp (1.6=2.4 · 1.7=2.5 · 1.8=2.6 · 3.3=4.7 · 3.4=4.8).

  Khoá trống còn lại: bài có 37 khoá Pāli, đã lấp 25; 12 khoá còn trống đều dưới ngưỡng 40 ký tự (tiêu đề, câu ngắn, mục danh sách ngắn, kệ ngắn, colophon) nên không vào coverage và lát này không lấp; toàn bộ 25 khoá có nội dung (≥ 40 ký tự) đã có lời.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài này CÓ record (substantiveSegments 25, substantiveWithoutEnglish 25, coverage 0); sau khi `published` coverage của `kn/mil3.1.13` lên 25/25 = 1.0 (trước: 0/25 = 0.0), nên record thành thừa — để người điều phối sinh lại, bản lấp không chạm tệp đó. Độ nhạy: ngưỡng 0,80 cần ít nhất 20/25 khoá; còn dư 5 khoá.

  Triangulation 7.5: bài không có bản Anh độc lập nào để đối chiếu; bản Việt canonical của bài do họ công cụ khác làm, nhưng nó và bản lấp cùng đọc một Pāli và không có bản Anh nào đứng giữa, nên bản lấp này KHÔNG phải cách đọc English độc lập và KHÔNG được tuyên bố là đã đối chiếu bản Anh. Đối chiếu thực có: Pāli root và bản Việt canonical (chỉ để kiểm nghĩa).

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối.
