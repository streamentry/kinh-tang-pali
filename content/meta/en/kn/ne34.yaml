notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI: không có tệp `english-sujato` cho `ne34` tại commit đã ghim
  (`sutajato()` = 0/8 khoá). Bản Anh của chính dự án, viết từ Pāli một mình; tầng Việt hiện
  hành ở commit đã ghim chỉ có Pháp Cú. Giới hạn thiết kế của lớp lấp, KHÔNG phải blocker.

  XÁC NHẬN ĐỘC LẬP MỘT ĐIỂM: tệp tên của SuttaCentral tại commit đã ghim,
  `name/sutta/ne-name_translation-en-sujato.json` ne-name:40.ne34 = "Conveying Requisites:
  Combined Treatment" — đúng hai chữ "Conveying Requisites" mà tôi dùng ở 0.4 và ở 2.3. Vậy
  lựa chọn `parikkhāra` → "requisite" không phải đặt mới mà là trùng với chính cách đặt tên
  của tầng tham khảo. Chữ "requisites" ở 2.2 là số nhiều vì Pāli `parikkhāro` ở đó đứng
  danh vị.

  TIỀN LỆ ĐẾM ĐƯỢC TRONG TẦNG (7 bài `ne*` đã có ở lớp lấp, tính cả chính bài này):
  0.2 "Counter-demonstrative Subsection" (7/7); 0.3 "Combined Treatment N" (6/7, riêng ne29
  gộp thêm tên phẩm vào: "Conveying Synonyms: Combined Treatment"); 2.1 dùng ĐÚNG Y HỆT "“Therefore,
  of the one whose mind is guarded, right thought is his range”. This is the verse." vì Pāli ở
  2.1 trùng y hệt với 6 bài kia (7 bài có khoá này thì 6 trùng tuyệt đối, chỉ ne29 là ngoại
  lệ) — máy không bắt được vì không có bản ghim, nên phải tự giữ. 2.3 theo khuôn "The conveying of X has been
  applied." (ne24:2.6 và ne30:2.6), và 1.1 theo khuôn đa số "And what is the conveying of X?"
  (ne24:1.1, ne30:1.1) thay vì dạng "X-conveying" của ne28.

  MỘT SỬA SO VỚI BẢN ĐANG NẰM TRONG TỆP TỪ LƯỢT CHẠY TRƯỚC: 2.2 Pāli là
  `Ayaṁ samathavipassanāya parikkhāro.` — chỉ nói "bản lạc cung này", KHÔNG có `hārasampāto`,
  nên bản cũ thêm chữ "conveying" là thêm. Đã sửa thành "This is the requisite for tranquility
  and insight." 1.1 cũng sửa theo khuôn đa số.

  BẤT ĐỊNH: `niyutto` ở 2.3 → "has been applied": chữ này còn được dùng cho nhiều nghĩa khác,
  và ở đây Netti dùng theo nghĩa "đã được ấn định/đã vận dụng"; tôi bám khuôn 5 tệp của
  tầng. `samatha`/`vipassanā` → "tranquility and insight" bám khuôn ne28:2.2.

  CỔNG KỸ THUẬT: `save_fill` PASS 8/8 khoá; `rven88.py` không báo cờ nào. CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát bị lệnh cấm).
  `technical_integrity` 9.8; NGƯỜI ĐIỀU PHỐI phải chạy lại bốn lệnh đó.
  Triangulation 8.0 là trần của lớp lấp.
