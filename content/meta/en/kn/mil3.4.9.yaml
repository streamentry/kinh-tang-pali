  TẦNG NÀY KHÔNG CÓ BẢN ANH ĐỂ ĐỐI CHIẨU. Kiểm lại bằng hai cách độc lập trước khi
  tin: (1) `source/upstream-manifest.json` → `editions[english-sujato].files` không có
  tệp nào có tên bài này; (2) `sutajato()` của harness đọc thẳng cache → 0 khoá nào có
  chữ trong toàn bộ bài, nên `fillable` = số khoá Pāli. Vì vậy đây KHÔNG phải lấp chỗ
  trống quanh một bản Anh đã ghim, mà là **bản Anh của chính dự án, viết từ Pāli một
  mình**: không có tầng Anh nào độc lập để so cú pháp, sắc thái hay cách dịch thuật
  ngữ. `triangulation` vì thế chấm 8.0 cho **CẢ bài**, không phải vài khoá. Đây là
  giới hạn thiết kế của lớp lấp — KHÔNG phải blocker, không phải thiếu sót phát
  sinh; ghi ra đây để người biên tập không đọc nhầm thành lỗi riêng của bài.

  LUẬT 3 "PĦLI TRÙNG THÌ DÙNG LẠI LỜI ĐÃ CÓ" — MÁY KHÔNG BẤT ĐƯỢC Ở LÁT NÀY, TỰ GIỮ
  BẰNG SCRIPT: `save_fill` chỉ in cảnh báo khi Pāli trùng ở khoá khác **có bản Anh đã
  ghim**; 12 bài của lát không có bản ghim nên nó im lặng hoàn toàn. Đã viết
  `_re0_dup.py` đếm Pāli trùng giữa 15 bài của lát với toàn bộ tầng `en/project`
  (822 khoá): 9 cụp trùng trong chính lát (24 khoá là bản lặp) và 18 cụp trùng với
  bài khác; mỗi cụp giữ **một lời duy nhất**, và cụp nào đã có tiền lệ commit thì dùng
  đúng lời đó.

  BẢN VIỆT DỰ ÁN `content/translation/vi/project/sutta/kn/mil3.4.9_translation-vi-project.json` có đủ 8/8 khoá; dùng để **đối chiếu nghĩa**, không làm nguồn — nó cùng do một agent chấm nên không phải là lớp đọc độc lập, và `vietnamese_clarity` / `han_viet_balance` ở đây chấm theo bản Việt ấy chứ không theo một bản Việt đã xuất bản. Chỗ nào hai lớp bất đồng thì Pāli là authority và bất đồng được ghi ở mục dưới.

  TỚNG THỨC MILINDAPAÑHA: 0.1–0.3 (tiêu đề) + 1.1 (`Rājā āha—`) + 1.2–1.3 (hỏi
  –đáp) + 2.1 (vua khen) + 3.1 (`Nibbānalabhanapañho navamo.`). Giữ nguyên.

  TIỀN LỄ ĐẾM ĐƯỢC (dùng chung cho `mil3.4.9` và `mil3.7.13`): `Milindapañha` →
  "Questions of King Milinda" (20 tệp đã có); `Nibbānavagga` → "Extinguishment"
  (mil3.4.7:0.2, mil3.4.8:0.2 — CÙNG Pāli, một lời duy nhất); `Rājā āha—` →
  "The King said—" (6 tệp commit so với 5 tệp "The king said—", đa số thắng);
  `“Kallosi, bhante nāgasenā”ti.` → "“Good is it, sir Nagasena”." (8 tệp so với 7 tệp
  "“Well done, venerable Nagasena!”"); `bhante nāgasena` → "Sir Nagasena" (mil3.4.8,
  mil3.5.4, mil3.6.9, mil3.7.12, mil3.7.14 — cùng phẩm với hai bài của tôi);
  `Arūpadhammavavatthānavagga` → "Formless Phenomena" (mil3.7.10/.12/.14:0.2).

  PĀLI TRÙNG ĐÃ GIỮ MỘT LỜI (đếm bằng `_re0_dup.py`): `Milindapañha` (0.1),
  `Rājā āha—` (1.1) và `“Kallosi, bhante nāgasenā”ti.` (2.1) trùng y hệt với mil3.7.13;
  cả hai bài dùng một lời cho mỗi cụp.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO: dãi năm vế ở 1.3
  (`abhiññeyye … abhijānāti`, `pariññeyye … parijānāti`, `pahātabbe … pajahati`,
  `bhāvetabbe … bhāveti`, `sacchikātabbe … sacchikaroti`) dịch theo đúng năm danh từ của
  Pāli — "things that should be known / understood / abandoned / developed / realized".
  Dãi này chỉ xuất hiện một lần trong Pāli đã ghim và cũng đều trống, nên không có tiền lệ
  để bám; nó dựng từ chính cấu tạo `X-abba / X-ī` (danh từ chủ động / động từ) và khớp
  với bản Việt dự án ("pháp nào cần thắng tri thì thắng tri…"). Vì đặt mới nên hạ
  terminology.

  `sammā paṭipanno` = "whoever has entered rightly" (bản Việt dự án: "ai thực hành đúng
  đắn"); giữ "entered" vì `paṭipanna` là từ ngữ kỹ thuật về người đã nhập bồi đề, và
  tầng đã ghim dùng "entered" cho cùng từ này ở bài khác. `nibbāna` → "extinguishment"
  là tiền lệ của đúng phẩm `Nibbānavagga` trong tầng. 1.2 hỏi `sabbeva` (số nhiều) nên
  dịch "do all of them attain…", không phải "does everyone".

  Colophon 3.1 giữ khuôn `Tiêu đề, thứ tự.` vì đó là khuôn của 8 tệp Milindapañha đã
  commit (và của mil3.5.4, mil3.6.6 do lát khác ghi cùng đợt) — khác với Jātaka đã
  chuẩn hoá sang dấu hai chấm.

  CỔNG KỸ THUẬT: `save_fill` PASS cho từng khoá (5 luật cơ học: chỉ điền khoá Pāli có
  chữ và bản Anh đã ghim để trống; số dấu lược / ngoặc mở / ngoặc đóng / dấu hỏi khớp
  Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không khoảng
  trắng đôi). Quét bổ sung trên riêng 15 tệp của lát: 0 cờ "từ Pāli lọt", 0 cờ "sót
  `pe…`", 0 cỗ "ngoặc treo", 0 cờ khoảng trắng đôi; 3 cờ "lặp cụm" đều hợp lệ và đã
  giải trình trong `notes` (xem `mil3.7.13.yaml` và `ud6.2.yaml`). CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm
  chạy vì chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity`
  chấm 9.8 chứ không 10.0, và đây là việc NGƯỜI ĐIỀU PHỐI phải chạy lại trước khi coi
  bài là xuất bản — ghi thẳng ra đây thay vì để trong im lặng.

