notes: |-
  2.2 = `“āyasmā, bhante, nando bhagavato bhātā mātucchāputto sambahulānaṁ bhikkhūnaṁ
  evamāroceti:`. Vế sau lấy nguyên văn 1.3 của chính bài ("Venerable Nanda, the
  Buddha’s brother and maternal cousin, informed several mendicants:"); cách xưng hô
  theo khuôn "Sir, Venerable …" đã đếm 6 lần (xem `notes` của ud2.10).

  2.3 = `‘anabhirato ahaṁ, āvuso, brahmacariyaṁ carāmi … hīnāyāvattissāmī’”ti.`
  trùng nguyên văn 1.4 + 1.5, lấy nguyên văn chuỗi đã ghim: "“I lead the spiritual
  life dissatisfied. I am unable to keep up the spiritual life. I shall resign the
  training and return to a lesser life.”"

  Dấu câu ở 2.3 là chỗ phải đọc kỹ: Pāli là `‘…’”ti.` — một dấu đóng trong (lời Nanda)
  và một dấu đóng ngoài (lời vị tỳ-kheo kể lại). Bản Anh cũng phải có HAI dấu đóng.
  Ngoặc mở trong nằm ở chính 2.3, còn ngoặc mở ngoài đã nằm ở 2.2, nên đọc chuỗi
  2.2 → 2.3 thì cân: một `“` mở ngoài, một `“` mở trong, `’` đóng trong, `”` đóng
  ngoài. Đây là cách lồng trích dẫn, không phải dấu thừa.

  16.6 trùng NGUYÊN VĂN 15.2, lấy nguyên văn: "‘Sir, Venerable Nanda—who is both
  the Buddha’s half-brother and maternal cousin—has realized the undefiled freedom of
  heart and freedom by wisdom. He lives having realized it with his own insight in
  this very life due to the ending of defilements.’"

  BẤT ĐỊNH ĐÃ THỪA NHẬN, và đây là điểm bài sẽ nghe hai giọng về cùng một người:
  bản đã ghim dịch `bhātā mātucchāputto` theo HAI kiểu. 1.3 và 5.1 viết "the
  Buddha’s brother and maternal cousin"; 15.2 viết "who is both the Buddha’s
  half-brother and maternal cousin". Mỗi khoá lấp bám đúng khoá trùng nguyên văn
  của nó, nên 2.2 theo 1.3 còn 16.6 theo 15.2. Hòa hai thành một là sửa bản đã ghim.
  `ambiguity_integrity` hạ 9.2 vì lệch này người đọc thấy được.

  Lớp lấp: 3 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
