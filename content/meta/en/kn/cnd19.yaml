notes: |-
  **Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`).** Thư mục `kn/` của tầng `english-sujato` chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud, không có `cnd`; mọi khoá Pāli của `cnd19` đều "để trống" ở tầng Anh. Bản lấp này là **bản dịch độc lập của dự án**, viết từ Pāli root, không phải bản lấp quanh một bản Anh đã ghim.

  **Phạm vi: 225 khoá / 225 khoá có nội dung** (Pāli ≥ 40 ký tự tính thô, bỏ khối `0.x`; mẫu số khớp record ở `reference-gaps.yaml`). 223 khoá còn lại đều ngắn hơn 40 ký tự (dài nhất 39): 4 nhãn `0.x`, dòng kệ, mục từ ngắn, câu dẫn `Vuttañhetaṁ bhagavatā—`, các dòng `…pe…` và `…`, dòng nhắc lại cụm từ; chúng không vào coverage nên không lấp. Hai khoá chỉ đạt 40 ký tự khi tính cả thẻ in đậm (`17.2`, `21.1`) vẫn được lấp, theo đúng cách đếm của record.

  **Cấu trúc.** Phần Cūḷaniddesa chú giải câu hỏi của thanh niên Mogharāja (`snp5.16`): giải *cakkhumā* qua năm loại mắt, *sakka*, *isi*, rồi *suññato lokaṁ avekkhassu* với các đoạn kinh trích (`sn35.82`, `sn22.59`, `sn12.37`, `mn22`, `sn35.85`, `mn26`/`mn25`, `sn6.1`/`mn85`). Mục từ in đậm trong Pāli (26 khoá trong phần lấp) được tách khỏi lời giải bằng dấu hai chấm; không đặt nháy quanh mục từ vì Pāli không có nháy ở đó.

  **Phân loại A/B/C/D: A = 16 · B = 0 · C = 209 · D = 0.** A (dùng lại đúng một lời): `36.13`←`36.6`; `37.10`←`37.8`; `38.5`←`38.3`; `39.5`←`39.3`; `40.5`←`40.3`; `41.5`←`41.3`; `45.7`←`44.7`; `49.6`, `49.14`, `49.22`, `49.25`←`49.3`; `49.10`←`49.8`; `49.24`←`49.5`; `49.29`←`49.13`; `61.4`, `62.2`←`60.8`. Các khoá lặp chỉ khác chữ hoa đầu câu hay dấu nháy mở/đóng so với khoá nguồn (`36.6` mở nháy, `36.13` đóng nháy). Ngoài ra `49.3`, `49.6`, `49.8`, `49.10`, `49.14`, `49.22`, `49.25` khác nhau ở đại từ giống (`taṁ`/`sā`), tiếng Anh không phân giống nên cùng một lời; `49.12` (`te`, số nhiều) là *Giving them up*. B không dùng vì không có bản Anh ghim hay bản lấp nào của bài để dựng lại. D = 0. Hai khoá trùng Pāli với `cnd18` và dùng cùng một lời: `31.1`=`cnd18:11.1`, `68.2`=`cnd18:50.2`.

  **Tiền lệ thuật ngữ (không chép câu).** Đã dò: 62 khoá có Pāli trùng nguyên văn một khoá đã có English ở bài khác (chủ yếu `mn22`, `mn35`, `sn35.82`, `sn35.85`, `sn22.59`, `mn25`, `sn12.37`, `sn22.33`, `mn26`, `mn38`, `mn132`, `dn14`; một số chỉ có ở bản lấp của dự án), thêm 26 khoá gần trùng (Jaccard ≥ 0,55: `mn26`, `sn35.85`, `mn119`, `sn6.1`, `sn22.59`, `sn35.246`, `mn108`, `mn18`, `mn85`, `sn12.62`, `sn55.28`, `sn41.3`). Từ đó giữ: *wears away* (`lujjati`), *empty of self or what belongs to self*, *compel* (`labbhati` ở `sn22.59`), *lead to affliction*, *mass of suffering*, *legitimate question* (`dn3`), *world system* (`an3.80`), *the eye of the flesh*, *clairvoyance* (`dibbacakkhu`), *the eye of wisdom*, *the eye of a Buddha*, *the King of Death*, *theory of self* (`snp5.16:4.3`), *flax flower* (`umāpuppha`), *champak flower* (`kaṇikāra`), *thicket of views / desert of views*. Mọi câu đều tự dịch từ Pāli; bản Việt canonical chỉ dùng để kiểm nghĩa.

  **Chỗ cố ý khác tiền lệ, kèm lý do.** (1) `20.1` `devīsi` → *divine seer* (`snp5.16:1.4`). (2) `21.27` `devadevo` → *god of gods*, `narāsabho` → *bull of men* (Sujato ở `thag10.1` dịch `devadevo` là *king of kings* trong ngữ cảnh khác). (3) `4.4` `samantacakkhu` → *the all-seeing eye*: tầng Sujato không có tiền lệ cho thuật ngữ này. (4) `7.2` `hāsapañño` → *of joyful wisdom* và `purisadhorayho` → *yoke-bearer among men*: không có tiền lệ. (5) `8.4`: `attho` dịch *benefit* ở nhóm đầu (`attattho` … `samparāyiko`) và nhóm cuối (`anavajjo` … `paramattho`), *meaning* ở nhóm giữa (`uttāno` … `nīto`), vì Pāli dùng một từ cho hai nghĩa; đây là lựa chọn diễn đạt, ghi rõ ở đây. (6) `50.23`: Pāli có thêm từ `suññaṁ` trước `manosamphassapaccayā` mà `50.10` và `sn35.85:1.8` không có; dịch đúng chữ (*the empty feeling … that arises*) thay vì bỏ.

  **Dấu lược và nháy.** Pāli có 10 khoá chứa `…` trong tập lấp (`3.4`, `31.1`, `43.1`, `45.1`, `56.6`, `61.1`, `63.1`, `64.1`, `65.1` là `…pe…`; `5.3` là `(…)`); bản lấp đúng 10 dấu: mỗi `…pe…` thành đúng một `…`, `(…)` giữ nguyên là `(…)`; ba khoá kết `…pe….` (`63.1`, `64.1`, `65.1`) giữ ` ….`. Các khoá `…` trần dưới ngưỡng nên không lấp. Nháy khớp Pāli từng khoá, 0 lệch (đo bằng phép đo đếm `“ ” ‘ ’`, loại dấu nhạt lượu `’` + chữ thường). Các cụm nháy chạy qua ranh giới khoá giữ như Pāli: `6.4`→`6.5`, `36.6`→`36.13`, `42.2`→`43.2`, `49.2`→`49.17`, `49.21`→`49.30`, `50.2`→`50.3`, `50.4`→`50.24`, `54.2`→`54.11`. `54.11` (`ahanti vā mamanti vā asmīti vā`) và `26.2`: Pāli không có nháy quanh *I*, *mine*, *I am*, bản lấp cũng không (khác Sujato).

  **Số Pāli đã tính.** `2.8`: 16 mục `-dhanaṁ` = 16 *wealth of*. `6.7`: 15 mục `lokadhātu` (một … năm mươi, một trăm, ba mức nghìn, `mahāsahassī`, rồi `yāvatakaṁ`). `14.6`: 6 loại tính hạnh. `46`: sáu phương diện; `47`: mười; `48`: mười hai (đếm 12 vế phủ định ở `48.2`, 10 vế ở `47.2`). `5.2`–`5.3`: năm màu; `4.3`–`4.4`: năm loại mắt. Không có số lớn nhân thang.

  **Bất định (không thêm vào thân kinh).** 1. `13.3` `upakkhittakā … sampajjanti` → *end up drawn in as followers*: nghĩa chưa phân xử được, giữ thận trọng. 2. `20.1` `no saṁsāreti` → *does not put it off*: nghĩa của `saṁsāreti` ở đây không chắc. 3. `14.12` `attano ñāṇacaritassa` → *whose own temperament is intelligent*: `attano` thừa so với ba loại kia. 4. `5.6` `indagopaka` (*indagopaka beetles*) và `5.7` `ariṭṭhaka` (*ariṭṭhaka fruit*): giữ tên Pāli vì tên Anh không chắc; `5.7` `addāriṭṭhaka` hiểu là *fresh*. `45.2` `setakaccha` (giữ tên Pāli), `pālibhaddaka` → *coral tree*, `udumbara` → *cluster fig*, `marīci` → *mirage* là nhận dạng cây/vật theo từ điển, không chắc. 5. `11.1` `timitimiṅgalaṁ` → *the leviathan-gulper* (Sujato dịch `timi`, `timiṅgala` ở `an8.20`; hợp chất lặp ở đây không có tiền lệ); `12.1` `garuḷaṁ venateyyaṁ` → *the garuda Venateyya*. 6. `5.11` `kāḷapakkho ca uposatho` → *the sabbath in the dark fortnight* (Sujato dịch `uposatha` là *sabbath* ở `an3.70`). 7. `10.2` `āvajjana` → *adverting*; `9.1` `ñāṇānuparivatti` → *follow knowledge*. 8. `21.8` `vipallāsa` → *perversion*. 9. `26.2` `dakkhati` → *perceive*, `adhigacchati` → *grasp* (chuỗi sáu động từ, không có tiền lệ về thứ tự). 10. `37.2` `avasiyapavattasallakkhaṇavasena` → *by recognizing that its course is beyond control*, `tucchasaṅkhārasamanupassanāvasena` → *by observing that choices are vacuous*. 11. `54.2` `samannesati` → *examines*. 12. `56.6` `kāye kāyānupassanāsatipaṭṭhānaṁ` → *the establishment of mindfulness of observing the body in the body*. 13. `57.7`: chuỗi 27 từ về kiến, một số chỉ có nghĩa suy từ ngữ cảnh. 14. `2.10` `vigatalomahaṁso … sakko`: nghĩa *Sakyan* ở vế này chỉ là cách chơi chữ của chú giải. 15. `14.6` `vitakkacarita` → *of discursive temperament*, `rāgacarita` → *of lustful temperament*: không có tiền lệ Sujato.

  **Triangulation 7.5 và giới hạn.** Bản lấp này **không phải cách đọc English độc lập** và **không được tuyên bố là đã đối chiếu bản Anh**: không có bản Anh nào của `cnd19` ở snapshot đã ghim, và bản Việt canonical của bài do cùng nhóm công cụ hỗ trợ khai ở `source/tooling.yaml` thực hiện.

  **Hệ quả với `content/meta/reference-gaps.yaml`.** Bài có record (225 khoá có nội dung, 225 chưa có English, coverage 0). Sau khi `published`: 225/225 = 100% (trước: 0/225). Độ nhạy: ngưỡng 0,8 cần ≥ 180/225, tức thiếu tối đa 45 khoá. Record sẽ thành thừa; sinh lại thuộc bước gom, không sửa tay.

  **Bốn lệnh còn nợ** (không chạy ở lượt này): `npm run validate`, `npm test`, `npm run check`, `npm run build`. `technical_integrity` đặt 9.6, không 10.0.
