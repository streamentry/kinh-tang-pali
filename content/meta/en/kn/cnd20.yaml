notes: |-
  **Phạm vi và vị thế của bản lấp.** Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`): thư mục `kn` của edition Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; không có tệp `cnd20_translation-en-sujato.json`. Vì vậy mọi khoá Pāli đều "để trống" ở tầng Anh, và bản lấp này là **bản dịch độc lập của dự án**, viết từ Pāli, không phải chỗ bù cho một bản Anh có sẵn. Chỉ ghi các khoá có nội dung (Pāli >= 40 ký tự, kể cả thẻ in đậm của nguồn): 67 khoá, đúng bằng danh sách được giao; các khoá ngắn hơn (tiêu đề, dòng kệ ngắn, câu nhắc lại cụm từ) để trống vì dưới ngưỡng và không vào coverage.

  **Triangulation 7,5, nói thẳng.** Bản lấp này **không** phải cách đọc English độc lập và **không** được tuyên bố là đã đối chiếu bản Anh: không có bản Anh nào để đối chiếu, và bản Việt canonical của bài (`translators`/`assessed_by` cùng nhóm công cụ với bản lấp này) được dùng chỉ để kiểm nghĩa, không dịch vòng Việt sang Anh. Các câu kệ trùng với `snp5.17` và `snp5.18` được dùng làm tiền lệ thuật ngữ (đối chiếu từ vựng, không chép câu): `Jiṇṇohamasmi…` (old, feeble, pallid), `rūpesu vihaññamāne` (harmed on account of form), `taṇhādhipanne` (sunk in craving), `santāpajāte jarasā parete` (tormented, mired in old age), `Pārāyanaṁ` (the Way to the Far Shore), `sampannacaraṇaṁ isiṁ` (the seer of consummate conduct), `varapaññassa` (outstanding wisdom), `ādiccabandhunā` (Kinsman of the Sun), `gacche pāraṁ apārato` (from the near shore to the far).

  **Cách trình bày lemma.** Nguồn là văn chú giải từng cụm; Pāli đánh dấu cụm được giải bằng thẻ in đậm rồi `ti`. Bản Anh viết `Cụm được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`. Không có dấu nháy nào được thêm quanh lemma, vì Pāli của khoá không có nháy; nháy `“ ”`, `‘ ’` chỉ có ở các khoá mà Pāli có nháy, và khớp từng khoá (0 lệch). Dấu `’` còn lại trong lời Anh đều là dấu nhạt lược (`that’s`, `one’s`, `doesn’t`, `Buddha’s`), không phải nháy đóng. Dấu lược: `…pe…` của Pāli thành đúng một `…`, và chỉ ở những khoá Pāli có nó (0 lệch).

  **Bốn số A/C/D (cnd20, 67 khoá).** A = 8, C = 59, D = 0; B không áp dụng ở bài này vì không có lời Anh đã ghim để dựng lại. A gồm 8 nhóm Pāli trùng nguyên văn trong bài (mỗi nhóm hai khoá, đều dùng lại nguyên văn lời đã dịch ở khoá đầu của nhóm): `6.1`/`21.1` (`Ācikkha dhammaṁ yamahaṁ vijaññan`), `6.4`/`21.4`, `7.1`/`22.1`, `10.2`/`16.2` (định nghĩa `rūpaṁ`), `11.2`/`25.8` (`Piṅgiyā`ti bhagavā…), `11.3`/`25.9` (`Bhagavā`ti gāravādhivacana…), `25.2`/`28.2` (`Taṇhā`ti rūpataṇhā…), `30.2`/`30.4` (câu Pháp nhãn). 0 nhóm trùng mà lời Anh khác. Thêm vào đó, 5 khoá của bài có Pāli trùng một đoạn kệ chỉ khác thẻ in đậm với khoá ngắn không được lấp: `1.3`/`8.3`, `1.5`/`8.5`, `18.3`/`23.3`, `18.4`/`23.4`, `18.5`/`23.5`. Các khoá bên `8` và `23` dưới ngưỡng 40 ký tự (không có thẻ in đậm) nên để trống; bản Anh của các khoá có thẻ in đậm được viết thành đúng lời kệ để người đọc đối chiếu được.

  **Dùng lại giữa các khoá liên quan trong bài.** `18.3` + `18.4` ghép lại thành câu của `20.2` và là phần đầu của `20.1`; `16.4` kết thúc bằng đúng đoạn tiếp theo `yathā te …pe…` mà `28.5` dịch riêng, và hai nơi dùng cùng một chuỗi Anh cho `punapaṭisandhiko bhavo … paṭippassambheyya` (`punagatiyā` ở `28.5` và `puna gatiyā` ở `16.4` chỉ khác cách viết). Chuỗi tám động từ `ācikkhāhi desehi paññapehi paṭṭhapehi vivarāhi vibhajāhi uttānīkarohi pakāsehi` dùng một chuỗi Anh ở `6.2` và `21.3`: explain, teach, assert, establish, clarify, analyze, disclose, reveal. Chuỗi bốn từ `taṅkāraṇā taṁhetu tappaccayā taṁnidānā` dùng một chuỗi Anh ở `15.2` và `27.2`.

  **Thuật ngữ và tiền lệ (đo trên các tệp Anh đã ghim).** `jiṇṇo vuḍḍho mahallako addhagato vayoanuppatto` -> old, elderly, senior, advanced in years, having reached the final stage of life (theo `mn82`, `mn91`, `sn22.1`); `vīsavassasatiko jātiyā` -> a hundred and twenty years old (theo `mn91:2.1`), thêm "from birth" cho `jātiyā`. `cattāro satipaṭṭhāne … ariyaṁ aṭṭhaṅgikaṁ maggaṁ` -> four kinds of mindfulness meditation, four right efforts, four bases of psychic power, five faculties, five powers, seven awakening factors, noble eightfold path (theo `dn22`, `mn118`; chuỗi `ādikalyāṇaṁ … pakāsetha` theo `dn4`, `dn6`). Danh sách hình phạt `10.5` theo `mn13:14.3` và `mn14:13.3` (porridge pot, shell-shave, Rāhu’s mouth, garland of fire, burning hand, bulrush twist, bark dress, antelope, meat hook, coins, caustic pickle, twisting bar, straw mat; `addhadaṇḍaka` -> clubbing), nhưng **bỏ nháy đơn quanh tên các hình phạt** vì Pāli của khoá không có nháy. `nibbāna` -> extinguishment, `jātijarāmaraṇa` -> rebirth, old age, and death, `rūpa` -> form, `pamāda`/`pamatta` -> negligence/negligent và `appamatta` -> diligent (theo `snp5.17`). `sokaparidevadukkhadomanassupāyāsa` -> sorrow, lamentation, pain, sadness, and distress (theo `sn3.18`, `sn45.3`). `diṭṭhibyasana` -> loss of view (theo `dn33`, `an5.130`). `khattiya … sudda` -> aristocrats, brahmins, peasants, and menials.

  **Chỗ cố ý khác tiền lệ.** (1) `ruppanti` (12.2, 12.3, 12.6, 13.1, 13.22) dịch **afflicted**, không theo `sn22.79` (`ruppati` -> deformed, nói về chính sắc) và không theo `snp5.17:2.3`/`mn105` (inflicted): ở đây chủ ngữ là chúng sinh chịu khổ vì bệnh, đói, nắng, mất lợi dưỡng, nên *deformed* sai ngữ cảnh còn *inflicted* mơ hồ. (2) `rūpataṇhā` ở `25.2` dịch **craving for sights** theo quy ước giác quan của tầng đã ghim, dù `rūpa` ở các khoá kế dịch *form*: hai chữ cùng gốc Pāli, khác ngữ cảnh (sáu loại ái so với năm uẩn). (3) `dhammataṇhā` -> craving for thoughts. (4) `ācikkhāhi desehi paññapehi paṭṭhapehi vivarāhi vibhajāhi uttānīkarohi pakāsehi` theo ánh xạ của `sn14.13` và `sn22.94` (`vivarati` -> clarify, `uttānīkaroti` -> disclose), thêm `pakāsehi` -> reveal. `paññapeti` -> assert theo cùng nơi dù nghĩa khác ở các chỗ khác. (5) `attho` ở `20.1` dịch **good** ở nhóm `attattho/parattho/ubhayattho` và **matter** ở cả danh sách còn lại: `attha` đa nghĩa (lợi ích, nghĩa, việc), không có từ Anh nào dùng được trọn danh sách, nên đặt khung "whether a matter of one’s own good …" để giữ cả hai nghĩa. (6) `virajaṁ vītamalaṁ dhammacakkhuṁ` -> the stainless, immaculate vision of the Dhamma (theo `dn14`, `dn21`, `dn5`), và câu `yaṁ kiñci samudayadhammaṁ sabbaṁ taṁ nirodhadhamman` -> whatever is liable to arise, all that is liable to cease (đổi cấu trúc so với *Everything that is liable to arise is liable to cease* của `dn21:2.10.10`, giữ nghĩa). Không có Pāli lọt chữ trong lời Anh trừ tên riêng (Piṅgiya, Rāhu, Dhamma).

  **Bất định thật (không bịa, không đặt blocker).**
  1. `13.1`, `13.22` `vemāne`: tra được nghĩa gần là *giảm bớt/co lại*, dịch **shrinking**; chuỗi sáu phân từ `hīyamāne hāyamāne parihāyamāne vemāne vigacchamāne antaradhāyamāne` (declining, diminishing, deteriorating, shrinking, passing away, disappearing) có thể lệch một nấc ở hai từ giữa.
  2. `14.2` `cittassa vosaggo vosaggānuppadānaṁ`: dịch **abandoning the mind to the five kinds of sensual stimulation, and persisting in that abandonment**; nghĩa gần của `vosagga` là *buông thả, giao phó* (không phải *từ bỏ* theo nghĩa tốt). `anadhiṭṭhānaṁ ananuyogo` -> not resolving, not committing oneself.
  3. `14.2` `olīnavuttitā` -> sluggish behavior, `nikkhittacchandatā nikkhittadhuratā` -> giving up enthusiasm, giving up responsibility: theo nghĩa thông thường, không có tiền lệ Anh ở tầng đã ghim.
  4. `30.1` `ekavāsanavāsitā` -> **conditioning**: `vāsanā` (huân tập, nếp tập) không có tiền lệ Anh; dịch sát nghĩa kỹ thuật.
  5. `30.5` `anvatthapaṭipattiyā` -> **by practicing in line with the meaning**: đọc `anvattha` là *theo đúng nghĩa*; không chắc nó bổ nghĩa cho `namassamāno` hay cho cả câu. Bản Việt canonical đọc như vậy; tôi giữ cùng cách đọc.
  6. `11.3`, `25.9` `sacchikā paññatti` -> **a designation arising from realization**: `sacchikā` đọc là *do chứng ngộ mà có*; không chắc hoàn toàn, và cùng bất định xuất hiện ở `cnd21` (13.7, 16.2, 19.3, 26.2).
  7. `26.3` `ītijāte upaddavajāte upasaggajāte` -> beset by calamity, disaster, and misfortune: ba từ gần nghĩa, không phân biệt được sắc thái.
  8. `16.4`, `28.4`, `28.5` `yathā te`: `te` đọc là **your** (hô cách ngầm là Piṅgiya) ở `16.4`; ở `28.4` Pāli lược ngay sau `yathā te` và khoá không được lấp. Không chắc `te` chỉ riêng Piṅgiya hay chỉ người thực hành nói chung.
  9. `4.1`, `4.4`: `phāsu` (dễ chịu) dịch **poor** theo ý của kệ (hearing faint); lời giải dùng `asuddhā avisuddhā aparisuddhā avodātā` -> not clear, not very clear, not completely clear, not bright: bốn từ gần nghĩa nên không giữ được từng sắc thái.

  **Khoá còn trống.** 118 khoá của cnd20 không được lấp: tất cả dưới ngưỡng 40 ký tự hoặc là khoá tiêu đề (`0.x`), nên không vào coverage. Không khoá nào trong danh sách giao bị bỏ.

  **Coverage.** Tầng Anh của bài là 0/67 khoá có nội dung (không có edition Anh, không có lớp dự án). Khi `published`, bản lấp phủ 67/67 khoá có nội dung. Bài đã có waiver `no-upstream-english` ở scorecard Việt; hệ quả với `content/meta/reference-gaps.yaml` là việc sinh lại của người điều phối.

  **Bốn cổng kỹ thuật còn nợ** (không chạy trong lượt này, theo quy định): `npm run validate`, `npm test`, `npm run check`, `npm run build`. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và xanh: tập khoá = đúng danh sách giao (67/67, thứ tự theo Pāli), NFC, không khoá rỗng, nháy `“ ”` `‘ ’` và dấu lược khớp Pāli từng khoá (0 lệch), Pāli trùng nguyên văn trong bài thì lời Anh giống nhau (8/8), Pāli trùng giữa `cnd20` và `cnd21` thì lời Anh giống nhau (0 khác).
