notes: |-
  Lớp lấp: 1 khoá (`dhp108:0`) nằm ở tiêu đề truyện, thuộc phần bản Anh đã ghim đã lược.

  **Vì sao chỉ một khoá.** Cả 15 dòng `…vatthu` của `dhp100-115` đều trống ở bản Anh đã
  ghim, nhưng lát này chỉ nhận `dhp108:0`: `dhp108:0` là tiêu đề dài 40 ký tự Pāli (sau khi
  bỏ khoảng trắng), tức vượt ngưỡng `substantivePaliMinChars`; mười bốn tiêu đề còn lại ngắn
  hơn và `coverage` cố tình không tính chúng (đó cũng là lý do lát này có `sub = 0` và việc
  điền ở đây không làm dịch chuyển `coverage` — không phải do fill hỏng).

  **Cách dựng tên.** `Sāriputtatherassa sahāyakabrāhmaṇavatthu` → "The story of the elder
  Sāriputta’s brahmin companion." Giữ chính tả `Sāriputta` của bản đã ghim (tầng `kn` dùng
  dấu `ā` trong tên riêng, nên không bị coi là Pāli lọt). `vatthu` dịch "the story of …" theo
  đúng cách bản Việt Hòa thượng Thích Minh Châu đã dùng cho cả loạt (`Chuyện …`).

  **Một điểm bất khớp có chủ đích với tầng Việt.** `sahāyakabrāhmaṇa` là số ít; bản Việt đã
  công bố (và bản Việt của dự án) dùng `thầy Bà-la-môn bạn …` — dạng có vẻ số nhiều. Bản Anh
  đi theo Pāli làm chuẩn và để số ít. Ngược lại, bản Việt để rơi mất `thera`; bản Anh giữ
  "the elder" vì `thera` có trong Pāli và bản đã ghim dùng "the elder" cho `…tthera` ở các bài
  khác trong tầng.

  `triangulation` hạ vì lớp lấp không có bản Anh độc lập nào để đối chiếu: bản Anh đã ghim
  để trống đúng khoá này. Bản Việt chỉ dùng để đối chiếu nghĩa, không phải nguồn dịch, và
  người viết bản Việt của bài này không phải người viết lớp lấp này.