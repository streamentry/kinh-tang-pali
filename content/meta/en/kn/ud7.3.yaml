notes: >-
  ud7.3:2.3 is the stock Udāna frame `Ekamantaṁ nisinnā kho te bhikkhū bhagavantaṁ
  etadavocuṁ:`. Sujato's own rendering of that frame elsewhere in the Nikāyas is
  compressed into the preceding sentence — "…and asked him," — but the preceding segment
  here is his 2.2, which already ends "and told him what was happening." Rendering the
  frame as a fragment would therefore be redundant, so it is given as the sentence it is:
  "Then, seated all together, the mendicants said to the Buddha:". Ambiguity is scored
  down because this is a real editorial decision, not a mechanical one.

  At 2.4, `sattā rattā` is the seventh night of the fortnight, the night on which the
  world is given over to sensual indulgence, and the whole indictment turns on it. The
  closing `”ti` is rendered as a closing quotation mark with the `ti` dropped, following
  Sujato's convention throughout the Nikāyas (`…purisassa cittaṁ pariyādāya tiṭṭhatī”ti.`
  becomes "…occupies a man's mind."). `Tatiyaṁ` is "Third." per the same enumerator rule
  recorded on an4.116. Triangulation is capped at 8.0: no independent English edition
  covers these segments at the pinned commit.
