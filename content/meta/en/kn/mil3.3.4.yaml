  LUẬT 3 TỰ GIỮ (quan trọng nhất của lát này, và máy KHÔNG bắt được):
  1. 1.5 (`sati`) và 1.6 (`asati`) là hai vế đối xứng của CÙNG một chuỗi, và tôi dùng lại y hệt bộ
     chuyển tiếp "with X … in existence" / "with X absent" ở cả hai, giữ cả hai chiều có/không.
     Vì vậy `rven88.py` báo 10 cờ "lặp cụm, một từ ngăn" ở hai khoá này; CẢ 10 ĐỀU ĐÚNG — Pāli lặp
     `sati … sati` ở từng mắt xích, và xoá lặp là phá vỡ chuỗi nhân quả.
  2. Bộ chuyển tiếp "is/are a requirement for" của mil3.3.1:1.4 (tiền lệ sn55.28:4.5) KHÔNG dùng ở
     đây, vì ở đây Pāli dùng `sati` chứ không dùng `paccayā`. Giữ đúng công thức Pāli của từng
     bài thay vì ép một bộ chuyển tiếp chung — đây là điểm tôi tự kiểm khi đối chiếu chéo với lát.
  3. `Saṅkhārajāyamānapañha` ở colophon 3.1 dùng lại y hệt tiêu đề 0.3, vì Pāli lặp lại tên bài.
  4. `mahārāja` ở 1.3, 1.5, 1.6 → "Great King" y hệt.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO:
  - `Cakkhusmiñca kho` ở 1.5 và 1.6 dịch "With the eye …", giữ `kho` là chữ nhấn ("certainly/
     indeed") bằng cách đặt "Great King" ngay sau chủ ngữ; tôi KHÔNG dịch `kho` thành một từ
     riêng ("indeed") vì ở cả hai khoá nó chỉ là hạt nhấn, và thêm từ sẽ làm dài câu vô ích. Ghi
     ra đây vì đây là một semantic unit (`kho`) đã bị lược có chủ đích.
  - `cakkhuviññāṇa` → "eye consciousness" (111 lượt trong tầng Anh đã ghim; sn12.43:2.2 dùng "Eye
     consciousness"), `cakkhusamphasso` → "contact through the eye" (sn12.2:9.3): cả hai có tiền lệ
     trực tiếp.
  - `evametassa kevalassa dukkhakkhandhassa samudayo/nirodho hoti` → "This is the origin/cessation of
     the entire mass of suffering": `samudaya` → "origin" (1071 lượt, kn 67), `nirodha` → "cessation"
     (1609 lượt, kn 36). Cụm `kevalassa dukkhakkhandhassa` dùng y hệt mil3.3.1:1.4–1.5.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU:
  - 1.2 `atthi keci saṅkhārā, ye jāyantī` dịch "are there conditions that are produced?" — `jāyantī`
    là động từ thụ động hiện tại ("being produced"), nên "that are produced" là sát; tôi không dịch
    "born" vì ở 1.5 `jāti` là "birth" theo nghĩa một mắt xích riêng, tránh trùng từ gây hiểu nhầm.
  - 1.5 không đóng ngoặc và 1.6 mới đóng: đúng cách bilara cắt bài này, và luật 4 của lớp lấp đòi số
    ngoặc khớp theo từng khoá, nên bản Anh giữ nguyên. Ghi ra đây thay vì im lặng.CỔNG KỸ THUẬT: đã chạy và PASS — `save_fill` (khẳng định cả 5 luật cơ học cho từng khoá: chỉ
  điền khoá Pāli có chữ và bản ghim để trống; số dấu lược/ngoặc mở/ngoặc đóng/dấu hỏi khớp
  Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không khoảng trắng đôi),
  và `rven88.py` (0 cờ "từ Pāli lọt", 0 cờ "sót chữ tắt", 0 cỗ "ngoặc mở treo"). CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm chạy
  vì chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity` chấm 9.8 chứ
  không 10.0, và đây là việc NGƯỜI ĐIỀU PHỐI phải chạy lại trước khi coi bài là xuất bản — ghi
  thẳng ra đây thay vì để trong im lặng.Triangulation 8.0 là trần của lớp lấp, ghi ở đây để người biên tập không tưởng là thiếu sót riêng
  của bài.
