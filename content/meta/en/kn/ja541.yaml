notes: |-
  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`): tầng Anh Sujato không có tệp cho bài, mọi khoá Pāli đều để trống ở tầng đó. Bản lấp là bản dịch độc lập của dự án, viết từ Pāli root, không phải lấp chỗ trống quanh một bản Anh đã ghim.

  PHÂN LOẠI KHOÁ (bốn số): tổng khoá cần dịch 2 · A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 0 · C (tự dịch từ Pāli) = 2 · D (trùng Pāli nhưng buộc dịch khác) = 0.

  BÀI: Nimijātaka (Mūgapakkhavagga), 773 khoá Pāli, hai khoá `46.6` và `48.4` đạt ngưỡng 40 ký tự (mỗi khoá 41 ký tự thô). Vua Nimi hỏi người đánh xe Mātali về những kẻ rơi đầu xuống nồi đồng. `46.6` kết câu hỏi bắt đầu từ `46.5` (`Ime nu maccā kimakaṁsu pāpaṁ`), nên bản Anh dùng `?` dù Pāli ghi `.`; `48.4` là câu đáp (`Teme janā avaṁsirā lohakumbhiṁ patanti”`). Tiền lệ thuật ngữ: `lohakumbhī` = `copper pot` (Sujato, các đoạn tả địa ngục như mn129:15.1), dùng nguyên dạng đó.
  BẤT ĐỊNH THẬT: `avaṁsirā` = `head first` (đầu chúi xuống); `Yeme janā`/`Teme janā` đọc là cặp tương quan `ye ime janā … te ime janā`, dịch `these people … those same people`.

  TRIANGULATION 7,5: không có bản Anh độc lập nào để đối chiếu, và bản Việt canonical của bài do cùng nhóm công cụ làm ra. Bản lấp này vì vậy KHÔNG phải cách đọc English độc lập, và bài này KHÔNG được tuyên bố là đã đối chiếu bản Anh. Bản Việt chỉ được dùng để kiểm nghĩa, không dịch vòng Việt → Anh.

  COVERAGE: mẫu số = 2 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); tầng Sujato phủ 0/2, `english-project` trước lượt này 0/2, nên trước = 0/2 = 0,00. Sau khi bài `published`: 2/2 = 1,00. Độ nhạy: ngưỡng 0,8 đòi tối thiểu 2/2 khoá; không được thiếu khoá nào. Mẫu số chỉ 2 khoá nên cổng coverage gần như không đo được gì về chất lượng tầng tham khảo của bài này; đó là quy tắc đo của kho, không phải bằng chứng rằng bài không cần tầng tham khảo. Mục của bài trong bản ghi gap hiện có (coverage 0); sau khi lấp và `published` mục đó thành thừa, việc sinh lại bản ghi thuộc người điều phối. 771 khoá còn lại của bài (773 khoá Pāli) để trống: đều dưới ngưỡng 40 ký tự (tiêu đề, dòng kệ ngắn, câu dẫn ngắn) nên không vào coverage và không được lấp ở lượt này.

  Cổng kỹ thuật chưa chạy trong lượt này: còn nợ `npm run validate`, `npm test`, `npm run check`, `npm run build`; vì vậy `technical_integrity` đặt 9.6, không đặt blocker.
