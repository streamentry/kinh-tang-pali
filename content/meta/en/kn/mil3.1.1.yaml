notes: |-
  Phân loại 33 khoá: A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 2 · C (tự dịch từ Pāli) = 31 · D (trùng Pāli nhưng dịch khác) = 0. B (dựng lại từ lời có sẵn) = 0, vì không có tầng Anh nào để dựng. Các nhóm Pāli trùng: 2.1 = 3.4 = 6.1.

  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`); bản lấp là bản dịch độc lập của dự án, viết từ Pāli root một mình, dùng bản Việt canonical chỉ để kiểm nghĩa. Vì vậy mọi khoá Pāli đều “để trống” ở tầng Anh, và không có khuôn B (dựng lại từ lời Sujato). Tiền lệ thuật ngữ lấy từ các bài mil đã có lớp lấp (mil3.1.7, mil3.3.1, mil3.4.7, mil3.6.5…: “Great King”, “venerable sir”, “the Blessed One”, “lay follower”, “dispensation”, “Saṅgha”, “mendicants”) và từ bản Anh Sujato của các bài cùng họ (sn5.10, sn3.20, dn17, sn22.5…), chỉ làm tiền lệ chữ, không chép câu.

  Thuật ngữ cố định trong bài (mỗi dạng dùng nhất quán mọi chỗ): `saṅkhā samaññā paññatti vohāro nāmamattaṁ` → “a reckoning, an appellation, a designation, a usage, a mere name” (2.3, 6.2, 7.2); `puggala` → “person”; `paramatthato` → “in the ultimate sense”; `rathapañjara` → “frame”, `īsā` → “pole”, `rathadaṇḍaka` → “staff”, `yuga` → “yoke”, `patoda` → “goad” (cùng tám bộ phận ở 4.4, 4.20, 4.22 và năm bộ phận ở 6.2); `yogāvacara` không xuất hiện; `ratha` → “chariot” theo tiền lệ Sujato cho đúng bài kệ Vajirā (sn5.10: “When the parts are assembled we use the word ‘chariot’”).

  Bất định thật: (1) `rathadaṇḍaka` — dịch “staff”; có thể là cán cờ hay tay vịn xe, không phân xử được, nhưng bảy bộ phận còn lại rõ nghĩa và không ảnh hưởng lập luận. (2) `pañcānantariyakamma` (3.5) — dịch “one of the five deeds with immediate result”; tên chung chưa thấy tiền lệ ở tầng Anh đã ghim, dịch sát chữ. (3) `pañhapaṭibhāna` (9.1) — dịch “ingenious questions”, hợp từ khó; cùng cách ở mil3.1.2:2.6.

  Chỗ cố ý khác tiền lệ: chính tả “Nāgasena” có dấu (24 bài mil đã lấp trước ghi “Nagasena” không dấu; lane này theo luật giữ dấu Pāli của tên riêng). Ở 3.57 và 4.25 Pāli không đặt nháy quanh `nāgasenasaddo`/`rathasaddo`, nên English cũng không đặt nháy mà viết “the name Nāgasena” / “the word for chariot”.

  Nháy: 2.3 có sáu cặp nháy đơn khớp Pāli (cặp thứ bảy `yadidaṁ nāgasenoti` trong Pāli không có nháy nên English viết “what is called Nāgasena”); 3.2 mở nháy kép, 3.3 đóng; 3.5 mở, 3.6 có một cặp nháy đơn, đóng ở 3.7 (khoá ngoài danh sách); 4.27 mở, 4.28 đóng với hai cặp nháy đơn; 7.1 mở, đóng ở 8.4 (khoá ngoài danh sách). Dấu lược: 7.2 có `…pe…` → đúng một `…`; 27 khoá `…` trần ở 3.12–3.38 là khoá ngắn dưới ngưỡng nên không lấp.

  Bản Việt canonical dùng để kiểm nghĩa, không dịch vòng; không phát hiện chỗ nào lệch nghĩa với Pāli ở các khoá đã lấp.

  Khoá trống còn lại: bài có 108 khoá Pāli, đã lấp 33; 75 khoá còn trống đều dưới ngưỡng 40 ký tự (tiêu đề, câu ngắn, mục danh sách ngắn, kệ ngắn, colophon) nên không vào coverage và lát này không lấp; toàn bộ 33 khoá có nội dung (≥ 40 ký tự) đã có lời.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài này CÓ record (substantiveSegments 33, substantiveWithoutEnglish 33, coverage 0); sau khi `published` coverage của `kn/mil3.1.1` lên 33/33 = 1.0 (trước: 0/33 = 0.0), nên record thành thừa — để người điều phối sinh lại, bản lấp không chạm tệp đó. Độ nhạy: ngưỡng 0,80 cần ít nhất 27/33 khoá; còn dư 6 khoá.

  Triangulation 7.5: bài không có bản Anh độc lập nào để đối chiếu; bản Việt canonical của bài do cùng họ công cụ (Claude Code) làm, nên bản lấp này KHÔNG phải cách đọc English độc lập và KHÔNG được tuyên bố là đã đối chiếu bản Anh. Đối chiếu thực có: Pāli root và bản Việt canonical (chỉ để kiểm nghĩa).

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối.
