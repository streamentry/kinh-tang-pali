notes: |-
  `ud8.5:4.6` tiếp nối `4.5`, mà bản đã ghim đã dịch là "…and did as he was asked."
  — nửa vế còn lại chính là việc Cunda phục vụ đại chúng. Bộ từ `khādanīyaṁ
  bhojanīyaṁ` lấy từ `4.4` ("the other foods"), `bhikkhusaṅghaṁ` giữ nguyên vì bản đã
  ghim dùng "mendicant Saṅgha" ở 4.4.

  Không lặp lại "and served the mendicant Saṅgha with the other foods" y nguyên như 4.4:
  ở 4.4 đó là mệnh lệnh của Đức Thế Tôn ("And serve…"), ở 4.6 đó là việc đã làm xong
  ("served"). Dịch giống nhau sẽ làm bài tự mâu thuẫn về thì của động từ.

  Triangulation 8.0: không có bản Anh độc lập phủ cho khoá này.

  Lớp lấp: 1 khoá nằm ở phần bản đã ghim đã lược, không phải ở phần nguyên văn bị mất.
