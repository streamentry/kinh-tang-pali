notes: |-
  1.4 = `Ekamantaṁ nisinno kho āyasmā dabbo mallaputto bhagavantaṁ etadavoca:` →
  "Seated to one side, Venerable Dabba the Mallian said to the Buddha:" (cùng khuôn
  26 lần như `ud7.10:2.3`; 1.3 của chính bài đã ghim "Venerable Dabba the
  Mallian").

  3.3 = `evamevaṁ āyasmato dabbassa mallaputtassa vehāsaṁ abbhuggantvā ākāse antalikkhe
  pallaṅkena nisīditvā tejodhātuṁ samāpajjitvā vuṭṭhahitvā parinibbutassa sarīrassa
  jhāyamānassa ḍayhamānassa neva chārikā paññāyittha na masīti.`

  `evamevaṁ` chọn "So too," chứ không phải "In the same way,": đếm cho thấy "In the
  same way," rất phổ biến (990 lần) nhưng đều dùng theo khuôn `Evamevaṁ kho,
  bhikkhave, <mệnh đề có chủ ngữ>` (vd 2.7 của chính bài, an7.55:2.7), còn "So too,"
  (23 lần) đứng trước một mệnh đề tương lai-giá hiện tại. Ở 3.3 nó mở đầu một mệnh
  đề dài có chủ ngữ riêng nên chọn "So too,". Đây là lựa chọn biên tập dựa trên
  đếm, `ambiguity_integrity` 9.2 vì lý do đó.

  Phần còn lại ghép nguyên văn từ hai khoá đã ghim của chính bài: từ 2.1 "rose into
  the air and, sitting cross-legged in midair, entered and withdrew from the fire
  element before becoming fully extinguished", từ 3.1 "his body burning and
  combusting left neither ashes nor soot to be found".

  Hệ quả người đọc thấy: 1.3 đã ghim đủ ("…bowed, sat down to one side, and said
  to him:") nên 1.4 lặp lại; và 3.3 là một câu dài bắt buộc, vì Pāli gộp nội dung 2.1
  và 3.1 vào một khoá. `vietnamese_clarity` hạ 8.8.

  Lớp lấp: 2 khoá nằy ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
