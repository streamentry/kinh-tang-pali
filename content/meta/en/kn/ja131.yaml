notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI, KHÔNG PHẢI VÀI KHOÁ: tại commit đã ghim SuttaCentral KHÔNG xuất bản
  bản Anh nào cho bài này — đo bằng `upstreamPublishes('english-sujato', 'kn/<uid>')` trên
  `source/upstream-manifest.json`, và kiểm lại bằng cách dò trực tiếp
  `.cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/` (83 tệp có mặt, trong đó có
  `ja126` nhưng không có bài này). Vì vậy đây KHÔNG phải lấp chỗ trống quanh một bản Anh đã ghim, mà
  là **bản Anh của chính dự án, viết từ Pāli một mình**: không có tầng Anh nào độc lập để đối chiếu
  cú pháp và sắc thái. Bản Việt dự án đã dịch đủ 9/9 khoá nhưng KHÔNG phải tầng Anh, và lại cùng do
  một agent chấm, nên không thay được tầng đối chiếu. Cùng lý do, `save_fill` không in cảnh báo
  "Pāli trùng" cho khoá nào ở lát này — không có chỗ nào đã có bản ghim để so — nên luật 3 của lớp
  phải tự giữ bằng mắt (xem các ghi chú tiền lệ bên dưới).

  TỚNG THỨC: mỗi bài có 0.1–0.4 (tiêu đề) + 1.1–1.4 (một câu kệ bốn nhịp) + 2.1
  (lời dẫn đóng `…jātakaṁ <thứ>ṁ.`); giữ nguyên cấu trúc đó, không gộp, không thêm
  một khoá truyện nào.

  TIỀN LỆ ĐẾM ĐƯỢC, dùng chung cho cả lát (đếm trong tầng `kn` của bản Anh đã ghim):
  `Jātaka` → "Stories of Past Lives N " 83/83 tệp `ja*_translation-en-sujato.json`;
  `Ekakanipāta` → "The Book of the Ones " 80/83; `N. Xjātaka` → "<Tiêu đề>: a past
  life story " 82/83 (số thứ tự bị bỏ, giữ đuôi câu); khoá 2.1 (lời dẫn đóng
  `…jātakaṁ <thứ>ṁ.`) bị Sujato ĐỂ TRỐNG ở 79/83 tệp — nên đây đúng là những khoá
  phải lấp. Còn tên phẩm
  và tên bài thì lấy từ tệp TÊN của chính SuttaCentral tại commit đã ghim,
  `name/sutta/ja-name_translation-en-sujato.json` — cùng một người dịch, cùng một
  commit, nên đây là tiền lệ có bằng chứng chứ không phải phỏng đoán.

  MỘT ĐIỀU PHẢI ĐỌC KỸ ĐỂ KHÔNG TƯỞNG LÀ LỖI LẶP: `Asampadānavagga` ở 0.3 và
  `Asampadānajātaka` ở 0.4 CÙNG dịch là "Refusing a Gift", vì tệp tên của chính
  Sujato tại commit đã ghim cũng vậy: `ja-name:145.ja-asampadanavagga` = "Refusing a
  Gift " và `ja-name:146.ja131` = "Refusing a Gift ". Sujato dùng chung một chữ cho
  tên phẩm và cho câu chuyện đầu phẩm ở cả phẩm này lẫn phẩm Kusanāḷi
  (`ja-name:134.ja-kusanalivagga` và `ja-name:135.ja121` trùng nhau). Pāli cũng trùng
  (`Asampadānavagga` / `1. Asampadānajātaka`), nên đây là trung thành với Pāli chứ
  không phải lặp do tôi đánh máy. Colophon 2.1 cũng dùng lại đúng chữ đó, vì Pāli lặp
  tên bài ở 2.1.

  0 TIỀN LỆ CHO `Asampadānavagga` ở 0.3: KHÔNG có khoá segment nào trong toàn bộ tầng
  `kn` đã ghim có phẩm này (83 tệp `ja*` chỉ phủ tới `ja159`, tức tới phẩm
  Varuṇavagga). Tên phẩm lấy từ tệp tên của Sujato là cách duy nhất có bằng chứng
  tại commit đã ghim; không dịch ra "The Chapter on Un-giving" vì sẽ là sáng tác
  và lệch với bộ chữ Sujato đã dùng cho các phẩm khác.

  TIỀN LỄ ĐẾM ĐƯỢC riêng cho bài này: `bhusa` → "hay": hai chỗ có `bhusa` trong tầng
  đều dịch "hay" — sn35.69:1.6/2.6/3.8 "like a handful of hay", ud7.9:1.5 "grass
  and hay". (`bhusa` chỉ có 19 lượt Pāli trong tầng nên đây là tiền lệ theo đúng
  ngữ cảnh, không phải theo tần suất chung "straw" 43 / "hay" 21.)
  `asampadāna` → "gives nothing away" (lớp lấp: "giving away" 33 lượt, "gift" 356 lượt
  trong tầng). `mittāni` → "friendships". `jīyittha` → "come to nothing".

  0 TIỀN LỆ, ĐẶT MỚI: `aḍḍhamānaṁ` không có dụ ngữ tương ứng trong tầng; dịch
  "seeking half a share" và ghi lý do ở đây. Không thêm "weighing" hay "asking for"
  vì Pāli không nói người nói đang cầu xin hay cân đo.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU: `aḍḍhamānaṁ` có thể là "tìm kiếm một nửa" (người
  bán cỏ tìm khách mua nửa gánh) hoặc "đang đòi chia nửa"; bản Việt dự án chọn cách
  thứ nhất và cũng ghi là bất định. Chọn "seeking half a share". Vì có hai cách,
  `ambiguity_integrity` hạ điểm.

  `sassatāyan` ở 1.4 là "qua nhiều năm", đã giữ thành "through the years"; một bản
  nháp ban đầu đã bỏ mất mốc thời gian này và review đối kháng đã sửa lại.
