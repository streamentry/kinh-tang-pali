notes: |-
  **Phân loại 52 khoá (đo bằng máy, một khoá chỉ vào đúng một nhóm): A = 2 · B = 0 · C = 49 · D = 0.** A: Pāli trùng nguyên văn với một khoá đứng trước trong cùng bài, dùng lại nguyên văn lời đã dịch (2 khoá). B: không có; không khoá nào gần-trùng mà cần dựng lại từ một lời đã ghim, vì tầng Anh đã ghim không có lời nào cho bài. C: tự dịch từ Pāli (49 khoá); trong đó không tính 1 khoá có Pāli trùng nguyên văn với khoá của một bài song song cùng lát (`cnd10`–`cnd13`), những khoá ấy dùng lại đúng lời đã dịch ở bài song song để các bài không tự mâu thuẫn (số 1 này nằm ngoài C và ngoài A). D: 0; không khoá nào có Pāli trùng mà lời khác nhau. Những khoá chỉ khác nhau ở thẻ in đậm hoặc dấu cuối (ví dụ `…ti.` / `…ti—`) có phần chữ Anh giống nhau và dấu cuối theo Pāli từng khoá.

  **Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`); bản lấp là bản dịch độc lập của dự án**, viết từ Pāli, không phải lấp quanh một bản Anh đã xuất bản. Vì vậy mọi khoá Pāli có nội dung đều đang để trống ở tầng Anh đã ghim, không có khoá nào bị shadow, và không có bản Anh nào để đối chiếu cú pháp hay sắc thái.

  **Số khoá đã ghi: 52/52 khoá của `keys` (mọi khoá Pāli có nội dung, không khoá nào ngoài `keys`, đúng thứ tự Pāli).** Pāli có 147 khoá; còn trống 95 khoá, không lấp vì không vào coverage: 4 khối `:0` (tiêu đề, nhãn bộ) và 91 khoá dưới 40 ký tự (tên lemma ngắn, câu kệ nhắc lại ngắn, colophon). Khoá dài nhất trong nhóm còn trống chỉ 39 ký tự. Trong 52 khoá đã lấp có 31 khoá mang thẻ in đậm `<b>` ở Pāli; sau khi bỏ thẻ chỉ 51 khoá còn ≥ 40 ký tự, nghĩa là 1 khoá đã lấp (33–35 ký tự sau khi bỏ thẻ, đều là dòng kệ lemma) nằm trong danh sách `keys` và trong record `reference-gaps.yaml` (mẫu số 52) theo cách đếm thô; đã lấp cả những khoá ấy. Bản lấp không mang thẻ `<b>`, theo bản Việt canonical.

  **Dấu lược.** Pāli của 52 khoá có 14 khoá chứa `…pe…` và 10 khoá chứa `…` trần; mỗi dấu thành đúng một `…` trong bản lấp. Tổng 63 dấu `…` trong bản lấp bằng tổng dấu ở Pāli (so từng khoá bằng máy, không đếm `…pe…` thành hai).

  **Nháy và ngoặc.** Nháy kép `“”` khớp Pāli từng khoá (các khoá 12.2, 12.5, 22.5, 22.8, 23.3, 23.4); nháy đơn: 0 khoá ở cả Pāli lẫn bản lấp. Dấu `’` chỉ dùng làm sở hữu cách, không có nháy đóng giả. Dấu hỏi `?` được dùng ở các khoá mà câu rõ ràng là câu hỏi dù Pāli kết bằng dấu chấm.

  **Cách trình bày lemma** theo bản Việt canonical: *Lemma: lời giải*, kết bằng gạch dài khi Pāli có `—`; câu kệ lemma dịch thành dòng kệ không có dấu hai chấm. Không để chữ Pāli lọt vào lời Anh trừ tên riêng (Upasīva, Nanda, Hemaka, Todeyya, Bāvarī, Gotama, Māra, Ājīvaka).

  **Thuật ngữ, dùng thống nhất cho cả bốn bài `cnd10`–`cnd13` của lát và lấy tiền lệ từ bản Anh Sujato của các bài cùng họ** (`snp5.7`–`snp5.10` cho tiêu đề và dòng kệ; `an8.19` cho bộ ba mươi bảy phẩm trợ đạo; `an10.60` cho *the stilling of all activities, the letting go of all attachments*; `an10.100` cho *greed, hate, delusion, anger, acrimony, disdain, contempt, jealousy, stinginess, conceit*; `mn40` cho *deviousness, deceit*; `sn14.33` cho *gratification, drawback, escape* và *a mind free of boundaries*; `sn17.9` cho *gale-force winds*; `dn20` cho *phoenix*; `dn1`/`an5.219` cho *low talk*; `dn1` cho *for all eternity*; `mn36`/`mn72` cho *cut off at the root, made like a palm stump, obliterated*; `sn12.20` cho *explains, teaches, asserts, establishes, clarifies, analyzes, discloses*; `sn56.45` cho *shaft after shaft*; `an5.57` cho *desire and lust*): `ākiñcañña(yatana)` *nothingness / the dimension of nothingness*, `viññāṇañcāyatana` *the dimension of infinite consciousness*, `samantacakkhu` *All-seer*, `sakka` *Sakyan*, `bhagavā` *Blessed One*, `tathāgata` *Realized One*, `ogha` *flood*, `āsava` *defilement*, `nibbāna` *extinguishment*, `parinibbāyati` *be fully extinguished*, `saṅkhāra` *conditions / activities / choices* theo từng chỗ Sujato dùng, `abhisaṅkhāra` *volitional constructs*, `sati` *mindfulness*, `satipaṭṭhāna` *mindfulness meditation*, `ñāṇagginā daḍḍha` *burned up by the fire of knowledge*. Các chuỗi đồng nghĩa lặp được dịch cố định: `tareyyaṁ uttareyyaṁ patareyyaṁ samatikkameyyaṁ vītivatteyyaṁ` *cross, cross over, cross beyond, surmount, or transcend*; `tiṇṇā uttiṇṇā nitthiṇṇā atikkantā samatikkantā vītivattā` *crossed, crossed over, crossed out, gone beyond, completely surmounted, and transcended*; `upeto samupeto upāgato samupāgato upapanno samupapanno samannāgato` *equipped with, fully equipped with, arrived at, fully arrived at, attained to, fully attained to, and endowed with*; `pahāya jahitvā pajahitvā vinodetvā byantīkaritvā anabhāvaṁ gametvā` *given up, abandoned, relinquished, dispelled, eliminated, and obliterated*; `vadanti kathenti bhaṇanti dīpayanti voharanti` *speak of, talk about, declare, illuminate, and describe*; `brūmi ācikkhāmi desemi paññapemi paṭṭhapemi vivarāmi vibhajāmi uttānīkaromi pakāsemi` *I say, explain, teach, assert, establish, clarify, analyze, disclose, and reveal* (cùng một khuôn cho mệnh lệnh, ngôi hai, quá khứ); `suddhiṁ visuddhiṁ parisuddhiṁ muttiṁ vimuttiṁ parimuttiṁ` *purity, perfect purity, complete purity, freedom, perfect freedom, and complete freedom*. Mỗi chuỗi dùng cùng một lời ở mọi khoá của cả lát (kiểm bằng máy bằng cách dựng từ cùng hằng số).

  **Chỗ cố ý lệch tiền lệ Sujato, kèm lý do.** (1) `visenikatvā` (`cnd11:10.1`, `14.8`, `14.9`) dịch *having dismantled the armies*, đúng như chính lời chú giải của bài (`10.2`, `14.1`: *Māra’s armies … they are said to have dismantled the armies*), khác dòng kệ `snp5.8` của Sujato (*live far from the crowd*), vì trong bản lấp lời giải của Niddesa phải khớp với lemma của nó. (2) `muta` dịch *sensed*, không phải *thought* của Sujato, vì lời chú giải `cnd12:16.4` định nghĩa nó là *smelled with the nose, tasted with the tongue, touched with the body*; dùng *sensed* ở mọi chỗ trong lát để lemma và lời giải khớp nhau. (3) `nāmakāya` / `rūpakāya` (`cnd10:40.4`, `40.7`, `40.8`) dịch *mental body* / *physical body* theo bản Việt canonical (danh thân / sắc thân), không dùng *set of mental phenomena* của Sujato ở dòng kệ `snp5.7:6.4`. (4) `Namo tassa …` ở `bv1:1.1` kết bằng `!` theo tiền lệ Sujato dù Pāli kết bằng dấu chấm. (5) `rāga` dịch *greed* trong bộ ba tham/sân/si và *desire* trong `vītarāga` / `chandarāga`, theo cách Sujato dùng ở `an10.100` và `an5.57`.

  **Bất định thật (không thêm vào thân kinh, không bịa).** (1) `3.1` `huraṁ gotamasāsanā paraṁ gotamasāsanā pure … paṭhamataraṁ`: *before / apart from / previous to / earlier than Gotama’s teaching*; `huraṁ` và `paraṁ` có thể nghĩa *bên này / bên kia*, chọn nghĩa thời gian theo bản Việt (*trước* / *ngoài*) và lemma của Sujato (*before Gotama’s teaching*). (2) `5.1`, `6.1`: `itikirāya paraṁparāya piṭakasampadāya` theo Sujato `mn76:24.2`; `takkahetu nayahetu ākāraparivitakkena diṭṭhinijjhānakkhantiyā` dịch *through reasoning, through logic, through reflection on appearances, through accepting a view after considering it*; `amarāvitakka` *thoughts of immortality* là nghĩa thận trọng. (3) `16.4` `mutaṁ` = *sensed* (xem mục lệch tiền lệ). (4) `24.4`: `poṅkhānupoṅkhaṁ` *shaft after shaft* (Sujato `sn56.45`), `udakūmikajātaṁ` *like waves rising on water*, `avīcisantatisahitaṁ phassitaṁ` *in unbroken continuity, in close contact*: nghĩa chuỗi từ chỉ thời gian; sắc thái từng từ chưa phân xử. (5) `13.2`, `25.2` `Yo rāgo sārāgo …pe… abhijjhā lobho`: `rāga` *desire*, `lobha` *greed*, `abhijjhā` *covetousness*; phần giữa bị lược. (6) `18.2` mười hai mục `kāmacchando … kāmacchandanīvaraṇaṁ`: `kāmapariḷāho` *passion* (Sujato `an4.10`), `kāmamucchā` *infatuation*, `kāmajjhosānaṁ` *attachment*; `kāmarāgo` *sensual lust* để khỏi trùng `kāmacchando` *sensual desire*. (7) `23.5`, `24.2`: bảy từ `santattā samitattā vūpasamitattā nijjhātattā nibbutattā vigatattā paṭippassaddhattā` dịch *stilled, quieted, calmed, burnt out, quenched, departed, allayed* và năm tính từ `santā upasantā vūpasantā nibbutā paṭippassaddhā` dịch *still, at peace, calmed, quenched, allayed*; hai chuỗi gần nghĩa, không phân xử được từng từ. (8) `2.4`, `13.3`: `Iccā` / `kenaṭṭhena visattikā` là lời giải về hình thức của chính chữ Pāli, nên bản Anh chỉ dịch được nghĩa (*Thus*, *for what reason is it called clinging*), không giữ được lời giải ngữ pháp.

  **Triangulation 7.0: đây KHÔNG phải cách đọc English độc lập và bài KHÔNG được tuyên bố là đã đối chiếu bản Anh.** Không có bản Anh Sujato nào của bài này; bản Việt canonical của bài do cùng họ công cụ (theo `source/tooling.yaml`) thực hiện (`content/meta/sutta/kn/cnd12.yaml`: `translators` và `quality.assessed_by` đều có alias thuộc cùng họ công cụ với alias của lớp lấp này, theo `source/tooling.yaml`), nên hai bản không độc lập. Bản Việt chỉ được dùng để kiểm nghĩa, không dịch vòng Việt → Anh. Chứng cứ độc lập duy nhất là tiền lệ thuật ngữ từ bản Anh Sujato của các bài khác cùng họ (liệt kê ở trên), không phải của chính bài này.

