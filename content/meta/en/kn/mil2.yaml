notes: |-
  Phân loại 238 khoá: A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 6 · C (tự dịch từ Pāli) = 232 · D (trùng Pāli nhưng dịch khác) = 0. B (dựng lại từ lời có sẵn) = 0, vì không có tầng Anh nào để dựng. Các nhóm Pāli trùng: 6.1 = 59.4; 13.4 = 20.1; 17.3 = 17.6; 49.5 = 53.8; 71.5 = 72.1 = 77.1.

  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`); bản lấp là bản dịch độc lập của dự án, viết từ Pāli root một mình, dùng bản Việt canonical chỉ để kiểm nghĩa. Vì vậy mọi khoá Pāli đều “để trống” ở tầng Anh, và không có khuôn B (dựng lại từ lời Sujato). Tiền lệ thuật ngữ lấy từ các bài mil đã có lớp lấp (mil3.1.7, mil3.3.1, mil3.4.7, mil3.6.5…: “Great King”, “venerable sir”, “the Blessed One”, “lay follower”, “dispensation”, “Saṅgha”, “mendicants”) và từ bản Anh Sujato của các bài cùng họ (sn5.10, sn3.20, dn17, sn22.5…), chỉ làm tiền lệ chữ, không chép câu.

  Bài này là phần “Truyện bên ngoài” (Bāhirakathā) mang tính truyện kể, nên khối lượng bất định lớn hơn các bài còn lại trong lane. Ghi thẳng những chỗ chưa chắc:

  (1) Danh sách mười chín môn học (4.4): `suti sammuti saṅkhyā yogā nīti visesikā gaṇikā … ketu` dịch “revelation, tradition, enumeration, yoga, polity, the Vaiśeṣika, calculation, music, medicine, the four Vedas, the ancient lore, the histories, astronomy, sorcery, portents, counsel, warfare, prosody”; nghĩa chính xác của `suti/sammuti` (śruti/smṛti), `saṅkhyā` (đếm hay Sāṅkhya), `visesikā`, `ketu` (điềm triệu) không phân xử được; đã giữ dạng trung tính, không giải thích thêm. Đếm: mười tám mục + “lời Phật” = mười chín, khớp `ekūnavīsati`.
  (2) `vijambhako` (5.1) → “swaggering”; `sāretvā` (5.1) → “had them paraded”; `bhassappavādako` → “a loud talker”.
  (3) `pañhapaṭibhāna` (2.2) → “ingenious questions”; câu 2.2 `iminā pucchitapucchitaṁ sabbaṁ pañhapaṭibhānaṁ vijaṭetuṁ nibbeṭhetuṁ` dịch “untangle and unravel all the ingenious questions that he asks, each one as it is asked”; chủ ngữ của `iminā` là sa-di tức vua Milinda tương lai. Bản Việt canonical đọc hơi khác (“mọi điều ứng đối cho những câu hỏi được hỏi đi hỏi lại”); lệch nhẹ, không đổi sự kiện.
  (4) 3.2: cấu trúc `yathā moggaliputtatissatthero dissati, evametepi dissanti` dịch “just as the elder Moggaliputtatissa is foreseen, so too these two are foreseen”; chữ `dissati` ở nghĩa “được thấy trước (trong lời tiên tri)” là suy từ ngữ cảnh.
  (5) 20.4 `ito sattame divase` → “seven days ago”; có thể đọc “on the seventh day”.
  (6) 30.1 `ācariyassa anuyogaṁ datvā` → “having completed his teacher’s instruction”; nghĩa gốc của `anuyoga` ở đây không chắc.
  (7) 8.4, 8.6: `vessa` → “merchants”, `caṇḍāla` → “outcastes”, `pukkusa` → “scavengers”; 61.x `ekāsanika / abbhokāsika / nesajjika` giữ nghĩa sát chữ.
  (8) 58.6 `isivātapaṭivāta` → “the wind and counter-wind of sages”; 65.1 `raṇañjaho` → “one who has abandoned strife” (cũng có thể “đã bỏ lỗi lầm”); `vedagū` → “a master of knowledge”; `khagga` (74.2) → “rhinoceroses”.
  (9) 23.2 `aticchatha` → “Move on”; `kaṭacchu` → “spoon”, `uḷuṅka` → “ladle”. 23.1 `āvudhabhaṇḍa` → “weapons”. 28.1 `ācariyabhāga` → “teacher’s fee”.
  (10) 12.1 và nhiều chỗ: `koṭisata` → “a hundred crores” (100 × 10⁷ = 10⁹); tính lại từ chữ Pāli, không chép số. Đếm các số khác: `dasamāsādhikāni satta vassāni` → “seven years and ten months”; `soḷasa` → “sixteen” (impediments, mười lăm mục được liệt kê ở 32.4 — đếm lại thấy liệt kê đủ 15 mục trong khi Pāli nói `soḷasa`; ghi trung thực: danh sách Pāli ở 32.4 có 15 `-palibodho`, một mục có thể đã rơi khỏi nguồn, bản lấp theo Pāli, không thêm mục thứ 16); `asītisahassa` → “eighty thousand”; `tiṁsamattāni vassāni` → “about thirty years”; `soḷasahattha` / `aṭṭhahattha` → “sixteen / eight cubits”; `aṭṭhārasa brahmakoṭi` → “eighteen crores of Brahmās”; `cattālīsāya bhikkhusahassa` → “forty thousand mendicants”; `ekūnavīsati` → “nineteen”; `tīni vedā` → “three Vedas”.

  Dấu lược và nháy: 1.4 `dutiyampi …` → một `…`; 24.4 có `(…)` trong chính Pāli của khoá → giữ nguyên `(…)`; 55.2 `(…)` ngắn dưới ngưỡng nên không lấp. Nháy kép/đơn khớp Pāli từng khoá, gồm các khoá mở–đóng qua ranh giới (1.3/1.4, 36.4/36.5, 44.2/44.3, 61.2–61.5, 58.2/58.3…). Chỗ cố ý khác tiền lệ: “Nāgasena” có dấu; “Yonakas” giữ dạng Pāli `yonaka` (Sujato dùng “Yonas” cho `yona`; bài này không có đối chiếu Sujato); “financier” cho `seṭṭhi` theo Sujato (thig15.1, sn3.19); “Reverend” cho `bhadanto`; “penance” cho `daṇḍakamma`.

  Khoá trống còn lại: bài có 337 khoá Pāli, đã lấp 238; 99 khoá còn trống đều dưới ngưỡng 40 ký tự (tiêu đề, câu ngắn, mục danh sách ngắn, kệ ngắn, colophon) nên không vào coverage và lát này không lấp; toàn bộ 238 khoá có nội dung (≥ 40 ký tự) đã có lời.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài này CÓ record (substantiveSegments 238, substantiveWithoutEnglish 238, coverage 0); sau khi `published` coverage của `kn/mil2` lên 238/238 = 1.0 (trước: 0/238 = 0.0), nên record thành thừa — để người điều phối sinh lại, bản lấp không chạm tệp đó. Độ nhạy: ngưỡng 0,80 cần ít nhất 191/238 khoá; còn dư 47 khoá.

  Triangulation 7.5: bài không có bản Anh độc lập nào để đối chiếu; bản Việt canonical của bài do cùng họ công cụ (Claude Code) làm, nên bản lấp này KHÔNG phải cách đọc English độc lập và KHÔNG được tuyên bố là đã đối chiếu bản Anh. Đối chiếu thực có: Pāli root và bản Việt canonical (chỉ để kiểm nghĩa).

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối.
