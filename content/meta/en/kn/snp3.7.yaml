notes: |-
  LUẬT 3 — luật của `sn11.24`: Pāli 3.5 Y HỆT 2.7, nơi bản Anh đã ghim đã dịch. 2.5–2.7 là lần thứ nhất Keṇiya mời và Đức Thế Tôn từ chối; 3.2–3.5 là lần thứ hai, y hệt; 4.2–4.3 là lần thứ ba. Sujato đã dịch 3.4 là “And for a second time, the Buddha gave the same reply” — tức ông CỐ Ý dùng một lời cho lần thứ hai, nên 3.5 phải y hệt 2.7. Lệch một từ ở đây là lệch giữa lần thứ nhất và lần thứ hai của cùng một lời từ chối. Bản Việt canonical của khoá này (“Này Keṇiya, Tăng chúng tỳ-kheo đông đảo…”) cũng lặp nguyên văn y hệt.

  Đây là khoá DUY NHẤT của lát này mà chốt in ra cảnh báo “Pāli trùng”; cảnh báo ấy ĐÚNG và chính là lý do phải dùng lại nguyên văn.

  `”ti` → `”`, cùng quy ước đã nêu ở sn55.8.

  Lớp lấp: 1 khoá nằm ở phần bản Anh đã ghim đã lược, không phải ở phần nguyên văn bị mất.
