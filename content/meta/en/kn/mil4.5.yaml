notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI, KHÔNG PHẢI VÀI KHOÁ, VÀ ĐÂY KHÔNG PHẢI BLOCKER:
  tại commit đã ghim SuttaCentral KHÔNG xuất bản bản Anh nào cho bài này. Đo bằng
  `source/upstream-manifest.json` → `editions[english-sujato].files` (4.291 tệp):
  `sutta/kn/` trong đó chỉ có 9 thư mục con — `cp dhp iti ja kp snp thag thig ud` —
  KHÔNG có `mil/` và `ne/`; thư mục `ja` chỉ có 83 tệp và không tệp nào trong đó là
  bài này. Kiểm lại độc lập bằng `sutajato()` của harness: 0 khoá nào trong bài này
  có chữ ở tầng Anh đã ghim, và `fillable == số khoá Pāli`. Vì vậy đây KHÔNG phải lấp
  chỗ trống quanh một bản Anh đã ghim, mà là BẢN ANH CỦA CHÍNH DỰ ÁN, viết từ Pāli một
  mình: không có tầng Anh nào độc lập để đối chiếu cú pháp, hợp đồng và sắc thái. Tiêu đề
  Anh lấy từ chính tầng TÊN của SuttaCentral tại commit đã ghim (`name/sutta/kn/*-name`)
  — cùng người dịch, cùng commit, nên đó là tiền lệ có bằng chứng chứ không phải phỏng đoán.

  LUẬT 3 TỰ GIỮ (máy KHÔNG bắt được ở lát này): `save_fill` chỉ cảnh báo "Pāli trùng"
  khi Pāli trùng ở khoá khác ĐÃ CÓ bản Anh đã ghim; 12/15 bài của lát không có bản ghim
  nào nên nó im lặng hoàn toàn. Tôi tự đếm bằng `_dup_re1.py` (so Pāli của 15 bài này
  với nhau và với CẢ tầng `english-project`): 78 cặp trùng trong lát. 77 cặp dùng MỘT
  lời duy nhất; 36 cặp còn lại là nhãn `Jātaka` ở 0.1 của chín bài, khác nhau ĐÚNG ở
  số bài — đó là dữ liệu, không phải khác biệt cách dịch, và cùng khuôn với 27 tệp `ja`
  đã commit trong tầng.

  SỬA BẢN CŨ, BA LỖI:
  (1) 0.2 lượt trước dịch `Meṇḍakapañhārambhakathā` là "Introduction to the Debating
      Questions" — không có trong bất kỳ tệp tên nào. Tệp TÊN của chính SuttaCentral tại commit
      đã ghim có `mil-name:101.mil-mendakapanharambhakatha` = "The Question of Mendaka", và
      mil4.6 đã commit dùng đúng "The Question of Mendaka". Đã sửa theo.
  (2) 2.2 lượt trước dịch `atthi meṇḍakapañhā jinabhāsitā` là "There are debating questions
      proclaimed by the Conqueror" — bỏ mất "Mendaka", tức bỏ mất tên bộ câu hỏi mà người
      nói đang yêu cầu. Đã sửa thành "There are the Mendaka questions proclaimed by the
      Conqueror".
  (3) 1.1 lượt trước không có dấu chấm câu, Pāli thì có. Đã thêm.

  ĐÃ ĐỐI CHIẾU TỪNG VẾ, KHÔNG PHẢI CHỈ ĐỌC LƯỚT: 2.1 là danh sách HAI MƯƠI LĂM điều, và tôi
  đếm đủ 25 vế theo đúng thứ tự Pāli — từ `satataṁ samitaṁ ārakkhā` (1) qua `khalite dhammena
  paggahetabboti` (25, vế này mới đóng cuộc bằng `oti`). Có ba mươi tám từ khoá hiếm mà tôi phải
  tự tra và ghi lại dưới đây; đó là lý do ambiguity_integrity ở 8.6.
  `arahassakārin` (18) = "không giấu giếm" → "without concealment" · `niravasesakārin` (19) =
  "không chừa lại" → "leaving nothing in reserve" · `janakacittaṁ` (20) = "ý nghĩ như người
  sinh con" → "the mind of begetting" · `vaḍḍhicittaṁ` (21) = "ý nghĩ làm cho tăng" → "the mind
  of increase" · `chiddaṁ` (15) = lỗi → "faults" · `seyyāvakāso` (4) = thời tiết thích hợp →
  "the season" · `gelaññaṁ` (5) = bệnh tật → "the sickness" · `asevanasevanā` (2) = điều
  tránh/tiếp cận → "what to avoid and what to approach" · `laddhāladdhaṁ` (6) = đã được và chưa
  được → "whether food has been received or not". Tất cả đều là cách diễn giải của tôi, đếm 0
  tiền lệ ở những mục này.
  Pāli có 5 cặp `‘…’` lồng nhau ở 2.1, và tôi dùng đúng 5 cặp `‘…’` — dùng dấu `'` ASCII sẽ
  làm chốt đếm ngoặc sai.

  QUÉT: `rven88.py` báo 1 cờ cho bài này — `mil4.5:1.1` "lặp từ liền kề: rightly" — và cờ đó
  ĐÚNG, phải giữ: Pāli có `sammā` HAI LẦN, một lần cho `antevāsike` (môn sinh) và một lần cho
  `ācariyena` (thầy), nên tiếng Anh phải lặp "rightly" theo.

  KHÔNG có khoá đóng bài trong lát này: `mil4.5` hết ở 2.2 (câu hỏi của Meṇḍaka chưa được
  trả lời trong bài này), và `Milindapañhapañcaviṃsatipañhaṁ` là lát khác.

  CỔNG KỸ THUẬT: `save_fill` PASS (khẳng định cả 5 luật cơ học cho từng khoá: chỉ
  điền khoá Pāli có chữ và bản ghim để trống; số dấu lược/ngoặc mở/ngoặc đóng/dấu hỏi
  khớp Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không
  khoảng trắng đôi) và `rven88.py` quét xong (xem mục QUÉT). CHƯA chạy — `npm run
  validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm chạy vì
  chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity` chấm
  9.8 chứ không 10.0, và đây là việc NGƯỜI ĐIỀU PHỐI phải chạy lại trước khi coi bài là
  xuất bản — ghi thẳng ra đây thay vì để trong im lặng.
