notes: |-
  **Phân loại 271 khoá (đo bằng máy trên Pāli đã bỏ thẻ in đậm và gộp khoảng trắng): A (Pāli trùng nguyên văn một khoá đã có lời trong cùng bài, dùng lại nguyên văn) = 27 · B (dựng lại từ khoá gần trùng) = 0, vì không có bản Anh nào để dựng lại · C (tự dịch từ Pāli) = 244 · D (Pāli trùng mà buộc phải dịch khác) = 0.** Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`): thư mục `kn` của tầng Sujato chỉ có `cp`, `dhp`, `iti`, `ja`, `kp`, `snp`, `thag`, `thig`, `ud`; không có `cnd`. Vì vậy 271/271 khoá có nội dung đều để trống ở tầng Anh, và bản lấp này là bản dịch độc lập của dự án, không phải lấp quanh một bản đã ghim.

  **Bản lấp này KHÔNG phải cách đọc English độc lập và KHÔNG được tuyên bố là đã đối chiếu bản Anh.** Hai lý do đo được. (1) Không có bản Anh nào của chính bài này để đối chiếu. Chỉ có 18 khoá là dòng kệ của Tôn giả Piṅgiya hoặc câu nhắc lại dòng kệ (`15.1`, `15.5`, `25.4`, `26.1`, `26.8`, `27.1`, `27.6`, `95.1`, `97.1`, `104.1`, `112.3`, `112.4`, `115.4`, `116.4`, `134.3`, `134.4`, `138.1`, `139.1`), mà Pāli trùng với `snp5.19`, nơi Sujato có dịch; các dòng kệ đó chỉ được đọc để lấy tiền lệ thuật ngữ, câu chữ viết lại và có chỗ cố ý khác (xem dưới). 253 khoá còn lại là phần chú giải Cūḷaniddesa, không có bản Anh nào. (2) Scorecard Việt của `cnd22` do cùng nhóm công cụ với lớp lấp làm (so `quality.assessed_by` và `translators` của bản Việt với `source/tooling.yaml`), nên hai lớp không độc lập về tác giả. Hệ quả: `triangulation` đặt 7.5.

  **Cách dịch.** Dịch từ Pāli; bản Việt canonical chỉ dùng để kiểm nghĩa, không dịch vòng qua nó. Mỗi khoá được đọc trong bối cảnh bài (khoá liền trước và sau, dòng kệ đang được giải). Cấu trúc bài: dẫn dòng kệ, giải từng cụm (`Từ: lời giải`), lặp lại cụm đã giải, rồi nhắc đủ bốn dòng kệ. Pāli giữ lemma trần không nháy, nên bản Anh dùng dấu hai chấm sau lemma và **không** thêm nháy; chỉ có 14 khoá có nháy kép `“”` và 0 khoá có nháy đơn, đều khớp Pāli từng khoá. Thẻ in đậm trong Pāli (134 khoá) không đưa sang bản Anh. Dấu lược: 37 khoá có `…` (33 khoá `…pe…`, 4 khoá `…` trần), mỗi khoá ra đúng một `…`; 0 khoá lệch.

  **Nhóm A (27 khoá, 17 nhóm Pāli, 44 khoá thuộc nhóm trùng kể cả khoá đầu nhóm).** Dùng lại nguyên văn lời đã dịch ở khoá đầu nhóm: `5.7`=`5.9`; `4.7`=`56.2`=`68.2`=`80.2`; `4.9`=`56.4`=`68.4`=`80.4`; `4.10`=`68.5`; `60.1`=`72.1`; `60.5`=`84.4`; `61.2`=`73.2`=`85.2`; `61.3`=`73.3`=`85.3`; `61.4`=`73.4`=`85.4`; `61.5`=`73.5`; `62.3`=`74.3`=`86.3`; `62.4`=`74.4`=`86.4`=`137.4`; `67.1`=`79.1`; `68.1`=`80.1`; `72.5`=`84.3`; `21.3`=`110.11`; `21.4`=`110.12`. Có thêm các cặp Pāli chỉ khác dấu phẩy hoặc chữ hoa, không tính là A nhưng được dịch giống hệt nhau để bài không tự mâu thuẫn: `60.4`/`72.5`/`84.3`, `60.3`/`84.2`, `62.3`/`137.3`, `27.1`/`27.6`, `15.1`/`15.5`, `115.4`/`112.4`, `116.4` (thêm nháy đóng như Pāli). Cặp `85.5` so với `61.5` là khác thật (Pāli `85.5` thiếu vế `ītipaṭinissaggaṁ`), nên bản Anh cũng bỏ vế *relinquishment of troubles*.

  **Công thức lặp (dùng một lời duy nhất, đã đo bằng máy).** Chuỗi `pahīnā ucchinnamūlā tālāvatthukatā anabhāvaṅkatā āyatiṁ anuppādadhammā` → *given up … cut off at the root, made like a palm stump, obliterated, and unable to arise in the future* (`4.4`, `6.3`, `12.3`, `14.3`, `21.4`, `121.3`); chuỗi `pahīnaṁ samucchinnaṁ vūpasantaṁ paṭippassaddhaṁ abhabbuppattikaṁ ñāṇagginā daḍḍhaṁ` → *given up, completely cut off, calmed, stilled, made unable to arise again, and burned by the fire of knowledge* (`21.7`, `120.4`, `138.7`); chín động từ `akkhāsi ācikkhi desesi paññapesi paṭṭhapesi vivari vibhaji uttānīakāsi pakāsesi` → *stated, explained, taught, declared, established, disclosed, analyzed, made plain, and revealed* (`3.1`, `3.2`, `3.5`); tám động từ cùng gốc nhưng không có `akkhāsi` ở `59.4`, `71.3`, `83.3` (*explained, taught, declared, established, disclosed, analyzed, made plain, revealed*); `15.4` và `30.2` có chín động từ với động từ đầu khác (`kittayissāmi` *extol*, `byākaṁsu` *answered*); chuỗi bảy từ `upeto samupeto upāgato samupāgato upapanno samupapanno samannāgato` → *possessed of, fully possessed of, has come to, has fully come to, endowed with, fully endowed with, provided with* (`4.10`, `56.5`, `80.5`, `124.6`, và dạng tính từ ở `15.4`); chuỗi tính từ ở `53.1`, `55.1`, `67.1` dùng chung một khối thuật ngữ; năm động từ `muñcassu … okappehi` (`114.1`–`114.5`); chuỗi `vuccanti kilesā ca khandhā ca abhisaṅkhārā ca` (`61.4`, `115.1`); công thức Niết-bàn `sabbasaṅkhārasamatho …` (`115.2`, `135.2`, `136.2`).

  **Thuật ngữ và tiền lệ.** Giọng và thuật ngữ theo Sujato: *Blessed One*, *Buddha*, *extinguishment* (nibbāna), *Realized One* (tathāgata), *perfected one* (arahant), *Dhamma*, *mindfulness meditation* (satipaṭṭhāna), *textual analysis* (paṭisambhidā), *discernment* (vipassanā), *loss of view* (diṭṭhibyasana, theo `dn33:2.1.29`, `an5.130:1.3`), *caravan leader* (satthavāha, theo `dn23:23.12`), chuỗi bảy cách tin tưởng và các động từ nguồn gốc `an3.65:4.1` (*testament*, *lineage*, *canonical authority*, *logic*, *inference*, *a reasoned train of thought*, *acceptance of a view after deliberation*), kệ `snp5.19` (*vast in wisdom*, *vast in intelligence*, *dispeller of darkness*, *beacon*, *apparent in the present life, immediately effective*, *unfaltering*, *unshakable*, *no compare*, *commit to faith*, *testament of hearsay*, *fostered speculation*), `snp5.18` (tên mười sáu Bà-la-môn và nghĩa của *Pārāyana*). Cố định trong bài: `āsava` = *defilement* và `kilesa` = *corruption* (hai từ cùng xuất hiện trong chuỗi `kilesā ca khandhā ca abhisaṅkhārā ca`, nên không thể cùng một từ Anh); `rāga` = *greed* (không dùng *lust*); `kāma` danh từ = *sensual pleasures*, trong từ ghép = *sensual desire*; `mala` = *stain*; `vana` = *entanglement* (xem bất định 1); `khila` = *barrenness* (bất định 2); `abhisaṅkhāra` = *volitional formation*, riêng chuỗi `sabbasaṅkhārasamatho` = *stilling of all activities* theo Sujato; `bhūri` giữ nguyên Pāli ở các câu giải vì lời giải chính là đồng nhất `bhūri` với đất; `nāga` giữ nguyên ở `6.7` và `27.4` vì lời giải chơi chữ `āguṁ na karoti` / `na gacchati` / `na āgacchati`; `dija` giữ nguyên ở `26.4` vì lời giải là từ nguyên (*sinh hai lần*).

  **Chỗ cố ý khác tiền lệ.** (a) `25.4`, `27.1`, `27.6`: *great ocean* cho `mahodadhi`, trong khi Sujato `snp5.19:4.4` viết *great river*; lý do: `27.5` giải ví dụ bằng hồ Mānasaka, hồ Anotatta và `mahāsamuddaṁ`, và `udadhi` là biển. (b) `128.1`–`129.4`, `127.13`: *supreme gods* cho `adhideva`, trong khi Sujato `snp5.19:18.1` bỏ `adhi-` (*all about the gods*); lời giải chia `adhidevakarā dhammā` nên giữ chữ *supreme*; xem bất định 5. (c) `112.4`, `115.x`, `116.4`: *to the far shore of Death’s domain* thay vì *beyond the domain of death* (Sujato `snp5.19:16.4`), để giữ hai chữ `pāraṁ` và `maccudheyya` tách bạch trong các câu giải `115.1`–`115.3`. (d) `121.2`–`121.3`: *barrenness* cho `khila`, trong khi Sujato `snp5.19:17.4` dịch `akhilo` là *kind*; lời giải định nghĩa `khila` là tham, sân, si, giận, … nên không thể là *kind*. (e) `15.1`, `15.5`: không thêm đại từ *him* mà Pāli không có.

  **Bất định thật (dịch thận trọng, không thêm vào thân kinh, không đặt blocker vì đều là từ hiếm hoặc nghĩa có hai cách đọc gần nhau).**
  1. `vana` (`6.1`, `6.3`, `6.4`) = *entanglement*: nghĩa đen là *rừng*; chọn *entanglement* để khớp *unentangled* ở kệ `nibbano` (Sujato `snp5.19:1.5`).
  2. `khila` = *barrenness* (nghĩa đen là đất cằn, cọc cứng của tâm).
  3. `saññasaññino` (`5.8`) = *perceivers of perceptions*, `rāgarāgino` = *impassioned through greed*: hai từ lặp gốc, không có bản song song để kiểm.
  4. `27.5`: `setapaccattaṁ` = *whose inner being is spotless* (nghĩa đen *trắng trong tự thân*), `suddhādhimuttaṁ` = *whose resolve is pure*, `tādiṁ` = *unmoved*, `advayabhāṇiṁ` = *who speaks without duplicity*, `tathāpaṭiññaṁ` = *who does as he declares*; `chatukkadassā` (`27.3`) = *wretched vision* (từ hiếm).
  5. `adhideva` (`127.13`–`129.4`) = *supreme gods*: cấu trúc `sammutideve adhidevāti abhiññāya` có thể đọc là *biết các chư thiên do quy ước là những vị tối thượng* hoặc *biết, ở các chư thiên do quy ước, những điều làm nên bậc tối thượng*; chưa phân xử.
  6. `sallekhā … nillekhā` (`132.1`) = *with blemishes … unblemished*: `lekhā` đọc là dấu vết; không có bản song song.
  7. `13.58`: `ketukamyatā cittassa` = *a yearning to raise a flag of the mind* (từ hiếm); `13.57` liệt kê 12 mục dù Pāli mở bằng `dasavidhena`; dịch đủ 12.
  8. `amarāvitakka` (`34.1`) = *thoughts about immortality*: có thể là *thoughts of being a deity*; không có bản song song.
  9. `avatthāpanavacana` (`138.2`) = *a word that is unwavering* (suy theo ngữ cảnh); `apaṇṇaka` = *unfailing*.
  10. `66.3` `nattāraṁ` = *grandson* (nghĩa đen) và `78.2` `mātulaṁ` = *maternal uncle*: hai chữ cùng chỉ quan hệ giữa Bāvarī và Piṅgiya nhưng không khớp nhau (cháu ngoại hay cháu nội so với cậu); giữ nghĩa đen từng chỗ, không hòa.
  11. `138.7`: các tính từ `pahīno samucchinno … daḍḍho` không có chủ ngữ rõ trong Pāli (có thể chỉ sự nghi hoặc đã nói ở các vế trước); bản Anh để dạng không chủ ngữ.
  12. `60.4`, `72.5`: `kālikaṁ dhanaṁ datvā` = *hand over wealth due at a later time* (có thể là cho vay có kỳ hạn).
  13. `8.20` `bhāvaṁ` = *inner state* (từ nhiều nghĩa); `30.2` `ajjhāsaya` = *inclination*, `adhippāya` = *intention*.
  14. `19.29`, `51.2`, `110.7`: đoạn `so vutthavāso ciṇṇacaraṇo …pe… jātimaraṇasaṁsāro` bị rút gọn bằng `…pe…`, nên bản Anh chỉ phản ánh phần Pāli còn lại và để một `…`.
  15. Chuỗi từ chỉ thời gian `muhutta khaṇa laya vaya addha` (`66.1`, `78.1`) = *an hour, a moment, an instant, a short while, a time*: thứ tự nhỏ dần không chắc ở `laya`/`vaya`.

  **Số Pāli.** Đã đếm và khớp ở từng khoá chứa số: hai cặp *thế gian* ở `19.6`–`19.7`, mười hai cơ sở của ngã mạn ở `13.57` (12 mục), danh sách ở `124.2` (11 mục: 4 niệm xứ, 4 chánh cần, 4 thần túc, 5 căn, 5 lực, 7 giác chi, Thánh đạo tám chi, 4 Thánh đạo, 4 quả sa-môn, 4 vô ngại giải, 6 thắng trí), danh sách ở `135.3` (24 mục: 17 mục từ tham đến phóng dật và 7 mục bắt đầu bằng `sabba-`), chín động từ ở `3.1`, sáu tên Đức Phật ở `22.3`, chín lý do `eko` ở `37.2`. Không có số lớn, không có số chưa phân xử.

  **Khoá trống còn lại: 620/891, không lấp.** 617 khoá có Pāli dưới 40 ký tự (dòng kệ ngắn, câu `… ti.` lặp lại cụm, các vế liệt kê một từ), dưới ngưỡng `substantivePaliMinChars` nên không vào coverage; 3 khoá là khối `:0` (nhãn tác phẩm). Không ghi các khoá đó, đúng phạm vi lane. Không có khoá nào có chữ nhưng ngắn hơn hẳn Pāli (không có tầng Anh nên không có dấu hiệu cắt cụt).

  **Hệ quả với `content/meta/reference-gaps.yaml` và coverage.** `cnd22` hiện có record (271 khoá có nội dung, 271 không có English, coverage 0). Khi bản lấp này `published`, coverage đo trên cùng mẫu số (khoá Pāli ≥ 40 ký tự, bỏ `:0`) là 271/271 = 1.0 (trước: 0/271 = 0.0). Độ nhạy: ngưỡng sàn 0.8 cần ít nhất 217/271 khoá; tức có thể thiếu tối đa 54 khoá. Record đó trở thành thừa sau khi publish; sinh lại tệp là việc của người điều phối, không sửa tay ở đây.

  **Điểm số.** Không có blocker. Hạ `triangulation` về 7.5 vì không có bản Anh độc lập và bản Việt cùng nhóm công cụ; hạ `semantic_fidelity`, `grammar_logic`, `terminology` còn 9.0 vì các bất định ở trên (đặc biệt 5 và 11) và vì chuỗi đồng nghĩa dài không thể phân biệt hết từng từ Pāli trong tiếng Anh; `vietnamese_clarity` (cột đọc hiểu của lớp Anh) 8.8 vì các chuỗi liệt kê dài đọc nặng. Đã làm một lượt đọc đối kháng riêng từng khoá sau khi dịch xong: bắt và sửa hai chỗ (`121.3` dùng *barrennesses* thành *forms of barrenness*; `112.3` đồng bộ *commit to faith* với `114.1`) và một chỗ lệch dấu phẩy giữa ba khoá Pāli gần trùng (`60.4`); không có chỗ nào sai nghĩa.

  **technical_integrity 9.6.** Không được chạy cổng kỹ thuật trong lát này, nên không tuyên bố technical gate pass. Bốn lệnh còn nợ: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Tự kiểm đã chạy và xanh: tệp JSON parse; tập khoá bằng đúng 271 khoá `keys` (không khoá nào ngoài danh sách), đúng thứ tự Pāli; nháy kép và nháy đơn khớp Pāli từng khoá (dấu nhạt lượu `’` + chữ thường không tính là nháy đóng); `…` khớp quy tắc `…pe…`; NFC; không khoá rỗng; không khoảng trắng thừa; không thẻ HTML; Pāli trùng nguyên văn trong bài thì English giống hệt (0 khoá lệch); YAML parse; `final_score` bằng trung bình số học thô của mười điểm.
