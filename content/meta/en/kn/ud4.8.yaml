notes: |-
  **Phân loại 13 khoá (đo bằng máy, so Pāli từng khoá với mọi khoá đã có lời Sujato trong bài): A = 7 · B = 5 · C = 1 · D = 0.** Đã ghi 13/13 khoá `fillableSegments`; không còn khoá trống nào trong bài.

  **A (7) — dùng lại nguyên văn:** `10.3`–`10.7` ← `8.2`–`8.6` (và `6.3`–`6.7`, cùng lời); `14.2` ← `12.2`; `14.3` ← `12.3`.

  **B (5) — dựng lại:** `10.1` ← `7.1` (0,91): Pāli thêm `Etarahi, bhante` và đổi sang thì hiện tại trong lời các tỳ-kheo trình Đức Phật ⇒ “Sir, these days when the people of Sāvatthī see the mendicants they abuse and insult them with rude, harsh words:”. `10.2` ← `8.1` (chuẩn hoá trùng 1,0): Pāli chỉ khác nháy mở `‘` và chữ thường. **Cảnh báo kiểu D ở tầng đã ghim:** `6.2` và `8.1` có Pāli trùng nguyên văn nhưng Sujato dịch khác một chữ (“immoral and wicked” / “immoral, wicked”); lớp lấp theo `8.1` vì `10.2` là lời dẫn lại đúng đoạn `8.x` (dân chúng mắng các tỳ-kheo), không tự hoà hai bản ghim. `10.8` ← `8.7` (1,0): chỉ thêm `’` cho nháy Pāli `’”ti`. `14.1` ← `12.1`, `14.4` ← `12.4`: chỉ khác nháy (Pāli `“…”` ở `14.x`).

  **C (1):** `19.5` `Aṭṭhamaṁ.` ⇒ “Eighth.”, nhãn thứ tự; bài là bài thứ tám của phẩm 4 (`ud4.8`), khớp số.

  **Ngoặc và dấu lược:** 13/13 khoá khớp Pāli về nháy kép/đơn; Pāli 13 khoá không có `…pe…`, lớp lấp không có `…`. Lưu ý tầng ghim: `12.1` Pāli mở `‘` nhưng Sujato không có nháy; lớp lấp ở `14.1` theo nháy Pāli của chính khoá đó (`“`).

  Triangulation 8.8: scorecard Việt của `ud4.8` ghi người chấm là một công cụ **khác họ** với lớp lấp (đối chiếu `source/tooling.yaml`), nên lớp lấp là một cách đọc English độc lập về tác giả; vẫn thấp hơn 9,5 vì không có bản Anh thứ hai cho chính các khoá này. Đối chiếu có: Pāli root + Sujato đã ghim (49 khoá có nội dung, 41 có lời) + bản Việt canonical (chỉ đối chiếu nghĩa).

  technical_integrity 9.6: lát này không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; bốn lệnh đó còn nợ, nên không tuyên bố technical gate pass. Không đặt blocker vì chưa chạy không phải validation failure. Đã tự kiểm bằng máy: JSON parse, mọi khoá ⊆ `fillableSegments` của bài, 0 khoá shadow, NFC, 0 khoá rỗng, thứ tự khoá theo Pāli, Pāli trùng nguyên văn ⇒ English trùng (trừ các chỗ ghi ở trên), dấu lược và nháy so với Pāli từng khoá (dấu `’` có chữ thường đứng ngay sau tính là dấu nhạt lượu).

  Hai cơ chế khoá trống của tầng đã ghim (đo rồi báo, không sửa — sửa là shadow): **cắt cụt dãy** (dãy ≥ 4 khoá trống liên tiếp) = 2 dãy / 12 khoá / 674 ký tự Pāli; **bỏ dòng song song** (chỉ xét khoá trống, thân từ = 6 chữ đầu của từ ≥ 4 chữ, khoá mở nhóm gom mọi khoá trống chưa vào nhóm có tỉ lệ chung ≥ 0,70, mỗi khoá thuộc đúng một nhóm) = 3/13 khoá. Khoá đã ghim có chữ nhưng ngắn dưới 25% Pāli (Pāli ≥ 40 ký tự): 0.

