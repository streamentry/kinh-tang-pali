notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI, KHÔNG PHẢI VÀI KHOÁ: tại commit đã ghim, SuttaCentral KHÔNG
  xuất bản bản Anh nào cho 12 bài của lát này. Đo bằng `upstreamPublishes('english-sujato', …)`
  trên `source/upstream-manifest.json`, và kiểm lại bằng cách dò thẳng cache
  `.cache/upstream/suttacentral/translation/en/sujato/sutta/kn/`: chỉ có 9 thư mục con —
  `cp dhp iti ja kp snp thag thig ud` — KHÔNG có `mil/`, `ne/`, `vv/`, `pv/`. Vì vậy đây KHÔNG
  phải lấp chỗ trống quanh một bản Anh đã ghim, mà là bản Anh của chính dự án, viết từ Pāli
  một mình: không có tầng Anh nào độc lập để đối chiếu cú pháp, hợp đồng và sắc thái.

  VỀ TẦNG TIẾNG VIỆT, NÓI ĐÚNG LÚC NÓ ĐÃ ĐO: khi lát này được giao, bộ khoá của mỗi bài báo
  `viThiếu` = 11/11 (hoặc 12/12 với mil3.3.14), tức là CHƯA có một khoá Việt dự án nào cho 12 bài
  này — nên tôi dịch thẳng từ Pāli và không dịch ngược. Trong lúc tôi làm, một agent khác đã viết
  tầng Việt cho 10 trong 12 bài (mil3.3.14 và vv69 vẫn chưa có); tôi KHÔNG dùng tầng đó làm
  nguồn và KHÔNG dùng nó để chấm điểm, vì theo chính lệnh của lát này, và vì tầng Việt không phải
  tầng Anh. `assessed_by` của các tệp này là công cụ của tôi, không trùng với bất kỳ agent Việt
  nào, nên không có chuyện tự chấm bài của mình.

  Hệ quả: `save_fill` KHÔNG in cảnh báo "Pāli trùng" cho bất kỳ khoá nào ở lát này, vì hàm đó
  chỉ cảnh báo khi Pāli trùng ở khoá khác ĐÃ CÓ bản Anh ghim. Luật của `sn11.24` phải tự giữ
  bằng mắt. Đo bằng `_dup_e6.py`: 0 cặp trùng nội bộ bài; lát có 9 chuỗi Pāli trùng qua các
  bài, thành 26 cặp, và cả 26 đều dùng MỘT lời duy nhất — bốn bài `Netti` cùng một lời cho
  kệ `“Tasmā rakkhitacittassa, sammāsaṅkappagocaro”ti gāthā.`, bảy bài `mil` cùng một lời cho
  `“Kallosi, bhante nāgasenā”ti.`, chín bài cùng "Questions of King Milinda", ba bài cùng
  "Please give an example". Vế lặp dài nhất đo bằng `difflib`: mil3.6.9:1.3 và 1.6 chia
  sẻ 146 ký tự Pāli (`jāto idheva marati … saṁsāro hotī”ti.`) nên dùng CHUNG một lời.

  TIỀN LỆ ĐẾM ĐƯỢC trên tầng `english-sujato` đã ghim (135.499 cặp Pāli ↔ Anh):
  `bhante` → "sir" (`Sir` 1.079 lần so với `Reverend` 575); `mahārāja` → "Great King" (179
  khoá); `ariyasāvaka` → "noble disciple" (805 khoá); `nirodha`/`nibbāna`/`parinibbāna` →
  "extinguishment" (759 lần); `āyatane` → "sense fields" (233 khoá; "sense sphere" 0 lần);
  `vuyhanti` → "swept along" (PED: "is carried away; is swept away"); `yojana` → "leagues"
  (120 khoá); `saṁsāro` → "transmigration" (83 khoá); `sukhumā` → "subtle" (151 khoá);
  `pabhavati` → "gives rise to" (190 khoá); `aṭṭhaṅgiko maggo` → "the noble eightfold path"
  (213 khoá). Danh sách tám điều khổ `jāti … upāyāsehi` dùng đúng bộ chữ Sujato đã dùng ở
  `sn35.28:1.10` và `dn1:3.71.12`: "birth, old age, death, sorrow, lamentation, suffering,
  sadness, despair". `…ti.` → `”` và `”ti.` → `”` (139 tệp fill đã merge đều bỏ `ti`; ví dụ
  iti70:4.2, snp3.7:3.5, ud7.3:2.4). Tiêu đề Anh lấy từ chính tầng TÊN của SuttaCentral tại
  commit đã ghim (`name/sutta/{mil,ne,vv}-name`) — cùng người dịch, cùng commit, nên đây là
  tiền lệ có bằng chứng chứ không phải phỏng đoán; số thứ tự ở khoá kết theo đúng khuôn
  `<Tên bài>, <chữ thứ>` (mil3.4.9:3.1 của lát e0, ud7.3:4.5).

  MẤT DẤU PĀLI CỐ Ý, VÌ CHỐT TỪ CHỐT: chỗ chốt Pāli-lọt chỉ cho phép từ có dấu nếu bản Anh
  đã ghim của CÙNG tầng `kn` dùng từ đó. Tầng `kn` đã ghim có 372 từ có dấu Pāli, trong đó
  KHÔNG có `Nāgasena`, `Ānanda`, `Pāyāsi`, `Nāga`, `Supaṇṇa`, `Kumbhaṇḍa` (đếm 0 lần). Nên
  `Nagasena`, `Ananda`, `Payasi`, `nagas`, `supannas`, `kumbhandas`. Đây là MẤT DẤU, ghi ra
  đây thay vì giấu.

  QUÉT ĐỐI KHÁNG (`rven88.py`): cả lát chỉ còn **1 cờ**, tại mil6.2.4:1.1 — "lặp từ liền
  kề: sesame". Cờ đó ĐÚNG và phải giữ: Pāli có `māso tilaṁ`, tức `māsa` (PED: sesame) VÀ
  `tila` (PED: "the sesame plant & its seed") là HAI từ khác nhau cùng nghĩa, nằm cạnh nhau
  trong một danh sách hạt như mọi danh sách Pāli khác (`sāli vīhi` cũng gần nghĩa nhau).

  BỒ SUNG RIÊNG BÀI: `thanassitadāraka` xác nhận bằng PED: `thana` = "the breast of a woman" và
  `thana-sita-dāraka` (Mil.364) = "a child at the breast, a suckling" — khớp tiêu đề
  `mil-name:264.mil7.7.2` và bản dịch 0.4, nên cả ba chỗ dùng CHUNG "the child at the breast".
  `paviveka` (PED) = "retirement, solitude, seclusion"; `yogin` = "one who devotes himself to
  spiritual things"; `yogāvacara` (NCPE) = "one who practices spiritual exercise";
  `sārattha` (DPD) = "essence of the goal; fundamental purpose"; `appamatta` (DPD) = "diligent,
  watchful"; `ātāpī` (DPD) = "avid, ardent, zealous". 1.5 và 2.1 nối liền nên 2.1 không mở
  ngoặc mới — dựng đúng.

  CHỦ Ý LỆCH VỚI TẦNG TÊN ĐÃ GHIM, GHI RÕ: 0.3 `Makkaṭakavagga` dịch "The Spider Chapter" chứ
  KHÔNG theo `mil-name:262.mil-makkatakavagga` = "The Monkey". Lý do: PED `makkaṭaka` =
  "a spider" và chính PED trích Mil.364/Mil.407 (`paṇṭha-makkaṭaka`, con nhện đường) — đó là
  mil7.7.1 và phần đầu chương này; tầng `kn` đã ghim cũng dịch mil7.7.1 là "The Road-Spider".
  Làm theo tầng tên sẽ khiến tiêu đề chương và tiêu đề bài đầu chương tự mâu thuẫn. Nếu người biên
  tập muốn bám tầng tên, sửa đúng một dòng ở 0.3 là xong.

  BẤT ĐỊNH ĐÃ GHI: (1) `khīratthika` KHÔNG có mục từ điển; dựng từ `khīra` (PED: "milk") +
  `atthika` (kẻ mong), dịch "one who longs for milk". (2) `garusaṁvāsa` cũng KHÔNG có mục;
  dịch "the company of the worthy" — chọn từ trung tính vì `kalyāṇamittasevane` ngay sau đã là
  "giao hữu điều lành", và bản dịch PTS 1890 đọc là "association with his teachers", tức là
  một khả năng khác đã bị loại.

  HAI CHỖ ĐỐI CHIẾU ĐƯỢC VỚI TẦNG VIỆT DỰ ÁN (ghi song song, KHÔNG dùng làm nguồn):
  (1) `thanassitadāraka`. Tôi dịch "the child at the breast" ở 0.4, 1.1, 1.2 và 1.4, dựa trên
  PED `thana` = "the breast of a woman" và `thana-sita-dāraka` (Mil.364 = Mil.408) = "a child
  at the breast, a suckling", `sita` (PED) = "stuck in or to; clinging to", cộng thêm chính
  tầng tên đã ghim `mil-name:264.mil7.7.2` = "The Child At the Breast". Tầng Việt dự án dùng cách
  dịch khác — "trẻ nhỏ bị đặt tay chân" — có vẻ theo một thuyết minh khác; hai nguồn đã ghim cộng
  từ điển đứng về cách của tôi nên tôi giữ, và ghi ra đây để người biên tập biết là có hai lớp.
  (2) `sadatthe laggati, khīratthiko rodati`: tầng Việt gộp hai vế thành "khóc lóc đúng mục đích,
  kẻ cầu gì khát khao thì khóc lóc"; tôi giữ hai vế tách biệt theo cú pháp Pāli (vế một
  `sadatthe laggati`, vế hai `khīratthiko rodati`) — cũng đúng như bản dịch PTS 1890. Cả hai đã hạ
  điểm ambiguity_integrity.

  Triangulation 8.0 là trần của lớp lấp, ghi ở đây để người biên tập không tưởng là
  thiếu sót riêng của bài.
