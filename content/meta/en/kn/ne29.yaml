  LUẬT 3 TỰ GIỮ (quan trọng nhất của lát này, và máy KHÔNG bắt được):
  Đây là bài duy nhất của lát KHÔNG thuộc Milindapañha hay Jātaka: một đoạn trích Netti, văn bản
  bảng giải thích thuật ngữ, nên văn phong khác — đây là văn xuôi pháp điển liệt kê định nghĩa,
  không phải đối thoại.

  1. `Vevacanahārasampāta` ở 0.4, `vevacano hārasampāta` ở 1.1 và `vevacano hārasampāto` ở 2.5 là
     CÙNG một tên; dùng lại y hệt "sense-word treatment" ở cả ba chỗ, vì đó là điều luật 3 của
     lớp yêu cầu.
  2. `idaṁ vevacanaṁ` lặp ở 2.2, 2.3, 2.4 — dùng lại y hệt "This is the sense-word." ba lần, đúng
     nhịp liệt kê của Pāli; không lược đi một lần.
  3. `sammāsaṅkappagocaro` ở 2.1 (trong câu kệ) và ở 2.3 (trong danh sách) dùng lại y hệt "right
     purpose as its destination", và `sammādiṭṭhipurekkhāro` giữ y hệt "the mere shadow of right
     view".
  4. `Netti` ở 0.1 giữ nguyên là "Netti": tệp TÊN của SuttaCentral KHÔNG có mục nào cho tên quyển
     `ne` (chỉ có tên các phần và các sampāta), nên không có tiêu đề Anh nào đã ghim để theo. Giữ
     tên riêng là lựa chọn ít giả đoán nhất; tôi không bịa một tên dịch.
  5. `Sampāta 10` ở 0.3 → "Conveying Synonyms: Combined Treatment", đúng bằng tên mà tệp TÊN của
     SuttaCentral đặt cho chính bài này (ne-name:35.ne29), bỏ số thứ tự "10" theo đúng tiền lệ
     lớp lấp là bỏ số thứ tự ở khoá tiêu đề (ja121–134).

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO — bài này gần như toàn bộ là đặt mới, nên terminology hạ:
  - `vevacana` → "sense-word": 0 tiền lệ ("synonym" 0, "sense-word" 0). Chọn vì `veca` là "lời
     nói" và `vacana` là "lời/từ", và vì `vevacana` ở chính đoạn này được giải thích bằng "mind,
     mentation, consciousness…" — tức là một TỪ ĐỒNG NGHĨA, chứ không phải "nghĩa". Vì vậy
     "sense-word" (từ chỉ ý nghĩa) là dịch sát nhất trong tiếng Anh.
  - `Paṭiniddesavāra` (0.2) → "Counter-demonstrative Subsection": tiền lệ có, ne-name:7.
  - `gocara` → "destination" ("the destination" 0 lượt trong tầng đã ghim): đặt mới. Chọn vì
     `gocara` là nơi đi đến của một tâm trạng, và cặp `sammāsaṅkappagocaro` đọc "right purpose as
     its destination" là cách hiểu tiêu chuẩn của truyền thống này.
  - `purekkhāra` → "mere shadow": 0 tiền lệ. Chọn vì `purekkhāra` là "bóng/ảnh phản chiếu nhỏ",
     và "the mere shadow of right view" giữ đúng nghĩa giảm nhẹ.
  - Sáu tên của `paññā` ở 2.4 — `paññāsattha/khagga/ratana/pajjoto/patoda/pāsāda` → "the aim /
     summit / jewel / light / lamp / assurance of wisdom": KHÔNG có tiền lệ nào trong tầng Anh đã
     ghim (0 lượt cho cả sáu). Đây là sáu đặt mới trong một khoá, và tôi giữ chúng thành sáu vế
     khác nhau để không làm phẳng. Đây là lý do terminology của bài thấp nhất lát.
  - `manāyatana` → "mind-sense-sphere", `manindriya` → "mind-faculty": 0 tiền lệ cho cặp này;
     `mano` → "mentation" thì CÓ tiền lệ (235 lượt), và `manas` trong `satipaṭṭhāna` cũng là
     "mentation".

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU:
  - 2.2 `vijānanā vijānitattaṁ` là hai dạng của cùng một gốc (`vijāna`/`vijānita`) đứng cạnh nhau.
     Tôi dịch "by knowing it, by having discerned it" — giữ cả hai, dù có vẻ thừa. Bỏ một vế là
     bịa rút bớt.
  - 1.1 `katamo vevacano hārasampāto` = "And which is the sense-word treatment?" Có thể đọc `katamo`
     là "cái nào là …" (hỏi tên) hoặc "thế nào là …". Dịch theo cách hỏi danh tính; không có bản
     Anh nào để so, nên ghi ra đây.
  - 2.3 `nekkhammasaṅkappo` dịch "the right purpose of giving up". Trong danh sách này `nekkhamma`
     có thể là "từ bỏ điều ác" hoặc — theo cách hiểu khác — "tứ pháp" (cattāri nekkhammapatipadā);
     hai cách cho hai nghĩa khác nhau và tôi chọn nghĩa "từ bỏ" vì cạnh hai vế `abyāpāda`
     (không gây hại) và `avihiṁsā` (không bạo hại) đều là điều KHÔNG LÀM, cùng một chiều. Ghi ở
     đây vì đây là chỗ có thể sai nặng nhất của bài.CỔNG KỸ THUẬT: đã chạy và PASS — `save_fill` (khẳng định cả 5 luật cơ học cho từng khoá: chỉ
  điền khoá Pāli có chữ và bản ghim để trống; số dấu lược/ngoặc mở/ngoặc đóng/dấu hỏi khớp
  Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không khoảng trắng đôi),
  và `rven88.py` (0 cờ "từ Pāli lọt", 0 cờ "sót chữ tắt", 0 cỗ "ngoặc mở treo"). CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm chạy
  vì chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity` chấm 9.8 chứ
