notes: |-
  TẦNG NÀY KHÔNG CÓ BẢN ANH ĐỂ ĐỐI CHIẨU. Kiểm lại bằng hai cách độc lập trước khi
  tin: (1) `source/upstream-manifest.json` → `editions[english-sujato].files` không có
  tệp nào có tên bài này; (2) `sutajato()` của harness đọc thẳng cache → 0 khoá nào có
  chữ trong toàn bộ bài, nên `fillable` = số khoá Pāli. Vì vậy đây KHÔNG phải lấp chỗ
  trống quanh một bản Anh đã ghim, mà là **bản Anh của chính dự án, viết từ Pāli một
  mình**: không có tầng Anh nào độc lập để so cú pháp, sắc thái hay cách dịch thuật
  ngữ. `triangulation` vì thế chấm 8.0 cho **CẢ bài**, không phải vài khoá. Đây là
  giới hạn thiết kế của lớp lấp — KHÔNG phải blocker, không phải thiếu sót phát
  sinh; ghi ra đây để người biên tập không đọc nhầm thành lỗi riêng của bài.

  LUẬT 3 "PĦLI TRÙNG THÌ DÙNG LẠI LỜI ĐÃ CÓ" — MÁY KHÔNG BẤT ĐƯỢC Ở LÁT NÀY, TỰ GIỮ
  BẰNG SCRIPT: `save_fill` chỉ in cảnh báo khi Pāli trùng ở khoá khác **có bản Anh đã
  ghim**; 12 bài của lát không có bản ghim nên nó im lặng hoàn toàn. Đã viết
  `_re0_dup.py` đếm Pāli trùng giữa 15 bài của lát với toàn bộ tầng `en/project`
  (822 khoá): 9 cụp trùng trong chính lát (24 khoá là bản lặp) và 18 cụp trùng với
  bài khác; mỗi cụp giữ **một lời duy nhất**, và cụp nào đã có tiền lệ commit thì dùng
  đúng lời đó.

  BẢN VIỆT DỰ ÁN `content/translation/vi/project/sutta/kn/ja96_translation-vi-project.json` có đủ 9/9 khoá; dùng để **đối chiếu nghĩa**, không làm nguồn — nó cùng do một agent chấm nên không phải là lớp đọc độc lập, và `vietnamese_clarity` / `han_viet_balance` ở đây chấm theo bản Việt ấy chứ không theo một bản Việt đã xuất bản. Chỗ nào hai lớp bất đồng thì Pāli là authority và bất đồng được ghi ở mục dưới.

  TỚNG THỨC JĀTAKA: 0.1–0.4 (tiêu đề) + 1.1–1.4 (bốn nhịp một câu kệ) + 2.1 (lời
  dẫn đóng `Telapattajātakaṁ chaṭṭhaṁ.`). Giữ nguyên cấu trúc, không gộp, không thêm
  khoá truyện nào.

  TIỀN LỆ ĐẾM ĐƯỢC, dùng chung cho tám bài Jātaka của lát (đếm trong tầng `en/project`
  đã có): `Jātaka` → "Stories of Past Lives N" (40 tệp); `Ekakanipāta` → "The Book of the
  Ones" (41 tệp, một lời duy nhất); `N. Xjātaka` → "<Tiêu đề>: a past life story" (số thứ
  tự bị bỏ); colophon 2.1 → "<Tiêu đề>: <Thứ tự>." — **27/27 tệp Jātaka đã COMMIT** dùng
  khuôn có dấu hai chấm, nên bốn dòng colophon của lát này đã sửa từ khuôn "Tiêu đề, thứ
  tự." sang khuôn đã commit.

  TÊN PHẨM `Littavagga` → "A Smear of Poison": ja91:0.3 và ja92:0.3 đã có, một lời duy
  nhất. TÊN BÀI lấy từ tệp TÊN của chính SuttaCentral tại commit đã ghim
  (`name/sutta/ja-name_translation-en-sujato.json`, khoá `…ja96` = "The Pot of Oil") —
  cùng một người dịch, cùng một commit, nên đây là tiền lệ có bằng chứng chứ không phải
  phỏng đoán.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO: `telapatta` → "the oil-cloth" (0 lượt "oilcloth"
  trong tầng `kn` đã ghim). `anavaseka` → "without a blemish" (nghĩa gốc "không dính dơ
  bẩn", thuộc về vật liệu). `sacittamanurakkhe` → "with careful attention and
  guarding". Vì đặt mới nên hạ terminology.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU: `yathā parihareyya` (1.2) đọc được hai cách — `yathā` =
  "như" nên "as one is wont [to carry it]", hoặc `yathā` = "như thế này" nên "one should
  carry the oil-cloth just so". Bản Việt dự án chọn cách thứ hai. Tôi chọn cách thứ nhất
  vì 1.3 mở đầu bằng `Evaṁ` ("Even so") và "as one is wont" làm cho 1.3 nối được; đây là
  lựa chọn biên tập, không phải điều chứng minh được, nên hạ ambiguity_integrity.

  `samatittika` = phẳng, bằng, đều; giữ cả "Smooth" và "even" vì đó là hai mặt của
  một nghĩa và câu kệ cần sự dồn.

  CỔNG KỸ THUẬT: `save_fill` PASS cho từng khoá (5 luật cơ học: chỉ điền khoá Pāli có
  chữ và bản Anh đã ghim để trống; số dấu lược / ngoặc mở / ngoặc đóng / dấu hỏi khớp
  Pāli THEO TỪNG KHOÁ; không mở rộng `…pe…`; không lọt chữ Pāli; NFC; không khoảng
  trắng đôi). Quét bổ sung trên riêng 15 tệp của lát: 0 cờ "từ Pāli lọt", 0 cờ "sót
  `pe…`", 0 cỗ "ngoặc treo", 0 cờ khoảng trắng đôi; 3 cờ "lặp cụm" đều hợp lệ và đã
  giải trình trong `notes` (xem `mil3.7.13.yaml` và `ud6.2.yaml`). CHƯA chạy —
  `npm run validate`, `npm test`, `npm run check`, `npm run build`: lát này bị BRIEF cấm
  chạy vì chậm và xung đột khi nhiều agent chạy song song. Vì vậy `technical_integrity`
  chấm 9.8 chứ không 10.0, và đây là việc NGƯỜI ĐIỀU PHỐI phải chạy lại trước khi coi
  bài là xuất bản — ghi thẳng ra đây thay vì để trong im lặng.

