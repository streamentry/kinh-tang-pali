notes: |-
  Phân loại 7 khoá: A (Pāli trùng nguyên văn với khoá khác trong cùng bài, dùng lại lời đã dịch) = 0 · C (tự dịch từ Pāli) = 7 · D (trùng Pāli nhưng dịch khác) = 0. B (dựng lại từ lời có sẵn) = 0, vì không có tầng Anh nào để dựng.

  Bài này không có bản Anh upstream ở snapshot đã ghim (`noEnglishEditionUpstream`); bản lấp là bản dịch độc lập của dự án, viết từ Pāli root một mình, dùng bản Việt canonical chỉ để kiểm nghĩa. Vì vậy mọi khoá Pāli đều “để trống” ở tầng Anh, và không có khuôn B (dựng lại từ lời Sujato). Tiền lệ thuật ngữ lấy từ các bài mil đã có lớp lấp (mil3.1.7, mil3.3.1, mil3.4.7, mil3.6.5…: “Great King”, “venerable sir”, “the Blessed One”, “lay follower”, “dispensation”, “Saṅgha”, “mendicants”) và từ bản Anh Sujato của các bài cùng họ (sn5.10, sn3.20, dn17, sn22.5…), chỉ làm tiền lệ chữ, không chép câu.

  BẤT ĐỊNH THẬT, và là chỗ bản lấp khác bản Việt canonical: (1) 2.2 Pāli `gehe patante` là “khi ngôi nhà đang đổ” (`geha` = nhà). Bản Việt canonical dịch “đang rơi xuống hố … cái hố ấy”, đọc sai nghĩa; bản lấp theo Pāli: “when a house is falling down … that house would not fall down”. Không sửa bản Việt (ngoài lane), chỉ báo. (2) 3.2: `mahatī senā parittakaṁ senaṁ bhañjeyya` là quân lớn đánh bại quân nhỏ; bản Việt canonical viết ngược chiều (“đạo quân nhỏ tiếp phản một đạo quân lớn”). (3) 3.2 `aññamaññaṁ anussāreyya anupeseyya … balaṁ anupadaṁ dadeyya` dịch “encourage one another, send reinforcements, and add further strength”; `aññamaññaṁ anussāreyya` nghĩa không chắc (nhắc nhau / thúc nhau), chọn bản sát chữ nhất.

  `upatthambhanalakkhaṇa` → “the characteristic of propping up”, `upatthambhita` → “propped up”, nhất quán 1.3, 2.2, 2.3, 3.2, 3.3. 3.5 mở nháy đơn, đóng ở 3.7 (khoá ngoài danh sách). Dấu lược: không có.

  Khoá trống còn lại: bài có 18 khoá Pāli, đã lấp 7; 11 khoá còn trống đều dưới ngưỡng 40 ký tự (tiêu đề, câu ngắn, mục danh sách ngắn, kệ ngắn, colophon) nên không vào coverage và lát này không lấp; toàn bộ 7 khoá có nội dung (≥ 40 ký tự) đã có lời.

  Hệ quả với `content/meta/reference-gaps.yaml`: bài này CÓ record (substantiveSegments 7, substantiveWithoutEnglish 7, coverage 0); sau khi `published` coverage của `kn/mil3.1.12` lên 7/7 = 1.0 (trước: 0/7 = 0.0), nên record thành thừa — để người điều phối sinh lại, bản lấp không chạm tệp đó. Độ nhạy: ngưỡng 0,80 cần ít nhất 6/7 khoá; còn dư 1 khoá.

  Triangulation 7.5: bài không có bản Anh độc lập nào để đối chiếu; bản Việt canonical của bài do họ công cụ khác làm, nhưng nó và bản lấp cùng đọc một Pāli và không có bản Anh nào đứng giữa, nên bản lấp này KHÔNG phải cách đọc English độc lập và KHÔNG được tuyên bố là đã đối chiếu bản Anh. Đối chiếu thực có: Pāli root và bản Việt canonical (chỉ để kiểm nghĩa).

  technical_integrity 9.6: không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên không tuyên bố technical gate pass; bốn lệnh đó còn nợ cho người điều phối.
