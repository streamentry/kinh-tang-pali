notes: |-
  Lớp lấp: 1 khoá (`dhp44:0.4`), tiêu đề truyện, thuộc phần bản Anh đã ghim đã lược. **Bài để
  `draft` vì blocking error ở trên**, không phải vì hình thức kỹ thuật.

  **Vì sao chỉ một khoá.** `dhp44-59` có mười một dòng tiêu đề `…vatthu`/`…vatthu` đều trống
  ở bản Anh đã ghim; chỉ `dhp44:0.4` (`Pathavikathāpasutapañcasatabhikkhuvatthu`, 40 ký tự
  Pāli sau khi bỏ khoảng trắng) vượt ngưỡng `substantivePaliMinChars`. `coverage` không tính
  block `:0` nên lát này có `sub = 0`; điền ở đây không làm dịch chuyển `coverage`.

  **Bất định đã ghi, không giấu.** Tiêu đề chú giải Dhammapadaṭṭhakathā cho 44–45 là
  `Paṭhavikathāpasutapañcasatabhikkhūnaṁ Vatthu` (PTS) / `Pathavikathāpasutapañcasatabhikkhuvatthu`
  (CST4) — dạng chữ ổn định, nhưng cách chia chữ thì không ổn định:

  1. `pathavikathāya apasuta` → "kẻ đã nghe bài nói về địa đại". Đây là cách đọc mà lớp lấp đang
     dùng: "The story of the five hundred monks who had heard the discourse about the earth."
  2. `pathavikathāpa` + `suta` → "kẻ đang bàn luận về địa đại". Đây là cách đọc của bản dịch
     chú giải tiếng Anh, và cũng là cách đọc của tầng Việt: Hòa thượng Thích Minh Châu dịch
     `Chuyện 500 vị Tỳ-kheo đàm luận về địa đại`, bản Việt của dự án dịch
     `Chuyện năm trăm tỳ-kheo bàn về địa đại`.

  Tầng Pāli là authority và ở commit đã ghim không có bản chú giải, nên không có gì trong kho để
  phân xử. Chọn đọc "đã nghe" vì `suta` là danh từ thông dụng và vì cách đó giữ được vế mà cả
  hai bản Việt đều bỏ mất; nhưng đây là lựa chọn của người dịch chứ không phải kết luận có thể
  kiểm lại, nên chấm `ambiguity_integrity` 7.0 và giữ `draft`.

  Bản Việt chỉ dùng để đối chiếu nghĩa và để nêu rõ điểm bất khớp, không phải nguồn dịch;
  người viết bản Việt của bài này không phải người viết lớp lấp này.