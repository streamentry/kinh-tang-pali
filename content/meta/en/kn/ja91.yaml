notes: |-
  TIỀN LỆ ĐẾM ĐƯỢC, MẠNH NHẤT LÁT NÀY: câu kệ này TRÙNG NGUYÊN VĂN 4/4 DÒNG với `dn23:27.14`–`27.17`
  — ví dụ "Akkhadhuttakaupamā" (upamāya akkhadhuttakā, Simile of the Gamblers) trong Dīgha Nikāya —
  và bản Anh đã ghim ĐÃ DỊCH cả bốn dòng. Cùng một người dịch, cùng một commit, cùng một câu kệ: đây
  là tiền lệ mạnh hơn cả tiền lệ trong cùng bài. Bốn dòng Pāli đối chiếu từng chữ: `Littaṁ paramena
  tejasā,` / `Gilamakkhaṁ puriso na bujjhati;` / `Gila re gila pāpadhuttaka,` / `Pacchā te kaṭukaṁ
  bhavissatī"ti.` — giống hệt.

  MỘT ĐIỀU PHẢI NÓI THẲNG, VÌ NÓ LÀ ĐIỂM CHÍNH MỘNG CỦA BÀI NÀY: Sujato dịch bốn dòng đó theo bối
  cảnh HẠT XÚC ĐẮNG của dn23, và ở đó 1.3 thành "Swallow, you damn cheat, swallow!" — tức ông đọc
  `Gila` là ĐỘNG TỪ "nuốt". Ở đây câu chuyện là người/gã giả vờ tu hành (`Gilamakkha` = mặt lợn, kẻ
  giả) bị bôi chất độc lên người, và `Littajātaka` tức "vết bôi" — nên 1.3 ở đây là CÂU GỌI: "Liar,
  liar, you evil-doer!". Bản Việt dự án cũng dịch "Lừa ơi, lừa ơi, kẻ phạm tội ơi", đọc `Gila re`
  như tân ngữ tục `gila` (= lừa đảo, gốc `gilika` = heo) chứ không phải khuyến lệnh. Chọn theo hướng
  đó vì nó khớp tiêu đề và khớp cả câu 1.2 (`Gilamakkha` là kẻ đang bị gọi) — còn "swallow" ở đây sẽ
  vô nghĩa vì không có ai nuốt gì. Ghi rõ là CỐ Ý quyết định theo bối cảnh, không phải phớt lờ dịch
  giả.

  CÒN GIỮ ĐÚNG NHỮNG TỪ KHÔNG PHỤ THUỘC BỐI CẢNH, theo đúng tiền lệ dn23: - `kaṭuka` → "bitter"
  (dn23:27.17 "Soon you'll know the bitter fruit!"; dhp66:4 "that ripen as bitter fruit"). - `litta`
  → "smeared" (dn23:27.15 "they're smeared with most terrible venom"; "smeared" 24 lượt trong tầng).
  - `tejasā` KHÔNG dịch là "venom" như Sujato ở dn23:27.15, vì `tejasā` là ÁNH SÁNG và ở dn23 Sujato
  đã lệch vị (xem dưới). Dịch "brilliance" (4 lượt). Bản Việt dự án dịch "ánh sáng" — cùng hướng. -
  `bhavissatī` → "will turn" (dn23 "you'll know" là vì có "bitter fruit" của hạt xúc đắng mà ở đây
  không có, nên không vay).

  LỆCH CÓ CHỦ ĐÍCH, PHẢI ĐỌC KỸ ĐỂ KHÔNG TƯỞNG LÀ SAI: ở dn23, bản Anh đã ghim dịch `Littaṁ paramena
  tejasā` (27.14) thành "The man swallows the dice without realizing" và 27.15 thành "they're
  smeared with most terrible venom" — tức HAI DÒNG BỊ LỆCH CHỖ so với Pāli, vì ở dn23 vế giới từ
  `Littaṁ` nối với `akkhē` (hạt xúc đắng) ở câu trước nên "smeared" rơi vào dòng kế. Ở đây câu kệ
  đứng riêng, không có từ nào để nối, nên phải dịch theo đúng vị trí Pāli: 1.1 là "smeared", 1.2 là
  "không ai nhận ra kẻ giả". Đây là chỗ tầng Anh đã ghim không giữ được, nên không thể dùng làm tiền
  lệ cho vị trí từ — chỉ dùng cho TỪ.

  BẤT ĐỊNH: `pāpadhuttaka` — "evil-doer" (theo bản Việt "kẻ phạm tội") hoặc "cheat" (theo Sujato ở
  dn23 và theo từ `dhutta`). "evil-doer" không có tiền lệ trong tầng ("evil-doer" 0 lượng), còn
  "cheat" có 6 lượng và khớp tiêu đề của chính `Kuhaka` bên cạnh (ja89); nhưng trong câu này động từ
  đứng trước là câu gọi, nên "evil-doer" sát `pāpa` hơn. Vì đặt mới và vì có hai cách, hạ
  terminology lẫn ambiguity.

  BẤT ĐỊNH: `Littaṁ paramena tejasā` mở đầu không có chủ ngữ trong tiếng Anh. Để nguyên như Pāli (vế
  bị lược), không thêm "he is" — vì bổ sung chủ ngữ là bịa. Câu 1.1 vì vậy đọc được theo cả hai
  chiều: người bị bôi, hoặc kẻ bôi.

  TRIANGULATION 8.0 CHO CẢ BÀI, KHÔNG PHẢI VÀI KHOÁ: tại commit đã ghim SuttaCentral KHÔNG xuất bản
  bản Anh nào cho 12 bài của lát này (`ja81` `ja82` `ja84`–`ja89` `ja91` `ja92` `ja148` `ja149`). Đo
  lại bằng cách liệt kê trực tiếp `files` của tầng `english-sujato` trong `source/upstream-
  manifest.json`: trong thư mục `sutta/kn/ja/` chỉ có 83 tệp, tức `ja1`–`ja79` cộng `ja126` `ja159`
  `ja466` `ja534` — không có bài nào trong 12 bài này. Nên đây KHÔNG phải lấp chỗ trống quanh một
  bản Anh đã ghim, mà là **bản Anh của chính dự án, viết từ Pāli một mình**: không có tầng Anh nào
  độc lập để đối chiếu cú pháp, compound và sắc thái. Bản Việt dự án đã dịch đủ 9/9 khoá cho cả 12
  bài nhưng KHÔNG phải tầng Anh, lại cùng do một agent chấm, nên không thay được tầng đối chiếu.
  Cùng lý do đó, `save_fill` KHÔNG in cảnh báo "Pāli trùng" cho khoá nào ở lát này — không có chỗ
  nào đã có bản ghim để so — nên luật 3 của lớp phải tự giữ bằng mắt (xem các mục bên dưới).

  TỚNG THỨC: mỗi bài có 0.1–0.4 (tiêu đề) + 1.1–1.4 (một câu kệ bốn nhịp) + 2.1 (lời dẫn đóng
  `…jātakaṁ <thứ>ṁ.`); giữ nguyên cấu trúc đó, không gộp, không thêm khoá truyện nào.

  TIỀN LỆ ĐẾM ĐƯỢC, dùng chung cho cả lát (đếm trong tầng `kn` của bản Anh đã ghim): `Jātaka` →
  "Stories of Past Lives N " ở 82/82 tệp `ja*` có chữ ở 0.1, tất cả cùng một chữ; `Ekakanipāta` →
  "The Book of the Ones " ở 80/83 tệp (3 tệp còn lại là Dukanipāta `ja159`, Dvādasakanipāta `ja466`,
  và `ja534` không có chữ — không phải Ekakanipāta), và cùng chữ đó còn xuất hiện ở 0.2 của toàn bộ
  `iti*` và `thag1`/`thig1`. Định dạng 0.4 `N. Xjātaka` → "<Tiêu đề>: a past life story " ở 82/82
  tệp, số thứ tự bị bỏ, giữ đuôi câu. Khoá 2.1 (lời dẫn đóng) bị Sujato ĐỂ TRỐNG ở 79/83 tệp — nên
  đây đúng là những khoá phải lấp. Số thứ tự trong 2.1 (First…Ninth) lấy đúng bộ chữ của chính lớp
  fill: quét `content/translation/en/project/sutta/` cho khoá `2.x`/`4.x` kết thúc bằng số thứ tự
  cho First 2, Second 2, Third 3, Fourth 2, Fifth 1, Sixth 1, Seventh 1, Eighth 1, Ninth 1.

  TÊN PHẨM Ở 0.3 KHÔNG CÓ KHOÁ SEGMENT NÀO ĐÃ GHIM TRÙNG PHẨM, nên lấy từ tệp TÊN của chính
  SuttaCentral tại commit đã ghim, `name/sutta/ja-name_translation-en-sujato.json` — cùng một người
  dịch, cùng một commit, nên đây là tiền lệ có bằng chứng chứ không phải phỏng đoán. Cần nói thẳng
  một điều, vì nó ảnh hưởng cả ba phẩm của lát: tầng segment và tệp tên KHÔNG thống nhất với nhau. Ở
  11 phẩm mà tầng segment có chữ (đếm đủ 11/11), giá trị 0.3 trong segment và giá trị phẩm trong tệp
  tên trùng nhau đúng 2 (Itthi "Women", Sīla "Ethics") và lệch nhau 9. Chọn tệp tên là vì không có
  lựa chọn nào khác có bằng chứng; tiền lệ cho đúng cách làm này là `ja131` (Asampadānavagga) và
  `ja121` (Kusanāḷivagga) trong lớp fill. Tương ứng: Apāyimhavagga = "We Drank" (90.ja-
  apayimhavagga), Littavagga = "A Smear of Poison" (101.ja-littavagga), Kakaṇṭakavagga = "The Iguana
  Who Befriended a Chameleon" (156.ja-kakantakavagga).

  MỘT ĐIỀU PHẢI ĐỌC KỸ ĐỂ KHÔNG TƯỞNG LÀ LỖI LẶP: ở cả ja91 và ja92, 0.3 (tên phẩm Littavagga) và
  0.4 (tên bài) CÙNG dịch là "A Smear of Poison", vì chính tệp tên của Sujato tại commit đã ghim
  vậy: 101.ja-littavagga = "A Smear of Poison " và 102.ja91 = "A Smear of Poison ". Sujato dùng
  chung một chữ cho tên phẩm và cho câu chuyện đầu phẩm, y hệt ở Kusanāḷivagga (134.ja-kusanalivagga
  và 135.ja121 trùng nhau). Pāli cũng trùng (`Littavagga` / `1. Littajātaka`), nên đây là trung
  thành với Pāli chứ không phải lặp do đánh máy. Ngược lại, ở Kakaṇṭakavagga thì PHẢI tránh: 267.ja-
  singalavagga = "The Jackal " trùng đúng với tên bài 164.ja148, nên nếu dịch 0.3 của Kakaṇṭakavagga
  là "The Jackal" thì tên phẩm lẫn tên bài đều thành "The Jackal" và mất dấu vết phẩm Siṅgāla ở đúng
  chỗ cần phân biệt. Đó là lý do 0.3 của ja148/ja149 là "The Iguana Who Befriended a Chameleon".

  COLOPHON 2.1 DÙNG LẠI ĐÚNG TIÊU ĐỀ 0.4 KÈM SỐ THỨ TỰ, vì Pāli cũng lặp lại tên bài ở 2.1
  (`Surāpānajātakaṁ paṭhamaṁ.`).

  CỜ `rven88.py` HỢP LỆ, PHẢI ĐỌC VÀ GIẢI TRÁCH KHÔNG ĐƯỢC BỎ QUA — cả 4 cờ đều là lặp CỐ Ý mà Pāli
  cũng lặp, nên giữ lặp: 1. `ja148:1.2` "nor ever again, again" (lặp từ liền kề). Pāli `na cāpi
  apunappunaṁ`: vế `apunappunaṁ` tự chứa hai âm `puna` bên trong nó, và 1.1 đã có `punaṁ` hai lần —
  tổng ba lần "again" ở tiếng Anh đúng bằng ba lần `puna` của Pāli. 2. `ja81:1.2` "nor sang, nor
  wept" (lặp cụm, một từ ngăn). Pāli `agāyimha rudimha ca` không có liên từ giữa hai vế, nhưng cả
  1.1–1.2 là chuỗi BỐN phủ định (`Apāyimha` `anaccimha` `agāyimha` `rudimha`); tiếng Anh phải có
  "nor" lặp để giữ chuỗi, đây là cặp liên từ bắt buộc chứ không phải lặp do dịch cẩu thả. 3.
  `ja88:1.3` "The release of the good is good" (lặp cụm, một từ ngăn). Pāli `Mokkho kalyāṇiyā sādhu`
  lặp ý "thiện" ngay trong một nhịp (`kalyāṇiyā` + `sādhu`) — đây là điểm cố ý của câu kệ, dịch ra
  tiếng Anh cũng phải lặp. 4. `ja91:1.3` "Liar, liar, you evil-doer!" (lặp từ liền kề). Pāli `Gila
  re gila` lặp đúng `gila` hai lần. Không có cờ nào về Pāli lọt vào bản Anh ở 12 bài này.

  ĐỘ DÀI BẢN DỊCH SO VỚI PĀLI: chốt của kho không kiểm, và `rven88.py` đã bỏ hẳn phép so này vì sẽ
  báo động giả. Đối chiếu tay: câu kệ bốn nhịp này ngắn hơn Pāli rõ rệt, đúng như tỉ số Anh/Pāli
  trung vị ~1.5 mà chính tài liệu của `rven88.py` ghi — vì Pāli dính hạt tạo tiếng (`Apāyimha
  anaccimha`) và hậu tố. Không có câu nào bị cắt ý.

  Triangulation 8.0 là trần của lớp lấp, ghi ở đây để người biên tập không tưởng là thiếu sót riêng
  của bài.
