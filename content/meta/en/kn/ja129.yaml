notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI, KHÔNG PHẢI VÀI KHOÁ: tại commit đã ghim SuttaCentral KHÔNG xuất bản
  bản Anh nào cho bài này — đo bằng `upstreamPublishes('english-sujato', 'kn/<uid>')` trên
  `source/upstream-manifest.json`, và kiểm lại bằng cách dò trực tiếp
  `.cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/` (83 tệp có mặt, trong đó có
  `ja126` nhưng không có bài này). Vì vậy đây KHÔNG phải lấp chỗ trống quanh một bản Anh đã ghim, mà
  là **bản Anh của chính dự án, viết từ Pāli một mình**: không có tầng Anh nào độc lập để đối chiếu
  cú pháp và sắc thái. Bản Việt dự án đã dịch đủ 9/9 khoá nhưng KHÔNG phải tầng Anh, và lại cùng do
  một agent chấm, nên không thay được tầng đối chiếu. Cùng lý do, `save_fill` không in cảnh báo
  "Pāli trùng" cho khoá nào ở lát này — không có chỗ nào đã có bản ghim để so — nên luật 3 của lớp
  phải tự giữ bằng mắt (xem các ghi chú tiền lệ bên dưới).

  TỚNG THỨC: mỗi bài có 0.1–0.4 (tiêu đề) + 1.1–1.4 (một câu kệ bốn nhịp) + 2.1
  (lời dẫn đóng `…jātakaṁ <thứ>ṁ.`); giữ nguyên cấu trúc đó, không gộp, không thêm
  một khoá truyện nào.

  TIỀN LỆ ĐẾM ĐƯỢC, dùng chung cho cả lát (đếm trong tầng `kn` của bản Anh đã ghim):
  `Jātaka` → "Stories of Past Lives N " 83/83 tệp `ja*_translation-en-sujato.json`;
  `Ekakanipāta` → "The Book of the Ones " 80/83; `N. Xjātaka` → "<Tiêu đề>: a past
  life story " 82/83 (số thứ tự bị bỏ, giữ đuôi câu); khoá 2.1 (lời dẫn đóng
  `…jātakaṁ <thứ>ṁ.`) bị Sujato ĐỂ TRỐNG ở 79/83 tệp — nên đây đúng là những khoá
  phải lấp. Còn tên phẩm
  và tên bài thì lấy từ tệp TÊN của chính SuttaCentral tại commit đã ghim,
  `name/sutta/ja-name_translation-en-sujato.json` — cùng một người dịch, cùng một
  commit, nên đây là tiền lệ có bằng chứng chứ không phải phỏng đoán.

  CỜ `rven88.py` HỢP LỆ, PHẢI ĐỌC VÀ GIẢI TRÁNH KHÔNG ĐƯỢC BỎ QUA:
  `kn/ja129:0.4` và `kn/ja129:2.1` bị quét báo "từ Pāli lọt vào bản Anh — Bhāradvāja".
  Đây là báo động giả, và lý do là cấu trúc chứ không phải lười:
  `rven88.py` lấy danh sách từ được phép từ BẢN ANH ĐÃ GHIM CỦA CHÍNH BÀI ĐÓ, mà 12
  bài của lát này không có bản Anh đã ghim nào — danh sách rỗng, nên MỌI từ có dấu
  Pāli đều bị báo. Chốt của repo (`save_fill`) dùng danh sách theo CẢ TẦNG và đã cho
  qua `Bhāradvāja`: tầng Anh đã ghim viết "Bhāradvāja" 36 lượt trong 7 tệp
  (snp1.4, snp1.7, snp3.4, snp3.9, thag2.2, thag2.29, ud4.6). Đó là chính nhân vật của
  câu chuyện này, nên giữ dấu là đúng và không phải lọt chữ.

  TIỀN LỆ ĐẾM ĐƯỢC riêng cho bài này: `aggika` → "fire-worshiper": đây không phải đoán
  mà là tiền lệ trực tiếp của CHÍNH nhân vật này — "Fire-Worshiper" 5 lượt trong
  snp1.7 (tầng `kn`) và 6 lượt trong sn7.8 (cùng bản ghim, ngoài tầng `kn`), cộng
  "fire-worshiping" ở dn23:21.0 và dn23:21.3; `fire-worship*` gộp lại 13 lượt trong 3
  tệp. Tên bài theo `ja-name:143.ja129` = "Bhāradvāja, Servant of the Sacred Flame ".
  `sikhā` → "tuft of hair": Sujato dùng "crest" cho chính từ `sikhā` ở dn20:15.2
  ("blazing like a crested flame") và "tuft" 16 lượt cho tóc; ở đây là búi tóc dâng
  hiến nên "tuft of hair" rõ nghĩa.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO: `nāguṭṭhigaṇanaṁ yāti` — thành ngữ "đếm bằng
  ngón tay" không có bản dịch nào trong tầng ("counting on the fingers" 0 lượng;
  "finger" 74 lượt, "thumb" 4 lượng). Dịch "it does not come to counting on the
  fingers" là cách sát nghĩa nhất mà không thêm ý "không đáng đem ra đếm" (là cách
  đọc khác, dễ thành vòng tròn). Vì đặt mới nên hạ terminology.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU: `yāti` ở 1.3 nghĩa bề mặt là "đi đến", nên
  "nó đi tới chỗ đếm bằng ngón tay" nghe vô nghĩa; chỗ này chỉ đọc được như một mệnh
  đề ẩn dụ (nó không đáng đếm), và bản Việt dự án cũng chọn đúng cách đó. Vì
  `Nāguṭṭhigaṇanaṁ` chỉ xuất hiện ở đúng một chỗ này, không có song song để so,
  nên hạ ambiguity và ghi ở đây.

  `alaṁ te hotu` giữ cả mệnh cầu `hotu` ("may that be enough for you") chứ không rút
  thành "you have had enough", vì Pāli là câu cầu nguyện.

  LƯU Ý: bản Anh đã ghim KHÔNG có câu kệ này ở mn80 (bản bilara tại commit đã ghim
  cắt mất đoạn `sikhā`), nên không có bản Anh nào để đối chiếu trực tiếp cho cả bài
  — cộng thêm một lý do nữa cho trần 8.0.
