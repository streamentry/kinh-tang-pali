notes: |-
  3.2 trùng nguyên văn 1.4, chỉ khác ở dấu ngoặc: 1.4 mở bằng `“` đóng bằng `”`
  (đó là lời thoại trực tiếp), 3.2 mở bằng `‘` đóng bằng `’` (đó là lời dẫn lại
  cuộc trò chuyện trước đó, lồng trong lời thoại đã mở ở 3.1). Vì vậy lấy nguyên văn
  bản dịch 1.4 nhưng giữ cặp ngoặc của Pāli:
  "‘Which of these two kings has greater wealth, riches, treasury, dominion, vehicles,
  forces, might, and power: King Seniya Bimbisāra of Magadha or King Pasenadi of
  Kosala’?"

  Thuật ngữ lấy nguyên từ 1.4: `mahaddhanataro … mahānubhāvataro` → "greater wealth,
  riches, treasury, dominion, vehicles, forces, might, and power"; `māgadho` → "of
  Magadha"; `seniyo bimbisāro` → "King Seniya Bimbisāra" (giữ dấu, vì bản đã ghim của
  chính bài đã dùng); `pasenadi kosalo` → "King Pasenadi of Kosala".

  3.3 = `Ayaṁ kho no, bhante, antarākathā vippakatā, atha bhagavā anuppatto”ti.`
  Dịch: "This conversation was left unfinished, sir, and then the Buddha arrived.”".
  `vippakatā` lấy từ 1.5 và 2.3 của chính bài ("left unfinished"); `anuppatto` =
  "arrived". `bhagavā` chọn "the Buddha" cho khớp 2.1 của chính bài ("they went up to
  the Buddha") — đếm cả tầng `kn`: "the Buddha" 1030 lần, "the Blessed One" 138 lần.

  Hệ quả người đọc thấy, nói thẳng: dấu `”` ở 3.3 là ngoặc đóng "mồ côi" vì bản đã
  ghim ở 3.1 KHÔNG mở ngoặc (nó kết bằng "The Buddha said," trong khi Pāli 3.1 có
  `“`). Pāli 3.1–3.3 thì cân (một `“`, một `”`); bản đã ghim đã đóng sớm ở 3.1. Bỏ
  dấu ở 3.3 thì lệch số ngoặc với Pāli, nên phải giữ. `vietnamese_clarity` hạ 8.8 và
  `ambiguity_integrity` 9.0 vì lựa chọn ở đây là né hệ quả của bản đã ghim.

  Dấu câu ở 3.2: đặt dấu hỏi SAU dấu ngoặc đóng (`Kosala’?`) chứ không phải trước
  (`Kosala?”` như 1.4 đã ghim, và như 3542 nơi trong bản Anh đã ghim). Lý do: 3.2 là
  lời dẫn lại lời thoại đã mở ở 3.1 bằng `“`, nên nó là một cặp `‘` … `’` lồng bên
  trong, và Pāli 3.2 viết đúng như vậy (`‘…kosalo’ti?`). Giữ `?”` sẽ đóng nhầm sang
  cặp ngoài. Cùng lý do đó mà 3.3 mang `”` chứ không phải `’`: nó đóng cặp ngoài
  mà 3.1 đã mở.

  Lớp lấp: 2 khoá nằm ở phần bản Anh đã ghim đã lược. Triangulation 8.0: không có
  bản Anh độc lập phủ.
