notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI: không có tệp `english-sujato` cho `mil6.2.8` tại commit đã
  ghim (`sutajato()` = 0/9 khoá). Bản Anh của chính dự án, viết từ Pāli một mình; tầng Việt
  hiện hành ở commit đã ghim chỉ có Pháp Cú. Giới hạn thiết kế của lớp lấp, KHÔNG phải blocker.

  TIÊU ĐỀ: mil-name:185.mil6.2.8 = "The Method Of Promulgating the Rules" trong tệp tên đã
  ghim; 0.4 = "8. The Method of Promulgating the Rules" và colophon 4.1 dùng lại đúng tiêu đề
  đó (Pāli cũng lặp lại tên bài ở 4.1). Chữ "of" viết thường theo 17 tiền lệ còn lại của lớp
  (`The Question on the Root of Time`). 0.3 `Nippapañcavagga` → "Non-Proliferation" là BẮT
  BUỘC: cùng một chuỗi Pāli với mil6.2.4:0.3, nên phải một lời.

  ĐÂY LÀ BÀI DÀI NHẤT LÁT: khoá 1.2, 2.1 và 3.1 là ba đoạn văn lớn, dịch từng mệnh đề theo
  đúng thứ tự Pāli, giữ nguyên số lượng của TỪNG danh sách trong TỪNG khoá: 8 tên thầy thuốc
  cổ, 7 khoảng mục về bệnh (phát sinh · nguyên nhân · bản chất · khởi lên · cách chữa · cách
  tiến hành · thành công và không thành công), và 4 vị tính tình đứng thành chuỗi.
  LƯU Ý ĐÃ SỬA SAU REVIEW: 1.2 có đủ bốn vị (`ayase`, `pākaṭe dose`, `vitthārike dose`,
  `puthugate`) còn 2.1 CHỈ có `pākaṭe dose` — bản nháp đầu của tôi đã lấy danh sách của 1.2
  sang 2.1, review đối kháng bắt được và đã sửa, giờ 2.1 chỉ dịch "those fallen into matured
  distress".

  PHỦ ĐỊNH DÍNH VÀO `anavasesa` — chỗ dễ làm sai nhất của bài: `anavasesato sikkhāpadaṁ na
  paññapesi` là "KHÔNG chế định giới hạnh tu học nào cho TRỌN VẸN", khác hẳn với "không
  chế định giới hạnh tu học nào". Đã giữ nghĩa thứ nhất. `sikkhāpada` → "training rules" bám
  tiền lệ tầng (54 lượt, có cả trong mil).

  0 TIỀN LỆ, ĐẶT MỚI:
  - `santāsa` → "fatigue": chán nản có 8 tiền lệ nhưng cho nghĩa gần hơn là `nibbidā`/`virāga`;
    ở đây là sự mệt mỏi của đám đông, nên đây là lựa chọn riêng theo ngữ cảnh.
  - `ekappahāra` → "in a single stroke": 0 tiền lệ. Cùng một chữ ở 1.2 và 2.1 nên dịch giống
    nhau.
  - `apāyagāmino` → "led to ruin"; `buddhañāṇena` → "through his knowledge as a Buddha";
    `sampaṭicchāmi` → "I accept this exactly as it is" (giữ ngôi thứ nhất của người nói).

  TÁM TÊN THẦY THUỐC CỔ BỊ BỎ DẤU ĐỒNG LOẠT, VÀ ĐÂY LÀ MỘT NHƯỢNG ĐIỂM PHẢI GHI:
  bản ghim không dùng `Dhammantarī`, `Kaṇḍaraggi`, `Sāmo`, `Pubbakaccāyano` (đã tra: 0 lượt
  trong tầng Anh đã ghim của `kn`), và chốt `_lọt_pāli` chặn dấu Pāli chưa có trong tầng ghim,
  nên tôi viết không dấu: Narada, Dhammantari, Angiraso, Kapilo, Kandaraggi, Samo, Atulo,
  Pubbakaccayano. Có tiền lệ cùng kiểu trong tầng (ja125 "Katahaka" cho Kāṭahaka). Vì vậy
  `terminology` chỉ 9.1, và biên tập nên cân nhắc khôi phục dấu nếu tầng ghim được mở rộng.

  BẤT ĐỊNH:
  (1) `sādhikaṁ diyaḍḍha` → "more than a hundred and fifty": "hơn một phần rưỡi trăm", tức
  hơn 150, KHÔNG dịch thành 150 rồi làm tròn (cả 2.1 và 3.1 đều nói số này).
  (2) `sattānaṁ santāso uppajjeyya` ở 3.1 — "the seven would be overcome by fatigue". Pāli nói
  "sattānaṁ" nhưng không nêu bảy người là ai; tôi dịa nguyên văn và KHÔNG nêu tên, vì tên
  sẽ là bịa.

  CỔNG KỸ THUẬT: `save_fill` PASS 9/9 khoá, kể cả ba khoá có nhiều dấu nháy kép lồng nhau
  (1.2 có 1 mở + 1 đóng trong câu trích và 1 đóng ở cuối; 2.1 cân 4 mở với 4 đóng; 3.1 cân
  2 với 2); `rven88.py` không báo cờ nào. CHƯA chạy — `npm run validate`, `npm test`,
  `npm run check`, `npm run build` (lát bị lệnh cấm). `technical_integrity` 9.8;
  NGƯỜI ĐIỀU PHỐI phải chạy lại bốn lệnh đó.
  Triangulation 8.0 là trần của lớp lấp.
