notes: |-
  TRIANGULATION 8.0 CHO CẢ BÀI, KHÔNG PHẢI VÀI KHOÁ: tại commit đã ghim SuttaCentral KHÔNG xuất bản
  bản Anh nào cho bài này — đo bằng `upstreamPublishes('english-sujato', 'kn/<uid>')` trên
  `source/upstream-manifest.json`, và kiểm lại bằng cách dò trực tiếp
  `.cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/` (83 tệp có mặt, trong đó có
  `ja126` nhưng không có bài này). Vì vậy đây KHÔNG phải lấp chỗ trống quanh một bản Anh đã ghim, mà
  là **bản Anh của chính dự án, viết từ Pāli một mình**: không có tầng Anh nào độc lập để đối chiếu
  cú pháp và sắc thái. Bản Việt dự án đã dịch đủ 9/9 khoá nhưng KHÔNG phải tầng Anh, và lại cùng do
  một agent chấm, nên không thay được tầng đối chiếu. Cùng lý do, `save_fill` không in cảnh báo
  "Pāli trùng" cho khoá nào ở lát này — không có chỗ nào đã có bản ghim để so — nên luật 3 của lớp
  phải tự giữ bằng mắt (xem các ghi chú tiền lệ bên dưới).

  TỚNG THỨC: mỗi bài có 0.1–0.4 (tiêu đề) + 1.1–1.4 (một câu kệ bốn nhịp) + 2.1
  (lời dẫn đóng `…jātakaṁ <thứ>ṁ.`); giữ nguyên cấu trúc đó, không gộp, không thêm
  một khoá truyện nào.

  TIỀN LỆ ĐẾM ĐƯỢC, dùng chung cho cả lát (đếm trong tầng `kn` của bản Anh đã ghim):
  `Jātaka` → "Stories of Past Lives N " 83/83 tệp `ja*_translation-en-sujato.json`;
  `Ekakanipāta` → "The Book of the Ones " 80/83; `N. Xjātaka` → "<Tiêu đề>: a past
  life story " 82/83 (số thứ tự bị bỏ, giữ đuôi câu); khoá 2.1 (lời dẫn đóng
  `…jātakaṁ <thứ>ṁ.`) bị Sujato ĐỂ TRỐNG ở 79/83 tệp — nên đây đúng là những khoá
  phải lấp. Còn tên phẩm
  và tên bài thì lấy từ tệp TÊN của chính SuttaCentral tại commit đã ghim,
  `name/sutta/ja-name_translation-en-sujato.json` — cùng một người dịch, cùng một
  commit, nên đây là tiền lệ có bằng chứng chứ không phải phỏng đoán.

  TIỀN LỆ ĐẾM ĐƯỢC riêng cho bài này, và nó quyết định cả bài: `jhāna` → "absorption"
  (604/644 khoá Pāli có `jhāna` trong tầng đều dịch "absorption"), `samāpatti` →
  "attainment" (mn111:18.1 "that attainment", mn136:2.6 "such an attainment") — hai từ
  Pāli khác nhau nên hai chữ tiếng Anh khác nhau, và tiêu đề dùng "Absorption" theo
  `jhāna` còn thân bài dùng "attainment" theo `samāpatti`. Đó là lý do cả hai cùng
  tồn tại trong cùng một bài. `vivajjaya` → "shun" (thag5.6:1.4 "I shunned wrong
  view"; dn30:2.18.3 "he shunned lies"; thag10.6:7.2 "avoid"). `saññā` → "perception"
  trong ngữ cảnh chứng đạt, vì Sujato dịch `saññāvedayita` là "perception and
  feeling" và `nevasaññānāsaññāyatana` là "neither perception nor non-perception";
  cùng dạng với vế "with consciousness, not without consciousness" ở an2.85:1.1.

  0 TIỀN LỆ, ĐẶT MỚI, GHI RÕ LÝ DO: `anaṅgaṇa` — 0 lượt trong tầng Anh (không
  "tarnish", không "stain", không "blemish", không "flaw"). Dịch "untarnished" vì
  đây là hình ảnh mặt nước không vết, hợp với `sukhaṁ` ở cùng câu. Đặt mới nên hạ
  terminology. Không thêm "pure" hay "clean" vì Pāli không có.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU: `duggatā` (1.1 và 1.2, lặp đúng hai lần trong Pāli và
  được giữ lặp trong bản Anh) có thể là "rơi vào khó khó" (đọc bám nghĩa đen, bản Việt
  dự án theo cách này) hoặc "khó cải tổ/khó huấn luyện" (đọc theo nghĩa xã hội).
  Chọn "are in trouble" vì ít giả định hơn. Vì có hai cách và cả hai đều dùng được cho
  cả vế 1.1 lẫn 1.2, `ambiguity_integrity` hạ điểm.

  Pāli không có từ giới hạn nào ở đây, nên bản Anh không thêm chữ "chỉ" hay "only";
  `anaṅgaṇan` đã mang sẵn nghĩa "không tỳ vết" nên "the untarnished bliss of
  attainment" không dư một hạn từ nào. Ghi lại vì đó là lỗi dễ tái diễn khi dịch
  cặp câu kệ bốn nhịp.

  `Etaṁ ubhayaṁ` ở 1.3 dịch "both of these" (đối với hai nhóm ở 1.1 và 1.2, mà Pāli
  không định danh lại); không thêm "kinds" hay "states" vì Pāli không có.
