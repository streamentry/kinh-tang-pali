upadhi:
  preferred: "sanh y"
  allowed: ["sanh y"]
  severity: warn
  note: "Quyết định 2026-10-08: `sanh y` (theo HT. Thích Minh Châu, đã dùng ở MN66/MN92). Không dùng `thủ`/`chấp thủ`/`chấp giữ` vì trùng `upādāna`, không dùng `dư y` vì trùng `upādisesa`. Áp cho cả các dạng ghép: `nirupadhi` = không còn sanh y, `upadhisaṅkhaya` = diệt tận sanh y, `upadhivepakka` = cảm quả nơi sanh y, `saupadhika/anupadhika` = có/không có sanh y."

khattiya:
  preferred: "Sát-đế-lợi"
  allowed: ["Sát-đế-lợi", "sát-đế-lợi"]
  severity: warn
