# ---- Quyết định thuật ngữ 2026-10-08, phần 2 (áp toàn bộ năm Nikāya) -----------------------

cakkhuviññāṇa:
  preferred: "thức mắt"
  allowed: ["thức mắt"]
  severity: warn
  note: "Quyết định 2026-10-08: sáu thức theo căn viết `thức mắt, thức tai, thức mũi, thức lưỡi, thức thân, thức ý`; sáu xúc `xúc mắt … xúc ý` (thay `nhãn thức/ý thức`, `nhãn xúc/ý xúc`). Lý do: `ý thức` trùng nghĩa thông dụng của tiếng Việt hiện đại (`có ý thức`), dễ đọc sai; dạng thuần Việt minh bạch và đã được MN/KN chọn."

manoviññāṇa:
  preferred: "thức ý"
  allowed: ["thức ý"]
  severity: warn
  note: "Xem `cakkhuviññāṇa`."

parinibbāyati:
  preferred: "chứng đạt Niết-bàn"
  allowed: ["chứng đạt Niết-bàn", "Bát-niết-bàn", "nhập Niết-bàn", "diệt độ"]
  severity: warn
  note: "Quyết định 2026-10-08 cho công thức `anupādiyaṁ na paritassati, aparitassaṁ paccattaññeva parinibbāyati` = `Không chấp thủ, vị ấy không lo âu; không lo âu, vị ấy tự mình chứng đạt Niết-bàn` (thay `tự mình tịch diệt` — dễ hiểu thành chết). Khi nói về sự viên tịch của Đức Phật/vị A-la-hán (DN16) giữ `diệt độ`/`nhập Niết-bàn` theo ngữ cảnh."

appamaññā:
  preferred: "lan tỏa"
  allowed: ["lan tỏa"]
  severity: warn
  note: "Quyết định 2026-10-08, công thức tứ vô lượng: `Vị ấy an trú với tâm từ lan tỏa một phương, rồi phương thứ hai, phương thứ ba, phương thứ tư. Như thế, trên, dưới, ngang, khắp mọi nơi, đối với tất cả như đối với chính mình, vị ấy an trú với tâm từ rộng lớn, cao cả, vô lượng, không thù hận, không ác ý, lan tỏa khắp toàn thế giới.` (thay `biến mãn`, `tán quán`, `tràn lan`; giữ đủ vế `sabbattatāya`)."

