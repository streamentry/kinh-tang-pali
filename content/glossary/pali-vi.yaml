citta:
  preferred: "tâm"
  allowed: ["tâm", "tâm ý"]
  severity: warn
  note: "Không cưỡng ép một từ Việt cho mọi ngữ cảnh."

vedanā:
  preferred: "thọ"
  severity: warn

sati:
  preferred: "niệm"
  allowed: ["niệm", "chánh niệm"]
  severity: warn

aṅgaṇa:
  preferred: "uế nhiễm"
  allowed: ["uế nhiễm"]
  severity: warn
  note: "MN5: TMC dùng `cấu uế`; canonical chọn `uế nhiễm`, dùng nhất quán kể cả tiêu đề Anaṅgaṇasutta = Kinh Không Uế Nhiễm."

nīvaraṇa:
  preferred: "triền cái"
  allowed: ["triền cái"]
  severity: warn
  note: "AN1.11-20: giữ Hán–Việt kỹ thuật quen thuộc cho `nīvaraṇa`."

kāmacchanda:
  preferred: "dục tham"
  allowed: ["dục tham"]
  severity: warn
  note: "AN1.11/1.16: một trong năm triền cái; không làm phẳng thành `dục` hay `ham muốn` nói chung."

byāpāda:
  preferred: "sân hận"
  allowed: ["sân hận"]
  severity: warn
  note: "AN1.12/1.17: triền cái ác ý/sân."

thīnamiddha:
  preferred: "hôn trầm và buồn ngủ"
  allowed: ["hôn trầm và buồn ngủ"]
  severity: warn
  note: "AN1.13/1.18: giữ `hôn trầm` như thuật ngữ kỹ thuật, diễn `middha` thành `buồn ngủ` cho dễ hiểu."

uddhaccakukkucca:
  preferred: "xao động và hối tiếc"
  allowed: ["xao động và hối tiếc"]
  severity: warn
  note: "AN1.14/1.19: triền cái kép; giữ hai thành phần uddhacca + kukkucca."

vicikicchā:
  preferred: "nghi hoặc"
  allowed: ["nghi hoặc"]
  severity: warn
  note: "AN1.15/1.20."

yoniso_manasikāra:
  preferred: "tác ý như lý"
  allowed: ["tác ý như lý"]
  severity: warn
  note: "AN1.16/1.20; dạng phủ định `ayoniso` = `tác ý không như lý` (AN1.11/1.15). Trật tự tự nhiên hơn TMC `như lý tác ý`."

subhanimitta:
  preferred: "tướng đẹp đẽ"
  allowed: ["tướng đẹp đẽ"]
  severity: warn
  note: "AN1.11: tránh `tịnh tướng` vì độc giả hiện đại dễ hiểu `tịnh` là thanh tịnh."

asubhanimitta:
  preferred: "tướng bất tịnh"
  allowed: ["tướng bất tịnh"]
  severity: warn
  note: "AN1.16: thuật ngữ truyền thống; không thu hẹp thành `xấu xí`."

paṭighanimitta:
  preferred: "tướng đáng ghét"
  allowed: ["tướng đáng ghét"]
  severity: warn
  note: "AN1.12: tướng bị nhận là đáng ghét, gây phản ứng chống đối; xem comment AN1.12."

mettā_cetovimutti:
  preferred: "tâm giải thoát nhờ lòng từ"
  allowed: ["tâm giải thoát nhờ lòng từ"]
  severity: warn
  note: "AN1.17: giữ cả `mettā` và `cetovimutti`; không làm phẳng thành chỉ `lòng từ`."

rasa:
  preferred: "hương vị"
  allowed: ["hương vị"]
  severity: warn
  note: "AN1.4/1.9 (đối tượng vị giác): không dùng `vị` đứng một mình vì dễ nhầm với tôn xưng/từ chỉ địa vị."

cittaṁ_pariyādāya_tiṭṭhati:
  preferred: "chiếm ngự tâm"
  allowed: ["chiếm ngự tâm"]
  severity: warn
  note: "Công thức AN1.1-10: bị đối tượng giác quan nắm giữ và chi phối; ngắn hơn TMC `xâm chiếm và ngự trị tâm`."

pamāda:
  preferred: "phóng dật"
  allowed: ["phóng dật", "buông lung"]
  severity: warn
  note: "MN7: danh sách 16 ô nhiễm của tâm; `phóng dật` là thuật ngữ chuẩn trong bản dịch Việt (TMC); draft MN dùng `buông lung`."

bhāvita:
  preferred: "được tu tập"
  allowed: ["được tu tập"]
  severity: warn
  note: "AN1.21-30: phân từ của `bhāveti`; dạng phủ định `abhāvita` = `không được tu tập`."

kammaniya:
  preferred: "đắc dụng"
  allowed: ["đắc dụng"]
  severity: warn
  note: "AN1.21-22: `kamma + iya`, hợp/kham việc, có thể đem ra dùng được; phủ định `akammaniya` = `không đắc dụng`. Alternative `nhu nhuyến, dễ sử dụng` được ghi ở comment, không đưa vào canonical."

anattha:
  preferred: "bất lợi"
  allowed: ["bất lợi", "điều bất lợi"]
  severity: warn
  note: "AN1.23/25/27: điều không mang lại an lạc; `mahato anatthāya saṁvattati` = `đưa đến bất lợi lớn`. Đối xứng `attha` = `lợi ích`."

pātubhūta:
  preferred: "được hiển lộ"
  allowed: ["được hiển lộ"]
  severity: warn
  note: "AN1.25-26: hiện ra, trở nên rõ ràng; phủ định `apātubhūta` = `không được hiển lộ`. Không nâng thành tầng chứng đắc."

bahulīkata:
  preferred: "được làm cho sung mãn"
  allowed: ["được làm cho sung mãn"]
  severity: warn
  note: "AN1.27-30: được thực hành nhiều lần, làm cho đầy đủ; cặp công thức `bhāvita, bahulīkata` = `được tu tập, được làm cho sung mãn`."

ādhivaha:
  preferred: "mang đến"
  allowed: ["mang đến"]
  severity: warn
  note: "AN1.29-30: `dukkhādhivaha` = `mang đến khổ đau`, `sukhādhivaha` = `mang đến hạnh phúc`."
