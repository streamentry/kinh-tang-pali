name: Assemble translation
on:
  push:
    branches: [feat/mn45-152-translation]
    paths: [.assemble-translation-request]
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn45-152-translation
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Sync pinned Majjhima source
        run: npm run source:sync:mn
      - name: Assemble requested translations
        shell: bash
        run: |
          while IFS= read -r uid; do
            [ -z "$uid" ] && continue
            npx tsx scripts/assemble-translation.ts "$uid"
          done < .assemble-translation-request
      - name: Commit canonical translations and clear staging
        shell: bash
        run: |
          while IFS= read -r uid; do
            [ -z "$uid" ] && continue
            rm -rf "staging/$uid"
          done < .assemble-translation-request
          rm .assemble-translation-request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/translation/vi/project/sutta/mn staging .assemble-translation-request
          git commit -m "translate: assemble exact-key canonical MN translations"
          git push origin HEAD:feat/mn45-152-translation
