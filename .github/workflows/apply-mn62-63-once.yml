name: Apply audited MN62-63 once
on:
  push:
    branches: [feat/mn45-152-translation]
    paths:
      - '.mn62-63-payload.b64'
      - '.github/workflows/apply-mn62-63-once.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn45-152-translation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply audited translations
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .mn62-63-payload.b64 > /tmp/mn62-63.tar.gz
          tar -xzf /tmp/mn62-63.tar.gz
          node - <<'NODE'
          const fs=require('fs');
          for (const [uid,n] of [['mn62',122],['mn63',182]]) {
            const p=JSON.parse(fs.readFileSync(`content/translation/vi/project/sutta/mn/${uid}_translation-vi-project.json`,'utf8'));
            if(Object.keys(p).length!==n) throw new Error(`${uid}: expected ${n} segments`);
            if(Object.values(p).some(v=>!String(v).trim())) throw new Error(`${uid}: empty translation segment`);
            const meta=fs.readFileSync(`content/meta/sutta/mn/${uid}.yaml`,'utf8');
            if(!meta.includes('status: published')) throw new Error(`${uid}: not published`);
          }
          NODE
      - name: Full repository gate
        shell: bash
        run: |
          npm install
          npm run source:sync:used
          npm test
          npm run check
          npm run build
      - name: Commit only after gate passes
        shell: bash
        run: |
          set -euo pipefail
          rm .mn62-63-payload.b64 .github/workflows/apply-mn62-63-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content docs .mn62-63-payload.b64 .github/workflows/apply-mn62-63-once.yml
          git commit -m 'publish: MN62-MN63 after quality gate'
          git fetch origin feat/mn45-152-translation
          git rebase origin/feat/mn45-152-translation
          git push origin HEAD:feat/mn45-152-translation
