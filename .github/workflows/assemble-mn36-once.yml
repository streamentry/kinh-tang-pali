name: Assemble MN36 once

on:
  push:
    branches:
      - feat/mn1-50-translation-draft

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn1-50-translation-draft
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Sync pinned source
        run: npm run source:sync:used
      - name: Assemble and verify exact MN36 segment map
        run: node scripts/assemble-mn36-once.mjs
      - name: Remove staging machinery and commit canonical MN36
        run: |
          rm -f tmp/mn36-part{1,2,3,4,5,6}.json
          rm -f scripts/assemble-mn36-once.mjs .github/workflows/assemble-mn36-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/translation/vi/project/sutta/mn/mn36_translation-vi-project.json tmp scripts/assemble-mn36-once.mjs .github/workflows/assemble-mn36-once.yml
          git commit -m 'feat: translate MN36 with exact Pali alignment'
          git push origin HEAD:feat/mn1-50-translation-draft
