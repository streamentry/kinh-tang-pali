name: Publish MN61 single sutta
on:
  push:
    branches: [feat/mn45-152-translation]
    paths:
      - .mn61-single.b64
      - .github/workflows/apply-mn61-single.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn45-152-translation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply MN61 only
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .mn61-single.b64 > /tmp/mn61.tar.gz
          tar -tzf /tmp/mn61.tar.gz | sed 's#^\./##' | grep -v '/$' > /tmp/files.txt
          cat >/tmp/expected.txt <<'EOF'
          content/comment/vi/project/sutta/mn/mn61_comment-vi-project.json
          content/meta/sutta/mn/mn61.yaml
          content/translation/vi/project/sutta/mn/mn61_translation-vi-project.json
          docs/translation-notes/mn61.md
          EOF
          sort /tmp/files.txt -o /tmp/files.txt
          sort /tmp/expected.txt -o /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          tar -xzf /tmp/mn61.tar.gz
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('content/translation/vi/project/sutta/mn/mn61_translation-vi-project.json','utf8')); if(Object.keys(p).length!==134) throw new Error('MN61 must contain exactly 134 segments'); if(Object.values(p).some(v=>!String(v).trim())) throw new Error('MN61 contains empty translation segment')"
          grep -q '^status: published$' content/meta/sutta/mn/mn61.yaml
          rm .mn61-single.b64 .github/workflows/apply-mn61-single.yml
      - name: Validate corpus
        shell: bash
        run: |
          npm install
          npm run source:sync:used
          npm run validate
      - name: Commit and integrate MN61 only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/translation/vi/project/sutta/mn/mn61_translation-vi-project.json content/meta/sutta/mn/mn61.yaml content/comment/vi/project/sutta/mn/mn61_comment-vi-project.json docs/translation-notes/mn61.md .mn61-single.b64 .github/workflows/apply-mn61-single.yml
          git commit -m "publish: MN61 after quality gate"
          git fetch origin feat/mn45-152-translation
          git rebase origin/feat/mn45-152-translation
          git push origin HEAD:feat/mn45-152-translation
