name: Repair DN17 JSON

on:
  push:
    branches: [repair-dn17-temp]
    paths:
      - .github/workflows/repair-dn17.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: repair-dn17-temp
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Repair concatenation artifacts and validate JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('content/translation/vi/project/sutta/dn/dn17_translation-vi-project.json')
          s = p.read_text(encoding='utf-8')
          bad = '" +\n"  "'
          n = s.count(bad)
          if n == 0:
              raise SystemExit('No repairable concatenation artifacts found')
          s = s.replace(bad, '\n  "')
          json.loads(s)
          p.write_text(s, encoding='utf-8')
          print(f'Repaired {n} concatenation artifacts; JSON parses successfully.')
          PY
      - name: Commit repaired JSON
        run: |
          git config user.name "Stream Entry"
          git config user.email "978862+streamentry@users.noreply.github.com"
          git add content/translation/vi/project/sutta/dn/dn17_translation-vi-project.json
          git commit -m "fix(dn17): repair JSON serialization artifacts"
          git push origin HEAD:repair-dn17-temp
