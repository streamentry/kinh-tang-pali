name: Patch DN19 segment alignment

on:
  push:
    branches: [translate/digha-nikaya]
    paths:
      - .github/workflows/patch-dn19.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: translate/digha-nikaya
      - name: Patch audited segment values
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('content/translation/vi/project/sutta/dn/dn19_translation-vi-project.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d.update({
            'dn19:13.5': '‘Không cần đến bốn vị, chư vị; ước gì ba vị Phật Chánh Đẳng Giác cùng xuất hiện ở đời và thuyết Pháp như Đức Thế Tôn.',
            'dn19:13.6': 'Điều ấy sẽ vì lợi ích và an lạc của số đông, vì lòng thương tưởng thế gian, vì lợi ích và an lạc của chư thiên và loài người.’',
            'dn19:13.7': 'Một số vị thiên khác nói:',
            'dn19:13.8': '‘Không cần đến ba vị, chư vị; ước gì hai vị Phật Chánh Đẳng Giác cùng xuất hiện ở đời và thuyết Pháp như Đức Thế Tôn.',
            'dn19:13.9': 'Điều ấy sẽ vì lợi ích và an lạc của số đông, vì lòng thương tưởng thế gian, vì lợi ích và an lạc của chư thiên và loài người.’',
            'dn19:30.5': 'Người ấy nói với Jotipāla: ‘Chúc ngài Jotipāla an lành. Vua Disampati gọi ngài đến; nhà vua muốn gặp ngài.’',
            'dn19:30.6': '‘Vâng.’ Jotipāla đáp người ấy rồi đi đến vua Disampati và chào hỏi nhà vua.',
            'dn19:35.5': 'Người ấy nói với Đại Điển Tôn: ‘Thưa ngài, vua Reṇu gọi ngài đến.’',
            'dn19:35.6': '‘Vâng.’ Đại Điển Tôn đáp người ấy rồi đi đến vua Reṇu và chào hỏi nhà vua.'
          })
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          json.loads(p.read_text(encoding='utf-8'))
          PY
      - name: Commit patch
        run: |
          git config user.name "Stream Entry"
          git config user.email "978862+streamentry@users.noreply.github.com"
          git add content/translation/vi/project/sutta/dn/dn19_translation-vi-project.json
          git commit -m "fix(dn19): restore exact segment-level alignment"
          git push origin HEAD:translate/digha-nikaya
