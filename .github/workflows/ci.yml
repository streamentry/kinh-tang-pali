name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Astro type check
        run: npm run check
      - name: Production build + Pagefind
        run: npm run build
