name: CI

on:
  pull_request:
  push:
    branches: ['**']

# CI is the gate: the local ECC pre-push no longer runs the Node battery (see AGENTS.md,
# "Push và CI"), so a plain `git push` of a branch without a PR must still be verified here.
# Group by PR number or branch so a re-push supersedes its own older run instead of stacking.
# Never share a group across the two events: a push run must not cancel the PR-context run
# that branch protection is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Sync pinned source
        # The store tests assert against the pinned upstream layers, so CI needs the
        # same snapshot a translator works from rather than skipping those checks.
        run: npm run source:sync:used
      - name: Pinned snapshot manifest is current
        # Fails if the lock moved without the manifest being re-fetched, which would
        # otherwise let the content checks verify against a stale file list.
        run: npm run manifest:check
      - name: Catalogues cover the pinned snapshot
        run: npm run catalog:check
      - name: Unit tests
        run: npm test
      - name: Verify the store by counting
        # Reconciles local files against the pinned git tree by content hash, counts
        # and reconciles every segment, and records the English shortfall by cause.
        # `--allow-partial-cache` because the sync above is deliberately scoped to the
        # texts the project works on; every integrity check still has to pass.
        run: npm run verify:store:partial
      - name: Reference gap record is current
        run: npm run reference:gaps:check
      - name: Licence notice is current
        # Regenerates NOTICE from the lock in memory and compares. Fails if the copyright
        # and provenance text has fallen behind the pinned commit it describes, which is the
        # same class of staleness as a stale manifest but on the legal side.
        run: npm run license:check
      - name: Translation store audit
        run: npm run audit:store
      - name: Reference coverage audit
        # Counts segments whose substantive Pāli carries no English prose and the texts
        # below the coverage floor, then reports each cause (upstream blank vs not synced).
        # Exits 1 only for a structurally broken pinned edition, so this gates file
        # integrity without demanding that the English fill queue already be empty.
        run: npm run audit:reference
      - name: Glossary terminology check
        # Advisory (exit 0): the corpus carries divergences recorded before the glossary
        # existed, so --strict would fail on history. The report still prints every
        # divergent segment, so terminology drift is visible in each run's log.
        run: npm run glossary:check
      - name: Filesystem and cache doctor
        # Detects the APFS ghost-entry class that made a build appear to hang. On a clean
        # CI runner this must pass, which is the point: it is the control that says the
        # local volume's damage is local, not a property of the repository.
        run: npm run doctor:ci
      - name: Astro type check
        run: npm run check
      - name: Production build + Pagefind
        run: npm run build
