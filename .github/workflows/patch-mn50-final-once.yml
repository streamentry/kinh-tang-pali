name: Final MN50 verse patch once
on:
  push:
    branches: [feat/mn45-152-translation]
    paths: [.github/workflows/patch-mn50-final-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn45-152-translation
      - name: Patch exact Pāli line meanings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('content/translation/vi/project/sutta/mn/mn50_translation-vi-project.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['mn50:31.13']='Khi ngươi cứ làm, nghiệp bất thiện càng tích tụ,'
          d['mn50:31.14']='suốt thời gian dài, hỡi Kẻ Chấm Dứt.'
          d['mn50:31.15']='Māra, hãy thôi bám lấy Đức Phật,'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit and self-remove
        shell: bash
        run: |
          rm .github/workflows/patch-mn50-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/translation/vi/project/sutta/mn/mn50_translation-vi-project.json .github/workflows/patch-mn50-final-once.yml
          git commit -m "fix: tighten final MN50 verse to Pali"
          git push origin HEAD:feat/mn45-152-translation
