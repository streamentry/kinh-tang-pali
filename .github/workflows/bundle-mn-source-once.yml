name: Bundle MN source once
on:
  push:
    branches: [feat/mn45-152-translation]
    paths: [.bundle-mn-source-request]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn45-152-translation
      - name: Fetch pinned source repositories
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/suttacentral/bilara-data.git /tmp/bilara
          git -C /tmp/bilara checkout 11c9d708978cde8ba61096d8a75f7ddfb846f639
          git clone --filter=blob:none --no-checkout https://github.com/buddhanussati/loicuaducphat.git /tmp/minhchau
          git -C /tmp/minhchau checkout 9a9fdc135c83be0fd78df5353c55267d6b0ea7fd
      - name: Build compact MN51-152 source bundle
        shell: bash
        run: |
          mkdir -p /tmp/bundle/pali /tmp/bundle/en /tmp/bundle/minhchau
          for n in $(seq 51 152); do
            cp "/tmp/bilara/root/pli/ms/sutta/mn/mn${n}_root-pli-ms.json" "/tmp/bundle/pali/mn${n}.json"
            cp "/tmp/bilara/translation/en/sujato/sutta/mn/mn${n}_translation-en-sujato.json" "/tmp/bundle/en/mn${n}.json"
            cp "/tmp/minhchau/mn/mn${n}.html" "/tmp/bundle/minhchau/mn${n}.html" || true
          done
          printf '%s\n' \
            'bilara_commit=11c9d708978cde8ba61096d8a75f7ddfb846f639' \
            'minhchau_commit=9a9fdc135c83be0fd78df5353c55267d6b0ea7fd' \
            'range=mn51-mn152' > /tmp/bundle/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mn51-152-source-bundle
          path: /tmp/bundle
          compression-level: 9
          retention-days: 1
      - name: Clear request and remove one-shot workflow
        shell: bash
        run: |
          rm -f .bundle-mn-source-request .github/workflows/bundle-mn-source-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove one-shot MN source bundler"
          git push origin HEAD:feat/mn45-152-translation
