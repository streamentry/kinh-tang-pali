name: Translation assemble
on:
  push:
    branches: [feat/mn45-152-translation]
    paths: [.translation-assemble-request]
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn45-152-translation
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run source:sync:mn
      - name: Assemble requested canonical translations
        shell: bash
        run: |
          while IFS= read -r uid; do
            [ -z "$uid" ] && continue
            npx tsx scripts/assemble-translation.ts "$uid"
          done < .translation-assemble-request
      - run: npm run validate
      - name: Commit canonical translations and clear request
        shell: bash
        run: |
          rm .translation-assemble-request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/translation/vi/project/sutta/mn .translation-assemble-request
          git commit -m "translate: assemble requested MN canonical translations"
          git push origin HEAD:feat/mn45-152-translation
