name: Translation memory scaffold
on:
  push:
    branches: [feat/mn45-152-translation]
    paths: [.translation-memory-request]
permissions:
  contents: write
jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn45-152-translation
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Sync pinned Majjhima source
        run: npm run source:sync:mn
      - name: Build conservative translation-memory scaffolds
        shell: bash
        run: |
          while IFS= read -r uid; do
            [ -z "$uid" ] && continue
            npx tsx scripts/translation-memory.ts "$uid"
          done < .translation-memory-request
      - name: Commit scaffold and clear request
        shell: bash
        run: |
          rm .translation-memory-request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging .translation-memory-request
          git commit -m "chore: build conservative translation memory scaffold"
          git push origin HEAD:feat/mn45-152-translation
