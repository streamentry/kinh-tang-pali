name: Merge Digha translation parts

on:
  push:
    branches: [translation/dn-complete]
    paths:
      - 'work/dn-parts/.merge-trigger'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: translation/dn-complete
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Merge translation parts
        run: node scripts/merge-dn-parts.mjs
      - name: Commit canonical translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/translation/vi/project/sutta/dn
          git diff --cached --quiet && exit 0
          git commit -m "chore: merge Digha translation parts"
          git push origin HEAD:translation/dn-complete
