name: Assemble MN40 once

on:
  push:
    branches:
      - feat/mn1-50-translation-draft

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn1-50-translation-draft
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Assemble and verify MN40 against pinned Pāli
        run: npx tsx scripts/assemble-staged-translation.ts mn40 --clean
      - name: Commit canonical MN40 and remove this one-shot workflow
        run: |
          rm .github/workflows/assemble-mn40-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/translation/vi/project/sutta/mn/mn40_translation-vi-project.json staging/mn40 .github/workflows/assemble-mn40-once.yml
          git commit -m "translation: assemble exact-key MN40 corpus"
          git push origin HEAD:feat/mn1-50-translation-draft
