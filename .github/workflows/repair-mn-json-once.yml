name: Repair MN JSON once
on:
  push:
    branches: [feat/mn45-152-translation]
    paths: [.github/workflows/repair-mn-json-once.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn45-152-translation
      - name: Escape raw newlines inside JSON strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('content/translation/vi/project/sutta/mn')
          changed = []
          for p in sorted(root.glob('mn*_translation-vi-project.json')):
              s = p.read_text(encoding='utf-8')
              try:
                  json.loads(s)
                  continue
              except json.JSONDecodeError:
                  pass
              out = []
              in_string = False
              escape = False
              for ch in s:
                  if in_string:
                      if escape:
                          out.append(ch); escape = False; continue
                      if ch == '\\':
                          out.append(ch); escape = True; continue
                      if ch == '"':
                          out.append(ch); in_string = False; continue
                      if ch == '\n':
                          out.append('\\n'); continue
                      if ch == '\r':
                          continue
                      out.append(ch)
                  else:
                      out.append(ch)
                      if ch == '"': in_string = True
              fixed = ''.join(out)
              json.loads(fixed)
              p.write_text(fixed, encoding='utf-8')
              changed.append(str(p))
          print('Repaired:', *changed, sep='\n')
          PY
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/repair-mn-json-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/translation/vi/project/sutta/mn .github/workflows/repair-mn-json-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: normalize MN translation JSON"
          git push origin HEAD:feat/mn45-152-translation
