name: Apply MN56 package once
on:
  push:
    branches: [feat/mn45-152-translation]
    paths: [.mn56-apply]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn45-152-translation
      - name: Reconstruct verified package
        shell: bash
        run: |
          cat .mn56-payload-00.b64 .mn56-payload-01.b64 .mn56-payload-02.b64 .mn56-payload-03.b64 > /tmp/mn56.b64
          base64 -d /tmp/mn56.b64 > /tmp/mn56.tar.gz
          echo '5fcc1297e65f7432070f3746382510e1b892d7741e15373c4a4f490ff33bad94  /tmp/mn56.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mn56.tar.gz -C .
      - name: Validate canonical package
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const f = 'content/translation/vi/project/sutta/mn/mn56_translation-vi-project.json';
          const d = JSON.parse(fs.readFileSync(f, 'utf8'));
          const keys = Object.keys(d);
          if (keys.length !== 382) throw new Error(`expected 382 segments, got ${keys.length}`);
          if (keys.some(k => !k.startsWith('mn56:'))) throw new Error('non-MN56 key found');
          if (Object.values(d).some(v => typeof v !== 'string' || !v.trim())) throw new Error('empty segment found');
          console.log(`MN56 canonical package valid: ${keys.length}/382 segments`);
          NODE
      - name: Commit and self-remove
        shell: bash
        run: |
          rm -f .mn56-payload-00.b64 .mn56-payload-01.b64 .mn56-payload-02.b64 .mn56-payload-03.b64 .mn56-apply staging/mn56/.ready
          rm -f .github/workflows/apply-mn56-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add complete MN56 translation package'
          git push origin HEAD:feat/mn45-152-translation
