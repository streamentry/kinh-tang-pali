name: Patch MN36 once

on:
  push:
    branches:
      - feat/mn1-50-translation-draft

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/mn1-50-translation-draft
          fetch-depth: 0
      - name: Correct MN36 segment 5.5
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'content/translation/vi/project/sutta/mn/mn36_translation-vi-project.json';
          const data = JSON.parse(readFileSync(file, 'utf8'));
          data['mn36:5.5'] = 'Họ không nhận thức ăn từ miệng nồi hay miệng giỏ; không nhận đồ ăn được đưa qua ngưỡng cửa, qua cây gậy hay qua chày; không nhận từ hai người đang ăn, phụ nữ có thai, phụ nữ đang cho con bú, phụ nữ đang ở cùng đàn ông, nơi góp chung thức ăn, nơi có chó đứng chờ hay ruồi bu quanh; không ăn cá hay thịt; không uống rượu, đồ uống lên men hay cháo chua từ nước cám.';
          writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`, 'utf8');
          NODE
      - name: Commit and remove one-shot patch
        run: |
          rm .github/workflows/patch-mn36-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/translation/vi/project/sutta/mn/mn36_translation-vi-project.json .github/workflows/patch-mn36-once.yml
          git commit -m 'fix: correct MN36 ascetic food restrictions'
          git push origin HEAD:feat/mn1-50-translation-draft
